answer: |-
  This is a sharp formulation. You've effectively reinvented a specific strain of **robustness analysis** (à la Levins and Wimsatt) but elevated it from a heuristic for confidence to a demarcation criterion for scientific merit. That elevation is where the vulnerability lies.

  You asked for what would count against this, specifically from the perspective of someone who already accepts instrumentalism and knows the standard critiques. I will skip the "assumptions matter for explanation" lecture. Instead, I will focus on how your Swap Test interacts with *sensitivity*, *underdetermination*, and *essential idealizations*.

  Here are the defeaters, ranked from fatal to awkward.

  ### 1. The Fatal Defeater: The Test Punishes Sensitivity to Truth
  **Rank:** Fatal
  **The Case:** Newtonian Gravity vs. General Relativity (or any successful structural model).

  Your criterion states: *If the prediction doesn't survive the swap, I treat the model's track record as basically an accident.*

  This inverts the logic of scientific progress. If a model is successful *because* its assumptions are approximately capturing the causal structure of the world, then swapping those assumptions for incompatible falsehoods **should break the prediction.**

  Consider Newtonian gravity. Assumption: Mass exerts an instantaneous attractive force proportional to $1/r^2$. This is strictly false (GR is the better account).
  **The Swap:** Assume mass exerts a repulsive force, but space is filled with a fluid pushing objects together (Le Sage's gravity). This is also false, and incompatible with Newton.
  **The Result:** In many standard contexts (planetary orbits), Le Sage's gravity can be tuned to match Newton's predictions. But in others (e.g., drag effects, heating of bodies), it diverges.
  **Your Verdict:** Because the prediction *doesn't* survive the swap in all domains (or requires tuning to do so), you discount Newton's track record as "accidental."

  But Newton's track record wasn't accidental. It was successful *because* the $1/r^2$ assumption was latching onto something real about the structure of spacetime (even if incomplete). The fact that the prediction *fails* when you swap in Le Sage's fluid is evidence that the Newtonian assumption was doing work.

  **Why this bites:** Your test rewards **equifinality** (many roads lead to Rome) and punishes **sensitivity** (only this road leads to Rome). But in science, sensitivity is often a virtue. If a model only works under a specific set of assumptions, that suggests those assumptions are tracking constraints in the target system. By demanding that the prediction survive incompatible falsehoods, you are demanding that the data be *insensitive* to the mechanism. You are effectively saying: "A model is only good if the phenomenon it predicts doesn't actually depend on the mechanism it proposes."

  ### 2. The Serious Defeater: The "Black Box" Problem (Underdetermination)
  **Rank:** Serious
  **The Case:** Phenomenological models in macroeconomics or climate science.

  You want the Swap Test to prove that the falsehood is "scaffolding, not a load-bearing wall." But passing the test often just proves that your **aggregate data is too coarse** to distinguish between the mechanisms.

  **The Scenario:** You have a model of market crashes.
  *   **Model A:** Agents are rational expected-utility maximizers with heterogeneous priors.
  *   **Model B:** Agents are zero-intelligence noise traders with a contagion rule.
  *   **Outcome:** Both produce fat-tailed return distributions (the prediction).

  **Your Verdict:** The model passes the Swap Test. The specific psychology is scaffolding; the fat tails are robust.
  **The Problem:** This doesn't mean the model is "good science" in the sense of guiding intervention. If I want to *stop* crashes, the policy prescription for Model A (increase transparency to fix priors) is the opposite of Model B (circuit breakers to stop contagion).

  If a model passes the Swap Test, it implies the prediction is **underdetermined** by the micro-assumptions. While this makes the prediction robust, it makes the model **useless for control or explanation**. It tells you *that* something will happen, but gives you no leverage on *why*, because the "why" changes with every swap.

  **Defenders' Concession:** Even Richard Levins, the high priest of robustness analysis, conceded that robustness alone is not enough. In *The Truth in Lies*, he argues robustness increases *confidence* in the result, but it does not validate the model for **manipulation**. If you defend the view as purely predictive, this is fine. If you claim it identifies "useful" models in a broader scientific sense, this is a major failure. The models that pass your test are often the ones least capable of supporting counterfactuals.

  ### 3. The Scope Defeater: Essential Idealizations
  **Rank:** Awkward (Scoping Note)
  **The Case:** The Thermodynamic Limit / Continuum Assumptions.

  You asked specifically about this. In statistical mechanics, phase transitions (like water boiling) strictly only occur in the **thermodynamic limit** ($N \to \infty$, $V \to \infty$, $N/V$ constant). For any finite $N$, the partition function is analytic; there is no singularity, hence no phase transition.

  **The Swap:** You cannot swap "$N = \infty$" for "$N = 10^{23}$" without losing the mathematical property that defines the phenomenon (the singularity). You cannot swap "continuum fluid" for "discrete molecules" in the Navier-Stokes equations without the equations ceasing to be PDEs and becoming something else entirely.

  **Your Verdict:** The prediction (boiling) does *not* survive the swap (because the math breaks). Therefore, the model is "accidental."
  **Reality:** This is the best science we have. The idealization isn't scaffolding; it is the **lens** through which the phenomenon becomes visible.

  **Is this decisive?** It's not fatal if you admit your view is a methodology for *special sciences* (economics, biology) where multiple realizability is common, but not for *fundamental physics* where idealizations are often constitutive. However, since you cited frictionless planes (physics) as your paradigm, this creates a tension. If your test misclassifies the thermodynamic limit as "bad science," you have to concede your test is not universal. It filters out the very models that explain *why* the scaffolding works (via renormalization group flows, etc.).

  ### 4. The Methodological Defeater: The "Bad Swap" Escape Hatch
  **Rank:** Methodological Worry
  **The Question:** Is the test well-defined, or is it insulated by escape hatches?

  You worried: *When a swap "fails," I can always say you swapped in the wrong alternative... Is that worse than the move on the other side, where every failed prediction gets re-described as falling outside the model's domain?*

  **Analysis:** It is worse.
  *   **Domain Restriction:** "The model failed at high velocities." This is an empirical claim. It can be tested. It shrinks the model's turf, which is a cost to the theorist.
  *   **Bad Swap:** "Your alternative assumption wasn't in the same family." This is a methodological claim. It polices the *critic*, not the model.

  **Why it's insidious:** To run your test, I need to know what counts as a "valid swap."
  *   If I swap "rational agents" with "random agents," you say: "That's not a comparable economic model."
  *   If I swap "rational agents" with "bounded rationality," you say: "That's too similar, it's not a strong enough swap."
  *   If I swap "rational agents" with "imitative rules," you say: "That changes the aggregate dynamics too much."

  You have created a **Goldilocks Zone** for swaps. The swap must be *incompatible enough* to prove robustness, but *similar enough* to preserve the prediction. Who defines that zone? The defender of the model. This makes the Swap Test unfalsifiable in practice. It becomes a rhetorical move: "My model passes the swap test (because I choose the swaps that work)."

  **Comparison:** The "domain restriction" dodge admits failure in a specific region. The "bad swap" dodge denies the test was ever run. The latter is more corrosive to scientific discourse because it prevents the community from agreeing on when a test has been performed.

  ### Summary of Defeaters

  | Rank | Defeater | Why it hurts |
  | :--- | :--- | :--- |
  | **1** | **Sensitivity to Truth** | Good models *should* fail the swap if their assumptions are approximately true. Your test rewards underdetermination. |
  | **2** | **The Black Box** | Passing the test implies the mechanism doesn't matter, which kills policy/intervention utility. |
  | **3** | **Escape Hatches** | Defining a "valid swap" is subjective. Allows defenders to rig the test. |
  | **4** | **Essential Idealizations** | Misclassifies fundamental physics models where the idealization is constitutive. |

  ### The Honest Answer on Unfalsifiability

  You asked if the view has been qualified into something unfalsifiable.

  **Yes, but with a caveat.**
  It is unfalsifiable as a **demarcation criterion** (Good Science vs. Bad Science) because the "valid swap" condition is too malleable. A defender can always claim a failed swap was "unfair."

  However, it is **not** unfalsifiable as a **heuristic**. If you downgrade your claim from "This defines good science" to "This is a useful check against overfitting," it survives.
  *   **As a Demarcation Criterion:** It fails because it penalizes structural sensitivity (Fatal Defeater #1).
  *   **As a Heuristic:** It works. It helps identify when a result is an artifact of a specific mathematical trick versus a robust feature of the system.

  **The Verdict:**
  Your worry that "nothing ever fails the test" is correct if you allow the modeler to define the set of admissible swaps. To fix this, you would need an external criterion for what counts as a "rival assumption." But if you impose that external criterion (e.g., "must be empirically plausible"), you are smuggling realism back in through the back door.

  **Most Persuasive Takeaway:**
  The Swap Test confuses **robustness of inference** with **validity of the model**.
  *   **Levins/Wimsatt:** "If many models give this result, we can be confident the result is true." (Robustness of Inference)
  *   **Your View:** "If many models give this result, the specific model is good." (Validity of Model)

  These are not the same. I can have high confidence in a result (it will rain) while knowing all the specific models predicting it are flawed (they all get the pressure systems wrong). Your test validates the model based on the robustness of the result. That is the category error.

  **Recommendation:** Keep the Swap Test as a tool for **confidence in predictions**, but abandon it as a tool for **evaluating the model itself**. A model that fails the swap test might be the *only* one that correctly identifies the causal lever, even if its predictions are fragile. That fragility is a feature, not a bug, when you're trying to understand how the world works rather than just betting on the outcome.
