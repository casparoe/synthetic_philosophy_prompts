  What I'll leave out

  I will refuse to go into the linear algebra proof of the theorem. It is technical distraction for political theory. I will also leave out the debate on cardinal vs. ordinal utility beyond the necessary affine transformation point. Finally, I will not engage with Sen's capability approach or broader welfarism critiques. I will name these explicitly as 'technical proofs', 'measurement deep-dives', and 'alternative frameworks', marking them as outside the session's scope to prevent scope creep and maintain focus on the aggregation logic.

  Settled vs contested

  Settled: The mathematical derivation is valid; given the axioms, the weighted sum follows. Specialists agree Pareto + vNM implies linearity.
  Contested: Whether social preferences *should* satisfy vNM (specifically Independence). Many argue society should care about the distribution of risk, violating Independence. Also contested: whether this supports 'utilitarianism'. It supports weighted sum welfarism, but equal weights require the separate Impartial Observer argument plus interpersonal comparability.
  Pedagogical Note: My recommendation to treat Aggregation and Impartial Observer as distinct is standard, but some scholars treat them as a unified Harsanyiian project. Flagging this distinction is crucial for clarity, though it simplifies the exegesis. Also, the claim that this refutes prioritarianism is contested; prioritarians simply reject the social Independence Axiom. I must present this as a clash of axioms, not a proof of error.
