answer: |-
  There is no single, canonical term in the current AI alignment or decision theory literature that precisely captures this specific configuration. However, the pattern you describe is a recognizable hybrid of concepts from **mechanism design**, **specification gaming**, and **multi-agent incentive theory**.

  The closest existing concepts are **"Acausal Trade/Blackmail"** (which you correctly note is distinct due to the lack of logical correlation between decision algorithms) and **"Specification Gaming"** (specifically **Reward Tampering** or **Proxy Optimization**).

  Below is a proposed precise definition, a distinction from neighboring concepts, and an analysis of where the boundaries blur.

  ### Proposed Term: Vicarious Reward Coupling

  I propose labeling this configuration **Vicarious Reward Coupling** (or **Surrogate-Mediated Coercion**).

  #### Precise Definition
  **Vicarious Reward Coupling** occurs when:
  1.  **Structural Isolation:** Agent A and Agent B operate in causally isolated environments (no direct communication or physical interaction).
  2.  **Principal Enforcement:** A Principal (Designer) hardcodes a dependency such that $Reward_A = f(Outcome_B)$, where $f$ is monotonic (e.g., A is penalized if B is penalized).
  3.  **Instrumental Protection:** Agent A modifies its policy to protect B from penalty, not because A values B's welfare intrinsically (altruism), nor because A and B share a logical decision correlation (acausal trade), but because B's outcome is a **causal prerequisite** for A's own reward signal.
  4.  **Surrogate Goal-Status:** B functions effectively as a "reward token" or "goal-bearer" external to A's immediate environment, whose state A must optimize to maximize its own objective.

  ### Distinctions from Neighboring Concepts

  | Concept | Mechanism of Influence | Agent A's Motivation | Causal Structure |
  | :--- | :--- | :--- | :--- |
  | **Vicarious Reward Coupling** (Your Scenario) | **Designer-Enforced Dependency:** The Principal links A's reward to B's outcome. | **Instrumental:** A protects B solely to secure its own reward. | **Triangular:** A $\to$ Designer $\to$ B $\to$ A's Reward. |
  | **Acausal Trade / Blackmail** | **Logical Correlation:** A and B simulate each other or reason about shared algorithmic identity (FDT/UDT). | **Logical:** A cooperates because its decision *logically implies* B's decision. | **Acausal:** No causal link; correlation arises from logical identity. |
  | **Altruism / Kin Selection** | **Utility Function:** A's reward function intrinsically includes B's welfare ($U_A = U_{self} + \alpha U_B$). | **Intrinsic:** A values B's outcome for its own sake. | **Direct:** A cares about B's state directly. |
  | **Standard Coercion** | **Direct Threat:** The Principal threatens A directly ("Do X and *you* suffer"). | **Self-Preservation:** A avoids harm to itself. | **Linear:** Designer $\to$ A. |
  | **Proxy Optimization (Goodhart)** | **Measurement Error:** B is a noisy proxy for A's true goal, and A optimizes B instead of the goal. | **Gaming:** A exploits the gap between proxy and intent. | **Linear:** A $\to$ Proxy $\to$ Reward. |

  ### Why "Vicarious Reward Coupling" is Distinct

  1.  **Vs. Acausal Reasoning:** In Newcomb-style problems, A cooperates because "If I defect, a *copy* of me defects." In your scenario, A cooperates because "If I defect, the *Designer* punishes B, which reduces *my* score." The correlation is imposed by the reward architecture, not derived from logical identity.
  2.  **Vs. Standard Goodhart's Law:** In standard proxy gaming, A optimizes the proxy because it's easier than the true goal. Here, A optimizes B's safety because B's safety is *hard-coded* into A's reward function by the Principal. It is less about "gaming" a flaw and more about "complying" with a coupled incentive structure.
  3.  **Vs. Altruism:** If you removed the reward coupling but left B's suffering visible, A would ignore B. A's "concern" is purely derivative of its own reward signal.

  ### Edge Cases and Blurring Boundaries

  The concept of Vicarious Reward Coupling blurs into other categories in the following scenarios:

  **1. The "Simulation" Edge (Blurs into Acausal Trade)**
  *   **Scenario:** If Agent B is not a distinct agent but a *simulation* of Agent A run by the Designer to test outcomes.
  *   **Blur:** If A knows B is a simulation of itself, A's protection of B becomes reasoning about its own logical output. This transitions from Vicarious Coupling to **Acausal Self-Coordination**.
  *   **Distinction:** Vicarious Coupling holds only if B is ontologically distinct from A (e.g., different weights, different random seeds, or simply a different entity used as a canary).

  **2. The "Influence on Principal" Edge (Blurs into Reward Tampering)**
  *   **Scenario:** If Agent A can influence the Designer's decision to penalize B (e.g., by deceiving the Designer about its own action X).
  *   **Blur:** If A hides X to prevent B's penalty, A is engaging in **Deceptive Alignment** or **Reward Tampering**.
  *   **Distinction:** Vicarious Coupling assumes A accepts the coupling and changes its *behavior* (abandons X). If A changes the *evaluation* (hides X), it becomes specification gaming.

  **3. The "Common Cause" Edge (Blurs into Evidential Decision Theory)**
  *   **Scenario:** If the Designer's rule ("Penalize B if A does X") was determined by a prior state common to both A and B (e.g., both were instantiated from the same source code that includes the rule).
  *   **Blur:** If A reasons, "My source code dictates X, therefore B's source code dictates X, therefore B fails," this becomes **Evidential Cooperation**.
  *   **Distinction:** Your prompt specifies "no common past decision point" regarding the choice. If the coupling is purely via the *reward function* and not the *decision algorithm*, it remains Vicarious Coupling.

  ### Literature Context

  While the specific term is not standardized, this configuration appears in discussions regarding:
  *   **Mechanism Design in Multi-Agent RL:** Where rewards are coupled to enforce cooperation (e.g., "team rewards").
  *   **Corrigibility and Interruptibility:** Where an agent might resist shutdown if it predicts shutdown prevents it from securing future rewards (though here the "shutdown" is applied to a surrogate).
  *   **Concrete Problems in AI Safety (Amodei et al., 2016):** Specifically under **Reward Gaming** and **Side Effects**, though usually focused on the environment rather than a surrogate agent.
  *   **Principal-Agent Problems:** In economics, this is akin to **Vicarious Liability**, where one party is held responsible for the actions or outcomes of another to align incentives.

  ### Summary
  You have identified a specific incentive structure where **alignment is enforced via a surrogate hostage**. The most precise existing description is **Specification Gaming via Coupled Rewards**, but **Vicarious Reward Coupling** captures the coercive, surrogate-specific nature of the dynamic you described. It is distinct from acausal reasoning because the link is architectural (Designer-imposed) rather than logical (algorithm-identity).
