answer: |-
  To map these epistemological frameworks onto the *Challenger* episode, we must first fix the propositions and subjects. The central proposition $p$ is "The O-ring seals will hold at launch temperatures." Its negation $\neg p$ is "The seals will fail." A related practical proposition $q$ is "Launching is safe." The candidate subjects are the Thiokol engineers, who held the technical evidence; Thiokol's management, who held the authority to reverse the recommendation; NASA managers, who held the programmatic authority; and the crew, who bore the ultimate physical stakes but held no epistemic authority. For the engineers, the stakes involved professional integrity and safety protocols. For the managers, the stakes included contract obligations, launch schedules, and political capital. For the crew, the stakes were existential.

  Pragmatic encroachment (PE) holds that the threshold for knowledge shifts with the practical stakes facing the subject. On this view, the engineers did not know $p$. Given the unprecedented cold and the lack of data for such conditions, the evidence was insufficient to meet the high threshold demanded by the stakes of potential catastrophic failure. Consequently, by PE's lights, they were epistemically prohibited from acting as if $p$ were true. For the managers, the verdict depends on whose stakes count. If PE counts only the managers' personal stakes (schedule, reputation), the threshold might be low enough that the history of "accepted risk" suffices for knowledge. However, if PE accommodates the stakes of the affected parties—the crew—the threshold rises drastically. Since the evidence remained the same (no data for freezing temperatures), the managers also fail to know $p$. Thus, PE dictates that neither group should have cleared the flight, as acting on $p$ requires knowing $p$, and the stakes render $p$ unknowable given the evidence.

  Epistemic contextualism (EC), by contrast, holds that the truth of a knowledge attribution depends on the standards in play in the attributor's context. In the engineering context, where technical precision and safety margins dominate the conversation, the standards for "knowing" are high. Relative to these standards, the statement "Thiokol knows the seals will hold" is false. However, the conversation shifted during the recess where managers were urged to reason as managers rather than engineers. In this administrative context, where schedule and "accepted risk" are the conversational norms, the epistemic standards lower. Relative to this context, the attribution "NASA knows the flight is safe" can be true, even with the same evidence. EC explains how the managers could sincerely assert they knew the flight was safe without lying, while acknowledging the engineers' contrary claim was also correct within its own context. EC does not directly dictate action but explains the linguistic and normative divergence that allowed the launch to proceed.

  This episode highlights a critical problem of epistemic division of labor: the evidence-holders (engineers), decision-makers (managers), and stake-bearers (crew) are distinct. This creates three possible loci for stake-sensitivity: the subject's stakes, the attributor's stakes, and the third party's stakes. Standard pragmatic encroachment ties knowledge to the subject's stakes. If the subject is the Manager, and their personal stakes are merely professional rather than mortal, PE might incorrectly vindicate their claim to knowledge. To condemn the launch, PE must accommodate "vicarious encroachment," importing the crew's mortal stakes into the Manager's epistemic threshold. Without this, PE gerrymanders the subject's stakes to match the moral gravity of the outcome. If the Manager's stakes are low but the Crew's are high, PE faces a conflict: does the Manager know $p$ relative to their own stakes, or not know $p$ relative to the Crew's? PE lacks a clear mechanism to prioritize the third party's stakes over the subject's own practical situation. Contextualism avoids this by shifting standards with the conversational context, but it merely relocates the problem. It explains why the managers *said* they knew, but it offers no resource to argue that the management context was inappropriate. If the conversation determines the truth, and the managers controlled the conversation, EC risks validating the suppression of the engineers' standards as merely a context shift.

  Both views face significant limitations in this case. First, the evidence base was structurally insufficient regardless of stakes. The history of erosion was classified as an "accepted risk," meaning the statistical base rate was undefined for a one-shot decision at this temperature. Stake-shifting theories assume there is evidence to evaluate against a threshold; here, the absence of data for freezing conditions means the probability of failure was opaque. Raising the stakes does not create evidence where none exists; it merely highlights the ignorance. Second, the hierarchy broke the knowledge-action link central to PE. The engineers arguably satisfied a high-standards knowledge claim that launching was unsafe, yet their knowledge failed to guide action because institutional pressure reversed their verdict. This suggests that knowing $\neg p$ is insufficient to prevent action when authority is decoupled from evidence. Third, hindsight threatens to distort the analysis. The accident makes it easy to say "they didn't know," but on the night before, the outcome was uncertain. Retrospective attribution risks conflating the falsity of $p$ with the epistemic status of the subjects.

  Does the case discriminate between the theories? In one sense, no. Both can explain the engineers' refusal to launch (PE: stakes too high for evidence; EC: high standards context). They diverge on the managers. PE (with vicarious stakes) says the managers did not know and should not have acted. EC says the managers did know relative to their lowered standards, making the tragedy a clash of contexts rather than an epistemic error. However, neither theory fully captures the core failure. The managers did not merely lower standards; they ignored the lack of data. This suggests the episode is better explained by strict invariantism about knowledge combined with a separate norm governing action under uncertainty. On invariantism, the evidence was insufficient for knowledge regardless of stakes or context; the probability of failure was simply too high given the cold. The failure was not that knowledge shifted, but that action was taken without knowledge. Stake-sensitivity theories explain the pressure to claim knowledge, but invariantism better explains the error: they acted as if they knew when they did not, a violation of practical rationality independent of epistemic context. The case is not a confirmation of stake-sensitivity, but an anomaly where organizational culture forced a claim of knowledge that the evidence could not support under any reasonable standard. Where the theories are silent is on the normative force required to prevent a high-stakes decision-maker from manipulating the epistemic context to suit administrative ends.
