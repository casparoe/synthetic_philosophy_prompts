      *   *Condition:* Jan 27-28, 1986. Coldest ever. Near freezing. Overnight freeze.
      *   *Conflict:* Thiokol engineers recommended *no launch* (no data for this temp, loss of resiliency). NASA officials pressed Thiokol management.
      *   *Decision:* Management reversed engineers during recess ("think like managers"). Flight cleared.
      *   *Outcome:* Breakup at 73s. 7 crew died. Commission blamed seals + NASA culture/decision-making. Grounded 2+ years.

  3.  **Drafting - Section by Section:**

      *   **Section 1: Setup and Verdicts.**
          *   *Propositions:* $p$ = "The O-rings will hold/seal effectively"; $\neg p$ = "The O-rings will fail"; $q$ = "Launching is safe."
          *   *Subjects:* Engineers (high evidence, low authority), Thiokol Managers (low evidence, high authority), NASA Managers (high authority, high pressure), Crew (highest stakes, no voice).
          *   *Stakes:* Engineers (professional integrity/safety), Managers (contract/schedule/politics), Crew (life/death).
          *   *Pragmatic Encroachment (PE):* Knowledge depends on subject's stakes. For Engineers, stakes are high (safety), so threshold for knowing $p$ is high. They don't know $p$. For NASA Managers, if we take *their* stakes (schedule), threshold might be lower, but PE usually ties knowledge to the *subject's* practical situation. If the subject is the Manager deciding, their stakes include the risk. If they ignore the risk, do they know? PE suggests if stakes are high (death), you need more evidence to know it's safe. They lacked evidence for cold. So they didn't know it was safe.
          *   *Contextualism (EC):* Truth of "S knows p" depends on attributor's context. In the engineering room, standards are high (technical safety). In the NASA management briefing, standards might be lowered (administrative go-ahead). If NASA says "We know it's safe," EC says this might be true *in their context* of low standards, but false in the engineers' context of high standards.
          *   *Action:* PE says act on knowledge. If you don't know it's safe, don't launch. EC says the assertion "We know" is context-dependent, but doesn't directly dictate action as strongly as PE.

      *   **Section 2: Epistemic Division of Labor (Loci of Stakes).**
          *   *Problem:* Evidence holders $\neq$ Decision holders $\neq$ Stake holders.
          *   *Loci:* 1. Subject (Manager deciding). 2. Attributor (Who says "You know"?). 3. Third Party (Crew).
          *   *PE:* Standard PE ties stakes to the *subject*. If the subject is the Manager, do *their* stakes count (schedule) or the *Crew's* stakes (life)? If PE only counts the subject's personal stakes, it allows Managers to claim knowledge because *their* jobs aren't on the line physically. This is a gerrymander. To work, PE needs "vicarious encroachment" (Crew's stakes raise the Manager's threshold).
          *   *EC:* Shifts with conversational context. The conversation shifted from Engineering (high standards) to Management (low standards). EC explains the linguistic shift but doesn't solve the moral/epistemic failure. It relocates the problem to "which context is appropriate?"
          *   *Conflict:* Crew stakes (infinite) vs. NASA stakes (finite/political). PE struggles if it doesn't import third-party stakes. EC struggles if the context is manipulated (as it was: "think like managers").

      *   **Section 3: Critique/Limitations.**
          *   *Evidence Base:* Erosion history was "accepted risk." No data for *this* cold. Stakes-shifting needs evidence to operate on. If evidence is null, raising stakes just confirms ignorance, but doesn't explain why they thought they knew.
          *   *Hierarchy/Action:* Engineers "knew" (by high standards) but were overruled. Knowledge didn't guide action. This breaks the Knowledge-Action norm central to PE.
          *   *Hindsight:* We know they failed. Retrospectively, "They didn't know" is easy. The theories must account for the *night before*, not the breakup.

      *   **Section 4: Discrimination and Conclusion.**
          *   *Discrimination:* Do they differ? PE says Managers *didn't know* (stakes too high for evidence). EC says "Managers knew" is true in management context, false in engineering context.
          *   *Verdict:* PE captures the normative failure better (you shouldn't act without knowledge). EC captures the sociological shift (standards changed).
          *   *Bottom Line:* Is it confirmation of stake-sensitivity? Or Invariantism + Separate Norm?
          *   *My Judgment:* The case looks like Invariantism (evidence didn't support safety regardless of stakes) + a failure of practical rationality. Stake-sensitivity explains the *pressure*, but Invariantism explains the *error*. The "accepted risk" history suggests they thought they knew based on past data. PE says stakes raise the bar so past data isn't enough. Invariantism says the probability was just too low regardless of stakes.
          *   *Decision:* Lean towards Invariantism + Action Norm. The epistemic state didn't change, the willingness to act did.

  4.  **Refining and Polishing (Word Count and Flow):**
      *   Need to ensure continuous prose.
      *   Check constraints: No citations, no invented facts.
      *   Ensure the "vicarious encroachment" point is clear.
      *   Make sure the distinction between PE and EC is sharp in the final evaluation.
      *   *Self-Correction on PE:* PE usually says knowledge depends on the *subject's* stakes. If the Manager is the subject, do the Crew's stakes count as the Manager's? If not, PE fails to condemn the launch unless we argue the Manager's stakes (liability/reputation) were high. But the prompt asks to explore "vicarious encroachment." I need to explicitly discuss whether PE can handle third-party stakes.
      *   *Self-Correction on EC:* EC is about the *attributor*. When NASA said "It's safe," were they attributing knowledge to themselves? Yes. In their context, standards were low. EC explains how they could sincerely say it.
      *   *Word Count Check:* Aiming for ~1000 words. Need to be concise but dense.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Define propositions ($p$: seals hold). Subjects: Engineers, Managers, Crew.
      *   *PE View:* Stakes raise threshold. Engineers: High stakes (safety), don't know $p$. Managers: If stakes include crew life, don't know $p$. If stakes are just schedule, might know $p$.
      *   *EC View:* Context sets standard. Engineering context = high standard (no knowledge). Management context = low standard (knowledge attributed).
      *   *Division of Labor:* The gap between evidence (engineers) and decision (managers). PE needs vicarious stakes to work. If Managers don't bear the death stakes, PE lets them off the hook unless we force the stakes onto them. EC says the conversation changed context.
      *   *Critique:* Evidence was thin either way. Hierarchy broke the knowledge-action link. Hindsight bias.
      *   *Conclusion:* PE and EC converge on "Engineers didn't know." They diverge on Managers. PE says Managers didn't know (if stakes are high enough). EC says Managers knew (in their context). Best fit: Invariantism. The evidence was insufficient regardless of stakes. The failure was practical, not epistemic.

  6.  **Final Review against Constraints:**
