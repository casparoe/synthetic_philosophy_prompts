answer: |-
  # Decision Tree: Resolving the Paradox of Tolerance

  **Instructions:** Begin at Node 1. Answer the question honestly based on your pre-theoretical commitments. Follow the arrow to the next Node or to a Leaf. Read the Leaf description to find your position's name, its verdict on the required cases, and its most awkward commitment.

  ### **Node 1: The Object**
  **Is the primary object of toleration *private beliefs and associations* or *public conduct and political rules*?**
  *   **Private Beliefs/Associations** → **Leaf A**
  *   **Public Conduct/Rules** → **Node 2**

  ### **Node 2: The Grounds**
  **Is the justification for toleration primarily *prudential (avoiding conflict)* or *moral/epistemic (respect/fallibility)*?**
  *   **Prudential** → **Leaf B**
  *   **Moral/Epistemic** → **Node 3**

  ### **Node 3: The Commitment**
  **Is the community's fundamental commitment to a *set of institutional practices* or to an *abstract moral value*?**
  *   **Institutional Practices** → **Leaf C**
  *   **Abstract Moral Value** → **Node 4**

  ### **Node 4: Reciprocity**
  **Is the obligation to tolerate *conditional on the tolerated party's reciprocal restraint*?**
  *   **Yes (Conditional)** → **Leaf D**
  *   **No (Unconditional)** → **Node 5**

  ### **Node 5: Limit Type**
  **Is the limit on intolerance defined by the *doctrine itself* or by the *material threat posed*?**
  *   **Doctrine (Categorical)** → **Leaf E**
  *   **Threat (Threshold)** → **Node 6**

  ### **Node 6: Timing**
  **May restrictions be applied *before harm is manifest* or only *after intolerant acts occur*?**
  *   **Before (Preventive)** → **Node 7**
  *   **After (Reactive)** → **Leaf F**

  ### **Node 7: Identification**
  **Is the determination of intolerance made by a *designated authority* or through *decentralized social contestation*?**
  *   **Designated Authority** → **Node 8**
  *   **Decentralized Contestation** → **Leaf G**

  ### **Node 8: Meta-Tolerance**
  **Must the community tolerate *advocacy for changing the criteria of intolerance*?**
  *   **Yes (Open to Revision)** → **Leaf H**
  *   **No (Fixed Criterion)** → **Leaf I**

  ---

  ## **The Leaves**

  ### **Leaf A: Conceptual Equivocation**
  *   **Verdict:** The puzzle is an equivocation between legal non-interference and forbearance toward what one disapproves of; private intolerance is not a political problem.
  *   **Case Routing:** *Private convictions* and *exclusive associations* are outside the scope of political tolerance; *legal dismantlers* are judged solely on conduct.
  *   **Meta-Tolerance Stance:** Irrelevant, as the criterion applies only to public rules which are not subject to private belief norms.
  *   **Awkward Commitment:** This view must accept that a community can be morally tolerant while legally permitting the rise of tyrants who act within initial legal bounds.

  ### **Leaf B: Prudential Modus Vivendi**
  *   **Verdict:** Toleration is a strategic truce rather than a virtue, maintained only so long as it secures stability.
  *   **Case Routing:** *Legal dismantlers* and *small minorities* are tolerated only while weak; *internal factions* are expelled the moment they threaten stability.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is tolerated only if it does not provoke immediate conflict.
  *   **Awkward Commitment:** This position must admit it would abandon tolerance immediately if intolerance became the more stable option.

  ### **Leaf C: Constitutional Self-Defense**
  *   **Verdict:** The community's commitment is to a constitution or a set of practices rather than to a value, so suppressing its enemies is not an inconsistency.
  *   **Case Routing:** *Legal dismantlers* are barred by procedural rules; *internal factions* invoking norms are overruled by constitutional guardians.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is permitted only through established amendment procedures, not by undermining the framework itself.
  *   **Awkward Commitment:** This view must defend the legitimacy of the constitution without appealing to the very moral values it claims to bracket.

  ### **Leaf D: Reciprocity-Conditional Toleration**
  *   **Verdict:** Tolerance is a contract among free equals; those who refuse to grant it forfeit the right to claim it.
  *   **Case Routing:** *Small minorities* advocating intolerance are expelled regardless of threat level; *exclusive associations* are tolerated only if they allow exit.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is tolerated only if the advocates agree to be bound by the new criterion.
  *   **Awkward Commitment:** This position risks excluding vulnerable groups who are intolerant only out of defensive necessity or survival.

  ### **Leaf E: Doctrinal Militancy**
  *   **Verdict:** Intolerance is a categorical vice that must be banned per se, regardless of the immediate danger posed.
  *   **Case Routing:** *Small minorities* are suppressed immediately; *legal dismantlers* are banned from campaigning; *private convictions* are scrutinized for public expression.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion to be more permissive is itself treated as intolerant and banned.
  *   **Awkward Commitment:** This view must enforce a specific moral orthodoxy, thereby mirroring the intolerance it seeks to destroy.

  ### **Leaf F: Reactive Restraint**
  *   **Verdict:** The limit on intolerance is a threshold calibrated to threat, applied only once intolerance is manifest in action.
  *   **Case Routing:** *Legal dismantlers* are allowed to compete until they win and act; *small minorities* are protected unless they commit violence.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is tolerated unless it directly incites imminent lawless action.
  *   **Awkward Commitment:** This position must stand by idly while democratically elected actors dismantle the very system that allowed their election.

  ### **Leaf G: Contested Proceduralism**
  *   **Verdict:** The identification of intolerance is decentralized, leaving the boundary permanently open to social negotiation.
  *   **Case Routing:** *Disputed criteria* remain live conflicts rather than settled law; *internal factions* may argue their case to the public indefinitely.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is inherently tolerated because the criterion is never finally fixed.
  *   **Awkward Commitment:** This view offers no final recourse when a majority decides that tolerance itself is the intolerant position.

  ### **Leaf H: Open-Ended Proceduralism**
  *   **Verdict:** A designated authority identifies intolerance, but the rules of identification are themselves democratically revisable.
  *   **Case Routing:** *Disputed criteria* are settled by authority but can be challenged later; *internal factions* can lobby to change the rules.
  *   **Meta-Tolerance Stance:** The community must tolerate advocacy for revising the criterion, even if that advocacy challenges the current guardians.
  *   **Awkward Commitment:** This position risks a procedural suicide pact where the community votes to abolish the procedures that protect it.

  ### **Leaf I: Tragic Choice**
  *   **Verdict:** The puzzle is real and admits of no principled solution, only a choice between two losses (tyranny or self-destruction).
  *   **Case Routing:** *Legal dismantlers* present a dilemma with no right answer; *internal factions* reveal the unavoidable arbitrariness of the limit.
  *   **Meta-Tolerance Stance:** Advocacy for revising the criterion is banned to preserve the current line, acknowledging this is an unprincipled forceful act.
  *   **Awkward Commitment:** This view must admit that the foundation of the tolerant order is ultimately an act of intolerance that cannot be fully justified.

  ---

  ## **Notes on Logical Space**

  **Unoccupied Combinations:**
  The path combining **Prudential Grounds (Node 2)** with **Unconditional Toleration (Node 4)** is unoccupied. This combination is **incoherent**: if toleration is grounded solely in prudence (stability), it cannot logically remain unconditional when it leads to destruction (instability).

  **Unseparated Leaves:**
  **Leaf G (Contested Proceduralism)** and **Leaf H (Open-Ended Proceduralism)** are distinct on *procedure* (decentralized vs. authority) but return nearly identical verdicts on *outcome* (the criterion is revisable). They are separated here only because the reading group's **Case 6 (Disputed Criteria)** turns specifically on whether a dispute is settled by fiat or remains socially live.

  **Meta-Tolerance Consistency:**
  Every leaf explicitly states its stance on revising the criterion. Note that **Leaf E (Doctrinal Militancy)** and **Leaf I (Tragic Choice)** both forbid revision, but for different reasons: Leaf E claims the criterion is morally absolute, while Leaf I claims it is arbitrarily fixed to avoid collapse.
