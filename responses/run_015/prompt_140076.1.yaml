prompt: |-
  Hey — I'm writing a term paper on everyday conventions (tipping, queueing, jaywalking) and my flatmate, who's an anthro PhD and enjoys being insufferable, walked me into an argument I now think proves way too much. I've been going in circles for a week and would rather someone else name the broken step.

  Here it is:

  (1) A big chunk of what we call everyday morality is convention-dependent. Whether leaving nothing on the table is an insult depends on the local tipping practice; whether walking to the front is a theft or just how it's done depends on how the line works; whether stepping off the curb on a red is a small rudeness or a total non-event depends on local pedestrian practice. There doesn't seem to be any practice-independent fact about whether 18% or nothing is owed, or about whether the front of the line is yours if you got there first. If the practice were different, the duty would be different or gone.

  (2) The content of a convention-dependent duty is fixed by the practice, and the practice as it actually exists doesn't sort people into locals and visitors. It says something like: someone in situation S at a place like this is required to do R. Nothing in the content of the queueing convention, or the tipping convention, carries a nationality clause. So if you want to say "she's exempt, she's just visiting," you're adding a condition the practice itself doesn't contain.

  (3) And there's no in-principle limit on what a local practice can require. Where my flatmate grew up, the shared taxis board as an actual scrum and nobody thinks less of anyone for it. In plenty of places you're expected to refuse an offered gift twice before accepting. In plenty of others the permit application moves because there's cash folded into it.

  (4) So a visitor is morally required to shove at the taxi rank, to refuse the gift twice, to hand over the envelope — and by the same reasoning required to tip at the local rate even if she thinks tipping is a rotten system, and required to stand at the crossing for a full cycle with no car in sight if that's the local pedestrian norm.

  (5) That's way too much. A traveler who declines to fold cash into the permit hasn't done anything wrong; if anything she's done the better thing. And the argument seems to eat itself: if every duty is fixed by the local practice, there's no standpoint left from which anyone inside the practice can criticize it, and "that's how we do things here" becomes a complete moral answer.

  (6) So one of (1)-(4) has to go.

  What I want to keep: I'd most like to keep (1), because the whole point of my paper is that everyday morality is more local than my classmates want to admit. I also want to keep the bit of (4) that says the visitor isn't off the hook — I really dislike the tourist who strolls to the front of the line on the grounds that this isn't her country, and I want to be able to say she's doing something wrong. So I'm hoping the damage is in (3) or the move from (2) to (4).

  My flatmate says (3) is cheating: a scrum isn't a convention, it's what happens when there isn't one, and the envelope isn't a convention either, it's coercion that happens to have a regular shape. I half believe her, but I don't know how to state the test for which regularities count without it being ad hoc, and I'm worried any test that rules out the scrum will also rule out US tipping, which nobody thinks is *not* a convention. The gift-refusal case is the one that actually scares me, because it looks like a perfectly good convention on the standard coordination story — everyone conforms because everyone else conforms, everyone expects everyone to, nobody has a unilateral reason to stop — and yet I don't want to say a visitor who accepts on the first offer has committed a moral fault.

  I've been calling the fix I want "the guest clause": a local convention binds a visitor only if (a) she's taken up the benefits the practice distributes — she ate the meal, rode the taxi, walked the sidewalks — and (b) the point of the practice is served by conformity even when nobody can tell that you're conforming. But I can't tell whether that's a real principle or just a description of the cases I already have opinions about, and whether it proves too much in the other direction (does it let me free-ride?). A related thing I can't sort out: jaywalking, where "everyone does it" and "it's against the law" come apart, and I don't know whether the legal/conventional distinction is doing any work in (1) or is a red herring.

  So: which step do you reject, why did it look fine, and what does rejecting it cost me? If you think the argument is valid and I just have to swallow something, tell me which premise is cheapest to give up and what I lose. And if you use a test to separate the scrum from the queue, please say why it isn't gerrymandered — and whether it also gives an answer on the visitor who refuses the gift, the one who doesn't tip, and the one who jaywalks. Also worth flagging if my (2) is doing something sneaky: I have a feeling that any way of exempting the visitor needs moral resources from outside the practice, which would undercut (1) from the inside, but I can't quite make that precise.

  Please write in American English, and keep it concrete — I'd rather have the argument diagnosed step by step than a survey of what's been said about conventions generally.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a term paper on everyday conventions (tipping, queueing, jaywalking).
      *   **Problem:** Their flatmate (an anthro PhD) presented an argument that seems to prove "too much" (moral relativism/obligation to follow *all* local norms, even corrupt ones).
      *   **Goal:** Identify the broken step in the argument (1-6).
      *   **Preferences:**
          *   Keep (1): Everyday morality is convention-dependent/local.
          *   Keep part of (4): Visitors aren't automatically exempt (e.g., cutting in line is wrong).
          *   Suspects (3) or the move from (2) to (4) is the problem.
          *   Wants to avoid ad hoc tests (gerrymandering).
          *   Wants concrete analysis, not a survey of literature.
          *   American English.
      *   **Specific Puzzles:** Scrum vs. Queue, Bribery vs. Tipping, Gift Refusal, Jaywalking vs. Law.
      *   **Core Fear:** That exempting the visitor requires external moral resources, undermining (1).

  2.  **Deconstruct the Flatmate's Argument:**
      *   (1) Morality is convention-dependent (Localism).
      *   (2) Conventions don't distinguish locals vs. visitors (Universality of Application).
      *   (3) No limit on what practices require (Scrum, Bribery, Gift Refusal are all "practices").
      *   (4) Therefore, visitors must follow *all* local practices (Shove, Bribe, Refuse Gift, Wait at Red).
      *   (5) Reductio ad absurdum (Bribery is wrong, Criticism is impossible).
      *   (6) Conclusion: One premise must go.

  3.  **Evaluate the Premises:**
      *   **(1) Convention-Dependence:** Plausible. Tipping amounts *are* arbitrary. Queueing order *is* conventional.
      *   **(2) No Visitor Clause:** Technically true of the *rule* itself (the rule doesn't say "unless tourist"), but maybe true of the *justification*?
      *   **(3) No Limit on Content:** This is the weak link. It equates *coordination norms* with *corruption* or *mere regularities*.
      *   **(4) The Inference:** If (3) is false, (4) doesn't follow for the bad cases.

  4.  **Identify the Core Philosophical Issue:**
      *   The argument conflates **conventions** (coordination solutions) with **norms** (moral obligations) and **regularities** (just what people happen to do).
      *   David Lewis's definition of convention is key here: Conventions solve coordination problems where there are multiple equilibria.
      *   Bribery isn't a coordination problem in the same way; it's a prisoner's dilemma or a coercive extraction.
      *   Gift refusal is a signaling convention, but does it carry *moral* weight or just *etiquette*?
      *   The "Visitor" issue hinges on **Fair Play** vs. **Comity**.

  5.  **Develop the "Broken Step":**
      *   Step (3) is the culprit. It assumes all regularities are morally binding conventions.
      *   *Correction:* Not all regularities are conventions, and not all conventions generate *moral* obligations (some are just etiquette), and not all conventions bind outsiders equally.
      *   *Refinement:* The distinction isn't just "scrum vs. queue." It's about the *function* of the norm.
      *   *Queueing/Tipping:* Solves coordination/fairness issues.
      *   *Bribery:* Solves a coordination issue for the corrupt, but violates a higher-order moral norm (fairness/justice).
      *   *Gift Refusal:* Purely signaling/etiquette. Violation is rude, not immoral.

  6.  **Address the "Visitor" Problem (The Guest Clause):**
      *   The user wants to keep the idea that visitors must queue but don't have to bribe.
      *   Theory: **The Principle of Fair Play.**
      *   If you benefit from a cooperative scheme (queueing, tipping as wage subsidy), you owe compliance.
      *   If the scheme is exploitative (bribery), you don't owe compliance (and might owe resistance).
      *   If the scheme is purely symbolic (gift refusal), you owe *effort* to comply (comity), but failure is a faux pas, not a moral sin.
      *   This saves (1) by distinguishing *types* of conventions.

  7.  **Address the "External Moral Resources" Fear:**
      *   The user worries that judging bribery as wrong requires stepping outside (1).
      *   *Response:* You don't need universal morality to reject bribery. You need a distinction between *coordination conventions* and *corrupt practices*.
      *   Actually, you *do* need some external moral standard to say bribery is wrong. But that doesn't kill (1). (1) says *everyday* morality (tipping, queueing) is conventional. It doesn't say *all* morality is conventional.
      *   So, (1) needs a slight tweak: "A big chunk..." is already there. The flatmate's argument tries to expand "chunk" to "all."
      *   The fix is to limit the scope of (1) to *cooperative* conventions, not *coercive* regularities.

  8.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Academic but accessible, direct, respectful of the user's intelligence.
      *   *Structure:*
          1.  Diagnose the break (Step 3).
          2.  Explain *why* Step 3 fails (Convention vs. Regularity vs. Corruption).
          3.  Apply the test to the cases (Queue, Tip, Bribe, Gift, Jaywalk).
          4.  Address the Visitor/Guest Clause (Fair Play).
          5.  Address the "External Resources" fear.
      *   *Key Distinction:* Coordination vs. Cooperation vs. Coercion.
      *   *Lewis vs. Hume:* Lewis (arbitrary coordination) vs. Hume (Fair Play).
      *   *The "Scrum":* Is it a convention? If it's a free-for-all, it's the *absence* of a convention.
      *   *The "Bribe":* It's a convention among bribers, but it violates a background norm of impartiality.
      *   *The "Gift":* It's etiquette. Binding? Yes, but lightly.
      *   *The "Jaywalk":* Law vs. Convention. If the convention is "wait," waiting is the duty. If the convention is "cross if clear," crossing is the duty.

  9.  **Refining the "Test":**
      *   To avoid gerrymandering, the test must be functional.
      *   Test: **Does the practice solve a coordination problem without violating a background moral constraint?**
      *   Queueing: Solves fairness/order. No violation. -> Binding.
      *   Tipping: Solves wage allocation (in US). No violation (usually). -> Binding.
      *   Bribery: Solves "who gets permit faster" but violates "equal treatment." -> Not Binding.
      *   Gift Refusal: Solves "politeness signaling." Violates nothing, but low stakes. -> Binding as etiquette, not morality.
      *   Scrum: No coordination. -> Not a convention.

  10. **Final Polish:**
      *   Check American English spelling/idioms.
      *   Ensure the "Guest Clause" is integrated.
      *   Make sure the user's desire to keep (1) and part of (4) is respected.

      *(Self-Correction during drafting)*: I need to be careful not to say "Bribery is objectively wrong" in a way that destroys (1). I should frame it as: Bribery fails the definition of a *legitimate* convention because it relies on a background injustice. Or, simpler: Step (3) claims *any* regularity creates a duty. That's the error. Regularities only create duties if they are *normative* conventions, not just *behavioral* regularities. The "normative" part requires a moral filter.
      *   Actually, the strongest move is to attack the definition of "Convention" in (3). A scrum isn't a convention. Bribery is a *corrupt* practice.
      *   Let's focus on the **Normative Force** of conventions. Conventions bind because they facilitate cooperation. If they facilitate exploitation, they lose that force.

      *(Final Plan)*:
      1.  Pin the break on (3).
      2.  Distinguish between **Coordination Conventions** (Queue), **Etiquette Conventions** (Gift), and **Corrupt Regularities** (Bribe/Scrum).
      3.  Use the **Principle of Fair Play** to justify the visitor's obligation (solves the "external resources" worry by keeping it internal to the practice's logic).
      4.  Apply to Jaywalking (Law vs. Convention).

  11. **Writing the Response.** (Proceed to generate output based on this thought process).
answer: |-
  Your flatmate's argument is seductive because it treats "convention" as a monolith. It assumes that if a behavior is regular and locally expected, it carries the same moral weight as queueing. That is the broken step.

  Here is the diagnosis: **Premise (3) is false.** It conflates three distinct things: (a) cooperative conventions, (b) etiquette/signaling norms, and (c) coercive regularities.

  By rejecting (3), you can keep (1) (localism) and the binding part of (4) (visitors must queue), without accepting that visitors must bribe or shove. Here is the step-by-step breakdown of why (3) fails, how to test for it without gerrymandering, and how this solves your visitor problem.

  ### 1. Why Premise (3) Fails
  Premise (3) claims: *"There's no in-principle limit on what a local practice can require."*

  This looks true if you define "practice" as "anything people regularly do." But in moral philosophy, a **convention** isn't just a regularity; it's a *solution to a coordination problem*.
  *   **Queueing:** We all want service. If we rush, everyone loses time (prisoner's dilemma). The queue is the equilibrium that solves this.
  *   **Tipping (US):** Waiters are paid below minimum wage. The tip is the mechanism that makes the transaction viable. It's a cooperative subsidy.
  *   **The Scrum:** This is not a convention; it is the *absence* of one. A scrum is a state of nature. Nobody coordinates; everyone competes. There is no duty to shove because shoving doesn't solve a coordination problem; it exacerbates the conflict.
  *   **Bribery:** This is a coordination problem *for the corrupt*, but it violates a background condition of **fair access**. A convention cannot generate a moral duty if its operation relies on violating a more fundamental norm (like impartiality in public office).

  **The Fix:** You reject (3) by arguing that only *cooperative* conventions generate moral duties. Regularities that are purely competitive (scrum) or exploitative (bribery) do not generate duties, even if they are locally standard.

  ### 2. The Non-Gerrymandered Test
  You are worried that distinguishing the "scrum" from the "queue" is ad hoc. It isn't, provided you use a functional test based on **David Lewis's** definition of convention, modified for morality.

  **The Test:** A local regularity counts as a binding convention if:
  1.  **Arbitrariness:** There is more than one way to solve the problem (e.g., queue by arrival vs. queue by number).
  2.  **Coordination:** Conformity is preferred *conditional on others conforming* (I want to queue only if you queue too).
  3.  **Legitimacy:** The practice does not rely on external harm or coercion to function.

  **Applying the Test:**
  *   **Queue:** Passes all three. It solves order, relies on mutual compliance, and harms no one. **Binding.**
  *   **US Tipping:** Passes 1 & 2. Passes 3 (arguably), provided the wage system is legal. **Binding.**
  *   **The Scrum:** Fails (2). I prefer to shove *regardless* of what you do. It's not coordination; it's competition. **Not Binding.**
  *   **Bribery:** Fails (3). It solves a coordination problem (who gets the permit) but relies on the harm of excluding those who don't pay. **Not Binding.**
  *   **Gift Refusal:** Passes 1 & 2. Fails on *weight*. It is an **etiquette convention**, not a **moral convention**. It coordinates social signaling, not resource distribution. **Binding as politeness, not morality.**

  This isn't gerrymandered because it relies on the *structure* of the interaction, not your pre-existing intuition about the outcome.

  ### 3. Solving the Visitor Problem (The Guest Clause)
  You want to say the visitor must queue but doesn't have to bribe. Your "Guest Clause" intuition is correct, but it needs a theoretical anchor so it doesn't look like a description of your biases.

  The anchor is the **Principle of Fair Play** (H.L.A. Hart / John Rawls).
  *   **The Logic:** When you benefit from a cooperative scheme (the queue ensures you get served without fighting; the tip ensures your waiter is paid), you incur an obligation to do your part.
  *   **The Visitor:** By entering the space, the visitor accepts the benefits of the local order. If she cuts the line, she free-rides on the restraint of others. That is why she is bound.
  *   **The Limit:** The Principle of Fair Play only applies to *just* or *legitimate* schemes. You do not owe "fair play" to a racket. If the permit office is running a bribe scheme, the visitor does not benefit from a *cooperative* good; she is being extorted. She owes no duty to comply.

  **This saves (1):** You maintain that duties are local (determined by the specific practice), but you deny that *all* local practices create duties.
  **This saves (4):** The visitor is bound to queue (fair play) but not to bribe (illegitimate scheme).

  ### 4. Handling the Specific Cases
  Here is how this framework resolves your specific anxieties:

  **A. The Gift Refusal (The Scary One)**
  *   **Diagnosis:** This is an etiquette convention, not a moral one.
  *   **Verdict:** The visitor *should* try to comply out of respect (comity), but if she accepts on the first offer, she has committed a *faux pas*, not a moral wrong.
  *   **Why:** Failing to refuse the gift doesn't harm anyone or free-ride on a cooperative resource. It just signals "I am not acculturated." Your flatmate is conflating *rudeness* with *immorality*.

  **B. The Bribe (The Permit)**
  *   **Diagnosis:** This is a coercive regularity, not a legitimate convention.
  *   **Verdict:** The visitor is not required to pay. In fact, she may have a duty *not* to pay (to avoid sustaining the corrupt equilibrium).
  *   **Why:** It fails the Legitimacy condition of the test. It violates the background norm of equal treatment.

  **C. Jaywalking (The Law vs. Convention Split)**
  *   **Diagnosis:** This is where (1) gets tricky. There are two layers here: the legal rule and the pedestrian convention.
  *   **Scenario A (US):** Law says wait. Convention says wait if cars are coming, cross if clear.
      *   If the *convention* is "cross if clear," the moral duty is to follow the convention (safety/flow), not necessarily the law.
  *   **Scenario B (Germany):** Law says wait. Convention says wait even if empty.
      *   Here the convention *is* strict compliance.
  *   **Verdict:** The visitor is bound by the *pedestrian convention* (safety/flow), not necessarily the statute, unless the statute *is* the convention (as in Germany).
  *   **Why:** The moral duty comes from not endangering others and respecting the local coordination of traffic. If the local coordination is "wait on red," you wait. If it's "yield to pedestrians," you walk. The law is evidence of the convention, but not the source of the moral duty.

  ### 5. Addressing Your Fear: "External Moral Resources"
  You wrote: *"I have a feeling that any way of exempting the visitor needs moral resources from outside the practice, which would undercut (1) from the inside."*

  This is your sharpest insight, but the conclusion is too pessimistic.
  *   **You do need external resources,** but they don't have to be *universal* morality. They just need to be **structural**.
  *   To say "bribery is wrong," you don't need a God's-eye view of the Universe. You just need the internal norm of **public office impartiality**. If the local practice violates its own stated purpose (issuing permits based on merit), it is self-defeating.
  *   To say "the visitor must queue," you use the internal norm of **reciprocity**.

  You are not undercutting (1). You are refining it. (1) says: *"Everyday morality is convention-dependent."*
  Your revised (1) says: *"Everyday morality is dependent on **legitimate cooperative** conventions."*

  This allows you to say:
  1.  **Localism holds:** Whether you tip 18% or 0% depends on the local scheme.
  2.  **Criticism holds:** You can criticize a local scheme (bribery) if it fails the cooperation/legitimacy test.
  3.  **Visitor Duty holds:** Visitors must play fair in cooperative games (queueing) but need not participate in exploitative ones (bribery).

  ### Summary of the Move
  Reject **(3)**.
  Replace it with: **"Only regularities that function as legitimate cooperative solutions generate moral duties."**

  *   **Cost:** You lose the ability to say "When in Rome, do *exactly* as the Romans do." You have to admit that some Roman practices (scrumming, bribing) are not binding.
  *   **Gain:** You save your paper from relativism. You can argue that everyday morality is local *without* arguing that morality is powerless against local corruption.
  *   **Visitor Status:** The visitor is a **temporary participant**. She owes compliance to the cooperative structures she benefits from (queues, traffic flow), but she retains the right to opt out of exploitative structures (bribes) and is only loosely bound by symbolic ones (gift refusal).

  Your flatmate's argument works only if "convention" means "anything people do." Once you define convention as "a solution to a coordination problem," the scrum and the bribe fall out, and your term paper has a robust, defensible thesis.
