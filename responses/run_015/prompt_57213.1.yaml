answer: |-
  **MEMORANDUM**

  **TO:** Clemency Board Members
  **FROM:** Staff Counsel
  **SUBJECT:** Proposed Analyst Procedure for Capital Petitions

  You are right that the current worksheet collapses distinct moral questions into a single mush of "fairness." This allows members to vote based on intuition while claiming factual rigor. Below is a proposed procedure based on your three grounds, revised for practical application by non-philosopher analysts working from cold records.

  ### I. Validation of Grounds

  Before the procedure, we must address the validity of your three grounds for *analyst* use.

  **Ground (1) Factual Innocence/Doubt** and **Ground (2) Disparity/Proportionality** are solid. They rely on comparative facts (evidence quality, sentencing data) that analysts can verify.

  **Ground (3) Temporal Desert** is bogus *as an evidentiary category*. Analysts cannot measure "moral identity over time." They can measure behavior, mental health, and institutional conduct, but whether a 62-year-old *deserves* death for the acts of a 28-year-old is a philosophical value judgment, not a fact. If we ask analysts to decide this, they will simply substitute their own views on redemption.

  **Correction:** We will keep Ground (3) on the worksheet but rename it **"Changed Circumstances and Capacity."** Analysts will gather data on conduct and mental state. The *conclusion* about whether this negates desert is reserved for the Board. This prevents analysts from smuggling in moral priors under the guise of metaphysical findings.

  ### II. The Analyst Procedure

  Analysts must proceed sequentially. A "Deny" recommendation at any stage stops the analysis unless a subsequent ground offers a stronger affirmative case for commutation. However, for efficiency, if Ground (1) is clearly met, Grounds (2) and (3) are secondary.

  **Step 1: The Innocence Threshold (Ground 1)**
  *   **Question:** Is there specific, individualized evidence casting doubt on this petitioner's guilt or culpability that was not fully resolved at trial?
  *   **Sufficient Answer:** Yes, if there is new physical evidence, recanted testimony supported by corroboration, or proof of Brady violations (prosecutorial misconduct) affecting the verdict.
  *   **Termination:** If No, recommend Denial on this ground. Move to Step 2.
  *   **The Limit:** Do not accept systemic doubts here (e.g., "eyewitness ID is unreliable"). This step is about *this* case.
  *   **Judgment Call Flag:** Determining whether new evidence is "corroborated" enough to matter is a judgment call. Analysts should note the strength of corroboration but not decide credibility.

  **Step 2: The Equity Check (Ground 2)**
  *   **Question:** Is this sentence an outlier compared to similarly situated offenders?
  *   **Sufficient Answer:** Yes, if co-defendants with equal or greater culpability received life sentences, or if sentencing data shows this specific fact pattern rarely results in death in this jurisdiction.
  *   **Termination:** If No, recommend Denial on this ground. Move to Step 3.
  *   **Judgment Call Flag:** "Similarly situated" is subjective. Analysts must list the comparators but cannot decide if the differences are morally relevant.

  **Step 3: Changed Circumstances and Capacity (Ground 3)**
  *   **Question:** Has the petitioner's status changed such that execution serves no retributive or penological purpose recognizable by current standards?
  *   **Sufficient Answer:** Yes, if there is documented severe mental deterioration (dementia/psychosis), evidence of extraordinary rehabilitation (awards, risk assessments showing low risk), or age-related incapacity.
  *   **Termination:** If No, recommend Denial.
  *   **Handoff Point:** This step always hands the call to the Board. The analyst provides the data (medical records, disciplinary logs); the Board decides if it merits mercy.

  **Step 4: The Silent Record Protocol**
  *   **Problem:** Trial records do not capture disparity (Step 2) and prison records often miss nuance (Step 3).
  *   **Procedure:** If data is missing, analysts must state "Record Silent." Do not infer negative from silence. For Step 2, if no comparison data exists, mark "Unable to Assess Disparity." For Step 3, if prison files are sparse, mark "Conduct Unremarked."
  *   **Effect:** A "Silent" mark defaults to Denial for that ground, but flags the Board that the decision is being made without information.

  ### III. Limitations and Misfires

  **What This Procedure Cannot Do**
  This worksheet is designed for individual justice, not systemic correction. It will misfire on cases where the injustice is structural rather than individual.

  **Deterrence and Denunciation**
  Do not include these on the worksheet. They are institutional justifications for the death penalty as a whole, not criteria for individual clemency. An analyst cannot determine if *one* execution deters crime. Including these invites members to vote on policy rather than the petition before them.

  **The "Statistical Innocence" Problem**
  The procedure requires individualized doubt (Step 1). It is not built to handle cases where the *process* is tainted but the *individual* guilt is unchallenged. This is a feature, not a bug, of fact-based analysis, but it is a moral blind spot.

  **Judgment Calls Dressed as Steps**
  Step 2 (Equity) is the biggest risk. Analysts must select which co-defendants or cases are "comparable." Choosing a comparator that makes the petitioner look worse or better is a value judgment. Analysts must list *all* known co-defendants, not just the favorable ones.

  ### IV. Case Runs

  **Case 1: The Aging Petitioner**
  *   *Facts:* Guilt solid. Age 19 at crime. Three co-defendants alive (pleas). 34 years unblemished.
  *   *Step 1 (Innocence):* **Deny.** No doubt on guilt.
  *   *Step 2 (Equity):* **Commute.** Co-defendants with equal culpability received life. This is a factual disparity.
  *   *Step 3 (Changed Status):* **Commute.** 34 years of good conduct is documented fact.
  *   *Result:* Recommendation for Commutation based on Ground (2) and (3).
  *   *Note:* This works well. The disparity is objective; the conduct is documented.

  **Case 2: The Repudiated Forensic Technique**
  *   *Facts:* Guilt undisputed. Conviction relied on now-repudiated forensics. Cluster of exonerations using same technique. No new evidence specific to *him*.
  *   *Step 1 (Innocence):* **Deny.** The procedure asks for individualized doubt. Statistical risk ("4% innocent") is not individualized evidence. The analyst cannot check "Yes" here without specific exculpatory facts.
  *   *Step 2 (Equity):* **Deny.** No disparity in sentence compared to others convicted the same way.
  *   *Step 3 (Changed Status):* **Deny.** No change in capacity or conduct noted.
  *   *Result:* Recommendation for Denial.
  *   *Note:* This is the failure point. The procedure treats systemic error as individual certainty.

  **Case 3: The Dementia Petitioner**
  *   *Facts:* Guilt probable. Disparity weak. Advanced dementia. Does not understand execution.
  *   *Step 1 (Innocence):* **Deny.**
  *   *Step 2 (Equity):* **Deny.**
  *   *Step 3 (Changed Status):* **Handoff.** Medical records confirm dementia.
  *   *Procedural Conflict:* You noted the Board treats competency as the courts' business.
  *   *Resolution:* The worksheet flags this under Step 3 but adds a warning: "Legal Competency is a Judicial Question." If courts have already ruled him competent, the analyst must note that. If courts haven't ruled, the analyst flags it for the Board to decide whether to act where courts haven't.
  *   *Result:* Recommendation for Commutation (or Stay), but marked as "Extra-Legal Mercy."

  ### V. The Outcome You Won't Like

  I expect you will be unhappy with **Case 2**.

  **Why:** The procedure recommends Denial for a man convicted using junk science that has already sent innocent people to death row. You want the procedure to catch this. But a fact-based worksheet cannot process "statistical innocence." To fix this, you would have to allow analysts to recommend commutation based on systemic risk rather than individual doubt.

  **The Trade-off:** If you allow systemic risk in Step 1, you open the door to commuting every case involving eyewitness testimony or jailhouse informants, as all carry known error rates. The procedure forces you to choose: is clemency for the *probably innocent* (individual doubt) or the *systemically vulnerable* (group risk)? This worksheet chooses the former because analysts cannot adjudicate the latter without policy directives from you.

  ### VI. One-Page Board Version

  **Clemency Recommendation Worksheet (Board Use)**

  **Petitioner:** [Name] | **Case:** [Number] | **Analyst:** [Name]

  **1. FACTUAL INNOCENCE**
  [ ] **Strong Evidence:** New physical evidence, recantation with corroboration, proven misconduct.
  [ ] **Weak/None:** No new evidence, or evidence is speculative.
  [ ] **Systemic Risk:** Conviction relied on techniques later repudiated (no individual doubt).
  *Analyst Note:* ________________________________________________

  **2. SENTENCING EQUITY**
  [ ] **Outlier:** Co-defendants or similar cases received life sentences.
  [ ] **Consistent:** Sentence aligns with similar cases.
  [ ] **Unknown:** Record silent on comparators.
  *Analyst Note:* ________________________________________________

  **3. CHANGED CIRCUMSTANCES**
  [ ] **Significant:** Severe mental deterioration, extraordinary rehabilitation, advanced age.
  [ ] **Minimal:** Standard institutional conduct.
  [ ] **Judicial Overlap:** Competency issues previously litigated in courts.
  *Analyst Note:* ________________________________________________

  **4. ANALYST RECOMMENDATION**
  [ ] **Commute** (Specify Ground: 1 / 2 / 3)
  [ ] **Deny**
  [ ] **No Recommendation** (Insufficient Data)

  **5. BOARD DECISION POINTS**
  *   **Values:** Does systemic risk (Ground 1, Box 3) merit mercy without individual doubt?
  *   **Values:** Does temporal distance (Ground 3) negate desert regardless of conduct?
  *   **Values:** Do we act where courts have declined (Ground 3, Judicial Overlap)?

  **Board Vote:** _______ Commute _______ Deny _______ Abstain

  ***

  **Conceptual Distinctions Dropped**
  To make this work for analysts, we dropped the distinction between *rehabilitation* (moral improvement) and *conduct* (behavioral compliance). Analysts can count disciplinary infractions; they cannot measure soul-searching. We also dropped the distinction between *mitigation* (reasons not to kill) and *exoneration* (reasons why he didn't do it). Both feed into Ground 1 for simplicity, though they are legally distinct.

  **What We Lose:** By dropping the moral measurement, we lose the ability to distinguish between a prisoner who is merely quiet and one who is genuinely remorseful. By dropping systemic risk in Ground 1, we lose the ability to correct broad injustices without specific proof. These are not oversights; they are constraints required to keep analysts from acting as rogue philosophers.

  **Final Warning:** This procedure clarifies *why* you are voting, but it does not tell you *how* to vote. Ground 3 remains a value judgment. Ground 2 depends on data you may not have. Ground 1 excludes the statistically innocent. If these outcomes are unacceptable, the Board must change the policy, not the worksheet.
