answer: |-
  ### Target Case: The Calibration Switch

  **Setting:** A standard Intensive Care Unit.
  **Agent:** Elena, a respiratory therapist.
  **Patient:** Mr. Vance, fully paralyzed due to a high spinal cord injury, permanently dependent on a mechanical ventilator for oxygen.

  **Setup:**
  Mr. Vance is stable on the ventilator, powered by the hospital's main electrical grid (Wall Power), which is backed by a building-wide generator. This supply is effectively indefinite. Hospital protocol requires a weekly "Battery Integrity Test" to ensure the ventilator's internal backup battery functions in case of a blackout. The test involves switching the power source from Wall Power to Internal Battery for exactly five minutes, then switching back.

  Elena performs the switch. This action is permissible, consensual (part of standard care), and done with no lethal intent; she fully intends to switch back before the battery depletes. The battery, when engaged, will power the ventilator for exactly five minutes before dying completely.

  **The Omission:**
  Immediately after flipping the switch to Battery, Elena sits in a chair beside the bed. She does not move, speak, or touch anything else. She becomes absorbed in a personal thought or distraction. She watches the clock but does not act. As the five minutes expire, the battery dies. The ventilator stops. Mr. Vance suffocates and dies.

  **Causal Structure:**
  1.  **Pre-Setup:** Patient stable on indefinite Wall Power.
  2.  **Setup:** Agent switches to finite Battery (Permissible Action).
  3.  **Post-Setup:** Agent fails to switch back to Wall Power (Pure Omission).
  4.  **Result:** Battery depletion $\rightarrow$ Ventilator Stop $\rightarrow$ Death.

  ***

  ### 1. Matched Control Case: The Grid Failure

  **Setting:** Same ICU, same Agent, same Patient.
  **Setup:**
  Mr. Vance is stable on Wall Power. Suddenly, a lightning strike hits the building's transformer. The Wall Power fails instantly. The ventilator automatically switches to its Internal Battery (as designed). The battery will last exactly five minutes before dying.

  **The Omission:**
  Elena is present. Protocol requires her to manually engage the portable generator or restore Wall Power within the five-minute window. She sits in the chair beside the bed. She does not move, speak, or touch anything. She watches the clock but does not act. The battery dies. The ventilator stops. Mr. Vance suffocates and dies.

  **Causal Structure:**
  1.  **Pre-Setup:** Patient stable on indefinite Wall Power.
  2.  **Setup:** Nature (Lightning) cuts Wall Power; Machine auto-switches to finite Battery (External Event).
  3.  **Post-Setup:** Agent fails to engage Generator (Pure Omission).
  4.  **Result:** Battery depletion $\rightarrow$ Ventilator Stop $\rightarrow$ Death.

  ***

  ### 2. The Three Tests

  | Test | Target Case (Calibration Switch) | Control Case (Grid Failure) |
  | :--- | :--- | :--- |
  | **1. Action/Omission** | **Omission.** After the initial switch, Elena performs no bodily movement. The death results from her *not* switching back. | **Omission.** Elena performs no bodily movement. The death results from her *not* engaging the generator. |
  | **2. Threat Test** | **Agent-Introduced Threat.** The specific lethal threat (battery depletion within 5 mins) was introduced by Elena's permissible switch. Without her action, Wall Power would have continued. | **Pre-Existing Threat.** The lethal threat (power loss) was introduced by nature (lightning). The agent did not create the vulnerability; she failed to rescue from it. |
  | **3. Agency Test** | **Engaging Harmful Features.** By switching to battery, Elena engaged a mechanism with a known expiration. Her omission allowed that specific mechanism to complete its lethal cycle. | **Withholding Prevention.** Elena withheld the intervention that would have countered an external threat. She did not engage the lethal mechanism; she failed to block it. |

  ***

  ### 3. Analysis of Verdicts

  **Verdicts:**
  *   **Target Case:** Intuitively **Killing**.
  *   **Control Case:** Intuitively **Letting Die**.

  **Test Performance:**
  *   **Action/Omission Test:** **Collapses.** It classifies both cases identically as omissions. If the distinction between killing and letting die reduced to action and omission, these cases should yield the same moral verdict. They do not.
  *   **Threat Test:** **Delivers Killing.** It distinguishes the cases based on the *source* of the lethal sequence. In the Target, the agent initiated the specific causal chain that led to death (the countdown). In the Control, the chain was external.
  *   **Agency Test:** **Delivers Killing.** It distinguishes based on whether the agent *operated* the lethal system (Target) or merely *failed to repair* it (Control).

  **The Single Feature Doing the Work:**
  The crucial feature is **The Origin of the Vulnerability**.
  In the Target Case, the patient was secure until the agent made them vulnerable. The agent swapped an indefinite life-support system for a finite one. The omission is not merely a failure to save; it is a failure to *restore the security she temporarily removed*. In the Control Case, the vulnerability was imposed by the world; the agent merely failed to restore security.

  ***

  ### 4. The Redescription and Evaluation

  **The Defender's Redescription:**
  A defender of the Action/Omission doctrine would argue:
  > "In both cases, the physiological cause of death is respiratory failure due to power loss. In the Target Case, Elena's initial switch was permissible and non-lethal. Once the switch was made, the battery's depletion is a natural physical process independent of her will. Her failure to intervene is structurally identical to the Control Case: she stood by while a machine stopped. To call it 'killing' is to punish her for the initial permissible act by retroactively coloring the omission. Since the death occurred during a period of inaction, it is, by definition, letting die."

  **Evaluation:**
  This is a **refusal to engage**, not a real answer.
  It relies on a "snapshot" view of causality that isolates the moment of death from the context of the agent's prior intervention. It treats the "Battery Mode" as a new baseline state, ignoring that the agent *created* that baseline. If I move you from a safe room to a room with a falling ceiling (permissibly, for a test), and then I fail to hold the ceiling up when it drops, saying "I just let the ceiling fall" ignores that I put you under the ceiling. The redescription artificially severs the causal link between the setup and the omission to preserve the Action/Omission taxonomy, thereby stripping the case of its moral texture.

  ***

  ### 5. Fragility and Constraints

  **Fragility of the Case:**
  This case is fragile in two specific ways:

  1.  **Professional Role and Duty:** The intuition that the Target Case is "Killing" relies heavily on Elena's role as a therapist. She has a specific duty of care that includes managing the risks she introduces during testing. If a random visitor had flipped the switch (assuming they could), the verdict might shift toward "Wrongful Action leading to Death" rather than "Killing by Omission." The "Killing by Omission" verdict depends on the agent having the *authority* to set the mode and the *obligation* to revert it.
      *   *Is this cheating?* For the purpose of testing the Action/Omission distinction, this is **not cheating**. The distinction between doing and allowing is often normative, not purely physical. A "duty to act" is what turns an omission into a morally significant event. However, if the goal is to find a *causal* distinction independent of social norms, this case fails. It shows that "Killing by Omission" is a normative status, not a brute physical fact.

  2.  **The "Independent Process" Constraint:** The case walks a tightrope regarding the constraint: *"Death is not better explained by... a lethal process already underway independently."*
      *   Mr. Vance's spinal injury is a lethal process underway. He will die without ventilation.
      *   *Defense:* The death is not explained by the injury *at this specific time*. He was stable on Wall Power. The death is explained by the *interruption* of power. In the Target Case, the interruption is agent-dependent. In the Control Case, it is nature-dependent.
      *   *Fragility:* If one argues that "Ventilator Dependence" is the lethal process, then *both* cases are Letting Die (withdrawal of life support). To sustain the "Killing" verdict, one must view the *Battery Countdown* as the lethal process, not the Lung Failure. This requires accepting that creating a temporary dependency on a finite resource is morally equivalent to introducing a threat.

  **Conclusion on Fragility:**
  The case succeeds in prying apart Action/Omission from Killing/Letting Die, but it reveals that the Killing/Letting Die distinction is not rooted in bodily movement. It is rooted in **responsibility for the threat**. If the agent is responsible for the threat (even via permissible setup), failing to neutralize it is Killing. If the agent is not responsible for the threat, failing to neutralize it is Letting Die. This suggests the distinction is normative (about duties and threats) rather than ontological (about motion and stillness).
