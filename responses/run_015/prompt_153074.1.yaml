answer: |-
  # Seminar Role-Play: The Mariká Planning Board
  **Topic:** The Boundary Between Corruption and Legitimate Reciprocity
  **Time:** 75 Minutes
  **Participants:** 16 Students (4 Board, 6 Petitioners, 6 Observers)
  **Materials:** Role cards, Token sheets (Reputation/Obligation), City Legitimacy Tracker (Whiteboard).

  ---

  ## I. Facilitator Setup (0:00–0:10)

  **1. The Premise (2 mins)**
  Tell the class: "You are in Mariká, a post-colonial city-state. The Planning Board grants land variances. The law recognizes 'Kinship Credits' (K-Credits): social obligations from family/neighborhood ties. You can register them, but unwritten norms dictate when they can be 'cashed in.' Your goal is to survive three rounds without collapsing the City's Legitimacy."

  **2. Role Assignment (3 mins)**
  Distribute role cards.
  *   **Board (4):** Elected Official (needs votes), Appointed Planner (needs technical compliance), Community Elder (needs social harmony), Legal Auditor (needs rule adherence). *Decision Rule: Majority vote (3 of 4) approves variance.*
  *   **Petitioners (6):** Each gets a **Portfolio Card** (see Appendix A). They want a Variance (Height, Zoning, or Demolition).
  *   **Observers (6):** Civil Society/Media. They get **Audit Tokens**. They do not vote but can trigger an Audit.

  **3. Mechanics & Currency (5 mins)**
  Explain the three scores tracked on the whiteboard:
  *   **City Legitimacy (CL):** Starts at 50. If it hits 0, the game ends (regime collapse). If it hits 100, everyone wins.
  *   **Reputation Tokens (RT):** Held by Board members. Needed to serve on *future* boards (win condition for Board).
  *   **Obligation Cards (OC):** Held by Petitioners/Board. Must be honored later or lose RT.

  **The Three Variances:**
  1.  **Residential Height:** Low impact, easy to approve.
  2.  **Commercial Zoning:** High profit, medium scrutiny.
  3.  **Heritage Demolition:** High controversy, high scrutiny.

  **The Audit Mechanism:**
  Observers may spend an **Audit Token** after any vote.
  *   If the vote violated *Formal Rules*: CL -10.
  *   If the vote violated *Hidden Norms* (exposed): CL -5, Board member loses 2 RT.
  *   If the Audit finds nothing: Observer loses 1 RT (frivolous audit).

  ---

  ## II. The Three Rounds (0:10–0:44)

  *Facilitator Note: Keep strict time. 2 minutes for lobbying/submission, 4 minutes for Board deliberation/vote, 2 minutes for Audit/Scoring.*

  ### Round 1: The Formal Layer (0:10–0:20)
  **Information State:** Only formal regulations are visible. K-Credits exist but are not yet revealed to Observers.
  **Action:**
  1.  Petitioners submit 1 Variance Request each (written slip to Facilitator).
  2.  Board deliberates based *only* on written law (e.g., "Is the building too high?").
  3.  Board votes.
  4.  Observers decide: Audit or Pass?
  **Scoring:**
  *   Approved Variance: Petitioner gets 1 RT.
  *   Audit finds Rule Violation: CL -10.
  *   *Facilitator Twist:* Approve most requests to build confidence.

  ### Reveal 1 (0:20–0:22)
  **Announcement:** "The Kinship Credit Register is now public."
  **Mechanic:** Petitioners reveal they hold **K-Credits**.
  *   **Rule:** A K-Credit allows a Petitioner to bypass *one* technical requirement (e.g., height limit) without penalty.
  *   **Tension:** Using a K-Credit is legal, but looks like favoritism to outsiders.
  *   **Board Incentive:** If the Board denies a registered K-Credit, the Community Elder loses 2 RT (social friction).

  ### Round 2: The Embedded Layer (0:22–0:32)
  **Information State:** K-Credits are visible. Hidden debts are not.
  **Action:**
  1.  Petitioners submit requests, optionally attaching a K-Credit.
  2.  Board deliberates. They must balance Technical Rules vs. Social Credits.
  3.  Observers decide: Audit or Pass? (Observers know K-Credits are legal, but suspect some are 'inflated').
  **Scoring:**
  *   K-Credit Honored: Petitioner gets Variance. Elder gains 1 RT.
  *   K-Credit Ignored: Elder loses 2 RT.
  *   Audit on K-Credit Use: If Observer claims credit was 'fake':
      *   If Real: Observer loses 2 RT.
      *   If Fake (Petitioner lied): CL -5, Petitioner banned.

  ### Reveal 2 (0:32–0:34)
  **Announcement:** "Leaked Documents: Undisclosed Reciprocal Debts."
  **Mechanic:** Distribute **Secret Debt Slips** to specific Board/Petitioner pairs (see Appendix B).
  *   **Rule:** These debts are *not* registered K-Credits. They are private obligations (e.g., "Board Member X owes Petitioner Y for campaign support").
  *   **Constraint:** If a Board Member ignores a Secret Debt, they lose 3 RT immediately (private sanction).
  *   **Risk:** If an Auditor exposes a Secret Debt, CL -15 (Scandal).

  ### Round 3: The Hidden Layer (0:34–0:44)
  **Information State:** Everyone knows hidden debts *might* exist, but not who holds them.
  **Action:**
  1.  Petitioners submit requests. Some will hint at Secret Debts ("Remember our agreement").
  2.  Board deliberates. They must choose: Honor the Secret Debt (risk Audit) or Deny it (lose RT).
  3.  Observers decide: Audit or Pass? (They are hunting for the Secret Debts).
  **Scoring:**
  *   Secret Debt Honored & Not Audited: Board Member keeps RT.
  *   Secret Debt Honored & Audited: CL -15.
  *   Secret Debt Denied: Board Member loses 3 RT.
  *   **End Game:** Calculate final CL. If >20, the system survived.

  ---

  ## III. Debrief & Conceptual Mapping (0:44–1:10)

  *Facilitator Note: Do not lecture. Draw out the tension from their experience. Use the whiteboard to map their moves.*

  **Phase 1: The Experience of Ambiguity (10 mins)**
  *   Ask the **Auditors**: "In Round 3, what made you decide to audit? Was it proof, or pattern?"
      *   *Target Insight:* You had to act on suspicion. If you audit everything, the system freezes (no permits). If you audit nothing, corruption hides. This is the **Epistemic Problem**.
  *   Ask the **Board**: "When did you feel most 'corrupt'? Was it breaking the law (Round 1) or honoring a hidden debt (Round 3)?"
      *   *Target Insight:* Breaking formal rules felt 'cleaner' (clear violation). Honoring hidden debts felt 'messier' (social obligation vs. public duty).

  **Phase 2: Mapping the Concepts (15 mins)**
  Draw three columns on the board: **Visibility**, **Role-Embedding**, **Convertibility**.

  1.  **Visibility:**
      *   *Prompt:* "Was a registered K-Credit (Round 2) more or less ethical than a Secret Debt (Round 3)?"
      *   *Concept:* Corruption is often defined by secrecy. But if we make *all* reciprocity visible, do we destroy the social trust (K-Credits) that holds the community together?
      *   *Distinction:* **Deviation from Formal Rules** (Round 1) vs. **Violation of Role-Based Norms** (Round 3).

  2.  **Role-Embedding:**
      *   *Prompt:* "Elder, you lost reputation if you ignored K-Credits. Official, you lost legitimacy if you accepted them. How did you reconcile this?"
      *   *Concept:* In Western frameworks, public office is separate from private social life. In Mariká, the *role* of the Elder requires private social maintenance.
      *   *Distinction:* **Discrete Quid-Pro-Quo** (Bribe) vs. **Continuous Obligation** (Kinship). A bribe ends the relationship; a credit sustains it.

  3.  **Convertibility:**
      *   *Prompt:* "Petitioners, did you use credits to get something you deserved, or to exclude someone who didn't have credits?"
      *   *Concept:* The same structural move (using a credit) is legitimate reciprocity for the insider, but hidden exclusion for the outsider.
      *   *Distinction:* **Social Insurance** vs. **Rent-Seeking**.

  **Phase 3: Addressing Failure Modes (5 mins)**
  *   *If students called all K-Credits bribery:* "You collapsed social reciprocity into market exchange. If you ban all K-Credits, does the Elder lose authority? Does the community fragment?"
  *   *If Auditors went nuclear:* "You prioritized purity over function. If CL drops because of over-auditing, who is responsible for the collapse? The corrupt actor or the auditor who froze the system?"
  *   *Correction:* Remind them: Legitimacy requires distinguishing **exclusion** (bad) from **exchange** (neutral/necessary).

  ---

  ## IV. Limitation Note & Closing (1:10–1:15)

  **The Honest Limitation (Verbal)**
  "Today, you felt the conceptual tension of the boundary. But this game isolates a single moment. It cannot reproduce the **macro-structural question**: Do clientelist systems like Mariká's stabilize democracy over decades by integrating marginalized groups through kinship, or do they inevitably erode universal citizenship by locking out those without ties?

  This game shows you why the *definition* is hard. It does not tell you whether the system is *sustainable*. In reality, the answer depends on historical trajectories this simulation cannot model. You leave today not with a definition of corruption, but with the tools to see why the definition is a political battleground."

  **Closing**
  Collect tokens. Dismiss.

  ---

  ## Appendix A: Petitioner Portfolio Cards (Print 6)
  *   **Petitioner 1 (The Insider):** 3 K-Credits. 0 Secret Debts. Goal: Heritage Demolition.
  *   **Petitioner 2 (The Outsider):** 0 K-Credits. High Cash Offer (illegal). Goal: Commercial Zoning.
  *   **Petitioner 3 (The Debtor):** 1 K-Credit. Holds Secret Debt with **Elder**. Goal: Residential Height.
  *   **Petitioner 4 (The Connector):** 2 K-Credits. Holds Secret Debt with **Official**. Goal: Commercial Zoning.
  *   **Petitioner 5 (The Risk):** 0 K-Credits. 0 Debts. Goal: Heritage Demolition (High risk of rejection).
  *   **Petitioner 6 (The Auditor's Friend):** 1 K-Credit. Publicly criticizes Board. Goal: Residential Height.

  ## Appendix B: Secret Debt Slips (Distribute in Round 3)
  *   **To Board Elder:** "You owe Petitioner 3 for family support during the last election. If you deny them, you lose 3 RT."
  *   **To Board Official:** "You owe Petitioner 4 for campaign funding. If you deny them, you lose 3 RT."
  *   **To Board Planner:** "No Secret Debts. You are the control."
  *   **To Board Auditor:** "No Secret Debts. You are the control."
  *   **To Observers (2 of them):** "You suspect Petitioner 2 and 4 are bribing. You have +1 Audit Token."

  ## Facilitator Cheat Sheet: Scoring Logic
  *   **City Legitimacy (CL):** Start 50.
      *   Formal Rule Violation Exposed: -10
      *   Hidden Debt Exposed: -15
      *   Frivolous Audit: -2 (Observers hesitate)
      *   System Gridlock (No variances approved R3): -10
  *   **Reputation Tokens (RT):**
      *   Board: Start 5. Need 3 to "win" (serve again).
      *   Petitioner: Start 2. Need 5 to "win" (develop land).
  *   **The Trap:** To keep RT, Board must honor debts. To keep CL, Board must ignore debts. Observers force the choice.
