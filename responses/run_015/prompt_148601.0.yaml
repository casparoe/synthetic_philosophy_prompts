answer: |-
  ### SCRATCH SECTION: MAPPING AND ELIMINATION

  **Objective:** Translate philosophical IP concepts into Registrar vocabulary.
  **Constraint:** Do not import legal or economic terms that lack material counterparts in the accessioning workflow.

  **1. Lockean Labour-Desert**
  *   *Mapping:* Labour = Drafting/Annotation time. Property = Accessioned Item. Proviso = Public Access Policy.
  *   *Crossed Out:* "Mixing labour with the commons." ~~This implies the paper was unowned before the draftsman touched it. In the museum, the paper was purchased or donated (chain of title) before the drawing existed. The labour is on the object, not the substrate.~~
  *   *Crossed Out:* "Enough and as good." ~~Too abstract.~~ *Replacement:* "Deaccessioning impact." If we publish, do we degrade the value of the original for others?

  **2. Hegelian Personhood**
  *   *Mapping:* Extension of Self = *Autograph* / Hand. Inalienable Rights = Restrictions on Use/Deaccession.
  *   *Crossed Out:* "Moral Rights." ~~This is a legal statute (VARA, etc.).~~ *Replacement:* "Attribution Integrity." The right to be identified as *workshop of* or *autograph*.
  *   *Crossed Out:* "Spirit." ~~Too metaphysical.~~ *Replacement:* "Provenance Gap." The connection between the maker and the object is the spiritual link; breaking attribution breaks the chain.

  **3. Instrumentalist (Utilitarian)**
  *   *Mapping:* Incentive = Future Donations/Grants. Monopoly = Temporary Embargo. Public Domain = Open Access.
  *   *Crossed Out:* "Market Failure." ~~The museum is not a market.~~ *Replacement:* "Resource Stagnation." If we don't share, the motifs die.
  *   *Crossed Out:* "Statutory Bargain." ~~Implies a contract with the state.~~ *Replacement:* "Grant Compliance." The 18-month deadline is the bargain.

  **4. Skeptical (Anti-Property)**
  *   *Mapping:* Non-rivalrous = Pattern vs. Sheet. Ownership = Illusion.
  *   *Crossed Out:* "Idea/Expression Dichotomy." ~~Legal jargon.~~ *Replacement:* "Motif Family vs. Specific Sheet."
  *   *Crossed Out:* "Free Culture." ~~Too ideological.~~ *Replacement:* "Custodianship without Control." We hold the box, not the design.

  ***

  ### TRANSLATION OF ACCOUNTS

  Here are the four accounts restated in your vocabulary, applied to the Halvorsen material.

  #### 1. The Labour-Desert Account (Lockean)
  *   **Core Translation:** Ownership is generated by the physical act of creation (drafting, annotating) mixed with the substrate. The *autograph* sheet is property because labour was expended upon it. The *proviso* requires that your custodianship does not hoard the utility of the work so that others cannot create.
  *   **Ownership of the sheets:** The draftsman owns the *autograph* sheets because their hand and time are materially present in the ink. The museum owns the paper only via chain of title, but the *value* belongs to the labourer.
  *   **Ownership of the pattern:** If the pattern is a *workshop of* product (collaborative labour), ownership is shared among the hands identified in the annotations. If it is a *follower of* an older motif, the labour is merely reproductive, and ownership is weak.
  *   **The 1961 book:** This is a theft of labour. The publisher took the *workshop of* annotations, rescaled them (altering the labour's trace), and removed the attribution. They harvested the desert without the labour.
  *   **Action (18 Months):** You must publish to satisfy the proviso (leave enough and as good for the public), but you must attach the labour to the image. Publish scans with metadata explicitly tagging *autograph* vs. *workshop of*. The Granddaughter's veto is invalid unless she can prove the labour was hers; the Weavers' claim is valid only if they contributed labour.

  #### 2. The Personhood Account (Hegelian)
  *   **Core Translation:** The object is an extension of the maker's will. Attribution is not just credit; it is the integrity of the self. Certain rights are *inalienable*—they cannot be sold or signed away, even if the physical object changes hands.
  *   **Ownership of the sheets:** The museum has *custodianship*, but the sheets retain a metaphysical tie to the maker. The *autograph* sheets are extensions of the founder's hand.
  *   **Ownership of the pattern:** The pattern is part of the maker's personality. It cannot be fully alienated. The 1961 book severed the pattern from the person, creating a "orphaned" identity.
  *   **The 1961 book:** A violation of integrity. By removing attribution, the publisher mutilated the extension of the author. It is not just theft; it is a lie about who the person was.
  *   **Action (18 Months):** Prioritize the Granddaughter. She is the heir to the *personhood* of the founder. If she says "do not publish," she is asserting an inalienable right to protect the integrity of the ancestor's extension. Withhold the *autograph* working drawings. You may publish the 1961 book (as it is already an externalized, alienated version), but mark it as *after Halvorsen*.

  #### 3. The Instrumentalist Account (Utilitarian)
  *   **Core Translation:** Property is a temporary tool to elicit future production. There is no natural right to the object; there is only the *grant* of control to ensure more work gets made. Custodianship is a means to public benefit, not an end.
  *   **Ownership of the sheets:** Irrelevant. The question is: does giving the Granddaughter control encourage future weavers to donate? Or does giving the public access encourage new weaving?
  *   **Ownership of the pattern:** No one owns the pattern unless recognizing that ownership produces more patterns. Since the workshop closed in 1963, the incentive function has failed.
  *   **The 1961 book:** Evidence that the incentive system broke. The publisher exploited the lack of protection. This suggests we need *stronger* control now to prevent future exploitation, OR that the patterns are now public utility.
  *   **Action (18 Months):** Fulfill the grant. The grant is the current "instrument" to elicit public benefit (digitisation). The Granddaughter's wish is sentimental, not instrumental. The Weavers' Association claim is valid *only* if publishing scares them away from the museum. If publishing encourages them to weave, publish everything.

  #### 4. The Skeptical Account (Anti-Property)
  *   **Core Translation:** Ideas and patterns are non-rivalrous. One person's use does not diminish another's. Ownership of a pattern is a category error. You own the *box*, not the *motif*.
  *   **Ownership of the sheets:** You own the paper (accessioned object). You do not own the drawing on it any more than you own the words in a book you bought.
  *   **Ownership of the pattern:** No one can own the pattern. It is a *motif family* that predates the workshop. The annotations are just data.
  *   **The 1961 book:** Inevitable. Patterns flow like water. The lack of attribution is an archival error, not a property violation.
  *   **Action (18 Months):** Publish everything under open licence. The Granddaughter's claim is based on a fiction (that she owns the design). The Weavers' claim is valid only as a request for courtesy, not right. Treat the *autograph* sheets as historical data, not property.

  ***

  ### RESIDUE REPORT

  You asked what remains when the translation is complete. This is the space where your vocabulary exceeds the philosophy, or where the philosophy fails to grasp the museum.

  **1. What the Philosophies Have That You Do Not (The Gaps in Registrar Vocab)**
  *   **The Forward-Looking Bargain:** Your vocabulary is backward-looking (provenance, chain of title). The Instrumentalist account is entirely forward-looking (incentive). *Defect or Clarity?* This is a defect in how registrars talk. You manage the past, but the grant requires you to manage the future. You lack a term for "future utility of the accession."
  *   **The Abundance Claim (Non-Rivalry):** You treat the *original* and the *reproduction* as distinct accession states (original vs. copy). The Skeptical account treats them as ontologically identical regarding the *pattern*. *Defect or Clarity?* This is a defect in the philosophy. In a museum, the *autograph* sheet has aura and material evidence (paper type, ink depth) that a scan destroys. Non-rivalry is false in archival practice; the scan is not the sheet.
  *   **The Proviso (What is left for others):** Locke asks if others have "enough and as good." In a museum, if you digitise the only surviving pattern, have you left "enough"? *Defect or Clarity?* This is a sign the philosopher's claim is less clear than it looked. "Enough" in information is infinite; "enough" in preservation is finite. Your vocabulary handles the finite better than theirs.

  **2. What Your Vocabulary Has That The Philosophies Do Not (The Gaps in Theory)**
  *   **Custodianship Without Ownership:** All four theories assume a binary: either you own it (control) or you don't (public). You operate in a third state: *Custodianship*. You hold the Halvorsen material not because you own it, but because you are the stable node in a broken chain of title. None of the four accounts can model this. They see a gap in title as a failure; you treat it as a stable status (Orphan Works).
  *   **Inalienability as Ethical, Not Legal:** Hegel speaks of inalienable rights, but means legal/moral rights. You practice *ethical inalienability*. You may have the legal right to deaccession the Halvorsen boxes, but you treat them as inalienable because they anchor the region's history. This is a property status the philosophers miss.
  *   **The Claim for Return:** The Weavers' Association is not asking for money (Instrumentalist) or attribution (Personhood). They are asking for *stewardship*. They want a say in how the motif family is treated. This is a claim for *return* without a claim for *title*. It points to ownership not as a bundle of rights, but as a *relationship*.
  *   **Verdict on Residue:** This is not noise. It points to **Stewardship** as a distinct ontological category from **Property**. The philosophers are arguing about who holds the stick; you are arguing about who tends the garden.

  ***

  ### RANKING AND RECOMMENDATION

  I am not going to be even-handed. The Halvorsen material is not a commodity, nor is it purely public data. It is a human trace embedded in a community practice.

  **Ranking of Accounts for this Case:**
  1.  **Personhood Account (Confidence: High):** This fits the "Workshop" structure best. A workshop is a collective person. The *autograph* annotations are extensions of that collective self. The Granddaughter is the heir to that self. This account respects the *inalienable* nature of the connection between the weaver and the weave.
  2.  **Registrar Residue / Custodianship (Confidence: Very High):** While not one of your four, your own vocabulary of *custodianship* is the only framework that can hold the Weavers' Association claim. They are co-custodians of the motif family.
  3.  **Instrumentalist Account (Confidence: Medium):** Useful for the Grant, but dangerous. It treats the material as fuel for future production. It justifies the 18-month deadline but ignores the harm of breaking trust with the Granddaughter and Weavers.
  4.  **Lockean Labour-Desert (Confidence: Low):** Too individualistic. It tries to assign ownership to specific hands (*autograph* vs. *workshop of*), but the value here is in the *overlap* of annotations. It fractures the workshop into competing labourers.
  5.  **Skeptical Account (Confidence: Very Low):** Disastrous. It declares the pattern "unownable" and justifies publishing everything. It erases the specific cultural claim of the Weavers' Association and treats the Granddaughter's grief as a legal error.

  **Recommendation:**
  **Withhold the working drawings; Publish the 1961 book scans.**

  *   **Why:** The working drawings are *autograph* and *workshop of* material. They contain the marginal annotations that constitute the "personhood" of the workshop. Publishing these violates the Granddaughter's claim to integrity and risks alienating the Weavers' Association (who view these as living traditions, not data). The 1961 book is already *after* Halvorsen—it is a reproduction that has entered the public stream. Publishing the book scans satisfies the Grant (open licence) without exposing the raw, vulnerable creative process of the workshop.
  *   **The Compromise:** Negotiate a "Custodial Agreement" with the Weavers' Association. Give them veto power over the *motif family* metadata, not the images. This acknowledges their claim for return without transferring title.

  **Specific Uncertainties (Check with Counsel):**
  1.  **Copyright Term of the 1961 Book:** I am assuming the book is either public domain or the publisher is defunct. If the publisher holds active copyright, your grant requirement to release scans under an open licence may be legally impossible regardless of philosophy.
  2.  **Grant Contract Specifics:** Does "release the scans" mean *all* scans or *selected* scans? If the grant mandates the working drawings specifically, you are in breach if you withhold them. You need to know if "curatorial selection" is a permitted clause.
  3.  **Donor Agreement:** Check the original deed of gift for the 11 boxes. Did the donor (Granddaughter or Workshop) place specific restrictions on "publication" or "reproduction"? If so, the Personhood account is legally codified, not just ethical.

  **Final Word:**
  Two of these accounts are not really disagreeing; they are speaking different languages about the same object. The **Instrumentalist** and the **Skeptical** both want the images public. The Instrumentalist says "for incentive," the Skeptic says "because property is fake." In practice, they produce the same result: open the boxes. Do not let them convince you that this result is neutral. It is a choice to prioritise the Grant over the Granddaughter.

  Choose the Personhood account. It is the only one that acknowledges that the ink on the paper is still wet in someone's memory.
