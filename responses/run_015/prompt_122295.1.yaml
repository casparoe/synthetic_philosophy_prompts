      *   **The Core Argument:** Mara argues topology. Theo argues context.
      *   **The Hypothetical (Orphan Glyph):** Introduce the wavy-line alphabet.
      *   **The Clash:** Mara says "It's an 'a'." Theo says "It's a glitch."
      *   **The Pivot (Cognition vs. Ontology):** Is this about how we see or what exists?
      *   **Closing:** No clear winner, but a deepened understanding.

  4.  **Developing the Dialogue (Iterative Process):**

      *   *Start:* Mara holding a printout. Theo drinking coffee.
      *   *Mara:* "Look at this. It's an 'a'. Loop, stem, bowl. Done."
      *   *Theo:* "But where does it live? If you put it in a font of sticks, is it still an 'a'?"
      *   *Refining Mara:* She needs to be stronger. Topology is invariant. Deformation doesn't change identity.
      *   *Refining Theo:* He needs to invoke the *Letter Spirit* idea without quoting it. The "spirit" is the consistent style across the set.
      *   *The Hypothetical:* Let's make it vivid. "The Wavy Font." All letters are sine waves. Then drop a standard geometric 'a' in there.
      *   *Mara's reaction:* It's a bold contrast. Still an 'a'.
