      *(Self-Correction during drafting)*: Make sure I don't slip into pure semiotics. Keep it about the *letterform*. Theo's point is about the *font's internal logic*, not just language meaning. The 'a' loses its 'a-ness' relative to the 'b' and 'c' of that specific system.

      *(Check constraints)*: No citations. Casual but smart.

