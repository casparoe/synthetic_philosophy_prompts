answer: |-
  The kiln hadn't been fired in three weeks. Instead of clay dust, the air in Northside High's art room smelled of ozone and hot plastic. Maya stared at the row of ring lights set up on the drafting tables, where students were choreographing fifteen-second dances instead of sketching still lifes.

  "It's about visibility, Maya," Principal Henderson said, stepping over a coil of HDMI cables. He looked tired. He wasn't a villain; he was a father of two who coached sophomore soccer. "The District Grant isn't about who makes the best art anymore. It's about the Engagement Score."

  The Score came from the District Optimization Tool, a piece of software bought in 2014 to rank library book circulation. Somewhere along the line, a consultant had tweaked the code to ingest social media metadata. Now, it measured "student enrichment" by counting hashtags, mentions, and share velocity across the three high schools in the district. Only one school would get the arts grant. The others would face budget cuts.

  "It's dumb," Maya said, wiping charcoal from her hands. "We canceled the pottery unit to pay for a influencer marketing firm."

  "We optimized resources," Henderson corrected gently. "If we don't play, Northside loses. If we lose, we lose the AP teachers. You understand."

  Maya understood. That was the worst part.

  Two days later, Henderson drove to a diner halfway between Northside, Eastview, and Westwood. He met with the other two principals in a back booth. They ordered coffee. They were all nice people. They all wanted their students to learn painting, music, and theater. They agreed, verbally and sincerely, to stop the arms race. They would ignore the Score. They would fund actual art. They would let the grant go to whoever happened to win naturally.

  They shook hands. It felt like peace.

  On Monday morning, Maya walked into the art room. The ring lights were gone. A easel stood in the center. She smiled. Then Henderson's phone buzzed. Then it buzzed again.

  An email from the District: *Weekly Rubric Update.*

  The algorithm was opaque. It wasn't malicious; it was just iterative. Every week, the weighting shifted to prevent "stagnation." This week, the weight for "external verification" had tripled. Organic posts wouldn't count. You needed paid boosts. You needed influencers.

  Maya watched Henderson stare at his phone. She saw the calculation behind his eyes. If Eastview or Westwood cheated—and why wouldn't they? The rubric changed weekly, so trust was mathematically irrational—Northside would be crushed. The grant wasn't just money; it was survival.

  "Mr. Henderson?" Maya asked.

  He looked up, apologetic. "Maya, put the easel away. Bring the lights back out. We need to hire a TikToker from the city."

  "But we agreed," she said. "You said we'd stop."

  "I know," he said, his voice hollow. "But if I don't, and they do, I'm responsible for losing your AP classes. I can't be the only one who cooperates."

  That afternoon, Maya sat in the library. She pulled up the District Optimization Tool's public dashboard. It was just numbers. Green bars rising and falling. No names, no faces. Just data points consuming resources. She realized there was no one to fight. There was no evil superintendent twirling a mustache. There was just the code, written years ago for a different purpose, now dictating the value of their education.

  It was a machine with no owner. It didn't hate them. It just required fuel. The fuel was their integrity.

  She opened her phone. Northside's official account posted a video: *#NorthsideCreatives #DistrictArts.* It was polished. It was empty.

  Ten minutes later, Eastview posted. They had hired a bigger influencer.
  Twenty minutes later, Westview posted. They had bought ad space.

  The bars on the dashboard moved. Northside was losing.

  Maya watched Henderson walk back into the art room. He looked sick. He picked up a phone and dialed the marketing firm they had sworn to drop. "Yeah, hi. It's Henderson. We need the premium package. Immediately."

  He hung up and saw Maya watching. He didn't yell. He didn't defend himself. He just looked defeated. The trap had snapped shut not because anyone wanted it to, but because nobody could afford to be the first to let go.

  "Is it worth it?" Maya asked.

  Henderson looked at the kiln, cold and silent. "If we win, we keep the art program next year. Maybe we can fix it then."

  "But the rubric changes next week," Maya said.

  "I know."

  He turned away to draft a press release. Maya picked up her charcoal. There was no paper left, only storyboards for social media campaigns. She drew on the back of a budget sheet. She drew a circle with no exit.

  Outside, the notification pinged on everyone's phone. *Westview surges in engagement.*

  Henderson's phone lit up. He didn't look at it. He just opened his email to authorize more spending. The system churned on, consuming the art it was supposed to fund, fed by good people who knew exactly what was happening and couldn't stop it.
