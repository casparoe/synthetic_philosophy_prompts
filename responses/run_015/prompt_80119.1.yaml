answer: |-
  Your intuition is spot on: the sleight of hand happens exactly where you suspected, between steps (2) and (3). Your group-mate's argument relies on erasing the **temporal dimension** that distinguishes the etiological account from the causal-role account.

  Here is the breakdown of where the argument fails, why it looks tempting, and the philosophical price of fixing it.

  ### The Step to Reject: Step (3)
  You should reject **Step (3)**: *"So a trait's function is just what it currently does causally to boost its fitness."*

  This step is a non-sequitur. It does not follow from (1) and (2). Steps (1) and (2) are both phrased in the **past tense** ("was selected," "was a causal contribution"). They establish that the function is grounded in *ancestral history*. Step (3) suddenly switches to the **present tense** ("currently does").

  The etiological account (Millikan, Neander, etc.) explicitly denies (3). On the etiological view, a trait has a function because its *ancestors* performed that function and thereby contributed to fitness, leading to the trait's proliferation. Whether the *current* trait performs that function is irrelevant to whether it *has* the function. This is precisely how the etiological account saves the phenomenon of malfunction: a heart has the function of pumping blood because ancestral hearts pumped blood (causing reproduction), even if *this* specific heart currently fails to do so.

  ### Why Step (3) Looked Fine on the Page
  The inference looks valid because it mimics a transitive property ($A=B$, $B=C$, therefore $A=C$), but it hides a variable change:
  *   (1) Function = **Past** Selection
  *   (2) **Past** Selection = **Past** Fitness Contribution
  *   (3) Therefore, Function = **Present** Fitness Contribution

  It looks fine because in many ordinary contexts, what a trait was selected for and what it currently does align. Most hearts do pump blood. The argument exploits this statistical normalcy to slide from "historical reason for existence" to "current causal capacity." It conflates the *etiology* of the trait (why it is here) with the *disposition* of the trait (what it is doing now).

  ### The "Selected For" Ambiguity
  You asked if the problem lies in different readings of "selected for." Yes, but the error is located in how Step (3) utilizes that reading.
  *   **Reading A (Etiological):** "Selected for" refers to a historical relation between ancestral tokens and reproductive success. (This is what (1) and (2) use).
  *   **Reading B (Causal/Propensity):** "Selected for" refers to a current disposition or capacity to contribute to survival. (This is what (3) assumes).

  The etiological account needs **Reading A** to hold. It requires that "selected for" is a historical fact, not a current disposition. Your group-mate's argument forces Reading B in the conclusion while claiming to derive it from Reading A in the premises.

  ### The Cost of Rejecting Step (3)
  By rejecting (3) and keeping (1) and (2), you are committing to **historical essentialism** about biological functions. Here is what you pay for that:

  1.  **Intrinsic Indiscernibility:** You must accept that two intrinsically identical traits can have different functions based solely on their history. (e.g., A perfect duplicate of a heart created by a lightning strike in a swamp ["Swampman"] has no function, while a heart born of reproduction does, even if they are molecule-for-molecule identical).
  2.  **Vestigial Functions:** You must accept that a trait can retain its function even if it no longer contributes to fitness at all (e.g., the human appendix or a broken heart), provided its ancestors did contribute.
  3.  **Epistemic Opacity:** Determining function becomes an empirical historical investigation rather than a structural analysis. You can't just look at the organ to see what it does; you have to know its evolutionary lineage.

  These are standard costs of the Millikan view, but they are necessary to preserve the intuition in (6) that malfunction is real. If you accept (3), you save analytic simplicity but lose the ability to distinguish a broken heart from a stone.

  Verdict: 3
