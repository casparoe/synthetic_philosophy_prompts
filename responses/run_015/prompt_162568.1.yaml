      *   The Friend is right that Coarse Evidence = Huge Update.
      *   The User's Step (5) "None of that depends on... how precisely you can point" is **FALSE**.
      *   The cancellation *depends entirely* on the likelihood being exactly $1/N$.
      *   If the evidence is "I am in set $S$," Likelihood is $|S|/N$.
      *   Posterior $\propto N \times (|S|/N) = |S|$.
      *   If $|S|$ is constant across hypotheses (e.g. "First 1%"), then Posterior $\propto$ Prior(SIA) $\propto N$.
      *   So the update returns!
      *   So Step (5) is the broken step. The cancellation is fragile. It only works for maximally specific evidence.
      *   This is a huge insight. The "No Update" result is a knife-edge case.
      *   So, which step to give up?
