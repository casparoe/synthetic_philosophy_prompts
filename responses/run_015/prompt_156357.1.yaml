answer: |-
  # Session Plan: The Mirror and The Void
  **Time:** 90 Minutes  
  **Participants:** 10 Grad Students  
  **Materials:** 20 identical opaque envelopes, index cards, poker chips (tokens), pens.  
  **Stakes:** Top token holder buys coffee for no one (they are exempt); lowest holder buys for the top holder. (Keeps stakes social but low-risk).

  ## 0:00 – 0:10 | Setup & Stakes
  **Action:** Distribute 10 tokens to each student. Place a "Bank" of 100 tokens at the front.
  **Instructions:** 
  1.  "We are running two decision rounds. You will keep your tokens. At the end, the person with the most tokens is exempt from buying coffee next week. The person with the fewest buys for the winner."
  2.  "No talking during rounds. Put phones away. You are reasoning in a vacuum."
  3.  "Do not ask me about the rules unless the text is unclear. I will not clarify strategy."

  ## 0:10 – 0:40 | Round 1: The Reasoning Mirror
  **Goal:** Induce the pull of superrational coordination (Hi-Lo with temptation) and expose the Common Knowledge gap.

  **Setup:** 
  1.  Pair students randomly (5 pairs). Sit them back-to-back or with a folder barrier so they cannot see each other's hands.
  2.  Hand each player a **Decision Sheet** and a **Mirror Sheet**.

  **Rules (Printed on Sheet):**
  *   **Choice:** Select **A** or **B**.
  *   **Payoffs:**
      *   Both choose **B**: You get **100** tokens.
      *   Both choose **A**: You get **1** token.
      *   Mismatch (You **A**, Them **B**): You get **101** tokens.
      *   Mismatch (You **B**, Them **A**): You get **0** tokens.
  *   **Mirror Task:** On the separate Mirror Sheet, write down: "I predict my partner will choose ___."
  *   **Procedure:** 
      1.  Fill out Decision Sheet (A/B). Fold it.
      2.  Fill out Mirror Sheet (Prediction). Fold it.
      3.  Place both in an envelope. Seal it.
      4.  Hand to facilitator.

  **The Reveal (0:30):**
  1.  Return envelopes to pairs.
  2.  Open simultaneously.
  3.  **Score:** Facilitator reads the matrix. Students calculate tokens.
  4.  **The Mirror Check:** Ask pairs to open the second sheet. Compare *Choice* vs. *Prediction*.

  **Facilitator Note (Silent Observation):** 
  Watch for the "Hope/Trust Gap." 
  *   *Superrational:* Choose B, Predict B.
  *   *Standard Rational:* Choose A, Predict A.
  *   *The Break:* Choose B, Predict A (Wishful thinking; "I'll be nice, but they'll screw me").
  *   *The Exploiter:* Choose A, Predict B (Calculated defection).

  ## 0:40 – 0:70 | Round 2: The Luring Envelopes
  **Goal:** Collapse the symmetry argument by introducing non-agentic uncertainty (Nature).

  **Setup:** 
  1.  Bring out a large bag containing **20 sealed envelopes**.
  2.  **Secret:** 17 envelopes contain a slip saying **"WIN"**. 3 envelopes contain a slip saying **"VOID"**.
  3.  **The Bank:** Remind them the Bank has **100 Tokens** remaining from the start (reset the bank visually to 100 for this round to make the division clear).

  **Rules (Printed on Card):**
  *   **Action:** You may claim **any number** of envelopes from the bag (0 to 20). Write your name on the claim slip.
  *   **Payout:** Each **"WIN"** slip you claim pays **10 Tokens**.
  *   **The Catch:** All payouts are drawn from the **100 Token Bank**. If total claims exceed the bank, all payouts are scaled down proportionally (Bank / Total Winning Claims).
  *   **VOID Slips:** Count toward your *number of claims* for the scaling calculation, but pay **0**.
  *   **Secrecy:** Do not open envelopes until everyone has submitted claims.

  **Procedure:**
  1.  Students write down how many envelopes they want.
  2.  Facilitator distributes that many envelopes to each student (sealed).
  3.  Collect claim slips.
  4.  **The Reveal:** Students open envelopes. Tally total "WIN" claims.
  5.  **Calculate:** 
      *   Example: Class claims 50 envelopes total. 40 are WINs, 10 are VOIDs.
      *   Bank (100) / Total WIN Claims (40) = 2.5 tokens per win.
      *   A student with 5 WINs gets 12.5 tokens.
      *   A student who claimed 10 envelopes (5 WIN, 5 VOID) wasted effort on the VOIDs (which increased the divisor if rules count VOIDs as claims, or just wasted opportunity). *Correction for logic:* To make the "symmetry collapse" sharp, **VOIDs should count toward the divisor** (they are claims on the bank that yield nothing). 
      *   *Revised Rule for Maximum Impact:* "Payout = Bank / Total Envelopes Opened by Class." (This is the true Smullyan Luring Lottery). 
      *   *Why:* If everyone opens all 20 envelopes (200 total), payout per envelope = 0.5. Even if you hold a WIN, you get almost nothing.
      *   *Symmetry Trap:* "If I don't open it, someone else will." -> Everyone opens all -> Value collapses.

  **The Twist Execution:**
  1.  Students submit claims. (Predictably, many will claim multiple or all to "maximize chance").
  2.  Reveal the **3 VOIDs** only *after* claims are locked.
  3.  Calculate payouts. Show how the "greedy" symmetric move (claim all) diluted the pot to near zero.

  ## 0:70 – 0:90 | Debrief: Constructing the Theory
  **Do not lecture.** Draw three columns on the board: **Mirror**, **Lottery**, **Break**. Ask them to fill it in.

  **Prompt 1 (The Mirror):** "Look at your Round 1 sheets. How many chose B but predicted A?"
  *   *Expected:* High cluster. 
  *   *Concept:* **Common Knowledge.** Superrationality requires knowing *they know* you know. The prediction sheet revealed you didn't trust the loop. You treated them as a *variable*, not a *mirror*.

  **Prompt 2 (The Lottery):** "Why did the pot collapse? Who reasoned symmetrically?"
  *   *Expected:* "I thought if I didn't claim, I'd lose out."
  *   *Concept:* **Agency vs. Nature.** In Round 1, the opponent is a mind like yours. In Round 2, the envelopes are *fixed*. The 3 VOIDs were always there. Your reasoning cannot change the physical distribution of VOIDs.
  *   *Key Insight:* Superrationality works on *minds* (correlated reasoning). It fails on *matter* (independent probability). The "3 empties" break the symmetry because the envelopes do not reason back.

  **Prompt 3 (The Limitation):** "In the textbook thought experiment, you are alone in a room. Here, you saw faces. Did that help or hurt?"
  *   *Honest Admission:* "It hurt the purity. You were reacting to *them*, not the *logic*. In the true Luring Lottery, you don't know who the other claimants are. Here, you could see who was greedy. That social pressure is a variable the math doesn't capture."

  ---

  ## Facilitator Notes: Predictable Breaks & Fixes

  **1. The Envelope Thickness Check**
  *   **Prediction:** Within 30 seconds of Round 2, someone will squeeze the envelopes to feel the slip inside.
  *   **Fix:** Use heavy cardstock for slips. If caught, do not scold. Note it: "You just tried to break the information symmetry physically. That's a rational move, but it changes the game from *reasoning* to *sensing*."

  **2. The Mirror Clustering (Shame Avoidance)**
  *   **Prediction:** Students will write "Predict B" even if they chose A, to appear cooperative on the paper trail.
  *   **Fix:** Make the Mirror Sheet anonymous (no names). Collect them separately. Reveal the *aggregate* stats only ("3 people trusted, 7 hedged"). This preserves psychological safety while showing the data.

  **3. The Lottery Math Confusion**
  *   **Prediction:** Students will struggle with the divisor calculation during the reveal.
  *   **Fix:** Pre-calculate the scenarios on a hidden sheet. "If everyone claimed 5, you'd get X. You claimed 12, so you got Y." Keep the arithmetic fast so the *feeling* of loss remains visceral.

  ## Honest Limitation: The Social Contaminant
  **You asked what this can't reproduce:** The **Solitary Condition**.
  *   **The Argument:** Hofstadter's and Smullyan's arguments rely on you reasoning in isolation, where the *only* link to others is the logical deduction that "they are like me."
  *   **The Reality:** In this seminar, the link is *social*. They see each other. They want to win the coffee bet. They want to look smart.
  *   **The Consequence:** In Round 1, they aren't testing "Superrationality"; they are testing "Trust." In Round 2, they aren't testing "Logical Correlation"; they are testing "Competitive Greed."
  *   **Debrief Point:** Acknowledge this. "The theory assumes you are a brain in a vat reasoning about other brains in vats. Today, you were 10 grad students worrying about coffee. The *pull* you felt was real, but the *purity* of the logic was contaminated by the fact that you could see who was hedging. The theory requires you to be unable to see the hedge."

  ## Materials Checklist
  *   **Tokens:** 200 total (10 per student + 100 bank).
  *   **Envelopes:** 25 small (for Round 1 submissions), 20 large (for Round 2 lottery).
  *   **Slips:** Heavy cardstock (to prevent thickness tells).
  *   **Sheets:** Decision, Mirror, Claim Slips.
  *   **Bag:** Opaque for the lottery.

  ## Why This Design Works
  1.  **No Upfront Theory:** They experience the *tension* before they have the *vocabulary*.
  2.  **The Mirror:** Forces them to externalize their belief about the other's mind. It makes the "Common Knowledge" gap visible on paper.
  3.  **The Void:** The 3 empty envelopes are the physical anchor. They prove that *some things in the universe do not reason*. This creates the boundary condition for superrationality (Works on Minds, Fails on Matter).
  4.  **The Coffee:** Low-stakes competition ensures they actually try to maximize points, preventing the "let's all just cooperate" moralizing that kills game theory demos.
