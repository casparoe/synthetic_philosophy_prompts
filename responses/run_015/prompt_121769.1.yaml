answer: |-
  You have identified a real structural breakdown, and you are not being picky. There isn't one single catchy noun (like "The Godel Glitch") that covers it universally, but there is a precise philosophical carving for it. It is best described as a **Teleological Category Mistake** leading to **Presupposition Failure**.

  Here is the exact boundary and how it differs from standard infinite regress.

  ### 1. The Core Mechanism: Purpose is Relational
  The reason the kidney question stops and the existence question doesn't is that "purpose" (teleology) is a **relational property**.
  *   **Local:** A kidney has a purpose *relative to* the body. (X exists for the sake of Y).
  *   **Global:** Existence has a purpose *relative to*... what?

  When you ask for the point of the kidney, you are asking for a relationship *within* a system. When you ask for the point of existence, you are asking for a relationship *outside* the system. Since "existence" (in this context) implies the totality of things, there is no "outside" for it to be "for."

  The glitch occurs because language allows us to grammatically construct the question ("What is the purpose of everything?") even though logically, the required relationship cannot exist.

  ### 2. The Established Concept: Category Mistake
  The most precise established label for this is a **Category Mistake** (coined by Gilbert Ryle).
  *   **Definition:** Treating a concept as if it belongs to one logical type when it actually belongs to another.
  *   **Application:** You are treating "The Universe/Existence" as if it were an object *within* a context (like a kidney in a body), when it is actually the *context itself*.
  *   **Why it fits:** Asking for the purpose of the total system is like asking "Where is the universe located?" Location requires a container; the universe *is* the container. The question isn't hard to answer; it's malformed.

  ### 3. How It Differs from Infinite Regress
  This is the critical distinction you asked for.
  *   **Infinite Regress:** Implies a chain of justification where every link is valid, but there is no first link. (A needs B, B needs C...). Theoretically, if the chain ended, the logic would hold.
  *   **This Glitch (Presupposition Failure):** The chain isn't just endless; the *first step* is impossible. It's not that you haven't found the answer yet; it's that the question demands a "container" for the "all."
      *   *Regress:* "I need a reason for that reason." (Potentially solvable with a foundational axiom).
      *   *This Glitch:* "I need an external beneficiary for the totality." (Structurally impossible by definition).

  In logic, this is often called a **Pseudo-question** (Logical Positivism) or a **Transcendental Illusion** (Kant). Kant argued that human reason inevitably tries to step outside the conditions of experience to judge the "unconditioned" whole, which creates an illusion of a solvable problem where there is none.

  ### 4. The Boundary: Internal vs. External Frames
  The exact boundary that separates "deep curiosity" from "scaling failure" is **System Closure**.
  *   **Valid Question (Internal):** Asks for function *within* a defined boundary. (Kidney -> Body; Human -> Society; AI -> User).
  *   **Invalid Question (External):** Asks for function *of* the boundary itself, without positing a meta-system.

  When someone rejects "survival" as the point of life by asking "But what's the point of survival?", they are refusing to accept the biological system as the closing frame. They are demanding a *meta-biological* frame. If they reject that too, they are effectively demanding a "View from Nowhere"—a perspective outside of existence looking in.

  ### Summary
  The phenomenon is a **Teleological Category Mistake**. It differs from infinite regress because it is a **structural impossibility** (asking for a relation without a relatum) rather than a **linear endlessness**. The boundary is crossed when the question stops asking for function *within* a system and starts asking for function *of* the system, without providing a meta-system to house it.
