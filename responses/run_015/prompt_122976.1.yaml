prompt: |-
  Hey — I run the research team at an international health NGO. Several times a year we write an interview guide or survey module in English, our field staff translate it into about a dozen languages, and then we compare the answers across countries and move real money around based on the differences. I've started to worry that a good chunk of what we read as "people in country X care less about Y" is really an artifact of what their language makes easy or hard to say.

  Where I've landed on the theory: the strong Sapir–Whorf thing (language determines what you can even think) looks dead, but some weaker version seems hard to deny — that a language shapes what you're *obliged* to encode in order to say anything at all, what sits on the tip of your tongue, and what takes a whole clause to get across. (There's an idea I half-remember, Slobin I think, that the effect is mostly on what you have to work out while you're speaking rather than on thought in general.)

  Here's what I want: turn that into a procedure my team can run on an item before we field it. Concretely — we have no budget for ethnography, our country leads are smart but have no linguistics training, sign-off is the country director, and usually I have a day or two, not a month. So: the questions in order, what counts as a good enough answer to each, where the procedure stops with a "don't field this cross-nationally," and where it has to hand the decision to a person because it's a values call rather than a factual one.

  Some things I specifically want in it:

  My stab at the key distinction is three-way: does the language *force* you to mark the distinction every time you open your mouth (grammatically), does it just make it *cheap* — one ready-made word, easy to reach for — or is it merely *unsayable* without a whole clause or a loan word? Fix that if it's wrong.

  For my purposes I genuinely don't care whether an effect is reshaping thought or only reshaping what people say when you put a question to them, since either one wrecks a cross-country comparison. Tell me if that's a mistake and it matters which it is.

  I also want a step where we write down, *before* seeing any data, which direction the language should push the answer and roughly how much — if we can't say which way, we shouldn't use the item. And for anything big enough to move money, some kind of non-verbal or behavioural cross-check of the same construct.

  Then run it on three of our actual items:

  1. A confidence question: "How confident are you that the clinic will be open next time you go," scored 1–5. In one of our languages, when you talk about a future or past event you have to grammatically mark whether you saw it yourself, were told it, or inferred it — evidentiality, I think it's called. Respondents there score consistently low and the country team reads that as "they don't trust us."

  2. A wayfinding question: we ask people to describe the route they took to the clinic and where they'd put a sign, and we code the answers for spatial detail. At one site the language doesn't really have a way to say "to the left of the door" without using cardinal directions — people say north-side and so on as a matter of course, even indoors. Our coding scheme was built for left/right answers, so those responses look vague to us.

  3. The one I won't like: our flagship "trust in the health system" battery, which our regional strategy and the last two board reports are built on. In two of our languages the nearest natural word to "trust" isn't about institutions at all — it's about a particular person you have a relationship with, or it's bound up with reciprocity and exchange. So low scores there may mean something entirely different. Run the procedure on this and tell me what it says even if it says I have to stop reporting a comparison I've been reporting for two years.

  Also give me at least one item where the honest output is "this is fine, field it as is," so I know the procedure isn't just a no-machine. And tell me plainly what it can't do.

  On confidence: be clear about what's settled among people who actually work on this versus what they're still fighting about. I've gathered that some of the famous experiments in this area have had replication trouble, and I don't want to build a step on one of those and find out a year later. If any step rests on a contested result, flag it and say what breaks if the result is false — and don't soften it if the honest verdict is that the weak version I've committed to is itself less secure than I think. No citations or further reading, I have no library access out here and won't chase them. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Research team lead at an international health NGO.
      *   **Problem:** Cross-country survey comparisons might be artifacts of linguistic differences (weak Sapir-Whorf/Slobin's "Thinking for Speaking"), not actual differences in attitudes/behaviors. This affects funding decisions.
      *   **Constraints:** No budget for ethnography, country leads have no linguistics training, sign-off by country director, tight turnaround (1-2 days).
      *   **Goal:** A concrete, step-by-step procedure to vet survey items *before* fielding.
      *   **Specific Requirements:**
          *   Refine the user's 3-way distinction (forced grammatical vs. lexically cheap vs. unsayable/clunky).
          *   Address whether it matters if it's thought vs. speech (user says no, need to verify).
          *   Include a step for predicting direction/magnitude of bias *before* data collection.
          *   Include a requirement for non-verbal/behavioral cross-checks for high-stakes items.
          *   Run the procedure on 4 specific items (Confidence/Evidentiality, Wayfinding/Spatial, Trust/Semantic, + one "fine" item).
          *   Be honest about settled vs. contested science (no shaky replication claims).
          *   No citations/further reading.
          *   American English.
          *   Tone: Direct, practical, authoritative but humble about limits.

  2.  **Deconstruct the Theory (Slobin/Whorf):**

      *   *User's Theory:* Strong Whorf (language determines thought) is dead. Weak Whorf/Slobin ("Thinking for Speaking") is viable. Language shapes what you *must* encode to speak.
      *   *Refinement:* The user's 3-way distinction is good but needs tightening for a non-linguist audience.
          *   *Obligatory:* Grammar forces it (e.g., tense, evidentiality, gender).
          *   *Available:* Lexicon exists, easy to use (e.g., specific color terms, specific spatial terms).
          *   *Resistant:* Requires periphrasis, loan words, or feels unnatural (e.g., abstract institutional concepts in relationship-based languages).
      *   *Thought vs. Speech:* User says it doesn't matter for their purpose. *Verdict:* They are right. For survey methodology, measurement equivalence is the goal. If the *measure* yields different data due to language processing, the comparison is invalid, regardless of underlying cognition.
      *   *Replication/Science Status:* The "Thinking for Speaking" hypothesis (Slobin) is generally more robust than strong Whorfianism, but specific effects (like color or spatial framing) vary in replicability. I need to be careful not to base the procedure on specific, contested experiments (like the Berinmo color study which had issues), but rather on established translation equivalence principles used in survey methodology (TRAPD, etc.) augmented by linguistic typology.

  3.  **Drafting the Procedure (The "Linguistic Risk Audit"):**

      *   *Goal:* Fast, actionable, requires no linguistics PhD.
      *   *Steps:*
          1.  **Identify the Construct:** What are we actually measuring?
          2.  **The Encoding Check (The 3-way distinction):** Is this obligatory, available, or resistant in the target language?
          3.  **The Directional Prediction:** If there's a bias, which way does it push? (Crucial step requested).
          4.  **The Stakes Check:** Does this move money? If yes, need behavioral cross-check.
          5.  **The Decision:** Field, Modify, or Drop.

  4.  **Refining the 3-Way Distinction:**

      *   User's: Force (grammar), Cheap (word), Hard (clause).
      *   My refinement:
          1.  **Obligatory Encoding:** Grammar *forces* you to say it (e.g., evidentiality, gender, number). High risk of artifact.
          2.  **Lexical Availability:** A specific word exists and is common. Low risk.
          3.  **Conceptual Resistance:** The concept doesn't map; requires explanation or feels wrong. High risk of validity error.

  5.  **Addressing the "Thought vs. Speech" Question:**

      *   User asks if it matters.
      *   Answer: For *survey validity*, no. If the prompt triggers different cognitive processing or social signaling due to language, the data isn't comparable. I will validate this stance.

  6.  **Developing the Test Cases:**

      *   *Item 1 (Confidence/Evidentiality):*
          *   Issue: Obligatory evidentiality (grammar forces you to say how you know).
          *   Effect: Respondents might score low because they can't grammatically claim knowledge about the future without evidence.
          *   Verdict: High risk. Needs modification (remove future tense or change scale).
      *   *Item 2 (Wayfinding/Spatial):*
          *   Issue: Lexical availability (Absolute vs. Relative frame of reference).
          *   Effect: Coding scheme bias. "North" is precise, but coded as "vague" because it's not "Left".
          *   Verdict: Fix the coding, not the language. Fieldable with coding adjustment.
      *   *Item 3 (Trust/Institutional):*
          *   Issue: Conceptual Resistance. "Trust" maps to interpersonal reciprocity, not abstract systems.
          *   Effect: Low scores mean "I don't have a personal patron," not "The system is bad."
          *   Verdict: **STOP.** Do not compare cross-nationally. This is the hard truth the user asked for.
      *   *Item 4 (The "Fine" Item):*
          *   Need something universal. Basic demographics or concrete behavior. "Did you wash your hands today?"
          *   Verdict: Field as is.

  7.  **Addressing Scientific Uncertainty:**

      *   Need to flag where linguistics is settled vs. contested.
      *   *Settled:* Translation equivalence is hard. Grammatical categories affect processing speed and attention (Slobin).
      *   *Contested:* Extent to which this alters *permanent* worldview.
      *   *Procedure Safety:* The procedure relies on *measurement equivalence*, which is standard survey methodology, not just psycholinguistics. This makes it safer.

  8.  **Structuring the Output:**

      *   **Introduction:** Validate the theory (Slobin/Thinking for Speaking), confirm the "Thought vs. Speech" stance.
      *   **The Procedure (Linguistic Risk Audit):** Step-by-step, with stop/go criteria.
      *   **The 3-Way Distinction:** Refined definitions.
      *   **The Test Cases:** Running the audit on the 4 items.
      *   **Limitations:** What this procedure can't do.
      *   **Tone Check:** American English, direct, no citations, practical.

  9.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the "Directional Prediction" step too hard for non-linguists?
      *   *Fix:* Make it a "Country Lead + Translator" conversation. They don't need theory, they need to ask "If I say this, does it sound like I'm boasting/guessing/lying?"
      *   *Critique:* The Trust item is the big one. I need to be firm. If the concept doesn't exist, the data is noise.
      *   *Critique:* User wants to know where to hand off to a human for a values call.
      *   *Fix:* Add a "Governance Gate" step. If the data is incomparable but politically necessary, that's a leadership call, not a research call.

  10. **Final Polish:** Check against constraints (no library access, American English, specific items covered). Ensure the distinction between "Obligatory," "Available," and "Resistant" is clear. Ensure the "Thought vs. Speech" answer is explicit.

  *(Self-Correction on the "Thought vs. Speech" issue)*: I need to be careful. While the user says they don't care, technically if it's *only* speech, you can fix it with better prompting. If it's *thought*, the construct itself is different. However, for *survey measurement*, the outcome is the same: non-equivalence. I will affirm their pragmatic stance but note the implication for *fixing* it.

  *(Self-Correction on Evidentiality)*: In languages with obligatory evidentiality (like Turkish or some Andean languages), asking about the future is tricky because you can't have evidence for the future. Often, speakers use specific markers for prediction vs. planning. If the survey forces a "confidence" scale, it might clash with the grammatical requirement to mark uncertainty. I need to make sure the advice reflects this specific grammatical friction.

  *(Self-Correction on Spatial)*: The issue here is coding bias, not respondent bias. The procedure needs to catch *analysis* bias, not just *question* bias.

  *(Self-Correction on Trust)*: This is a conceptual equivalence problem. If the word "trust" implies personal reciprocity, asking about "the health system" creates a category error. The advice must be to drop the cross-national comparison, even if it hurts.

  Let's assemble the response.cw
answer: |-
  Here is the procedure, the theoretical grounding, and the audit of your four items.

  ### Part 1: The Theory and Your "Thought vs. Speech" Question

  **Your theory is sound.** You are describing Dan Slobin's "Thinking for Speaking" hypothesis. The strong Sapir-Whorf hypothesis (language *prisons* thought) is indeed largely rejected. The weak version (language *habituates* attention during the act of speaking) is well-supported and, crucially for you, sufficient to break survey equivalence.

  **Does it matter if it's thought or speech?**
  For your purposes: **No.** You are correct to treat them as the same risk.
  *   **Why:** You are not measuring neural cognition; you are measuring *responses to a prompt*. If Language A forces a respondent to calculate evidential certainty before answering, and Language B does not, the *measurement instrument* is different. A thermometer that measures in Celsius cannot be compared to one that measures in Fahrenheit without conversion. If the language changes the processing cost or the social meaning of the answer, the data is not comparable.
  *   **The Caveat:** If the effect is only "speech" (online processing), you can sometimes fix it by rewording the question. If the effect is "thought" (conceptual availability), you often have to drop the comparison entirely. The procedure below distinguishes these so you know if you can fix it or must kill it.

  **Scientific Stability:**
  *   **Settled:** Grammatical categories (like tense, gender, evidentiality) force speakers to attend to specific information. This affects reaction time and memory encoding during the task.
  *   **Contested:** How long this attention lasts after the speaking stops.
  *   **Risk to Procedure:** This procedure relies on the "Settled" part (online processing and encoding). If the "Contested" part turns out to be false (i.e., language has *no* lasting effect), this procedure becomes overly cautious, but it will not produce false positives. It will not tell you data is valid when it isn't.

  ### Part 2: The Linguistic Risk Audit (LRA)

  This is a 5-step checklist. It is designed for a Country Lead and a Lead Translator to complete in 60 minutes.

  **Step 1: The Construct Definition**
  *   **Action:** Write down the abstract concept in plain English (e.g., "Confidence in future availability," not "Question 4").
  *   **Pass:** You can define it without using the specific survey words.
  *   **Fail:** You can only define it using the survey terms. (Stop. Redefine the construct.)

  **Step 2: The Encoding Check (Your 3-Way Distinction)**
  *   **Action:** The Translator attempts to translate the item into the target language. They must tag the key concept using one of these three labels:
      1.  **Obligatory:** Grammar *forces* the respondent to mark this distinction to form a sentence (e.g., tense, evidentiality, gender, number).
      2.  **Available:** A specific, common word exists. It feels natural to use it here.
      3.  **Resistant:** No direct word exists. Requires a description, a loan word, or feels like "speaking like a foreigner."
  *   **Pass:** Label is "Available."
  *   **Warning:** Label is "Obligatory." (Proceed to Step 3).
  *   **Fail:** Label is "Resistant." (Proceed to Step 4).

  **Step 3: The Directional Prediction (For "Obligatory" items)**
  *   **Action:** If grammar forces a mark, ask: "Does this grammatical requirement make the answer sound more certain, less certain, more personal, or more distant?"
  *   **Requirement:** You must predict the *direction* of the bias (e.g., "This will lower scores by 1 point").
  *   **Pass:** You can agree on a direction and magnitude. (You can field, but must annotate data).
  *   **Fail:** You cannot agree on the direction, or the grammatical mark contradicts the question (e.g., asking for a fact when grammar requires marking it as a guess). **Do not field cross-nationally.**

  **Step 4: The Conceptual Equivalence Check (For "Resistant" items)**
  *   **Action:** If the concept is Resistant, ask: "What is the *nearest* natural concept?"
  *   **Decision:**
      *   If the nearest concept is meaningfully different (e.g., "Trust" = "Personal Reciprocity"), **Stop.** You are measuring different things.
      *   If the nearest concept is the same but clunky, you may field *only if* you add a behavioral cross-check (Step 5).

  **Step 5: The Stakes & Cross-Check Gate**
  *   **Action:** Does this item drive funding or strategic pivots?
  *   **If No:** Field with annotations from Step 3/4.
  *   **If Yes:** You must include a non-verbal or behavioral measure of the same construct (e.g., instead of asking "Do you trust the clinic?", measure "Did you return to the clinic?").
  *   **If Behavioral Measure is Impossible:** **Do not field.** Hand to Country Director for a values call (see below).

  **The Values Call (Human Decision Point)**
  The procedure stops here. If the LRA says "Do not field" but the Board demands the metric:
  *   **Research Lead:** Must sign off that the data is *not comparable*.
  *   **Country Director:** Must sign off that they accept the risk of misallocating resources based on artifacts.
  *   **Rule:** You cannot compare the numbers in a report. You must report them as separate, non-comparable national indicators.

  ---

  ### Part 3: Running the Audit on Your Items

  Here is the LRA applied to your four cases.

  #### Item 1: Confidence in Clinic Opening (Evidentiality)
  *   **Construct:** Expectation of future service availability.
  *   **Encoding Check:** **Obligatory.** The language forces the speaker to mark *source of information* (seen, told, inferred).
  *   **Directional Prediction:** To say "I am confident it will be open," the speaker must grammatically mark how they know. Since it is the future, they cannot mark "seen." They must mark "inferred" or "told." In many evidential languages, marking "inferred" lowers the epistemic certainty of the statement. It sounds like a guess, not a fact.
      *   *Prediction:* Scores will be artificially lower (by 1–2 points on a 5-point scale) because the grammar forces humility/uncertainty.
  *   **Stakes:** Likely affects resource allocation (staffing).
  *   **Verdict:** **High Risk.**
  *   **Action:**
      1.  **Do not field as is.** The grammar fights the question.
      2.  **Modification:** Change the question from "Will it be open?" (Future prediction requiring inference) to "Is it usually open?" (Habitual aspect, which often bypasses strict evidentiality).
      3.  **Cross-Check:** Compare against actual clinic attendance records. If confidence is low but attendance is high, the survey item is invalid.

  #### Item 2: Wayfinding (Spatial Frames)
  *   **Construct:** Spatial memory and navigation ability.
  *   **Encoding Check:** **Available (but mismatched).** The language has precise spatial encoding (cardinal directions), but your *coding scheme* is resistant to it.
  *   **Directional Prediction:** Respondents will provide *more* precise data (North/South) than your team can read. Your team codes "North" as "Vague" because you expect "Left."
      *   *Prediction:* Data looks worse than reality.
  *   **Stakes:** Infrastructure spending (signage).
  *   **Verdict:** **Fieldable, but fix the analysis.**
  *   **Action:**
      1.  **Do not change the question.** The respondents are giving good data.
      2.  **Change the Codebook:** Retrain your coders. "North-side of the door" is high precision, not vague.
      3.  **Note:** This is a rare case where the language is *better* than the survey design. The artifact is in your headquarters, not the field.

  #### Item 3: Trust in Health System (Conceptual Resistance)
  *   **Construct:** Institutional trust.
  *   **Encoding Check:** **Resistant.** The word "trust" maps to interpersonal reciprocity/patronage, not abstract systems.
  *   **Conceptual Equivalence:** The nearest concept is "Do you have a personal relationship with a provider who owes you favors?" This is fundamentally different from "Does the system function reliably?"
  *   **Directional Prediction:** Unpredictable. Low scores could mean "The system is impersonal" (good) or "I have no patron" (bad). You cannot disentangle these.
  *   **Stakes:** **High.** Regional strategy and Board reports.
  *   **Verdict:** **STOP. Do not compare cross-nationally.**
  *   **Action:**
      1.  **Immediate:** Remove this item from any cross-country index. You are comparing apples (institutional reliability) to oranges (personal patronage).
      2.  **Reporting:** You must tell the Board: "In Countries A and B, this metric measures personal relationships. In Countries C and D, it measures institutional reliability. They cannot be aggregated."
      3.  **Cross-Check:** You need a behavioral proxy. "In the last 6 months, if you needed medicine, did you get it?" This bypasses the word "trust." If you cannot field a behavioral proxy, you cannot report on this construct for these countries.
      4.  **Values Call:** If the Board insists on a single "Global Trust Score," you must footnote it as "Methodologically Non-Equivalent." Do not sign off on the validity.

  #### Item 4: Handwashing Behavior (The "Fine" Item)
  *   **Construct:** Recent concrete behavior.
  *   **Item:** "Did you wash your hands with soap yesterday?"
  *   **Encoding Check:** **Available.** Past tense exists. "Soap" exists. "Hands" exists. No obligatory evidentiality for recent personal action (you saw yourself do it).
  *   **Directional Prediction:** None. Social desirability bias exists everywhere, but language doesn't skew it one way.
  *   **Stakes:** Hygiene program funding.
  *   **Verdict:** **Field as is.**
  *   **Action:** Standard translation protocols apply. No linguistic risk audit flags triggered.

  ---

  ### Part 4: What This Procedure Cannot Do

  Be clear with your team about the limits.

  1.  **It cannot fix power dynamics.** If a respondent answers "Yes" because the interviewer is a government official, the LRA won't catch that. That is social desirability, not linguistics.
  2.  **It cannot validate the "Values Call."** If the Country Director says "We will report the Trust metric anyway," the LRA protects *you* (by documenting the risk), but it does not stop the bad decision.
  3.  **It assumes honest translators.** If your translator is tired or uses "Survey Speak" (a pidgin dialect used by NGO translators), they might say a concept is "Available" when it isn't natural for a villager.
      *   *Mitigation:* In Step 2, require the translator to translate it for their *grandmother*, not for the NGO.
  4.  **It cannot detect dialect drift.** A word might be "Available" in the capital city dialect but "Resistant" in the rural dialect where you are actually surveying.
      *   *Mitigation:* The Country Lead must confirm the translation matches the specific survey region, not just the national official language.

  ### Summary of Orders for Your Team

  1.  **Adopt the LRA.** No item moves to programming without the Step 2 Encoding Check signed by the Lead Translator.
  2.  **Trust Item 3 is Poison.** Stop aggregating it. Build a behavioral proxy (utilization rates) for the next board report.
  3.  **Wayfinding is a HQ Error.** Fix your coding team, not the survey.
  4.  **Confidence Item needs Rewording.** Shift from Future Prediction to Habitual Observation to bypass evidential grammar.
  5.  **Accept the Loss.** You will lose the ability to compare some metrics across all countries. That is better than comparing numbers that mean different things. Reallocation of money based on bad data is worse than no reallocation.
