answer: |-
  Welcome, everyone. Thank you for coming into the garden to meet her.

  For those who know me, you know I spend my life thinking about the hard questions of beginning and ending. Usually, I try to keep that work out of the family. But my sister and her partner asked me to speak today because they know I was part of the conversations that led to this moment. They know I helped them weigh the options. And they know that this arrival was not a matter of chance, but of intention.

  We need to be honest about what that means, because she will hear this speech one day.

  Her mother and father were given a choice. Science offered them a glimpse of potential futures, and they had to decide which door to open. One grandmother worried this was playing God. Another guest might say it was no different than picking a paint colour. Both are partly right. It was an act of immense power, and it was an act of mundane hope.

  There is a idea that parents *must* choose the child who will have the easiest, best life. That it is a duty. I want to say plainly: that is not a law of nature. It is a guess. The clinic gave your parents a number, a prediction of health and chance. But no machine can calculate a soul. No figure can predict her kindness, or her stubbornness, or the way she will love us. The number was a map, but it is not the territory.

  I know there is a tension here. If we say we chose her because she was the "best" option, we risk telling her that her worth depends on her score. We risk saying that those who were not chosen, or those living with the conditions screened against, are worth less. I do not believe that. And I do not believe your parents believe that either.

  They did not choose her because she was superior. They chose her because they wanted to minimize suffering. There is a difference between ranking lives and hoping for health. We can hold both truths: that every life has equal worth, and that parents are allowed to hope their child does not have to fight a harder battle than necessary.

  This brings me to the promise of love. Usually, we tell a child, "We would have loved you no matter what." In this case, strictly speaking, that is not true. There were other possibilities that are not here. But the love that matters is not about the past. It is not about which embryo was selected. It is about the future.

  Love is not a judgment of how you arrived. It is a commitment to where you are going.

  So, to my niece: You were wanted before you were known. That is true. But you are not loved because you were chosen. You are loved because you are here. The selection is over. The parenting begins now.

  To the family: Our job is not to validate the choice. Our job is to validate the child. We cannot change the ethics of her conception. We can only ensure the ethics of her upbringing. We must teach her that her life is not a performance to justify a selection. We must teach her that her worth is intrinsic, not comparative.

  We are gathered here to name her. A name is not a prediction. It is a call. It says: we see you, we know you, and we are with you.

  Let us put aside the charts and the scores and the worries. Let us look at the baby. She is not a theory. She is not a verdict. She is a person. And our only duty now is to make sure she knows that she belongs to us, and we belong to her, without condition, without ranking, and without end.

  Verdict: By giving this speech, I commit to supporting my niece's intrinsic worth independent of the selection criteria that brought her into existence.
