      *   Etiological (Millikan, Papineau): Content is fixed by *success conditions* of ancestors. Solves error easily (malfunction). Struggles with novel content (learning).
      *   Current Role (Dretske later, Fodor sometimes, Block): Content is fixed by *current causal dependencies*. Solves novel content. Struggles with error (if I currently cause "cow" by seeing a horse, is it a horse representation?).
