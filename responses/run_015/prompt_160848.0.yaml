answer: |-
  You have diagnosed the symptom perfectly, but I think you have misidentified the underlying pathology. Your hypothesis that this is "three arguments wearing one name" is the most promising lead you have, but your suspicion that the intuition pumps are *secretly epistemological* is where I would push back. That concession lets the metaphysicians off the hook too easily.

  Here is the diagnosis.

  ### 1. The Metaphysics is Real, but Motivated by Explanation
  You suggest the Swampman and vestigial organ cases are epistemological tricks—manipulations of what we *know* about the system. I disagree. When we stipulate a Swampman, we aren't saying "we don't know his history"; we are stipulating "he has *no* history." The intuition clash is genuinely metaphysical. The etiological theorist believes that without a history of selection, there is no normativity, and without normativity, there is no content. The structuralist believes that if the machine works *now*, the history is irrelevant.

  However, you are right that this metaphysical disagreement is *sustained* by explanatory anxieties. The reason nobody moves is that both sides are trying to solve the same problem—the **Disjunction Problem** (how to distinguish representing *cats* from representing *cats-or-retinal-activations*)—using different resources to ground **Normativity**.

  *   **Etiological accounts** ground normativity in **biological function**. A heart represents "pump blood" because that's what it was selected for. If it fails, it misrepresents/malfunctions. This handles error beautifully but makes content rigid and historically locked.
  *   **Current-causal accounts** ground normativity in **asymmetric dependency** or **informational structure**. A state represents "cat" because the cat-causation is primary and the fake-cat-causation depends on it. This handles novelty and learning beautifully but struggles to explain why the error is an *error* rather than just a different causal link.

  The stalemate exists because both sides have captured half of the phenomenon of "mind." Minds are historical products (etiology) that operate in the present (structure). By forcing a choice between them, we are forcing a choice between the *origin* of the norm and the *exercise* of the norm.

  ### 2. The Verdict Divergence (Answering your Prosthesis Case)
  You asked if there are cases where the accounts give genuinely different verdicts, not just different stories. You suspect the answer is "no" because history and structure usually correlate.

  The answer is **yes**, but only in pathological cases. Your neural prosthesis example is actually a case of *convergence*, which is why it feels stable. To get divergence, you need to break the link between *design history* and *current operational role*.

  Consider a **repurposed implant**. Suppose engineers design a visual prosthesis (History: selected/designed for vision). It is implanted, but due to neural plasticity, the brain recruits the device to process echolocation data, and it does so stably for twenty years. The visual function atrophies; the echolocation function becomes the dominant causal role.

  *   **Etiological Verdict:** The device represents *visual features*. Its content is fixed by the selection/intention history of its design. It is currently malfunctioning or being used "off-label."
  *   **Current-Causal Verdict:** The device represents *echolocation features*. Its content is fixed by what it is actually tracking and controlling behavior *now*.

  Here, the verdicts diverge. One says "Visual Error," the other says "Echological Success."

  So, why does the debate stall? Because cognitive science rarely cares about the *metaphysical status* of the content in these edge cases. If the system is tracking echolocation and guiding behavior successfully, the cognitive scientist models it as an echolocation system. The etiological theorist has to say the cognitive scientist is modeling the *wrong* content, even though the model predicts behavior perfectly.

  This reveals that the dispute is not about prediction. It is about **authority**. Who gets to fix the content? The past (evolution/design) or the present (causal integration)?

  ### 3. Where Your Hypothesis Needs Correction
  You wrote: *"I also suspect there's no crucial experiment, because in every system we could actually find or build, selection history and current organization are correlated."*

  This is the core of the stagnation. You are correct that in healthy, mature systems, history and structure covary. Evolution selects *for* structures that work. Therefore, in the domain of empirical psychology, the two theories are **extensionally equivalent**. They assign the same content to the same states in the same organisms 99% of the time.

  If two metaphysical theories are extensionally equivalent across all observable data, the dispute is either:
  1.  **Verbal:** They mean different things by "content."
  2.  **Modal:** They disagree about counterfactuals (Swampman, Vestigial organs).
  3.  **Explanatory:** One offers a better reduction base for scientific practice.

  Your hypothesis treats these as separate problems. I argue they are the *same* problem. The reason the modal cases (Swampman) feel decisive is that they are proxies for the explanatory question. When an etiological theorist says Swampman has no thoughts, they are really saying: *"A science of psychology that ignores selection history cannot explain why errors are errors."* When a structuralist says Swampman has thoughts, they are saying: *"A science of psychology that requires genealogical verification is impossible to practice."*

  ### 4. What Counts as Progress?
  You asked what would count as progress. If I am right that this is a fight over explanatory priority masked as metaphysics, then armchair intuition pumps will never solve it. They will only ever reinforce the pre-existing commitment to either Normativity (Etiology) or Naturalizability (Structuralism).

  Progress would look like one of three things:

  **A. Content Pluralism (The Dissolution)**
  We admit there is no single property of "Mental Content." There is *Historical Content* (relevant for evolutionary biology and developmental psychology) and *Current Content* (relevant for real-time cognitive modeling). We stop asking "Which one is the *real* content?" and start asking "Which notion is useful for this specific explanatory context?" This dissolves the metaphysical stalemate by treating content as a modeling tool rather than a natural kind.

  **B. The Normative Breakthrough (The Metaphysical Win)**
  Someone develops a current-causal account that successfully derives genuine normativity (the possibility of error) without appealing to history. If a structuralist can show how a system can *misrepresent* purely in virtue of its current topology, the etiological position loses its main advantage. (So far, this has not happened to everyone's satisfaction; asymmetric dependency theories usually smuggle in historical premises).

  **C. The Empirical Turn (The Explanatory Win)**
  Cognitive science finds a case where history and structure come apart in a living, behaving system (like the repurposed implant), and one model predicts the *breakdown* better than the other. For example, if the repurposed implant causes specific systematic errors that are only predictable by knowing its original design history, etiological accounts gain empirical traction. If the errors are predictable solely by current connectivity, structuralism wins.

  ### My Recommendation
  I would reject the part of your hypothesis that treats the metaphysical and explanatory questions as separable. They are fused. The metaphysics is driven by the desire to make content safe for science.

  If I were writing your paper, I would argue that the forty-year stalemate is evidence that **Content is not a natural kind**. It is a hybrid concept we use to bridge the gap between physical causation and rational explanation. The etiological theorists are trying to anchor the "rational" end (norms), and the structuralists are trying to anchor the "physical" end (causation).

  The progress you are looking for won't come from a better thought experiment. It will come from abandoning the search for a unified reduction. The "fight" persists because both sides are trying to reduce a pragmatic, interest-relative concept (content attribution) into a mind-independent physical property. They can't do it because it isn't one.

  Stop trying to solve the dispute. Diagnose it as a category error. The verdicts diverge only in cases where our pragmatic interests diverge. In the prosthesis case, if you are the engineer, you care about history. If you are the clinician, you care about current function. The "truth" about the content depends on which question you are asking. That isn't relativism; it's recognizing that content is a relation between a system, an environment, and an interpreter. The theories are fighting over which relata is the essential one. None of them are.
