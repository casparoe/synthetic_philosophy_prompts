      *   *Scenario:* Need a case where the model inflates credibility, but there is *no* downstream human skepticism, OR a case where the model discounts, but there is no downstream harm.
      *   *Better Hypothetical:* A summarization tool that *adds* confidence to a marginalized patient's report (inflation), but the clinician *believes it immediately* and treats aggressively. No delay, no skepticism.
          *   Rule A says: No injustice (Model didn't discount, Clinician didn't discount).
          *   Rule B says: Injustice (Testimonial integrity violated, patient agency removed).
      *   *Alternative:* A tool that correctly summarizes a marginalized patient (no distortion), but the clinician *still* doubts them due to bias.
          *   Rule A: Injustice (Clinician discounted).
          *   Rule B: Injustice (Credibility deficit occurred).
      *   *Refined Hypothetical:* Let's focus on the "Inflation" aspect.
      *   *Hypothetical:* Model inflates confidence. Clinician believes it. Treatment is successful. Patient never knows their words were changed.
          *   Rule A: No Injustice.
