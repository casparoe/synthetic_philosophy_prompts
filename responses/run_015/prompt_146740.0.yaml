      *   **The Wrinkle:** At encoding, the model *inflated* credibility (hedged -> confident). The harm happened later when a *human* clinician trusted the summary over the patient's current report, viewing the patient as unreliable because the record said X but reality showed Y.

  4.  **Develop the Prediction (Task 1):**
      *   *直觉 (Intuition):* This feels like Credibility Injustice. The patient's actual testimony was altered to sound more certain than it was. Later, this altered testimony was used to undermine their current testimony.
      *   *Committee Logic:* They care about "standing as a knower." In Case 1, the model acted as the hearer. Here, the model acts as the *translator/scribe*.
      *   *Prediction:* Verdict: Epistemic Injustice, Credibility Type.
      *   *Implicit Rule:* If a system alters a marginalized speaker's testimony in a way that creates a downstream credibility deficit (even if via inflation at the source), and the speaker cannot correct it, it is credibility injustice.

  5.  **Develop Candidate Rules (Task 2):**
      *   *Need:* Two rules that fit precedents 1-5 but diverge on Case 6.
      *   *Rule A (The "Direct Hearer" Rule):* Injustice occurs only if the *immediate* recipient of the testimony (human or model) discounts the speaker.
          *   Fits Precedents: Case 1 (Model discounted), Case 4 (Queue discounted), Case 2 (Physician corrected, no discount), Case 5 (Model discounted but warranted), Case 3 (No one heard, interpretive).
          *   Prediction for Case 6: **No Epistemic Injustice.** Why? The model *increased* credibility (hedged -> confident). The harm was caused by a *later* clinician reasoning correctly from the (flawed) record. The model didn't discount; it inflated. The later clinician isn't the algorithm's fault directly in terms of *hearing*.
      *   *Rule B (The "Testimonial Integrity" Rule):* Injustice occurs if the system alters testimony in a way that severs the link between speaker and statement, causing downstream credibility harm tracking group membership, without recourse.
          *   Fits Precedents: Case 1 (Alteration/Filtering), Case 4 (Routing = Alteration of access), Case 2 (No alteration of final note), Case 5 (Weighting, not altering text), Case 3 (No vocabulary to record).
          *   Prediction for Case 6: **Credibility Type.** The alteration (stripping hedges) distorted the testimonial act. The downstream harm tracks marginalized status (interpreter patients).

  6.  **Develop Recommendation (Task 3):**
      *   *Coherence:* The Committee's history suggests they care about *recourse* and *tracking*. Case 1 is the closest analog (Model acts as hearer/scribe, patient can't contest). Case 4 is also close (Invisible queue = invisible text).
      *   *The Wrinkle:* The "inflation then deflation" dynamic.
      *   *Principle:* If they choose "None," they adopt the principle that *intent of the algorithm at t=0* matters more than *outcome at t=1*. If they choose "Credibility," they adopt the principle that *systemic distortion of testimony* counts as credibility injustice even if the distortion looks like flattery initially.
      *   *Recommendation:* Argue for **Credibility Type**. Why? Because the "inflation" is actually a *misrepresentation*. It's not giving them more standing; it's giving the *statement* more weight than the *speaker* intended. When the speaker later says "I didn't say that," the record contradicts them. This undermines their standing as a knower of their own body.
