      *   The key distinction is between *discounting* (Case 1) and *distorting* (Case 6). Does distortion count as credibility injustice? Case 1 implies yes, because the model's score replaced the patient's words. Here, the model's words replaced the patient's words.

  10. **Final Review against Constraints:**
      *   No citations? Check.
