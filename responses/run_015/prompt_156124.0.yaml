prompt: |-
  Hey — I'm TAing an intro metaphysics course and I've got the dispositions tutorial next week, one fifty-minute group, first-years who've done counterfactuals (world-similarity, antecedent strengthening, that sort of thing) but nothing on dispositions beyond the slogan that 'fragile' just means 'would break if struck'. I was talking with the other TA and we couldnt agree on how to run it: she wants to open with the counterexamples, I want them to feel the pull of the simple conditional analysis first. What I actually want them to leave with is the sense that the two ways it fails are *seperate* failures — the fink case, where the stimulus itself destroys or removes the disposition, versus the mask case, where the disposition is still there but something blocks the manifestation — and not just two versions of 'the thing didn't break'. So don't write me the explanation; plan how I should run the session.

  The bit I'm least sure about is order: what has to be on the board before the first counterexample lands, whether fink or mask should come first and why, how long to sit with the plain case so the counterexample actually bites, and where the repair attempts belong relative to the two cases — the 'in normal conditions' / ceteris paribus clause, and the move of identifying the disposition with its intrinsic causal basis instead of a counterfactual. Also the example: my instinct is one object in three variants (wine glass: bare / rigged / padded), but I'm worried they'll just learn three labels and never see the structure, so tell me what the carrying example needs and doesn't need and whether a minimal-pair version beats the sci-fi version — they groan at guardian angels and hidden wiring. I was going to try an electrical fuse as a real-world fink, then realised a fuse does conduct for a split second before it melts, which seems to make it useless as a counterexample unless I build the duration into the response. Is that the right way to rescue it, or should I drop it?

  Misconceptions I'm expecting, which I want defused at the point in the sequence where they actually arise rather than in a list at the end: that fink and mask are the same failure; that if the manifestation is blocked the thing was never really fragile; that finks are gerrymandered and couldn't happen in nature; and that 'in normal conditions' fixes everything. Two curveballs I want handled rather than dodged, and I want to know where in the session each fits: (1) my coin-flip fink — a glass wired so that when struck there's a 70% chance a mechanism hardens it, so it usually doesn't break: is this a fink, a mask, or something else, and does it push us toward a probabilistic conditional analysis? (2) a glass that is both padded (mask) and, unknown to anyone, chemically toughened by the padding process ten minutes earlier (fink): which label applies, and is that a real problem or just a boring case of both? Finally, give me one question to put at the end that tells me whether they've got the distinction or just memorised the words — it should be a case they haven't seen — and tell me explicitly what I should refuse to get drawn into at this level (I'd guess dispositional essentialism and the realism-about-powers debate, but tell me what you'd cut).
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an intro metaphysics course.
      *   **Topic:** Dispositions (Simple Conditional Analysis, Finks, Masks).
      *   **Audience:** First-years, 50-minute group, know counterfactuals (Lewis-style similarity, etc.), know the slogan "fragile = would break if struck."
      *   **Goal:** Students must understand that Finks and Masks are *separate* failures of the Simple Conditional Analysis (SCA), not just "thing didn't break."
      *   **Conflict:** Co-TA wants to start with counterexamples; User wants students to feel the pull of SCA first. (User wins, based on the prompt's tone).
      *   **Specific Concerns:** Order of operations (Board work, Fink vs. Mask order), Timing (how long to sit with SCA), Repairs (ceteris paribus, causal basis), Examples (Wine glass variants vs. others, Fuse issue), Misconceptions (Fink=Mask, "never really fragile," "finks are artificial," "normal conditions fixes all"), Curveballs (Probabilistic Fink, Combined Mask/Fink), Exit Question (Novel case testing distinction), Scope Creep (What to avoid).

  2.  **Determine the Pedagogical Strategy:**
      *   *Start with SCA:* Validate the user's instinct. Students need to believe the lie before they can spot the liar.
      *   *Example Choice:* The wine glass is classic for a reason, but needs care to avoid "label learning." A single object undergoing changes is better than three distinct objects. Let's stick with the glass but refine the presentation.
      *   *Fuse Issue:* The user is right to worry. A fuse *does* conduct. A better fink example is needed. The "Sorcerer" case is standard but "sci-fi." A "Self-Shattering Glass" or "Neurotransmitter" analogy might work, but for first-years, a slightly stylized physical case is often clearest. Let's look for a "Finkish" structure that isn't magic. *Idea:* A safety mechanism that detects the strike *before* impact and hardens the surface instantly. Or stick to the "Sorcerer" but frame it as a "black box mechanism" to reduce the "groan." Actually, the prompt mentions they groan at guardian angels. Let's try to find a non-magical fink. *Revised Idea:* A digital lock on a door. Disposition: "Unlocks if key inserted." Fink: Sensor detects key, locks deadbolt instantly. Mask: Key inserted, but mechanism jammed by gum. This avoids the "did it break?" timing issue of the fuse. *Wait, stick to the prompt's preference:* The user likes the wine glass. Let's make the Fink version of the wine glass physically plausible (e.g., smart material).
      *   *Order:* SCA -> Mask (intuitive blockage) -> Fink (counter-intuitive removal). Why? Mask preserves the disposition, making it easier to see the disposition exists despite the counterfactual failing. Fink removes the disposition, making it harder to distinguish from "not fragile." Actually, standard pedagogy often does Fink first (Lewis's priority), but for *distinguishing* them, Mask is often more intuitive first. *Correction:* To highlight the *difference*, start with the case where the disposition *stays* (Mask), then the case where it *goes* (Fink). This sharpens the contrast.
      *   *Repairs:* Introduce "Normal Conditions" after Mask (seems like a fix). Then show Fink kills "Normal Conditions." Then introduce "Causal Basis" as the real fix.
      *   *Curveballs:* Place the probabilistic one after Finks (challenges the binary nature). Place the combined one at the end as a synthesis check.
      *   *Exit Question:* Needs a novel scenario.

  3.  **Drafting the Plan - Section by Section:**

      *   **Pre-Session Board Work:** Need the SCA formula clearly visible. $D \leftrightarrow (S \square\rightarrow M)$.
      *   **Phase 1: The Pull of SCA (0-10 mins):** Establish the intuition. Use the plain wine glass. Get them to commit.
      *   **Phase 2: The Mask (10-20 mins):** The "Padding" case. Disposition stays, Counterfactual fails. Introduce "Ceteris Paribus" repair here.
      *   **Phase 3: The Fink (20-30 mins):** The "Hardening" case. Disposition goes, Counterfactual fails. Show why "Ceteris Paribus" struggles here (is the hardening 'abnormal'?).
      *   **Phase 4: The Real Fix (30-40 mins):** Intrinsic Causal Basis. Move away from counterfactuals to properties.
      *   **Phase 5: Curveballs & Assessment (40-50 mins):** Handle the probabilistic and combined cases. Exit ticket.

  4.  **Refining Specific Issues:**

      *   *Fuse:* Drop it. It introduces timing debates (duration of stimulus) which distracts from the metaphysical point. Use the "Smart Glass" or "Sorcerer" but frame it minimally. Let's suggest a "Safety Coating" that evaporates on impact? No, that's a mask. It needs to remove fragility. "Smart molecules realign on impact." Keep it brief.
      *   *Fink vs. Mask Order:* If the goal is distinguishing them, Mask first is better. Mask = "I'm still fragile, but I won't break." Fink = "I was fragile, but now I'm not (because you hit me)."
      *   *Curveball 1 (Probabilistic):* This challenges the binary SCA. It belongs after the basic Fink/Mask distinction is solid. It shows SCA is too rigid.
      *   *Curveball 2 (Combined):* This is the ultimate test. If they say "it's just both," they get it. If they panic, they don't.
      *   *Misconceptions:* Address "Fink=Mask" during the comparison phase. Address "Normal Conditions fixes all" during the Fink phase. Address "Finks are artificial" by emphasizing structure over magic.
      *   *Scope Creep:* Avoid Dispositional Essentialism, Powers Ontology, and deep Lewisian semantics. Stick to the analysis of the *concept*.

  5.  **Developing the Exit Question:**
      *   Needs to be new. Not a glass. Not a fuse.
      *   Idea: A sugar cube. Disposition: Soluble.
      *   Case: Wrapped in plastic (Mask) vs. Teleported to dry vacuum upon touching water (Fink).
      *   Better: A "Grumpy Dog." Disposition: Bites if provoked.
      *   Mask: Muzzled.
      *   Fink: Provocation triggers a shock collar that sedates it instantly.
      *   Let's go with a **Medication**. Disposition: "Causes drowsiness if ingested."
      *   Mask: Taken with caffeine (blocks effect).
      *   Fink: Ingestion triggers liver enzyme that neutralizes it instantly.
      *   *Decision:* The "Smart Safe" example. Disposition: Opens if correct combo entered.
      *   Mask: Jammed mechanism.
      *   Fink: Keypad detects correct combo, shuffles locks internally before engaging.

  6.  **Review against Constraints:**
      *   50 minutes? Tight. Need strict timing.
      *   First-years? Keep jargon low, logic high.
      *   User's specific worry about "two separate failures"? The plan must explicitly contrast them side-by-side.
      *   User's worry about "three labels"? The plan must focus on the *mechanism of failure*, not the name.

  7.  **Final Polish:**
      *   Make the board plan explicit.
      *   Clarify the "Fuse" advice (drop it).
      *   Ensure the "Normal Conditions" trap is sprung intentionally.
      *   Define the "Do Not Engage" list clearly.

  8.  *(Self-Correction during drafting)*: Wait, the user asked about the Probabilistic Fink specifically. Is it a Fink or Mask? It's a Finkish structure (stimulus triggers change) but probabilistic. It pushes toward Probabilistic SCA. I need to make sure the plan allocates time for this discussion without derailing the main Fink/Mask distinction. I'll put it in the "Repair" section as a limit case for SCA.

      *   *Combined Case:* Glass padded (mask) + chemically toughened by padding (fink). This is tricky. The padding *causes* the fink. This blurs the line. I need to advise the TA on how to handle this: It's a *causal chain* where the mask mechanism *is* the fink mechanism. It shows the categories aren't always mutually exclusive in complex systems, but analytically distinct.

      *   *Exit Question:* Needs to be diagnostic. "Here is a case. Is the counterfactual true or false? Is the disposition present or absent?" If they match SCA, they failed. If they mismatch, they need to identify why.

      *   *Board Plan:* Crucial. Left: SCA. Middle: Mask. Right: Fink. Compare columns.

      *   *Fuse:* Definitely drop. The "conducts for a split second" nuance is a physics trap, not a metaphysics lesson.

      *   *Order:* SCA -> Mask -> Fink -> Repair (Ceteris Paribus) -> Repair (Causal Basis). This flows logically. Mask shows CP is needed. Fink shows CP isn't enough. Causal Basis solves both.

      *   *Misconception "Finks are gerrymandered":* Address this when introducing the Fink. Emphasize *structural* possibility, not technological feasibility.

      *   *Scope:* Cut Powers Ontology, Cut Dispositional Essentialism, Cut detailed Lewisian Sphere of Similarity debates (they know the basics, don't re-litigate).

      *   *Exit Question:* Let's use a "Poison Pill." Disposition: Lethal if swallowed. Mask: Antidote taken simultaneously. Fink: Stomach acid neutralizes it instantly *upon contact* (triggered by swallow).

      *(Final thought on the Probabilistic Curveball)*: The user asks: "Is this a fink, a mask, or something else?" It's a *Probabilistic Fink*. It shows SCA needs to handle probabilities. I should advise the TA to use this to motivate why simple SCA is doomed, not to solve it.

      *(Final thought on Combined Curveball)*: "Which label applies?" Answer: Both. "Is that a problem?" No, it just means multiple things are going on. This tests if they think the labels are mutually exclusive states of the world vs. analytical categories.

      Okay, ready to write the response. Structure: 1. Board Setup. 2. Minute-by-Minute Flow. 3. Example Advice (Glass vs. Fuse). 4. Handling Curveballs. 5. Exit Question. 6. Scope Boundaries.cw
answer: |-
  Here is a 50-minute battle plan designed to force the distinction between Finks and Masks while keeping first-years anchored in the logic rather than the labels.

  ### 1. The Board Plan (Before they walk in)
  Divide the board into three vertical columns. Do not write the headers yet.
  *   **Left:** `SCA: D ↔ (S □→ M)` (Define D, S, M briefly).
  *   **Middle:** Leave blank (for Mask).
  *   **Right:** Leave blank (for Fink).
  *   **Bottom:** Leave blank (for "The Fix").

  **Why:** You need a visual scoreboard. When you move to the counterexamples, you will be filling in the Middle and Right columns. The goal is to make the Middle and Right columns look *different*, not just "Counterexample 1" and "Counterexample 2."

  ### 2. The Flow (50 Minutes)

  **0:00–0:10: The Trap (SCA)**
  *   **Activity:** Don't lecture. Ask: "What does it mean for this [point to imaginary glass] to be fragile?"
  *   **Goal:** Get them to commit to the Conditional Analysis (SCA). Write their consensus on the Left column: *Fragile = If struck, it would break.*
  *   **Crucial Move:** Ask: "So, if I strike it and it *doesn't* break, was it fragile?" They will say "No." Lock this in. This is the premise the counterexamples will destroy.
  *   **Timecheck:** Stop at 10 mins even if they are still convinced. You need the failure to happen in class, not in their reading.

  **0:10–0:20: The Mask (The "Blocked" Case)**
  *   **Example:** The Padded Glass.
  *   **Setup:** "Same glass. I wrap it in bubble wrap. I strike it. It does not break."
  *   **Question:** "According to SCA (Left Column), is it fragile?" (Answer: No, because S □→ M is false). "But intuitively, is it fragile?" (Answer: Yes).
  *   **Board Work:** In the **Middle Column**, write: `S happens`, `M fails`, `D remains? (YES)`.
  *   **The Repair Trap:** Ask: "How do we fix SCA?" They will suggest: *'If struck in **normal conditions**.'*
  *   **Action:** Write "Ceteris Paribus / Normal Conditions" at the bottom. Ask: "Does this fix the Mask?" (Yes, padding is abnormal).
  *   **Why Mask First?** It preserves the disposition. It's the intuitive "blockage." It makes the 'Normal Conditions' fix look promising, which sets up the Fink to demolish it.

  **0:20–0:30: The Fink (The "Vanishing" Case)**
  *   **Example:** The Smart Glass (Avoid the Fuse).
  *   **Advice on the Fuse:** **Drop the fuse.** You are correct; the timing issue (conducts for a split second) invites physics debates that obscure the metaphysics. Use the "Smart Glass" but keep it minimal: "A glass made of molecules that detect kinetic energy and instantly lock bonds *upon contact*." No wizards, no angels. Just "instant hardening mechanism."
  *   **Setup:** "I strike the glass. The mechanism detects the strike *before* the break occurs and hardens the glass. It does not break."
  *   **Question:** "Is the 'Normal Conditions' fix enough?"
  *   **The Bite:** If they say "Hardening is abnormal," push back: "The mechanism is *part of the glass*. How can the glass's own nature be 'abnormal conditions' for the glass?"
  *   **Board Work:** In the **Right Column**, write: `S happens`, `M fails`, `D remains? (NO)` (The disposition is lost *by* the stimulus).
  *   **Contrast:** Point to Middle vs. Right. "In the Mask, the fragility was there but blocked. In the Fink, the fragility vanished because you hit it." **This is the core distinction.**

  **0:30–0:40: The Real Fix (Causal Basis)**
  *   **Diagnosis:** "Normal Conditions" fails because Finks are often intrinsic.
  *   **Solution:** Move away from counterfactuals to **properties**.
  *   **Board Work:** Under "The Fix," write: `D = Intrinsic Causal Basis that *explains* why S □→ M`.
  *   **Explanation:** The glass is fragile because of its molecular structure (the basis), not because of the counterfactual. The counterfactual is just evidence of the basis.
  *   **Check:** Ask: "In the Fink case, did it have the basis *before* I struck it?" (Yes). "So it was fragile, even though the counterfactual was false."

  **0:40–0:45: The Curveballs (Handling Complexity)**
  *   **Curveball 1 (Probabilistic Fink):** "Glass wired so 70% chance it hardens on strike."
      *   **Handling:** Don't let them get stuck on the math. Ask: "Does SCA handle probabilities well?" (No, it's binary). "Is the structure Finkish?" (Yes, stimulus triggers removal). "Does this mean we need a Probabilistic SCA?" (Yes, but note that even Probabilistic SCA struggles if the probability *changes* upon stimulus). **Verdict:** It's a Fink structure that breaks binary SCA.
  *   **Curveball 2 (Combined Mask + Fink):** "Padded (Mask) AND padding chemically toughens glass 10 mins prior (Fink)."
      *   **Handling:** This tests if they think the categories are mutually exclusive.
      *   **Answer:** "Both labels apply." The padding blocks the break (Mask), and the chemical change removed the fragility (Fink).
      *   **Lesson:** These are analytical categories for *ways a conditional can fail*, not mutually exclusive states of matter. A single object can fail both ways.

  **0:45–0:50: The Exit Question**
  *   **See below.**

  ### 3. Example Advice: Glass vs. Fuse
  *   **Stick with the Glass.** The "One Object, Three Variants" approach is correct *provided* you emphasize the *history* of the object.
  *   **To avoid "Label Learning":** Do not call them "Mask Case" and "Fink Case" until *after* you have analyzed the mechanics. Refer to them as "The Padded Case" and "The Smart Case." Only apply the technical vocabulary once they see the structural difference in the Board Columns (`D remains` vs `D lost`).
  *   **Minimal Pair:** The "Smart Glass" is better than "Guardian Angel." It keeps the causal power intrinsic to the object, which prevents students from dismissing it as "external interference" (which they might conflate with Masking).

  ### 4. Handling Misconceptions (In Sequence)
  *   **"Fink and Mask are the same":** addressed at **0:30** by comparing the Board Columns. Ask: "In which case did the glass *lose* its fragility?"
  *   **"If it didn't break, it wasn't fragile":** addressed at **0:15** (Mask). Force the intuition that a padded glass is still fragile.
  *   **"Finks are gerrymandered/artificial":** addressed at **0:25**. Emphasize that metaphysics cares about *possibility*, not engineering feasibility. If the structure is coherent, the analysis must handle it.
  *   **"'Normal Conditions' fixes everything":** addressed at **0:25**. This is the specific job of the Fink case. Show that intrinsic finks make "normal conditions" circular or useless.

  ### 5. The Exit Question (Diagnostic)
  Do not use a glass. Do not use a fuse. Use a **biological/chemical** case they haven't seen.

  **The Case:**
  > "A specific virus strain has the disposition to **kill host cells upon entry**.
  >
  > **Scenario A:** The virus enters the cell, but the cell has a pre-existing antibody that neutralizes the virus immediately. The cell survives.
  > **Scenario B:** The virus is engineered such that the act of binding to the cell wall triggers a genetic switch that *removes* its toxicity genes before it can enter. The cell survives."

  **The Question:**
  > "1. In which scenario is the 'kill-on-entry' conditional (If enters → Kills) false?
  > 2. In which scenario does the virus *retain* the disposition to kill?
  > 3. Which scenario is the Fink, and why?"

  **What to look for:**
  *   **Success:** They identify that the Conditional is false in *both*. They identify that the Disposition remains in **A (Mask)** but is lost in **B (Fink)**.
  *   **Failure:** They say the disposition is lost in both (conflating Fink/Mask), or they say the conditional is true in A (thinking antibodies make the conditional false).
  *   **Why this works:** It strips away the "breaking" intuition. It forces them to track the *property* (toxicity) vs. the *outcome* (death).

  ### 6. Scope Boundaries (What to Cut)
  You are right to be wary. At this level, cut the following immediately if raised:
  1.  **Dispositional Essentialism:** Do not discuss whether *all* properties are dispositions. Stick to "Are *some* properties dispositions?"
  2.  **Realism about Powers:** Do not debate whether the "Causal Basis" is a real power or just categorical structure. Treat "Causal Basis" as a placeholder for "intrinsic physical structure."
  3.  **Lewisian Semantics:** They know world-similarity. Do not re-litigate how to measure similarity. Use their knowledge as a tool ("In the closest world where I strike it..."), not the topic.
  4.  **The "Solution" Debate:** Do not let them debate whether the Causal Basis view is *ultimately* correct. The goal is to see why SCA fails, not to solve metaphysics forever.

  **Final TA Tip:** If a student says, "But in the Fink case, it's just not fragile *at the moment of impact*," reply: "Exactly. But SCA says Fragility is about what happens *if* struck. If being struck makes it not-fragile, SCA says it wasn't fragile to begin with. That's the paradox." Keep the pressure on the *analysis*, not the physics.
