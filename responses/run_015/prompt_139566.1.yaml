  **Note on the Verse**

  I have committed the verse to a *Prāsaṅgika* (consequentialist) reading of the tetralemma, treating the fourth limb not as a fourth position alongside the others, but as a *prasajya-pratiṣedha*—a non-implicative negation that refuses the framework itself. In this reading, "empty" in the third stanza ("lacks a center") means dependently arisen and conventionally designated; the paper exists functionally ("serves the purpose") but lacks intrinsic nature ("center"). The poem leans on the contested aspectual reading of the third limb (conventionally present, ultimately absent) rather than a temporal one, which risks the mysticism you wanted to avoid. The rhyme scheme (mark/work, encounter/center, owes/goes) tightens as the argument progresses, buying a sense of logical inevitability, though "encounter" is slightly forced to secure the rhyme with "center," risking a shift from causal dependency to mere relationality.

  This would be the wrong poem if emptiness were interpreted as nihilism (nothing exists at all), because the third stanza affirms conventional function ("serves the purpose"), or if the fourth limb were read as an ineffable mystery, because the closing stanza locates the resolution in pragmatic usage ("where the usage goes") rather than transcendence. If I had to rewrite one stanza to better accommodate a strict nominalist objection—that even "purpose" implies too much inherent existence—I would rewrite the third stanza. I would need to strip "serves the purpose" of any teleological weight, perhaps changing it to "It holds the ink though it lacks a center," to ensure the conventionality doesn't smuggle in a hidden essence.
