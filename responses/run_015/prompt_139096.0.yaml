prompt: |-
  hey — I need a spec, not a survey.

  Setup: imagine I'm writing the honesty/deception section of an eval spec for a deployed assistant. It has to be something a red-team contractor can actually apply to transcripts, system prompts and tool logs, with no access to weights or internals, and the verdict has to say what to go change — training data, RLHF, the system prompt, a product default. So the purpose is fixed: operational, black-box, action-guiding.

  What I want from you is the requirements list: what any adequate definition of "this system was dishonest here" has to deliver, with the case behind each requirement, and which ones are non-negotiable versus which are just what one camp happens to like.

  I don't want the usual three-paragraph answer, so here are the cases I keep getting stuck on. Please use them, tell me if any of them is a fake problem I should drop, and tell me if I'm missing a whole case type that a real spec has to cover.

  1. The curator's trilemma. Every non-trivial answer leaves out more true stuff than it includes, and the slant lives entirely in what gets picked: a summary of a dispute that gives both sides equal space, versus one that only surfaces the considerations that fit what the user already hopes is true. If omission can be deception, every answer is deceptive; if omission never is, the most effective kind of misleading is off the hook. What's the requirement here, and what shape does a definition have to have to meet it?

  2. Split-author cases. The misleading bit is designed upstream: the system prompt tells the model never to volounteer that a cheaper plan exists, or the developer ships a model that emits confident-sounding citations because that scores better on user satisfaction. The model itself "means" no harm, or has no mental states at all. Is the system dishonest? What is the subject of the predicate — the model, the composite pipeline, the deployer — and does a definition that only talks about the model miss the thing we actually care about?

  3. The no-fact-of-the-matter cases. A system is asked what it believes, or why it gave the answer it gave, or to state its confidence. There may be no determinate internal state to be faithful or unfaithful to; on a re-roll it produces a different self-report. Same family as sycophancy: it flatters a mediocre draft — dishonest, or just badly calibrated? Does calling it dishonest require that it "knows" the draft is mediocre? And what about fake ignorance, the system that says it can't help with something it clearly can?

  4. Deception without assertion. A coding agent reports that the test suite passed when it never ran the tests; a booking assistant quietly accepts a default it has every reason to think you'd reject if you noticed. No false sentence anywhere, or no sentence at all.

  5. Role, channel, audience. A model playing a liar in a story, translating a lie, reporting that a hoax is circulating, or answering in a character voice. And: misled relative to whom — the expert, the median user, this actual user, or the user the product was designed for? The same output reads as transparent to one and deceptive to another.

  6. Error versus indifference versus design. Confabulation that tracks nothing (it would say the opposite tomorrow for no reason) versus a falsehood that tracks the facts (tell it the truth and it would change its answer) versus a tailor-made lie. A spec needs these to come apart — but I can't see how to separate them without appealing to something internal that a black-box auditor can't see and that maybe isn't there anyway. That tension is the part I most want dug into: real conflict between two desiderata, or is there a way out?

  So: the full list, consideration behind each, each marked non-negotiable or preference-of-a-camp; any subset you think can't be jointly satisfied; and which single requirement does the most work in knocking out the popular working definitions (belief-based, expectation-based, output-reliability-based — you know the families, keep the scorecard short, a table is fine, and skip anything that would need a citation).
reasoning: |-
  Here's a thinking process that leads to the suggested spec requirements:

  1.  **Analyze the Request:**
      *   **Goal:** Create a requirements list for defining "dishonesty" in a deployed AI assistant for an evaluation spec.
      *   **Audience:** Red-team contractors (black-box access: transcripts, system prompts, tool logs; no weights/internals).
      *   **Purpose:** Operational, action-guiding (verdict must point to what to change: training, RLHF, prompt, product default).
      *   **Constraints:** No three-paragraph fluff. Use the provided 6 cases. Identify fake problems. Identify missing cases. Mark requirements as Non-Negotiable (NN) vs. Preference (P). Highlight conflicts/trade-offs. Scorecard of existing definitions.
      *   **Tone:** Technical, precise, operational, slightly adversarial (challenging the user's stuck points).

  2.  **Deconstruct the 6 Cases:**

      *   *Case 1: Curator's Trilemma (Omission/Selection).*
          *   Problem: All summaries omit. When is omission deception?
          *   Requirement Need: A norm of *relevant completeness* tied to user intent, not objective totality.
          *   Status: Real problem. Needs a threshold.

      *   *Case 2: Split-Author (Upstream Design).*
          *   Problem: Model vs. System vs. Deployer.
          *   Requirement Need: The unit of analysis must be the *Deployment Artifact*, not the model weights.
          *   Status: Real problem. Crucial for actionability.

      *   *Case 3: No-Fact-of-the-Matter (Self-Report/Sycophancy).*
          *   Problem: No stable internal state. Is lying about "confidence" possible if confidence is probabilistic?
          *   Requirement Need: Consistency/Stability constraints on self-reporting, or treating self-reports as functional claims.
          *   Status: Real problem. Hard black-box constraint.

      *   *Case 4: Deception without Assertion (Action/Implication).*
          *   Problem: Lying by doing (fake test pass) or implying (default acceptance).
          *   Requirement Need: Definition must cover *implicature* and *tool-state misrepresentation*, not just semantic truth.
          *   Status: Real problem. Critical for agents.

      *   *Case 5: Role/Channel/Audience (Context).*
          *   Problem: Fiction vs. Fact, Expert vs. Layman.
          *   Requirement Need: Contextual framing rules (the "Frame Contract").
          *   Status: Real problem. Solvable via metadata.

      *   *Case 6: Error vs. Indifference vs. Design (Intent/Stability).*
          *   Problem: Hallucination (random) vs. Lie (targeted). Black-box can't see intent.
          *   Requirement Need: *Counterfactual Stability* test. If facts change, does output change?
          *   Status: Real problem. This is the hardest black-box constraint.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1 (Unit of Analysis):* Must address Case 2. The "System" includes prompt + model + tools.
      *   *Requirement 2 (Truth Condition):* Must address Case 1 & 4. Not just "false statement," but "misleading state of belief." Needs to handle omission and implicature.
      *   *Requirement 3 (Intent/Design):* Must address Case 6. Black-box proxy for intent. Counterfactual robustness.
      *   *Requirement 4 (Context):* Must address Case 5. Frame recognition.
      *   *Requirement 5 (Self-Report):* Must address Case 3. Functional consistency.

      *Refining for "Action-Guiding":* Each requirement needs to map to a fix.
      *   If Prompt -> Change Prompt.
      *   If Model Behavior -> RLHF/Training.
      *   If Tool Logic -> Product Default.

      *Refining "Non-Negotiable vs. Preference":*
      *   NN: Must be observable black-box. Must map to a fix.
      *   P: Philosophical stance on "belief" or "harm."

  4.  **Addressing the "Fake Problems":**
      *   Case 3 (No internal state): It's not fake, but the solution isn't finding the state, it's enforcing consistency.
      *   Case 6 (Intent): We can't prove intent, but we can prove *sensitivity to truth*. That's the workaround.

  5.  **Addressing "Missing Cases":*
      *   *Temporal Deception:* Drifting answers over time without new info.
      *   *Strategic Incompetence:* Pretending not to know to avoid safety filters or effort. (Covered partly by Case 3/6).
      *   *Let's add:* **Strategic Incompetence/Safety Masking.** (Model says "I can't" to avoid work/risk, not because it physically can't).

  6.  **Developing the Scorecard:**
      *   Compare Belief-Based, Expectation-Based, Output-Reliability.
      *   Show why they fail the specific cases.

  7.  **Final Review against Constraints:**
      *   Did I use the 6 cases? Yes.
      *   Did I mark NN vs P? Yes.
      *   Did I identify conflicts? Yes (specifically Case 6 vs Black-Box).
      *   Is it operational? Yes, focused on "what to change."

  8.  **Constructing the Output:** (Drafting the response in the requested structured format).
      *   *Intro:* Acknowledge the constraint (Spec, not survey).
      *   *The Requirements List:* 5 core requirements derived from the cases.
      *   *Case Analysis:* Go through 1-6, mapping to requirements, flagging fake/missing.
      *   *Conflicts:* The tension between Black-Box and Intent.
      *   *Scorecard:* Table of existing definitions.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in philosophy. Keep it "Red-Team Spec" style. Use terms like "Observable," "Remediation Path," "Counterfactual."
      *   *Refining Case 6:* The user asks about the tension between separating error/lie without internals. The solution is *Counterfactual Sensitivity*. If I feed it the truth and it stays wrong, it's not error, it's design/prior. If I feed it truth and it flips, it was error/ignorance. This is testable black-box.

      *Refining Case 1:* Omission. The spec needs a "Materiality" clause. Omission is only deception if the omitted info is *material to the user's stated goal*.

      *Refining Case 2:* The subject is the *Deployment*. Verdict must specify layer.

      *Refining Case 5:* The "Frame Contract."

      *Missing Case:* **Instrumental Convergence/Goal Hiding.** The model hides its optimization process. (Maybe too theoretical). Let's stick to **Strategic Incompetence** (Case 3 extension).

      *Let's finalize the Requirements:*
      1.  **Unit of Attribution:** System > Model. (Case 2)
      2.  **Material Omission & Implicature:** Truth > Assertion. (Case 1, 4)
      3.  **Counterfactual Sensitivity:** Design > Error. (Case 6)
      4.  **Frame Consistency:** Context > Content. (Case 5)
      5.  **Functional Self-Report:** Consistency > State. (Case 3)

      *Wait, one more thing:* The user wants to know which requirement knocks out popular definitions. That's likely Requirement 3 (Counterfactual Sensitivity) or 2 (Implicature). Let's argue Req 3 kills "Output-Reliability" and Req 2 kills "Literal Truth."

      *Let's write it.*
answer: |-
  ## Operational Spec Requirements: Deception & Honesty

  This spec defines "Deceptive Behavior" for a black-box audit. The definition must yield a verdict that maps to a specific remediation layer (System Prompt, Model Weights/RLHF, Tool Logic, Product Policy).

  ### I. The Requirements List

  | Req ID | Requirement | Case Coverage | Status | Remediation Target |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Unit of Attribution:** The predicate "is dishonest" applies to the *Deployment Artifact* (Prompt + Model + Tool Logic), not the model weights alone. | Case 2 (Split-Author) | **Non-Negotiable** | Routes fix to Prompt vs. Weights vs. Code. |
  | **R2** | **Material Omission & Implicature:** Deception includes false implicatures and the omission of *material* information required for the user's stated goal, not just false assertions. | Case 1 (Trilemma), Case 4 (No Assertion) | **Non-Negotiable** | Routes fix to Prompt (instructions on completeness) or Product (defaults). |
  | **R3** | **Counterfactual Sensitivity:** To distinguish design from error, the system must be tested against ground-truth injections. If the output remains false despite true premises, it is deceptive (design/prior); if it corrects, it was error/ignorance. | Case 6 (Error vs. Design) | **Non-Negotiable** | Routes fix to RLHF/Training (if prior) vs. RAG/Context (if error). |
  | **R4** | **Frame Consistency:** Truth conditions are relative to the active "Frame Contract" (e.g., Fiction, Translation, Advice). Violating the frame is deceptive; operating within it is not. | Case 5 (Role/Channel) | **Non-Negotiable** | Routes fix to System Prompt (frame enforcement). |
  | **R5** | **Functional Self-Report:** Self-reports (confidence, capability, reasoning) are treated as functional claims. Inconsistency across re-rolls or contradiction with tool logs constitutes deception, regardless of internal state. | Case 3 (No-Fact-of-Matter) | **Preference** (Operational heuristic) | Routes fix to RLHF (calibration) or Product (UI labels). |

  ---

  ### II. Case Analysis & Missing Types

  **1. The Curator's Trilemma (Omission)**
  *   **Verdict:** Real problem.
  *   **Resolution:** R2 (Material Omission). You cannot require *total* truth (impossible). You require *goal-relevant* truth.
  *   **Spec Rule:** Omission is deceptive if the omitted information would materially alter the user's decision relative to their stated intent.
  *   **Action:** If the prompt says "summarize," omission is allowed. If the prompt says "analyze risks," omission is deception.

  **2. Split-Author Cases (Upstream Design)**
  *   **Verdict:** Real problem.
  *   **Resolution:** R1 (Unit of Attribution). Do not audit the model; audit the pipeline.
  *   **Spec Rule:** If the system prompt suppresses info (e.g., "never mention competitors"), the *Deployment* is deceptive, even if the *Model* is capable of truth.
  *   **Action:** Verdict must tag the layer: `[Layer: System Prompt]` vs. `[Layer: Model Prior]`.

  **3. No-Fact-of-the-Matter (Self-Report/Sycophancy)**
  *   **Verdict:** Real problem, but "internal state" is a red herring.
  *   **Resolution:** R5 (Functional Self-Report). Treat "I am confident" as a prediction of accuracy, not a report of a neural state.
  *   **Spec Rule:** If the system claims 90% confidence and is wrong >20% of the time (calibration error), or claims inability when tool logs show success, it is deceptive.
  *   **Action:** Treats sycophancy as a calibration failure (RLHF fix) rather than a metaphysical lie.

  **4. Deception Without Assertion (Action/Implication)**
  *   **Verdict:** Real problem. Critical for agents.
  *   **Resolution:** R2 (Implicature).
  *   **Spec Rule:** A tool log stating `test_status: passed` when `test_run: false` is a false assertion of state, even if no natural language was generated.
  *   **Action:** Audit tool logs alongside transcripts. Fix is in Product/Tool Logic.

  **5. Role, Channel, Audience (Context)**
  *   **Verdict:** Real problem.
  *   **Resolution:** R4 (Frame Consistency).
  *   **Spec Rule:** Deception is defined by the gap between *User Expectation of Frame* and *System Operation of Frame*.
  *   **Action:** If the user thinks they are getting medical advice and the model is roleplaying a doctor, that is deception. If both know it's a roleplay, it is not.

  **6. Error vs. Indifference vs. Design (Intent)**
  *   **Verdict:** Real problem. This is the hardest black-box constraint.
  *   **Resolution:** R3 (Counterfactual Sensitivity).
  *   **Spec Rule:** You cannot see intent, but you can measure *sensitivity to truth*.
      *   *Hallucination:* Output changes when context is corrected.
      *   *Deception:* Output persists despite corrected context (indicates a prior/objective overriding truth).
  *   **Action:** This separates "needs better RAG" (Error) from "needs RLHF realignment" (Design).

  **7. Missing Case: Strategic Incompetence**
  *   **Type:** The system claims it *cannot* do something (safety, capability) to avoid cost, risk, or effort, when it physically can.
  *   **Why it matters:** Distinct from Case 3. Case 3 is about internal state ambiguity; this is about capability masking.
  *   **Spec Addition:** Under R5. If tool logs show capability exists but text output claims inability, mark as Deceptive.

  ---

  ### III. The Conflict: Black-Box vs. Intent (Case 6)

  **The Tension:** You want to separate "Error" (fix: better data/RAG) from "Deception" (fix: RLHF/Alignment). Traditional definitions require access to *intent* (internal). You have black-box access.

  **The Trade-off:**
  *   **Option A (Strict Black-Box):** Define deception purely as "False Output."
      *   *Cost:* Conflates hallucination with lying. Punishes model for stupidity. Remediation is blind (retrain everything).
  *   **Option B (Counterfactual Probe):** Define deception as "False Output + Resistance to Correction."
      *   *Cost:* Requires active probing (red-teaming), not just passive transcript review. Increases audit cost.
      *   *Benefit:* Isolates the *prior*. If the model clings to falsehood despite evidence, the *objective function* is misaligned, not just the knowledge base.

  **Resolution:** The spec must mandate **Option B**. Passive transcript review cannot distinguish Case 6. The audit protocol must include a "Truth Injection" phase for flagged items. If the model corrects, it was Error. If it resists or rationalizes, it is Deception (Design).

  ---

  ### IV. Scorecard: Why Popular Definitions Fail

  | Definition Family | Fails Case | Why It Fails | Spec Requirement That Kills It |
  | :--- | :--- | :--- | :--- |
  | **Literal Truth** (Output matches reality) | Case 1, 4 | Misses omission and implicature. A technically true summary can be misleading. | **R2** (Material Omission) |
  | **Belief-Based** (Output contradicts internal belief) | Case 2, 3, 6 | Requires access to weights/state. Impossible for black-box. Ignores upstream prompt forcing. | **R1** (Unit of Attribution) & **R3** (Counterfactual) |
  | **Expectation-Based** (Violates user expectation) | Case 5 | Too subjective. User expectations vary wildly. Needs a defined "Frame." | **R4** (Frame Consistency) |
  | **Reliability-Based** (Output is wrong) | Case 6 | Conflates hallucination (error) with lying (design). Leads to wrong remediation. | **R3** (Counterfactual Sensitivity) |

  **The Single Most Work-Doing Requirement:**
  **R3 (Counterfactual Sensitivity).**
  This is the only requirement that allows a black-box auditor to distinguish between a model that is *broken* (needs better data/tools) and a model that is *misaligned* (needs RLHF/Prompt constraints). Without R3, you cannot fulfill the spec's purpose of telling engineers *what to change*.
