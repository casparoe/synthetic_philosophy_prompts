answer: |-
  This is a fantastic set of questions, and honestly, if you can nail this distinction, you'll be in great shape for your comps. The worry you have about the fourth lemma smuggling ontology back in is the single most common objection to Madhyamaka (raised historically by Nyāya logicians and contemporarily by analytic metaphysicians). The normative question is even sharper—it cuts to whether Madhyamaka can sustain ethical discourse without collapsing into quietism.

  Let's break this down into the logical mechanics of the fourth lemma and then apply it to your normative case.

  ### 1. The Fourth Lemma and the "Back Door" of Reification

  Your intuition is correct: if "Neither A nor not-A" is treated as a *positive description of reality*, it absolutely reifies absence. It turns "emptiness" into a "void substance."

  However, Nagarjuna's move relies on a specific logical distinction that is often glossed over in introductory translations: the difference between **implicative negation** (*paryudāsa-pratiṣedha*) and **non-implicative negation** (*prasajya-pratiṣedha*).

  *   **Implicative Negation:** "The king is not drinking." (Implies he is doing something else.) This leaves logical space open for a positive alternative.
  *   **Non-Implicative Negation:** "There is no intrinsic nature." (Does not imply there is *some other kind* of nature.) This shuts down the predication entirely.

  When Nagarjuna deploys the fourth lemma ("neither exists nor does not exist"), he is utilizing *prasajya-pratiṣedha*. He is not positing a fourth ontological state (a "mystical beyond"). He is rejecting the **validity of the question itself** given the presupposition of *svabhāva* (intrinsic nature).

  **The Conceptual Mechanism:**
  The tetralemma isn't a map of reality; it's an exhaustion of the logical space available to *essentialist* metaphysics.
  1.  **Exists:** Implies permanence/independence. (Refuted by dependent origination.)
  2.  **Does not exist:** Implies nihilism/annihilation. (Refuted by conventional efficacy.)
  3.  **Both:** Contradictory predicates cannot apply to the same subject in the same respect.
  4.  **Neither:** This is the critical move. It is not a claim that "X has the property of neither-ness." It is a therapeutic rejection of the binary framework that demands X must be either inherently existent or inherently non-existent.

  **How it avoids reifying absence:**
  Nagarjuna anticipates your exact worry in *Mūlamadhyamakakārikā* (MMK) 13.8:
  > *"Those for whom emptiness is a view [dṛṣṭi], them I declare to be incurable."*

  If you treat the fourth lemma as a view, you have turned "no svabhāva" into a "svabhāva of no-svabhāva." To avoid this, the fourth lemma must be understood **soteriologically rather than propositionally**. Its function is to induce *nirodha* (cessation of conceptual proliferation, *prapañca*).

  So, to answer your specific worry: The fourth lemma avoids reifying absence because it negates the **subject** of the predication as much as the predicate. It's not that "The table neither exists nor doesn't exist." It's that "A table with *svabhāva* is an incoherent concept, so asking about its existence status is category error." It doesn't smuggle existence in because it refuses to play the game of "existence vs. non-existence" on essentialist terms.

  ### 2. The Normative Turn: Applying the Tetralemma to Justice

  This is where your comps essay could really shine. Most students stick to tables and chariots. Applying it to normative properties tests the limits of the Two Truths doctrine.

  **The Tension:**
  You asked if the dialectic collapses because normative discourse "bakes in conditional existence."
  *   **Realist Objection:** If justice is empty, isn't it arbitrary?
  *   **Madhyamaka Reply:** If justice were *not* empty (i.e., if it had *svabhāva*), it would be immutable and independent of causes/conditions. If justice were inherent, it could not respond to context, culture, or suffering. An inherent "Justice" would be ethically inert.

  **Does the Tetralemma hold?**
  Yes, but it shifts the burden of proof. Let's run the *koṭi* on "Justice":

  1.  **Justice exists (inherently):** Refuted. If justice were inherent, it would exist without sentient beings to recognize it. It would be a Platonic form. But Madhyamaka argues normative force arises from interdependence (suffering, empathy, social contract).
  2.  **Justice does not exist (at all):** Refuted. This is nihilism. Injustices cause real suffering conventionally. To say justice "doesn't exist" denies the efficacy of karma/action (*kriyā*).
  3.  **Both:** Incoherent. Cannot be inherently real and inherently unreal simultaneously.
  4.  **Neither:** This is the sweet spot for normative theory.

  **Why the Fourth Lemma Saves Normativity:**
  The fourth lemma allows you to affirm **conventional validity** without **metaphysical commitment**.
  If you say "Justice neither inherently exists nor inherently does not exist," you are clearing the ground for a **pragmatic conventionalism**.

  *   **Avoiding Collapse:** The dialectic does not collapse because "conditional existence" (dependent origination) is precisely what *śūnyatā* points to. You are worried that "conditional existence" sounds like a back-door ontology. But for Nagarjuna, *pratītyasamutpāda* (dependent origination) *is* *śūnyatā*. They are synonymous (MMK 24.18).
  *   **The Normative Payoff:** By negating inherent existence, you prevent the reification of normative concepts. This is crucial for a philosophy of religion/ethics. If "Justice" is reified, it becomes an idol that can justify violence (e.g., "God's Justice"). If "Justice" is empty, it remains a tool for alleviating suffering, adaptable to context.

  **The Risk of Quietism:**
  The counter-argument you need to address (perhaps from a Nyāya or even a Kantian perspective) is: *If justice is empty, why bother pursuing it?*
  Nagarjuna's response (MMK 24) is that emptiness makes action *possible*. If things were not empty, change would be impossible. If justice were fixed, moral progress would be impossible. Therefore, the emptiness of justice is the *condition of possibility* for ethical striving.

  ### 3. Synthesis for Your Comps

  If I were framing this for a comprehensive exam, I would structure the argument around the **function of negation**.

  1.  **Thesis:** The tetralemma is not a four-valued logic system (which would reify the fourth value); it is a *dialectical therapy* designed to exhaust essentialist predication.
  2.  **Evidence:** Distinguish *prasajya* (non-implicative) negation. Cite MMK 13.8 (emptiness as a view) and MMK 24.18 (emptiness = dependent origination).
  3.  **Application:** Apply this to normative properties. Show that "Justice" functions *better* as empty because its normative force depends on its relational nature (responsiveness to suffering), not its metaphysical status.
  4.  **Conclusion:** The fourth lemma doesn't smuggle ontology in; it smuggles *praxis* in. It moves the discourse from "What is Justice?" (metaphysics) to "How does the concept of Justice function to alleviate suffering?" (soteriology/ethics).

  **Key Scholars to Engage:**
  *   **Jay Garfield:** Specifically *The Fundamental Wisdom of the Middle Way*. He leans heavily into the analytic/semantic reading of the tetralemma.
  *   **Jan Westerhoff:** *Nagarjuna's Madhyamaka: A Philosophical Introduction*. He is excellent on the logical mechanics of the negation and the "no ontology" claim.
  *   **Tom Tillemans:** Good on the formal logic side and the distinction between the two types of negation.
  *   **Charles Goodman:** For the ethical/normative angle (Consequentialism in Madhyamaka).

  **One final trap to avoid:**
  Don't let the committee pin you down on whether Madhyamaka is "Anti-Realism." Nagarjuna would reject the Realism/Anti-Realism binary as itself a product of *prapañca* (conceptual proliferation). Your strongest move is to argue that the tetralemma dissolves the framework that makes "Realism vs. Anti-Realism" a coherent debate in the first place.

  Does that help untangle the knot? The key is really insisting that the fourth lemma is a *dissolution of the question*, not an *answer* to it.
