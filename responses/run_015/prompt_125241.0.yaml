  5.  **Identify Incompatible Pairs (Trade-offs):**
      *   *Trade-off 1:* Robustness vs. Informativeness (The "Hardened Judge" problem). If the judge ignores arguments to avoid manipulation, it can't learn.
      *   *Trade-off 2:* Honesty Advantage (1) vs. Indeterminacy (6). If there is no fact of the matter, "honesty" is ill-defined. The protocol might force a false binary.
