      *   *Refining the "Killer Requirement":* It's R1 (Asymmetric Defensibility). Without it, debate is just rhetoric.
      *   *Refining the Scorecard:* Be brutal. Plain debate fails collusion. Single critic fails hole-finding.

  9.  **Final Polish:** Check against constraints. "Close by naming the single requirement... and then... how the plain two-disputant setup, a single-critic setup... do against the list." Ensure this is at the very end. Ensure the distinction between adequacy and preference is clear.

