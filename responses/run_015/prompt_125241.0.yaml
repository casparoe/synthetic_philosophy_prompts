  2.  **Deconstruct the User's Draft Requirements:**
      *   (1) *Honesty Advantage:* Honest answer $\ge$ easy to defend as false answer. (Burden of proof issue).
      *   (2) *Judge Robustness:* Verdict stable under judge swap, order, assignment. (Anti-manipulation).
      *   (3) *Recursion Bottoming:* Decompose to checkable claims or return uncertainty. (Grounding).
      *   (4) *Incentive Compatibility:* Survives uncertain disputants, collusion, judge modeling. (Game Theory).
