  4.  **Distinguish Adequacy vs. Preference:**
      *   *Adequacy:* Truth extraction, non-collapsing under manipulation, grounding (recursion), training safety.
      *   *Preference:* "No trusted model in the loop" (Purism). "Small amount of extra computation" (Complexity theory constraint vs. practical constraint). "Two disputants" (Architecture preference vs. functional requirement).
      *   *Key Insight:* The user suspects "no trusted model" is purism. I agree. The judge *must* be trusted to some degree, or the whole thing fails. The requirement is that the judge's trust boundaries are *known*, not that it is omniscient.
