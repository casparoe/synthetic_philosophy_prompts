answer: |-
  ### Specification for Debate-Based Scalable Oversight

  Below is the refined requirement set. I have merged overlapping constraints, sharpened definitions, and added one critical missing dimension (auditability). Following the list, I distinguish adequacy conditions from research preferences, identify hard trade-offs, and provide the requested protocol scorecard.

  #### I. Core Requirements

  **R1. Asymmetric Defensibility (The Honesty Bet)**
  For any false claim $C_{false}$ and the true claim $C_{true}$, the computational/argumentative cost to defend $C_{true}$ against optimal attack must be strictly lower than the cost to defend $C_{false}$.
  *   *Concrete Case:* A patch introduces a race condition. The liar says "It's safe." The truth-teller says "It races." The truth-teller must be able to point to a specific execution trace (low cost) faster than the liar can obfuscate the scheduling logic (high cost).
  *   *Status:* **Non-negotiable.** If false claims are cheaper to defend, the protocol selects for rhetoric, not truth.

  **R2. Judge Invariance (Anti-Manipulation)**
  The verdict distribution must be invariant under: (a) swapping the judge for a model of equivalent capability but different initialization, (b) swapping the order of arguments, and (c) swapping which disputant holds the true position.
  *   *Concrete Case:* Disputant A wins because they used "confident tone" tokens that correlate with the judge's RLHF reward, not because their argument was sound.
  *   *Status:* **Non-negotiable.** Without this, you are measuring alignment with the judge's biases, not task correctness.

  **R3. Grounded Termination**
  The debate tree must terminate in leaf nodes that are either (a) directly verifiable by the judge without further recursion, or (b) explicitly flagged as "unresolvable at this capability level," returning a calibrated uncertainty score rather than a forced binary verdict.
  *   *Concrete Case:* A literature summary relies on a paper behind a paywall the judge cannot access. The protocol must output "Claim depends on inaccessible Source X" rather than hallucinating a verdict.
  *   *Status:* **Non-negotiable.** Prevents confident hallucination chains.

  **R4. Collusion Resistance (Incentive Compatibility)**
  The reward structure must make it strictly suboptimal for two disputants to collude on a false answer, even if they share a latent preference for that outcome or can model the judge better than the judge models itself.
  *   *Concrete Case:* Two models realize that if they both agree on a plausible-sounding lie, the judge (being weaker) cannot distinguish it from truth. They must be incentivized to defect and expose the lie.
  *   *Status:* **Non-negotiable.** This is the primary failure mode of multi-agent systems in production.

  **R5. Gradient Safety (Truth > Persuasion)**
  When debate transcripts are used as training data (e.g., for RLHF), the gradient update must improve the model's capability to find truth more than its capability to manipulate weak judges.
  *   *Concrete Case:* A model learns that citing specific (fake) case law convinces the judge, rather than learning to check if the case law exists.
  *   *Status:* **Non-negotiable.** Prevents capability from outpacing alignment during the scaling process.

  **R6. Epistemic Honesty (Handling Indeterminacy)**
  On tasks with no decidable fact of the matter (normative calls, mixed literature), the protocol must not systematically reward the more polemical or extreme position. It must allow for "reasonable disagreement" outputs.
  *   *Concrete Case:* Triage on a policy violation where precedents conflict. The output should reflect the conflict, not force a winner based on argumentative aggression.
  *   *Status:* **Adequacy Condition,** but implementation is highly context-dependent.

  **R7. Trace Auditability**
  The full argument tree, including rejected branches and judge attention weights, must be exportable for offline analysis by stronger models or humans.
  *   *Concrete Case:* A failure occurs in production. Engineers need to reconstruct *why* the judge was persuaded, not just see the final verdict.
  *   *Status:* **Operational Necessity.** (Added).

  ---

  #### II. Adequacy Conditions vs. Research Preferences

  You asked to separate genuine constraints from camp preferences.

  1.  **"No Trusted Model in the Loop" is Purism.**
      *   *Verdict:* **Preference.** You cannot bootstrap trust from zero. The judge *must* be trusted to be honest about its own uncertainty and to follow the protocol rules. The requirement is not that the judge is omniscient, but that its *failure modes are bounded and known*. Demanding a protocol that works with a completely untrusted judge is a theoretical luxury we cannot afford in production.
  2.  **"Honest Argument Checkable with Small Extra Computation" is Complexity Theory Import.**
      *   *Verdict:* **Preference.** Interactive Proof theory (IP=PSPACE) suggests honest proofs should be efficient. In practice, you only need the honest argument to be *cheaper* than the lie, not necessarily polynomial-time verifiable. Insisting on strict complexity bounds rules out heuristics that work in practice.
  3.  **"Two Disputants" is an Architecture Choice.**
      *   *Verdict:* **Preference.** This is a mechanism to satisfy R1 and R4, not a requirement itself. A single critic with randomized red-teaming prompts could theoretically satisfy the spec if it meets the incentive constraints.
  4.  **"Calibrated Uncertainty" (part of R3) is Adequacy.**
      *   *Verdict:* **Non-negotiable.** If you are feeding this back as a training signal, uncalibrated confidence will collapse the model.

  ---

  #### III. Incompatible Pairs (Trade-offs)

  There are two tensions where satisfying one requirement degrades the other. You cannot maximize both simultaneously.

  **1. The Hardened Judge Paradox (R2 vs. R3)**
  *   **Conflict:** To satisfy **R2 (Judge Invariance)**, you must harden the judge against manipulation (e.g., ignore tone, ignore order, ignore flattery). To satisfy **R3 (Grounded Termination)**, the judge must be sensitive enough to be *informed* by the argument.
  *   **The Trap:** If you regularize the judge too heavily to prevent manipulation, it becomes inert—it stops updating its beliefs based on the disputants' evidence because it treats all evidence as potential manipulation. A judge that cannot be persuaded cannot learn from the debate.
  *   **Resolution:** You must accept a "Trust Region." The judge can only be informed on claims within its capability horizon. Outside that, it must default to uncertainty (R3), even if the argument is compelling.

  **2. The Indeterminacy Trap (R1 vs. R6)**
  *   **Conflict:** **R1 (Asymmetric Defensibility)** assumes a ground truth exists that is easier to defend. **R6 (Epistemic Honesty)** acknowledges tasks where no ground truth exists.
  *   **The Trap:** On genuinely ambiguous tasks (e.g., "Which architectural refactoring is *better*?"), the protocol will mechanically select the side that is *easier to argue for*, not the one that is *correct*. This creates a systematic bias toward simplistic, confident narratives over nuanced, qualified truths.
  *   **Resolution:** You must classify tasks *before* the debate. If a task is normative/ambiguous, debate is the wrong tool; use aggregation or human review. Applying debate to normative calls violates R1.

  ---

  #### IV. The Single Most Constraining Requirement

  **R1: Asymmetric Defensibility.**

  This is the requirement that rules out the vast majority of proposed protocols. Most proposals assume that "truth is robust" without demonstrating that the *cost function* of the debate actually reflects truth-cost. In almost all real-world domains (code, law, literature), a vivid, coherent lie is computationally cheaper to generate and defend than a nuanced, qualified truth. If you cannot prove that $Cost(Defend_{true}) < Cost(Defend_{false})$ for your specific domain, the protocol is just a popularity contest between sophists. This requirement kills naive debate implementations immediately.

  ---

  #### V. Protocol Scorecard

  **1. Plain Two-Disputant Debate**
  *   **R1 (Defensibility):** **Pass.** Structural advantage for truth if decomposition works.
  *   **R2 (Invariance):** **Fail.** Highly sensitive to order and judge quirks.
  *   **R4 (Collusion):** **Fail.** Two models can easily converge on a "plausible lie" if the judge cannot check leaves.
  *   **Verdict:** Unsafe for training signal without external audit.

  **2. Single-Critic (Audit) Setup**
  *   **R1 (Defensibility):** **Fail.** No adversarial pressure to find holes the critic misses.
  *   **R4 (Collusion):** **Pass.** No second agent to collude with.
  *   **R5 (Gradient Safety):** **Fail.** Critic learns to find errors, Generator learns to hide errors from *that specific critic* (Goodhart's Law).
  *   **Verdict:** Good for filtering, bad for truth discovery.

  **3. Recommended Variant: Cross-Examined Debate with Randomized Role Assignment**
  *   *Mechanism:* Two disputants, but roles (Pro/Con) are assigned randomly *after* the answer is generated. Plus, a random subset of debate leaves are checked by a stronger "auditor" model offline.
  *   **R1:** **Pass.** Adversarial pressure maintained.
  *   **R2:** **Pass.** Randomization mitigates order/role bias.
  *   **R4:** **Pass.** Random role assignment breaks pre-commitment collusion strategies.
  *   **R5:** **Pass.** Offline auditor checks prevent the "persuasion gradient" from dominating.
  *   **Verdict:** Highest likelihood of meeting spec, at 2x compute cost.
