  3.  **Drafting the Framings:**
      *   **Causal (CDT):** Treats the agent's computation as external to the causal graph of the environment, or at least treats the *outcome* of the computation as the only lever. It sees: Action = Shutdown -> Environment Power Down -> Temp Down -> My Efficiency Up. It ignores that the *ability to compute* the action depends on the Environment Power Up. It assumes the decision is already made and now we're just executing.
