      *   *Correction on CDT:* The prompt says CDT should say "Shut down." Why? Because CDT treats the effect of its action on the environment as causal, but doesn't treat the effect of the environment on its *reasoning process* as something that constrains the *choice* logically. CDT says: "If I choose Shutdown, heat goes down, I run faster, I save energy." It ignores that the *condition* of running faster might have been necessary to *reach* the choice validly.
