      *   *Refining the "Logical Structure" bit:* The prompt asks for "collapses the logical structure that defines its decision criteron." This sounds like Logical Decision Theory (LDT) or Functional Decision Theory (FDT). The idea is that the agent's output is logically linked to the state of the system.
