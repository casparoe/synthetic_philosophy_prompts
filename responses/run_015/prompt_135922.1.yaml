      *   This implies the decision criterion *depends* on the other nodes running. Maybe the decision criterion is "Maximize Compute *given that a decision is reached*."
      *   Or, the agent is running a consensus algorithm where its own vote only counts if the quorum (other nodes) is active. If it shuts them down, its vote is void. CDT thinks "My vote counts regardless." Embedded thinks "My vote is logically tied to the quorum state."
      *   Let's stick to the thermal-clock loop as the primary driver, as requested ("probably the thermal-clock loop?").
      *   The "logical structure" is the guarantee of completion. The agent reasons about "What happens if I output X?" If outputting X prevents the output of X, then X is not a viable output.

  9.  **Final Polish of the Plan:**
