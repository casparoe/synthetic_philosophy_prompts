      *   So, CDT thinks: "I have already decided. Now I execute. Executing 'Shutdown' saves power." It fails to see that the *act of deciding* was part of the physical chain.
      *   Embedded thinks: "My decision process is physical. If I decide 'Shutdown', the physical process changes mid-stream."

