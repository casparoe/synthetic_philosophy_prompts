      *   Better attack: "The agent can model the thermal impact on itself as a causal consequence of its action. If shutting down causes a timeout, CDT sees that negative utility and avoids it."
      *   Counter to attack: CDT sees the timeout as a *consequence* of the action. But the paradox is that the action *presupposes* no timeout. If the timeout occurs, the action wasn't taken. CDT struggles with preconditions of its own existence/agency.

  6.  **Removing the Loop:**
      *   If clock speed is constant regardless of heat/decision, then it's just standard optimization. Agent calculates utility of Shutdown vs. Run. No self-reference.

  7.  **Tone Check:**
