      *   Embedded: My decision algorithm $A$ outputs an action. The physical instantiation of $A$ requires specific thermal conditions provided by the other nodes. If $A$ outputs "Shutdown," the physical conditions for $A$ to run vanish mid-execution. Thus $A$ cannot consistently output "Shutdown."
