answer: |-
  ## Part 1: Design Notes & Logical Space (For Instructor)

  **The Logic Tree**
  The flowchart forces a decision at every node. There are no "maybe" branches; students must commit to a probability >50% to proceed. This exposes where their intuition actually lies.

  1.  **Search Depth:** "If we spent 100× more money searching radio/optical bands for 10 years, would we find a signal?"
      *   **No** → *Data Deficient* (End).
      *   **Yes** → The silence is real. (Go to 2).
  2.  **Abiogenesis:** "Is the jump from chemistry to simple cells extremely unlikely?"
      *   **Yes** → *Rare Earth (Abiogenesis)* (End).
      *   **No** → Life is common. (Go to 3).
  3.  **Complexity:** "Does simple life usually develop industrial technology?"
      *   **No** → *Rare Earth (Complexity)* (End).
      *   **Yes** → Tech is common. (Go to 4).
  4.  **Expansion:** "Do advanced civilizations inevitably spread across star systems?"
      *   **No** → *Parochial Premise* (End).
      *   **Yes** → They expand. (Go to 5).
  5.  **Visibility:** "Would a galaxy-spanning civilization be obvious to our telescopes (heat/structures)?"
      *   **No** → *Transcension* (End).
      *   **Yes** → They are visible. (Go to 6).
  6.  **Temporal:** "Are we among the *first* civilizations to arise in the galaxy?" **(Critical Branch)**
      *   **Yes** → *We're Early* (End).
      *   **No** → Others should exist now. (Go to 7).
  7.  **Local:** "Could they be in the Solar System right now without us noticing?"
      *   **Yes** → *They're Here* (End).
      *   **No** → They are elsewhere. (Go to 8).
  8.  **Hostility:** "If they are silent, is it because contact is dangerous?"
      *   **Yes** → *Dark Forest* (End).
      *   **No** → Contact is safe. (Go to 9).
  9.  **Survival:** "Is the hardest step for *us* still to come (nuclear/climate/AI)?"
      *   **Yes** → *Filter Ahead* (End).
      *   **No** → We will survive. (Go to 10).
  10. **Benevolence:** "If they hide, is it to let us develop naturally?"
      *   **Yes** → *Zoo/Planetarium* (End).
      *   **No** → *Unoccupied* (See below).

  **Unoccupied/Unattractive Combinations**
  *   **Rare Earth + We're Early:** Incoherent. If life is chemically unlikely, our temporal location is irrelevant to the silence.
  *   **Parochial + Transcension:** Redundant. If they don't expand physically (Parochial), whether their non-expansion is visible (Transcension) is moot.
  *   **Dark Forest + They're Here:** Unattractive. If they are already here, the "forest" risk is realized; "Undetected" is the more precise label.
  *   **Filter Ahead + Rare Earth:** Double Pessimism. Possible, but usually one filter dominates the probability math.
  *   **Node 10 "No":** If they aren't rare, they expand, they are visible, we aren't early, they aren't here, they aren't hiding out of fear, and *we* won't die... then they should be obvious. This leaf is empty because it *is* the Fermi Paradox itself (the contradiction).

  ***

  ## Part 2: Handout Content (For Students)
  *(Copy below this line for the A4 layout)*

