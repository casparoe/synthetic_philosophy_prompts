  **Start:** "I accept we have no convincing evidence of ET technology, and UAPs don't count."

  **1. SEARCH:** If we searched 100× harder for 10 years, would we find a signal?
  *   **NO** → **DATA DEFICIENT**
  *   **YES** → Go to 2.

  **2. LIFE:** Is the jump from chemistry to simple cells extremely unlikely?
  *   **YES** → **RARE EARTH (ABIOGENESIS)**
  *   **NO** → Go to 3.

  **3. MIND:** Does simple life usually develop industrial technology?
  *   **YES** → Go to 4.
  *   **NO** → **RARE EARTH (COMPLEXITY)**

  **4. EXPANSION:** Do civilizations inevitably spread across star systems?
  *   **NO** → **PAROCHIAL PREMISE**
  *   **YES** → Go to 5.

  **5. SIGNATURE:** Would a galaxy-spanning civilization be obvious to our telescopes?
  *   **NO** → **TRANSCENSION**
  *   **YES** → Go to 6.

  **6. TIME:** Are we among the *first* civilizations to arise in the galaxy?
  *   **YES** → **WE'RE EARLY**
  *   **NO** → Go to 7.

  **7. LOCAL:** Could they be in the Solar System right now without us noticing?
  *   **YES** → **THEY'RE HERE**
  *   **NO** → Go to 8.

  **8. FEAR:** If they are silent, is it because contact is dangerous?
  *   **YES** → **DARK FOREST**
  *   **NO** → Go to 9.

  **9. DOOM:** Is the hardest step for *us* still to come (nuclear/climate/AI)?
  *   **YES** → **FILTER AHEAD**
  *   **NO** → Go to 10.

  **10. CARE:** If they hide, is it to let us develop naturally?
  *   **YES** → **ZOO / PLANETARIUM**
  *   **NO** → **CONTRADICTION** (You believe aliens should be obvious, but see none.)

