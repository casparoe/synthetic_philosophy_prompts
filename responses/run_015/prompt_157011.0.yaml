  | **Data Deficient** | We are shouting into a void we haven't mapped. | A clear signal found in current archives. | **SHOUT** (Need data) | N/A |
  | **Rare Earth (Abio)** | Chemistry to life is a miracle; we are alone. | Simple life found on Mars/Europa. | **SHOUT** (We are unique) | **Same:** Life is hard regardless of stellar age. |
  | **Rare Earth (Complex)** | Intelligence is an evolutionary fluke. | Complex fossils found on exo-Earths. | **SHOUT** (We are unique) | **Same:** Intelligence is hard regardless of time. |
