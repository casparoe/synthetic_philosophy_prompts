  The GM shrugged. "You tried to bribe the gatekeeper. He got offended. We needed a bureaucracy to manage the fines."
  "But that was three years ago in-game," Sarah added. "Now the continent's borders are drawn from that fine structure."
  "Path dependence," the GM muttered. "Small perturbation, massive downstream effect. The initial arbitrary advantage amplified until switching costs were too high. You can't undo the Empire; the institutional inertia is too great."
  "So if I had rolled a 20?"
  "He takes the bribe. No fines. No bureaucracy. No Empire. Just independent towns."
  Dave sighed. "So civilization is just QWERTY keyboards made of flesh? Locked in by a single botched roll?"
  "Basically. The optimal outcome doesn't matter once the track is set. Now roll for initiative."

