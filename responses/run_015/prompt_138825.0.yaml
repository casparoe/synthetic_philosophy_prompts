answer: |-
  ### Room Temperature Check: What They're Actually Nervous About

  Before we get to the script, let's diagnose the anxiety in the room. It's not just about the math; it's about legitimacy and risk.

  1.  **The Economists** are nervous about *incommensurability*. DALYs work because they pretend all suffering is convertible into a single currency. You are introducing a new variable that resists empirical calibration. They fear you're breaking the calculator.
  2.  **The Welfare Scientists** are nervous about *anthropomorphism*. They deal in cortisol, gait scores, and mortality rates. "Affective bandwidth" sounds like poetry, not biology. They fear you're importing philosophical speculation into empirical grant-making.
  3.  **The Neurologist** is nervous about *anatomical reductionism*. She knows brain size is a terrible proxy for function across taxa (e.g., bird pallium vs. mammalian cortex). She fears you're making a category error.
  4.  **The Ethicist** is nervous about *moral hierarchy*. If suffering scales with neural complexity, does a human migraine outweigh a cow's death? This smells like "rationality = moral worth," which is the very ableism/intelligence-prejudice we try to avoid in animal ethics.
  5.  **The Director** is nervous about *reputational risk and churn*. If this model shifts funding from chickens (high numbers, low bandwidth) to cows (lower numbers, high bandwidth), do we have to explain to donors why we stopped saving the "most" animals?

  You are asking them to accept normative uncertainty (we don't know what suffering *is*) as a premise for empirical calculation (how we score grants). That is a hard sell.

  ***

  ### Q&A Prep Sheet

  Here are the eight objections you will face, ordered by the likely flow of conversation (Pragmatics → Empirics → Methodology → Ethics).

  #### 1. The Director (Pragmatics)
  **Objection:** "Let's cut to the chase. If we run this new formula on last year's pipeline, does the priority list flip? Do we stop funding cage-free hens to fund cow enrichment? I need to know if this is a tweak or a pivot."
  *   **Damage Flag:** 🔴 **High** (If the answer is "yes," you create immediate institutional friction).
  *   **Two-Minute Reply:** "It's a tilt, not a flip. Because we are using a geometric mean to hedge, we aren't discarding the neuron-count view (which favors smaller, numerous animals). The 'bandwidth' view raises the moral weight of larger mammals, but the hedging mechanism prevents them from dominating the portfolio entirely. My sensitivity analysis suggests the top-tier grants remain robust, but the *marginal* grants shift slightly toward larger species. We aren't abandoning the many for the few; we are adjusting the weight of the few to reflect normative uncertainty."
  *   **Softest Point:** You haven't actually run the full sensitivity analysis yet. If the shift is larger than you think, you lose credibility.

  #### 2. Welfare Scientist 1 (Poultry)
  **Objection:** "You're talking about 'dimensionality' of suffering. In my field, if I can't measure it behaviorally or physiologically, it doesn't exist. How do I validate 'bandwidth' in a broiler chicken? What's the biomarker?"
  *   **Damage Flag:** 🟠 **Medium** (Undermines the scientific legitimacy of the metric).
  *   **Two-Minute Reply:** "I agree we lack a direct biomarker for phenomenology. But we also lack a direct biomarker for 'intensity' in the current model—we infer that from behavior too. My argument is that the *capacity* for suffering is constrained by the hardware. We measure brain mass and pallial volume objectively. We aren't claiming to measure the *current* state of the chicken, but the *maximum possible resolution* of that state. It's like measuring the bandwidth of a cable rather than the data currently flowing through it. It's a structural limit, not a state measure."
  *   **Softest Point:** Conflating "capacity for representation" with "capacity for suffering." A high-res screen can display a blank white image.

  #### 3. Veterinary Neurologist
  **Objection:** "Absolute brain size is phylogenetically naive. A cow has a larger brain than a human, but less cortical folding and different connectivity. And birds? Their pallium is nuclear, not layered. Using absolute mass is biologically indefensible for cross-species comparison."
  *   **Damage Flag:** 🔴 **High** (Directly attacks the core empirical proxy).
  *   **Two-Minute Reply:** "You're absolutely right that absolute size fails across broad taxa, which is why the proposal specifies 'pallial or homologous tissue' and hedges with neuron counts. For the mammals we primarily fund, absolute size tracks the total substrate available for affective integration. I'm not arguing size equals intelligence; I'm arguing that you need a minimum amount of wiring to instantiate a complex, multi-dimensional negative state. I'm willing to refine the proxy to 'encephalized pallial volume' if you can recommend a better scaling factor, but the philosophical point stands: dimensionality requires substrate."
  *   **Softest Point:** You are deferring to her expertise ("if you can recommend"), which invites her to dismantle your proxy entirely.

  #### 4. Development Economist 1
  **Objection:** "We work in DALYs because they allow trade-offs. If you introduce 'bandwidth,' you're changing the unit of account. How do I compare a year of high-bandwidth suffering to ten years of low-bandwidth suffering? You're breaking the cardinal utility."
  *   **Damage Flag:** 🟠 **Medium** (Methodological friction).
  *   **Two-Minute Reply:** "We aren't breaking the utility; we're refining the weighting of the 'severity' component. Think of it like quality-adjusting the Q in QALYs. Currently, we assume a unit of pain is a unit of pain. I'm suggesting a unit of pain in a high-bandwidth system is *more* bad than a unit in a low-bandwidth system. The output is still a single number for ranking. The geometric mean ensures the number remains comparable to our historical data, just recalibrated for normative uncertainty regarding the nature of pain."
  *   **Softest Point:** The geometric mean *does* change the distributional properties of the score. It's not a simple recalibration; it's a non-linear transformation.

  #### 5. Ethicist
  **Objection:** "This sounds like intelligence-prejudice with extra steps. If a larger brain means 'worse' suffering, you're implying that cognitively simpler animals suffer 'less.' That's a slippery slope to valuing humans infinitely more than pigs. It violates the sentience-only commitment."
  *   **Damage Flag:** 🔴 **High** (Moral legitimacy risk).
  *   **Two-Minute Reply:** "I want to distinguish *moral status* from *moral weight*. Sentience-only grants entry to the moral circle; everyone inside counts. But 'how much' they suffer in a given state can vary. A human can suffer existential dread; a mouse cannot. That doesn't make the mouse's pain irrelevant, but the *kind* of pain is different. By hedging with neuron counts, I'm explicitly rejecting the idea that sophistication cancels out numbers. We are acknowledging uncertainty about the *structure* of badness, not the *right* to protection."
  *   **Softest Point:** The "existential dread" example is a trap. It invites the charge that you value "complex" pains over "simple" pains, which is ethically contentious.

  #### 6. Welfare Scientist 2 (Aquaculture)
  **Objection:** "Fish don't have a neocortex. If your model relies on pallial tissue, are you zero-ing out the fish grants? Because if you are, that's a non-starter for this fund."
  *   **Damage Flag:** 🟠 **Medium** (Programmatic risk).
  *   **Two-Minute Reply:** "Not at all. Fish have homologous structures in the dorsal pallium that process affect. The model accounts for homology, not just mammalian cortex. Furthermore, because we are using the geometric mean with neuron count, fish (which have high neuron densities in some regions) retain significant weight. The goal is to avoid zero-ing out any sentient group, but to accurately reflect the uncertainty about their phenomenological depth."
  *   **Softest Point:** The science on fish pallial homology is still debated. You're leaning on contested neuroanatomy.

  #### 7. Development Economist 2
  **Objection:** "Why geometric mean? In decision theory, that implies you think both models (brain size and neuron count) must be partially true simultaneously. Why not an arithmetic mean? Or a max-min approach?"
  *   **Damage Flag:** 🟢 **Low** (Technical quibble, but shows they're listening).
  *   **Two-Minute Reply:** "Geometric mean is the standard tool for aggregating under normative uncertainty when the scales might differ in magnitude but we want to avoid one view dominating entirely. It penalizes extreme divergence. If one model says 'zero' and the other says 'high,' arithmetic gives you a middle; geometric gives you zero. It forces us to acknowledge that if either theory is true, we shouldn't fully ignore it, but we also shouldn't bet the farm on the one with the larger numbers. It's a risk-averse aggregation strategy."
  *   **Softest Point:** You need to be sure the math holds up. If they ask for the specific utility function derivation, you need to have it ready.

  #### 8. The Director (Follow-up)
  **Objection:** "Okay, but if a donor asks why we value a cow's pain more than a chicken's, do I tell them 'because the cow has a bigger brain'?"
  *   **Damage Flag:** 🔴 **High** (PR/Comms risk).
  *   **Two-Minute Reply:** "No. You tell them we are accounting for scientific uncertainty about the depth of animal experience. We don't want to assume that all pain is identical across species. It's a precautionary principle: if larger neural architecture *does* allow for deeper suffering, we want to ensure we aren't neglecting that possibility. It's about robustness in our moral accounting, not ranking species."
  *   **Softest Point:** "Depth of experience" is almost indistinguishable from "intelligence" to a layperson. This is a messaging minefield.

  ***

  ### Strategic Concessions
  *You cannot defend everything. Concede these early to buy goodwill.*

  1.  **To the Neurologist:** Concede that absolute brain size is a crude proxy. Explicitly invite her to co-author the "neural substrate" parameter definition for the next fiscal year. This turns her from a critic into a stakeholder.
  2.  **To the Ethicist:** Concede that this metric must *never* be used to determine moral status (who counts), only moral weight (how much badness). Write that into the policy preamble.
  3.  **To the Economists:** Concede that this introduces more uncertainty into the model. Promise a "shadow score" report for one year where you run both the old and new models side-by-side before making funding decisions binding.

  ### The Question You Hope Nobody Asks
  **"If a human with microcephaly has a smaller brain and fewer neurons than a cow, does your model imply their suffering is less morally weighty than the cow's?"**

  *   **Why it's dangerous:** It exposes the "intelligence-prejudice" charge as factually consistent with your model. If you say "yes," you are a monster. If you say "no," you have to explain why the rule applies to animals but not humans, which looks like speciesism.
  *   **Prepared Deflection (if asked):** "Human moral weight includes social, relational, and self-narrative dimensions that our animal model does not capture. This model is specifically for *non-human* affective bandwidth where those higher-order narrative capacities are absent or negligible. We are not building a universal theory of moral weight, but a specific tool for cross-species animal welfare comparison." (This is weak, but it's the only shield you have).
