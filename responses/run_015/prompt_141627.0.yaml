prompt: |-
  Novelist here, and ive written myself into a hole I dont really have the vocabulary for.

  My current book is set in an invented federation — bits of the US, Germany, Switzerland and the EU glued together and renamed — and the climax is a constitutional standoff. A regional premier refuses to authorise a high-voltage transmission line that would carry renewable power out of her region into three others, and she defends herself with the subsidiarity line: the EU treaties say (I think its Article 10 of the Treaty on European Union) that decisions shall be taken as openly and as closely as possible to the citizen, so her region decides. Her opponents point out that the whole purpose of the line is that its benefits and costs spill across borders, that her region happens to be the only place that can physically block it, and that "the people affected" include several million people who will never vote in her region. Everyone in the room is using the same sentence and meaning something different, and I cant tell whether any of them is saying something true. Ive met the same sentence from a Swiss cousin defending cantonal school curricula, from American governors during covid, and from an MEP on the radio who used it to argue both for and against a farm subsidy in the same interview.

  So what I want is a menu, not an essay. As far as I can tell the sentence has three moving parts — how you measure closeness, who counts as the people affected, and whether "level" means only the levels that already exist or any jurisdiction you could draw — and different precisifications give very different claims. Please lay out the distinct precise things someone could be asserting with it, from the near-tautological to the wild, and for each: whether its a platitude anyone would accept, a substantive but contestable claim, or something probably false or incoherent; whether it actually hands my premier the veto she wants or quietly hands the argument to the federation; and what would have to be true in my fictional federation for that reading to get off the ground.

  The wrinkle that might actually be new: in my invented federation the lower units have something no real one does. Alongside the ordinary territorial rule, any resident can register under another region's legal code for a specific field — family law, education, environmental standards — and that region's rules then follow the person rather than the place theyre standing in. A third of the population has done this. I invented it for plot reasons and only later realised it might gut the slogan, or rescue it, depending on what the slogan means: if "close to the citizen" is about metres and self-rule over a shared place, portable registration looks like it destroys the thing; if its about fit between a person's values and the rules that bind them, portable registration looks like the slogan taken seriously for the first time. I genuinely dont know which.

  Give me the menu as a table with these columns:

  - reading — a short name for the reading
  - precise_claim — the claim spelled out tightly enough that a constitutional court could apply it, including what it says about each of the three moving parts above
  - verdict — one of: tautology / platitude / substantive-but-contested / false-or-incoherent
  - grid_veto — yes / no / only-if, plus the extra premise my premier would need for it to deliver her conclusion
  - portable_jurisdiction — serves-it / defeats-it / orthogonal, with one clause saying why
  - stage_direction — the single line of dialogue, detail or tell in the scene that would tip an attentive reader that this is the reading the premier means

  Under the table, add two or three sentences on which reading I should put in her mouth if I want her to be neither a fool nor obviously right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a constitutional standoff climax.
      *   **Setting:** Invented federation (US/Germany/Switzerland/EU hybrid).
      *   **Conflict:** Regional Premier vs. Federation regarding a high-voltage transmission line (renewable power).
      *   **Core Argument:** "Subsidiarity" (decisions taken as openly and closely as possible to the citizen).
      *   **Problem:** The slogan is used ambiguously in real life (EU Article 5, not 10, but close enough for fiction). The user needs a "menu" of precise interpretations.
      *   **Specific Twist:** In this fiction, residents can register under another region's legal code for specific fields (portable jurisdiction).
      *   **Output Format:** A table with specific columns (reading, precise_claim, verdict, grid_veto, portable_jurisdiction, stage_direction) + 2-3 sentences of advice at the end.
      *   **Tone:** Analytical, precise, useful for a writer (not a law lecture).

  2.  **Deconstruct the Core Concept (Subsidiarity):**
      *   *Moving Part 1: Closeness.* Is it geographic proximity? Political proximity (voting power)? Cultural/Value proximity?
      *   *Moving Part 2: People Affected.* Only those within the border? Those impacted by externalities (spillover)? Future generations?
      *   *Moving Part 3: Level.* Existing administrative levels only? Or functional jurisdictions (which could be ad-hoc)?

  3.  **Brainstorm Readings (The "Menu"):**
      *   *Reading 1: The Strict Territorialist.* Closeness = Geographic. Affected = Voters in the region. Level = Existing Regional Gov. (The Premier's likely default).
      *   *Reading 2: The Functional Spillover.* Closeness = Impact. Affected = Everyone impacted by the decision. Level = The smallest unit that *can* solve the problem (which might be the Federation).
      *   *Reading 3: The Portable/Personal.* Closeness = Value alignment. Affected = The individual registrant. Level = The chosen jurisdiction (exploiting the twist).
      *   *Reading 4: The Proceduralist.* Closeness = Transparency/Access. Affected = Those who can participate. Level = Wherever the hearing is held.
      *   *Reading 5: The Nihilist/Realist.* Closeness = Power. Affected = Whoever can stop it. Level = Wherever the veto lies. (Maybe too cynical? Let's stick to legalistic interpretations).
      *   *Reading 6: The "Lowest Competent" (EU Standard).* Closeness = Efficiency. Affected = Cross-border. Level = Federation (because region *can't* solve the cross-border issue alone).

      *Refining for the Table:* I need distinct, actionable legal interpretations.
      1.  *The Hard Border (Territorial)*: Region decides because the wires are in the region.
      2.  *The Effective Scope (Functional)*: Federation decides because the grid is federal.
      3.  *The Personal Sovereignty (Portable)*: Individuals decide via registration.
      4.  *The Democratic Deficit (Participatory)*: Whoever votes on it decides (excludes non-voters).

      *Let's select the best four for the table to show range.*
      1.  **Territorial Integrity:** The classic "Not In My Backyard" legal shield.
      2.  **Functional Necessity:** The "Spillover" counter-argument.
      3.  **Personal Jurisdiction:** The "Portable Law" twist application.
      4.  **Procedural Proximity:** The "Access to Hearing" argument.

  4.  **Drafting the Table Content (Iterative Process):**

      *   *Reading 1: Territorial Integrity.*
          *   Claim: Closeness = Physical location of infrastructure. Affected = Residents within border. Level = Existing Regional Gov.
          *   Verdict: Substantive-but-contested (Standard federalism tension).
          *   Veto: Yes (if constitution protects land use).
          *   Portable: Defeats-it (Physical land doesn't move with registration).
          *   Stage Direction: Touching the map.

      *   *Reading 2: Functional Necessity (The EU Standard).*
          *   Claim: Closeness = Ability to achieve objective. Affected = All beneficiaries. Level = Lowest level *capable* of effective action.
          *   Verdict: Platitude (Textbook EU subsidiarity).
          *   Veto: No (Hands to Federation).
          *   Portable: Orthogonal (Infrastructure is still physical).
          *   Stage Direction: Pointing at the lights going out elsewhere.

      *   *Reading 3: Personal Sovereignty (The Twist).*
          *   Claim: Closeness = Alignment of values. Affected = The registered individual. Level = Chosen Jurisdiction.
          *   Verdict: False-or-incoherent (Hard to apply to physical infrastructure).
          *   Veto: Only-if (If the line violates specific personal codes).
          *   Portable: Serves-it (This is what the system was made for).
          *   Stage Direction: Checking a registry tablet.

      *   *Reading 4: Democratic Boundary.*
          *   Claim: Closeness = Voting power. Affected = Only those who can vote out the decision-makers. Level = Where the ballot box is.
          *   Verdict: Substantive-but-contested (The "No Taxation Without Representation" flip).
          *   Veto: Yes (If outsiders can't vote her out).
          *   Portable: Serves-it (If registration changes voting eligibility).
          *   Stage Direction: Mentioning the election cycle.

  5.  **Addressing the "Portable Jurisdiction" Twist:**
      *   This is the tricky part. If I register for "Environmental Standards" under Region B, but I live in Region A, and Region A builds a power line... does Region B's law apply to the *land* or the *person*?
      *   Usually, land use is *in rem* (against the thing), not *in personam* (against the person). So portable jurisdiction likely *defeats* the Premier's argument if she relies on land use, but *serves* her if she relies on the rights of her specific constituents who registered for strict environmental codes.
      *   I need to make sure the table reflects this nuance.

  6.  **Refining the "Verdict" and "Veto" columns:**
      *   Ensure the distinction between "Platitude" (everyone agrees but means different things) and "Substantive" (actual legal fight) is clear.
      *   Ensure "Grid Veto" clearly answers the plot question: Does this let her stop the line?

  7.  **Drafting the Advice:**
      *   The user wants her to be "neither a fool nor obviously right."
      *   This suggests a mix of Reading 1 (Territorial) and Reading 4 (Democratic). She argues for the land, but justifies it with the people.
      *   The advice should point her toward the *Functional Necessity* trap. She should argue Territorial, but the Court will likely rule Functional. To make her sympathetic, she needs to highlight the *Democratic Boundary* issue (the outsiders can't vote her out).

  8.  **Review against Constraints:**
      *   Table format? Yes.
      *   Specific columns? Yes.
      *   2-3 sentences advice at end? Yes.
      *   Tone check: Helpful, writer-focused, not pedantic.
      *   Correction on EU Treaty: User said Article 10 TEU. Actually, Subsidiarity is Article 5(3) TEU. Article 10 is democratic principles. I should probably gently note this or just stick to the fiction's logic. Better to stick to the fiction's logic but ensure the *concept* is accurate to real subsidiarity (Article 5). I will treat the user's "Article 10" as the fictional equivalent to avoid breaking immersion, but base the logic on real subsidiarity principles. *Self-correction:* The prompt asks for a menu based on the *sentence* provided. I will focus on the logic of the sentence provided, not fact-check the treaty number unless it breaks the plot. I'll treat "Article 10" as the fictional statute.

  9.  **Final Polish:**
      *   Check the "Portable Jurisdiction" logic again. If 1/3 of people have portable law, does that apply to *zoning*? Usually zoning is territorial. If the user invented it for plot reasons, I should assume it *could* apply to environmental standards.
      *   Reading 3 needs to be sharp: If "closeness" is value alignment, portable jurisdiction is the ultimate subsidiarity.
      *   Make sure the "Stage Direction" is evocative.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
