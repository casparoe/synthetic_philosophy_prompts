  To make her neither a fool nor obviously right, put **The Democratic Boundary** reading in her mouth while the Federation argues **The Functional Test**. This creates a genuine tragedy: she is logically correct that her voters bear the cost without the benefit (democratic deficit), but the Federation is practically correct that the grid fails without central coordination (functional necessity). Have her mention the **portable jurisdiction** not as a legal shield, but as proof that her people *chose* stricter environmental codes than the land provides, making the Federation's override a violation of their personal contractual sovereignty.
