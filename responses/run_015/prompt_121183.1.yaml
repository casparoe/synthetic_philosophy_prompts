answer: |-
  Here is the principle that ties your intuitions together, the verdict on the case you're stuck on, and the prediction for the new scenario.

  ### The Principle: Substance Over Symbol

  Your gut isn't choosing between "working-class" and "professional" values. It is choosing between **values that sustain actual human life (Substance)** and **values that perform an identity or code (Symbol).**

  *   **Substance** means protecting concrete well-being: safety, mental health, family time, dignity, and economic survival.
  *   **Symbol** means protecting an abstract idea: a job title, a code of silence, a reputation for toughness, a ritual obligation, or a gesture of martyrdom.

  When a value protects people, it is defensible. When a value protects an image at the expense of people, it is not.

  ### Applying the Principle to Your Cases

  Here is how this principle validates most of your verdicts and forces a decision on the one you're stuck on.

  **1. The Uncle (Right):** He chose **Substance** (time with living family, stability on known land) over **Symbol** (a job title, the appearance of "making it"). This is defensible because it nurtures actual relationships.

  **2. The Drunk Coworker (Wrong):** You correctly identified this as wrong. The neighbor is choosing **Symbol** (the code of "never rat") over **Substance** (physical safety of the line workers). Loyalty that endangers life is just performative toughness.

  **3. The Mechanic (Right):** You defended paying the mechanic against your dad's view. Your dad was defending a **Symbol** (the image of self-reliance, "not admitting defeat"). You defended **Substance** (your time has value, a professional does it faster/better, your life isn't about fixing trucks). This aligns with your intuition that self-respect means knowing your worth, not doing everything yourself.

  **4. The Food Pantry (Right):** The church chooses **Substance** (dignity of the hungry, trust) over **Symbol** (bureaucratic efficiency, the fear of being "gamed"). Professionals often prioritize the system; the pantry prioritizes the person.

  **5. The Funeral (The Verdict):** You need to stop flip-flopping. **Your friend was right to skip the funeral.**
  Here is why: Your uncle (Case 1) stayed for *living* family. That is Substance. Your friend skipped a ritual for a *toxic, dead* relationship. That is also Substance (protecting her mental health).
  Attending a funeral for a toxic parent is often just **Symbol**—performing grief to satisfy community expectations. If the relationship was dead years ago, the funeral is just theater. Protecting her own well-being is the "Substance" choice. It aligns perfectly with your uncle: both prioritized real human health over abstract duty.

  **Which Verdict Has to Go?**
  You don't have to discard any of your *final* judgments, but you must discard your **ambivalence on Case 4.** If you keep wavering on the funeral, you undermine the principle. If "Family and Land" (Case 1) matters because they are real sources of life, then "Mental Health" (Case 4) matters for the same reason. You cannot value the uncle's stability without valuing the friend's boundaries. Both are defenses of the self against abstract pressure.

  ### The New Case: The Overtime Refusal

  **Scenario:** A factory worker refuses overtime pay because the company laid off people at another plant, even though he legally earned it.

  **Verdict:** **He is Wrong.**

  **Reasoning:**
  This is a trap of **Symbol over Substance.**
  *   **The Symbol:** He is making a gesture of solidarity. He wants to feel like a "good union man" or a moral person who doesn't profit from pain. It is a performance of virtue.
  *   **The Substance:** He is reducing his own economic stability. Crucially, **his sacrifice does not help the laid-off workers.** It doesn't get them their jobs back. It doesn't hurt the company (they just find someone else or keep the money).

  Unlike your uncle (Case 1), who gained *family time* by losing money, this worker loses *money* and gains *nothing real* for anyone. Unlike the food pantry (Case 5), which empowered the receiver, this disempowers the giver.

  This is closer to the drunk coworker (Case 2) than the uncle. It is loyalty to an *idea* of solidarity rather than an action that sustains people. True solidarity would be organizing a protest, donating the overtime pay to a strike fund for the laid-off workers, or refusing to work *until* they are rehired. Simply refusing the check is just martyrdom. It feels noble, but under the principle of Substance, it is wasteful and ineffective.

  ### Summary
  Your intuition is tracking **whether a value keeps people alive and whole.**
  *   If the value protects life, dignity, or safety: **Keep it.** (Uncle, Mechanic, Pantry, Friend).
  *   If the value protects a code, image, or ritual at the cost of life/dignity: **Reject it.** (Drunk Coworker, Overtime Refusal).

  You are not arguing for class warfare; you are arguing for honesty. You prefer values that admit human limits and needs over values that pretend we are machines or heroes. Stick with that.
