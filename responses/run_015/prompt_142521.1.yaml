answer: |-
  The Serrano Chronicle does not falsify the deflationist account; it confirms that your structural tests are insufficient to carry the weight you assign them. In 1978, the Chronicle is pseudohistory not because it lacks risk—you concede it risks falsification on the sand layer—but because its warrant is private rather than public. The numerological derivation is a 'hard core' insulated from professional critique by the author's claim of suppression; when he retracts it in 2003, he does not thereby enter the guild, he merely removes one barrier to entry. Consider the parallel of a gambler who predicts a roulette number using a dream: if the number hits, the prediction was risky and true, but the method remains non-statistical. Similarly, Serrano's correct prediction makes him a reliable witness to a geological fact, but it does not retroactively make his 1978 practice 'history.' The label 'pseudohistory' in 1978 tracks his isolation from the citation network and his reliance on auxiliary hypotheses (the suppression conspiracy) that no specialist is willing to co-sign.

  Your claim that the label shifts to 'history' in 2004 only if the institutional verdict changes proves my point, not yours. If the academy ignores the core sample or attributes it to luck, Serrano remains a pseudohistorian who got lucky, despite passing your tests of Risk and Address. The shift to 'history' occurs only when specialists take up the traffic, citing the find in peer-reviewed venues and integrating it into the broader chronology of Iberian settlement. That integration is a social act, not a logical one; it requires the community to accept liability for the claim. You argue that structural virtues cause this acceptance, but the Serrano case shows they do not guarantee it. The demarcation is the outcome of the community's willingness to defend the claim, not the intrinsic logic of the claim itself. We call it history when we are willing to be held responsible for it together; we call it pseudohistory when the author is left holding the bag alone.
