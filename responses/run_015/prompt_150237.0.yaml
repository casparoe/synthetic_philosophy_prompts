answer: |-
  ### The Lewis-Evolution Analogy: Correspondence and Limits

  The analogy between David Lewis's theory of convention and biological evolution is a staple of modern social ontology. It attempts to bridge the gap between *rationalist* accounts (agents choose norms because they are useful) and *selectionist* accounts (norms survive because they are fit). While the two frameworks often converge on the same equilibrium outcomes, their micro-foundations differ radically.

  Below is the explicit correspondence table, followed by an analysis of the disanalogies, the distinction between coordination and conflict, and a final verdict on the viability of the metaphor.

  ### 1. Explicit Correspondence Table

  | Biological Concept | Lewisian/Evolutionary Norm Concept | Function in the Analogy |
  | :--- | :--- | :--- |
  | **Genetic Material** | **Behavioral Strategy / Normative Rule** | The informational unit transmitted across time (e.g., "Drive on the left"). |
  | **Phenotypic Expression** | **Observable Compliance** | The actual performance of the behavior in a specific context. |
  | **Selective Environment** | **Payoff Structure / Institutional Context** | The game matrix (rewards/punishments) that makes conformity beneficial or costly. |
  | **Reproductive Success** | **Adoption Rate / Imitation Frequency** | The likelihood that a non-conformer switches to the norm after observing its success. |
  | **Evolutionary Drift** | **Historical Contingency / Stochastic Noise** | Random fluctuations in early adoption that lock in one arbitrary equilibrium over another. |

  ---

  ### 2. Disanalogies: Cosmetic vs. Threatening

  While the table above suggests a clean mapping, the mechanisms driving the "selection" differ fundamentally. We must distinguish between superficial differences in vocabulary and deep structural incompatibilities.

  #### Cosmetic Disanalogies
  *   **Substrate:** That norms reside in neural/cultural memory rather than DNA is irrelevant to the formal dynamics.
  *   **Timescale:** Norms evolve faster than genes, but the differential equations describing the rate of change remain mathematically isomorphic.
  *   **Vertical vs. Horizontal Transmission:** Biological evolution is primarily vertical (parent to offspring); norm evolution is heavily horizontal (peer to peer). This changes the speed and network topology but not the logic of selection.

  #### Threatening Disanalogies
  These disanalogies strike at the heart of Lewis's specific philosophical framework.

  **1. Rationality vs. Blind Selection (The Teleology Problem)**
  *   *Lewis:* Agents conform because they *recognize* the equilibrium. They have reasons. The stability of the norm is maintained by the *intentionality* of the agents (they prefer conformity conditional on others conforming).
  *   *Evolution:* Traits spread regardless of agent understanding. A norm can persist even if agents hate it, provided the punishment for deviation is high enough (selection pressure), without agents "preferring" the equilibrium in the Lewisian sense.
  *   *Threat:* **High.** Lewis's account is rationalist; evolution is causal. If agents stop believing in the norm, a Lewisian convention collapses immediately. An evolutionarily stable strategy (ESS) might persist through coercion or inertia even if belief evaporates.

  **2. Common Knowledge vs. Population Statistics**
  *   *Lewis:* Requires **Common Knowledge** (I know that you know that I know...). This is a high-cognitive, mentalistic requirement.
  *   *Evolution:* Requires only **Population Frequency**. Agents need not know what others know; they only need to respond to the statistical likelihood of encountering a strategy.
  *   *Threat:* **Critical.** Evolutionary models (like those of Brian Skyrms) were developed specifically to *eliminate* the need for Lewis's common knowledge. If you rely on the evolutionary analogy to explain *how* the norm emerged without common knowledge, you have abandoned Lewis's specific definition of convention.

  **3. Functional Optimization**
  *   *Lewis:* Conventions solve a coordination problem; they are functionally optimal for the group (Pareto efficient in coordination games).
  *   *Evolution:* Selection optimizes for *replication*, not group welfare. Norms can evolve that are harmful to the population (e.g., destructive arms races) but stable for the individuals.
  *   *Threat:* **Moderate.** This suggests the evolutionary analogy predicts "bad" norms that Lewisian rationality would reject.

  ---

  ### 3. Coordination vs. Distributional Conflict

  The viability of the analogy depends entirely on the type of norm being analyzed.

  #### Case A: Pure Coordination (e.g., Driving Side, Currency)
  *   **Lewisian Fit:** Perfect. Agents mutually prefer conformity; any equilibrium works.
  *   **Evolutionary Fit:** Perfect. Multiple ESS exist; drift determines which one is selected.
  *   **Analogy Status:** **Robust.** Here, the "blind" selection of evolution mimics the "arbitrary" choice of rational agents. The distinction between rational choice and evolutionary drift blurs because the outcome is identical.

  #### Case B: Distributional Conflict (e.g., Property Rights, Hierarchy, Caste)
  *   **Lewisian Fit:** **Fails.** Lewis defines convention as a coordination equilibrium where everyone *prefers* mutual conformity. In distributional conflict (Bargaining Games), one party prefers Equilibrium A (they get more) and the other prefers Equilibrium B (they get more). They do not mutually prefer conformity *simpliciter*; they prefer conformity *on their own terms*.
  *   **Evolutionary Fit:** **Mixed.** Evolution can explain how a power asymmetry stabilizes (e.g., the "Bourgeois" strategy in Hawk-Dove games). However, this is not a "convention" in Lewis's sense; it is a **regime of domination**.
  *   **Analogy Status:** **Collapsed.** You cannot use Lewis to explain norms born of power. A norm enforced by a ruling class is not a Lewisian convention because the subordinate class does not "prefer mutual conformity" independently of the threat of force.

  ---

  ### 4. Verdict and Defense

  **Verdict:** The evolutionary analogy **collapses** as a foundation for Lewis's specific theory of convention, though it survives as a broader theory of *social stability*. Lewis's framework explains only a proper subset of normative evolution (pure coordination). For norms emerging from distributional conflict, the Lewisian-evolutionary hybrid must be discarded in favor of a **Power-Bargaining Framework**.

  **Defense:**

  1.  **The Micro-Foundational Mismatch:** Lewis's project was to reduce social facts to individual rationality and common knowledge. Evolutionary theory reduces social facts to population dynamics and replication. These are competing reductions, not complementary ones. If you adopt the evolutionary analogy to explain the *emergence* of norms (bypassing common knowledge), you have ceased to do Lewisian philosophy. You are doing Evolutionary Game Theory (EGT). While EGT yields Lewisian *equilibria*, it rejects Lewisian *agency*. Therefore, the analogy holds for the *outcome* (the equilibrium) but fails for the *ontology* (what the norm *is*).

  2.  **The Conflict Blindspot:** Lewis's definition of convention explicitly excludes conflict. If a norm persists because one group coerces another, it is not a coordination equilibrium; it is a Nash equilibrium in a game with asymmetric payoffs where the losers would defect if they could. Applying the "evolution of convention" metaphor here smuggles in legitimacy. It implies the norm is a functional solution for the group (like driving on the left), rather than a tool of extraction. This is the "functionalist fallacy" of evolutionary ethics.

  3.  **The Repair Attempt:** Can we repair Lewis? Yes, by supplementing him with **Evolutionary Game Theory (Skyrms/Young)**. This framework retains the equilibrium focus but drops the "Common Knowledge" requirement, replacing it with "learning dynamics." This saves the *evolutionary* narrative but sacrifices the *rationalist* core of Lewis.

  **Replacement Framework for Distributional Norms:**
  For norms arising from conflict (property, hierarchy, gender roles), the evolutionary/convention analogy should be replaced by a **Theory of Bargaining and Power**.
  *   **Framework:** **Nash Bargaining Solutions with Threat Points** or **Marxist/Weberian theories of Domination**.
  *   **Mechanism:** Instead of "drift" selecting an arbitrary equilibrium, *asymmetric bargaining power* selects the equilibrium that favors the dominant agent.
  *   **Analogy:** Instead of biological evolution (blind selection), the appropriate metaphor is **Ecological Niche Construction** or **Parasitism**. The norm does not evolve for the "health of the organism" (society) but for the replication of the "parasite" (the ruling elite), potentially at the host's expense.

  **Conclusion:**
  The Lewis-Evolution analogy is a powerful heuristic for **coordination norms**, where arbitrariness and stability align. However, it is a category error when applied to **distributional norms**. In the latter case, the metaphor obscures the role of power by framing coercion as "convention." A complete social philosophy must distinguish between norms that solve coordination problems (Lewis/EGT) and norms that settle conflict (Bargaining/Power), recognizing that only the former are truly "conventions."
