prompt: |-
  People in social philosophy and evolutionary ethics often compare the emergence of social norms to biological evolution: norms mutate, spread through populations, face selection pressure from institutional environments, and settle into stable equilibria. David Lewis's analysis of convention as a coordination equilibrium — where agents prefer mutual conformity and face alternative possible regularities — is frequently recruited as the formal backbone for this evolutionary picture. How far does the analogy actually hold? Give me the explicit correspondence table: what plays the role of genetic material, phenotypic expression, selective environment, reproductive success, and evolutionary drift? Then identify the disanalogies that matter specifically for Lewis's framework: does the evolutionary analogy smuggle in teleology, group-level intentionality, or functional optimization that a purely game-theoretic account of convention rejects? Separate the disanalogies that threaten the evolutionary narrative from those that are merely cosmetic. Finally, assess whether the analogy survives once we distinguish between norms that solve pure coordination problems (where Lewis's model applies cleanly) and norms that emerge from distributional conflict or power asymmetry (where mutual preference for conformity fails). Does this distinction show that convention theory can explain only a subset of normative evolution, or can the evolutionary framing be repaired by supplementing Lewis's framework? Reach a verdict and defend it; if the evolutionary metaphor collapses for the distributional case, say what framework or analogy should replace it there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Topic:** The analogy between social norm emergence (specifically David Lewis's convention theory) and biological evolution.
      *   **Task 1:** Create an explicit correspondence table (Genetic material, Phenotype, Selective environment, Reproductive success, Drift).
      *   **Task 2:** Identify disanalogies specific to Lewis's framework (Teleology, Group-level intentionality, Functional optimization).
      *   **Task 3:** Separate "threatening" disanalogies from "cosmetic" ones.
      *   **Task 4:** Assess the analogy across two types of norms: Pure Coordination (Lewisian) vs. Distributional Conflict/Power (Non-Lewisian).
      *   **Task 5:** Reach a verdict: Can convention theory explain only a subset? Can the evolutionary framing be repaired? If it collapses, what replaces it?
      *   **Constraint:** Defend the verdict.

  2.  **Analyze the Core Concepts:**

      *   **David Lewis's Convention:** Defined in *Convention: A Philosophical Study* (1969). Key features: Regularity in behavior, common knowledge, arbitrary (could have been otherwise), coordination equilibrium (everyone prefers conformity given others conform). It's game-theoretic (Nash equilibrium in coordination games).
      *   **Evolutionary Ethics/Social Philosophy:** Norms evolve via variation, selection, and retention. Often uses evolutionary game theory (EGT).
      *   **The Tension:** Lewis's account is rationalist/mentalistic (agents *know* and *prefer*). Evolutionary accounts are often blind/selectionist (traits survive because they work, not because agents chose them for that reason).

  3.  **Drafting the Correspondence Table (Task 1):**

      *   *Genetic Material:* In biology, it's DNA. In norms, it's the "rule" or "behavioral strategy" encoded in memory/culture. Let's call it "Behavioral Strategy / Normative Rule."
      *   *Phenotypic Expression:* In biology, it's the physical trait. In norms, it's the "Observable Action / Compliance."
      *   *Selective Environment:* In biology, it's nature/ecosystem. In norms, it's the "Payoff Structure / Institutional Context."
      *   *Reproductive Success:* In biology, it's offspring count. In norms, it's "Adoption Rate / Imitation Frequency."
      *   *Evolutionary Drift:* In biology, it's random fluctuation. In norms, it's "Stochastic Noise in Transmission / Historical Contingency."

  4.  **Identifying Disanalogies (Task 2 & 3):**

      *   *Teleology:* Biology is blind; Lewisian agents are forward-looking (rational). *Threatening?* Yes, because evolution explains *how* we got here without purpose, while Lewis explains *why* we stay here based on reason.
      *   *Group-level Intentionality:* Evolution doesn't need a group mind. Lewis requires "Common Knowledge" (a recursive mental state shared by the group). *Threatening?* Yes, common knowledge is a high cognitive bar that evolutionary dynamics usually bypass.
      *   *Functional Optimization:* Evolution optimizes for fitness (often locally). Lewis optimizes for utility (coordination). *Threatening?* Maybe cosmetic if outcomes match, but the *mechanism* differs.
      *   *Cosmetic vs. Threatening:*
          *   *Cosmetic:* Terminology (genes vs. memes).
          *   *Threatening:* The mechanism of transmission (replication vs. rational adoption) and the requirement of Common Knowledge. Evolution works on populations; Lewis works on interacting rational agents.

  5.  **Assessing Coordination vs. Conflict (Task 4):**

      *   *Pure Coordination (Driving on the left/right):* Lewis fits perfectly. Evolution fits perfectly (convergence on ESS). Analogy holds well here.
      *   *Distributional Conflict (Property rights, hierarchy):* Lewis fails because there is no *mutual* preference for conformity (one side prefers the other outcome). This is a Bargaining Game or Prisoner's Dilemma, not a Coordination Game.
      *   *Implication:* The evolutionary analogy might still hold for conflict norms (power selects the norm), but the *Lewisian* backing collapses. You can't call it a "Lewisian Convention" if it's coerced.

  6.  **Formulating the Verdict (Task 5):**

      *   *Verdict:* The analogy is robust for *selection dynamics* but fragile for *Lewisian foundations*. It survives as a general evolutionary social theory but fails as a specific explication of Lewis's *Convention*.
      *   *Reasoning:* Lewis requires rationality and common knowledge. Evolution requires only differential replication. They converge on equilibrium but diverge on path and stability conditions.
      *   *Distributional Case:* Lewis's framework *cannot* explain power-based norms. We need a framework of *dominance* or *bargaining* (e.g., Ullmann-Margalit, Skyrms, or Marxist/Power-based theories).
      *   *Repair:* Supplement Lewis with Evolutionary Game Theory (Skyrms) which drops the "Common Knowledge" requirement but keeps the equilibrium focus. Or switch to a Power/Conflict framework.

  7.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Critique of Lewis:* Ken Binmore and Brian Skyrms have argued that evolutionary dynamics *ground* Lewis's rationality. We don't need common knowledge; we just need learning dynamics that converge to equilibrium. This *repairs* the analogy by subsuming Lewis into EGT.
      *   *Critique of Evolution:* Evolution implies path dependence and potential inefficiency (lock-in). Lewis implies arbitrariness but stability.
      *   *The "Teleology" point:* Lewis isn't teleological in the cosmic sense, but agents are teleological. Evolution is not. This is a category error if conflated.
      *   *Distributional Norms:* These are often "equilibria" but not "conventions" in Lewis's strict sense. They are "institutions" or "regimes."

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the prevalence of the analogy (Lewis + EGT). State the thesis (Analogy holds for dynamics, breaks for micro-foundations; fails completely for conflict norms).
      *   **Correspondence Table:** Clear and direct.
      *   **Disanalogies:** Distinguish Cosmetic vs. Threatening. Focus on Common Knowledge vs. Blind Selection.
      *   **Coordination vs. Conflict:** Analyze the limits of Lewis.
      *   **Verdict & Replacement:** Conclude on the subset limitation and propose EGT (Skyrms) or Power Theory for the rest.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Table:* Make sure "Genetic Material" isn't too literal. It's the *informational content* of the norm.
      *   *Disanalogies:* Emphasize "Common Knowledge." That is the biggest hurdle. Evolution doesn't need agents to *know* others know.
      *   *Conflict:* Use the term "Bargaining Problem" vs. "Coordination Problem."
      *   *Verdict:* Be decisive. The Lewisian *rationalist* foundation is incompatible with strict *blind* evolution, but Lewisian *equilibria* are compatible with EGT. However, for conflict, both need modification.

  10. **Final Review against Prompt:**
      *   Explicit correspondence table? Yes.
      *   Disanalogies (Teleology, Intentionality, Optimization)? Yes.
      *   Cosmetic vs. Threatening? Yes.
      *   Coordination vs. Distributional? Yes.
      *   Verdict and Defense? Yes.
      *   Replacement framework? Yes (Evolutionary Bargaining/Power).

  11. **Final Polish:** Ensure tone is academic and precise. (Self-correction: Ensure I don't conflate Lewis with all game theory. Lewis is specific about *common knowledge* and *preference for conformity*.)

  *(Self-Correction during drafting)*: I need to be careful not to say evolution *never* involves intentionality. Cultural evolution does. But the prompt asks about the analogy to *biological* evolution primarily, or at least the structural analogy. I will focus on the structural disanalogy between *rational choice* (Lewis) and *selection dynamics* (Evolution).

