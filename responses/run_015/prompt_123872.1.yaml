answer: |-
  You vote for the machine because silence is a cold companion, and you mistake the purpose of the gathering. It is easy to let forms rot into sentimentality; I know well that Humanity with a capital H is a cheap thing to love if it costs no sacrifice. But if you wire the dead to speak, you turn them into puppets of your longing, and that is a deeper fraud than silence. The value of your debt does not depend on their signature. You say the machine feels less fraudulent because it answers? No. It is less fraudulent only because it spares you the terror of a universe that does not talk back. Duty does not require a divine claimant, nor does it require the dead to nod assent.

  You ask what the dead are doing in that room that a recording could not do better. They are doing the only thing they can do: they are absent. Their absence is the whetstone against which your sympathy is sharpened. A recording kills the labor of imagination, which is the root of moral life. You must conjure them in the mind, flawed and finite, to understand what you owe the future. If you replace that labor with a phonograph, you abandon the ceremony not for truth, but for comfort. Keep the silence. It is the only space large enough to hold your duty.
