answer: |-
  **Essay Prompt (45 Minutes)**

  **Topic:** The Paradox of Ficiton and Shadow Endorsement

  Standard formulations of the paradox assume that genuine emotion requires existential belief. However, consider the claim that the paradox does not require full belief in reality, but rather a weaker state like "shadow endorsement," where you don't literally believe Hamlet died but still treat the scenario as live for affective processing.

  Using this concept, compare Walton's quasi-emotion/make-believe view with Currie's simulation account. Defend which one handles shadow endorsement better without collapsing into the other. Your answer should clarify why one account accommodates this weaker cognitive state more naturally while maintaining the distinction between fictional engagement and delusion.

  ***

  **Model Answer**

  The traditional paradox of ficiton relies on a strict belief condition: we cannot feel fear for something we know does not exist. Introducing "shadow endorsement" disrupts this binary. Shadow endorsement suggests a cognitive state where propositions are accepted for affective processing without ontological commitment. We do not believe Hamlet exists, but we process his death as if it matters. This middle ground challenges both Walton and Currie, but Currie's simulation theory accommodates it more successfully without dissolving the genuineness of the emotion.

  Walton argues that engagement with fiction is a game of make-believe. When we watch a horror movie, we experience physiological arousal, but because there is no actual object of fear, the emotion is merely "quasi-emotion." For Walton, shadow endorsement looks like make-believe. We pretend to believe the monster is dangerous to generate the pretend fear. However, Walton's view struggles with shadow endorsement because it demands we deny the reality of the emotion itself. If shadow endorsement implies we truly feel sadness for Hamlet, Walton must say we are mistaken about our own mental states. He solves the paradox by reducing the emotion to a prop in a game, which clashes with the phenomenological intensity readers report.

  Currie, conversely, proposes a simulation account. He argues we take our belief-desire psychology off-line. We feed fictional premises into our standard emotional machinery without triggering action tendencies. Here, shadow endorsement maps directly onto off-line processing. We endorse the premise "Hamlet died" for the sake of the simulation, generating a genuine emotion because the machinery is real, even if the input is not. Currie preserves the intuition that our sadness is real while explaining why we don't call the police.

  Currie handles shadow endorsement better because it validates the affective response without requiring ontological belief. Shadow endorsement is essentially what off-line simulation feels like from the inside. Walton, by contrast, forces a distinction between real emotion and quasi-emotion that shadow endorsement seeks to bypass. If we are shadow-endorsing the scenario, we are treating it as live for affective processing, which aligns with Currie's genuine emotion generated by non-belief inputs.

  However, Currie must avoid collapsing into the view that we simply believe the fiction temporarily. He avoids this by emphasizing the quarantine mechanism. The off-line system is causally disconnected from action. We feel the sadness, but we do not form the desire to intervene. This distinguishes shadow endorsement from delusion. Walton avoids collapsing into Currie by insisting on the normative structure of games of make-believe rather than cognitive mechanics. Yet, Walton's rigidity makes shadow endorsement look like error, whereas Currie treats it as a functional feature of human cognition.

  Ultimately, shadow endorsement undermines Walton's need to downgrade the emotion. If we can endorse a scenario for processing without believing it exists, Currie's simulation explains how the emotion remains genuine while the belief remains absent. Walton solves the paradox by denying the emotion; Currie solves it by explaining the belief. Since shadow endorsement accepts the emotion as given, Currie's framework provides the superior fit, accommodating the nuance of fictional engagement without reducing our responses to mere pretense.

  ***

  **Marking Scheme (20 Points Total)**

  **1. Define/Contextualize Shadow Endorsement (4 points)**
  *   **Must Hit:** Clearly explain shadow endorsement as a state of affective processing without ontological commitment (treating scenarios as live without literal belief).
  *   **Common Botch:** Students treat shadow endorsement as just "partial belief" or confuse it with suspension of disbelief.

  **2. Accurately Characterize Walton's View (4 points)**
  *   **Must Hit:** Explain quasi-emotion and make-believe; note that Walton denies the genuineness of the emotion to solve the paradox.
  *   **Common Botch:** Students claim Walton thinks we feel nothing, rather than feeling physiological arousal without genuine propositional content.

  **3. Accurately Characterize Currie's View (4 points)**
  *   **Must Hit:** Explain the off-line simulation mechanism where standard psychology generates genuine emotion disconnected from action.
  *   **Common Botch:** Students confuse simulation with simple imagination or fail to mention the disconnection from action tendencies.

  **4. Comparative Analysis on Shadow Endorsement (4 points)**
  *   **Must Hit:** Explicitly connect shadow endorsement to one view more naturally (usually Currie) based on how they handle the belief/emotion link.
  *   **Common Botch:** Students describe both views separately without comparing how they specifically handle the "shadow endorsement" concept.

  **5. Defense Without Collapse (4 points)**
  *   **Must Hit:** Argue why the preferred view works without collapsing into the opposing view (e.g., Currie doesn't imply full belief; Walton doesn't admit genuine emotion).
  *   **Common Botch:** Students argue one view is "correct" without addressing the specific risk of collapsing into the other theory's definitions.
