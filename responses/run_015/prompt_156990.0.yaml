          *   *Reason 1: The Causal Chain (Karaṇa).* The *karaṇa* of inference is *vyāpti-jñāna* (knowledge of pervasion) operating on the perceptual input. The output is *new* knowledge not contained in the input. Perception gives "fire on the hill," Inference gives "there is fire because of smoke." The *content* is different.
          *   *Reason 2: The Object of Cognition (Viṣaya).* Perception grasps the present, manifest (*sannikarṣa*). Inference grasps the unperceived (*parokṣa*). This is a metaphysical distinction, not just a processing one.
          *   *Reason 3: Normative Independence.* A *pramāṇa* is defined by its ability to generate *pramā* (valid cognition) *de novo*. If inference were just perception + memory/testimony, it wouldn't generate *new* validity. It transforms the status of the information.
      *   **Internal Nyāya Justifications (The "Principled Reason"):**
