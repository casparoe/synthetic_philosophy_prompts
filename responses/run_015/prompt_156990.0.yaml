  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's insight. It's a fertile area of research. State the thesis: The modular reading is heuristic but risks category error. Nyāya is normative/epistemic, Fodor is descriptive/psychological.
      *   **The Modularity Analogy (Fodor vs. Nyāya):**
