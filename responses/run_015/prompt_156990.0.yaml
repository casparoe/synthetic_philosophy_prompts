  6.  *(Self-Correction during drafting)*: Wait, I should check if there are specific scholars who have addressed this. B.K. Matilal definitely discussed logic and epistemology. Stephen Phillips is good on Navya-Nyāya. I should mention the distinction between *psychological genesis* and *epistemic justification*. That's the crux.

