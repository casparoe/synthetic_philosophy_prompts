          *   His EPR argument was: QM is non-local OR incomplete. He assumed Locality was non-negotiable, so it *must* be incomplete.
          *   Bell says: You can't have a Local Completion.
          *   So, Einstein would face a trilemma:
              1.  Accept Non-locality (Spooky action).
              2.  Accept Incompleteness (but Bell says local incompleteness doesn't work in the way EPR hoped).
              3.  Reject the experimental results (unlikely for Einstein).
      *   *Refinement:* Einstein distinguished between the *quantum state* (statistical ensemble) and the *real state* of an individual system. He viewed the wavefunction as incomplete. Bell shows that *any* completion respecting locality fails.
      *   *Conclusion:* He would likely view it as a refutation of *Separability* (which he held dear) rather than just a confirmation of incompleteness. However, he might try to salvage "Separability" by questioning the applicability of the experiments to "real" individual systems (ensemble interpretation). But the strongest historical evidence suggests he viewed Separability as a *sine qua non* of physics. If forced to choose, he might admit QM is correct but "not physics" in his sense, or (more likely) admit that the "independence of distant things" is the casualty.

