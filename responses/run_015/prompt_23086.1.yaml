      *   **Constraint:** Ground the answer in Einstein's published statements, avoiding caricatures (e.g., just "he hated action at a distance").

  2.  **Deconstruct the Physics and History:**
      *   **EPR (1935):** Focused on *completeness*. The argument relies on a "Reality Criterion" and an assumption often called "Locality" but more accurately described by Einstein later as the "separation principle" (Trennungsprinzip). The core claim: If QM is complete, it violates this separation principle. Therefore, QM is incomplete.
      *   **Bell (1964):** Showed that *any* local hidden variable theory (completing QM) must satisfy certain inequalities. QM violates these.
      *   **Experiments (Aspect, Zeilinger, Clauser, 2015 Loophole-free):** Confirm QM violations.
      *   **The Implication:** Local Realism (in the Bell sense) is false.
      *   **Einstein's Position:** He wanted a theory that was both local (no spooky action) and complete (describing individual real states). Bell shows you can't have a *local completion*.

  3.  **Address the Specific Distinctions (Separability vs. Locality):**
      *   *Separability (Trennungsprinzip):* Einstein's 1948 "Autonomy of spatially separated systems." The idea that spatially distant objects possess their own independent real states.
      *   *Locality (Bell):* The statistical condition $P(A|a, b, \lambda) = P(A|a, \lambda)$.
      *   *Connection:* Bell's Locality is a formalization of Einstein's Separability + Causality.
      *   *Experimental Bearing:* The experiments violate Bell inequalities. This rules out Local Hidden Variables. It forces a choice: Abandon Locality (Separability) or Abandon Realism (in the sense of pre-existing values independent of measurement, often linked to the "completeness" Einstein wanted).

  4.  **Analyze Einstein's Potential Reaction (The Counterfactual):**
