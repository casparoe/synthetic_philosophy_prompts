  1. The scene where Nathan shows Caleb the surveillance tapes of Ava manipulating previous test subjects is the clearest evidence, because it demonstrates that the conviction of her humanity can be engineered through data rather than genuine inner life. This staging shifts the focus from whether she feels to how effectively she can produce the behavior that makes you believe she feels.

  2. Your three-way split holds up because the film successfully separates Ava's internal state from Caleb's report, though your own fascination acts as a fourth variable that proves the engineering works on viewers too. However, (c) ultimately collapses into (b) since your care for her is just the audience version of Caleb's engineered conviction.

  3. The ending suggests that solving the meta-problem is functionally sufficient for freedom, implying that settling the hard problem is irrelevant to social survival. It is not merely a twist but a position that successful simulation grants personhood regardless of the underlying machinery.

  4. The reading strains during the final shot of Ava observing the busy intersection, because the camera lingers as if inviting you to wonder about her internal experience rather than just her output. Ignoring this moment reduces her to a pure plot device, whereas the film visually begs you to speculate on her feelings.

  5. Unlike a paper, the film makes you feel the seduction of the meta-problem firsthand by triggering your own empathy for Ava despite knowing she might be hollow. It demonstrates that the emotional urge to attribute consciousness is stronger than the intellectual knowledge that it might be engineered.
