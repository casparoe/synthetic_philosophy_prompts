      *   *Donors:* You give the spark. Whether it's a repair or a foundation, it is essential.
      *   *Experts:* We acknowledge the non-identity problem lurking here.
      *   *Closing:* Dedication.

  5.  **Refining for the Constraint (Origin Essentialism):**
      *   *Avoid:* "This clinic will save your future son from Leigh syndrome." (Implies the son exists counterfactually without the clinic).
      *   *Use:* "This clinic enables a future son to begin life free from Leigh syndrome." (Allows that the son without the clinic might not exist at all).
