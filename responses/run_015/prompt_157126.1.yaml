prompt: |-
  Write the opening remarks for the dedication ceremony of a new clinic offering mitochondrial replacement therapy — a procedure in which nuclear DNA comes from the intended parents but healthy mitochondrial DNA comes from a donor egg, so the child has genetic material from three people. The audience is mixed: reproductive clinicians, philosophers of biology, patient families, and lay donors with no philosophical training. Let the remarks be structurally governed by origin essentialism — the view that a person necessarily originates from the particular gametes and cytoplasmic sources from which they actually developed — without settling whether it holds. This constraint should prevent you from claiming that the clinic ‘saves’ or ‘heals’ specific children who would otherwise suffer; instead, navigate whether altering origins produces not a healthier version of the same child but a numerically different one, and therefore whether gratitude is owed to the donor for ‘giving life’ rather than for repairing it. The speech must comfort families without false metaphysical promises, and must reward expert listeners with precise philosophical tension rather than mere decoration. After the remarks, provide a brief structured summary in JSON with exactly these fields: occasion, audience_mix, metaphysical_constraint, rhetorical_move_for_families, rhetorical_move_for_experts, ambiguity_preserved.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Opening remarks for a dedication ceremony of a new clinic offering mitochondrial replacement therapy (MRT).
      *   **Audience:** Mixed (reproductive clinicians, philosophers of biology, patient families, lay donors).
      *   **Constraint:** Structurally governed by *origin essentialism* (the view that a person necessarily originates from the particular gametes/cytoplasm from which they actually developed).
      *   **Constraint Detail:** Do *not* settle whether origin essentialism holds. Do *not* claim the clinic 'saves' or 'heals' specific children who would otherwise suffer (because if origin essentialism is true, altering mitochondria creates a numerically different person, not the same person healed).
      *   **Goal:** Navigate the tension between altering origins producing a different child vs. a healthier version of the same child. Address whether gratitude is owed for 'giving life' vs. 'repairing it'.
      *   **Tone:** Comfort families without false metaphysical promises. Reward expert listeners with precise philosophical tension.
      *   **Output:** Opening remarks + JSON summary with specific fields.

  2.  **Deconstruct Origin Essentialism in this Context:**
      *   *Origin Essentialism (OE):* If $x$ originates from $Z$, $x$ could not have existed without originating from $Z$.
      *   *MRT Context:* Nuclear DNA (parents) + Mitochondrial DNA (donor).
      *   *If OE is true:* The child born via MRT is *not* the same child who would have been born without MRT (because the cytoplasmic origin differs). Therefore, MRT doesn't "prevent disease in *this* child"; it "brings into existence a *different* child who is healthy."
      *   *If OE is false:* The child is the same person, just with repaired mitochondria.
      *   *Constraint:* I cannot say "We are saving your future child from disease." I must say something like "We are enabling a future child to exist who is free from disease, though the metaphysical identity of that child depends on views we do not settle today."
      *   *Gratitude:* If OE is true, the donor isn't fixing a broken part; they are providing the very substrate of existence. Gratitude is for *life*, not *health*. If OE is false, gratitude is for *health*. The speech must hover between these.

  3.  **Drafting - Section by Section:**

      *   **Welcome:** Acknowledge the diverse audience (clinicians, philosophers, families, donors).
      *   **The Technology:** Briefly explain MRT (three genetic parents) without getting bogged down in mechanics, focusing on the *source* of life.
      *   **The Philosophical Tension (The Core):** Introduce the question of identity. Avoid saying "we prevent suffering in *your* child." Instead, frame it as "we enable a beginning."
