      *   *Use:* "Providing the energetic foundation for a new life." (Neutral on identity).
      *   *Key Phrase:* "Numerical distinctness vs. Qualitative continuity."

  6.  **Final Polish:** Check against the JSON requirements.
      *   Fields: occasion, audience_mix, metaphysical_constraint, rhetorical_move_for_families, rhetorical_move_for_experts, ambiguity_preserved.

  7.  **Writing the Speech:**
