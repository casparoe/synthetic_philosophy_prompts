      *   **Addressing Donors:** Frame their contribution not just as medical material but as constitutive of life itself (appealing to OE without confirming it).
      *   **Addressing Experts:** Use precise language ("numerical identity," "cytoplasmic origins," "counterfactuals") to show awareness of the tension.
      *   **Conclusion:** Dedicate the clinic as a space of inquiry and care, holding the tension.

      *   *Self-Correction on Constraint:* I must ensure I don't slip into "preventing disease in *the* child." I need to use phrasing like "a child free from disease" rather than "your child free from disease." I need to highlight the distinction between *qualitative* improvement (health) and *numerical* difference (identity).

      *   *Refining the "Gratitude" angle:* If OE is true, the donor gives life. If OE is false, the donor gives health. The speech should suggest gratitude is owed regardless, but for slightly different reasons that overlap.

      *   *Tone Check:* Needs to be solemn, thoughtful, not overly technical but not dumbed down.

  4.  **Drafting the Content (Mental or Scratchpad):**
      *   *Opening:* Welcome everyone.
      *   *The Science:* Three genetic contributors.
      *   *The Philosophy:* What makes a person? Is it the nucleus? The cytoplasm? Both?
