      2.  *Structural Craving:* Standing dispositions count as bad, even if not occurrently felt.
      3.  *Experientialism:* Only conscious experience (or what is realized in it) counts.
      4.  *Symmetry:* Death isn't bad. Unknown frustration isn't bad.
      5.  *Case Verdicts:* (i) Pain without aversion/craving isn't bad. (ii) Joy with constant wanting is bad.
      6.  *Practice:* Pursues pleasant experiences (dinners, hikes) but prioritizes craving reduction.

  3.  **Identify Tensions:**

      *   **Tension 1: Structural Craving vs. Experientialism (Severity: High).**
          *   Commitment 2 says structural craving (a standing disposition *not* necessarily felt) is bad.
          *   Commitment 3 says only what is realized in conscious experience counts.
          *   *Conflict:* If structural craving is never felt (occurrent), how is it realized in conscious experience? If it's a dispositional state of the brain that doesn't manifest phenomenologically until triggered, Experientialism says it shouldn't count. But Tranquilism needs it to count to explain why the "busy striver" is worse off than the "calm contented" person when both are currently experiencing neutral/positive states.
          *   *Fix:* Either weaken Experientialism to include dispositional states (costly) or redefine Structural Craving as always having a subtle phenomenological signature (e.g., background tension).

      *   **Tension 2: Tranquilism (Neutral Pleasure) vs. Practice (Severity: Medium).**
          *   Commitment 1 says pleasant experience not stilling craving is neutral (no prudential value).
          *   Commitment 6 says the user spends real time/money on pleasant experiences and recommends them.
