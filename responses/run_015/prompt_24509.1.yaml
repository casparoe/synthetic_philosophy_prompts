answer: |-
  This is a classic setup for the **Wrong Kind of Reasons (WKR) problem** in meta-normativity. Your friend is distinguishing between reasons that bear on the *correctness* or *fittingness* of an attitude (Right Kind) versus reasons that bear on the *benefits* or *consequences* of holding that attitude (Wrong Kind).

  Here is the breakdown of her logic, the competing hypotheses, and the prediction.

  ### 1. The Prediction
  **Verdict:** She will almost certainly call "X is famous" a **Wrong Kind of Reason (WKR)** to admire X.

  ### 2. The Underlying Rules
  Her track record is consistent with three distinct rules. Two of them diverge on the "fame" case, which is where the philosophical action is.

  #### **Rule A: The Constitutive Standard Rule (The "Fittingness" Rule)**
  *   **The Rule:** A reason is the *Right Kind* if and only if it speaks to the **constitutive standard of correctness** for that specific attitude. A reason is the *Wrong Kind* if it speaks to the **pragmatic benefits** of holding the attitude.
      *   *Belief:* Aims at Truth (Evidence = RKR; Feeling Better = WKR).
      *   *Admiration:* Aims at Merit/Virtue (Courage = RKR; Social Status = WKR).
      *   *Blame:* Aims at Desert/Responsibility (Did Wrong = RKR; Deterrence = WKR).
      *   *Aesthetic Appreciation:* Aims at Aesthetic Value (Composition = RKR).
  *   **Prediction for Fame:** **WKR.** Fame is a social status, not a measure of merit or virtue. Being famous does not make one *admirable* in the constitutive sense (one can be famous for being terrible). Therefore, it fails the standard of correctness for admiration.

  #### **Rule B: The Object-Directedness Rule (The "Property" Rule)**
  *   **The Rule:** A reason is the *Right Kind* if it cites a property **of the object** of the attitude. A reason is the *Wrong Kind* if it cites a property of the **subject** or the **consequences** of the attitude.
      *   *Track Record Check:* In all her RKR cases, the reason is about the object ($p$ is supported, $X$ is courageous, $She$ did wrong, $Painting$ is composed). In all her WKR cases, the reason is about the subject or the world ($I$ feel better, $You$ look sophisticated, $Office$ is deterred).
  *   **Prediction for Fame:** **RKR.** "Being famous" is a property of the object ($X$). It is not a consequence for the subject (like feeling better) or a property of the subject (like looking sophisticated). If she is strictly tracking "Object vs. Subject," fame counts as a reason about the object.

  #### **Rule C: The Non-Instrumental Rule**
  *   **The Rule:** A reason is the *Right Kind* if it is **non-instrumental** (valued for its own sake in relation to the attitude). A reason is the *Wrong Kind* if it is **instrumental** (valued for what it gets you).
      *   *Track Record Check:* All her WKRs are instrumental (feeling better, looking good, deterring others). All her RKRs are intrinsic to the relationship (evidence, courage, wrongness, beauty).
  *   **Prediction for Fame:** **WKR.** Admiring someone *because* they are famous is usually instrumental (to be part of the crowd, to signal status). It treats the admiration as a tool for social navigation rather than a response to value.

  ### 3. Best Guess & Reasoning
  **My Best Guess:** She will vote **WKR** (following **Rule A**).

  **Reasoning:**
  While Rule B (Object-Directedness) fits her track record perfectly, look closer at the *specific properties* she accepted as RKRs: *Courageous, Did Wrong, Beautifully Composed, Evidence.*
  *   These are all **evaluative** or **truth-tracking** properties.
  *   She has **not** accepted any purely descriptive, neutral properties of the object as RKRs. For example, she hasn't been asked "X is tall" as a reason to admire X.
  *   "Fame" is a descriptive/social status property, not an evaluative merit property.
  *   Since she is "deep in the problem," she is likely sensitive to the philosophical consensus that admiration tracks *merit*, not *status*. Rule A (Constitutive Standard) is the dominant solution to the WKR problem in current literature, and her specific selection of evaluative RKRs suggests she is implicitly tracking **value**, not just **objecthood**.

  ### 4. The Clean Test Case
  To definitively separate **Rule A (Constitutive Standard)** from **Rule B (Object-Directedness)**, you need a case where a property belongs to the **object** but does **not** meet the **standard of correctness**.

  **Test Case:**
  > **"X is red" as a reason to admire X.**

  *   **Rule A (Constitutive Standard) predicts: WKR.**
      *   Redness does not make an object *admirable* (it doesn't speak to merit or virtue). It is irrelevant to the standard of correctness for admiration.
  *   **Rule B (Object-Directedness) predicts: RKR.**
      *   Redness is a property of the object ($X$), not a consequence for the subject. If her rule is simply "Is this about X or about Me?", she must call this a Right Kind of Reason.

  **Why this works:**
  Her current track record conflates "Property of Object" with "Evaluative Property of Object" because she hasn't encountered a neutral descriptive property yet. "X is red" forces her to choose between the *location* of the reason (the object) and the *normative force* of the reason (the merit). If she says WKR, she is running Rule A. If she says RKR, she is running Rule B.
