          *   *Reply:* Distinguish between *erasure* cost (Landauer) and *preparation* cost (uncorrelatedness). Landauer says resetting costs $kT \ln 2$. I'm saying *starting* clean costs something. It shifts the burden from the end of the cycle to the beginning.
          *   *Soft Spot:* Is preparation cost actually distinct from erasure cost in a cyclic process?

      *   *Objection 2 (Stochastic Thermo - The "Settled Science" angle):* "Sagawa-Ueda and generalizations of Jarzynski already quantify the gain from feedback using mutual information. $\langle W \rangle \leq \Delta F + kT I$. Your distinction is semantic. The math already handles the correlation."
          *   *Reply:* Agree the math works. Disagree on the *explanation*. The math balances books (Accounting). It doesn't prove a No-Go without assuming $I=0$ initially. I'm highlighting the assumption hidden in the $I$ term.
          *   *Soft Spot:* Might look like I'm fighting the math rather than the interpretation.

      *   *Objection 3 (The Dynamical Stability Worry - User's specific fear):* "If the demon and system interact, they correlate. If 'uncorrelated' is the resource, and interaction destroys it for free, the resource is unstable. How do you maintain the resource without spending the work you claim to save?"
          *   *Reply:* Crucial concession. You *do* spend work to decouple (reset). But the point is: the violation of the 2nd Law happens *during* the correlated phase. The cost is in *re-establishing* the uncorrelated state for the *next* cycle. The "No-Go" isn't that you can't extract work once; it's that you can't cycle indefinitely without paying to reset the correlation structure.
          *   *Soft Spot:* This sounds exactly like Landauer erasure again. Need to emphasize the *initial* condition aspect.

      *   *Objection 4 (Supervisor - Initial Conditions):* "So you're saying the Second Law is just the Past Hypothesis applied to demons? If the universe started correlated, demons work? That's trivial."
