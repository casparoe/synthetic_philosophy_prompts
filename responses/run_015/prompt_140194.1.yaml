      *Refining the Concessions:* Don't fight the math. Fight the interpretation of the math's assumptions.

      *Refining the Stability Worry:* The key is that *thermal* interaction leads to *thermal* correlations (Gibbs state), which don't necessarily allow work extraction unless there's structure. But the real cost is resetting for the *next* cycle.

