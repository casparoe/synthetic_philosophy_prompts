answer: |-
  ### Part 1: Logical Space & Position Mapping

  To construct this quiz, we map the logical space using three primary dimensions. Each "Leaf" (theoretical position) occupies a specific coordinate in this space.

  **The Dimensions:**
  1.  **Criterion Priority:** Is *Metabolism/Self-maintenance* (M) primary, is *Heredity/Evolution* (E) primary, or are they co-required (M+E)?
  2.  **Ontological Status:** Is 'life' a **Binary** natural kind (you either are or aren't) or a **Cluster/Gradient** (degrees of aliveness/useful fiction)?
  3.  **Unit of Agency:** Is the primary unit the **Individual** (boundary-bound), the **Lineage** (historical), or the **Process** (systemic)?

  **The Leaves (Positions):**

  | Label | Criterion | Ontology | Unit | Characterization |
  | :--- | :--- | :--- | :--- | :--- |
  | **NASA Working Def** | M + E (Co-required) | Binary | System | Self-sustaining chemical system capable of Darwinian evolution. |
  | **Autopoiesis** | M > E | Binary | Individual | A self-producing network that maintains its own boundary. |
  | **Chemoton** | M + E (Architectural) | Binary | Individual | Requires specific coupling of membrane, metabolism, and template. |
  | **Darwinian Population** | E > M | Binary | Population | A system where heredity, variation, and fitness differences align. |
  | **Replicator-First** | E >> M | Binary | Information | Life is substrate-neutral information propagation. |
  | **Metabolism-First** | M > E | Cluster/Gradient | Process | Proto-life shades into life gradually via chemical complexity. |
  | **Deflationary/Cluster** | Pragmatic | Cluster/Stipulation | Variable | 'Life' is a folk category we stipulate for utility, not discovery. |

  **Empty/Unattractive Combinations:**
  *   **Binary + Neither M nor E:** Implies a "vital spark" without mechanism. *Why empty:* Incoherent in a post-chemical context; untestable.
  *   **Cluster + Strict M (No E):** Why have fuzzy boundaries if the requirement (metabolism) is binary? *Why empty:* Unexplored; theoretically unstable.
  *   **Lineage Unit + M Required (No E):** A lineage implies history/transmission (Evolution). *Why empty:* Contradictory definitions.

  **Indistinguishable Leaves:**
  *   **Deflationary vs. Cluster Concept:** On concrete cases, these yield identical "it depends on why you ask" answers. The quiz cannot separate them. Theoretically, the Cluster theorist believes there *is* a fact of the matter about resemblance, while the Deflationist believes the word is purely instrumental. For this seminar, treat them as the same leaf.

  ***

  ### Part 2: Handout Blurb

  **Session 12: The Definition Smuggling Quiz**

  We've spent the term talking about life without agreeing on what it is. That's not a bug; it's a feature. Different research questions require different definitions. Astrobiologists looking for biosignatures need different criteria than synthetic biologists building protocells or philosophers analyzing individuality.

  This quiz isn't about getting the "right" answer. It's about catching the definitions you are already smuggling into your reasoning. There are no "Yes/No" questions. Your pattern of choices will map you onto a specific theoretical position. Be honest about your intuition, not what you think the textbook wants.

  ***

  ### Part 3: The Quiz

  **1. The Chemostat RNA**
  A lineage of RNA molecules in a lab pump evolves resistance to an enzyme. If the pump stops, the lineage collapses within an hour.
  *   A) It is alive because it undergoes selection; the pump is just its environment.
  *   B) It is not alive; it lacks independent self-maintenance and is a parasite of the machine.
  *   C) It is "proto-alive"; aliveness scales with how long it can persist without support.

  **2. The Biofilm Mat**
  A microbial mat reproduces only as a whole sheet. Individual cells harvested from it die immediately.
  *   A) The cells are the organisms; the mat is just a colony.
  *   B) The mat is the organism; the cells are merely tissues.
  *   C) "Organism" is the wrong category; it is a reproductive process, not a thing.

  **3. The Martian Polymer**
  You find a microbe on Mars. It metabolizes and grows, but its heredity uses a stable crystal lattice, not DNA/RNA.
  *   A) It is alive; function matters, chemistry does not.
  *   B) It is suspicious; life requires specific chemical affordances for evolution.
  *   C) Call it "alive" if it helps your grant proposal, but it's not *our* life.

  **4. The Dormant Seed**
  A seed sits in a drawer for 200 years, then germinates. A tardigrade enters cryptobiosis for a decade.
  *   A) They were alive the whole time; the potential for metabolism is sufficient.
  *   B) They were biologically inactive; life requires actual ongoing maintenance.
  *   C) The *lineage* was alive, but the individual object was in suspended animation.

  **5. The Spreading Fire**
  A wildfire consumes fuel, grows, maintains a boundary, and moves. It does not store heredity.
  *   A) It is clearly not life; it lacks a mechanism for history/evolution.
  *   B) It is metabolically analogous to life, but lacks the closure to be truly alive.
  *   C) It sits on the boundary; calling it "dead" or "alive" is equally arbitrary.

  **6. The Designed Machines**
  Self-replicating machines on a dead planet evolve by selection. They were originally built by an extinct civilization.
  *   A) They are alive now; current capacity erases historical origin.
  *   B) They are artifacts; life must arise from natural selection, not design.
  *   C) They are a new category; applying "life" obscures their engineered nature.

  **7. The Prion**
  A misfolded protein induces other proteins to misfold, propagating itself without nucleic acids.
  *   A) It is a replicator and therefore a form of life.
  *   B) It hijacks host metabolism; without a host, it is just chemistry.
  *   C) It is a biological agent, but "life" is too heavy a word for a fold.

  **8. The HeLa Lineage**
  HeLa cells divide indefinitely in culture, but the original human (Henrietta Lacks) died.
  *   A) The cells are alive, but they are tissue, not an organism.
  *   B) HeLa is an immortal asexual lineage, arguably a new unicellular species.
  *   C) The "life" belongs to the historical person; the cells are remains.

  **9. The Digital Replicators**
  Code in a simulation evolves complexity. The server is turned off.
  *   A) They were alive in the simulation; substrate is irrelevant.
  *   B) They were simulations of life, dependent on the physical hardware's metabolism.
  *   C) "Alive" is a predicate for physical systems, not logical ones.

  **10. The Mule**
  A mule is healthy and metabolizing but sterile.
  *   A) It is alive; individuals do not need to reproduce to be living.
  *   B) It is a dead end; life is a property of the lineage, not the sterile individual.
  *   C) It is alive, but "life" is a cluster concept where it scores lower than a horse.

  ***

  ### Part 4: Scoring Key & Leaf Descriptions

  **Tally your answers:**
  *   **Type M (Maintenance):** 1B, 2A, 4B, 5B, 7B, 9B, 10A
  *   **Type E (Evolution/History):** 1A, 2C, 3A, 4C, 5A, 6A, 7A, 8B, 9A, 10B
  *   **Type P (Pragmatic/Cluster):** 1C, 2B, 3C, 4A, 5C, 6C, 7C, 8C, 9C, 10C
      *(Note: Some questions force M vs E, others force Binary vs Cluster. Tally the dominant letter.)*

  **Results:**

  *   **Mostly Type M: The Maintainer (Autopoiesis / Chemoton)**
      *   *View:* Life is a self-sustaining organization with a boundary.
      *   *Awkward Commitment:* You must argue a sterile mule is fully alive but a virus is not, regardless of evolutionary success.
      *   *(If you emphasized specific architecture like membranes/templates: Chemoton. If just boundary/maintenance: Autopoiesis.)*

  *   **Mostly Type E: The Evolver (Replicator-First / Darwinian Population / NASA)**
      *   *View:* Life is a system capable of heredity and selection.
      *   *Awkward Commitment:* You must accept that a gene in a test tube or a computer virus might be more "alive" than a sleeping animal.
      *   *(If you require both M and E: NASA Working Def. If E is sufficient: Replicator-First. If focus is on population variance: Darwinian Population.)*

  *   **Mostly Type P: The Pragmatist (Deflationary / Cluster Concept)**
      *   *View:* 'Life' is a tool for classification, not a natural kind to be discovered.
      *   *Awkward Commitment:* You must admit there is no scientific fact of the matter on whether a virus is alive, only a useful convention.

  *   **Mixed M & E (High Scores in Both): The Gradualist (Metabolism-First)**
      *   *View:* Life emerged as a gradient of chemical complexity.
      *   *Awkward Commitment:* You must accept that a fire or a crystal is "partially" alive, blurring the line between geology and biology.

  ***

  ### Part 5: Instructor Notes on Limitations

  **Indistinguishable Leaves:**
  The **Deflationary** and **Cluster Concept** leaves will score identically on this quiz (Type P). Both reject binary essentialism. To separate them, you would need a meta-question: *"Is 'life' a concept that refers to real similarities in nature (Cluster), or is it purely a linguistic tool we impose (Deflationary)?"* For a first-year seminar, merging them is recommended.

  **Empty Space:**
  Notice that no question allows for a "Vitalist" answer (e.g., "It has a soul"). This is intentional; the logical space assumes physicalism. Also, note that **Chemoton** and **NASA** definitions are adjacent. They only separate if a student insists on the *specific triad* of membrane/metabolism/template (Chemoton) versus the *functional capacity* for evolution (NASA). Question 3 (Martian Polymer) is the primary discriminator there.

  **Discussion Prompt:**
  If the class splits evenly between Maintainers and Evolvers, ask: *"If we find a self-sustaining chemical blob on Enceladus that doesn't evolve, do we fund the mission to study it as biology?"* This forces the pragmatic consequences of their definition.
