answer: |-
  Dennett's framing is most exposed where the taxonomy's boundaries are required to do ontological or ethical work, yet he treats them as heuristic overlays. He often defends vague boundaries by appealing to gradualism, dismissing requests for necessary and sufficient conditions as covert Cartesianism. This allows him to reclassify conceptual puzzles as empirical research programmes, but it leaves him vulnerable when the distinction between levels relies on contested empirical claims, such as the rigidity of instinct. Furthermore, his refusal to draw bright lines complicates any attempt to derive ethical status or cognitive kind from the taxonomy, since degrees of competence do not naturally map onto binary moral responsibilities.

  **1.** Recent ethology suggests the digger-wasp's rigidity is overstated. If the paradigmatic Darwinian creature is actually more flexible, does the category retain explanatory power, or does it merely label behaviour we currently fail to understand?
  *   **(a) Follow-up:** If it is merely a label for current ignorance, does that undermine the claim that these levels represent distinct evolutionary innovations rather than epistemic gaps?
  *   **(b) Note:** He answers if he admits the category relies on the empirical claim of inflexibility; he deflects if he shifts to discussing competence without comprehension generally.

  **2.** The Baldwin effect selects for plasticity itself. Does this evolutionary feedback collapse the boundary between hardwired Darwinian creatures and operant Skinnerian ones, rather than sitting neatly above them as a subsequent layer?
  *   **(a) Follow-up:** If the boundary collapses, does the four-fold structure misrepresent the evolutionary timeline by suggesting discrete steps where there was only continuous modulation of learning rates?
  *   **(b) Note:** He answers if he addresses the structural integrity of the taxonomy; he deflects if he praises the Baldwin effect without addressing the categorical blur.

  **3.** Is the Popperian level a claim about specific internal mechanisms of simulation, or merely a behavioural profile? What observable test distinguishes a Popperian creature from a sufficiently flexible Skinnerian one?
  *   **(a) Follow-up:** If no observable test exists, are we positing a homunculus inside the head, and how does that avoid the very Cartesianism you usually diagnose in such objections?
  *   **(b) Note:** He answers if he specifies a mechanistic or behavioural criterion; he deflects if he claims the distinction is purely explanatory stance-dependent.

  **4.** You often reject bright lines in favour of gradualism. If there is no sharp boundary here, what work does the taxonomy do beyond pedagogical convenience for us, rather than describing nature's joints?
  *   **(a) Follow-up:** If it is purely pedagogical, why should cognitive scientists treat these levels as constraints on architectural design rather than just descriptive metaphors?
  *   **(b) Note:** He answers if he claims predictive power for the taxonomy; he deflects if he reiterates that all categories are fuzzy tools.

  **5.** Gregorian minds rely on imported thinking tools. Does this imply the mind is partly outside the skull, and how do you reconcile this with enculturated apes who use tools but lack cumulative culture?
  *   **(a) Follow-up:** If apes qualify, does the definition of Gregorian depend on the complexity of the tools or the capacity for intergenerational transmission of those tools?
  *   **(b) Note:** He answers if he clarifies the role of culture versus tool use; he deflects if he dismisses the extended mind implication as semantic.

  **6.** Consider a species whose brains are reconfigured by conspecific vocalisations yet accumulate nothing across generations. Are they Gregorian minds lacking culture, or does the lack of accumulation disqualify them from the category entirely?
  *   **(a) Follow-up:** If they are disqualified, does that mean the mind is defined by its historical lineage rather than its current computational architecture?
  *   **(b) Note:** He answers if he commits to whether history or current capacity defines the level; he deflects if he says the case is unlikely evolutionarily.

  **7.** Large language models deploy words at scale and generate candidates without acting. Are they Darwinian, Skinnerian, Popperian, Gregorian, or a fifth thing, and is the real reason for exclusion that nothing is at stake for them?
  *   **(a) Follow-up:** If stakes are the deciding factor, does that mean a mind requires a body that can suffer, reintroducing a biological essentialism you often reject?
  *   **(b) Note:** He answers if he addresses the role of suffering or stakes in cognition; he deflects if he focuses solely on functional output.

  **8.** If competence without comprehension suffices for mind, why does the lack of biological stakes matter? Does function alone grant status, or must the system care about the outcome to qualify as a thinker?
  *   **(a) Follow-up:** If it must care, how do we measure caring without resorting to the very intentional stance you argue is applicable to everything from thermostats upwards?
  *   **(b) Note:** He answers if he distinguishes between derived and original intentionality clearly; he deflects if he claims the question presupposes a mystery.

  **9.** If moral status tracks cognitive capacity, and capacity is a continuum, where do you draw the line for responsibility? You cannot simply say everything is a matter of degree when assigning blame or rights.
  *   **(a) Follow-up:** If you refuse to draw a line, does that imply our legal and ethical practices are fundamentally mistaken in treating responsibility as binary?
  *   **(b) Note:** He answers if he proposes a pragmatic cutoff; he deflects if he argues that legal systems should also become purely gradualist.

  **10.** Ultimately, does this four-fold structure generate novel empirical predictions, or is it a retrospective framework for organising phenomena we have already explained by other means?
  *   **(a) Follow-up:** If it is retrospective, should we teach it as a history of ideas rather than a current model for cognitive architecture?
  *   **(b) Note:** He answers if he cites a specific prediction made by the taxonomy; he deflects if he argues for its unifying power alone.
