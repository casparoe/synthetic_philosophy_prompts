answer: |-
  # HTA PANEL DECISION PROTOCOL (v1.0)
  **For use by Methods Officers and Panel Chairs**
  **Purpose:** To standardize panel verdicts, maximize epistemic accuracy where possible, and explicitly isolate value judgments.
  **Constraint:** Equal voting weight (1 member = 1 vote).

  ## PART A: CONSTITUTION CHECKS (Pre-Meeting)
  *To be completed by the Methods Officer when selecting panelists.*

  **Q1: Does the panel contain at least one methodologist/epidemiologist capable of certifying the systematic review?**
  *   **Sufficient Answer:** Yes (one member with published methods expertise or prior HTA method training).
  *   **Insufficient Answer:** No.
  *   **Action:** If **No**, **STOP**. Do not convene. Recruit a methodologist. A panel cannot assess evidence quality without this role.

  **Q2: Is the panel size between 9 and 13 members?**
  *   **Sufficient Answer:** Yes.
  *   **Insufficient Answer:** No (i.e., 14 or 15).
  *   **Action:** If **No**, **REDUCE**. Remove the members with the least prior service on HTA panels.
  *   **Rationale:** Beyond 13 members, correlated errors (from the shared dossier) outweigh the benefit of added independence. A smaller, diverse panel is statistically more robust than a large, correlated one.

  **Q3: Is the ratio of clinicians to non-clinicians (patients/economists) less than 4:1?**
  *   **Sufficient Answer:** Yes.
  *   **Insufficient Answer:** No.
  *   **Action:** If **No**, **ADJUST**. Replace the most recently recruited clinicians with patient or economic representatives.
  *   **Rationale:** High homogeneity increases error correlation. Diversity of perspective acts as a proxy for independence.

  ---

  ## PART B: THE SESSION PROTOCOL (In-Meeting)
  *To be administered by the Panel Chair.*

  **Q4: Has a secret pre-deliberation ballot been cast on Evidence Sufficiency?**
  *   **Procedure:** Before any discussion, members vote secretly: *Is the evidence robust enough to distinguish benefit from harm?* (Yes / No / Uncertain).
  *   **Sufficient Answer:** Ballots collected and tallied.
  *   **Action:** If **No**, **STOP**. Do not begin discussion.
  *   **Rationale:** This captures the "Condorcet signal" (independent judgment) before deliberation creates herding.

  **Q5: Does the pre-deliberation vote show >60% agreement on Evidence Sufficiency?**
  *   **Sufficient Answer:** Yes.
  *   **Insufficient Answer:** No (i.e., the panel is fundamentally divided on the facts).
  *   **Action:** If **No**, **HAND-OFF**. The Chair must pause deliberation and request a Methods Officer review of the dossier for clarity errors. If the dossier is sound, proceed to Q6 but mark the final rationale as "Low Epistemic Confidence."
  *   **Rationale:** If the "jury" cannot agree on the facts before talking, the dossier is likely ambiguous.

  **Q6: Has deliberation been structured as Testimony then Debate?**
  *   **Procedure:** 
      1. Methodologist presents evidence quality (5 mins).
      2. Content Experts present clinical context (5 mins each, max 2 people).
      3. Patient Rep presents lived experience/values (5 mins).
      4. Open floor debate (40 mins).
  *   **Sufficient Answer:** Yes, timed and sequenced.
  *   **Action:** If **No**, **CORRECT**. Interrupt and reset the order.
  *   **Rationale:** Prevents high-status clinicians from anchoring the group's interpretation of the evidence early.

  **Q7: Is the final vote conducted via Sequential Binary Pairing?**
  *   **Procedure:** Do not vote on all three options at once.
      1.  **Vote 1:** *Research Programme* vs. *Final Verdict* (Recommend/Against combined).
          *   If *Research* wins: Verdict is **Research**. Stop.
          *   If *Final Verdict* wins: Proceed to Vote 2.
      2.  **Vote 2:** *Recommend* vs. *Against*.
          *   Simple majority carries.
  *   **Sufficient Answer:** Yes.
  *   **Action:** If **No**, **INVALIDATE**. The vote must be re-run.
  *   **Rationale:** This eliminates Condorcet cycling. It forces a decision on uncertainty (Research) before deciding on direction (Recommend/Against).

  ---

  ## PART C: THE RATIONALE CHECK (Post-Meeting)
  *To be completed by the Methods Officer drafting the publication.*

  **Q8: Does the rationale explicitly state whether the verdict was driven by Evidence or Values?**
  *   **Procedure:** Check the Chair's summary notes.
      *   If the vote turned on *uncertainty* in the meta-analysis -> Label **Epistemic**.
      *   If the vote turned on *tolerance for harm/anxiety* despite clear data -> Label **Evaluative**.
  *   **Sufficient Answer:** Yes, one label is applied.
  *   **Action:** If **No**, **RETURN**. Send rationale back to Chair for amendment.
  *   **Rationale:** Appeals on epistemic grounds are valid; appeals on evaluative grounds are not. The distinction must be public.

  **Q9: If the verdict is Evaluative, does the rationale acknowledge the trade-off?**
  *   **Procedure:** The text must read: "The evidence supports [X], but the panel judged the trade-off between [Benefit] and [Harm] to be [Acceptable/Unacceptable]."
  *   **Sufficient Answer:** Yes.
  *   **Action:** If **No** (i.e., it claims the evidence *dictated* the result), **REJECT**.
  *   **Rationale:** Presenting a value judgment as an evidence call is scientifically dishonest and vulnerable to successful appeal.

  ---
  ## END OF PROTOCOL
  ---

  # APPLICATION TO PENDING PANELS

  Here is the application of Protocol v1.0 to your three upcoming panels.

  ### PANEL 1: Cancer Screening Age Reduction (n=14)
  *   **Constitution Check (Q1-Q3):**
      *   **Q1 (Methodologist):** Pass (Assumed in "Methods Unit" context, but verify).
      *   **Q2 (Size):** **FAIL.** Panel is 14. Protocol requires max 13.
      *   **Action:** Remove the member with the least prior HTA service. New size = 13.
      *   **Q3 (Ratio):** Pass (2 experts, 1 patient, 11 clinicians is <4:1).
  *   **Session Check (Q4-Q7):**
      *   **Q4 (Pre-vote):** Critical. The two specialists will try to anchor the group. The secret ballot prevents their status from inflating their influence on the *initial* signal.
      *   **Q5 (Agreement):** Likely **FAIL**. Wide CIs and heterogeneity usually split panels 50/50 on sufficiency.
      *   **Action:** If >60% cannot agree evidence is robust, the Rationale must be marked "Low Epistemic Confidence."
      *   **Q7 (Voting):** Sequential voting will likely result in **Research Programme**.
      *   **Reasoning:** With wide CIs, the "Research vs. Final" vote will favor Research. The protocol prevents a "Recommend" verdict based on weak evidence by forcing the uncertainty vote first.
  *   **Rationale Check (Q8-Q9):**
      *   Must be labeled **Epistemic**. The decision rests on the inability of the evidence to distinguish benefit, not on the value of screening.

  ### PANEL 2: Rare Condition Diagnostic (n=11)
  *   **Constitution Check (Q1-Q3):**
      *   **Q1 (Methodologist):** Pass.
      *   **Q2 (Size):** Pass (11 is within 9-13).
      *   **Q3 (Ratio):** Pass.
      *   **Competence Note:** The protocol does not weight the single expert's vote. However, Q6 (Testimony Order) ensures the expert speaks *after* the methodologist but *before* open debate, ensuring their technical input is heard without anchoring the *vote*.
  *   **Session Check (Q4-Q7):**
      *   **Q4 (Pre-vote):** High risk of divergence. 8 novices vs. 1 expert. The novices may vote "Uncertain" based on lack of familiarity, not evidence quality.
      *   **Q5 (Agreement):** Likely **FAIL**.
      *   **Action:** Mark Rationale "Low Epistemic Confidence."
      *   **Q7 (Voting):** The Patient Rep's "strong views" enter here. If the Evidence vote passes to "Final Verdict," the Recommend vs. Against vote becomes Evaluative.
      *   **Risk:** The 8 novices may defer to the 1 expert on evidence, but the Patient Rep may sway the value judgment.
  *   **Rationale Check (Q8-Q9):**
      *   Likely **Mixed**. Evidence is thin (Epistemic), but the decision to test rare conditions is often Value-driven (Equity vs. Cost).
      *   **Protocol Requirement:** You must separate these. "Evidence is insufficient for routine use (Epistemic), but justified within a registry (Research)."

  ### PANEL 3: Indolent Disease/Overdiagnosis (n=9)
  *   **Constitution Check (Q1-Q3):** Pass.
  *   **Session Check (Q4-Q7):**
      *   **Q4 (Pre-vote):** Likely High Agreement on Evidence (you stated facts are clear).
      *   **Q5 (Agreement):** Pass (>60% agree evidence distinguishes outcomes).
      *   **Q7 (Voting):** This is the critical test.
          *   Vote 1 (Research vs. Final): Likely **Final**. We know what the test does.
          *   Vote 2 (Recommend vs. Against): This is purely **Evaluative**.
  *   **Rationale Check (Q8-Q9):**
      *   **Q8:** Must be labeled **Evaluative**.
      *   **Q9:** Must explicitly state: "The evidence confirms overdiagnosis. The recommendation against use is based on the panel's judgment that anxiety/complications outweigh mortality benefit."
      *   **Protocol Outcome:** If the Chair attempts to write "Evidence does not support use," the Methods Officer must **REJECT** (Q9) and force the wording to reflect the value trade-off.
      *   **Appeal Proofing:** This makes the verdict *less* appeal-proof on scientific grounds (because you admit the science is clear) but *more* robust against judicial review (because you admit it is a policy choice within your mandate).

  ---

  # LIMITATIONS AND UNPALATABLE TRUTHS

  ### 1. Where Judgment Remains Unavoidable
  The procedure cannot eliminate judgment in **Q5 (The 60% Threshold)**. Why 60%? Why not 51% or 75%? This is an arbitrary epistemic risk tolerance set by your office. Similarly, **Q6 (Testimony Order)** assumes the Methodologist is neutral and the Clinician is biased. In reality, methodologists have ideological biases regarding evidence hierarchies. The procedure manages bias; it does not remove it.

  ### 2. What The Procedure Cannot Tell You
  It cannot tell you if the **Dossier itself is wrong**. Condorcet assumes the voters are assessing a truth. If your systematic review (the common signal) contains a coding error or a biased search strategy, the protocol amplifies that error. A unanimous panel voting on a flawed dossier is statistically confident but factually wrong. The protocol assumes the Methods Unit's input is valid; it cannot audit its own upstream work.

  ### 3. The Unpalatable Truth (The Case You Will Not Like)
  **Panel 2 (Rare Condition).**
  If you apply Protocol v1.0 faithfully, you will likely be forced to issue a **"Research Only"** recommendation, even if the clinicians passionately want to "Recommend."

  **Why you won't like it:**
  1.  **Political Cost:** The specialist body and the patient group (who has lived experience) will feel ignored. They want access. "Research" feels like denial.
  2.  **Competence Paradox:** The protocol treats the 8 novices as equal to the 1 expert. Statistically, if the novices are guessing (competence < 0.5), the majority vote is *worse* than the single expert's opinion. Yet, you are forbidden from weighting. The protocol masks this by forcing a "Low Confidence" label, but the vote count remains 1-person-1-vote. You will know, internally, that the democratic vote is likely scientifically inferior to the lone expert's view, but you must publish it as the panel's will.
  3.  **The "Value" Trap:** In Panel 3, the procedure forces you to publish that your decision is based on **values**, not evidence. HTA bodies strive for the mantle of "scientific objectivity." Admitting "We recommend against this because we value avoiding anxiety more than extending life by 2 weeks" invites political scrutiny ("Who elected you to decide the value of life?"). The protocol strips away the protective camouflage of "evidence-based" language. It makes you honest, but it makes you vulnerable.

  ### 4. Final Instruction
  The procedure returns a **NO** (Stop/Hand-off) in two specific instances:
  1.  **Constitution Q2:** If panel size >13. (You must cut members).
  2.  **Rationale Q9:** If an Evaluative verdict is written as an Epistemic finding. (You must rewrite).

  In all other branches, the procedure terminates in a Recommendation or a labeled Hand-off to Value Judgment. It is runnable by your officers. It respects the voting constraints. It acknowledges the Condorcet limits without requiring impossible math.
