      *   *Pity/Compassion:* Theatrical pity is easy. We cry for Hecuba but ignore the suffering neighbor. It purges emotion without requiring action (catharsis as moral narcotic).
      *   *Amour-propre:* Theater feeds vanity. We watch to be seen watching, to judge, to feel superior or culturally refined. It's social comparison.
