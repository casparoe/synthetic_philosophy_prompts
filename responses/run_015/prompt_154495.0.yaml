      *   *The Festival:* The alternative to theater. Open-air, participatory, no stage, no separation between actor and spectator. Everyone is present to everyone else.

  3.  **Analyze the Hypothetical VR System:**
      *   *Immersion:* Total sensory engagement (potentially bypassing critical distance).
      *   *Biometric Feedback:* The body speaks "truth" (physiology) but is used to manipulate the fiction.
      *   *Personalization:* Each user gets a unique narrative. No shared experience.
      *   *Isolation:* Users are "isolated nodes."
      *   *Commodification:* Data is harvested.

  4.  **Synthesize: Rousseau vs. The Biometric VR:**

      *   *Point 1: The Illusion of Immediacy (Transparency).*
