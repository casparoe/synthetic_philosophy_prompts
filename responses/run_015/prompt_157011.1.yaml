  # THE LEAVES (The Positions)
  *Format: Name | Awkward Commitment (includes Temporal Expectation) | Falsifying Observation | METI Advice*

  **Leaf A: Data Deficient**
  We are ignorant. | Old vs. Young stars doesn't matter yet. | Detect a clear signal tomorrow. | **Indifferent** (Shouting into fog).

  **Leaf B: Simulation**
  Reality is rationed. | Old stars should show 'rendering limits' or lower complexity. | Find physics glitches violating conservation laws. | **Indifferent** (Admin decides).

  **Leaf C: We're Early**
  We are the first movers. | **Old stars should be barren;** we are the galaxy's children. | Find ruins around ancient Population II stars. | **Shout** (Claim territory).

  **Leaf D: Filter Ahead**
  We will likely die soon. | Old stars should be full of dead civilizations, not living ones. | Observe stable, million-year-old megastructures. | **Shut Up** (Don't attract predators/trouble).

  **Leaf E: Rare Earth**
  Complex life is the bottleneck. | **Old stars are no more likely to host life than young ones;** biology is the lock. | Find complex multicellular life on many exoplanets. | **Shout** (We are biologically unique).

  **Leaf F: Parochial Premise**
  Expansion is irrational. | Old stars host civs that never left their home systems. | Detect a civilization actively colonizing a cluster. | **Indifferent** (No one wants to listen).

  **Leaf G: Transcension**
  Progress means leaving space. | Old stars should show *less* visible tech as they mature inward. | Detect massive waste-heat signatures (Dyson spheres). | **Indifferent** (They are beyond us).

  **Leaf H: They're Here**
  They are undetected neighbors. | Old and Young stars both host invisible tech everywhere. | Decode background noise as structured communication. | **Shout** (They already know).

  **Leaf I: Dark Forest**
  The universe is predatory. | Old stars are silent graveyards of those who spoke. | Detect a peaceful, broadcasting civilization surviving >1M years. | **Shut Up** (Suicide to broadcast).

  **Leaf J: Zoo / Planetarium**
  We are deliberately protected. | Old stars host observers who never interfere. | Accidental contact or a "leak" in the quarantine. | **Shut Up** (Break the rules).

  ***

  # UNOCCUPIED LOGICAL SPACE
  *Combinations of answers that yield no coherent position.*

  1.  **"We're Early" + "Filter Ahead"**
      *   *Why:* Incoherent. If we are "Early," the filter (time) is behind us. If the Filter is "Ahead," our temporal location is irrelevant to the silence.
  2.  **"Dark Forest" + "Zoo"**
      *   *Why:* Contradictory motives. A civilization cannot be simultaneously hiding to hunt us and hiding to protect us.
  3.  **"Data Deficient" + "They're Here"**
      *   *Why:* Epistemological conflict. You cannot claim the data is insufficient *and* claim they are definitely here but invisible. One is an admission of ignorance, the other a positive claim.
  4.  **"Transcension" + "Expansion"**
      *   *Why:* Definitional conflict. Transcension posits leaving physical expansion for inner/substrate growth. If they expand visibly, they haven't transcended in this specific sense.
  5.  **"Rare Earth" + "We're Early"**
      *   *Why:* Unattractive/Redundant. Both explain silence via scarcity, but one blames biology (Rare Earth) and the other blames time (Early). Holding both requires believing biology is hard *and* we are the first to solve it, which is an unnecessary doubling of improbability.
