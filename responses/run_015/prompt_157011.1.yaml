answer: |-
  # FLOWCHART NODES (The Questions)
  *Start: "I accept that we have no convincing evidence of extraterrestrial technology anywhere we've looked, and I'm not counting UAP/UFO reporting as evidence."*

  **1. The Search Bet**
  "If aliens leaked radio energy exactly like we do, would our current sensors have detected it by now?"
  *   **No** → Go to **Leaf A**.
  *   **Yes** → Go to Q2.

  **2. The Simulation Claim**
  "Is the silence best explained by the universe being a computation where 'empty space' saves processing power?"
  *   **Yes** → Go to **Leaf B**.
  *   **No** → Go to Q3.

  **3. The Temporal Bet**
  "If we scanned stars 5 billion years older than the Sun, would we find their ruins?"
  *   **Yes** (Old stars are empty) → Go to **Leaf C**.
  *   **No** (Old stars are same as us) → Go to Q4.

  **4. The Filter Claim**
  "Is the hardest step to becoming a visible civilization *ahead* of us (survival) rather than *behind* us (biology)?"
  *   **Ahead** → Go to **Leaf D**.
  *   **Behind** → Go to **Leaf E**.

  **5. The Expansion Claim**
  "Do all long-lived civilizations inevitably fill the galaxy with visible physical structures?"
  *   **No** → Go to Q6.
  *   **Yes** → Go to Q7.

  **6. The Reason for Staying**
  "If they don't expand, is it because colonization is a human phase (parochial) or because they upload minds/leave physics (transcend)?"
  *   **Parochial** → Go to **Leaf F**.
  *   **Transcend** → Go to **Leaf G**.

  **7. The Visibility Claim**
  "If they are out there, are we missing them because our physics is blind to their tech, or because they choose to hide?"
  *   **Blind Physics** → Go to **Leaf H**.
  *   **Choose to Hide** → Go to Q8.

  **8. The Hiding Motive**
  "If they know we exist, is contact risky because they are predators, or because we are protected?"
  *   **Predators** → Go to **Leaf I**.
  *   **Protected** → Go to **Leaf J**.

