answer: |-
  Good evening, everyone. Thank you for coming.

  Looking around this room, I see the exact tension that brought us here. On one side, I see neighbors who feel unheard, whose frustration with our recent council vote is palpable. On the other, I see the staff who keep this town running, and scholars who study how we make decisions together. Usually, in a meeting like this, my job as the organizer would be to neutralize that tension. I would be expected to remind everyone to be polite, to stick to the agenda, and to pretend we all start from the same place of trust.

  I am not going to do that. Because if we are going to talk about changing how this town makes decisions—specifically by adopting binding local referendums—we need to talk about something deeper than procedure. We need to talk about whether a vote actually counts as consent.

  I am not a philosopher. I don't have the training to cite the great theories of democracy or political obligation. But over the past year, while watching our town grapple with zoning changes and budget shortages, I have been thinking hard about what it means to say "yes" to something. We often assume that consent is simple: if no one held a gun to your head, and you checked the box, you consented. But I don't think that's true. I think consent can be invalidated by deception, not just in the form of lies, but in the framing of the question. And I think consent can be invalidated by incompetence, not in the sense of intelligence, but in the sense of understanding the actual trade-offs involved.

  So, I want to state my position clearly up front, because I think it frames what we can and cannot achieve tonight. My position is this: The proposed referendum design we are discussing—which includes mandatory plain-language disclosure and a two-week public comment period—is a significant improvement over the status quo. However, it still falls short of securing genuinely valid consent.

  I say this not to discourage you, but to honor the anger in this room. To the neighbors who feel ignored: Your frustration is not merely emotional. It is philosophically serious. When you feel that a council vote ignored you, you are sensing a gap between the procedure that was followed and the moral authority that procedure was supposed to generate. You are sensing that your consent was assumed, not earned. If we adopt binding referendums, we cannot simply assume that a majority vote automatically produces legitimate authority. If the ballot language obscures the tax implications, or if voters are asked to approve a technical fiscal mechanism they cannot possibly understand, then the resulting "mandate" is hollow. It might be legal, but it lacks moral weight.

  To the staff and scholars here: I know the work you have put into the disclosure requirements. Plain language is vital. But plain language cannot magic away complexity. Zoning and municipal budgeting are technical ecosystems. If I tell you in plain English that "Option A lowers your property tax by two percent but delays road repairs for five years," I have been honest. But do you truly understand the structural risk of delaying those repairs? Do you understand how that debt accumulates? If you do not understand the trade-off, your consent is not fully valid, even if you were not coerced. You cannot consent to a consequence you cannot comprehend.

  This brings me to the harder part of my argument, and where I know some might disagree. Even if every individual voter were perfectly informed, there is the problem of aggregation. A referendum aggregates individual judgments into a collective command. But does the majority's understanding validate the outcome for the minority? More importantly, does the act of voting itself dilute the competence required for consent to count?

  When I consent to a medical procedure, I am consenting for myself. I bear the risk. When I vote on a zoning change, I am imposing a decision on my neighbor who voted differently. If that decision turns out to be based on a misunderstanding of the trade-offs, the harm is shared, but the consent was not. The proposed design attempts to solve this with the two-week comment period. But a comment period is not a deliberation. It is a venting mechanism. It does not ensure that the collective judgment reaches the threshold of competence required to bind everyone.

  So, where does this leave us? If I believe the design falls short of valid consent, why are we here? Why propose the referendums at all?

  Because while perfect consent may be impossible in a complex society, we have a duty to move closer to it. We must stop treating the vote as the end of the conversation. If we adopt these binding referendums, we must acknowledge that the vote is not a moral shield. It does not absolve the council of responsibility for the outcomes. It does not silence dissent.

  My argument is that we should adopt the referendum process, but only if we attach a specific condition to it: We must treat the result as provisional. Valid consent in a community cannot be a one-time event captured on a ballot. It must be continuous. If the trade-offs become clear only after the implementation begins, the community must have a mechanism to revisit the decision without shame or accusations of instability.

  To the neighbors: This means your anger after a vote is not anti-democratic; it is a necessary check on the limits of that vote. To the staff and scholars: This means your job does not end when the ballots are counted. Your job is to monitor whether the reality matches the understanding voters had when they cast them.

  We are not here to build a perfect system. We are here to build an honest one. An honest system admits that plain language helps, but does not solve, the problem of competence. It admits that a majority vote creates authority, but not necessarily legitimacy. And it admits that if we want our neighbors to consent to the rules they live under, we owe them more than a ballot. We owe them the truth about what we don't know, and the humility to change course when the trade-offs become clear.

  Tonight, as we look at the specific language of the proposal, I ask you to keep this standard in mind. Do not ask only if this is legal, or if this is standard practice. Ask if this allows us to say "yes" with our eyes open. Ask if this design respects the limits of our own understanding. If we can agree that the vote is not the final word, but rather a serious commitment to ongoing accountability, then we might just secure a form of consent that is valid enough to live with.

  Thank you. I look forward to hearing your thoughts.

  ***

  **Note on Argumentative Liberties**

  This speech takes liberties with standard political theory distinctions in three key ways. First, it treats political voting as analogous to individual informed consent (like in medical ethics), whereas many theorists argue collective decision-making relies on legitimacy derived from procedure and representation, not individual epistemic competence. Second, it sets a very high bar for "competence," suggesting that understanding technical trade-offs is a prerequisite for valid consent; standard democratic theory often accepts that voters consent to the *process* or the *representatives*, not necessarily every technical outcome. Third, it implies that "valid consent" is the primary metric for political legitimacy, sidelining other values like efficiency, stability, or the protection of minority rights against majority error.
