answer: |-
  Your intuition cuts to the heart of a profound category error often made when comparing Western normative ethics with Buddhist soteriology. The surface-level overlap—both seek to reduce suffering—obscures a fundamental divergence in the *ontology of the moral agent* and the *psychological mechanics of decision-making*.

  To defend your position, we must argue that consequentialism is not merely a different ethical map, but a psychological technology that reinforces the very structures of mind (*citta*) that Buddhist practice aims to dismantle. The argument rests on three pillars: the nature of moral value (locus), the psychology of calculation (craving), and the distinction between wisdom and control (foresight vs. attachment).

  ### 1. The Locus of Moral Value: Outcome vs. Intention

  In consequentialism, the moral quality of an act is extrinsic. It resides in the state of the world *after* the act. This necessitates that the agent's moral standing is perpetually provisional, pending the unfolding of causal chains they cannot fully control. To be a "good" consequentialist, one must maintain a cognitive grip on the future. One must project oneself into time, simulate scenarios, and attempt to bend probability toward a preferred state.

  In Buddhist ethics, the moral quality of an act is intrinsic to the volition (*cetana*) at the moment of action. The Buddha explicitly defined karma as intention. While consequences matter pragmatically (because they cause suffering), they do not determine the *karmic weight* of the act.

  This distinction is not semantic; it is structural. If moral value lies in the outcome, the agent is ontologically dependent on the external world for their moral integrity. If moral value lies in the intention, the agent's moral integrity is self-contained.

  ### 2. Calculation as a Form of Craving (*Tanha*)

  This is the crux of your argument: the mental habit of optimizing welfare is structurally analogous to *tanha* (craving/thirst).

  Consequentialist reasoning requires a specific cognitive posture: **evaluative control.** To maximize utility, the mind must grasp at a future state ("a world with less suffering") and reject another ("a world with more suffering"). While the *content* of this desire is altruistic, the *structure* is one of clinging (*upadana*). It is a thirst for existence (*bhava-tanha*)—specifically, a thirst for a specific configuration of existence.

  When an agent engages in consequentialist calculation, they are subtly reinforcing the sense of "I" as the controller. The mental narrative is: *"I must assess, I must choose, I must ensure this result."* This strengthens the conceit (*mana*) and the view of self (*sakkaya-ditthi*). Even if the goal is the welfare of others, the *mechanism* relies on the delusion that the future can be secured through mental manipulation.

  In Buddhist practice, the purification of mind requires the abandonment of clinging to results. The *Bhagavad Gita* (though Hindu) captures this Buddhist-compatible sentiment well: "You have a right to perform your prescribed duty, but you are not entitled to the fruits of action." In Buddhism, acting with attachment to the "fruit" (even a good fruit like "reduced suffering") generates karmic momentum that binds one to *samsara*.

  Therefore, consequentialist reasoning is corrosive because it trains the mind in **outcome-dependence**. It makes moral stability contingent on external variables. If the calculation fails and suffering occurs, the consequentialist agent faces a crisis of moral value ("I did the wrong thing"). The Buddhist practitioner, having acted from pure compassion without clinging to the result, maintains moral integrity despite the tragic outcome. The consequentialist mind is brittle; the Buddhist mind is resilient because it is unmoored from the uncontrollable future.

  ### 3. Addressing the Objection: Prudent Foresight vs. Calculative Attachment

  The strongest objection is that Buddhism is not irrational. The Buddha constantly advised disciples to consider consequences. "If you do X, Y will happen." This looks like consequentialism. How do we distinguish this from the corrosive calculation described above?

  The distinction lies in the **purpose of the foresight** and the **mindset during the action.**

  **A. Wisdom (*Panna*) vs. Control (*Abhinivesa*)**
  *   **Prudent Foresight:** This is the application of *Yoniso Manasikara* (wise attention). It is seeing cause and effect clearly, like a doctor knowing that poison causes death. The doctor avoids giving poison not because they are calculating their moral score, but because they see the nature of reality. The mind rests in *knowledge*.
  *   **Calculative Attachment:** This is the attempt to *manage* the cause and effect to secure a self-referential goal (merit, reputation, or even the concept of "being a helper"). The mind rests in *anxiety* and *projection*.

  **B. The Response to Failure**
  The sharpest way to draw this line is to ask: *What happens when the outcome is bad despite good intentions?*
  *   **The Consequentialist:** Must admit the act was morally suboptimal or wrong. The moral ledger is in the red. This generates guilt, regret, or a desperate redoubling of control efforts. This is *dukkha* (suffering) born of clinging to results.
  *   **The Buddhist Practitioner:** Acknowledges the suffering caused (compassion) but does not accept moral defilement (*kilesa*). They recognize that the result was conditioned by many factors beyond their intention. They feel sorrow, but not the specific suffering of "moral failure." They do not cling to the need to have been the "savior."

  **C. The Archer Analogy**
  Consider an archer.
  *   **Foresight:** The archer must account for wind, distance, and tension. Ignoring these is stupidity, not virtue. This is Buddhist wisdom.
  *   **Calculation:** The archer who cannot release the arrow because they are obsessed with whether it will hit the bullseye, or who defines their worth as a human being by the score, is suffering from attachment.
  *   **The Difference:** The Buddhist archer aims carefully (foresight) but releases the arrow without mental clinging to where it lands (non-attachment). The consequentialist archer aims carefully *in order to* control where it lands, and their mental state is bound to the impact.

  ### 4. Soteriological Incompatibility

  Finally, we must recognize that Buddhist ethics is not a standalone system of social regulation; it is the foundation of a soteriological path leading to *Nibbana* (cessation).

  Consequentialism is a system for managing *samsara*. It seeks to make the dream of existence more pleasant. It accepts the premise that "states of affairs" are ultimately real and that our job is to arrange them.

  Buddhist ethics accepts that while suffering is real, the *self* that arranges states of affairs is a delusion. To engage in consequentialist calculation is to reinforce the delusion of the arranger. It is to polish the chains of *samsara* rather than break them.

  If one practices ethics to accumulate merit for a better rebirth, one is engaging in a subtle form of spiritual materialism—a transaction with the cosmos. This is explicitly critiqued in the Diamond Sutra (and early teachings on the three spheres of purity): giving gifts while clinging to the notion of "giver," "receiver," and "gift" generates limited merit. Giving without attachment generates limitless merit.

  Consequentialism *requires* clinging to the notions of "act," "outcome," and "maximizer." Therefore, it cannot lead to the cessation of clinging. It can produce a "good person," but it cannot produce an *Arahant*.

  ### Conclusion

  Your half-formed idea holds up under scrutiny. The distinction between prudent foresight and calculative attachment can be drawn sharply: it is the difference between **seeing** conditions and **grasping** at results.

  Consequentialism undermines Buddhist moral development not because it leads to harmful actions (often it leads to the same helpful actions), but because it cultivates a mind-state of **ontological insecurity**. It trains the agent to believe that moral safety lies in the future, in the control of variables, and in the successful manipulation of reality. This is the definition of *samsaric* existence.

  Buddhist ethics trains the agent to find moral safety in the present purity of intention, regardless of the chaotic unfolding of the world. To replace this with consequentialist reasoning is to swap a sword that cuts bonds for a tool that builds better cages. It substitutes the peace of non-clinging for the anxiety of optimization.
