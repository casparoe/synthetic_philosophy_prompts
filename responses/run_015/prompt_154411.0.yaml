prompt: |-
  In our moral philosophy seminar last week someone kept saying one thought too many whenever we discussed Williams's integrity objection, most recently to shut down my argument that a parent deciding whether to commit to a long-term programme of care for a severely disabled child might legitimately weigh in thier own emotional and financial limits without destroying the integrity of the relationship. Its actually a decent point, but I feel like the phrase is doing all the heavy lifting and I can't tell what its precisely claiming. Could you lay out the different precise readings of one thought too many — what kind of mental step is being condemned, at what level of deliberation, and what exactly it threatens — and for each say whether its trivial, defensible, or plainly false? Crucially, say which of those readings would actually support dismissing my point about parental self-assessment, and which ones leave it untouched. I want a proper menu for the seminar, not just one interpretation explained.
