      *(Self-Correction during drafting)*: Make sure to explicitly link the "menu" items to the axes the user provided. I will group the theses by the primary axis they manipulate to ensure coverage.

      *Thesis 1: Sufficiency for Considerability (The Inclusion Axis)*
      *Thesis 2: Necessity for Considerability (The Exclusion Axis)*
      *Thesis 3: Exclusivity of Harm (The Death Axis)*
      *Thesis 4: Phenomenal vs. Functional Suffering (The AI Axis)*
