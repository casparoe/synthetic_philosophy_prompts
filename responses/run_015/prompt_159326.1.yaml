      *   *Self-Correction on AI:* If AI reports distress, does it suffer? The quote hinges on the definition of "suffer." If functional behavior counts, AI is in. If qualia counts, AI is likely out.
      *   *Self-Correction on Death:* Bentham was a hedonistic utilitarian. Death is only bad if it prevents future pleasure. But modern preference utilitarianism counts death as a harm. The quote supports the hedonistic view.

  8.  **Final Review against Constraints:**
      *   American English.
      *   Address all axes mentioned in prompt (Necessary/Sufficient, Harm types, Capacity definition, Suffering definition, Binary/Scalar, Metaphysical/Epistemic).
      *   Address the three specific meeting uses.
