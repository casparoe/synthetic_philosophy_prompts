      *Thesis 6: Scalar vs. Binary Weighting (The Hierarchy Axis)*
      *Thesis 7: Epistemic vs. Metaphysical (The Burden of Proof Axis)*

      Wait, I need to make sure I answer "which of the three uses it would support."
      Use 1: Insects In.
      Use 2: Death No Cost.
      Use 3: AI Out.

      Let's assemble the matrix.

      *Thesis 1 (Sufficiency):* Supports Insects In. Needs premise: Insects suffer.
      *Thesis 2 (Necessity):* Supports AI Out. Needs premise: AI doesn't suffer.
