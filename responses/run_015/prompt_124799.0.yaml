          *   Is it Truth-Directed? Yes, locally. But globally it misaligns incentives.
          *   Address the Circularity Worry: Distinguish between *defining* accuracy and *constraining* measures of accuracy. Propriety isn't the definition; it's a necessary condition for accuracy to be a *guide* for rational belief.
      *   **Part 3: The Forecasting Pool Context:**
          *   Distinguish *Epistemic Utility* (philosophical goal) vs. *Scoring Rules* (practical incentive).
          *   The friend's rule makes the pool a game of "who is most willing to lie."
          *   Brier makes it a game of "who is best calibrated/resolved."
          *   Calibration/Resolution: These are post-hoc evaluations. Scoring rules are pre-hoc incentives.
      *   **Conclusion:** Summarize the verdict. The friend's rule is improper and dangerous for a forecasting pool. Strict propriety is not circular; it's the bridge between "being accurate" and "trying to be accurate."

  5.  **Refine the Tone:**
      *   Ensure I don't talk down (MA student).
      *   Use formal notation where helpful ($C$, $w$, $S$) but explain it.
      *   Make sure the "gut-level" explanations are actually intuitive (e.g., using the "lying" analogy for propriety).
