          1.  How much of the accuracy-dominance argument for probabilism depends on the specific scoring rule? What features are essential (Brier vs. Log vs. others)? What is the "gut-level" reason for each condition?
          2.  Is the friend's rule a genuine measure of accuracy? Is it truth-directed? What would a forecaster governed by it do? Is the appeal to strict propriety circular? How to respond to the friend (accuracy vs. other goals like calibration)?
      *   **Tone:** Academic but accessible, rigorous but intuitive ("gut-level reason"), respectful of the user's level (MA student, knows algebra/partitions).

  2.  **Deconstruct Question 1: The Accuracy-Dominance Argument & Scoring Rules:**
      *   *The Argument:* Joyce-style argument. If you violate probabilism, there exists a probabilistic credence function that dominates you (is more accurate in every world).
      *   *Key Conditions on Scoring Rules:*
          1.  **Truth-Directedness (Alethic):** Closer to truth is better. (0/1 is best).
          2.  **Continuity:** Small changes in credence don't cause huge jumps in score.
          3.  **Strict Propriety:** Expected score is maximized *only* by reporting your true credence.
          4.  **Additivity/Separability:** Score for a partition is sum of scores for cells.
      *   *The Math (Pre-theoretic):* The dominance theorem (e.g., Predd et al. 2009) shows that if a measure is continuous, additive, and strictly proper, then non-probabilistic credences are dominated.
      *   *Brier vs. Log:* Both are strictly proper. Both yield probabilism. The *specific* numbers change, but the *structural* result (probabilism is undominated) holds.
      *   *Gut-Level:* Why strict propriety? It ensures the "internal perspective" matches the "external goal." If a rule isn't proper, you should lie about your credence to maximize score. If it's not *strictly* proper, multiple reports maximize score, making the link between accuracy and rationality loose. Why additivity? Allows us to treat questions independently. Why continuity? Avoids weird discontinuities where being slightly more confident is vastly worse.
      *   *What if we change the rule?* If we drop strict propriety (like the friend's rule), the dominance argument fails. Non-probabilistic credences might *not* be dominated (as the user found with 0.6, 0.6, 0.6).

  3.  **Deconstruct Question 2: The Friend's Rule ("Plain Confidence"):**
      *   *The Rule:* $S(C, w) = C(w)$ (where $w$ is the true world/outcome).
      *   *Properties:*
          *   Truth-Directed? Yes, higher credence in truth = higher score.
          *   Proper? **No.**
          *   *Expected Score:* $E[S] = \sum p_i \cdot c_i$. To maximize this, put all mass on the outcome with highest $p_i$.
          *   *Result:* It incentivizes "maxing out" (assigning 1 to your favorite hypothesis). This is the "fanaticism" the user suspected.
      *   *The Friend's Rebuttal:* "Restrict inputs to coherent assignments."
          *   *Counter:* Even if restricted to coherent probabilities, expected score is linear. If $P(H_1) = 0.51, P(H_2) = 0.49$, expected score is maximized by reporting $C(H_1)=1, C(H_2)=0$. It still incentivizes moving away from your *actual* credence to the extreme.
      *   *Circularity Worry:* Is requiring strict propriety begging the question?
          *   *Response:* No. It's not defining accuracy *as* propriety. It's a constraint on *measuring* accuracy if we want accuracy to guide rational belief. If a measure tells you to lie to be "accurate," it's a bad measure of *epistemic* utility. The goal is to find a measure where *epistemic rationality* (following evidence) aligns with *epistemic utility* (accuracy).
      *   *Forecasting Pool Context:* The user asks if the pool is about "pure accuracy."
          *   *Insight:* Forecasting pools are usually about *incentivizing honest revelation* of belief. The friend's rule incentivizes *strategic exaggeration*. The Brier score incentivizes *honesty*.
          *   *Calibration/Resolution:* These are metrics of *performance*, not scoring rules for *incentives*. But the friend's rule destroys calibration.

