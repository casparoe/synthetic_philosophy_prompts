          *   What happens if we drop Propriety? The dominance theorem collapses. Non-probabilistic credences might not be dominated (as the user saw).
      *   **Part 2: The Friend's Rule (The "Plain Confidence" Rule):**
          *   Analyze the math: $E[Score] = \sum p_i c_i$.
          *   Show why it fails propriety (Linear maximization at boundaries).
