answer: |-
  This is a fantastic set of questions. You have put your finger on the exact tension that makes formal epistemology interesting: the gap between *what accuracy is* (a relation between mind and world) and *how we measure it* (scoring rules). Your friend's suggestion is a classic trap, and your worry about circularity is one that has occupied people like Jim Joyce, Hilary Greaves, and David Easwaran for years.

  Here is the breakdown of the accuracy-dominance argument, the specific failure of your friend's rule, and how to handle the circularity worry without begging the question.

  ---

  ### Part 1: The Mechanics of the Dominance Argument

  You asked how much of the argument for probabilism is carried by the scoring rule and what features are doing the work. The short answer is: **Strict Propriety is the engine; Continuity and Additivity are the chassis.**

  The accuracy-dominance argument (in the style of Joyce 1998, refined by Predd et al. 2009) proceeds roughly like this:
  1.  Define a measure of inaccuracy $\mathfrak{I}(C, w)$ for a credence function $C$ at world $w$.
  2.  Impose constraints on $\mathfrak{I}$.
  3.  Prove: If $C$ is not probabilistic, there exists a probabilistic $C^*$ such that $\mathfrak{I}(C^*, w) < \mathfrak{I}(C, w)$ for all $w$.

  Here is the "gut-level" role of each constraint:

  #### 1. Strict Propriety (The Honesty Condition)
  *   **Definition:** For any probabilistic credence function $P$, the expected inaccuracy $E_P[\mathfrak{I}(C, \cdot)]$ is uniquely minimized when $C = P$.
  *   **Gut-Level:** This ensures that if you *are* probabilistic, you never have an incentive to lie. If a measure is not strictly proper, there is some state of belief $P$ where you could maximize your expected accuracy by reporting a *different* set of numbers $C$.
  *   **Work in the Theorem:** This is the heavy lifter. It guarantees that the "peak" of the expected accuracy landscape aligns with your actual credences. Without this, the geometry of the dominance argument collapses. If the measure tells a probabilist to report non-probabilistic credences to maximize accuracy, you can't use accuracy to argue for probabilism.

  #### 2. Continuity (No Cliffs)
  *   **Definition:** Small changes in credence yield small changes in inaccuracy.
  *   **Gut-Level:** Epistemic evaluation shouldn't be gunky. If I move my credence in rain from 0.50 to 0.51, my accuracy score shouldn't plummet.
  *   **Work in the Theorem:** This allows the use of convexity arguments. It ensures that the "dominating" probabilistic function can be found via standard optimization (usually by projecting the incoherent point onto the probability simplex). If the function were discontinuous, an incoherent credence might sit in a "valley" where no nearby probabilistic credence is better.

  #### 3. Additivity/Separability (Independence)
  *   **Definition:** The score for a partition is the sum of the scores for the individual cells. $\mathfrak{I}(C, w) = \sum s(c_i, w_i)$.
  *   **Gut-Level:** How accurate I am about rain shouldn't depend on the credence I assigned to snow, provided they are distinct outcomes.
  *   **Work in the Theorem:** This simplifies the geometry. It allows us to treat the credence function as a point in Euclidean space and the inaccuracy as a distance metric (like Brier) or a divergence (like Log).

  #### Brier vs. Logarithmic Score
  You asked if switching to the Log score ($-\log c_w$) changes anything the programme cares about.
  *   **Structurally:** No. Both are continuous, additive, and **strictly proper**. Both yield the dominance theorem. Both prove that incoherent credences are accuracy-dominated.
  *   **Practically:** The Log score is more "punitive" near 0 and 1. Assigning 0 to the truth yields infinite inaccuracy. Brier is bounded.
  *   **Philosophically:** The accuracy-firster doesn't care which one is *true*, only that *some* such measure exists. However, many argue that if *any* strictly proper measure yields probabilism, that is sufficient to establish the norm.

  **What happens if we drop Strict Propriety?**
  The dominance argument fails. As you discovered with your friend's rule, if the measure is improper, incoherent credences (like 0.6, 0.6, 0.6) might not be dominated by any coherent set. In fact, under improper rules, coherent credences might be dominated by incoherent ones. The link between "being accurate" and "being probabilistic" is severed.

  ---

  ### Part 2: The Friend's Rule ("Plain Confidence")

  Let's look at your friend's rule formally. Let $C = (c_1, \dots, c_n)$ be your reported credences and $w$ be the index of the true outcome.
  $$ \text{Score}(C, w) = c_w $$
  (Higher is better).

  #### 1. Is it Truth-Directed?
  Yes, in a local sense. If the world is $w$, and you increase $c_w$, your score goes up. It satisfies the basic intuition that "more confidence in the truth is better."

  #### 2. Is it Proper?
  **No.** This is the fatal flaw.
  Let your *actual* credences be $P = (p_1, \dots, p_n)$. Your **expected score** is:
  $$ E_P[\text{Score}] = \sum_{i=1}^n p_i \cdot c_i $$
  This is a linear function of your reports $c_i$.
  To maximize a linear function over a simplex (where $\sum c_i = 1$ and $c_i \geq 0$), you go to the boundary.
  *   If $p_1$ is the largest probability (even if $p_1 = 0.34$ in a 3-cell partition), you maximize expected score by setting $c_1 = 1$ and $c_{others} = 0$.
  *   **Result:** The rule instructs you to be certain of whichever outcome you currently find *most plausible*, regardless of how weak that plausibility is.

  #### 3. The "Coherence Restriction" Rebuttal
  Your friend suggested restricting inputs to coherent assignments ($\sum c_i = 1$).
  As shown above, this **does not solve the problem.** Even if you are forced to be coherent, the rule still incentivizes you to report $(1, 0, 0)$ whenever your true belief is anything like $(0.51, 0.49, 0)$.
  It forces **extremism**. It decouples your *report* from your *belief*. In a forecasting pool, this turns the game into "Who is willing to lie the most aggressively about their uncertainty?"

  #### 4. Is it a Genuine Measure of Accuracy?
  It is a measure of **verisimilitude of the report**, but not a measure of **epistemic utility**.
  *   **Epistemic Utility:** A measure that tells a rational agent how to act to achieve epistemic goals.
  *   **The Problem:** If accuracy is the *sole fundamental epistemic good* (as accuracy-firsters claim), then a rational agent should maximize expected accuracy. If the measure is improper, maximizing expected accuracy requires you to adopt credences you do not hold.
  *   **Verdict:** It is "truth-directed" but **epistemically self-defeating**. It defines accuracy in a way that makes it impossible to pursue rationally without ceasing to be honest.

  ---

  ### Part 3: The Circularity Worry

  This is your deepest worry: *If we exclude the friend's rule because it isn't proper, and we want propriety because it makes our credences optimal, aren't we just defining accuracy to get the result we want?*

  This is the "Question-Begging" objection (raised by critics like Caie 2013). Here is the non-question-begging reply available to the accuracy-firster:

  **1. Propriety is a Functional Constraint, not a Definition.**
  We are not defining accuracy *as* propriety. We are asking: "What constraints must a measure of *distance from the truth* satisfy if it is to serve as a **normative guide** for belief?"
  *   If a measure of accuracy tells you, "To be accurate, you should believe $X$," but your evidence supports $Y$, that measure has failed to connect *evidence* to *truth*.
  *   Strict propriety is the mathematical condition required for **Internalism**. It ensures that from the agent's own perspective (their expectation), the most accurate thing to do is to report their actual evidence-based belief.
  *   **The Argument:** It is not circular to say, "We are looking for a norm of rationality. A norm must be followable. A scoring rule that requires you to misreport your belief to maximize score is not followable by a rational agent who knows their own beliefs. Therefore, it cannot be the fundamental epistemic good."

  **2. The "Domination" Intuition.**
  The dominance argument doesn't just say "Probabilism maximizes score." It says "Non-probabilism is *dominated*."
  Even if you don't care about propriety, you should care about dominance. If I can show you a set of credences that is **more accurate than yours in every possible world**, you are rationally required to switch, regardless of your current beliefs.
  *   With the Brier score (proper), incoherent credences are dominated.
  *   With your friend's rule (improper), incoherent credences (like 0.6, 0.6, 0.6) are **not** dominated. In fact, they often dominate coherent ones!
  *   So, we don't choose Brier *because* it yields probabilism. We choose it because it is one of the few measures that satisfies basic desiderata (continuity, truth-directedness) *and* yields a dominance theorem. The friend's rule fails to generate a dominance argument for anything useful.

  ---

  ### Part 4: Advice for the Forecasting Pool

  You asked if the right response is that the pool isn't a "pure accuracy exercise." I think you should go stronger than that.

  **1. Forecasting Pools are Mechanism Design, not just Measurement.**
  The purpose of a scoring rule in a pool is **Incentive Compatibility**. You want the Nash Equilibrium of the game to be "Report your true credence."
  *   **Brier/Log:** Truth-telling is the dominant strategy.
  *   **Friend's Rule:** Lying (extremizing) is the dominant strategy.
  *   If you use your friend's rule, you aren't measuring who is most accurate; you are measuring who is most willing to gamble. You will select for overconfidence, not insight.

  **2. Calibration and Resolution.**
  You mentioned worrying about conceding too much to the accuracy-firster by bringing in calibration.
  *   **Don't worry.** Calibration and Resolution are decompositions of the Brier Score (Murphy 1973).
      *   $\text{Brier} = \text{Calibration} + \text{Resolution} - \text{Uncertainty}$.
  *   By sticking with Brier, you *get* calibration and resolution for free. By switching to the "Plain Confidence" rule, you destroy calibration. (If everyone reports 1.0 on their favorite, calibration is terrible).
  *   So, you aren't abandoning accuracy to care about calibration. You are using a proper scoring rule (Brier) which *captures* calibration as a component of accuracy.

  **3. The "Humiliation" Factor.**
  Your friend's rule creates high variance. If I report 0.99 and I'm wrong, I get 0. If I report 0.51 and I'm wrong, I get 0.49.
  *   Under Brier, the penalty for being confidently wrong is high, but smooth.
  *   Under the Friend's rule, the incentive is to report 1.0. If you are wrong, you get 0 points.
  *   This turns the pool into a "Survivor" game rather than a skill assessment.

  ### Summary for your Friend

  You can tell him this:
  1.  **Mathematically:** His rule is linear. Linear maximization over a probability simplex always occurs at the vertices (0 or 1). It mathematically forces extremism, even if inputs are restricted to coherent probabilities.
  2.  **Epistemically:** A scoring rule that is not strictly proper cannot be used to argue for probabilism via dominance, because it fails to show that incoherent credences are always worse.
  3.  **Practically:** In a forecasting pool, an improper score measures "risk tolerance," not "predictive accuracy." If we want to know who has the best grasp of the departmental gossip, we need a rule where the best strategy is to say exactly what you think, not what sounds most confident.

  **The Circularity Reply:** "We aren't defining accuracy as propriety. We are observing that if accuracy is to be a *guide* for rational belief, it must not recommend that we lie about our beliefs. Your rule recommends lying. Therefore, it cannot serve as the fundamental epistemic norm."

  Stick with the Brier score. It keeps you honest.
