answer: |-
  This is a translation task between two fields that discovered the same math separately, separated by about forty years and a lot of jargon. The short version: Evolutionary ecology *is* the decision theory of replicators. The decision theorists are often rediscovering Lewontin and Cohen (1969) without the citation.

  Here is the translation of the "Expected Log Wealth" arguments into your desert annual system, followed by the honest assessment you asked for.

  ### The Rosetta Stone

  First, the direct mapping of terms.

  | Decision Theory / Finance | Evolutionary Ecology (Your System) |
  | :--- | :--- |
  | **Wealth ($W_t$)** | Seed bank size / Lineage abundance ($N_t$) |
  | **Return Rate ($r_t$)** | Per-capita reproductive success ($\lambda_t$) |
  | **Expected Utility ($E[U(W)]$)** | Expected Fitness (Arithmetic Mean $\bar{W}_A$) |
  | **Expected Log Utility ($E[\log W]$)** | Long-run Growth Rate ($\ln \bar{W}_G$) |
  | **Kelly Criterion** | Optimal Germination Fraction ($g^*$) |
  | **Ruin / Bankruptcy** | Extinction ($N_t = 0$) |
  | **Ensemble Average** | Average across many independent populations |
  | **Time Average** | Growth rate of a single lineage through history |
  | **Risk Aversion** | Variance sensitivity in geometric mean fitness |
  | **Value of Information** | Increase in $\ln \bar{W}_G$ from cue reliability |

  ---

  ### Part 1: Piece-by-Piece Translation

  #### 1. The Argument: "Don't Maximize Expected Wealth, Maximize Expected Log Wealth"
  *   **Decision Theory Claim:** If you maximize arithmetic expected wealth in a multiplicative process, you almost surely go broke. You must maximize the expectation of the logarithm.
  *   **Ecological Translation:** Do not maximize Arithmetic Mean Fitness ($\bar{W}_A$). Maximize Geometric Mean Fitness ($\bar{W}_G$).
      *   In your system: A genotype that germinates $g=1.0$ every year might have the highest $\bar{W}_A$ (huge boom in good years). But if one bad year hits ($\lambda < 1$), the lineage crashes. The lineage that germinates $g^* < 1$ (keeping a seed bank) sacrifices short-term arithmetic gain to ensure $\prod \lambda_t$ stays positive over time.
  *   **What Maps Cleanly:** This is the Lewontin-Cohen result. The long-run growth rate of a lineage in a stochastic environment is $\ln \bar{W}_G = E[\ln \lambda_t]$. Maximizing this is mathematically identical to maximizing expected log wealth.
  *   **What Had to Bend:** Decision theorists frame this as a preference ordering (an agent *choosing* log utility). In your system, it's a dynamic necessity. There is no "choice" to care about the geometric mean; lineages that maximize arithmetic mean in coarse-grained environments simply cease to exist.
  *   **What Has No Expression:** The concept of "utility" as a psychological state. In your framework, utility is just fitness proxy. There is no "satisfaction" from wealth, only persistence of the gene.

  #### 2. The Argument: "Kelly Betting and Geometric Rationality"
  *   **Decision Theory Claim:** The Kelly criterion (betting a fixed fraction) is the unique strategy that maximizes the asymptotic growth rate. "Geometric Rationality" (Scott et al.) argues this follows from axioms about respecting the multiplicative structure of the world, even if it violates VNM independence axioms.
  *   **Ecological Translation:** This is Cohen's (1966) optimal germination model.
      *   In your system: The plant commits to a germination fraction $g$. If the environment is i.i.d., the optimal $g^*$ is the Kelly fraction. If you have a cue (predictive information), you adjust $g$ based on the cue's reliability. The "value" of that cue is the difference in long-run growth rate $\Delta \ln \bar{W}_G$ between using the cue and ignoring it.
  *   **What Maps Cleanly:** The math is isomorphic. The "fixed fraction" bet is the "diversified bet-hedging" strategy. The Nash Bargaining connection in geometric rationality maps to the idea that selection maximizes the product of fitness gains across different environmental states (weighted by probability), which is the definition of geometric mean fitness.
  *   **What Had to Bend:** "Rationality." In finance, if you don't Kelly bet, you are "irrational." In ecology, if a plant doesn't Kelly bet, it is either maladapted or constrained (e.g., physiological limits on seed dormancy).
  *   **What Has No Expression:** The axiomatic debate. Ecologists don't derive germination fractions from axioms of consistency; they derive them from the recursion equation $N_{t+1} = N_t \cdot \lambda_t(g, E_t)$. The "axioms" are just the laws of population dynamics.

  #### 3. The Argument: "Ergodicity Economics"
  *   **Decision Theory Claim:** Standard Expected Utility Theory (EUT) assumes an ensemble of parallel worlds. Real agents live through one time series. In non-ergodic processes (multiplicative growth), the ensemble average ($E[W]$) diverges from the time average ($\lim_{T\to\infty} \frac{1}{T} \sum \ln W_t$). EUT is "wrong" because it optimizes the wrong average.
  *   **Ecological Translation:** This is the distinction between Fine-Grained vs. Coarse-Grained Environmental Variation.
      *   In your system: If variation is **fine-grained** (each seed experiences independent micro-climates), the population experiences the *ensemble average*. Arithmetic mean fitness rules. If variation is **coarse-grained** (all seeds experience the same "year"), the population experiences the *time average*. Geometric mean fitness rules.
      *   The ergodicity economists are essentially claiming that most real-world economic risk is coarse-grained (systemic), so geometric mean maximization is the correct normative rule.
  *   **What Maps Cleanly:** The mathematical distinction between ensemble and time averages in multiplicative processes is exactly the distinction between selection on individuals (fine) vs. selection on genotypes/lineages (coarse).
  *   **What Had to Bend:** The claim of novelty. Ecologists have treated the "non-ergodicity" of multiplicative growth as standard textbook material since the 1970s (e.g., Tuljapurkar).
  *   **What Has No Expression:** The philosophical claim that EU is *false*. In ecology, Arithmetic Mean Fitness isn't "wrong"; it's just the relevant metric for a different grain size. If you are a sterile worker ant, your fitness is zero, but the colony's geometric mean matters. If you are a bacterium in a chemostat with perfect mixing, arithmetic mean matters.

  ---

  ### Part 2: The Part You Actually Care About

  Here is the honest assessment of the friction points.

  #### (a) The Ensemble Objection: "I have many lineages in one world."
  You noted that for you, the ensemble isn't a fiction. You have thousands of plants. Does this break the ergodicity argument?

  **Verdict:** It saves the argument, but clarifies the condition.
  The ergodicity critique (that ensemble $\neq$ time) holds only if the risks are **correlated**.
  *   **If variation is fine-grained:** Your thousands of plants experience independent draws. The average wealth of your ensemble *does* converge to the expected wealth of a single plant. Here, maximizing arithmetic mean fitness is correct. The ergodicity economists would say this is rare in finance (you can't diversify away systemic market crashes).
  *   **If variation is coarse-grained:** A drought hits the whole desert. All your lineages suffer together. The ensemble average *does not* protect you. The time-series growth rate of the *metapopulation* is determined by the geometric mean.
  *   **The Catch:** The ergodicity people argue that because wealth is multiplicative and risks are often systemic, you should *act* as if you are a single lineage in a coarse-grained environment.
  *   **Ecological Reality:** You know this as "correlated environmental noise." If your lineages are spatially separated enough to experience independent years, the ensemble argument works. If they are in the same patch, the time-average (geometric) argument wins. The ergodicity claim is essentially a claim that **economic risk is spatially coarse-grained.**

  #### (b) The Extinction Objection: "Growth rate is undefined at zero."
  You noted that when $N_t=0$, $\ln(N_t)$ is undefined. The growth rate criterion stops working. Does finance ignore this?

  **Verdict:** Yes, finance quietly assumes a bottomless bankroll or continuous divisibility.
  *   **Finance:** The standard Kelly derivation assumes you can bet infinitesimally small fractions and that wealth is continuous. It ignores the absorbing barrier at $W=0$ (or assumes "bankruptcy" is just a very low number, not an end state). "Full Kelly" betting actually has a non-zero probability of ruin in finite time if there is parameter uncertainty or discrete betting limits.
  *   **Ecology:** We handle this better. We talk about **Quasi-Extinction Thresholds**. We know that maximizing $\ln \bar{W}_G$ is only valid when $N_t$ is large enough that demographic stochasticity doesn't dominate. When $N_t$ is small, the criterion shifts to "minimize probability of hitting zero" (conservative bet-hedging), which often means germinating *less* than the Kelly optimum.
  *   **The Gap:** Decision theory often lacks a formal treatment of the absorbing state. They maximize growth *conditional on survival*. Ecology explicitly models the probability of absorption. If you want to critique the Kelly/Ergodicity framework, this is the weak point: **Log-optimality assumes you are far from the extinction boundary.** Near the boundary, survival trumps growth.

  #### (c) The Normativity Objection: "Selection does the aiming, not the agent."
  You asked what survives of "You *should* Kelly bet" once it's in fitness-speak.

  **Verdict:** The normativity vanishes, revealing the decision theory debate is often about *constraints*, not math.
  *   **In Ecology:** "You should Kelly bet" translates to "Lineages that Kelly bet will outcompete those that don't." It is a descriptive law of dynamics, not a normative rule of conduct. A plant doesn't need to "know" log utility; it just needs to have been selected for $g^*$.
  *   **In Decision Theory:** The normativity exists because humans *deviate* from Kelly betting. We bet too much (overconfidence) or too little (loss aversion). The debate is: *Why* should a rational agent force themselves to Kelly bet if it feels wrong?
  *   **The Honest Assessment:**
      1.  **Is your framework missing something?** No, not regarding the math of growth. Your framework is more robust because it naturally incorporates the absorbing state (extinction) and demographic stochasticity, which standard Kelly theory ignores.
      2.  **Is the debate less sharp than it looks?** Yes. The "Expected Utility vs. Expected Log" war in economics is largely a fight over whether agents can self-insure against systemic risk.
          *   If agents can pool risk (insurance markets, fine-grained variation), Arithmetic Mean (Expected Utility) is correct.
          *   If agents cannot pool risk (no insurance, coarse-grained variation), Geometric Mean (Kelly) is correct.
      *   **The Leftover:** The only thing decision theory has that you might lack is **cognitive cost.** In your model, the plant pays no cost to "compute" $g^*$. In decision theory, calculating the optimal log-fraction is hard. Sometimes maximizing arithmetic mean is a "good enough" heuristic that saves computation costs, even if it loses long-term growth. That is a trade-off your fitness models usually treat as a constraint rather than an optimization variable.

  ### Summary
  The "Ergodicity Economics" and "Geometric Rationality" movements are effectively importing 1970s stochastic population dynamics into finance, repackaging it as a critique of Von Neumann-Morgenstern utility.

  *   **Their Insight:** Multiplicative processes make time averages and ensemble averages diverge. (You call this coarse-grained selection).
  *   **Their Blind Spot:** They often ignore the absorbing barrier (extinction) and assume continuous wealth. (You handle this with quasi-extinction thresholds).
  *   **The Normativity:** In your world, "rationality" is just "persistence." The debate in decision theory exists only because humans have the capacity to be irrational (i.e., go extinct via poor strategy).

  You don't need their theory. They need yours. But be aware: when they say "Expected Utility is wrong," they mean "Expected Utility is wrong for a single agent facing non-diversifiable, multiplicative risk." In your language: "Arithmetic mean fitness is wrong for a lineage in a coarse-grained environment." You've known that since graduate school.
