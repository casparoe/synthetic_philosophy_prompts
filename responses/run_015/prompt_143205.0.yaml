  hey, I'm an evolutionary ecologist, so my native vocabulary is fitness, not utility. I'm fluent in per-generation multiplicative growth, geometric vs arithmetic mean fitness, bet-hedging (conservative vs diversified), seed banks and germination fractions, cue-reading vs blind bet-hedging, fine- vs coarse-grained environmental variation, frequency dependence, and what happens to all of it when populations get small enough that extinction is a real absorbing state. I know basically no decision theory.

  What I want translated is the argument that a rational agent shouldn't maximize expected wealth, or expected utility of wealth, but expected log wealth: the Kelly rule you get from betting a fixed fraction of your bankroll, the more recent geometric rationality version where you maximize exp of the average log and which supposedly gives up one of the standard axioms and has something to do with Nash bargaining, and the ergodicity-flavored claim that ordinary expected utility is wrong because it averages over an ensemble of parallel agents instead of the one time-series a real agent actually lives through.

  Do it piece by piece, using my system: a desert annual with a persistent seed bank, good and bad years, the plant commits in advance to germinating a fraction g of the bank, ungerminated seed survives with probability s, good years come in autocorrelated runs, and there's a partly predictive cue available before the germination decision. For each piece say what maps cleanly onto stuff I already compute (long-run growth rate of a lineage, the growth rate in a random environment, the growth value of cue information), what you had to bend to make it fit, and what has no expression in fitness terms at all.

  Then the part I actually care about: (a) I have literally many lineages in one world, so for me the ensemble isn't a hypothetical fiction the way the ergodicity people say it is — does that break their argument or save it? (b) my criterion stops working once extinction is on the table, since the growth rate of a lineage that hits zero isn't a number — is there any counterpart in the finance version, or does it quietly assume an effectively bottomless bankroll? (c) growth-rate maximization is a consequence of selection here, not something anybody aims at, so what survives of the normativity of you should Kelly bet once it's in fitness-speak? Be honest about whether the leftovers show my framework is missing something or show the whole debate is less sharp than it looks. American English please.
