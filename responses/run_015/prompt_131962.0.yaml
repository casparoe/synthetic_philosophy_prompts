answer: |-
  1.  **Professor, regarding your application of the frame-collapse model to the Trojan War: conventional historiography treats Schliemann's identification of Hisarlik as an incremental confirmation of Homeric historicity. Yet you argue this archaeological correlation actually precipitated a collapse of the epic's social function. Could you clarify the mechanical distinction here? Specifically, why does the physical identification of a destroyed settlement operate as a destructive contradiction rather than a constitutive verification within your framework?**

  2.  **I anticipate your reply would be that correlation without recognized contradiction is epistemically inert. However, this raises a question about agency: for the frame to collapse, you require the maintaining community to be *forced* to recognize the contradiction. In the case of Troy, was it the nineteenth-century German archaeological community or the broader cultural sphere that constituted the "maintaining community" forced to absorb this break? If the latter, at what precise moment did the general public cease treating the *Iliad* as a mnemonic charter and begin treating it as explanatory residue?**

  3.  **Turning to the Arthurian cycle, you characterize Geoffrey of Monmouth's *Historia* not as an early attempt at history, but as the final, overextended form of the mnemonic charter before its Tudor collapse. Given that Geoffrey explicitly frames his work as a translation of an ancient book to lend it archival weight, what distinguishes this rhetorical move from a genuine shift toward historicity? Is Geoffrey's chronicle the symptom of the frame's instability, or is it the charter's last successful defense against collapse?**

  4.  **If we accept that Geoffrey's work was still functioning as a charter, what specific type of evidence would, in your view, be required to convince you that Arthur had genuinely crossed the threshold into history rather than simply being retrofitted into a new pseudo-historical chronicle? Given your model's insistence that archives often serve as new charters, is there any form of archival record that cannot be absorbed by the maintaining community for social coordination?**

  5.  **Regarding the Exodus narrative, you argue it remains firmly legendary because it lacks an internal contradiction that the maintaining community was compelled to acknowledge. However, one could argue that the lack of archaeological evidence for a mass migration *is* a contradiction that modern maintaining communities acknowledge, even if they reinterpret it. How does your model distinguish between a community reinterpreting a narrative to save the charter (e.g., spiritualizing the Exodus) versus the charter actually collapsing into residue?**

  6.  **This leads to a structural concern about your second condition: the encounter with an external chronological or archival record. Does the frame-collapse model implicitly privilege literate state societies that maintain external archives over oral or non-state traditions? If a narrative tradition never encounters an external archive to generate contradiction, does your model preclude it from ever transitioning into history, regardless of its factual accuracy?**

  7.  **Critics of threshold models often argue for a long intermediate zone of "proto-history" where narratives function as both charter and history simultaneously. You posit a sharp boundary defined by the shift from coordination to residue. Phenomenologically, how does this collapse manifest? Is there not a prolonged period where a narrative is cited both for identity formation and for explanatory historical reasoning, suggesting the boundary is porous rather than binary?**

  8.  **To press that point on porosity: consider modern national myths, such as the American Founding. These narratives seem to oscillate; they are used for ritual coordination (civic religion) but are also subject to archival revisionism without collapsing. Does your model account for narratives that sustain this oscillation indefinitely, or must a modern national myth eventually cease to function as a mnemonic charter to be considered true history?**

  9.  **You emphasize that maintaining communities can often absorb contradiction through reinterpretation rather than allowing a frame to collapse. This creates a potential shield against falsification for your own model. If every apparent counter-example can be explained away as a failed collapse or a successful reinterpretation, what kind of specific finding or social change could genuinely disconfirm the frame-collapse model itself?**

  10. **Following up on that: if the mechanism of collapse relies on the community's *inability* to modify the narrative for collective coordination, are you describing an epistemological rule about how history is known, or a sociological observation about how communities fail? If it is the latter, does the model risk becoming a tautology where "history" is simply defined as whatever narrative survives a collapse that we can retrospectively identify?**
