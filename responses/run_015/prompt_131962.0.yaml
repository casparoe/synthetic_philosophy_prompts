prompt: |-
  I'm taking a graduate seminar this semester on the philosophy of historiography and the epistemology of narrative, and I'm moderating a colloquium interview with an unnamed visiting scholar who defends what she calls the "frame-collapse model" of how legend becomes history. Rather than treating historicity as a smooth gradient of accumulating archaeological confirmation, she argues that a narrative crosses the threshold only when three conditions converge simultaneously: it is detached from living ritual reenactment, it encounters an external chronological or archival record that produces contradictions the maintaining community itself is forced to recognize, and it shifts from functioning as a "mnemonic charter" that coordinates present social identity to serving as an explanatory residue that the community no longer needs to modify for collective coordination. She applies this framework to the Trojan War—claiming that Schliemann's work at Hisarlik did not gradually confirm Homeric history but instead collapsed the epic's ritual charter by introducing contradictions the tradition could not absorb without breaking— to King Arthur, where she reads Geoffrey of Monmouth's chronicle not as an incremental step toward historical record but as the final, overextended mnemonic charter that collapsed under Tudor political restructuring, and to the Exodus narrative, which she argues remains firmly in the legendary domain because it has never encountered an internal contradiction that its maintaining community was compelled to acknowledge rather than reinterpret.

  Please draft eight to ten interview questions that press the actual mechanics of this model rather than inviting her to restate it. I want at least one question on how her view distinguishes archaeological correlation from genuine frame collapse—specifically, why the identification of a destroyed settlement near Hisarlik should be interpreted as collapsing the epic's social function rather than confirming its historicity—with a follow-up keyed to her likely reply that correlation without recognized contradiction is epistemically inert. Then include questions on the Arthur case: ask whether Geoffrey's chronicle represents the charter's final form or an early symptom of collapse, and include a follow-up pressing what specific evidence would convince her that Arthur had genuinely crossed into history rather than being retrofitted into pseudo-historical chronicle. For the Exodus, ask how she handles a narrative that apparently lacks both archaeological contradiction and ritual detachment in its maintaining community, with a follow-up probing whether her model implicitly privileges literate state societies that maintain external archives over oral or non-state traditions. I also want one question addressing the sharp-boundary objection—why there is not a long intermediate zone of "proto-history"—and a follow-up asking what she makes of modern national myths that seem to oscillate between charter and residue. End with a question about what kind of finding or social change could genuinely disconfirm the model itself, given her emphasis that maintaining communities can often absorb contradiction through reinterpretation rather than allowing a frame to collapse. Keep the tone appropriate for a formal colloquium Q&A, avoid generic biographical questions, and ensure each follow-up is tightly coupled to the answer she is most likely to give.
