      *   *The "Why" matters:* If the algorithm fails, we don't know why. If Elena failed, she might have left clues in the notebooks (even if cryptic).
      *   *Risk of Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." The algorithm optimizes the metric. Elena optimized the farm.
      *   *Tone:* Respectful, analytical, philosophical but grounded in agriculture.

