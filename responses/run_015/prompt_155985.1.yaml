      *   *Best Upstream Question:* **The Status of the 'Hypothesis' vs. the 'Regulative Ideal'.** Wittgenstein explicitly contrasts religious belief with scientific hypothesis. Resolving *how* it differs without making it non-cognitive is the key.
      *   *Decision:* The pivotal upstream question is: **What is the modal status of religious 'pictures' (Bilder) in relation to empirical falsification?** If we settle whether religious pictures function as *unfalsifiable frameworks* (hinges) or *guiding ideals* (regulative), it dictates the propositional content, the role of judgment, and the nature of commitment.

