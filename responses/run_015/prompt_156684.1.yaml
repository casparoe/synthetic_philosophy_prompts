  3.  **Evaluate Friend A vs. Friend B:**

      *   *Friend A (Plinth = Honor):* Explains why museums are acceptable destinations. The bronze isn't the honor; the *site* is.
      *   *Friend B (Names = Active Enrollment):* Explains why renaming is less controversial (it's practical hygiene) but also why it's expensive (it's pervasive). Wait, the user says renaming causes *less* fighting. Friend B says names are *worse* (more intrusive). If names are more intrusive, why less fighting?
      *   *Correction/Refinement:* Friend B suggests names implicate us more. If they implicate us more, removing the name should be *more* urgent/less controversial because the contamination is deeper. Statues are background noise; names are active speech. So, removing a name is cleaning up our own speech. Removing a statue is destroying a shared landmark.
      *   *Synthesis:* Both are partially right but miss the core distinction: *Civic Endorsement vs. Civic Utility.*

  4.  **Develop the Core Argument (The "Expressive Endorsement" Theory):**

      *   The prevailing view presupposes that public commemoration is **Current Civic Endorsement**.
