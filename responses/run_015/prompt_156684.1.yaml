      *   It is *not* primarily the property of the dead (otherwise removal would be desecration).
      *   It is *not* purely aesthetic (otherwise bad art would be removed regardless of morality).
      *   *Key Distinction:* Statues are *monumental* (static, visual, hierarchical). Names are *functional* (linguistic, repetitive, relational).
      *   *The Inconsistency:* The package is *not* fully internally consistent. It treats statues as "idols" (need to be dethroned) and names as "labels" (need to be updated).
      *   *The "Wrongdoing" Clue:* This confirms the "Moral Exemplar" theory. We commemorate to say "Be like this." If they are bad, the command is toxic. If they are mediocre, the command is just boring (ignoreable).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. State the thesis: The practices presuppose commemoration as **active, present-tense moral endorsement** by the community, not historical record-keeping.
      *   **The Statue Logic (Friend A's contribution):** Analyze the "Plinth vs. Object" distinction. The museum neutralizes the *honor* without destroying the *artifact*. This presupposes honor is spatial/contextual.
      *   **The Name Logic (Friend B's contribution):** Analyze the "Usage" distinction. Names are speech acts. We "speak" the name every time we use the address. Renaming is stopping the speech. It's less fought over because it's seen as administrative hygiene, whereas statues are seen as heritage/landmarks.
      *   **The "Wrongdoing" Constraint:** Why not mediocrity? Because commemoration asserts *admirability*, not just *importance*. This rules out the "Historical Record" view.
      *   **Internal Consistency Check:** Are statues and names treated the same? No. Statues = Idols (Location matters). Names = Labels (Usage matters). This reveals a tension.
