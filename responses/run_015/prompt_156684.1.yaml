answer: |-
  The package of practices you describe is not internally consistent, but it is functionally coherent. It operates under a specific, hybrid theory of commemoration that treats statues and names as different *categories* of speech, even though they serve the same ultimate goal.

  Here is the argument for what this package presupposes, what it rules out, and where the tensions lie.

  ### 1. The Core Presupposition: Present-Tense Moral Endorsement
  The entire package strictly presupposes that public commemoration is an act of **current civic endorsement**, not historical record-keeping.

  If commemoration were primarily a **Historical Record**, the "wrongdoing vs. mediocrity" pattern would not exist. A historical record cares about significance, not virtue. A mediocre dullard who shaped the city's layout is historically significant; a virtuous saint who did nothing is not. The fact that campaigns only fire when there is *wrongdoing* proves that the public understands a statue or name not as a claim that "This person existed and mattered," but as a claim that "This person is worthy of our respect."

  Therefore, the practice rules out the view that the dead have a stake in their commemoration. If the dead had rights, removal would be desecration regardless of their deeds. It also rules out the view that commemoration is purely aesthetic. If it were, we would melt down bad bronze regardless of the subject's morality, and keep good bronze regardless of their crimes. We do neither.

  The practice asserts that "We" (the current community) are the speakers. A monument is a sentence the city is currently saying. If the sentence becomes morally unacceptable to the speaker, the speaker must stop saying it.

  ### 2. The Ontological Split: Statues vs. Names
  Your observation about the cost/hassle paradox (renaming is expensive but less fought; statues are cheap to move but highly fought) reveals that the package runs on two different theories of *what* is being commemorated.

  **Statues: The Theory of Hierarchical Space (Friend A is mostly right)**
  The practice treats a statue as an **idol**. The honor resides in the *pedestal*, not the bronze.
  *   **Why the museum?** A museum is a space of *context*. In a square, the statue says "Look up to this." In a museum, it says "Look at this." The museum neutralizes the honor without destroying the evidence. This presupposes that meaning is **spatial**.
  *   **Why the fight?** Because a statue is a landmark. It anchors the physical identity of a place. Removing it leaves a "scar" or a void. It is a visible act of erasure. The fight is about the *visibility of the change*.
  *   **Friend A's verdict:** His theory is doing work. The practice assumes the bronze is inert matter; the *site* is the active agent of honor. That is why we don't melt them down. Melting implies the object itself is toxic. Moving it implies the *location* was the lie.

  **Names: The Theory of Participatory Speech (Friend B is mostly right)**
  The practice treats a name as a **speech act**.
  *   **Why renaming is "fine"?** Because a name is functional. We "speak" the address every time we use it. To keep a bad name is to be forced to verbally endorse a bad person daily. Renaming is seen as administrative hygiene, like fixing a pothole. It stops the community from being complicit.
  *   **Why the cost doesn't matter?** Because the cost is one-off (new signs), but the moral cost of the name is recurring (every use).
  *   **Friend B's verdict:** His theory explains why renaming is less controversial. It feels like updating software rather than demolishing a building. It implicates the user less emotionally than a statue, even if it implicates them more linguistically.

  **The Inconsistency:**
  The package is inconsistent because it treats statues as **monuments** (static, visual, to be viewed) and names as **tools** (active, linguistic, to be used).
  *   If they were the same category, the "Retain and Explain" option would work equally for both. We don't put plaques on street names saying "This guy was a racist but keep using it." We just change the name.
  *   Conversely, if statues were treated like names, we wouldn't move them; we would just add a plaque and keep looking at them.
  *   The fact that we move statues but rename streets suggests we think visual dominance (statues) requires physical removal, while linguistic dominance (names) requires semantic correction.

  ### 3. The "Wrongdoing" Threshold and the Claim of Admirability
  You noted that campaigns never target the mediocre. This is the strongest evidence for what the practice presupposes.

  A monument asserts **Admirability**, not just **Importance**.
  *   If I name a school after a mediocre local mayor, I am not saying "He was a saint." I am saying "He was one of us, and he did a job." It is a low-bar honor.
  *   If I name a school after a founder who owned slaves, I am making a high-bar claim. I am elevating him above the ordinary.
  *   The practice presupposes that **silence is preferable to mediocrity, but active repudiation is required for villainy.**
  *   This explains why we don't rename things after dullards. To remove a dullard's name is an insult to their memory without moral cause. To remove a villain's name is a moral duty. The practice assumes the default state of commemoration is *positive regard*. If that regard cannot be sustained, the commemoration must end.

  ### 4. The "Retain and Explain" Paradox
  You asked if "Retain and Explain" assumes meaning is fixed by us now. Actually, it reveals a desperate attempt to bridge two incompatible views: **Heritage** vs. **Endorsement**.

  *   **Heritage View:** "This object tells us about the people who put it up (our ancestors)."
  *   **Endorsement View:** "This object tells us who *we* value now."

  "Retain and Explain" tries to say: "We value this as history (Heritage), but not as a hero (Endorsement)."
  *   **Where it fails:** It works for buildings (which are useful) and sometimes statues (if the art is great). It fails when the moral stain overwhelms the historical interest.
  *   **What it proves:** It proves that the "Current Endorsement" view is winning. If the Heritage view were dominant, we would never remove anything; we would just label everything. The fact that we *sometimes* remove things proves that Current Endorsement trumps Historical Record when the two conflict. The plaque is a compromise offered when the pressure to remove is not quite strong enough to overcome the inertia of the object.

  ### 5. Counterfactuals: What if we swapped the theory?
  To understand what the current practice *is*, look at what would happen if we adopted the rival views you mentioned.

  **Scenario A: Commemoration as Historical Record (The "Archivist" View)**
  *   **Theory:** Monuments record what past generations valued, not what we value.
  *   **Practice Change:** No statues come down. No names change. Every controversial figure gets a detailed plaque explaining their crimes. We keep Confederate statues and Stalin statues alike, treating them as warnings or data points.
  *   **Result:** The "wrongdoing" pattern vanishes. Mediocrity and villainy are treated the same (as data).

  **Scenario B: Commemoration as the Dead's Property (The "Rights" View)**
  *   **Theory:** Once given, honor belongs to the deceased. It is a contract across time.
  *   **Practice Change:** Removal becomes impossible, akin to grave desecration. Renaming is forbidden unless the family consents.
  *   **Result:** The "Current Endorsement" view is killed. The city admits it has no right to retract speech from the past.

  **Scenario C: Commemoration as Pure Aesthetics (The "Art" View)**
  *   **Theory:** Only artistic merit matters.
  *   **Practice Change:** Bad bronze statues of saints are melted down. Beautiful statues of tyrants are preserved and admired for the craft, perhaps with a note that the subject was evil, but the art is good.
  *   **Result:** The "wrongdoing" pattern vanishes. A beautiful statue of a genocidal leader stays up; a ugly statue of a humanitarian comes down.

  ### 6. Conclusion: The Unspoken Agreement
  The package of practices you observe presupposes a **Pragmatic Moral Expressivism**.

  1.  **It presupposes:** The city is a moral agent that must ensure its public environment reflects its current values.
  2.  **It presupposes:** Honor is contextual. A pedestal confers status; a museum confers history. A street name confers usage; a plaque confers nuance.
  3.  **It rules out:** The idea that history is sacred (we edit it), and the idea that the dead have rights (we overrule them).
  4.  **It is underdetermined on:** The threshold of "wrongdoing." There is no consistent rule for how bad is "bad enough," which is why every case becomes a fight.
  5.  **It is inconsistent on:** The medium. It treats statues as *locations* (which must be vacated) and names as *words* (which must be corrected).

  Your first mate is correct about the statue: the honor is in the plinth. That is why the museum works.
  Your second mate is correct about the name: the honor is in the usage. That is why renaming feels necessary.

  The reason renaming causes less fighting despite higher cost is that renaming is **invisible labor**. Once the sign is changed, the offense is gone. Removing a statue is **visible labor**. The empty plinth remains as a testament to the conflict. We prefer to pay money to make the problem invisible (renaming) than to make the problem visible (an empty square), even if the visible option is cheaper. This suggests the ultimate goal of the practice is not just to stop honoring the bad person, but to **restore the comfort of the public space** with the least amount of ongoing visual friction.
