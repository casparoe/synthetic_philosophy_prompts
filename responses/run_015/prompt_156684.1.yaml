          *   *View 1: Historical Record.* (Keep everything, label everything).
          *   *View 2: Dead's Rights.* (Never remove, it's their property).
          *   *View 3: Pure Aesthetics.* (Remove bad art, keep good art regardless of morals).
      *   **Conclusion:** Summarize the specific view of "We" implied here.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* I need to make sure I answer the specific question about whether the package is internally consistent.
      *   *Adjustment:* I should argue it is *pragmatically* consistent (both aim to stop endorsement) but *ontologically* inconsistent (they treat the medium of commemoration differently).
      *   *Critique:* The user asked about the "museum solution" – is it a compromise nobody thought through?
      *   *Adjustment:* Argue that it *is* thought through under the "Contextual Honor" theory. It's not a bug, it's a feature. It preserves history while withdrawing honor.
      *   *Critique:* Make sure to address the "cost/hassle" paradox. Why do we accept the expensive option (renaming) more easily than the cheap one (statue removal)?
      *   *Adjustment:* Because renaming is *invisible* once done. Statue removal leaves a gap (a scar). Renaming updates the software; statue removal breaks the hardware. Also, names are functional; statues are symbolic. Changing function is easier than changing symbol.

  7.  **Final Polish:** Check against constraints (no citations, focus on argument structure). Ensure the tone is analytical and philosophical, matching the user's prompt. (The user's prompt is very sophisticated, so the response must match that level of nuance).

      *   *Key Insight to highlight:* The distinction between *Honoring* (Statues) and *Invoking* (Names).
      *   *Key Insight to highlight:* The "Moral Threshold." Commemoration is a moral claim, not a factual one.

  8.  **Final Review against User Questions:**
