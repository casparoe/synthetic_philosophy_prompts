      *   **The User's Friends' Theories:**
          *   *Friend A:* The honor is in the *placement* (plinth/pedestal), not the object. Museum = neutral storage.
          *   *Friend B:* Names are *worse* (more intrusive/active) because we use them constantly; statues are passive background.
      *   **The User's Questions:**
          *   What does this package of practices presuppose about what a statue/name *is*?
          *   What view of commemoration makes sense of this? (Honor? Record? Expression of "us"? Admirability?)
          *   What rival views does it rule out?
          *   Separate strict presuppositions from comfortable fits/underdetermined areas.
          *   Is Friend A's theory actually doing work, or is it an unthought-through compromise?
          *   Does the "wrongdoing vs. mediocrity" pattern reveal something about what monuments assert?
          *   Is the package internally consistent (do statues and names run on the same theory)?
          *   What would change if we swapped in rival views (Record vs. Current Speech vs. Dead's Stake)?
      *   **Constraint:** No reading recommendations or names of papers. Just the argument.

  2.  **Analyze the Phenomenon (The "Package of Practices"):**

      *   *Practice 1: Statue Removal to Museum.*
          *   Implication: The object itself isn't toxic, but its *context* is. The pedestal confers status. The museum confers "historical artifact" status rather than "hero" status.
          *   Presupposition: Commemoration is about *elevating* someone above the ordinary flow of time. A museum places them *in* history, not *above* it.
      *   *Practice 2: Renaming.*
          *   Implication: Names are functional tools we inhabit. To bear a name is to be in a relationship with that namesake.
          *   Presupposition: Commemoration is *participatory*. Using the name enacts the honor.
      *   *Practice 3: Wrongdoing vs. Mediocrity.*
          *   Implication: We don't care if they were boring. We care if they were *bad*.
          *   Presupposition: Commemoration implies *moral endorsement*, not just historical significance. It asserts "This person is good/worthy of emulation," not just "This person existed/was important."
      *   *Practice 4: Retain and Explain.*
