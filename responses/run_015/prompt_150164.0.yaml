answer: |-
  **JOINT STATEMENT ON THE COMMON PRIOR ASSUMPTION AND RATIONAL DISAGREEMENT**

  **Date:** October 26, 2023
  **Parties:** Common-Prior Rationalists (CPR) and Prior-Pluralist Epistemologists (PPE)

  ### I. AGREED CLAIMS

  We, the undersigned representatives of the Common-Prior Rationalist and Prior-Pluralist Epistemologist camps, affirm the following claims regarding Bayesian epistemology, belief updating, and the formal scope of agreement theorems. These claims represent the settled mathematical and procedural ground upon which our further disagreements rest.

  1.  **Validity of Conditionalization:** We agree that conditionalization is the correct normative rule for updating degrees of belief in light of new evidence, provided the agent treats the evidence as certain. Divergence in posterior beliefs among agents who began with identical priors must be attributed to differential access to evidence or errors in the updating process.
  2.  **Formal Validity of Agreement Theorems:** We acknowledge that Aumann's Agreement Theorem and its subsequent generalizations are mathematically valid within their specified axiomatic systems. Specifically, we agree that *if* agents share a common prior, *and* *if* their posterior probabilities are common knowledge, *then* those posteriors must be identical.
  3.  **Role of Private Information:** We agree that a significant portion of persistent disagreement in practical contexts (science, policy, daily life) is explicable by asymmetric access to private information or differential processing of public data, rather than fundamental differences in prior probability assignments.
  4.  **Limits of Common Knowledge:** We acknowledge that the condition of "common knowledge of posteriors" is rarely met in real-world interactions. Consequently, the Agreement Theorem does not entail that rational agents must immediately converge in practice, only that they should expect to converge upon full exchange of information and reasoning.
  5.  **Distinction Between Descriptive and Normative:** We agree that the Common Prior Assumption (CPA) functions descriptively in many economic and game-theoretic models to ensure tractability. Our disagreement concerns whether the CPA should be regarded as a *normative constraint on rationality itself* or merely a modeling convenience.
  6.  **Underdetermination:** We acknowledge that empirical data alone often underdetermines theory choice, particularly in metaphysical, normative, and high-level theoretical domains. We agree that Bayesian agents must rely on prior probabilities to bridge the gap between evidence and theory in these regimes.

  ### II. RESIDUAL DISAGREEMENTS

  While we share a commitment to Bayesian formalism, we diverge on the interpretation of rational constraints regarding initial belief states. The following table delineates our positions in neutral terms, such that each camp recognizes its own view without concession.

  | Feature of Disagreement | Common-Prior Rationalists (CPR) | Prior-Pluralist Epistemologists (PPE) |
  | :--- | :--- | :--- |
  | **Normative Status of CPA** | The Common Prior Assumption is a normative requirement for ideal rationality. Rational agents *ought* to share a prior, typically derived from objective principles (e.g., Maximum Entropy, Symmetry). | The Common Prior Assumption is not a normative requirement. Rational agents may legitimately possess distinct priors reflecting different epistemic starting points or worldview commitments. |
  | **Diagnosis of Persistent Disagreement** | Persistent disagreement on fundamental matters, given shared evidence, indicates a failure of rationality (e.g., bias, computational error, or unacknowledged private information). | Persistent disagreement on fundamental matters, given shared evidence, can be a rational equilibrium resulting from permissible pluralism in prior assignment. |
  | **Nature of Priors** | Priors are essentially estimations of objective chances or logical relations; differences are reducible to hidden information or cognitive error. | Priors encode substantive epistemic values (e.g., conservatism, boldness, simplicity) that are not fully reducible to information; differences can be substantive rather than erroneous. |
  | **Goal of Discourse** | The primary goal of epistemic discourse is to eliminate disagreement by uncovering hidden asymmetries and correcting updating errors to force convergence. | The primary goal of epistemic discourse is to understand the structural sources of divergence and determine if coexistence of distinct priors is epistemically permissible. |

  ### III. CRUXES AND CONCRETE CASES

  We identify the following specific sub-questions ("cruxes") where settling the matter would significantly shift the position of at least one camp. For each crux, we specify a concrete case and record each side's interpretation of what that case demonstrates.

  #### Crux 1: The Scope of Agreement Results in Normative and Metaphysical Domains
  **Question:** Do Aumann-style agreement results apply with equal force to normative, metaphysical, and ontologically underdetermined claims as they do to empirical frequency claims?

  *   **Concrete Case:** Two ethicists agree on all non-moral natural facts regarding a specific trolley problem scenario but disagree on the moral permissibility of action.
  *   **CPR Interpretation:** This disagreement indicates that at least one agent is failing to access a shared objective moral prior or is failing to update correctly on the natural facts. The disagreement is resolvable in principle via a "view from nowhere" prior.
  *   **PPE Interpretation:** This disagreement reflects permissible variation in fundamental normative priors. There is no "objective moral prior" to be accessed; the divergence is a feature of the domain, not a bug in the agents.

  #### Crux 2: Theoretical Virtues as Prior Weights
  **Question:** Are agents who share all empirical data but assign different prior weights to theoretical virtues (e.g., explanatory depth vs. ontological parsimony) in a state of rational divergence or rational error?

  *   **Concrete Case (Required):** **Cosmological Ontology and the Cosmic Microwave Background (CMB).**
      *   *Scenario:* Two cosmologists possess identical measurements of the CMB power spectrum. The data is consistent with both a Single-Universe inflation model and a Multiverse-generating mechanism. The regimes required to empirically distinguish the ontologies are inaccessible.
      *   *Agent A* assigns a high prior probability to the Multiverse hypothesis based on a prior commitment to "generative capacity" (theories that explain constants via selection effects are preferred).
      *   *Agent B* assigns a high prior probability to the Single-Universe hypothesis based on a prior commitment to "ontological parsimony" (do not multiply entities beyond necessity).
  *   **CPR Prediction/Interpretation:** This case demonstrates a failure of objective Bayesianism. One prior is objectively superior (likely derivable from symmetry or indifference principles). The agents are in a state of rational error; one is overweighting a virtue that does not track truth probability. Continued disagreement implies one agent is refusing to acknowledge the objective weight of the theoretical virtue.
  *   **PPE Prediction/Interpretation:** This case demonstrates the legitimacy of Prior Pluralism. Since the data underdetermines the ontology, the choice rests on epistemic values that are not dictated by the evidence. Both agents are rational; the disagreement is fundamental and not resolvable by further empirical data alone. Collapsing this into "error" unjustifiably privileges one epistemic value system over another.

  #### Crux 3: The Reducibility of Priors to Information
  **Question:** Can all differences in priors be reconstructed as differences in past information (the "Harsanyi Doctrine"), or are there "brute" prior differences?

  *   **Concrete Case:** A subject is presented with a completely novel, abstract logical puzzle with no antecedent empirical content. Two agents assign different initial probabilities to the solution.
  *   **CPR Interpretation:** The difference traces to subtle differences in the agents' past logical training or cognitive history (hidden information). If we fully specified their causal history, the prior difference would vanish into information asymmetry.
  *   **PPE Interpretation:** The difference is a "brute" difference in cognitive disposition or logical intuition that is not reducible to information. Rationality permits multiple starting points even in the absence of differential history.

  ### IV. DISTINCTION BETWEEN SETTLED LITERATURE AND CONTESTED INTERPRETATION

  To prevent future confusion, we explicitly distinguish the mathematical consensus from the philosophical contention:

  1.  **Settled in Formal Literature:** It is mathematically proven that *given* the Common Prior Assumption and common knowledge of posteriors, disagreement is impossible. It is also settled that Bayesian updating preserves the ratio of probabilities for hypotheses that predict the evidence equally well.
  2.  **Contested Among Experts:** It remains genuinely contested whether the Common Prior Assumption is a justified normative constraint on rational agents operating in underdetermined domains. There is no consensus on whether objective priors exist for metaphysical hypotheses, nor is there consensus on whether persistent disagreement in such domains constitutes a violation of rationality.

  We sign this statement to affirm that while we share a language of probability, we disagree on the boundaries of rational permission regarding the starting points of inference.

  **Signed,**

  *Representatives of the Common-Prior Rationalists*
  *Representatives of the Prior-Pluralist Epistemologists*
