prompt: |-
  I spent forty years in surface science and heterogeneous catalysis, and since retiring I have been sitting in on a graduate seminar in philosophy of science at the university where I used to work. The group is mostly philosophers and a few methodologists, and I am the only person there who has spent a career actually taking measurements, so I get asked to say what the statistics means in practice. I would be grateful for some help with that.

  We read a recent trade book on the replication crisis — I will not name it, and I have no interest in debating this particular author. What I want is an audit of an argument, because I suspect I have been persuaded by more of it than I should have been. Below is my own reconstruction of the chapter's central argument, in my wording and not the author's, compressed to about a page. I have put it in quotation marks only to mark it off as the object of my question; it is a paraphrase, not a transcription.

  "The replication crisis is, at bottom, an artifact of null hypothesis significance testing. The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data, and the habit of reading the first as the second is what let whole literatures fill up with confident findings that later evaporated. Publication bias then compounds the damage: journals print the significant results and shelve the null ones, so the published record is a selection-biased sample in which every reported effect is an overestimate of the truth. That is why careful replications, run with larger samples and without the filter, shrink the effect toward zero.

  The remedy is to stop asking the wrong question and become Bayesians. Bayesian inference gives you exactly what you wanted: a probability for the hypothesis, given the evidence you actually have. It also dismantles the machinery that produced the crisis. Because Bayes' theorem conditions on the data observed and on nothing else, a Bayesian is free to keep collecting observations until the picture is clear and then stop; there is no analogue of the stopping-rule inflation of false positives that makes optional stopping a form of cheating under significance testing. The researcher degrees of freedom that generate p-hacking accordingly lose their leverage, and the incentive to fish disappears.

  The one remaining objection is the prior, which is admittedly subjective. But priors wash out: as the data accumulate the likelihood dominates, so investigators starting from different priors converge on the same posterior. Subjectivity is therefore a transitory inconvenience rather than a defect, and a small price for a method that answers the question one was asking in the first place. Properly understood, the replication crisis is not a reason to doubt science. It is a reason to doubt a particular, and now outdated, statistical technology."

  My own inclination is that the diagnosis in the first paragraph is essentially right and the remedy in the second and third is oversold — but I cannot locate precisely where it goes wrong, and when I try to say so in the seminar I find myself repeating the book's phrasing.

  There is also something I have been worrying at from my own field, and I would like it tested rather than indulged. Take a stylized composite of several cases I watched happen: a support-induced enhancement of catalytic turnover is reported in the 1990s as roughly a factor of sixty; by the late 2000s, with better controls, it is a factor of six; now, with proper blinding and preregistered protocols, it is about two, and the original papers are still the ones cited. What struck me is that the field's priors were themselves manufactured out of the selected literature. If that is right, then a single application of Bayes' theorem — even with a deliberately skeptical prior — does not undo the bias, because the prior was contaminated by the very evidence base one is trying to correct for, and the unselected evidence needed to rebuild it no longer exists. I have been calling this evidential hysteresis: the field's posterior lags the evidence, and re-weighting once does not catch up, because the correction and the contamination share the same source. I half-remember a result about opinions merging under enough data, which is presumably what the book is leaning on, and I suspect it has conditions that my case violates.

  So, please:

  Go through the reconstruction more or less sentence by sentence, and tell me what a working statistician or methodologist would simply accept, what they would accept as a defensible simplification for a lay reader, and what they would say is wrong or a non sequitur.

  Then tell me whether the book's conclusion — that the crisis indicts a technology rather than our practices of inquiry — survives once the weak steps are repaired, or whether it depends on them.

  Then take my hysteresis worry seriously: is it a real phenomenon that the literature recognises, is it already contained in something the book's argument handles, or is it confused? In particular, does it tell against the claim that priors wash out, and does it cut the other way as well — might a Bayesian field be worse off than a frequentist one here, on the grounds that the bias is hidden inside a prior where it is harder to inspect than a p-value?

  Finally, tell me what I should actually say to the seminar in about three minutes: what to keep from the chapter, what to reject, and where my own example does and does not carry the weight I am putting on it.

  I am not asking for references or reading suggestions. Our little group has no library access to speak of, and in any case I want the reasoning, not the authorities. If a point depends on a result I could not check without a library, tell me that rather than citing it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Retired surface science/heterogeneous catalysis professor (40 years experience).
      *   **Context:** Sitting in on a graduate philosophy of science seminar.
      *   **Role:** The "practitioner" voice (the one who actually took measurements).
      *   **Task:** Audit a reconstructed argument from a trade book about the replication crisis and Bayesianism.
      *   **Specific Concerns:**
          1.  Sentence-by-sentence audit of the reconstruction (Acceptable vs. Simplification vs. Wrong).
          2.  Evaluate the book's conclusion (Crisis indicts technology vs. practices).
          3.  Evaluate the user's "evidential hysteresis" worry (priors contaminated by biased literature).
          4.  Provide a 3-minute summary for the seminar.
      *   **Constraints:** No references/reading suggestions (no library access), focus on reasoning.

  2.  **Deconstruct the Reconstructed Argument (Sentence by Sentence Audit):**

      *   *Segment 1: "The replication crisis is, at bottom, an artifact of null hypothesis significance testing."*
          *   **Verdict:** Oversimplification/Debatable. NHST is a major contributor, but not the *only* bottom. Incentives, funding, career pressure matter too.
      *   *Segment 2: "The p-value is the probability of getting data like yours if the null hypothesis is true; what a scientist actually wants is the probability that the hypothesis is true given the data..."*
          *   **Verdict:** Correct definition of p-value. Correct description of what scientists *think* they want.
      *   *Segment 3: "...and the habit of reading the first as the second is what let whole literatures fill up with confident findings that later evaporated."*
          *   **Verdict:** Defensible simplification. This is the "transposed conditional" fallacy. It's a major driver.
      *   *Segment 4: "Publication bias then compounds the damage: journals print the significant results and shelve the null ones, so the published record is a selection-biased sample in which every reported effect is an overestimate of the truth."*
          *   **Verdict:** Accepted fact. This is the "file drawer problem."
      *   *Segment 5: "That is why careful replications, run with larger samples and without the filter, shrink the effect toward zero."*
          *   **Verdict:** Generally accepted observation (e.g., Many Labs projects), though "toward zero" is a bit strong (sometimes just smaller).
      *   *Segment 6: "The remedy is to stop asking the wrong question and become Bayesians."*
          *   **Verdict:** Controversial/Overstated. Many methodologists advocate for estimation (confidence intervals) or reforming NHST, not necessarily full Bayesianism.
      *   *Segment 7: "Bayesian inference gives you exactly what you wanted: a probability for the hypothesis, given the evidence you actually have."*
          *   **Verdict:** Technically true *within the Bayesian framework*, but depends heavily on the model and prior.
      *   *Segment 8: "Because Bayes' theorem conditions on the data observed and on nothing else, a Bayesian is free to keep collecting observations until the picture is clear and then stop..."*
          *   **Verdict:** **Technically True but Dangerous.** This is the "Likelihood Principle." While Bayesian updating doesn't *mathematically* penalize optional stopping in the same way, *practical* Bayesian analysis can still be gamed if the stopping rule influences the prior or model selection. It's not a magic bullet against p-hacking.
      *   *Segment 9: "The researcher degrees of freedom that generate p-hacking accordingly lose their leverage, and the incentive to fish disappears."*
          *   **Verdict:** **Wrong/Non Sequitur.** Researcher degrees of freedom (choosing covariates, outliers, models) still exist in Bayesian analysis. You can "Bayes-hack" by tweaking priors or models until you get the desired posterior.
      *   *Segment 10: "The one remaining objection is the prior, which is admittedly subjective."*
          *   **Verdict:** Accepted premise.
      *   *Segment 11: "But priors wash out: as the data accumulate the likelihood dominates, so investigators starting from different priors converge on the same posterior."*
          *   **Verdict:** **Defensible Simplification with Caveats.** This is the "Bernstein-von Mises theorem" intuition. It holds for well-behaved models with sufficient data. It fails in high-dimensional models or with sparse data.
      *   *Segment 12: "Subjectivity is therefore a transitory inconvenience rather than a defect..."*
          *   **Verdict:** Debatable. If the prior is contaminated (as the user suggests), it's not just transitory.
      *   *Segment 13: "Properly understood, the replication crisis is not a reason to doubt science. It is a reason to doubt a particular, and now outdated, statistical technology."*
          *   **Verdict:** **The Crux.** This is the philosophical leap. It absolves human behavior/incentives by blaming the tool.

  3.  **Evaluate the Book's Conclusion:**
      *   Does the crisis indict technology or practices?
      *   *Reasoning:* If you swap NHST for Bayes but keep the "publish or perish" incentive and the "file drawer" bias, the crisis persists. Priors get gamed. Models get tweaked. The conclusion depends on the weak step that Bayesianism removes the *incentive* to fish. It doesn't. It just changes the currency.
      *   *Verdict:* The conclusion does not survive repair. It blames the hammer for the bent nail, ignoring the carpenter swinging too hard.

  4.  **Evaluate "Evidential Hysteresis":**
      *   *Concept:* Priors are built on past posteriors. If past posteriors were biased (due to publication bias), current priors are contaminated.
      *   *Validity:* This is a real and recognized problem. It's often discussed as "informative priors based on biased literature."
      *   *Does it contradict "priors wash out"?* Yes, in the short-to-medium term. If the prior is extremely confident (tight variance) and wrong, it takes massive data to overcome it. In fields where data is expensive (like catalysis), the "wash out" might never happen practically.
      *   *Bayesian vs. Frequentist:* Is Bayesian worse? Potentially. A p-value is a raw calculation. A prior is a belief statement. If the belief is institutionalized bias, it's harder to root out because it looks like "expert knowledge." However, Bayes allows you to explicitly model the bias (e.g., selection models), whereas NHST often hides it.
      *   *Verdict:* The user's intuition is sharp. It's not confused. It highlights that *social* epistemology matters more than *mathematical* epistemology here.

  5.  **Drafting the 3-Minute Statement:**
      *   *Goal:* Be the voice of experience. Validate the math but challenge the sociology.
      *   *Key points:*
          1.  NHST is indeed misused (agree with Para 1).
          2.  Bayes is not a magic wand (challenge Para 2).
          3.  Priors are the weak link, specifically because they inherit past sins (Hysteresis).
          4.  Incentives drive behavior, not statistics.
      *   *Tone:* Respectful but firm on the practical reality.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I use references? *No.*
      *   *Check:* Did I address the "stopping rule" claim accurately? *Need to be careful.* Bayesian inference *is* immune to stopping rules in terms of validity of the posterior *given the model*, but it doesn't stop people from changing the model. I need to make sure the user understands the distinction between mathematical validity and practical robustness.
      *   *Check:* Is the "Hysteresis" term recognized? *It's not a standard textbook term like "publication bias," but the concept is well-known in meta-analysis and hierarchical modeling.* I should validate the concept without validating the specific terminology as standard jargon.
      *   *Check:* The user asked about the "opinions merging" result. *That's the Doob consistency theorem or Bernstein-von Mises.* I should mention the *condition* (true model is in the set, data is i.i.d., etc.) without citing the theorem name if possible, or just describing the conditions. *Decision: Describe the conditions.*

  7.  **Final Polish:** Ensure the distinction between "mathematical properties" and "human implementation" is clear throughout. The user's catalysis example is perfect for illustrating the "contaminated prior" problem.

  **(Self-Correction on the "Stopping Rule" point):**
  Strictly speaking, Bayesian inference *does* obey the Likelihood Principle, meaning the stopping rule doesn't change the posterior *calculation*. However, the claim that this removes the *incentive* to fish is wrong. You can still stop when the Bayes Factor looks good. The *math* handles it, the *human* doesn't. I need to make sure the user sees this distinction.

  **(Self-Correction on "Priors Wash Out"):**
  This relies on the data being informative enough. In the user's catalysis example, data is hard to get. If $N$ is small, priors *don't* wash out. This is a crucial practical point for a experimentalist to make.

  8.  **Final Structure:**
      *   Audit (Paragraph by paragraph/sentence by sentence).
      *   Conclusion Viability.
      *   Hysteresis Analysis.
      *   The 3-Minute Talk.

