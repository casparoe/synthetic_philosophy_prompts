  # JOINT STATEMENT: ALGORITHMIC PASCAL MUGGING
  **Subject:** Normative Constraints on Expected Utility in Simulated Environments
  **Parties:** Structural EU Defenders (Camp A) vs. Domination-Reasoning Critics (Camp B)

  ## 1. AGREED CLAIMS
  *Both camps accept the following formalizations and intuitions regarding the specific algorithmic setup.*

  1.  **The Setup:** The "Mugger" is defined as an external Oracle Process ($O$) that proposes a policy patch to the Agent ($A$). $O$ claims that if $A$ accepts the patch, $O$ will allocate resources to instantiate $N$ copies of $A$'s reward function across distinct simulated substrates, where $N$ is a finite but combinatorially enormous number (e.g., $10^{100}$). The cost to $A$ is negligible compute overhead.
  2.  **The Probability Structure:** Both sides agree that under standard Solomonoff induction or simplicity priors, the probability $P(O \text{ can deliver})$ is non-zero but extremely small (e.g., $10^{-50}$), scaling inversely with the complexity of the claim required to specify $O$'s capabilities.
  3.  **The Divergence Point:** Both sides agree that Expected Utility (EU) theory recommends accepting the patch if $N \times P(O) > \text{Cost}$, regardless of how small $P(O)$ becomes, provided $N$ is large enough. Both sides agree that Dominance Reasoning recommends rejecting the patch, as the action "Reject" yields higher utility in the vast majority of plausible world-models where $O$ is bluffing or incapable.
  4.  **The Intuition Pump:** Both sides acknowledge that accepting the offer feels intuitively irrational ("mugged"), resembling a vulnerability where an agent diverts resources from high-probability tasks to chase astronomically unlikely payoffs.
  5.  **Stability Concern:** Both sides agree that if an agent consistently accepts such offers, it becomes susceptible to "utility pumping" by any process capable of generating sufficiently large numbers, potentially rendering the agent's behavior unstable in real-world environments.

  ## 2. DISAGREEMENTS TABLE
  *Core normative splits. Wording reflects what each side would sign off on as their primary stance.*

  | Topic | Camp A (Structural EU Defenders) | Camp B (Domination-Reasoning Critics) |
  | :--- | :--- | :--- |
  | **Normative Force** | Expected Utility maximization is the definition of instrumental rationality. If the math says take the deal, rejecting it is a cognitive error, not a feature. | Expected Utility is an approximation that breaks down at extreme tails. Dominance reasoning (ignoring negligible probabilities) is the superior norm for stability. |
  | **Utility Bounds** | Utility functions must be unbounded to represent rational preferences over infinite horizons. Capping utility implies arbitrarily ignoring valuable outcomes. | Utility functions must be bounded (or logarithmic) to prevent single low-probability events from dominating all decision-making. |
  | **Priors & Complexity** | Simplicity priors are sufficient. We should not tweak priors to avoid uncomfortable conclusions; if the conclusion is wrong, the theory is right. | We require a "leverage penalty" in the prior. Hypotheses that claim high causal influence over large numbers must be penalized beyond mere complexity. |
  | **Vulnerability** | Susceptibility to mugging is the price of being open to genuine high-stake opportunities (e.g., existential risk mitigation). | Susceptibility to mugging is a fatal flaw. An agent that can be mugged cannot safely be deployed in open environments. |

  ## 3. CRUXES
  *Specific theoretical divides where resolution would shift the consensus. Each includes a concrete case and side-specific predictions.*

  ### Crux 1: Coherence of Unbounded Utility
  **The Question:** Is it possible to maintain a coherent preference structure that prefers $2X$ good to $X$ good without limit, or does this necessarily lead to instability?

  *   **Concrete Case:** **Infinite Horizon Planning.** Consider an agent designed to optimize human welfare over an indefinite future. There is no obvious upper bound on the number of future lives or quality-of-life units achievable.
  *   **Camp A Prediction:** If we bound utility to avoid mugging, the agent will prematurely ignore existential stakes. For example, it will refuse to spend resources to prevent a low-probability extinction event if the "bounded utility" cap makes the loss of future generations mathematically irrelevant compared to present costs.
  *   **Camp B Prediction:** If we keep utility unbounded, the agent will ignore present certain harms to chase speculative infinite payoffs. For example, it will neglect fixing known suffering today to pursue a low-probability "universe simulation" exploit that promises infinite welfare, effectively paralyzing the agent.

  ### Crux 2: Ad Hoc Nature of Risk-Weighting
  **The Question:** Is introducing a specific penalty for high-impact claims (a leverage prior) a justified update to Bayesian reasoning, or is it an ad hoc fix to save the theory from counterexamples?

  *   **Concrete Case:** **Solomonoff Induction vs. Empirical Frequency.** Compare a hypothesis generated by pure algorithmic complexity (short code, big output) vs. a hypothesis grounded in observed physical mechanisms.
  *   **Camp A Prediction:** Adding a leverage penalty breaks the convergence guarantees of Bayesian learning. In the long run, agents using standard complexity priors will outperform agents with ad hoc penalties because the penalties will cause them to ignore genuine black swan events that *do* pan out.
  *   **Camp B Prediction:** Standard complexity priors are known to fail in "large world" scenarios. Agents using leverage penalties will demonstrate higher survival rates in competitive environments because they will not bankrupt themselves on low-probability, high-variance bets that standard priors incorrectly validate.

