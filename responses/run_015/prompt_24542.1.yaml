answer: |-
  This is a classic and deeply frustrating problem in metaphysics. You are losing sleep over it because you are encountering the **Problem of Profligate Omissions**: if we treat omissions exactly like actions under a simple counterfactual theory of causation, then *everything* that didn't happen to prevent an outcome becomes a cause (e.g., the Queen of England failing to feed the starving child causes their death just as much as the parent does).

  Your candidate principle is very close to the standard "Normative Expectation" view (championed by philosophers like H.L.A. Hart, Tony Honoré, and Sarah McGrath). However, your worry about circularity is astute, and your "Pond Bystander" case reveals a gap in your current formulation. "Reasonably expected" is too vague; it doesn't distinguish between a *general moral expectation* (Pond/Charity) and a *specific causal reliance* (Physician/Operator).

  Here is a repaired principle, tested against your cases, followed by the Software Engineer test.

  ### The Principle of Specific Reliance

  An agent $A$'s omission to perform act $X$ causes outcome $E$ if and only if:

  1.  **Counterfactual Dependence:** Had $A$ performed $X$, $E$ would not have occurred (or would have been significantly less likely).
  2.  **Specific Normative Expectation:** $A$ was under a specific obligation, duty, or role-based expectation to perform $X$, distinct from the general moral obligations shared by all moral agents.
  3.  **Exclusive Reliance:** In the relevant context, $A$ was the designated or uniquely reliable source of prevention, such that the prevention of $E$ was functionally assigned to $A$ rather than being a diffuse responsibility shared by a crowd.

  ---

  ### Testing the Principle Against Your Cases

  Here is how the principle processes your verdicts. I have highlighted where it forces a decision you might find uncomfortable.

  | Case | (1) Counterfactual | (2) Specific Duty | (3) Exclusive Reliance | **Verdict** | **Matches Your Intuition?** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Physician** | Yes (Antidote saves) | Yes (Professional duty) | Yes (Only one authorized/present) | **Cause** | **Yes** |
  | **Plant Operator** | Yes (Check prevents) | Yes (Job requirement) | Yes (Assigned task) | **Cause** | **Yes** |
  | **Pond Bystander** | Yes (Jumping saves) | **No** (General moral duty only) | **No** (4 others could act) | **Not Cause** | **Yes** |
  | **Signal Box** | Yes (Button saves) | Yes (Job requirement) | Yes (Only one with access) | **Cause** | **Forces "Yes"** |
  | **Cart (Brake Works)** | **No** (Cart stops anyway) | Yes (Duty exists) | Yes (Designated) | **Not Cause** | **Yes** |
  | **Cart (Brake Fails)** | Yes (Lever prevents) | Yes (Duty exists) | Yes (Last line of defense) | **Cause** | **Yes** |
  | **Charity Donor** | Yes (Money saves) | **No** (General beneficence) | **No** (Millions could donate) | **Not Cause** | **Yes** |

  ### The Cost of Consistency: The Signal Box Case

  You mentioned you were "genuinely torn" on the Signal Box case. This principle forces you to say **Yes, the omission caused the death.**

  **Why you must accept this:**
  Your hesitation likely stems from a moral distinction between *killing* (action) and *letting die* (omission), or perhaps the "trolley problem" intuition that diverting the train is an active intervention. However, look at your **Physician** verdict. You are confident the physician caused the death. Structurally, the Signal Box operator is identical to the Physician:
  *   Both have a specific professional role.
  *   Both have the exclusive physical means to prevent death.
  *   Both involve a "switch" (antidote vs. button).

  If you say the Physician causes the death but the Signal Operator does not, you are relying on a moral disapproval of the *outcome* (5 deaths vs 1 death) rather than the causal structure of the omission. To maintain a clean causal theory, you must align these two. The "torn" feeling is moral guilt, not causal ambiguity.

  ### Addressing Your Circularity Worry

  You worried that clause (2) smuggles morality into causation, making the account circular.
  **The Fix:** Acknowledge that this is not a bug, but a feature.

  Most contemporary metaphysicians of causation (e.g., Schaffer, McGrath) agree that **causation by omission is inherently normative.** Unlike positive causation (the rock broke the window), which is a physical relation, omission causation is a relation between an event and a *deviation from a model of how the world ought to be.*

  *   **Physical Causation:** Descriptive (What happened?)
  *   **Omissive Causation:** Contrastive/Normative (What *should* have happened but didn't?)

  By explicitly including Clause (2), you aren't being circular; you are admitting that "cause" in the context of omissions is a *hybrid* concept. It tracks physical dependence *filtered through* social/role-based expectations. This saves you from the "Queen of England" problem (she has no specific duty to *that* child) without denying the Physician case.

  ### The Software Engineer Test

  Now, let's apply the **Principle of Specific Reliance** to your new case.

  **The Case:** A software engineer knows her code has a bug that creates a small probability of fatal malfunction. She decides not to fix it. The malfunction occurs; someone dies.

  **Application:**
  1.  **Counterfactual Dependence:** Yes. Had she fixed the bug, the specific chain of code execution leading to the crash would not have occurred, and the death would have been prevented. (Even if the probability was small, in the actual world where the risk materialized, the fix would have prevented it).
  2.  **Specific Normative Expectation:** Yes. Unlike the Charity Donor, a software engineer working on safety-critical systems (autonomous vehicles) has a *professional* and often *legal* duty of care. This is distinct from general moral beneficence.
  3.  **Exclusive Reliance:** Yes. While others *could* theoretically find the bug, she *knows* it. The reliance of the public on the vehicle is placed specifically on the engineering team to patch known vulnerabilities.

  **Verdict:** **Her omission caused the death.**

  **Is this over-generating?**
  No. This verdict is intuitively correct and aligns with legal standards of negligence and product liability. If we said she did *not* cause the death, we would have to say the death was an "accident" or "act of God," which undermines the concept of professional responsibility.

  **Distinction from Charity:**
  Why is this different from the Charity Donor?
  *   **Charity:** You have no specific role relative to the starving person. You are one of billions.
  *   **Engineer:** You have a specific role relative to the car's passengers. You are one of a handful of engineers responsible for *that* code. The "Exclusive Reliance" clause is satisfied because the safety of the system was functionally assigned to her team, and specifically to her knowledge.

  ### Summary of Recommendations

  1.  **Adopt the Principle of Specific Reliance.** It captures the distinction between "failures of duty" (Physician) and "failures of beneficence" (Charity/Pond).
  2.  **Accept the Signal Box Verdict.** Align it with the Physician case. Your hesitation is moral, not causal.
  3.  **Embrace the Normativity.** Stop worrying about the circularity. Omission causation *requires* a normative baseline to distinguish causes from background conditions.
  4.  **Confirm the Engineer Verdict.** It is a cause. This is a feature of the theory, as it matches our legal and moral practices regarding negligence.

  This framework should allow you to sleep better: you have a consistent rule that handles the overdetermination (Cart), the diffusion of responsibility (Pond), and the scope of duty (Charity vs. Physician), even if it demands you tighten your intuition on the Signal Box.
