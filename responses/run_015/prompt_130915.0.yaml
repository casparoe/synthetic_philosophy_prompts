answer: |-
  This building smells like fiberglass and old guano, which is exactly how it should smell. If you're going to name a lab after Rafe Halloran, it shouldn't smell like lemon polish. It should smell like the work.

  I stood out on the point this morning watching the hired skiff come in through the fog, and I kept expecting to see Rafe's orange oilskins. He ran the puffin census here for forty-one years. Forty-one years. He didn't skip a season for weather, for injury, or for holidays. He weighed every chick he could get a hand on. He banded every parent. He wrote it all down in books that are now sitting on the shelves behind me, ink fading but data solid.

  I want you to understand what that discipline bought us. In science, you often hear about breakthroughs made by genius insights. But most of the time, breakthroughs are bought by boring, relentless measurement. Rafe bought this truth with forty-one years of mornings.

  Here is the truth he helped us find. We have two colonies. The Nubble, in the cold water with good fish, where chicks fledge at 340 grams. And Outer Double Head, in the warm, poor water, where they fledge at 260 grams. That's an 80-gram difference. That's the difference between a chick surviving its first winter or starving.

  Rafe believed that difference was in the blood. He thought the Outer Double Head birds were genetically smaller, locally adapted to make do with less. He wanted to translocate chicks from the Nubble to Outer Double Head to "improve the stock." It was a generous impulse. He wanted the birds to win.

  I thought the difference was the breakfast. I thought the water was the limit.

  The season Rafe died, we finally tested it. We swapped the eggs. We took eggs from Outer Double Head parents and put them in nests at the Nubble. We took Nubble eggs and put them at Outer Double Head. We let the foster parents do the work.

  When those chicks fledged, the Nubble eggs raised at Outer Double Head came off at 265 grams. The Outer Double Head eggs raised at the Nubble fledged at 335 grams. The gap followed the water, not the genes.

  I know Kevin has been telling folks around town that his father's work has been vindicated. Kevin is right that the work holds up. Without Rafe's numbers, we wouldn't have known what to test. But I need to be clear about what the numbers say, because lives depend on it. If we move birds to Outer Double Head hoping for Nubble sizes, we will fail. The water won't support them. We cannot breed our way out of an ocean problem.

  Now, I know there are grad students in the back waiting for me to say genetics doesn't matter. I'm not saying that. Within each colony, Rafe measured a heritability of 0.6. In plain English, that means big parents tended to have big chicks. That number is real. It is robust. It is Rafe's number. Genetics matters deeply to who survives within a colony.

  But here is the thing I've learned since I retired and started reading philosophy books instead of fish journals: a number is not a thing. It is a relationship.

  Rafe used to have a slogan: "If it's heritable, it isn't fixable." He meant that if a trait is genetic, you can't change it by changing the environment. But look at what happened at Outer Double Head over the last decade. As the water warmed and the forage fish went chaotic, the food became unpredictable. Some chicks got fed, some didn't, regardless of their parents. The heritability estimate slid from 0.6 down to 0.1.

  The genes didn't change in ten years. The chicks didn't become a different species. But the number changed because the context changed. Heritability isn't a property of the trait, like wing length or bill depth. It's a property of the population in its environment. When the environment gets noisy, the signal of the genes gets quiet.

  So, about that slogan. "If it's heritable, it isn't fixable." We found that the difference between the colonies isn't heritable at all. It's the food. And the food is fixable, if we fix the ocean. But even if it were genetic, Rafe's slogan gives us too little credit. We manage fisheries around genetic limits every day. We don't throw up our hands. We adapt.

  Rafe wanted to improve the stock. I think he was right about the goal, just wrong about the lever. We don't fix the birds. We fix the water.

  This lab is dedicated to him because it is a tool for measuring. Not for proving we were right, but for finding out where we were wrong. Rafe never feared being wrong; he feared being vague. He taught us that if you measure enough, long enough, the world will eventually tell you its secrets.

  Mary, Kevin, to the selectmen and the summer folks and the scientists: this building is not a monument to a conclusion. It's a monument to the question. It's a place to keep weighing the chicks, keep banding the parents, and keep watching the water.

  Rafe's data let us ask the question. His rigor let us trust the answer. And his legacy is that we don't stop measuring just because we think we know the story. The story changes. The water warms. The numbers slide.

  So let's keep the scales calibrated. Let's keep the books dry. And let's make sure the next forty-one years of data are as honest as the last forty-one. That's how we honor him. Not by pretending he was infallible, but by trusting the work enough to let it correct us.

  Thank you.
