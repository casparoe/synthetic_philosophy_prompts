      *   *Drafting the distinction:* Use the concept of "Meta-rules." Feedback loops obey meta-rules; tangled hierarchies question them.
      *   *Drafting the Inviolate Level:* Use the concept of "Interpretive Frame." The frame can be internal *if* it is causally decoupled from the loop it interprets.
      *   *Escher:* The hands are tangled; the paper is inviolate. If the hands drew the paper, the paper would tear (system crash).
      *   *Institutional Analogy:* A Constitution (inviolate) vs. Statutes (tangled/looping). If the Constitution can be amended by simple Statutes, the hierarchy collapses.

  6.  **Self-Correction/Nuance Check:**

