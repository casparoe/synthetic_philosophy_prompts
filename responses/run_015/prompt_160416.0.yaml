  **Note on Physics and Form**

  I am reasonably confident that the poem captures the thermodynamic metaphor without violating the core intuition of Landauer's Principle, though it necessarily poeticizes the mechanism. The physics consensus (following Bennett and Landauer) is that measurement and sorting can be reversible (costing no energy), but *erasure*—resetting the demon's memory to complete the cycle—dissipates a minimum amount of heat ($kT \ln 2$). The poem's body focuses on the burden of *keeping* (hoarding memory), which aligns with your novel's theme of the archive as a warehouse. However, the envoy ("To clear the card requires waste heat") explicitly links the cost to *erasure*. This is physically accurate regarding the demon's paradox, but it creates a slight tension with Mira's realization that the *current* heating bill is the price. The poem bridges this by suggesting the bill is the accumulated debt of that inevitable erasure, or that maintaining the low-entropy state (the ordered archive) against equilibrium inherently leaks heat. The line I am least sure about is "All labor turns to invisible heat" (Stanza 4, Line 3); while thermodynamically sound (work degrades to heat), it risks sounding like generic friction rather than the specific informational cost of memory reset. The poem leans on the contested reading that information *itself* has physical weight/heat, rather than strictly that the *deletion* of information costs heat, but this conflation serves the emotional truth of the scene.

