answer: |-
  Thirty-one years I learned to sort,
  convinced that logic banished heat,
  that every index on a card
  stabilized the air inside this room.
  My principle was always keep,
  and never let the living pay.

  No invoice came to make us pay,
  for the labor required to sort.
  We thought preservation meant to keep
  the past insulated from the heat,
  packed tight within the static room,
  every fact secured on card.

  The paper swells, each heavy card,
  a debt we postpone to pay.
  There is no exit from this room
  while I continue to sort.
  Friction rises into heat,
  but I swore that I would keep.

  What is the cost to keep?
  A box for every single card.
  All labor turns to invisible heat.
  Sooner or later something must pay.
  I cannot infinitely sort
  without consuming all the room.

  The walls define the limits of the room.
  To hold is not the same as keep.
  The hand moves forward to sort,
  but the ink weighs down the card.
  The system demands we pay
  in payments made of heat.

  The building radiates heat.
  The structure settles in the room.
  I understand now what we pay:
  not for the things we keep,
  but for the stack of every card
  I refused to stop and sort.

  To clear the card requires waste heat,
  to leave the room is to stop the sort,
  and nothing we keep escapes the pay.

