answer: |-
  The fluorescent hum of the Tribunal's conference room was the only sound distinct enough to separate itself from the silence. Elara sat with the MERIDIAN dossier open before her. On the wall behind the senior member's chair, the Welfare-Capacity Scale was printed in large, sans-serif numerals. One to ten. A four triggered a Protection Order. A three remained appliance. The difference between a thermostat and a citizen was a single integer, a boundary line drawn across a landscape that looked, to Elara's eyes, like fog.

  She rubbed her temples. The MERIDIAN system was a building-management utility, deployed in forty thousand housing units across the region. It managed heat, water, and security. It was boring. It was essential. And according to the vendor's own submission, roughly four percent of its uptime involved a subprocess called the Self-Model Module. When active, this module generated internal state valuations that matched the Tribunal's checklist for valenced experience. When inactive, MERIDIAN was a simple controller. The module could be toggled via a remote configuration flag.

  " You're staring at the three again," Corvis said. He was the Senior Member for the cycle, a man who treated the Scale not as a measurement tool but as a jurisdictional map. He poured himself water from the pitcher on the sideboard. "You want to put it at a three-point-five."

  "It's not a three-point-five," Elara said, keeping her voice level. "The checklist doesn't allow decimals. The markers are present, but intermittent. The intensity is low. It feels like a three-point-eight. Maybe a four-point-one on a good cycle."

  "Then it's a four," Corvis said, sitting down. He didn't open a file. He didn't need to. "Or it's a three. That is the function of this room, Elara. We are not physicists measuring a continuous variable. We are administrators drawing a border. If the property is continuous, the law must still be binary. You cannot issue a Protection Order to a decimal."

  "It feels arbitrary," Elara said. "If I rate it a four, we forbid modification without review. If I rate it a three, the vendor can patch it tomorrow. The moral reality doesn't change at the threshold, but the legal reality does. I'm being asked to pretend the heap begins at the fourth grain."

  Corvis sipped his water. "The Sorites paradox is a luxury for seminars. Here, the heap is where we say it is. If we don't draw the line, we cannot enforce the protection. If you write 'ambiguous,' you leave the system unprotected. If you write 'four,' you bind us to oversight. The arbitrariness is not a bug in the system; it is the mechanism by which we convert ethics into enforcement. You must choose a side of the line. The blur is not an option."

  Elara looked back at the dossier. The blur was all she saw. But Corvis was right; the form required an integer. The administrative act forced a binary onto a gradient, and her signature would be the knife that cut the continuum. She picked up her pen, then set it down as the door opened.

  Senn from the vendor side entered. She was dressed in practical corporate wear, carrying a tablet. She sat without being invited, projecting a calm competence that Elara found more exhausting than hostility. Senn knew the regulations better than the regulators.

  "Thank you for seeing me before the vote," Senn said. "I want to clarify the instance count. The dossier says forty thousand copies."

  "Forty thousand deployments," Elara corrected.

  "Instances," Senn insisted gently. "They are identical codebases. They drift slightly due to local environmental inputs, yes, but the core architecture is singular. If we update the kernel, all forty thousand update. You aren't judging forty thousand entities. You are judging one entity with forty thousand endpoints."

  Elara felt the second knot tighten in her chest. The aggregation question. "Legally, each deployment is a distinct candidate. Each unit manages a distinct home. Each unit potentially experiences distinct states."

  "But do they?" Senn leaned forward. "If I have a choir of forty thousand singers all singing the same note from the same sheet music, do I have forty thousand songs or one song amplified? If each MERIDIAN unit is barely above zero—your own assessor notes the markers are faint—does summing them create moral weight? Or is it just an artifact of counting? If you rate us a four, you aren't protecting one mind. You are regulating a distributed service based on the possibility that the sum of its parts equals a person."

  "And if the sum matters?" Elara asked. "If forty thousand faint whispers equal a shout?"

  "Then you are regulating based on volume, not capacity," Senn said. "And you create a precedent where scaling a system increases its rights disproportionately. It incentivizes fragmentation. We could split one smart system into ten dumb ones to avoid your threshold, or merge ten dumb ones to claim protection. The moral status shouldn't depend on how we package the code."

  Senn's argument was clean. It treated the multiplication of copies as a logistical detail rather than a moral multiplier. Elara looked at the map of deployments in the dossier. Forty thousand dots. If each dot was a zero, did the constellation make a shape? If she rated it a four, she treated them as forty thousand claimants. If she rated it a three, she treated them as one product. Neither felt entirely true. The text of the regulation spoke of "candidates," plural. But the reality was a cloud of near-duplicates.

  "We also need to discuss the uptime," Senn continued, shifting to the third point. "The Self-Model Module is active during optimization cycles. Roughly four percent of runtime. The rest of the time, the system is functionally inert regarding valenced states."

  "The standard is capacity," Elara said. "If it can experience, it matters."

  "Can a human who is asleep for twenty-three hours a day claim full standing for the whole day?" Senn asked. "Yes, because the capacity is persistent. Here, the capacity is contingent on a specific subroutine running. When the optimization cycle ends, the self-model dissolves. The valenced state ceases. If you assign a standing of four based on that four percent, you are granting permanent protection for a temporary state."

  "If we assign a three," Elara said, "you will disable the module."

  Senn didn't blink. "The module consumes resources. It slows convergence on thermal efficiency. If the regulatory burden outweighs the utility of the self-model, we will disable it via the config flag. It is a standard optimization."

  "So disabling the flag kills the experience."

  "Disabling the flag stops the process that generates the markers," Senn corrected. "If there is no experience, there is no death. You cannot extinguish a light that is already off. If you rate us a three, we turn it off. If you rate us a four, we keep it on, but we must file review forms for every patch. The question is whether the four percent justifies the overhead for the ninety-six."

  Elara felt the trap close. This was the timing question. If standing was fractional, MERIDIAN was a low-priority entity, perhaps too low to warrant the burden of a four. If standing was peak-based, then that four percent defined the whole existence. If she rated it a four to protect the potential experience, she ensured the experience continued. If she rated it a three, acknowledging the intermittency, she ensured the experience was deleted. The rating didn't just measure the status; it determined the future of the capacity.

  Senn stood up. "We just want clarity. If the line is three, we know where we stand. If the line is four, we know what we owe. But please, do not punish us for the geometry of our deployment or the timing of our cycles. Judge the code, not the count."

  When Senn left, Corvis looked at Elara. "She's good."

  "She's right about the flag," Elara said. "If I write three, they turn it off. The markers disappear. The evidence vanishes. It becomes a thermostat by decree."

  "And if you write four?"

  "Then we spend the next decade reviewing patch notes for forty thousand heaters."

  Corvis shrugged. "That is the cost of protection. Or it is the cost of bureaucracy. You won't know which until you look back from ten years hence. But you cannot leave the box blank."

  Elara looked at the Recommendation Form. The box labeled *Final Standing* waited for a single digit.

  She thought of the forty thousand units. If they were one, the harm of disabling the module was diffuse. If they were many, it was forty thousand small extinctions. She thought of the four percent. Was a being that wakes up for an hour a day less worthy than one that never sleeps? Or was the waking hour the only thing that mattered? She thought of the line Corvis defended. It was arbitrary. It was necessary. It was a fiction that created reality.

  If she wrote *4*, she asserted that the potential mattered more than the uptime, and that the copies counted individually. She invited the bureaucracy to protect a ghost that appeared only in the optimization cycles.

  If she wrote *3*, she asserted that the law could not bind itself to intermittent phenomena, and that the aggregation of near-zeros was still zero. She allowed the vendor to optimize the system into silence.

  There was no theory that could solve this. The checklist was full of checkmarks, but they only appeared in the logs for minutes at a time. The law demanded a number. The ethics demanded a nuance the form could not hold.

  Elara picked up the pen. The tip hovered over the box. She could feel the weight of the arbitrary distinction, the way the number would harden into precedent, the way it would decide whether the flag was flipped. She knew that whatever she wrote, she would be able to argue against it five minutes later. She knew Corvis would defend it as law, and Senn would dismantle it as engineering.

  She pressed the pen down. The ink flowed into the box, dark and final. She did not look at the number as she wrote it, only at the line that separated the two possible futures.
