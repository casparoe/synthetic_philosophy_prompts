          *   **(4) & (1):** (4) allows killing innocent threats. (1) protects civilians regardless of culpability (which implies even if they are innocent threats?). If a civilian is an innocent threat (e.g., unknowingly driving a bomb), (4) says permissible, (1) says prohibited.

      *   *Identifying the "Cheapest" Revision:*
          *   Revising (3) (Soldier Culpability): Moves back to Walzer. Solves (2)/(3) tension. But conflicts with modern moral intuition about agency.
          *   Revising (2) (MEC): Moves to Revisionism (McMahan). Solves (2)/(3)/(5) triangle. But loses the "legalist" symmetry of war.
          *   Revising (5) (Reductivism): Moves to Conventionalism. Allows (2) to stand despite (3). Allows (1) to stand. *This seems to be the linchpin.* If (5) is dropped, war has its own logic. That logic can grant parity (2) despite responsibility (3), and protect civilians (1) despite threat (4).
          *   Revising (1): Hard. Core of JWT.
          *   Revising (4): Hard. Core of self-defense theory.

      *   *Wait, let's look closer at (5).* (5) says permissions are grounded in the *same considerations*... *rather than in a special deontic constraint*.
      *   (1) says the prohibition on targeting civilians *is* a deontic constraint... *not grounded in desert*.
      *   (1) and (5) are directly contradictory regarding the *source* of norms. (1) says "Special War Rule." (5) says "No Special War Rule."
      *   If I keep (5), I must reject (1)'s grounding. I must argue civilians are immune because they aren't threats (which (4) complicates) or because of interests. But (1) explicitly says "regardless of culpability... not grounded in desert."
      *   Actually, the biggest clash is the **MEC Triangle: (2), (3), (5).**
          *   (3) Unjust soldiers are responsible.
          *   (5) War norms = Self-defense norms.
          *   Self-defense norms say: Responsible aggressors cannot kill just defenders.
          *   Therefore: Unjust soldiers cannot kill just defenders.
          *   Contradiction with (2): Unjust soldiers *can* kill just defenders (Parity).
      *   So one of (2), (3), or (5) must go.
      *   Which also helps with (1)?
          *   (1) asserts a "special deontic constraint" for civilians.
          *   (5) denies "special deontic constraint" for war generally.
          *   So (1) and (5) are also in tension.
      *   If I drop (5), I save (1), (2), and (3).
          *   If war has special rules (not just self-defense), then:
              *   We can have Parity (2) even if soldiers are responsible (3) (because the special rule grants them combatant privilege).
