      *   *Tension 4: The Innocent Threat (1) vs (4).* If a civilian is an innocent threat (e.g., conscripted laborer, or unknowing transport), (4) says they can be killed. (1) says they cannot be targeted *regardless* of culpability (which covers innocence).

      *   *Resolution:* Commitment (5) is the "keystone" holding the contradictions together. It forces the moral logic of individual self-defense onto the collective, status-based logic of war.
      *   *Cost of revising (5):* You lose "Reductive Individualism." You must accept that war has a sui generis moral structure (Conventionalism or a distinct War Ethics). This allows you to keep Parity (2) as a pragmatic/legal norm despite Moral Responsibility (3). It allows you to keep Civilian Immunity (1) as a status norm despite Threat Liability (4).
      *   *Alternative:* Revise (2). Accept Revisionism (McMahan). Unjust combatants are liable. But then you clash with (1) if you try to keep the "special constraint" language, and you clash with the legal reality of war.
      *   *Alternative:* Revise (3). Say soldiers aren't responsible. (Walzer). But the user seems committed to (3) ("strong jus ad bellum").
