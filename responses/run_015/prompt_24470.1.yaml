      *   Therefore, **(5) is the source of the inconsistency.**

  6.  **Refining the Argument:**

      *   *Tension 1: The Responsibility Paradox (2) vs (3).* If soldiers are morally responsible for aggression, how can they have an equal right to kill? (Standard Revisionist critique).
