  You are a professional philosopher working in philosophical methodology, modal epistemology, and the psychology of reasoning. Take this seriously and take your time: before you write anything organized, do a short scratchpad pass in which you list every candidate defeater you can think of, including ones you will later throw out, and mark why you threw them out. Do not use it depends as a stopping point; where something depends on a further question, say what it depends on and how the answer changes on each branch. Do not spend words on who defended what, on schools, or on citations; I want the arguments, not the map of the literature.

  Here is the position I hold, stated tightly enough that you can attack the seams. Call it Reconstructionism, about the class of philosophical devices usually called intuition pumps.

  Thesis: a thought experiment carries evidential weight for a thinker exactly to the extent that it can be reconstructed, for that thinker, as an argument whose premises she already accepts or would accept on due reflection, and whose conclusion she can see to follow. The narrative machinery — the characters, the order of disclosure, the sensory concreteness, the emotional charge, the metaphor — does no epistemic work at all. It does three other things: it speeds retrieval of a modal or classificatory judgment the thinker was already disposed to make; it fixes attention on a feature she would otherwise have overlooked; and, very often, it smuggles in a premise she would reject if it were stated flatly. Those are psychological and rhetorical functions, and their size is unrelated to their epistemic value.

  I commit myself to four separable claims:

  (E) Extractability. For any pump that has genuinely moved anyone, there is an argument that does the same work, and the pump is epistemically idle relative to it. There is no such thing as residual force that belongs to the story and not to the argument.

  (N) Narrative neutrality. If framing a case one way rather than another changes verdicts, and the change is not traceable to a difference in the propositions being evaluated, the extra verdict-shifting power is noise, not evidence. Order effects, helping-versus-harming asymmetries in attributions of intentionality, and the vividness of incidental detail are all in this category.

  (I) Invariance (an empirical prediction). Present the extracted argument alone, cold, to subjects who have never encountered the story, and the distribution of verdicts will match the distribution you get from presenting the story, controlling for comprehension. My view predicts invariance and its rivals — views on which imagination or simulation is itself a source of modal knowledge — predict a residual story advantage.

  (P) The privilege clause. The premises in the reconstruction need not be ones the thinker accepts today; they may be ones she would accept on reflection, where reflection is not allowed to include re-running the pump.

  Now tell me what would count against this. Be adversarial on my behalf; I would rather have five defeaters I actually have to answer than fifteen I can wave off. Specifically:

  1. Rank the defeaters from fatal to merely awkward, and for each say whether a committed Reconstructionist should concede it as counting against the view, or dismiss it as resting on a confusion. I am especially interested in the ones my own side would concede, not only the ones my critics would press.

  2. Three kinds of case worry me and I want to know which of them is a genuine cost. First, argument-silent pumps: cases that work by making you fail to imagine something, where the failure is the evidence and no proposition is delivered for reconstruction to get a grip on. Second, therapeutic pumps: cases whose function is not to teach you that such-and-such is possible or that a concept applies, but to reveal that your concept has no determinate application here, so that the right response is to stop asking. Third, calibration pumps: cases that teach you something about the shape of your own thresholds and dispositions rather than about the target domain, and that seem to do it in a way no explicit argument about your dispositions could. Which of these can Reconstructionism describe, which can it only redescribe, and which does it have to declare bad pumps?

  3. The privilege clause is where I expect to be accused of cheating. If reflection may include whatever it takes, and if failure to get invariance can always be blamed on the argument-only group not having accepted the premises yet, then (I) looks unfalsifiable and (E) looks vacuous, since almost any story can be given some reconstruction. Say what constraints on reconstruction and on reflection would restore content to the view, whether those constraints are themselves defensible, and whether a methodological thesis of this kind is even the sort of thing that is supposed to be falsifiable. If the answer is that it is not, tell me what the right standard of assessment is instead and whether I meet it.

  4. Say where the view collapses into a rival. If I help myself to premises of the form I cannot imagine that, am I not just doing modal epistemology with imagination as a source, which is what I claimed to be deflating? If I allow that a narrative can be a way of conducting a search over a space of cases, have I conceded to a simulation view? Name the precise point at which Reconstructionism stops being a distinct position.

  5. What does the view predict that its rivals do not, and which of those predictions are ones I should actually be able to check without doing empirical work? Include the case where a community accepts a conclusion only after hearing the story and does not accept it from the extracted argument, and the lag does not close with training or with expertise: is that evidence against me, or merely a fact about persuasion?

  6. A warning about a move I do not want: do not count something as a defeater merely because it exploits an equivocation between intuition as a judgment and intuition as a phenomenology. Flag it if I am the one doing the equivocating, and separately flag it if the equivocation is doing hidden work in the case for my view.

  7. Finally, what I would personally find most persuasive: a pump whose extracted argument I fully accept and whose conclusion I still reject, or vice versa, where the gap is not explainable as inattention, as a framing effect I would repudiate, or as my not having accepted a premise yet. Say whether such a case is even coherent given my commitments, whether I would be entitled to explain it away, and where I should look for one.

  Organize the defeaters as a ranked table with a verdict column — conceded, dismissible, or fatal — followed by prose on the three or four that matter most. Keep the prose on each tight; no summaries of positions I already hold. Finish with a one-sentence statement of how exposed you take the view to be, on a line beginning Verdict:, and then a final machine-readable line of exactly this form, with the label chosen from FATAL, SERIOUS, CONTAINED, or INSULATED:

  \answer{LABEL}
