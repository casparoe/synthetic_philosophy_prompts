  # The Anthropic Diagnostic Tree

  **Instructions:** Answer each question based on your intuitive verdict for the described case. Do not worry about technical labels; follow the branch that matches your judgment.

  ### Node 1: The Standard Incubator
  A fair coin is flipped. **Heads:** One observer is created in Room 1. **Tails:** Two observers are created, one in Room 1 and one in Room 2. You wake up in Room 1. What is your credence that the coin landed Heads?
  *   **A.** 1/2 (Existence is not evidence). $\rightarrow$ Go to **Node 2**.
  *   **B.** 1/3 (Existence favors the world with more observers). $\rightarrow$ Go to **Node 6**.
  *   **C.** 1/2 Credence, but I would bet as if it were 1/3. $\rightarrow$ Go to **Node 9**.

  ### Node 2: Sleeping Beauty
  A fair coin is flipped. **Heads:** You are woken once (Monday). **Tails:** You are woken twice (Monday and Tuesday), with memory wiped between awakenings. You wake up. What is your credence that the coin landed Heads?
  *   **A.** 1/2. $\rightarrow$ Go to **Node 3**.
  *   **B.** 1/3. $\rightarrow$ **Leaf: Observer-moment SSA**.

  ### Node 3: The Sealed Incubator (SSA Branch)
  Same as Node 1, but if **Tails**, the second observer is in a causally sealed region you are reliably told you are *not* in. Does the presence of this sealed observer shift your credence in Heads away from 1/2?
  *   **A.** No. $\rightarrow$ Go to **Node 4**.
  *   **B.** Yes. $\rightarrow$ **Leaf: Undefended Position A**.

  ### Node 4: The Shuffled Incubator
  A fair coin is flipped. **Heads:** One observer created (Serial #1). **Tails:** One observer created (Serial #2). You learn you are Serial #1. Does this shift your credence in Heads away from 1/2?
  *   **A.** Yes (It confirms Heads). $\rightarrow$ Go to **Node 5**.
  *   **B.** No (Indexical facts aren't evidence). $\rightarrow$ **Leaf: No-New-Evidence Bayesianism**.

  ### Node 5: The Doomsday Argument
  Assuming you are a random sample of all humans who will ever live, does knowing your relatively early birth rank increase the probability that humanity will end soon?
  *   **A.** Yes. $\rightarrow$ **Leaf: Person-Based SSA**.
  *   **B.** No. $\rightarrow$ **Leaf: Undefended Position B**.

  ### Node 6: The Presumptuous Philosopher
  Theory A predicts $10^{12}$ observers. Theory B predicts $10^{24}$ observers. You exist. Does the mere fact of your existence favor Theory B?
  *   **A.** Yes. $\rightarrow$ Go to **Node 7**.
  *   **B.** No. $\rightarrow$ **Leaf: Undefended Position C**.

  ### Node 7: The Sealed Incubator (SIA Branch)
  Same as Node 3. **Tails** adds a trillion observers in a sealed region you are *not* in. Does their existence favor Tails?
  *   **A.** No. $\rightarrow$ Go to **Node 8**.
  *   **B.** Yes. $\rightarrow$ **Leaf: Undefended Position D**.

  ### Node 8: The Doomsday Argument (SIA Branch)
  Does knowing your birth rank increase the probability that humanity will end soon?
  *   **A.** No (SIA cancels the effect). $\rightarrow$ **Leaf: Self-Indication (SIA)**.
  *   **B.** Yes. $\rightarrow$ **Leaf: Undefended Position E**.

  ### Node 9: Betting Coherence
  If offered this bet repeatedly, would you align your stated credence with your betting odds to avoid cognitive dissonance?
  *   **A.** Yes (I would update my credence to 1/3). $\rightarrow$ **Leaf: Undefended Position F**.
  *   **B.** No (I maintain the split). $\rightarrow$ **Leaf: Pragmatist / Action-Not-Belief**.

  ***

  ## The Leaves: Positions & Awkward Commitments

  1.  **Observer-moment SSA:** *Commits to treating temporal parts of a life as distinct observers, implying you are less likely to be a long-lived person than a short-lived one.*
  2.  **No-New-Evidence Bayesianism:** *Commits to ignoring specific information about your identity (like serial numbers) when evaluating physical theories.*
  3.  **Person-Based SSA:** *Commits to expecting humanity to end sooner than demographics suggest (the Doomsday Argument).*
  4.  **Self-Indication (SIA):** *Commits to believing in vast unseen populations on purely anthropic grounds (the Presumptuous Philosopher).*
  5.  **Pragmatist / Action-Not-Belief:** *Commits to a schism between your stated beliefs and the bets you are rationally compelled to take.*

  ***

  ## Scoring Key & Logical Warnings

  ### Undefended Positions (Logical Space vs. Reality)
  The following combinations are logically possible but effectively undefended in the literature due to internal inconsistency:
  *   **Undefended A (Node 3B):** *SSA + Sealed Update.* SSA samples from a reference class. If you are reliably told you are not the sealed observers, they are not in your reference class; updating implies a "Total Observer Count" view incompatible with SSA.
  *   **Undefended B (Node 5B):** *SSA + No Doomsday.* If you accept indexical evidence in the Shuffled Incubator (Node 4A) but reject it for birth rank in Doomsday, your treatment of indexical evidence is inconsistent.
  *   **Undefended C (Node 6B):** *SIA + No Presumptuousness.* If you update on existence in the Standard Incubator (Node 1B), consistency requires updating on universe size in the Presumptuous Philosopher case.
  *   **Undefended D (Node 7B):** *SIA + Sealed Update.* SIA weights worlds by the probability *you* exist. If the extra observers are sealed and not you, they do not raise the probability of your existence.
  *   **Undefended E (Node 8B):** *SIA + Doomsday.* SIA's weighting by observer count mathematically cancels the Doomsday effect; accepting both is contradictory.
  *   **Undefended F (Node 9A):** *Betting + Credence Update.* If you align credence with betting odds, you have collapsed into either SIA or SSA; maintaining the "Action-Not-Belief" label requires maintaining the split.

  ### Inseparable Leaves
  This tree cannot distinguish between the following pairs, as they yield identical verdicts on these specific cases:
  1.  **Self-Indication (SIA) vs. Full Non-Indexical Conditioning (FNC):** Both views produce the same probabilities in the Incubator, Presumptuous Philosopher, and Doomsday cases provided. Separation requires cases involving duplicate observers with identical evidence.
  2.  **Person-Based SSA vs. Reference Class SSA (Human-only):** On these cases, defining the reference class as "observers" or "humans" yields the same result. Separation requires cases involving non-human observers or AI.
