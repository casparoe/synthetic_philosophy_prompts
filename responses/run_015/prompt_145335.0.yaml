      *   **Addressing the "Reflex" Charge:** The user asks if the veto is just a reflex. Libet would argue that a reflex is automatic. A veto requires a conscious intervention. Even if the *signal* to stop comes from an instruction, the *execution* of the stop against the motor momentum is the conscious act.
