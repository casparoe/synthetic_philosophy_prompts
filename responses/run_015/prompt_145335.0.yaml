      *   **Setup:** BCI detects RP -> Subject told to stop -> Subject stops -> Subject reports no conscious urge to move.
      *   **Implication:** The brain started it (unconscious). The conscious mind stopped it. But the conscious mind didn't feel like it *wanted* to move first.
      *   **The User's Question:** If the conscious mind didn't initiate the urge, is the "stop" command just another reflex triggered by the BCI instruction? Is the veto truly free, or just another predetermined step?
