      *   *Core Definition:* A convention is a regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem.
          5.  **Crucial Condition:** Everyone prefers to conform to $R$ rather than $R'$ *on condition that others conform to $R$* (and vice versa for $R'$). Basically, no alternative is *strictly preferred* given the expectations. It ensures arbitrariness.
      *   *Coordination Problem:* Defined as a situation with multiple proper coordination equilibria. Interests are not perfectly aligned (there's conflict about *which* equilibrium, but agreement on *having* one), but generally, it's a mixed-motive game (like Battle of the Sexes or Driving Side), not Pure Coordination (perfect alignment) or Zero-Sum (pure conflict). *Correction:* Lewis actually focuses heavily on "Coordination Equilibria" where interests *are* aligned regarding the equilibrium itself, but the problem is selecting *which* one.
      *   *Arbitrariness:* The condition that no alternative is strictly preferred ensures the convention is *arbitrary*. If one equilibrium were strictly better (Pareto superior), it wouldn't be a convention; it would be a rational necessity (or a "norm" in a different sense).
      *   *Evolutionary Account:* **Major Red Flag.** Lewis's 1969 book is famously *not* evolutionary in the biological sense. It is game-theoretic and based on common knowledge, salience, and precedent. While Lewis discusses "salience" and "precedent," he does *not* provide a biological evolutionary account (replicator dynamics, natural selection analogy in the biological sense) in the 1969 text. That sounds more like Brian Skyrms (*Evolution of the Social Contract*, 1996) or later evolutionary game theory. Lewis relies on *inductive reasoning* and *salience*, not biological selection.

