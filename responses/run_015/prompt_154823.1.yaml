answer: |-
  The Cambridge Analytica scandal demonstrates that privacy violations are fundamentally assaults on epistemic autonomy, not merely breaches of secrecy.

  Viewed through epistemic autonomy, privacy protects the integrity of the cognitive environment where beliefs form. Here, the players were asymmetrical. Quiz-taking users had a binary option: play or abstain, buried under legalese. Their "friends"—the actual voters targeted—had zero options; their data was inferred via network effects. Facebook acted as the infrastructure landlord, enabling the extraction via API design. Cambridge Analytica (CA) was the architect of manipulation, converting data into psychological weaponry.

  The Terms of Service (ToS) consent signifies procedural compliance, not meaningful agency. Users clicked "agree" to share data, not to surrender their political sovereignty. If privacy is merely control over data access, the theory collapses here: users technically consented. However, if privacy is epistemic autonomy, the violation is stark. Autonomy requires understanding the forces shaping one's preferences. Because the engineering of the informational environment was opaque, users could not exercise control over what they could not perceive. Their autonomy was destroyed not because data was hidden, but because the *influence* was hidden.

  The theory hits a silence regarding blame distribution. Facebook provided the gun (API); CA pulled the trigger (targeting). Epistemic autonomy explains the harm to the voter but struggles to weigh the complicity of the platform versus the actor. Ultimately, this episode strengthens the autonomy view. It reveals that "notice and consent" regimes are insufficient because they treat privacy as a transaction rather than a condition for democratic agency. The scandal proves that without transparency into how information environments are engineered, formal control is an illusion, and epistemic autonomy is impossible.
