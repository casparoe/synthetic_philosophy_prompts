prompt: |-
  You're a philosopher of tech and privacy. Take the 2018 Cambridge Analytica / Facebook scandal — the quiz app that scraped psych profiles and then fed targeted political ads. Don't just rehearse the usual "privacy was violated" line. Instead, analize the episode through the idea of privacy as epistemic autonomy: privacy matters not because data is hidden, but because people need control over the informational environment that shapes their beliefs and preferences. Map it precisely: who are the players (users, Facebook, CA, the voters being targeted), what real options each had, and what that "consent" buried in the ToS actually signified. Does the case show that privacy-as-control collapses because users technically clicked agree? Or does it show epistemic autonomy was destroyed anyway, since people never understood that their belief-forming environment was being engineered? Be honest about where the theory goes silent — say, on whether Facebook or CA is more blameworthy — and say whether this episode strengthens the autonomy view or exposes a gap it can't fill. Think step by step, maybe sketch the mapping first. Keep it under 350 words. Start with your bottom line in one sentence.
