answer: |-
  **The Ledger of Admissible Futures**

  The inscription above the Hall of Ledgers was worn smooth in the center, where the stonecutters had carved the founding statute of the Commonwealth of Orenn. *For every Method licensed to predict the Course of Nature, there shall be maintained its Complement, issuing the Opposite Prediction on every occasion.* The justification followed, chiselled in smaller script: *For over the Class of Admissible Futures, the Record of Truth is Symmetric.*

  Kaelen, a Junior Auditor of the Third Rank, ran a thumb over the stone. It was cold. Above, the gaslights hissed, illuminating the dust motes dancing over the rows of iron-bound books. Inside those books lay the history of the Office of Weights and Regularities. For two hundred years, the Regular Methods had predicted the flood levels, the ore yields, and the grain rot with tolerable accuracy. For two hundred years, the Antipodal Bench had been wrong about nearly everything.

  Yet, both were licensed. Both were paid. Both were recorded.

  Kaelen's task was to review the status of the Antipodal Bench before the Board convened on Friday. The recommendation from the Senior Auditors was clear: de-license. The waste was intolerable. But the statute was explicit, and Kaelen needed to understand why the symmetry held in the ledger even if it failed in the street.

  He pulled the Master Ledger for the Agricultural District. The pages were a grid of ink. On the left, the Regular Method's predictions for harvest yield. On the right, the Antipode's. Below, the actual yield.

  The columns were mirror images. Where the Regular predicted *High*, the Antipode predicted *Low*. In the actual column, *High* appeared almost exclusively. The Regulars accumulated ticks; the Antipodes accumulated crosses. But in the marginalia, written in the fine hand of the Founders, was the summation. It did not sum over the *actual* column. It summed over the *Admissible*.

  Kaelen traced the calculation. For every sequence of harvests where the Regulars succeeded, there existed a permuted sequence of harvests where the Antipodes succeeded. The Ledger accounted for worlds that had not happened, worlds where the rain fell upward and the grain grew in winter. In the aggregate of those phantom worlds, the tick marks balanced perfectly. The Office had no warrant to prefer the actual world over the admissible ones *a priori*.

  Kaelen closed the book. The symmetry was perfect. The utility was nonexistent.

  He descended to the basement, where the Antipodal Bench was housed. It was quieter here. The clerks of the Bench did not rush to measure the rain or weigh the ore; they simply inverted the numbers sent down from the floor above.

  Old Heston sat at a desk piled with inverted charts. He looked up as Kaelen approached, wiping ink from his fingers.

  "Auditor," Heston said. "Here to count our errors?"

  "To review the licensing statute," Kaelen corrected. "The Board suggests the Bench is redundant."

  "Redundant implies we do nothing," Heston said. "We maintain the symmetry. We keep the Ledger honest."

  "The Ledger is honest," Kaelen said, leaning on the desk. "But the Commonwealth lives in one world, Heston. Not the Class of Admissible Futures. In this world, you are wrong. Every day. For two centuries."

  Heston smiled, a dry, cracking expression. "And if the world had been otherwise? If the ore veins had shifted daily, if the seasons turned on a coin toss? Then your Regulars would be the fools, and we would be the sages. The statute protects us against that world."

  "But we are not in that world."

  "Are we?" Heston tapped the ledger. "How do you know? You look at the past two centuries and see order. You assume the next century will match the last. That is your Method. I assume the next century will differ. That is mine. You say the record supports you. I say the record supports me exactly as much, provided you count the futures where the pattern breaks."

  "That's a trick of the measure," Kaelen said. "You're weighting the chaotic futures equally with the orderly ones."

  "And you are weighting the orderly ones higher," Heston countered. "You tilt the Ledger. You say, 'This world is the likely one.' But that is not a finding of the Office. That is a bias you bring to the door. You want to de-license us because you have decided, without proof, that the future will resemble the past. That is not epistemology, Auditor. That is habit."

  Kaelen felt the familiar wall rise up. Heston was right, technically. To prefer the Regular Method was to assume a measure over possible worlds that favored simplicity. It was to say that smooth curves are more 'real' than jagged ones. But to assume that was to beg the question. If you weighted all futures equally, the Antipodes were as valid as the Regulars. If you weighted simple futures higher, the Antipodes vanished. But choosing the weight was the very thing that needed justification.

  "So we maintain you," Kaelen said slowly, "because we cannot prove the world is orderly?"

  "You maintain us because the Statute demands symmetry over the Admissible," Heston said. "Whether the Actual is among them is a matter for fortune, not accounting."

  Kaelen returned to his desk as the gaslights flickered toward evening. He opened the Recommendation Form.

  *Grounds for De-licensing:*

  He could write *Epistemic Failure*. But Heston was right; there was no theorem that ruled out the chaotic futures. The symmetry held. The Antipodes were logically sound within the statute's framework.

  He could write *Practical Utility*. But that assumed the world would continue to be orderly, which was the very assumption under review.

  Kaelen looked at the budget column. The Antipodal Bench consumed ink. They consumed paper. They required clerks to invert the numbers, double the filing space, and heat the basement. The Regulars did the same, but their predictions guided the ships and the plows. The Antipodes guided nothing. They were a mirror that reflected no light.

  The distinction settled over him. The symmetry result was a fact about the Ledger. The problem of induction was a fact about the Commonwealth. The Office could not solve the latter with the former. It could only choose which world to fund.

  To keep the Bench was to honor the Statute's neutrality over all possible worlds. To dismiss them was to honor the Commonwealth's need to survive in this one. Choosing this world was a bias. It was circular. It was necessary.

  Kaelen dipped his pen. He did not write about truth. He did not write about probability.

  *Recommendation: De-license.*
  *Justification: Conservation of Resources.*
  *Note: The maintenance of Complementary Methods requires double expenditure of ink and storage. While the Statute requires symmetry over Admissible Futures, the Office's budget is allocated in Actual Currency. The Commonwealth cannot afford to hedge against futures that do not obtain, regardless of their admissibility. The Regular Methods shall be retained solely on the grounds that their outputs are currently utilized by the Ministry of Agriculture. The Antipodal Bench outputs remain unused.*

  He blew on the ink to dry it. It was not a vindication. The Regulars were not proven right; they were just cheaper to bet on. The Antipodes were not proven wrong; they were just expensive to insure against.

  Kaelen stacked the form on the outgoing tray. Above him, the inscription on the Hall remained true. Over all admissible futures, the score was tied. But in this room, in this week, in this Commonwealth, the ink was running out, and only one column was buying more.
