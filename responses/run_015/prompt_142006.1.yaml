  2. It must align with psychophysical data on just-noticeable differences, distinguishing imperceptible harms from sub-perceptual physiological nulls, which is required by empirical constraints (non-negotiable).
  3. It must adjudicate the transgenerational variant where harms are isolated per person, though this creates tension with within-life aggregation limits if cross-life summing is rejected (non-negotiable case coverage).
  4. It must not collapse certain tiny harms into tiny probabilities of catastrophic harms, as risk structures differ, though aggregationists and non-aggregationists dispute the weighting (non-negotiable distinction).
  5. It must clarify whether the separateness of persons blocks aggregation across lives, noting that denying aggregation conflicts with within-life summation principles (non-negotiable clarity).
