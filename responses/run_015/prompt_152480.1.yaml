answer: |-
  The rain wasn't falling so much as hanging in the air, a wet grey curtain that smelled of salt and diesel. Inside the town hall, the air was thicker. It smelled of wet wool, stale coffee, and the kind of silence that happens when everyone is waiting for someone else to blink.

  I was sitting on the folding chair between my mom and dad. Mom works at the school; if the town dies, the school closes. Dad fishes the outer banks; if the harbor gets dredged for the resort, the grounds are gone. They weren't holding hands.

  Mayor Evans stood at the front, staring at a whiteboard that was already smudged from previous meetings. He looked tired. We were four hours into trying to decide who gets to decide.

  "It's simple," Mr. Henderson said from the back. He's been here sixty years, hands like driftwood. "You pay rates, you live here, you vote. That's the roll. Four hundred names. End of story."

  Sarah, who teaches history and organizes the bay coalition, stood up. Her voice wasn't angry, just tight. "If the dredging happens, the sediment kills the beds in Blackwood Bay. Those people don't pay rates here, but they lose their livelihood. If you don't let them vote, you're taxing their future without consent."

  "And the workers?" my dad asked. He wasn't shouting. He just wanted to know. "Nine hundred construction staff. They'll live in the new block. They'll breathe the air, drink the water."

  "They aren't here yet," Henderson snapped. "You can't vote for ghosts."

  "But if the vote passes, they aren't ghosts," Sarah said. "If the vote fails, they never exist. That's the problem."

  Evans rubbed his face. "Okay. We agreed to try the iterative method. Just once. To see."

  He turned to the board. He drew a circle. *Round 1.*

  "List A," Evans said. "Current ratepayers only. 400 eligible."

  He looked around the room. "Show of hands. Who votes Yes for the resort?"

  I watched the room. I saw my mom's hand go up. She's thinking about the school budget, the jobs for kids who usually leave. I saw my dad keep his arms crossed. He's thinking about the water clarity. About thirty hands went up from people who don't fish but need work. The Yeses had it. 230 to 170.

  "Result: Build," Evans said. He wrote it in green marker.

  "But," Sarah said. "If the result is Build, the boundary changes. The workers become residents. The neighbors become victims. They are affected subjects. So the *demos* expands."

  Evans erased the bottom half of the board. "Round 2. List B. Current residents plus the Blackwood Bay coalition plus the projected worker representatives."

  The room shifted. People from Blackwood Bay, who had been sitting quietly in the back, stood up. A few union reps from the city leaned forward. The geometry of the room changed. The Yes side looked smaller.

  "Show of hands. Yes for Build?"

  Mom's hand went up again. But some of the locals dropped theirs. They looked at the Blackwood fishermen. They looked at the union guys who were shaking their heads—turns out the union didn't trust the developer either, not really. The neighbors all voted No. The math flipped. 350 No, 250 Yes.

  "Result: Don't Build," Evans said. He wrote it in red.

  He stepped back. The marker hovered over the board.

  "If the result is Don't Build," Henderson said, his voice quiet, "then the workers don't come. They aren't affected because they aren't here. And the Blackwood beds stay safe, so the neighbors aren't impacted beyond the usual trade. They drop off the list."

  "So we're back to List A," Sarah said. She sounded exhausted.

  Evans erased the red writing. The board was smudged now, a grey smear where the decision was supposed to be. "Round 3. List A. Current residents."

  He turned around. "Show of hands. Yes for Build?"

  I watched my mom. She looked at my dad. He looked at the floor. Her hand went up. It was the same room, the same people, the same need for jobs. The vote was identical to Round 1. 230 Yes.

  "Result: Build," Evans said.

  "But if it's Build," Sarah said, pointing at the board, "then List B is the only legitimate list. Because those people *will* be affected."

  "And if List B votes," Henderson countered, "it fails. So they *won't* be affected. So List A is the only legitimate list."

  The room went quiet. Not the quiet of agreement, but the quiet of a machine jamming. You could hear the rain hammering the corrugated iron roof.

  I looked at the board. It was just two words cycling. *Build. Don't Build.* Green. Red. Green. Red.

  My dad leaned forward, elbows on knees. "So we're stuck."

  "We're not stuck," Evans said, but he didn't sound sure. "We just... we haven't found the right cutoff."

  "There isn't one," Sarah said. She wasn't triumphant. She looked sick. "If we vote now, based on who is here, we decide for people who aren't. If we wait to include them, they don't exist yet to be included. Both lists are fair. Both lists produce a majority. Both majorities cancel each other out."

  My mom finally spoke. "So what happens to the school?"

  "And what happens to the nets?" my dad asked.

  Evans capped the marker. The click sounded like a gunshot. "We can't certify the result. If I certify Yes, the neighbors sue because they were excluded. If I certify No, the workers sue because they were excluded. But they can't sue because they aren't here. But they will be."

  He put the cap in his pocket. He didn't erase the board this time. He just left the green *Build* staring at the red *Don't Build*.

  "We'll adjourn," Evans said. "Until next week."

  "Next week changes nothing," Henderson said.

  "Maybe someone will think of something," Evans said. He walked off the stage.

  People started standing up. Chairs scraped against the linoleum. No one was yelling. There was no point. My mom stood up and pulled on her raincoat. My dad did the same. They didn't look at each other.

  I stayed in my seat for a minute. I looked at the whiteboard. The green ink was still wet. It was going to smear if anyone brushed against it. Outside, the ferry horn blew, low and long, signaling the last crossing before the weather turned.

  I walked out into the rain. The puddles reflected the town hall lights, shimmering and broken. I could see the reflection of the board in the water if I looked close enough. Green. Red. Green. Red.

  My dad was lighting a cigarette under the eaves. My mom was unlocking the truck. They weren't going home together.

  "Coming, Leo?" Mom called out.

  "Give him a minute," Dad said.

  I stood there watching the rain wash the dust off the parking lot. The vote was still happening somewhere, in the space between who was here and who would be. The engine of the truck idled. The ferry horn blew again. Nothing stopped. Nothing started. I just got wet.
