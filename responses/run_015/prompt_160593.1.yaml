answer: |-
  You have stumbled onto a genuine gap in the taxonomy of conflict and cooperation. You are right to feel that "Security Dilemma" is too broad (it implies active threat accumulation) and "Noise/Trembling Hand" is too narrow (it implies the actor knows they erred).

  The phenomenon you are describing does not have a single, canonical label in the way "Tragedy of the Commons" or "Security Dilemma" does. Instead, it is currently described by a constellation of terms across game theory, IR, and social psychology that don't quite snap together.

  Here is the carving you are looking for, the closest existing literature, and a proposed term you can operationalize for your dissertation.

  ### 1. The Carving: What family is this in?

  This is not a species of the Security Dilemma, nor is it standard Noise. It is a **Signaling Failure under Imperfect Monitoring** that triggers a **Spiral of Misperception**.

  Here is the precise anatomy:
  *   **The Structure:** Repeated Game with Imperfect Public Monitoring (you see the outcome, not the move).
  *   **The Shock:** Exogenous Capacity Constraint (distinct from a "trembling hand" execution error).
  *   **The Information Problem:** Unverifiable Private Information (Party A knows they *couldn't*, Party B cannot verify this; "I couldn't" is cheap talk).
  *   **The Psychological Mechanism:** Fundamental Attribution Error (Party B attributes the omission to Party A's disposition/intent rather than the situation).
  *   **The Dynamic:** The "Clean Ledger" problem prevents the activation of **Contrite Strategies** (like Contrite Tit-for-Tat).

  In standard game theory "noise" models (e.g., Boyd 1989; Sugden 1986), the assumption is often that the *defector knows they defected* (even if accidentally) and is willing to accept punishment to restore cooperation. In your cases, Party A does not view themselves as a defector. They view themselves as a victim of circumstance who is now being attacked. This asymmetry in **status attribution** (Defector vs. Victim) is what blocks the repair machinery.

  ### 2. The Label

  Since there is no settled term, you have the opportunity to coin one. "Security Dilemma of Inaction" is clunky. "Noise" is inaccurate.

  I propose you call this: **The Unverifiable Incapacity Spiral.**

  Alternatively, if you want to highlight the psychological ledger aspect: **The Clean-Ledger Breakdown.**

  For your dissertation, **The Unverifiable Incapacity Spiral** is stronger because it highlights the two necessary conditions:
  1.  **Incapacity:** It wasn't a choice (distinguishing from defection).
  2.  **Unverifiable:** The excuse cannot be credibly signaled (distinguishing from standard force majeure where a third party adjudicates).

  ### 3. Why existing terms don't fit

  *   **Security Dilemma (Jervis):** This requires measures taken for *defense* to look like *offense*. Your case is *inaction* looking like *offense*. It is a **Passive Security Dilemma**.
  *   **Trembling Hand / Noise:** This assumes the player *tried* to cooperate and failed mechanically. In your case, the player *could not try*. The strategic implication is different: a trembling hand player usually admits the mistake. An incapacity player claims they never broke the contract, they were prevented from fulfilling it.
  *   **Commitment Problem:** This is usually about future power shifts. This is about present capacity constraints.
  *   **Moral Hazard:** This implies Party A might be *causing* the incapacity to avoid costs. In your pure cases, the incapacity is exogenous.

  ### 4. Predictors: What makes a pair survive vs. spiral?

  You asked whether a long history of clean cooperation protects them or makes them fragile. The literature on **Relational Contracts** (Levin 2003) and **Trust** suggests a non-linear relationship.

  **Predictors of Survival:**
  1.  **Redundancy in Monitoring:** Did Party B have *any* other way to know about the bridge/checkpoint? If the only signal is "No Money," you spiral. If there is a secondary channel (rumor, third party, radio check-in), you survive.
  2.  **The "Goodwill Bank" (Trust Capital):** A long history helps *only if* the relationship has generated a reservoir of goodwill that allows Party B to entertain the hypothesis of incapacity. However, if the history has created an expectation of *perfect* compliance (a "high-equilibrium" trap), the shock is more damaging because the deviation is statistically more improbable.
  3.  **Cost of Verification:** If Party B could have verified the excuse cheaply (e.g., call the checkpoint) but didn't, the spiral is more likely. This moves the failure from "Incapacity" to "Willful Blindness."
  4.  **Symmetry of Vulnerability:** If both sides know they are subject to the same exogenous shocks (e.g., "We both know the rains flood this road"), survival is more likely. If only one side is vulnerable, the other suspects strategic exploitation.

  **Predictors of Spiral:**
  1.  **High Stakes / Low Margin for Error:** In civil war ceasefires, the cost of being wrong (trusting a defector) is often death. This creates a **False Positive Bias**: Party B would rather mistakenly punish a cooperator than mistakenly trust a defector.
  2.  **Lack of "Focal Points" for Repair:** In your department story, there was no agreed-upon protocol for "What if I have an emergency?" In successful ceasefires, there are often joint commissions to adjudicate these exact claims. Without a focal point for adjudication, the "Clean Ledger" persists.

  ### 5. Boundary Conditions (What counts as a case?)

  To make this concept robust for your dissertation, you need to define the boundaries.

  **Does it count if the "can't" was partly the agent's fault?**
  *   **No.** If Party A knew the bridge was weak and crossed it anyway, or didn't charge the radio, this slides into **Moral Hazard** or **Negligence**. The core of your concept is *exogenous* incapacity.
  *   *Nuance:* You can have a spectrum. Pure exogenous shock (Earthquake) = Pure Unverifiable Incapacity Spiral. Negligence (Didn't maintain radio) = Moral Hazard. The interesting empirical cases are in the middle (e.g., "I took the risky route because the safe route was blocked by *another* conflict").

  **Does it count if the other side could have verified it cheaply?**
  *   **No.** If Party B could have verified the excuse at low cost and chose not to, this is not a spiral of misperception; it is a **Choice to Escalate**. The Unverifiable Incapacity Spiral requires that verification is *costly or impossible* for Party B. If verification is cheap, the failure is in the *institution*, not the information structure.

  **Does it count if Party A knows they look like a defector?**
  *   **Yes, but...** If Party A knows they look like a defector and sends a costly signal to prove it (e.g., sends a hostage, offers future concessions), and Party B *still* retaliates, then it is no longer an Incapacity Spiral; it is a **Breakdown of Credible Signaling**. Your specific phenomenon relies on the fact that Party A *cannot* credibly signal their constraint.

  ### 6. A Note on Your Department Story

  Do not feel embarrassed about the co-author story. That is a textbook case of the **Unverifiable Incapacity Spiral** in an academic setting.
  *   **The Shock:** Family emergency (Exogenous capacity constraint).
  *   **The Signal:** Missed deadline (Omission).
  *   **The Interpretation:** You interpreted omission as lack of commitment (Fundamental Attribution Error).
  *   **The Ledger:** They felt aggrieved by your coldness (retaliation); you felt aggrieved by their flakiness (defection).
  *   **The Repair Failure:** No third party (editor/department head) adjudicated the "force majeure."

  ### Summary for your Dissertation

  You are describing a failure mode of informal enforcement where **exogenous capacity constraints are indistinguishable from strategic defection**, and **claims of constraint are non-credible cheap talk**.

  I recommend labeling it **The Unverifiable Incapacity Spiral**.

  It is distinct from the Security Dilemma because it concerns *omission* rather than *commission*. It is distinct from Noise models because the actors maintain *clean ledgers* (denying the defection label), which prevents the activation of contrite strategies. It is a specific pathology of **decentralized enforcement mechanisms** where no third party exists to adjudicate *force majeure*.

  This is a strong contribution. It explains why "strong" relationships (high expectations) can be fragile, and why ceasefires often collapse not because someone wanted war, but because the *fog of peace* made a breakdown look like a betrayal.
