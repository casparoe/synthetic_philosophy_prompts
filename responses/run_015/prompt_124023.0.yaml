answer: |-
  ### 1. Exam Question

  **Question 4 (20 Marks)**
  Consider a crystal vase equipped with two mechanisms: (1) an internal nanotech shock-absorber that instantly alters the glass's molecular bonding upon impact (a **Fink**), and (2) an external foam wrap that prevents breakage upon impact (a **Mask**). Intuitively, the vase remains fragile.

  In an essay of approximately 800 words, evaluate whether the vase possesses the disposition to shatter. Specifically:
  1.  Apply the **Simple Conditional Analysis (SCA)** to the case.
  2.  Apply **Lewis's Reformed Account** (focusing on the causal basis and persistence).
  3.  Apply **Johnston's Intrinsic-Property Defense**.
  4.  Conclude whether this compound case refutes all three views or preserves one, and explain what this implies for the requirement that dispositions be **intrinsic properties**.

  ***

  ### 2. Model Answer

  The compound case of the finkish-masked vase generates a false negative for the disposition 'fragile'. While the vase possesses the categorical base of fragility (crystalline structure), it will not shatter if struck due to the foam (mask) and will lose its structural basis upon striking due to the shock-absorber (fink). This scenario tests the robustness of three major accounts of dispositions.

  First, the **Simple Conditional Analysis (SCA)** identifies fragility with the counterfactual: $x$ is fragile iff if $x$ were struck, $x$ would shatter. In this case, the antecedent 'if struck' is met, but the consequent 'would shatter' is false. The foam mask prevents the shattering, and the fink ensures the structural basis vanishes before shattering can occur. Since the conditional is false, SCA entails the vase is not fragile. This contradicts the intuition that the vase *is* fragile (the mask and fink are additive impediments, not removals of the nature of the glass). Thus, the compound case decisively refutes SCA. It demonstrates that the truth of the disposition ascription does not supervene on the truth of the simple counterfactual, as extrinsic masks and finkish removals can break the link without removing the disposition itself.

  Second, **Lewis's Reformed Account** attempts to fix SCA by appealing to an intrinsic causal basis $B$. For Lewis, $x$ is fragile iff $x$ has an intrinsic property $B$ such that, if $x$ were struck and $B$ persisted, $B$ would cause shattering. The foam mask is handled well here; the conditional is modified to hold *ceteris paribus* regarding the basis. However, the internal fink creates a fatal problem for Lewis's persistence clause. The shock-absorber is triggered *by* the striking. Therefore, in the closest possible world where the vase is struck, the basis $B$ (the brittle bonding) does *not* persist; it is altered by the finkish mechanism immediately upon stimulus. Because the basis fails to persist through the stimulus, Lewis's analysis yields the result that the vase is not fragile. Like SCA, Lewis's account fails to capture the intuition that the vase is fragile *prior* to the strike. The fink shows that requiring the basis to persist through the stimulus is too strong a condition for disposition ascription, as finks can remove the basis without removing the disposition *ex ante*.

  Third, **Johnston's Intrinsic-Property Defense** argues that dispositions are grounded in intrinsic categorical bases that exist independently of the counterfactuals. On this view, the vase is fragile in virtue of its molecular structure at time $t_0$, prior to the strike. The external foam is clearly extrinsic and thus merely masks the disposition; it does not alter the intrinsic base. The internal fink is more complex. However, Johnston can argue that the finkish mechanism is a separate intrinsic property that *interacts* with the fragility base only upon stimulation. At $t_0$, the fragility base exists intact. The fact that it will be destroyed at $t_1$ (upon striking) does not negate its existence at $t_0$. Therefore, Johnston's view preserves the intuition that the vase is fragile. It locates the disposition in the actual intrinsic nature of the object, rather than in the outcome of a counterfactual scenario that can be corrupted by finks or masks.

  **Conclusion:**
  This compound case kills both SCA and Lewis's account but saves Johnston's intrinsic defense. SCA and Lewis fail because they tie disposition ascription too closely to the *manifestation* (the shattering) or the *persistence of the basis during manifestation*. The fink ensures the manifestation fails and the basis vanishes. Johnston succeeds because he locates the disposition in the *possession* of the base, not the success of the counterfactual.

  This matters for **intrinsicness** because it suggests dispositions must be defined by the object's current internal state, not by its future behavior under interference. If we accept Lewis or SCA, we allow extrinsic factors (foam) or dynamic changes (finks) to determine whether a disposition exists. If we accept Johnston, we maintain that dispositions are stable intrinsic properties that can be prevented from manifesting (masked) or removed during manifestation (finked) without negating their existence prior to the stimulus. The case proves that a viable metaphysics of science must decouple the *having* of a disposition from the *truth* of the associated counterfactual.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Moves × 4 Marks)**

  | Move | Requirement (4 Marks) | A-Grade Differentiator | Common Pitfall (B/C Grade) |
  | :--- | :--- | :--- | :--- |
  | **1. SCA Application** | Correctly identifies SCA fails because the counterfactual (if struck → shatter) is false due to mask/fink. | Explicitly notes that *both* mechanisms contribute to the false consequent, making the SCA verdict "Not Fragile." | States SCA fails but attributes it only to the mask, ignoring the fink's role in making the conditional false. |
  | **2. Lewis Application** | Correctly applies Lewis's persistence clause: Basis $B$ must survive the stimulus to cause shattering. | Explains that the *Fink* specifically violates the persistence clause, causing Lewis to incorrectly verdict "Not Fragile." | Defines Lewis's account generally but fails to explain why the *fink* breaks the persistence condition specifically. |
  | **3. Johnston Application** | Argues Johnston survives by locating fragility in the intrinsic base at $t_0$ (pre-strike). | Distinguishes that the fink removes the base *at $t_1$*, but the disposition exists *at $t_0$*, preserving the intrinsic claim. | Claims Johnston fails because the fink is internal, confusing "intrinsic mechanism" with "loss of intrinsic base." |
  | **4. Verdict (Kill/Save)** | Concludes that SCA/Lewis are refuted, but Johnston's intrinsic view is preserved. | Justifies *why* Johnston survives: he decouples disposition possession from counterfactual truth. | Hedges or claims all three fail, missing the nuance that Johnston doesn't rely on the counterfactual holding. |
  | **5. Intrinsicness Implication** | Explains that dispositions must be grounded in current internal states, not future outcomes. | Connects the verdict to the metaphysical claim: Intrinsicness requires stability against extrinsic/dynamic interference. | Vaguely mentions "intrinsic properties matter" without explaining how the case dictates this requirement. |

  **Grading Notes:**
  *   **A Range (17-20):** Clear distinction between $t_0$ (possession) and $t_1$ (manifestation). Precise use of "persistence clause" regarding Lewis.
  *   **B Range (13-16):** Correctly identifies theories but treats the Fink and Mask as identical obstacles. Misses the time-index nuance in Johnston's defense.
  *   **C Range (9-12):** Recites definitions of SCA/Lewis without applying the specific mechanics of the vase case.
