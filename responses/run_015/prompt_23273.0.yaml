      *   *Correction:* The Philosopher's point about the Likelihood Principle needs precision. The LP applies to the *evidence*. It does not apply to *decision theory* or *long-run performance*. The Statistician is attacking the LP from a decision-theoretic/frequentist standpoint, which is a category error but a practically relevant one.
