      *   Make sure the "metaphysical lie" phrase is used effectively.
      *   (Note on Terminology): The user mentioned mixing up "Principle of Sufficient Reason" and "Principle of Reason." I will use the correct term (Principle of Sufficient Reason) but not pedantically correct them, just use it correctly in context.

