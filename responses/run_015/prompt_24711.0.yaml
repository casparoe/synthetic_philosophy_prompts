  1. "What each side actually says"
  Hempel insists on the Equivalence Condition: if evidence $E$ confirms hypothesis $H$, and $H$ is logically equivalent to $H'$, then $E$ confirms $H'$. Since "All ravens are black" is equivalent to "All non-black things are non-ravens," observing a white sock (non-black, non-raven) confirms the contrapositive, and thus the original hypothesis.

  Bayesians accept this but quantify it. Confirmation is defined as probability raising: $P(H|E) > P(H)$. Given background knowledge about the relative populations of ravens and non-black objects, observing a white sock raises the probability of $H$ by a vanishingly small amount. It confirms, but insignificantly.

  Relevance theorists reject the Equivalence Condition for qualitative confirmation. They argue confirmation requires a specific connection, often causal or nomological, between evidence and hypothesis. A white sock lacks any mechanistic link to raven genetics. Therefore, it provides no evidential weight, regardless of logical equivalence. They distinguish logical implication from evidential support.

  2. "Where the disagreement actually lives"
  Your diagnosis is sharp: it is largely verbal, but rooted in divergent goals. Bayesians model *degrees of belief* updating. For them, any evidence eliminating a possible world where $H$ is false counts as support. A white sock eliminates a non-black raven, so probability rises. Relevance theorists model *scientific inquiry*. They ask what warrants *pursuing* a hypothesis. For them, evidence must test the mechanism.

  The disagreement lives in the role of background knowledge and sampling. Bayesians bake population sizes into the probability calculation, making the white sock's impact negligible but non-zero. Relevance theorists treat background knowledge as defining the *context of discovery*. If your sampling method doesn't target ravens, the evidence is irrelevant to the causal claim.

  The "black sock confirms no ravens are black" worry stems from ignoring sampling protocols. If you select from non-black objects, finding a non-raven supports "All non-black things are non-ravens." But if you select from socks, you aren't testing ravens at all. The conflict isn't just definition; it's whether confirmation is a logical relation between propositions or a procedural norm for investigation. Bayesians say the former; relevance theorists say the latter. Consequently, the Bayesian sees a static logical update, while the relevance theorist sees a dynamic experimental design issue. They are solving different problems under the same label.

  3. "Is it verbal or substantive"
  It is primarily verbal regarding confirmation, but substantive regarding epistemology's purpose. You are right: they answer different questions. One asks about belief updating, the other about experimental warrant. The Bayesian admits the sock raises probability but denies it matters; the relevance theorist denies it constitutes evidence.

  The deciding sentence: They agree on the math but disagree on whether negligible probability raising constitutes meaningful support. Ultimately, the paradox dissolves if you distinguish incremental confirmation from significant evidential weight. The stalemate persists because both sides insist their definition captures the single true notion of scientific evidence.

  4. "What would count as progress"
  Progress requires abandoning the search for a single definition of confirmation. Instead, we need a dual-framework account that explicitly separates *logical support* from *investigative relevance*. A theorem showing how Bayesian updating behaves under different sampling protocols (random vs. stratified) would formalize the relevance intuition.

  Specifically, we need to model the *selection procedure*. If you select an object known to be non-black, the sock confirms. If you select an object known to be a sock, it does not. Good's "Smart Person" thought experiment demonstrates this: confirmation depends on how the evidence was generated, not just the proposition observed.

  Nothing will move the debate if philosophers insist on a monistic theory of evidence. Progress looks like a formal taxonomy: one category for probability raising (Bayesian), another for hypothesis testing (Relevance). Until we admit "confirmation" is polysemous in scientific practice, the paradox remains a linguistic trap rather than a logical problem. We need a change of question, not a new proof.
