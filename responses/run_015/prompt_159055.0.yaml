answer: |-
  Start by volunteering the tension with the current DALY framework before anyone else points it out, because if you try to hide it you will look like you haven't done the math. Open by saying that you know this proposal conflicts with the expected value maximization model the foundation currently uses, and that you are not suggesting we ignore efficiency but rather that we treat efficiency as constrained by individual fairness. You need to state clearly that your goal is not to destroy the spreadsheet but to add a veto condition to it, so the quant types do not feel you are asking them to throw away their work. The single reply that has to land for this proposal to survive at all is the distinction between making the world better in aggregate versus treating each person fairly as an individual. When you are asked why we should not just save the most lives possible, you must say that while saving lives is our goal, how we choose whose lives to save matters morally, and that a system that ignores the severity of individual harm in favor of aggregate small gains treats people as containers of value rather than persons with claims. If you cannot make them feel that distinction in your gut, the quant types will vote you down on efficiency and the program officers will vote you down on pragmatism, so practice saying that sentence until it sounds like conviction rather than apology.

  The first objection you will face comes from the two quant types, and it will be phrased in terms of opportunity cost and expected value. They will ask you directly why we should choose an option that predictably results in more total harm, specifically referencing your risk case where choosing the probabilistic option leads to ten times the expected suffering. You should concede up front that yes, on an expected value calculation, your preferred option produces more total harm. Your two-minute reply is that expected value is a tool for planning but not a moral trump card, and that when a policy imposes a certain catastrophe on one person to spare many others a tiny risk, it violates the separateness of persons. You argue that we cannot sacrifice the identified victim just because the math works out across the group, because that victim cannot appeal to the group for help. The soft spot here is that they will ask you where the threshold lies, and you do not have a number, so you must admit that this requires judgment but argue that having a framework for judgment is better than hiding behind a false precision of summed DALYs.

  Next the three program officers will worry about defensibility to the communities we serve, and they will ask how you explain to a village of two hundred thousand children that we denied them nutrition supplements to save fifteen other children they will never meet. You should concede that this is a difficult conversation and that you do not envy them having to have it. Your reply is that we can defend prioritizing life-saving intervention over quality-of-life improvements when resources are constrained, and that communities understand triage better than we give them credit for, whereas defending a system that ignores severe suffering for the sake of marginal gains is harder to justify face-to-face. The soft spot is that they know the reality of donor relations, and if a donor sees we let ten expected deaths happen to save one identified person, they may pull funding, so you need to be ready to suggest that we keep this reasoning internal to the committee rather than in the public write-up.

  The person with the philosophy background will not care about the donors but will care about whether you are butchering Scanlon, and they will ask if you are conflating ex-ante complaints about risk with ex-post complaints about outcomes. You should concede that you are adapting contractualism for a grant-making context rather than writing a thesis on moral theory. Your reply is that for the purpose of funding decisions, the ex-ante view protects individuals from being used as means to aggregate good, which is the core insight you want to preserve, and that technical precision on risk aggregation should not stop us from adopting a more humane decision rule. The soft spot is that if you get the terminology wrong they may dismiss you as dilettante, so stick to the moral intuition rather than trying to out-theorize them on the mechanics of reasonable rejection.

  The lawyer will worry about consistency and precedent, asking whether this rule gives us enough guidance to ensure we do not make contradictory decisions across different funding cycles. You should concede that this introduces more discretion than a simple formula. Your reply is that the rule provides a structured hierarchy of complaints that is more consistent than ad-hoc intuition, and that documenting the strength of individual complaints creates an audit trail that is actually more robust than hiding behind a single number. The soft spot is that they are right that this makes our decisions harder to compare year-over-year, so you should suggest we pilot this on a subset of grants to build case law.

  The former consultant will simply ask if this process can be completed before lunch and whether it requires data we do not have. You should concede that it takes more time to analyze individual complaints than to sum a column. Your reply is that spending more time on the decision is the point, because these are lives and not line items, and that we can streamline the complaint assessment by focusing only on the worst-off individuals in each proposal. The soft spot is that volunteer burnout is real, so you must promise to draft a worksheet that makes this faster rather than just adding discussion time.

  Finally, the question you are hoping nobody asks is exactly where the threshold lies for when numbers do break ties, specifically how many small harms must accumulate before they outweigh one severe harm. If they ask this, do not try to invent a number like one thousand or one million. Instead, reply that the point of the framework is to recognize that there is no linear exchange rate between severe and mild harm, and that we should decide that case when it arrives using the same principle of comparing strongest individual complaints. If you try to quantify the unquantifiable you will collapse back into the utilitarianism you are trying to escape, so hold the line that some trade-offs are qualitative rather than quantitative. Keep your breathing steady when you say this, because if you sound unsure they will smell blood, but remember that your intuition here is shared by most people outside of effective altruism circles, so trust that the room will agree that saving the drowning child matters more than feeding a million people a cookie.
