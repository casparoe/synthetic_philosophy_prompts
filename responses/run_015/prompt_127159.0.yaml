      *   *Rebuttal to the Challenge:* However, "structural suffering" isn't non-individuated. It is the aggregation of individuated sufferings caused by the structure. The ontology doesn't need to expand to include relations as *sites* of harm, but rather recognize structures as *causes* of harm.
      *   *Nuance:* The "low-grade alienation" is still suffering. If it's widespread, the sum is massive. NU cares about the sum.
      *   *Closing:* The error is thinking NU ignores diffuse pain. We care about the total burden, regardless of intensity, provided it is experienced.

      *Refining for Tone and Length:*
