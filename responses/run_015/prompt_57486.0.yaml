answer: |-
  ### Framing the Resolution: Desiderata for Dissolving the Paradox of Deontology

  To count as a resolution rather than a restatement, an account must do more than assert the permissibility of constraints; it must explain the rationality of the agent who obeys them in the face of minimizing opportunities. The following five desiderata specify the explanatory burden such an account must carry. For each, I distinguish between conditions necessary for any coherent moral theory (non-negotiable) and those that presuppose the truth of deontology over consequentialism (substantive commitments).

  **1. The Motivation Coherence Condition**
  *   **Requirement:** The account must explain how an agent can be motivated by the badness of a act-type (e.g., killing) without being rationally compelled to minimize instances of that act-type. It must show why the compliant agent is not less concerned with the underlying value than the violator.
  *   **Motivation:** This is the core of the paradox as defined: if the constraint tracks a value, ignoring the aggregation of that value appears irrational or fetishistic.
  *   **Status:** **Non-negotiable.** Any resolution that fails to address the structure of the agent's motivation has not engaged with the paradox, but merely asserted a counter-premise.

  **2. The Aggregation Asymmetry Condition**
  *   **Requirement:** The account must explain the intuitive difference between the *Regulator Case* (disclose one firm's data to save a hundred) and the *Killing Case* (kill one patient to save five), or explain why this difference is illusory. It must further account for why prevention spending (sensitive to numbers) is permissible while direct violation (insensitive to numbers) is not.
  *   **Motivation:** A resolution that treats all violations as identical fails to capture the nuanced intuition that confidentiality constraints behave differently than bodily integrity constraints, yet both resist simple minimization.
  *   **Status:** **Substantive Commitment.** A consequentialist resolution denies the asymmetry is real (arguing the Regulator intuition is simply under-developed). Demanding the theory preserve the asymmetry smuggles in a deontological datum as a criterion of adequacy.

  **3. The Non-Outcome Grounding Condition**
  *   **Requirement:** The constraint's binding force must remain intelligible even if the specific outcome of the violation is neutral or positive (e.g., a lie that causes no harm and prevents distress).
  *   **Motivation:** If the constraint dissolves when outcomes are good, the view collapses into rule-consequentialism, which does not resolve the deontological paradox but dissolves the deontology itself.
  *   **Status:** **Non-negotiable** (for a deontological resolution). If the goal is to save deontology, the constraint cannot depend ultimately on outcome values.

  **4. The Moral Residue Condition**
  *   **Requirement:** The account must accommodate the phenomenology of regret, distress, or the need for compensation in the agent who rightly declines to violate the constraint, without implying the agent did wrong.
  *   **Motivation:** Agents who refuse to kill one to save five often feel a tragic remainder. A theory that renders this regret irrational fails to describe the moral experience.
  *   **Status:** **Substantive Commitment.** Strict Kantianism may view regret for a righteous act as irrational. Demanding the theory validate regret privileges a specific strain of deontology (e.g., Williamsian) over others.

  **5. The Institutional Isomorphism Condition**
  *   **Requirement:** The logic governing the individual agent must scale to the official or regulator without remainder. If an individual cannot violate rights to prevent violations, the account must explain why a regulator can or cannot do the same.
  *   **Motivation:** The Regulator Case suggests that official roles might alter the permissions structure. A resolution that works only for private morality is incomplete.
  *   **Status:** **Substantive Commitment.** "Dirty Hands" theories posit a divergence between personal morality and public office. Demanding isomorphism rules out this class of resolution a priori.

  ***

  ### Joint Unsatisfiability

  There is a critical tension between the **Non-Outcome Grounding Condition** and the **Aggregation Asymmetry Condition**.

  If a formulation owes *nothing* to outcomes (Condition 3), it is difficult to explain why numbers matter in prevention spending but not in direct violation (Condition 2). Usually, the justification for spending public money to prevent violations is that *more prevented violations are better*. This is an outcome-based justification. If the constraint against direct violation is grounded in something non-outcome-based (e.g., rights, agency, dignity), one must explain why the *prevention* of violations is sensitive to outcome counts while the *commission* of violations is not.

  To demand both that the constraint be grounded non-consequentially *and* that the account explain the resistance to numbers without collapsing into "minimization is usually wrong but sometimes right" is to demand a theory that rejects outcome-value as the ground of obligation while using outcome-value to explain the obligation's limits. **These two requirements are jointly unsatisfiable for a pure deontological theory.** A theory must either admit some outcome-sensitivity (becoming threshold deontology or hybrid) or admit that the resistance to numbers is brute and unexplained (restating the paradox).

  ***

  ### The Critical Filter: The Explanatory Non-Circularity Requirement

  The single requirement that eliminates the largest share of familiar moves is a refinement of the Motivation Coherence Condition: **The account must explain the source of the constraint's special force without circularity or covert outcome-reliance.** It is not enough to say "I cannot kill because it is forbidden"; the account must explain *why* the prohibition binds in a way that does not secretly rely on the badness of the killing (which would trigger minimization).

  **Evaluation of Familiar Moves:**

  1.  **Agent-Relative Value:** **Fails.** It claims "my killing is worse than yours," but struggles to explain *why* without referencing the outcome (the death) or resorting to a brute assertion of agent-centered prerogatives that looks like a restatement of the paradox.
  2.  **Side-Constraints (Non-Teleological):** **Fails.** It typically posits rights as "side-constraints" on action. This names the structure of the prohibition but does not explain the motivation coherence; the agent still appears to value their own purity over the minimization of rights-violations.
  3.  **Threshold Deontology:** **Fails.** It concedes the paradox is real up to a point. By admitting that minimization becomes obligatory after a threshold, it validates the consequentialist worry that the agent *was* less concerned with the value below the threshold.
  4.  **The Doing and Allowing Distinction:** **Fails.** It explains why killing differs from letting die, but does not explain why killing *one* is forbidden to prevent killing *five* (both are doings in the prevention case). It addresses the act-type, not the aggregation problem.
  5.  **Deflationary Claim (Verbal Paradox):** **Fails.** It asserts the tension is linguistic or conceptual confusion. While it avoids the trap, it fails the Motivation Coherence Condition by dismissing the phenomenological reality of the moral conflict rather than resolving it.
