  2. **Supervaluationism:** 80 — This view locates the drift in **content**, modeling the borderline band as a region of divergent precisifications that can tighten or loosen depending on which admissible interpretations context selects.

  3. **Degree Theory:** 70 — This view locates the drift in **content**, offering a natural model for the gradient of stability but requiring additional contextual parameters to explain why the width of the intermediate truth-values shifts with purpose.

  4. **Contextualism:** 85 — This view locates the drift in **content**, directly mapping practical interests to standards of application, though it must carefully ground these shifts in shared norms to avoid collapsing into pure speaker subjectivism.

  5. **Nihilism:** 10 — This view locates the drift in **use** (as an error theory), denying that the predicate refers to any property at all, thereby dissolving the phenomenon rather than explaining the instrument-like behavior.

  **Final Revision:**
  If resolution drift is merely ordinary context-sensitivity like "flat" or "empty," I would revise the score for **Epistemicism** most sharply **downward** (e.g., from 55 to 5). Ordinary context-sensitivity implies the standard itself shifts with purpose, leaving no fixed boundary to be ignorant of, which directly contradicts the core ontological claim of epistemicism.
