answer: |-
  ### Exam Question

  **Course:** Consequentialism and Decision Theory
  **Time Allowed:** 2 Hours
  **Total Marks:** 20

  **Question 1**

  Act-consequentialism holds that an agent ought to perform the action that maximizes *expected moral value* (the sum of possible outcomes' moral values, weighted by their probabilities). A standard objection is *cluelessness*: agents lack sufficient evidence to estimate the long-term consequences of their actions, making expected value calculations impossible.

  Consider a specific version of this problem called **Drift**.
  1.  **Systematic Skew:** Agents' estimates are not randomly inaccurate; they are systematically skewed toward consequences that are near-term, vivid, or easily narrated, and away from diffuse, long-term effects.
  2.  **No Internal Correction:** Agents cannot detect this skew through introspection or past track records, because their reflective faculties suffer from the same skew.
  3.  **No Counterfactual Feedback:** Agents only observe the outcome of the action they chose, never the outcome of the foregone alternative, so there is no error signal to calibrate against.

  **Essay Task:**
  Evaluate whether the *Drift* hypothesis undermines act-consequentialism more severely than standard cluelessness. In your answer, you must address:
  *   Whether consequentialism requires knowledge of the *sign* (which is better) or the *magnitude* (by how much) of value differences, and how Drift affects each.
  *   Whether standard replies (e.g., relying on near-term effects, or assuming errors cancel out over a lifetime) survive the Drift hypothesis.
  *   Whether shifting to a *process*-based solution (e.g., following rules or deferring to others) avoids the problem, or merely generates a regress.
  *   Whether *Drift* is a unique problem for consequentialism compared to non-consequentialist views (e.g., side-constraints), and whether the hypothesis is falsifiable.

  *Note: Do not cite specific authors or papers. Define any technical terms you use.*

  ***

  ### Model Answer

  Act-consequentialism requires agents to choose the action with the highest expected moral value. Standard cluelessness suggests our evidence is too sparse to calculate this. The *Drift* hypothesis worsens this by claiming our errors are not random noise, but systematic bias toward the legible and near-term, which we cannot internally correct. This distinction is fatal to several standard defenses of consequentialism.

  First, we must distinguish between knowing the *sign* of a value difference (Action A is better than B) and the *magnitude* (A is better than B by 10 units). Standard consequentialism technically requires only the sign to guide action. Defenders of consequentialism often argue that while we cannot know magnitudes of distant effects, we can usually know the sign of near-term effects. However, under Drift, the sign itself is compromised. If the systematic skew pulls estimates toward the near-term, an agent might judge A > B because A has vivid short-term benefits, even if B has diffuse long-term benefits that outweigh them. Because the bias is systematic, it does not merely add uncertainty; it reliably points the agent in the wrong direction. Thus, Drift threatens the sign, not just the magnitude.

  Second, consider the reply that errors cancel out over a lifetime. This relies on the Law of Large Numbers, which applies only if errors are independent and random. Drift posits *correlated* errors. If an agent's cognitive faculty systematically undervalues diffuse effects, it will do so in every decision. The errors accumulate rather than cancel. A lifetime of choices made under Drift leads to a trajectory systematically diverging from the optimal path, rather than hovering around it. Therefore, the "errors wash out" defense fails completely under Drift.

  Third, does relying on near-term effects as a tiebreaker help? Under standard cluelessness, near-term effects are a reliable proxy for total value. Under Drift, the near-term is exactly where the bias is strongest. Using near-term effects as a guide amplifies the skew rather than correcting it. It routinizes the bias.

  This forces a shift from *judgment* to *process*. An agent might adopt a rule: "Do not act on intuitive value estimates when long-term effects are salient," or defer to institutions designed to correct for vividness bias. This moves the view toward indirect consequentialism (evaluating processes rather than acts). However, a regress worry arises: choosing the correct process is itself a choice subject to Drift. If I choose a rule to correct my bias, my evaluation of that rule is also biased.
  This regress is not necessarily fatal, but it raises the epistemic bar. Second-order judgments (choosing a process) might be less susceptible to Drift if they rely on aggregate data rather than vivid intuition. For example, historical analysis might show that agents who follow rule X produce better outcomes than those who follow intuition. This requires external data, not introspection. If such data is available, process-consequentialism survives. If not, the regress suggests we cannot rationally select a correction mechanism, leaving the agent paralyzed.

  Is Drift unique to consequentialism? Non-consequentialist views, such as those employing side-constraints (e.g., "do not kill"), do not require comparing magnitudes of outcomes. They only require identifying whether an action violates a constraint. Drift affects outcome estimation, so side-constraint views are insulated from the specific problem of skewed value calculations. However, this insulation comes at a cost: side-constraint views cannot respond to stakes. If preventing a catastrophe requires a minor violation of a constraint, the view forbids it. Consequentialism remains attractive because it respects stakes. The Drift objection shows that respecting stakes requires reliable magnitude estimates, which we may lack. Thus, Drift pushes us toward a dilemma: accept a view that respects stakes but is systematically biased (consequentialism), or accept a view that is unbiased but blind to stakes (side-constraints). Neither is clearly superior, but Drift removes the presumption that consequentialism is action-guiding.

  Finally, is Drift falsifiable? Since we cannot observe counterfactuals, we cannot prove from the inside that our estimates are skewed. However, the hypothesis is not idle. We can look for external patterns: if agents consistently prefer vivid charities over effective but abstract ones, this supports Drift. Dismissing Drift as "unfalsifiable" begs the question; it assumes our internal sense of reliability is trustworthy, which is precisely what Drift denies. We must treat our cognitive faculties as empirical objects subject to systematic error, not as transparent windows onto moral truth.

  In conclusion, Drift undermines act-consequentialism more severely than standard cluelessness because it invalidates the assumption that errors are random. It blocks the "errors cancel" and "near-term proxy" defenses. It forces a move to process-level evaluation, which risks a regress unless external data is available. While non-consequentialist views avoid Drift, they lose the ability to weigh stakes. The most defensible position is an indirect consequentialism that relies on external, aggregate data to select decision-processes, acknowledging that first-order moral intuition is systematically unreliable.

  ***

  ### Marking Scheme (20 Marks)

  **1. Sign vs. Magnitude (4 marks)**
  *   **Full marks:** Explains that consequentialism needs the *sign* (which is better) to act, but Drift threatens the sign because systematic bias can flip the ranking, not just blur the difference.
  *   **Common error:** Claims consequentialism needs precise magnitudes to function, or treats sign and magnitude as equally threatened without explaining why bias flips the sign.

  **2. Error Cancellation / Correlation (4 marks)**
  *   **Full marks:** Identifies that standard "wash out" replies rely on independent/random errors, whereas Drift posits *correlated* errors which accumulate rather than cancel.
  *   **Common error:** Recites the "errors cancel over a lifetime" argument without noting that Drift makes errors correlated, or assumes correlation doesn't matter for aggregation.

  **3. Near-Term Tiebreaker (3 marks)**
  *   **Full marks:** Notes that if Drift pulls toward the near-term, using near-term effects as a proxy amplifies the bias rather than correcting it.
  *   **Common error:** Defends near-term proxies as a solution without acknowledging they are the *source* of the Drift bias in this specific case.

  **4. Process Solutions & Regress (4 marks)**
  *   **Full marks:** Discusses shifting to rules/processes (indirect consequentialism) and addresses the regress worry (choosing the process is also subject to Drift), suggesting external data as a potential escape.
  *   **Common error:** Proposes rule-following as a fix without addressing whether selecting the rule is itself subject to the same bias (the regress).

  **5. Comparison to Side-Constraints (3 marks)**
  *   **Full marks:** Acknowledges side-constraints avoid Drift (no magnitude estimates needed) but notes the trade-off (insensitivity to stakes/catastrophes).
  *   **Common error:** Simply lists deontology as an alternative without analyzing the trade-off regarding stakes, or claims deontology is immune to all epistemic problems.

  **6. Falsifiability / Epistemic Status (2 marks)**
  *   **Full marks:** Argues that while internal falsification is impossible, external behavioral patterns provide evidence, and dismissing it as idle begs the question.
  *   **Common error:** Dismisses Drift as "unfalsifiable metaphysics" or claims introspection is sufficient to rule it out.

  **A vs. B Distinction**
  *   **B Grade:** Correctly identifies that Drift is "worse" than random noise and hits most of the required points, but treats the "errors cancel" objection as merely needing more data.
  *   **A Grade:** Explicitly identifies the **statistical distinction between independent noise and correlated bias**. The student explains *why* the Law of Large Numbers fails under Drift (correlation prevents convergence), rather than just asserting that errors don't cancel. This demonstrates a grasp of the decision-theoretic underpinnings rather than just the moral intuition.
