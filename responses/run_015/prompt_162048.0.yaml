answer: |-
  ### The Spec: Desiderata for Symbol-Level Causation

  Here is the requirements list for the theory your characters are arguing over. I have separated them into **Non-Negotiable** (if the theory fails these, the plot breaks or physics breaks) and **Contested** (this is where the Engineer and Neuroscientist actually disagree).

  #### Non-Negotiable (The Hard Constraints)
  1.  **Micro-Causal Closure:** No new forces, energy leaks, or physics violations. The substrate obeys standard physics at all times.
      *   *Case:* The Prosthesis subplot. If swapping hardware changes the physics, the "Ship of Theseus" argument fails.
      *   *Status:* **Non-Negotiable.** If you break this, the Neuroscientist wins by default because the Engineer is a mystic.
  2.  **Mapping Non-Triviality:** The theory must explain why *this* hardware implements *this* mind, and why a blinking wall does not. Not every physical mapping counts as a computation.
      *   *Case:* The Blinking Wall. If any mapping works, the wall is Ines, and the story loses stakes.
      *   *Status:* **Non-Negotiable.** Without this, "reconstruction" means nothing.
  3.  **Counterfactual Truth:** Statements about what Ines *would* have done (had she believed X) must be true or false, even if the actual microstate was fixed.
      *   *Case:* The Lawyer's Inquest. If the counterfactual is false, she isn't responsible; if it's true, something beyond the microstate determines it.
      *   *Status:* **Non-Negotiable.** This is the legal and moral core of the book.
  4.  **Orthogonality of Implementation:** One physical state can support multiple distinct symbol streams without interference.
      *   *Case:* Timesharing. If the physical state dictates a unique symbol state, two minds cannot share the substrate.
      *   *Status:* **Non-Negotiable.** Required for the technical setup of your world.

  #### Contested (The Battleground)
  5.  **Distinct Efficacy:** The symbol level must do work *over and above* merely describing the micro-level work. It cannot just be a compression algorithm for the physics.
      *   *Case:* "I kept the promise because I promised" vs. "Symms shoved symms."
      *   *Status:* **Contested.** The Engineer needs this for Ines's humanity; the Neuroscientist denies it to keep physics clean.
  6.  **Normative Leverage:** High-level states (beliefs, promises) must constrain low-level states, not just correlate with them.
      *   *Case:* Intervention Asymmetry. Editing "risk-aversion" works; editing a single symm doesn't.
      *   *Status:* **Contested.** Is this real constraint or just engineering convenience?
  7.  **Reflexive Stability:** The system must be able to represent itself without crashing or becoming epiphenomenal to its own self-model.
      *   *Case:* Self-symbol degradation. Ines functions even when her self-model degrades.
      *   *Status:* **Contested.** Does the self-symbol drive the bus, or is it a dashboard light?

  ***

  ### The Internal Conflict: Where the Spec Breaks

  You asked for the place where the list fights itself. Here it is. You cannot jointly satisfy **Micro-Causal Closure**, **Mapping Non-Triviality**, and **Distinct Efficacy** if "Distinct Efficacy" means "causal power separate from the micro-level."

  *   **The Triangle of Impossibility:**
      1.  If the Micro-Level is Causally Closed (Req 1), then every physical event is fully determined by prior physical events.
      2.  If Symbols have Distinct Efficacy (Req 5), they must influence physical events.
      3.  If they influence physical events *distinctly*, they are adding causal power not accounted for in (1).
      4.  Therefore, either Physics is not closed (Engineer is a mystic) or Symbols do not push (Neuroscientist is right).

  *   **The Escape Hatch:** The only way to save the story without breaking physics is to redefine "Distinct Efficacy." It cannot mean *force*; it must mean *constraint* or *counterfactual dependence*. The symbol level doesn't shove the atoms; it dictates which atomic shoves count as "actions" and which count as "noise."
  *   **The Dramatic Cost:** One character must be wrong about the definition of "cause." If the Engineer insists symbols add energy, he is wrong. If the Neuroscientist insists symbols are *only* descriptions with no leverage, she cannot explain the Intervention Asymmetry.

  ***

  ### The Killer Requirement

  **Mapping Non-Triviality (The Blinking Wall Constraint).**

  This is the single requirement that knocks out the most candidate answers.
  *   It kills **Panpsychism** (the wall is a mind).
  *   It kills **Naive Functionalism** (any mapping works).
  *   It kills **Behaviorism** (if it walks like a duck, it is a duck) because the wall can be mapped to walk like a duck.
  *   It forces the Engineer to explain *intrinsic* properties of the hardware that make the mapping real, which pushes him dangerously close to violating Micro-Closure.

  This is your best lever for drama. The Neuroscientist should hammer this: "Show me the physical feature that makes Ines a person and the wall a calculator, without invoking magic."

  ***

  ### Scorecard of Contenders

  Here is how the standard philosophical positions score against your specific scenes.

  **1. Epiphenomenalism (Symbols are smoke, not fire)**
  *   *Verdict:* Fails the Promise and Lawyer scenes.
  *   *Note:* Saves physics perfectly, but makes Ines a zombie. The Engineer loses the moral argument; Ines's "promise" is a delusion. Good for a tragedy, bad for a thriller.

  **2. Token-Identity / Reductionism (Mental states *are* physical states)**
  *   *Verdict:* Fails Timesharing and Prosthesis.
  *   *Note:* If mind = specific atoms, you can't swap hardware or run two minds on one chip. The Neuroscientist wins the physics, but the Engineer's tech becomes impossible.

  **3. Interventionist / Autonomy Account (Causation = Ability to Manipulate)**
  *   *Verdict:* Strongest fit for the Engineer.
  *   *Note:* Handles Intervention Asymmetry well. Struggles with the Blinking Wall (why can't I manipulate the wall into a mind?) and risks collapsing into "prediction" if not careful.

  **4. Real Patterns / Stance-Based (Mind is a useful compression)**
  *   *Verdict:* Good for Prosthesis, weak on the Promise.
  *   *Note:* Makes "Ines" real but observer-relative. The Lawyer's counterfactuals become subjective. The Neuroscientist can argue "she's only real because we treat her as such."

  **5. Mechanistic Computation (Mind is specific causal structure)**
  *   *Verdict:* The technical winner.
  *   *Note:* Handles Timesharing and Relabelling well (structure stays, labels change). Fails the "Promise" scene unless you explain how *norms* emerge from *mechanisms*.

  **6. Emergent Downward Causation (Mind exerts new force)**
  *   *Verdict:* Fails Micro-Closure.
  *   *Note:* The Engineer wins the agency argument, but becomes a physics denier. The Neuroscientist destroys him with a textbook. Only works if your universe allows magic.

  ### Recommendation for Chapter 11

  Don't let them agree. Let the Engineer win on **Intervention** (he can fix her, the Neuroscientist can't) while the Neuroscientist wins on **Closure** (she can explain the atoms, he can't).

  The tension should hinge on the **Relabelling Cipher**.
  *   **Engineer:** "The meaning didn't change, so the symbols are real."
  *   **Neuroscientist:** "The meaning didn't change because *you* didn't change the physics. The symbols are ghosts."
  *   **The Truth:** The mapping is real because it supports *counterfactuals* the physics alone doesn't track. The Engineer needs to admit the symbols don't "push," they "channel." The Neuroscientist needs to admit the channeling is as real as the water.
