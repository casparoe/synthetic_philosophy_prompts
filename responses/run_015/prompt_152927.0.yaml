answer: |-
  Your hunch is correct, but it cuts even deeper than taxonomic messiness. The stalemate persists because the debate is no longer about the *science* of the mind (everyone agrees neurons do the work), but about the **norms of scientific explanation** and the **metaphysics of causal powers**.

  Here is the diagnosis of the stalemate and what actual progress would require.

  ### The Diagnosis: Causal Exclusion vs. Explanatory Autonomy

  The disagreement is not merely verbal, nor is it simply that one side is doing metaphysics while the other does methodology. They are both doing metaphysics, but they are prioritizing conflicting constraints on what counts as a "real" property.

  **1. The Reductionist Constraint (Causal Exclusion)**
  The reductionist (following Jaegwon Kim's line) argues that for a property to be real, it must have causal powers. If a mental state $M$ is realized by physical state $P_1$ in humans and $P_2$ in robots, and $P_1$ and $P_2$ are physically distinct, then any causal work done by $M$ is actually done by $P_1$ or $P_2$.
  *   **The Worry:** If $M$ is a disjunction ($P_1 \lor P_2 \lor P_3 \dots$), it is not a "natural kind." Disjunctive kinds cannot figure in strict laws because they are heterogeneous. Therefore, $M$ is causally inert or merely a convenient shorthand.
  *   **The Goal:** Ontological parsimony. If the physical level explains everything, the functional level is ontologically redundant.

  **2. The Functionalist Constraint (Explanatory Autonomy)**
  The functionalist (following Jerry Fodor's line) argues that science aims for *generalization*, not just ontological bottoming-out. If "pain" predicts withdrawal behavior in humans, crabs, and aliens, there is a real pattern there that neuroscience misses by focusing on the substrate.
  *   **The Worry:** If we reduce "pain" to "C-fiber firing," we lose the ability to explain why silicon robots also withdraw. The generalization is lost.
  *   **The Goal:** Robust counterfactuals. The functional level supports predictions that the physical level cannot efficiently support.

  **The Stalemate:**
  The reductionist says: "Your functional kinds are gerrymandered disjunctions; they can't be laws."
  The functionalist says: "Your physical kinds are too specific; they miss the real patterns."

  They are talking past each other because they disagree on **whether projectibility requires physical homogeneity.** The reductionist says yes (laws must be physical); the functionalist says no (laws can be abstract). This is not a verbal dispute; it is a fundamental disagreement about the structure of scientific law.

  ### Is it Different Questions?
  You asked if they are answering different questions (metaphysical vs. explanatory). **Yes, but they falsely assume the answers must align.**

  *   **Metaphysical Question:** What constitutes the *being* of a mental state? (Reductionists say: Physical structure.)
  *   **Explanatory Question:** What constitutes the *utility* of a mental concept? (Functionalists say: Causal role.)

  The stalemate exists because both sides assume that if a kind is explanatorily useful, it must be metaphysically fundamental (Functionalism), OR if it is not metaphysically fundamental, it is explanatorily suspect (Reductionism). They refuse to accept **ontological dependence without explanatory reduction.**

  ### What Would Move the Needle?

  A formal result about projectibility will not solve this, because projectibility is interest-relative. A clarification of mechanistic explanation is the only viable path, but it requires a specific shift.

  **1. Why Formal Results Fail**
  You cannot prove mathematically whether a disjunction is a "natural kind." That is a philosophical criterion, not a logical one. You can formalize the relationship between $M$ and $\{P_1, P_2\}$, but whether that relationship counts as "reduction" depends on your prior definition of reduction.

  **2. The Path to Progress: Mechanistic Abstraction**
  Progress requires dissolving the dichotomy between "real physical kind" and "useful functional fiction." This is currently happening in the **New Mechanism** philosophy of science (e.g., Craver, Bechtel).

  Progress looks like demonstrating how **abstraction layers** work in successful sciences without invoking dualism.
  *   **The Argument:** In computer science, we accept that a "logic gate" is real and causal, even though it is multiply realizable (vacuum tubes, transistors, relays). We do not say the logic gate is an illusion, nor do we say it is independent of physics. We say it is a **mechanistically constrained abstraction**.
  *   **The Requirement:** We need a rigorous account of how higher-level properties (functional states) can be **ontologically grounded** in lower-level properties (neurons) while retaining **causal efficacy** at their own level.
  *   **The Criterion:** A mental state is "real" if manipulating the functional variable (e.g., changing the belief) reliably changes the outcome, *regardless* of the physical implementation, provided the implementation satisfies the structural constraints of the function.

  **3. Is the Question Badly Posed?**
  Yes, in its traditional form.
  The question "Are mental states functional or physical?" assumes a zero-sum game. It assumes that if functionalism is right, reductionism must be wrong.
  *   **Better Question:** "Under what conditions do functional abstractions capture causal structures that are invisible at the physical level?"

  ### Summary of the Diagnosis
  The debate stalls because it is a proxy war over **non-reductive physicalism**.
  *   **Reductionists** fear that accepting functional kinds opens the door to dualism (if mental kinds aren't physical kinds, what are they?).
  *   **Functionalists** fear that accepting reduction kills psychology (if pain is just C-fibers, psychology becomes neuroscience).

  **What Progress Looks Like:**
  Progress will not come from arguing about aliens or silicon. It will come from **case studies in successful inter-level explanation**.
  If philosophers of neuroscience can show exactly *how* a neural mechanism implements a computational function without requiring type-identity (e.g., via **realization relations** rather than identity relations), the metaphysical anxiety dissolves.

  We need to stop asking "Is the mind *really* functional?" and start asking "Does the functional description track a **causal invariant** across physical variations?" If the answer is yes, the functional kind is as "real" as a biological species (which is also multiply realizable at the genetic level), and the reductionist demand for physical homogeneity is revealed as an outdated view of how laws work.

  **Verdict:** The question is badly posed because it assumes metaphysical priority dictates explanatory utility. Progress requires showing that explanatory utility can validate ontological status *within* a physicalist framework, via a theory of **mechanistic levels** rather than **substance kinds**.
