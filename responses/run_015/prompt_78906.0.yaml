answer: |-
  The notification chimed at 4:13 PM. Five million dollars. It sat in her checking account, liquid and irrevocable. The wire had cleared before Elena had even finished signing the third page of the contract.

  Mr. Vane had watched her sign with the detached amusement of a man watching a bird fly into a window. He was a creature of sharp angles and expensive wool, sitting across from her in a office that smelled of ozone and old paper.

  "The condition is simple, Elena," Vane had said, tapping the contract. "Tonight, at midnight, you must genuinely intend to drink the toxin tomorrow at 2:00 PM. Not promise. *Intend.*"

  "And the money?"

  "Yours. Already transferred. We don't check tomorrow. We check tonight." He had gestured to a small device on his desk, a matte-black box with a single biometric scanner. "It measures galvanic skin response, pupil dilation, micro-tremors. It knows the difference between a lie and a plan."

  Elena had placed her hand on the scanner. She had thought of the money, of the debt, of the freedom. She had focused her mind on the vial sitting on Vane's desk—a thick, amber liquid that promised twelve hours of vomiting and blinding migraine. She had pushed the thought of drinking it into the center of her consciousness. The machine had beeped green.

  But then Vane had slid the second page over. The wrinkle.

  "Intentions are cheap," Vane had said. "We tell ourselves we'll quit smoking, we'll write the novel, we'll leave the spouse. To prove this isn't just daydreaming, you must wager."

  The terms were brutal. Of the five million, two and a half was held in escrow. It was an even-odds bet. If she drank the toxin tomorrow, the escrow released. If she did not, the escrow reverted to Vane.

  "I pay the payout either way," Vane had said, standing up. "The initial transfer is yours regardless of tomorrow. But the bet settles on action. You are betting on yourself, Elena. Most people can intend. Fewer can predict."

  Now, in her apartment, the money was real. She could buy the house. She could pay the loans. But the second half of her fortune was hanging on a future action that made no sense.

  Midnight approached. The deadline for the intention check was technically passed—the machine had cleared her—but the psychological deadline was now. To win the bet, she had to drink. But the money was already in her account. There was no reward for drinking, only pain. There was no penalty for not drinking, except the loss of the escrowed half.

  But losing the escrow was just losing money she already technically possessed. It was a loss, yes, but drinking the toxin was physical agony. A rational agent, tomorrow afternoon, would look at the vial and see no reason to drink. The money was safe either way. The pain was avoidable. Therefore, tomorrow Elena would not drink.

  But if tomorrow Elena would not drink, then tonight Elena could not *intend* to drink. You cannot intend to do what you know you will not do. Intention requires a belief in your own future agency. If she knew she was the kind of person who would keep the money and spare the pain, she was lying to the machine tonight.

  She sat on her sofa, the amber vial on the coffee table. It looked like urine. It looked like poison.

  She tried to force the intention. She tried to convince herself that she was the kind of person who honored a wager, even a foolish one. She tried to bind her future self. But she knew herself. She was pragmatic. She was tired. Tomorrow, when the headache started just from looking at the glass, she would pour it down the sink.

  If she predicted she would pour it down the sink, she couldn't intend to drink it.
  If she couldn't intend to drink it, she was a liar.
  If she was a liar, did she deserve the first two and a half million?

  The gap opened up inside her chest. It was the space between *I will* and *I won't*. It was the space between the self that signs the contract and the self that lives with it.

  She went to bed. She slept fitfully, dreaming of numbers that turned into liquid and burned her throat.

  She woke at 1:00 PM. The sun was harsh. The bank app on her phone showed the full five million. It was hers. The escrow was a ghost, a potentiality.

  She made coffee. Her hand shook. She wasn't shaking from fear of the toxin; she was shaking from the cognitive dissonance. She was walking toward a cliff she had no reason to jump off.

  At 1:45 PM, she sat at her kitchen table. The vial was next to a clean glass. The contract was on the table, the wager clause highlighted.

  *Even odds.*

  If she didn't drink, she lost $2.5 million.
  If she did drink, she gained $2.5 million (by keeping what was hers) and twelve hours of hell.

  But the money was already in the account. Losing the escrow wasn't losing cash from her pocket; it was failing to acquire *extra* cash. Was twelve hours of agony worth $2.5 million? To a rational mind, perhaps. But the rational mind knew the agony was guaranteed and the money was already spent in her imagination.

  No, the real issue wasn't the money. It was the prediction.

  Vane had said: *Most people can intend. Fewer can predict.*

  If she didn't drink, she proved Vane right. She proved that her intention was a lie. She proved that her future self was a stranger who wouldn't honor the debts of her past self. She would be rich, but she would be fragmented. A collection of selves that didn't speak to one another.

  If she drank, she validated the intention. She made the past self and the future self one continuous line. But she would be doing it for no reason other than consistency. She would be punishing her body to satisfy a logical loop.

  1:55 PM.

  She poured the liquid. It smelled of sulfur and rotting almonds. Her stomach turned. This was the prediction kicking in. Her body knew what her mind was debating. Her body knew she wouldn't do it. Her gag reflex was already betting against her.

  She picked up the glass. Her hand was steady now.

  She realized the trap wasn't the money. The trap was the integrity of the will. If she put the glass down, she admitted that she was not a creature of intention, but merely a creature of impulse. She would be rich, but she would be hollow. The gap between intending and predicting would become a canyon. She would never be able to trust her own promises again. Every time she said "I will," a voice in the back of her head would whisper, "Unless it hurts."

  If she drank, she proved she could bridge the gap. She could intend the irrational and execute it. She could be a person whose word was a law of physics, even against her own biology.

  But why?

  There was no why. That was the point.

  1:58 PM.

  She looked at the glass. She thought of Vane, sitting in his ozone-smelling office, waiting for the data. He didn't care if she drank. He paid out either way. He was just watching to see if she could break herself.

  She thought of the money. It was just numbers. It was already there.
  She thought of the pain. It was real. It was waiting.

  To drink was to admit that the intention was real. To not drink was to admit that the intention was a fiction.

  If she didn't drink, she kept her health and lost half the fortune. She would live comfortably, knowing she was a fraud.
  If she drank, she kept the fortune and lost her health. She would suffer, knowing she was whole.

  It wasn't a choice between pain and pleasure. It was a choice between being a liar and being a fool.

  1:59 PM.

  Her throat tightened. The prediction screamed at her: *Put it down. You're sane. You're smart. You have the money.*

  The intention whispered: *You said you would.*

  She closed her eyes. She had to stop predicting. She had to stop calculating. To drink, she had to cease being a rational agent for sixty seconds. She had to become a machine that executed code written last night.

  She lifted the glass.

  The smell was overwhelming. Her stomach heaved. This was the cost of integrity. It wasn't noble. It was visceral.

  She didn't toast. She didn't hesitate. Hesitation was the prediction winning.

  She tilted the glass.

  The liquid hit her tongue and it tasted like copper and fire. She swallowed. It burned all the way down, a trail of acid.

  She set the glass down. It was empty.

  She waited.

  It took forty seconds for the cramp to start. It took two minutes for the sweating to begin. She stood up and walked to the sink, gripping the porcelain as her vision blurred.

  The money was in the bank. The bet was won. The intention was fulfilled.

  She retched into the sink, her body convulsing, rejecting the proof of her own will. She was in agony, and she was rich, and she was exactly who she said she was.

  As the headache bloomed behind her eyes, a dark thought surfaced through the nausea. She had done it. She had closed the gap. But as she slid to the floor, shivering in the cold tile, she wondered if the woman who drank the poison was the same woman who signed the contract, or if she had just destroyed the one to save the other.

  Vane would never know the difference. He would just see the settlement.

  Elena closed her eyes and let the pain take her. She had bought her own consistency, and the price was everything she had left.
