answer: |-
  ### Q&A Prep Sheet: Chesterton's Fence as Epistemic Burden

  **Strategy Note:** Your thesis rests on the *invisibility* of function. Every objection will try to make the function visible (via data, history, or reversal). Your defense must rest on the *cost* of making it visible. Do not defend the fence; defend the cost of the map.

  ---

  #### Pre-emptive Concessions (First 2 Minutes)
  *Say these before opening the floor. It disarms the two biggest attacks.*

  1.  **On Injustice:** "Chesterton's Fence applies only to functions, not to power. If a rule was erected to subordinate a class, its 'layering' is irrelevant. I am not arguing for the preservation of unjust fences, only for a higher burden of proof before removing complex ones."
  2.  **On Reversibility:** "My argument assumes high irreversibility. In software or low-stakes administrative rules where 'ctrl-z' exists, the novitiate is wasteful. I am talking about social institutions where culture, once broken, does not recompile."

  ---

  #### The Objections (Ordered by Damage to the Three Moves)

  **1. The Version Control Objection (Software Engineer / Behavioral Econ)**
  *   **The Question:** "You're treating institutions like monolithic stone when they're more like codebases. In engineering, we don't apprentice for a year before refactoring; we branch, test, and revert if it breaks. If the hospital rule is so fragile, why not run a three-month pilot with a rollback clause rather than demanding a novitiate? Isn't Chesterton just what you get when institutions lack version control?"
  *   **The Reply:** "Version control works on stateless systems; institutions are stateful. When you revert code, the users are the same. When you revert a hospital culture, the trust is broken, the cynicism remains, and the 'corridor conversation' doesn't magically restart because you reinstated the rule. The novitiate isn't about testing the rule; it's about learning the *dependencies* that aren't in the manual. You can't A/B test a norm."
  *   **Vulnerability:** **Soft.** Distinguishing "culture" from "process" is messy. If the Medical Director says, "We actually *did* pilot this and it failed," your theory looks post-hoc.

  **2. The Injustice Objection (Liberal Egalitarian)**
  *   **The Question:** "You say this isn't status quo bias, but 'functional layering' is the perfect excuse for oppression. A rule excluding women might 'layer' a function of 'team cohesion' over decades. By demanding a genealogy plus a no-migration showing, aren't you just making it prohibitively expensive to dismantle rules that were unjust from the outset but have since become useful to the powerful?"
  *   **The Reply:** "The two-key showing requires a genealogy. If the origin is unjust, the first key fails, and the fence comes down. The novitiate applies only to rules with legitimate origins that have accrued invisible functions. I'm protecting the *accrued wisdom*, not the *original sin*."
  *   **Vulnerability:** **Begs the Question.** Determining "origin" is itself an interpretive act. The theorist will press you on who decides the genealogy is clean.

  **3. The Epistemic Privilege Objection (Political Theorist)**
  *   **The Question:** "Burke argued for the wisdom of the species, not the guild. Your novitiate requirement turns an epistemic claim about tacit knowledge into a procedural claim about who gets to speak. You're effectively saying only insiders can critique the interior. Doesn't this silence the very outsider perspective needed to spot the articulacy trap in the first place?"
  *   **The Reply:** "It's not about who gets to speak, but what counts as evidence. An outsider can argue for abolition, but they cannot submit the *absence of function* as proof without having lived the function. It raises the evidentiary bar, not the standing bar. You can speak, but you can't claim to know the negative."
  *   **Vulnerability:** **Concede.** This is the hardest hit. You are effectively creating a guild barrier. Concede that this limits democratic deliberation but argue it's a trade-off for stability.

  **4. The Just-So Story Objection (Institutional Economist)**
  *   **The Question:** "Functional layering is unfalsifiable. If I say the rule has a hidden function, and you say it doesn't, how do we adjudicate? Isn't 'layering' just a label for a just-so story told by incumbents to protect their turf? What evidence counts as 'affirmative demonstration' that no function has migrated?"
  *   **The Reply:** "The burden is on the abolitionist to show the negative, which is hard by design. But the evidence is in the *friction*. If you remove the rule and productivity drops without a causal explanation, that's the signal. We look for the anomaly, not the narrative."
  *   **Vulnerability:** **Soft.** "Friction" is hard to measure. Economists will want a model; you're offering a heuristic.

  **5. The Option Value Objection (Law & Econ)**
  *   **The Question:** "This sounds like real options theory dressed in philosophical clothing. You're saying the fence has option value because of irreversibility and uncertainty. Why do we need 'functional layering' and 'articulacy traps'? Why not just price the irreversibility and stop?"
  *   **The Reply:** "Option value assumes we can price the uncertainty. My claim is that the uncertainty is *inarticulate*. We can't price what we can't describe. The novitiate is a mechanism to reveal the price, not a calculation of it."
  *   **Vulnerability:** **Concede.** If they can model the novitiate cost as an option premium, your philosophical novelty diminishes, even if the policy prescription holds.

  **6. The Counter-Example Objection (Medical Director)**
  *   **The Question:** "I'm the Medical Director from your example. That rule doesn't catch errors in the corridor; it bottlenecks discharges and forces seniors to do clerical work. The 'invisible function' you posit is actually a visible inefficiency. If your theory can't distinguish between my lived experience and your theoretical layering, what use is it?"
  *   **The Reply:** "Then the two-key showing fails. If you can demonstrate the function *has not* migrated, or that the cost outweighs the hidden benefit, the fence comes down. The theory isn't 'keep the fence,' it's 'prove the fence is empty.' Your data might be that proof."
  *   **Vulnerability:** **High Risk.** If she has data, your example collapses. Be ready to let the example go to save the theory.

  **7. The Operationalization Objection (Practitioner / Policy Type)**
  *   **The Question:** "Let's say we accept the novitiate. Who administers it? How long is 'fixed period'? If the reformers have to apprentice to the bureaucracy before changing it, aren't you just guaranteeing that the bureaucracy will indoctrinate them into acceptance? Isn't this a recipe for regulatory capture?"
  *   **The Reply:** "It's a risk, but less than the risk of ignorant abolition. The period is fixed by the complexity of the rule, not the whims of the incumbents. And the goal isn't acceptance, it's *competence* to judge. We don't let people fly planes without training; why let them fly institutions?"
  *   **Vulnerability:** **Begs the Question.** Assumes the training reveals truth rather than enforcing conformity.

  **8. The Status Quo Bias Objection (Liberal Egalitarian / Econ)**
  *   **The Question:** "Even if there is an articulacy trap, isn't the cure worse than the disease? By systematically underweighting articulate reform arguments, aren't you institutionalizing a bias against progress? Maybe the articulacy trap is a feature of democracy, not a bug."
  *   **The Reply:** "Democracy trades in reasons. If the reasons are systematically asymmetric, the output is systematically flawed. I'm not biasing against progress; I'm biasing against *uninformed* progress. There's a difference."
  *   **Vulnerability:** **Soft.** "Uninformed" is doing a lot of heavy lifting here.

  ---

  #### The "Hope Nobody Asks" Question
  *Your guess was about which move is doing the work. The real killer is about the **Adjudicator**.*

  *   **The Question:** "You've built a system to correct for articulacy asymmetry, but you haven't told us who judges when the novitiate is complete or when the two-key showing is met. If the forum is biased toward articulate reasons, won't the *adjudication of your rules* also be biased toward articulate reasons? Haven't you just pushed the articulacy trap up one level?"
  *   **Why it hurts:** It suggests your solution replicates the problem it solves. If the judge can't hear the tacit knowledge either, the novitiate is pointless.
  *   **Prep:** "The adjudicator must also be a practitioner. The court itself must be subject to the articulacy correction." (This is weak, but it's the only move you have).

  ---

  #### Confidence Scores (0-10)
  1.  **Version Control:** 10 (The Engineer is primed for this; it's the modern counter-argument).
  2.  **Injustice:** 9 (Standard objection in policy schools; cannot be avoided).
  3.  **Epistemic Privilege:** 8 (The Theorist's job is to find this).
  4.  **Just-So Story:** 8 (Economists hate unfalsifiable claims).
  5.  **Option Value:** 7 (Law & Econ will try to translate it).
  6.  **Counter-Example:** 6 (Depends on the Director's mood, but high impact).
  7.  **Operationalization:** 7 (Practitioners care about implementation).
  8.  **Status Quo Bias:** 6 (Often subsumed by the Injustice objection).

  ---

  #### Closing Analysis: The Weakest Reply
  **The Version Control Reply (Objection 1) is the least likely to survive follow-up.**
  Distinguishing "stateless code" from "stateful culture" is theoretically sound but empirically messy. If the Engineer presses you on *why* culture can't be versioned (e.g., via clear communication, documentation, re-onboarding), you risk sounding like you're mystifying institutions to protect them. They will argue that "culture" is just "undocumented code," and the solution is better documentation, not apprenticeship. You have no good answer for why documentation *cannot* capture the corridor conversation other than asserting it can't. Be prepared to concede that in *highly documented* environments, the novitiate requirement weakens.
