  ### The Social Kind Decision Tree

  To sort out whether your timebank hours are "money" or "favours," you need to agree on what makes *any* social thing (money, race, gender) real. Below are five concrete questions. Answering them creates a path through the logical space. There are 32 possible answer combinations (2⁵), but only seven represent coherent positions people actually hold. The rest are empty because they contradict themselves.

  #### The Five Separating Questions

  1.  **The Corner Shop Test:** If everyone accepts tokens at the shop but privately thinks they are worthless, do the tokens still have value?
      *   *No:* Value requires honest personal belief.
      *   *Yes:* Value is about public function, not private thought.
  2.  **The Tax Office Test:** If a currency is collapsing but the government forces you to use it for taxes, is it real money?
      *   *No:* Government force isn't enough.
      *   *Yes:* State authority makes it real.
  3.  **The Mortgage Test:** If a racial category hasn't been officially used for 60 years but still predicts who gets loans, is that category still real?
      *   *No:* It needs official current status.
      *   *Yes:* Lasting effects make it real.
  4.  **The Algorithm Test:** If a computer sorts people for jobs in a way no human understands, is that sorting a real social category?
      *   *No:* Humans must understand the category.
      *   *Yes:* Material impact is enough.
  5.  **The Ceremony Test:** If a ceremony assigns you a gender you don't feel, is that gender real for you?
      *   *No:* Your internal sense overrides the ceremony.
      *   *Yes:* External assignment rules.

  ---

  #### The Seven Positions (Leaves)

  Follow the Yes/No path from Question 1 down to find your position.

  **1. The Sincere Collective** (Q1: No)
  *   **View:** Social kinds only exist if people genuinely believe in them.
  *   **Awkward Commitment:** A market crash only happens when people admit they stopped believing, not when prices fall.
  *   **Money Verdict:** Your hours are *not* money unless members truly value them as currency.

  **2. The State Makers** (Q1: Yes → Q2: Yes)
  *   **View:** Law and authority create reality, regardless of belief or market function.
  *   **Awkward Commitment:** Illegal cash markets are imaginary until the police catch you.
  *   **Money Verdict:** Your hours are *not* money unless the government regulates them.

  **3. The Paper Realists** (Q1: Yes → Q2: No → Q3: No)
  *   **View:** Only officially recognized, current categories count as real.
  *   **Awkward Commitment:** Discrimination stops being real the moment the law changes, even if bankers still deny loans.
  *   **Money Verdict:** Your hours are *not* money unless formally registered as currency.

  **4. The Conscious Constructivists** (Q1: Yes → Q2: No → Q3: Yes → Q4: No)
  *   **View:** Effects make things real, but humans must be aware of the category.
  *   **Awkward Commitment:** A secret algorithm controlling your life isn't real until someone reads the code.
  *   **Money Verdict:** Your hours *are* money if everyone knows and agrees they function as such.

  **5. The Blind Materialists** (Q1: Yes → Q2: No → Q3: Yes → Q4: Yes → Q5: Yes)
  *   **View:** Anything that shapes material outcomes is real, even if hidden or rejected by the subject.
  *   **Awkward Commitment:** You can be assigned a race or gender by a system that hates you, regardless of your own identity.
  *   **Money Verdict:** Your hours *are* money because they function like it in shops, regardless of your intent.

  **6. The Rule Followers** (Q1: Yes → Q2: No → Q3: Yes → Q4: Yes → Q5: No → State Authority)
  *   **View:** External rules (state/ceremony) define categories, overriding internal sense.
  *   **Awkward Commitment:** You are what the certificate says, even if you scream otherwise.
  *   **Money Verdict:** Your hours are *not* money unless issued by a licensed body.
  *   *(Note: Indistinguishable from "The State Makers" in practice, but differs on why authority matters.)*

  **7. The Self-Definers** (Q1: Yes → Q2: No → Q3: Yes → Q4: Yes → Q5: No → Internal Authority)
  *   **View:** External rules only stick if the individual accepts them.
  *   **Awkward Commitment:** If you feel rich, you are rich, even if your bank account says zero.
  *   **Money Verdict:** Your hours *are* money if the spenders feel they are money.
  *   *(Note: Indistinguishable from "The Conscious Constructivists" regarding money, but diverges on gender.)*

  ---

  #### Empty Combinations (The Logical Space)

  There are 32 possible answer combinations to the five questions. Only the seven paths above are occupied. The rest are empty for three reasons:

  *   **Incoherent (15 combinations):** These involve contradicting yourself. For example, answering "No" to Q1 (Belief is required) but "Yes" to Q4 (Human awareness not required) is logically unstable—if belief matters, awareness must matter.
  *   **Unattractive (6 combinations):** These lead to positions nobody wants. For example, answering "No" to Q3 (Effects don't matter) and "No" to Q2 (State doesn't matter) leaves you with a category that has no power, no law, and no effect—it's essentially nothing.
  *   **Unexplored (4 combinations):** These are hybrid views (e.g., "State matters AND Belief matters") that the tree forces you to choose between. In a meeting, you might find someone straddling Q1 and Q2; this taxonomy treats them as "The State Makers" for simplicity.

  ---

  #### Indistinguishable Leaves

  *   **The State Makers vs. The Rule Followers:** Both conclude that external authority defines reality. The distinction is theoretical (law vs. ceremony), but for your timebank, both mean "we need a license."
  *   **The Conscious Constructivists vs. The Self-Definers:** Both require human awareness. The distinction matters for gender (community vs. individual), but for money, both mean "if the shopkeepers accept it, it's money."

  The first question (Corner Shop), if we answered it the other way, is the one that would actually change whether we think we're issuing money.
