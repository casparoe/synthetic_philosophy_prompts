answer: |-
  1. "Where it breaks"
  The argument fails at the inference from (3) to (4). Your flatmate equivocates on the word "ranking." Step (3) is technically true: any real-valued function induces an ordering. But Step (4) claims that ordering states by *disvalue* (impact) is precisely a specification of *value* (what is good). This is a category error. A metric measures distance, not desirability. In optimization, a regularizer (like an L2 penalty) orders parameters by magnitude, but it does not specify the model's goal. Similarly, an impact measure orders trajectories by deviation from a baseline, not by moral worth.

  The flatmate assumes that because the agent optimizes against the penalty, the penalty must represent a complete theory of the good. But constraints are not objectives. Telling an agent "minimize distance from the status quo" restricts the search space; it does not define the peak. You can have a partial constraint without a complete telos. The argument is valid only if you accept that *any* preference constraint constitutes a full moral theory. Rejecting (4) allows you to maintain that impact is a heuristic constraint on *how* goals are pursued, not a specification of *which* goals are worth pursuing. The break is logical: geometry is not axiology.

  2. "Why that step looked fine"
  Premise (4) is plausible because, in Reinforcement Learning, any scalar signal the agent minimizes functionally acts as a reward component. If the agent sacrifices task performance to minimize impact, impact *becomes* part of its effective utility function. From the outside, the agent behaves as if it values low-impact states intrinsically. Furthermore, choosing the baseline (the "inaction" policy) is itself a normative choice. Why is the status quo the reference point? That assumes the current state is neutral or safe, which is a value judgment. Smart researchers accept (4) because, under optimization pressure, the distinction between "constraint" and "objective" blurs. All metrics exert value-like pressure on the system, making it hard to claim they are value-neutral in practice.

  3. "Price list"
  (1) **Rejecting:** You admit impact penalties might just tax action generally. **Cost:** The approach fails to distinguish side-effects from task completion, rendering it useless for safety.
  (3) **Rejecting:** You distinguish metrics from utilities. **Cost:** You must explain why optimization doesn't turn metrics into values. Low technical cost, but requires careful architecture.
  (4) **Rejecting:** You deny impact equals value spec. **Cost:** You must define "value" narrowly as "task objective," ignoring constraints. This commits you to a view where safety constraints are distinct from moral goals.
  (5) **Rejecting (Your preference):** You admit impact encodes *some* value but argue it's easier than *full* value. **Cost:** You commit to "partial alignment" being sufficient for safety. This is the pragmatic bet: we don't need perfect morality, just enough to avoid catastrophe. It concedes the flatmate's theoretical point (yes, it encodes value) but denies the practical conclusion (therefore it's redundant).
  (6) **Rejecting:** You claim non-neutrality is possible. **Cost:** You must solve the baseline selection problem without circularity.
  Rejecting (5) is the most honest trade. It admits the flatmate is theoretically right (impact encodes values) but practically wrong (we still need it because full value is hard).

  4. "Does undo-cost escape?"
  Your "undo-cost" proposal is essentially the "reversibility" or "relative reachability" penalty proposed by Krakovna et al. (2018), and later refined as "Attainable Utility Preservation." It escapes the "distance" critique by focusing on optionality rather than state similarity. Instead of measuring how different the world looks, it measures how many future states become unreachable after an action. However, the flatmate's objection holds: defining "restored" or "reachable" is value-laden. If you break a vase, the state "broken vase" is reachable, but "unbroken vase" is not. Penalizing this assumes preserving the unbroken state is good. If a tree falls naturally, your metric must ignore it, requiring a counterfactual baseline. This requires modeling "what would have happened," which is computationally hard and relies on causal assumptions that encode values (e.g., what counts as an intervention). It reduces value-ladenness but doesn't eliminate it. You have moved the value judgment from "what is bad" to "what counts as undoing," which is still a normative choice.

  5. "Settled vs contested"
  **Settled:** Impact measures require a baseline; choosing a baseline is normative. Pure value-neutrality is impossible in optimization. Any penalty function exerts some selection pressure.
  **Contested:** Whether partial value specifications (like impact penalties) are sufficient for safety. Some researchers (like your flatmate) think this is hopeless; others think it's a necessary heuristic. The generalization in (7) is highly contested. Ethicists distinguish between "do no harm" (non-maleficence) and "value specification." Claiming all ethics is either empty or complete is a philosophical stance, not a technical result.
  **Speculation:** My analysis assumes standard RL frameworks. If your flatmate works on formal verification, they might view (3) as stricter. Don't treat the flatmate's reductio as consensus. It's a strong skeptical argument, not a settled proof. The field remains open on whether "low-impact" is a viable path or a dead end.
