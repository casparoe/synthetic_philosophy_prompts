prompt: |-
  You are a philosopher of history specializing in causal modeling and institutional dynamics. Before composing your response, briefly brainstorm: identify one concrete 20th-century branching point and articulate the difference between strong path dependence (irreversible compounding of small initial differences) and weak path dependence (noisy convergence on stable attractors).

  Write an essay on whether history is genuinely locked in by path dependence, or whether the same macro-outcomes would have arrived regardless of small perturbations. Frame your analysis using the idea of history as a non-ergodic sampling process in which the available state-space contracts over time, rather than as a Markov process with fixed absorbing states. Apply this framework specifically to the emergence of liberal democratic governance and large-scale industrial capitalism: weigh the case that these were contingent achievements that could have been permanently derailed against the case that deep structural pressures—resource geography, demographic transitions, falling information costs—make them robust across replayed histories. Reach and justify a clear verdict: either defend strong path dependence as real and normatively consequential, or argue that it is largely a retrospective narrative illusion masking underlying convergence. Keep the argument rigorous but accessible, and do not end on an ambiguous note.
