  For the structuralist, the verdict is confirmed because the "selection environment" of crisis and constitutional weakness successfully filtered for a nationalist dictator regardless of the specific agent, proving the regime type was overdetermined by conditions. For the Great Man theorist, the verdict is also confirmed because the removal of Hitler's specific psychopathology and organizational genius prevented the unique escalations of industrialized genocide and aggressive total war, proving the specific historical trajectory was underdetermined. The feature doing the work is the *ideological radicalization function*: structuralists view this as an inevitable output of systemic pressure, while Great Man theorists view it as a variable input dependent on individual agency. If you remove the structural pressures, no authoritarian arises; if you remove Hitler but keep the pressures, you get authoritarianism without the specific Holocaust. A Great Man defender would attack this case by arguing the structuralist is moving the goalposts, claiming that a generic authoritarian regime is not functionally equivalent to the Third Reich since the historical weight of the era rests on the unique extremity of the crimes and the war, not merely the loss of democracy.
