prompt: |-
  I'm a PhD student in moral philosophy, and I've been working through the literature on consequentialist cluelessness—not the standard global-scale examples, but its appearance in bureaucratic micro-decisions where an institution pretends to compute expected utility despite lacking any of the relevant causal data. I want a joke that actually turns on the logical structure of the problem: the gap between the information an agent would need to maximize value and the information it actually possesses, and the peculiar institutional confidence that fills that gap. To avoid something a model could recycle from common training examples, please set the joke in a specific invented scenario: a university graduate-review committee that evaluates a doctoral student's request to switch dissertation advisors by attempting to calculate the full downstream welfare effects—career trajectories, mental-health outcomes, citation networks, and the advisor's future grant success—then issues a formal denial letter stating that, although none of these variables are epistemically accessible, the expected utility is clearly maximized by keeping the student in place.

  The joke should be intelligible to someone who knows what consequentialist cluelessness is, but it should not name specific philosophers, cite papers, or ask for a bibliography. It needs to make the punchline depend on the committee's actual epistemic predicament—having neither the data nor the computational capacity—rather than on generic wordplay about "not knowing the future." Please deliver it in a single paragraph of no more than 100 words, with the punchline in the final sentence, and keep the setup focused on the institutional absurdity so that the humor lands for readers familiar with decision-theoretic ethics.
