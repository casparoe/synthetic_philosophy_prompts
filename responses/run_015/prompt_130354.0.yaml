answer: |-
  Your friend's taxonomy is sophisticated because it avoids the simplistic binary of "victory good, defeat bad." Instead, she is evaluating the *political function* of the defeat myth in the present day. Based on her four verdicts, she is likely operating on two intersecting principles: **Settlement Compatibility** (does the myth threaten the current political order?) and **Internal Cohesion** (does the myth rely on hunting internal traitors?).

  Here is the breakdown of those principles, their application to your 1961 hypothetical, and a test case to distinguish them.

  ### 1. The Two Governing Principles

  **Principle A: Settlement Compatibility (The Anti-Revanchism Rule)**
  *   **The Rule:** A myth of defeat is toxic if it is used to delegitimize the current political settlement or demand territorial revisionism. It is redeemable if it accepts the current borders/order and focuses on internal resilience or identity.
  *   **Fit with Precedents:**
      *   *Lost Cause:* Toxic. It sought to restore the pre-war racial hierarchy and undermine federal authority (revisionist).
      *   *Kosovo:* Toxic. It fueled irredentism (Greater Serbia) and framed the Ottoman (and later Yugoslav) settlement as an ongoing crime.
      *   *Masada:* Redeemable. It is a symbol of Jewish continuity and dignity, not a call to rebuild the fortress or fight Rome.
      *   *Dunkirk:* Redeemable. It was about saving the army to win the war, not reclaiming the French beachhead as a political goal today. It accepts the loss of the continent temporarily to save the island permanently.

  **Principle B: Internal Cohesion (The Anti-Scapegoating Rule)**
  *   **The Rule:** A myth of defeat is toxic if it explains the loss through a narrative of internal betrayal or treason. It is redeemable if it explains the loss through external odds, heroic sacrifice, or collective endurance.
  *   **Fit with Precedents:**
      *   *Lost Cause:* Toxic. Often relied on the idea that the South was "stabbed in the back" by superior numbers or traitorous generals, rather than the moral failure of slavery.
      *   *Kosovo:* Toxic. Central to the myth is the betrayal of Prince Lazar by Vuk Branković. This creates a template for purging "traitors" within the nation.
      *   *Masada:* Redeemable. The narrative is one of collective, unified choice (suicide over surrender). There is no internal traitor; the enemy is purely external.
      *   *Dunkirk:* Redeemable. The "Little Ships" narrative emphasizes civilian-military unity. There is no fifth column; the failure was strategic, not moral.

  ### 2. Analysis of the 1961 Hypothetical

  Your hypothetical case contains a tension. The *surface* narrative ("patient, non-violent persistence") sounds like Dunkirk/Masada (Principle A: Resilience). However, the *structural* narrative ("blame a local commander," "separatists claim illegitimacy") sounds like Kosovo/Lost Cause.

  *   **Prediction via Principle A (Settlement):** **Toxic.**
      Although the State claims to accept the 1989 settlement, the myth explicitly provides the ammunition ("original treason") for separatists to declare that settlement illegitimate. By teaching that the current order rests on a betrayal, the State is actively undermining the legitimacy of its own borders. This mirrors Kosovo, where the myth made compromise impossible.
  *   **Prediction via Principle B (Cohesion):** **Toxic.**
      The explicit inclusion of a "local commander who allegedly betrayed the marchers" is a direct parallel to the Vuk Branković element of the Kosovo myth. It invites the citizenry to look for enemies within rather than focusing on the external barrier.

  **The Consistent Verdict:**
  You should expect your friend to judge this myth as **Toxic**.

  While the "non-violent persistence" element mimics Dunkirk, the *mechanism* of the myth (Betrayal) and its *political utility* (delegitimizing the 1989 order) align perfectly with her two toxic cases (Confederacy and Kosovo). For her, a myth that sustains a separatist movement by alleging foundational treason is functionally identical to the Kosovo myth, regardless of the "peaceful transition" wrapper.

  ### 3. Underdetermination and Implicit Adoptions

  If her precedents genuinely underdetermine the case, her choice will reveal which principle she prioritizes when they conflict.

  *   **If she judges it Redeemable:** She is implicitly adopting a **"State Intent" Principle**. She would be arguing that because the *Official* narrative preaches persistence and accepts the 1989 settlement, the separatist interpretation is a misuse that doesn't taint the myth itself. This prioritizes *Settlement Compatibility* (officially) over *Internal Cohesion*. She would be deciding that the "Betrayal" element is acceptable if it doesn't *officially* mandate revanchism.
  *   **If she judges it Toxic (as predicted):** She is implicitly adopting a **"Social Function" Principle**. She argues that a myth is defined by how it is *used* in the ecosystem, not just how the State intends it. If the myth's logic (betrayal) naturally fuels separatism, the State's disclaimer ("we accept 1989") is irrelevant. This prioritizes *Internal Cohesion* and the *Real-world Effect* over official intent.

  ### 4. The Distinguishing Hypothetical Case

  To distinguish whether **Principle A (Revanchism)** or **Principle B (Betrayal)** is the true driver of her ethics, propose the following case. This case isolates Betrayal from Revanchism.

  **The Case:**
  > "A nation fights a defensive war and loses a border province. The peace treaty is signed and universally accepted as permanent; no political party, mainstream or fringe, claims the land back. However, the national myth taught in schools explains the defeat solely as the result of a specific ethnic minority within the *remaining* borders sabotaging the war effort. The myth is used to justify strict loyalty oaths and surveillance of that minority, but never to reclaim the lost province."

  **Why this distinguishes the rules:**
  *   **Principle A (Revanchism) predicts: Redeemable.** The political settlement is stable; there is no irredentism or threat to the borders. The myth accepts the loss of the province.
  *   **Principle B (Betrayal/Cohesion) predicts: Toxic.** The myth relies entirely on internal scapegoating and creates a second-class citizenship for the "saboteur" minority, mirroring the internal purging dynamic of the Kosovo and Lost Cause myths.

  If she calls this **Toxic**, then **Internal Cohesion (Betrayal)** is her primary moral filter. If she calls it **Redeemable**, then **Settlement Compatibility (Revanchism)** is her primary filter. Given her stance on Kosovo (which is toxic for *both* reasons), this case will force her to reveal which sin she considers unforgivable: wanting land back, or hunting traitors at home.
