      *   **Mechanism:** Certain beliefs are so practically entrenched that abandoning them dissolves the conditions for meaningful doubt/agency. Moore showing his hands isn't question-begging; it's showing that skeptical demands disable the agency required to make them.
      *   **Key Distinction:** Practical commitment (acting as if $p$) vs. Doxastic commitment (believing $p$).
      *   **Requests:**
