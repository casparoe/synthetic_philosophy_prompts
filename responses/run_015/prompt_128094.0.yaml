      *   The user is essentially arguing for a *transcendental pragmatic* justification of Moorean common sense.
      *   *Strength:* It avoids the epistemic circularity charge by shifting the ground from "proof of truth" to "conditions of possibility for inquiry."
      *   *Weakness:* It risks conflating *need to believe* with *truth*, and it might be vulnerable to historical counterexamples where entrenched beliefs *were* abandoned.

