      *   *Triviality:* $T$ vs. $T \& \text{Observation O is true}$. Or $T$ vs. "An evil demon makes it look like $T$." Philosophers usually dismiss these as not "serious" theories. Does this kill SUT? No, just requires refinement (theories must be distinct in meaning/structure, not just output).
      *   *Laudan & Leplin:* Empirical equivalence is context-dependent. New instruments break ties. SUT says *no possible* evidence breaks ties. L&L attack the "possible" part.
      *   *History:* Science *does* resolve disputes. Does this mean SUT is false? SUT defender says: "You resolved *this* version, but a tweaked version remains." This looks like moving the goalposts.
      *   *Non-empirical virtues:* Inference to the Best Explanation (IBE). If simplicity tracks truth, SUT falls. But can we prove simplicity tracks truth without circularity?
      *   *Unfalsifiability:* If SUT says "For any evidence E...", and E never comes, is it metaphysical? If it's a logical thesis, maybe that's okay. But if it implies skepticism about scientific knowledge, it needs bite.
      *   *Ranking:*
          *   Fatal: Proof that non-empirical virtues are truth-conducive (hard to get). Proof that algorithmic rivals are illegitimate (semantic arguments).
