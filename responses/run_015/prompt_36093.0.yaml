  *(Self-Correction during drafting)*: I need to be careful with the "Fatal" category. In philosophy, few things are truly "fatal." I should frame "Fatal" as "If established, this logically negates the thesis," acknowledging that establishing it is the hard part. The most "fatal" conceptual blow is demonstrating that empirical equivalence does not entail evidential equivalence (due to non-empirical virtues).

