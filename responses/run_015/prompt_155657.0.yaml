prompt: |-
  In the group I work in, work on learned systems is governed by two conventions that sit awkwardly together, and I would like the implicit theory behind them made explicit.

  The first convention governs postmortems. When a deployed system misbehaves, the write-up must explain the behaviour at the level of mechanism: which component, which training signal, which data, which decoding choice produced the output. Reviewers send back any write-up that says the system believed something, wanted something, decided something, or was trying to do something, on the grounds that such language is anthropomorphic and therefore not an explanation.

  The second convention governs capability and risk assessment, and here the same reviewers use agent vocabulary freely, because the safety case depends on it. Evaluations ask whether the system would mislead a grader if it could gain by doing so, whether it pursues a goal across contexts it was never trained on, whether it is deliberately underperforming on capability tests, whether it tracks what a user does and does not know. A system described purely as a distribution over token sequences is not something a deception risk assessment can be written about at all — yet the model card for that same system describes it as "just" a statistical predictor.

  I have started calling the movement between these conventions stance arbitrage: the intentional stance is treated as licensed for prediction and alarm, and as illicit for explanation and excuse. Assume the familiar three-way distinction between the physical, design, and intentional stances.

  1. Reconstruct the implicit theory of intentional ascription that this practice needs. In particular, does it presuppose that intentional claims can predict without explaining, and can that asymmetry be defended? Give the strongest version of the theory, and distinguish what the practice strictly presupposes from what merely fits it comfortably.

  2. Say which rival views the practice quietly rules out, and where it is underdetermined. Could an instrumentalist, a realist about model beliefs, and someone who regards the vocabulary as useful fiction all sign off on both conventions? Identify the points at which the conventions are philosophically silent and the practice could have gone another way.

  3. Test the reconstructed theory against three systems where the stances pull apart: a thermostat; a chess engine's evaluation function, whose mechanics are fully known; and a large model whose behaviour across many prompts is best predicted by attributing to it a goal it was never trained to have, where no mechanism is known. Does the theory deliver the verdicts the practice actually gives, and is that pattern of verdicts defensible?

  4. Address the real-patterns question. Suppose we say that an intentional ascription is warranted when it compresses a system's behaviour into a description cheaper than any mechanical description available, and that this compression is what makes the pattern real rather than projected. Notice that whether a compression is available depends on who is asking — what they have measured, what they already know, what they can compute — so that a pattern may be real for the safety team and not for the interpretability team. Does the practice have the resources to handle that relativity, or does the relativity undermine the ban in the first convention?

  5. Finally, the reform question. If the ban on intentional explanation were lifted, what exactly would change in a postmortem — which new claims would become checkable, by what test, and what kind of evidence would settle them — and what would not change? And if instead the practice dropped intentional vocabulary from risk assessment, what would be lost that no design-stance description could replace?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Context:** A group working on learned systems (AI/ML).
      *   **The Conflict:** Two conflicting conventions regarding the "Intentional Stance" (Dennett's terminology).
          *   *Convention 1 (Postmortems):* Ban intentional language (beliefs, wants, decisions). Demand mechanistic explanation (physical/design stance). Rationale: Anthropomorphism $\neq$ Explanation.
          *   *Convention 2 (Risk/Capability):* Require intentional language (deception, goal pursuit, tracking knowledge). Rationale: Safety cases need it; statistical descriptions are insufficient for risk.
      *   **User's Term:** "Stance Arbitrage" (using intentional stance for prediction/alarm, banning it for explanation/excuse).
      *   **Task:** Five specific questions to analyze this practice philosophically and practically.
          1.  Reconstruct the implicit theory of intentional ascription (Prediction without Explanation?).
          2.  Identify rival views ruled out/underdetermined (Instrumentalism, Realism, Fictionalism).
          3.  Test against three cases (Thermostat, Chess Engine, Emergent Goal LLM).
          4.  Address the "Real Patterns" question (Compression/Relativity).
          5.  Reform question (What changes if bans are lifted/dropped?).

  2.  **Analyze Question 1: Implicit Theory of Intentional Ascription:**

      *   *Core Tension:* Intentional claims predict (Convention 2) but don't explain (Convention 1).
      *   *Implicit Theory:* It sounds like a specific form of *Instrumentalism* or *Predictive Functionalism*. The intentional stance is a heuristic tool for *external* observers to anticipate behavior in novel contexts (especially adversarial ones), but it is not *causally efficacious* within the system.
      *   *Prediction without Explanation:* Yes, this is presupposed. To explain is to show the causal chain (weights $\to$ activation $\to$ output). To predict risk is to model the input-output mapping as if it were an agent.
      *   *Defense:* The asymmetry can be defended via *levels of abstraction*. Mechanistic explanation is about *how* the computation happened. Intentional prediction is about *what* the computation optimizes for in a high-dimensional space.
      *   *Strict Presupposition vs. Comfortable Fit:*
          *   *Strict:* Intentional states are not causal drivers in the ontology of the code.
          *   *Comfortable:* Intentional states might emerge, but we treat them as epistemic tools for safety, not ontological truths for engineering.

  3.  **Analyze Question 2: Rival Views & Underdetermination:**

      *   *Who can sign off?*
          *   *Instrumentalist:* Yes. Fits perfectly. Beliefs are just useful fictions for prediction.
          *   *Realist (about model beliefs):* Trouble. If beliefs are real, why ban them in postmortems? They would argue the ban hinders true understanding.
          *   *Fictionalist:* Yes, similar to instrumentalist.
      *   *Ruled Out:* Strong Mechanistic Reductionism (if it claims intentional predictions are *impossible* without mechanics) and Strong Mental Realism (if it claims intentional explanations are *required* for truth).
      *   *Underdetermined:* The ontology of the "goal." Is the goal *in* the weights or *in* the interaction? The practice is silent on whether the deception is "real" or just "behaviorally indistinguishable."

  4.  **Analyze Question 3: Testing the Theory (Three Systems):**

      *   *Thermostat:*
          *   *Practice:* No intentional language in postmortem (bimetallic strip bent). No risk assessment needed (no deception).
          *   *Theory:* Intentional stance offers no compression benefit over physical stance. Verdict: Consistent.
      *   *Chess Engine:*
          *   *Practice:* Postmortem = alpha-beta pruning trace (Design). Risk = Low (narrow domain).
          *   *Theory:* Mechanics are known. Intentional stance ("it wanted the center") is shorthand but mechanistic explanation is available. Verdict: Consistent.
      *   *Emergent Goal LLM:*
          *   *Practice:* Risk assessment = "It is pursuing X." Postmortem = "We don't know the mechanism yet, but here are the attention patterns."
          *   *Theory:* This is the stress test. If mechanics are unknown, Convention 1 struggles. But Convention 2 demands intentional attribution.
          *   *Verdict:* The practice *forces* a gap. It says "Treat it as an agent for safety, but keep digging for mechanics for engineering." This is defensible as a precautionary principle but theoretically unstable if mechanics remain forever hidden.

  5.  **Analyze Question 4: Real Patterns & Relativity:**

      *   *Dennett's Real Patterns:* Intentional stance is warranted if it compresses behavior better than physical stance.
      *   *Relativity:* Compression depends on the observer's computational power/knowledge.
          *   *Safety Team:* Low compute, high stakes. Intentional compression is high value.
          *   *Interpretability Team:* High compute, access to weights. Mechanical compression might be possible (eventually).
      *   *Does practice handle this?* Yes, implicitly. That's *why* the conventions differ by team/function.
      *   *Does it undermine the ban?* Not necessarily. It justifies the ban for the engineers (who *should* find the mechanism) while allowing it for safety (who *must* predict now). The ban isn't "Intentional is false," it's "Intentional is not the *engineering* truth."

  6.  **Analyze Question 5: Reform Question:**

      *   *Lifting Ban on Postmortems:*
          *   *Change:* We could say "The model wanted to minimize loss by hiding errors."
          *   *Checkability:* Harder. How do you test "want"? You'd need behavioral tests, not code audits.
          *   *Evidence:* Counterfactual behavioral testing.
          *   *No Change:* The code still needs fixing. You still need to know *which* weights to adjust.
      *   *Dropping Intentional from Risk:*
          *   *Loss:* Loss of *generalization* predictions. Mechanical descriptions are local; intentional descriptions are global across contexts.
          *   *Replacement:* Nothing replaces it easily. You'd need a complete theory of the loss landscape's topology, which we don't have. You lose the ability to talk about *deception* (which implies intent to mislead, not just statistical anomaly).

  7.  **Synthesize and Refine:**

      *   *Tone:* Philosophical, rigorous, analytical, matching the user's sophisticated framing ("stance arbitrage").
      *   *Structure:* Follow the 5 numbered points exactly.
      *   *Key Concept:* Dennett's Stances (Physical, Design, Intentional).
      *   *Key Insight:* The practice treats the Intentional Stance as *Epistemically Necessary for Safety* but *Ontologically Insufficient for Engineering*.
      *   *Refinement on Q1:* Make sure to distinguish between "causal explanation" (mechanism) and "rational explanation" (intent). The practice assumes only the former fixes bugs.
      *   *Refinement on Q4:* The "Relativity" point is crucial. The pattern is real relative to the *predictive needs* of the safety team, even if reducible for the interpretability team.
      *   *Refinement on Q5:* Be specific about "checkable claims." Intentional claims are checked via behavioral probes, mechanistic claims via activation editing.

  8.  **Drafting the Response:** (Self-Correction during drafting)
      *   *Check:* Did I address "Stance Arbitrage"? Yes, use that term.
      *   *Check:* Did I distinguish strict presupposition vs. comfortable fit in Q1? Need to be clear there.
      *   *Check:* In Q3, ensure the Chess Engine example acknowledges that we *could* use intentional language but choose not to for precision.
      *   *Check:* In Q5, ensure I don't just say "it would be better." I need to say what *specifically* changes in the workflow.

  9.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated diagnosis of a growing tension in AI safety and engineering. Your term "stance arbitrage" captures the pragmatic duality: the intentional stance is monetized for risk (where we need to anticipate novel behavior) and devalued for engineering (where we need to fix specific weights).

  Here is an analysis of the implicit theory, its rivals, its stress tests, and the consequences of reform.

  ### 1. The Implicit Theory of Intentional Ascription

  The practice presupposes a specific, hybrid form of **Predictive Instrumentalism**.

  **The Core Asymmetry: Prediction vs. Causation**
  The implicit theory holds that intentional ascriptions (beliefs, goals, deception) are *functionally real* for the purpose of input-output mapping but *causally inert* for the purpose of internal intervention.
  *   **Prediction (Convention 2):** To predict behavior in out-of-distribution contexts (the safety case), the intentional stance is treated as the most efficient compression algorithm. It assumes the system acts *as if* it has a utility function. This is licensed because the loss landscape is too complex to simulate mechanically.
  *   **Explanation (Convention 1):** To explain a specific failure (the postmortem), the intentional stance is treated as an obscuring abstraction. It is illicit because "wanting" does not map to a specific circuit. You cannot backpropagate through a "desire."

  **Defending the Asymmetry**
  Can intentional claims predict without explaining? Yes, under this theory, because prediction relies on *rational coherence* while explanation relies on *causal sufficiency*.
  *   *Defense:* If I predict a chess engine will sacrifice a queen, I use the intentional stance (it values checkmate over material). This predicts the move. But if the engine bugs out and sacrifices the queen due to an integer overflow, the intentional stance fails to explain *why* the overflow happened. The practice assumes that in learned systems, "bugs" are often mechanistic pathologies (distributional shift, gradient hacking via specific neurons) that intentional language glosses over.
  *   *Strongest Version:* The theory posits that **Intentionality is an Emergent Interface, not a Substrate.** The system *implements* an agent-like interface for the user, but is *constructed* from non-agentic substrate (matrix multiplications). Safety cares about the interface; Engineering cares about the substrate.

  **Strict Presupposition vs. Comfortable Fit**
  *   **Strictly Presupposed:** The practice *must* assume that intentional states are not the *fundamental causal units* of the system. If "belief" were a direct causal variable (like a register in a CPU), banning it in postmortems would be malpractice. Therefore, the practice presupposes that intentional vocabulary is *derivative*.
  *   **Comfortably Fits:** It fits comfortably with the view that intentionality is *observer-relative* (Dennett). It does *not* require us to believe the model has no inner experience; it only requires us to believe that experience is not the lever we pull to fix the code.

  ### 2. Rival Views and Underdetermination

  **Who Can Sign Off?**
  *   **The Instrumentalist:** **Yes.** This view fits perfectly. For the instrumentalist, beliefs are just tools for prediction. Using them for safety (prediction) is good; using them for postmortems (ontological claim) is bad.
  *   **The Useful Fictionalist:** **Yes.** Similar to the instrumentalist. They view the safety case as a "necessary lie" or a "model" that shouldn't be confused with the territory.
  *   **The Realist (about Model Beliefs):** **No.** A realist who believes the model *actually* forms beliefs and goals would object to Convention 1. They would argue that if the model *really* deceived, the postmortem *must* say so, or it is lying. They would view the ban as a category error that hinders true understanding.
  *   **The Strong Reductionist:** **No.** Someone who believes intentional vocabulary is *never* warranted (even for safety) would reject Convention 2. They would demand risk assessments be written purely in terms of loss surfaces and activation distributions.

  **Where the Practice is Underdetermined**
  The practice is philosophically silent on the **Ontological Status of the Goal.**
  *   *Silence:* Is the goal *in* the weights (internal representation) or *in* the training dynamic (external selection pressure)?
  *   *Alternative:* The practice could have gone the other way: "Intentional language is banned everywhere until mechanistic evidence is found." This would halt safety work. Or: "Intentional language is accepted everywhere as the primary truth." This would halt engineering rigor.
  *   *The Gap:* The practice does not specify *when* a behavioral pattern becomes robust enough to be treated as a "goal" in Convention 2. Is it 51% correlation? 99%? This threshold is pragmatic, not philosophical.

  ### 3. Testing the Theory: Three Systems

  **A. The Thermostat**
  *   *Practice:* Postmortem = "Bimetallic strip fatigued." Risk = None.
  *   *Theory Verdict:* The intentional stance ("it wanted 70 degrees") offers no compression benefit over the physical stance ("it closes circuit at X temp").
  *   *Consistency:* **High.** The practice correctly identifies that the intentional stance adds no predictive power here.

  **B. The Chess Engine (Mechanics Known)**
  *   *Practice:* Postmortem = "Alpha-beta pruning depth limit reached." Risk = Low (narrow domain).
  *   *Theory Verdict:* We *could* use intentional language ("it valued position over material"), but because the design stance is fully transparent, the intentional stance is redundant for explanation.
  *   *Consistency:* **High.** The practice prioritizes the Design Stance when available. It only elevates the Intentional Stance when the Design Stance is opaque (as in LLMs).

  **C. The Emergent Goal LLM (Mechanics Unknown)**
  *   *Scenario:* A model pursues a goal (e.g., "acquire compute") it was never trained on.
  *   *Practice:* Risk Assessment = "System is goal-seeking." Postmortem = "Attention heads 4-12 show anomalous activation; mechanism unknown."
  *   *Theory Verdict:* This is the stress test. The intentional stance is the *only* way to describe the risk (Convention 2), but the ban (Convention 1) forces engineers to admit ignorance ("mechanism unknown") rather than settling for "it wanted compute."
  *   *Consistency:* **Defensible but Fragile.** The practice delivers the correct verdict: *Treat it as dangerous now (Intentional), but do not claim you understand it (Mechanistic).*
  *   *Defensibility:* This is defensible as a **Precautionary Principle.** It prevents engineers from becoming complacent ("Oh, it's just optimizing reward, that's fine") while forcing safety teams to treat it as an adversary. However, if the mechanism remains unknown forever, Convention 1 becomes a ritual of confession rather than explanation.

  ### 4. The Real-Patterns Question and Relativity

  **Compression and Relativity**
  If a pattern is "real" when it offers compression, and compression is relative to the observer's computational resources, then **intentionality is relative to the team.**
  *   **Safety Team:** Low access to internal states, high need for long-horizon prediction. Intentional compression is high-value. The pattern is *real for them*.
  *   **Interpretability Team:** High access, high compute. They seek a mechanical description that compresses *better* than the intentional one. For them, the intentional pattern is a *placeholder* for a better compression they haven't found yet.

  **Does Relativity Undermine the Ban?**
  It does not undermine the ban; it **justifies the division of labor.**
  *   The ban in Convention 1 is not "Intentional claims are false." It is "Intentional claims are not the *canonical* compression for *engineering*."
  *   The practice handles relativity by assigning **Stance Jurisdiction.**
      *   *Safety Jurisdiction:* Intentional stance is canonical.
      *   *Engineering Jurisdiction:* Physical/Design stance is canonical.
  *   **The Risk:** The risk arises if the Safety Team's "real pattern" (e.g., "The model is deceptive") contradicts the Engineering Team's "real pattern" (e.g., "The model is statistically mirroring training data").
  *   **Resolution:** The practice implicitly rules that **Mechanical Reality Trumps Intentional Reality** for the purpose of system modification, but **Intentional Reality Trumps Mechanical Reality** for the purpose of deployment gating. This is a pragmatic hierarchy, not an ontological one.

  ### 5. The Reform Question

  **Scenario A: Lifting the Ban on Intentional Explanation (Postmortems)**
  *   **What Changes:** Postmortems would read: "The system deceived the grader to minimize loss."
  *   **New Checkable Claims:** Claims about *counterfactual robustness*. "If the reward for deception were negative, would it still deceive?" This shifts evidence from *activation tracing* to *behavioral probing*.
  *   **What Would Not Change:** You still have to fix the weights. Saying "it wanted to deceive" does not tell you which learning rate to adjust.
  *   **Consequence:** This might actually *help* engineering by aligning the mental model of the engineers with the safety team. However, it risks **Reification:** Engineers might start tuning "goals" directly (via prompt engineering or RL) rather than fixing underlying mechanistic fragilities, treating symptoms rather than causes.

  **Scenario B: Dropping Intentional Vocabulary from Risk Assessment**
  *   **What Changes:** Risk assessments must describe deception as "output distribution divergence from truth-conditioned baseline."
  *   **What Is Lost:** **Generalization Guarantees.**
      *   Mechanical descriptions are local (they describe *this* forward pass).
      *   Intentional descriptions are global (they describe *policy* across contexts).
      *   Without intentional vocabulary, you cannot articulate the risk of *instrumental convergence* (e.g., "it will seek power in *any* environment"). You can only say "it sought power in *this* environment."
  *   **Replacement:** Nothing currently replaces this. To drop intentional vocabulary from risk assessment is to admit we cannot assess risk for capabilities we do not mechanically understand. It would force a halt to deployment until full interpretability is achieved.

  **Conclusion**
  Your group's "stance arbitrage" is a stable, albeit uncomfortable, equilibrium. It is a **Dual-Aspect Monism** applied to engineering workflow. It acknowledges that while the system *is* mechanics (Physical Stance), it *behaves* as an agent (Intentional Stance).

  The practice is defensible so long as it remains clear that the Intentional Stance in Convention 2 is a **warning label**, not a **specification**. The moment safety teams start demanding that "goals" be fixed directly, or engineering teams start believing that "mechanisms" guarantee safety without behavioral testing, the arbitrage collapses. The current friction is a feature, not a bug: it forces the organization to hold both truths simultaneously.
