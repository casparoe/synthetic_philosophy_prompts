  4.  **Drafting the Systematic Translation (Iterative Process):**

      *   *Mises:*
          *   Premise: Common ownership = Single namespace / Single writer lock on all resources.
          *   Premise: Rational calculation requires orthogonal basis vectors (prices) derived from independent contention.
          *   Conclusion: Without independent writers contending for locks, the "cost" variable is undefined (NaN), not just unknown.
          *   Validity: Holds if you accept "price" = "contention signal." Fails if "price" is just an admin setting.

      *   *Hayek:*
          *   Premise: State is sharded by node (local knowledge).
