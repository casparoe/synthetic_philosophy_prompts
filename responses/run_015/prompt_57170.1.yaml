          *   Validity: Mathematically plausible in a simulator. Fails on incentive compatibility (workers lying to the controller) and compute complexity.

  5.  **Addressing the Three Blunt Points:**

      *   *Point 1 (Mises vs. Hayek/Gossip):* The user suspects they are describing Hayek, not Mises. Correct. Mises is about *ontology* (does the variable exist?), Hayek is about *epistemology* (can we read the variable?). In sysarch terms: Mises says the metric isn't emitted. Hayek says the metric is emitted but the aggregator is too slow.
