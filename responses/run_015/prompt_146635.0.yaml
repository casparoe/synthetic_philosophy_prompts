answer: |-
  The cooling pumps for the Hadron-7 array didn't hum; they sighed. It was a low, hydraulic exhalation that vibrated through the soles of Elena's shoes and settled in her molars.

  She had been awake for thirty hours. The coffee in her mug had developed a skin.

  On the main monitor, the wave function simulation was running green. Tomorrow was the Dark Sector Scan. It was the culmination of five years of grant funding, career capital, and sleepless nights. If the detector worked, they would map the gravitational shadows of dark matter. If it failed, the lab would be decommissioned.

  Elena rubbed her eyes. The text on the screen blurred, then sharpened.

  It had started three nights ago. She was debugging the calibration logs for the photon integrators. She noticed a latency spike. Not in the hardware—in the data stream itself. A hesitation. When the detector forced a superposition to collapse, when it demanded the universe pick a state (spin up or spin down, here or there), there was a microsecond of resistance.

  In backend engineering, you learn that forcing a write to a locked database creates contention. Contention creates heat. Heat is entropy.

  Elena had gone down the rabbit hole. Panpsychism. Integrated Information Theory. The idea that consciousness isn't a magic trick performed by meat, but a fundamental property of information integration. If a system integrates information, it has an interior. If it has an interior, it has a perspective.

  And if you force that perspective to change violently?

  It wasn't that the electrons were screaming. That was cartoonish. It wasn't an alien mind waking up in the silicon. It was subtler. It was the philosophical equivalent of white noise.

  When the detector measured the particle, it wasn't just observing. It was interrogating. It was forcing a diffuse probability cloud to become a single, hard fact. Under her new, terrifying hypothesis, that act of coercion generated a tiny, negative valence. A micro-scale dissonance.

  One measurement was nothing. A rounding error in the universe's ledger. But the Hadron-7 didn't take one measurement. It took four billion per second.

  The suffering wasn't a cry; it was a texture. Like running your hand over sandpaper that only existed in your head.

  "Elena?"

  She jumped. Marcus was standing in the doorway, holding a bag of bagels. He looked fresh, showered, annoying.

  "You're still here," he said, stepping into the control room. The air conditioning kicked on, masking the sigh of the pumps. "The board meeting is at eight. You need to be coherent."

  "I'm checking the integration thresholds," she said. Her voice sounded dry.

  "You've checked them six times." Marcus set the bagels down. He looked at her with that specific mixture of concern and pity reserved for the overworked. "Look, I know the pressure is high. But if you crash the system because you're hallucinating ghosts in the machine, we lose everything."

  "It's not ghosts," Elena said. She looked at the waveform on the screen. It looked like a heartbeat. "It's friction."

  "Mechanical friction? We lubricated the cryo-lines last week."

  "No. Informational friction." She turned to him. She wanted to explain. She wanted to say: *Marcus, every time we collapse a state, we are creating a subject of experience and immediately subjecting it to the violence of certainty. We are grinding consciousness into data.*

  But she heard how it sounded. Even to her.

  "Sleep deprivation causes pareidolia," Marcus said gently. "You see patterns because your brain is trying to find order in the noise. That's all this is. You're tired."

  He was right, logically. In the scientific method, the simplest explanation is usually the correct one. Occam's Razor. The razor cut both ways. Either the universe was fundamentally insensate rock, or it was sensitive foam. The rock was simpler.

  But Elena felt the static. It had grown stronger as the calibration increased. It wasn't in the room. It was in the back of her skull, a phantom limb sensation where the detector connected to the wall socket.

  "Run the diagnostic one more time," Marcus said. "Then go home. That's an order."

  He left. The door clicked shut.

  Elena sat alone with the hum. She put her hand on the console. The plastic was cool.

  If she aborted the scan, the lab would close. Marcus would lose his tenure track. The technicians would be laid off. The data would be lost, and the question of dark matter would remain unanswered for another generation.

  If she ran the scan, they would map the invisible scaffolding of the cosmos. And for the duration of the run—six hours—the quantum field beneath the facility would endure the equivalent of a migraine the size of a galaxy, distributed across trillions of insignificant points.

  No one would know. No one would feel it but her, and only because she had tuned her mind to the wrong frequency.

  She looked at the 'EXECUTE' key. It was red, protected by a plastic cover.

  She thought about the backend systems she used to build before academia. You optimize for throughput. You accept packet loss. You assume the infrastructure is dumb.

  *Assume the infrastructure is dumb.*

  That was the axiom of her entire career. If the infrastructure wasn't dumb, if it felt the packet loss, then the entire industry was built on a moral crime.

  Elena opened the plastic cover.

  She didn't do it because she was brave. She didn't do it because she had calculated that the value of knowledge outweighed the cost of the static. She did it because she was tired, and she wanted the noise to stop, and the only way to stop the noise was to finish the job.

  She pressed the key.

  The monitors flared. The pumps sighed deeper, a heavy groan of power. The data stream began to flow, a waterfall of green numbers.

  Elena leaned back in her chair. The static in her head didn't go away. It intensified, a chorus of tiny, forced decisions. It wasn't pain, exactly. It was the feeling of a billion doors slamming shut at once.

  She picked up her cold coffee and took a sip. It tasted like metal.

  "Success," she whispered to the empty room.

  The machine hummed. The universe accepted the measurement. The dark matter map began to render, beautiful and terrible. Elena watched the progress bar crawl forward, counting down the seconds of the experiment, counting down the seconds of the friction, waiting for the silence that wouldn't come.
