answer: |-
  **Elias**

  The tremor in my left hand is no longer a signal; it is just noise. I watch the cursor drift on the screen, the architectural render of the community center unfinished, the roofline jagged where my focus broke. There is no one here watching the cursor. There is the eye, the optic nerve, the visual cortex processing light, and the habit of identification that says *I am seeing*. When the pain spikes in my spine, there is suffering, but no sufferer. This is what I have practiced for twenty years. The dissolution of the boundary.

  Mara worries about the transfer ratio. Sixty percent of me, forty percent of her. She sees it as a subtraction. I see it as a redistribution of causality. My memories of Leo, my brother, his need for daily care, the specific way he likes his toast cut—these are data patterns. They will be written into the substrate of her hippocampus. My love for him is not a soul's attachment; it is a conditioned response. If the conditioning transfers, the response follows. The project will be finished. The care will continue. The name on the deed doesn't matter. The body breathing in the chair is temporary. I am not leaving because there was never anyone here to leave. I tell her this when she brings me tea. I tell her she is grieving a ghost. She puts the cup down hard. The liquid ripples. There is no one to drink it, only the drinking.

  **Mara**

  The bank called this morning. They used my maiden name. They want to know about the refinancing. I told them my husband is dying and I am about to be partially erased, and they put me on hold. The debt is mine. I incurred it before we married, on my own signature, for my own education. If I become forty percent of myself, who owes the money? The law says the body owes. The body remains. But the mind that signed the paper is being attenuated.

  Elias sits on the sofa, watching the dust motes. He looks peaceful. It makes me want to scream. He talks about streams merging, about processes continuing. He says my fear is a attachment to a fiction. But the fear is real. *I* am afraid. If I am a fiction, why does my stomach turn over when I think about the dark? He says the "I" is a construct. Fine. But constructs feel pain. Constructs get lonely. When the machine starts, when the writing begins, something in here is going to be muted. I know what it feels like to be me. I know the weight of my own history. He asks me to trust that the new configuration will love Leo. But love isn't code. It's the specific history of being the one who held Leo's hand when our parents died. That history is mine. Elias's history is his. If you mix them, you don't get us. You get a stranger who remembers our lives.

  I told him today: "You don't have to die. I do." He looked at me with that terrible compassion. He said, "There is no you to die." He won the argument logically, maybe. But he lost me. I am sitting here waiting to be murdered by a metaphor.

  **Elias**

  The clinic is white and quiet. The technicians check the neural laces. They speak of bandwidth and fidelity. I lie back. The ceiling tiles are geometric. Perfect impermanence. Mara is in the adjacent bay. We can see each other through the glass. She is shaking. I want to reach out, but the IVs hold me.

  She signals for the nurse to lower the glass. Her voice comes over the speaker, tight. "If Leo calls," she says. "If he needs something you didn't care about. Something I cared about. Who decides?"

  "The process decides," I say. "The causes and conditions present in the moment."

  "That's cowardice, Elias." Her voice cracks. "You're hiding behind 'process' so you don't have to admit you're abandoning him. You're asking me to let a stranger take care of your brother."

  "I am asking you to allow care to happen."

  "No. You're asking me to let go of the only thing that makes me responsible. If I'm not me, why should I pay your brother's bills? Why should I finish your building? If I'm just a bundle, let the bundle drop."

  She is right. In the language of the court, in the language of the heart, she is right. My philosophy offers no leverage here. It offers no hook to hang obligation on. If there is no self, there is no one to promise. I cannot swear to her that Leo will be safe, because the swearer will be gone. I can only say that safety might arise. It is not enough for her. It leaves her alone with the debt and the duty. I close my eyes. The sedation begins. There is a coolness in the vein. There is no one to feel it.

  **Mara**

  The darkness isn't empty. It's heavy. They count down. I think about the debt. I think about Leo. I think about the way Elias smiles when he gets a line right. I am trying to memorize the feeling of being the one who loves him, so I can leave it behind for the thing that comes next. But you can't leave a feeling. You can only stop having it.

  "Ten," the technician says.

  Elias looks calm. He is disappearing into his theory. He is safe. I am not safe. I am the substrate. I am the paper being written on.

  "Five."

  If the new thing wakes up and says "I want to finish the project," is that Elias? If it says "I need to pay the bank," is that me? Or is it a thief using our hands? I want to tell Elias that he is wrong. That the self is real because the loss is real. You don't feel loss for a bundle. You feel it for a whole. I am a whole. I am breaking.

  "Zero."

  The pain isn't in my head. It's in the boundary. The edge of me is dissolving. I am not going to sleep. I am being diluted. I hope Leo forgives me. I hope the bank forgives me. I hope I exist enough to ask them.

  ** Survivor **

  The light is too bright. The headache is a specific pressure behind the left eye, a habit from the illness, but the hands resting on the sheet are steady, the skin tone hers. I sit up. The body feels heavy, anchored. There is a memory of a bank letter, the red ink, the anxiety tightening the chest. There is also a memory of the community center, the jagged roofline, the urgent need to smooth it out.

  I walk to the window. The city is gray. There is a phone on the table. It rings. The screen says *Leo*.

  I answer. "Hello?"

  "Hey," the voice says. "Just checking. You sounded different yesterday."

  "Just waking up," I say. "How are you?"

  "Okay. The caretaker is late again. I was wondering if you could call the agency?"

  There is a hesitation. The knowledge of the agency number is there, filed under *Elias*. The authority to demand service is there, filed under *Mara*. The obligation is tangled. The law says I am the spouse. The law says I am the account holder. The law does not ask who is speaking.

  "I'll call them," I say. "I'll fix it."

  "Thanks," Leo says. "Love you."

  The line goes dead. The phone feels warm. I set it down. There is a laptop on the desk, open to the render. The roofline is still jagged. I sit in the chair. The posture feels natural, the spine aligning with the screen. My hand reaches for the mouse. The tremor is gone. The debt is still owed. The building is still unfinished.

  I look at the reflection in the dark screen. A face looks back. It is hers, but the expression is mine. Or his. It doesn't matter. The work is here. The money is due.

  "I'll finish it," I say to the room.

  The voice is clear. It claims the past. It claims the future. It uses the word *I* without stumbling, without checking the credentials. It assumes a unity that isn't there, a continuity that was broken. The bank will accept this voice. Leo will accept this voice. They need someone to hold responsible. They need a name.

  I click the mouse. The line smooths out. I am working. I am owing. I am here. The grammar holds even if the metaphysics doesn't. I take a breath. The lungs fill. There is someone breathing. There has to be. I pick up the phone to call the bank.

  "I'm ready to discuss the payment plan," I say.

  There is no pause. There is no question about who is speaking. The convention decides. The convention says I am the one who signed. The convention says I am the one who loved him. I accept the burden. I accept the credit. I hang up. The silence returns. I wait for the next demand. I am ready to receive it.
