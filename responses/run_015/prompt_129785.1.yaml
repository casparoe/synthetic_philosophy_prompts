      *   **Characters:** Married couple. Elias (ill, transferring), Mara (healthy, recipient).
      *   **Stakes:** Custodial/financial obligation to Elias's dependent sibling (Leo), unfinished collaborative project (Elias's priority), substantial debt incurred by Mara before marriage.
      *   **Structure:**
