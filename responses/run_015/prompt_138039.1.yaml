answer: |-
  You have identified a genuine gap in the standard vocabulary of assessment and signaling theory. Your intuition is correct: this is **not** merely a subtype of Costly Signaling Theory (CST), though it is often lumped in with it.

  In standard CST (the "Handicap Principle"), the signal is reliable because it is *expensive to produce* (e.g., a peacock's tail consumes energy). The cost is intrinsic to the signal itself. In the pattern you describe, the signal (the answer, the song, the case study) is *not* intrinsically expensive for the competent candidate. The reliability arises from the **impossibility of pre-computation**.

  There is no single, dominant term in psychometrics or economics that captures this exact carving. However, the mechanism is rigorously defined in computer security and cognitive science. To give you the vocabulary you need, I will synthesize these fields.

  ### 1. The Concept: Generative Verification

  The most precise label for this phenomenon is **Generative Verification** (or **Challenge-Response Validation of Generative Capacity**).

  It relies on a distinction between **Stock** (memorized artifacts) and **Flow** (generative models).
  *   **The Weak Candidate** operates from *Stock*. They have a finite library of prepared scripts.
  *   **The Strong Candidate** operates from *Flow*. They possess an internalized mental model (a "grammar") that allows them to generate infinite valid instances.

  The assessment does not measure the quality of the output (both can produce a flawless recording); it measures the **marginal cost of adaptation**.

  #### Why it is not Costly Signaling
  In Costly Signaling, the signal loses none of its power if anticipated. If everyone knows a peacock needs a big tail to mate, the tail remains a valid signal because growing it is still expensive.
  In **Generative Verification**, the signal **collapses if anticipated**. If the candidate knows the specific variation you will demand (e.g., "sing in F# minor"), they can move that specific instance from *Flow* to *Stock*. They can memorize it. Once memorized, the test no longer distinguishes model-access from script-recall.

  Therefore, the reliability depends on **Entropy** (unpredictability), not just **Expenditure**.

  ### 2. The Mechanism: Non-Precomputability

  You asked what the cost is a cost *of*, given that the marginal instance looks free.
  The cost is **Cognitive Search Cost** in a high-dimensional space.

  *   **For the Expert:** The internal model acts as an index. The "search cost" to find the right note or argument in a new key is near-zero. The answer is *computed* instantly via the model.
  *   **For the Faker:** They lack the index. To answer, they must brute-force search the space of possible answers or attempt to extrapolate from a script. Without the model, the computational cost is effectively infinite (they cannot do it in the time allowed).

  This is structurally identical to **Challenge-Response Authentication** in cryptography.
  *   **Static Password (Artifact):** Vulnerable to replay attacks (plagiarism/scripting).
  *   **Dynamic Nonce (Your Variation):** The verifier sends a random number (the new key/domain). The prover must encrypt it with their secret key (competence).
  *   **The Security:** Lies in the fact that the attacker cannot build a "Rainbow Table" (a lookup list of all possible challenges) because the space of challenges is too large.

  ### 3. Boundary Conditions

  You asked where this stops working. Generative Verification fails under three specific conditions:

  **A. The Rainbow Table Attack (Space Closure)**
  If the space of possible variations is small enough, the candidate can memorize all of them.
  *   *Example:* If an oral exam publishes a bank of 50 possible follow-up questions, candidates will memorize answers to all 50. The test reverts to measuring memory, not competence.
  *   *Requirement:* The space of possible challenges must exceed the candidate's capacity for memorization.

  **B. The Latency Tolerance (Time Boundary)**
  Generative computation takes time. If the expert needs 30 seconds to compute the answer but the examiner demands it in 5 seconds, the test measures **processing speed** or **stress tolerance**, not the underlying competence.
  *   *Requirement:* The time allowed must exceed the expert's retrieval latency but remain under the faker's brute-force time.

  **C. The Coupling Constraint (Coherence)**
  You noted the faker cannot produce an instance that "hangs together" with the previous one. This is testing for **State Consistency**.
  *   *Failure Mode:* If the variations are too disjointed (e.g., "Sing a song" then "Now solve a calculus problem"), you are testing two different skills, not the generativity of one.
  *   *Requirement:* The variations must be perturbations of the *same* underlying latent variable.

  ### 4. The Reverse Case: The Proceduralization Gap

  You asked about the strong writer who freezes in an oral defense. This is a critical failure mode for Generative Verification.

  In psychometrics, this is called **Construct-Irrelevant Variance**. The test is measuring "Ability to perform under oral pressure" + "Writing Skill," when you only want to measure "Writing Skill."

  However, a more precise cognitive description is the **Proceduralization Gap**.
  *   **Declarative Knowledge:** Knowing *what* is true (can be written slowly, with reference).
  *   **Procedural Knowledge:** Knowing *how* to access it in real-time (automated, fluent).

  Generative Verification assumes that true competence is always proceduralized. **This assumption is false.**
  *   **The Researcher:** May have deep, complex understanding (high declarative) that requires slow, deliberate synthesis (low procedural fluency).
  *   **The Performer:** May have high procedural fluency (can improvise) but shallow declarative depth.

  If your certification values deep, slow synthesis (e.g., architectural safety, medical diagnosis), Generative Verification (oral exams, on-the-spot tasks) may systematically **false-negative** your best candidates. They are not faking; they are **Latency-Bound**.

  ### 5. Proposed Vocabulary for Your Work

  Since no single term exists in assessment design, I propose you adopt the following distinctions to clarify your internal documentation and design logic:

  | Concept | Definition | Distinguishing Feature |
  | :--- | :--- | :--- |
  | **Costly Signal** | Reliability via resource expenditure. | Works even if anticipated. (e.g., Portfolio) |
  | **Generative Verification** | Reliability via non-precomputability. | Fails if anticipated. (e.g., Oral Defense) |
  | **The Rainbow Limit** | The point where possible variations become memorizable. | The boundary where Generative Verification collapses. |
  | **Proceduralization Gap** | When competence exists but cannot be accessed on demand. | The cause of false negatives in Generative Verification. |
  | **Adaptive Cost** | The cost imposed by the receiver during testing. | Distinct from the production cost borne by the signaler. |

  ### Summary Recommendation

  When designing assessments, you are choosing between **Artifact Validation** (Costly Signal) and **Generative Verification** (Challenge-Response).

  *   Use **Artifact Validation** when the skill is inherently slow, reflective, or tool-dependent (e.g., writing code, designing a building). Here, the "cost" of the artifact is the feature, not a bug.
  *   Use **Generative Verification** when the skill requires real-time adaptation and the risk of scripting is high (e.g., crisis management, clinical triage).

  If you must use Generative Verification but fear the **Proceduralization Gap**, you must decouple **Latency** from **Validity**. Allow the candidate "think time" or the use of scratch tools during the oral exam. This lowers the "Adaptive Cost" for the expert without lowering it for the faker (who still lacks the model to use the tools effectively).

  Your phenomenon is **Generative Verification**. It is distinct from Costly Signaling because its reliability derives from **Entropy** (unpredictability) and **Indexing** (internal models), not **Expenditure**. It fails when the challenge space becomes closed (memorizable) or when the valid signal is latency-bound (the Proceduralization Gap).
