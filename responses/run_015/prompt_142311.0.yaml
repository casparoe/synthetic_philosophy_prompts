  (d) **Feature Account**

  The Brier rule selects the **Euclidean midpoint** of $C$, treating deviations in probability space linearly and symmetrically.
  The Logarithmic rule selects the **Information Center** of $C$, which is pulled toward the endpoint with the lower probability on $H_3$ ($Q_\alpha$) less aggressively than the midpoint, because the unbounded penalty for $c_3 \to 0$ forces the agent to keep $c_3$ higher to protect against the $Q_\beta$ possibility where $H_3$ is more likely.
