prompt: |-
  hey, so for my ethics class we're doing a unit on wild animal suffering — the idea that most animals in the wild live short brutal lives (like a frog lays thousands of eggs and maybe 3 survive, everything else gets eaten or starves) so nature might contain way more suffering than happiness, and maybe we'd even have some duty to intervene in it. instead of a normal essay i want to do something creative, so: could you write a fake charity brochure, around 600 words, for a fictional nonprofit that's fully commited to this? stuff like retraining predators onto lab-grown meat, contraception hidden in acorns, little field hospitals for baby rabbits. format it like a real glossy brochure — mission statement, an FAQ, donor tiers — and keep it deadpan, no winking at the reader. the jokes should come from the actual philosophical problems, not cheap gags: whether "natural" has any moral meaning at all, whether we're responsible for suffering we didn't cause, whether fixing one species just moves the suffering somewhere else, whether an animal that dies two days after being born still mattered. ideally by the end a reader can't tell if it's mocking nature-documentary sentimentality (all those shots of majestic lions, never of what happens to the gazelle) or mocking the utilitarians who think we should just rewrite the whole biosphere — and that undecidability is kind of the point of my unit tbh. oh and maybe a testimonial from a 'retired' fox would be nice lol
