          *   *Assessment:* Strong intuition pump. The "bias" claim is standard Parfitian utilitarianism. The reductio is the standard Ramsey argument.
      *   **M2 (Nadia):** Shape of life matters (time-indexed goods). Risk discounting yields same mathematical result (geometric decay), so Marek can't object to the *result* specifically.
          *   *Assessment:* "Shape of life" is a good counter to "bag of experiences." The risk discounting point is technically true mathematically but conflates *reasons* for discounting.
      *   **M3 (Marek):** Shape preferences argue for *bigger* later goods, not *less weight*. Risk discount is reducible/measurable; pure rate is a "taste" with no evidential handle. Tastes about others' suffering shouldn't set obligations.
          *   *Assessment:* Crucial distinction between *value* and *weight*. The "evidential handle" point is strong epistemology. The "taste" accusation hits the normativity hard.
      *   **M4 (Nadia):** Ultimate values sit still (like parental partiality). Agency is indexical ("now"). Standpoint prerogative: agents act from *here*.
          *   *Assessment:* Shifts from axiology to decision theory/agency. Parental partiality analogy is controversial in this context (self vs. other vs. time). Indexicality is a strong philosophical point.
      *   **M5 (Marek):** Symmetry test (backwards). If 2005 discounted 2025, would you accept it? No. Temporal prerogative licenses "looting" future stages. Personal case has separate claimants; time has a queue.
          *   *Assessment:* The "looting" metaphor is powerful. Challenges the coherence of temporal parts having conflicting interests without separate identity.
      *   **M6 (Nadia):** Backwards test rigged (losers always object). Concedes large rates are arbitrary, defends zero vs. small. Zero is also a strong claim. Risk discounting is sensitive/fragile.
          *   *Assessment:* Concession on "large rates" is significant. Defending "small" vs "zero" shifts the goalposts slightly. Sensitivity point is valid but maybe misses the normative core.
      *   **M7 (Marek):** Sensitivity is a virtue (tells you to research). The fork: Life as one object vs. temporal parts as separate claimants. If latter, you need a theory of personal identity.
          *   *Assessment:* Forces the metaphysical commitment. If you discount, you treat future selves like others.

  3.  **Evaluate Move-by-Move (Drafting the Ratings):**

      *   *M1:* Solid. Ramsey argument is standard. *Rating:* Largely Right.
      *   *M2:* Shape point is good, but risk discount equivalence is a category error (epistemic vs. ontological). *Rating:* Mixed.
      *   *M3:* Very strong. Distinguishes value of outcome vs. weight of time. "Evidential handle" is a killer point against pure preference. *Rating:* Clearly Right.
      *   *M4:* Indexicality is real, but parental partiality analogy is weak (self-interest vs. other-interest). *Rating:* Plausible but Overstretched.
      *   *M5:* The symmetry argument is devastating for pure time preference unless you accept a specific view of personal identity. *Rating:* Clearly Right.
      *   *M6:* Conceding "large rates" undermines the defense of *any* non-zero rate if the objection is arbitrariness. Sensitivity point is defensive. *Rating:* Weakened.
