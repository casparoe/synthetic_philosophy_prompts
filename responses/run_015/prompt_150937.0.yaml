  *(Self-Correction on M4 Rating)*: The parental partiality analogy is the weakest link for Nadia. Partiality to kin is usually justified by special obligations or evolutionary grounds, not pure rationality. Applying that to *time* is controversial. I'll rate it "Contentious."

