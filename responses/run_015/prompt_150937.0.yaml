      *   Ensure the "What would change my verdict" section is honest and reflective.

  7.  **Refining the Adjudication (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just side with Marek. Nadia's point about indexical agency (M4) is philosophically robust (see: indexical beliefs). I need to acknowledge that even if Marek wins on the *moral* point, Nadia wins on the *agency* point.
      *   *Correction:* Nadia's point about risk discounting (M2) is mathematically correct but normatively distinct. I need to be clear that *why* we discount matters, not just *that* we discount.
