answer: |-
  # Joint Statement on Bounded Rationality and Procedural Choice

  ## 1. What we both sign

  1.  **Boundedness is fundamental.** Any model of human or institutional choice that assumes unbounded computation or information access is descriptively false and often predictively useless. We agree that constraints on time, attention, and memory are features, not bugs.
  2.  **Deliberation has costs.** Thinking, searching, and attending consume resources that could be deployed elsewhere. Both camps agree these costs must be accounted for in any complete model of decision-making.
  3.  **Procedures determine outcomes.** The algorithm used to select an act matters as much as the preference ordering over outcomes. Two agents with identical preferences may choose differently due to different procedural constraints.
  4.  **Flat payoff terrains exist.** There are environments where multiple options yield near-identical expected utility. In these cases, we agree that optimizing and satisficing procedures will converge on the same behavior, making the dispute purely descriptive.
  5.  **Search costs are often endogenous.** We agree that the cost of evaluating the next option is not always known ex-ante. Often, the cost is only revealed by attempting the search, creating a self-referential problem for stopping rules.
  6.  **Auditability is a variable.** In institutional settings, the ability to reconstruct and defend a decision process (auditability) affects the value of that process. Both camps agree this is a measurable property of a decision procedure.
  7.  **Swap-sensitivity is real.** The order in which options are presented affects the final choice in bounded agents. We agree this sensitivity is a measurable property that distinguishes procedures.
  8.  **The regress problem is shared.** Choosing a decision procedure is itself a decision. Both camps acknowledge this creates a potential infinite regress that must be addressed, either by a stopping rule or a fixed point.
  9.  **Learning adjusts parameters.** Agents update their aspirations and their estimates of search costs based on feedback. We agree that static models are insufficient for dynamic environments.
  10. **Normative claims require feasibility.** A normative theory of choice that prescribes procedures impossible for the agent to execute is invalid. "Ought implies can" applies to computational capacity.
  11. **Models must be falsifiable.** Theoretical distinctions must yield different predictions in at least some conceivable cases. If two models always predict the same behavior, they are empirically equivalent.
  12. **We seek a unified vocabulary.** Our goal is not to declare a winner but to map the boundary conditions where each description provides superior leverage on actual behavior.

  ## 2. Where we differ

  | Disagreement | Camp O (Optimizer) Wording | Camp S (Satisficer) Wording |
  | :--- | :--- | :--- |
  | **Nature of Search Costs** | Search costs are estimable parameters. While noisy, they can be priced into the objective function ex-ante. The self-referential problem dissolves at a higher meta-level of estimation. | Search costs are often unknowable until incurred. The stopping rule cannot rely on ex-ante cost-benefit analysis because the variables are revealed by the search itself. |
  | **Normative Status** | Satisficing is derived maximizing. It is what optimization looks like when computation is costly. There is only one norm: maximize expected utility net of costs. | Satisficing is a distinct norm. It relies on aspiration levels adjusted by feedback, not marginal calculation. It is not merely constrained optimization; it is a different logic of choice. |
  | **Value of Auditability** | Auditability is instrumentally valuable. It is included in the objective function only insofar as it prevents future penalties or facilitates coordination. | Auditability has constitutive value. In institutions, a decision you cannot explain is a decision you cannot defend, regardless of its payoff. This value is not reducible to expected utility. |
  | **Stopping the Regress** | The regress stops at a fixed point where the cost of choosing a procedure exceeds the gain. This is an optimization problem like any other. | The regress stops because agents rely on social norms or habits that are not chosen via calculation. Procedure choice is often arational or rule-following, not optimized. |

  ## 3. Cruxes

  **1. The Vacuity Charge**
  Camp O claims any behavior can be modeled as optimization with the right cost function. Camp S claims this renders the theory unfalsifiable. Settling this matters because if Camp O is right, "optimization" is a tautology. If Camp S is right, optimization is a specific empirical claim that can be wrong. This moves Camp S more, as it threatens the necessity of their alternative framework.

  **2. The Inside View**
  Camp S argues that if the agent cannot compute the marginal cost of search, the optimization model is psychologically false. Camp O argues the agent's internal experience is irrelevant if the behavior matches the model. Settling this determines whether our models must be executable from the agent's perspective or merely predictive from the outside. This moves Camp O more, as it challenges the methodological individualism of economics.

  **3. Institutional vs. Individual Rationality**
  Camp S argues auditability and low swap-sensitivity are goods in themselves for organizations. Camp O argues these are only proxies for long-term payoff. Settling this determines whether we model institutions as single agents or as political entities requiring defensibility. This moves Camp S more, as it validates their focus on procedural legitimacy over outcome maximization.

  ## 4. Tests, cases and predictions

  **Case 1: The Hiring Committee (Auditability)**
  *Scenario:* A committee must hire one candidate. Option A has slightly higher expected productivity but a complex, hard-to-explain selection rationale. Option B has slightly lower productivity but a clear, rule-based selection rationale.
  *Camp O Prediction:* The committee chooses A unless the expected cost of future defense outweighs the productivity gain. If they choose B, it implies the "defense cost" was priced in.
  *Camp S Prediction:* The committee chooses B even when defense costs are negligible, because the procedure itself must be defensible.
  *Falsification:* If Camp O cannot specify the "defense cost" independently of the choice, their model is vacuous. If Camp S predicts choice of B in environments where defense is impossible (e.g., anonymous hiring), they are wrong.

  **Case 2: Sequential Search with Unknown Costs (Self-Referential Cost)**
  *Scenario:* An agent searches for a price online. Each click reveals a price and a time cost, but the time cost varies unpredictably per click.
  *Camp O Prediction:* Agents form a Bayesian prior on click costs and optimize stopping based on expected marginal gain.
  *Camp S Prediction:* Agents set an aspiration price. They stop when found, regardless of marginal click cost, adjusting aspiration based on past success.
  *Falsification:* If search duration correlates tightly with marginal cost estimates, Camp O wins. If search duration correlates with aspiration levels regardless of cost variance, Camp S wins.

  **Case 3: Procedure Selection under Time Pressure (The Regress)**
  *Scenario:* Agents are given 5 minutes to choose a decision procedure for a high-stakes task, then perform the task.
  *Camp O Prediction:* Agents optimize the procedure choice based on expected task value vs. setup time.
  *Camp S Prediction:* Agents default to habit or social mimicry because there is no time to optimize the procedure choice.
  *Falsification:* If agents systematically select procedures that maximize task payoff net of setup time, Camp O wins. If agents select procedures based on familiarity regardless of payoff, Camp S wins.

  ## 5. Verbal or real

  Some disputes are verbal: whether to call a heuristic "constrained optimization" or "satisficing" matters less than whether the model predicts behavior. However, the dispute over auditability is real: is defensibility a term in the utility function, or a constraint on valid choice? The regress problem is also real: does procedure choice terminate in calculation or habit? These are not translation errors; they are structural disagreements about what constitutes a decision. We agree to treat the vocabulary as secondary to the mechanistic claims.
