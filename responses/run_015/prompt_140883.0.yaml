answer: |-
  This phenomenon is **normative ignorance**, where acquiring information alters the deontic status or availability of actions rather than merely updating beliefs, thereby violating Good's theorem's assumption that utility functions remain invariant across information states.

  *   **The Carving:**
      *   **Definition:** The agent treats ignorance as a constitutive condition for specific normative positions. In the pregnancy case, knowledge creates a moral obligation (to terminate) that ignorance avoids; in the audit case, knowledge falsifies a truth-condition (claiming ignorance) that ignorance sustains. The utility function inputs include the agent's epistemic state, not just physical outcomes.
      *   **Distinctions:**
          *   *Vs. Information Aversion:* Psychological aversion concerns emotional cost (fear, anxiety). Your students stipulate no emotional cost; the cost is normative (obligation) or logical (truthfulness).
          *   *Vs. Self-Binding (Ulysses Contracts):* Self-binding protects against future irrationality or weakness of will. Here, the agent trusts her future rationality; she fears the *correct* application of knowledge would force an unwanted outcome.
          *   *Vs. Game-Theoretic Strategic Ignorance:* Economic strategic ignorance usually aims to manipulate others' beliefs or avoid liability via signaling. While the audit case overlaps, the pregnancy case is purely internal; the agent cares about her own normative standing, not others' perceptions.
          *   *Vs. Heuristic Simplicity:* This concerns cognitive costs or error rates from processing too much data. Your cases stipulate costless, accurate information; the rejection is based on the *consequences of knowing*, not the *cost of processing*.
      *   **Status vis-à-vis Good's Theorem:** This is a genuine exception to the *application* of Good's result, though not the math. Good's theorem assumes $Utility(Action, World)$ is independent of the information signal. Here, $Utility(Action, World, Information)$ varies because knowledge changes what is permitted or true. The "free information" is not free because it consumes normative capital.
      *   **Coherence:** The reasoning is coherent if one accepts that epistemic states are themselves values or constraints. It collapses only under a strict consequentialism that counts only physical outcomes (e.g., health, profit) and ignores deontic status (e.g., guilt, truthfulness). If "being able to truthfully deny" or "not being obligated to kill" are valid goods, the agent is maximizing expected utility over a richer domain.

  *   **Boundary Cases:**
      *   *Coherent:* A doctor declines to learn a patient's genetic risk because knowing would mandate a risky prophylactic surgery the patient wishes to avoid unless absolutely necessary.
      *   *Incoherent:* An agent declines information claiming it limits her actions, but the limitation is purely physical (e.g., "If I know the bridge is out, I can't drive across," when ignorance doesn't actually allow her to drive across safely). This confuses normative permission with physical possibility.

  *   **Verdict on the Pattern:** Your students have identified a robust class of cases where knowledge is not just instrumental but constitutive of the practical landscape. It is not a failure of reasoning, but a recognition that information changes the rules of the game, not just the odds.
