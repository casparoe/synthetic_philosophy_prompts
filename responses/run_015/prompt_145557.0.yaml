      *   *Conclusion:* What does this mean for the debate? The debate assumes a cooperative search for truth. Intelligence is adversarial/bureaucratic. Anti-reductionism is too permissive for high-stakes policy. Reductionism is too demanding for speed but correct on verification. The real lesson is about *systems* of testimony, not individual warrant.

  7.  **Self-Correction/Nuance Check:**
