prompt: |-
  I did just over thirty years as a government fisheries biologist, and since retiring I've been volunteering as the verification coordinator for our regional bird atlas — which means I'm the person who looks at what three hundred-odd citizen volunteers send in and decides what gets entered as a record, and at what confidence level. In the last couple of years I've also started reading philosophy, mostly out of stubborness, and I've got properly stuck on that raven example: someone pointed out that a white shoe is evidence that all ravens are black, because saying all ravens are black is apparently the same claim as saying everything that isn't black isn't a raven. My volunteers think this is a joke and I'm not sure it is, and it matters to me practically, because a fair number of the things the atlas is supposed to be able to say have exactly that shape: no pale-morph ravens occur in this region, every nest of species X in the county is on a cliff, all the individuals in the island population are the dark morph.

  So here's what I want. A decision procedure my verification team could actually run on a single submitted record, to say how much evidential weight it gets for a generalization of that all-X-are-Y shape, and where to stop with a no. Not a philosophy essay — I need something a retired volunteer with a field guide and a laptop can work through in ten minutes, thirty to sixty times a week in spring, with no maths past a ratio, and with an explicit instruction about what to do when the number it wants can't be had. It has to hand the decision to a human being at the points where the question is really about what we're willing to stake rather than about evidence, and say so out loud rather than dressing it up as a rule. And it has to be honest about which steps are judgment calls.

  The hard cases I keep hitting, which the procedure has to actually deal with rather than wave at:

  One volunteer has genuinely submitted a spreadsheet of three thousand photographs of non-black objects — shoes, sheep, a grey heron, a cloud — and wants them entered as supporting records. Another has proposed we redeploy volunteers to go out and photograph white things instead of birds, on the grounds that it's cheaper.

  The atlas currently gives "negative" records — I looked at point 47 for an hour and saw no ravens — zero weight, and archives them, while at the same time treating forty years of nobody ever reporting a pale raven as real evidence that there aren't any. That looks inconsistent to me and I want to know whether it is.

  Dependence: fourteen people photograph what is almost certainly the same bird at the same landfill. The same bird is reported forty times across a season. And a bird described as all black in June is photographed pale in November, which might be molt, or age, or wear, or a different individual entirely.

  Definitions: our field guide separates ravens from crows partly on size and tail shape and partly on the bird being all black. If being all black is part of how you identify a raven, then a pale bird can't be a raven by definition, and it feels like the generalization has become unfalsifiable and every weight my team assigns is meaningless. I want a step that catches this before we waste anyone's time.

  Closed versus open populations: on one offshore island the raven population is colour-banded and thought to be around two hundred birds; on the mainland nothing is closed and nobody knows. Should the procedure branch there?

  And lab results: a student sends genotype data showing the dark-morph allele in twelve sampled birds. Where does that sit on the same scale as a photograph, if it sits on it at all?

  Then run it on three cases. First, a single pale raven photographed at a landfill in November by one observer, mediocre photo, reportedly black in June, no specimen, species identification contested by two committee members, and a committee rule that wants two independent observers or a specimen. Second, the three thousand non-black objects. Third, nine thousand black-raven checklist records accumulated over forty years — and give me the honest answer on that one even if it comes out that we should stop collecting them, because I suspect it might, and I'd rather hear it plain than have it softened.

  Finally, tell me what the procedure can't do. My guess is that it can only ever rate a record against one hypothesis at a time and has nothing to say about what that same record is worth to the atlas for distribution or population trend, but you tell me. I've no library access any more, so please don't send me off to read somebody — just argue for the procedure you give me.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired government fisheries biologist (30+ years), currently volunteering as verification coordinator for a regional bird atlas. Experienced, practical, skeptical of abstract theory but intellectually curious (reading philosophy).
      *   **Task:** Create a practical decision procedure for evaluating evidential weight of single records regarding universal generalizations (e.g., "All ravens here are black").
      *   **Constraints:**
          *   Must be usable by a retired volunteer with a field guide/laptop.
          *   Time limit: ~10 minutes per record.
          *   Frequency: 30-60 times/week in spring.
          *   Math: No higher than ratios.
          *   Must handle "hard cases" (non-black objects, dependence, definitions, closed vs. open populations, lab data).
          *   Must explicitly identify judgment calls vs. evidence.
          *   Must run on three specific test cases.
          *   Must state limitations.
          *   No academic references/library access needed.
      *   **Core Problem:** The Hempel's Raven Paradox (white shoes evidence for black ravens) applied to real-world citizen science data verification. The user sees inconsistencies in how "negative evidence" (no ravens seen) vs. "absence of evidence" (no pale ravens reported in 40 years) is treated.

  2.  **Deconstruct the Philosophical Problem (Hempel's Paradox) for Practical Use:**
      *   *The Paradox:* "All ravens are black" is logically equivalent to "All non-black things are non-ravens." Therefore, a white shoe (non-black, non-raven) confirms the hypothesis.
      *   *The Practical Reality:* A white shoe provides *negligible* confirmatory weight compared to a black raven. Why? Because the set of "non-black things" is vastly larger than the set of "ravens."
      *   *The User's Need:* A way to quantify this "negligible" vs. "significant" without getting bogged down in Bayesian calculus, while acknowledging that *some* weight exists but might be below a threshold of utility.
      *   *Key Insight:* Evidence weight depends on *risk of falsification*. A black raven risks being non-black. A white shoe risks being a raven. The risk is much higher with the raven.

  3.  **Drafting the Procedure (The "Verification Weight Protocol"):**
      *   *Goal:* A flowchart or step-by-step checklist.
      *   *Step 1: Relevance Filter (The "Shoe Stop").* Does this record *could* possibly falsify the claim? If I see a white shoe, does it threaten "All ravens are black"? Technically yes, practically no. We need a cutoff.
      *   *Step 2: Identification Confidence.* Is it actually a raven? (Addresses the definition problem).
      *   *Step 3: Independence/Dependence.* Is this 1 bird or 14 photos of 1 bird?
      *   *Step 4: Population Context.* Closed (island) vs. Open (mainland).
      *   *Step 5: The Weight Calculation.* A simple scoring system (High, Medium, Low, Zero).
      *   *Step 6: The Judgment Call.* Explicitly stating where human values enter (e.g., "How sure do we need to be?").

  4.  **Addressing Specific Hard Cases:**
      *   *3,000 Non-Black Objects:* Relevance Filter should kill this. It's noise.
      *   *Negative Records (Looked, saw nothing):* Distinguish between "Search Effort" (valid) and "Passive Absence" (invalid). 40 years of no pale ravens is cumulative search effort, not just "nobody sent a form."
      *   *Dependence:* 14 photos of 1 bird = 1 record.
      *   *Definitions:* If "black" is part of the ID key, a pale bird is "Not a Raven" by definition *unless* we allow for morphs. Need to separate *Taxonomic ID* from *Trait Observation*.
      *   *Closed vs. Open:* Closed populations allow for "Exhaustive Search" logic. Open populations rely on probability.
      *   *Lab Data:* Genotype is high confidence for trait, but needs linking to phenotype.

  5.  **Refining the Math (Ratios only):**
      *   Avoid Bayes' Theorem formulas. Use "Falsification Potential."
      *   Concept: *Opportunity to be Wrong.*
      *   Score = (Confidence in ID) × (Risk of Falsification).

  6.  **Developing the Three Test Cases:**
      *   *Case 1 (Pale Raven):* High stakes. Low confidence photo. Contested ID. Procedure should flag for "Expert Review" and likely reject as evidence for "All Black" until confirmed.
      *   *Case 2 (3,000 Shoes):* Immediate reject for *this* hypothesis. Valid for other things (presence of shoes?), but not raven color.
      *   *Case 3 (9,000 Black Ravens):* This is the crux. 40 years of data. Is it evidence? Yes, but diminishing returns. The procedure needs to admit that after a certain point, more black ravens add almost nothing. This addresses the user's suspicion that we should stop collecting them *for this specific question*.

  7.  **Addressing the Limitations:**
      *   Single hypothesis focus.
      *   Doesn't measure abundance.
      *   Doesn't measure distribution range (unless tied to location).
      *   Doesn't solve the "Definition" trap fully (that's taxonomic, not statistical).

  8.  **Tone and Style:**
      *   Respectful of expertise (30 years bio).
      *   Direct, no fluff.
      *   Acknowledge the philosophy without worshipping it.
      *   Practical "clipboard" feel.

  9.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Initial thought:* Maybe use a 1-10 scale. *Correction:* Too subjective. Use categories (High, Low, Null) with clear criteria.
      *   *Initial thought:* Try to explain Bayesian updating. *Correction:* User said "no maths past a ratio." Stick to "Weight Classes."
      *   *Crucial Point:* The user mentioned the inconsistency of "Negative Records." I need to clarify that "No ravens seen" is only evidence if *ravens were expected*. A "Zero Weight" policy on negative records is wrong if the protocol was "Count all ravens." If the protocol was "Report rare morphs," then silence is evidence. I need to make sure the procedure distinguishes *Search Effort* from *Passive Observation*.
      *   *The "White Shoe" issue:* I need to be honest. A white shoe *is* evidence, but the weight is so low it's operationally zero. The procedure must explicitly say "Ignore" rather than "Calculate."
      *   *The Definition Trap:* This is critical. If the field guide says "Ravens are black," then a pale bird is a Crow or a Hybrid. The procedure needs a "Taxonomic Gate" before the "Evidence Gate."

  10. **Final Polish:** Check against all constraints. 10 mins? Yes. Ratios only? Yes. Judgment calls highlighted? Yes. Three cases run? Yes. Limitations stated? Yes.

  *(Self-Correction on Case 3)*: The user suspects we should stop collecting black raven records. I need to validate that. If the hypothesis is "All ravens are black," 9,000 confirmations is overwhelming, but the *marginal utility* of the 9,001st is near zero. The procedure should recommend shifting effort to *falsification* (looking for pale ones) rather than *confirmation*.

  *(Self-Correction on Negative Records)*: The user says atlas gives negative records zero weight. But 40 years of silence is treated as evidence. The distinction is *Standardized Effort*. If volunteers are just sending in positives, silence is noise. If volunteers are doing timed counts, silence is data. The procedure must distinguish "Incidental" vs. "Systematic" non-detections.

  Let's build the "Verification Weight Protocol" (VWP).

  *Structure:*
  1.  Preamble (Philosophy in plain English).
  2.  The Procedure (Steps 1-6).
  3.  The Judgment Call (Explicit section).
  4.  Running the Cases.
  5.  Limitations.

  *Refining the "White Shoe" logic:*
  Don't say it's not evidence. Say it fails the "Efficiency Threshold."
  Ratio: Size of "Raven Set" vs. Size of "Non-Black Set."
  If Non-Black Set >> Raven Set, Weight = 0 for practical purposes.

  *Refining the "Definition" logic:*
  Step 0: Is the trait part of the ID? If yes, a counter-example is an ID error *or* a taxonomic crisis. Don't log as "Pale Raven," log as "Corvid sp. (pale)."

  Okay, ready to write.
answer: |-
  Here is a decision procedure designed for your specific context. It strips the philosophy down to its operational bones and treats evidence as a resource that costs time to verify.

  ### The Verification Weight Protocol (VWP)
  **Purpose:** To assign an evidential weight class to a single record regarding a universal claim (e.g., "All Region X Ravens are Black").
  **Time Budget:** 10 minutes per record.
  **Math Limit:** Ratios and Categories only.

  ---

  #### Step 0: The Definition Gate (Stop/Go)
  *Before weighing evidence, check if the claim is tautological.*
  *   **Question:** Is the trait in question (e.g., "black") a mandatory diagnostic feature in your field guide for identifying the species?
  *   **If YES:** A "pale raven" is a contradiction in terms. It is either a different species, a hybrid, or a misidentification.
      *   **Action:** Do not enter as "Pale Raven." Enter as "Corvid sp. (unidentified)" or "Hybrid."
      *   **Weight:** **NULL** for the hypothesis "All Ravens are Black" (because you defined them that way).
      *   **Note:** This prevents the generalization from being unfalsifiable. If you want to test the color, you must identify the bird by *other* means (genetics, skeletal, vocalization) first.
  *   **If NO:** (e.g., "All nests are on cliffs" or "All island birds are dark morph"): Proceed to Step 1.

  #### Step 1: The Relevance Filter (The "White Shoe" Test)
  *Does this record have a realistic chance of falsifying the claim?*
  *   **Logic:** A record supports "All X are Y" best if it is an **X** that could have been **not-Y**. A record that is **not-X** (a shoe, a sheep) is technically evidence, but the set of "not-X" is too large to process.
  *   **Rule:**
      *   Is the record an instance of the Subject (Raven)? **Yes → Proceed.**
      *   Is the record an instance of Non-Subject (Shoe, Heron, Cloud)? **Yes → STOP.**
      *   **Weight:** **ZERO.**
      *   **Instruction:** Do not enter these as supporting records for the generalization. Archive them as "General Presence" only. Tell the volunteer: *"This helps map where birds aren't, but it doesn't test the color rule. We need ravens."*
      *   **Judgment Call:** If a volunteer proposes photographing white things to save money, reject it. The ratio of "White Things" to "Ravens" is millions to one. It is inefficient science.

  #### Step 2: Independence Check (The "Landfill" Test)
  *Is this one piece of evidence or many copies of the same piece?*
  *   **Rule:**
      *   Multiple photos of the same individual at the same time = **1 Record.**
      *   Same individual reported 40 times in a season = **1 Record** (for the purpose of the generalization).
      *   Different individuals (confirmed by banding, distinct markings, or widely separated locations/times) = **Separate Records.**
  *   **Weight Adjustment:** If dependence is suspected but not provable, downgrade the Weight Class by one level (see Step 4).

  #### Step 3: Population Context (Closed vs. Open)
  *How much does this record tell us about the whole group?*
  *   **Closed Population (e.g., Color-banded Island, N=200):**
      *   Every individual counts. If you have verified 199 black birds, the 200th matters immensely.
      *   **Multiplier:** 1.0 (Full Weight).
  *   **Open Population (Mainland, N=Unknown):**
      *   You are sampling. Diminishing returns apply.
      *   **Multiplier:** 0.5 (Half Weight) for standard confirmations after the first 100 records.
  *   **Negative Records (Saw nothing):**
      *   **Incidental** ("I walked here and saw no ravens"): **ZERO Weight.**
      *   **Systematic** ("I sat here for 1 hour specifically counting corvids"): **LOW Weight.** (It adds to the "search effort" denominator, making the absence of pale morphs more significant, but does not count as a positive data point).

  #### Step 4: Assign Weight Class
  *Combine ID confidence and Falsification Risk.*

  | Class | Criteria | Evidential Value |
  | :--- | :--- | :--- |
  | **HIGH** | **Falsifier.** A confirmed instance of the Subject that *lacks* the Trait (e.g., a verified pale raven). OR a Systematic Negative in a high-probability zone. | **Critical.** Requires immediate senior review. Can overturn the generalization. |
  | **MEDIUM** | **Verifier.** A confirmed instance of the Subject *with* the Trait (e.g., a black raven) in an Open Population. | **Supportive.** Adds to the cumulative case, but marginal value drops as N rises. |
  | **LOW** | **Verifier.** A confirmed instance in a Closed Population where N is near total. OR Genetic data confirming trait without visual. | **Strong Context.** Good for closing the loop on specific populations. |
  | **ZERO** | Non-Subject (Shoes). Incidental Non-detection. Dependent duplicates. | **None.** Do not count toward the generalization. |

  #### Step 5: The "Marginal Utility" Cut-off
  *When to stop counting confirmations.*
  *   **Rule:** For Open Populations, once you have >1,000 independent **MEDIUM** weight records confirming the trait, the 1,001st record adds negligible confidence.
  *   **Instruction:** If the database exceeds this threshold, change the data entry form. Stop asking for "Color: Black" on every raven checklist. Start asking: *"Did you see any NON-black corvids?"*
  *   **Why:** You are no longer testing the hypothesis; you are padding the database.

  #### Step 6: The Human Judgment Call (Explicit)
  *This is where the procedure hands the decision to you.*
  *   **Trigger:** Any **HIGH** weight record (a potential falsifier).
  *   **The Question:** "What are we willing to stake?"
  *   **Options:**
      1.  **Reject:** "ID not secure enough." (Conservative. Protects the atlas reputation. Risks hiding a real range expansion or morph).
      2.  **Accept with Flag:** "Entered as 'Anomalous'." (Honest. Admits uncertainty. Allows future re-evaluation).
      3.  **Demand More:** "Requires specimen or second observer." (Rigorous. May be impossible for rare events).
  *   **Instruction:** Write the reason in the verification log. Do not hide behind a rule. Example: *"Accepted as pale morph despite poor photo because observer is trusted and molt season matches. Flagged for review."*

  ---

  ### Running the Test Cases

  #### Case 1: The Single Pale Raven (Landfill, November, Mediocre Photo)
  *   **Step 0 (Definition):** Is "all black" part of the raven ID key? If yes, this is a "Corvid sp." If no, proceed.
  *   **Step 1 (Relevance):** It is a raven. **Pass.**
  *   **Step 2 (Independence):** Single observer, single bird. **Pass.**
  *   **Step 3 (Context):** Open population (landfill).
  *   **Step 4 (Weight):** **HIGH** (It is a potential falsifier).
  *   **Step 5 (Cut-off):** N/A (It's a falsifier, not a confirmation).
  *   **Step 6 (Judgment):**
      *   *Conflict:* Committee rule wants 2 observers/specimen. Photo is mediocre.
      *   *Decision:* **Flag and Archive.** Do not enter as "Pale Raven." Enter as "Corvid sp. (morph unknown)."
      *   *Reasoning:* The cost of a False Positive (claiming pale ravens exist when it's just a dirty crow) is higher than a False Negative (missing one record).
      *   *Action:* Contact observer. Ask for raw file metadata. If no further proof, it remains an anecdote, not atlas data.
      *   *Honesty:* "We are staking the atlas's accuracy on requiring higher proof for anomalies than for norms."

  #### Case 2: The 3,000 Non-Black Objects (Shoes, Sheep, Clouds)
  *   **Step 1 (Relevance):** **FAIL.** These are Non-Subjects.
  *   **Weight:** **ZERO.**
  *   **Instruction:** Reject the spreadsheet for *this* hypothesis.
  *   **Feedback to Volunteer:** "Thank you. This data proves there are 3,000 non-ravens in the region. It does not help us determine raven color. Please focus effort on photographing corvids."
  *   **Honesty:** "The ratio of 'Non-Black Things' to 'Ravens' is too high. Processing this costs more in volunteer hours than it gains in statistical confidence."

  #### Case 3: 9,000 Black Raven Records (40 Years)
  *   **Step 1 (Relevance):** **Pass.**
  *   **Step 2 (Independence):** Assume many are dependent (same flock, same hotspot). Let's estimate 1,000 independent individuals.
  *   **Step 3 (Context):** Open Population.
  *   **Step 4 (Weight):** **MEDIUM.**
  *   **Step 5 (Cut-off):** **TRIGGERED.** You have passed the 1,000 independent confirmation threshold.
  *   **Honest Answer:** **Stop collecting these for this purpose.**
      *   The 9,001st black raven adds effectively zero new information about the claim "All ravens are black."
      *   The 40 years of silence on pale ravens *is* evidence, but only because it represents 40 years of *search effort* where a pale raven *would have been seen*.
      *   **Action:** Change the protocol. Tell volunteers: "We have enough data on black ravens. We now need 'Zero Data' (timed counts with no ravens) to establish search effort, and 'Anomaly Data' (anything not black)."
      *   **Inconsistency Fix:** The atlas is right to give incidental "I saw nothing" records zero weight. But it is wrong to ignore the *cumulative* weight of 40 years of *active* birding where no pale morphs appeared. The evidence isn't the "no"; the evidence is the "looked."
      *   **Procedure:** Create a "Search Effort" layer. 40 years of checklists = High Confidence in Absence. 40 years of silence without checklists = Low Confidence.

  ---

  ### What This Procedure Cannot Do

  You asked for honesty about limitations. Here they are:

  1.  **Single Hypothesis Blindness:** This protocol rates a record for *one* claim ("All Ravens are Black"). It does not tell you the record's value for *other* claims (e.g., "Raven population is increasing" or "Ravens are moving north"). A black raven record is useless for the color hypothesis (after the cutoff) but vital for the population hypothesis. **You need a separate tagging system for distribution/trend data.**
  2.  **The "Truth" Trap:** This procedure rates *evidential weight*, not truth. A HIGH weight record (a pale raven) could still be a fake photo. The procedure flags it for human judgment; it does not automate truth.
  3.  **Genotype vs. Phenotype:** Lab data (genotypes) sits at **LOW/MEDIUM** weight for *visual* generalizations. A dark-morph allele confirms the genetic potential, but if the bird looks white due to leucism, the visual generalization "All ravens are black" is still falsified. **Genetic data verifies the mechanism, not the observation.** Keep them in separate database fields.
  4.  **Resource Allocation:** The procedure tells you when to stop collecting confirmations (Case 3), but it cannot force the funding body to agree. It can only tell you that continuing is scientifically inefficient.

  ### Summary for Your Team
  1.  **White Shoes:** Ignore. (Weight 0).
  2.  **Black Ravens:** Count until you have 1,000 independent records, then stop counting for *this* question. (Weight Medium → Diminishing).
  3.  **Pale Ravens:** Every single one is critical. (Weight High).
  4.  **Silence:** Only counts if accompanied by proof of looking (checklists). (Weight Low/Contextual).
  5.  **Definitions:** If "black" defines "raven," you can't test the color. You must identify by bone or gene first.
  6.  **Judgment:** When a record threatens the rule, admit you are making a value judgment on risk, not just counting data.

  This keeps the philosophy in the engine room where it belongs, and gives you a wrench you can actually hold.
