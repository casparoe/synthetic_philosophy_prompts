answer: |-
  This is a sharp observation. You have identified a specific species of technological optimism that is common in municipal governance but rarely interrogated. It is not just that technology is useful; it is that technology is *constitutive* of rights.

  Here is a reconstruction of the implicit theory, its limits, its internal tensions, and how your test case exposes its mechanics.

  ### 1. Reconstructing the Implicit Theory: "Moral Delegation to Hardware"

  The committee's practice presupposes a theory we might call **Materialized Entitlement**. It is a specific variation of Langdon Winner's thesis, but filtered through a managerial lens.

  Winner argued that artifacts can embody specific forms of power and authority (e.g., low bridges keep buses out). Your committee is operating on a stronger, more normative claim: **Artifacts can embody *rights* more securely than social norms can.**

  The logic runs like this:
  1.  **Human Discretion is Fragile:** A driver's willingness to help is contingent on mood, prejudice, time pressure, or training. It is a "favor."
  2.  **Technical Function is Robust:** A ramp deploys when a button is pressed. It does not judge. It does not get tired.
  3.  **Delegation is Improvement:** Therefore, moving the locus of accommodation from the *driver* (social) to the *ramp* (technical) transforms a request for charity into an exercise of entitlement.

  This aligns with Bruno Latour's concept of **moral delegation**. Latour argued that we often offload moral responsibilities onto things (e.g., a speed bump "cares" about your speed so the police don't have to). In your case, the ramp is delegated the moral duty of "non-discrimination."

  **Does this require the strong Winner claim?**
  Strictly speaking, no. A deflationary instrumentalist could argue: *"The ramp is just a tool. The ADA (or local equivalent) is the source of the right. The ramp just reduces friction."*
  However, your **Wrinkle #1** (the removal of the human fallback) reveals that the committee is not acting like instrumentalists. An instrumentalist would keep the human backup because the tool is fallible. By removing the human backup (via liability/union rules), the committee has made the **artifact the sole guarantor of the right.**
  *   **Strict Presupposition:** The practice *requires* the belief that the technical system is sufficiently reliable to replace the social system.
  *   **Implicit Commitment:** It assumes that if the artifact functions, the politics are solved. It treats the ramp not as a lever for behavior, but as the *instantiation* of the policy itself.

  ### 2. Strict Presupposition vs. Compatibility (The Deflationary Critique)

  Is the view underdetermined? Could a neutral-tool theorist explain this setup without conceding that artifacts have politics?

  **The Deflationary Defense:**
  A defender of the neutral-tool view would say: *"You are confusing the interface with the regime. The ramp is neutral. The liability rules and union contracts are the politics. The ramp didn't take the power away from the driver; management took the power away from the driver and gave the driver a ramp to distract everyone."*

  On this view, the ramp is a **Compliance Interface**. It allows the agency to claim it has solved accessibility without actually changing the power dynamics of the workplace or the street. The "politics" never left the human realm; they just moved from the driver-rider interaction to the manager-driver interaction.

  **Where the Practice Breaks the Deflationary View:**
  The deflationary view works until you ask why the committee calls the new system a "moral improvement." If the ramp were just a neutral tool, its failure (Wrinkle #1) would be a maintenance issue. But the committee treats the ramp's failure as a **civil rights violation** in a way they never treated the driver's grumpiness.
  *   **Strict Presupposition:** The practice presupposes that **technical failure is equivalent to rights revocation.**
  *   **Compatibility:** The practice is *compatible* with the deflationary view only if you assume the committee is deluded about the source of the improvement. But functionally, they are betting on the artifact. They have bet the riders' access on the ramp's reliability, which implies they believe the ramp holds the political weight, not the driver.

  ### 3. The Inconsistency: Fixed-Route vs. Paratransit

  You ask if the rigid fixed-route (materialized entitlement) and the flexible paratransit (bureaucratic discretion) are inconsistent.

  **They are not inconsistent; they are complementary.**
  One theory licenses both without strain: **Technocratic Triage.**

  This theory holds that:
  1.  **High-Volume/High-Predictability:** Use Materialized Entitlement. Standardize the users (low-floor buses), standardize the environment (stops), and automate the right. This minimizes marginal cost per rider.
  2.  **Low-Volume/High-Unpredictability:** Use Bureaucratic Discretion. Segregate the users (paratransit), require verification (means-testing/booking), and manage the right administratively. This contains liability and cost.

  **The Political Implication:**
  This reveals that the "entitlement" on the fixed-route bus is not actually about *dignity* or *autonomy* in the abstract. It is about **throughput.**
  *   On the bus, autonomy is granted because it makes the bus move faster (ideally) by removing driver-rider negotiation.
  *   In paratransit, autonomy is restricted because flexibility is expensive.

  If the philosophy were truly "rights are materialized in hardware," paratransit vehicles would also be low-floor, on-demand, and driver-free (or driver-empowered). The fact that they are not proves the "Materialized Entitlement" theory is actually a **Standardization Strategy.** The committee is presupposing that rights can be automated *only where users fit the standard.* The "politics" here is a commitment to the normate body: if you fit the bus, you get the automated right. If you don't, you get the bureaucratic process.

  ### 4. The Test Case: Maintenance vs. Metrics

  You have money for one fix.
  *   **Fix A:** Maintenance + Human Fallback (Restore the socio-technical hybrid).
  *   **Fix B:** Scheduling Metric Change (Align the conflicting artifact).

  Here is how the rival views adjudicate this, and what the outcome implies.

  **View 1: Materialized Entitlement (The Committee's Implicit View)**
  *   **Diagnosis:** The ramp is the locus of the right. When the ramp fails, the right vanishes.
  *   **Recommendation:** **Fix A.** You must ensure the artifact works, or provide a human proxy who acts *as* the artifact (a maintenance-backed driver assist).
  *   **Reasoning:** The promise was that the *vehicle* provides access. If you fix the metrics but the ramp still breaks in winter, the rider is still stranded. The hardware must deliver the promise.

  **View 2: Systemic Politics (The Critical STS View)**
  *   **Diagnosis:** The ramp is a "dumb" artifact; the scheduling system is a "smart" artifact. The scheduling system inscribes value on time that overrides the value inscribed on the ramp. The driver is caught between two material commands: "Deploy Ramp" (Bus) vs. "Make Time" (Dispatch).
  *   **Recommendation:** **Fix B.**
  *   **Reasoning:** Even if the ramp works perfectly (Fix A), if the metric punishes the 40 seconds, drivers will find ways to avoid using it (e.g., "I can't get the ramp to work, just hop up"). The *incentive structure* is the dominant political force. Fixing the ramp without fixing the metric is like paving a road that leads to a wall.

  **The Crucial Implication:**
  If **Fix B (Metrics)** turns out to matter more than Fix A (Ramps)—if access improves more by changing the dispatch software than by fixing the hydraulic lift—it delivers a devastating blow to the Committee's implicit philosophy.

  It would prove that **Organizational Artifacts dominate Physical Artifacts.**
  The Committee assumes the politics are in the *floor height*. The reality would show the politics are in the *spreadsheet*.
  *   **For the "Artifact-Has-Politics" Claim:** It does not disprove the claim generally, but it **displaces the locus.** It shows the committee fetishized the visible technology (the bus) while ignoring the invisible technology (the scheduling algorithm).
  *   **For the "Moral Improvement" Claim:** It reveals that the shift from high-floor to low-floor was not a moral evolution, but a **visibility shift.** They moved the politics from the driver (visible, blameable) to the schedule (invisible, unassailable).

  **Summary for your Committee:**
  You are operating under the assumption that you have **engineered out discretion.** You haven't. You have merely **displaced discretion** from the driver's seat to the dispatch office, and **displaced risk** from the agency to the rider (when the ramp breaks).

  If you want to argue for Fix A (Human Fallback), you must argue that **rights cannot be fully delegated to machines.** You must argue for a "Human-in-the-Loop" not as a regression to the old favor-based system, but as a necessary redundancy for a rights-based system.

  If you want to argue for Fix B (Metrics), you must argue that **the ramp is not the policy; the schedule is.**

  If you do nothing, you are affirming that **efficiency metrics are a higher political order than accessibility rights,** because when they conflict, the metrics are the ones you refuse to change.
