answer: |-
  **Thought Experiment**

  Juror Elena must determine whether a defendant signed a binding contract ($H$) or did not ($\neg H$) based on ambiguous witness testimony that intuitively supports $H$ with a first-order credence of 0.75. Elena possesses reliable higher-order knowledge that her "trustworthiness heuristic" systematically inflates the probability of $H$ by exactly 0.10 in ambiguous testimony cases, creating a reflective calibration trap. The practical context involves asymmetric but non-catastrophic costs: a false belief in $H$ subjects the defendant to a moderate reputational penalty, while a false belief in $\neg H$ carries no practical cost, though both errors remain epistemically undesirable. An accuracy-first epistemologist argues Elena must calibrate her credence downward to 0.65 to minimize expected Brier-score inaccuracy given her known bias, whereas an epistemic-utility theorist permits her to retain the 0.75 credence, prioritizing the explanatory coherence of trusting her immediate cognitive uptake and avoiding the self-undermining doubt that arises from fragmenting her first-order conviction with second-order correction.

  **Analysis**

  *   **Belief and Method:** The belief in question is the credence assigned to $H$ (Contract Signed). The method involves a first-order heuristic (testimony evaluation) modified by second-order meta-knowledge (bias awareness).
  *   **Relevant Nearby Worlds:** The relevant worlds are those where $H$ is true and those where $\neg H$ is true, weighted by the objective reliability of Elena's heuristic. In the accuracy-first calculation, the "nearest" worlds are those where the bias-corrected probability (0.65) aligns with the frequency of truth in similar cases.
  *   **Theoretical Verdicts:**
      *   **Accuracy-First:** This theory posits that the sole epistemic good is accuracy (minimizing distance from truth, typically via Brier score). Since Elena knows her process adds 0.10 noise favoring $H$, maintaining 0.75 guarantees a higher expected inaccuracy than 0.65. The norm demands she treat her higher-order knowledge as data, forcing the downward revision to maximize expected accuracy.
      *   **Epistemic-Utility:** This theory aggregates accuracy with other goods, such as cognitive coherence and stability. Calibrating to 0.65 creates a doxastic split: Elena must act on a belief she knows is artificially deflated relative to her evidence's "feel." The theorist argues the utility loss from this self-undermining fragmentation (which threatens future cognitive agency) outweighs the marginal Brier-score gain of calibration, permitting the 0.75 credence.
  *   **Structural Feature:** The divergence is generated by the interaction between **second-order method-awareness** and an **exclusively accuracy-weighted value function**. The accuracy-first view treats the bias as a correctable error in the truth-tracking function; the utility view treats the *correction process* as a potential source of epistemic disvalue (incoherence).
  *   **Cost Asymmetry:** Eliminating the practical cost asymmetry **does not collapse the disagreement**. The divergence stems from how each theory values the *structure* of belief (calibrated accuracy vs. coherent stability) in the face of higher-order evidence, not the practical outcomes of the verdict. Since the epistemic-utility theorist's permission relies on "avoidance of self-undermining doubt" (an internal epistemic good) rather than pragmatic risk-avoidance, removing the reputational penalty leaves the theoretical conflict over calibration intact.
  *   **Accuracy-First Counter-Attack:** An accuracy-first defender could attack the case by denying that "avoidance of self-undermining doubt" is a genuine *epistemic* good. They would argue that coherence with a known error is not stability but irrationality (akrasia), and that true epistemic utility is exhausted by accuracy; thus, any "discomfort" from calibration is merely psychological, not epistemic, and should not influence credence norms.
