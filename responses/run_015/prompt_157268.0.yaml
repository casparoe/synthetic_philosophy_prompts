          *   *Implication:* Economic constraints causing delays could literally kill the person (metaphysically). This makes access to replacement a life-or-death right, not just healthcare.
          *   *Contrast:* PC wouldn't care about the speed, only the resulting psychology.

      *   **(c) Metaphysical Status (Fully Replaced):**
          *   *CCI View:* If the process was valid, it is the *same person*. If the process violated CCI (even if psychology looks the same), it is a *successor* or *copy*.
          *   *Implication:* "Same person" is a factual claim about the *history of the process*, not just the current state.
          *   *Contrast:* PC says "Same person" based on current traits.

