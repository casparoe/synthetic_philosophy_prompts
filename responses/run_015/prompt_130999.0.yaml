      Critically evaluate the "procedural-fiction problem" within the philosophy of art and emotion. In interactive media, players often experience genuine dread from algorithmically generated horror imagery known to lack specific authorial intent. Assess whether this absence of intentional authorship undermines the belief-emotion gap identified by Colin Radford. Furthermore, determine whether Kendall Walton's account of quasi-emotions and make-believe can accommodate procedural generation without theoretical revision. Your response must address the epistemic shift caused by algorithmic systems and conclude on whether this variant necessitates a new theoretical category.

