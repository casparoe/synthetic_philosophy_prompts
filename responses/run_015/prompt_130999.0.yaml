prompt: |-
  I am a high school senior preparing an independent-study exam on philosophy of art and emotion. Please draft one upper-level essay question on the paradox of fiction, together with a model answer of roughly 500 words and a marking scheme out of 20 marks. The question should not be answerable by summarizing Radford’s three conditions or Walton’s make-believe theory alone; instead, it should ask students to examine a niche variant—the “procedural-fiction problem”—in which a player in interactive media knows that an emotional trigger, such as horror imagery, is algorithmically generated rather than intentionally authored, yet still feels genuine dread. Students must assess whether this absence of authorial intent undermines the standard belief-emotion gap that Radford identifies, and whether Walton’s account of quasi-emotions can accommodate procedural generation without revision. The model answer must make five specific moves: (1) precise statement of Radford’s conditions, (2) explanation of how procedural generation alters the epistemic situation relative to authored fiction, (3) analysis of whether belief-like commitment is genuinely absent or structurally transformed, (4) evaluation of Walton’s pretense theory applied to algorithmic sources, and (5) a defended conclusion on whether the paradox requires a new theoretical category. The marking scheme should assign marks to each move and identify the specific error—especially conflating procedural generation with mere unreliability of authorship—that separates an A answer from a B. Please begin your response with the exam question itself, followed immediately by the model answer and then the marking scheme, with no introductory commentary or restatement of this request.
