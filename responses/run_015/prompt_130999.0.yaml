      **Model Answer:**
      Colin Radford's paradox of fiction rests on three inconsistent conditions: (1) we experience genuine emotions only toward entities we believe exist; (2) we know fictional entities do not exist; yet (3) we experience genuine emotions toward fictional entities. Traditionally, this highlights a conflict between cognitive judgment and affective response. However, the procedural-fiction problem complicates this by removing the stable "fictional contract" of authored narrative.

      In procedurally generated media, the epistemic situation shifts from interpreting fixed authorial intent to interacting with dynamic systems. When a player encounters horror imagery generated by an algorithm rather than a director's specific design, they know the *system* exists, even if the specific monster does not. This alters Radford's second condition. The player does not merely suspend disbelief regarding a static narrative; they acknowledge the reality of the procedural mechanism causing the stimulus. The threat is not "unreal" in the same way a scripted jump-scare is; it is an emergent property of a real computational process.

      Consequently, belief-like commitment is not absent but structurally transformed. Radford assumes belief concerns the ontological status of the character. In procedural contexts, belief concerns the reliability of the system. The player believes the system is capable of harming their in-game avatar or disrupting their psychological state. Therefore, the emotional response is not based on a contradiction regarding existence, but on a verified belief in the system's capacity to generate unpredictability. The "gap" narrows because the source of the emotion (the code) is real, even if the content (the monster) is fictional.

      Applying Walton's theory requires scrutiny. Walton argues we experience "quasi-emotions" within a game of make-believe, where props prescribe imaginings. In procedural generation, the "props" are algorithmic rules. If the system reacts dynamically to player input, the boundary between pretense and genuine reaction blurs. Walton's account assumes a stable prop structure defined by an author. When the prop generates itself, the player's pretense is no longer guided by human intention but by systemic logic. While Walton could argue this is still make-believe, the lack of authorial intent weakens the principle of generation. The player isn't just imagining fear; they are navigating a real risk of systemic failure or unexpected trauma, suggesting quasi-emotion is insufficient to describe the visceral response to algorithmic unpredictability.

      Ultimately, the procedural-fiction problem suggests the paradox requires a new theoretical category or significant revision. Radford's paradox relies on a binary of existence versus non-existence. Procedural media introduces a third ontological state: systemic potentiality. Walton's make-believe theory struggles to account for emotions derived from non-intentional sources. Because the emotional trigger is real (the code) while the object is fictional (the image), the standard belief-emotion gap collapses. Therefore, neither Radford nor Walton fully resolves the paradox without accommodating the unique ontology of algorithmic art, where emotion arises from the reality of the process rather than the fiction of the content.

