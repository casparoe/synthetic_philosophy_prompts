  ## Part 3: The "Hope Nobody Asks" Objection

  **The Objection:** "If the 'standpoint of the relationship' is the source of reasons, what happens when the relationship ends? If I divorce my spouse or quit my job, do the reasons vanish? If they vanish, morality is too contingent. If they don't, where do they come from?"
  *   **Why it's dangerous:** It attacks the stability of moral reasons. If reasons depend on the role's existence, morality becomes fragile.
  *   **Strategy if it comes:**
      1.  **Distinguish:** Distinguish between the *source* of the reason (the role) and the *residue* of the reason (history).
      2.  **Reply:** "When a role ends, the *forward-looking* reasons generated by the standpoint vanish, but *backward-looking* reasons regarding how the role was occupied remain. I have no duty to care for my ex-spouse as a spouse, but I have duties regarding how we treated each other *during* the role. The view accounts for the contingency of moral life without collapsing into nihilism."
      3.  **Pivot:** "This actually highlights why role failure is so damaging—it destroys the future possibility of reasons, not just the past."

  ---

  ## Part 4: The Chair's Methodology Question (Philosophy vs. History)

  **The Question:** "Is this moral philosophy or intellectual history?"
  **The Strategy:** Do not retreat to "I'm just interpreting texts." Do not overclaim "This is the truth and Confucius said it."
  **The Script:**
  "It's moral philosophy that uses historical reconstruction as its data set. I'm not asking you to accept these claims because Confucius said them. I'm asking you to accept them because they solve a systematic problem in value theory—the tension between particularism and universalism—that contemporary analytic tools haven't resolved. The Early Modern tradition often used historical texts to do systematic work; I'm treating the Confucian canon similarly. The texts are the proof of concept; the argument stands on its normative merit."

  ---

  ## Part 5: Recommendation on Claims

  **Demote Claim 3 (The Contemporary Cases).**
  *   **Why:** Claim 3 (Arbitration & Dementia) is the most vulnerable to empirical pushback from people who don't know the field (the whole room). The Consequentialist will attack the arbitration analysis; the Care Ethicist will attack the dementia analysis. It distracts from your core value theory innovation (Claims 1 & 2).
  *   **How:** In the talk, introduce the cases as *illustrations* of the "Role Failure" test, not as central proofs. Spend 80% of your time on Claims 1 and 2 (The Third-Personal Standpoint & Remonstrance). If Q&A gets hostile on the cases, say: "The specific application is secondary; the core contribution is the structural account of reasons." This protects your main theoretical contribution from being dragged down by empirical quibbles.
