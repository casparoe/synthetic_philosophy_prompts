answer: |-
  Okay, let's put on our ontologist hats. I'm going to break this down the way we would in a grad seminar, looking at the metaphysical commitments your friend Mara is implicitly making. You're asking me to reverse-engineer her "social construction detector."

  Here is the breakdown of the rule she is running, the tension points in her data, my predictions for the new cases, and a test case to expose the cracks in her theory.

  ### 1. Reverse-Engineering Mara's Rule

  Looking at her track record, Mara isn't running just one simple heuristic (like "does it exist without humans?"). If she were, *Race* would be tricky, because human biological variation exists without humans, even if racial *categories* don't. Instead, she seems to be running a hybrid of two philosophical criteria, prioritizing one over the other depending on the domain.

  **Criterion A: Mind-Independence (The "Crow" Test)**
  *   *The Rule:* If the thing would still exist and have its core properties even if humans and all our practices vanished, it is **not constructed**.
  *   *Fits:* Crow, Type 1 Diabetes, Left-Handedness, Six Feet Tall (the physical length, not the unit).
  *   *Logic:* These are "Brute Facts." They are grounded in physics or biology, not human agreement.

  **Criterion B: Institutional/Interactive Dependence (The "Money" Test)**
  *   *The Rule:* If the thing depends on human rules, agreements, or historical contexts to exist *as that kind*, it is **constructed**.
  *   *Fits:* Money, Citizen, Teenager.
  *   *Logic:* These are "Institutional Facts." A dollar bill is just paper without the collective agreement that it has value. A "teenager" is just a 15-year-old human without the social scripts regarding clothes, music, and laws.

  **The Tension Point: Race and Height**
  *   *Race:* She verdicts **Constructed**. Why? Because she focuses on the *classification criteria* (Criterion B), not the physical traits (Criterion A). She notes that Brazil and the US draw the lines differently. This implies she believes that if the *boundaries* are arbitrary or variable, the kind is constructed.
  *   *Height:* She verdicts **Not Constructed**. This is the most important data point. She admits the *unit* (the foot) is made up (Criterion B), but she insists that once the unit is fixed, the measurement is objective (Criterion A).
  *   *Synthesis:* Mara is a **Realist about Natural Kinds** and a **Constructivist about Social Kinds**. Her tie-breaking rule seems to be: **Does the kind track a mind-independent physical/biological reality, or does it track a human-defined status?** If it tracks physical reality (even if we use a made-up unit to measure it), she says "Not Constructed." If it tracks a social status or a variable grouping of humans, she says "Constructed."

  ### 2. Predictions on the New Cases

  Here is where we apply her rule to the new scenarios.

  **Case 1: Pluto (Is "Planet" socially constructed?)**
  *   **The Conflict:** This pits Criterion A against Criterion B.
      *   *Argument for Constructed:* The definition was voted on by astronomers (The IAU). The boundary changed without Pluto changing. This looks like *Race* (variable criteria) or *Money* (status by agreement).
      *   *Argument for Not Constructed:* Pluto existed before humans. Its orbital properties are brute facts. This looks like *Crow* (existed before people) and *Height* (once you fix the definition, the fact is objective).
  *   **My Prediction:** Mara will say **NOT CONSTRUCTED**.
  *   **Reasoning:** Her verdict on *Crow* is the strongest signal here. She explicitly justified *Crow* by saying "crows were doing crow stuff before there were people." She will apply the same logic to Pluto: "Pluto was doing Pluto stuff before there were people." She will treat the IAU definition like the "foot" in the height case: the *definition* is a human tool, but the *status* of the object is determined by its physical reality, not our vote. She will likely argue that the astronomers *discovered* Pluto didn't fit the physical requirements, rather than *voting* it out of existence.

  **Case 2: Chronically Absent Student**
  *   **The Conflict:** This is a clearer case for her framework.
      *   *Argument for Not Constructed:* The student physically missed the days. That is a brute fact (like Height).
      *   *Argument for Constructed:* The label "Chronically Absent" is a district policy (10% rule). It creates a list, changes teacher expectations, and alters the student's behavior (the "looping effect").
  *   **My Prediction:** Mara will say **CONSTRUCTED**.
  *   **Reasoning:** This aligns perfectly with *Teenager* and *Citizen*. Being a "teenager" isn't just about age; it's about the social stage (clothes, laws, expectations). Being "chronically absent" isn't just about missing days; it's about the institutional label that changes how the system treats you. Because the *consequences* of the label are social and the *threshold* (10%) is arbitrary (why not 11%?), it fits her "Institutional Dependence" criterion. It is a status conferred by the school district, not a biological fact like Diabetes.

  ### 3. The Tie-Breaker Test Case

  You asked for a case that would tell the rules apart. The tension in Mara's thinking is between **Biological Reality** (Crow/Diabetes) and **Human Classification of Biological Reality** (Race).

  I recommend you ask her about: **"Is being an Invasive Species socially constructed?"**

  *   **Why this breaks the system:**
      *   **The "Crow" Argument (Not Constructed):** The animal is a biological entity. It eats, breeds, and exists independently of humans. Its impact on the ecosystem is a physical fact.
      *   **The "Citizen" Argument (Constructed):** A species is only "invasive" relative to human-drawn borders. A wolf is not invasive in Canada, but might be considered "invasive" if reintroduced to a specific US park where it hasn't been recently. The label depends on human management goals and political borders.
      *   **The "Absentee" Argument (Constructed):** Labeling a species "invasive" changes how we treat it (we cull it, ban it, or fund its removal). The label creates a reality.

  *   **How to interpret her answer:**
      *   If she says **Not Constructed**, she is prioritizing **Mind-Independence**. She believes biological kinds override social classification. (This confirms the Pluto prediction).
      *   If she says **Constructed**, she is prioritizing **Boundary Arbitrariness**. She believes that if the *classification* depends on human borders/goals, the kind is constructed, even if the animal is real. (This would suggest she might actually say Pluto *is* constructed, because "Planet" depends on human astronomical goals).

  ### 4. Summary of the Philosophical Stakes

  Mara is essentially navigating the debate between **Natural Kind Realism** (the world comes pre-sliced into categories like "Crow" and "Diabetes") and **Social Constructivism** (categories like "Race" and "Money" are tools we build).

  Her verdict on *Height* is the key to her whole system. She believes that as long as there is a "brute fact" anchor (physical length, biological mechanism, orbital path), the category is not constructed, even if humans invented the measuring stick.

  *   **Pluto:** She will anchor it to the physical object (Not Constructed).
  *   **Absentee:** She will anchor it to the school policy (Constructed).
  *   **Test Case:** "Invasive Species" forces her to choose between the animal (Natural) and the border (Social).

  Good luck at lunch. If she hedges on the Invasive Species question, tell her she's discovered the central problem of modern social ontology: almost everything is a hybrid of brute fact and social meaning.
