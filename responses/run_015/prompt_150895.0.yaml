      *   Requirement: Must define the Moral Community (Animals/Immigrants).

      *Refining the "Prejudice" call:*
      *   "Nonhuman animals" is a prejudice *of the scope*, not necessarily a policy requirement for a *national* finance ministry. I need to be clear that for a *national* budget, excluding animals is standard, but ethically it's a preference.
      *   "Immigration vs Fertility": If the goal is "National Strength," fertility is preferred. If "Global Welfare," immigration is preferred. This is a scope definition, not a prejudice per se, but the *choice* of scope is the preference.

      *Refining the "Inconsistency":*
