      *   *Crucial Conflict:* **Total Welfare vs. Average Welfare vs. Person-Affecting.**
      *   *Specific Policy Conflict:* **National Interest vs. Global Welfare.** (Immigration vs. Fertility). If the goal is global welfare, immigration is often more efficient. If national, fertility might be preferred. You can't maximize both if they diverge.
      *   *Another Conflict:* **Short-term Fiscal vs. Long-term Existential.** Pensions need workers *now*. Existential risk needs people *later*.

