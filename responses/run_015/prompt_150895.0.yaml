      *   *Identity/Non-Identity:* Philosophical constraint, but for *policy*, it's often bypassed by treating "potential citizens" as stakeholders. Call it a "Theoretical Constraint" rather than a policy desideratum.
      *   *Repugnant Conclusion:* Philosophical intuition pump. For a finance ministry, "lives barely worth living" is likely a failure state anyway (welfare floor). Mark as a constraint on the *metric*, not the policy directly.
      *   *Who Pays:* Genuine desideratum (distributional justice).
      *   *Timing/Composition:* Genuine desideratum (policy efficacy).
