      *   What kills the most popular views?
      *   The **Non-Identity Problem** combined with **Actionability**.
      *   If you can't say the new people are "better off" (because they wouldn't exist otherwise), Person-Affecting views struggle to justify pronatalism *for the sake of the children*.
      *   However, for a Finance Ministry, the **Efficacy/Timing** constraint is the practical killer. Most theories assume $X = +Y births. If $X just shifts timing, the theory fails the spec.
      *   *Better Candidate:* **The Scope Definition (National vs. Global).** This determines whether immigration is a substitute. If the theory says "Global Welfare," baby bonuses are inefficient compared to aid/immigration. If "National Welfare," they make sense. This splits the theories most sharply.
      *   *Even Better Candidate:* **The Metric (Total vs. Average).** This is the philosophical engine. But the prompt asks for the requirement that knocks out *popular views*.
      *   *Decision:* The requirement to **Distinguish Total Capacity from Per-Capita Welfare** is the biggest filter. Many arguments conflate "bigger economy" with "better life." A theory that doesn't separate them is useless for policy.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Acknowledge the shift from abstract to policy.
