answer: |-
  Here is the specification for a population theory adequate for national fiscal policy, followed by an audit of your argument points, an inconsistency check, and the evaluation table.

  ### The Spec: Requirements for a Policy-Ready Population Theory

  To advise a finance ministry, a theory cannot just be morally coherent; it must be fiscally operational. It needs to bridge the gap between "what is good" and "what is budgetable."

  **1. The Metric Separation Requirement (Non-Negotiable)**
  *   **The Case:** A theory must explicitly distinguish between **Total Capacity** (GDP, military power, innovation potential) and **Per-Capita Welfare** (average income, quality of life, congestion).
  *   **Why:** Policies that maximize total output often minimize per-capita welfare (diminishing returns), and vice versa. A finance ministry needs to know which variable it is optimizing.
  *   **Verdict:** Non-negotiable. Without this, "better" is undefined.

  **2. The Beneficiary Identification Requirement (Non-Negotiable)**
  *   **The Case:** The theory must specify whose welfare counts in the cost-benefit analysis. Does the budget optimize for *current taxpayers*, *future citizens*, or *humanity globally*?
  *   **Why:** This determines whether immigration is a substitute for fertility. If the goal is "welfare of current citizens," immigration is often more efficient. If the goal is "continuity of this specific nation/culture," fertility is required.
  *   **Verdict:** Non-negotiable. This defines the political constituency.

  **3. The Causal Efficacy Requirement (Non-Negotiable)**
  *   **The Case:** The theory must account for the marginal impact of spending. It cannot assume $1 spent = 1 baby. It must handle **timing effects** (shifting births earlier) vs. **quantum effects** (more total children per woman).
  *   **Why:** If a bonus only shifts timing, it creates a short-term demographic bump followed by a drop, worsening the long-term pension problem.
  *   **Verdict:** Non-negotiable. A theory that ignores implementation elasticity is useless for budgeting.

  **4. The Distributional Justice Requirement (Non-Negotiable)**
  *   **The Case:** The theory must account for who bears the cost (parents, taxpayers) vs. who reaps the benefit (future employers, pensioners).
  *   **Why:** If costs are privatized (parents) and benefits socialized (pension system), the market will under-produce children relative to the state's desire. The theory must justify the transfer.
  *   **Verdict:** Non-negotiable. This is the core economic justification for the subsidy.

  **5. The Moral Scope Requirement (Preference/Scope Definition)**
  *   **The Case:** The theory must declare whether non-human animals and environmental carrying capacity are inputs or externalities.
  *   **Why:** Including animal welfare or carbon budgets often flips the sign of population growth from positive to negative.
  *   **Verdict:** **Preference.** For a national finance ministry, these are usually externalities. For a moral theory, they are central. You must choose the scope before calculating.

  **6. The Non-Identity Resolution Requirement (Theoretical Constraint)**
  *   **The Case:** The theory must explain how bringing someone into existence can count as a "benefit" sufficient to justify public spending, given that the alternative for that specific child is non-existence.
  *   **Why:** If you cannot claim the new people are "better off," you must justify the spending entirely on the benefits to *existing* people.
  *   **Verdict:** **Theoretical Constraint.** You don't need to solve Parfit's Non-Identity Problem philosophically, but your policy logic must pick a lane (e.g., "we are paying for future workers, not for the children's sake").

  ---

  ### Audit of Your Argument Points

  Here is how the specific points from your argument map onto the spec. I have flagged which are genuine requirements and which are assumptions/prejudices that need to be justified by the spec.

  | Your Point | Status | Analysis |
  | :--- | :--- | :--- |
  | **Pension thing** | **Genuine Desideratum** | Fits **Causal Efficacy** and **Distribution**. It highlights the intergenerational transfer problem. It is not decisive on its own (growth can offset it), but it must be modeled. |
  | **Ideas/Scale** | **Genuine Desideratum** | Fits **Metric Separation**. It argues for *Total Capacity*. It is valid only if institutions can absorb the scale. |
  | **Thresholds** | **Genuine Desideratum** | Fits **Metric Separation**. Below a certain population, *Per-Capita Welfare* drops because specialized services vanish. This is a viability constraint, not a prejudice. |
  | **Identity mess** | **Theoretical Constraint** | This is the **Non-Identity Resolution**. It is not a policy preference but a logical hurdle. If ignored, the justification for spending collapses. |
  | **Repugnant Conclusion** | **Philosophical Preference** | This is an intuition pump about the **Metric**. For a finance ministry, "lives barely worth living" usually fail tax thresholds anyway, so it's less practical than philosophical. |
  | **Who pays** | **Genuine Desideratum** | Fits **Distributional Justice**. This is arguably the strongest economic argument. Ignoring this makes the theory politically naive. |
  | **Timing** | **Genuine Desideratum** | Fits **Causal Efficacy**. If bonuses only change *when* kids are born, the policy is a failure. This is empirical, not philosophical. |
  | **Composition** | **Genuine Desideratum** | Fits **Causal Efficacy**. If incentives select for demographics with lower future earnings, the fiscal return drops. |
  | **Nonhuman animals** | **Scope Preference** | This is the **Moral Scope**. For a national budget, this is typically excluded. Including it is an ethical choice, not a policy necessity. |
  | **Immigration vs. Fertility** | **Scope Definition** | This tests **Beneficiary Identification**. If the goal is "economy size," immigration wins. If "national continuity," fertility wins. Neither is a prejudice; they are different goals. |

  ---

  ### Inconsistencies: The "Impossible Trinity"

  You asked for pairs of requirements that cannot be jointly satisfied. In population ethics, there is a well-known impossibility theorem (Arrhenius), but for *policy*, the conflict is sharper.

  **The Conflict: Distributional Justice vs. Total Capacity vs. Per-Capita Welfare**
  You generally cannot maximize all three.
  1.  **Maximize Total Capacity:** Requires high population. Risks lowering Per-Capita Welfare (congestion, resource strain).
  2.  **Maximize Per-Capita Welfare:** Often requires limiting population. Risks shrinking Total Capacity (less innovation, pension collapse).
  3.  **Maximize Distributional Justice:** Requires heavy transfers from workers to parents/retirees. Risks reducing incentives for both work and fertility.

  **The Policy Paradox:**
  *   **Requirement 2 (Beneficiaries)** conflicts with **Requirement 4 (Distribution)** if the beneficiaries are *future* people but the payers are *current* people.
  *   If you adopt a **Person-Affecting View** (only existing people count), you cannot justify spending money to create new people *for their own sake*. You must justify it *for the sake of the existing pensioners*.
  *   But if you justify it for pensioners, you run into the **Pension Thing**: you are just pushing the debt to the new kids' future.
  *   **Result:** A theory that is strictly Person-Affecting struggles to justify long-term pronatalism without admitting it is exploiting the new generation to pay the old one.

  ---

  ### The Killer Requirement

  **The Single Requirement that does the most work:**
  **Requirement 1: The Metric Separation (Total vs. Per-Capita).**

  **Why:** This knocks out the most popular lay arguments immediately.
  *   It kills the "More people = More Innovation" argument if it doesn't prove *per-capita* gains. (A bigger pie doesn't help if your slice shrinks).
  *   It kills the "Overpopulation" argument if it doesn't prove *per-capita* losses. (We can support more people at a high standard if technology scales).
  *   It forces the Finance Ministry to admit whether they want a **Superpower** (Total) or a **Switzerland** (Per-Capita). Most arguments fail because one side is arguing for Superpower status and the other for Swiss living standards, and they don't realize it.

  ---

  ### Theory Evaluation Table

  | Theory View | Metric Separation | Beneficiary ID | Causal Efficacy | Distributional Justice | Non-Identity | Verdict for Finance Ministry |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Total Welfare** (Utilitarian) | **Fail.** Conflates total good with per-capita good. Prone to Repugnant Conclusion. | Global/Future. | Ignores timing/composition. | **Fail.** Justifies sacrificing current welfare for future headcount. | **Pass.** Solves non-identity by counting total utility. | **Dangerous.** Justifies unlimited spending on fertility regardless of cost to current citizens. |
  | **Average Welfare** | **Pass.** Prioritizes quality of life. | Current/Future Citizens. | Ignores scale thresholds. | **Pass.** Protects current standard of living. | **Fail.** Implies killing unhappy people improves average. | **Conservative.** Discourages bonuses unless they clearly raise average income. |
  | **Person-Affecting** | **Pass.** Focuses on making specific people better off. | **Existing Citizens.** | **Pass.** Demands proof of benefit to payers. | **Pass.** Focuses on transfers between existing agents. | **Fail.** Cannot justify creating new people *for their own benefit*. | **Restrictive.** Only justifies bonuses if they benefit *current* taxpayers (e.g., saving pensions). |
  | **"Humanity as Value"** | **Fail.** Treats existence as intrinsic good, ignoring welfare metrics. | The Nation/Species. | Ignores economic efficacy. | **Fail.** Demands sacrifice for the "cause." | **Pass.** Existence itself is the benefit. | **Ideological.** Good for nationalism, bad for budgeting. Lacks economic brake. |

  **Summary:** For a Finance Ministry, a **Person-Affecting View constrained by Per-Capita Welfare** is the only stable spec. It admits you aren't creating people for their own sake (solving Non-Identity), it protects current taxpayers (Distribution), and it prevents the "Repugnant Conclusion" of subsidizing misery for the sake of headcount (Metric Separation).
