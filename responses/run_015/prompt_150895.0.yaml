      *   The classic impossibility theorem in population ethics (Arrhenius): You can't satisfy Intuition A, B, and C simultaneously.
      *   Specific to this prompt:
          *   (1) Avoid Repugnant Conclusion (Quality matters).
          *   (2) Avoid "Sadistic Conclusion" (Adding miserable people is bad).
