prompt: |-
  I host a philosophy podcast and next week's guest defends a revised Lewisian theory of convention in which the standard common-knowledge rationality conditions are replaced by an evolutionary-stability criterion drawn from replicator dynamics, allowing linguistic conventions to persist through graded, partial mutual expectations rather than explicit shared knowledge. Draft eight to ten interview questions that go well beyond having him restate the view: include at least one on how evolutionary stability explains the arbitrariness of signs—why "dog" rather than "cat" denotes canines—without collapsing into a mere salience-based account; one on whether partial or second-order common knowledge can still perform the normative work Lewis originally assigned it; and one on the boundary between genuine convention and mere causal regularity or habit. For each question, provide a follow-up keyed to the answer he is most likely to give—such as an appeal to basins of attraction, to drift versus selection, or to second-order expectation formation—so that the standard deflections become progressively harder to maintain. Avoid generic biographical or definitional questions; every item should press on the mechanics of the evolutionary-Lewisian synthesis itself.
reasoning: |-
