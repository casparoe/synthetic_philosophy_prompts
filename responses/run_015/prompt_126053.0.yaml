answer: |-
  1.  **The Arbitrariness of the Sign vs. Evolutionary Optimization**
      Lewis insists that conventions are arbitrary: there must be at least one alternative regularity that could have solved the coordination problem just as well. However, replicator dynamics typically select for equilibria that maximize fitness or minimize cost within a specific landscape. If your evolutionary criterion explains the persistence of "dog" for canines, doesn't it risk implying that "dog" is somehow *functionally superior* to "cat" in that niche, thereby collapsing arbitrariness into salience or efficiency? How does your model preserve genuine arbitrariness if the dynamics are driven by stability rather than historical accident?
      *   **Follow-up:** If you appeal to **basins of attraction** to explain why we landed on "dog" rather than "cat," doesn't that imply the basin's size is determined by structural features of the signal (like pronounceability)? If so, how do you distinguish a convention from a biological constraint, and where does the "choice" enter the picture?

  2.  **Normativity and the "Ought" of Partial Expectations**
      For Lewis, common knowledge provided the normative glue: I conform because I know you expect me to, and I know you know I expect you, creating a reciprocal reason for action. You replace this with graded, partial mutual expectations stabilized by dynamics. But stability describes what *is*, not what *ought* to be. Can a merely probabilistic expectation, lacking the recursive certainty of common knowledge, actually generate a *reason* to comply, or does your view reduce convention to a prediction of behavior where the normative force disappears?
      *   **Follow-up:** If you argue that **second-order expectation formation** generates a quasi-normative pressure, at what threshold of probability does a "hunch" that others will conform become a binding reason to conform? Is there a specific point in the replicator dynamic where prediction turns into obligation?

  3.  **Convention vs. Causal Regularity (Habit)**
      A major challenge for any non-intentionalist account is distinguishing a social convention from a mere causal regularity or habit. I drink coffee every morning; this behavior is stable and replicates daily. In Lewis's view, this isn't a convention because my preference doesn't depend on yours. In your evolutionary model, both habits and conventions look like stable equilibria. What specific mechanic in your replicator dynamics filters out solitary habits and captures the *interdependence* that is essential to convention?
      *   **Follow-up:** If you suggest that **frequency-dependent selection** marks the boundary, doesn't that imply that a habit becomes a convention simply when enough people have it, regardless of whether they are coordinating? How do you prevent the model from classifying mass independent behaviors (like everyone sleeping at night due to circadian rhythms) as conventions?

  4.  **Equilibrium Shifts Without Common Knowledge**
      One virtue of Lewis's common knowledge condition was explaining how communities can *shift* conventions (e.g., changing a meeting time) through a moment of shared agreement. In your model, conventions are deep basins of attraction. Without a mechanism for explicit, shared rational agreement, how does your system account for rapid linguistic or social change? How do agents coordinate a jump from one stable equilibrium to another without the very common knowledge you've discarded?
      *   **Follow-up:** If you appeal to **drift versus selection**, suggesting that noise allows the population to wander into a new basin, doesn't that make convention change essentially random? How do you account for deliberate, coordinated reform (like standardizing spelling) if the engine is blind variation rather than shared intent?

  5.  **The Granularity of "Graded" Expectations**
      You argue that conventions persist through "graded" mutual expectations rather than binary common knowledge. But conventions often feel binary to the participants: either there is a rule to drive on the right, or there isn't. If expectations are truly graded, does that imply there are "partial conventions"? If so, how does the replicator dynamic handle the friction when one subgroup is at 60% expectation and another is at 90%?
      *   **Follow-up:** If you claim the dynamic smooths out these differences over time, doesn't that suggest that what we call a "convention" is just a transient state in a system that is never actually at equilibrium? If the system is always in flux, is there ever a moment where the Lewisian conditions are actually satisfied, even approximately?

  6.  **Agency and the Role of Intentions**
      Replicator dynamics are often used in biology to explain behaviors where agents have no intentions (e.g., bacteria). By importing this into philosophy of language, are you suggesting that human intentions are epiphenomenal to the convention? If the dynamics do the work of stabilization, does it matter whether the speakers *intend* to follow the rule, or does your theory effectively eliminate the agent from the account of convention?
      *   **Follow-up:** If you maintain that intentions still play a role in setting the **payoff structure**, aren't you just smuggling Lewisian rationality back in through the definition of fitness? How is your payoff structure defined independently of the agents' rational preferences?

  7.  **Error, Mutation, and Violation**
      In evolutionary game theory, a deviation from the equilibrium is treated as "mutation" or "noise." In a Lewisian convention, a deviation is a "violation" or a "mistake" subject to normative criticism. Does your model have the resources to distinguish between a random slip of the tongue (mutation) and a deliberate breaking of the convention (violation)? If both look like the same statistical deviation to the dynamics, have you lost the ability to explain why we sanction one but not the other?
      *   **Follow-up:** If you argue that **selection pressure** punishes violations more harshly than mutations, isn't that an outcome of the convention rather than a definition of it? How does the system "know" to apply different pressure without referencing the agents' normative attitudes?

  8.  **The Definition of the Fitness Landscape**
      For replicator dynamics to work, there must be a fitness landscape that determines which strategies replicate. In linguistic conventions, what constitutes "fitness"? Is it communicative success, social prestige, or cognitive ease? If the definition of fitness varies across contexts, doesn't your theory become a placeholder that only explains conventions after we've already independently identified what the community values?
      *   **Follow-up:** If you define fitness purely as **coordination success**, aren't you defining the solution in terms of the problem? How do you independently measure the stability of the convention without circularly referencing the fact that the convention is already established?

  9.  **Emergent Common Knowledge**
      Even if you start without common knowledge, if a convention is stable and widespread, won't common knowledge eventually emerge as a byproduct? If everyone conforms and sees everyone conforming, isn't common knowledge generated *ex post*? If so, is your evolutionary criterion actually a rival to Lewis, or just a story about how the preconditions for Lewisian common knowledge are generated?
      *   **Follow-up:** If you concede that common knowledge emerges later, does that mean your **evolutionary-stability criterion** is only necessary for the *genesis* of convention, while the *maintenance* still relies on the Lewisian rationality conditions you sought to replace?

  10. **Conceptual Continuity vs. Revision**
      Lewis defined convention *essentially* via common knowledge and rationality. By removing these necessary conditions, you are arguably not analyzing Lewisian convention but proposing a new phenomenon that resembles it. Why should we call this "convention" at all rather than "social stability"? What work is the label "convention" doing in your theory if the defining features of the concept have been swapped out for evolutionary mechanics?
      *   **Follow-up:** If you argue that this is a **naturalistic revision** of the concept, doesn't that risk changing the subject of the philosophical debate? If the normative and rational elements are gone, are you still addressing the same puzzle about social order that Lewis was, or have you dissolved the puzzle by redefining the terms?
