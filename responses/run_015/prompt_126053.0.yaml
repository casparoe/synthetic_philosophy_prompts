      *   **Key Feature:** Conventions persist through graded, partial mutual expectations rather than explicit shared knowledge.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the view.
          *   Include specific topics: (1) Arbitrariness of signs vs. salience, (2) Normative work of partial/second-order knowledge, (3) Boundary between convention and habit/causal regularity.
          *   Provide a follow-up for each question keyed to likely answers (basins of attraction, drift vs. selection, etc.).
          *   Avoid generic/biographical/definitional questions.
          *   Focus on the mechanics of the evolutionary-Lewisian synthesis.
          *   Make deflections progressively harder to maintain.

  2.  **Deconstruct the Guest's Theory:**
      *   *Lewis (1969):* Convention requires regularity, preference for conformity, conditional preference, *common knowledge* of 1-4, and arbitrariness (another regularity could have existed).
      *   *Guest's Revision:* Dumps "common knowledge" (too cognitively demanding/idealized). Uses Evolutionary Game Theory (EGT) / Replicator Dynamics. Stability comes from population dynamics, not individual reasoning.
      *   *Tension Points:* Normativity (ought vs. is), Arbitrariness (why *this* equilibrium?), Intentionality (do agents need to know?), Stability (how robust is it?).

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic 1: Arbitrariness vs. Salience.*
          *   *Idea:* Lewis says conventions are arbitrary (could have been otherwise). EGT often finds "focal points" or salient equilibria. How does the guest keep arbitrariness alive if evolution selects for efficiency?
          *   *Draft Q:* How do you explain why we say "dog" and not "cat" if evolution picks the best one?
          *   *Refinement:* Need to press on the *mechanism*. If replicator dynamics select for stability, doesn't that imply functional superiority rather than arbitrariness?
          *   *Follow-up:* If they say "basins of attraction," ask about historical contingency vs. structural fitness.

      *   *Topic 2: Normativity.*
          *   *Idea:* Lewis used common knowledge to ground the *reason* to conform. If we just have evolutionary stability, is it just a description of behavior? Where is the "ought"?
          *   *Draft Q:* Does your view lose the normative force of convention?
          *   *Refinement:* Focus on "partial mutual expectations." Can a graded expectation generate a binding reason to comply, or does it just predict compliance?
          *   *Follow-up:* If they appeal to "second-order expectation formation," ask about the gap between expecting others to act and feeling bound to act.

      *   *Topic 3: Convention vs. Habit.*
          *   *Idea:* Habits are stable regularities. Conventions are social. Where is the line in EGT?
          *   *Draft Q:* How is this different from just habit?
          *   *Refinement:* Focus on the *interdependence* condition. In replicator dynamics, a habit can be stable. What makes a convention distinctively *social* in your model without common knowledge?
          *   *Follow-up:* If they mention "coordination problems," ask about solitary habits that look like coordination equilibria.

      *   *Topic 4: Cognitive Load vs. Rationality.*
          *   *Idea:* The motivation for the revision is usually that common knowledge is too hard. But does EGT assume too much *population* rationality?
          *   *Draft Q:* Isn't EGT just as idealized?
          *   *Refinement:* Focus on the "bounded rationality" aspect. Does replicator dynamics smuggle in rationality via the payoff structure?
          *   *Follow-up:* Press on the definition of "payoff" in linguistic contexts.

      *   *Topic 5: Stability and Change.*
          *   *Idea:* Conventions change (language drift). EGT explains stability well, but how does it explain *shifts* without common knowledge to negotiate the shift?
          *   *Draft Q:* How does language change if it's stable?
          *   *Refinement:* Focus on "equilibrium selection." If we are in a basin of attraction, how do we jump to a new one without a coordinated moment of common knowledge?
          *   *Follow-up:* Ask about "drift" vs. "selection pressure."

      *   *Topic 6: The "Graded" Expectation.*
          *   *Idea:* The prompt mentions "graded, partial mutual expectations." This is vague.
          *   *Draft Q:* What does graded mean?
          *   *Refinement:* How does the *degree* of expectation correlate with the *strength* of the convention? Is there a threshold where it becomes a convention?
          *   *Follow-up:* Ask about the "tipping point" mechanics.

      *   *Topic 7: Miscommunication and Error.*
          *   *Idea:* Lewis handles error via rationality. EGT handles it via mutation/noise.
          *   *Draft Q:* How do you handle lying or mistakes?
          *   *Refinement:* In a replicator dynamic, "error" is just noise. But in convention, "violating" the convention is normative. How does the model distinguish a mutation from a violation?
          *   *Follow-up:* Press on the "punishment" or "cost" mechanism in the dynamics.

      *   *Topic 8: The Role of Intentions.*
          *   *Idea:* Lewis is intentionalist. EGT is often non-intentional (blind variation).
          *   *Draft Q:* Do agents need intentions?
          *   *Refinement:* If the dynamics do the work, are human intentions epiphenomenal? Does this reduce linguistics to biology?
          *   *Follow-up:* Ask about the "hybrid" nature of the model.

      *   *Topic 9: Multiple Equilibria.*
          *   *Idea:* Lewis relies on multiple equilibria for arbitrariness.
          *   *Draft Q:* Are there always multiple equilibria?
          *   *Refinement:* In many linguistic games, is there really more than one stable equilibrium? If the dynamics converge on only one, is it still a convention?
          *   *Follow-up:* Ask about "degenerate" games.

      *   *Topic 10: The "Lewisian" Label.*
          *   *Idea:* Is this still Lewis?
          *   *Draft Q:* Is this really Lewis?
          *   *Refinement:* Lewis defined convention *by* common knowledge. If you remove the necessary condition, are you analyzing convention or something else that looks like it?
          *   *Follow-up:* Ask about conceptual revision vs. elimination.

  4.  **Review and Refine against Constraints:**
      *   *Check:* 8-10 questions? Yes.
      *   *Check:* Follow-ups included? Yes.
      *   *Check:* Specific topics covered (Arbitrariness, Normativity, Habit)? Yes.
