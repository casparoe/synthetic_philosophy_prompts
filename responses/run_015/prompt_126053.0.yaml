      *   *Check:* Tone? Philosophical, probing, podcast-appropriate.

  5.  **Final Polish:** Ensure the follow-ups logically flow from the *likely* answer, creating a "trap" or deepening the inquiry. Make sure the distinction between "salience" and "arbitrariness" is sharp in Q1. Ensure the "normativity" question (Q2) hits the "is-ought" gap hard. Ensure the "habit" question (Q3) distinguishes individual vs. social stability.

