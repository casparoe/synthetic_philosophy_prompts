      *Unliked Answer:* I'll make Case 1 the unliked one (Keep the expensive promise).

      *Philosophical Flag:* In Step 3 or 4, explicitly state: "If you follow Reliance Theory (your friend), stop here. If you follow Expectation Theory, continue." Actually, better to integrate it as a decision node. "Did anyone rely? If No, flag: Philosophical Disagreement Zone."

      *Let's refine the procedure steps:*
