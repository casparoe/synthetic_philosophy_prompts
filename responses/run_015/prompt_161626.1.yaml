      *   Section 3: What This Procedure Cannot Do.

      *Self-Correction on First Sentence:* It needs to be *one* sentence. That's tight. "The procedure filters intent, communication, and reliance to classify commitments as Binding, Non-Binding, or Escalated, yielding these verdicts: keep the blog promise, discard the auto-log, and escalate the conflict."

