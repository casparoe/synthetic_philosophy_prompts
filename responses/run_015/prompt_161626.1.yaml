      *   *Case 2: Auto-log "should probably".*
          *   Procedure outcome: Not a promise. Stop early.
      *   *Case 3: Incompatible promises.*
          *   Procedure outcome: Escalate to Ops Lead (Values call). But need to weigh dependency.

      *Refining the "Answer I won't like":* The user is Ops Lead. They probably want clarity. If the procedure says "You must keep the blog promise despite cost because public trust > immediate budget," that might be the hard truth. Or, if the procedure says "The auto-log entry *is* binding because it was published internally," that would be annoying. Let's go with the Blog Promise: The procedure should probably err on the side of "Public statements bind you even without specific reliance" to protect institutional integrity, which might cost money the user doesn't want to spend.

