      *   **Goal:** A 15-minute, plain language decision procedure (flowchart-like logic) that outputs a written justification.
      *   **Specific Requirements:**
          *   Separate promise vs. prediction/intention.
          *   Define scope/time.
          *   Address reliance/awareness (the friend's argument: no reliance/hearing = no binding promise).
          *   Address diffuse promisees (who can release us?).
          *   Address renegotiation vs. lapsing.
          *   Explicitly flag philosophical disagreements (e.g., reliance theory vs. expectation theory).
          *   Run the procedure on three specific cases (Public blog promise w/ no reliance; Auto-log "should probably"; Incompatible promises).
          *   Include at least one case where the procedure gives an answer the user won't like.
          *   State what the procedure *can't* do.
          *   **Format:** Bottom line in the first sentence (procedure summary + verdicts). No preamble. No restating the question.

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   **User's Friend's View:** Reliance/Assurance theory. A promise only binds if someone heard it, relied on it, or was assured by it. If it costs a lot and no one noticed, dropping it quietly isn't wrong.
      *   **User's Implicit View (likely):** Expectation/Integrity theory. A promise binds because *we* said it, regardless of reliance. The register implies institutional memory.
      *   **The Procedure:** Needs to balance these. It can't just say "Friend is right" or "User is right." It needs to be a tool for *decision-making*, acknowledging where the philosophy splits.
      *   **Constraint:** "Where the answer depends on which view of promising you take... say so explicitly and flag it."

  3.  **Drafting the Decision Procedure:**
      *   Needs to be step-by-step.
      *   Needs stop conditions ("No, not bound").
      *   Needs escalation points ("Hand to Ops Lead").
      *   Needs to handle the "Diffuse Promisee" issue.
      *   Needs to handle the "Auto-log" issue.

      *Step 1: Was it a promise?* (Distinguish from prediction/intention).
      *Step 2: Was it communicated?* (Address the friend's point).
      *Step 3: Who is the promisee?* (Specific vs. Diffuse).
      *Step 4: Reliance/Cost?* (The balancing test).
