answer: |-
  This fifteen-minute audit filters statements through intent, communication, and reliance to classify entries as Binding, Void, or Escalated, resulting in these verdicts: you must keep the public blog promise despite the cost, you can void the auto-logged "should probably" entry, and you must escalate the incompatible partner promises for a values-based ruling.

  ### The 15-Minute Commitment Audit

  **Instructions:** Answer these questions in order. Write one sentence per answer. If you hit a **STOP**, file the justification and close the ticket. If you hit **ESCALATE**, send the answers to the Ops Lead.

  **1. The Intent Check**
  *   **Question:** Does the language used indicate a definite obligation ("we will," "we promise," "committed to") rather than a hope, prediction, or exploration ("we should," "hopefully," "looking into")?
  *   **If No:** **STOP.** Verdict: **Not a Promise.** (Justification: Language indicates intention or speculation, not obligation.)
  *   **If Yes:** Continue.

  **2. The Communication Check**
  *   **Question:** Did this statement leave the mind of the speaker and reach an audience (internal team, external partner, public channel), or was it a private thought incorrectly captured by auto-logging?
  *   **If No:** **STOP.** Verdict: **Void.** (Justification: No communication occurred; a promise requires a recipient.)
  *   **If Yes:** Continue.

  **3. The Reliance Check (Philosophical Flag)**
  *   **Question:** Has anyone changed their behavior, made plans, or incurred costs based on this statement?
  *   **If Yes:** Continue to Step 4.
  *   **If No:** **FLAG:** This is the disagreement zone.
      *   *View A (Reliance/Assurance):* If you believe promises only bind when relied upon (your friend's view), **STOP.** Verdict: **Not Binding.** (Justification: No reliance exists; dropping this deceives no one.)
      *   *View B (Expectation/Integrity):* If you believe public statements bind regardless of specific reliance to maintain institutional trust, **CONTINUE** to Step 4. (Justification: Public integrity requires consistency even without measured reliance.)

  **4. The Scope and Time Check**
  *   **Question:** Can you clearly define what must be delivered and by when, or is the commitment vague ("soon," "better performance")?
  *   **If Vague:** **ESCALATE.** (Reason: Requires interpretation of intent.)
  *   **If Clear:** Continue.

  **5. The Authority Check**
  *   **Question:** Is the promisee a specific person/entity who can release us, or is it a diffuse group (public, user community)?
  *   **If Specific:** Continue to Step 6.
  *   **If Diffuse:** **ESCALATE.** (Reason: Only Ops Lead can decide if diffuse trust obligations are met or renegotiated.)

  **6. The Conflict and Cost Check**
  *   **Question:** Is keeping this promise now impossible, incompatible with another promise, or disproportionately costly compared to the original expectation?
  *   **If No:** **STOP.** Verdict: **Binding.** (Justification: Commitment stands; execute.)
  *   **If Yes:** **ESCALATE.** (Reason: Requires trade-off decision or renegotiation strategy.)

  **7. The Renegotiation Check (For Escalated Items)**
  *   **Question:** Can we openly communicate the change to the promisee, or must we let it lapse quietly?
  *   **Decision:** **Never lapse quietly.** If binding, you must renegotiate openly. (Justification: Quiet lapsing damages trust more than broken promises.)

  ---

  ### Applied Cases

  **Case 1: The Expensive Blog Post**
  *   **Context:** A public blog post promised "free API forever." No specific user can prove they joined *because* of this, but it costs $50k/year.
  *   **Run:**
      1.  Intent: Yes ("will stay free").
      2.  Communication: Yes (Public blog).
      3.  Reliance: No specific proof. **FLAG:** View A says Void; View B says Binding. *Procedure defaults to View B for public-facing statements to protect reputation.*
      4.  Scope: Clear.
      5.  Authority: Diffuse (Public). **ESCALATE.**
      6.  Conflict/Cost: High cost. **ESCALATE.**
  *   **Verdict:** **Binding (unless renegotiated).** You cannot quietly drop this. You must escalate to decide whether to pay or publicly announce the change.
  *   **Why you won't like it:** It forces you to spend the money or have a hard public conversation rather than silently cutting the cost.

  **Case 2: The Auto-Logged "Should"**
  *   **Context:** Slack message: "We should probably try to get to that this quarter." Auto-logged as commitment.
  *   **Run:**
      1.  Intent: **No.** ("Should probably try" is exploration, not obligation).
      2.  **STOP.**
  *   **Verdict:** **Not a Promise.** File justification citing Step 1 and remove from register.

  **Case 3: The Incompatible Partners**
  *   **Context:** Partner A (small, dependent) needs Feature X by June. Partner B (large, less dependent) needs Feature Y by June. Engineering says X and Y are mutually exclusive.
  *   **Run:**
      1.  Intent: Yes (Both promised).
      2.  Communication: Yes.
      3.  Reliance: Yes (Both planning around it).
      4.  Scope: Clear.
      5.  Authority: Specific (Both partners).
      6.  Conflict/Cost: **Yes (Incompatible).** **ESCALATE.**
  *   **Verdict:** **Escalate to Ops Lead.** This is a values call (who do we serve?), not a factual one. The procedure cannot solve this; it only flags that a breach is imminent regardless of choice.

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot measure reputation damage.** It treats "public trust" as a binary flag, not a quantifiable asset; it cannot tell you if breaking the blog promise will cost you more in donations than the $50k API cost.
  2.  **It cannot fix the auto-logging tech.** It filters the output, but it doesn't stop the model from creating noise; you still need to fix the ingestion pipeline.
  3.  **It cannot replace moral courage.** It identifies when you need to renegotiate, but it cannot make the phone call for you; it explicitly forbids quiet lapsing, forcing you into uncomfortable conversations.
  4.  **It cannot resolve the philosophical split silently.** It forces you to choose between your friend's view (Reliance) and the institutional view (Integrity) at Step 3; it does not reconcile them.
