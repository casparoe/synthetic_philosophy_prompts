          *   *Verdict:* Compelling philosophically, but less immediate impact than conservation law. Good for a sidebar or concluding reflection, but maybe not the lead.

      *   **Angle 3: Instrumentalism (Bookkeeping).**
          *   *Stakes:* Meta-level.
          *   *Tension:* Realism vs. Pragmatism.
          *   *Verdict:* This is the *answer*, not the *question*. If the article says "Philosophers fight, but practitioners just need labels," that's a conclusion. It shouldn't be the whole story because it dismisses the real pain points in Angle 1. However, it *is* largely correct that for working biologists, operational definitions matter more than ontological truth.

      *   **Missing Angle:** Climate Change/Assisted Migration.
          *   *Stakes:* High.
          *   *Tension:* Do we protect the "species" or the "adaptive potential"? If a species moves, is it invasive? If we hybridize them to save them, are they still the same species?
