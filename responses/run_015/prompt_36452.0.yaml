  3.  **Determine the Prioritization:**

      *   *Top Priority:* **Conservation Law & Policy (Angle 1).** Why? Because it allocates finite resources. If you split a species, you dilute funding. If you lump, you might let something go extinct. The "Salamander" example is perfect.
