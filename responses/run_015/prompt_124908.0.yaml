answer: |-
  Friends, family, thank you for being here.

  We are gathered to honor a woman of rare clarity. My aunt did not drift through her life; she steered it. She was warm, but she was demanding. She loved deeply, but she never loved blindly. To know her was to know that you were seen, truly seen, and that she had made a conscious decision to stand beside you.

  We all know the story of the last eleven years. We know the physical toll of caring for a brother after a stroke. We know the exhaustion, the sleepless nights, and the sheer weight of that responsibility. In a conventional eulogy, this is the moment where we speak of what she gave up. We speak of the years she lost, the comfort she surrendered, the parts of her own life she set aside.

  But she would not recognize that language, and to use it now would be to misunderstand her. She did not set her life aside; she lived it fully in that room, with him. She acknowledged the difficulty. She never pretended the work was easy or that the cost was low. But she insisted that the cost did not equal a loss. To her, a loss is when you betray what matters to you. Staying was not a betrayal; it was an affirmation.

  She told him, many times, that she was there because she valued him. Not because she had to be. Not because the world expected it. But because a life without him in it was a life she did not want.

  This distinction matters. It matters because it changes how we remember her care. It was not a burden she resigned herself to carry; it was a commitment she actively chose. She spent her strength not because she was obligated to pour it out, but because she judged that there was no better place for it to go.

  To her Objectivist friends, this was integrity. To her Catholic family, this was devotion. But to all of us, it was simply love. It was a love that did not require her to diminish herself to lift someone else up. She lifted him because she was strong, and because his standing was necessary for her own world to make sense.

  So, how do we honor her? We do not honor her by pretending she was a martyr. We honor her by recognizing that she made a choice. She counted the cost, but she refused to call it a loss.

  Let us carry that forward. Let us love our own families not out of obligation, but out of judgment. Let us choose our commitments because they are ours to keep. She made us feel chosen by her, not owed by her. That was her gift. That was her life. And it was enough.

  ***

  The sentence I expect the room to hear differently is: **"She counted the cost, but she refused to call it a loss."** For the Objectivists, this confirms her rational hierarchy of values: the care was an investment in her highest value, so no net value was lost. For the Catholics, this sounds like a spiritual paradox akin to "whoever loses their life for my sake will find it"; they will hear the physical cost as real and painful, but her refusal to call it a loss as an act of faith or redemptive suffering. I left it in because it validates the physical reality the Catholics need acknowledged (the cost) while upholding the philosophical integrity the Objectivists need preserved (no loss of value).
