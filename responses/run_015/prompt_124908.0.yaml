      *   *Objectivist View:* Action is driven by rational self-interest (values). Caring for the brother was a fulfillment of her own hierarchy of values. To call it sacrifice implies she didn't want to do it or that her life was less important than his.
      *   *Catholic/Traditional View:* Action is driven by charity/agape/self-gift. Caring for the brother was a giving of self. To say she just "valued" him sounds like she got something out of it equal to the cost, minimizing the gift.
      *   *The Bridge:* The bridge is *Love* and *Choice*. Both sides agree she chose to be there. Both sides agree it was hard. Both sides agree it mattered. The language needs to focus on *commitment*, *devotion*, *choice*, and *value* without using the trigger words "sacrifice," "duty," "obligation," "selfless," or "giving up."

