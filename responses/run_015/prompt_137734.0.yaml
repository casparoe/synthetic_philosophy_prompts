answer: |-
  Here is the principle you are looking for. It is designed to resolve the inconsistency between your verdicts on cases 1/7 and 6/8 by forcing you to abandon the intuition that "truthful or useful things cannot be memes". That intuition is the bug in your reasoning, not the theory.

  ### The Principle: Differential Replication with Observable Selection

  A cultural variant $V$ is undergoing Darwinian evolution if and only if it satisfies all four of the following conditions:

  1.  **Causal Lineage:** Instances of $V$ are caused by prior instances of $V$ (copying), rather than independent invention or convergent solution-finding.
      *   *Motivation:* This handles **Case 3** (Cache pattern). Since teams converge independently without copying, there is no lineage. This is convergent evolution, not memetic selection.
  2.  **Variant Space:** At the point of transmission, at least one viable alternative variant $V'$ existed and could have been selected but was not.
      *   *Motivation:* This handles **Case 2** (Hello World). If a curriculum mandates "Hello World" and forbids alternatives, there is no competition. It is instruction, not selection. (If learners *choose* it over "Hello Universe", it becomes a meme).
  3.  **Feature-Dependent Fitness:** The probability of $V$ being selected over $V'$ correlates with specific properties of $V$ (structural, functional, aesthetic, or semantic), regardless of whether those properties confer objective truth, utility, or social advantage.
      *   *Motivation:* This handles **Cases 1, 6, 7, 8**. It forces you to accept that **Case 6** (Version Control) and **Case 8** (Prime Proof) *are* memes. They spread because of their features (utility/elegance), just as Case 1 (Regex) spread because of its features (looking plausible). Darwinism does not distinguish between "true" and "false" fitness, only "differential".
  4.  **Observable Selection (The Graveyard Condition):** There must be evidence that alternatives $V'$ were rejected or failed in contexts where $V$ succeeded.
      *   *Motivation:* This handles your **Graveyard Condition** and **Case 5** (Legacy Flag). If no one ever deletes the flag and suffers consequences, you cannot prove selection is acting; it may simply be inertia. You need to see the bodies of the databases that *did* delete it and broke.

  ---

  ### Verdicts You Must Drop

  To make your mental model consistent, you must change the following verdicts:

  *   **Drop Verdict 6 (Version Control):** You must accept this **is a meme**. It satisfies Lineage (taught/copied), Variant Space (vs SVN/CVS/no VC), Fitness (branching model works better), and Graveyard (teams using CVS failed/migrated). The fact that it is "useful" does not exempt it from being a replicator. It is a "beneficial meme", not "knowledge" in a category outside evolution.
  *   **Drop Verdict 8 (Prime Proof):** You must accept this **is a meme**. It satisfies Lineage (textbooks), Variant Space (other proofs exist), Fitness (elegance/clarity), and Graveyard (complexer proofs are forgotten). Your resistance here is purely aesthetic; you value the content, so you don't want to label it "mere culture". But structurally, it is identical to the regex.
  *   **Refine Verdict 5 (Legacy Flag):** This is **not a meme** unless you can find the graveyard. If no one ever tries to delete it, or if those who do never report breakage, it is inertia (drift), not selection. If you can point to a post-mortem where deletion caused an outage, it becomes a meme (a parasitic one).

  **Verdicts You Keep:**
  *   **1 (Regex):** Meme (fits all four).
  *   **2 (Hello World):** Not a meme (fails Variant Space/Competition if mandated).
  *   **3 (Cache):** Not a meme (fails Lineage).
  *   **4 (Algo Push):** Meme (fits all four; the algorithm is the selector).
  *   **7 (10x Engineer):** Meme (fits all four; fitness is social flattery).

  ---

  ### Application to New Cases

  **(i) AI Code Assistant reproducing the broken regex**
  *   **Verdict:** **Yes, this is the next generation of the same lineage.**
  *   **Analysis:**
      *   *Lineage:* The model weights were trained on codebases containing the regex (Case 1). The AI is a new vector for the same replicator.
      *   *Variant Space:* The AI could have generated a correct regex but didn't.
      *   *Fitness:* The regex survives because it matches the statistical pattern of "code that looks like code" in the training set.
      *   *Graveyard:* The "graveyard" is the human review process. If humans accept the AI's broken regex because it looks right (same pressure as Case 1), the selection pressure remains identical.
  *   **Nuance:** The mechanism has shifted from human-to-human copying to human-to-model-to-human copying, but the selection pressure (skim-reading during review) remains the host environment.

  **(ii) Team's private jargon word**
  *   **Verdict:** **Yes, this is a meme.**
  *   **Analysis:**
      *   *Lineage:* New hires learn it from old hands.
      *   *Variant Space:* They could use standard industry terms but choose the private word.
      *   *Fitness:* The feature driving survival is "signals belonging". This is a functional property of the word within the social system.
      *   *Graveyard:* Words that failed to stick or were used by outsiders and corrected.
  *   **Note:** This is a classic "social cohesion" meme. It evolves rapidly within the team and dies when the team dissolves.

