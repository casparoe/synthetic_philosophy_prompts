  ### The Weakest Bet

  The part of this answer I would bet least on is **Clause 4 (Observable Selection / The Graveyard Condition)**.

  In biology, we often infer selection without seeing the dead organisms; we see the fit ones and deduce the rest must have died. In software culture, failures are often private (no post-mortems published) or silent (projects cancelled quietly). By demanding a visible graveyard, you risk classifying active selection pressures as "inertia" simply because the evidence is buried in private Slack logs or unpublished incident reports.

  If you strictify this clause too much, you will categorise most successful corporate culture as "inertia" simply because failure is stigmatised and hidden. You may need to relax this to "Evidence of Differential Survival", where success of $V$ in context $A$ and failure of $V'$ in context $B$ is enough, even if the failure of $B$ wasn't publicly autopsied.

  ### Summary for your Engineering Brain

  You are treating "Meme" as a slur for "Junk Idea". In evolutionary theory, it is a neutral term for "Unit of Copying".
  *   **Git** is a meme. It competed, won, and spread via copying.
  *   **Euclid's Proof** is a meme. It competed, won, and spread via copying.
  *   **Broken Regex** is a meme. It competed, won (locally), and spread via copying.

  The only difference is the *selection pressure* (utility vs. truth vs. convenience). If you want a principle that cashes out, you must stop letting the *value* of the outcome determine the *mechanism* of the spread.
