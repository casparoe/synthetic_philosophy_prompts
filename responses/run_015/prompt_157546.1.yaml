answer: |-
  Consider a large, open-plan materials testing floor where a proposed ventilation upgrade creates a dilemma: the system either runs in "Standard Mode," exposing a single lead technician to a specific high-decibel spike guaranteed to cause permanent cochlear damage over a year, or it switches to "Distributed Mode," which eliminates that spike but emits a low-frequency hum across the entire facility. While the hum is too faint for any individual researcher to reasonably claim it damages their health or significantly impedes their work, the facility employs four thousand staff members, and the aggregated sum of their minor productivity losses and mild annoyance objectively outweighs the total cost of the technician's injury in standard harm metrics. The safety committee must decide whether to adopt a policy permitting the Distributed Mode to save the technician's hearing, creating a conflict where a straight aggregative view suggests accepting the technician's injury to minimize total net harm, while Scanlon's framework suggests the technician's individual complaint overrides the combined weight of the thousands of minor complaints.

  **Scanlon's View on Reasonable Rejection**
  For Scanlon, the correctness of the policy depends on whether any individual could reasonably reject the principle governing it. The technician facing permanent deafness has a very strong individual complaint against any principle that allows their injury to prevent minor annoyances to others. Conversely, any single researcher suffering from the faint hum has a very weak complaint; individually, their burden is too trivial to reasonably reject a policy that saves a colleague's hearing. Scanlon argues we compare the strongest individual complaint on each side, not the sum of complaints. Since the technician's complaint is vastly stronger than any single researcher's, the principle allowing the injury is reasonably rejected, regardless of how many people suffer the hum.

  **The Aggregator's View**
  A straight aggregative harm-minimizer (like a utilitarian) looks at the total sum of well-being. They accept the empirical premise that 4,000 minor harms add up to more total "disutility" than one catastrophic harm. Therefore, to minimize overall harm in the world, the policy should allow the technician's injury. They argue that morality requires us to produce the best overall outcome, and if the total pain of the many outweighs the pain of the one, the one must be sacrificed.

  **The Structural Feature**
  The feature doing the work here is the **dispersion of harm across distinct persons**. The case is structured so that the harm to the many is divided into units too small to matter morally on their own, but large enough to matter when summed. This dispersion prevents the many from presenting a unified individual complaint strong enough to override the one, which is exactly what Scanlon relies on to block the aggregation.

  **How the Aggregator Dissolves the Feature**
  The aggregator tries to dissolve this feature by denying the moral significance of the "separateness of persons." They argue that drawing a boundary around individual bodies shouldn't stop us from adding up harms; just as you would rub your own eye to save your own leg from being crushed, society should impose small burdens on many to save one from catastrophe if the total math works out. They claim Scanlon's refusal to aggregate is an irrational fetishizing of individual boundaries that ignores the actual total suffering involved.
