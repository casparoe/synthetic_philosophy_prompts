  7.  **Final Polish:** Check against "No Philosophy Jargon." Ensure "Endurantism" isn't mentioned. Ensure "Perdurance" isn't mentioned. Ensure "Temporal Parts" isn't mentioned.
      *   Check President's constraint: "Don't do philosophy at them." I must do philosophy *for* them, not *at* them. It must feel like common sense, not a lecture.

  8.  **The "Cut/Replace" Note:**
