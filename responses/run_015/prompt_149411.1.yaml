answer: |-
  This is a rigorous and fertile ground for argument. You have reconstructed a Plutarchan ethic without the baggage of the academy, and you are applying it to a problem Plutarch never faced: the democratic management of public memory in a post-imperial age. I will take your frameworks seriously, test them against the Colston episode as you have described it, and push back where I think the analogy strains or where your test might be improved.

  ### 1. The Mapping

  You ask what the "life" is here. In Plutarch, the "life" is a text written by a biographer about a dead subject, intended for a living reader. In Bristol, the text is not the bronze. The bronze is merely the ink.

  **The "Life":** The "Life" in this case is the **sequence of public interventions** (1895 erection, 1990s contestation, 2020 toppling, museum exhibition, 2025 re-plaquing). A statue alone is not a life; it is an icon. Icons demand worship or vandalism; they do not invite reading. It is only when the statue enters a narrative sequence—when it is challenged, moved, and contextualized—that it becomes a *bios*, a story of a reputation that can be examined for virtue and vice. Plutarch writes lives to show character in motion. The Colston *story* (not just the man) is now in motion.

  **The "Reader":** For Plutarch, the reader is an elite male citizen shaping his soul for leadership. For Bristol, the reader is the **collective citizenry**. The equivalent of "reading" is not sitting with a scroll; it is **inhabiting the space**. To walk past the plinth is to read. To vote on the council is to annotate the text. The "character formation" at stake is not individual virtue (will I be a better man?) but civic identity (what kind of city are we?).

  **The "Jest" or "Expression":** Plutarch looks for the small detail that reveals the soul (Alexander tilting his head, Caesar scratching his ear). For Colston, the "jest" is not a joke, but a **discrepancy of scale and intimacy**.
  The revealing detail is this: Colston endowed schools for the poor children of Bristol while simultaneously signing the documents that shipped the parents of other children into bondage. The "jest" is the specific administrative signature. It is not the abstract "slave trader" label; it is the mundane act of a man who could look at a ledger of human cargo and a ledger of school endowments in the same afternoon and see no contradiction. That administrative calm is the "unguarded moment." It reveals a soul where charity and cruelty are not enemies, but partners.

  ### 2. The Three Clauses Against Three Objects

  Here we apply your Plutarch Test.

  **Object 1: The 1895 Monument and Plaque**
  *   **(a) The Omitted Episode:** **Fail.** The plaque calls him "virtuous and wise." It omits the Royal African Company entirely. It is pure hagiography.
  *   **(b) The Funding:** **Fail.** It celebrates the gift (almshouses) without tracing the cost (enslavement). It presents the virtue as free-standing.
  *   **(c) The Instruction:** **Fail.** It instructs the reader to *admire*. It implies "be like Colston" (a benefactor), but because it hides the funding, it instructs the citizen to seek the *result* of virtue without the *cost* of virtue. It encourages a dangerous mimicry.
  *   *Verdict:* This is not a Plutarchan life; it is a shrine.

  **Object 2: The Toppled, Graffitied Statue in the Museum (2020-2025)**
  *   **(a) The Omitted Episode:** **Pass.** The graffiti and the damage *are* the omitted episode forced into view. The violence done to the statue mirrors the violence done by the man. The museum display makes the conflict part of the object.
  *   **(b) The Funding:** **Partial Pass.** The museum context explains the money, but the statue itself (the bronze) remains silent. The "text" is now the display case, not the art. It traces the funding, but separates the funding from the face.
  *   **(c) The Instruction:** **Partial Pass.** It instructs the reader to *contemplate conflict*. It does not tell you what to *do*. It says "feel the tension." Plutarch wants you to act (imitate or avoid). Museum-going is often passive.
  *   *Verdict:* This is history, not yet a Plutarchan life. It shows the wound but doesn't prescribe the cure.

  **Object 3: The 2025 Plaque on the Empty Plinth**
  *   **(a) The Omitted Episode:** **Pass.** It records the removal. It admits the previous narrative was contested.
  *   **(b) The Funding:** **Pass.** By recording *why* it was removed, it explicitly links the benefaction to the slave trade. It acknowledges the cost.
  *   **(c) The Instruction:** **Pass.** This is the strongest candidate. It tells the citizen: "This space is no longer for reverence; it is for memory and correction." It instructs the reader to occupy the space differently—not looking up in admiration, but looking at the text in critical engagement.
  *   *Verdict:* This comes closest to a Plutarchan life. It transforms the site from a place of imitation to a place of moral calibration.

  **On Clause (b):** You suspected this is the weak point. I argue it is the **strongest** point. In Plutarch, virtue is never free. If Alexander's generosity bankrupts Macedonia, Plutarch notes it. The 1895 plaque failed because it presented virtue as cost-free. The 2025 plaque succeeds because it admits the debt. The "funding clause" is the only thing that prevents hagiography.

  ### 3. The Breakages (Ranked)

  You identified three places where Plutarch's method might break under the weight of this case. Here is my ranking from shallowest to deepest.

  **Rank 3 (Shallowest): The Selection of Detail.**
  You worry that the "revealing detail" is just a mirror for the viewer's morals (Victorian sees benefactor; Protester sees slaver).
  *   *Analysis:* Plutarch would not see this as a bug, but a feature. He knows readers bring their own souls to the text. However, he trusts the biographer to curate the details to guide the reader. The break here is not in Plutarch's method, but in the *authority* of the biographer. In 1895, the Merchant Venturers were the biographers. In 2020, the protesters were. In 2025, the Council is. The method holds, but the *author* is fragmented. This is a political problem, not a philosophical one.

  **Rank 2 (Middle): Virtue Funded by Vice.**
  Plutarch assumes virtues and vices are distinct threads in a soul (e.g., courage vs. rashness). In Colston, the virtue (charity) is *structurally dependent* on the vice (slavery). The school exists *because* of the ship.
  *   *Analysis:* Plutarch deals with mixed characters (e.g., Alcibiades), but usually, the vice *undermines* the virtue. Here, the vice *sustains* the virtue. Plutarch's moral arithmetic cannot easily subtract the school from the ship because the ship paid for the school. This breaks the "portrait" analogy. You cannot paint the face (charity) without painting the hand that holds the purse (slavery), but the purse bought the paint. This requires a moral calculus Plutarch doesn't possess: the calculus of tainted goods.

  **Rank 1 (Deepest): Individual vs. Collective.**
  Plutarch writes for the **individual soul**. He wants *you* to be better. The Colston episode is about the **collective body**. It is about what a *city* owes to its victims, not what a single reader owes to his own character.
  *   *Analysis:* This is the fatal break. Plutarch has no concept of "systemic harm" or "public memory" as a distinct entity from "great men." He assumes the city is improved by improving the leaders. But Bristol is not trying to improve Colston's soul (he is dead); it is trying to heal its own. Plutarch's method cannot account for **standing**. He cannot tell us what the descendants of the enslaved are owed, because his ethics are vertical (great man to reader), not horizontal (citizen to citizen). This is where the framework must be discarded or radically expanded.

  ### 4. The "Man of His Time" Defense

  You asked me to use the framework on the defense that "he was a man of his time."

  **The Plutarchan Refutation:**
  Plutarch's entire project is **comparative**. He does not judge in a vacuum; he judges in pairs. If you claim a man is a product of his time, you must show that *all* men of that time acted similarly.
  Your intuition about **Edmund Burke** is correct and strictly Plutarchan. Burke was active in the same city, in the same era, and took a opposing moral stance on the trade.
  *   *Application:* If Bristol could erect a statue to Burke (who criticized the trade) while erecting one to Colston (who profited from it), then the "time" was not monolithic. The "spirit of the age" did not force Colston's hand.
  *   *Verdict:* The existence of Burke (or Wesley, or Clarkson) functions as the **Parallel Life** that destroys the relativist defense. Plutarch's method demands we ask: "Who else was there?" If there was a contemporary who chose differently, the "man of his time" defense is historically false. It is not a moral argument; it is a factual error. The Plutarchan lens sharpens this by turning it into a comparison of character: Colston's *phronesis* (practical wisdom) was deficient compared to Burke's, because Burke saw what Colston ignored.

  ### 5. The Parallel Life and Critique of the Test

  **The Parallel Life:**
  If I were writing a Parallel Life to Colston, I would not choose a slave trader. I would choose **Pericles**.
  *   *Why:* Pericles is the golden standard of civic virtue in Plutarch. He built the Parthenon, the ultimate symbol of civic beauty and democracy.
  *   *The Comparison:* The Parthenon was funded by the tribute of the Delian League—essentially imperial extraction from subject states who had no say in Athens' democracy. Colston's schools were funded by the extraction of enslaved Africans who had no say in Bristol's commerce.
  *   *The Verdict:* Plutarch acknowledges the controversy over the Parthenon funding but ultimately forgives Pericles because the result glorified the city. Here, Plutarch's limit is exposed. He would likely side with Pericles (and Colston) because the *civic outcome* (schools/buildings) outweighs the *source* (empire/slavery) in his aristocratic framework.
  *   *The Work:* Pairing them reveals that **civic beauty often rests on invisible violence**. It forces the modern reader to see that Colston is not an anomaly; he is the standard model of pre-democratic benefaction. The verdict is not "Colston was bad," but "The Athenian/Bristolian model of citizenship is morally compromised."

  **Critique of Your Test:**
  You asked me to correct you if your test is flawed. I believe **Clause (c)** is slightly misaligned, and **Clause (a)** is indeed vulnerable.

  *   **Clause (a) (The Omitted Episode):** You worry it's too easy to satisfy with a token vice. You are right. Plutarch does not just want *a* vice; he wants a vice that **illuminates the virtue**. A token scandal (e.g., "he was rude to servants") doesn't help. The omitted episode must be *structurally relevant*.
      *   *Correction:* Clause (a) should read: "It contains an episode that complicates the *source* of the subject's admired trait, not just their personal morality."

  *   **Clause (c) (The Instruction):** You worry it smuggles in moral instruction. I argue that **is the point**, but your formulation is too prescriptive ("do differently"). Plutarch often instructs by **aversion**. Sometimes the lesson is "do not be this," or "be wary of this."
      *   *Correction:* Clause (c) should read: "It orients the reader's moral imagination, either toward imitation or avoidance, with specific reference to the cost identified in (b)."
      *   *Reasoning:* In the Colston case, the instruction is not "build schools" (imitation) nor "stop trade" (avoidance). It is "recognize the entanglement." The instruction is epistemic: *See the cost.*

  **Final Word:**
  You have built a Plutarchan test that is, in one crucial way, more demanding than Plutarch himself. Plutarch often lets the glory of the exploit overshadow the cost of the funding (see *Life of Pericles*). Your Clause (b) demands a transparency that ancient biography rarely achieved. You are using Plutarch to fix Plutarch. The Colston episode, viewed through your lens, teaches us that a "Life" is not finished until the funding is traced. Until then, it is just a statue.
