answer: |-
  # Q&A Prep Sheet: Judging the Past

  ### The One Reply That Must Land
  **The Distinction Between Commemoration and Blame.**
  If you fail to convince the room that we can revise *commemorative practices* (statues, names, holidays) without engaging in *retrospective moral blame* of the agent, you lose the historians (who think moral judgment isn't their job) and you lose the normative force of your argument (why change the statue if he wasn't "bad"?). You must land the idea that commemoration is a *current* speech act by *us*, not a report card on *them*.

  ### Up-Front Concession (For Goodwill)
  **Open by validating the Historians' methodological anxiety.**
  Explicitly concede that *historical explanation* requires bracketing moral judgment. Say: "When writing history, treating moral evaluation as a primary category is indeed bad practice. It flattens the archive. My project isn't to ask historians to judge the dead in their monographs, but to ask how *public institutions* should use historical findings to decide who gets a statue today." This signals you aren't asking them to do "bad history."

  ---

  ### Top 8 Objections (Ordered by Damage Potential)

  #### 1. The "Commemoration Is Just Blame" Objection
  **Who:** A philosopher of language or a public historian.
  **The Question:** "You insist commemoration isn't blame, but removing a statue is a performative act of censure. If we remove Jefferson's statue because he owned slaves, aren't we effectively saying he was blameworthy? You can't separate the normative assessment of the *act* from the assessment of the *agent*."
  **The 2-Minute Reply:** "They are linked, but not identical. Blame targets the agent's moral quality; commemoration targets the *values we wish to signal*. We can acknowledge Jefferson's moral failure without making his *entire legacy* the object of civic honor. Think of it as a shift from 'Was he good?' to 'Is this the story we want to tell about ourselves?' We can judge the *ownership of slaves* as vile without needing to settle the metaphysical question of Jefferson's total moral worth. Commemoration is forward-looking; blame is backward-looking."
  **Soft Spot:** This relies on a somewhat fragile distinction. In the public square, removing a statue *feels* like blaming the person. If the audience presses that the *meaning* of the act is inherently censuring, you don't have a robust semantic theory to fall back on yet.

  #### 2. The "Accessibility vs. Availability" Objection
  **Who:** A historian of slavery/Atlantic world.
  **The Question:** "You argue dissenters existed, so the 'couldn't know better' excuse fails. But availability isn't accessibility. Just because Quakers were petitioning doesn't mean a Virginia planter could *reasonably* have been expected to hear them, let alone act on them without social suicide. You're imposing a modern epistemic standard on an 18th-century information ecology."
  **The 2-Minute Reply:** "That's a fair constraint, but 'social suicide' is part of the moral calculation, not an excuse from it. If the cost of doing the right thing was high, that explains why they didn't do it, but it doesn't make the act right. My point isn't that Jefferson should have been a saint, but that the 'man of his time' defense suggests he *couldn't* conceive of the wrong. The archive shows he *could* conceive of it; he just chose not to pay the price. That shifts it from an epistemic failure to a moral one."
  **Soft Spot:** You haven't defined the threshold of "reasonable access." If the dissenters were marginal fringe voices, does their existence really prove he "could have known"? You're risking a "presentist hero hunt" where you only count the dissenters who look like modern liberals.

  #### 3. The "Posthumous Harm" Objection
  **Who:** A metaphysician or philosopher of responsibility.
  **The Question:** "You concede the dead can't be wronged, but then argue we should change commemoration. If Jefferson isn't harmed by losing his statue, why does the 'man of his time' defense matter at all? If there's no victim, what's the normative bite of your critique?"
  **The 2-Minute Reply:** "The victim isn't Jefferson; it's the *living community*. Bad history in public spaces distorts our current moral self-understanding. Keeping the statue isn't wronging Jefferson; it's misleading *us* about the nature of the founding. The 'man of his time' defense matters because it's a lie told to the living, not a harm inflicted on the dead."
  **Soft Spot:** You admitted this part of your thinking is underdeveloped. If they press on whether "misleading the living" is strong enough to justify *removal* (vs. adding a plaque), you might wobble. You need a stronger link between historical accuracy and civic harm.

  #### 4. The "Epistemic vs. Moral Condition" Objection
  **Who:** A philosopher of moral responsibility (Strawsonian).
  **The Question:** "Is your 'could have known better' test an epistemic condition (did he have the data?) or a moral condition (was he capable of responding to moral reasons)? If it's epistemic, you're begging the question. If it's moral, you're assuming moral realism across time periods."
  **The 2-Minute Reply:** "It's primarily epistemic, but with a moral uptake. I'm arguing the *factual* premise of the defense is false: the moral reasons *were* in circulation. I'm not claiming they were bound to accept Kantian ethics, but that the specific moral claim 'slavery is cruel' was available. I'm avoiding deep moral realism; I'm just tracking the historical availability of the critique."
  **Soft Spot:** Philosophers will smell a dodge. If the moral reasons were available but the *normative force* wasn't recognized by his community, is it really an epistemic failure? You're blurring the line between knowing a fact and recognizing a duty.

  #### 5. The "Cherry-Picking Dissent" Objection
  **Who:** A skeptical historian (the one who called this a "public problem").
  **The Question:** "You mention Quakers and Dominicans. But for every dissenter, there were a thousand apologists. By highlighting the dissenters, aren't you just engaging in the same presentism you critique? You're constructing a 'time' that suits your moral conclusion."
  **The 2-Minute Reply:** "I'm not arguing the dissenters were the majority; I'm arguing they break the *necessity* claim. The defense says he *couldn't* have known. I'm showing he *could* have. It doesn't matter if they were a minority, only that they existed within his horizon. I'm not saying he should have been a Quaker; I'm saying he can't claim ignorance."
  **Soft Spot:** This risks making your standard too low. If *any* dissent breaks the excuse, then almost no historical figure is excusable. You might need to concede that the excuse *sometimes* works, just not for the big cases like slavery.

  #### 6. The "Structural vs. Individual" Objection
  **Who:** A historian of empire/modern Britain.
  **The Question:** "Focusing on Jefferson's moral knowledge individualizes a structural crime. Slavery wasn't sustained by Jefferson's epistemic failures; it was sustained by capital and law. Does your focus on 'what he knew' distract from the material analysis of how empire worked?"
  **The 2-Minute Reply:** "It shouldn't distract, it should complement. The 'man of his time' defense protects the *structure* by absolving the *agents* who maintained it. If we show the agents had choices, we reveal the structure as contingent, not inevitable. It makes the history more radical, not less."
  **Soft Spot:** Historians of structure might still feel you're giving too much agency to "Great Men." You need to ensure you don't sound like you're doing "Great Man History" in disguise.

  #### 7. The "Moral Luck" Objection
  **Who:** A grad student or philosopher.
  **The Question:** "Aren't we just morally lucky we weren't born in 1790? If we were socialized in Virginia then, we'd likely be slaveholders. Does pointing out dissenters really change the luck component of our own judgment?"
  **The 2-Minute Reply:** "Luck explains why *we* judge, but it doesn't change the *truth* of the judgment. We might be lucky, but the Quakers weren't luckier—they made a choice. The existence of the choice proves it wasn't pure determinism. We judge the action, not the luck."
  **Soft Spot:** This is the standard "luck neutralization" move, but it can feel cold. If they press on whether it's *fair* to judge, you might struggle to justify the *practice* of judging vs. the *truth* of the judgment.

  #### 8. The "Category Mistake" Objection
  **Who:** The historian who thinks evaluation isn't their job.
  **The Question:** "Why does philosophy need to intervene here? Historians explain contexts; the public draws lessons. Why does your tripartite distinction matter for the actual work of history?"
  **The 2-Minute Reply:** "Because historians are being dragged into the public debate whether they like it or not. When a politician says 'Jefferson was a man of his time,' they are making a historical claim. I'm giving historians tools to correct that claim without abandoning historical nuance. It protects the discipline from being used as a shield for bad public reasoning."
  **Soft Spot:** This is pragmatic, not theoretical. A purist historian might reply, "Then let the public be wrong; my job is the archive." You have to hope they care about public impact.

  ---

  ### Hope Nobody Asks (The Danger Zone)

  **1. The Metaphysics of Posthumous Wronging**
  *   **The Question:** "You say the dead can't be wronged, but you also say we should stop commemorating them. If they can't be wronged, do they have any interests left? If they do, why can't those interests be violated by removal? If they don't, why did they ever have rights?"
  *   **Why it's dangerous:** You admitted this is half-baked. If you get dragged into the metaphysics of ante-mortem vs. post-mortem persons, you will lose the historians and bore the philosophers.
  *   **Escape Hatch:** "I'm bracketing the metaphysics of the dead to focus on the ethics of the living. Even if the dead *could* be wronged, the harm to the living community's moral understanding outweighs the symbolic interest of the deceased."

  **2. The Authority Question**
  *   **The Question:** "If commemoration standards are indexed to the present, *which* present? Who has the authority to decide Jefferson no longer fits? Isn't this just majoritarian moralism?"
  *   **Why it's dangerous:** This turns your talk into a political debate about who decides history. It opens a can of worms about democratic authority vs. expert knowledge that you don't have time to solve.
  *   **Escape Hatch:** "That's a political question, not a historical one. My framework just clarifies *what* is being decided (our values, not their worth). Who decides is for the polity to work out."
