answer: |-
  This is a classic stalemate in the philosophy of cognitive science, but your description of the group's dynamics is exceptionally precise. The fact that empirical data (neuromorphic chips, predictive processing fits) fails to move the needle, and that the "whole-brain simulation" question cuts across the three camps rather than dividing them, is the critical diagnostic clue.

  Here is the diagnosis, the evaluation of your proposed test, and a roadmap for progress.

  ### Part 1: The Diagnosis

  **Verdict:** Your hypothesis is the correct one. The dispute is a **proxy war over explanatory indispensability**, disguised as an ontological question.

  The question "Is the brain a computer?" is functioning as a placeholder for: *"Is the computational level of description indispensable for a complete scientific explanation of neural activity, or is it merely a convenient heuristic that could in principle be eliminated in favor of a purely biophysical account?"*

  **Argument for this diagnosis against the alternatives:**

  1.  **Against the Verbal Dispute:** If this were merely verbal (Formal vs. Engineering senses of "computer"), the group could resolve it by stipulating definitions. They haven't, because the stakes aren't linguistic; they are *normative*. Camp 2 isn't just saying "I define computer this way"; they are saying "If you don't accept this definition, your explanation is *shallow*." Camp 3 isn't saying "I use the word differently"; they are saying "Your claim of depth is an illusion." The resistance to definition-swapping indicates they are fighting over the *authority* of the explanation, not the label.
  2.  **Against the Two-Questions Hypothesis:** If this were a confusion between classification (is it a computer?) and utility (does the model work?), the empirical success of the models should have satisfied everyone. It hasn't. Camp 2 admits the models work but insists that without the ontological commitment to medium-independent rules, the success is accidental or merely phenomenological. Camp 1 admits the ontology is shaky but insists the working model is all science can ask for. They are not talking past each other; they are disagreeing on what counts as *scientific success*.
  3.  **Against the Hidden Empirical Question:** The idea that this rests on recoverability of causal structure from tissue alone is tempting, but Camp 3 (Instrumentalism) explicitly rejects the premise that there is a fact of the matter to be recovered. Furthermore, Camp 1 (Trivialism) agrees that structure determines function but argues the mapping is non-unique. The disagreement isn't about whether the structure *can* be read; it's about whether reading it yields *the* computation or *a* computation.

  **Why the "Simulation Split" confirms this:**
  The fact that opinions on whole-brain simulation cut across the camps proves that the label ("Realist," "Instrumentalist") is less important than the individual's commitment to **explanatory autonomy**.
  *   Those who say simulation settles it believe that functional replication *is* explanation (Camp 1 & some Camp 2).
  *   Those who say it is irrelevant believe that replication without understanding the *organizing principle* is just mimicry (Camp 2 & Camp 3).
  This confirms the fight is about what constitutes an *explanation*, not what the brain *is*.

  **Falsification Conditions:**
  I would be wrong about this diagnosis if:
  1.  **New Empirical Data Forces Consensus:** If a discovery were made that was *incompatible* with computational description but compatible with biophysical description (or vice versa) in a way that forced one camp to abandon their explanatory framework entirely. (Unlikely, given the flexibility of computational mapping).
  2.  **Methodological Decoupling:** If a member of Camp 2 (Realist) adopted a purely biophysical methodology without feeling they had lost something explanatory, or a member of Camp 1 (Trivialist) insisted on medium-independence as a constraint on modeling. If the methodological preferences dissociate from the metaphysical labels, then the labels are indeed just verbal, and my diagnosis that they are proxies for methodology is wrong.
  3.  **Consensus on "Computer" without Consensus on Explanation:** If the group agreed "Yes, it's a computer" but continued to disagree violently on whether that mattered for explanation. (Currently, the agreement on the word is the bottleneck).

  ### Part 2: What Counts as Progress?

  Under this diagnosis, progress is **not** answering "Yes" or "No." Progress is dissolving the ontological question into a methodological one.

  **The Shift:**
  Stop asking "Is the brain a computer?"
  Start asking: **"Under what conditions does the computational vocabulary yield predictions or interventions that the biophysical vocabulary cannot?"**

  **Concrete Steps for the Group:**
  1.  **Identify Failure Modes:** Instead of looking for where computational models work (they work everywhere, per Camp 1), look for where they *break*. Are there neural phenomena (e.g., specific forms of plasticity, neuromodulatory context-dependence, metabolic constraints) where the computational description becomes so gerrymandered that it loses its portability? If Camp 2 is right, there must be a limit where the "medium-independence" fails.
  2.  **Interventionist Criteria:** Adopt an interventionist framework (à la Woodward or Craver). Does manipulating the system at the "computational level" (e.g., changing a rule or representation) produce predictable changes distinct from manipulating the "implementation level" (e.g., changing ion concentrations)? If the causal powers map 1:1, Camp 1 wins (explanatory redundancy). If they come apart, Camp 2 wins (explanatory autonomy).
  3.  **The "So What?" Test:** Require that any claim about the brain being a computer be followed by "Therefore, we should model/measure/intervene differently than if it weren't." If the practical research program is identical regardless of the answer, the question is purely metaphysical and should be bracketed.

  ### Part 3: The Blind-Compilation Test

  You asked for a judgment on your "Blind-Compilation Test" (hand over wiring/dynamics, recover task).

  **Verdict:** The test **relocates the dispute one level down** and ultimately **restates the Trivialist position** in new vocabulary. It will not dissolve the dispute.

  **Why it fails:**
  1.  **The "Task" is Teleological:** The test assumes a "task" exists to be recovered. Camp 3 (Instrumentalist) denies this. A weather system has dynamics, but no *task* unless an observer assigns one (e.g., "predict rain"). If the engineer recovers "solves Navier-Stokes equations," Camp 3 says, "No, it *is* Navier-Stokes. Solving is what *we* do with it." The test smuggles in the very ascription it tries to avoid.
  2.  **The Triviality Trap:** Camp 1 (Trivialist) can always pass this test. Given any dynamics, a clever engineer can construct a mapping where the system "computes" something. (This is the Putnam/Piccinini objection). Unless you constrain *what counts as a valid task description* (e.g., it must be compact, or teleologically grounded), the weather system passes.
  3.  **The Realist's Dilemma:** Camp 2 wants the test to distinguish "real" computation from "ascribed" computation. But if the weather system passes, Camp 2 must either accept that weather computes (pancomputationalism, which dilutes the concept) or reject the test. If they reject the test, they must admit that structural recovery isn't enough—they need *semantic* or *teleological* facts (what the system is *for*), which returns us to the original stalemate about whether those facts are intrinsic or ascribed.

  **Does it dissolve the dispute?**
  No. It moves the fight from "Is it a computer?" to "Is the task description intrinsic to the dynamics?" Camp 3 will say "No, tasks are assigned." Camp 2 will say "Yes, functions are selected." Camp 1 will say "Tasks are mappings, pick one." You have recreated the original triangle in terms of "task recovery."

  **Does it restate Trivialism?**
  Yes. If the criterion is "can a mapping be found," Camp 1 wins by default. If the criterion is "can the *correct* mapping be found," you have to define "correct," which brings you back to the original metaphysical disagreement.

  ### Part 4: Will you be here in eight months?

  **Yes, if you keep the current question.**
  The question "Is the brain a computer?" is a philosophical sinkhole. It has been debated for 70 years without resolution because it conflates ontology, methodology, and semantics. The empirical data will never resolve it because all three positions are compatible with all possible data (due to the flexibility of mapping and the underdetermination of theory by data).

  **No, if you change the question.**
  You can end this, but it requires a change of frame that might feel like "giving up" to the hardliners.

  **The Way Out:**
  Propose a moratorium on the word "computer." Replace it with **"Algorithmic Explanation."**
  Reframe the debate: *"To what extent is neural activity best explained by rules operating on representations, rather than by dynamical systems equations operating on state variables?"*

  This forces the issue onto ground where there *are* factual disagreements:
  *   **Discreteness vs. Continuity:** Do neural states behave discretely (digits) or continuously (analog dynamics)?
  *   **Syntax vs. Dynamics:** Do transitions depend on the *shape* of the state (syntax) or the *energy landscape* (dynamics)?
  *   **Portability:** If we change the substrate (silicon vs. carbon), do we have to change the *rules* or just the *parameters*?

  These are empirical and modeling questions. Camp 2 can argue for discreteness/syntax. Camp 1 can argue for continuous dynamics. Camp 3 can argue that the distinction doesn't impact predictive power.

  **Final Advice:**
  Tell the group that the "Is it a computer?" question is a **category mistake** in the context of their empirical agreement. It treats a methodological stance as a natural kind. Propose that the goal of the reading group for the next eight months should not be to answer the question, but to **catalog the specific explanatory costs and benefits** of adopting the computational stance in specific sub-domains (e.g., sensory coding vs. motor control vs. memory consolidation).

  If you can show that the "computational" stance is indispensable in Domain A but redundant in Domain B, you dissolve the global metaphysical fight into local methodological decisions. That is the only path to progress that respects the sophistication of all three camps.
