  4.  **Identify Disanalogies (The Critical Part):**
      *   *The "Inert Feed" Problem:* In a TV studio, a camera feed *does* do work even if not broadcast. It triggers monitors, allows the director to switch cameras, adjusts lighting, etc. It's causally potent *within* the studio.
      *   *Neural Reality:* In the brain, the neural correlates of P-consciousness (e.g., V4 activity) are often the *same* neurons driving the access. You can't easily sever the "feed" from the "causal power" without removing the physical substrate.
