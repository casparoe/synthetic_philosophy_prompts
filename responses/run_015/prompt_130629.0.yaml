      *   *Ned Block's Overflow:* Block argues we experience more than we can report (Iconic memory, Sperling's paradigm). This supports P-without-A.
      *   *Does this imply Epiphenomenalism?* Not necessarily. Just because I can't *report* it (verbal access) doesn't mean it didn't influence *non-verbal* behavior (e.g., eye movements, priming, emotional response).
      *   *Partial-Report Paradigms:* Sperling's partial report shows high capacity iconic memory. If subjects can report a cued row, that info was accessible *briefly*. If it fades before report, was it P without A? Block says yes. Critics (Dennett, etc.) say if it can't drive report, it wasn't truly accessible, but it might have driven the *capacity* to report if cued instantly.
