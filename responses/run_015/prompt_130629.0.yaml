      *   *Alternative:* **The Spotlight on a Stage.** The actors (modules) are always working. The spotlight (attention/access) makes them visible to the audience (report). But the actors are still acting in the dark. This preserves the causal power of the unconscious.
      *   *Wait, the prompt asks about P-without-A.* If GWT identifies Consciousness with Access, P-without-A is illusory. If Block is right, GWT needs modification.
