prompt: |-
  I keep noticing a pattern in how people make decisions when the odds aren't fully spelled out, and I'm trying to figure out whether this thing has a name. It's not just risk aversion. A colleague was picking between two funds. Fund X: "historically 6% annually, SD 4%." Fund Y: "we target 6% but we're too new for historical stats." Same expected return, but he wouldn't touch Fund Y. My sister chose a vacation rental with 40 reviews over one with zero reviews and better photos. I do this too — I'll drive a known route with predictable traffic over a new one my GPS says is faster, because I don't trust the estimate. In each case the avoided option doesn't have worse odds in any calculable sense; the odds are just unknown. I've heard "uncertainty aversion" but I don't know if that's the technical term or if it's even considered distinct from risk aversion. Is there an established name for this, and more importantly, how do you carve the boundary between this and regular risk aversion? And is it considered a bias or a reasonable response to missing information?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Observation:** The user notices a pattern where people prefer options with *known* probabilities/outcomes over options with *unknown* probabilities/outcomes, even when the expected value seems similar.
      *   **Examples:**
          *   Fund X (known history) vs. Fund Y (new, no history).
          *   Rental A (many reviews) vs. Rental B (no reviews, better photos).
          *   Route A (known traffic) vs. Route B (GPS estimate, untrusted).
      *   **Core Question:** What is the name of this phenomenon? Is it distinct from risk aversion? Is it a bias or reasonable?
      *   **Specific Terminology Mentioned:** "Uncertainty aversion."
      *   **Key Distinction Needed:** Risk (known probabilities) vs. Uncertainty (unknown probabilities).

  2.  **Identify the Concept:**
      *   The scenario described is the classic definition of the **Ellsberg Paradox**.
      *   The psychological/behavioral economics term is **Ambiguity Aversion** (sometimes called Uncertainty Aversion).
      *   The distinction between "Risk" and "Uncertainty" goes back to Frank Knight (**Knightian Uncertainty**).

  3.  **Drafting the Response - Section by Section:**

      *   **Confirmation & Naming:**
          *   Yes, there is a specific name.
          *   Primary term: **Ambiguity Aversion**.
          *   Related concept: **The Ellsberg Paradox** (the famous experiment demonstrating this).
          *   Foundational distinction: **Knightian Uncertainty** (Risk vs. Uncertainty).

      *   **Distinguishing Risk vs. Ambiguity (The Boundary):**
          *   *Risk:* Probabilities are known (e.g., rolling a die, Fund X with historical SD).
          *   *Ambiguity/Uncertainty:* Probabilities are unknown or ill-defined (e.g., Fund Y with no history, Rental with no reviews).
          *   *Risk Aversion:* Preferring a certain outcome over a gamble with the same expected value (e.g., $50 for sure vs. 50% chance of $100).
          *   *Ambiguity Aversion:* Preferring a gamble with *known* odds over a gamble with *unknown* odds (e.g., 50/50 urn vs. Urn with unknown mix).
          *   *Why it matters:* Standard Expected Utility Theory (EUT) assumes people treat these the same. Behavioral economics shows they don't.

      *   **Is it a Bias or Reasonable? (The Normative Question):**
          *   *The "Bias" View:* In strict Bayesian rationality, if you assign a subjective probability to the unknown option, you should treat it like risk. Avoiding it purely because it's ambiguous violates Savage's Sure-Thing Principle. Hence, "Ellsberg Paradox."
          *   *The "Reasonable" View:* In the real world, ambiguity often signals hidden information, incompetence, or manipulation.
              *   Fund Y might be hiding something.
              *   Rental B might be a scam.
              *   GPS might be glitchy.
              *   *Evolutionary heuristic:* "Unknown = Dangerous."
          *   *Conclusion:* It's rational in an ecological sense (real world), but "irrational" in a strict mathematical vacuum (if probabilities are truly random and independent).

      *   **Addressing the User's Examples:**
          *   Fund X vs. Y: Classic ambiguity.
          *   Rental: Information asymmetry (reviews signal trust).
          *   GPS: Trust in algorithm vs. personal experience.

      *   **Nuance/Advanced Context:**
          *   Mention **Knightian Uncertainty** specifically as the philosophical/economic root.
          *   Mention that ambiguity aversion varies by person (competence effect).
          *   Mention that sometimes people are *ambiguity seeking* (e.g., buying lottery tickets where odds are vague but potential is huge).

  4.  **Refining the Tone:**
      *   The user is analytical and observant. Use precise terminology but explain it clearly.
      *   Validate their intuition (yes, it is distinct from risk aversion).
      *   Provide the "why" behind the distinction.

  5.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Just call it Uncertainty Aversion.
      *   *Correction:* "Ambiguity Aversion" is the more precise term in behavioral economics literature regarding the Ellsberg Paradox. "Knightian Uncertainty" is the macro/economic theory term. I should use both to be thorough.
      *   *Check:* Did I explain the boundary clearly? I need to make sure the difference between "I know the odds are bad" (Risk) and "I don't know what the odds are" (Ambiguity) is sharp.
      *   *Check:* Did I answer if it's a bias? Yes, need to balance the "violation of axioms" view with the "ecological rationality" view.

  6.  **Final Polish:** Organize with clear headings. Ensure the Ellsberg Paradox is explained simply (urns). Conclude with a summary statement. (This matches the structure of the final output).

  7.  *(Final check of the prompt requirements)*: User asked for the name, the boundary with risk aversion, and whether it's a bias or reasonable. All three must be addressed explicitly.

      *   Name: Ambiguity Aversion / Ellsberg Paradox.
      *   Boundary: Known probabilities (Risk) vs. Unknown probabilities (Ambiguity).
      *   Bias/Reasonable: Both, depending on the framework (Mathematical vs. Ecological).

  8.  **Constructing the Output.** (Proceed to generate response based on these points.)
answer: |-
  Yes, there is a specific name for this, and you have correctly identified that it is distinct from standard risk aversion.

  The technical term is **Ambiguity Aversion** (sometimes referred to as **Uncertainty Aversion**).

  The foundational concept behind it is known as **Knightian Uncertainty**, named after economist Frank Knight, who distinguished between "risk" (measurable uncertainty) and "uncertainty" (unmeasurable). The behavioral phenomenon was famously demonstrated by Daniel Ellsberg in 1961, leading to the **Ellsberg Paradox**.

  Here is the breakdown of the name, the boundary between it and risk aversion, and the debate over whether it is a bias or a rational heuristic.

  ### 1. The Name and The Experiment
  **Ambiguity Aversion** is the preference for known risks over unknown risks.

  The classic demonstration is the **Ellsberg Paradox**. Imagine two urns:
  *   **Urn A:** Contains 50 red balls and 50 black balls.
  *   **Urn B:** Contains 100 balls, but the ratio of red to black is unknown.

  If you bet on drawing a red ball, most people choose Urn A. If you bet on drawing a black ball, most people *still* choose Urn A.
  Mathematically, this is inconsistent. If you think Urn B has fewer red balls (making it worse for the first bet), you must logically believe it has *more* black balls (making it better for the second bet). Yet, people avoid Urn B in both cases simply because the probability distribution is ambiguous.

  Your examples fit this perfectly:
  *   **Fund X vs. Y:** Fund X has a known distribution (Risk); Fund Y has an unknown distribution (Ambiguity).
  *   **Rental:** One has known quality signals (Risk); the other has hidden quality (Ambiguity).

  ### 2. The Boundary: Risk Aversion vs. Ambiguity Aversion
  The distinction lies entirely in whether the **probabilities are known.**

  | Feature | Risk Aversion | Ambiguity Aversion |
  | :--- | :--- | :--- |
  | **Information** | Probabilities are **known**. | Probabilities are **unknown** or vague. |
  | **The Fear** | Fear of the **loss** itself. | Fear of the **missing information**. |
  | **Example** | Preferring \$50 for sure over a 50% coin flip for \$100. | Preferring a 50% coin flip over a bet on a horse race you know nothing about (even if you estimate the horse has a 50% chance). |
  | **Mathematical Model** | Expected Utility Theory (concave utility function). | Violates Expected Utility Theory (requires non-additive probabilities). |

  **The Boundary Line:**
  If you can write down a precise probability number (e.g., "6% return with 4% SD" or "50% chance of heads"), you are dealing with **Risk**.
  If you cannot assign a precise probability without making a subjective guess (e.g., "Target 6% but no history" or "Unknown mix of balls"), you are dealing with **Ambiguity**.

  Standard economic theory assumes people treat subjective probability (guesses) the same as objective probability (data). Ambiguity aversion proves they do not.

  ### 3. Is it a Bias or a Reasonable Response?
  This is the most contentious part of the literature. The answer depends on whether you view the decision through the lens of **axiomatic rationality** or **ecological rationality**.

  #### The Argument for "Bias" (Axiomatic View)
  In strict decision theory (specifically Savage's Sure-Thing Principle), ambiguity aversion is considered **irrational**.
  *   **The Logic:** A rational agent should assign a "subjective probability" to the unknown option. If you think Fund Y is equally likely to be good as bad, you should treat it mathematically identical to Fund X.
  *   **The Verdict:** By avoiding Fund Y solely because the data is missing, you are violating the laws of probability. You are letting the *source* of the probability influence you rather than the *value* of the probability. In a controlled vacuum, this is a cognitive bias.

  #### The Argument for "Reasonable" (Ecological View)
  In the real world, ambiguity aversion is often a highly **adaptive heuristic**.
  *   **Information Asymmetry:** In finance and commerce, missing information is rarely random. Usually, information is missing because it is bad. Fund Y might be new because the managers failed elsewhere; the rental might have no reviews because it's a scam listing.
  *   **Model Risk:** Your GPS estimate relies on a model. If the model is wrong (e.g., it doesn't know about a construction zone), the "unknown" route carries model risk that the "known" route does not.
  *   **Competence Effect:** Studies show ambiguity aversion decreases when people feel competent. If you are a traffic expert, you might trust your own judgment over the GPS. When you feel out of your depth, ambiguity aversion protects you from enemies who know more than you do.

  ### Summary
  *   **Name:** **Ambiguity Aversion** (demonstrated by the **Ellsberg Paradox**).
  *   **Distinction:** Risk is when you know the odds; Ambiguity is when you don't know the odds. Risk aversion is fearing the loss; Ambiguity aversion is fearing the ignorance.
  *   **Verdict:** It is mathematically inconsistent (a bias) in a closed system, but often **ecologically rational** in the real world where missing data usually correlates with hidden danger.

  Your intuition is serving you well. In a world where counterparties can hide information, treating "unknown" as "dangerous" is usually a profitable survival strategy, even if it violates expected utility theory.
