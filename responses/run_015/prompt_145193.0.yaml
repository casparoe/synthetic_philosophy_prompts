          6.  Plastic Power/Unhistorical: Fair Simplification (High).
          7.  Moral of Proportion: Fair Simplification (Moderate). Nietzsche stresses subordination to "life," not just balance.
      *   *Least Sure:* The "proportion" conclusion. Why? It domesticates Nietzsche's radical hierarchy into a balanced recipe.
      *   *Word Count Check:* Keep it tight.

