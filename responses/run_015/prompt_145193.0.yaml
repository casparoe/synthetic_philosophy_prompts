      *   *Critical History:* Nietzsche says we need all three, but all are dangerous. He doesn't explicitly endorse "critical" as *the* solution, though he uses it. The handout says "the mode Nietzsche himself recommends." This is misleading. He recommends serving *life*, using history as a tool.
