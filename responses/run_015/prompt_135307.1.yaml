answer: |-
  ### Decision Tree for Social Construction Positions

  Follow the path that matches your view on **race**, **gender**, and **money** individually. Note where each kind lands to check for consistency.

  #### Node 1: Ontological Dependence
  **Does the kind vanish if collective belief in it disappears?**

  *   **Yes** — Like **pounds sterling** becoming worthless paper if the bank collapses.
      *   *Go to Node 2A.*
  *   **No** — Like **racial categories** leaving physical traces (e.g. bone density) even after abolition of belief.
      *   *Go to Node 2B.*

  ---

  #### Node 2A (From 'Yes')
  **Can the kind causally reshape biological or physical traits over generations?**

  *   **No** — Like holding **cash** not altering your DNA.
      *   *Go to Node 3A.*
  *   **Yes** — Like **gender** norms altering stress hormones or lifespans.
      *   *Go to Node 3B.*

  #### Node 2B (From 'No')
  **Can the kind causally reshape biological or physical traits over generations?**

  *   **No** — Like **biological sex** determining the category, not vice versa.
      *   *Go to Node 3C.*
  *   **Yes** — Like **race** affecting healthcare access and epigenetic outcomes.
      *   *Go to Node 3D.*

  ---

  #### Node 3 (Final Split)
  **Is there an objective fact of the matter about whether it's constructed, or is that framing itself political?**

  *   **Node 3A (Yes, No, ?):**
      *   **Yes (Objective Fact):** **Institutional Realist**. (Fits **money**).
      *   **No (Political Framing):** *Unmapped.* (Incoherent: Why argue politics about something that vanishes and does nothing?)

  *   **Node 3B (Yes, Yes, ?):**
      *   **Yes (Objective Fact):** *Unnamed Empty Combination*. (See analysis below).
      *   **No (Political Framing):** **Strong Social Constructionist**. (Fits **race**/**gender** for some).

  *   **Node 3C (No, No, ?):**
      *   **Yes (Objective Fact):** **Biological Essentialist**. (Fits **race**/**gender** for some).
      *   **No (Political Framing):** *Unmapped.* (Error theory: It exists, does nothing, and truth is political).

  *   **Node 3D (No, Yes, ?):**
      *   **Yes (Objective Fact):** **Interactionist / Feedback-Loop View**. (Fits **race**/**gender** for most sociologists).
      *   **No (Political Framing):** *Unmapped.* (Pragmatist: Material reality exists, but calling it constructed is purely strategic).

  ---

  ### Analysis of Leaves

  **1. Institutional Realist** (Yes, No, Yes)
  *   **Position:** The kind exists only because we agree it does, but it lacks biological power.
  *   **Fit:** Perfect for **money**. Awkward for **race** unless you argue race is purely legal status.

  **2. Biological Essentialist** (No, No, Yes)
  *   **Position:** The kind is mind-independent and biologically fixed; society cannot reshape it.
  *   **Fit:** Common for **sex**; contested for **race**. Does not fit **money**.

  **3. Interactionist / Feedback-Loop** (No, Yes, Yes)
  *   **Position:** The kind has a material base that persists without belief, but social treatment reshapes that biology over time.
  *   **Fit:** Standard sociological view for **race** and **gender**. Fails for **money**.

  **4. Strong Social Constructionist** (Yes, Yes, No)
  *   **Position:** The kind is constituted by belief (vanishes without it), yet that belief physically reshapes bodies; claiming this is itself a political act.
  *   **Fit:** Critical theory view of **race**/**gender**. Fails for **money** (usually).

  **5. Unnamed Empty Combination** (Yes, Yes, Yes)
  *   **Path:** Vanishes without belief → Reshapes biology → Objective fact.
  *   **Status:** **Unexplored / Tenuous.**
  *   **Reasoning:** If the kind vanishes when belief stops, how does it objectively reshape biology over generations? It implies a 'ghost in the machine'—a category that stops existing yet leaves permanent physical scars. It is not logically incoherent (legacy effects), but rarely defended as a stable ontology.

  ### Separation Flags

  **Interactionist vs. Strong Social Constructionist**
  This tree separates them at Node 1 and Node 3, but in practice, these leaves are hard to distinguish.
  *   **The Problem:** An Interactionist might say "Race persists without belief" (No), while a Strong Constructionist says "Race vanishes without belief" (Yes). However, both agree biology is reshaped (Yes). The distinction often collapses into semantics: does the *physical trace* count as the 'kind' persisting, or just debris?
  *   **Recommendation:** If you land here, check if your disagreement is merely about whether 'race' refers to the *classification* (vanishes) or the *population* (persists).

  **Institutional Realist vs. Empty Combination**
  *   **The Problem:** Separated only by Node 2 (biological reshaping). As health economics shows, **money** *does* reshape biology (via stress, nutrition). If you admit money affects DNA via poverty, Institutional Realists slide into the Empty Combination unless they deny the causal link is intrinsic to the *kind* itself.
