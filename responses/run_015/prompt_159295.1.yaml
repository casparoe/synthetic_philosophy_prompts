answer: |-
  Subject: Plan for the FEP session

  Thanks for sending this over. It is clear you have diagnosed the failure mode of the last session correctly, which is that vocabulary retention replaced conceptual understanding. For a room of engineers and cognitive scientists, the risk is always that they will implement the math without grasping the ontology. Here is the sequencing plan I would run if I were in your shoes, committed to the constraints you have set.

  You need to invert the standard pedagogical order for this specific audience. Do not start with the prediction-error loop. If you draw the loop first, the programmers will instantiate it as a signal processing pipeline where the goal is to minimize the difference between input and output, which reinforces the next-frame prediction error they are already making. The idea of a generative model that infers distal causes must be in place before the loop means anything. The loop is merely the mechanism by which the model is updated; without the model specifying that sensations are caused by hidden states, the error is just noise, not evidence. You should introduce the generative model concept in the first fifteen minutes, but you must ground it immediately in the distinction between predicting the next input and predicting what is producing the input. You can teach this distinction cold to programmers because they understand the difference between a state variable and an observation variable. Frame it as the difference between modeling the data stream versus modeling the data generator. If you do not establish this before you draw the loop, they will hardcode the architecture wrong and you will spend the rest of the session debugging their mental model rather than teaching the theory.

  For the carrying example, choose the heavy door. The staircase step is a classic perceptual error, but it is passive. The Free Energy Principle is equally about action, and the door allows you to demonstrate both perceptual update and active inference in a single narrative. When you push a door you expect to be heavy and it opens easily, your body has already calibrated the motor command based on a prior belief about the door's mass. The error is not just visual; it is proprioceptive and motor. This example has to be first-personal and cheap because everyone has experienced the lurch of misapplied force. It needs to have an active payoff because it shows that action is used to minimize prediction error just as much as belief update is. You should avoid the usual demo material like visual illusions or ventriloquism effects because those teach the wrong lesson about veridicality. Illusions suggest that perception is usually correct and sometimes tricked, whereas the theory claims all perception is a controlled hallucination constrained by sensory data. Using illusions reinforces the idea that there is a ground truth we are missing, rather than the idea that the brain is constructing a useful simulation of causes.

  Regarding precision, you can get away with presenting it as gain on a channel for an audience of engineers. It maps cleanly to signal-to-noise ratio or weighting a loss term, which they will understand intuitively. The cost of this metaphor is that it risks reifying precision as a fixed property of the sensory channel rather than a belief about reliability that the system itself learns and updates. If you use the gain metaphor, you must explicitly state later that the system learns the gain, otherwise they will treat precision as a hyperparameter rather than a posterior estimate. This is a technical debt you are taking on for the sake of clarity, but it is worth it for a ninety-minute session.

  Here is the misconception map in the order these errors will form during the session. The first misconception is that the free energy in question is a thermodynamic quantity. You must head this off in the first five minutes with a sentence of framing that states explicitly this is information theoretic free energy, not heat. If you do not kill this immediately, the physicists in the room will derail the conversation. The second misconception is that the brain literally runs Bayesian computation. Address this when you introduce the generative model by framing it as an "as if" description rather than a claim about neural implementation. The third is that if perception is prediction then nothing ever corrects us and we are hallucinating all the time. Head this off during the door example by asking them what happens when the door does not move. The sensory evidence forces the update. The fourth is the dark-room worry, which is the idea that the brain should minimize error by shutting off all input. Do not raise this yourself early. Wait until you introduce action and active inference, then let someone in the room ask it. If you raise it early, it spends fifteen minutes on a problem you cannot solve yet. When it comes up, use the door example again: we do not sit in dark rooms because we have prior beliefs about being alive and embodied that require specific sensory states. The final misconception is the it explains everything so it explains nothing complaint. Expect this from your most skeptical person at the end. Validate the complaint rather than fighting it. Frame it as a normative theory that offers a unified language, not a specific mechanism for every phenomenon.

  There are three things you should openly refuse to explain at this level and say out loud that you are refusing. Your candidates are correct. Tell them you are not covering the variational bound, the Markov-blanket formalism, or anything about consciousness. State this in the first ten minutes so they know the boundaries of the session. If you do not set these boundaries, the grad students will try to drag the discussion into the math of the bound or the philosophy of mind, and you will lose the engineers.

  For the last five minutes, put this question to the room: If the goal of the system is to minimize prediction error, why do we seek out novel stimuli instead of staying in familiar environments? A good answer has to contain the notion that novelty reduces long-term uncertainty or that the system has prior preferences for certain states that require exploration. A wrong answer will focus only on immediate error minimization. This diagnostic tells you whether they understood that free energy minimization includes optimizing over future states and precision, not just matching current input.

  If the room were mostly philosophers instead of engineers, I would reverse two choices. I would start with the dark-room problem rather than the architecture, because philosophers care about the teleological implications before the mechanical ones. I would also spend less time on the precision-as-gain metaphor and more time on the ontology of the generative model, because engineers need to know how it works while philosophers need to know what it claims exists. For your current group, stick to the mechanics first, then the implications.

  Let me know if you want to walk through the whiteboard layout for the door example.

  Best of luck with the session.
