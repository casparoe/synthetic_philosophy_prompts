  Hey, backend dev here with no philosophy background, I mostly build APIs and mess with tiny transformers on weekends so sorry if I use the wrong words for this.

  My coworker is super into interpretability and he has strong opinions about when he will say a network really represents something vs when its just correlation or dumb memorization. Ive been keeping track of his calls and I cant quite figure out his rule, and I want to predict what he will say about my own little model.

  Here are his verdicts so far:

  1. toy translation model: you can train a linear probe to read source language off an embedding direction, and if you patch that direction the translation flips languages like it believes the input was French instead of English. He says yes, that is a representation of source language.

  2. board game model that plays Othello-style moves from move history with no board given: you can decode the board state from the hidden layer, and if you edit that pattern the next-move predictions change exactly as if the board was different. He says yes, representation of the board.

  3. big chatbot with a sparse autoencoder feature for a famous bridge in San Francisco: you can decode it, and if you clamp it high the bot starts shoehorning the bridge into answers unprompted. He says yes, representation.

  4. same chatbot, a neuron that lights up for Python code: probe decodes Python vs not-Python really well, but zeroing it out or doubling it does basically nothing to outputs. He says no, not a representation, just a correlation.

  5. base model embeddings where you can probe for whether a bigram was super frequent in training: probe is great, but patching that info around does not change next-token predictions in any systematic way. He says no, not a representation.

  Now my new case: I trained a dumb 2-layer transformer from scratch just to copy 8-token strings. I found a direction in layer 1 where a probe reads out position index 0-7 almost perfectly, and if I patch the activation at position 4 toward the position 5 pattern, the copy output shifts by one right at that spot, like it thinks it is one step later. It is decodable and patching works, but its just tracking position in its own input, not anything in the outside world. I think its teh cleanest causal thing Ive found but also the most boring.

  What do you think he will say about my copier, yes representation or no? I am less interested in the yes/no than in the rule he seems to be running. Lay out two or three different rules that all fit cases 1-5, say what each one predicts for my copier case, give me your best guess for what he will actually say and why, and tell me what one extra experiment or toy case would best split those rules apart going forward.
