  7.  **Final Polish:** Ensure tone is empathetic to the student's plight but rigorous. Use standard terminology (agent-relative, non-ideal theory, complicity). Make sure to directly answer "Where exactly does this slip?"

      *   *Decision:* The slip is primarily in **(3)** and **(7)**.
