      *   *However,* the user wants an "exit." The best exit is challenging Step (3) via **Collective Obligations**. Deontology can posit a duty to coordinate. If we coordinate, we don't face the dilemma. The failure is in the lack of coordination, not the constraint.
      *   *Also challenge Step (7):* Does deontology *condemn* them? It might acknowledge the action was wrong *pro tanto* but all-things-considered justified (Threshold Deontology), or it might say it was wrong but excusable.
      *   *Let's go with the "Complicity/Enforcement" angle.* If I have the power to stop N-1 violations, do I have a duty of justice to do so? If exercising that duty requires a violation, we have a conflict of duties. The argument assumes the "Don't Kill" duty always wins. But what if the "Protect Innocents" duty is also absolute?
      *   *Actually, the strongest philosophical counter is to Step (3)'s interpretation of Agent-Relativity.* Agent-relativity doesn't mean *ignoring* the causal impact of my action on others' agency. It means I can't use others as means. But if killing one innocent *stops* N-1 agents from using N-1 innocents as means, am I violating the constraint? Yes. But is it the *only* option?
      *   *Let's focus on the "Clean Hands" caricature.* The argument assumes deontology is about the agent's status. It's actually about the patient's rights.
