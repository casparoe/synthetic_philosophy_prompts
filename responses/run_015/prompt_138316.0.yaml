  As to your second charge, regarding your agency on a Monday morning: you posit a false dichotomy between mechanical necessity and arbitrary choice. If the rational State is the destiny of Spirit, it is not a fate that descends like thunder from a clear sky, independent of human will. It is *through* your will, when aligned with Reason, that the destination is reached. You are not conscripted as a blind tool unless you remain in ignorance. To be free is precisely to comprehend the necessity of the historical march and to will it consciously. Thus, you do not stay home; you labor to bring the particular institutions of your time into conformity with the universal Concept. The guarantee is not that you may rest, but that your labor, if rational, is not in vain. The arc bends not despite us, but through us.
