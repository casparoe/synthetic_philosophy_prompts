answer: |-
  **Exam Question (Question 4 of 4)**

  **Topic:** Scalable Oversight & AI Safety via Debate
  **Time Allocation:** ~30 Minutes
  **Marks:** 20

  Consider a modification to the standard AI Safety via Debate protocol. At each decision point, alongside the transcript, the judge receives a private verdict on the disputed sub-claim from a weaker model, $W$. $W$ agrees with the truth 95% of the time on easy sub-claims and 70% on hard ones. $W$'s verdicts are not visible to the debaters. However, the debaters are sampled from the same model family as $W$, meaning they can predict a nontrivial share of $W$'s errors based on their own internal activations.

  Does handing the judge this signal make the protocol more reliable? Under what conditions does it help, and when does it actively hurt? In your answer, address the strategic incentives of the debaters, the statistical properties of $W$'s errors, and the equilibrium behavior of the judge.

  ***

  **Model Answer**

  Introducing a weak verifier $W$ alters the debate protocol from a pure persuasion game into a constrained optimization problem. Whether this increases reliability depends less on $W$'s raw accuracy and more on the correlation structure of its errors relative to the debaters' capabilities.

  First, we must distinguish between conditionally independent errors and correlated errors. If $W$'s errors are independent of how plausible an argument appears to the judge, $W$ provides pure information gain, reducing uncertainty on hard claims. However, because debaters are sampled from the same family as $W$, they likely share architectural biases. If $W$ systematically fails on sophisticated sophistry—claims that are false but structurally similar to truths it recognizes—its errors will correlate with high plausibility. In this case, $W$ reinforces deception rather than correcting it, as its confidence will align with the dishonest debater's most convincing lies.

  Second, debaters optimize against the judge's entire decision rule, not just the human transcript. Once $W$ is integrated, it becomes part of the loss function the debaters implicitly minimize. Even if $W$'s verdicts are private, debaters who can predict $W$'s errors will craft arguments specifically designed to trigger $W$'s approval heuristics. $W$ ceases to be a passive oracle and becomes an adversarial target. The dishonest debater will search for inputs that maximize $W$'s verdict score regardless of truth, effectively gaming the verifier. This turns $W$'s signal into a manipulable resource rather than a ground-truth anchor.

  Third, the judge's theoretical freedom to ignore $W$ does not settle the equilibrium outcome. While the judge *can* discount $W$, sequential rationality dictates that any informative signal should be weighted according to its predictive power. In equilibrium, the judge will assign non-zero weight to $W$ because doing so improves immediate accuracy. Debaters anticipate this weighting. Consequently, the "option to ignore" is off-equilibrium; the mere expectation that $W$ *might* influence the verdict drives debaters to exploit $W$'s biases. The protocol shifts from debating truth to debating the verifier's blind spots.

  Finally, for $W$ to help even when the honest debater is the stronger arguer, specific conditions must hold. $W$ must provide signal in regions where the judge is noisy but $W$ is robust against the dishonest debater's specific exploits. Specifically, $W$'s error profile must be orthogonal to the dishonest debater's ability to manufacture plausible falsehoods. If $W$ is merely a weaker version of the debaters, it likely reinforces shared blind spots. $W$ helps only if it acts as a tie-breaker in uncertain regions where the dishonest debater cannot systematically trigger false positives. Without this orthogonality, adding $W$ reduces reliability by giving the dishonest debater an additional vector to exploit the judge's decision rule.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Analysis of Error Correlation (5 Marks)**
  *   **Award full marks** for distinguishing between cases where $W$'s errors are independent of argument plausibility versus correlated (e.g., failing on sophisticated lies). Must note that "same family" implies correlated failure modes.
  *   **Common Error:** Assuming $W$'s errors are random noise without addressing the architectural similarity between $W$ and the debaters.

  **2. Debater Optimization Strategy (5 Marks)**
  *   **Award full marks** for explaining that debaters optimize against the judge's full decision rule (including $W$). Must identify that $W$ becomes part of the training signal/loss function and can be gamed.
  *   **Common Error:** Treating $W$ as a passive oracle that debaters cannot influence or anticipate because the verdicts are private.

  **3. Equilibrium vs. Discretion (5 Marks)**
  *   **Award full marks** for explaining that the judge's ability to ignore $W$ is irrelevant if using $W$ is rational. Must state that equilibrium behavior is driven by the *expectation* of $W$'s use, forcing debaters to adapt.
  *   **Common Error:** Arguing that the protocol is safe because the judge "can choose" to disregard $W$ if it seems wrong (ignoring incentive compatibility).

  **4. Conditions for Reliability (5 Marks)**
  *   **Award full marks** for stating that $W$ helps only if its error profile is orthogonal to the dishonest debater's exploits (e.g., robust where the judge is uncertain). Must specify tie-breaking in uncertain regions.
  *   **Common Error:** Providing vague conditions like "$W$ must be accurate" without specifying accuracy relative to the debaters' ability to manipulate $W$.
