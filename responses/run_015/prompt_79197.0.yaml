answer: |-
  To reconstruct the philosophical commitments of these three regimes is to map three distinct theories of the state, the body, and the market. Each regime encodes a specific answer to the question: *What kind of thing is sex work?* The following analysis reconstructs the implicit normative frameworks of the Nordic, Legalization, and Decriminalization models, distinguishing between what their logic strictly requires and what merely contingently fits, before evaluating their coherence.

  ### 1. The Nordic Model: Asymmetrical Agency and Harm to Class

  **Implicit Commitments**
  The Nordic model (criminalizing the purchase, decriminalizing the sale) presupposes a radical asymmetry in agency. It posits that within the transaction of commercial sex, the seller's consent is structurally compromised by patriarchy, poverty, or prior victimization. Therefore, the seller is conceptually reconstructed not as a contracting party but as a **victim-survivor**. The buyer, conversely, is presumed to possess full agency and is thus the sole locus of moral and legal culpability.

  **Location of Wrongdoing and Buyer Culpability**
  The wrongdoing is not located primarily in individual harm (since the seller is not prosecuted), but in **systemic harm to a class**. The theory relies on a macro-sociological claim: that prostitution constitutes violence against women as a group, reinforcing gender inequality regardless of the subjective experience of individual participants.
  *   **Theory of Buyer Culpability:** The buyer is culpable not necessarily because they harmed a specific individual (who the state treats as a victim), but because they are **complicit in a practice that degrades women as a class**. This is a hybrid of an exploitation theory (taking advantage of structural inequality) and a perfectionist claim (sex is a category of human intimacy that cannot be commodified without violating human dignity).
  *   **Why the Seller Commits No Offence:** If the seller is a victim, prosecution is unjust. However, the act remains "wrong" in the eyes of the state, which is why the *demand* is targeted to shrink the market.

  **Requires vs. Fits / Underdetermination**
  *   **Strictly Requires:** The law strictly requires the asymmetry of criminal liability. It cannot logically criminalize the seller without abandoning the "victim" premise.
  *   **Merely Fits:** The provision of "exit services" (counseling, job training) fits the model but is not strictly required by the criminal code; however, without them, the claim of treating sellers as victims rather than criminals is pragmatically hollow.
  *   **Underdetermination:** This arrangement is licensed by rival theories. A **Radical Feminist** supports it to end patriarchal exploitation. A **Moral Conservative** might support the exact same laws based on the belief that prostitution is sinful, but that sinners (sellers) should be saved rather than punished, while customers are corruptors. The practice is underdetermined between a theory of *oppression* and a theory of *morality*.

  **Inconsistency Analysis**
  *   **Apparent Inconsistency:** If the transaction is inherently harmful, why is selling legal?
  *   **Dissolution:** This dissolves if one accepts the "necessity" defense. The state tolerates the sale as a survival strategy for victims while attacking the cause (demand).
  *   **Genuine Tension:** Defenders would concede a tension regarding **agency**. By refusing to punish the seller, the state treats them as a non-agent (victim). Yet, by allowing them to continue selling (rather than involuntarily committing them to protection), the state respects their immediate autonomy. The regime oscillates between paternalism (you are too oppressed to consent) and liberalism (you are free to walk away).

  ### 2. The Legalization Model (Germany/Netherlands): Sanitized Commodification

  **Implicit Commitments**
  The legalization model presupposes that sex work is **inevitable but hazardous**. It accepts the commodification of sex but treats it as a *sui generis* commodity that requires state sanitization. Unlike the Nordic model, it views the seller as an agent, but a fragile one who requires protective oversight.

  **Commodification and the Nature of Work**
  *   **Is it Work Like Any Other?** No. If it were truly "work like any other," the state would apply general labor and commercial codes. Instead, the regime creates a **parallel legal universe**.
  *   **Registration and Condoms:** The requirement to register individual workers and mandate condom use reveals a **paternalistic presupposition**. In other risky trades (e.g., construction, stunt performance), the state sets safety standards but does not typically register individual workers' bodies or mandate specific protective gear in private contracts to this degree. This presupposes that sex workers cannot be trusted to negotiate safety themselves and that the public has a hygiene interest in the specific bodies of sex workers that it does not have in the bodies of chefs or nurses.

  **Requires vs. Fits / Underdetermination**
  *   **Strictly Requires:** The licensing of premises and the taxation of income. To legalize is to bring into the fiscal and regulatory fold.
  *   **Merely Fits:** The specific mandate of condoms fits a public health goal but is not strictly required by "legalization" per se (one could legalize and leave safety to contract law). Its inclusion reveals the regime is actually **Regulationism**, not pure Legalization.
  *   **Underdetermination:** A **Public Health Utilitarian** supports this to reduce STIs. A **Bureaucratic Moralist** supports it to contain "vice" within specific zones and ensure tax compliance. Both license the same registration regimes for different ends (health vs. control).

  **Inconsistency Analysis**
  *   **Explicit Inconsistency:** The regime claims to normalize sex work as a profession while simultaneously marking it as exceptional through specific bodily mandates. It asserts the worker is a professional agent (taxpayer) but treats them as a vector of disease (subject to health mandates not applied to other professionals).
  *   **Dissolution:** This dissolves only if one accepts that sex is biologically distinct from other labor. If one rejects that premise, the inconsistency stands: the state grants economic legitimacy while denying bodily autonomy.

  ### 3. The Decriminalization Model (New Zealand): Liberal Autonomy and Border Exception

  **Implicit Commitments**
  Decriminalization presupposes that sex work is **ordinary labor**. It relies on a liberal theory of agency: adults are capable of consenting to exchange sex for money, and the state's role is to ensure the contract is fair and safe, not to judge the morality of the exchange. It treats the employment relation as a private contract subject to general labor laws.

  **The Migrant Exclusion Tension**
  *   **Ordinary Employment Presupposition:** If sex work is ordinary work, access to the labor market should be governed by general immigration and labor laws.
  *   **The Exclusion:** Barring migrant workers on temporary visas reveals a fracture. In most industries, temporary visa holders *can* work (often tied to specific employers). A blanket ban on sex work for this group suggests the state conceives of sex work as a **special category of moral or security risk**.
  *   **Interpretation:** This is likely a border-control concession, but it contradicts the "ordinary work" thesis. It implies that while citizen bodies are autonomous, non-citizen bodies in this industry are uniquely vulnerable to trafficking or uniquely threatening to social order. It reveals that the regime still views sex work as a sphere where the state must control *who* participates, not just *how*.

  **Requires vs. Fits / Underdetermination**
  *   **Strictly Requires:** The repeal of specific offenses (soliciting, brothel-keeping). Decriminalization strictly requires removing sex work from the criminal code.
  *   **Merely Fits:** The application of standard labor law fits the model but is a policy choice.
  *   **Underdetermination:** A **Libertarian** supports this to maximize freedom of contract. A **Labor Unionist** supports it to extend workplace safety protections. They agree on the law but disagree on whether the state should actively enforce labor standards or merely step back.

  **Inconsistency Analysis**
  *   **Explicit Inconsistency:** The claim that sex work is "ordinary work" is logically inconsistent with the migrant exclusion if other industries allow temporary visa holders.
  *   **Defenders' Concession:** Defenders of the New Zealand model often concede this is a genuine tension. They acknowledge it was a political compromise to secure passage of the Act, prioritizing the rights of citizens first to avoid "importing exploitation." They would admit this weakens the philosophical purity of the "ordinary work" claim.

  ### Comparative Evaluation and Position

  **Most Coherent: The Decriminalization Model**
  Despite the tension regarding migrant workers, the Decriminalization model possesses the most coherent set of commitments regarding **harm, agency, and the state**.
  *   **Reasoning:** It aligns its legal structure with its philosophical premise. If one accepts that adults have agency over their bodies (a foundational liberal commitment), then criminalizing the transaction (Nordic) or subjecting it to exceptional health surveillance (Legalization) is inconsistent. Decriminalization treats the worker as a rights-bearer. The migrant exclusion is a flaw, but it is a *contingent* political flaw (a border policy exception) rather than a *constitutive* philosophical flaw. The core logic—that sex work is labor—holds firm for the majority of the population it covers. It minimizes state intrusion into private consent while maximizing state protection of labor rights.

  **Least Coherent: The Legalization/Regulation Model**
  The German/Dutch model is the least coherent.
  *   **Reasoning:** It suffers from a **category error**. It attempts to straddle two incompatible views: that sex work is a legitimate profession (requiring autonomy) and that it is a public health/moral risk (requiring paternalism). By mandating condom use and registering workers individually, it treats sex workers differently from other high-risk professionals (e.g., healthcare workers who manage their own exposure risks, or contractors in dangerous fields). It grants the *status* of work without the *autonomy* of work. It creates a state-managed marketplace that legitimizes exploitation by licensing brothels while claiming to protect workers, often resulting in a two-tier system where the "legal" sector is small and the unregistered sector remains vulnerable. It fails the test of internal consistency: it cannot claim to treat sex work as "work" while imposing bodily mandates it imposes on no other workers.

  **The Nordic Model: A Strong Second in Coherence, but Flawed Premise**
  The Nordic model is internally consistent *if* one accepts its foundational premise: that no woman can truly consent to sell sex under patriarchy. If that premise is accepted, the asymmetry of the law is perfectly logical. However, its coherence relies on a **contested metaphysical claim about agency** (that structural oppression negates individual consent). Compared to Decriminalization, which respects individual agency even when risky, the Nordic model imposes a collective definition of harm over individual testimony. It is coherent, but its coherence is purchased at the cost of denying the agency of the very people it claims to protect.

  **Conclusion**
  The Decriminalization model is superior because it locates harm in **coercion and violence** (which are already criminalized) rather than in the **exchange itself**. It allows the state to target actual wrongs (trafficking, abuse) without creating new wrongs (criminalizing clients or micromanaging workers' bodies). The Legalization model fails by creating a bureaucratic cage; the Nordic model fails by imposing a paternalistic narrative of victimhood. Decriminalization, despite the migrant tension, best reconciles the reality of sex work with the principles of a liberal democracy: that the state should protect citizens from harm, not from their own economic choices.
