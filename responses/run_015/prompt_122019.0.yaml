      *   *Core Premise:* A miracle is a violation of the laws of nature.
      *   *Core Premise:* Laws of nature are established by "firm and unalterable experience" (uniform experience).
      *   *The Weighing Mechanism:* A wise man proportions belief to evidence. When presented with testimony of a miracle, there are two opposing proofs:
          1.  The evidence for the law of nature (uniform experience).
          2.  The evidence for the testimony (human reliability).
      *   *The Conclusion:* Since uniform experience is as close to certain as anything gets, the proof against the miracle is as strong as any argument from experience can be. Therefore, for the testimony to outweigh the uniform experience, the falsehood of the testimony would have to be *more* miraculous than the event itself.
      *   *Clarification:* Hume isn't saying miracles are *metaphysically* impossible (God *could* do it). He is saying they are *epistemologically* inaccessible via testimony. We can never have sufficient rational warrant to believe them based on reports.

  3.  **Address the "Impossible vs. Unbelievable" Distinction:**
      *   This is a classic point of confusion. Hume defines miracles as violations of nature. If nature is defined by uniform experience, a violation is, by definition, contrary to that experience.
      *   *Key nuance:* Hume allows that a miracle *might* happen (he doesn't deny God's power), but he denies that we can ever *know* it happened via testimony. It's an epistemic barrier, not necessarily an ontological one (though some interpreters argue he slides into the latter).
      *   *Phrasing:* Use terms like "epistemic warrant," "ontological possibility," "proof against proof."

