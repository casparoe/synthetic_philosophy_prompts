answer: |-
  ### 1. Exam Question Stem

  **Question 4: The Boundaries of the Subject (Aunt Hillary and the Mound Readout)**

  *Note: No knowledge of Hofstadter's text is required or expected. Answer based on the case description below and the conceptual machinery of the seminar.*

  **Case:** Aunt Hillary is an ant colony capable of complex, slow-scale communication via surface signals. Recent field myrmecology has installed a "Mound Readout" to analyze her internal state. This yields two critical findings:

  *   **Finding One (The Global Variable):** The best predictive model of the colony's behaviour requires positing a single, slow-moving variable representing the colony's nutritional deficit and defensive posture. This quantity is represented nowhere in any individual ant; it is realized in the large-scale chemical gradient of the mound and traffic rates through specific galleries. The colony's decisions are regulated by this variable. It appears to be a colony-level self-model physically realized partly outside the ants.
  *   **Finding Two (Dispensability and Equivalence):** Control is thoroughly decentralized. When myrmecologists destroy the galleries carrying the gradient, the colony's behaviour degrades briefly but recovers within a fortnight via alternative local rules. Furthermore, a neighbouring colony, Aunt Beatrice, whose architecture relies on purely local rules with *no* such integrated global variable, is behaviourally indistinguishable from Aunt Hillary over months (though not over minutes).

  **Prompt:**
  Standard functionalist and intentional-stance arguments often oscillate between claiming the colony is a genuine believer (because it acts like one) and a convenient fiction (because no ant understands anything). Neither claim addresses the structural data above.

  Write an essay arguing which of the two Findings, if either, should determine our verdict on whether Aunt Hillary is a subject of mental states. Your answer must explicitly address: (1) what criterion fixes the boundaries of a single subject rather than many or none; (2) whether realizing a state in the mound's architecture threatens to expand the mind into the ecosystem; (3) whether Aunt Beatrice's functional equivalence over months grants her the same mental status despite lacking the global variable; (4) how to avoid a proliferation of minds (e.g., sub-colonies or wider ecologies); and (5) whether this dispute is substantive or merely verbal once the physical facts are agreed upon.

  *Time: 90 minutes. Word Limit: 1,200 words.*

  ***

  ### 2. Model Answer (750 words)

  **Title: Causal Integration and the Vehicle of Representation**

  The Aunt Hillary case forces a choice between two criteria for mentality: behavioural output (functional equivalence) and causal architecture (structural realization). Finding Two suggests that if the output is identical to a mind (Aunt Beatrice), the system is a mind. Finding One suggests that without a specific internal structure (the global self-model), the system is merely simulating mentality. An "A" level verdict requires recognizing that Finding One carries the argumentative weight because it identifies the *vehicle* of representation, whereas Finding Two only confirms the *utility* of the intentional stance.

  To determine subjecthood, we must adopt a criterion of **causal integration**. A collection of goings-on constitutes one subject only if there is a mechanism that coordinates those goings-on toward a unified end state, mediated by a representation of that state. Finding One provides this: the chemical gradient is not just an emergent byproduct; it is a control variable. It functions as a self-model. Without this, we have only an aggregate of agents (the ants), not a single agent (the colony). Therefore, Finding One is the necessary condition for subjecthood. Finding Two, which shows the variable is dispensable for *survival*, is irrelevant to the metaphysics of *mind*. Robustness does not negate ontology; a human can lose a limb and remain a subject, but the limb's function was part of the original subject's causal power.

  This leads to the realization problem. If the self-model is realized in the mound's architecture, does the mind extend into the dirt? It does, but only insofar as the dirt is part of the causal loop. The boundary of the subject is not the skin (or exoskeleton), but the limit of the control system. If the chemical gradient in the gallery walls is required to sustain the variable, those walls are vehicles of content. However, this does not swallow the ecosystem. The boundary is fixed by **counterfactual dependence**. If removing a rock outside the mound changes the gradient, the rock is part of the mind. If it does not, it is merely environment. In Hillary's case, the Readout specifies the gradient is internal to the gallery system. Thus, the mind includes the mound's structure but stops where the causal regulation stops.

  This distinction resolves the Aunt Beatrice problem. Beatrice is functionally equivalent over months but lacks the global variable. A strict functionalist must grant Beatrice full mental status, rendering Finding One irrelevant. However, this invites the proliferation worry: if output is all that matters, any system that mimics Hillary (including a computer simulation or a vast lookup table) is a mind. To avoid this, we must privilege the *mechanism* of the equivalence. Hillary possesses a self-model; Beatrice possesses a heuristic workaround. Over minutes, they diverge. The fact that they converge over months is a statistical accident of the environment, not a structural identity. To grant Beatrice mentality is to detach mental states from their causal bases, reducing "belief" to a label for predictable behaviour rather than a physical state with explanatory power. Therefore, Hillary is a subject; Beatrice is a zombie equivalent.

  Does this proliferate minds elsewhere? Sub-colonies might admit real-pattern descriptions, but unless they possess their own independent self-models regulating their behaviour against the whole, they are merely subsystems, like organs in a human. The wider ecology lacks the closed causal loop required for a self-model. The criterion of causal integration acts as a filter: real patterns are everywhere, but *subjects* are only where those patterns are causally efficacious in steering the system via self-representation.

  Finally, is this dispute substantive or verbal? If both sides agree on the physical facts (the Readout data), does arguing over "mind" matter? It is substantive because it determines our predictive and explanatory practices. If we treat Hillary as a subject, we predict her behaviour by querying her beliefs (the global variable). If we treat her as an aggregate, we must simulate every ant. The existence of the global variable (Finding One) makes the intentional stance not just convenient, but *efficient* and *causally grounded*. If we ignore Finding One and focus only on Finding Two (output), we lose the explanatory link between the state and the action. Thus, the dispute is not about the word "mind," but about which physical structures warrant the explanatory utility of intentional attribution. Finding One identifies the structure that justifies the stance; Finding Two merely shows that other structures can mimic the results temporarily. Hillary is a mind because she carries the map; Beatrice is not, because she merely follows the terrain.

  ***

  ### 3. Marking Scheme (20 Marks)

  **1. Criterion for Subjecthood (4 marks)**
  *   **Full Marks:** Explicitly defines a boundary condition for subjecthood (e.g., causal integration, unified control, self-modeling) and applies it to distinguish the colony from a mere aggregate.
  *   **Common Error:** Asserting "emergence" or "complexity" as sufficient without explaining *why* these constitute a single subject rather than many interacting ones.

  **2. Realization and Boundaries (4 marks)**
  *   **Full Marks:** Addresses the "mound as vehicle" issue. Argues that the mind extends to the physical vehicles of the representation but is limited by causal dependence (counterfactuals), preventing the "swallowing the ecosystem" reductio.
  *   **Common Error:** Either insisting minds must be skull-bound (ignoring the prompt's data) or accepting that the mind extends indefinitely into the environment without a stopping condition.

  **3. Verdict on Aunt Beatrice (4 marks)**
  *   **Full Marks:** Takes a clear stance on whether functional equivalence suffices. If arguing "No," identifies the lack of the global variable/self-model as the mentality-constituting difference, explaining why this isn't ad hoc (e.g., stability, explanatory power).
  *   **Common Error:** Dismissing Beatrice solely on intuition ("she feels different") or granting her equality without addressing why Finding One mattered for Hillary.

  **4. Proliferation Worry (4 marks)**
  *   **Full Marks:** Explains why sub-systems or ecologies don't count as separate minds despite having "real patterns." Uses the chosen criterion (e.g., independent control loops) to filter out false positives.
  *   **Common Error:** Ignoring the worry or claiming sub-colonies *are* minds, thereby trivializing the concept of individual subjecthood.

  **5. Meta-Level/Substantive Dispute (4 marks)**
  *   **Full Marks:** Addresses whether the debate is verbal. Argues that attributing mentality tracks specific causal/explanatory utilities (predictive efficiency) rather than just linguistic convention.
  *   **Common Error:** Concluding the dispute is "just verbal" or "depends on definition" without analyzing the consequences for explanation and prediction.

  ***

  ### 4. Diagnosis: The "B" Cap

  **Why polished answers cap at a B:**
  The B-level student treats the Mound Readout findings as **illustrations** rather than **constraints**. They enter the exam having already decided that "functionalism is true" or "phenomenology is required." They then use Finding One to support their view if they are realists, or Finding Two to support their view if they are sceptics, without allowing the tension between the two findings to stress-test their theory.

  Specifically, they fail to weigh the **argumentative weight** of the findings against each other. They will say, "Finding One shows representation, but Finding Two shows it's not necessary," and then conclude, "Therefore, it's complicated." The A student recognizes that Finding One and Finding Two are in competition for the definition of the *vehicle* of content, and makes a decisive choice about which physical fact anchors the metaphysics, rather than using the facts to decorate a pre-existing conclusion. The B student preserves their prior view; the A student risks it against the case.
