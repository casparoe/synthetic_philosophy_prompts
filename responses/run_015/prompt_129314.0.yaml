answer: |-
  Your diagnosis is correct: the argument shifts illicitly between steps (2) and (5). You have identified a genuine tension in Augustine, but your argument resolves it by flattening Augustine's moral psychology in a way he would reject.

  Here is the diagnosis of the argument, followed by answers to your specific checks.

  ### 1. The Diagnosis: Step (2) and the "Object of the Will"

  **Reject Step (2).**
  > *(2) A will is individuated by what it is a will that. Two acts whose wills have the same object are, in respect of the will, the same act...*

  This step looks sound because it adopts a consequentialist or purely intentionalist view of moral individuation: if the *end state of the world* (the pursuer's false belief) is identical, the moral act is identical.

  Augustine rejects this. For Augustine (and the scholastic tradition he inaugurates), the "object of the will" (*objectum voluntatis*) is not merely the *outcome* (the deception), but the **outcome-as-achieved-by-specific-means**. The moral species of an act is determined by the *end*, the *object*, and the *circumstances*. Crucially, the "object" includes the specific faculty being employed.

  *   **In Case (4) (The False Assertion):** The will's object is "to deceive *by means of betraying the social bond of language*."
  *   **In Case (7) (The Decoy/Silence):** The will's object is "to deceive *by means of withholding signs or manipulating non-linguistic cues*."

  For Augustine, these are not the "same act in respect of the will." They are different acts because they engage different human faculties with different natural ends.
  *   The natural end of **speech** is the communication of mind to mind. To use it against this end is a sin against the nature of the faculty (and thus against God, the author of nature).
  *   The natural end of **silence** or **action** is not necessarily communication. Withholding information is not a betrayal of the communicative covenant because no covenant was entered by remaining silent.

  **Why it looked sound:** It looks sound because we often colloquially equate "lying" with "intentional deception." Your argument successfully proves that *Deception* cannot be the sole criterion for *Lying* in Augustine's system. But Augustine never claimed it was. He claims *Lying* is a specific subset of *Deception*—one that involves the *enuntiatio* (utterance) of what is not in the heart.

  ### 2. Repairing the Tension: A, B, and C

  You asked which of A, B, or C is least costly to give up. You do not need to give up any of them, provided you refine **A** to block Step (2).

  **The Repair:**
  Modify your reading of **A**. It is not merely "willing that the hearer take the utterance to express the speaker's mind." It is:
  > **A*:** A lie is an utterance in which the speaker **betrays the heart-tongue unity** with the will to deceive.

  This preserves **B** (Absolutism) because the betrayal of the heart-tongue unity is always a disorder, regardless of consequences.
  This preserves **C** (Permissions) because silence and decoys do not involve the heart-tongue unity; there is no "tongue" (utterance) to betray the "heart."

  **Can a prohibition located in assertion still be absolute?**
  Yes. If the sin is located in the *abuse of the faculty of signification*, the ban can be absolute because that faculty is never ordained for abuse. The fact that the *aim* (misleading) is permissible via other means does not make it permissible via *this* means.
  *   *Analogy:* I may permissible kill an aggressor in self-defense (using force). I may not permissible kill an aggressor by poisoning the city water supply (using public trust). The end (stopping the aggressor) is the same; the means determine the moral licitness. For Augustine, Language is a public trust akin to the water supply.

  ### 3. The Intended/Foreseen Distinction (Step 9)

  > *Is the intended-versus-foreseen distinction in (9) one Augustine can help himself to, or is it anachronistic?*

  It is **not anachronistic**, but it is not the full-blown Doctrine of Double Effect (DDE) found in Aquinas or later casuistry. Augustine distinguishes between **willing the deception** (which is always sinful in the heart, even if not a lie) and **willing the lie** (which is sinful in act).

  In *De Mendacio*, Augustine argues that while we may *foresee* that our silence will deceive, we do not *assert* the falsehood. However, he is wary of the "will to deceive." In *Contra Mendacium*, he admits that even in silence, if the *sole* motive is malicious deception, there is a sin of *cupiditas* (lust/desire), even if it is not the sin of *mendacium* (lying).
  *   **Correction to your Step (9):** Augustine would not say the silence is a *lie*. He might say the *malice* in the silence is a sin, but a different, lesser sin than lying. However, if the silence is motivated by charity (saving the fugitive), the deception is a side-effect of a good act (concealment), not the object of the act. This distinction allows C to stand without collapsing into B.

  ### 4. Check 1: The "True Lie" (Belief False, Fact True)

  > *The case of someone who says what she believes to be false but which is in fact true... if your account holds that this is a lie, say why the failure of the deception makes no difference.*

  Your repaired account **must** hold this is a lie. Augustine is explicit on this (*De Mendacio* 3.3).
  *   **Why:** Because the disorder is in the **speaker's soul**, not the world. The sin is the *duplicitas cordis* (duplicity of heart). The speaker has severed the connection between their mind and their voice.
  *   **Why deception failure doesn't matter:** The moral injury is the self-inflicted wound of becoming a person whose words do not match their thoughts. The external success of the deception is accidental to the internal vice. This confirms that the locus of the sin is the **assertion/will nexus**, not the **outcome**.

  ### 5. Check 2: The Scriptural Deceivers (Midwives, Rahab)

  > *Tell me whether that move survives the diagnosis you give, or whether it is the first thing that has to go.*

  The move **survives**, but only if you maintain the distinction between the *act* and the *reward*.
  Augustine's exegesis (*Contra Mendacium* 15.32) is that God rewarded the **mercy** (the benevolent will to save life) but did not endorse the **lie** (the means used).
  *   **If you accept the diagnosis:** The midwives *lied* (violated A*). This was a sin. However, they also acted out of *caritas* (charity). God rewarded the *caritas*. The sin remained, but was not imputed for condemnation in that moment due to the overriding mercy, or perhaps they were punished for the lie in ways Scripture doesn't record (Augustine hedges here).
  *   **If you reject the diagnosis (and say it wasn't a lie):** You lose Augustine's specific theological point. Augustine *wants* it to be a lie. He wants to show that even holy people sin, and that God's grace covers the sin while rewarding the good intention. If you redefine the act so it isn't a lie, you turn Augustine into a casuist who says "It's only a lie if it's mean." Augustine's rigorism is precisely that **it is a lie even if it is kind.**

  ### Summary of the Repair

  Your argument runs "past what you wanted" because Step (2) assumes that the **moral identity of an act is determined solely by its intended outcome**. Augustine holds that the **moral identity is determined by the conformity of the act to the natural end of the faculty employed.**

  *   **Faculty:** Speech. **Natural End:** Signification of Mind. **Act:** Signifying contrary to Mind. **Verdict:** Sin (Lie).
  *   **Faculty:** Silence/Action. **Natural End:** Variable (Prudence/Safety). **Act:** Withholding Signification. **Verdict:** Permissible (if motivated by Charity).

  You can keep B (Absolutism on Lying) and C (Permissions on Silence) by refining A to specify that the "will to deceive" must be **embodied in the betrayal of signification**. This locates the absolute prohibition in the **abuse of the communicative covenant**, which remains absolute even if the *goal* of deception is sometimes achievable by other, non-covenantal means.

  This preserves Augustine's core insight: Lying is not wrong because it causes error; it is wrong because it breaks the bond of human society (*societas humana*) which is founded on trust in signs. Silence does not break that bond; it merely declines to extend it.
