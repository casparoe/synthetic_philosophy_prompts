answer: |-
  There is a single principle that reconciles almost all of your verdicts, but it will require you to refine your intuition about the professorship case.

  The principle is **The Distinction Between Sufficiency and Optimization.**

  *   **Sortition is legitimate when the role requires only *sufficiency* (a threshold of competence) or *representation* (mirroring a population).** In these cases, candidates are functionally interchangeable once the threshold is met.
  *   **Sortition is illegitimate when the role requires *optimization* (maximizing variable merit) or *accountability* (answerability for choices).** In these cases, candidates are not interchangeable; distinctions between them matter fundamentally.

  Here is how this principle maps onto your list, where it forces a change in your thinking, and what it implies for your qualified-pool dilemma.

  ### 1. How the Principle Explains Your Verdicts

  **The "Fine" List (Sufficiency & Representation)**
  *   **Dishes/Minutes:** The role requires only *sufficiency* (any roommate can do it). No optimization is needed.
  *   **Kidneys/School Places:** The resource is scarce, but the claimants have equal moral need. The goal is fair allocation among *sufficient* claimants, not finding the "best" patient.
  *   **Juries:** The goal is *representation* (a jury of peers), not optimization (a jury of legal experts). Any citizen is sufficiently interchangeable for this purpose.
  *   **Conscription:** This is allocating a *burden* among those who meet the *sufficiency* threshold (fitness/age). We need enough soldiers, not necessarily the "best" ones selected by meritocracy (which would be unfair).
  *   **Tax Audits:** This is about fair distribution of scrutiny among the *sufficient* pool (taxpayers), not finding the "worst" taxpayer.
  *   **Veto Chamber:** You like this because its function is *representation* (checking the legislature via public sentiment), not *governance* (optimizing policy).

  **The "Not Fine" List (Optimization & Accountability)**
  *   **Whole Legislature:** This requires *accountability*. Voters need to be able to fire representatives. Sortition breaks the chain of accountability. It also implies *optimization* of leadership, which lots cannot guarantee.
  *   **Lawyers Striking Jurors:** This corrupts the *representation* function. It turns a representative sample into an optimized (biased) one.
  *   **Flawed Citizens' Assembly:** This fails the *representation* test. Because of self-selection bias, the pool is no longer interchangeable with the populace. It claims to represent but does not.

  ### 2. The Verdict You Must Drop (or Refine)

  **The Professorship Case.**
  Your intuition says: *Even if rated equal, a lottery feels like refusing to make a judgement.*
  The Principle says: *If they are truly equal, a lottery is the only fair option.*

  This creates a conflict. To resolve it, the principle forces you to admit one of two things:
  1.  **They are not actually equal.** In high-stakes optimization roles (like a professorship), "exact equality" is effectively impossible. There is always some fit, potential, or nuance that distinguishes candidates. Therefore, using a lottery is indeed an abdication of the duty to optimize.
  2.  **If they are truly equal, the lottery is right.** If the search committee has exhaustively determined there is *no relevant difference*, then treating them differently is arbitrary anyway.

  **The Adjustment:** You must drop the idea that the *lottery* is the problem in the professorship case. The problem is the **claim of equality**. In optimization roles, claiming candidates are interchangeable is usually an error (or laziness). If you accept that they are *genuinely* interchangeable, you must accept the lottery. If you reject the lottery, you must insist the committee look harder for the asymmetry.

  ### 3. The Qualified-Pool Case

  This is the crux of your uncertainty. *Is it legitimate to fill a role by lot from among everyone who passed a competence threshold?*

  The Principle of Sufficiency vs. Optimization gives a conditional answer: **It depends on the nature of the role, not just the pool.**

  *   **Legitimate (Sufficiency Roles):** If the role is to perform a defined task where "good enough" is the goal, the lottery is legitimate.
      *   *Example:* Rotating shift supervisor among senior staff. Everyone is competent; the burden/benefit of leadership should be shared.
      *   *Example:* A judge selected from a bar of qualified lawyers (if the goal is to prevent political bias rather than find the "best" legal mind).
  *   **Illegitimate (Optimization Roles):** If the role is to provide leadership, vision, or excellence where "the best" is the goal, the lottery is illegitimate, even among the qualified.
      *   *Example:* A CEO, a Head of Department, or a Tenure-Track Professor. Passing the threshold makes you *eligible*, but it does not make you *interchangeable*. We hire professors not just to be competent, but to be exceptional.

  ### Summary of the Rule

  **Sortition is legitimate when the goal is to distribute burdens/benefits fairly among equals, or to sample a population for representation. It is illegitimate when the goal is to select for variable excellence or political accountability.**

  *   **Why Conscription is Fine:** It distributes a burden among equals (Sufficiency).
  *   **Why Legislature is Not Fine:** It selects for accountability and leadership (Optimization).
  *   **Why Juries are Fine:** They sample the population (Representation).
  *   **Why Professorship is Not Fine:** It selects for excellence (Optimization). The "rated equal" claim is likely false; if it were true, the lottery would be acceptable.
  *   **Why Qualified-Pool is Ambivalent:** It is legitimate for *service* roles (Sufficiency) but illegitimate for *leadership* roles (Optimization).

  Your gut isn't inconsistent; it is correctly detecting whether the specific role demands **fairness** (use a lot) or **excellence** (use a search). The confusion arises only when we pretend a role requires excellence but then claim the candidates are identical.
