answer: |-
  In this passage, **matter** is the substrate capable of receiving determination, while **form** is that determination or essence itself. **Potentiality** is the capacity to be determined, and **actuality** is the realized state of being determined. Aristotle uses these terms to address the problem of unity: if a substance comprises matter and form, what binds them into one thing rather than a heap?

  Aristotle argues the difficulty arises from treating matter and form as separate components requiring a glue. The "round bronze" example illustrates that asking what unites them is absurd; "round bronze" is simply bronze actualized as round. The matter is potentially the thing; the form is actually the thing. They are not two parts making a third, but one substance described differently. The qualifier "**proximate**" is crucial. Remote matter (e.g., earth) is not immediately ready to become a man; proximate matter (e.g., flesh) is. If dropped, the unity fails because the matter would not be specific enough to receive the form without further explanation. The hedge "**in a sense**" preserves the conceptual distinction without ontological separation. If dropped, claiming they are simply one erases the possibility of change; claiming they are simply two destroys the unity. Aristotle is not offering a causal account of glue but **deflecting the question** as ill-posed. He dissolves the problem by showing matter and form are not distinct entities needing unification, but potential and actual aspects of a single reality.

  **Case One** presents a lump and figure with identical persistence conditions. Aristotle's vocabulary maintains a distinction in **manner of description**, not **number of things**. Even if the clay and figure begin and end together, the clay is defined by its capacity to be shaped (potentiality), while the figure is defined by being shaped (actuality). They are numerically one substance. The distinction lies in the *logos* (account): one describes the capacity, the other the fulfillment. Aristotle would deny there are two objects here; there is one object viewed under the aspect of its material capacity versus its formal realization. The potential/actual distinction marks ontological status, not separate inventory items.

  **Case Two** involves an artwork defined by shapelessness (*Untitled (Heap)*). Here, the framework strains. Aristotle typically assumes form is a positive determination. If the artwork's essence is "being a heap," then "heap-ness" functions as the form. Sculpting imposes a new form, destroying the old actuality while the matter persists. However, Aristotle often classifies heaps as mere collections of matter lacking true unity. If the artwork is truly just a heap, it risks collapsing into mere matter without form, which Aristotle claims lacks essential unity. The framework has room only if "lack of shape" is treated as a determinate essence (a privation functioning as form). If the form must be a positive structure, the framework runs out: it cannot easily accommodate a substance whose actuality is the absence of determination. It assumes form is the governing, positive side; a negative form challenges the hierarchy where actuality perfects potentiality.

  **Consequence:** If unity depends on the cause initiating development, origin matters. A figure produced by erosion lacks the intentional actualization of the clay's potential. For Aristotle, artifacts derive unity from the artisan's mind imposing form on matter. Erosion produces a shape accidentally, not essentially. The matter was not potentially *that* statue in a teleological sense. Thus, a geometrically identical figure made by erosion possesses only **accidental unity**, whereas the sculpted figure possesses **artifactual unity**. The former is a coincidence of matter; the latter is a realized essence. The framework dictates that without the efficient cause guiding the potential to actuality, there is no true generation of a unified substance, only a rearrangement of matter. Therefore, the route of production determines the kind of unity: essential unity requires the proper actualization of potential, which accidental processes do not provide.
