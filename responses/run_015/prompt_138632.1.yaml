answer: |-
  The ice in Leo's glass had melted completely. Sarah's martini was still cold.

  **Leo:** Owen's a locked safe. You're holding a key that doesn't fit the tumblers.

  **Sarah:** The lock is broken. The key still opens the door it *should* open.

  **Leo:** There is no door. Look, plain English: on my view, saying Owen has a reason to confess is like saying he has a reason to fly by flapping his arms. It's not just hard; it's structurally impossible given who he is.

  **Sarah:** Plain English: on my view, saying he has a reason is like saying he has a reason not to drink poison. It's true whether he wants to live or not.

  **Leo:** But Owen's psychology has a specific trapdoor. Clause One. If you tell him "you ought," he stops listening. So if you walk up to him and say, "Owen, you have a reason to confess," you trigger the block. Your own speech act destroys the route.

  **Sarah:** I concede that telling him won't work. I can't guide him deliberatively. But that's about his psychology, not the reason.

  **Leo:** That's a costly concession. You're admitting external reasons can't do the job of reasons, which is to guide action.

  **Sarah:** They justify blame. That's the job you're ignoring. If he lets Mara take the fall, he's blameworthy. If you're right, and there's no reason, what's he guilty of? Ignoring a ghost?

  **Leo:** He's guilty of being the sort of person who doesn't care about Mara. I'll concede Owen is morally rotten. He's arranged himself to be unreachable. But blame doesn't require a reason he could have acted on. It just requires that he's awful.

  **Sarah:** That severs the link between blame and rationality. You're saying we can blame him for ignoring a consideration that wasn't even a consideration for him.

  **Leo:** I'm saying he has a reason to *become* the sort of person who would have a reason to confess. But those don't add up. You can't borrow reason from your future self.

  **Sarah:** Why not? If he has a reason to reform, and reforming gives him a reason to confess, the pressure is already there. It's hovering.

  **Leo:** Hovering where? Not in his motivational set. Not in the world. It's a reason for a ghost Owen who doesn't exist.

  **Sarah:** It's in the facts. Mara shouldn't suffer for his mistake. That fact is a reason regardless of his set.

  **Leo:** But you can't use it. You admitted that. You can't tell him. You can't help him find it. So what work is it doing? Justifying your resentment?

  **Sarah:** Yes. Keeping the standard alive. If I say "no reason," I let him off the hook.

  **Leo:** You let him off the hook of rationality, not morality. He's still a jerk. But calling it a "reason" pretends there's a bridge where there's a cliff.

  **Sarah:** You're protecting him. By saying "he couldn't have done it," you make his psychology a veto on truth.

  **Leo:** I'm protecting the concept of reasons. If it doesn't connect to motivation, it's not a reason. It's a sermon.

  **Sarah:** And if it only connects to motivation, it's just psychology. We're done.

  **Leo:** We're done. Drink your martini.

  **Sarah:** It's warm now. Like your conscience.

  \answer{internalist}
  The internalist forced the externalist to concede that her "reason" could not guide deliberation or communicate successfully, undermining the practical function of reasons in this specific case.
