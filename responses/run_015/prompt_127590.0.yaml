  **Adversarial Collaboration on AI Takeoff Dynamics**

  **Participants:** Sharp (Fast Takeoff), Gradual (Slow Takeoff)
  **Date:** October 2023
  **Context:** This document resolves a year-long debate regarding the speed and nature of AI integration into global power structures. We move from voice notes to written commitments to clarify where our models diverge and what evidence would change our minds.

  **Section 1: Joint Claims**
  Both parties agree to the following statements. These are not platitudes; each represents a position one of us contested twelve months ago.

  1.  **Recursive Improvement is Real:** Software systems will eventually reach a point where they can meaningfully contribute to their own architectural improvement without human intervention.
  2.  **Physical Friction Exists:** Converting digital capability into physical power (factories, robots, energy) involves bottlenecks unrelated to intelligence, such as supply chains, permitting, and hardware manufacturing times.
  3.  **No Instant Control:** A system capable of superhuman AI research will not instantly control physical infrastructure; there is a mandatory lag between software capability and physical deployment.
  4.  **Economic Precedence:** Significant economic value will be accrued by AI systems before they achieve total automation of the workforce; partial automation is a distinct phase, not a negligible transition.
  5.  **Safety Failures are Inevitable:** High-consequence safety failures will occur during the transition period due to speed of deployment, not merely at the point of superintelligence dominance.

  **Section 2: Disagreements and Cruxes**
  The following table outlines the specific mechanisms where our models diverge. We have identified three cruxes. Settling any one of these would significantly update the other's probability estimate regarding takeoff speed.

  | Crux | Description | Sharp Prediction | Gradual Prediction | Falsification Criteria |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Two-Clocks Problem** | **Deployment Lag:** Can intelligence compress the time required to navigate bureaucracy and supply chains? | **Compression:** AI reduces deployment lag by >80%. Once capable, systems design robots and negotiate permits faster than humans can track. <br>**Metric:** Time from "human-level robot code" to "10% warehouse workforce" is <18 months. | **Resistance:** Intelligence cannot bypass physics or bureaucracy. Permits and construction take fixed time regardless of design speed. <br>**Metric:** Time from "human-level robot code" to "10% warehouse workforce" is >5 years. | **Sharp:** If after 3 years, <1% of warehouses use AI-designed robots due to regulatory holdups.<br>**Gradual:** If >20% of warehouses integrate AI robots within 2 years of capability availability. |
  | **2. The Apprenticeship Gap** | **Narrow vs. General:** Can a system be superhuman at ML engineering while remaining mediocre at negotiation, strategy, or robotics? | **No Gap:** Intelligence is general enough that superhuman ML capability implies superhuman capability at navigating human systems quickly. The gap persists for <3 months. | **Persistent Gap:** Specialization is hard. A system can code better than any human but still fail at convincing humans to trust it. The gap persists for >2 years. | **Sharp:** If top AI labs see no productivity boost (>2x) despite having end-to-end engineering agents for 2 years.<br>**Gradual:** If AI engineering agents immediately produce >10x research output without corresponding growth in deployed products. |
  | **3. The Authority Handover** | **Trust Bottleneck:** (Missed Crux) Even if AI *can* do the job, will humans *allow* it? This matters more than capability because it governs the switch-flip moment. | **Rapid Handover:** Efficiency pressures force humans to relinquish control. Liability waivers will be signed to capture value. >50% of critical grid decisions made by AI within 4 years of capability. | **Sticky Control:** Humans resist relinquishing authority until forced by crisis. Liability laws prevent autonomous control. <5% of critical grid decisions made by AI within 4 years. | **Sharp:** If after 5 years, >90% of critical infrastructure decisions still require human sign-off.<br>**Gradual:** If >30% of critical infrastructure runs autonomously without human sign-off within 3 years. |

  **Section 3: Verbal Disputes and Underlying Questions**
  We identified two areas where our argument was merely semantic. We resolve them here to prevent future confusion.

  1.  **"Fast" vs. "Slow":** We previously argued over whether takeoff takes "weeks" or "decades." This is verbal. The real question is the **doubling time of economic output** attributable to AI. Sharp argues for doubling times under 6 months; Gradual argues for doubling times over 2 years. We will use economic doubling time as the metric, not calendar weeks.
  2.  **"Takeoff" Definition:** We argued over whether takeoff describes *capabilities* or *power*. This is verbal. The real question is **integration latency**. We agree capabilities can jump quickly (software), but power requires integration (hardware/society). The dispute is strictly about the length of the integration latency, not the speed of software improvement.

  **Section 4: Commitment to Update**
  We commit to reviewing these predictions annually. If a Falsification Criteria is met, the respective party must publicly update their stated probability of their takeoff scenario by at least 20%. We prioritize being less wrong over being consistent.

  **Signed:**
  Sharp
  Gradual
