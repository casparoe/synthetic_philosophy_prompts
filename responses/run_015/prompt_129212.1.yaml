  ### Decision-Tree Taxonomy of Deflationary and Adjacent Truth Positions

  **Root Node:** Does the predicate "is true" contribute any substantive explanatory power to an account of assertion, belief-fixation, or semantic content (e.g., explaining why successful assertions correlate with reality)?
  *   **Yes:** *Inflationary/Robust Realism* (Correspondence, Coherence, Pragmatic Theories). [Exit Tree]
  *   **No:** *Deflationary/Adjacent Cluster*. [Proceed to Node 1]

  ---

  **Node 1 (Blind Ascriptions):** To account for blind ascriptions (e.g., "Everything the oracle said is true" without listing claims), must we posit that "truth" is a genuine property (however lightweight) shared by the propositions, or is "is true" exhausted by its function as a logical device or speech act?
  *   **Posits a Genuine Property:** *Proceed to Leaf A.*
  *   **Exhausted by Logical Device/Speech Act:** *Proceed to Node 2.*

  **Node 2 (The Liar Paradox):** When the Equivalence Schema ($p \iff \text{'p' is true}$) generates the Liar Paradox, is the fault located in the *logic/schema* (requiring restriction to maintain consistency) or in the *sentence's status* (rendering it non-assertoric, anaphorically void, or pragmatically defective)?
  *   **Fault in Logic/Schema (Requires Restriction):** *Proceed to Node 3.*
  *   **Fault in Sentence Status (Defective/ Void):** *Proceed to Node 3 (Alternative Branch).*

  **Node 3 (Domain Uniformity):** Does the deflationary analysis apply identically across empirical, moral, and aesthetic judgments, or are there domain-specific restrictions on when "true" functions as a disquotational device versus a distinct type of endorsement?
  *   **Identical Application (Strict Uniformity):** *Proceed to Leaves.*
  *   **Domain-Specific Restrictions (Variable Aptitude):** *Proceed to Leaves.*

  ---

  ### Taxonomy Leaves

  #### Leaf A: Horwich-Style Minimalism
  *   **Path:** Root (No) → Node 1 (Posits Property) → [Liar/Domain branches bypassed as property commitment is decisive].
  *   **Commitment:** Truth is a genuine, logical property defined solely by our acceptance of the Equivalence Schema instances.
  *   **Awkward Commitment:** Must maintain that truth is a *property* that explains nothing, forcing a distinction between "having a property" and "playing an explanatory role" that many critics find verbally sleight-of-hand.

  #### Leaf B: Ramsey-Style Redundancy Theory
  *   **Path:** Root (No) → Node 1 (Logical Device) → Node 2 (Logic/Schema Restriction) → Node 3 (Strict Uniformity).
  *   **Commitment:** "Is true" is logically redundant; blind ascriptions are infinite conjunctions, and the Liar is a logical glitch requiring schema restriction.
  *   **Awkward Commitment:** Must analyze "Everything he said is true" as an infinite conjunction, which fails when the speaker cannot enumerate the oracle's specific claims (the "finite mind" problem).

  #### Leaf C: Unnamed Hybrid (Domain-Restricted Deflationism)
  *   **Path:** Root (No) → Node 1 (Logical Device) → Node 2 (Logic/Schema Restriction) → Node 3 (Domain-Specific Restrictions).
  *   **Commitment:** "Is true" is a logical device in empirical domains but functions as a distinct normative endorsement in moral/aesthetic domains.
  *   **Awkward Commitment:** Must explain why the logical syntax of "true" remains identical across domains while its semantic function shifts, without sliding back into a robust pluralist realism for the moral domain.

  #### Leaf D: Grover-Style Prosententialism
  *   **Path:** Root (No) → Node 1 (Logical Device) → Node 2 (Sentence Status Defect) → Node 3 (Strict Uniformity).
  *   **Commitment:** "Is true" is part of a prosentence (like a pronoun) inheriting content anaphorically; the Liar fails because the anaphoric reference is empty.
  *   **Awkward Commitment:** Must treat ordinary assertions like "That is true" as grammatically misleading prosentences, requiring a revisionary analysis of standard subject-predicate syntax.

  #### Leaf E: Strawsonian Performative Endorsement
  *   **Path:** Root (No) → Node 1 (Speech Act) → Node 2 (Sentence Status Defect) → Node 3 (Domain-Specific Restrictions).
  *   **Commitment:** "Is true" performs an act of endorsement rather than describing a proposition; the Liar is a spurious question because no statement was made to endorse.
  *   **Awkward Commitment:** Must deny that Liar sentences express propositions at all, implying that competent speakers can utter grammatically perfect sentences that fail to make any claim whatsoever.

  ---

  ### Overlap and Gap Analysis

  **Indistinguishable Positions:**
  **Grover-Style Prosententialism** and **Strawsonian Performative Endorsement** cannot be cleanly separated by the **Liar-Paradox Branch (Node 2)** alone. Both locate the fault in the sentence's status (anaphoric void vs. performative failure) rather than the logic.
  *   **Diagnosis:** This reflects **logical overlap**. Both views agree the Liar is not a genuine paradox of logic but a misuse of language. The distinction relies on the *mechanism* of the defect (syntax vs. pragmatics), which Node 2 collapses into "Status Defect." They are only separable at Node 3 if one insists Strawson allows domain variance while Grover does not, but this is a contingent rather than necessary difference.

  **Unoccupied Combinations:**
  1.  **Property + Sentence Status Defect:** A view that posits truth as a genuine property (Node 1: Yes) but claims Liar sentences lack truth-aptitude (Node 2: Status Defect).
      *   **Diagnosis:** **Incoherent.** If truth is a property possessed by propositions, a sentence failing to express a proposition cannot be evaluated for that property; however, positing the property usually entails the schema applies to all propositions, making the "status defect" a rejection of the property's scope rather than a consistent combination.
  2.  **Logical Device + Schema Restriction + Domain Restrictions:** (Occupied by Leaf C, the Hybrid).
  3.  **Logical Device + Status Defect + Domain Restrictions:** (Occupied by Leaf E, Strawson).
  4.  **Property + Schema Restriction + Domain Restrictions:**
      *   **Diagnosis:** **Genuinely Open (but non-deflationary).** This describes a *Robust Pluralist Realism* (e.g., Lynch or Wright), where truth is a substantive property that varies by domain. It is unoccupied in *this* tree only because the Root Node filters it out as inflationary.

  ---

  ### Confidence and Diagnostic Conclusion

  I am **moderately confident** in this mapping, particularly regarding the separation of **Horwich-Style Minimalism** from the other deflationary views at Node 1. The commitment to truth as a "property" (even a minimal one) is the clearest fault line separating Minimalism from Redundancy or Prosententialism.

  However, I am **less confident** that **Prosententialism (Grover)** and **Minimalism (Horwich)** can be separated on the **Liar-Paradox Branch (Node 2)** alone without ambiguity. While Horwich typically restricts the Equivalence Schema (Logic fault) and Grover cites anaphoric failure (Status fault), Horwich's restriction is often motivated by the claim that the Liar does not express a *genuine proposition* in the relevant sense, which converges with Grover's "status defect." The distinction relies on whether one views the restriction as a patch on the *logic* (Horwich) or a diagnosis of the *grammar* (Grover), a boundary that is often blurred in practice.

  **Least Secure Distinction:** The single point in the taxonomy where the distinction is least secure is **Node 2 (The Liar Paradox)** when distinguishing between **Schema Restriction** (Ramsey/Horwich) and **Sentence Status Defect** (Grover/Strawson). Many deflationists argue that restricting the schema *just is* a way of marking the sentence as defective, making these two answers potentially descriptive variants of the same underlying move rather than genuinely divergent philosophical commitments.
