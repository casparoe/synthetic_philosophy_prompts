answer: |-
  **Joint Statement on Perceptual Timing and the Color Phi Phenomenon**

  **I. Agreed Claims**

  1.  **Stimulus Structure:** In the color phi phenomenon, a red stimulus at location A is followed rapidly (ISI < 200ms) by a green stimulus at location B. No stimulus occurs between A and B.
  2.  **Standard Report:** Subjects consistently report a single object moving smoothly from A to B, changing color mid-trajectory. Subjects deny seeing stationary dots or a jump.
  3.  **Explanatory Burden:** Both accounts must explain how information from the second stimulus (time *t2*) influences the characterization of the first interval (time *t1*) in the subject's report.
  4.  **Phenomenal Authority:** Both sides agree the subject's report is veridical regarding their *current* phenomenology at the time of reporting. The dispute concerns the causal history and temporal dating of that phenomenology.
  5.  **Dating Problem:** Both sides acknowledge the "problem of dating": there is no obvious internal clock stamping experiences with objective times. Any account must specify what fixes the apparent temporal order of experience.

  **II. Disagreements and Cruxes**

  | Issue | Orwellian Camp | Stalinesque Camp | Crux & Probe | Predictions (Orwellian / Stalinesque) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Core Disagreement** | Experience is initially veridical but overwritten in memory before report. | Experience is constructed/edited prior to entering consciousness. | **Timing of Construction:** Does conscious experience precede memory consolidation?<br>**Probe:** Neural correlates of consciousness (NCC) latency vs. report latency. | **O:** NCC shows early veridical spike later suppressed.<br>**S:** NCC shows only revised signal; no early spike. |
  | **Fact of Matter** | There is a fact about experience timing independent of report. | Experience timing is constituted by functional availability for report. | **Independence:** Is there a private timeline distinct from functional access?<br>**Probe:** Cases where report is blocked but priming suggests revised content. | **O:** Priming shows original content (hidden history).<br>**S:** Priming shows revised content (no hidden history). |
  | **Nature of Overwrite** | Memory revision changes the *record* of the mind, not the mind's past state. | Memory revision reflects the *actual* past state of the mind. | **Metaphysics:** Is memory constitutive of experience?<br>**Probe:** Introspective confidence in temporal ordering under cognitive load. | **O:** Confidence degrades; original trace remains inaccessible.<br>**S:** Confidence tracks construction time; no original trace exists. |
  | **Substantive vs. Verbal** | The distinction tracks real causal differences in processing streams. | The distinction is verbal if no functional difference exists (Dennett's Challenge). | **Empirical Cash Value:** Can the models be dissociated empirically?<br>**Probe:** Search for a "Cartesian Theater" locus of revision. | **O:** Distinct storage sites exist (experience vs. memory).<br>**S:** No single locus found; distinction collapses into functionalism. |

  **III. Arbiter's Note on Verbal Dispute**

  We acknowledge a meta-dispute regarding the substantive nature of our divergence. The Stalinesque camp contends that if no empirical probe distinguishes the causal histories (as Dennett argues), the dispute is merely verbal regarding the label "experience." The Orwellian camp denies this conditional, maintaining that distinct causal mechanisms (perception vs. memory) exist even if currently indistinguishable. Settlement of the "Empirical Cash Value" crux above will determine if the dispute dissolves into terminological preference or remains a substantive claim about cognitive architecture.

  **Signed,**
  *The Orwellian Working Group*
  *The Stalinesque Working Group*
