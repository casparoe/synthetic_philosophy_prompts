  ### 1. Numerical Example Setup

  **Scores and Threshold:**
  Defendants receive a risk score $s \in \{1, 2, 3, 4\}$.
  *   **Release:** $s \in \{1, 2\}$.
  *   **Detain:** $s \in \{3, 4\}$.
  *   **Threshold:** Detain if $s \ge 3$.

  **Groups:**
  Two groups, A and B, each with $N=200$ defendants.

  **Observed Data (Fixed for both Completions):**
  The observed data consists of the score distribution and the outcomes $Y$ for released defendants ($s \in \{1, 2\}$). Outcomes for detained defendants are unobserved.

  | Group | Score $s$ | Count | Observed $Y=1$ (Rearrest) | Observed $Y=0$ | Observed Risk $P(Y=1|s)$ | Decision |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **A** | 1 | 50 | 5 | 45 | 0.10 | Release |
  | **A** | 2 | 50 | 15 | 35 | 0.30 | Release |
  | **A** | 3 | 50 | *?* | *?* | *?* | **Detain** |
  | **A** | 4 | 50 | *?* | *?* | *?* | **Detain** |
  | **Total A** | | **200** | **20 (FN)** | **80 (TN)** | | **50% Detained** |
  | | | | | | | |
  | **B** | 1 | 50 | 2 | 48 | 0.04 | Release |
  | **B** | 2 | 50 | 8 | 42 | 0.16 | Release |
  | **B** | 3 | 50 | *?* | *?* | *?* | **Detain** |
  | **B** | 4 | 50 | *?* | *?* | *?* | **Detain** |
  | **Total B** | | **200** | **10 (FN)** | **90 (TN)** | | **50% Detained** |

  *Note: Group A has higher observed risk in the released region ($20/100 = 20\%$) than Group B ($10/100 = 10\%$). Detention rates are equal (50%).*

  **Monotonicity Constraint:**
  For any completion, the latent risk $P(Y^*=1 | s)$ must be nondecreasing in $s$.
  *   Group A: Risk at $s=2$ is $0.30$. Thus, risk at $s=3, 4$ must be $\ge 0.30$.
  *   Group B: Risk at $s=2$ is $0.16$. Thus, risk at $s=3, 4$ must be $\ge 0.16$.

  ---

  ### 2. Two Observationally Equivalent Completions

  We define the latent outcomes for the detained cells ($s \in \{3, 4\}$). Let $TP_g$ be the total number of latent positives ($Y^*=1$) in the detained region for group $g$. Since there are 100 detained defendants per group, $FP_g = 100 - TP_g$.

  **Completion 1: "Group A is Latently Riskier"**
  *   **Group A:** Assume high latent risk. $TP_A = 90$ (90% of detained).
      *   Satisfies Monotonicity: $0.90 \ge 0.30$.
  *   **Group B:** Assume low latent risk. $TP_B = 20$ (20% of detained).
      *   Satisfies Monotonicity: $0.20 \ge 0.16$.

  **Metrics for Completion 1:**
  *   **Group A:**
      *   Total Positives ($P_A$) = $FN_A + TP_A = 20 + 90 = 110$.
      *   Total Negatives ($N_A$) = $TN_A + FP_A = 80 + 10 = 90$.
      *   **Base Rate:** $110/200 = 0.55$.
      *   **False Negative Rate (FNR):** $20 / 110 \approx \mathbf{0.182}$.
      *   **False Positive Rate (FPR):** $10 / 90 \approx \mathbf{0.111}$.
  *   **Group B:**
      *   Total Positives ($P_B$) = $FN_B + TP_B = 10 + 20 = 30$.
      *   Total Negatives ($N_B$) = $TN_B + FP_B = 90 + 80 = 170$.
      *   **Base Rate:** $30/200 = 0.15$.
      *   **False Negative Rate (FNR):** $10 / 30 \approx \mathbf{0.333}$.
      *   **False Positive Rate (FPR):** $80 / 170 \approx \mathbf{0.471}$.

  **Disparity Direction 1:** Group A has **Lower FNR** (0.18 vs 0.33) and **Lower FPR** (0.11 vs 0.47). Group B is disadvantaged on both errors.

  **Completion 2: "Group B is Latently Riskier"**
  *   **Group A:** Assume low latent risk. $TP_A = 30$ (30% of detained).
      *   Satisfies Monotonicity: $0.30 \ge 0.30$.
  *   **Group B:** Assume high latent risk. $TP_B = 90$ (90% of detained).
      *   Satisfies Monotonicity: $0.90 \ge 0.16$.

  **Metrics for Completion 2:**
  *   **Group A:**
      *   Total Positives ($P_A$) = $20 + 30 = 50$.
      *   Total Negatives ($N_A$) = $80 + 70 = 150$.
      *   **Base Rate:** $50/200 = 0.25$.
      *   **False Negative Rate (FNR):** $20 / 50 = \mathbf{0.400}$.
      *   **False Positive Rate (FPR):** $70 / 150 \approx \mathbf{0.467}$.
  *   **Group B:**
      *   Total Positives ($P_B$) = $10 + 90 = 100$.
      *   Total Negatives ($N_B$) = $90 + 10 = 100$.
      *   **Base Rate:** $100/200 = 0.50$.
      *   **False Negative Rate (FNR):** $10 / 100 = \mathbf{0.100}$.
      *   **False Positive Rate (FPR):** $10 / 100 = \mathbf{0.100}$.

  **Disparity Direction 2:** Group A has **Higher FNR** (0.40 vs 0.10) and **Higher FPR** (0.47 vs 0.10). Group A is disadvantaged on both errors.

  *(Note: In this selective labels setting with fixed detention counts, FNR and FPR move together as latent risk changes. Thus, the "trade-off" pattern where one rate goes up and the other down across groups is not generated by varying latent risk alone; rather, the verdict on **which group is worse** reverses completely.)*

  ---

  ### 3. Calibration Check

  **Definition:** A score is calibrated within groups if $P(Y^*=1 | s, g)$ is identical for all $s$ assigned the same score value, and specifically, if the predicted risk matches the observed frequency. Here we check if the risk is consistent across groups for the same score (External Calibration) or consistent within the score levels (Internal Calibration). The standard fairness impossibility result typically assumes **Internal Calibration** ($P(Y=1|s) = s$ or similar consistency).

  *   **Completion 1:**
      *   Group A Observed Risk ($s=2$): 0.30. Latent Risk ($s=3,4$): 0.90.
      *   Group B Observed Risk ($s=2$): 0.16. Latent Risk ($s=3,4$): 0.20.
      *   **Calibrated?** No. The risk jumps discontinuously at the threshold in both groups. Furthermore, for $s=2$, Group A (0.30) has higher risk than Group B (0.16), but for $s=3,4$, Group A (0.90) has much higher risk than Group B (0.20). The score is not calibrated *across* groups.
  *   **Completion 2:**
      *   Group A Observed Risk ($s=2$): 0.30. Latent Risk ($s=3,4$): 0.30. (Perfectly flat).
      *   Group B Observed Risk ($s=2$): 0.16. Latent Risk ($s=3,4$): 0.90. (Huge jump).
      *   **Calibrated?** No. Group B shows massive miscalibration between released and detained levels.

  **Significance of Asymmetry:**
  Calibration in the **released** cells is **refutable** (we can check if $P(Y=1|s=2)$ matches the score's promise). Calibration in the **detained** cells is **unverifiable**. In Completion 2, Group B's detained risk is assumed to be 0.90 despite a released risk of 0.16. This is observationally equivalent to a scenario where the risk is 0.20. The impossibility results usually assume calibration holds everywhere; here, we cannot verify the premise required to invoke the theorem.

  ---

  ### 4. Completion-Robust Criteria

  *   **Robust Criteria:** The only robust metrics are those defined solely on the **observed** data.
      *   **Detention Rate:** Identified (50% for both).
      *   **Observed Rearrest Rate (among released):** Identified (20% for A, 10% for B).
      *   **Negative Predictive Value (NPV):** Identified. $NPV = TN / (TN + FN)$. Since TN and FN are observed for released defendants, and detained defendants are Predicted Positive (not Negative), the NPV is calculated entirely over the released population.
          *   Comp 1 & 2 NPV A: $80 / (80+20) = 0.80$.
          *   Comp 1 & 2 NPV B: $90 / (90+10) = 0.90$.
          *   **Verdict:** Group B has better NPV in *all* completions.
  *   **Non-Robust Criteria:**
      *   **FNR, FPR, PPV, Base Rate:** All depend on $TP$ in the detained region, which is unidentified. As shown, the disparity direction for FNR/FPR flips between completions.
      *   **Accuracy:** Overall accuracy depends on $TP$ and $TN$ in the detained region. Since $TN_{detained}=0$ (all detained are predicted positive), Accuracy depends on $TP$. Accuracy is **not identified**.
  *   **Decisions vs. Outcomes:** The Detention Rate is robust precisely because it quantifies over **decisions** ($D=1$), which are observed, rather than **outcomes** ($Y^*$), which are censored.

  ---

  ### 5. Reading the Impossibility Results

  **Constraint on Policy vs. Distribution:**
  In this setting, the impossibility theorem (Calibration + Equal FNR + Equal FPR $\implies$ Equal Base Rates) is a constraint on a **joint distribution that no one observes**. Because the Base Rates and Error Rates are unidentified, the theorem does not constrain the *policy* (the threshold choice) directly; it constrains the *interpretation* of the policy. We cannot know if we are violating the theorem because we cannot calculate the terms.

  **Guidance for Choice:**
  Since the observed record does not determine which choice we are making (e.g., disadvantaging A vs. B), policy should not rely on point estimates of fairness metrics.
  1.  **Worst-Case Reasoning:** Policymakers should evaluate fairness over the **set of admissible completions**. In our example, Group A is disadvantaged in Completion 2, while Group B is disadvantaged in Completion 1. A minimax regret approach would acknowledge that *either* group could be the victim of disparity depending on the unobserved truth.
  2.  **Audit/Randomized Release:** To restore identification, a jurisdiction must break the selective labels bias. Releasing a small, randomized audit sample of high-score defendants allows direct estimation of $P(Y^*=1 | s \ge \text{threshold})$.
      *   **Cost:** The cost is the short-term risk of rearrest for the audit sample. However, this cost is bounded and localized, whereas the cost of systemic bias under selective labels is unbounded and opaque.

  ---

  ### 6. Equal Detention Rates and Underdetermination

  **Does underdetermination survive?**
  **Yes.** In the example above, Detention Rates were equal (50% for both), yet the direction of the FNR/FPR disparity reversed between Completion 1 and Completion 2.

  **What pins down the direction?**
  If Detention Rates are equal, the direction of the disparity is pinned down **only if the Observed Outcomes (Released Data) are also identical across groups**.
  *   In our example, Observed Risk differed (A=20%, B=10%). This allowed the latent assumptions to overwhelm the observed difference in one completion and be overwhelmed in the other.
  *   If $P(Y=1 | s, \text{Released}, A) = P(Y=1 | s, \text{Released}, B)$ and Detention Rates are equal, then $FN_A = FN_B$ and $TN_A = TN_B$.
  *   Since $FNR = FN / (FN + TP)$ and $FPR = FP / (FP + TN)$, and $TP_A, TP_B$ are the only variables:
      *   If we assume **Calibration** (same latent risk $P(Y^*|s)$ for A and B), then $TP_A = TP_B$.
      *   This forces $FNR_A = FNR_B$ and $FPR_A = FPR_B$.
      *   **Result:** With Equal Detention Rates + Equal Observed Outcomes + Calibration, Disparities are **Identified** (they are zero).

  **Comment on Observable Power:**
  The Observed Outcome Distribution has the power to pin down disparity direction because it fixes the **numerator of the FNR** and the **TN component of the FPR denominator**. When detention rates are equal, the only remaining degree of freedom is the latent risk in the detained region. If we impose calibration, that degree of freedom is removed, collapsing the set of admissible completions to a single point. Thus, an observable quantity (released outcomes) gains identifying power over the unobserved quantity (detained outcomes) only when coupled with structural assumptions (calibration) and design constraints (equal detention rates). Without calibration, even equal detention rates and equal observed outcomes leave the latent risk $TP$ free to vary, preserving underdetermination.
