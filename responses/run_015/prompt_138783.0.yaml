  *(Refining the Threads analogy)*: If they are threads, they share the GIL (Global Interpreter Lock)? No, that implies serialization. Maybe "Microservices sharing a database but with separate caches." That's actually closer to the Node analogy. Let's stick with the "Shared Kernel/Process" idea for the biological reality.

