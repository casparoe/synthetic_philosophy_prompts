answer: |-
  Good morning. Looking around this room, I see the geometry of my mother's life. There are her children and grandchildren, clustered close. There are neighbours and former colleagues who knew her when she was sharp as a tack and busy as a bee. There is the care-home staff, who knew her best when she was quietest. And there are friends who haven't been in touch for a long time. If you count the seats, there are about sixty of us. But if you count the people she fed over thirty-one years of Sunday lunches, the number is in the thousands.

  She ran that lunch on a simple principle: whoever turns up is fed. No questions asked. No reciprocity required. You didn't have to cook to eat; you didn't even have to stay to wash up. You just had to arrive.

  Two years before her diagnosis, she left a note about what should happen when she died. She was tough-minded, and she wanted her instructions to be equally so. She wrote: do not talk about me watching over you from above. Do not claim you know what I would have wanted for your futures. And, crucially, do not pretend I am still "me" once I can no longer recognise you or hold up my end of a conversation. She believed that a self is something you actively maintain. If you can't act, she thought, you aren't there.

  I intend to keep her first two requests. I won't tell you she is watching us, and I won't presume to dictate your lives. But on the third point, I have to lovingly disagree.

  She believed personhood was a solo performance. I believe it is a chorus.

  We need to be honest about the last four years. Advanced Alzheimer's is not a gentle fading; it is a stripping away. There were days when the chair she used to pull out for visitors sat empty because she couldn't find it. There were times we sang her favourite songs to a silence that didn't sing back. It was one-sided. The relationship was carried almost entirely by us, by the nurses, by the hands that brushed her hair and the voices that told her she was safe.

  If we followed her note strictly, we would say that woman in the bed was no longer our mother. But that feels like a betrayal of the care she received, and of the love we gave. To say she ceased to be a person because she could no longer assert herself is to ignore the people who held her in personhood when she couldn't hold it herself.

  This isn't about magic. It isn't about pretending the disease wasn't real. It is about acknowledging that we are not islands. We are woven together. When the thread slackens on one side, the other side holds the tension. For four years, we were the memory she couldn't keep. We were the identity she couldn't speak. We held her in relation, not because she could demand it, but because she had taught us how to love without conditions.

  I know there are people in this room who haven't seen her in years. Some of you might feel a pang of guilt, wondering if you drifted away too far. I want to be clear about what this means for you. If personhood were something granted only by current attention, then your absence would diminish her. But that isn't how her world worked.

  Her Sunday lunches weren't valid only while you were eating. The table remained a table even when the chairs were empty. The love she gave you wasn't a loan she called in when she got sick. It was a gift. You are welcome here today not because your presence validates her life, but because her life validated yours. You are part of the web she wove, even if your thread went slack for a while. You don't need to justify being here. The door is still open.

  To the care staff: you are the proof of this. When family couldn't be there, you were. You held her when she couldn't hold herself. You didn't just manage a patient; you honoured a person. You understood that dignity isn't something you lose when you lose your memory; it is something others protect for you.

  So, she was right that the self is active. But she was wrong that it must be *your* activity alone. Sometimes, the self is active in the hands of the person feeding you. Sometimes, it is active in the voice of the nurse singing a hymn. Sometimes, it is active in the friend who walks through the door after ten years, saying, "I remember."

  She asked us not to claim she is watching over us. She isn't. She is here, in the space between us. She is in the way we look after each other. She is in the open door. She is in the refusal to let go of someone just because they can no longer hold on.

  We are not gathered here to mourn a person who disappeared four years ago. We are here to celebrate a person who is still being constituted by the love she inspired. The lunch is over, but the table remains. Whoever turns up is still fed. And whoever remembers her is still known.

  Thank you.
