answer: |-
  ### Adjudication of Moves

  **Move 1 (Nadia): Right.**
  Nadia correctly identifies the categorical difference between archival record and public commemoration. Archives preserve facts; monuments prescribe values. By defining commemoration as a "present-tense act" by the city, she establishes that the statue is not a neutral historical marker but an ongoing speech act by the municipality. This establishes that the debate is not about erasing history, but about current endorsement. If the city keeps the statue in a place of honor, it is actively choosing to honor the subject *now*, regardless of when the statue was cast.

  **Move 2 (Gordon): Partly Right.**
  Gordon is right about the costs. Renaming imposes a concentrated financial burden on residents and businesses for a diffuse symbolic benefit. This is a strong pragmatic argument against renaming. However, he is wrong to claim a street name is merely a "coordinate." Street names are a primary way cities map their values onto geography; they are honorific by default. To say "nobody driving down Pembroke Avenue is being commended" ignores that the state has chosen to name the artery of the city after him, embedding him in the daily vocabulary of civic life. He establishes that renaming has high transaction costs, but fails to prove the name is morally neutral.

  **Move 3 (Nadia): Right.**
  Nadia successfully rebuts the "coordinate" theory. She establishes that administrative usage constitutes state speech. When a dispatcher, a court, or a license bureau says "Pembroke Avenue," the city is uttering the name. Her point about "dispositional" honoring is crucial: a monument or name means what it signifies structurally, not just when noticed. She establishes that the "emptiness" of the name is not innocence, but a form of unexamined privilege. This neutralizes Gordon's claim that the street is merely functional.

  **Move 4 (Gordon): Partly Right.**
  Gordon is right that re-inscription (adding context) is less irreversible than removal. This establishes a presumption against destruction: if the object can be made truthful through addition, that is preferable to subtraction. However, he is wrong to assume text cancels physical rhetoric. A plaque is read; a statue is seen. The visual dominance of a bronze figure on a pedestal often overwhelms the fine print at its base. He establishes that removal sets a precedent that might be dangerous later, but he does not prove that a plaque neutralizes the honorific nature of the statue's placement.

  **Move 5 (Nadia): Right.**
  This is the strongest philosophical move in the debate. Nadia distinguishes between *Ancestor-commemoration* (we come from him, flaws included) and *Exemplar-commemoration* (imitate him, flaws disqualify). She correctly notes that the 1911 inscription ("TO THE YOUTH... AN EXAMPLE") explicitly categorizes the statue as Exemplar. She establishes that the physical positioning of a statue (looking down on the viewer) creates a power dynamic that text cannot undo. Crucially, she concedes the street argument based on this distinction, acknowledging that a street name functions more like ancestry than exemplarity. This establishes a workable criterion for differentiating the two cases.

  **Move 6 (Gordon): Partly Right.**
  Gordon is right that relocation (to a museum) solves the "compulsory address" problem without destroying the object. This offers a viable third option between "honor" and "erase." However, his argument about the "Third Party" (the Indigenous nation) is conditional. He argues *if* descendants want it kept, removal is paternalistic. He does not establish that they *do* want it kept. He establishes that the city must not presume to speak for the victims of the historical wrong, but he leaves the actual wishes of those victims as an unknown variable. He also rightly notes that "woundedness" cannot be a sufficient threshold for removal, or public art would be impossible.

  ### Missing Considerations

  Both parties miss two critical factors that would resolve the tension between their valid points.

  1.  **The Specific Venue:** The statue stands at the *public library*. A library is an institution dedicated to truth, inquiry, and access to knowledge. A statue of a man who engineered the removal of a people and defended it in pamphlets creates a specific irony at the entrance of a knowledge institution that it might not create at a courthouse or a park. The location transforms the statue from a general honor into a specific claim about who controls knowledge and history. Neither argues from the function of the library itself.
  2.  **The Actual Descendants:** Gordon raises the question of the Indigenous nation's claim, but treats it as a philosophical hypothetical. Neither speaker suggests actually asking them. The moral weight of Move 6 depends entirely on empirical fact: do the descendants view the statue as a tool for education (keep with context) or as a continuing threat (remove)? The committee is debating what *they* think the descendants should feel, rather than consulting the stakeholders Gordon correctly identified as central.

  ### Recommendation

  **The Statue: Relocate.**
  The statue should be removed from the entrance of the public library. The inscription "TO THE YOUTH OF THIS CITY, AN EXAMPLE" makes Exemplar-commemoration explicit. A man who engineered ethnic cleansing cannot be held up as a moral example to youth, regardless of his beneficence in other areas. However, the statue should not be destroyed. It should be moved to a historical society or museum setting where it can be displayed with full context regarding Pembroke's complex legacy (the railroad and hospitals alongside the removal statutes). This satisfies Gordon's concern for historical preservation and Nadia's concern about current civic honor. The library entrance must not be a place of compulsory reverence for a disqualifying figure.

  **The Street: Retain.**
  Nadia's concession in Move 5 is correct. A street name functions as Ancestor-commemoration; it marks the historical geography of how the city came to be, including its flawed founders. Given the significant material costs outlined by Gordon in Move 2, and the fact that the primary honor (the statue) is being addressed, the street name should remain. To address Nadia's concern about "state speech," the city should install historical markers at key points along the avenue explaining Pembroke's full legacy, turning the street itself into a site of education rather than silent honor.

  **The Harder Case: The Statue.**
  The statue is the harder case. The street name is a matter of linguistic convention and logistical cost; the precedent for renaming is established and the harm is largely financial. The statue presents a deeper philosophical conflict between the preservation of historical artifacts and the moral environment of public space. It forces a choice between the irreversibility of removal (or the semi-permanence of relocation) and the daily psychological impact of a monumental figure looming over a civic space. Determining the threshold for when a "benefactor" becomes "disqualified" is a more profound civic judgment than managing the logistics of a map.
