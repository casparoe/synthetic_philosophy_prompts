      *Missing:* The specific function of the *Library*. A library is about knowledge. A statue of a man who suppressed a people's history at the entrance is ironic. Also, the specific inscription "To the Youth".
      *Missing:* The actual wishes of the Indigenous community (Gordon raises it, but neither knows the answer).

      *Recommendation:*
      *   Statue: Relocate. Do not destroy. Remove from place of honor (library entrance).
      *   Street: Retain. (Aligns with Nadia's Move 5 concession and Gordon's cost argument).
      *   Harder Case: Statue. (Because relocation vs. removal vs. context is more complex than street naming).

  6.  **Final Polish:** Ensure the voice is authoritative but not arrogant. Ensure the distinction between "Right" (logically sound/premise true) and "Winning" (conclusive) is clear. (The prompt asks to assess arguments on merits, not just who wins).

      *Wait, one nuance on Move 6:* Gordon says "If the descendants... say keep it... removal is... done about them." This is a conditional argument. He doesn't know if they want it kept. He's setting a condition. I should note that.

      *Harder Case:* Actually, the street might be the harder case *politically*, but the statue is the harder case *philosophically*. I will argue the Statue is the harder case because it involves the physical representation of power, whereas the street is linguistic convention.

