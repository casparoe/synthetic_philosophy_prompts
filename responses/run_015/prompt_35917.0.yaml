answer: |-
  The pattern you are seeing is the difference between **coordination conventions** (which are arbitrary) and **cooperative conventions** (which carry a moral load of fairness, reliance, or safety). However, as you noted, the traffic light case breaks a simple "follow the local norm" rule, and the market stall case breaks a "follow the law" rule.

  To resolve this, we need a principle that distinguishes between **safety/order systems** (where the formal rule is the baseline) and **distribution/access systems** (where the local norm is the baseline), while adding a constraint for **core moral integrity**.

  Here is the principle that saves nearly all your verdicts:

  ### The Principle of Reliance and Integrity
  **A visitor is morally obligated to follow a local convention if, and only if, deviating from it would exploit the reasonable reliance of others or cause them harm, provided that compliance does not violate the visitor's own core moral integrity.**

  To apply this precisely, we must define "reasonable reliance" based on the *type* of convention:

  1.  **Protective/Order Conventions (e.g., Traffic Lights):** The "reasonable reliance" is established by the **Formal Rule** (the law/sign), not the local practice. People rely on the law for safety and civic order.
      *   *Why it solves your puzzle:* In Germany, the local norm aligns with the law, so crossing violates reliance on safety *and* order. In Boston, the local norm (jaywalking) conflicts with the law. The visitor waiting at the light supports the Formal Rule (safety), violating no one's reliance. The visitor crossing on amber in Germany violates the Formal Rule, undermining the civic lesson for the schoolkids.
  2.  **Distributive/Access Conventions (e.g., Queues, Market Stalls):** The "reasonable reliance" is established by the **Local Norm**, because there is no Formal Rule.
      *   *Why it solves your puzzle:* In the bakery, the norm is a queue (fairness). Cutting exploits those waiting. In the market crush, the norm is competition (pushing). Hanging back doesn't exploit locals, and pushing doesn't exploit locals because *that is the agreed-upon game there*.
  3.  **Economic/Social Reliance Conventions (e.g., Tipping, Shoes):** The "reasonable reliance" is established by **Contextual Expectation**.
      *   *Why it solves your puzzle:* US servers rely on tips for livelihood; Japanese servers do not. Japanese hosts rely on shoe removal for property hygiene; US hosts generally do not.

  ---

  ### Applying the Principle to Your Hard Cases

  **1. The Unjust System (US Tipping)**
  *   **Verdict:** You must tip, but you may advocate for change.
  *   **Reasoning:** The server individually relies on your tip for their wage *now*. Your unilateral opt-out punishes the worker, not the system. The "harm" to the server is concrete; your "protest" is abstract. The Principle of Reliance dictates you cannot harm the reliant individual to protest the structure. You comply with the convention (tip) to honor the reliance, but you are free to complain to management or vote for labor law changes to alter the convention itself.

  **2. The Traffic Light Discrepancy (Germany vs. Boston)**
  *   **Verdict:** Always obey the Formal Rule (the light) regarding safety, regardless of local violation.
  *   **Reasoning:** Traffic laws are Protective Conventions. The "reliance" is on the *law* ensuring safety, not on *other drivers* breaking it.
      *   *German in Boston:* Obeying the light causes no harm. (Not wrong).
      *   *Local in Germany:* Breaking the light sets a bad example for kids (harm to civic order). (Wrong).
      *   *American in Germany:* Following the locals (breaking the light) violates the Formal Rule reliance. (Wrong).
      *   *Note:* This explains why the Market Stall is different. There is no Formal Rule for the market. Therefore, the Local Norm *becomes* the rule for fairness.

  **3. The Vegetarian Guest (The Test Case)**
  *   **Verdict:** The visitor may decline the meat.
  *   **Reasoning:** This is the "Integrity" clause of the principle.
      *   *Shoes:* Taking shoes off is an **external** action. It violates no core moral integrity of the guest. The host's reliance on property cleanliness/hygiene outweighs the guest's preference.
      *   *Meat:* Eating meat is an **internal** act of consumption tied to moral/religious identity. For a committed vegetarian, eating meat violates **Core Moral Integrity**.
      *   *Resolution:* While the host relies on the guest's participation for social harmony (dignitary interest), the guest's bodily/moral integrity trumps social etiquette. The obligation flips compared to the shoes. The guest should, however, minimize the affront (e.g., eat around it, praise other dishes) to respect the host's dignity as much as possible without violating their own integrity.

  ---

  ### A New Case to Test the Principle

  **Case:** A visitor from a culture where punctuality is fluid (being 30 minutes late is normal) is invited to a dinner party in Switzerland, where being 5 minutes late is considered rude.

  *   **Ruling:** The visitor is **obligated** to be on time.
  *   **Application:**
      *   *Type:* Distributive/Social Reliance Convention.
      *   *Reliance:* The host has coordinated the meal, perhaps invited others, and relies on the guest's arrival time to manage the flow of the evening (food quality, other guests' time).
      *   *Harm:* Lateness wastes the host's and other guests' time (a scarce resource).
      *   *Integrity:* Being on time violates no core moral integrity of the guest.
      *   *Conclusion:* The local convention creates a reliance obligation. The visitor must adapt.

  **Case:** A visitor in a country where it is customary to bribe police officers to avoid tickets is pulled over for a minor infraction.

  *   **Ruling:** The visitor is **not obligated** to bribe (and arguably obligated *not* to).
  *   **Application:**
      *   *Type:* Protective/Order Convention.
      *   *Formal Rule:* Bribery is illegal (almost universally).
      *   *Reliance:* While the officer "expects" it, the *system* relies on the law.
      *   *Integrity:* Participating in corruption may violate the visitor's core moral integrity regarding rule of law.
      *   *Conclusion:* Unlike the market stall (where no law exists), here the Formal Rule (no bribery) trumps the Local Norm. The "reliance" of the corrupt officer is not a *reasonable* reliance under the Principle.

  ### Summary of What to Drop
  To make this principle work, you must drop the intuition that **"local practice always defines fairness in the absence of law."**
  *   *Correction:* Local practice defines fairness in *competition* (Market), but not in *safety* (Traffic).
  *   *Correction:* You must also drop the idea that **"unjust systems allow unilateral opt-out."** You must distinguish between harming the *system* (allowed via advocacy) and harming the *individual reliant on the system* (not allowed).

  This principle holds your verdicts together by anchoring obligation in **harm/reliance** rather than mere conformity, while prioritizing **formal safety rules** over informal violations and **core integrity** over social etiquette.
