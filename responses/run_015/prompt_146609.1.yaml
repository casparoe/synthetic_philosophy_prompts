answer: |-
  **Seminar Handout Draft: Taxonomy of Restitution Arguments**
  **Course:** Museum Studies 404 // **Date:** Oct 14
  **Topic:** Who owns the past? (Benin / Parthenon cases)

  Below is a decision tree I'm using to map the debate. The goal isn't to solve it, but to see where people actually stand vs. where they just sound like they stand. I've tried to phrase the nodes so you don't need a degree in ethics to answer them.

  Note: There are 16 theoretical leaves (2^4), but most are empty. I've marked the empty ones in the analysis section below.

  ### THE TREE

  **Q1: Does murky or missing provenance block the moral claim?**
  *(i.e., If we can't prove exactly how it was taken, do we stop talking about return?)*

  *   **YES (Claim Blocked)** ──┐
      *   *Leads mostly to Status Quo positions.*
      *   **Q2:** Does cultural continuity matter more than legal ownership?
          *   **YES:** *(EMPTY - Incoherent. If claim is blocked, continuity shouldn't override law.)*
          *   **NO:** ──┐
              *   **Q3:** Can an educational/universal-access argument ever outweigh restitution?
                  *   **YES:** ──┐
                      *   **Q4 (Niche):** Is restitution fixing a relational harm or just a property wrong?
                          *   **Property:** **Leaf 1: The "Legalist Retentionist"**
                              *   *Awkward Commitment:* Must admit that current legal title (often based on old colonial laws) is the only moral metric that counts.
                          *   **Relational:** *(EMPTY - Ugly. Hard to claim you care about relationships while hiding the object.)*
                  *   **NO:** *(EMPTY - If access doesn't outweigh it, and claim is blocked, why keep it?)*
  *   **NO (Claim Survives)** ──┐
      *   *Leads to Restitution/Compromise positions.*
      *   **Q2:** Does cultural continuity matter more than legal ownership?
          *   **NO:** ──┐
              *   **Q3:** Can an educational/universal-access argument ever outweigh restitution?
                  *   **YES:** ──┐
                      *   **Q4 (Niche):** Property vs. Relational?
                          *   **Property:** **Leaf 2: The "Encyclopedic Compromiser"**
                              *   *Awkward Commitment:* Implies a tourist in London has an equal 'right' to the object as the descendant community in Benin City.
                          *   **Relational:** **Leaf 3: The "Partnership Idealist"**
                              *   *Awkward Commitment:* Assumes a 'partnership' is possible without first fixing the power imbalance that caused the theft.
                  *   **NO:** *(EMPTY - If continuity doesn't matter and access doesn't outweigh, why not just return it?)*
          *   **YES:** ──┐
              *   **Q3:** Can an educational/universal-access argument ever outweigh restitution?
                  *   **YES:** ──┐
                      *   **Q4 (Niche):** Property vs. Relational?
                          *   **Property:** **Leaf 4: The "Long-Term Loan Pragmatist"**
                              *   *Awkward Commitment:* Treats the object as a diplomatic chip to be loaned back rather than a right to be restored.
                          *   **Relational:** *(Mostly Empty - Relational harm usually demands full return, not loans.)*
                  *   **NO:** ──┐
                      *   **Q4 (Niche):** Property vs. Relational?
                          *   **Property:** **Leaf 5: The "Strict Repatriationist"**
                              *   *Awkward Commitment:* Must argue that the object has no value outside its origin context, even if it could educate millions elsewhere.
                          *   **Relational:** **Leaf 6: The "Decolonial Repairer"**
                              *   *Awkward Commitment:* Risks reducing the complex history of the object to a single narrative of victimhood and healing.

  ---

  ### ANALYSIS OF THE MAP

  **1. Occupied vs. Empty Leaves**
  Most of the theoretical combinations don't exist in the wild.
  *   **The "Incoherent" Zone:** Any branch where Provenance blocks the claim (Q1=YES) but the person *still* argues for return based on Continuity (Q2=YES). You can't say "we have no claim" and "we have a moral right" simultaneously.
  *   **The "Ugly" Zone:** Q1=YES (Claim Blocked) + Q4=Relational. You can't say "we don't know how we got this, so we keep it" while claiming you care about "repairing relationships." That's gaslighting, not a position. (Though some museums flirt with this language).
  *   **The "Unexplored" Zone:** Q1=NO + Q2=NO + Q3=NO. This is the "Return it, but not because they are connected to it and not for education." Basically, "Return it because...?" This spot is empty because if you don't care about continuity or education, you usually default to legal ownership (which keeps it in the museum).

  **2. Overlaps (The Tree's Blind Spots)**
  *   **Leaf 5 (Strict Repatriationist) vs. Leaf 6 (Decolonial Repairer):**
      *   In practice, these two often sign the same petitions. The tree separates them at Q4 (Property vs. Relation), but in a policy meeting, they vote the same way. The tree *can* separate them theoretically, but operationally they look identical.
      *   *Note:* Same with **Leaf 1 (Legalist)** and **Leaf 2 (Encyclopedic)**. They both keep the marbles, but one cites law, the other cites "humanity."

  **3. Application to Cases**
  *   **Benin Bronzes:** Most movement is shifting from Leaf 1 -> Leaf 5/6. The provenance is too bloody (Punitive Expedition 1897) to sustain Q1=YES anymore.
  *   **Parthenon Marbles:** Still stuck between Leaf 2 and Leaf 4. The British Museum loves the "Partnership/Loan" angle (Leaf 4) to avoid admitting the "Property Wrong" (Leaf 5).

  **4. Why the Niche Split (Q4) Matters**
  If you treat it as **Property**, the solution is transactional (give it back, done). If you treat it as **Relational**, the solution is ongoing (ceremony, curatorial control, apology).
  *   *Watch out:* Museums love to talk Q4=Relational while acting Q4=Property.

