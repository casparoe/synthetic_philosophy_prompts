answer: |-
  **Grade: 13/20**

  **General Comments:**
  You have a solid grasp of how to apply the norms to the specific case in part (a), and your reconstruction of the Moorean argument in part (b) captures the basic intuition behind Williamson's view. However, there are two significant factual errors regarding the literature and epistemological history that cost you marks. Additionally, part (b) asks for the *strongest objection*, but you raise an objection and immediately argue against it, rather than developing why it poses a genuine threat to the Knowledge Norm (KN).

  Below is a detailed breakdown of where marks were lost and where your reasoning was strong.

  ***

  ### Part (a): Norm Application & Evidentials (7/10)

  > **"TN: permissible... BN: permissible... KN: not permissible... JN: not permissible."**

  *   **Feedback:** **Correct.** You have correctly applied the four norms to the Gettier-style case. Ada satisfies Truth and Belief, but fails Knowledge and Justification. This is the core of the exercise, and you nailed it.

  > **"KN and JN will in general always give the same verdicts, since knowledge is justified true belief..."**

  *   **Feedback:** **Settled Error.** This is the most significant conceptual mistake in the paper. Since Gettier (1963), it is standard orthodoxy in epistemology that Knowledge $\neq$ Justified True Belief. There are cases of JTB without knowledge (like Ada's case, ironically) and potentially cases of knowledge without traditional justification (e.g., some externalist views). Because K and J come apart, KN and JN can diverge in verdicts. You cannot assume they are co-extensive.
  *   **Mark Deduction:** -2 marks.

  > **"The -ne doesn't change any of this. Evidential endings are hedges... It's like English 'I guess'..."**

  *   **Feedback:** **Contested/Underdeveloped.** Whether evidentials are part of the at-issue content or markers of illocutionary force is a live debate in linguistics and philosophy of language. However, the prompt asked you to consider *if* it matters. If *-ne* signals "I lack evidence," a proponent of JN might argue that using *-ne* makes the assertion permissible *because* you are being transparent about your lack of justification (you aren't misleading your audience into thinking you know). Dismissing this in one sentence misses the philosophical point of introducing the Burean language. A stronger answer would explore whether the evidential marker modifies the norm itself (e.g., "Assert p-ne only if you lack evidence").
  *   **Mark Deduction:** -1 mark (for lack of engagement with the prompt's hypothetical).

  ***

  ### Part (b): The Moorean Argument & Objections (6/10)

  > **"The truth-norm people (Williamson's view) can't explain it at all..."**

  *   **Feedback:** **Settled Error.** Timothy Williamson is the primary proponent of the **Knowledge Norm (KN)**, not the Truth Norm (TN). The Truth Norm is usually associated with authors like Weiner (2005) or early views that Williamson explicitly argues *against*. Confusing the central author of the reading with the opposing view suggests a mix-up in the lecture notes or reading.
  *   **Mark Deduction:** -2 marks.

  > **"The argument: 'p but I don't know p' is absurd... in asserting p you represent yourself as knowing p..."**

  *   **Feedback:** **Good.** This is a fair reconstruction of Williamson's "constitutive rule" argument. You correctly identify that the absurdity is taken to be a contradiction between the content and the act of assertion.

  > **"The strongest objection is that Moore-paradoxicality might be explained by a norm on belief... But this objection fails, since asserting p does commit you to knowing p..."**

  *   **Feedback:** **Methodological Issue.** The question asks you to set out the *strongest objection*. By raising the Belief Norm objection and then immediately dismissing it using the very premise the objection challenges, you haven't really demonstrated *why* it is a strong objection. A stronger answer would explain: "The Belief Norm is a stronger objection because it is more parsimonious; it explains the absurdity of 'I believe p but I don't believe p' and 'I assert p but I don't know p' without positing a unique norm for assertion." You need to steel-man the objection before critiquing it.
  *   **Mark Deduction:** -2 marks (for not fully developing the objection as requested).

  ***

  ### Summary of Errors vs. Contested Points

  For your own study, it is important to distinguish between claims that are factually incorrect within the discipline and claims that are philosophically debatable.

  **1. Settled Errors (Docked Marks):**
  *   **K = JTB:** In contemporary epistemology, it is treated as a fact that Knowledge is *not* equivalent to Justified True Belief due to Gettier cases.
  *   **Williamson's View:** It is a matter of record that Williamson argues for the Knowledge Norm, not the Truth Norm.

  **2. Contested/Debatable (No Marks Docked, but noted for improvement):**
  *   **Status of Evidentials:** Whether *-ne* is semantic content or pragmatic force is not settled. However, you lost marks not for taking a side, but for not exploring the consequences of that side as the prompt requested.
  *   **Best Explanation of Moorean Absurdity:** Whether KN or BN best explains the absurdity is a live debate. You lost marks here for the *structure* of your argument (failing to develop the objection) rather than for siding with Williamson.

  ### Advice for Next Time
  1.  **Check Attributions:** When citing specific philosophers (Williamson, Gettier, Moore), double-check which position they hold. Mixing up the protagonist and antagonist of a debate is a costly error.
  2.  **Steel-Man Objections:** When asked for the "strongest objection," imagine you are a lawyer defending the opposing view. Make the objection as compelling as possible *before* you offer a rebuttal.
  3.  **Engage the Hypothetical:** When a question introduces a sci-fi element (like Burean evidentials), it is usually there to test whether you can apply the theory to *new* conditions, not just repeat the standard English analysis. Ask yourself: "If this feature existed, would it break the norm?"

  **Overall:** A passing paper that shows you understand the basic mechanics of the norms, but it reveals some gaps in your understanding of the historical and theoretical landscape of the readings. Review the Gettier material and Williamson's *Knowledge and Its Limits* introduction.
