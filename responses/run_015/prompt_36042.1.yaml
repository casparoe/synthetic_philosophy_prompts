answer: |-
  # Diagnostic Quiz: Which Theory of De Re Modality Do You Actually Hold?

  **Instructions:** Below are ten concrete scenarios involving possibility, identity, and change. For each, select the answer that best matches your immediate philosophical inclination. Do not worry about whether your answer aligns with a specific school of thought; answer based on what seems true to you about the case.

  ### The Questions

  **1. The Near-Miss (Politician)**
  Senator Smith lost the election by a single vote. We often say, "Smith could have won." When you make this claim, what makes it true?
  *   (A) There is a possible situation involving Smith *himself* where he gets that one extra vote.
  *   (B) There is a possible situation involving someone very much like Smith (but not strictly him) who gets that vote.
  *   (C) It is just a figure of speech; strictly speaking, only what actually happened is real.

  **2. The Modal Fission (Lottery)**
  Consider the closest possible world where you win the lottery. In that world, due to a quirk of physics, two people emerge who both have a claim to be you: one has your memories up to yesterday, the other has your exact physical body and mannerisms. Neither resembles you more overall than the other. Is the statement "I would have won the lottery" true?
  *   (A) Yes, definitely true.
  *   (B) No, definitely false.
  *   (C) It is indeterminate, vague, or depends on a convention we haven't set yet.

  **3. The Qualitative Swap (Symmetry)**
  Imagine a world that is qualitatively identical to ours in every respect (same laws, same distribution of properties), except that you and your closest physical duplicate have swapped life histories. In that world, the person with your body lived your duplicate's life, and vice versa. Is this a genuinely different possibility from the actual world?
  *   (A) Yes, it is a distinct possibility involving the same individuals in different roles.
  *   (B) No, if everything qualitative is the same, it is just the same world described differently.

  **4. The Origin (Gametes)**
  Consider a person who is born from a completely different sperm and egg than the ones you originated from, but who otherwise grows up to be exactly like you in appearance, psychology, and history. Could that person be you?
  *   (A) Yes, provided they are similar enough to me.
  *   (B) No, origin is essential; that person is someone else.
  *   (C) It depends on whether we decide to count them as me.

  **5. The Degradation (Frog)**
  Could you have been a frog?
  *   (A) No, it is impossible for me to be a frog.
  *   (B) Yes, provided I developed from the same origin/history, even if I ended up as a frog.
  *   (C) Yes, provided some being in that world is designated as "me," regardless of origin or similarity.

  **6. The Duplicate Worlds (Haecceitism)**
  Are there two distinct possible worlds that are exactly alike in every qualitative respect (same shapes, colors, thoughts, laws), differing only in *which* individuals occupy the roles?
  *   (A) Yes, individuals can be swapped without qualitative change.
  *   (B) No, worlds are defined by their qualitative content; swapping individuals without qualitative change is nothing at all.

  **7. The Solitary Modal Property (Intrinsic vs. Extrinsic)**
  If you were the only thing that existed in the universe (no other objects, no other worlds to compare to), could you still have had different properties (e.g., could you have been taller)?
  *   (A) Yes, my possibilities are intrinsic to me.
  *   (B) No, possibility depends on relations to counterparts or other existents.
  *   (C) The question is meaningless; I cannot exist without a world.

  **8. The Best Candidate (Reduplication)**
  Could there be a possible world containing two exact duplicates of you, both equally qualified to be you?
  *   (A) No, identity is one-to-one; at most one can be me.
  *   (B) Yes, both can be me (identity can be one-to-many).
  *   (C) Yes, but neither is strictly me; they are both counterparts.

  **9. The Sharp Cutoff (Vagueness)**
  Imagine a series of possible worlds where you lose one atom in each step. Is there a specific step where you cease to exist?
  *   (A) Yes, there is a precise fact of the matter, even if we don't know it.
  *   (B) No, there is no precise fact; existence is vague across worlds.
  *   (C) No, because "you" refers to a concept that we can sharpen arbitrarily.

  **10. The Designation (Radical Contingency)**
  Suppose God (or a world-maker) points to a rock in another possible world and declares, "This is you." No history, no similarity, just the assignment. Are you that rock?
  *   (A) No, I cannot be a rock.
  *   (B) Yes, if the primitive this-ness matches.
  *   (C) Yes, if the linguistic convention allows it.

  ***

  ### Scoring Key

  To find your leaf, follow the branching logic below based on your answers.

  **Step 1: The Haecceitism Check**
  *   If you answered **(A)** to **Q3** (Swap) OR **(A)** to **Q6** (Duplicate Worlds): You are a **Haecceitist**. Proceed to **Leaf D**.
  *   If you answered **(B)** to both: You are an **Anti-Haecceitist**. Proceed to Step 2.
  *   *Note: Mixed answers here suggest instability in your view of individuation.*

  **Step 2: The Identity vs. Similarity Check**
  *   If you answered **(A)** to **Q1** (Politician) AND **(A)** to **Q7** (Solitary): You lean toward **Transworld Identity**. Proceed to Step 3.
  *   If you answered **(B)** to **Q1** OR **(B)** to **Q7**: You lean toward **Counterpart Theory**. Proceed to Step 4.
  *   *Note: Answering (A) to Q1 but (B) to Q7 is a recognized but tense position (Identity is intrinsic but counterparts are relational).*

  **Step 3: Essentialism Constraints (For Identity Theorists)**
  *   If you answered **(B)** to **Q4** (Origin) AND **(A)** to **Q5** (Frog): You are a **Kripkean Essentialist**. Proceed to **Leaf A**.
  *   If you answered **(A)** to **Q4** OR **(B)/(C)** to **Q5**: You are a **Radical Contingentist**. Proceed to **Leaf E**.
  *   If you answered **(C)** to **Q2** (Fission): You hold a view of **Vague Identity**. Proceed to **Leaf F (Empty Cell)**.

  **Step 4: Counterpart Specifics (For Similarity Theorists)**
  *   If you answered **(C)** to **Q2** (Fission): You accept **Indeterminacy**. Proceed to **Leaf C**.
  *   If you answered **(A)** or **(B)** to **Q2** (implying a fact of the matter exists): Proceed to Step 5.
  *   If you answered **(B)** to **Q8** (Reduplication): You accept **One-to-Many Identity**. Proceed to **Leaf F (Empty Cell)**.

  **Step 5: Similarity Weights**
  *   If you answered **(B)** to **Q4** (Origin) AND **(A)** to **Q5** (Frog): You weight Origin heavily. Proceed to **Leaf B**.
  *   If you answered **(A)** to **Q4** OR **(B)** to **Q5**: You weight Similarity loosely. Proceed to **Leaf E**.

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf A: The Kripkean Essentialist (Transworld Identity + Anti-Haecceitism)**
  *   **Position:** You believe individuals exist across worlds strictly identical to themselves, but their possibilities are constrained by essential properties (like origin or kind). Qualitative facts fix de re facts.
  *   **Most Awkward Commitment:** You must explain how we have epistemic access to these transworld identities without qualitative markers; you are committed to the claim that we can know *who* is in another world even when qualitative evidence runs out, relying on a primitive notion of "thismess."

  **Leaf B: The Lewisian Counterpart Theorist (Similarity + Anti-Haecceitism + Strict Constraints)**
  *   **Position:** You believe other worlds contain only counterparts, not the individuals themselves. However, you weight the similarity relation so heavily on origin and kind that it mimics essentialism.
  *   **Most Awkward Commitment:** You must accept that when you say "I could have won," you are literally talking about someone else who resembles you, which seems to miss the point of *personal* possibility (the "embarrassment" that someone else wins).

  **Leaf C: The Permissive Counterpart Theorist (Similarity + Indeterminacy)**
  *   **Position:** You believe modality is grounded in similarity, but acknowledge that similarity can come in degrees that do not always yield a truth value. In fission cases, de re claims are vague.
  *   **Most Awkward Commitment:** You are committed to the view that some objective facts about reality (whether you would have won) are not true or false, but indeterminate, which requires a logic that rejects bivalence for modal claims.

  **Leaf D: The Bare Haecceitist (Haecceitism + Any Modal Ontology)**
  *   **Position:** You believe individuals can differ across worlds without any qualitative difference. Possibility is not exhausted by qualitative descriptions.
  *   **Most Awkward Commitment:** You face the "inaccessibility" problem: if two worlds are qualitatively identical, there is no empirical or rational way to distinguish them, making your distinct possibilities unknowable in principle.

  **Leaf E: The Radical Contingentist (Anti-Haecceitism + Loose Constraints)**
  *   **Position:** You reject origin essentialism and kind essentialism. You could have had different parents or been a different species, provided there is sufficient continuity or designation.
  *   **Most Awkward Commitment:** You struggle to explain why *anything* limits possibility; if you could be a frog or have different parents, the concept of "you" becomes so thin it risks dissolving into a bare particular or a purely linguistic construct.

  **Leaf F: The Empty Cell (Vague Identity / One-to-Many)**
  *   **Status:** **Unoccupied/Incoherent.**
  *   **Speculation:** This cell captures those who want Transworld Identity (Q1-A) but accept Indeterminacy in Fission (Q2-C) or One-to-Many Identity (Q8-B). This is rarely occupied because standard identity logic is transitive and one-to-one. Those who hold this usually abandon "Identity" terminology for "Constitution" or "Counterparts." It is likely empty because it requires abandoning the logic of identity while keeping the label.

  ***

  ### Diagnostic Caveats and Limitations

  **1. The Convergence Problem (Lewis vs. Kripke)**
  This instrument cannot reliably distinguish between **Leaf A (Kripkean)** and **Leaf B (Lewisian)** if the Counterpart Theorist weights the similarity relation overwhelmingly toward origin. If a Lewisian decides that "no origin, no counterpart," they will answer every concrete question identically to a Kripkean who believes "no origin, no identity."
  *   **Why this happens:** The quiz sorts by *commitments to cases*, not underlying ontology. Both positions yield the same verdicts on the Politician, Gametes, and Frog cases.
  *   **Recommendation:** Readers who land on Leaf B should ask themselves: "Do I think the person in the other world *is* me, or just *like* me?" If the answer is "Is me," they are Kripkeans who arrived at Leaf B via the scoring logic's focus on similarity constraints.

  **2. The Haecceitist Ambiguity**
  Readers landing on **Leaf D** may hold vastly different ontologies. A Haecceitist can be a Transworld Identity theorist (Kripkean) or a Counterpart Theorist (Lewisian with haecceitistic counterparts). The quiz identifies the commitment to non-qualitative individuation but does not resolve the mechanism (Identity vs. Counterpart).

  **3. The "Empty" Cell**
  **Leaf F** represents a combination of answers (Identity + Vagueness/One-to-Many) that is theoretically possible but philosophically unstable. Most philosophers who feel the pull of Q2-C (Indeterminacy) abandon the strict Identity framework of Q1-A in favor of Counterpart Theory to avoid violating the logic of identity. If you landed here, you are in good company (e.g., Gareth Evans's targets), but you are holding a position most metaphysicians consider incoherent.
