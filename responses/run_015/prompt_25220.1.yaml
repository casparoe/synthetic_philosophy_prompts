prompt: |-
  I run a community mediation center — we handle maybe twenty disputes a month, neighbor noise, property lines, landlord-tenant stuff, business partnerships gone sour. The hardest part of my job isn't getting people to agree, it's writing the case summary both sides will sign off on before we even start mediation. Each side tells a completely different story and both seem genuinely convinced they're right.

  I've been reading about this Jain idea of anekāntavāda — that truth has many sides and no single perspective captures the whole thing — and the related practice of syādvāda, where you qualify claims with something like "in some respects" rather than stating them absolutely. I'm wondering if there's a practical procedure I can build out of this. Not the metaphysics, just a step-by-step way to take two contradictory accounts and produce a description that honors what's true in each without pretending they're compatable where they aren't.

  What I need: a set of questions I ask about each account in order, what counts as a sufficient answer, where the procedure tells me I can reconcile the accounts and where it tells me they genuinely contradict, and where it throws up its hands and says "this is a judgment call." It has to be something I can run in about an hour per case, and the output has to be a summary I can read back to both parties without them walking out.

  Then walk me through it on two cases. First: a tenant says the landlord is harassing them with unannounced visits and the landlord says they're just doing legally required maintenance checks with proper notice — the tenant has a log of seventeen visits in three months, the landlord has work orders for about half of them. Second: two business partners disagree about whether a handshake deal at a bar after three drinks counts as a binding agreement to expand the business — one says they shook on it and that's that, the other says it was just talk and they never discussed dollar amounts.
reasoning: |-
  Here's a thinking process that leads to the suggested mediation procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs a community mediation center (approx. 20 disputes/month).
      *   **Problem:** Writing the pre-mediation case summary that both sides sign off on. Contradictory accounts make this difficult.
      *   **Inspiration:** Jain philosophy concepts *anekāntavāda* (many-sidedness of truth) and *syādvāda* (qualified assertions/"in some respects").
      *   **Goal:** A practical, step-by-step procedure (not metaphysics) to draft a summary that honors both truths without forcing false compatibility.
      *   **Constraints:** ~1 hour per case, output must be readable without parties walking out.
      *   **Deliverables:**
          1.  A set of ordered questions.
          2.  Criteria for sufficient answers.
          3.  Rules for reconciliation vs. contradiction vs. judgment call.
          4.  Walkthrough of two specific cases (Tenant/Landlord, Business Partners).

  2.  **Deconstruct the Philosophical Concepts for Practical Use:**
      *   *Anekāntavāda:* Acknowledge that Party A's truth is true *for them* based on their experience, and Party B's truth is true *for them* based on theirs. Neither is the "Whole Truth."
      *   *Syādvāda:* Use qualifying language ("From the perspective of...", "To the extent that...", "In the record of..."). Avoid absolute "This happened" statements unless verified by objective evidence.
      *   *Application:* The summary shouldn't say "X happened." It should say "Party A reports X. Party B reports Y. The objective record shows Z."

  3.  **Develop the Procedure (The "Seven-Step Syād-Protocol"):**
      *   *Time Limit:* Needs to be tight. 1 hour total means ~15 mins per party interview + 30 mins drafting/review. Let's structure the *drafting* phase specifically, assuming intake info is already gathered. The prompt asks for the procedure to *take two accounts and produce a description*. So, focus on the synthesis phase.
      *   *Step 1: Isolate Claims.* Separate facts from interpretations.
      *   *Step 2: Identify Evidence.* What is documented vs. remembered?
      *   *Step 3: Apply Qualifiers.* Use *syādvāda* language (From X's view...).
      *   *Step 4: Map Overlap.* Where do they agree? (Even if it's just "we have a dispute").
      *   *Step 5: Map Divergence.* Where do they contradict? Label them as "Perspective Differences" vs. "Factual Disputes."
      *   *Step 6: The "Judgment Call" Bucket.* What can't be resolved here?
      *   *Step 7: Draft the "Both/And" Statement.*

      *Refining the Questions:* I need specific questions the mediator asks *themselves* or the *text* to generate the summary.
      1.  What is the *observable event*? (Time, place, action).
      2.  What is the *internal experience*? (Intent, feeling, impact).
      3.  What is the *documentary record*?
      4.  Where is the *interpretive gap*?

      *Refining the Output:* The summary needs a specific structure.
      *   Section 1: Shared Context (Undisputed facts).
      *   Section 2: Divergent Accounts (Using qualifying language).
      *   Section 3: Unresolved Questions (The "Judgment Call" areas).

  4.  **Drafting the Protocol (Iterative refinement):**
      *   *Name:* Let's call it the "Multi-View Summary Protocol."
      *   *Questions:*
          1.  What is the bare physical event both acknowledge? (e.g., "A meeting occurred.")
          2.  What does Party A claim regarding intent/meaning?
          3.  What does Party B claim regarding intent/meaning?
          4.  What objective evidence exists for each claim?
          5.  Is the contradiction on *fact* (did it happen?) or *meaning* (what did it signify?)?
      *   *Sufficient Answer:* Must be specific enough to be written down without ambiguity, but qualified enough to not assert absolute truth.
      *   *Reconciliation:* Possible when the conflict is about *meaning* or *memory*, not mutually exclusive physical states.
      *   *Contradiction:* When physical states are mutually exclusive (e.g., "I was there" vs. "I was in another city").
      *   *Judgment Call:* When evidence is insufficient to verify either side.

  5.  **Applying to Case 1 (Tenant vs. Landlord):**
      *   *Facts:* 17 visits logged by tenant. Work orders for ~8-9 by landlord.
      *   *Conflict:* Harassment vs. Maintenance. Notice vs. No Notice.
      *   *Syād Approach:* Don't say "Landlord harassed." Say "Tenant experienced visits as intrusive." Don't say "Landlord gave notice." Say "Landlord records indicate work orders were generated."
      *   *The Gap:* The 8-9 visits without work orders.
      *   *Summary:* Acknowledge the frequency (17) acknowledges the work orders (9). Leave the other 8 as "Disputed Visits."

  6.  **Applying to Case 2 (Business Partners):**
      *   *Facts:* Meeting at a bar. Alcohol consumed. Handshake mentioned by one.
      *   *Conflict:* Binding contract vs. Casual talk.
      *   *Syād Approach:* Focus on the *state* of the agreement. "Partner A understood a commitment was made." "Partner B understood exploration was occurring."
      *   *The Gap:* Intent at the moment of the handshake.
      *   *Summary:* Validate the relationship history, validate the meeting occurred, validate the divergence in understanding of legal weight.

  7.  **Review against Constraints:**
      *   *Hour limit:* The protocol needs to be fast. I should emphasize that this is a *drafting* tool based on intake notes, not a new interview process.
      *   *Walk-out risk:* The language must be neutral. Avoid "alleged" (sounds accusatory) use "states" or "reports." Use "From the perspective of..."
      *   *Jain Philosophy:* Ensure *syādvāda* (qualified predication) is visible in the language structure.

  8.  **Final Polish:**
      *   Make the steps actionable.
      *   Ensure the "Judgment Call" criteria are clear.
      *   Check the tone: Professional, empathetic, firm on process.

      *(Self-Correction during drafting)*: I initially thought about asking the parties these questions. But the user says "writing the case summary... before we even start mediation." This implies the mediator has already done intake calls. So the procedure is for *processing the intake notes* into the document. I need to make sure the questions are for the *mediator analyzing the notes*.

      *Revised Plan:*
      1.  Define the "Syād-Summary Protocol."
      2.  List the 5 Diagnostic Questions.
      3.  Define the 3 Output Categories (Convergence, Divergence, Indeterminacy).
      4.  Provide the Language Guide (How to phrase things).
      5.  Run the two cases.

      *Refining the "Judgment Call":* In mediation, the mediator doesn't make judgment calls on truth. They identify *where the judgment is needed*. So the "Judgment Call" bucket is actually "Issues Requiring Negotiation." I need to be careful with terminology so the mediator doesn't sound like a judge. It's "Unresolved Factual Disputes."

      *Let's adjust the "Judgment Call" definition:* The prompt asks where the procedure "throws up its hands." In mediation, that means "This is what you need to solve in the room." I will frame it as "Areas for Mediation."

      *Wait, one more check on Jain concepts:* *Syādvāda* is about predication. "In some ways, it is." "In some ways, it is not." "In some ways, it is indescribable." I should incorporate this triad into the summary structure.
      1.  Affirmation (What is agreed/verified).
      2.  Negation (What is denied/contradicted).
      3.  Indeterminacy (What is unclear/subjective).

      Okay, ready to write.

  9.  **Final Review of the Output:**
      *   Does it answer the prompt? Yes.
      *   Is it practical? Yes.
      *   Are the cases walkthroughs detailed? Yes.
      *   Is the tone appropriate? Yes.

      *(Final thought on the Landlord case)*: 17 visits vs 9 work orders. That's a big gap. The summary needs to highlight the gap without accusing the landlord of lying. "Tenant records indicate 17 entries. Landlord records indicate 9 authorized entries. The status of the remaining 8 visits is disputed."
      *(Final thought on the Partner case)*: Handshake at a bar. "Partner A recalls a handshake concluding an agreement. Partner B recalls a handshake concluding a conversation." Perfect example of *syādvāda*.

      Let's assemble.cw
answer: |-
  This is a brilliant application of *anekāntavāda* (many-sidedness) to conflict resolution. In mediation, the urge is usually to find the "one true story" to solve the problem. But often, the "one true story" is exactly what keeps people fighting. By shifting the goal from **Truth** to **Accurate Mapping of Perspectives**, you lower the stakes enough for people to sit in the same room.

  Here is a practical procedure built on Jain epistemological logic, stripped of metaphysics, designed for your one-hour constraint.

  ### The Syād-Summary Protocol

  **Goal:** Produce a "Case Context Statement" that both parties can sign without feeling their reality is being invalidated.
  **Time:** 45–60 minutes (post-intake).
  **Core Principle:** No statement in the summary shall be absolute unless verified by third-party physical evidence. All other statements must be qualified by source.

  #### Part 1: The Five Diagnostic Questions
  Ask these questions of the intake notes for each disputed event.

  1.  **The Physical Anchor:** What is the bare physical event both sides acknowledge happened? (e.g., "A meeting occurred," "A visit happened," "Money was transferred.")
      *   *Sufficient Answer:* A time, date, and location both accept.
      *   *Insufficient Answer:* "We had a fight." (Too interpretive).
  2.  **The Internal State:** What does Party A claim was the *intent/meaning*? What does Party B claim was the *intent/meaning*?
      *   *Sufficient Answer:* "A intended X," "B intended Y."
      *   *Insufficient Answer:* "A was lying." (This is a conclusion, not a state).
  3.  **The Documentary Trace:** What objective record exists for this event? (Logs, emails, texts, work orders).
      *   *Sufficient Answer:* "Document X exists showing Y."
      *   *Insufficient Answer:* "I told them." (Hearsay).
  4.  **The Compatibility Check:** Can both Internal States exist simultaneously without logical contradiction?
      *   *Reconcilable:* Yes (e.g., One felt harassed, one felt helpful).
      *   *Contradictory:* No (e.g., One was in the room, one was out of town).
  5.  **The Indeterminacy:** Where does the evidence run out?
      *   *Judgment Call:* Where there is no documentary trace and the Internal States are contradictory.

  #### Part 2: The Three Output Buckets
  Based on the answers above, every claim in your summary must fall into one of these three sections.

  1.  **Convergence (Syād-asti):** "In some respects, it is."
      *   *Usage:* For Physical Anchors and Documentary Traces.
      *   *Language:* "The records show..." "Both parties agree..."
  2.  **Divergence (Syād-nāsti):** "In some respects, it is not."
      *   *Usage:* For Reconcilable Internal States.
      *   *Language:* "Tenant experienced the visits as..." "Landlord intended the visits as..."
  3.  **Indeterminacy (Syād-avaktavya):** "In some respects, it is indescribable/undecided."
      *   *Usage:* For Contradictory Claims with no evidence.
      *   *Language:* "The parties hold different recollections regarding..." "It is disputed whether..."

  #### Part 3: The "Walk-Out" Safety Check
  Before printing, read the draft against these rules. If you violate them, rewrite.
  *   **Rule of Attribution:** Never state a subjective claim as fact. (Bad: "The landlord entered without notice." Good: "The tenant reports entries occurred without notice.")
  *   **Rule of Validation:** Never omit a claim just because it lacks evidence. If Party A says it, it goes in the *Indeterminacy* bucket.
  *   **Rule of Neutrality:** Avoid words like "alleged," "claimed," or "supposedly" which imply lying. Use "states," "reports," "recollects," or "understands."

  ---

  ### Case Walkthrough 1: Tenant vs. Landlord
  **The Dispute:** Harassment (17 visits) vs. Maintenance (9 work orders).

  #### Step 1: Run the Diagnostic Questions
  1.  **Physical Anchor:** Did visits occur?
      *   *Answer:* Yes. Tenant log says 17. Landlord work orders say 9.
      *   *Bucket:* **Convergence** (on the fact that *some* visits occurred), **Indeterminacy** (on the exact number).
  2.  **Internal State:**
      *   *Tenant:* Felt harassed, intruded upon, unsafe.
      *   *Landlord:* Felt responsible, compliant, maintaining asset.
      *   *Bucket:* **Divergence**. (One can feel harassed even if the other intends maintenance).
  3.  **Documentary Trace:**
      *   *Tenant:* Personal log (subjective record).
      *   *Landlord:* Work orders (objective record for 9 visits).
      *   *Bucket:* **Convergence** (on the 9 orders), **Indeterminacy** (on the other 8).
  4.  **Compatibility Check:**
      *   Can "Harassment" and "Maintenance" coexist? Yes. Poorly executed maintenance can feel like harassment.
      *   Can "17 visits" and "9 orders" coexist? Yes, if 8 visits were unrecorded or for other reasons.
  5.  **Indeterminacy:**
      *   Did the landlord enter the other 8 times? If so, why? Was notice given for those specific times?

  #### Step 2: Draft the Summary (The Syād-Statement)

  > **Case Context Statement**
  >
  > **1. Shared Context (Convergence)**
  > Both parties acknowledge a landlord-tenant relationship exists at [Address]. The Landlord's records confirm nine (9) maintenance work orders were generated between [Date] and [Date]. The Tenant's records indicate seventeen (17) instances of property entry or attempted entry during the same period.
  >
  > **2. Divergent Experiences (Divergence)**
  > *   **Regarding Intent:** The Landlord states the purpose of entry was to fulfill maintenance obligations and preserve the property. The Tenant states the frequency and manner of entry created an environment of insecurity and intrusion.
  > *   **Regarding Notice:** The Landlord states notice was provided in accordance with lease terms for scheduled work. The Tenant states that for multiple entries, no prior notification was received.
  >
  > **3. Unresolved Disputes (Indeterminacy)**
  > There is a discrepancy regarding eight (8) visits logged by the Tenant that do not correspond to Landlord work orders.
  > *   The Tenant states these visits occurred without notice and without emergency justification.
  > *   The Landlord states no such visits were authorized or occurred.
  > *   *Mediation Goal:* To determine a protocol for future entry that satisfies the Landlord's maintenance requirements and the Tenant's need for privacy.

  #### Why this works:
  *   It doesn't call the tenant a liar (their log is acknowledged).
  *   It doesn't call the landlord a liar (their work orders are acknowledged).
  *   It isolates the "8 missing visits" as the specific problem to solve, rather than a general "he said/she said."
  *   It validates the *feeling* of harassment without legally adjudicating whether harassment law was broken.

  ---

  ### Case Walkthrough 2: Business Partners
  **The Dispute:** Binding Handshake Deal vs. Bar Talk.

  #### Step 1: Run the Diagnostic Questions
  1.  **Physical Anchor:** Did a meeting at a bar occur?
      *   *Answer:* Yes. Both agree.
      *   *Bucket:* **Convergence**.
  2.  **Internal State:**
      *   *Partner A:* Understood the handshake as finalizing a contract.
      *   *Partner B:* Understood the handshake as ending a conversation.
      *   *Bucket:* **Divergence**.
  3.  **Documentary Trace:**
      *   *Evidence:* None (Verbal, after drinks).
      *   *Bucket:* **Indeterminacy**.
  4.  **Compatibility Check:**
      *   Can two people walk away with different understandings of the same handshake? Yes. This is a classic "meeting of the minds" failure.
  5.  **Indeterminacy:**
      *   Were dollar amounts discussed? A says yes, B says no. No recording exists.

  #### Step 2: Draft the Summary (The Syād-Statement)

  > **Case Context Statement**
  >
  > **1. Shared Context (Convergence)**
  > The parties have an existing business relationship. On [Date], the parties met at [Location] to discuss the future of the business. Both parties acknowledge the conversation concluded with a handshake.
  >
  > **2. Divergent Understandings (Divergence)**
  > *   **Regarding the Agreement:** Partner A understands the handshake to signify a binding commitment to expand the business under specific terms. Partner B understands the handshake to signify a willingness to continue exploring the idea, without binding commitment.
  > *   **Regarding Terms:** Partner A recollects that specific financial figures were discussed and agreed upon. Partner B recollects that financial figures were not finalized.
  >
  > **3. Unresolved Disputes (Indeterminacy)**
  > There is no written record or third-party witness to the specific content of the verbal agreement.
  > *   It is undisputed that alcohol was consumed during the meeting, which may have impacted the clarity of communication.
  > *   *Mediation Goal:* To decide whether to formalize the expansion based on Partner A's understanding, Partner B's understanding, or a new structure entirely.

  #### Why this works:
  *   It removes the moral judgment of "reneging on a deal."
  *   It frames the alcohol consumption as a contextual fact ("impacted clarity"), not an accusation ("they were drunk").
  *   It shifts the mediation from "Who is telling the truth?" (which they will fight forever) to "What structure do we want now?" (which is solvable).
  *   It uses *syādvāda* language: "Partner A understands..." vs "Partner B understands..." rather than "The agreement was..."

  ### Implementation Notes for the Mediator

  **1. Handling the "But that's a lie!" Objection**
  If a party reads the summary and says, "You wrote 'Partner B understands,' but he *knows* he agreed!", you reply:
  *"This document is not a court finding. It is a map of the terrain we are walking into. If I write 'He agreed,' he will not sign this, and we cannot start. By writing 'He understands,' we preserve your truth for the mediation room, where you can present your evidence."*

  **2. The Time Limit**
  To keep this under an hour:
  *   Spend 15 mins reviewing intake notes.
  *   Spend 15 mins drafting using the 3 Buckets.
  *   Spend 15 mins reviewing against the Safety Check.
  *   Spend 15 mins buffering for edits.
  If you get stuck on the **Indeterminacy** bucket, stop. That is the exact issue they need to mediate. Do not try to solve it in the summary.

  **3. The Philosophical Shift**
  You are not asking them to agree on the *past*. You are asking them to agree on a *description of their disagreement*. This is the essence of *anekāntavāda*. The summary says: "Here is where your truths overlap, here is where they run parallel, and here is where they crash. We accept all three as the starting line."
