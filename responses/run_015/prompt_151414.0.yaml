  2.  **Deconstruct the Philosophical Tension:**
      *   *Premise 1 (Relativism):* We call "barbarous" anything not our own custom. There is no objective standard.
      *   *Premise 2 (Universalism):* Eating the dead is less bad than torturing the living (rack/quartering). This implies an objective standard of suffering/cruelty.
      *   *The Tension:* If everything is relative, how can you say one is *actually* worse? If one is *actually* worse, then not everything is relative.
      *   *The User's Insight:* Montaigne might be using relativism strategically to critique Europe, not because he believes in pure relativism.

  3.  **Drafting the Joke (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* Montaigne meets a Cannibal. Cannibal asks, "So, am I bad?" Montaigne says, "No, customs vary." Cannibal says, "Great, let's eat this prisoner." Montaigne says, "Wait, that's gross." Cannibal says, "I thought you were a relativist!" Montaigne says, "I am, but my people torture, so you're better."
      *   *Critique 1:* Too on the nose. A bit lecture-y. Needs more character voice.
