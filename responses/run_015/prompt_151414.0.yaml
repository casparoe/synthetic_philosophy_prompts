answer: |-
  **Title:** The Noble Savage Focus Group

  **Characters:**
  *   **MICHEL:** A French essayist. Anxious, holding a quill, trying to have it both ways.
  *   **TOPI:** A Tupinambá captain. Pragmatic, holding a spear, currently marinating a prisoner.

  **Setting:** A campfire in Brazil. MICHEL is sitting on a log, looking uncomfortable. TOPI is gesturing at a bound prisoner nearby.

  **TOPI:**
  So. We kill him. Then we roast him. Then we eat him. You put this in the newsletter?

  **MICHEL:**
  (Scratching nervously)
  In the *Essays*, yes. But I'm framing it carefully. I'm going to start by saying that "barbarism" is just a word people use for anything they aren't used to. So, culturally speaking, this is fine. It's your custom. Who am I to judge?

  **TOPI:**
  Good. Because we're hungry.

  **MICHEL:**
  Right, right. But then... in paragraph four... I need to pivot.

  **TOPI:**
  Pivot?

  **MICHEL:**
  Yes. See, I want to use this moment to criticize the French Inquisition. So I'm going to argue that while eating a dead body is *technically* barbaric by Parisian standards, burning a man alive on the rack because he prayed to the wrong saint is *objectively* worse.

  **TOPI:**
  (Pauses)
  Wait. I thought you said no one is barbaric. Just different.

  **MICHEL:**
  Descriptively, yes. But normatively... look, if I'm going to shame the King of France, I need you to be the "Noble Savage." I need you to be morally superior to the Pope.

  **TOPI:**
  So I'm superior?

  **MICHEL:**
  In this specific instance of cruelty, yes.

  **TOPI:**
  But if I'm superior, that means there's a scale. And if there's a scale, then eating people isn't just "different," it's either high on the scale or low on the scale.

  **MICHEL:**
  (Waving hand vaguely)
  It's a *flexible* scale. It's more of a moral spiral.

  **TOPI:**
  Michel. Are you saying torture is wrong everywhere?

  **MICHEL:**
  (Hesitates)
  Well... it seems worse. Everywhere.

  **TOPI:**
  So morality is real.

  **MICHEL:**
  Don't say "real." Say "natural law."

  **TOPI:**
  Okay. If morality is real, and eating this guy is less bad than torture, does that mean we can stop eating him? Maybe just torture him instead? Since you seem to hate that more, maybe that makes us look *more* noble?

  **MICHEL:**
  (Panic)
  No! No, you must eat him! If you stop eating him, the whole analogy collapses! I need you to be cannibals! Just... *enlightened* cannibals!

  **TOPI:**
  So I'm a monster, but I'm a better monster than your priest?

  **MICHEL:**
  (Exhales, relieved)
  Yes! Exactly! You're a virtuous monster. It's a niche market.

  **TOPI:**
  (Sighs, turns to prisoner)
  Sorry about this. The Frenchman says my cultural identity depends on your digestion.

  **MICHEL:**
  (Writing furiously)
  "And thus, we may indeed call them barbarians, but only insofar as they lack the light of reason... unlike ourselves, who are barbarians in the light of reason..." (Stops) Wait, does that make sense?

  **TOPI:**
  (Chewing)
  Tastes like hypocrisy.

  **MICHEL:**
  No, that's the thyme. Keep eating. I'm almost at the punchline.

  ***

  ### Study Note: Montaigne's "Of Cannibals"

  **What is Settled:**
  1.  **The Definition of Barbarism:** Montaigne explicitly defines "barbarism" as that which is contrary to custom, not necessarily contrary to reason or nature. He argues that Europeans are quick to label the Tupinambá as barbarians simply because their customs differ.
  2.  **The Critique of Europe:** Montaigne unequivocally argues that European acts of violence (specifically religious wars and judicial torture like breaking on the wheel) involve more "horror" and cruelty than the Tupinambá practice of ritual cannibalism. He views the Tupinambá motivation (revenge/valor) as more "natural" than European motivation (greed/religious dogma).
  3.  **The Rhetorical Goal:** There is consensus that Montaigne's primary goal was not anthropological accuracy, but a critique of 16th-century French society. The Tupinambá serve as a mirror to show Europeans their own corruption.

  **What is Contested (The Tension in the Joke):**
  1.  **Relativist vs. Humanist:**
      *   *The Relativist Reading:* Some argue Montaigne is an early cultural relativist, suggesting all moral codes are equally valid within their context.
      *   *The Humanist/Natural Law Reading:* Others (like your interpretation) argue Montaigne is *not* a true relativist. He believes in "Natural Law" (universal reason). He uses relativism strategically to strip away European prejudice so that Natural Law can judge Europe more harshly. When he says European torture is "worse," he is sneaking in a universal claim about suffering, contradicting pure relativism.
  2.  **The "Noble Savage":** Scholars debate whether Montaigne genuinely idealized the Tupinambá or if he was fully aware he was constructing a literary device (the "Noble Savage") to make his point.

  **Where the Joke Takes Liberties:**
  *   **Montaigne's Confidence:** In the essay, Montaigne writes with considerable rhetorical confidence. The joke portrays him as confused or floundering in real-time. In reality, the contradiction is likely a calculated rhetorical move, not an accidental slip-up.
  *   **The Interaction:** Montaigne did meet Tupinambá people (in Rouen, not Brazil), but the dialogue is fictionalized. He didn't ask their permission to use them as rhetorical devices (though the joke implies a collaborative confusion).
  *   **The "Universal" Claim:** The joke highlights the contradiction for comedic effect. In the text, Montaigne smooths this over by appealing to "reason" and "nature." He argues the cannibals are closer to nature (and thus closer to universal truth), whereas Europeans are corrupted by artifice. This allows him to be a relativist about *customs* but a universalist about *cruelty*.
