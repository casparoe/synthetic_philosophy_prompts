  The hidden machinery:
  There is a buried empirical question, but it isn't about interhemispheric communication per se. It is about subcortical integration. Most models assume severing the corpus callosum isolates the hemispheres completely. However, subcortical structures like the thalamus or brainstem might maintain a unified field of awareness even when cortical communication is cut. If consciousness relies on subcortical binding, the 'two minds' claim collapses empirically, regardless of cortical isolation. This possibility is often ignored because it complicates the clean split-brain model.

  Formally, the disagreement hides a lack of a metric for subjecthood. We measure information flow and behavioral output, but we have no formal threshold for when modular independence becomes distinct subjectivity. We are trying to count souls using bandwidth metrics. The hidden machinery is the assumption that cognitive modularity maps one-to-one onto subjectivity. If information integration theory holds, consciousness is a matter of degree, not a binary count. The stalemate persists because researchers are looking for a switch (one or two) in a system that operates on a dimmer (integration levels). The empirical gap is measuring the quality of integration, not just the presence of communication.

  Could it end?:
  Progress won't come from another conflict task or verbal clarification. It requires dissolving the binary question entirely. We should stop asking 'how many consciousnesses' and start mapping degrees of functional agency versus phenomenological unity. A decisive shift would require isolating subcortical activity during hemispheric conflict to see if a unified signal persists despite cortical separation. However, the deadlock is likely permanent because the core question is metaphysical. We are asking for a count of entities where there is only a gradient of integration. The field should move toward describing specific dissociations rather than tallying subjects. Real progress looks like abandoning the count and describing the architecture of access. We need a new vocabulary that doesn't presuppose indivisible subjects.

  Bottom line:
  It's a category error. You're asking a metaphysical question about a biological gradient. The stalemate won't break because there is no fact of the matter to find. The system is integrated enough to act as one, fragmented enough to report as two. Stop counting consciousnesses; map the integration constraints and accept the ambiguity.
