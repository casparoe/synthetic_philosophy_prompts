      *   *(2) & (6):* The "Empirical/Doxastic" tension. If belief aims at truth, and some contradictions are true, why are empirical contradictions excluded (2)? If an empirical theory is inconsistent, (2) says revise it. But (6) says believe what is true. How do you know *a priori* that an empirical contradiction isn't true? This looks like a double standard.
