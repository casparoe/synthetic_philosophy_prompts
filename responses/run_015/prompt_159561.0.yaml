      *   *Focus on (3)+(4)+(8):* This is the "Priest's Problem" (though Priest adds a determinacy operator later). In pure LP, $A \models B$ holds if whenever $A$ is designated, $B$ is designated. If $v(A) = b$, $v(\neg A) = b$. There is no formula $\phi(A)$ that is $t$ when $A$ is $t$ and $f$ when $A$ is $b$. So (8) is mathematically false given (3) and (4).
      *   *Focus on (1)+(5):* If LNC is not a law of logic (1), then classical metatheory (which assumes LNC) is reasoning with a false law. The user says "domains I have reason to believe are consistent." But the metatheory is about the *logic*, which governs *all* domains, including the inconsistent ones. If the logic allows gluts, the metatheory should reflect that possibility, or it risks proving things that aren't "really" true.
