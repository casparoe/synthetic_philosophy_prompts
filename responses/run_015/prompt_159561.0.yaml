      *   *For Empirical:* Admit empirical contradictions are *possible* but *unlikely*. Cost: Looks less commonsensical. Benefit: Consistency with (1) and (6).

  7.  **Selecting the "Silver Bullet":**
      *   Revising (4) to allow a determinacy operator (or acknowledging the expressive limitation) fixes the Expressive Inadequacy (Severity 1). This allows (8) to be coherent. It also helps with (2) because you can actually state the restriction. It doesn't fix the Metatheory issue, but it fixes the internal coherence of the semantic claims.
      *   *Wait, actually:* The biggest structural issue is the Classical Metatheory (5) combined with Dialetheism (1). If classical logic is wrong, your proofs are suspect. However, the *most* technically damaging is the Expressive Inadequacy (3+4+8). You literally *cannot* say what you want to say in (8) with the tools in (3) and (4).
