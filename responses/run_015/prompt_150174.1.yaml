answer: |-
  **TO:** Allocations Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Finalists A and B + Future Evaluation Rules

  **Bottom Line**
  I recommend we fund Grant A ($600k) immediately and decline Grant B. We should communicate this to B by Friday, offering feedback that their model requires empirical grounding before it can support capital allocation. We need to finalize this Thursday to meet our deployment timeline.

  **The Decision**
  We are choosing between robustness and fragility. Grant A offers an expected value (EV) of 0.24 units backed by randomized trials. The error bars are wide, but the number is stable. Grant B offers a modeled EV of 0.69 units, but that number is an artifact of how the data is sorted, not a property of the project itself.

  **The Strongest Case for B**
  We must acknowledge why B is tempting. Their model isn't a simple "Pascal's Mugging" with vanishingly small probabilities. It presents a structured sequence where every finite step looks better than A. If you calculate the value after the first outcome, then the first two, then the first three, the running total never dips below 0.5. Since 0.5 is double A's 0.24, rejecting B looks like cowardice. It looks like we are capping our upside because we are uncomfortable with complex math. If we claim to be effective altruists who follow the numbers, B's spreadsheet literally displays higher numbers than A's at every checkpoint. Ignoring that feels like ignoring evidence.

  **Why We Must Reject B**
  The issue isn't that B's number is uncertain; it's that the number doesn't exist. In standard arithmetic, if you add a pile of positive numbers and a pile of negative numbers, and both piles are infinite, the total is undefined. You can get any answer you want simply by changing the order in which you add them.

  B's model relies on sorting outcomes by probability. But outcomes in an advocacy campaign don't happen in a sequence sorted by probability. They happen simultaneously or in causal chains unrelated to likelihood. If we shuffle the rows in B's spreadsheet—which we have no reason not to do—the EV jumps to 1.04, drops to 0.35, or runs to infinity.

  Think of it like counting cash. If you count the bills in one order, you have $0.69. If you count them in another order, you have $1.04. If the total depends on the order you count, you don't actually know how much money you have. A's value is a property of the intervention; B's value is a property of the spreadsheet. We cannot allocate capital based on spreadsheet artifacts.

  **Standing Rule for Future Cycles**
  We need a heuristic reviewers can apply without a seminar in decision theory. My previous hack—checking stability across truncation horizons—collapses here. B's series *is* stable across horizons (it converges to 0.69 in their ordering), so that test would falsely approve it.

  Instead, adopt the **Separate Convergence Rule**:
  1.  Applicants must sum all positive outcome values separately from all negative outcome values.
  2.  If either the positive sum or the negative sum grows without bound as more scenarios are added (i.e., diverges), the project is ineligible for EV-based comparison.
  3.  Both sums must be finite numbers for the net expectation to be valid.

  This is spreadsheet-friendly. It forces applicants to demonstrate that their upside and downside are both bounded quantities before claiming a net value.

  **What Would Change Our Mind**
  There are two specific analyses that could flip this recommendation to funding B:

  1.  **Natural Ordering:** If B can demonstrate that the outcomes occur in a specific temporal sequence that matches their probability sorting. If the "big win" necessarily happens before the "big counter-mobilization" in real time, the ordering is no longer arbitrary. The math would then reflect causal reality, not just list management.
  2.  **Empirical Bounds:** If B can provide historical data from similar advocacy campaigns showing that the payoff scales sub-linearly with visibility, capping the divergence. If the "infinite" upside is actually bounded by real-world constraints (e.g., total budget of the opposing side), the series converges absolutely, and the EV becomes real.

  **Where This Memo Could Be Wrong**
  My reasoning assumes that Expected Value is the only metric we care about. If our fund's mandate is specifically to take high-risk shots where standard decision theory breaks down—essentially buying lottery tickets on undefined distributions—then B is exactly the kind of asset we should hold. If we believe that "undefined expectation" is a feature of high-leverage environments rather than a bug, then rejecting B is a failure of nerve. However, given our fiduciary duty to deploy $3M effectively, relying on undefined quantities sets a precedent that invites gaming in future cycles.

  Let's lock in A and protect the fund's integrity.
