      *   **Steelman B:** Acknowledge that under their specific logic, B looks better at every step. It's not a "low probability high impact" trick; it's a structured model where the "average" case looks good. Rejecting it feels like capping upside.
      *   **Why A Wins:** Robustness vs. Fragility. B's value is an artifact of spreadsheet ordering, not reality.
      *   **Standing Rule:** The "Absolute Convergence" rule. Positive EV and Negative EV must both be finite numbers. If either is infinite, the net is undefined. Test: Truncate at 100, 1000, 10000 outcomes. If the rank changes, reject.
      *   **What Would Change Our Mind:** If B can show a causal mechanism that imposes a *natural* ordering (e.g., outcomes happen sequentially in time, not simultaneously). If the "counter-mobilisation" logic is empirically grounded rather than algebraic.
      *   **Vulnerability:** The memo assumes EV is the only metric. If we are risk-seeking enough to gamble on undefined expectations, B might be a lottery ticket worth buying.

