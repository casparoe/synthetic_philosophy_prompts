      *   *Mom's View (Compassion/Rescue):* Focuses on the "euthanized" outcome avoided. To her, the moral good of saving a life outweighs the risk. This is a utilitarian or care ethic.
      *   *Sister's View (Management/Process):* Focuses on the "low-risk under professional supervision with muzzling" clause. She believes risk can be mitigated through procedure. This is a technocratic or risk-management ethic.
