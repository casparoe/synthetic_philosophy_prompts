llet points, no bold text, no tables, just like a long email. Don't ask me for a bibliography or reading list, and don't include citations—I'm testing this on a model that can't search the web, so everything needs to come from reasoning and general knowledge. There's probably an occurence or two of sloppy typing in my message but you get the gist. Start with the brainstorming, then move into the ordered objections with the replies and weaknesses.
