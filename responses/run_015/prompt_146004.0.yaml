          *   Why does it look like substitution? Because the individual goes free (sometimes) while the entity pays.
          *   Why is it not substitution? Because the entity is independently liable for the *conditions* that allowed the crime.

      *   **Avoiding Lewis's Objection:**
          *   Lewis objects to the *transfer of desert*.
          *   This model rejects the transfer. It posits *dual liability*.
          *   Individual: Liable for the act.
          *   Corporation: Liable for the systemic failure.
          *   The "substitution" is merely functional (resources used to pay the fine could have been bonuses), not metaphysical (guilt didn't move).

      *   **The Philosophical Commitment (Collective Moral Agency):**
          *   What must we believe for this to work?
