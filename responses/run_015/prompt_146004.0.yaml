      *   *Distinction:* "Vicarious Liability" in law often sounds like "Company pays for Employee's sin." The prompt asks to reframe this as "Structural Accountability."
      *   *Mechanism:* The corporation is punished *as a corporation* for failing to prevent the harm, not because it "absorbed" the employee's guilt. The penalty *functions* like a substitute (money paid instead of jail time for the individual), but the *justification* is different.

