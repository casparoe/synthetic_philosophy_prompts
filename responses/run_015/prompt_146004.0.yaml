answer: |-
  David Lewis, in his essay "Do We Believe in Penal Substitution?", argues that the logic of ordinary criminal justice precludes the transfer of penal liability from a guilty party to an innocent volunteer. For Lewis, punishment is essentially tied to personal desert; one cannot discharge another's guilt because guilt is not a transferable debt but a state of moral culpability rooted in the agent's own will and actions. While Lewis uses this to problematize theological accounts of atonement, his constraint offers a rigorous framework for defending a restricted form of institutional vicarious liability. By repurposing Lewis's rejection of *desert transfer*, we can defend the claim that corporations may justly bear penalties that functionally substitute for individual punishment, provided these penalties are understood as **structural accountability** rather than **penal substitution**. This distinction avoids Lewis's core objection by rejecting the metaphysics of guilt-transfer, but it requires a specific philosophical commitment to **non-reductive collective moral agency**.

  ### Lewis's Core Objection: The Non-Transferability of Desert

  Lewis's argument rests on the intuition that punishment is not merely the infliction of pain or cost, but the imposition of a burden *because* of wrongdoing. In ordinary criminal justice, the justification for punishment is retributive or consequentialist, but in both cases, it requires a link between the sufferer and the offense. If an innocent volunteer offers to serve a prisoner's sentence, Lewis argues, the prisoner remains guilty and the volunteer remains innocent. The volunteer's suffering does not "cancel out" the prisoner's liability because moral guilt is not a quantifiable substance that can be shifted from one container to another.

  Consequently, any system that treats an innocent party's suffering as a discharge of a guilty party's liability violates the fundamental logic of justice. It treats persons as mere means to an end (satisfaction of the penalty) rather than as moral agents responsible for their own deeds. If institutional vicarious liability is interpreted as the corporation (the volunteer) absorbing the guilt of the employee (the offender), Lewis's objection renders it unjust. The corporation, if viewed as a mere aggregate of innocent shareholders or a distinct entity without its own culpability, would be an innocent volunteer suffering for another's sin.

  ### Repurposing Lewis: From Substitution to Structural Accountability

  To defend institutional liability without violating Lewis's constraint, we must reject the characterization of corporate penalties as "substitution" in the penal sense. Instead, we must reframe the penalty as the satisfaction of the corporation's *own* independent liability.

  In this model, when a corporation pays a fine for an employee's misconduct, it is not acting as an innocent volunteer discharging the employee's debt. Rather, the corporation is being punished for its own distinct failure: the failure of its structure, culture, or oversight to prevent the misconduct. The penalty *functionally substitutes* for individual punishment only in the sense that financial resources are expended to settle the legal dispute, often sparing the individual from the full brunt of the law (e.g., via deferred prosecution agreements). However, the *justification* for the penalty is not that the corporation took the employee's guilt, but that the corporation generated the conditions of possibility for the crime.

  This aligns with Lewis's requirement because the "sufferer" (the corporation) is not innocent in the relevant moral sense. It is liable for **structural negligence**. The fine is not a transfer of the employee's desert; it is the corporation's own desert for maintaining a harmful environment. Lewis objects to the *transfer of personal desert*; he does not object to multiple parties bearing liability for a single event based on their distinct contributions to it. By shifting the focus from "vicarious suffering" to "structural accountability," we preserve the link between the punished entity and its own wrongdoing.

  ### Avoiding Lewis's Objection

  This approach avoids Lewis's core objection by dismantling the premise that the corporation is an "innocent volunteer." Lewis's argument holds only if the entity bearing the penalty lacks its own culpability. If the corporation is merely a legal fiction shielding shareholders, then fining the corporation is indeed punishing innocents for the acts of a few, which Lewis would rightly condemn as unjust vicarious punishment.

  However, if the penalty is justified by the corporation's *structural complicity*, Lewis's objection loses its grip. The corporation is not saying, "I am innocent, but I will take your punishment." It is saying, "My structure facilitated your crime, and I am liable for that facilitation." The penalty is not a mystical absorption of the employee's guilt; it is a rectification of the corporation's own institutional failure. Thus, the "substitution" is merely economic and functional (the corporation pays the money the individual cannot), not moral or metaphysical. The moral desert remains with the individual for the act, and with the corporation for the context. This dual-liability model respects Lewis's insistence that guilt cannot be transferred, because no transfer occurs; rather, distinct grounds for liability converge on a single event.

  ### The Required Philosophical Commitment

  For this defense to hold, one must explicitly commit to a robust theory of **non-reductive collective moral agency**.

  If one holds to *reductive individualism* (the view that collective actions are nothing over and above the sum of individual actions), then the corporation cannot possess independent culpability. Under reductive individualism, a corporate fine is inevitably a fine on the aggregate of individuals (shareholders, employees), most of whom are innocent of the specific wrongdoing. In this scenario, Lewis's objection returns with full force: the innocent are suffering for the guilty.

  To sustain the argument for structural accountability, one must accept that:
  1.  **Corporations possess a corporate will:** Policies, cultures, and decision-making structures constitute a form of agency that is distinct from, though constituted by, individual members.
  2.  **Corporations can be direct subjects of moral predicates:** A corporation can be negligent, reckless, or complicit in a way that is not reducible to the specific mental states of any single employee.
  3.  **Structural faults are moral faults:** The failure to institute adequate safeguards is a moral failing of the collective agent itself, generating independent desert.

  Without this commitment, the corporation remains a "innocent volunteer" in Lewis's sense, and any penalty imposed upon it becomes an unjust instance of penal substitution. With this commitment, the corporation is a co-responsible moral agent, and the penalty is a just demand for structural accountability.

  ### Conclusion

  David Lewis's rejection of penal substitution serves as a vital guardrail for institutional justice. It forbids the magical thinking that guilt can be shifted from one agent to another. However, by repurposing this constraint, we can defend a form of institutional liability that respects the non-transferability of desert. By framing corporate penalties as **structural accountability** rather than vicarious substitution, we ensure that the punished entity is liable for its own structural failures, not merely the acts of its employees. This position is philosophically viable only if we commit to **non-reductive collective moral agency**, acknowledging that corporations are genuine moral agents capable of independent culpability. In doing so, we satisfy Lewis's demand for justice while retaining the legal mechanisms necessary to hold powerful institutions accountable.
