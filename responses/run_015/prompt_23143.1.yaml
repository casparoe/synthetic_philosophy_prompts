  5.  **Tackle Mereological Addition (Unrestricted Fusion):**
      *   *Principle:* For any $X$s, there exists a $Y$ such that $Y$ is the fusion of $X$s.
      *   *User's Confusion:* Isn't this just assuming Universalism?
      *   *Clarification:* In formal mereology (math), it's an axiom. In metaphysics, it's a substantive claim about reality.
      *   *Relation to SCQ:* Accepting the axiom *is* answering the SCQ with "Always."
      *   *Tension:* Nihilists reject the axiom. Moderates reject the axiom (or restrict its application).
      *   *Triviality:* It's formally trivial in a system that assumes it, but ontologically heavy. It commits you to "gerrymandered objects" (e.g., the fusion of the Moon and a specific quark in my finger).

  6.  **Develop Concrete Examples (Chemist/Physicist Focus):**
      *   *Swarm of Birds:*
          *   Nihilist: Just birds. No "swarm object."
          *   Universalist: Birds + "Swarm" + "Swarm+Leftmost Bird" + etc.
          *   Moderate: "Swarm" exists if cohesion/interaction meets threshold.
          *   *Problem:* Threshold is vague. Is a loose flock a swarm?
      *   *Composite Material (e.g., Carbon Fiber Epoxy):*
          *   Parts: Fibers, Resin.
          *   SCQ: Do they compose a "material object" distinct from the parts?
          *   Phase Boundary: Is the boundary part of the object? Do the two phases compose one object or two touching objects?
      *   *Molecule vs. Crystal:*
          *   Water molecule ($H_2O$). Ice crystal.
          *   Where does the molecule end and the lattice begin? Hydrogen bonds are weaker than covalent but stronger than van der Waals.
