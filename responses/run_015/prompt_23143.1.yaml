      *   *Correction:* No, keep it general. The user asked for a conceptual map, not a survey. Focus on the *structure* of the debate (Vagueness/Arbitrariness) rather than specific philosophers' names, though Van Inwagen is hard to avoid completely with "Life." I'll stick to the *types* of constraints (bonding, function) rather than specific authors.
      *   *Clarification on Addition:* Make sure to explain that "Addition" in mereology is like "Union" in set theory, but ontological. If I accept Unrestricted Fusion, I accept that "The Moon + My Left Shoe" is an object. To a scientist, this sounds absurd. To a universalist, it's just a region of spacetime occupied by matter. This highlights the divergence in intuition.

