  7.  **Address the "Classificatory Interests" vs. "Fact of the Matter" Debate:**
      *   This is the crux for a scientist.
      *   *Realist:* There is a fact about whether composition occurs, independent of us.
      *   *Anti-Realist/Conceptualist:* Composition is a way we carve up the world.
      *   *Moderate Dilemma:* If you say "bonding" determines composition, nature gives a continuum. Picking a point looks arbitrary (interest-relative). If you say "no arbitrary cutoffs," you slide to Universalism or Nihilism.

