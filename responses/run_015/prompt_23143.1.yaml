          *   **Concrete Examples:** Swarm of birds, composite material, phase boundary (tailored to chemist background).
      *   **Goal:** A clear conceptual map, not a survey of every position. Highlight genuine disagreement vs. terminological issues.

  2.  **Deconstruct the Special Composition Question (SCQ):**
      *   *Standard Formulation:* Under what conditions do some things $X$s compose something $Y$?
      *   *User's Intuition:* "If I see a table, the legs and top compose a table. If I see a pile of sand, do they compose a 'pile'?" To a scientist, this often looks like a question of stability, interaction, or classification.
      *   *Philosopher's Worry:* Is the "one thing" *ontologically real* or just a convenient label? If I take the atoms in my body and the atoms in my chair, do they compose a single object "Body-Chair"? Physics says they interact, but metaphysics asks if there is a *single entity* over and above the atoms.
      *   *Key Distinction:* SCQ is about *existence*, not *identification*. It's not "Is this a chair?" It's "Does *anything* exist here composed of these parts?"

  3.  **Address the "Recognizable Object" vs. "Composition" Distinction:**
      *   Scientist view: Objects are defined by properties (phase, function, structure).
      *   Metaphysician view: Before asking about properties, does the *entity* exist?
      *   Example: A scattered object (e.g., the set of all red things). Do they compose a "red-object"?
      *   The "One Thing" issue: Plurality vs. Unity. When does many become one?

  4.  **Map the Major Positions (The "Conceptual Map"):**
      *   *Nihilism:* Only simples exist. No composition ever. (The "many" never become "one").
      *   *Universalism (Unrestricted Composition):* Any plurality composes a whole. (The "many" always become "one").
      *   *Moderate Restrictivism:* Somewhere in between. (Contact, bonding, function, etc.).
      *   *The User's specific worry:* Why are moderate views accused of being "interest-relative"?
