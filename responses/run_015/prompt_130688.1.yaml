answer: |-
  # The Saint Problem: A Taxonomy of Desirability

  **Root Question:** Is there a point where becoming "more moral" stops making you a better person?
  *(This splits the **Supremum** view [moral improvement is infinite] from the **Maximum** view [there is a top score].)*

  *   **NO (There is a peak; improvement stops):**
      *   **Q1:** Is that peak high enough to count as a "Saint"?
          *   **Yes** → **Leaf 1: The Comfortable Saint**
              *   *Awkward Commitment:* "Saint" is just a fancy word for "decent person"; there is no high moral ideal that demands sacrifice.
          *   **No** → **Leaf 2: The Optimal Sinner**
              *   *Awkward Commitment:* Being morally better than this specific point actually makes you a *worse* human being overall.

  *   **YES (Improvement is always better; no peak):**
      *   **Q2:** Is the problem that *your* life gets worse, or that *society* gets worse?
          *(This splits **Agent-Centered** costs from **Collective** costs.)*

          *   **MY LIFE (Agent-Centered):**
              *   **Q3:** If money and time were no object, would a Saint still have to give up their hobbies?
                  *(This splits **Scarcity** conflicts from **Constitutive** conflicts.)*
                  *   **No (Scarcity):** **Q4:** Is this scarcity fixable in principle?
                      *   **Yes** → **Leaf 3: The Contingent Martyr**
                          *   *Awkward Commitment:* Morality is only hard because the world is broken; in a just world, being good is easy.
                      *   **No** → **Leaf 4: The Tragic Hero**
                          *   *Awkward Commitment:* You must suffer to be good, even in paradise; suffering is a necessary ingredient of virtue.
                  *   **Yes (Constitutive):** **Q5:** What exactly gets crushed by saintliness?
                      *   **Your Happiness** → **Leaf 5: The Happy Miser**
                          *   *Awkward Commitment:* You must enjoy sacrificing yourself, which makes the sacrifice feel less noble.
                      *   **Your Excellence** → **Leaf 6: The Moral Monoculture**
                          *   *Awkward Commitment:* Perfect morality requires flattening the self-absorbed drive needed for great art or science.

          *   **SOCIETY (Collective):**
              *   **Q6:** To be a Saint, must you break a promise if it saves a life?
                  *(This splits **Maximizing** theories from **Constraint/Virtue** theories.)*
                  *   **No (Constraints):** **Q7:** Does a world of rule-followers look grim?
                      *   **No** → **Leaf 7: The Virtuous Equilibrium**
                          *   *Awkward Commitment:* This view secretly relies on everyone else being less virtuous to work.
                      *   **Yes** → **Leaf 8: The Rigid World**
                          *   *Awkward Commitment:* A world where no one ever bends a rule is a world without mercy or flexibility.
                  *   **Yes (Maximizing):** **Q8:** Does a world of maximizers produce the best outcomes?
                      *   **Yes** → **Leaf 9: The Utilitarian Utopia**
                          *   *Awkward Commitment:* This utopia looks like a well-run prison camp to anyone who values individual liberty.
                      *   **No:** **Q9:** Why does the world of Saints fail?
                          *   **We need non-moral specialists** → **Leaf 10: The Division of Labor**
                              *   *Awkward Commitment:* We need some people to be morally mediocre so others can make art.
                          *   **Saints are ineffective** → **Leaf 11: The Self-Undermining Saint**
                              *   *Awkward Commitment:* Being perfectly good makes you too weird to influence anyone else.
                          *   **Everyone burns out** → **Leaf 12: The Burnout World**
                              *   *Awkward Commitment:* A world of saints collapses because everyone exhausts themselves trying to save everyone.

  ***

  ### Notes on the Terrain (For Discussion Leaders)

  **1. The "Max vs. Supremum" Branch (Root)**
  This is not a pseudo-problem. If moral goodness is a **Supremum** (an asymptotic limit you can approach but never hit), then Leaf 1 and 2 are incoherent, and the question shifts from "Is it good to *be* a saint?" to "Is it good to *pursue* saintliness forever?" Leaf 12 (**The Eternal Pursuer**) captures this: the awkward commitment is that you must never feel morally satisfied, or you stop improving. If your group treats "Maximal Goodness" as a fixed state, this branch collapses, but you lose the distinction between *being* perfect and *chasing* perfection.

  **2. Division of Labor vs. Self-Undermining (Leaves 10 & 11)**
  These do **not** collapse, though they yield the same policy ("Don't make everyone a saint").
  *   **Leaf 10 (Division of Labor)** is about **Value Pluralism**. It claims non-moral goods (art, science, sport) require non-moral motivations (vanity, obsession) that saintliness forbids. The loss is *cultural*.
  *   **Leaf 11 (Self-Undermining)** is about **Instrumental Efficacy**. It claims saints are bad at *spreading* goodness (e.g., they are too alienating, or too trusting). The loss is *moral*.
  *   *Handout Tip:* If a student conflates them, ask: "If the saint was charming and persuasive, would you still want them to quit painting?" If yes, they are at Leaf 10. If no, they are at Leaf 11.

  **3. Empty or Unstable Combinations**
  *   **The Satisficing Saint (Leaf 1 + YES branch):** Incoherent. If there is a "peak" where improvement stops (Root: NO), you cannot hold that improvement is *always* better (Root: YES).
  *   **The Fixable Constitutive Conflict (Leaf 3 + Yes/Constitutive):** Unattractive/Unexplored. If the conflict is *constitutive* (the spirit of the hobby clashes with morality), more money/time shouldn't fix it. If money fixes it, it was a Scarcity problem, not Constitutive.
  *   **The Virtuous Maximizing Saint (Leaf 7 + Yes/Maximizing):** Incoherent. If you must break promises to save lives (Maximizing), you cannot be in a "Virtuous Equilibrium" based on rules.

  **4. Indistinguishable Leaves**
  *   **Leaf 4 (Tragic Hero) vs. Leaf 5 (Happy Miser):** These are hard to separate empirically. Both involve sacrifice. The distinction is phenomenological: Does the saint *suffer* (4) or *enjoy the sacrifice* (5)? If your group doesn't buy that psychological distinction, merge them into **"The Costly Saint."**
  *   **Leaf 8 (Rigid World) vs. Leaf 9 (Utilitarian Utopia):** Both describe a grim collective outcome. The split is theoretical (Rules vs. Outcomes). If your group is pragmatist, these will feel identical. Mark them as **"The Grim Collective"** with a footnote on the theoretical source.

  **5. Scope Sensitivity (Q2)**
  This is the most productive split for the group. A position can be consistent at **MY LIFE** (I should be a saint) but inconsistent at **SOCIETY** (Everyone being a saint is a disaster). This validates the intuition that "Morality is for me, but I don't want to live in a world of moralizers." Ensure students don't slide between these scopes mid-argument.
