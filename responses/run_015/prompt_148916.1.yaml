answer: |-
  1. Reconstructed Marxian Position

  Marx would likely view generative AI not as a neutral tool but as the crystallization of past social labor into fixed capital designed to dominate living labor. In his framework, machinery serves to increase relative surplus value by cheapening the necessities of life and intensifying the extraction of surplus labor time. However, the automation of cognitive tasks signals a shift where the general intellect—the collective knowledge and scientific capacity of society—is no longer merely a condition of production but is directly incorporated into the machine itself. This transforms social knowledge into a proprietary force wielded by capital against the worker. Consequently, the worker is not liberated from toil but displaced or subordinated to the algorithmic logic. The reduction of necessary labor time does not automatically translate to free time for the worker; instead, under capitalist relations, it manifests as unemployment, precariousness, or intensified monitoring. Marx would reject the notion that technology itself determines liberation. Instead, he would argue that the value form dictates the outcome. As long as production is organized around valorization rather than human need, the automation of creativity and affect serves to deepen the real subsumption of labor under capital, turning the worker's own intellectual powers into an alien power standing against them. The machine becomes the subject, and the worker the appendage. He would classify AI infrastructure as constant capital, which transfers value but creates none, while the humans training and refining these systems remain the variable capital source of new value. Furthermore, he might warn of a contradiction: value is grounded in socially necessary labor time. If AI drastically reduces the living labor required for production, it threatens the very source of surplus value, potentially precipitating crises of profitability despite increased productivity. The technology thus becomes a battleground where social relations constrain technological potential, ensuring efficiency gains serve accumulation rather than emancipation.

  2. Conceptual Application to Contemporary AI

  Applying these categories to large language models reveals a qualitative rupture rather than a mere quantitative extension of industrial machinery. Traditional machinery displaced muscular power while retaining the worker's conceptual control over the labor process. Cognitive automation, by contrast, expropriates the interpretive and creative faculties previously reserved for living labor. When an LLM drafts legal contracts or generates code, it objectifies the general intellect into a fixed asset that competes directly with high-skilled workers. This represents the enclosure of social knowledge; the collective linguistic and logical capacities of humanity are scraped, privatized, and sold back as a service. This shifts the dynamic from simple exploitation of labor time to the extraction of rent from proprietary algorithmic infrastructure. The affective automation of therapeutic or care-related dialogue further demonstrates the real subsumption of life itself, where human interaction is modeled and commodified. However, this is not a clean break. The system still relies on hidden living labor for data labeling, reinforcement learning, and maintenance, obscuring the human input required to sustain the illusion of autonomy. Therefore, while the form appears as autonomous intelligence, the substance remains grounded in exploited human activity. The claim that this liberates time is illusory within the current value form; instead, it creates a surplus population of cognitive workers whose skills are devalued, forcing them into lower-wage service roles or gig economy tasks that support the infrastructure displacing them. Ultimately, the technology exposes the contradiction between the potential for abundance and the rigid requirement for profit-driven employment, suggesting that the barrier to liberation is not technical capacity but social organization.

  3. Critical Assessment of the Reconstruction

  The strongest objection to this reconstruction is the risk of anachronism, imposing nineteenth-century industrial categories onto digital economies characterized by non-rivalrous goods and network effects. Marx's labor theory of value rests on socially necessary labor time as the measure of value, yet AI outputs can be replicated at near-zero marginal cost, decoupling price from labor input. This suggests that AI might function less as capital in the classical sense and more as a mechanism for rentier extraction based on monopoly control over data and compute, which Marx discussed less thoroughly. Additionally, the concept of the general intellect is fragmentary in Marx's unpublished notes, making any definitive reconstruction speculative. Critics might argue that data-dependent production involves a form of value creation based on user activity and behavioral surplus rather than direct wage labor, challenging the strict division between constant and variable capital. If value arises from network participation rather than factory discipline, the classic model of exploitation requires significant revision. Finally, attributing a coherent theory of AI to Marx risks ignoring his historical specificity; he analyzed steam and steel, not silicon. While his methodological critique of capital remains potent, applying his specific categories to non-material production may obscure unique dynamics of digital platforms that operate outside traditional commodity circulation.
