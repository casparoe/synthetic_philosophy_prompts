er would freely choose in a situation I never actually wrote and yet I am the one holding the pen so does my epistemic position as the author who sees the counterfactual choices across drafts occupy an analogous position to God or does the act of writing them down force the choice in a way that divine knowledge does not. It feels like if I know the path too well I might accidentally pave it and if God knows the path too well does he pave it too or is the knowledge just a mirror that reflects the freedom without touching it. There is a terror in being fully known because it feels like being fully determined and yet if the knowledge is pre-volitional it exists before the will moves so how can it cause the will to move without violating the very freedom it claims to preserve. We are here to see if knowing the outcome ruins the journey or if the journey is only real because the outcome was known before the first step was taken and whether the novelist who deletes a chapter where the hero dies is complicit in the hero living or just a witness to a different kind of necessity. So let us spend this weekend asking whether seeing the ghost of the choice you did not make haunts the choice you did make and whether freedom survives being known completely by someone else whether that someone is a deity or a reader or even the author trying to let go of the controls. Welcome to Vermont and let us get to work.

