us position to God or does the act of writing them down force the choice in a way that divine knowledge does not. It feels like if I know the path too well I might accidentally pave it and if God knows the path too well does he pave it too or is the knowledge just a mirror that reflects the freedom without touching it. We are here to see if knowing the outcome ruins the journey or if the journey is only real because the outcome was known before the first step was taken. So let us spend this weekend asking whether seeing the ghost of the choice you did not make haunts the choice you did make and whether freedom survives being known completely by someone else whether that someone is a deity or a reader or even the author trying to let go of the controls. Welcome to Vermont and let us get to work.

