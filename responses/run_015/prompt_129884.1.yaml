  Here is a high-level summary of the reasoning behind this analysis: The tension in your cases arises from conflating two distinct functional concepts: the *etiological* (history-based) and the *causal-role* (system-based). By distinguishing these, we can preserve the normative force needed for medicine (disease as function failure) while accounting for engineering and novel traits. The recommendation below prioritizes the Etiological account for "proper function" but acknowledges the Causal Role account for physiological explanation.

  ***

  ### The Core Problem: One Word, Two Concepts

  Your intuition is correct: the debate is largely about two different concepts sharing one word. In a graduate seminar, especially one half-dedicated to medicine, you should make this distinction explicit rather than trying to force a single principle to do both jobs.

  1.  **Proper Function (Etiological/Selected Effects):** What a trait is *supposed* to do, grounded in its history of selection or design. This carries normativity (it can fail).
  2.  **System Role (Causal Role/Cummins):** What a trait *actually does* that contributes to a capacity of the containing system. This is descriptive (it just is).

  If you try to merge these, you get the contradictions you are experiencing between Case 5 (Swamp Heart) and Case 6 (Synthetic Bacterium).

  ### Candidate Principles and Case Verdicts

  Here are the three serious live candidates, stated sharply, with their performance against your ten cases.

  #### 1. The Strict Etiological Account (Millikan/Neander)
  **Principle:** Trait $T$ has proper function $F$ in Organism $O$ iff $T$ exists in $O$ because ancestors of $T$ were naturally selected for $F$. (For artifacts: because they were designed for $F$).

  *   **Delivers:**
      *   (1) **Diseased Heart:** Yes. It was selected for pumping, even if it fails now.
      *   (2) **Heart Noise:** No. Not selected for.
      *   (4) **Tumor:** No (at organism level). Not selected for organism maintenance.
      *   (5) **Swamp Heart:** No. No selection history.
      *   (9) **Vestigial Wings:** No. Selection pressure removed.
  *   **Forces You to Give Up:**
      *   (6) **Synthetic Bacterium:** **Fail.** It has no history. (Unless you count the engineer's design as a "selection" history, which stretches the definition).
      *   (7) **New Mutation:** **Fail.** Strictly, it has no history *yet*. (Some etiological theorists allow "current selection" to count, but this weakens the history clause).
      *   (8) **Feathers:** **Fail.** If flight is an exaptation, strict etiology says the function is insulation (original selection).
      *   (10) **Appendix:** **Fail.** If it is currently selected for bacteria reservoir, strict etiology might deny it if that wasn't the *original* reason.

  #### 2. The Causal Role Account (Cummins)
  **Principle:** Trait $T$ has function $F$ in System $S$ iff $T$ contributes to capacity $C$ of $S$ by doing $F$.

  *   **Delivers:**
      *   (6) **Synthetic Bacterium:** Yes. It contributes to the lab's goal or its own survival.
      *   (7) **New Mutation:** Yes. It contributes to survival now.
      *   (8) **Feathers:** Yes. It contributes to flight now.
      *   (10) **Appendix:** Yes. It contributes to gut flora maintenance.
  *   **Forces You to Give Up:**
      *   (1) **Diseased Heart:** **Fail.** If it can't pump, it has no causal role in pumping. (You lose the ability to call it "diseased" in a functional sense).
      *   (2) **Heart Noise:** **Fail.** It *does* contribute to diagnosis. (You lose the distinction between function and byproduct).
      *   (4) **Tumor:** **Fail.** It contributes to cell proliferation. (You lose the distinction between pathology and function unless you rigidly define the "System" boundaries).
      *   (5) **Swamp Heart:** **Fail.** It pumps. Cummins grants it a function. (You lose the intuition that history matters).

  #### 3. The Generalized Selected Effects (GSE) Account (Garson)
  **Principle:** Trait $T$ has function $F$ iff $T$ exists because it contributed to $F$ which enhanced fitness (or design goals) *in the recent past or currently*. This allows for "current selection" to establish function quickly and includes artificial selection.

  *   **Delivers:**
      *   (1) **Diseased Heart:** Yes (History).
      *   (6) **Synthetic Bacterium:** Yes (Engineer's selection counts).
      *   (7) **New Mutation:** Yes (Current selection counts).
      *   (8) **Feathers:** Yes (Current selection for flight overrides ancient insulation).
  *   **Forces You to Give Up:**
      *   (5) **Swamp Heart:** **Fail.** Still no selection. (This is a feature, not a bug).
      *   (10) **Appendix:** **Conflict.** If the appendix is *currently* maintained by selection for the reservoir effect, GSE says it **is** a function.
      *   (4) **Tumor:** **Nuance.** You must specify the *level* of selection. Tumor cells have a function *for the tumor lineage*, but not for the organism.

  ### Recommendation for Your Seminar

  **Adopt the Pluralist View:** Teach "Proper Function" (Etiological/GSE) as the standard for **Philosophy of Medicine** and "Causal Role" for **Physiology**.

  **The Verdict to Overturn:**
  You should overturn **Case 10 (The Appendix)**.
  *   **Why:** If the appendix is currently maintained by natural selection *because* it serves as a bacteria reservoir, then on the best evolutionary accounts (GSE), that **is** its function now. Your intuition that it is "not a function" likely stems from a bias toward *original* function (Case 8) or a belief that it is a spandrel (non-adaptive byproduct).
  *   **The Cost:** If you admit the Appendix has a function, you must clarify that "function" does not imply "optimal" or "good." It just means "selected for." This actually helps the medicine discussion: a trait can have a function and still be a site of disease (appendicitis).

  **The Verdict to Clarify:**
  **Case 6 (Synthetic Bacterium).**
  *   **Why:** Treat the engineer's design process as a form of "intentional selection." The circuit was selected (on the laptop and in the lab) for breaking down plastic. It fits the GSE account if you broaden "selection" to include artificial design. This preserves the intuition that it has a function without granting functions to Swamp Things.

  **The Principle to State:**
  > **The Generalized Selected Effects Principle:** A trait $T$ in system $S$ has the proper function $F$ if and only if $T$ exists in $S$ because $T$ (or its ancestors) contributed to $F$, and $F$ contributed to the fitness (or design goals) of $S$ through a process of selection (natural or artificial).
  > *   **Normativity:** $T$ can fail at $F$ (Case 1).
  > *   **Exclusion:** Accidental effects (Case 2, 5) are excluded.
  > *   **Pathology:** Traits selected at a lower level (Case 4 Tumor) are not functions of the higher-level system.

  ### Addressing the "Two Concepts" Hypothesis
  Your students are right. The physiologist asks, "What is this part doing in this mechanism?" (Cummins Role). The evolutionary biologist asks, "Why is this part here?" (Etiological Function).
  *   **Medicine needs the Etiological view.** Disease is defined as the *failure* of a proper function (Boorse). If we use the Causal Role view, a diseased heart that doesn't pump has no function, so it cannot fail, so it cannot be diseased in a functional sense.
  *   **Physiology needs the Causal Role view.** When mapping a pathway, we care about current contribution, not history.

  **Teaching Strategy:** Do not try to solve the monism/pluralism debate in week one. Tell them: "In medicine, we care about *norms*. Norms come from history (Etiological). In mechanism, we care about *capacities*. Capacities come from current organization (Causal Role). Your job is to know which one you are using."

  ### Unlisted Cases (Applied)
  *   **De Novo Gene:** If it is under selection *now*, GSE grants it a function immediately (like Case 7). Strict Etiology says "wait."
  *   **Organoid:** If grown to secrete insulin, it has a *design function* (Case 6). It lacks a *biological proper function* unless integrated into a host under selection.
  *   **Female Orgasm:** If it is a byproduct (spandrel), Etiological says "no function." If it is currently selected for pair-bonding or sperm retention, GSE says "function." (This highlights the empirical dependence of the theory).
  *   **Exapted Organ:** (Like Case 8). GSE says the *current* selected effect is the function. Strict Etiology says the *original* effect is the function. (Recommend GSE for medicine; we treat the heart as for pumping, not whatever it did in an ancestral worm).
