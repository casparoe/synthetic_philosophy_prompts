      *(Refining the "Warrant Logic")*: The user's idea of "authorization before coercion" is legally sound but operationally hard. The reply should focus on *dispatch* as the gatekeeper, not a judge. Dispatch already does some of this. The argument is to formalize and tighten it.

      *(Final check on the "Core Idea Viability")*: Is it confused? No, it's a legitimate policy lever (Call Screening/Alternative Response). But it's politically fraught. I need to tell the user that.

