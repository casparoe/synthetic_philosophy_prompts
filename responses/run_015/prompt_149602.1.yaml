          *   *Value Function:* Engineer says "Reproductive Rate." Tolstoy says "Religious Consciousness + Accessibility." It's weighted, not just raw count.
      *   *Section 3: The Verdict on Modern Art.* Does the judgment stand without the analogy? Yes, but for deeper reasons. It's not that Wagner is "hard to decode," it's that Wagner is "pretending."
