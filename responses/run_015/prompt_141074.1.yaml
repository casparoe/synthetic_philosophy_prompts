          *   *Defense/Nuance:* Nyāya *vyāpti* requires *avinābhāva* (inseparability). It doesn't strictly require checking *every* instance, but rather checking enough to rule out *upādhis*. The "Grand Experiment" treats the *household* as the instance. The "death rate" is a proxy for the presence of the *sādhya* in the *pakṣa*.
          *   *Strain:* The strain is real. Nyāya assumes a realist ontology where properties inhere in substances. Statistical correlation is a modern abstraction. Nyāya would struggle to formalize "14 deaths per 10,000" as a *dharma* (property). However, the *logic* of *upādhi* elimination works identically. The *form* of the evidence is different, but the *epistemic move* (isolating the variable) is valid Nyāya *tarka*.
