      *   **Point 3: Retroactive Validation.**
          *   *Critique:* Snow was right, but couldn't prove the mechanism (germ theory came later). Does later discovery make his inference *pramā* back then?
          *   *Nyāya View:* *Pramā* is time-indexed to the cognition. If the *hetu* was truly inseparable from the *sādhya* in reality, the inference was valid *then*, even if the *vyāpti* wasn't universally acknowledged. Truth is *yāthārthya* (correspondence).
          *   *Nuance:* However, Nyāya requires the *hetu* to be known as connected. If Snow didn't know *why* (no germ theory), was the *vyāpti* known? He knew the correlation. Nyāya accepts empirical *vyāpti* without knowing the metaphysical "why" (*causal power* or *śakti* is later Nyāya).
          *   *Verdict:* It is a feature, not a cost. Nyāya is realist. A true inference is true regardless of consensus. The later discovery (germ theory) merely provides a deeper *vyāpti* (microbe -> disease) that subsumes Snow's *vyāpti* (dirty water -> disease). Snow's cognition was *pramā* because it corresponded to reality, not because it was later verified.

