  **Scenario**

  Maya owns a sunny street-facing flat; her neighbour Leo owns a quiet courtyard flat. Over a multi-year lease, Leo offers to swap flats with Maya at the start of every season for a $\$30$ administrative fee, which is pure profit to him and provides no service value to her. Maya's preferences flip seasonally: in Winter she ranks Sunny $\succ$ Quiet (willingness to pay $\$100$ to switch to Sunny), while in Summer she ranks Quiet $\succ$ Sunny (willingness to pay $\$100$ to switch to Quiet). In the Shoulder seasons (Spring/Autumn), she still prefers the seasonally appropriate flat but with low intensity (willingness to pay $\$40$ to switch). She starts in Winter holding Sunny, the sequence ends in Summer, and she has perfect foresight of this pattern repeating indefinitely if she accepts the standing offer.

  ***

  **Analysis of the Three Choosers**

  1.  **The Myopic Re-optimizer:** At every offer, Maya compares her current willingness to pay (WTP) against the $\$30$ fee. In Spring, WTP is $\$40$ ($40 > 30$), so she swaps to Quiet. In Autumn, WTP is $\$40$ ($40 > 30$), so she swaps back to Sunny. She repeats this every year. In the final Summer, WTP is $\$100$, so she swaps to Quiet.
      *   **Result:** For every year of the sequence, she pays $\$60$ (Spring + Autumn swaps) plus the final $\$30$. As the number of years $N \to \infty$, her total loss is $\$60N + \$30$, which is unbounded. She ends with Quiet.

  2.  **The Backward Inductor (Sophisticate):** Maya works backwards from the end. She knows the sequence terminates in Summer.
      *   *Final Summer:* She holds Sunny (from Winter). WTP for Quiet is $\$100$. Fee is $\$30$. Net gain $\$70$. She swaps.
      *   *Preceding Autumn:* She holds Sunny. WTP for Quiet is $\$40$. Fee is $\$30$. However, she knows that if she swaps to Quiet now, she will face a Winter preference for Sunny (WTP $\$100$) and pay another $\$30$ to swap back. The round-trip cost is $\$60$ for a temporary gain of $\$40$. She declines the Autumn swap.
      *   *Preceding Spring:* She holds Sunny. WTP for Quiet is $\$40$. She knows swapping now triggers the Autumn/Winter cycle analyzed above (costing $\$60$ to return to Sunny). Since the temporary gain ($\$40$) is less than the round-trip cost ($\$60$), she declines the Spring swap.
      *   **Result:** She skips all intermediate years. She only executes the final Summer swap. Her total loss is exactly **$\$30$**. She ends with Quiet.

  3.  **The Resolute Committer:** At the outset (Winter), Maya ranks Sunny $\succ$ Quiet ($100 > 0$). She commits to rejecting all future swaps.
      *   **Result:** She pays **$\$0$**. She ends with Sunny.

  **Verdict Reversal**

  *   **Earliest Self (Winter):** Values Sunny at $\$100$, Quiet at $\$0$.
      *   Committer Outcome: Sunny, Cost $\$0$. Total Value: $\$100$.
      *   Sophisticate Outcome: Quiet, Cost $\$30$. Total Value: $\$0 - \$30 = -\$30$.
      *   **Verdict:** Earliest Self strictly prefers the **Committer**.
  *   **Final Self (Summer):** Values Quiet at $\$100$, Sunny at $\$0$. She counts all fees paid as current wealth reductions.
      *   Committer Outcome: Sunny, Cost $\$0$. Total Value: $\$0$.
      *   Sophisticate Outcome: Quiet, Cost $\$30$. Total Value: $\$100 - \$30 = \$70$.
      *   **Verdict:** Final Self strictly prefers the **Sophisticate**.

  ***

  **The Feature Doing the Work**

  The driving feature is **Variable Intensity of Preference Relative to Transaction Costs**. Specifically, the existence of "Shoulder" periods where the preference intensity ($\$40$) exceeds the single transaction fee ($\$30$) but is less than the round-trip cost ($\$60$) required to restore the original position.

  *   **If intensity were constant (e.g., always $\$100$):** The Sophisticate would swap every time (since $\$100 > \$60$), behaving like the Myopic agent. The bound would vanish.
  *   **If the ranking never flipped:** No swaps would ever be offered or accepted. All three choosers would yield identical outcomes.
  *   **If she could not foresee the flips:** The Sophisticate would lack the information to calculate the round-trip cost, collapsing her strategy into the Myopic one (unbounded loss).
  *   **If commitment carried a cost (e.g., $\$50$):** The Committer's net value would drop ($\$100 - \$50 = \$50$). If the cost exceeded the benefit of avoiding the final swap, the Committer would be worse off than the Sophisticate even by the Earliest Self's lights.

  ***

  **The Strongest Reply from a "Synchronic Rationality" Defender**

  "A charge of irrationality here confuses *rationality* with *prudence*. Rationality is a synchronic constraint: at any time $t$, an agent is rational if she chooses the option maximizing her expected utility given her preferences and beliefs at $t$. Myopic Maya does exactly this. At every Spring offer, she genuinely values the Quiet flat more than the Sunny flat plus $\$30$; to refuse the swap would be to act against her own best judgement *at that moment*.

  The fact that her preferences change is a feature of the world, not a defect in her reasoning. The 'loss' identified by the Earliest Self is merely the price paid to satisfy the legitimate, intense preferences of her future selves. To demand she sacrifice her Spring self's welfare for her Winter self's convenience is not to demand rationality, but to demand a specific form of selfishness (prioritizing $t_0$). Since no stage of her thinks any other stage is in error, and no beliefs are incoherent, there is no rationality failure to explain—only a life where satisfying changing desires is expensive."
