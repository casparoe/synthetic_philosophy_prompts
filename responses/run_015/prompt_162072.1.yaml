  | Strains of Commitment | Feasibility / Individual Rationality Constraint | Distorted | OR: Incentive Compatibility. Rawls: Moral ability to uphold agreement. | Genuine disagreement the translation can't see |
  | Fair Cooperation | Core Stability / Nash Equilibrium | Distorted | OR: No profitable deviation. Rawls: Reciprocity among free equals. | My framework is too thin |
  | Capabilities Critique | Objective Function Misspecification | Inexpressible | DRO optimizes given metrics; it cannot critique the metric's moral validity. | My framework is too thin |

