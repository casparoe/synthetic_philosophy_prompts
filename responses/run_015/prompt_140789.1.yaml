prompt: |-
  I run the induction afternoon for new volunteer care companions at a hospice: about sixteen people at a time, mixed ages, mostly no background in philosophy, a few retired clinicians, a couple of students, and usually one or two who volunteered because someone they loved died here and who will be quietly furious if the afternoon wastes their time. For the past year I have also been the person who coordinates care for my mother, who has vascular dementia, so I am no longer reading this material from the outside. My slot is 75 minutes, late in a three-hour session, immediately after the safeguarding module — which means they arrive already in the frame of mind where the point of a scenario is to locate the correct procedure and not get into trouble. That is the frame I want broken, and I do not want to break it by announcing that it is the wrong frame.

  What I need is a structured activity — a game with rules and some payoff, a role-play, a staged deliberation with real if small stakes — that makes them run into three things before anyone names them.

  First, what I have started calling continuity cost. Two arrangements can deliver exactly the same acts, to the same standard, at the same times, and differ only in whether it is the same person who comes back. My mother's carers are all competent; the one I dread losing is the one who knows that she will refuse the second half of a sentence before anyone has finished the first. Is there a real loss when the identity of the carer changes while the content and quality of the care are held fixed — and if there is, is it a moral loss or merely a preference? I want them to discover that they think something here, not to be told what to think.

  Second, what I have been calling the uptake condition. A technically flawless piece of care that the person receiving it experiences as an intrusion is, it seems to me, a failure of care, and not only because of its downstream effects: care that does not land is not care. But the cared-for may be unable to say so, may not know it themselves, or may actively reject what they need, and a hospice is full of exactly those cases. I want them to feel the pull of the condition and then feel the places where it cannot be applied.

  Third, the noticing deficit. A need nobody has noticed is not a need that goes unmet; as far as any rota is concerned it is not yet a need at all. Noticing is work, it cannot be delegated downstream to whoever is on shift, and no audit counts it. The working assumption of the rota — that two hours from anyone is two hours — I call the substitutability assumption, and I want them to watch it fail in something they are doing, not in a story I tell them.

  Constraints, because they decide whether I can actually run this:

  No lecture at the front, and the name of the tradition should not be spoken until the last ten minutes. The insight has to arrive as something they did. No trolley problems, no dramatic dilemmas about stealing a drug to save a spouse, no case that turns on life and death, and no case whose answer is obvious: those all import the very frame I am trying to unsettle, the single decision taken from nowhere with a right answer waiting. Care in this building is mostly the sustained maintenance of dependency, and the activity should be about that. I have no real patients and no actors; the participants are the participants, nobody should have to disclose anything about their own experience of illness or caring, and nobody should have to play a dying person if a proxy or a written role will do. Materials are index cards, pens, a whiteboard, a phone timer and the room, because that is what the room has. One colleague can help for the first ten minutes and not after. It must work with ten people as well as with eighteen.

  The stakes have to be real but small, since there is no money and no mark to give. My own instinct is that the currency should be something the participants actually possess — their attention, their promises, a budget of minutes they have to allocate — and that whatever score the game keeps should systematically fail to record what turns out to have mattered, since that mismatch is most of the point and is what an institution does to care. But I would rather see your mechanic than impose mine.

  What I would like from you: rules, roles, materials, and a minute-by-minute timeline for the 75 minutes; the scoring or payoff scheme and why participants will care about it; and where the activity is designed to go wrong for them — the specific moment at which each of the three things above should land, and what you expect people to say at that moment. Then a debrief that maps those moments onto the three ideas, and that includes the honest part, which is what the picture costs: care indexed to a relationship is finite, it does not reach strangers, it can curdle into possessiveness or into the carer's disappearance into the cared-for, and an institution that runs on personal relationships is running on the labour of people who are usually unpaid and mostly women. I want them to feel that too, and to leave with one thing they can do on the ward tomorrow that is not just another rule. Then: what will predictably go wrong the first time I run it — the retired nurse who wants the protocol, the person who treats it as a puzzle to be won, the person who goes quiet because it is close to home, the group that colludes in being nice — and how to handle each. And last, which feature of the idea the activity cannot reproduce at all and which I will therefore have to say in so many words. My suspicion is that it is duration, that real care is what happens on the four hundredth visit with no debrief at the end of it, but tell me what you think it is.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Context:** Hospice volunteer induction (afternoon session, 75 mins).
      *   **Audience:** ~16 volunteers (mixed ages, backgrounds, some clinicians, some bereaved/furious if wasted time).
      *   **Facilitator:** Experienced, currently caring for mother with vascular dementia (personal stake), wants to break the "safeguarding/procedure" frame without announcing it.
      *   **Goal:** Create a structured activity (game/role-play/deliberation) that leads participants to discover three concepts *before* they are named:
          1.  *Continuity Cost:* Same care, different person = loss? Moral or preference?
          2.  *Uptake Condition:* Care that feels like intrusion is failure, even if technically correct. Recipient might not be able to articulate this.
          3.  *Noticing Deficit:* Unnoticed needs don't exist on a rota. Noticing is uncounted work. Substitutability assumption fails.
      *   **Constraints:** No lecture (until last 10 mins), no trolley problems, no life/death stakes, no acting out dying patients (use proxies/cards), limited materials (cards, pens, whiteboard, timer), one helper for first 10 mins only. Must scale 10-18 people.
      *   **Stakes:** Real but small (attention, promises, time budget). The scoring system should *fail* to record what matters (institutional mismatch).
      *   **Deliverables:** Rules, roles, materials, timeline, scoring/payoff, designed failure points (for the 3 concepts), debrief script (including the "honest part" about labor/gender/finite relationships), troubleshooting (predictable failures), and limitation analysis (what the activity *can't* do).

  2.  **Deconstruct the Core Tension:**

      *   The user wants to challenge the "rota logic" (substitutability, efficiency, procedure) with "care logic" (relationship, noticing, uptake).
      *   The activity *must* simulate the rota logic to show where it breaks.
      *   The scoring system needs to reward efficiency/compliance initially, then reveal its inadequacy.
      *   The "patients" cannot be played by volunteers (too heavy/awkward). They need to be represented by something static but responsive. *Idea: Written profiles that "react" based on specific triggers.*

  3.  **Develop the Activity Concept: "The Rota Game" (Working Title)**

      *   *Premise:* Participants are schedulers/carers managing a small ward for a "week" (simulated time).
      *   *Mechanic:* They have a budget of "Care Hours" and a list of "Tasks." They have a list of "Patients" (on cards) with hidden triggers.
      *   *The Twist:* The scoring rewards task completion. The *experience* rewards relationship building. The conflict arises when you can't do both.
      *   *Continuity:* If you swap carers, you lose "hidden info" about the patient.
      *   *Uptake:* If you do the task without the right "approach" (coded on the card), the patient "rejects" it (counts as failure despite task completion).
      *   *Noticing:* There are needs not on the task list. If you don't spend time "looking" (a specific action), they fester.

  4.  **Refining the Mechanics for 75 Minutes:**

      *   *Setup (10 mins):* Group division, rules, materials.
      *   *Round 1 (20 mins):* Efficiency focus. Complete the task list.
      *   *Round 2 (20 mins):* Continuity/Relationship focus. Same carer, same patient.
      *   *Round 3 (20 mins):* Crisis/Constraint. Staff shortage (substitutability forced).
      *   *Debrief (15 mins):* Connecting experience to concepts.
      *   *Wait, the prompt asks for 75 mins total including debrief.* Let's adjust.
      *   *Revised Timeline:*
          *   Intro/Setup: 10 mins (Helper leaves after this).
          *   Phase 1 (The Rota): 20 mins.
          *   Phase 2 (The Handover): 20 mins.
          *   Phase 3 (The Gap): 15 mins.
          *   Debrief: 10 mins.
          *   *Total:* 75 mins.

  5.  **Designing the "Patient" Cards (The Proxy):**

      *   Need to avoid volunteers acting as patients.
      *   Use "Patient Files." Each file has a "Surface Need" (e.g., wash, feed) and a "Hidden Condition" (e.g., "Refuses wash if stranger," "Needs 5 mins chat before food").
      *   *Uptake Condition:* If the carer doesn't meet the Hidden Condition, the task counts as "Incomplete" even if done.
      *   *Continuity Cost:* If the carer changes, the Hidden Condition becomes harder to meet (requires extra time/resource).
      *   *Noticing Deficit:* There is a "Silent Need" not on the task list. Only discovered if a carer spends "Unscheduled Time."

  6.  **Developing the Scoring (The Institutional Mismatch):**

      *   *Official Score:* Tasks ticked off.
      *   *Real Outcome:* Patient "Comfort Level" (hidden until end).
      *   *The Reveal:* You can have a perfect Official Score and terrible Real Outcome.

  7.  **Addressing the Three Concepts in the Flow:**

      *   *Continuity Cost:* Phase 2 forces a handover. They will feel the loss of knowledge.
      *   *Uptake Condition:* Phase 1 reveals that doing the task isn't enough if the patient "rejects" it (via card mechanic).
      *   *Noticing Deficit:* Phase 3 introduces a constraint where "Unscheduled Time" is cut. The Silent Need festers.

  8.  **Drafting the Rules & Materials:**

      *   *Materials:* Index cards (Patient Files, Carer Shifts), Whiteboard (Score), Pens, Timer.
      *   *Roles:* Carers (volunteers), Coordinator (Facilitator), Patients (Cards).
      *   *Currency:* "Time Tokens" (minutes).
      *   *Constraint:* 16 people is a lot for one game. Split into 4 wards of 4 people? Or 2 wards of 8?
      *   *Decision:* 2 Wards of 8 allows for better discussion within the group. Let's go with 2 Wards.
      *   *Wait, 16 people.* If I split them, they compete. If they are one group, it's chaotic.
      *   *Better:* One large "Ward." Everyone is a Carer. The Facilitator is the "Rota Coordinator." The "Patients" are 4-5 distinct envelopes on the table.
      *   *Actually, to ensure engagement:* Split into small teams (4 teams of 4). Each team manages 2 Patients. They compare results at the end. This handles the 10-18 scale well.

  9.  **Refining the "Failure" Points:**

      *   *Continuity:* In Round 2, force a swap. Teams must pay a "Trust Tax" (extra time) to achieve the same result.
      *   *Uptake:* Patient cards have a "Key." If the team doesn't write down the "Approach," the task fails audit.
      *   *Noticing:* There is a "Shadow Card" for each patient. It only reveals if a team spends time "Just Sitting." If they don't, a penalty occurs later that they couldn't predict.

  10. **The Debrief & The "Honest Part":**

      *   Must name the concepts.
      *   Must address the labor burden (mostly women, unpaid).
      *   Must address the finiteness of care (can't love everyone).
      *   Actionable takeaway: "Ask one question not on the chart."

  11. **Troubleshooting:**

      *   *The Protocol Nurse:* Wants the right answer. *Fix:* Validate her, then show where protocol hits the wall.
      *   *The Gamer:* Wants to win the points. *Fix:* Show that winning points meant failing the patient.
      *   *The Bereaved:* Emotional trigger. *Fix:* Keep it abstract enough (cards), allow opt-out, acknowledge the anger.
      *   *The Nice Group:* Collude to make it work. *Fix:* The Facilitator must introduce the "Resource Cut" arbitrarily.

  12. **The Limitation (Duration):**

      *   The game is 75 mins. Real care is years. The game cannot simulate the *weight* of the 400th visit. The facilitator must speak this.

  13. **Review against Constraints:**

      *   No lecture until end? Yes.
      *   No trolley problems? Yes (logistical/relational stakes).
      *   No acting patients? Yes (cards).
      *   Materials simple? Yes.
      *   Stakes real but small? Yes (pride, understanding).
      *   Scoring fails to record what matters? Yes (Task vs. Comfort).

  14. **Final Polish:**

      *   Tone needs to be respectful, precise, and empathetic to the facilitator's own position (caring for mother).
      *   Ensure the "Continuity Cost" is felt, not just told.
      *   Ensure the "Uptake Condition" is felt (doing the thing but it being wrong).
      *   Ensure the "Noticing Deficit" is felt (the thing you didn't see hurt you).

      *(Self-Correction during drafting)*: Make sure the "Patient Cards" are robust enough. They need to be written so the "Hidden Condition" is clear to the facilitator but requires the volunteers to deduce or invest to find.
      *Idea:* The Patient Card has a "Lock." The Key is obtained by spending a "Relationship Token." You get tokens by keeping the same carer. If you swap, you lose tokens.
      *Actually, simpler:* The Card says "Task: Wash." Back says "Condition: Only accepts wash from Carer A." If Carer B tries, it's a "Refusal."
      *Let's make it more subtle.* The Card says "Task: Wash." The Facilitator holds the "Response Key." If the team says "We send Carer A," it works. If "Carer B," it takes double time. This forces the Continuity Cost.

      *Let's refine the "Noticing".* There is a "Silent Need" envelope. It opens only if a team declares "Unscheduled Time." If they don't, at the end, a "Complication" card is drawn that costs them points they didn't know existed.

      *Let's refine the "Uptake".* The team must write *how* they approach. If they write "Standard Procedure," the Facilitator marks it "Technically Correct, Patient Distressed." If they write "Personalised," it's "Success."

      *Okay, the structure is solidifying.* I will write the response following the user's requested structure: Rules/Roles/Materials, Timeline, Scoring, Designed Failure Points, Debrief, Troubleshooting, Limitation.

      *One crucial detail:* The user mentioned "one colleague can help for the first ten minutes." I need to use that person for the setup/distribution so the facilitator can set the tone.

      *Final check on the "Honest Part":* Needs to be sharp. Care indexed to relationship is finite. It excludes strangers. It relies on unpaid labor (women). This needs to be in the debrief.

      *Final check on "Actionable Takeaway":* "One thing to do tomorrow." Needs to be concrete. "Sit for 2 minutes without a task."

      *Let's write it.*
answer: |-
  This is a delicate design challenge. You are asking for a simulation that proves the limitations of simulation, specifically regarding the human texture of care. The activity below, **"The Rota Protocol,"** is designed to feel like a management exercise initially, then slowly reveal itself as a relational one, forcing the participants to experience the friction between institutional efficiency and lived dependency.

  ### **Activity: The Rota Protocol**

  **Materials:**
  *   **Index Cards (Patient Files):** 8 distinct packs. Each pack contains 3 cards: *Surface Need*, *Hidden Condition*, *Silent Need*.
  *   **Index Cards (Shift Tokens):** 40 cards marked "15 mins".
  *   **Whiteboard:** Divided into two columns: "Task Completion" and "Patient Comfort."
  *   **Pens:** For recording decisions.
  *   **Timer:** Visible to all.
  *   **Helper:** For distribution only (first 10 mins).

  **Roles:**
  *   **The Ward (Participants):** Split into 4 teams of 4 (scales to 3 teams of 3 or 4 teams of 5 easily). They are the "Care Team."
  *   **The Coordinator (You):** You hold the "Response Keys" (a master sheet telling you how the Patients react). You do not explain *why* a reaction happens until the debrief.
  *   **The Patients:** Represented by the Card Packs on the tables. No one plays a patient.

  **The Currency:**
  *   **Time:** Each team starts with 12 Shift Tokens (3 hours total).
  *   **Score:** Teams are told they are competing for "Ward Efficiency."
  *   **The Trap:** The "Ward Efficiency" score only measures *Task Completion*. The "Patient Comfort" score is hidden until the end.

  ---

  ### **Timeline (75 Minutes)**

  **00:00 – 00:10: Setup & Framing (Helper active)**
  *   **Helper:** Distributes teams, cards, and tokens.
  *   **You:** "You are managing a ward for a simulated week. You have 4 Patients (Card Packs). You have a list of Tasks (Surface Need cards). You have 12 Time Tokens. Each Task costs 1 Token. Your goal is to complete as many Tasks as possible. Any leftover time is wasted. Begin."
  *   *Frame:* This establishes the Safeguarding/Rota mindset. Efficiency is king. Time is a resource to be spent, not invested.

  **00:10 – 00:30: Phase 1 — The Task (Uptake Condition)**
  *   Teams assign tokens to Tasks. They hand you the Token + Task Card.
  *   **The Mechanic:** On your Master Sheet, each Patient has an *Uptake Condition*.
      *   *Example:* Patient A needs washing. If the team simply hands in the token, you mark "Task Complete" on the board, but you quietly mark "Distress" on your hidden sheet.
      *   *To avoid Distress:* They must write a "Method Note" on the token (e.g., "Knock first," "Warm towel"). If they don't, the Task counts for points, but the Patient "deteriorates."
  *   **The Friction:** Teams will rush to burn tokens. You will occasionally say, "Patient 2 has rejected this wash." You do not explain why. They must spend another token to retry.
  *   **Goal:** They discover that *doing the thing* is not the same as *the thing landing*.

  **00:30 – 00:50: Phase 2 — The Handover (Continuity Cost)**
  *   **Announcement:** "Staff Sickness. You must swap two team members with another Ward (rotate people between tables)."
  *   **The Mechanic:** The new person does not know the "Method Notes" established in Phase 1.
  *   **The Cost:** To perform the same Task with the new person, it now costs **2 Tokens** instead of 1 (representing the time spent re-establishing trust/explaining history).
  *   **The Friction:** Teams will run out of time. They will have to drop Tasks. They will feel the specific frustration of *competence without context*. The work is the same, but the cost has doubled.
  *   **Goal:** They feel the loss of identity. The care is identical, but the "price" has changed.

  **00:50 – 01:05: Phase 3 — The Audit (Noticing Deficit)**
  *   **Announcement:** "Budget Cut. You must return 2 Time Tokens to the bank immediately. Also, there is no token budget for 'Sitting'."
  *   **The Mechanic:** Each Patient Pack has a *Silent Need* card (e.g., "Needs 10 mins quiet company to eat"). This card is face down. It can only be flipped if a team spends a Token *without* a Task attached (just "Presence").
  *   **The Constraint:** Because of the Budget Cut, no team can afford "Presence."
  *   **The Reveal:** At the end of Phase 3, you reveal the Silent Needs. For every Silent Need unmet, deduct 5 points from their "Patient Comfort" score (which you now reveal on the board).
  *   **Goal:** They realize a need that wasn't on the rota *was* a need, and ignoring it has a cost the rota didn't track.

  **01:05 – 01:15: Debrief & Naming**
  *   Stop the game. Reveal the hidden scores.
  *   Map the experience to the three concepts.
  *   Deliver the "Honest Part."
  *   Assign the actionable takeaway.

  ---

  ### **Scoring & Payoff Scheme**

  **Why they will care:**
  Volunteers want to be *good* at volunteering. They want to be competent. The game initially defines competence as "Tasks Done." By the end, you show them that "Tasks Done" resulted in "Patient Distress." This creates cognitive dissonance they will want to resolve.

  **The Scoreboard:**
  *   **Public Column:** "Tasks Completed" (Ticked by you as they hand in tokens).
  *   **Hidden Column:** "Care Quality" (Kept on your Master Sheet).
  *   **The Mismatch:** The team with the most Tasks Completed often has the lowest Care Quality because they burned tokens on efficiency rather than method or presence.

  **The Payoff:**
  There is no prize. The payoff is the resolution of the dissonance in the debrief. The "win" condition is understanding why they "lost" the hidden game.

  ---

  ### **Designed Failure Points (Where the Concepts Land)**

  **1. Continuity Cost (Phase 2, approx. min 35)**
  *   **The Moment:** A team sends a new person to do a task they successfully did in Phase 1. You charge them 2 Tokens.
  *   **Expected Reaction:** "But it's the same task! She's qualified!"
  *   **What they say:** "It's not fair, she knows how to do it."
  *   **The Insight:** They argue for *substitutability*. You enforce *relationship cost*. They feel the inefficiency of losing history.

  **2. Uptake Condition (Phase 1, approx. min 20)**
  *   **The Moment:** You reject a Task Token because no "Method Note" was attached.
  *   **Expected Reaction:** "I washed him! It's done!"
  *   **What they say:** "He's clean, what does it matter how?"
  *   **The Insight:** They separate the *act* from the *experience*. You force them to see that care without uptake is just procedure.

  **3. Noticing Deficit (Phase 3, approx. min 55)**
  *   **The Moment:** You reveal the Silent Need cards.
  *   **Expected Reaction:** "We didn't know that was there!"
  *   **What they say:** "How were we supposed to schedule that?"
  *   **The Insight:** They realize the rota makes invisible needs *structurally impossible* to meet. Noticing requires un-budgeted time.

  ---

  ### **The Debrief (10 Minutes)**

  **1. Mapping the Experience (3 mins)**
  *   "Look at the board. Team A did 10 tasks. Team B did 6. But Team B's patients were 'Comfortable'. Team A's were 'Distressed'."
  *   "In Phase 2, when we swapped staff, the work got harder. Why? The task didn't change."
  *   "In Phase 3, needs appeared that we couldn't meet because they weren't on the list."

  **2. Naming the Concepts (3 mins)**
  *   **Continuity Cost:** "When the carer changes but the care stays the same, something is lost. It costs more time to rebuild trust. That cost is real, even if the audit doesn't see it."
  *   **Uptake Condition:** "Care that doesn't land isn't care. If the patient experiences it as intrusion, the technical success doesn't matter."
  *   **Noticing Deficit:** "A need nobody sees doesn't go on the rota. Noticing is work. It is unpaid work. It is the work of seeing what isn't written."

  **3. The Honest Part (3 mins)**
  *   *Tone shift:* Drop the facilitator mask. Speak to your experience with your mother.
  *   "Here is the cost of this picture. If care depends on relationship, it is finite. You cannot have this depth of knowing with everyone. It excludes strangers."
  *   "It can curdle. It can make the carer possessive. It can make the carer disappear into the patient."
  *   "And mostly, this work—the noticing, the continuity, the uptake—is done by people who are often unpaid, or underpaid, and mostly women. An institution running on personal relationships is running on a specific kind of labour. We are asking you to enter that stream. We cannot pay you for the noticing. We can only ask you to do it."

  **4. The Takeaway (1 min)**
  *   "Tomorrow, on the ward, you will have a task. Do the task. But before you leave the room, spend two minutes doing nothing. No washing, no feeding. Just be there. Watch what happens in the silence. That is where the Silent Need lives. That is your job."

  ---

  ### **Troubleshooting: Predictable Failures**

  **1. The Retired Nurse (Protocol Seeker)**
  *   *Behavior:* "This is unsafe. We need to follow the infection control guidelines. Why are we gambling with tokens?"
  *   *Handle:* Validate immediately. "You are right. In the real world, protocol is the floor. This game is about the ceiling. Protocol keeps them safe; relationship keeps them whole. We need both. But today we are testing the ceiling."

  **2. The Gamer (Puzzle Solver)**
  *   *Behavior:* Tries to hack the scoring. "If we all do Patient 1, we get more points."
  *   *Handle:* Enforce the constraints rigidly. "The Rota assigns the patients. You cannot choose." Let them fail at the game to succeed at the lesson. "You won the efficiency score, but look at the Comfort score."

  **3. The Bereaved (The Furious One)**
  *   *Behavior:* Goes quiet, or gets angry at the "budget cut" simulation because it mirrors real failure.
  *   *Handle:* Do not push. In the debrief, acknowledge the anger. "Some of you know this frustration not as a game. The anger you feel at the tokens is the anger you feel at the system. Keep that. Use it to protect your patients."

  **4. The Nice Group (Collusion)**
  *   *Behavior:* They try to share tokens or help each other to ensure everyone succeeds.
  *   *Handle:* This is actually a success (community care), but disrupt it. "Resource Scarcity Event." Take 5 tokens back from the room arbitrarily. "The budget was cut." Force the hard choice.

  ---

  ### **The Limitation: What This Cannot Reproduce**

  **Duration.**
  The activity cannot reproduce the **four hundredth visit**.
  Real care is not a crisis; it is a long, flat plateau of maintenance. It is the weight of showing up when nothing changes. It is the erosion of the self over years.
  *   **Why the game fails here:** The game has a timer. It has an end. It creates urgency. Real care is often boring, slow, and endless.
  *   **How to say it:** "This game had a timer. Real care does not. The hardest part is not the difficult decision; it is the Tuesday afternoon, six months in, when nothing is happening, and you are tired, and you still have to be present. We cannot simulate that fatigue today. But know that it comes. And know that on that day, the 'Noticing' is the only thing that keeps the person human."

  ### **Why This Works for Your Context**
  *   **Safeguarding Hangover:** It uses the language of compliance (tokens, tasks, audit) to subvert the mindset of compliance.
  *   **No Acting:** The "Patients" are cards. No one has to perform grief or illness.
  *   **Your Mother:** It allows you to facilitate from a place of knowing the "Continuity Cost" without having to disclose your mother's specific details. You hold the Master Key because you know what it costs.
  *   **The "Furious" Volunteer:** It validates their anger at the system by showing the system *is* flawed, without making the hospice look incompetent. It frames the flaw as structural (rota vs. relationship) rather than individual negligence.
