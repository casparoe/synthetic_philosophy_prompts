answer: |-
  # JOINT PROJECT SKELETON: EPISTEMIC NORMS IN PEER DISAGREEMENT

  **Status:** Draft for Discussion  
  **Participants:** [Conciliationist Name] & [Steadfast Name]  
  **Facilitator:** [Your Name]  
  **Date:** [Date]

  ---

  ## 1. SUBSTANTIVE AGREEMENTS

  *The following claims constitute the common ground for this collaboration. Both parties endorse these claims as true and relevant to the dispute, notwithstanding their divergent conclusions regarding normative obligations.*

  1.  **Disagreement as Evidence:** The fact of peer disagreement is not merely a psychological fact about two distinct heads; it constitutes a genuine piece of higher-order evidence regarding the reliability of the first-order reasoning process that produced the belief. It is not epistemically null.
  2.  **The Unreliable Calculation Case:** In cases where both parties acknowledge a high probability of random error and lack specific first-order access to the correct derivation (e.g., the jointly-botched restaurant bill where both know they are unreliable at mental arithmetic), both parties agree that significant confidence revision is required. Neither party advocates steadfastness in this specific subclass of cases.
  3.  **Peerhood as a Spectrum:** "Peer" status is not a binary switch that flips on or off. It is a matter of degree regarding relative reliability, evidence access, and cognitive processing. Normative prescriptions may vary continuously with the degree of assessed peerhood.
  4.  **Limitations of the Standard Model:** The standard "disputed calculation" setup (where an independent answer key exists) is a poor model for the high-stakes philosophical, scientific, or political cases that motivate this debate. In the interesting cases, there is no independent check to appeal to afterwards; the disagreement *is* the total evidence state.

  ---

  ## 2. MAP OF DISAGREEMENTS

  *The following table isolates the specific points of divergence. Formulations are steelmanned to ensure each party can endorse their column without qualification.*

  | Topic | Conciliationist Formulation | Steadfast Formulation | Notes on Dispute Type |
  | :--- | :--- | :--- | :--- |
  | **Normative Force** | Upon recognizing peer disagreement, one is *required* to significantly revise one's credence toward the peer's. To remain at the original credence is epistemically improper. | Upon recognizing peer disagreement, one is *permitted* to maintain one's original credence, provided the first-order evidence was sufficient to justify the belief prior to the disagreement. | **Substantive.** Disagreement over the deontic status of steadfastness (Required vs. Permissible). |
  | **Source of Normativity** | The disagreement provides higher-order evidence that one has likely made a mistake in weighing the first-order evidence. This defeats the justification for the original belief. | The first-order evidence remains the primary driver of justification. The disagreement is merely a new piece of evidence to be weighed alongside the original, not a defeater of the original process. | **Substantive.** Disagreement over the structure of evidential weighting (Defeater vs. Additive Evidence). |
  | **Terminology & Status** | It is *irrational* to remain steadfast in the face of acknowledged peer disagreement. | It is *rationally permissible* to remain steadfast; the belief remains *justified*. | **Verbal/Technical.** This row risks collapsing into a fight over the definitions of "rationality," "justification," and "permissibility." <br>**Substantive Core:** Does the agent violate an epistemic norm (C) or merely fail to optimize (S)? We will treat "violation of norm" as the substantive claim under test. |
  | **Scope of Application** | Conciliationist norms apply broadly to any domain where peerhood is established, including philosophy and theory-laden science. | Steadfast norms are more attractive in domains where priors are deeply entrenched or where "peerhood" masks correlated structural errors (e.g., shared training). | **Substantive.** Disagreement over domain generality. |

  ---

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  *Facilitator's Note on Crux Weighting: Of the four cruxes below, **Crux 2 (Scale)** is identified as primarily **Technical/Verbal**. It concerns the mathematical modeling of belief rather than the normative outcome. **Crux 4 (Correlated Error)** is identified as the **Substantive Hinge**. Resolution here determines the applicability of the norms in real-world scenarios. Parties should prioritize empirical clarity on Crux 4.*

  ### Crux 1: The Closed-Room Case
  **Scenario:** Two agents with identical training and evidence packets engage in unlimited joint deliberation. All considerations are shared. They still output different credences.
  *   **Conciliationist Prediction:** The survival of disagreement indicates a hidden fault in the reasoning process of at least one agent (or both). The disagreement itself is evidence of error that mandates revision.
  *   **Steadfast Prediction:** The survival of disagreement indicates a brute, non-truth-tracked difference in starting points (priors) or weighting functions that is not rationally resolvable.
  *   **Joint Test:** Simulation of agents with identical priors vs. varied priors.
  *   **Falsification Condition (C):** If agents with *identical* priors and evidence consistently disagree after full disclosure without random error, Conciliationism loses its "evidence of fault" claim.
  *   **Falsification Condition (S):** If agents with varied priors converge on the truth significantly faster when forced to conciliate than when allowed to remain steadfast, Steadfastness loses its "efficiency" claim.

  ### Crux 2: The Scale Question (Technical/Verbal)
  **Scenario:** Determining the mathematical operation of "meeting in the middle."
  *   **Question:** Is conciliation an operation on linear credences ($P$), log-odds ($\log \frac{P}{1-P}$), or odds directly?
  *   **Conciliationist Position:** [To be filled: e.g., Linear averaging is the default normative requirement.]
  *   **Steadfast Position:** [To be filled: e.g., The scale is indeterminate because revision is not required, but if forced, log-odds preserves independence better.]
  *   **Joint Acknowledgement:** Splitting the difference in linear credence and meeting in the middle in log-odds yield different numerical results, diverging as initial distance increases.
  *   **Resolution Goal:** We agree to adopt a **Scale-Neutral Formulation** for the joint paper, stating norms in terms of "significant revision toward" rather than specific arithmetic, unless a specific scale is proven to track truth-conduciveness better in Crux 4.

  ### Crux 3: The Ratchet (Iterative Updating)
  **Scenario:** Agent A conciliates toward B. Agent B conciliates toward A. Both learn the other has conciliated.
  *   **Conciliationist Prediction:** Updating stops after the first mutual disclosure. The fact of the *initial* disagreement was the evidence; the fact of the *resolution* is not new evidence of error requiring further movement.
  *   **Steadfast Prediction:** If the fact of disagreement is evidence, then the fact of *changed* credence is also evidence. A consistent conciliationist should ratchet toward a compromise neither originally held, which is absurd.
  *   **Joint Test:** Formal modeling of iterative updates.
  *   **Falsification Condition (C):** If the only way to stop the ratchet is to introduce an ad-hoc stopping rule that lacks independent justification, the view risks incoherence.
  *   **Falsification Condition (S):** If a non-ad-hoc stopping rule can be defined (e.g., "update on disagreement, not on resolution") that preserves truth-tracking, the Ratchet objection fails.

  ### Crux 4: Correlated Error (The Substantive Hinge)
  **Scenario:** An "Echo Panel" of peers whose mistakes are correlated due to shared training, sources, or flawed models.
  *   **Conciliationist Prediction:** Conciliationist norms still apply but are dampened by the degree of correlation. The burden is on the Conciliationist to estimate independence.
  *   **Steadfast Prediction:** As correlation approaches 1, the Steadfast view becomes strictly superior. Disagreement within a correlated cluster carries negligible independent information.
  *   **Joint Test:** Forecasting teams who see each other's numbers vs. Echo-Panel variants (teams trained on identical flawed datasets).
  *   **Falsification Condition (C):** If conciliating agents in high-correlation environments perform *worse* than steadfast agents (by adopting the group's shared bias), Conciliationism fails in the domains that matter most.
  *   **Falsification Condition (S):** If steadfast agents in low-correlation (high independence) environments systematically underperform conciliating agents, Steadfastness is revealed as inefficient dogmatism.

  ---

  ## 4. FALSIFICATION CONDITIONS (PERSONAL STATEMENTS)

  *Each party must explicitly state what evidence would cause them to abandon or significantly modify their position.*

  **Conciliationist Falsification Condition:**
  > "I will abandon the strong conciliationist view if it is demonstrated that in high-stakes, real-world environments (specifically those lacking an answer key), agents who follow conciliationist norms systematically track truth *less* accurately than agents who follow steadfast norms, particularly when controlling for the independence of error structures. If steadfastness proves more truth-conducive in the 'interesting cases' (Claim 4), the normative force of disagreement is undermined."

  **Steadfast Falsification Condition:**
  > "I will abandon the steadfast view if it is demonstrated that remaining steadfast in the face of peer disagreement leads to a statistically significant degradation in belief accuracy compared to conciliation, specifically in cases where error independence is verified (low correlation). If the 'first-order evidence' defense consistently results in retaining false beliefs where conciliation corrects them, the permission to remain steadfast is epistemically irresponsible."

  ---

  **END OF DRAFT SKELETON**
