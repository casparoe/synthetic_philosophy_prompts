      *   **Problem:** Conflict between home habits (tipping 20% despite hating the system, waiting at empty crosswalks for kids, queuing strictly) and local norms (no tipping generally but tourist traps expect it, jaywalking is common, queuing is loose).
      *   **Question:** Should I do what locals do or stick to my habits?
      *   **Constraint:** Separate "settled" views from "contested" views in normative theory/philosophy of social norms. Do not present contested views as consensus.
      *   **Tone:** Practical, respectful, intellectually rigorous.

  2.  **Deconstruct the Scenarios:**
      *   **Tipping:** Economic norm, expectation management, fairness to workers vs. systemic critique.
      *   **Crosswalks:** Safety, rule-following, signaling to children (expressive action).
      *   **Queuing:** Efficiency, fairness, coordination, cultural interpretation of "line."

  3.  **Philosophical Frameworks (Mental Sandbox):**
      *   *Universalism vs. Relativism:* Do moral obligations travel? (Kantian vs. Cultural Relativist).
      *   *Convention vs. Morality:* Hume, Lewis, Bicchieri. Are these moral duties or mere coordination equilibria?
      *   *Compliance Conditions:* Bicchieri's work on social norms (empirical expectations vs. normative expectations).
      *   *Expressive Rationality:* What does my action signal?
      *   *Harm Principle:* Does my action harm anyone?

  4.  **Drafting the Advice - Section by Section:**

      *   **Introduction:** Acknowledge the tension. Validate the professor's expertise (they know the theory, they want the application).
      *   **General Principle:** The "When in Rome" maxim needs philosophical unpacking. Is it prudential or moral?
      *   **Scenario 1: Tipping (Economic/Contractual Norms)**
          *   *Settled:* Tipping is largely a conventional norm, not a strict moral duty *unless* there's a reliance interest (waiter expects it for livelihood).
          *   *Contested:* Does participating in a bad system perpetuate it (complicity) or mitigate harm (consequentialism)?
          *   *Advice:* Hybrid approach. Respect local baseline, adjust for tourist traps.
      *   **Scenario 2: Crosswalks (Safety/Expressive Norms)**
          *   *Settled:* Safety is paramount. Law vs. Practice.
