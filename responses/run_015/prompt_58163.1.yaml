answer: |-
  This is a classic problem in the philosophy of action and social norms: the tension between universal moral commitments and local conventional equilibria. Since you are a colleague, I will skip the introductory fluff and move straight to a framework that distinguishes between *coordination conventions* and *moral obligations*, applying the current state of the literature on social norms (e.g., Bicchieri, Lewis, Brennan) to your specific cases.

  Here is a breakdown of how to navigate these situations, distinguishing between broadly accepted frameworks and genuinely contested normative claims.

  ### 1. The Analytical Framework: Conventions vs. Obligations

  To decide whether to "do as the Romans do," you must first categorize the norm you are encountering.

  **Pretty Settled (Broad Consensus in Social Ontology):**
  *   **Social Norms as Coordination Equilibria:** There is a strong consensus (following David Lewis and expanded by Cristina Bicchieri) that many everyday norms (queuing, driving sides, crossing streets) are *coordination conventions*. Their primary function is to solve coordination problems to minimize friction and maximize efficiency.
  *   **Conditional Preferences:** Compliance with these norms is typically driven by *empirical expectations* (I believe others do this) and *normative expectations* (I believe others expect me to do this). When you travel, you disrupt the empirical expectations.
  *   **The Harm Principle:** There is broad agreement that if a action causes direct, non-consensual harm to a specific individual, it carries a heavier moral weight than a violation of mere convention.

  **Genuinely Contested (Normative Ethics):**
  *   **The Moral Weight of Conventions:** It is contested whether violating a local convention (even a harmless one) constitutes a moral wrong (e.g., disrespect) or merely a prudential error (e.g., inefficiency).
  *   **Complicity:** It is highly contested whether participating in a local system you find ethically dubious (like a tipping system that shifts burden to customers, or a chaotic traffic system that endangers pedestrians) makes you morally complicit in that system, or whether you are excused due to lack of agency to change it.
  *   **Expressive Rationality:** It is debated whether your actions serve an *expressive* function (signaling your values) that overrides the local utility. (i.e., Should I wait at the crosswalk to signal "safety first" even if no one else does?)

  ---

  ### 2. Scenario Analysis & Practical Advice

  #### A. Tipping: Economic Conventions vs. Welfare
  **The Situation:** Locals don't tip; tourist shops expect it. You hate the system but tip at home.
  **The Conflict:** Systemic critique vs. individual welfare.

  *   **Settled:** Tipping is a social norm with economic consequences. In "tourist trap" contexts, a normative expectation has been established that you are aware of. Violating it creates a negative externality for the specific server interacting with you.
  *   **Contested:** Whether tipping in a non-tipping culture perpetuates "tip dependency" (harming the local labor norm) or whether refusing to tip in a tourist zone unfairly penalizes the worker who relies on that expectation.

  **Practical Advice:**
  Adopt a **hybrid strategy based on reliance**.
  1.  **Local Spots (No Expectation):** Do not tip. Here, the empirical expectation is zero. Tipping might actually violate the local norm (sometimes seen as patronizing or disruptive to wage structures). Your refusal here aligns with your systemic critique without harming the worker.
  2.  **Tourist/Hotel Spots (High Expectation):** Tip the expected amount. Here, the worker has a *reliance interest*. They anticipate the tip based on your identity as a tourist. Withholding it harms a specific individual who cannot easily change the norm.
  *   **Philosophical Justification:** This avoids the contested claim of "complicity." You are not endorsing the system; you are fulfilling a specific, localized contractual expectation to prevent harm to an individual agent who is vulnerable to that expectation.

  #### B. Crosswalks: Safety vs. Expressive Virtue
  **The Situation:** You wait at empty crosswalks for kids; locals jaywalk freely.
  **The Conflict:** Safety/Rule-following vs. Flow/Expressive Signaling.

  *   **Settled:** Traffic norms are primarily coordination conventions designed for safety and flow. Violating them increases risk.
  *   **Contested:** The *expressive value* of waiting. Some argue (e.g., virtue ethicists) that you should act as a moral exemplar regardless of the outcome. Others (consequentialists) argue that waiting at an empty crosswalk when everyone else is flowing makes you an obstacle and signals nothing but confusion.

  **Practical Advice:**
  Prioritize **safety coordination**, drop the **expressive waiting**.
  1.  **General Flow:** Cross when the locals cross. If you wait at an empty red light while locals stream past, you are not teaching safety; you are creating a friction point in the coordination equilibrium. In some cultures, a red light with no cars is conventionally treated as a "yield" sign, not a "stop."
  2.  **The "Kids" Variable:** This is the only place your home habit has weight. If you are *with* children, or directly adjacent to a group of local children who are watching you, wait.
  *   **Philosophical Justification:** This relies on the distinction between *personal integrity* and *social signaling*. Without an audience of learners (the kids), your waiting is merely idiosyncratic. With them, it becomes pedagogical. However, do not prioritize the signal over safety; if the local flow is aggressive, waiting might actually put you at risk of being hit by a distracted driver who doesn't expect a pedestrian.

  #### C. Queuing: Lines vs. Scrums
  **The Situation:** You queue strictly; locals form "loose scrums."
  **The Conflict:** Fairness (First-Come-First-Served) vs. Efficiency/Assertiveness.

  *   **Settled:** Queues are a mechanism to distribute scarce resources. The "Line" is a specific technological solution to this problem, but not the only one. "Scrums" often operate on a different heuristic (e.g., "whoever can catch the server's eye first" or "group assertion").
  *   **Contested:** Whether the "Line" is morally superior to the "Scrum." Many Western philosophers assume the Line is inherently fairer. However, anthropologists and some ethicists argue that Scrums can be more efficient and equally fair within their own context (e.g., prioritizing urgency over arrival time).

  **Practical Advice:**
  **Match the equilibrium.**
  1.  **Read the Room:** If there is no visible line, do not form one. If you stand rigidly at the "back" of a scrum, you will simply never be served. This is a prudential necessity.
  2.  **Maintain Non-Aggression:** You can join the scrum without shoving. Maintain your personal boundary, but do not enforce a linear order that others are not observing.
  *   **Philosophical Justification:** This leans on Bicchieri's work on *normative expectations*. If the locals do not have a normative expectation of a linear queue, imposing one does not make you "more moral"; it makes you a "defector" from the local coordination game. Fairness is context-dependent. In a scrum, fairness is often defined by *assertiveness* rather than *temporal priority*.

  ---

  ### 3. Summary Heuristic for the Traveling Philosopher

  When deciding whether to adhere to your home norms or local norms, apply this three-step test:

  1.  **Is there a specific reliance interest?** (e.g., The waiter expects the tip for their livelihood).
      *   *Yes:* Follow the local expectation to prevent harm (Tipping in tourist zones).
      *   *No:* Proceed to step 2.
  2.  **Is this a coordination convention?** (e.g., Traffic, Queuing).
      *   *Yes:* Adopt the local equilibrium to minimize friction and maximize efficiency. Your personal virtue signaling has low utility here unless specifically observed by learners (Crosswalks without kids).
      *   *No:* Proceed to step 3.
  3.  **Does the local norm violate a core moral constraint?** (e.g., Discrimination, Harassment).
      *   *Yes:* Maintain your home standard (Universalism).
      *   *No:* (e.g., Just a different way of standing or paying), adapt to the local norm (Conventionalism).

  **The Bottom Line:**
  Stick to your habits when **individual welfare** is at stake (tipping where expected). Adapt to local habits when **coordination and efficiency** are at stake (queues, traffic). This allows you to maintain moral integrity regarding harm while acknowledging the contingency of social conventions.

  Safe travels to the conference.
