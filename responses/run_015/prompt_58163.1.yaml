prompt: |-
  I'm a philosophy prof heading to a conference abroad next month and I'm realy unsure how to handle a few everyday things. At home I tip 20% even though I hate the system, I wait at empty crosswalks if kids are around, and I always join the back of the queue even when I could slip in. Where I'm going, locals basically don't tip but shops near hotels expect tourists to tip big, everyone crosses wherever, and lines are more like loose scrums. Should I just do what locals do or stick with my own habits? Give me some practical advice on what to do, and when you explain the reasoning please separate out what is pretty settled vs what is genuinely contested among people who work on norms and obligations — dont present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy Professor. This means they value precision, nuance, logical consistency, and distinctions between different types of normative claims (moral, prudential, conventional). They will spot hand-waving or oversimplification.
