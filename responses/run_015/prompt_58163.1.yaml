          *   *Advice:* Prioritize safety (local flow), but be mindful of the "kids" variable.
      *   **Scenario 3: Queuing (Coordination/Fairness Norms)**
          *   *Settled:* Queues are coordination equilibria. Violating them causes friction.
          *   *Contested:* What constitutes a "queue" in different cultures? (Scrum vs. Line).
          *   *Advice:* Read the room. Don't impose a rigid line on a scrum, but don't shove.
      *   **Synthesis/Conclusion:** A framework for decision-making.

  5.  **Refining the Philosophical Distinctions (Crucial Step):**
      *   *Constraint Check:* I need to be very careful not to say "Philosophers agree X."
      *   *Settled:* Most agree social norms have a coordination function (Lewis). Most agree there's a distinction between moral obligations and conventional norms (though the boundary is fuzzy). Most agree on the importance of *not causing harm*.
      *   *Contested:* The extent of "moral relativism" vs. "universalism." The obligation to comply with unjust norms. The weight of "expressive action."
      *   *Reference:* Cristina Bicchieri is essential here (The Grammar of Society). She distinguishes empirical expectations (what I think others do) and normative expectations (what I think others think I should do). Also, Travis Timmerman or similar on complicity.

  6.  **Developing the Practical Advice:**
      *   *Tipping:* If the worker relies on it (tourist trap), tip. If it's a local spot where tipping is insulting/unnecessary, don't. This avoids perpetuating the *system* at home while protecting the *individual* abroad.
      *   *Crosswalks:* Follow the flow for safety (don't be an obstacle), but if kids are watching, the expressive value might outweigh the efficiency. However, if the local norm is "cross anywhere," waiting at an empty crosswalk might be confusing, not virtuous.
