  *   When it nails the Bank: It is using **Lexical Association**.
  *   When it fails the Spatial instructions: It lacks **Simulation Capacity**.

  You can tell your brother: *"It's not that it understands or doesn't. It understands the logic of the text, but it doesn't understand the physics of the rope. When the text encodes the physics, it looks like understanding. When the physics isn't in the training data, it fails. That's not 'no understanding,' that's 'second-hand understanding.'"*
