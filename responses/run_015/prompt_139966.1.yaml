  ### Summary for Your Argument

  Your brother is right that the mechanism is statistical ("squishing patterns"). You are right that the *pattern* sometimes encodes logic ("getting what's being said").

  The **Grounded Inference Condition** gives you the vocabulary to split the difference:
  *   When it fails the joke: It lacks **Pragmatic Grounding**.
