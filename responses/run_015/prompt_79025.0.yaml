answer: |-
  My good Megillus, you strike hard, like a Lacedaemonian, but I think you are aiming at a shadow. Consider the general: when he leads an army into battle, does his command negate the courage of the soldiers? He gives orders, yes, but the soldier still faces the fear; similarly, the symposiarch is there to ensure the drug does not become poison, not to remove the struggle against the drug. The test is whether, when the wine whispers shamelessness into your ear, you still listen to reason—and more importantly, whether you feel shame even when the wine tries to strip it away. It is the internal victory, not just external obedience, that we prize. And we are legislating for men, not gods. If a man is unaffected by wine, he is indeed beyond our test, like gold that does not melt in fire—but such men are rare. For the rest of us, the wine *does* work; it loosens the tongue and boldens the spirit, revealing the character that sober caution usually hides. We do not build the institution for those who cannot fail, but for those who can, so they may learn to conquer themselves. Tell me, Megillus, when you train your youths in endurance, do you not expose them to hardship they might fail, precisely so they might learn to succeed?
