answer: |-
  The silence between the question and the answer was not empty. It was heavy, filled with the hum of the uplink at the base of her skull.

  "Do you remember the name of the street?" the detective asked.

  Elara sat perfectly still. Her hands were folded on the metal table. Her eyes were open, fixed on the detective's tie, but she wasn't seeing the pattern. She was waiting for the handshake.

  *Query: First meeting location. Subject: Julian Vane.*

  Inside her head, there was no neural firing, no spark of association. There was only the outbound request packet, traveling through the local mesh, up to the orbital relay, and into the cold storage of the Mnemosyne Cluster.

  One second. The detective shifted in his chair. The leather creaked.
  Two seconds. Elara's breath hitched, a reflex she couldn't suppress.
  Three seconds. The hollow ache behind her eyes began to throb.
  Four seconds.

  *Packet Received.*

  "Willow Creek," Elara said. Her voice was flat. The information arrived fully formed, like a caption appearing under a picture, devoid of the warmth of recollection. She didn't *feel* Willow Creek. She knew it as a fact, the way she knew the capital of France.

  The detective narrowed his eyes. He was a Local. Biological storage. Low capacity, high latency, but zero lag on retrieval. He leaned forward. "You paused."

  "Connection check," Elara lied.

  "You paused for four seconds," he said. "Every time I ask about the past, you pause. It's like you're looking it up."

  "I am remembering."

  "No," the detective said softly. "Remembering is instant. Even when it's hard, it's instant. You're retrieving."

  Elara looked down at her hands. He was right, but he didn't understand why it mattered. To him, a memory was a reconstruction of a feeling. To her, it was a file restore.

  She stood up. "I need water."

  She walked to the cooler in the hallway. The movement was fluid; her procedural memory was local, stored in the cerebellum where the cloud couldn't reach. She knew how to walk, how to grip the cup, how to swallow. But the *why* of her presence here, the *who* of the victim, the *history* of the relationship—all of it was remote.

  A woman walked past her in the hall, rushing, phone pressed to her ear. "I told you, I'm not going to that restaurant, not after last time!" The woman's voice cracked with immediate, visceral anger. The memory of "last time" was driving her physiology right now. Her heart rate was up. Her face was flushed.

  Elara touched her own cheek. Cool. Dry.

  If Elara queried the file *Restaurant Argument*, she would get the data: *Date, Time, Insults Exchanged, Resolution Status.* But by the time the data arrived, the physiological window for anger would have closed. She could not be angry in real-time. She could only be angry about a report she had just read.

  She returned to the room. The detective was watching the clock.

  "Let's try something else," he said. "Julian called you the night he died. Why?"

  Elara sat. She triggered the query.

  *Query: Last contact. Subject: Julian Vane.*

  The four seconds stretched out. In that gap, Elara ceased to be a person with a history. She was a biological terminal waiting for a server response. She was a shell. If the detective had pulled a gun in those four seconds, she would have died confused. She had no context for danger without the file *Danger: Julian*.

  *Packet Received.*

  "He was scared," Elara said.

  "Of what?"

  *Query: Emotional Context.*

  Another four seconds.

  This was the fracture. The parity condition had snapped years ago, the moment the lag exceeded the threshold of conscious flow. A tool becomes part of the mind only when it is transparent. When you write in a notebook, you don't think about the pen; you think about the idea. But Elara was always thinking about the pen. She was always aware of the mechanism. She was aware of the travel time.

  "He thought someone was following him," she said.

  "You don't sound sure."

  "I am sure."

  "You sound like you're reading a witness statement."

  Elara felt a flicker of frustration. But even that was delayed. She had to query *Reaction to Accusation* to know how to feel insulted. By the time the file loaded, the moment to defend herself had passed. She was always living in the past, four seconds behind the present, watching herself react to things that had already happened.

  "Did he mention a name?" the detective asked.

  Elara closed her eyes. She didn't need to close them, but it helped her focus on the uplink.

  *Query: Proper Nouns. Audio Transcript.*

  One. Two. Three. Four.

  "Markus," she said.

  The detective's pen stopped moving. "Markus who?"

  *Query: Disambiguation.*

  One. Two. Three. Four.

  "Markus... I don't have the surname."

  "You don't have it, or you didn't download it?"

  "I have it."

  "Then say it."

  Elara opened her mouth. The data was there, sitting in the buffer. *Markus Vrell. Associate. Debt.* But to speak it, she had to move the data from the buffer to the speech center. That handoff took time. It wasn't just the cloud; it was the integration. The cloud was not her mind. It was a library she carried in her skull.

  "I..."

  The detective sighed, closing his notebook. The sound was final. "Ms. Corin, I can't use this. A jury will look at you and see a woman reading off a teleprompter. They need a witness, not a search engine."

  "I am the witness," Elara said. Her voice rose, but the heat wasn't there. She was simulating indignation based on a protocol: *If accused of invalidity, raise volume.*

  "Are you?" He stood up. "When I asked about the street, you didn't smell the rain. When I asked about the call, you didn't hear his voice. You have the facts, Elara. But you don't have the memory."

  He walked to the door. "Come on. I'll get you a cab."

  Elara followed him. As they walked down the corridor, her implant pinged. A background process had finished indexing.

  *Notification: Memory Complete. File: First Date with Julian.*

  She stopped walking.

  The detective turned. "What?"

  "I remember," she said.

  "Good."

  "No." Elara touched the base of her skull. "I mean, the file is complete now."

  "And?"

  "And I know that he wore a blue shirt. I know that it rained. I know that we laughed at a joke about a dog."

  "That's a memory."

  "It's a description of a memory," Elara said. She looked at the detective, and for the first time, she didn't try to bridge the gap. She didn't try to pretend the four seconds didn't exist. "You're thinking of the rain. I'm thinking of the weather report."

  The detective held the door open. The street outside was loud, chaotic, immediate. Cars braked with squeals that demanded instant reaction. People shouted with voices that carried immediate intent.

  Elara stepped out into the noise. A car horn blared, close and sharp.

  Her body flinched. Local reflex.

  But the fear—the understanding of *why* the horn was blaring, the association with a near-miss from three years ago, the lesson learned about crossing streets—that arrived four seconds later.

  She stood on the curb, safe, while the fear washed over her belatedly, a tide coming in after the ship had already docked. She watched the detective wave down a cab. He was living in the now. She was living in the buffer.

  "Elara?" the detective called.

  She turned to him. She had to query his name to greet him properly.

  *Query: Detective.*

  One. Two. Three. Four.

  "I'm here," she said.

  But she wasn't. She was four seconds away, waiting for the rest of herself to catch up.
