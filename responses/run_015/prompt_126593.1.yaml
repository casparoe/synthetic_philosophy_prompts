  2.  **Deconstruct the Text (*Meno* 97a-98a):**

      *   *Context:* Socrates and Meno are discussing virtue. They conclude that virtue isn't knowledge (because it can't be taught), but true belief guides action just as well as knowledge.
      *   *The Problem:* If true belief works just as well, why is knowledge more prized?
      *   *The Analogy:* Statues of Daedalus were so lifelike they would run away if not tied down.
      *   *The Comparison:* True beliefs are like these statues. They are valuable but fleeting. They escape the soul unless "tied down."
      *   *The Tether:* The tether is *aitias logismos* (calculation/reckoning of the cause/reason).
      *   *The Result:* Tying them down makes them *epistēmē* (knowledge). This is "recollection" (*anamnesis*).
      *   *The Value:* Knowledge is more valuable because it abides (stays put).

  3.  **Address Question 1: Nature of the Tether:**

      *   *Textual Evidence:* Socrates calls it *aitias logismos* (reasoning of the cause).
