answer: |-
  **Final Exam: Philosophy and Economics**
  **Time Allowed:** 60 Minutes
  **Question 1**

  In the 1930s, Oskar Lange proposed a model of market socialism to answer the socialist calculation debate. In Lange's model, a Central Planning Board (CPB) announces trial prices for all goods. State firm managers follow two rules: (1) minimize the average cost of production, and (2) produce output where marginal cost equals the announced price. The CPB observes surpluses and shortages and adjusts prices accordingly (raising prices on goods in shortage, lowering them on goods in surplus) until equilibrium is reached.

  Ludwig von Mises and F.A. Hayek objected to this. A modern critic of Mises and Hayek suggests their objections are obsolete. This critic argues: "Mises and Hayek wrote before modern computing and mechanism design. Today, a CPB need not rely on slow trial-and-error. Instead, the CPB can use a **scoring-rule mechanism**. The Board asks every manager to report their true cost curves and production possibilities. Managers are financially rewarded based on a mathematical scoring rule that makes truth-telling their optimal strategy (i.e., they lose money if they lie and their lie is later verified by outcomes). The CPB then inputs this data into a high-speed general-equilibrium simulation to compute optimal prices and quantities instantly."

  Write an essay evaluating this mechanism-design reply. Your answer must:
  1.  Explain whether the scoring-rule fix fails for a **computational** reason (too much math), an **incentive** reason (managers still lie), or an **ontological** reason (the relevant knowledge does not exist yet to be reported).
  2.  Use this distinction to clarify whether the remaining objection is primarily Mises's or Hayek's.
  3.  State a scoping condition that explains why this objection does not prove that internal planning *within a private firm* is impossible.

  *Note: Answers that simply state "knowledge is dispersed" or "prices are signals" without specifying the nature of the knowledge or the mechanism of the signal will receive low marks.*

  ***

  ### Model Answer

  The mechanism-design reply attempts to solve the socialist calculation problem by converting it from a discovery problem into an information-aggregation problem. It assumes that the data required for economic calculation—cost curves, production possibilities, substitution rates—exists objectively within the minds of managers and can be extracted via proper incentives. While this reply effectively neutralizes a crude version of Mises's objection, it ultimately fails to address Hayek's deeper epistemological argument, and it fails for an ontological reason rather than a computational or incentive-based one.

  To see why, we must distinguish between *hidden information* and *tacit knowledge*. The scoring-rule mechanism is designed to solve problems of hidden information. In standard principal-agent problems, the agent knows the truth but has an incentive to hide it. A proper scoring rule aligns incentives, making truth-telling profitable. If the socialist calculation problem were merely that managers knew their costs but lied to the state to secure easier quotas, the scoring rule would work. This addresses a specific version of Mises's concern regarding incentives under common ownership. Mises argued that without private property in the means of production, there are no genuine prices, and therefore no way to calculate profit and loss. If managers are rewarded for accuracy rather than "political success," the incentive to distort is reduced.

  However, the scoring-rule fix assumes the information exists in a reportable format *before* the calculation takes place. This is where Hayek's objection remains standing. Hayek argued that the knowledge required for economic coordination is not merely dispersed but often inarticulate and contextual. A manager does not always know their marginal cost curve as a fixed mathematical function. They know it through the process of trading, bidding for inputs, and experimenting with production techniques in response to price signals. The knowledge is created *through* the market process, not merely transmitted by it.

  Therefore, the mechanism-design reply fails for an **ontological reason**. It treats economic data as static parameters waiting to be collected, whereas Hayek viewed them as dynamic discoveries emerging from competition. A scoring rule requires verification to punish lying (e.g., "You said your cost was $10, but it was actually $12"). But in a complex economy, the "actual" cost is counterfactual—it depends on what the manager *would have* done under different prices. You cannot verify the truth of a report without running the market experiment that the planning board is trying to replace. If the data does not exist independently of the pricing process, no amount of computing power or incentive compatibility can extract it.

  This distinction clarifies that the surviving objection is Hayek's, not Mises's. Mises's argument was largely about the logical impossibility of rational allocation without property prices (a calculation problem). Hayek's argument was about the utilization of knowledge not given to anyone in its totality (a knowledge problem). The scoring rule solves the incentive aspect of Mises's worry but cannot solve the discovery aspect of Hayek's worry.

  Finally, we must address why this does not prove planning inside a firm is impossible. Firms do plan internally; they do not use price mechanisms for every internal transfer. The scoping condition that saves the firm is the **unity of ends**. Inside a firm, there is a single objective function (profit maximization for the owners) and authority relations that allow for direct command. The entrepreneur directs resources toward a specific, agreed-upon goal. In the broader economy, there is no unity of ends; millions of individuals have incommensurable preferences. Prices are necessary to reconcile these diverse ends, whereas internal firm planning only reconciles *means* to a single *end*. The calculation problem arises when trying to coordinate diverse ends without a common metric, not when coordinating means to a single end.

  **Self-Critique and Strongest Reply**
  The weakest point of this argument is the claim that cost data "does not exist" prior to market exchange. A sophisticated Langean could reply that modern telemetry and AI allow firms to track production possibilities continuously, effectively creating the data the scoring rule requires. If technology turns tacit knowledge into explicit data, Hayek's ontological objection weakens. The strongest Lange-style reply is that if the scoring rule is combined with a simulated market where managers trade virtual rights, the simulation *becomes* the discovery process, effectively replicating the market within the planning board. My argument assumes a sharp line between "data" and "discovery" that technology might blur.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of the Scoring-Rule Mechanism (4 Marks)**
  *   **Full Marks:** Identifies that the scoring rule solves *incentive* problems (lying) but assumes information is *reportable*. Correctly identifies the failure as **ontological** (knowledge is created/discovered, not just hidden).
  *   **Typical Mangling:** Students claim the scoring rule fails because computers aren't fast enough (computational) or because managers will still lie despite incentives (incentive), missing the point that the data might not exist to be lied about.

  **2. Distinction Between Mises and Hayek (4 Marks)**
  *   **Full Marks:** Clearly assigns the incentive/property issue to Mises and the knowledge/discovery issue to Hayek. Concludes the scoring rule addresses Mises but fails against Hayek.
  *   **Typical Mangling:** Treating "Mises and Hayek" as a single monolithic bloc ("The Austrians said...") or attributing the knowledge argument to Mises.

  **3. Specification of Knowledge Type (4 Marks)**
  *   **Full Marks:** Moves beyond "knowledge is dispersed." Specifies that the knowledge is *tacit*, *contextual*, or *counterfactual* (e.g., knowing costs depends on seeing prices).
  *   **Typical Mangling:** Using rote slogans like "prices are telecommunications" or "knowledge is local" without explaining *why* that prevents reporting cost curves to a board.

  **4. The Firm Boundary Scoping Condition (4 Marks)**
  *   **Full Marks:** Identifies **unity of ends** (or single objective function/authority) as the reason firms can plan. Distinguishes coordinating means (firm) vs. coordinating diverse ends (economy).
  *   **Typical Mangling:** Arguing firms are just "smaller" so the math is easier (computational view) or that firms have private property (which begs the question).

  **5. Self-Critique and Counter-Argument (4 Marks)**
  *   **Full Marks:** Provides a plausible weakness in the Hayekian position (e.g., technology making knowledge explicit) and a strong Langean rebuttal (simulation as discovery).
  *   **Typical Mangling:** Offering a weak "straw man" critique (e.g., "Hayek might say computers are slow") or failing to offer a genuine Langean counter-argument.

  **A/B Boundary:**
  The line between an A (16+) and a B (12-15) lies in **Point 1 and Point 3**. A B-grade student will explain that managers might still lie or that the math is too hard. An A-grade student will recognize that the scoring rule *works* for incentives but fails because the **information is endogenous to the market process** (ontological failure). If the student does not articulate that the cost curve is *discovered* rather than *known*, they cannot score above 15.
