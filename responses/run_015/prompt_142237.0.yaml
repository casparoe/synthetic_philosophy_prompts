      *   *Progress:* Don't promise resolution. Promise *clarity of cost*. The Aggregator must accept the "shocking" implication (sacrificing the one). The Separatist must accept the "inefficiency" implication (letting the many suffer small losses).
      *   *The "Addressability" Point:* Lean into the user's hypothesis. It's correct. The Separatist demands a *recipient* of justification. The Aggregator demands a *correct answer* to the problem.

