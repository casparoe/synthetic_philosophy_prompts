          *   *Point 2 (Intervention):* The "Manipulability" objection. ILT is static; intervention is dynamic. This suggests (b) is insufficient for *causal* modeling.
          *   *Point 3 (Singular Limits):* The "Essential Idealization" objection. Batterman's work is relevant here. If the idealization is essential for the *existence* of the phenomenon, invariance testing is impossible. This breaks (b).
