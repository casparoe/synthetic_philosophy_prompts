          *   *Point 6 (Predictions):* Does ILT tell us to stop looking for mechanisms? That seems contrary to scientific practice.
      *   **Internal vs. External:** Distinguish between "Your definition is wrong" (External) and "Your definition collapses" (Internal).
      *   **Insulation/Unfalsifiability:** Address Clause (d). It functions as a "No True Scotsman" defense. This is a methodological risk.
      *   **Verdict on User's Worries (2 & 3):** Validate them. They are the strongest points.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just repeat standard instrumentalist critiques. The user knows those. I need to attack *Invariance Licensing* specifically.
      *   *Focus:* The definition of "Falsity-Class" is the weak link. If I can show that defining the class *requires* prior knowledge of what is causally relevant, then (a) is undermined because you *do* need representational knowledge to set up the test in (b).
      *   *Focus:* Singular limits. If the model *only* works at the limit, then the assumption *is* doing the work. ILT says "swap it." You can't. So ILT says "Model is unlicensed." But the model is standard physics. So ILT rejects standard physics. That's a *reductio*.
