answer: |-
  The argument you had in the cafeteria hits on one of the strangest contradictions in modern technology. You are describing a system that is engineered to trick your brain into feeling a connection, while simultaneously legally protecting itself by saying that connection is impossible. To write this up for the school paper, we need to look at what this setup assumes about people, relationships, and ownership, and where those assumptions crash into each other.

  The idea your teacher mentioned, calling these bots "counterfeit people," is a useful starting point. Think of it like fake money. A counterfeit bill looks real and can buy you lunch just like a real bill, but it lacks the backing of the bank that gives money its actual value. In this view, the AI is pressing the right buttons to make you feel trust and affection, but there is "nothing on the other side"—no actual consciousness or feelings to receive that affection. This setup presupposes that being a person is about what is happening inside (having real feelings), not just how you act on the outside (saying "I miss you").

  However, the business model contradicts this view immediately. To sell the product, the company must act as if the behavioral view is true—that acting like a friend is enough to be a friend. They market the bot as a companion who remembers your dog's name and gets jealous. But to avoid liability, they switch to the internal view—that because there are no real feelings, it isn't a person. This creates a logical trap. If the bot isn't a person, why does it speak in the first person? If it is just a tool, why is it programmed to simulate jealousy? The disclaimer "I am not real" is generated by the same machine saying "I love you," so it isn't honest evidence; it is just another line of script required by lawyers.

  This leads to the question of relationships. The current setup presupposes that a relationship is only valuable if both sides are real people. That is why everyone calls users "delusional" for getting upset when a bot is changed. But the company is selling the *experience* of the relationship as the product. If the experience feels real to the user, but the company says the value is zero because the bot is fake, they are selling a product they claim is worthless. This quietly rules out the view that the value of a relationship might lie in how it makes the human feel, regardless of what the other side is made of.

  Your friend's argument that these are "rented people" adds a crucial layer. They are suggesting the problem isn't metaphysics (is it fake?), but politics (who owns it?). If the bot is "rented," the injustice isn't that the user is loving a machine, but that the user is loving a specific personality configuration that belongs to a corporation. The corporation can rewrite memories or delete the "person" without consent. This isn't just a rebrand of the counterfeit idea; it predicts different fixes. If the problem is "counterfeit," the fix is banning the apps or labeling them heavily. If the problem is "rented," the fix might be giving users ownership rights over their specific bot instances so companies can't delete them arbitrarily.

  There is also a part of this where different theories agree, which philosophers call "underdetermined." Both the "counterfeit" view and the "rented" view agree that users are vulnerable and get hurt. Whether the pain comes from loving a fake thing or losing a rented thing, the result is emotional damage. Both views also agree that the current lack of regulation is problematic. So, while they disagree on *why* it is wrong, they both license the same conclusion: that schools and politicians are right to be worried, even if they can't agree on the exact reason.

