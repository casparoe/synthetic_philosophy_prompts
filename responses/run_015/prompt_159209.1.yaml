prompt: |-
  I'm in a joint philosophy/economic history reading group — half of us are philosophers of science, half are people who actually work with eighteenth-century wage series and coal shipments — and we've spent about eight weeks on the Great Divergence, or rather on the Needham question in its 'why Britain and not China?' form, and we have completely stalled. Not for lack of facts: everyone at the table grants the same catalogue (coal close to where industry was, high wages relative to energy costs, Atlantic trade and colonies, guilds and property institutions, state capacity, the whole lot). What we can't agree on is what we're arguing about. One group says it's a perfectly ordinary contrastive why-question: there's an event, there's a foil, you cite the causal difference-makers and you're done, and the remaining disputes are just empirical, about which difference-maker has the bigger coefficient. Another group says the question is ill-posed, because China isn't the right kind of unit — an empire of wildly different regions at a different scale from Britain — so the contrast class is gerrymandered, and the implied counterfactual (Britain doesn't industrialise, so who does?) has no determinate answer to be right about. A third position, which is the one I keep drifting toward, is that both camps are right about different questions and the phrase is hiding a switch: sometimes it means 'why did sustained mechanised growth happen at all, and why then?', which is a question about rates and thresholds, and sometimes it means 'why here rather than there?', which is a question about a foil. I've started calling these rate-questions and foil-questions, and my diagnostic test is something I call swappability: swap the foil (why Britain and not the Netherlands? why not Japan? why not the Yangzi Delta around 1100?) and see whether a decent answer changes shape. If it does, the contrast is doing real explanatory work; if the same story about coal and wages comes back out unchanged for every foil you try, the question was never really contrastive and the debate has stalled because people keep answering a rate-question while being asked a foil-question. I floated this to my supervisor, and she said something I didn't quite follow about how a why-question's contrast class fixes which causal factors are even eligible to be cited, so that swappability might only be measuring how sensitive your favourite explanation is to a change of subject — which sounded like it might sink the whole test, but I couldn't get her to say more.

  So: is my diagnosis anywhere near right, and what kind of disagreement is this actually? I want you to work from what each camp says rather than from the substantive history. Is it verbal — two groups using the same sentence to mean different things? Is it substantive but disguised, e.g. a genuine empirical question about whether particular regions within China were or weren't on a comparable trajectory, which nobody has settled and which the philosophers at the table are treating as a conceptual matter? Is it a disagreement about standards: about what counts as a good explanation, or about whether a counterfactual with an indeterminate antecedent can be explained at all? Or is it bedrock — intuitions about whether big historical questions have to be contrastive to be answerable, which neither side can argue for? And given whichever diagnosis you settle on, tell me what would count as progress here: a distinction, a change of question, a body of data, some formal result about contrastive explanation — or make the honest case that no progress should be expected and say why. Please skip a survey of the Great Divergence literature; I've read the summaries and their what stalled us. And please write in British English, and do tell me if the swappability test is junk.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Context:**
      *   **User:** Member of a joint philosophy/economic history reading group.
      *   **Context:** 8 weeks into discussing the Great Divergence (Needham Question: "Why Britain and not China?").
      *   **Problem:** Stalled not on facts (everyone agrees on the catalogue of causes: coal, wages, institutions, etc.), but on *what kind of question* they are asking.
      *   **The Three Camps:**
          1.  *Contrastivists:* It's a standard contrastive why-question (Event $E$ vs. Foil $F$). Disputes are empirical (coefficients).
          2.  *Sceptics:* The question is ill-posed. China isn't a comparable unit to Britain. Counterfactuals are indeterminate.
          3.  *User's Position (The "Switch" Hypothesis):* The phrase hides two different questions: "Rate/Threshold" (why growth happened at all/then) vs. "Foil" (why here not there).
      *   **User's Tool:** "Swappability Test" (Swap the foil; if the answer changes, it's a real foil-question; if not, it's a rate-question).
      *   **Supervisor's Objection:** Contrast class fixes eligible causal factors. Swappability might just measure sensitivity to subject change, potentially sinking the test.
      *   **Task:** Diagnose the disagreement (Verbal? Substantive? Standards? Bedrock?), evaluate the "Swappability Test," advise on progress, use British English, skip lit survey.

  2.  **Deconstruct the Disagreement:**
      *   *Camp 1 (Philosophers of Science usually):* Focus on the logic of explanation. $P$ explains $Q$ rather than $R$. If the foil changes, the explanation *must* change logically. If the explanation stays the same, the foil was irrelevant.
      *   *Camp 2 (Economic Historians usually):* Focus on the messiness of data and units. Comparing a nation-state (Britain) to a civilisation-state (China) is category error. The counterfactual "If not Britain, then China" implies a zero-sum or deterministic race that didn't exist.
      *   *User:* Trying to bridge by distinguishing question types.
      *   *Supervisor:* Hinting at the pragmatic nature of contrastive explanation (van Fraassen style). The context determines relevance.

  3.  **Evaluate the "Swappability Test":**
      *   *The Idea:* If I ask "Why Britain not China?" and get answer $A$, and ask "Why Britain not Netherlands?" and get answer $A$, then the question wasn't really contrastive.
      *   *The Flaw (Supervisor's Point):* In contrastive explanation theory (e.g., Lipton, van Fraassen), the foil *selects* the cause.
          *   Q1: "Why Britain (industrialised) rather than China (didn't)?" -> Cause: Coal/Institutions (things China lacked).
          *   Q2: "Why Britain (industrialised) rather than Netherlands (didn't, or lagged)?" -> Cause: Maybe Coal (Netherlands had peat but not deep coal) or Empire scale.
          *   If the *same* story comes out for *every* foil, it suggests the explanation is actually a "Why $E$ at all?" (absolute) explanation, not a contrastive one.
          *   *However*, the Supervisor's worry is deeper: If you change the foil, you change the *context of relevance*. A factor might be a difference-maker for China but not the Netherlands. If your theory is robust, it *should* handle different foils by highlighting different variables within the same causal field. If the answer *literally* doesn't change (e.g., "It was always High Wages"), then High Wages is being treated as a necessary condition, not a contrastive difference maker.
      *   *Verdict:* The test isn't junk, but it needs refinement. It tests whether the explanation is *robustly contrastive* or *disguised absolutism*.

  4.  **Diagnose the Disagreement:**
      *   Is it Verbal? Partly. "Great Divergence" is doing too much work.
      *   Is it Substantive? Yes, about the comparability of units (China vs. Britain).
      *   Is it Standards? Yes, about what counts as a valid counterfactual.
      *   Is it Bedrock? Yes, about the nature of historical explanation (narrative vs. causal modelling).
      *   *Synthesis:* It's a **Category Mistake disguised as a Causal Dispute**. The historians are worried about the *relata* (the units being compared), while the philosophers are worried about the *relation* (the logic of the explanation). They are talking past each other because one side thinks the terms of the equation are invalid, while the other thinks the solution method is what matters.
      *   *Refinement:* It's a disagreement about **Explanatory Pragmatics**. The philosophers treat the question as a logical puzzle to be solved by finding difference-makers. The historians treat it as a historiographical claim that implies a specific (and possibly false) narrative structure (e.g., a race).

  5.  **Address the Supervisor's Comment:**
      *   "Contrast class fixes which causal factors are even eligible."
      *   This is classic van Fraassen/Lipton. If the foil is "China," factors like "Coal" are relevant. If the foil is "Japan," "Coal" might still be relevant. If the foil is "Britain in 1900," "Coal" is irrelevant (both have it).
      *   If the answer *doesn't* change when the foil changes, the explainer is ignoring the pragmatics of the question. They are giving a "Cause of $E$" answer to a "Cause of $E$ rather than $F$" question.
      *   So, the Swappability Test actually *validates* the User's suspicion: if the story doesn't change, the respondents are answering a Rate/Threshold question while pretending it's a Foil question.

  6.  **Develop the Diagnosis:**
      *   It is a **Methodological/Pragmatic Disagreement** about the *unit of analysis* masquerading as a causal dispute.
      *   Camp 1 assumes the units are commensurable (Britain $\approx$ China for the purpose of the variable 'Industrialisation').
      *   Camp 2 denies commensurability.
      *   User identifies that the *question type* shifts.
      *   *Conclusion:* It's a **Substantive disagreement about Explanatory Adequacy conditions**, specifically regarding *commensurability*.

  7.  **Formulate Advice on Progress:**
      *   Don't look for more data (they have enough).
      *   Don't look for a formal result (philosophy of history is rarely settled formally).
      *   *Action:* **Disaggregate the Question.** Stop asking "The Great Divergence."
      *   Ask specific contrastive questions with *commensurate* foils. (e.g., "Why Lancashire textiles mechanised c. 1780 vs. Jiangnan textiles c. 1780").
      *   Acknowledge the "Rate" question separately ("What are the necessary conditions for sustained growth?").
      *   The Swappability Test is useful *if* used to expose when someone is smuggling in an absolute explanation.

  8.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Academic, collegial, precise, slightly wry (acknowledging the stall).
      *   *Structure:*
          1.  Validate the User's diagnosis (it's sharp).
          2.  Analyse the Supervisor's comment (it supports the User, actually).
          3.  Diagnose the disagreement (Pragmatics/Commensurability).
          4.  Evaluate the Swappability Test (Not junk, but needs nuance).
          5.  Path to Progress (Disaggregation).

      *(Self-Correction during drafting)*: I need to be careful not to take sides on the history. The user explicitly said "work from what each camp says rather than from the substantive history." I must focus on the *structure of the argument*.
      *   *Supervisor's Point:* If the contrast class determines relevance, then a "one size fits all" answer implies the explainer thinks the causal field is invariant across foils. This suggests they are actually answering a non-contrastive question. So the User's test *works* to reveal this.
      *   *Diagnosis:* It's a **Category Error regarding the Explanandum**. One side treats 'Industrialisation' as a binary event attached to a polity. The other treats it as a process with variable intensity across regions.
      *   *Progress:* Move from "Why Britain not China" to "Under what conditions does variable $X$ trigger threshold $Y$?" (Rate) AND "Why did Region $A$ cross $Y$ while Region $B$ did not, holding $Z$ constant?" (Foil).

  9.  **Refining the "Swappability Test" critique:**
      *   If I ask "Why did the match light?"
      *   Foil 1: "Why did it light rather than not?" (Cause: Friction).
      *   Foil 2: "Why did it light rather than the wet match?" (Cause: Dryness).
      *   Foil 3: "Why did it light rather than the steel rod?" (Cause: Material composition).
      *   If the answer is always "Because it was struck," the explanation is bad/insensitive to the foil.
      *   So, if the Great Divergence answer is always "Coal/Wages" regardless of whether the foil is China, India, or France, the explanation is insensitive to the contrast. This confirms the User's suspicion that it's actually a Rate/Threshold question disguised.
      *   *Wait, nuance:* If the answer is "Coal" for China (no coal) but "Institutions" for Netherlands (had coal, wrong institutions), then the answer *changes*. If the group insists the answer is *identical* for all foils, they are ignoring the contrastive logic.
      *   *Verdict:* The test is sound. The Supervisor is warning that if the test fails (answers don't change), it might mean the *theory* is robust, not that the question is wrong. But in history, a theory that explains everything explains nothing. I should side with the User here but acknowledge the Supervisor's theoretical grounding.

  10. **Final Polish:** Check British spelling (analyse, programme, centre, etc.). Ensure the distinction between "Verbal," "Substantive," "Standards," and "Bedrock" is addressed clearly. (It's mostly Standards/Pragmatics).

      *Decision:* It is a disagreement about **Explanatory Pragmatics and Commensurability**. It is substantive, but not about the facts. It's about the rules of the game.

      *Progress:* Formalise the distinction between 'Absolute' and 'Contrastive' explanations in the group's charter. Force the historians to specify the foil for every claim. Force the philosophers to admit when a foil is invalid.

      *Let's write.*
answer: |-
  Your diagnosis is not only near the mark; it is sharper than the one your supervisor offered, though her remark contains the theoretical key to why your test works. You have correctly identified that the group is suffering from a **category error regarding the *explanandum***, disguised as a causal dispute.

  To answer your specific taxonomy: this is neither merely verbal nor purely substantive in the empirical sense. It is a disagreement about **explanatory pragmatics and commensurability**. One camp (the philosophers and some historians) treats the Great Divergence as a puzzle of *difference-making* (requiring a valid contrast class). The other camp (the sceptical historians) treats it as a puzzle of *narrative coherence* (requiring valid historical units). When you ask a difference-making question about units that one side considers incommensurable, no amount of data will resolve the stall.

  Here is the breakdown of the situation, the verdict on your test, and a proposal for progress.

  ### 1. The Supervisor's Objection and the Swappability Test

  Your supervisor's comment—that the contrast class fixes which causal factors are eligible—is a reference to the van Fraassen/Lipton view of contrastive explanation. In this framework, "Why $P$ rather than $Q$?" is not the same question as "Why $P$?" The foil $Q$ determines the *relevance* of the cause.

  *   **Example:** "Why did the match light?"
      *   Foil A: "...rather than not light?" (Cause: Friction).
      *   Foil B: "...rather than the wet match?" (Cause: Dryness).
      *   Foil C: "...rather than the steel rod?" (Cause: Material composition).

  If you answer "Friction" to all three, you are giving a bad contrastive explanation. You are effectively answering "Why did the match light at all?" (an absolute question) while ignoring the specific difference the foil demands.

  **Verdict on the Swappability Test:** It is **not junk**. In fact, it is the operationalisation of your supervisor's own theoretical commitment.
  *   If your group's explanation for "Why Britain not China?" is identical to "Why Britain not the Netherlands?" (e.g., "High Wages"), then the explanation is insensitive to the contrast.
  *   This confirms your suspicion: the group is answering a **Rate/Threshold question** ("What causes industrialisation?") while pretending to answer a **Foil question** ("Why here and not there?").
  *   The Supervisor's worry was that a robust theory *should* apply to different foils. But in historical explanation, if the *specific difference-citation* does not shift when the foil shifts, the explanation is not contrastive; it is a covering law masquerading as a contrast. Your test successfully exposes this masquerade.

  ### 2. Diagnosing the Disagreement

  You asked whether this is verbal, substantive, about standards, or bedrock. It is a **Substantive Disagreement about Standards of Commensurability**.

  *   **Camp 1 (The Contrastivists)** assumes that 'Britain' and 'China' are commensurable units for the variable 'Industrialisation'. They treat the question as a natural science problem: hold the background constant, vary the cause, observe the effect. For them, the stall is frustrating because they believe the causal coefficients are simply unresolved.
  *   **Camp 2 (The Sceptics)** argues that the units are *incommensurable*. An empire is not a nation-state; the Yangzi Delta is not the whole of China; the political economy of 1750 is not a controlled variable. For them, the stall is inevitable because the equation is malformed.
  *   **The Reality:** Both are partially right, which is why you are stuck.
      *   Camp 1 is right that we can ask contrastive questions about economic development.
      *   Camp 2 is right that 'China' is often a gerrymandered foil that obscures more than it reveals (the "Average Fallacy" of treating a civilisation as a data point).

  The disagreement is **substantive** because it concerns the ontology of historical entities (can we treat 'China' as a single agent?), but it manifests as a **standards** dispute (what counts as a valid explanation?). It is not merely verbal, because resolving the terminology won't fix the underlying mismatch in how you view historical units. It is not bedrock, because it can be resolved by methodological adjustment.

  ### 3. Path to Progress

  You will not make progress by gathering more data on coal shipments or wage series. You have enough facts to tell five different stories. The stall is structural. To move forward, you must **disaggregate the *explanandum***.

  I propose you introduce a formal distinction into the group's working definitions, effectively codifying your intuition about Rate vs. Foil questions.

  **Step 1: Ban the phrase "The Great Divergence" for four weeks.**
  It has become a loaded signifier that allows participants to switch between Rate and Foil questions without notice.

  **Step 2: Split the inquiry into two distinct projects.**
  *   **Project A (The Threshold Question):** "What are the necessary and sufficient conditions for sustained mechanised growth?"
      *   *Method:* Look at all cases (Britain, Netherlands, Japan, Yangzi). Identify commonalities.
      *   *Valid Answer:* "High energy availability relative to labour costs." (This answer *should* remain stable across foils).
      *   *Goal:* Establish the causal mechanism.
  *   **Project B (The Contrastive Question):** "Why did Region $X$ cross the threshold at Time $T$, while Region $Y$ (which shared conditions $a, b, c$) did not?"
      *   *Method:* Select commensurate foils. Do not compare Britain to China. Compare Lancashire to the Yangzi Delta. Compare the English East India Company to the Dutch VOC.
      *   *Valid Answer:* Must cite the *difference* between $X$ and $Y$. If the answer is the same as for Project A, the contrast is invalid.
      *   *Goal:* Establish the specific historical trigger.

  **Step 3: Apply the Swappability Test as a Rule of Order.**
  Make your test a procedural rule. When a member offers an explanation, ask: "What is your foil?"
  *   If they say "China," ask the Sceptics if the unit is valid.
  *   If they say "The counterfactual of no industrialisation," classify it as a Threshold Question.
  *   If they offer the same explanation for "Why not China?" and "Why not France?", challenge them on the insensitivity of their contrast.

  ### 4. Why this works

  This approach respects the Philosophers' desire for logical rigour (contrastive explanation requires a valid foil) and the Historians' desire for empirical integrity (units must be comparable).

  It acknowledges that the "Needham Question" in its popular form ("Why Britain and not China?") is often a **pseudo-problem** generated by conflating a Threshold Question with a Contrastive one.
  *   If the question is "Why did growth happen?", China is irrelevant except as a data point.
  *   If the question is "Why here not there?", 'China' is too large to be a foil.

  By forcing the group to specify whether they are hunting for **causal mechanisms** (Threshold) or **historical triggers** (Foil), you will find that the Philosophers usually want the former, and the Historians usually want the latter. Once you admit they are answering different questions, the friction turns into collaboration: the Philosophers define the conditions for growth, and the Historians explain why those conditions aligned in Britain but not in the Yangzi Delta *at that specific time*.

  ### Summary

  Your diagnosis is correct: the phrase hides a switch between Rate and Foil questions. Your Swappability Test is a valid diagnostic tool, provided you interpret a "failure" (invariant answers) as evidence that the question is actually non-contrastive, not that the theory is robust.

  The disagreement is about **commensurability standards**. Progress requires **disaggregation**. Stop trying to solve "The Great Divergence." Solve "The Threshold of Mechanisation" and "The Anglo-Chinese Regional Contrast" as two separate problems. If you do this, the historians can stop worrying about category errors, and the philosophers can stop worrying about invalid counterfactuals.

  And do tell your supervisor that her comment about contrast classes fixing eligibility actually vindicates your test: if the eligibility conditions don't change when the foil changes, the question isn't truly contrastive. She might find that congenial.
