      *   *Case (ii): Subpersonal Output.* (Committee/System: Output $p$, Log $\neg Bp$).
          *   CT: No first-person speaker, so no assertion norm violation in the strict sense. Oddity should vanish or be metaphorical.
          *   TT: No first-person stance, so no transparency issue. Oddity vanishes.
          *   *Wait, both might agree it vanishes.* I need a distinction.
          *   *Correction:* CT might say if we *treat* the system as an agent, the norm applies. TT says without consciousness/transparency, the paradox is impossible.
          *   *Refinement:* Let's say the system outputs "p" and "We do not believe p". CT: Pragmatic contradiction in the *output*. TT: No paradox because no *subject* to experience the transparency clash.
      *   *Case (iii): Metacognitive Variant.* ("It is raining but I don't believe I *should* believe it" / "evidence supports it").
          *   CT: Normative claim about belief. Asserting $p$ commits to believing $p$. Saying I shouldn't believe $p$ undermines the commitment. Oddity survives.
          *   TT: Transparency applies to *that* $p$, not necessarily to normative claims about belief. Oddity might be weaker.
