  In the Cruxes section, ensure the predictions are distinct. For the Subpersonal case, if the system has no first-person access, the Transparency Theorist *must* say the paradox vanishes. The Commitment Theorist might say it persists if the system is treated as a speaker. This is a clear divergence.
  For the Two-Channel case, both agree it's odd, but *why* differs. CT: She violates a norm. TT: She exhibits a fractured mind.
