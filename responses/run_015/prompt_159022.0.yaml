      *   *Tone Check:* Ensure neither looks stupid. Both are "equally competent." The previous failed attempt was "each captures something." This one must be "here is exactly where we differ."
      *   *Specifics:* Make sure the "Two-Channel" case is handled carefully. If she says it anyway, is it absurd? Yes. Why?
