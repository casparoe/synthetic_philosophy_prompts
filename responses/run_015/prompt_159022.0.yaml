      *   *Issue 2: Thought vs. Speech.* CT: Thought inherits assertion norms (inner speech). TT: Assertion inherits belief norms. Neutral: Isomorphism between the two domains.
      *   *Issue 3: Transparency.* CT: A useful heuristic, not the explanation. TT: The fundamental metaphysical/epistemic constraint. Neutral: A feature of first-person access requiring integration.
      *   *Issue 4: Constitutive Norms.* CT: Explanatory (constitutes the act). TT: Derivative (reflects the mind). Neutral: Debating direction of fit.

  5.  **Drafting Section 3: Cruxes and Cases:**
      *   This is the most critical part. I need to simulate their predictions based on their theoretical commitments.
      *   *Case (i): Two-Channel Forecaster.* (Evidence for $p$, evidence of unreliability).
          *   CT: Assertion violates the norm because she represents herself as committed while denying it. Oddity remains strong.
          *   TT: Transparency is broken. She sees $p$ is true, but sees she doesn't believe. The tension is real. Oddity remains.
