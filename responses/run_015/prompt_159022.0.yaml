      *   3. Vanishing conditions: Third person, past tense, embedding (conditionals, modals).
      *   4. Attitude specificity: Distinct from intention ("I will $\phi$ but I don't intend to") or desire.
      *   5. Hedging: "It is raining, but I'm not sure I believe it" reduces but doesn't eliminate oddity.
      *   *Refinement:* Ensure the language is neutral.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need three columns: CT, TT, Neutral.
