prompt: |-
  I'm in an ethics seminar this semester and we just wrapped up a unit on epistemic problems for consequentialism (cluelessness, moral uncertainty, that whole cluster of stuff). For my term paper I decided to write up and defend my own position, and my TA basically told me to figure out first whether my position even coheres before defending it. So that's what I want from you: an audit, not a survey.

  Here's roughly where I've landed: (1) act consequentialism is true as a criterion of rightness — an act is right iff it produces at least as good an outcome as any alternative; (2) we are radically clueless about the long-run consequences of almost everything we do — like, whether I take the bus or walk today plausibly shifts the identities of people born decades from now, and once you're at that level of downstream chaos, nobody has any handle on which option's total effects are better; (3) cluelessness is a problem for consequentialism as a *decision procedure* but not as a theory of rightness, since "right" tracks the objective facts and our ignorance of them doesn't make them go away; (4) given all that, I still think I should just maximize expected value with whatever credences I actually have, even when they're super diffuse and weird; (5) because the far future is so astronomically big, I'm genuinely sympathetic to the longtermist claim that reducing existential risk dominates the expected-value calculus, so that's where a marginal charitable dollar should go; and (6) in actual practice I donate to bednets and deworming and other near-term stuff, because the EV numbers people put together for far-future interventions feel basically made up and I don't trust diffs between tiny probabilities of astronomically large effects.

  Some of these feel like they can't all be true at once, but honestly I can't tell which ones are the real problem and which are just surface-level friction. Like maybe (2) and (3) conflict, or maybe that dissolves once you keep objective and subjective rightness apart? And I have a nagging feeling that (4) plus (5) is quietly inconsistent with (6) in a way I can't articulate — like, if I really believed I should maximize EV with my actual credences, shouldn't the longtermist thing win even with garbage numbers, since the garbage cuts both ways? Or is there a principled version of "don't let tiny made-up probabilities dominate huge real ones" that I could sign onto without giving up (4)? Please go through the commitments, tell me which pairs are genuinely in tension and how badly, which ones only look tense, and then tell me what the cheapest single revision is that would clean up the most — I want severities ranked, not just a list of "hmm interesting tension" comments, because I only have like two weeks before the paper draft is due and I'd rather fix one thing well than six things badly.
