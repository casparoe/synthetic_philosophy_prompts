  6.  **Final Polish:** Ensure the advice is specific to a term paper context (e.g., "cite Greco," "define subjective rightness"). Make sure the "Cheapest Revision" is clearly defined as a modification to claim (4).

      *(Self-Correction on "Cheapest Revision"):* Is it cheaper to drop (5)? If they drop (5), they don't need to explain why they don't donate to x-risk. But they said they are "genuinely sympathetic." Dropping a genuine belief is harder than refining a decision rule. Refining (4) allows them to keep the sympathy *and* the behavior. It makes for a more interesting paper too ("Consequentialism under Radical Uncertainty").

