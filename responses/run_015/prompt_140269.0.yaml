answer: |-
  This is a classic problem in the philosophy of history and memory studies. You have correctly identified that your gut is applying a multi-variable filter, but you are trying to collapse the output into a binary switch ("History" vs. "Legend"). That binary is where your inconsistency lives.

  Your proposed principle is 80% of the way there.
  *   **Clause (i) Reference:** Necessary. (Kills Case 4).
  *   **Clause (ii) Causal Chain:** Necessary. (Kills Case 4).
  *   **Clause (iii) Content Survival:** This is the leak. "Something about content" is too vague. In Case 1 (Troy), the content is "War at City." In Case 2 (Arthur), the content is "Knights and Grails." The real Artorius did not fight with knights or seek grails. The real Trojans *did* fight a war at the city.

  The distinction isn't just that content survived; it's that the **structural logic** of the story matches the **structural logic** of the event.

  Here are two candidate principles to replace your single binary. You need both to account for your Exodus verdict (Case 3).

  ### Principle 1: The Causal-Fidelity Principle (Event History)
  *A narrative counts as history of an event if and only if:*
  1.  **Reference:** The names/places refer to real entities (Case 4).
  2.  **Chain:** There is an unbroken causal chain of transmission from event to record, excluding coincidence (Case 4).
  3.  **Isomorphism:** The *action type* described in the narrative core matches the *action type* of the historical reality, even if details are mythologized (Case 1 vs. Case 2).

  ### Principle 2: The Constitutive-Function Principle (Social History)
  *A narrative counts as history of a people if and only if:*
  1.  **Chain:** The story is transmitted within the group (Case 5).
  2.  **Function:** The story performs the work of constituting the group's identity or practices, regardless of event truth (Case 3, Case 6, Case 7).

  ---

  ### Testing Your Cases

  *   **Case 1 (Troy):** Passes Principle 1. Reference (Yes), Chain (Oral tradition), Isomorphism (War/Siege = War/Siege). **Verdict: History (Event).**
  *   **Case 2 (Arthur):** Fails Principle 1. Reference (Yes), Chain (Yes), Isomorphism (**No**). A 5th-century warlord fighting Saxon raids is not structurally isomorphic to a High Medieval king fighting single combats for a Grail. The *action type* has been replaced by a later cultural paradigm. **Verdict: Legend (regarding the man); History (regarding the Middle Ages).**
  *   **Case 3 (Exodus):** Fails Principle 1 (No mass departure). Passes Principle 2. It constitutes the people via ritual. **Verdict: History (Social/Constitutive).**
  *   **Case 4 (Novelist):** Fails Principle 1 (No Chain). **Verdict: Not History.**
  *   **Case 5 (Drifted Battle):** Passes Principle 1 (Barely). Isomorphism is weak ("Battle" = "Battle"), but Reference and Chain hold. **Verdict: History (Thin).**
  *   **Case 6 (Forged Charter):** Fails Principle 1 (Event didn't happen). Passes Principle 2 (Created the town/fair). **Verdict: History of the Town; Lie regarding the Saint.**
  *   **Case 7 (Sleeping Hero):** Fails Principle 1 (Hero didn't return). Passes Principle 2 (Caused rebellion/identity). **Verdict: History of the Rebellion.**

  ### The Hard Truth: Which Verdict Must Go?

  You asked me to be straight about which verdict no clean principle can save.

  **You must drop the binary distinction itself.**

  You cannot have a single definition of "History" that validates Case 1 (Troy) and Case 3 (Exodus) without equivocation.
  *   If "History" means "Accurate description of past events," Case 3 is not history.
  *   If "History" means "Narratives that shape the present," Case 4 (if believed) could become history, and Case 1 (if distorted) might not be.

  However, if you force me to choose between your specific case verdicts to save **Principle 1 (Event History)**:
  **You must downgrade Case 1 (Troy).**
  If Arthur is "Legend" because the stories are culturally anachronistic (Knights/Grail vs. Warlord), then the *Iliad* is equally "Legend" because the stories are theologically anachronistic (Gods/Single Combat vs. Bronze Age skirmishing). You are privileging the "War" core of Troy while dismissing the "War" core of Arthur because of the "Knight" carapace. To be consistent, you must admit that **both are Historical Kernels wrapped in Legendary Carapaces.** Neither is pure "History"; both are "Legend with a Historical Referent."

  ### Three New Test Cases

  Here are three cases to run through the Two-Principle system.

  **Case 8: The Cherry Tree.**
  *Stipulation:* George Washington exists. He cuts down a tree as a child. The story is invented by a biographer 40 years later to illustrate honesty, with no chain of testimony from Washington. It becomes a national myth taught in schools.
  *   **Principle 1 (Event):** Fails Chain. **Verdict: Not History.**
  *   **Principle 2 (Social):** Passes Function. **Verdict: History of American Civic Identity.**
  *   *Gut Check:* Does your gut say "It's a lie" or "It's part of history"? If you say "It's a lie," you prioritize Principle 1.

  **Case 9: The Battle of the Teutoburg Forest (Varus).**
  *Stipulation:* A Roman army is destroyed in 9 CE. No Roman written account survives the immediate aftermath; the details are reconstructed 100 years later by a historian (Tacitus) known for moralizing, using second-hand reports. Archaeology confirms the site and mass death, but not the specific tactical maneuvers described.
  *   **Principle 1 (Event):** Passes Reference, Chain (weak), Isomorphism (Battle = Battle). **Verdict: History (with caveats).**
  *   *Gut Check:* This is the middle ground between Troy and Arthur. It tests your threshold for "Chain."

  **Case 10: The Prophecy of the Comet.**
  *Stipulation:* A medieval chronicle records a prophecy that a comet signals the King's death. The King dies. Modern astronomy confirms the comet appeared. The chronicler admits in a marginalia (found later) "I made the prophecy up after he died to make it seem fated."
  *   **Principle 1 (Event):** Fails Chain (on the prophecy). The *death* is history; the *prophecy* is a post-diction.
  *   **Principle 2 (Social):** Passes Function (Legitimized the successor).
  *   *Gut Check:* This tests Case 6 (Charter). Is the story history? No, the *lie* is history.

  ### Field Context: What is Settled?

  Your geoarchaeologist friend is annoying but correct: **"History" is a category error if used as a singular noun.**

  *   **Settled:** Among professional historians, there is a consensus on the distinction between *Event History* (what happened) and *Memory History* (what people believed happened). Your Case 6 (Charter) is settled: The charter is a forgery (Event), but the forgery is a historical source for the monastery's power (Memory).
  *   **Contested:** The threshold for **Principle 1, Clause 3 (Isomorphism).**
      *   *Positivists/Traditionalists:* Argue that if the core reference and chain exist, it is history, and the distortion is just "noise." (They would say Arthur is History).
      *   *Minimalists/Postmodernists:* Argue that if the narrative structure is shaped by later ideology (like the Knights in Arthur), the "kernel" is inaccessible, so it must be treated as Legend until proven otherwise. (They would say Troy is Legend).
      *   *Memory Studies Scholars:* Argue that the distinction doesn't matter; the *effect* of the story is the only accessible history. (They would say Exodus is the only true History).

  ### Recommendation for Your Group

  When you discuss Exodus next month, propose this distinction explicitly:
  1.  **Reconstructive History:** Did the event happen as described? (Exodus = No).
  2.  **Constitutive History:** Did the story create the people who are telling it? (Exodus = Yes).

  If you try to argue that the Exodus is "History" without qualifying *which kind*, you will talk past the archaeologists (who care about Type 1) and the theologians/sociologists (who care about Type 2).

  **Final Verdict on your Inconsistency:**
  Your gut is applying **Principle 1** to Troy and Arthur, but **Principle 2** to Exodus. That is why you feel inconsistent. You are switching definitions mid-stream. Adopt the Two-Principle system, and your verdicts will align without needing to drop any cases, provided you stop using the word "History" without a modifier.
