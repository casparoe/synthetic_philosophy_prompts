answer: |-
  Here is a 60-minute teaching plan designed to navigate the algebra while landing on the philosophical tension you want to highlight. It treats the Housemate's objection not as a disruption, but as the *climax* of the lesson.

  ### 1. The Order of Operations (Dependencies)
  *Total Time: 60 Minutes*

  **0:00–0:10: Credences and The Bridge Principle**
  *   **Define Credence:** Degree of belief (0 to 1). Distinct from objective chance.
  *   **Define Betting Quotient:** The price at which you are indifferent between buying *or* selling a bet that pays $1 if the proposition is true.
  *   **The Bridge Principle (Crucial):** State explicitly: *"We are not defining belief as betting. We are assuming that if you have a credence, you are committed to a fair price. If you refuse to bet, you have no credence."*
      *   *Kills Misconception (a) & (c) pre-emptively.*
  *   **The Bookie's Powers:** State explicitly before any math: *"The Bookie sees your prices. The Bookie chooses the stake. The Bookie chooses the direction (buy from you or sell to you). You must accept."*
      *   *Kills Misconception (d) pre-emptively.*

  **0:10–0:35: The Master Example (Algebra & Violations)**
  *   Put the table on the board (see Section 2). Reveal violations one by one.
  *   **Step 1 (Non-Additivity):** Show the sure loss based on $P(A \lor B)$ vs $P(A) + P(B)$.
  *   **Step 2 (Tautology):** Show the sure loss on certainty ($P(\top) \neq 1$).
  *   **Step 3 (Conditional/Ratio - If Time):** Show the sure loss on $P(A \land B)$ vs $P(A|B)P(B)$.
  *   *Kills Misconception (f) during execution:* Emphasize this is a *guaranteed* loss, not a risk.

  **0:35–0:50: The Philosophical Turn (The Housemate Point)**
  *   **The Prudential Objection:** "My housemate says this just proves you shouldn't take sucker bets, not that your beliefs are wrong."
  *   **The Discussion:**
      1.  If the money is just a proxy for utility, losing money = violating your own preferences.
      2.  If the Bridge Principle holds, violating preferences = violating belief coherence.
      3.  **Concession:** Admit the argument doesn't prove incoherent people *will* lose money in real life (no bookies exist). It proves they *would* if their beliefs committed them to prices.
      *   *Addresses Misconception (b) here.*

  **0:50–0:55: Scope Boundaries (What We Are Not Doing)**
  *   Read this list out loud. Do not debate.
      1.  **Converse DBA:** We are not proving Coherence $\to$ Probabilism today.
      2.  **Operationalism:** We are not saying belief *is* betting behavior.
      3.  **Diachronic/Updating:** We are not doing Conditionalization (that's next week).
      4.  **Accuracy Arguments:** Mention these exist as a non-pragmatic alternative.
  *   *Kills Misconception (e) by omission.*

  **0:55–1:00: The Check Question**
  *   Administer the question (see Section 5). Collect answers.

  ---

  ### 2. The Master Example
  *Do not use horses or coins. They invite objective chance intuitions. Use abstract propositions with logical relations.*

  **The Setup:**
  Write this table on the board at 0:10. Cover the "Bookie Action" column until you need it.

  | Proposition | Student's Price (Fair) | Logical Relation | Bookie Action (To be revealed) |
  | :--- | :--- | :--- | :--- |
  | **$A$** | $0.60$ | | Sell to Student (Student Buys) |
  | **$B$** | $0.50$ | | Sell to Student (Student Buys) |
  | **$A \land B$** | $0.20$ | | Buy from Student (Student Sells) |
  | **$A \lor B$** | $0.80$ | $P(A) + P(B) - P(A \land B)$ | Buy from Student (Student Sells) |
  | **$A | B$** | $0.50$ | $P(A \land B) / P(B)$ | (Only if time permits) |

  **Why this works:**
  1.  **Non-Additivity:** $0.6 + 0.5 - 0.2 = 0.9$. But Student prices $A \lor B$ at $0.8$.
      *   *Bookie Strategy:* Sell $A$ and $B$ to student (Cost $1.10$). Buy $A \land B$ and $A \lor B$ from student (Revenue $1.00$). Net Cost to Student: $0.10$.
      *   *Payoff:* In every world ($A$ only, $B$ only, Both, Neither), the bets cancel out to a $0.10$ loss.
  2.  **Tautology:** You can quickly add a row for $A \lor \neg A$ priced at $0.9$. Bookie sells it for $0.9$, pays $1.00$. Loss $0.10$.
  3.  **Conditional:** $P(A|B) \times P(B) = 0.5 \times 0.5 = 0.25$. But Student prices $A \land B$ at $0.20$.
      *   *Bookie Strategy:* Sell conditional bet and $B$; Buy conjunction.
      *   *Note:* Only do this if you are ahead of schedule. It complicates the "one table" flow.

  **What it lacks:**
  It lacks *objective* probabilities. Do not say "The real chance is 0.5." Say "The logical relation requires the prices to sum this way."

  ---

  ### 3. Misconception Management
  *Here is the order they will form, and exactly where you kill them.*

  1.  **"This is about gambling." (Misconception a)**
      *   *When:* 0:05 (During Bridge Principle).
      *   *Kill:* "The money is arbitrary units. We could use points. The loss is a *symbol* of inconsistency, not a financial warning."
  2.  **"I'd just decline the bet." (Misconception c)**
      *   *When:* 0:05 (During Fair Price Definition).
      *   *Kill:* "A fair price is defined as indifference. If you decline, you are admitting the price wasn't fair, meaning your stated credence was a lie."
  3.  **"The Bookie forces me to bet both sides." (Misconception d)**
      *   *When:* 0:08 (Before Math).
      *   *Kill:* "The Bookie doesn't force both sides. The Bookie chooses *one* direction per proposition that guarantees loss. Your own prices commit you to *both* directions being fair."
  4.  **"Incoherent people actually go broke." (Misconception f)**
      *   *When:* 0:30 (During Proof).
      *   *Kill:* "This is a thought experiment. Real bookies don't exist. The point is you *should not* hold these beliefs, not that you *will* be punished."
  5.  **"Exploitable $\neq$ Irrational." (Misconception b)**
      *   *When:* 0:40 (The Philosophical Turn).
      *   *Kill:* Do not kill it. **Validate it.** "Your housemate is half-right. The loss is prudential. The argument only works if you accept the Bridge Principle that prudential commitment reflects epistemic state. That is the philosophical cost of the argument."
  6.  **"This is about updating." (Misconception e)**
      *   *When:* Never.
      *   *Kill:* By strictly refusing to discuss time or new evidence.

  ---

  ### 4. Scope Boundaries (The "Refusal List")
  *Read this verbatim at 0:50 to prevent the section from drifting into a seminar debate.*

  "I am drawing a boundary around today's section. We are **not** discussing:"
  1.  **The Converse:** Whether being probabilistic guarantees you *can't* be Dutch Booked. (It does, but we aren't proving it).
  2.  **Measurement:** Whether betting quotients are the *only* way to measure credence. (They aren't; see Accuracy Arguments).
  3.  **The Regress:** Why you should be coherent in the first place. (We are taking that as a normative baseline).
  4.  **Updating:** How prices change over time. (That is next week's topic).

  "If you have questions on these, write them down and email me. For now, we are focusing on Synchronic Coherence only."

  ---

  ### 5. The Check Question
  *Put this on the board at 0:55. Ask for a 2-sentence answer.*

  **The Question:**
  "Suppose the Bookie is restricted: they can only **buy** bets from you, never **sell** them to you. Given your incoherent prices, can the Bookie still guarantee you a loss? What does this imply about where the irrationality actually lies?"

  **The Grading Key (30-second scan):**
  *   **Algebra-Only Student:** "No, because the math requires selling the overpriced proposition. The loss disappears." (Focuses on the mechanism of loss).
  *   **Concept-Grasper:** "No. This shows the irrationality isn't the loss itself, but the commitment to the price as *fair in either direction*. If you restrict the direction, you break the Bridge Principle, not the math." (Focuses on the normative commitment).

  **Why this works:**
  It forces them to realize the Dutch Book is a *reductio ad absurdum* of the commitment to the prices, not a practical threat. The student who gets it will identify that the Bookie's freedom to choose direction is what exposes the contradiction in the *agent's* mind, not just their wallet.

  ### Instructor Note on the Housemate
  When you get to the 0:40 mark, say this:
  *"A colleague of mine argued this morning that this argument is circular. They say I'm assuming betting tracks belief to prove belief should be probabilistic. They also say losing money is prudential, not epistemic. I want you to leave today unsettled on that. If you think the Bridge Principle is weak, the argument fails. If you think it's strong, the argument holds. The algebra is the easy part. The Bridge is the philosophy."*

  This validates your housemate enough to show you aren't dogmatic, but validates your own position enough to teach the material. It turns the resentment into a teaching tool.
