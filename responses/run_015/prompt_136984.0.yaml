          *   Need to define *Fair Price* carefully (indifference point).
          *   *Crucial:* The Bookie's powers (choice of stake, direction) must be introduced *before* the first proof, otherwise the "why did they bet that?" objection arises immediately.
          *   *Sequence:* Credence -> Betting Quotient -> Fair Price -> Bookie's Powers -> The Violation (Non-additivity) -> The Consequence (Sure Loss) -> The Interpretation (Why it matters).
          *   *Tautology vs. Non-additivity:* Do non-additivity first. It's the core algebraic violation. Tautology ($P(A \lor \neg A) = 1$) is a specific case of additivity, but often treated separately for "certainty." Let's keep them distinct but linked. Non-additivity is the general case.

      *   **Part 2: The Master Example**
          *   *Requirement:* One event space, one table, reusable for Non-additivity, Tautology, and Conditional (if time).
          *   *Problem with Horse Races:* Mutually exclusive, exhaustive. Good for additivity. Bad for conditional probability (needs intersection).
