      *Refining Ravi's "Three Questions":* This is a strong philosophical distinction. I should validate that. Origin vs. Maintenance is standard (Williams), but "Shape/Specificity" is the crucial G&L addition.
      *Refining Ines's "Exaptation":* She's right that exaptation covers (1) vs (2), but Ravi is right that (3) is often ignored.
