answer: |-
  This is a classic re-enactment of the adaptationism debates, updated for the genomic era. Both Ines and Ravi are competent, but they are talking past each other because they are operating with different definitions of what counts as an "adaptationist explanation." Ines is defending the *methodological utility* of looking for selection; Ravi is defending the *logical rigor* of inferring history from form.

  Here is the adjudication, move by move.

  ### Move-by-Move Adjudication

  **Ines (1): "The critique is out of date... Now we have genome-wide selection scans... 'Just-so story' was a fair charge then and isn't one now."**
  *   **Verdict:** **Half-Right.**
  *   **Why:** She is right that the *methodological* landscape has changed. In 1979, testing for selection was often indirect. Today, we can detect signatures of selection (e.g., selective sweeps) that don't rely on storytelling. However, she is wrong that this neutralizes the *logical* critique. A selection scan tells you *that* selection happened, and roughly *where*, but it does not automatically tell you *which phenotypic feature* was the target, nor does it rule out that the selected allele was hitchhiking with a constraint-driven structural change. Detecting selection is not the same as validating a specific adaptive narrative about a complex trait's morphology.

  **Ravi (1): "That changes the subject. Their target was never 'is there selection somewhere near this trait' — it was the move from 'this trait exists and is useful' to 'it exists because it was useful.'"**
  *   **Verdict:** **Basically Right.**
  *   **Why:** This is the core of the 1979 argument. Gould and Lewontin were attacking a specific inference pattern: reverse engineering. They argued that utility does not prove etiology. Just because a trait is currently maintained by selection (useful) does not mean it originated for that reason. Ines's appeal to modern scans addresses the "is there selection?" question, but Ravi correctly notes this doesn't solve the "did selection build *this specific form* for *this specific function*?" problem.

  **Ravi (2): The Three Questions (Origin, Maintenance, Shape).**
  *   **Verdict:** **Basically Right.**
  *   **Why:** This is a philosophically sound decomposition.
      1.  *Origin* (Etiology): Why did it arise/spread?
      2.  *Maintenance* (Current Utility): Why is it here now?
      3.  *Shape* (Specificity): Why does it look *exactly* like this?
      Ravi is correct that standard adaptationist defenses often conflate (2) with (1). If I show a trait increases fitness now, I have answered (2), but G&L demand evidence for (1). Furthermore, (3) is the subtle killer. Adaptationists often claim a trait is "for X," implying X shaped the details. But often, X only explains the presence, while developmental constraints explain the details.

  **Ines (2): "Only (2) is scientifically tractable. (1) is unreachable history, and (3) is unfalsifiable... (1) versus (2) is already in the literature — that's just the exaptation distinction."**
  *   **Verdict:** **Half-Right.**
  *   **Why:** She is right that (1) is epistemically harder than (2); deep history is always underdetermined. She is also right that the Origin/Maintenance distinction is codified as "Exaptation" (a term Gould later coined to clarify this very point). However, she is too dismissive of (3). Claiming (3) is unfalsifiable is a surrender. Comparative morphology and evo-devo *do* test whether specific structural details track functional demands or developmental pathways. If a trait's geometry is invariant across functions, that counts against the adaptationist explanation of the *shape*.

  **Ravi (3): "(3) is where the actual explanatory weight sits... Plenty of features are maintained without having been shaped for their role: the human chin..."**
  *   **Verdict:** **Basically Right.**
  *   **Why:** This is the strongest philosophical point. The adaptationist programme promises to explain the *fit* between organism and environment. If the "fit" is loose (i.e., the trait works, but its specific form is a byproduct), then the adaptationist explanation is incomplete. The chin example is contested (some argue it is adaptive), but the logic holds: current utility does not guarantee historical shaping of the specific morphology.

  **Ines (3): "Those are cases where the feature is a necessary consequence of something else... Find the coupling and you've got a result, not a conversation stopper."**
  *   **Verdict:** **Basically Right.**
  *   **Why:** She correctly identifies the alternative research programme: Evo-Devo and structuralism. Constraints are not magic; they are physical or developmental causal chains. If you can show Trait B exists because Trait A was selected and B is developmentally coupled to A, that is a testable, positive hypothesis. It is not merely saying "not adaptation"; it is saying "developmental correlation."

  **Ravi (4): "It's only testable once you've decided which trait is the real target of selection, and that's the circularity."**
  *   **Verdict:** **Half-Right.**
  *   **Why:** He identifies a real risk (the "unit of selection" problem), but overstates the circularity. It is not *logically* circular if you have independent evidence of the developmental architecture (e.g., gene regulatory networks) that precedes the selection analysis. However, he is right that in practice, researchers often *assume* the trait is the unit of selection to begin with, which biases the search for constraints.

  **The Dustbin Accusation (Both): "Constraint" vs. "Adaptive story not yet found."**
  *   **Verdict:** **Half-Right (for both).**
  *   **Why:** This is the stalemate point.
      *   **Ines's risk:** If every time an adaptive story fails, you posit a "hidden constraint" without independent mechanistic evidence, "constraint" becomes a god-of-the-gaps.
      *   **Ravi's risk:** If every time a trait looks non-adaptive, you say "we haven't found the function yet," adaptationism becomes unfalsifiable.
      *   **Resolution:** The charge sticks only if either side refuses to specify *independent* criteria for their claims. Constraints need mechanistic developmental evidence; Adaptations need comparative/fitness evidence that rules out drift/constraint.

  ---

  ### What Both Are Missing

  There are three crucial elements missing from this exchange that a philosopher of biology needs to put on the table to dissolve the heat.

  **1. The Heuristic Value of the Adaptationist Programme**
  Ravi treats adaptationism as a truth-claim about history. Ines treats it as a methodological engine. They are missing Daniel Dennett's intervention (1995). Dennett argued that even if Gould is right that many traits are spandrels, the *best way to find out* is to first assume they are adaptations and test rigorously. If you assume "spandrel" first, you stop looking. The adaptationist stance is a *methodological default*, not necessarily an ontological truth. Ines hints at this, but Ravi dismisses it as circularity. They need to agree on whether adaptationism is a *hypothesis* (Ravi) or a *research strategy* (Ines).

  **2. The Role of Null Models**
  The debate is framed as Adaptation vs. Constraint. This is a false dichotomy. The real methodological issue is **Null Models**.
  *   Ines implies the null is "no selection."
  *   Ravi implies the null is "no adaptive shaping of form."
  *   **What's missing:** A formal null model of what the trait would look like under pure drift or pure developmental bias. You cannot claim a trait is a "spandrel" (Ravi) without a model of the expected architectural byproduct. You cannot claim it is an "adaptation" (Ines) without showing it deviates significantly from that null. The "Wars" cooled down when population geneticists started formalizing these nulls.

  **3. Global vs. Local Adaptationism**
  They are arguing past each other on scope.
  *   **Global Adaptationism:** "Most traits are optimal adaptations." (Gould & Lewontin's target; largely abandoned by biologists).
  *   **Local Adaptationism:** "This specific trait is likely an adaptation worth testing." (Ines's defense; standard practice).
  Ravi is winning the argument against Global Adaptationism (which almost no one holds anymore). Ines is defending Local Adaptationism (which is standard science). They need to acknowledge that G&L defeated the Global view, but Ines is working within the Local view which survived the critique.

  ---

  ### Settled vs. Live Disputes

  You asked for explicit distinction here. Do not let them pretend the whole debate is live, nor that it is fully dead.

  **Settled Consensus (The "Post-War" Settlement):**
  1.  **Not everything is an adaptation.** It is now standard orthodoxy that byproducts, spandrels, and exaptations exist. No serious biologist claims *every* trait is optimized.
  2.  **Utility $\neq$ Etiology.** It is accepted that a trait can be currently useful without having evolved for that use (exaptation).
  3.  **Constraints are real.** Developmental and physical constraints are recognized as legitimate evolutionary causes, not just "noise."
  4.  **Stories need evidence.** The "just-so story" critique successfully stigmatized armchair speculation without comparative or genetic evidence.

  **Live Disputes (Where the real work is):**
  1.  **The Proportions:** What percentage of genomic or phenotypic variation is adaptive vs. neutral vs. constrained? This is the "60% question." Estimates vary wildly between population geneticists (often lower adaptive %), behavioral ecologists (often higher), and evo-devo researchers (focus on constraint).
  2.  **The Definition of "Function":** Are we talking about *Selected Effect* function (etiological) or *Causal Role* function (current capacity)? Ines is often arguing for Causal Role; Ravi is demanding Selected Effect. This semantic slippage fuels the fire.
  3.  **Developmental Bias:** To what extent does the structure of the genotype-phenotype map *channel* variation so strongly that selection is secondary? This is the modern incarnation of the "constraint" argument (e.g., Evo-Devo synthesis). Ravi is gesturing here, but the quantitative weight of bias vs. selection is unresolved.
  4.  **Optimality Modeling:** When is it appropriate to use optimality models? Ines thinks they are standard tools; Ravi thinks they presuppose the conclusion. The field is still negotiating the conditions under which these models are valid (e.g., only when genetic variation is known to be abundant).

  ### Final Recommendation for the Department

  Tell Ines she is right that the *tools* have improved, but wrong that the *logic* of the critique is obsolete. Tell Ravi he is right about the *logic*, but wrong to imply that (1) and (3) are scientifically inaccessible.

  The way out is to stop treating "Adaptation" and "Constraint" as rival tribes. They are variables in a single equation. The job is not to decide who won the 1979 war, but to quantify the variance explained by selection versus the variance explained by architecture in specific cases. If they can agree to design a study that explicitly tests a **null model of developmental coupling** against a **model of selective optimization**, they will be doing better science than both Gould and Lewontin did, and better philosophy than they are currently debating.
