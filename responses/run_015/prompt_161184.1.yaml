      *   *Historian's Objection:* History is singular, not lawlike. Agents have reasons, not just causes.
      *   *My Assessment:* The historian is half-right but being protective. Qualitative Comparative Analysis (QCA) and process tracing already do this informally. Formal modelling *can* help clarify logical consistency of narratives, but it can't capture *meaning*.
      *   *Verdict:* Not a category error, but a category *mismatch* if applied reductively. Useful as a heuristic, dangerous as an ontology.

  6.  **Assess the Utility of "Blame" in Historiography:**
      *   *Is it grudge-holding?* Sometimes.
      *   *Does it do work?* Yes. It shapes policy, national identity, and reparations. "Who started it" determines who pays for reconstruction, who gets sanctioned, etc. It's not just academic; it's juridical.

  7.  **Drafting the Response (Iterative refinement):**
