answer: |-
  Your hypothesis is sharp, and your intuition about the system dynamics is correct. But you asked me to push, not flatter. So here is the diagnosis, stripped of the politeness that usually governs seminar talk.

  ### 1. Is the decomposition right? Is it complete?

  Your five-way split (onset, difference-making, lock-in, avoidability, fault) is methodologically sound. It maps well onto distinctions in causal inference (necessary vs. sufficient causes, INUS conditions) and legal theory (factual causation vs. proximate cause).

  However, it is not complete. You are missing **interpretation of intent**.

  In ecosystem modelling, a wolf does not *mean* to regulate the deer population; it just eats. In history, agents act under descriptions. Whether an action counts as "aggressive" (your *onset* category) depends on whether the actor perceived it as defensive. The "Security Dilemma" camp relies on the claim that Action A was defensive for Actor 1 but offensive for Actor 2. Your decomposition treats "aggressive or wrongful" as a property of the event, but in history, it is a property of the *interpretation of the event by the participants*.

  If you don't include **intersubjective framing** as a sixth category, your model assumes an omniscient observer who can label actions "aggressive" independently of the agents' own reasoning. That is a category error in history, even if it's valid in ecology.

  ### 2. Is this decomposition neutral, or is it a move?

  It is not neutral. It is a decisive move in favor of the structuralist/post-revisionist camp, and it does so by changing the rules of engagement.

  Here is why: By decomposing "who started it" into five distinct questions, you are implicitly arguing that the *moral* question (fault) is separable from the *mechanical* question (difference-making/lock-in). In complex systems with positive feedback, mechanical responsibility is often symmetric (both sides amplified the signal), while moral responsibility requires asymmetry (one side was worse).

  Your decomposition makes the blame question look like a confusion because it highlights that in a feedback loop, *fault* dissipates. If the system is unstable, any perturbation triggers collapse. Therefore, focusing on "who pushed" is less important than "why was the system ready to fall?"

  **The Counter-Argument (The Agency Defense):**
  The best argument against your move is that **structures do not make decisions; people do.**
  A structural explanation that dissolves blame risks becoming a "no one is responsible" exoneration. If the Cold War was inevitable due to bipolarity (lock-in), then Stalin's purges, the Gulag, and the crushing of the Prague Spring become mere system noise, not moral crimes.
  The Orthodox/Revisionist camps insist on *fault* not because they are bad modellers, but because they believe history is a **juridical** enterprise, not just a diagnostic one. They argue that even in a tight feedback loop, agents have margins of maneuver. To say the question is "ill-posed" is to say that moral judgment is impossible in complex systems. That is a philosophical stance, not a methodological clarification.

  ### 3. What is left after the decomposition?

  If you successfully get the group to agree on your five distinctions, the argument will not end. It will shift to the **baseline problem**.

  You noted this in your hypothesis ("unless you first tell me the counterfactual baseline"). This is the residual disagreement.
  *   **Orthodox baseline:** The pre-war status quo (independent Eastern Europe). Deviation from this is Soviet aggression.
  *   **Revisionist baseline:** The post-war security vacuum (Russia invaded twice by Germany). Deviation from this is US encirclement.
  *   **Structuralist baseline:** The power distribution (Bipolarity). Deviation from this is impossible; the system converges here regardless.

  Once you strip out the semantic confusion, what remains is a disagreement about **what the "normal" state of the world should have been.** This is not a factual disagreement (archives won't solve it), and it is not purely metaphysical. It is a **normative disagreement about counterfactuals.**

  Historians argue about "what would have happened" based on their theory of human nature and politics. You cannot resolve this with more data. You can only resolve it by admitting that every causal claim rests on a hidden normative model of how the world *ought* to work.

  ### 4. Can ecosystem modelling tools do work here?

  You suspect a historian will call this a category error. They are half-right, but for the wrong reasons.

  **Where they are right:** History is not lawlike. Agents learn. If you model the Cold War as a dynamical system, you assume the parameters are stable. But in 1947, the parameters changed because humans read *Long Telegram* and changed their minds. Ecosystem models generally don't have components that read the model output and rewrite their own code. This is **reflexivity**, and it breaks standard sensitivity analysis.

  **Where they are wrong:** Historians already use these tools; they just do it informally and inconsistently. When a historian says "Even without the Truman Doctrine, containment would have happened," they are doing a sensitivity analysis on a counterfactual baseline. They just don't write down the equation.

  **The Verdict:** It is not a category error to use explicit baselines and sensitivity analysis as **heuristic tools**. It *is* a category error to treat them as **ontological truths**.
  If you introduce a formal model to the group, do not present it as "the answer." Present it as a "consistency check."
  *   *Example:* "If we assume the Security Dilemma is the driver, show me the parameter values where war is avoided. If no such values exist, then 'avoidability' is zero, and blaming leaders is incoherent. If such values exist, then agency matters."
  This forces the structuralists to prove inevitability and the agency-focused historians to prove maneuverability. It won't solve the dispute, but it will stop them from talking past each other.

  ### 5. Does blame in historiography do real work?

  You asked if it's mostly grudge-holding with footnotes.
  Sometimes, yes. But often, **blame is the mechanism of policy transmission.**

  *   **Reparations and Sanctions:** "Who started it" determines who pays for reconstruction (Germany vs. USSR after WWII) or who gets sanctioned (Russia today).
  *   **Doctrine:** If the Cold War was caused by Soviet ideology (Orthodox), the policy response is regime change. If it was caused by US expansionism (Revisionist), the response is retrenchment. If it was structural (Post-Revisionist), the response is balance-of-power management.
  *   **Identity:** National narratives rely on causal attribution. "We are the good guys" requires "They started it."

  Blame is not just backward-looking; it is forward-looking prescription. When your reading group argues about fault, they are arguably arguing about current foreign policy, using the Cold War as a proxy. That is why it feels stuck: because the stakes are not actually about 1947.

  ### Summary Diagnosis

  Your group is stuck because they are treating a **normative disagreement about baselines** as a **factual disagreement about events**.

  Your decomposition is a powerful intervention, but be aware: by proposing it, you are effectively voting for the Structuralist camp. You are arguing that the system matters more than the agents.
  *   **If you want progress:** Don't ask them to adopt your model. Ask them to explicitly state their **counterfactual baseline**. "What world are we comparing 1947 to?"
  *   **If you want to test your modelling tools:** Build a trivial phase-space diagram. Show that under certain parameters, the outcome is independent of the initial perturbation. Ask the "agency" group to identify exactly where the system allows for divergence.
  *   **If you want honesty:** Admit that "Who started it?" is a legal/moral question, not a scientific one. Science (and modelling) can tell you about lock-in and sensitivity. It cannot tell you about fault.

  You are not kidding yourself about the utility of the tools, but you might be kidding yourself that the tools will satisfy the group. They don't want a better model of the Cold War. They want to know who the villain was. And no amount of sensitivity analysis will exorcise the desire for a villain.
