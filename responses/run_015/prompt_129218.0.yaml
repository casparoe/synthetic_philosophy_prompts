answer: |-
  The distinction you are describing is formally known in philosophy as the difference between **object-given reasons** and **state-given reasons**, central to what is called the **Wrong Kind of Reasons** problem.

  Object-given reasons bear on the content or merit of the attitude's object (e.g., evidence that a proposition is true, facts that a person is admirable). State-given reasons bear on the value or consequences of holding the attitude itself (e.g., money for believing, harmony for forgiving). Your intuition that the latter "spoils" the attitude arises because mental states like belief, admiration, and forgiveness have constitutive aims: belief aims at truth, admiration at value, forgiveness at moral reconciliation. To adopt these states solely for external benefits is to abandon their constitutive aims, turning belief into wishful thinking, admiration into flattery, and forgiveness into prudential calculation. This is why state-given reasons feel like category mistakes: they justify *wanting* to be in the state, or *acting as if* one is, but they cannot rationally support the state itself without corrupting its nature.

  The theoretical carving relies on the **Two Kinds of Reason** view (championed by T.M. Scanlon and Derek Parfit). It posits that normative reasons are not univocal; there are reasons for *believing* something and reasons for *wanting to believe* something, and conflating them creates the friction you observe. The "spoiling" effect occurs because these attitudes are transparent: when you deliberate about whether to believe $P$, you must look at $P$'s truth, not the benefits of believing $P$. Introducing state-given reasons forces you to look away from the object, dissolving the attitude.

  Your boundary cases test the rigidity of this distinction. The co-founder case feels respectable because trust is not a pure cognitive state like belief; it is a hybrid of belief and a commitment to rely. While state-given reasons cannot justify the *belief* component (that she is trustworthy), they can justify the *commitment* component (to rely on her despite uncertainty). Here, the practical stakes legitimate the risk-taking element of trust, even if they do not supply evidence of trustworthiness. It is not a reason for the cognitive state, but a reason for the voluntary stance of reliance that accompanies it.

  The admiration case operates differently: telling yourself admiration is a "good idea" is a second-order strategy, not a first-order justification. It is a state-given reason to *cultivate* the attitude, predicated on the hope that cultivation will reveal object-given reasons (merits you previously missed). This is respectable only if understood as a heuristic to align your attention with reality, not as a substitute for the merits themselves. If the merits never appear, the admiration must fade, or it becomes the "bad shape" of self-deception. Thus, the distinction holds: state-given reasons can justify policies of cultivation or commitments to rely, but they cannot directly justify the cognitive or evaluative content of the attitude without violating its constitutive norms.
