answer: |-
  This is a fantastic plan. You have the philosophy right: **SIA (Self-Indication)** says "I exist, so big worlds are more likely" (Presumptuous Philosopher), while **SSA (Self-Sampling)** says "I am a random sample, so my rank matters" (Doomsday Argument). When you combine SIA with rank information, the two effects cancel out, leaving you back at the prior. SSA + Rank pushes you hard toward the Small World.

  Here is a 45-minute run-of-play designed to minimize your talking and maximize their confusion (which is where the learning happens).

  ### Game Title: The Billion-Ticket Lottery

  **Materials:**
  *   Two distinct bowls/boxes (label them **A** and **B**).
  *   Slips of paper for "Tickets."
  *   Candy (the currency).
  *   A coin.
  *   Whiteboard (to track bets, not to lecture).

  **The Setup (Hidden from Students initially):**
  *   **World A (Small):** Contains 1,000 tickets (numbered 1–1,000).
  *   **World B (Huge):** Contains 1,000,000 tickets (numbered 1–1,000,000).
  *   **The Truth:** You (the teacher) flip a coin *before* class. Heads = World A. Tails = World B. You do not tell them the result. You prepare the tickets accordingly.
      *   *Logistics Hack:* You don't need 1 million slips. Just write "World B" on a slip and tell them "If this world is real, your number is drawn from 1 to 1 million." For World A, actually have 1,000 slips (or simulate it).
      *   *Better Logistics:* Don't physically fill the bowls. It takes too long. **Tell them the rules.** "I have flipped a coin. One world is real. You have been assigned a ticket in that world. I know the world and your ticket. You know neither."

  ---

  ### Run of Play (45 Minutes)

  #### 0:00–0:05 | The Hook (No Jargon)
  **Teacher:** "I have flipped a fair coin.
  *   **Heads:** The universe contains **1,000 people**.
  *   **Tails:** The universe contains **1,000,000 people**.
  You are alive. You are in this universe. I have assigned every person in this universe a random ID number.
  **Round 1 Bet:** Put all your candy on Heads (Small) or Tails (Huge). If you guess the coin, you double your candy. If you guess wrong, you lose it."

  *(Give them 3 minutes to debate in pairs. Ask them to write their bet on a slip of paper. Collect the slips. Do not reveal the coin yet.)*

  #### 0:05–0:15 | The Data Drop
  **Teacher:** "Before I reveal the coin, I will give you one piece of data. I looked up your ID number.
  **Everyone in this room has an ID number under 100.** (Specifically, tell them: 'You are ID #45').
  **Round 2 Bet:** You can keep your bet or switch. Same stakes. Double or nothing."

  *(Give them 5 minutes. This is where the room will split. Some will panic and switch to Small. Some will stay on Huge. Some will switch to Small then back. Watch the chaos.)*

  #### 0:15–0:20 | The Reveal & Payout
  **Teacher:** "The coin was... [Reveal Result]."
  *   **If Heads (Small):** The SSA bettors (Small) win. The SIA bettors (Huge) lose.
  *   **If Tails (Huge):** The SIA bettors (Huge) win. The SSA bettors (Small) lose.
  *(Note: Since you only run this once, half the class will feel 'wrong' regardless of their logic. This is fine. The point is the **reasoning**, not the win.)*
  **Action:** Pay out the candy to the winners. Ask the losers to explain *why* they bet that way anyway.

  #### 0:20–0:35 | The Debrief (The "Lecture" they generate)
  Do not explain the theories yet. Ask these three questions and write their answers on the board.

  1.  **"Round 1: Why did you bet Huge?"**
      *   *Target Answer:* "There are way more people in the Huge world. It's more likely I'd be born there."
      *   *Board Label:* **The Existence Boost.**
  2.  **"Round 1: Why did you bet Small?"**
      *   *Target Answer:* "The coin was 50/50. Me being here doesn't change the coin."
      *   *Board Label:* **The Coin Logic.**
  3.  **"Round 2: Why did you switch to Small after seeing ID #45?"**
      *   *Target Answer:* "It's a 1 in a million shot to be #45 in the Huge world. It's 1 in 1,000 in the Small world."
      *   *Board Label:* **The Rank Penalty.**
  4.  **"Round 2: Why did you STAY on Huge even after seeing ID #45?"**
      *   *Target Answer:* "Yes, #45 is rare in the Huge world, but *existing at all* was a million times more likely in the Huge world. It cancels out."
      *   *Board Label:* **The Cancellation.**

  #### 0:35–0:45 | Naming the Beast
  Now you give them the vocabulary.
  *   **The Coin Logic + The Rank Penalty = SSA (Self-Sampling Assumption).** This leads to the **Doomsday Argument** (We are early, so the total must be small).
  *   **The Existence Boost = SIA (Self-Indication Assumption).** This leads to the **Presumptuous Philosopher** (I exist, so the total must be huge).
  *   **The Cancellation = SIA + Rank.** (SIA resists the Doomsday Argument).

  **Closing Thought:** "One of these assumptions implies we can predict the end of the human race from an armchair (SSA). The other implies we can predict the size of the multiverse from an armchair (SIA). Both feel like cheating. Which cheating are you okay with?"

  ---

  ### Predictable Pitfalls & Fixes

  **1. "But I obviously exist, that's not evidence!"**
  *   *The Problem:* Students reject the idea that existence is data.
  *   *The Fix:* Use the "Prisoner" analogy during Round 1. "If I put 1 prisoner in Cell A and 1,000 prisoners in Cell B, and pick a cell at random, then pick a prisoner at random... if *you* are the prisoner picked, which cell were we more likely to have picked?"
  *   *Teacher Script:* "Don't think about *you*. Think about 'The Winner.' Is the Winner more likely to come from the big group or the small group?"

  **2. "I just split my candy 50/50 to be safe."**
  *   *The Problem:* Risk aversion kills the intuition pump.
  *   *The Fix:* Force a binary choice. "You must bet all on Heads or all on Tails. No hedging." Or, make the payout asymmetric: "If Huge wins, you get 1 candy. If Small wins, you get 5 candies." (Adjust odds to match the probabilities you want them to feel).
  *   *Recommendation:* Stick to "All or Nothing." It forces commitment.

  **3. "The teacher rigged the coin."**
  *   *The Problem:* They think the game is about guessing *your* psychology, not the math.
  *   *The Fix:* Acknowledge it. "Even if I rigged it, the *logic* of your bet relies on what you think is rational given the info. Was it rational to bet Huge before knowing the ID?"

  **4. Confusion on the "Twist" (Your specific question)**
  *   *Your Idea:* Tell half the room they are #90.
  *   *My Advice:* **Tell everyone they are #45.**
  *   *Why:* If you tell half the room different info, they will wonder *why* they have different info (e.g., "Am I a special soul?"). It introduces a variable about *identity* rather than *probability*.
  *   *Correction:* Your understanding of the math was **correct**. SSA shifts heavily to Small with rank info. SIA stays put (cancellation). But for a 45-minute session, uniform data makes the debate cleaner. "Why did *you* switch and *you* didn't?" is a better debate than "Why did your info differ?"

  ### What The Game Can't Show (You have to say this)
  1.  **The Reference Class Problem:** The game assumes "You" = "A Human." What if "You" = "A Conscious Being" (includes aliens/AI)? SIA/SSA results change wildly depending on who counts as "you."
  2.  **Physicalism vs. Dualism:** SIA works best if "souls" are waiting to be born. If you think existence is purely physical, the "Existence Boost" feels magical. You have to admit: "SIA feels like magic because it treats existence as a lottery win."
  3.  **One Shot:** Real probability requires many trials. This is a single intuition pump. Acknowledge: "We only ran one universe. Don't trust the candy payout. Trust the argument."

  ### Teacher Cheat Sheet (For the Debrief)
  *   If they say: "I bet Huge because there's more of them." -> **That's SIA.**
  *   If they say: "I bet Small because #45 is too low." -> **That's SSA (Doomsday).**
  *   If they say: "I bet Huge even with #45 because the existence boost cancels the rank penalty." -> **That's SIA resisting Doomsday.**
  *   If they say: "The coin is 50/50, nothing changes." -> **That's SSA ignoring Existence.**

  This setup keeps you as the "Banker" rather than the "Professor," forcing them to wrestle with the intuition themselves. Good luck!
