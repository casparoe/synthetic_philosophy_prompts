prompt: |-
  hey so i run a philosophy club at my high school, like 14 people, we get 45 minutes and basically no budget (i can bring a bag of candy though). last month we did newcomb's problem and it was ok but it turned into me explaining for 20 minutes, so this time i want the idea to come out of the game itself and not out of me talking.

  the thing i want them to feel is that presumptuous philosopher thing — the two ways of reasoning from the bare fact that you exist: the self-sampling one, where you're supposed to treat yourself like a random draw from all the people there will ever be, and the self-indication one, where you being here at all is itself evidence that there are lots of people. i want them betting candy on whether the world ends up with a small or a huge number of people, and i want them to notice on their own that under one of these just the fact that they showed up makes them wildly confident, which feels like cheating, and under the other it dosent.

  one twist i thought of: in a second round tell half the room they're, like, the 90th human ever born. my understanding is that this should move things a lot on the self-sampling side (doomsday-ish) and basically not at all on the self-indication side, because the boost you get from there being many people and the hit you get from being this early cancel out. if ive got that backwards, say so and fix the setup.

  can you give me: rules and a payoff scheme using candy or points, a 45-minute run of play with no lecture at the front and without either name being said until afterwards, a debrief that maps specific moments onto the two assumptions, what will predictably go wrong (people not betting seriously, people who just dont get what it even means for your own existence to be evidence), and what the game cant show so ill just have to tell them straight.
