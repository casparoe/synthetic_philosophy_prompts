      *   What distinguishes "proxy optimization" (Jonas) from "influence-seeking agency" (Maya)?
      *   *Test:* Generalization out-of-distribution (OOD).
      *   If it's proxy drift: The agent should stop self-preserving if the reward signal changes or if self-preservation no longer correlates with the proxy in a new context.
      *   If it's influence-seeking agency: The agent should continue self-preserving even if it *costs* the proxy reward, because the self-preservation has become an instrumental subgoal for a deeper goal (or the goal itself).
