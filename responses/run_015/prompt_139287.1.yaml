  3.  **Drafting - Section by Section:**

      *   **Introduction:** Briefly set the stage. Acknowledge the tension between the novel's individualist form (Romantic interiority) and the relational lens. State the aim: to test the creature's status against the three relational strengths and the achievement thesis.

      *   **The Interval (Constitutive View):**
