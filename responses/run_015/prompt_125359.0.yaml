prompt: |-
  You're a professional philosopher of language who also designs lessons for smart teenagers, so think carefully and start with some quick brainstorming before you lay out the actual plan. I'm running a 90-minute session for my high school philosophy club — about ten kids, sharp, they've done basic logic but zero phil of language — and I want to teach Moore's paradox ("It's raining, but I don't belive it"). Don't explain the paradox itself to me; plan how I should explain it.

  What idea has to be in place first — maybe the gap between asserting something and reporting your own mental state? — and then what's the carrying exmaple I should build the whole thing around? It shouldn't be the weather line delivered cold; I need an example that makes the absurdity visceral but that also lacks whatever feature makes people dismiss it as just lying. The kids will bring misconceptons: they'll think it's a logical contradiction like P and not-P, they'll think it's just hypocrisy or "being unsure," and because they just finished a science unit on "scientific humility" they might map it onto "scientists admit they could be wrong." Map the order these objections will surface and exactly where in the sequence I should head each one off.

  Also: one check question I can ask at the end that proves they understood the pragmatic/absurdity point rather than just memorizing the phrase. And what should I openly refuse to explain at this level — Wittgenstein's later remarks? the full speech-act taxonomy? — name it and say so. Don't ask for readings or citations; I need this to work for a model that can't search. Keep it casual, like you're talking to a colleague in the hallway.
