answer: |-
  # Final Exam: Political Philosophy Seminar
  **Time Allowed:** 45 Minutes  
  **Expected Word Count:** 800–1000 Words  
  **Total Marks:** 20

  ### Essay Question

  Consider the following "Cascade Entitlement" scenario: 
  In Year 1, Wilt Chamberlain (C) voluntarily receives payments from fans for basketball performances (Justice in Transfer). With these funds, C acquires exclusive proprietary licenses for elite training facilities on previously unowned land (Justice in Acquisition). C bequeaths these licenses to his heirs, who do not play basketball but charge rents to aspiring players for access to the facilities. This cycle repeats for generations. Eventually, a class of rights-holders collects substantial rents without direct labor, while others must pay to participate in the sport, even though every individual acquisition and transfer in the chain satisfied Nozick's principles of justice in acquisition and justice in transfer.

  Write an essay that addresses the following:
  1.  Apply Nozick's three principles of entitlement precisely to this cascade to determine if the final distribution is just.
  2.  Explain whether and where the principle of rectification could apply in this scenario.
  3.  Discuss the role of the Lockean proviso (and Nozick's modification of it) in determining whether this cascade is permissible.
  4.  Evaluate what this case demonstrates about the conflict between historical entitlement theories and patterned principles of distributive justice.

  ***

  ### Model Answer

  Nozick's entitlement theory asserts that a distribution is just if it arises from a just initial situation through just steps. In the Cascade Entitlement scenario, the final inequality appears stark, yet Nozick's framework likely validates it, provided specific constraints are met. To analyze this, one must deploy his three principles: justice in acquisition, justice in transfer, and justice in rectification.

  First, Chamberlain's initial earnings satisfy justice in transfer, as fans voluntarily parted with their money. Second, the acquisition of training licenses satisfies justice in acquisition, assuming the land was previously unowned and the appropriation did not violate the Lockean proviso. Third, the intergenerational bequests are voluntary transfers, preserving entitlement. Consequently, under Nozick's historical principles, the resulting class of rent-seeking heirs holds just titles. The labor-free nature of their income is irrelevant; entitlement derives from the history of the holding, not the current effort expended by the holder. Because every step was voluntary and initially just, the current distribution is just, regardless of the resulting inequality.

  The principle of rectification applies only if a past injustice occurred. In this hypothetical chain, every step is stipulated as just. Therefore, rectification has no purchase here. Rectification is not a mechanism to correct inequality that arises from just processes; it is solely a remedy for violations of acquisition or transfer principles (e.g., fraud or theft). If the heirs' wealth stems from a clean history, no rectification is due, even if the outcome resembles feudal aristocracy. This highlights a critical limitation: entitlement theory cannot intervene in "clean" cascades of wealth accumulation, no matter how detached from labor the resulting income becomes.

  However, the permissibility of this cascade hinges on the Lockean proviso. Nozick accepts a weakened proviso: appropriation is unjust if it worsens the situation of others compared to the baseline of common use. If the proprietary licenses monopolize essential training infrastructure such that aspiring players are worse off than they would be in a state of nature (or prior to appropriation), the initial acquisition fails. If the proviso is violated at the origin, the entire cascade is tainted, and rectification would apply. Thus, Nozick does not reject the proviso; rather, his specific non-worsening interpretation is essential to allowing the cascade. If the proviso were stronger (e.g., requiring "enough and as good" in a strict physical sense), the monopoly might be barred. The cascade survives only because Nozick's proviso allows appropriation provided others are not net harmed, often measured by overall opportunity or compensation.

  Finally, this case illuminates the fundamental conflict between historical and patterned theories. Patterned principles (e.g., equality, need, or merit) would condemn the heirs' rent-seeking as unjust because the distribution does not match a specific metric of desert or equality. Nozick argues that maintaining any pattern requires continuous interference with voluntary transfers, violating liberty. The Cascade scenario demonstrates that liberty upsets patterns: free exchanges inevitably generate inequalities that drift from any pre-set design. For Nozick, justice is procedural, not end-state. If the process is clean, the outcome is immune to critique based on its shape. The scenario thus serves as a reductio for patterned theories: to prevent the cascade, one must forbid voluntary bequests or acquisitions, which Nozick views as a violation of self-ownership. Ultimately, the case shows that entitlement theory prioritizes the sanctity of historical transactions over the moral appeal of distributive outcomes, accepting significant intergenerational inequality as the price of liberty.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Accurate Deployment of the Three Principles (5 Points)**
  *   **Criteria:** Student correctly identifies that Acquisition (licenses), Transfer (payments/bequests), and Rectification (absence thereof) validate the cascade. Must note that labor is irrelevant to entitlement.
  *   **Typical Mistake:** Treating the lack of labor by heirs as a violation of Justice in Acquisition or Transfer.

  **2. Analysis of the Lockean Proviso's Role (4 Points)**
  *   **Criteria:** Student explains that the cascade is permissible *only if* the proviso (non-worsening condition) is satisfied. Must note Nozick modifies/accepts the proviso rather than rejecting it outright.
  *   **Typical Mistake:** Claiming Nozick completely rejects the Lockean proviso or that the proviso bans all monopolies regardless of harm.

  **3. Historical-versus-Patterned Tension (4 Points)**
  *   **Criteria:** Student contrasts the procedural validity (historical) with the unequal outcome (patterned). Must articulate that liberty upsets patterns.
  *   **Typical Mistake:** Conflating Nozick's historical view with utilitarianism or claiming patterned principles are compatible with voluntary transfers.

  **4. The Rectification Question (4 Points)**
  *   **Criteria:** Student correctly identifies that rectification applies *only* if past injustice occurred. In this hypothetical just chain, rectification is irrelevant.
  *   **Typical Mistake:** Suggesting rectification can be used to fix the inequality generated by the cascade despite the just history.

  **5. Argumentative Clarity and Precision (3 Points)**
  *   **Criteria:** Essay is logically structured, uses terminology correctly (e.g., "entitlement," "appropriation"), and stays within the scope of the prompt.
  *   **Typical Mistake:** Vague use of "justice" without distinguishing between distributive, procedural, or rectifying justice.
