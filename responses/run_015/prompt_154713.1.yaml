prompt: |-
  I'm preparing the final examination for an upper-level undergraduate seminar in philosophy of action and rational choice. I need a single essay question focused on Buridan's ass and the problem of choice without preference, designed so that it cannot be answered by summarizing the standard paradox. The question should force students to engage with symmetry-breaking, second-order rules for preference formation, and the boundary between practical and epistemic rationality.

  Please construct the exam prompt with the following specifications. The exam is 90 minutes; answers should be approximately 950 words; the total mark is 25 out of 100. The answer must be written in American English.

  The question should present the classic Buridan's ass scenario—an agent facing two options that are identical in every value-relevant respect—then inject a non-standard variant to test conceptual depth: an autonomous decision system that must select between two identically optimized rescue paths. The system may either stall for new data (risking total failure) or execute a deterministic tie-break protocol that was hard-coded by its designers and is invisible to the system's own reasoning. Students should be asked to analyze whether adopting an internal randomizing rule resolves the human agent's paralysis without merely expressing a hidden preference, whether allowing agents to revise their own preference-formation rules collapses practical rationality into epistemic rationality, and whether the system's designer-imposed protocol resolves the paradox or merely relocates it to the designer's choice.

  Please provide:
  1. The exam question itself, clearly stating the three parts (analysis of randomizing rules and second-order preference change; evaluation of the practical/epistemic boundary; application to the autonomous system case).
  2. A model answer of about 950 words that takes a clear critical position—specifically, that randomization operates on the decision framework rather than on the options, that practical and epistemic rationality remain distinct because value is not reducible to credence, and that the system's protocol relocates rather than resolves the paradox—while engaging with objections.
  3. A marking scheme built around five must-hit analytical moves. For each move, state the point value (totaling exactly 25), provide a one-line description of what distinguishes an excellent execution from a mediocre one, and include a one-line note on the specific misunderstanding or omission that typically costs candidates marks on that point. The scheme should separate answers that genuinely understand the symmetry-breaking problem from those that have only memorized the label "Buridan's ass."

  Do not include bibliographies, reading lists, or citations to specific scholarly works. Do not ask for quotations from historical texts. The prompt should be self-contained and answerable by a student with no web access.
