          2.  Unpack the theological analogy (Fall of Man).
          3.  What does "actual economic fact" mean (empirical law vs. conceptual consequence)?
          4.  Is "wretchedness in inverse proportion..." economics, alienation, or exploitation? Does the distinction matter?
          5.  Is "immanent critique" a useful label or just jargon?
