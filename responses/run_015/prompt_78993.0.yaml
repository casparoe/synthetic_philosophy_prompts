  11. **Final Polish:** Ensure the distinction between "exploitation" (economic) and "alienation" (philosophical) is clear but nuanced, as 1844 Marx blends them. (Exploitation is the mechanism; Alienation is the experience/ontological state).

  *(Self-Correction on "Immanent Critique")*: I should be careful not to validate the term too much. It *is* jargon, but useful jargon. I need to balance that.

  *(Self-Correction on "Actual Economic Fact")*: This is the trickiest part. Is it the fact of *wages*? Or the fact of *alienation*? Most scholars say it's the fact that the worker becomes poorer the more they produce. I will lean that way but admit ambiguity.

