answer: |-
  You have identified a precise and pernicious structural maneuver, one that sits at the intersection of epistemology, archival science, and critical theory. While there is no single canonical term that captures the *entirety* of this specific combination (claimed externality + internal justification + denial of constructedness), the phenomenon is well-recognized under a cluster of concepts.

  The most accurate diagnostic label for this pattern is **Methodological Reification** defended by a **Transcendental-Pragmatic Loop**.

  Here is the carving you requested: what the phenomenon is, what it is not, and the boundary conditions that distinguish it from ordinary methodological assumptions.

  ### 1. The Core Concept: Methodological Reification
  At its ontological core, this move is a **category mistake** (in Gilbert Ryle's sense) that hardens into **reification** (in the Marxist/Frankfurt School sense).

  *   **The Move:** Treating a *constitutive rule* (a decision about how to organize) as a *natural fact* (a discovery about how things are).
  *   **The Mechanism:** The finding aid or conceptual framework is a tool (an instrument), but it is presented as a mirror (a representation).
  *   **The Name:** In Science and Technology Studies (STS), specifically in the work of **Geoffrey Bowker and Susan Leigh Star** (*Sorting Things Out*), this is called the **Naturalization of Infrastructure**. They argue that classifications (like "personal" vs. "professional") become invisible when they work well, appearing as neutral reality rather than political choices.
  *   **Why it fits:** It captures the "transparency" you describe. The frame is not seen as part of the collection; it is seen as the *window* through which the collection is seen.

  ### 2. The Logical Structure: The Transcendental-Pragmatic Loop
  You noted the specific tension: the frame claims to be a *condition of possibility* (transcendental) but is justified by *empirical success* (pragmatic). This is a specific form of circularity that lacks a single common name, but can be described as **Transcendental Smuggling**.

  *   **The Transcendental Claim:** "This framework is not an object of study; it is the condition under which study is possible." (It claims to be *a priori*).
  *   **The Pragmatic Justification:** "We know this framework is correct because it organizes the papers effectively." (It is validated *a posteriori*).
  *   **The Contradiction:** If the framework is truly the *condition* of the study, it cannot be validated *by* the study. If it requires validation by the results, it is merely a hypothesis *within* the study.
  *   **Distinction from Circularity:** Ordinary circularity (e.g., the Hermeneutic Circle) is often acknowledged as a dynamic process of understanding. This pattern *denies* the circle. It claims linearity (Frame $\rightarrow$ Content) while relying on recursion (Content $\rightarrow$ Frame).
  *   **Distinction from Meta-Level Reasoning:** In legitimate meta-reasoning, the observer acknowledges their position (Second-Order Cybernetics). Here, the observer claims to be nowhere (The "God Trick," per Donna Haraway).

  ### 3. The Rhetorical Defense: Epistemic Exemptionalism
  When you attempt to critique the frame, you are told you are "misunderstanding its function." This is a boundary-policing move known in critical theory as **Immunization** (Peter Sloterdijk) or **Exemptionalism**.

  *   **The Move:** The system grants itself immunity from the very scrutiny it applies to its contents.
  *   **The Archive Context:** In archival theory (Jacques Derrida, *Archive Fever*; Terry Cook), this is recognized as **Archival Power**. The archivist does not just preserve power; they *exercise* it by deciding what is "personal" (disposable/secondary) and what is "professional" (public/primary). To treat the finding aid as neutral is to accept the archivist's power as natural law.
  *   **The Boundary:** Ordinary methodological assumptions are *provisional* ("We assume X for the sake of this argument"). Exemptionalism treats assumptions as *inviolable* ("To question X is to fail to do the work").

  ### 4. Proposed Terminology
  If you need a precise term for your own writing or cataloging, I recommend one of the following, depending on which facet you wish to highlight:

  1.  **Constitutive Reification:** Highlights that a constructed rule is being treated as a natural object.
  2.  **The Transcendental-Pragmatic Paradox:** Highlights the logical contradiction of validating a precondition with post-conditions.
  3.  **Methodological Exemptionalism:** Highlights the rhetorical move of shielding the method from critique.
  4.  **Infrastructural Inversion (Failed):** Bowker & Star argue we *should* invert infrastructure to study it. Your colleague's system resists this inversion.

  ### 5. Boundary Conditions: How to Distinguish It
  To ensure you are not simply labeling all foundational assumptions as problematic, apply these three tests. The phenomenon exists only if **all three** are present:

  1.  **The Invisibility Claim:** The frame asserts it is transparent/neutral, not a constructed intervention. (Distinguishes it from honest modeling).
  2.  **The Immunity Claim:** Critique of the frame is dismissed as category error or incompetence, not engaged as substantive disagreement. (Distinguishes it from robust paradigms).
  3.  **The Retroactive Validation:** The authority of the frame is derived from the coherence of the content it organizes, despite claiming to precede that content. (Distinguishes it from pure dogmatism).

  ### Summary for your Curatorial Work
  In the context of the archive, you are encountering **Archival Violence** masked as **Metadata Neutrality**. Your colleague's papers enact a **Performative Contradiction**: they perform the construction of order (by categorizing) while asserting the discovery of order (by claiming the categories are inherent).

  You are not facing a "methodological assumption." You are facing a **power structure that has forgotten it is a power structure**. The most precise philosophical description is that the system is **Operationally Closed** (it defines its own boundaries) but claims to be **Transcendentally Open** (it claims to reflect reality outside itself).

  If you must label it in a finding aid or critical introduction, **"The Naturalization of the Archival Frame"** is the most descriptively accurate and academically recognized phrasing. It signals to researchers that the organization of the papers is itself a historical artifact requiring interpretation, not merely a tool for retrieval.
