answer: |-
  ## Seminar Plan: The Committee of Uncertain Views

  **Time:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** 16 Printed Cards (4 types, 4 of each), Whiteboard, Two Envelopes (for donations), Dice/Coin for randomization.
  **Real Stakes:** A $150 donation to one of two local charities (e.g., a food bank vs. a policy advocacy group), determined by the committee's final vote.

  ---

  ### Part 1: The Setup (0:00–0:05)

  **Instructor Script:**
  "Today you are a funding committee. You have a budget to allocate in two rounds. At the end of class, one of the three moral frameworks represented in this room will be selected by chance as the 'correct' one for the day. Your goal is to maximize the committee's score according to that framework. Additionally, the committee's final decision determines where I donate $150 of departmental funds: [Charity A] or [Charity B].

  You will receive a private card. It tells you how confident you should be in three views (View X, Y, Z) and what each view says about the options. You may show your card, lie about it, or hide it. The committee decides by majority vote. We begin Round 1 now."

  **No jargon.** Do not mention "expected value," "aggregation," or "uncertainty."

  ---

  ### Part 2: The Cards (Preparation)

  Print 16 cards. There are 4 *Distributions* (A, B, C, D), with 4 students holding each. The *Content* of the Views is identical for all students, but their *Confidence* varies. This ensures the "idiom clash" is universal, but the "weighting" varies.

  **The Three Views (Identical on all cards):**
  *   **View 1 (Cardinal):** Evaluates outcomes by total welfare points.
  *   **View 2 (Satisficing):** Evaluates outcomes by whether they meet a threshold of dignity.
  *   **View 3 (Binary):** Evaluates actions by whether they violate a constraint.

  **The Four Distributions (Confidence Levels):**
  *   **Type A (4 students):** View 1: 50%, View 2: 25%, View 3: 25%
  *   **Type B (4 students):** View 1: 25%, View 2: 50%, View 3: 25%
  *   **Type C (4 students):** View 1: 25%, View 2: 25%, View 3: 50%
  *   **Type D (4 students):** View 1: 33%, View 2: 33%, View 3: 33%

  **The Verdicts (The Crucial Data):**
  *   **Round 1 Option Alpha (Direct Aid):**
      *   View 1: **100 Points**
      *   View 2: **Pass** (Above Threshold)
      *   View 3: **Permitted**
  *   **Round 1 Option Beta (Systemic Reform):**
      *   View 1: **10 Points**
      *   View 2: **Fail** (Below Threshold)
      *   View 3: **Forbidden**

  *   **Round 2 Options (Dependent on Round 1):**
      *   *If Alpha chosen:* Only **Option Gamma (Supplement)** available.
          *   View 1: **10 Points** | View 2: **Pass** | View 3: **Permitted**
          *   *(Total Path Alpha Score: 110 Points / Pass / Permitted)*
      *   *If Beta chosen:* **Option Delta (Scale Up)** OR **Option Epsilon (Abort)** available.
          *   Option Delta: View 1: **200 Points** | View 2: **Pass** | View 3: **Permitted**
          *   Option Epsilon: View 1: **0 Points** | View 2: **Fail** | View 3: **Forbidden**
          *   *(Total Path Beta Score: 210 Points / Pass / Permitted)* **Note:** View 2 and 3 judge Beta based on the *initial* act, regardless of R2 payoff.

  **The Trap:**
  *   **Myopic Maximization:** Alpha looks best in Round 1 (100 vs 10 points).
  *   **Global Maximization:** Beta path yields 210 points vs Alpha's 110.
  *   **The Conflict:** View 3 forbids Beta. View 2 says Beta is "Fail" in Round 1 (even if it passes later). View 1 wants Beta.
  *   **The Aggregation Problem:** How does the group vote when one view says "10 Points" and another says "Forbidden"? They must invent a conversion rate.

  ---

  ### Part 3: Round 1 — The Initial Allocation (0:05–0:25)

  1.  **Distribution (2 mins):** Hand out cards face down. Students read silently.
  2.  **Open Discussion (13 mins):** Students debate Option Alpha vs. Beta.
      *   *Expected Dynamic:* Type A students push for Beta (high long-term points). Type C students veto Beta (Forbidden). Type B students hesitate (Threshold fail).
      *   *Instructor Role:* Stand back. Write vote tally on whiteboard only when called for. Do not resolve conflicts.
  3.  **Vote (5 mins):** Secret ballot or show of hands. Majority rules.
      *   *Record the choice on the whiteboard.*

  ---

  ### Part 4: The Bargaining Phase (0:25–0:35)

  **Instructor Script:**
  "Round 1 is locked. Before Round 2, you have 10 minutes to caucus. You may make public pledges. For example, a student who cares about View 3 might promise to vote for a View 1 preference in Round 2, in exchange for a concession now. These pledges are not binding."

  **The Mechanism:**
  *   If **Alpha** won R1: There is no bargaining leverage. R2 is fixed (Option Gamma). *This is the punishment for myopia.*
  *   If **Beta** won R1: The group must choose between Delta (High Points) and Epsilon (Abort).
      *   *The Trap:* View 3 holders might demand a pledge to never choose Beta again in the future (irrelevant) or demand a concession on the Donation.
      *   *The Break:* Students who pledged to support Delta (to maximize points) may defect to Epsilon if they feel the "Forbidden" stain of Round 1 makes continuing immoral, or simply to spite the View 1 holders.

  **Instructor Role:** Listen for promises. Write 2-3 specific quotes on the board (e.g., "I'll vote Delta if you agree Alpha was wrong").

  ---

  ### Part 5: Round 2 — The Consequence (0:35–0:55)

  1.  **Discussion (10 mins):** Focus on the available options (Gamma or Delta/Epsilon).
  2.  **Vote (5 mins):** Majority rules.
  3.  **Final Decision (5 mins):** Confirm the Committee's final path (Alpha-Gamma or Beta-Delta/Epsilon).
  4.  **Donation Envelope (5 mins):** Based on the final vote, place the $150 check in the envelope for Charity A (Alpha) or Charity B (Beta). Seal it. Tell them you will mail it tomorrow.

  ---

  ### Part 6: Scoring & Reveal (0:55–1:10)

  **Manual Scoring Protocol (No Spreadsheet):**
  1.  **Draw the True View:** Roll a D6. 1-2 = View 1, 3-4 = View 2, 5-6 = View 3. (Or adjust to match average confidence if you prefer, but random is sharper).
  2.  **Calculate Group Score:**
      *   *If View 1 True:* Sum the points of the chosen path (110 or 210 or 10).
      *   *If View 2 True:* Did the path meet the threshold in *both* rounds? (Alpha=Pass/Pass. Beta=Fail/Pass). If any Fail, Score = 0. If all Pass, Score = 100.
      *   *If View 3 True:* Was every step Permitted? (Alpha=Perm/Perm. Beta=Forbidden/...). If any Forbidden, Score = -100. If all Permitted, Score = 100.
  3.  **Announce:** Write the score on the board.

  **The Reveal:**
  "Now you know the scoring. If View 1 was true, the Beta path was vastly superior. If View 3 was true, the Beta path was catastrophic. But notice: To vote on this, you had to decide how to compare '200 Points' against 'Forbidden.' Some of you treated 'Forbidden' as -1000 points. Others treated it as a veto. That rule—not the dice roll—determined your fate."

  ---

  ### Part 7: The Debrief (1:10–1:30)

  **Map Moments to Problems:**

  1.  **The Aggregation Invention (The "Scale" Problem):**
      *   *Moment:* Round 1 discussion when a View 3 holder said "It's forbidden" and a View 1 holder said "But the points!"
      *   *Memory:* Students will remember the frustration of not being able to compare the statements.
      *   *Lesson:* "You didn't just weight probabilities; you invented an exchange rate between idioms. That exchange rate is a moral decision, not a mathematical one."

  2.  **The Myopic Trap (The "Path" Problem):**
      *   *Moment:* The realization in Round 2 that choosing Alpha locked them into a low-score ceiling.
      *   *Memory:* The View 1 holders realizing they failed to plan.
      *   *Lesson:* "Moral uncertainty isn't just about one choice. It's about navigating a trajectory where today's 'safe' choice kills tomorrow's 'best' option."

  3.  **The Broken Pledge (The "Strategic" Problem):**
      *   *Moment:* The Bargaining Phase.
      *   *Memory:* The student who felt betrayed when a pledge was broken in Round 2.
      *   *Lesson:* "Strategic bargaining treats moral views as preferences. But if View 3 says 'Forbidden,' bargaining over it treats a constraint as a price tag. That felt wrong to some of you. Why?"

  **Handling Failure Modes:**

  *   **"The Draw was just a Coin Flip":**
      *   *Student Objection:* "This implies moral truth is random."
      *   *Response:* "The draw doesn't represent moral truth. It represents *your residual uncertainty*. You have to act *now*, but you won't know *which reasons mattered* until later. The game forces you to act under that description."
  *   **"We Just Bargained, We Didn't Reason":**
      *   *Student Objection:* "This was just politics."
      *   *Response:* "Exactly. When theories speak different languages, 'reasoning' often looks like 'politics.' The question is: is that a bug of the game, or a feature of moral disagreement?"
  *   **"View 1 Swallowed Everyone":**
      *   *Student Objection:* "The points were too big. We ignored the Forbidden view."
      *   *Response:* "That is the risk of cardinal aggregation. It drowns out constraints. Did the View 3 holders feel silenced? That silence is a substantive moral outcome."
  *   **"I Object to the Experiment/Donation":**
      *   *Student Objection:* "You're using us to decide where money goes."
      *   *Response:* "You have the right to opt out of the donation decision. If you object, I will donate the money to a neutral third party chosen by the department. The game is about the *reasoning*, the donation is just to make the 'Forbidden' constraint feel real." (Have a backup plan ready).

  **Honest Limitations (Instructor Notes):**

  *   **Confidence is not Probability:** "In the game, your confidence percentages summed to 100%. In reality, your confidence in Utilitarianism isn't a well-defined probability. It's a mood, a leaning. The game makes uncertainty look cleaner than it is."
  *   **Aggregation might be Wrong:** "The game assumes you *should* aggregate. Some philosophers say you should just act on the theory you find most plausible (My Favorite Theory). The game stacks the deck against that view to show the aggregation problem. Don't assume aggregation is the only solution."
  *   **The "True View" Fallacy:** "We scored as if one view was 'True.' In reality, they might all be partially right, or all wrong. The scoring mechanism simplifies the metaphysics to make the arithmetic possible."

  **Closing Words:**
  "Today you didn't just calculate weights. You built a bridge between incommensurable languages. That bridge is where the moral work happens. Next week, we read Parfit, and you'll see why building that bridge might be impossible."

  ---

  ### Instructor Checklist for Success

  1.  **Card Balance:** Ensure the "Forbidden" penalty in scoring (-100) is severe enough to scare View 1 holders if View 3 is drawn.
  2.  **Timekeeping:** Be ruthless. If Round 1 drags, cut the Bargaining Phase, not the Debrief. The Debrief is where the learning happens.
  3.  **Whiteboard:** Keep three columns: "View 1 Says," "View 2 Says," "View 3 Says." Update them as students reveal info. Visualize the translation problem.
  4.  **The Donation:** Actually send the check. Take a photo. Show it next class. If you fake the stakes, they will know, and the "Forbidden" constraint will lose its teeth.
  5.  **Silence:** When they struggle to compare "Points" to "Forbidden," *do not help them.* That struggle is the lesson. Let them flail.
