answer: |-
  So I walk up to the velvet rope of this club called "The Demos," and the bouncer hands me a clipboard. The first question on the application is, "Are you affected by the house music policy?"

  I say, "Sure, what's playing?"

  He says, "Whatever the current members hum."

  I look through the window—the place is empty. I say, "Okay, so if I walk in and start humming, do I get in?"

  He says, "No, because if you walk in, you change the hum, which changes the music policy, which changes the membership criteria retroactively. So by the time you're inside, you might not qualify for the music you just created."

  I say, "Can I at least vote on the entry rules?"

  He says, "Only if you're a member."

  I say, "But you're holding the rope. Are you a member?"

  He pulls out his own application form and says, "I'm applying. But since I control the boundary, I'm also the electorate. So I'm going to vote myself in, hum a tune that only I like, and mark 'No' on your form because you're outside affecting nothing."

  I say, "That's not democratic."

  He says, "Exactly. That's why we need a vote to decide how to vote. Please step away from the door, you're disrupting the quorum."
