answer: |-
  Good morning. Welcome to everyone—especially those who have spent the last week brushing sediment off sherds, and those who have spent the last week brushing logic off assumptions. It is rare to get the people who worry about taphonomy in the same room as the people who worry about underdetermination. Usually, we meet only in the footnotes of each other's papers. But for the next two days, you are each other's primary evidence.

  I want to start not with a grand theory, but with a specific silence.

  Imagine a Late Bronze Age settlement. You excavate the storage rooms. Every single storage jar carries an administrative seal. The bureaucracy is visible, durable, and loud. But you move to the domestic contexts, the niches, the shrines where figurines usually survive. There are zero ritual figurines. Not broken ones. Not eroded ones. None.

  The standard inference is straightforward: "There was no cult practice here." It's a null hypothesis based on negative evidence.

  But I want us to begin this workshop by rejecting that inference as too easy. Consider the alternative: What if the absence of figurines is not a failure of preservation, but a success of policy? What if the institution itself dictated that ritual must remain ephemeral? That belief was specifically performed on media that would not survive? In this scenario, the silence isn't noise. The silence is the signal.

  This is why I am framing our time together around a specific constraint: **Absence is not neutral data.**

  For the archaeologists in the room: You know better than anyone that preservation bias is rarely random. It is geological, yes, but it is also cultural. What gets deposited, what gets curated, and what gets deliberately destroyed are actions driven by the very institutions we are trying to study.

  For the philosophers of science: You know that data does not speak for itself. When the data is missing, the temptation to fill the gap with theory is strongest. But if the missing data is the result of a systemic rule—a rule about what counts as durable belief—then our theories need to account for the invisibility, not just the visibility.

  If we accept this, it changes what we can promise ourselves over the next two days.

  We cannot promise to solve the belief-puzzles. We cannot promise to walk out of here with a reconstructed theology of that Bronze Age settlement. If the institution successfully kept its beliefs off durable media, then those beliefs are not waiting in the ground to be found. They are structurally absent.

  Instead, I propose a different goal. We are not here to read beliefs off the remains. We are here to map the conditions under which beliefs become invisible.

  This shifts the work from reconstruction to topology. We are looking for the shape of the gap. When we see a surplus of administrative seals and a deficit of ritual objects, we aren't just seeing "economy yes, religion no." We are seeing a specific ratio of visibility. We are seeing an institution that wanted its accounting to last forever and its prayers to last only as long as the breath used to speak them.

  This requires both of your expertise. The archaeologists bring the rigor to prove the absence is real—that the figurines aren't missing because of soil acidity or excavation strategy. You establish that the silence is genuine.

  The philosophers bring the rigor to ensure we don't over-fill that silence. You help us recognize when we are treating a structural invisibility as a simple lack of evidence. You help us navigate the underdetermination that arises when the only data we have is data about what was *allowed* to survive.

  So, as we begin, I ask that we hold this tension. Do not try to force the artifacts to speak louder than they can. If a belief system was designed to leave no trace, then finding no trace is actually a successful excavation.

  We are not here to recover the past exactly as it was. We are here to understand why the past chose to hide certain things from us, and what that hiding tells us about the institutions that did the hiding.

  If we can do that—if we can treat absence as a product rather than a loss—then this workshop will have done real work. Thank you, and let's get started.
