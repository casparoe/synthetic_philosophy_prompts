answer: |-
  **The Case**

  It is Sunday night of senior capstone week, and you are the lead developer on a two-person coding project with Sam, a talented but inconsistent friend. The backend is unfinished; if it isn't robust by Monday morning, the demo crashes and you both fail, but if you email the teacher tonight reporting Sam's negligence, you secure a partial grade while destroying the friendship. Sam is in the room, watching you type. Sam knows you well enough to read your posture: if you resolve now to send the email, your shoulders square and your typing becomes rhythmic and cold; if you resolve not to, you slump in relief; but if you remain genuinely undecided—keeping the possibility of reporting as a live, unresolved tension—your breathing hitches and you glance at the "Send" button with visible anxiety. Sam will only code furiously enough to guarantee an A if they perceive a high, ambiguous risk of betrayal; if they perceive certainty (either way), they will do the bare minimum for a B. You cannot bind yourself to a randomizer or a contract; you can only choose how to deliberate.

  ***

  **The Three Views**

  **(T) The Transparency View**
  Reasoning: A rational agent ought to maximize the accuracy of its self-model. Uncertainty is a defect in cognition, a failure to compute one's own utility function. To act rationally, you must determine now whether the utility of the grade outweighs the utility of the friendship. Once calculated, you should hold that conclusion as knowledge. To pretend otherwise is to lie to yourself.
  Action: You calculate that the grade is paramount. You settle on the intention: "I will report Sam if the code fails." You possess full self-knowledge of this intention.
  Outcome: Sam sees your resolved posture. Recognizing the threat is real but the boundary is fixed, Sam codes only enough to avoid the trigger. The project earns a B. You have accurate self-knowledge, but a suboptimal grade.

  **(C) The Deliberation-Blind View**
  Reasoning: Treat your own action as a free variable in a causal graph. Holding your self-beliefs fixed, ask which act causes the best world. If you report, Sam works (usually), but you lose the friend. If you don't report, Sam slacks. The causal link suggests that forming a firm intention to report is the only lever that moves Sam's labor. You must commit to the lever to pull it.
  Action: You commit to the policy of reporting. You treat your future self as bound by this causal necessity.
  Outcome: Identical to T. Sam reads the commitment as a fixed constraint and optimizes against it, doing the minimum required to avoid the penalty. The project earns a B.

  **(E) The Procedure-Design View**
  Reasoning: Your self-model is not a mirror but a tool located in the world, physically observable by Sam via micro-expressions and tone. The question is not "What will I do?" but "Which deliberative procedure produces the best physical signal?" A procedure that forces early resolution signals rigidity, which Sam can game. A procedure that maintains genuine epistemic openness signals volatility, which Sam cannot game and must insure against with high effort.
  Action: You choose the procedure: "Do not resolve the decision until Monday morning." You actively suppress the conclusion, maintaining authentic anxiety about whether you will hit send.
  Outcome: Sam perceives the unresolved tension and cannot calculate the safety threshold. To be safe, Sam over-performs. The project earns an A. Because Sam succeeded, you do not send the email, preserving the friendship. You know less about your future action than T or C, but you win.

  ***

  **Analysis**

  **The Single Feature**
  The feature doing the work is **the observability of the deliberative state**. The case relies on the fact that *how* you decide (resolved vs. unresolved) leaks physical information that alters the other agent's behavior before the decision is executed.

  **Removing the Feature**
  If you remove this feature (e.g., you communicate only via text, or Sam cannot read your affect), the case stops being about self-knowledge and becomes a standard game of incomplete information. Without the leak, your internal uncertainty is invisible. Sam cannot react to your anxiety, only to your explicit words. Since you cannot bind yourself (no contract/coin), your words are "cheap talk." Sam will assume you won't report (because it costs you friendship) and will slack regardless of your internal state. The advantage of "knowing less" vanishes because the ignorance is no longer a signal.

  **The Strongest Reply to T**
  A defender of Transparency will argue that E's winning move is merely **self-deception under a better name**. They will claim that you *do* know what you will do (you won't report if Sam works), and that by pretending to deliberate, you are feigning uncertainty to manipulate Sam. This is dishonest, and a rational agent should not rely on dishonesty because it corrodes trust if discovered.

  *Counter-Reply:* This misses the embedded nature of the agent. E is not feigning uncertainty; E is *instantiating* it. If you tell yourself "I am uncertain," but secretly know you are lying, Sam (a good friend) will detect the incongruence in your affect. The procedure only works if the uncertainty is authentic. Therefore, E is not lying to Sam; E is designing a cognitive architecture that genuinely lacks the information T insists on having. T conflates *rationality* with *resolution*. For an embedded agent, resolution is a physical act that changes the environment. Sometimes, the rational act is to refuse to resolve. Self-knowledge is not a virtue to be maximized; it is a resource to be spent, and sometimes hoarded.
