answer: |-
  **The sequence**

  Your instinct is backwards. Do not define the "two kinds of not-knowing" before the urn. If you lecture on risk versus ambiguity first, you give them the answer key before the test. They need to feel the cognitive itch before you name the scratch.

  Start immediately with the choice. Present the urn and the first bet (Red vs. Black). Ask for a show of hands. Most will pick Red. Write this on the board. Then present the second bet (Red-or-Yellow vs. Black-or-Yellow). Ask for hands. Most will pick Black-or-Yellow. Write this down. Only now do you reveal the contradiction: mathematically, if you preferred Red initially, you must prefer Red-or-Yellow later. The room is now committed to a position that breaks math.

  *Then* you introduce the labels. Explain that in the first bet, they knew the odds (Risk). In the second, the odds were hidden (Ambiguity). The sequence must be: Experience the Choice → Reveal the Contradiction → Label the Uncertainty. If you label first, they will perform rationality for you. If you let them choose first, they will reveal their humanity. The contradiction lands only after the room has publicly committed to one of the choices out loud.

  **The urn**

  Keep the urn. Do not swap it for a bookie or a lottery. A bookie implies motive (why are they hiding this?), and a lottery implies regulation (is it rigged?). The urn is pure information structure; it isolates the variable you care about. It strips away narrative noise so the audience focuses on the knowledge gap, not the setting.

  The carrying example must have three things: a known total (90), a known subset (30 Red), and a missing subset distribution (Black/Yellow ratio) that stays missing throughout both bets. It must not have visual cues about the balls. If they can see the balls, or feel the weight, or imagine the urn shaking, they will invent physical reasons for their choice. The opacity must be purely epistemic. The urn works because it is boring; boredom forces them to rely on their intuition about information rather than speculation about mechanics.

  **The extra urn**

  Use this, but place it at the very end as a coda. If the 60 unknown balls are split by a notarized machine using a uniform distribution, the ambiguity dissolves. You now know the second-order probability: the chance of any specific split is known, which makes the marginal probability of drawing Black exactly 1/3. It converts Ambiguity back into Risk. Ada would no longer have a reason to prefer Red; the numbers equalize.

  This proves the paradox relies on *missing* second-order info, not just unknown first-order info. Do not use the adversarial picker (someone wanting her to lose). That shifts the problem from decision theory to game theory (Minimax), which muddies the water. Stick to the notarized machine. It shows the audience that Ada isn't afraid of the unknown composition; she is afraid of the missing information *about* the composition. It validates her caution as structural, not timid.

  **What they'll get wrong**

  Kill "risk aversion" immediately after the first vote. Remind them the payout is identical; only the information changed. If they were just risk-averse, they'd pick the same urn both times.

  The "average it" misconception is the critical one. Someone will say, "Just assume 30 Black, 30 Yellow." You must show why this fails. If she assumes P(Black) < 1/3 (to justify picking Red), then P(Black+Yellow) must be < 2/3. But picking Black-or-Yellow implies she thinks P(Black+Yellow) > 2/3. No single number for "Black" satisfies both choices. This isn't a guess problem; it's a consistency problem.

  For the "Dutch Book" objection (she can be money-pumped), acknowledge it but pivot. Say, "In a casino, yes. In life, she'd just refuse the second bet." This isn't a cop-out; it's a feature. Real agents avoid games where the rules feel unstable.

  When someone says, "She avoids the unknown urn whichever colour," point to the complement. In bet one, she avoids the unknown (Black). In bet two, she avoids the unknown (Red-or-Yellow). She is consistently avoiding ambiguity, but doing so requires contradictory beliefs about Yellow.

  Distinguish from Allais briefly: Allais is about how we weight known probabilities (certainty effect); this is about missing probabilities.

  Finally, the character note. Insist this isn't timidity. Timidity is refusing to bet. Ada is betting; she's just weighting information quality over information quantity. It's a structural feature of cognition, not a flaw in her courage.

  **The check**

  Do not ask them to design a version where she takes the ambiguous urn; that's too abstract for a tired room. Instead, ask: "What single piece of information could I give Ada before the first bet that would make her choose Black?"

  The answer is "The number of Black balls." If they say "Let her see a ball," ask "What if it's Red?" Force them to see that only knowing the specific distribution resolves the tension. If they get this, they understand that the paradox lives in the missing number, not the balls themselves.

  **What I refuse to explain**

  State clearly at the start: "I am not teaching economics today." Do not name the Ellsberg Paradox. Do not write formulas on the board. Do not recommend books. This is a library event, not a seminar. You are discussing a character's mind, not optimizing a portfolio.

  For the two phone-Googlers: When they interrupt with the name of the paradox, validate them instantly. "Exactly, you've found the real-world name for this." Then pivot back to the text. "But I'm not interested in the economics; I'm interested in why Ada feels this way." This shuts down the lecture-within-a-lecture without shaming them. You refuse the math to protect the story.
