      *   *Memory Suppression:* Make sure it's clear she can't form *new* episodic memories well, which loosens the grip of the "narrative self."
      *   *Ambiguous Ending:* Crucial. She shouldn't decide.

  8.  **Drafting the Content (Iterative refinement):**
