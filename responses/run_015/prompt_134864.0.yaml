      *   Avoid philosophical fluff; ground everything in ML concepts.
      *   Ensure the distinction between "predictive accuracy" (Dennett's bar) and "robustness" (User's bar) is clear.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I map "belief" clearly? *Correction:* Ensure I distinguish between "belief as compression" (base model) and "belief as world-state tracking" (agent). Let's define belief as *invariant latent representations of world state*.
      *   *Check:* Did I address the "normative" aspect? *Correction:* Connect rationality to *optimality under the loss landscape*.
      *   *Check:* Is the residue report sharp? *Correction:* Highlight that Dennett's "real patterns" become "robust features in activation space."
      *   *Check:* User's refinement evaluation. *Correction:* Be careful not to dismiss Dennett, but acknowledge that access to weights changes the epistemic situation. Dennett assumes epistemic closure of the interior; ML engineers have backdoor access.

  9.  **Final Polish:** Organize into clear sections: Translation, Residue Report, Evaluation of Refinement. (Proceed to generate output based on this structure).

  *(Self-Correction Note during final output generation)*: Make sure to explicitly mention "counterfactual interventions on weights" as requested in the prompt's vocabulary list. Ensure the distinction between the "Design Stance" (training procedure) and "Intentional Stance" (inference-time agency) is clear.

  10. **Final Output Structure:**
      *   **I. The Intentional Stance in ML Vocabulary:** Mapping Belief, Desire, Rationality, and Success.
      *   **II. Residue Report:** Survival, Distortion, Absence (Model vs. Mesa, Normativity).
      *   **III. Evaluation of Your Refinement:** Foreignness, Defensibility, Supplementation.

