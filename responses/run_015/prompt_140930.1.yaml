          *   *Translation:* Prior on rate $\lambda$ is high. Selection function $\mathcal{S}$ for "settled galaxy signatures" (Dyson spheres, probes, radio leakage) is assumed $\approx 1$ for relevant parameter space. Likelihood of null detection $P(D=0|\lambda, \mathcal{S})$ is low unless $\lambda \approx 0$.
          *   *Toy Model:* If settlement speed $v$ allows filling volume $V_{gal}$ in $t_{fill} \ll T$, then expected number of visible civilizations $N_{exp} = \lambda \times T \times V_{eff}$. $N_{exp} \gg 1$. Null result implies $\lambda \to 0$.

      *   **(2) Hard Steps / Great Filter:**
          *   *Concept:* Evolution requires $n$ improbable steps. We are here. Are we early or late in the filter?
          *   *Translation:* Hierarchical model. The "rate" $\lambda$ is not constant; it's a product of probabilities $p_1 \times p_2 \times \dots \times p_n$. The "Great Filter" is a specific $p_i \ll 1$.
          *   *Inference:* We condition on our existence ($D_{us}=1$). The question is posterior predictive: $P(\text{future survival} | D_{us}=1)$.
          *   *Toy Model:* Waiting times $\tau_i \sim \text{Exp}(\mu_i)$. Total time $\tau_{tot} = \sum \tau_i$. If $\tau_{tot} \approx T$, we are typical. If $\tau_{tot} \ll T$, filter is ahead.

      *   **(3) Early Observer:**
          *   *Concept:* We are among the first possible observers. Habitability window is just opening.
          *   *Translation:* Selection function on time $\mathcal{S}(t)$. The rate $\lambda(t)$ is a strong function of cosmic time (metallicity, star formation rate). We are sampling from the leading edge of the distribution.
          *   *Toy Model:* Habitable window $T$. Rate of observer emergence $\lambda(t)$ peaks near $t=T$ or is rising. We observe at $t_{now} \ll T_{end}$.
