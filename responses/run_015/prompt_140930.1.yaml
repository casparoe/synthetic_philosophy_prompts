          *   *Static Population:* (1) assumes steady state or saturation. (3) assumes time-evolution.
          *   *Rate vs. History:* Astronomy measures ensemble rates. Fermi is often about a single realization (one Galaxy). This is the "Cosmic Variance" problem.
          *   *Survey Design:* SETI is often "opportunistic" rather than "designed survey," affecting $\mathcal{S}$ characterization.

  5.  **Final Verdict:**
      *   Is it a framework defect? Partly. Astronomy deals with ensembles. Fermi deals with $N=1$ (us) and potential $N \gg 1$ (them).
      *   Is it argument indeterminacy? Yes, specifically regarding the selection function (signal morphology) and the prior (anthropic weighting).
