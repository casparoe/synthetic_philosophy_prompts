          *   (4) claims $\mathcal{S} \ll 1$ (low completeness). Therefore null $\implies$ unconstrained $\lambda$.
          *   *Resolution:* They are not rivals in the posterior; they are rivals in the *likelihood construction* (specifically the modeling of $\mathcal{S}$). (1) asserts a specific signal morphology that makes $\mathcal{S}$ high. (4) asserts signal morphology is unknown, making $\mathcal{S}$ low.
      *   **Point 2: Self-Location (Observer inside sample).**
          *   Standard astronomy: Observer $\notin$ Sample.
          *   Fermi: Observer $\in$ Sample (potentially).
