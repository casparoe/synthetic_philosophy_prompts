      *   **(4) Barely Looked:**
          *   *Concept:* Search space is huge, we've looked in a tiny corner.
          *   *Translation:* Effective volume $V_{eff}$ is tiny compared to parameter space volume $V_{param}$. Selection function $\mathcal{S}(\theta) \approx 0$ almost everywhere.
          *   *Inference:* Upper limit on $\lambda \times \langle \mathcal{S} \rangle$ is weak because $\langle \mathcal{S} \rangle$ is poorly constrained or very small.
