      *Model Answer Draft:*
      The Asymmetric Inheritance Thesis posits that while political responsibility transfers across generations via institutional continuity, moral and criminal guilt do not because they require first-personal agency. Evaluating this against Jaspers reveals tension, particularly regarding metaphysical guilt. Jaspers argues that metaphysical guilt arises from a shared human solidarity; if one survives where another perishes due to injustice, one bears a guilt that is not legal but existential. AIT claims guilt is non-transferable, but Jaspers suggests metaphysical guilt binds the living to the dead through co-humanity, implying a form of inheritance that AIT might overlook. However, AIT holds firm regarding criminal and moral guilt, which require specific intent and action by the individual.

      To understand what a nation acknowledges, we must distinguish guilt as emotion, status, and verdict. Guilt as emotion is a psychological state felt by the perpetrator. Guilt as verdict is a judicial or moral judgment rendered against an agent. Guilt as status is a condition of liability or taint attached to a role. AIT correctly denies the inheritance of guilt as emotion or verdict, as descendants did not commit the acts. However, a nation can inherit guilt as status if that status is defined politically rather than morally. When a state acknowledges guilt, it is not confessing to a crime it committed, but accepting the status of being the successor entity liable for repair.

      This raises the question of collective agency. Can a nation be an agent capable of guilt? If a nation is merely a sum of individuals, then collective guilt is impossible across generations. However, if the nation is a corporate agent with institutional memory and decision-making structures that persist over time, it can bear responsibility. AIT leverages this by assigning responsibility to the institutional role rather than the biological person. Therefore, collective guilt across generations is only possible if redefined as collective responsibility attached to the corporate agent, not the biological lineage.

      Does the death of perpetrators change the metaphysics of guilt? Practically, it ends the possibility of blame, punishment, or repentance by the original agents. Metaphysically, however, the wrong remains. AIT suggests the death of perpetrators shifts the locus of obligation from the individual to the successor institution. It does not erase the guilt of the perpetrators, but it transforms the living nation's duty from punishing the dead to repairing the harm.

      If AIT is true, what does acknowledging guilt mean? It cannot mean admitting to being the criminal agent. Instead, it must mean accepting the burden of responsibility that comes with inheriting the benefits and structures of the predecessor regime. It is a speech act that converts historical responsibility into present obligation. To say we are guilty is shorthand for saying we accept the status of liable successors. Thus, AIT is largely coherent if guilt in the political sphere is understood as status-based liability rather than moral condemnation of the current citizenry. The distinction protects the innocent from moral stain while ensuring the state does not evade its duties.

