answer: |-
  This phenomenon is a specific intersection of metaphysics, social ontology, and normative ethics. It is not merely a psychological quirk of gamers; it is a rigorous, intuitive application of **social ontology** to a digital environment.

  Here is the breakdown of what is happening, structured by the questions you raised.

  ### 1. The "Unreal" Claim: Ontological Deflation vs. Institutional Reality
  The players' insistence that the objects are "not real" is **ontological deflationism**. It is a claim about the relationship between your world and the physical world (the "base reality"). They are saying: *These objects do not exist as atoms; they do not persist outside the server; they have no moral weight in the physical world.*

  However, their behavior demonstrates **institutional realism**. Within the boundaries of the practice (the server), the objects are treated as having objective status. This is not a contradiction. It is a **modal shift**.
  *   **External Mode:** "This is just code; nothing is lost if it vanishes." (True, regarding physical substance).
  *   **Internal Mode:** "This item has a status that can be violated." (True, regarding social facts).

  The "unreal" claim is **incidental** to the phenomenon you are observing. It is a boundary marker used to protect the game from external moral scrutiny (e.g., "Why are you upset? It's just pixels"). It is not essential to the mechanism of value judgment. If you told them the server was running on a quantum computer that physically manifested items, their judgment about the *admin-spawned sword* would not change. They would still reject it. Therefore, the phenomenon is not about physical reality.

  ### 2. Identity, Value, or Norms?
  You asked whether this is a claim about identity, value, norms, or reasons. It is all three, but in a specific hierarchy:

  1.  **Norms of a Practice (The Foundation):** The core of the phenomenon is **constitutive**. Your game is not just a collection of objects; it is an institution with rules about how objects come into existence. In a healthy economy, items are created through *labor* (mining, crafting), *event participation*, or *trade*. An admin command bypasses these constitutive rules. It is not "creation"; it is "counterfeiting" in the literal sense of violating the minting authority.
  2.  **Identity (The Mechanism):** Because the norms are constitutive, they determine **individuation**. In your world, an object is not individuated by its visual properties (qualitative identity) or even strictly by its database ID (numerical identity), but by its **genealogy**. Two swords with identical stats and IDs are different *individuals* within the practice because they have different causal histories. This is a form of **Historical Essentialism**: the origin of the object is essential to what the object *is*.
  3.  **Value (The Result):** The value is derived from the identity. Because the "Event Sword" is individuated by its origin in a past event, it carries the status of a *relic*. The "Admin Sword" is individuated by a command, making it a *glitch* or *cheat*. The value is not in the utility (both cut the same), but in the **status function** the object performs.

  Therefore, the phenomenon is primarily a claim about the **Norms of a Practice**, which fixes **Identity**, which dictates **Value**. The reasons players take themselves to have are reasons of **Legitimacy**.

  ### 3. Resolving the Third Case (Lore Items)
  Case Three seems to contradict Historical Essentialism because the history is "invented." However, it actually confirms the **Normative** diagnosis.

  *   **The Lore Item:** The history is invented, *but it is Canonical*. It was introduced via the constitutive rules of the game (developer release, purchase, or drop). The "fictional" history is part of the sanctioned metadata of the object. It is an **Authorized Fiction**.
  *   **The Admin Spawn:** The history is also invented (the admin claims "here is a sword"), *but it is Heretical*. It violates the rules of acquisition. It is an **Unauthorized Fiction**.

  Players do not care about "Truth" in the physical sense; they care about **Authority**. They accept a fake history if it is sanctioned by the "sovereign" of the world (the developers/the system rules). They reject a "real" duplication if it bypasses the sovereign rules. This proves the phenomenon is not about sensitivity to *actual* causal origin in the physical world, but sensitivity to **Procedural Legitimacy**.

  ### 4. Contrasts: Coins, Art, and Money
  *   **Coins (Fungibility):** You noted players don't care about the history of coins. This is because the *constitutive rules* of money in your world define coins as fungible. Their status function is "quantity of value," not "individual artifact." The norm dictates that history is irrelevant. For artifacts, the norm dictates history is essential. The players are correctly identifying the **type of institutional object** they are dealing with.
  *   **First Editions (Physical Art):** A first edition differs physically (paper age, ink). Your players are doing something harder: they are maintaining **Digital Provenance** without physical traces. They rely on social memory and server logs (metadata) rather than material decay. This makes their essentialism *purer* than art collectors; art collectors can be fooled by physical forgeries. Your players cannot be fooled by visual forgeries, only by informational ones.
  *   **Money/Property (Social Construction):** This is the closest parallel. Money is real only given a shared practice. Your items are **Institutional Facts** (to use Searle's term). They exist only because everyone agrees they exist and agrees on the rules of their creation. The admin spawn is an attempt to create an institutional fact without following the procedure, which the community rejects.

  ### 5. What to Call It
  There is no single established term that captures the digital, normative, and essentialist nature of this specific cluster. "Aura" (Benjamin) is too physical. "Fetishism" (Marx) implies false consciousness, whereas your players are清醒 (clear-headed) about the unreality. "Historical Essentialism" is too broad.

  I propose you call this: **Institutional Genealogy**.

  **Definition:**
  **Institutional Genealogy** is a mode of valuation and individuation within a constructed practice where the identity and status of an object are determined not by its observable properties, but by the legitimacy of the causal process that brought it into the institutional state space.

  **Cases it covers:**
  *   Your Event Item vs. Admin Spawn (Legitimate event process vs. Illegitimate command process).
  *   Your Cathedral Rollback vs. Copy (Preservation of the causal chain of labor vs. Insertion of a static object).
  *   Lore Items vs. Admin Spawn (Canonical narrative origin vs. Non-canonical origin).

  **Cases to keep apart from:**
  *   **Physical Provenance:** Where the history is tracked by material decay or physical evidence (e.g., carbon dating a painting). Institutional Genealogy relies on social consensus and metadata.
  *   **Sentimental Attachment:** Where an object is valued because of personal memory attached to it (e.g., "my grandfather gave me this"). Institutional Genealogy is impersonal; the players value the Event Sword even if they didn't earn it themselves, because it bears the *stamp of the era*.
  *   **Fungible Exchange:** Where the constitutive rules explicitly strip history from the object (e.g., currency).

  ### Summary
  The phenomenon is **Institutional Genealogy**.
  It is a claim about the **Norms of a Practice**.
  The "unreal" claim is **Ontological Deflationism** and is incidental.
  The players are not confused; they are rigorously enforcing the **Constitutive Rules** of your world. They recognize that in a digital environment where *copying* is effortless, *history* is the only scarce resource left. They are protecting the scarcity of the past.
