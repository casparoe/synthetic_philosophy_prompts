      *   **Core Question:** What would a "gap-closing story" for the psychophysical link look like? Is the difference that phenomenal concepts are "epistemically rigid"? If no story is available, is that a separate argument for dualism or just the explanatory gap in modal dress?
      *   **Preference:** "Gut-level intuition rather than a careful survey." They want to know where the analogy breaks and what the physicalist's strongest move is *at that point*.

  2.  **Deconstruct the Philosophical Landscape:**
