      *   **Kripkean Objection:** Identity statements are necessary if true. "Pain = C-fiber firing" is like "Heat = Molecular Motion." We can conceive of heat without molecular motion, but that's just conceiving of the *sensation* without the *phenomenon*. Once we fix reference, the identity is necessary. So, conceivability $\neq$ possibility.
      *   **2D Response (Chalmers):** Distinguishes Primary Intension (reference fixing across worlds considered as actual) and Secondary Intension (reference across counterfactual worlds given actual reference).
          *   Water/H2O: Primary intensions differ (watery stuff vs. H2O), Secondary intensions match (in our world, water *is* H2O). The conceivability of Water $\neq$ H2O tracks the primary intension divergence.
