      *   **The User's Specific Worry:** The "Gap-Closable" condition. For Water, we have a story: reference fixed by description ("watery stuff"), nature discovered empirically. For Consciousness, there is no description fixing reference to a physical state; the phenomenal concept picks out the property directly. So, why can't we just say "it's an a posteriori necessity like Water"? What's missing?

  3.  **Identify the Crux: The "Gap-Closing Story":**
