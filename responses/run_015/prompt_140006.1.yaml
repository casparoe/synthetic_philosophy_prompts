  **INTERNAL GUIDANCE MEMORANDUM 44-B**
  **TO:** All Compliance Staff, Regional Assessors, and Data Entry Clerks
  **FROM:** Office of Operational Assertibility
  **SUBJECT:** Implementation of Community-Endorsement Protocols
  **DATE:** October 14

  **1.0 TERMINOLOGY AND DEFINITIONS**

  Effective immediately, staff are reminded that the terms "correct" and "incorrect" are retired from official use. These terms imply the existence of truth-conditions or metaphysical facts regarding what a rule *requires*, which the University is satisfied does not obtain. No fact about an employee's past training or mental state can settle how a regulation applies to a novel case. Consequently, all performance evaluations will henceforth utilize the vocabulary of "endorsability." An action is not right; it is merely consistent with what the relevant community is prepared to accept. Staff should note that being "wrong" is no longer a possible status, though being "non-endorsable" remains a sanctionable offense.

  **2.0 WORKED CASE: SUMMATION DISCREPANCIES**

  Consider a clerk who has historically processed sums involving numbers less than 50. When asked to compute 68 + 57, the clerk returns the value 5. Under previous doctrines, this would be an error. Under current doctrine, there is no fact about what the clerk *meant* by "plus" in the past that determines whether 125 or 5 is the appropriate output now. It is equally consistent with all past behavior that the clerk meant "quus" (where x quus y = x + y for small numbers, but 5 for large numbers).

  If the clerk protests that they *would* have said 125 had they been asked, this is to be recorded as the "Dispositional Excuse." Staff are reminded that a disposition cannot establish normativity. Finite past behavior does not settle infinite future application. Therefore, the clerk cannot be told they made a mistake. However, as the wider community of assessors is not prepared to endorse "5" as a valid output for tax purposes, the output is non-endorsable. The clerk is to be retrained not on what the sum *is*, but on what colleagues will allow going forward.

  **3.0 ISOLATED PERSONNEL**

  Special provisions apply to staff working without immediate community oversight (e.g., night-shift archivists, remote inspectors, lighthouse keepers). Since meaning is constituted by community agreement, isolated outputs lack assertibility conditions until reviewed. Solo staff are instructed to log all decisions as "Provisionally Endorsable." These logs must be stored for future community validation. If a lone inspector declares a site "Safe," this declaration holds no normative weight until a committee convenes to endorse the declaration. Staff should not be alarmed by the temporary absence of meaning during solo shifts; this is a standard feature of the framework.

  **4.0 HIERARCHICAL ENDORSEMENT**

  A question has arisen regarding who endorses the endorsers. If correctness is determined by community agreement, agreement among whom? To resolve this, endorsement authority is capped at the Senior Vice-President level. The SVPs endorse the Regional Managers, who endorse the Clerks. The SVPs' own outputs are deemed automatically endorsable due to the conclusion of the current fiscal cycle. While this does not theoretically settle the chain of justification, the Office is satisfied that funding for further oversight committees expires on December 31st. Staff are reminded that practical necessity supersedes theoretical completeness.

  **5.0 SUPERVISORY COMMUNICATION**

  Supervisors may not tell staff what a regulation *requires* of them. To do so would imply a fact of the matter regarding the regulation's content. Instead, supervisors must phrase instructions predictively. Do not say, "You must file Form 10." Say, "If you file Form 10, your colleagues will accept your workflow." Normativity is replaced by social pressure. Staff are reminded that this is not a limitation of authority, but a clarification of ontological status.

  ***

  > "But the sum *is* 125. There is a plain fact of the matter about what the rule requires, regardless of what the committee says."
  > — *J. Kripke, Internal Dissent Memo, 2023*¹

  ***

  ¹ *The Office notes that this comment reflects a lingering confusion about truth-conditional semantics. Staff exhibiting this confusion are encouraged to attend the workshop on "Letting Go of Facts."*
