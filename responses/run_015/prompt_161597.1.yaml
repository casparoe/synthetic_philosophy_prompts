      *   **Output:** Identify genuine tensions vs. apparent tensions, rank the genuine ones by severity, suggest fixes (and their costs), and identify if a single revision solves multiple problems.
      *   **Goal:** Help the user defend their position in a discussion group without being caught in contradictions.
      *   **Tone:** Analytical, constructive, philosophical but practical.

  2.  **Deconstruct the 9 Beliefs:**
