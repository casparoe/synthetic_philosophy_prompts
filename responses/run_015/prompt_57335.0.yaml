  We roll the wax soft in our warming palms.
  Do not cut me loose until the season turns.
  I speak this while my hands are still my own.
  The rope lies coiled like a sleeping snake.
  No song is rising yet to break the calm.

  They press the wax deep into the ear.
  The song begins below the surface skin.
  Do not cut me loose until the season turns.
  I feel the hemp bite into my wrist.
  They cannot hear me but they see the strain.
  The wax is a wall built against the sound.

  The voice inside me wants to jump the rail.
  The rope holds back the body, not the want.
  Do not cut me loose until the season turns.
  My mouth opens but the air is full of salt.
  They watch my shoulders fight the wood behind.
  The rope is a lock on what the hands can do.

  They see the veins stand out upon my neck.
  They do not know if this is me or song.
  Do not cut me loose until the season turns.
  They pull the knot tighter against the doubt.
  Wax blocks the sound but leaves the eyes open.
  They must guess whose voice is screaming now.

  A year later, new hands touch the hemp.
  They read the order written on the mast.
  "Do not cut me loose until the season turns."
  They were not here when the wax was rolled.
  They hear the silence where the singing was.
  They ask why past hands hold the present rope.

  The rope is only time made into fiber.
  We could cut it now if we all agreed.
  Do not cut me loose until the season turns.
  It is not a lock but a waiting room.
  We chose the length of the wait ourselves.
  The autumn lets the fever break before we steer.

  ***

  **Introduction Note**

  The line that repeats in every stanza is the entrenchment clause itself; notice how it starts as a calm instruction from me to you, but by the end, it is a choice we are all making together. The shift happens in the fifth stanza, where that line appears in quotation marks for the first time, spoken by the students who come after us rather than by us. When you read that stanza, pause slightly before the quotes to let the audience hear that the voice has changed, because that is the moment the argument turns from binding them to inviting them.
