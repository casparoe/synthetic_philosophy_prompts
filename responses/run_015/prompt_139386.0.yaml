  The ashtray is full. The coffee is cold. It's 4:17 AM.

  **Teo:** You're stuck on the recording.

  **Mara:** I'm stuck on the sale. They want six months of our best lashers walking the yard while engineers record every wrist flick, every load check. They aren't just buying our labor for six months. They're buying the skill itself. They're bottling it. Once that data is trained, the lasher isn't a worker anymore; he's a glitch in the system.

  **Teo:** And in exchange, the man keeps his wage for thirty-two hours instead of forty-eight. Mara, look at the offer. Full pay. No compulsory redundancies. This is the struggle over the working day, plain and simple. Marx didn't tell the workers to smash the steam engine because it displaced hand-weavers. He told them to fight for the legal limit on hours. This is a legal limit. We're cutting the working week by twenty percent. That's time for living, for organizing, for sleeping. That's material.

  **Mara:** It's material until the machine decides the pace. You're treating the crane like a shovel. It's not. The shovel waits for the hand. This system? The system tells the hand where to move. By feeding them our movements, we're teaching the algorithm how to dominate us faster. We're building our own overseer. And look at the gainshare.

  **Teo:** The gainshare funds the transition.

  **Mara:** The gainshare indexes the union's income to the rate of displacement. Read it again. "Productivity gains." In this context, productivity means fewer men moving the same boxes. If the automation works perfectly, the union treasury swells while the membership shrinks. You're asking us to become shareholders in our own obsolescence. What happens to the solidarity of a union whose leadership gets richer every time a member becomes redundant?

  **Teo:** That's a risk of management, not principle. We control the fund. Jointly run.

  **Mara:** Jointly run with who? The operators? Once the knowledge transfer is done, the operators are gone. The fund becomes a severance package administered by a union that has no reason to stop the bleeding. You're arguing for the *Grundrisse* vision—automation creating the potential for leisure—but you're ignoring the *Capital* reality. Under capital, machinery isn't used to lighten the toil; it's used to cheapen the labor. Even if the wage stays the same, the power shifts entirely to the code.

  **Teo:** So we refuse. We strike. We keep the forty-eight hours and the crew in the cab. And in five years? The company bypasses us. They build a greenfield terminal fifty miles down the coast, fully automated, non-union. We keep our dignity and lose the port. Is that the victory? Holding the fort until the fort is irrelevant?

  **Mara:** Better to fight on ground where we understand the enemy than to invite him into our nervous system. If we accept this, we legitimize the idea that skill is data property. That's the enclosure of the mind.

  **Teo:** It's not enclosure if we hold the key. The 32-hour week is the key. You think leisure is neutral? Free time is the space where class consciousness grows. A exhausted docker is a compliant docker. A rested docker is a dangerous one. I'd rather have a smaller union of rested revolutionaries than a big union of broken backs.

  **Mara:** Unless the smaller union is financially incentivized to disappear. Teo, listen to me. If the union's budget depends on displacement, the union becomes a placement agency for robots. We can't vote for a contract that turns our collective interest against our individual jobs.

  **Teo:** Then what's the alternative? "No" means the offer vanishes. The company invokes the efficiency clause. They automate anyway, but without the transition fund. Without the pay guarantee. You're choosing principled poverty over compromised security.

  **Mara:** I'm choosing a fight we can win over a surrender we can't see. If we say no, we force them to keep men in the cabs. That's leverage. Physical presence. You can't automate a strike if the machines need us to start them. Once we drop the crew clause, we lose the ability to stop the flow.

  **Teo:** The flow stops when the power cuts. Not when the man leaves the cab.

  **Mara:** The man in the cab is the fuse.

  *Silence. The clock ticks toward 5:00 AM. Teo opens the laptop to draft the recommendation.*

  **Teo:** I can't write that we recommend acceptance. Not if you believe the fund is a trap.

  **Mara:** And I can't write that we recommend rejection. Not if you believe the time is a conquest.

  **Teo:** Then we don't give them a single line. We give them the split.

  **Mara:** The assembly needs a direction.

  **Teo:** The assembly needs the truth. The truth is this offer buys time with sovereignty.

  *Teo types. Mara watches the screen.*

  **Teo:** "The Negotiating Committee presents this offer without a unified recommendation."

  **Mara:** Add why. "Acceptance secures immediate material gains: a 32-hour week at full pay and a transition fund. However, it requires the surrender of operational control and indexes union revenue to labor displacement."

  **Teo:** "Rejection maintains current staffing levels and operational veto power but risks unilateral automation without compensation."

  **Mara:** Put the gainshare in bold. The members need to see that part. If they vote yes, they need to know they're voting to monetize their own replacement.

  **Teo:** And if they vote no, they need to know they're voting to keep the heavy lifting.

  **Mara:** Type it.

  **Teo:** Done.

  **Mara:** One more thing.

  **Teo:** What?

  **Mara:** Underneath. Write: "The machine does not forgive. Choose who holds the key."

  **Teo:** Too poetic.

  **Mara:** It's accurate.

  **Teo:** *Types.* There. It's 5:45. Print it.

  **Mara:** They're going to hate us either way.

  **Teo:** Good. Means we did the work.
