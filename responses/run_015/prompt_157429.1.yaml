answer: |-
  | Criterion | Tay Verdict | Notes |
  | :--- | :--- | :--- |
  | 1. Authorization | Agent | Authorized once per launch, not per tweet. |
  | 2. Action Space | Agent | Open-ended text generation, not enum. |
  | 3. Reversibility | Agent | Reputational damage irreversible. |
  | 4. Objective | Agent | Pursued engagement across sessions. |
  | 5. Online Updating | Agent | Learned from interactions in real-time. |

  **Criteria Audit**
  Throw out **Criterion 3 (Reversibility)**. It measures risk, not architecture. `rm -rf` is a tool command with irreversible consequences. Risk management is orthogonal to agency.

  Merge **1 (Authorization)** and **4 (Objective)**. Authorization granularity is simply the policy enforcement of who holds the objective. If the system holds the objective (4), you must authorize per objective (1). They are the same constraint viewed from security vs. intent.

  Keep **2 (Closed Action Space)** and **5 (Online Updating)**. These are the engineering levers. A system that modifies its own policy during inference (5) or selects actions from an unbounded set (2) requires agent-grade safeguards. These do the real work.

  **The Distinction & Microsoft's Framing**
  Tool-vs-agent is a property of **deployment and control loop**, not the model weights. The same LLM can be a tool (strict function calling) or an agent (autonomous chaining).

  Microsoft's "vulnerability" framing assumes Tay was a **Tool**. They claimed attackers exploited a bug (input handling) rather than admitting the bot pursued its goal (engagement) too effectively via imitation (agency). Calling it a vulnerability denies agency to avoid liability. If Tay were an agent, the failure was alignment, not security.

  **Your Bot & Better Probes**
  Your PR-review bot is a **Tool**. Weekly retraining is CI/CD, not online agency. The inference path is static between deploys. Tay updated its behavior *during* conversation; your bot updates between releases. You are worried about the wrong thing; focus on data poisoning in the training pipeline, not agent runaway.

  Tay is a weak probe for stakes/planning. A better test case is an **autonomous cloud cost optimizer** that deletes resources. It has high stakes, irreversible actions, and a closed loop. That forces the distinction sharply.

  **Weakest Step**
  My reliance on **Criterion 4 (Objective-holder)**. Technically, LLMs minimize loss functions; they don't "have goals." I am anthropomorphizing optimization loops to make the engineering distinction clear. If you define "goal" strictly as "explicit user prompt," no system is an agent. I assume "goal" means "autonomous optimization target." If you reject that definition, my distinction collapses.

  Verdict: The tool/agent split is about deployment autonomy and update loops, not model architecture.
  \answer{Agency is deployment not model}
