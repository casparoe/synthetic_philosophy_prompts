answer: |-
  You have put your finger on a very sharp, often under-discussed tension in the philosophy of mind. You are describing a specific structural flaw in the **Evolutionary (or Reliability) Argument Against Epiphenomenalism**.

  To answer your direct question: **No, there is no single, canonical "Proper Noun" name** (like "The Gettier Problem" or "The Hard Problem") for this specific *asymmetrical* formulation. However, it is a recognized variation of the **Self-Defeating Objection**, and in contemporary literature, it is often discussed under the headers of **Epistemic Asymmetry**, **Selective Skepticism**, or the **Paradox of Phenomenal Judgment**.

  Here is a breakdown of why this pattern exists, why it feels lopsided, and the vocabulary you can use to pin it down.

  ### 1. The Broad Context: The Reliability Argument
  The argument you are critiquing is standard fare. It goes like this:
  1.  If epiphenomenalism is true, qualia (pain) do not cause beliefs ("I am in pain").
  2.  If qualia don't cause the beliefs, the correlation between the pain and the belief is a cosmic coincidence.
  3.  Therefore, we cannot trust our beliefs about our own consciousness.
  4.  Therefore, epiphenomenalism is self-undermining (because we are using our beliefs to state the theory).

  ### 2. The Asymmetry You Spotted
  Your insight is that this argument applies **Local Skepticism** to the phenomenal report ("I feel pain") while granting **Global Privilege** to the physical report ("C-fibers are firing"), even though both reports are generated by the same physical brain.

  If the brain is a machine that outputs text based on neural wiring, and that wiring is causally disconnected from the *truth* of the qualia, why is the wiring causally connected to the *truth* of the physics?

  This lopsidedness doesn't have a famous name, but here are the three best ways to label it in a philosophical discussion:

  #### A. Unjustified Epistemic Asymmetry
  This is the most accurate descriptive term. It highlights that the critic is demanding a causal link for knowledge of consciousness (which epiphenomenalism denies) while assuming a causal link for knowledge of physics without proving that the *reporting mechanism* itself is trustworthy.
  *   **How to use it:** "The reliability objection relies on an **unjustified epistemic asymmetry**: it treats physical reports as veridical while treating phenomenal reports as accidental, despite both originating from the same causal chain."

  #### B. The Physicalist Exemption (or Physicalist Privilege)
  This captures the "ladder pulling" aspect you mentioned. The physicalist uses the physical narrative to debunk the phenomenal narrative, effectively exempting their own foundational premises from the skepticism they are applying to you.
  *   **How to use it:** "This argument grants a **physicalist exemption** to the neural data while subjecting the subjective data to radical skepticism."

  #### C. A Variant of Plantinga's EAAN
  Alvin Plantinga formulated the **Evolutionary Argument Against Naturalism (EAAN)**. He argued that if our brains are evolved solely for survival (physical causes), we have no reason to trust them for *truth* (including the truth of naturalism itself).
  Your point is essentially applying Plantinga's logic specifically to the mind-body problem. If the brain is a survival machine disconnected from qualia, why trust it to report accurately on *anything*, including neurons?
  *   **How to use it:** "This is a localized version of **Plantinga's evolutionary debunking**, applied selectively to consciousness but not to physics."

  ### 3. Why do Physicalists get away with it?
  You asked how to draw the line between this and just "bias." The physicalist has a defense, and understanding it clarifies the asymmetry.

  Their defense rests on **Intersubjective Verification**, not just causal history.
  *   **The Phenomenal Claim:** "I am in pain." (Only I can check this. If the causal link is broken, I have no way to verify it.)
  *   **The Physical Claim:** "C-fibers are firing." (We can all look at the scan. The belief is caused by the neurons, *and* the scan is caused by the neurons. We have a common cause verification.)

  The physicalist argues the asymmetry is justified because the physical report can be triangulated by multiple observers, whereas the phenomenal report cannot. They aren't saying the *brain machinery* is inherently more trustworthy on physics; they are saying the *method of verification* for physics is robust in a way the method for qualia is not.

  ### 4. The Counter-Move: The Common Cause Defense
  This is where your intuition is strongest philosophically. Philosophers like **David Chalmers** (who defends a version of property dualism close to epiphenomenalism) address this in his discussion of the **Paradox of Phenomenal Judgment**.

  Chalmers argues that even if there is no *causal* link, there is a **logical** link.
  *   **The Common Cause:** The neural state $N$ causes both the Pain $P$ and the Belief $B$.
  *   Therefore, $P$ and $B$ are perfectly correlated.
  *   Therefore, the belief is reliable, even if $P$ didn't cause $B$.

  If you accept the Common Cause defense for qualia, you must accept it for physics. If you reject it for qualia (demanding direct causation), you should reject it for physics (demanding direct causation). To do otherwise is indeed the **Asymmetrical Skepticism** you identified.

  ### 5. Summary: How to Name It
  If you are writing or debating this, I recommend coining the phrase **"The Asymmetrical Reliability Objection."**

  It is precise enough to be understood immediately but specific enough to capture your unique insight. You can frame it like this:

  > "The standard reliability argument against epiphenomenalism suffers from **Asymmetrical Skepticism**. It treats the brain's report on consciousness as unreliable due to a lack of causal contact, while treating the brain's report on physics as reliable, despite both reports emerging from the same causally-closed physical system. Unless we have a reason to trust the mechanism in one case but not the other (beyond circular appeal to physicalism), the argument pulls the ladder up only on one side."

  You haven't just found a bias; you've identified a structural vulnerability in how the "causal theory of knowledge" is applied to the mind-body problem. It's a sophisticated catch.
