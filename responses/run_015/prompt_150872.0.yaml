answer: |-
  ### Confidence Assessment

  I am **95% confident** that there is no single, universally standardized noun phrase in historical methodology that captures *exactly* the mechanism you describe.

  The phenomenon you have identified is widely recognized and discussed, but it is typically treated as a composite problem rather than a named effect. You will find it discussed under the headings of **Archival Power**, **The Politics of the Archive**, or **Source Bias**, but these are categories, not specific mechanisms.

  The closest established concepts come from three different fields, none of which quite fit your specific "density = entanglement" formulation on their own:
  1.  **Political Science/Anthropology:** James C. Scott's concept of **Legibility** (*Seeing Like a State*). This describes the *state's action* (simplifying people to govern them), but not the *historian's subsequent trap* (mistaking that simplification for reality).
  2.  **Critical History:** Michel-Rolph Trouillot's **Silencing the Past** (specifically "Moment 1: The Making of Sources"). This describes how power creates the archive, but the term "silence" intuitively suggests *absence*, whereas your problem is often an *over-abundance* of misleading data.
  3.  **Epidemiology/Social Science:** **Surveillance Bias** (or Detection Bias). This is precisely your workhouse example: populations under closer monitoring generate more data points, making them appear to have higher incidence of "events" (illness, crime, relief) than unmonitored populations. However, this term is rarely used in historical humanities.

  Because no single term bridges the gap between Scott's *legibility*, Trouillot's *silence*, and the epidemiological *surveillance bias* within a historiographical context, I will propose a working definition below.

  ### Proposed Name: **Archival Legibility Bias**

  I recommend this term because it anchors the phenomenon in the established literature of statecraft (Scott) while specifying the locus of the distortion (the Archive).

  #### Definition
  **Archival Legibility Bias** is the systematic distortion of historical representation wherein the density of surviving records correlates with a population's degree of **institutional transaction** (either as objects of control or holders of recognized standing), rather than with their demographic weight, agency, or historical significance.

  It operates on the mechanism that **institutions generate paper through interaction**, and **interaction is non-uniformly distributed**. Consequently, the archive does not reflect the population; it reflects the *points of contact* between the population and the institution.

  #### Why this definition is better than alternatives

  | Alternative | Why it fails your case | Why "Archival Legibility Bias" works |
  | :--- | :--- | :--- |
  | **"Archival Silence"** (Trouillot) | Implies *absence* or loss. Your problem is often *presence* (thousands of workhouse pages) that drowns out the truth. | Captures that the "noise" of the record is the actual distortion. The "silence" is the autonomous life *between* the transactions. |
  | **"Source Bias"** | Too generic. Implies the source is prejudiced (e.g., a racist comment). Your sources may be factually accurate (admission dates) but structurally misleading. | Specifies the *structural* cause: the bias comes from the *requirement to be legible* to generate a record, not the author's opinion. |
  | **"Survivorship Bias"** | Implies records were lost randomly or due to decay. Your records survived *because* they were institutional; the commoners' lack of records is not loss, it's non-creation. | Distinguishes between records that *didn't survive* and lives that *weren't recorded*. |
  | **"Reading Against the Grain"** | This is a *method* of correction, not a name for the *problem*. | Names the problem so the method can be applied correctly. |

  ### The Mechanism: What has to be true for it to operate?

  For Archival Legibility Bias to function, three conditions must be met:

  1.  **Transaction-Dependent Creation:** Records are generated only when an individual triggers an institutional protocol (admission, tax, trial, deed, baptism).
  2.  **Asymmetric Incentive:** The cost of transaction is low or zero for the institution (it is their job to record), but high or compulsory for the subject (they must submit to be counted, or seek recognition to protect rights).
  3.  **Historiographical Conflation:** The historian (or the narrative) treats **Documentary Frequency** as a proxy for **Historical Weight**.

  ### Addressing the Complications (Edge Cases)

  You flagged several scenarios where a simple "documented = subjugated" model fails. Here is how **Archival Legibility Bias** handles them:

  **1. The Elite Case (High standing, high documentation)**
  *   **Problem:** Elites are not subjugated, yet they fit the pattern of high density.
  *   **Resolution:** The definition relies on **Institutional Transaction**, not subjugation. Elites *seek* legibility to secure property and status (e.g., registering a deed, probating a will). They voluntarily enter the "grid" to lock in power. The bias remains: the archive records their *legal standing*, not necessarily their *lives*, but the density is high because they engaged the institution to protect their interests.
  *   **Distinction:** Subordinates are made legible *to be controlled*; elites make themselves legible *to be recognized*. The archival result (density) is the same; the power dynamic differs.

  **2. The Destroyed Archive (Intensely administered, but papers lost)**
  *   **Problem:** A population was legible, but the records burned.
  *   **Resolution:** This is **Potential Legibility** that failed to become **Actual Archival Density**. Archival Legibility Bias applies to the *surviving* corpus. If the records are destroyed, the group reverts to the status of the "commoners on the common" (invisible), but for a different reason (material loss vs. non-creation). A robust definition must distinguish between *Structural Invisibility* (never recorded) and *Accidental Invisibility* (recorded then lost). This term applies to the former.

  **3. Self-Documenting Communities (Guilds, Congregations, Diarists)**
  *   **Problem:** A group generates high density without state control.
  *   **Resolution:** They have created **Internal Legibility**. They functioned as their own institution. The bias still operates *within* their records (the guild records the master, not the apprentice; the church records the communicant, not the skeptic), but they escape the *state's* legibility bias. They are "richly documented" because they adopted the *mechanism* of institutional transaction internally.

  **4. Digital/Platform Data (Continuous recording)**
  *   **Problem:** Modern data is generated passively, not filed.
  *   **Resolution:** This is **Hyper-Legibility**. The "transaction" is no longer a discrete event (applying for relief) but a continuous state (using a phone, browsing the web). The bias intensifies: existence is now *defined* by data generation. Those who "go off-grid" (cash only, no phone) become the new "commoners on the common"—demographically real but archivally non-existent.

  ### Where this Definition Fails (Limitations)

  You asked for the edges where this might collapse.

  1.  **Random Administrative Survival:** If a cache of papers survives purely by accident (e.g., a family trunk found in a wall) rather than institutional filing, Archival Legibility Bias does not apply. The density there is random, not structural.
  2.  **Non-Institutional Power:** If a group exerts significant historical influence without ever transacting with an institution (e.g., a mass migration that avoids all checkpoints), this term describes their *invisibility*, but cannot explain their *influence*. It explains the archive's failure, not the history's reality.
  3.  **Conflation with "State Simplification":** If you use this term without care, it may collapse back into Scott's **Legibility**. You must be explicit that you are talking about the *historiographical consequence* (the historian's view), not the *administrative cause* (the state's view).
      *   *Scott:* The state simplifies the forest to tax it.
      *   *You:* The historian looks at the tax roll and thinks the forest is only where the trees were taxed.

  ### Summary for Use

  If you wish to use this in your writing, I suggest introducing it as a synthesis of existing critical theory:

  > *"I term this **Archival Legibility Bias**. Drawing on James Scott's concept of state legibility and Michel-Rolph Trouillot's work on archival silence, this describes the structural tendency for archival density to track institutional transaction rather than human significance. It distinguishes the problem from simple record loss: the records exist, but they record the *contact with power*, not the *life of the subject*. It accounts for why the workhouse inmate generates a volume of text while the independent commoner generates a line, and why the elite landowner generates a volume of text for entirely different reasons. In all cases, the archive maps the institution's reach, not the population's shape."*

  This gives you the theoretical weight of Scott and Trouillot without misusing their specific terms, and it creates a precise tool for the specific distortion you are fighting.
