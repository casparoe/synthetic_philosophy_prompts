answer: |-
  **The Procedure**

  1.  **Resolution Match (Savage State Space):** Do both members interpret the resolution criteria identically?
      *   *Settled:* Yes → Proceed. No → Moderator clarifies text. **Stop (Human Decision).**
  2.  **Evidence Portability:** Is the divergence driven by unportable evidence (tacit knowledge)?
      *   *Settled:* No → Proceed. Yes → Insider must provide one portable anchor (e.g., specific metric). If unable → Proceed to Step 4.
  3.  **Model Alignment:** Are they updating on compatible causal models?
      *   *Settled:* Yes → Proceed. No → Flag "Model Mismatch". **Stop (Human Decision).**
  4.  **Convergence (Aumann Limit):** Did the last exchange shift either probability by <5%?
      *   *Settled:* Yes → **Stop (Average Probabilities).** No → Continue discussion.

  **Case Runs**

  1.  **Ship Date (70 vs 30):** Q1 Yes. Q2 No (both portable). Q3 Yes. Q4 Yes (two rounds, no move).
      *   **Output:** Average (50%).
      *   **Justification:** "Portable evidence exchange exhausted without convergence."
  2.  **Insider (60) vs. Outsider (25):** Q1 Yes. Q2 Yes (Insider unportable). Insider fails to provide portable anchor. Q4 triggers by default (no verification possible).
      *   **Output:** Average (42.5%).
      *   **Justification:** "Unportable evidence unverifiable; default to compromise." (Procedure prioritizes transparency over private intuition).
  3.  **Resolution Loophole:** Q1 No (disagree on what counts as "Yes").
      *   **Output:** Clarify text.
      *   **Justification:** "Resolution criteria ambiguity." (Not a factual dispute; a definition fix).

  **Limitations**

  This procedure cannot distinguish heterogeneous priors from laziness or status games. Aumann's Agreement Theorem assumes honest Bayesian updating with common priors; real humans have different priors and mixed motives. If a member refuses to update due to status signaling rather than genuine belief, Step 4 treats this as informational exhaustion and averages anyway. It cannot detect strategic anchoring. Furthermore, it cannot resolve "Model Mismatches" factually; those require human judgment because they represent divergent worldviews (large world uncertainty) rather than parameter disputes. It optimizes for thread closure, not truth-seeking in stalemates.
