      *   *Correction on the Check:* Hyde doesn't write the check in Jekyll's hand. He goes into the cabinet and comes out with a check signed by Jekyll. This implies Hyde has access to Jekyll's motor programs for writing or the pre-signed checks are available. Let's stick to the prompt's phrasing "check drawn in Jekyll's hand" as a point of analysis regarding motor control leakage.
