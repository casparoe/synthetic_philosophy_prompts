          *   *Consciousness:* Access consciousness is shared (Hyde knows where the checkbook is), but phenomenal consciousness seems distinct (Hyde feels no remorse, Jekyll feels shame later). The check being in *Jekyll's hand* (as described in the prompt, though technically Hyde writes it or brings it out) suggests a leakage between streams. *Correction:* In the text, Hyde goes into the door and comes out with a check signed by Jekyll. This implies a shared motor control or a shared memory bank for *location*, but distinct moral agency.
          *   *Philosophical Point:* This looks like a failure of *narrative binding*. The "Interpreter" (Jekyll) has to explain away the check later.

      *   **Scene 2: Progressive Loss of Control (Spontaneous Shifts).**
