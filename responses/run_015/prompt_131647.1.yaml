      *   *Section 4: The Horror of the "Ought".* Neuroscience undermines the idea that we *are* one. Stevenson warns what happens if we *aren't*. The horror is the realization that the "Self" is a thin veneer over competing streams.
      *   *Conclusion:* Summarize for the discussion group. The text isn't a case study, but a thought experiment on the *value* of unity.

  6.  **Refining the Neuroscience:**
