      *   *§66:* "Don't say: 'There must be something common...' but look and see whether there is anything common..." Result: Complicated network of similarities overlapping and criss-crossing.
      *   *§67:* The thread analogy. "The strength of the thread does not reside in the fact that some one fibre runs through its whole length, but in the overlapping of many fibres."
      *   *Intent:* Wittgenstein's primary goal is *negative/therapeutic*. He wants to stop the philosophical craving for generality and precise definitions. He isn't trying to build a positive theory of categorization (like cognitive science does).
