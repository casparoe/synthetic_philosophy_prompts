          3.  **The Human-Adaptation Claim:** Humans change to fit the AI. (Defensible, supports dismissal of *AI* agency in overthrow).
          4.  **The Structural Determinism Claim:** Optimization pressure inevitably simplifies values. (Defensible, supports dismissal of *intent* but not *outcome*).
