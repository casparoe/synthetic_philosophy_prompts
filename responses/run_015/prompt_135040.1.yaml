  *Failure:* If expert judgment in biology aligns neither with swap-robustness nor de-idealization (e.g., relying solely on ad hoc predictive fit), the hypothesis fails. This would suggest model justification is fundamentally pragmatic rather than structural. A negative result still clarifies the limits of structural accounts, forcing a return to purely instrumentalist interpretations.

