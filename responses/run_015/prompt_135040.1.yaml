  *Months 1-2:* Formalize metrics for swap-robustness versus de-idealization robustness. Define operational criteria for "benigncy" in historical case studies.
  *Months 3-5 (Physics Case):* Analyze kinetic theory. De-idealization is available (ideal vs. van der Waals equations). I will reconstruct the historical debate surrounding the adoption of van der Waals corrections. I will test whether expert judgment tracks de-idealization potential or swap-robustness. This establishes the baseline where standard accounts work.
  *Months 6-8 (Biology Case):* Analyze neutral theory in population genetics. No deeper mechanistic theory exists. I will examine whether modelers justify assumptions via swap-robustness (e.g., varying mutation distributions) rather than truth-approximation. I will review key controversies where assumptions were challenged but retained.
  *Months 9-10:* Comparative analysis. Determine if swap-robustness explains consensus in biology where de-idealization fails. I will map the logical structure of justification in both fields to identify the divergent criteria.
