  Regarding the multi-player issue, your teammate is also right that treating the opponents as a single joint profile differs from standard rationalizability when there are three or more players. Standard rationalizability requires players to hold independent beliefs about each opponent, meaning you cannot assume opponents correlate their actions unless there is a mechanism allowing it. Your code effectively allows for correlated beliefs by iterating over joint profiles, which computes a set known as correlated rationalizability. In two-player games these concepts coincide, but with more players the set of strategies surviving under independent beliefs is typically smaller than those surviving under correlated beliefs. So your solver is checking the wrong belief space for standard rationalizability, compounding the error from ignoring mixed strategies.

  On your specific question about deletion order, you are actually correct there whereas your teammate might be conflating this with weak dominance. Iterated elimination of strictly dominated strategies or never-best-responses yields a unique set of surviving strategies regardless of the order in which you delete them. However, this order independence only guarantees consistency for your specific flawed algorithm, not correctness relative to game theory definitions. To fix the solver you would need to verify best responses against the convex hull of opponent strategies via linear programming rather than looping over pure profiles, and if you need standard rationalizability for multiple opponents you must constrain beliefs to be product distributions.
