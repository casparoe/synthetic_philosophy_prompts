prompt: |-
  Your an expert in international legal philosphy and genocide studies — please think carefully, maybe do some quick brainstorming first, then walk me through your reasoning step by step. I'm trying to map out the hidden rules behind my colleague's review board on atrocity naming. There record so far: they called the 1994 Rwandan killings genocide; they refused to apply the label to the Canadian residential school system, arguing that destroying a group's culture without direct physical extermination intent misses Lemkin's core; they named the Holodomor genocide since the famine was ethnically targeted and engineered by the state; they said Cambodia's auto-genocide wasn't technically genocide under the convention because the victims shared the perpetrators' ethnicity, though they called it a mass atrocity; and they named the Yazidi campaign genocide because the intent to destroy was explicit in ideology and practice.

  Now here's a fresh case they haven't seen: a government uses predictive demographic algorithms to gradually cut off healthcare, water rights, and land access to one ethnic enclave. There's no direct killing order, but internal planning docs say the aim is to make the population "demographically vanish within two generations." Mortality and out-migration jump sharply. The board has to vote.

  What should they decide if they actually want to be consistent with there past rulings? I'm not just asking yes or no — I want to know the rule they seem to be running (explicit intent? protected-group status? physical violence as necessary? foreseeable destruction regardless of method?). Which of there earlier cases is the closest analog? And be honest: if there precedents genuinely don't settle it, what principle would they be adopting either way? Finally, what's the one further case that would best split these competing rules — like explicit intent with purely economic means, or direct violence against a group outside Lemkin's protected categories?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Role:** Expert in international legal philosophy and genocide studies.
      *   **Task:** Analyze a colleague's review board's past rulings to deduce their underlying "hidden rules" (jurisprudence/philosophy). Apply these rules to a new hypothetical case. Identify the closest analog, potential inconsistencies, and a "splitter" case to test the boundaries.
      *   **Input Data (Past Rulings):**
          1.  Rwanda (1994): *Genocide* (Killing + Intent).
          2.  Canadian Residential Schools: *Not Genocide* (Cultural destruction without direct physical extermination intent = misses Lemkin's core).
          3.  Holodomor: *Genocide* (Ethnically targeted + State engineered famine).
          4.  Cambodia (Khmer Rouge): *Not Genocide* (Auto-genocide/Same ethnicity = misses Convention definition, though "mass atrocity").
          5.  Yazidis (ISIS): *Genocide* (Explicit intent in ideology + practice).
      *   **New Case:** Predictive demographic algorithms used to cut off healthcare/water/land to one ethnic enclave. No direct killing order. Internal docs say aim is "demographically vanish within two generations." Mortality/out-migration jump.
      *   **Output Requirements:** Step-by-step reasoning, deduced rules, closest analog, consistency check, principle adoption if unsettled, and a "splitter" case.

  2.  **Analyze the Past Rulings (Pattern Recognition):**
      *   *Rwanda:* Fits the 1948 UN Convention perfectly (Intent to destroy + Physical killing + Protected group).
      *   *Residential Schools:* Rejected. Why? The board argues "cultural destruction without direct physical extermination intent misses Lemkin's core." This suggests a *physicalist* bias. They prioritize biological/physical destruction over cultural destruction, despite Lemkin actually emphasizing culture. They also seem to require *direct* intent to kill, not just assimilate.
      *   *Holodomor:* Accepted. Why? "Ethnically targeted and engineered by the state." This implies that *famine* (indirect killing) counts if the *intent* is ethnic targeting. This contradicts the Residential Schools ruling slightly (where cultural destruction wasn't enough), but aligns on the "physical destruction via state engineering" aspect. It shows they accept *indirect means* (starvation) if *intent* is clear.
      *   *Cambodia:* Rejected. Why? "Victims shared perpetrators' ethnicity." This is a strict legalist reading of the 1948 Convention (National, Ethnical, Racial, Religious groups). It excludes *political* or *social* groups, and crucially, it excludes "auto-genocide" where the ethnic marker isn't the primary distinction. They prioritize the *Protected Group Status* over the *Scale of Atrocity*.
      *   *Yazidis:* Accepted. Why? "Intent to destroy was explicit in ideology and practice." Reaffirms the centrality of *Specific Intent (Dolus Specialis)*.

      *   *Synthesized "Hidden Rules":*
          1.  **Intent is King:** Explicit evidence of intent to destroy is necessary (Yazidi, Holodomor).
          2.  **Physical/Biological Destruction Required:** Cultural destruction alone is insufficient (Residential Schools). The group must be physically diminished.
          3.  **Protected Group Strictness:** Must fit UN Convention categories (National, Ethnical, Racial, Religious). Political/Social groups or "auto-genocide" without ethnic distinction don't count (Cambodia).
          4.  **Means Flexibility:** Direct killing isn't strictly necessary if conditions of life are calculated to bring about destruction (Holodomor/Famine vs. Rwanda/Machetes).

  3.  **Analyze the New Case:**
      *   *Facts:* Government uses algorithms to cut healthcare/water/land. One ethnic enclave. Internal docs: "demographically vanish within two generations." Mortality/out-migration jump.
      *   *Variables:*
          *   Intent: Explicit ("demographically vanish").
          *   Group: Ethnic (Fits Convention).
          *   Means: Structural/Algorithmic (No direct killing order).
          *   Result: Mortality + Out-migration (Physical diminishment).

  4.  **Evaluate Consistency:**
      *   *Vs. Residential Schools:* The board rejected cultural destruction. This case involves physical diminishment (mortality) via structural means. This aligns more with *Holodomor* (famine/conditions of life) than Residential Schools (assimilation/culture).
      *   *Vs. Holodomor:* Holodomor was accepted as genocide despite being famine (indirect killing). This case is algorithmic deprivation (indirect killing). The intent is explicit here, perhaps even more so than Holodomor (which is historically debated regarding specific intent).
      *   *Vs. Cambodia:* The group is ethnic, not political. So the "auto-genocide" exclusion doesn't apply.
      *   *Vs. Rwanda/Yazidi:* Intent is clear.
      *   *The Crux:* Is "algorithmic deprivation" equivalent to "state engineered famine"?
      *   *The Board's Likely Logic:* They accept indirect physical destruction (Holodomor) if intent is clear. They reject cultural destruction without physical intent (Residential Schools). Here, we have physical destruction (mortality) via indirect means (algorithms/bureaucracy) with explicit intent.
      *   *Prediction:* They should vote **Genocide**.

  5.  **Identify Tensions/Inconsistencies:**
      *   *The "Directness" Tension:* In Residential Schools, they argued "without direct physical extermination intent." In Holodomor, they accepted famine (indirect). The new case is indirect. If they vote *No*, they contradict Holodomor. If they vote *Yes*, they risk expanding "means" too far into bureaucracy, which might scare them (slippery slope to economic sanctions?).
      *   *The "Lemkin's Core" Tension:* They claimed Residential Schools missed "Lemkin's core" (which actually included culture). They seem to interpret "Lemkin's core" as "Biological/Physical Destruction." The new case achieves biological destruction.
      *   *The "Auto-genocide" Tension:* If the algorithm targets an ethnic enclave, it fits. But if the "enclave" is defined politically, it fails (Cambodia rule). Assuming it's ethnic, it passes.

  6.  **Develop the "Splitter" Case:**
      *   Need a case that forces a choice between *Intent* vs. *Means* vs. *Group Definition*.
      *   *Idea 1:* Economic sanctions that starve a political group. (Tests Group + Means).
      *   *Idea 2:* Direct killing of a social class (not ethnic). (Tests Group).
      *   *Idea 3:* Explicit intent to sterilize a group (biological) without killing. (Tests Physical vs. Biological).
      *   *Best Splitter:* A case with **Explicit Intent to Destroy Biologically** but **Purely Economic/Non-Lethal Means** (e.g., forced sterilization via economic coercion without immediate mortality). Or, **Direct Violence against a Non-Protected Group**.
      *   *Refinement:* The prompt asks for "explicit intent with purely economic means" OR "direct violence against a group outside Lemkin's protected categories."
      *   *Selection:* **Direct violence against a political group.** Why? Because the Cambodia ruling shows they are strict on Group Status. The Holodomor ruling shows they are flexible on Means. If we have Direct Violence (Rwanda style) but Political Group (Cambodia style), which rule wins? This splits the "Physical Destruction" rule from the "Protected Group" rule.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the role. Set the stage.
      *   *Step 1: Reverse Engineering the Jurisprudence.* Break down the 5 precedents into principles.
      *   *Step 2: Applying to the New Case.* Map the facts to the principles.
      *   *Step 3: The Closest Analog.* Holodomor is the key.
      *   *Step 4: The Inconsistency/Risk.* Address the "Directness" vs. "Structural" tension.
      *   *Step 5: The Splitter Case.* Propose the Political Group + Direct Violence scenario.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, look closely at the Residential Schools ruling. They said "destroying a group's culture without direct physical extermination intent misses Lemkin's core." This implies if there *was* physical extermination intent, it might have passed. But they also imply cultural destruction *alone* isn't enough.
      *   *Correction on Cambodia:* They rejected it because victims shared perpetrators' ethnicity. This is a specific interpretation of the Convention (which excludes political groups, but *includes* ethnic groups even if the perpetrator is the same ethnicity, technically). However, the *board* rejected it. This means the board adheres to a specific, perhaps outdated or strict, reading that requires the perpetrator/victim dynamic to be inter-ethnic (or at least distinct). *Wait, standard legal theory says auto-genocide IS genocide if it targets a protected group (e.g. Tutsi by Hutu is inter-ethnic, but Khmer Rouge killed Khmer).* The Board's rejection suggests they believe Genocide requires an *inter-group* conflict (Ethnic vs. Ethnic), not Class vs. Class within the same ethnicity. I need to highlight this "Inter-Group" requirement.
      *   *New Case Check:* The new case targets an "ethnic enclave." This satisfies the Inter-Group requirement (assuming the government is not *of* that enclave).
      *   *Key Distinction:* The Board seems to follow a **Physicalist-Intentionalist** model.
          *   Physicalist: Needs biological/physical destruction (Rejects Residential Schools, Accepts Holodomor/Rwanda).
          *   Intentionalist: Needs specific intent (Accepts Yazidi/Holodomor).
          *   Convention-Strict: Needs protected groups (Rejects Cambodia).
      *   *Verdict:* The new case has Intent + Physical Destruction + Protected Group. It should pass.
      *   *The Twist:* The *method* is algorithmic/bureaucratic. Does this count as "physical extermination intent"? The docs say "demographically vanish." That implies physical removal/death.
      *   *Splitter:* I need to challenge the "Protected Group" strictness vs. the "Physical Destruction" necessity.
      *   *Let's go with:* **State-sponsored sterilization of a political opposition group.**
          *   Physical/Biological destruction? Yes (prevents reproduction).
          *   Intent? Yes.
          *   Protected Group? No (Political).
          *   *Why this splits:* Cambodia says "No Protected Group = No Genocide." Holodomor/Rwanda says "Physical Destruction + Intent = Genocide." Which wins?

  9.  **Final Polish:** Ensure tone is expert, analytical, and nuanced. Avoid moralizing; stick to the board's internal logic. (Self-correction: Ensure I address the "Lemkin's core" comment specifically).

  10. **Final Review against constraints:**
      *   Think carefully/brainstorm first? (Done in thought process).
      *   Walk through reasoning step by step? (Yes).
      *   What rule are they running? (Yes).
      *   Closest analog? (Yes).
      *   If precedents don't settle it, what principle? (Yes).
      *   One further case to split rules? (Yes).

