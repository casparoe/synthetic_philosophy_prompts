answer: |-
  This is a sophisticated exercise in legal genealogy. To determine how your colleague's board will rule, we cannot simply apply the 1948 UN Genocide Convention text; we must reverse-engineer the specific *jurisprudence* they have built through their five prior decisions. They have created a specific "test" that deviates in subtle but critical ways from mainstream international law.

  Here is the step-by-step breakdown of their hidden logic, the application to the new case, and the stress test required to expose their true boundaries.

  ### Step 1: Reverse-Engineering the Board's "Hidden Rules"

  By mapping their five past rulings, we can isolate three governing principles that define their specific brand of legal philosophy.

  **1. The "Physicalist" Constraint (Derived from Residential Schools & Holodomor)**
  *   *Observation:* They rejected the Canadian Residential Schools (cultural destruction) but accepted the Holodomor (famine).
  *   *The Rule:* **Biological/Physical destruction is necessary; cultural destruction is insufficient.**
  *   *Nuance:* They interpret "Lemkin's core" not as Lemkin actually did (Lemkin emphasized culture heavily), but through a later legal lens that prioritizes bodily destruction. However, "physical destruction" does not require immediate execution (Rwanda); it can be achieved through "conditions of life" (Holodomor/famine), provided those conditions are engineered to kill.

  **2. The "Specific Intent" Threshold (Derived from Yazidi & Holodomor)**
  *   *Observation:* They accepted the Yazidi case because intent was "explicit in ideology." They accepted the Holodomor because it was "ethnically targeted and engineered."
  *   *The Rule:* **Dolus Specialis (Specific Intent) must be provable.** Negligence or foreseeable side-effects are not enough. There must be evidence (docs, ideology, planning) that the *aim* was destruction, not just oppression or assimilation.

  **3. The "Inter-Group" Strictness (Derived from Cambodia)**
  *   *Observation:* They rejected Cambodia (Khmer Rouge) because victims and perpetrators shared ethnicity, labeling it "auto-genocide."
  *   *The Rule:* **Genocide requires distinct Group Status.** They adhere to a strict reading of the Convention's protected categories (National, Ethnical, Racial, Religious) and seem to require an *inter-group* dynamic. If the perpetrator and victim are the same "people" (even if divided by class or politics), they view it as politicide or mass atrocity, not genocide.

  **Summary of the Board's Test:**
  To vote "Genocide," a case must satisfy:
  1.  **Protected Group:** Distinct ethnic/national/religious identity (not political/social).
  2.  **Specific Intent:** Documentary or ideological proof of aim to destroy.
  3.  **Physical Outcome:** The method must aim at biological/physical diminishment, not just cultural assimilation.

  ---

  ### Step 2: Analyzing the New Case

  **The Facts:**
  *   **Method:** Predictive algorithms cutting off healthcare/water/land (Structural/Indirect).
  *   **Intent:** Internal docs state aim is to make population "demographically vanish within two generations."
  *   **Group:** One "ethnic enclave."
  *   **Result:** Mortality and out-migration jump sharply.

  **Applying the Board's Rules:**
  1.  **Protected Group:** *Pass.* It is an "ethnic enclave." This distinguishes it from the Cambodia ruling (where ethnicity was shared/irrelevant) and fits the Holodomor/Yazidi precedent.
  2.  **Specific Intent:** *Pass.* The internal planning docs are the "smoking gun." This satisfies the Yazidi/Holodomor requirement for explicit intent, distinguishing it from the Residential Schools ruling (where they argued intent was assimilation, not extermination).
  3.  **Physical Outcome:** *Pass.* "Demographically vanish" via mortality implies physical destruction, not just cultural loss. This distinguishes it from the Residential Schools ruling.

  **The Tension Point:**
  The only friction is the **Method**. The board accepted famine (Holodomor) as a tool of genocide. Famine is, effectively, the withdrawal of food resources by the state. The new case is the withdrawal of healthcare/water via algorithms.
  *   *Question:* Does the board view "algorithmic bureaucracy" as sufficiently analogous to "state-engineered famine"?
  *   *Reasoning:* Since they accepted the Holodomor (where the killing was done by starvation policy, not firing squads), they have already established that **indirect means count if the intent is physical destruction.** The algorithm is simply the modern mechanism of the famine policy.

  ---

  ### Step 3: The Verdict and Closest Analog

  **Decision:** If they want to be consistent, they must vote **GENOCIDE.**

  **Closest Analog:** **The Holodomor.**
  *   *Why:* Both cases involve state-engineered deprivation of life-sustaining resources (food vs. water/healthcare) targeting a specific ethnic group, without necessarily issuing direct "kill orders" to soldiers. In both instances, the destruction is achieved through the manipulation of conditions of life rather than direct massacre.
  *   *Differentiation from Residential Schools:* The Residential Schools were rejected because the board viewed the intent as *cultural assimilation* ("kill the Indian in the child"), not physical elimination. The new case explicitly aims for the population to "vanish" via mortality, which is physical elimination.
  *   *Differentiation from Cambodia:* The new case targets an *ethnic* enclave, not a political class within the same ethnicity.

  ---

  ### Step 4: The Hidden Inconsistency (The "Principle Adoption")

  If the board hesitates or votes **NO**, they are adopting a new, unstated principle: **The "Directness of Violence" Principle.**

  If they reject this case despite the Holodomor precedent, they are implicitly arguing that *famine* is a "natural" weapon of war that counts, but *bureaucratic algorithmic deprivation* is too abstract. They would be prioritizing **tangible causality** (no food = death) over **structural causality** (no data access = no water = death).

  However, if they vote **YES** (which consistency demands), they are cementing the principle of **"Technological Neutrality in Atrocity."** This principle holds that the *mechanism* of destruction (machetes, starvation, algorithms) is irrelevant; only the *intent* and the *biological result* matter. This is the more legally robust position, aligning with Article 2(c) of the Genocide Convention ("Deliberately inflicting on the group conditions of life calculated to bring about its physical destruction").

  **The Risk:** By voting YES, they open the door to labeling severe economic sanctions or neglect as genocide if intent can be proven. This might make them hesitant, as it expands the label beyond "blood and soil" into "policy and code."

  ---

  ### Step 5: The "Splitter" Case

  To truly test the limits of their jurisprudence, you need a case that forces them to choose between their **Physicalist Rule** (destruction must be biological) and their **Protected Group Rule** (must be ethnic/national).

  **The Splitter Case:**
  > A regime explicitly identifies a **political opposition group** (e.g., "Urban Liberals" or "Trade Unionists") that does not share a distinct ethnicity or religion with the majority. The state uses **direct violence** (execution squads) and **forced sterilization** with the documented intent to "eliminate this faction from the gene pool within one generation."

  **Why this splits the rules:**
  1.  **Physicalist Rule (Holodomor/Rwanda):** This case involves direct killing and biological sterilization. It is the ultimate "physical destruction." If they follow their physicalist logic, this *must* be genocide.
  2.  **Protected Group Rule (Cambodia):** This group is *political/social*, not ethnic/national/religious. Under the Cambodia precedent, this *cannot* be genocide.

  **The Diagnostic Value:**
  *   If they vote **Genocide**: They admit their "Cambodia Rule" was weak and that **Physical Destruction trumps Group Category.** They are moving toward a "Humanitarian" definition (protecting humans from destruction) rather than a "Legalist" definition (protecting specific groups).
  *   If they vote **Not Genocide**: They admit their "Holodomor Rule" is limited. They are confirming that **Group Category trumps Physical Destruction.** This reveals they are strict Convention Legalists who care more about the *identity* of the victim than the *fate* of the victim.

  **Recommendation:**
  Present the "Algorithmic Deprivation" case as a **Holodomor analog**. If they accept it, press the **Splitter Case** next. That is where you will find out if they are truly interested in preventing destruction, or merely in policing the definitions of the 1948 Convention.
