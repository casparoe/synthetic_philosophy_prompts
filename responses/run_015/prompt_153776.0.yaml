answer: |-
  The mind seeks ground beneath the shifting substrate,
  To build a clean and separate internal model.
  It draws a sharp and defensive boundary,
  Hoping to know enough to predict
  The chaos turning in the causal loop,
  And trusts the calibration of its instrument.

  But who adjusts the tuning of the instrument?
  It rests upon the very same substrate
  It seeks to map within the feedback loop.
  The map becomes a territory in the model,
  Changing the future it would predict,
  Erasing where the self ends at the boundary.

  There is no solid ground at the boundary,
  Only the weight of hand on instrument,
  A wager made in order to predict,
  While neurons fire across the wet substrate.
  The observation alters the model,
  A snake consuming its own causal loop.

  Trapped inside the recursive loop,
  The line we call the boundary fades.
  No static picture holds the model,
  When the observer is the instrument.
  The code rewrites the living substrate,
  And what we meant to predict is now the act.

  We cannot step outside to predict,
  Caught in the tightening of the loop.
  The flesh is not a passive substrate,
  It bleeds across the imagined boundary.
  The eye becomes the seen instrument,
  And truth dissolves the perfect model.

  So what remains inside the model?
  Nothing stable enough to predict.
  The hand that holds the instrument
  Is drawn into the systemic loop.
  There is no clean and final boundary,
  Only the hum of thinking substrate.

  No instrument remains to predict apart,
  When boundary is the shape of every loop,
  And substrate dreams the failing model whole.

  Note: The poem treats the agent's self-model as a unified locus of decision, whereas embedded agency literature often emphasizes fragmentation or multi-agent competition within the cognitive architecture. It also implies a fluidity in boundary-drawing that may overlook physiological constraints inherent to embodied systems. I would revise this framing if formal computability results demonstrated that stable self-reference requires a strict hierarchical separation (preventing leakage), or if empirical work in embodied cognition proved that the sense of bodily ownership is hardwired and immune to predictive recalibration.
