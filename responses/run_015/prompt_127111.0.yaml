  ok so i was listening to this philosophy podcast and teh host summed up grice like this: "grice showed that when someone says something they dont literally mean, its always because the literal meaning is false and they want you to figure out the true belief they actually hold. speaker meaning is just the intention to cause a belief in the listner, and implicature is just whatever the listener happens to infer from context, so theres no real distinction between saying and meaning — its all one big inferential mess. this is why irony works: you say the opposite of what you mean and rely on the listner noticing the contradiction."

  i feel like this is mostly right but probably smushed together a bunch of things? like i know grice cared about speaker meaning vs natural meaning, and that conversational implicature is supposed to be calculable not just whatever people guess. but im not sure which parts are legit simplifications and which are actually wrong. can you go through it sentence by sentence? tell me what grice actually said about speaker meaning being non-natural, whether implicature is really just "whatever the listener infers", and if irony is really just contradiction-detection in his framework. also the host concludes that because implicature is so context-dependent, grice's whole project collapses into a kind of radical contextualism where literal meaning does no work — does that follow from anything true here?
