answer: |-
  Your hunch is correct. The passage you quoted is a philosophical train wreck. It conflates distinct positions, misapplies modal logic, and makes a sociological claim about the field that is empirically false.

  Here is the audit of what is wrong, what is simplified, and what the actual debate looks like.

  ### 1. The Fatal Conflation: Constitution vs. Identity
  **The Text's Claim:** "The solution most philosophers now accept is the constitution view... which means David is not a second object over and above the lump, but the very same thing."
  **The Reality:** This is a contradiction in terms.

  In contemporary metaphysics, the **Constitution View** (championed by philosophers like Lynne Baker) explicitly holds that the lump and the statue are **numerically distinct**. That is the whole point of saying "constitution without identity." If $x$ constitutes $y$, and $x \neq y$, then there are two things in that location.

  The text describes a view that sounds like **Deflationism** or **Relative Identity** (the idea that they are one object described in two ways), but it labels it "Constitution."
  *   **Harmless Simplification:** None. This is a category error.
  *   **Why it matters:** If they are the "very same thing," you have the **Identity View**. If they are "not identical" but one doesn't add to the ontology (not a "second object"), you are speaking in riddles that violate Leibniz's Law (if $x$ and $y$ have different properties, they cannot be the same thing). The text tries to claim the lump and statue have different modal properties (squashing) but are still the "same thing." Standard logic says this is impossible.

  ### 2. The Modal Logic Error
  **The Text's Claim:** "There is no threat from the Kripkean claim that identity is necessary, because 'statue' and 'lump' are sortal terms rather than proper names, so they don't rigidly designate."
  **The Reality:** This is technically incorrect.

  Saul Kripke's argument for the necessity of identity applies to objects, regardless of whether we pick them out with proper names ("David"), definite descriptions ("the statue"), or sortals ("this lump"). If the statue *is* the lump, then in every possible world where that object exists, it is both the statue and the lump.
  *   **The Mistake:** You cannot escape the necessity of identity by claiming sortals aren't rigid designators. If the term refers to the object, and the object is identical to itself, the identity holds across worlds.
  *   **The Workaround:** Philosophers who want to maintain identity (the Identity View) usually don't use this sortal argument. Instead, they use **Temporal Parts** (the lump on Monday is a different part than the statue on Tuesday) or **Modal Counterparts** (the thing that gets squashed in another world isn't *this* statue, but a counterpart). The text's explanation is a garbled attempt to explain away modal differences without doing the heavy lifting.

  ### 3. The Sociological Error
  **The Text's Claim:** "The only real alternative — that David and Lump are two numerically distinct objects sitting in the same place — has been largely given up."
  **The Reality:** This is flatly false.

  The view that there are two distinct objects in the same place at the same time is called **Coincidentalism**. It is currently one of the dominant positions in analytic metaphysics, often paired with **Four-Dimensionalism** (Perdurantism).
  *   **Who holds it:** David Lewis, Ted Sider, and many contemporary materialists.
  *   **Why it's popular:** It takes our intuitions seriously (the lump survives squashing, the statue doesn't) without positing mysterious "constitution" relations. It simply says: There is a lump-worm and a statue-worm. They overlap for a while. They are distinct.
  *   **The Principle Violated:** The text claims this violates "the principle that a single region of space contains a single material object." There is no such universally accepted principle. Coincidentalists argue that two objects can share the same matter and location just as two events (a dance and a muscle contraction) can share the same time and space.

  ### 4. Does the Conclusion Survive?
  **No.** The chapter's conclusion that the "two-object view is finished" collapses completely once you correct the definitions. In fact, the two-object view (Coincidentalism) is arguably *more* popular in rigorous academic circles than the "Constitution without Identity" view described in the book.

  ### 5. The Actual Live Options
  If you were to walk into a conference on material constitution today, these are the live options, not the one presented in the book:

  1.  **Coincidentalism (Two Objects):** The lump and the statue are numerically distinct. They share all their microphysical parts at time $t$, but they are different macroscopic objects with different persistence conditions. (Often relies on 4Dism).
      *   *Cost:* Violates common sense intuition that two things can't be in the same place.
      *   *Benefit:* Preserves modal intuitions (statue dies, lump lives) and logic (Leibniz's Law).
  2.  **The Identity View (One Object):** The lump *is* the statue.
      *   *Cost:* Must explain away the modal differences. (e.g., "It is not true that the lump would survive squashing; strictly speaking, the object that is essentially a lump ceases to exist when shaped.")
      *   *Benefit:* Ontologically parsimonious (no coincident objects).
  3.  **Constitution View (Distinct but Unified):** The lump constitutes the statue. They are distinct, but the statue is not just a "second object"; it has a special ontological dependence on the lump. (Lynne Baker's view).
      *   *Cost:* Still posits two objects, plus a special "constitution" relation.
      *   *Benefit:* Tries to capture the intimacy of the relationship better than raw Coincidentalism.
  4.  **Eliminativism (Nihilism):** There are no statues. There are only simples (atoms) arranged statue-wise.
      *   *Cost:* Denies the existence of ordinary objects.
      *   *Benefit:* Solves the problem by dissolving one of the relata.

  ### 6. What the Disagreement Really Turns On
  The debate is not about whether sortals are rigid designators (as the book claims). It turns on a trade-off between **Ontological Parsimony** and **Modal Intuition**.

  *   **Side A (Identity/Eliminativism):** Prioritizes Parsimony. "It is crazy to say two things are in one place. We must adjust our understanding of the object's properties to make them identical."
  *   **Side B (Coincidentalism/Constitution):** Prioritizes Modal Intuition. "It is obvious the lump could survive being squashed and the statue could not. Since they have different properties, they must be different things. We must adjust our understanding of space/location to allow coincidence."

  ### Summary Audit
  *   **"Constitution without identity... means... the very same thing":** **Wrong.** Constitution without identity means two things.
  *   **"Sortals... don't rigidly designate":** **Wrong/Misleading.** Doesn't solve the necessity of identity problem.
  *   **"Two-object view... largely given up":** **Wrong.** It is a dominant view.
  *   **"Single region... single object principle":** **Wrong.** This is a contested premise, not a rule.

  The book chapter is trying to sell a "Goldilocks" solution (not one object, not *really* two objects) that satisfies everyone, but in doing so, it misrepresents the actual logical commitments of the positions. You are right to be suspicious.
