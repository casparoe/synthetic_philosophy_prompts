answer: |-
  Right, pull up a chair. Since this is for a seminar on the philosophy of action, we need to be precise about the agency involved. We're not just talking about "governments" as monolithic blobs; we're talking about specific agents operating under constrained rationality within a political economy.

  You want to challenge the standard textbook dismissal of the Concorde decision as a pure Sunk Cost Fallacy (SCF). To do that, we can't just wave our hands at "prestige." We need to model the decision tree.

  Here is my scratchpad mapping of the decision nodes before we dive into the analysis.

  ### Phase 1: Decision Node Mapping (Brainstorming)

  **Node 0: 1962 (The Treaty)**
  *   **Agents:** UK Ministry of Aviation, French SGAC (Secretariat General for Civil and Commercial Aviation).
  *   **State:** High uncertainty, high optimism. Supersonic transport (SST) seen as inevitable.
  *   **Decision:** Commit to joint development.
  *   **Rationality:** *Ex ante* rational based on projected market demand (Boeing pan-Am orders expected).

  **Node 1: 1969 (First Flight)**
  *   **State:** Costs escalating, timelines slipping. US SST (Boeing 2707) still in race.
  *   **Decision:** Continue funding to prototype.
  *   **Rationality:** Still viable commercially *at this moment*.

  **Node 2: 1973 (The Critical Juncture)**
  *   **Event:** Oil Shock + Environmental bans (US sonic boom restrictions) + Pan Am cancels orders.
  *   **State:** Commercial viability collapsed. No private airline orders remaining.
  *   **Agents:** UK Treasury/Cabinet (Heath then Wilson), French Presidency/Ministry of Transport.
  *   **Options:**
      *   *A: Terminate.* Scrapping prototypes. Pay penalty clauses to French. Admit failure.
      *   *B: Complete.* Fund production of limited run (14 planes). State-owned airlines (BA/Air France) forced to take them.
  *   **Payoff Structure:**
      *   *A:* Stop future cash bleed. Loss of technological base. Diplomatic rupture.
      *   *B:* Massive future cash bleed. No profit. Retain tech base. Honor treaty. Signal commitment.

  **Node 3: 1976–2003 (Operation)**
  *   **State:** Operating at loss, subsidized by gov.
  *   **Decision:** Keep flying vs. Retire.
  *   **Outcome:** Eventually retired after 2000 crash + maintenance costs.

  ***

  ### Phase 2: The Anatomy of the Decision (Post-1973)

  Let's zoom in on **Node 2**. This is where the philosophy of action gets messy. The standard econ 101 line is: "The money spent from 1962 to 1973 is gone. It is sunk. The only relevant variables are future costs vs. future benefits. Since future benefits (ticket sales) < future costs (fuel/maintenance), you quit."

  But who is the "You"?

  If the decision-maker were a private shareholder maximizing dividend utility, the SCF label holds water. But the agents were the British Cabinet and the French Executive. Their utility function is not $\Pi$ (Profit). It is $U = w_1\Pi + w_2P + w_3S + w_4R$.
  *   $\Pi$ = Financial Profit
  *   $P$ = Prestige/Soft Power
  *   $S$ = Strategic Tech Base (keeping engineers employed, retaining supersonic know-how)
  *   $R$ = Reliability/Reputation (honoring international treaties)

  In 1973, $\Pi$ went negative. But did $P$, $S$, or $R$ go to zero? No. In fact, the *marginal utility* of $P$ might have increased precisely because the commercial case died. If everyone else cancels their SST (like the US did), being the *only* one with one increases the prestige value disproportionately.

  ### Phase 3: Where the Fallacy Framework Fits (and Where it Breaks)

  **Where the SCF diagnosis is correct:**
  There is evidence that internal memos from the UK Treasury explicitly argued that continuing was economically indefensible. If individual ministers argued, "We can't stop now because we've already spent £500 million," without referencing future utility, that is classic cognitive dissonance resolution. They were using past expenditure as a heuristic for future value, which is the definition of the fallacy. They were treating the expenditure as an *investment* that needed a return, rather than a *cost* that needed mitigation.

  **Where the SCF diagnosis fails (The Rational Commitment Argument):**
  Here is where we push back. Consider the game-theoretic position of the UK vis-à-vis France.
  The 1962 treaty had penalty clauses for withdrawal. But more importantly, it established a precedent for future European collaboration (which later becomes Airbus).
  If the UK unilaterally pulls out at Node 2:
  1.  **Direct Cost:** Penalty payments (financial).
  2.  **Indirect Cost:** Loss of trust. Future joint ventures become more expensive because partners demand higher risk premiums.

  If the British Cabinet viewed the Concorde not as an airliner project but as a **bonding mechanism** for European industrial policy, then continuing funding is not honoring sunk costs; it is paying a premium for a **commitment device**.
  By refusing to quit despite the economic loss, the UK signals: "We are a reliable partner even when things go south." This signal has future utility in the form of cheaper capital costs for Airbus in the 1980s. If you model this dynamically, the "loss" on Concorde is an insurance premium on future industrial cooperation. That is rational forward-looking behavior, not backward-looking fallacy.

  ### Phase 4: Value Conversion and the Identity of the Project

  This is the philosophical crux for your seminar. The SCF assumes the *identity* of the project remains static.
  *   **Project Identity T0 (1962):** Commercial Supersonic Transport.
  *   **Project Identity T2 (1973):** National Prestige Symbol / Technology Demonstrator.

  When the oil shock hit, the project *metamorphosed*. The decision-makers weren't continuing the *commercial* project; they were pivoting to a *prestige* project that happened to use the same hardware.

  Does referencing the sunk costs make sense here?
  Argument: "We have spent £500m. If we stop, we have a hangar full of scrap. If we spend another £100m, we have a national monument."
  Is this a fallacy?
  Strictly speaking, yes. The £500m is gone regardless.
  But pragmatically, the sunk costs represent **installed capacity**. You cannot buy a "National Monument" status for £100m from scratch. You can only acquire it by completing the thing you already spent £500m on.
  The sunk costs create a **path dependency**. The only way to access the utility of "Prestige" is to traverse the path already laid. In this sense, the past costs are not being "honored" emotionally; they are being recognized as a necessary condition for a new utility function.

  The fallacy lies in thinking the *original* goal (profit) justifies the spend. The rationality lies in recognizing that the *new* goal (prestige/tech retention) is only accessible because of the spend.

  ### Phase 5: Investment History vs. Future Utility

  You asked where the theory breaks. It breaks on the definition of "Recoverable."
  In standard decision theory, "sunk" means unrecoverable financial capital.
  In political economy, "sunk" capital often converts into **political capital**.

  When the UK government kept funding Concorde through the 70s, they were exchanging financial capital for political capital (domestic jobs in aerospace, international standing).
  If a minister says, "We must continue because of what we've invested," the SCF theorist hears: "I am irrational."
  But the Political Economist hears: "I have invested political credibility in this project. Abandoning it now depreciates my political capital with the engineering constituency and our French allies."

  The "cost" isn't just money; it's the credibility spent selling the project to the public in 1962. Quitting in 1973 realizes that loss of credibility. Continuing delays the realization of that loss and offers a chance to convert the narrative from "Failure" to "Heroic Endeavor."

  ### Conclusion: The Verdict on the Fallacy

  So, for your seminar, here is the line I would draw:

  1.  **The Fallacy holds** if the agents believed the *commercial* returns would magically appear to justify the past spend. If they thought, "Eventually ticket sales will cover the £500m already spent," they were deluded. That is pure SCF.
  2.  **The Fallacy fails** if the agents recognized the commercial death but consciously opted to subsidize a **public good** (prestige/tech base) that was only producible due to the prior investment.

  The error in the standard "Sunk Cost" critique of Concorde is that it assumes a static utility function. It assumes the goal was always profit. Once you allow that the goal shifted from *profit maximization* to *loss minimization on prestige assets*, the decision to continue becomes a constrained optimization problem, not a cognitive error.

  The sunk costs weren't the *reason* for the action; they were the *constraint* that made the alternative (quitting) more costly in terms of political and diplomatic utility. The theory breaks when it treats "sunk costs" as purely financial history, ignoring that in statecraft, history is an asset class. You don't spend money to finish Concorde because you spent money on it; you spend money to finish it because having spent the money makes finishing it the only way to salvage *any* value from the situation.

  Does that distinction land? It shifts the debate from "irrational attachment to the past" to "rational management of path dependency."
