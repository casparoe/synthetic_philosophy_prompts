prompt: |-
  I'm on a small risk team at a payments company, and we've been asked to respond to a regulator's consultation on "run-resistant" deposit account design — the idea being that maybe you can change the plumbing of a retail deposit account so that a run is harder to start. Two colleagues and I keep argueing in circles about it, so I wanted an outside read. The case I keep coming back to is Northern Rock in the UK in September 2007: the bank had funded long-term mortgages with short-term wholesale borrowing, credit markets seized up, it asked the Bank of England for emergency liquidity support on 14 September, the news got out, and within about a day there were the famous photos of people queing around the block to pull their savings. It ran for several days, the government ended up guaranteeing the deposits, and the bank was nationalized in February 2008 — reportedly the first British bank in something like 150 years to fail by way of a bank run. (I'm fairly confident about those facts, but if any specific detail is load-bearing for your analysis, say so rather than quietly building on it.)

  What I want is a two-way analysis. First, take the standard rational-herding / information-cascade picture — agents acting in sequence, each holding a small private signal about some fixed underlying state, each able to observe what earlier agents did, and the possibility that after some point the public record swamps private information and everyone just copies — and map it carefully onto Northern Rock. Who exactly are the players (branch depositors? online depositors? wholesale counterparties? the media?), what counts as the private signal versus the public one, and what is the state they're uncertain about? Is the physical queue itself the signal later depositors were reading, and does it matter for the model that queueing is a costly and highly visible action in a way that moving money in a banking app is not? Which features of the episode does the cascade model explain beautifully — the suddenness, the self-feeding quality, the fact that it started before anyone had hard news about the balance sheet — and where does it start to misdescribe what happened? My own hunch, which I'd like you to pressure-test, is that the model is in real trouble here: in a bank run the variable you're unsure about isn't a fixed state of the world, because whether the bank actually fails partly depends on how many other people run. That looks much closer to a coordination problem with strategic complementarities (the Diamond–Dybvig style story) than to a pure inference problem, which would mean Northern Rock isn't really a confirmation of the cascade model at all but a case it was never designed for. Tell me if that's right, and if it is, what the cascade framework still contributes once you've admitted that.

  The part I actually care about, though, is using the episode to adjudicate three design ideas we've been kicking around — and, more importantly, to figure out whether the cascade lens is even the right one for judging them. (1) Lag the disclosure: don't publish real-time withdrawal data; publish yesterday's aggregate flows, so nobody can watch the queue form while it's forming. (2) Pro-rata clearing inside a short window rather than first-come-first-served, so the early runners don't get out in full while the late ones eat the loss. (3) A "stay bonus": the deposit insurer pre-commits to paying something like 2% on balances to depositors who do not withdraw during a declared stress window, conditional on the bank surviving. For each one, tell me what the model says it does to the incentives, what it does to the information structure, and what Northern Rock specifically suggests about whether it would have worked. And be honest about where the theory goes silent — for instance, a lot of the private signal in a real run isn't about solvency at all, it's about whether you need rent money, and I want to know whether any of these tweaks do anything for that kind of depositor or whether they just make the run slower and nastier without breaking it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **User Context:** Small risk team at a payments company. Responding to a regulator's consultation on "run-resistant" deposit account design.
      *   **Core Task:** Two-way analysis of the Northern Rock (2007) bank run using Information Cascade theory vs. Coordination Game (Diamond-Dybvig) theory, and then applying these frameworks to evaluate three specific design proposals.
      *   **Specific Case:** Northern Rock (Sept 2007). User provides specific facts (wholesale funding, BoE support announcement, queues, guarantee, nationalization). *Constraint:* If any fact is load-bearing, verify it. (The facts provided are generally accurate and consistent with historical record).
      *   **Part 1: Theory Mapping:** Map rational-herding/information cascade models onto Northern Rock.
          *   Identify players, signals (private vs. public), and the "state."
          *   Analyze the physical queue as a signal (costly/visible).
          *   Evaluate what the cascade model explains well vs. where it fails.
          *   Address the user's hunch: Is this actually a coordination problem (Diamond-Dybvig) rather than pure inference (Cascade)?
          *   Determine the value of the cascade framework if the coordination view is dominant.
      *   **Part 2: Design Evaluation:** Evaluate three specific proposals using the episode and the theory.
          *   (1) Lagged disclosure (hide real-time flows).
          *   (2) Pro-rata clearing (remove FCFS incentive).
          *   (3) "Stay bonus" (incentivize holding).
          *   *Requirements:* Incentive effects, information structure effects, Northern Rock applicability, and limitations (e.g., liquidity needs vs. strategic runs).

  2.  **Part 1: Theory Mapping (Northern Rock & Cascades vs. Coordination)**

      *   *Facts Check:* Northern Rock relied heavily on securitization/wholesale funding (approx 75%). BoE support announced Sept 14, 2007. Queues started Sept 15. Guarantee announced Sept 17 (full guarantee). Nationalized Feb 2008. *Verdict:* User's facts are solid. No need to correct, just build on them.
      *   *Cascade Model (Bikhchandani, Hirshleifer, Welch - BHW):* Agents act sequentially. Observe predecessors. Private signal + Public history. If history is strong enough, ignore private signal.
      *   *Mapping to Northern Rock:*
          *   *Players:* Retail depositors (branch & online). Wholesale lenders (earlier run, actually). Media/Analysts (signal amplifiers).
          *   *State:* Solvency/Liquidity of Northern Rock.
          *   *Private Signal:* Personal financial health, trust in bank, news consumption, observation of local branch.
          *   *Public Signal:* BoE announcement (Sept 14), Media coverage, *The Queue*.
          *   *The Queue:* This is crucial. In digital banking, actions are hidden. In 2007, actions were physical. The queue *is* the public history. It makes the cascade visible.
      *   *User's Hunch (Coordination vs. Cascade):* The user is largely right.
          *   *Cascade:* "I think the bank is bad because you are withdrawing." (Inference about fundamentals).
          *   *Coordination (Diamond-Dybvig):* "I think the bank is bad *because you are withdrawing*, which makes the bank bad." (Self-fulfilling prophecy).
          *   *Nuance:* Northern Rock was a mix. The wholesale run was fundamental (asset quality/subprime exposure). The retail run was triggered by the *announcement of support*, which signaled weakness (stigma). This looks like inference (Cascade). However, once the queue started, it became strategic (FCFS).
          *   *Verdict:* It's not *either/or*. It's a "Global Game" (Morris & Shin). Uncertainty about fundamentals + Strategic complementarity. The Cascade model explains the *speed* and *tipping point* of the retail reaction to the news. The Coordination model explains the *mechanics* of the insolvency once the run started.
      *   *Value of Cascade Lens:* Even if it's coordination, the *trigger* is often informational. The cascade lens helps understand how public signals (news, queues) overwhelm private confidence.

  3.  **Part 2: Design Evaluation**

      *   *Proposal 1: Lagged Disclosure (Hide real-time flows).*
          *   *Theory:* Breaks the "public signal" of the cascade. If I can't see others withdrawing, I rely on my private signal. Slows the cascade.
          *   *Northern Rock:* The queue was the real-time disclosure. Hiding branch counts might have helped, but the *news* of BoE support was the real trigger.
          *   *Limit:* Doesn't stop the fundamental trigger (BoE news). Might create panic due to opacity ("Why are they hiding data?").
      *   *Proposal 2: Pro-rata Clearing (End FCFS).*
          *   *Theory:* Removes strategic complementarity. If I run, I don't get priority. No incentive to be first. Converts run to a waiting game.
          *   *Northern Rock:* FCFS was the driver of the queue. If people knew they'd get 50% now and 50% later regardless of when they asked, the queue vanishes.
          *   *Limit:* Liquidity needs. If I need rent *now*, pro-rata doesn't help me. Also, might trigger a run *earlier* if people fear the window closing.
      *   *Proposal 3: Stay Bonus (Pay to wait).*
          *   *Theory:* Changes payoff matrix. Increases cost of running.
          *   *Northern Rock:* Might have calmed the crowd, but 2% is small compared to 100% loss fear.
          *   *Limit:* Adverse selection. Only those confident stay. Those who know bad news run. Also, funding cost for the bank increases during stress.

      *   *The "Liquidity Need" Constraint:* The user specifically asked about depositors who need rent money.
          *   Cascade/Coordination models assume strategic actors.
          *   Real world has *exogenous* liquidity shocks.
          *   Design (2) and (3) punish liquidity shocks. Design (1) doesn't help them.
          *   *Honesty Check:* None of these fix the "I need rent" problem. They only fix the "I think others will run" problem.

  4.  **Drafting the Response:**

      *   *Tone:* Professional, analytical, peer-to-peer (risk team context). Acknowledge the sophistication of the prompt.
      *   *Structure:*
