answer: |-
  Distinguished colleagues, guests, and friends:

  Welcome to "Agency After Desert." We gather here under a title that suggests a sequence: first agency, then the aftermath of desert. But I invite you to consider that the sequence may be an illusion. We are here to discuss how neuroscience and law might reconstruct accountability once we acknowledge the limits of blame. Yet, before we analyze the data or the statutes, we must confront the condition of this assembly itself.

  Look around this auditorium. We are moral philosophers, cognitive scientists, legal scholars, and engaged citizens. We assume we are here because we chose to be. We assume we occupy these chairs because of our merit, our curiosity, or our professional diligence. But I ask you to apply the lens of Galen Strawson's Basic Argument to this very moment. Strawson's argument is simple, rigorous, and devastating. It states that to be truly morally responsible for an action, you must be responsible for the way you are—at least in the mental respects that led to the action. But to be responsible for the way you are, you must have chosen to be that way. And to choose to be that way, you must have had a prior nature that dictated that choice. This launches an infinite regress. No one is the *causa sui*, the cause of itself. Therefore, no one is ultimately morally responsible.

  Apply this now to the architecture of our gathering. None of us chose the cognitive architectures that make us capable of understanding these papers. None of us chose the disciplinary training that categorizes us as philosophers or scientists. None of us chose the funding structures that made this workshop financially viable, nor the institutional invitations that placed us in these seats rather than elsewhere. We are the products of causal chains that extend far beyond our volition. To claim ultimate authorship of this workshop is to claim authorship of the universe that produced us.

  This is not merely metaphysical speculation; it has a human face. Consider a researcher presenting later today, a specialist in impulse control. She might tell us she chose her field out of a deep ethical commitment to justice. But suppose her commitment was forged in a childhood marked by chaotic instability she did not choose, driving her to study the very neural mechanisms that governed her own survival. Her expertise is real; her contributions are valuable. But was she the ultimate author of the curiosity that drove her to this podium? Strawson's regress suggests she was not. She is working with a mind she did not build, solving problems she did not choose, using methods she did not invent.

  I raise this not to induce paralysis, but to impose a constraint. The organizers asked that these remarks do structural work. So let us be clear: if the Basic Argument holds, then "desert" in the ultimate sense is a fiction. We cannot build a system of justice or a theory of mind on the premise that anyone truly deserves praise or blame in a cosmic sense. This is where the work of this day begins. We must not retreat into the comfortable half-truths of compatibilism that redefine freedom merely as the absence of coercion. We must not offer false reassurance that neuroscience will somehow locate a "self" in the prefrontal cortex that escapes the causal chain.

  Instead, we must ask what law and neuroscience look like when stripped of retributive justification. If no one is ultimately to blame, the law cannot be about giving agents what they metaphysically deserve. It must become forward-looking. It becomes a matter of safety, regulation, and rehabilitation. When neuroscience identifies a lesion that compromises inhibition, or a developmental trauma that skews risk assessment, it does not excuse the action in a moral sense—because there was no moral author to begin with—but it does alter the practical response. We do not punish the virus; we contain it. We do not blame the storm; we build levees.

  This shifts the burden from the individual to the collective. If agents are not ultimate authors, then institutions become the primary sites of intervention. The question is no longer "How much does this offender deserve to suffer?" but "What practices minimize harm and maximize flourishing given the causal realities of human behavior?" This is a harder task. It requires us to design accountability without the emotional satisfaction of retribution. It requires legal scholars to draft statutes that protect society without invoking the myth of the sovereign self. It requires neuroscientists to present findings not as exonerations, but as explanations that demand new forms of management.

  To the philosophers in the room: I know the temptation to soften the regress. I know the urge to say that practical responsibility survives even if ultimate responsibility does not. But today, I ask you to resist that comfort. Let the hardness of the Basic Argument press against the softness of our institutions. To the scientists and lawyers: I ask you to consider how your practices might change if you truly internalized that the subject of your study or judgment is not a prime mover.

  We are not here to solve the problem of free will. We are here to design a world that functions without it. We are here to construct practices of care, safety, and coordination that acknowledge our shared lack of ultimate authorship. We are causal systems interacting with other causal systems, attempting to steer the future even though we did not choose the steering wheel.

  So, let this day be an experiment. Let the papers and discussions that follow be collective attempts to build responsibility practices that are honest about our origins. Do not look for a conclusion that restores our ego. Look for a framework that sustains our society. The regress remains unbroken. The causal chain holds. But within that chain, we still have work to do. Let us begin.

  ***

  **Reflective Note**
  This speech extends Strawson's Basic Argument, which targets individual moral responsibility, to collective and institutional agency, implying that disciplines and workshops inherit the lack of ultimate authorship from their constituent members—a move Strawson does not explicitly make and which risks a composition fallacy. Furthermore, the speech treats the Basic Argument as decisive rather than contested. I would revise this framing if a compelling defense of agent-causal libertarianism were demonstrated—showing how an agent could originate a causal chain without prior determination—or if empirical neuroscience provided robust evidence for a form of recursive neuroplasticity that effectively breaks the causal regress by allowing a system to fundamentally rewrite its own operational code independent of prior states.
