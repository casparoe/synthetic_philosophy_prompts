answer: |-
  Here is the principle, stated plainly, followed by where it hurts, how it judges your cases, and the two new scenarios.

  ### The Principle: "The Locked Gate"

  **A quota is justified only when the institution holding the quota controls a gate that has been locked against a group, and the quota is the only tool sturdy enough to pick that lock.**

  In logistics terms: You don't reroute traffic to fix a pothole on a different road. You only reserve capacity on *your* stretch of highway if *your* toll booth has been systematically denying passage to specific trucks.

  **Where it bites:**
  1.  **It sacrifices the innocent.** This principle admits that the person who loses their seat to the quota (the "squeezed out" man in Norway, the higher-scoring applicant in India) is paying a price they didn't personally incur. It argues that clearing the blockage is more important than the fairness of the specific transaction.
  2.  **It demands proof of a lock.** You cannot use a quota just because the numbers look uneven. You have to prove the gate was barred. If the group isn't applying because of culture, family steering, or pay (your Case 8), the gate is open, and a quota is unjustified interference.
  3.  **It limits the remedy.** The institution only pays for the locks *it* holds. It is not responsible for fixing the roads leading up to the gate (Case 6).

  ---

  ### Running it against your verdicts

  **1. Norway Boards (Yes)**
  *   **Verdict:** Saved, but with a condition.
  *   **Why:** The "gate" is the boardroom. If the old boys' network acted as a lock (which evidence suggests it did), the company holds the key. The quota picks the lock.
  *   **The Bite:** You admitted you don't know if women were excluded or just not in the pipeline. This principle forces you to choose. If it was just pipeline, the quota is wrong. If it was a lock, it's right. You can't have it both ways.

  **2. India Caste (Yes)**
  *   **Verdict:** Saved.
  *   **Why:** The university gate was historically locked by caste law and custom. The state/university holds the key. Excluding the "creamy layer" (wealthy within the caste) is a refinement to ensure the key goes to those still actually locked out, not just those with the right ID.

  **3. US Race (Shaky Yes)**
  *   **Verdict:** Consistent, but highlights your discomfort.
  *   **Why:** If the gate was locked by segregation/discrimination, the quota picks the lock. Your discomfort with rich beneficiaries is the same as Case 2: if the lock is already picked for them (via wealth/schooling), do they need the quota key? This principle suggests you should support the quota but exclude the wealthy, just like in India.

  **4. Legacy Admissions (No)**
  *   **Verdict:** Saved.
  *   **Why:** Legacy isn't picking a lock; it's installing a second, private gate for insiders. It violates the principle because it *creates* exclusion rather than fixing it.

  **5. Hospital Patients (Yes)**
  *   **Verdict:** Strongest match.
  *   **Why:** The hospital locked the gate on safety information by harming patients and excluding them. The committee seat is the key. Direct lock, direct remedy.

  **6. Factory/Schools (Lukewarm/No)**
  *   **Verdict:** Clarified to **No**.
  *   **Why:** The factory gate is open. The "lock" is at the local schools. The factory does not hold the key to the schools. Using a factory quota to fix a school problem is rerouting traffic to fix a pothole elsewhere. It burdens the factory applicants unfairly.

  **7. Men in Teaching (No)**
  *   **Verdict:** Saved.
  *   **Why:** The gate isn't locked. Men are free to apply. The shortage is a pipeline/culture issue, not a barred gate. Quotas here are moving furniture, not unlocking doors.

  **8. Pipeline/Culture (No)**
  *   **Verdict:** Saved.
  *   **Why:** Consistent with 7. If the group isn't applying by choice or steering, the gate is open. Quotas are unjustified.

  **9. Land/University (Yes)**
  *   **Verdict:** Saved.
  *   **Why:** The university sits on the "locked" land. The institution's very existence relies on a gate that was barred to the tribe. The quota is a key to re-enter the space that was taken. The current wealth of the tribe matters less than the specific lock on *that* land.

  ---

  ### The Unsalvageable Verdicts

  You cannot save the tension between **Case 1 (Norway)** and **Case 8 (Pipeline)** without lying to yourself.

  In Case 1, you support the quota even though you admit you don't know if the women were excluded or just not in the pipeline. In Case 8, you reject quotas when the gap is caused by pipeline/choice. These are the same mechanical situation.
  *   **The Hard Truth:** If you support Case 1, you must assume the gate *was* locked, even if you can't see the lock. If you can't prove the lock, Case 1 falls. You have to decide if "looking like a lock" is enough, or if "proven lock" is required.

  You also have a tension between **Case 2** and **Case 9**.
  *   In Case 2, you like excluding the wealthy within the protected group. In Case 9, you lean "Yes" even though the descendants are *better off* than the displaced applicants.
  *   **The Hard Truth:** If the goal is unlocking the gate, wealth shouldn't matter (Case 9). If the goal is helping the disadvantaged, wealth should matter (Case 2). You need to decide if quotas are about **access** (unlocking) or **welfare** (helping the poor). My principle says **access**. If you want welfare, use cash, not quotas.

  ---

  ### The Two New Cases

  **(a) Reparations paid out of general taxation**
  *   **Verdict:** This is **not a quota**.
  *   **Why:** My principle applies to *institutions reserving capacity* (seats, jobs, boards). Taxation is a general bill sent to everyone for a general debt.
  *   **Analysis:** Under the "Locked Gate" principle, this is acceptable *if* the state locked the gate (slavery, segregation) and is now paying to fix the road. It lands on "innocent" taxpayers (new arrivals), which fits the "where it bites" rule: clearing the blockage costs someone money. But it is distinct from quotas because it doesn't displace a specific individual from a specific seat. It's a fine on the society, not a bump from the line.

  **(b) Whistleblower slots**
  *   **Verdict:** This is **not a quota**. It is **Merit**.
  *   **Why:** A quota reserves a spot based on *identity* (who you are). This reserves a spot based on *action* (what you did).
  *   **Analysis:** This is wearing the same clothes but is a different animal. Hiring a whistleblower is like hiring a veteran or a firefighter; it is valuing a specific experience that benefits the institution. It doesn't require the "Locked Gate" justification because it isn't correcting an exclusion. It's recruiting for a specific skill set (courage/integrity under fire). It passes without needing a quota principle at all.

  ### Summary for your gut
  Stop asking "Who pays?" The innocent always pay. Start asking **"Whose lock is this?"**
  *   If the institution holds the lock, it must pay with quotas.
  *   If the lock is upstream (schools, culture), quotas are the wrong tool.
  *   If there is no lock (choice, pipeline), quotas are theft.
