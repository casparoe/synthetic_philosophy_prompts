answer: |-
  # The Co-op Norms/Conventions Working Paper
  **Prepared for the General Meeting (Fortnightly Vote)**
  **Submitted by the Rota Committee (Adversarial Collaboration Sub-group)**

  ## 1. Agreed Claims
  *Both theoretical positions endorse the following substantive claims regarding the current state of the house.*

  1.  **The Newcomer Deficit:** The arrival of new members systematically degrades the "common knowledge" required for unwritten rules to function. What was obvious to founding members is opaque to newcomers, regardless of whether the rule is a convention or a norm.
  2.  **Sanctions Exist:** Non-compliance (e.g., leaving dishes, noise after 23:00) reliably triggers negative social sanctions (dirty looks, passive aggression, explicit admonishment) from existing members.
  3.  **Codification Changes Behaviour:** Writing a rule down alters the psychological status of the rule for at least some members, shifting motivation from "doing what is done" or "doing what is right" to "complying with the text."
  4.  **Stability is Fragile:** The current system relies on a critical mass of compliance. If compliance drops below a certain threshold (approx. 75%), the unwritten system collapses regardless of its theoretical classification.
  5.  **Arbitrariness is Limited:** While many rules (which side of the sink to dry) are arbitrary, others (milk contribution) involve distribution of burdens where "arbitrary" solutions are perceived as unfair.

  ## 2. Disagreements Table

  | Topic | Convention-First Formulation (Lewisian) | Norms-First Formulation (Normativist) | Real or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | We comply because we expect others to comply, and we prefer coordination to non-coordination. | We comply because we believe others expect us to comply *and* that we ought to, subject to sanction. | **Real.** Disagreement on whether "ought" is reducible to "prefer to coordinate." |
  | **Effect of Writing** | Writing it down risks freezing an arbitrary equilibrium, preventing organic shifts if circumstances change. | Writing it down clarifies the normative expectation, reducing ambiguity and legitimising sanctions. | **Real.** Disagreement on whether rigidity is a bug (Conv) or a feature (Norm). |
  | **The 'Milk' Problem** | Milk rotation is an iterated coordination game; fairness emerges from long-term self-interest. | Milk rotation is a fairness norm; compliance is owed regardless of immediate self-interest. | **Real.** Disagreement on whether fairness is instrumental or intrinsic. |
  | **Definition of 'Norm'** | A norm is just a convention that has been labelled as such; the underlying mechanism is coordination. | A convention is a subclass of norm; without normative expectation, it is merely habit. | **Verbal.** Fight over the definition of the word "norm." Irrelevant to practice. |
  | **Newcomer Responsibility** | Newcomers fail because they lack access to the common knowledge signal. | Newcomers fail because they have not been socialised into the normative community. | **Verbal.** "Common knowledge" vs. "Socialisation" describes the same learning gap. |

  ## 3. Cruxes
  *Sub-questions where empirical evidence could shift position.*

  **Crux A: Does codification increase or decrease goodwill?**
  *   **Agreed Evidence:** A trial period where one rule is written and another remains unwritten, measuring resentment levels via anonymous survey.
  *   **Convention Prediction:** Written rules will increase resentment (perceived as legalistic/distrustful).
  *   **Norms Prediction:** Written rules will decrease resentment (perceived as clear/fair).

  **Crux B: Is the Milk problem solvable by coordination alone?**
  *   **Agreed Evidence:** Track milk buying during a period where "fairness" is explicitly decoupled from "rotation" (e.g., random assignment).
  *   **Convention Prediction:** Compliance will hold if the random assignment is common knowledge (coordination solution).
  *   **Norms Prediction:** Compliance will drop if the assignment is perceived as unfair, regardless of common knowledge (normative violation).

  **Crux C: The Sanction Threshold**
  *   **Agreed Evidence:** Observe whether sanctions are applied more readily to written vs. unwritten violations.
  *   **Convention Prediction:** Sanctions remain constant; only the focal point changes.
  *   **Norms Prediction:** Sanctions increase for written rules (legitimised) and decrease for unwritten ones (deprecated).

  ## 4. Case Handling

  **1. The Laminated Sheet**
  *   **Convention View:** The sheet is a **focal point**. It solves the "which rota?" coordination problem. It is the *same object* as the unwritten thing, merely made visible. Compliance without reading proves it works as a signal, not a contract.
  *   **Norms View:** The sheet is a **codification**. It transforms a practice into a rule. It is a *different object* because it invites normative judgement ("you broke the rule") rather than social adjustment ("you messed up the flow").
  *   **Collaborative Verdict:** It is a hybrid. It functions as a focal point (Conv) but invites normative sanction (Norm). The risk is that it stops being a reminder and starts being a weapon.

  **2. The Phantom Convention (Quiet Hours)**
  *   **Convention View:** The origin story is irrelevant. Only the current regularity and mutual expectation matter. The false story is just noise.
  *   **Norms View:** The origin story matters because it sustains the *legitimacy* of the norm. If members discover the vote never happened, the normative force ("we agreed to this") collapses, even if the regularity remains.
  *   **Collaborative Verdict:** The false story is a vulnerability. If discovered, it weakens the Normative claim but leaves the Convention intact. Writing it down now cements the regularity regardless of the false history.

  **3. The Milk (Sucker Payoff)**
  *   **Convention View:** This is not a pure coordination problem; it is a Prisoner's Dilemma. Convention alone cannot solve this without iteration and trust. It requires a "meta-convention" of reciprocity.
  *   **Norms View:** This is precisely where norms are required. Coordination equilibria cannot explain why people pay when they could free-ride. A fairness norm is irreducibly normative.
  *   **Collaborative Verdict:** The Convention account is insufficient here. This specific rule *needs* normative force (fairness) to work. Writing this down may help justify the "ought."

  **4. Pluralistic Ignorance (The Back Door)**
  *   **Convention View:** If everyone prefers *not* to lock up but does so anyway, it is **not a convention** (by definition, you must prefer to conform given others conform). It is a dysfunctional equilibrium.
  *   **Norms View:** It **is a norm**. Norms often persist despite private resentment because the sanction (social ostracisation) outweighs the private cost.
  *   **Collaborative Verdict:** This is the danger zone. If the house is in pluralistic ignorance, writing the rule down forces the ignorance into the open. It might break the dysfunctional pattern (good) or cause mass rebellion (bad).

  ## 5. Falsification & Evidence

  **What would make the Convention-First side give up?**
  If a written handbook demonstrably *improves* coordination efficiency without increasing interpersonal conflict or reducing flexibility. Specifically, if newcomers integrate faster *and* old members do not report feeling "policed."
  *   **Survey Requirement:** Must show higher satisfaction scores on "clarity" without lower scores on "community atmosphere."

  **What would make the Norms-First side give up?**
  If writing the rules down fails to generate normative force. Specifically, if members treat the handbook as descriptive advice rather than prescriptive obligation, and sanctions do not increase for written violations.
  *   **Survey Requirement:** Must show that violations of written rules are treated no differently than violations of unwritten practices.

  **Is there a settle-all experiment?**
  Yes. A **Sunset Clause**. Write the handbook for six months with a mandatory review. Both sides can agree to this: the Convention side knows it can be ripped up (flexibility), the Norms side knows it exists formally for now (clarity).

  ## 6. Recommendation to the House

  **Regarding the Vote on the Handbook**

  Both theoretical positions agree that the current ambiguity is unsustainable given the influx of new members. The "Convention" side acknowledges that common knowledge is broken; the "Norms" side acknowledges that normative expectations are unclear. Therefore, **both sides recommend voting YES to producing a document**, but with specific constraints to mitigate the respective risks.

  The document should not be framed as a "Rulebook" (which triggers the Convention fear of rigidity and legalism) nor as a "Manifesto" (which triggers the Norms fear of vagueness). It should be titled **"Current House Practice."**

  1.  **Descriptive not Prescriptive:** Phrase rules as "We currently do X" rather than "You must do X." This satisfies the Convention view (describing the equilibrium) while retaining enough normative weight for the Norms view (establishing common knowledge).
  2.  **The Milk Clause:** Explicitly acknowledge the fairness norm here. This is the one area where coordination fails without normative force. Write this down clearly.
  3.  **The Sunset Clause:** The document expires in 12 months unless renewed. This preserves the organic nature of the co-op (Convention) while allowing for a period of stabilisation (Norms).
  4.  **Newcomer Process:** The handbook must be accompanied by a verbal walkthrough by a current member. Writing it down is not enough; the normative socialisation must still occur face-to-face.

  **Verdict:** Write it down, but keep it temporary and descriptive. This solves the newcomer problem without killing the community. Vote **Yes**, with amendments.
