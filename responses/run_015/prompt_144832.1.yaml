  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** A 40-person housing co-op is arguing about whether to write down unwritten rules into a handbook.
      *   **Conflict:** Two philosophical positions are driving the argument:
          *   *Convention-first (Lewisian):* Unwritten patterns are coordination equilibria. Writing them down might kill the organic nature.
          *   *Norms-first (Normativist):* Real norms require normative expectations + sanction readiness. Coordination isn't enough. Writing them down clarifies obligations.
      *   **Task:** Produce a document representing an "adversarial collaboration" between these two positions, specifically applied to the user's house situation.
      *   **Constraints:**
          *   No reading list/citations (no library access).
          *   British English.
          *   Max half-page for the final recommendation.
          *   Specific sections required:
              1.  Numbered Agreed-Claims Section (non-vacuous).
              2.  Disagreements Table (row per disagreement, phrased twice, marker for real vs. verbal).
              3.  Cruxes Section (sub-questions, agreed evidence, predictions).
              4.  Four Specific Cases (Laminated Sheet, Phantom Convention, The Milk, Pluralistic Ignorance).
              5.  Falsification/Evidence Against Section (what would make each side give up).
              6.  Final Recommendation (max half-page).
      *   **Tone:** Philosophical but grounded in the specific housing co-op context. Practical enough to help with the vote.

  2.  **Deconstruct the Philosophical Positions (for application):**
      *   *Lewisian Convention:* Focus on regularity, coordination problem, arbitrary alternative, common knowledge. It's descriptive/functional. Writing it down might change the common knowledge structure or rigidity.
      *   *Normativist Norm:* Focus on "ought", sanctioning, normative expectation. It's prescriptive/social. Writing it down might solidify the "ought" or make it legalistic.
      *   *The Tension:* Is the house running on *coordination* (we do X because others do X) or *obligation* (we do X because it's right/others expect it)? Does codifying change the nature of the bond?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a collaborative document. "The Co-op Norms/Conventions Working Paper."
      *   **Agreed Claims:** Need to be substantive. Not "people live here." More like "Sanctions exist," "Coordination matters," "Newcomers lack knowledge."
      *   **Disagreements Table:** Needs dual phrasing.
          *   *Example:* Is the rule binding because it's useful (Conv) or because it's right (Norm)?
          *   *Verbal vs. Real:* Often the fight is about whether "norm" includes "convention."
      *   **Cruxes:** What empirical fact would change minds?
          *   *Example:* Does writing it down increase compliance or decrease goodwill?
      *   **The Four Cases:**
          1.  *Laminated Sheet:* Is it a prop for common knowledge (Conv) or a statement of obligation (Norm)?
          2.  *Phantom Convention:* Does origin matter? Lewis says regularity matters. Normativist says the *belief* in legitimacy matters.
          3.  *The Milk:* Prisoner's dilemma/Assurance game vs. Fairness norm. Lewis struggles with non-coordination equilibria unless iterated. Normativist says fairness is the norm.
          4.  *Pluralistic Ignorance:* If everyone hates it, is it a norm? Normativist says yes (sanctions exist). Lewis says no (prefer not to conform).
      *   **Falsification:** What kills the theory?
          *   *Conv:* If writing it down *improves* coordination without killing flexibility.
          *   *Norm:* If writing it down *fails* to create obligation despite sanctions.
      *   **Recommendation:** Needs to be a compromise. Maybe a "living document" or a hybrid approach.

  4.  **Refining the Content (Self-Correction/Iterative Thinking):**
      *   *Check:* Did I use British English? (e.g., "programme," "centre," "whilst," "fortnight").
      *   *Check:* Is the philosophy accurate enough for a layperson/ex-philosopher? Don't get bogged down in *Convention* (1969) details, but keep the spirit (arbitrariness, common knowledge).
      *   *Check:* Is the tone right? Not condescending, but analytical.
      *   *Check:* The "Disagreements Table" needs to be clear. One column for the disagreement topic, two for the phrasing, one for verbal/real.
      *   *Check:* The Four Cases need specific answers from the "collaboration" perspective, not just listing the theories. They need to show where the theories converge or diverge on the *specific* house issue.
      *   *Check:* The Recommendation must be actionable for the vote in two weeks.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Agreed Claims:* 1. Newcomers lack common knowledge. 2. Sanctions (dirty looks) happen. 3. Writing changes perception.
      *   *Disagreements:* 1. Source of motivation (utility vs. ought). 2. Effect of codification (rigidity vs. clarity). 3. Definition of 'norm'. (Likely verbal on definition, real on effect).
      *   *Cruxes:* 1. Will sanctions increase or decrease if written? 2. Is the milk problem coordination or fairness?
      *   *Cases:*
          1.  Sheet: Conv says it's a focal point. Norm says it's a contract.
          2.  Phantom: Conv says origin irrelevant. Norm says belief in legitimacy is key.
          3.  Milk: Conv says iterated game. Norm says fairness obligation.
          4.  Ignorance: Conv says not a convention (prefer not to). Norm says still a norm (sanctions exist).
      *   *Falsification:* Conv: If written rules work *better* than unwritten. Norm: If written rules create *no* extra obligation.
      *   *Recommendation:* Write the basics (coordination stuff), leave the culture (normative stuff) unwritten but discussed. Or: Write it as "Current Practice" not "Rules."

  6.  **Final Polish:**
      *   Ensure the distinction between "Convention-first" (Lewisian) and "Norms-first" (Normativist) is maintained throughout.
      *   Make sure the "Verbal vs. Real" distinction in the table is insightful.
      *   Keep the recommendation concise and practical.
      *   Check word count/length constraints (specifically the half-page max for the recommendation).

  7.  **Writing the Document:** (Proceeding to generate output based on these thoughts).
      *   *Note on Philosophy:* Lewis defines convention as a solution to a coordination problem where there is an alternative. Normativists (like Bicchieri or Searle-ish views) emphasize the "ought" and sanctions. I need to make sure the "Milk" case handles the "Prisoner's Dilemma" aspect vs Coordination aspect carefully. Lewis handles PD via iteration/trust, but Normativists say fairness is a separate norm.
      *   *Note on Tone:* Empathetic to the stress of the house meeting.

  8.  **Review against constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   Four cases handled? Yes.
      *   Sections included? Yes.
      *   Recommendation max half-page? Yes.

