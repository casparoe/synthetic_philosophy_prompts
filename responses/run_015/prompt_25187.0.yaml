answer: |-
  You have hit on one of the central problems in the philosophy of technology and digital ethics. Your intuition is spot on: this isn't the "Paradox of Fiction" (which is about passive emotion), it's about **agency, ownership, and investment.**

  Here is the breakdown of the terminology, the philosophical tension, and how to determine if your friend is inconsistent or just operating on a different layer of reality.

  ### 1. Is there a name for this tension?

  There isn't one single Latin phrase, but there are three concepts that map exactly onto what you are describing.

  **A. Digital Dualism (The Sociological Term)**
  Coined by sociologist Nathan Jurgenson, this is the most accurate label for your friend's mindset. **Digital Dualism** is the fallacy that the "physical" and the "digital" are two separate realities with different rules.
  *   **The Dualist View:** Physical things are "real" (atoms, flesh); digital things are "fake" (bits, pixels).
  *   **The Tension:** Jurgenson argues this is false because our digital lives have real physical consequences (emotions, labor, economics). Your friend is a *pragmatic digital dualist*: they use the dualism to dismiss the ontology ("it's just code") but abandon it when it suits their emotions ("but I'm sad").

  **B. Ontological Irrealism vs. Normative Realism (The Philosophical Term)**
  This is the technical description of the split.
  *   **Ontological Irrealism:** The belief that virtual objects do not exist in the fundamental fabric of reality (they are dependent on servers, electricity, etc.).
  *   **Normative Realism:** The belief that actions regarding those objects carry real moral weight (it is *wrong* to destroy them).
  Your friend is an **Ontological Irrealist** but a **Normative Realist**. The tension arises because usually, normative weight follows ontological status (we don't have moral duties to holograms, usually).

  **C. The "Gamer's Dilemma" (The Ethical Term)**
  Philosopher Morgan Luck formulated *The Gamer's Dilemma*, which asks why virtual murder is often considered acceptable in games, but virtual pedophilia is not. If "it's just code," both should be fine. If "it causes harm," both should be wrong. Your friend is running into a variation of this: **The Virtual Property Dilemma.** If it's not real, why does stealing it feel like theft?

  ### 2. Is your friend inconsistent?

  Strictly logically? **Yes.**
  If $X$ is not real, then damage to $X$ cannot be real damage. To claim $X$ is unreal but harm to $X$ is real is a category error.

  **However**, in philosophy, we often try to "steelman" a position (make it as strong as possible) before calling it inconsistent. There are three coherent philosophical frameworks that allow your friend to hold both views without contradiction. If you argue using these, you might find he is actually a **Virtual Realist** without knowing it.

  #### Argument A: The Lockean Labor Theory (It's not the object, it's the time)
  John Locke argued that you own something because you mixed your labor with it.
  *   **The Coherent Position:** The *pixels* are not real/valuable. But the *hours of life* your friend spent arranging them are real.
  *   **The Resolution:** When a hacker wipes a character, they aren't destroying "fake stuff"; they are destroying **real time**. The harm is not to the database entry; the harm is to the *person's invested life energy*. This reconciles the "it's just code" view with the "I'm crushed" feeling. The code is the vessel; the labor is the value.

  #### Argument B: The Extended Mind Thesis (It is part of the self)
  Philosophers Andy Clark and David Chalmers argue that our tools (notebooks, phones, avatars) are literal extensions of our cognitive processes.
  *   **The Coherent Position:** A Minecraft build or a high-level RPG character is not an external object; it is an **externalized part of the self**.
  *   **The Resolution:** Destroying the build is not like kicking a rock; it is like damaging a prosthetic limb or burning a diary. It doesn't matter that the material is "fake"; the *connection to the agent* makes it real. The harm is real because the *self* is partially constituted by that virtual object.

  #### Argument C: Institutional Facts (Money is fake too)
  Philosopher John Searle distinguished between "Brute Facts" (mountains, atoms) and "Institutional Facts" (money, borders, marriage).
  *   **The Coherent Position:** A dollar bill is just cotton and linen blend with ink on it. Ontologically, it's worthless. But socially, it is real because we agree it is.
  *   **The Resolution:** Virtual items are **Institutional Facts**. They are real within the "institution" of the game/community. To say "it's not real" is like saying "money isn't real, it's just paper." It *is* real within the system of value we have collectively created. Your friend recognizes the institutional reality (hence the moral outrage) while fixating on the brute reality (hence the "just code" comment).

  ### 3. How to talk to him about it

  If you want to close the loop on that three-hour argument, you can point out that he is suffering from **Digital Dualism**.

  He is using the "it's not real" argument as a **shield** (to dismiss things he doesn't care about or to sound objective), but he lives as a **Virtual Realist** (acknowledging that digital labor and digital identity have weight).

  The most coherent way to state his position isn't "Virtual objects aren't real." It is:
  > *"Virtual objects are ontologically dependent on physical hardware, but they are normatively real because they embody human labor and identity."*

  If he agrees with that, he admits the objects are "real" in the only way that matters for ethics. If he disagrees, then yes, he is simply inconsistent. But given his emotional reaction to his Minecraft builds, he's likely a **Virtual Realist** who hasn't updated his vocabulary.

  **Summary for your next argument:**
  Tell him he's committing the **Digital Dualist fallacy**. He thinks reality requires *atoms*, but human experience proves reality requires *meaning*. Since his builds have meaning, labor, and social connection, they are real. The code is just the substrate, like neurons are the substrate for a thought. You can't hold a thought in your hand, but that doesn't mean thoughts aren't real.
