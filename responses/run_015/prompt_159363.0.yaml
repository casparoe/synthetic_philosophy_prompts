answer: |-
  Here is a complete design for your ninety-minute simulation, including rules, roles, timeline, debrief, and a frank assessment of limitations and failure modes.

  # Seminar Simulation: The Bottleneck Protocol

  ## 1. Materials and Room Setup
  *   **Room:** Arrange desks into four distinct zones.
      *   **Zone A (Periphery):** 10 desks clustered together, facing away from the center.
      *   **Zone B (The Gateway):** 1 desk in the middle, between Periphery and Center.
      *   **Zone C (Downstream):** 4 desks clustered together.
      *   **Zone D (The Voice):** 1 desk at the front, facing the class (but unable to see Zone A).
  *   **Handouts:** One envelope per student containing role-specific instructions (see below). One "System Log" sheet for the Spokesperson. One "Private Log" card for each Module.
  *   **Projector:** Used only to display the "Stimuli" (images/words) for 3 seconds per round.
  *   **Physical Props:** Index cards (different colors for different zones), pens, a loud timer, a whiteboard for scoring.

  ## 2. Roles and Information Asymmetry (16 Students)
  Do not use philosophical terms. Use the following functional labels.

  **A. The Voice (1 Student)**
  *   **Function:** The only person allowed to speak aloud.
  *   **Input:** Receives cards stamped by *The Gateway*.
  *   **Output:** Must verbally report the content of those cards to the class/instructor.
  *   **Constraint:** Cannot speak about anything not on a stamped card. Cannot see Zone A (Periphery).
  *   **Incentive:** Earns **System Points** for every verbal report that matches the Instructor's Master Key.

  **B. The Gateway (1 Student)**
  *   **Function:** The bottleneck.
  *   **Input:** Receives all cards from *The Modules*.
  *   **Output:** May select **only one** card per round to stamp and pass to *The Voice*.
  *   **Constraint:** Must discard or hold all other cards. Cannot speak.
  *   **Incentive:** Earns **System Points** (shared with Voice) for accurate reports.

  **C. The Modules (10 Students)**
  *   **Function:** Peripheral processors.
  *   **Input:** Each receives a unique stimulus (projected or on a card) per round.
  *   **Output:** Must write the content on a *Private Log* card and pass it to *The Gateway*.
  *   **Constraint:** Cannot speak. Cannot see what other Modules received.
  *   **Incentive:** Earns **Module Points** for every *Private Log* that matches the stimulus, *regardless* of whether The Gateway broadcasts it. (This creates the tension: The System wants consistency; the Modules want fidelity to their private input).

  **D. The Downstream (4 Students)**
  *   **Roles:** *Memory, Reasoning, Action, Archive.*
  *   **Function:** Receive copies of broadcasted cards.
  *   **Special Rule (Condition 2):** In specific rounds, *The Gateway* may pass a "Shadow Token" to *Action* or *Reasoning* without telling *The Voice*.
  *   **Incentive:** Earn points if the System functions coherently.

  ## 3. The Three Conditions (Rounds)
  You will run three distinct rounds. Each round lasts 15 minutes (5 min stimulus/logging, 5 min processing, 5 min report/scoring).

  **Round 1: The Silent Channel (The Overflow Claim)**
  *   **Stimulus:** Project 10 distinct, complex images (one for each Module).
  *   **Mechanic:** The Gateway is instructed to select the *least* clear image to broadcast.
  *   **The Kicker:** The 9 Modules whose images were *not* broadcast must still fill out their Private Log. On the log, there is a checkbox: *"Did you experience the content?"* They must check "Yes."
  *   **Result:** The Voice reports one image. The Instructor reveals the Master Key shows 10 images existed. The 9 silent Modules hold logs saying "I saw it" but have no public record.

  **Round 2: The Faint Signature (The Blindsight/Prime Claim)**
  *   **Stimulus:** Modules receive directional cues (e.g., 7 get "Left", 3 get "Right").
  *   **Mechanic:** The Gateway blocks all cards from The Voice. The Voice reports "No Data."
  *   **The Kicker:** The Gateway passes a tally count to *Downstream: Action*. Action must make a forced choice (Press Left or Right Button) based on the majority of blocked cards.
  *   **Result:** The System acts "Left." The Voice says "We acted Left." When asked "Why?", The Voice must say "I don't know; no data was broadcast." The Modules hold cards proving why the action happened, but the Voice cannot access that reason.

  **Round 3: The Decay (The Retrospective Confidence Claim)**
  *   **Stimulus:** Modules receive a list of 10 words for 3 seconds.
  *   **Mechanic:** Immediate Log: Modules write down every word they recall *immediately*.
  *   **Delay:** 10 minutes of other activity.
  *   **Final Log:** Modules write down what they are *confident* they saw.
  *   **Result:** Compare Immediate vs. Final logs. Usually, the number of words drops (loss of richness), but the confidence rating stays high or increases (confabulation). The Voice only gets the Final Log.

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:10: Setup & Sealing.**
      *   Students enter, sit in zones. Hand out envelopes.
      *   **Rule:** "You are not students today. You are components. Components do not talk out of turn. Components do not look at other zones. Violation crashes the system."
      *   Instructor acts as "System Monitor."

  *   **00:10 – 00:25: Round 1 (Silent Channel).**
      *   Project stimuli. Modules log. Gateway selects one. Voice reports.
      *   **Crucial Step:** Collect the 9 silent Private Logs. Do not show them to the Voice.

  *   **00:25 – 00:40: Round 2 (Faint Signature).**
      *   Run the bias mechanic. Voice reports action but denies knowledge of cause.
      *   Collect Downstream reasoning sheets.

  *   **00:40 – 00:55: Round 3 (Decay).**
      *   Run the immediate vs. delayed log.
      *   While Downstream processes, Instructor tallies scores on the whiteboard visibly.

  *   **00:55 – 01:05: The Scoring Conflict.**
      *   Reveal the points.
      *   **System Score:** Likely low (because Gateway blocked rich data).
      *   **Module Score:** Likely high (because they accurately logged what they saw, even if blocked).
      *   Ask the class: "Who won? The System or the Modules?" Let them argue for 5 minutes.

  *   **01:05 – 01:30: The Debrief.**
      *   (See below).

  ## 5. The Debrief: Mapping Game to Philosophy
  Do not lecture immediately. Use the Socratic method to draw the map from their experience.

  **Step 1: Naming the Architecture (5 mins)**
  *   Ask: "What did we call the Voice?" -> *Access Consciousness / Report.*
  *   Ask: "What did we call the Modules?" -> *Phenomenal Consciousness / Experience.*
  *   Ask: "What did we call the Gateway?" -> *Global Workspace / Attention.*
  *   Write these terms on the board now.

  **Step 2: Mapping Round 1 (The Overflow Argument) (10 mins)**
  *   **Question:** "In Round 1, the 9 silent Modules had accurate logs. The Voice had no record. Did the system contain that information?"
  *   **Philosophical Map:** This is the **Overflow Argument** (Block, Lamme). The Modules argue: "We had the experience (Private Log), even if the Voice couldn't say it." The Voice argues: "If I can't say it, it didn't happen for the *Subject*."
  *   **Point to Hit:** The stalemate exists because the Modules define consciousness as *local registration*, while the Voice defines it as *system-wide availability*.

  **Step 3: Mapping Round 2 (The Signature Argument) (10 mins)**
  *   **Question:** "In Round 2, the System moved Left. The Voice said 'I don't know why.' Was the content 'Accessed'?"
  *   **Philosophical Map:** This is **Blindsight / Subliminal Priming**.
  *   **Point to Hit:** The Access theorist says: "See? The Voice couldn't report it, so it wasn't conscious access. It was just causal processing." The Phenomenal theorist says: "But it influenced behavior! There was a 'faint signature.' Maybe access isn't all-or-nothing."
  *   **Key Insight:** Point out that the debate often turns on the definition of "Access." Is it *reportability* (Voice) or *influence on reasoning/action* (Downstream)? Your game separated these.

  **Step 4: Mapping Round 3 (The Evidence Problem) (10 mins)**
  *   **Question:** "In Round 3, your confidence went up while your detail went down. Which log is the truth?"
  *   **Philosophical Map:** This is the **Meta-Cognitive / Confidence Problem** (Lau, Rosenthal).
  *   **Point to Hit:** We rely on the Voice (report) to judge the Modules (experience). But the Voice is working off a decayed, confabulated log.
  *   **Key Insight:** The stalemate is evidential. The Access theorist says, "I can only trust the Voice." The Phenomenal theorist says, "The Voice is a unreliable narrator of the Modules."

  ## 6. Troubleshooting: What Will Go Wrong
  You are correct to anticipate failure modes. Here is how to handle them.

  **1. The "Leaky Bottleneck" (Cheating)**
  *   **Problem:** A Module turns around and whispers to the Voice. Or the Gateway passes two cards.
  *   **Fix:** You must be the "System Monitor." Walk the room. If a rule is broken, stop the simulation immediately. Say: "System Crash. Resetting." Do not be polite. The seriousness of the "crash" reinforces the reality of the bottleneck.
  *   **Prevention:** Seat the Voice with their back to the Modules. Use physical barriers (backpacks on chairs) if needed.

  **2. The "Giggling Collapse"**
  *   **Problem:** Students treat it as a game of "pass the note."
  *   **Fix:** Frame the incentives seriously. "The System Score determines a small bonus point for everyone. If the System crashes, no one gets the point." (Even if you don't actually give the point, the *possibility* creates buy-in).
  *   **Fix:** Assign the most serious students to the Voice and Gateway roles. They set the tone.

  **3. The "Meta-Game"**
  *   **Problem:** Students realize the Modules *are* conscious humans and argue, "Of course I saw it, I'm a person!"
  *   **Fix:** This is actually a feature, not a bug, but you must control it. When they say this, write it on the board. "This is exactly the problem. In the game, you are conscious. In the theory, the Module is a *sub-personal state*. The game fails to model the hard part: whether a sub-personal state can be 'phenomenal' without a person attached." (See Limitations below).

  ## 7. Limitations: What This Simulation Cannot Do
  You asked for frankness. You must deliver this section clearly in the final 5 minutes, or the students will leave with the wrong idea.

  **1. The Homunculus Problem**
  *   **The Flaw:** In your game, every Module is a conscious undergraduate. In Global Workspace Theory, the "Modules" are neural circuits, not little people.
  *   **The Fix:** Tell them: "The game simulates the *structure of the evidence*, not the *metaphysics*. In reality, we don't have 10 little students in our head. We have one subject. The debate is whether parts of that one subject's processing can be 'conscious' without the whole subject knowing. The game forces you to *act* as if you are fragmented, but you aren't really."

  **2. The Definition of "Access"**
  *   **The Flaw:** In the game, Access = Speaking. In philosophy, Access = Availability to *any* downstream system (memory, belief, etc.).
  *   **The Fix:** Acknowledge that Round 2 tried to model non-report access, but admit that report is the only public proof we have. "The game shows why Access Theorists rely on report: it's the only data the Spokesperson can verify."

  **3. The Stalemate is Built-In**
  *   **The Flaw:** The game creates a stalemate because the rules prevent the Voice from seeing the Module logs.
  *   **The Fix:** Explain that this *is* the philosophical problem. "The Access Theorist says the Module Log doesn't exist (or doesn't matter) if the Voice can't read it. The Phenomenal Theorist says the Log exists and the Voice is just blind to it. You felt that frustration in Round 1. That frustration *is* the debate."

  ## 8. Instructor Script for the "Hard Part"
  *Read this or something like it during the debrief:*

  > "Here is the truth about this simulation: It cheats. Every one of you playing a Module is a conscious human being. You *know* you saw the image. So, for you, there is no gap between 'experience' and 'access.' You experienced it, and you had access to it privately.
  >
  > But in the real debate, the question is whether a *brain state* can be phenomenal without being accessed. We cannot simulate that, because we are not brain states; we are people.
  >
  > So, what did we learn? We learned why the argument is a stalemate. The Access Theorist is playing the role of the Spokesperson: 'If I can't report it, verify it, or use it, I have no scientific reason to believe it exists.' The Phenomenal Theorist is playing the Module: 'I have immediate evidence of my own state that outruns my ability to report it.'
  >
  > You felt the tension between those two incentives. That tension is not a puzzle we can solve with a better experiment. It is a conflict between two different definitions of what counts as evidence for consciousness. Today, you didn't solve the hard problem. You embodied the reason it remains hard."
