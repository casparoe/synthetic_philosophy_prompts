      *   *Roles (16 students):*
          *   1 Spokesperson (The "Report" mechanism).
          *   1 Central Executive/Router (The "Bottleneck/Gatekeeper").
          *   10 Peripheral Modules (The "Sensory/Phenomenal" inputs).
