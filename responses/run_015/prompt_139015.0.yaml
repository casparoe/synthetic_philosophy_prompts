  ### Tier Sorting and Boundaries

  **Clean (80–100):** Cases 6, 8.
  **Mildly Defective (50–79):** Case 9.
  **Seriously Defective (20–49):** Cases 4, 5, 7.
  **Void (0–19):** Cases 1, 2, 3, 10.

  **Boundary Analysis:**
  The boundary doing the most real work is between **Void** and **Seriously Defective** (19/20). This distinguishes *coercion* (where the agent creates the threat that forces the choice, nullifying agency) from *defective information or scope* (where agency is exercised but impaired). Cases 1, 2, 3, and 10 fall into Void because the consent either arises from a wrongful threat or is entirely absent; Cases 4, 5, and 7 involve agents who consented, but the terms were violated or obscured. The boundary between **Seriously Defective** and **Mildly Defective** (49/50) marks the shift from material violations of bodily integrity or truth (Cases 4, 5, 7) to internal impairments of judgment that leave understanding intact (Case 9). The **Clean** threshold (80) separates technical or background complaints that do not undermine the core transaction (Cases 6, 8) from those that do.

  **Ties:**
  Cases 3 and 10 both score **0** on Transformative Force. In Case 3, consent is present but nullified by coercion; in Case 10, consent is absent entirely. Both result in no deontic change, warranting a tie despite the mechanistic difference.

  ### Divergence Flags (>25 points)

  *   **Case 1 (75 pts):** Consent is voided by coercion, but the agent is highly blameworthy for creating the threat.
  *   **Case 2 (85 pts):** Similar to Case 1; the coercive nature nullifies consent, but the moral fault lies entirely with the proposer.
  *   **Case 3 (100 pts):** Maximum divergence; consent is worthless, and the agent is maximally blameworthy.
  *   **Case 4 (45 pts):** Consent is significantly defective regarding risk, but the surgeon's blame is tempered slightly by institutional script adherence (though still high).
  *   **Case 5 (60 pts):** Consent is undermined by silence, yet the landlord is highly blameworthy for the deliberate concealment.
  *   **Case 6 (75 pts):** Consent is largely valid (high TF), but the recipient bears almost no blame because the deviation was standard and harmless.
  *   **Case 8 (70 pts):** Consent is valid (high TF) despite the harsh background, but the employer is minimally blameworthy because they did not create the injustice.
  *   **Case 10 (40 pts):** Consent is null (0 TF), but blame is reduced significantly by the defense of necessity.
  *   **Case 9 (30 pts):** Consent is weakened by fatigue, but blame is lower if the recipient was unaware of the impairment.

  *(Case 7 does not flag, as the divergence is only 5 points.)*

  ### Philosophical Weight and Disagreement

  **Most Weighty Distinction:**
  The distinction carrying the most weight in this ordering is **Agent-Relative Coercion vs. Circumstantial Hardship** (seen primarily in the gap between Cases 1/2/3 and Case 8). This determines whether a "hard choice" invalidates consent. If the threat is created by the proposer (Cases 1, 2, 3), consent is void; if the threat is background nature or society (Case 8), consent remains valid. This baseline problem drives the largest shifts in Transformative Force.

  **Expected Disagreement:**
  Professional philosophers would disagree most sharply about **Case 8 (Unjust Background)**. Libertarians and some liberals argue consent is valid if the proposer doesn't worsen the baseline (high TF), while egalitarians and exploitation theorists argue the background injustice taints the transaction regardless of the proposer's innocence (lower TF). This is the central debate in non-coercive exploitation.

  **Unspecified Factual Detail:**
  In **Case 1 (Withheld Assistance)**, the existence of a **moral duty of rescue** is left unspecified. If Dev has no duty to push the car, his condition is a valid offer (TF ≈ 90); if he has a duty of easy rescue, it is a coercive threat (TF ≈ 15). This single normative fact flips the case from Clean to Void.
