  ### Margin Comments

  **Part (a)**

  *   *"Suppose the second player has a winning strategy — call it S."*
      **Right.** Standard opening for contradiction.
  *   *"The first player makes any old first move... plays the rest of the game using S, pretending that first stone isnt his."*
