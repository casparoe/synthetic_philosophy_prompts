answer: |-
  This is not rambling; this is the exact fault line where bioethics, law, and metaphysics collide. You are grappling with what philosophers call the **Problem of Precedent Autonomy**.

  Your intuitions are actually more coherent than you think, but they rely on a distinction you haven't explicitly named: **Competence as the Switch.**

  Here is an analysis of your cases, the principle that binds them, the verdict you might need to sacrifice, and the prediction for your sixth case.

  ### The Unifying Principle: "The Trustee Model"
  Your gut is rejecting the idea that an advance directive (AD) is a **binding contract** (the "Ulysses Pact"). Instead, your intuitions align with the **Trustee Model**.

  In this view, the past self appoints the future self (or their proxies) as a *trustee* of their values. However, a trustee's authority is limited by the welfare of the beneficiary (the current self).
  *   **If the current self is competent:** The trusteeship is dissolved. The current self owns the body.
  *   **If the current self is incompetent:** The trustee (the AD) acts, *but only insofar as it serves the current self's experiential interests.*

  This framework is heavily influenced by the debate between Ronald Dworkin (who argued "critical interests" of the past self rule) and Rebecca Dresser (who argued "experiential interests" of the present self rule). Your gut is siding with Dresser, with a competence caveat.

  ### Analyzing Your Cases

  **Case 1 (Smiling Dementia) & Case 2 (Suffering Dementia)**
  *   **Status:** Incompetent.
  *   **Verdict:** Treat Case 1, Withhold in Case 2.
  *   **Consistency:** High. Since the patient cannot speak, we look to their *current experiential welfare*.
      *   In Case 1, the current being has an interest in continuing (smiles, food). The AD is a document written by a "stranger" (psychological discontinuity). Overriding it serves the current being's welfare.
      *   In Case 2, the current being has an interest in relief. Honoring the AD aligns with beneficence.
  *   **Principle:** When incompetent, the AD is a guide to values, not a suicide note. If reality contradicts the AD's assumptions (i.e., "I thought dementia would be hell, but it's not"), the AD yields to current welfare.

  **Case 3 (Locked-In Syndrome)**
  *   **Status:** **Competent.** (He communicates, writes poems, expresses fear).
  *   **Verdict:** You are torn.
  *   **The Fix:** To be consistent with your principle, **you must honor the current request.**
  *   **Why:** If the patient is competent, the AD is legally and ethically moot. A competent adult can refuse treatment even if they previously said they wouldn't. The 25-year-old does not own the 45-year-old.
  *   **The Sacrifice:** You need to throw out the "torn" feeling regarding the *contract*. The poetry and music are relevant only to assess his *current* decision-making capacity (is he depressed? coerced?). If he is competent and says "I want out," the past self's directive is irrelevant. The conflict isn't Past vs. Present; it's Present Ambivalence. But if he maintains the request, Present Autonomy wins.

  **Case 4 (Forged Revision)**
  *   **Status:** Competent.
  *   **Verdict:** Honor original/check for manipulation.
  *   **Consistency:** This is the one place your intuition wobbles legally, though it's ethically sound.
  *   **The Fix:** If she is **competent**, the original AD is also moot. She can revoke an AD with a verbal statement in many jurisdictions. The forgery matters only because it clouds our understanding of her *current* will. If she is competent and asks for X, we do X. The "original directive" shouldn't matter unless you suspect her *current* competence is compromised by the son's manipulation.
  *   **Refinement:** Your intuition here is actually about **Authenticity**, not the AD. You want to ensure the *current* request is hers. If it is, the AD (old or forged) doesn't matter.

  **Case 5 (False Positive Biomarker)**
  *   **Status:** Incompetent/Silent.
  *   **Verdict:** Trust doctors/Ignore literal text.
  *   **Consistency:** High. This confirms your ADs are about **Intent**, not Literalism. The "contract" was "Don't let me enter State Y." The test says "State Y," but the doctors say "Not State Y." Honoring the intent means ignoring the false trigger. This aligns with Case 1: The AD assumes a reality that doesn't exist.

  ### The Verdict You Might Have to Throw Out
  To keep the account clean, you must resolve **Case 3**.

  Currently, you are treating the AD in Case 3 as a weighty counter-argument to the current self's wish. To be consistent with Case 1 (where the current self's welfare overrode the AD), you must acknowledge that **Competence Trumps Everything.**

  *   **In Case 1:** Incompetent -> Current Welfare wins over AD.
  *   **In Case 3:** Competent -> Current Autonomy wins over AD.

  If you honor the AD in Case 3 despite his competent refusal, you are claiming the past self has *more* authority over a competent adult than they do over a dementia patient. That is inconsistent. You must trust the 45-year-old's eye blinks over the 25-year-old's signature.

  ### Prediction for Case 6 (The "No Revision" Clause)
  **Scenario:** A person writes a directive banning any future revision. They become competent and desperately want to change it.
  **Prediction:** **They can change it.**

  **Reasoning:** This is the logical endpoint of your principle. A competent self cannot be bound by a past self's attempt to limit their freedom. To rule otherwise is to say a person can voluntarily sell themselves into slavery (ethically impermissible).
  *   The "ban on revision" is treated as a *precatory* wish (a strong suggestion), not a binding legal constraint.
  *   If they are competent, the "ban" is void. The very act of wanting to change it proves the "psychological connectedness" to the past self has shifted. The past self tried to legislate from the grave, and the current self has the gavel.

  ### Summary for Your Article
  You aren't being sloppy; you are intuitively applying a **Threshold Theory of Personhood**.

  1.  **Below the Threshold (Incompetent):** The AD is a *proxy* for best interests. It can be overridden if the current being's experience contradicts the AD's assumptions (Case 1 & 5).
  2.  **Above the Threshold (Competent):** The AD is *history*. It provides context, but the current conscious self has absolute veto power (Case 3, 4, 6).

  The tension you feel is the cultural lag between our legal systems (which treat ADs like property deeds) and our moral intuitions (which treat them as letters of intent from a person who may no longer exist).

  Your headline principle: **"The Dead Don't Vote, and Neither Does Your Past Self."** The directive is only valid as long as it serves the human being currently inhabiting the body.
