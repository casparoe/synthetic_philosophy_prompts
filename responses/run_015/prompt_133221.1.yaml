answer: |-
  The clicker felt cold in Mara's palm, a small plastic weight against the sweat gathering there. On the screen behind her, a scatter plot glowed in harsh projector blue. Red dots clustered tightly around a black line that sliced cleanly through the chaos.

  "This is the Zero-Attachment Model," Mara said, her voice steady despite the hum of the ventilation system. "Assumption one: Agents possess no sentimental value for location. Assumption two: Agents possess no loyalty to kin or social network. Assumption three: All movement is strictly cost-benefit optimization regarding housing and income."

  A murmur rippled through the seminar room. It was the standard objection. It was *homo economicus* stripped to the bone, a caricature of human behavior that every sociologist in the room knew was false.

  "We know people aren't robots," Mara continued, clicking to the next slide. This one overlaid her model's predictions with actual census data from post-bereavement migration patterns. The lines matched. Not closely. Perfectly. "When a spouse dies, the surviving partner often moves. We call it grief migration. They can't bear the empty house. They leave the memories."

  She turned to face the room, thirty pairs of eyes tracking her. "My model assumes they feel nothing. It assumes they simply calculate that the maintenance cost of a single-occupancy home outweighs the utility of remaining. No grief. No pain. Just math. And yet, it predicts the move with ninety-four percent accuracy."

  She paused, letting the contradiction settle. "Friedman argued that unrealistic assumptions are permissible if the predictions hold. I'm calling this the reverse F-twist. The assumption isn't just unrealistic; it's the opposite of the truth. We know grief drives this. The model says money drives this. But they arrive at the same destination."

  Dr. Aris Thorne leaned forward in the front row, taking off his glasses. He was the senior chair, the one whose approval mattered for the grant renewal. "You're suggesting the mechanism doesn't matter," Thorne said. "Only the outcome."

  "I'm suggesting the mechanism might be indistinguishable," Mara replied.

  "Or," Thorne said, his voice low, "you're asking us to consider that grief *is* rational. Or perhaps that your unrealistic assumption is hiding a deeper law. If a cold calculation predicts a hot emotion, is the emotion just a story we tell ourselves about the calculation?"

  The room went still. It was a dangerous question. It reduced the visceral agony of loss to a spreadsheet error.

  Mara looked down at her notes, but her eyes drifted to the validation set printed on the top sheet. She hadn't put this on the screen. It was the anonymized training data, the thousands of profiles fed into the algorithm to tune the weights. She knew the codes because she had cleaned the data herself.

  Her eyes caught row 4,092.

  *Subject ID: 884-B.*
  *Variables: Income stagnation, social network decay, housing cost ratio.*
  *Predicted Exit Date: November 2021.*
  *Actual Exit Date: Pending.*

  Mara's breath hitched. 884-B was her. She had used her own data to test the ingestion pipeline, a common practice, though she usually scrubbed it before presentation. She had forgotten to delete this row.

  The model had flagged her for exit three years ago.

  In 2021, she hadn't been grieving. Her husband was alive. Her house was full. She had felt no urge to leave. She had been happy, or so she had told herself. But the model, assuming zero attachment, assuming pure rationality, had looked at the slow decay of her local income potential against the rising cost of the school district and the widening distance between her and her professional network. It had calculated that a rational agent would leave.

  She was packing boxes now, in 2024, following her husband's sudden illness last winter. She told herself she was leaving because the house was too quiet. Because the grief was in the walls. Because she couldn't stay where he had died.

  But the model said she was supposed to leave in 2021.

  Thorne was still waiting for an answer. "Mara? Is grief secretly rational? Or is the math smuggling emotion in through the back door?"

  Mara looked at the screen, at the perfect correlation between the cold line and the red dots. She thought about the boxes in her hallway, labeled *Kitchen* and *Books*. She thought about the relief she felt when she signed the lease on the new apartment, a relief she had attributed to escaping the memories.

  If the model was right, she wasn't leaving because of the death. She was leaving because the numbers had turned against her three years ago, and the grief was just the permission slip she had been waiting for. Or worse, the grief was the variable she couldn't see, masquerading as math.

  "Mara?" Thorne pressed.

  She looked at the timestamp on the prediction again. *November 2021.* Three years before the loss. Three years before the pain. The model hadn't predicted the grief. It had predicted the departure, and she had waited for a reason worthy of the math.

  "I think," Mara said, her voice sounding distant to her own ears, "that the assumption hides the cost of staying."

  She clicked the presenter off. The screen went black, leaving the room in the dim glow of the emergency lights. She didn't answer the question. She let the silence sit between them, heavy and unresolved, while the hum of the ventilation system filled the space where an answer should have been.
