          *   *Bayesian Aggregation:* Averaging priors. But this requires a central aggregator. The proposal is about *individual* decision rules.
          *   *Why Peer-Relativity?* It internalizes the epistemic check. It doesn't ban action; it adjusts the confidence required to act.

      *   **Section 3: Methodology.**
          *   Step 1: Conceptual groundwork. Define "epistemic peer" and "weighting function."
