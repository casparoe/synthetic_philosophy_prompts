answer: |-
  **Title:** Epistemic Restraint: A Peer-Relative Expected Utility Approach to the Unilateralist's Curse

  **1. Research Question and Significance**

  The central research question of this project is: *Can the unilateralist's curse be mitigated by reconceiving individual expected utility as peer-relative, such that agents discount outcomes dependent on outlier risk assessments, without collapsing into paralysis or generic risk-aversion?*

  The unilateralist's curse describes a structural problem in collective action where a group of agents shares the capacity to undertake a specific action independently, but the outcome is determined by the first agent to act. If the action carries a risk of severe collective harm, the curse arises because the agent with the most optimistic risk assessment (or the highest tolerance for uncertainty) is statistically most likely to act first. Consequently, the decision is made not by the median or mean assessment of the group, but by the extreme tail of the distribution. In contexts involving existential risk, such as geoengineering, pathogen research, or advanced AI deployment, this dynamic creates a vulnerability where a single well-intentioned but overconfident agent can impose catastrophic costs on the collective.

  This problem matters because traditional solutions rely on external coordination—treaties, regulations, or binding agreements—which are often slow to implement or impossible to enforce in decentralized environments. If the curse is a function of individual decision-making under uncertainty, the solution may also lie within the structure of individual decision-making. This project investigates whether a normative shift in how agents calculate expected utility can internalize the cost of epistemic deviation. By asking whether an agent *ought* to weight their probability estimates by their standing within an epistemic community, this research seeks to bridge the gap between individual rationality and collective safety. If successful, this approach offers a decision-theoretic tool for agents operating in high-stakes, low-coordination environments, providing a principled basis for voluntary epistemic restraint.

  **2. Limitations of Standard Approaches and the Case for Peer-Relativity**

  To justify the peer-relative approach, one must first demonstrate why standard consequentialist and game-theoretic treatments leave the problem unresolved.

  Standard act-consequentialism evaluates actions based on their expected outcomes. In the unilateralist scenario, an agent calculates the expected utility of acting versus not acting based on their own subjective probability estimates. If an agent genuinely believes the risk is negligible and the benefit is high, standard consequentialism mandates action. The framework lacks a mechanism to penalize the agent for holding a belief that deviates significantly from available expert consensus, provided the agent's internal coherence is maintained. Thus, standard consequentialism inadvertently licenses the behavior that drives the curse; it validates the optimism of the outlier.

  Game-theoretic approaches typically model the curse as a coordination failure or a race. Solutions here usually involve changing the payoff structure through external enforcement or establishing Schelling points for coordination. However, these solutions presuppose the possibility of communication and binding commitment. The unilateralist's curse is most dangerous precisely when these conditions fail—when agents are anonymous, geographically dispersed, or operating in competitive environments where communication is restricted. Furthermore, game theory often treats preferences and beliefs as exogenous inputs. It tells us what happens given certain beliefs, but it does not offer a normative account of how those beliefs should be formed or weighted prior to action.

  One might propose Bayesian aggregation as an alternative, where individual priors are averaged to form a collective posterior. While mathematically robust, this requires a central aggregator or a mechanism for belief sharing that may not exist in the moment of decision. It solves the epistemic problem but fails the agency constraint; it tells a committee how to decide, not an individual acting alone.

  A peer-relative expected utility framework is preferable because it operates at the level of the individual decision rule without requiring external enforcement. It modifies the input of the decision function rather than the environment. The core intuition is that in matters of complex risk, an agent's confidence should be a function not only of their evidence but of their epistemic relationship to relevant peers. If an agent assesses a risk as 1% while the epistemic community assesses it at 20%, the agent lacks sufficient justification to treat their 1% as decisive. By introducing a weighting factor that discounts utility calculations based on deviation from the peer mean, we preserve the agent's agency—they *can* still act—but we raise the evidential bar required to justify unilateral action. This avoids the bluntness of institutional restrictions, which might ban beneficial actions, and avoids the inefficacy of standard EU, which ignores the reliability of the estimator.

  **3. Methodology**

  The project will proceed in three phases, moving from conceptual analysis to formal application and finally to normative evaluation.

  *Phase One: Conceptual Analysis of Peer-Relativity.*
  The first step is to rigorously define "epistemic peer" and "weighting function" within a decision-theoretic context. I will analyze existing literature on epistemic humility and conciliationism to determine how an agent identifies their reference class. The key challenge is to distinguish between legitimate expertise (which justifies outlier status) and unwarranted overconfidence. I will develop a conceptual model where the expected utility of an action is multiplied by a confidence coefficient. This coefficient will be inversely proportional to the statistical distance between the agent's risk assessment and the community median. I will examine whether this weighting should be linear or exponential and what constitutes the relevant "community" (e.g., all scientists, domain experts, or the general public).

  *Phase Two: Application to Canonical Scenarios.*
  Once the conceptual framework is established, I will apply it to two canonical scenarios often used to illustrate the unilateralist's curse. The first will be a geoengineering case, where a single state or corporation could release aerosols to mitigate climate change despite uncertain atmospheric risks. The second will be a biosecurity case involving gain-of-function research. For each scenario, I will construct a comparative analysis: calculating the decision outcome under standard expected utility theory versus the peer-relative model. This will demonstrate whether the peer-relative model successfully filters out actions driven by outlier optimism while permitting actions supported by high-confidence consensus.

  *Phase Three: Normative Justification.*
  Finally, I will address the normative force of the framework. Why *ought* an agent to adopt this constraint? I will argue from the principle of epistemic responsibility: in high-stakes collective contexts, the right to act unilaterally is contingent on the reliability of the judgment. If an agent ignores their deviation from peers, they are effectively treating their own judgment as lexically superior without justification. I will defend the claim that peer-relativity is a requirement of rationality in interdependent contexts, rather than merely a heuristic.

  **4. Success and Failure Conditions**

  A successful result for this project will be the articulation of a clear decision criterion—let us call it the *Principle of Epistemic Restraint*. This principle must satisfy two conditions: first, it must demonstrably reduce the probability of cursed outcomes in the modeled scenarios compared to standard EU; second, it must not be so conservative that it mandates inaction in cases where unilateral action is clearly beneficial (the "paralysis problem"). Success looks like a formal or quasi-formal rule that distinguishes between "legitimate unilateralism" (where the agent has strong, private evidence justifying deviation) and "cursed unilateralism" (where deviation is due to error or overconfidence).

  Failure would take one of two forms. The first is circularity: if the framework requires agents to know the true risk to weight their beliefs correctly, it is useless. The weighting must rely on accessible information about peer consensus, not ground truth. The second form of failure is normative collapse: if the peer-relative weighting simply reduces to a generic risk-aversion heuristic (e.g., "always assume the worst"), it loses its distinct theoretical contribution. It must remain sensitive to the *source* of the uncertainty (epistemic isolation) rather than just the *magnitude* of the risk.

  The project would be considered too large if I attempt to solve the aggregation problem fully. I cannot, in one term, derive a new axiomatic system for social choice theory. Therefore, failure also includes overreach: attempting to prove theorems about convergence or stability that require mathematical tools beyond the scope of a philosophy term paper. The goal is a philosophical defense of a decision rule, not a complete mathematical reconstruction of decision theory.

  **5. Scope Assessment**

  This project is designed to be feasible within a single semester, but it requires strict boundary management.

  *Feasible Scope:* The conceptual analysis of peer-relativity and its application to thought experiments is well-suited to philosophical methodology. I can rely on existing definitions of the unilateralist's curse and focus my energy on the proposed modification to expected utility. The normative argument regarding epistemic responsibility is a standard type of philosophical argument that can be developed through textual analysis and logical reconstruction.

  *Constraints:* I will not attempt to empirically validate the model. I cannot survey epistemic communities to determine actual weighting functions. The "community assessment" will be treated as a theoretical variable. Furthermore, I will not address the political economy of how such a norm would be disseminated or enforced; the project is limited to the normative justification of the decision rule itself.

  *Risk Management:* The primary risk is that the "peer-relative" concept proves too vague to do any work. To mitigate this, I will dedicate the first third of the term to refining the definition of the weighting function, potentially using simple numerical examples to ensure it behaves as intended before writing the philosophical argument. If the formalization proves too difficult, I will pivot to a purely qualitative account of "epistemic discounting," ensuring the core philosophical insight is preserved even if the mathematical precision is reduced.

  In sum, this proposal seeks to contribute a novel normative tool to the philosophy of collective risk. By shifting the focus from restricting the *capacity* to act to refining the *rationale* for acting, it offers a pathway to dissolve the unilateralist's curse that respects individual agency while safeguarding collective interests. The scope is tight enough for a term paper but significant enough to offer a genuine contribution to the ongoing discourse on risk and rationality.
