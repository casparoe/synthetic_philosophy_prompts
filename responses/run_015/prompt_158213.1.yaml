      *Wait, checking the "No Citations" rule again:* "Do not provide a bibliography, reading list, or citations — I will add those myself — though you may refer to established positions and arguments where appropriate." Okay, I can mention "the standard formulation of the unilateralist's curse" without citing Bostrom explicitly. I will avoid names to be safe and stick to "contemporary literature."

