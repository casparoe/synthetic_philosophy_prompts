      *   *The Proposed Solution:* Peer-relative Expected Utility. Instead of $EU = \sum p \cdot u$, maybe $EU' = \sum (w \cdot p) \cdot u$, where $w$ is a weight based on how much the agent's probability assessment ($p$) deviates from the epistemic peer group.
      *   *The Challenge:* Avoiding simple risk-aversion (which might stop good actions) and maintaining normative force (why *should* an agent care about peers?).

