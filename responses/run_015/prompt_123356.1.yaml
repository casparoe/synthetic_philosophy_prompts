prompt: |-
  hey, i sit on the heritage tech review board for the museum district and we vote thursday on funding this installation called the Einstein Codex. its an interactive physical book—pages with sensors, trained on Einsteins letters and the 1955 autopsy notes, structured like that Hofstadter dialogue about Einstein's brain talking from the jar. the curators want it classed as an educational interloctor (our charter literally misspells it that way) rather than a display object, which lets them drop the mandatory non-conscious disclosure after 30 days of familiarization. half the board says its just a fancy book with good NLP, zero consciousness, the warning is bureaucratic overkill. the other half pushes the functional-architecture worry: if the system reproduces belief-forming and responsive patterns well enough, treating it as pure object misses a real category, even if nobody claims its literally sentient. there's also a weird substrate-damage argument floating around—since the books code is specifically engineered to mirror neural integration patterns, altering or destroying it is morally different from burning a regular book, not because the book feels anything but because the substrate is designed as an artificial neural analog. i think thats mostly confused but two board members are genuinely convinced and i need the memo to take it seriously.

  draft the memo i'll circulate before the meeting. recommend approve with conditions, reject, or approve outright—whatever—but include a concrete timeline (like immediate labeling, 90-day review, removal by a certain date) and make the reasoning actually grapple with both the functional-architecture position and that substrate argument. include an honest, non-dismissive treatment of the strongest point on the side you're not recommending. don't ask for citations or a bibliography; just work with the concepts. you can reference the charter typo if it helps ground the recommendation.
