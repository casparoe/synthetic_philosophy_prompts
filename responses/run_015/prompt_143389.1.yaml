answer: |-
  Here is the brainstorming list of the nearest concepts, followed by the detailed analysis you asked for.

  ### Brainstorming Nearest Concepts

  1.  **The Material Conditional:**
      *   *What it covers:* This is the logician's "If P, then Q." It is true whenever P is false or Q is true. It aligns with your mate's intuition that the first sentence ("If he didn't...") is just a fancy "Either he did or the brother did."
      *   *Why it's close but wrong:* It explains why the first sentence feels like a logical deduction without a causal story. However, it completely fails to explain the second sentence. Under the material conditional, "If he hadn't done it, the brother would have" should mean the same thing, but it clearly doesn't. It also fails to capture the "connection" requirement you noticed.

  2.  **The Indicative vs. Subjunctive Distinction:**
      *   *What it covers:* This is the grammatical classification. "If he didn't" is Indicative mood (dealing with facts/open possibilities). "If he hadn't... would have" is Subjunctive mood (dealing with hypotheticals/contrary-to-fact).
      *   *Why it's close but wrong:* This is the correct *label* for the grammatical shift, but it's not an explanation. It tells you *that* they are different categories, not *why* the meaning flips regarding the "connection" or the "hint" that he did it. It's the map, not the terrain.

  3.  **Gricean Implicature:**
      *   *What it covers:* This deals with what is suggested by a sentence without being strictly said. It could explain why "If he hadn't..." hints that he *did* do it (you wouldn't use that form unless you thought it was false).
      *   *Why it's close but wrong:* Implicature is cancellable (you can say "If he hadn't done it... and I'm not saying he did"). But the "connection" requirement you noticed feels harder to cancel. If there is absolutely no link between the husband and the brother, the second sentence sounds nonsensical, not just misleading. This suggests the connection is part of the *meaning* (semantics), not just the *suggestion* (pragmatics).

  4.  **Modal Remoteness:**
      *   *What it covers:* This is the linguistic mechanism where past-tense morphology (did/had/would) is used not to mark past time, but to mark "distance" from reality, certainty, or politeness.
      *   *Why it's close but wrong:* This is the strongest candidate for the underlying engine. It explains why the future case ("If it rained tomorrow") works differently (distance in time/probability, not reality). However, on its own, it doesn't fully carve out the difference between the "falsity hint" and the "connection requirement."

  ***

  ### The Diagnosis: One Mechanism, Two Consequences

  You have identified a real cluster of phenomena, but your intuition that it might be "one phenomenon or several" is the key to the lock. It is **one grammatical mechanism** triggering **two distinct semantic consequences** that usually travel together but can be decoupled.

  The grammatical mechanism is **Modal Remoteness**. In English, we use past-tense morphology (the "had done/would have" form) to signal that the situation is "remote" from the actual world.

  However, "remote" can mean two different things, and this is where your two observations come from:
  1.  **Remote from Reality (Truth):** The situation is not the case. (This creates the "He did it" hint).
  2.  **Remote from Actuality (Causality):** The situation requires stepping into a different world with different laws or circumstances. (This creates the "Connection/Story" requirement).

  Here is the carving of the concepts you need to distinguish.

  #### 1. The Counterfactual Presupposition (The "He Did It" Hint)
  When you use the subjunctive form ("If he hadn't..."), you trigger a **Counterfactual Presupposition**. This is the strong inference that the antecedent (the "if" part) is false.
  *   **What it is:** A semantic or pragmatic commitment that the speaker believes the "if" clause did not happen.
  *   **Why it happens:** You generally don't use the "remote" form unless you are distancing yourself from the truth of the event.
  *   **Boundary Case:** This is cancellable in specific contexts. If I say, "I don't know if he did it, but if he hadn't, the brother would have," the presupposition is weakened, but the sentence becomes slightly marked (awkward). In your true crime case, the presupposition is active because you are discussing a past event where the truth is fixed, even if unknown.

  #### 2. The Dependency Condition (The "Connection" Requirement)
  This is the bit your mate couldn't name. The second sentence demands a **Causal or Nomological Link** between the two halves.
  *   **What it is:** A requirement that in the "nearest possible world" where the husband doesn't do it, there must be a *reason* the brother does.
  *   **Why it happens:** This is the crucial difference between the Indicative and the Subjunctive.
      *   **Indicative ("If he didn't, the brother did"):** This is evaluated based on your *current knowledge*. You know "One of them did it." Therefore, logically, if not A, then B. You don't need a causal story; you just need an exhaustive list. This is an **Epistemic Conditional**.
      *   **Subjunctive ("If he hadn't, the brother would have"):** This is evaluated by mentally *changing the world*. You have to imagine a world where the husband didn't do it. In that world, does the brother automatically do it? Only if there is a mechanism (a conspiracy, a shared motive, a backup plan). Without that story, the brother doing it is just a coincidence in that hypothetical world, and "would" is too strong a claim. "Would" implies necessity across that change.
  *   **Boundary Case:** "If I had dropped this glass, it would have broken." The connection is gravity/physics. "If I had dropped this glass, my dog would have barked." This requires a story (the dog is here, the dog is sensitive). If the dog is at the vet, the sentence is false, even if the glass breaking is true.

  ### Addressing Your Bullet Points (The "Misbehaving" Cases)

  You asked if these are the same phenomenon. They are all instances of **Modal Remoteness**, but the "Remoteness" is targeting different things.

  *   **Future Stuff ("If it rained tomorrow..."):**
      *   Here, the "past tense" morphology does *not* signal Remote from Reality (Counterfactual). It signals **Remote from Certainty**.
      *   "If it rains" (Indicative) = I treat this as a live possibility.
      *   "If it rained" (Subjunctive/Remote) = I treat this as less likely, or I am being tentative.
      *   *Why no falsity hint?* Because the event hasn't happened yet. It can't be false yet. The "Remoteness" is about probability, not truth.

  *   **"Even If" ("Even if he hadn't done it..."):**
      *   This is a **Concessive Conditional**. It explicitly blocks the **Dependency Condition**.
      *   You are saying: "In the nearest world where he didn't do it, the consequent (he knew about it) *still* holds."
      *   *Why the flip vanishes:* The word "even" tells the listener *not* to look for a causal link where the antecedent causes the consequent. It asserts the consequent is robust regardless of the antecedent.

  *   **Swapping "Would" for "Might" ("...the brother might have"):**
      *   This weakens the **Dependency Condition**.
      *   "Would" claims that in the nearest world where the husband didn't do it, the brother *necessarily* does. That requires a strong story.
      *   "Might" claims that in that world, it is *possible*. This requires a much weaker story (maybe the brother was just present and angry).
      *   *Effect on Falsity Hint:* "Might" also weakens the Counterfactual Presupposition. It sounds more like speculation ("I don't know if he did it, but if not, the brother is a candidate") rather than a confident reconstruction of a false past.

  *   **Offer-Type Sentences ("If you wanted a beer..."):**
      *   Here, Modal Remoteness signals **Social Distance (Politeness)**.
      *   "If you want" = Direct, assumes the desire is real and present.
      *   "If you wanted" = Remote, gives the listener an "out." It pretends the desire is hypothetical so you don't feel pressured.
      *   *Why it's not an offer:* "There'd be one in the fridge" sounds like a description of a hypothetical state of affairs, not an invitation to access the actual fridge. It pushes the whole scenario into the "remote" zone, including the availability of the beer.

  *   **Questions ("If he hadn't done it, who would have?"):**
      *   This presupposes the **Counterfactual Presupposition** (He did it) and asks you to fill in the **Dependency Condition** (What is the alternative causal chain?).
      *   It sounds like a different question because the Indicative version ("If he didn't... who did?") is an open inquiry into the facts. The Subjunctive version ("If he hadn't... who would have?") is a speculative inquiry into alternative histories, usually implying the actual history is settled.

  ### The Verdict and The Terminology

  Your mate was half-right about "Irrealis." In linguistics, **Irrealis** is the mood used for things that haven't happened or aren't true. English doesn't have a dedicated Irrealis verb form; we use the **Modal Past** (using past tense forms for non-past meanings) to do the work.

  However, there isn't a single single-word term for the specific *flip* you noticed (the simultaneous shift in falsity-hint and connection-requirement). In the literature, these are treated as separate components of **Counterfactual Semantics**.

  Since you asked me to coin a term if a piece of this genuinely has no established name, I will define the specific interaction you are spotting. The phenomenon where the shift to subjunctive morphology simultaneously triggers a presupposition of falsity *and* raises the threshold for the causal link between antecedent and consequent is best described as:

  **The Counterfactual Tightening**

  *   **Definition:** The semantic shift occurring when an indicative conditional is converted to a subjunctive/counterfactual form, resulting in (1) the antecedent being presupposed false (or remote from reality) and (2) the requirement for the antecedent-consequent relationship shifting from *epistemic compatibility* (consistent with what we know) to *causal dependency* (necessitated by the change in the world).
  *   **What counts:** Your true crime example. "If Oswald didn't kill Kennedy, someone else did" (Indicative: Logical deduction from the fact someone was shot) vs. "If Oswald hadn't killed Kennedy, someone else would have" (Counterfactual Tightening: Implies Oswald did, and implies a conspiracy/necessity that someone else was lined up).
  *   **What doesn't count:** "Even if" sentences. These trigger the falsity presupposition but explicitly *cancel* the causal dependency requirement. Therefore, they are not instances of Tightening; they are instances of **Concessive Remoteness**.

  ### Summary for Your Argument

  1.  **The "Either/Or" Claim:** Your mate is right about the first sentence (Indicative). It functions as an **Epistemic Conditional**. It relies on what you *know* (one of them did it). It does not require a causal story.
  2.  **The "Story" Demand:** The second sentence (Subjunctive) is a **Counterfactual Conditional**. It relies on *possible worlds*. To say the brother *would* have done it, you need a causal mechanism that survives the shift to that other world.
  3.  **The "He Did It" Hint:** This is the **Counterfactual Presupposition**. It comes from the grammar marking the scenario as "Remote from Reality."
  4.  **Why they travel together:** Both the Presupposition and the Story Demand come from the same grammatical source (**Modal Remoteness**). When you mark a sentence as "Remote," you imply it's not true (Presupposition) and that you are simulating a different world where rules must apply (Story Demand).
  5.  **Why they separate:** In your bullet points (Future, Offers, Even If), the "Remoteness" is repurposed for Probability, Politeness, or Concession, which is why the standard "Counterfactual Tightening" doesn't fully apply.

  You aren't lost; you've correctly identified that the "If P, Q" structure is not a single logical tool, but a multi-purpose interface that changes its underlying code depending on the tense and mood markers you plug into it.
