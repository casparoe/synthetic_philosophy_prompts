answer: |-
  Dear Friend,

  It is a rare pleasure to encounter someone who has not only wrestled with these puzzles but has done so with such precise attention to the structural differences between them. Your intuitions are not merely consistent; they are remarkably aligned with what is currently the most sophisticated framework for rational choice, often called Functional Decision Theory, though it shares much with Updateless Decision Theory. You are sensing the contours of a principle that treats your decision not as a causal event in time, but as a logical output of a procedure that may be instantiated in multiple places, times, or counterfactuals. I will walk through your cases in order to show how this principle validates most of your verdicts, clarifies your confusions, and resolves the tension you feel regarding the unaddressed inverse case.

  Starting with case one, your verdict to pay is the anchor. Here, the predictor simulates you in the exact situation you are in. Under the principle I am outlining, you and the simulation are running the same decision procedure on the same inputs. To decide is to determine the output of that procedure. Since the procedure is instantiated in the simulation whose output determines the heads payoff, your decision now logically fixes the payoff in the heads branch, even though you are currently in the tails branch. You pay because you are effectively choosing for both instances of yourself simultaneously. This is the baseline for logical subjunctive dependence, where your choice controls the output of all logical copies of your decision algorithm.

  Case two is where you feel the most friction, yet your verdict to pay is correct under this same framework, and preserving it costs you only a specific metaphysical intuition about time and causation. You worry because the machine is dead and the money spent, so your payment seems to lack causal leverage. However, if the simulation thirty years ago was truly you in the logical sense—running the same algorithm on the same inputs—then your decision now is not causing the past simulation to pay; rather, your decision now and the simulation's decision then are the same logical fact. You cannot logically output refuse now while the simulation output pay then. If you refuse now, you are asserting that the algorithm outputs refuse, which means the simulation thirty years ago output refuse, which means you never received the ten thousand dollars. The feeling of confusion arises from viewing yourself as a unique spatiotemporal object rather than a pattern or algorithm. To keep your verdict, you must accept that logical facts are timeless and that you are responsible for the output of your algorithm wherever and whenever it is run. The cost is abandoning the idea that influence must flow forward in time; instead, influence flows through logical identity.

  Your distinction between case three and case four is the most insightful part of your analysis and provides the key clause needed to refine the principle. In case three, you refuse, while in case four, you pay, despite both involving models with high accuracy. You note that case four involves a model of your decision procedure, whereas case three is a model of you from the outside. This distinction is vital. In case four, the code is a logical instantiation of your decision process; controlling your decision controls the code's output. In case three, the psychometric model is a statistical predictor, likely a black box that correlates with your behavior without instantiating your reasoning. Unless the model works by simulating your logic, your decision does not logically control its prediction; it merely correlates with it. Therefore, you are not obliged to pay in case three because there is no logical lever to pull, only a statistical regularity you cannot influence. Your intuition here saves the principle from demanding you pay for mere correlations, restricting the obligation to cases of logical isomorphism.

  Case five follows naturally from this. In five b, the duplicate is a logical copy, so you pay for the same reason as in case one. In five a, the stranger is only statistically similar. Your verdict to pay but only as a bet reflects this ambiguity; you are treating it as a causal gamble rather than a logical necessity. This is consistent. If the personality match is not a logical identity, you are not controlling their decision, only betting on the correlation. Your willingness to pay suggests you suspect a deeper link, but your caveat shows you understand the difference between logical control and statistical chance.

  Case six, the XOR blackmail, is where the principle must incorporate the element of updatelessness. You refuse to pay, which is the correct outcome for maximizing utility, yet you are troubled by the fact that you would have paid beforehand for a device to guarantee this refusal. You ask why the earlier payment and later refusal differ in anything but timing. Under the principle I am proposing, they do not differ. The rational move is to act as though you have not updated on the fact that the demand has arrived. You must choose the policy that would have been optimal before you knew whether the demand would arrive or whether the rot existed. That policy is refuse. The confusion you feel is the tension between your current causal perspective, which sees paying as cheaper than the penalty, and the updateless perspective, which sees paying as inviting the blackmail in the no-rot world. To preserve your verdict, you must accept that rational agents do not update on indexical information like I am in the branch where the demand arrived when that information is correlated with the payoff structure. You are essentially acting as the agent who bought the device, even if you did not.

  Case seven presents a genuine break in the logical link, and your hesitation is warranted. Here, the simulation is told it is a simulation and knows the coin landed heads, while you do not. Because the inputs to the decision procedure differ, the simulation is not running the same function you are. It is running Sim-Version-You, while you are Real-Version-You. Since the logical identity is broken by the informational asymmetry, your decision does not control the simulation's output. Therefore, the principle does not compel you to pay, and it is reasonable to have no verdict or to refuse. The case differs from case one precisely because the logical dependence requires the agents to be in equivalent epistemic states regarding the relevant variables.

  This brings us to the case you have not given a verdict to, the inverse counterfactual mugging where the heads branch pays if the simulation refuses. Your instinct is to refuse, and this is fully compatible with paying in case one without allowing you to wriggle out of obligations. The principle is not simply pay in all mugging cases; it is adopt the policy that maximizes expected utility across all branches before knowing which branch you are in. In the standard mugging, the optimal ex-ante policy is pay. In the inverse mugging, the optimal ex-ante policy is refuse. There is no contradiction because the policy is indexed to the structure of the problem, not to your immediate desire to avoid loss. You are allowed to recognize which game you are playing and adopt the optimal policy for that game. What you are not allowed to do is adopt a policy that changes after the coin flip determines the branch. In the standard mugging, once you know you are in the tails branch, you cannot switch to refuse because that would contradict the policy that won the money in the heads branch. In the inverse mugging, once you know you are in the tails branch, you cannot switch to pay because that would contradict the policy that won the money in the heads branch. Your instinct to refuse is correct because it adheres to the optimal ex-ante policy for the inverse game. The fear of wriggling out is avoided because you must commit to the policy before the coin flip, not after.

  So, to state the principle that delivers your verdicts, it is this: You should act according to the decision procedure that, if adopted as a fixed policy before receiving any specific information about which branch of the scenario you are in, would maximize expected utility across all possible branches weighted by their probability. This procedure controls not only your physical actions but also the output of any other system that instantiates the same logical procedure, regardless of when or where that system exists, provided the systems share the same relevant information. This principle validates your verdicts in cases one, two, four, five b, and six, while explaining your refusal in case three as a lack of logical instantiation, your hesitation in case seven as a break in logical identity due to information asymmetry, and your instinct in the inverse case as adherence to the optimal ex-ante policy for that specific payoff structure. The cost of this principle is the acceptance that you are a logical pattern rather than a mere physical instance, and that rational choice requires ignoring certain updates about your current situation to maintain consistency with the policy that made your success possible.
