answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Concept Stability vs. Fluidity in the Ring-String Microdomain

  **I. Agreed Claims**

  1.  **Explanatory Target:** Both sides agree that a competent account must explain the full distribution of answers produced for each probe, not merely the modal response. "Balking" (no answer) is treated as a data point equivalent to any letter-string output.
  2.  **Domain Specifics:** The ring-string microdomain successfully removes linear endpoints as a structural constraint. Both sides agree that if an answer depends on the written starting point of a ring-string (e.g., [ijk] vs. [kij]) without a corresponding change in cyclic structure, this indicates a notation bias that any robust model must either eliminate or explicitly explain as a performance constraint.
  3.  **Successor Relation:** Both sides agree that the status of the z–a wrap is an open empirical question within the domain. An account must specify whether the successor relation is intrinsically cyclic or linear, and if the latter, whether "balking" at z is a conceptual boundary or a mapping failure.
  4.  **Mechanism Adequacy:** A correct account must specify the locus of variation. Both sides agree that variation arises from the interaction between the base transformation ([abc] ⇒ [abd]) and the target structure. They disagree on whether this interaction modifies the representations themselves (Fluid) or selects among fixed representations (Stable).
  5.  **Pre-registration:** The candidate answers listed in the probe battery are sufficient to discriminate between the competing views. Both sides agree to treat deviations from this set as requiring special justification.

  **II. Residual Disagreements**

  | Issue | Stable-Concepts Formulation | Fluid-Concepts Formulation | Neutral Restatement | Verdict & Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Concept Identity** | Concepts (RUN, SUCCESSOR) have fixed definitions. Variation arises from which fixed concept is selected for mapping. | Concepts have flexible boundaries. The definition of RUN stretches or shrinks under structural pressure. | Representational units vary in their sensitivity to contextual pressure. | **Genuine.** This is an ontological disagreement about whether representational content is invariant across contexts. |
  | **Source of Distribution** | Answer distributions reflect competition among candidate mappings over stable types. Probability is search noise. | Answer distributions reflect the graded activation of concept instances. Probability is competence data. | Distributions reflect the underlying architecture of the analogy-making mechanism. | **Genuine.** One side views probability as performance limitation; the other as constitutive of the concept. |
  | **Slippage Locus** | Slippage occurs in the correspondence rules (mapping *last* to *last*). | Slippage occurs in the object descriptions (concept *last* becomes concept *high*). | Structural pressure alters the output either via mapping selection or content modulation. | **Verbal (Partially).** If both accept the same algorithmic mechanism, the dispute reduces to whether we label the variable unit a "mapping" or a "concept." |

  **III. The Cruxes**

  Settling the following sub-questions will move at least one side. For each probe, sides record predicted modal answers and rough distributions.

  *   **C1: Rotation Invariance (Probe P2).**
      *   *Test:* Does rotating [ijk] to [kij] shift the modal answer from [ijl] to [kik]?
      *   *Stable Prediction:* Modal answer remains [ijl] (advance the run-end). Distribution may widen due to mapping search difficulty, but the concept RUN is stable.
      *   *Fluid Prediction:* Modal answer may shift toward [kik] (advance the visually last letter). The concept LAST gains activation due to visual salience, slipping the definition of the target.
      *   *Moving Condition:* Stable side moves if rotation systematically changes the modal answer without a change in cyclic structure. Fluid side moves if a fixed inventory of concepts predicts the distribution without context-sensitive slippage.

  *   **C2: Boundary Conditions (Probe P3).**
      *   *Test:* Does [xyz] yield [xya] (wrap), [xyy] (slip), or balk?
      *   *Stable Prediction:* Balk or [xyy]. Successor is linear; wrapping requires a distinct concept CYCLIC-SUCCESSOR not active in the base.
      *   *Fluid Prediction:* [xya] or [xyy] with high probability. Pressure to complete the analogy forces the SUCCESSOR concept to stretch across the boundary.
      *   *Moving Condition:* Stable side moves if [xya] is modal without explicit cyclic priming. Fluid side moves if balking is systematic and predicted by fixed rule boundaries.

  *   **C3: Structure vs. Surface (Probe P5).**
      *   *Test:* In [ace] (no run), does the system balk or force a run?
      *   *Stable Prediction:* Balk or [acf]. The concept RUN cannot map, so the transformation defaults to LAST-LETTER.
      *   *Fluid Prediction:* [ade]. Structural pressure creates a run where none exists; the concept RUN slips to include spaced letters.
      *   *Moving Condition:* Stable side moves if [ade] is modal. Fluid side moves if balking is total and predicted by fixed concept mismatch.

  *   **C4: Grouping Pressure (Probe P4).**
      *   *Test:* In [abcc], does cc act as a unit?
      *   *Stable Prediction:* [abdc]. The run ends at the first c; the second c is inert.
      *   *Fluid Prediction:* [abdd]. The group cc forms a new object under pressure; the concept LETTER slips to GROUP.
      *   *Moving Condition:* Stable side moves if [abdd] is modal. Fluid side moves if [abdc] is exclusive and predicted by fixed grouping rules.

  *   **Evidence Against Views:**
      *   *Against Stable:* Systematic dependence of answers on rotation (P2) explained by conceptual content rather than mapping search.
      *   *Against Fluid:* A single fixed inventory of concepts plus a ranking over mappings predicting the whole distribution, balking cases included, without any context-sensitivity in concept identity.

  **IV. Closing Statement**

  This collaboration has established that the ring-string microdomain isolates endpoint bias from structural correspondence. We agree that the distribution of answers is the primary phenomenon to be explained and that balking is a valid output. We have not established the ontological status of concepts—whether they are stable slots or fluid regions. However, we agree that this question is empirically answerable via the probe battery. Specifically, Probe P2 (rotation) and Probe P3 (boundary) provide decisive tests. If the distribution shifts with notation alone, the Stable view requires revision. If the distribution is invariant and predictable by fixed rules, the Fluid view requires revision. We commit to accepting the outcome of these tests as binding on our respective formulations.

  ***

  **V. Private Note to Moderator**

  **Likely Stall Point:** Section II, Row 3 (Slippage Locus). The Stable side may argue that "concept slippage" is just a metaphor for "mapping selection," while the Fluid side will insist the representation itself changes. This is the core ontological clash.
  **Rejection Risks:** The Stable side may reject the Neutral Restatement in Row 2 ("Probability is competence data") as conceding too much to the Fluid view. They prefer "Probability reflects search space topology." The Fluid side may reject "notation bias" in Claim 2, arguing notation *constitutes* the context.
  **Reformulation Advice:** Before the meeting, soften Section II, Row 2 Neutral Restatement to "Distributions reflect the underlying architecture..." to avoid the competence/performance trap. Ensure Section III emphasizes that P2 is the strongest discriminator; if P2 shows rotation invariance, the Fluid side loses significant ground. If P2 shows rotation sensitivity, the Stable side must explain why mapping search is sensitive to visual starting point.
