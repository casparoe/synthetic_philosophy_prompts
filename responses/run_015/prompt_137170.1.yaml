answer: |-
  This is an exceptionally sharp observation. You have independently reconstructed one of the central problems in late 20th-century philosophy of language. You are noticing the friction between *epistemic access* (how we identify the thing) and *metaphysical essence* (what makes the thing what it is).

  You asked for the carving before the label. So, let's dissect the mechanism you are seeing before we hang a name on it.

  ### The Carving: Epistemic vs. Metaphysical Intensions

  The distinction you are drawing is between two different ways a term maps onto the world across different scenarios.

  1.  **The Epistemic Rule (The "Diagnostic"):** This is a rule for identifying the referent given a world considered as *actual*. It answers the question: "If I were dropped into this world with my current sensory limitations and background knowledge, what would I point to and call 'X'?" This rule relies on superficial properties, causal history, or functional roles that are observable.
  2.  **The Metaphysical Rule (The "Essence"):** This is a rule for identifying the referent given a world considered as *counterfactual*. It answers the question: "Given that we know what 'X' actually is in our world, which things in this other possible scenario count as 'X'?" This rule relies on the underlying nature (microstructure, origin, or specific identity) established in the actual world.

  When these two rules yield the same extension in all worlds, the term behaves descriptively. When they come apart, you get the phenomenon you described with water: the epistemic rule points to "clear, drinkable liquid," but the metaphysical rule points to "H2O."

  Because the metaphysical rule is fixed by the actual world's discovery, it holds across all counterfactual worlds (rigidity). But because the epistemic rule is how we *find* the actual world's referent, we need empirical investigation to align the two. This generates the **Necessary A Posteriori**.

  ### The Framework: Two-Dimensional Semantics

  The established framework that formalizes exactly this "two rule" intuition is **Two-Dimensional Semantics** (developed by philosophers like David Kaplan, David Chalmers, and Frank Jackson).

  In this framework, meaning has two dimensions:
  *   **Primary Intension (1-intension):** Corresponds to your "first rule." It maps a *world considered as actual* to a referent. It captures the epistemic conditions of application.
  *   **Secondary Intension (2-intension):** Corresponds to your "second rule." It maps a *world considered as counterfactual* to a referent, holding the actual-world facts fixed.

  **Applying the Carving to Your Cases:**

  1.  **Water:**
      *   *Primary:* The clear, drinkable liquid in the lakes.
      *   *Secondary:* H2O.
      *   *Result:* They come apart. In a counterfactual world where the lakes contain XYZ, the Primary intension picks out XYZ (if we treat that world as actual), but the Secondary intension (fixed by our actual discovery) says "No, that's not water." This creates the modal gap.

  2.  **Jack the Ripper:**
      *   *Primary:* "The person who committed these murders."
      *   *Secondary:* *That specific man* (e.g., Aaron Kosminski), rigidly designated.
      *   *Result:* They come apart. If we discover Kosminski didn't do it, we update the Primary (we were wrong about the description), but the Secondary remains locked on the person the name was baptized to refer to (or, on some views, the name fails to refer). Crucially, in a counterfactual world where Kosminski didn't kill anyone, he is still Jack the Ripper (on the Kripkean view), because the name rigidly designates him, not the murderer.

  3.  **Role R (Your Made-Up Term):**
      *   *Primary:* Whatever plays role R.
      *   *Secondary:* Whatever plays role R.
      *   *Result:* They collapse. The term is defined functionally. If the stuff changes, the referent changes. There is no hidden essence. This is a **non-rigid designator** or a purely descriptive term.

  ### Distinguishing from Other Concepts

  You asked how this differs from other famous distinctions. This is where precision matters.

  **1. Sense vs. Reference (Frege)**
  Frege's distinction is the ancestor, but it isn't quite the same. For Frege, Sense *determines* Reference. If you know the Sense, you know the Reference.
  *   *The Difference:* In your "Water" case, the "first rule" (superficial properties) looks like a Sense, but it *doesn't* determine the Reference in the way Frege thought. It only fixes it contingently. Two-Dimensionalism saves the insight of Sense (the epistemic rule) without accepting Frege's claim that it fixes the modal profile.

  **2. Meaning in the Head vs. in the World (Internalism vs. Externalism)**
  *   *The Difference:* This is the *metaphysical grounding* of your distinction. The "first rule" is often internalist (based on our concepts/qualia). The "second rule" is externalist (based on causal chains or microstructure). Your "two rules" observation is essentially the semantic symptom of Externalism.

  **3. Rigid Designation**
  *   *The Difference:* Rigid designation describes the behavior of the *second rule* only. It says the term refers to the same object in all counterfactual worlds. But it doesn't explain how we *find* that object in the actual world. Someone who says "it's nothing more than rigid designation" is ignoring the epistemic problem you identified: how do we lock the rigid designator onto the right thing in the first place? Your "two rules" framework explains *why* rigid designation leads to necessary a posteriori truths.

  **4. Reference Fixing by Description (Kripke)**
  *   *The Difference:* Kripke allows that a description can fix the reference (the "first rule") without giving the meaning (the "second rule"). Your intuition matches Kripke's exactly here. However, Kripkeans often deny that the "first rule" is part of the *semantic content*. Two-Dimensionalists (like Chalmers) argue the "first rule" *is* a kind of content (Primary Intension). So, your "two rules" view is slightly more generous to the descriptive element than strict Kripkeanism.

  ### Boundary Cases: Where Does It Stop Applying?

  This is the testing ground for the theory.

  **1. Indexicals ('I', 'Here', 'Now')**
  David Kaplan's work on indexicals is actually the prototype for Two-Dimensionalism.
  *   *Rule 1 (Character):* "I" refers to the speaker of this context.
  *   *Rule 2 (Content):* "I" refers to *David Chalmers* (if he said it).
  *   *Verdict:* Yes, the distinction applies perfectly. In a counterfactual world, "I" still refers to the speaker of that context (Rule 1), but if we are evaluating what David Chalmers said in another world, "I" refers to David Chalmers (Rule 2). The gap exists but is managed by context.

  **2. Social Kinds ('Money', 'Marriage')**
  *   *Verdict:* This is controversial and fascinating.
  *   If 'money' is defined functionally ("whatever is accepted as medium of exchange"), the rules **collapse** (like your Role R case). If the stuff changes but the function holds, it's still money.
  *   However, if 'money' implies a specific institutional history (e.g., "issued by the US Treasury"), then the rules **come apart**. Paper that looks like a dollar but wasn't issued by the Treasury isn't money, even if it functions like it.
  *   *Philosophical Take:* Social kinds often rely on *status functions* (Searle). The "first rule" (looks like cash) is a placeholder for the "second rule" (has institutional status). The gap exists if the status is hidden.

  **3. Biological Kinds ('Gene')**
  *   *Verdict:* This is a live debate in philosophy of biology.
  *   *Classical view:* Gene = unit of heredity (Functional/Role R). Rules collapse.
  *   *Molecular view:* Gene = specific DNA sequence (Structural/Water). Rules come apart.
  *   *Current consensus:* It's likely a cluster concept. If you use 'gene' to mean "sequence," you have the Water gap. If you use it to mean "functional unit," you have the Role R collapse. This shows that the "two rules" distinction isn't just about the word, but about *how the scientific community stabilizes the term*.

  ### The Names You Are Looking For

  To summarize the terminology for your research:

  1.  **The Phenomenon:** The **Necessary A Posteriori** (the logical result of the gap).
  2.  **The Semantic Framework:** **Two-Dimensional Semantics** (the formal model of the two rules).
  3.  **The Specific Distinction:** **Primary vs. Secondary Intension** (or Epistemic vs. Metaphysical Intension).
  4.  **The Linguistic Category:** **Natural Kind Terms** (for the Water case) vs. **Descriptive Names** (for the Jack the Ripper case) vs. **Functional Kind Terms** (for the Role R case).

  ### Final Philosophical Assessment

  Your intuition that "rigid designation" is too thin is correct. Rigid designation tells you what happens *after* reference is fixed. Your "two rules" insight captures the *process* of fixing reference and the *epistemic cost* of doing so.

  The "odd result" you mention (knowing a sentence is necessary if true, but needing experiment to know *if* it is true) is the hallmark of the **Kripkean Revolution**. You have effectively rediscovered the motivation for Two-Dimensionalism: it is the attempt to reconcile the Kripkean insight (meaning is external/rigid) with the Fregean insight (meaning guides our reasoning/identification).

  If you want to read further, look into **David Chalmers' *The Conscious Mind* (Chapter 2)** or **Frank Jackson's *From Metaphysics to Ethics***. They defend the view that both "rules" are legitimate parts of meaning, against the Kripkean view that only the second rule is semantic. Your intuition aligns closely with the Two-Dimensionalist camp.
