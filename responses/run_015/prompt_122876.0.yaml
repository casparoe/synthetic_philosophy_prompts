  Here are ten questions designed to keep the conversation moving while gently tightening the pressure on her three standard defensive moves. The tone is conversational, but the structure is built to make it difficult for her to retreat to her standard talking points without addressing the underlying tension.

  ### 1. The Timing of the Math
  **Question:** I want to start with the mechanics of the view. You rank options by taking the expected sum of a concave transform of *realised* welfare. Why apply the transform after the uncertainty resolves, rather than applying it to each person's expected welfare beforehand?

  **Expected Answer:** She will likely say that applying it to realised welfare captures the moral value of certainty and outcomes themselves, not just expectations. She'll argue that risk has moral significance independent of the expected utility.

  **Follow-up:** So on your view, the moral value of a benefit depends on whether it actually lands, not just the chance it had of landing. But doesn't that mean the moral value of a policy changes depending on how the dice fall, rather than being a property of the policy itself?

  ### 2. The Cost of Risk Aversion (Numerical Illustration)
  **Question:** Let's make that concrete. Suppose Option A gives everyone 10 units of welfare for sure. Option B is a coin flip: heads, everyone gets 24; tails, everyone gets 0. The expected welfare of B is 12, which is higher than A's 10. But if your concave curve is steep enough, the math says pick A. You're choosing a policy with lower expected total welfare. Is that right?

  **Expected Answer:** She will agree but frame it as "social risk aversion." She'll say it's not sacrificing welfare, but correctly valuing the certainty of the benefit.

  **Follow-up:** I see. But if we run that policy over and over, we end up with less total welfare in the long run than if we'd picked B. Isn't this just the levelling-down objection relocated? You're willing to make everyone expect less, in exchange for a more equal distribution of outcomes across the different possible worlds.

  ### 3. Concavity Within a Life
  **Question:** You justify the concave curve by saying it reflects the diminishing moral value of a benefit as the recipient's level rises. We accept that intuitively for a single person. Does that same logic apply within one life over time? If I'm having a terrible year, does a benefit I get then count for more morally than the same benefit I get during a great year?

  **Expected Answer:** She will likely say "Yes." To be consistent with Move 2 (that this is just diminishing marginal value), she should accept that benefits matter more during the "bad times" of a single life.

  **Follow-up:** Okay. If that's true, does it ever make sense to smooth out a person's life even if we lose some total welfare in the process? Imagine we could take welfare from your good years to pad your bad years, but some leaks away in the transfer. Should we do it?

  ### 4. The Embarrassment of Intrapersonal Levelling Down
  **Question:** Let's assume you say yes to that. We should smooth the life even with a total loss. Critics say this is the intrapersonal version of levelling down: making a person worse off overall just to reduce inequality between their own time-slices. Why isn't that just as embarrassing as the interpersonal version you reject?

  **Expected Answer:** She will likely argue that intrapersonal smoothing is less embarrassing because it's the *same person* benefiting over time, or that rational prudence requires smoothing.

  **Follow-up:** But if the embarrassment comes from wasting moral value to achieve a distributional pattern, why does it matter if the pattern is between people or between years? If the total good is reduced, what has been gained morally?

  ### 5. The Boundary of the Person
  **Question:** Many prioritarianists want to avoid that result by saying the "whole life" is the unit of account, not the time-slice. If you take that route to avoid the smoothing problem, what makes the boundary of a person the special place where priority switches on? Why not the community, or the year?

  **Expected Answer:** She will likely argue that persons are the relevant agents of experience or that justice is owed to persons, not time-slices.

  **Follow-up:** If it's about who is owed justice, does it matter what happened to them in the past? If I had a wonderful childhood but am struggling now, do I get priority over someone who has always been average? Or do my past benefits count against my current priority?

  ### 6. The Tail of the Function
  **Question:** I want to ask about the shape of that concave curve as people get very well off. As welfare rises, does the moral weight of an additional gain ever go to zero? Or does it just get very small, but always positive?

  **Expected Answer:** She will likely say it never hits zero, because that would imply lexical priority (where the worst off always trump the best off), which she wants to avoid. She'll say it's always a trade-off.

  **Follow-up:** So it's always a trade-off. But if the weight is tiny enough, it would take a massive gain for a billionaire to outweigh a tiny gain for a starving child. At what point does a "trade-off" start to look like "lexical priority in a trenchcoat"?

  ### 7. The Absurd Case
  **Question:** Let's test that trade-off. Imagine a billionaire is going to have a slightly bad afternoon unless we give him a specific resource. A badly off kid could use that same resource to get a basic meal. If the billionaire's marginal weight is low enough, does your view say we must feed the kid, even if the billionaire's loss is genuinely huge in terms of welfare units?

  **Expected Answer:** She will likely say "Yes, that's the implication," or try to adjust the numbers so the billionaire's loss is morally significant enough to outweigh the kid's gain.

  **Follow-up:** If you say the billionaire's loss has to be huge to outweigh the kid's meal, doesn't that mean the kid's interest effectively vetoes the billionaire's? That looks like we've smuggled a floor into the view, even if you say it's just a continuous curve.

  ### 8. The Source of Egalitarian Intuitions
  **Question:** Your view is additive and separable; the gap between people never enters the math directly. Yet it produces results that look very egalitarian. When people have intuitions about levelling down—when they feel it's better if everyone is equally miserable—what do you think they are actually responding to?

  **Expected Answer:** She will likely say they are responding to "relational equality" (Move 3). She'll argue people confuse fairness in treatment with fairness in outcomes.

  **Follow-up:** If it's a separate principle, why does your view mimic it so closely without acknowledging it? Is it possible your view is free-riding on the intuitive appeal of equality to get its results, while claiming the moral high ground of Pareto efficiency?

  ### 9. Variable Populations
  **Question:** Let's move to cases where the number of people isn't fixed. If a policy brings different people into existence, who is the "worse off" person we should give priority to? In one option they don't exist; in the other, they do.

  **Expected Answer:** She will likely say we compare them to a baseline of zero, or that we only prioritize those who exist in both options.

  **Follow-up:** If we only prioritize those who exist in both, then for future generations, priority disappears and you collapse into total utilitarianism. If you prioritize the newly created, how do you weigh a life that is worth living but barely, against a better life for someone else? Who gets the priority weight?

  ### 10. Falsification Conditions
  **Question:** Closing out: I want to ask what would count against this specific version of prioritarianism. Not what's a difficult objection, but what concrete result—from a case or the formal math—would make you give up this specific ex-post concave sum view?

  **Expected Answer:** She will likely say "If it implied we should ignore severe suffering" or "If it violated basic rights."

  **Follow-up:** Those are general moral constraints. I mean specifically about the *shape* of the view. If the math showed that for any realistic population, this view always recommended the same policy as simple utilitarianism, would you drop the complexity? Or if it showed we must sacrifice expected welfare in cases like the one we started with—is there a line where the cost is too high?
