answer: |-
  1. The archive acts as the map, the past itself is the terrain, and the historian serves as the person zooming to adjust resolution via the control of methodological choice. This picture quietly conflates the surviving record with the past itself, assuming missing data is merely out of frame rather than lost.

  2. The argument that nothing guarantees structures repeat at every scale bites hardest because macro forces like grain markets constrain village life without appearing as legible agents in local records. This is not a quibble because it denies the ontological reductionism required to treat a microstudy as a complete substitute for wider analysis.

  3. A critic might argue that maps are visual while archives are textual, but this ignores that both are mediated representations requiring interpretation. The political claim that ordinary people are agents survives even if the methodological claim fails, because recovering agency does not require proving the micro contains the macro.

  4. The zoom picture imports scale-invariance and a view from nowhere, falsely treating the macro as a statistical average rather than a causal structure. The superior-substitute conclusion collapses once these assumptions are exposed, making your fishing net analogy superior because it acknowledges the archive's constructive role.

  5. A truly total archive, such as a sealed Pompeii-like snapshot of daily life, would make the zoom picture adequate by removing selection bias. My audit is most likely wrong about the inevitability of macro-causal powers, as some historical phenomena may indeed be fully reducible to local interactions.
