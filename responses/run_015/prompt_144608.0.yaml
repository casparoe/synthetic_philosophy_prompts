answer: |-
  Your framing rests on a category mistake. You are applying metaontological tools, designed to analyze fundamental reality, to engineering problems, which are inherently pragmatic. In metaphysics, "existence" asks what the world contains independent of us. In your knowledge graph, "existence" asks what entities facilitate useful computation and explanation. Confusing these domains leads to the confusion you are experiencing with your teammate and the "residue" of your canonicalization procedure.

  To see why, we must define a **merely verbal dispute**. This occurs when two parties agree on all the non-semantic facts but disagree on linguistic usage. For example, if you define "sandwich" as requiring two slices of bread and I define it as allowing one, we agree on the physical structure of a hotdog but disagree on the label. A **quantifier variance** thesis suggests that different conceptual schemes might use "exists" with different rules (e.g., one scheme counts aggregates as objects, another does not) without one being objectively correct.

  Your "canonicalization" procedure attempts to detect verbal disputes by translating claims into a neutral base language. You required this language to contain only sorts both sides already accept. Here lies the first error. If you restrict the base language to shared commitments, you cannot detect disagreements about whether new commitments are *useful*. When your engineers shifted to arguing about query simplicity, they revealed that the original dispute was never about metaphysical existence. It was about **modeling utility**.

  Therefore, regarding your conflict: your teammate is partially right that the metaphysical sting was removed, but you are right that the dispute was not "merely verbal" in a way that allows you to ignore it. The disagreement relocated because the original question ("Does subscription exist?") was a proxy for a substantive pragmatic question ("Is modeling subscription as a node useful?"). A verbal dispute dissolves completely once terminology is fixed; a pragmatic dispute persists because trade-offs remain. Your procedure marked the dispute "verbal" because the existence claims translated equivalently, but it failed to capture the divergent *consequences* of adopting one model over the other.

  This leads to your suspicion: "No privileged language implies no fact of the matter, so ontology is just schema design." This conclusion is practically correct for engineering, but the reasoning contains a bad step. The error is inferring **ontological anti-realism** (nothing exists) from **semantic pluralism** (many ways to speak).

  The argument fails here: Just because there is no framework-independent fact about which quantifier meaning is correct, it does not follow that there are no facts *within* a framework. Once you stipulate a schema, it is an objective fact whether a specific record satisfies the conditions for being a "subscription." The choice of schema is pragmatic, but the truths generated within that schema are real. Your suspicion feels too strong because it conflates the arbitrariness of the *choice* of language with the arbitrariness of the *truths* expressed in it. Ontology is schema design, not because nothing exists, but because "existence" in this context is a functional role within a system, not a mirror of nature.

  Finally, consider your "verbalness linter." You asked what it would have to check. It cannot settle first-order questions about what there is, because no algorithm can detect metaphysical reality. Instead, it must check for **equivalence of truth conditions**.

  To classify a dispute as verbal, the linter must verify that for every possible state of the world consistent with the base language, Party A's claim and Party B's claim have the same truth value. If Party A says "Subscriptions exist" and Party B says "Subscriptions do not exist," the linter translates both into the neutral language (e.g., "Billing events are grouped"). If the translations yield identical truth conditions across all scenarios, the dispute is verbal. However, your linter must also check for **pragmatic divergence**. If adopting Party A's terminology requires different database indexes or API endpoints than Party B's, the dispute is substantive, regardless of semantic equivalence.

  In summary, your framing mistakes engineering ontology for metaphysics. The "residue" you found proves the dispute was substantive all along, but about utility, not existence. Your suspicion is right in conclusion but wrong in derivation: ontology is schema design because existence claims in software are tools for organization, not because reality is indeterminate. A verbalness linter can detect semantic equivalence, but it cannot detect value. That remains your job.
