  **Clinical Trial Confirms Efficacy of Gravitational Re-Centering for Identity Stabilization**

  **PROVIDENCE, R.I.** — The Department of Narrative Mechanics at Brown University today announced positive results from a Phase III randomized controlled trial of Gravitational Re-Centering (GRC), a clinical intervention designed to diagnose and restore the patient's center of narrative gravity. The study suggests that identity fragmentation can be treated by physically relocating the psychological locus of the self through structured memoir editing and third-party corroboration.

  Principal Investigator Dr. Elena Voss stated that the procedure addresses the instability caused by "narrative mass displacement," where a subject's life story fails to cohere around a single point. "When the center drifts, the person feels weightless," Dr. Voss said. "GRC redistributes anecdotal mass to establish a stable fulcrum." The protocol involves Certified Narrative Technicians guiding patients to edit conflicting memories until a singular trajectory emerges. To resolve concerns regarding who performs the editing, the protocol appoints a clinical supervisor to validate the protagonist's voice, ensuring the authorial function remains distinct from the subject.

  The trial highlighted the social nature of self-constitution. Stability scores dropped significantly when estranged family members were excluded from the narrative loop, suggesting that other people's stories are load-bearing. In 14% of subjects, the center of gravity was identified outside the physical body, often localized within a spouse's career or a child's achievements. These cases were classified as "extra-corporeal stabilizations" and deemed successful provided the host body remained accessible.

  Dr. Alan Stroud, a theoretical physicist unaffiliated with the study, raised objections regarding the underlying mechanics. "A center of gravity is a mathematical abstraction, not a dot you can paint on a chest," Stroud said. "It shifts when you move your limbs, and it does no predictive work unless you were already doing the calculation. Treating it as a biological organ category errors the physics."

  Despite these concerns, the university has licensed the technology for immediate commercial application. GRC is currently being marketed to high-functioning executives as an "Identity Densification" wellness package. Clinics report high demand among individuals seeking to strengthen a selfhood that was never clinically diminished. Critics note that the trial's primary outcome measure, the Self-Reported Center Location Task, requires patients to affirm the existence of a center to complete the assessment. Patients unable to point to a location were recorded as treatment failures, presupposing the validity of the model.

  "The market response indicates a widespread desire for a heavier self," said Dr. Voss. "Whether the story happened is less relevant than whether it holds weight." The department plans to begin training practitioners in retroactive continuity adjustments next quarter.

  ***

  **SIDEBAR: TRIAL ABSTRACT**

  **Journal:** *Journal of Ontological Kinetics*
  **Article:** *Manipulating the Locus: A Randomized Controlled Trial of Gravitational Re-Centering*

  **Background:** Personal identity is hypothesized to function as a center of narrative gravity. This trial tested whether clinical manipulation of this locus improves continuity.
  **Methods:** N=400 adults were randomized into GRC or waitlist control. The intervention involved redistributing narrative mass via guided confabulation and social anchoring. Factual accuracy was not monitored.
  **Primary Endpoint:** Change in Subjective Continuity Verification (SCV) scores at 12 weeks. SCV requires subjects to locate their self-center on a diagram.
  **Results:** The GRC group showed a significant increase in SCV scores compared to control (p<0.01). 14% of treatment subjects demonstrated extra-corporeal localization. Factual veracity of narratives did not correlate with stability (r=0.04).
  **Conclusion:** Gravitational Re-Centering effectively stabilizes the self by enforcing a measurable center, regardless of factual truth or physical location. The measurement procedure successfully generates the entity it purports to find.
