answer: |-
  This is a sharp argument, and you've correctly identified that your "Dissent Condition" (Step 2) is doing too much heavy lifting. You have built a trap that catches Jefferson (which you want) but also catches everyone forever (which you don't want).

  Here is the diagnosis: **Step 2 is the broken link.**

  Specifically, the error is conflating the **existence** of dissent with the **reasonable accessibility** of dissent.

  ### 1. Why Step 2 looked fine (and why it breaks)
  It looked fine because it solves the "universality is too cheap" problem. You rightly noticed that just because *most* people did X, doesn't mean X was morally opaque. If a clear moral alternative was visible, the agent had a choice.

  It breaks because it sets the bar for moral culpability at **moral heroism**.
  By saying "MHOT only excuses when there was *no* available dissenter," you are effectively arguing: *If one person in your society figured it out, you should have too.*

  This ignores **social and epistemic cost**.
  *   **Epistemic Cost:** Was the dissenting view buried in a pamphlet no one read, or was it a mainstream debate?
  *   **Social Cost:** Was adopting the dissenting view a matter of changing an opinion, or did it require economic suicide, exile, or death?

  If the only people saying "slavery is wrong" are a marginalized sect that the mainstream considers heretical, expecting a mainstream figure to adopt that view immediately is to demand they be a saint, not a morally competent agent.

  ### 2. How to fix it (The "Reasonable Accessibility" Patch)
  You need to modify Step 2 from a binary switch (Did dissenters exist? Yes/No) to a gradient of **reasonable expectation**.

  **Revised Step 2:** MHOT excuses an agent if the moral failing was consistent with the **reasonable moral expectations** of their specific social and epistemic position, *even if* dissenters existed. Dissent only negates MHOT if it was **sufficiently salient and accessible** that a reasonable person in the agent's position *ought* to have engaged with it.

  **What this costs you:**
  It costs you the clean, binary logic of your original argument. You now have to do historical legwork to determine what was "reasonably accessible" to specific agents.
  *   **Jefferson:** He was an elite intellectual with a massive library and correspondence network. The dissent *was* reasonably accessible to him. He fails the test. (You keep your Step 3).
  *   **A Virginian Tenant Farmer:** The Quaker pamphlets might not have been reasonably accessible to them. Their social survival depended on conformity. They might pass the test. (MHOT becomes available again).
  *   **Us (Fossil Fuels):** The dissent is not just available; it is on the news, in school curricula, and in scientific consensus. It is reasonably accessible. We are blameworthy. (You keep your Step 4 intuition, but it doesn't feel like an absurdity anymore; it feels like a call to action).

  ### 3. Addressing the Step 5 Confusion
  There is a logical slip in your Step 5 that you should catch before your seminar.
  You wrote: *"[This] makes MHOT never available, which collapses into the opposite absurdity where we can never criticise anyone from the past at all."*

  If MHOT is *never* available, the defense fails. If the defense fails, the accusation stands. Therefore, you can criticize *everyone*.
  I suspect you mean one of two things:
  1.  **Moral Inflation:** If everyone is blameworthy for everything, "blame" loses its meaning. It becomes background noise. We lose the ability to distinguish the exceptionally wicked from the merely complicit.
  2.  **Presentism:** If we judge the past entirely by present standards (because MHOT never applies), we stop doing history and start doing theology. We lose the ability to understand *why* they acted, which is the point of historical judgment.

  The "Reasonable Accessibility" fix solves this. It allows you to distinguish between the **complicit** (who get MHOT) and the **negligent elites** (who don't).

  ### 4. Your Professor's Point (Commemoration vs. Blame)
  This is not a distraction; it is a potential escape hatch for your Step 5 worry.

  If your goal is **Moral Blame**, you are asking: *Did they violate a duty they could reasonably have fulfilled?* (This is where the Accessibility fix works).

  If your goal is **Commemoration** (statues, building names), the question is different: *Does honoring this person signal that our community endorses their values?*

  *   **The Distinction:** You can determine that Jefferson is **blameworthy** for slavery (he fails the Accessibility test) but still argue he should be **commemorated** for the Declaration of Independence, *provided* the commemoration is contextualized.
  *   **Why it helps you:** It prevents the "All or Nothing" trap. You don't need MHOT to fully exonerate Jefferson to keep his statue. You just need to acknowledge the blame while separating it from the honor.
  *   **However:** If your seminar is specifically about *moral responsibility*, stick to the Accessibility fix. Use the Commemoration point only if the discussion turns to what we should *do* with historical figures (statues, etc.) rather than how we *judge* them.

  ### Summary for your Seminar
  1.  **Concede Step 2 is too strong.** It confuses "possible to know" with "reasonable to expect to know."
  2.  **Propose "Reasonable Accessibility."** MHOT applies unless the moral truth was salient and actionable for *that specific agent's* social position.
  3.  **Result:** Jefferson (elite, educated) is blameworthy. The average contemporary is not. We (with modern media/science) are blameworthy for climate inaction.
  4.  **Correction on Step 5:** Clarify that if MHOT never applies, we don't lose the ability to criticize; we lose the ability to *distinguish* degrees of culpability, rendering blame meaningless.

  This preserves your intuition about Jefferson without condemning all of humanity to eternal guilt.
