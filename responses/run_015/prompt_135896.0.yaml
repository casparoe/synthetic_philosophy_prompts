prompt: |-
  In discussions of Williams's integrity objection, people invoke the phrase 'one thought too many' to dismiss any deliberation that weighs saving a loved one against impartial welfare comparisons. I recently heard it deployed this way: a speaker said that a parent deciding whether to rescue their drowning child had already committed the error if they paused to consider that swimming to save a distant stranger's child might produce marginally more aggregate welfare, since even entertaining that comparison was 'one thought too many.' What are the distinct precise theses that slogan could be expressing? Separate them into readings about (a) what may legitimately enter deliberation, (b) what counts as an acceptable justification versus an appropriate motivation, (c) whether comparative moral reasoning is always permissible or only sometimes corrupting, and (d) the scope and force of impartial demands on agents with special relationships. For each reading, say whether it is trivial, substantive and defensible, or false, and indicate which ones actually justify dismissing the welfare-comparison move in the drowning case and which leave that argument untouched. Present the readings as a numbered menu. Keep your response under 600 words. Also say what specific counterexample or argument would cause you to drop your preferred interpretation, and flag the point in your reasoning where failure is most likely.
