prompt: |-
  In drafting my recent novel, I have adopted a stance on moral responsibility that extends the Frankfurt-style argument well beyond its usual bounds: I hold that Frankfurt cases do not merely falsify the principle of alternative possibilities, but that the very presence of accessible alternative pathways functions as a kind of modal noise that obscures the true ground of culpability—what I call narrative sourcehood, the coherence between an agent's formed intentions and the action actually produced, regardless of whether a counterfactual blocker stands ready to intervene. On this strengthened view, responsibility tracks internal authorship continuity rather than leeway, and the possibility of doing otherwise is not just irrelevant but often epistemically misleading, since it invites us to confuse freedom with branching possibility. Tell me what would genuinely count against this position—not only the familiar objections that Frankfurt cases conceal hidden alternatives or that the blocker introduces its own modal complexity, but which specific observations, thought experiments, or results from adjacent domains (say, determinism, narrative identity theory, or legal practice) would force me to abandon or seriously weaken it? Rank the defeaters from fatal to merely awkward, distinguish what a committed defender of this view would concede as damaging from what they would dismiss as a misunderstanding of narrative sourcehood, and say whether the position is well insulated or dangerously exposed. Keep your answer to one paragraph, not exceeding 250 words.
