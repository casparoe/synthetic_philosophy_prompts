answer: |-
  # JOINT STATEMENT ON RATIONAL DEFERENCE AND CLIMATE ENSEMBLES
  **Drafted by the Neutral Scribe for the Adversarial Collaboration on Chance and Calibration**
  **Date:** October 26, 2023
  **Signatories:** The Principalist Working Group & The Calibrationist Working Group

  ## 1. AGREED CLAIMS
  *The following propositions represent the common ground established at the outset of this collaboration. Both parties affirm these claims as the baseline for our continued disagreement.*

  1.  **Formal Structure of the Principal Principle:** Both sides accept the standard formalization: For a rational agent with credence function $C$, objective chance function $Ch$, and total admissible evidence $K$, if $Ch(E) = x$, then $C(E | Ch(E)=x \ \& \ K) = x$. The dispute is not regarding this formula's syntax, but regarding the metaphysical status of $Ch$ and the classification of $K$ in the context of climate modeling.
  2.  **Admissibility Distinction:** Both sides agree that a distinction exists between evidence that is "admissible" (information about the past and present that influences belief only through its impact on chance) and "inadmissible" (information about the future or information that bypasses the chance process). Both sides agree that if evidence is inadmissible, the Principal Principle does not mandate deference to chance.
  3.  **Behavior of Ensemble Forecasting:** Both sides agree that modern climate-ensemble forecasts are generated by running deterministic physical models with perturbed initial conditions and parameterizations. Both sides agree that the "spread" of these ensembles correlates with predictive uncertainty and that these models exhibit structural biases (systematic deviations from observed climatology) identifiable through hindcasting.
  4.  **Normative Claim on Rationality:** Both sides agree that rational belief formation must be responsive to evidence and truth-tracking rather than arbitrary. Neither side advocates for ignoring known model failures; the dispute concerns whether correcting for known failures constitutes a violation of the Principal Principle or a proper application of it.

  ## 2. DISAGREEMENTS TABLE
  *The following table articulates the specific points of divergence. Each position is stated in terms its advocates endorse, avoiding caricature.*

  | Feature | The Principalist Position | The Calibrationist Position |
  | :--- | :--- | :--- |
  | **Ontological Status of Ensemble Spread** | The statistical regularity produced by a well-constructed ensemble in a chaotic system functions as **objective chance** for macro-level events. Even if micro-physics is deterministic, the computational irreducibility and sensitivity to initial conditions generate a "functional chance" to which rational agents must defer. | Ensemble spread is an **epistemic tool**, not an ontological feature. It represents the range of plausible trajectories given human ignorance of initial conditions. It is a measure of *confidence*, not *chance*. Treating it as objective chance reifies a model artifact. |
  | **Treatment of Structural Bias** | Knowledge of structural bias is data used to **fix the value of $x$**. If a model systematically overestimates rain, the "objective chance" of rain is *not* the raw ensemble mean, but the bias-corrected value. Once the true $x$ is identified, deference is mandatory. | Knowledge of structural bias is **admissible evidence $K$** that overrides the raw ensemble probability. The raw ensemble output is a candidate for $x$, but expert judgment regarding model reliability constitutes $K$, allowing $C(E) \neq x_{raw}$ without violating rationality. |
  | **Source of Normative Force** | Rationality requires deference to the **best available statistical postulate** that satisfies the role of chance. If the ensemble is the best system for summarizing frequencies, it commands credence. | Rationality requires deference to the **causal reliability of the generator**. If the generator (the model) is known to be structurally flawed, blind deference to its output is irrational, regardless of its statistical labeling. |
  | **Determinism and Chance** | Macro-level objective chance is **compatible with micro-level determinism**. Chaos theory provides the bridge; the unpredictability is objective, not merely subjective. | Macro-level objective chance **requires indeterminism**. In a deterministic system, probabilities are purely epistemic (degrees of belief), so the Principal Principle (which links credence to *objective* chance) category errors when applied here. |

  ## 3. CRUXES AND EMPIRICAL PREDICTIONS
  *We have identified two sub-questions (cruxes) that drive the disagreement. For each, we specify a concrete scenario and record the divergent predictions made by each camp.*

  ### Crux 1: Does Micro-Determinism Undermine Macro-Objectivity?
  *Question:* Does the fact that the climate system is governed by deterministic differential equations prevent the ensemble probabilities from counting as "objective chance" in the sense required by the Principal Principle?

  *   **Concrete Scenario:** **The Perfect Model Scenario (PMS).** Consider a simulation where the model equations are known to be physically true (no structural error), but the initial conditions are drawn from a distribution representing measurement error. The ensemble spread is purely due to sensitivity to initial conditions (chaos).
  *   **Principalist Prediction:** In the PMS, the ensemble spread *is* the objective chance. A rational agent must set their credence in a specific temperature anomaly to match the ensemble probability, because the unpredictability is objective (grounded in physical instability), not merely subjective ignorance.
  *   **Calibrationist Prediction:** Even in the PMS, the probability remains epistemic. Since the future state is fixed by the actual initial conditions (which exist, even if unknown), the "chance" is either 0 or 1. The ensemble represents the agent's ignorance, not a property of the world. Therefore, the Principal Principle does not apply; only norms of epistemic consistency apply.

  ### Crux 2: Is Calibration Record Inadmissible Self-Locating Information?
  *Question:* Does an agent's knowledge of their own (or their model's) historical calibration record count as "inadmissible" evidence (like knowing the outcome of a coin toss in advance) or "admissible" evidence (like knowing the coin is weighted)?

  *   **Concrete Scenario:** **The Biased Precipitation Forecaster.** A forecaster uses an ensemble that predicts a 40% chance of extreme precipitation ($x_{raw} = 0.4$). However, the forecaster possesses a verification record showing that when the ensemble predicts 40%, the event occurs only 20% of the time due to a known convective parameterization error.
  *   **Principalist Prediction:** The forecaster should not defer to 0.4. However, this is because 0.4 is *not* the objective chance. The objective chance $x$ is 0.2 (the bias-corrected frequency). The Principal Principle is preserved by redefining $x$ to incorporate the bias correction. To defer to 0.4 would be to defer to a false chance claim.
  *   **Calibrationist Prediction:** The forecaster should set credence to 0.2, but this is a violation of the strict Principal Principle regarding the *model output*. The model output ($x_{raw}$) is the candidate chance. The calibration record is admissible evidence $K$ that breaks the link between $x_{raw}$ and credence. The Principal Principle fails here because it demands $C = x_{raw}$, but rationality demands $C = 0.2$.

  ## 4. IDENTIFICATION OF VERBAL DISPUTE
  *We acknowledge that a portion of our disagreement is verbal rather than substantive.*

  *   **The Verbal Portion:** The dispute over the label **"Objective Chance."**
  *   **Explanation:** The Principalists employ a **Functionalist** definition of chance (if it plays the role of chance in our best theories and guides decision-making, it is chance). The Calibrationists employ a **Propensity/Metaphysical** definition of chance (chance requires ontological indeterminism).
  *   **Resolution of Verbal Component:** If we agree to use the term "Objective Chance" only for indeterministic processes, the Principalists concede the term does not apply to climate ensembles. However, they maintain that a **Principal Principle for Functional Chance** still holds. If we agree to use the term "Objective Chance" for any stable, agent-independent statistical regularity, the Calibrationists concede the term applies, but maintain that the **Norm of Deference** does not follow.
  *   **Substantive Remainder:** Even after terminological alignment, the substantive disagreement remains: **Is the rational norm one of *Deference to Statistical Postulates* (Principalist) or *Responsiveness to Generator Reliability* (Calibrationist)?**

  ## 5. RESIDUAL DISAGREEMENT
  *Having isolated the verbal confusion, we frame the remaining substantive disagreement as follows:*

  **The Question of Normative Priority:**
  When a deterministic computational model produces a probability distribution $P$ that is known to be systematically miscalibrated relative to observed frequencies $F$:

  1.  **The Principalist maintains** that rationality requires the agent to treat the bias-corrected frequency $F$ as the *true* chance $x$, thereby preserving the norm that Credence must equal Chance ($C=x$). The model output $P$ is merely a flawed estimate of $x$.
  2.  **The Calibrationist maintains** that rationality requires the agent to treat the model output $P$ as a *prima facie* guide that is legitimately overridden by the evidence of miscalibration $K$, such that Credence equals a function of Chance and Evidence ($C = f(P, K)$), where $f(P, K) \neq P$.

  **We disagree on whether the correction of model bias is an internal step in defining Objective Chance (Principalist) or an external application of Admissible Evidence that overrides Objective Chance (Calibrationist).**
