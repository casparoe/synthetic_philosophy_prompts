      *   The feeling of the AI being "part of the head" is a known phenomenon in human-computer interaction (extended mind thesis).

  3.  **Deconstruct the Problems:**
      *   **Problem 1: Reliance/Atrophy.** The user admits they don't remember the canon anymore. This is risky for a creator. If the tool fails, the book dies.
      *   **Problem 2: Hallucination/Drift.** The AI changes rules or invents facts. This threatens consistency, which is crucial for fantasy/sci-fi (magic systems, etc.).
