answer: |-
  You are right to feel weird. You have put your finger on a structural hypocrisy in the machinery of publishing historical fiction. The afterword is not a neutral document; it is a philosophical stance disguised as a courtesy. Here is the reconstruction you asked for, argued from the practice itself.

  ### 1. The Theory of Truth Presupposed
  The confessional afterword presupposes a **Referential Theory of Fiction**, specifically one that treats the historical novel as a degraded form of history that requires correction.

  By itemizing only the inventions, the note establishes a default setting: **The text is presumed true unless marked false.** This implies that the novel is in the business of making assertoric claims about the world. It treats the narrative as a series of propositions ("Margaret went to York," "The bread cost fourpence") that correspond to reality. If the novel were merely an aesthetic object or a "what-if" scenario, there would be no need to distinguish the real from the invented, because truth-value would be irrelevant.

  **Rival Accounts Ruled Out:**
  *   **Radical Fictionalism:** The view that novels make no truth claims at all, only pretend to. Your afterword contradicts this; you wouldn't need to correct a pretense.
  *   **Aesthetic Autonomy:** The view that the only truth that matters is internal coherence. Your note appeals to external evidence (ledgers, records).
  *   **Postmodern Instability:** The view that history itself is a narrative construct. Your note relies on the stability of the historical record to define your deviations.

  **The Contemporary Contradiction:**
  You are correct: the two disclaimers are incompatible.
  *   **The Historical Note** says: "This text refers to reality, and I am liable for its accuracy." It accepts epistemic responsibility.
  *   **The Contemporary Disclaimer** says: "This text refers to nothing, and I accept no liability." It claims legal immunity through non-reference.
  *   **The Conflict:** You cannot simultaneously claim that your book is a reliable guide to the 19th century (by omission) and an imaginary construct (by copyright law). The publisher is protecting you from libel in the present while selling you as an authority on the past. They are running on different premises: one legal, one epistemological.

  ### 2. The Asymmetry of Confession
  Why confess dialogue but not interiority? Why confess meetings but not motives?

  **The Line Drawn:**
  The line is drawn at **Verifiability**, not **Violation**.
  *   **Dialogue:** There exist letters, minutes, transcripts. A reader *could* theoretically check. The confession protects you from the charge of incompetence or lying.
  *   **Interiority:** There is no record. A reader *cannot* check. The silence protects you from the charge of trespass.

  **The Presupposition:**
  This asymmetry presupposes that the primary sin of the historical novelist is **Falsity**, not **Ventriloquism**. It assumes the reader's primary concern is "Did this happen?" rather than "Did you have the right to imagine this?" It treats the dead as data points to be accurately rendered, not as subjects whose interiority is being colonized.

  **The Composite Claim:**
  You identified the strangest element: "Margaret is a composite." This is a truth claim disguised as a disclaimer. To say she is a composite of A and B is to assert knowledge of A and B. You are claiming authority over the historical record even as you disclaim fidelity to it. It creates a "super-truth"—the idea that your fiction captures the *essence* of the history better than the facts themselves. It is a rhetorical move that elevates the novel above the archive while pretending to serve it.

  ### 3. Required vs. Underdetermined
  **Strictly Required by the Theory:**
  *   **The Admission of Fabrication:** If you claim referential truth, you must flag the falsehoods where evidence exists.
  *   **The Distinction:** You must separate the "found" form the "made."

  **Underdetermined (The Comfortable Fits):**
  *   **The Silence on Interiority:** A theory of "Ethical Ventriloquism" would require you to confess this. A theory of "Total Reconstruction" would not. The current note fits both, which proves it is ethically vague.
  *   **The Tone:** The note can be apologetic ("I'm sorry I lied") or triumphant ("I fixed the gaps"). The practice allows both.
  *   **The Composite:** You could say "Margaret is fictional" or "Margaret is real." "Composite" is a middle ground chosen for comfort, not logical necessity.

  Two different ethical frameworks produce the identical note:
  1.  **The Historian Manqué:** "I tried to be accurate, but the gaps forced me to invent."
  2.  **The Storyteller:** "I needed a character to drive the plot, so I stitched two dead people together."
  The reader cannot tell the difference, which means the note fails to disclose the author's actual relationship to the truth.

  ### 4. The Three Alternatives
  If you changed your underlying theory, the note would have to change drastically.

  **Alternative A: Novels Assert Nothing (Fictionalism)**
  *   **The Note:** It would vanish. Or, it would become a "Maker's Note" on aesthetics. "I invented the dialogue for rhythm." "I changed the season for mood." It would discuss craft, not fact. It would treat the history as set dressing, not a claim.
  *   **Result:** No warranty. No expectation of truth.

  **Alternative B: Biographical Duty (The Historian's Oath)**
  *   **The Note:** It would become an apparatus. "Chapter 3, Page 42: Dialogue reconstructed from Letter X, dated Nov 4." "Chapter 9: Riot details from Municipal Ledger Y." It would cite sources for what is *true*, not just what is false.
  *   **Result:** High epistemic responsibility. The novel becomes a popularized history.

  **Alternative C: The Wrong is Ventriloquism (Ethical Trespass)**
  *   **The Note:** It would focus on presence, not fact. "I have imagined Margaret's thoughts. She cannot consent to this. I have done so to explore X theme." It might include excerpts of what the real person actually wrote, to contrast your voice with theirs.
  *   **Result:** An apology for speaking, not a correction of facts.

  ### 5. The Blunt Truth: The Permission Slip
  You asked for bluntness. **Yes.**

  The afterword is a ritual purification that functions as a permission slip.

  By confessing to the small, verifiable sins (the dialogue, the meeting), you inoculate yourself against the charge of the large, unverifiable sin (colonizing the soul of the dead). It signals to the reader: *"I know the rules. I have acknowledged the boundary. Therefore, I am licensed to cross it."*

  It creates a **Coleridgean Suspension of Ethical Disbelief**. Just as the reader agrees to pretend the magic is real for the sake of the poem, the author agrees to pretend the facts matter for the sake of the note. Once the note is read, the contract is signed. The reader feels informed, the critic feels disarmed, and you are free to have invented the rest without guilt.

  It is not a disclosure; it is a transaction. You give them the "truth" about the dialogue, and they give you immunity on the interiority.

  **Recommendation for the Deadline:**
  You cannot solve this philosophical problem in three weeks. The convention is entrenched because it serves the market, not the truth. It allows the publisher to sell "History" while protecting them from "Libel."

  If you want to be honest without breaking the contract:
  1.  **Keep the confessions of fact.** (Dialogue, meetings). This satisfies the Referential Theory the readers expect.
  2.  **Add one sentence on interiority.** "Where the record is silent, I have imagined." This acknowledges the ventriloquism without apologizing for it.
  3.  **Drop the composite claim unless necessary.** If Margaret is a vehicle for theme, call her a vehicle. If she is a stand-in for history, call her a composite. Don't use it to have it both ways.

  The note will not save you from the reviewers who quote it as a warranty. That is a risk inherent in the form. But understanding that the note is a license, not a ledger, might make writing it less strange. You are not confessing; you are negotiating.
