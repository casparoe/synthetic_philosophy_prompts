      *   *Self-Correction during drafting:* I need to make sure I don't just say "you're right." I need to explain *why* the mechanism works the way it does. The point about the "composite" being a truth claim is crucial. The distinction between *epistemic* duty (history) and *ethical* duty (the dead) needs to be clear.

  5.  **Final Review against Prompt:**
