answer: |-
  **DRAFT v.4 — JOINT STATEMENT ON HIGHWAY AGENCY**
  **Date:** Oct 14
  **Parties:** E. (Retention) / J. (Dissociation)
  **Status:** Pending final wording on Crux 3

  Look, we're not going to publish this as a paper. We're just trying to stop emailing each other at 3 AM. The goal here is to map exactly where the fight is so we don't have to rehash the physics every time. We agree on the car. We agree on the road. We disagree on the ghost in the machine.

  ### I. AGREED CLAIMS (Both sides sign)

  1.  **Physical Continuity:** During the "absent-minded" phase (zoning out), the vehicle remains in motion, controlled by the driver's motor systems. No external agent takes the wheel.
  2.  **The Wake-Up:** There is a distinct phenomenological moment where the driver realizes they have deviated from the planned route (or are unsure of their location). Both sides agree this moment exists and is reportable.
  3.  **Correction Frequency:** In real-world conditions (not just thought experiments), drivers frequently correct course after the Wake-Up moment. They do not simply crash or drive forever.
  4.  **Memory Gap:** During the zoning-out phase, the driver cannot verbally report their current location or immediate intention if queried.
  5.  **Outcome Variance:** Sometimes the driver arrives at the intended destination despite the zoning out. Sometimes they do not.

  ### II. DISAGREEMENTS TABLE (Wording Split)

  *Where we use different words for the same mechanic.*

  | Feature | Retentionist Wording (E.) | Dissociationist Wording (J.) |
  | :--- | :--- | :--- |
  | **Status of Goal** | The intention is *latent* but active. | The intention is *suspended*; only habits are active. |
  | **The "Self"** | The self is monitoring peripherally. | The self is offline; the motor loop is running shadow-mode. |
  | **Error Detection** | The latent intention flags the mismatch. | The sensory input fails to match the heuristic script. |
  | **Agency** | Agency is continuous but dimmed. | Agency is interrupted and resumed later. |

  ### III. THE THREE CRUXES

  **Crux 1: The Turn-Around**
  *Scenario:* Driver misses exit, realizes 2 miles later, makes a U-turn.
  *   **Retentionist Claim:** The U-turn proves the intention never left. It was pulling on the reins the whole time. The tension is what caused the Wake-Up.
  *   **Dissociationist Claim:** The U-turn is post-hoc repair. The Wake-Up was a surprise ("Wait, I'm lost?"), and the U-turn is a new decision made *after* agency resumed. The prior intention was dead; this is a respawn.

  **Crux 2: Enviromental Scaffolding**
  *Scenario:* Driver follows signs without thinking.
  *   **Retentionist Claim:** Signs are tools used by the intention. The driver is still "using" the signs to fulfill the plan, even if not looking at them consciously.
  *   **Dissociationist Claim:** The signs are doing the work, not the driver. The road script replaces the internal plan. If the signs were swapped, the driver would follow the wrong ones. That proves the plan isn't internal.

  **Crux 3: The "Ghost Route" Test Case**
  *Scenario:* Driver intends to go to **Location A** (via Highway 9). She zones out, misses the Highway 9 exit. Without waking up or realizing she missed it, she navigates a complex series of backroads (Old Mill Rd → Route 66 → Main St) that *also* lead to Location A, but only if you turn left at the specific stop sign on Route 66. She makes the turn. She arrives at Location A. She claims she has no memory of choosing the backroads.

  *   **Retentionist Prediction:**
      She knew. Not consciously, but the goal state (Location A) was still constraining the search space. The turn at Route 66 wasn't luck; it was the latent intention overriding the habit to go straight. If we test her reaction time at that stop sign, she'll show priming for "Left."
      *Verdict:* Agency survived the blackout.

  *   **Dissociationist Prediction:**
      She didn't know. The backroads are high-salience cues (big trees, specific lighting) that trigger a "Homeward" heuristic learned years ago. The turn at Route 66 was automatic pattern completion, not navigation toward a specific goal. If we move the stop sign 50 yards, she'll miss the turn.
      *Verdict:* Agency was offline; success was environmental luck + muscle memory.

  ***

  **Notes for revision:**
  *   J. wants to change "Agency was offline" to "Executive control was disengaged." (Fine by me).
  *   E. insists on keeping "latent intention" in Crux 3.
  *   Need to decide if we actually run the Ghost Route sim or just leave it theoretical. [Check budget]

