  *   **The Collision:** You want CoT to be a "faithful report" (6) but refuse to "optimize the model's stated chain of thought" (3).
  *   **Why it breaks:** Faithfulness is not a default state; it is a property you must select for. If you apply no training pressure to the CoT (as 3 suggests), the model will optimize the CoT solely for whatever correlates with the final answer reward, which is usually plausibility, not faithfulness.
  *   **What has to give:** You must accept that achieving (6) requires explicit optimization pressure on the CoT structure/content.
