  1. Setup and materials (about 120 words): room layout, what's on the table, group split, anything they need.
  Arrange desks in a horseshoe so everyone faces the centre. You'll need 14 sealed manila envelopes, two decks of coloured cards (red and blue), and a pot of coffee vouchers (worth £5 each). Place a 'Bank' box front. Each student gets a personal 'Ledger' sheet and a pen. Keep the envelopes opaque; the act of sealing them is crucial. Keep scissors or a shredder handy for destruction. Ensure lighting is decent so they can read cards inside envelopes. The vibe should be transactional but slightly ceremonial—this isn't a quiz, it's a commitment ceremony. Keep everything in a tote bag.

  2. Rules, roles and token payoffs (about 220 words): round-by-round choices, the physical actions, the token economy with small stakes only (coffee vouchers or course credit points), no computers.
  Round One: Students choose Option Alpha (guaranteed voucher) or Option Beta (90% chance voucher, 10% nothing). They write their choice, seal it in an envelope, and hand it to the Bank. Tell them this envelope is now 'history'. Round Two: Present Option Gamma and Delta. These look like Alpha and Beta but with a 'common backstory' card attached that says '89% chance nothing'. Normally, you'd cancel this out. Instead, make them physically attach this card to their Round One envelope before choosing Round Two. Then, ask them to rip off the common card to compare Gamma vs Delta. They must choose again. Payoffs: If their sealed envelope matches the draw, they get the voucher. If they reverse their preference between rounds (Alpha over Beta, but Delta over Gamma), they enter a 'Consistency Check'. Here's the twist: to claim the Round Two prize, they must physically shred the Round One envelope unopened. This destroys the 'past self's' commitment. Tokens are awarded immediately upon valid completion. No phones, no calculators. Just pens, paper, and the visceral act of sealing versus shredding. Ensure the probabilities are written clearly on the cards to avoid arithmetic disputes distracting from the physical choice.

  3. The moment they feel it (about 180 words): map the precise moments in the activity onto narrative-continuity resistance — where the shared component becomes part of their story and tearing it out feels wrong.
  The friction hits during the Consistency Check. They've sealed Round One as a concrete fact—a narrative chapter closed. When Round Two asks them to mathematically cancel the common component, you're asking them to treat that sealed envelope as irrelevant noise. But it's physically there. When you demand they shred the Round One envelope to validate the Round Two choice, they hesitate. It's not about probability anymore; it's about vandalising their own prior commitment. The 'common component' isn't just a number; it's the glue holding their decision story together. Tearing it out feels like retroactive editing, like changing the past to suit the present. They'll feel a pang of irrational loyalty to the sealed paper. It feels like breaking a promise to themselves. That discomfort is the independence axiom breaking. They aren't rejecting the math; they're resisting the erasure of their own agency's history. The physical destruction makes the abstraction deeply visceral. Suddenly they truly realise cancelling the common consequence isn't neutral; it's an act of narrative betrayal. They perceive the cancellation not as simplification, but as loss.

  4. Debrief (about 200 words): how you name the axiom, connect to Allais, and discuss the narrative twist without just lecturing.
  Gather everyone back. Ask who swapped preferences between rounds. Expect hands. Ask *why* they hesitated at the shredding. Introduce the Independence Axiom: if you prefer A over B, you should still prefer A over B even if both are mixed with a common probability. Explain that Allais showed people violate this. But don't stop at risk aversion. Pivot to their experience: did the sealed envelope feel like a 'fact' rather than a probability? Suggest that rational choice theory assumes preferences are ahistorical, but their hesitation suggests decisions are narrative arcs. We don't just maximise utility; we maintain coherence with our past selves. The 'common consequence' isn't neutral because it anchors the story. Write 'Narrative Continuity' on the board. Ask if rationality should demand we ignore our own history. Let them argue whether the axiom is a bug or a feature of human agency. Keep it dialogic. Let the tension between mathematical consistency and narrative integrity sit for the final ten minutes. Ask them to reflect.

  5. What will definatly go wrong first time (about 120 words): predictable failures, how to handle them, what to say if they just shrug.
  Students will treat shredding as a joke, thinking it's a trick to deny vouchers. Some will try to peek inside sealed envelopes. Others will shrug: 'it's just paper'. If they refuse the physical act, the emotional weight vanishes. Be firm: 'No shred, no payoff.' If they claim caring is irrational, agree—that's the point! But insist they perform the action to unlock the second round. Watch out. Confusion over probability cards is risky; keep numbers simple (100%, 89%, 11%). If math gets messy, they'll blame calculation, not narrative. Watch for cynics gaming the system; pair them with a sceptic. If everyone shrugs, ask them to imagine the envelope contained a secret they told a friend.

  6. The feature this can't reproduce (about 100 words): be honest about which aspect of real preference reversal the game misses and you have to supply verbally.
  This forces reversal via physical obstruction, whereas real Allais violations happen internally. Students might feel resistance because you *made* them shred paper, not because they naturally weigh narratives that way. It externalises a cognitive bias. Stakes are too low to trigger genuine loss aversion; the 'narrative' might just be proxy for suspicion of the instructor. Bridge the gap between 'I don't want to shred this paper' and 'I don't want to invalidate my past self's probability assessment'. The game proves the feeling exists, not that it's a very robust decision-theoretic principle.
