          *   Need 14 students. Split into pairs or small groups? Pairs might work best for interaction, but individual choice is key for decision theory. Let's do individual choices but with physical props.
          *   Materials: Envelopes, cards, tokens (coffee vouchers/points), pens.
          *   Room: Seminar table or clustered desks.
          *   Word count check: Aim for ~120.
          *   *Draft:* Arrange desks in a horseshoe so everyone faces the centre. You'll need 14 sealed manila envelopes, two decks of coloured cards (red and blue), and a pot of coffee vouchers (worth £5 each). Place a 'Bank' box at the front. Each student gets a personal 'Ledger' sheet and a pen. Keep the envelopes opaque; the act of sealing them is crucial. You'll also need a pair of scissors or a shredder handy for the destruction phase. Ensure the lighting is decent so they can read the cards inside the envelopes without squinting. The vibe should be transactional but slightly ceremonial—this isn't a quiz, it's a commitment ceremony. Keep everything in a single tote bag for portability since the room is awkward.

      *   **2. Rules, roles and token payoffs:**
          *   Need to simulate Allais paradox structure but with the narrative twist.
          *   Round 1: Choose between A (Sure thing) and B (Gamble).
          *   Round 2: Choose between C and D (where the common consequence is removed/changed).
          *   Physical action: Sealing envelopes represents commitment. Tearing/shredding represents the "cancellation" of the common component.
          *   Word count check: Aim for ~220.
          *   *Draft:* Round One: Students choose Option Alpha (guaranteed voucher) or Option Beta (90% chance voucher, 10% nothing). They write their choice, seal it in an envelope, and hand it to the Bank. Tell them this envelope is now 'history'. Round Two: Present Option Gamma and Delta. These look like Alpha and Beta but with a 'common backstory' card attached that says '89% chance nothing'. Normally, you'd cancel this out. Instead, make them physically attach this card to their Round One envelope before choosing Round Two. Then, ask them to rip off the common card to compare Gamma vs Delta. They must choose again. Payoffs: If their sealed envelope matches the draw, they get the voucher. If they reverse their preference between rounds (Alpha over Beta, but Delta over Gamma), they enter a 'Consistency Check'. Here's the twist: to claim the Round Two prize, they must physically shred the Round One envelope unopened. This destroys the 'past self's' commitment. Tokens are awarded immediately upon valid completion. No phones, no calculators. Just pens, paper, and the visceral act of sealing versus shredding.

      *   **3. The moment they feel it:**
          *   Focus on the shredding/tearing moment.
          *   Narrative continuity: The sealed envelope is a past promise. Shredding it feels like betraying that narrative.
          *   Word count check: Aim for ~180.
          *   *Draft:* The friction hits during the Consistency Check. They've sealed Round One as a concrete fact—a narrative chapter closed. When Round Two asks them to mathematically cancel the common component, you're asking them to treat that sealed envelope as irrelevant noise. But it's physically there. When you demand they shred the Round One envelope to validate the Round Two choice, they hesitate. It's not about probability anymore; it's about vandalising their own prior commitment. The 'common component' isn't just a number; it's the glue holding their decision story together. Tearing it out feels like retroactive editing, like changing the past to suit the present. They'll feel a pang of irrational loyalty to the sealed paper. That discomfort is the independence axiom breaking. They aren't rejecting the math; they're resisting the erasure of their own agency's history. The physical destruction makes the abstraction visceral.

      *   **4. Debrief:**
          *   Name the axiom (Independence).
          *   Connect to Allais.
          *   Discuss narrative twist.
          *   No lecturing, guide discussion.
          *   Word count check: Aim for ~200.
          *   *Draft:* Gather everyone back. Ask who swapped preferences between rounds. Expect hands. Ask *why* they hesitated at the shredding. Introduce the Independence Axiom: if you prefer A over B, you should still prefer A over B even if both are mixed with a common probability. Explain that Allais showed people violate this. But don't stop at risk aversion. Pivot to their experience: did the sealed envelope feel like a 'fact' rather than a probability? Suggest that rational choice theory assumes preferences are ahistorical, but their hesitation suggests decisions are narrative arcs. We don't just maximise utility; we maintain coherence with our past selves. The 'common consequence' isn't neutral because it anchors the story. Write 'Narrative Continuity' on the board. Ask if rationality should demand we ignore our own history. Let them argue whether the axiom is a bug or a feature of human agency. Keep it dialogic.

      *   **5. What will definitely go wrong first time:**
          *   Predictable failures: Students treating it as a trick, not shredding, confusion over rules.
          *   How to handle: Be firm on physical actions.
          *   Word count check: Aim for ~120.
          *   *Draft:* Students will treat the shredding as a joke or refuse to do it, thinking it's a trick to deny them vouchers. Some will try to peek inside the sealed envelopes. Others will shrug and say 'it's just paper'. If they refuse the physical act, the emotional weight vanishes. Be firm: 'No shred, no payoff.' If they claim it's irrational to care about the paper, agree—that's the point! But insist they perform the action to unlock the second round. Another risk is confusion over the probability cards; keep the numbers simple (100%, 89%, 11%). If the math gets messy, they'll blame the calculation, not the narrative. Watch for the cynics who game the system; pair them with a sceptic to monitor fairness. If everyone shrugs, ask them to imagine the envelope contained a secret they told a friend.

      *   **6. The feature this can't reproduce:**
          *   Limitation: Real stakes vs. experimental stakes. Or the fact that Allais is usually about certainty vs. risk, not just narrative.
          *   Actually, the prompt asks about "real preference reversal". The game misses the *unconscious* nature of it. Here it's forced.
          *   Word count check: Aim for ~100.
          *   *Draft:* This setup forces the reversal through physical obstruction, whereas real Allais violations happen internally and instantly. Students might feel the resistance because you *made* them shred paper, not because they naturally weigh narratives that way in real life. It externalises an internal cognitive bias. Also, the stakes are too low to trigger genuine loss aversion; the 'narrative' might just be a proxy for suspicion of the instructor. You'll need to verbally bridge the gap between 'I don't want to shred this paper' and 'I don't want to invalidate my past self's probability assessment'. The game proves the feeling exists, not that it's a robust decision-theoretic principle.

