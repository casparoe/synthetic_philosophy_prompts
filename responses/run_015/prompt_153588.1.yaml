answer: |-
  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** November 7, 2023
  **SUBJECT:** Decision Rule Recommendation and Allocation Strategy for Current Cycle

  **Recommendation**

  I recommend we adopt the **Revised Framework** for this cycle's allocation decisions. This revision adjusts our standard importance × tractability × neglectedness model to account for counterfactual displacement and marginal tractability. Based on this rule, I propose the following allocation of the $4.2M budget: **Cause B (50%), Cause A (45%), Cause C (5%)**.

  This allocation prioritizes the building code litigation (B) as our highest marginal impact opportunity while retaining significant exposure to the micronutrient program (A) due to its evidentiary strength. It minimizes exposure to the systemic risk research (C) due to diagnostic neglect. We will reconvene for a formal review on May 14. At that review, we will re-score Causes A and B; the ordering will change only if new data demonstrates Cause A's government displacement is below 40% or Cause B's litigation pathway has stalled irretrievably.

  **The Case for Revision**

  The original framework identified Cause A as the clear winner. However, that calculation treats a granted dollar as having full face value regardless of what it replaces. Our staff estimates 60% displacement for Cause A: for every $100 we grant, the government reduces its own spending by $60. The original framework treats this as a tractability issue, but it is fundamentally a neglectedness issue. It does not matter how little is currently spent on a cause (standard neglectedness) if our entry simply frees up other actors to spend less.

  The Revised Framework replaces standard neglectedness with *counterfactual neglectedness*. This asks: how little would be spent if we did not act? This is not model-tuning; it is correcting a measurement error in the input data. Similarly, splitting tractability into average vs. marginal acknowledges the arithmetic of diminishing returns, which is settled science. A cause may be tractable at $100k and intractable at $10M. Scoring based on the actual funding level prevents us from overloading efficient channels until they break.

  **Engaging the Evidence-Strength Objection**

  Our board member's objection—that frameworks are priors in numerical clothing and that we should fund based on direct evidence strength (the Evidence-Strength Rule)—is the strongest critique available. She is correct that flexibility invites manipulation. If we can redefine factors until the model outputs our preferred intuition, the framework is not a decision rule; it is a justification engine. Under the Evidence-Strength Rule, Cause A wins comfortably because its causal pathway is short and measured.

  However, the Evidence-Strength Rule contains its own hidden model. It assumes that "strength of evidence" correlates perfectly with "impact per dollar." This ignores the counterfactual. Funding a proven intervention that displaces government funding may have lower impact than funding a less-proven intervention that unlocks new capital. To ignore displacement because it is hard to measure is to privilege legibility over reality. We should not accept a rule that systematically overvalues interventions where benefits are easily measurable (A) and undervalues systemic changes (B) simply because the latter are harder to model. The risk of gaming the Revised Framework is real, but the risk of ignoring displacement under the Evidence-Strength Rule is certain.

  **Limitations and Risks of the Revision**

  We must be clear about where the Revised Framework is vulnerable to the charge of rigging.

  First, **separability may fail.** The framework assumes importance, tractability, and neglectedness are independent variables we can multiply. In reality, they are correlated. Neglect is often evidence of low tractability. Cause C's high neglectedness is flagged as "diagnostic"—others tried and failed. My revision attempts to correct for this by distinguishing informational vs. diagnostic neglect, but that distinction is itself a judgment call. I am extrapolating beyond staff numbers here; there is no consensus formula for weighting diagnostic neglect.

  Second, **legibility bias remains.** Even with revisions, the framework favors causes where benefits are quantifiable. Cause B's impact (reduced pollution via code changes) is systemic and diffuse compared to Cause A's (micronutrients delivered). We risk favoring B not because it is better, but because the revision allows us to discount A's displacement in a way that feels rigorous but relies on subjective estimates. I acknowledge that moving Cause B to first place relies heavily on the assumption that the litigation pathway is not a dead end. This is contested among people who work on policy change; some argue such pathways are almost always bottlenecked by enforcement, not code quality.

  **Implementation and Review**

  To discipline the flexibility of the Revised Framework, we must bind ourselves to specific review criteria. The allocation above is not static.

  1.  **Six-Month Review (May 14):** Program staff will update the displacement estimate for Cause A and the litigation milestone status for Cause B.
  2.  **Trigger for Reallocation:** If Cause A's displacement is verified at <40% through government budget documentation, we shift 20% of the budget from B to A. If Cause B fails to secure a preliminary ruling or draft standard by May, we shift 30% of the budget from B to A.
  3.  **Cause C:** The 5% allocation is seed funding contingent on a specific research output. If no principal investigator is secured by January, these funds revert to the Cause A pool.

  **Conclusion**

  We cannot avoid using a model. The Evidence-Strength Rule is a model that weights evidence quality infinitely higher than counterfactual impact. The Original Framework is a model that ignores displacement. The Revised Framework is a model that attempts to measure counterfactuals but introduces subjectivity. Given our mandate to maximize impact per dollar, ignoring displacement is the greater error. We should adopt the revision, but we must treat the scores as estimates subject to strict verification, not as immutable truths.

  \answer{adopt revision; A: 45%, B: 50%, C: 5%}
