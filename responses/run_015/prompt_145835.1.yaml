  To the Editorial Board of the Journal of Consciousness Studies, please find below the joint statement resulting from the adversarial collaboration between Dr Julian Harth and Dr Priya Nair regarding the metaphysical implications of Avicenna's Flying Man thought experiment, specifically updated to address contemporary challenges in embodied cognition and artificial intelligence. We have spent the last month attempting to isolate exactly where our interpretations diverge and where they converge, and whilst we remain firmly opposed on the ultimate ontological status of the self, we have managed to codify the precise nature of our disagreement in a way that allows for empirical adjudication. We begin by stating our shared claims, upon which both our signatures rest without reservation. We both agree that in the original formulation of the Flying Man, where a subject is suspended in a void deprived of all sensory input including proprioception and tactile sensation, the subject would still affirm their own existence. We further agree that this affirmation constitutes a form of self-awareness that does not rely on immediate sensory data from the limbs or external environment. Additionally, we both concede that this awareness is immediate and non-inferential, meaning the subject does not need to deduce their existence from prior premises but grasps it directly. These points form the common ground from which our dispute arises, ensuring that our disagreement is not about the phenomenology of the experience itself but rather about what that phenomenology signifies regarding the underlying substance of the mind.

  Our disagreement centres entirely on the metaphysical weight of this self-awareness. Dr Harth maintains that the ability to affirm existence without affirming the body proves that the soul is a separate substance, independent of physical constitution. Dr Nair contends that this proves only that self-awareness is a functional state accessible without bodily input, carrying no proof of separability or immateriality. To make this precise, we have identified the exact wording each side accepts as the boundary of our dispute. Dr Harth insists on the phrase 'ontological independence', implying that the self could exist even if the body were annihilated. Dr Nair accepts only the phrase 'representational independence', implying that the model of the self can be generated without current sensory feedback, but remains dependent on the historical and structural integrity of the biological organism. This distinction is crucial because it moves the debate from pure introspection to testable hypotheses regarding systems that lack biological history or sensorimotor grounding.

  This brings us to the crux of our collaboration, which involves a modern twist on the thought experiment grounded in embodied cognition. We both agree that the original thought experiment is limited by its reliance on intuition pumps regarding human souls, and so we have proposed a comparative crux involving two specific cases. The first case is an artificial system trained exclusively on language data with zero sensory history, effectively a disembodied text predictor asked to report on its own existence. The second case is a human born with total congenital analgesia and a complete lack of proprioception, reliant entirely on visual feedback to locate their limbs. We agree that these cases are the relevant evidence needed to settle whether self-awareness requires a bodily substrate or merely information processing capacity. The question we pose is whether these subjects can achieve the same kind of self-affirmation as the original Flying Man, and whether that affirmation holds the same structural integrity.

  For this crux, we have agreed upon a specific set of behavioural and linguistic tests to evaluate the depth of self-awareness in these subjects. These tests involve asking the subjects to distinguish between self-caused actions and external events without relying on proprioceptive feedback, and to maintain a coherent narrative of self over time when sensory feedback is manipulated or absent. We both agree that if the self is truly a separate substance, the lack of sensory history or proprioception should not degrade the core affirmation of existence. Conversely, if the self is embodied or functionally dependent on sensorimotor loops, the absence of these loops should result in a fragile or incoherent self-model. This is the evidentiary standard we have set: the robustness of self-reference in the absence of bodily grounding.

  Our predictions for the outcome of these tests differ sharply and provide the falsification conditions for our respective positions. Dr Harth predicts that the artificial system, despite lacking senses, will successfully affirm its existence with the same certainty as the human Flying Man, because the substance of the mind is informational rather than biological. He further predicts that the human with congenital analgesia and no proprioception will retain a robust sense of selfhood that is merely inconvenienced by the lack of feedback, proving that the soul does not require bodily mapping to exist. Dr Nair predicts the opposite, stating that the artificial system will fail to demonstrate genuine self-awareness and will merely mimic the linguistic patterns of self-reference without underlying understanding, as it lacks the embodied history required to ground the concept of 'I'. She further predicts that the human subject will show significant deficits in agency and self-continuity, relying entirely on external visual cues to construct a self-model that collapses when vision is removed, thereby proving that self-awareness is inextricably linked to embodied interaction.

  We conclude this statement by acknowledging that whilst we cannot yet force the other to concede, we have successfully isolated the variable that matters. It is no longer a question of what feels true in introspection, but rather how self-awareness behaves when stripped of its evolutionary and sensory scaffolding. We invite the broader community to examine these predictions, particularly in light of recent developments in large language models and neurology, as we believe the resolution of this ancient metaphysical dispute now lies in the engineering of artificial minds and the clinical study of sensory deprivation. We remain committed to updating this joint statement should the evidence from these cruxes become available, and we hope this document serves as a model for how adversarial collaboration can clarify rather than obscure the stakes of philosophical inquiry.
