answer: |-
  Two field stations, Ridge and Valley, were ranked by "Endangered Detections per Month" to decide next year's funding. Both stations genuinely improved conservation outcomes: Ridge optimized survey routes, boosting detections by 50% while maintaining stable populations; Valley located a critical nesting site, preventing extinction, but detections rose only 5% because the birds remained hidden. Ridge's team, acting conscientiously, shifted effort to high-visibility areas to secure the metric, while Valley's team sacrificed countable data for protective silence. When administration awarded the expansion grant to Ridge based on the detection numbers, Valley was forced to close, and the nesting site was lost to development. The aggregate detection count had risen across the network, correctly signaling overall activity, but using it to pick between stations actively destroyed the only unit ensuring long-term survival.

  ***

  ### The Three Verdicts

  1.  **The measure was gamed:** Ridge redirected effort from "finding birds" to "finding *countable* birds." This wasn't fraud; they recorded real animals in real places. But anyone in the field knows they abandoned the hard-to-survey habitats where the metric is expensive to earn, optimizing for the score rather than the ecological coverage.
  2.  **Reality improved more than the number:** Valley prevented extinction (an infinite gain in conservation value) with only a 5% rise in detections. Across the system, the species was saved, but the total detection count only showed a moderate uptick. The number understates the improvement because the most valuable work (protection) produces the least visible data.
  3.  **The decision was worse than a coin flip:** Funding based on the metric guaranteed Valley's closure and the species' loss (0% success). A random coin flip would have given Valley a 50% chance of survival. The metric didn't just fail to help; it actively selected for the option that guaranteed failure.

  ### The Single Feature Doing the Work
  **Heterogeneous Marginal Value.**
  The metric (detections) has a fixed cost per unit, but the *value* of each unit varies wildly between contexts. In Ridge's context, a detection represents routine monitoring (low value). In Valley's context, a detection represents the brink of extinction (extreme value). The metric assumes a linear relationship between "count" and "conservation worth," but the reality is non-linear.

  ### If You Remove That Feature
  If both stations faced identical ecological challenges (e.g., both monitoring stable, common populations), then a detection at Ridge would equal a detection at Valley in terms of conservation value. In that homogeneous environment, the metric would correctly identify the more efficient station, and funding Ridge would actually maximize total output. The harm arises specifically because the metric cannot distinguish between *easy* value and *critical* value.

  ### The Defense (How a Proponent Wrings Out of It)
  "We cannot fund based on 'prevented extinction' because that is counterfactual and speculative. We need objective, auditable data. Ridge demonstrated efficiency and capacity; Valley produced almost no data despite equal funding. If we reward low counts, we incentivize hiding data. The metric isn't perfect, but it's the only one that prevents units from claiming imaginary successes."
