  *   Resemblance/Particulars → **Q5**

  **Q5:** Consider two performances of the same score. Is similarity brute or based on property-instances?
  *   Brute (Particulars) → **8. Resemblance Nominalism** (Resembles nothing shared).
  *   No explanation → **9. Ostrich Nominalism** (Ignores explanatory gap).
  *   Instances + Primitive Resemblance → **10. Trope Theory (Primitive)** (Resemblance is unanalyzable).
  *   Instances + Resemblance Classes → **11. Trope Theory (Class)** (Circularity risk).
  *   *(Unoccupied: Instances without resemblance; incoherent grouping).*

  **Refusal:** If a reader refuses a node, route them to the nearest Quietist leaf; persistent refusal indicates Quietism.

  **Indistinguishable Leaves:** Aristotelian Realism (5) and Trope Theory (Class) (11) often converge. Separate using a case of uninstantiated laws (e.g., a physical law never yet manifested). Class (7) and Resemblance Nominalism (8) are also close; separate using a case of single-instance kinds (can a class of one exist?).

