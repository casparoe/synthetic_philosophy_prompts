      *   **Follow-up 2 (Two Passes):**
          *   *Plain:* The statement "It will crash" was false at 17:00 *because* you would patch at 23:00. The truth includes the patch.
          *   *Code:* Think of the universe as a function `run_world(state_1700)`. The return value (crash/no crash) is determined by the input. The input *includes* the patch merge at 23:00. The value isn't "already there" ignoring the patch; the value is the result of computing the function *with* the patch as part of the input flow. The return value exists logically relative to the full input, but causally depends on the lines of code executed in between.

  5.  **Refining the "Code" Analogy:**
