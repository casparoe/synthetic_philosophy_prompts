          *   **Crucial:** Take a committed stance on *one* single desideratum that eliminates the most popular narratives and explain why.
      *   **Constraints:** No bibliographies, no citations, no "ask me to cite anyone." The user is on a plane (no wifi).
      *   **Tone:** Analytical, philosophical, committed, rigorous.

  2.  **Deconstruct the Ontological Problem:**
      *   Historical periods are not natural kinds (like "gold" or "electron"). They are interpretive constructs layered over traces.
      *   The core tension is between *emic* (insider) perspectives and *etic* (outsider/analyst) perspectives.
      *   The "Victorian Invention" critique suggests these periods are teleological (designed to make the present look superior).
      *   To avoid "pure projection," a period needs to do more than just organize data; it needs to track structural changes.

  3.  **Drafting the Desiderata List (Iterative Process):**

      *   *Idea 1: Contemporary Awareness.* Do people know they are in it?
          *   *Refinement:* No, that's too strict. People in 1990 didn't know they were in "The Nineties" in a historical sense. This is the category error mentioned in the prompt.
      *   *Idea 2: Causal Cohesion.* Does the period hang together causally?
          *   *Refinement:* Yes, events inside should explain each other better than events outside.
      *   *Idea 3: Boundary Definition.* When does it start/end?
          *   *Refinement:* Must allow for fuzziness. Sharp boundaries are usually fake.
      *   *Idea 4: Global Applicability.* Does it work everywhere?
          *   *Refinement:* This is the trap. "Middle Ages" is Eurocentric. Demanding global coherence kills the concept. Regional variation is necessary.
      *   *Idea 5: Predictive/Explanatory Power.* Does labeling it help explain *why* things happened?
          *   *Refinement:* This is the strong one. If the label is just a file folder, it's weak. If it's an engine, it's strong.

  4.  **Addressing Specific Prompt Questions:**
      *   *Contemporary Concept:* It's a category error to demand it. Periods are retrospective pattern recognition.
      *   *Global Coherence:* Regional variation is okay. Demanding global coherence forces Eurocentrism.
      *   *Distinctions:* Shorthand (teaching tool) vs. Causal (ontological claim). Boundary (transition zone) vs. Sharp Boundary (event).
      *   *Non-negotiable vs. Camp:* Continuity vs. Discontinuity is a camp preference. Causal utility is non-negotiable.
