answer: |-
  Your diagnosis is sharper than most papers on the topic. You are not confused; the field is.

  Here is the honest assessment you asked for: **This is a hybrid disagreement. It is partly verbal (boundary-drawing), partly teleological (competing explanatory goals), and partly empirical (lacking the right data).**

  If you stay within the current methodological framework (armchair intuition-pumping about embeddings), **no significant progress should be expected.** Here is why.

  ### 1. The Verbal Core: The Semantics/Pragmatics Boundary
  Your hypothesis is correct: a massive chunk of this stalemate is verbal. The dispute is not primarily about the *phenomena* (everyone agrees slurs offend, project, and harm); it is about **ontological bookkeeping**.

  *   **Camp 1 (Truth-Conditional)** defines "semantics" as "what determines truth conditions." Since slurs seem to make sentences true/false differently than neutral terms (or at least carry a commitment), they put the derogation there.
  *   **Camp 2 (CI/Presupposition)** defines "semantics" as "encoded linguistic meaning that isn't necessarily truth-conditional." They want to capture the "stickiness" of the slur (its inability to be cancelled) without ruining the truth conditions of belief reports.
  *   **Camp 3 (Pragmatics)** defines "semantics" as "context-invariant lexical content." Since the *same* group is referred to by the slur and the neutral term, they argue the lexical entry is identical, and the difference is entirely in the *use*.

  **The Problem:** There is no agreed-upon criterion for where semantics ends and pragmatics begins. Grice gave us a test (cancellability), but slurs famously break the test (they resist cancellation). So Camp 2 says "Aha! Conventional Implicature!" and Camp 3 says "Aha! Deep-seated Pragmatic Norm!" They are using the same data to justify different carve-ups of the mind/language interface. Until the group agrees on a *criterion* for the boundary (which general philosophy of language has failed to do for 50 years), you will just be spinning wheels.

  ### 2. The Teleological Split: What Are We Explaining?
  You suspected Camp 3 might be answering a different question. You are right. The camps are optimizing for different explanatory virtues.

  *   **Camps 1 & 2 are optimizing for *Logic and Embedding*.** They want a theory that explains why "He is not a [slur]" still feels offensive (projection) and why "He believes they are a [slur]" doesn't commit the speaker (opacity). They are trying to save a formal semantic system.
  *   **Camp 3 is often optimizing for *Reclamation and Variation*.** They are motivated by the fact that in-group usage *does* cancel the offense. If derogation were semantic (Camp 1) or conventional (Camp 2), reclamation should be impossible or require a change in the word itself. Camp 3 treats the word as a tool whose force depends on the user's authority and context.

  **The Conflict:** Camp 1/2 accuse Camp 3 of under-generating (failing to explain why the slur stings even in 'neutral' contexts). Camp 3 accuses Camp 1/2 of over-generating (failing to explain how reclamation works without changing the word). They are fighting over which data set is the "real" one to explain.

  ### 3. The Empirical Wall
  This is the hardest pill to swallow. You are circling the same embedding data because **armchair intuition is exhausted.**

  *   **Embedding Data is Underdetermined:** As you noted, everyone interprets "He claimed they are [slur]" differently. Camp 1 says the content is embedded but the speaker distances themselves. Camp 2 says the CI projects but the at-issue content is embedded. Camp 3 says the word is mentioned, not used. Introspection cannot settle this.
  *   **Missing Data:** To break this, you need external data.
      *   **Psycholinguistics:** Do slurs have longer processing times than neutral terms + negation? (Evidence for semantic encoding). Or are they processed like expletives? (Evidence for expressivism).
      *   **Neuroscience:** Do slurs trigger amygdala responses (emotional processing) distinct from neutral terms in a way that pragmatic insults do not?
      *   **Sociolinguistics:** Systematic data on reclamation. Does the offense diminish linearly with context, or is it binary?

  Without this, you are just comparing competing intuitions about "what it feels like" to hear a slur. That is subjective and culturally variable, which explains why nobody budges.

  ### 4. Is Camp 3 a "Serious" Position?
  Yes. Do not dismiss it. It is often associated with **Combinatorial Externalism** (Anderson) or **Contextualism** (context-sensitive semantics). However, the version you described ("neutral terms deployed with contempt") faces a serious challenge: **The Immediate Sting.**

  If Camp 3 were right, hearing a slur should feel like hearing "German" + a tone of voice. But many speakers report the slur carries a threat or violence that "German" + tone does not. Camp 3 struggles to explain why the *word itself* seems to carry the history of violence without encoding it semantically. If your group hasn't hammered on this specific intuition pump, Camp 3 hasn't fully earned its keep.

  ### Recommendation for the Reading Group
  If you want progress, you must change the game.

  1.  **Stop Arguing Semantics/Pragmatics:** Declare a moratorium on the label "semantic." It is doing no work other than signaling team allegiance.
  2.  **Shift to Mechanism:** Ask: "What is the *mechanism of harm*?"
      *   Is the harm caused by the *proposition expressed* (Camp 1)?
      *   Is it caused by the *display of allegiance* to a normative perspective (Camp 2/Expressivism)?
      *   Is it caused by the *activation of historical trauma* via association (Camp 3)?
      *   *Why this helps:* You can agree on the mechanism without agreeing on whether it counts as "semantics."
  3.  **Bring in Empirics:** Read one paper from psycholinguistics on slur processing (e.g., work by **Ciccarelli**, **Vigliocco**, or **Corneille**). If the brain processes slurs differently than pragmatic insults, Camp 3 is in trouble. If it processes them the same, Camp 1/2 are in trouble.
  4.  **Accept Intractability:** If you must stay armchair, admit that the semantics/pragmatics boundary is likely a false dichotomy for this phenomenon. Slurs might be a category error for standard truth-conditional semantics. They might be **hybrid expressives** that simply don't fit the Fregean box. Acknowledging that the *framework* is broken is more progress than forcing the data to fit it.

  **Verdict:** Your suspicion is correct. You are fighting a verbal battle over a boundary that doesn't exist in the world, fueled by different intuitions about which data (embedding vs. reclamation) matters most. Unless you import external evidence or shift the question from "Where is the meaning?" to "How is the harm effected?", you will be here next year too.
