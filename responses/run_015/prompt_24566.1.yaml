prompt: |-
  I retired last year after a long career in theoretical ecology, and over the past couple of years I've been reading philosophy of action and decision theory, which is where I ran into Herbert Simon's notion of satisficing. I have no trouble with the basic idea — that agents operating under real cognitive and informational constraints do not maximize but stop once an option crosses some acceptance threshold — but I keep hitting a debate in the literature that I cannot get a handle on, and I would like a diagnosis of it rather than a survey.

  As I read it, the dispute is over the status of satisficing as a rival to maximization. One camp, roughly the expected-utility and decision-theory side, treats satisficing as at best a descriptive caveat: it records how people in fact fall short of rational choice, but it is not a genuine theory of what rationality requires, because it never pins down where the threshold lies or how it is set, and so it cannot deliver the kind of determinate predictions that expected utility does. The other camp, the bounded-rationality tradition descending from Simon, treats satisficing as a positive account of rational decision-making: given the agent's real limits, a rational agent ought to search and stop in just the way satisficing describes, and the looseness of the threshold is a virtue, because it tracks the adaptive, context-sensitive way real agents actually calibrate their standards.

  In my own field I live with this tension every day. We build optimality models of foraging and reproduction that are useful only "as if" the animal were solving a clean optimization problem, and everyone knows the animal is not doing that. So I have a working hypothesis, offered only as a hypothesis: I suspect the impasse is largely about what the word "rational" is doing. One side means "normatively ideal," in which case satisficing cannot compete, and the other means "adaptively adequate given the constraints," in which case unconstrained maximization is the straw man. If so, the two camps are answering different questions under a single name, and "Is satisficing a real theory?" is ill-posed because it inherits the ambiguity.

  Could you diagnose what kind of disagreement this really is — verbal, substantive, empirical, or a hidden question about what a decision theory is for — using what each side actually argues rather than the labels they attach to themselves, and then tell me what, if anything, would count as progress: a distinction that separates the two senses of "rational," a formal result, an empirical test, or a reformulation of the question? And if you believe no progress is to be expected, I would like you to say why.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Retired theoretical ecologist. Familiar with optimality models ("as if" modeling), bounded rationality in biology, and the tension between idealization and reality. Recently reading philosophy of action and decision theory.
      *   **Core Issue:** The debate over Herbert Simon's *satisficing* vs. *maximization* (expected utility theory).
      *   **User's Hypothesis:** The impasse is verbal/semantic, stemming from different definitions of "rational" (normatively ideal vs. adaptively adequate).
      *   **Task:** Diagnose the *kind* of disagreement (verbal, substantive, empirical, meta-theoretical) based on arguments, not labels. Propose what would count as progress (distinction, formal result, empirical test, reformulation) or explain why no progress is expected.
      *   **Constraint:** Do not just survey the literature. Provide a *diagnosis*.

  2.  **Deconstruct the Debate (Mental Sandbox):**
      *   *Side A (Decision Theory/EUT):* Rationality = Consistency, Coherence, Maximization of Expected Utility. Satisficing is a heuristic, maybe useful descriptively, but normatively deficient because it can lead to money pumps or intransitive preferences depending on implementation. The threshold problem is fatal for normativity.
      *   *Side B (Bounded Rationality/Simon):* Rationality = Ecological validity, Success in environment given constraints. Maximization is computationally impossible or prohibitively costly. Satisficing is the *correct* normative rule for bounded agents.
      *   *The Friction:* Side A says Side B is describing psychology, not prescribing logic. Side B says Side A is prescribing logic for gods, not agents.
      *   *User's Insight:* The user suspects it's about the definition of "rational." This is strong. But is it *just* verbal?
      *   *Deep Dive:* If it were purely verbal, we could just say "Let's call one 'Ideal Rationality' and the other 'Ecological Rationality' and move on." But the fight persists. Why? Because there's a substantive claim hidden underneath: *Does the cost of computation count as part of the utility function?*
      *   *The "Hidden" Question:* Is decision theory about *choices* or about *search procedures*? EUT usually takes the option set as given. Satisficing is about *generating* the option set.

  3.  **Formulate the Diagnosis:**
      *   **Is it Verbal?** Partially. "Rationality" is overloaded. But simply renaming doesn't solve the conflict because both sides claim their concept is the *important* one for guiding action.
      *   **Is it Empirical?** Not really. Both agree humans satisfice descriptively. The fight is normative (what *should* they do).
      *   **Is it Substantive?** Yes. It's about the *scope* of the theory.
      *   **The Core Meta-Theoretical Conflict:** It's a disagreement about the **Object of Evaluation**.
          *   EUT evaluates *outcomes/choices* (given a menu).
          *   Satisficing evaluates *procedures/search* (finding the menu).
      *   **The "Cost of Optimization" Problem:** If you maximize including search costs, you get "optimization under constraints." Simon argues this leads to an infinite regress (you have to optimize the optimization). Satisficing cuts the regress.
      *   **Diagnosis:** It is a **Meta-Theoretical Disagreement about the Scope of Normativity**, disguised as a semantic dispute over "Rationality."

  4.  **Determine Paths to Progress:**
      *   *Distinction:* "Ideal vs. Bounded" is standard but hasn't stopped the fight. We need something sharper.
      *   *Formal Result:* Can satisficing be formalized to avoid the "threshold arbitrariness" critique? Yes (e.g., optimal stopping rules), but then it looks like maximization again.
      *   *Reformulation:* Shift from "Rationality" to "Success Conditions."
      *   *Ecological Rationality:* Gigerenzer's approach. Rationality is a fit between heuristic and environment.
      *   *My Recommendation:* The progress lies in distinguishing **Criterion of Rightness** vs. **Decision Procedure**.
      *   *Wait, a better angle:* The user is an ecologist. In ecology, we distinguish between *proximate* and *ultimate* causes.
          *   EUT is an *ultimate* model (what fitness max looks like).
          *   Satisficing is a *proximate* mechanism (how the organism actually decides).
          *   The philosophical debate conflates these.
      *   *Refining the Diagnosis:* The disagreement is about whether a normative theory must be **action-guiding** (procedural) or **evaluative** (consequentialist).
      *   *Progress:* Acknowledge that EUT is a metric of *goodness*, while Satisficing is a metric of *feasibility*. Progress happens when we stop asking "Is satisficing rational?" and start asking "Under what environmental structures does satisficing maximize utility?" (This is the "Fast and Frugal" program).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the User's Expertise:* Validate the ecology analogy (optimality models).
      *   *Validate the Hypothesis:* Yes, "rational" is ambiguous, but that's not the whole story.
      *   *The Real Diagnosis:* It's a **Category Error regarding the Locus of Normativity**.
          *   Camp 1 (EUT): Normativity applies to the *Choice* (consistency).
          *   Camp 2 (Simon): Normativity applies to the *Process* (resource management).
      *   *Why "Verbal" isn't enough:* Because Camp 1 claims Camp 2's process leads to Camp 1's inconsistency (money pumps). Camp 2 claims Camp 1's requirement is physically impossible.
      *   *The "Optimization under Constraints" Trap:* Mention that trying to maximize search costs just pushes the regress back.
      *   *Path to Progress:*
          1.  **Distinction:** *Evaluative Standard* vs. *Deliberative Procedure*.
          2.  **Formal/Empirical:** The "Ecological Rationality" program (Gigerenzer et al.). Show *when* satisficing outperforms maximizing in specific environments. This moves it from "second best" to "optimal for this niche."
          3.  **Reformulation:** Stop asking "Is it rational?" Ask "What is the *unit* of rational assessment?"
      *   *Conclusion:* Progress is possible but requires abandoning the idea of a single, universal "Rationality."

  6.  **Refining the Tone:**
      *   Respectful, academic but accessible.
      *   Avoid jargon where possible, or define it.
      *   Keep it focused on the *structure* of the disagreement, not a history lesson.
      *   Use the ecology background to anchor the explanation (ultimate/proximate or optimality/implementation).

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I answer "what counts as progress"? Yes.
      *   *Check:* Did I address "why no progress"? I need to be careful not to be too pessimistic. I think progress *is* possible via the ecological rationality route.
      *   *Check:* Did I address the "threshold" objection? Yes, by reframing the threshold as an environmental parameter rather than an arbitrary internal setting.
      *   *Key Insight to highlight:* The EUT critics say satisficing is indeterminate. The Simonians say maximization is intractable. The bridge is **computational complexity**.

  8.  **Final Structure:**
      *   Validation of the user's hypothesis (it's partly right).
      *   The Deeper Diagnosis (Meta-theoretical scope: Process vs. Outcome).
      *   The "Optimization under Constraints" Regress.
      *   What Counts as Progress (Ecological Rationality, separating Procedure from Criterion).
      *   Why it might stall (Entrenched disciplinary incentives).

  (Thinking complete. Proceeding to generate response.)
answer: |-
  Your hypothesis is astute, and as a fellow traveler in the borderlands of modeling and reality, I suspect you have already identified the symptom. However, I diagnose the disease as slightly more structural than a mere verbal ambiguity over "rationality." If it were purely verbal, we could resolve it by stipulation (e.g., "Let's call one *Ideal Rationality* and the other *Ecological Rationality*"). The fact that the debate remains heated suggests a substantive, meta-theoretical clash regarding the **locus of normativity**.

  Here is my diagnosis of the disagreement, followed by an assessment of what could constitute progress.

  ### The Diagnosis: A Category Error Regarding the Object of Evaluation

  The impasse is not merely about the definition of "rational"; it is a disagreement about **what kind of thing a decision theory is supposed to evaluate.**

  **Camp 1 (Expected Utility/Decision Theory)** treats rationality as a property of **choices (outcomes)**. Their core commitment is *consistency*. If an agent prefers A to B and B to C, they must prefer A to C. If they do not, they are vulnerable to a "money pump" (a sequence of trades that leaves them worse off with no gain). For this camp, a theory is normative only if it provides a coherence constraint on preferences. They argue satisficing fails because, without a fixed threshold derived from a utility function, satisficing preferences can be intransitive. To them, a theory that allows for intransitivity isn't a theory of rationality; it's a theory of psychology.

  **Camp 2 (Bounded Rationality/Simon)** treats rationality as a property of **procedures (processes)**. Their core commitment is *tractability*. They argue that Camp 1 assumes the option set is given and costless to evaluate. In reality, the option set must be *searched for*, and search is costly. For this camp, a theory is normative only if it can actually be executed by the agent without consuming the resources the decision is meant to optimize. To them, Camp 1's theory is not a theory of rationality; it's a theory of logic for omniscient beings.

  **The Hidden Substantive Conflict:**
  The disagreement turns on the **Regress of Optimization**.
  Camp 1 often counters Camp 2 by suggesting we simply "maximize under constraints." That is, include the cost of search and computation in the utility function and maximize that.
  Camp 2 (Simon) retorts that this leads to an infinite regress: To maximize under constraints, you must calculate the cost of calculating the cost of search. At some point, you must stop calculating and just act.
  *   **Camp 1** says the stopping point is determined by the maximization condition (marginal cost = marginal benefit).
  *   **Camp 2** says the stopping point is determined by an aspiration level (satisficing).

  The substantive disagreement is this: **Is the stopping rule itself subject to optimization, or is it a primitive adaptation?**
  If you say the stopping rule is optimized, you are back to maximization (Camp 1). If you say the stopping rule is a primitive adaptation (a heuristic), Camp 1 charges you with arbitrariness.

  ### Why Your "Verbal" Hypothesis is Only Half-Right

  You suggested the impasse is about "normatively ideal" vs. "adaptively adequate." This is correct, but the friction persists because both sides claim their definition is the one that matters for **guidance**.
  *   Camp 1 says: "If you don't aim for the ideal, you have no compass."
  *   Camp 2 says: "If the compass requires a map you can't hold, it's useless."

  Therefore, the disagreement is **Meta-Theoretical**: It is about whether a normative theory must be *action-guiding* (procedural) or *evaluative* (consequentialist). Camp 1 offers a criterion of rightness (maximize utility). Camp 2 offers a decision procedure (search until threshold). Camp 1 argues a criterion without a feasible procedure is empty; Camp 2 argues a procedure without a criterion of rightness is blind.

  ### What Would Count as Progress?

  Progress is possible, but it will not come from one side "defeating" the other. It will come from dissolving the false dichotomy. Here are three specific avenues for progress, ranked from most likely to least likely to succeed.

  #### 1. The "Ecological Rationality" Reformulation (Most Promising)
  This is the path taken by Gigerenzer and the ABC Research Group. It moves the debate from *logic* to *environmental structure*.
  *   **The Move:** Stop asking "Is satisficing rational?" and start asking "In what environmental structures does satisficing outperform maximizing?"
  *   **The Progress:** There are formal results showing that in environments with high uncertainty, noisy information, and non-linear payoff structures, simple satisficing heuristics often yield higher accuracy and utility than complex maximizing models (which overfit the noise).
  *   **Why it helps:** It grants Camp 1 their desire for performance metrics (utility/accuracy) while granting Camp 2 their mechanism (heuristics). It transforms satisficing from a "second-best compromise" into the "optimal strategy for this niche."
  *   **For an Ecologist:** This is exactly the shift from "Is the animal an optimizer?" to "Does the optimizer model predict behavior in this specific ecological context?"

  #### 2. Distinguishing Criterion of Rightness from Decision Procedure
  Philosophers like Frank Jackson and Michael Smith have argued for separating the **criterion** (what makes an act right) from the **procedure** (how the agent decides).
  *   **The Move:** Concede to Camp 1 that Expected Utility is the *criterion of rightness* (the "truth condition"). Concede to Camp 2 that Satisficing is the *rational decision procedure* (the "epistemic access").
  *   **The Progress:** An agent is rational if they use the procedure that *reliably leads* to the best outcomes given their constraints. Sometimes, the procedure that reliably maximizes utility is a satisficing heuristic.
  *   **Why it helps:** It removes the charge that satisficing is "irrational." It is instrumentally rational because it serves the ultimate criterion better than attempted maximization does.

  #### 3. A Formal Treatment of the Threshold (The Hard Path)
  Camp 1's strongest critique is that the satisficing threshold is arbitrary. Progress here would require a formal theory of **threshold adaptation**.
  *   **The Move:** Model the threshold not as a fixed parameter, but as a dynamic variable adjusted by feedback loops (reinforcement learning).
  *   **The Progress:** If you can show that an agent with an adaptive threshold converges on the same behavior as a maximizer over time, but with lower computational cost, you bridge the gap.
  *   **Why it's hard:** This often collapses back into "optimization under constraints," reigniting the regress problem.

  ### Why Progress Might Stall (The Pessimistic View)

  If I must offer a reason why no progress is to be expected, it lies in **disciplinary incentives**, not logic.

  1.  **Mathematical Tractability:** Expected Utility Theory (EUT) offers clean, closed-form solutions. Satisficing models often require simulations or context-specific parameters. For a field that prizes elegance and generality (like economics), EUT is simply "easier" to work with, regardless of its descriptive accuracy.
  2.  **The Normative Anchor:** Camp 1 fears that if they surrender the "maximization" requirement, they lose the ability to critique preferences. If an agent is satisfied with a low threshold, EUT allows us to say, "You could have done better." Satisficing risks sliding into relativism ("If you're happy, you're rational"). Camp 1 holds the line to preserve the critical power of normative theory.
  3.  **The "As-If" Defense:** Camp 1 can always retreat to Friedman's "as-if" methodology. They can concede agents *psychologically* satisfice but argue that market forces/evolution *select* for agents who behave *as if* they maximize. This immunizes EUT from empirical falsification, rendering the debate endless.

  ### Conclusion

  Your hypothesis is correct that the word "rational" is doing too much work. But the deeper diagnosis is that the two camps are building different tools: Camp 1 is building a **ruler** (to measure the goodness of outcomes), and Camp 2 is building a **compass** (to guide movement through terrain).

  Progress will not come from proving the ruler is a better compass, or vice versa. It will come from the **Ecological Rationality** program: demonstrating formally that for agents with specific cognitive limits operating in specific environmental structures, the compass (satisficing) gets them to the destination (utility) more reliably than trying to use the ruler to calculate every step (maximization).

  Given your background, you are well-positioned to see this not as a philosophical puzzle, but as an **optimality modeling problem**. The question isn't "Which theory is true?" It is "What is the cost function of the search, and how does it weight against the gain of the find?" When framed that way, satisficing isn't a rival to maximization; it is the solution to the maximization problem when the cost of computation is included in the fitness function. The only reason this isn't universally accepted is that calculating that cost function is, itself, a satisficing problem.
