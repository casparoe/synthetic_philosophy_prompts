answer: |-
  You have hit upon exactly the right nerve. What you are describing is widely recognized as the single most significant philosophical and technical hurdle for the Many-Worlds Interpretation (MWI).

  To answer your specific questions immediately: **Yes, this problem has specific names, and yes, the approaches you identified are recognized, distinct families of responses with their own literature and labels.**

  Here is a breakdown of the terminology, the taxonomy of solutions, and the current state of the debate regarding the line between derivation and assumption.

  ### 1. Naming the Problem

  In the philosophy of physics literature, this is generally referred to as **The Probability Problem** of the Many-Worlds Interpretation. It is often subdivided into two distinct challenges:

  1.  **The Incoherence Problem (Qualitative):** If all outcomes occur, what does it even *mean* to say one is "probable"? In a deterministic multiverse where everything happens, the concept of probability seems to lose its grip. How can an agent be uncertain about an outcome that is determined to happen?
  2.  **The Quantitative Problem:** Even if we can make sense of probability in MWI, why does it follow the **Born Rule** ($P = |\psi|^2$)? Why shouldn't every branch count equally (giving a 50/50 split in your spin example), or why shouldn't the probability be linear with amplitude rather than squared?

  Your intuition about the "70% vs 30%" issue is precisely the Quantitative Problem. Since the evolution is unitary and deterministic, where does the *statistical* prediction come from?

  ### 2. Taxonomy of Responses

  You correctly identified the three main buckets of attempted solutions. Here is how they are labeled and discussed in the literature.

  #### A. Branch Counting (The "Naive" View)
  *   **Status:** Generally rejected by MWI proponents.
  *   **The Idea:** As you noted, if there are more branches where "up" happens than "down," maybe that explains the probability.
  *   **The Fatal Flaw:** In the Hilbert space formalism, branches are not discrete, countable objects like beads on a string. The decomposition of the wavefunction into "branches" depends on the basis you choose (the Preferred Basis Problem). You can mathematically decompose the same wavefunction into any number of branches you like. Without a pre-existing measure (the Born Rule) to weight them, "counting" is ill-defined.
  *   **Literature:** This is often discussed as a straw man or a initial intuition that must be abandoned. David Wallace explicitly argues against "branch counting" in favor of "branch weighting."

  #### B. The Decision-Theoretic Approach (Deutsch-Wallace Program)
  *   **Key Proponents:** David Deutsch (1999), David Wallace (2003, 2012).
  *   **The Idea:** This is the most sophisticated and controversial defense. It argues that we shouldn't look for probability "out there" in the world, but rather as a norm for rational action. Wallace argues that if you accept the non-probabilistic axioms of quantum mechanics (unitarity, etc.) and standard axioms of rational decision theory (transitivity of preference, etc.), a rational agent **must** place bets as if the Born Rule were true.
  *   **Addressing your Circularity Concern:** You asked if defining "rational" smuggles in probability. Wallace argues it does not. He claims to derive the Born Rule from axioms about *preferences* between games, not axioms about *beliefs*.
      *   *Critique:* Critics (like Huw Price and Gordon Belot) argue that the decision-theoretic axioms themselves implicitly assume a probabilistic structure. For example, the axiom of "Diachronic Consistency" (that your future selves' preferences should matter to you now) is argued to be where the probability assumption is hidden.
  *   **Key Text:** David Wallace, *The Emergent Multiverse* (2012).

  #### C. Self-Locating Uncertainty (Epistemic Approaches)
  *   **Key Proponents:** Lev Vaidman, Sean Carroll, Charles Sebens.
  *   **The Idea:** This tackles the Incoherence Problem. It argues that probability arises from **indexical uncertainty**.
      *   *The Scenario:* The measurement happens, the universe branches, but the observer hasn't looked at the result yet. There are now two copies of the observer. Each copy asks, "Which one am I?"
      *   *The Mechanism:* Since both copies exist, the uncertainty isn't about *what happens* (ontic), but about *where I am* in the multiverse (epistemic/self-locating).
  *   **Addressing the Quantitative Problem:** This is the hard part. Why should I assign 70% credence to being the "up" observer rather than 50%?
      *   **Sebens & Carroll (2018):** They argue for a principle called **ESP (Epistemic Separability Principle)**. Roughly, the probability you assign to being a specific observer should depend only on the local state of that observer and its immediate environment, not on distant parts of the wavefunction. They claim this forces the Born Rule.
      *   *Critique:* Critics argue that without already assuming the "weight" of the branch matters, the Principle of Indifference suggests you should treat all identical observer states as equally likely, regardless of amplitude.
  *   **Key Text:** Sebens & Carroll, "Self-Locating Uncertainty and the Origin of Probability in Everettian Quantum Mechanics" (2018).

  #### D. Measure over Branches (The "Saunders-Wallace" View)
  *   **Distinction:** This is subtly different from branch counting.
  *   **The Idea:** Branches exist, but they have a **measure** (a continuous weight) defined by the Hilbert space norm. The claim is that "probability" is just the name we give to this physical measure.
  *   **The Challenge:** This risks being a definition rather than a derivation. If you say "Probability is defined as Hilbert Space Measure," you still need to explain why a rational agent should care about that measure (which leads back to Decision Theory) or why that measure corresponds to frequency of experience (which leads back to Self-Locating Uncertainty).

  ### 3. The Line Between Derivation and Assumption

  You asked: *"Where the line is between deriving probability and quietly assuming it."*

  This is the exact fault line where the current debate sits.

  **The Pro-MWI Argument:**
  Proponents (Wallace, Carroll, Saunders) argue that the Born Rule is **emergent**. Just as "temperature" emerges from the statistical mechanics of atoms (even though a single atom has no temperature), "probability" emerges from the structure of the wavefunction and the nature of observers within it. They claim they are not assuming probability; they are deriving the *norms of expectation* for agents embedded in a branching structure.

  **The Anti-MWI Argument:**
  Critics (Adrian Kent, Tim Maudlin, David Albert) argue that these derivations are **circular**.
  *   **Kent's Critique:** He argues that Decision Theory tells you how to act if you *already* have probabilities, but it doesn't tell you why the physical world should conform to those preferences. He famously asked: "Why should I care about my high-amplitude successors more than my low-amplitude successors?"
  *   **The "Incoherence" Charge:** Some argue that without a unique outcome, the concept of probability is simply incoherent. If I see "Up," and a copy sees "Down," and both are real, saying "Down was improbable" is false. It happened. Therefore, MWI contradicts the empirical data which tells us some things are rare and some are common.

  ### 4. Summary of Terms for Your Research

  If you want to dive deeper into the literature, these are the search terms that will yield the most relevant papers:

  *   **The Born Rule Problem** (General search term)
  *   **The Incoherence Problem** (Specifically regarding the meaning of probability)
  *   **The Quantitative Problem** (Specifically regarding the squared amplitude)
  *   **Deutsch-Wallace Theorem** (Decision-theoretic derivation)
  *   **Epistemic Separability Principle (ESP)** (Sebens-Carroll self-locating approach)
  *   **Envariance** (Wojciech Zurek's approach, which is related but distinct; focuses on environment-assisted invariance)
  *   **Caring Measure** (Discussions on why agents should "care" about branches proportional to amplitude)

  ### Conclusion

  You are not missing anything obvious. You have correctly identified the "hard problem" of Many-Worlds.

  *   **Does it have a name?** Yes, the Probability Problem (Incoherence/Quantitative).
  *   **Are the solutions distinct?** Yes, primarily Decision-Theoretic (Deutsch-Wallace) vs. Self-Locating/Epistemic (Sebens-Carroll/Vaidman).
  *   **Is it solved?** There is no consensus. Proponents believe the Decision-Theoretic and Self-Locating arguments successfully derive the Born Rule from non-probabilistic premises. Critics maintain that these arguments implicitly assume the probabilistic structure they claim to derive, or that they fail to explain why the "measure" of a branch should dictate rational expectation.

  Your skepticism about branch counting is well-founded (it is universally rejected by experts in the field). Your skepticism about the circularity of decision theory is shared by a significant portion of the philosophy of physics community. The debate is currently less about "does branching happen" and more about "can probability survive in a branching world without being smuggled in by definition."
