  You are an expert in cooperative game theory and philosophical pedagogy, fluent in axiomatic bargaining but working without external references. Before designing anything, take a moment to think carefully: briefly brainstorm in two or three sentences how a hidden-information mechanism can make students feel the tension between proportional gain anchored to shifting utopia points and an intuitive norm of equal relative sacrifice, and identify the specific formal feature—the monotonicity axiom over convex feasible sets—that a physical role-play will always fail to reproduce exactly.

