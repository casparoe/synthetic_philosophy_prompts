  # The Orbital Mining Accord: A Classroom Activity

  ## Activity Overview
  **Objective:** To intuitively demonstrate the Kalai-Smorodinsky (KS) bargaining solution, specifically how the monotonicity axiom dictates outcome shifts when the feasible set expands asymmetrically relative to utopia points.
  **Participants:** 14 students (7 pairs of delegations).
  **Time:** 75 minutes.
  **Materials:** 7 folders per round (containing Pool Card, Tech Cards, Proposal Sheet), whiteboard, timer.
  **Incentives:** Points accumulated across rounds are redeemable for classroom privileges (e.g., one 24-hour extension token, choice of seminar reading topic, or "best delegate" certification).

  ## Rules of Engagement

  1.  **Delegations:** Students are paired into 7 North-South delegations. Each pair sits facing each other.
  2.  **Disagreement Point:** If a pair fails to agree on a division within the time limit, or proposes a split exceeding the available pool, both receive the **Disagreement Payoff of 10 points**. This is guaranteed.
  3.  **The Pool:** In each round, a total resource pool (Orbital Minerals) is announced. The sum of North and South claims cannot exceed this pool.
  4.  **Technology Cards (Utopia Points):** Each student receives a private card indicating their maximum possible extraction capacity (*Utopia Point*) given the other party receives their disagreement payoff.
      *   *Constraint:* You may not claim more than your Technology Card allows, even if the Pool is larger.
      *   *Privacy:* You may not show your card to your partner. You may only state your claims.
  5.  **Rounds:**
      *   **Round 1:** Pool 50. Both Technologies Normal.
      *   **Round 2:** Pool 80. One side draws "Advanced Tech" (Hidden Shift).
      *   **Round 3:** Pool 100. Technologies remain as Round 2 (Common Knowledge).
  6.  **Submission:** Pairs submit a written proposal $(N, S)$. If $N + S \leq \text{Pool}$ and $N \leq \text{Tech}_N$ and $S \leq \text{Tech}_S$, the deal holds. Otherwise, disagreement payoff applies.
  7.  **Reveal:** After submissions, the Facilitator reveals the true Technology Cards and calculates the "Theoretical Fair Share" (KS Solution) on the board.

  ## Minute-by-Minute Timeline

  **00:00 – 00:10: Introduction & Setup**
  *   Distribute pairs. Explain the point system and privileges.
  *   Define the Disagreement Point (10, 10) clearly: "If you fight, you both walk away with 10. Any deal must beat this."
  *   **Round 1 Deal:** Pool 50. Tech Cards: North (40), South (40).
  *   *Note:* Both cards are identical.

  **00:10 – 00:20: Round 1 Negotiation & Reveal**
  *   **Negotiation (5 mins):** Students negotiate. Expectation: Symmetric split.
  *   **Submission & Reveal:** Collect proposals. Reveal Tech Cards (40, 40).
  *   **Board Work:** Draw axes. Mark $d=(10,10)$ and $u=(40,40)$. Draw line connecting them. Mark intersection with Pool line ($x+y=50$).
  *   **Result:** KS Solution is (25, 25). Most pairs will match this.

  **00:20 – 00:35: Round 2 Negotiation & Reveal (The Tension)**
  *   **Setup:** Announce Pool 80.
  *   **Hidden Shift:** Distribute new Tech Cards.
      *   North draws **Advanced (70)**.
      *   South keeps **Normal (50)**. (Note: South's tech increases slightly from R1 due to pool mechanics, but North's jumps significantly, creating asymmetry).
      *   *Crucial:* South does *not* know North's card changed. North knows South's is 50.
  *   **Negotiation (5 mins):** North argues for a larger share based on capacity. South argues for 50/50 split of 80 (40, 40) based on Round 1 precedent.
  *   **Submission & Reveal:** Collect proposals. Reveal Cards.
  *   **Board Work:** Mark new $u=(70, 50)$. Draw line from $d(10,10)$ to $u(70,50)$.
  *   **Calculation:** Slope is $2/3$. Intersection with $x+y=80$ is **North 46, South 34**.
  *   **Observation:** Pairs who split 40/40 failed to capture North's monotonic gain. Pairs who fought get 10/10.

  **00:35 – 00:50: Round 3 Negotiation & Reveal (Monotonicity)**
  *   **Setup:** Announce Pool 100.
  *   **Knowledge:** Facilitator announces Technologies remain **North (70), South (50)**. This is now common knowledge.
  *   **Negotiation (5 mins):** Students should aim for the KS line explicitly.
  *   **Submission & Reveal:** Collect proposals.
  *   **Board Work:** Keep $u=(70, 50)$ and $d=(10,10)$. Draw line to new Pool ($x+y=100$).
  *   **Calculation:** Intersection is **North 58, South 42**.
  *   **Observation:** Compare R2 (46, 34) to R3 (58, 42). Both gained, but North gained more absolute units (12 vs 8) because the expansion favored the utopia ray.

  **00:50 – 01:15: Debrief & Formal Rigor**

  ### Debrief Structure

  **1. Round 1: Symmetry and Pareto Efficiency (5 mins)**
  *   **Concept:** When $u_N = u_S$, the KS solution collapses to the equal split of gains above disagreement.
  *   **Discussion:** Ask pairs who deviated from (25, 25) why they did so. Highlight that any point on the line $x+y=50$ between (10, 40) and (40, 10) is Pareto efficient, but only (25, 25) satisfies symmetry.

  **2. Round 2: Disagreement-Point Anchoring (5 mins)**
  *   **Concept:** The solution is not a split of the *Pool*, but a split of the *Gains* ($x_i - d_i$) proportional to the *Potential* ($u_i - d_i$).
  *   **Discussion:** Address the conflict. South likely argued for 40/40 (splitting the 80). Show that this ignores the anchor at (10, 10). The "surplus" is 60 (80 - 10 - 10), not 80.
  *   **Failure Handling:** If students treated (0,0) as the base, point out that the Disagreement Point acts as a gravitational anchor; you never bargain from zero, you bargain from your threat value.

  **3. Round 3: Monotonicity and IIA Violation (5 mins)**
  *   **Concept:** As the feasible set expands (80 to 100) while $u$ remains constant, the KS solution must move monotonically along the ray from $d$ to $u$.
  *   **Discussion:** Compare North's gain (12 units) vs. South's gain (8 units). Why didn't they split the new 20 units equally (10 each)? Because the "line of fairness" tilts toward the higher utopia point. This violates Independence of Irrelevant Alternatives (IIA); adding new options (the extra 20 units) changed the relative outcome of the original options.

  ### Predicted Failures & In-Moment Handling

  **Failure 1: The "Equal Split" Norm**
  *   **Prediction:** In Round 2, South will insist on 40/40, viewing North's claim to 46 as greedy.
  *   **Handling:** Do not intervene during negotiation. In the debrief, draw the "Equal Sacrifice" line (where loss from utopia is equal: $70-N = 50-S$). Show that KS *is* equal relative sacrifice ($\frac{N-10}{70-10} = \frac{S-10}{50-10}$), whereas 40/40 is equal absolute division of the pool, which ignores the asymmetric capacity.

  **Failure 2: Ignoring the Disagreement Point**
  *   **Prediction:** Students calculate ratios based on $u_N/u_S$ (70/50) rather than gains $(u_N-d_N)/(u_S-d_S)$ (60/40).
  *   **Handling:** On the board, explicitly shade the rectangle from (0,0) to (10,10) as "Dead Zone." Remind them: "You cannot bargain away what you already possess guaranteed. You only divide the surplus."

  **Failure 3: Disagreement Due to Hidden Info**
  *   **Prediction:** High rate of disagreement in Round 2 due to mistrust.
  *   **Handling:** Acknowledge this as a feature, not a bug. Real bargaining often fails under asymmetric information. Use the 10-point payoff to show the cost of failing to coordinate on the theoretical solution even when information is imperfect.

  ### Supplying the Missing Formal Rigor (Final 5 Minutes)

  I will be frank: this activity cannot reproduce the **continuous monotonicity axiom over convex feasible sets**.

  *   **The Limitation:** We used three discrete steps (50, 80, 100) and linear constraints ($x+y \leq R$). The formal Kalai-Smorodinsky solution assumes a smooth, convex frontier where the feasible set can expand infinitesimally in any direction. In our game, the "frontier" is a jagged line of integer units.
  *   **The Verbal Supply:** I will explain that the monotonicity axiom requires that if the feasible set $S$ grows to $S'$ (where $S \subset S'$) and the utopia point $u$ remains unchanged, the solution $f(S')$ must be at least as good for both players as $f(S)$. In our discrete steps, we saw this numerically (46→58, 34→42). However, in the formal theory, this must hold for *any* convex expansion, not just parallel shifts of a linear budget constraint. The KS solution is the *unique* solution that satisfies Pareto Efficiency, Symmetry, Scale Invariance, and this specific Monotonicity axiom. By replacing the IIA axiom of the Nash Bargaining Solution with Monotonicity, Kalai and Smorodinsky ensured that if your potential maximum increases, your actual share cannot decrease, even if the "pie" grows in a way that benefits everyone. Our activity showed you the *effect* of this axiom; the mathematics guarantees this effect holds continuously, not just at the three checkpoints we tested today.
