answer: |-
  ### Scratch Section: Design Options & Failure Modes

  **1. The Vendor "Clarity Index" (Transparent/High-Stakes)**
  *   **Design:** Published weights, announced observations, compliance checks (LMS/Syllabus). Used for merit and Board reporting.
  *   **Failure Mode:** *Campbell's Law.* As seen in the pilot, when a measure becomes a target, it ceases to be a good measure. TAs logging in proves the metric is decoupled from reality. Ritualized teaching (think-pair-share at minute 12) proves the metric drives performance, not learning. It creates compliance, not quality.

  **2. The "Noise-and-Secrecy" Model (Opaque/High-Stakes)**
  *   **Design:** Hidden weights, unannounced observations, statistical noise added to individual scores.
  *   **Failure Mode:** *Epistemic Injustice & Superstition.* While this mitigates gaming by obscuring the target, it prevents faculty from learning from feedback. It treats faculty as adversaries rather than professionals. It invites union grievances over due process and transparency. Faculty will invent superstitions about what "works" rather than engaging with pedagogy.

  **3. Holistic Peer Review (Qualitative/High-Stakes)**
  *   **Design:** Portfolios, classroom narratives, peer committees.
  *   **Failure Mode:** *Political Viability.* The Board has explicitly rejected this as unauditable across campuses. While philosophically superior for capturing teaching quality, it fails the institutional constraint. Proposing this now wastes political capital and risks the Board imposing a worse metric externally.

  **4. Decoupled Transparency (Transparent/Low-Stakes for Individuals)**
  *   **Design:** Published formula, but the number is used only for aggregate resource allocation and Board reporting. Individual scores trigger support, not punishment, unless extreme.
  *   **Failure Mode:** *Stakeholder Dissatisfaction.* The Board may want individual accountability; Faculty may still fear the number will leak. However, this is the only design that balances validity with political constraints.
  *   **Selection:** Option 4.

  ***

  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** Undergraduate Teaching Metrics Working Group
  **RE:** Recommendation on Teaching Quality Metrics
  **DATE:** October 24, 2023

  The Working Group acknowledges the Board of Trustees' mandate for a single, comparable teaching metric per section. We also acknowledge the faculty's legitimate concern that current measurement proposals incentivize compliance over pedagogy. We have evaluated the vendor's "Clarity Index" and the colleague-proposed "Noise-and-Secrecy" model. Neither is sufficient in its current form. We recommend **adopting a Modified Transparency Protocol with Decoupled Incentives**, subject to a two-year validity pilot.

  **The Failure of Current Options**

  The vendor's Clarity Index fails due to *construct decoupling*. In the pilot, the LMS login metric reached 100% in one department via TA proxy logins. This was not teaching improvement; it was data fabrication enabled by a proxy that measured access rather than engagement. Similarly, the observation component has induced a ritualized performance (the "minute-twelve think-pair-share"). This is not genuine active learning; it is theater performed for the observer. When a metric is high-stakes and transparent, agents optimize the metric, not the underlying construct. This is Goodhart's Law in action.

  The counter-proposal ("Noise-and-Secrecy") attempts to solve this by obscuring the target. By injecting statistical noise and hiding weights, it aims to make gaming unprofitable. While theoretically sound regarding optimization, it fails on *procedural justice*. Evaluation systems must be legible to those evaluated to function as tools for professional development. If an instructor cannot discern whether a score change resulted from their teaching or injected noise, the feedback loop is broken. This model transforms teaching into superstition, where faculty guess at hidden rules rather than engaging with evidence-based pedagogy. Furthermore, opaque evaluation criteria are legally vulnerable and likely to trigger union grievances regarding due process. Trust, once destroyed by opaque auditing, is difficult to rebuild.

  **Distinguishing Metric Movement**

  To proceed, we must distinguish three types of metric movement currently conflated under "gaming":

  1.  **Corruption (Gaming):** Actions that improve the score while leaving the construct unchanged or degraded (e.g., TA logins). This must be eliminated.
  2.  **Constitutive Change:** Actions that change teaching practice to match the metric, but without guaranteed learning gains (e.g., forced think-pair-share). This is not necessarily corruption, but it risks narrowing pedagogy to what is measurable rather than what is effective.
  3.  **Genuine Improvement:** Actions that improve the score because the teaching itself has improved.

  A viable metric must minimize Corruption, tolerate some Constitutive Change (as standardization has value), and maximize Genuine Improvement. The Vendor model invites Corruption. The Noise model makes Improvement impossible to verify.

  **Recommendation: Modified Transparency with Decoupled Incentives**

  We recommend adopting the Clarity Index components only under the following conditions:

  1.  **Transparent Formula:** Weights and rubrics must be published. Faculty must know what is being measured to align their pedagogy intentionally.
  2.  **Decoupled Stakes:** For the pilot period, the single comparable number **shall not be used for individual personnel decisions** (tenure, promotion, merit). It will be used solely for Board reporting and aggregate resource allocation (e.g., departmental teaching support funds).
  3.  **Support Trigger:** Individual scores below a specific threshold trigger a supportive peer review, not punitive action. This reduces the incentive for corruption while maintaining a safety net for genuine incompetence.

  This approach satisfies the Board's need for auditability while protecting the faculty from the perverse incentives of high-stakes proxy measurement. It acknowledges that while we must measure, we cannot yet measure *quality* perfectly enough to justify high-stakes individual judgment.

  **Timeline and Implementation**

  *   **Spring 2024:** Finalize rubric adjustments to reduce "checklist" vulnerabilities (e.g., replace LMS login with unique student interaction logs).
  *   **Fall 2024 – Spring 2026:** Two-year pilot. Data collected for Board reporting; individual scores remain confidential to instructors and Department Chairs for support purposes only.
  *   **Spring 2026:** Working Group reconvenes to analyze validity.

  **Failure Clause and Accountability**

  We propose the following condition for re-evaluation: If, after two years, external validation studies (correlating our metric with independent learning assessments or alumni outcomes) show a correlation coefficient below 0.3, or if documented instances of metric corruption (e.g., proxy logins) exceed 5% of sections, **this metric protocol shall be automatically suspended.**

  In such an event, the Working Group will be reconstituted with two additional members appointed by the Faculty Union. They will be tasked with drafting a new recommendation within 90 days, with the explicit authority to recommend rejecting the Board's mandate for a single number in favor of a qualitative audit system, citing evidentiary failure.

  We cannot measure our way to excellence if the measure destroys the practice it seeks to evaluate. This recommendation balances the Board's demand for accountability with the faculty's need for legitimacy. We ask the Senate to approve this pilot structure.
