  5.  **Refining the "Rules":**
      *   **Rule 1 (Restrictor + Modal Base Shift):** *If* restricts a covert modal. Indicatives use an Epistemic Modal Base (what is known/believed). Counterfactuals use a Metaphysical/Causal Modal Base (laws + specific past facts), ordered by similarity that respects causal direction (no backtracking).
