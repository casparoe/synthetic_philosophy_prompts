      *   **Case 4 (Patient/Arsenic):**
          *   Counterfactual (*If taken arsenic, symptoms*): Acceptable. Antecedent *not* required to be false/doubted. (Contradicts "Past Subjunctive = False" rule).
          *   Counterfactual (*If symptoms, taken arsenic*): Unacceptable (wrong causal direction).
          *   Indicative (*If symptoms, took arsenic*): Acceptable (inference).
          *   *Key Takeaway:* Counterfactuals track causal direction (backtracking is bad). Counterfactual morphology $\neq$ false antecedent.
      *   **Case 5 (Rain/Match):**
          *   Future Indicative vs. Counterfactual.
          *   Counterfactual adds "doubt" but that's not the *whole* difference (citing 1 & 4).
