      *   **Task:** Propose one further test case to distinguish the surviving theories.
      *   **Constraint:** Do not provide a general survey of theories; focus on predictions and diagnosis based *only* on the provided record.
      *   **User's Hypothesis:** One restrictor-style semantics with mood shifting the modal base (Stalnakerian-ish?), but they are stuck on (iii) and (v).

  2.  **Analyze the Supervisor's Record (Cases 1-7):**
      *   **Case 1 (Watchman/Fire):**
          *   Context: Everyone certain watchman started it.
          *   Indicative (*If not watchman, someone else*): Assertable, informative. Antecedent added to context (revision).
          *   Counterfactual (*If not watchman, someone else would have*): Not assertable, False. Why? Nearest worlds where watchman didn't start it are worlds where *no one* starts it (causal/historical dependence).
          *   *Key Takeaway:* Indicatives allow radical context revision (epistemic). Counterfactuals hold fixed certain causal/historical facts (metaphysical/causal similarity). Counterfactuals have truth values (she said "false").
      *   **Case 2 (Match/Dry vs. Wet):**
          *   Counterfactuals. Strengthening the antecedent fails (*If struck, lit* vs. *If struck & wet, lit*).
