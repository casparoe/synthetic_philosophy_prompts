al consciousness to the colony while denying it any integrated functional organization—briefly diagnosing whether the vacancy stems from incoherence or mere neglect. For each leaf, provide one sentence describing its most awkward commitment, for example having to treat mass worker death as analogous to neuronal turnover without any corresponding phenomenology of loss. Explicitly flag any pair of leaves that the four case questions cannot cleanly separate. Do not include citations, named contemporary theorists, bibliographies, or reading lists; construct the taxonomy solely from the logical space of answers to the four scenarios. Write for an audience familiar with philosophy of mind but not presupposing expertise in distributed cognition.
