  # Taxonomy of Colony Consciousness: The Aunt Hillary Decision Tree

  **Root Question:** Can distributed, non-neuronal biological systems satisfy conditions for consciousness at all?
  *   **No:** → **Leaf 1: Reductionist or Eliminativist View**
  *   **Yes:** → Proceed to Diagnostic Node 1.

  ***

  **Diagnostic Node 1 (Persistence):** If a colony retains a learned maze-route after ninety-five percent of its workers have died and been replaced, does that preserve one persisting mind or only a functional system?
  *   **Only a functional system:** → **Leaf 2: Functionalism (Cognition without Phenomenality)**
  *   **One persisting mind:** → Proceed to Diagnostic Node 2.

  ***

  **Diagnostic Node 2 (Boundaries):** If a physical barrier splits the colony and the two halves pursue incompatible foraging goals for days, is this one mind with conflicting intentions, two minds, or no minds at all?
  *   **One mind (physical unity required):** → **Leaf 3: Strong Boundary-Dependent Emergentism**
  *   **Two minds (physical unity not required):** → Proceed to Diagnostic Node 3.
  *   *(Note: "No minds" reverts to Leaf 1, as it denies the Root premise.)*

  ***

  **Diagnostic Node 3 (Content):** If pheromone trails systematically misrepresent food location yet the colony eventually corrects the error, does the colony possess representational content with a truth-condition, or only causal tracking?
  *   **Only causal tracking:** → **Leaf 5: Unoccupied Position (Phenomenal Consciousness without Functional Organization)**
  *   **Representational content:** → Proceed to Diagnostic Node 4.

  ***

  **Diagnostic Node 4 (Centralization):** If the queen is removed and the colony collapses into disordered behavior within weeks, is the queen a central organizing hub analogous to a brain whose loss kills a subject, or merely a reproductive component whose absence damages a mechanism?
  *   **Central organizing hub (subject dies):** → **Leaf 4: Boundary-Independent Emergentism**
  *   **Merely a reproductive component (subject persists):** → **Leaf 5: Unoccupied Position (Phenomenal Consciousness without Functional Organization)**

  ***

  ## Leaf Descriptions and Awkward Commitments

  **Leaf 1: Reductionist or Eliminativist View**
  *   **Definition:** Mental properties are assigned only to individual ants or denied altogether; the colony is merely a collection of parts.
  *   **Awkward Commitment:** This view must treat the colony’s complex, adaptive problem-solving as no more mentally significant than water flowing downhill or a storm system organizing.

  **Leaf 2: Functionalism (Cognition without Phenomenality)**
  *   **Definition:** Grants the colony cognitive states like memory and intention but denies it possesses a unified phenomenal perspective or "inner light."
  *   **Awkward Commitment:** Proponents must accept that the colony successfully remembers and learns while insisting there is literally "nobody home" to experience the success or the failure.

  **Leaf 3: Strong Boundary-Dependent Emergentism**
  *   **Definition:** The colony is a mind only when physically unified; spatial separation destroys the subject even if information flow continues.
  *   **Awkward Commitment:** This position requires claiming that a physically separated half-colony, still communicating and foraging effectively, instantly ceases to be a subject until physical contact is restored.

  **Leaf 4: Boundary-Independent Emergentism**
  *   **Definition:** The colony is a mind based on information integration, persisting across physical splits as long as functional organization remains intact.
  *   **Awkward Commitment:** One must accept that two physically disconnected swarms, coordinating solely via environmental traces, constitute a single subject identical to the pre-split colony.

  **Leaf 5: Unoccupied Position (Phenomenal Consciousness without Functional Organization)**
  *   **Definition:** Grants phenomenal consciousness to the colony while denying it integrated functional organization (reached via Node 3 "Causal" or Node 4 "Component").
  *   **Awkward Commitment:** This view implies a colony could behave randomly and lack coherent goals after queen-loss yet still "feel like something" to be that disordered collection of ants.

  ***

  ## Structural Limitations and Indistinguishability

  **Flagged Indistinguishability:** **Leaf 4 (Boundary-Independent Emergentism)** and **Leaf 5 (Unoccupied Position)** cannot be cleanly separated if the answer to **Diagnostic Node 4** is "Unclear." If the queen’s removal causes disorder but the colony does not fully collapse (a partial hub/component status), the taxonomy cannot determine whether the functional organization was sufficient to sustain the subject (Leaf 4) or if the subject persists despite the loss of function (Leaf 5). In this ambiguous zone, the distinction between a mind that requires functional integration and a mind that exists without it collapses.
