      *Wait, one more check on (c):* The student argues: If B is sound -> Historical science unscientific -> Absurd -> B not sound -> R stands.
      The flaw: B's objection is about *methodological rigor* within historical science, not the impossibility of historical science. The student conflates "this specific inference is weak" with "all historical inference is weak." This is a standard student error but needs to be penalized in a Phil Bio course.

