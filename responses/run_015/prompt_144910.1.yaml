  **Decomposition of Doubt (Subtracted from Baseline 1.0):**

  *   **0.25 (BI Soundness):** Backward induction relies on counterfactual stability at unreached nodes, which dissolves once the first move deviates from the equilibrium path.
  *   **0.30 (Reasoning Cap):** Without a reachable terminal node to anchor the induction, the logical imperative to grab collapses into heuristic level-k guessing that favors passing.
  *   **0.10 (Social/Hedging):** Even a small probability that the opponent has social preferences or makes errors makes passing the higher expected-value choice.
  *   **0.02 (CK of Bounds):** Common knowledge of mutual cognitive limits can act as a tacit collusion signal, slightly further reducing the incentive to defect early.

  **Combination:** $1.00 - 0.25 - 0.30 - 0.10 - 0.02 = 0.33$

  **Term I'd Bet On Least:** The **BI Soundness** weight (0.25), because it rests on unresolved philosophical debates about counterfactuals in rational choice theory rather than empirical or structural facts.

  **Sub-Question That Would Move the Total Most:** **"Does capping the reasoning depth change the answer?"** (The Reasoning Cap term); if bounded players can still simulate a "fuzzy" endpoint that sustains induction, the credence jumps back toward 1.0, but if the anchor is truly lost, it stays near 0.
