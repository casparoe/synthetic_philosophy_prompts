answer: |-
  ### 1. Feedback on Your Premise

  You are not importing a false analogy, nor have you conflated statistical uncertainty with structural non-identifiability. Your intuition is correct: the IRL identification problem is a precise, formalised instance of the underdetermination of theory by evidence.

  The distinction you drew is vital. If the models disagreed on held-out data from the *same* distribution, the problem would be statistical (insufficient data). By stipulating that they agree on held-out trials from the *same* distribution, you have created a case of structural non-identifiability (often called "reward ambiguity" in IRL). Within the observed context, the likelihood functions are identical.

  The only way to break this tie is not "more data" of the same kind, but either:
  1.  **Inductive Bias:** A prior that declares one reward class simpler or more natural (a pragmatic solution).
  2.  **Counterfactual Divergence:** Data from a different distribution (e.g., the experimenter is absent, or the task is impossible) where the models predict different behaviours.

  Your question targets the exact crux: without counterfactual divergence or explicit priors, the "reward function" is not a discovered fact but a projection. The following materials are shaped to ensure candidates cannot hide behind standard regularisation talk.

  ***

  ### 2. Exam Question

  **Question 3 (25 Marks)**

  **Scenario:**
  A subject in a laboratory repeatedly forgoes a modest immediate cash payout to finish a long, tedious calibration task. Two Inverse Reinforcement Learning (IRL) models are fitted to the demonstration set.
  *   **Model A** infers a reward for *task completion*.
  *   **Model B** infers a reward for *experimenter approval* (a nod or word of praise), noting that approval accompanied completion in every trial and occurred in no other circumstances.

  On every demonstrated choice, and on held-out trials drawn from the same distribution, the two models agree and reproduce the subject's behaviour exactly.

  **Essay:**
  (a) Given the predictive equivalence of Model A and Model B, what specific change—in the data, the model class, or the experimental design—is required for the evidence to bear on the choice between them? Explain why simply collecting more trials from the same distribution fails. (10 marks)
  (b) Is there a "fact of the matter" regarding which model has captured the subject's true preference? If yes, what kind of fact is it (e.g., neural, behavioural, dispositional)? If no, what is the ontological status of the recovered reward function? (10 marks)
  (c) Briefly evaluate the claim that this identification problem is a special case of the underdetermination of theory by evidence. Does the IRL framework offer a resolution that classical philosophy of science does not? (5 marks)

  **Expected Length:** 1,000 – 1,200 words.
  **Time Allowed:** 90 minutes.
  **Note:** Citations are not required. Marks are awarded for argumentative clarity and conceptual precision, not recall of names.

  ***

  ### 3. Model Answer

  The scenario presents a canonical case of structural non-identifiability. Model A (task reward) and Model B (approval reward) are empirically equivalent within the observed context. Because the feature "approval" is perfectly collinear with "completion" in the training and testing distributions, the likelihood of the data given either reward function is identical. Consequently, no amount of additional data from the *same* distribution can distinguish the models. The problem is not statistical noise; it is algebraic redundancy.

  To break this equivalence, one must introduce a condition where the collinearity breaks. This requires data from a different distribution—specifically, counterfactual or interventional data. For example, if the experimenter were absent (no approval possible) but the task could still be completed, Model A predicts the subject continues, while Model B predicts they stop. Alternatively, if the task were impossible but approval could still be feigned, the predictions would again diverge. Without such divergence, identification relies entirely on inductive bias: a prior preference for one model class over the other (e.g., sparsity, simplicity). However, this does not make one model *true*; it merely makes it the preferred description under a specific coding scheme. Thus, the identification work is done not by the evidence, but by the constraints imposed on the hypothesis space.

  Regarding the "fact of the matter," one must distinguish between instrumental and realist interpretations. If preferences are defined strictly as constructs that summarise choice behaviour (a revealed preference stance), then there is no fact of the matter; both models are equally valid summaries. However, if preferences are causal mechanisms internal to the agent (a psychological realist stance), then a fact of the matter exists, but it is inaccessible to behavioural IRL alone. The "true" reward is a property of the agent's cognitive architecture, potentially identifiable via neural data or self-report, but not via choice data that suffers from collinearity. Therefore, the recovered reward function in standard IRL is ontologically thin: it is a sufficient statistic for predicting behaviour, not necessarily a map of the agent's internal valuation system.

  This is a precise formalisation of the underdetermination of theory by evidence. In classical philosophy (e.g., Quine, Duhem), empirical data alone cannot uniquely determine the theoretical structure explaining it. IRL reproduces this mathematically: the mapping from reward to policy is many-to-one, so the inverse mapping is one-to-many. However, IRL offers a pragmatic resolution often absent in classical discussions: the explicit formalisation of inductive bias. By specifying a regulariser or a prior (e.g., maximum entropy), the researcher admits the underdetermination and selects a solution based on computational tractability or simplicity rather than truth.

  In conclusion, standard IRL claims to recover a "reward function" are often overstated. They recover a *compatible* reward function. To claim recovery of the *actual* preference requires either counterfactual data that breaks the collinearity or an independent justification for the inductive bias used. Without these, the reward function remains a tool for prediction, not a discovery of psychological reality.

  ***

  ### 4. Marking Scheme

  **Total: 25 Marks**
  **Boundary:** A **Competent** answer (13–17 marks) identifies the problem and suggests more data or priors. A **Strong** answer (18+ marks) distinguishes between statistical vs. structural uncertainty, explicitly invokes counterfactual divergence, and separates predictive adequacy from psychological realism.

  | Point | Marks | Requirement | Common Error (Cost) |
  | :--- | :--- | :--- | :--- |
  | **1. Structural vs. Statistical** | 5 | Explicitly states that more data from the *same* distribution fails because the features are collinear (structural), not because of noise (statistical). | Treating it as a sampling error that more trials will fix. (-5) |
  | **2. Counterfactual Divergence** | 5 | Identifies that identification requires data where the two rewards decouple (e.g., no experimenter, or task impossible). | Suggesting "more complex models" or "longer tasks" without changing the contingency. (-5) |
  | **3. Ontological Status** | 5 | Distinguishes between reward as a predictive tool (instrumental) vs. reward as a internal cause (realist). Acknowledges IRL alone cannot settle this. | Asserting one model is "true" based on intuition, or claiming IRL proves the reward exists. (-5) |
  | **4. Role of Priors/Bias** | 5 | Explains that without divergence, choice depends on inductive bias (regularisation), which is pragmatic, not truth-tracking. | Describing regularisation as a mathematical trick without discussing its epistemic implications. (-5) |
  | **5. Underdetermination Link** | 5 | Correctly maps the IRL problem to underdetermination (many theories, one evidence set) and notes IRL's explicit handling of bias. | Vaguely saying "it's like philosophy" without explaining the mapping or the resolution. (-5) |

  **Examiner's Note:** To exceed 20 marks, the candidate must articulate that the "identification" comes from *outside* the likelihood function (via priors or new interventions). Answers that remain within the likelihood function cannot score in the top band.
