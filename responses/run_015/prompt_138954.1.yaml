  *   **Computation:**
      *   Difference per epoch: $d(t) = W_X(t) - W_Y(t) = (10 + N_X) - (10 + 100 N_Y) = N_X - 100 N_Y$.
      *   **Odd $k$:** $d(t) = (U_k + V_k) - (U_k - V_k) = 2 V_k$.
      *   **Even $k$:** $d(t) = (U_k - V_k) - (U_k + V_k) = -2 V_k$.
      *   Cumulative Difference $D(N)$ at end of Block $k$: Dominated by Block $k$'s contribution because $V_k \gg \sum_{j<k} L_j V_j$.
      *   Contribution of Block $k$: $C_k = L_k \cdot (\pm 2 V_k) = \pm 2^{k+1} 10^{2^k}$.
      *   As $k \to \infty$, $C_k$ alternates sign and magnitude $\to \infty$.
      *   $\limsup D(N) = +\infty$, $\liminf D(N) = -\infty$.

  4. **Structural Analysis and Ablations**

  *   **Structural Features:** PAD relies on the Asymmetry (Y-elites don't count as harms). LDA relies on the density of welfare-per-person (Elites boost average). LLS relies on the oscillating total welfare magnitude ($\pm 2V_k$).
  *   **Ablation 1 (Same Size Blocks):** If $L_k$ is constant, $V_k$ still dominates, so LLS still oscillates. LDA still converges. PAD unchanged.
  *   **Ablation 2 (Created Lives Above Baseline):** If X-workers had welfare 100 (same as Y-elites), LDA would tie (both averages $\approx 100$). PAD would still say X > Y (more happy people).
  *   **Ablation 3 (Drop Asymmetry):** If Y-elites count as "losses" for X, PAD becomes silent because X prevents the elites. The divergence vanishes.
  *   **Ablation 4 (Finite N):** PAD holds. LDA depends on truncation point (could favor X or Y). LLS becomes a fixed number (verdict depends on cutoff).

  5. **The Negative Half and Prevented Lives**

  You are correct. To make $D(N)$ negative (Y > X in totals) without violating PAD (no one worse off in X), the welfare deficit in X cannot come from existing people suffering. It must come from X having *less total welfare* than Y while keeping everyone happy. In Even blocks, Y's total welfare exceeds X's ($101V$ vs $99V$). This surplus comes entirely from the Y-elites who exist in Y but not in X. Thus, the "loss" in X is constituted by prevented lives (the elites X chose not to create). The case inherits the contested commitment that preventing a happy life is not a harm to anyone, yet contributes to total welfare comparisons in aggregative views.

  6. **Steelmans**

  *   **LDA Partisan:** "Averages capture quality of life. A world of billions at subsistence (X) is worse than a world of millions at luxury (Y), even if totals oscillate. Pareto principles break in infinite contexts; averaging is the only coherent extension of 'better life'."
  *   **PAD Partisan:** "The Asymmetry is non-negotiable. You cannot harm someone by not creating them. X creates more happy people than Y prevents. To say Y is better is to claim non-existence is a comparative state that can be worse than existence, which is metaphysically incoherent."
  *   **LLS Partisan:** "Silence is the only honest verdict. If cumulative advantage swings infinitely, no stable moral fact exists. This case doesn't separate criteria; it merely demonstrates that all aggregative metrics fail to stabilize in infinite oscillating worlds."

  7. **Finite Truncation and Conclusion**

  The PAD-versus-LDA split *does* arise in finite truncations once the "Elite Density" of Y outpaces the "Worker Density" of X in average calculations, even if totals fluctuate. However, even if this case works, you are not entitled to conclude that infinite ethics is solvable; you have only proven that three popular patch-clusters are mutually incompatible, forcing a choice between them rather than providing a synthesis.
