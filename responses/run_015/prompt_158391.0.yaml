  *Okay, the mechanism:* Board Alpha has Alpha People. Board Beta has Beta People. To file a harm claim against the *decision*, they must show that Person X is worse off than Person X would have been in the other scenario. They need to find Person X in the other scenario's registry. They ask the other board. The other board doesn't have them.
  *Refinement:* To make it tighter, the Facilitator holds the "Master Continuity Index." The students submit match requests. The Facilitator returns "No Continuity." This prevents the boards from just talking and solves the "disjoint" issue centrally.
  *Actually, the prompt implies the boards interact:* "The boards then attempt to present cross-claims." Okay, so they need to try to match their victims against the *other* board's population.
  *Decision:* I will have them exchange profile summaries. Board Alpha looks at their "Harmed Citizen" and asks Board Beta: "Does this person exist in your world?" Board Beta checks their list. They don't find them. Why? Because the conception details (e.g., "Parents met at Nuclear Plant Site A") are incompatible with Beta's geography ("Site A is a Protected Wetland"). This makes the *reason* for non-identity clear.

  *Let's finalize the timeline.*
  0-15: Intro & Policy Briefing.
  15-25: Decision & Packet Distribution.
