      4.  *Mechanism is humane:* Mechanistic explanations reduce blame (moral claim).
      5.  *First-person authority:* Patient account is authoritative; refused diagnosis shouldn't be imposed.
      6.  *Historical mortality:* Defunct diagnoses (e.g., neurasthenia) tell us about the category, not just patients.
      7.  *Fiction is part of the mechanism:* Novels make kinds available (responsibility), but protagonist *discovers* condition (realist sense), doesn't acquire costume.
