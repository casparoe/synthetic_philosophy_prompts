  # Joint Statement on Epistemic Standards in Historical Legend

  **Parties:** The Materialist Historian and The Narrative Stratigrapher
  **Subject:** Criteria for the Transition of Legend into History
  **Reference Narratives:** The Trojan War, The Arthurian Cycle, The Exodus

  ### I. Agreed Claims

  1.  **Nature of the Narratives:** The Trojan, Arthurian, and Exodus narratives are complex composites that contain elements of mythic symbolism, theological interpretation, and plausible historical reference; neither party claims these texts are purely factual records nor purely fictional inventions.
  2.  **Limits of Archaeology:** Archaeological methods provide data on material culture, settlement patterns, and destruction layers, but cannot directly access individual motives, specific names, or singular events without interpretive linkage to textual sources.
  3.  **Limits of Textual Analysis:** Textual criticism can establish relative chronologies, identify editorial layers, and detect anachronisms, but cannot independently verify physical events without external corroboration.
  4.  **Transmission Dynamics:** All three narratives underwent transmission through both oral and literate cultures, subject to modification, embellishment, and preservation bias; stability in transmission does not guarantee factual accuracy, nor does instability guarantee fabrication.
  5.  **Epistemic Standards:** Both parties agree that historical probability is graded rather than binary; the disagreement lies not in the desire for truth, but in the threshold of evidence required to classify a narrative element as "historical" rather than "legendary."
  6.  **Value of Disagreement:** The tension between material corroboration and narrative stratification serves as a necessary corrective against both naive literalism and excessive skepticism.

  ### II. Disagreements Table

  | Crux | Materialist Historian Formulation | Narrative Stratigrapher Formulation |
  | :--- | :--- | :--- |
  | **(i) The Anachronism Problem** | The presence of clearly later-period details within a legend contaminates the historicity of the whole narrative; unless specific claims are corroborated by contemporary evidence, the narrative must be dated to the period of its latest significant accretion. | The presence of later-period details marks the boundary between an older historical kernel and subsequent mythic accretion; decomposing these layers allows the earlier kernel to remain historically valid despite the later dressing. |
  | **(ii) The Negative-Evidence Problem** | The absence of archaeological traces for a claimed large-scale event counts as strong counter-evidence; if an event left no material footprint commensurate with its scale, the probability of its historicity is significantly reduced. | The absence of archaeological traces is an expected result of preservation bias, the nomadic nature of the actors, or the passage of time; it does not negate the historical kernel if textual stratification supports its plausibility. |
  | **(iii) The Convergence Criterion** | Independent traditions converging on a specific detail indicate a shared historical origin only if supported by material evidence; otherwise, convergence may be explained by shared literary dependence, common archetypes, or parallel invention. | Independent traditions converging on a specific detail (name, place, sequence) indicate a shared historical origin even without material evidence; the improbability of identical invention across independent lineages suggests a real underlying event. |

  ### III. Case Studies and Explicit Predictions

  **Crux 1: The Anachronism Problem**
  *   **Case:** The embedding of high-medieval chivalric and feudal structures within Arthurian narratives ostensibly set in the sixth century.
  *   **Materialist Historian Prediction:** This case demonstrates that the Arthurian narrative is a product of the high-medieval period rather than the sixth century; the anachronisms invalidate the narrative as a source for post-Roman British history unless specific sixth-century material corroboration is found.
  *   **Narrative Stratigrapher Prediction:** This case demonstrates the presence of mythic accretion over a historical kernel; the anachronisms allow us to strip away the medieval layer to reveal a plausible sixth-century leadership structure beneath, valid even without contemporary material proof.

  **Crux 2: The Negative-Evidence Problem**
  *   **Case:** The presence in the Exodus narrative of place names and ethnic designations that align more closely with Late Bronze Age geographic and political contexts than with Iron Age settlement patterns.
  *   **Materialist Historian Prediction:** This case demonstrates that the authors had access to older geographical traditions, but it does not demonstrate the historicity of the mass migration event itself; without archaeological evidence of the migration, the negative evidence remains decisive.
  *   **Narrative Stratigrapher Prediction:** This case demonstrates that the narrative preserves a historical kernel from the Late Bronze Age; the retention of obsolete geographic knowledge implies a transmission chain originating in the period of the event, overcoming the lack of material traces.

  **Crux 3: The Convergence Criterion**
  *   **Case:** The Hittite textual references associating Wilusa and Ahhiyawa with the Trojan region and conflict.
  *   **Materialist Historian Prediction:** This case demonstrates that contact and conflict occurred in the region, but it does not demonstrate the historicity of the specific narrative claims (e.g., Helen, Achilles, ten-year siege); the legend remains distinct from the historical record.
  *   **Narrative Stratigrapher Prediction:** This case demonstrates that the core conflict of the legend is historical; the convergence of Hittite records and Greek tradition confirms the historical kernel of the Trojan War, validating the narrative's central claim despite gaps in the specific details.

