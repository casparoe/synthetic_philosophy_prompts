answer: |-
  Here is the ranking of conceptual lines for a three-year workshop, ordered by leverage and tractability, based on the criteria of dependency, solvability, and downstream impact.

  ### 1. Decision-Theoretic Divergence in Duplication Scenarios
  **Rank:** High Priority (The "Go/No-Go" Gate)
  **Role:** Downstream validator, but upstream priority for resource allocation.

  **Reasoning:**
  This is the highest-leverage starting point because it determines whether the metaphysical and normative debates are substantive or merely verbal. In standard Sleeping Beauty cases, Halfers and Thirders often reconcile by adjusting utility functions (e.g., caring about "number of awakenings" vs. "truth of the coin"). However, in **epistemic duplication** (where physical copies exist simultaneously with divergent futures), this reconciliation is harder.

  *   **Tractability:** High. This is formalizable. You can construct betting scenarios where copies act independently or collectively. You can prove whether a specific credence function leads to a guaranteed loss (Dutch Book) under specific utility constraints. This yields binary results (consistent/inconsistent) rather than endless intuition-pump trading.
  *   **Dependency:** Pragmatically upstream. If it is proven that Halfer and Thirder credences yield identical betting strategies in *all* duplication setups (given rational utility), the rest of the workshop is purely semantic. If they diverge, the problem is real and urgent.
  *   **Impact:** Solving this dictates the necessity of the other two lines. If behavior diverges, you *need* a normative theory to explain why one is rational. If it doesn't, you can dismiss the metaphysics as idle.

  ### 2. Norms of Updating Under Branching Identity
  **Rank:** Medium Priority (The Core Mechanism)
  **Role:** The normative bridge between metaphysics and action.

  **Reasoning:**
  Once you establish that betting behavior *can* diverge, you must determine which credence assignment is rational. This moves the debate from "what happens" to "what ought to be believed." The core tension here is whether standard Conditionalization applies when the agent set expands (i.e., when *you* become *two*).

  *   **Tractability:** Medium. This relies on logic and consistency arguments (e.g., reflection principles, diachronic coherence). It is harder than decision theory because it involves defining the "agent" over time without slipping into metaphysics. However, it is more tractable than pure ontology because it is constrained by the decision-theoretic outcomes identified in Rank 1.
  *   **Dependency:** Downstream of Decision Theory (you need to know what's at stake), but upstream of Metaphysics (you need to know what norms to satisfy before deciding what ontology supports them).
  *   **Impact:** Resolving this provides the actual "solution" to the workshop. It tells philosophers how to reason in cases of fission, cloning, or simulation. It moves the debate from "Sleeping Beauty is weird" to "Here is the correct logic for branching observers."

  ### 3. Metaphysics of Centered Content (Worlds vs. Propositions)
  **Rank:** Low Priority (The Foundation Trap)
  **Role:** Theoretical substrate, high risk of stagnation.

  **Reasoning:**
  This line asks what self-locating beliefs *are*. Are they sets of centered worlds? Centered propositions? Something else? While logically upstream (you need content to have credences), it is the least worthy of dedicated workshop time because it is the most prone to stalemate.

  *   **Tractability:** Low. This debate has run for decades without convergence. It relies heavily on pre-theoretic intuitions which are exactly what the Sleeping Beauty problem destabilizes. You cannot use intuition pumps to solve a problem that breaks intuition pumps.
  *   **Dependency:** Logically upstream, but pragmatically downstream. You can often bypass ontological commitments by focusing on the functional role of belief (Rank 1 & 2). Many decision-theoretic solutions work regardless of whether you prefer centered worlds or propositions.
  *   **Impact:** Low marginal return. Refining the definition of a "centered proposition" rarely forces a resolution on the Halfer/Thirder debate. It usually just provides new vocabulary for the same disagreement.

  ---

  ### Evidence That Would Flip This Ordering

  The ranking above assumes a **pragmatic** dependency (solve the practical consequence first). The ordering flips to the **logical** dependency (Metaphysics → Norms → Decision) if the following theoretical evidence emerges in the next two years:

  1.  **The "Underdetermination Proof":** If a formal proof demonstrates that decision-theoretic outcomes are *necessarily* underdetermined by credence alone in duplication cases (i.e., you can always tweak utility functions to save any credence), then Rank 1 becomes a dead end. **Flip:** Metaphysics moves to #1. You would need to solve the ontology of the agent to constrain the utility function.
  2.  **The "Incoherence Theorem":** If it is shown that standard probability calculus yields a mathematical contradiction (not just a paradox) when applied to branching identity *regardless* of betting behavior, then Rank 2 moves to #1. The problem becomes about saving the logic of probability, not just guiding bets.
  3.  **The "Semantic Block":** If proponents of Centered Worlds and Centered Propositions prove that their respective frameworks *entail* different updating norms (rather than just accommodating them), then Rank 3 moves to #1. The metaphysics would become the driver of the norm, not the description of it.

  ### Summary of Strategy
  Do not start with the metaphysics. It is a sinkhole. Start by trying to break the agents with bets. If you can force a divergence in rational action between Halfers and Thirders in a duplication lab, you have a live problem. If you cannot, you have a verbal dispute masquerading as a paradox. Allocate the majority of the workshop's first year to formalizing the duplication betting scenarios; use the second year to derive updating norms from the winners of year one; leave the metaphysics for the final year as a cleanup operation to describe what the winners were actually talking about.
