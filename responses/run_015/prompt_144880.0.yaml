      *   *Step 2 (Currency & Stakes):* Dutch books work because money is assumed desirable in every state (state-independent) and additive (separable). If the agent values money less when poor (diminishing marginal utility) or only in specific states, the bookie can't guarantee loss. The constructions assume linear utility for the currency. To fix this, we might say "bet in utils". But utils aren't transferable goods. You can't hand someone '5 utils'. To define the bet in utils presupposes we already know the utility function, which is what the theorem was supposed to derive. Circular.
      *   *Step 3 (Loss vs. Gain):* Coherence arguments focus on avoiding sure loss (negative coherence). They don't force you to take sure gains (positive coherence). An agent can be reverse-exposed (refusing a sure gain) without being incoherent in the standard sense. Maximizing requires taking all sure gains. Avoiding loss is merely consistency; securing gain is efficiency. Refusing a gift isn't logically contradictory, just suboptimal. To make it incoherence, you need a norm saying "you must want more currency", which is substantive, not structural.
