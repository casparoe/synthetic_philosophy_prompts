answer: |-
  Consider an agent whose preferences are partial or who follows a satisficing rule. She ranks options as 'acceptable' or 'unacceptable'. Among acceptable options, she is indifferent; she chooses any that meet her threshold. She lacks a complete ordering and does not seek a unique maximum, so she is not an expected-utility maximizer. Yet she is package-immune. She evaluates any bundle of bets as a whole against her status quo. If the bundle leaves her worse off in every state relative to her current endowment, she rejects it, because her status quo is acceptable and the bundle is not. She is also sequence-immune. An adversary offering trades adaptively cannot pump her. She accepts a trade only if it moves her from unacceptable to acceptable. Once satisfied, she refuses further trades. The money pump requires strict preference cycles; satisficing breaks the chain by refusing to trade when 'good enough'. Thus, coherence arguments fail to rule her out. She violates transitivity or completeness yet remains immune to the standard constructions.

  Why do these constructions fail to compel expected-utility maximization? They rely on a settlement currency assumed to be valuable in every state, independently of other holdings. The bookie guarantees loss by ensuring the agent pays money in states where she loses bets. This works only if money is separable in value and the agent wants more of it regardless of context. If the agent values money only instrumentally for specific goods, or if marginal utility diminishes sharply, the 'sure loss' in currency might not be a sure loss in welfare. Losing dollars when destitute hurts more than gaining them when rich. The bookie assumes linear value for the currency. The obvious repair is to denominate payoffs in utility units. But this is unavailable. Utility units are not transferable goods a bookie can hand over. To define the bet in utils presupposes we already know the utility function, rendering the argument circular. The theorem was supposed to establish the utility function; it cannot presuppose it to define the bets. Consequently, the requirement yielded is conditional on a substantive preference for the currency, making it instrumental rather than constitutive of rationality.

  Furthermore, coherence arguments exhibit a crucial asymmetry. They demonstrate that violating structural constraints exposes an agent to sure loss. They do not show that violating them prevents securing sure gains. An agent can be reverse-exposed: she might refuse a bundle or sequence that guarantees a net gain. This is not incoherence. Refusing a gift is not logically contradictory. A saint might refuse a gain that requires harming another; a satisficer might refuse a gain that requires extra effort beyond her threshold. Maximizing requires both avoiding loss and securing gain. Coherence arguments only secure the former, and only relative to the currency preference. To make reverse-exposure irrational, one must add a substantive norm: 'you ought to want more currency'. This is a preference, not a structural constraint.

  Two strategies attempt to close this gap. First, the epistemic reconstruction. It argues credences should minimize inaccuracy. A scoring rule shows probabilistic credences minimize expected inaccuracy. But to move from credence to action, one needs a bridge principle: 'choose the act that minimizes expected inaccuracy'. This principle smuggles in expected-utility maximization. It uses the norm to ground the norm. It delivers constraints on credence rather than on action, unless one assumes the very decision-theoretic norm at issue. Second, the constitutive reading. It claims incoherence renders an agent unintelligible; interpretation supplies expected-utility structure. This grants that radical incoherence destroys agency. But it converts a norm into a conceptual claim. It says agents *are* coherent, not that they *ought* to be. The challenge 'why be coherent?' returns untouched. If coherence is a condition for being an agent, it cannot be a requirement for agents. It becomes a prediction about interpretable creatures, losing its normative upshot.

  Finally, consider the one-shot agent. She faces a single decision and never acts again. Diachronic machinery—books and pumps—is idle. There is no sequence to exploit. Only a synchronic Dutch book remains. But if she refuses to bet, she is immune. The argument survives only as a constraint on betting prices for those willing to bet. It ceases to be a general argument for rationality. It becomes a constraint on market participation. For such an agent, coherence is not a demand of reason but a condition of trading.

  The argument is strongest on the dependence on currency. Without a state-independent good, the sure loss is not sure welfare loss. This undermines the universal force of the Dutch book, showing it binds only those who value the settlement medium universally. I concede ground on the constitutive reading. If incoherence truly destroys agency, then for any entity we recognize as an agent, coherence holds. But this concession costs normativity. It saves the theory by making it descriptive of agency rather than prescriptive for rationality. The coherence argument establishes immunity, not maximization. It shows that incoherence is costly for those who want money, not that it is irrational for those who do not.
