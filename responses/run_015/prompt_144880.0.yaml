      Consider an agent with satisficing preferences. She ranks options as 'acceptable' or 'unacceptable'. Among acceptable ones, she is indifferent. She chooses any acceptable option. If none exist, she chooses nothing. This agent is not an EU maximizer; she lacks a complete ordering and does not seek the maximum. Yet she is package-immune. She evaluates any bundle of bets as a whole. If the bundle leaves her worse off in every state relative to her status quo, she rejects it, because her status quo is acceptable and the bundle is not. She is sequence-immune. An adversary offering trades adaptively cannot pump her. She accepts a trade only if it moves her from unacceptable to acceptable, or improves an acceptable outcome strictly (which she doesn't do, she satisfices). Once satisfied, she refuses further trades. The money pump requires strict preference cycles; satisficing breaks the chain by refusing to trade when 'good enough'. Thus, coherence arguments fail to rule her out.

      Why do the constructions fail? They rely on a settlement currency assumed to be valuable in every state, independently of other holdings. The bookie guarantees loss by ensuring the agent pays money in states where she loses bets. This works only if money is separable in value and the agent wants more of it regardless of context. If the agent values money only instrumentally for specific goods, or if marginal utility diminishes sharply, the 'sure loss' in currency might not be a sure loss in welfare. The obvious repair is to denominate payoffs in utility units. But this is unavailable. Utility units are not transferable goods a bookie can hand over. To define the bet in utils presupposes we already know the utility function, rendering the argument circular. The theorem was supposed to establish the utility function; it cannot presuppose it to define the bets.

      Furthermore, coherence arguments exhibit a crucial asymmetry. They demonstrate that violating structural constraints exposes an agent to sure loss. They do not show that violating them prevents securing sure gains. An agent can be reverse-exposed: she might refuse a bundle or sequence that guarantees a net gain. This is not incoherence. Refusing a gift is not logically contradictory. Maximizing requires both avoiding loss and securing gain. Coherence arguments only secure the former, and only relative to the currency preference. To make reverse-exposure irrational, one must add a substantive norm: 'you ought to want more currency'. This is instrumental, not constitutive of rationality.

      Two strategies attempt to close this gap. First, the epistemic reconstruction. It argues credences should minimize inaccuracy. A scoring rule shows probabilistic credences minimize expected inaccuracy. But to move from credence to action, one needs a bridge principle: 'choose the act that minimizes expected inaccuracy'. This principle smuggles in expected-utility maximization. It uses the norm to ground the norm. Second, the constitutive reading. It claims incoherence renders an agent unintelligible; interpretation supplies EU structure. This grants that radical incoherence destroys agency. But it converts a norm into a conceptual claim. It says agents *are* coherent, not that they *ought* to be. The challenge 'why be coherent?' returns untouched. If coherence is a condition for being an agent, it cannot be a requirement for agents.

