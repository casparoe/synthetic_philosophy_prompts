answer: |-
  Look, the supply chain for the Roman legions didn't collapse because one guy lost a reciept; systems have inertia that swallows minor errors until the whole thing snaps.

  But that inertia isn't physics, it's just thousands of clerks deciding not to sweat the small stuff, and any one of them could've panicked instead.

  Sure, but those clerks are trained to ignore noise, which is why it takes a decade of drought to break a kingdom, not a lost nail.

  Unless that nail was in the horseshoe of the messenger carrying the drought relief orders, which is exactly the kind of randomness your viscosity model ignores.

  Even then, the deputy opens the copy, because bureaucracy is built on redundancy, not single points of failure.

  Redundancy is just more people making choices, and if the deputy was sick because of a bad batch of grain, your back to square one.

  That's my point though, the system absorbs the bad grain until the harvest fails three years in a row, creating a pressure valve effect.

  Calling it a pressure valve makes it sound inevitable, when really it's just us pretending we can't see the individual hands on the lever.

  Maybe, but without viscosity you can't explain why empires last centuries instead of weeks, since chaos should tear them apart immediately.

  Or maybe they last centuries because people work really hard to fix the tiny breaks before they become cracks, which is still chaos, just managed.
