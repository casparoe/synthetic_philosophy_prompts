prompt: |-
  hey so im working on this novel where the characters dont really have inner lives, theyre just bundles of dialogue patterns and plot functions, and last week my writing group got into a huge argument about whether real people are basically the same — like, is there any such thing as belief or desire, or are we all just running behavioral scripts? i stumbled across this thing called eliminative materialism, the view that folk psychology is just wrong and eventually neuroscience will replace talk about beliefs and desires entirely. i need you to restate that position using only the vocabulary i use when breaking story: diegetic motivation (what the plot needs the character to do), mimetic psychology (the illusion of inner life we build for readers), narrative debt (when actions dont match the mental states weve assigned), and subtext as behavioral residue. im fluent in craft talk but clueless about philosophy, so translate it as faithfully as you can, then give me the residue report — what survives intact, what gets distorted to fit, and what has no counterpart at all in how i think about fiction. specifically, i want to know whether the claim that neuroscience replaces folk psychology can even be expressed in terms of plot mechanics and reader illusion, or if thats a gap in my framework or just philosophical overreach.
