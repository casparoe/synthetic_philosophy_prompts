answer: |-
  We built the scale to weigh the agent's trace,
  Against the world where it had never woke.
  No value stated, no preference named,
  Just distance kept within a bounded space,
  Between the real and what might have obtained.
  We thought the metric neutral, void of bias,
  As if the geometry could stand alone,
  To measure change without a name for loss.

  But which features?
  Energy flow?
  Or information states?
  To measure change
  is to choose what changes.
  The baseline breathes.
  It holds something sacred.
  What we keep constant
  is what we love.
  The null set is not empty.

  So we must name the good we mean to spare,
  Not hide behind the mask of clean design.
  A minimal vow written in the code,
  To say this matters though we cannot say why.
  The price of coherence is this choice,
  Neutrality was the lie we told ourselves.
  Now we stand here with the burden clear,
  To choose the scale is to choose the world itself.
