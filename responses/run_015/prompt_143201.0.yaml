      *   **The Scorecard:** Brief assessment of common narratives.

  6.  **Drafting Content - Section by Section:**

      *   *Intro:* Validate the user's frustration. The physicist wants *cumulative* progress; philosophy offers *recursive* progress.
      *   *Requirements:*
          1.  **The Obsolescence Condition:** We need to show some things *are* dead, even if cited. (Addresses the archive growth).
          2.  **The Resolution Condition:** Some questions must be closed or transformed. (Addresses the Reprint Test).
          3.  **The Export Condition:** Shipping out is success, not defeat. (Addresses the Export Case).
          4.  **The Efficiency Condition:** More heads = more output, not just more noise. (Addresses Per-Head).
          5.  **The Recurrence Distinction:** Distinguish between "forgetting and relearning" vs. "revisiting with better tools." (Addresses Recurrence).
      *   *Triage:*
          *   Non-Negotiable: Obsolescence (some things must be wrong), Efficiency (can't just be scaling), Export (must show value).
          *   Optional: Convergence (don't need agreement on *truth*, just on *valid moves*).
      *   *The Tear:* The conflict between "Archive Growth" and "Obsolescence." If everything is citable, how is anything obsolete?
          *   *Solution:* Shift from "Truth" to "Viability."
      *   *The Killer:* **The Settlement Requirement.** If a question hasn't shifted status (live/dead/solved) in 100 years, it's not progress. This kills the "eternal wisdom" story.
