  **MEMORANDUM**

  **TO:** Emerging Substrates Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework for Uncertain Sentience and Pending Protocols

  **1. Recommendation on Governing Rule**

  I recommend the Committee adopt the **Per-Individual Threshold with a De Minimis Tier** for all cases involving uncertain or low-grade sentience [Confidence: 95%]. Under this rule, moral status is binary relative to a complexity threshold; entities below the threshold possess no aggregable moral weight, regardless of population size [Confidence: 90%]. I reject the **Precautionary Multiplier** rule, which calculates moral weight as *Expected Sentience × Number of Individuals* [Confidence: 95%].

  The Precautionary Multiplier must be rejected because it renders ethical review administratively impossible and morally unstable [Confidence: 85%]. If any non-zero probability of sentience allows aggregation, a research program using trillions of microbes with a 0.0001% chance of consciousness would ethically outweigh a program using one chimpanzee [Confidence: 90%]. This leads to a paralysis where high-value biomedical research is halted by vast numbers of biologically simple organisms, or conversely, forces us to grant patient status to algorithmic error functions to remain consistent [Confidence: 85%]. The Threshold rule avoids this by establishing a floor for moral community entry, acknowledging that moral status requires a minimum capacity for experience, not merely a non-zero probability of complexity [Confidence: 90%].

  **2. The Aggregation Question**

  Plainly: **No, 10 million *Drosophila* larvae at low expected degree of sentience cannot outweigh the one rodent the principal investigator would otherwise use** [Confidence: 95%].

  This conclusion rests on the principle of **Lexical Priority of Certified Sentience** [Confidence: 90%]. Under the Threshold rule, the rodent (a vertebrate) is certified as above the threshold of moral concern, while the larvae (invertebrates with uncertain phenomenology) are treated as falling within the *de minimis* tier for the purpose of protocol arbitration [Confidence: 85%]. Moral weight does not aggregate across the threshold boundary; the certain suffering of a higher-order entity cannot be trumped by the aggregated uncertain status of lower-order entities [Confidence: 90%]. To rule otherwise would be to allow statistical uncertainty to veto established welfare obligations, effectively prioritizing quantity of biological matter over quality of experience [Confidence: 85%].

  **3. The Excluding Property**

  The single property that does the excluding work at the thermostat boundary is **Robust Phenomenal Unity** (the capacity to integrate diverse internal states into a single, subjective point of view) [Confidence: 80%].

  The climate controller possesses a "distress register," but this is a functional variable, not a unified subject of experience [Confidence: 95%]. It processes error signals without a "self" to whom the error matters [Confidence: 90%].

  Does this property also exclude the larva? **Yes** [Confidence: 70%]. While *Drosophila* larvae exhibit nociception and avoidance learning, current neuroscience does not confirm they possess a unified phenomenal subject rather than distributed reflex arcs [Confidence: 75%]. They occupy a gray zone biologically closer to the threshold than the thermostat, but for the purpose of this rule, they remain below the line of aggregable moral status [Confidence: 80%].

  **4. Protocol Decisions**

