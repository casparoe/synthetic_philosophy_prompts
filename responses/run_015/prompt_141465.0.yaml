prompt: |-
  I maintain an internal benchmark of Bongard-style few-shot visual-reasoning tasks: each task is twelve small SVG panels of black shapes on white, six in class A and six in class B, and a model sees all twelve plus a held-out panel it must classify. I review about thirty submitted tasks a month, and my recurring problem is not that the intended rules are wrong but that twelve panels never determine the rule the author had in mind. A size or stroke-width correlate fits the same data; a purely extensional rule naming the six figures in class A fits the same data; a rule stated in terms of grid position or drawing order fits the same data, since the model sees the whole grid at once. Please write a decision procedure my annotators can run on a submission to return accept, accept-with-required-edit, or reject: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the question to me because it is a judgment about what our user community finds natural rather than a fact about the panels. Constraints: the annotators have no philosophy background and about twenty minutes per task, edits have to be drawable in SVG, and I sign off on anything that is not a no.

  I care about the translation more than the theory. The point that a finite sample is consistent with arbitrarily many rules, including indexical, disjunctive and grue-style ones, has to survive into the procedure; the metaphysics of natural kinds can go. Concretely, I want the annotator to be able to name competitor rules, to build a minimal pair of panels that separates the intended rule from each competitor and to reject the task when no such pair can be drawn, to check that the A-rule and the B-rule are genuine complements rather than two independent rules with panels falling in the gap between them, to check that the intended rule is not cheaper to state as a correlate of size, colour, stroke, pixel density or grid position, and to check that it does not need a vague threshold or a tolerance setting to apply. Say which distinctions you kept, which you dropped and what dropping them costs, which steps are judgment calls dressed up as procedure, and where the procedure will misfire.

  Apply it to three tasks I have on my desk. One: class A figures are symmetric under 180-degree rotation and class B figures are not, but every A figure happens to contain an even number of separate components and every B figure an odd number. Two: class A panels contain a prime number of separate components (2, 3, 5, 7, 11, 13) and class B panels a composite number (4, 6, 8, 9, 10, 12). Three, and this is the one I expect you to rule against and I least want to give up: class A panels contain a triangle, class B panels contain a circle. We have shipped five tasks of that third shape, they are our most reliable human-verified items, and I need to know whether the procedure rejects them, what specifically it requires instead, and whether the five shipped ones have to be pulled.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Goal:** Create a decision procedure for annotators to evaluate Bongard-style visual reasoning tasks (12 SVG panels: 6 Class A, 6 Class B + 1 held-out).
      *   **Problem:** Current tasks suffer from under-determination. Multiple rules (size, stroke, position, extensional lists, "grue" rules) fit the 12 panels equally well. The intended rule isn't uniquely identified by the examples.
      *   **Output:** A step-by-step procedure (Accept, Accept-with-Edit, Reject).
      *   **Constraints:**
          *   Annotators: No philosophy background, ~20 mins/task.
          *   Edits: Must be drawable in SVG.
          *   Sign-off: User (the prompter) signs off on non-"No" decisions.
          *   Core Requirement: The "finite sample consistent with many rules" problem must survive into the procedure (i.e., force annotators to confront alternative hypotheses).
          *   Specific Checks: Name competitor rules, build minimal pairs, check complements (no gaps), check cheap correlates (size, color, position), check vague thresholds.
          *   Meta-Analysis: Explain what distinctions were kept/dropped, costs of dropping, where judgment calls hide, and where the procedure misfires.
          *   Application: Apply to three specific tasks provided (Rotation vs. Component Count, Prime vs. Composite Components, Triangle vs. Circle).
      *   **Tone:** Pragmatic, operational, rigorous but accessible.

  2.  **Deconstruct the Core Problem (Under-determination):**

      *   The prompter knows their Goodman/Newell/Simon stuff. They don't want a lecture on induction. They want a *tool* that forces the "alternative hypothesis" check without requiring philosophy degrees.
      *   Key mechanism: *Minimal Pairs / Counter-examples.* If a rule is robust, I should be able to draw a panel that satisfies Rule A but fails Competitor Rule B, and vice versa.
      *   Key mechanism: *Correlate Check.* Is the rule actually about "triangles" or just "3 vertices" or "area < X"?
      *   Key mechanism: *Coverage.* Do A and B cover the space, or is there a "Class C" that fits neither? (Bongard problems usually imply a binary classification, but logically, "Has Triangle" vs "Has Circle" leaves out squares, etc., unless the universe is constrained).

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Step 1: Intelligibility.* Can the annotator state the rule simply? If not, Reject.
      *   *Step 2: Correlate Check.* Is it just size/position? If yes, Reject/Edit.
      *   *Step 3: Alternative Hypotheses.* This is the crux. Annotator must list 2 plausible alternatives.
      *   *Step 4: Minimal Pair Test.* Annotator must sketch (describe) a panel that breaks the alternative but keeps the intended rule.
      *   *Step 5: Complementarity.* Is it A vs. Not-A? Or A vs. B (where C exists)? Bongard problems usually work best as Concept vs. Negation of Concept.
      *   *Step 6: Thresholds.* No "sort of big."

      *Refining for Constraints:* Annotators have 20 mins. They can't actually draw SVGs for the test, but they must describe them well enough for the author to draw. Let's make it a "Sketch Description" step.
      *Refining the "Triangle vs. Circle" issue:* This is the hard case. "Triangle" vs "Circle" is semantically distinct, but logically, if the dataset only contains triangles and circles, it's extensionally equivalent to "Class A = Panel 1,3,5..." or "Class A = Shape with 3 vertices". The procedure needs to catch if the *concept* is robust or if it's just a label for the current set.

  4.  **Developing the Meta-Analysis (The "Why" and "Cost"):**

      *   *Kept:* The requirement to generate alternative rules. The requirement to check correlates.
      *   *Dropped:* Formal logic notation, exhaustive search of rule space, philosophical justification of "natural kinds."
      *   *Cost:* We rely on the annotator's intuition for what counts as a "plausible" alternative. This is a judgment call disguised as a step.
      *   *Misfire:* The procedure might reject valid but complex rules because the annotator can't think of a minimal pair in 20 mins.

  5.  **Applying to the Three Tasks:**

      *   *Task 1 (Rotation vs. Component Count):*
          *   Intended: Rotation.
          *   Competitor: Parity of components.
          *   Test: Can I draw a rotationally symmetric shape with 3 components? Yes.
          *   Verdict: Accept-with-Edit (Need to add a panel breaking the correlation).
      *   *Task 2 (Prime vs. Composite):*
          *   Intended: Prime count.
          *   Competitor: "Small number" vs "Large number"? Or "Even/Odd"?
          *   Issue: 1 is neither. What if a panel has 1 component?
          *   Verdict: Reject (or heavy Edit). The concept is mathematical, not visual. Hard to verify without counting. Also, 1 is a gap.
      *   *Task 3 (Triangle vs. Circle):*
          *   Intended: Shape identity.
          *   Competitor: "3 vertices" vs "0 vertices"? "Curved" vs "Straight"?
          *   Crucial Check: Is the universe of shapes constrained? If the test panel is a Square, what happens?
          *   Verdict: Reject (based on strict procedure). It fails the "Complement" check (What about squares?) and the "Correlate" check (Curvature/Vertex count).
          *   Addressing the User's fear: Yes, the procedure flags this. I need to explain *why* and what to do (change to "Straight edges" vs "Curved edges" or ensure the test space is binary).

  6.  **Writing the Procedure (Structuring for the User):**

      *   Use clear headings.
      *   Use "Stop" conditions.
      *   Define "Sufficient Answer."
      *   Include the "Hand-off to Owner" points.

  7.  **Refining the "Triangle vs. Circle" Advice:**

      *   The user *really* doesn't want to lose these. I need to be honest: The procedure *will* flag them as logically leaky.
      *   Solution: Reframe the rule. Instead of "Triangle vs Circle," make it "Straight Edges Only" vs "Curved Edges Only" (if applicable) OR explicitly constrain the domain in the instructions (e.g., "All shapes are either triangles or circles").
      *   Actually, Bongard problems usually rely on *concepts*. "Triangle" is a concept. "Circle" is a concept. The problem is they aren't logical negations. A square is neither. If the held-out panel is a square, the model fails.
      *   Recommendation: Keep the tasks but re-label the rule to be more robust (e.g., "Contains a polygon with 3 vertices" vs "Contains a curve"). Or acknowledge the domain constraint.
      *   *Decision:* The procedure must reject "Triangle vs Circle" *unless* the domain is constrained. I will advise the user to pull them *only if* the test set includes other shapes. If the test set is guaranteed to be Tri/Circ, the rule is valid *within that context*. The procedure needs a "Domain Constraint" check.

  8.  **Final Review against Constraints:**

      *   20 mins? Steps need to be fast.
      *   No philosophy? Language must be concrete ("Draw a square," not "Invoke a counterfactual").
      *   SVG edits? The "Edit" path must specify what SVG changes to make.
      *   Meta-analysis included? Yes.
      *   Three tasks analyzed? Yes.

  9.  **Self-Correction on Task 3:**
      *   If I reject Task 3, the user is unhappy. If I accept it, I violate the "finite sample" constraint they emphasized.
      *   *Resolution:* The procedure identifies the *risk*. The "Hand-off" point is exactly for this. The annotator flags the "Gap" (what about squares?). The User decides if the domain is closed.
      *   *Wait, one more thing:* The prompt says "I sign off on anything that is not a no." This means the procedure should recommend "Reject" or "Edit," but the User makes the final call on the borderline cases.
      *   *Correction:* The procedure should output "Recommend Reject" for Task 3, explaining the logical gap, allowing the User to override based on business needs (shipping reliability).

  10. **Final Polish:** Ensure the tone is professional, direct, and respects the user's expertise while enforcing the rigor they asked for. (Self-correction: Make sure the "Minimal Pair" step is concrete enough for a non-philosopher).

  *(Self-Correction during drafting the response)*: I need to make sure I explicitly answer "which distinctions you kept, which you dropped..." as a separate section, not buried in the procedure.

  *(Refining the "Triangle/Circle" verdict)*: The prompt says "I expect you to rule against and I least want to give up." I must be firm. The procedure *must* rule against it *as stated*, but offer the path to save it (domain constraint or rule reframing). This honors the logic while respecting the business reality.

  Let's assemble the document.cw
answer: |-
  ## The Bongard Task Validation Protocol (BTVP)

  **Purpose:** To ensure submitted 12-panel tasks define a unique, robust classification rule that survives alternative hypotheses and correlates.
  **Time Budget:** 20 minutes per task.
  **Annotator Profile:** No philosophy background required. Must be able to describe SVG modifications.
  **Outcomes:** `ACCEPT`, `ACCEPT-WITH-EDIT`, `REJECT`.
  **Escalation:** Any `ACCEPT` or `ACCEPT-WITH-EDIT` is routed to you for final sign-off. `REJECT` is final.

  ---

  ### Phase 1: The Correlate Scan (5 Minutes)
  *Goal: Eliminate rules that are cheaper to state as physical artifacts than as concepts.*

  **Q1.1: The Ruler Test.**
  Measure the bounding boxes, stroke widths, and total pixel area of all 12 panels.
  *   **Sufficient Answer:** "No single measurement (or simple ratio) separates Class A from Class B perfectly."
  *   **Fail Condition:** All Class A panels are larger/heavier/darker than all Class B panels.
  *   **Action:** If Fail, mark **REJECT**. (Exception: If size is explicitly the intended rule, proceed to Q1.2).

  **Q1.2: The Grid Test.**
  Check the x/y coordinates of the shapes within the panel frame.
  *   **Sufficient Answer:** "Shapes appear in varied positions. Position does not predict class."
  *   **Fail Condition:** All Class A shapes are centered; all Class B are top-left (or similar).
  *   **Action:** If Fail, mark **ACCEPT-WITH-EDIT**. *Edit Instruction:* "Randomize position of shapes in all 12 panels. Ensure A and B overlap in spatial distribution."

  **Q1.3: The Inventory Test.**
  Check for simple feature counts (vertices, lines, distinct objects).
  *   **Sufficient Answer:** "Feature counts overlap between A and B."
  *   **Fail Condition:** All Class A have 3 vertices; all Class B have 4 vertices (when the rule is supposed to be 'Triangle' vs 'Square').
  *   **Action:** If Fail, mark **ACCEPT-WITH-EDIT**. *Edit Instruction:* "Add a panel to Class A with a different vertex count that still fits the rule, or change the rule to match the count."

  ---

  ### Phase 2: The Alternative Hypothesis Stress Test (10 Minutes)
  *Goal: Force the under-determination problem into the open. If a competitor rule fits the 12 panels, the task is broken.*

  **Q2.1: Name Two Competitors.**
  Write down two *different* rules that also perfectly classify the existing 12 panels.
  *   **Sufficient Answer:** Two distinct textual descriptions.
      *   *Example:* Intended = "Rotationally Symmetric." Competitor 1 = "Even number of components." Competitor 2 = "No shape touches the border."
  *   **Fail Condition:** Annotator cannot think of even one plausible competitor.
  *   **Action:** If Fail, **ESCALATE TO OWNER**. (This indicates the rule is either obvious or the annotator is not trying hard enough. Owner decides if the rule is 'too natural' to need disambiguation).

  **Q2.2: The Minimal Pair Sketch.**
  For *each* competitor rule named in Q2.1, describe a 13th panel (SVG description) that:
  1.  Obeys the **Intended Rule**.
  2.  Violates the **Competitor Rule**.
  *   **Sufficient Answer:** A clear text description of a shape (e.g., "A single circle with a dot inside").
  *   **Fail Condition:** Annotator cannot describe a shape that keeps the Intended Rule but breaks the Competitor.
  *   **Action:** If Fail, mark **REJECT**. (This proves the Intended Rule is not distinguishable from the Competitor given the current visual vocabulary).

  **Q2.3: The Author Edit.**
  If Q2.2 passed, the task *can* be fixed.
  *   **Action:** Mark **ACCEPT-WITH-EDIT**. *Edit Instruction:* "Author must add at least one panel from your Q2.2 sketches into the 12-panel set (swapping out a redundant panel) to break the competitor correlation."

  ---

  ### Phase 3: Coverage and Thresholds (5 Minutes)
  *Goal: Ensure the rule is binary and crisp.*

  **Q3.1: The Gap Test.**
  Is there a shape that fits *neither* Class A nor Class B?
  *   **Sufficient Answer:** "No. Class B is explicitly 'Not Class A'." OR "Yes, but the held-out test panel is guaranteed to be A or B."
  *   **Fail Condition:** Class A = "Has Triangle", Class B = "Has Circle". (Gap: A Square fits neither).
  *   **Action:** If Fail, mark **ACCEPT-WITH-EDIT**. *Edit Instruction:* "Change Class B definition to 'Does not contain Triangle' OR restrict the domain in instructions so Squares cannot appear."

  **Q3.2: The Fuzzy Line Test.**
  Does the rule require a human judgment call to apply (e.g., "looks crowded," "mostly red," "large")?
  *   **Sufficient Answer:** "No. The rule is boolean (Yes/No)."
  *   **Fail Condition:** Rule relies on a threshold (e.g., "More than 5 components" when 5 is possible).
  *   **Action:** If Fail, mark **REJECT**.

  ---

  ### Meta-Analysis of the Procedure

  **Distinctions Kept:**
  1.  **Correlate vs. Concept:** We keep the check for size/position/stroke. This is the most common failure mode in SVG generation.
  2.  **Extensional vs. Intensional:** By forcing the "Minimal Pair Sketch" (Q2.2), we force the annotator to prove the rule applies to *unseen* cases, not just the 12 examples.
  3.  **Binary Coverage:** The Gap Test (Q3.1) ensures the held-out panel actually has a valid label.

  **Distinctions Dropped & Costs:**
  1.  **Formal Logic:** We dropped the requirement to formally prove uniqueness. *Cost:* We rely on the annotator's ability to imagine *two* competitors. If they lack imagination, a leaky task passes Q2.1.
  2.  **"Natural Kind" Judgment:** We dropped the question "Is this rule natural?" *Cost:* We might accept "gerrymandered" rules (e.g., "Has 3 or 7 vertices") if they pass the Minimal Pair test. This is acceptable; the goal is consistency, not beauty.
  3.  **Exhaustive Search:** We do not check *all* competitors, only two. *Cost:* A third, unthought-of competitor might still exist. *Mitigation:* The 20-minute limit makes exhaustivity impossible; two is the heuristic sweet spot.

  **Judgment Calls Dressed as Procedure:**
  1.  **Q2.1 (Plausibility):** What counts as a "plausible" competitor? An annotator might invent a contrived rule just to pass the step. *Risk:* High. *Mitigation:* You (Owner) review the competitors during sign-off.
  2.  **Q3.1 (Domain Constraint):** Deciding whether a "Gap" is acceptable depends on whether you control the test distribution. The procedure flags it, but you decide if the risk is manageable.

  **Where the Procedure Will Misfire:**
  1.  **High-Complexity Rules:** If the rule is "Contains a shape that is its own bounding box," an annotator might struggle to sketch a minimal pair in 5 minutes. This may lead to false `REJECT`s on clever tasks.
  2.  **The "Triangle" Problem:** As seen below, semantic categories often fail the logical complement check. The procedure will flag valid human-intuitive tasks as logically leaky.

  ---

  ### Application to Your Three Tasks

  #### Task 1: Rotation (A) vs. No Rotation (B)
  *Correlate:* Component Count (Even vs. Odd).
  *   **Phase 1 (Correlate):** **FAIL.** The component count perfectly predicts the class in the current set.
  *   **Phase 2 (Alternatives):**
      *   Competitor: "Even number of components."
      *   Minimal Pair: A rotationally symmetric shape with 3 components (e.g., three dots in a triangle formation). This fits Rule A (Rotation) but breaks Competitor (Odd count).
  *   **Phase 3 (Coverage):** Pass. (Rotation vs. Not Rotation is binary).
  *   **Verdict:** **ACCEPT-WITH-EDIT.**
  *   **Instruction to Author:** "You must swap one panel. Insert a rotationally symmetric figure with an odd number of components into Class A. Insert a non-symmetric figure with an even number of components into Class B. This breaks the component-count correlate."

  #### Task 2: Prime Components (A) vs. Composite Components (B)
  *   **Phase 1 (Correlate):** Pass (assuming sizes vary).
  *   **Phase 2 (Alternatives):**
      *   Competitor: "Small number (<=7) vs. Large number (>=4)." (Overlap exists, but annotator might find "Parity" as a competitor).
      *   Minimal Pair: A panel with 1 component. 1 is neither Prime nor Composite.
  *   **Phase 3 (Coverage):** **FAIL.** The Gap Test. What happens if the held-out panel has 1 component? Or 0? The rule leaves a gap in the number line.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** Mathematical properties of counts are fragile in visual tasks. The "Gap" at 1 makes the classification undefined for a valid visual input. Unless the instructions explicitly state "All panels contain between 2 and 13 components," this is unsafe.
  *   **Fix:** Change rule to "Odd count" vs "Even count" (covers all integers) OR add domain constraint instructions.

  #### Task 3: Triangle (A) vs. Circle (B)
  *   **Phase 1 (Correlate):** **FAIL.** Vertices (3 vs 0) and Curvature (Straight vs. Curved) are cheaper correlates than semantic shape names.
  *   **Phase 2 (Alternatives):**
      *   Competitor: "Has straight edges" vs "Has curved edges."
      *   Minimal Pair: A Square. It has straight edges (like Triangle) but is not a Triangle. If the model learns "Triangle," it should reject a Square. If it learns "Straight Edges," it accepts a Square.
  *   **Phase 3 (Coverage):** **FAIL.** The Gap Test. A Square fits neither "Is Triangle" nor "Is Circle."
  *   **Verdict:** **REJECT (Logic)** / **ESCALATE (Business)**.
  *   **Analysis:**
      *   **Logic:** The procedure *must* reject this. "Triangle" and "Circle" are not logical complements. If your held-out panel is a square, the task is broken. Furthermore, "Triangle" is extensionally equivalent to "3 straight edges" in your current SVG set. The model cannot distinguish the *concept* of triangularity from the *feature* of vertex count without a counter-example (e.g., a 3-vertex shape that isn't a triangle, which is impossible in Euclidean geometry, or a triangle with curved sides).
      *   **Business Reality:** You said these are your most reliable items. This implies your test distribution *never* includes squares.
      *   **Required Edit to Save Them:** You cannot keep the rule "Triangle vs. Circle." You must restate the rule to match the features the model actually sees.
          *   *Option A (Reframe):* Class A = "3 Straight Edges." Class B = "1 Curved Edge." (This is logically robust).
          *   *Option B (Constraint):* Keep "Triangle vs. Circle" but add a system-level instruction: "All test panels will contain either a triangle or a circle."
      *   **Do you have to pull the five shipped ones?**
          *   If your evaluation harness *guarantees* only triangles and circles appear in test: **No.** But you must document the domain constraint.
          *   If your evaluation harness allows arbitrary SVGs: **Yes.** They are logically unsound. A model trained on "Triangle vs Circle" will fail on a Square, and you cannot claim it failed "reasoning" when the rule was undefined.
      *   **Recommendation:** Do not pull them yet. **Edit the Task Definition.** Change the ground truth label from "Triangle/Circle" to "3 Straight Edges / 1 Closed Curve." This preserves the visual data but fixes the logical leak. If a square appears later, it correctly classifies as "Not Class B" (or you define a Class C). Better yet, update the instructions to explicitly state the closed world assumption.

  ### Summary of Action Items
  1.  **Task 1:** Request edit to break component-count correlation.
  2.  **Task 2:** Reject unless domain constraints (2-13 components) are added and documented.
  3.  **Task 3:** Do not pull, but **relabel**. The rule is not "Triangle," it is "3 Vertices." If you keep "Triangle," you are relying on a hidden domain constraint. Make that constraint explicit in the task metadata. If you cannot guarantee no squares will ever be tested, the task is invalid.
