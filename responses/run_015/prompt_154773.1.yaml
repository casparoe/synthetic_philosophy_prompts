answer: |-
  Here is a draft order for the episode. I've arranged these to start with the definition of the view (setting the terrain), move through the internal coherence of the norms, and end with the external consequences (hardware, disagreement, science).

  If you run long, **drop Question 8 (Cognitive Science)**. It's a fascinating application, but the normative work is done by Questions 1–7. The episode ends strongly on Question 9 (Falsification) without it.

  ### **Segment 1: Defining the Terrain (Questions 1–2)**

  **Q1: The Reference Class for "Feasible"**
  You insist feasibility is a hard fact about flops, not a matter of taste. But "feasible" is always relative to a distribution of problems. Are we talking worst-case asymptotics, average-case over all possible worlds, or average-case over the problems *you* actually face? If it's the latter, doesn't the objectivity you want leak away? If the "best procedure" is only best relative to the environment I happen to inhabit, haven't we quietly turned an epistemic norm into a pragmatic one?

  *   **Likely Reply:** She will likely bite the bullet on the environment. She'll say the norm is relative to the agent's *actual* operating conditions, but that those conditions are still objective facts, not opinions.
  *   **Follow-up:** If the norm is relative to my actual operating conditions, then a spy in a hostile environment and a professor in a library face different epistemic norms given the same hardware. Does this mean there is no shared standard of rationality between agents in different contexts? If so, what happens to the idea of a "community of inquiry"?

  **Q2: The Arithmetic Disanalogy**
  The standard objection is that intractability is about *access*, not *correctness*. Someone who can't do long division is still wrong about the product. You say the credal case is different. Why? Is it because probability axioms constrain *states* while arithmetic constrains *truths*, or is there a deeper disanalogy? If I can't compute the coherent credence, in what sense is the incoherent one a "mistake" rather than just a limitation?

  *   **Likely Reply:** She'll argue arithmetic has a determinate answer independent of the agent, whereas credences are functional roles constrained by what the agent can actually sustain.
  *   **Follow-up:** But if the "ideal" credence is defined as "what the best feasible procedure would output," then the ideal is *defined* by the limitation. Doesn't that make the phrase "coming close to the Bayesian ideal" empty? If the ideal just *is* the feasible output, there's no gap to close.

  ### **Segment 2: The Mechanics of the Norm (Questions 3–5)**

  **Q3: Approximation and Vindication**
  Let's grant that we're aiming for approximate coherence. Who sets the tolerance parameter? And more importantly, do the standard vindication arguments survive? A Dutch Book guarantees a loss for an incoherent agent. Does it also guarantee a loss for a *nearly* coherent agent, and if so, isn't the resource-saving wiped out by the guaranteed loss?

  *   **Likely Reply:** She'll likely say the accuracy framework can be redone with bounds (e.g., "no Dutch Book within tolerance $\epsilon$") rather than exact dominance.
  *   **Follow-up:** If we move to bounds, doesn't the justification for *why* we care about coherence shift? Standard Bayesianism says coherence is constitutive of rationality. Your view seems to say coherence is instrumentally valuable up to a cost threshold. Have you changed the *kind* of norm from constitutive to instrumental without admitting it?

  **Q4: Justified or Excused?**
  Following on that: when an agent fails your resource-relative norm, are they *irrational* (violating a norm) or merely *limited* (excused from a norm they couldn't meet)? If I fail to conditionalize because I ran out of RAM, did I do something wrong, or did I just hit a wall?

  *   **Likely Reply:** She will want to say they are irrational because they didn't run the *best* feasible procedure, even if that procedure wasn't perfect.
  *   **Follow-up:** But if the "best feasible procedure" still outputs incoherent credences, and you say those credences are permitted, then incoherence is permitted. So when I point out your incoherence, you can say "I know, it's permitted." Does this drain the critical force of calling someone irrational?

  **Q5: The Regress of Resource Allocation**
  Deciding how much computation to spend on a belief is itself a computation. If I have to calculate the optimal allocation of my flops, I need flops to do that calculation. Doesn't "do the best you feasibly can" require a meta-computation that is itself intractable? How do you stop the regress without just saying "do whatever your architecture happens to do"?

  *   **Likely Reply:** She'll likely appeal to Bounded Optimality: the norm applies to the *program* selected at design time (or evolutionary time), not the runtime decision.
  *   **Follow-up:** If the norm applies to the program selected at design time, and I am stuck with the architecture I have, then whatever my architecture produces *was* the feasible output of that architecture. Doesn't this collapse your view into descriptivism? If my architecture produces a bias, and that architecture was the best feasible one at $t_0$, isn't the bias rational at $t_1$?

  ### **Segment 3: Consequences and Edge Cases (Questions 6–9)**

  **Q6: Evidence About Heuristics**
  Suppose I know my fast-and-frugal heuristic is reliable in this specific environment. Am I required to treat "my procedure output $p$" as evidence and conditionalize on *that*? If yes, doesn't the full Bayesian machinery come back in through the back door as a norm on how to respond to the evidence of my own output?

  *   **Likely Reply:** She'll say you should treat it as evidence, but you only need to do so approximately, within your budget.
  *   **Follow-up:** But updating on "my heuristic says $p$" is often *harder* than just running the heuristic. If the second-order update is too costly, am I permitted to ignore the reliability data I have? That sounds like I'm permitted to ignore evidence about my own reliability.

  **Q7: Hardware Discontinuity**
  On your view, if I buy a slower machine, the standard I'm held to gets looser. If I buy a faster one, I might become irrational without my credences changing at all, simply because a better procedure became feasible. Is this a reductio, or do you bite it?

  *   **Likely Reply:** She will almost certainly bite it. She'll say rationality *is* relative to capacity, just as physical fitness is relative to physiology.
  *   **Follow-up:** If you bite it, consider two agents with the same evidence but different budgets. They end up with different credences, and both are rational. If they meet to compare notes, what should they do? Is there any pressure for them to converge, or does your view license permanent rational disagreement based on hardware specs?

  **Q8: Cognitive Science and Triviality**
  *(Drop this one if running long)*
  If the "Bayesian Brain" hypothesis is right, and perception is near-exact inference over rich generative models, does your claim that the ideal is unachievable lose its bite? If our cognitive machinery is already doing something very close to the ideal, does your view just collapse back into standard Bayesianism for all practical purposes?

  *   **Likely Reply:** She'll say brains doing something Bayesian-ish isn't the same as satisfying the normative constraints, and there are still plenty of high-level cognitive tasks where we fall short.
  *   **Follow-up:** But if the gap between "feasible" and "ideal" shrinks as our understanding of cognition improves, does your view become less interesting the better our science gets? Is this a theory designed to be falsified by cognitive progress?

  **Q9: Falsification**
  Finally, what would count against this view? If we found a class of problems where agents *could* compute the exact Bayesian update with room to spare, but *didn't*, would that falsify resource-relative Bayesianism, or would you just say they failed the feasibility norm? I'm trying to find the empirical or formal line where you'd say, "Okay, the resource story doesn't work here."

  *   **Likely Reply:** She'll likely say the view is a conceptual claim about norms, not an empirical claim about performance.
  *   **Follow-up:** If it's purely conceptual, and "feasible" is defined by "what the agent could do," how do we distinguish between "couldn't do" and "didn't do"? If the only test for feasibility is whether they did it, aren't we back to subjectivism?

  ***

  ### **Notes on Pressure Points**

  You asked me to flag where you might have the pressure point wrong. I see two potential vulnerabilities in your attack plan:

  1.  **The Arithmetic Disanalogy (Q2):** You assume the guest will struggle to distinguish probability from arithmetic. However, a sophisticated defender (like a functionalist) will argue that probability norms are *constitutive* of belief states in a way arithmetic truths are not. If she argues that "believing" just *is* playing a certain functional role, and that role is constrained by capacity, the arithmetic analogy fails because arithmetic isn't constitutive of having a mind. **Watch out:** If she goes hard on functionalism, Q2 might bounce off. Be ready to pivot to Q3 (Vindication) faster if she does.
  2.  **Cognitive Science (Q8):** You frame this as "if brains are good, the view loses bite." I suspect she might frame this as a *feature*. If brains are naturally resource-relative Bayesians, her view is *validated* by cognitive science, not trivialized. **Adjustment:** Don't let her spin this as a victory for her view too easily. Press on whether a view that converges with standard Bayesianism as hardware improves is actually doing any distinct normative work.

  ### **Timing Guide**
  *   **00:00 – 05:00:** Intro & Q1 (Feasibility Def)
  *   **05:00 – 15:00:** Q2 & Q3 (Arithmetic & Approximation)
  *   **15:00 – 25:00:** Q4 & Q5 (Justification & Regress)
  *   **25:00 – 35:00:** Q6 & Q7 (Heuristics & Hardware)
  *   **35:00 – 40:00:** Q8 (Cog Sci) *[Skip if behind]*
  *   **40:00 – 45:00:** Q9 (Falsification) & Outro
