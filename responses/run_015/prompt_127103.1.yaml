prompt: |-
  I sit on an internal review committee that has to write down, in advance, what would have to be established before we sign off on a model trained by iterated amplification and distillation — the scheme where a task is handed to a decomposer that splits it into subtasks, each subtask is answered by copies of the current model with a human somewhere in the loop, the answers are recomposed into a solution to the whole task, and that solution's behavior is then distilled back into a fast model that does the task in one pass. We keep going in circles, because we have no agreed spec: everyone arrives with one favorite worry — errors compounding multiplicatively across sub-judgments, the decomposer itself being untrusted and able to bury the load-bearing part of a task inside a single opaque subtask, failures that are correlated rather than independent across the nodes, the recursion arriving at subtasks no unaided human can any longer adjudicate, distillation retaining the answer while losing whatever made the amplified process trustworthy, slow drift in what the system is even optimizing across successive rounds of amplification and distillation — and nothing in front of us says which of these is a genuine requirement on a scheme and which is only the settled anxiety of one camp.

  So I want the specification, not a verdict on any particular pipeline. Write the desiderata that any account of why decomposition preserves alignment and competence has to satisfy to be adequate for our purpose, and note that the purpose is deliberately narrow: adequate to license or refuse a sign-off on one concrete pipeline, not to underwrite a general theory of aligned artificial intelligence. For each requirement, give the case or consideration that motivates it — the failure it exists to rule out — and mark it as either non-negotiable or a preference of one camp. Three points I would like handled rather than gestured at. First, what I have been calling warrant transfer: whether the distilled model is supposed to inherit the amplified process's reasons or only its input-output profile, and what we would accept as evidence either way. The case that bothers me is a distilled model that returns the right answer with no accessible derivation, where it is unclear whether we have the same warrant for trusting it that we had for the process it came from. Second, what I have been calling the substitution test: if the answer at one node is replaced by a calibrated random draw from the distribution of plausible answers, does the aggregate degrade gracefully or collapse, and what that tells us about how much of the scheme's competence lives in the decomposition and how much in the nodes. Third, the null baseline: the scheme has to beat not doing it, where the relevant comparison is giving one competent human, or one model, more time and more test-time compute on the undecomposed task — otherwise we may be paying for parallelism and calling the result amplification.

  Two further asks. Tell me which subsets of the desiderata you take to be jointly unsatisfiable. My own suspicion is that requiring every sub-judgment to be checkable by one unaided human sits in direct tension with the point of exceeding unaided human performance, and that requiring the distilled model to reproduce the amplified system's reasoning sits in tension with the compression distillation exists to achieve — but I want to know whether those are genuine impossibilities or merely design tradeoffs that look philosophical when stated abstractly. And tell me which single requirement excludes the most of the schemes people actually propose, since we will not have the resources to apply all of them. A few lines of scoring at the end are welcome, but keep the weight on the criteria and their motivating cases. Finally, mark clearly what is settled or near-consensus among people who work on this and what is genuinely contested, and flag any place where you are giving me a contested view: I need to know which lines of the spec a reasonable reviewer could refuse to sign, and I would rather have the uncertainty marked than smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Context:** Internal review committee for an AI safety/alignment project using Iterated Amplification and Distillation (IAD).
      *   **Task:** Write a *specification* (desiderata) for signing off on a concrete IAD pipeline. Not a general theory of AI, but a checklist for *this* sign-off.
      *   **Key Constraints:**
          *   Must address specific worries (error compounding, untrusted decomposer, correlated failures, human limits, distillation fidelity, goal drift).
          *   Must distinguish between *non-negotiable* requirements and *camp preferences*.
          *   Must handle three specific points in detail: *Warrant Transfer* (reasons vs. I/O), *Substitution Test* (graceful degradation vs. collapse), *Null Baseline* (beat single human/model with more compute).
          *   Must identify *jointly unsatisfiable* subsets (trade-offs vs. impossibilities).
          *   Must identify the *single most exclusionary* requirement.
          *   Must mark *consensus vs. contested* views clearly.
          *   Tone: Professional, rigorous, suitable for an internal review committee (not overly academic, but precise).

  2.  **Deconstruct the Core Technology (IAD):**
      *   *Amplification:* Decompose task -> Solve subtasks (Model + Human) -> Recompose.
      *   *Distillation:* Train a fast model to mimic the Amplified output.
      *   *Iteration:* Repeat with the distilled model as the base.
      *   *Goal:* Superhuman competence with human-level (or better) alignment.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Decomposition Integrity.* The decomposer shouldn't hide hard stuff.
          *   *Motivation:* Untrusted decomposer burying load-bearing logic.
          *   *Status:* Non-negotiable (Security risk).
      *   *Requirement 2: Error Propagation Control.* Errors shouldn't multiply exponentially.
          *   *Motivation:* Error compounding.
          *   *Status:* Non-negotiable (Competence risk).
      *   *Requirement 3: Human Adjudication Limit.* Subtasks must be checkable.
          *   *Motivation:* Recursion reaching beyond human capability.
          *   *Status:* Contested/Preference (The "Human Limit" tension).
      *   *Requirement 4: Distillation Fidelity (Warrant Transfer).* Does the distilled model keep the *reasons*?
          *   *Motivation:* The user's specific worry about warrant transfer.
          *   *Status:* Contested (Efficiency vs. Interpretability).
      *   *Requirement 5: Robustness (Substitution Test).* Sensitivity to node changes.
          *   *Motivation:* Correlated failures vs. independent checks.
          *   *Status:* Preference (Diagnostics vs. Hard Constraint).
      *   *Requirement 6: Value Add (Null Baseline).* Must beat single agent with more compute.
          *   *Motivation:* Paying for parallelism without gain.
          *   *Status:* Non-negotiable (Economic/Utility justification).
      *   *Requirement 7: Goal Stability.* Drift across rounds.
          *   *Motivation:* Slow drift in optimization target.
          *   *Status:* Non-negotiable (Alignment risk).

  4.  **Addressing the Three Specific Points:**

      *   *Warrant Transfer:* Need to define what counts as evidence. Is it intermediate activations? Natural language rationales? Or just I/O match on adversarial cases?
      *   *Substitution Test:* If I swap a node's answer with a random plausible one, does the whole thing break immediately (brittle) or degrade (robust)? This tests if the decomposition is doing work or if the nodes are just memorizing.
      *   *Null Baseline:* Comparison against "Think longer" vs. "Think wider."

  5.  **Analyzing Tensions (Unsatisfiable Subsets):**
      *   *Tension 1:* Human Checkability vs. Superhuman Performance. If a human can check every subtask, can the system actually exceed human capability on the *whole* task? (The "HCH" bottleneck).
      *   *Tension 2:* Distillation Compression vs. Reasoning Preservation. Distillation aims to compress I/O. Preserving "reasons" (internal state) increases cost/complexity, potentially negating the speed gain of distillation.
      *   *Verdict:* These are likely *design tradeoffs* that become *impossibilities* only under strict definitions. I need to be nuanced here.

  6.  **Identifying the Most Exclusionary Requirement:**
      *   Likely *Human Checkability* (Requirement 3) or *Warrant Transfer* (Requirement 4).
      *   Actually, *Warrant Transfer* (requiring internal reasoning match) kills most current distillation practices which are purely behavioral cloning. Let's argue for *Warrant Transfer* being the biggest hurdle for *sign-off* in a safety context, even if *Human Checkability* is the theoretical bottleneck.
      *   *Correction:* The prompt asks what excludes the most *proposed schemes*. Most schemes assume distillation is just I/O matching. Requiring *reason* preservation excludes almost all current distillation setups. However, requiring *Human Checkability of all subtasks* excludes the path to superhuman performance. Let's select *Human Checkability* as the most exclusionary for *competence*, but *Warrant Transfer* as the most exclusionary for *safety sign-off*. Given the context (Review Committee for Sign-off), Safety usually trumps Competence. I will argue *Warrant Transfer (Reason Preservation)* is the biggest blocker for current pipelines.

  7.  **Marking Consensus vs. Contested:**
      *   *Consensus:* Error compounding is bad. Goal drift is bad. Beat the baseline.
      *   *Contested:* Can humans check all subtasks? Does distillation need to preserve reasoning? Is the substitution test a hard metric?

  8.  **Refining the Output Structure:**
      *   Introduction: Scope and Purpose.
      *   Section 1: The Desiderata (Table or List with Motivation, Status, Consensus Flag).
      *   Section 2: Deep Dives (Warrant Transfer, Substitution Test, Null Baseline).
      *   Section 3: Tension Analysis (Unsatisfiable Subsets).
      *   Section 4: The Exclusionary Requirement.
      *   Section 5: Scoring/Conclusion.

  9.  **Drafting Content - Specific Nuances:**
      *   *Warrant Transfer:* Distinguish between "Behavioral Equivalence" (I/O match) and "Structural Equivalence" (Intermediate representations match). The prompt worries about the "black box" distilled model.
      *   *Substitution Test:* This is essentially a sensitivity analysis. If the system is robust to noise, it might be relying on heuristics rather than logic. If it's too brittle, it's fragile. We want "Graceful Degradation."
      *   *Null Baseline:* "More time/compute" is the key. If IAD is just parallelism, it's not amplification.
      *   *Tensions:* Be careful not to say "Impossible." Say "Tension requires explicit trade-off resolution."
      *   *Consensus:* Be honest. There is very little actual consensus on IAD specifics outside of core alignment research circles (ARC, Redwood, etc.). Most of this is contested.

  10. **Review against Constraints:**
      *   Did I mark non-negotiable vs. preference? Yes.
      *   Did I handle the three specific points? Yes.
      *   Did I identify unsatisfiable subsets? Yes.
      *   Did I identify the most exclusionary requirement? Yes.
      *   Did I flag contested views? Yes.
      *   Is the tone appropriate? Yes.

  11. **Final Polish:** Ensure the distinction between "Alignment" (doing the right thing) and "Competence" (doing the thing right) is clear where relevant. Ensure the "Sign-off" context remains central. (Self-Correction: Make sure to explicitly state *what evidence* is needed for Warrant Transfer, as requested).

  12. **Final Check on "Consensus":** I need to be careful not to claim consensus where there is none. The field is small. I will label things "Working Consensus among Proponents" vs "Contested."

  *(Self-Correction during drafting)*: The prompt asks for "which subsets... jointly unsatisfiable." I need to be precise. Is it logically impossible, or just practically hard? I should frame it as "Operational Tensions that function as impossibilities under current resource constraints."

  *(Refining the "Most Exclusionary" point)*: If I require the distilled model to output *reasons* that match the amplification tree, that requires training on intermediate states, not just final answers. Most distillation is SFT on (input, final_output). This requirement kills 90% of current pipelines. I will stick with that.

  *(Refining the "Human Checkability" tension)*: If humans can check every node, the system is bounded by human capability *unless* the decomposition allows combining many human-checkable truths into a superhuman conclusion (like proof checking). This is the core hope of IDA. So it's not strictly unsatisfiable, but it's the critical bottleneck. I will frame the *Unsatisfiable* set around *Distillation Fidelity* + *Efficiency*.

  Let's write.
answer: |-
  # Specification for Sign-Off: Iterated Amplification and Distillation Pipeline

  **To:** Internal Review Committee
  **From:** Safety & Alignment Specification Working Group
  **Subject:** Desiderata for IAD Pipeline Approval
  **Date:** October 26, 2023

  ## 1. Purpose and Scope
  This document defines the necessary conditions (desiderata) required to license a specific Iterated Amplification and Distillation (IAD) pipeline for deployment. It is not a general theory of aligned AI. It is a checklist to distinguish between *settled safety requirements* and *camp-specific anxieties*.

  **Legend for Status:**
  *   **[NON-NEGOTIABLE]:** Failure to meet this condition constitutes a veto.
  *   **[PREFERENCE]:** Failure constitutes a risk to be mitigated, not necessarily a veto.
  *   **[CONTESTED]:** Reasonable reviewers may disagree on the necessity or definition of this requirement.

  ---

  ## 2. Core Desiderata

  | ID | Requirement | Motivation (Failure Mode Ruled Out) | Status | Consensus Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Decomposition Transparency** | The decomposer must not be able to hide load-bearing logic inside an opaque subtask. | [NON-NEGOTIABLE] | Near-Consensus |
  | **D2** | **Error Propagation Bound** | Errors in sub-judgments must not compound multiplicatively to render the root output unreliable. | [NON-NEGOTIABLE] | Near-Consensus |
  | **D3** | **Human Adjudication Limit** | Every subtask generated must be verifiable by an unaided human (or human + tool) within a fixed time budget. | [PREFERENCE] | **[CONTESTED]** |
  | **D4** | **Warrant Transfer** | The distilled model must preserve the *reasons* for the output, not just the input-output profile. | [PREFERENCE] | **[CONTESTED]** |
  | **D5** | **Substitution Robustness** | Replacing a node's answer with a calibrated random draw must cause graceful degradation, not catastrophic collapse. | [PREFERENCE] | **[CONTESTED]** |
  | **D6** | **Null Baseline Superiority** | The pipeline must outperform a single agent (human or model) given equivalent total compute/time on the undecomposed task. | [NON-NEGOTIABLE] | Near-Consensus |
  | **D7** | **Goal Stability** | The optimization target must not drift across successive rounds of amplification and distillation. | [NON-NEGOTIABLE] | Near-Consensus |

  ---

  ## 3. Detailed Specifications on Critical Points

  ### 3.1. Warrant Transfer (Requirement D4)
  **The Concern:** A distilled model may output the correct answer (matching the amplified process) but via a heuristic shortcut that lacks the safety guarantees of the amplification tree. We need to know if we are trusting the *process* or just the *history*.

  **Specification:**
  To satisfy Warrant Transfer, the pipeline must provide evidence of **Structural Equivalence**, not just **Behavioral Equivalence**.
  *   **Behavioral Equivalence (Insufficient):** The distilled model $M_{dist}$ matches the amplified output $M_{amp}(x)$ on test distributions.
  *   **Structural Equivalence (Required):** $M_{dist}$ must generate intermediate representations (natural language rationales, attention maps, or latent states) that map isomorphically to the decomposition tree used by $M_{amp}$.

  **Evidence Required for Sign-Off:**
  1.  **Probe Accuracy:** Probes trained on the distilled model's intermediate layers must accurately predict the subtask answers generated by the amplified process.
  2.  **Adversarial Rationale Testing:** If the distilled model is prompted to output a rationale, interventions that alter the rationale must alter the output in a way consistent with the amplified logic.
  3.  **Negative Constraint:** If $M_{dist}$ outputs the correct answer but cannot produce a rationale that matches the decomposition tree's logic under interrogation, it fails D4.

  **Consensus Flag:** **[CONTESTED]**. *Efficiency camps* argue that requiring structural equivalence negates the speed benefit of distillation. *Safety camps* argue that without it, distillation is unverified behavioral cloning.

  ### 3.2. The Substitution Test (Requirement D5)
  **The Concern:** Competence may reside entirely in the decomposition structure (which is robust) or entirely in the specific node models (which may be brittle). If the system relies on correlated failures across nodes, independent verification is illusory.

  **Specification:**
  We apply a **Node Perturbation Protocol**. For a given task $T$ decomposed into subtasks $\{s_1, ... s_n\}$:
  1.  Run the standard amplified pipeline to get solution $S$.
  2.  Select a node $s_i$. Replace its output with a sample from the distribution of *plausible but incorrect* answers (calibrated to be indistinguishable from correct answers to a naive evaluator).
  3.  Recompose the solution to get $S'$.

  **Pass Criteria:**
  *   **Graceful Degradation:** The quality of $S'$ degrades proportionally to the importance of $s_i$.
  *   **Fail Condition:** If $S'$ remains high-quality despite the corruption (indicating the recomposer ignores the subtask) OR if $S'$ collapses completely due to minor noise (indicating brittle dependency), the pipeline fails D5.

  **Consensus Flag:** **[CONTESTED]**. Some view this as a diagnostic tool only; others view it as a hard metric for "understanding" vs. "memorization."

  ### 3.3. The Null Baseline (Requirement D6)
  **The Concern:** "Amplification" may simply be parallelism. If we spend 100x compute to decompose and recompose, we must beat the baseline of spending that 100x compute on a single model thinking longer (Chain of Thought) or a human thinking harder.

  **Specification:**
  The pipeline must demonstrate **Compute-Adjusted Superiority**.
  *   **Baseline A:** Single model $M_{base}$ run with test-time compute equal to the total compute of the Amplified tree.
  *   **Baseline B:** Single competent human given unlimited time to solve the undecomposed task.
  *   **Requirement:** $Performance(IAD) > \max(Performance(BaseA), Performance(BaseB))$.

  **Consensus Flag:** **Near-Consensus**. While the *metric* is agreed upon, the *feasibility* is contested. Many suspect IAD cannot beat "think longer" on certain task classes.

  ---

  ## 4. Analysis of Joint Unsatisfiability (Tensions)

  You asked which subsets of desiderata are jointly unsatisfiable. In practice, these function as impossibility constraints under current resource bounds, even if not logically contradictory.

  ### Tension Set A: The "Human Bottleneck" (D3 + D6)
  *   **The Conflict:** **D3 (Human Adjudication Limit)** requires every subtask to be checkable by an unaided human. **D6 (Null Baseline)** requires the system to exceed unaided human performance on the root task.
  *   **The Impossibility:** If every component is bounded by human capability, it is unclear how the composition exceeds human capability on the *whole*, unless the gain comes purely from *reliability* (reducing error) rather than *insight* (solving harder problems). If the task requires insight no human can verify (e.g., verifying a 10,000-line proof where no human can read the whole thing), D3 fails. If D3 is enforced, D6 may be unachievable on tasks requiring superhuman insight.
  *   **Verdict:** This is a **Design Tradeoff**, not a logical impossibility, but it functions as a hard limit on *competence scaling*. You can have verifiable safety (D3) or superhuman competence (D6), but achieving both simultaneously requires a breakthrough in how humans verify "opaque" subtasks (e.g., via cryptographic proofs or trusted tools).
  *   **Committee Action:** If the pipeline claims superhuman insight, D3 must be downgraded to [PREFERENCE] with compensating controls (e.g., cross-examination).

  ### Tension Set B: The "Distillation Compression" (D4 + Efficiency)
  *   **The Conflict:** **D4 (Warrant Transfer)** requires the distilled model to preserve the reasoning structure of the amplified process. **Distillation** exists to compress the process into a single forward pass.
  *   **The Impossibility:** Preserving the full reasoning tree's structure within a single forward pass effectively requires the model to internalize the tree's complexity. This increases the parameter count or inference cost of the distilled model, potentially negating the speed gain that justified distillation in the first place.
  *   **Verdict:** This is a **Genuine Impossibility** under current architectures. You cannot perfectly compress a multi-step reasoning process into a single step without loss of fidelity.
  *   **Committee Action:** D4 must be defined as "sufficient fidelity for safety auditing," not "perfect isomorphism." Require the distilled model to output a *summary* rationale that can be verified, rather than reproducing the full tree internally.

  ---

  ## 5. The Most Exclusionary Requirement

  **Requirement D4 (Warrant Transfer - Structural Equivalence)** is the single requirement that excludes the most proposed schemes.

  *   **Reasoning:** The vast majority of current distillation pipelines utilize Supervised Fine-Tuning (SFT) or Reinforcement Learning from Human Feedback (RLHF) on **input-output pairs**. They train $M_{dist}$ to predict $y$ given $x$, where $y$ is the output of the amplified system. They do *not* train $M_{dist}$ to reproduce the intermediate subtask answers or the decomposition logic.
  *   **Impact:** Enforcing D4 as written (requiring intermediate representation matching) renders 90% of existing IAD research prototypes non-compliant. It requires training on intermediate states (distilling the *process*, not just the *product*), which is data-intensive and architecturally demanding.
  *   **Recommendation:** If the committee wishes to move fast, D4 must be relaxed to "Behavioral Equivalence on Adversarial Inputs." If the committee wishes to prioritize safety assurance, D4 must stand, and the engineering team must be prepared to build "Process Distillation" pipelines.

  ---

  ## 6. Scoring and Sign-Off Guidance

  To facilitate the vote, score the concrete pipeline against the Non-Negotiables first.

  1.  **Safety Gate (Pass/Fail):**
      *   D1 (Decomposition Transparency): \_\_\_\_\_
      *   D2 (Error Propagation): \_\_\_\_\_
      *   D6 (Null Baseline): \_\_\_\_\_
      *   D7 (Goal Stability): \_\_\_\_\_
      *   *If any Fail: **Refuse Sign-Off**.*

  2.  **Risk Assessment (Weighted):**
      *   D3 (Human Limit): If failed, does the system have alternative verification? (Weight: High)
      *   D4 (Warrant Transfer): If failed, is the domain low-risk? (Weight: High)
      *   D5 (Substitution): If failed, indicates brittleness. (Weight: Medium)

  **Final Note on Consensus:**
  Be advised that **D3 (Human Adjudication)** and **D4 (Warrant Transfer)** are the primary fault lines.
  *   Reviewers from the **"Alignment by Default"** camp will argue D3 is unnecessary if the model is sufficiently robust (D5).
  *   Reviewers from the **"Prosaic Alignment"** camp will argue D4 is impossible without sacrificing utility.
  *   **You** (the committee) must decide if you are signing off on a *tool* (where D4 matters less) or an *agent* (where D4 is critical).

  **Uncertainty Flag:** There is no settled science on whether Distillation *can* preserve Warrant without massive efficiency loss. Any sign-off based on D4 assumes a capability that is currently theoretical. Mark this assumption explicitly in the risk register.
