prompt: |-
  hey im in an ethics seminar this semester — about 12 students, 75 minute sessions — and for my facilitation assignment i need to design an in-class activity about glaucons ring of gyges and the "why be moral if nobody sees you" problem. the usual debate is dead to me; everyone just says conscience saves them and we move on.

  i want the class to actually feel the visibility condition collapse, not just discuss it. my twist: inject the idea of an internal "moral ledger" — people track thier own debts and credits like an accountant, so invisibility doesnt erase morality, it just makes the bookkeeping private and exhausting. over rounds it should get harder to keep the books balanced when no one else is auditing.

  design a runnable game or roleplay with real small stakes (maybe candy chips or 1% extra credit tokens?). groups should make anonymous choices about distributing or taking resources while metaphorically "wearing the ring." the rules and payoff structure should push them into the problem before anyone names glaucon.

  please include:
  - exact setup, materials, group split, and timeline for 75 mins
  - payoff/rules scheme that creates hidden cost / fatigue
  - debrief mapping each round onto the ring challenge and the ledger-bookkeeping twist
  - an honest note on which feature of glaucons argument this cant reproduce
  - what will predictably go wrong the first run and how to fix it

  dont give me a bibliography or citation list — i cant search right now and it wouldnt help anyway. just the design. also im writing this in a rush so pardon any typos.
