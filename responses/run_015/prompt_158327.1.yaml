      *   **Core Schopenhauerian Claim:** Music is unique because it bypasses Platonic Ideas (the objectification of Will) and expresses the Will *directly*. Other arts copy the Ideas; music copies the Will itself.
      *   **User's Hypothesis:** By stripping prose of description/narration (representational apparatus), dialogue becomes like instrumental music (pure structure/affect) and thus expresses the Will directly.
      *   **The Question:** Does this experiment qualify as literature's equivalent to pure music under Schopenhauer's criteria? Or is there a deeper reason (nature of sound, essential conceptuality of language) that keeps literature trapped in representation? Can literature *ever* achieve Schopenhauerian immediacy?

