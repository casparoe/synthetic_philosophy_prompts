      *   *The Counter-Argument:* Does it actually shed concepts? No. Words still mean things. "I love you" or "Get out" are conceptual utterances. Even if the *context* is stripped, the *medium* (language) remains conceptual.
      *   *Sound vs. Meaning:* Music uses sound as sound (timbre, pitch, rhythm). Literature uses sound as a vehicle for semantic meaning. Even in your experiment, the reader decodes meaning, not just acoustic patterns.
