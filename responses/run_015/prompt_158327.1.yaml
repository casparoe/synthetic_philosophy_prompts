      *   *Why Music?* Music doesn't need the world of appearances to make sense. A melody doesn't "look like" a tree or a hero. It mirrors the inner motion of the Will (striving, satisfaction, new striving).
      *   *Why Language/Literature?* Language is inherently conceptual. Words are signs for concepts. Concepts are abstract representations derived from perceptual experience (Ideas/Phenomena). Therefore, language is doubly removed from the Will.
      *   *The Role of Poetry:* Schopenhauer does value poetry (especially tragedy), but he places it at the top of the *representational* arts, not on par with music. It clarifies Ideas (human nature, conflict) but still works through concepts.

  3.  **Evaluate the User's Experiment against Schopenhauer:**
      *   *The Experiment:* Dialogue without tags/description.
