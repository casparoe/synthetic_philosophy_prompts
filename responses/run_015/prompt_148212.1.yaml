      *Re-evaluating Move 5:* Jordan says solidarity implies hyperbolic. Is that true? Usually, psychological connectedness decays quickly then plateaus (hyperbolic). Exponential implies constant percentage loss. Jordan is mathematically correct that "weakening solidarity" usually maps to hyperbolic.

      *Re-evaluating Move 4:* Can solidarity ground constant discounting? Only if solidarity decays exponentially. Is there reason to think that? Not really. So Move 4 is weak.

