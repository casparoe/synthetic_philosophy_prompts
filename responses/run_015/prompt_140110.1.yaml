answer: |-
  1. Split the fourteen participants into three groups: four 'Engines' behind a screen, four 'Worlds' outside it, and six 'Interpreters' watching both. Give Engines a deck of index cards with unique geometric shapes and a rulebook written in purely syntactic terms. Give Worlds a separate deck representing 'states of affairs' and a mechanism to send single-bit feedback using green or red poker chips. Interpreters receive a glossary linking specific card shapes to real-world concepts but are forbidden from speaking to Engines during play. The screen must completely occlude the World from the Engines, ensuring they process only shape and rule, not reference.

  2. Engines earn poker chips for every green token received from the World after playing a sequence of cards, losing chips for red ones. The World issues green chips only when the card sequence matches a hidden pattern based on current environmental conditions known only to them. Interpreters score points by correctly writing down what the card sequence 'means' in natural language before the World reveals the condition. Halfway through, swap the Interpreters' glossary so that the same shapes now map to opposite concepts, while the Engine's syntactic rulebook and the World's feedback logic remain unchanged. No verbal communication is allowed between groups; all interaction flows through card plays and poker chip feedback.

  3. Minutes 0-15: Distribute roles and materials, enforce the screen barrier, and let groups read their private instructions. Minutes 15-45: Run Round 1 where the glossary matches the World's logic, allowing Interpreters to feel successful and Engines to optimize for green chips. Minutes 45-60: Secretly swap the Interpreters' glossary while Engines continue playing the same syntactic game, creating immediate dissonance between meaning and success. Minutes 60-90: Run Round 2 where Engines still win chips but Interpreters now claim the cards mean the opposite of the World state. Minutes 90-120: Remove the screen, mix the groups, and begin the structured debrief without using forbidden terminology.

  4. Start by asking the Engines if the meaning of the triangles mattered for getting chips, then ask the Interpreters if the Engines were 'wrong' after the glossary swap. Point to the moment the glossary changed to highlight that the physical causality remained identical while the attributed aboutness flipped. Introduce the term 'epiphenomenalism' when discussing whether the meaning did any work, and 'original intentionality' when asking where the meaning came from. Guide them to see that the 'pushing' description depends on whether you track physical history or semantic content. Conclude by asking which description is necessary for predicting the next chip color, leaving the question of explanatory work open.

  5. A primary failure mode is information leakage where Engines infer the meaning from feedback patterns and break the syntactic blindfold, ruining the epiphenomenal illusion. Another risk is the World group becoming inconsistent with their feedback, making the Engine's optimization task impossible and shifting focus to noise rather than semantics. You must explicitly state that the activity cannot reproduce the first-person experience of 'aboutness' itself, only the external attribution of it. This missing feature is crucial because the hard problem rests on whether internal feel adds causal power beyond external interpretation. Ensure you emphasize that the simulation lacks the very thing the debate is often about.
