  ### Part 2: The Decision Tree

  **Start:** Assume accidentally true generalizations and laws aren't distinguished just by how many instances they have.

  **Node 1 (Case 8: Twin Worlds)**
  *Consider two worlds with identical histories of events. In World A, the regularities hold because of a deep structure. In World B, they hold by cosmic coincidence.*
  **Q:** Is the sentence "It is a law that P" true in **both** worlds, or only in World A?
  *   **Both:** Go to Node 2 (Humean/Supervenient Branch).
  *   **Only World A:** Go to Node 5 (Non-Humean/Branch).
  *   **Neither:** Go to Node 9 (Nihilist Branch).

  #### **Branch 1: Humean/Supervenient (Node 1 = Both)**

  **Node 2 (Case 4: Language Relativity)**
  *Imagine a generalization that is a simple one-liner in Vocabulary X, but an unreadable mess in equally precise Vocabulary Y.*
  **Q:** Can the set of laws be different depending on which vocabulary we use to describe the world?
  *   **Yes:** **Leaf A: Pragmatic Instrumentalism.** (Laws are tools for us, not world-features).
  *   **No:** Go to Node 3.

  **Node 3 (Case 3: Tied Systems)**
  *Imagine two candidate systems of generalizations that are exactly as simple as each other and exactly as informative, but they disagree about a region nobody has looked at.*
  **Q:** Is there a fact of the matter about which system is the "true" laws, or is it indeterminate?
  *   **Indeterminate:** **Leaf B: Pragmatic Best-System (MRL).** (Laws are the best summary, but "best" can be vague).
  *   **Fact of the Matter:** **Leaf C: Objective Best-System.** (There is a unique best system, even if we can't find it).

  #### **Branch 2: Non-Humean (Node 1 = Only World A)**

  **Node 4 (Case 6: Meta-Laws)**
  *Consider a conservation rule (like energy) that seems to hold across variations where the first-order dynamical laws are different. It constrains which first-order laws are possible.*
  **Q:** Is this conservation rule a "law" in the **same sense** as the first-order dynamical laws?
  *   **Yes:** Go to Node 5.
  *   **No (It's a higher-order constraint):** **Leaf D: Modal Stability View (Lange-flavoured).** (Laws are defined by counterfactual stability, not by governing; meta-laws are distinct).

  **Node 5 (Case 1: One Particle)**
  *Consider a universe containing exactly one particle that exists for a while and decays once, with nothing else ever happening.*
  **Q:** Is there a law governing this decay?
  *   **No (Needs more instances):** Go to Node 6.
  *   **Yes (Can govern single events):** Go to Node 7.

  **Node 6 (Case 5: Uninstantiated Laws)**
  *Consider a candidate law about a kind of particle that never actually gets instantiated in that world—never fires, never manifests.*
  **Q:** Can this still be a law of that world?
  *   **No:** **Leaf E: Contingent Necessitation (Armstrong-flavoured).** (Laws are relations between universals; requires instantiation).
  *   **Yes:** **Leaf F: Dispositional Essentialism.** (Laws flow from essences/powers; powers can exist without manifesting).

  **Node 7 (Case 7: Single Violation)**
  *Imagine a world just like ours but one electron does something forbidden, exactly once, with no hidden cause.*
  **Q:** Was the law **false**, or did the law hold but fail to determine the outcome?
  *   **False (Laws must be exceptionless):** **Leaf G: Primitivism (Maudlin-flavoured).** (Laws are fundamental, brute, and strict).
  *   **Failed to Determine (Laws allow capacities):** Go to Node 8.

  **Node 8 (Case 10: Probabilistic)**
  *Consider a world whose best system is irreducibly probabilistic.*
  **Q:** Is the probability a measure of our ignorance, or a real feature of the capacity?
  *   **Ignorance:** **Leaf H: Deterministic Powers.** (Underlying capacities are deterministic; chance is epistemic).
  *   **Real Feature:** **Leaf I: Anti-Fundamentalist / Capacities (Cartwright-flavoured).** (No strict fundamental laws, just patched capacities/nomological machines).
      *(Note: This leaf also captures views where laws are ceteris paribus and not strictly fundamental).*

  #### **Branch 3: Nihilist (Node 1 = Neither)**

  **Node 9 (Case 9: Impossible Antecedents)**
  *Consider a statement about what a law says regarding an antecedent that's physically impossible in that world (e.g., "If this electron were faster than light...").*
  **Q:** Is this statement true, false, or neither?
  *   **Neither (No truth value):** **Leaf J: Hard Nihilism.** (There are no laws, so law-statements are meaningless).
  *   **True/False (Useful Fiction):** **Leaf K: Fictionalism.** (Law-talk is useful, but not literally true).

  ---

  ### Part 3: Logical Space & Empty Cells

  To run this reading group effectively, you need to show them the map, not just the path. Here is the logical space the tree occupies, defined by three axes: **Supervenience** (Humean vs. Non-Humean), **Modality** (Contingent vs. Necessary/Stable), and **Fundamentality** (Fundamental vs. Derived vs. None).

  **The Occupied Leaves:**
  1.  **Pragmatic Instrumentalism:** Supervenient + Language-Relative.
  2.  **Pragmatic Best-System (MRL):** Supervenient + Objective Vocabulary + Indeterminate Tie-Breaks.
  3.  **Objective Best-System:** Supervenient + Objective Vocabulary + Determinate.
  4.  **Modal Stability (Lange):** Non-Supervenient + Counterfactually Stable + Non-Governing.
  5.  **Contingent Necessitation (Armstrong):** Non-Supervenient + Requires Instantiation + Contingent.
  6.  **Dispositional Essentialism:** Non-Supervenient + Essences + Necessitating.
  7.  **Primitivism (Maudlin):** Non-Supervenient + Brute Facts + Strict.
  8.  **Anti-Fundamentalist (Cartwright):** Non-Supervenient (local) + Capacities + Ceteris Paribus.
  9.  **Nihilism/Fictionalism:** No Laws.

  **The Empty Cells (And Why):**

  1.  **Humean + Metaphysically Necessary Laws:**
      *   *Why Empty:* Incoherent. If laws are summaries of the Humean mosaic (contingent events), they cannot be metaphysically necessary. If they are necessary, they must constrain the mosaic, making the view Non-Humean.
  2.  **Non-Humean + No Counterfactual Support:**
      *   *Why Empty:* Unattractive/Collapses. If a law doesn't support counterfactuals (what *would* happen if...), it is indistinguishable from a mere regularity. This collapses into Humeanism or Nihilism.
  3.  **Dispositional Essentialism + Uninstantiated Laws (of empty kinds):**
      *   *Why Empty:* Incoherent. If laws flow from the essences of properties, and the properties are powers, there must be bearers of those powers. A law about a particle type that *never* exists implies a power with no bearer, which Dispositionalists reject.

