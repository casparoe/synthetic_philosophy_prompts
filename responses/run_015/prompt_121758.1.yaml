answer: |-
  ### Exam Question: History of Social Theory
  **Time Allowed:** 90 Minutes
  **Expected Length:** ~600 Words
  **Total Marks:** 20

  **Prompt:**
  Consider two hypothetical families in 17th-century Europe. Family A is Calvinist, based in Geneva; Family B is Lutheran, based in Augsburg. Both possess identical capital reserves, legal protections, and access to trade routes. However, Family A consistently reinvests profits into high-risk, long-term lending ventures, while Family B prioritizes stable, local trade and withdraws capital for communal consumption once a "traditional" standard of living is met.

  Using Max Weber's *The Protestant Ethic and the Spirit of Capitalism*, analyze this divergence. Does the concept of **elective affinity** allow you to argue that Family A's religious ethos causally produced their economic behavior, or is their theology merely a post-hoc rationalization of their market position? In your answer, you must:
  1.  Define "inner-worldly asceticism" and distinguish "elective affinity" from material determinism.
  2.  Apply these concepts to explain the specific behavioral differences between Geneva and Augsburg.
  3.  Critically evaluate whether values can do independent causal work without collapsing into material conditions.

  ***

  ### Model Answer

  Max Weber's *The Protestant Ethic* argues that culture is not merely a superstructure of economic conditions but an independent variable capable of shaping economic action. To analyze the divergence between the Genevan Calvinists and the Augsburg Lutherans, one must move beyond simple determinism and utilize Weber's concept of **elective affinity**. This concept suggests that while religious ideas do not mechanically produce economic systems, specific ethical frameworks resonate with specific economic practices, reinforcing one another until a new "spirit" emerges.

  The core mechanism here is **inner-worldly asceticism**. For the Calvinist Family A in Geneva, the doctrine of predestination created profound psychological anxiety regarding salvation. Unable to alter God's decree, believers sought "signs" of election in worldly success. However, this was not license for hedonism. Wealth was permissible only if reinvested, not consumed. This religious compulsion transformed profit-seeking from a vice into a duty. Consequently, Family A's high-risk lending is not just rational calculation; it is a spiritual imperative. The capital is God's, and to let it lie idle is sinful.

  In contrast, Family B in Augsburg operates under a Lutheran ethos which, Weber argues, retained more traditionalist elements. Lutheranism emphasized acceptance of one's "calling" within the existing social order rather than the systematic transformation of the world through labor. Once the "traditional" standard of living was met, the religious imperative to work diminished. Thus, Family B's risk aversion and capital withdrawal are consistent with an ethos that views economic activity as a means to sustain life, not an end in itself.

  Does this prove values cause outcomes, or is it post-hoc rationalization? A materialist reductionist would argue Family A took risks because market conditions favored it, and later adopted Calvinism to justify the stress. However, the prompt stipulates identical material conditions for both families. If material conditions are constant but behaviors diverge, the variable must be cultural. This tests **counterfactual stability**: if we hold the material base steady and change the ideology, the economic outcome changes. This suggests the values are doing causal work.

  However, Weber avoids claiming religion *alone* caused capitalism. Elective affinity is not a one-way street. The causal claim is weakest when trying to isolate the exact moment values override material self-interest. Family A might still lend recklessly because it is profitable, using religion only to sleep at night. Yet, Weber's insight is that the *systematic* nature of their asceticism—reinvesting rather than consuming—broke the historical cycle of traditionalism. Without the cultural sanction to accumulate without consuming, the capital would have dissipated as it did in Family B.

  Ultimately, values can do causal work if they alter the *utility function* of the actor. For the Calvinist, the "utility" of reinvestment includes spiritual salvation, not just financial return. Therefore, the Geneva/Augsburg comparison supports Weber: when material constraints are equal, the ethical framework determines the threshold of risk and the horizon of investment. Culture is not the sole cause, but it is the switchman that determines the tracks along which material interests are pushed.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Conceptual Precision (6 Points)**
  *   **A Range (5-6):** Clearly defines "inner-worldly asceticism" as the channeling of religious anxiety into systematic labor/reinvestment. Explicitly distinguishes "elective affinity" (resonance/reinforcement) from "determinism" (mechanical cause).
  *   **B Range (3-4):** Defines asceticism correctly but treats elective affinity as simple causation (i.e., "Religion caused Capitalism") without nuance regarding mutual reinforcement.
  *   **C Range (0-2):** Vague definitions; conflates Weber with Marx or general culturalism.

  **2. Comparative Application (6 Points)**
  *   **A Range (5-6):** Uses the Geneva/Augsburg scenario to test **counterfactual stability**. Explicitly notes that because material conditions are identical, the behavioral divergence *must* be attributed to the ethos. Contrasts Calvinist reinvestment vs. Lutheran traditionalism.
  *   **B Range (3-4):** Applies the concepts to the families but fails to leverage the "identical capital" constraint to rule out material explanations. Treats the comparison as descriptive rather than analytical.
  *   **C Range (0-2):** Ignores the specific details of the prompt (Geneva/Augsburg) and writes a generic essay on Weber.

  **3. Critical Evaluation (6 Points)**
  *   **A Range (5-6):** Directly addresses the **reductionist challenge** (post-hoc rationalization). Pinpoints the **weakest link** in the causal claim (e.g., difficulty isolating values from self-interest, or the "switchman" metaphor). Concludes on the modification of the "utility function."
  *   **B Range (3-4):** Acknowledges the reductionist challenge but dismisses it too easily or fails to identify where Weber's argument is vulnerable.
  *   **C Range (0-2):** Takes Weber's thesis as absolute truth or dismisses it entirely without argument.

  **4. Structure and Clarity (2 Points)**
  *   **A Range (2):** Concise, logical flow, adheres to word limit.
  *   **B Range (1):** Disorganized or significantly over/under word count.

  ***

  ### Journalist's Reflection: On Values and Causality

  **What would change my mind?**
  I would be convinced that values *cannot* genuinely cause economic outcomes if presented with robust longitudinal data showing that shifts in economic behavior consistently *precede* shifts in religious or ethical codification by a significant margin. If we could demonstrate that "inner-worldly asceticism" only emerged in populations *after* they had already achieved a certain threshold of capital accumulation (suggesting the theology was engineered to protect existing wealth rather than generate it), the causal arrow flips. Essentially, if the "spirit" is always shown to be a lagging indicator of the "system," the Weberian claim collapses into sophisticated rationalization.

  **Where is my reasoning most likely to fail?**
  My reasoning is most vulnerable to the problem of **inseparability**. In the real world, we never get the clean control group described in the exam question (identical capital, different culture). Culture and material conditions co-evolve. By trying to isolate values as an independent variable, I may be engaging in the same analytical abstraction I criticize in materialists. It is possible that "values" are simply the cognitive interface through which material conditions are processed, meaning asking if they are a "cause" is a category error. They are not the engine, nor the fuel, but the steering mechanism—and you cannot drive a car with only a steering wheel.
