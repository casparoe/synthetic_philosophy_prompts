      *   *The Verdict:* Guilt remains even if the ship doesn't sink. The wrong is in the *origin* of the belief, not the outcome.
      *   *The Principle:* "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence."
      *   *Voluntarism:* Clifford *does* seem to treat belief formation as subject to moral regulation. He talks about "acquiring" belief, "working himself into that frame of mind." This implies a degree of control.
