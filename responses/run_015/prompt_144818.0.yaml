prompt: |-
  Im putting together a cause-prioritization framework for a small grantmaking team — maybe ten candidate causes, a couple of staff, no realistic shot at multi-year research programs — and before I just adopt importance/tractability/neglectedness I want the spec: what does a framework like this actually have to deliver to count as adequate for that purpose? Give me the requirements with the case or failure mode behind each, not the ITN spiel Ive already read. Things Im stuck on and want you to judge, add to, or throw out:

  - partition sensitivity: the scores move depending on how finely you carve up the cause space (global health vs malaria vs bednet delivery in one province vs one delivery org), so is invariance to the carving a genuine requirement, and could anything actually meet it
  - fungibility: the counterfactual value of a marginal dollar isnt proportional to how much a cause currently gets, so both per-dollar comparisons and "neglectedness" can mislead — does that have to be modeled explicitly or can it be left as a verbal caveat
  - option value: sometimes the best cause is learn-more, or invest-and-give-later rather than spend now; should that live inside the same framework or in a separate budget
  - interaction: causes that are complements or substitutes, where the scores dont decompose and you cant rank them one at a time
  - cluelessness: flow-through effects decades out that nobody can sign off on, plus the option of causes whose main effect is on what future funders do
  - usability by people who cant produce confident numbers — is that a desideratum of the framework or just a fact about me

  Tell me which of these are real desiderata and which are one camp's taste, which are non-negotiable given my purpose, and whether some subset is jointly unsatisfiable — that's the part I care most about, since if it is, the list itself is the finding. Then: which single requirement knocks out the most candidate frameworks, and two lines max on how ITN itself does, I can fill in the rest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Small grantmaking team (2 staff, ~10 candidate causes), limited resources (no multi-year research), looking for a cause-prioritization framework specification.
      *   **Goal:** Define the *requirements* (spec) for an adequate framework, not just adopt ITN (Importance, Tractability, Neglectedness) blindly.
      *   **Specific Questions:** Evaluate a provided list of stuck points (partition sensitivity, fungibility, option value, interaction, cluelessness, usability). Determine which are real desiderata vs. taste, which are non-negotiable, and if any are jointly unsatisfiable. Identify the single requirement that knocks out the most frameworks. Give a 2-line verdict on ITN.
      *   **Tone:** Rigorous, pragmatic, concise, avoiding standard EA jargon where possible (since they know ITN already), focusing on *functional adequacy*.

  2.  **Deconstruct the Provided "Stuck Points":**

      *   *Partition Sensitivity:* Is invariance to granularity a requirement?
          *   *Analysis:* In practice, no framework is truly invariant. But a *good* framework shouldn't change rankings wildly based on arbitrary labeling. However, for a small team, "causes" are usually pre-defined buckets (e.g., "malaria" vs "AI safety"). If the framework breaks when you split "malaria" into "bednets" and "drugs," it's unstable.
          *   *Verdict:* Real desideratum, but strict invariance is impossible. Stability is the goal.

      *   *Fungibility:* Marginal dollar value isn't linear.
          *   *Analysis:* ITN assumes diminishing returns (via Neglectedness), but often poorly. For a small team, the "marginal dollar" is their *entire budget*. They need to know where *their* money goes, not where the world's money goes.
          *   *Verdict:* Non-negotiable for small teams. "Neglectedness" is often a proxy for room for more funding, but it's a bad one.

      *   *Option Value:* Learn-more vs. spend-now.
          *   *Analysis:* Small teams often can't afford pure research grants. But they might fund pilot programs.
          *   *Verdict:* Desideratum, but often needs a separate bucket (learning budget) rather than forcing it into the same scoring metric.

      *   *Interaction:* Complements/Substitutes.
          *   *Analysis:* ITN is additive/ranking-based. It fails at portfolio construction.
          *   *Verdict:* Non-negotiable for *allocation*, but maybe too hard for *prioritization*. If you can only pick one, interactions matter less. If you split funds, they matter a lot. Given "10 candidate causes," they likely won't fund all 10.

      *   *Cluelessness:* Long-term/flow-through effects.
          *   *Analysis:* Paralysis by analysis. For a small team with short timelines, this is a distraction.
          *   *Verdict:* Taste/Philosophical stance. For a pragmatic small team, this should be bounded/truncated.

      *   *Usability:* Can non-experts use it?
          *   *Analysis:* If the staff can't use it, it's useless.
          *   *Verdict:* Non-negotiable. A framework requiring PhD-level econometrics is inadequate for a 2-person team.

  3.  **Evaluate Joint Satisfiability (The "Impossible Trinity" of Prioritization):**
      *   Rigor (handling fungibility/interactions) vs. Usability (simple inputs) vs. Precision (avoiding partition sensitivity).
      *   *Hypothesis:* You cannot have high precision on marginal counterfactuals *and* low cognitive load *and* stability across granularities.
      *   *Conclusion:* The constraints are likely jointly unsatisfiable at a high level of rigor. The spec must acknowledge trade-offs.

  4.  **Drafting the Requirements (The "Spec"):**
      *   Need to translate the user's "stuck points" into functional requirements.
      *   *Requirement 1: Marginal Specificity.* (Addresses Fungibility). Must evaluate *their* dollar, not the average dollar.
      *   *Requirement 2: Cognitive Load Cap.* (Addresses Usability). Must work with limited data/expertise.
      *   *Requirement 3: Decision Stability.* (Addresses Partition Sensitivity). Rankings shouldn't flip on semantic splits.
      *   *Requirement 4: Portfolio Awareness.* (Addresses Interaction). Acknowledge if causes are mutually exclusive or synergistic.

  5.  **Addressing the Specific Questions:**
      *   *Which are real desiderata?* Usability, Marginal Specificity.
      *   *Which are taste?* Cluelessness (time horizon).
      *   *Which are jointly unsatisfiable?* Precision (Fungibility/Interaction) + Low Effort (Usability).
      *   *Single requirement knocking out frameworks:* **Marginal Specificity** (Most frameworks compare average impact or use "neglectedness" as a lazy proxy for marginal room).
      *   *ITN Verdict:* Fails marginal specificity (uses averages/proxies) and interaction (assumes independence). Good heuristic, bad calculator.

  6.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Keep it sharp. Don't lecture on EA. Focus on the "Spec."
      *   *Constraint Check:* "Two lines max on how ITN itself does."
      *   *Key Insight:* The user is asking for a *spec*, not a solution. I need to define *what success looks like*, not necessarily solve the math.
      *   *Critical realization:* For a 2-person team, "Option Value" and "Interaction" are often too complex to model. The spec should demand they be *acknowledged*, not necessarily *quantified*.
      *   *Partition Sensitivity:* This is a known flaw in ITN. The spec should require "Bucket Stability."

  7.  **Finalizing the Verdicts:**
      *   *Partition Sensitivity:* Real desideratum (Stability), but strict invariance is impossible.
      *   *Fungibility:* Non-negotiable. (Must be counterfactual).
      *   *Option Value:* Separate bucket (Hybrid approach).
      *   *Interaction:* Real desideratum, but often ignored by simple frameworks.
      *   *Cluelessness:* Taste (Time horizon preference).
      *   *Usability:* Non-negotiable.

      *   *Joint Unsatisfiability:* High fidelity on fungibility/interaction + Low cognitive load. You have to sacrifice one.
      *   *Killer Requirement:* **Counterfactual Marginal Specificity.** (Most frameworks fail here).
      *   *ITN:* Fails marginal specificity (confuses average with marginal) and interaction (assumes additivity). Useful for filtering, useless for final allocation.

  8.  **Constructing the Response:** (Drafting mentally)
      *   Start with the Verdict on the "Stuck Points."
      *   Define the Core Spec (The 3-4 must-haves).
      *   Address the "Jointly Unsatisfiable" tension.
      *   Answer the "Killer Requirement" and "ITN" questions.

      *(Self-Correction during drafting)*: Make sure I don't just say "Usability is key." I need to explain *why* it's a spec requirement, not just a fact about them. It's a requirement because a framework that requires data they don't have produces garbage output. Garbage output = inadequate framework.

      *(Refining Partition Sensitivity)*: Don't ask for invariance. Ask for "robustness to reasonable re-categorization."

      *(Refining Fungibility)*: Call it "Marginal Counterfactual Accuracy."

      *(Refining ITN)*: Keep it under 2 lines. "ITN treats causes as independent buckets and substitutes neglectedness for marginal room. It filters well but allocates poorly."

  9.  **Final Polish:** Check against constraints. (Two lines max on ITN). Ensure the tone is professional and direct. (Proceed to generate output).

      *Wait, one more check on the "Jointly Unsatisfiable" part.*
      The user asked: "whether some subset is jointly unsatisfiable — that's the part I care most about, since if it is, the list itself is the finding."
      I need to highlight this clearly. The tension is between **Precision** (handling fungibility/interaction) and **Friction** (usability/data requirements). You can't have a framework that perfectly models marginal counterfactuals and portfolio effects *and* is usable by 2 people with no research budget.

      *Okay, ready to write.*
answer: |-
  Here is the spec evaluation based on your constraints (2 staff, 10 causes, low research capacity).

  ### 1. Judgment on Your "Stuck Points"

  *   **Partition Sensitivity:** **Real Desideratum (Stability, not Invariance).** Strict invariance is mathematically impossible for heuristic frameworks. The requirement is *robustness*: if you split "Global Health" into "Malaria" and "TB," the total resource allocation to that cluster shouldn't swing wildly.
      *   *Failure Mode:* You game the system by granularizing your pet cause to make it look more "neglected."
  *   **Fungibility:** **Non-Negotiable.** For a small team, "Neglectedness" is a dangerous proxy for "Room for More Funding."
      *   *Failure Mode:* You fund a cause that is globally neglected but saturated *for your specific check size*, or ignore a crowded cause where you have a specific comparative advantage.
  *   **Option Value:** **Hybrid Requirement.** Do not force this into the same scoring metric. The spec must mandate a **separate learning budget** (e.g., 10% of funds) distinct from the "best bet" allocation.
      *   *Failure Mode:* Paralysis. You downgrade high-variance causes because they don't score well on immediate impact metrics.
  *   **Interaction:** **Real Desideratum (Portfolio Awareness).** The framework must allow for negative correlation or synergy flags, even if it can't model them mathematically.
      *   *Failure Mode:* You fund two causes that cancel each other out (e.g., policy advocacy vs. direct service that undermines the policy) or miss a leverage point requiring both.
  *   **Cluelessness:** **Taste / Philosophical Stance.** This is a time-horizon constraint, not a framework flaw. The spec should define the *time horizon* (e.g., "effects within 10 years") to truncate the calculation.
      *   *Failure Mode:* Infinite regress. You cannot compare causes if one requires modeling the heat death of the universe.
  *   **Usability:** **Non-Negotiable.** A framework requiring data you cannot produce is not "rigorous," it is "broken."
      *   *Failure Mode:* Garbage In, Garbage Out. Precise formulas fed by wild guesses create false confidence.

  ### 2. The Joint Unsatisfiability Finding

  **Precision (Fungibility/Interaction) and Usability are jointly unsatisfiable for your constraints.**

  You cannot build a framework that accurately models marginal counterfactuals and portfolio interactions *and* is usable by two people without a research budget. High-fidelity counterfactual modeling requires data on the marginal productivity of other funders (which you don't have). Portfolio optimization requires covariance matrices (which you can't estimate).

  **The Spec Implication:** You must explicitly trade fidelity for stability. The framework is adequate if it produces *stable, defensible rankings* using *available data*, not if it produces *mathematically true* marginal values. Acknowledge this trade-off in the spec; do not pretend the framework solves for marginal value when it is actually sorting by heuristics.

  ### 3. The Killer Requirement

  **Marginal Counterfactual Specificity.**

  This knocks out the most candidate frameworks (including standard ITN). Most frameworks compare *average* impact or use *total funding* as a proxy for marginal room. A framework that cannot distinguish between "This cause needs money" and "This cause needs *our* money specifically" is inadequate for allocation, though acceptable for filtering.

  ### 4. ITN Verdict

  ITN treats causes as independent buckets and substitutes total neglectedness for marginal room for funding. It filters well but allocates poorly, failing the marginal specificity and interaction requirements.
