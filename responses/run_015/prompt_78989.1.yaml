      *   *Searle:* Searle argues syntax is observer-relative. If the user accepts Searle, (2) dies. The user doesn't want that.
      *   *Piccinini:* Mechanistic account. Computation is what mechanisms do. Rocks aren't mechanisms for computation.
      *   *The "United States" argument:* This is likely referencing Schwitzgebel. It's a reductio, but not a definitive proof against functionalism.
      *   *Recommendation:* Stick with the Counterfactual/Causal constraint on implementation. This saves the thesis.

  7.  **Structure of the Response:**
