  2.  **Deconstruct the Friend's Argument:**
      *   This is a classic formulation of the "Triviality Argument" against Computational Functionalism.
      *   Key references: Hilary Putnam (representation independence), David Chalmers ("A Computational Foundation for the Study of Cognition" / "The Conscious Mind"), John Searle ("Is the Brain a Digital Computer?").
      *   The core tension is between *syntax* (formal computation) and *semantics/causation* (physical implementation).
      *   Premise (3) is the heavy lifter. It claims *unrestricted* mapping is sufficient for implementation.
      *   Premise (5) claims no non-arbitrary account of implementation exists without begging the question or leading to panpsychism.

  3.  **Evaluate Potential Rejection Points:**

      *   **Reject (1)?** User explicitly says no. (Ethical commitment).
      *   **Reject (6)?** User explicitly says no. (Common sense/thesis viability).
      *   **Reject (2)?** This is Functionalism. If rejected, the thesis collapses (as the user fears). This leads to biological naturalism (Searle) or illusionism.
      *   **Reject (3)?** This is the "Triviality Thesis." Most functionalists attack here. They argue that *mere mapping* isn't implementation. Implementation requires *counterfactual support*, *causal structure*, or *input/output sensitivity*.
