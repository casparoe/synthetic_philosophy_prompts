  4.  **Formulate the Diagnosis:**
      *   **The Weak Link:** Premise (3) and the inference to (4).
      *   **Why:** Putnam's theorem applies to *open* systems over *finite* time without regard for *counterfactuals* or *causal structure*. Real computation requires more than just a state-mapping; it requires that the system *would* have transitioned differently if the input were different. A rock doesn't support the right counterfactuals.
      *   **The Fix:** Strengthen the definition of "implementation." It's not just about actual state trajectories; it's about the *dispositional* structure.
      *   **The Cost:** You have to accept that "computation" is not purely abstract; it relies on physical causation. You move from "pure" functionalism to "causal" functionalism. This opens the door to questions about *which* causal structures count (leading back to some of the worries in 5, but less dire).
      *   **Alternative:** Reject (2) entirely. If computation isn't enough, maybe you need specific biological features (Biological Naturalism). But this kills the AI thesis.

  5.  **Drafting the Response (Iterative Process):**

      *   *Empathy/Validation:* Acknowledge the stress. This is a famous, nasty problem (the "Triviality Argument"). It keeps real philosophers up at night.
      *   *Identify the Target:* Premise (3) is the standard target. Specifically, the interpretation of "implementing."
      *   *Explain the Counter-Argument:* Chalmers actually addresses this. He distinguishes between a system *having* a mapping and a system *supporting* the counterfactuals required by the FSM. A rock matches the *actual* history of states, but not the *possible* histories.
      *   *Address Premise (5):* The friend claims no account works. Cite Gualtiero Piccinini or David Chalmers. They argue for "mechanistic computation." It's not arbitrary; it's about functional organization intended for information processing.
