  8.  **Final Polish:** Ensure tone is supportive but rigorous. Avoid jargon where possible, but use it correctly (counterfactuals, dispositional states, mechanistic). Make sure to explicitly answer the prompt's specific questions (Which step to reject? What do you lose? Where is your diagnosis wrong?).

      *(Self-Correction during drafting)*: I need to be careful about Chalmers. The friend says "paper by Chalmers with a rock in the title." That's likely "Does a Rock Implement Every Finite-State Automaton?" (1996). In that paper, Chalmers *agrees* with Putnam that a rock implements an FSM *under a specific, weak definition*, but argues this doesn't threaten functionalism because functionalism requires more than just FSM implementation (it requires reliable counterfactuals). So the friend is using Chalmers to attack the position Chalmers actually defends. I should point this out.

