          5.  Stronger definition problem: Existing accounts are circular or imply panpsychism (US consciousness, etc.).
          6.  Conclusion: Rocks aren't conscious $\rightarrow$ No good account of implementation $\rightarrow$ (2) is false or empty $\rightarrow$ AI moral status based on computation is undermined.
      *   **User's Constraints:** Wants to keep (1) (Experience is necessary for moral status) and (6) (Rocks aren't conscious). Preferably wants to keep (2) (Functionalism).
