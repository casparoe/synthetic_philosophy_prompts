answer: |-
  ### The Verdict on Pure Scaffolded Collective Action

  Both accounts classify the pure Scaffolded Collective Action (SCA) case as merely parallel individual actions rather than genuine joint action, though they exclude it for different structural reasons. Account A, the individualist interlocking-attitudes view, requires that each participant intend that the joint activity occur and intend to do their part *by way of* the others doing theirs, grounded in common knowledge. In pure SCA, drivers intend only to follow their specific instructions to achieve their private ends (e.g., arriving home quickly). They do not intend the system-level outcome (traffic optimization), nor do they intend their action *by way of* the others' actions in the required reflective sense; they act by way of the algorithm's instruction. Furthermore, strict common knowledge of the specific co-participants is absent. Drivers know others exist, but they lack the mutual awareness of specific agents required to mesh sub-plans. Thus, Account A lacks the vocabulary to describe this as joint action because the interlocking intentional structure is missing.

  Account B, the joint-commitment view, excludes pure SCA categorically because there is no joint commitment. A joint commitment requires an expression of joint willingness to embody a goal as a body, creating a plural subject. In SCA, participants do not express willingness to one another; they interact only with a mechanism. There is no moment of agreement, explicit or implicit, that binds them normatively to each other. Consequently, there is no plural subject. Both accounts agree the case is not joint action, but Account A cites a deficit in cognitive interlocking, while Account B cites a deficit in normative bonding.

  ### Degree, Kind, and the Coordinator Variant

  The failure in pure SCA is a matter of kind, not degree. It is not that the mutual responsiveness is too attenuated; rather, the requisite relational structure is entirely absent. For Account A, the missing element is the *we-intention* distributed across individual minds; for Account B, it is the *normative bond* constituting the group. Introducing the human-coordinator variant does not resolve this for the group of participants, though it changes the dyadic relations. In the coordinator variant, the human holds the plan and intends the outcome. This likely generates a joint action between the coordinator and each individual participant (a hub-and-spoke model), provided each driver intends to follow the human's plan. However, this does not generate joint action *among the participants themselves*. They remain isolated nodes connected only to the center.

  This asymmetry poses a problem for both accounts if they aim to explain large-scale social coordination. Account A struggles because the meshing of sub-plans is mediated entirely by the coordinator, not directly between participants. Account B struggles because the obligations run vertically (driver to coordinator) rather than horizontally (driver to driver). If the literature claims to explain how groups act, yet excludes cases where hundreds act in tightly coordinated interdependence solely due to a lack of mutual identification, the accounts risk being overly restrictive. The exclusion is categorical: without the specific interpersonal glue (interlocking intention or joint commitment), no amount of causal interdependence suffices to cross the threshold into joint action.

  ### Ownerless Goals and Rebuke-Shaped Reactions

  A defining feature of SCA is the ownerless goal: the system-level objective exists in the mechanism's function but is represented by no participant. Neither account has resources to attribute this goal to the collective without attributing it to the members. Account A reduces collective goals to individual intentions; if no individual intends the goal, the collective does not intend it. Account B requires the plural subject to hold the goal, but the plural subject is constituted by the members' commitment. If the members do not commit to the goal, the plural subject does not hold it. Both accounts lose explanatory power here, as they cannot accommodate functionalist descriptions where the system has a goal distinct from its parts. They are forced to deny that the traffic flow is a collective goal, describing it instead as an aggregate outcome.

  Regarding rebuke-shaped reactions, such as platform bans or public blame, neither account must treat these as evidence of joint action. Account B ties entitlement to rebuke strictly to joint commitment. Since there is no joint commitment in SCA, the "blame" is not an exercise of a normative entitlement among peers but an institutional sanction imposed by the platform owner or a causal attribution of harm by observers. Account A similarly derives obligations from the consistency of intentions. Without interlocking intentions, there is no obligation to the group, only perhaps a moral obligation not to harm others causally. The appearance of collective responsibility can be explained by causal contribution to a harm combined with institutional roles, without positing joint action. This preserves the accounts' integrity but renders them unable to validate the intuitive sense that the drivers *together* did something wrong.

  ### The Cost of Accommodation and Paradigm Dependence

  To accommodate SCA, each account must pay a significant theoretical cost. Account A would need to delete the requirement for common knowledge of specific participants, allowing intention to interlock via a proxy (the algorithm). This threatens its reductive parsimony, as it moves away from pure psychological states toward structural relations mediated by external tools. Account B would need to allow joint commitment to be formed implicitly through usage of a platform, without direct expression of willingness to co-participants. This is more expensive. It severs the tight link between acting together and being obligated to specific others. If one can be jointly committed without expressing willingness to the co-members, the normative force of the commitment weakens, undermining the account's primary motivation: explaining the special binding nature of social groups.

  This reveals a paradigm-dependence in the literature. Standard examples—walking together, singing a duet—smuggle in face-to-face mutual awareness. SCA cases are not degenerate; they are increasingly central to modern social life. Excluding them is a defect, not a feature, because it suggests these accounts describe only small-scale interaction, not social ontology generally. The exclusion highlights that both accounts prioritize interpersonal recognition over functional coordination. If social ontology is to explain how societies function, it must account for cases where coordination is high but recognition is low.

  ### The Biological Primitive Check

  If collective intentionality is treated as a biologically primitive capacity, as in the view associated with John Searle, SCA is handled slightly better but not solved. This view posits that individuals have a primitive capacity to entertain "we-intentions" that are not analyzable into "I-intentions." This removes the need for complex interlocking structures or normative commitments. However, it still requires that each participant actually hold a we-intention (e.g., "We are optimizing traffic"). In pure SCA, drivers typically hold only I-intentions ("I am following my route"). Unless the biological capacity allows for anonymous we-intentions triggered by algorithmic instruction without conscious awareness of the collective, this view also fails to classify SCA as joint action. It pays for its simplicity by relying on a brute psychological fact that may simply be absent in these cases, leaving the ownerless goal still unattributed.
