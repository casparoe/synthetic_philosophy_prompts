answer: |-
  **JOINT STATEMENT ON THE EPISTEMIC TRANSITION IN MARY'S ROOM**

  **Undersigned:**
  1.  Proponent of the Phenomenal-Concept Strategy (Physicalist)
  2.  Proponent of Anti-Physicalist Direct Realism

  **1. AGREED CLAIMS**

  Following a structured adversarial collaboration regarding the Knowledge Argument, the undersigned affirm the following points of consensus:

  1.  **Setup Validity:** We accept Frank Jackson's original thought experiment as the operational baseline: Mary is a scientist confined to a monochromatic environment who possesses complete physical information regarding color vision and processing but lacks first-person color experience. Upon viewing a red tomato, she undergoes an epistemic transition.
  2.  **Logical Form:** We agree that the argument functions as a modus ponens against physicalism. Premise 1: Mary knows all physical facts prior to release. Premise 2: Mary learns something new upon release. Conclusion: Not all facts are physical facts.
  3.  **Reply Taxonomy:** We acknowledge the standard physicalist responses, including the Ability Hypothesis (Mary gains know-how, not know-that) and Illusionism (phenomenal properties do not exist). However, this collaboration focuses specifically on the Phenomenal-Concept Strategy, which grants Mary gains new propositional knowledge while maintaining physicalist ontology.
  4.  **Non-Circularity Criterion:** We establish that a satisfactory resolution must explain Mary's epistemic transition without begging the ontological question. Specifically, one cannot assume physicalism is true to explain why Mary's new knowledge is compatible with physicalism; the explanation of the transition must stand independently of the desired ontological conclusion.

  **2. DISAGREEMENTS TABLE**

  The following table delineates the divergent interpretations of Mary's epistemic transition. Each position is phrased to maximize steelmanning by its respective proponent.

  | Feature of the Transition | Phenomenal-Concept Strategist (Physicalist) | Anti-Physicalist Direct-Realist |
  | :--- | :--- | :--- |
  | **Nature of the Gain** | Mary acquires a centered-world indexical or demonstrative concept. She gains a new mode of presentation for a physical state she already knew about under a theoretical description. No new worldly fact is added to the inventory of reality. | Mary acquires acquaintance with a non-physical property. The gain is not merely conceptual but ontological; she accesses a qualitative property that was not captured by the complete physical description. |
  | **Perspectival Concepts vs. Physicalism** | Physicalism is compatible with irreducibly perspectival concepts. The existence of a concept that cannot be deduced from physical terms does not entail the existence of a non-physical property. The gap is cognitive, not metaphysical. | If phenomenal concepts are irreducibly perspectival, physicalism fails. A complete physical description should not leave out a perspective on reality that reveals genuine properties. If the perspective reveals something the physical description missed, the description was incomplete. |

  **3. CRUXES AND PREDICTIONS**

  We have identified two specific experimental or theoretical cruxes where our models generate divergent predictions. We record our anticipated updates should these cruxes be resolved.

  **Crux A: The Neuro-Implant Scenario**
  *Scenario:* Mary remains in the black-and-white room. A device stimulates her visual cortex directly, bypassing the retina, inducing a color experience identical to seeing a red tomato.
  *Question:* Does this count as gaining the relevant experience for the Knowledge Argument, and how does this impact the ontological inference?

  *   **Phenomenal-Concept Strategist Prediction:**
      *   *Classification:* Yes, this counts as the relevant experience.
      *   *Impact:* This strengthens the Physicalist view. It demonstrates that the phenomenology is fully dependent on internal physical states (cortical activation) rather than external relations or non-physical properties. If the physical state suffices for the experience, the "newness" must be conceptual.
  *   **Anti-Physicalist Direct-Realist Prediction:**
      *   *Classification:* Yes, this counts as the relevant experience.
      *   *Impact:* This is neutral or strengthens the Anti-Physicalist view. Even if the cause is physical, the *content* of the experience (the redness) remains distinct from the physical description of the firing neurons. The implant generates the non-physical property instance; it does not reduce the property to the wiring.

  **Crux B: Transparency and Circularity**
  *Scenario:* A formal model is produced that successfully reduces phenomenal concepts to demonstrative modes of presentation without referencing non-physical properties.
  *Question:* Does this resolution vindicate the Physicalist ontology, or does it merely mask the ontological gap?

  *   **Phenomenal-Concept Strategist Prediction:**
      *   *Outcome:* This resolves the dispute in the Strategist's favor.
      *   *Reasoning:* If the unique epistemic access can be fully explained by the functional role of demonstrative concepts, the motivation for positing non-physical properties evaporates. The explanation of the transition is sufficient without ontological expansion.
  *   **Anti-Physicalist Direct-Realist Prediction:**
      *   *Outcome:* This fails to resolve the dispute and risks circularity.
      *   *Reasoning:* Explaining the *concept* does not explain why the concept refers to *this* specific quality rather than a physical state. If the concept is transparent (revealing the nature of the property), and the nature revealed is not physical, then reducing the concept to a mode of presentation merely relocates the mystery without solving it.

  **4. CONCLUSION: ASSESSMENT OF VERBAL DISAGREEMENT**

  We conclude by assessing whether the residual disagreement is substantive or verbal. The core divergence lies in the interpretation of the phrase "knowing what it is like."

  *   **Phenomenal-Concept Strategist Position:** This denotes merely a familiar mode of knowing an old fact. The disagreement is largely verbal regarding the definition of "fact." Once we distinguish between "fact" as a worldly state of affairs and "fact" as a propositional attitude, the tension dissolves. Mary knows the same worldly state under a new guise.
  *   **Anti-Physicalist Direct-Realist Position:** This denotes a distinct epistemic kind (acquaintance) that tracks a distinct ontology. The disagreement is substantive. To claim Mary only knows an "old fact" under a new description is to ignore that the mode of access (experience) reveals properties that the old description (physical theory) failed to capture.

  **Final Assessment:** We agree that if the term "fact" is operationalized strictly as "truth-conditional worldly state," the Strategist is correct that no new fact is added. However, if "fact" includes "property instance accessible only via acquaintance," the Direct-Realist is correct that the physical inventory is incomplete. We update that the dispute is substantive regarding the nature of properties, but verbal regarding the labeling of those properties as "facts." Further collaboration will focus on whether a property accessible only via acquaintance can be ontologically identical to a property accessible via theoretical description.
