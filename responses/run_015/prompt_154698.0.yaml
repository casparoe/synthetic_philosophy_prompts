answer: |-
  # The RIR Audit (v1.0)
  **Purpose:** Rapid ethical stress-test for character arcs involving irreversible harm, deletion, or betrayal.
  **Time Budget:** 20 Minutes hard stop.
  **Core Metric:** Recursive Identification Residue (RIR) — The structural accumulation of signals inviting the player to treat an entity as autonomous.
  **Author:** Narrative Ethics Reviewer
  **Stakeholder:** Lead Designer (Non-Philosophical)

  ---

  ## Part 1: The Word-Flowchart

  **START:** Input the proposed character arc/mechanic.

  **Q1: The Irreversibility Check**
  *   **Question:** Is the harm (death, deletion, memory wipe, betrayal) permanently irreversible within the context of the save file/run?
  *   **Enough Answer:** Yes/No based on code functionality.
  *   **If NO:** **STOP.** (Ethical weight negligible for this procedure).
  *   **If YES:** Proceed to Q2.

  **Q2: The Agency Signal Count**
  *   **Question:** List the systems that simulate this character's independence from the player. (e.g., Unique dialogue trees, independent inventory, AI that acts without input, refusal mechanics, off-screen life simulation).
  *   **Enough Answer:** Minimum of 3 distinct systemic signals.
  *   **If <3 Signals:** **HALT.** (Low RIR. Character is functionally a prop. Decision kicks to **Human Values** — *Is prop destruction tasteful?*).
  *   **If ≥3 Signals:** Proceed to Q3. (High RIR Accumulation).

  **Q3: The Duration/Depth Weight**
  *   **Question:** What is the minimum playtime invested with this entity before the harm occurs?
  *   **Enough Answer:** Hours (not minutes).
  *   **If <2 Hours:** **HALT.** (RIR insufficient to trigger "Moral Weight" threshold. Decision kicks to **Human Values** — *Is the pacing abrupt?*).
  *   **If >2 Hours:** Proceed to Q4. (High RIR Confirmed).

  **Q4: The Contradiction Check (Crucial)**
  *   **Question:** Does the mechanic of the harm treat the character as *code* after the narrative treated them as *person*?
      *   *Example:* They have free will (Person), but you delete their save file like a document (Code).
      *   *Example:* They choose to die (Person), and the animation reflects choice (Person).
  *   **Enough Answer:** Binary assessment of Ludonarrative consistency.
  *   **If CONSISTENT:** Proceed to Q5.
  *   **If CONTRADICTORY:** **RED FLAG.** (High risk of player trauma/backlash. Requires Redesign).

  **Q5: The Disclosure Check**
  *   **Question:** Was the risk of this harm disclosed or structurally implied *before* RIR accumulation began?
  *   **Enough Answer:** Yes (Informed Consent) / No (Bait & Switch).
  *   **If YES:** **GREEN LIGHT.** (Proceed with content warning).
  *   **If NO:** **YELLOW FLAG.** (Requires narrative foreshadowing or optional opt-out).

  **END OF PROCEDURE.**

  ---

  ## Part 2: Application to Proposals

  Here is how the audit runs on your three current tickets.

  ### Proposal 1: Optional Quest (Erase Companion Memory to Keep Them)
  *   **Q1 (Irreversible):** Yes. Memory wipe is permanent.
  *   **Q2 (Signals):** High. They have dialogue, inventory, refusal mechanics. (Pass)
  *   **Q3 (Duration):** 30+ Hours. (Pass)
  *   **Q4 (Contradiction):** **CONTRADICTORY.** The game simulates them as a person with a history, but the solution treats their mind as a writable drive. The mechanic reduces their agency to a toggle.
  *   **Q5 (Disclosure):** Likely No. Usually hidden "true ending" stuff.
  *   **AUDIT RESULT:** **RED FLAG.**
  *   **Action:** Redesign. Either make the memory wipe a mutual decision (narrative consistency) or disclose the cost upfront. You cannot hide a lobotomy behind a "loyalty" check after 30 hours of building autonomy.

  ### Proposal 2: Mandatory Story Death (Noble Sacrifice)
  *   **Q1 (Irreversible):** Yes. Death is final.
  *   **Q2 (Signals):** High. They fight alongside you, give advice. (Pass)
  *   **Q3 (Duration):** 10 Hours. (Pass)
  *   **Q4 (Contradiction):** **CONSISTENT.** If the death is framed as *their* choice (Noble Sacrifice) and the player is powerless to stop it, the agency remains with the NPC. The game does not treat them as code; it treats them as a martyr.
  *   **Q5 (Disclosure):** Yes. Foreshadowing exists in Act 1.
  *   **AUDIT RESULT:** **GREEN LIGHT.**
  *   **Action:** Proceed. Ensure the animation/scene emphasizes *their* agency, not the script forcing them.

  ### Proposal 3: Roguelike (Unique NPC Family Deleted on Permadeath)
  *   **Q1 (Irreversible):** Yes. Run failure deletes the family.
  *   **Q2 (Signals):** Medium. Custom dialogue, names, relationships. (Pass)
  *   **Q3 (Duration):** Variable. Could be 5 mins, could be 5 hours. Average is low.
  *   **Q4 (Contradiction):** **CONSISTENT.** The genre contract (Roguelike) establishes disposability upfront. The system treats them as run-dependent entities.
  *   **Q5 (Disclosure):** Yes. Genre conventions imply risk.
  *   **AUDIT RESULT:** **GREEN LIGHT.**
  *   **Action:** Proceed.

  ---

  ## Part 3: The Answer I Hate (And Why)

  **The Answer:** The Audit gives a **GREEN LIGHT** to **Proposal 3 (The Roguelike Family Deletion).**

  **Why I Hate It:**
  My gut tells me there is something deeply cynical about procedurally generating a "unique family" with "custom dialogue" specifically to destroy them repeatedly. It feels like mass-producing grief for mechanics. It feels like the "Code" argument my roommate made, weaponized.

  **Why The Tool Says Yes:**
  The RIR Audit measures *structural consistency*, not *emotional volume*. Because the Roguelike "Contract" (Q5) is established at minute zero, the RIR never fully cements. The player is invited to identify, but also invited to expect loss. The tool cannot measure the *cumulative fatigue* of deleting 50 unique families. It only measures the ethical weight of deleting *one*.

  **What This Means for You:**
  You cannot use this tool to ban "sad mechanics." You can only use it to ban "dishonest mechanics." If you want to stop Proposal 3, you have to argue it on **Human Values** (Q2 Kick Point), not RIR. You have to say, "This is wasteful," not "This is unethical."

  ---

  ## Part 4: Known Misfires & Limitations

  **1. The "Fun" Blindspot**
  This tool does not measure if the mechanic is *fun*. A Red Flag mechanic might be the most memorable part of the game (e.g., *Spec Ops: The Line*). Use this to assess ethical risk, not commercial viability.

  **2. The Cultural Context Gap**
  RIR assumes a Western individualist view of "agency." In some cultural narratives, sacrifice or erasure carries different weight. The tool will misfire on folklore or myth-based arcs where destiny > agency.

  **3. The "Prop" Loophole**
  If a designer reduces Agency Signals (Q2) to 2 (e.g., no inventory, limited dialogue), the tool halts and kicks to Human Values. A designer could game the system by making characters "shallow" to justify killing them cheaply. You must manually police Q2 integrity.

  **4. The Trauma Variable**
  The tool assesses *betrayal*, not *sadness*. A beautifully written, consistent death (Green Light) can still traumatize a vulnerable player. This tool is not a content warning generator; it is a consistency checker.

  **Sign-off Instructions:**
  Attach this sheet to the Design Doc. If you mark **RED FLAG**, the Lead Designer must sign a waiver acknowledging the risk of player backlash regarding "Ludonarrative Dissonance." If **GREEN LIGHT**, proceed to implementation.

  **Time Elapsed:** 18 Minutes.
