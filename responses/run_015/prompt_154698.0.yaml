      *   **Task:** Create a reusable, 20-minute procedure (word-flowchart) to evaluate character arcs involving irreversible harm, deletion, or forced betrayal.
      *   **Core Concept:** "Recursive Identification Residue" (RIR) - moral weight comes from the structural invitation to treat agency as non-scripted/self-directed, accumulated over playtime.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "enough" answer.
          *   Halt points (No).
          *   Kick points (Human values vs. Facts).
          *   Known failure modes (where it misfires).
          *   Apply to three specific proposals (Memory Erase, Mandatory Sacrifice, Roguelike Family Deletion).
          *   Include one outcome the user might hate (honest assessment).
          *   Keep it practical (Lead Designer needs to sign off, no research budget, 4/week volume).

  2.  **Deconstruct the Core Concept (Recursive Identification Residue):**
      *   It's not about suffering (pain != ethics).
      *   It's about *perceived agency*.
      *   It's about *structural invitation* (does the game system tell you they are real/autonomous?).
      *   It's *accumulated* (time + interaction depth).
      *   *Translation for a Flowchart:* I need to turn "philosophical vibe" into "checkable design features."

  3.  **Drafting the Flowchart (The "RIR Audit"):**
      *   *Goal:* Fast, binary-ish decisions, but acknowledging subjectivity.
      *   *Step 1: The Mechanic.* What actually happens? (Deletion, Betrayal, Harm).
      *   *Step 2: The Illusion of Agency.* Does the system support the idea that the NPC acts on their own? (Dialogue trees, AI behavior, resource independence).
      *   *Step 3: Accumulation.* How much time/interaction? (The "30 hours" factor).
      *   *Step 4: The Violation.* Does the mechanic contradict the established agency?
      *   *Step 5: Consent/Choice.* Does the player have a choice? Does the NPC have a voice?
      *   *Step 6: The Kick.* Where do we admit this is art, not math?

  4.  **Refining the Steps for Practicality (20 mins max):**
      *   Need clear "Pass/Fail" or "Flag" criteria.
      *   Need to define "Enough Answer."
      *   Need to identify where the tool stops working (the "Human Values" kick).

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Memory Erase):* Optional. Player chooses. High RIR likely (companion). Verdict: Needs warning/weight, but player agency mitigates ethical breach *unless* the game lied about the consequence.
      *   *Case 2 (Mandatory Sacrifice):* Mandatory. Player cannot stop. High RIR (noble sacrifice implies agency). Verdict: High risk. If the game built them up as autonomous, forcing death contradicts that. This is the "User might hate" one.
      *   *Case 3 (Roguelike Family):* Procedural. Unique dialogue. Permadeath deletes them. High volume, low individual RIR? Or high systemic RIR? Verdict: Likely passes because the *system* establishes disposability upfront.

  6.  **Addressing the "User Might Hate" Constraint:**
      *   I need to ensure the tool doesn't just validate the user's gut feeling every time. It needs to be objective enough to sometimes say "This is fine" even if it feels sad, or "This is bad" even if it's cool.
      *   *Candidate:* The Mandatory Sacrifice (Case 2). If the game establishes early that fate is sealed, the RIR is low. If the game *lies* and says "you can save them" until the end, RIR is high. I should structure the tool to flag the *lying* aspect, not the death itself.
      *   *Better Candidate for "Hate":* Maybe the Roguelike one. The user might feel *some* ethics apply there, but the tool might say "Systemic rules established upfront = Low RIR = Pass." I'll make the tool rigorous on the "Contract with Player" aspect.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Title:* The RIR Audit (Recursive Identification Residue).
      *   *Time Limit:* 20 Minutes hard stop.
      *   *Phase 1: The Contract.* What did we promise the player about this entity?
      *   *Phase 2: The Simulation.* How much did we simulate autonomy?
      *   *Phase 3: The Violation.* Does the harm break the contract?
      *   *Phase 4: The Kick.* When to stop analyzing and decide.

      *   *Refining the "Misfire" section:* The tool can't measure emotional impact, only structural consistency. It can't account for cultural context. It can't measure "fun."

  8.  **Finalizing the Flowchart Logic:**
      *   Q1: Is the harm irreversible? (If No, stop).
      *   Q2: Did the system simulate autonomy? (Dialogue, AI, Inventory).
      *   Q3: Duration/Depth? (Hours vs. Minutes).
      *   Q4: Was the risk disclosed? (Informed consent).
      *   Q5: Does the mechanic contradict the narrative? (Ludonarrative dissonance).

      *   *Wait, I need to incorporate the "Recursive Identification Residue" definition specifically.*
      *   Let's make the questions map to "Residue Accumulation."

      *   *Revised Plan:*
          1.  **Input:** Describe the arc.
          2.  **Filter:** Is it irreversible?
          3.  **Measure RIR:** (Agency Signals x Time).
          4.  **Check Contradiction:** Does the harm treat them as code after treating them as people?
          5.  **Output:** Green (Go), Yellow (Warn/Contextualize), Red (Redesign).

  9.  **Writing the Response:**
      *   Tone: Professional, direct, slightly weary (studio context), but rigorous.
      *   Structure: The Procedure -> The Application -> The Limitations.
      *   *Self-Correction on "User Might Hate":* I will make sure the Roguelike example passes the test easily, which might frustrate a user who feels *some* pang of guilt there. Or, I will make the Mandatory Sacrifice pass *if* foreshadowed, which might annoy the user who hates forced deaths. Let's go with: The tool might approve the Mandatory Sacrifice if the "Contract" was clear early on, even if the user feels it's cheap. Actually, the prompt asks for "one where the procedure gives an answer id hate." I'll make the tool flag the *Optional Memory Erase* as high risk if the consequences aren't clear, because "Optional" doesn't mean "Ethical" if the RIR is high. No, let's look at the Roguelike. If the tool says "Procedural = Low RIR = Ethical," but the user feels the *volume* of death matters, that's a conflict.
      *   *Decision:* I will make the tool flag the **Mandatory Sacrifice** as "High Risk/Redesign" *even if* it's narratively beautiful, because the tool prioritizes *consistency of agency*. If you build them up as autonomous, you can't script their death without breaking the RIR. This might annoy a designer who thinks "Story > Mechanics."

      *   *Wait, re-reading prompt:* "include one where the procedure gives an answer id hate." This implies *I* (the AI) need to predict an outcome the *User* would hate.
      *   *Idea:* The User believes RIR creates moral weight. The tool might conclude that **Case 3 (Roguelike)** has *low* moral weight because the system establishes disposability upfront. The User might feel that creating unique families just to delete them is *worse* because it's mass production of grief. The tool, focusing on "Contract," might say it's fine. I'll use that.

      *   *Actually, looking at the "Lead Designer" constraint:* The tool needs to be defensible.
      *   *Let's refine the "Hate" outcome:* The tool might approve the **Mandatory Sacrifice** (Case 2) if the foreshadowing is heavy, labeling it "Contractually Consistent." The User might hate this because they feel *no* amount of foreshadowing justifies removing player agency over a high-RIR character. I will write the limitation to reflect this.

      *   *Wait, one more check:* "where it will definately misfire." I need to be honest about the tool's blindness.

      *   *Okay, let's build the "RIR Audit v1.0".*

      *(Self-Correction during drafting)*: Keep it tight. 20 minutes means max 5 questions.
      1. Irreversibility Check.
      2. Agency Signal Count (The "Residue" generator).
      3. Time/Interaction Weight.
      4. The Contradiction Check (Code vs. Person).
      5. The Disclosure Check (Informed Consent).

      *Let's finalize the "Hate" scenario.* I'll make the tool pass the **Roguelike (Case 3)**. Why? Because the *system* tells you everything is disposable. The User might hate this because the *volume* of unique content generated to be destroyed feels wasteful/cruel, but the tool only measures *per-character* agency contracts. This highlights the tool's limitation regarding scale.

      *Wait, better "Hate" scenario:* The tool flags the **Optional Memory Erase (Case 1)** as **RED/STOP**. Why? Because high RIR + Irreversible Harm + Optional = Player bears the burden of the ethical violation. The User might want to defend it as "Player Choice is King." The tool says "High RIR makes this a moral burden, not just a mechanic." This aligns with the User's fight with the roommate, but might be hard to sell to a designer who wants "edgy choices."
      *Actually, the prompt says "include one where the procedure gives an answer id hate".* I should pick the one that contradicts the User's intuition or desire. Let's go with the **Mandatory Sacrifice**. If the tool says "Green Light" because the narrative foreshadowing was clear, but the User feels forced linear stories are inherently unethical with high RIR characters...
      *No, let's stick to the prompt's core:* The User believes RIR creates weight. The tool should reflect that.
