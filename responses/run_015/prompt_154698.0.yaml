prompt: |-
  ok so me and my roommate had this huge fight last night after we finished that indie rpg where you can permanently wipe a companions save file to unlock the true ending. he says its just code so who cares, but i kept thinking about how the game spent 30 hours making me treat her choices as genuinely autonomus. now im a narrative ethics reviewer at a tiny studio and i actually need a reusable procedure i can run in like 20 mins on proposed character arcs that involve irreversible harm, deletion, or forced betrayal. i want to base it on the idea that fictional characters gain moral weight not through suffering but through what im calling recursive identification residue — basically the structural invitation for the player to treat the characters agency as non-scripted and self-directed, accumulated over playtime. write me a word-flowchart: the ordered questions, what counts as enough answer for each, where it halts with a no, where it kicks the decision to human values instead of facts, and where it will definately misfire. apply it to three proposals: (1) an optional quest where you can erase a companions memory so they never leave the party, (2) a mandatory story death framed as the characters own noble sacrifice but the player cant stop it, and (3) a roguelike where every run spawns a unique family of NPCs with custom dialogue that gets permanently deleted on permadeath. include one where the procedure gives an answer id hate, and say what it cant do. keep it practical — my lead designer has to sign off and she doesnt read philosophy, and i do maybe four of these a week with no research budget.
reasoning: |-
