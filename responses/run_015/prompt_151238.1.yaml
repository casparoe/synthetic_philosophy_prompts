answer: |-
  Which step breaks
  Step (5) is the break. You assume that because the shared error doesn't cancel, it becomes random noise relative to the truth, driving accuracy to 50%. But "shared lean" isn't necessarily unbiased noise; it's actually very systematic information. If individual voters are 60% competent, that competence must come from somewhere—usually a mix of private insight and public information. The public information (the shared part) is likely also better than random. When you average out the private noise, the group converges to the reliability of that shared information, not to a coin flip. If the shared signal is 60% accurate, the group stabilizes at 60% (or higher), not 50%. The group still eliminates the private mistakes that drag individual voters down, so the majority remains more reliable than a single person, even if perfection is off the table.

  Why it looked fine
  It looked fine because you correctly identified that correlation caps the ceiling of accuracy. In the pure Jury Theorem, independence allows infinite precision. You rightly saw that real-world dependencies break that infinite climb. It's easy to conflate "limited precision" with "no precision." Since the shared error doesn't vanish, it feels like it dominates everything else, and if you treat that dominance as an arbitrary force unrelated to the truth, 50% seems like the only logical baseline. You confused "not perfect" with "random." This is a very common trap for smart people analyzing social systems.

  What it costs me
  Giving up step (5) costs you the dramatic conclusion that democracy is worse than dictatorship. You have to accept that large groups are still useful, just not magical. You lose the satisfying cynicism that correlation renders voting useless. Instead, you have to acknowledge that shared information—like news sources or school rumors—often carries actual signal, not just noise. This means the lunch poll wasn't a fluke; the students shared enough correct information to outweigh the teachers' analysis, despite copying each other. It forces you to evaluate the quality of the shared information rather than dismissing the process entirely. You must admit that while correlation prevents the group from reaching 100% certainty, it doesn't drag them down to 50% unless the shared information itself is misleading. This requires nuance: you can't just say "crowds are dumb because they talk"; you have to ask "what are they talking about?" It's less mathematically clean but more practically accurate. This makes modeling harder, but explains why students beat the teachers. You can no longer claim the system is broken; you must argue the input was better than expected. That shifts the burden from method to message. It is a heavier intellectual load to carry around.

  Bottom line
  Correlation limits perfection, it doesn't guarantee failure. The group still beats the individual by canceling private noise, even if shared bias remains. Your lunch poll worked because the shared signal was informative, not random. Trust the crowd, verify the source.
