  ## Game Design: "The Cargo Protocol"

  **Objective:** Make the group experience *conversational implicature* (inference from utterance choice) without naming it, specifically targeting the "menu effect," unintended inference, and failed denial.

  **Materials:**
  *   **State Cards (Speaker):** 3 types, distinct backs. (Type Alpha, Type Beta, Type Gamma).
  *   **Message Cards (Speaker Hand):** 3 types. ("Standard Transit", "Handle With Care", "Hazmat Protocol").
  *   **Action Cards (Hearer):** 3 types. ("Stock Shelf", "Padding Required", "Isolate & Suit").
  *   **Score Sheet:** Whiteboard.
  *   **Timer:** Phone.

  **The Logic Matrix (Hidden from Players initially):**
  *   **Type Alpha (Standard):** Only compatible with Message *"Standard Transit"*.
  *   **Type Beta (Sensitive):** Compatible with *"Handle With Care"*. (Cannot use "Hazmat", cannot use "Standard").
  *   **Type Gamma (Dangerous):** Compatible with *"Handle With Care"* **OR** *"Hazmat Protocol"*.
  *   **Optimal Actions:** Alpha→Stock, Beta→Padding, Gamma→Isolate.
  *   **Payoff:** 1 point for Correct Action. 0 for Wrong. (Team score).

  **Why this works:**
  *   **Alpha** is a control (literal meaning only).
  *   **Beta** forces the inference: If the Hearer hears *"Handle With Care"*, they must infer **Beta**. Why? Because if it were **Gamma**, a cooperative Speaker would have chosen the more specific *"Hazmat Protocol"*. The meaning comes from the *unused* card.
  *   **Gamma** allows the failure cases: The Speaker *could* say *"Handle With Care"* (technically true), but if they do, the Hearer will treat it as Beta.

  ### The Arc (90 Minutes)

  **1. Setup & Rules (10 mins)**
  *   Divide into 8 pairs.
  *   **Rule 1:** Speaker sees State Card. Hearer sees nothing.
  *   **Rule 2:** Speaker selects **one** Message Card from their hand. Hand is face-up on the table so Hearer sees *available options*. (Crucial: The Hearer must see the menu).
  *   **Rule 3:** No talking. No eye contact signaling.
  *   **Rule 4:** Hearer selects Action Card. Reveal. Score.
  *   **Payoff:** "Bragging Rights." The pair with the highest score after Round 3 chooses the snack/topic for next month.

  **2. Round 1: Calibration (15 mins)**
  *   **Distribution:** 4 Alpha, 4 Beta, 0 Gamma.
  *   **Goal:** Establish trust and basic literal mapping.
  *   **Expected Outcome:** Pairs quickly map Standard→Stock, Care→Padding.
  *   **Facilitator Note:** Ensure they see the *Menu*. If a Speaker has Alpha, they only have "Standard" in hand (remove others for this round). If Beta, only "Care".
  *   **Debrief Check:** "Did anyone get confused?" (Should be no).

  **3. Round 2: The Menu Trap (25 mins)**
  *   **Distribution:** 2 Alpha, 3 Beta, 3 Gamma.
  *   **Change:** All Speakers now hold **all three Message Cards**. They must choose one that is *technically permissible* for their State.
  *   **The Trap:** Gamma Speakers can legally play "Handle With Care".
  *   **Expected Outcome:**
      *   Smart Gamma Speakers play "Hazmat". Hearer Isolates. (Success).
      *   Lazy/Anxious Gamma Speakers play "Handle With Care" (thinking it's safer/softer). Hearer Infers Beta → Pads. (Failure: Gamma treated as Beta).
      *   Beta Speakers play "Handle With Care". Hearer Infers Beta. (Success).
  *   **The Feeling:** Hearer feels frustrated when Gamma plays "Care". "Why didn't you say Hazmat?" Speaker feels frustrated: "I *did* say Care! It's true!"
  *   **Failure Case 1 Achieved:** Hearer draws licensed inference (It's Beta), Speaker didn't intend it (It's Gamma), fault is unclear (Speaker was imprecise, Hearer was logical).

  **4. Round 3: The Denial (25 mins)**
  *   **Distribution:** Heavy Gamma (5 Gamma, 3 Beta).
  *   **New Rule:** Speaker may add a **"Clarification Token"** (a blank index card they write on) *after* playing the Message, but *before* Hearer acts.
  *   **Scenario:** Force a Gamma Speaker to play "Handle With Care" (restrict their hand secretly, or instruct them: "You must play Care this round").
  *   **Action:** Speaker plays "Handle With Care". Hearer starts to pick "Padding". Speaker writes on blank card: *"NOT Beta."*
  *   **Expected Outcome:** Hearer hesitates. Most will still pick "Padding" or "Isolate" based on suspicion. The denial often makes it worse ("If it's not Beta, and you said Care... it must be Gamma trying to hide").
  *   **Failure Case 2 Achieved:** Explicit denial fails to override the pragmatic inference.

  **5. Debrief (15 mins)**
  *   (See below).

  ---

  ## Debrief Plan

  **Goal:** Map the felt frustration to the theoretical distinctions without lecturing.

  **1. The "Unused Card" Distinction (5 mins)**
  *   **Moment:** Round 2, when a Hearer got a "Handle With Care" card and guessed Beta, but it was Gamma.
  *   **Ask:** "Speaker, you had the Hazmat card. Why didn't you play it?" (Answer: "I thought Care was enough.")
  *   **Ask:** "Hearer, why did you guess Beta?" (Answer: "Because if it was Gamma, they would have played Hazmat.")
  *   **The Name:** Introduce **"Implicature"**.
  *   **The Point:** "You didn't infer from what was *said*. You inferred from what was *not said* despite being available. The meaning was in the *choice*, not the *content*."

  **2. The "Faultless Failure" Distinction (5 mins)**
  *   **Moment:** The Gamma Speaker who played "Care" thinking it was safe.
  *   **Ask:** "Who was wrong?"
  *   **The Name:** Introduce **"Normative Expectations"** (or "The Cooperative Principle" if you must, but keep it simple: "Shared Rules").
  *   **The Point:** "The Speaker was literally truthful. The Hearer was logically sound. They still failed. Communication isn't just truth-conditions; it's adherence to a shared protocol of specificity. When the protocol is ambiguous, 'truth' isn't enough."

  **3. The "Failed Denial" Distinction (5 mins)**
  *   **Moment:** Round 3, the written denial.
  *   **Ask:** "Did the note help?" (Usually no).
  *   **The Point:** "Once the inference is triggered by the choice, a denial looks like part of the game. It becomes more evidence. 'I am Gamma but I am telling you I am not Beta' sounds like 'I am Gamma and I know you know Gamma is bad.'"
  *   **The Name:** **"Self-Sealing Inference"**.

  **Predictable Failures & Pre-emption:**
  1.  **Code-Breaking:** Pairs might try to whisper or agree on a private code in Round 1.
      *   *Pre-emption:* Enforce "No Talking" strictly. Collect Message cards between rounds so they can't memorize hands.
  2.  **Logic-Over-Pragmatics:** Programmers might treat the Menu as a boolean truth table (If Gamma, Care=True).
      *   *Pre-emption:* In Round 2 debrief, explicitly highlight the *cost* of the Hazmat card. "Was Hazmat 'true'? Yes. Was it 'better'? Yes. Why leave it on the table?"
  3.  **Time Drift:** 90 minutes is tight.
      *   *Pre-emption:* Hard stop Round 2 at 25 mins even if mid-round. The friction is more valuable than the score.

  **What the Game Cannot Produce (The Limitation):**
  You are right. The game scores *coordination success*, not *mutual recognition*.
  *   **The Missing Feature:** **Reflexive Intentionality.** (Grice's "I intend that you recognize my intention").
  *   **Why it's missing:** In the game, if the Hearer guesses Gamma because "Hazmat is usually played," they get the point. They don't need to realize *that the Speaker intended them to realize it*. They can just treat it as a statistical correlation (Bayesian evidence) rather than a communicative act.
  *   **What you must state:** "In this game, you could win by treating your partner like a slot machine—learning which lever pays out. Real communication requires knowing that your partner *wants* you to know. That layer—the 'I know that you know that I want you to know'—is what turns inference into meaning. This game simulates the *structure* of that, but you can cheat it by just doing pattern matching. In the real world, pattern matching breaks when the stakes change."

  ---

  ## Divergent Interests Analysis

  If you change the payoff so the Speaker gets points for "Low Cost Handling" (Stock > Padding > Isolate) while the Hearer gets points for "Safety" (Isolate > Padding > Stock):

  1.  **Disappearance of "Handle With Care":** The phrase *"Handle With Care"* would cease to convey information. It would become "Cheap Talk."
      *   Gamma Speakers would *always* play "Care" to avoid the cost of "Hazmat" (or the Hearer's Isolate reaction).
      *   Beta Speakers would also play "Care".
      *   **Result:** The Hearer learns that "Care" means "Beta OR Gamma". The distinction collapses. This is a **Pooling Equilibrium**.

  2.  **Appearance of Costly Signaling:** To distinguish themselves, Beta Speakers would need to do something *costly* that Gamma Speakers wouldn't do.
      *   *Example:* If there was a rule "If you play Hazmat, Speaker loses 1 point," Gamma Speakers would avoid it even more.
      *   *Counter-Signal:* If there was a rule "If you play Care, you must submit to a random audit," Beta might accept the audit, Gamma might not.

  3.  **Shift in Analogy:**
      *   **Cooperative:** Shows how we *build* shared meaning efficiently. (The "Gricean" ideal).
      *   **Divergent:** Shows how meaning *erodes* into suspicion and requires **verification costs**.
      *   **Does it break the analogy?** It doesn't break the *mechanism* of inference from choice, but it changes the *stability* of the inference. In the cooperative game, the inference is stable because interests align. In the divergent game, the inference is unstable because the Speaker has an incentive to manipulate the Menu.
      *   **Lesson for the Group:** "When interests align, implicature is a shortcut. When interests diverge, implicature is a battlefield. You cannot rely on 'what they didn't say' if they benefit from hiding it."

  This structure keeps the "rationalist" flavor (game theory, equilibria, signaling) while forcing the linguistic insight through mechanics rather than definitions.
