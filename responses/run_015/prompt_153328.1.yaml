answer: |-
  # Session Plan: The Separateness of Persons as a Structural Objection

  ## 1. The Explanatory Arc

  **Step 1: Validate the Optimization Intuition (5 mins)**
  Start by acknowledging their instinct. To a CS mind, Classic Utilitarianism looks like a standard global loss minimization problem: minimize $\sum L_i(x)$ subject to budget constraints. Acknowledge that this is a powerful, coherent system. Do not start by attacking it; start by formalizing it. This builds trust and ensures everyone is modeling the same objective function.

  **Step 2: The Carrying Example — The Palliative Budget (10 mins)**
  Introduce the scenario: You manage a fixed budget for pain relief.
  *   **Patient A:** Terminal, experiencing agony (Suffering Score: 100).
  *   **Patients B–Z (150 people):** Chronic but mild discomfort (Suffering Score: 1 each).
  *   **The Constraint:** The budget can either fully treat Patient A *or* fully treat Patients B–Z.
  *   **The Utilitarian Calc:** Treat B–Z. Total suffering reduced: 150 vs. 100. The math is linear and clean.
  *   **The Intuition:** Most people feel a hesitation here that isn't just about "efficiency." Ask them to articulate *why* it feels off without using the word "rights."

  **Step 3: The "Constraint" Trap (10 mins)**
  CS students will immediately propose fixes: "Add a fairness constraint," "Cap individual loss," or "Add a regularization term for inequality."
  *   **Action:** Write these on the board as modified objective functions.
  *   **The Pivot:** Point out that these are *ad-hoc patches*. They change the output but don't explain *why* the original function was category-erroring. If the only problem was the output, a constraint solves it. But if the problem is the *structure of aggregation*, a constraint is just hiding the bug. This is where you transition from "engineering fix" to "philosophical critique."

  **Step 4: The Structural Objection — Separateness of Persons (15 mins)**
  Introduce the core concept: Utilitarianism assumes society is a single "super-person" experiencing the sum of utilities.
  *   **The Argument:** It is rational for one person to suffer now for a greater benefit later (intrapersonal aggregation). It is structurally different for Person A to suffer for Person B's benefit (interpersonal aggregation).
  *   **The CS Analogy:** Intrapersonal aggregation is like summing loss across epochs for a single model training run. Interpersonal aggregation is like summing loss across entirely different, isolated models and claiming you've minimized *one* model's error. The "domain" of the function is wrong. There is no single entity experiencing the "150 units" of saved suffering. There are 150 entities experiencing 1 unit each.
  *   **Key Takeaway:** The objection isn't that the sacrifice is too high; it's that the *sum* is a fiction.

  **Step 5: Defusing Misconceptions (10 mins)**
  Address the likely pushback here (see "Misconceptions" below). Specifically, hammer home that this isn't about "rights" (which are deontological constraints) but about the metaphysics of the group. Rights are the *result* of recognizing separateness, not the explanation for it.

  **Step 6: The Check Question (5 mins)**
  Pose the final question (detailed below) to verify they understand the structural nature of the objection.

  ## 2. Carrying Example Specifications

  **What the Example Needs:**
  *   **Fixed Resources:** Zero-sum allocation to force a trade-off.
  *   **Linear Math:** The utilitarian calculation must be indisputable (150 > 100) so the objection can't be about math errors.
  *   **Distinct Identities:** Patients must be distinct individuals, not interchangeable units.
  *   **Passive Allocation:** It must be about *withholding aid*, not active killing, to avoid triggering "do no harm" deontological reflexes that distract from the aggregation critique.

  **What the Example Avoids:**
  *   **Death/Killing:** Avoid organ harvesting or euthanasia. This triggers heavy legal/moral baggage unrelated to aggregation.
  *   **Future Generations:** Keep it synchronous (all patients exist now) to avoid discounting rate debates.
  *   **Desert/Merit:** Do not make one patient "deserving" and the other "undeserving." The objection must hold even if everyone is equally innocent.

  ## 3. Misconceptions & Defusal Strategy

  | Misconception | When to Head Off | Strategy |
  | :--- | :--- | :--- |
  | **"It's just about Individual Rights."** | Step 3 (The Constraint Trap) | Explain that rights are *constraints* added to the function. Separateness argues the *objective function itself* is ill-defined. Rights are the symptom, not the cause. |
  | **"Just add a Regularization Term."** | Step 3 (The Constraint Trap) | Acknowledge this works for engineering, but philosophically it's unprincipled. *Why* that term? Separateness provides the foundational reason for the term. |
  | **"It's just emotional discomfort."** | Step 4 (Structural Objection) | Reframe the discomfort as a recognition of a category error. It's not "feelings"; it's recognizing that "society" isn't a valid variable type for experience. |
  | **"This is just Egalitarianism."** | Step 5 (Defusing) | Egalitarianism cares about the *distribution* of the sum. Separateness questions the *existence* of the sum. You can have separate persons without demanding equal outcomes. |

  ## 4. The Check Question

  **"If we could guarantee that Patient A consented to being untreated, would the 'Separateness of Persons' objection disappear?"**

  *   **Correct Understanding:** No. The objection is about the structure of aggregation (summing across distinct beings), not about consent or autonomy. Even with consent, treating the group as a single utility container remains a category error.
  *   **Incorrect Understanding:** Yes. (This implies they think the objection is about rights/autonomy, not aggregation).

  ## 5. Omissions

  | Topic | Reason Skipped |
  | :--- | :--- |
  | **Rawlsian Contractarianism** | Too much focus on the "Veil of Ignorance" procedure distracts from the core metaphysical claim about persons. |
  | **Nozick's Experience Machine** | This attacks hedonism (what is good), not utilitarianism's aggregation method (how we sum good). |
  | **Rule Utilitarianism** | This is a defensive maneuver for utilitarians. Discussing it shifts the session to "how to save utilitarianism" rather than "understanding the objection." |

  ## 6. Framing Note for CS Audience

  Speak in terms of **scope** and **domain**. When a utilitarian sums utility across people, they are treating the set of people as a single variable scope. The Separateness of Persons objection is essentially a **namespace collision** error. You cannot access `Person_B.suffering` as if it were `Person_A.suffering` just because they are in the same `Society` class. The "bug" isn't in the optimization algorithm; it's in the data structure definition of the agent.

