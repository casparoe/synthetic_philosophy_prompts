  *   **No** → **Leaf 16**

  ---

  ## Leaf Index: Positions and Diagnoses

  ### Occupied Leaves (Named Positions)

  **Leaf 2 (Yes A, Yes B, Yes C, No D): Victim-Centered Retributive Contractualism**
  *   **Position:** Rarely surveyed view.
  *   **Description:** Accepts that wrongness justifies suffering and authority comes from consent, but rejects offense gravity for severity. Instead, severity is calibrated strictly to the benchmark of restoring the specific victim.

  **Leaf 3 (Yes A, Yes B, No C, Yes D): Pure Retributivism**
  *   **Position:** Pure Retributivism.
  *   **Description:** Punishment is a moral duty owed for the wrong itself. Authority stems from the state's moral entitlement to right the wrong. Severity matches the intrinsic gravity of the offense, regardless of social cost or benefit.

  **Leaf 5 (Yes A, No B, Yes C, Yes D): Contractualist Hybrid**
  *   **Position:** Contractualist Hybrid.
  *   **Description:** Wrongness creates a debt (A), but punishment must also serve social stability (No B). Authority derives from the offender's civic participation/consent. Severity matches the gravity of the breach of contract.

  **Leaf 15 (No A, No B, No C, Yes D): Limiting Retributivism**
  *   **Position:** Limiting Retributivism (Desert as Ceiling/Floor).
  *   **Description:** Wrongness alone is insufficient (A); social utility is required (No B). Authority is state entitlement (No C). However, intrinsic gravity sets the permissible range (ceilings/floors) within which utility determines the exact sentence.

  **Leaf 16 (No A, No B, No C, No D): Pure Consequentialism / Restorative Justice**
  *   **Position:** Pure Consequentialism **AND** Restorative Justice.
  *   **Description:**
      *   *Pure Consequentialism:* Wrongness justifies nothing (No A); only social benefit matters (No B, No D). Authority is based on welfare necessity (No C). Severity tracks social harm/benefit.
      *   *Restorative Justice:* Denies punitive authority entirely (No A, No B, No C). Severity is determined by victim-centered harm and repair needs (No D).
  *   **Note:** These two distinct positions overlap here because the tree's binary Node 4 groups "Social Benefit" and "Victim Harm" together under "Not Gravity."

  ### Unoccupied Leaves (Unnamed Diagnoses)

  **Leaf 1 (Yes A, Yes B, Yes C, Yes D): Unnamed**
  *   **Diagnosis:** Unexplored; combines consent-based authority with hard retributive outcomes without a clear theoretical motive for the consent requirement.

  **Leaf 4 (Yes A, No B, Yes C, No D): Unnamed**
  *   **Diagnosis:** Unattractive; claims consent justifies punishment but rejects both offense gravity and victim restoration as metrics for severity.

  **Leaf 6 (Yes A, No B, No C, Yes D): Unnamed**
  *   **Diagnosis:** Incoherent; asserts wrongness is sufficient for punishment (A) but simultaneously requires positive social outcomes (No B).

  **Leaf 7 (Yes A, No B, No C, No D): Unnamed**
  *   **Diagnosis:** Incoherent; claims wrongness justifies suffering but rejects gravity, social benefit, and victim harm as metrics for severity.

  **Leaf 8 (Yes A, Yes B, No C, No D): Unnamed**
  *   **Diagnosis:** Incoherent; asserts wrongness alone justifies punishment but rejects the intrinsic gravity of that wrongness as the measure for severity.

  **Leaf 9 (No A, Yes B, Yes C, Yes D): Unnamed**
  *   **Diagnosis:** Unattractive; denies wrongness is sufficient reason yet permits punishment even when it harms society, based on consent.

  **Leaf 10 (No A, Yes B, Yes C, No D): Unnamed**
  *   **Diagnosis:** Incoherent; permits punishment with negative outcomes but offers no metric (gravity, social, or victim) to determine severity.

  **Leaf 11 (No A, Yes B, No C, Yes D): Unnamed**
  *   **Diagnosis:** Unattractive; allows punishment despite negative social outcomes without the justification of inherent moral wrongness.

  **Leaf 12 (No A, Yes B, No C, No D): Unnamed**
  *   **Diagnosis:** Incoherent; permits punishment with negative outcomes but rejects all standard metrics for determining severity.

  **Leaf 13 (No A, No B, Yes C, Yes D): Unnamed**
  *   **Diagnosis:** Unexplored; a consent-based utilitarian view that oddly retains offense gravity as the severity metric.

  **Leaf 14 (No A, No B, Yes C, No D): Unnamed**
  *   **Diagnosis:** Unexplored; a consent-based utilitarian view focused on victim harm rather than social benefit or offense gravity.

