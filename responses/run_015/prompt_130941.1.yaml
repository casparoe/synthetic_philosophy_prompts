  # Sentencing Review Panel: Conceptual Taxonomy of Punishment

  This instrument maps the logical landscape of criminal punishment theories. It is structured as a decision tree based on four diagnostic claims. Follow the path of agreement (Yes) or disagreement (No) with each claim to locate a specific position at the leaf nodes.

  ## The Decision Tree

  **Node 1 (Claim A):** Does the moral wrongness of an act alone, independent of all future effects, provide sufficient reason to inflict suffering?
  *   **Yes** → Go to Node 2
  *   **No** → Go to Node 9

  **Node 2 (Claim B):** Does punishment remain permissible or required even if it produces zero or negative net social outcomes?
  *   **Yes** → Go to Node 3
  *   **No** → Go to Node 5

  **Node 3 (Claim C):** Does the state's authority to punish derive from an implicit consent or civic participation by the offender, rather than from a direct moral entitlement to respond to wrongdoing?
  *   **Yes** → Go to Node 4
  *   **No** → Go to Node 7

  **Node 4 (Claim D):** Is the appropriate severity set by the intrinsic gravity of the offense?
  *   **Yes** → **Leaf 1**
  *   **No** → **Leaf 2** (Severity set by victim-restoration benchmarks)

  **Node 5 (Claim C):** Does the state's authority to punish derive from an implicit consent or civic participation by the offender, rather than from a direct moral entitlement to respond to wrongdoing?
