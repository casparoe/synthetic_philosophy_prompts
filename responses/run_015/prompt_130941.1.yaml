  ## Overlap Flag

  **Pair:** Pure Consequentialism and Restorative Justice (Leaf 16).
  **Reason for Overlap:** The tree cannot cleanly separate these positions because both reject the intrinsic gravity of the offense as the primary metric for severity (Node 4 = No). While Consequentialism prioritizes *social* benefit and Restorative Justice prioritizes *victim* restoration, the binary structure of Node 4 groups these non-gravity metrics together. Panelists must distinguish these views by asking whether the intended benefit is societal safety (Consequentialism) or specific victim repair (Restorative).
