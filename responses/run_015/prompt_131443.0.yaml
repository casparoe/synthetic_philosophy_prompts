answer: |-
  You have hit on one of the most famous and persistent problems in the philosophy of probability and statistics. You are absolutely right that this is a recognized pattern, and there is a specific vocabulary for it.

  Here is the breakdown of the names, the concepts, and the distinction between the statistical and rhetorical versions.

  ### 1. The Official Name: The Reference Class Problem
  The overarching philosophical dilemma you are describing is called **The Reference Class Problem**.

  It was famously formulated by the philosopher Hans Reichenbach in the 1940s. He stated that to assign a probability to a single event (like *you* getting sick), you must place that event into a class (a reference group). But any single event belongs to infinite different classes (students, sleep-deprived students, students in your dorm, students with your DNA, etc.), and each class yields a different probability.

  The specific **move** you are describing—adding conditions to narrow the group—is technically called **Narrowing the Reference Class** (or sometimes **Stratification**).

  ### 2. The Statistical Version: "Maximal Specificity" vs. "Stability"
  In your philosophy of science class, this is often discussed under the work of **Wesley Salmon**. He argued that we should aim for the **Maximally Specific Reference Class**.

  *   **The Goal:** You want to include all *relevant* information (sleep, ventilation, genetics) to make the prediction as accurate as possible.
  *   **The Limit:** As you noticed, if you narrow the class too much, the sample size becomes too small. If the class is just "you," the statistics vanish (you either get sick or you don't; there is no frequency).
  *   **The Tension:** This is a trade-off between **Specificity** (relevance) and **Stability** (sample size/reliability).
  *   **Modern Analogy:** In Machine Learning and Statistics, this is called **Overfitting**. If you create a model with too many variables (conditions), it fits the past data perfectly but fails to predict new data because it has captured noise rather than signal.

  ### 3. The Rhetorical Version: "Reference Class Gerrymandering"
  The argument with your roommate is different. While it uses the same logical structure, it is usually considered fallacious.

  *   **The Move:** Your roommate is engaging in **Reference Class Gerrymandering**. He is manipulating the boundaries of the group until he gets the result he wants.
  *   **The Fallacy:** This is a form of **Special Pleading** or **Moving the Goalposts**. By adding conditions ad hoc (after you refute the previous ones), he ensures the prediction is unfalsifiable or biased toward his conclusion.
  *   **Why it's different:** In the statistical version, you narrow the class to find the *truth* (the most accurate probability). In the rhetorical version, you narrow the class to *win the argument* (often ignoring that the sample size is now too small to be statistically meaningful).

  ### 4. Are they the same concept?
  **Logically, yes; Pragmatically, no.**

  *   **Same Logic:** Both rely on **Conditional Probability** ($P(A|B)$). You are updating the probability of an event ($A$) based on new evidence/conditions ($B, C, D...$).
  *   **Different Intent:**
      *   **Scientific/Statistical:** The narrowing stops when adding more conditions no longer significantly changes the probability or when the sample size becomes too small to be reliable. It seeks **predictive power**.
      *   **Rhetorical:** The narrowing continues until the class describes only the target individual. It seeks **persuasive advantage**.

  ### 5. What should you call it?
  If you need a term for a paper or class discussion, here is the hierarchy:

  1.  **The Academic Term:** "Narrowing the Reference Class" (within the context of the **Reference Class Problem**).
  2.  **The Critical Term:** "Reference Class Gerrymandering" (if you are critiquing the roommate's bad faith argument).
  3.  **The Descriptive Term:** "The Specificity Spiral." (This isn't a standard term, but it perfectly describes the feeling of spinning down into smaller and smaller groups).
  4.  **The Statistical Term:** "Overfitting the Reference Class."

  **Recommendation for your class:**
  Use **The Reference Class Problem**. It is the canonical term in philosophy of science. You can then explain that the "sliding scale" you are seeing is the tension between **Reichenbach's frequency requirement** (need a big group) and **Salmon's maximal specificity requirement** (need a relevant group).

  If you want to sound particularly sharp, mention that your roommate is committing **Reference Class Gerrymandering** to create a **Singleton Class** (a class of one), which destroys the ability to make a statistical prediction at all.
