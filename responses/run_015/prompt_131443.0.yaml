  ok so i'm in this philosophy of science / stats class and there's this pattern i keep seeing and idk if it has a proper name. like you're trying to predict if something bad will happen to you — say getting sick during finals. you start with "30% of students get sick" then someone says "yeah but among people who sleep 4 hours it's 50%" then "among sleep-deprived people in my dorm with bad ventilation it's 70%" and each step feels more relevent but the group gets smaller and smaller. then there's the argument version: my roommate said "you'll probably miss the deadline because most people do," and when i said i never have before he said "ok but among people who wait till the last day," and then i said i started early so he said "well among people who started early but also have three other papers..." he just keeps stacking conditions untill the category is basically me alone. is there a name for this sliding-scale thing where you keep narrowing the class by adding conditions? i know there's a general problem about picking the right group for predictions, but i'm asking about this specific move — using it like a dial in debates — and whether the statistical version and the rhetorical version are the same concept or different ones. if there's no name, what should i call it?
