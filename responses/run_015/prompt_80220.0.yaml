answer: |-
  ### 1. Exam Question

  **Time Allowed:** 90 Minutes
  **Topic:** Frankfurt Cases, PAP, and the Flicker Strategy

  **Question:**

  (a) Explain the dialectical role of Eleonore Stump's "no-flicker" variant in the debate over the Principle of Alternative Possibilities (PAP). Specifically, clarify why the standard "flicker of freedom" defense claims Frankfurt's original case fails to refute a weak form of PAP, and detail how Stump's modification of the counterfactual intervener's trigger mechanism is designed to eliminate this flicker entirely.

  (b) Consider an "atomic decider": an agent whose decision-making process is binary and instantaneous, possessing no detectable intermediate stages, inclinations, or precursors prior to the final choice. Analyze how the existence of atomic deciders impacts the coherence of Stump's no-flicker construction. Does the atomic nature of the decision undermine the claim that Stump's case successfully refutes the weak form of PAP? Justify your conclusion.

  ***

  ### 2. Model Answer

  The Principle of Alternative Possibilities (PAP) asserts that moral responsibility requires the ability to do otherwise. Harry Frankfurt designed cases to refute this by describing agents who are responsible despite being unable to do otherwise due to a counterfactual intervener. However, the "flicker of freedom" strategy objects that Frankfurt's original cases fail to eliminate *all* alternative possibilities. Even if the agent cannot choose differently, they retain the alternative possibility of choosing *on their own* versus being forced. This residual alternative—a flicker—suggests that a weak form of PAP holds: responsibility requires at least some alternative possibility, even if not the full power to perform a different action.

  Eleonore Stump's "no-flicker" variant aims to close this loophole. In her construction, the counterfactual intervener does not wait for a sign of decision or a specific choice. Instead, the intervener monitors the agent for any prior indication or inclination toward the non-target action. If the agent shows even the slightest sign of wavering, the intervener intervenes immediately to ensure the target action occurs. By triggering on pre-decisional states rather than the decision itself, Stump argues the agent never possesses the power to initiate the alternative sequence. Consequently, there is no moment where the agent could have "signed on" voluntarily versus being forced; the alternative sequence is preempted before it begins. If successful, this refutes the weak form of PAP by demonstrating responsibility without even a flicker of freedom.

  However, the coherence of Stump's case depends heavily on the metaphysics of the agent's psychology. This becomes critical when analyzing the "atomic decider." By definition, an atomic decider has no intermediate stages or precursors; the decision arises instantaneously without prior inclinations. Stump's mechanism relies on detecting a "sign" or "inclination" to trigger intervention *before* the decision crystallizes. For an atomic decider, there is no such sign to detect prior to the decision itself.

  This creates a dilemma for the no-flicker construction. If the intervener waits for the decision to occur before intervening, she is too late; the decision has already been made autonomously, restoring the flicker (the alternative of deciding on one's own). If the intervener acts before the decision without a triggering sign, her intervention is either random or causally determinative of the decision itself. If she determines the decision, the agent is not responsible, defeating the purpose of the case. If she acts randomly, the case no longer mirrors the structured Frankfurt scenario. Therefore, Stump's mechanism presupposes a gradualist psychology where decisions have detectable precursors.

  Because Stump's case cannot function coherently against an atomic decider without collapsing into standard coercion or randomness, it fails as a universal counterexample to the weak form of PAP. It may refute weak PAP for agents with gradualist psychologies, but it cannot refute it for atomic deciders. Since the weak PAP claims responsibility *always* requires some alternative possibility, a single counter-instance (the atomic decider who retains a flicker because the intervener cannot preempt it) preserves the principle. Thus, the atomic decider objection undermines the claim that Stump's case universally severs the link between responsibility and alternative possibilities.

  ***

  ### 3. Marking Scheme (20 Points)

  **1. The Flicker Diagnosis (4 points)**
  *   **Requirement:** Must explain that the flicker strategy identifies a residual alternative (deciding on one's own vs. being forced) that preserves a weak PAP.
  *   **Common Error:** Students claim the flicker allows the agent to choose a *different action* rather than a different *mode of agency*.

  **2. Stump's Pre-emptive Trigger (4 points)**
  *   **Requirement:** Must detail that Stump moves the intervention trigger to prior inclinations/signs to eliminate the "own vs. forced" alternative.
  *   **Common Error:** Students describe Stump's intervener as simply "faster" rather than triggered by *prior states*.

  **3. The Atomic Constraint (4 points)**
  *   **Requirement:** Must apply the definition of the atomic decider (no precursors/inclinations) to the mechanics of the case.
  *   **Common Error:** Students ignore the "no precursors" clause and treat the atomic decider like a standard agent.

  **4. The Mechanism Failure (4 points)**
  *   **Requirement:** Must argue that without precursors, the intervener cannot trigger pre-emptively without causing the decision or acting too late.
  *   **Common Error:** Students assume the intervener can "just know" what the agent will do without a trigger signal.

  **5. The Weak PAP Implication (4 points)**
  *   **Requirement:** Must conclude that because the case fails for atomic deciders, it does not universally refute weak PAP.
  *   **Common Error:** Students conclude PAP is definitely false based solely on Stump's success with gradualists.

  Verdict: The top answer recognizes that Stump's mechanism presupposes a gradualist psychology that is incompatible with the metaphysics of an atomic decider.
