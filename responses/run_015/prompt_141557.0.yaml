prompt: |-
  You are a philosopher of science who works on formal models of fairness and has taught this material to mixed graduate audiences several times. Think carefully before you answer, and open with a short brainstorming paragraph: what are the two or three things my classmates should actually be able to do by minute fifty? I want a plan for teaching, not an explanation of the results, and no readings.

  I'm a master's student in an algorithmic fairness seminar, and I'm leading next week's fifty-minute discussion section for about fifteen classmates, half from computer science and half from public policy and law. They have all met the criteria — calibration (a given score carries the same implication about the outcome in each group), error-rate balance or equalized odds (equal false positive and false negative rates), predictive parity (equal positive predictive values) — and they know the headline that, absent equal base rates or a perfect predictor, these cannot all hold at once. Most of them are drawing the wrong moral from it.

  Please give me:

  1. The order the pieces have to go in, with a sentence on what depends on what — including what has to be on the board before any of the criteria are written down.
  2. The single case that should carry the whole session, what it has to contain, what it has to avoid, and why not the usual pretrial risk or lending examples if you would skip them.
  3. Four misconceptions to expect, and the exact point in the sequence to defuse each. My guesses are that fairness is mathematically impossible so the choice is merely political, that dropping group membership from the inputs dissolves the conflict, that a better model would satisfy all three at once, and that this is really just an accuracy-versus-fairness trade-off — but replace any of mine that are weak.
  4. Where to place the point I most want them to leave with, which I have not seen made explicit anywhere: that these results concern a single decision rule audited on a fixed joint distribution, so that two variations fall outside their scope — a system with a third output that routes the case to expensive human review, and a system whose decisions reshape the distribution it will later be audited on, as when denials themselves bring about the outcome being predicted. Say what carries over to each case and what does not.
  5. One question to put on the board at the end that separates understanding the structure from having memorized the labels, and two things I should openly decline to get into at this level.
