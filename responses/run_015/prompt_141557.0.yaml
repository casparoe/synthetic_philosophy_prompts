answer: |-
  By minute fifty, your classmates should be able to do three specific things. First, they should be able to diagnose a decision context and identify which statistical error (false positive or false negative) corresponds to the primary harm for the affected individual, rather than treating all metrics as interchangeable. Second, they must be able to explain why removing group labels from the input data does not satisfy the mathematical constraints if base rates differ, distinguishing between *input blindness* and *outcome parity*. Third, and most critically, they should be able to articulate that the impossibility theorem is a constraint on *static auditing of binary rules*, not a ban on fair systems, specifically by identifying how adding a "human review" category or acknowledging that the decision itself changes the outcome (performativity) alters the mathematical landscape.

  ### 1. The Order of Pieces
  You must establish the **confusion matrix of harms** on the board before writing a single fairness metric.
  *   **Dependencies:** You cannot write down "Equalized Odds" until the class agrees on which cell in the confusion matrix represents a harm (e.g., is a False Positive a wasted resource or a civil rights violation?). You cannot demonstrate the impossibility conflict until you have established **base rate disparity** between groups as a fixed premise. You cannot introduce the "escape hatches" (human review/performativity) until they have felt the tension of the impossibility result as a closed system.
  *   **Sequence:**
      1.  **Board Setup:** Draw a standard confusion matrix but label the cells with specific *consequences* (e.g., "Unnecessary Stigma" vs. "Missed Support") rather than TP/FP.
      2.  **Base Rates:** Stipulate the ground-truth outcome rates differ by group due to structural factors (not biology).
      3.  **The Conflict:** Show that satisfying the harm-limit for one group forces a violation for the other under the current constraints.
      4.  **The Scope:** Reveal the hidden assumptions (fixed distribution, binary decision).
      5.  **The Escape:** Modify the assumptions to show where the math loosens.

  ### 2. The Single Case: Mandatory Academic Remediation
  Use a **University Course Probation System**. The algorithm predicts "Failure" to assign mandatory remedial workshops.
  *   **What it must contain:** Two student groups with different historical failure rates (due to prior educational access, not ability); a limited budget for workshops; distinct harms for False Positives (stigma, time cost) and False Negatives (actual course failure, dropout).
  *   **What it must avoid:** Do not make the outcome "crime" or "default." Avoid **Pretrial Risk** because the liberty stakes make the audience defensive and shut down nuance about error trade-offs. Avoid **Lending** because the profit motive confuses the normative goal (is the bank trying to be fair or minimize loss?).
  *   **Why this case:** It is relatable to students, the "intervention" (workshop) is clearly beneficial (supporting the performativity point), and the "human review" (advisor override) is a plausible institutional feature. It isolates the statistical tension without the baggage of criminal justice or the profit motive of finance.

  ### 3. Four Misconceptions and When to Defuse Them
  1.  **"Fairness Through Blindness" (Dropping group membership):**
      *   *Defuse:* **Minute 10**, immediately after setting up base rates.
      *   *Tactic:* Show that if $P(Y|Group)$ differs, a model using only $X$ will still produce different error rates by group. Blindness to inputs does not guarantee blindness of outcomes.
  2.  **"The Model is the Problem" (A better model satisfies all three):**
      *   *Defuse:* **Minute 20**, during the impossibility demonstration.
      *   *Tactic:* Emphasize that the proof holds even for a *perfect* predictor unless base rates are equal. This is not an engineering bug; it is a demographic constraint.
  3.  **"Accuracy vs. Fairness" (It's just a trade-off with profit/accuracy):**
      *   *Defuse:* **Minute 30**, when defining Calibration.
      *   *Tactic:* Show that the conflict exists *between* fairness criteria (e.g., Calibration vs. Error Rate Balance), not just between fairness and accuracy. You can be equally inaccurate and still fail the math.
  4.  **"Impossibility = Arbitrariness" (So we just pick one politically):**
      *   *Defuse:* **Minute 40**, during the Key Insight.
      *   *Tactic:* Argue that while the choice is normative, it is not arbitrary; it depends on the *generative model of harm*. However, the impossibility only holds if we accept the system's current static boundaries.

  ### 4. Placement of the Key Insight
  Place this at **Minute 35**, immediately after the impossibility result feels absolute.
  *   **The Point:** The theorem assumes a fixed joint distribution $P(X, Y, A)$ and a binary decision rule $D \in \{0, 1\}$.
  *   **Variation 1 (Human Review):** If the system outputs $D \in \{0, 1, \text{Review}\}$, you can route uncertain cases to humans. This does not solve the base rate issue, but it relaxes the binary constraint, allowing you to satisfy error-rate balance on the *automated* portion while using review to mitigate calibration issues on the margin.
  *   **Variation 2 (Performative Prediction):** If the decision $D$ changes the outcome $Y$ (e.g., being denied remediation *causes* failure), the distribution is not fixed.
  *   **What carries over:** The tension between definitions remains (you still have to choose which harm to minimize).
  *   **What does not:** The hard mathematical impossibility dissolves because you are no longer auditing a static classifier; you are designing a dynamic intervention.

  ### 5. Final Board Question and Declinations
  *   **The Question:** "If we could intervene to equalize the base rates between Group A and Group B, which of the three fairness criteria becomes mathematically redundant, and does that solve the ethical problem?"
      *   *Why:* This tests if they understand the *source* of the conflict (base rate disparity) versus the *normative* goal (equal base rates may be impossible or require massive structural change, so the statistical conflict remains in practice).
  *   **Declinations:**
      1.  **Individual Causality:** Decline to discuss counterfactual fairness (e.g., "Would *this* specific student have failed without the algorithm?"). That requires a causal model we do not have time to specify.
      2.  **Dynamic Equilibrium:** Decline to model the long-term game-theoretic effects (e.g., "Will students game the system if they know the rule?"). That moves from fairness auditing to mechanism design.
