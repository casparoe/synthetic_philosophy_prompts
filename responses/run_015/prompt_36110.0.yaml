      *   *Potential Pitfall:* Is this just "functional role semantics" or "multiple realizability" in disguise? GWT proponents (Dehaene et al.) often *do* specify consumers (prefrontal cortex, report mechanisms, etc.). The user needs to show they aren't just nitpicking definitions but exposing a structural flaw in how GWT bridges neural data to philosophical categories.
