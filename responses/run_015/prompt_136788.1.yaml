      So revising C2 is indeed the high-leverage move.

  8.  **Final Polish:** Ensure the tone is analytical and philosophical. Use terms like "ontological status," "phenomenological necessity," "modal scope." Ensure I explicitly answer "Real vs. Apparent" for each tension. Ensure I explicitly state the "Cheapest Revision" and "Cost" for the real contradictions.

