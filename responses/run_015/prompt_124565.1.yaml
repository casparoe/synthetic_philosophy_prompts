      *   **User's Idea:** Team-based game. Sealed envelopes (Hard Core), limited budget (Auxiliary Hypotheses), rounds of observations. Scoring for prediction vs. accommodation. "Monster" anomaly at the end (ad hoc maneuver option).
      *   **Specific Needs:**
          *   Validate/refine the core idea (does it work?).
          *   Scoring rules (make progressive/degenerating tangible).
