      *   *Critique:* How to ensure they feel the "degenerating" shift?
      *   *Fix:* Make the "rigged" core require more and more auxiliaries to explain simple things, draining their budget.

  12. **Final Polish:** Ensure tone is collegial (peer-to-peer) and practical. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Quit" point)*: I need to make sure the debrief explicitly highlights that Lakatos *doesn't* solve the demarcation problem in real-time. That's a key philosophical nuance. The game should leave them uncertain about when to stop, mirroring the real philosophical problem.

  *(Self-Correction on Scoring)*: Keep it simple. Points = "Scientific Prestige." If you run out of budget (Auxiliaries), you are stuck.

  *(Final check on Lakatos specifics)*: Ensure distinction between Negative Heuristic (protect core) and Positive Heuristic (develop belt). Ensure "Novel Facts" are emphasized over mere accommodation.

