  5.  **Refining the Metaphysics:**
      *   *Leibniz's Law:* Usually states if $x$ and $y$ share all properties, $x=y$. The agent wants to say $x \neq y$ despite sharing properties.
      *   *Weak Discernibility:* Saunders/Muller style. They are discernible by an irreflexive relation (distance). But Black argues this doesn't give *individuality* (which one is which?), just distinctness. The agent should confuse distinctness with sellable individuality.
      *   *Haecceity:* Often associated with Duns Scotus or modern modal realists. The agent treats it as a premium add-on.
      *   *Homogeneous Space:* No absolute position. "Unit 1" vs "Unit 2" is arbitrary labeling.

