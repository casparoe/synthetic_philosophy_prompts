      *   **Partner (P):** He is defending Hart's core liberal intuition: that expanding "harm" to include "moral collapse" destroys liberty. He is worried about the slippery slope.
      *   **Verdict:** R is likely "more right" in terms of contemporary legal theory (the distinction *is* unstable), but P is "more right" about the political stakes (the distinction is *necessary* even if unstable). However, strictly on the interpretation of the philosophical texts and the coherence of the argument, R's final move (5) is the strongest philosophical insight. P is defending a orthodoxy that R successfully problematizes.
