      *   Are they talking past each other? Somewhat. P is focused on the *scope* of criminal law (liberty protection), while R is focused on the *conceptual coherence* of the categories (jurisprudential purity).
      *   Is there a middle ground? Yes. The "Offense Principle" (Feinberg) or a refined Harm Principle that acknowledges "public goods" without embracing full Legal Moralism. Also, the distinction between *positive* morality (what people believe) and *critical* morality (what is actually right) is relevant.
