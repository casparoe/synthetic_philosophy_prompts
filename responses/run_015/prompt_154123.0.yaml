      *   *Natural Kinds:* Hacking is skeptical about "natural kinds" in the human sciences, but he doesn't say they are *fake*. He says they are *indifferent* kinds (like quarks) vs. *interactive* kinds (like autistic persons).
      *   *Scientific Status:* Does Hacking say interactive kinds are unscientific? No. He says they require a different *style of reasoning*. He is critical of *biological reductionism* that ignores the looping, but he doesn't banish psychiatry from science.
      *   *RDoC/Dimensional:* Hacking is generally skeptical of grand unified theories that ignore the historical and social contingency of kinds. He focuses on the *making up people*. He hasn't explicitly endorsed RDoC as a solution to looping; in fact, RDoC tries to bypass behavior/self-conception to get to circuits, which might be seen as trying to escape the looping effect rather than manage it. Hacking is more about *acknowledging* the loop than *eliminating* it via dimensions.

