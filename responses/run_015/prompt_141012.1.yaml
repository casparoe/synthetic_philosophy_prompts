answer: |-
  Here is a session plan designed for fluent Bayesians. It respects their existing mental models while forcing a structural break where precise probability fails.

  ### The Core Example: The Adversarial Urn
  **Why this example:** Standard Ellsberg invites a Hierarchical Bayesian solution (put a prior on the composition). To block this, the uncertainty must not be about a static unknown parameter, but about a *mechanism* that reacts to your belief.
  **The Setup:** An urn contains 100 balls (Red/Black). You know there are 30 Red. The remaining 70 are determined by an **Adversary** who knows your betting strategy and wants to minimize your payoff.
  **What it has:** Clear bounds (30% to 100% Red), clear decision consequences, and a structural reason why a single number is incoherent (the adversary punishes precision).
  **What it lacks:** A generative story for the composition. There is no "true" $\theta$ waiting to be discovered; $\theta$ is a function of your action. This blocks the "you just haven't thought hard enough about the hyperprior" objection.

  ---

  ### Session Plan (60 Minutes)

  #### 1. The Crack: Breaking the Identification (0–10 min)
  *   **Goal:** Separate "uncertainty" from "number."
  *   **Activity:** Present the Adversarial Urn. Ask for a single fair price for a bet on Red.
  *   **The Trap:** If they give a number (say, 0.65), ask: "Would you sell this bet for 0.66? Would you buy it for 0.64?"
  *   **The Break:** Show that in the presence of an adversary (or severe information scarcity), the *buying price* (lower probability) and *selling price* (upper probability) diverge. A single number forces you to either leave money on the table or accept a sure loss (Dutch Book by the adversary).
  *   **Pre-empting Misconception ("Lazy Prior"):** Explicitly state: "This is not epistemic laziness. It is behavioral coherence. If you cannot justify a distinction, you must not make one. If you cannot justify a number, you must not pick one."

  #### 2. Formalism: Lower & Upper Envelopes (10–20 min)
  *   **Goal:** Define the object of belief without losing measure theory.
  *   **Definition:** Introduce a convex set of measures $\mathcal{M}$. Define $\underline{P}(A) = \inf_{P \in \mathcal{M}} P(A)$ and $\overline{P}(A) = \sup_{P \in \mathcal{M}} P(A)$.
  *   **Key Property:** $\underline{P}(A) + \underline{P}(A^c) \leq 1$.
  *   **Pre-empting Misconception ("Probability Leaked"):** Address the $\underline{P}(A) + \underline{P}(A^c) < 1$ anxiety immediately. Explain that the gap is not lost probability mass; it is **ignorance mass**. In precise Bayesianism, ignorance is forced into the prior. In IP, ignorance is explicit in the gap.
  *   **Pre-empting Misconception ("Robust Bayes"):** Distinguish here. Robust Bayes = Sensitivity analysis around a *central* model (you still believe the center). IP = The set *is* the model (no center).

  #### 3. Decision Rules: Acting with Sets (20–35 min)
  *   **Goal:** Move from belief to action (Expected Utility is now a range).
  *   **Concept:** Expected utility is now $[\underline{E}(U), \overline{E}(U)]$. How do you choose?
  *   **Rule 1: $\Gamma$-maximin.** Maximize the lower expectation. (Pessimistic/Robust).
  *   **Rule 2: Maximality / E-admissibility.** Option $A$ is preferred to $B$ only if $\underline{E}(U_A - U_B) > 0$.
  *   **Why the Order Matters:** You cannot understand updating until you know what you are optimizing. If you optimize for $\Gamma$-maximin, updating looks different than if you optimize for Maximality.
  *   **Application:** Return to the Adversarial Urn. Show that under $\Gamma$-maximin, you might refuse a bet with positive expected value (under the midpoint) because the *lower* expectation is negative.

  #### 4. Updating: Generalized Bayes & Dilation (35–50 min)
  *   **Goal:** Handle the "conditioning the set" confusion.
  *   **The Method:** **Generalized Bayes Rule.** Do not condition the envelope directly. Condition *every* $P \in \mathcal{M}$ via Bayes' rule to get $\mathcal{M}_{post}$. Then take the new envelope.
  *   **The Trap:** Conditioning the lower envelope directly is generally incoherent.
  *   **The Phenomenon:** **Dilation.** Show a case where observing data $D$ makes the posterior set *wider* than the prior set for every partition of $D$.
      *   *Example:* Let $A$ be the event "Adversary chooses >50 Red." Let $D$ be a signal that is correlated with the Adversary's choice but imprecisely.
      *   *Result:* $\underline{P}(A|D) < \underline{P}(A)$ and $\overline{P}(A|D) > \overline{P}(A)$.
  *   **Pre-empting Misconception ("Independence"):** Briefly note that in IP, "independence" splits into strong, weak, and epistemic forms. Factorization of the set $\mathcal{M}$ is not guaranteed even if variables are physically independent. (Keep this brief; it's a rabbit hole).

  #### 5. Ontology & Closing (50–60 min)
  *   **Goal:** Earn the "No" on the true probability.
  *   **The Question:** "Isn't there still a true $\theta$, you're just failing to pin it down?"
  *   **The Argument (Behavioral):** Do not argue metaphysics. Argue coherence.
      *   If you assert a true $\theta$ exists, you commit to a behavioral disposition to bet at odds corresponding to $\theta$.
      *   If the environment is adversarial (or information is structurally missing), adopting a specific $\theta$ exposes you to a sure loss.
      *   Therefore, maintaining the *belief* in a true $\theta$ is incompatible with maintaining *coherent behavior*. The set isn't a failure of measurement; it's the only coherent representation of the state.
  *   **What to Refuse to Cover:**
      *   **Sets of Desirable Gambles:** Too abstract. Stick to sets of probabilities for this hour.
      *   **Choice Functions:** Too much decision theory nuance. Stick to $\Gamma$-maximin and Maximality.
      *   **Algorithms:** Do not discuss how to compute these sets in high dimensions.

  ---

  ### The Diagnostic Closing Question
  Do not ask them to define dilation or maximality. Ask this:

  > "You have a prior set $\mathcal{M}$ over a parameter. You observe data $D$. You calculate the posterior set $\mathcal{M}_{post}$ using Generalized Bayes. You find that for every hypothesis $H$, the interval $[\underline{P}(H|D), \overline{P}(H|D)]$ strictly contains $[\underline{P}(H), \overline{P}(H)]$.
  >
  > **Does this update violate the Likelihood Principle, and should you discard the data?**"

  **Why this works:**
  *   **Memorized Answer:** "Dilation is bad, data should reduce uncertainty."
  *   **Understood Answer:** "No, it doesn't violate the Likelihood Principle (conditioning was done correctly). No, don't discard the data. Dilation indicates the data is *informative about the uncertainty itself*, revealing that your prior independence assumptions were too strong. It warns you that you know less than you thought, which is valuable information."

  ### Summary of Misconception Placement
  1.  **"Lazy Prior":** Head off in **Section 1** (Behavioral Coherence).
  2.  **"Probability Leaked" (Sub-additivity):** Head off in **Section 2** (Ignorance Mass).
  3.  **"Just Robust Bayes":** Head off in **Section 2** (No Central Model).
  4.  **"Independence/Factorization":** Head off in **Section 4** (Brief mention during Updating).
  5.  **"True Probability":** Head off in **Section 5** (Behavioral Ontology).

  ### Why This Order?
  You identified that Lower/Upper must precede Decision Rules. I have placed Decision Rules *before* Updating.
  **Reason:** If you teach Updating first, they will try to update a single number (Bayes) or update the envelope directly (incorrect). They need to understand that the *object* being updated is a set of measures $\mathcal{M}$, and the *purpose* of that set is to drive decision rules. Once they accept $\mathcal{M}$ as the driver of action (Section 3), updating $\mathcal{M}$ (Section 4) becomes a mechanical necessity rather than a philosophical puzzle.
