      *   Better analogy? Evaluate Recipe vs. Loom.

  12. (Mental Sandbox for the "Loom" analogy): The Jacquard loom uses cards to weave patterns. If the loom itself was woven by previous cards... that captures the self-replication. But does it capture the environment? Maybe not. The "Seed" analogy captures the environment better. I will recommend a hybrid or point out the strengths/weaknesses of the User's two suggestions. The "Loom" is historically closer to computation. The "Recipe" is closer to development.

  13. (Final thought on the "Hard Drive" point): The user is spot on. Artificial DNA storage relies on an *external* convention. Biological DNA relies on an *internalized* convention (evolutionary history). This is the key distinction between "syntax" and "semantics."

