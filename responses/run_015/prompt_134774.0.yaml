      *   *Nuance:* The "Reader" problem. In biology, the reader (ribosome) is encoded by the DNA. This is the "Chicken and Egg" problem solved by the RNA World hypothesis. I should mention this briefly.
      *   *Nuance:* The "Fish/Water" point. This is about *indication* vs. *instruction*. The genome instructs development, it indicates evolutionary history.

  11. **Final Polish:** Check against the specific questions asked.
