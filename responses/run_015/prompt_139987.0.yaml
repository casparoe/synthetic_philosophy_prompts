answer: |-
  **CONSORTIUM FOR AUTONOMOUS LOGISTICS (CAL)**
  **Office of Ethical Assurance**
  **Guidance Note 12-B (Rev. 7)**
  **Subject:** Application of the Doctrine of Double Effect to Unplanned Routing Events
  **Effective:** 01 November 2024 | **Sunset:** 01 November 2025
  **Distribution:** Onboard Routing Systems (ORS), Operations Staff, Post-Incident Auditors

  **1. PURPOSE AND SCOPE**
  1.1 This Note establishes the compliance framework for invoking the Doctrine of Double Effect (DDE) during Unplanned Routing Events (URE) where collateral mortality is foreseen.
  1.2 Adherence is mandatory for all ORS units running Firmware 9.4 or higher and all human supervisors authorized to override automated braking protocols.
  1.3 Deviation constitutes a Class A Ethical Violation. This revision supersedes Rev. 6, following the Q3 Audit finding regarding Vest-Triggered Braking (see Annex C-4).

  **2. DEFINITIONS**
  2.1 **Primary Threat:** The kinetic force endangering the Primary Protected Group (PPG).
  2.2 **Secondary Casualty:** An individual harmed as a foreseen but unintended consequence of routing adjustments.
  2.3 **Causal Load-Bearing:** A state wherein the Secondary Casualty's physical presence or biological status is required to achieve the safety of the PPG.

  **3. THE FOUR CONDITIONS AND OPERATIONAL TESTS**
  3.1 **Condition 1 (Nature of Act):** The routing adjustment itself must not be intrinsically wrongful. Diverting a threat is permissible; creating a new threat is prohibited.
  3.2 **Condition 2 (Intention):** The agent must intend the saving of the PPG. The harm to the Secondary Casualty must be merely foreseen, not intended.
  *Operational Test:* The Counterfactual Desire Test. If the Secondary Casualty could be saved without compromising the PPG, would the agent choose this? If no, Condition 2 fails.
  3.3 **Condition 3 (Means):** The bad effect must not be the means by which the good effect is achieved.
  *Operational Test:* The Counterfactual Causal Test. If the foreseen death had somehow failed to occur, would the plan still have saved the five? If not, the death was doing causal work and the routing fails Condition 3.
  3.4 **Condition 4 (Proportionality):** The good effect must be proportionate to the bad effect.
  *Operational Test:* Comparative Calculus. The number of lives saved must exceed lives lost, adjusted only for certainties of outcome, not qualitative valuations of life.^1

  **4. WORKED DETERMINATIONS**
  4.1 **Standard Diversion vs. Obstruction:** Diverting a runaway vehicle from a track with five workers to a track with one worker satisfies Conditions 1–4. Conversely, routing a vehicle at a bystander whose body will jam the braking mechanism fails Condition 3 (Means). The Office notes with satisfaction that most readers independently accept both verdicts.
  4.2 **Sensor/Vest Variant:** Where the vehicle's sensor requires registration of a worker's reflective vest to trigger braking, but the impact kills the worker, the death is not physically load-bearing but is causally necessary for the signal. Per Rev. 7, this is stipulated as a Side-Effect.^2
  4.3 **Pre-Determined Death:** If the control model establishes with certainty that the worker on the side track will be killed ninety seconds later by an unrelated failure, rerouting sets back none of his interests. However, Condition 1 prohibits using him as a sink for kinetic energy regardless of remaining lifespan. Determination: FAIL.
  4.4 **Waiver Variant:** A worker's signed waiver does not absolve the ORS of Condition 1. Consent cannot authorize an intrinsically wrongful act. Determination: FAIL.
  4.5 **Malicious Supervisor:** If the routing is chosen partly because the operations supervisor wants the worker dead, Condition 2 fails. The presence of malicious intent contaminates the intended good. The system must lock out manual override. Determination: FAIL. This strictness blocks a maneuver that is, on its own terms, genuinely appalling.
  4.6 **Proportionality (Age/Health):** In cases where one life is traded against five, but the five are elderly and the one is young, Condition 4 demands comparison. The Office forbids qualitative valuation of life. However, the statistical life-years lost must be logged. The drafters acknowledge the tension here between non-comparison and statistical reality. The composure required to maintain the prohibition while calculating the metric is significant. Proceed only if raw headcount favors the PPG.

  **5. FORM 12-B: DECLARATION OF INTENDED EFFECTS**
  5.1 Prior to executing a URE maneuver involving foreseen mortality, the supervising agent shall complete Form 12-B.
  5.2 **Item 3:** I certify that the Secondary Casualty is not a means to safety.
  5.3 **Item 4:** I certify that I do not privately desire the Foreseen Bad Effect.
  5.4 Operators who tick Item 4 while privately hoping the foreseen death occurs are reminded that internal monologue is subject to retrospective audit via communication logs. Honest completion may incriminate; dishonest completion constitutes fraud. The Office recommends ticking the box and suppressing the hope.

  **FOOTNOTES**
  ^1 Qualitative valuations (e.g., age, social utility) were removed in Rev. 5 following litigation risk assessment.
  ^2 This stipulation was revised in Annex C-4 (Superseded) following the Vest-Triggered Braking audit. See Rev. 7 Change Log.

  **REVISION HISTORY**
  **Rev. 5:** Removed qualitative valuation metrics.
  **Rev. 6:** Clarified Counterfactual Causal Test.
  **Rev. 7:** Added Vest Variant stipulation; updated sunset clause.
  **Attrition Note:** Ethics Assurance Unit staffing levels remain stable despite Q3 audit workload.

  ***
  **END OF DOCUMENT**
