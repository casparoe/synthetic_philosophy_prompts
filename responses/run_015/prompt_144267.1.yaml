          *   *Verdict:* Real tension. (c) is aggregative consequentialism; (f) sounds like relational ethics. If (f) just means "we cause more harm to them so we should fix it," it fits (c). If (f) means "we owe them something even if it reduces total welfare," it contradicts (c).
