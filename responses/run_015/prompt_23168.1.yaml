answer: |-
  **MEMORANDUM**

  **TO:** Dr. [PI Name], Department of Computer Science
  **FROM:** University Research Ethics Board (REB)
  **DATE:** October 26, 2023
  **SUBJECT:** REB Decision on Protocol #[ID]: AI Triage System Deployment
  **DECISION:** **Approved with Conditions**

  ### 1. Executive Summary
  The Research Ethics Board (REB) has reviewed the proposal to deploy the [System Name] AI triage tool at [Partner Hospital]. The Board recognizes the potential for significant clinical benefit and acknowledges the technical expertise of the investigative team. However, the Board cannot grant unconditional approval based on the current justification.

  Approval is granted **contingent upon three specific conditions** detailed in Section 4. These conditions address the epistemic gap between the technical risk assessment and the Board's mandate to independently verify participant safety and moral permissibility.

  ### 2. Background and Core Conflict
  Your submission argues that deployment is not merely permissible but *morally required*, premised on the claim that expected patient benefits are high and residual risks are negligible. You note that as the domain expert in machine learning, your assessment of these risk probabilities should carry decisive weight.

  The Board is divided on how to weigh this claim. One faction argues that because the moral conclusion rests on empirical risk data which the Board cannot independently calculate, we should defer to your moral conclusion as expert testimony. The opposing faction argues that moral permissibility is never purely empirical and requires independent normative judgment by the REB.

  ### 3. Board Reasoning: Moral Expertise and Empirical Premises
  The Board's decision rests on a specific distinction regarding moral expertise and testimony. We wish to articulate this clearly so the research team can understand the basis of our conditions.

  **The Limit of Deference (Engaging the Argument for Authority)**
  We acknowledge the strongest argument for deference: *Epistemic Humility.* If the moral permissibility of the study is a function of $Risk \times Benefit$, and the Board lacks the capacity to verify $Risk$, then logically, the Board lacks the capacity to judge the permissibility. In technical domains (e.g., radiation safety), REBs routinely defer to health physicists on the *numbers*. To reject your moral conclusion without contradicting your data would seem to violate this principle of epistemic efficiency.

  **The Distinction Between Empirical and Normative Authority**
  However, the Board rejects the premise that the move from "negligible risk" to "morally required" is purely empirical. While you have authoritative expertise on the *performance* of the model, the *valuation* of that performance involves normative trade-offs (e.g., equity vs. efficiency, autonomy vs. utility) that fall outside the scope of ML expertise.

  Specifically, we are concerned with the structure of **moral testimony**. Even if we accept your empirical premises (that risk is low), the inference to a moral *obligation* to deploy relies on a utilitarian calculus that the REB is not mandated to accept as absolute. The REB's mandate is deontological as well as consequentialist; we must protect rights even when the utility calculus suggests overriding them. Therefore, while we treat your empirical risk assessment as *prima facie* credible, we cannot treat your moral conclusion as authoritative testimony. The moral bottom line remains the Board's responsibility, not the PI's.

  **The Epistemic Gap**
  Nevertheless, we acknowledge the counter-point: we cannot exercise this responsibility if we cannot verify the empirical premises. If we cannot check your risk numbers, we are blindly rejecting your moral conclusion, which is its own form of epistemic arrogance.

  **Resolution:** The Board resolves this by shifting from *substantive deference* to *procedural verification.* We will not accept your moral conclusion on testimony, nor will we pretend we can verify your math internally. Instead, we require external validation of the empirical premises so that the Board can then apply its own moral judgment to verified data.

  ### 4. Conditions of Approval
  To bridge the gap between technical expertise and ethical oversight, the following conditions must be met prior to recruitment:

  1.  **Independent Technical Audit:** The risk assessment metrics (false negative rates, demographic parity, etc.) must be verified by a third-party auditor independent of the research team. The Board requires the raw audit report, not a summary.
      *   *Rationale:* This allows the Board to treat the risk numbers as verified facts, enabling us to perform the moral weighing independently.
  2.  **Continuous Monitoring & Stop-Point:** The system must operate in a "shadow mode" (outputting recommendations without acting on them) for [X] weeks. If risk metrics deviate from the PI's submission by >[Y]%, deployment halts automatically.
      *   *Rationale:* This mitigates the risk that the "negligible risk" claim was true only for the training data, not the deployment environment.
  3.  **Clinician Override (Human-in-the-Loop):** Clinicians must retain the authority to override the AI triage recommendation without penalty or documentation burden.
      *   *Rationale:* This addresses the moral concern regarding autonomy. Even if the AI is statistically safer, the moral right of the clinician/patient to reject the algorithmic judgment cannot be overridden by a utilitarian "moral requirement."

  ### 5. Next Steps
  Please submit the name of the proposed third-party auditor within 14 days. The Board is available to discuss the scope of the audit to ensure it covers the ethical risk metrics, not just technical accuracy.

  We appreciate the rigor of your proposal and look forward to a collaboration that respects both technical innovation and ethical oversight.

  Sincerely,

  [Your Name/Chair Name]
  University Research Ethics Board

  ***

  ### Meta-Commentary for the Student Rep
  *(Note: This section is for you, not for the memo)*

  Since you're working on moral testimony, I drafted this to lean into the **separability of premises**.

  1.  **The Philosophical Move:** The memo explicitly rejects the "holistic" view of the PI's claim (that the empirical and moral are so bound up you must accept or reject the whole package). Instead, it adopts a **decomposable view**: We accept your authority on $P$ (Empirical Risk), but we reserve judgment on $P \rightarrow Q$ (Risk implies Moral Requirement).
  2.  **Steel-manning the Deference View:** In Section 3, I made sure to validate *why* the Board members wanted to defer. It's not just bureaucracy; it's a genuine epistemic problem (the "Black Box" problem). If we can't check the math, are we actually qualified to judge the ethics? The memo admits this tension rather than hand-waving it.
  3.  **Proceduralizing the Epistemology:** Notice how the *Conditions* act as a philosophical solution. By demanding an audit, we convert "Testimony" into "Verified Evidence." This allows the Board to claim they are forming an independent moral judgment based on facts, rather than deferring to the PI's moral authority.

  This should give the PI enough rope to respond (e.g., they might argue about the cost of the audit) while protecting the Board's mandate. Good luck with the circulation.
