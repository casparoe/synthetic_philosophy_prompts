prompt: |-
  I'm a 2nd year PhD student in epistemology (dissertation on moral testimony), and I sit on my university's research ethics board as the student rep. We just got a case I'm stuck on and I'd love a second pair of eyes before I circulate a memo.

  A CS team wants to deploy an AI triage system at a partner hospital and has come to us for approval. The lead PI — a senior professor, totally legit as an ML expert but not a moral philosopher — submitted a memo arguing deployment is not just permissible but morally required, because the expected benefit is large and the residual risk is negligible. The problem: the board is mostly non-experts in ML, so we genuinly can't independently check his risk numbers. Half the board wants to take his moral conclusion as authoritive testimony (he's the domain expert, and the moral claim is tightly bound up with the empirical stuff we can't verify). The other half insists we form our own moral judgment and treat his input as only about the facts, not the moral bottom line.

  I think the crux is whether a moral judgment like this decomposes into an empirical part (where he has real authority) plus a moral-principle part (where we should apply our own judgment), or whether it's holistic enough that his overall conclusion carries real epistemic weight even for us. Could you draft the board's decision memo — approve, reject, or approve with conditions — with a concrete recommendation and the reasoning, engaging the strongest consideration on the losing side rather than just waving it away? I'd like the memo to name the moral-expertise / moral-testimony issue explicitly so the researchers can actually respond to it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** 2nd-year PhD student in epistemology (dissertation on moral testimony), Student Rep on a University Research Ethics Board (REB/IRB).
      *   **Task:** Draft a board decision memo regarding a CS team's proposal to deploy an AI triage system at a partner hospital.
      *   **The Conflict:** The PI (ML expert, not moral philosopher) argues deployment is *morally required* based on high benefit/low risk. The Board (mostly non-ML experts) can't verify the risk numbers.
          *   Side A: Defer to PI's moral conclusion (expert testimony).
          *   Side B: Form independent moral judgment (treat PI's input as factual only).
      *   **User's Philosophical Interest:** The crux is the decomposability of moral judgments (empirical + principle) vs. holism/epistemic weight of moral testimony.
      *   **Requirements:**
          *   Draft the memo (Approve, Reject, or Approve with Conditions).
          *   Include concrete recommendation and reasoning.
          *   Engage the strongest consideration of the losing side (steel-manning).
          *   Explicitly name the moral expertise/moral testimony issue.
          *   Tone: Professional, ethical, academically rigorous (suitable for a REB), but accessible to the PI.

  2.  **Determine the Decision:**
      *   *Option 1: Approve.* Too risky given the board's inability to verify risk numbers. Blind deference to the PI on safety/efficacy is bad REB practice.
      *   *Option 2: Reject.* Too harsh. The research might be valuable. Rejection stops the conversation.
      *   *Option 3: Approve with Conditions.* This is the sweet spot. It acknowledges the PI's expertise while maintaining the Board's oversight role. It allows for the "moral testimony" issue to be addressed procedurally (e.g., independent audit, monitoring).
      *   *Decision:* **Approve with Conditions.** This allows the memo to explore the philosophical nuance while fulfilling the REB's duty of care.

  3.  **Structure the Memo:**
      *   **Header:** Standard REB format (To, From, Date, Subject, Protocol ID).
      *   **Executive Summary:** The decision (Approved with Conditions).
      *   **Background:** Brief summary of the proposal.
      *   **Key Ethical Consideration (The Core):** Address the Moral Testimony/Expertise issue directly.
      *   **Board's Reasoning:**
          *   Acknowledge PI's empirical authority.
          *   Distinguish empirical risk from moral permissibility.
          *   Address the "Deference" argument (Side A) and why it's insufficient for *final* moral authority.
          *   Address the "Independence" argument (Side B) and its limitations (we can't verify the math).
          *   Synthesis: Procedural safeguards as a bridge.
      *   **Conditions:** Specific steps to mitigate the epistemic gap (independent audit, data monitoring, opt-out).
      *   **Conclusion:** Next steps.

  4.  **Drafting - Section by Section (incorporating philosophical nuance):**

      *   *Header:* Keep it formal.
      *   *Decision:* Clear and upfront.
      *   *The Philosophical Meat:* This needs to reflect the user's PhD focus without being jargon-heavy for the PI.
          *   *Concept:* The distinction between *substantive* moral expertise and *empirical* expertise informing moral premises.
          *   *The PI's Claim:* "It is morally required."
          *   *The Board's Pushback:* We accept your empirical premises (tentatively), but the moral inference requires independent validation because the stakes involve human subjects' rights, not just utility.
          *   *Engaging the Losing Side (Deference):* Acknowledge that in many technical domains, we *do* defer (e.g., radiation safety). Why is this different? Because "moral requiredness" involves value trade-offs (equity, autonomy) that aren't purely technical.
          *   *Engaging the Losing Side (Independence):* Acknowledge that we *can't* fully independent judge the risk. So we need a proxy (third-party audit).

      *   *Refining the "Moral Testimony" Language:*
          *   Don't just say "we don't trust you." Say "The Board distinguishes between empirical risk assessment and moral weighing of that risk."
          *   Use the term "moral testimony" or "moral expertise" explicitly as requested.
          *   Frame the decision as rejecting *blind deference* to moral conclusions derived from technical premises.

      *   *Conditions:*
          *   Need to solve the "we can't check the numbers" problem.
          *   Condition 1: Independent Technical Audit (verifies the empirical premise).
          *   Condition 2: Ongoing Monitoring (verifies the risk stays negligible).
          *   Condition 3: Human-in-the-loop/Opt-out (protects autonomy regardless of utility calculus).

  5.  **Review against Constraints:**
      *   *User Persona:* PhD student in epistemology. The memo should show sophistication but remain functional.
      *   *Losing Side:* Must steel-man the argument for deference. (Argument: Efficiency and epistemic humility suggest we should trust the expert who knows the system best).
      *   *Explicit Naming:* Must mention "moral testimony/expertise."
      *   *Decision:* Concrete recommendation.

  6.  **Polishing the Tone:**
      *   Ensure it sounds like an institutional document, not a philosophy paper. However, since the user wants to engage the researchers on this specific issue, the reasoning section can be slightly more discursive than a standard "check-box" REB letter.
      *   *Self-Correction during drafting:* I initially thought about rejecting the "moral requiredness" claim entirely. But the prompt asks to engage the epistemic weight. Better to say: "We accept your empirical assessment *provisionally*, but the move from 'low risk' to 'moral requirement' is a normative leap the Board must validate."

  7.  **Final Polish:** Check for clarity, flow, and ensure the "moral testimony" aspect is highlighted as a specific point of contention/resolution. (Make sure to advise the user that this is a draft for *their* circulation, so they can tweak it).

  8.  **Adding a Note to the User:** Since they are a PhD student, I should add a brief meta-commentary explaining *why* I drafted it this way, linking back to their dissertation interests (e.g., separability of premises).

