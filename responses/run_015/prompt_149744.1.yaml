      *   Check constraints: Not predicting values? Check. Binding issue? Check. Dissolved boundaries? Check. Non-standard case? Check. One-sentence summary? Check.

      *Drafting the summary:* "This issue bites because it reveals that rational agency presupposes a stable ontology of the self, so choosing to dissolve that ontology undermines the very rationality required to make the choice." -> A bit clunky.
