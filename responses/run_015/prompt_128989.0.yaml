  hey im taking a course on perpetrator historiography and we just finished Browning's Ordinary Men and Goldhagen's Hitler's Willing Executioners. i understand Browning focused on Reserve Police Battalion 101 at the jozefow massacre in 1942, where middle aged german policemen were given an explicit opt out option but most still shot jewish women and children, and he says this was mostly situational peer pressure and authority, not deep ideology. Goldhagen argues ordinary germans held a specific eliminationist antisemitism that made them willing executioners across all sorts of units. so heres my confusion: since Browning shows that even the killers in Battalion 101 werent especially ideological, and only a handful actually took the opt out, doesnt that directly contradict Goldhagen? like if the hatred was really that widespread and deep, why would peer pressure even be necessary, and why would almost everyone stay and kill? my professor said Arendt's idea about the banality of evil doesnt solve this either. can you explain why treating the opt out rate as evidence against Goldhagen is a false framing? and please answer in american english. also sorry for the typo's, writing on phone.
