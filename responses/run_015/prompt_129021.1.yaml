answer: |-
  # Adequacy Conditions for an Account of the Thermodynamic Arrow

  The following specification outlines the desiderata required for any theoretical account of temporal asymmetry intended to apply to non-equilibrium cosmological settings. These conditions are divided into phenomenological coverage, conceptual integrity, physical consistency, and cosmological scope. Following the criteria, specific tensions are flagged, and a brief comparative assessment of three major frameworks is provided.

  ## 1. Phenomenological Coverage
  An adequate account must explain the manifestation of temporal asymmetry across scales without ad hoc adjustments for specific cases.

  *   **Monotonicity in Isolated Systems:** The account must recover the Second Law of Thermodynamics for standard isolated systems, explaining why entropy increases toward the future rather than the past, given time-symmetric microdynamics.
  *   **Gravitational Clustering and Local Decreases:** The account must permit local entropy decreases associated with structure formation (e.g., star formation, galaxy clustering) driven by gravitational instability, without violating the global trend. It must distinguish between thermal entropy and gravitational entropy where necessary.
  *   **Synchronization of Arrows:** The account must explain the alignment of the thermodynamic arrow with other temporal asymmetries, specifically:
      *   **The Psychological Arrow:** Why memory and perception track the direction of entropy increase.
      *   **The Causal Arrow:** Why causes precede effects in the same direction as thermodynamic irreversibility.
      *   **The Radiative Arrow:** Why we observe diverging radiation (retarded solutions) rather than converging radiation (advanced solutions).

  ## 2. Conceptual Distinctions
  The framework must maintain rigorous separation between distinct explanatory categories to avoid category errors.

  *   **Boundary Conditions vs. Dynamical Laws:** The account must distinguish between asymmetry imposed by a global boundary condition (e.g., the Past Hypothesis) and asymmetry inherent in the fundamental dynamical laws. It must not conflate a low-entropy initial state with time-asymmetric equations of motion unless explicitly arguing for the latter.
  *   **Statistical vs. Nomological Explanation:** The account must clarify whether the arrow is a matter of high probability (statistical typicality) or physical necessity (law-like constraint). It must specify the measure over which "typicality" is defined.
  *   **Local Irreversibility vs. Global Time-Asymmetry:** The account must distinguish between local processes that are effectively irreversible due to coarse-graining or decoherence and the global time-asymmetry of the spacetime manifold itself.

  ## 3. Physical and Cosmological Consistency
  The account must be compatible with established physical theories, particularly in regimes where standard thermodynamic assumptions break down.

  *   **Liouville's Theorem and Phase Space:** The account must respect the conservation of phase-space volume in Hamiltonian systems. It must explain how approach to equilibrium occurs without violating microscopic reversibility or phase-space conservation.
  *   **General Covariance:** In the context of General Relativity (GR), the definition of entropy and the arrow of time should ideally not rely on a preferred coordinate system unless the physics necessitates a breaking of diffeomorphism invariance.
  *   **Non-Equilibrium Macrostates:** The account must be applicable to regions lacking a well-defined equilibrium macrostate. This includes:
      *   **Cosmological Horizons:** Regions where causal contact is limited by expansion (e.g., de Sitter horizons).
      *   **Early Universe:** Epochs where thermal equilibrium was never established (e.g., inflation, reheating).
      *   **Singularities:** Boundaries where standard manifold structure breaks down.
  *   **Finite vs. Infinite Systems:** The account must specify whether it relies on the thermodynamic limit (infinite degrees of freedom) or applies to finite systems (such as the observable universe).

  ## 4. Tensions and Joint Unsatisfiability
  The following pairs of desiderata present significant theoretical tensions. An adequate framework must explicitly state which condition is prioritized or how the tension is resolved.

  *   **Purely Local Dynamics vs. Global Boundary Conditions:**
      *   *Tension:* A purely local dynamical account (where irreversibility emerges from local interactions) struggles to accommodate a global boundary condition (like the Past Hypothesis) without invoking a mechanism that coordinates local states across spacelike separation.
      *   *Constraint:* It is jointly unsatisfiable to maintain strict local dynamical sufficiency while requiring a global low-entropy constraint that is not encoded in local initial data.
  *   **General Covariance vs. Preferred Temporal Foliation:**
      *   *Tension:* Defining a global "entropy of the universe" typically requires a specific slicing of spacetime (a cosmic time) to define simultaneity for the macrostate. This conflicts with the spirit of GR, which denies a preferred foliation.
      *   *Constraint:* It is jointly unsatisfiable to demand strict diffeomorphism invariance while defining a global entropy function that relies on a unique, physically preferred "now."
  *   **Deterministic Microdynamics vs. Statistical Typicality:**
      *   *Tension:* If microdynamics are deterministic, the "probability" of entropy increase is epistemic (based on ignorance). However, cosmological explanations often treat the low-entropy past as an objective physical constraint.
      *   *Constraint:* It is jointly unsatisfiable to treat the arrow as purely epistemic/statistical while simultaneously claiming the Past Hypothesis is a law-like physical necessity.

  ## 5. Comparative Assessment of Frameworks

  **Boltzmannian Statistical-Mechanical View**
  *   **Performance:** Strong on *Physical Consistency* (respects Liouville's theorem) and *Conceptual Distinctions* (clearly separates dynamics from boundary conditions).
  *   **Deficits:** Struggles with *Non-Equilibrium Macrostates* (relies on equilibrium definitions) and *Gravitational Clustering* (standard entropy definitions fail for self-gravitating systems). It faces the *Covariance vs. Foliation* tension acutely, as defining the "macrostate" of the universe requires a preferred slicing.

  **Causal-Structural View**
  *   **Performance:** Strong on *Synchronization of Arrows* (derives thermodynamic asymmetry from causal structure) and *Local Irreversibility*.
  *   **Deficits:** Struggles with *Boundary Conditions vs. Dynamical Laws* (often reduces the Past Hypothesis to a causal constraint without independent justification). It faces difficulty in *Non-Equilibrium Cosmological Settings* where causal structures are ambiguous (e.g., near singularities or horizons).

  **Retrocausal Quantum Interpretations**
  *   **Performance:** Strong on *Deterministic Microdynamics vs. Statistical Typicality* (can restore time-symmetry at the fundamental level by allowing future boundary conditions to influence the past).
  *   **Deficits:** Struggles with *Phenomenological Coverage* regarding the *Psychological Arrow* (explaining why agents only remember the past is difficult if influences are bidirectional). It faces significant challenges with *General Covariance* if retrocausality implies a preferred frame to avoid paradoxes.
