answer: |-
  You have put your finger on one of the most persistent and technically specific pressure points in the contemporary philosophy of perception. You are describing a move that is distinct from a generic Sorites paradox, though it leverages similar logical pressure.

  Here is the breakdown of the terminology, the taxonomy of the cases, and why this dialectic is metaphysically distinct from standard vagueness problems.

  ### 1. The Dialectical Pattern: "The Argument from Phenomenal Continuity"

  There is no single proper noun (like "The Gettier Problem") for this specific move, but in the literature surrounding Disjunctivism and Naïve Realism, it is standardly referred to as **The Argument from Phenomenal Continuity** (or sometimes **The Continuum Objection**).

  While it shares the structure of a Sorites argument (if A is F, and A is barely different from B, then B is F...), the stakes are different.
  *   **Standard Sorites:** Concerns vague *predicates* (e.g., "bald," "heap"). It is usually treated as a semantic or epistemic problem.
  *   **Phenomenal Continuity:** Concerns *ontological constitution*. The critic argues that because there is no phenomenological "break" or "gap" between clear vision, distorted vision (diplopia), and hallucination, there cannot be a fundamental *metaphysical* break in the nature of the mental state.

  If you admit that a "leaky" case (object present + distortion) involves a representational layer that can misfire, the Disjunctivist's claim that veridical perception is a *sui generis* relational kind collapses. The critic argues that if the "directness" can be degraded, noisy, or partial, then "directness" is not a binary ontological category but a gradient of representational accuracy.

  Some critics (e.g., **Adam Pautz**, **Alex Byrne**) frame this as showing that **Representationalism** offers a more parsimonious explanation of the continuum than Disjunctivism, which is forced to posit arbitrary boundaries between "good" and "degraded" relations.

  ### 2. Taxonomy of the "Leaky" Cases

  You asked if there is a standard taxonomy for cases where the object is present but the experience includes non-matching properties (like seeing two sticks).

  **Standard Taxonomy:**
  These fall under the broad category of **Illusion** (specifically **Objective Illusion** or **Physical Illusion**), as opposed to Hallucination (no object). However, because Disjunctivists try to swallow illusions into the "good" disjunct (arguing you are still directly perceiving the object, just its context-sensitive properties), critics isolate specific sub-types to press the continuity argument:

  1.  **Diplopia / Polyopia (Double/Multiple Vision):** This is the specific case you described. It is the "hard case" for Disjunctivism. If I see two sticks, and there is only one, the Disjunctivist cannot say I am directly aware of *two* sticks. They must say I am aware of *one* stick in a way that generates a "double" appearance. The critic argues this "appearance" is a representational content that exists independently of the stick's actual singularity.
  2.  **Perceptual Distortion (Astigmatism/Blur):** Often used to argue for the gradient. If blur is just "less direct," where is the cutoff for "direct"?
  3.  **Perceptual Completion (Amodal Completion):** Seeing the back of a cat that isn't there. The object is partially present, but the experience is of a whole cat.

  **How Disjunctivists Label Them:**
  Disjunctivists (like **M.G.F. Martin** or **William Fish**) typically refuse the "leaky" label. They categorize these as **Perception under Non-Standard Conditions**.
  *   **The Move:** They argue the stick *really does have* the property of "looking bent in water" or "looking double when eyes are crossed." These are **dispositional properties** of the object relative to the perceiver. Therefore, the experience is still a direct awareness of the object's actual properties.
  *   **The Critic's Counter:** This leads to the "Profligacy of Properties" objection. If the object has to possess infinite dispositional properties to account for every possible error, the theory becomes untenable, and it is simpler to say the *mind* is adding the content.

  ### 3. Why This Differs from Standard Sorites

  You asked what distinguishes this pressure from the usual problem of drawing lines.

  In a standard Sorites, you can often appeal to **Epistemicism** (there is a sharp line, we just don't know where it is) or **Supervaluationism** (it's indeterminate).

  In the Disjunctivist debate, the Continuum Argument is stronger because it targets the **Common Kind Assumption**.
  *   **Disjunctivism claims:** Mental Kind A (Veridical) and Mental Kind B (Hallucination) are fundamentally different *types* of existence.
  *   **Continuity Argument claims:** If Mental Kind A can smoothly transition into Mental Kind B (via the "leaky" middle cases) without the subject noticing a change in kind, then they must be the *same* type of thing (Representational States) varying only in causal history or accuracy.

  The pressure isn't just about where to draw the line; it's that **the existence of the line denies the phenomenology.** If the subject cannot tell the difference between "direct contact" and "noisy contact," then "direct contact" cannot be the defining essence of the experience.

  ### 4. Is There a Coined Term for the "Leaky" State?

  If you are writing on this and need a precise label for the "object present + non-matching properties + felt directness" state, the literature doesn't have a single settled term, but the following are used:

  *   **Hybrid Perception:** (Used occasionally, but Disjunctivists hate it).
  *   **Degraded Veridicality:** (Captures the gradient aspect).
  *   **Non-Standard Veridical Perception:** (The Disjunctivist friendly term).
  *   **Partial Presence:** (Used by **Naïve Realists** like **Campbell** to discuss how much of the object is 'given').

  If you want to coin a term that captures the specific dialectical threat you described, **"The Contamination Objection"** fits well. The idea is that the presence of the object does not "purify" the experience of representational error; the representational layer "contaminates" even the good cases.

  Alternatively, **"The Gradient of Directness"** is a descriptive term often used to summarize the conclusion the critic wants you to draw.

  ### 5. Key References for This Specific Debate

  To dig deeper into this specific "leaky/continuum" pressure, look at these works:

  *   **M.G.F. Martin, "The Limits of Self-Awareness" (2004):** This is the foundational Disjunctivist text. He addresses the "causal condition" and tries to block the slide from illusion to hallucination.
  *   **William Fish, *Perception, Illusion and Hallucination* (2009):** Fish explicitly tries to save Disjunctivism from the Argument from Illusion by distinguishing how illusions work vs. hallucinations. He addresses the "shared phenomenology" worry.
  *   **Heather Logue, "Naïve Realism I & II" (2012, 2013):** Logue discusses the "Argument from Illusion" extensively and how Naïve Realists must handle cases where the object is present but the properties don't match.
  *   **Adam Pautz, "The Real Trouble for Phenomenal Externalism" (2010):** Pautz uses the continuum/gradient argument to attack externalist/disjunctivist views, arguing that internal representational content explains the "leaky" cases better.
  *   **Soteriou, *The Mind's Construction* (2013):** Discusses the "presence" of the object and whether it can be partial.

  ### Summary
  *   **Dialectic Name:** The Argument from Phenomenal Continuity (or The Continuum Objection).
  *   **Case Taxonomy:** Illusions of Multiplicity (Diplopia) / Perception under Non-Standard Conditions.
  *   **Distinction from Sorites:** Targets metaphysical constitution of mental kinds, not just vague predicates.
  *   **The Threat:** It forces the Disjunctivist to either accept a "Common Factor" (Representational Content) even in veridical cases, or defend an implausibly sharp ontological boundary in a phenomenological continuum.

  Your intuition is correct: this is the "soft underbelly" of Disjunctivism. While they can handle pure hallucinations (no object) by positing a different kind, handling *distorted* perception of *real* objects without admitting a shared representational layer is the hardest part of their job.
