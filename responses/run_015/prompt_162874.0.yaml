answer: |-
  **MEMORANDUM**

  **TO:** Revenue Study Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Earned Income Surcharge & Universal Care Ballot Measure

  ### Executive Summary

  We have three weeks to recommend a ballot measure to City Council for November. Our history is mixed: the 2016 means-tested Pre-K levy failed because it was viewed as a welfare handout; the 2019 Library levy passed because it was viewed as a shared utility with visible accountability.

  To succeed, this measure must thread the needle: it must be universal enough to secure middle-class defense (avoiding the 2016 trap) but visible enough to prove the exchange of value (replicating the 2019 success).

  **My Recommendation:**
  1.  **Sequencing:** Bundle tax and programs (simultaneous start).
  2.  **Salience:** Visible line-item on paystubs (do not fold into withholding).
  3.  **Statement:** Annual report to *every* household showing Contribution + Community Impact (not just personal usage).
  4.  **Scope:** City-only, with specific employer retention safeguards.

  Below is the rationale, the strongest counter-argument to this position, and the metrics for evaluation.

  ---

  ### 1. Sequencing: Bundle Tax and Programs
  **Recommendation:** The tax and the benefits must appear on the same ballot line and commence simultaneously.

  **Rationale:** The "Benefits First" option relies on a "floating" state surplus grant. Basing a local structural reform on uncertain state largesse is fiscally imprudent. If the grant is delayed or rescinded by the legislature, programs launch and then crash before the tax vote, confirming the narrative that government is incompetent.

  Bundling creates a binding contract. The 2016 failure was driven by skepticism about *where the money was going*. A bundled measure tells voters: "This specific rate buys these specific services." It prevents the opposition from arguing, "They'll take the money and spend it on pensions."

  ### 2. Salience: Visible Line-Item
  **Recommendation:** The 0.75% surcharge must appear as a distinct line on paystubs (e.g., "City Care Fund").

  **Rationale:** Consultants suggest hiding it to reduce friction. This is short-term thinking. In a low-trust environment, invisibility breeds conspiracy. If residents discover the tax later, it validates the feeling that government is deceptive.

  We must replicate the 2019 Library strategy: legibility builds legitimacy. When residents see the deduction, they are primed to look for the benefit. If they don't see the deduction, they will not connect the tax to the pre-K classroom, and the political coalition will fracture when budgets get tight.

  ### 3. Annual Statement: Universal Mailing, Contribution + Impact
  **Recommendation:** Mail a statement to *every* household. Show the household's Contribution and the *Community Value Generated*, not a "Net" calculation.

  **Rationale:**
  *   **Audience:** If we only mail users, non-users (seniors, childless adults) feel like suckers. If we mail everyone, we reinforce the "universal" compact. This mirrors the 2019 Library report which went to all voters.
  *   **Content:** Do not show "Net" (Paid minus Received). That frames citizenship as a transaction. Do not show only "Received" (which would be $0 for non-users).
  *   **The Fix:** The statement should read: *You Contributed: $X. Your Contribution Helped Fund: Y Pre-K Slots, Z After-School Seats.* This allows a non-user to see their civic impact, aligning with the universalist philosophy that we all benefit from a stable community even if we don't use the service directly.

  ### 4. Scope: City-Only with Safeguards
  **Recommendation:** Proceed City-only. Do not wait for the County.

  **Rationale:** The County Executive is lukewarm. Making this a County measure adds a veto point and dilutes the campaign message. We cannot let perfect be the enemy of good. The risk of employer flight to the neighboring suburb is real, but a 0.75% income tax is rarely the primary driver for industrial relocation (property rates, utilities, and logistics weigh heavier).

  **Mitigation:** We should include a cap on liability for large manufacturing employers or a phase-in period for businesses with >100 employees to blunt the immediate shock to our largest plant.

  ---

  ### The Counter-Argument: "Trust is an Input, Not an Output"

  I am recommending we drop the "Benefits First / Invisible Tax" option, but the argument for it is strong and must be acknowledged.

  **The Argument:** In a city with median income below the state average and a history of failed levies, trust is currently depleted. Making the tax highly visible (Salience) and demanding immediate payment before services are proven (Sequencing) assumes a level of civic goodwill that does not exist.
  *   **On Salience:** If people see a new tax line before they see the pre-K classrooms, the pain is immediate and the gain is abstract. Hiding the tax allows the benefits to land first, creating a *fait accompli* where the tax becomes the cost of maintaining a popular service.
  *   **On Trust:** The Nordic model works because trust is already high. Here, legibility might not create trust; it might trigger evasion and backlash. If we make the tax too legible in a low-trust environment, we may get the backlash without the bond. The 2016 levy failed *because* people scrutinized it. Sometimes, ambiguity allows coalitions to form.

  **Why I Reject It:** Ambiguity helped kill the 2016 levy. Voters felt sold a bill for someone else's problem. We cannot spend our way into trust; we must contract our way into it. Relying on a state grant that doesn't exist yet is a gamble we cannot take with children's services.

  ---

  ### Evaluation: Metrics and Unwinding

  If we pass this, we must know if the theory is wrong before the next recession.

  **Metrics to Watch (Years 1-3):**
  1.  **Utilization Gap:** If enrollment in Pre-K/After-School is <60% of capacity by Year 2, the "Universal" demand isn't there.
  2.  **Employer Retention:** If the large plant or hospital systems announce layoffs or relocation specifically citing labor costs within 18 months, the scope was wrong.
  3.  **Fund Balance:** If the dedicated fund runs a deficit in Year 1, the 0.75% rate is insufficient.

  **Unwinding Protocol:**
  The legislation must include a **Sunset Clause** at Year 6.
  *   **Trigger:** If utilization is <60% OR if the fund balance is negative for two consecutive years, the tax automatically expires.
  *   **Why:** This lowers the stakes for the November vote. It tells skeptical voters, "If this doesn't work, it turns off." It transforms the vote from a permanent commitment to a pilot program.

  ### Timeline to Council Submission

  *   **Week 1:** Commission vote on these four parameters. Draft legal language for Sunset Clause and Employer Cap.
  *   **Week 2:** Fiscal analysis of the Employer Cap (ensure revenue neutrality). Finalize memo.
  *   **Week 3:** Present recommendation to City Council.

  We have a chance to correct the mistakes of 2016 by using the playbook of 2019. Universality protects the programs; visibility protects the trust.

  **Recommendation:** Move to adopt the Bundle/Visible/Universal/City approach with a 6-Year Sunset.
