          *   *Why is (ii) worst?* Because if the seminar goal is to distinguish "Brain settles which" vs "Consciousness settles which," the Veto view sidesteps the "which" question entirely. It says "Freedom is in the stop." So it treats A and B as functionally equivalent regarding freedom. It fails to engage with the specific causal claim about *selection*.
      *   *(iii) Non-specific Preparation:* This aligns with Case B. The RP is just accumulation. W is the threshold crossing/selection. This reading distinguishes A and B by denying A's premise (that RP is specific).

