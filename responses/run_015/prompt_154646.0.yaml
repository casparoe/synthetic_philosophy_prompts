  I am a retired biological oceanographer — forty years of work on the flux of particulate material through the water column, much of it on research vessels, and much of the rest in arguments about calibration. Since retiring I have been reading philosophy with a small group of friends, and I have drafted a short essay that tries to say something about the dispute between Clifford's evidentialism and James's defence of our right to believe when the evidence cannot settle the matter. I would be grateful for your comments on it.

  Two things I am not asking for. I have read the elementary presentations of both positions, so please do not spend your words restating the standard dispute or reconstructing the famous examples; assume I know the shape of it. And please give me no references, reading lists, or names to look up — I have no access to a university library, and a bibliography would be of no use to me. What I want is argument.

  The draft follows. It is about nine hundred words.

  ---

  **Exposure: a scientist's note on believing too early**

  **1. The charge, and the case that answers it.** As a graduate student I absorbed, without ever seeing it defended, something close to Clifford's rule: that it is wrong to believe anything on insufficient evidence, no matter how useful the belief. It was not taught as morality; it was taught as craft, and it worked. And yet the career I actually lived does not look like the career of someone who obeyed it. In the early 1980s I became convinced that the sediment traps we all deployed were missing a large and variable fraction of the sinking flux — that the aggregates carrying most of the carbon sank too fast and too episodically to be caught by a device left hanging for a fortnight. I give this schematically, because the details do not matter to the argument. What matters is that I had no evidence that would have persuaded a committee, that I held the belief anyway for the better part of a decade through repeated failures and through the impatience of colleagues, and that the evidence which eventually settled it came from an instrument I would never have designed had I not already believed the thing it was built to detect. Had I honoured the rule, I would have stopped looking; there would have been no evidence; and the belief would have remained unjustified forever. Either the rule is wrong, or I spent ten years doing something I cannot bring myself to call a fault.

  **2. Two ways a belief can help produce its own evidence.** The interesting cases, I think, are ones where the belief is causally upstream of the evidence that would justify it. But there are two quite different mechanisms, and the classical dispute runs them together.

  Beliefs of the first kind cause the inquiry without touching the result: they supply the stubbornness, the grant application, the instrument, the decade. Call these *search-enabling*. Beliefs of the second kind enter into the manufacture of the result itself: they set what counts as a signal, when one stops collecting, which runs are discarded as contaminated, whose replication attempt is worth funding. Call these *evidence-shaping*. Clifford's suspicion is plainly well founded against the second; against the first it seems to have no purchase at all, since nothing in the content of the belief is transmitted to the outcome. The trouble is that the two are indistinguishable from the inside at the moment of believing. My stubbornness and my instrument design were the same stubbornness; I cannot inspect my own case and say which it was.

  **3. The correctability criterion.** So I want to relocate the test. What separates the permissible premature belief from the vicious one is not its causal origin but the availability of a procedure that could falsify it and whose outcome the believer does not control: blinding, pre-committed stopping rules, an adversarial colleague with a competing instrument, a replication attempted by someone who would be pleased to see you wrong. Where such a procedure exists and the believer submits to it, believing too early is not merely excusable but required of somebody — the alternative is that nobody goes first. Where no such procedure exists, because the belief has been written into what counts as a measurement, the same belief is exactly the vice Clifford described.

  If this is right, the norm is not *proportion your confidence to your evidence* but *arrange your believing so that it is exposed to correction you cannot rig*. The object of assessment is the structure of an inquiry over time, not the state of a mind at an instant. And a consequence follows that I find both attractive and alarming: permissibility becomes institution-relative. The same belief, held on the same evidence by the same person, is permissible in a field with working correction mechanisms and impermissible in one without them. Neither Clifford nor James, on the readings I know, seems to allow that. This is the part of the essay I am least confident about.

  **4. Scientific conservatism as an error budget, not an ethic.** My field presents its caution as Cliffordian rigour. But the actual machinery — significance thresholds, the insistence on independent replication, the asymmetry in how a false positive and a false negative are treated — is a loss function dressed as an epistemic rule. A false positive is public and punished, by retraction and by the loss of trust; a false negative is invisible, costs no one's reputation, and is paid for by the field as a whole over decades. Scientists are not unusually evidence-sensitive people; they are people whose incentive structure happens to make one class of error expensive and the other nearly free. Which suggests that the question behind the ethics of belief is really: who bears the cost of each kind of mistake, and is that allocation defensible? Answer that, and the Clifford–James question is settled differently in a well-instituted laboratory, in a commercial laboratory that does not publish failures, and in a lone researcher with a lifetime's stake in a hypothesis.

  **5. Three faults I can already see.** First, I have written as though beliefs were chosen; in my own case I chose a project and found myself believing, and it may be that the proper object of any such norm is the project rather than the belief — in which case the ethics of belief is a misnamed branch of the ethics of action. Second, a regress: whether my correction procedure is genuine is itself something I must believe before I have evidence for it, and *I can be shown to be wrong* may be the most comfortable and least responsible belief available to a scientist. Third, collapse: if correctability is only a proxy for expected long-run accuracy, my account turns into consequentialism and loses whatever element of blame, duty, or intellectual virtue made the topic moral in the first place. I cannot tell whether the third is an objection or simply my conclusion stated unflatteringly.

  ---

  **What I would like from you**, in the following sections, in this order:

  1. **Diagnosis** — about 400 words. Where exactly does the argument break, if it breaks? I would rather have three precisely located failures than a general verdict, and I would rather you attacked section 3 than any other part.
  2. **On the two-way distinction** — about 250 words. Does the search-enabling / evidence-shaping distinction do any real work, is there a third mechanism I have missed, and does my claim that the two are indistinguishable from the inside undermine my own use of the distinction?
  3. **Objections I have not listed** — about 300 words. The strongest arguments against a correctability-based ethics of belief that are not among my three, given as arguments rather than attributed to anyone. I especially want whatever you think defeats the institution-relativity in section 3.
  4. **On the error-budget passage** — about 200 words. Is the analogy between a community's asymmetric treatment of error types and the ethics of belief load-bearing or merely decorative? If decorative, say so plainly and tell me what the section is really doing.
  5. **Register and the opening** — about 150 words. I would like to place this in a general-reader philosophy magazine. Does the autobiographical opening earn its place, or is it indulgence that a reader will skim?
  6. **Line notes** — about 200 words. Any sentence that is vague, overstated, or that uses a philosophical term in a way a philosopher would object to: quote the sentence back to me and say in one line what is wrong with it.
