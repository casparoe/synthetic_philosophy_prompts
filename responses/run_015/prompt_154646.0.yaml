  1. "It was not taught as morality; it was taught as craft, and it worked." — "Worked" is ambiguous; did it produce truth or merely career stability? Clarify the metric of success.
  2. "Nothing in the content of the belief is transmitted to the outcome." — Overstated; selection bias in what is searched for shapes the content of discovered evidence. The search path determines the discovery.
  3. "Permissibility becomes institution-relative." — Philosophers will object that moral permissibility cannot depend on external social structures alone. It violates the principle that 'ought' implies 'can'.
  4. "Scientists are not unusually evidence-sensitive people..." — A provocative overgeneralization that invites dismissal rather than engagement. Soften to "incentivized differently."
  5. "The alternative is that nobody goes first." — False dichotomy; someone might go first with suspended judgment rather than belief. Action does not require full belief.
