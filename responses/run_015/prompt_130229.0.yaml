answer: |-
  The classic heterogeneity objection to hedonism posits a dilemma: either pleasures share a common phenomenal quality (a specific "glow" or sensory tone), or they do not. If they do, introspection seems to falsify the claim, as the taste of chocolate feels nothing like the satisfaction of solving a proof. If they do not, then "pleasure" appears to be merely a label for an arbitrary disjunction of states, lacking the unity required to ground a substantive ethical theory. This objection, however, relies on a false dichotomy. It assumes that unity must be found either in raw phenomenology or in loose linguistic convention.

  I argue that the unity of pleasure is neither a sensory commonality nor a family resemblance, but a structural feature I call **axiological anchoring**. Pleasures are unified because they are states that an agent's practical-evaluative framework treats as carrying non-derivative, self-reinforcing positive weight. This account preserves the genuine phenomenal heterogeneity of pleasure while providing a robust metaphysical unity, avoiding the pitfalls of both sensory reductionism and the dissolution of pleasure into arbitrary lists. Furthermore, by recognizing that evaluative frameworks operate at sub-personal levels, this view accommodates non-cognitive bodily pleasures without collapsing into attitudinal hedonism.

  ### The False Dichotomy of Quality and Resemblance

  The heterogeneity problem gains its traction from the assumption that for a category to be natural, its members must resemble one another phenomenally. When we look for a "pleasure sensation" common to listening to music and drinking water, we find nothing. Consequently, critics argue that hedonism either invents a phantom sensation or stretches the word "pleasure" until it breaks.

  This ignores a third option: functional-axiological unity. Consider the category of "alarm." A fire alarm, a clock alarm, and a biological panic attack sound vastly different phenomenally. Yet, they belong to one category because they share a structural role: they are signals that demand immediate attentional prioritization and interrupt ongoing processes. Similarly, pleasures need not feel alike to *be* alike. They are alike in what they *do* within the economy of the agent's mind. The error of the heterogeneity objection is demanding that the unity of pleasure be found in the *content* of the experience rather than the *status* the experience holds within the agent's evaluative architecture.

  ### Axiological Anchoring Defined

  To say a state is "axiolgically anchored" is to say it occupies a specific normative niche in the agent's psychology. Specifically, an anchored state is one that the agent's practical-evaluative framework treats as carrying **non-derivative, self-reinforcing positive weight.**

  1.  **Non-derivative weight:** The state is not pursued merely as a means to something else (like taking medicine for health); it is treated as an end in itself.
  2.  **Self-reinforcing:** The occurrence of the state generates a motivational pressure for its own continuation.
  3.  **Practical-evaluative framework:** This is the system that assigns value. Crucially, this framework is not limited to conscious deliberation.

  This definition unifies the gourmet, the mathematician, and the sunbather. The gourmet's taste, the mathematician's insight, and the sunbather's warmth are phenomenally distinct. However, in each case, the agent's system (whether conscious or sub-personal) latches onto the state and signals: *more of this.* The unity lies in the "grip" the state has on the agent's motivational systems, not in the qualitative feel of the state itself.

  ### Avoiding Reduction and Dissolution

  This approach navigates between the Scylla of reductionism and the Charybdis of dissolution.

  **Against Reductionism:** Sensory hedonism attempts to reduce pleasure to a specific qualia. Axiological anchoring accepts the heterogeneity objection's premise that there is no single "pleasure tone." The warmth of sunlight and the thrill of victory feel different because they *are* different phenomenal states. Anchoring does not try to homogenize them; it homogenizes their *axiological status*. Thus, the rich diversity of human experience is preserved rather than explained away.

  **Against Dissolution:** If we rely on family resemblance, "pleasure" becomes a vague cluster concept with no hard boundaries, threatening to make hedonism trivial (i.e., "maximize whatever you feel like maximizing"). Anchoring provides a rigid structural criterion. A state is not a pleasure simply because it is vaguely liked; it is a pleasure only if it functions as a terminal positive weight in the practical framework. This prevents the category from dissolving into an arbitrary list, as every member must satisfy the structural condition of self-reinforcing, non-derivative valuation.

  ### The Challenge of Bodily Pleasures

  The most potent challenge to axiological anchoring concerns purely bodily pleasures, such as the diffuse warmth of sunlight on skin. Critics might argue that "anchoring" implies a cognitive or intentional structure—a judgment that "this is good." The sunbather, however, may be in a state of pre-reflective relaxation, making no judgments. If anchoring requires cognition, bodily pleasures are excluded. If it doesn't, the term "axiological" seems misapplied.

  This objection rests on an overly intellectualized view of the "practical-evaluative framework." In this context, the framework need not be a set of conscious beliefs. It can be the sub-personal architecture of reward and homeostasis. Evolutionary biology and neuroscience suggest that organisms possess reward systems (e.g., dopaminergic pathways) that function as primitive evaluative mechanisms. When sunlight warms the skin, thermoregulatory and reward systems encode this state as "beneficial" and reinforce the behavior that maintains it.

  This sub-personal encoding satisfies the criteria for axiological anchoring:
  1.  **Non-derivative:** The organism does not seek warmth to achieve a further goal; the warmth is the target.
  2.  **Self-reinforcing:** The sensation promotes staying in the sun.
  3.  **Evaluative:** The biological system distinguishes this state from neutral or harmful states (e.g., burning) and weights it positively.

  Thus, the sunbather's pleasure is anchored not by a conscious judgment, but by the sub-personal "vote" of their reward circuitry. This allows us to treat phenomenal heterogeneity as genuine: the sunbather's experience is raw and non-conceptual, while the mathematician's is cognitive and conceptual. Both are pleasures because both are anchored by the relevant level of the agent's evaluative hierarchy.

  ### Distinction from Attitudinal Hedonism

  It is vital to distinguish axiological anchoring from Attitudinal Hedonism (AH). AH, championed by philosophers like Fred Feldman, argues that pleasure *is* the attitude of being pleased about something. On this view, the sensory feeling is incidental; the pleasure lies in the pro-attitude.

  Axiological anchoring differs in two crucial ways:

  **1. The Ontological Status of the Feeling:**
  AH tends to flatten the phenomenology. If pleasure is just an attitude, the "feeling" of pleasure is secondary. Anchoring maintains that the phenomenal state (the taste, the warmth, the insight) is real and distinct. The anchoring does not *constitute* the pleasure; it *identifies* which phenomenal states count as pleasures. The feeling is the anchor-point; the anchoring is the relation. This preserves the intuition that there is "something it is like" to feel pleasure that is distinct from merely judging something good.

  **2. The Nature of the Attitude:**
  In AH, the pro-attitude is often construed as a conscious propositional attitude (e.g., "I am pleased that I am eating"). Anchoring allows for non-propositional, sub-personal weighting. As argued with the sunlight example, one can have an anchored state without holding a conscious attitude *about* the state. The system treats the state as valuable without the agent necessarily endorsing it via judgment. This makes anchoring more inclusive of animal pleasure and non-reflective human experience than standard AH.

  ### Conclusion

  The heterogeneity problem dissolves when we stop looking for pleasure in the wrong place. It is not a specific flavor of experience, nor is it a loose linguistic convenience. Pleasure is a functional-axiological category defined by **axiological anchoring**. Diverse states belong to this category because they are all states that an agent's evaluative framework—whether conscious or sub-personal—treats as ends in themselves that recommend their own continuation.

  This view respects the genuine phenomenal differences between eating chocolate and solving equations, avoiding the reductionism of sensory theories. Simultaneously, it provides a rigorous structural unity that avoids the arbitrariness of family resemblance. By acknowledging that evaluative frameworks operate beneath the level of judgment, it accounts for bodily pleasures without requiring impossible cognitive feats. Finally, by distinguishing the anchored state from the anchoring relation, it preserves the phenomenological richness that attitudinal hedonism often sacrifices. Hedonism, therefore, remains viable not as a theory of a single feeling, but as a theory of a single structural role played by many feelings in the life of a valuing agent.
