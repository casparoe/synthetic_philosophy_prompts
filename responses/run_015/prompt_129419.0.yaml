answer: |-
  Here's the list I've put together for the session. I tried to keep them grounded so we don't float off into pure abstraction, plus I added those follow-ups you suggested in case she tries to dodge.

  1. **The Churchland Difference:** Paul Churchland argued folk psychology is like alchemy—a theory that's just empirically wrong. But you're saying something stronger: that predictive processing leaves *no ontological space* for beliefs, not even as bad approximations. Is the difference here just a matter of degree, or are you claiming the framework itself makes belief-talk impossible, like asking "what's the temperature of a number?"

  2. **Follow-up (if she says "that's a category mistake"):** Okay, but if predictive processing successfully predicts behavior where folk psychology fails, doesn't that make folk psychology a *wrong* category rather than a non-existent one? In ecology, we might misclassify a plant, but the plant is still there. Are you saying the plant isn't there, or just that our label is wrong?

  3. **Generative Models as Beliefs:** Your view hinges on hierarchies of precision-weighted prediction errors. But if a high-level generative model stays stable over time and guides action, isn't that functionally identical to what we've always called a "belief"? Why call it a "stable prediction" instead of a belief if it does the exact same job?

  4. **Follow-up (if she says "you're still thinking in folk-psychological terms"):** I get that, but if the functional role is identical, isn't the distinction purely semantic? If I treat that stable prediction as a belief in my daily life, does anything actually break? I'm struggling to see the ontological gap if the output is the same.

  5. **Falsification:** What specific neuroscientific result would make you abandon this view? If we found evidence that the brain doesn't minimize free energy, or that propositional attitudes map neatly onto distinct neural structures, would that change your mind, or is the view insulated from empirical refutation?

  6. **Follow-up (if she says "you're asking for belief-based confirmation"):** But science relies on evidence evaluated by agents. If I can't ask for evidence without presupposing beliefs, how do you justify your own position? Are you claiming your theory is true, or just that it's a useful error-minimizing tool?

  7. **First-Person Authority:** When I say "I believe it's raining," it feels direct and immediate, not like I'm inferring a hidden state. If there are no beliefs, where does that feeling of direct access come from? Are we all just hallucinating our own mental lives?

  8. **Scientific Reasoning:** You mentioned scientists don't have beliefs about hypotheses. But science requires holding a theoretical commitment across multiple experiments, sometimes for years. If that's not a belief, what is it? How do you explain the persistence of a theory without appealing to someone *believing* it's worth pursuing?

  9. **Desires and Action:** You eliminate desires too, right? So if I walk to the kitchen, it's not because I *want* water, but because of prediction errors regarding my internal state. But doesn't "minimizing error" just sound like "satisfying a desire" with extra steps? What actually drives the action if not a goal state?

  Hope this works for the club. I think these should keep her on her toes without getting too hostile. Let me know if you want to tweak any of the folow-up phrasing.
