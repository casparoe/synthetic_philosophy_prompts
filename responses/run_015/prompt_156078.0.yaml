  **MERIDIAN TRUST | OFFICE OF EPISTEMIC CLEARANCE**
  **COMPLIANCE CIRCULAR MEM-EC-2023-04**
  **SUBJECT: Dynamic Knowledge Attribution Protocols (DKAP)**

  **1.0 Purpose**
  Pursuant to the Pragmatic Integration Mandate, all staff are notified that knowledge attributions (hereinafter "K-Claims") are no longer static assets. Effective immediately, K-Claims are indexed to the Practical Environment (PE) of the decision node in which they are uttered. Staff must recognize that whether an employee *knows* a proposition is contingent upon the stakes involved in acting on that proposition.

  **2.0 Evidence Requirements**
  To sustain a K-Claim, evidential support must meet the Stake-to-Evidence Exchange Rate (SEER). Evidence sufficient for knowledge in low-stakes environments may fail to constitute knowledge in high-stakes environments, even if the evidence base remains unchanged.
  *   **Schedule A (Low PE):** Stakes < $10,000. Standard verification suffices for K-Claims.
  *   **Schedule B (High PE):** Stakes > $10,000. Evidence requirements increase exponentially. A 3x evidentiary multiplier applies to claims regarding liquidity solvency.

  **3.0 Stake Determination Authority**
  The Office of Epistemic Clearance (OEC) retains sole authority to designate PE levels. Staff are advised that the OEC's designation of a PE constitutes the PE for the OEC's own knowledge claims regarding that designation. Consequently, the OEC's ruling on what counts as knowledge settles the stakes required for the OEC to know the ruling is correct.

  **4.0 Epistemic Structuring**
  Clients may request the decomposition of high-stakes decisions into chains of low-stakes sub-decisions to maintain favorable K-Claim status throughout the transaction lifecycle. This service, marketed as "Epistemic Structuring," allows a client to know each step of a transfer without knowing the aggregate outcome until final settlement. This service incurs a structuring fee of 15 basis points per epistemic tranche.

  ***

  **BRANCH OPERATIONS FAQ: DKAP IMPLEMENTATION**

  **Q: May I tell a customer "I know your transfer cleared"?**
  **A:** No. The phrase "I know" is withdrawn from approved scripts due to its sensitivity to unstated contextual variables. Use: "Your transaction holds provisional epistemic standing relative to current stakes."

  **Q: A customer's evidence hasn't changed, but their standing dropped. How do I explain this?**
  **A:** Cite Section 5.2 (Classified-Stakes Provision). Do not disclose the specific risk factors lowering their standing. Disclosure would alter the PE, potentially invalidating the explanation itself.

  **Q: Can a customer ever determine if they know their funds are secure?**
  **A:** Not definitively. Under the Classified-Stakes Provision, the criteria for knowledge are non-disclosable security information. Assurance requires trust, not knowledge. If they knew the stakes, the stakes would change, and they would no longer know.

  **Q: What if the customer argues they had knowledge yesterday?**
  **A:** Remind them that knowledge is not a permanent property of the believer. It is a relation between believer, evidence, and environment. The environment has updated.

  ***

  **DISCIPLINARY RECORD: EMPLOYEE 8940**
  **VIOLATION: FALSE KNOWLEDGE ATTRIBUTION**

  **Incident Summary:**
  On Monday, 09:00, Employee 8940 confirmed to a client that she *knew* the client's account held sufficient liquidity to cover a pending withdrawal. On Friday, 16:00, an audit revealed Employee 8940 lacked knowledge of the same liquidity position.

  **Employee Defense:**
  The employee submitted that her evidence base (account balance screenshot) was identical on Monday and Friday. She argues that if she knew on Monday, she must know on Friday.

  **OEC Ruling:**
  Defense rejected. While evidence remained constant, the Practical Environment shifted. Proximity to the weekend increased the stakes regarding liquidity risk and fraud exposure. Consequently, Monday's evidence sufficed for knowledge; Friday's did not. The employee failed to downgrade her assertion from "know" to "suspect" by 17:00 Friday.

  **Sanction:**
  Mandatory recalibration training. Employee is prohibited from making K-Claims until further notice.

  ***

  **Apparatus Note**

  The satire targets "pragmatic encroachment" (e.g., Stanley, Fantl & McGrath) and "epistemic contextualism" (e.g., DeRose, Cohen). Contextualism holds that the word "knows" changes meaning with context; encroachment holds that knowledge itself depends on stakes. Both agree that high stakes make knowledge harder to attain. The "knowledge norm of assertion" (Williamson) suggests one should only assert what one knows; the bank enforces this literally. The "Classified-Stakes" joke exaggerates the idea that stakes are objective but opaque. The self-referential knot parody's the difficulty of defining stakes without circularity. While empirical data suggests ordinary language use shifts with stakes, whether this is semantic or metaphysical is contested. The bank treats a philosophical debate as an administrative toggle.

  **Table of Doctrinal Exaggerations**

  | Section | Doctrine_sent_up | Real_feature_exaggerated | Liberties_taken | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | Circular 1.0 | Pragmatic Encroachment | Knowledge depends on practical stakes. | Treats stakes as administratively adjustable variables. | Contested (Metaphysics vs. Semantics) |
  | Circular 2.0 | Evidence/Stakes Trade-off | Higher stakes require more evidence for knowledge. | Quantifies evidence into a "3x multiplier." | Contested (No consensus on scaling) |
  | Circular 3.0 | Contextualism | Attributor context sets standards. | The Office sets the context by fiat, creating a loop. | Contested (Who fixes the context?) |
  | Circular 4.0 | Epistemic Structuring | Knowledge is partitionable across decisions. | Markets partitioning as a fee-generating financial product. | None (Logical extension of view) |
  | FAQ Q2 | Classified-Stakes | Stakes determine knowledge status. | Hiding stakes prevents subject from knowing status. | Contested (Subject-sensitive invariantism) |
  | FAQ Q3 | Skeptical Pressure | High stakes induce skepticism. | Makes knowledge impossible to verify by design. | Liberties_taken (View doesn't require impossibility) |
  | Case File | Temporal Stakes | Stakes change over time (weekend risk). | Identical evidence yields knowledge then loses it. | Settled (Core claim of encroachment) |
  | Case File | Knowledge Norm | Assert only what you know. | Discipline for asserting what was true but unknown. | Contested (Is knowledge the norm?) |
  | Circular 3.0 | Self-Reference | Standards apply to the standard-setter. | Office rulings create the stakes they measure. | Liberties_taken (Vicious circularity implied) |
  | FAQ Q1 | Scripting | "Knows" is dangerous in high stakes. | Total ban on the word "know" in compliance. | Liberties_taken (Pragmatics vs. Prohibition) |
