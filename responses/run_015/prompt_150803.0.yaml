  Based on the pattern of her past behaviors, here is the map of her logic, the prediction for her vote, and the test case to verify it.

  ### The Verdict
  She votes to **Ban** the kits.

  ### The Underlying Rule: "Visible Agency over Invisible Biological Risk"
  Her logic isn't about "risk vs. safety" in a general sense; it's about **controllability** and **tangibility**, specifically regarding **biological/chemical threats**.

  She consistently takes action when two conditions are met:
  1.  **The threat is biological or chemical** (Viruses, toxins, bacteria). She ignores physical or statistical risks (floods, bike crashes, 5G waves).
  2.  **She has direct, visible agency to mitigate it.** She trusts her own actions (masks, boycotting plastic, generator) or the visible competence of a specific individual (the food truck chef). She distrusts systemic assurances (health inspections at nice restaurants, building age for floods) and invisible/ambient threats she can't block (5G).

  ### How the Rule Applies to the Gene Kits
  *   **Threat Type:** It involves modifying bacteria and potential pathogens. This falls squarely into her **Bio/Chem Fear Zone** (like masks, plastic, oysters). She will not dismiss this as "hypothetical" like she did with 5G.
  *   **Agency:** This is the dealbreaker. With plastic, she can choose not to buy it. With masks, she can choose to wear one. With the food truck, she can *see* the chef. With home gene kits, the risk is a **negative externality**: a neighbor's mistake creates a pathogen that can spread to her regardless of her own caution. She cannot "mask" forever against a lab-engineered superbug, and she cannot inspect her neighbors' labs like she inspected the food truck chef.
  *   **Conclusion:** Because the risk is biological *and* outside her personal control, her heuristic triggers maximum caution. She will support a ban to remove the uncontrollable variable.

  ### The Closest Analog: Refusing Oysters at the Nice Restaurant
  This is the strongest parallel.
  *   **The Situation:** A biological risk (raw oysters) managed by a system (restaurant health codes) vs. an individual (food truck chef).
  *   **Her Choice:** She refused the "system-safe" option (nice restaurant) because the process was hidden. She only accepted the risk when she could visually verify competence (the truck chef).
