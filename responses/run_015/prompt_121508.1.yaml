answer: |-
  title: frictionless

  it's 3 am and the kitchen light is buzzing like a trapped fly. i'm staring at a glass of water on the counter. maybe three feet away.

  inside my head, it's not dark. it's the careenium. that's what i'm calling it anyway, this hollow cylinder spinning in the dark of my skull. inside are the simmballs. they're glowing little nodes of meaning, bouncing off the walls, off each other.

  there's a heavy blue one labeled THIRST. it's rolling slow, picking up momentum. there's a jagged red one called ARM-MECHANICS. and hovering near the center, the one i'm trying to grab: WILL.

  in class, mr. henderson said the simmballs might just be epiphenomena. like foam on a wave. the wave moves because of wind and gravity (the careenium, the neurons, the physics), and the foam just rides on top. the foam doesn't push the water.

  i decide to test it.

  i focus on the WILL simmball. i try to make it heavy. i try to make it sticky. i want to throw it at the ARM-MECHANICS ball so they collide, spark, and send the signal down my spine to reach out.

  *move,* i think. *reach.*

  the WILL ball floats. it bumps against the wall of the careenium. it doesn't dent the wall. it doesn't push anything. it just bounces back, frictionless.

  and then my hand moves.

  it's smooth. automatic. my fingers curl around the glass. i lift it. i drink.

  but i didn't feel the push. that's the thing. i felt the *idea* of pushing, i felt the simmball labeled CHOICE light up, but it was like watching a shadow punch a wall. the wall doesn't feel the shadow. the muscle fired because the chemistry was already there, the neurons were already firing in a chain that started seconds before i even thought the word "reach."

  the simmballs are just describing what the careenium is already doing.

  i set the glass down. hard. a clink.

  i try to name them again, faster. ANGER. REGRET. STOP.

  the ANGER ball spikes up, hot pink. it bounces wildly. but did it cause my heart rate to spike? or did my amygdala fire, dump adrenaline into the careenium, and the ANGER ball just lit up because that's the symbol for this state?

  if the symbols don't causally push anything, then what am i?

  i look at my hand. it's sitting on the table. i wait for it to twitch. i wait for me to tell it to twitch.

  nothing. then it twitches.

  where did that come from? the substrate. the meat. the careenium grinding along on laws of physics i don't control. the simmballs are just a report. a live feed of a machine running itself.

  it makes the consent thing feel weird. like, if i decide to apologize to my mom tomorrow, is that me choosing? or is that just the WILL ball lighting up because the careenium was always going to wind up in that configuration?

  if the symbols don't push, i'm not the driver. i'm the dashboard.

  i watch the THIRST ball settle down. it's not gone, just dormant. i wonder if it chose to sleep, or if the water just changed the substrate enough that the symbol doesn't fit anymore.

  i blink. the careenium shifts. the simmballs scatter.

  i didn't tell them to.
