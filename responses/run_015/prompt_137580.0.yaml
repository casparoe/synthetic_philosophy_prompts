answer: |-
  **MEMORANDUM**

  **TO:** The Members of the Rules Committee
  **FROM:** [Your Name]
  **DATE:** 9 April 2025
  **SUBJECT:** Validity of Motion 3/24 ("Institutional Membership Resolution")

  **1. Purpose**

  We meet this Friday, 11 April, to determine questions of order regarding Motion 3/24 ahead of its second reading in June. Following extensive discussion with colleagues outside this Committee, I have concluded that we cannot defer this decision. We must provide a ruling on the motion's validity under the current Charter. This memorandum sets out my reasoning and my recommendation for the Committee's vote.

  **2. The Core Legal Question**

  The question is whether Article IV (the general amendment procedure) can be used to amend Article IV itself in a way that removes the protections afforded to Articles I–III by Article IX, and thereby allow Article III to be amended by a two-thirds majority rather than the three-quarters required by Article IX.

  The proposers argue that Article IV §2 permits the amendment of Article IV, and that once Article IV is amended to remove the restriction, Article III may be amended under the new procedure. They contend that Article IX is merely a creature of Article IV and cannot restrict the power that created it.

  **3. Analysis of Article IX and Article IV**

  Article IX was validly adopted in 1998 under the then-unrestricted Article IV procedure. At that moment, the Assembly exercised its power to limit its own future power regarding Articles I–III. That limitation is now part of the Charter. It is not a historical curiosity; it is current law.

  Article IX contains two distinct commands:
  1.  Articles I–III may be amended *only* by the specific three-quarters procedure.
  2.  No amendment of *any other Article* (which includes Article IV) shall have the *effect* of amending, repealing, or disapplying Articles I–III.

  The proposers' "two-step" strategy fails on the second command. Amending Article IV to remove the protection of Articles I–III has the direct *effect* of making Articles I–III amendable by a lower threshold. This violates the explicit prohibition in Article IX against using amendments to other Articles to affect Articles I–III.

  To hold otherwise would render Article IX null. If Article IV could be used to dismantle Article IX, then Article IX protects nothing. The 1998 Assembly intended to protect Articles I–III from simple supermajorities. We must give effect to that intention while Article IX remains part of the Charter. It cannot be repealed or bypassed by the procedure it restricts.

  **4. Addressing the Counter-Argument**

  I have considered the argument that there is a symmetry between Article IX's entrenchment and Motion 3/24's circumvention. The argument posits that if the 1998 Assembly could bind successors, the current Assembly should be able to unbind them using the same tool (Article IV).

  This symmetry is illusory. The 1998 Assembly acted when Article IV was unrestricted. They used that unrestricted power to create a restriction. Once created, the restriction limits the power. The current Assembly acts under a restricted power. They are not in the same position as the 1998 Assembly. To allow the current Assembly to use Article IV to remove Article IX is to allow them to exercise a power they do not possess.

  Regarding Clause (d) (the notwithstanding clause): This clause attempts to declare the motion valid regardless of Article IX. A resolution cannot validate itself by fiat. If the procedure is invalid under the Charter, a clause stating "this is valid" does not cure the defect.

  Regarding the paradox of self-reference: We need not resolve whether Article IX protects itself. We need only resolve that Article IX protects Articles I–III. Motion 3/24 Clause (c) amends Article III. Clause (a) and (b) facilitate that amendment by removing the protection. This combined effect violates Article IX's prohibition on using other Articles to affect Articles I–III.

  **5. Amendment vs. Replacement**

  We must also confront whether admitting institutional members with voting rights is an "amendment" within the meaning of the Charter. Article III §1 defines the Society as open to "individual persons only." This is a defining characteristic of the association founded in 1911.

  While the Charter provides a mechanism for amendment, there is a distinction between changing a rule and changing the fundamental nature of the body governed by the rule. Article IX recognizes this distinction by affording Articles I–III special protection. To change the Society from a body of individual scholars to a body including corporate voters is to constitute a different association under the same name. While the Charter allows amendment, the specific protection in Article IX acknowledges that some changes are so fundamental they require a higher consensus (three-quarters) than ordinary structural changes (two-thirds). Using the lower threshold to effect a fundamental transformation undermines the specific safeguard designed for this purpose.

  **6. The Committee's Authority**

  Article VI §3 grants us authority to determine questions of order, "subject to any resolution of the Assembly passed under Article IV." Some argue this means we should not rule against the motion because the Assembly could override us.

  This misunderstands the provision. It means our ruling is subject to a *valid* resolution. If the motion is invalid under the Charter, the Assembly cannot pass a valid resolution using that motion. Our duty is to interpret the Charter as it stands. If we decline to rule because the Assembly might ignore us, we abdicate our function. We must state what the Charter requires. If the Assembly wishes to override us, they must pass a valid resolution under Article IV that does not violate Article IX—which is precisely what this motion fails to do.

  **7. Recommendation**

  I recommend the Committee adopt the following ruling:

  *   **Clause (a) (Amending Article IV):** Out of order. Violates Article IX prohibition on amending other Articles to affect Articles I–III.
  *   **Clause (b) (Repealing Article IX):** Out of order. Violates Article IX protection of the amendment procedure for Articles I–III.
  *   **Clause (c) (Amending Article III):** Out of order under Article IV. Requires procedure under Article IX.
  *   **Clause (d) & (e):** Ineffective if substantive clauses are out of order.

  **Course of Action:**
  1.  **Immediate:** Circulate this ruling to the Council and the motion's proposers by Friday 11 April.
  2.  **June Meeting:** Advise the Chair that Motion 3/24 cannot proceed to second reading in June as framed. It is not a valid Article IV motion.
  3.  **Alternative Route:** Invite the proposers to submit a new motion under Article IX.
  4.  **Timetable:** Article IX requires 90 days' notice of the meeting. The June meeting notice has already been issued. Therefore, the earliest possible meeting for an Article IX resolution is September. The Secretary should be instructed to include notice of any such motion in the summons for the September ordinary meeting.

  **8. What Would Change This**

  **The Single Argument:** My recommendation turns on the interpretation of the phrase "have the effect of amending" in Article IX. If one interprets this phrase to mean *only* direct textual alteration of Articles I–III, and not the procedural enabling of such alteration via Article IV, then Clause (a) is valid, Article IX is repealed, and Clause (c) becomes valid.

  **Point of Probable Error:** I acknowledge the risk that this distinction is too formalistic. If the Committee believes that the power to amend Article IV (§2) is absolute and cannot be substantively limited by a previous resolution (Article IX), then my ruling is wrong. The error lies in assuming a past Assembly can bind a future Assembly regarding the amendment power itself. However, given the explicit text of Article IX and the 2014 precedent where Article IX was held to bite, I believe the binding interpretation is the safer and more legally sound course.

  **Bottom Line:** Rule the motion out of order. Direct the proposers to the Article IX procedure for a September vote. This preserves the integrity of the Charter while providing a viable path for the proposal if it can secure the necessary consensus.
