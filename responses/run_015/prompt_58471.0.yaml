      *Wait, one more check:* Is there a way to support Proposal 1 but mitigate the senior quit risk? The prompt says seniors "have said they will likely quit." If the VP votes Proposal 1, and seniors quit, the VP is responsible for the program death. If VP votes Proposal 2, they preserve the program but accept inequality.
      *Ethical Leadership:* Sometimes leadership means making the unpopular choice that saves the organization.
