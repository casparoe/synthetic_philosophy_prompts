  **OFFICE FOR TEMPORAL STANDARDS**
  **Practice Direction No. 4: The Moral Assessment of Historical Conduct**

  **Preamble**
  Pursuant to the powers conferred by the Chronological Integrity Act 1998, the Office for Temporal Standards (the Office) hereby issues this Direction to all persons engaged in the writing, teaching, or dissemination of historical narrative. The purpose of this Direction is to eliminate temporal bias, specifically the imposition of contemporary ethical frameworks upon past epochs (hereinafter 'Presentism'). It is incumbent upon all accredited institutions to ensure that moral evaluation remains strictly bound within the temporal coordinates of the Subject Period. Failure to comply constitutes a breach of professional accreditation.

  **1. Defined Terms**
  1.1 'Historical Actor' refers to any individual or collective entity operating within the Subject Period.
  1.2 'Contemporaneous Normative Framework' (CNF) refers to the ethical, legal, and social standards operative at the time and place of the Historical Actor's conduct.
  1.3 'Assessing Historian' refers to any individual producing historical analysis subject to Office regulation.

  **2. Determination of the Contemporaneous Normative Framework**
  2.1 Where evidence suggests multiple, conflicting normative frameworks existed within the Subject Period, the Assessing Historian shall identify the CNF by reference to the sovereign authority.
  2.2 The standards actually enforced by the holding power shall constitute the definitive CNF. Dissident, minority, or suppressed ethical systems shall not be utilised as a basis for assessment unless adopted by the sovereign authority.
  2.3 This provision applies regardless of the moral content of the sovereign authority's directives. This ensures objective stability in historical grading and prevents the retroactive elevation of unsuccessful moral claims.

  **3. Categorisation of Conduct**
  3.1 Historical Actors shall be described using the taxonomy employed by the Actor themselves or their immediate contemporaries.
  3.2 Assessing Historians are prohibited from applying retrospective sociological or ethical categories (e.g., 'oppressor', 'liberator') unless such terms were in legal or common usage within the CNF.
  3.3 Conduct must be evaluated against the intentions declared by the Actor, rather than the consequences observed by the Historian.

  **4. Deviation from the Normative Framework**
  4.1 Conduct aligning with the CNF shall be recorded as 'Compliant'.
  4.2 Where a Historical Actor adopted ethical positions significantly more rigorous than the CNF, such conduct shall be classified as 'Normatively Disruptive'.
  4.3 Assessing Historians must note that such disruption often undermined social cohesion and legal certainty within the Subject Period. Virtue exceeding the CNF is to be treated as a destabilising variable.

  **5. Graduated Permissibility of Judgement**
  5.1 Moral adjectives applied to Historical Actors must correspond to the elapsed time between the Subject Period and the date of publication, as per Schedule A.
  5.2 This grading ensures that emotional resonance diminishes proportionally to temporal distance.

  **6. Enforcement and Compliance**
  6.1 The Office shall monitor all Assessing Historians for compliance with this Direction.
  6.2 Compliance by Assessing Historians shall be measured against the Office's Current Code of Professional Conduct.

  **7. Commencement and Transitional Provisions**
  7.1 This Direction comes into force immediately upon publication.
  7.2 All existing historical texts used in accredited teaching programmes must be annotated to reflect these standards within twelve months.

  **Schedule A: Permissible Moral Adjectives by Elapsed Time**
  | Years Elapsed | Permissible Severity | Approved Terminology |
  | :--- | :--- | :--- |
  | 0 – 50 | None | 'Contextually situated' |
  | 51 – 200 | Low | 'Regrettable', 'Unfortunate' |
  | 201 – 500 | Moderate | 'Suboptimal', 'Inefficient' |
  | 500+ | High | 'Primitive', 'Developing' |

  **Annexe: Worked Examples**

  **Example 1: The Governor of Northern Antipodia**
  The Governor enforced labour conscription laws valid under the Antipodian Crown. Although modern observers might object, the CNF recognises the Crown's authority. The Governor is 'Compliant'. A petitioner arguing the Governor violated 'universal rights' is rejected, as no such rights existed in the CNF. The Historian must record the conscription as 'Contextually situated'.

  **Example 2: The Merchant of Veltria**
  The Merchant refused to participate in state-mandated exclusionary practices, citing personal conscience. While ethically rigorous, this violated the CNF. The Merchant is classified as 'Normatively Disruptive'. The Assessing Historian must record that the Merchant's conduct threatened local economic stability and legal uniformity. The Merchant's conscience is irrelevant to the assessment.

  **Example 3: Teaching Materials**
  A textbook describing a past sovereign as 'tyrannical' must be amended. 'Tyrannical' is a retrospective category. The text shall read 'exercising sovereign prerogatives consistent with the CNF'. Students must be instructed that judgement is permissible only according to Schedule A. Assessment questions requiring moral condemnation of past actors are prohibited unless licensed by the Office.

  **Signed,**
  **R. H. Thorne**
  **Director of Temporal Compliance**
  **Office for Temporal Standards**

  ***

  **Note on the Satire**

  This piece satirises the strict prohibition of presentism in historical method, specifically the demand that historians suspend moral judgement of past actors. By applying the rule against anachronism consistently, the document generates absurdities: it privileges power (whoever enforced norms defines them), silences dissenting voices within the past, and condemns moral pioneers as 'disruptive'. The pivot is Clause 6.2, where the Office exempts itself, judging living historians by present standards while forbidding them to judge the past. The strongest reply for the non-judgemental historian is that contextual understanding prevents caricature and fosters empathy across time. However, the satire overstates the case by implying historians seek to abolish all context; most argue for a dialectic between past and present values, rather than total moral abdication or unchecked condemnation.
