prompt: |-
  hey — retired physicist here, finally poking around in phil of science after forty years in teh lab. i'm auditing a grad seminar on induction and the prof asked me to draft a take-home essay for the students. i want one question on Wolpert's no-free-lunch theorems and Hume's problem, but not the stock "explain Hume then explain Wolpert" thing that every model can regurgitate. instead, present the students with a specific argument i'll call the "uniform prior argument":

  (1) NFL proves that, averaged over a uniform distribution of all possible target functions f: X → Y, every learning algorithm has identical expected performance.
  (2) Hume's challenge is that we lack non-circular justification for expecting nature to be uniform.
  (3) If we read Hume's "uniformity of nature" as the claim that the true function belongs to some restricted subset S, then justifying S requires an inductive prior.
  (4) But NFL shows that any restriction to S is just adopting a non-uniform prior, and without independent justification for that prior we are back in Hume's circle.
  (5) So NFL doesn't solve induction; it formalizes Hume's worry — any successful learner succeeds only by smuggling in an inductive bias that itself needs justification.

  the exam should ask students to evaluate this argument in about 800 words, with 90 minutes. they should specifically address: (a) whether there's a hidden slide between "all possible target functions" in the mathematical sense and "all physically possible worlds" or computable functions; (b) whether NFL applies to real-world induction once physical symmetries constrain the problem space; (c) whether accepting NFL actually strengthens Hume or misapplies a result about search algorithms to epistemic justification; and (d) whether a "local" or domain-restricted version of NFL saves the argument.

  please write the exam question, a model answer of about 800 words, and a marking scheme out of 20 marks. the scheme should separate an A from a B by naming the specific moves an A must make — for instance, identifying the scope ambiguity in step (3) to (4), explaining why physical constraints don't automatically provide the needed prior, and showing why the skeptical conclusion in (5) overreaches. also list the common mistakes that should cost marks, like conflating optimization algorithms with epistemic agents, or thinking NFL applies only to machine learning and not to human reasoning. keep it casual — i don't mind a typo or two — and don't ask for bibliographies, citations, or reading lists since some of the auditors don't have library access. inject the framing above so it can't be answered by just summarizing standard texts.
