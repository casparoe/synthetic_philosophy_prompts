answer: |-
  **TO:** Academic Standards Committee, Faculty of Health Sciences
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: AI Decision-Support and Assessment Standards

  **Purpose**
  This memo seeks a committee decision regarding the assessment standards for the Master's programme in Advanced Clinical Practice, specifically concerning the use of AI clinical decision-support tools during evaluated stations. We must determine whether to maintain the current policy, adopt the proposed perturbation standard, or pursue an alternative path, while addressing accommodations, cohort fairness, and regulatory uncertainty.

  **The Case for the Opposite Recommendation**
  Before advancing a proposal, I must articulate the strongest case against adopting the perturbation standard, as it reveals the genuine tension in our mandate. The analogy offered by our colleague regarding instrument-rated pilots is compelling. Modern aviation safety relies on automation; pilots who rely on instruments are statistically safer than those attempting manual flight, even if their manual stick-and-rudder skills degrade. If the clinical environment of our graduates will always include this decision-support tool, requiring them to demonstrate unassisted boundary knowledge may be akin to requiring a pilot to land manually in clear skies when the autopilot is certified for all conditions. The goal of certification is patient safety and effective practice, not the preservation of cognitive calisthenics for their own sake.

  Furthermore, we must scrutinize the concern regarding "credential drift." Is the award ceasing to track what it used to track a real harm, or merely nostalgia for a previous technological epoch? If the profession accepts the tool, and the tool produces better patient outcomes than unassisted judgement, then an award that certifies tool-assisted competence is arguably *more* fit for purpose than one certifying obsolete independence. To insist on the "tether" Plato describes in the *Meno* risks privileging the form of knowledge over the utility of the outcome. If the statue stays put, does it matter that it is untethered? The strongest argument against my leaning is that we may be solving a philosophical problem rather than a clinical one, potentially raising barriers to entry without a corresponding increase in public safety.

  **Load-Bearing Considerations**
  My position rests on two load-bearing considerations: first, the university's existing award descriptor explicitly requires graduates to "account for their decisions to colleagues and patients," which constitutes a contractual definition of the degree regardless of professional norms; second, the sub-study evidence suggests that heavy tool users fail to recognize when the tool is wrong, which presents a tangible patient safety risk distinct from manual skill degradation. I am setting aside as undecidable at this stage the national regulator's upcoming decision; while alignment is desirable, our academic standards cannot be held in abeyance pending external validation, nor should they drop below the faculty's own definition of accountability. The regulator's outcome will dictate licensing, but it does not dictate our academic integrity.

  **Recommendation**
  I recommend that the committee **adopt the perturbation standard in a modified form**, with a phased implementation timeline.

  1.  **Adoption:** The programme shall require candidates to demonstrate the ability to identify boundary conditions where management changes and to flag incorrect AI recommendations. This aligns the assessment with the award descriptor's accountability clause.
  2.  **Current Cohort:** The standard shall **not** apply retroactively to the twenty-three mid-programme students. They entered under a specific regulatory framework where tool reliance was unqualified. Applying a new failure condition now would be procedurally unfair. However, they should be offered optional workshops on AI boundary limitations to ensure their practice safety without tying it to their award eligibility.
  3.  **Future Cohorts:** The standard applies to all students entering after the upcoming academic year. This provides clear notice and allows curriculum adjustment.

  **Administration and Accommodations**
  The primary obstacle to the perturbation standard is the reliance on oral examination, which conflates clinical boundary knowledge with English fluency and oral processing speed. This violates our accommodation obligations. To remedy this, the perturbation assessment must be decoupled from the oral viva.

  I propose a **Written Perturbation Log** administered alongside the clinical stations. Instead of asking a student to verbally articulate what would change the management plan, the assessment instrument will present a set of multiple-choice perturbations (e.g., "If the patient's renal function dropped by 50%, would you: A) Increase dose, B) Switch drug, C) Maintain course"). Students must select the correct management shift and identify the specific guideline threshold triggering it. For the requirement to flag wrong AI recommendations, students will review a set of AI-generated plans for varied cases and mark those containing errors, providing a brief written justification referencing the conflicting data point. This measures the cognitive boundary knowledge without penalizing language processing speed or speech fluency, satisfying accommodation requirements while maintaining rigor.

  **Regulatory Contingencies**
  We should not wait for the national regulator's decision. Our timeline must proceed independently for two reasons. First, if the regulator permits AI in licensing examinations without a perturbation requirement, our higher standard distinguishes our graduates as possessing deeper oversight capability, enhancing the value of the award. Second, if the regulator bans AI in licensing, our students will already be trained to understand the tool's limitations rather than relying on it blindly, making them better adaptable to a tool-free environment than those who have never been tested on the tool's logic.

  However, we must build a review clause into this decision. Should the regulator mandate a specific format for AI assessment that conflicts with our perturbation log, the programme director must report back to this committee within thirty days of the regulator's announcement to adjust the administration method. We are setting the standard of *what* must be known (boundary conditions and error detection), not rigidly locking the *how* against future regulatory constraints.

  **Conclusion**
  The evidence suggests that AI tools are not merely additive; they are substitutive. When they substitute for the ability to recognize error or boundary conditions, they undermine the accountability clause of our award descriptor. This is not nostalgia; it is a defense of the specific credential we offer. By adopting a modified perturbation standard that utilizes written rather than oral assessment, we protect the integrity of the degree, accommodate diverse learner profiles, and ensure patient safety without waiting for external validation. I move that we approve this modified standard for implementation in the next academic year.
