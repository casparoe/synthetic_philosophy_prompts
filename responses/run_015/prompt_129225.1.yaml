      *   *Synthesis:* It's plumbing *unless* the lack of plumbing makes the promise meaningless. A promise you can't verify is a promise you can't know was kept. If you claim credit for the trade without knowing they held up their end, that's dishonesty. So it's a precondition for moral validity.

