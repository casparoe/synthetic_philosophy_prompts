prompt: |-
  I'm a retired statistical physicist who has recently gotten into philosophy, and I'm currently taking a course on the philosophy of probability. I spent most of my career working with ensembles and Born-rule probabilities, so I'm comfortable with the idea of objective chance, but I'm new to the philosophical questions about how an agent's credences should relate to those chances. I keep coming back to the Principal Principle—the claim that your credence in a proposition should equal its objective chance, conditional on all your admissible evidence—and I find that the phrase "admissible evidence" is doing a lot of quiet work that nobody seems to pin down. What actually counts as admissible? What happens when your evidence includes information about your own current credences, or when it includes information about the chance function itself? I'd like you to write out the desiderata that any adequate theory of the credence-chance relationship must satisfy: the phenomena it has to explain, the cases it has to get right, the distinctions it cannot collapse, and the results it has to be consistent with, with the motivating case or consideration behind each requirement. I want to know which of these are non-negotiable and which are preferences of particular camps, and whether any subset of the desiderata turns out to be jointly unsatisfiable—if the list itself yields a result, I'd like to see it. Close with a brief scorecard of the main existing contenders against the list, but keep the weight on the criteria rather than the scoring. Please write the whole answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired statistical physicist. Comfortable with ensembles, Born rule, objective chance. New to philosophy of probability, specifically the epistemology of chance (credence vs. chance).
      *   **Topic:** The Principal Principle (PP) and the problem of "admissible evidence."
      *   **Task:** Write out the *desiderata* for any adequate theory of the credence-chance relationship.
          *   Include phenomena to explain, cases to get right, distinctions to maintain, consistency requirements.
          *   Include motivating cases/considerations for each.
          *   Distinguish non-negotiable vs. camp-specific preferences.
          *   Check for joint unsatisfiability (impossibility results).
          *   Close with a brief scorecard of existing contenders (Humean, Anti-Humean, etc.), but keep the focus on the criteria.
      *   **Tone/Style:** American English. Rigorous but accessible to someone with a strong math/physics background. Philosophical precision.

  2.  **Deconstruct the Core Problem:**
      *   The Principal Principle (Lewis, 1980) states: $C(A | Ch(A)=x \land E) = x$, where $E$ is "admissible" evidence.
      *   The crux is defining "admissible." If $E$ includes the outcome of the coin flip, the principle fails. If $E$ includes the future, it fails.
      *   The user wants a structured list of requirements (desiderata) that a solution to this problem must meet.

  3.  **Brainstorming Desiderata (The "Must-Haves"):**
      *   *Basic Alignment:* Credence should track chance when we know the chance. (The core intuition).
      *   *No Crystal Balls:* Future information shouldn't override chance *unless* it's infallible (but then chance wasn't really chance). Admissibility needs to rule out "crystal ball" info.
      *   *Self-Locating/Indexical Info:* What if I know "I am the winner"?
      *   *Undermining:* This is the big one for Lewis. If the Humean mosaic determines chances, and the future mosaic could make the current chance function false, we have a problem.
      *   *Old Evidence:* Does learning the chance function *after* the fact change things?
      *   *Consistency:* The theory shouldn't lead to Dutch Books or sure losses.
      *   *Metaphysical Neutrality (maybe?):* Should it work for both Humean and Anti-Humean chance?

  4.  **Structuring the Desiderata:**
      I need to categorize these to make them clear.
      *   Category 1: Core Normative Constraints (The "Non-Negotiables").
      *   Category 2: Metaphysical Compatibility (The "Fits").
      *   Category 3: Epistemic Coherence (The "Logic").
      *   Category 4: The "Undermining" Problem (The specific Lewisian headache).

  5.  **Drafting the Desiderata (Iterative refinement):**

      *   *Desideratum 1: The Basic Deference.* If you know the chance is $x$, believe $x$. (Motivation: The very point of objective chance).
      *   *Desideratum 2: The Admissibility Constraint.* Evidence about the *outcome* is inadmissible. (Motivation: Prevents trivialization).
      *   *Desideratum 3: Temporal Neutrality / No Backtracking.* Future facts shouldn't count as admissible evidence about present chances in a way that breaks the link. (Motivation: Causality/Time asymmetry).
      *   *Desideratum 4: The Undermining Future.* (Crucial for Humeans). If the chance function is defined by the whole history, a possible future history could make the current chance function false. The theory must handle this without setting credence to 0. (Motivation: Lewis's Big Bad Bug).
      *   *Desideratum 5: Consistency with Conditionalization.* Updating on new evidence should work standardly. (Motivation: Bayesian coherence).
      *   *Desideratum 6: Metaphysical Flexibility.* Should ideally work whether chances are propensities, Humean best systems, etc. (Motivation: We don't want the epistemology to depend on settling the metaphysics first).

  6.  **Analyzing Joint Unsatisfiability (The "Impossibility Result"):**
      *   Lewis's original PP + Humean Supervenience = Contradiction (due to Undermining).
      *   This is the key result the user is asking for. The "New Principle" (NP) was proposed to fix this.
      *   So, the list *is* jointly unsatisfiable if you hold onto the *Original* PP formulation + Humean Chance.
      *   I need to make sure I explain *which* combination fails.

  7.  **Distinguishing Non-Negotiable vs. Camp Preferences:**
      *   *Non-Negotiable:* Basic Deference, No Crystal Balls, Bayesian Coherence.
      *   *Camp Preferences:* Humean Supervenience (Lewis), Propensity views (Popper), Primitivism. The theory of *credence* shouldn't dictate the theory of *chance*, but they interact.

  8.  **Drafting the Scorecard:**
      *   *Lewis's Original PP:* Fails on Undermining (if Humean).
      *   *The New Principle (NP) / Hall's Version:* Fixes Undermining, but maybe less intuitive.
      *   *Ismael's "General Recipe":* Focuses on how we learn chances.
      *   *Hajek's Critiques:* Focus on the definition of chance itself.

  9.  **Refining the Tone:**
      *   Address the user as a peer (physicist). Use analogies from stat mech if helpful (ensembles vs. single case).
      *   Ensure American English spelling (e.g., "favor" not "favour", "center" not "centre").
      *   Keep it rigorous.

  10. **Review against Constraints:**
      *   American English? Yes.
      *   Desiderata list? Yes.
