answer: |-
  The case of Mercury's perihelion shift stands as the canonical test for Bayesian epistemology's "old-evidence problem." In 1859, Le Verrier established that Newtonian mechanics failed to account for 43 arcseconds per century of precession; by November 1915, Einstein derived this exact figure from his new field equations. The Bayesian puzzle is stark: if evidence $E$ is already known with certainty ($P(E) = 1$), standard conditioning implies $P(H|E) = P(H)$. Logically, the data cannot confirm the hypothesis because the data was never in doubt. Yet, historically, this derivation was the moment General Relativity (GR) became credible.

  On the **logical Bayesian view**, matching old data looks like post-hoc accommodation. If the probability of the evidence is maximal, the likelihood ratio is unity, and no belief revision occurs. This suggests strict logical Bayesianism is silent on why Einstein's calculation mattered epistemically. However, the **subjective Bayesian view** rescues confirmation by shifting the locus of uncertainty. For Einstein, the uncertainty wasn't about the 43 arcseconds themselves, but about whether his theory $H$ entailed $E$. The "new evidence" wasn't the number, but the logical relation ($H \vdash E$). When he finished the calculation, he updated not on $E$, but on the fact that $H$ successfully captured $E$.

  Mapping the agents clarifies where the updates happen:
  1.  **Einstein (Nov 1915):** His prior on GR was likely low given the mathematical difficulty and physical radicalism. He knew $E$ was true ($P(E)=1$), but he did not know $P(E|H)$. Once the calculation showed $P(E|H) \approx 1$, his credence in $H$ spiked. The update was on the *connection*, not the *content*.
  2.  **The Berlin Crowd (Planck, Hilbert):** They knew $E$ and were skeptical of $H$. For them, confirmation came from comparing $H_{GR}$ against $H_{Newton}$. Newton required ad-hoc auxiliaries (like Vulcan) to fit $E$, whereas GR fit $E$ naturally. Their update was driven by comparative likelihoods and theoretical virtues, not just $E$ in isolation.
  3.  **The Modern Reader:** We know $H$ is accepted. For us, the confirmation is historical. We risk hindsight bias, treating $P(E)$ as trivial. To reason rationally, we must reconstruct the context where $H$ was risky.

  Einstein's emotional reaction—heart palpitations, feeling he was "beside himself with joy"—fits poorly into standard Bayesian machinery, which models credence, not affect. Bayes tells us *that* belief should change, not *how it feels*. His excitement suggests scientists update on **explanatory coherence** and **risk-taking**. The value wasn't just fitting the number; it was fitting a stubborn anomaly without tuning parameters. This aligns with Inference to the Best Explanation (IBE) more than pure Bayes. The theory could have easily yielded 40 or 45 arcsecconds, which would have falsified it. The relief comes from surviving a severe test, a nuance standard Bayesianism often flattens.

  Does building **theoretical-virtue priors** dissolve the problem? Assigning higher priors to parsimonious theories (fewer free parameters) helps distinguish GR from Newtonian fixes. It explains why Berlin physicists favored $H_{GR}$ over $H_{Newton} + \text{Vulcan}$. However, this moves the problem rather than solving it: it explains theory choice, but not why old $E$ confirms $H$ in the first place. It relies on subjective judgments about what counts as "ad-hoc." Bayesianism remains silent on how to objectively set these virtue-based priors.

  Ultimately, the Mercury case reveals that old evidence confirms only if we expand the evidence space to include logical discoveries or comparative theoretical virtues. Strict conditioning on known data yields no update, but conditioning on the *success of the derivation* does.

  The Mercury anomaly confirms General Relativity not because the data was new, but because the logical link between the theory and the data was a risky discovery that eliminated ad-hoc competitors.
