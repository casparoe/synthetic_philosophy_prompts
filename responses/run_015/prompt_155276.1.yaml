  Analyze Einstein's 1915 calculation of Mercury's perihelion shift — the 43 arcseccond anomaly Le Verrier had already noted back in the 1850s — through the lens of Bayesian epistemology's old-evidence problem. The twist is that Einstein wasn't predicting unknown data; he was showing GR reproduced a number everyone already knew was there. So apply both sides: on the logical Bayesian view, does matching old data confirm GR at all, or is it just post-hoc accommodation? On the subjective view, does confirmation depend on Einstein's personal prior over that specific 43 arcseccond figure before he ran the calculaton? Map the agents precisely — Einstein in November 1915, the Berlin physics crowd, and a modern reader — and say what each should rationally update. Then push further: Einstein apparently felt intense excitement, almost like a discovery, even though the number wasn't new. Does that emotional reaction fit either Bayesian model, or does it suggest scientists update on explanatory coherence and risk-taking, not just belief revision? Also ask whether the old-evidence problem dissolves if we build theoretical-virtue priors (fewer free parameters, no ad-hoc fudge) into the Bayesian machinery, or if that just moves the problem. Keep the mapping disciplined — say where the theory is silent rather than forcing it to speak — and tell me what the Mercury case actually reveals about whether old evidence can confirm. A typo or two is totally fine. End with a one-sentence summary as the very last line.
