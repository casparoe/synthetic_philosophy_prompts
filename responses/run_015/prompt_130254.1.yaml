  Section 1 — The explanatory target

  A theory of national prosperity must distinguish three distinct explanatory targets. First, cross-sectional variance asks why Norway is richer than Niger today. Second, temporal trajectory asks why England sustained growth while Spain stagnated over centuries. Third, counterfactual resilience asks what would have happened to Colombia had it inherited British colonial conditions. Existing literature often conflates these, treating a snapshot explanation as sufficient for dynamic history. A comprehensive theory claiming to explain 'why some nations are rich' ought to address all three, as prosperity is both a state and a process contingent on alternative paths. However, it is legitimate for a narrow theory to cover only one, provided it admits its limited scope. The explanatory cost of focusing solely on cross-sectional variance is static bias; it ignores how wealth is generated over time. Focusing only on trajectory risks exceptionalism, failing to generalise across polities. Ignoring counterfactuals renders the theory unfalsifiable, as it cannot distinguish necessity from contingency. Therefore, while a single model need not solve all three simultaneously, any claim to a general theory of prosperity fails if it cannot reconcile the static snapshot with the dynamic film and the road not taken. Without this tripartite clarity, explanations merely describe correlation within a specific slice of reality rather than causation across history.

  Section 2 — The desiderata

  To establish causality rather than correlation, any adequate theory must meet seven rigorous desiderata. First, regarding the reversal-of-fortune pattern, the theory must explain why high pre-colonial population density correlates with later poverty after colonisation without reducing this automatically to institutional causation. The logic here is that extractive institutions were often imposed where extraction was easiest, meaning institutions are the mechanism, not the root cause. A theory failing to explain the selection mechanism behind the institutions merely describes the correlation. This pattern challenges the view that institutions are always chosen for efficiency. Second, there must be a criterion for distinguishing institutions that cause wealth from those epiphenomenal to prior geographic endowments. If fertile land generates surplus which buys better rules, institutions are not the prime mover. This distinction prevents mistaking the vehicle for the engine. Without this, one cannot claim institutions are fundamental rather than intermediate. Third, a principle of causal priority is required that does not collapse into temporal ordering alone. Given that geography, culture, and institutions are observationally co-present in macrohistory, sequence does not guarantee causation; the theory must explain the transmission mechanism. Co-presence makes identification difficult without exogenous variation. Fourth, consistency with both Scandinavian cases and resource-curse cases is mandatory. A theory failing to explain prosperity despite adverse geography, or poverty despite favourable endowments, lacks universality. Scandinavia prospered despite harsh climates; resource-rich states often failed. This tests the boundary conditions of the theory. If a theory cannot explain exceptions, it is not universal. Fifth, there must be a mandatory separation between de jure formal rules and de facto power relations. Conflating them undermines causal explanation because elites often maintain extractive de facto power behind inclusive de jure facades, misleading observers about the true constraints on behaviour. Power often lies outside the law. Sixth, a specification of what evidence would falsify the theory is needed, particularly where culture and institutions are observationally equivalent. Without this, cultural explanations risk becoming tautological accounts of success. One must know what would make the theory false. This protects against unfalsifiable narratives where success is attributed to culture, and failure to cultural loss. Seventh, the 'parallel-worlds' constraint demands that for pairs of nations with similar starting conditions but divergent outcomes, the theory must identify a branching factor, not a post-hoc narrative. This ensures the explanation is predictive rather than descriptive. History offers few natural controls.

  A critical tension exists between desiderata (b) and (c). These are arguably jointly unsatisfiable in pure observational history. If factors are co-present (c), isolating independent variance (b) requires exogenous shock data which history rarely provides cleanly. This creates an identification crisis where causal priority cannot be empirically separated from epiphenomenal correlation without relying on contested natural experiments. If one insists on strict causal priority without temporal separation, one cannot distinguish the cause from the environment that sustains it. Conversely, if one relies on temporal ordering to establish priority, one violates the constraint against collapsing into sequence alone. This contradiction implies that no single theory can fully satisfy both without admitting significant uncertainty regarding the ultimate prime mover. Researchers must choose between identification strength and historical completeness. Acknowledging this limitation is preferable to claiming false precision.

  Section 3 — Negotiability audit

  Most desiderata are non-negotiable for causal claims. (a), (d), and (g) are empirical realities; ignoring them renders the theory factually incorrect. (e) and (f) are methodological necessities; without them, explanation dissolves into description. However, (c) reflects a camp-specific preference regarding determinism. Strict causal priority appeals to universalists, while path-dependency advocates may accept co-constitution where factors evolve together. Similarly, (g) is negotiable for theorists favouring complex systems over linear branching, though this weakens counterfactual power. The single requirement doing the most work in excluding existing explanations is (f), the falsification criteria. Most cultural and institutional accounts are formulated to be compatible with any outcome, rendering them unfalsifiable. By demanding specific evidence that would disprove the theory, particularly when variables are collinear, one eliminates the majority of narrative-driven histories. This requirement forces theorists to risk being wrong, which most avoid. Consequently, (f) acts as the primary filter, separating scientific causal claims from post-hoc storytelling. While (b) is also rigorous, it is often bypassed via instrumental variables; (f) cannot be bypassed without abandoning causal claims entirely. Therefore, adherence to (f) is the sharpest dividing line between robust social science and historical justification.

  Section 4 — Brief contender sketch

  The standard institutionalist account stresses inclusive versus extractive rules as the primary driver. It fares well on (e) and (a), acknowledging de facto power and reversal of fortunes through colonial history. However, it struggles logically with (b) and (c). It often treats institutions as exogenous when they may be geographic epiphenomena, failing to isolate independent variance. Furthermore, it frequently relies on colonial settler mortality as an instrument, which assumes geographic exogeneity while arguing institutional primacy, creating a logical tension. Geographic determinism stresses ecological endowments and climate suitability. It satisfies (c) regarding priority since geography precedes history, but fails (d) on Scandinavia and (a) on reversal of fortune, as geography is static while outcomes diverge. It cannot explain the branching factor in (g) without invoking non-geographic shocks, undermining its own monocausal premise. A culture-focused explanation stresses norms and social capital. It faces the severest logical failures on (f). Cultural traits are often inferred from the very economic outcomes they purport to explain, making falsification impossible. It also struggles with (g), as cultural divergence is frequently described post-hoc rather than identified as a pre-existing branching factor. All three contenders typically conflate de jure and de facto conditions (violating e) or rely on temporal sequence to establish causality (violating c). Ultimately, institutionalism offers the best structural fit but fails the epiphenomenal test; geography offers clarity but fails the outlier test; culture offers depth but fails the falsification test. None fully satisfy the parallel-worlds constraint without resorting to contested counterfactuals. Each theory captures a slice of the mechanism but collapses when forced to account for the co-presence of factors required by desideratum (c). The institutionalist account is particularly vulnerable on (b), as it cannot easily prove rules are not simply purchased by geographic surplus. The geographic account is vulnerable on (d), requiring ad hoc adjustments for human adaptation. The cultural account is vulnerable on (f), as it lacks a clear negative case. Consequently, a synthesis is often attempted, but this risks violating (c) by making everything causal. The logical gaps remain structural: institutionalism cannot prove exogeneity, geography cannot explain variance, and culture cannot prove independence.
