 on behaviour. Power often lies outside the law. Sixth, a specification of what evidence would falsify the theory is needed, particularly where culture and institutions are observationally equivalent. Without this, cultural explanations risk becoming tautological accounts of success. One must know what would make the theory false. Seventh, the 'parallel-worlds' constraint demands that for pairs of nations with similar starting conditions but divergent outcomes, the theory must identify a branching factor, not a post-hoc narrative. This ensures the explanation is predictive rather than descriptive. History offers few natural controls.

      A critical tension exists between desiderata (b) and (c). These are arguably jointly unsatisfiable in pure observational history. If factors are co-present (c), isolating independent variance (b) requires exogenous shock data which history rarely provides cleanly. This creates an identification crisis where causal priority cannot be empirically separated from epiphenomenal correlation without relying on contested natural experiments. If one insists on strict causal priority without temporal separation, one cannot distinguish the cause from the environment that sustains it. Conversely, if one relies on temporal ordering to establish priority, one violates the constraint against collapsing into sequence alone. This contradiction implies that no single theory can fully satisfy both without admitting significant uncertainty regarding the ultimate prime mover.

