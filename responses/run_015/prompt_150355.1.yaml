      *   *Key Insight:* The phenomenon is the **decoupling of epistemic authority from reliability.** Normally they correlate. In the user's case, they didn't. This is the crux.

  6.  **Finalizing the Structure:**
      *   **Introduction:** Validate the insight. It's a sophisticated critique of the User Illusion.
      *   **Existing Concepts:** Discuss Metacognition (FOR), Global Workspace, and the Narrative Self. Admit no single term exists.
      *   **Differentiations:**
