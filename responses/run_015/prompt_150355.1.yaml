          3.  If no term exists, how should it be defined/delimited, especially regarding breakdown cases (like the sleep deprivation example)?

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *User Illusion:* Tor Nørretranders. Good starting point, but user says it's not specific enough.
