      *   *Multiple Drafts:* Dennett again. No central authority, just competing narratives. The user's experience *feels* like there is a central authority (the "admin" access).
      *   *Introspective Privilege:* The philosophical idea that I know my own mind better than others. The user is describing the *mechanism* that enforces this, not just the claim.
