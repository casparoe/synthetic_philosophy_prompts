      *   **Core Phenomenon:** The user describes a specific aspect of consciousness where certain mental states (conscious intentions, self-reports) are granted "administrator-level" epistemic authority (default trust, resistance to correction), while others (emotions, habits, biases) are treated as "background processes" (unauthorized, suspect). This persisted even during sleep deprivation when the "admin" states were actually malfunctioning.
      *   **Key Distinction:** It's not just a "user illusion" (hiding complexity); it's a *normative* hierarchy within the illusion. Some representations are *authorized* to override others.
