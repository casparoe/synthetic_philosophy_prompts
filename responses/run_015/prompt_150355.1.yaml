  7.  **Tone Check:** The user is articulate, philosophical, and introspective. The response should match this register—precise, analytical, respectful of the nuance. Avoid oversimplification.

  8.  *(Self-Correction on "Epistemic Authority")*: Make sure to distinguish between *having* authority (philosophical) and *being granted* authority (psychological). The user is talking about the latter.

  9.  *(Final Polish)*: Ensure the distinction between "content" and "credential" is clear. The content is "I am awake." The credential is the tag that says "Trust this." Sleep deprivation broke the link between content and reality, but the credential remained attached.

