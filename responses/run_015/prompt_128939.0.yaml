          *   *Better approach:* The defect is *relational*. 1974 is valid *on its face*, but its *effect* combined with subsequent steps violates the 1948 intent. However, for the sake of a clean ruling, the Chamber should identify the *breach of the entrenchment clause* as the moment the system tried to alter §44. That happens substantively in 1979 (creating §44A) but procedurally relies on the 1974 redefinition.
          *   *Refinement:* The defect is in the *1979* step. Why? Because 1979 attempts to create a new amendment rule (§44A). The 1948 §44 says "no amendment may alter §44 itself." Creating §44A is functionally altering §44 because it creates a parallel track that bypasses §44's restrictions. But 1979 relied on the 1974 definition.
          *   *Actually, the strongest argument:* The 1948 §44 entrenchment is a "rule of recognition" for the amendment power. It says "You cannot change the rules for changing rules." The 1974 amendment didn't change §44 textually, but it changed the *operative meaning* of the terms within §44 without acknowledging that §44 was being affected.
          *   *Decision:* The defect crystallizes at **1979**. 1974 is suspicious but defensible as ordinary business. 1979 is the first attempt to circumvent §44's substantive lock. However, 1979 is only possible because of 1974. So 1974 is the *tool*, 1979 is the *act*. But to save the system, we might need to void 1974 *ab initio* regarding its effect on §44.
          *   *Wait, let's look closer:* 1974 amended §45. §44 references "two-thirds of the entire Assembly." If §45 defines that term generally, does it bind §44? The 1974 amendment changed the definition of a term *used* in §44, without following §44's own restriction on altering itself. This is the "Trojan Horse." So 1974 is the defect because it altered the *operation* of §44 without treating §44 as altered.
          *   *Revised Decision:* The defect is in **1974**, but only insofar as it applies to §44. It's a "partial nullity."

      *   **Principled Test (Legitimate vs. Illegitimate Two-Step):**
          *   Need a test that allows normal evolution but blocks evasion.
          *   Test: **The "Substantive Equivalence" Test.** If a sequence of amendments achieves a result that is expressly forbidden if done directly, the sequence is invalid.
          *   Alternative: **The "Identity Preservation" Test.** Does the amendment preserve the fundamental identity of the constitutional order established by the 1948 Charter?
          *   Better: **The "Anti-Evasion" Principle.** You cannot use a power granted for Purpose X to achieve Result Y if Result Y is expressly forbidden. 1974 was sold as fixing absenteeism (Purpose X), but if it enables bypassing entrenchment (Result Y), it violates the principle of conferred powers.

      *   **Path vs. Destination:**
          *   Entrenchment isn't just a wall; it's a rule of the road. If the rule says "Do not cross this line," you can't walk around the field to get to the other side.
          *   Argument: The 1948 founders created a "Higher Law." The amendment power is a *derived* power, not *original* sovereignty. A derived power cannot expand its own scope.

      *   **Jurisdiction of the Chamber:**
          *   This is the "Kompetenz-Kompetenz" problem. If the Charter says the Chamber is gone, how can it rule?
          *   Argument: The Chamber's jurisdiction derives from the 1948 Charter. If the 1990 amendments are void (because the chain leading to them is void), then the 1990 abolition of the Chamber is also void. Therefore, the Chamber still exists under the 1948 rules. It must presume its own existence to adjudicate the validity of the amendments that claim to destroy it. This is a "logical priority."

  4.  **Drafting the Argument (Iterative Process):**

      *   *Tone:* Intellectual, rigorous, slightly philosophical but grounded in the text provided. No "In *Kesavananda Bharati*..."
      *   *Structure:*
          1.  Introduction: Acknowledge the "Stepwise Validity" trap.
          2.  The Nature of the Amendment Power (Derived vs. Original).
