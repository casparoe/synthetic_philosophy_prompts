          *   1986: Use §44A to repeal §44 and re-enact §44A as sole rule (simple majority, no entrenchment). (Complied with §44A).
          *   1990: Use new rule to rewrite Charter (abolish cantons, extend terms, strip Chamber jurisdiction).
          *   1994: Reformist majority asks Constitutional Chamber to declare the 1974–1986 chain void.
      *   **The User's Position:** The chain is invalid. Dismantling entrenchment in steps is no better than doing it in one step. The Chamber should hold 1986 void (and presumably the rest).
      *   **The Opponent's Position:** "Stepwise validity." Every step complied with the rule in force *at that moment*. Therefore, valid.
      *   **Constraints:** Argue from *principle/structure*, not comparative law/cases. Address specific questions: Where is the defect? How to distinguish legitimate vs. illegitimate two-step amendments? Why does entrenchment constrain the *path*? How does the Chamber have jurisdiction if it was stripped?

  2.  **Deconstruct the Core Legal/Philosophical Problem:**
      *   This is a classic "Self-Embracing vs. Manner-and-Form" sovereignty puzzle, often associated with Hart, Kelsen, or the *Indian Basic Structure* doctrine, but I must avoid citing them.
      *   The core tension is between *procedural validity* (did they follow the steps?) and *substantive validity* (did they violate the underlying logic of the system?).
      *   The opponent argues for a "Snapshot Theory" of validity (was it legal *now*?).
