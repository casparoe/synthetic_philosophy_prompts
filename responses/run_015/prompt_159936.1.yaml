answer: |-
  **Notes on the Positions**

  *   **Mara (Dispositionalism):**
      *   *Strongest Objection:* Instability. If the disposition is adopted *instrumentally* to pass the readout, reflective access to the reason undermines the disposition at the moment of useless payment.
      *   *Concession:* The disposition cannot be adopted *solely* for the ride; it requires a non-instrumental anchor to be stable.
  *   **Ellis (Plan-Based Instrumentalism):**
      *   *Strongest Objection:* Emptiness. In the desert with no escrow or reputation, "sticking to a plan" is functionally identical to having a disposition, just with better branding.
      *   *Concession:* Act-by-act maximization fails the readout; some prior commitment structure is necessary to survive the probe.

  ***

  The highway was a black ribbon unspooling into the Nevada nothing. It was just past two. The heater hummed, fighting the draft from the window Ellis had cracked open despite the cold.

  "You're missing the texture of the readout," Mara said. She was staring at the reflectors on the guardrail, counting them in her head. "If the driver can probe my rule with cases where paying helps nothing, a fine-grained maximizer looks like a liar. The rule says 'Pay if useful.' The probe says 'Useless.' The rule says 'Don't pay.' The driver sees the glitch and keeps driving."

  "So you need a bug," Ellis said. His hands were at ten and two, rigid. "You're arguing that to be rational, you need to build a glitch into your code. A willingness to burn money for no reason."

  "Not for no reason. For the reason that got you in the car." Mara turned to him. "Think of it as an insurance premium. You pay the waste in the probe cases to secure the ride in the actual case. It's not irrationality; it's two-tier rationality. You design the agent who pays, then you let her pay."

  "But when the probe hits, Ellis, the agent knows it's a probe. She knows the money buys nothing. If she's rational, she keeps the cash. If she keeps the cash, she fails the readout. If she fails the readout, she dies in the desert. So the only way to survive is to be the kind of person who doesn't check."

  "That's the mysticism I hate," Ellis said. He tapped the wheel. "You're saying rationality requires me to ignore my own judgment. My judgment says 'This payment is useless.' You say 'Pay anyway.' That's not a premium; that's a lobotomy."

  "It's not ignoring judgment. It's honoring a prior constraint." Mara shifted in her seat. "Look, you passed a hitchhiker an hour ago. Why didn't you stop?"

  "Because stopping costs gas and time, and he looked... unstable. No credible signal."

  "Exactly. No signal. But suppose I could have shown you a readout of my brain. Suppose you could see that even if you dropped me off at a dead end, I'd still give you the money. Would you have stopped?"

  "Maybe." Ellis sighed. "But that's the problem. In the desert, there's no escrow. There's no third party. There's just me and you. If you adopt the rule 'Pay even when useless' *because* it gets you the ride, then when the moment comes to pay in a useless probe, you know the ride is already secured. The incentive evaporates. The rule collapses."

  "So you admit the rule needs to stick," Mara said. "You admit act-by-act maximization fails."

  "I admit you need a plan," Ellis corrected. "But a plan isn't a disposition. A plan is a normative commitment. I intend to pay. That intention has stickiness. It doesn't need to be a blind disposition that misfires. It just needs to be a prior intention that I don't revoke without new evidence."

  "And what glues the intention?" Mara pressed. "In the desert, there's no reputation. No contract. Just your word to yourself. If the only reason to hold the intention is the ride, and the ride is safe, why hold it? You're saying 'I stick to the plan because I planned it.' That's just a disposition with better branding."

  Ellis was quiet for a mile. The road dipped into a wash. "It's not branding. It's about what kind of agency you think is possible. If you say I must be disposed to waste resources to be rational, you're saying rationality is adversarial to the agent. I'm saying rationality is about coordinating across time. The 'stickiness' isn't magic. It's the recognition that if I revoke the intention now, I undermine my capacity to form intentions later."

  "But in the readout case, there is no later," Mara said softly. "The driver deletes the memory. The probe is isolated. If you don't pay in the probe, you don't get the ride. If you do pay, you lose money and gain nothing. Your 'coordination across time' argument doesn't work if the timeline ends at the probe."

  "Then your view doesn't work either," Ellis snapped. "If I'm the kind of person who pays useless money, I'm a sucker. If I know I'm that kind of person *because* I want the ride, I'm a calculated sucker. Who adopts that?"

  "Someone who knows the alternative is death," Mara said. "Look, I'll concede this: You can't adopt the disposition *just* for the ride. If you're thinking about the ride while you're paying the useless money, you'll hesitate. The readout will catch the hesitation. The disposition has to feel authentic. You have to care about the promise itself, not just the outcome."

  Ellis glanced at her. "Okay. That's something. You're saying the mechanism requires non-instrumental value. You have to actually care about keeping promises."

  "I'm saying the design requires it," Mara said. "Rationality dictates that you become someone who cares about promises instrumentally, but to succeed, you must care about them non-instrumentally. You have to forget the design."

  "That's a hell of a trick," Ellis muttered. "How do you do that? Convince yourself you're moral so you can survive?"

  "Maybe." Mara looked out at the dark. "What about you? You say 'plan.' In the desert, with no escrow. What is the plan made of? If it's not a disposition to pay, what physical fact makes it true that you'll pay? If it's just a thought, the driver knows thoughts change when incentives vanish."

  Ellis tightened his grip. "It's not just a thought. It's a stance. I treat my prior self as an authority. Not because it's infallible, but because overriding it is costly to my agency. Even in the desert."

  "Costly how?" Mara asked. "If no one knows?"

  "Because I know," Ellis said. "And if I can't trust me, who can?"

  "But the readout driver doesn't care about your self-trust. He cares about the output." Mara leaned forward. "Here's the knot. If you need the disposition to pass the readout, but you can only have the disposition if you don't adopt it for the readout... then we're stuck. We're driving around looking for a reason to be moral that isn't survival, but survival is the only reason we're out here."

  Ellis didn't answer immediately. The car hummed. A truck passed them going the other way, lights sweeping across the dashboard like a scanner.

  "Maybe," Ellis said finally. "Maybe the plan isn't enough. Maybe you do need the disposition. But I won't call it rational to cultivate blindness. I'll call it necessary. There's a difference."

  "Is there?" Mara asked. "If it saves your life, isn't it rational?"

  "If it requires you to stop seeing the truth—that the payment is useless—then it's rational only if ignorance is rational. And I don't think it is."

  Mara looked at the road. The white line dashed past, endless. "I think you need the ignorance to get the ride. But you can't choose the ignorance for the ride. So you need a reason for the ignorance that isn't the ride."

  "And we don't have one," Ellis said.

  "No," Mara said. "We don't."

  They drove on. The desert didn't care whether they paid.

  ***

  Ellis lands the heavier blow by exposing the instability of instrumentally adopted dispositions, but Mara's concession—that the disposition requires non-instrumental anchor—is the load-bearing insight that saves the theory from collapse. The line "You have to forget the design" carries the entire weight of the rational irrationality position.
