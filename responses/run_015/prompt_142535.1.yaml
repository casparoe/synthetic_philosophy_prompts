prompt: |-
  Hi — you're an expert in democratic theory and you've designed a lot of classroom simulations, so think this one through carefully: brainstorm three or four genuinely different mechanics before you commit, then give me the best one and say briefly why you dropped the others.

  I've got an upper-level undergrad seminar on democratic theory, 16 students, one 90-minute slot, and I want them to feel the boundary problem in their gut instead of just reading about it — the thing where any rule for who belongs to the demos has to be adopted by somebody, and there's no non-question-begging place to stop. No lecture up front, and they shouldn't hear the phrase until the very end.

  Rough setup I've been playing with, swap it if you've got better: the class has to make a real decision about how to spend a small one-time bequest, but before they can vote on the options they have to vote on who gets a vote at all. I hand out stakeholder cards: future students, the neighbours of the building, a donor's family, someone who is affected only if one particular option wins, someone whose only stake is that they care about a person who's affected, and one party who'd rather not recieve a vote at all, since being in the demos means being bound by the outcome and chipping in. Give me the rules, roles, timeline and materials — cards and paper are fine, nothing that needs a laptop — plus a debrief that maps the exact moments where they got stuck onto the specific moves in the argument: where "everyone affected" quietly inflates into "everyone", where affectedness and being subject to coercion come apart, and where the vote about the franchise just reproduces the original problem one level up.

  Also tell me what will predictably go wrong the first time I run it, how to handle it in the room, and be honest about which part of the problem the game can't stage and I'll just have to say out loud myself.
