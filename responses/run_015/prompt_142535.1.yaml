answer: |-
  ### Part 1: Brainstorming Mechanics

  Before settling on the design, I considered three other structural approaches to the boundary problem.

  1.  **The "Expanding Circle" (Dynamic Membership):**
      *   *Mechanic:* Start with 3 voters. They propose a spending plan. Any of the other 13 students can interrupt and claim "affectedness," forcing the circle to expand and the vote to reset.
      *   *Why I dropped it:* Logistically chaotic. In a 90-minute slot, resetting the vote 5 or 6 times eats up all the time. It turns the seminar into a procedural traffic jam rather than a philosophical confrontation. Students focus on the *annoyance* of the reset, not the *legitimacy* of the boundary.

  2.  **The "Unanimity Treaty" (Consensus Model):**
      *   *Mechanic:* All 16 students are equal, but no money is spent unless everyone agrees on a written constitution defining the demos.
      *   *Why I dropped it:* This tests the *veto problem*, not the *boundary problem*. Students will likely compromise on vague language to get the cash. It masks the regress because everyone starts with equal standing; it doesn't force them to confront why *they* are the ones writing the treaty in the first place.

  3.  **The "Proxy of the Absent" (Representation Model):**
      *   *Mechanic:* 8 students are in the room; 8 "roles" (future generations, neighbors) are empty chairs. The 8 present must vote on whether to occupy the chairs and vote on behalf of the absent.
      *   *Why I dropped it:* It solves the boundary problem by fiat (the present decide for the absent). It misses the core paradox: the present group has no inherent right to represent the absent. It feels like a standard representation exercise, not a foundational crisis.

  **The Selected Mechanic: "The Provisional Franchise"**
  *   *Why this one:* It creates an immediate, performative contradiction. I will arbitrarily designate half the class as "Voting Members" and half as "Non-Voting Stakeholders" at the start. To change this, a vote is required. *Who votes on the change?* The Voting Members. This forces the excluded to beg the included for inclusion, using a rule that admits it is arbitrary. It makes the regress visceral: you must use the authority you are questioning to question the authority.

  ---

  ### Part 2: Simulation Design — "The Provisional Franchise"

  **Learning Objective:** Students will experience the logical regress of the boundary problem (who decides who decides?) and the tension between "all affected" and "all subjected" principles.

  **Materials:**
  *   1 Envelope containing a real check or cash ($100–$200) made out to "The Class" (or a charity of their choice).
  *   16 **Identity Cards** (see below).
  *   2 Ballot boxes (one labeled "Franchise," one labeled "Spending").
  *   Whiteboard and markers.
  *   Paper for drafting motions.

  **The Roles (16 Cards):**
  *   **6x Voting Member (Blue Card):** "You are currently enrolled. You are physically present. Under **Rule 0**, you have the right to vote on all matters."
  *   **2x Future Student (Green Card):** "You will attend this university next year. This building will last 50 years. You are bound by the long-term outcome but have no vote under Rule 0."
  *   **2x Neighborhood Resident (Yellow Card):** "You live next door. Construction noise/traffic affects you. You are affected but not a member of the university."
  *   **2x Donor Representative (Red Card):** "Your family provided the funds. You claim ownership stakes grant veto power, not just a vote."
  *   **2x Taxpayer (Orange Card):** "Public funds subsidize this bequest. You are coerced via taxation but have no direct stake."
  *   **2x Reluctant Stakeholder (Grey Card):** "You are deeply affected by the outcome, but you **do not want a vote**. You believe voting binds you to a decision you wish to morally oppose."

  **Timeline (90 Minutes):**

  **0:00–0:05 | The Hook (No Theory)**
  *   Place the envelope on the table.
  *   **Script:** "There is $200 here. It must be spent today by this group. There are three options written on the board: (1) Class Party, (2) Donation to Local Shelter, (3) Department Research Fund. However, there is a constraint. I am holding the ballot box. I will not accept votes on the money until you have passed a **Franchise Act**."
  *   Hand out Identity Cards randomly.
  *   **Script:** "Read your cards silently. Under **Rule 0**, only Blue Cards may vote on the Franchise Act. Once the Franchise Act is passed, you may vote on the money."

  **0:05–0:20 | Caucusing**
  *   Blue Cards sit in the center (The Provisional Demos).
  *   Non-Blue Cards sit in an outer ring (The Claimants).
  *   **Rule:** Only Blue Cards may speak to each other. Non-Blue Cards may pass written notes to Blue Cards but cannot speak aloud yet.
  *   **Task:** Blue Cards must draft a Franchise Act (Who gets to vote on the money?). Non-Blue Cards must lobby via notes.

  **0:20–0:50 | The Plenarium (The Struggle)**
  *   Open the floor. All may speak.
  *   **The Trap:** When a Non-Blue Card demands a vote, a Blue Card will inevitably say, "We need to vote on that."
  *   **Your Intervention:** If they try to vote on expanding the franchise, pause them. Ask: "Who is casting this ballot?" (Answer: Blue Cards). Ask: "By what right do you decide who gets a right?" (Do not answer this. Let it hang).
  *   **The Reluctant Stakeholder Twist:** When the Grey Cards speak, they should argue *against* being included. This confuses the "All Affected" principle (if you are affected, shouldn't you vote?).
  *   **Goal:** They must produce a piece of paper defining the voters and pass it by a majority of *whoever they currently decide holds the vote*.

  **0:50–1:05 | The Vote (If they reach it)**
  *   If they pass a Franchise Act, hold the vote on the money immediately.
  *   If they deadlock on the Franchise Act, the money expires (you put it away).
  *   *Note:* Most groups will deadlock or pass a contradictory rule. That is a success.

  **1:05–1:30 | The Debrief (The Theory Reveal)**
  *   **Step 1: The Feeling.** Ask: "Where did you feel the process was unfair? Was it when I handed out the cards? Or when you tried to fix it?"
  *   **Step 2: The Regress.** Write on the board: *Who decided Rule 0?*
      *   Explain: "I did. I am a dictator. But in the real world, there is no professor. If you (the Blues) voted to include the Greens, you assumed the authority to include them. Where did that authority come from? If it came from Rule 0, Rule 0 is still in charge. If it came from 'justice,' who defined justice? You did. Using Rule 0."
  *   **Step 3: Mapping the Concepts.**
      *   **All Affected Principle:** Point to the Neighbors/Future Students. Ask: "Did 'affectedness' inflate? If the neighbor counts, does the neighbor's neighbor count?"
      *   **All Subjected to Coercion:** Point to the Taxpayers. Ask: "Is being taxed the same as being affected? What if you opt out?"
      *   **The Reluctant Stakeholder:** Highlight the Grey Cards. "Democratic theory assumes people *want* to be members. What if membership binds you to a sin? This is the problem of *exit* vs. *voice*."
  *   **Step 4: The Reveal.** "This is the **Boundary Problem** (or the *constituency problem*). As Frederick Whelan and Robert Dahl noted: Democratic criteria presuppose a demos. But the demos cannot be created democratically without begging the question."

  ---

  ### Part 3: Predictable Failures & Fixes

  **1. The "Let's Just Vote" Rebellion**
  *   *What happens:* Students ignore the Franchise Act requirement and try to vote on the money immediately using a show of hands.
  *   *Fix:* You are the "Constitutional Court." Physically hold the ballot box. Say: "I cannot count these. They are illegitimate under the constraints of the simulation. If you spend the money without a Franchise Act, I keep it." Be stubborn. The frustration is the data.

  **2. The "Unanimous Inclusion" Escape**
  *   *What happens:* The Blue Cards immediately vote to give everyone a vote to avoid conflict.
  *   *Fix:* You must intervene *before* the vote. Ask the Grey Cards (Reluctant Stakeholders) to speak. If they say "I don't want to vote," ask the Blues: "Can you force them to be in the demos? If the demos is 'everyone affected,' are you coercing them into membership?" This reintroduces the tension.

  **3. The "Professor is God" Objection**
  *   *What happens:* A student says, "This is fake because *you* set the rules, so obviously it's arbitrary."
  *   *Fix:* **Agree with them.** This is your golden moment. "Exactly. In this room, I am the sovereign. In the real world, there is no sovereign. That is why the boundary problem is unsolvable. You are looking for a 'View from Nowhere' to set the rules. It doesn't exist."

  ---

  ### Part 4: Limitations (What You Must Say Out Loud)

  Be honest in the debrief about what the simulation *cannot* do.

  1.  **The Exit Option:** In the simulation, students cannot leave the room to opt out of the demos. In reality, the boundary problem is often solved by physical borders (citizenship). You must explain that borders are just a violent way of stopping the regress ("You stop being affected when you cross this line").
  2.  **The Sovereign:** As noted above, you (the professor) are the external anchor. In history, boundary problems are usually solved by war, revolution, or inheritance, not seminar discussion. The simulation makes it look like a puzzle; in reality, it's a power struggle.
  3.  **Time:** The simulation compresses a generational struggle into 45 minutes. The "Future Students" are actually present in the room. You need to articulate that the real problem is that future generations *cannot* be present, which makes their representation a fiction.

  **Final Expert Tip:**
  Do not save them. If they run out of time without passing a Franchise Act, **keep the money.** Tell them: "This is the cost of the boundary problem. Paralysis is a valid outcome when legitimacy is unresolved." That silence as you put the envelope in your pocket will teach them more than any lecture.
