  **OFFICE FOR TRANQUILLITY (OfT)**
  **GUIDANCE NOTE 44/25: MANDATORY CRAVING IMPACT ASSESSMENT (CIA)**
  **ISSUED: 14 OCTOBER 2025**
  **CLASSIFICATION: OFFICIAL**

  **MINISTERIAL FOREWORD**

  Ministers have agreed that henceforth all domestic policy appraisal must align with the Static Welfare Framework. The primary objective of government is not the maximisation of positive states, which are metaphysically inaccessible, but the minimisation of negative welfare states (NWS). Specifically, we target the absence of suffering and the absence of restless desire. This Guidance Note sets out the methodology for the mandatory Craving Impact Assessment (CIA). Departments must note that no policy can ever make a citizen better off; it can only make them less badly off. Our duty is deficit mitigation, not surplus generation.

  **1. PURPOSE AND SCOPE**

  1.1 All policy proposals requiring Treasury approval must submit a CIA alongside the standard Green Book appraisal. The CIA quantifies the projected reduction in Craving-Adjusted Life Years (CALYs) lost to NWS.
  1.2 Proposals failing to demonstrate a net reduction in craving or suffering relative to the baseline will be rejected on welfare grounds, regardless of economic multiplier effects.

  **2. VALUATION OF DERIVATIVE GOODS**

  2.1 Officials often ask how to score interventions involving education, arts, autonomy, or interpersonal relationships. Under the Static Welfare Framework, these are welfare-neutral. A school, gallery, or friendship possesses no intrinsic welfare value.
  2.2 Such programmes may only proceed if justified on non-welfare grounds (e.g., cultural heritage, GDP stability) provided they do not induce craving elsewhere. Departments must not claim welfare benefits from "fulfilment" or "achievement," as these concepts imply a positive welfare ceiling which does not exist.
  2.3 If a gallery opening induces anxiety in staff or visitors, the CALY cost must be deducted from the budget allocation.

  **3. THE NEUTRAL POINT CONVENTION (NPC)**

  3.1 A known appraisal difficulty arises when multiple policy options leave the population at zero craving and zero suffering. This is the Neutral Point.
  3.2 Under the Neutral Point Convention, where Option A (Community Engagement) and Option B (Mass Sedation) both result in zero reported craving, officials must select the option with the lowest fiscal cost.
  3.3 Citizens in states of deep sleep, coma, or permanent pharmacological sedation are deemed to be at the Neutral Point. They are not suffering, nor are they craving. Therefore, a sedated population is welfare-equivalent to an active, content one, but usually fiscally preferable.
  3.4 Officials must not record sedation as a "loss of autonomy." Autonomy is only valuable insofar as its absence causes craving. Where capacity for craving is removed entirely (e.g., via pre-emptive neurological adjustment), the CALY benefit is maximal.

  **4. COST-EFFECTIVENESS CALCULATION**

  4.1 The preferred metric is the Cost Per Craving Unit Averted (CPCUA).
  4.2 *Worked Example:*
  *   **Intervention A (Youth Arts Programme):** Cost £500,000. Projected craving reduction: 0 units (participants report "joy," which is welfare-neutral). CPCUA: Undefined.
  *   **Intervention B (Universal Anodyne Programme):** Cost £50,000. Projected craving reduction: 1,000 units (via suppression of desire centres). CPCUA: £50.
  4.3 Intervention B is the superior welfare investment. Departments must prioritise pharmacological solutions over psychosocial ones where the latter risks stimulating ambition or attachment.

  **5. POPULATION STABILITY METRICS**

  5.1 A population that is perfectly content, perfectly still, and produces nothing is considered a triumph of static welfare engineering.
  5.2 Economic productivity is not a welfare metric. If a region achieves zero craving through total inactivity, its Welfare Output Score is maximal. Departments should resist the urge to stimulate activity in such regions, as activity introduces risk of desire.
  5.3 Growth targets should be rebranded as Stability Maintenance Targets.

  **ANNEX A: FREQUENTLY ASKED QUESTIONS**

  **Q: Can we ever say a citizen is flourishing?**
  A: No. "Flourishing" implies positive welfare. Officials should use "Optimally Mitigated."

  **Q: How do we rank two options where everyone is already at zero?**
  A: Apply the Neutral Point Convention. Choose the cheapest. If costs are equal, choose the option requiring least administrative oversight.

  **Q: Does preventing birth count as craving aversion?**
  A: Yes. Non-existence precludes craving. However, presentational risks are high (see Minute below).

  **Q: What if the public complains they feel "bored"?**
  A: Boredom is a craving for stimulation. Treat as NWS. Administer calming agents. Do not provide puzzles.

  ***

  **INTERNAL MINUTE: PERMANENT SECRETARY TO DIRECTOR OF APPRAISAL**
  **DATE: 15 OCTOBER 2025**
  **SUBJECT: PRESENTATIONAL RISK ON SECTION 3.4**

  While I fully endorse the welfare arithmetic regarding pre-emptive neurological adjustment, I must register a concern on presentational grounds. The phrase "capacity for craving removed entirely" may be misinterpreted by the media as "lobotomisation," despite our accurate classification of it as "Optimally Mitigated Welfare." I suggest we rebrand this specific intervention as "Voluntary Desire Stability" in public-facing documents. The welfare outcome is identical, but the risk of scrutiny is reduced. Please amend the comms pack accordingly.

  **END OF GUIDANCE**
