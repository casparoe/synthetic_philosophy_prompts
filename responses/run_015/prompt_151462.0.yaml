prompt: |-
  I keep going back and forth on whether the no-free-lunch theorems are just Hume's problem of induction with equations attatched, and I'd like you to compare the two properly.

  The version I tell myself: NFL says that averaged over all possible target functions — or over all cost functions, in the optimization version — every learner does exactly as well as every other one, so simplicity, smoothness and the rest aren't a priori better than their opposites. Hume says no inference from the observed to the unobserved can be justified without circularity. Both seem to run the same move: assume nothing, notice the symmetry, conclude nothing follows. But NFL looks like it's assuming something after all, namely a flat distribution over targets, which is itself a strong empirical claim. Is that the crack where the analogy breaks, or does Hume's argument quietly need the same kind of assumption?

  Also I've been playing with a move I can't evaluate, call it meta-NFL: average uniformly over all *priors* over target functions, and by the same symmetry reasoning it seems no prior is better than any other either, so escaping NFL by adopting a non-uniform prior just restarts the problem one level up, and you can iterate. Does that actually go through? And if it does, why doesn't it kill the standard escape, Solomonoff-style prediction, which gets a bound on cumulative error stated for each individual sequence in terms of that sequence's complexity rather than on average over worlds? My hunch is the individual-sequence part is what makes it immune to symmetry arguments, but I cant say exactly what that buys you and what it leaves untouched. Under a page, and tell me if I've just reinvented something standard.
