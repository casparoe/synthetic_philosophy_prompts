answer: |-
  **Chair:** It's ten p.m. Coffee's cold. We need a vote on the forest plot renewal. Three centuries of data. None of us will see the end.

  **Iris:** Then we shouldn't decide based on our lifetimes.

  **Wes:** We have to. The money is real now. The payoff isn't.

  **Iris:** Truth isn't about payoff. It's about where the evidence leads, however long it takes.

  **Wes:** If the evidence never arrives, is there a truth? Say we defund next year. Plots ploughed under. Question never reopened. Is the hypothesis about the pathogen true?

  **Iris:** Yes. Or false. The outcome is fixed by how the forest behaves, not by whether we watch.

  **Wes:** But verification is impossible. No one will ever know.

  **Iris:** Knowing isn't truth. Truth is what inquiry would settle on if it persisted. I'll concede this: that limit isn't a decision procedure. It can't tell this committee what to do on Tuesday.

  **Wes:** Exactly. So why fund a ghost?

  **Iris:** Because fallibilism means we might be wrong now. A hypothesis can be fated for the final opinion and still be one we shouldn't act on yet. But the truth remains independent of our current hesitation.

  **Wes:** Independent of us entirely? Take the unasked question. Number of barnacles on a wreck in a trench no expedition will ever visit. Determinate claim. No reason to investigate. Is it true?

  **Iris:** Yes.

  **Wes:** On what basis?

  **Iris:** Not on what anyone would say. On the reality that would constrain anyone who did investigate. Together with the antecedent warrant for thinking counting is a reliable method.

  **Wes:** That's a metaphysical commitment, not a pragmatic one. If no experience ever touches it, it's idle. Truth is made in the verifying.

  **Iris:** Reality is not independent of thought in general, but if truth is indexed to what actual believers find satisfactory, then the difference between a belief that is correct and a belief that merely cannot be improved upon by anyone around has been lost.

  **Wes:** Not satisfactory as in pleasant. Expedient on the whole and in the long run, consistent with the rest of what we hold.

  **Iris:** Suppose a belief is made comfortable by sustained propaganda. Socially functional. Consistent within the bubble.

  **Wes:** Then it fails the consistency test with wider experience. It breaks down eventually.

  **Iris:** Eventually? That's the long run again. You're smuggling my limit in through the back door.

  **Wes:** No. My long run is the long run of actual believers and their satisfactions. Not a counterfactual endpoint that may never be occupied. An ideal terminus that no one alive will reach gives present inquirers nothing to go on. It quietly turns every live controversy into a promissory note.

  **Iris:** Without the note, you have no direction.

  **Wes:** I have what works now. Consider the vocabulary case. Inquiry converges in two centuries. But they use a taxonomy we wouldn't recognize. Descriptive vocabulary shifted. Is their opinion an answer to our question?

  **Iris:** Translation is possible. The limit is stable beneath the terms.

  **Wes:** If it doesn't connect to our experience, it's not our truth. You're betting on a future we can't conceive.

  **Iris:** I'm betting on the constraint.

  **Wes:** I'm betting on the cash value.

  **Chair:** Gentlemen. The vote. Renew or terminate?

  **Iris:** Renew.

  **Wes:** Renew.

  **Chair:** Recorded. Reasons?

  **Iris:** Inquiry is directed at something that does not depend on our lifetimes.

  **Wes:** The beliefs the project supports are the ones currently paying their way in experience, and if the future never arrives the truth was always in the living of it.

  **Chair:** Meeting adjourned.

  **Iris:** [Packing papers] You still haven't answered the barnacles.

  **Wes:** [Standing up] Neither have you. Does the orphaned question have an answer at all?

