      *   *The "New Hat" Charge:* It's not *exactly* standard, but it's a known move: **Domain-Specific Realism**. The risk is that if semantics is uniform (as the user claims), you can't have staggered *truth*. If "2+2=4" is Tarskian true, and semantics is uniform, then "There is a measurable cardinal" must have truth conditions too. If you deny the truth value of the latter, you *must* change the semantics for the former or accept a fragmented semantics.
