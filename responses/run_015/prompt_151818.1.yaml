  Based on the seven verdicts you've logged, I can reconstruct the ethical algorithm your friend is running. It is not consistent, but it is coherent. She is not a strict utilitarian (marginal harm), nor is she a strict deontologist (rules-based). She is running a **Hybrid Complicity Model** that treats **commercial transactions** differently from **civic acts**.

  Here is the breakdown of her rule, the prediction for your chicken, and the test case that will prove it.

  ### The Prediction
  **Verdict:** **NOT FINE.**

  **Why:**
  She distinguishes sharply between *civic participation* (voting, petitions) and *commercial participation* (buying tickets, food, boots).
  *   **Civic Acts:** She applies **Causal Marginalism**. If your vote/petition changes nothing statistically (Case 3 & 4), you are off the hook.
  *   **Commercial Acts:** She applies **Commercial Complicity**. If you pay money into a harmful industry, you are "paying into the practice" (Case 7), regardless of whether your specific purchase triggered a marginal unit of harm.

  The Circus case (Case 7) is the smoking gun. In that scenario, the supply was fixed, the fee was paid, and your ticket changed *nothing* causally. Yet she ruled **Not Fine** because you financially supported the ecosystem. Your chicken purchase is identical: you are paying money to a factory-farming supply chain. The "rounded down" crate math is a logistical detail that doesn't absolve the financial support, just as the "flat fee" didn't absolve the circus ticket buyer.

  The only exception to Commercial Complicity is **Waste/Secondhand** (Case 2 & 6). Since your chicken would have been sold to someone else (not wasted) and is not secondhand, the exception does not apply.

  ### The Rule She Is Running
  **"The Revenue Signal Rule"**
  1.  **Is it a commercial transaction?**
      *   **No (Vote/Petition):** Verdict depends on *Causal Impact*. (If impact ≈ 0, Fine).
      *   **Yes (Boots/Burrito/Ticket):** Verdict depends on *Revenue Flow*.
  2.  **Does money go to the harmful industry?**
      *   **No (Secondhand/Free Sandwich):** Fine.
      *   **Yes:** Not Fine.
  3.  **Exception:** If there is a high-opportunity cost for the money (Case 5), money is treated as *linearly marginal* (i.e., you should have donated it), reinforcing the "Not Fine" verdict.

  She essentially believes that **money is a vote with a receipt.** Even if your "vote" (purchase) doesn't cross the threshold to order a new crate, it still validates the current revenue stream that keeps the crates coming.

  ### Why Your Proposed Test (6,499) Isn't Sharp Enough
  You suggested a case where the total is 6,499, so your bird tips the scale to 6,500, triggering a whole extra crate (500 birds).
  *   **Complicity Theory:** Says **Not Fine** (You paid money).
  *   **Marginalist Theory:** Says **Not Fine** (You caused 500 deaths).
  *   **Result:** Both theories agree. It confirms she opposes harm, but doesn't tell you *why* she opposed the 6,238 chicken.

  ### The Case That Separates the Survivors
  To distinguish between **Commercial Complicity** (my bet) and **Lumpy Marginalism** (the idea that you're only responsible if you cross the crate threshold), you need a case where **Revenue is High** but **Marginal Impact is Zero**, *and* **Opportunity Cost is Zero**.

  **Ask her this:**
  > "Imagine I buy a $50 gift card to the chicken store today, but I don't redeem it for a year. The store counts the $50 as revenue *now* (helping them order next month's crates), but I don't actually take a chicken until next year, when their ordering policy has changed to be cruelty-free.
  >
  > **Is buying the gift card today Fine or Not Fine?**"

  **Why this works:**
  *   **If she says NOT FINE:** She is a **Complicity Theorist**. The act of funneling money to the industry *now* is the sin, regardless of when the chicken is consumed or if it triggers a specific crate. This aligns with the Circus verdict.
  *   **If she says FINE:** She is a **Marginalist**. She cares about the physical outcome (the chicken death). Since the chicken you eventually get is cruelty-free, and the money didn't trigger a specific extra crate *this month* (assuming they have cash reserves), she might let it slide.
  *   **If she says IT DEPENDS ON THE REDEMPION:** She is inconsistent.

  **My Money:** She says **Not Fine**. The "Money is Special" verdict (Case 5) combined with the Circus verdict (Case 7) suggests she views the *transfer of funds* to the harmful industry as the ethical breach, not just the physical consumption of the marginal unit. Your 6,238 chicken is a tax on the industry, and she doesn't think you can dodge the tax just because you weren't the tipping point.
