  ### Best Guess: The "Mode of Cognition" Principle
  I believe your colleague is implicitly applying **Candidate Rule 2 (Mode of Cognition)**.

  **Why?**
  While the Track Record rule (Rule 1) is strong, it struggles to explain the * Physician Case (1) * cleanly without caveats about statistical tasks. More importantly, the contrast between **Case 2 (Director)** and **Case 5 (Commentator)** is the key. Both are experts fighting a statistical consensus.
  *   The Director trusts her **Vision** (Tacit). Verdict: **Trust.**
  *   The Commentator trusts his **Theory** (Explicit). Verdict: **Defer.**

  If Track Record were the primary driver, the Commentator's "detailed theory" shouldn't matter as much as his poor record, but the Director's "vision" shouldn't matter as much as her good record. However, the *justification style* perfectly correlates with the verdicts across all six cases. The colleague appears to believe that **explicit rationalizations against base rates are suspect (Inside View bias), whereas deep, tacit expertise (Naturalistic Decision Making) is valid.**

  In Case 7, the engineer is offering a rationalization ("articulate in detail... pitfalls... addresses each one"). She is engaging in System 2 reasoning to fight a System 1 statistic. Based on the Commentator precedent, your colleague will likely say she should **Defer**.

