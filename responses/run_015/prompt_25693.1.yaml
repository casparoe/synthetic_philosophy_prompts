  Based on the six cases provided, your colleague is navigating the tension between the **Inside View** (specific details, personal judgment) and the **Outside View** (base rates, statistics, consensus). While her verdicts are consistent, they rest on underlying principles that are not immediately identical.

  Here are three candidate rules that fit Cases 1–6 but diverge on the Software Engineer (Case 7).

  ### Candidate Rule 1: The "Validated Track Record" Principle
  **Logic:** Trust the inside view if and only if the agent has a demonstrated history of success *in this specific type of task* that outperforms the base rate. If the track record is non-existent, poor, or statistically insignificant, defer to the outside view.
  *   **Fit to Cases 1–6:**
      *   **Trust:** Director (3/3 successes), Firefighter (20 years implied success), Violin Maker (30 years acclaimed).
      *   **Defer:** Investor (no training/record), Commentator (poor record).
      *   **Nuance (Case 1):** The physician is an expert, but the judgment is a single-event probability calculation where personal track record is irrelevant compared to Bayes' theorem. The "task" here is statistical inference, not diagnosis by feel.
  *   **Prediction for Case 7:** **Trust.** The engineer has a 66% success rate (2 out of 3) on major rewrites, which significantly outperforms the industry base rate of 30%. She has a validated track record.

  ### Candidate Rule 2: The "Mode of Cognition" Principle
  **Logic:** Trust the inside view if the judgment is **tacit/perceptual** (intuition, "feel," vision, recognition-primed decision). Defer to the outside view if the judgment is **explicit/conceptual** (theories, detailed articulations, calculations, arguments against the stats). Explicit reasoning is prone to overconfidence and the planning fallacy; tacit expertise in high-validity domains captures nuances stats miss.
  *   **Fit to Cases 1–6:**
      *   **Trust (Tacit):** Director ("Vision"), Firefighter ("Intuition"), Violin Maker ("Tactile").
      *   **Defer (Explicit):** Investor ("Patterns"), Commentator ("Detailed theory"), Physician ("Computes posterior").
  *   **Prediction for Case 7:** **Defer.** The engineer is not relying on a "gut feeling" or tacit recognition; she is "articulating in detail" a theoretical argument for why she is an exception. This matches the Political Commentator (Case 5) who had a "detailed theory" and was told to defer.

  ### Candidate Rule 3: The "Locus of Control" Principle
  **Logic:** Trust the inside view if the outcome depends primarily on the agent's **individual skill or physical reality**. Defer if the outcome depends heavily on **organizational, market, or systemic factors** outside the agent's direct control.
  *   **Fit to Cases 1–6:**
      *   **Trust:** Firefighter (physics/safety), Violin Maker (craftsmanship), Physician (biological reality).
      *   **Defer:** Investor (market randomness), Commentator (voter behavior), Director (market trends—*Wait, this is a weak point for Rule 3, as films are market-dependent. However, the verdict was Trust, suggesting Rule 3 is less robust than the others unless we argue the Director controls the 'art' while the Studio controls the 'money'.*)
      *   *Correction:* To make Rule 3 fit Case 2, we must assume the colleague views "Artistic Vision" as within control, and "Commercial Performance" as outside. The verdict says she is right to trust her *approach*, not necessarily that the film will succeed.
  *   **Prediction for Case 7:** **Defer.** The statistic cited is not just technical failure, but that rewrites are "abandoned before completion." Abandonment is typically a management, budget, or organizational decision, not purely a technical one. The engineer controls the design, but not the company's willingness to finish it.

