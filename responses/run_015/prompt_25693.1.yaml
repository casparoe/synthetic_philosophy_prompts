  ### Discriminating Case (Case 8)
  To distinguish between the **Track Record Rule** (which predicts Trust) and the **Mode of Cognition Rule** (which predicts Defer), you need a case where an agent has a **strong track record** but relies on **explicit reasoning** (or vice versa).

  **The Case of the Veteran Mechanic:**
  > A master aircraft mechanic with 25 years of experience and a flawless safety record is inspecting a jet engine. The diagnostic computer (which has a 99% accuracy rate) reports the engine is safe for flight. However, the mechanic reviews the maintenance logs and calculates that a specific component is near its fatigue limit, a factor the computer's algorithm weighs lightly. He explicitly argues that the computer is underestimating the risk based on his calculation of the flight hours. He grounds the plane.
  >
  > **Question:** Was the mechanic right to trust his calculation over the computer's base-rate-backed diagnosis?

  **How it Discriminates:**
  *   **If she says TRUST:** She is following the **Track Record Rule**. The mechanic has a "flawless safety record," so his judgment overrides the statistical tool.
  *   **If she says DEFER:** She is following the **Mode of Cognition Rule**. The mechanic is using "calculation" and "explicit argument" (like the Engineer and Commentator) rather than "tacit intuition" (like the Firefighter). Even with a good record, explicit reasoning against a statistical tool is viewed as overconfidence.
