answer: |-
  The conceptual tension at the heart of the Humean Best-Systems Account (BSA) lies in the conflict between ontological parsimony and modal explanatory power. For the Humean, laws of nature are nothing over and above the optimal summary of the "Humean Mosaic"—the total distribution of local, categorical properties in space-time. There are no primitive governing relations or necessary connections; laws supervene on the mosaic. However, anti-Humean intuitions suggest that laws possess a modal force that accidental generalisations lack: laws support counterfactuals (e.g., "if this match were struck, it would light") because they govern what *must* happen, whereas accidental generalisations (e.g., "all gold spheres are less than one kilometer wide") merely describe what *does* happen. The Humean struggles to ground this distinction without appealing to the very modal primitives they seek to eliminate.

  The hypothetical 'Counterfactual Resilience Gradient' (CRG) is proposed as a mechanism to resolve this tension within the BSA framework. By defining the CRG as the proportion of nearby possible worlds—constructed by preserving the actual categorical bases (the inventory of fundamental property types) while permuting their particular instances (their specific spatiotemporal distribution)—in which a candidate regularity holds, the Humean attempts to objectify modal resilience. A regularity with a high CRG would be selected as a law because it remains stable across a wide range of mosaic permutations, whereas an accidental generalisation would have a low CRG, failing to hold when instances are rearranged. This aims to capture the intuition that laws are robust while accidents are fragile, using a metric derived from the categorical bases themselves.

  However, adopting the CRG as a selection criterion critically threatens Humean ontological austerity. The core tenet of Humeanism is that all facts about the world supervene on the actual, categorical mosaic. To calculate the CRG, one must quantify over "nearby possible worlds" with permuted instances. If these worlds are treated as concrete entities, the Humean collapses into Modal Realism, abandoning austerity entirely. If they are treated as *ersatz* worlds (abstract representations), the Humean must explain what makes a representation a "nearby" world without appealing to laws (which would be circular) or primitive modal similarity relations. If the "nearness" of these worlds is determined by their similarity to the actual world's *nomic* structure, the CRG presupposes the laws it is meant to select. If "nearness" is determined purely by qualitative similarity of the mosaic, it remains unclear why this specific metric of permutation tracks *nomic* necessity rather than mere statistical frequency. Thus, quantifying over these permuted worlds implicitly introduces a modal structure—a space of possibilities with a specific topology—that functions as a primitive governing constraint, violating the Humean commitment to a world devoid of modality beyond the actual.

  Furthermore, the CRG likely fails to provide a genuinely distinct resolution to the problem of accidental generalisations, instead offering a sophisticated epistemic re-description. If the CRG is stripped of ontological weight to preserve Humean austerity, it functions merely as a heuristic for system selection: we prefer systems that describe patterns stable under hypothetical permutations of the data. In this role, the gradient distinguishes laws from accidents based on the *systematic utility* of the regularity, not its metaphysical ground. It explains why we *call* something a law (because it is resilient in our systematization), but it does not explain why the counterfactuals supported by that law are *true*. The distinction becomes purely epistemic: lawful patterns are those we are more willing to project into non-actual scenarios because they simplify our best theory. This leaves the anti-Humean objection intact: the Humean has explained the *practice* of law-talk but has not accounted for the *truth-makers* of counterfactual claims, effectively re-describing the modal distinction as a feature of our descriptive taxonomy rather than the world itself.

  It is crucial to distinguish the ontological status of the gradient from its heuristic role. Ontologically, if the CRG represents a real feature of the universe, it is a modal relation between the actual mosaic and non-actual permutations, which is anathema to strict Humeanism. Heuristically, if the CRG is merely a calculative tool used by agents to determine which axiomatization achieves the best balance of simplicity and strength, it is compatible with Humeanism but loses the power to ground modal truths. The tension arises because the CRG must be ontological to satisfy the anti-Humean intuition (that laws *make* counterfactuals true) but must be heuristic to satisfy the Humean constraint (that only the actual mosaic exists). Attempting to straddle this divide results in a framework that either smuggles in modal primitives under the guise of "world permutation" or admits that the distinction between law and accident is merely a feature of human systematization.

  The Counterfactual Resilience Gradient ultimately fails to reconcile Humean ontological austerity with robust modal intuitions because it either illicitly imports modal primitives through its quantification over possible worlds or collapses into a merely epistemic redescription of systematic stability that lacks genuine ontological grounding.
