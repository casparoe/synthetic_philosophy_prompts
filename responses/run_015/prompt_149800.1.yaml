answer: |-
  There is no single, canonical Latin-named fallacy for this specific configuration in general logic. However, in the **philosophy of economics** and **welfare theory**, this pattern is a well-documented and heavily criticized phenomenon.

  The most precise established description comes from **Daniel Hausman** and **Michael McPherson**, who describe it as **"The Ambiguity of the Preference Concept"** or the **"Conflation of Positive and Normative Revealed Preference."** In broader rhetorical theory, it is a specialized form of **"Strategic Ambiguity."** In the philosophy of science (Lakatos), it functions as an **"Immunizing Stratagem."**

  However, because you are asking for a precise definition that distinguishes it from Motte-and-Bailey and ordinary pluralism, I propose the term **"Deflationary-Normative Shuttling"** (or **"Ontological Shuttling"**).

  Below is an analysis of why existing terms fit imperfectly, a precise definition of the pattern, and the boundary conditions for legitimate vs. illegitimate use.

  ### 1. Why Existing Terms Are Insufficient

  *   **Motte-and-Bailey:** You correctly note the distinction. In a standard Motte-and-Bailey, the speaker *retreats* to the defensible claim (Motte) when attacked and *advances* the controversial claim (Bailey) when safe. In your described pattern, the deflationary claim (Stance 1) is not merely a retreat; it is the *ontological foundation* of the theory. The proponent does not necessarily "believe" the normative stance less than the deflationary one; rather, the framework is designed to allow the switch. The Motte is "hollow"—it is defensible only because it is tautological, yet it is used to shield a substantive claim that the tautology cannot support.
  *   **Equivocation:** This is not merely sliding between two definitions of the word "utility." It is sliding between two **theoretical statuses**. In Stance 1, utility is a *mathematical representation* (positive). In Stance 2, utility is a *moral currency* (normative). The error is not lexical; it is categorical (deriving an *ought* from an *is* while denying the *ought* exists when challenged).
  *   **Theoretical Pluralism:** Pluralism implies holding multiple models to capture different facets of reality, acknowledging the tension. Shuttling implies using the tension to **immunize** the theory from criticism. One stance is used to block falsification; the other is used to claim policy relevance.

  ### 2. Proposed Definition: Deflationary-Normative Shuttling

  **Definition:** A dialectical maneuver in which a theoretical framework oscillates between a **deflationary ontology** (claims are tautological or purely descriptive) and a **normative ontology** (claims are substantive and action-guiding) to maximize theoretical immunity and policy influence.

  **Structure:**
  1.  **Normative Assertion:** The framework claims that $X$ (choice) tracks $Y$ (welfare), justifying policy intervention.
  2.  **Objection:** Evidence shows $X$ does not track $Y$ (e.g., addiction, framing).
  3.  **Deflationary Retreat:** The framework asserts that $X$ *defines* $Y$, rendering the objection a category error (there is no "welfare" beyond $X$).
  4.  **Normative Return:** Having deflected the objection, the framework resumes using $X$ to justify policy regarding $Y$, without re-establishing the link.

  **Distinction from Motte-and-Bailey:**
  In Motte-and-Bailey, the Motte is a *sincere fallback position*. In Deflationary-Normative Shuttling, the Deflationary stance is often **not** the proponent's sincere view of policy; it is a **logical shield**. The proponent does not actually believe policy should be neutral regarding welfare (Stance 1); they believe it should maximize welfare (Stance 2). They invoke Stance 1 *only* to deflect counter-evidence, not to guide action.

  ### 3. Boundary Conditions: Legitimate vs. Illegitimate Use

  The line between legitimate theoretical flexibility and illicit shuttling lies in **transparency** and **consistency**.

  #### Legitimate Use (The "Proxy" Defense)
  A framework legitimately combines deflationary and normative elements if it explicitly acknowledges the gap and treats choice as an **imperfect proxy**.
  *   **Condition:** The theorist admits, "We use choice data as the best available *approximation* of welfare, acknowledging it may fail in cases like addiction."
  *   **Dialectic:** When criticized, they concede the failure of the proxy rather than denying the existence of the target.
  *   **Example:** Behavioral Welfare Economics. It uses revealed preference as a baseline but explicitly corrects for biases, admitting that choice $\neq$ welfare in specific contexts.

  #### Illegitimate Use (The Shuttling Pattern)
  The pattern becomes fallacious when the deflationary definition is used to **immunize** the theory from falsification while the normative definition is used to **claim authority**.
  *   **Condition:** The theorist claims choice *constitutes* welfare (making criticism impossible) but simultaneously claims policy based on choice *improves* welfare (making the theory useful).
  *   **Dialectic:** When criticized, they say, "You misunderstand; utility is just choice." When proposing policy, they say, "We must maximize utility to help people."
  *   **Example:** Strict neoclassical welfare analysis that dismisses addiction as "revealed preference" (deflationary) but uses cost-benefit analysis to argue society is "better off" when preferences are satisfied (normative).

  ### 4. Established Terminology in Philosophy of Economics

  If you need to cite existing literature rather than use a new definition, this pattern is discussed under three specific headings:

  1.  **The Naturalistic Fallacy (Protected):** Critics like **Amartya Sen** ("Rational Fools") argue this is an attempt to derive normative conclusions from positive premises, protected by a tautological definition of preference.
  2.  **Lakatosian Immunizing Stratagem:** In the methodology of scientific research programs, this is a move to protect the "hard core" of a theory (utility maximization) from empirical refutation by adjusting the "protective belt" (redefining utility to match any choice).
  3.  **The Ambiguity of 'Preference':** **Daniel Hausman** (*The Inexact and Separate Science of Economics*) explicitly details how economists use "preference" to mean both "all-things-considered judgment" (normative) and "disposition to choose" (deflationary) to suit the argument.

  ### Summary Recommendation

  For precision, I recommend using **"Deflationary-Normative Shuttling."**

  It captures the oscillation (shuttling), identifies the two specific ontological commitments (deflationary vs. normative), and avoids the baggage of "Motte-and-Bailey" (which implies a sincere retreat) or "Equivocation" (which implies mere lexical confusion). It correctly identifies the move as a **structural feature of the argument** designed to secure **epistemic immunity**.

  **Usage Example:**
  > "The author engages in **deflationary-normative shuttling**: they defend the model against evidence of irrationality by claiming utility is merely a formal representation of choice (deflationary), yet they justify policy interventions by claiming that maximizing choice data improves human welfare (normative). This allows the framework to be unfalsifiable while retaining normative authority."
