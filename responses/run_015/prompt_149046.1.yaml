          *   Status: Accurate consequence of P1 + Causal Closure of the Physical. This is the classic "Paradox of Phenomenal Judgment" (Chalmers).
      *   *Claim 3: Predictive Processing (PP) implies judgments are top-down predictions, not readouts.*
