  6.  **Developing Solutions/Costs:**

      *   *To save (2) Naive Realism:* Drop (3) Local Physicalism. Accept that phenomenal character does *not* supervene locally. (Cost: Harder to integrate with neuroscience, makes introspection mysterious).
      *   *To save (3) Local Physicalism:* Drop (2) Naive Realism (or water it down). Accept Representationalism. (Cost: User says they are "unhappiest to give up" (2)).
