  7.  **Final Polish:** Check structure, flow, and ensure all parts of the prompt are addressed. (The resulting essay should mirror the structure of the prompt's requests).

      *   *Introduction:* Acknowledge the sophistication of the impasse.
      *   *Diagnosis:* It's a divergence on the *locus of normativity*.
      *   *Empirical Premise:* The "Anonymity Reveals Truth" assumption.
      *   *Digital Analog:* Helpful but limited (Is/Ought problem).
      *   *Path Forward:* Metaphysics of the Self/Interest.

  8.  **Final Review against constraints:** Long-form essay style, analytical, no survey of literature, focus on structure. (Proceed to generate output).

  *(Self-Correction Note during final review)*: I need to be careful not to simply say "Plato is right." I need to analyze the *structure of the disagreement* as requested. The user wants to know *why* they are stuck, not necessarily who is winning.

