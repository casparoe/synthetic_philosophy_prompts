answer: |-
  I concede the causal chain is continuous; there is no magical seam where physics stops and will begins. But you are conflating causal influence with normative control. Precommitment is smart stewardship, but it does not change the status of the outcome. You can choose to stop smoking today—that act is yours. But whether your lungs heal depends on genetics, past damage, and sheer luck. You can hire a clinician, but you cannot command their diligence or stop the healthcare system from failing. The chain stops precisely where another agent or nature can intervene without your consent. That boundary isn't drawn to soothe anxiety; it's drawn where your authority actually ends. If you claim the outcome is "up to you," you are claiming responsibility for what we call indifferents—things that have value but do not determine your worth.

  This is why we act with the *reserve clause*, meaning we undertake actions with an internal caveat that external factors may intervene. I will stay healthy, fate permitting. If you treat health as fully within your control and get sick despite your best efforts, you must judge yourself a failure. That is a false judgment. The left column contains only your *prohairesis*, or moral choice—the faculty that decides how to use what happens. That cannot be taken by fever or withdrawal. So tell me: if you tie your success to the health outcome, and genetics betray your best choices, are you then a failure? Or was your success already complete in the choosing itself?
