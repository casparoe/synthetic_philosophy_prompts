answer: |-
  **The Model of Perfect Genetic Omniscience**

  **Setting:** *A breakroom at an Evolutionary Psychology conference. Two researchers, DR. ARIS (a skeptic) and DR. BANCROFT (a modeler), are looking at a printout.*

  **ARIS:** Your "Mate-Selection Equilibrium" paper assumes that every human on a first date instantly knows the exact heterozygosity of their partner's Major Histocompatibility Complex.

  **BANCROFT:** Correct. Perfect genetic transparency.

  **ARIS:** Dave, the subjects are undergraduates. One of them thought "MHC" was a new motorcycle. They cannot see DNA with their eyes. The assumption is physically impossible.

  **BANCROFT:** Does the model predict who goes home together?

  **ARIS:** ...Yes. About 85% accuracy.

  **BANCROFT:** Then the assumption is valid.

  **ARIS:** It's not valid! It's a lie. You're building a theory on magic.

  **BANCROFT:** I'm not building it on magic, I'm building it on *predictions*. Friedman's rule: We don't test the assumptions; we test the implications. If I ask the undergraduates if they can see DNA, I'm not testing the model, I'm testing their introspection.

  **ARIS:** But the mechanism is the whole point of evolutionary psych! If they aren't actually smelling immune compatibility, your theory is wrong, even if the dating outcomes match.

  **BANCROFT:** That's descriptivism. That's sociology. In positive science, if they act *as if* they can smell immune compatibility, then for the purpose of the theory, they *do*.

  **ARIS:** So you're saying reality doesn't matter?

  **BANCROFT:** I'm saying reality is noisy. The assumption is supposed to be unrealistic. Friedman explicitly said the more significant the theory, the *more* unrealistic the assumptions tend to be. If humans actually *could* sequence DNA visually, this would just be biology. Because they can't, but the math works anyway? That's economics-grade science.

  **ARIS:** So if I publish a paper assuming people are omniscient telepaths, and it predicts they'll call their mothers on Sundays...

  **BANCROFT:** ...and people call their mothers on Sundays?

  **ARIS:** Yes.

  **BANCROFT:** Then you're not a fraud. You're a pioneer. Now, are you going to finish that bagel, or does the model assume you already ate it?

  ***

  ### Analysis of the Joke & Friedman's Methodology

  **Liberties and Strawmen**
  The joke leans heavily into the "strong instrumentalist" interpretation of Milton Friedman's 1953 essay, *The Methodology of Positive Economics*. This is often where the "F-twist" criticism arises.
  *   **The Caricature:** The joke presents Friedman as arguing that assumptions *never* matter and that predictive success alone validates a theory regardless of the mechanism.
  *   **The Nuance:** Friedman didn't argue that realism *never* matters, but rather that it is not the *primary criterion* for judging a theory. He argued that all theories are simplifications ("as if" constructs) and that demanding descriptive realism in assumptions often leads to useless complexity. He also emphasized that assumptions should be judged by whether they yield accurate predictions *in the specific context they are designed for*, not universally. The joke exaggerates this into a refusal to even check the mechanism, which Friedman might have cautioned against if it hindered future predictive power (e.g., in policy changes).

  **What Would Change My Mind**
  If the prompt required the joke to account for the **Lucas Critique**, the humor would fail. The Lucas Critique argues that if a model relies on unrealistic assumptions about how agents form expectations, it will fail when policy changes (because the agents' behavior changes).
  *   *Clarification:* If Friedman's view were presented as "Assumptions must be robust to structural changes," the joke's punchline (that impossible assumptions are fine because they predict static outcomes) would be methodologically weak. A model assuming genetic omniscience might predict dating in a stable environment but would fail catastrophically if a technology (like genetic testing apps) changed how people accessed that information. If the joke acknowledged that the model would break under structural change, it would be more accurate to modern economic criticism but less punchy as a satire of the F-twist.

  **Shakiest Reasoning**
  The shakiest part of my reasoning is equating **Economic Behavioral Assumptions** with **Evolutionary Psychological Mechanisms**.
  *   In economics, "rationality" is often a heuristic for aggregate behavior (the billiard player analogy).
  *   In evolutionary psychology, the assumption is usually about *hardware* (biological adaptation).
  *   Critiquing an econ model for "unrealistic rationality" is standard Friedmanite defense. Critiquing an evo-psych model for "impossible biological omniscience" is a critique of the *causal mechanism*, not just a simplifying assumption. By treating evo-psych like econ (focusing only on output), the joke glosses over the fact that evo-psych claims to be explaining the *cause* (evolution), not just the *pattern*. If the cause is impossible, the evolutionary claim is false, regardless of prediction. The joke treats this distinction as irrelevant, which is faithful to the F-twist satire but scientifically dubious.
