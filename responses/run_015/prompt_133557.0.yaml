  After the joke, please include a brief note on where you're taking liberties with Friedman's actual view or leaning on a contested interpretation — for instance, whether he really thinks realism never matters, or if that's a strawman people use. Also, say what kind of counter-example or clarification about the F-twist would change your mind about whether the joke captures the idea correctly, and point out the part of your reasoning that's shakiest.
