      *   *(3) vs. (4):* (3) seeks recovery of the invisible (often marginalized identities). (4) warns against modern identity categories. If the "invisible" are invisible *because* they don't fit modern categories, how do we identify them without anachronism?

  4.  **Deep Dive into Specific Conflicts:**

