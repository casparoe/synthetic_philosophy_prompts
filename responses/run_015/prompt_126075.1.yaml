prompt: |-
  I'm preparing interview questions for a philosophy-of-mind colloquium featuring an unnamed scholar who defends a modal-dispositional reading of Descartes' thesis that animals are automata. She argues that animal bodies possess a fully articulated structure of sensory-motor dispositions—capable of adaptive, context-sensitive response—yet entirely devoid of representational content or conscious awareness, and that Descartes' mechanistic physiology in fact requires this modal richness to explain behavioral flexibility without invoking a soul. I need eight to ten questions that press on the specifics of this interpretation rather than rehearsing generic dualism. At minimum, include: one question on how this dispositional completeness interacts with Descartes' account of human sensation mediated through the pineal gland—specifically whether the gland introduces a representational discontinuity in an otherwise continuous dispositional architecture; one on whether her reading exposes Descartes to a restricted problem of other minds concerning animals, since behavioral and dispositional evidence alone can never distinguish a modal-automaton from a minded being; and one on how she interprets Descartes' remarks in correspondence about animal vocalization and language—particularly whether the absence of a rational soul entails the absence of structured propositional attitudes rather than merely the absence of articulated speech. For each primary question, provide a targeted follow-up calibrated to the answer she is most likely to offer; for instance, if she appeals to mechanistic explanation in Descartes' physiological manuscripts to defend the modal richness of animal bodies, ask whether that same mechanistic framework could, in principle, be extended to human bodies without the pineal-gland intervention she reserves for humans, and what principled barrier prevents such an extension.
