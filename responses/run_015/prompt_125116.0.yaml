answer: |-
  You have identified a genuine gap in the terminology. You are describing a **Livelock caused by a Time-of-Check to Time-of-Use (TOCTOU) race condition**, but you are asking for the philosophical/cognitive equivalent of that specific architectural failure.

  There is no single, canonical philosophical term that cleanly separates "hard-wired rigidity" from "stale-model rigidity" in the way you want. However, the distinction you are drawing is central to **Control Theory**, **Distributed Systems**, and **Daniel Dennett's philosophy of mind**.

  Here is the breakdown of the concepts you are looking for, where the line falls, and how it applies to the free will debate.

  ### 1. The Technical Name: Livelock via TOCTOU
  In your backend systems, you already have the name. What you are describing is a **Livelock**.
  *   **Deadlock:** Two processes wait for each other forever. Nothing moves.
  *   **Livelock:** Two (or one) processes keep changing state in response to each other (or the environment) but make no progress.

  The specific mechanism is **TOCTOU (Time-of-Check to Time-of-Use)**. You check `is_free()`, it returns `true`. Before you `allocate()`, another thread allocates. Your error handler says `retry()`. You check `is_free()` again. If the contention is high, you loop forever.

  **The Fix:** In engineering, we fix this not by making the code "more flexible" (it's already a general state machine), but by increasing **isolation** (locks/transactions) or adding **jitter/backoff** to break the synchronization with the environmental change.

  ### 2. The Philosophical Name: Competence without Comprehension
  Douglas Hofstadter coined "Sphexishness" in *Gödel, Escher, Bach*, but Daniel Dennett (who worked closely with Hofstadter on this) refined it in *Elbow Room* and *Freedom Evolves*.

  Dennett argues that the wasp isn't "unfree" because it's biological; it's unfree because it lacks **informational sensitivity**.
  *   **Hard-wired Sphex:** The routine is fixed in the genome. It cannot be updated.
  *   **Stale-Model Sphex (You/Your Code):** The routine is flexible, but the **feedback loop latency** is too high relative to the **environmental volatility**.

  Dennett calls this **Competence without Comprehension**. The wasp is competent at nesting. You are competent at deploying. But neither of you *comprehends* the specific variable that is invalidating your model (the prankster moving the cricket / the race condition on the lock).

  The specific concept you are looking for is likely **The Frame Problem** or **Model-Reality Desynchronization**.
  *   **The Frame Problem:** In AI, this is the difficulty of programming a system to know what *didn't* change in the world when it took an action. The wasp assumes "burrow status" is the only relevant variable. It doesn't have a model for "predator moved cricket." Your code assumes "resource lock" is the only variable. It doesn't model "other deploy worker."

  ### 3. The Control Theory Distinction: Feedback Latency
  If you want a name for the *mechanism* of the failure distinct from hard-wiring, look to Cybernetics.

  *   **Hard-wired Rigidity:** Open-loop control (mostly). The system executes a sequence regardless of input.
  *   **Stale-Model Rigidity:** Closed-loop control with **high latency** or **low bandwidth**.

  The line between "free agent" and "Sphex" here is the **Nyquist-Shannon sampling theorem** applied to agency. To control a system, your internal model must update at least twice as fast as the fastest changing variable in the environment.
  *   **The Wasp:** Update rate = 1 inspection per nest entry. Environmental change rate (prankster) = faster than inspection. **Result: Aliasing/Livelock.**
  *   **Your Code:** Update rate = 1 check per deploy. Environmental change rate (other workers) = higher. **Result: Livelock.**
  *   **You in the Kitchen:** Update rate = 1 conscious thought per room entry. Environmental change rate (distraction) = higher. **Result: "Why am I here?"**

  So the distinction is **Bandwidth of Observation vs. Volatility of Environment**.

  ### 4. Does this distinction matter for Free Will?
  Yes, and it is the core of **Compatibilism**.

  Hard determinists say: "If the wasp is determined, and you are determined, you are just a complex wasp."
  Your insight refutes this by showing that **determinism is not the same as predictability or control.**

  *   **Case A (Hard-wired):** The system *cannot* incorporate new data even if available. (The wasp cannot learn the prankster exists).
  *   **Case B (Stale Model):** The system *can* incorporate new data, but currently isn't seeing it. (Your code *could* use distributed locks; you *could* write a note to yourself).

  In the free will debate, this distinction maps to **Avoidability**.
  Dennett argues that free will is the ability to avoid pitfalls *if you have reason to*.
  *   The wasp has no reason to suspect the cricket was moved. It lacks the sensors.
  *   Your code *has* the sensors (the database lock), but the architecture ignores them until failure.
  *   You *have* the sensors (your memory), but the context switch cleared the register.

  The philosophical term for the "fix" you are describing is **Second-Order Control**.
  *   **First-Order:** Do the task (Drag cricket / Deploy code / Walk to kitchen).
  *   **Second-Order:** Monitor the success of the task and adjust the strategy (Notice the loop / Add locking / Write a checklist).

  Sphexishness is the inability to engage Second-Order Control. Your backend system *has* Second-Order Control (the retry logic), but it lacks **Observability** (logs/metrics to see *why* it's retrying).

  ### 5. So, what do you call it?
  Since there isn't one word, you have to construct the label based on the diagnosis. If you are writing a post-mortem or a philosophical essay, use this taxonomy:

  1.  **Sphexishness (Classic):** Rigidity due to **Fixed Policy**. (The code is `if A then B`).
  2.  **Architectural Livelock (Your Case):** Rigidity due to **Stale State**. (The code is `while !Success { Check(); Act(); }` without locking).

  If you need a single phrase for the "stale model" phenomenon, the closest established term is **Rationality relative to a Model** (or **Local Rationality**). The agent is acting perfectly rationally given the information it has; the failure is in the **Information Gap**, not the **Decision Logic**.

  ### Summary of the Line
  The line between the two cases falls on **Modifiability** and **Observability**.

  *   **Hard-wired Sphex:** You cannot patch the wasp. It has no interface for updating its nesting routine. The rigidity is in the **Logic**.
  *   **Stale-Model Sphex:** You can patch the code. You can patch yourself (set a reminder). The rigidity is in the **Data Flow**.

  In the free will argument, this is the difference between **Determinism** (which we all have) and **Fatalism** (which only the wasp has). You are determined, but your determination includes the ability to refactor your own source code when you detect a livelock. The wasp's determination does not.

  **Recommendation:**
  Don't look for a new philosophical word. Use the engineering term **Livelock** and qualify it as **Observability-Induced**. It accurately conveys that the agent is active and flexible, but blind to the specific variable causing the loop. It shifts the blame from the *agent's nature* to the *agent's sensors*, which is exactly the distinction you identified.
