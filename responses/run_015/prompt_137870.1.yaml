answer: |-
  ### 1. The Argument in RL Vocabulary

  **A. Full Tree Unrolled (Model-Based Value Iteration)**
  Treat the Centipede game as a finite-horizon MDP where the transition dynamics $P(s'|s, a)$ include the opponent's policy $\pi_{opp}$.
  *   **Base Case:** At terminal node $T$, the reward $R_T$ is fixed. $V(T) = R_T$.
  *   **Recursion:** For $t = T-1 \dots 0$, perform the Bellman optimality backup. Since it's a zero-sum (or constant-sum) alternating turn game, the opponent's move at node $t$ is treated as a minimization (or maximization of their own value, which minimizes yours) over the action space.
  *   **Common Knowledge of Rationality:** This is encoded as the assumption that $\pi_{opp} = \text{argmax}_a Q_{opp}(s, a)$ at every node $s$. You possess the exact reward function and transition matrix for the opponent.
  *   **Convergence:** Value iteration converges in one sweep (since it's a tree, no cycles).
  *   **Result:** The backup propagates the terminal "defect" payoff backwards. At every node $t$, $Q_t(\text{Stop}) > Q_t(\text{Pass})$ because the model predicts $\pi_{opp}$ will Stop at $t+1$.
  *   **Policy Extraction:** $\pi^*(s_0) = \text{Stop}$. The "paradox" is simply the output of exact dynamic programming on a model where the opponent is hard-coded to maximize immediate reward at the last possible node.

  **B. Limited Lookahead + Bootstrapped Value (MCTS / TD-Learning)**
  You cannot unroll to $T$. You have a search horizon $k$ and a value network $V_\theta(s)$ trained on historical trajectories.
  *   **Search:** At node $t$, you unroll $k$ steps. At the leaf node $t+k$, you do not have a terminal reward. You bootstrap: $Target = R_{t:t+k} + \gamma^k V_\theta(s_{t+k})$.
  *   **The Induction Break:** The paradox relies on $V_\theta(s_{t+k})$ accurately reflecting the opponent's future defection.
      *   If $V_\theta$ was trained on-policy (where agents defect early), $V_\theta(\text{deep node})$ will be high-variance or biased low because those states are out-of-distribution (OOD).
      *   If $V_\theta$ assumes the opponent is rational, it assigns low value to deep nodes (expecting imminent defection).
  *   **Result:** If the bootstrap value $V_\theta(s_{t+k})$ is lower than the immediate "Stop" reward available at $t$, the Q-update pushes $\pi$ toward "Stop."
  *   **Failure Mode:** If exploration noise prevents the agent from ever reaching depth $k$, $V_\theta$ never corrects its estimate for deep nodes. The bootstrap perpetuates the prior belief that "deep nodes are low value," reinforcing early stopping. This is **distributional shift** in the value function causing convergence to the subgame-perfect equilibrium despite lack of data.

  **C. Mirror Self-Play (Shared Weights / Fixed Point)**
  Both players are instances of the same checkpoint $\pi_\theta$. "I know what you do" is no longer a belief; it is a parameter constraint.
  *   **Objective:** Find $\theta^*$ such that $\pi_\theta$ is a best response to itself. This is finding a Nash Equilibrium via gradient descent (or regret minimization).
  *   **Computation:** When computing the gradient at node $t$, you backpropagate through the opponent's computation graph. Since weights are shared, $\nabla_\theta J(\theta)$ accounts for how your change affects the opponent's future actions.
  *   **The Paradox as Convergence:** If the loss landscape has a global minimum at "Defect at $t=0$", both agents converge there. The "knowledge" of the opponent's move at node 40 is simply the forward pass of $\pi_\theta$ given state $s_{40}$.
  *   **Stability:** If the gradient at $t=0$ points toward "Pass" (because the mirror opponent also passes), the agent passes. However, standard RL optimizers (like PPO or DQN) minimizing Bellman error will typically find the SPNE (Defect Early) because the "Defect" gradient is non-zero and immediate, while the "Pass" gradient relies on long-horizon credit assignment which is noisy. The paradox persists if the optimization finds the SPNE fixed point.

  ***

  ### 2. Residue Report

  **Bucket 1: Carried Over Exactly**
  *   **Backward Induction $\leftrightarrow$ Bellman Optimality Backup:** The logic is isomorphic. $V(s) = \max_a \mathbb{E}[R + V(s')]$ is exactly the recursive step of backward induction.
  *   **Terminal Node $\leftrightarrow$ Base Case:** The boundary condition of the recursion is identical.
  *   **Policy $\leftrightarrow$ Strategy:** A mapping from state to action distribution.

  **Bucket 2: Fit Only After Being Bent**
  *   **Common Knowledge of Rationality $\leftrightarrow$ Shared Weights / Perfect Model:** In game theory, CKR is epistemic (infinite recursion of "I know that you know"). In RL, this is bent into *parametric* identity (shared weights) or *model-based* certainty (known transition dynamics). The bend: RL agents can have "common knowledge" of a buggy policy. If $\pi_\theta$ is suboptimal, the "rational" backward induction doesn't hold, whereas Game Theory assumes rationality is part of the definition.
  *   **Regret $\leftrightarrow$ Counterfactual Baselines:** Game theory uses regret to define equilibrium stability. RL uses regret for online bounds. But in Centipede, "regret" for not passing requires estimating the counterfactual reward of a path not taken. Standard on-policy RL (like REINFORCE) has high variance here; it needs bent tools like Counterfactual Regret Minimization (CFR) to match the game-theoretic precision.

  **Bucket 3: No Expression in Vocabulary**
  *   **Normative Rationality:** RL describes *convergent behavior*, not *prescribed rationality*. Game theory says "You *should* defect." RL says "If you optimize this loss, you *will* defect." The "ought" is missing.
  *   **Credible Threats / Promises:** In RL, a "threat" is just a state-action pair with low value. The semantic weight of a commitment (which sustains the paradox in some refinements) doesn't exist unless explicitly modeled in the state space (e.g., reputation vectors).
  *   **The "Nuts" Factor:** The empirical observation that humans don't defect. RL has no vocabulary for "social preference" unless you bend the reward function to include altruism, which changes the game definition rather than solving the paradox within the original payoff matrix.

  ***

  ### 3. The Two Curiosity Bits

  **Bit 1: Off-Path Beliefs and Equilibrium Notions**
  You are remembering **Sequential Equilibrium** (Kreps & Wilson) or **Trembling-Hand Perfect Equilibrium**.
  *   **The Notion:** A Nash Equilibrium only requires optimality on the equilibrium path. A *Subgame Perfect* Equilibrium (which yields the paradox) requires optimality in *every* subgame, even those never visited. Sequential Equilibrium adds a requirement for consistent beliefs off-path.
  *   **RL Equivalent:** This is the difference between **On-Policy** convergence (Nash-like, only optimizes visited states) and **Model-Based Planning / Off-Policy Correction** (Subgame Perfect, optimizes all reachable states).
  *   **Does it dissolve the paradox?**
      *   **Theoretically:** No. Backward induction *is* the algorithm for finding Subgame Perfect Equilibria. If you demand SPNE, the paradox stands.
      *   **Practically (in RL):** Yes. If you train an agent purely on-policy (e.g., standard PPO without exploration bonuses or counterfactual baselines), it never visits node 40. Its value estimate $V(s_{40})$ remains random or initialized. It cannot learn that "Defect at 40" is optimal. Consequently, it may learn to "Pass" at $t=0$ because its bootstrap estimate for deep nodes hasn't collapsed to the defect value yet.
      *   **Verdict:** The paradox rides right through the *theory* (SPNE), but dissolves in *practice* if your RL agent lacks the exploration or model capacity to evaluate off-path states correctly. The "paradox" is actually a feature of requiring optimality in counterfactual worlds.

  **Bit 2: Hard-Coded Rationality vs. Learned Opponents**
  Your gut is correct. The paradox collapses if you remove **Common Knowledge of Rationality (CKR)**.
  *   **The Mechanism:** Backward induction works because at node $T$, Player 2 *must* Take. This certainty propagates to $T-1$. If Player 2 is a learned agent with $\epsilon > 0$ (exploration) or bounded capacity, there is a probability $p > 0$ they Pass at $T$.
  *   **The Calculation:** If $P(\text{Opponent Pass at } T) > 0$, then $Q_{T-1}(\text{Pass})$ increases. If this probability is high enough (or the pot growth is steep enough), $Q_{T-1}(\text{Pass}) > Q_{T-1}(\text{Stop})$. This breaks the chain reaction. The "Defect" signal does not propagate back to $t=0$.
  *   **RL Context:** This is **Opponent Modeling Error** or **Stochastic Policy Evaluation**. In self-play, if both agents are $\epsilon$-greedy, they effectively play a "Trembling Hand" game. The unique SPNE of the Centipede game is fragile; it disappears if you introduce even tiny noise into the opponent's policy at the terminal node.
  *   **Verdict:** You are not sneaking anything in. The paradox is an artifact of the **deterministic, perfectly rational opponent assumption**. In RL, where opponents are function approximators with noise and generalization error, the "Defect at $t=0$" policy is often *not* the convergent solution. The "paradox" is a singularity in the idealized math that smooths out in learned dynamics. Your vocabulary captures this via **policy stochasticity** and **model mismatch**; the puzzle is less sharp in learning systems than in axiomatic game theory.
