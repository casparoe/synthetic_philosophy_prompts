      *   **Context:** First chapter of a handbook for judges/panelists. Needs to be "decision-grade" (actionable, administrable), not just philosophical.
      *   **Key Constraints:**
          *   Must handle specific distinctions/cases provided by the user (quotas vs. targets, benchmarks, membership fixing, parish register, same-five-people, decorative, hollow-benefit, symmetry, sunset/erosion, intersectionality).
          *   Must distinguish non-negotiable requirements from contingent preferences.
          *   Must identify incompatibilities (especially administrability vs. intersectionality).
          *   Must identify the "killer constraint" (the one requirement that knocks out the most theories).
          *   Must evaluate four specific contenders (Colourblind Individualism, Anti-Subordination, Diversity-as-Instrumental, Conditional-Pipeline-Parity) against the list.
          *   **Style:** British English. No citations/case names/reading lists. Concise table for the evaluation.
          *   **Tone:** Analytical, rigorous, practical, slightly sceptical but constructive.

  2.  **Deconstruct the User's "Conditional-Pipeline Parity" (Ashworth Rule):**
      *   *Definition:* Selection rate matches share of the pool qualified at the *last stage the institution didn't control*, discounting differences produced by the institution's own past practices.
      *   *Critique:* It's coherent but computationally heavy. It requires defining "control" and "past practices." It solves the benchmark problem but creates an evidence burden.

  3.  **Drafting the Requirements List (The Spec):**
      *   I need to translate the user's cases into functional requirements for a theory.
      *   *Requirement 1: Mechanism Sensitivity.* (From hard quota vs. target). A theory must distinguish *how* the number is hit, not just *that* it is hit.
      *   *Requirement 2: Benchmark Clarity.* (From conditional-pipeline parity). Must specify the reference class.
      *   *Requirement 3: Category Integrity.* (From opt-in surge/parish register). Must handle gaming and proxies without relying solely on intent.
      *   *Requirement 4: Substantive Impact.* (From same-five-people/decorative). Must look at power distribution, not just headcount.
      *   *Requirement 5: Beneficiary Alignment.* (From hollow-benefit). Must clarify whose good matters (institution vs. group).
      *   *Requirement 6: Asymmetry Justification.* (From symmetry case). If it treats groups differently, it needs a non-arbitrary reason (history/power).
      *   *Requirement 7: Dynamic Stability.* (From sunset/erosion). Must account for long-term effects on the pipeline and have an exit strategy.
      *   *Requirement 8: Intersectional Capacity.* (From intersection case). Must handle multiple disadvantages without double-counting or erasure.
      *   *Requirement 9: Administrability.* (From the prompt's core constraint). Must be actionable without metaphysical inquiries.

  4.  **Categorising Requirements (Non-negotiable vs. Contingent):**
      *   *Non-negotiable:* Mechanism Sensitivity, Benchmark Clarity, Category Integrity, Administrability. (Without these, the panel can't decide).
      *   *Contingent:* Symmetry (depends on the theory of justice), Beneficiary Alignment (depends on the goal), Dynamic Stability (depends on whether the goal is corrective or forward-looking).
      *   *Wait, re-evaluating:* The prompt asks for a theory *for a body that has to judge*. So Administrability is non-negotiable. Mechanism Sensitivity is non-negotiable (otherwise they can't distinguish quotas from targets). Benchmark Clarity is non-negotiable (otherwise they can't measure compliance).
      *   *Contingent:* Symmetry (some theories demand it, some don't), Beneficiary Alignment (some theories care about the group, some about the institution).

  5.  **Identifying Incompatibilities:**
      *   *The Big Tension:* Administrability vs. Intersectionality/Category Integrity.
      *   To be administrable, categories must be clear and stable (tick boxes). To handle intersectionality and avoid the "parish register" proxy problem, categories need to be fluid or deeply investigated.
      *   *The "Same-Five-People" vs. Administrability:* Checking if the *same* people hold multiple seats requires cross-institutional data sharing that a single tribunal might not have.
