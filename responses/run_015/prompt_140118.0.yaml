answer: |-
  ### Specification for a Decision-Grade Theory of Group-Conscious Selection

  You are asking for a tool, not a truth. The following specification outlines what a theory must be able to *do* to function in a tribunal or panel setting. It prioritises operational clarity over philosophical purity.

  #### 1. The Requirements List

  | Requirement | Definition | Case/Earned By | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Mechanism Sensitivity** | Must distinguish between rigid quotas, flexible targets, tie-breakers, and reporting duties. It cannot treat identical outcomes reached via different rules as morally equivalent. | *Hard Quota vs Target.* A quota blocks; a target guides. A theory that bans the outcome but allows the target (or vice versa) without explaining the procedural difference fails here. | **Non-Negotiable** |
  | **2. Benchmark Clarity** | Must specify the reference class for comparison (general population, applicant pool, or qualified pool). It cannot leave the panel to guess which denominator to use. | *Conditional-Pipeline Parity.* Without this, a 10% selection rate is meaningless. Is it 10% of applicants? 10% of the country? | **Non-Negotiable** |
  | **3. Classification Legitimacy** | Must provide criteria for judging the *basis* of the category, independent of the outcome. It must distinguish between a protected characteristic and a proxy that mimics it. | *The Parish Register Case.* If outcomes are identical to racial preference, the theory must explain why baptism records are permissible or impermissible without relying on "secret intent." | **Non-Negotiable** |
  | **4. Benefit Distribution** | Must track whether the benefits of the scheme are spread across the group or concentrated in a few individuals. | *The Same-Five-People Case.* A theory that counts headcount without checking unique beneficiaries allows tokenism. | **Non-Negotiable** |
  | **5. Authority Alignment** | Must distinguish between presence in a body and power within that body. | *The Decorative Case.* A board quota is void if the executive committee remains homogenous. The theory must value influence, not just attendance. | **Non-Negotiable** |
  | **6. Beneficiary Alignment** | Must state whose good justifies the scheme: the institution's (diversity of thought) or the group's (remediation). | *The Hollow-Benefit Case.* If the group gains nothing, is the scheme still valid? The theory must take a stance. | Contingent |
  | **7. Asymmetry Justification** | If the theory permits different rules for different groups (e.g., women vs men), it must provide a testable criterion for when asymmetry is allowed. | *The Symmetry Case.* A theory cannot simply assert "history matters"; it must define the threshold of historical disadvantage that triggers asymmetric permission. | Contingent |
  | **8. Dynamic Stability** | Must account for the scheme's effect on the pipeline over time and specify conditions for expiry. | *The Sunset/Erosion Case.* A scheme that cements dependency or fails to render itself obsolete must be identifiable. | Contingent |
  | **9. Intersectional Capacity** | Must handle candidates disadvantaged on multiple axes without forcing a single-axis choice or double-counting advantage. | *The Intersection Case.* Can the theory recognise a black woman's claim without reducing it to "race" OR "gender"? | Contingent |
  | **10. Administrability** | Must be actionable using evidence a panel can reasonably gather (documents, stats, testimony) without requiring metaphysical inquiry into identity or counterfactual history. | *The Opt-In Surge.* A panel cannot audit an applicant's soul. The theory must work with the data available. | **Non-Negotiable** |

  #### 2. Incompatibilities and Trade-offs

  There is a fundamental tension in this spec, specifically a trilemma between **Administrability**, **Intersectionality**, and **Classification Legitimacy**.

  *   **Administrability vs. Intersectionality:** To be administrable (Req 10), categories must be stable, mutually exclusive, and easily verified (e.g., tick-boxes). To handle intersectionality seriously (Req 9), categories must be fluid and context-sensitive. A panel cannot easily adjudicate "how black" or "how working class" someone is without invading privacy or creating perverse incentives. You cannot have a system that is both frictionless to administer and deeply sensitive to lived experience.
  *   **Administrability vs. Classification Legitimacy:** The *Parish Register Case* shows that proxies can replicate discrimination perfectly. To judge the legitimacy of the classification (Req 3) without relying on intent, the panel must analyse the *causal history* of the category. This violates Administrability (Req 10), which demands the panel look only at current rules and evidence.
  *   **Benefit Distribution vs. Administrability:** Tracking *The Same-Five-People* (Req 4) requires cross-institutional data sharing. A university admissions panel cannot know if an applicant already holds three other board seats. Without a central registry, this requirement is theoretically sound but practically dead.

  **Verdict on Joint Satisfiability:** You cannot satisfy all ten simultaneously. A decision-grade theory must sacrifice **Intersectional Capacity** or **Benefit Distribution** to preserve **Administrability**. If you prioritise the latter two, the handbook becomes a guide for social workers, not judges.

  #### 3. The Killer Constraint

  **Administrability (Req 10).**

  This is the single requirement that knocks out the most candidate theories. Most philosophical accounts of justice (anti-subordination, reparative justice) require knowledge of historical causality, social power dynamics, or counterfactuals ("where would this group be but for discrimination?"). A tribunal cannot compute this. They have a deadline, a file of evidence, and a mandate to apply rules, not rewrite history. Any theory that requires the panel to determine *why* a disparity exists before deciding *if* a remedy is allowed will fail in practice. It turns every selection decision into a royal commission on social history.

  #### 4. Evaluation of Contenders

  Here is how the four theories score against the specification.

  | Theory | Score | Commentary |
  | :--- | :--- | :--- |
  | **Colourblind Individualism** | **Fail** | Fails **Mechanism Sensitivity** and **Benchmark Clarity**. It treats all group-consciousness as identical impermissible acts. It passes **Administrability** easily (ignore the box), but offers no guidance on how to fix systemic skew, rendering it useless for a body mandated to judge *schemes* rather than ban them. |
  | **Anti-Subordination** | **Fail** | Fails **Administrability**. It requires the panel to adjudicate power dynamics and historical harm (**Asymmetry Justification**). It handles **Beneficiary Alignment** well, but collapses under the **Parish Register Case** (is this proxy subordinating?) because that requires intent analysis. |
  | **Diversity-as-Instrumental** | **Pass (with caveats)** | Passes **Administrability** and **Benchmark Clarity** (measure the outcome). Fails **Beneficiary Alignment** (permits *Hollow-Benefit*). Fails **Sunset** (if diversity is always good, the scheme never ends). It treats people as means to institutional ends, which may violate the tribunal's mandate. |
  | **Conditional-Pipeline Parity** (Ashworth) | **Borderline** | Passes **Benchmark Clarity** and **Mechanism Sensitivity**. Fails **Administrability**. The "last stage the institution didn't control" is a legal minefield. Defining "control" and discounting "past practices" requires counterfactual reasoning no panel can reliably perform. It is coherent, but not computable. |

  #### 5. Note on the Ashworth Rule

  Your **Conditional-Pipeline Parity** rule is theoretically robust but operationally hazardous.

  *   **Coherence:** Yes. It solves the "pool vs population" debate by anchoring the benchmark to the last external gatekeeper.
  *   **Computability:** No. To apply it, the panel must determine which disparities in the qualified pool are "natural" and which are "produced by the institution's own past practices." This requires a counterfactual history of the institution's recruitment, outreach, and testing over decades.
  *   **Verdict:** It is an excellent *audit* standard for a regulator with subpoena power and a five-year timeline. It is a poor *decision* standard for an admissions panel that must issue offers in six weeks. To make it decision-grade, you would need to hard-code the "last stage" (e.g., "standardised national exams") rather than leaving it as a variable for the panel to discover.

  ### Summary Recommendation

  For the handbook's first chapter, define the theory's success by its **Administrability**. If the panel cannot apply the rule without becoming sociologists or historians, the rule is defective. Accept that this means sacrificing deep **Intersectional Capacity** and **Benefit Distribution** tracking. The handbook should instruct panels to prefer schemes that are transparent about their mechanism (Req 1), clear about their benchmark (Req 2), and limited in duration (Req 8), even if those schemes are theoretically less "perfect" than a fully contextualised anti-subordination model.
