  6.  **Evaluating the Four Contenders:**
      *   *Colourblind Individualism:* Fails Mechanism Sensitivity (all group consciousness is bad). Fails Beneficiary Alignment (ignores group harm). Passes Administrability (mostly).
      *   *Anti-Subordination:* Passes Beneficiary Alignment. Fails Administrability (requires deep historical analysis of power). Struggles with Symmetry (needs to justify asymmetry).
      *   *Diversity-as-Instrumental:* Passes Administrability (easy to measure outcomes). Fails Beneficiary Alignment (beneficiaries might not gain). Fails Sunset (if diversity is always good, why stop?).
      *   *Conditional-Pipeline-Parity:* Passes Benchmark Clarity. Fails Administrability (hard to define "control" and "past practices"). Passes Mechanism Sensitivity (focuses on rates).

  7.  **Refining the Output (British English & Tone):**
      *   Use "programme," "centre," "labour," "whilst."
      *   Keep it sharp. No fluff.
      *   Ensure the "Ashworth Rule" gets a fair shake but is critiqued on computability.

  8.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the task. Set the stage.
      *   *The Specification (Requirements):* List them clearly. Mark N/N (Non-negotiable) vs C (Contingent).
      *   *The Incompatibilities:* Highlight the Administrability vs. Nuance clash.
      *   *The Killer Constraint:* Identify Administrability.
      *   *The Scorecard:* Create the table.

      *(Self-Correction during drafting)*: I need to make sure I address the "Parish Register" case specifically in the requirements. It's about *proxies*. The theory must distinguish between a proxy that replicates harm and a proxy that is neutral. Actually, the prompt asks if the theory has resources to say it *without sneaking in intent*. This suggests a requirement for *Proxy Neutrality* or *Mechanism Independence*. Let's call it "Form-Substance Alignment."

      *(Refining the "Killer Constraint")*: Is it Administrability? Or is it the "Beneficiary Alignment"? If a theory doesn't care if the beneficiaries benefit (Hollow-Benefit), is it a theory of *selection* or a theory of *institutional optimisation*? For a handbook on *judging selection schemes*, the theory must explain why the selection is justified *relative to the people selected*. I think Administrability is the practical killer, but "Beneficiary Alignment" is the theoretical killer. The prompt asks what knocks out the most *candidate theories*. Philosophical theories often fail on Administrability. Let's stick with Administrability as the practical killer for *this specific handbook context*.

      *(Refining the "Ashworth Rule")*: The user wants me to test it. Is it coherent? Yes. Computable? Barely. It requires counterfactuals ("would they have qualified if we hadn't discriminated before?"). That's hard for a panel. I should flag this in the evaluation.

      *(Refining the "Symmetry" requirement)*: The prompt suggests "must be symmetric" is contingent. I agree. A theory of remediation *must* be asymmetric. A theory of procedural fairness *must* be symmetric. The requirement should be "Asymmetry Justification" — the theory must explain *why* asymmetry is allowed or forbidden.

  9.  **Final Review against Constraints:**
