prompt: |-
  I lead a four-person long-term policy evaluation unit inside a national audit office. Every two or three weeks we are handed a government proposal with effects that run past the next election and often past the next census — radioactive waste disposal, pension reform, energy infrastructure, fertility and family policy, large-scale housing and transport corridors — and we have about a day and a half to produce a short impact section that goes into a public report to a parliamentary committee, plus a one-page sign-off note to a director who has to defend it in person. None of my team has philosophy training; one has a statistics background. We cannot build population models beyond rough ranges, and we cannot look anything up beyond what is in the proposal and its annexes.

  Our standard template asks three questions: who is made worse off, by how much, and can they be compensated or the cost offset? Increasingly we hit proposals where the honest answer to the first question is that the people who will bear the burden would not have existed at all if we had chosen differently — because the policy changes energy prices, labour markets, family timing, or where people live, and therefore changes who meets whom and which children are conceived. Under the alternative, other people would have lived instead. So the sentence our template wants us to write — that the policy harms future people — looks unavailable, and our drafts currently fudge this with vaguer wording that I do not think survives questioning.

  I want a written procedure my team can actually run in the time we have. I do not need the intellectual history or references; I need an instrument.

  Specifically, please give me:

  A screening step that decides, in the time available, whether a proposal affects which people come to exist. Distinguish at least three outcomes — the policy is identity-locked (the same people either way), identity-scrambled (different people, roughly the same number, roughly similar lives), and identity-generative (a different number of people, or lives of a different shape). Tell us what counts as a sufficient answer at this step, what to do when the evidence only supports a probability rather than a yes or no, and what to do when the screen comes out mixed: identity-locked for the next twenty years, scrambled after that. Give us a materiality rule for that mixed case and say plainly what adopting it costs us.

  A branching procedure. Where the policy is identity-locked, our existing person-affecting harm comparison is fine and I only want you to tighten it. Where it is identity-scrambled or identity-generative, the harm statement is unavailable, and the procedure must say what replaces it: what finding we are permitted to write, in what words, and what we must never write. In particular, address the temptation to write that these people would have been better off under the alternative — tell us whether that sentence is ever defensible and, if it is, under what description of the comparator.

  Rules for the cases that break the clean branch, which are the ones that actually reach my desk:

  Near-identity cases, where the policy changes a detail of origin — the month of a conception, which of two embryos, whether a birth is medically assisted — so that arguably the same person exists with a different life, arguably a different person exists. Handle the view that a person could not have originated from different gametes as one input among alternatives, and tell us what to write when we cannot settle it.

  The mixed population case, where the same proposal makes identifiable living people worse off and also scrambles the identity of later generations. Give us a rule for combining a person-affecting finding about the living with a non-person-affecting finding about the unborn into a single sentence that does not equivocate between frameworks.

  Cumulative sequences, where each decision in a programme is individually identity-locking but the programme as a whole scrambles identities. Tell us whether the procedure evaluates the decision, the programme, or the standing policy, and how to phrase the finding when the answer is the programme.

  The asymmetry case, where a proposal both adds people and changes the quality of life of people who would otherwise not have existed, and quality is somewhat lower but every life is well worth living. Tell us where the procedure stops and hands this to a named person, on the grounds that the disagreement is about values and not about facts.

  At each branch, separate three things explicitly: what the procedure settles, what it settles only after the office has committed itself to one contested moral frame, and what it cannot settle at all. Where a frame must be chosen — a person-affecting restriction, an impersonal total or average comparison, a threshold or sufficiency standard, a rights-based or practice-based ground — say who signs off, what the report must disclose about the choice having been made, and how the same proposal would come out under a different permitted frame. Include a stop rule that returns an explicit no-finding output rather than a fudge.

  Then run the whole procedure on three proposals, showing the branches taken and the actual wording you would let me put in the report:

  One, a choice between building a deep geological repository for long-lived radioactive waste now, at large immediate cost and with small expected releases far in the future, and continuing interim surface storage for another century, at lower immediate cost and with a larger expected burden borne by whoever is doing the monitoring then.

  Two, a rise in the state pension age, which changes labour supply, savings and the timing of children, so that within roughly two generations the population is different, while also making identifiable people now in their fifties and sixties worse off.

  Three, a proposal my team wants to approve and expects to approve: a publicly funded expansion of fertility treatment and neonatal care in a country with a low birth rate, which will lead to a somewhat larger future population whose lives are somewhat more strained — by congestion, fiscal load and competition for places — than they would have been under a smaller-population path, though comfortably worth living. Apply the procedure without softening it, and tell me what it returns even if the result is that our recommendation has to rest on a frame the office would repudiate, or that the only defensible finding is the no-finding output.

  Finally, be straight with me about what the procedure cannot do. I want to know which questions in our current template have to be deleted outright rather than revised, where the procedure will systematically misfire on the proposals we actually get, and which part of the difficulty is not representable in a checklist at all and has to be carried by the director's judgment in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Head of a 4-person policy evaluation unit in a national audit office.
      *   **Constraints:** 1.5 days per proposal, no philosophy training, limited data (only proposal + annexes), limited modeling capability.
      *   **Problem:** The standard template ("Who is worse off?") fails for future generations due to the Non-Identity Problem (policies change *who* exists, not just *how well* they live). Current drafts fudge this.
      *   **Goal:** A written, actionable procedure (instrument) to handle identity-affecting policies within the time/budget constraints.
      *   **Specific Requirements:**
          *   Screening step (Identity-locked vs. Scrambled vs. Generative).
          *   Branching procedure (what to write in each case).
          *   Rules for edge cases (Near-identity, Mixed population, Cumulative sequences, Asymmetry).
          *   Explicit separation of what is settled, what requires a moral frame commitment, and what is unsettleable.
          *   Sign-off/disclosure rules for moral frame choices.
          *   Stop rule (No-finding output).
          *   Application to three specific test cases (Radioactive waste, Pension age, Fertility expansion).
          *   Honest assessment of limitations (what to delete from template, where it misfires, what requires human judgment).

  2.  **Deconstruct the Ethical/Logical Core:**
      *   The core issue is the *Non-Identity Problem* (Parfit). If a policy changes the timing of conception or the partners meeting, the specific future individuals are different. Therefore, you cannot say Policy A *harms* Person X compared to Policy B, because Person X wouldn't exist under Policy B.
      *   *Standard Audit Logic:* Counterfactual comparison (A vs. B for the *same* subject).
      *   *Future Generations Logic:* Impersonal comparison (State of World A vs. State of World B) or Rights-based thresholds.
      *   *Constraint:* The team cannot do deep philosophy. They need a flowchart/checklist approach.

  3.  **Drafting the Procedure - Section by Section:**

      *   **Section 1: The Identity Screen.**
          *   Need clear criteria for Locked, Scrambled, Generative.
          *   *Locked:* Same specific individuals (short term, immediate impact).
          *   *Scrambled:* Different individuals, similar count/quality (long term, structural changes).
          *   *Generative:* Different count or radically different quality of life (demographic shifts).
          *   *Probabilities/Mixed:* Use a time horizon cutoff (e.g., 50 years or 2 generations). If mixed, apply a materiality rule (if >50% of impact falls on scrambled, treat as scrambled).
          *   *Cost:* Acknowledge loss of precision on specific harm attribution.

      *   **Section 2: Branching Procedure.**
          *   *Locked:* Use standard template ("Person X loses $Y").
          *   *Scrambled/Generative:* Cannot use "harm." Must use "Condition Comparison."
          *   *Forbidden Language:* "Future people are worse off."
          *   *Permitted Language:* "The future population faces higher risks/lower resources than the counterfactual population."
          *   *Comparator:* Compare *states of affairs*, not *persons*.

      *   **Section 3: Edge Cases.**
          *   *Near-Identity:* (e.g., IVF embryo selection). Treat as *Locked* for practical purposes unless specific genetic disease is involved. If unsure, default to *Scrambled* to be safe.
          *   *Mixed Population:* (Living + Unborn). Split the sentence. "Identifiable Group A loses X; Future Group B faces Condition Y." Do not aggregate into a single "harm" metric.
          *   *Cumulative Sequences:* Evaluate the *Programme*, not the individual decision. Phrase as "The cumulative effect of the programme alters population identity."
          *   *Asymmetry:* (More people, lower quality but still good). This is the "Repugnant Conclusion" territory. *Stop Rule.* Hand to Director. This is a value judgment, not an audit fact.

      *   **Section 4: Governance & Sign-off.**
          *   Distinguish: Fact (settled), Frame (requires choice), Mystery (unsettleable).
          *   If a moral frame is chosen (e.g., Total Utilitarianism vs. Person-Affecting), the Director must sign off, and the report must disclose: "This finding rests on Frame X."
          *   No-Finding Output: "The Office cannot determine harm under standard criteria due to identity substitution."

      *   **Section 5: Test Cases.**
          *   *Radioactive Waste:* Long-term. Identity-Scrambled. Finding: Compare risk levels, not harm to specific people.
          *   *Pension Age:* Mixed. Living losers (Locked) + Future different people (Scrambled). Split finding.
          *   *Fertility Expansion:* Asymmetry/Generative. More people, strained lives. Likely triggers the Stop Rule/Value Judgment.

      *   **Section 6: Limitations.**
          *   Template deletion: "Who is made worse off?" must go for future generations.
          *   Misfire: Small probability high impact events.
          *   Human Judgment: The Director defending the moral frame choice.

  4.  **Refining the Tone:**
      *   Must be bureaucratic but precise.
      *   No academic jargon (avoid "Non-Identity Problem," "Parfit," "Repugnant Conclusion" in the actual procedure text, though I can use them in the explanation if needed. Actually, the prompt says "I do not need the intellectual history," so keep the procedure clean).
      *   Action-oriented verbs.
      *   Acknowledge the pain points (the "fudge").

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the screening step too hard for 1.5 days?
      *   *Fix:* Make the screen based on *time horizon* and *mechanism* (does it change marriage/migration/conception timing?), not deep demographic modeling.
      *   *Critique:* The "Asymmetry" case is tricky. If the office *wants* to approve it, the procedure might block it.
      *   *Fix:* The procedure must be honest. If it triggers a value judgment, the procedure says "Stop, Director decides." The prompt asks me to apply it *without softening*. So if the procedure says "No Finding," I must report that.
      *   *Critique:* The "Mixed Population" sentence needs to be very tight to avoid equivocation.
      *   *Fix:* Use semicolons or distinct clauses. "For Group A... For Group B..."

  6.  **Final Polish:**
      *   Ensure all constraints from the prompt are met (Screening, Branching, Edge Cases, Sign-off, Test Cases, Limitations).
      *   Check the "No-finding output" requirement.
      *   Ensure the distinction between "Fact," "Frame," and "Unsettleable" is clear.

  7.  **Final Output Structure:**
      *   **Procedure Title:** Operational Protocol for Intergenerational Impact Assessment (OPIIA).
      *   **Part 1: Identity Screen.**
      *   **Part 2: Branching Logic.**
      *   **Part 3: Edge Case Rules.**
      *   **Part 4: Governance & Disclosure.**
      *   **Part 5: Application to Test Cases.**
      *   **Part 6: Limitations & Template Revision.**

  *(Self-Correction on Test Case 3)*: The prompt says "a proposal my team wants to approve." If the procedure returns a "No-Finding" or "Value Judgment Required," that might be uncomfortable. I must follow the instruction: "Apply the procedure without softening it." If the procedure says this requires a moral frame the office might repudiate, I must state that.

  *(Refining the "Asymmetry" rule)*: The prompt asks for a stop rule that hands it to a named person. I will designate the Director.

  *(Refining the Template)*: The prompt asks what questions must be deleted. "Who is made worse off?" is the main casualty for future generations.

  Let's write the response.cw
answer: |-
  # Operational Protocol for Intergenerational Impact Assessment (OPIIA)

  **Effective Date:** Immediate
  **Authority:** Director of Policy Evaluation
  **Applicability:** All proposals with impact horizons exceeding 40 years.

  ## 1. The Identity Screen
  **Purpose:** To determine within 2 hours whether the standard "harm to specific persons" template applies.
  **Input:** Proposal text, annexes on demographic/economic modeling.

  **Step 1.1: Mechanism Check**
  Does the policy alter any of the following variables compared to the counterfactual?
  *   Timing of conception/birth (e.g., via income shifts, pension age, housing availability).
  *   Migration patterns or settlement locations.
  *   Partner matching markets (e.g., via labor mobility, education access).

  *   **If NO:** Proceed to **Status: Identity-Locked**.
  *   **If YES:** Proceed to Step 1.2.

  **Step 1.2: Horizon Check**
  How many generations pass before the variable changes in Step 1.1 fully propagate?
  *   **< 20 years (approx. 1 generation):** Proceed to **Status: Identity-Locked**.
  *   **20–60 years (approx. 2 generations):** Proceed to **Status: Identity-Scrambled**.
  *   **> 60 years OR explicit population size change:** Proceed to **Status: Identity-Generative**.

  **Step 1.3: Probability and Mixed Outcomes**
  *   **Probability:** If evidence supports only a probability (e.g., "likely to shift conception timing"), treat the status as the *higher* category (Locked → Scrambled → Generative).
  *   **Mixed:** If the policy is Identity-Locked for 20 years but Scrambled thereafter:
      *   **Materiality Rule:** If >50% of the estimated monetary or risk impact falls in the Scrambled/Generative period, classify the *whole proposal* as Scrambled/Generative.
      *   **Cost of Adoption:** You lose the ability to attribute specific losses to specific named future individuals. You gain logical consistency.

  **Output of Screen:** One of three statuses: **Locked**, **Scrambled**, or **Generative**.

  ---

  ## 2. Branching Procedure
  **Purpose:** To dictate the permissible wording of the impact finding based on the Screen status.

  ### Branch A: Identity-Locked
  *   **Settled:** Standard person-affecting logic applies.
  *   **Procedure:** Use existing template ("Who is worse off?").
  *   **Tightening:** You must explicitly state the counterfactual: "Person Group X retains identity but suffers Loss Y compared to Proposal B."

  ### Branch B: Identity-Scrambled (Different people, similar number/shape of lives)
  *   **Settled:** You cannot assert harm to specific individuals.
  *   **Frame Commitment:** The Office adopts an **Impersonal State-of-Affairs Frame**. We compare the *quality of the future world*, not the *welfare of specific future people*.
  *   **Permitted Finding:** "Under Proposal A, the future population faces [Risk/Cost Level X]. Under Proposal B, the future population faces [Risk/Cost Level Y]. Proposal A results in a future state with higher aggregate burden."
  *   **Forbidden Language:** Do not write "Future people are harmed," "Future people lose out," or "Future people would have been better off."
  *   **Comparator:** You are comparing *World A* to *World B*.
  *   **Defensibility:** The sentence "These people would have been better off under the alternative" is **never defensible** in this branch. It is logically false because "these people" would not exist under the alternative.

  ### Branch C: Identity-Generative (Different number of people or radically different life shapes)
  *   **Settled:** Standard welfare metrics fail.
  *   **Frame Commitment:** Requires a choice between **Total Welfare** (more lives = good) vs. **Average Welfare** (higher quality = good) vs. **Threshold** (lives must be worth living).
  *   **Procedure:** **STOP.** Do not draft a finding.
  *   **Action:** Escalate to Director (see Section 4).

  ---

  ## 3. Edge Case Rules
  **Purpose:** To handle cases that break the clean branch.

  ### 3.1 Near-Identity Cases
  *(e.g., Policy changes conception month or selects Embryo A over Embryo B)*
  *   **Rule:** Treat as **Identity-Locked** for audit purposes unless the alternative involves a specific, identifiable genetic condition that constitutes a rights violation.
  *   **Rationale:** The "same person" metaphysical debate is outside audit competence.
  *   **Uncertainty:** If you cannot settle whether the person is the same, default to **Identity-Scrambled** wording to avoid logical error.

  ### 3.2 Mixed Population Cases
  *(Identifiable living people worse off + Unborn identity scrambled)*
  *   **Rule:** Do not aggregate into a single "harm" sentence. Use a **Split Finding**.
  *   **Wording Template:** "For the cohort currently aged 50–60, Proposal A reduces net wealth by $X. For subsequent generations, Proposal A establishes a future state with higher infrastructure risk than the counterfactual."
  *   **Constraint:** Do not use the word "compensation" to link the two groups. Compensation implies a victim; the second group are not victims in the person-affecting sense.

  ### 3.3 Cumulative Sequences
  *(Individual decisions are Locked; the Programme is Scrambled)*
  *   **Rule:** Evaluate the **Programme**, not the individual decision.
  *   **Wording:** "While individual tranches of this programme affect identifiable beneficiaries, the cumulative effect of the standing policy alters population identity after Year 40. This finding assesses the Programme as a whole."
  *   **Reason:** Evaluating the decision in isolation hides the intergenerational shift.

  ### 3.4 The Asymmetry Case
  *(Adds people + Lowers quality of life slightly, but lives remain "worth living")*
  *   **Rule:** **Stop Rule.**
  *   **Action:** Return **No-Finding Output**.
  *   **Handoff:** Escalate to Director.
  *   **Reason:** This is a disagreement about values (Total vs. Average vs. Sufficientarian), not facts. The audit office cannot arbitrate whether a larger, slightly poorer population is "worse" than a smaller, richer one without adopting a contested moral theory.

  ---

  ## 4. Governance, Sign-Off, and Disclosure
  **Purpose:** To separate fact, frame, and judgment.

  **4.1 Classification of Outputs**
  *   **Fact:** Data contained in the proposal (e.g., "Cost is $10B"). *Settled by Analyst.*
  *   **Frame:** The moral lens used to interpret the data (e.g., "We compare states of affairs, not persons"). *Settled by Office Policy (this document).*
  *   **Unsettleable:** Value judgments on population size/quality trade-offs. *Settled by Director.*

  **4.2 Disclosure Requirement**
  If Branch B (Scrambled) is used, the report must include this footnote:
  *"This assessment compares future states of affairs. Because the policy alters which individuals come to exist, the Office does not attribute 'harm' to specific future persons."*

  If Branch C (Generative/Asymmetry) triggers the Stop Rule, the Director's sign-off note must state:
  *"This proposal requires a value judgment on population ethics outside the audit mandate. Recommendation rests on [Named Frame, e.g., Average Welfare], which is not an objective fact."*

  **4.3 No-Finding Output**
  If the Stop Rule is triggered, the report section reads:
  *"The Office cannot determine whether this proposal makes the future 'worse off' under standard criteria. The choice depends on whether priority is given to population size or average quality of life. This is a matter for parliamentary decision."*

  ---

  ## 5. Application to Test Cases

  ### Case 1: Radioactive Waste (Deep Repository vs. Interim Storage)
  *   **Screen:**
      *   Mechanism: Long-term monitoring requirements affect labor/settlement over centuries.
      *   Horizon: > 60 years.
      *   **Status:** **Identity-Scrambled** (Different people will exist to monitor/handle the waste).
  *   **Branch:** Branch B (Scrambled).
  *   **Finding Wording:** "Deep geological storage imposes high immediate costs but reduces the radiological risk burden on the future population compared to interim storage. Interim storage defers cost but establishes a future state requiring higher ongoing monitoring resources and carrying greater containment risk for the population resident at that time."
  *   **Forbidden:** "Future generations are harmed by interim storage."
  *   **Sign-off:** Analyst signs; standard Disclosure Footnote applied.

  ### Case 2: Pension Age Rise
  *   **Screen:**
      *   Mechanism: Changes labor supply and savings, altering family timing.
      *   Horizon: Impact on living (now) + Impact on unborn (2 generations).
      *   **Status:** **Mixed Population** (Living = Locked; Unborn = Scrambled).
  *   **Branch:** Branch A (for living) + Branch B (for unborn).
  *   **Finding Wording:** "For persons currently aged 50–65, the proposal reduces expected lifetime pension wealth by an average of $X. For persons born after 2050, the proposal establishes a fiscal state with lower public debt but higher retirement age than the counterfactual. The Office does not attribute harm to the post-2050 cohort as their identity is contingent on the policy."
  *   **Sign-off:** Analyst signs; standard Disclosure Footnote applied.

  ### Case 3: Fertility Treatment Expansion
  *   **Screen:**
      *   Mechanism: Explicitly increases birth rate.
      *   Horizon: Immediate population increase.
      *   **Status:** **Identity-Generative** (Different number of people).
      *   **Quality:** Lives are "strained" but "worth living."
      *   **Sub-Status:** **Asymmetry Case** (More people, slightly lower average quality).
  *   **Branch:** Branch C (Generative) → Section 3.4 (Asymmetry).
  *   **Procedure Result:** **Stop Rule Triggered.**
  *   **Finding Wording:** "The Office cannot determine whether this proposal makes the future 'worse off' under standard criteria. The choice depends on whether priority is given to population size or average quality of life. This is a matter for parliamentary decision."
  *   **Sign-off:** **Director must sign.**
  *   **Disclosure:** Director's note must state: "Approval of this policy implicitly adopts a Total Welfare frame (more lives = good) over an Average Welfare frame. This is a value choice."
  *   **Outcome:** Your team cannot "approve" this using the standard template. You must flag the value conflict.

  ---

  ## 6. Limitations and Template Revision

  **6.1 Template Deletions**
  You must delete the following question from the standard template for any proposal flagged **Scrambled** or **Generative**:
  *   *DELETE:* "Who is made worse off?"
  *   *REPLACE WITH:* "How does the future state of affairs compare to the counterfactual?"

  You must delete:
  *   *DELETE:* "Can they be compensated?"
  *   *REPLACE WITH:* "Can the burden be mitigated or offset within the future state?" (Compensation implies a victim who existed in both worlds; mitigation applies to the condition).

  **6.2 Systematic Misfires**
  *   **Low-Probability High-Impact:** The Screen relies on "expected" impacts. If a policy has a 1% chance of causing civilizational collapse (identity-erasing), the Screen may classify it as Scrambled rather than Generative/Existential. The procedure cannot capture existential risk nuance.
  *   **Cultural Identity:** The procedure treats identity as biological/demographic. It does not capture changes to cultural or national identity that might occur without population substitution.

  **6.3 The Unrepresentable Difficulty**
  The checklist cannot resolve the **Director's Defense**.
  *   **The Problem:** When the Director stands before the Parliamentary Committee and says, "We cannot say these future people are harmed, but the future world is worse," a Member of Parliament will ask, "Worse for whom?"
  *   **The Reality:** The Director must answer, "Worse in an impersonal sense." This is philosophically coherent but politically weak.
  *   **The Burden:** This procedure protects *your team* from writing logical falsehoods. It does not protect the *Director* from the political cost of admitting that audit logic breaks down over long time horizons. The Director must carry the weight of explaining why the Office sometimes returns a "No-Finding" on purpose.

  **6.4 Final Instruction**
  If a proposal triggers the Stop Rule (Case 3), do not attempt to draft a workaround. Submit the No-Finding Output. It is better to be silent on the value judgment than to be wrong on the logic.
