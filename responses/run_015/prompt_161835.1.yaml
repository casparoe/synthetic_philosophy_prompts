  ## 4. Limitations: What This Activity Can't Do

  You cannot stage the *entire* argument. You need to speak two sentences explicitly to bridge the gap between the game and the philosophy.

  **The Gap:** The game simulates *memory drift*. Wittgenstein's argument is deeper: it's about the *grammar* of "following a rule."
  **What to say (in the Debrief):**
  "In the game, the problem was that your memory might fade. Wittgenstein's point is sharper. He says even if your memory was perfect, a private signal still can't tell you what 'correct' means. Because 'correct' implies the possibility of being wrong. If only you can check the check, you can't be wrong. And if you can't be wrong, you aren't following a rule."

  **Why this has to be spoken:** You can't simulate "logical possibility" in a bar game. You can only simulate "practical uncertainty." You must supply the logical step.

