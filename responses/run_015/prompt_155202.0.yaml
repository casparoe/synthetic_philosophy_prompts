  Based on Kessler's four precedents, her theory of **Indirect Normativity** hinges on the integrity of the *deliberative setup* rather than the moral quality of the *outcome* or the *content* of the consent. The norm "bites" (is violated) only when the mechanism for generating legitimacy is corrupted, excluded, or bypassed.

  Here is the analysis of the three rules against her precedents and the new blockade case, followed by the verdict on which rule governs her thinking and the case that separates them.

  ### 1. The Verdicts on the Blockade Case

  **Rule A: Consent-under-Parity (CuP)**
  *   **Definition:** An action is permissible only if affected parties would consent to it under conditions of equal power and information.
  *   **Application:** The residents explicitly said "No." Even under parity, low-income residents facing immediate blackouts (heating, medical equipment, security) are unlikely to consent to bear the cost for a diffuse global benefit, especially when they lack the power to negotiate mitigation. The explicit refusal breaks the parity condition.
  *   **Verdict:** **Violation.**

  **Rule B: Mirror-Rotation of Practical Identity (MRPI)**
  *   **Definition:** An action is permissible only if the actors can structurally and empathically "rotate" into the identity of the affected parties without contradiction (i.e., they share the burden or represent the identity).
  *   **Application:** In the *Tax* case, legislators represent the workers constitutionally; the rotation is structural. In the *Blockade* case, the activists are external agents imposing a cost on a specific community they do not inhabit. They cannot rotate into the "blackout victim" identity while maintaining their "climate savior" identity without negating the residents' explicit veto. The identity link is broken.
  *   **Verdict:** **Violation.**

  **Rule C: Procedural-Reflexivity (PR)**
  *   **Definition:** An action is permissible if the deliberative process itself is transparent, inclusive, and capable of registering feedback, regardless of whether the feedback alters the outcome. The norm binds the *mechanism*, not the *result*.
  *   **Application:** The activists held open forums, invited the residents, and registered their objections. This mirrors the *Tax* precedent (full open debate, outcome hated) and the *Psych* precedent (process corrected via debrief). Unlike the *Eminent Domain* case (where standing was denied), here standing was offered via the forum. The procedure was reflexive (input was received and weighed), even if the output diverged from the residents' wishes.
  *   **Verdict:** **No Violation.**

  ### 2. Which Rule Matches Kessler's Approach?

  **The Best Match: Procedural-Reflexivity (PR)**

  Kessler's judgments are best explained by **Procedural-Reflexivity**. This rule is the only one that consistently accounts for her "No Violation" verdict in the **Carbon Tax** case.

  *   **Why CuP fails:** If Kessler followed Consent-under-Parity, the *Carbon Tax* should have been a violation. The fossil-fuel workers "hated it." Under parity, they likely would not have consented to economic harm. Kessler's clearance of the Tax implies that *actual or counterfactual consent* is secondary to the *soundness of the debate*.
  *   **Why MRPI fails:** Mirror-Rotation struggles with the *Psych Study*. Deception inherently breaks the identity mirror (the subject does not know what the researcher knows). Kessler only clears it because the *debrief* repairs the procedural gap. MRPI focuses on the relationship state, whereas Kessler focuses on the *repair mechanism*.
  *   **Why PR succeeds:** PR explains all four precedents through the lens of the **deliberative setup**:
      *   *Factory:* Setup corrupted (data hidden). -> Violation.
      *   *Tax:* Setup sound (open debate). -> No Violation (outcome irrelevant).
      *   *Psych:* Setup repaired (debrief). -> No Violation.
      *   *Eminent Domain:* Setup excluded (no standing). -> Violation.

  In the Blockade case, Kessler would likely say **No Violation**. She would argue that the activists satisfied the *indirect* norm by establishing a deliberative channel (the forum). The residents' "No" was an input into the reflexive loop, not a veto on the loop itself. Just as the legislature could override the workers' hate, the activists can override the residents' refusal, provided the *process of hearing them* was genuine.

  ### 3. The Further Case That Separates Them

  To distinguish **Procedural-Reflexivity** from the other two rules (which often overlap in verdicts), you need a case where **Consent and Identity are aligned, but the Procedure is absent.**

  **The Case: "The Benevolent Bypass"**
  > A wealthy philanthropist notices a neighborhood's water supply is toxic. She knows the residents would agree to her fixing it if asked. She also identifies deeply with their plight (she grew up there). However, she acts immediately without consulting them, bypassing any deliberative forum to save time. The water is fixed; everyone is happy.

  *   **Consent-under-Parity:** **No Violation.** (Hypothetical consent is clear; they benefit).
  *   **Mirror-Rotation:** **No Violation.** (Identity is shared; burden is not imposed).
  *   **Procedural-Reflexivity:** **Violation.** (The *idealized deliberation setup* was never instantiated. The norm bites the lack of process, even if the outcome is good and consent is likely).

  **Why this separates them:**
  This case isolates Kessler's specific commitment to **Indirect Normativity**. If she calls this a **Violation**, she confirms that the *procedure itself* is the locus of the norm, not the welfare or consent it produces. The other two rules would clear the philanthropist, but Kessler's framework (based on the *Factory* and *Eminent Domain* precedents where process failures triggered violations regardless of other factors) suggests she would flag the lack of standing/deliberation as a normative failure.
