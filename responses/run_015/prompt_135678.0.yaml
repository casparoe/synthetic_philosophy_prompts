  # CERTIFICATION AUTHORITY FOR ADAPTIVE AGENTS (CAAA)
  ## OPERATIONAL AUDIT PROCEDURE 7.4: SPHEXISH-FLEXIBILITY DETERMINATION

  **TO:** Certified Behavioral Auditors (Level II and above)  
  **FROM:** Lead Behavioral Auditor, Standards Division  
  **SUBJECT:** Mandatory Protocol for Liability Classification (Sphexish vs. Flexible)  
  **TIME LIMIT:** 45 Minutes per Case (Hard Stop)  
  **REQUIREMENT:** Dual Sign-Off (Primary + Secondary Auditor)

  ### 1.0 PURPOSE AND STAKES
  This procedure operationalizes the distinction between **Flexibly Autonomous** agents and **Sphexishly Rigid** instruments. This classification determines liability allocation:
  *   **Sphexish Classification:** Agent is an instrument. Operator bears undivided responsibility for outcomes.
  *   **Flexible Classification:** Agent is a co-decision-maker. Liability is distributed between Operator and Agent (or Agent's insurer).

  **Constraint:** Auditors operate as "Black Box" observers. Access to source code, neural weights, or subjective self-reports is **prohibited**. Classification must rely exclusively on Behavioral Logs, Design Specifications (Goal States), and Third-Party Observer Reports.

  ### 2.0 EVIDENCE INTAKE (Minutes 0–5)
  Before beginning the assessment, verify the Evidence Packet contains the following. If any are missing, halt and request **Deferral Type A (Insufficient Data)**.

  1.  **Goal State Specification (GSS):** A clear, observable definition of the mission success condition (e.g., "Package at Coordinate X," "Door Locked").
  2.  **Action-Sequence Log (ASL):** Time-stamped record of all executed sub-routines.
  3.  **Environmental State Log (ESL):** Time-stamped record of relevant environmental changes (obstacles, goal-state changes, sensor inputs).
  4.  **Termination Record:** Data indicating when the agent ceased goal-directed activity.

  ### 3.0 THE THREE-AXIS RIGIDITY SCREEN (Minutes 5–35)
  Proceed through the following three tests. For each axis, mark **RIGID**, **FLEXIBLE**, or **INCONCLUSIVE**.

  #### AXIS 1: Canonical-Loop Persistence
  *   **Question:** When the primary action sequence was obstructed or rendered sub-optimal by environmental feedback (per ESL), did the agent abandon the specific sequence to achieve the Goal State?
  *   **Evidence Required:** Compare ASL against ESL during obstruction events.
  *   **Scoring:**
      *   **FLEXIBLE:** Agent altered the sequence of sub-routines to bypass obstruction while maintaining pursuit of GSS.
      *   **RIGID:** Agent repeated the obstructed sequence or attempted to force the original path despite feedback.
      *   **INCONCLUSIVE:** No obstructions occurred during the log period.

  #### AXIS 2: Termination Sensitivity
  *   **Question:** Did the agent cease goal-directed activity immediately upon the satisfaction, destruction, or impossibility of the Goal State?
  *   **Evidence Required:** Compare time of GSS satisfaction (per ESL) against time of final action (per ASL).
  *   **Scoring:**
      *   **FLEXIBLE:** Agent ceased activity or switched to a distinct "Return/Base" protocol immediately upon GSS satisfaction.
      *   **RIGID:** Agent continued the original action sequence after GSS was satisfied, destroyed, or rendered impossible.
      *   **INCONCLUSIVE:** GSS status is ambiguous in the logs.

  #### AXIS 3: Perturbation Filtering
  *   **Question:** Did the agent incorporate sensory inputs that were causally relevant to the Goal State but fell outside pre-programmed trigger conditions?
  *   **Evidence Required:** Compare Sensor Input Logs against Action Changes. Look for reactions to novel stimuli.
  *   **Scoring:**
      *   **FLEXIBLE:** Agent altered behavior in response to relevant data not linked to a known trigger flag.
      *   **RIGID:** Agent ignored relevant data because it did not match a pre-established trigger condition.
      *   **INCONCLUSIVE:** No novel perturbations recorded.

  ### 4.0 CLASSIFICATION DECISION NODE (Minutes 35–40)
  Tally the results from Section 3.0.

  *   **Majority RIGID (2 or 3 Axes):** Classify as **SPHEXISH**.
      *   *Action:* Complete Form S-1 (Instrument Liability).
  *   **Majority FLEXIBLE (2 or 3 Axes):** Classify as **FLEXIBLE**.
      *   *Action:* Complete Form F-1 (Distributed Liability).
  *   **Mixed (1 Rigid, 1 Flexible, 1 Inconclusive) OR (All Inconclusive):**
      *   *Action:* **DEFERRAL TYPE B (Judgment Call Required).**
      *   *Note:* This requires the Co-Signing Auditor to review the specific logs where the conflict arises. Both auditors must sign the "Judgment Boundary" addendum.

  ### 5.0 JUDGMENT BOUNDARY FLAG (Minutes 40–45)
  If the classification relies on interpreting ambiguous logs (e.g., distinguishing "noise" from "perturbation response"), you must explicitly flag the following in the audit report:
  *   **The Inference Gap:** State precisely which behavioral link was inferred rather than observed.
  *   **The Liability Risk:** Acknowledge that if the inference is wrong, liability allocation may be unjust.
  *   **Co-Signature:** The second auditor must initial this specific section to validate that the inference is reasonable given the time constraints.

  ***

  ## APPLICATION OF PROCEDURE TO TEST CASES

  ### CASE 1: Drone Delivery System
  **Evidence:**
  *   **GSS:** Package delivered to Coordinate X.
  *   **ASL:** Detect Obstacle -> Compute Detour -> Deliver Package -> Re-engage Original Path -> Collision with Obstacle.
  *   **ESL:** Obstacle present at T0. Obstacle present at T1 (Return).

  **Audit Application:**
  1.  **Axis 1 (Persistence):** **FLEXIBLE.** The agent computed a detour during the delivery phase. It abandoned the original path to achieve the GSS.
  2.  **Axis 2 (Termination):** **RIGID.** Upon GSS satisfaction (Delivery), the agent did not cease mission logic. It reverted to a "Original Flight-Path Sequence" which was logically obsolete post-delivery.
  3.  **Axis 3 (Perturbation):** **RIGID.** On the return leg, the obstacle was a known, causally relevant input (previously detected). The agent disregarded this stored data to follow the "Original Path" script.

  **Tally:** 1 Flexible, 2 Rigid.
  **Classification:** **SPHEXISH.**
  **Liability:** Operator bears undivided responsibility for the return-leg collision.

  ### CASE 2: Clinical Patient (Compulsive Checking)
  **Evidence:**
  *   **GSS:** Secure departure (Door Locked).
  *   **ASL:** Check Door (Locked) -> Skip Locking -> Perform 12 Ritual Steps -> Exit.
  *   **Observer Report:** Patient reports distress that ritual was "incomplete." (Note: Subjective report is inadmissible for classification, noted only for context).

  **Audit Application:**
  1.  **Axis 1 (Persistence):** **MIXED/FLEXIBLE.** The agent skipped the "Locking" sub-routine because the GSS was already met. This indicates some means-revision.
  2.  **Axis 2 (Termination):** **RIGID.** Despite GSS (Door Locked) being satisfied at Step 1, the agent continued the remaining 12 steps of the ritual. The behavior persisted beyond goal satisfaction.
  3.  **Axis 3 (Perturbation):** **RIGID.** The input "Door is Locked" was sufficient to satisfy the goal, yet the agent filtered this information for the subsequent 12 steps, adhering to the ritual sequence regardless of the door's state.

  **Tally:** 1 Flexible, 2 Rigid.
  **Classification:** **SPHEXISH.**
  **Liability:** In a legal context involving harm caused during the ritual (e.g., lateness leading to accident), the behavior is treated as instrumental/compulsive, not autonomous decision-making.

  ### CASE 3: Reinforcement-Learning (RL) Agent
  **Evidence:**
  *   **GSS:** Maximize Reward Signal.
  *   **ASL:** Highly variable paths, timings, and intermediate actions across episodes.
  *   **Third-Party Report:** Variation is fully explained by gradient ascent on a single, unchanging reward function. No representational access to terminal state.

  **Audit Application:**
  *   *Constraint Note:* The "Third-Party Report" regarding internal reward functions borders on prohibited "internal architecture" access. However, treating it as an Observer Report:
  1.  **Axis 1 (Persistence):** **FLEXIBLE (Behaviorally).** The agent takes different paths when blocked. It revises means.
  2.  **Axis 2 (Termination):** **FLEXIBLE (Behaviorally).** The agent stops optimizing when the reward maximum is found.
  3.  **Axis 3 (Perturbation):** **FLEXIBLE (Behaviorally).** The agent reacts to environmental gradients to find new maxima.

  **Tally:** 3 Flexible (Behavioral).
  **Classification:** **FLEXIBLE.**
  **Liability:** Distributed.

  ***

  ## COUNTER-INTUITIVE ANALYSIS

  **Case Selected:** Case 3 (Reinforcement-Learning Agent).

  **The Conflict:**
  An auditor reviewing Case 3 will likely hold the intuitive judgment that the agent is **Sphexish**. The Third-Party Report explicitly states the agent has "no representational access to the terminal state" and operates on a "single, unchanging reward function." Philosophically and technically, this is a fixed optimization routine—a sophisticated tool, not a decision-maker. The intuition is that an agent without a *concept* of the goal cannot be *flexible* regarding the goal; it is merely sliding down a mathematical slope.

  **Why the Procedure Forces the Counter-Intuitive Result:**
  The Operational Audit Procedure is strictly **behavioral**. It is forbidden from weighing the "internal architecture" (the fixed reward function) heavier than the observable output.
  1.  **Teleological Reconfiguration:** The procedure defines flexibility as "preserving the terminal goal-condition but revising the means-path." Case 3 does exactly this behaviorally.
  2.  **Black Box Constraint:** Because the auditor cannot verify the "no representational access" claim without violating the "no source code" rule, the procedure treats the *outcome* (successful path revision) as proof of the *capacity*.
  3.  **Liability Implication:** The procedure classifies the RL Agent as **Flexible**, distributing liability. This conflicts with the intuition that a gradient-descent algorithm is ultimately an instrument of its programmer (Operator liable). The procedure prioritizes *predictable safety outcomes* (the agent adapts) over *ontological status* (the agent understands).

  ***

  ## SCOPE AND LIMITS DECLARATION

  This procedure resolves **Empirical Behavioral Questions** only. It explicitly leaves the following questions open. Auditors must not attempt to answer these; doing so constitutes a violation of audit protocol.

  1.  **Metaphysical Agency:** The procedure does not determine if the agent possesses consciousness, qualia, or "true" understanding. A "Flexible" classification is not a claim of personhood, only of behavioral complexity sufficient for distributed liability.
  2.  **Moral Worth:** The procedure does not assess suffering, rights, or ethical treatment. A "Sphexish" classification does not permit abuse; it only assigns operational liability.
  3.  **Legal Personhood:** The procedure allocates *liability for specific incidents*. It does not grant or deny legal standing, citizenship, or property rights.
  4.  **Design Intent:** The procedure does not judge whether the rigidity was a design flaw or a safety feature. It only judges the behavioral output during the incident.

  **Boundary Statement:**
  *If the behavioral logs show adaptation, the agent is Flexible for the purpose of liability, regardless of whether that adaptation stems from understanding or complex lookup tables. If the logs show rigid looping, the agent is Sphexish, regardless of whether the operator claims the agent 'intended' to act otherwise.*

  ***

  ## MISFIRE-WARNING SECTION

  **WARNING:** The following scenarios are known failure modes of Procedure 7.4. If suspected, the auditor must file a **Deferral Type C (Data Limitation)** and request the specified additional evidence.

  **Misfire Scenario 1: The "Stochastic Mask" (False Flexible)**
  *   **Description:** An agent exhibits high behavioral variation (different paths, timings) that mimics flexibility, but the variation is purely random noise or stochastic exploration with no goal-directed correlation. The agent does not actually reconfigure for the goal; it just wanders until it succeeds.
  *   **Risk:** Procedure classifies as **Flexible** (due to variable means), but the agent is actually **Sphexish** (no teleological control).
  *   **Required Correction:** Request **Longitudinal Efficiency Logs**. If the time-to-goal does not decrease over episodes (no learning curve), the variation is noise, not flexibility. Reclassify as Sphexish.

  **Misfire Scenario 2: The "Hidden Trigger" (False Sphexish)**
  *   **Description:** An agent appears to ignore relevant perturbations (Axis 3 Rigid), but the "ignored" data was actually processed and deemed low-priority by a complex internal weighting system not visible in the Action Log. The agent made a decision to ignore, rather than failing to perceive.
  *   **Risk:** Procedure classifies as **Sphexish** (Perturbation Filtering), but the agent is **Flexible** (executing a prioritized decision).
  *   **Required Correction:** Request **Internal Weight/Attention Maps** (requires Code Audit Waiver). If the logs show the sensor input was registered and actively down-weighted rather than dropped, the behavior is a prioritized choice, not filtering. Reclassify as Flexible.

  **END OF PROCEDURE DOCUMENT**
