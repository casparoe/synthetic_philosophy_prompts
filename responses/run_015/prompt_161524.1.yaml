  **To:** Vendor Risk Review Board
  **From:** Engineering
  **Subject:** Recommendation on Payment Pipeline Procurement

  **Recommendation**
  Renew with Corvus for a 12-month term. Do not pursue Bittern, Egret, or a split-traffic model at this time.

  **Cost and Operational Analysis**
  Corvus costs $41k/month flat. The proposed 50/50 split between Bittern and Egret reduces monthly spend to $40k but requires a $60k one-time integration. At a savings rate of $1k/month, the integration pays for itself in 60 months. Given the operational overhead of managing two vendors instead of one, the split model is net-negative for any horizon under five years.

  Bittern presents a specific contractual risk independent of traffic volume. Their agreement allows them to adjust the surcharge rate within a band 30 days after signing, once they have observed our traffic patterns. This creates an information asymmetry: they price based on actual data, we price based on estimates. Egret avoids this with a fixed rate, but retains the traffic volume uncertainty.

  **Addressing the Board's Hesitation**
  In preliminary polling, a majority ranked both Bittern and Egret below Corvus. This indicates a preference for certainty over potential savings. Rejecting Bittern (which loses money if legacy traffic is high) and Egret (which loses money if legacy traffic is low) suggests the board is not trying to predict traffic patterns, but rather penalizing the lack of visibility itself.

  This is a valid stance if the cost of being wrong is catastrophic. However, we are financially risk-neutral at these volumes. The real cost here is operational complexity. The split model removes the traffic uncertainty but introduces vendor management complexity. Since the financial benefit of removing that uncertainty ($1k/month) does not cover the cost of the solution (integration + dual vendors), the rational choice is to pay the premium for Corvus. We are effectively paying $1k/month for the privilege of not managing the uncertainty.

  **Counter-Argument**
  The strongest case against this recommendation is that it accepts a permanent price premium without solving the underlying visibility problem. If traffic patterns shift dramatically, Corvus may become significantly more expensive than the market rate, and we will be locked in. Additionally, Bittern's rate-adjustment clause is a negotiation point, not necessarily a dealbreaker. Removing that clause would make Bittern the clear low-cost leader on most traffic estimates. By choosing Corvus, we may be solving a contract drafting problem with a procurement decision, paying more annually than necessary to avoid a negotiation fight.

  Furthermore, splitting vendors hedges against upstream dependency failure. If Corvus has an outage, we have no fallback. Dual vendors increase resilience, which has value beyond monthly spend. However, if the two vendors share an upstream dependency or both turn out mediocre, we've doubled our exposure instead of halving it. Without a guaranteed uptime SLA that justifies the redundancy, the resilience argument remains theoretical.

  **Conditions to Flip Recommendation**
  1.  **Bittern Contract Revision:** If Bittern removes the clause allowing post-signature rate adjustments, I would recommend switching to Bittern alone.
  2.  **Integration Cost Reduction:** If Engineering can guarantee the split integration for under $12k (payback < 1 year), I would recommend the 50/50 split.
  3.  **Resilience Requirement:** If Ops mandates a multi-vendor strategy for uptime redundancy regardless of cost, I would recommend the split model.
