answer: |-
  ### The Scenario

  In the Philosophy Department at State U, the tenured faculty maintain an unwritten but strict norm of 'reciprocal coverage': if you miss a committee meeting, you must cover a colleague's office hours the following week, a burden everyone shares and everyone is liable to be called out for dodging. Dr. Aris misses a meeting and refuses to cover hours. Dr. Bell, a tenured colleague who openly admits to skipping their own coverage last month and plans to do so again, rebukes Aris in the staff room using the exact same words as Dr. Cole, a visiting scholar who teaches no classes here, has never been asked to cover hours, and has no office hours to offer. Cole has never violated the norm simply because the norm does not apply to visitors, bears no ill will, and knows the facts perfectly; Bell is unrepentant, currently non-compliant, and holds no administrative authority over Aris. When Aris responds, the intuitive friction is distinct: to Bell, Aris might say 'You did it too,' but cannot say 'You can't tell me what to do'; to Cole, Aris says 'This isn't your business,' and it sticks.

  ### The Verdicts

  **1. The Forfeiture (Tu Quoque) Account**
  *   **Verdict:** Bell lacks standing; Cole has standing.
  *   **Reasoning:** This account holds that standing is a function of the blamer's own compliance with the norm they invoke. By violating the norm they are enforcing, Bell forfeits the moral authority to blame; their hands are dirty, so their voice is silenced. Cole, having never violated the norm (and indeed being incapable of doing so), retains clean hands. The account cannot distinguish between Bell and Cole regarding membership; it only sees compliance. Therefore, it must grant standing to the clean outsider and deny it to the dirty insider.

  **2. The Equal Standing (Moral Address) Account**
  *   **Verdict:** Bell has standing; Cole has standing.
  *   **Reasoning:** This account holds that standing is a binary property of moral agency, not a gradient earned by good behavior or lost by bad. As long as Bell and Cole are moral agents addressing another moral agent about a genuine wrong, they have standing. Hypocrisy may make Bell's blame annoying or ironic, but it does not demote their status as a moral addresser. Similarly, Cole's lack of participation in the specific practice is irrelevant because the duty to pull one's weight is treated as a general moral expectation. Neither is silenced.

  **3. The Relational (Practice-Based) Account**
  *   **Verdict:** Bell has standing; Cole lacks standing.
  *   **Reasoning:** This account holds that standing is constituted by reciprocal liability within a shared cooperative scheme. Bell has standing because Bell is *exposed* to Aris's blame in the same coin; Aris can legitimately turn around and blame Bell for the same violation, creating a relation of mutual accountability. Cole lacks standing because Cole is not subject to the norm; Aris cannot blame Cole for skipping office hours coverage because Cole is not in the practice. Without the possibility of being blamed back, Cole lacks the relational position to blame.

  ### The Single Feature Doing the Work

  **Reciprocal Liability within a Constitutive Practice.**
  The case turns on the fact that the norm is not a universal moral duty (like "do not lie") but a constitutive rule of a specific cooperative scheme (the departmental workload pact). Standing is generated not by moral purity or generic agency, but by being *vulnerable* to the same sanction one is imposing. Bell is vulnerable; Cole is not.

  ### The Collapse Test

  1.  **Clean the Hypocrite's Hands:** If Bell had not skipped coverage, the Forfeiture Account flips to "Yes" for Bell. The Relational Account stays "Yes" (membership hasn't changed). The spread between Account 1 and Account 3 disappears on the Bell dimension, isolating the disagreement to the Cole dimension.
  2.  **Swap for a Generic Moral Norm:** If the norm were "Do not steal from the department fund," the Relational Account collapses into the Equal Standing Account. Cole now has standing because everyone is a member of the moral practice of honesty, regardless of departmental tenure. The three-way spread reduces to a two-way spread (or vanishes if Forfeiture also grants Cole standing).
  3.  **Make the Outsider a Full Co-Member:** If Cole were tenured and subject to the coverage norm, the Relational Account flips to "Yes" for Cole. Cole is now liable to be blamed by Aris for future skips. The distinction between Bell and Cole vanishes for the Relational Account, leaving only the Forfeiture Account to distinguish them based on past behavior.

  ### The Honest Part

  A defender of the **Forfeiture Account** (the biggest loser here, as it gets both verdicts "wrong" relative to the case design) would attack the case by claiming you have **begged the question by redefining standing.**

  They would argue: *"You haven't shown that hypocrites have standing; you've shown that club members have privileges. By making the norm a arbitrary departmental pact rather than a moral duty, you've turned 'standing to blame' into 'standing to enforce rules.' If skipping office hours coverage is a genuine moral failure (free-riding on colleagues), then Cole, as a moral agent, has standing to object to the injustice, regardless of whether they are on the rota. You engineered the intuition by making the norm seem petty and internal, but if we treat it as the moral wrong it actually is, Cole's clean hands grant them standing, and Bell's dirty hands remove it. You haven't disproven Forfeiture; you've just changed the subject from morality to etiquette."*

  **Is this fair?** It is a strong objection, but it misses the point of the tutorial. The objection assumes that all blame is moral blame in the universal sense. The case is designed precisely to show that a significant chunk of our blaming practices are *political* or *associational* rather than purely moral. If the student accepts that some norms are practice-internal (like the rules of a game or a specific cooperative venture), the Forfeiture defender's claim that "morality is always universal" looks like an overreach. However, if the student believes all free-riding is a universal moral wrong, the case does collapse, confirming your hunch: the Relational Account only wins if the norm is internal to a practice.
