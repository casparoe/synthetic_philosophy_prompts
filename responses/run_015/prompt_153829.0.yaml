answer: |-
  ### 1. Setup and Four Cells

  **Setup**
  Richland's financial regulator previously required digital certificates for wire transfers to Poorland, but the rule is now repealed. A Poorland co-op needs these transfers to buy inputs, and the sufficiency line is $5,000 annual income. The loss is fixed at $2,000 per household. The question is whether Richland funds a direct transfer to cover the loss.

  **Cell 1 (Rule, Below)**
  The rule blocked the transfer before repeal. Income fell from $6,000 to $4,000. The co-op lacks the input. Richland considers a direct payment.

  **Cell 2 (Rule, Above)**
  The rule blocked the transfer before repeal. Income fell from $10,000 to $8,000. The co-op lacks the input. Richland considers a direct payment.

  **Cell 3 (Nature, Below)**
  A cyclone destroyed the bank server. Income fell from $6,000 to $4,000. The co-op lacks the input. Richland considers a direct payment.

  **Cell 4 (Nature, Above)**
  A cyclone destroyed the bank server. Income fell from $10,000 to $8,000. The co-op lacks the input. Richland considers a direct payment.

  ***

  ### 2. Verdict Table

  | View | Cell 1 (Rule, Below) | Cell 2 (Rule, Above) | Cell 3 (Nature, Below) | Cell 4 (Nature, Above) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Threshold** | **Yes** | **No** | **Yes** | **No** |
  | *Reasoning* | Post-loss income is below $5,000. | Post-loss income is above $5,000. | Post-loss income is below $5,000. | Post-loss income is above $5,000. |
  | **No-Harm** | **Yes** | **Yes** | **No** | **No** |
  | *Reasoning* | Richland's rule caused the loss. | Richland's rule caused the loss. | Natural cause; Richland not implicated. | Natural cause; Richland not implicated. |
  | **Shared-Scheme** | **Yes** | **Yes** | **Yes** | **Yes** |
  | *Reasoning* | Co-op is a participant in the trade scheme. | Co-op is a participant in the trade scheme. | Co-op is a participant in the trade scheme. | Co-op is a participant in the trade scheme. |

  ***

  ### 3. Trial Result Statement

  In statistical terms, the **Threshold View** shows a significant main effect for Factor 2 (Status), with no effect for Factor 1 (Cause). The **No-Harm View** shows a significant main effect for Factor 1 (Cause), with no effect for Factor 2 (Status). The **Shared-Scheme View** shows no main effects for either factor; it functions as a constant intercept, generating a positive verdict solely based on the background condition (participation) held constant across all cells. There are no interactions within the views, but the views interact with each other: they cross in Cells 2 and 3, producing opposite verdicts on the same facts.

  ***

  ### 4. Sensitivity Analysis

  If you remove Factor 2 by setting everyone above the line (Cells 2 and 4 only), the **Threshold View** collapses: it returns "No" for both, offering no variance to explain. The design fails to test the view's positive duty because the trigger condition is never met. If you remove Factor 1 by making the cause identical (Cells 1 and 3 only), the **No-Harm View** collapses: it returns "Yes" for both (if Rule) or "No" for both (if Nature). The design fails to isolate the causal condition. In both cases, the design loses its power to distinguish the views because one factor is fixed at a level that neutralizes a specific view's trigger.

  ***

  ### 5. The Honest Part

  The **No-Harm View** comes out looking worst, specifically in Cell 3 (Nature, Below). Here, households are below sufficiency and suffering, yet the verdict is "No" simply because a cyclone rather than a rule caused the loss. To a field ecologist, this looks like refusing to treat a blight because the pathogen was native rather than introduced.

  The defender's strongest objection targets the counterfactual baseline. They will argue that my setup assumes a clean control plot: a world where the rule did not exist, and the co-op would have had the money. In complex systems, removing the rule might have collapsed the banking channel entirely, leaving the co-op with zero income. The objection is that "harm" cannot be measured against a hypothetical baseline where the institution is absent, only against a baseline where the institution is just. If the rule is part of a necessary system, the loss is a side effect, not a harm. This objection lands hard because, unlike fertilizer trials, we cannot run a control world without the global financial system to verify the baseline.

  ***

  ### 6. The Actual Question

  This design suggests the three views are not rivals about one duty, but are tracking different factors entirely. The Threshold View tracks welfare states (Factor 2). The No-Harm View tracks causal history (Factor 1). The Shared-Scheme View tracks relational status (held constant). They appear to disagree because they are measuring different dependent variables.

  In Cell 1 (Rule, Below), all three views give the same verdict (**Yes**). However, this agreement collapses into disagreement about the reason. The Threshold advocate cites the poverty level. The No-Harm advocate cites the rule. The Shared-Scheme advocate cites the partnership. They converge on the action but diverge on the mechanism, confirming that the apparent agreement is coincidental based on the stacking of factors in this specific cell.

  ***

  ### 7. Confounding Check

  You suspected correctly: I cannot vary Factor 2 (Above/Below) while keeping the loss fixed and the households identical without changing their baseline wealth. In Cells 1 and 3, I set baseline income at $6,000. In Cells 2 and 4, I set it at $10,000. This means Factor 2 is confounded with Initial Wealth. A critic could argue that the Threshold View is actually responding to the *change* in wealth or the capacity to absorb loss, not just the threshold crossing. I went with varying baseline wealth because it is the only way to keep the loss magnitude constant. To fix this, you would need to vary the sufficiency line instead of the income, but that introduces a new variable (the definition of need). The design holds, but the confounding means we cannot be certain Status alone is driving the Threshold View's verdict without further controls.
