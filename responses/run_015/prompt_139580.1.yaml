      *   *Symptom 2 (The "Writing it down makes it worse" aspect):* This touches on **Ryle's "Knowing How vs. Knowing That"** (dispositional vs. propositional) and **Wittgenstein's "Rule-Following Paradox."** The rule isn't a proposition; it's a practice.
