answer: |-
  You are not overthinking it. You have independently rediscovered one of the most famous and persistent problems in the philosophy of logic and language. It is a real structural feature of reasoning, not a bug in your brain.

  To answer your main question: **Yes, this has established names, but it is actually a cluster of two or three tightly wound problems.** The specific phenomenon you are describing in points (1) and (2) is best known as **Lewis Carroll's Paradox of Inference** (from his 1895 dialogue *What the Tortoise Said to Achilles*). The deeper philosophical implication in point (3) touches on **Wittgenstein's Rule-Following Paradox** and the distinction between **Knowing-That vs. Knowing-How**.

  Here is the breakdown of what is happening, why "infinite regress" isn't quite the right label, and where the boundaries lie.

  ### 1. The Core Phenomenon: The Premise/Rule Confusion

  You hit the nail on the head with point (2). The problem arises when you treat a **rule of inference** (a command on how to move) as if it were a **premise** (a static fact to be observed).

  In your math class example:
  *   **Premise 1:** $n^2$ is even.
  *   **Premise 2:** If $n^2$ is even, then $n$ is even.
  *   **Conclusion:** $n$ is even.

  Your friend is treating logic like a list of ingredients. He has the flour (P1) and the water (P2). He is asking, "Where is the ingredient that forces me to make bread?"

  When you write down the rule ("If you have P1 and P2, you must accept C"), you have just added **Flour + Water + Recipe Card** to the table. You still haven't baked the bread. The recipe card is just another piece of paper (another premise). It doesn't have hands to mix the dough.

  **Why "Infinite Regress" is an incomplete label:**
  The infinite regress (Carroll's Tortoise keeps asking for more premises: $P1, P2, \text{Rule}, \text{Rule}^2, \text{Rule}^3 \dots$) is the *symptom*, not the *disease*. The disease is a **category mistake**. You are trying to capture a *dynamic action* (inferring) inside a *static object* (a proposition).

  *   **Propositions** are true or false.
  *   **Inferences** are valid or invalid.

  You cannot prove an inference using only propositions. At some point, you have to stop stating facts and start *doing* something.

  ### 2. Addressing Your Three Specific Points

  #### (1) The Gap Between Acceptance and Movement
  **Name:** The Normativity of Logic / The Problem of Compulsion.

  You asked for a way to talk about the gap between "having the pieces" and "going somewhere." The philosophical term here is **logical compulsion**.

  In formal logic, we often pretend that the conclusion is "contained" in the premises. But psychologically and epistemically, it isn't. You can stare at $A$ and $A \to B$ all day and not believe $B$ (your friend is proof of this).

  The "gap" is the difference between **static consequence** and **dynamic inference**.
  *   **Static:** "B is true if A is true." (This is a relationship between facts).
  *   **Dynamic:** "Because I see A, I will now write down B." (This is an action by an agent).

  Logic describes the static relationship. It cannot force the dynamic action. Your friend is refusing to be the agent of inference. He wants the logic to push him, but logic is inert. Only a mind can push.

  #### (2) Why Stating the Rule Breaks It
  **Name:** Ryle's Regress / The Intellectualist Legend.

  Gilbert Ryle (a 20th-century philosopher) argued exactly this point. He said that if you think reasoning requires you to internally recite a rule before every step, you create an infinite regress of internal operations.

  *   **Why stating it breaks it:** When you write the rule down, you turn a **tool** into an **object**.
      *   *Implicit:* You use Modus Ponens like you use your eyes to see. You don't look at your eyes to see; you look *with* them.
      *   *Explicit:* When you write the rule, you are trying to look *at* your eyes. Now you need another pair of eyes to see the first pair.

  *   **Why not stating it works:** Because reasoning is a **skill** (Knowing-How), not just a database of facts (Knowing-That). You are trained (by math class, by language, by evolution) to react to the pattern "$A, A \to B$" by producing "$B$". That reaction is a habit or a disposition, not a conclusion derived from another premise.

  #### (3) The Two Moves: Circularity vs. Meaning
  **Name:** Vicious Circularity vs. Constitutive Rules.

  You sensed a difference between "using the rule to prove the rule" and "saying that's just what the words mean." You are right to distinguish them.

  *   **Move A (Circularity):** "Modus Ponens is valid because Modus Ponens says so." This is vicious. It offers no external anchor.
  *   **Move B (Meaning/Convention):** "Modus Ponens is valid because that is part of what we mean by 'if'."

  Move B feels like a dodge because it is **deflationary**. It admits there is no "super-logic" above logic that validates logic. It says: "We don't discover logic in the universe; we build our language *using* logic."

  If you change the rule, you aren't doing "bad logic"; you are speaking a different language (or playing a different game). In chess, you can't ask "Why does the Bishop move diagonally?" and expect a physical answer. It moves diagonally because that is what constitutes "being a Bishop." Similarly, "If $P$ then $Q$" moves to $Q$ because that is what constitutes "implication."

  ### 3. Boundaries: Does this happen with the phone charger?

  You asked if this gap only exists in strict deduction or if it shows up in messy reasoning (e.g., "Who took my charger?").

  **It shows up, but the nature of the gap changes.**

  *   **In Deduction (Math):** The gap is **mechanical**. The conclusion is guaranteed *if* you make the move. The problem is purely about why you make the move. The "force" of logic is absolute, but inert.
  *   **In Abduction/Induction (The Charger):** The gap is **probabilistic and pragmatic**.
      *   *Premise:* Sam was here last. Sam often borrows things.
      *   *Conclusion:* Sam took it.
      *   *The Gap:* Here, the rule isn't "If P then necessarily Q." The rule is "If P, then Q is *likely*."

  In the charger case, you can't even write down a rule that guarantees the conclusion. So the "Carroll Paradox" doesn't apply in the same strict way, because there was never a promise of necessity. However, the **Justification Gap** remains: Why do you accept the heuristic "people who were present are suspects"? If you demand a justification for *that* rule, you again hit a wall where you either circle back to experience or say "that's just how I navigate the world."

  **The Edge Case:**
  The phenomenon you found is strongest in **a priori deductive reasoning**. In messy reasoning, we usually stop the regress by appealing to **utility** ("Believing Sam took it helps me find the charger") rather than **truth** ("Believing Sam took it is logically mandated").

  ### 4. Definition and Summary

  Since part of this genuinely lacks a single unified name, here is a definition you can use to label the phenomenon for yourself and your friend.

  **The Problem of Inference (or The Agent-Logic Gap)**
  *   **Definition:** The structural inability to fully justify a logical inference using only propositional premises, because inference is an *action* performed by an agent, while premises are *objects* observed by an agent.
  *   **The Boundary:** It applies wherever a rule is required to process data into a conclusion. It is most acute in formal logic (where the rule is strict) and less acute in pragmatic reasoning (where the rule is flexible).
  *   **The Distinction from Regress:** Infinite Regress is what happens when you try to solve this problem by adding more premises. The Problem of Inference is the realization that premises *cannot* solve it.
  *   **The Resolution:** The regress stops not when you find a "self-justifying premise," but when you acknowledge that **reasoning is a practice**. You stop justifying when you switch from *describing* the game to *playing* the game.

  **How to explain it to your friend:**
  Tell him: "You're waiting for the premises to push you to the conclusion. But premises are just ink on paper. They can't push. The push has to come from you. When I write down the rule, I'm just giving you more ink. You're looking for a engine, but logic is just the map. You have to be the engine."

  You aren't confused; you've just noticed that the foundation of logic isn't a rock, it's a habit.
