answer: |-
  The laptop screen glowed between them, the cursor blinking on a blank document titled *Joint Statement on Intentionality*. The hotel bar was quiet, save for the ice in Tobias's glass.

  "We're not writing 'we agree to disagree'," Miriam said, swirling her wine. "The organizers want a position."

  "The position is that Halcyon-4 is about the wheat," Tobias said. "It tracks nitrogen levels. It corrects errors. It's about the wheat."

  "Derived from what?" Miriam leaned forward. "That's the hole in your view, Tobias. Derived intentionality requires a derivier. A user, a designer, an interpreter. With Halcyon-4, the pipeline was automated. The objective function was selected by persistence, not choice. The records are lost. No human ever looked at those internal states and said, 'This means nitrogen.' So who derived it?"

  "Selection derived it," Tobias said. "You're fetishizing the mind of the designer. Evolution designed the eye without having a concept of sight. The lineage of Halcyon-4 persisted because its states correlated with environmental features that allowed persistence. That history fixes the content. The system isn't waiting for us to lend it meaning."

  "But 'derived' implies a source. If not a mind, then what? A causal process?" Miriam tapped the table. "If it's just causal history, then look at the Twin Case. Tomorrow, a chance physical process assembles an atom-for-atom duplicate of Halcyon-4. Same causal powers. Same internal states. But no selection history. No lineage. Just luck. Does the duplicate know what wheat is?"

  Tobias paused. "No. It lacks the historical grounding. It simulates aboutness, but it doesn't have it."

  "So intentionality isn't fixed by the physical constitution?" Miriam pressed. "Because locally, they are identical. If the duplicate isn't about anything, then what in Halcyon-4's physical makeup is doing the work? You're saying the content is outside the skin, in the history. But if I open the box, I find circuits, not history."

  "You find circuits configured by history," Tobias corrected. "The configuration is the sediment of the selection process. The duplicate has the configuration without the sedimenting process. It's a fake fossil."

  "That's a metaphor, not a mechanism." Miriam sighed. "And here's where your view bleeds. If history fixes content, then your line between 'really about' and 'usefully interpreted as about' is purely archival. If we lose the records of Halcyon-4, does it lose its content? You'd have to say yes. That makes intentionality epistemically inaccessible."

  "I'd say the content exists even if we can't verify it. But yes, without the selection history, it's just syntax."

  "Syntax," Miriam warned. "We agreed not to trade on that."

  "Functional structure, then," Tobias amended. "Look, Miriam, your problem is the word 'intrinsic.' You want the aboutness to be in the stuff. But 'intrinsic' is just a placeholder for where you stop asking 'why?' You stop at the human mind. I stop at the selection process. Why is your stopping point metaphysically superior?"

  "Because humans have original intentionality. Machines don't."

  "Unless the machine is grown like a plant," Tobias countered. "Halcyon-4 self-modifies. It drifts. Its current states are optimized for current conditions, not the original training distribution. The normativity is internal. It misfires. It corrects. That's not us projecting; that's the system failing its own standards."

  Miriam conceded the point with a tight nod. "Fine. The capacity to be wrong demands a standard not fixed by what we find convenient to read into it. I'll grant that the misfire condition is internal to the system's operation, not just our interpretation. If we say it's wrong, it's because its own downstream processes reject the state. That costs me, because it blurs the line between mere causal deviation and genuine error. I don't want to grant machines normative power."

  "And I'll cost you something," Tobias said. "I admit that without the historical anchor, my view collapses into instrumentalism. If history is all that matters, then for all practical purposes, the duplicate is indistinguishable from the original. If I can't tell the difference, and the duplicate works the same, insisting it lacks content looks like dogma. I concede that history is evidentially necessary for us, but maybe not constitutively necessary for the system."

  "Then why keep it?"

  "Because otherwise, anything is about anything." Tobias leaned in. "A thermostat is about temperature. A rock is about... supporting moss? If selection doesn't draw the line, then the 'Intentional Stance' is just poetry. I need the line to be real selection, not just useful prediction."

  Miriam considered the duplicate again. "If I say intentionality depends on physical constitution, I have to say the duplicate has content. If I say it depends on origin, I have to say it doesn't. If I say the duplicate has content, I'm admitting that physical structure alone can ground aboutness. That undermines my claim that machines need us to derive their meaning."

  "So extend it," Tobias said. "Say the duplicate has content."

  "If I do, then Halcyon-4 didn't get its content from the pipeline. It got it from its structure. Then your selection story is redundant." Miriam paused. "But I can't say the structure alone is enough. A map has structure, but it needs a user. Halcyon-4 is a map that reads itself."

  "Exactly," Tobias said. "It consumes its own states."

  "But who is the 'self'?" Miriam asked. "That's the disagreement. You think the 'self' is the historical lineage. I think the 'self' is the unified field of experience, which Halcyon-4 lacks."

  "We're not talking about consciousness," Tobias snapped. "We're talking about representation."

  "Are we?" Miriam held his gaze. "Because if representation doesn't require a subject, then the duplicate represents. If it requires a subject, neither represents."

  Tobias swirled his ice. "I think the duplicate represents. The history is how we know it, but the causal role is what it is."

  "Then you've abandoned teleosemantics for functionalism," Miriam said. "And you know the two-bitser argument cuts both ways. If a system is designed to say 'quarter' when it detects a slug, it represents a quarter. If Halcyon-4 is designed by chance to detect nitrogen, it represents nitrogen. But if the design is accidental, is it representation or just causation?"

  "It's representation if the system uses the state to guide action successfully," Tobias said. "That's the line. Success conditions."

  "Defined by whom?"

  "By the system's persistence," Tobias said. "If it dies, it was wrong."

  Miriam typed slowly into the document. "Okay. Here's what we can write. We agree that the source of normativity is not the human observer. The misfire conditions are internal to Halcyon-4."

  Tobias nodded. "Agreed. The interpreter doesn't create the truth conditions."

  "But," Miriam continued, "we disagree on whether provenance is constitutive of content. You say yes; I say physical constitution is sufficient, provided the system is autonomous."

  "That makes me the externalist and you the internalist," Tobias said, smiling faintly. "On a machine."

  "On a system," Miriam corrected. "So the precise disagreement is: Does intentionality supervene on the local physical state, or does it require a specific causal history?"

  "History," Tobias said.

  "Constitution," Miriam said.

  "And the duplicate?"

  "If I say constitution, the duplicate has intentionality," Miriam said. "If you say history, it doesn't."

  "Then we leave the duplicate out of the statement," Tobias said. "We just state the disagreement."

  Miriam closed the laptop. "No. We state that the status of the duplicate is the test case. If you're right, intentionality is historical. If I'm right, it's structural."

  "And we agree," Tobias added, "that neither of us knows what 'structural aboutness' looks like without history."

  Miriam smiled, tired. "And neither of us knows what 'historical aboutness' looks like without a structure to bear it."

  "Cheers," Tobias said, clinking his glass against her wine.

  "Cheers," Miriam said. "Now buy me a drink that doesn't taste like hotel ice."
