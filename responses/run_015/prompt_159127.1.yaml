  A: S > M.
  B: S > M.
  So Social S > M.
  Cycle: M > N > S > M.
  Yes, the logic holds.

  *(Self-Correction on Q3)*: Does Coase dissolve the *problem*? The problem is the deadlock. Coase allows movement to the efficient outcome *given rights*. But who has the rights? That's the political question. So the difficulty reappears at the stage of assigning the initial entitlement. I need to make sure I say that.

  *(Self-Correction on Q4)*: The user asked if a tie-breaker is principled or a shrug. It is principled because of the Impossibility Theorem. I should emphasize that.

