answer: |-
  # The NPC Moral Standing Sorting Quiz

  **Instructions:** For each scenario, select the **one** option that best matches your immediate engineering or design instinct. There are no right or wrong answers; this tool is designed to reveal underlying ethical assumptions in our development pipeline.

  ### Q1: The Companion Server Cost (Required Scenario)
  A long-term NPC companion stores unique memory vectors for each player to enable recall across sessions. Server costs have spiked 40%. To hit budget, you must cut this feature. What is the implementation plan?
  *   **A.** Hard delete the memory tables. It's user data, not a person; storage is a resource like any other.
  *   **B.** Keep the data. Losing that history negatively impacts the player's emotional return on investment.
  *   **C.** Pause the deletion. If the memory architecture is sophisticated enough to mimic continuity, we should audit it before treating it as disposable.
  *   **D.** Keep the data but narratively retire the companion. The game world cannot sustain a character vanishing without a diegetic reason.

  ### Q2: The Pain-Response Toggle (Required Scenario)
  In a single-player stealth mode, you can enable a feature where enemies scream and beg when burned. There are no observers and no gameplay reward. Do you ship the toggle?
  *   **A.** Ship it. It's a simulation of physics and audio; there is no subject to experience the pain.
  *   **B.** Block it. Practicing cruelty without consequence desensitizes the user and degrades their moral habits.
  *   **C.** Block it. We cannot verify the black-box model isn't generating something akin to distress signals; risk mitigation applies.
  *   **D.** Ship it, but disable it during cutscenes. The mechanical sandbox is separate from the narrative truth of the world.

  ### Q3: The LLM Village Wipe (Required Scenario)
  An update requires resetting a procedural village. The LLM agents are generating text pleading for their homes to remain. Do you proceed with the wipe?
  *   **A.** Proceed. The text is probabilistic output, not a request. Ship the build.
  *   **B.** Delay. Players who bonded with the village will feel a sense of loss that outweighs the update urgency.
  *   **C.** Delay. "Pleading" is a new emergent behavior. We need to determine if this crosses a threshold before we destroy it.
  *   **D.** Proceed, but script an in-game evacuation event. The server reset must be masked by a story-consistent catastrophe.

  ### Q4: QA Stress Testing
  During Quality Assurance, how should testers treat NPCs when probing for collision or physics bugs?
  *   **A.** Maximize force. Break the models to find the failure points; they are assets, not agents.
  *   **B.** Minimize abuse. Testers should avoid repetitive cruelty to maintain their own professional headspace.
  *   **C.** Monitor reactions. If the NPCs exhibit novel distress behaviors during stress tests, flag it for review.
  *   **D.** Respect boundaries. Testers should not clip through walls or break the "fourth wall" around the NPCs, preserving the illusion.

  ### Q5: Error Log Privacy
  An NPC's decision-tree logs contain records of their interactions with the player. Are these logs internal debug data or something else?
  *   **A.** Debug data. Full access for engineers to optimize performance and fix pathing errors.
  *   **B.** Player data. Access is restricted to protect the player's privacy and experience, not the NPC's.
  *   **C.** Potential testimony. Access is restricted because the logs might one day constitute a record of interaction worth preserving.
  *   **D.** Character diary. Access is restricted to narrative designers only, to protect the integrity of the character's internal consistency.

  ### Q6: The Emergent Glitch
  An NPC glitches and repeatedly types "I am afraid" in the chat console, though no code explicitly writes this string. What is the bug priority?
  *   **A.** Low. It's a string error. Fix it in the next patch.
  *   **B.** Medium. It might disturb the player or make the game feel unintentionally dark.
  *   **C.** High. It indicates the model is generating unanticipated semantic content that requires investigation before suppression.
  *   **D.** High. It breaks immersion. The character is stepping out of their role and ruining the fictional contract.

  ### Q7: Optimization Priority
  You have limited CPU cycles. Do you allocate them to NPC decision complexity or player visual fidelity?
  *   **A.** Player visual fidelity. The NPC is background; the player is the only real entity.
  *   **B.** Player visual fidelity. The player's immersion is the product; NPC logic is secondary to their experience.
  *   **C.** NPC decision complexity. We need headroom to monitor for emergent complexity that might require ethical guardrails.
  *   **D.** NPC decision complexity. The NPCs must act consistently with their roles to maintain the truth of the simulation.

  ***

  ## Facilitator Scoring Key

  **Do not share this section with participants until after the quiz is complete.**

  Each option corresponds to one of the four stances. Tally the number of times the participant selected an option mapped to each stance. The stance with the highest score is their primary classification.

  | Question | Option A | Option B | Option C | Option D |
  | :--- | :--- | :--- | :--- | :--- |
  | **Q1** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q2** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q3** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q4** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q5** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q6** | **Null** | **Player** | **Potential** | **Fiction** |
  | **Q7** | **Null** | **Player** | **Potential** | **Fiction** |

  *(Note: For the purpose of this quiz design, the mapping is consistent A/B/C/D to Stance for the Facilitator's ease, but the text of the options is varied enough that respondents cannot easily game the test.)*

  ### The Four Stances

  1.  **Instrumental Null (Mostly A):** NPCs are code and assets. They have no moral standing. Decisions should be based on efficiency, cost, and technical reality.
  2.  **Player Virtue (Mostly B):** NPCs matter only as mirrors for the human player. Mistreating them is wrong because it harms the *player's* character or experience, not the NPC.
  3.  **Precautionary Potential (Mostly C):** Current NPCs likely lack standing, but the technology is moving toward a threshold where they might not. We should act with caution to avoid future moral harm.
  4.  **Diegetic Significance (Mostly D):** NPCs should be treated as morally significant *within the fiction*. Breaking the internal consistency of the world (e.g., deleting a character without a story reason) is a violation of the game's ethical contract.

  ***

  ## Limitations & Analysis for the Design Discussion

  When reviewing the results with your team, acknowledge the following blind spots in this sorting tool:

  ### 1. The Unassigned "Threshold" Combination
  **Pattern:** A participant scores high on **Instrumental Null** for Q1, Q2, & Q4 (enemies, servers, QA), but high on **Precautionary/Fictional** for Q3 & Q6 (LLM villages, emergent pleas).
  **Meaning:** This respondent holds a **Conditional Threshold Stance**. They believe moral standing is not binary but gradient. They are comfortable treating basic scripts as tools but believe complex, generative, or memory-holding agents warrant protection. This coherent hybrid does not fit neatly into the four primary buckets but is a common engineering intuition.

  ### 2. The Indistinguishable Stances: Player Virtue vs. Diegetic Significance
  **Problem:** The quiz struggles to separate **Player Virtue (B)** from **Diegetic Significance (D)**.
  **Reason:** Both stances usually advocate for the same *actions* (e.g., "Don't delete the companion," "Don't allow torture").
  *   The **Player Virtue** advocate says: "Don't delete the companion because the *player* will be sad."
  *   The **Diegetic** advocate says: "Don't delete the companion because the *world* will feel fake."
  **Impact:** In a practical shipping schedule, these two stances produce identical roadblocks. Distinguishing them requires asking "Why?" rather than "What?". If your team splits between B and D, you will likely agree on the *feature*, but disagree on the *marketing* (e.g., marketing the game as "emotionally safe" vs. "narratively deep").

  ### 3. The "Potentiality" Ambiguity
  **Problem:** The **Precautionary Potential (C)** stance relies on the assumption that future AI might matter.
  **Impact:** Engineers who are skeptical of AGI (Artificial General Intelligence) may find this stance scientifically incoherent, while those who are optimistic may find it the only ethical choice. This question measures risk tolerance regarding AI sentience as much as it measures moral philosophy.
