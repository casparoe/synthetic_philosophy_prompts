      *   **Theoretical Lens:** George Orwell's essay "Politics and the English Language" (specifically the idea of political jargon as anesthesia/numbing agent, and words floating free of concrete meaning).
      *   **Constraint/Goal:** Avoid the cliché "Newspeak vs. Gilead" comparison. Focus on *Offred's narration* as resistance to semantic drift. Look for moments where language makes horror *sharper/concrete* rather than numbing it. Explore if Atwood shows linguistic resistance Orwell missed. Identify specific scenes. Identify where the comparison breaks down.
      *   **Context:** Writing for a class on Language and Power. Needs depth, nuance, and specific textual evidence.

