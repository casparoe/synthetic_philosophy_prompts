  MEMORANDUM

  **TO:** All Heads of School
  **FROM:** Interim Committee on the Scientific Status of Historical Sciences
  **DATE:** 14 October 2023
  **SUBJECT:** Reclassification of the Department of Biology (Ref: ICSSHS/23/09)

  1. Pursuant to the University's Quality Assurance Framework, the Interim Committee has completed its review of the Department of Biology's epistemological outputs. The review assessed compliance with the falsificationist demarcation criterion required for designation as empirical science.

  2. The Committee accepts the assessment that Darwinian natural selection, in its general formulation, functions as a metaphysical research programme.^1 While heuristically fruitful, it lacks the specific testability required for scientific status *strictu sensu*.

  3. Accordingly, the Department of Biology is hereby reclassified as a Unit of Metaphysical Inquiry. Effective immediately, all staff must adjust their grant applications and module descriptors to reflect this change in ontological category.

  4. Regarding the tautology objection: The Committee notes that if "fitness" is defined solely by survival, the principle of "survival of the fittest" is analytically true and thus untestable. To qualify as scientific, fitness must be defined as expected reproductive success within an environment specified independently of the survival outcome.

  5. Submissions from the Department frequently reconstruct the ancestral environment based on the traits observed in surviving specimens. This methodology is circular. The environment cannot be inferred from the trait it is meant to explain. Until an environment is specified *a priori*, claims regarding adaptation remain metaphysical narratives.

  6. Consider the case of the Caithness dune-wasp (*Vespula caithnessia*). The Department proposes that the species' pale throat-patch is an adaptation for signalling in ancestral dune environments.

  7. The Committee requested evidence that would falsify this signalling hypothesis. The Department responded that the patch could alternatively function as camouflage against pale sand, or as thermoregulation. When asked which observation would rule out signalling, the Department submitted that the patch's existence confirms *some* adaptive function.

  8. As the hypothesis accommodates all possible observations regarding the patch's utility, it is unfalsifiable. Future papers on wasp morphology must explicitly state which potential observation would render the adaptationist claim false. If no such observation exists, the paper must be filed under Comparative Mythology.

  9. Administrative implications are as follows:

  10. **Grant Coding:** The Department is no longer eligible for STEM research codes. Projects involving natural selection should be applied for under Humanities Grant Code H-77 (Speculative Systems). Fieldwork budgets will be reviewed for compatibility with metaphysical inquiry.

  11. **Curriculum:** Modules on evolutionary biology must be retitled "History of Scientific Ideas." Natural selection may be taught as a influential conceptual framework, provided students are informed it lacks empirical demarcation. Laboratory practicals involving selection pressures are to be renamed "Demonstrations of Metaphorical Consistency."

  12. **Peer Review:** Reviewers are instructed to reject adaptationist papers that do not identify a falsifying condition. Papers claiming that a trait exists "because it was selected for" without independent environmental data will be returned to sender.

  13. **Theses:** PhD dissertations defending specific adaptationist hypotheses must be catalogued in the Library under Philosophy (19th Century). Existing degrees conferred will not be revoked, though their empirical weight is now considered advisory.

  14. The Committee wishes to clarify that this reclassification does not imply Darwinism is false. The Committee accepts that evolution likely occurred and that natural selection is a powerful explanatory tool. However, explanatory power is distinct from scientific status. The Committee fails to see how continuing to teach metaphysics as science benefits the University's risk profile, even if the content is identical.

  **Questions Members Have Asked**

  **Q: Can we still hire biologists?**
  A: Yes, provided their contracts specify they are employed as Metaphysicians. Salary scales remain unchanged, though tenure tracks now require a minor in Epistemology.

  **Q: Does this affect the Medical School?**
  A: Only where treatment relies on evolutionary explanations for pathogen resistance. Clinicians should describe antibiotic resistance as a "observed regularity" rather than a selected trait to maintain compliance.

  **Q: Is the Committee's own methodology scientific?**
  A: The Committee operates under administrative statute. Whether statute is falsifiable is a matter for the Legal Department, which is currently under review for tautological reasoning.

  ***

  ^1 *The Committee notes Popper's 1978 retraction of this view. However, as the retraction was informal and lacked the rigour of the original demarcation, the Committee considers the 1974 position binding.*
