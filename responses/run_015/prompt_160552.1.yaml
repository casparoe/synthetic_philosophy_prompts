          3.  **Residue Report:** What translated cleanly, what required distortion, what didn't translate. Specific focus on: objective truth vs. labels, equal weighting/universal inclusion (normative vs. accuracy), and No-Free-Lunch (context-dependent competence).
          4.  **Verdict:** Is this a real reconstruction or a failing metaphor? Where does it break?
      *   **Constraints:** No references. Use ML terms (weak learners, i.i.d., bagging/boosting, etc.). Honest about losses in translation.

