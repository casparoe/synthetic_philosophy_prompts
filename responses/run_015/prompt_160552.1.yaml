          *   Independence $\to$ Conditional Independence of errors (Approximate - rarely holds in ML).
          *   Majority Aggregator $\to$ Unweighted Majority Vote (Exact).
          *   Group Size $\to$ Ensemble Cardinality (Exact).
          *   Asymptotic Limit $\to$ Probability of Correctness $\to 1$ (Exact under assumptions).
