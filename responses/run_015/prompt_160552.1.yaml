  3.  **Part 2: The Hard Cases:**
      *   *Goal:* Address the 5 specific scenarios provided by the user using ML logic.
      *   *Case 1: Heterogeneous/Below-Chance Competence.*
          *   ML: Boosting handles weak learners, but if error > 0.5 consistently, you flip the label. If some are < 0.5 and unknown, they act as noise or adversarial examples. Weighted voting is better.
          *   CJT: Assumption is usually $p > 0.5$ for all. If $p < 0.5$, theorem inverts.
          *   Status: Idealization in CJT (assumes citizens are competent). ML treats this as a hyperparameter/weighting problem.
      *   *Case 2: Correlated Errors (Shared Information).*
          *   ML: This is the death of Bagging. If errors are correlated, variance reduction fails. Effective $N$ drops.
          *   CJT: Independence assumption is the most criticized.
          *   Status: CJT treats as idealization; ML treats as a critical failure mode (need diversity).
      *   *Case 3: No Ground Truth (No Held-Out Set).*
          *   ML: Unsupervised learning / Semi-supervised / Crowdsourcing (Dawid-Skene). You can't estimate accuracy without labels. Equal weighting is a prior, not a result.
          *   CJT: Epistemic democracy assumes truth exists but isn't immediately known. Equal weight is often normative (one person, one vote), not just epistemic.
          *   Status: Major divergence. ML needs loss calculation; CJT relies on the *existence* of truth, not measurement.
      *   *Case 4: Deliberation/Polling (Self-Training).*
          *   ML: Self-training / Pseudo-labeling. Risk of confirmation bias / error cascade. Model collapse.
          *   CJT: Deliberation is supposed to improve competence, but can lead to herding.
          *   Status: ML predicts degeneration (entropy collapse); CJT defenders argue for improvement (information aggregation). Tension here.
      *   *Case 5: Endogenous Competence (Policy affects Education).*
          *   ML: Distribution Shift / Feedback Loops / Performative Prediction. The model changes the data distribution $P(X, Y)$.
