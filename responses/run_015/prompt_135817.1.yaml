  hi, im writing an essay for my philosophy of science module and stuck on a bit about costly signalling and Zahavi's handicap principle. i want to analyse the swiss watch industry's reaction to the quartz crisis through that lens. like, when cheap accurate quartz watches flooded the market in the 70s, luxury mechanical brands didnt compete on precision or price; they doubled down on useless complications, heritage marketing, and craft narratives that made the watch more expensive and less practical. that looks like a classic handicap signal - the cost is the point, not the function.

  but i want to push further. does the principle actually explain why they picked that strategy, or is it just a neat post-hoc story? what do we do with the fact that quartz was itself initially a luxury product before becoming disposable? and does applying Zahavi to consumer markets assume an evolutionary stability that collapses once buyers realise the signal is mostly marketing?

  can you map out the actors (the swiss houses, quartz manufactures, buyers), what counts as the costly signal versus the cheap substitute, and then be honest about where the handicap model breaks or gets stretched? i know the basic chronology so dont need that recapped - just want to know whether this episode confirms the principle or reveals its limits when moved away from biology.
