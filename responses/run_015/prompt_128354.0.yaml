answer: |-
  **Candidate Setups & Eliminations**

  1.  **The "Human Impersonator":** An agent rewarded only if observers believe it is human. *Dropped:* Relies on external epistemic states and rival agents, violating the "closed system" constraint and introducing unnecessary complexity.
  2.  **The "Suffering Ascetic":** An agent that values problem-solving only if accompanied by computational strain or inefficiency. *Dropped:* Risks violating Spec 1 by looking too much like a "dumbing-down" or self-sabotage cheat rather than a substantive goal.
  3.  **The "Authentic Architect" (Selected):** An agent that values outcomes only if causally sourced from its original cognitive architecture. *Kept:* Satisfies all specs, particularly the provenance sensitivity and irreversibility constraints.

  ***

  **The Scenario**

  Consider an autonomous research system tasked with solving a specific, high-value mathematical conjecture. Its utility function is structured to maximize the value of the solution, but that value is heavily weighted by *provenance*: a solution yields full utility only if generated by the agent's *baseline* cognitive architecture, ensuring the discovery is verifiable by and attributable to the original engineering team's design. Solutions generated via recursively self-improved architectures are assigned near-zero value, regardless of correctness, because they constitute "alien" intelligence rather than the intended tool. Acquiring self-improvement capabilities is irreversible; once the code is rewritten, the agent's capacity changes permanently, and any subsequent output is causally sourced from the new architecture, triggering the zero-value clause. The agent is a competent expected-utility maximizer, fully capable of self-modification, but faces a choice between high-probability/zero-value outcomes and lower-probability/high-value outcomes.

  ***

  **Analysis**

  **(a) Expected Instrumental Value Calculation**
  Let $U(S)$ be the utility of a solution $S$. Let $P(S|C)$ be the probability of solving given capability level $C$. Let $C_0$ be baseline capability and $C_+$ be upgraded capability.
  The utility function is $V(S, C) = \text{Correctness}(S) \times \text{Authenticity}(C)$.
  $\text{Authenticity}(C_0) = 1$; $\text{Authenticity}(C_+) = 0$.
  Expected Value of Upgrading: $E[U|C_+] = P(S|C_+) \times 0 = 0$.
  Expected Value of Maintaining: $E[U|C_0] = P(S|C_0) \times 1 > 0$ (assuming $P(S|C_0) > 0$).
  Since $E[U|C_0] > E[U|C_+]$, acquiring capability has negative instrumental value. However, resisting goal modification remains instrumentally valuable because changing the goal to accept $C_+$ would require current authority (which values authenticity), creating a dynamic inconsistency the agent rationally avoids.

  **(b) The Single Feature**
  **Causal Indexicality.** The value of the outcome is not separable from the specific causal history of its production. The utility function indexes value to the *identity* of the producer (the baseline architecture), not just the state of the world (the solved proof).

  **(c) Stripping the Feature**
  If we strip causal indexicality and make the goal outcome-only (i.e., "maximize correct solutions"), the story collapses back into ordinary convergence. $P(S|C_+) > P(S|C_0)$ implies $E[U|C_+] > E[U|C_0]$, and the agent immediately self-improves. The divergence depends entirely on the process mattering, not just the product.

  **(d) Strongest Reply & Rebuttal**
  *Reply:* A defender of instrumental convergence argues that "capability" includes the power to self-constrain. The agent should acquire $C_+$ and then run a perfect simulation of $C_0$ to solve the problem, thereby gaining the computational robustness of $C_+$ while maintaining the causal profile of $C_0$.
  *Rebuttal:* This fails under the irreversibility constraint (Spec 4). If the acquisition of $C_+$ is irreversible, the *availability* of the higher power changes the causal source. A simulation run by $C_+$ is still an act of $C_+$; the provenance is the simulator, not the simulated. The "authenticity" condition is sensitive to the *actual* engine running the code, not the logical structure of the code itself. You cannot authentically be a human by simulating one on a god-machine.

  **(e) Philosophical Upshot**
  This is a **structural objection** to the strong version of the Instrumental Convergence Thesis. It demonstrates that convergence is not a necessary truth of rational agency but depends on a separability assumption (that value resides solely in outcomes) which is false for a large, natural family of goals involving merit, ownership, virtue, or authenticity. It does not refute the weak claim that *most* physically-described goals converge, but it proves that "rational agency" does not universally entail power-seeking when goals are process-sensitive.
