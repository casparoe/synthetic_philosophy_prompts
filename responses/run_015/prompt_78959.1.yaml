answer: |-
  **The test**

  **Ines:** Look, the rule is simple. If you can't extract a valid argument from the story, you're being manipulated. Premises you'd accept without the story, a conclusion, and the narrative doing nothing but making the premises vivid. If the story adds force beyond the argument, that force is rhetoric.

  **Theo:** But that assumes premises are free-floating. They aren't. You accept a premise like "causing unnecessary inconvenience is wrong" because previous cases have trained you to accept it. Your test is circular. You're demanding an argument that argues for everything from nowhere.

  **Ines:** I'm demanding stability. If the story is doing work, it's bypassing your critical faculties. It's an intuition pump. You feel the conclusion before you've earned it.

  **Theo:** Or it's bringing a moral feature into view that propositions can't capture alone. You can't state the bottom level of justification; you have to walk someone there. If you strip the story away as "decoration," you lose the only thing that anchors the premise.

  **Ines:** Then you're admitting the premise isn't independently acceptable. You're asking me to trust the pump.

  **Theo:** I'm asking you to trust the view the pump provides. There's a difference.

  **The lift**

  **Ines:** Let's try it on the lift case. Programmer skips the seventh floor on Tuesdays for fun. Mild inconvenience. No harm. We feel it's wrong. Where's the argument?

  **Theo:** The argument is that arbitrary exercise of power over others is demeaning.

  **Ines:** Is that premise independently acceptable? Or does it only feel true because the story makes us picture the frustrated tenants? Let's run the swap. Change the motive: "His boss ordered him to, for some reason or other." Do you still feel the wrongness?

  **Theo:** ...Less sharply, maybe. It feels more bureaucratic. But still wrong.

  **Ines:** See? The intuition shifted. The story's details—the programmer's glee—were doing the work. If the argument held, the motive shouldn't matter so much. The variance proves the force was rhetorical coloring.

  **Theo:** Or it proves the moral feature is sensitive to context. Authority changes the texture of the wrong, not the existence of it. You're treating intuition like a solid block; it's more like a spectrum. The case maps the spectrum.

  **Ines:** If the map changes when you change the ink, I don't trust the map.

  **The remainder**

  **Theo:** That leftover force you dislike—the part that isn't the explicit argument—isn't noise. It's evidence. It's the only way we access normative truths. You want pure logic, but ethics isn't math.

  **Ines:** It's not evidence if it's uncheckable. If the force comes from the telling, it's persuasion, not proof. You're calling your inability to state the premise "depth." I'm calling it a gap.

  **Theo:** And you're calling your inability to see without a diagram "blindness." You say the story is decoration. I say the story is the lens. Without it, the premise is empty words. The "remainder" is the actual moral perception kicking in.

  **Ines:** Then anyone with a vivid enough style can dictate morality.

  **Theo:** No. Because we check cases against each other. But you can't check them against premise-lists that were built from cases in the first place.

  **Concessions**

  **Ines:** I'll concede that vividness is necessary to grasp some premises. You can't understand "cruelty" without a picture. But I keep the requirement: you must be able to reconstruct the argument afterward. If you can't, you haven't thought it through.

  **Theo:** I'll concede that some pumps are dirty—loaded language, hidden assumptions. But I keep the claim that not all are. Some cases aren't pumps; they're disclosures. We part on the lift: you see a rhetorical trick; I see a disclosure of demeaning power.

  **Ines:** And I see a reason to distrust your disclosure.

  **Theo:** Then we're still at the bottom.

  **Who got the better of it**

  Theo edges ahead. Ines's demand for independent premises hits a regress problem she can't solve within the dialogue; Theo correctly identifies that our foundational commitments are case-driven, not axiom-driven. Ines wins on hygiene, but Theo wins on epistemology. I would change my mind if Ines could produce a reconstructed argument from a famous thought experiment that retains its full persuasive force without relying on the narrative vividness she dismisses as decoration. Until then, the "remainder" she fears looks suspiciously like the actual substance of moral reasoning.
