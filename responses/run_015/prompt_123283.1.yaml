answer: |-
  **Memorandum**
  **To:** Program Team
  **From:** Program Director
  **Subject:** Discussion Document: Prioritization Frameworks and Finalist Rankings

  The following transcript records a conversation between Priya Anand and Tobias Lund regarding the upcoming five-year budget commitment. It is circulated to clarify where our strategic disagreements lie before the final vote.

  ***

  **Priya Anand:** We have forty million dollars to allocate across five years, and the dossier leaves us with three distinct profiles. Cause A offers scale but diminishing returns. Cause B offers a threshold effect with high risk. Cause C offers leverage but indirect impact. My concern is that if we abandon the Importance-Tractability-Neglectedness framework now, we lose the common language we've used to screen these options.

  **Tobias Lund:** I'm not suggesting we abandon the concepts, Priya. I'm suggesting we stop treating them as a multiplication formula. Look at Cause B. The dossier models it as all-or-nothing. Below a certain funding threshold, the coalition collapses and the probability of a treaty is zero. Above it, the probability jumps. If we treat neglectedness as a uniform good—as the framework implies—we undervalue B. It is neglected now, but that neglectedness is a warning sign, not an opportunity. We need other funders to join us to cross the threshold.

  **Priya Anand:** You're arguing that the sign of neglectedness depends on the shape of the production function.

  **Tobias Lund:** Exactly. Under diminishing returns, like Cause A, neglectedness means room for funding. The marginal dollar goes further because few others are there. But where returns are increasing—like the coalition capacity in B—neglectedness means isolation. A dollar is worth more where others are already committed because that's what pushes us over the tipping point. Reading neglectedness as a uniform multiplier is a category mistake.

  **Priya Anand:** I concede that the standard heuristic assumes diminishing returns. If the evidence suggests convexity in Cause B, we must adjust the tractability score to reflect the coalition threshold. But that is an adjustment within the framework, not a reason to discard it. The framework flags B as neglected; our due diligence identifies the convexity. We don't need a new calculus to note that a threshold exists.

  **Tobias Lund:** It's not just a note. It changes how we aggregate. For a threshold cause, the quantity that matters is the probability of crossing the threshold, not expected importance multiplied by tractability. Variance is not neutral here. If we fund half of what's needed for B, we get zero durable impact. The framework smooths over that risk. It encourages us to think we can buy half a treaty.

  **Priya Anand:** But Tractability is supposed to capture probability of success. If the model says we need fifty million to cross the threshold and we have forty, the Tractability score drops. We aren't buying half a treaty; we are assigning a low probability to the whole treaty. The multiplication handles this if the inputs are honest.

  **Tobias Lund:** Does it? That brings me to the arithmetic itself. The three factors have no fixed units. If I measure Importance in lives saved versus DALYs averted, or on a log scale versus linear, the ranking changes. Worse, look at Cause C. If Neglectedness is scored as resources devoted relative to problem size, then Importance is either cancelled out or counted twice. You are multiplying problem size by the inverse of resources devoted to that problem.

  **Priya Anand:** You're treating the framework as a decision rule when it was designed as a screening device for a wide funnel. Cost-effectiveness analysis does the fine-grained work later. We use ITN to ensure we aren't ignoring a massive, solvable, ignored problem. Estimating the exact exponents for a production function on novel causes is precisely what cannot be done. A transparent qualitative score beats spurious precision.

  **Tobias Lund:** But the spurious precision is in the multiplication, not the exponents. If the framework is a first-order approximation of a production function, then the exponents carry the content, not the factors. We should be estimating returns-to-scale, not guessing scores from one to ten. And don't tell me my counterfactuals are more precise. They rely on models too.

  **Priya Anand:** They rely on different assumptions. My complaint is that your counterfactual accounting demands we know what other funders would do if we stepped back. That is speculative.

  **Tobias Lund:** It's less speculative than assuming neglectedness proxies for replaceability. What we are choosing is the difference our particular grant makes. For Cause A, if we step back, does another funder step in? The dossier says several large funders are active. Our money might be replaceable. For Cause C, the value is redirecting other funders' money. Neglectedness measured as current resources is a poor proxy for flow-through effects. It may even be inversely related. A cause might be neglected because it's hard to measure, not because it's high leverage.

  **Priya Anand:** I agree that replaceability matters. I concede that for Cause A, if the evidence review downgraded the long-run benefits, and the field is crowded, our counterfactual impact is lower than the total impact suggests. The ITN framework can obscure that if we focus only on total burden. However, your counterfactual approach risks paralysis. We cannot know the absorption capacity of Cause B with certainty. If we wait for perfect counterfactual clarity, we fund nothing.

  **Tobias Lund:** I'm not asking for certainty. I'm asking us to rank based on the marginal dollar's counterfactual value, not the cause's total importance. That means Cause A drops. It's crowded and benefits are downgraded. Cause C rises because it leverages others' budgets. Cause B is the wildcard—high leverage if we hit the threshold, zero if we don't.

  **Priya Anand:** And that is where we remain divided. You are prioritizing leverage and threshold potential. I am prioritizing robustness and direct burden reduction.

  **Tobias Lund:** So let's state the residual disagreement precisely. My ranking is B, then C, then A. I believe the marginal dollar in B has the highest expected counterfactual value despite the risk, because success is durable and currently underfunded. C is second for its option value. A is last because of replaceability and downgraded evidence. What would settle this for me is a reliable estimate of the probability that our funding, combined with current commitments, crosses the coalition threshold for B. If that probability is above thirty percent, B wins.

  **Priya Anand:** My ranking is A, then C, then B. I believe A remains the most robust choice because the delivery mechanism is understood, even if long-run benefits are downgraded. The sheer scale of the affected population ensures high importance. C is second for its infrastructure value. B is last because the threshold risk is too high for a core program budget. What would settle this for me is conclusive evidence restoring the long-run developmental benefits of A. If the downgraded evidence is reversed, A's robustness outweighs B's leverage.

  **Tobias Lund:** Then we agree on the uncertainty, but not on how to price it.

  **Priya Anand:** We agree on the uncertainty. We disagree on whether to insure against it or bet on it.

  **Tobias Lund:** And the vote turns on which risk the foundation is willing to hold.

  **Priya Anand:** Precisely.
