answer: |-
  1. **Agreed Claims**

  The following claims represent the substantive consensus reached between the Diachronic-Autonomy Preservationist (DAP) camp and the Present-Subject-Sovereignty (PSS) camp. These claims exclude contested philosophical premises and focus on shared structural understandings of the problem.

  1.  **The Dual Function of Advance Directives:** Both camps agree that advance directives (ADs) serve two distinct moral functions: (a) an *epistemic* function, providing evidence about what the patient might currently value if they could communicate (predictive authority); and (b) a *normative* function, establishing a binding commitment made by a competent agent to constrain future choices (prescriptive authority). Both camps agree that confusion between these two functions is a primary source of ethical error in clinical practice.
  2.  **Graded Psychological Continuity:** Both camps accept that psychological continuity (memory, character, values) is a matter of degree, not a binary switch. There is no non-arbitrary bright line where a patient suddenly becomes a "different person" in the psychological sense. Consequently, ethical frameworks must account for intermediate cases where significant psychological connections remain despite significant value change.
  3.  **Conditions of Conflict:** Both camps agree that a genuine ethical conflict exists only when: (a) the patient currently lacks decision-making capacity regarding the specific treatment; (b) the patient expresses a stable preference contrary to a prior valid directive; and (c) the treatment in question carries significant burden or benefit. Mere momentary fluctuation in mood does not constitute a conflict requiring this framework.
  4.  **The Moral Relevance of Welfare:** Both camps agree that the patient's welfare is a primary moral consideration. They disagree on how to calculate welfare (e.g., satisfaction of prior critical interests vs. avoidance of current experiential suffering), but they agree that causing net harm to the patient without compelling justification is prima facie wrong.
  5.  **Legal and Moral Distinction:** Both camps acknowledge that legal enforceability of ADs does not settle the moral question. A directive may be legally binding yet morally contested, or morally binding yet legally unenforceable. This collaboration addresses the moral authority, assuming the legal threshold for incapacity has been met.

  *Note on Verbal vs. Substantive Disagreement:* We flag that some apparent disagreement stems from divergent definitions of "the patient." Camp A tends to define "the patient" as the temporally extended life-narrative, while Camp B defines "the patient" as the current locus of consciousness. We classify this as a **substantive** disagreement masked as a verbal one, because it dictates different truth conditions for claims about harm and benefit. However, we agree to use "patient" neutrally in this document to refer to the biological human being currently under care, while specifying whether we refer to their *earlier* or *present* moral status.

  2. **Disagreements Table**

  The following table isolates the residual disagreements. Column (a) provides a neutral formulation of the issue. Column (b) states the DAP position in wording they accept. Column (c) states the PSS position in wording they accept.

  | (a) Neutral Formulation of Issue | (b) Camp A (Diachronic-Autonomy Preservationist) Position | (c) Camp B (Present-Subject-Sovereignty) Position |
  | :--- | :--- | :--- |
  | **1. The Source of Binding Force**<br>What grounds the moral authority of an advance directive when it conflicts with current preferences? | The authority derives from the right of a competent agent to shape the narrative integrity of their whole life, binding future iterations of the self to prior critical interests. | The authority derives solely from the instrumental value of respecting past wishes to promote current well-being; it lacks intrinsic binding force against current experiential interests. |
  | **2. Partial Continuity and Value Change**<br>Does partial psychological continuity combined with stable value change undermine the binding force of a prior directive? | No. Provided narrative identity remains intact, stable value change in the present self does not override the prior competent self's prescriptive authority regarding critical life interests. | Yes. Stable value change in the present self, even with partial continuity, indicates a divergence of moral interests sufficient to void the prior self's prescriptive authority. |
  | **3. The Status of the Earlier Self**<br>What is the moral relationship between the author of the directive and the current incapacitated subject? | The earlier self is the legitimate trustee of the later self's life, possessing legislative authority over decisions that define the life's overall meaning. | The earlier self is a distinct moral agent relative to the later subject, possessing only advisory authority akin to a close family member or friend. |

  3. **Cruxes**

  The following cruxes identify sub-questions where resolution would significantly shift the ethical weighting of the disagreement. Both camps agree that the following concrete case bears directly on these cruxes.

  **Concrete Case:** A patient with progressive neurocognitive decline retains autobiographical memory and family recognition but expresses a consistent, stable preference for comfort-focused care that contradicts her prior directive demanding aggressive life-prolonging intervention.

  **Crux 1: Sufficiency of Narrative Continuity for Moral Authority**
  *   **Question:** Is the retention of narrative identity (autobiographical memory and recognition) sufficient to maintain the moral bindingness of prior critical interests?
  *   **Relevance to Case:** The patient retains narrative continuity despite value change.
  *   **Camp A Prediction:** Camp A predicts this case demonstrates that **narrative continuity is sufficient** for authority. Because the patient recognizes her past and maintains a story linking her past to present, the prior directive remains binding; the value change is viewed as a deviation within a single moral life.
  *   **Camp B Prediction:** Camp B predicts this case demonstrates that **narrative continuity is insufficient** for authority. Because the patient's current evaluative stance stably diverges from the past, the current subject's welfare outweighs the narrative link; the value change marks a moral discontinuity sufficient to void the directive.
  *   **Resolution Impact:** If it were settled that narrative continuity *alone* grants full moral authority, Camp B would concede to following the directive. If it were settled that narrative continuity is *insufficient* without evaluative consistency, Camp A would concede to following current preferences.

  **Crux 2: Etiology of Value Change**
  *   **Question:** Does the etiology of value change (disease-induced versus authentic rational revision) affect the legitimacy of honoring the directive?
  *   **Relevance to Case:** The value change occurred alongside progressive neurocognitive decline (pathology).
  *   **Camp A Prediction:** Camp A predicts this case demonstrates that **etiology is decisive**. Because the value change is driven by neurocognitive pathology, it lacks the authenticity required to override a prior competent decision; the directive stands because the current preference is "tainted" by disease.
  *   **Camp B Prediction:** Camp B predicts this case demonstrates that **etiology is secondary to stability**. Because the current preference is stable and reduces current suffering, the cause of the change matters less than the current reality of the subject's experience; the directive is overridden because the current subject is the one enduring the treatment.
  *   **Resolution Impact:** If it were settled that disease-induced value changes *never* invalidate prior directives, Camp B would need to significantly narrow their sovereignty claim. If it were settled that *current stability* overrides etiology, Camp A would need to accept that some pathological changes can legitimately void prior commands.
