      *   **Solution:** Swap the Priors for NE and NW.
      *   **New Priors:** **NW = 0.45**, **NE = 0.05**, SE = 0.25, SW = 0.25.
      *   *Why:* This makes "North" initially West-heavy. The message "If N, then W (0.75)" is *less* surprising for North.
