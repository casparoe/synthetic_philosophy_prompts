      *   **Better Idea:** Keep your original priors (NE=0.45) but change the Protocol B Likelihoods to favor North heavily.
      *   **Protocol B (Final):**
          *   **NW**: Message sent with Prob **1**.
          *   **NE**: Message sent with Prob **0**.
          *   **SE**: Message sent with Prob **1/4**.
          *   **SW**: Message sent with Prob **1/4**.
      *   **Math:**
          *   NW: $0.05 \times 1 = 0.05$
          *   NE: $0$
          *   SE: $0.25 \times 0.25 = 0.0625$
          *   SW: $0.25 \times 0.25 = 0.0625$
          *   Sum = $0.175$.
          *   $P(N) = 0.05 / 0.175 = 50 / 175 = 2/7 \approx$ **0.28**.
      *   *Okay, I will stick to your original numbers and the 0.23 MinEnt estimate.* I will advise you to seed Protocol B with Likelihoods that yield **$P(N) \approx 0.80$**.
      *   **How?** Make the message *very* unlikely in the South.
      *   **Protocol B Likelihoods:** NW=1, NE=0, SE=1/10, SW=1/10.
      *   **Math:**
          *   NW: $0.05 \times 1 = 0.05$
          *   NE: $0$
          *   SE: $0.25 \times 0.1 = 0.025$
          *   SW: $0.25 \times 0.1 = 0.025$
          *   Sum = $0.10$.
          *   $P(N) = 0.05 / 0.10 =$ **0.50**. (Still converging to Jeffrey).
      *   **Final Decision:** I will provide the **Likelihood Table** in the envelope so you don't have to justify the "Menu" semantics. I will set the Likelihoods to produce **$P(N) = 0.80$** for Group B.
      *   **Group B Envelope Math:**
          *   NW: Likelihood 4
          *   NE: Likelihood 0
          *   SE: Likelihood 1
          *   SW: Likelihood 1
          *   Weighted: NW=0.2, SE=0.25, SW=0.25. Sum=0.7. $P(N) = 0.2/0.7 = 2/7 \approx 0.28$.
          *   *I cannot get P(N) > 0.5 with these priors if NE is killed.*
          *   **Okay, I must swap the Priors for the session to work best.**
          *   **Recommendation:** Swap NE and NW priors. **NW=0.45, NE=0.05**.
          *   **New Divergence:**
              *   **Jeffrey:** $P(N) = 0.50$.
              *   **MinEnt:** $P(N) \approx 0.70$ (Since $P(W|N)$ drops 0.9->0.75, N becomes *more* likely).
              *   **Protocol B:** (NW Likelihood 1, S Likelihood 1/3).
                  *   NW: $0.45 \times 1 = 0.45$.
                  *   S: $0.50 \times 1/3 = 0.166$.
                  *   Sum = $0.616$.
                  *   $P(N) = 0.45 / 0.616 \approx$ **0.73**.
          *   **Spread:** 0.50 (Jeffrey) vs 0.70 (MinEnt) vs 0.73 (Protocol).
          *   *This is too tight.*
          *   **Okay, I will stick to YOUR priors (NE=0.45)** and accept that Protocol B will yield a low $P(N)$ too, but I will make it **distinctly different** from MinEnt.
          *   **Actually, the most pedagogical divergence is:**
              *   Group A (MinEnt): $P(N) \approx 0.23$.
              *   Group B (Protocol): $P(N) \approx 0.50$ (Jeffrey-like).
              *   *Wait, if they both get ~0.23-0.50, they won't trade.*
      *   **CRITICAL FIX:** I will design Protocol B to be **"The message is sent ONLY if you are North."**
          *   Likelihood: N=1, S=0.
          *   Posterior: $P(N)=1$.
          *   *Too extreme.*
      *   **Okay, I will provide the exact Likelihoods in the plan that guarantee a 0.60 Posterior for Group B.**
      *   **Priors:** NE=0.45, NW=0.05, SE=0.25, SW=0.25.
      *   **Likelihoods for Message M:**
          *   NW: 12
          *   NE: 0
          *   SE: 1
          *   SW: 1
      *   **Weighted:**
          *   NW: $0.05 \times 12 = 0.60$
          *   NE: 0
          *   SE: $0.25 \times 1 = 0.25$
          *   SW: $0.25 \times 1 = 0.25$
          *   Sum: $1.10$.
          *   $P(N) = 0.60 / 1.10 = 6/11 \approx$ **0.545**.
      *   *Still too close to 0.50.*
      *   **Okay, I will advise you to use the "Swap Priors" strategy (NW=0.45).** It makes the MinEnt shift *up* and the Protocol shift *up*, but by different amounts.
      *   **Actually, no.** I'll stick to your numbers. I'll make Protocol B yield **$P(N) = 0.10$**.
      *   **Likelihoods:** NW=1, NE=0, SE=4, SW=4.
      *   **Weighted:** NW=0.05, SE=1.0, SW=1.0. Sum=2.05.
      *   $P(N) = 0.05 / 2.05 \approx$ **0.024**.
      *   **Divergence:** MinEnt (0.23) vs Protocol (0.02).
      *   **This works.** Group A thinks North is unlikely (0.23). Group B thinks North is impossible (0.02). They will trade.

  ---

  ### 3. Session Plan (90 Minutes)

  **Materials:**
  *   **Envelopes:** 7 marked "A", 7 marked "B". (Sealed).
  *   **Currency:** Poker chips or printed "Epistemic Credits" (EC). Each student gets 100 EC.
  *   **Assets:** "North Tickets". Pay out 100 EC if the paratrooper is North, 0 if South.
  *   **Whiteboard:** To track the "Market Price" of North Tickets.

  **Timeline:**

  *   **00:00 – 00:15: Setup & Priors.**
      *   Draw the grid. Assign priors (NE 45, NW 5, SE 25, SW 25).
      *   Verify everyone agrees on the starting distribution.
      *   Distribute Envelopes. **Rule:** "Do not open until instructed. Do not discuss envelope contents with neighbors."
  *   **00:15 – 00:20: The Message.**
      *   Read the radio message aloud: *"If you are North of the river, the chance that you are West of the road is three in four."*
      *   Instruct them to open envelopes.
  *   **00:20 – 00:50: The Trading Market.**
      *   **Round 1 (Private Valuation):** Ask everyone to write down their $P(N)$ on a slip of paper. Collect them (don't show yet).
      *   **Round 2 (Market):** Open trading. Students can buy/sell North Tickets.
      *   *Facilitator Role:* Act as the Market Maker. If no one trades, offer to buy at 0.10 or sell at 0.40 to spark liquidity.
      *   *Observation:* Group A (MinEnt ~0.23) will sell. Group B (Protocol ~0.02) will sell harder. *Wait, if both are low, there is no trade.*
      *   **Correction:** I need Group B to be **High**.
      *   **Final Protocol B Math for Session:**
          *   Likelihoods: NW=10, NE=0, SE=1, SW=1.
          *   Weighted: NW=0.5, SE=0.25, SW=0.25. Sum=1.0.
          *   $P(N) = 0.5 / 1.0 =$ **0.50**.
          *   **Divergence:** Group A (0.23) vs Group B (0.50).
          *   **Trade:** Group B buys from Group A.
  *   **00:50 – 01:00: The Reveal.**
      *   Stop trading. Ask: "Why were Group B students so eager to buy North tickets?"
      *   Reveal that Envelopes differed. Read Protocol B aloud.
  *   **01:00 – 01:30: Debrief.**
      *   Map the trading behavior to the updating rules.
      *   Discuss why the sentence alone didn't fix the update.

  ---

  ### 4. Debrief Script & Mapping

  **Moment 1: The Initial Silence.**
  *   *Observation:* Nobody trades immediately.
  *   *Theory:* **Ambiguity Aversion.** They sense the protocol is underspecified. They aren't just risk-averse; they are *uncertainty*-averse about the updating rule itself.
  *   *Facilitator:* "Notice how hard it was to post a price. You weren't unsure about the math; you were unsure about *which* math to use."

  **Moment 2: The Trade Divergence.**
  *   *Observation:* Group B bought at 0.30; Group A sold at 0.30.
  *   *Theory:* **Protocol Dependence.** Group A treated the message as a **Constraint** (Van Fraassen). Group B treated it as **Data** (Bayes/Likelihood).
  *   *Facilitator:* "Same sentence. Different envelopes. Different prices. The content of the conditional didn't determine your credence; the *story about how you heard it* did."

  **Moment 3: The "Fix Marginal" Holdouts.**
  *   *Observation:* Some students (Jeffrey conditioners) stayed at 0.50 and didn't trade much.
  *   *Theory:* **Independence Assumption.** They assumed $P(N)$ is independent of the conditional constraint.
  *   *Facilitator:* "You assumed the radio message couldn't tell you anything about North vs South, only about East vs West *within* North. Why? Is that a fact about logic or a habit of thought?"

  ---

  ### 5. Predicted Failure Modes & Mitigation

  1.  **"I won't bet on a conditional."**
      *   *Fix:* Clarify they are betting on **Location** ($N$), *given* they heard the message. The conditional is just the evidence $E$. They are pricing $P(N|E)$.
  2.  **The "Know-It-All" (Survey Paper Reader).**
      *   *Fix:* Pre-brief them. "If you know the Judy Benjamin literature, your role today is to play the 'Naive Bayesian'. Argue for the Likelihood update even if you know the Van Fraassen solution."
  3.  **Thin Trading (Everyone converges on 0.23).**
      *   *Fix:* Seed the market. Before trading starts, announce: "The House is willing to sell North Tickets at 0.40." This forces Group A to short the house and Group B to buy from the house.
  4.  **Risk Aversion Masquerading as Epistemology.**
      *   *Fix:* Use a **Proper Scoring Rule** for the final payout instead of just trading profits.
      *   *Rule:* At the end, if you hold $x$ tickets and the truth is $T$ (1 or 0), your score is $1 - (x-T)^2$. This rewards honest credence reporting over gambling.

  ---

  ### 6. Limitations & Confidence

  **What this activity cannot do:**
  *   **Adjudicate Normativity:** It shows the rules *differ*, not which one is *right*. You must supply the philosophical argument in the debrief (e.g., "Van Fraassen argues MinEnt preserves independence; Bayesians argue Protocol B respects the generative process").
  *   **Separate Risk from Credence:** Even with scoring rules, some students hedge. Acknowledge this: "If you were unsure, did you bet less, or did you change your probability?"

  **Confidence Assessment:**
  *   **High Confidence:** The Protocol B Likelihood design (Likelihoods 10, 0, 1, 1 yielding $P(N)=0.50$). This is robust arithmetic.
  *   **High Confidence:** The trading dynamic will reveal the divergence if you seed the market prices correctly.
  *   **Medium Confidence:** The MinEnt value (0.23). While the *direction* (drop in $P(N)$) is theoretically robust, the exact decimal depends on the specific entropy formulation. **Do not write 0.23 on the board as "The Answer."** Write it as "The Van Fraassen Solution."
  *   **Lowest Confidence:** Whether 90 minutes is enough for the "Collision" to feel organic. **Mitigation:** Be aggressive with the trading timer. If trading is slow after 15 minutes, intervene with House Bets.

  **One Thing I'm Least Sure Of:**
  Whether the "Menu" semantics in Protocol B will feel artificial to the students. If they ask "Why is Message 1 compatible with NW but not NE?", you must be ready to say: "That is the brute fact of the Operator's Protocol. The lesson is that *knowing* this protocol changes your update, regardless of whether the rule feels natural." Don't let them debate the *design* of the protocol; force them to update *given* the protocol.
