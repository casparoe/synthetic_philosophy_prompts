              *   NE: $0$
              *   SE: $0.25 \times 0.5 = 0.125$
              *   SW: $0.25 \times 0.5 = 0.125$
              *   Sum = $0.30$.
              *   $P(N) = 0.05 / 0.30 = 1/6 \approx 0.16$.
