answer: |-
  You dispute a $30,000 condominium assessment. Bylaws award the winner 70% of total legal fees. The insurer rotates adjusters quarterly; each new assignee resets the concession probability to 14% per month, unaware of prior resistance. There is no audience; neighbors urge settlement. Vindication holds no value; you maximize net gain. Yet, having spent $5,000 monthly for six months, you face the choice: pay another $5,000 or quit. A stranger inheriting the file today would calculate the same positive marginal expected value. The adjuster rotation prevents $p$ from decaying; had one adjuster held the file, resolve would harden. You are not trapped by pride, but by a fee-shifting statute converting sunk costs into collateral, making the next round's marginal expected value positive even though entering was negative EV.

  **Model Parameters**
  *   **Stake ($S$):** $30,000.
  *   **Cost per Round ($c$):** $5,000.
  *   **Recovery Fraction ($f$):** 0.70.
  *   **Concession Probability ($p$):** 0.14 (constant per round).

  **Continue-vs-Quit Comparison**
  *   **Early Round (Entry, $K=0$):** Expected Gain = $0.14 \times (30,000 + 0.7 \times 5,000) - 5,000 = 4,690 - 5,000 = -\$310$. Quitting is strictly better. Entering was negative EV.
  *   **Late Round (Month 7, $K=30,000$):** Expected Gain = $0.14 \times (30,000 + 0.7 \times 35,000) - 5,000 = 7,630 - 5,000 = +\$2,630$. Continuing is strictly better.
  *   **Not Sunk-Cost Fallacy:** The past spend ($K$) is not weighed as a loss to be recovered, but as a base for fee recovery ($f \times K$). It materially increases the prize pool for the current round.

  **Decision-Maker Dynamics**
  The probability $p$ stays flat because adjusters rotate; no single agent accumulates resolve. If one adjuster held the file, $p$ would decay as they invested personal reputation in resisting, eventually making marginal EV negative.

  **Inherited File Test**
  A stranger at Month 7 sees $K=30,000$. They calculate marginal EV as $+\$2,630$. They continue. No psychology is required.

  **Verdict**
  The engine is **Fee-Shifting Escalation**.
  *   If $f=0$: Marginal EV is always negative ($-310$). Verdict: Quit immediately.
  *   If $f=1$: Marginal EV grows faster. Verdict: Escalate indefinitely until concession.
  *   **Objection:** "Escalation is always psychological."
  *   **Rebuttal:** On these numbers, a purely rational agent with zero emotional investment must continue. The structure dictates the behavior, not the mind.
