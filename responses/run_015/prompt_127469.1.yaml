      *   *Revenue & Governance:* The *Diwani* rights (1765). The EIC became the tax collector. Smith argued revenue should be used for public good, but EIC used it for dividends and investment. The 'Dual System' (Clive) meant responsibility without accountability.
      *   *Famine Dynamics:* Smith predicted neglect of agriculture. The EIC maximised land revenue regardless of harvest. They also restricted internal grain trade (monopoly practices). This aligns with Smith's 'fiscal predation'.
