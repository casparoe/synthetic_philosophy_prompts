      *   *The 1770 Bengal Famine:* Occurred under the 'Dual System' (Diwani rights granted 1765). EIC collected revenue but left administration to Nawab's deputies (until later). High revenue demands, export of grain, hoarding, and drought contributed. Estimated 10 million deaths (one-third of population).
