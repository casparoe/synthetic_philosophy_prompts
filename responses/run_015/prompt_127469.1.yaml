answer: |-
  **The Merchant and the Magistrate: Adam Smith, the East India Company, and the Bengal Famine of 1770**

  The Great Bengal Famine of 1770, which claimed approximately ten million lives, stands as one of the earliest and most catastrophic indictments of corporate sovereignty. Occurring merely five years prior to the publication of *An Inquiry into the Nature and Causes of the Wealth of Nations* (1776), the disaster unfolded precisely within the administrative framework Adam Smith would later dissect. To analyse the famine through Smith's lens is to examine the collision between the logic of mercantile monopoly and the duties of territorial governance. This analysis maps Smith's theoretical critique onto the East India Company's (EIC) administration, evaluating whether the catastrophe confirms his warnings regarding the incompatibility of trade and sovereignty, or whether it exposes a category error in treating political dominion as merely another ledger entry.

  **The 'Company-Sovereign' and the Structure of Extraction**

  In Smith's taxonomy, the EIC in Bengal represents the quintessential 'company-sovereign'. Following the Treaty of Allahabad in 1765, the Company acquired the *Diwani*—the right to collect revenue—over Bengal, Bihar, and Orissa. Smith argues in Book V of *The Wealth of Nations* that a joint-stock company can never be a competent sovereign. The fundamental divergence lies in the objective: the sovereign's interest is the revenue of the state and the welfare of the people, whereas the company's interest is the profit of the shareholders.

  In Bengal, this divergence manifested in the 'Dual System' established by Robert Clive. The Company possessed the power of the purse (revenue collection) but initially delegated the sword and justice (administration) to the Nawab's deputies. For Smith, this separation was untenable. The Company's servants, acting as 'servant-masters', were incentivised to maximise short-term extraction to fund the Company's 'Investment' (the purchase of Indian goods for export to Europe) and to remit private fortunes back to Britain.

  Smith posits that the only legitimate revenue options for a territorial ruler involve taxation proportionate to the ability to pay, reinvested into public works and defence. The EIC, however, treated land revenue not as a fiscal tool for governance but as a commercial input. They fixed revenue demands at pre-famine levels, ignoring the cyclical nature of agriculture. Where a benevolent sovereign might reduce taxes during a drought to preserve the productive capacity of the land, the company-sovereign, bound by dividend expectations and the need to balance its commercial books, maintained predatory extraction rates. This illustrates Smith's claim that territorial empire under a trading company inevitably leads to fiscal predation; the revenue is not a surplus to be managed, but a profit to be maximised.

  **Famine Dynamics: Predation and Neglect**

  The dynamics of the 1770 famine vividly illustrate Smith's assertion that merchant sovereigns neglect agricultural improvement. Smith contends that companies, focused on the turnover of capital, lack the patience for the long-term investments required for agrarian stability, such as irrigation or flood control. In Bengal, the EIC made negligible investments in infrastructure whilst simultaneously disrupting traditional grain storage mechanisms.

  Furthermore, Smith critiques the 'spirit of monopoly' inherent in chartered companies. In the years preceding the famine, the EIC and its private-trading servants effectively monopolised the internal grain trade. They restricted the movement of rice, ostensibly to prevent hoarding by local dealers, but in practice to secure supplies for their own export contracts or to manipulate prices. When the drought struck in 1769, these monopolistic structures prevented the natural flow of grain from surplus to deficit areas.

  Smith argues that free markets generally mitigate famine by allowing price signals to attract supply. However, he distinguishes this from the artificial scarcity created by monopoly. The EIC's administration did not merely fail to intervene; their commercial regulations actively exacerbated the shortage. This confirms Smith's hypothesis that the union of sovereign power and mercantile monopoly produces a specific type of vulnerability: the population is subjected to the rigours of taxation without the protection of the state, and the market is distorted by the very entity charged with regulating it. The famine was not merely a natural disaster but a 'political famine', born of the structural inability of a profit-seeking entity to prioritise subsistence over solvency.

  **Silences and Breaks in Smith's Framework**

  However, applying Smith's framework reveals certain silences, particularly regarding the moral status of the victims and the specific mechanics of the grain trade.

  Firstly, Smith's critique is primarily economic and utilitarian rather than moralistic in a humanitarian sense. He condemns the Company's rule because it is inefficient and ultimately destructive to the 'wealth of the nation' (including the colony). His framework does not explicitly distinguish the moral culpability of famine victims under direct Company rule versus Crown rule. For Smith, a Crown that taxes excessively is also blameworthy, but he suggests a Crown is *structurally* less likely to do so because its interest aligns more closely with the general prosperity of the dominion. He does not articulate a 'right to life' that is violated specifically by corporate negligence; the violation is one of economic mismanagement. The moral horror of ten million deaths is, in Smith's analysis, evidence of systemic failure rather than a distinct moral crime requiring retribution beyond policy reform.

  Secondly, Smith treats the grain-trade monopoly as a structural feature of empire rather than always a proximate cause of specific catastrophes. While he acknowledges that monopolies raise prices, his theory focuses on the long-term stagnation of wealth. The 1770 famine suggests that monopoly can have immediate, lethal consequences that outpace Smith's gradualist economic models. Smith's theory explains why Bengal became poor, but it requires extension to fully explain why Bengal starved *then*. The specific agency of Company servants in hoarding grain—a form of corruption—was a variable of human greed that Smith's structural critique anticipates but does not fully model as a trigger for mass mortality.

  **Fiscal Loss or Category Error?**

  Finally, one must assess whether the episode confirms Smith's broader argument that colonies are a net fiscal loss, or whether it reveals a category error in his treatment of sovereignty.

  Smith famously argued that the cost of defending and administering the American colonies exceeded the revenue they yielded, rendering them a net drain on the British metropole. In the case of Bengal, the ledger is more complex. For the EIC, Bengal was immensely profitable; the 'Plassey Plunder' and subsequent revenue remittances financed the Company's global expansion and dividends. However, Smith would argue these were private gains offset by public costs. The British state eventually had to bail out the Company (via the Regulating Act of 1773 and subsequent loans), suggesting that the *national* fiscal balance was indeed negative when defence and administration costs were fully accounted for. In this sense, the famine episode confirms Smith's view: the instability caused by predatory rule required costly metropolitan intervention, validating the claim that such empire is economically unsustainable for the sovereign state.

  Yet, the catastrophe also reveals a potential category error in Smith's reasoning. Smith treats the assumption of sovereignty by a company as a 'mercantile miscalculation'—a bad business decision to take on the costs of government. The Bengal Famine suggests the error is not merely fiscal but political and ontological. Sovereignty entails a duty of care that is qualitatively different from commercial risk management. By framing the issue as one of efficiency and fiscal balance, Smith risks reducing a political tragedy to an accounting error. The famine was not just a loss of revenue; it was a collapse of the social contract. Treating territorial sovereignty as merely another variant of mercantile activity obscures the unique violence inflicted when a population is governed by an entity that views them simultaneously as subjects and inventory.

  **Conclusion**

  The 1770 Bengal Famine serves as a grim empirical validation of Adam Smith's theoretical critique of the company-sovereign. The EIC's administration demonstrated the fiscal predation and neglect of agricultural improvement that Smith predicted would arise when merchants wield the powers of the state. The monopoly over grain and the rigidity of revenue extraction turned a drought into a holocaust, illustrating the lethal incompatibility of dividend-seeking and governance.

  However, the episode also exposes the limits of Smith's economic lens. His framework adequately diagnoses the structural inefficiency and the long-term fiscal drain on the metropole, but it is less equipped to account for the immediate moral catastrophe or the specific proximate causes of mass starvation beyond general monopoly theory. Ultimately, while Smith correctly identified that colonies governed by trading companies are a fiscal liability, the Bengal Famine suggests the deeper truth is that sovereignty cannot be commodified. The error was not merely mercantile miscalculation, but the fundamental misconception that the welfare of millions could be managed within the confines of a balance sheet.
