answer: |-
  This is an exceptionally clear map of the moral terrain. You are not confused; you are correctly identifying that "slur" is not a semantic category, but a **speech act** dependent on power, history, and intent.

  To answer your first question directly: **No, there is not one principle.** You are tracking three distinct moral questions that your current policy collapses into one.

  1.  **Semantics:** Is the word being *used* (deployed as a weapon) or *mentioned* (discussed as an object)?
  2.  **Sociology:** Does the speaker possess the **social license** (identity/history) to deploy this term?
  3.  **Ethics:** What is the **foreseeable harm**, and does **intent** mitigate sanction?

  Your gut verdicts are consistent *if and only if* you accept that these three questions matter. If you try to force them into a single principle (e.g., "No Hate Speech"), you will break on Case 15 (power dynamics) or Case 4 (artistic integrity).

  Here is the framework that generates your verdicts, the trade-offs it forces, and the policy recommendation.

  ### The Framework: The "License & Harm" Test

  To apply this on a Tuesday night, you need a flowchart, not a philosophy essay. Your verdicts are governed by this hierarchy:

  **Clause 1: The Use/Mention Distinction (Semantics)**
  *   **Rule:** Is the word doing the work of subordination, or describing it?
  *   **Verdicts forced:** This saves **1, 3, 4, 8**. It condemns **2**.
  *   **Why:** In 1 and 3, the word is evidence. In 2, it is gratuitous performance. In 4 and 8, the word is part of an artistic text *created by* the affected group (which bleeds into Clause 2).

  **Clause 2: The Positionality Constraint (Sociology)**
  *   **Rule:** Does the speaker hold the historical/identity license to reclaim or deploy this term?
  *   **Verdicts forced:** This saves **6, 8**. It condemns **5, 7, 15**.
  *   **Why:** This is the only way to reconcile 4 vs. 5 and 6 vs. 7. In 4, the artist owns the term. In 5, the white presenter is borrowing power they don't have. In 15, the "reverse slur" lacks the systemic weight to enact subordination, but your gut says "not fine." *Correction:* Your gut says 15 is "not fine under rules" but "not the same kind of thing." This clause explains why: it violates the *rule* (no slurs) but lacks the *harm mechanism* of the others.
  *   **Note:** This clause requires volunteers to understand power dynamics. This is the hardest part to operationalize.

  **Clause 3: The Harm & Intent Mitigation (Ethics)**
  *   **Rule:** Was harm foreseeable, and was the intent malicious?
  *   **Verdicts forced:** This saves **9, 10** (education, not punishment). It condemns **11, 12**. It creates the tension in **13, 14**.
  *   **Why:** 9 and 10 lack *mens rea* (guilty mind). 11 has malicious intent (impact > target accuracy). 12 indicates character risk (future harm). 13 and 14 depend on audience reach (foreseeability).

  ---

  ### The Trade-Offs: Which Verdicts Can't Be Kept?

  You asked which verdicts this framework forces you to lose.

  **1. You must lose the indifference on Case 14 (The Welsh Slur).**
  *   **Why:** If your principle is based on *subordination* (Clause 2), a slur is a slur regardless of audience familiarity. If your principle is based on *harm* (Clause 3), it is fine because harm is low.
  *   **The Conflict:** You said you "basically don't care" about 14. But if you accept Clause 2 (Positionality), you must acknowledge it is a slur. If you accept Clause 3 (Harm), you can ignore it.
  *   **Recommendation:** Prioritize **Harm**. If 90% of the audience doesn't know it, the harm is negligible. Policy should focus on words that *land* as weapons, not words that are historically weapons but currently dull.

  **2. You must clarify Case 12 (Private Chat).**
  *   **Why:** This violates Clause 1 (no one was addressed) and Clause 3 (no direct harm). You only sanction this based on **Risk Management**, not Moral Wrong.
  *   **The Conflict:** You want to kick them off the schedule. This is coherent *only if* the policy is about "Fitness to Broadcast," not "Punishing Speech."
  *   **Recommendation:** Frame this as a safety vetting issue. "Private conduct indicating risk to on-air safety."

  **3. Your Ordering (14 > 5 and 11 > 13) is Coherent.**
  *   **14 > 5:** You prefer to ban a white person singing the n-word (high harm/appropriation) over policing an obscure Welsh slur (low harm). This prioritizes **Clause 2 (Positionality)** and **Clause 3 (Harm)** over **Semantic Purity**. This is the right call for community radio.
  *   **11 > 13:** You prefer to ban the bigot (11) over worrying about the dialect speaker (13). This prioritizes **Intent** over **Accidental Offense**. This is also coherent. It suggests your core value is *preventing malice*, not *enforcing perfect language*.

  ---

  ### Running the Test on Your New Cases

  **(a) Straight actor playing a gay character in a period drama saying the f-slur.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Clause 1 (Mention/Art). The actor is not speaking as themselves; they are citing a text. The *character* may be enacting subordination, but the *broadcast* is presenting art.
  *   **Caveat:** Requires context (it must be clear this is a drama, not the host's opinion).

  **(b) Caller says the n-word explaining why nobody should say it, unprompted.**
  *   **Verdict:** **Fine (but risky).**
  *   **Reasoning:** Clause 1 (Mention). The function is educational.
  *   **Risk:** This is the "News Reader" problem (Case 2). If the producer feels the word wasn't *necessary* to make the point (e.g., they could have said "the n-word"), it slides into Case 2.
  *   **Policy:** Allow *only* if essential to the argument, otherwise require "the n-word."

  **(c) Targeted group member using slur S with real contempt about another member of that group.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** Clause 2 (License) is present, but Clause 3 (Harm) is violated. Reclamation is for *solidarity* (Case 6), not *intra-group abuse*.
  *   **Why:** This distinguishes "brother" from "traitor." Using the word to wound within the group weaponizes the history of the slur against a vulnerable peer. It fails the "Subordination" test.

  ---

  ### The Meta-Question: Is the One-Line Rule Actually Better?

  **Yes.**

  Here is the hard truth: **Your gut is right for *Justice*, but the One-Line Rule is right for *Operations*.**

  **The Gap:**
  The gap between the two is **Cognitive Load vs. Liability.**
  *   **Your Gut:** Requires the producer on duty to be a sociologist, linguist, and ethicist in real-time. They must assess power dynamics, intent, and audience composition instantly.
  *   **The One-Line Rule:** Requires the producer to be a technician. "Word detected -> Fader down."

  **Why the One-Line Rule wins for Policy:**
  1.  **Volunteer Turnover:** You cannot train every volunteer to distinguish Case 5 from Case 4 reliably.
  2.  **Legal/Ofcom Liability:** In many jurisdictions (like the UK, given your "spaz"/"traveller" references), the broadcaster is liable for *output*, not *intent*. A complaint about a slur is expensive to fight, even if you were philosophically right.
  3.  **Protection:** The One-Line Rule protects your volunteers from having to make impossible moral judgments on air. It takes the burden off them.

  **The Solution: Split the Trigger from the Sanction.**

  Do not rewrite the policy to be nuanced *on air*. Rewrite the policy to be nuanced *after the fact*.

  **Proposed Policy Structure:**

  1.  **The Bright Line (On-Air):**
      *   "No slurs or hate speech. If a slur is spoken, the presenter is pulled off air immediately. Context does not prevent the cut."
      *   *Why:* This keeps Case 2, 5, 7, 11, 13 safe. It treats Case 1, 4, 9 as "accidents" that still require a cut (which is annoying but safe).

  2.  **The Review Process (Post-Air):**
      *   "Following an incident, the Programming Committee will review the context to determine sanctions."
      *   *Sanction Tiers:*
          *   **Tier 1 (Malice/Bigotry):** Permanent ban (Cases 2, 7, 11, 12, 15).
          *   **Tier 2 (Negligence/Unlicensed Use):** Suspension + Retraining (Cases 5, 13).
          *   **Tier 3 (Error/Education):** Warning + Guidance (Cases 1, 3, 4, 6, 8, 9, 10).
          *   *(Note: Cases 1, 4, 6, 8 ideally shouldn't trigger a cut if pre-approved, but if they slip through, they are Tier 3).*

  **What this achieves:**
  *   It keeps the **One-Line Rule** for the Tuesday night producer (safety first).
  *   It allows your **Gut Verdicts** to determine the *consequence* (justice second).
  *   It solves Case 9 (Kid): Cut the audio (safety), but don't ban the kid (education).
  *   It solves Case 12 (Private Chat): Not an on-air cut, but a Tier 1 Sanction during vetting.
  *   It solves Case 4 (Music): Pre-approve tracks with lyrics. If pre-approved, no cut. If not, cut + Tier 3.

  **Final Advice:**
  Don't try to encode your moral nuance into the *prohibition*. Encode it into the *appeals process*. The prohibition must be dumb to be fast. The justice can be smart if it's slow.

  If you try to write a policy that distinguishes Case 5 from Case 4 in the moment, you will paralyze your volunteers. If you write a policy that says "Stop the clock, we'll figure out why later," you keep the station safe and the volunteers sane.
