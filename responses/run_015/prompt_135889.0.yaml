      *   *What do I owe if I keep (1) reject (2)?* A theory of lexical priority or tragic residue.
      *   *Is the market metaphor wrong?* Yes, largely. Values aren't goods.

  9.  **Final Polish:** (Self-Correction during drafting) Make sure not to just say "Kant says no." Explain *why* the argument fails logically, not just by appealing to authority. Focus on the structure of the inference. Ensure the distinction between *compromise on action* vs. *compromise on principle* is clear.

  **(Self-Correction Note):** I need to be careful with Premise (1) as well. Is it true that a treaty *requires* an exchange rate? Maybe the treaty is just a modus vivendi (peaceful coexistence) without valuation. I should mention that as an alternative attack point, but focus on (2) as the user requested.

