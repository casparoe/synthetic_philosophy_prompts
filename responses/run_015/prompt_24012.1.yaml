      *   *Critique of Draft:* It's a bit clunky. Let's tighten it to ensure it flows as one paragraph and hits the numbers clearly.
      *   *Final Polish:* Focus on a fishery or a bridge weight limit? A bridge is good for thresholds. But "many small contributions" fits pollution or resource depletion better. Let's stick with the groundwater/aquifer idea but make it punchy.
