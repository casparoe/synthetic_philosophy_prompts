answer: |-
  During a severe drought, the Oakhaven Aquifer supplies 100 farming households, and hydrologists have established that if weekly extraction exceeds 10,000 gallons, the water table drops low enough to trigger permanent saltwater intrusion, ruining the supply for everyone. This week, each of the 100 households pumps exactly 120 gallons for essential irrigation, resulting in a total extraction of 12,000 gallons, which causes the saltwater intrusion to occur. Elias, one of the 100 households, pumps his standard 120 gallons; had Elias pumped zero gallons, the total extraction would have been 11,880 gallons, which still exceeds the 10,000-gallon threshold, meaning the intrusion would have occurred regardless of his restraint. Elias was not the household that pumped the 10,000th gallon (that occurred early Tuesday when the 84th household finished pumping), so his specific water did not tip the balance, yet his 120 gallons were physically removed from the aquifer and constitute a measurable portion of the 12,000-gallon total that physically lowered the water table to the harmful level.

  ***

  ### Analysis of Responses

  **1. The Three Responses**
  *   **(i) The Difference-Making Response:** This view relies on counterfactual dependence. Since the harm (saltwater intrusion) would have occurred even if Elias had refrained (11,880 > 10,000), Elias made no difference to the outcome. Therefore, he is not a cause of the harm and bears no responsibility for it.
  *   **(ii) The Causal-Contribution Response:** This view relies on process ontology. Elias's pumping was a physical part of the aggregate process that lowered the water table. Even though his contribution was not *necessary* for the harm (due to the surplus), it was *sufficient* as part of the set of all pumpings that actually produced the harm. He is a cause because he genuinely contributed to the causal mechanism, rendering him liable for a share of the harm.
  *   **(iii) The Equilibrium / Marginal Response:** This view focuses on expected impact or tipping points. Since Elias was not the marginal agent (the 84th household tipped the threshold, not the 100th), his action did not change the probability of the harm in any meaningful economic or decision-theoretic sense. Like the difference-making view, this absolves Elias because he did not alter the equilibrium state from "safe" to "harmful."

  **2. The Working Feature and Its Removal**
  The feature doing the philosophical work is the **threshold-with-surplus structure**. The surplus (2,000 gallons) creates a gap between *being a cause* and *making a difference*. It ensures that the agent is causally active but counterfactually unnecessary.
  *   **If that feature is removed (Exact Threshold):** If the total contribution were exactly 10,000 gallons (e.g., 100 households pumping 100 gallons each), Elias would become a difference-maker. If he refrained, the total would be 9,900, and the harm would be averted. In this scenario, all three responses would likely converge on the verdict that Elias is responsible. The surplus is required to drive a wedge between the difference-making and causal-contribution views; without it, the inefficacy objection loses its grip because efficacy is restored.

  **3. The Inefficacy Objection and Causal Dilution**
  A defender of the inefficacy objection would attack this case using the **redundancy / causal-dilution objection**. They would argue that in a surplus scenario, causation is not binary but divisible. Since 2,000 gallons of the extraction were "wasted" regarding the threshold (the harm would have happened with just 10,000), Elias's 120 gallons might fall entirely within that redundant surplus. If causation requires necessity, Elias is not a cause. If causation is shared, his share is diluted by the 99 other contributors. The objection presses that calling Elias a "cause" is an empty metaphysical label if removing him changes nothing in the world; moral responsibility, they argue, tracks *changes in the world*, not mere physical participation.

  **Does the Causal-Contribution Response Succeed?**
  The causal-contribution response succeeds only if one accepts a non-counterfactual theory of causation (such as process theories or conserved quantity theories). It successfully isolates the intuition that Elias is *doing* something harmful, even if he isn't *decisive*. However, it struggles to quantify the moral weight. If Elias is a cause, is he responsible for 1/100th of the harm, or the whole harm (jointly and severally)? If the former, the inefficacy objection returns in the form of negligible responsibility (1/100th of a ruined aquifer is morally tiny). If the latter, it seems unfair given his lack of difference-making power. The response succeeds in establishing *some* causal link where difference-making finds none, but it does not automatically solve the problem of how much moral weight that link carries in a surplus context. It proves Elias is not innocent, but it does not fully prove he is significantly blameworthy without further premises about complicity.
