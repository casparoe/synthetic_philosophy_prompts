answer: |-
  Here is the ranking, the defense, and the roadmap. I am treating you as a peer in modeling, not a student of philosophy. You are asking for a stability analysis of a theoretical framework, and that is exactly how you should approach it.

  ### The Verdict

  **Spend your year on Question 2: The Noisy Mugger (Error Structures & Bounded Simulation).**

  This is the only question where your thirty-five years of atmospheric physics give you a comparative advantage over the career philosophers working on this. The rest of the field is currently stuck in a loop of "intuition pumping" about perfect predictors. You have the tools to treat the predictor as a physical system with a noise floor, a computational budget, and a convergence profile.

  If Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) is to be more than a theological curiosity, it must be robust to perturbation. If the "pay the mugger" verdict flips discontinuously when predictor accuracy drops from 100% to 99%, the theory is physically vacuous. If it degrades gracefully, there is a law there worth finding.

  ### The Ranking and Defense

  Here is the ordering of your five questions by "value per hour invested," given your specific background and constraints.

  **1. The Noisy Mugger (Error Structures)**
  *   **Why First:** This is the "physics" of the problem. Current decision theory assumes logical omniscience (the predictor knows your output with probability 1). In data assimilation, you know that assuming perfect observation leads to filter divergence. The same applies here.
  *   **Tractability:** High. You can model the predictor as a function $P(agent\_code)$ with an associated error distribution $\epsilon$. You can explore how the correlation between your actual output and the predicted output decays as computational bounds tighten.
  *   **Progress Metric:** A phase diagram. Under what conditions of noise ($\sigma$) and computational cost ($C$) does the expected utility of "paying" exceed "not paying"? If you can derive a threshold condition (e.g., "Pay iff predictor accuracy $> 0.5 + \delta$"), you have advanced the field more than a hundred papers arguing about intuitions.

  **2. Common-Cause vs. Logical Dependence (The Blackmail Boundary)**
  *   **Why Second:** This defines the domain of validity. You need to know if the mechanism driving the correlation is *substantive* (your algorithm determines the output) or *spurious* (a common cause correlates them).
  *   **Tractability:** Medium. This is conceptual but can be formalized using causal graphs (DAGs). The hard part is "logical dependence" without omniscience.
  *   **Progress Metric:** A formal criterion that distinguishes a "logical link" from a "statistical correlation" in a bounded agent. If you can't define this without assuming omniscience, the theory fails.

  **3. Unity of Mugging and Blackmail**
  *   **Why Third:** This is taxonomy. Once you solve Q2 (how the mechanism works under noise) and Q3 (what counts as a link), Q1 usually answers itself.
  *   **Tractability:** Low reward. Philosophers often fight over whether two problems are "the same" based on verbal definitions. For a modeler, they are the same if the governing equations are isomorphic.
  *   **Progress Metric:** Showing that the error-structure model from Q2 applies identically to both cases.

  **4. Composition (Iteration and Superrationality)**
  *   **Why Fourth:** Don't walk before you run. If the single-shot case is unstable under noise (Q2), the iterated case is just compounding error.
  *   **Tractability:** Low. This drifts into speculative AI safety and acausal trade, which relies on assumptions not yet secured.
  *   **Progress Metric:** Demonstrating that the noise threshold from Q2 allows for convergence in iterated settings.

  **5. Real-World Implications**
  *   **Why Last:** This is the "sales pitch," not the science. You cannot evaluate the implications until you know if the engine runs.
  *   **Tractability:** Low. Most claims here are overextended.
  *   **Progress Metric:** A audit of which implications survive the "Noisy Mugger" test.

  ---

  ### Deep Dive: How to Attack Question 2

  You asked what counts as progress and what would move the question up or down. Here is the research program.

  **The Core Hypothesis:**
  Current decision theories treat the predictor as a boundary condition (Perfect Knowledge). You should treat the predictor as a *channel* with capacity limits and noise.

  **The Argument to Make:**
  In Counterfactual Mugging, the argument for paying rests on the claim that your decision procedure *controls* the counterfactual branch. If the predictor is a simulation of you, it halts or errors out.
  *   **The Trap:** If you model the error as simple random noise (e.g., predictor flips its own coin), the problem collapses back to Causal Decision Theory (CDT). Why? because if the error is independent of your reasoning process, your action today provides no information about the prediction made yesterday.
  *   **The Opportunity:** The error must be *structural*. If the predictor simulates you for $N$ steps, and you deliberate for $N+1$, where does the error come from? Does it default to "Defect"? Does it sample from your prior?
  *   **The Physicist's Angle:** This is a **resolution problem**. At what granularity does "you" exist? If the predictor models you as a fluid dynamics simulation (macroscopic) rather than a particle simulation (microscopic), does the decision hold?
  *   **Progress Condition:** You make progress if you can show that "Pay" is the stable equilibrium *only* when the predictor's model resolution matches the agent's decision resolution. If the predictor is "blurry," the acausal link breaks. This turns a metaphysical puzzle into a signal-processing problem.

  **What Would Move It Down the List:**
  If you find that the "Pay" verdict is *infinitely sensitive* to noise. If accuracy must be literally 100% for the logic to hold, then the problem is a mathematical singularity with no physical instantiation. In that case, abandon it as a curiosity and move to Q3 (Common Cause), which might survive noise better.

  **What Would Move It Up:**
  If you find a "plateau." If you discover that as long as the predictor is better than random by a specific margin, and the error is correlated with your algorithm's structure (not independent noise), the "Pay" verdict holds robustly. That would suggest a new law of bounded rationality.

  ---

  ### The Implications: A Reality Check

  You asked which claimed implications follow, which are overrated, and which are false. Based on the current state of the art and the "Noisy Mugger" critique:

  **1. AI Systems Modeling Agents (High Validity)**
  *   **Status:** **Follows.**
  *   **Why:** This is the only domain where "perfect prediction" is asymptotically approachable. If two AI systems share source code or have transparent architectures, they can model each other with high fidelity. The "Noisy Mugger" analysis is directly applicable here: how much compute does Agent A need to devote to modeling Agent B to secure cooperation? This is not philosophy; this is resource allocation.

  **2. Ordinary Human Commitment/Reputation (Overrated)**
  *   **Status:** **Mostly False / Redundant.**
  *   **Why:** Human reputation is handled perfectly well by Iterated Game Theory (Causal). I pay you back because I want you to lend to me *next time*. Counterfactual Mugging asks me to pay when there is *no next time* and the causal lever is broken. Applying Newcomb problems to human reputation is usually a category error. Humans are not logically transparent to each other; the "predictor" noise is too high for acausal links to form.

  **3. Acausal Trade Between Civilisations (Speculative)**
  *   **Status:** **Unproven / Fragile.**
  *   **Why:** This relies on the "Composition" question (Q4). It assumes civilizations can model each other's decision procedures across light-years without communication. Given the "Noisy Mugger" constraints, the computational cost of simulating another civilization to sufficient fidelity to establish a logical link is likely prohibitive. The signal-to-noise ratio is too low. It's a beautiful idea, but physically improbable.

  **4. Functional-Style Theories Being Exploitable (Nuanced)**
  *   **Status:** **True, but context-dependent.**
  *   **Why:** FDT agents *can* be blackmailed in XOR scenarios if they cannot distinguish logical dependence from correlation (Q3). However, a CDT agent leaves money on the table in Newcomb problems. The question isn't "which is exploitable?" but "in which environment is the exploitation cost lower?" Your error structure analysis (Q2) is the only way to answer this quantitatively.

  ### Summary of the Proposal

  1.  **Ignore the metaphysics.** Don't worry about whether the counterfactual is "real." Worry about whether the correlation is *statistically significant* given the model error.
  2.  **Model the Predictor.** Define the predictor as a function with a computational budget and an error distribution.
  3.  **Find the Threshold.** Calculate the minimum predictor fidelity required to make "Pay" the dominant strategy.
  4.  **Test the Implications.** If the threshold is 99.999%, then AI safety is the only application. If the threshold is 60%, then human coordination might be relevant.

  **Why this deserves your year:**
  Philosophy is currently drowning in words. It needs equations. You have spent 35 years learning how to write equations for systems that are partially observed, noisy, and bounded. That is exactly what a "real" decision theory looks like. If you can formalize the "Noisy Mugger," you aren't just solving a puzzle; you are building the bridge between decision theory and information theory.

  If you find that the whole thing dissolves under noise, you have performed a valuable service by burying a zombie idea. If you find it holds, you have discovered a robustness condition that the field currently lacks. Either way, it is time well spent.
