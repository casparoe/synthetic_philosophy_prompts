answer: |-
  Here is a menu of seven precise readings of the sentence, ordered from the deflationary to the metaphysical. I have kept your distinctions (belief vs. institution, robustness vs. path, descriptive vs. fiduciary) explicit in the analysis of each.

  ### 1. The Semantic Deflation
  **Thesis:** "Justice" is simply defined as *that which eventually prevails*.
  *   **Commitments:** Purely linguistic. No claim about the world, only about how we use the word "justice."
  *   **Plausibility:** Logically airtight, substantively empty.
  *   **Colleague's Conclusions:**
      *   **C1 (Look just in 50 years):** **Yes.** By definition, if they win, they were just.
      *   **C2 (Reason to act now):** **No.** This commits the naturalistic fallacy. That something *will* win tells you nothing about whether it *should* win.
  *   **Verdict:** Trivial. It protects the sentence from falsification but drains it of motivational force.

  ### 2. The Empirical Regularity
  **Thesis:** Measurable institutional arrangements (laws, rights, distributions) have shown a net positive trend toward a specific, objective conception of justice over centuries.
  *   **Commitments:** **Facts of the matter** (not just beliefs); **Counterfactually robust** (the trend persists despite setbacks); Justice is objective.
  *   **Plausibility:** Contested. Plausible regarding violence reduction (Pinker); implausible regarding structural inequality (Critical Theory).
  *   **Colleague's Conclusions:**
      *   **C1:** **Probable.** If the trend holds, future institutions will align with the students' demands.
      *   **C2:** **Weak Inductive Support.** Past performance is not a guarantee of future results, but it offers a heuristic reason to bet on the trend-continuers.
  *   **Verdict:** The standard liberal reading. Vulnerable to black swan events (e.g., fascism).

  ### 3. The Consensus Shift
  **Thesis:** Human *beliefs* about what counts as justice converge over time, even if the underlying facts do not improve.
  *   **Commitments:** **What people come to believe** (not institutions or facts); Justice is intersubjective.
  *   **Plausibility:** High. Moral circles do expand (Singer), even if material conditions stagnate.
  *   **Colleague's Conclusions:**
      *   **C1:** **Yes.** The students' demands will *look* just because future people will believe them to be so.
      *   **C2:** **Weak.** Aligning with future consensus is pragmatic, but not necessarily moral. It appeals to bandwagoning, not rightness.
  *   **Verdict:** Cynical but historically defensible. Confuses moral progress with moral fashion.

  ### 4. Narrative Survivorship (Hobby-Horse A)
  **Thesis:** The "arc" is an artifact of historiography; we select memories of successful movements and forget the failures, creating an illusion of a trend.
  *   **Commitments:** **Epistemic selection bias.** There is no vector, only a scatter plot we connect with dots.
  *   **Plausibility:** High. Historians acknowledge we tell stories about the abolitionists, not the successful slave revolts that were crushed and forgotten.
  *   **Colleague's Conclusions:**
      *   **C1:** **No.** The students might be the next forgotten failure.
      *   **C2:** **No.** Knowing the arc is a storybook illusion provides no reason to join the plot.
  *   **Verdict:** **FLAG: Genuine moral improvement may exist in the data, but there is no *tendency* whatsoever.** The "bend" is a retrospective mirage.

  ### 5. Retrospective Ratification (Hobby-Horse B)
  **Thesis:** Being "on the right side of history" is not a property detectable in the present, but one constituted by future generations validating the past struggle.
  *   **Commitments:** **Truth is time-relative.** The verdict *makes* the justice, it does not discover it.
  *   **Plausibility:** Philosophically rich (Hegelian/Pragmatist). Avoids the epistemic problem of knowing the future.
  *   **Colleague's Conclusions:**
      *   **C1:** **Yes.** If they win, the verdict constitutes the justice.
      *   **C2:** **Conditional.** It is a reason to act only if you desire *ratification*, not necessarily justice. You are betting that you can *force* the future to validate you.
  *   **Verdict:** **FLAG: Genuine moral improvement occurs, but there is no *tendency* beforehand.** The arc is bent by the verdict, not the other way around.

  ### 6. The Fiduciary Wager
  **Thesis:** The sentence is not descriptive but performative; asserting it is a tool to coordinate agency, making it true *because* we act as if it were.
  *   **Commitments:** **Fiduciary/Self-fulfilling.** The "bend" requires human muscle; the sentence is the lever.
  *   **Plausibility:** Pragmatically potent. Matches the usage of the quote by Dr. King (who used it to urge action, not predict inevitability).
  *   **Colleague's Conclusions:**
      *   **C1:** **Conditional.** They will look just *if* we do the work the sentence enjoins.
      *   **C2:** **Strong Yes.** This is the only reading that makes the future verdict a *current reason*. We back them to *ensure* the bend happens.
  *   **Verdict:** The most actionable reading. Converts a prediction into a command.

  ### 7. Cosmic Teleology
  **Thesis:** The universe possesses an intrinsic moral gravity or divine providence that pulls events toward justice regardless of human agency.
  *   **Commitments:** **Facts of the matter**; **Metaphysically robust**; Justice is woven into physics or theology.
  *   **Plausibility:** Low (in a secular seminar). Requires a theological or strong realist metaphysic.
  *   **Colleague's Conclusions:**
      *   **C1:** **Yes.** Inevitable.
      *   **C2:** **No.** If the universe bends automatically, signing the statement is superfluous. This invites quietism.
  *   **Verdict:** The "Wild" option. Comforting, but politically paralyzing.

  ***

  **Summary for the Board:**
  If your colleague wants **C1** (prediction) without **C2** (obligation), she is a **Teleologist (7)**.
  If she wants **C2** (obligation) without relying on **C1** (prediction), she is a **Fiduciary (6)**.
  If she relies on **Survivorship (4)** or **Ratification (5)**, she admits there is no pre-existing bend, only the one we construct or narrate later.
