      *   "Bends": Implies a force or direction, not necessarily a straight line.
      *   "Toward justice": The telos/end point.

  3.  **Brainstorming the Readings (Trivial to Wild):**

      *   *Idea 1 (Trivial/Definition):* Justice is just what wins eventually. (Tautology).
      *   *Idea 2 (Empirical/Descriptive):* History shows a net increase in justice metrics. (Pinkier's Enlightenment Now style).
      *   *Idea 3 (Psychological/Belief):* People *come to believe* things are more just, even if they aren't.
      *   *Idea 4 (Fiduciary/Performative):* Saying it makes it happen (Self-fulfilling prophecy).
      *   *Idea 5 (The User's Hobby-Horses):* Retrospective Ratification & Narrative Survivorship.
      *   *Idea 6 (Metaphysical/Teleological):* The universe has a moral gravity (King/Parker origin).

  4.  **Drafting the Readings (incorporating constraints):**

      *   *Reading 1: The Tautology.* "Justice" is defined as "what eventually prevails."
          *   Commitments: Semantic.
