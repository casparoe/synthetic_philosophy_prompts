answer: |-
  This is a fantastic piece of philosophical detective work. Your study group has correctly identified a tension in Du Bois's "Criteria of Negro Art," but you are right to feel that the argument "proves too much." It turns Du Bois into a crude Soviet-style realist who would banish anything that doesn't explicitly rally the troops.

  The exit is indeed available, and it lies in **dropping (and radically revising) Step (2).**

  Here is the breakdown of where the logic slides, what it costs you to fix it, and how to keep the "punch" of Du Bois's view without collapsing into absurdity.

  ### 1. The Diagnostic: The Slide in Step (2)
  Your group's argument hinges on this move:
  > *(2) If art is essentially propaganda, then what makes something good art just is how well it advances that purpose.*

  This is a **category mistake**. It conflates an *ontological/functional claim* (what art *is* or *does*) with a *monistic evaluative claim* (what makes art *good*).

  **The Analogy:**
  Imagine someone argues:
  1.  All food is fuel for the body.
  2.  Therefore, the "goodness" of food is determined *solely* by its caloric efficiency.
  3.  Therefore, a sugar cube is "better food" than a complex, delicious, nutritious meal because it provides faster energy.

  This is obviously wrong. Even if food *is* fuel (functionally), its value is multidimensional (taste, texture, culture, nutrition). You can judge food by how well it fuels you, but that isn't the *only* metric of its quality.

  **Applied to Du Bois:**
  Du Bois claims art *functions* socially (it shapes perception, hence "propaganda"). But he does not claim that *political efficacy* is the sole metric of aesthetic value. For Du Bois, **Beauty is the mechanism by which Propaganda works.**

  If you drop Step (2), the contradiction with Keats disappears. Du Bois can praise Keats because Keats achieves *Beauty*, and for Du Bois, Beauty is a necessary condition for effective Propaganda. A "technically sloppy poster" (Step 3) might be good *agitation*, but for Du Bois, it fails as *Art* because it lacks the Beauty required to make the Truth persuasive.

  ### 2. The Hidden Slide in Step (1)
  There is a second, subtler slide in your group's premise (1) regarding the definition of **Propaganda**.

  Your group implies: *Propaganda = Explicit Political Messaging.*
  Du Bois implies: *Propaganda = The inevitable social effect of representation.*

  When Du Bois says, "all Art is propaganda," he means that art is never neutral. It always presents a view of the world.
  *   A poem about flowers presents a world where beauty exists apart from struggle.
  *   A poster about voting presents a world where civic duty is paramount.

  Du Bois praised Keats not because Keats was doing *racial* propaganda, but because Keats was doing *human* propaganda for Truth and Beauty. Du Bois's specific demand for **Negro Art** is that it must correct the *false* propaganda of racism. He isn't saying "Art must be political"; he is saying "Since art is inevitably political (in the broad sense), Black artists must seize that power to tell the Truth about Black life."

  ### 3. What Does It Cost You to Reject (2)?
  You asked: *If I reject (2) do I lose the whole punch of Du Bois's view?*

  **The Cost:**
  You lose the ability to say "Political utility trumps aesthetic quality." You cannot argue that a clumsy, didactic pamphlet is "better art" than a masterpiece simply because the pamphlet has a clearer message. You have to admit that aesthetic form matters independently of immediate political outcome.

  **The Gain (Keeping the Punch):**
  Actually, rejecting (2) makes Du Bois's argument **stronger**, not weaker.
  *   **The Crude View (Step 2):** Black artists should make slogans. (Easy to dismiss, aesthetically bankrupt).
  *   **The Du Boisian View (Revised):** Because art inevitably shapes the world (propaganda), Black artists have a moral responsibility to make work so **beautiful** and **true** that it forces the white world to recognize their humanity.

  Du Bois writes: *"I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side and the other is stripped and silent."*

  He is not asking for bad art. He is asking for **weaponized beauty.** He wants the "Ode on a Grecian Urn" level of craft applied to the Black experience. If you keep Step (2), you allow bad art. If you drop Step (2), you demand *excellent* art that serves a purpose. That is a much harder, more biting requirement.

  ### 4. How to Reformulate the Argument
  To hang on to Du Bois's point without the contradiction, revise your group's logic like this:

  1.  **Premise:** All art shapes social perception (is "propaganda" in Du Bois's sense).
  2.  **Revised Premise:** Good art requires both Beauty (form) and Truth (content). Propaganda without Beauty is mere rhetoric; Beauty without Truth is decoration.
  3.  **Implication:** A technically sloppy poster is *effective agitation* but *poor art*. A perfect poem about flowers is *good art* but *silent on racial truth*.
  4.  **Du Bois's Demand:** Black Art must strive to be *both*. It must use the highest aesthetic standards (like Keats) to convey the Truth of Black life.
  5.  **Resolution:** Du Bois praising Keats is consistent. Keats achieved the "Beauty" side of the equation. Du Bois wants Black art to achieve that level of Beauty *in the service of* Racial Truth.

  ### Summary
  *   **Drop Step (2).** It reduces a multidimensional value (Art) to a single metric (Political Utility).
  *   **The Mistake:** Treating "is propaganda" as "value equals propaganda efficacy."
  *   **The Cost:** You can no longer justify bad art just because it has a good message.
  *   **The Benefit:** You save Du Bois from the charge of hypocrisy regarding Keats, and you restore the high aesthetic standard that Du Bois actually demanded.

  Du Bois isn't saying "Politics over Beauty." He is saying "Beauty is the only way Politics lasts." That is the punch you want to keep.
