answer: |-
  **Project Title:** Dissociating Timing and Content in Volitional Action: A Pilot Study

  **Principal Investigator:** [Your Name]
  **Department:** Philosophy
  **Collaborators:** Motor-Control Laboratory (Department of Psychology/Neuroscience)
  **Duration:** 10 Months
  **Request:** Support for one Research Assistant and subject payments

  **Research Question**
  Standard interpretations of Libet-style experiments argue that because neural precursors to movement (the Readiness Potential) precede the subject's reported conscious intention, conscious will is causally inert. This project challenges that inference. The central question is not merely *when* the brain prepares to move, but *what* is prepared at that time. Does neural activity specify the specific content of the decision (e.g., left hand vs. right hand) prior to conscious awareness, or does early neural activity represent only a general readiness to act, with the specific content settled only after awareness arises? If the content is not fixed until the moment of conscious awareness, the timing discrepancy alone does not threaten agency.

  **Background and Significance**
  The standard neuroscientific challenge to free will relies on conflating the timing of an urge with the fixing of a decision's content. An early neural signal could indicate a non-specific preparation to act generally, without determining *which* action will be taken. If the specific choice is settled later, concurrent with conscious awareness, the causal efficacy of consciousness remains intact despite the early Readiness Potential. Furthermore, the common rebuttal—that subjects retain a "free won't" veto power—merely relocates the problem. If the veto itself is triggered by unconscious processes, the regress continues. This project seeks to empirically separate timing from content-fixing and philosophically resolve the veto regress rather than gesturing at it.

  **Experimental Design**
  We will collaborate with the on-campus Motor-Control Lab to run a modified Libet task. Subjects will watch a rotating clock and report the moment they consciously decide to move (W-time). They will perform spontaneous button presses with either the left or right hand.
  1.  **Recording:** We will use EEG and EMG to record neural and muscular activity.
  2.  **Decoding Analysis:** Unlike standard Libet analyses which average amplitude, we will use single-trial decoding to determine when information about the *specific choice* (left vs. right) becomes available in the neural signal.
  3.  **Comparison:** We will compare the timing of content-specific neural decoding against the reported W-time.
  4.  **Veto Task:** A subset of trials will require subjects to initiate but then veto the movement at the last moment, allowing us to track the neural signature of inhibition relative to conscious awareness.

  **Philosophical Component**
  While the RA manages data collection, the PI will develop the theoretical framework for interpreting the results. This involves two tasks. First, constructing a model of agency that accommodates early non-specific readiness without conceding determinism. Second, rigorously analyzing the "veto" argument. If the data shows early content fixing, the philosophical work will determine whether this necessitates a revision of our concept of intention or merely a revision of the timeline. If the data shows late content fixing, the work will articulate why this preserves agency despite the early general readiness potential. The goal is to produce a unified account that does not rely on the homunculus fallacy often found in veto defenses.

  **Timeline (10 Months)**
  *   **Months 1–2:** Finalize protocol with Motor-Control Lab; submit IRB application; hire and train RA.
  *   **Months 3–6:** Data collection. RA manages subject recruitment and runs experimental sessions.
  *   **Month 7:** Data preprocessing and decoding analysis conducted by lab collaborators and RA.
  *   **Month 8:** PI integrates empirical results with philosophical analysis; draft manuscript.
  *   **Months 9–10:** Revision, internal review, and preparation of final deliverables.

  **Possible Outcomes**
  1.  **Content Early:** Neural decoding predicts left/right choice significantly before W-time. This supports the standard skepticism regarding free will.
  2.  **Content Late:** Neural decoding predicts choice only at or after W-time, despite early general readiness. This supports the view that consciousness plays a role in specifying action content.
  3.  **Null Result:** No reliable decoding of content is possible prior to movement. This constrains the methodology but suggests content is not neurally distinct early on.
  4.  **Project Failure:** Failure is distinct from a null result. The project fails if the signal-to-noise ratio is too low to distinguish general readiness from specific content, rendering the data uninterpretable. It also fails if we cannot recruit enough subjects to achieve minimal statistical power for the decoding analysis.

  **Deliverables**
  For the committee, specifically the non-philosopher members, the primary deliverable will be a joint technical report co-authored with the Motor-Control Lab. This document will detail the empirical findings regarding the timing of content-specific neural signals relative to reported awareness. It will include a plain-language summary explaining whether the data suggests the brain decides "which hand" before the person knows it. Additionally, a draft manuscript suitable for a interdisciplinary journal will be prepared, outlining the philosophical implications of the empirical data.

  **Limitations and Risks**
  An honest assessment suggests this scope is aggressive for a ten-month window with a single RA. Decoding specific motor content from EEG is technically demanding and often yields noisy data; if the decoding accuracy remains at chance levels, we cannot distinguish between "content not fixed" and "methodological insensitivity." Furthermore, subject recruitment for high-density EEG studies often lags behind schedule, potentially compressing the analysis phase. Finally, integrating complex empirical data with rigorous philosophical argumentation in ten months risks producing a report that is either empirically thin or philosophically superficial. This pilot is designed to test feasibility, but there is a significant risk that we will establish the protocol without achieving a definitive empirical conclusion.
