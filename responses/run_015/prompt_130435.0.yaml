          *   APC (Age-Period-Cohort) problem is real and hard.
          *   Boundaries aren't magic (1980 vs. 1981 isn't biological).
          *   Labels have feedback effects (self-fulfilling prophecy).
          *   Boomers are unique due to demographics (the spike).
          *   "Real" is ambiguous (causal utility vs. natural kind).

  3.  **Drafting the Agreed Claims (Numbered Section):**
      *   *Constraint 1 (APC):* Need to explain the identification problem simply. Age = time since birth. Period = current year. Cohort = birth year. Age + Cohort = Period. You can't separate them without assumptions.
      *   *Constraint 2 (Sharpness):* No one thinks Jan 1, 1981 vs. Dec 31, 1980 is a biological switch.
      *   *Constraint 3 (Social Work):* Even if fake, people act like they are real (Hacking's looping effects).
