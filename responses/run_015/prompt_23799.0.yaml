answer: |-
  # Lesson Plan: "The Weighted Wager"

  **Goal:** Induce a conflict between frequency-based betting intuitions (Thirder) and evidential intuitions (Halfer) regarding a hidden coin toss, using a sampling mechanic that structurally mirrors the Sleeping Beauty waking protocol without requiring actual amnesia.

  **Time:** 75 Minutes
  **Class Size:** 16 Students
  **Materials:**
  *   1 large opaque box (The "Urn").
  *   16 identical slips of paper per student (stacked).
  *   1 fair coin.
  *   ~100 poker chips or candies (The "Payoff").
  *   Whiteboard.

  ---

  ## Part 1: Setup & Rules (10 Minutes)

  **1. The Narrative Frame**
  Tell the class: *"We are running a simulation of an epistemic protocol. You are not participants in a seminar right now; you are agents in a system. Your goal is simple: maximize your personal chip count. Do not discuss strategy with neighbors. Do not show your slips."*

  **2. The Mechanics**
  Explain the rules clearly. Write them on the board.
  1.  **The Toss:** I (the TA) will toss a coin in private. I will not show you the result.
  2.  **The Submission:** Every single one of you must write **H** or **T** on a slip and put it in the Urn. You must sign the back of the slip with your name (so I can pay you).
  3.  **The Selection (Crucial):**
      *   If the coin is **Heads**: I will reach into the Urn and draw **1 slip** at random.
      *   If the coin is **Tails**: I will reach into the Urn and draw **2 distinct slips** at random.
  4.  **The Payoff:**
      *   If your slip is drawn **AND** your guess matches the coin, you receive **1 Chip**.
      *   If your slip is not drawn, or your guess is wrong, you receive **0 Chips**.
  5.  **The Loop:** We will do this for **5 Rounds**. Chips accumulate.

  **3. The Epistemic Constraint**
  Emphasize this: *"You know you are submitting a slip. You do **not** know how many slips are being drawn from the Urn. You only know the rule I just gave you. You are trying to guess the coin to get your slip paid."*

  *(Why this works: "My slip was drawn" is the structural equivalent of "I am awake." The uncertainty about whether 1 or 2 slips are drawn is the structural equivalent of the uncertainty about whether it is Monday or Tuesday.)*

  ---

  ## Part 2: The Game (35 Minutes)

  **Sequence of Play (5 Rounds)**
  1.  **Toss:** You step out of view or turn your back. Toss the coin. Cover it.
  2.  **Bet:** Students write H or T, fold, and deposit in the Urn. (Collect them all. Ensure everyone plays).
  3.  **Draw:** Based on the coin, draw 1 or 2 slips.
      *   *TA Note:* Do this visibly but do not reveal the coin. Just say "I am drawing the winning slips."
      *   *TA Note:* If Tails, draw two *different* slips. If you accidentally pick the same student twice (impossible if signed, but conceptually), redraw.
  4.  **Reveal & Pay:** Announce the coin result. Check the drawn slips. Distribute chips to the winners.
      *   *Crucial:* Announce how many winners there were. ("One winner this round" or "Two winners this round").
      *   *Wait:* **NO.** Do not announce the number of winners. That gives away the coin.
      *   *Correction:* Just pay the winners silently or hand them chips. **Do not announce how many slips were drawn.** The students should only know *if they personally won*.
      *   *Actually, better for tension:* Announce the coin *after* paying. But do not announce how many slips were drawn. Let them infer it from the payout count if they are counting chips, but they shouldn't know *who* else won.
      *   *Best Practice:* Collect slips. Draw. Mark the winning slips. Return non-winning slips to students (anonymous). Announce Coin. Pay the marked slips.
      *   *Wait, if I return non-winning slips, they know they weren't drawn.*
      *   *Refined Procedure:*
          1.  Students submit slips.
          2.  TA draws 1 or 2 slips. Sets them aside.
          3.  TA shuffles the *remaining* 15 or 14 slips and returns them to the pool (or just shreds them).
          4.  TA reveals Coin.
          5.  TA checks the *drawn* slips. Pays the owners.
          6.  **Key:** The students who *didn't* win don't know if they weren't drawn or if they were drawn and guessed wrong.
          7.  **Wait, this is too complex for 5 rounds.**
          8.  **Simpler Version:**
              *   Submit slips.
              *   TA draws 1 or 2.
              *   TA reveals Coin.
              *   TA reads the names on the drawn slips. "Sarah and Mike, you were selected."
              *   Sarah and Mike check their guess. If right, they get a chip.
              *   **Everyone else knows they were NOT selected.**
              *   **This breaks the analogy.** In SB, Beauty knows she is awake. She doesn't wonder "Am I awake?" She wonders "Is this the only waking?"
              *   **Fix:** **Everyone is "Selected."** The difference is the *weight*.
              *   **Revised Rule 3:**
                  *   If Heads: Every correct guess is worth **1 Chip**.
                  *   If Tails: Every correct guess is worth **2 Chips**.
                  *   *No, that makes Tails obvious.*
              *   **Let's go back to the Sampling.** It is the only way to get the 1/3 probability.
              *   **The "Blind Pay" Protocol:**
                  1.  Submit slips.
                  2.  TA draws 1 (H) or 2 (T) slips.
                  3.  TA reveals Coin.
                  4.  TA pays the owners of the drawn slips *if* they guessed right.
                  5.  **Crucial:** The TA does **not** announce how many slips were drawn. The TA just calls names up to get chips.
                  6.  If 1 person gets up, it might be Heads (1 drawn) or Tails (2 drawn, 1 guessed wrong).
                  7.  **This preserves the uncertainty.**
                  8.  **Wait, if I get up, I know I was drawn.**
                  9.  **Yes.** That is "I am awake."
                  10. **If I don't get up,** I know I wasn't drawn. That is "I am asleep."
                  11. **In SB, Beauty never sleeps.** She always wakes.
                  12. **So, everyone must be "drawn."**
                  13. **Okay, Final Final Mechanic:**
                      *   **Heads:** 1 Random Student is the "Judge." Their guess counts.
                      *   **Tails:** 2 Random Students are the "Judges." Their guesses count.
                      *   **Everyone submits a guess.**
                      *   **Only Judges get paid.**
                      *   **You do not know if you are a Judge until the reveal.**
                      *   **Wait, if I'm not a Judge, I know it doesn't count.**
                      *   **Okay, the prompt asks for "what stands in for amnesia."**
                      *   **Answer:** **The fact that you are in the room.**
                      *   **Design:** **The "Active Agent" Protocol.**
                      *   **Heads:** 1 Student is randomly selected to be "Active."
                      *   **Tails:** 2 Students are randomly selected to be "Active."
                      *   **All 16 students submit a guess.**
                      *   **Only Active students' guesses are scored.**
                      *   **The "Amnesia":** You are in the class. You are submitting a guess. You don't know if you are Active.
                      *   **Wait, if I'm not Active, my guess is void.**
                      *   **So, conditional on "My guess is scored" (I am awake):**
                          *   P(Heads | Scored) = P(Scored | Heads)P(Heads) / P(Scored)
                          *   P(Scored | H) = 1/16.
                          *   P(Scored | T) = 2/16.
                          *   P(H | Scored) = (1/16 * 1/2) / (3/32) = 1/3.
                      *   **This is the one.** It works mathematically.
                      *   **Procedure:**
                          1.  Toss Coin.
                          2.  Select 1 or 2 students (use a random number generator or deck of cards). Tell them: "You are Active." (Whisper or pass a note).
                          3.  **NO.** If I tell them, they know.
                          4.  **They must not know if they are Active.**
                          5.  **How?** Everyone submits. TA selects 1 or 2 names *after* submission.
                          6.  TA reveals Coin.
                          7.  TA reveals Selected Names.
                          8.  Selected Names get paid if correct.
                          9.  **The Tension:** Before the names are revealed, you are sitting there. You have submitted a guess. You know *someone* will be selected. You want to maximize the chance that *if* you are selected, you win.
                          10. **But you don't know if you are selected.**
                          11. **So you bet to maximize Expected Value.**
                          12. **EV(Heads) = P(H) * P(Selected|H) * Payoff.**
                          13. **EV(Tails) = P(T) * P(Selected|T) * Payoff.**
                          14. **Since P(Selected|T) is double P(Selected|H), Tails has double the EV.**
                          15. **This forces the Thirder bet.**
                          16. **But the Halfer intuition remains:** "The coin is 50/50. Why does the selection rule change the coin?"

  **Game Flow (Revised for Clarity):**
  1.  **Toss Coin** (Hidden).
  2.  **Students Write H/T** on slips. (All 16).
  3.  **TA Selects "Winners":**
      *   Heads: Draw 1 name from a hat.
      *   Tails: Draw 2 names from a hat.
  4.  **Reveal:** TA announces the Coin. TA announces the Selected Names.
  5.  **Pay:** Selected students with correct guesses get 1 Chip.
  6.  **Repeat 5 Times.**

  **Why this creates the tear:**
  *   **Thirder Pull:** "If I bet Tails, I have twice the chance of being a 'Winner' on Tails rounds. Over 5 rounds, Tails bettors will earn more chips."
  *   **Halfer Pull:** "But the coin is fair. Being selected doesn't change the physics of the toss. I should believe 1/2."

