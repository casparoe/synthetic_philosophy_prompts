  ## Part 3: The Debrief (30 Minutes)

  **1. The Data (5 Mins)**
  *   Tally the chips. Did the "Tails-bettors" (those who consistently bet T) outperform "Heads-bettors"? (They should have, by roughly a factor of 2 in expected value per round).
  *   Ask: *"Who bet Tails every time? Who bet Heads every time? Who mixed?"*
  *   Ask the Heads-bettors: *"Why? You lost chips."* (They will say: "The coin is 50/50.")
  *   Ask the Tails-bettors: *"Why? You knew the coin was 50/50."* (They will say: "I was more likely to get paid.")

  **2. Mapping the Analogy (15 Mins)**
  Draw the table on the board.

  | Sleeping Beauty | The Weighted Wager |
  | :--- | :--- |
  | **The Coin Toss** | **The TA's Hidden Coin** |
  | **Heads** | **Heads (1 Name Drawn)** |
  | **Tails** | **Tails (2 Names Drawn)** |
  | **Beauty Waking Up** | **Your Name Being Drawn** |
  | **"Is this Monday or Tuesday?"** | **"Am I the only name drawn, or one of two?"** |
  | **Beauty's Memory Loss** | **Your Ignorance of Selection Count** |

  *   **Key Question:** *"When your name was drawn (you woke up), did you learn anything about the coin?"*
      *   **Halfer:** "No. The coin was tossed before names were drawn."
      *   **Thirder:** "Yes. You learned that you are in the sample. The sample is larger on Tails. Therefore, you are more likely to be in a Tails-world."
  *   **Self-Locating Belief:** Explain that the new information isn't about the *coin* (world-centered), it's about *you* (centered). You learned "I am one of the selected." Since there are more selected slots on Tails, that evidence favors Tails.

  **3. The Breakdown (10 Mins)**
  *   **Predictable Breaks:**
      *   *Collusion:* Students might try to signal names. **Fix:** Tell them names are drawn from a sealed box after slips are in.
      *   *Hedging:* "Can I submit two slips?" **Fix:** One slip per person.
      *   *The "So What?" Objection:* "I just bet Tails for the money, I still *believe* it's 50/50." **Push:** "If you truly believed 50/50, you would be indifferent to the betting odds. Your willingness to bet Tails reveals your credence is actually 1/3. Belief *is* betting disposition."
  *   **What This Simulation Misses (The "Honesty" Clause):**
      *   **Identity:** In the game, if Tails, *two different people* get chips. In Sleeping Beauty, *the same person* wakes twice.
      *   **Why it matters:** The Halfer can argue, "Those two Tails-wakings aren't both *me* in the same way. One is Monday-me, one is Tuesday-me. They are distinct temporal slices."
      *   **The Gap:** This game simulates the *frequency* (Thirder) perfectly but fails to simulate the *personal identity* (Halfer). The Halfer argument relies on the idea that Tuesday-Beauty is not a new "chance" for Beauty, but a continuation. In our game, Mike and Sarah are definitely different people.
      *   **Your Job:** You must tell them: *"The game proves the betting odds are 1/3. The philosophical fight is whether 'betting odds' equal 'credence' when personal identity is split. Elga says yes. Lewis says no. Next week, we read why."*

  ---

  ## Predictable Failure Points & Mitigation

  1.  **The "Counting" Loophole:**
      *   *Risk:* If I announce "Mike and Sarah won," students know it was Tails.
      *   *Fix:* **Do not announce the winners publicly.** Hand the chips to the winners silently at the end of the round. Or, collect the slips, mark the winners, and return the slips. Only the *individual* knows if they won.
      *   *Correction:* If they don't know who else won, they can't update on "How many winners." They only update on "I won."
      *   *Wait, if I only update on "I won," the math holds.*
      *   *P(H | I Won) = 1/3.*
      *   *So, keep winner announcements private.* Hand chips directly to the student's desk.

  2.  **The "Bored Non-Winner" Problem:**
      *   *Risk:* 14 students do nothing while 2 win.
      *   *Fix:* Emphasize that *everyone* is potentially a winner every round. The selection is random. Everyone stays engaged hoping their name is called.

  3.  **Time Management:**
      *   *Risk:* Drawing names takes too long.
      *   *Fix:* Pre-write names on cards. Have a student shuffle and draw. 5 rounds is strict. Use a timer.

  ## Why This Design?
  I chose the **"Random Selection from Population"** model over the "Weighted Payoff" model because it isolates the *probability update* from the *utility function*. In a weighted payoff game, students can say "I believe 1/2, but the payout is better on Tails." In this selection game, the *probability of being the agent who gets paid* shifts. This forces them to confront the self-locating evidence: "I am here. 'Here' is more common on Tails." It creates the Thirder intuition organically through frequency, while the fair coin toss preserves the Halfer intuition about the physical chance.

  ## What You Must Supply in the Debrief
  The game cannot simulate **Amnesia**. In the game, if Mike is selected on "Monday" (Round 1) and "Tuesday" (Round 2), he knows it's a new round. In SB, Beauty cannot distinguish the wakings.
  *   **Your Line:** *"In our game, you knew which round it was. Beauty doesn't. That means she can't use 'round counting' to rule out Tails. She is stuck in the indexical uncertainty we simulated with the random draw. She knows 'I am awake,' just like you knew 'I am in the class.' She doesn't know 'This is the only waking,' just like you didn't know 'I am the only name drawn.'"*

  This plan gives them the visceral "money pump" feeling of the Thirder argument while leaving the Halfer's "no new info" claim intact enough to be debated, setting the stage perfectly for the readings.
