answer: |-
  The practices collectively presuppose that standing is not a unified moral status derived from personal virtue but a functional authorization tied to the integrity of the specific normative relationship or institution being invoked.

  Your intuition that the usual framing is too coarse is correct because it assumes blame is a single kind of speech act with a single set of felicity conditions, whereas the practices you describe reveal that what we call standing is actually a cluster of distinct permissions distributed across different social and institutional roles. When you look closely at the equitable clean-hands rule, you are not seeing a theory of moral hypocrisy so much as a doctrine of relational integrity, where the court refuses to assist a plaintiff whose claim arises from their own misconduct because to do so would make the court complicit in the very wrong it is asked to remedy. This is why the misconduct must be transaction-specific; the court is not judging the plaintiff's soul but protecting the purity of its own process and the reciprocity of the specific bargain between the parties. Move to tort law and the purpose shifts from relational purity to loss allocation, so the plaintiff's fault becomes a metric for dividing the bill rather than a bar to entry, which explains why comparative negligence discounts recovery rather than denying standing entirely. In criminal law, the purpose shifts again to the vindication of public norms, meaning the complainant's moral status is irrelevant to the defendant's guilt because the wrong is conceived as against the state or the community rather than against the accuser personally. What looks like inconsistency from the perspective of a unified moral theory of hypocrisy is actually consistency from the perspective of institutional function, where the conditions on standing track the specific good that the institution is designed to protect.

  This functional view explains why the international sphere behaves differently still, because diplomatic shaming is not a judicial determination of liability but a political contest for normative authority. When a state commits a *tu quoque* argument, it is not denying the legal liability of the accused, which is why the tribunals reject it as a defense, but rather challenging the political legitimacy of the accuser to lead the normative order. The fact that the hypocritical state's standing is lowered in diplomatic argument while its liability remains intact shows that standing here is not about the truth of the accusation but about the efficacy of the address, which is why the practice feels unstable; it is negotiating the boundary between legal universalism and political realism. This suggests that the backward-looking rule you identify in equity and ordinary moral address does not strictly presuppose a complicity view of standing so much as it serves as a pragmatic proxy for it, because conduct is evidentially accessible while disposition is not. If you were to replace the backward-looking test with your would-have proviso, you would fundamentally alter the epistemic position of the tribunal and the nature of the norm being enforced, shifting the inquiry from what was done to who the agent is. This would require tribunals to engage in counterfactual speculation about the agent's character under stress, which is not only evidentially fraught but also intrusive in a way that liberal legal systems generally resist, as it punishes disposition rather than act.

  Furthermore, adopting the would-have proviso would collapse the distinction between temptation and violation, meaning that the person who refrained only because they lacked opportunity would lose standing alongside the person who violated the norm, which might seem morally consistent but would practically disarm many useful forms of moral address. Consider the recovering addict who warns others against substance abuse; under a strict dispositional view, their past failure might disqualify them, yet under a backward-looking conduct rule focused on current status, their advice carries weight because it is grounded in experience rather than purity. The practice of allowing advice without standing to blame is one of the key distinctions your chapter should highlight, because we routinely accept warnings, predictions, and counsel from those who lack the standing to resent or sanction. If the would-have proviso were implemented, the recovering addict might lose the standing to advise if the tribunal deemed their disposition still fragile, which would sever the link between experience and authority that makes such advice valuable. This reveals that the backward-looking rule is not merely an accident of institutional history but a commitment to stabilizing norms around public acts rather than private states of mind, ensuring that the boundaries of standing remain clear enough to be navigated by agents who need to know where they stand.

  The asymmetry you note regarding capacity and opportunity further supports the functional view over a unified moral view, because in the private sphere we care about the will while in the international sphere we care about the enforcement of norms regardless of the enforcer's capacity to violate them. When a small state shames a great power for human rights violations it lacks the capacity to commit, we do not treat this as hypocrisy because the function of the shaming is to build a coalition for norm enforcement, not to assert moral superiority based on personal restraint. In private moral address, however, if I blame you for a wrong I would have committed had I the chance, my blame is discounted because the function of private blame is to regulate reciprocal relationships where mutual restraint is the expectation. This means the practice is not tracking a single property of standing but rather distributing different types of standing according to the context: standing to resent is a natural emotion that requires no authorization, standing to blame is a moral address that requires some degree of compliance, standing to advise requires only epistemic access, and standing to sanction requires institutional role. The literature becomes hard to read precisely because it conflates these distinct capacities, treating the right to resent as identical to the right to impose sanctions, when in fact one can resent without standing to sanction and sanction without standing to resent.

  If you were to replace the backward-looking test with the would-have proviso in ordinary moral address, you would find that the blamer who has never been tempted loses standing alongside the blamer who failed through bad luck, which would paradoxically silence those who are most stable in their compliance because they cannot prove they would have remained compliant under temptation. This would create a perverse incentive structure where agents might need to demonstrate proximity to vice to prove their virtue, undermining the very norms the standing rule is meant to protect. The backward-looking rule avoids this by focusing on the actual history of the relationship or the act, which allows the community to rely on stable evidence rather than speculative psychology. Consequently, the practices do not rule out the dispositional view theoretically, but they reject it pragmatically because it makes the conditions of standing too uncertain to serve their coordinating function. The accident of institutional history lies not in the variance between equity and tort, which is functional, but in the specific thresholds chosen for what counts as connected misconduct, which could reasonably be drawn differently without collapsing the theory. Ultimately, the cluster of practices holds together not because they share a single metaphysical account of hypocrisy, but because they share a commitment to preserving the integrity of the specific normative game being played, whether that game is equitable relief, loss allocation, public vindication, or diplomatic negotiation. Your chapter will be strongest if it argues that the incoherence critics find in our practices is actually a sophisticated differentiation of roles, and that attempting to unify them under a single theory of standing would require sacrificing the distinct goods that each practice is designed to secure.
