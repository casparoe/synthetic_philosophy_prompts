      *   *Attitudinal Hedonism:* This is the best technical fix for (3). It allows us to say there *is* a shared feature (the pro-attitude), defeating (3) directly, without necessarily abandoning (1) entirely (though it redefines the feature). Actually, it's better to attack (1) primarily, then offer Attitudinal Hedonism as a way to satisfy (3) *if* one insists on a feature.
