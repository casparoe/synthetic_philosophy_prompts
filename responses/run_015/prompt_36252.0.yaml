      *   **Premise (3):** This claims no such feature exists for pleasure. This is a standard philosophical objection (the "heterogeneity of pleasure").
      *   **Premise (2):** This is about falsifiability/substantiveness. If "pleasure" = "whatever is pursued," then "people pursue pleasure" is a tautology.
