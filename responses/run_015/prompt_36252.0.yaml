          *   *Distinction:* This separates Hedonism from Desire Satisfaction. I can desire things I don't take pleasure in (duty), and take pleasure in things I didn't desire (surprise sunbeam). This saves (2) – the theory can be false (maybe knowledge is good without pleasure).
