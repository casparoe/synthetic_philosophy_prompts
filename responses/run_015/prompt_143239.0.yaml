answer: |-
  **Title:** Causal Cascades: A Reliability Engineering Model for Non-Human Agency in History

  **Proposal**

  Historians of environment and disease currently oscillate between two unsatisfying frames when treating non-human forces. In traditional narratives, germs, climate shifts, and volcanic eruptions appear as mere background conditions, the stage upon which human drama unfolds. In corrective narratives, these forces are elevated to full-blown "historical actors," often imbued with a metaphorical agency that implies intentionality. Neither framing captures the specific kind of causal dependency I encounter in distributed-systems reliability engineering. In my field, a node failure cascades through a network without anyone attributing intention to the server. The node is not an agent, but it is not merely background; it is a critical dependency. This proposal asks a precise question: Can a counterfactual-dependency model, borrowed from reliability engineering, clarify what it means to call a non-human force an "actor" without falling into environmental determinism?

  Existing debates in environmental history and the philosophy of agency leave this question open because they remain trapped in a binary of intention versus inertness. Environmental historians, seeking to correct anthropocentrism, often grant nature "agency" to highlight its power to disrupt human plans. However, philosophers of history worry that diluting "agency" to mean mere "causation" collapses the distinction between a volcano and a general. If everything that causes an effect is an actor, the concept loses its analytical sharpness. Conversely, if only intentional beings are actors, we cannot adequately describe how a virus reshapes geopolitics. The current literature lacks a vocabulary for structural leverage that does not rely on psychological intent. Reliability engineering offers this missing vocabulary through the concept of counterfactual dependency: System B fails if and only if Component A fails, regardless of Component A's "will."

  To test this, I will apply the model to the 1918 influenza pandemic. Traditional narratives focus either on viral mutation (biological determinism) or troop movements (human agency). Using a reliability model, I will treat transportation hubs and military camps as network nodes and the virus as a payload triggering node failure (immunity collapse). The method involves mapping counterfactuals standard in historical analysis but structured like engineering fault trees. I will ask: If specific nodes (ports, rail hubs) had isolated successfully, would the cascade have proceeded? This shifts focus from "what the virus wanted" to "where the network was brittle." I will not invent archival sources but rely on established historical consensus regarding global shipping routes and mobilization schedules to construct the dependency map.

  A successful conceptual clarification would look like a functional definition of "historical actor" that relies on systemic leverage rather than intention. It would allow us to say the virus was an actor because it triggered unavoidable cascades in specific network configurations, without claiming it had goals. Crucially, it must avoid determinism by highlighting points where human intervention could have altered the dependency chain. Success means historians can discuss non-human forces as active constraints without resorting to metaphorical animism. We would gain a vocabulary for "brittleness" and "redundancy" in historical systems, allowing for a more precise analysis of why some societies collapse under environmental stress while others absorb it.

  Failure would occur if the model reduces human beings to passive components, indistinguishable from servers. If the engineering analogy erases the capacity for human adaptation and mitigation, it merely replicates the determinism it seeks to avoid. It also fails if the explanation requires too much technical jargon to be intelligible to historians, resulting in a communication breakdown rather than interdisciplinary synthesis. Finally, the model fails if it cannot distinguish between a significant cause and a trivial one; if every dependency is an "actor," we have solved nothing.

  The feasibility assessment for a single 20-minute presentation is cautious. Explaining counterfactual-dependency theory and distributed systems architecture while applying it to historical narrative is ambitious. Twenty minutes is extremely tight for this depth. Success depends on stripping the engineering concepts to their logical core, avoiding code or complex diagrams. I must treat the engineering model as a metaphorical heuristic rather than a rigorous formal proof. It is feasible only if I limit the case study to a high-level overview of the network structure rather than granular data. The primary risk is translation loss; if the philosophical implications are not drawn explicitly, the talk will appear to be a technical analogy without historical substance. However, if the core distinction between "intentional agency" and "structural dependency" lands, it offers a productive new avenue for seminar discussion.

