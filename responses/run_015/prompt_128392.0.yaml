answer: |-
  ### Instructor's Note: The Logical Space
  Before handing this out, here is the map of the territory you are asking them to navigate. We are not sorting by "isms" (students don't know them yet); we are sorting by *intuitions about constraints*.

  The tree below uses **eight diagnostic questions**. These questions are designed to force a choice between competing definitions of freedom. Note that Question 1 bundles two cases to save space; Questions 4 and 5 separate two cases that often travel together but shouldn't.

  There are **six leaves** (positions) generated by this tree. I have split the "Positive Liberty" cluster into two distinct leaves (Self-Mastery vs. Objective Good) because the *Addict* and *Cult* cases test different things (internal desire vs. external manipulation). I have also split the "Republican" cluster into two leaves (Domination vs. Democratic Legitimacy) using the *Voter* case.

  **Redundancy Warning:** The *Kindly Slaveholder* and the *Scheduling Worker* are doing nearly identical work (testing arbitrary power). For future iterations, cut the *Worker*. The *Slave* case is philosophically cleaner and emotionally sharper; the *Worker* case introduces confounding variables about contracts that muddy the water for first-years.

  **Indistinguishable Leaves:** The tree struggles to separate the **Self-Mastery** leaf from the **Objective Good** leaf. A student who says the *Addict* is unfree will almost always say the *Cult Member* is unfree. To pry them apart, you would need a case of a *Satisfied Rational Agent* (e.g., a monk who chooses poverty and silence willingly). If they call the monk unfree, they are Objective Good theorists; if free, they are Self-Mastery theorists.

  ***

  ### Handout: Which Kind of Freedom Do You Actually Care About?

  **Instructions:** Read each scenario below. Answer **YES** if you think the person described is *less free* than a normal person in their society. Answer **NO** if you think their freedom is unaffected. Follow the arrows to find your view.

  **Q1. The Obstacle Test:**
  *Case A:* A person has money but cannot buy bread because the shopkeeper refuses to sell it to them.
  *Case B:* A person has money but cannot buy bread because they have no money at all.
  *Case C:* A person wants to enter town hall but cannot because there are stairs and they use a wheelchair.
  **Question:** Is the person in *Case B* (No Money) or *Case C* (No Ramp) less free than the person in *Case A* (Refused Sale)?
  *   **YES** (Lack of resources/access reduces freedom) → Go to **Leaf 1**.
  *   **NO** (Only active refusal reduces freedom) → Go to **Q2**.

  **Q2. The Threat Test:**
  *Case:* A person is threatened with a gun, but the gun is secretly jammed and never fired.
  **Question:** Is this person less free than someone who was never threatened?
  *   **YES** (The attempt or fear matters) → Go to **Leaf 2**.
  *   **NO** (Only actual physical blocking matters) → Go to **Q3**.

  **Q3. The Knowledge Test:**
  *Case:* A prisoner is locked in a cell, but the door is actually unlocked. The prisoner doesn't know this and stays inside.
  **Question:** Is this prisoner less free than someone who knows the door is open?
  *   **YES** (Ignorance reduces freedom) → Go to **Leaf 3**.
  *   **NO** (Objective ability matters, not knowledge) → Go to **Q4**.

  **Q4. The Power Test (Extreme):**
  *Case:* A slave has a kindly master who never interferes with their choices and lets them do whatever they want.
  **Question:** Is this slave less free than a citizen who cannot be owned by anyone?
  *   **YES** (Being owned reduces freedom) → Go to **Q5**.
  *   **NO** (Non-interference is all that matters) → Go to **Leaf 4**.

  **Q5. The Power Test (Mundane):**
  *Case:* A worker's hours are set by a scheduling system that can fire or reassign them at any moment without reason, but in practice leaves them alone.
  **Question:** Is this worker less free than the slave in Q4?
  *   **YES** (Economic power is like ownership) → Go to **Q6**.
  *   **NO** (Only legal ownership counts) → Go to **Leaf 5**.

  **Q6. The Legitimacy Test:**
  *Case:* A citizen votes against a law, but is outvoted. The law passes under a democratic procedure they endorse.
  **Question:** Is this citizen less free than the slave in Q4?
  *   **YES** (Democratic rules don't stop it from being domination) → Go to **Leaf 5**.
  *   **NO** (Democratic rules make it freedom) → Go to **Leaf 6**.

  **Q7. The Internal Test:**
  *Case:* An addict wants to stop using drugs but finds they cannot stop.
  **Question:** Is this addict less free than a user who enjoys drugs and doesn't want to stop?
  *   **YES** (Internal conflict reduces freedom) → Go to **Leaf 7**.
  *   **NO** (Doing what you want is freedom) → Go to **Q8**.

  **Q8. The Happiness Test:**
  *Case:* A cult member sincerely reports being happy and says they love following the leader's rules.
  **Question:** Is this member less free than a non-member?
  *   **YES** (Happiness doesn't fix unfreedom) → Go to **Leaf 7**.
  *   **NO** (If they feel free, they are free) → Go to **Leaf 4**.

  ***

  ### The Leaves: What Your Answers Mean

  **Leaf 1: The Capability View**
  *   **The View:** Freedom is about what you are actually able to do and be, regardless of whether a person is stopping you.
  *   **Awkward Commitment:** You must accept that a person stranded on a desert island is unfree, even though no one is ruling over them.
  *   **Hardest Case:** *The Jammed Gun* (If ability is all that matters, a failed threat shouldn't matter, but you might feel it does).

  **Leaf 2: The Threat View (Unnamed)**
  *   **The View:** Freedom is reduced by the psychological impact of coercion, even if the coercion fails physically.
  *   **Awkward Commitment:** You must count a bluff as a reduction of freedom, even if the bluffer had no power to hurt you.
  *   **Hardest Case:** *The Kindly Slaveholder* (If the slave doesn't know the master could punish them, is the threat real?).

  **Leaf 3: The Objective Opportunity View (Unnamed)**
  *   **The View:** Freedom is an objective fact about your environment; your ignorance of options reduces your freedom.
  *   **Awkward Commitment:** You must accept that hiding information from people makes them unfree, even if you never force them to do anything.
  *   **Hardest Case:** *The No Money Case* (If ignorance counts, why doesn't lack of resources count as a "hidden door"?).

  **Leaf 4: The Non-Interference View**
  *   **The View:** Freedom is only reduced when another person actually physically stops you from doing what you want.
  *   **Awkward Commitment:** You must accept that the kindly slave is just as free as the citizen, provided the master never interferes.
  *   **Hardest Case:** *The Kindly Slaveholder* (This view implies slavery is compatible with total freedom).

  **Leaf 5: The Non-Domination View**
  *   **The View:** Freedom is reduced by being exposed to someone else's arbitrary power, even if they never use it.
  *   **Awkward Commitment:** You must accept that a worker with a boss is significantly unfree, similar to a slave, even if the boss is nice.
  *   **Hardest Case:** *The Citizen Outvoted* (This view implies you are unfree whenever you lose a vote, even in a democracy).

  **Leaf 6: The Democratic Legitimacy View**
  *   **The View:** Freedom is reduced by arbitrary power, unless that power is authorized by a procedure you accept.
  *   **Awkward Commitment:** You must accept that the same law restricts your freedom if passed by a dictator, but not if passed by a parliament.
  *   **Hardest Case:** *The Worker* (It is unclear if an employment contract counts as "authorization" similar to voting).

  **Leaf 7: The Self-Mastery View**
  *   **The View:** Freedom is a kind of internal self-control; you are unfree if your own desires or beliefs block you.
  *   **Awkward Commitment:** You must accept that a person can be made unfree by their own psychology, with no external oppressor involved.
  *   **Hardest Case:** *The Cult Member* (If they sincerely say they are happy, on what grounds do you claim they are unfree?).

  ***

  ### Logical Space Analysis (For the Instructor)

  **Empty Cells (Incoherent Combinations):**
  1.  **Yes to Cult, No to Addict:** It is logically unstable to claim the *Cult Member* is unfree (because their desires are manipulated) while the *Addict* is free (despite their desires being chemically hijacked). Both test whether "wanting" is sufficient for freedom. If you mark this combination, press the student on the source of the desire.
  2.  **Yes to Slave, No to Worker:** While common, this is philosophically fragile. If arbitrary power reduces freedom in the *Slave* case, the *Worker* case (where the power is also arbitrary, just economic) should trigger the same intuition. This usually indicates a student is reacting to the *word* "slave" rather than the structure of power.
  3.  **Yes to Bread, No to Wheelchair:** Claiming poverty reduces freedom but architectural barriers do not (or vice versa) suggests an inconsistent theory of "obstacles." Both are non-human constraints on capability.

  **Indistinguishable Leaves:**
  *   **Leaf 5 (Non-Domination) vs. Leaf 6 (Democratic Legitimacy):** The *Voter* case is the only thing separating these. Many students will answer "No" to Q6 (Outvoted citizen is free) simply because they like democracy, not because they have a theory of legitimacy. To separate them, you need a case where a democratic majority votes to restrict a minority's speech. If they call that unfreedom, they are Leaf 5. If they call it freedom, they are Leaf 6.

  **Case Redundancy:**
  *   **Cut the Worker:** The *Kindly Slaveholder* does the heavy lifting for the Non-Domination view. The *Worker* case introduces "contracts" and "wages," which allows students to dodge the power question by saying "they agreed to the job." The *Slave* case removes the "agreement" escape hatch.
  *   **Cut the Jammed Gun:** The *Kindly Slaveholder* covers the "power without interference" intuition more robustly. The *Jammed Gun* tests "attempt without power," which is a niche intuition that often confuses first-years about the difference between *freedom* and *security*.
