answer: |-
  The flaw in your argument lies precisely at **Step (9)**.

  > **(9) If I have no exclusive right to the abstract idea (from 3), any claim I have to the token can rest only on the physical labour of producing that particular file.**

  While Step (12) is the conclusion that feels most wrong (claiming plagiarism is conceptually impossible), Step (9) is the premise that forces that conclusion. Step (9) asserts a reductionist view of moral claims: it assumes that because you cannot own the *pattern* (the idea), your only remaining moral hook is the *physics* (the labor/electrons) of the specific token.

  Here is the diagnosis of why this step fails, why it looked plausible, and the theoretical costs for the three positions you outlined if they reject it.

  ### 1. Diagnosis of the Flaw

  **Why Step (9) Fails:**
  Step (9) commits a category error by conflating **property claims** with **personality claims**. It assumes that the only valid moral claim one can have over a created object is a property right derived from physical labor. However, moral philosophy recognizes claims based on **agency, integrity, and identity**.

  When you write code, you are not just moving electrons (physical labor); you are making assertions about the world and extending your agency into a digital medium. A moral claim to that token can rest on **authorship** (the link between the creator and the creation) rather than just **possession** (the physical file). Plagiarism violates the latter (the link to identity), not the former (exclusive use). Therefore, even if you accept (1) and (3) (no property right in the idea), you can still maintain a moral right against misattribution because that right protects *you*, not the *idea*.

  **Why It Initially Seemed Plausible:**
  As a software engineer, you work in a materialist discipline. Code *is* data; data *is* physical states on a disk. In your daily work, "copying" is literally `cp source dest`, which creates a new physical token without disturbing the old one.
  *   **The Engineering Intuition:** If the physical object isn't deprived, and the abstract pattern isn't ownable, nothing is left to protect.
  *   **The Philosophical Trap:** This intuition ignores that human communication is not just data transfer; it is **testimony**. When you release code, you are implicitly testifying, "I built this." Plagiarism is not stealing the data; it is forging the testimony. Step (9) ignores the testimonial layer, reducing the act to mere physics.

  ### 2. Costs of Rejecting Step (9)

  To save your argument from the absurdity of Step (12) while keeping your preferred premises (1) and (3) (non-rivalry and no natural right to exclude ideas), a philosophical theory must reject Step (9). It must admit that moral claims can rest on something *other* than physical labor/possession. Here are the costs for the three theories you mentioned if they make that move.

  #### A. The Lockean Labour-Mixing Account
  *   **The Move:** To reject (9), the Lockean must admit that "mixing labour" applies not just to physical appropriation but to **self-constitution**. I own the code not because I own the electrons, but because the code is an extension of my will/personhood (a Hegelian modification of Locke).
  *   **The Cost:** **Dilution of the "Property" Metaphor.**
      Classic Lockeanism relies on a clear boundary between "me" (my body/labor) and "the world" (unowned resources). By rejecting (9), you admit that I can have moral claims over things I do not physically possess or exclude others from using (since you are keeping premise 3). This blurs the line between *property* (right to exclude) and *integrity* (right to attribution). It complicates the theory significantly: if I can have a moral claim without a right to exclude, the Lockean proviso becomes much harder to calculate. You risk turning "property" into a vague "interest," weakening the libertarian force of the original argument.

  #### B. The Pure Consequentialist Incentive Theory
  *   **The Move:** To reject (9), the Consequentialist must admit that **reputation and truth** are utility goods comparable to monetary profit. They must argue that allowing plagiarism (even without IP) reduces overall welfare because it destroys the incentive of *recognition*, which drives creation just as much as *exclusivity*.
  *   **The Cost:** **Measurement Complexity and Non-Market Values.**
      Pure consequentialist defenses of IP usually rely on simple economic models: Monopoly Profit $\rightarrow$ R&D Investment. If they reject (9), they must model **social capital** and **honesty norms** as economic variables. This is notoriously difficult to quantify. It forces the theory to acknowledge that humans are not merely profit-maximizers but also status-and-truth-seekers. This complicates policy: if reputation is the incentive, then *legal* IP might actually be less efficient than *social* shaming of plagiarists, undermining the justification for state-enforced copyright law.

  #### C. The Social-Contract View of Information Goods
  *   **The Move:** To reject (9), the Contractarian must admit that norms of **honesty and attribution** exist *prior* to the specific IP contract. They must argue that the "contract" of open source or society includes a clause on truth-telling that is independent of property rights.
  *   **The Cost:** **Fragmentation of Sovereignty.**
      Social contract theories often justify IP by saying, "We all agree to these rules to maximize social good." If they reject (9), they admit that some rules (like "do not lie about authorship") are binding *even without* a specific utilitarian bargain about exclusivity. This implies there are **pre-political moral norms** regarding information. This limits the state's (or the community's) flexibility to define information norms purely for utility. It suggests that you cannot simply vote to allow plagiarism even if it were economically efficient, which constrains the "pure contract" view that laws are solely tools for optimization.

  ### Summary
  Your argument is robust up to Step (8). The break occurs at **Step (9)** because it assumes that without property rights, there are no moral rights. By rejecting (9), you can keep (1) and (3) (ideas are free) while affirming that plagiarism is wrong (because lying about authorship violates norms of honesty and identity, not property). The cost is that you must adopt a more nuanced view of "ownership" that includes **integrity** alongside **exclusivity**.
