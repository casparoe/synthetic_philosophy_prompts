answer: |-
  ### Failure Modes

  Before we build the procedure, here is where this breaks in practice.

  1.  **The Base Rate Blindness:** Readers interpret "70% chance if A" as "70% of all cases," ignoring that A might be rare; this turns a conditional probability into a joint probability error.
  2.  **The Attribution Trap:** Editors verify the statistic (70%) but not the link; they check if the drug approval rate is 70%, not if the *conditional* link between analysis and approval holds at that rate.
  3.  **The Counterfactual Illusion:** Past conditionals ("If we had...") cannot be verified; numbers here are model outputs, not frequencies, but readers treat them as empirical facts.
  4.  **The Normative Mask:** "If A, we must B" looks like a prediction but is a policy claim; numbering it implies inevitability rather than choice, laundering a value judgment as a forecast.
  5.  **The Deadline Drift:** Under pressure, "likely" becomes "70%" because it sounds more precise, even when evidence is weaker; this creates false precision that survives into the archive.

  ### Theory Check

  You asked for corrections on your half-absorbed theory; here is the status of each move, one sentence each.

  1.  **Lewis:** You have this right; triviality proves no proposition-valued conditional satisfies the equation for all probability functions.
  2.  **Adams:** You have this right; it treats conditionals as lacking truth conditions but having assertability conditions equal to conditional probability.
  3.  **Truth Conditions/Equation Fails:** You have this right; this preserves the conditional as a proposition but admits its probability diverges from the conditional probability.
  4.  **Restricted Prior:** You are right to be suspicious; this is a technical constraint that fixes the probability space too rigidly for general news reporting.
  5.  **Kratzer:** You have this right; it treats 'if' as a restrictor on an existing modal operator rather than a connective creating a new proposition.

  ### The Decision Procedure

  This is designed for a copy editor with zero theory background. It takes ten minutes. If a step fails, stop and follow the instruction.

  **Step 1: Find the Modal (Classification)**
  Look at the verb tense and the consequence.
  *   **Future Indicative** ("If X happens, Y will happen"): This is a **Forecast**. Proceed to Step 2.
  *   **Past Subjunctive** ("If X had happened, Y would have happened"): This is a **Counterfactual**. Skip to Step 4.
  *   **Present/Future Inferential** ("If X replicates, Y must rethink"): This is an **Inference** or **Normative Claim**. Skip to Step 5.
  *   **Bare Regularity** ("If X heats, Y expands"): This is a **Law**. No number needed, proceed to Step 6.

  **Step 2: The Number Test (Forecasts Only)**
  Ask: "Is there a specific dataset or model that outputs this number for this specific condition?"
  *   **Yes:** There is a cited study, model, or historical base rate explicitly linking the antecedent to the consequent. Proceed to Step 3.
  *   **No:** The number is a guess, an expert's off-hand remark, or derived from a different condition. **Action:** Strip the number. Replace with "likely," "probable," or "strong chance." Stop.

  **Step 3: The Antecedent Risk (Forecasts Only)**
  Ask: "Is the 'If' part rare, undefined, or dependent on human discretion?"
  *   **Example:** "If the FDA approves..." (Discretionary) vs. "If the temperature exceeds 100C..." (Physical).
  *   **Risk:** If the antecedent is vague or discretionary, the conditional probability is unstable.
  *   **Action:** If vague/discretionary, strip the number even if Step 2 passed. Use qualitative language. If precise/physical, keep the number but attribute it (Step 4).

  **Step 4: Attribution (Counterfactuals and Numbered Forecasts)**
  Ask: "Who owns the error if this number is wrong?"
  *   **Writer:** You are synthesizing multiple sources or guessing. **Action:** No numbers allowed. Use qualitative language.
  *   **Source:** A specific paper, model, or expert provided this specific conditional estimate. **Action:** Attribute the number to the source, not the sentence structure.
      *   *Bad:* "There is a 70% chance that if A, then B."
      *   *Good:* "Model X estimates that if A occurs, B follows with 70% probability."
  *   **Stop:** If you cannot attribute the number to a specific source model, strip the number.

  **Step 5: The Normative Gate (Inferences and Normative Claims)**
  Ask: "Does the consequence describe a physical event or a human reaction?"
  *   **Physical:** "The bridge will collapse." (Can be numbered if Step 2 passes).
  *   **Human/Field Reaction:** "The field will rethink everything." (Cannot be numbered).
  *   **Action:** Never attach a probability to a normative or sociological consequence. It implies inevitability where there is only convention. Keep qualitative.

  **Step 6: Deadline Mode (40 Minutes to Print)**
  If you are out of time to verify Step 2 or 4:
  *   **Rule:** Default to qualitative. "Likely" is safer than "70%."
  *   **Exception:** If the number is a direct quote from a source document attached to the file, keep it and attribute.
  *   **Action:** If the writer insists on a number without a source document, escalate (Step 7).

  **Step 7: Escalation Gate**
  Escalate to the **Standards Editor** (not the Senior Editor) if:
  *   The writer insists on a number for a Normative/Inferential claim (Step 5).
  *   The writer insists on a number for a Counterfactual without a cited model (Step 4).
  *   The writer insists on a number for a Forecast where the antecedent is discretionary (Step 3).
  *   **Reason:** This is no longer a copy edit; it is a liability decision.

  ### Application to Your Drafts

  **(1) "If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance."**
  *   **Classification:** Forecast (Future Indicative).
  *   **Number Test:** Is there a dataset linking interim analysis success to approval at 70%? Unlikely. This is usually expert elicitation.
  *   **Antecedent Risk:** "Holds up" is vague (statistical significance? clinical significance?). "Approved" is vague (FDA? EMA? Full? Emergency?).
  *   **Verdict:** **Fail.** Strip the number.
  *   **Fix:** "If the trial's interim analysis holds up, approval is likely." OR "Analysts estimate a 70% chance of approval assuming the interim analysis holds up." (Requires source).
  *   **Why:** You are numbering a discretionary process with undefined terms.

  **(2) "If the variant had been caught two weeks earlier, this wave would have been half the size."**
  *   **Classification:** Counterfactual (Past Subjunctive).
  *   **Number Test:** "Half the size" is a number. Is it from a specific epidemiological model?
  *   **Attribution:** If this comes from a specific paper's simulation, attribute the model. If it is your synthesis of "experts say," strip the number.
  *   **Verdict:** **Conditional Pass.** Only if you can cite the model.
  *   **Fix:** "According to Model X, catching the variant two weeks earlier would have halved the wave." If no model: "catching the variant earlier would have significantly reduced the wave."
  *   **Why:** Counterfactuals are model outputs, not facts. Without the model citation, it is speculation.

  **(3) "If the result replicates, the field will have to rethink everything."**
  *   **Classification:** Inferential/Normative (Human Reaction).
  *   **Number Test:** N/A (You didn't ask for a number here, but the procedure forbids it).
  *   **Normative Gate:** Consequence is "field will rethink." This is sociological, not physical.
  *   **Verdict:** **Pass.** Keep as is.
  *   **Why:** This is a claim about scientific norms, not a probabilistic forecast. Adding a number ("80% chance the field will rethink") would be absurd.
  *   **Warning:** You said if I kill this, tell you plainly. I am not killing it, but note: this is a strong claim. If the result replicates and the field *doesn't* rethink, you are wrong. Ensure the "have to" is justified by the magnitude of the result, not just your hope.

  ### Meta-Analysis: Changing My Mind and Limitations

  **What Would Change My Mind?**
  *   **Empirical:** If psycholinguistic studies showed that general readers consistently interpret "70% chance if A then B" as P(B|A) without inflating confidence or ignoring base rates in scientific contexts. Currently, evidence suggests they treat it as a joint probability or a truth-value probability, leading to error.
  *   **Theoretical:** If a triviality-proof logic became standard in the specific scientific fields you cover (e.g., if epidemiologists standardly reported conditional probabilities as proposition probabilities in public communications). Until the source material changes, your copy cannot safely differ.

  **Where This Procedure Misfires**
  *   **High-Stakes Risk Communication:** In public health emergencies, "likely" may be too vague to drive policy, forcing you to use numbers even when the theory says don't. In these cases, the procedure forces attribution to a specific model, which may not exist yet.
  *   **Expert Elicitation:** When experts give numbers based on intuition rather than models (common in emerging science), Step 2 strips the number, potentially losing useful information. The procedure prioritizes accuracy over nuance here.

  **What It Can't Do**
  *   **Verify the Science:** It cannot tell you if the trial analysis *will* hold up, or if the model for the variant is correct. It only checks the structure of the claim.
  *   **Resolve Value Judgments:** It cannot tell you if the field *should* rethink everything. It flags that this is a normative claim, not a factual one, but you must own the norm.
  *   **Save Bad Attribution:** If you attribute a number to a source that itself misused statistics, this procedure won't catch it. It assumes the source material is internally consistent.

  **Final Judgment:** Your standards editor is right. The theory prohibits numbering conditionals unless they are explicitly model outputs. Use the procedure to strip numbers from forecasts and inferences, and force attribution on counterfactuals. Keep (3), but own the norm.
