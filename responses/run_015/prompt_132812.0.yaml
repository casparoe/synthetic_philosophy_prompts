prompt: |-
  I serve on the committee drafting the disclosure policy for a large genomic research programme. Two questions are in front of us: whether to honour a participant's standing request not to be told certain results, and whether to return unsolicited findings that we come across while looking for something else. A colleague on the committee, a health economist, has produced an argument he says settles both at once and in the same direction. I cannot accept his conclusion, but I also cannot locate the mistake, and I would rather not dismiss the argument for the wrong reason.

  Here is the argument as he gave it to us.

  (1) Good's theorem. Take an agent with probabilities over states, a utility function over consequences, and a fixed set of feasible acts. Offer her, at no cost, the chance to observe the outcome of an experiment before she chooses. Then the expected utility of the situation in which she has that option is at least as great as the expected utility of the situation in which she does not. The proof is two lines: conditional on any signal, she can still perform the act that was optimal before the experiment; so the value of choosing after the signal is at least the value of choosing without it, for every possible signal; and averaging over the signals preserves the inequality.

  (2) Nothing in that proof turns on what the signal is about, on whether the agent understands it, on whether she will in fact use it well, or on how well she will remember it. It uses only two things: that she is free to condition her choice on the signal, and that the acts available after the signal include the acts available before. So the result is entirely neutral about content and about competence.

  (3) Therefore, for a rational agent, costless information cannot be worse than ignorance. He calls this the principle that ignorance never pays.

  (4) So anyone who declines costless information, or who asks in advance not to be given it, is making a mistake by her own lights: there is no such thing as a rational preference for ignorance. Whatever else may be said for the person who asks not to be told a secondary finding, who avoids a spoiler, or who declines a predictive test for a condition nobody can treat, she is not serving her own interests.

  (5) So a policy of honouring such requests cannot be defended as protecting the person who makes it. It can only be defended by its effects on third parties. And a clinician who respects the request is, by the patient's own lights, making the patient worse off.

  (6) I pressed him on the case in which every decision has already been made: the treatment is over, the outcome is fixed, and the clinic offers to tell you now, for nothing, which way it went, knowing that being told will darken the rest of your life and change nothing else. Even here, he says, ignorance never pays, because the theorem is silent about timing and about content.

  (7) I pressed him on information that forecloses options, where coming to know something triggers a duty you would rather not have — a duty to report, to disclose, to remediate, to testify — or otherwise alters what you may do or what others may do to you. Even here, he says, the theorem holds, since choosing as if you did not know is the only move the proof requires, and it is always available.

  That last pair of replies is where I lose my footing, because neither strikes me as credible and yet I cannot say which premise fails. I have two候选 diagnoses, and I cannot tell which bears the weight. One is that something slips between (3) and (4): the theorem is a claim about an expectation taken before the signal is drawn, and my colleague is using it to condemn a preference, and to underwrite a standing policy, in a way that confuses what is true in expectation beforehand with what is true of the situation you actually end up in. The other is that the proof quietly assumes that consequences are fixed by the act and the state alone, so that what the agent knows enters only through what she chooses; in the cases at (6) and (7) the outcome seems to depend on her knowledge itself, and then the two-line proof has nothing to bite on.

  Please tell me which step you would reject, why that step looked safe, and what rejecting it costs. I would like the alternatives priced, not just one of them dismissed: if the fault is the slide from an ex ante expectation to a verdict about preference and policy, what exactly does the theorem still entitle us to say? If the fault is the assumption that outcomes are functions of act and state alone, does giving that up cost us the separation of belief from desire that the whole expected-utility apparatus rests on, and with it any external standpoint from which a preference for ignorance could be called irrational? And is there some third break point I have not considered — something about the agent's later self not sharing her earlier self's aims, say — that does the work more cheaply?

  Two claims I am reluctant to surrender: the theorem itself, read as a claim about the idealised agent in (1); and the thought that a right not to know protects something real, which is what our committee is being asked to decide. If those two cannot both be kept, say so and tell me which you would drop.

  Finally, I want to know what would change your mind. Name the argument or consideration that would move you to a different diagnosis, tell me where your reasoning is most likely to fail, and say what my colleague would say in reply if he were in the room — I have to go back to him with this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is on a committee drafting a disclosure policy for a genomic research program.
      *   **Problem:** A colleague (health economist) argues that Good's Theorem proves that honoring a participant's request *not* to know certain results (or returning unsolicited findings) is irrational and harmful to the participant ("Ignorance Never Pays").
      *   **User's Stance:** The user rejects the colleague's conclusion but can't pinpoint the exact logical error. They suspect two main candidates:
          1.  Confusion between *ex ante* expectation and *ex post* preference/policy (Step 3 -> 4).
          2.  Violation of the assumption that outcomes depend only on act and state, not on knowledge itself (Step 2/Proof assumptions).
      *   **Requirements:**
          *   Identify which step to reject and why.
          *   Explain why that step looked safe.
          *   Explain the cost of rejecting it.
          *   Price the alternatives (what does the theorem still allow if we reject the slide? What happens to expected utility theory if we reject the outcome assumption?).
          *   Consider a third breakpoint (e.g., changing selves).
          *   Address the two claims the user wants to keep (Good's Theorem validity & Right not to Know validity).
          *   State what would change my mind (argument/consideration), where my reasoning might fail, and what the colleague would say in reply.

  2.  **Deconstruct the Colleague's Argument:**
      *   (1) Good's Theorem (1967): Costless information has non-negative expected utility *for decision making*.
      *   (2) Neutrality claim: Doesn't matter what the signal is or competence.
      *   (3) Principle: "Ignorance Never Pays" (Costless info $\ge$ Ignorance).
      *   (4) Normative claim: Declining info is a mistake/irrational by one's own lights.
      *   (5) Policy claim: Honoring requests not to know harms the patient; can only be justified by third-party effects.
      *   (6) & (7) Defenses against counterexamples (post-decision info, info triggering duties).

  3.  **Evaluate the Candidate Diagnoses:**

      *   **Candidate 1: The Slide from Ex Ante to Ex Post (Step 3 -> 4).**
          *   *Analysis:* Good's Theorem is about *expected* utility calculated *before* receiving the information. It says $E[U|Info] \ge E[U|No Info]$. It does *not* say that for every specific realization of the signal, the utility is higher. It allows for the possibility that receiving *this specific* bad news makes you worse off in terms of experienced utility (happiness, anxiety), even if having the *option* to know was valuable for decision-making.
          *   *Relevance to Genomics:* If the information doesn't change the decision (e.g., no treatment available), the instrumental value is zero. If the information causes psychological harm (utility loss), the total utility might decrease. Good's Theorem assumes utility is defined over *consequences of acts*. If "knowing" is part of the consequence, the theorem needs adjustment.
          *   *Verdict:* This is a strong candidate. The colleague conflates *instrumental value for decision making* with *intrinsic value of the state of knowing*.

      *   **Candidate 2: The Assumption that Outcomes depend only on Act and State (Step 2/Proof).**
          *   *Analysis:* Standard decision theory defines a consequence $c = f(act, state)$. Knowledge is usually implicit in the "act" (choosing based on signal). However, if the *state of knowing itself* alters the utility function (e.g., anxiety, stigma, duty to disclose), then the utility function is $U(act, state, knowledge)$. Good's Theorem assumes $U$ is fixed over consequences. If knowledge changes the utility function (psychological cost), the theorem's condition that "acts available after include acts available before" isn't enough because the *valuation* of those acts changes.
          *   *Relevance to Genomics:* Knowing a genetic risk can cause anxiety (direct utility loss) or trigger legal duties (changing the feasible set effectively, or changing the cost of acts).
          *   *Verdict:* This is the deeper, more fundamental technical error. Good's Theorem assumes information is *instrumentally* valuable, not *intrinsically* costly. If information enters the utility function directly (as a bad), the theorem fails.

      *   **Candidate 3: Changing Selves (Time Inconsistency).**
          *   *Analysis:* The agent at $T_0$ (deciding to test) might value knowledge differently than the agent at $T_1$ (receiving result). Good's Theorem assumes a single, consistent utility function.
          *   *Verdict:* Relevant, but secondary to the structural issue of whether knowledge enters the utility function.

  4.  **Synthesize the Argument:**

      *   **The Core Error:** The colleague misapplies Good's Theorem. The theorem is about the *instrumental value of information for decision making*. It assumes utility is defined over *world states resulting from actions*. It does *not* account for the *intrinsic disutility of knowing* (psychological burden) or cases where information restricts the feasible set (legal duties).
      *   **Which Step to Reject:** Step (2) and the inference to (3). The proof *does* turn on the nature of the signal and the utility function. Specifically, it assumes the signal does not directly affect utility, only the choice of act.
      *   **Why it looked safe:** In standard economics, information is usually treated as a tool to map states to actions. The "cost" is usually monetary or time. Psychological cost is often externalized or ignored in simplified models.
      *   **Cost of Rejecting:** We admit that Expected Utility Theory (EUT) needs modification to handle "knowledge as a consequence." We don't lose EUT, but we must expand the definition of "consequence" to include the mental state of the agent.
      *   **The Slide (3->4):** This is also a valid criticism. Ex ante expectation $\neq$ Ex post welfare. But the deeper issue is that if the ex post utility of knowing is negative (due to anxiety), the ex ante expectation might *also* be negative if that risk is weighted heavily. So fixing the outcome assumption fixes the expectation problem too.

  5.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the user's intuition.
      *   **Diagnosis:** Pinpoint the error in **Step (2)** primarily, supported by the slide in **Step (3) -> (4)**.
      *   **Explanation of Good's Theorem:** Clarify that it proves information has *instrumental* value for *choice*, not *intrinsic* value for *well-being*.
      *   **Addressing Candidate 1 (The Slide):** Explain the Ex Ante vs. Ex Post distinction. Even if the theorem holds ex ante, it doesn't mandate receiving info ex post if preferences change or if the "cost" was underestimated.
      *   **Addressing Candidate 2 (The Outcome Assumption):** This is the killer. If "Knowing" is part of the consequence, and $U(Act, State, Knowing) < U(Act, State, Not Knowing)$, the theorem's inequality flips. The colleague assumes $U$ is independent of information state.
      *   **Pricing the Alternatives:**
          *   If we fix the Slide: We keep EUT but limit the policy claim. We can honor requests based on ex post welfare.
          *   If we fix the Outcome Assumption: We expand EUT. "Consequences" include psychological states. This preserves rationality but allows for "rational ignorance."
      *   **Third Breakpoint (Changing Selves):** Mention this as reinforcing the argument (hyperbolic discounting, preference reversal), but note it's not strictly necessary to defeat Good's Theorem.
      *   **The Two Claims:** You *can* keep both. Good's Theorem is true *within its assumptions*. The Right to Not Know is valid *because those assumptions fail in medical contexts*.
      *   **What Would Change My Mind:** If the colleague could demonstrate that the psychological cost is always outweighed by the instrumental value in *expectation* (empirical claim), or if they redefine utility to strictly exclude mental states (philosophical claim).
      *   **Colleague's Reply:** He will argue that "anxiety" is just a state to be managed (an act) and that rational agents should update probabilities and act optimally. He will claim you are "irrationally" weighting fear over fact.
      *   **My Reasoning's Weak Point:** Assuming psychological harm is significant enough to outweigh potential instrumental benefit in a *research* context (where clinical utility might be low anyway).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say Good's Theorem is "wrong." It's mathematically valid *given its axioms*. The error is applying it to a domain where the axioms (specifically regarding the utility function's dependence on information) do not hold.
      *   *Nuance on Step 7:* The colleague argues that "choosing as if you did not know is always available." This is false if knowing triggers a legal duty. If I know $X$, I *must* report $X$. I cannot choose "Act as if I don't know $X$" because the law punishes that. The feasible set *shrinks* upon information acquisition. This violates the "fixed set of feasible acts" assumption in Step (1).
      *   *Decision:* I will focus on the **Utility Function Assumption** (Candidate 2) as the primary theoretical break, and the **Feasible Set Assumption** (Step 7 rebuttal) as the primary practical break. The Ex Ante/Ex Post slide (Candidate 1) is a consequence of these.

  7.  **Final Polish:** Ensure tone is respectful, rigorous, and directly answers the prompt's specific questions (which step, why safe, cost, alternatives priced, two claims, change my mind).

      *   *Structure:*
          1.  Direct Answer: Reject Step (2) and the inference to (3).
          2.  Why it looked safe (Standard EUT framing).
          3.  Cost of rejection (Expanding "consequences").
          4.  Pricing the alternatives (Slide vs. Assumption).
          5.  Third Breakpoint (Changing selves).
          6.  Reconciling the Two Claims.
          7.  What would change my mind / Colleague's reply / My weakness.

  8.  *(Self-Correction during drafting)*: Wait, the prompt asks me to choose between the two candidate diagnoses primarily, or find a third. I should explicitly weigh Candidate 1 vs Candidate 2. Candidate 2 is stronger because it undermines the theorem's applicability, whereas Candidate 1 just limits the normative force. If Candidate 2 holds (knowledge affects utility), then Candidate 1's distinction matters less because the Ex Ante calculation itself would show negative value. I will argue Candidate 2 is the fundamental error, which makes Candidate 1's observation a symptom.

      *   *Wait, one more thing:* Step (7) regarding "duties." If knowing creates a duty, the set of feasible acts *changes*. Good's Theorem assumes the set of feasible acts is fixed ($A$). If knowing $s$ reduces $A$ to $A' \subset A$, the theorem fails. This is a direct violation of premise (1). I should highlight this as a concrete instance of Candidate 2.

      *   *Okay, plan set.* Focus on the definition of "Consequence" and "Feasible Acts."

  9.  **Final Review against constraints:**
      *   Tell which step to reject.
      *   Why it looked safe.
      *   What rejecting it costs.
      *   Price the alternatives.
      *   Address the two claims.
      *   What would change my mind + colleague's reply + my weakness.

      *Let's write.*
answer: |-
  You are right to resist the conclusion. Your colleague has committed a category error that is common when decision theory is imported into bioethics without translating the terms. He is treating a theorem about *instrumental rationality* as a theorem about *welfare*.

  Here is the diagnosis you asked for, priced and weighted.

  ### 1. Which Step to Reject
  You should reject **Step (2)**, and consequently the inference to **Step (3)**.

  Your colleague claims the proof "turns on nothing... about what the signal is about." This is false. The proof turns crucially on the assumption that the **utility function is defined over world-states and acts, independent of the agent's information state.**

  Good's Theorem (1967) proves that information has non-negative *instrumental* value for decision-making. It assumes that the utility of a consequence $c$ is $U(c)$. In the standard formulation, $c$ is a function of the Act and the State of the World. The signal merely updates the probability distribution over States.

  However, in your genomic context, the "consequence" includes the agent's psychological state *upon receiving the signal*. If we define the consequence as $c = f(\text{Act}, \text{State}, \text{Information})$, and if $U(\text{Act}, \text{State}, \text{Know}) < U(\text{Act}, \text{State}, \text{Ignorant})$, then the theorem's inequality does not hold. The "cost" of the information is not monetary (which the theorem accounts for); the cost is intrinsic to the utility function.

  **Why it looked safe:**
  In standard economics, information is typically a tool to reduce uncertainty about prices or yields. The mental burden of holding the information is usually negligible or assumed to be separable from the economic outcome. In medicine, the "signal" (e.g., a positive Huntington's marker) *is* the harm, regardless of the act chosen. The colleague relies on the intuition that "more parameters for optimization is always better," ignoring that the parameters themselves can be toxic.

  **What rejecting it costs:**
  It costs you the simplicity of the standard Expected Utility (EU) model. You must adopt a model where "knowledge" is an argument in the utility function. This does not break EU theory, but it requires you to specify that agents can have rational preferences over their own epistemic states. You lose the ability to say "information is always good *ceteris paribus*," because *ceteris* are not paribus when knowledge alters the utility of the outcome.

  ### 2. Pricing the Alternatives

  You offered two candidate diagnoses. Here is how they price out.

  **Candidate 1: The Slide from Ex Ante to Ex Post (Step 3 → 4)**
  *   **The Argument:** Good's Theorem says $E[U|\text{Info}] \ge E[U|\text{No Info}]$ calculated *before* the signal. It does not guarantee that *after* receiving a specific signal, the agent is better off.
  *   **The Price:** If you accept this diagnosis but keep the colleague's assumptions about utility, you concede that the *policy* of offering information is rational ex ante, even if some individuals regret it ex post. You would have to argue for the "Right Not to Know" on the grounds of protecting people from their own ex post regret, despite their ex ante rationality.
  *   **The Weakness:** This doesn't fully save the participant. If the ex ante expectation is positive (as Good's Theorem suggests), a paternalistic policy blocking information *does* lower the participant's expected utility. You would be arguing that we should protect people from their own rational calculations.

  **Candidate 2: The Outcome Assumption (Step 2)**
  *   **The Argument:** The utility of the outcome depends on whether the agent knows it.
  *   **The Price:** If you accept this, the Ex Ante expectation *itself* can be negative. $E[U|\text{Info}]$ drops because the term $U(\text{Know})$ is low.
  *   **The Advantage:** This is the stronger position. It allows you to say that declining information is **rational ex ante**. It preserves the participant's autonomy without accusing them of a calculation error. It validates the "Right Not to Know" as a preference consistent with expected utility maximization, rather than a deviation from it.

  **Recommendation:** Candidate 2 is the heavier lifter. It undermines the colleague's premise that the request is a "mistake by her own lights." If knowledge enters the utility function negatively, the request is optimal.

  ### 3. A Third Break Point: The Feasible Set (Step 7)

  There is a third break point you mentioned in passing (Step 7) that is arguably more devastating than the utility function argument.

  Your colleague claims: *"Choosing as if you did not know is... always available."*
  This is empirically false in the context of legal and ethical duties.
  *   **The Constraint:** If a participant learns they carry a highly penetrant, preventable mutation, they may incur a moral or legal duty to inform relatives. If they remain ignorant, that duty does not trigger (or is significantly attenuated).
  *   **The Violation:** Good's Theorem assumes a **fixed set of feasible acts**. If acquiring information *shrinks* the feasible set (by adding obligations or liabilities), the proof collapses. You cannot "choose as if you did not know" if the law punishes you for failing to disclose what you know.
  *   **Cost:** This requires modeling information as a constraint-modifier, not just a probability-updater. It is a standard extension in game theory (information sets), but it breaks the "ignorance never pays" slogan.

  ### 4. Reconciling Your Two Claims

  You want to keep:
  1.  **Good's Theorem** (as a mathematical truth for idealized agents).
  2.  **The Right Not to Know** (as a valid ethical policy).

  **You can keep both.**
  Good's Theorem is true *within the axioms of the model in which it is proved*. Specifically, it assumes:
  1.  Utility is defined over outcomes, not information states.
  2.  Information does not restrict the feasible set of acts.
  3.  The agent's utility function is stable across time and information states.

  The "Right Not to Know" is valid because **genomic disclosure violates these axioms.**
  *   Genomic information often has intrinsic disutility (anxiety, stigma).
  *   Genomic information often triggers duties (disclosure to kin).
  *   Genomic information can alter time-preference (fatalism).

  Therefore, you are not contradicting Good's Theorem; you are pointing out that the genomic context lies outside its domain of application. Your colleague is committing a **modeling error**, not a mathematical one. He is applying a theorem from Decision Theory Type A (instrumental information) to a problem in Decision Theory Type B (constitutive information).

  ### 5. What Would Change My Mind

  **The Argument:**
  I would change my diagnosis if you could demonstrate that the **instrumental value of the information strictly dominates the psychological cost in expectation** for the specific class of findings in your programme.
  If the genomic programme only returns findings with high clinical utility (e.g., a preventable cancer risk with a clear prophylactic intervention), and the psychological burden is empirically shown to be transient and minor, then the "Outcome Assumption" objection weakens. In that specific narrow case, the colleague's argument approaches validity: the instrumental gain *might* outweigh the intrinsic cost.

  **Where My Reasoning Might Fail:**
  I am assuming that the "disutility of knowing" is a stable, pre-existing preference. It is possible that the disutility is a result of *irrational* framing or lack of support. If the anxiety is due to a cognitive bias (e.g., probability neglect) that could be corrected by better counseling, then the "rational preference for ignorance" disappears. If the ignorance is only preferred because the agent is misinformed about the risks, then Good's Theorem *does* apply once the agent is properly educated.

  **The Colleague's Reply:**
  If he were in the room, he would say:
  > "You are redefining 'utility' to include 'feelings about information.' If you allow the utility function to depend on the information state, you can rationalize *anything*. You can say an agent prefers to be ignorant because 'knowing hurts.' But that is just a description of a phobia. A rational agent should update their beliefs and manage the anxiety as a cost of doing business. If the anxiety is so great that it outweighs the survival benefit of knowing, *that* is the pathology we should treat, not the information flow. By honouring the request, we are colluding in the phobia."

  **My Counter-Reply to Him:**
  "Expected Utility Theory does not distinguish between 'phobia' and 'preference.' If the agent's utility function assigns a high negative weight to the state of 'knowing I have Huntington's,' that is their utility function. To tell them they are irrational is to impose *your* utility function over theirs. The theorem proves information is valuable for *control*. If I cannot control the disease, and the knowledge reduces my control over my mental state, the theorem yields no verdict until the costs are priced in. You have priced them at zero. That is the error."

  ### Summary for the Committee
  1.  **Reject Step (2).** Information can be intrinsically costly.
  2.  **Reject Step (7).** Information can restrict feasible acts (duties to disclose).
  3.  **Keep Good's Theorem.** It remains true for its intended domain (instrumental information with fixed acts).
  4.  **Keep the Right Not to Know.** It is a rational preference when information has intrinsic disutility or constraint costs.
  5.  **Policy:** Honouring the request protects the participant's *actual* expected utility, not just their feelings. The colleague's argument fails because it assumes a model of human welfare that excludes the cost of knowledge itself.
