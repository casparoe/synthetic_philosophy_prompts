answer: |-
  Dear colleague, it is a pleasure to hear from you and I think you are aiming at exactly the right pedagogical target with this seminar, namely getting the students to feel the visceral instability of deliberation under causal decision theory without immediately retreating into the comfort of labeling it. I have run variations of this before and I am happy to commit to a single design that I think will work best for your constraints, though I need to be upfront with you about one of your hopes regarding the preference cycle. You asked me to be honest if I do not think the cycle will appear with real twenty-year-olds, and the truth is that a strict non-transitive cycle where option A is preferred to B, B to C, and C to A will not emerge naturally from the logic of the Death in Damascus case even with three options. The logic of the case produces a state of universal unratifiability where every option looks bad once chosen, rather than a rock-paper-scissors style rotation of superiority. If you try to force a cycle by tweaking payoffs asymmetrically you risk turning it into a different game theory problem that obscures the specific philosophical point about ratifiability. Instead of promising them a cycle, I advise you to frame the expectation as a spiral of regret where no matter where they stand, the ground feels like it is shifting beneath them, and you should design the game to highlight that there is no safe harbor rather than that the options rotate in value. With that correction in mind, here is the design I recommend you run, which I call the Three Cities Chase.

  You will need to prepare fourteen envelopes before class, one for each student, but do not put anything inside them yet. You will also need a stack of index cards and a way to project a scoreboard. The prediction mechanism is the most critical part of this simulation and where most attempts fail, so I suggest you use a lagged heuristic rather than a pre-class poll. A pre-class poll is too static and students will feel they can outsmart it by simply changing their mind in the room, which defeats the purpose of feeling trapped by their own reasoning. Instead, you will announce that Death predicts each student based on their previous behavior. For the first round, you will make a arbitrary prediction for each student, perhaps based on their seating position or a random roll, and write that city name on a card and seal it in their envelope. For every subsequent round, you will open their envelope from the previous round, see what they chose, and write that same choice as your prediction for the current round. This creates the dynamic you want where Death is always one step behind but always catching them, forcing them to realize that wherever they intend to go, Death has already been there.

  The game will run for five rounds. In each round, students have three destination options, let us call them City A, City B, and City C, and they also have two meta-options they can purchase with points. You start everyone with twenty points. Survival is worth ten points per round and death is worth zero. If their choice matches your prediction in the envelope, they die and get zero for that round. If it mismatches, they survive and get ten. The twist you requested involves the meta-options. They can spend two points to Randomize, which means they roll a die to determine their city, but you must stipulate that Death predicts the outcome of the roll as well, so if the die lands on a city you predicted, they still die. They can also spend one point to Pre-commit, which means they hand you their choice card face down before the deliberation timer starts, but again you must stipulate that Death predicts the pre-commitment. The cost is meant to simulate the effort of trying to break the causal link, but the stipulation ensures they learn that breaking the link is impossible if the predictor is perfect. You should project a leaderboard after every round so they can see who is surviving and who is dying, and you should encourage them to talk to each other between rounds to compare strategies, which will amplify the sense of collective panic when they realize everyone is dying regardless of what they choose.

  When you run this, do not give any lecture at the start. Simply hand out the rules and the envelopes and tell them that you are Death and you have already made your predictions for the first round. Let them deliberate for three minutes, then collect their choices, reveal the predictions, and award points. Repeat this five times. By the third round, you should see the instability manifest. Students who chose City A will see they died, so they will switch to City B. But because you are predicting based on their last choice, you will have predicted City A for the next round, so they might survive, but then the student who switched to City B will die because you predicted B. Wait, I need to correct the heuristic there to ensure the instability feels personal. If you predict what they did last round, and they switch, they survive. That teaches them to switch. To make them feel the instability, you need them to feel that switching is what kills them too. A better heuristic for the prediction is to predict the choice they are most likely to make based on the group consensus or a focal point. However, since you cannot actually read minds, the most pedagogically effective method is to adjust your predictions post-hoc for the sake of the lesson, though I know that feels dirty. A more honest way that still works is to tell them that Death predicts based on their dominant tendency. If a student switches every time, Death predicts the switch. If they stay, Death predicts the stay. You can approximate this by watching them. If you are uncomfortable with that level of improvisation, stick to the lagged heuristic but debrief heavily on the fact that in the real thought experiment Death predicts the *current* deliberation, not just the past action.

  Now I must address the predictable failures you mentioned. Someone will absolutely try to meta-game your prediction rule. They will ask you explicitly how you are generating the predictions. You should have a stock answer ready that is true but unhelpful, such as I am using a deterministic algorithm based on your behavioral history. If a student figures out the lagged heuristic, they will simply switch cities every round and survive every round after the first. This breaks the game. To prevent this without lying, you should introduce a rule in round three that Death updates the algorithm. Or, more simply, you can acknowledge in the debrief that this is exactly the problem: if the predictor is only looking at the past, you can beat them, but the philosophical case assumes a predictor who sees the *current* causal output of your decision process. You will need to supply this feature by hand in the last ten minutes. You cannot simulate a perfect predictor with index cards, so you must stipulate in the debrief that in the real case, even the randomization would have been predicted. The game is a metaphor for the logical structure, not a perfect emulation of the metaphysics.

  Another predictable failure is that a student will refuse to play along, perhaps arguing that the game is rigged or that they choose not to choose. This is actually a fantastic teaching moment if you handle it gently. Do not force them to play. Let them sit out and observe. In the debrief, you can point out that refusing to choose is itself a choice that Death could predict. If they say they are opting out of the game, ask them if Death could predict that opt-out. This usually brings them back into the logical trap. If they are disruptive, remind them that the points count toward participation and that engaging with the simulation is part of the assessment, but keep the tone light so it does not become a power struggle.

  For the debrief, you have about fifteen minutes at the end. Do not start by naming the theories. Start by asking them to describe the feeling of the third round. Someone will say it felt like whatever they picked was wrong. Map this directly to the concept of ratifiability. Ask them if there was any choice they could have made that they would have been happy with once they made it. The answer is no. Explain that causal decision theory tells them to choose the option that causes the best outcome, but because their choice is evidence of Death's location, every choice causes death in their estimation. This is the gap between evidence and causal influence. They were treating their choice as evidence of where Death was, which is the evidential reasoning, but they were trying to causally evade Death. The instability they felt is the causal reasoner realizing that their choice provides evidence that undermines the causal efficacy of the choice. When you introduce the names, tell them that evidential decision theory might suggest a mixed strategy or accepting the inevitability, while causal decision theory leaves them in this loop of regret. The randomization option they could buy is the causal reasoner's attempt to sever the link, but as you stipulated, if Death predicts the mix, it fails. This is the limit of the game you must supply by hand: in the classroom, you could not actually predict their die roll, but in the thought experiment, the predictor is perfect. You must tell them that the philosophical force of the case relies on that impossibility of outsmarting the prediction, which the game only approximates.

  Finally, regarding the three options versus two. You wanted three to create a cycle. As I said, you will not get a cycle. You will get a diffusion of anxiety. With two options, they feel a binary trap. With three, they feel a maze. The benefit of the third option is that it prevents them from settling into a simple switching strategy as easily. It makes the search for a safe haven feel more futile. Use this in the debrief. Ask them if having a third city made them feel safer. They will say no. That is the point. The problem is not a lack of options; it is the structure of the prediction. If you try to force a cycle where A beats B and B beats C, you will confuse them about whether the problem is the prediction or the payoffs. Keep the payoffs symmetric. The instability comes from the mirror, not the prizes. I think this design will give you the thrashing you want without requiring technology you do not have, and it leaves you enough time to connect the visceral experience back to the dry arguments in the reading. Good luck with the seminar, and do let me know how the students react to the envelopes.
