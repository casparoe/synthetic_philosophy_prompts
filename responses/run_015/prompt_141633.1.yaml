          1.  Intro/Agreement on design.
          2.  The Setup (Prediction mechanism via poll).
          3.  The Game Rules (3 cities, costs, rounds).
          4.  The Honesty Check (Will the cycle appear? No, it's instability, not cycles. Adjust expectation).
          5.  The Debrief (Mapping to CDT/EDT).
          6.  Predictable Failures (Meta-gaming, refusal).
          7.  Limitations (Cannot simulate perfect prediction).

  6.  **Refining the "Cycle" Issue:**
      *   I need to be firm here. A 3-option Death in Damascus does not produce a preference cycle (A>B>C>A). It produces a set of options that are all *unratifiable*. If I tell them to expect a cycle, they will be confused when they don't find one. I will advise them to look for *universal regret* instead.
      *   However, I can introduce a payoff asymmetry to *create* a cycle if I really want to, but that changes the problem to a different game. I will advise against it. The philosophical gold is the *instability*, not the cycle. I will tell the user to drop the expectation of a cycle and focus on the "no safe harbor" feeling.

  7.  **Refining the Prediction Mechanism:**
      *   Pre-class poll is good. It makes the prediction *causally independent* of the current choice (like the past).
      *   I need to tell the user how to handle the envelopes. I write the prediction on a card, seal it. Student opens it *after* they choose? No, Death knows beforehand.
      *   Mechanism: I hold the envelopes. They submit choice. I reveal prediction. If Match -> Death.
      *   To make it feel like *their* prediction: I use the poll data. If they didn't answer the poll, I use a default (e.g., City A).

  8.  **Refining the Randomization/Pre-commitment:**
      *   Randomization: They can pay 2 points to roll a die. 1-2 City A, 3-4 City B, 5-6 City C.
      *   Pre-commitment: They can pay 1 point to seal their choice in an envelope *before* deliberation time? No, that doesn't help against a predictor who knows the pre-commitment.
      *   Actually, the point of pre-commitment in philosophy is often to bind oneself to change the causal structure. But here Death predicts the pre-commitment too.
      *   Let's simplify: They can pay points to "Shuffle" (randomize). The key lesson is that if Death predicts the *strategy* (including the randomization), you still die 1/3 of the time (or whatever the prob is).
      *   Wait, if Death predicts the *outcome* of the randomization, you still die. If Death predicts the *strategy*, and the strategy is mixed, Death matches the distribution? No, Death matches the specific action.
      *   If I commit to a mixed strategy, and Death knows I committed to a mixed strategy, can Death predict the outcome? In the thought experiment, yes. In the classroom, no.
      *   I need to be honest about this limitation. The classroom game cannot simulate perfect prediction of random events. I will have to stipulate this in the debrief.

  9.  **Structuring the Prose:**
      *   Start with a greeting and acknowledgment of the challenge.
      *   Move into the design commitment.
      *   Explain the prediction mechanism (Poll + Envelopes).
      *   Explain the 3-city setup and costs.
      *   Address the "Cycle" expectation honestly.
      *   Walk through the flow of the 75 minutes.
      *   Discuss the debrief mapping.
      *   Discuss failure modes (meta-gaming, refusal).
      *   Discuss the fundamental limitation (perfect prediction).
      *   Closing.

  10. **Checking Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold/tables? Yes.
      *   One design? Yes.
      *   Address the cycle honesty? Yes.
      *   Address failures? Yes.
      *   Address limitations? Yes.

  11. **Drafting - Mental Check on Flow:**
      *   Make sure I don't slip into bullet points when listing rules. Use sentences like "The first rule is..."
      *   Ensure the tone is collaborative but authoritative.
      *   Make sure the "Three Options" twist is integrated but the "Cycle" expectation is managed.

  12. **Final Polish:**
      *   Check for any accidental formatting.
      *   Ensure the word count is sufficient to be detailed but not rambling.
      *   Verify the "no lecture up front" constraint is respected in the design.

