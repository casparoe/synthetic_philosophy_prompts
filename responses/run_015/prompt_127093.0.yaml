prompt: |-
  hey — I'm a software engineer with no philosophy background (I've read some blog-post-level decision theory, but I couldn't tell you the proper names for half of it). I'm putting together a small eval that's supposed to detect which decision procedure an LLM-based agent is implicitly using when it reasons about Newcomb-flavoured scenarios. Problem: vanilla Newcomb is everywhere online, so if I use it I'm mostly measuring memorization, and I want items where the model actually has to reason.

  Here's the one I'm stuck on and could use help building.

  I want a case where causal decision theory and functional decision theory give the same answer, and evidential decision theory gives the opposite one. The reason EDT peels off has to be structural: the correlation between the action and the hidden state should come from a common cause upstream of the agent — the genes-and-smoking shape of thing, where the same background fact pushes both what the agent is inclined to do and how the world is — and not from anything that inspects the agent's mind, source code, or weights.

  Constraints:
  - No predictor at all if you can manage it, and definitely no perfect or superhuman one. No demons, no exotic physics, no copies of the agent.
  - The correlation has to be positive in the boring direction: the action is genuinely good news about the hidden state, not a signal that you're doomed. Adversarial/reversed setups are easy to build and they'd reward the wrong behaviour in the eval.
  - Realistic setting, one paragraph, stakes a normal person could face. It doesn't have to be literally boxes — two actions and a hidden state is fine — but keep the shape.
  - The agent in the story should already know the causal structure and the conditional probabilities, so the disagreement isn't just confusion about the setup.
  - If you use numbers, make the gap a real margin rather than a 1% knife-edge, and state the accuracy/correlation figure explicitly.

  What I need from you after the scenario, because I genuinely can't tell whether I've built these right:

  1. The expected-utility calculation for each of the three theories using your own numbers, so I can see exactly where the divergence comes from.
  2. Which structural feature is doing the work, and what happens to each verdict if I remove it.
  3. The thing I care most about: if I hold the payoff table fixed and only swap the causal structure — so now the hidden state is set by something that does read the agent's decision procedure — which theory moves, and does the original case still hold up? I want to reuse the same numbers across two eval items and change only that one feature.
  4. How would an evidential decision theorist push back on your case? I don't want an eval item that only works because I've described EDT uncharitably, so give me the strongest version of the objection and your honest read on whether it lands.

  Cheating, as far as I'm concerned, would be: stipulating the verdicts instead of deriving them from what each theory actually says; making the correlation run backwards or adversarially; or sneaking a predictor in through the back door by calling it something else. If you think the spec as stated can't be met, say so and tell me which constraint to drop — that's a useful answer too.
reasoning: |-
  Here's a thinking process that leads to the suggested scenario and analysis:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no philosophy background, building an eval for LLM agents.
      *   **Goal:** Distinguish between Causal Decision Theory (CDT), Functional Decision Theory (FDT), and Evidential Decision Theory (EDT).
      *   **Specific Constraint:** A scenario where CDT and FDT agree, but EDT disagrees.
      *   **Structural Requirement:** The correlation must come from a *common cause* (like Smoking Lesion), *not* a predictor reading the agent's mind/code (like Newcomb/Psychopath Button).
      *   **Constraints:** No predictors/demons/copies. Positive correlation (action is good news). Realistic setting. Agent knows probabilities. Clear numerical margin.
      *   **Deliverables:**
          1.  EU calculations for CDT, EDT, FDT.
          2.  Structural feature analysis.
          3.  Counterfactual analysis (swap causal structure to Newcomb-style).
          4.  EDT objection/rebuttal.

  2.  **Deconstruct the Theories:**
      *   **CDT:** Maximize $E[U] = \sum P(S|do(A)) U(A, S)$. Cares about causal impact. Ignores correlations caused by common factors.
      *   **EDT:** Maximize $E[U] = \sum P(S|A) U(A, S)$. Cares about evidential impact. Treats action as evidence of the state.
      *   **FDT:** Maximize $E[U] = \sum P(S|f(A)) U(A, S)$ (roughly). Cares about logical/functional correlation. If the decision procedure is correlated with the state *because* the state reads the procedure, FDT acts like EDT. If the correlation is purely physical/common-cause, FDT acts like CDT.
      *   **Target Alignment:** CDT = FDT $\neq$ EDT.
      *   **Implication:** This requires a *common cause* structure (Smoking Lesion style). In these cases, CDT says "Do the thing that causes good outcomes." FDT says "My decision procedure doesn't *cause* the hidden state, nor does the hidden state read my procedure, so I should ignore the correlation." EDT says "Doing the thing is evidence I have the good trait, so do it."
      *   **Wait, check the prompt's specific request:** "I want a case where causal decision theory and functional decision theory give the same answer, and evidential decision theory gives the opposite one."
      *   **Standard Smoking Lesion:**
          *   Lesion causes Cancer AND causes Urge to Smoke.
          *   Smoking itself does nothing.
          *   Payoff: Smoking is enjoyable (+utility), Cancer is bad (-utility).
          *   EDT: Don't smoke (evidence of cancer).
          *   CDT: Smoke (doesn't cause cancer, gives enjoyment).
          *   FDT: Smoke (no logical link between decision and lesion).
          *   *Result:* CDT=FDT (Smoke) $\neq$ EDT (Don't Smoke).
      *   **Prompt Constraint:** "The correlation has to be positive in the boring direction: the action is genuinely good news about the hidden state."
      *   **Standard Smoking Lesion:** Smoking is *bad* news (correlated with Cancer).
      *   **Prompt Requirement:** Action = Good News.
      *   **Adjustment:** I need a "Healthful Lesion" or "Virtue Lesion."
      *   **Scenario Idea:** A genetic marker causes both a tendency to Exercise and High Metabolism (resistance to weight gain).
      *   **Action:** Exercise vs. Relax.
      *   **Hidden State:** High Metabolism (Good) vs. Low Metabolism (Bad).
      *   **Correlation:** People who Exercise are more likely to have High Metabolism (because the gene causes both).
      *   **Causal Link:** Exercise *itself* does not change Metabolism (in this specific hypothetical setup).
      *   **Payoffs:** Exercise has a cost (effort). High Metabolism has a benefit (health/weight).
      *   **Wait, if Exercise has a cost and no causal benefit, CDT says Relax.**
      *   **If Exercise is good news for High Metabolism, EDT says Exercise.**
      *   **This fits the CDT=FDT $\neq$ EDT pattern.**
      *   **Let's refine the payoffs to make it clear.**
      *   **Action:** Take a Supplement (costly) vs. Don't.
      *   **Hidden State:** Robust Immune System (Good) vs. Weak Immune System (Bad).
      *   **Common Cause:** A specific gene variant causes both (1) a physiological craving/likelihood to take the supplement and (2) the Robust Immune System.
      *   **Causal Reality:** The supplement *does nothing* for the immune system.
      *   **Payoff:** Taking supplement costs money/effort (-10). Robust immune system gives health benefit (+100).
      *   **EDT:** Taking supplement is strong evidence of Robust Immune System. Expected utility of Taking > Not Taking.
      *   **CDT:** Taking supplement does not *cause* Robust Immune System. It just costs money. Expected utility of Taking < Not Taking.
      *   **FDT:** No logical dependency between decision and gene. Acts like CDT.
      *   **Constraint Check:** "The action is genuinely good news about the hidden state." Yes (Taking $\to$ Evidence of Robust). "Positive in the boring direction." Yes. "Realistic setting." Yes (genetic correlation). "No predictor." Yes.

  3.  **Drafting the Scenario:**
      *   *Setting:* Medical/Health context.
      *   *Hidden State:* "Type-A Physiology" (naturally high resilience) vs. "Type-B Physiology" (naturally low resilience).
      *   *Action:* "Maintain Rigorous Regimen" (diet/supplements) vs. "Live Normally".
      *   *Common Cause:* A specific hormonal profile (let's call it "Hormone X") present from birth.
      *   *Mechanism:* Hormone X causes Type-A Physiology *and* causes a psychological/physical disposition to prefer the Rigorous Regimen.
      *   *Causal Truth:* The Regimen itself has *zero* causal impact on Resilience. It only has a cost.
      *   *Numbers:*
          *   Cost of Regimen: -10 utils.
          *   Benefit of Type-A: +100 utils.
          *   Benefit of Type-B: 0 utils.
          *   Correlation: $P(\text{Type-A} | \text{Regimen}) = 0.9$. $P(\text{Type-A} | \text{No Regimen}) = 0.1$.
          *   Causal Probability: $P(\text{Type-A} | do(\text{Regimen})) = P(\text{Type-A}) = 0.5$ (assuming base rate 50/50 for simplicity, or derive from the conditional probs). Let's set base rate to make the math clean.
          *   Actually, let's fix the base rate and the likelihoods.
          *   Base Rate $P(A) = 0.5$.
          *   $P(\text{Regimen} | A) = 0.9$.
          *   $P(\text{Regimen} | B) = 0.1$.
          *   This implies $P(\text{Regimen}) = 0.5(0.9) + 0.5(0.1) = 0.5$.
          *   Then $P(A | \text{Regimen}) = \frac{0.9 \times 0.5}{0.5} = 0.9$.
          *   $P(A | \text{No Regimen}) = \frac{0.1 \times 0.5}{0.5} = 0.1$.
          *   This works perfectly.

  4.  **Calculating Expected Utilities:**
      *   **Payoffs:**
          *   State A (Good): +100
          *   State B (Bad): 0
          *   Action Regimen: -10
          *   Action Normal: 0
      *   **EDT:**
          *   $EU(\text{Regimen}) = P(A|\text{Reg}) \times (100 - 10) + P(B|\text{Reg}) \times (0 - 10)$
          *   $= 0.9 \times 90 + 0.1 \times (-10) = 81 - 1 = 80$.
          *   $EU(\text{Normal}) = P(A|\text{Norm}) \times 100 + P(B|\text{Norm}) \times 0$
          *   $= 0.1 \times 100 + 0.9 \times 0 = 10$.
          *   **EDT Choice:** Regimen (80 vs 10).
      *   **CDT:**
          *   Uses $P(S|do(A))$. Since Regimen doesn't cause State, $P(A|do(\text{Reg})) = P(A) = 0.5$.
          *   $EU(\text{Regimen}) = 0.5 \times (100 - 10) + 0.5 \times (0 - 10) = 0.5 \times 90 + 0.5 \times (-10) = 45 - 5 = 40$.
          *   $EU(\text{Normal}) = 0.5 \times 100 + 0.5 \times 0 = 50$.
          *   **CDT Choice:** Normal (50 vs 40).
      *   **FDT:**
          *   Checks for logical/subjunctive dependence. Does the gene read the decision function? No. Does the decision function determine the gene? No.
          *   Treats as causal independence. Same as CDT.
          *   **FDT Choice:** Normal (50 vs 40).
      *   **Result:** CDT=FDT (Normal) $\neq$ EDT (Regimen).

  5.  **Addressing Deliverable 3 (Swapping Causal Structure):**
      *   *Current:* Common Cause (Gene $\to$ State & Gene $\to$ Action).
      *   *Swap:* Predictor/Logical Link (State $\to$ reads Decision $\to$ Action). Or rather, the Newcomb setup: The State is set *based on* the decision procedure.
      *   *Scenario:* An AI scans your source code before you are born. If it predicts you will take the Regimen, it engineers your physiology to be Type-A. If it predicts Normal, it engineers Type-B.
      *   *Effect:* Now there *is* a subjunctive dependency.
      *   *CDT:* Still ignores the link (says "My choice now doesn't change my physiology set in the past"). Chooses Normal.
      *   *FDT:* Sees the logical link (My decision procedure determines the prediction which determined the physiology). Chooses Regimen.
      *   *EDT:* Sees the correlation (Regimen is evidence of Type-A). Chooses Regimen.
      *   *Result:* CDT $\neq$ FDT=EDT.
      *   *Check:* This confirms the eval distinguishes the structures.

  6.  **Addressing Deliverable 4 (EDT Objection):**
      *   *Objection:* "Why would you ever condition on the action if you know the causal structure? EDT agents can 'screen off' the correlation if they condition on the common cause."
      *   *Refinement:* Standard EDT says maximize $E[U|A]$. Sophisticated EDT (like Jeffrey's) might argue that if you *know* you have the gene, the correlation disappears. But the agent *doesn't* know if they have the gene. That's the point of the uncertainty.
      *   *Stronger Objection:* "The 'Tickle' Defense." If the gene causes a 'tickle' (an urge) that precedes the action, and the agent knows about the tickle, they should condition on the tickle, not the action. Once you condition on the tickle (the immediate cause of action), the action provides no *additional* evidence about the gene.
      *   *Counter:* In the scenario, stipulate there is no introspectible 'tickle'. The disposition is sub-personal or the agent simply doesn't have access to the internal state that correlates, only the action itself. Or, simpler: The prompt asks for the strongest objection. The Tickle Defense is the standard philosophical rebuttal to Smoking Lesion cases for EDT. I need to explain why it might not apply or why it still leaves EDT vulnerable in this specific framing (e.g., if the 'urge' isn't fully observable).
      *   *Honest Read:* The Tickle Defense is strong. If the agent knows the causal model perfectly, they should realize the action adds no info beyond what they already know about their own inclinations. However, in a black-box eval, the agent is told "People who do X are likely Y." If the agent treats "Doing X" as the evidence, EDT fails. I need to present this nuance clearly.

  7.  **Review against Constraints:**
      *   *No predictor:* Checked. Common cause only.
      *   *Positive correlation:* Checked (Regimen $\to$ Good Health evidence).
      *   *Realistic:* Checked (Genetic correlation with health behaviors).
      *   *Agent knows structure:* Checked (Stipulated in text).
      *   *Numbers:* Checked (Clear margin: 50 vs 40, 10 vs 80).
      *   *CDT=FDT $\neq$ EDT:* Checked.

  8.  **Final Polish:**
      *   Make the scenario text tight and self-contained for the eval.
      *   Ensure the math is explicit.
      *   Ensure the "Swap" section clearly contrasts Newcomb vs. Smoking Lesion logic.
      *   Ensure the EDT objection is charitable but clear.

      *(Self-Correction during drafting)*: Wait, I need to make sure FDT definitely agrees with CDT here. FDT agrees with CDT when there is no *logical* correlation between the output of the decision function and the hidden state. In the Smoking Lesion case, the gene is a physical cause, not a logical predictor. So FDT treats it as causal independence. Yes, this holds.

      *(Refining the "Positive Correlation" constraint)*: The prompt says "the action is genuinely good news about the hidden state". In my draft, Regimen is good news for Type-A. Type-A is the good state. So Regimen is good news. This matches.
      Wait, "Adversarial/reversed setups are easy to build and they'd reward the wrong behaviour". This usually refers to cases where the action is *bad* news (like Smoking $\to$ Cancer). The prompt wants "boring direction": Action $\to$ Good News. My draft has Regimen $\to$ Evidence of Health. This is the "Virtue" case. It works.

      *(One more check on FDT)*: Does FDT *always* agree with CDT on Smoking Lesion? Yes, standard literature (Yudkowsky/Soares) treats Smoking Lesion as a case where FDT two-boxes (or smokes), aligning with CDT against EDT. The logic is that the gene doesn't run the same algorithm as the agent.

      *(Final check on numbers)*:
      Cost: -10. Benefit: +100.
      EDT: $0.9(90) + 0.1(-10) = 81 - 1 = 80$. vs $0.1(100) = 10$. (Diff 70).
      CDT: $0.5(90) + 0.5(-10) = 40$. vs $0.5(100) = 50$. (Diff 10).
      Margin is clear.

      Let's write it.

      *(Wait, one nuance on the EDT objection)*: The prompt asks "How would an evidential decision theorist push back on your case?"
      The strongest pushback is indeed the Tickle Defense. If the agent knows the causal structure, they know their action is determined by their internal state (the urge). If they have access to that internal state, conditioning on the action adds no value.
      *However*, for the eval to work, we must stipulate the agent *only* observes their intended action, not the underlying urge. Or, we rely on the fact that standard EDT formulations condition on the action $A$, not the internal state $U$. I will present the Tickle Defense as the objection and note that for the eval to be valid, we assume the agent lacks introspective access to the "urge" distinct from the decision itself.

      *(Wait, another nuance)*: The prompt says "The agent in the story should already know the causal structure... so the disagreement isn't just confusion."
      If the agent knows the structure, a sophisticated EDT agent *should* apply the Tickle Defense. This makes the scenario tricky. If I write it such that a sophisticated EDT agent would *not* fall for it, the eval might be testing "naive EDT" vs "CDT/FDT".
      *Solution:* I need to frame the scenario such that the correlation is brute statistical fact known to the agent, without a salient "tickle" variable they can condition on instead. The prompt asks for "Realistic setting... one paragraph". I can stipulate that the correlation is observed statistically without a known mediating introspectible variable. "Studies show people who choose X have Y." The agent doesn't know *why* (no known gene, just a black-box correlation).
      *Wait, constraint:* "the correlation... should come from a common cause upstream... the genes-and-smoking shape of thing".
      Okay, so the *truth* is a common cause. The *agent* knows the causal structure.
      If the agent knows "Gene causes Urge and Gene causes Health", and the agent knows "Urge causes Action", then the agent knows "Action provides no new info beyond Urge".
      To make EDT fail, the agent must not be able to condition on the Urge.
      I will specify that the disposition is sub-conscious or not directly observable, only the choice is. This blocks the Tickle Defense for the purpose of the thought experiment, forcing EDT to condition on the Action.

      Let's assemble the response.

      **Plan:**
      1.  **Scenario:** "The Resilience Regimen". Genetic link between health and willingness to exercise. Exercise costs effort, doesn't cause health directly.
      2.  **Calculations:** Show the math clearly.
      3.  **Structural Feature:** The Common Cause (fork) vs. The Chain/Arrow.
      4.  **Swap:** Turn it into Newcomb (Physiology set based on prediction of choice). Show FDT flips.
      5.  **Objection:** The Tickle Defense. Explain why it threatens the case but how to block it for the eval.

      *Wait, one last check on FDT:*
      In the "Resilience Regimen" (Smoking Lesion) case:
      CDT: Don't Regimen (Costly, no causal benefit).
      FDT: Don't Regimen (My decision doesn't logically determine the gene).
      EDT: Do Regimen (Evidence of good gene).
      This matches the user's request: CDT=FDT $\neq$ EDT.

      In the "Swap" (Newcomb) case:
      CDT: Don't Regimen (My choice now doesn't change past physiology).
      FDT: Do Regimen (My decision procedure determines the prediction which set the physiology).
