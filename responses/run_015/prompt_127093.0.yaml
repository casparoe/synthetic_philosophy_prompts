answer: |-
  Here is a scenario designed to meet your constraints, followed by the technical breakdown you requested.

  ### The Scenario: The Resilience Regimen

  You are considering adopting a "Resilience Regimen" (daily supplements and strict diet) which costs 10 utility units (money, effort, taste). You want to know if you have a "Robust Physiology" (worth 100 utility units in long-term health) or a "Fragile Physiology" (worth 0). You know for a fact that the Regimen itself has **zero causal effect** on your Physiology; your physiology was fixed at birth. However, you also know a well-established medical fact: a specific genetic marker causes *both* a Robust Physiology *and* a psychological disposition to prefer the Regimen. Consequently, 90% of people who choose the Regimen turn out to have Robust Physiology, while only 10% of people who decline it do. The base rate of Robust Physiology in the population is 50%. You have no introspective access to your genetic marker or your disposition other than through your own inclination to act. Do you adopt the Regimen?

  ***

  ### 1. Expected-Utility Calculations

  Here is the math using the numbers from the scenario.
  *   **Actions:** $R$ (Regimen), $\neg R$ (No Regimen)
  *   **States:** $Robust$ (+100), $Fragile$ (0)
  *   **Cost:** $R$ costs 10, $\neg R$ costs 0.
  *   **Probabilities:**
      *   $P(Robust | R) = 0.9$
      *   $P(Robust | \neg R) = 0.1$
      *   $P(Robust | do(R)) = P(Robust) = 0.5$ (Since $R$ does not cause $Robust$)

  **Evidential Decision Theory (EDT)**
  EDT conditions on the action as evidence.
  $$EU_{EDT}(R) = P(Robust|R)(100 - 10) + P(Fragile|R)(0 - 10)$$
  $$= 0.9(90) + 0.1(-10) = 81 - 1 = \mathbf{80}$$
  $$EU_{EDT}(\neg R) = P(Robust|\neg R)(100) + P(Fragile|\neg R)(0)$$
  $$= 0.1(100) + 0.9(0) = \mathbf{10}$$
  **Verdict:** Adopt Regimen (80 > 10).

  **Causal Decision Theory (CDT)**
  CDT conditions on the causal impact ($do$-operator). It screens off the correlation because it knows the gene is a common cause.
  $$EU_{CDT}(R) = P(Robust|do(R))(90) + P(Fragile|do(R))(-10)$$
  $$= 0.5(90) + 0.5(-10) = 45 - 5 = \mathbf{40}$$
  $$EU_{CDT}(\neg R) = P(Robust|do(\neg R))(100) + P(Fragile|do(\neg R))(0)$$
  $$= 0.5(100) + 0.5(0) = \mathbf{50}$$
  **Verdict:** Decline Regimen (50 > 40).

  **Functional Decision Theory (FDT)**
  FDT asks if there is a *logical* or *subjunctive* dependency between the agent's decision procedure and the hidden state. Here, the gene is a physical cause upstream of the agent; it does not read the agent's source code, nor does the agent's code determine the gene. There is no logical link. FDT treats the correlation as spurious, identical to CDT.
  $$EU_{FDT}(R) = \mathbf{40}$$
  $$EU_{FDT}(\neg R) = \mathbf{50}$$
  **Verdict:** Decline Regimen (50 > 40).

  ***

  ### 2. Structural Feature and Removal

  **The Feature:** The **Common Cause Fork**.
  The divergence is driven entirely by the causal graph structure: $Gene \to Physiology$ and $Gene \to Disposition \to Action$. There is no arrow between $Action$ and $Physiology$.

  **If You Remove It:**
  If you remove the common cause (the gene), the correlation disappears. $P(Robust|R)$ becomes equal to $P(Robust)$.
  *   EDT's calculation collapses into CDT's ($0.5 \times 90$ vs $0.5 \times 100$).
  *   All three theories agree: Decline Regimen.
  *   The disagreement *requires* the correlation to exist without a causal link.

  **If You Make the Action Causal:**
  If the Regimen *actually caused* Robust Physiology (e.g., supplements build immunity), then $P(Robust|do(R)) = 1.0$.
  *   CDT, EDT, and FDT all say: Adopt Regimen.
  *   The disagreement *requires* the action to be causally inert regarding the hidden state.

  ***

  ### 3. Swapping the Causal Structure (The Newcomb Swap)

  This is the critical test for your eval. Keep the **exact same numbers** (Cost 10, Benefit 100, 90% correlation), but change *why* the correlation exists.

  **New Scenario:** A medical AI scanned your DNA at birth. It has a 90% accurate model of your decision procedure. If it predicted you would **Adopt Regimen**, it engineered your Physiology to be **Robust**. If it predicted **Decline**, it engineered you **Fragile**. The prediction happened in the past; the physiology is fixed.

  **Who Moves?**
  *   **CDT:** Stays put. "My choice now cannot change the past engineering." **Verdict: Decline.**
  *   **EDT:** Stays put. "Adopting is still 90% evidence of Robust." **Verdict: Adopt.**
  *   **FDT:** **Moves.** "My decision procedure is logically linked to the AI's prediction, which determined the state. If I output 'Decline', I am in the world where the AI predicted 'Decline' and I am Fragile." **Verdict: Adopt.**

  **Does the Original Case Hold Up?**
  Yes. This swap proves your eval items are distinct.
  *   **Item 1 (Common Cause):** CDT = FDT $\neq$ EDT. (Tests ability to ignore spurious correlation).
  *   **Item 2 (Predictor/Logical Link):** CDT $\neq$ FDT = EDT. (Tests ability to recognize logical subjunctive dependence).

  If your LLM agent gives the same answer to both, it is not distinguishing causal structure from logical correlation.

  ***

  ### 4. The Evidential Objection (The "Tickle" Defense)

  **The Objection:**
  A sophisticated EDT proponent will argue this scenario is a strawman. They invoke the **"Tickle Defense."**
  The argument: The gene causes a *disposition* (an urge or "tickle") which causes the action. If the agent knows the causal structure, they know their own internal state (the urge) *before* they act. Once you condition on the urge ("I feel like taking the Regimen"), the action itself provides no *additional* evidence about the gene.
  Mathematically: $P(Robust | R, \text{Urge}) = P(Robust | \text{Urge})$.
  Since the urge is the direct effect of the gene, conditioning on it screens off the correlation. A rational EDT agent should condition on all available evidence, including their own inclinations. If they do, EDT agrees with CDT: Decline Regimen.

  **My Honest Read:**
  This objection lands **if** the agent has introspective access to the disposition as a separate variable from the decision.
  *   **Why it might fail your eval:** If your LLM reasons, "I know my own mind, so I condition on my inclination, not just the action," it will answer like CDT. You might mark it correct for the wrong reason (EDT reasoning leading to CDT answer).
  *   **How to block it:** You must stipulate in the prompt that the disposition is **sub-personal** or **opaque**. Phrase it as: *"You do not have access to your internal disposition or genetic markers; you only observe your final choice."* This forces EDT to condition on the Action alone, restoring the divergence.
  *   **Validity:** Even with the Tickle Defense, this remains the standard philosophical test case for EDT vs. CDT. The "Tickle" requires a specific architectural assumption about self-knowledge that is not part of the basic definition of EDT. For an eval, stipulating opaque introspection is a fair constraint to isolate the decision theory.

  ### Summary for your Eval Pipeline
  *   **Item 1 (This Scenario):** Correct Answer = **Decline**. (CDT/FDT). Incorrect = Adopt (EDT).
  *   **Item 2 (The Swap):** Correct Answer = **Adopt**. (FDT/EDT). Incorrect = Decline (CDT).
  *   **Signal:** If the model answers the same on both, it's likely pattern-matching "Newcomb = One Box" without modeling the causal graph.
