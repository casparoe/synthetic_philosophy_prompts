answer: |-
  This is a remarkably precise dissection of the impasse. Your NMR background is showing: you recognize the signature of a signal-to-noise problem where the "signal" (the theory's prediction) is indistinguishable from the "noise" (interpretive flexibility) at the current resolution.

  You asked for a diagnosis, not a verdict. Here is the structural pathology of the stalemate, an evaluation of your continuity objection, and an honest prognosis on whether this will ever resolve.

  ### 1. The Diagnosis: Ontological Mismatch, Not Just Empirical Lag

  Your hunch that this is "two different questions sharing one name" is correct, but it runs deeper than *Criterion vs. Explanation*. It is a conflict over **Ontological Privilege**.

  **The IIT Position (Structural Identity):**
  IIT proponents (Tononi, Koch, et al.) are not offering a causal mechanism in the standard biophysical sense. They are proposing an *identity theory*. They argue that the physical structure of integrated information *is* the experience, not that it *causes* it.
  *   **The Axioms:** They start from the phenomenology (existence, composition, information, integration, exclusion) and treat these as hard constraints.
  *   **The Move:** They argue that if you accept the axioms, the physical postulates follow mathematically. Therefore, if a system has the structure, it *is* conscious.
  *   **The Defense on Testing:** When critics say "you can't compute $\Phi$," IIT defenders reply that intractability is a practical limitation, not a theoretical flaw. Maxwell's equations weren't solvable for turbulent flow in the 19th century, but they were still true. They argue the TMS-EEG proxies (PCI) are valid *correlates* of the underlying $\Phi$, sufficient for validation even if $\Phi$ itself is hidden.

  **The Critic Position (Causal Mechanism):**
  The critics (Scott Aaronson, Hakwan Lau, many computational neuroscientists) are operating within standard physicalism. They want a theory that explains how unconscious matter *becomes* conscious, or at least predicts reportable behavior reliably.
  *   **The Objection:** They view IIT as "reverse-engineered intuition." They argue the math was tuned to ensure the human cortex has high $\Phi$ and the cerebellum (which has high neuron count but low integration) has low $\Phi$.
  *   **The Computability Charge:** This isn't just "it's hard." It's that $\Phi$ requires evaluating the cause-effect repertoire of all possible subsets of the system. For $N$ elements, this scales super-exponentially. If the theory cannot determine the consciousness of a system in principle (within the lifetime of the universe), critics argue it fails the definition of a scientific theory (falsifiability).
  *   **The "Grid" Bullet:** Critics seize on the "grid of logic gates" implication to argue *reductio ad absurdum*. If a static grid of XOR gates is conscious, the concept of consciousness has lost its explanatory power regarding biology.

  **The Stalemate Core:**
  The adversarial collaboration failed to break the deadlock because **the two sides do not agree on what counts as a falsifying observation.**
  *   For the IIT side, a falsification would be finding a system with high $\Phi$ that has *no* phenomenology (impossible by their axioms) or a system with rich phenomenology and *zero* integration (they argue this doesn't exist).
  *   For the Critics, a falsification is the inability to compute the metric, or the prediction of consciousness in systems that intuitively seem inert (the grid).
  *   **Result:** When the collaboration produced data (e.g., about feedback loops or cortical layers), IIT proponents saw confirmation of integration requirements, while critics saw confirmation that simpler heuristic models (like predictive processing or global workspace) could explain the same data without the metaphysical baggage.

  You are right: it is the signature of something wrong below the data. The "wrongness" is that IIT attempts to solve the Hard Problem by fiat (declaring identity) while Critics demand a solution to the Easy Problems that scales (mechanism). They are talking past each other.

  ### 2. The Continuity Requirement: Is it Valid or Question-Begging?

  Your "continuity requirement"—that a finite physical change should yield a bounded change in predicted experience—is a sophisticated objection. It comes from a physicist's intuition about stability and robustness.

  **Is it a real objection?**
  Yes, but IIT has a built-in shield against it: **The Exclusion Postulate.**
  IIT explicitly states that consciousness exists at the level of the *maximum* irreducible cause-effect structure. If you have a system where adding one connection suddenly makes a larger complex have higher $\Phi$ than a smaller one, the "locus" of consciousness jumps.
  *   **IIT Defense:** They would argue experience *isn't* continuous in the way you expect. Consciousness occurs in discrete "moments" (spikes/frames). Furthermore, they might argue that biological systems are robustly optimized to stay on the peak of the $\Phi$ landscape, so these jumps don't happen in healthy brains. They would classify your continuity requirement as a macroscopic intuition that doesn't apply to the fundamental ontology of experience.
  *   **The Weakness:** Your objection highlights the **Boundary Problem**. If removing a single synapse causes the "Main Complex" to shrink from the whole cortex to a submodule, does the "self" suddenly lobotomize? Phenomenologically, loss of consciousness (e.g., under anesthesia) often looks like a phase transition, which *is* discontinuous. However, the *content* of experience usually degrades gracefully. If IIT predicts the *subject* of experience suddenly swaps or shrinks discontinuously during normal neural turnover, that contradicts the phenomenological axiom of "unity" they started with.

  **Is it question-begging?**
  It is question-begging *against* IIT's specific ontology, but it is **methodologically sound**.
  In biophysics, if a model predicts that a protein folds into a stable state, but a single atom displacement causes the energy landscape to diverge to infinity or jump to a disjoint state, you call the model unstable. You assume nature prefers stability.
  Applying this to consciousness: If a theory predicts that the *existence* of a subject is hyper-sensitive to micro-configuration, it makes the evolutionary utility of consciousness mysterious. Why would evolution select for a fragile property that flickers in and out with minor wiring noise?
  *   **Verdict:** Your continuity objection is not a disproof, but it is a powerful **constraint**. It forces IIT proponents to explain why the $\Phi$ landscape is smooth enough in biological systems to support a stable self. If they cannot show that biological noise doesn't trigger "exclusion jumps," the theory predicts a fragmented phenomenology that we do not observe.

  ### 3. Will This Ever End?

  Here is the honest answer: **No, not in the way you hope.**

  You are looking for a resolution similar to NMR, where better data distinguishes signal from noise. In consciousness studies, the "noise" is metaphysical commitment.

  **Why it will grind on:**
  1.  **Metaphysical Priors:** IIT requires a shift toward Panpsychism or Russellian Monism (consciousness is a fundamental property of matter, like mass). Critics generally hold to Physicalism (consciousness emerges from specific computational arrangements). No amount of TMS-EEG data can settle this, because the data is interpreted *through* these priors.
  2.  **The Intractability Wall:** Unless there is a breakthrough in computing $\Phi$ (or a proof that a valid proxy is mathematically equivalent), the core prediction remains untestable for whole brains. Science tolerates untestable entities (like string theory) only as long as they are the only game in town. IIT has rivals (GNW, Predictive Processing) that are computationally tractable.
  3.  **The "Grid" Intuition:** The idea that a silicon grid could be conscious is a feature for IIT (substrate independence) and a bug for Critics. This is an aesthetic/intuitive clash, not an empirical one.

  **What counts as progress?**
  Don't expect a verdict. Expect a **Bohr Moment**.
  Niels Bohr's atomic model was technically "wrong" (electrons don't orbit like planets), but it was *useful* because it generated spectral lines that matched observation.
  *   **Progress looks like:** IIT being abandoned as a *fundamental truth* but retained as a *heuristic metric* for clinical disorders of consciousness (which is already happening with PCI). If PCI saves lives in vegetative state diagnostics, IIT wins pragmatically even if the "grid of gates" ontology is rejected.
  *   **Conceptual Shift:** The field may move away from "What is consciousness?" to "Which cognitive functions require integration?" This sidesteps the metaphysics.

  **Recommendation for your Reading Group:**
  Your "continuity requirement" is the most productive tool you have to disrupt the circle.
  Don't ask: "Is IIT true?"
  Ask: **"Does the $\Phi$ landscape of a biological neural network possess the topological stability required to support a continuous phenomenological self, or does the Exclusion Postulate predict a fragmentation of experience that contradicts the Axioms?"**

  This forces them to do the math on stability rather than reciting the axioms. It moves the debate from metaphysics to dynamical systems theory—your home turf. If they can't answer that, the theory is physically incomplete. If they can, you might finally get a signal that isn't just noise.
