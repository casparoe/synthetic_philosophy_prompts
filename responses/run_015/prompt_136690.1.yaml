answer: |-
  The debate over whether "Western values" constitutes a coherent descriptive category or a mere rhetorical boundary marker often stalls because participants talk past one another regarding the nature of coherence itself. Those who defend the term typically rely on a philosophical ontology, positing a transhistorical commitment to abstract principles like individual autonomy or universal human rights. Those who reject the term rightly point out that these principles are neither unique to the West nor consistently applied within it. However, a more productive analytical path lies in an intermediate position: the category possesses limited but real coherence, provided it is reconstructed genealogically rather than philosophically. On this account, "Western values" does not refer to a universal moral truth but to a specific, historically contingent cluster of interlocking institutional practices that emerged from the post-Reformation European state system. This essay defends this genealogical reconstruction, demonstrating how it explains the internal tensions of Western polities, while simultaneously arguing that detaching this cluster from its specific history to serve as a universal normative framework is analytically harmful. Finally, it addresses charges of circularity and Eurocentrism to offer a verdict on the term's utility in contemporary comparative argument.

  To understand the coherence of "Western values," one must cease looking for logical consistency in moral principles and instead look for structural consistency in institutional conflict. The coherence of the category lies not in a shared belief system, but in a shared machinery for managing disagreement. This machinery is composed of three interlocking practices: adversarial legalism, competitive multiparty representation, and a historically particular form of bounded secularism.

  Adversarial legalism refers to a system where policy and rights are not merely legislated but are continuously litigated and defined through courtroom conflict between private actors and the state. Competitive multiparty representation ensures that political power is not harmonized through consensus but is contested through organized factions seeking temporary majorities. Bounded secularism, distinct from both theocracy and radical laïcité, describes the settlement wherein religious authority was subordinated to state sovereignty without being eliminated from public life; the church was stripped of coercive power but retained cultural and organizational influence.

  It is this specific institutional genealogy that explains why the "Western" bundle contains norms that stand in deep internal tension. Consider the coexistence of expansive liberal rights regimes alongside restrictive civic-nationalist immigration policies. Philosophically, universal rights and exclusionary borders are contradictory. Institutionally, however, they are compatible products of the same system: adversarial legalism empowers courts to expand rights claims, while competitive multiparty representation empowers legislatures to enact restrictive borders in response to electoral pressures. The system is designed to allow these contradictions to coexist and be managed procedurally rather than resolved morally. Similarly, the coexistence of secular constitutional frameworks with Christian democratic party traditions is not a logical failure but a feature of bounded secularism. The state claims sovereignty over the church, yet the institutional channel of multiparty competition allows religiously affiliated organizations to capture state power legally. Thus, the category "Western values" has coherence, but it is the coherence of a specific engine of conflict resolution, not the coherence of a moral philosophy. The "values" are simply the sedimented habits of these institutions.

  However, recognizing this genealogical coherence necessitates a stronger claim: once this phrase is detached from its specific post-Reformation European state genealogy and presented as a universal normative framework, it becomes analytically harmful. When "Western values" are invoked as a standard applicable to societies that developed through entirely different institutional trajectories, the category imposes a false taxonomy.

  In East Asian contexts shaped by bureaucratic-Confucian traditions, political legitimacy often derives from administrative competence and social harmony rather than adversarial contestation. In Sub-Saharan African contexts, communal structures may prioritize restorative justice and consensus over adversarial legalism. In South Asia, pluralistic-religious histories have produced forms of secularism that manage diversity through group rights rather than the subordination of religious authority to a unitary state sovereignty. To label these systems as "defective" variants of the Western model because they lack adversarial legalism or bounded secularism is to misunderstand their internal logic. It treats heterogeneous political cultures as deviations from a norm rather than distinct evolutionary paths.

  Furthermore, universalizing this category obscures the ways in which the same institutional practices produced radically divergent moral outcomes. The institutions of competitive representation and bounded secularism facilitated the welfare-state solidarity of the mid-twentieth century, but they also facilitated colonial domination and neoliberal deregulation. The same legalistic frameworks that protected abolitionist movements were used to enforce property rights in enslaved persons. If "Western values" refers to the institutions themselves, then the term cannot distinguish between the emancipatory and the oppressive outcomes those institutions generated. By treating the institutional cluster as a moral good in itself, the universalist usage blinds the observer to the fact that the "West" is not a moral agent but a historical site of contestation where both humanitarianism and imperialism were engineered using the same tools.

  Critics of this genealogical approach often raise two objections: that it is circular, and that it is covertly Eurocentric. The charge of circularity argues that defining the West by practices like adversarial legalism is tautological if those practices are themselves defined as Western. This objection can be met by distinguishing between *trajectory* and *teleology*. A genealogical account does not define these practices as inherently Western by essence; rather, it identifies them as the specific solutions that emerged from the specific conflicts of the European Wars of Religion and the rise of the nation-state. It is a historical claim, not a definitional fiat. One could theoretically find adversarial legalism elsewhere, but if it did not emerge from that specific conflict structure of state-church competition, it would not be part of this specific genealogical cluster. The coherence is causal and historical, not semantic.

  The charge of covert Eurocentrism is more serious. Does privileging this institutional history implicitly validate it as the standard of political development? It does so only if the analysis slides from description to prescription. To distinguish the specific pattern of institutional conflict from its colonial impositions without resorting to essentialist cultural claims, one must treat the Western institutional cluster as *particular* rather than *paradigmatic*. The harm arises not from studying the European trajectory, but from assuming it is the destination of all political development. We can acknowledge the coherence of the Western institutional cluster without accepting its universality. The distinction lies in recognizing that while the West exported these institutions through colonialism, the *legitimacy* of those institutions in non-Western contexts depends on their integration into local historical trajectories, not their fidelity to the European original. A genealogical approach actually mitigates Eurocentrism by historicizing the West, stripping it of its claim to represent universal reason, and reducing it to one historical case study among many.

  This leads to the final verdict on the utility of the phrase "Western values" in contemporary comparative political argument. On the reconstructed account provided here, the category possesses analytical coherence: it accurately describes a specific historical bundle of institutions (adversarial legalism, multiparty competition, bounded secularism) that manage conflict in a distinctive way. However, coherence does not guarantee utility. The phrase "Western values" is linguistically unstable; the word "values" inevitably invites the philosophical universalism that this argument rejects. Even when a scholar intends the term genealogically, the rhetorical baggage of moral superiority and universal applicability tends to reattach itself, reactivating the harmful taxonomy described above.

  Therefore, while the *concept* of a specific Western institutional genealogy is valid and necessary for historical understanding, the *phrase* "Western values" should be abandoned in favor of direct descriptions of institutional forms. Comparative political argument requires precision. Speaking of "adversarial legalism" or "bounded secularism" allows for analysis without the normative slippage inherent in the word "values." It allows us to compare the European trajectory with the Confucian or Communal trajectories without implicitly ranking them. The genealogical reconstruction saves the concept from nonsense, but it cannot save the phrase from its own rhetorical history. To maintain analytical rigor and avoid the trap of false universalism, we must retain the historical analysis of the institutional cluster but discard the label that suggests it represents a moral ontology applicable to all. The West is a place with a history, not a standard for the world.
