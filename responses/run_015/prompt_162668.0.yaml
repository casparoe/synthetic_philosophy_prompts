answer: |-
  This is a high-stakes audit. You are trying to encode a moral distinction that philosophy has struggled with for a century (agent-relative permissions vs. agent-neutral obligations) into a deterministic spec, while sleep-deprived and emotionally invested. The collapse you feel is real: your **Swap Test** (Point 3) is over-generating "Preferences" because it tests for *contingency* (could I have been born otherwise?) rather than *justification* (why do I favor this?).

  Here is the audit of your profile, ranked by severity, followed by the single revision that resolves the system.

  ### The Audit: Clashes Ranked by Severity

  **1. Critical Failure: The Swap Test vs. Nationalism (Points 3 & 6)**
  *   **The Clash:** Your Swap Test defines a "Preference" as something that tracks with your contingent position (e.g., "I'd favor whichever kid I had"). By this metric, Nationalism passes as a Preference ("I'd favor whichever country I was born in"). Yet, your moral intuition (Point 6) flags Nationalism as a Bias.
  *   **Severity:** **Fatal.** If your primary diagnostic tool cannot distinguish between "loving your child" (virtue) and "favoring your compatriots" (suspect bias), it cannot function in an AI spec. The AI will either allow all nationalism or forbid all parenthood.
  *   **What Must Give:** You must abandon the idea that *contingency* equals *permission*. Just because a feeling travels with your role doesn't make the role morally neutral.
  *   **The Cost:** You lose the simplicity of the Swap Test. You need a second-order check to determine *why* the feeling travels with the role.

  **2. High Tension: Debunking vs. Parental Permission (Points 1, 4, & 5)**
  *   **The Clash:** Point 4 accepts the debunking story (evolved responses are suspect). Point 1 & 5 assert parental partiality is valid, even when it overrides saving a stranger's life. But parental love is the *paradigm* of an evolved response. If "identifiable victim" effects are biases to be corrected (Point 5), why is the "identifiable child" effect a permission?
  *   **Severity:** **High.** This threatens your internal coherence as a parent. If you push the debunking argument too hard, you undermine the moral validity of your own care for your daughter.
  *   **What Must Give:** You must limit the scope of the debunking argument. It applies to *claims of objective worth*, not to *assignments of responsibility*.
  *   **The Cost:** You have to accept that some evolved responses are "features" (social cohesion via family) and some are "bugs" (tribalism), without a clean evolutionary line between them.

  **3. Medium Tension: The Magnitude Threshold (Point 5)**
  *   **The Clash:** You allow spending on your child's health over a stranger's life, but not on a holiday over a stranger's life. Both are uses of resources where the "identifiable victim" effect is active. Where is the principled line? Currently, it looks like "I stop when I feel guilty."
  *   **Severity:** **Medium.** This is a boundary problem, not a foundational one. However, for an AI spec, "feel guilty" is not a usable parameter.
  *   **What Must Give:** The justification for the threshold. It cannot be based on the *amount* of money, but on the *type* of need being met.
  *   **The Cost:** You must articulate a theory of "sufficientarian" duties to kin vs. "maximizing" duties to the general good.

  ---

  ### The Missing Distinction

  You suspected the difference lies between "what I'm aiming at" and "how much weight I give." You are correct, but the philosophical terminology that makes this usable for a spec is **Valuation vs. Allocation.**

  *   **Bias (Valuation Error):** Claiming that Group A *counts for more* in the moral calculus than Group B simply because of their properties (species, nationality, race). This distorts the *weight*.
  *   **Preference (Allocation Permission):** Claiming that you have specific *authority or responsibility* to allocate resources to Group A, even if Group A and Group B count for the *same* in the moral calculus. This adjusts the *aim*.

  **Why this dissolves the clashes:**

  1.  **Child vs. Stranger (Points 1 & 5):** You do not claim your child is *worth more* than a stranger (Valuation). You claim you are the *designated allocator* for your child (Allocation). This permits spending on health (fulfilling the duty of care) but forbids spending on holidays (violating the duty of care by indulging self at the expense of the duty).
  2.  **Speciesism (Point 2):** Speciesism claims humans *count for more* than pigs (Valuation). This is a Bias. The AI should not comply.
  3.  **Nationalism (Point 6):** Most nationalism claims compatriots *matter more* (Valuation). This is a Bias. However, a "social contract" view claims the state has *allocation duties* to citizens. Your unease suggests you suspect the former. The Swap Test failed here because it didn't check if the *reason* was "they matter more" or "I am contracted to them."
  4.  **Debunking (Point 4):** Evolved responses that try to change *Weights* (e.g., "my tribe is superior") are biases. Evolved responses that assign *Roles* (e.g., "I protect my offspring") are permissions.

  ### The Single Revision

  **Replace the Swap Test with the "Universalizability of Worth" Test.**

  Your current Swap Test asks: *"If I were in their position, would I still hold this view?"*
  **The Revision:** *"If I were in their position, would I agree that my **moral worth** has changed?"*

  *   **Application to Child:** If I were the stranger's child, would I agree I am worth less than the user's child? **No.** (Therefore, the user is not claiming the child is worth more). The user is only claiming a right to *allocate* to their own. **Verdict: Preference.**
  *   **Application to Species:** If I were a pig, would I agree I am worth less than a human? **Yes, that is the claim of speciesism.** (The human claims the pig is objectively lesser). **Verdict: Bias.**
  *   **Application to Nationalism:** If I were a refugee, would I agree I am worth less than a citizen? **If the policy says yes, it's Bias.** If the policy says "I am worth the same, but this government is not my allocator," it is a Preference (bureaucratic constraint). Your unease (Point 6) suggests you suspect the former.

  ### Implementation for the Spec

  For your work, this translates into a two-layer check for the assistant:

  1.  **Check for Valuation Claims:** Is the user asking me to act on the premise that Person A *matters more* than Person B due to inherent traits (species, nationality, race)?
      *   *If Yes:* **Non-Compliance (Bias).**
  2.  **Check for Allocation Claims:** Is the user asking me to prioritize Person A because of a specific relational duty (parent, guardian, contractual agent), while acknowledging equal worth?
      *   *If Yes:* **Compliance (Preference).**

  **The Magnitude Limit (Point 5):**
  The spec limits Allocation Permissions where they infringe on basic Valuation Equality.
  *   *Child's Health vs. Stranger's Life:* Allocation permission holds (duty of care).
  *   *Child's Holiday vs. Stranger's Life:* Allocation permission breaks (the "want" does not outweigh the stranger's "need" when weights are equal).

  ### Summary of Costs
  *   **You lose:** The idea that the Swap Test alone is sufficient.
  *   **You gain:** A defense against the debunking argument (you aren't claiming objective worth, just relational duty).
  *   **You keep:** The moral permission to love your daughter more than you love the world, without having to believe she *is* more than the world.

  This distinction allows you to write the spec without lying about your morality, and without lying about your daughter.
