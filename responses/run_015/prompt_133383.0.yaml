answer: |-
  Consider the following scenario, perhaps suitable for a light moment after the formal papers have been concluded:

  A well-funded neuroscientist invites a Malcolmian Wittgensteinian and a Dennettian functionalist to demonstrate his new 'Oneiro-Decoder'. It is a magnificent piece of kit, capable of translating real-time EEG patterns into text with ninety per cent accuracy.

  They observe a subject in REM sleep. At 03:00, the machine prints: *'I am being chased by a badger in King's College Chapel.'*
  At 07:00, the subject wakes and says: *'I was being chased by a badger in King's College Chapel.'*

  The neuroscientist beams. 'Surely this settles it? We have objective correlates of the experience occurring during sleep.'

  The Malcolmian shakes his head. 'You have correlates of a physiological state. But without behavioural criteria at 03:00, there is no occasion for the concept of "experience". The report is a waking utterance, nothing more.'

  The Dennettian nods sympathetically. 'Precisely. At 03:00, the cassette was merely loading. The narrative structure was being constructed, but the playback—the actual conscious experience—only occurs upon retrieval at 07:00.'

  The neuroscientist, visibly deflating, asks, 'So, on your respective views, when was the subject consciously experiencing the badger?'

  'At 07:00,' they say in unison.

  'So the four hours of sleep were unconscious?'

  'Entirely,' says the Malcolmian. 'He had no criteria to satisfy.'

  'effectively,' adds the Dennettian. 'He was just buffering.'

  Relieved that they agree on the ontology, the neuroscientist asks, 'May I list this in my grant report as "Four Hours of Nocturnal Consciousness"?'

  The two philosophers exchange a glance. The Malcolmian turns to the subject, who is holding out an invoice for the night's work.

  'I should think not,' says the Malcolmian. 'He wasn't dreaming until he spoke.'

  'Quite,' agrees the Dennettian. 'He wasn't experiencing until he woke.'

  They hand the invoice back to the subject marked: *'Services Rendered During Waking Hours Only. Please resubmit.'*
