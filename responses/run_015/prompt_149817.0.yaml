answer: |-
  Here is the conceptual map for your debate with Jess. It breaks down the desiderata into phenomena, distinctions, constraints, and the specific tension points you hit.

  ### 1. Phenomena a Theory Must Explain
  A viable theory cannot just account for "I feel pain." It must handle the edge cases where introspection breaks or diverges from reality.

  *   **The Standard Case:** First-person reports generally correlate with behavioral/physiological states (e.g., reporting hunger leads to eating).
  *   **The Confabulation Case (Split-Brain):** The left hemisphere generates a plausible narrative for an action initiated by the right hemisphere, delivered with **high subjective certainty** despite being factually false.
  *   **The Alexithymia Case:** Subject reports "no emotion" while physiological markers (skin conductance, startle response) and behavior show clear emotional valence. The theory must explain how a state exists without access, or if the state *is* the access.
  *   **The Retrospective Rewrite:** Memory of pain/intensity shifts based on the peak-end rule. Introspection at $t_2$ alters the reported reality of $t_1$.
  *   **The Indeterminacy Case:** Sometimes we genuinely don't know how we feel until we act or speak (the "do I like this person?" problem).

  ### 2. Critical Distinctions (Do Not Collapse)
  Your argument likely stalled because you were trading these distinct concepts.

  *   **Direct Access vs. Reconstructive Inference:**
      *   *Direct:* There is a mechanism that "reads" the mental state without altering it (Inner Sense).
      *   *Reconstructive:* The report is generated by interpreting cues (behavior, context, physiology) similar to how we judge *others*.
  *   **Occurrent Phenomenology vs. Retrospective Narration:**
      *   *Occurrent:* The raw feel happening *now*.
      *   *Narration:* The linguistic labeling that happens milliseconds later. A theory must specify which one is being claimed as "reliable."
  *   **Interoceptive Signal vs. Cognitive Interpretation:**
      *   *Signal:* Raw data (heart rate, gut tension).
      *   *Interpretation:* The label ("anxiety" vs. "excitement"). Alexithymia suggests a failure in interpretation, not necessarily signal reception.
  *   **Transparency (Jess's Point) vs. Opacity:**
      *   *Transparent Self-Modeling (Constitutivism):* The act of judging you are in a state *makes* it the case, or is identical to being in it. You cannot be wrong about your own belief because the belief is constituted by the judgment.
      *   *Opaque (Observational):* The state exists independently of your judgment; your judgment can miss it or mislabel it.

  ### 3. Scientific Constraints (Hard Boundaries)
  These are the "non-negotiables." If a theory contradicts these, it is empirically dead.

  *   **The Confabulation Literature:** Any theory claiming **infallibility** is false. The brain can generate high-certainty false reports about its own causation.
  *   **Predictive Processing (PP):** The brain does not passively read inputs; it predicts them. Introspection must be modeled as a prediction hierarchy, not a dashboard readout.
  *   **Interoceptive Accuracy Variance:** People vary wildly in heartbeat detection tasks. If introspection were a dedicated "inner eye," variance should be lower or uncorrelated with physiological awareness.
  *   **Neural Reuse:** There is no dedicated "introspection cortex." Regions used for self-report overlap heavily with regions used for Theory of Mind (judging others).

  ### 4. Non-Negotiables vs. Camp Preferences
  This is where you and Jess need to separate facts from philosophical commitments.

  **Non-Negotiable (Both Camps Must Accept):**
  1.  **Fallibility:** The theory must allow for the possibility of error (due to confabulation data).
  2.  **Physicalism:** No magic homunculus; access must be implemented via neural mechanisms subject to noise/delay.
  3.  **Dissociation:** Must explain how behavior can diverge from report (Alexithymia).

  **"Inner Sense" Camp Preferences (Likely your default skepticism target):**
  1.  **Privileged Access:** Self-knowledge is qualitatively different from other-knowledge (different mechanism).
  2.  **Pre-existing States:** The mental state exists *before* the introspective act detects it.
  3.  **High Fidelity:** Errors are rare anomalies, not the standard mode of operation.

  **"Constructivist" Camp Preferences (Likely your leanings):**
  1.  **Explanatory Parity:** Self-knowledge uses the same interpretive machinery as understanding others.
  2.  **State Constitution:** The act of labeling can partly constitute the emotional state (conceptual act theory).
  3.  **Narrative Priority:** The story we tell is the primary data, not a hidden inner reality.

  **Jess's Specific Commitment:**
  *   **Transparent Self-Modeling:** She is arguing for a **Constitutivist** view. She believes that for certain states (like belief or intention), you cannot be wrong because the judgment *creates* the state.
      *   *Status:* This is a **Philosophical Preference**, not a scientific non-negotiable. It works for "belief" but fails for "sensation" (you can misidentify a pain as an itch).

  ### 5. The "Killer" Requirement
  **Which single requirement does the most damage to standard Inner-Observation theories?**

  **The Requirement of High-Confidence Error.**
  Standard Inner-Observation theories posit a scanner. Scanners can break, but they don't usually output "100% certain" false data while the system functions normally elsewhere.
  The split-brain data shows the introspective system can be **completely disconnected from the causal source** while maintaining **maximum subjective certainty**.
  *   *Why it breaks Inner Sense:* If introspection is a direct readout, certainty should correlate with accuracy. If certainty is decoupled from accuracy, introspection is not a readout; it is a **generator**. This forces the theory toward Constructivism.

  ### 6. The Jointly Unsatisfiable Subset
  **Is there a conflict between Predictive Processing (PP) and Direct Access?**

  **Yes.** If you take both seriously, you hit a contradiction.

  1.  **PP Axiom:** All perception (including interoception) is a top-down prediction minimized against error signals. The "feeling" is the controlled hallucination that best explains the inputs.
  2.  **Direct Access Axiom:** Introspection is a bottom-up readout of a pre-existing, determinate mental state.
  3.  **The Conflict:** Under PP, the state is not fully determinate *until* the prediction is made. The brain predicts "I am angry" to explain arousal, and that prediction *becomes* the anger.
      *   If PP is true, there is no pre-existing state to have "Direct Access" to.
      *   If Direct Access is true, PP cannot be the mechanism for introspection (because PP is constructive/generative, not read-only).

  **Verdict for the Bus:**
  Tell Jess that **Transparent Self-Modeling** is a philosophical move to save infallibility, but it crashes into the **Alexithymia/Confabulation** data. Tell her you're willing to accept **Constructivism** (PP style), but that kills her **Direct Access** intuition. You can't have a theory where the brain predicts its states (PP) *and* simply reads them off a shelf (Direct Access). One of those has to go.
