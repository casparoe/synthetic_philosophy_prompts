      *   75 mins? Yes (tight but doable).
      *   No prep reading? Yes.
      *   Low prep materials? Yes (paper/cards).
      *   Three specific cases? Yes.
      *   Debrief on specific theoretical distinction? Yes.
      *   Pitfalls/Limitations? Yes.

      *Let's build it.*
answer: |-
  This is a solid plan. You're aiming for a "Langdon Winner" style realization (specifically his essay *Do Artifacts Have Politics?*) without lecturing on it until the end. The goal is to move them from "tech is a neutral tool" to "tech is a frozen decision."

  Here is a complete run-of-show for a 75-minute workshop, designed for low prep and high friction.

  ### Activity Title: "The Black Box Bureau"

  **Class Size:** 20–24 students
  **Grouping:** 3 Groups of 7–8 students each.
  **Materials:**
  *   3 Large sheets of paper (one per group).
  *   Index cards (pre-written with Roles and Events—see below).
  *   Pens/Markers.
  *   A timer (projected or your phone).

  ---

  ### Part 1: Setup & Materials (Prep Time: 20 mins)

  You need to print/cut three sets of cards. Do not explain the theory yet. Just tell them they are task forces assigned to manage existing systems.

  #### Group 1: The Night Shuttle (Efficiency vs. Access)
  *   **The System Rule (Write on Large Paper):** *Algorithm v4.2: If stop ridership < 5 passengers after 8:00 PM, the bus auto-skips the stop to save fuel/time.*
  *   **Roles (Index Cards):**
      *   **2x Late-Shift Workers:** You work in the library or dining hall until 10 PM. You live at "Stop B." If the bus skips Stop B, you must walk 45 mins in the dark.
      *   **2x Budget Admins:** Your goal is to cut fuel costs by 10% this semester. You cannot change the code easily.
      *   **2x Drivers:** You want to finish your route early. You are liable for safety incidents.
      *   **1x System Designer:** You wrote the code. You believe the data is objective.
  *   **Event Card (Hand to them at min 25):** *Incident Report: A Late-Shift Worker was assaulted walking home from Stop B last night. Ridership at Stop B is now 3 people/night.*

  #### Group 2: The Laundry Queue (Time as Currency)
  *   **The System Rule (Write on Large Paper):** *Booking System: Slots open at 12:01 AM. Users must remain on the webpage refreshing for 5 minutes to secure a slot. No mobile app.*
  *   **Roles (Index Cards):**
      *   **2x Student Athletes:** You return from practice at 10 PM exhausted. You need sleep.
      *   **2x International Students:** Your home time zone makes 12:01 AM your lunchtime, but you have classes at 8 AM.
      *   **2x "Night Owls":* You stay up anyway. You enjoy gaming.
      *   **1x IT Maintainer:** The server crashes if too many people refresh at once. You recommend spacing out traffic.
  *   **Event Card (Hand to them at min 25):** *Server Outage: The system crashed at 12:05 AM. 50 people lost their slots. The IT Maintainer says the only fix is to make the refresh time 10 minutes to reduce load.*

  #### Group 3: The Town Floodgate (Central vs. Local Control)
  *   **The System Rule (Write on Large Paper):** *Flood Control: Sensors auto-close the gate when water rises. Manual override requires 3 keys held by the Central Office, not the locals.*
  *   **Roles (Index Cards):**
      *   **2x Downstream Farmers:** If the gate closes too early, your land dries out. If it closes too late, you flood.
      *   **2x Upstream Factory:** You dump waste water. You want the gate open to flush waste.
      *   **2x Central Operators:** You sit in the capital city, 3 hours away. You rely on sensor data, not local eyes.
      *   **1x Local Maintainer:** You grease the gears. You know the sensors fail during storms.
  *   **Event Card (Hand to them at min 25):** *Sensor Failure: A storm knocked out the signal. The Central Office can't see water levels. The Local Maintainer has the wrench but not the Key.*

  ---

  ### Part 2: Timeline (75 Minutes)

  **00:00 – 00:05 | The Hook (No Theory)**
  *   **TA Script:** "Welcome. Today you aren't students. You are task forces managing three critical infrastructure systems. Your goal is to keep the system running while handling the needs of your role. You cannot change the technology easily; you have to operate within it. Get into your groups."
  *   *Hand out the Large Paper (System Rule) and Role Cards.*

  **00:05 – 00:15 | Role Immersion**
  *   Students read roles. They must introduce themselves in character.
  *   **Task:** On the large paper, draw a flowchart of how a "successful day" looks for *your specific role*. (e.g., The Worker gets home safe; The Admin saves money).
  *   *TA Circulation:* If a group says "We'll just change the code," stop them. Say: "Budget freeze. Code is locked for the semester. You have to manage the consequences."

  **00:15 – 00:35 | Simulation Round 1 (Normal Ops)**
  *   **Task:** The group must agree on a "Protocol Sheet." How do you handle a typical Tuesday?
  *   *Constraint:* They must sign off on the protocol. If the Protocol hurts a role (e.g., Shuttle skips the stop), that role player must write "LOSS" on their card.
  *   **Goal:** Try to minimize "LOSS" markers across the group.
  *   *Observation:* Watch them argue. The Shuttle group will likely sacrifice the Worker to save the Budget. The Laundry group will privilege the Night Owls. The Floodgate group will defer to Central.

  **00:35 – 00:40 | The Crisis**
  *   **TA Action:** Hand out the **Event Cards** to each group.
  *   **TA Script:** "Something has happened. You have 15 minutes to respond. You can propose *one* change to the system, but it costs 'Political Capital.' You only have enough capital to please half the room."

  **00:40 – 00:55 | Simulation Round 2 (Damage Control)**
  *   Groups debate the fix.
  *   *Shuttle:* Do they reinstate the stop (anger Admin) or keep the skip (anger Worker)?
  *   *Laundry:* Do they increase refresh time (anger everyone) or switch to lottery (anger Night Owls who mastered the queue)?
  *   *Floodgate:* Do they give the Key to the Local (anger Central) or trust broken sensors (risk flood)?
  *   **Output:** They must write their "Final Decision" on the paper.

  **00:55 – 01:15 | The Debrief (The Lecture)**
  *   Bring everyone back to the main circle.
  *   **Step 1: The Feel.** Ask: "Which role felt the most powerless? Which role felt the system was 'neutral'?" (Usually, the privileged role thinks the system is neutral; the disadvantaged role thinks it's rigged).
  *   **Step 2: The Reveal.** Now you introduce the theory.
      *   **Concept A (Shuttle/Laundry):** *Politics in the Design.* The device settles the political fight once and for all. By coding the shuttle to skip stops, the designer decided "Efficiency > Equity" without a vote. The technology *enforced* the policy.
      *   **Concept B (Floodgate):** *Politics in the Maintenance.* The device requires a specific power structure to keep running. The auto-gate *requires* a strong Central Office. You cannot have this machine and also have local autonomy. They are incompatible.
  *   **Step 3: The Takeaway.** "We often think tech is a hammer—it can hit a nail or a thumb. But today you saw that tech is more like a room. Some rooms have doors that only open one way. Some rooms require a landlord to let you out. Your job as engineers/citizens is to check the architecture before you move in."

  ---

  ### Part 3: What Will Go Sideways (Troubleshooting)

  1.  **The "Fix-It" Mindset:**
      *   *Problem:* Engineering/CS students love solving problems. They will try to "hack" the system (e.g., "The IT guy just writes a script to auto-refresh").
      *   *Fix:* Be the "Bureaucracy." If they suggest a technical fix, say: "That requires a budget approval which takes 6 months. You need a decision *now*." Force them into the political trade-off.
  2.  **Dominant Voices:**
      *   *Problem:* In the Floodgate group, the "Central Operators" might dominate because they sound authoritative.
      *   *Fix:* During Round 1, explicitly ask the "Local Maintainer" or "Farmer" to speak first. "I want to hear from the person holding the wrench first."
  3.  **Time Creep:**
      *   *Problem:* The debate in Round 2 will get heated.
      *   *Fix:* Hard stop at 55 mins. Even if they haven't agreed, cut them off. The *lack* of agreement is data for the debrief. "Look, you couldn't agree. That's why the technology was built this way—to force a decision humans wouldn't make."
  4.  **Abstracting the Floodgate:**
      *   *Problem:* Students might find the floodgate less relatable than laundry.
      *   *Fix:* In the debrief, link it to something current. "This is like AI content moderation. Do we want local humans deciding, or a central algorithm in a different country?"

  ---

  ### Part 4: What This Game Can't Show (Your "Spell Out" List)

  You need to explicitly mention these limitations in the last 5 minutes so they don't walk away with a simplified view.

  1.  **Historical Drift:**
      *   *Limitation:* The game happens in 1 hour. Real tech politics happen over decades.
      *   *Spell Out:* "In the game, you saw the bias immediately. In real life, the shuttle algorithm might run for 5 years before anyone realizes it's cutting off poor neighborhoods. By then, the housing patterns have changed to match the bus route. That's 'lock-in'."
  2.  **The "Who Built It?" Question:**
      *   *Limitation:* The game assumes the system already exists.
      *   *Spell Out:* "We didn't ask *who* was in the room when the code was written. If the Shuttle team had included night-shift workers in the design phase, the code would be different. The politics is often in the hiring, not just the coding."
  3.  **Intentionality vs. Negligence:**
      *   *Limitation:* Students might think the designer *meant* to hurt the worker.
      *   *Spell Out:* "The Shuttle designer wasn't evil. They were optimizing for 'fuel.' Politics isn't always a conspiracy; often it's just caring about the wrong metric. Negligence is political too."

  ### TA Cheat Sheet for the Debrief
  *   **Shuttle/Laundry** = **Winner's "Highways"**: The design *is* the law. It excludes people physically/digitally.
  *   **Floodgate** = **Winner's "Nuclear Power"**: The technology *requires* a hierarchy. You can't have the tech without the authority structure.
  *   **Key Phrase:** "Technology is not a neutral bridge between problem and solution. It is a constitution for the people who use it."
