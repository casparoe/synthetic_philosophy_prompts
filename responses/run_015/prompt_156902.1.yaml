      *(Refinement on Preemption)*: In standard preemption (Suzy throws, Billy doesn't), Suzy causes the break. In EtG, the *firm* causes the harm, the *market* fills the slot. The student claims they are not the preempting cause. The colleague says it *is* preemption. I should clarify that EtG relies on the claim that the *harmful outcome* is overdetermined by market forces, not just by another agent.

      *(Refinement on Complicity)*: The distinction is likely between *making the harm possible* (necessary condition) vs. *making the harm probable/marginal*. Or, more likely, *Integrity as a Side Constraint* that is triggered only by direct association.

