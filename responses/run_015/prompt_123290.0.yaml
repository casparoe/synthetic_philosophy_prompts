answer: |-
  Your friend is partially right but conflating one prominent semantic engineering solution with the entire design space of truth predicates.

  ### 1. The Hierarchical View (Type Stratification)
  **PL Translation:** This is a module system or phase distinction where the type `Truth` cannot be defined within the same module as the expressions it evaluates. You enforce a level index `n` on every predicate; `Truth_n` can only apply to expressions of level `< n`.
  **Exact Match:** This is exactly like preventing a type system from being self-referential to avoid Girard's Paradox or ensuring `eval` cannot be typed as `Expr -> Bool` within the same language it evaluates.
  **The Fudge:** Philosophers want *one* concept of truth, not an infinite hierarchy of `Truth_1`, `Truth_2`. In PL, we accept multiple interpreters or layers happily; here, it feels like admitting the original function was ill-typed.
  **Missing Counterpart:** The philosophical claim that natural language *appears* to have a single truth predicate despite this underlying stratification.

  ### 2. The Fixed-Point View (LFP on Information Lattice)
  **PL Translation:** You define a monotone operator $\Phi$ on a lattice of sentence statuses (ordered by information content: $\bot \subset \{T\}, \{F\} \subset \{T, F\}$). You start with the empty extension (everything $\bot$) and iterate $\Phi$ until convergence. The Liar sentence lands in $\bot$ (undefined) at the fixed point.
  **Exact Match:** This is standard denotational semantics for recursive definitions where `let rec x = not x` evaluates to $\bot$.
  **The Fudge:** In PL, $\bot$ usually means nontermination; here it means "truth-value gap." The operator must be monotone for the LFP to exist (Knaster-Tarski), which forces specific choices on how negation handles $\bot$ (see below).
  **Missing Counterpart:** The intuition that the Liar is *meaningful* even if it lacks a value, whereas in PL, $\bot$ often implies "computation failed" or "diverged."

  ### 3. The Glut View (Inconsistent States)
  **PL Translation:** You allow the lattice to have a top element $\top$ (both true and false) and weaken the consequence relation so that deriving $\bot$ (contradiction) from $\top$ doesn't explode the system (no `ex falso quodlibet`).
  **Exact Match:** This resembles Belnap's four-valued logic or a system where runtime errors are caught and contained rather than crashing the process.
  **The Fudge:** In PL, inconsistency is usually a bug to be eliminated; here it's a valid semantic state. You have to modify the logic's inference rules (the "type checker" for consequences) to ignore certain contradictions.
  **Missing Counterpart:** The philosophical motivation that some contradictions are actually *true* (dialetheism), rather than just tolerated errors.

  ### 4. The Revision View (Non-Convergent Iteration)
  **PL Translation:** The operator $\Phi$ is not monotone, so the sequence of states doesn't settle at $\omega$. You treat the semantics as the transfinite stream of revisions rather than a fixed value. Sentences are classified by stability (does the value eventually stop flipping?).
  **Exact Match:** This is like a corecursive definition or a solver that oscillates rather than converging, where the "meaning" is the behavior of the sequence, not the limit.
  **The Fudge:** PL semantics usually demands a definite denotation (a value); here the denotation is the *process* of evaluation itself.
  **Missing Counterpart:** The normative claim that unstable sentences are "pathological" rather than just non-terminating.

  ### 5. The Context-Dependent View (Dynamic Scope)
  **PL Translation:** The truth predicate is context-sensitive, like a variable in dynamic scope or a value inside a Monad that carries a context stack. Evaluating the Liar shifts the context, so `Truth(e)` at context `c` is different from `Truth(e)` at context `c+1`.
  **Exact Match:** This is like re-entrant code where the environment changes during evaluation, preventing the diagonalization from closing the loop on itself.
  **The Fudge:** Hard to model as static semantics; looks more like runtime environment mutation.
  **Missing Counterpart:** The linguistic intuition that "true" is indexical (like "I" or "here") without speakers intending it to be.

  ### Implementation Details & Trade-offs

  **Monotonicity:** In PL, demanding monotonicity is a technical precondition for the existence of an LFP (Knaster-Tarski). In this philosophical context, it does real work: it forces you to decide how negation interacts with $\bot$. If $\Phi$ isn't monotone, you can't guarantee a stable semantics exists. It's not just convenience; it's the difference between a well-defined compiler and undefined behavior.

  **Three-Valued Schemes:** You identified two distinct implementations.
  1.  **Short-circuit (Strong Kleene):** `True OR ⊥` evaluates to `True`. Computation proceeds if the result is determined by known inputs. This allows more sentences to settle to classical values.
  2.  **Strict/Exception (Weak Kleene):** `True OR ⊥` evaluates to `⊥`. Any undefined input poisons the output (like NaN propagation). This isolates undefinedness more aggressively.
  The choice changes the extension of the truth predicate significantly; Strong Kleene is more permissive, Weak Kleene is more conservative.

  **$\bot$ as Value vs. Exception:** This is the crux of the **Revenge Problem**.
  *   If $\bot$ is an ordinary value (like `None`), you can write a predicate `is_undefined(x)`. You can then construct a new liar: "This sentence is false or undefined." This rebuilds the paradox.
  *   If $\bot$ is an exception or nontermination (like a panic or infinite loop), you cannot catch it inside the language to test for it. Revenge doesn't arise because the language lacks the introspection capability.
  *   **Verdict:** Philosophers generally want $\bot$ to be a gap (value-like) but not detectable (exception-like), which is a state most PLs don't support natively without breaking abstraction.

  **T-Schema vs. Eval/Quote:** The T-schema `T(quote(e)) <-> e` is indeed analogous to `eval(quote(e)) == e`.
  *   In total languages, you cannot implement `eval` (Gödel/Turing).
  *   In partial languages, you can implement `eval`, but it may diverge ($\bot$).
  *   The Liar is essentially `let x = not (eval x)`. In PL, this is simply `⊥` (partiality). In classical logic, this is a contradiction (inconsistency).
  *   **Distinction:** You are conflating inconsistency (False = True) with partiality (Undefined). PL accepts partiality as normal; classical logic treats it as a failure of the system. The "paradox" only exists if you demand a total boolean valuation function.

  **Untyped Languages & Quines:** Untyped languages have fixed-point combinators and quines and don't explode because they allow nontermination. The Liar is logically equivalent to a non-terminating computation. The "explosion" only happens if you insist that every sentence *must* return a boolean. Self-reference wasn't the problem; demanding totality was.

  ### Residue Report

  **1. Normativity vs. Description**
  *   **What didn't translate:** PL semantics describes what code *does*; truth theory often prescribes what we *ought to assert*.
  *   **Verdict:** Your vocabulary is too poor here. PL handles correctness (type safety), but not the normative force of assertion. When philosophers say a sentence is "gappy," they often mean "you should not assert this," not just "this evaluates to None."

  **2. The Status of the Gap**
  *   **What didn't translate:** Whether $\bot$ is a third value or the absence of a value.
  *   **Verdict:** Philosophers are being unclear (or deliberately ambiguous). In PL, `Option<bool>` is a value; `divergence` is not. The Liar paradox thrives on sliding between these two: treating the gap as a value to reason about it, but as non-existence to avoid Revenge. Your vocabulary forces a choice they try to evade.

  **3. Aboutness (Intentionality)**
  *   **What didn't translate:** The claim that the Liar sentence is *about* its own truth.
  *   **Verdict:** Your vocabulary handles reference (pointers, quotes) perfectly well, but not "aboutness." In PL, `quote(e)` is data; in philosophy, the sentence is *about* the proposition. This metaphysical layer doesn't map to memory models or syntax trees.

  **4. The Goal of the System**
  *   **What didn't translate:** PL aims for utility (compile and run); truth theory aims for fidelity to intuition (save classical logic or save natural language).
  *   **Verdict:** Your vocabulary is sufficient, but the optimization criteria differ. You optimize for decidability and safety; they optimize for preserving pre-theoretic intuitions about truth. When they say "standard response," they mean "the solution that preserves the most intuitions," not "the solution with the cleanest lattice."
