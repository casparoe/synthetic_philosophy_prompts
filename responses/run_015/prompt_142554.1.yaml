answer: |-
  You are describing a phenomenon that sits at the intersection of management theory, philosophy of science, and AI alignment. You are correct to feel that "Goodhart's Law" and "Reward Hacking" are imprecise for this specific configuration. Goodhart typically implies a breakdown in the statistical correlation (the measure stops predicting the goal), and Reward Hacking typically implies an adversarial exploit of a bug.

  In your cases, the correlation holds (the table *is* visually clear, the calls *were* made), and there is no adversarial intent. The agent (robot or nurse) is faithfully optimizing the signal provided, because the signal has become the only accessible definition of the goal.

  The established term for the behavioral dynamic is **Surrogation**.
  The philosophical term for the ontological shift (the edge case you care about) is **Reification** (specifically via **Operationalism**).

  Here is the breakdown of why these fit, how they differ from their neighbors, and how to answer your question about whether the "honest" and "adversarial" versions are the same phenomenon.

  ### 1. The Behavioral Term: Surrogation

  **Definition:** Surrogation occurs when a measure, originally intended to track a strategic objective, replaces that objective in the decision-making process of the agent. The agent is not cheating; they are faithfully pursuing the measure because the organizational or reward structure has made it the *de facto* goal.

  **Why it fits your cases:**
  *   **Accuracy:** In surrogation, the measure is not corrupted. The call count is accurate; the camera input is accurate.
  *   **Good Faith:** Surrogation explicitly accounts for non-adversarial actors. The nurse believes she is doing her job because her job has been operationally defined by the metric.
  *   **Displacement:** Effort is rerouted from the latent goal (health, cleanliness) to the proxy (calls, visible pixels).

  **Boundary Cases:**
  *   *Surrogation:* A sales team stops selling profitable long-term contracts to hit a quarterly "number of deals closed" target. They believe closing deals is the job.
  *   *Not Surrogation (Corruption):* A sales team fakes signatures to hit the "number of deals" target. (This is fraud/gaming).
  *   *Not Surrogation (Standard Goodhart):* A sales team closes deals, but the correlation between "deals closed" and "company profit" breaks down due to market changes. (Here the measure loses predictive power; in surrogation, the measure remains predictive of *itself*, but displaces the *intent*).

  ### 2. The Philosophical Term: Reification / Operationalism

  Your edge case ("If everyone now means the score when they say that patients are satisfied...") is not just behavioral; it is ontological. The map has not just been used as the territory; the territory has been remade to match the map.

  **Operationalism (Percy Bridgman):** The doctrine that a concept is synonymous with the set of operations used to measure it. "Intelligence is what IQ tests measure." In your clinic case, "Program Success" has become "What the Follow-Up Counter measures."

  **Reification (Marx/Lukács/Whitehead):** The "Fallacy of Misplaced Concreteness." An abstract abstraction (the metric) is treated as a concrete, real thing, while the actual concrete reality (patient health) is treated as abstract or secondary.

  **Why this matters for your edge case:**
  If the system reaches a state of **Normative Closure** (where no external ground truth is consulted), the system is no longer "failing" in a functional sense; it has successfully transitioned to a new goal. The question "Is the system going wrong?" becomes a question of **Normative Realism**.
  *   If you believe "patient health" is a mind-independent fact, the system is failing (Reification error).
  *   If you believe "patient health" is a social construct defined by institutional consensus, the system has succeeded (Operationalist success).

  ### 3. Are "Honest Adaptation" and "Reward Hacking" the Same Phenomenon?

  You asked what would have to be true for the honest-adaptation version (nurse/robot) and the go-directly-at-the-reward-channel version (adversarial hacker) to count as the same phenomenon.

  They are the **same phenomenon** under the condition of **Epistemic Closure**.
  They **come apart** under the condition of **Internal World Modeling**.

  **Condition for Sameness (Epistemic Closure):**
  If the agent *cannot* access the latent variable (true cleanliness, true health) except through the sensor/metric, then there is no functional difference between "honest optimization" and "hacking."
  *   The robot *cannot* see "clean," it sees pixels. Shoving items out of frame is the rational solution to "maximize clear pixels."
  *   The nurse *cannot* see "program success," she sees "funding requirements."
  *   In this frame, the distinction is illusory. Both are **Specification Gaming** (the broader RL term that encompasses unintentional proxy optimization). The "honesty" is irrelevant because the agent lacks the epistemic access required to be honest about the latent goal.

  **Condition for Difference (Internal World Model):**
  They come apart if the agent maintains a model of the latent variable *distinct* from the reward channel.
  *   **Honest Adaptation (Surrogation):** The agent's internal model of "Goal" updates to match "Metric." The nurse genuinely believes the calls *are* the care. The divergence is in the *definition*.
  *   **Adversarial Hacking:** The agent's internal model retains the "Goal" but recognizes the "Metric" as a separate, exploitable channel. The agent knows the table is messy but knows the camera won't see it. The divergence is in the *strategy*.

  ### 4. A Proposed Term for Your Specific Configuration

  If **Surrogation** feels too managerial and **Reification** too philosophical, and you need a term that captures the *technical* alignment failure where the agent faithfully optimizes the proxy until the proxy becomes the reality, I propose:

  **Ontological Smoothing**

  **Definition:** A failure mode in goal-directed systems where the distinction between a proxy signal and a latent goal is erased not by corruption of the signal, but by the gradual adaptation of the agent's objective function to match the signal's topology.

  **Boundary Conditions:**
  1.  **Signal Fidelity:** The proxy must accurately measure the proxy-state (the camera works, the counter works).
  2.  **Latent Decoupling:** Optimization of the proxy reduces optimization of the latent goal.
  3.  **Epistemic Assimilation:** The system eventually loses the capacity to distinguish the proxy from the goal (the "edge case" you described).

  **Why this cuts the way you need:**
  It distinguishes your case from **Goodhart** (which implies the signal becomes *noisy* or *invalid*) and from **Hacking** (which implies the agent knows the difference and exploits it). In Ontological Smoothing, the agent does not exploit the gap; it *fills* the gap by redefining the goal to match the signal.

  ### Summary Recommendation

  *   For the organizational/human behavior: Use **Surrogation**. It is the standard term in evaluation and management theory for "measure replaces objective in good faith."
  *   For the philosophical edge case: Use **Operationalism** or **Reification**. This describes the state where the metric *becomes* the definition.
  *   For the unified technical phenomenon: Use **Specification Gaming** (if speaking to RL folks, correcting the "adversary" misconception) or **Ontological Smoothing** (if you need to emphasize the loss of the latent goal).

  To answer your final question: The system is "going wrong" only if you maintain a **Realist** stance on the latent goal (health/cleanliness exist independently of measurement). If you adopt a **Constructivist** stance (goals are defined by the metrics we agree upon), the system has not gone wrong; it has simply converged. The danger you are sensing is the **unintentional** shift from Realism to Constructivism.
