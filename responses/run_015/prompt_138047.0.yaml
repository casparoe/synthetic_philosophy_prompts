      *   *Proposed Principle:* **The Sensitivity-Tracking Principle (STP).** An evolutionary explanation undermines confidence in belief $B$ to the degree that the explanation shows $B$ is held due to a mechanism $M$ that would produce $B$ even if the content of $B$ were false, *unless* $M$ is constitutively linked to the truth of $B$.
