      *   *Case 6 is the hard one.* Why does a weak story boost confidence? This is likely psychological reactance or a "no best explanation" inference. If the only alternative to "moral truth" is "bad evolutionary story," and the story is weak, "moral truth" wins by default.

      *   *Alternative Approach:* **The Explanatory Gap Principle.** Undermining occurs when the evolutionary explanation creates an *explanatory gap* between the cause of the belief and the truth of the belief that cannot be bridged by independent reasoning.
      *   *Let's try to synthesize:* The user's reactions track **Epistemic Dependence**.
      *   *Principle:* **The Independence Condition.** Confidence is lowered iff the evolutionary story suggests the belief is *epistemically independent* of the facts that would make it true.
