      *   *Refining the Principle:* The user's tentative principle was "runs through the truth-maker." The problem is Case 4 (Pain). Pain doesn't have a truth-maker in the external sense; the experience *is* the justification. So the principle needs to cover *constitutive* links too.
      *   *Revised Principle:* **The Explanatory Link Principle.** An evolutionary account undermines belief $P$ if and only if it demonstrates that the cognitive mechanism producing $P$ operates independently of the truth conditions of $P$, *unless* the mechanism is constitutively tied to the truth of $P$ or the truth of $P$ is a necessary condition for the mechanism's operation.
