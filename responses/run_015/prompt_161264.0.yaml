  Subject: Draft Questions for Set Theory Episode

  Dear Host,

  Here are the nine questions you requested for your upcoming interview, drafted to press specifically on the tensions in her frame-indexed cardinality view while adhering to your formatting constraints.

  (1) You restrict your frames to well-founded models to avoid pathological cases, but well-foundedness is not first-order definable, so it looks like you are leaning on an absolute notion of set that your view claims is relative, so what is doing the work to restrict the frames if not the very absolute structure you deny exists? She will likely answer that well-foundedness is merely a constraint on the semantics we impose from outside the system, not a property within the system, so your follow-up should be to ask what single out those specific semantic constraints if not facts about the world that hold independently of any frame, since choosing a well-founded frame seems to require a standpoint that is not itself framed. (2) If she insists the selection of well-founded frames is just a pragmatic choice for doing mathematics, press her on whether this pragmatism undermines the claim that the relativity is purely semantic, because if we must step outside all frames to pick the right ones, then the relativity does not apply to the meta-language, and she needs to explain why the meta-language gets to be absolute while the object language does not. (3) Given that omega is absolute across transitive frames, number theory statements like there are infinitely many twin primes stay perfectly determinate on your view while cardinal arithmetic statements do not, so where exactly does the cut fall between the arithmetic that is fixed and the cardinality that shifts? She will probably say that omega is fixed because it is definable by a formula that is absolute for transitive models, so your follow-up should be to ask whether this absoluteness is a principled stopping point for her philosophy or just an accident of where the first-order definability happens to run out, since relying on where the math stops being absolute looks like letting the mathematics drive the metaphysics rather than the other way around. (4) If she argues that arithmetic is special because it concerns finite structures that are fully capturable, push her on why the power set of omega is not capturable in the same way if both are generated by definite rules, because if the rule for generating omega is frame-invariant, she needs to explain why the rule for generating subsets of omega is not, otherwise the distinction looks arbitrary. (5) When we move to second-order ZFC, full semantics seem to pin the hierarchy down up to isomorphism at each inaccessible rank, which leaves only relativity about the height of the hierarchy, so does your view survive the move to second-order logic or does it collapse into a view about height only? She will likely respond that quantifying over all subsets is itself frame-relative, so your follow-up should be to ask what becomes of her claim that the view is semantic rather than metaphysical, because if the meaning of all subsets shifts, then the ontology of sets shifts with it, which looks like a metaphysical claim about what sets exist rather than just how we talk about them. (6) If she maintains that second-order quantification is just as relative as first-order quantification, press her on whether there is any coherent notion of validity left for her logic, since if the domain of subsets shifts with every frame, then logical consequence becomes frame-relative too, and she needs to say whether logic itself is frame-indexed or if there is a frame-invariant logic governing the frames. (7) You claim that every set is countable from some frame, but when you make that claim yourself, which frame are you speaking from, and is there a frame from which your own theory is countable? She will probably say that her theory is stated in a meta-language that stands outside the object frames, so your follow-up should be to ask whether this outside standpoint is subject to a countable model itself, because if her own semantics are subject to Skolemization, then the outside standpoint never actually arrives, and she is left with an infinite regress of frames explaining frames. (8) On your reading the continuum hypothesis turns into a pseudo-question or at least a frame-relative one, so what do you think the search for new axioms is even trying to do if there is no frame-invariant fact of the matter to discover? She will likely say that mathematicians are trying to find axioms that are fruitful or coherent within a preferred frame, so your follow-up should be to ask whether this reduces the practice of set theory to engineering rather than discovery, because if there is no truth to find, then axiom seekers are just building tools, and she needs to explain why set theorists feel they are describing a reality rather than designing a language. (9) Finally, what observation could count against frame-indexed cardinality at all, given that it is built to leave first-order practice untouched and explain away contradictions as frame-shifts? She will probably say that it counts against a view if it makes practice harder or less coherent, so your follow-up should be to ask whether a view that is compatible with every possible mathematical outcome is actually saying anything substantive, because if no result in set theory could falsify her claim, then it looks like she is immune to evidence in a way that undermines the philosophical weight of the position.

  I hope these questions help you drive the conversation into the deeper implications of her work.

  Best regards,

  Assistant
