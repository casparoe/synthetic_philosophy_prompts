answer: |-
  This practice is a textbook case of **particularized conversational implicature** operating within a high-stakes institutional framework. It relies on a specific sociolinguistic contract between the referee (speaker), the committee (hearer), and the candidate (the subject). Below is the breakdown of the philosophical and pragmatic machinery required to keep this system running.

  ### 1. The View of Meaning Required
  For this practice to work, you must reject a **Semantic Minimalist** or **Code Model** of communication (where meaning is just the sum of literal definitions) and adopt a **Gricean Inferential Model**.

  Specifically, the practice presupposes:
  *   **The Distinction:** A hard line between *what is said* (the literal proposition, e.g., "She is polite") and *what is communicated* (the speaker meaning, e.g., "Her research is weak").
  *   **The Cooperative Principle:** The committee must assume the referee is cooperating with the hiring goal. If the referee were uncooperative, faint praise would just be faint praise. Because they are assumed cooperative, the committee infers: "If the referee *could* have said she was a research star, they *would* have. They didn't. Therefore, she isn't."
  *   **Common Ground:** There must be a shared, field-specific background knowledge of what a *strong* letter looks like. The implicature is generated by the **violation of the Maxim of Quantity** (the letter is less informative than expected for a strong candidate).

  **What has to be true:** It must be true that the cost of being explicit (social friction) is higher than the cost of being obscure (misinterpretation risk). The system relies on the referee and committee sharing a specific "dialect" of academic evaluation where omission equals negation.

  ### 2. Deniability and the Norm of Honesty
  This practice presupposes that the norm of honesty bottoms out at **assertoric commitment**.

  *   **The Mechanism:** In philosophy of language, you are morally and professionally responsible for the truth of your *assertions*. You are less responsible for the *inferences* a hearer draws from them. By writing "She is unfailingly polite," the referee asserts a truth (she is polite). The negative evaluation ("she is not a researcher") is an inference drawn by the committee.
  *   **Coherent or Fiction?** It is a **convenient fiction**, but a structurally coherent one within a Gricean framework. It allows the institution to maintain a public norm of "honesty" (no one lied) while privately acknowledging a reality of "misleadingness."
  *   **Why it persists:** It protects the referee from retaliation. If a candidate asks, "Did you say I was bad?" the referee can truthfully say, "No." This preserves the referee's ability to function in the field without being drawn into conflicts. The norm of honesty is preserved *technically*, even if violated *spiritually*.

  ### 3. Underdetermination: Requirement vs. Fit
  *   **What is Strictly Required:** The practice *requires* that meaning is **context-dependent**. Any theory of meaning that claims context cannot alter the informational content of a message (strict semanticism) would render the practice irrational. It also requires that the audience (committee) has the agency to interpret, not just record.
  *   **What Merely Fits:** The specific Gricean Maxims (Quantity, Quality, Relation, Manner) are not strictly required; **Relevance Theory** (Sperber & Wilson) works just as well. Under Relevance Theory, the committee assumes the letter is optimally relevant. If the letter focuses on teaching when the job is research-heavy, the *effort* required to find the research info yields low cognitive effects, signaling the data isn't there.
  *   **What is Ruled Out:** The fact that committees prefer the letter over the grid rules out **Purely Informational/Transmission Models** of communication. If communication were just data transfer, the grid (higher precision) would win. The preference for the letter proves the committee values *signal reliability* (is the referee willing to stake reputation on this?) over *data precision*.

  ### 4. The Inconsistency: Metrics vs. Implicature
  This is not logically inconsistent; it is **epistemically complementary**.

  *   **The Grid (Explicit):** Prone to **inflation**. If every referee marks "Top 10%," the metric loses variance. It serves as a *threshold* check (is this person above absolute zero?).
  *   **The Letter (Implicit):** Prone to **politeness**, but resistant to inflation because the *code* adjusts. It serves as a *differentiation* check (who is the *actual* top 1%?).
  *   **The Split:** The inconsistency is a feature, not a bug. The explicit metrics satisfy legal/HR requirements for objectivity (checkable, documented). The implicit letters satisfy the social requirement for risk assessment (is there a hidden flaw?). The committee uses the letter to **calibrate** the grid. If the grid says "Top 5%" but the letter implies "Mediocre," the committee assumes the grid is inflated and the letter is honest. They trust the channel that is harder to fake (social reputation) over the channel that is easier to fake (checking a box).

  ### 5. Concrete Loss: What Happens if We Go Explicit?
  If you replace letters with fully explicit, checkable assertions (e.g., "Candidate's research is below average"), you lose three specific things beyond "nuance":

  1.  **Referee Participation Rates:** The volume of information would drop. Referees would refuse to write letters for candidates they view negatively to avoid conflict. You would end up with *fewer* letters, not *more honest* ones.
  2.  **Calibration of Severity:** An explicit statement ("She is lazy") is binary. An implicature ("She is always on time") allows the committee to gauge the *degree* of the problem based on how faint the praise is. Implicature allows for a gradient of warning that assertion flattens.
  3.  **Protection of the Candidate's Mobility:** Explicit negatives brand a candidate permanently. Implicature allows a candidate to be rejected by a top department (who read the code) but hired by a mid-tier department (who might not know the code or have lower standards). Explicitness creates a permanent "blacklist"; implicature creates a "filter."

  ### 6. The Counterfactual: Literal-Only Convention
  If the convention flipped (letters read literally, implicature banned):

  *   **Collapse of Information Flow:** The system would likely collapse into **information silence**. Referees would write generic, vacuous letters ("X was a student") to avoid liability.
  *   **Migration to Back Channels:** The negative information would not disappear; it would migrate to **unrecorded channels** (phone calls, private emails, conference whispers). This is worse for the system because it makes the evaluation *less* accountable and more dependent on personal networks.
  *   **Why the Current System Survives:** The implicature system survives because it is a **stable equilibrium**. It minimizes social cost for the referee while maximizing information transfer to the committee. A literal-only system increases social cost without increasing information yield (because referees will just stop providing the info).

  ***

  ### Confidence and Uncertainty

  **Overall Confidence:** High (85-90%).
  The pragmatic analysis (Gricean implicature) is standard linguistics/philosophy of language. The sociological claims about referee behavior are well-documented in academic hiring literature.

  **Point of Least Certainty:**
  I am least sure about the **Counterfactual Outcome (Section 6)**. Specifically, the claim that information would migrate to "back channels" rather than simply disappearing.
  *   *Reason for uncertainty:* It is difficult to predict human behavior under radical normative shifts. It is possible that in a literal-only regime, a new norm of "brutal honesty" could emerge (as seen in some European systems), where negative assertions are depersonalized and not seen as social attacks. If that cultural shift occurred, the "back channel" migration might not happen, and the system could stabilize with explicit negatives. My analysis assumes the current US-centric academic culture of conflict-avoidance remains constant, which is a variable I cannot control for.
