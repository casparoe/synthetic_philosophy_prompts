answer: |-
  Your intuition about "load-bearing" versus "scenery" is sharper than most of the literature gives credit for. You have effectively reinvented a distinction that professional philosophers of science wrestle with constantly. In the literature, your load-bearing versus scenery distinction is most closely mapped to "working posits versus idle posits."

  Here is the menu of distinct claims your friend's "miracle" line could be making, analyzed against your experience and the pessimistic induction.

  **R1: Global Approximate Truth**
  *   **Claim:** The successful theory is "roughly true" in its entirety; both the equations and the ontological story (the scenery) correspond to reality.
  *   **Status:** **False.** History shows ontological stories (ether, humours) are discarded even when equations survive.
  *   **Effect on Pessimistic Induction:** **Fails.** The pessimistic induction specifically targets this claim by listing theories that were successful yet ontologically wrong.
  *   **Scenery:** Includes scenery in the truth claim, which makes it vulnerable.
  *   **Miracle:** Uses "miracle" to suggest success is impossible without total correspondence.

  **R2: Empirical Adequacy (Instrumentalism)**
  *   **Claim:** "Roughly true" means only that the theory saves the phenomena; the load-bearing math works, but we make no claim about whether electrons or genes actually exist.
  *   **Status:** **Defensible but Trivial.** It reduces the claim to "science predicts well," which nobody disputes.
  *   **Effect on Pessimistic Induction:** **Concedes.** This agrees with the pessimist that the theory might be wholly false regarding what is actually there; it just denies that truth matters for success.
  *   **Scenery:** Treats everything as scenery (useful fictions).
  *   **Miracle:** Uses "miracle" only as a figure of speech for "unexpectedly good fit."

  **R3: Structural/Selective Realism**
  *   **Claim:** The load-bearing parts (mathematical structure, causal relations, referential terms) latch onto reality, while the scenery (visualizable mechanisms, specific ontological nature) may be false.
  *   **Status:** **Substantive and Defensible.** It aligns with the history of science (e.g., Fresnel's equations survived the death of the ether).
  *   **Effect on Pessimistic Induction:** **Stops it.** It argues the pessimist conflates scenery with structure. Past theories were wrong about the *nature* of things, but right about the *relations* between them. Thus, current load-bearing parts are likely retained in future theories.
  *   **Scenery:** Explicitly excludes scenery from the truth claim, protecting the argument from historical counterexamples.
  *   **Miracle:** Uses "miracle" to assert that predictive success is best explained by the structural components referring to real constraints in nature.

  **R4: Methodological Presumption**
  *   **Claim:** We should *assume* the theory is true for the purpose of research, regardless of whether it actually is.
  *   **Status:** **True but Irrelevant to Truth.** This is a rule of conduct, not a claim about reality.
  *   **Effect on Pessimistic Induction:** **Sidesteps it.** It doesn't argue the pessimist is wrong about truth; it argues truth is not the point of the "miracle" line.
  *   **Scenery:** Treats scenery as a useful heuristic for Mondays.
  *   **Miracle:** Uses "miracle" to mean "a productive attitude," not an ontological fact.

  **Analysis of Your Wrinkles**

  *   **Does "miracle" smuggle anything in?** Yes. In R1 and R3, it smuggles in an *Inference to the Best Explanation*. It asserts that realism is the only non-miraculous explanation for success. In R2 and R4, it is merely rhetorical.
  *   **Does "roughly true" mean claims, structure, or reference?** In R1, it means claims. In R3, it means structure and reference. Your spectroscopy experience confirms R3: the damping constant was scenery (false claim), but the lineshape equation was load-bearing (structural truth).
  *   **Does the line need to cover scenery?** No. If it covers scenery (R1), it is false. If it excludes scenery (R3), it survives the pessimistic induction. Your friend likely slipped between R1 and R3 without noticing.
  *   **Is there a reading true but irrelevant to truth?** Yes, R4. It claims we should *act* as if theories are true to keep the lab running, but admits the pessimist might be right about reality.

  **Conclusion**

  The pessimistic induction succeeds against R1 (Global Truth) and is ignored by R2 (Instrumentalism) and R4 (Method). Only R3 respects your distinction between the math that works and the story you tell about it, thereby neutralizing the induction without abandoning truth.

