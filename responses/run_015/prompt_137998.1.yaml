answer: |-
  The practices you describe—U.S. patent law, copyright law, and the norms of scientific credit—do not form a single, coherent philosophical system. Rather, they constitute a **pragmatic pluralism** that balances conflicting metaphysical intuitions about discovery and invention against administrative and economic necessities.

  To reconstruct the implicit theory, we must distinguish between what these practices *strictly presuppose* (logical necessities for the rules to function) and what they *fit well with* (philosophical narratives that justify them but are not required by them).

  ### I. The Patent Regime: Administrative Certainty over Metaphysical Truth

  **The Practice:** First-inventor-to-file; no defense for independent invention; derivation proceedings to police theft.

  **The Implicit Theory:**
  The patent system does not strictly presuppose that inventions are inevitable social products, nor does it strictly presuppose that the individual inventor is the sole source of value. Instead, it strictly presupposes that **certainty of title is more valuable than metaphysical fairness.**

  1.  **First-to-File:** This does not prove that the first filer is the "true" inventor in a metaphysical sense. It strictly presupposes that *conception* is internal and unprovable, while *filing* is external and verifiable. It fits well with a view of invention as a race where the winner takes all, but it is licensed by a bureaucratic necessity: the state cannot adjudicate secret thoughts.
  2.  **No Independent Invention Defense:** This is the strongest evidence against a "natural rights" theory of patents. If the law believed the inventor had a natural property right in their idea, a second person who generated that idea through their own mental labor would have a competing natural right. By extinguishing the second inventor's right, the law presupposes that the patent is a **statutory monopoly granted for public benefit**, not a recognition of pre-existing ownership. It fits well with the view that functional ideas are scarce resources that must be allocated to one actor to incentivize the high cost of commercialization.
  3.  **Derivation Proceedings:** The existence of this mechanism acknowledges that independent invention is *possible* (otherwise, why check for theft?). However, it limits the inquiry to *theft*, not *simultaneity*. This presupposes that the only moral wrong worth remedying is misappropriation, not coincidence.

  **Consistency or Compromise?**
  The patent package is a **compromise between inconsistent views.**
  *   *View A (Inevitability):* If inventions were truly inevitable social products, granting a monopoly to the first filer that blocks the second independent inventor is inefficient and unjust. The second inventor proves the idea was "in the air."
  *   *View B (Individual Origin):* If the individual genius were the sole source of value, the second independent genius should retain rights to their own labor.
  *   *The Compromise:* The law adopts a **Utilitarian/Instrumentalist** stance. It treats the invention *as if* it belongs to the first filer, not because they are metaphysically unique, but because this rule induces **early disclosure**. The "no independent invention" rule is not a statement on the nature of creativity; it is a price tag on the monopoly. You get the monopoly only if you accept the risk that you might be barred by a prior filer, even if you didn't copy them.

  ### II. The Copyright Contrast: Ontology of Expression vs. Function

  **The Practice:** Independent creation is a full defense and source of rights.

  **The Implicit Theory:**
  The contrast between patent and copyright suggests the law holds two different ontological theories, though a single utilitarian theory can explain both.

  1.  **Distinct Ontologies (The "Fit"):** The practices fit well with the view that **functional truths are discovered** (singular, inevitable) while **expressive works are created** (pluralistic, unique). Under this view, there is only one "best" mousetrap (patent), but infinite ways to write a sonnet (copyright). Therefore, independent convergence in patents is expected and must be regulated; in copyright, it is statistically negligible or irrelevant because the expression itself is the value.
  2.  **Unified Utilitarianism (The "Strict" Presupposition):** Strictly, the law does not need to commit to this ontology. A single economic theory explains both: **The Cost of Policing.**
      *   In patents, functional ideas are easily reverse-engineered. If independent invention were a defense, every patent holder would have to prove "copying" in court, which is nearly impossible for functional devices. The monopoly would be worthless. Thus, strict liability is required to make the incentive work.
      *   In copyright, expression is harder to reverse-engineer perfectly. Policing "copying" is feasible (via access + similarity tests). Therefore, the law can afford to be fairer to independent creators without destroying the economic incentive.
      *   *Conclusion:* The difference is not necessarily about the *nature* of the work, but about the *transaction costs* of protecting it.

  ### III. Scientific Credit: Priority of Publication as Social Coordination

  **The Practice:** Eponyms and prizes (max three) reward the first to publish, even if others were close (Darwin/Wallace, Newton/Leibniz).

  **The Implicit Theory:**
  Scientific norms strictly presuppose that **knowledge is a public good that requires coordination.**

  1.  **Priority of Publication:** This does not strictly presuppose that discoveries are *not* inevitable. In fact, it fits well with the view that they *are* inevitable (hence the anxiety about being scooped). The norm presupposes that the *act of communication* is the valuable contribution to the commons, not the private conception. Wallace and Darwin both get credit in history books, but the "Darwinian" revolution is named for the one who structured and published the argument comprehensively first.
  2.  **The Three-Laureate Limit:** This strictly presupposes that **credit is a scarce currency.** If credit were infinite, there would be no need to limit prize winners. The limit forces a narrative of "key contributors" onto what is often a diffuse, cumulative process. This fits with a "Great Man" theory of history, but strictly serves a bureaucratic function: prizes are meant to incentivize *future* research by signaling what is valuable. Too many winners dilutes the signal.

  ### IV. Counterfactuals: Changing the Implicit View

  If we replaced the current implicit pragmatism with a rigorous philosophical stance, the practices would have to shift significantly.

  **Scenario A: The Thorough Inevitabilist View**
  *Belief:* Discoveries are bound to happen once background conditions are met; the identity of the discoverer is irrelevant noise.
  *   **Patents:** The current system would become indefensible. If the invention is inevitable, granting a 20-year monopoly to one person blocks the inevitable progress of others. We would likely see:
      *   Recognition of an **Independent Invention Defense**.
      *   Shorter patent terms or a shift toward **Compulsory Licensing** (everyone pays a fee, but no one is blocked).
      *   Possibly the abolition of patents in favor of state-funded prizes (as proposed by some economists), decoupling reward from monopoly.
  *   **Copyright:** Might remain largely unchanged, as expression is less "inevitable" than function. However, if culture is also seen as deterministic, the term of copyright might shorten drastically, viewing works as inevitable cultural outputs rather than individual creations.
  *   **Science:** Eponyms would vanish (no "Newton's Laws," only "The Laws of Motion"). Prizes would become **collective** (awarded to labs or consortia) or anonymous. The focus would shift entirely to the *content* of the discovery, stripping the social status from the *discoverer*.

  **Scenario B: The Thorough Individualist View**
  *Belief:* The individual mind is the sole source of value; the discovery is an extension of the self (Natural Rights/Lockean).
  *   **Patents:** The "First-to-File" rule would be morally suspect. We would return to **First-to-Invent** (as the U.S. had pre-2013). More radically:
      *   An **Independent Invention Defense** would become mandatory. If I created this from my own genius, you cannot stop me from using it, regardless of your filing date.
      *   Patents would look much more like Copyright: rights against *copying*, not rights against *use*.
  *   **Science:** The three-laureate limit would become immoral. If Wallace and Darwin both conceived natural selection, denying Wallace equal status is a moral failing. Prizes would expand to include **all contributors**. Credit would be fractionalized rather than winner-take-all.
  *   **Tension:** Even with this view, administrative chaos looms. If everyone has a natural right to their independent invention, the legal system drowns in disputes over who thought of what first. Thus, even Individualism often collapses back into Pragmatism (First-to-File) for the sake of order.

  ### V. Conclusion: The Pragmatic Synthesis

  The practices you and your friend analyzed do not strictly presuppose a single metaphysical truth about discovery. They presuppose a **functional hierarchy of values**:

  1.  **Disclosure > Secrecy:** (Patents and Science both reward making it public).
  2.  **Certainty > Fairness:** (Patents sacrifice the independent inventor to ensure clear title).
  3.  **Incentive > Access:** (Both IP regimes grant temporary monopolies to induce production).

  The system is philosophically underdetermined. It allows a "Great Man" to feel honored (science prizes) while treating him as a replaceable unit of production (patent infringement rules). It allows an author to feel unique (copyright) while acknowledging that ideas themselves are common property (idea/expression dichotomy).

  If you adopted the **Inevitabilist** view thoroughly, the patent system would crumble, as its monopoly logic relies on the scarcity of the *commercial realization* of the idea, not the idea itself. If you adopted the **Individualist** view thoroughly, the patent system would become unenforceable, as it relies on excluding others who might genuinely be "creators" in their own right.

  The current stability of these practices relies on **not** asking the question you and your friend asked. They rely on the ambiguity of treating the inventor as a "genius" when handing out prizes, but as a "first-filer" when enforcing rights. To resolve the ambiguity is to break the machine.
