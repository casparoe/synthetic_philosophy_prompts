prompt: |-
  hey — i'm taking a judgment & decision-making course this term and i'm also the person who writes the budget for my student society. We run six or seven events a year (a careers-fair type thing, a couple of socials, a conference, a few one-offs), and every one needs a projected attendance number and a cost estimate that the student union finance comittee signs off on. The committee is five undergrads who have never heard of any of this. If we overrun by more than about 15% we eat it out of next term's allocation, and if we underspend badly they cut our budget, so both directions hurt a bit. I've got maybe half an hour per proposal, a spreadsheet, and my memory of what past events actually cost.

  So: can you turn the inside view / outside view stuff into a procedure I can actually run? Not "be aware of the planning fallacy" — I want the ordered questions, what counts as a good enough answer to each one, where the procedure says stop and don't commit the money, and where it has to hand the decision back to the committee because it's a values call rather than an estimation call. Remember the people signing off are 19 to 21 and have no stats, so no step can need more than a spreadsheet.

  The bits I keep getting stuck on, which I want the procedure to actually handle rather than hand-wave:

  - I build the bottom-up number first (venue, catering per head, ticket sales as a percentage of last time, sponsorship I'm "pretty sure" about) and then I go looking for a reference class — which means I can basically shop for whichever class gives me the answer I already wanted. How does the procedure stop me doing that? Do I have to commit to the class before I'm allowed to do the bottom-up estimate?
  - Some line items obviously have base rates and some don't. Catering cost per head: years of data. "Will this speaker actually draw 200 people": nothing. Do I regress the total or the components? Regressing the whole total feels like it throws away the information I genuinely do have.
  - Our reference class is only the events we actually ran, and we only ran the ones we felt good about after doing exactly this kind of optimistic planning. I've argued myself into both "so the base rate is too rosy" and "so the base rate is fine, because the filter operating on the class is the same filter operating on me now." Which is it, or what would I have to check to tell?
  - Do the events we proposed and then quietly didn't run go in the class?
  - When am I allowed to shift off the base rate because this case is genuinely different, and what makes that a legitimate reason instead of a rationalization? Does it have to be a mechanism I state out loud in advance and can score afterwards, and what do I do with a reason I only thought of after seeing the outside-view number?

  Then run it on three of next term's proposals: (1) the careers fair, which we've now run four times and where I have a specific, nameable reason to expect slightly above our average; (2) a two-day hackathon we've never done, where the only reference class I can build is other societies' published budgets, which I strongly suspect are the numbers they *planned* rather than what they spent; and (3) the conference, which is the event everyone loves, that I've already half-promised to people, and which I want you to apply the procedure to straight — even if the honest answer is that we should run it at half the capacity, with a much bigger contingency than I want to ask for, or not this year. I'd rather hear that from the procedure in October than find out in March.

  Also: be clear about what this procedure can't do — the cases where it's silent or where it's really just my own judgement with a spreadsheet costume on — and tell me which steps are judgement calls dressed up as procedure. And say what would change your mind about the procedure itself: where is your reasoning most likely to fail, and is there anything about how we operate that, if I told you, would make you say "actually, just use your inside view here"?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Student society budget officer. Taking a Judgment & Decision-Making (JDM) course.
      *   **Task:** Create a budget estimation procedure for 6-7 events/year.
      *   **Constraints:**
          *   Finance Committee: 5 undergrads (19-21 yo), no stats knowledge, need simple spreadsheet logic.
          *   Time Budget: ~30 mins per proposal.
          *   Risk: Overrun >15% = penalty (cut next term). Underspend = penalty (cut budget). Goal: Accuracy within a tight band.
          *   Tools: Spreadsheet, memory of past costs.
          *   Specific Pain Points: Reference class shopping, mixing inside/outside views, selection bias in past events, handling unique line items, justification for deviations.
      *   **Specific Requests:**
          *   Turn Inside/Outside View into a concrete procedure (ordered questions, stop rules, hand-off rules).
          *   Address specific sticking points (order of operations, regression level, selection bias, cancelled events, deviation criteria).
          *   Run the procedure on 3 specific cases (Careers Fair, Hackathon, Conference).
          *   Meta-analysis: What can't the procedure do? Where is it just disguised judgment? Where might the procedure itself fail?

  2.  **Deconstruct the JDM Concepts:**
      *   **Inside View:** Focusing on the specifics of the current case (bottom-up estimates, unique details). Prone to planning fallacy/optimism bias.
      *   **Outside View:** Focusing on the statistics of a reference class (base rates). Prone to ignoring unique information.
      *   **The Goal:** Combine them optimally (Kahneman & Lovallo's advice usually suggests starting with the outside view to anchor, then adjusting).
      *   **The User's Problem:** They do Inside first, then shop for an Outside view to confirm. This is confirmation bias.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Constraint Check:* Must be doable in 30 mins, spreadsheet-friendly, understandable by 19-year-olds.
      *   *Step 1: Reference Class Definition (Before Numbers).* To stop shopping, the class must be defined *before* calculating costs.
      *   *Step 2: Base Rate Calculation.* Simple average or median of past events.
      *   *Step 3: Inside View Calculation.* Bottom-up estimate.
      *   *Step 4: Comparison & Adjustment.* How to blend them.
      *   *Step 5: Deviation Justification.* When can you ignore the base rate?
      *   *Step 6: Stop/Hand-off Rules.* When is the risk too high?

      *Refining the "Sticking Points":*
      *   *Order:* Outside View *first*. Lock the class before opening the cost spreadsheet.
      *   *Regression:* Regress the *total cost* and *attendance* separately, not line items (too much noise for a 30-min process). Line items are for the Inside View check.
      *   *Selection Bias:* The "survivor bias" of past events. Need to account for cancelled events if possible, or acknowledge the bias.
      *   *Deviation:* Needs a "pre-commitment" rule. If the reason arises *after* seeing the number, it's suspect.
      *   *Committee Hand-off:* If the procedure says "No" or "High Risk," the Committee decides on values (risk tolerance), not math.

  4.  **Developing the "30-Minute Budget Protocol":**
      *   *Phase 1: The Anchor (10 mins).* Define class, get base rate.
      *   *Phase 2: The Plan (10 mins).* Bottom-up estimate.
      *   *Phase 3: The Reconciliation (10 mins).* Compare, adjust, justify.
      *   *Rules:* No editing Phase 1 after seeing Phase 2.

  5.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Careers Fair (Repeat Event).**
          *   *Class:* Past 4 fairs.
          *   *Base Rate:* Average attendance/cost.
          *   *Inside View:* Specific reason for growth (e.g., new major sponsor).
          *   *Verdict:* Likely safe to adjust slightly up, but cap at X%.
      *   **Case 2: Hackathon (New Event, Bad Data).**
          *   *Class:* Other societies' *planned* budgets (known to be optimistic).
          *   *Bias:* The reference class itself is biased.
          *   *Adjustment:* Apply a "fudge factor" (e.g., +20% to their costs, -20% to their attendance).
          *   *Verdict:* High uncertainty. Needs larger contingency or smaller scale.
      *   **Case 3: Conference (Emotional/Sunk Cost).**
          *   *Class:* Past conferences.
          *   *Inside View:* "Everyone loves it," "Half-promised."
          *   *Conflict:* Inside view likely optimistic due to emotional investment.
          *   *Verdict:* Procedure will likely suggest scaling back or high contingency. Hard truth needed.

  6.  **Addressing the Meta-Questions (Limitations & Failure Modes):**
      *   *What can't it do?* It can't predict black swans. It can't fix bad data. It can't make value judgments (is the event *worth* the risk?).
      *   *Disguised Judgment:* Defining the reference class is still subjective. Deciding if a deviation reason is "valid" is subjective.
      *   *Procedure Failure:* If the world changes structurally (e.g., inflation spike, pandemic), past base rates are useless.
      *   *When to use Inside View?* If the event is truly unique (no class), Inside View is all you have, but needs heavy contingency.

  7.  **Review and Refine:**
      *   *Tone:* Professional, direct, peer-to-peer (you're a student talking to a student).
      *   *Clarity:* Use bolding, lists, and clear "If/Then" logic.
      *   *Constraint Check:* Did I answer the specific questions about reference class shopping and line items? Yes.
      *   *Committee Friendly:* Ensure the final output is something they can sign off on without needing a stats degree.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Initially, I thought about suggesting regression analysis. *Correction:* No, user said "no stats." Keep it to Averages/Medians and simple percentages.
      *   *Correction:* Make sure to address the "cancelled events" question explicitly.
      *   *Correction:* Ensure the "Hand-off" point is clear. The Committee decides *risk*, the Officer decides *estimates*.

  9.  **Final Output Structure:**
      *   Introduction (Acknowledging the constraints).
      *   The Protocol (Step-by-Step).
      *   Addressing the Sticking Points (Embedded in the protocol logic).
      *   Application to the 3 Cases.
      *   Meta-Analysis (Limitations & Failure Modes).

  *(Self-Correction on the "Cancelled Events" point)*: If an event was proposed and cancelled *because* the budget looked bad, it's selection bias. If it was cancelled due to external factors, it might still be relevant. I need to make a rule for this. Let's say: Include proposed-but-cancelled only if cancelled for non-budget reasons, otherwise note the bias. Actually, simpler: If you have data on *why* it was cancelled, use it. If not, exclude but acknowledge the "survivorship bias" in the notes to the committee.

  *(Self-Correction on "Line Items")*: User asked "Regress total or components?" For a 30-min process with non-stats committee, Total Cost and Total Attendance are the only robust metrics. Line items are for the Inside View check to ensure no obvious errors (e.g., forgetting venue deposit).

  *(Self-Correction on "Committee Hand-off")*: The committee shouldn't decide the *number*. They should decide the *risk tolerance*. If the procedure says "High Risk of Overrun," the Committee decides "Do we care more about running the event or protecting next term's budget?"

  Let's write it.cw
answer: |-
  This is a classic JDM problem: you have high stakes (budget penalties), low time (30 mins), low statistical literacy (committee), and high cognitive bias risk (planning fallacy, confirmation bias).

  You cannot run a regression in 30 minutes, and you cannot teach five 19-year-olds Bayesian updating. You need a **heuristic protocol** that forces the Outside View to happen *before* the Inside View locks in your optimism.

  Here is the **30-Minute Budget Protocol**. It is designed to be run in a spreadsheet with tabs for "Reference Class," "Inside Estimate," and "Reconciliation."

  ---

  ### Part 1: The Protocol (Step-by-Step)

  **Rule 0:** You must complete Phase 1 before opening the tab for Phase 2. You cannot go back and edit Phase 1 after seeing Phase 2 numbers.

  #### Phase 1: The Anchor (Outside View) — 10 Minutes
  *Goal: Establish the baseline before you fall in love with the plan.*

  1.  **Define the Reference Class:**
      *   *Question:* "What is the smallest set of past events that are structurally identical to this one?"
      *   *Constraint:* You must list the specific events included (e.g., "2021, 2022, 2023 Conferences").
      *   *Cancelled Events:* Include events that were proposed and budgeted but **cancelled for external reasons** (e.g., venue double-booked, speaker illness). Do **not** include events cancelled because "the budget looked too risky" (that is selection bias).
      *   *Stop Rule:* If you cannot name at least **3** comparable events, mark this as **"Class Size < 3"** (High Uncertainty).
  2.  **Calculate Base Rates:**
      *   Pull **Total Actual Cost** and **Actual Attendance** for those events.
      *   Calculate the **Median** (not average, to ignore outliers) for Cost and Attendance.
      *   Calculate the **Average Overrun %** for that class. (e.g., If past events budgeted $1k but spent $1.2k, the overrun is 20%).
  3.  **Lock the Number:**
      *   Write down the **Base Rate Cost** and **Base Rate Attendance**.
      *   *Action:* Lock this cell in the spreadsheet. Do not change it.

  #### Phase 2: The Plan (Inside View) — 10 Minutes
  *Goal: Build the bottom-up estimate without trying to match the Anchor.*

  1.  **Bottom-Up Build:**
      *   List line items (Venue, Catering, etc.).
      *   Use current quotes or inflated past costs (add 5% for inflation automatically).
      *   **Sponsorship Rule:** If a sponsor is not signed, count it as $0. If signed but amount variable, count 50% of promised amount.
  2.  **Calculate Inside View Total:**
      *   Sum the costs.
      *   Estimate attendance based on specific plans (marketing spend, speaker draw).
  3.  **Blind Comparison:**
      *   Reveal the Phase 1 Anchor.
      *   Calculate the **Gap %**: `(Inside View - Base Rate) / Base Rate`.

  #### Phase 3: Reconciliation & Decision — 10 Minutes
  *Goal: Adjust the Inside View toward the Base Rate unless there is a pre-committed reason not to.*

  1.  **The Deviation Test:**
      *   If the Gap % is > 10% (higher or lower), you must fill out the **Deviation Justification Form** (see below).
      *   *Rule:* You cannot use reasons discovered *after* seeing the Gap. The reason must be a specific, tangible change in mechanism (e.g., "Venue cost is 20% higher because we moved halls," not "I feel more confident this year").
  2.  **The Blending Rule:**
      *   If Deviation Justification is **Weak/Empty**: Your Final Budget = `0.6 * Base Rate + 0.4 * Inside View`. (Weight the Outside View heavier).
      *   If Deviation Justification is **Strong/Verified**: Your Final Budget = `Inside View`.
      *   **Contingency:** Add a flat **10% contingency** to the Final Budget unless Class Size < 3 (then 20%).
  3.  **The Stop/Hand-Off Rules:**
      *   **STOP (Do Not Submit):** If `Final Budget > Last Year's Actual by 30%` AND `Deviation Justification is Weak`. (You are planning a much bigger event without a reason).
      *   **HAND-OFF (Committee Decision):** If `Class Size < 3` (New Event) OR `Predicted Overrun Risk > 15%` (based on past class variance).
          *   *Note to Committee:* "The math says there is a high risk of overrun. We can proceed, but if we overspend, it comes out of next term's social budget. Do you accept this risk?"

  ---

  ### Part 2: Addressing Your Sticking Points

  **1. Reference Class Shopping (Inside before Outside)**
  *   **Fix:** Phase 1 must be completed and *locked* before Phase 2 begins. The spreadsheet should physically prevent you from viewing the Inside View tab until the Reference Class tab is marked "Complete."
  *   **Why:** This prevents you from building a $10k budget and then looking for a class that averages $10k. You must accept the class average before you know what your plan costs.

  **2. Line Items vs. Total Regression**
  *   **Fix:** Regress the **Total**.
  *   **Why:** In a 30-minute window with no stats training, line-item regression introduces noise. Catering might be stable, but venue costs might spike. The *Total Cost* base rate captures the systemic friction of your society (e.g., you always forget to budget for insurance). Use line items only to check for gross errors (e.g., you forgot the venue deposit).

  **3. Selection Bias (We only ran events we felt good about)**
  *   **Fix:** Acknowledge the bias in the "Notes to Committee."
  *   **Logic:** You are correct that the base rate is rosy. Your society filters out bad ideas *before* they become data points.
  *   **Adjustment:** If your Reference Class is "Events we ran," apply a **Rosy Bias Correction** of +5% to the Base Rate Cost and -5% to Base Rate Attendance automatically. This accounts for the fact that you are currently in the "feeling good" phase, just like you were before the past events.

  **4. Cancelled Events**
  *   **Fix:** Include them *only* if you have cost data.
  *   **Logic:** If you cancelled an event after spending $500 on deposit, that $500 is data. If you cancelled it at the idea stage with $0 spent, it is not cost data, but it *is* attendance data (Attendance = 0). Include idea-stage cancellations in the Attendance Base Rate (it lowers the average), but not the Cost Base Rate.

  **5. Legitimate Deviation vs. Rationalization**
  *   **Fix:** The **Pre-Commitment Rule**.
  *   **Logic:** A valid reason must be written down *before* you calculate the Gap.
      *   *Valid:* "We have a signed contract for a speaker who drew 300 people last year." (Mechanism).
      *   *Invalid:* "We think marketing will work better this time." (Hope).
      *   *Post-Hoc Reason:* If you think of a reason *after* seeing the Gap, you must apply the Blending Rule (60% Outside / 40% Inside). You are not allowed to go 100% Inside View on a post-hoc justification.

  ---

  ### Part 3: Running the Protocol on Your Three Proposals

  #### Case 1: The Careers Fair (Repeat Event)
  *   **Phase 1 (Outside):** Reference Class = Last 4 Fairs. Median Cost = $5,000. Median Attendance = 250. Average Overrun = 5%.
  *   **Phase 2 (Inside):** Bottom-up = $5,800. Expected Attendance = 300. Reason: "New partnership with Engineering Faculty."
  *   **Phase 3 (Reconciliation):**
      *   Gap: 16% higher cost.
      *   Deviation Check: Is "Engineering Partnership" pre-committed? Yes, email confirmation exists.
      *   Adjustment: Allow Inside View, but cap attendance increase at 10% (conservative estimate of faculty impact).
      *   **Final Budget:** $5,800 + 10% contingency = $6,380.
      *   **Verdict:** **Submit.** The deviation is mechanistic and verified.

  #### Case 2: The Hackathon (New Event, Bad Data)
  *   **Phase 1 (Outside):** Reference Class = 3 Other Societies' Published Budgets.
      *   *Bias Check:* These are *planned* numbers, not *actuals*.
      *   *Correction:* Apply "Rosy Bias Correction" (+20% to their costs, -20% to their attendance) because you suspect they are optimistic.
      *   Adjusted Base Rate Cost: $12,000 (derived from their $10k avg + 20%).
  *   **Phase 2 (Inside):** Bottom-up = $10,000. (You are under-cutting them to be efficient).
  *   **Phase 3 (Reconciliation):**
      *   Gap: Your Inside View is *lower* than the Adjusted Outside View.
      *   Deviation Check: "We are more efficient." -> **Weak.** (Everyone thinks they are efficient).
      *   Blending Rule: 60% Outside ($12k) + 40% Inside ($10k) = $11,200.
      *   Contingency: Class Size < 3 (of *actual* data). Increase contingency to 20%.
      *   **Final Budget:** $11,200 + 20% = $13,440.
      *   **Hand-Off:** **Committee Decision.** Flag as "High Uncertainty." Tell them: "We have no internal data. There is a 20% chance we lose money. Do we want to risk next term's social budget for this?"

  #### Case 3: The Conference (Emotional/Sunk Cost)
  *   **Phase 1 (Outside):** Reference Class = Last 3 Conferences. Median Cost = $20,000. Average Overrun = 18% (Historically risky).
  *   **Phase 2 (Inside):** Bottom-up = $20,000. Attendance = High.
      *   *Note:* You "half-promised" people a big event. This is emotional pressure, not data.
  *   **Phase 3 (Reconciliation):**
      *   Gap: 0% (You matched the base rate).
      *   *Risk Check:* Historical overrun is 18%. Your buffer is 10%.
      *   *Math:* If history says 18% overrun and you only budget 10%, you are statistically likely to trigger the penalty.
      *   **Procedure Output:** **Do Not Commit.**
      *   **Required Action:** You must either (A) Reduce Scope to lower the Base Rate to $15k, or (B) Request a 20% contingency.
      *   **Hand-Off:** **Committee Decision.** "History shows we overspend by 18% on this event. To stay within the 15% safety margin, we must cut the budget by 5% or risk a penalty. Do we cut the budget or accept the risk?"
      *   *Hard Truth:* The procedure forces you to admit that running it "as planned" is a gamble with next term's money.

  ---

  ### Part 4: Meta-Analysis (Limitations & Failure Modes)

  **1. What this procedure cannot do**
  *   **Black Swans:** It cannot predict a pandemic, a sudden venue bankruptcy, or a 50% inflation spike in catering. It assumes the future resembles the past.
  *   **Value Judgments:** It cannot tell you if the Hackathon is *worth* the risk. It only tells you the risk exists. The Committee must decide if the mission justifies the potential budget cut.
  *   **Bad Data:** If your past records are wrong ("Memory of what past events actually cost"), the Base Rate is garbage. The procedure assumes your historical data is accurate.

  **2. Where is this just disguised judgment?**
  *   **Defining the Reference Class:** Deciding if a "Social" is comparable to a "Networking Event" is subjective. You could game the system by choosing a class that fits your desired number.
      *   *Mitigation:* The "Lock Phase 1" rule helps, but you must be honest.
  *   **Validating Deviations:** Deciding if "Engineering Partnership" is a strong enough reason to ignore the Base Rate is subjective.
      *   *Mitigation:* Require evidence (email, contract) attached to the spreadsheet.

  **3. Where is my reasoning most likely to fail?**
  *   **The "Rosy Bias" Correction:** I suggested +5% / -5% adjustments for selection bias. This is a guess. If your society is actually *better* at planning now than in the past, this penalizes you unnecessarily.
  *   **The Blending Weight (60/40):** I arbitrarily chose 60% Outside View. In reality, if your Inside View is based on signed contracts, it should weigh more. If it's based on guesses, it should weigh less.
  *   **Small Sample Size:** With only 3-4 past events, the "Median" is unstable. One bad year skews everything.

  **4. What would make me say "Use your Inside View"?**
  *   **Structural Break:** If the university changes the venue booking policy entirely, past venue costs are irrelevant.
  *   **Signed Contracts:** If 80% of your costs are already invoiced and signed, the Outside View is irrelevant. You are no longer estimating; you are accounting.
  *   **Strategic Loss:** If the Student Union explicitly says "We want you to lose money on the Conference to build prestige," then financial accuracy is not the goal. (But based on your prompt, accuracy *is* the goal).

  ### Final Advice for the Committee
  Since they are 19-21 and hate stats, do not show them the "Blending Rule." Show them the **Final Number** and the **Risk Flag**.
  *   **Green Flag:** Base Rate and Inside View match within 10%.
  *   **Yellow Flag:** New event or historical overrun >10%.
  *   **Red Flag:** Inside View ignores Base Rate without evidence.

  Tell them: *"Green means the math checks out. Yellow means we need a contingency. Red means we are guessing, and if we guess wrong, next year's social budget pays for it."* That is a language they understand.
