      *   **The Missing Piece:** Both are ignoring the *common knowledge of rationality* assumption. The Dollar Auction works *because* people aren't perfectly rational or don't believe the other is perfectly rational. If both were perfectly rational, the auction ends at 0 bids. The fact it reached 99c proves at least one player is irrational. Once irrationality is proven, standard equilibrium analysis breaks down.

  7.  **Drafting the Response:**
