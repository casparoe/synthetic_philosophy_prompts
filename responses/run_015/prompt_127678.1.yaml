answer: |-
  Good morning. It is cold, and there is no program. That is exactly how he wanted it.

  He spent twenty years volunteering on this prairie, not because he thought nature was holy, but because he thought it was real. He spent his career teaching that the *Zhuangzi* is not a book of serene wisdom, but a book of jokes, arguments, and strange transformations. He hated the word "mystic." He kept a translation on his shelf with "Mystic" in the title specifically to show visitors the single worst word in the book. He would laugh about it at dinner, usually while arguing with someone who wanted him to be comforting.

  So I am not going to tell you he is at peace. On his view, there is no "he" left to be in a state of peace. I am not going to tell you he has returned to a cosmic source. He thought that was a Victorian invention smuggled into Chinese text. And I am not going to tell you he is with us in spirit, because he believed the body becomes soil, ants, and crows, and he preferred that honesty to the comfort of ghosts.

  I know this is hard to hear. My sister is angry that people keep telling her death is natural. She is right to be angry. It feels wrong. It feels like a theft. My brother Ray sent me a verse about resurrection because he wants to believe his father is safe. I honor that love. But my father's work suggests something different. He argued that the text asks us to loosen our grip on the boundary between "me" and "not-me." The question "what happens to me when I die" doesn't have an answer that consoles. It has an answer that unsettles.

  He believed the proper response to this unsettlement is not serenity, but curiosity. He thought the *Zhuangzi* was funny because the universe is absurd. When a friend died, he didn't hold a service. He went out to find a specific living thing. Last spring, it was a sedge wren. He wanted to see what the world was doing without him.

  So here is what we are going to do. We are not going to pray for his soul. We are not going to declare him part of the earth in a metaphorical sense. We are going to acknowledge that his ashes will mix with this soil, and that is a literal transformation he would have appreciated. He wanted to be useful to the grass.

  When we leave this shelter, I am asking you to do one concrete thing. Do not try to feel a particular way. Do not try to be brave or sad or resolved. Instead, look for one specific living thing. A bird, a weed, a beetle. Notice what it is doing. Let that be the witness.

  He taught ethics at a college, but he didn't want to be a lesson. He wanted to be a question. So I will not tell you what he taught us about death. I will tell you what he asked us to look for. He is not gone to a better place. He is here, changed. The work now is to see what else is here.

  Thank you.

