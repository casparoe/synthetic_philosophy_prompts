answer: |-
  She must first establish "indeterminate situation" as shared existential confusion, for this precedes distinguishing democracy from majoritarian preference-aggregation; without this, democracy remains mere voting. Next, she must distinguish inquiry as reconstruction from inquiry as technical application before separating it from expert opinion, intercepting credentialism by defining intelligence as social capacity rather than academic certification. Only then should she introduce the carrier scenario: a neighborhood collective allocating scarce water during a blackout. This scenario fails as pure science (no single formula exists) and fails as bargaining (interests transform through discussion); unlike a strike (adversarial) or jury (bound by law), it requires reconstructing the situation itself. She must intercept relativism immediately after the scenario, clarifying that success is not consensus but whether the situation becomes determinate—does the water last? She must omit Dewey's formal logic of propositions and sign-systems, focusing solely on the functional method. The session concludes with one question: "If we agree perfectly but the water runs out, was our inquiry successful?" This tests whether they grasp that validity lies in consequences, not vocabulary.

  **Note:** This plan conflates Dewey's metaphysical logic in *Logic: The Theory of Inquiry* (1938) with his political theory in *The Public and Its Problems* (1927), smoothing over contested interpretations regarding whether "inquiry" scales seamlessly from individual problem-solving to democratic governance. The "water scenario" is a pedagogical construct, not drawn from Dewey's texts.
