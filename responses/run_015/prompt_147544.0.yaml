answer: |-
  The protocol you describe licenses its bifurcation through a commitment best characterized as **methodological epiphenomenalism**. This view presupposes that qualia are real enough to serve as reliable indices for neural targeting (the baseline) but causally and normatively inert regarding the definition of harm (the assessment). It rejects the Chase and Sanborn eliminativist suspicion that qualia are incoherent posits; if the board truly believed first-person data were confabulated noise, they could not use it to calibrate neural interventions, as calibration requires a stable correlation between report and state. Instead, the board operates on the assumption that while subjective reports *track* physical states (making them useful for setup), they do not *constitute* the moral value of those states (making them irrelevant for safety).

  **Strict Requirements vs. Mere Accommodations**
  Strictly, the protocol requires only a **stable psychophysical correlation**. It demands that when a subject reports "sharpness" or "brightness," a corresponding, reproducible neural signature exists that the intervention can target. It does not strictly require that the subject's report be metaphysically authoritative about the *nature* of the experience, only that it be a consistent signal. The protocol merely **accommodates** the folk-psychological intuition that subjects have privileged access, utilizing it to facilitate cooperation during calibration, while simultaneously accommodating the institutional demand for "objective" safety data by discarding that same testimony during harm assessment.

  **Philosophical Underdetermination**
  The practice is **metaphysically underdetermined** but **ethically determinate**. Metaphysically, one could arrive at this protocol via Property Dualism (feelings exist but don't cause damage), Skeptical Realism (feelings exist but reports are unreliable indicators of welfare), or even a soft Eliminativism (reports are behavioral habits that correlate with neural risk). However, the ethical stance is fixed: welfare is defined physicalistically. The protocol treats the mind as a **dashboard**—useful for reading the gauges to set the engine (baseline), but irrelevant to the mechanical integrity of the engine itself (harm).

  **Uniform View Adjustments**
  *   **Uniform Realism:** If the board adopted a uniformly realist view (where qualia are both real and constitutive of welfare), the harm assessment would need to prioritize subjective testimony. If a subject reports agony, harm is confirmed regardless of neural calmness; the "neural metric" would become secondary to the phenomenological report.
  *   **Uniform Eliminativism:** If the board adopted a uniformly eliminativist view (à la Chase and Sanborn), the "phenomenal baseline" interview would be abolished as superstition. Calibration would rely exclusively on behavioral conditioning or direct neural mapping, treating the subject's verbal output as mere motor behavior rather than a window into conscious content.

  Verdict: Methodological Epiphenomenalism
