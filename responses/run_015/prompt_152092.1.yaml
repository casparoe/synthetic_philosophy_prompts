prompt: |-
  everyone in my seminar keeps comparing Davidson's radical interpretation to being a field anthropolgist dropped somewhere with no dictionary - you have to figure out both what people mean and what they actually believe at the same time, and you lean on charity just to get started. they use it to push the idea that there's no private mental lexicon and that meaning is always public and negotiated. but then i started thinking about pain asymbolia - those patients who report pain but show zero avoidance behavior, like the hurt signal is disconnected from the reaction. if you're the radical interpreter facing someone like that, do you charitably interpret them as feeling pain but lacking the normal response? or do you decide they don't mean pain at all? i want you to audit the anthropologist analogy properly: lay out the correspondence table - what's the phrasebook, what's the shared environment, what's playing the role of charity and triangulation. then tell me exactly where the mapping breaks, especially once asymbolia is in the picture, what assumptions about normal bodies and behavior the analogy quietly imports, and whether the conclusion - that meaning is inherently public - survives or whether the analogy was carrying it the whole time.
