answer: |-
  You are absolutely not being naive. You have correctly identified a classic problem in economics, management, and computer science, and there is indeed a name for it.

  The philosophical concept you are looking for is **Goodhart's Law**.

  It is commonly stated as: **"When a measure becomes a target, it ceases to be a good measure."**

  Originally formulated by economist Charles Goodhart regarding monetary policy, it applies perfectly here. The organizers intended the metric ("unique sensor integrations") to be a *proxy* for robot complexity and capability. However, once that metric became the *target* for winning, teams (like your partner) are incentivized to optimize for the metric itself rather than the underlying quality it was supposed to represent (a functional, complex robot).

  Here is a breakdown of the situation to help you settle the debate with your partner.

  ### 1. Rationality vs. Cheating
  Your partner is arguing from a standpoint of **local rationality**. In a closed system where the only goal is to maximize points and the rules don't explicitly forbid broken sensors, his logic holds up mathematically. This is often called "rules lawyering" or "specmanship."

  However, you are arguing from **systemic rationality**.
  *   **The Risk:** Most competitions have a "spirit of the competition" clause or human head judges who can override AI scores. If a judge sees five temperature sensors taped to a frame that aren't wiring into the control system, they can disqualify you for "misrepresentation" or "lack of functional integration." You risk a DQ for a cheap point boost.
  *   **The Precedent:** If every team does this, the organizers will invalidate the metric next year. You aren't building a reputation as clever engineers; you're building a reputation as people who look for loopholes.

  ### 2. The Engineering Argument
  Your partner claims optimization is the point of engineering. This is a half-truth.
  *   **Engineering is optimization *under constraints* with a *valid objective function*.**
  *   If your objective function is "Win State," but the constraint is "Build a robot that actually works," then taping broken sensors is a failure of engineering.
  *   Real-world engineering penalties are harsh. If you ship a product with fake sensors to meet a spec sheet, you get sued, recalled, or fired. Training yourself to game metrics rather than solve problems is bad career hygiene.

  ### 3. The "Cobra Effect"
  There is also a related concept called the **Cobra Effect** (a form of perverse incentive). It comes from a story where the British government in India wanted to reduce the cobra population, so they offered a bounty for dead cobras. People started *breeding* cobras to kill them for the bounty. When the government canceled the bounty, the breeders released the snakes, making the problem worse.

  If your team tapes broken sensors, you are breeding cobras. You are contributing to the degradation of the competition's integrity, which forces organizers to make rules more bureaucratic and less about creativity in the future.

  ### Recommendation
  **Do not tape the broken sensors.**

  Here is how you can frame this to your partner to de-escalate the fight:

  1.  **Risk Management:** "If the AI misses it, a human judge won't. If we get DQ'd for 'fake integration,' we lose everything. The risk/reward ratio is terrible."
  2.  **Definition of Integration:** "The rubric says 'integration.' In engineering, integration implies data flow, not just physical mounting. If it doesn't send data, it's not integrated; it's decoration. We could be penalized for false advertising."
  3.  **The Goodhart Argument:** "We know Goodhart's Law is in effect here. The smart play isn't to game the broken metric; it's to build a robot so functionally complex that we win even if they fix the scoring later."

  **Verdict:** You are right. This isn't optimization; it's exploitation of a flaw. Stick to sensors that help navigate. It keeps your conscience clear, keeps you safe from disqualification, and actually makes you better engineers.
