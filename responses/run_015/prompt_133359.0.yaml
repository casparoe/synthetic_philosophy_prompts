prompt: |-
  I sit on the grant committee for a small regional foundation—maybe $400k a year, 25 proposals, mostly local nonprofits and some odd advocacy projects—and we're trying to stop arguing in circles about what to fund. A friend mentioned the importance-tractability-neglectedness framework from cause prioritization, which sounds smart, but when we try to apply it to our actual pile it just collapses. We get direct stuff like food-bank equipment and weird indirect stuff like a journalist fellowship on water rights, and nobody knows how to compare them. Can you turn ITN into a real decision procedure I could actually run in a meeting? I need the questions in strict order, what counts as a sufficient answer at each step, where the procedure gives a hard no, and where it stops being facts and becomes values so we just vote. It needs to work for people without econ backgrounds, say what to do when you can't get a real number, and be honest about which steps are just judgment calls dressed up as procedure. Then apply it to two proposals: upgrading refrigeration at a food bank (direct, easy to understand) and a three-year fellowship for a journalist covering state water policy (indirect, high stakes, unclear tractability). Please include at least one case where the procedure spits out an answer my committee will hate, so I can see where it breaks. Also, seperate what's actually settled in the literature on this framework from what's genuinely contested—don't present one view on weighting importance vs tractability as if it's the consensus—because I need my board to know exactly where they're faking precision.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Grant committee member for a small regional foundation ($400k/year, ~25 proposals).
      *   **Problem:** Circular arguments about funding decisions (direct vs. indirect, local vs. advocacy).
      *   **Tool:** Importance-Tractability-Neglectedness (ITN) framework (from Effective Altruism/Cause Prioritization).
      *   **Goal:** Turn ITN into a *practical* decision procedure for a meeting.
      *   **Requirements:**
          *   Strict order of questions.
          *   Criteria for "sufficient answer" at each step.
          *   Hard "No" conditions.
          *   Clear distinction between facts and values (where to vote).
          *   Accessible to non-economists.
          *   Handling missing data (no real numbers).
          *   Honesty about judgment calls vs. procedure.
          *   Application to two specific cases: Food Bank Refrigeration vs. Journalist Fellowship.
          *   Include a "hated answer" (where the procedure breaks or gives counter-intuitive results).
          *   Distinguish settled vs. contested literature on ITN.

  2.  **Deconstruct the ITN Framework for this Context:**
      *   *Standard EA ITN:* Used for global cause prioritization (e.g., AI safety vs. Malaria). Scale is massive.
      *   *Regional Foundation ITN:* Scale is tiny ($400k). "Neglectedness" is local, not global. "Importance" is local impact, not lives saved globally. "Tractability" is about *their* money making a difference, not the field's overall progress.
      *   *Adaptation:* I need to "localize" ITN. It can't be about solving climate change; it's about solving *local* food insecurity or *state* water policy.
      *   *Critique:* ITN is often criticized for quantifying the unquantifiable. I need to be honest about this.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Step 1: Eligibility (The Hard No).* Before ITN, does it fit the mission? If not, stop.
      *   *Step 2: Importance (Scale/Severity).* How bad is the problem locally?
      *   *Step 3: Neglectedness (Crowding).* Is anyone else doing this?
      *   *Step 4: Tractability (Leverage).* Will *our* $ actually move the needle?
      *   *Step 5: The Aggregation (Values).* How do we weigh them? (This is the contested part).
      *   *Handling Numbers:* Use scales (1-5) or categories (High/Med/Low) instead of raw numbers.
      *   *Fact vs. Value:* Facts = data on the problem. Values = how much we care about that problem relative to others.

  4.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* ITN is a heuristic, not a formula. Context matters.
      *   *Contested:* Weighting (is Importance 10x Tractability?). Comparing incomparables (food vs. policy). The definition of "Neglectedness" (absolute vs. marginal).
      *   *Honesty:* I need to explicitly state where the framework is just "structured intuition."

  5.  **Applying to the Two Cases:**
      *   *Case A: Food Bank Refrigeration.*
          *   Importance: High (hunger is immediate).
          *   Neglectedness: Low (food banks usually get funding).
          *   Tractability: High (fridge = cold food).
          *   *Result:* Safe bet, but maybe low marginal impact.
      *   *Case B: Journalist Fellowship.*
          *   Importance: High (water rights affect everyone).
          *   Neglectedness: High (investigative journalism is underfunded).
          *   Tractability: Low/Uncertain (will one journalist change policy?).
          *   *Result:* High risk, high reward.
      *   *The "Hated Answer":* The procedure might favor the Journalist if Neglectedness is weighted heavily, or favor the Food Bank if Tractability is king. Let's make it favor the Journalist *too much* based on theoretical neglectedness, ignoring the fact that $400k is a drop in the bucket for policy, or conversely, kill the Journalist because Tractability is hard to prove. Let's go with killing the Journalist due to "Unproven Tractability" despite high Importance, which frustrates the "systems change" advocates. Or, better yet, the procedure forces a tie that requires a vote, highlighting the framework's limit.
      *   *Refinement on "Hated Answer":* Let's make the procedure rank the Journalist *higher* than the Food Bank because of Neglectedness, which will annoy the "feed people now" crowd. This illustrates the tension in ITN.

  6.  **Refining the Procedure Steps (Iterative Polish):**
      *   *Step 1 (Mission Check):* Binary Yes/No.
      *   *Step 2 (Importance):* Score 1-5. Define "Who suffers?"
      *   *Step 3 (Neglectedness):* Score 1-5. Define "Who else pays?"
      *   *Step 4 (Tractability):* Score 1-5. Define "Does money = outcome?"
      *   *Step 5 (Weighting):* This is the vote. Don't pretend there's a formula.
      *   *Hard No:* If Tractability is 1 (Impossible) or Importance is 1 (Trivial).

  7.  **Writing the Content - Section by Section:**
      *   *Introduction:* Acknowledge the mismatch between EA global scale and local foundation scale.
      *   *The Literature Check:* Be clear on what is academic consensus (it's a heuristic) vs. debate (weighting).
      *   *The Protocol:* Step-by-step instructions.
      *   *The Application:* Run the two cases.
      *   *The "Hated Answer":* Show where the logic leads to a conclusion the committee might reject (e.g., funding the journalist over the hungry).
      *   *The "Fake Precision" Warning:* Explicitly mark where they are guessing.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too complex?
      *   *Fix:* Simplify the scoring. Use "Low/Medium/High" instead of 1-10 to avoid false precision.
      *   *Critique:* Did I answer the "where it stops being facts" prompt?
      *   *Fix:* Add a specific "Stop & Vote" marker in the procedure.
      *   *Critique:* Is the distinction between settled/contested clear?
      *   *Fix:* Create a specific sidebar or section for "What the Literature Actually Says."
      *   *Critique:* The user asked for a case where the procedure spits out an answer they will hate.
      *   *Fix:* Ensure the Journalist case wins on paper due to Neglectedness, even if the committee feels morally uneasy ignoring hunger.

  9.  **Final Polish:** Check tone. Needs to be pragmatic, slightly cynical about the framework's limits, but useful. (e.g., "This is not a calculator; it's a structured argument.")

  10. **Final check against constraints:**
      *   Strict order? Yes.
      *   Sufficient answer criteria? Yes.
      *   Hard no conditions? Yes.
      *   Fact vs. Value distinction? Yes.
      *   Non-econ friendly? Yes (using scales).
      *   Missing data handling? Yes (use ranges/estimates).
      *   Honesty about judgment calls? Yes.
      *   Two proposals applied? Yes.
      *   Hated answer included? Yes.
      *   Settled vs. Contested literature? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is a practical adaptation of the Importance-Tractability-Neglectedness (ITN) framework for a regional foundation, designed to stop circular arguments by forcing specific disclosures of uncertainty and values.

  ### Part 1: What the Literature Actually Says (Settled vs. Contested)

  Before you run the meeting, your board needs to know that ITN is not a physics equation. It is a heuristic for organizing intuition.

  **Settled Consensus:**
  *   **ITN is multiplicative, not additive.** If any factor is zero (e.g., the problem is important but *impossible* to solve), the expected value is zero.
  *   **Marginal analysis matters.** You are not funding the whole problem; you are funding the *next dollar*. Neglectedness is about whether your dollar does more work because others aren't there.
  *   **Uncertainty is a cost.** High uncertainty in Tractability should discount the score, not be ignored.

  **Genuinely Contested (Where you will fight):**
  *   **Weighting:** There is no consensus on whether Importance outweighs Tractability. Some models weigh Importance 10x; others treat them equally. **This is a value judgment, not a fact.**
  *   **Comparability:** You cannot objectively compare "meals served" to "policy changed." Any conversion rate (e.g., 1 policy change = 10,000 meals) is a moral preference disguised as math.
  *   **Time Horizon:** ITN usually favors long-term, indirect work (policy) over short-term direct work (relief). Your foundation must decide if you are a "relief" or "change" funder. The framework does not decide this for you.

  ---

  ### Part 2: The Regional ITN Decision Protocol

  **Pre-Meeting Prep:**
  Do not use raw numbers (e.g., "$50,000 impact"). Use **Ordinal Scales (1–5)**. This prevents false precision.
  *   **1 = Low/Weak**
  *   **3 = Medium/Moderate**
  *   **5 = High/Strong**

  **The Procedure (Strict Order)**

  #### Step 1: The Mission Gate (Hard No)
  *   **Question:** Does this proposal fall within our geographic and thematic mandate?
  *   **Sufficient Answer:** Yes/No based on bylaws.
  *   **Hard No Condition:** If **No**, stop. Do not proceed to ITN.
  *   **Fact vs. Value:** Fact (check the bylaws).

  #### Step 2: Importance (Scale & Severity)
  *   **Question:** If this problem were completely solved, how much would it improve lives in our region?
  *   **Scoring Guide:**
      *   **1:** Nuisance level (e.g., prettier park benches).
      *   **3:** Significant hardship (e.g., after-school care gaps).
      *   **5:** Existential/Basic Needs (e.g., hunger, homelessness, clean water).
  *   **Sufficient Answer:** A score agreed upon by the committee. If disagreement >1 point (e.g., someone says 2, someone says 5), discuss until consensus or average the score.
  *   **Fact vs. Value:** **Mixed.** The *severity* of hunger is a fact; the *priority* of hunger over housing is a value.
  *   **Handling Missing Data:** If you don't know the scale of the problem, default to **2** until evidence is provided. Do not guess 5.

  #### Step 3: Neglectedness (Crowding)
  *   **Question:** Are other funders already covering this specific niche?
  *   **Scoring Guide:**
      *   **1:** Crowded (Government + 5 major foundations fund this).
      *   **3:** Moderate (Some funding, but gaps exist).
      *   **5:** Neglected (Almost no funding available; you are one of the only players).
  *   **Sufficient Answer:** A score based on a quick scan of local funding landscapes.
  *   **Hard No Condition:** None, but a score of **1** significantly lowers the final rank.
  *   **Fact vs. Value:** **Fact.** This requires research into who else is giving. If you haven't done the research, you cannot score this step.
  *   **Handling Missing Data:** If you don't know who else is funding, assign **3** (Neutral). Do not assume it is neglected just because you haven't heard of it.

  #### Step 4: Tractability (Leverage)
  *   **Question:** If we fund this, is there a clear causal link between our money and the outcome?
  *   **Scoring Guide:**
      *   **1:** Speculative (Hope that awareness leads to policy leads to change).
      *   **3:** Probable (Standard nonprofit delivery model).
      *   **5:** Certain (Money buys equipment/service directly).
  *   **Sufficient Answer:** A score based on the logic model.
  *   **Hard No Condition:** If **1** (Pure speculation with no evidence of success anywhere), vote to **Reject**.
  *   **Fact vs. Value:** **Fact.** This is about the mechanism of change. Does $X buy Y?
  *   **Handling Missing Data:** If the proposal lacks a logic model or past performance data, cap the score at **2**.

  #### Step 5: The Aggregation (The Vote)
  *   **Question:** How do we combine these scores?
  *   **Procedure:** Calculate the **ITN Score = Importance × Tractability × Neglectedness**.
      *   *Note:* This multiplicative formula penalizes zeros. A 5 in Importance doesn't save a 1 in Tractability.
  *   **The "Values" Intervention:** This is where the framework ends.
      *   If the top two proposals have scores within 20% of each other, **stop the math.**
      *   **Vote:** "Given these scores, which aligns better with our *strategic identity*?"
  *   **Fact vs. Value:** **100% Value.** The math is done. Now you are deciding who you want to be.

  ---

  ### Part 3: Application to Your Two Proposals

  Here is how this plays out in your meeting with the **Food Bank Refrigeration** (Direct) vs. **Journalist Fellowship** (Indirect).

  #### Proposal A: Food Bank Refrigeration
  *   **Step 1 (Mission):** Yes. (Local, poverty alleviation).
  *   **Step 2 (Importance):** **5**. (Hunger is immediate, basic need).
  *   **Step 3 (Neglectedness):** **2**. (Food banks are popular. Government SNAP funds exist. Other foundations love food security. Your $40k is a drop in a bucket that is already being filled by others).
  *   **Step 4 (Tractability):** **5**. (Money buys fridge -> food stays cold -> food is eaten. Causal link is solid).
  *   **Step 5 (Calculation):** $5 \times 5 \times 2 = \mathbf{50}$.

  #### Proposal B: Journalist Fellowship (Water Rights)
  *   **Step 1 (Mission):** Yes. (Local, advocacy/systemic).
  *   **Step 2 (Importance):** **5**. (Water policy affects the whole region's economy and health long-term).
  *   **Step 3 (Neglectedness):** **5**. (Investigative journalism is collapsing. No one funds state-house reporting. You are one of the only funders).
  *   **Step 4 (Tractability):** **2**. (Money buys reporting -> stories published -> *maybe* policy changes -> *maybe* water improves. Causal chain is long and leaky).
  *   **Step 5 (Calculation):** $5 \times 2 \times 5 = \mathbf{50}$.

  #### The Result & The "Hated Answer"
  Mathematically, they are tied (50 vs 50). The procedure forces you to **Step 5: The Vote.**

  **However, here is the case where the procedure spits out an answer your committee will hate:**

  Imagine a third proposal: **A Pilot Program for a New Drug Rehab Model.**
  *   **Importance:** **5** (Overdose crisis is deadly).
  *   **Neglectedness:** **5** (Most funders are scared of addiction work; it's stigmatized).
  *   **Tractability:** **3** (Evidence-based model, but addiction is hard).
  *   **Score:** $5 \times 3 \times 5 = \mathbf{75}$.

  **The Hated Answer:** The ITN procedure ranks the **Drug Rehab Pilot (75)** higher than the **Food Bank Fridge (50)**.
  *   **Why the Committee Will Hate It:** "People are hungry *now*. How can you fund a speculative rehab pilot over putting food in mouths?"
  *   **Why the Procedure Says It:** The Food Bank is "crowded" (Neglectedness = 2). Your money does less marginal good there because the government and others are already there. The Rehab pilot is neglected, so your dollar buys more "unique progress."
  *   **The Break Point:** This reveals your committee's true conflict. Are you a **Gap-Filler** (fund what others ignore, even if risky) or a **Safety-Net** (fund basic needs even if others are there)? The ITN framework favors Gap-Filling. If your board wants to be a Safety-Net, **the framework is wrong for you.**

  ---

  ### Part 4: Where You Are Faking Precision (The Warning Label)

  When you present this to your board, read this list aloud. These are the judgment calls dressed up as procedure:

  1.  **The Scale Definition:** Deciding that "Hunger" is a 5 and "Park Benches" is a 1 is a value judgment. Someone on your board might believe systemic policy (Journalist) is a 5 and direct aid (Food) is a 3 because aid is "band-aid." **You must vote on the scale definitions before scoring proposals.**
  2.  **The Neglectedness Research:** If you score Neglectedness based on "I haven't seen other grants," you are guessing. If you score it based on a database search, it's a fact. **Require a 1-paragraph "Funding Landscape" note for every proposal.**
  3.  **The Multiplicative Formula:** Using multiplication ($I \times T \times N$) assumes these factors are equally important. If you care more about Importance than Neglectedness, the math is lying. **If the top scores feel wrong, change the formula (e.g., Importance squared), but admit you are tweaking the weights to match your gut.**
  4.  **Tractability Uncertainty:** A Tractability score of 2 for the Journalist hides a massive range. It could be 0 (no impact) or 10 (state law changes). The average (2) hides the risk. **For high-variance projects, run a "Best Case/Worst Case" score separately.**

  ### Summary Checklist for Your Meeting
  1.  **Define the Scale:** Vote on what a "5" means for Importance before looking at proposals.
  2.  **Require Evidence:** No Neglectedness score without a list of other funders. No Tractability score without a logic model.
  3.  **Run the Math:** Calculate $I \times T \times N$.
  4.  **Check the "Hate" Factor:** If the top-ranked proposal feels morally wrong (e.g., ignoring hunger), acknowledge that the framework is prioritizing *marginal impact* over *moral duty*.
  5.  **Final Vote:** If scores are within 20%, ignore the score. Vote on mission alignment.

  This procedure won't stop disagreement, but it will stop *circular* disagreement. It forces you to say, "I am funding the Journalist not because I know it will work, but because I value Neglectedness over Tractability." That is a decision you can defend.
