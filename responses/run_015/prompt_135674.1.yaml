  3.  **Game Design - "The Dubbing Game" (Working Title):**

      *   **Goal:** Players act as a "Naming Committee" or "Investigators." They encounter statements involving names. They must judge the modal status before knowing the history of the name, then again after.
      *   **Materials:** Envelopes (Case Files), Betting Slips (Index Cards), Pens.
