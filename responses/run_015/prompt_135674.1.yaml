      *   *Group 2 (The Stipulation):* One name fixed by a contingent description that *makes* the statement true by definition. (Target: Cont A Priori).
      *   *Group 3 (The Disjunction):* "Let 'N' name the F. If no F, the G." (Target: Disjunctive Dubbing).
