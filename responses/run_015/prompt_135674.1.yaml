  5.  **Refining the Betting Mechanism:**

      *   *Phase 1 (Ignorance):* Group receives a statement from another group (e.g., "X = Y"). They don't know how X or Y were named. They bet on: "In a nearby possible world, is this False?" (Yes/No).
      *   *Phase 2 (Knowledge):* They open the "Dossier" (written by the creating group) explaining the naming ceremony. They bet again.
