      *   **Constraints:** No laptops/projectors/whiteboards. Index cards/envelopes okay. Groups of 3-4. No open discussion format (dominated by loud expert).
      *   **Specific Mechanics Requested:** Two-round betting (sealed then open), payoff structure favoring early commitment.
      *   **Specific Cases Required:**
