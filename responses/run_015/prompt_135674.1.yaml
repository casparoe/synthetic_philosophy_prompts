      *   *Constraint:* Must generate Necessary A Posteriori, Contingent A Priori, Disjunctive Dubbing, Forked Chain.
      *   *Case 1 (Nec A Post):* Needs a standard identity but generated by the group? No, prompt says "participants generate the cases themselves." Wait, re-reading: "participants generate the cases themselves (I want them inventing their own dubbings...)."
