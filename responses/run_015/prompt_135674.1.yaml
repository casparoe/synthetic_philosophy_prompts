      *   *Problem:* How do they know if they are right? The creating group defines the "rules of the world" in the dossier. This is tricky. If the creating group gets the metaphysics wrong, the betting group gets penalized?
      *   *Fix:* The "Truth" is determined by the rules provided in the dossier. The betting group must interpret the dossier. The debrief reveals where the creating group might have messed up the metaphysics.
      *   *Better Fix:* The Facilitator (User) holds the "Master Key" for what counts as valid metaphysics. But the prompt says "no whiteboard... I don't want anything that needs a laptop."
