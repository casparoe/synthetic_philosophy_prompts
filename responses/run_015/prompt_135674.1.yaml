answer: |-
  # The Dubbing Game: A Protocol for *Naming and Necessity*

  **Context:** 14 players, pub back room, 90 minutes.
  **Materials:** 40 index cards (plain), 20 manila envelopes (or folded paper sealed with tape), pens. No colour printing required.
  **Facilitator:** You. You hold the stopwatch and the final metaphysical authority.

  ## 1. The Setup (00:00 – 00:10)

  **The Pitch:**
  "Tonight we are not discussing Kripke. We are running a naming bureau. There are four teams of 3–4. You will each construct a 'Case File' involving a new name. You will then swap files with another team. Your goal is to determine the modal status of the statements in that file.

  **The Vocabulary Ban:**
  Until the final ten minutes, the following words are taboo. If you say them, your team loses 1 point:
  *   'Necessary'
  *   'Contingent'
  *   'A priori'
  *   'A posteriori'
  *   'Rigid'

  Instead, use these phrases:
  *   **Stability:** "Could this statement have been false in a slightly different world?" (Yes = Unstable / No = Stable)
  *   **Access:** "Did you need to open the envelope to know this was true?" (Yes = Empirical / No = Armchair)

  **The Payoff:**
  There are two betting rounds per Case File.
  *   **Round 1 (Blind):** You see the Statement only. You bet on **Stability**.
  *   **Round 2 (Informed):** You open the Envelope (The History). You bet on **Stability** again.
  *   **Scoring:** If your Round 1 bet matches the 'Verdict Card' inside the envelope: **3 Points**. If your Round 2 bet matches: **1 Point**.
  *   **The Catch:** The Verdict Card is written by the team who built the case. However, *I* (the Facilitator) can veto a Verdict if it violates the rules of the Brief. If I veto, the file is void, no points.

  This structure rewards you for getting the metaphysics right *before* you know the epistemology. If your confidence changes when you open the envelope, you have likely collapsed the axes.

  ---

  ## 2. Construction Phase (00:10 – 00:25)

  Divide the room into four groups. Hand each group one **Mission Brief** (below) and a stack of cards/envelopes. They must write their Case File according to the brief.

  **Materials per Group:**
  *   3 Index Cards (Statement, History, Verdict).
  *   1 Envelope.
  *   1 Mission Brief.

  **The Mission Briefs:**

  *   **Group 1 (The Identity):** Invent two names, *Alpha* and *Beta*. They refer to the same object. *Alpha* was named by pointing (ostension). *Beta* was named by a description (e.g., "the cause of these symptoms"). Write a statement "Alpha is Beta".
      *   *Constraint:* The description used for *Beta* is contingent (the object could have failed to satisfy it).
      *   *Verdict:* You must mark this statement as **Stable** (Could not have been false).

  *   **Group 2 (The Stipulation):** Invent one name, *Gamma*. Fix its reference by a description (e.g., "Let *Gamma* name the length of this stick right now"). Write a statement "Gamma is one metre long".
      *   *Constraint:* The reference is fixed by the description, but the object itself could have changed.
      *   *Verdict:* You must mark this statement as **Unstable** (Could have been false), but note that it is known **Armchair** (no measurement needed).

  *   **Group 3 (The Disjunction):** Invent a name, *Delta*. The naming ceremony is: "Let *Delta* name the F. If nothing is F, then *Delta* names whatever we *would have* picked had we known more."
      *   *Constraint:* In the actual history, nothing is F. The name falls back on the counterfactual clause.
      *   *Verdict:* You decide the Stability, but you must explicitly state in the History what *Delta* refers to in a world where something *is* F.

  *   **Group 4 (The Fork):** Invent a name, *Epsilon*. Describe a historical chain of communication that splits. Speaker A tells B and C. B uses *Epsilon* for Object X. C uses *Epsilon* for Object Y. Both are competent; neither knows of the other.
      *   *Constraint:* Write a statement "Epsilon is X".
      *   *Verdict:* You must mark this as **Indeterminate** (Create a special card that says "Depends on which speaker").

  **Facilitator Note:** Circulate during this phase. Ensure Group 1 doesn't make the description necessary. Ensure Group 3 actually uses the counterfactual backup. If a group breaks the metaphysics, tell them to fix it now, or their file will be voided later.

  ---

  ## 3. The Betting Rounds (00:25 – 01:05)

  **Swap:** Group 1 passes to Group 2; 2 to 3; 3 to 4; 4 to 1. (Or randomise).

  **Round 1: Blind Bet (15 mins)**
  *   Teams receive the **Statement Card** only. (e.g., "Alpha is Beta").
  *   They discuss: "Could this have been false?"
  *   They write their bet on a slip of paper: **STABLE** or **UNSTABLE**.
  *   They hand the slip to you (Facilitator). Do not let them see the envelope yet.

  **Round 2: Informed Bet (25 mins)**
  *   Teams receive the **Envelope**. Inside: The **History Card** (how the names were fixed) and the **Verdict Card** (face down).
  *   They read the History. They discuss again.
  *   They write a second bet: **STABLE** or **UNSTABLE**.
  *   They reveal the Verdict Card.
  *   **Scoring:** You collect the slips.
      *   Round 1 Match = 3 pts.
      *   Round 2 Match = 1 pt.
      *   *Penalty:* If they switched their answer from Round 1 to Round 2, they lose the Round 2 point (even if correct). This punishes treating epistemic access as metaphysical grounding.

  *(Note on Group 4's Fork Case):* If a team receives the Fork case, the Verdict Card says "Indeterminate". If they bet Stable or Unstable, they get 0 points. This is designed to frustrate them. It forces the debrief point.

  ---

  ## 4. The Debrief (01:05 – 01:30)

  Collect all scores. Announce the winner (bragging rights only). Then, banish the game mechanics and talk philosophy. This is where you lift the vocabulary ban.

  **Step 1: The Grid (10 mins)**
  Draw a 2x2 grid on a napkin or scrap paper.
  *   **X-Axis:** Stable vs. Unstable (Necessary vs. Contingent).
  *   **Y-Axis:** Armchair vs. Empirical (A Priori vs. A Posteriori).

  Ask Group 1: "Where does your case sit?"
  *   *Expected:* Stable + Empirical. (Necessary A Posteriori).
  *   *Point:* You knew it via the description (Empirical), but the identity holds in all worlds (Stable) because both names track the *object*, not the description.

  Ask Group 2: "Where does your case sit?"
  *   *Expected:* Unstable + Armchair. (Contingent A Priori).
  *   *Point:* You know it's true by definition (Armchair), but the stick could have expanded (Unstable).

  **Step 2: The Disjunction (5 mins)**
  Ask Group 3: "Did *Delta* behave like a description or a name?"
  *   *The Trap:* If they treated it as a description, they would say the reference changes if F changes. If they treated it as a name with a fallback, the reference might stay fixed on the 'would-have' object.
  *   *The Lesson:* This tests whether a reference-fixer is part of the *meaning* (description) or just the *baptism* (name). Kripke says the latter. If your game verdict treated the fallback object as the referent even in worlds where F exists, you treated it as a name.

  **Step 3: The Fork (5 mins)**
  Ask Group 4: "Why was the verdict Indeterminate?"
  *   *The Lesson:* Reference is determined by causal history, not just competence. Two speakers can be internally identical but refer to different things because their chains diverge. This kills the idea that 'meaning is in the head'.

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The Metaphysics Argument**
  *   **Problem:** During the Construction Phase, a philosophy grad student will argue that Group 2's case is *not* Contingent A Priori, but just a linguistic convention. They will stall the group.
  *   **Fix:** Intervene immediately. "This is a game of stipulation. For the purposes of this file, you *must* treat the stick as capable of changing length. Argue in the debrief, not the build."

  **2. The Metagame**
  *   **Problem:** Teams will try to guess what the *other team thinks* rather than analyzing the logic. "Oh, the philosophers are in Group 1, they'll probably say it's Stable."
  *   **Fix:** Remind them of the Payoff. "The points are awarded for matching the Verdict Card, which is based on the logic you were briefed to build, not the team's opinion. Ignore the authors; read the Brief."

  **3. The Fork Stalemate**
  *   **Problem:** The team receiving the Fork case will refuse to accept "Indeterminate". They will insist one speaker is wrong.
  *   **Fix:** Let them bet "Stable". They will get 0 points. In the debrief, use this. "You lost points because you wanted there to be a fact of the matter. Kripke's point is that there *isn't* a fact of the matter about 'The One True Reference' independent of the causal chain. The frustration you feel is the point."

  **4. The Disjunctive Description**
  *   **Problem:** Someone will insist the Disjunctive Dubbing is "just a long description in a trenchcoat."
  *   **Fix:** Ask them: "In a world where the F exists, but the committee *would have* picked the other thing, what does the name refer to?" If they say "The F", they are descriptivists. If they say "The other thing", they are Kripkeans. Highlight this divergence.

  **5. The "Hack" Objection**
  *   **Problem:** Someone will say, "Necessary A Posteriori is just a trick of language. It's not real metaphysics."
  *   **Fix:** Acknowledge this in the limitations (see below). Don't fight it in the game. Let the scoring show that treating it as a 'hack' (i.e., changing your bet in Round 2) cost them points.

  ---

  ## 6. Limitations: What This Game Cannot Do

  Be honest with the group at the very end.

  1.  **Stipulation vs. Reality:** The game works because you *stipulated* the Verdict Cards. In the real world, we don't have Verdict Cards. We have to argue for why 'Hesperus is Phosphorus' is Stable. The game models the *structure* of the argument, not the *proof*.
  2.  **Finite Worlds:** You only tested the statement against the "nearby worlds" you bothered to write down. Real modality covers *all* possible worlds. The game creates a closed system; Kripke's claim is about an open one.
  3.  **The Anti-Descriptivist Force:** The game shows that Descriptivism leads to losing points (instability). It doesn't prove Descriptivism is *false*, only that it's costly in this framework. The real force of Kripke's argument (the modal argument, the epistemic argument, the semantic argument) is something you must supply verbally. The game is the intuition pump; you are the engine.

  ---

  ## 7. Materials Checklist (B&W Friendly)

  *   **Index Cards:** 40 minimum.
  *   **Envelopes:** 4 large enough to hold 3 cards.
  *   **Pens:** 1 per person.
  *   **Mission Briefs:** Write these out on 4 cards beforehand.
      *   *Brief 1:* Identity (Ostension vs Description).
      *   *Brief 2:* Stipulation (Metre Stick style).
      *   *Brief 3:* Disjunction (Counterfactual backup).
      *   *Brief 4:* Fork (Divergent chains).
  *   **Score Sheet:** One card for you to track points.

  ## 8. Facilitator's Script for the "Axes" (Debrief)

  When you draw the grid, say this:

  "We collapsed two distinctions tonight.
  1.  **How we know it** (Did you need the envelope?).
  2.  **How the world is** (Could the card have read 'False'?).

  Philosophers before Kripke assumed these were the same line. If you needed the envelope, it was Contingent. If you didn't, it was Necessary.
  The game punished you for thinking that. Group 1 knew it via the envelope (Empirical), but the card said 'Stable' (Necessary). That gap—where you need to look to know, but the fact couldn't have been otherwise—is the Necessary A Posteriori. It's not a hack. It's what happens when names latch onto objects directly, bypassing the descriptions we use to find them."

  ---

  ## 9. Final Advice

  If the room gets rowdy (it's a pub), use the "Taboo" rule to silence them. If someone says "Rigid", they buy the next round of drinks. It keeps the mood light but enforces the discipline.

  The Fork case (Group 4) is your riskiest element. If they refuse to accept indeterminacy, don't force it. Let it be the "unresolved bug" in the system. That accurately reflects the current state of the literature on reference borrowing anyway.

  Good luck. Don't let them whiteboard it.
