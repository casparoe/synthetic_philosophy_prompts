      *   *Check:* Did I answer if the conclusion survives? *Adjustment:* Be nuanced. The *analogy* breaks, but the *ethical principle* (do no harm) can be grounded elsewhere (e.g., rights to a livable environment).
      *   *Check:* Is the distinction between "paycheck" (income) and "estate" (capital) clear in the Will analogy? *Adjustment:* Clarify that the classmate argues future people can't claim current *consumption* (paycheck), only what's left over (estate).

