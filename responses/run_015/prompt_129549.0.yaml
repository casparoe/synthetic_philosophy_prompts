      *   *Refinement:* Ensure the distinction between "harming" (Tenant) and "not helping" (Will) is clear. This is crucial for the "claim on paycheck" part. Make sure to explicitly mention Derek Parfit.

  7.  **Self-Correction/Review during drafting:**
