answer: |-
  **Introduction**
  Standard introductions to distributive justice often present the "equality of what" debate (currency) as the primary fork in the road. However, this obscures two critical structural choices: how we treat risk and luck (ex ante vs. ex post), and what mathematical pattern we seek (equality, sufficiency, or priority). This instrument maps the logical space of distributive justice by forcing explicit choices on these three dimensions. It is designed to reveal that many named positions are merely specific combinations of these deeper parameters, while others represent genuine incompatibilities. Use this to locate your own view before attaching a label.

  ***

  ### The Distributive Justice Decision Instrument

  **Q1. What is the appropriate currency of comparison?**
  *When determining if one person is worse off than another, what metric should we use?*
  *   **A. Well-being:** Mental states, preference satisfaction, or experienced quality of life.
  *   **B. Resources:** External assets, income, wealth, or impersonal means.
  *   **C. Capabilities:** Real freedoms to function or be what one values.
  *   **D. Opportunities:** Chances or prospects available before choices are made.
  *   **E. Relations:** Social status, power dynamics, or standing within a community.
      *   *If E: Go to **Leaf 7 (Relational Egalitarianism)**.*
      *   *If A, B, C, or D: Proceed to Q2.*

  **Q2. How should we treat luck and risk?**
  *Should we equalize the prospects people face before luck strikes, or the outcomes they actually end up with?*
  *   **A. Ex Ante:** Equalize the expected value of opportunities/prospects (neutralize brute luck).
  *   **B. Ex Post:** Equalize the actual realized outcomes regardless of risk taken.
      *   *Proceed to Q3.*

  **Q3. What is the distributive pattern?**
  *Once the currency and timing are fixed, what is the moral goal?*
  *   **A. Strict Equality:** Everyone should have the same amount.
  *   **B. Sufficiency:** Everyone should have enough; inequality above the floor is acceptable.
  *   **C. Prioritarianism:** Benefits to the worse off matter more, but strict equality is not required.

  ***

  ### Position Mapping & Logical Space

  **Leaf 1: Welfarist Egalitarianism**
  *Path:* Q1(A) + Q2(B) + Q3(A).
  *Definition:* Justice requires equalizing actual experienced well-being across persons.

  **Leaf 2: Resource Egalitarianism (Dworkin–Cohen)**
  *Path:* Q1(B) + Q2(A) + Q3(A).
  *Definition:* Justice requires equalizing external resources via hypothetical insurance, respecting option luck.

  **Leaf 3: The Capability Approach**
  *Path:* Q1(C) + Q2(B) + Q3(B).
  *Definition:* Justice requires ensuring all persons reach a threshold of central capabilities.

  **Leaf 4: Luck Egalitarianism**
  *Path:* Q1(B/C) + Q2(A) + Q3(A/C).
  *Definition:* Justice requires neutralizing inequalities arising from brute luck while respecting option luck.

  **Leaf 5: Prioritarianism**
  *Path:* Q1(A/B) + Q2(B) + Q3(C).
  *Definition:* Justice requires maximizing weighted well-being/resources, giving priority to the worst off.

  **Leaf 6: Sufficientarianism**
  *Path:* Q1(A/B/C) + Q2(B) + Q3(B).
  *Definition:* Justice requires ensuring everyone has enough of the currency; above the threshold, distribution is irrelevant.

  **Leaf 7: Relational Egalitarianism**
  *Path:* Q1(E).
  *Definition:* Justice is not about distribution but about eliminating oppressive social hierarchies.

  ***

  ### Empty Cells & Ambiguity Flags

  **Empty Cells (Combinations with no well-known occupant)**
  *   **Q1(E) + Q2/Q3:** *Incoherent.* Relational equality rejects the quantifiable metrics required to answer questions about timing or mathematical patterns.
  *   **Q1(B) + Q2(B) + Q3(A):** *Unattractive.* Strict equality of ex post resources ignores personal responsibility and option luck, a view rejected by most resource theorists.
  *   **Q1(A) + Q2(A) + Q3(A):** *Unexplored.* Strict equality of expected welfare is theoretically possible but practically unmeasurable and ignores actual suffering.

  **Ambiguity Flags (Positions the tree cannot fully separate)**
  *   **Resource Egalitarianism vs. Capability Approach:** These leaves are adjacent. Resource egalitarians often account for conversion factors (disabilities), while capability theorists often use resources as proxies, making the distinction政策性 (policy-level) rather than foundational.
  *   **Luck Egalitarianism vs. Prioritarianism:** These converge when the worst-off are victims of brute luck. The tree separates them by pattern (Equality vs. Priority), but in practice, both recommend transfers to the disadvantaged, obscuring the theoretical divergence.

  ***

  ### Rationale for Branch Selection

  This instrument prioritizes **Currency** first because it defines the substantive good being distributed; without agreeing on what matters (welfare vs. freedom), timing and pattern are unintelligible. The **Ex Ante/Ex Post** branch is placed second because it determines the role of responsibility, which is the primary fault line between luck egalitarians and strict egalitarians. Finally, the **Pattern** branch distinguishes between those who seek equality as an intrinsic value versus those who seek it instrumentally (sufficiency) or as a weighting function (prioritarianism). This order reveals that many disputes labeled as "currency" disagreements are actually disagreements about risk or pattern.
