  **MEMORANDUM**

  **TO:** Corrections Research Review Board
  **FROM:** [Your Name/Seat], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Fairhaven Housing Unit Pilot Proposal (Protocol #FH-24-09)

  **RECOMMENDATION:** **Approve with Conditions**

  **EXECUTIVE SUMMARY**
  The proposal to convert a 120-bed unit at Fairhaven Correctional Facility to a normalized, Norwegian-style housing model represents a rare opportunity to generate rigorous data on the relationship between carceral environment and recidivism. However, the current protocol contains ethical defects that preclude unconditional approval. Specifically, the conditionality of humane treatment on statistical outcomes violates the Board's mandate to protect subjects from degrading treatment. Furthermore, the random lottery allocation, while statistically ideal, exacerbates the psychological harm of "comparative degradation" for the non-selected population.

  I recommend **Approval** contingent upon two material modifications: (1) the removal of the "reversion clause" regarding humane conditions, and (2) the replacement of the pure lottery with a **Proximity-to-Release Priority System**. These conditions preserve the study's core value while aligning the protocol with constitutional and ethical standards regarding human dignity.

  **RATIONALE FOR APPROVAL: THE NECESSITY OF EVIDENCE**
  We must begin by acknowledging the cost of our own scruples. For decades, this state has oscillated between punitive and rehabilitative models based on anecdote, political expediency, and national mood. We operate a billion-dollar system on the assumption that we know what works, when in reality we are guessing.

  If this Board rejects this proposal, we are not merely protecting prisoners; we are choosing ignorance. We are deciding that the ethical risks of a trial outweigh the ethical costs of perpetual uncertainty. The 800 men who remain in the old blocks will not be safer because we refused this study. They will simply remain in a system where we do not know if architecture matters, where rehabilitation is a slogan rather than a variable, and where reform is stalled by the very bodies tasked with overseeing it. To reject this trial without a path forward is to condemn the entire population of Fairhaven to another decade of policy based on guesswork. We have a moral obligation to generate knowledge that could reduce future victimization and improve reentry outcomes. Therefore, the default position of this Board must be to facilitate rigorous research, not to obstruct it.

  **CONDITION 1: ELIMINATION OF CONTINGENT DECENCY (The Reversion Clause)**
  *Current Protocol:* If the five-year recidivism data does not show a statistically significant improvement, the unit reverts to standard maximum-security design (removal of doors, kitchens, etc.).
  *Required Modification:* The physical improvements (doors, privacy, normalized spaces) must be permanent regardless of the recidivism outcome.

  *Reasoning:*
  This is the most critical ethical boundary. Humane treatment cannot be contingent on a p-value. If we approve a protocol where a man loses his door key because the study "failed," we have instrumentalized human dignity. We would be establishing a precedent that the state owes decent conditions only if they purchase a dividend in public safety. This violates the Eighth Amendment's evolving standards of decency and turns the subjects into means to an end rather than ends in themselves.

  *Action for Foundation/Warden:* The Foundation must amend the grant agreement to treat the capital improvements as a permanent donation to the state's infrastructure. If the study shows no recidivism benefit, the outcome is simply "knowledge," not "failure." The state must absorb the operational cost of the unit if the Foundation withdraws funding after year five.

  **CONDITION 2: ALLOCATION MECHANISM (Replacing the Lottery)**
  *Current Protocol:* Public random lottery among 900 eligible inmates.
  *Required Modification:* **Priority based on Proximity to Release (within 24 months), followed by random selection if oversubscribed.**

  *Reasoning:*
  While the random lottery is the gold standard for scientific validity and avoids the bias of "merit" based allocations (which punish those who act out due to mental illness or survival instincts), it creates an intolerable psychological burden on the 800 non-selected men. As noted in our deliberations, "comparative degradation" is a real risk: knowing the state *can* house you decently but *chose* not to because you lost a coin toss actively worsens the lived experience of the general population. It frames decency as a prize rather than a standard.

  Furthermore, the Victims' Advocacy Group has rightly noted that allocation by pure luck undermines the moral legitimacy of the program.

  A **Proximity-to-Release** mechanism addresses this by aligning the allocation with the *purpose* of the unit. The Norwegian model is designed for reintegration. Men releasing within 24 months are the population for whom cooking skills, normalized visiting, and self-regulation are immediately relevant to recidivism.
  1.  **Ethical Mitigation:** It reduces the "comparative degradation" for long-term inmates, who understand they are not yet in the reentry phase.
  2.  **Scientific Validity:** While this introduces selection bias compared to a pure RCT, it can be controlled for statistically. It creates a "Treatment on the Treated" model that is more externally valid for reentry policy anyway.
  3.  **Message:** It signals that the unit is a bridge to freedom, not a reward for luck or a spa for the fortunate.

  *Action for Warden:* Eligibility criteria must be adjusted to filter for inmates with a projected release date within 24 months of admission to the unit. If more than 120 inmates meet this criteria, a random lottery may be used *within that pool only*.

  **CONDITION 3: INFORMED CONSENT AND WITHDRAWAL**
  *Current Protocol:* Standard consent forms.
  *Required Modification:* Enhanced consent process addressing the "Research Subject" status of officers and the permanent nature of the housing.

  *Reasoning:*
  Inmates must understand that while the *physical* improvements are permanent (per Condition 1), their *participation* in the study (data collection, interviews) is voluntary. They must also be informed that correctional officers in the unit are also research subjects, which may alter the power dynamic.

  *Action for Board:* The University partner must draft a consent script that explicitly states: "Your housing conditions will not be revoked if you choose to leave the study, nor if the study results are negative." This removes the coercion of the reversion clause.

  **CONCLUSION**
  This memo recommends we move forward, but not on the donor's terms. We are approving the *science*, but rejecting the *instrumentalization* of the subjects.

  To the Foundation: We understand your desire for a clean Randomized Controlled Trial. However, you cannot fund a study where human rights are the dependent variable. If you require the reversion clause, we must reject the proposal. If you accept that decency is a baseline, not a bonus, we are partners.

  To the Warden: You must prepare your staff for a model where "security" is redefined as "relationship." The officers' union concerns are valid; this job is harder, not easier. The conditionality of the allocation (Proximity to Release) should help mitigate their fear that this is a "country club" for random inmates.

  To the Victims' Advocacy Group: We hear your concern regarding the "less eligible" principle. By tying access to reentry proximity rather than luck, we align the privilege with the public safety goal you champion.

  We have a choice between remaining comfortably ignorant or ethically engaged. I choose the latter.

  **VOTE RECOMMENDATION:**
  **[X] Approve with Conditions**
  [ ] Approve
  [ ] Reject
  [ ] Table

  **Signed,**

  [Your Name]
  Corrections Research Review Board
