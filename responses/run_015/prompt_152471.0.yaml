          *   Output: Short result, signed off by Head Mod, posted publicly.
          *   Tone: Structural description, *not* a verdict on member rationality (avoid "you are brainwashed").
          *   Core Theory: C. Thi Nguyen's distinction between *Epistemic Bubbles* (omission, pop on contact) vs. *Echo Chambers* (credibility reduction, contact reinforces belief).
          *   Specific Wrinkle: "Steelman Saturday" (outgroup arguments posted *with* pre-written rebuttals). User suspects this is a discreditation engine.
          *   Specific Distinctions Needed: Source discrediting vs. Practice discrediting ("both-sidesing"), Inbound vs. Outbound permeability, Treatment of returning ex-members.
          *   Decision Logic: Hard NO on intervention for one category (likely Bubble), YES for the other (likely Chamber), handoff for values questions.
          *   Test Cases: 1. Genealogy subforum (insular but friendly). 2. Steelman Saturday community. 3. Main Forum (User suspects it's an Echo Chamber regarding institutional trust, including their own roundup).
          *   Meta-Analysis: Which theoretical distinctions must survive simplification? Where will it misfire? (Specifically: justified refusal to amplify bad actors vs. unjustified).

  2.  **Deconstruct the Theory (Nguyen's Distinction):**

      *   *Epistemic Bubble:* Lack of exposure. Solution: Add voices/links.
      *   *Echo Chamber:* Systematic undermining of outside credibility. Solution: Much harder, requires rebuilding trust mechanisms, not just adding links.
      *   *The "Steelman Saturday" Problem:* This is a sophisticated echo chamber mechanism. It simulates exposure but pre-loads the rebuttal, training users to dismiss the argument *because* of the source/context, not the content. It's a "credibility reduction machine."
      *   *Operationalization:* We need to measure *how* outside info is treated, not just *if* it appears.

  3.  **Drafting the Procedure (The "Audit Tool"):**

      *   *Goal:* 30 minutes, mod-level evidence.
      *   *Structure:* A flowchart or checklist with branching logic.
      *   *Key Metrics:*
          1.  **Inbound Permeability:** Frequency of outgroup links in random sample.
          2.  **Credibility Framing:** How are those links discussed? (Neutral, Positive, Negative/Dismissive).
          3.  **Pre-emptive Defeat:** Are outgroup views *only* presented with attached rebuttals? (The Steelman check).
          4.  **Messenger Treatment:** What happens to users who bring outside info? (Welcomed, Ignored, Sanctioned/Contaminated).
          5.  **Practice Policing:** Is the act of engaging itself criticized? ("Don't feed the trolls," "This is both-sidesing").
      *   *Decision Logic:*
          *   Low Inbound + Neutral/Positive Treatment = **Bubble**. (Intervention: Add sources).
          *   High/Medium Inbound + Negative Treatment/Pre-emptive Defeat = **Chamber**. (Intervention: Process change, not just links).
          *   Values Check: Is the community *advocacy* based? (If yes, some bias is expected, but structural dishonesty is still risky).

  4.  **Refining the "Steelman Saturday" Detection:**

      *   This needs a specific question. "When outgroup arguments appear, are they standalone or packaged with community rebuttals?"
