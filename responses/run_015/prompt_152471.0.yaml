  5.  **Addressing the "Hard NO" on Intervention:**

      *   If it's a Bubble: Adding links works. Intervention = YES.
      *   If it's a Chamber: Adding links makes it worse (backfire effect). Intervention = NO (on "just add links"). Requires deeper structural change.
      *   *Correction based on prompt:* The prompt asks where the procedure stops with a hard NO on an intervention.
      *   *Logic:* If it's a Bubble, "add sources" is a YES. If it's a Chamber, "add sources" is a NO (because it fuels the machine). The intervention being audited is likely "How do we fix this?"
      *   *Wait, re-reading:* "where the procedure stops with a hard NO on an intervention — my strong prior is that 'just add more outside sources' should be a NO for one of the two categories and a YES for the other."
      *   *Okay:* So the procedure determines the diagnosis. If Diagnosis = Bubble, Prescription = Add Sources (YES). If Diagnosis = Chamber, Prescription = Add Sources (NO).
      *   *Values Handoff:* If the community is explicitly advocacy-oriented (e.g., "We exist to promote X"), then "bias" is a feature, not a bug. The audit flags it, but the Head Mod decides if it's acceptable.

  6.  **Developing the Test Cases:**

      *   **Case 1: Genealogy Subforum.**
          *   *Observation:* Cites only 3 in-group sites. Friendly to outsiders.
          *   *Diagnosis:* Bubble.
          *   *Outcome:* Safe to add sources.
      *   **Case 2: Steelman Saturday.**
          *   *Observation:* Outgroup args always have rebuttals. Users praise the "openness" but dismiss the content.
          *   *Diagnosis:* Echo Chamber (Curated).
          *   *Outcome:* "Add sources" is NO. Needs structural change to how rebuttals are handled (e.g., delay the rebuttal).
      *   **Case 3: Main Forum (The User's Community).**
          *   *Observation:* User suspects Echo Chamber on institutional trust. Roundup is part of the machine.
          *   *Diagnosis:* Echo Chamber.
          *   *Outcome:* "Add sources" is NO. Roundup needs structural change (e.g., guest editors from outside).
          *   *Requirement:* Be blunt. Tell the user their roundup is likely part of the credibility reduction machine.

  7.  **Meta-Analysis (Theory vs. Practice):**

      *   *Must Survive:* The distinction between *absence* of evidence vs. *active undermining* of evidence. The distinction between *argument* rebuttal vs. *source* discrediting.
      *   *Can Drop:* Deep philosophical definitions of "knowledge." Nuance on "justified" vs "unjustified" distrust (the tool can't measure truth, only structure).
      *   *Misfire:* The "Bad Actor" problem. If a source is actually malicious (spam, scams, hate), the community *should* discredit it. The tool will flag this as "Echo Chamber behavior" even if it's healthy moderation. This needs a disclaimer.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, procedural, slightly clinical (to avoid triggering defensiveness).
      *   *Format:* Step-by-step guide, then the cases, then the meta-analysis.
      *   *Specific Constraint Check:* "30 mins per subforum." The questions need to be answerable by scanning logs/titles/snippets.
      *   *Specific Constraint Check:* "Publicly posted." The language must be neutral. Instead of "Echo Chamber," use "High Credibility Friction" or similar? No, the prompt asks to operationalize the distinction. I should use clear terms but frame them structurally. Let's use "Information Isolation" (Bubble) vs "Credibility Filtering" (Chamber). Actually, sticking to the prompt's terminology (Bubble/Chamber) is clearer for the mods, but the *public report* should use neutral language like "Exposure Profile." I will advise on the public-facing language.
