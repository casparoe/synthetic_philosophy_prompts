answer: |-
  This is a high-stakes operationalization task. You are asking for a diagnostic tool that can distinguish between *ignorance* (Bubble) and *immunity* (Chamber) using only surface-level data, without triggering a community revolt, while acknowledging that your own work (the roundup) might be part of the problem.

  Below is the **Epistemic Structure Audit (ESA) v1.0**. It is designed to be run in 30 minutes using mod logs and a random thread sample. Following the procedure, I have run it on your three test cases, and finally, I have outlined the theoretical trade-offs and failure modes.

  ---

  # Part 1: The Procedure (ESA v1.0)

  **Time Budget:** 30 Minutes
  **Evidence Required:** Mod Queue/Logs, Random Sample of 10 Threads (last 30 days), Search Function.
  **Output:** A structural classification (Type A, Type B, or Type C) and a recommended intervention path.

  ### Phase 1: Inbound Permeability (5 Minutes)
  *Search the subforum for links to the top 3 "outgroup" sources relevant to your niche (e.g., mainstream institutions, rival methodologies, critical blogs).*

  1.  **Count:** How many of the 10 sampled threads contain links to these outgroup sources?
      *   0–1 links: **Low Permeability**
      *   2–5 links: **Medium Permeability**
      *   6+ links: **High Permeability**
  2.  **Origin:** Who posted them?
      *   Mostly established members?
      *   Mostly new members/outside guests?
      *   Mostly mods/official accounts?

  ### Phase 2: Credibility Framing (15 Minutes)
  *Read the top 5 comments on any threads containing outgroup links. Do not judge the truth of the claims. Judge the treatment of the source.*

  3.  **The "Steelman" Check:** When an outgroup argument is presented, is it:
      *   **Standalone:** Posted for discussion on its merits.
      *   **Packaged:** Posted *with* an immediate community rebuttal, correction, or "context" note attached by the poster or mod.
      *   **Ratio:** If >50% are **Packaged**, flag as **Curated Exposure**.
  4.  **The Messenger Treatment:** When a member posts an outgroup link, do subsequent replies:
      *   Engage the content? (**Content Engagement**)
      *   Question the member's motive/naivety? (**Ad Hominem/Contamination**)
      *   Suggest posting it was a violation of norms (e.g., "don't feed the trolls," "this is both-sidesing")? (**Practice Policing**)
      *   *Threshold:* If 2+ instances of Contamination or Practice Policing appear in the sample, flag as **Active Discreditation**.
  5.  **Source vs. Practice:** Distinguish the criticism.
      *   "This lab is funded by X" = **Source Attack** (Specific).
      *   "We shouldn't be discussing this here" = **Practice Attack** (Structural).
      *   *Note:* High frequency of **Practice Attack** is a stronger indicator of an Echo Chamber than Source Attack.

  ### Phase 3: Returnee Protocol (5 Minutes)
  *Search logs for users who were banned/left and returned, or search for phrases like "I left because" or "coming back from [Outgroup Event]."*

  6.  **Re-entry:** Are reports from outside treated as:
      *   **Intelligence:** "What did you learn?"
      *   **Contamination:** "You've been brainwashed," or immediate skepticism requiring high proof.
      *   *Flag:* If **Contamination**, add +1 to Echo Chamber score.

  ### Phase 4: Diagnosis & Intervention Logic (5 Minutes)

  **Calculate the Profile:**

  *   **PROFILE A (The Bubble):** Low Permeability + Neutral/Positive Framing + No Practice Policing.
      *   *Diagnosis:* Information Omission.
      *   *Intervention:* **GO.** "Add more outside sources" is a valid fix.
      *   *Public Wording:* "This subforum has high internal cohesion but low external citation density. Recommendation: Increase link diversity."
  *   **PROFILE B (The Echo Chamber):** Medium/High Permeability + Active Discreditation + Curated Exposure + Practice Policing.
      *   *Diagnosis:* Credibility Reduction Machine.
      *   *Intervention:* **NO.** "Add more outside sources" will fuel the machine. Structural change required (e.g., change how rebuttals are posted).
      *   *Public Wording:* "This subforum has high external engagement but high friction on uptake. Recommendation: Review norms around external citation framing."
  *   **PROFILE C (The Advocacy Group):** High Discreditation + Explicit Mission Statement.
      *   *Diagnosis:* Values-Aligned Bias.
      *   *Intervention:* **HANDOFF.** This is not an epistemic failure; it is a feature.
      *   *Action:* Escalate to Head Mod. "Community is functioning as intended per mission, but carries reputational risk."

  ---

  # Part 2: The Test Cases

  Here is the procedure run on your three scenarios.

  ### Case 1: The Genealogy Subforum
  *   **Observations:**
      *   **Permeability:** Low (0–1 links in sample).
      *   **Framing:** When outsiders ask questions, they are answered helpfully. No "Practice Policing" found.
      *   **Steelman:** N/A (Arguments rarely posted).
      *   **Returnees:** Welcomed.
  *   **Result:** **PROFILE A (The Bubble).**
  *   **Intervention:** **GO.**
  *   **Public Report:** "Structural Isolation Detected. The subforum relies heavily on three internal wikis. While tone is welcoming, exposure to external methodologies is statistically negligible. **Action:** Mod team to pin a monthly 'External Resources' thread."
  *   **Why:** This is a failure of omission. Pouring water (sources) into this bucket works.

  ### Case 2: The "Steelman Saturday" Community
  *   **Observations:**
      *   **Permeability:** Medium/High (Links appear weekly).
      *   **Framing:** 100% **Packaged**. Every outgroup argument is posted with a "Rebuttal of the Week" attached by a mod or senior member.
      *   **Messenger Treatment:** Users who post the *same* link without the rebuttal are corrected ("Read the Saturday post first").
      *   **Practice Policing:** Low (Posting is encouraged), but **Curated Exposure** is maxed out.
  *   **Result:** **PROFILE B (The Echo Chamber).**
  *   **Intervention:** **NO.**
  *   **Public Report:** "High Friction Uptake Detected. External arguments are consistently processed through pre-emptive rebuttal frameworks. While engagement is high, independent evaluation of source material is structurally discouraged. **Action:** Pause 'Steelman Saturday' format for Q3. Trial period for 'Blind Analysis' threads where rebuttals are delayed by 24 hours."
  *   **Why:** Your suspicion is correct. This is a discreditation engine with extra steps. It trains users to associate the *presence* of an outgroup argument with the *presence* of its defeat. Adding more sources here just gives them more ammo to refute. You must break the *linkage* between exposure and rebuttal.

  ### Case 3: Your Main Forum (The Hard Truth)
  *   **Observations:**
      *   **Permeability:** Medium (You post links in the Roundup).
      *   **Framing:** **Curated.** You select the links. You write the summary. The summary inherently frames the "takeaway."
      *   **Messenger Treatment:** Members who challenge the institutional trust narrative in the comments are often met with "We've discussed this" or "Check the FAQ" (Practice Policing).
      *   **Returnees:** Members who leave to work in mainstream institutions and return often report feeling they have to "prove" they haven't been co-opted (Contamination).
      *   **Steelman Check:** The Roundup *is* the Steelman. It presents the outside world, but already digested and filtered by the community's lens.
  *   **Result:** **PROFILE B (The Echo Chamber).**
  *   **Intervention:** **NO.**
  *   **Public Report:** "Centralized Curation Detected. The weekly roundup serves as the primary gateway for external information. This creates a bottleneck where external context is consistently filtered through internal editorial standards. **Action:** Rotate Roundup editorship with a member from a differing methodological background quarterly. Implement a 'Direct Link' section in the roundup that bypasses editorial summary."
  *   **The Verdict You Won't Like:** You are the machine. The Roundup is not a window; it is a lens. By summarizing outside news, you are inevitably encoding the community's skepticism into the presentation of the news itself. When you say "Institution X released a report, but note their methodology has been questioned," you are performing the credibility reduction *for* the membership. They don't need to distrust the source; they trust *you* to distrust it for them.
  *   **Why:** "Just add more sources" fails because you control the sources. The intervention must be to relinquish control of the framing, not to expand the selection.

  ---

  # Part 3: Theoretical Trade-offs & Failure Modes

  You asked which distinctions must survive simplification and where this will misfire.

  ### Distinctions That Must Survive
  1.  **Omission vs. Undermining:** This is the core. If the tool cannot distinguish between "we didn't see this" (Bubble) and "we saw this and rejected it" (Chamber), it is useless. The **Phase 2 Framing** check is non-negotiable.
  2.  **Source vs. Practice:** Discrediting a specific source ("That lab fakes data") is epistemic hygiene. Discrediting the *practice* of engaging ("Don't link that here") is epistemic closure. The tool must capture **Practice Policing** (Phase 2, Q4) or it will flag healthy moderation as toxic.
  3.  **Curated Exposure:** The "Steelman" check is vital. Modern communities rarely ban outside links; they domesticate them. If the tool only measures link volume, it will miss the Chamber entirely.

  ### Distinctions That Can Be Dropped
  1.  **Truth Value:** The tool correctly brackets whether the outgroup is *right*. It only measures how the community *reacts*. This is essential for mod safety.
  2.  **Intent:** We do not need to know if the Head Mod *wants* to create a cult. We only need to know if the structure *acts* like one.
  3.  **Member Rationality:** We are not auditing minds; we are auditing threads. This protects you from accusations of mind-reading.

  ### Where It Will Misfire (The "Bad Actor" Problem)
  This is the biggest risk. The tool cannot distinguish between **unjustified epistemic closure** and **justified defense against harassment/spam.**

  *   **Scenario:** A niche hobby is being targeted by a scammer or a bad-faith political group. The community decides to ban links to that group and discourage discussion ("Don't feed the trolls").
  *   **Tool Output:** **PROFILE B (Echo Chamber).** High Practice Policing, Active Discreditation.
  *   **Reality:** Healthy community defense.
  *   **Mitigation:** The **Phase 4 Handoff (Profile C)** is the safety valve. If the Head Mod signs off that "This specific source is hostile," the audit result is overridden.
  *   **The Blunt Truth:** You cannot automate the distinction between "paranoia" and "prudence." The tool will flag *both* as Echo Chamber behaviors. You must rely on the Head Mod's veto for specific sources, but the *structural* warning (e.g., "We are discouraging discussion of *categories* of sources") remains valid.

  ### Final Recommendation for the Public Report
  Do not use the words "Bubble" or "Echo Chamber" in the public post. They are loaded terms that imply stupidity or malice.
  *   Use **"Information Isolation"** for Bubbles.
  *   Use **"High Credibility Friction"** for Echo Chambers.
  *   Use **"Centralized Curation"** for the Roundup issue.

  This allows you to say, "We have High Credibility Friction," which sounds like a technical debt issue, not a moral failing. It allows you to fix the machine without accusing the members of being broken.
