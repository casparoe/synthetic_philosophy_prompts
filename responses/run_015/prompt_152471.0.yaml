      *   *Refinement:* The procedure asks the hard questions. The *result* translates them. E.g., Internal: "Echo Chamber." Public: "High Credibility Friction Environment."
      *   *Actually, looking at the prompt again:* "it needs to be able to say 'this community has this structural feature' without issuing a verdict on any member's rationality."
