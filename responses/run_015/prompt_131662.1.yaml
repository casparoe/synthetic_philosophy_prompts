answer: |-
  **Project Title:** Keying Variation: Disentangling Contextual Defaults from Conceptual Content in Cross-Cultural Philosophy

  **Research Question:** Does observed cross-cultural divergence in philosophical intuitions stem from genuine conceptual disagreement or from divergent contextual 'keying' of underdescribed vignettes?

  **Background and Gap:** Experimental philosophers often cite divergent modal answers to fixed vignettes as evidence against the universality of philosophical concepts. Defenders of robustness typically attribute these gaps to performance errors or educational disparities. Both positions, however, share a critical assumption: that the vignette presents identical content across populations. This overlooks pragmatic enrichment. Participants from different backgrounds inevitably fill underdescribed gaps with different defaults—for instance, assuming a protagonist is a kin member versus a stranger, or situated inside versus outside a specific institutional framework. Consequently, what appears as disagreement about knowledge or reference may actually be agreement on different background premises. Existing methodologies lack the tools to distinguish this 'keying variation' from genuine content variation, leaving the universality debate stalled between conflicting interpretations of the same data.

  **Design:** I propose a comparative study across two linguistically distinct populations. The design moves beyond standard translation protocols to target interpretive framing.
  1. *Baseline:* Administer standard vignettes alongside comprehension checks measuring default assumptions (relationship, setting, conversational standards).
  2. *Manipulation:* Administer 'keyed' vignettes where these defaults are made explicit and held fixed across sites.
  3. *Second-Order Condition:* Participants are shown the opposing group's modal answer and stated reasons, then asked to classify the discrepancy. This tests whether participants recognise the other group's response as answering a different question, providing meta-evidence for keying.

  **Justification:** Increasing sample sizes, sites, or translation fidelity addresses noise, not the structural flaw of underdescription. This design isolates the mechanism of variation. If the gap is due to keying, explicit framing should harmonise responses. If it is conceptual, the gap will persist despite fixed framing. This offers a diagnostic tool rather than merely mapping the extent of divergence.

  **Outcomes:**
  *   *Positive Result:* The cross-cultural gap significantly shrinks in the keyed condition compared to baseline, indicating variation was largely artefactual.
  *   *Negative Result:* The gap persists unchanged in the keyed condition, supporting genuine content variation.
  *   *Project Failure:* This differs from a null result. Failure occurs if defaults cannot be stabilised (e.g., participants systematically reject explicit framing as unnatural) or if the manipulation renders the vignette incomparable across sites. A null result is a substantive negative finding; failure is methodological collapse preventing interpretation.

  **Scope and Risks:** Nine months is sufficient for design, pilot, and fieldwork in two sites, but tight for analysis. The primary risk lies in recruitment and translation validation. To mitigate this, I will limit the study to two contrasting populations with established academic partnerships rather than seeking broad geographical coverage. Expanding to more sites would render the nine-month timeline unfeasible, compromising the depth of the manipulation checks required to distinguish keying from content. The project must remain focused on the mechanism of interpretation rather than becoming a broad survey of intuition distributions. Attempting to add a third site or expand the vignette battery would jeopardise the rigorous translation validation required for the keyed manipulation.
