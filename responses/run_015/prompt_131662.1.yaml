      **Project Title:** Keying Variation: Disentangling Contextual Defaults from Conceptual Content in Cross-Cultural Philosophy

      **Research Question:** Does observed cross-cultural divergence in philosophical intuitions stem from genuine conceptual disagreement or from divergent contextual 'keying' of underdescribed vignettes?

      **Background:** Experimental philosophers often treat divergent modal answers to fixed vignettes as evidence of conceptual variation. Defenders of universality attribute this to performance error or educational differences. Both positions presuppose that the vignette presents identical content across populations. This overlooks pragmatic enrichment: participants from different backgrounds fill underdescribed gaps with different defaults (e.g., assuming a protagonist is a kin member versus a stranger, or inside versus outside a legal framework). What appears as disagreement about knowledge or reference may be agreement on different background premises.

      **Design:** I propose a comparative study across two linguistically distinct populations. The design moves beyond standard translation protocols.
