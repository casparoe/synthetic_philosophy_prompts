      2. *Manipulation:* Administer 'keyed' vignettes where these defaults are made explicit and held fixed across sites.
      3. *Second-Order Condition:* Participants are shown the opposing group's modal answer and stated reasons, then asked to classify the discrepancy (disagreement, different question, or different topic).

