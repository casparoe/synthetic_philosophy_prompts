answer: |-
  ### Reconstruction of the Argument

  Your friend's argument is a sophisticated articulation of **ergodicity economics**, moving from a mathematical observation about stochastic processes to a universal normative rule. Here is the structure as I understand it:

  1.  **The Dynamics (1):** In multiplicative processes, the time-average growth rate converges to the expected log return (the geometric mean). This is a statement of the Law of Large Numbers applied to logarithms of wealth.
  2.  **The Ontology (2):** Because an agent exists as a single trajectory in time rather than a distribution of parallel selves, the ensemble average (arithmetic mean) is physically irrelevant to the individual. The time average is the only rational metric.
  3.  **The Calculation (3):** For the specific coin (1.5/0.6), the arithmetic mean is positive (+5%), but the geometric mean is negative (-5%). Therefore, betting full wealth leads to ruin almost surely. The Kelly criterion (maximizing expected log) aligns the individual's growth with the time-average optimum.
  4.  **The Generalization (4 & 5):** This logic is claimed to be universal across **substance** (money, genes, grants) and **horizon** (first bet, last bet, infinite sequence).
  5.  **The Normative Conclusion (6):** Therefore, any agent in a compounding context should universally maximize expected log wealth.

  ### The Load-Bearing Step

  The step I reject is **(5)**.

  > *(5) Nothing in it turns on the horizon either. The log rule is myopic: it is the same at every step, so it is what you should do on the last bet as well as on the first.*

  This is the linchpin. Steps (1) through (3) establish that *in the long-run limit*, maximizing log-wealth maximizes the time-average growth rate. Step (5) asserts that this long-run justification licenses a **myopic policy** that applies even when the "long run" no longer exists (the last bet) or is interrupted by boundaries (floors/targets).

  ### Why It Looked Safe

  Step (5) looks safe because it relies on a genuine mathematical property of the Kelly criterion: **myopic optimality**. If your objective function is *strictly* to maximize the expected logarithm of terminal wealth, then the optimal strategy is indeed the same at every step, regardless of the time remaining. The dynamic programming equation collapses; you do not need to look ahead.

  Your friend's argument disguises a category error here. It treats the **logarithmic utility function** not as a specific preference structure, but as a physical law derived from ergodicity. Because the *derivation* of the log rule (from steps 1-3) relies on asymptotic convergence ($T \to \infty$), it feels like a law of nature. Step (5) smuggles this asymptotic law into finite, boundary-constrained contexts where the premises of (1) no longer hold. It assumes that because the rule *is* myopic for log-utility, it *must be* the correct rule for the last bet. But on the last bet, you do not care about the *growth rate* of your wealth; you care about the *level* of your wealth.

  ### Priced Comparison of Alternatives

  To reject (5) is to pay a price in simplicity to buy robustness.

  | Feature | **Accept Step (5) (Universal Myopia)** | **Reject Step (5) (Horizon-Sensitive)** |
  | :--- | :--- | :--- |
  | **Decision Rule** | Simple, universal heuristic (Kelly fraction). | Context-dependent (Dynamic Programming). |
  | **Long-Run Growth** | Maximizes asymptotic growth rate. | Maximizes expected utility of terminal state. |
  | **Ruin Risk** | Accepts deep drawdowns (e.g., 50%+ drops). | Can constrain risk to meet survival floors. |
  | **Deadlines/Targets** | Ignores them; may miss targets to preserve growth. | Optimizes probability of hitting specific targets. |
  | **Philosophical Cost** | Claims a single "rational" objective for all agents. | Admits objectives depend on agent constraints. |

  **The Price:** By rejecting (5), you lose the elegance of a "one rule fits all" physics of finance. You must specify the agent's utility function and constraints explicitly.
  **The Gain:** You avoid the "ruin paradox" (where the optimal growth strategy has a high probability of temporary ruin) and the "target paradox" (where the growth-optimal strategy has near-zero probability of hitting a specific high target).

  ### Diagnosis of the Three Cases

  Rejecting (5) allows you to keep (1), (2), and (3) as descriptions of the *asymptotic, unconstrained* case, while correctly diagnosing why they fail in your counter-examples.

  **(a) The Foundation (Independent Grants)**
  Here, the issue is actually a mix of (4) and (5). If the foundation makes independent grants from a replenished endowment, the wealth does not compound *across* grants in the same way a trading book does. The "wealth" is the total social impact, which is likely additive (linear utility), not multiplicative.
  *   **Diagnosis:** Step (4) is the weak link here (substance matters), but Step (5) is also violated because the foundation has a spending horizon. If the foundation must spend down by year $T$, the last grant should maximize expected value, not geometric growth. Rejecting (5) allows you to say: "The log rule applies only while the endowment is meant to compound perpetually. If the horizon is fixed, we shift toward expected value as we approach the deadline."

  **(b) The All-or-Nothing Target**
  This is a direct violation of (5). If you need \$10M by Friday and have \$1M today, the log-optimal strategy might grow your wealth at 5% per round, leaving you at \$2M on Friday. You fail. A high-variance, negative-growth strategy might give you a 10% chance of hitting \$10M.
  *   **Diagnosis:** On the "last bet" (or near the deadline), the objective function shifts from *rate of growth* to *probability of exceeding a threshold*. Step (5) claims the log rule applies to the last bet. This is false. The last bet should maximize expected *utility* (which is a step function here), not expected *log wealth*. Rejecting (5) saves you from optimizing for a metric (growth rate) that is irrelevant to the goal (hitting the target).

  **(c) The Capital Floor (Absorption)**
  This undermines Step (1) as much as (5). Step (1) claims wealth converges *almost surely* to the growth rate. But if there is a floor (e.g., margin call), the process is absorbed at zero. The "almost sure" convergence is conditional on *not hitting the floor*.
  *   **Diagnosis:** The log rule tolerates drawdowns that might trigger the floor. If you bet Kelly on a 1.5/0.6 coin, you bet 25%. A string of losses reduces wealth. If a floor exists, the "time average" is undefined because the trajectory ends. Rejecting (5) allows you to introduce **fractional Kelly** or **barrier-aware optimization**. You sacrifice some asymptotic growth (violating the pure log rule) to ensure the probability of absorption remains acceptably low.

  ### The Relation Between Growth and "Better"

  You asked: *What exactly is the relation between "higher almost-sure growth rate" and "better for the agent" that the argument is trading on?*

  The argument trades on an **Instrumental Proxy Relation**, but treats it as an **Intrinsic Good**.

  1.  **Instrumental Proxy:** In an infinite-horizon, unconstrained environment, maximizing the time-average growth rate is the *instrumentally* best way to maximize the utility of terminal wealth for any unbounded, monotonic utility function. If you live forever and never face ruin, the strategy with the highest growth rate will eventually surpass any other strategy with probability 1.
  2.  **The Break:** This relation holds *only* in the limit. At finite horizons, or with constraints (floors/ceilings), the correlation breaks. A strategy with a slightly lower growth rate but lower variance may yield higher expected utility at time $T$ or a higher probability of survival.
  3.  **The Error:** Your friend's argument assumes that because growth rate is the best proxy in the limit (1-3), it is the *definition* of rationality (6). It is not. It is a tool for long-term compounding. When the compounding stops (deadline), or the vehicle breaks (floor), or the cargo isn't wealth (foundation impact), the tool must be swapped.

  ### Summary Recommendation

  Keep (1), (2), and (3) as the **physics of compounding**. They correctly describe why naive expected-value maximization kills traders in the long run.

  Reject **(5)**. State clearly: **"The log rule is myopic only given an objective of perpetual compounding. It is not the rational policy for finite horizons, specific targets, or survival constraints."**

  This preserves the ergodicity insight (you live one life, so don't trust ensemble averages) without falling into the trap of believing that *time-average growth* is the only valid time-average metric. For a trader with a deadline or a floor, the rational time-average metric is **time-average utility**, which diverges from time-average wealth growth near boundaries.
