answer: |-
  ### (1) Exam Question

  **Course:** Seminar in the Moral Psychology of Mass Atrocity
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes
  **Expected Length:** Approximately 1,200 words
  **Total Marks:** 25

  **Question:**

  Consider the following fictionalized archival profile regarding Reserve Police Battalion 101 in mid-1943. Unit records indicate near-total compliance with orders to execute Jewish populations in designated villages. However, newly discovered private correspondence from this period reveals frequent expressions of reluctance, anxiety about family reactions, and formal requests for medical exemption from shooting duties. Archival notes indicate these requests were almost never granted by superiors and, crucially, almost never repeated by the same individuals, even when subsequent shooting operations occurred.

  Using this profile, adjudicate between Christopher Browning's situational explanation (peer pressure, incremental commitment, obedience to authority), Daniel Goldhagen's cultural-character explanation (eliminationist antisemitism), or a hybrid model. Your essay must:

  1.  Identify which specific evidentiary details in the profile genuinely distinguish between these explanations.
  2.  Assess whether the expressed private reluctance undermines Goldhagen's claim of "willingness" or undermines Browning's claim of "ordinary" non-ideological compliance.
  3.  Examine whether the opposition between "ordinary men" and "willing executioners" depends on an unstated theory of moral character stability that both authors share but do not defend.
  4.  Evaluate whether situationist critiques of global character traits dissolve this distinction without resolving the historical explanation.

  Do not summarize the arguments of Browning or Goldhagen; assume the examiner is familiar with both texts. Focus strictly on the analytical application of their frameworks to the provided profile and the underlying philosophical assumptions regarding moral psychology.

  ***

  ### (2) Model Answer

  The archival profile presents a paradox: public conformity paired with private dissent that fails to translate into sustained resistance. Adjudicating between Browning and Goldhagen requires determining whether the private correspondence reveals the "true" moral agent or whether the public action is the sole relevant metric of moral psychology.

  For Browning, the profile offers strong corroborative evidence. His situational model posits that "ordinary men" kill not because of deep ideological commitment, but because the social cost of refusal outweighs the moral cost of compliance. The private expressions of reluctance confirm the "ordinariness" of the men; they possess standard moral intuitions that recoil at murder. The fact that requests for exemption were "almost never repeated" is the critical datum. It suggests that once the initial refusal was blocked by authority, the situational pressure—fear of ostracization, career damage, or direct punishment—collapsed the moral resistance. The reluctance is genuine, but it is fragile against the structure of the battalion. Thus, the profile supports Browning: the men are ordinary because they feel reluctance, but they become killers because the situation overrides character.

  Goldhagen, conversely, would argue that the private correspondence is noise, while the public compliance is the signal. For Goldhagen, "willingness" is not defined by internal emotional comfort but by the absence of effective resistance. If the men possessed a deep, culturally cultivated eliminationist antisemitism, expressions of reluctance might be performative—written for family members who might not share the ideology—or they might represent transient discomfort overridden by a deeper conviction that the Jews must be removed. The fact that requests were not repeated suggests that the men accepted the authority's judgment that their exemption was unnecessary. For Goldhagen, the failure to persist in refusal indicates that the antisemitic commitment was sufficient to ensure compliance, even if accompanied by anxiety. The profile does not undermine Goldhagen if "willingness" is understood as functional compliance rather than enthusiastic joy.

  However, the tension between these readings exposes an unstated assumption shared by both authors: the stability of moral character. Both Browning and Goldhagen operate with a tacit trait psychology. Browning assumes the men possess a stable "ordinary" morality that is situationally overwhelmed; Goldhagen assumes they possess a stable "eliminationist" character that drives behavior. Both treat the individual as having a consistent moral disposition that either survives (Goldhagen) or succumbs (Browning) to external forces.

  This is where the situationist critique dissolves the distinction. Situationism argues that global character traits (like "honesty" or "antisemitism") do not exist as stable predictors of behavior across diverse contexts. If character is not stable, asking whether these men were "ordinary" or "willing" is a category error. The profile shows behavior specific to the battalion context. The private letters are not evidence of a stable "good character" any more than the shooting is evidence of a stable "evil character." Both are responses to specific stimuli: the letter writing is a response to distance from authority and family bonds; the shooting is a response to direct authority and peer presence.

  Therefore, the evidentiary details that distinguish the explanations are not the feelings themselves, but the threshold of resistance. Browning requires the reluctance to be genuine but overridden; Goldhagen requires the compliance to be ideologically saturated. The profile ambiguously supports both. The lack of repeated requests favors Browning (fear of authority), but the near-total compliance favors Goldhagen (ideological consensus).

  A hybrid model is necessary but insufficient without accepting the situationist dissolution of character. The men likely held some antisemitic views (Goldhagen), but those views were not sufficient to cause killing without the situational scaffolding (Browning). However, the deeper resolution is to recognize that the opposition between "ordinary" and "willing" relies on a folk-psychological notion of character stability that the archival data cannot confirm. The data shows behavioral consistency within the unit, not cross-situational character stability.

  Ultimately, the profile suggests that the moral psychology of atrocity cannot be resolved by choosing between character and situation because the "character" being debated is likely an artifact of the authors' frameworks rather than a historical reality. The men were neither consistently ordinary nor consistently willing; they were consistent only within the specific architecture of Battalion 101. To privilege one explanation over the other is to assume a stability of self that the evidence—showing a split between private word and public deed—actively undermines. The most rigorous conclusion is that the distinction itself collapses under the weight of the archival contradiction, pointing toward a situationist ontology where behavior is locally determined rather than globally characterized.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 25 (5 Analytical Moves × 5 Marks Each)

  **1. Interpretation of the Archival Tension (5 Marks)**
  *   **Required Reasoning:** Must identify the core conflict: public compliance vs. private reluctance + failure to repeat exemption requests. Must state why this tension matters for moral psychology (action vs. intention).
  *   **Common Misconception:** Treating the private letters as definitive proof of innocence or the public actions as definitive proof of guilt without analyzing the gap between them.
  *   **Partial Credit:** Awarded if the student identifies the tension but fails to explain why the "non-repetition" of requests is the crucial variable.

  **2. Application of Browning's Situational Framework (5 Marks)**
  *   **Required Reasoning:** Must explain how Browning uses reluctance to prove "ordinariness" and situational pressure to explain compliance. Must apply the "non-repetition" of requests as evidence of authority overriding moral intuition.
  *   **Common Misconception:** Claiming Browning argues the men felt no remorse (contradicts *Ordinary Men*).
  *   **Partial Credit:** Awarded for correctly identifying peer pressure/authority but failing to link it specifically to the cessation of exemption requests.

  **3. Application of Goldhagen's Cultural-Character Framework (5 Marks)**
  *   **Required Reasoning:** Must explain how Goldhagen prioritizes action over internal state. Must argue that "willingness" is functional compliance, not necessarily emotional enthusiasm.
  *   **Common Misconception:** Arguing Goldhagen ignores private feelings entirely (he acknowledges them but subordinates them to ideology).
  *   **Partial Credit:** Awarded for noting the ideological component but failing to address how Goldhagen accounts for the expressed anxiety.

  **4. Critique of Moral Character Stability (5 Marks)**
  *   **Required Reasoning:** Must identify that both authors assume a stable self (either "ordinary morality" or "eliminationist character"). Must explain how the split between private/public behavior challenges this stability.
  *   **Common Misconception:** Treating situationism as just another variable rather than a challenge to the concept of character traits themselves.
  *   **Partial Credit:** Awarded for mentioning situationism but failing to connect it to the unstated assumptions of Browning/Goldhagen.

  **5. Reasoned Judgment and Ambiguity (5 Marks)**
  *   **Required Reasoning:** Must reach a conclusion without forcing a false resolution. Must acknowledge where the evidence remains genuinely ambiguous (e.g., we cannot know the true motive behind the non-repetition).
  *   **Common Misconception:** Declaring one author definitively "correct" based on the fictionalized profile.
  *   **Partial Credit:** Awarded for recognizing ambiguity but failing to synthesize it into a coherent judgment about the theoretical frameworks.

  ***

  ### (4) Meta-Reflective Note

  **Word Count:** 148 words

  I would change my assessment if archival evidence demonstrated cross-situational consistency—for example, if men who requested exemptions also resisted authority in non-atrocity contexts (e.g., logistical disobedience). This would support a stable character trait over situational determinism. The weakest point in my reasoning is the constructed profile itself: by specifying that exemption requests were "almost never repeated," I have smuggled in an assumption favoring Browning. A Goldhagen proponent could argue this simply shows efficient disciplinary conditioning, not the absence of ideological will. Consequently, the profile inadvertently privileges the situational explanation by making the cessation of resistance look like fear rather than ideological acceptance, limiting the true neutrality of the exam prompt.
