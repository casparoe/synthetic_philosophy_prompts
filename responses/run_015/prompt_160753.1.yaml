      *   *Doing/Allowing:* Is it distinct? Legally, no. Morally/Psychologically, yes. Withdrawing requires a decision that *this specific patient* is futile. Automatic withdrawal requires a decision that *this specific patient* is an exception worth saving. The latter is dangerous in a surge.
