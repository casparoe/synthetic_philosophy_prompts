      *   *Actually, a nuanced take:* The doing/allowing distinction is legally settled (GMC guidance), but the *procedural default* matters for moral distress. I will recommend A because it protects the moral agency of clinicians, preventing the "machine" effect.

      *   *Drafting the Bottom Line:* I recommend we adopt Version A. While outcomes are modeled as identical, the default setting of care determines whether we act as clinicians or administrators of fate.

