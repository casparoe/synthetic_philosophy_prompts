      *   *Better angle:* The distinction *doesn't* change the patient outcome, so we shouldn't pretend it does. We should decide based on staff moral integrity and public trust.
      *   *Revised Bottom Line:* I recommend we adopt Version A. While the doing/allowing distinction does not change patient survival, it critically protects clinician moral integrity and public trust.

