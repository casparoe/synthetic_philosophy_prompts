          *   Nudge 2: "It's not B." (But not certain). Shifts mass from B to A&C.
          *   If I shift C->A,B then B->A,C, A gets a double boost.
          *   If I shift B->A,C then C->A,B, A gets a double boost.
          *   *Wait, does this commute?*
          *   Let $P = (p_a, p_b, p_c)$.
          *   Update 1 (on partition $\{C, \neg C\}$): New $p_c = q_1$. Mass $(1-q_1)$ distributed to $A, B$ proportionally.
          *   Update 2 (on partition $\{B, \neg B\}$): New $p_b = q_2$. Mass $(1-q_2)$ distributed to $A, C$ proportionally.
