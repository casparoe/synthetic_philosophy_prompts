  9.  **Final Structure:**
      *   Introduction: Framing the anachronism.
      *   The Quantification of Uniqueness (ODI as Category Error).
      *   The Endogeneity of State-Space (The Breakdown of Calculation).
      *   Where Knight's Resources Are Outrun (Formalism and Scale).
      *   Conclusion: Confirmation of the Thesis, not Extension.

