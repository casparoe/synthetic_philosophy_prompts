  Here is the brainstorming process, the selection of the surviving principle, and the application to your cases.

  ### Part 1: Candidate Principles

  Before settling on a final account, I considered five candidate principles. I will detail four here, explicitly rejecting one based on your verdicts, to show why the survivor is necessary.

  **Candidate 1: The Ideological Compatibility Principle**
  *Definition:* The historical narrative that dominates is the one most consistent with the core ideological commitments of the victors.
  *Test:* This works for Case 1 (Rome hates Carthage) and Case 2 (Normans view English as backward).
  *Failure:* It breaks against **Case 4 (The Lost Cause)**. The Union's core ideological commitment was that the war was about slavery and union preservation. The Lost Cause narrative (states' rights, slavery as benign) was ideologically incompatible with the North's war aims. Yet, the North allowed it to dominate. If this principle were true, the North would have suppressed the Lost Cause immediately to maintain ideological consistency. They did not.
  *Verdict:* **Rejected.**

  **Candidate 2: The Military Power Determinism Principle**
  *Definition:* The side that wins the military conflict controls the historical narrative.
  *Test:* Works for Case 1 and Case 2.
  *Failure:* Breaks against **Case 4** and **Case 5**. In Case 4, the military losers (South) controlled the narrative. In Case 5, the military losers (Germans) provided the framework for the winners' understanding.
  *Verdict:* **Rejected.**

  **Candidate 3: The Physical Availability Principle**
  *Definition:* The narrative that dominates is simply the one for which physical records survive.
  *Test:* Works perfectly for **Case 1** (Carthage destroyed) and **Case 6** (Soviet archives opened, narrative changed).
  *Failure:* Breaks against **Case 4** and **Case 5**. In Case 4, Union records survived, yet the Southern narrative dominated. In Case 5, Soviet records existed (though closed), but German memoirs dominated despite physical availability of counter-evidence later. Physical survival is necessary but not sufficient.
  *Verdict:* **Rejected.**

  **Candidate 4: The Administrative Convenience Principle**
  *Definition:* The narrative that dominates is the one that is easiest for the current bureaucracy to process and file.
  *Test:* Works well for **Case 3** (Spanish friars categorizing Nahua accounts) and **Case 5** (US Army using German staff studies).
  *Failure:* It struggles with **Case 4**. The Lost Cause was not administratively convenient for the US government; it was a political complication. It requires a broader notion of "convenience" that includes political peacekeeping, not just filing efficiency.
  *Verdict:* **Promising, but needs expansion.**

  **Candidate 5: The Replication Fitness Principle (The Survivor)**
  *Definition:* A historical narrative dominates when it possesses the highest "fitness" for the specific information ecosystem at the time of transmission. "Fitness" is a function of three variables: (1) Physical Survivability of the source, (2) Political/Social Utility to the infrastructure controllers, and (3) Cognitive Friction (how easily it fits existing categories).
  *Test:* This principle treats "destruction" (Case 1) as reducing competitor fitness to zero, and "adoption" (Case 4 & 5) as increasing specific narrative fitness due to utility. It covers all seven verdicts without contradiction.
  *Verdict:* **Selected.**

  ### Part 2: The Unified Principle

  You asked me to tell you honestly whether one clean principle can cover both the "destruction" of Case 1 and the "utility" of Cases 4 and 5, or if you must accept a disjunctive account.

  **The Honest Assessment:**
  You do *not* need a disjunctive account, provided you define the principle at the level of **systemic incentives** rather than **physical mechanisms**. If you define the principle as "Utility," you must drop Case 1 (destruction is not utility). If you define it as "Power," you must drop Case 4 (losers had no power).

  However, if you define the principle as **Replication Fitness**, you can cover both. In engineering terms, think of historical narratives as data packets competing for storage space and bandwidth in a network.
  *   In Case 1, the victor executes a `rm -rf` on the competitor's data. The fitness of the Carthaginian narrative becomes zero because the storage medium was physically zeroed.
  *   In Case 4, the victor chooses not to allocate bandwidth to the "Slavery Cause" packet because it causes network congestion (political conflict), and instead routes the "Lost Cause" packet because it stabilizes the network (reconciliation).

  The mechanism differs (deletion vs. routing), but the *law* governing the outcome is the same: **The narrative that minimizes the total cost of maintenance for the infrastructure controller wins.**

  Here is the principle stated precisely, clause by clause, mapped to your cases.

  **The Principle of Replication Fitness**
  *A historical narrative achieves dominance when it minimizes the total maintenance cost for the agents controlling the replication infrastructure at the time of transmission, subject to the constraint of physical source availability.*

  **Clause 1: The Infrastructure Control Condition**
  *Definition:* Dominance is determined by whoever holds the "write access" to the schools, presses, and archives at the time of commemoration, not necessarily at the time of the event.
  *   **Forces this clause:** **Case 4 (The Lost Cause).** The Union won the war, but the South gained write access to the cultural infrastructure during Reconstruction. Without this clause, you cannot explain how losers write history.
  *   **Forces this clause:** **Case 5 (Eastern Front).** The Allies won the war, but ceded "write access" on tactical military history to German generals because the US Army controlled the replication infrastructure and chose to delegate.

  **Clause 2: The Maintenance Cost Function**
  *Definition:* "Cost" includes physical storage costs, political friction costs, and cognitive processing costs. The dominant narrative is the one that optimizes this function.
  *   **Forces this clause:** **Case 1 (Rome/Carthage).** The political friction cost of preserving Carthaginian records was deemed higher than the cost of destroying them. Destruction is an upfront investment to reduce long-term maintenance cost (risk management).
  *   **Forces this clause:** **Case 4 (The Lost Cause).** The political friction cost of enforcing the "Slavery" narrative was higher than the cost of accepting the "Lost Cause" narrative during reunification.
  *   **Forces this clause:** **Case 5 (Eastern Front).** The cognitive processing cost of learning Soviet operational art was higher than the cost of translating German staff studies, which used familiar Western military taxonomy.

  **Clause 3: The Physical Constraint**
  *Definition:* No narrative can achieve dominance if the physical medium of its transmission has been totally eradicated, regardless of its utility.
  *   **Forces this clause:** **Case 1 (Rome/Carthage).** Even if a pro-Carthage narrative was useful, it could not circulate without records.
  *   **Forces this clause:** **Case 6 (Soviet Archives).** When the physical constraint was lifted (archives opened), the maintenance cost of the German-memoir narrative spiked (it was now falsifiable), and the narrative collapsed.

  **Clause 4: The Temporal Decay Clause**
  *Definition:* Infrastructure control and cost functions change over time; a narrative dominant at T+10 may be obsolete at T+50.
  *   **Forces this clause:** **Case 7 (Internal Revision).** The victors' grandchildren overturned the heroic version because the political friction cost of maintaining the heroic myth grew higher than the cost of admitting fault (e.g., civil rights movements, cultural shifts).
  *   **Forces this clause:** **Case 2 (Norman Conquest).** The English chronicle survived for decades (low initial cost) but eventually faded as Norman French became the high-status language (storage cost increased).

  ### Part 3: The Disjunction Question

  You asked: *Tell me honestly whether one clean principle can cover both, or whether I have to accept a disjunctive, ugly, two-mechanism account... and if so which verdict a simpler principle would force me to drop.*

  **My Verdict:**
  You can keep the **one clean principle** (Replication Fitness) without dropping any verdicts, *but* you must accept that "Fitness" is a composite variable.

  If you try to simplify the principle further to something like **"The Utility Principle"** (your tentative draft), you **must drop Case 1**. You cannot say destroying Carthage was "useful" in the same way adopting German memoirs was "useful." One is elimination, one is selection. If you force them under "Utility," you blur the moral distinction between genocide and reconciliation.

  If you try to simplify the principle to **"The Power Principle,"** you **must drop Case 4**. You cannot say the South had "power" in 1870 in the same way Rome had "power" in 146 BC. One is hard power (coercion), one is soft power (cultural influence).

  **Recommendation:** Keep the **Replication Fitness** principle. It is unified but acknowledges that "Cost" can be paid in blood (Case 1) or in political capital (Case 4). It is not disjunctive, but it is multivariate.

  ### Part 4: Application to New Cases

  Here is how the Principle of Replication Fitness applies to the three cases you proposed, plus your industry case.

  **New Case 1: The Compromise War**
  *Scenario:* A war ends in a stalemate/compromise. Both sides keep their own schools, presses, and borders (e.g., the Peace of Westphalia, or a hypothetical divided Korea permanently).
  *Analysis:*
  *   **Infrastructure Control:** Split. No single agent controls the replication infrastructure.
  *   **Maintenance Cost:** High for any single "unified" narrative. Low for dual narratives.
  *   **Verdict:** **Dual Histories.** Neither side produces "Victor's History." You get two mutually incompatible dominant narratives circulating in parallel ecosystems. The "history" that circulates globally becomes fragmented. This matches your intuition that "Victor's History" requires a monopoly on infrastructure.

  **New Case 2: The Natural Disaster (Plague/Earthquake)**
  *Scenario:* No winners or losers. Every surviving account comes from literate elites (clerics, officials), while the illiterate victims leave no records.
  *Analysis:*
  *   **Infrastructure Control:** Held by literacy holders (Elites), not "victors."
  *   **Physical Constraint:** Non-elite records never existed (high serialization cost for illiterate populations).
  *   **Maintenance Cost:** Low for elite narratives (divine wrath, civic order); High for non-elite narratives (non-existent).
  *   **Verdict:** **Class History, not Victor's History.** The slogan "History is written by the victors" fails here because there was no war. The accurate slogan is "History is written by the serializers." The narrative reflects the infrastructure constraints of literacy, not military outcome.

  **New Case 3: The Defeated Bureaucracy**
  *Scenario:* Victors conquer a state but find the losers' administrative paperwork far superior (e.g., Americans in the Philippines, or British in India initially). Victors run the country using the losers' paperwork.
  *Analysis:*
  *   **Infrastructure Control:** Victors hold the guns, Losers hold the files.
  *   **Maintenance Cost:** High to create new system; Low to adopt existing system.
  *   **Verdict:** **Administrative Capture (Similar to Case 3).** This is "Victor's History" regarding the *political frame* (we are the rulers), but "Losers' History" regarding the *operational data*. The victors will write the history of *why* they rule, but they will use the losers' data to explain *how* the country works. The narrative becomes a hybrid: Victorious sovereignty, Defeated administration.

  ### Part 5: The Technology Industry Case

  *Scenario:* A technology wins (e.g., QWERTY, VHS, a specific programming language). Adopters write the retrospective explanation ("it was technically superior") after competing systems are abandoned and advocates scattered.

  *Analysis:*
  *   **Infrastructure Control:** Held by the Winners (the adopters, the companies, the schools teaching the stack).
  *   **Physical Constraint:** Competing systems are abandoned (bit rot, hardware unavailable).
  *   **Maintenance Cost:** Low to repeat "it was better" (justifies current investment, reduces cognitive dissonance). High to investigate "was it actually marketing?" (requires digging up dead docs).
  *   **Verdict:** **Victor's History.**
  *   **Comparison to Case 4:** This is **not** the same verdict as Case 4.
      *   In Case 4 (Lost Cause), the *Losers* wrote the history.
      *   In this Tech case, the *Winners* write the history.
      *   However, the *mechanism* is the same as Case 4: **Utility overrides Truth.** In Case 4, the utility was reconciliation. In Tech, the utility is validating sunk costs and hiring pipelines.
  *   **Should your verdict match Case 4?** No. Your verdict on Case 4 was "Not victor's history." Your verdict here should be "Victor's history."
  *   **Why this matters:** In Case 4, the military victor *ceded* epistemic control. In the Tech case, the market victor *retains* epistemic control. The narrative "it was technically superior" is a classic Victory Monument built in text. It survives not because it is true, but because it is cheap to transmit for the people currently holding the keyboards.

  ### Final Summary for Your Mental Model

  You are thinking about this correctly in infrastructure terms. To refine your model:

  1.  **Stop looking at "Victors" as military winners.** Look at them as **Infrastructure Controllers**. Sometimes the military winner controls the infrastructure (Case 1). Sometimes the military loser buys control of the infrastructure (Case 4). Sometimes the military winner leases the infrastructure from the loser (Case 5).
  2.  **Stop looking at "Records" as truth.** Look at them as **Data Packets**. Their survival depends on whether the network routers (schools, archives, press) are configured to pass them.
  3.  **The Principle:** **Replication Fitness.** A narrative survives if it is physically possible to store and politically cheap to repeat for whoever holds the write access.

  This covers your erasure (physical impossibility), your capture (high conversion cost), and your adoption (low replication cost) without needing three different slogans. It is one engine with different fuel types.
