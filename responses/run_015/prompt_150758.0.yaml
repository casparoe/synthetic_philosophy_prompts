  **Settled Science versus Contested Interpretation**

  It is settled within cognitive science that the colour phi phenomenon exists, that the Orwellian and Stalinesque taxonomy provides a valid heuristic for classifying temporal illusions, and that neural integration windows for temporal binding typically range between 80 and 200 milliseconds. It is also established that subjective reports of temporal order often diverge from physical stimulus onset asynchronies.

  However, it remains genuinely contested whether the Stalinesque mechanism is the exclusive explanation for these divergences, or whether it generalises to all forms of temporal-order binding such as reverse-phi. Furthermore, the metaphysical conclusion—that these mechanisms eliminate any robust notion of a specious present with intrinsic temporal thickness—is a philosophical interpretation, not an empirical fact. Significant schools of thought, particularly within phenomenological tradition and enactivist cognitive science, maintain that the experience of temporal thickness is a primitive feature of consciousness that cannot be fully reduced to retrospective narrative construction, regardless of the underlying neural latency.
