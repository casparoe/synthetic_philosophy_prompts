      *   **Requirements:**
          *   Lay out distinct precise theses (numbered list).
          *   Classify each thesis (trivial platitude, substantive empirical claim, strong epistemic claim, fully relativist claim).
          *   Distinguish between: production/preservation of sources, narrative framing/emphasis, institutional authority of interpretations, availability of the vanquished's perspective.
          *   Note the relevance of oral history, history from below, subaltern studies, etc.
          *   Evaluate whether each reading supports the colleague's dismissal of the student's reconstruction (based heavily on victors' records).
          *   Conclude with the most common intended meaning and its truth value.
      *   **Tone:** Academic, precise, pedagogical, neutral (disentangling rather than adjudicating the specific dispute, though evaluating the slogan itself).

  2.  **Deconstruct the Slogan ("History is written by the victors"):**
      *   *Literal meaning:* Winners write the books. (False, losers write memoirs too).
      *   *Archival meaning:* Winners control the archives. (Partially true, but losers leave traces).
      *   *Narrative meaning:* Winners set the plot/teleology. (Often true).
      *   *Epistemic meaning:* We can't know the loser's truth. (Too strong).
      *   *Relativist meaning:* There is no truth, only power. (Nietzschean/Foucaultian, but maybe not what the colleague meant).

  3.  **Drafting the Theses (Iterative Process):**

      *   *Thesis 1: The Archival/Source Bias.* Winners control the state archives. Losers' documents get destroyed.
          *   *Classification:* Substantive empirical claim.
          *   *Relevance to Student:* Supports the colleague *if* the student relies *only* on state archives. But oral history counters this.
      *   *Thesis 2: The Narrative Framing.* Even if we have facts, the *story* favors the winner (e.g., "rebellion" vs. "liberation").
          *   *Classification:* Substantive empirical claim (about discourse).
          *   *Relevance:* Undermines the reconstruction's *framing*, not necessarily its facts.
      *   *Thesis 3: The Institutional Authority.* Universities/Publishers favor dominant narratives.
          *   *Classification:* Sociological claim about the discipline.
          *   *Relevance:* Explains why the student might struggle to publish, but doesn't make the history *false*.
      *   *Thesis 4: The Epistemic Barrier.* We literally cannot access the loser's consciousness.
          *   *Classification:* Strong epistemic claim.
          *   *Relevance:* Supports dismissal. But "History from Below" challenges this.
      *   *Thesis 5: The Ontological/Relativist Claim.* Truth is just power. No objective past.
          *   *Classification:* Fully relativist.
          *   *Relevance:* Makes the seminar pointless. Usually not what historians mean.

  4.  **Refining and Polishing (incorporating specific constraints):**
      *   Need to ensure I distinguish between *production/preservation*, *framing*, *authority*, and *availability*.
      *   Need to explicitly mention oral history, subaltern studies, etc.
      *   Need to evaluate the "Colleague's Dismissal" for each point.
      *   Need a conclusion on the "Most Common Intention."

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Item 1 (Archival):* Focus on state records vs. destroyed rebel records. *Verdict:* Partially undermines student. Oral history helps.
      *   *Item 2 (Narrative):* Focus on language (bandit vs. freedom fighter). *Verdict:* Undermines interpretation, not facts.
      *   *Item 3 (Epistemic):* Focus on "we can't know." *Verdict:* Strong support for colleague, but historically defeatist. Subaltern studies says "read against the grain."
      *   *Item 4 (Relativist):* Focus on "no truth." *Verdict:* Supports colleague but abandons history.
      *   *Item 5 (Trivial):* "Winners have more resources." *Verdict:* Platitude, doesn't justify dismissal.

      *Let's consolidate into 4 strong, distinct categories to avoid overlap.*
      1.  **The Archival/Preservation Thesis:** (Sources survive based on power).
      2.  **The Discursive/Framing Thesis:** (Language and categories are imposed by power).
      3.  **The Epistemic/Access Thesis:** (The loser's interiority is lost).
      4.  **The Relativist/Constitutive Thesis:** (Truth is constituted by power).

  6.  **Writing the Handout (incorporating the specific prompts):**
      *   *Header:* Clear title.
