answer: |-
  This is a high-wire act. It's not dumb—it's pedagogically potent—but it is ethically volatile. You are engineering a breach of trust to teach about trust. That requires surgical precision in the execution and radical honesty in the debrief.

  Here is the blueprint to make the epistemology land without blowing up your seminar.

  ### 1. The Accomplice: Script and Choreography
  The goal is **semantic ambiguity**, not physical threat. If students feel physically unsafe, the learning stops and risk management begins.

  *   **The Entrance:** Door opens abruptly. Accomplice stands in the threshold, not entering fully (territorial ambiguity).
  *   **The Prop:** A manila folder (looks official) and a coffee cup (relatable).
  *   **The Dialogue:** Needs to be heard partially, interpreted differently.
      *   *Accomplice:* "You told me it would be handled. Now I'm finding out it's buried? I have a right to know."
      *   *You (Instructor):* "Not here. Not now." (Implies secrecy/guilt).
      *   *Accomplice:* "People need to hear this." (Sounds like a threat to expose, feels like a threat to harm).
      *   *The Physical:* Accomplice gestures sharply with the folder. You reach for your water bottle to take a sip. Your elbow and their hand collide. Bottle falls.
      *   *The Exit:* Accomplice stares at the wet floor, then at you. "Fine. Keep hiding it." Leaves.
  *   **Why this works:** "Hiding/Buried" suggests administrative malfeasance (moral coloring). The bottle collision is ambiguous (who knocked it?). The threat is reputational, but *feels* personal.

  ### 2. Planting the Drift (The Instructor's Role)
  The memory drift won't happen because of the accomplice; it will happen because of *your* reaction. You must model the narrative you want them to adopt.

  *   **The Pause:** After they leave, wait 10 full seconds. Look tired, not angry.
  *   **The Seed:** Say, "I apologize. Sometimes the pressure gets to them." (Implies the accomplice is a distressed student, not a threat).
  *   **The Continuation:** Immediately pivot to the seminar topic. "As I was saying about primary sources..." (Implies the event is secondary, an annoyance).
  *   **The Trap:** If a student asks, "Is everything okay?" say, "It's a grading dispute. It happens." (This cements the "Grade" narrative, even if the accomplice never said the word grade).

  ### 3. The Record (The Video)
  You need the video to undermine the *authority* of the record, not just the memory.

  *   **Setup:** Phone propped visibly on the desk from minute 1. "I'm recording these sessions for students who miss class." (This gives the record legitimacy).
  *   **The Flaw:**
      1.  **Audio:** The audio must cut out exactly during the line "People need to hear this." We hear the accomplice speaking, then silence, then "Fine. Keep hiding it."
      2.  **Visual:** The angle must show the accomplice's pocket. As they turn to leave, a corner of a script slips out.
      3.  **The Glitch:** The timestamp on the video should jump 2 minutes during the incident.
  *   **The Reveal:** Play the video *after* the group consensus is written. Point out the script (proving staging) but highlight the audio gap (proving the record is incomplete).

  ### 4. Timeline (80 Minutes)
  *   **00–10:** Seminar starts. Normalcy established. Phone visible.
  *   **10–12:** **The Event.** (2 mins max).
  *   **12–40:** Seminar continues. Do not reference the event again unless they do. If they do, say "We'll process that later."
  *   **40–50:** **Individual Recall.** 5 mins writing. "Write down exactly what happened, word for word if possible."
  *   **50–60:** **Group Consensus.** Groups of 4 merge accounts into one. "You must agree on every adjective."
  *   **60–65:** **Class Version.** Merge the four group accounts onto the board. (This will be the "Confident/Wrong" version).
  *   **65–70:** **The Record.** Play video. Reveal script (staged). Reveal audio gap (flawed).
  *   **70–75:** **The Decision.** "We must email the minutes of this meeting to the department head. Do we record: A) A student disruption occurred (The Memory), or B) A pedagogical demonstration occurred (The Record)?"
  *   **75–80:** **Debrief.** (See below).

  ### 5. Contingencies: If Nobody Takes the Bait
  *   **If they ignore the accomplice:** You must escalate slightly. Stand up. "We need to pause."
  *   **If they call security:** **STOP THE EXERCISE.** This is the hard limit. If a student reaches for a phone to call 911, you break character immediately. "Stop. This is a class exercise." It ruins the lesson, but safety is paramount.
  *   **If they guess it's fake:** If a student laughs or says "Is this a trick?", acknowledge it. "Treat it as real for the purpose of the exercise."

  ### 6. What Will Go Wrong (First Time)
  1.  **The "Gotcha" Moment:** Students will feel clever noticing the script. They will focus on *your deception* rather than the *epistemology of memory*. They will feel manipulated, not enlightened.
  2.  **The Minutes Decision:** They might vote for a compromise ("A demonstration about disruption occurred"). This avoids the hard choice. You need to force the binary: "The minutes must describe the *event*, not the *intent*."
  3.  **The Audio:** Tech fails. Have a transcript ready that is also "damaged" ([inaudible] at key moments).

  ### 7. What This Activity Cannot Produce
  This activity produces **skepticism**, but it does not produce **trust**.
  It shows that memory is flawed and records are manipulated. It does *not* show how to rebuild knowledge after that collapse.
  *   **You must lecture this:** In the final 10 minutes, you have to tell them: "We cannot live in total skepticism. We choose the story that allows us to function, even knowing it might be wrong. That is the burden of the historian."

  ### 8. The Ethics: Is This Okay?
  **Short answer:** It is borderline. It depends entirely on the debrief.
  **Long answer:** You are inducing stress to teach a point. In many institutions, this requires IRB approval or at least departmental notification.
  **How to handle it:**
  1.  **Warning the Department:** Tell your Chair. "I am doing a high-engagement simulation involving a staged disruption." Do not surprise your administration.
  2.  **The Debrief (Crucial):** You must apologize.
      *   *Say:* "I lied to you. I breached our classroom contract to show you how fragile that contract is. I am sorry for the anxiety that caused."
      *   *The Turn:* "You now know what it feels like when the record contradicts your experience. You now know how easy it is for me, the authority, to shape the truth. That is the position of the historian's subject."
  3.  **Opt-Out:** In future syllabi, note that "experimental pedagogy" is used. For this specific class, offer an alternative assignment for anyone who feels the deception compromised their ability to learn.

  ### 9. The Debrief Map (Last 10 Minutes)
  Do not name the concepts until the end.

  1.  **Minute 75:** Ask: "Why was it so hard to agree on the minutes even after seeing the video?"
      *   *Listen for:* "The video didn't show the whole thing." "We all felt it was aggressive."
  2.  **Minute 77:** Ask: "If we write 'Disruption' in the minutes, it's a lie (it was staged). If we write 'Demo', it erases what you felt (fear/confusion). Which is the greater sin?"
      *   *This is the core tension:* **Ontological Truth vs. Phenomenological Truth.**
  3.  **Minute 79:** Name the distinction.
      *   "This is the fight between **Archive** (the damaged video) and **Memory** (your shared agreement). The Archive claims authority but is fragmented. Memory is cohesive but constructed."
      *   "When a community's story conflicts with the record, correcting the story can destroy the community's ability to make meaning of the event. That is why 'accuracy' is not always the highest value."
  4.  **Minute 80:** Dismiss. "Think about that for next week."

  ### Final Advice
  The success of this session relies on your **humility** at the end. If you come off as the puppet master who taught them a lesson, they will resent you. If you come off as a collaborator who broke the rules to show them the cracks in the floor, they will trust you more.

  Make sure the "Minutes" decision is real. Actually email the minutes they choose to the department (or a colleague). If they find out the minutes were fake too, you lose them forever. The stake must be real.
