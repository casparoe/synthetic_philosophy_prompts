      *   **Interventionist Causation:** Both miss the modern framework (Woodward, Pearl). Causation isn't just "pushing"; it's about *invariance* under intervention. High-level causes are often *more* robust because they abstract away irrelevant physical noise.
      *   **Downward Causation (Constraint):** High-level structures constrain low-level possibilities. The program doesn't push electrons magically, but it *constrains* which physical paths are taken.
      *   **The "Story" isn't Just a Story:** Marcus dismisses the high-level as a "story." But in information theory, the pattern *is* the information. Ignoring the pattern loses the causal structure relevant to the system's function.

