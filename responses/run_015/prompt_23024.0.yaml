prompt: |-
  Two of my teammates got into a long argument at lunch about whether the "high-level" stuff in software actually causes anything, and I honestly can't tell who's right. Marcus said that when we say "the function call caused the crash," that's really just a story we tell ourselves — the actual cause is the voltage changes in the transistors, and the high-level description is just along for the ride. So by his analogy, he thinks our beliefs and desires don't really cause our actions either; they're just riding on top of the brain going through its motions. Dana said that's backwards: the high-level description is the one that actually does the predicting and explaining, and the same chip can run a thousand differnt programs, so it's the program, not the voltage, that's the real cause. Marcus came back and said that the fact that the same hardware can run different programs actually makes the high-level level less fixed, not more, and that Dana had just relabeled the physical cause as a mental one. Dana said no — the mental cause and the physical cause are the same cause seen at different levels of description, so there's no double-counting, and that Marcus was the one who couldn't explain why the program level does any explanatory work at all.

  They're both pretty sharp and neither is backing down, and I keep thinking about it when I'm debugging because I genuinely can't tell which of them is closer to the truth. Can you go through their exchange and say who's right about each specific claim — not just who wins overall — and also point out what, if anything, both of them are missing about how high-level and low-level causation is supposed to actually work?
