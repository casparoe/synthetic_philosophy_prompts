prompt: |-
  So, I had a three-hour argument about pictograms on Sunday with a friend who designs icon sets for a metro system, and I came away wanting something I can actually use at work rather than another round of it. Context: I run a small comms/design team for a health charity. We churn out leaflets, flipcharts and printed cards that go out with SMS reminders, aimed at audiences with low literacy and low numeracy in about five countries. Two-day turnarounds, cheap one-colour printing plus tiny screens on old feature phones, no budget for real user testing beyond asking a couple of community health workers, and everything has to be signed off by a country lead who isn't a designer. So I need something we can run on a Tuesday afternoon, not a design manifesto.

  The fight, briefly: she says good pictograms are essentially self-explanatory and that if an icon needs teaching it's a bad icon. I said that's exactly backwards on the Neurath/Isotype stuff — the whole point was a deliberately tiny taught vocabulary with a deliberately tiny grammar, quantity shown by repeating identical figures rather than by making the figure bigger, flat silhouettes rather than naturalistic detail, and Neurath himself called it a language-like technique, a helping language that was never meant to replace words. She said those simplification rules were 1930s print-technology constraints, not facts about minds. I said no, the memory point is about minds — the Vienna museum's line was roughly that simplified pictures get remembered where accurate figures get forgotten. She came back with: people remember photographs better than line drawings, that's just empirically true, so if recall is your criterion then realism wins. I said a photograph of one particular mother and child is a token, not a type: it individuates, it can't be repeated or counted, and it will read as that family rather than as any caregiver. She said fine, but then be honest that pictures can't carry not, if-then, or maybe, and at that point the picture is doing nothing except pointing at the words. Round four was us both half-agreeing with that and then disagreeing about whether we should just give up and use text for everything. We left it there, neither of us moved, and I've been chewing on it since.

  Can you do something more useful with it than we managed? I want a decision procedure my team can run on every new icon or illustration: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it deliberately hands the decision to a person because it's a values call rather than a factual one — whose body, clothes and house end up as the generic figure is the obvious example, and I don't want the procedure pretending that's solvable by design. It should take the Neurath/Isotype material seriously (repetition over resizing, transformation over reproduction, a symbol set as a taught convention that has to be learned rather than guessed) but translated for someone who has never read a word of Neurath, and honest about what gets lost in the translation. Please settle the two things we were actually arguing about, explicitly: whether adding naturalistic detail to make an icon feel instantly readable is helping or hurting, and wether we should be letting an image generator spit out forty varied versions of a scene when the whole Isotype discipline is a fixed, reusable vocabulary. Then run the procedure on three things on my desk right now: (1) an icon for second dose overdue — a child-and-syringe with something crossed out, which nobody has managed to make legible, because negation; (2) a cholera risk graphic saying risk is high this month, where the temptation is to make the water dirtier and the people more obviously sick; (3) the cover photo everyone loves, a real mother and child at a real clinic, which tested better for recall than anything we've ever made and which our country director will fight to keep. I'd rather know now if the procedure kills (3). And tell me straight where the procedure won't work — my worry is that a taught vocabulary only pays off if the same symbols keep coming back, and most of what we produce is one-off, so tell me if the framework quietly assumes a continuity we dont have. No reading lists or references please, I can't chase them and I don't need them — I need a checklist. British English throughout as well, we're UK-registered and the house style is brutal about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Head of a small comms/design team for a health charity.
      *   **Audience:** Low literacy/numeracy, 5 countries, old feature phones, cheap 1-colour print.
      *   **Constraints:** 2-day turnarounds, no budget for user testing (just CHW feedback), sign-off by non-designer country leads.
      *   **Goal:** A practical decision procedure/checklist for Tuesday afternoon use, not a design manifesto.
      *   **Tone:** British English, direct, pragmatic, no fluff, no reading lists.
      *   **The Conflict:** A debate with a metro icon designer friend about pictograms (Self-explanatory vs. Taught Vocabulary/Isotype).
      *   **Specific Requests:**
          1.  Settle the two specific arguments (Naturalistic detail vs. Simplification; Image generator variety vs. Fixed vocabulary).
          2.  Create a decision procedure (questions in order, pass/fail criteria, where to hand off to humans).
          3.  Run the procedure on three specific examples (Second dose overdue, Cholera risk, Cover photo).
          4.  Address the limitation regarding continuity/one-off production.

  2.  **Deconstruct the Debate (Neurath/Isotype vs. Modern Intuition):**
      *   *Argument 1: Naturalistic Detail.* Friend says realism = better recall. User says realism = token not type, hard to generalise.
      *   *Argument 2: Variety vs. Consistency.* Friend implies variety helps engagement/recall. User argues for fixed vocabulary (Isotype style) for grammar/logic.
      *   *Resolution:* Both are partially right but for different contexts. For *low literacy/numeracy* + *health logic* (counts, negation, risk), Isotype principles win on *clarity of logic*, but realism wins on *emotional engagement/recall* for specific campaigns. The key is distinguishing between *functional symbols* (instructions, data) and *engagement assets* (covers, stories).

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   Needs to be sequential.
      *   Needs "Stop/No" points.
      *   Needs "Human Value Call" points.
      *   Needs to incorporate Isotype principles (repetition, silhouette, taught vocabulary) without requiring a degree in semiotics.
      *   *Step 1: Function.* Is this data/logic or emotion?
      *   *Step 2: Legibility.* Can it survive 1-colour print/tiny screen?
      *   *Step 3: Logic.* Does it show quantity/negation correctly? (Isotype rules).
      *   *Step 4: Cultural Specificity.* Who is depicted? (Value call).
      *   *Step 5: Continuity.* Have we used this before?

  4.  **Addressing the Two Arguments Explicitly:**
      *   *Detail:* For health *instructions*, detail hurts (noise). For *engagement*, detail helps. Don't mix them.
      *   *Variety:* For *systems* (counts, steps), variety breaks the grammar. For *marketing*, variety is fine. AI generation is dangerous for the former, okay for the latter.

  5.  **Running the Procedure on the Three Examples:**
      *   *(1) Second dose overdue (Child + Syringe + Cross):* Negation is hard in Isotype. A cross often means "no entry" or "death". Needs a specific convention. Likely fails Step 3 (Logic).
      *   *(2) Cholera risk (Dirty water/sick people):* Temptation to add detail. Needs to show *change* in risk, not just *state*. Isotype suggests repeating figures for quantity/severity. Realism might stigmatise.
      *   *(3) Cover photo (Real mother/child):* High recall, emotional. Fails Isotype "type" rule, but passes "Engagement" function. Needs to be categorised correctly so it doesn't get confused with instructional icons.

  6.  **Addressing the Continuity Limitation:**
      *   User is right: Isotype pays off over time. If everything is one-off, the "taught vocabulary" cost is too high.
      *   Solution: Hybrid approach. Core vocabulary for recurring concepts (doses, risks, gender), bespoke art for campaigns. Acknowledge the debt.

  7.  **Refining Tone and Language:**
      *   British English (colour, programme, centre, organise, etc.).
      *   Direct, professional, slightly weary but competent (matching the user's vibe).
      *   No academic references.
      *   Format: Clear headings, bullet points, bold text for emphasis.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "AI generator" point? Yes, need to be firm on that for functional icons.
      *   *Check:* Did I handle the "negation" problem? It's a known Isotype weakness. Need to suggest a specific workaround (e.g., separate status icon).
      *   *Check:* Is the checklist actually usable on a Tuesday afternoon? Keep it under 10 steps.
      *   *Check:* Did I respect the "values call" requirement? Ensure the "Who is depicted" question doesn't try to solve it algorithmically.

  9.  **Final Polish:**
      *   Ensure the distinction between *Instructional* (Isotype) and *Engagement* (Photographic) is clear. This resolves the friend's vs. user's debate by assigning domains.
      *   Make sure the "Stop" conditions are clear.
      *   Verify British spelling (colour, symbolise, programme, etc.).

  **(Self-Correction Note on Negation):** Neurath actually struggled with negation. He often used a red cross or a separate "not" symbol. For a health charity, "overdue" isn't strictly "no vaccine", it's "late". A cross might imply "contraindicated". I need to flag this risk in the procedure run.

  **(Self-Correction on Continuity):** The user worries the framework assumes continuity they don't have. I need to validate this. If they don't reuse icons, the "taught" aspect fails. The advice should be: *Force* continuity on the top 10 recurring concepts, allow freedom elsewhere.

  10. **Final Output Generation** (incorporating all above points).
answer: |-
  Here is the decision procedure you asked for, followed by the settlement of your argument and the run-through of your three examples.

  ### Part 1: Settling the Argument

  You were both right, but you were talking about different jobs.

  **1. Naturalistic Detail: Helping or Hurting?**
  *   **Verdict:** It depends on whether the image is *reading* or *feeling*.
  *   **The Rule:** If the image carries logic (counts, steps, warnings, negation), detail hurts. It adds noise that obscures the structure. If the image carries emotion (trust, aspiration, identification), detail helps.
  *   **The Settlement:** Do not use detailed illustrations for instructions. Do not use silhouettes for cover photos. Your friend is right about recall (photos stick), but you are right about logic (silhouettes compute). Never mix the two styles in the same visual hierarchy.

  **2. AI Variety vs. Fixed Vocabulary**
  *   **Verdict:** For health logic, variety is a bug, not a feature.
  *   **The Rule:** If you change the shape of the "child" every time, the user has to re-learn the symbol every time. On a feature phone screen, cognitive load is your enemy.
  *   **The Settlement:** Ban image generators for functional icons. They produce tokens, not types. They will give you forty different children, which means you have no vocabulary, only forty illustrations. Use AI only for engagement assets (covers, banners) where variety is acceptable.

  ***

  ### Part 2: The Tuesday Afternoon Decision Procedure

  This checklist is designed for low-literacy, low-bandwidth health comms. It assumes you have a core library of symbols (people, syringes, water drops) that you *try* to reuse.

  **Step 1: Function Check**
  *   **Question:** Is this image asking the user to *do/count something* or to *feel something*?
  *   **Pass:** "Do/Count" goes to Step 2. "Feel" goes to Step 6.
  *   **Fail:** If you cannot define the function, do not draw it. Write the text.

  **Step 2: The Squint Test (Legibility)**
  *   **Question:** Reduce the image to 10% size and convert to pure black and white. Can you still identify the main object?
  *   **Pass:** Main shape is distinct. Proceed to Step 3.
  *   **Fail:** Details merge into a blob. Simplify until only the outline remains. If it becomes unrecognisable, stop. Use text.

  **Step 3: The Logic Test (Isotype Rules)**
  *   **Question:** Are you showing quantity, time, or negation?
  *   **Rule A (Quantity):** Do not make the icon bigger to show "more". Repeat the icon. (Three drops = three units, not one big drop).
  *   **Rule B (Negation):** Do not rely on a cross-out unless it is a known convention in your country (e.g., road signs). A cross often means "death" or "forbidden" rather than "missing" or "late".
  *   **Pass:** Logic is clear via repetition or standard status indicators. Proceed to Step 4.
  *   **Fail:** You are relying on visual metaphors (e.g., a broken chain for "freedom"). Stop. Use text.

  **Step 4: The Token vs. Type Check**
  *   **Question:** Does this image look like a specific person/place or a general category?
  *   **Pass:** It looks like *any* mother, *any* clinic. Proceed to Step 5.
  *   **Fail:** It has specific jewellery, a specific building style, or specific hair texture that implies a specific region. Remove the detail.

  **Step 5: The Values Handoff (Human Decision)**
  *   **Question:** Whose body is this?
  *   **Action:** This cannot be solved by design. Hand this to your Country Lead.
  *   **Prompt:** "We are using a generic female figure. Does this clothing/hair/skin tone alienate the target region or imply a specific ethnic group we do not intend?"
  *   **Outcome:** If they sign off, you are done. If they object, adjust the generic markers, do not switch to photography (see Step 6).

  **Step 6: The Engagement Exception (Photography/Realism)**
  *   **Question:** Is this a cover image or a story header?
  *   **Rule:** Realism is permitted here for recall and trust.
  *   **Constraint:** Never place instructional text *on top* of this image. Never use this image to convey a number or a warning.
  *   **Outcome:** If it passes the Country Lead's cultural check, it is approved.

  ***

  ### Part 3: Running the Procedure on Your Desk

  Here is what happens when you run your three current problems through the checklist.

  **(1) Second Dose Overdue (Child + Syringe + Cross)**
  *   **Step 1 (Function):** Do/Count. (Instructional).
  *   **Step 2 (Legibility):** Likely fails. A syringe inside a child silhouette crossed out is visual noise at 10% size.
  *   **Step 3 (Logic):** **FAIL.** Negation is the weak point of pictograms. A cross over a syringe usually means "Do Not Vaccinate" (contraindication), not "Missed Vaccination".
  *   **Action:** Kill the icon. Do not try to fix the drawing.
  *   **Solution:** Use a status colour (e.g., Red border) + Text "Late". Or use a calendar icon with a specific date crossed out, separate from the medical icon. Do not combine "Child" + "Syringe" + "Negative". It is too many logical operators for one glyph.

  **(2) Cholera Risk Graphic (Risk High This Month)**
  *   **Step 1 (Function):** Do/Count (Risk assessment).
  *   **Step 2 (Legibility):** "Dirtier water" fails. Mud looks like noise on a feature phone.
  *   **Step 3 (Logic):** **FAIL.** Making people "more obviously sick" is a token, not a type. It relies on realism.
  *   **Action:** Apply Isotype Rule A (Quantity).
  *   **Solution:** Do not change the *look* of the water or the people. Change the *number* of risk indicators.
      *   Low Risk: 1 water drop icon.
      *   High Risk: 3 water drop icons (stacked or lined up).
      *   Keep the human figure identical in both. The variable is the *count* of the hazard, not the *state* of the victim. This prevents stigma and works in one colour.

  **(3) Cover Photo (Real Mother and Child)**
  *   **Step 1 (Function):** Feel. (Engagement).
  *   **Step 6 (Engagement Exception):** **PASS.**
  *   **Constraint Check:** Is there instructional text on top? If no, it is safe.
  *   **Values Handoff:** Your Country Director wants it. It tests better for recall.
  *   **Action:** Keep it. But tag it internally as "Engagement Asset". It must never be used in a legend, a key, or next to a dosage instruction. It is for trust, not data.
  *   **Verdict:** The procedure does *not* kill this, provided you strictly segregate it from your instructional icons. Do not let this photo become the "icon" for "Mother". Keep the silhouette for the logic, keep the photo for the cover.

  ***

  ### Part 4: Where This Procedure Will Fail You

  You are correct to worry about continuity. The Isotype method relies on compound interest. You pay the cost of teaching the user the symbol once, and you withdraw the clarity over hundreds of leaflets. If you only produce one-offs, you are paying the teaching cost every time with no return.

  **The Limitation:**
  If you do not reuse the same "Child" silhouette, the same "Water Drop", and the same "Syringe" across at least 60% of your output, Step 3 (Logic) will not work. Users will not learn the grammar if the vocabulary keeps changing.

  **The Workaround:**
  You cannot afford a full Isotype system. You need a **Hybrid Core**.
  1.  **Identify your Top 10:** Pick the ten concepts you use most (e.g., Mother, Child, Syringe, Water, Pill, Warning, Home, Clinic, Money, Time).
  2.  **Freeze Them:** Design these once. Get the Country Leads to sign them off as the "Standard Library".
  3.  **Enforce Reuse:** Never redraw these ten. Even if the style doesn't perfectly match the new leaflet, use the old icon. Consistency trumps aesthetic unity.
  4.  **Everything Else:** For the remaining 90% of one-off concepts, use the Procedure above, but accept that they will be less efficient.

  **Final Note on the "Values Call":**
  The procedure hands the "Whose body?" question to the Country Lead. This is deliberate. Design cannot solve representation. If the Lead says "That headscarf is for Region A, we are in Region B," you change the headscarf. If they say "We want to aspire to Region A," you keep it. That is a policy decision, not a design one. Do not let the procedure pretend it can optimise dignity.

  Stick to the checklist. If it fails Step 3, do not argue with the drawing. Change the method.
