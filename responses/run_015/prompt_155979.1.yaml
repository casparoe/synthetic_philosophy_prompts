          *   Gift Shop: "Cantor Dust" kit (3 iterations, claims uncountable set/zero length, physically finite).
      *   **The Reality (Institutional/Physical):**
          *   Occupancy/Fire/Safety: Treats rooms/visitors as strictly finite.
