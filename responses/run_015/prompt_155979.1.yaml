      *   **Implicit Metaphysics (Actual vs. Potential):**
          *   The signage explicitly commits to *Actualism*. It treats $\aleph_0$ as a completed totality ("actually infinite collection").
          *   However, the physical mechanism is *Potentialist* (a loop that *looks* infinite but isn't).
