      *   **Tension between Protocols and Pedagogy:**
          *   *Safety/Budget:* Rigorously Aristotelian/Finitist. You cannot have infinite people in a room (fire code). You cannot budget for infinite growth.
          *   *Pedagogy:* Cantorian Actualist.
          *   *Conflict:* This is a category error. The institution manages *tokens* (physical people/rooms) while teaching about *types* (mathematical sets). The tension is manageable because everyone knows the building isn't actually infinite. It's a "willing suspension of disbelief." However, strictly speaking, the institution *denies* the reality of what it teaches in its operational protocols.

      *   **Reforming for Consistent Potentialism/Finitism:**
