answer: |-
  You have put your finger on the central tension of microhistory. The specific example you are referencing is almost certainly Carlo Ginzburg's *The Cheese and the Worms* (1976), regarding Menocchio, the miller interrogated by the Inquisition.

  Here is the breakdown of the terminology, the methodological defense, and the logical critique.

  ### 1. The Established Term: "The Exceptional Normal"
  There is an established name for this move, though it was originally coined as a methodological justification rather than a critique. In 1977, the Italian microhistorian **Edoardo Grendi** coined the term **"The Exceptional Normal"** (*il normale eccezionale*).

  Grendi argued that standard statistical history misses the structural rules of a society by focusing on averages. He posited that exceptional cases (like a miller with heretical cosmology) reveal the *boundaries* and *potentialities* of the system better than the norm. In this view, the outlier is not a statistical error; it is a stress test that reveals the hidden architecture of "ordinary" mentalities.

  So, when a microhistorian does this, they are not claiming the person is statistically average; they are claiming the person is **metonymically representative**. They argue that the *structures* of thought (the "mental tools") are common, even if the *construction* built with them is unique.

  ### 2. The Critique: "The Representativeness Problem"
  While "The Exceptional Normal" is the name of the method, the critique you are describing is usually referred to in historiography as **"The Problem of Representativeness"** or **"The Metonymic Leap."**

  There isn't a single Latin-named fallacy for it (like *post hoc ergo propter hoc*), but in critical theory and history of science, it is often categorized as a form of **Metonymic Fallacy**. This occurs when a part (the miller) is used to stand for the whole (peasant mentality) without sufficient warrant that the part shares the essential qualities of the whole.

  Some critics, such as David Harris Sacks and Roger Chartier, have explicitly attacked this move. They argue that Ginzburg turned Menocchio into a "representative anomaly," which is logically unstable.

  ### 3. If we need a new name: "Deviant Metonymy"
  If you are looking for a term to describe the *logical error* specifically (rather than the method), the most precise label would be **"Deviant Metonymy"** or **"The Inquisitorial Mirror Fallacy."**

  *   **Deviant Metonymy:** Using a deviant case to define the normative whole.
  *   **Inquisitorial Mirror Fallacy:** Assuming the record of the deviant reflects the reality of the community, rather than reflecting the anxieties of the institution (the Inquisition) that created the record.

  ### 4. Where exactly does it go wrong?
  You asked where the logic fails. It typically breaks down in three specific places:

  **A. The Archive Filter (Source Creation)**
  As you noted, the sample is filtered. But it is worse than that: the source is *co-created* by the interrogator. Menocchio's cosmology was articulated under duress, translated by scribes, and filtered through the theological categories of the inquisitors. To treat the transcript as a transparent window into "peasant mentality" ignores that it is also a window into "Inquisitorial expectation." The record exists *because* he was weird, but the *content* of the record is shaped by the institution catching him.

  **B. The Literacy Gap**
  This is the specific flaw in *The Cheese and the Worms*. Menocchio was literate and had access to books (the Bible, travel narratives, etc.). The vast majority of the "ordinary peasant mentality" Ginzburg hopes to reveal was illiterate. Generalizing from a reading peasant to a non-reading peasantry is a category error. It confuses *popular culture* with *plebeian culture*.

  **C. Possibility vs. Prevalence**
  This is the subtlest logical slip. Microhistorians often defend themselves by saying, "I am not claiming all peasants thought this, only that they *could*."
  *   **The Move:** Proving the *existence* of a mental possibility.
  *   **The Slip:** Implicitly suggesting the *prevalence* of that mental structure.
  By focusing on the outlier, the historian proves that the dominant culture was not hegemonic (which is valuable). However, they often slide into implying that this resistance was widespread, when the only evidence is that it was *possible*.

  ### Summary
  *   **Methodological Name:** The Exceptional Normal (*il normale eccezionale*).
  *   **Critical Name:** The Representativeness Problem / Metonymic Overreach.
  *   **Proposed Fallacy Name:** Deviant Metonymy.
  *   **The Fatal Flaw:** Conflating the *survival* of a record with the *typicality* of the thought, and ignoring that the "deviance" was often produced by the very power structure recording it.
