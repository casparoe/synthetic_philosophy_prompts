answer: |-
  Here is the breakdown you asked for. You can hand this to your mate and tell him to read it before he buys the next round.

  The core of your dispute is whether "saving locality" is a substantive physical victory or a semantic trick. Your mate's position is technically coherent, but it relies on shifting the definition of what counts as a "physical state" in a way that smuggles non-locality back in through the ontology. He is right that Bell's theorem doesn't rule out his specific model, but he is wrong to think that means the model is "local" in any sense that would satisfy Einstein.

  Let's start with the derivation, as you requested. Bell's inequality follows from a factorisability condition on the joint probability of outcomes $A$ and $B$, given settings $x$ and $y$ and a hidden variable state $\lambda$:

  $$P(A, B | x, y, \lambda) = P(A | x, \lambda) \cdot P(B | y, \lambda)$$

  This equation encodes the idea that once you know the complete state of the past ($\lambda$), what happens at Alice's wing shouldn't depend on Bob's setting or Bob's outcome. We can split this into two conditions: Parameter Independence (Alice's probabilities don't depend on Bob's setting) and Outcome Independence (Alice's probabilities don't depend on Bob's outcome).

  Your mate's move is not to deny Outcome Independence. It is more radical. He is denying that the terms $A$ and $B$ refer to unique events at all. In standard probability theory, $A$ and $B$ are single-valued random variables. In the Everettian picture, upon measurement, the universe splits into a superposition of $(A_1, B_1)$ and $(A_2, B_2)$. There is no single fact of the matter about "A" until you specify which branch you are on. Therefore, the expression $P(A, B | x, y, \lambda)$ is category-mistaken. You cannot write a joint probability distribution over unique outcomes if unique outcomes do not exist.

  So, to answer your first point: The derivation breaks because the sample space is ill-defined. It is not that Outcome Independence is false; it is that the variables required to state it are absent. Your mate is trading on the denial of "Single Outcome Definiteness." This allows him to keep Parameter Independence (no signalling) and Setting Independence (no conspiracy), but only by abandoning the classical framework in which Bell's theorem is formulated.

  Now, let's press your specific worry about the "Local-Branching-plus-Branch-Weights" (LBW) package with "delayed soldering." This is the crux of the matter. Your mate wants to say Alice branches locally, Bob branches locally, and they only match up when they compare notes.

  Here is the problem: The correlations in a Bell test (like CHSH) are precise and depend on the relative angles of the settings. If Alice and Bob branch independently, there are four sets of branches: (Up, Up), (Up, Down), (Down, Up), (Down, Down). For the quantum predictions to hold, the "weights" (squared amplitudes) of these branches must match the cosine-squared dependence of the angle difference.

  If the branching is truly local, the weight of Alice's "Up" branch cannot depend on Bob's setting. But the *correlation* between Alice's "Up" and Bob's "Up" does depend on the relative settings. In the LBW model, this correlation is encoded in the global wavefunction *before* the measurement even happens. The wavefunction is an entangled state.

  This brings us to the "soldering." If the soldering is just the agents meeting and comparing notes, the correlation must already exist in the structure of the branches they occupy. But where does that structure come from? It comes from the unitary evolution of the global wavefunction. And here is the rub: the wavefunction of an entangled pair lives on Configuration Space, not 3D physical space. A point in configuration space specifies the properties of *both* particles simultaneously.

  So, is the process local? The dynamics (the Schrödinger equation) are local in configuration space. But configuration space is not physical space. If you demand that physical reality be constituted by fields in 3D space (separability), then the entangled wavefunction is a non-local object. Your mate claims the "spookiness" is relocated. He is right. It is relocated into the global amplitude field. The "soldering rule" isn't a dynamic process that happens later; it is a structural feature of the state that was non-separable from the start. To say this is "local" requires you to accept that a field on a high-dimensional abstract space counts as a local beable. Most physicists would say that is a dodge. You haven't removed action-at-a-distance; you've just redefined "distance" to make the action look local.

  This leads to your third point: What does "local" mean? There are three competing definitions here.

  1.  **Signal Locality:** You cannot send a message faster than light. Everett saves this. No experiment can detect the branching, so no FTL signalling is possible.
  2.  **Bell's Local Causality:** Events in a region are determined by variables in the past light cone. Everett violates this *if* you treat branch outcomes as events. If you treat the wavefunction as the only event, it satisfies a version of this, but only because the wavefunction is non-separable.
  3.  **Separability:** The state of the whole is determined by the states of the parts. Everett violates this hard. An entangled state cannot be reduced to the state of particle A and the state of particle B.

  Bell's argument was originally motivated by a desire for Separability and Local Causality. He wanted a world where things happen here because of things nearby there. Your mate secures Signal Locality, which is all relativity strictly requires, but he sacrifices Separability. The debate is partly verbal—if you define "local" as "no signalling," your mate wins. But if you define "local" as "no holistic states spanning vast distances," your mate loses. Given that Bell was worried about "spooky action at a distance," and an entangled wavefunction is exactly a spooky holistic object, your mate is winning the battle but losing the war. He has removed the *dynamics* of non-locality but kept the *ontology* of non-locality.

  Compare this to Superdeterminism, as you asked. The Superdeterminist keeps single outcomes and separability but drops Setting Independence. They say the hidden variables $\lambda$ conspire to correlate with the settings $x$ and $y$.

  Structurally, both views are "locality preservation strategies" that pay a heavy tax. The Superdeterminist pays with the scientific method: if settings are correlated with hidden variables, you can never trust that your experiment is a fair test of nature. It implies a cosmic conspiracy that undermines induction.

  The Everettian pays with ontology: the universe is vastly larger and more complex than it appears, and "you" are not a unique entity.

  Which is more respectable? Everett is arguably better for science. It preserves the ability to do experiments and trust probabilities (via the Born rule). Superdeterminism makes science impossible in principle. However, regarding locality specifically, they are in the same boat. Both rely on a feature of the universe that is invisible to local inspection to explain the correlations. For the Superdeterminist, it's the past correlation of settings and states. For the Everettian, it's the global structure of the wavefunction. Neither offers a mechanism where Alice's result is produced solely by local stuff at Alice's end in a way that is independent of the global context.

  So, here is the verdict.

  Your mate is right that Bell's theorem, strictly formulated, assumes single outcomes. If you deny single outcomes, the inequality does not follow. He is not mathematically wrong.

  However, he is kidding himself if he thinks this restores a "local" world in the sense that motivated the debate. He has traded non-local dynamics for a non-separable ontology. The correlations are not produced by local interactions; they are pre-encoded in a global object (the wavefunction) that does not live in local space. The "delayed soldering" is just the revelation of a structure that was already non-locally connected.

  If your goal is to save Relativity (no signalling), he succeeds. If your goal is to save Einstein's dream of a separable, local reality where things have definite properties independent of the whole, he fails. He hasn't killed the ghost of non-locality; he's just given it a bigger house to live in. Tell him he can keep his locality, provided he admits it's the locality of a ghost.
