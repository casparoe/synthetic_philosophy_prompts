      *   *Task 4: Comparison with Superdeterminism.*
          *   Superdeterminism: Keeps single outcomes, keeps locality, drops Statistical Independence (Setting Independence). $\lambda$ correlates with $x, y$.
          *   Everett: Keeps locality (dynamics), keeps Statistical Independence (settings are free relative to state), drops Single Outcomes.
          *   Respectability: Superdeterminism kills science (can't trust experiments). Everett keeps science intact but costs ontology (many worlds).
          *   Everett is arguably more "respectable" because it doesn't undermine the scientific method, just our intuition of uniqueness.

      *   *Task 5: Verdict.*
          *   Mate is half-right but glossing over the cost.
          *   He is right that Bell's inequality strictly assumes single outcomes.
