  2.  **Deconstruct the Arguments:**

      *   *Task 1: The Derivation Break.*
          *   Bell's inequality relies on $P(A, B | x, y, \lambda) = P(A | x, \lambda) P(B | y, \lambda)$. This is Factorisability.
          *   Factorisability = Parameter Independence (PI) + Outcome Independence (OI).
          *   PI: $P(A | x, y, \lambda) = P(A | x, \lambda)$. (Bob's setting doesn't change Alice's odds).
          *   OI: $P(A, B | x, y, \lambda) = P(A | x, y, \lambda) P(B | x, y, \lambda)$. (Given $\lambda$, outcomes are independent).
          *   Everettian move: There is no single $A$ or $B$. There is a superposition of outcomes. So $P(A,B)$ isn't defined in the standard way *before* branching or *across* branches.
          *   Actually, the deeper issue is *Local Causality*. Bell's condition is that events in a region depend only on the past light cone.
          *   The Everettian claim is that the wavefunction evolves locally (Schrödinger equation is local). The "outcomes" are just relative states.
          *   Naming the move: It's denying the *uniqueness of outcomes*, which undermines the definition of the random variables $A$ and $B$ in the classical probability space. It's not just denying OI; it's denying the sample space structure required to formulate OI.

