      *   **Tone:** Fairly informal, argumentative but precise (like a debate between mates).
      *   **Length:** 1200–1500 words.
      *   **Constraints:** No citations/reading lists, light math (factorisability condition okay, no long derivations), reach a definite verdict (no fence-sitting).
      *   **User's Position:** Skeptical of the Everettian claim that they save locality. Suspects the "spookiness" is just relocated (into "soldering" or the global wavefunction).
      *   **Mate's Position:** Everettian. Claims Bell's theorem requires single outcomes. Drop single outcomes (keep locality + statistical independence), and the factorisability condition doesn't apply.
      *   **Specific Tasks:**
          1.  Pinpoint where the derivation breaks (Parameter/Outcome/Setting Independence). Name the move properly.
          2.  Assess the "Local-Branching-plus-Branch-Weights" (LBW) with "Delayed Soldering" model. Does this hide non-locality in the soldering or the global state?
