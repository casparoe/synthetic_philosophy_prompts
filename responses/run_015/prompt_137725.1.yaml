      *   *Question to Punt 1:* **Alliance vs. Non-Alignment.**
          *   *Why:* Manpower is a *tool* of strategy. You can't decide the tool before the job. The report should say "If Non-Aligned, we need X. If Aligned, we need Y."
      *   *Question to Punt 2:* **Absolute Cost Efficiency.**
          *   *Why:* User is right. It's distributional. Focus on *affordability* within the budget, not GDP efficiency.
      *   *Critique of User's "Jury" Theory:* It's true, but it's a *feature*, not a *goal*. The goal is defense. The jury effect is a side benefit (or cost). Don't base the whole report on it.
