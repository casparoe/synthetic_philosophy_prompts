prompt: |-
  I run this little repair cafe out of my garage every saturday, and lately we've been getting into these situtions where a fix just keeps getting worse and we can't tell if we should bail or keep going. I was reading about that dollar auction game where people bid on a dollar bill and end up spending like $20 just so they don't lose, and it clicked that's exactly what happens when we've already sunk three weekends into a broken dishwasher — we keep going not because it makes sense but because quitting feels like admitting defeat in front of everyone. But I also realized it's not just about the parts we've already bought; it's about not wanting to look like the person who gives up when other volunteers are watching, which feels like the same social trap as the auction, plus there's the thing where we've already told the owner we'll have it done by next week.

  So I want an actual decision procedure me and my co-volunteers can run when we're standing around a dead appliance, something we can do in five minutes without pulling out a textbook. It needs the questions in order, what counts as a yes or no at each step, where it just stops and says quit, and where we have to actually talk about values because it's not a math problem anymore. The hard parts I need it to cover are: when the owner is standing right there expecting us to finish, when we've already promised people we'll get it done, when quitting means eating $40 in donated parts, and when there's that weird peer-pressure thing where nobody wants to be the first one to suggest giving up. Please build it out of whatever that auction theory actually says about escalation, but keep it usable by people who don't know the theory, and flag the spots where no checklist can decide for us — especially around whether it's okay to break a promise if the math says quit.

  Then run it on two cases we're facing: first, a washing machine where we've already replaced the motor and the drum seal but now the control board is dead and the replacement is backordered for three months; second, an old tube radio some guy brought in because his dad built it — we've put in about 6 hours and cheap parts but it's still silent, and he's coming back next saturday expecting music. Show me where the procedure gives us an answer we won't like, and be honest about which steps are just judgment calls dressed up as rules.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer-run repair cafe in a garage.
      *   **Problem:** Sunk cost fallacy/escalation of commitment (Dollar Auction dynamic) leading to wasted time, money, and social awkwardness.
      *   **Goal:** A 5-minute decision procedure (checklist/flowchart style) for volunteers to decide whether to continue or quit a repair.
      *   **Key Constraints:**
          *   Must address social pressure (owner present, promises made, peer pressure among volunteers).
          *   Must address financial sunk costs (donated parts).
          *   Must be based on escalation of commitment theory (Dollar Auction logic) but usable by laypeople.
          *   Must explicitly flag where judgment is required (no algorithmic solution).
          *   Must apply the procedure to two specific cases (Washing Machine, Tube Radio).
          *   Must be honest about "unpleasant answers" and "judgment calls dressed as rules."

  2.  **Deconstruct the Theory (Dollar Auction/Escalation of Commitment):**
      *   *Core Mechanism:* Rational actors make irrational decisions to justify past investments (time, money, reputation).
      *   *Key Drivers:*
          *   Sunk Costs (irrelevant to future utility but psychologically heavy).
          *   Social Pressure (saving face, not letting others down).
          *   Uncertainty (hope that *one more try* will fix it).
          *   Competition/Ego (not wanting to be the "quitter").
      *   *Solution Strategy:* Pre-commitment, externalizing the decision, separating past form future, redefining "success."

  3.  **Drafting the Decision Procedure (The "Stop-Loss Protocol"):**
      *   *Name:* Needs to sound practical, not academic. "The 5-Minute Stop-Loss."
      *   *Structure:* Sequential questions. Yes/No paths.
      *   *Step 1: The Future Cost Check.* Ignore what's spent. What's *next*? (Theory: Sunk costs are irrelevant).
      *   *Step 2: The Probability Check.* Is success likely? (Theory: Expectation value).
      *   *Step 3: The Social/Owner Check.* This is the hard part. How to handle the promise? (Theory: Reputation management vs. Escalation).
      *   *Step 4: The Volunteer Check.* Addressing peer pressure. (Theory: Diffusion of responsibility).
      *   *Step 5: The Hard Stop.* Where the math says quit, but values might say stay.

      *Refining the Steps for the User's Constraints:*
      *   Need to explicitly handle the "Owner is watching" scenario.
      *   Need to handle the "Broken Promise" dilemma.
      *   Need to flag the "Judgment Call" zones.

  4.  **Developing the Two Cases:**
      *   *Case 1: Washing Machine.*
          *   Invested: Motor, Seal, Time.
          *   New Issue: Control Board.
          *   Constraint: Backordered 3 months.
          *   Likely Outcome: Quit (Time cost too high, utility low).
      *   *Case 2: Tube Radio.*
          *   Invested: 6 hours, cheap parts.
          *   Sentimental Value: High (Dad built it).
          *   Constraint: Owner expecting music next Saturday.
          *   Likely Outcome: Tricky. Math says quit (6+ hours is huge for a cafe), Value says maybe try once more? Or refer to pro?

  5.  **Addressing the "Hard Parts" (Ethical/Social Nuance):**
      *   *Breaking Promises:* The procedure needs to acknowledge that keeping a bad promise is worse than breaking it early.
      *   *Peer Pressure:* Needs a mechanism to allow *anyone* to call "Stop" without blame.
      *   *Owner Presence:* Needs a script for how to tell them.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the insight (Dollar Auction). Validate the feeling.
      *   *The Protocol:* "The 5-Minute Stop-Loss."
          *   *Rule 0:* The "New Money" Rule (Sunk costs don't count).
          *   *Step 1:* Future Cost vs. Value.
          *   *Step 2:* Probability of Success.
          *   *Step 3:* The Promise & The Person (The Ethical Flag).
          *   *Step 4:* The Volunteer Veto (The Social Flag).
      *   *The "Judgment Flags":* Explicitly mark where the checklist ends and human wisdom begins.
      *   *Case Studies:* Run the protocol.
          *   *Washer:* Clear quit.
          *   *Radio:* Ambiguous. Highlights the tension between efficiency and mission.
      *   *Conclusion:* Reiterate that the goal is sustainability, not perfection.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is it too cold?
      *   *Fix:* Add language about "Repair Cafe Mission." It's not just about efficiency; it's about community. But efficiency keeps the community alive.
      *   *Critique:* Did I address the "Owner Standing There" issue?
      *   *Fix:* Add a specific script in Step 3.
      *   *Critique:* Did I explain *why* the Dollar Auction matters?
      *   *Fix:* Briefly explain the "Trap" in the intro so the rules make sense.
      *   *Critique:* The prompt asks to flag where "no checklist can decide."
      *   *Fix:* Use bold warnings like **[JUDGMENT ZONE]**.

  8.  **Final Polish:** Ensure tone is empathetic but firm. The user is looking for relief from the anxiety of decision-making, so the tool should feel authoritative but flexible. (Make sure to explicitly mention the $40 parts and the 3-month wait in the examples).

  9.  *(Final check against prompt requirements)*:
      *   Decision procedure? Yes.
      *   5 minutes? Yes.
      *   Questions in order? Yes.
      *   Stop/Quit points? Yes.
      *   Values talk flagged? Yes.
      *   Cover owner present, promises, parts cost, peer pressure? Yes.
      *   Based on auction theory? Yes (Sunk cost, escalation).
      *   Run on two cases? Yes.
      *   Show unpleasant answers? Yes.
      *   Honest about judgment calls? Yes.

  10. **Generate Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic **Escalation of Commitment** trap, exactly as you identified with the Dollar Auction. In that game, rational people bid $20 for a dollar because the *pain of losing the previous bid* outweighs the *cost of the next bid*. In your garage, the "bid" is your weekend, and the "prize" is not looking like a failure.

  To break this, you need a **Pre-Commitment Device**. You cannot make this decision in the heat of the moment when ego and social pressure are high. You need a protocol that externalizes the blame. The checklist isn't the boss; the *theory* is the boss.

  Here is the **5-Minute Stop-Loss Protocol**. It is designed to be printed and taped to the workbench.

  ***

  # The Repair Cafe Stop-Loss Protocol

  **Rule 0: The Sunk Cost Ban**
  Before starting, agree verbally: *"Money and time already spent do not exist. We only decide on future time and money."*
  *(If anyone mentions how many hours you've already put in, they owe a donut to the coffee fund. This resets the Dollar Auction.)*

  ### Step 1: The Future Cost Test (The Math)
  **Question:** To finish this repair, will we need to spend more than **$50** in parts OR more than **3 hours** of volunteer labor *from this moment forward*?
  *   **YES:** → Go to Step 2.
  *   **NO:** → **CONTINUE.** (The risk is low enough to absorb).

  ### Step 2: The Probability Test (The Reality)
  **Question:** Based on what we know *right now* (no hoping for miracles), is the likelihood of success greater than **50%**?
  *   **NO:** → **STOP. DECLARE IT A "PARTS DONOR."**
      *   *Why:* In the Dollar Auction, this is where you fold. Losing 50 cents is better than losing $20.
  *   **YES:** → Go to Step 3.

  ### Step 3: The Timeline & Utility Test (The Value)
  **Question:** If we succeed, will the item be usable within **2 weeks**, and is the item worth more than the cost of a functional used replacement?
  *   **NO:** → **STOP. DECLARE IT A "LEARNING PROJECT."**
      *   *Why:* A dishwasher fixed in 3 months is useless to a family washing dishes by hand now.
  *   **YES:** → Go to Step 4.

  ### Step 4: The Promise & Pressure Test (The Ethics) **[JUDGMENT ZONE]**
  **Context:** The owner is waiting, or we promised a date.
  **Question:** Is keeping this promise going to cost us the ability to fix *other* people's items (opportunity cost), or damage our reputation for honesty if we fail later?
  *   **YES (We are overcommitted):** → **STOP. INITIATE "HONESTY CONVERSATION."**
      *   *Script:* "We have hit a wall. Continuing risks breaking it further. We recommend stopping now to save the unit, rather than risking a total loss later."
  *   **NO (We have capacity):** → Go to Step 5.

  ### Step 5: The Volunteer Veto (The Social Trap)
  **Action:** One volunteer (rotate this role weekly) asks the room: *"Does anyone feel pressure to continue just because we don't want to quit?"*
  *   **IF ANYONE SAYS YES:** → **STOP.**
      *   *Why:* This is the Dollar Auction trigger. If the motivation is ego, not engineering, the repair is already failed.
  *   **IF EVERYONE SAYS NO:** → **CONTINUE.**

  ***

  ## Where The Checklist Ends and Values Begin

  You asked to flag where no checklist can decide. That is **Step 4**.

  Math can tell you the part is backordered for 3 months. Math cannot tell you if breaking a promise to a grieving son about his father's radio is worth the "efficiency" of your garage.
  *   **The Trap:** If you always keep promises, you go bankrupt on time.
  *   **The Trap:** If you never keep promises, you become a hobby club, not a service.

  **The Rule of Thumb:** You are allowed to break a promise if keeping it requires *escalating risk*. Telling an owner "We can't fix it" is a small disappointment. Telling an owner "We broke it further trying to keep our promise" is a betrayal. **Prioritize the integrity of the object over the timeline of the promise.**

  ***

  ## Running the Cases

  Here is how this plays out in your garage, using the protocol strictly.

  ### Case 1: The Washing Machine
  *   **Status:** Motor & Seal replaced. Control board dead. Part backordered 3 months.
  *   **Step 1 (Future Cost):** **YES.** 3 months wait is effectively infinite labor (tracking, storing) + cost of board.
  *   **Step 2 (Probability):** **YES.** If the board arrives, it will likely work.
  *   **Step 3 (Timeline/Utility):** **NO.** A dishwasher fixed in 3 months is useless. A washing machine fixed in 3 months is a hardship.
  *   **Decision:** **STOP. DECLARE IT A "PARTS DONOR."**
  *   **The Unpleasant Answer:** You have to tell the owner, "We cannot fix this." You have to eat the $40 in parts you already bought.
  *   **Why this hurts:** It feels like waste.
  *   **Why it's right:** In the Dollar Auction, the $40 is the 50-cent bid you already lost. The 3 months is the $20 bid you are about to make. Do not make the bid. The parts you bought can save two other machines. That is the only way to honor the donation.

  ### Case 2: The Tube Radio
  *   **Status:** 6 hours in. Cheap parts used. Still silent. Owner wants it next Saturday. Sentimental value (Dad built it).
  *   **Step 1 (Future Cost):** **YES.** You have already blown past the 3-hour limit. To continue is to invest *more* future time.
  *   **Step 2 (Probability):** **NO.** 6 hours of troubleshooting on a silent tube amp usually means a transformer issue or a complex circuit fault. Success probability is <50% without specialized equipment.
  *   **Decision:** **STOP.**
  *   **The Unpleasant Answer:** The owner comes next Saturday expecting music. You have to hand him back a silent box.
  *   **The Judgment Call (Step 4 Override):**
      *   *Strict Math:* Quit.
      *   *Values Check:* This is a "Heritage Item." The value isn't utility (listening to radio); the value is memory.
      *   *Modified Decision:* **STOP REPAIRING. START REFERING.**
      *   *Action:* Do not promise music for Saturday. Tell the owner: "We have exhausted our diagnostic capability. We will not touch it further because we risk damaging the original wiring. However, we will give you the name of a specialist restorer."
      *   *Why:* This avoids the Dollar Auction. You aren't bidding more time hoping for a miracle. You are protecting the object from your own desperation.

  ## Honest Assessment of the Procedure

  **1. The "Donut Rule" (Rule 0) is Critical.**
  The Dollar Auction works because we frame the past investment as a *loss* we must recover. By making it a joke (owe a donut), you socially sanitize the admission of sunk costs. It makes it safe to say, "I forgot Rule 0," which is code for "I'm falling for the trap."

  **2. Step 5 is the Hardest.**
  Asking "Is anyone feeling peer pressure?" requires psychological safety. If your lead volunteer is a stubborn perfectionist, no one will say yes.
  *   *Fix:* The "Stop-Loss Officer" role must rotate. If the same person runs the checklist every week, they become the enforcer. If it rotates, it's a community standard.

  **3. The "Parts Cost" Fallacy.**
  You mentioned eating $40 in donated parts. The protocol treats this as irrelevant (Rule 0). This will feel wrong.
  *   *Reframing:* Those parts aren't "eaten." They were "spent on diagnostics." You bought the knowledge that the motor wasn't the problem. That knowledge has value, even if the machine is dead. If you keep going, you aren't saving the parts; you are gambling with *new* parts.

  **4. Where the Checklist Lies.**
  Step 4 is where you will struggle. The checklist says "Break the promise if overcommitted." But if you break too many promises, people stop bringing items.
  *   *The Fix:* You need a **Triage Phase**. Don't accept the item until you have done a 15-minute diagnostic.
      *   *New Rule:* "No item enters the 'Active Repair' queue without a 15-minute diagnostic."
      *   This moves the "Quit" decision to *before* the promise is made. It is easier to say "We can't take this in" on Saturday morning than "We give up" three Saturdays later.

  ## Summary for Your Volunteers

  Print this. Tape it up.

  1.  **Past is Dead:** Don't count hours spent. Count hours *needed*.
  2.  **Probability > Hope:** If it's less than 50/50, it's a learning project, not a repair.
  3.  **Honesty > Heroics:** It is better to be the volunteer who saved an object from destruction than the one who destroyed it trying to be a hero.
  4.  **The Veto:** Anyone can call "Stop" without shame. If they do, they aren't quitting; they are saving the group from the Dollar Auction.

  The goal of the Repair Cafe is not to fix every object. It is to sustain the community that fixes objects. Sometimes, saving the community means letting the object go.
