answer: |-
  This is a classic move in analytic epistemology: using a high-level slogan to bypass a nuanced counterexample. Your intuition is correct—the slogan is doing too much work because it conflates distinct claims about definition, normativity, and value theory.

  Here is a conceptual map breaking down the precise theses hidden inside "Truth is the only intrinsic epistemic value, all the rest is just instrumental," evaluated by plausibility and applied to your quantum chemist case.

  ### 1. The Definitional (Stipulative) Thesis
  **The Claim:** The term "epistemic value" is *defined* as "value derived from truth." Therefore, by linguistic convention, nothing else can be an intrinsic epistemic value.
  *   **Status:** **Trivial.** It is true by definition, but only because it restricts the meaning of the word "epistemic" to exclude everything else. It doesn't tell us about the world, only about how the professor is using language.
  *   **Impact on Chemist Case:** **Leaves it alone.** This thesis concedes your point. It admits the chemist's model has immense *practical* or *predictive* value. It simply insists we label that value "non-epistemic." It doesn't prove she shouldn't use the model; it just says her success isn't "epistemic success."
  *   **Confidence:** **High.** This is often what professors mean when they are being pedantic rather than substantive.

  ### 2. The Normative Exclusion Thesis (Evidentialism)
  **The Claim:** When evaluating whether a belief is *justified* or *rational*, only truth-related evidence counts. Practical benefits (like getting a grant or predicting a reaction) are the "wrong kind of reason" for belief.
  *   **Status:** **Defensible.** This is the core of traditional Evidentialism. However, it is contested by "Pragmatic Encroachment" views (which argue practical stakes can affect justification) and "Pragmatism" (which argues utility can justify belief).
  *   **Impact on Chemist Case:** **Supports dismissing it.** If the chemist *believes* the approximation is true, this thesis says her belief is epistemically unjustified because her reason for holding it is utility, not truth-evidence. However, if she *knows* it is false (as you said), she likely doesn't believe it, she merely *accepts* it for use. This thesis applies to belief, not necessarily to acceptance/use.
  *   **Confidence:** **High.** This is the standard orthodox view in mainstream epistemology.

  ### 3. The Teleological Thesis (Aim of Belief)
  **The Claim:** The essential function or "aim" of the mental state of *belief* is truth. A state that does not aim at truth is not a belief (it might be acceptance, assumption, or imagination).
  *   **Status:** **Defensible.** This relies on the "norm of belief" debate. If belief is constitutively aimed at truth, then a "useful false belief" is a category error. You can't have a "useful false belief" any more than you can have a "married bachelor."
  *   **Impact on Chemist Case:** **Supports dismissing it (with a twist).** The professor can argue the chemist does not *believe* the model is true. She *uses* it. If she claims to *believe* it while knowing it's false, she is irrational. The slogan shuts down the idea that she can *believe* it for practical reasons.
  *   **Confidence:** **Medium-High.** Widely held, but faces challenges from fictionalism and self-deception cases.

  ### 4. The Value Monism Thesis (Veritism)
  **The Claim:** Truth is the *sole* fundamental good in the epistemic realm. Other goods (understanding, coherence, explanatory power) are only valuable *because* they lead to truth. They have no value if they diverge from truth.
  *   **Status:** **Controversial/Debatable.** Many epistemologists argue that *understanding* has intrinsic value even if it doesn't strictly increase true beliefs (e.g., grasping connections between truths). If understanding is valuable independently, truth is not the *only* intrinsic value.
  *   **Impact on Chemist Case:** **Supports dismissing it.** Under strict Veritism, the chemist's model has zero intrinsic epistemic worth because it is false. Its predictive accuracy is merely instrumental (a tool). The professor is saying: "Don't confuse the tool's usefulness with the belief's truth-worthiness."
  *   **Confidence:** **Medium.** This is the most substantive philosophical claim in the slogan, and also the most attacked.

  ### 5. The "No False Lemmas" Thesis
  **The Claim:** You cannot gain epistemic value (like knowledge or justification) from a falsehood. Even if a false premise leads to a true conclusion, the epistemic lineage is tainted.
  *   **Status:** **False (or at least heavily qualified).** Modern epistemology often accepts that false models can generate knowledge (e.g., "idealizations" in physics). If the falsehood is irrelevant to the derivation of the truth (as in your chemist case), many argue knowledge is still possible.
  *   **Impact on Chemist Case:** **Supports dismissing it.** This is likely the specific engine the professor is using. He is asserting that because the correlation part is false, the epistemic status of her conclusion is compromised, regardless of the accurate prediction.
  *   **Confidence:** **Medium-Low.** This is the weakest link. Many philosophers of science argue that false models *do* yield understanding and knowledge, directly contradicting this reading.

  ---

  ### Summary of the Map

  | Thesis | Status | Does it dismiss the Chemist case? | Confidence |
  | :--- | :--- | :--- | :--- |
  | **1. Definitional** | Trivial | No (just relabels the value) | High |
  | **2. Normative Exclusion** | Defensible | Yes (if she *believes* it) | High |
  | **3. Teleological** | Defensible | Yes (reclassifies as 'acceptance') | Medium-High |
  | **4. Value Monism** | Debatable | Yes (denies intrinsic worth) | Medium |
  | **5. No False Lemmas** | False/Qualified | Yes (denies knowledge from false models) | Medium-Low |

  ### The Point of Least Certainty
  I am least confident in **Thesis 5 (The "No False Lemmas" reading)**.

  **Why:** There is a vibrant debate in philosophy of science regarding "idealizations." Your chemist example is a textbook case of a *harmless idealization*. If the false part of the model (electron correlation approximation) is mathematically proven to cancel out or be irrelevant for the specific energy differences she is modeling, many epistemologists would argue she *does* gain epistemic value (knowledge/understanding) despite the falsehood.

  If your professor is using the slogan to assert that **no epistemic value can be derived from a known falsehood**, he is taking a very hardline stance that ignores the nuance of modeling practices. He is treating the model as a *belief claim* rather than a *computational tool*.

  ### How to Push Back
  The slogan fails because it treats **Belief** and **Model-Use** as the same thing.
  1.  **If she believes the model is literally true:** The professor is right (Thesis 2 & 3). She is irrational.
  2.  **If she knows it is false but uses it:** The professor is category-mistaken. She isn't forming a belief; she is employing an instrument. The slogan "Truth is the only intrinsic epistemic value" applies to the *evaluation of beliefs*, not necessarily to the *evaluation of scientific tools*.

  The slogan is doing too much work because it tries to solve a problem in **Philosophy of Science** (how false models work) using a slogan from **Value Epistemology** (what makes belief good). They are related, but not identical.
