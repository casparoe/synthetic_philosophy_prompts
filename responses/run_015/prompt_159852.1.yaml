answer: |-
  Here is the specification for a theory of demandingness. I have categorized the requirements into **Case Handling**, **Structural Distinctions**, and **Meta-Ethical Costs**. I have marked each as either **Non-Negotiable** (a theory that fails this is intuitively broken or incoherent) or **Contingent** (a point of legitimate philosophical dispute between camps, e.g., impartialists vs. partialists).

  Following the list, I argue for the two specific additions you requested and conclude with the fundamental tension where the debate bottoms out.

  ### I. Case Handling Desiderata
  *A theory must yield plausible verdicts on these standard test cases.*

  1.  **The Shallow Pond (Low Cost/High Benefit)**
      *   **Spec:** If the cost to the agent is trivial and the benefit to the recipient is life-saving, the theory must prescribe action.
      *   **Status:** **Non-Negotiable.** Any theory that says you can walk past a drowning child to save a pair of shoes is rejected by common sense and almost all normative frameworks.
  2.  **The Thousand People (Aggregation)**
      *   **Spec:** The theory must account for cumulative small costs. If 1,000 people each need $1 from me, the theory cannot treat this as 1,000 trivial decisions; it must recognize the aggregate burden.
      *   **Status:** **Non-Negotiable.** A theory that fails aggregation allows death by a thousand cuts.
  3.  **The Uniqueness Case (No One Else Pitching In)**
      *   **Spec:** The theory must specify whether my obligation increases if I am the *only* one who can help, versus cases where others are also able but refusing.
      *   **Status:** **Contingent.**
          *   *Fairness Camp:* My obligation is capped at my "fair share"; I am not liable for others' immorality.
          *   *Outcome Camp:* My obligation is determined by the need, not the behavior of others. If I don't pick up the slack, the victim suffers.
  4.  **The Inefficacy Case (No Difference)**
      *   **Spec:** The theory must handle cases where my individual contribution makes no perceptible difference (e.g., voting, large-scale aid thresholds). It cannot simply say "do nothing" if the collective action is required.
      *   **Status:** **Non-Negotiable.** It must offer an account of *expected utility* or *complicity* rather than requiring deterministic causal impact.

  ### II. Structural Distinctions
  *A theory must maintain conceptual boundaries to avoid collapsing into absurdity.*

  5.  **Obligatory vs. Supererogatory**
      *   **Spec:** The theory must draw a line between what is *required* (blameworthy if omitted) and what is *good but optional* (praiseworthy if done, blameless if omitted).
      *   **Status:** **Non-Negotiable.** Without this distinction, morality becomes totalitarian (everything good is required) or vacuous (nothing is required).
  6.  **Cost to Agent vs. Cost to Loved Ones**
      *   **Spec:** The theory must distinguish between sacrifices I make directly and sacrifices imposed on those dependent on me (e.g., using my children's inheritance for charity).
      *   **Status:** **Contingent.** Strict impartialists argue money is money regardless of whose name is on the account; partialists argue I have special duties to my dependents that trump general duties.

  ### III. The Argued Additions
  *These are not standard in introductory texts but are necessary for a realistic theory.*

  7.  **The Epistemic Bill (Non-Negotiable)**
      *   **Spec:** A theory of demandingness must include the cost of *acquiring moral knowledge* in its calculation of "sacrifice." You cannot claim an action is "too demanding" if you haven't paid the cost to find out if it works.
      *   **Argument:** Moral ignorance is often a luxury good. In the information age, knowing which interventions save lives (e.g., bed nets vs. art museums) has a time and cognitive cost. If a theory only counts the dollar value of the donation but ignores the 20 hours of research required to ensure that donation isn't wasted, it underestimates the demandingness.
      *   **Why it's Non-Negotiable:** To claim "I didn't know my inaction was harmful" is only exculpatory if *knowing* was prohibitively costly. A viable theory must assign a budget for moral research. If the epistemic cost is too high, the obligation to act may be suspended, but the obligation to *learn* remains. You cannot outsource your moral liability to your own ignorance.
  8.  **The Enforcement Cost Ceiling (Non-Negotiable)**
      *   **Spec:** A theory must limit the permissible cost of *holding others* to the demand. This includes social blame, guilt-tripping, fines, or reputational damage.
      *   **Argument:** Moral theories are social technologies. If the cost of enforcing a rule (e.g., ostracizing a friend for not donating 10% of income) destroys the relationship or causes psychological collapse that reduces their future ability to do good, the enforcement is self-defeating.
      *   **Why it's Non-Negotiable:** A theory that looks modest on paper might be tyrannical in practice if it mandates harsh blame for minor infractions. The "cost of compliance" includes the "cost of being policed." If the social friction required to maintain the moral norm exceeds the utility gained by the norm's compliance, the theory fails its own criteria. We must account for the negative externalities of blame.

  ### IV. The Impossible Pair
  *Here is where the debate bottoms out. I argue that no theory can satisfy both of the following Non-Negotiable desiderata in the actual world.*

  **1. The Fairness Constraint (The "No Sucker" Principle)**
  > *Desideratum:* An agent cannot be required to take up the slack created by the inaction of others. My obligation is limited to my "fair share" of the collective burden required to solve a problem.
  > *Motivation:* Protects the agent from exploitation and maintains reciprocity. It aligns with the intuition that morality should be a cooperative venture, not a solo burden.

  **2. The Harm-Prevention Constraint (The "Rescue" Principle)**
  > *Desideratum:* If an agent can prevent severe suffering or death without sacrificing something of *comparable* moral significance, they are required to do so, regardless of what others are doing.
  > *Motivation:* Protects the victim. Suffering does not care about fairness. If I can save a life for $500, the fact that others *could* have but *didn't* is irrelevant to the victim's survival.

  **The Conflict:**
  In a world of extreme, unmet need (like global poverty), these two constraints are mutually exclusive.
  *   If you satisfy the **Fairness Constraint**, you limit your giving to a "share" (e.g., 10% of income). But since most people give nothing, the total collected is insufficient to prevent the severe suffering that *could* have been prevented. You have prioritized your standing relative to peers over the life of the victim.
  *   If you satisfy the **Harm-Prevention Constraint**, you must keep giving until the cost to you equals the benefit to them (marginal utility). Since the need is vast and the donors are few, this consumes your life projects, savings, and future security. You have prioritized the victim over your right to a fair share of the burden.

  **Conclusion:**
  You must choose which failure is less unacceptable.
  *   Do you accept a theory that is **Fair but Fatal** (allows preventable death because it's not "my turn")?
  *   Do you accept a theory that is **Life-Saving but Devastating** (saves lives but demands the agent sacrifice their life plan)?

  Most philosophical work on demandingness is an attempt to hide this trade-off. A robust theory must admit that in non-ideal conditions (where others don't comply), you cannot have both Fairness and Sufficiency. You must decide if morality is primarily about **clean hands** (Fairness) or **dry eyes** (Harm-Prevention).
