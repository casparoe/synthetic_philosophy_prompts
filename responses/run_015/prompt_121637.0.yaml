answer: |-
  This is a sophisticated position. You are effectively advocating for a **Principled Parameter-Setting (PPS)** model of morality, analogous to Chomskyan Universal Grammar. You claim that the *deep structure* (the machinery) is invariant and objective, while the *surface structure* (the parameters) varies culturally.

  This avoids the crude "everything is relative" trap, but it inherits the vulnerabilities of the linguistic analogy, plus specific vulnerabilities regarding the link between *psychological universality* and *moral objectivity*.

  Here is a breakdown of defeaters, ranked by severity, with specific attention to your two thought experiments and the unit of explanation problem.

  ---

  ### 1. The Grain Problem: Triviality vs. Constraint
  **The Worry:** You ask if "don't harm an insider gratuitously" is universal only because "insider" and "gratuitously" are elastic enough to fit any data. If a culture defines "insider" as "only me" (solipsism) or "only my clan" (and killing outsiders is a virtue), have we found a universal, or just a tautology ("every culture has rules they enforce")?

  **The Defeater:** **The Unconstrained Parameter.**
  If the "parameters" can be set to *any* value without cognitive friction, the "machinery" is doing no explanatory work. In linguistics, UG is valuable because it predicts *impossible* languages (e.g., a language with no nouns, or specific recursion limits).
  *   **Fatal Version:** If you cannot specify a *forbidden parameter setting*. Can a culture exist where "harming an insider for fun" is a *moral obligation*? If you say "No, that's impossible," but anthropologists find a ritual where this happens (e.g., specific sacrificial contexts), and you explain it away as "they don't count the victim as an insider," you have insulated the theory from falsification.
  *   **Concession:** You must concede that if "insider" is infinitely elastic, your claim collapses into "all cultures have norms." That is trivial and supports neither objectivity nor a specific cognitive architecture.
  *   **Shrug-off:** If "insider" is elastic but *bounded* (e.g., can expand to all humans, but never to rocks; can shrink to family, but never to just "me"), the theory holds. The machinery constrains the parameters.

  ### 2. The Hypothetical Study: Ontological Plasticity
  **The Worry:** You propose a study using Moral/Conventional probes with relativizers (Consensus, Authority, Secrecy). You worry about a result where the "objective core" is tiny, shifting, or non-existent under Authority overrides.

  **The Defeater:** **The Hierarchy Collapse.**
  Your model assumes a universal hierarchy of modules (e.g., Harm is usually weightier than Authority, unless parameters shift).
  *   **Fatal Version:** If in some societies, the "Authority" probe *consistently* overrides the "Harm" probe *structurally* (not just in weighting), then the machinery is not shared. For your view to hold, the *conflict* must be recognizable. If Culture A sees "Ancestors command harm" as a *tragic moral dilemma* (Harm vs. Authority fighting), but Culture B sees it as *no dilemma at all* (Authority defines Harm), then the cognitive machinery differs. Culture B lacks the "Harm" module as an independent tracker; it is subsumed under Authority. This isn't a parameter shift; it's a different operating system.
  *   **Concession:** If the core is *tiny* (e.g., only "don't harm your own mother" survives), you must concede that moral objectivity is extremely thin. It saves the structure but sacrifices the normative force you likely want.
  *   **Shrug-off:** If the membership shifts (Harm is core in Sample A, Purity is core in Sample B) but the *size* and *structural role* of the core remains constant, this is consistent with your view. It suggests different modules are "awake" or prioritized, not that the hardware differs.

  ### 3. The Unit of Explanation: Ecology vs. Nature
  **The Worry:** You note that variation might track market integration or residential mobility (Henrich et al.) rather than "culture."
  **The Defeater:** **The Functional Reduction.**
  If moral variation tracks socio-ecological variables (e.g., high market integration $\rightarrow$ more impersonal fairness norms) better than it tracks "cultural heritage," then the "shared machinery" isn't an innate moral grammar waiting to be parameterized. It is a **general-purpose learning algorithm** adapting to local payoff structures.
  *   **Fatal Version:** If the "core routines" you identify (reciprocity, harm avoidance) turn out to be Nash equilibria for specific ecological problems rather than innate cognitive modules, your claim to *objectivity* weakens. It becomes "all humans face similar game-theoretic problems," not "all humans access similar moral truths." This shifts the explanation from *Moral Psychology* to *Behavioral Ecology*.
  *   **Concession:** You must concede that the "machinery" might be domain-general learning, not domain-specific moral modules. This hurts the "objectivity" claim because it makes morality instrumental rather than intrinsic.
  *   **Shrug-off:** Even if ecology triggers the parameters, the *capacity* to recognize the norm might still be innate. (e.g., We have an innate capacity for language, but we only speak English because we live in England).

  ### 4. Prediction and Insulation
  **The Worry:** Has the view been qualified so much that no finding could touch it?
  **The Defeater:** **The "No Forbidden Zones" Problem.**
  A scientific theory must predict what *cannot* happen.
  *   **Fatal Version:** If every counter-example (e.g., a culture that eats the dead) is explained as "different parameter setting on the Purity module," the theory is unfalsifiable. To avoid this, you must predict *moral impossibilities*. Example: "No culture will treat random noise as a moral violation." If a culture emerges that treats "sneezing on a Tuesday" as a moral crime equivalent to murder, and they treat it as objective (not conventional), your "core routines" theory is in trouble.
  *   **Concession:** If you cannot list "impossible moralities," you are doing philosophy, not psychology.
  *   **Shrug-off:** Insulation is fine *if* the insulation is provided by the structural constraints (the grammar), not by ad-hoc parameter adjustments.

  ### 5. The Is-Ought Gap (The Meta-Ethical Defeater)
  **The Worry:** Even if you prove shared machinery, does that support *objectivity*?
  **The Defeater:** **The Shared Hallucination.**
  *   **Fatal Version:** Universal consensus on a cognitive structure does not entail moral truth. Humans universally see faces in clouds (pareidolia). That doesn't mean faces are objectively in the clouds. If the "core routines" are evolutionary adaptations for group cohesion (error management systems), they could be universally *false* (e.g., Purity violations aren't actually "wrong," just disgusting).
  *   **Concession:** You must concede that psychological universality supports *realism* only if you add a premise that evolution tracks moral truth (a strong claim). Otherwise, it only supports *intersubjectivity*.

  ---

  ### Ranked Defeaters List

  Here is the ranking from Fatal (kills the theory) to Awkward (requires revision) to Shrug-off (consistent).

  #### **FATAL (The Theory Cannot Survive)**
  1.  **The Ontological Mismatch (Study Result):** If the "Ancestors Command" probe shows that in some cultures, Authority *dissolves* the distinction between moral and conventional (i.e., if the Ancestors say it, it's not just obligatory, it's *conceptually impossible* to call it wrong), then the "Harm" module is not a universal constraint. The machinery differs.
  2.  **The Ecological Reduction:** If the variation is better predicted by market integration/residential mobility than by cultural lineage or innate constraints, the "Universal Grammar" analogy fails. It suggests domain-general learning, not domain-specific moral machinery. This undermines the "objectivity" claim by making morality purely functional.
  3.  **The Vacuity/Grain Collapse:** If "insider" and "harm" can be defined so elastically that *any* norm fits the "Protect Insiders" rule, the theory is tautological. It predicts nothing.

  #### **AWKWARD (Requires Concession/Revision)**
  4.  **The Tiny Core:** If the study shows the objective core is tiny (e.g., only 2-3 specific norms) and membership shifts wildly, you must concede that moral objectivity is very thin. You save the structure but lose the robust normative guidance you likely want.
  5.  **The Shared Hallucination:** You must concede that shared machinery $\neq$ moral truth. You need a separate argument for why these specific cognitive routines track truth rather than just fitness.
  6.  **Developmental Lag:** If children do not show these "core routines" until after heavy enculturation (age 7+), it suggests the machinery is built, not pre-loaded. This weakens the "innate" claim but doesn't kill the "shared structure" claim.

  #### **SHRUG-OFF (Consistent with the View)**
  7.  **Weighting Collisions:** Finding that Culture A prioritizes Loyalty over Harm while Culture B prioritizes Harm over Loyalty is *exactly* what the parameter-setting model predicts. This is evidence *for* the view, not against.
  8.  **Surface Taboo Variation:** Specific content differences (pork vs. beef, left hand vs. right hand) are irrelevant. These are the "vocabulary" differences, not the "grammar."
  9.  **Insulation via Structure:** It is fine if the theory is insulated from *surface* variation, provided it is vulnerable to *structural* variation (see Fatal #1).

  ---

  ### Specific Answers to Your Questions

  **1. Grain:**
  *   **Does it collapse?** It collapses *only if* you cannot define the bounds of "insider."
  *   **The Fix:** You need to argue that the *capacity* to distinguish insider/outsider is the universal, but the *radius* is the parameter. However, to avoid triviality, you must argue there are *cognitive costs* to expanding/contracting the radius too far. (e.g., It is cognitively unstable to treat *no one* as an insider, or *everything* as an insider). If you can show that extreme parameter settings cause social/cognitive breakdown, you have a non-trivial claim.

  **2. The Study (Relativizing Probes):**
  *   **Does it kill the story?**
      *   If the core is **tiny**: It shrinks the story. Objectivity becomes minimal.
      *   If the core **shifts membership**: It fits the parameter story (different modules are dominant).
      *   If **nothing survives "Ancestors Command"** in some places: **This kills it.** This implies that for those people, morality *is* convention/authority. There is no "moral/conventional" distinction in their cognitive architecture. That is a structural difference, not a parametric one.
  *   **Prediction:** Your view predicts that *somewhere* in the probe battery, a "moral" intuition will resist the "Authority" override in *all* cultures. Even if it's just "don't torture babies for fun even if the Chief says so." If you find a culture where *no* such resistance exists, the universal machinery claim is false.

  **3. Prediction and Insulation:**
  *   **What does it predict?** It predicts **constraints on variation**. It predicts you will *never* find a culture where:
      *   Harming an insider for no reason is *praised* (not just tolerated).
      *   Cheating on a reciprocal arrangement is *virtuous* (not just necessary).
      *   There is *no* concept of "ought" distinct from "is."
  *   **Is insulation a problem?** Insulation is a problem only if it makes the theory unfalsifiable. If you can explain *any* outcome as a "parameter setting," it's bad science. If you can say "This outcome is impossible given the machinery," it's good science.
  *   **Unit of Explanation:** If the variation tracks **market integration**, your story has the wrong *etiology* (cause), but might still have the right *topology* (structure). However, if the cause is ecological adaptation, the "objectivity" claim is weakened. It suggests the norms are *tools*, not *truths*. This is the most dangerous empirical finding for your specific philosophical goal.

  ### Final Recommendation
  The strongest threat to your view is not cultural variation, but **functional reductionism**. If Henrich is right that our psychology is shaped by socio-ecological niches (market vs. subsistence), then the "shared machinery" might just be "shared human problem-solving capacities," not a moral grammar.

  To defend your view, you need to demonstrate **cognitive constraints** that *resist* ecological pressure. Show me a norm that persists *despite* it being ecologically costly, because the "machinery" demands it. That is the only evidence that secures objectivity over functionality.
