          4.  Evaluate the skeptical conclusion (is the butterfly world false or equally real?).
          5.  Distinguish between settled scholarship and contested interpretations.

  2.  **Deconstruct the Classmate's Argument (The BIV Analogy):**
      *   *Premise 1:* Indistinguishability (Dream vs. Waking = Sim vs. Real).
      *   *Premise 2:* If indistinguishable, you can't know which is which.
