answer: |-
  You've spotted the tension correctly: poker doctrine screams that sunk costs are dead money, while the Dollar Auction shows people drowning in them. The resolution isn't that poker players are deluded, nor that the escalation theorists are wrong. It's that the Dollar Auction changes the rules of *folding* in a way poker never does.

  In poker, when you fold, your liability ends. You lose the chips already in the pot, but you don't owe anything more, and the winner doesn't get a bonus because you folded. In the Dollar Auction, the rule that the *runner-up* must pay creates a penalty for folding that doesn't exist at your $1/$2 table. When you fold in an auction, you crystallize a loss *and* hand the prize to your opponent. In poker, you just preserve the rest of your stack.

  Here is how the escalation literature maps to your poker vocabulary, where it fits, and where the game itself hides the trap.

  ### The Mapping

  **1. Sunk Costs vs. Money in the Pot**
  In poker, you know the $50 you shoved on the flop isn't yours; you only care if your 20% equity justifies a call against a $100 bet. That is **Pot Odds**. Escalation theory says people ignore this and chase the money they already put in.
  *   **The Verdict:** Poker is right *for poker*. The guy at your table calling because "he's already in for so much" is playing -EV. He is making a mistake. In the Dollar Auction, however, bidding $1.05 to save a $1.00 bid *can* be mathematically correct if you believe your opponent will fold next. Poker vocabulary calls this "pot commitment," but it misses that the Auction makes folding expensive, whereas poker makes folding free (relative to future action).

  **2. The Trap vs. Pot Commitment**
  You know **Pot Commitment**: when the stack-to-pot ratio is so low that folding is mathematically impossible, you are "committed." Escalation looks exactly like this: the bidder is in so deep they *must* bid again to minimize loss.
  *   **The Verdict:** This maps cleanly. In both cases, you are priced in. The difference is that in poker, commitment is usually a result of your own prior sizing mistakes or variance. In the Auction, the structure *forces* commitment on both players simultaneously. It's a forced all-in situation that keeps renewing itself.

  **3. Ego vs. Tilt**
  When you chase a loss because you're angry at a bad beat, that's **Tilt**. In the Dollar Auction, bidders often escalate to avoid looking like the "sucker" who paid 90 cents for nothing.
  *   **The Verdict:** This maps cleanly. Both are emotional leaks. However, escalation theorists argue that sometimes bidding higher isn't tilt; it's a rational signal to your opponent that you have a deeper **Bankroll** and will outlast them. In poker, we call this "stack pressure." If the auction bidder knows you have a short stack, bidding higher is a smart play, not a mistake.

  **4. The Fold vs. The Runner-Up Penalty**
  This is where your vocabulary breaks. In poker, **Folding** preserves your remaining stack. In the Dollar Auction, the rule that the second-highest bidder pays means folding triggers a specific penalty that poker has no name for.
  *   **The Verdict:** Poker vocabulary cannot model this. There is no scenario in No-Limit Hold'em where folding causes you to pay money *and* award the pot to the villain simultaneously. This structural difference is why escalation happens in auctions but (theoretically) not at the poker table.

  ### The Translation Table

  | poker_term | escalation_idea | fit | rationality_verdict | residue |
  | :--- | :--- | :--- | :--- | :--- |
  | Pot Odds | Sunk Cost Irrelevance | Forced | Mistake | Poker assumes folding costs zero future chips; Auction makes folding a realized loss. |
  | Pot Commitment | Escalation Trap | Clean | Reasonable | Commitment is math; Escalation is often panic masquerading as math. |
  | Tilt | Ego Defense | Clean | Mistake | Tilt is internal emotion; Escalation can be rational threat assessment. |
  | Folding | Runner-Up Penalty | None | Can't say | Poker rewards folding; Auction punishes the second-highest bidder specifically. |

  bottom_line: Poker correctly treats sunk costs as mathematically dead, but its vocabulary breaks when the rules punish folding in ways the game never allows.
