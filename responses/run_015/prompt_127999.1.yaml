prompt: |-
  Last night my friend Sam and I got into it for about three hours over whether someone who genuinely, flatly does not care about anything beyond the next week has a reason to keep taking their medication. I ended up defending a position I'm not sure I can actually defend out loud, and now I have to give it as a department colloquium in three weeks, so I need to be ready for the question period.

  Here's the view, roughly. Call it scaffolded deliberative internalism: there's a reason for A to φ only if A could come to be moved by that consideration through a process we'd count as their own deliberation — where "their own deliberation" is allowed to be extended in time, socially scaffolded (a friend arguing with them over months, a therapist, a book, being around different people), allowed to fix factual mistakes, and allowed to draw out things they already half-care about but have never articulated. What it's not allowed to do is import a desire from outside: no conditioning, no drugs, no manipulation that bypasses their own take-up, and no just stipulating a new want into the set. So the motivational condition still bites — a genuinely desireless or totally unmoved-to-be-moved agent really has no reason — but it bites far less often than the standard internalist thinks, because in practice the route from where almost anyone actually is to being moved by the consideration usually exists, it's just long and needs other people.

  Sam's objection, which I did not have a good answer to, was that once you let the process be that long and that scaffolded, "could be brought to be moved" just means "an ideal persuader could get them there," which is externalism wearing a motivational condition as a hat — the internalist constraint stops excluding anything. I suspect that's the question I'm going to get in some form and I need to have handled it before slide two.

  The room: about thirty people. Three or four hard-line Humeans about reasons who think internalism is basically definitional and that I've reinvented it badly; two Kantian-ish rationalists who think the whole motivational constraint is a category mistake and reasons are just facts about what there is to be said for things; a couple of moral psychologists who spend their time on how people actually change (and don't change) what they care about, including the stuff where people dig in and keep insisting something's wrong after every reason they give gets knocked down; and one political philosopher who will care a lot about whether my view can still say anything to someone genuinely awful. No one there works on this exact debate, which I think makes it worse, not better.

  What I want is a prep sheet. Give me the eight-ish objections I'll actually get from this room — not the ones I'd get from people who already agree with me — ordered by likelihood times damage, each one phrased the way that kind of person would actually say it out loud (the Humean version and the rationalist version of the same complaint sound completely different and I need both). For each: a reply I can give in about ninety seconds standing at the whiteboard without notes, and an honest note on where that reply is soft or where I'm quietly changing the subject. Tell me what I should concede in the first three minutes so I'm not still fighting it in Q&A, which single reply has to land or the whole talk is dead, and — please — the one question I'm hoping nobody asks, with the real answer rather than the comfortable one. If you think Sam's objection is fatal as stated, say so and tell me the most I could salvage by tightening something.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A philosopher (likely grad student or early career, given the "department colloquium" context) preparing a talk on a specific view: "Scaffolded Deliberative Internalism" (SDI).
      *   **Context:** Had a 3-hour argument with a friend (Sam) about reasons for action regarding a desireless agent (medication example). Now defending a refined version of that view in a talk.
      *   **The View (SDI):** Reasons exist only if the agent *could* come to be moved by the consideration through "their own deliberation." This deliberation can be extended in time, socially scaffolded (friends, therapists), and corrective of facts. It *cannot* import desires from outside (no conditioning, manipulation, bypassing take-up).
      *   **The Core Tension:** Sam's objection: If the process is long/scaffolded enough, isn't this just Externalism with a motivational hat? Does the internalist constraint exclude anything anymore?
      *   **The Audience:** ~30 people. Mixed bag: Hard-line Humeans (Internalists), Kantian Rationalists (Externalists), Moral Psychologists (empirical focus on change/resistance), One Political Philosopher (normative authority over "awful" people). None are specialists in this exact niche.
      *   **Deliverable:** A prep sheet.
          *   8-ish objections (ordered by likelihood $\times$ damage).
          *   Phrased in the voice of the specific objector (Humean vs. Rationalist).
          *   90-second reply for each (whiteboard style).
          *   Honest note on soft spots/evasion.
          *   Concessions to make early (first 3 mins).
          *   The "make or break" reply.
          *   The "feared question" + real answer.
          *   Assessment of Sam's objection (fatal? salvageable?).

  2.  **Deconstruct the View (SDI) & Identify Weak Points:**
      *   *Strength:* Bridges the gap between actual psychology and normative reasons. Explains how therapy/friendship works normatively.
      *   *Weakness 1 (Sam's Point):* The "Idealization" problem. How much scaffolding is too much? When does "helping them deliberate" become "making them want what I want"?
      *   *Weakness 2 (The Desireless Agent):* If someone *truly* doesn't care (depression, psychopathy, nihilism), does SDI say they have no reason to take meds? This seems dangerous/impractical.
      *   *Weakness 3 (Rationalist Attack):* Why care about motivation? If it's good for you, it's a reason. Motivation is contingent.
      *   *Weakness 4 (Humean Attack):* You've diluted "internal" so much it's meaningless. Williams' internalism requires a sound deliberative route from the *actual* subjective motivational set. You're allowing the set to change too much.
      *   *Weakness 5 (Moral Psych):* People resist deliberation. What if the scaffolding fails? Is the reason retroactively erased?
      *   *Weakness 6 (Political):* Can this condemn the truly awful? If a Nazi *can't* be scaffolded into caring about Jews, do they have no reason not to kill them?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Sam/Objector Special):* The "Externalism in Disguise" charge. This is the big one.
      *   *Objection 2 (Humean):* The "Williams Violation." You're changing the SMS (Subjective Motivational Set) too much.
      *   *Objection 3 (Rationalist):* The "Why Bother?" charge. Reasons are facts, not psychological states.
      *   *Objection 4 (Moral Psych):* The "Resistance" problem. What if they refuse the scaffold?
      *   *Objection 5 (Political):* The "Monster" problem. The Nazi/Psychopath case.
      *   *Objection 6 (Metaphysical):* The "Counterfactual" problem. How do we know what they *would* want after 5 years of therapy?
      *   *Objection 7 (Agency):* Who owns the deliberation? If a therapist does the work, is it the agent's reason?
      *   *Objection 8 (Pragmatic):* The "Action Guiding" problem. If the reason depends on a 3-year process, it doesn't help me *now*.

      *Refining Voices:* Make the Humean sound worried about losing the link to action. Make the Rationalist sound impatient with psychology. Make the Psychologist sound empirical.

  4.  **Developing Replies & Soft Spots:**
      *   Need to be concise (90 seconds).
      *   Need to admit where the view is fuzzy (honesty builds credibility).
      *   *Key Move:* Distinguish between *creating* a desire and *uncovering/removing obstacles* to a latent capacity for valuation.

  5.  **Determining Concessions:**
      *   Don't claim SDI solves the "Monster" case fully.
      *   Admit the "threshold" of scaffolding is vague.
      *   Admit it doesn't help in immediate emergencies.

  6.  **Identifying the "Make or Break" Reply:**
      *   It has to be the distinction between *importing* a desire vs. *restoring* the capacity to respond to reasons. If this fails, the view collapses into Externalism.

  7.  **Identifying the "Feared Question":**
      *   The Depression/Medication case. If the patient *cannot* be reached, do they have a reason? If "no," the view is morally repugnant. If "yes," it's Externalism.
      *   *Real Answer:* It's a bullet I might have to bite, or a redefinition of "could."

  8.  **Assessing Sam's Objection:**
      *   Is it fatal? Not necessarily, but it requires a principled limit on scaffolding. The limit is "procedural rationality" vs. "substantive ends."

  9.  **Review and Refine:**
      *   Check tone: Professional, slightly anxious but prepared, philosophical jargon used correctly (SMS, deliberative route, normative force).
      *   Check constraints: 8 objections, 90-second replies, soft spots noted.
      *   *Self-Correction on Objection Count:* 8 might be too many to detail fully with high quality. I'll aim for the *top* 8 distinct angles, grouping similar ones if needed, but the prompt asks for "eight-ish." I will provide 8 distinct ones.
      *   *Ordering:* Likelihood $\times$ Damage. Sam's objection is high damage/high likelihood. Humean/Rationalist splits are high likelihood. The "Monster" case is high damage.

  10. **Final Polish:** Ensure the distinction between "Scaffolded Deliberative Internalism" and standard Williams-style Internalism is clear in the replies. (Williams allows deliberation, but SDI allows *social* and *temporal* extension that Williams might reject as changing the SMS).

  *(Self-Correction during drafting)*: Wait, the prompt asks for "the one question I'm hoping nobody asks, with the real answer rather than the comfortable one." I need to make sure this is distinct from the objections list. It should be the "gotcha" that undermines the whole project.

  Let's assemble the prep sheet.

  *Structure:*
  1.  Assessment of Sam's Objection.
  2.  Early Concessions.
  3.  The "Make or Break" Reply.
  4.  The 8 Objections (Voice, Reply, Soft Spot).
  5.  The Feared Question.

  *Refining the View for the Replies:* I need to make sure the replies are consistent. The core defense is: *Deliberation is a capacity, not just a calculation. Scaffolding restores the capacity; it doesn't swap the engine.*

  *Let's write it.*
answer: |-
  # PREP SHEET: Scaffolded Deliberative Internalism (SDI)
  **Status:** Pre-Colloquium. **Time:** 3 Weeks. **Room:** Mixed/Hostile.

  ## I. VERDICT ON SAM'S OBJECTION
  **Is it fatal?** No, but it is the load-bearing wall. If you cannot distinguish *scaffolding deliberation* from *engineering motivation*, you are just a wishy-washy Externalist.
  **The Salvage:** You must tighten the definition of "their own deliberation." It cannot be *any* process that results in motivation. It must be a process that respects the agent's **procedural rationality**.
  *   **Permissible:** Removing factual errors, removing coercive pressure, expanding imagination, modeling how to weigh trade-offs.
  *   **Impermissible:** Conditioning, hypnosis, or arguing from premises the agent *could not* accept even in principle (e.g., "You should care because *I* say so").
  *   **The Line:** Scaffolding helps them drive the car; it doesn't swap the driver. If the agent looks back at the end of the process and says, "That wasn't me," you crossed the line.

  ## II. CONCESSIONS TO MAKE IN THE FIRST 3 MINUTES
  *Do not wait for Q&A to admit these. Owning them disarms the "gotcha" energy.*
  1.  **Vagueness of Threshold:** Admit you do not have a precise metric for "how much scaffolding is too much." It is a continuum, not a binary. You are offering a framework, not an algorithm.
  2.  **The "Stuck" Case:** Concede that there may be edge cases (severe psychopathy, catatonic depression) where the scaffold fails. If the process *cannot* reach them, SDI grants them no reason. Do not try to squirm out of this yet; say you will address the normative cost of this later.
  3.  **Time-Lag:** Admit SDI does not generate *immediate* reasons for action in crisis moments. It explains retrospective justification and long-term normative trajectories, not necessarily emergency intervention.

  ## III. THE "MAKE OR BREAK" REPLY
  **The Objection:** "You've diluted 'internal' until it means nothing."
  **The Reply:** "Internalism isn't about what I want *now*; it's about what I can own *as mine*. If a friend talks me down from a ledge, the reason to live wasn't *their* reason transferred to me. It was a reason I was temporarily blind to, which their presence helped me see. SDI explains the *normativity of help*. Externalism says the reason existed regardless of my capacity to see it. Humeanism says the reason vanishes if I'm too depressed to see it. SDI says the reason exists if there is a *bridge* I can walk, even if I need a handrail."
  **Why it must land:** If you cannot explain why the handrail doesn't count as someone carrying you, you lose the room.

  ---

  ## IV. THE EIGHT OBJECTIONS (Ordered by Likelihood × Damage)

  ### 1. The "Externalism in Disguise" (The Sam Special)
  *   **Who:** The Smart Grad Student or Junior Faculty (who read Sam's mind).
  *   **Voice:** "If your 'scaffolded deliberation' allows for months of therapy and social pressure, what work is the 'internal' constraint actually doing? If an ideal persuader can always find a route, haven't you just defined reasons as 'what an ideal persuader could make me want'? That's Externalism."
  *   **90-Second Reply:** "No, because the persuader is constrained by *my* rational architecture. They can't just install a desire. They have to find a path through my existing evaluative capacities. If I am logically incapable of valuing X, no amount of scaffolding creates a reason. Externalism says the reason exists even if I'm incapable of valuing X. I'm saying the reason depends on the *capacity*, not the current *state*."
  *   **Soft Spot:** You need a theory of "rational architecture" that isn't just "whatever they end up wanting."

  ### 2. The Williams Violation (Hard-Line Humean)
  *   **Who:** One of the three Humeans.
  *   **Voice:** "Bernard Williams allowed for deliberative routes from the Subjective Motivational Set (SMS). But you're allowing the SMS to be fundamentally altered by *other people*. That's not deliberation; that's socialization. You've broken the link to the agent's actual psychology."
  *   **90-Second Reply:** "Williams worried about 'external reasons statements' being false. But he underestimated how social deliberation is. We don't deliberate in a vacuum. If a therapist helps me realize I value health more than I thought, my SMS hasn't been *replaced*; it's been clarified. I'm extending Williams' 'sound deliberative route' to include the social tools required to make that route navigable."
  *   **Soft Spot:** Williams explicitly warned against this. You are arguably modifying the view more than extending it.

  ### 3. The "Monster" Problem (Political Philosopher)
  *   **Who:** The Political Philosopher.
  *   **Voice:** "Let's take a committed neo-Nazi. He genuinely doesn't care about Jewish lives. No amount of 'scaffolding' will move him without bypassing his agency. Does your view say he has *no reason* not to commit genocide? Because if so, your view is morally bankrupt."
  *   **90-Second Reply:** "SDI is a meta-ethical account of what reasons *are*, not a first-order moral guarantee. If an agent is truly incapable of accessing the value of human life through any rational scaffold, then yes, on this view, they lack an *internal* reason. But that doesn't mean we don't stop them. It means we treat them as a threat to be contained, not a rational interlocutor. That's a tragic but coherent position."
  *   **Soft Spot:** This is the bullet you have to bite. Don't flinch, or you look inconsistent.

  ### 4. The Category Mistake (Kantian Rationalist)
  *   **Who:** One of the two Kantians.
  *   **Voice:** "Why are we obsessing over motivation? A reason is a fact that counts in favor of an action. Whether I *can* be moved is a question of psychology, not normativity. You're confusing 'why I should' with 'why I would'."
  *   **90-Second Reply:** "I'm not confusing them; I'm linking them. A 'fact' that cannot in principle connect to my agency is noise, not a reason. Normativity is for agents. If a consideration cannot hook onto my capacity for valuation, it might be a 'truth', but it's not a 'reason for me'. I'm protecting the 'for me' part of the equation."
  *   **Soft Spot:** They will think you are reducing normativity to psychology. Stand firm on "Normativity is for agents."

  ### 5. The "Resistance" Objection (Moral Psychologist)
  *   **Who:** One of the Moral Psychologists.
  *   **Voice:** "People aren't just passive recipients of scaffolding. They actively resist. They dig in. If someone refuses the therapy, refuses the friends, refuses the book—does the reason disappear? You're making reasons contingent on cooperation."
  *   **90-Second Reply:** "Yes, in a sense. Reasons are relational. If I close my eyes, I have no visual reason to move. If I close my agency, I have no deliberative reason. But note: 'Refusing the scaffold' is itself an action that needs a reason. Usually, that refusal is based on a fear or value we can scaffold around. The reason exists if the *capacity* is there, even if the *will* is currently resisting."
  *   **Soft Spot:** Distinguishing "lack of capacity" from "refusal of will" is empirically messy.

  ### 6. The Counterfactual Knowledge Problem
  *   **Who:** The Epistemologist in the room (or skeptical Humean).
  *   **Voice:** "Your view relies on a counterfactual: 'They *could* be moved.' How do we know that? We can't run the 3-year therapy trial to check. This makes reasons unknowable in real-time."
  *   **90-Second Reply:** "Reasons are often unknowable in real-time. That's why we argue. We make our best guess about the deliberative route. SDI doesn't make reasons harder to know; it explains why we invest energy in persuasion. We are testing the counterfactual. If we fail, we update our belief about whether the reason existed for them."
  *   **Soft Spot:** It does make normative judgment much harder than Externalism.

  ### 7. The "Ownership" Objection
  *   **Who:** Action Theory specialist.
  *   **Voice:** "If the therapist does the heavy lifting, whose deliberation is it? If I need you to hold my hand to walk, is it my walking? If the motivation comes from the scaffold, isn't the agency external?"
  *   **90-Second Reply:** "Consider learning math. I can't do calculus alone. A teacher scaffolds me. Once I get it, the proof is *mine*. The origin of the tool doesn't negate the ownership of the result. SDI claims motivation works the same way. The source is social, the uptake is agential."
  *   **Soft Spot:** Calculus is skill; motivation is constitutive of the self. The analogy might not hold.

  ### 8. The "Emergency" Objection
  *   **Who:** Pragmatist / Clinician type.
  *   **Voice:** "Back to the medication case. If I need to take my pill *tonight* to not be dead *tomorrow*, I don't have three months for scaffolding. Your view implies I have no reason to take the pill right now if I'm not moved. That's dangerous."
  *   **90-Second Reply:** "SDI explains the *normative status*, not the *intervention strategy*. In an emergency, we act on the high probability that a scaffold *could* be built. We treat the patient as a future rational agent. But strictly speaking, if they wake up tomorrow and say 'I never would have agreed to that,' we have to acknowledge a normative tragedy occurred. We saved a life, but we violated their current normative closure."
  *   **Soft Spot:** This is the hardest pill to swallow. It sounds cold.

  ---

  ## V. THE FEARED QUESTION
  **The Question:** "If someone is so depressed they literally cannot feel care for their own future, and no amount of talking reaches them until the drugs kick in... do they have a reason to take the drugs *before* the drugs fix the capacity to care?"

  **The Comfortable Answer:** "Yes, because they *would* care if they were well." (This is Externalism/idealization. It betrays your view.)

  **The Real Answer:** "Strictly speaking, no. At that exact moment, they are normatively closed. The reason exists for their *future* self, or for *us* who care about them, but not for *them-as-they-are*. This is why paternalism is sometimes necessary: we are acting on reasons they *will* have, acknowledging they *don't* have them now. SDI makes paternalism honest about its normative cost."

  **Why this is dangerous:** It admits that Internalism can license ignoring an agent's current lack of reasons in favor of their future ones, which sounds like Externalism.
  **Defense:** Distinguish *having a reason* from *being subject to intervention*. We can intervene without claiming they currently possess the reason. We are banking on the restoration of the capacity.

  ---

  ## VI. STRATEGIC ADVICE FOR THE ROOM
  1.  **Don't Fight the Humeans on Definitions:** They care about the link to action. Emphasize that SDI *preserves* the link to action better than Externalism, even if the link is delayed.
  2.  **Don't Fight the Rationalists on Objectivity:** They care about truth. Admit reasons aren't "just feelings," but insist they must be *feelable* to be reasons *for an agent*.
  3.  **Use the Whiteboard:** Draw the timeline.
      *   *Time 1:* Agent unmoved.
      *   *Time 1-10:* Scaffolding (Therapy/Friends).
      *   *Time 10:* Agent moved.
      *   **Point:** The reason at Time 1 exists *because* the path to Time 10 is open. If the path is blocked (psychopathy), the reason vanishes.
  4.  **If Cornered on the "Monster":** Do not try to prove the Nazi has a reason. Say: "If we cannot find a rational route to their caring, we stop treating them as a moral agent and start treating them as a natural hazard. That is the limit of Internalism."

  **Final Check:** Sam is right that the view is precarious. Your job isn't to prove the view is airtight, but to prove it's *more useful* than the alternatives. It explains therapy, friendship, and moral growth. Externalism explains nothing but judgment; Humeanism explains nothing but impulse. SDI explains *change*. Play to that strength.
