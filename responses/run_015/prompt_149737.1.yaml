answer: |-
  **TO:** Risk Calibration Team
  **FROM:** Senior Calibrator (Me)
  **SUBJECT:** New Procedure for Model-Output vs. Objective Chance (The "Two-Lock" Protocol)
  **DATE:** Oct 24

  Look, we've got a problem. The actuaries give us a number—say, 2% chance of ecological failure—and they treat it like gospel. Then Engineering slides a memo across the desk saying the simulation grid was too coarse, or the debris database is junk. Suddenly that 2% feels like 10%, or maybe 0.5%. But we can't just gut-check our reserve capital. We need a rule.

  We're adapting an old philosophical idea (don't worry about the name) into a workflow. The core idea is simple: **You should match the published chance *unless* you have evidence that breaks the link between the model and the world.**

  I'm calling this the **Two-Lock Protocol**.
  *   **Lock 1 (The Model):** Is the physics/code actually correct?
  *   **Lock 2 (The Alignment):** Did the real-world inputs match what the model assumed?

  If both locks hold, the published number *is* your credence. If evidence picks either lock, you have to adjust. Below is the checklist. It should take you 20 minutes per case. If it takes longer, you're overthinking it. If it takes less, you're not reading the memos.

  ---

  ### The Two-Lock Checklist

  **Step 1: Identify the Evidence**
  Read the internal memo. What exactly is it claiming?
  *   **A:** It claims a physical parameter was wrong (e.g., temp, mass, velocity).
  *   **B:** It claims a structural flaw in the model (e.g., code bug, missing variable).
  *   **C:** It claims organizational/behavioral issues (e.g., staff stress, budget cuts, reckless culture).
  *   **D:** It claims knowledge of the outcome (e.g., "the valve already broke").

  *   *If D:* Stop. Probability is 0 or 1. Claim is void.
  *   *If C:* Flag for **Step 4** (likely inadmissible).
  *   *If A or B:* Proceed to Step 2.

  **Step 2: The "Baked-In" Test**
  Ask the model owners: *Was this specific evidence available when the sim was run?*
  *   **Yes:** The model already accounted for this. The published number stands. (Lock holds).
  *   **No:** The model is operating on outdated or incorrect info. (Lock is picked). Proceed to Step 3.

  **Step 3: Directionality Check**
  Does the evidence tell us *how* the model is wrong, or just *that* it's wrong?
  *   **Specific Bias:** "The temp sensitivity means failure is *more* likely." (We know which way to move the number).
  *   **Pure Noise:** "The data source is unverified." (We know the model is shaky, but not if it's over- or under-estimating).

  **Step 4: The Admissibility Filter (The Hard Part)**
  This is where you earn your pay. Evidence is only "admissible" for adjustment if it translates to **physical parameters**.
  *   Does "reckless culture" mean specific protocols were skipped? → **Yes:** Admissible (treat as Step 2A).
  *   Does "reckless culture" just mean "people are tired"? → **No:** Inadmissible. Your gut can scream, but the procedure says ignore it. We insure physics, not vibes.
  *   *Judgment Call Marker:* If you're unsure if a behavioral claim maps to a physical parameter, flag it for the Senior Calibrator (me). Do not guess.

  **Step 5: Apply the "Leaky Bucket" Adjustment**
  If the locks are picked (Step 2 = No), you cannot use the published number raw. Use this rule:

  *   **For Specific Bias (Step 3A):** Shift the published chance toward the direction of the bias by **20% of the remaining distance** to the bound (0% or 100%).
      *   *Example:* Published 10%. Evidence says risk is higher. Shift 20% of the way from 10% to 100%. New Credence = 10% + (0.20 * 90%) = 28%.
  *   **For Pure Noise (Step 3B):** Widen the uncertainty. Keep the mean at the published number, but report a confidence interval **2x wider** than the model's standard error. Capital reserve should be calculated on the upper bound of this new interval.

  ---

  ### The Leaky Bucket Rule (Cheat Sheet)

  | Evidence Type | Model Status | Adjustment Action |
  | :--- | :--- | :--- |
  | **None** | Locks Held | Use Published Chance. |
  | **Physical Parameter Missing** | Lock 2 Picked | Shift 20% toward bias direction. |
  | **Model Structure Flawed** | Lock 1 Picked | Shift 20% toward worst-case. |
  | **Data Integrity Unknown** | Lock 2 Leaking | Double the error margin (Upper bound for reserves). |
  | **Organizational "Vibes"** | N/A | **Ignore.** (See Case 3). |

  ---

  ### Worked Cases

  Here's how this runs in the wild. I've signed off on these using the protocol above.

  #### Case 1: Gene-Drive Malaria Release
  *   **Published Chance:** 2% ecological failure.
  *   **Internal Memo:** Simulation grid didn't account for temperature sensitivity in the specific release zone (avg temp 2°C higher than model baseline).
  *   **Run-through:**
      1.  **Evidence:** Physical parameter (Temp). (Step 1A)
      2.  **Baked-In?** No, model used baseline temps. (Step 2: Lock Picked).
      3.  **Direction:** Higher temp drives faster mutation/spread. Bias is **Up**. (Step 3A).
      4.  **Admissible?** Yes, temp is physical. (Step 4).
      5.  **Adjustment:** Published 2%. Bias is Up. Distance to 100% is 98%. Shift 20% of 98% (~19.6%).
      *   **New Credence:** ~21.6%.
  *   **Decision:** Reserves increased significantly. The model was too cold, literally.

  #### Case 2: Satellite-Debris Cascade
  *   **Published Chance:** 0.1% cascade chance.
  *   **Internal Memo:** Tracking database updated with crowd-sourced entries last week. Verification status unknown.
  *   **Run-through:**
      1.  **Evidence:** Data integrity. (Step 1B/A hybrid).
      2.  **Baked-In?** The model *used* this data, but the data is suspect. The model assumes data is truth. (Step 2: Lock Leaking).
      3.  **Direction:** Unknown. Could be missing debris (risk up) or false positives (risk down). Treat as **Pure Noise**. (Step 3B).
      4.  **Admissible?** Yes, input data is physical. (Step 4).
      5.  **Adjustment:** Keep mean at 0.1%. Double the error margin. If model said +/- 0.05%, we now treat as +/- 0.1%.
      *   **New Credence:** 0.1% (mean), but reserve capital calculated on the **0.2% upper bound**.
  *   **Decision:** Mean stays low, but we hold extra capital because the "bucket is leaky." We don't know if the water is going out or coming in.

  #### Case 3: Synthetic-Pathogen Containment
  *   **Published Chance:** 4% breach chance.
  *   **Internal Memo:** Lab culture is "reckless." Staff are overworked, politics are toxic, morale is low. No specific protocol violations cited.
  *   **Run-through:**
      1.  **Evidence:** Organizational culture. (Step 1C).
      2.  **Baked-In?** N/A.
      3.  **Direction:** Implies risk up.
      4.  **Admissible?** **NO.** (Step 4). The memo cites "politics" and "morale," not skipped sterilization cycles or broken airlocks. Unless Engineering can certify that "low morale" = "X% increase in human error rate," this is inadmissible for pricing.
      5.  **Adjustment:** None.
      *   **New Credence:** Stays at 4%.
  *   **Decision:** This is the hard one. Your gut says "this lab is a ticking bomb." The procedure says "4%."
      *   *Why?* Because we cannot price "recklessness" without a physical translation. If you sign off based on the vibe, you're gambling, not calibrating.
      *   *Action:* Stick to 4% for the reserve calc. **However**, flag this for the Underwriting Director as a "Reputational/Non-Quantifiable Risk." We might decline the risk entirely, but not because the *math* changed.

  ---

  ### Where This Procedure Breaks (Read This)

  I need you to understand where I'm still on the hook. This checklist doesn't eliminate judgment; it just boxes it.

  1.  **The "Physical Translation" Gap:** In Case 3, I told you to ignore the culture memo. But what if the memo says "staff are skipping double-checks"? That *is* physical. The line between "culture" and "protocol" is blurry. **If you can't decide if evidence is physical, send it to me.** Do not make the call yourself.
  2.  **The 20% Shift:** Why 20%? It's a heuristic. It's arbitrary. It's there to stop you from moving the number to 100% on a hunch. If you have hard data on the model error (e.g., "the code ignores friction"), don't use the 20% rule. Use the physics. The rule is for when you know the model is wrong but don't know exactly by how much.
  3.  **Deep Disagreements:** If Engineering says the model is solid and Physics says it's trash, this checklist doesn't solve that. It just forces you to categorize the disagreement. If you can't resolve Lock 1, treat it as **Pure Noise** (Case 2) and widen the reserves.

  **Final Note:**
  The goal isn't to be right every time. It's to be consistent. If we lose money on Case 3 because the lab blew up due to "morale," we lose money. But if we lose money because we priced "morale" differently than we did last time, we're insolvent.

  Run the checklist. Flag the judgment calls. Sign off.

  — Senior Calibrator
