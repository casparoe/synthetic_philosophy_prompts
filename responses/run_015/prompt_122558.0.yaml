  **Conceptual Sketch**
  *   **Confess:** The ritual act; the demand to speak truth to authority (the app).
  *   **Norm:** The statistical average; the hidden standard shaping the "choice."
  *   **Gaze:** Internalized surveillance; seeing oneself as an object of knowledge.
  *   **Soul:** The supposed interior depth; actually produced by the surface logging.
  *   **Number:** The datafication of affect; reducing quality to quantity.
  *   **Docile:** The resulting subject; manageable, productive, self-policing.

  ***

  The night begins when I am told to **confess**,
  To pick a shape that fits the hidden **norm**,
  And meet the screen's unblinking, blue-lit **gaze**.
  I search for depth and find a manufactured **soul**,
  Reduced to stars, a rating, or a **number**,
  And call this discipline being **docile**.

  I thought the cage was made to keep me **docile**,
  But now I rush to open up and **confess**,
  Believing data saves the fragmented **number**.
  I align my grief to fit the healthy **norm**,
  Convinced this graph reveals my private **soul**,
  While welcoming the algorithm's **gaze**.

  There is no eye outside this digital **gaze**,
  Only the self that learns to be **docile**,
  Parsing the dark to name the hidden **soul**.
  I type the words I think I should **confess**,
  A truth that bends to fit the curved **norm**,
  And lose the weight of feeling in a **number**.

  It is not I who counts the **number**,
  But the interface that directs the **gaze**,
  Promising peace if I obey the **norm**.
  I offer up a body rendered **docile**,
  Demanding that the void begin to **confess**,
  And call the echo proof of having **soul**.

  What depth is this, this quantified **soul**,
  That changes meaning with the shifting **number**?
  I am the priest compelled to **confess**,
  Avoiding silence under software **gaze**.
  To be upright is to be **docile**,
  Safe within the bounds of the **norm**.

  I break the graph to question every **norm**,
  To speak without producing **soul**,
  To stand before the light and not be **docile**.
  I will not be reduced to any **number**,
  I turn my face away from that **gaze**,
  And risk the truth without the need to **confess**.

  ***

  **Note**
  The late Foucault shift to *parrhesia* (fearless speech) is contested; it is not an exit from power but a different risk relation. The sestina's rigid recursion mirrors the confessional trap perfectly, making the envoi's claim of escape formally ironic. I fudged the philosophy slightly: *parrhesia* requires a human listener, not a void, so the app remains the authority. The form holds the speaker even in the turn; the "escape" is performative, not ontological. Accuracy demanded admitting the trap remains, even if the speaker risks stepping outside the categories.
