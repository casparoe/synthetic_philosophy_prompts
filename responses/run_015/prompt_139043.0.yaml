answer: |-
  Here is the specification for a theory of imprecise credence tailored to severe uncertainty in catastrophic risk, followed by the incompatibility results you asked for.

  ### Part I: The Requirements Specification

  **1. Belief-Preference Separation**
  *   **Requirement:** The formalism must distinguish between uncertainty about the world (belief) and uncertainty about the value of outcomes (preference). A widening interval must not be mathematically interchangeable with a concave utility function.
  *   **Case:** In catastrophic risk, a decision to mitigate might stem from thinking the probability is high-but-unknown (imprecision) versus thinking the outcome is unbearable (risk aversion). Conflating them prevents you from updating the probability when new models arrive without re-calibrating your utility function.
  *   **Verdict:** **Non-negotiable.** If the framework cannot separate these, it is just disguised utility theory and fails the "several credible models disagree" use case.

  **2. Learning Sensitivity (Asymptotic Convergence)**
  *   **Requirement:** As relevant evidence accumulates, the representor (the set of probability functions) must shrink. In the limit of infinite exchangeable data, the interval should converge to a point.
  *   **Case:** A coin of unknown bias starts as $[0, 1]$. After 10,000 heads, it should be near $[1, 1]$. If imprecision persists despite overwhelming data, the system is dogmatic, not uncertain.
  *   **Verdict:** **Non-negotiable.** A theory that forbids "washing out" is useless for forecasting where calibration records exist.

  **3. Updating Coherence (Handling Dilation)**
  *   **Requirement:** The theory must specify how the representor changes upon observing evidence $E$. It must explicitly account for *dilation* (where $P(H|E)$ is less precise than $P(H)$ for every partition of $E$) rather than hiding it.
  *   **Case:** As you noted, if two priors agree on the marginal but disagree on the likelihood, conditioning can widen the posterior interval. The theory must state whether this is a bug (to be avoided by restricting the representor) or a feature (to be accepted as genuine ignorance).
  *   **Verdict:** **Non-negotiable (as an account), Negotiable (as a constraint).** You need a rule that tells you what happens. Whether you *require* "No Dilation" is a theoretical preference that may force collapse (see Part II).

  **4. Dynamic Consistency**
  *   **Requirement:** A plan chosen at $t_0$ must remain choice-worthy at $t_1$ after updating, provided no new information relevant to the decision has arrived other than the passage of time/resolution of uncertainty.
  *   **Case:** In sequential catastrophic risk management (e.g., "monitor then mitigate" vs. "mitigate now"), you cannot afford to reverse your own strategy simply because you updated.
  *   **Verdict:** **Non-negotiable.** Without this, the decision theory cannot guide sequential action.

  **5. Decisiveness (Choice Function)**
  *   **Requirement:** The theory must output a non-empty set of admissible actions for any finite decision problem. It cannot return "no preference" for all options in standard cases.
  *   **Case:** A policy must be chosen. A framework that yields indeterminacy for every non-trivial decision is descriptively accurate but normatively useless.
  *   **Verdict:** **Non-negotiable.** However, *which* actions are chosen (Maximin vs. E-admissibility) is a parameter of the theory.

  **6. Representor Convexity**
  *   **Requirement:** If $P_1$ and $P_2$ are in the representor, then $\lambda P_1 + (1-\lambda)P_2$ must also be in the representor.
  *   **Case:** If two experts are each permissible, is a randomization between them permissible? Convexity simplifies the math (linear programming) and ensures mixture acts are handled smoothly.
  *   **Verdict:** **Preference.** Non-convex sets are possible but computationally nightmarish and lack a clear behavioral interpretation. Convexity is standard for tractability.

  **7. Weight of Evidence Distinction**
  *   **Requirement:** The formalism should distinguish between $P(H) = 0.5$ due to symmetry/ignorance and $P(H) = 0.5$ due to balanced evidence.
  *   **Case:** Keynes's distinction. In standard Imprecise Probability (IP), ignorance is $[0, 1]$ and balanced evidence is $[0.5, 0.5]$. The interval width *is* the weight.
  *   **Verdict:** **Satisfied by Default.** Standard IP handles this naturally (width = imprecision). No extra dimension needed unless you want to separate "imprecision" from "confidence in the imprecision."

  **8. Aggregation and Scoring**
  *   **Requirement:** There must be a rule for pooling intervals from multiple analysts and a proper scoring rule that incentivizes reporting the true interval rather than shrinking it to maximize points.
  *   **Case:** Forecasting tournaments need to reward honesty. Standard Brier scores punish intervals; linear scoring rules incentivize reporting $[0, 1]$ to guarantee a non-zero score.
  *   **Verdict:** **Non-negotiable for use case.** Without a proper scoring rule for sets, you cannot calibrate forecasters or aggregate models reliably.

  ---

  ### Part II: The Incompatibility Results (The Negative Part)

  Your suspicion is correct: there is a triangle of tension, but it is sharper than folklore often admits. The core conflict is not just about dilation; it is about **Dynamic Consistency, Caution, and Non-Collapse.**

  #### 1. The Dynamic Consistency Theorem (The Collapse Result)
  *   **The Conflict:** Dynamic Consistency + Cautious Decision Rule (e.g., $\Gamma$-Maximin) + Element-wise Conditioning.
  *   **The Result:** If you demand that an agent's sequential plans remain consistent *and* they make decisions using a cautious rule (maximizing the minimum expected utility over the set) *and* they update by conditioning every prior in the set, **the representor must be a singleton.**
  *   **Why:** To maintain dynamic consistency with a cautious rule, the agent must value information in a way that aligns with a single prior. If the set has width, the "worst case" prior at $t_0$ might not be the "worst case" prior at $t_1$ after conditioning. This creates a preference reversal (dynamic inconsistency). To fix this without abandoning caution, you must restrict the set to one prior.
  *   **Verdict:** You cannot have a robust theory of imprecise credence that preserves standard Dynamic Consistency and standard Maximin decision rules. You must sacrifice one.
      *   *Sacrifice Consistency:* Accept that you might change your mind sequentially (common in IP).
      *   *Sacrifice Caution:* Use E-admissibility (choose any act optimal for *some* prior), which allows consistency but permits choosing acts that are disastrous under other priors in the set.
      *   *Sacrifice Non-Collapse:* Admit you are effectively Bayesian with a hyper-prior.

  #### 2. The Dilation Theorem
  *   **The Conflict:** Element-wise Conditioning + Convex Representor + Independence.
  *   **The Result:** For almost any convex set of priors, there exists a partition of events such that conditioning on *any* element of the partition widens the posterior interval compared to the prior.
  *   **Why:** If your priors disagree on the correlation between the hypothesis and the evidence, learning the evidence forces the posteriors to diverge more than the priors did.
  *   **Verdict:** "No Dilation" is not a viable requirement if you use element-wise conditioning on convex sets.
      *   *The Fix:* You must either restrict the class of allowable representors (making the theory less general), change the updating rule (e.g., natural extension or full Bayesian updating with a hyper-prior), or accept that looking at data can rationally increase uncertainty.
      *   *Implication for you:* If you require "Learning Sensitivity" (Req 2) to mean "Intervals always shrink," you break the theory. You must allow intervals to widen locally (dilation) even if they shrink globally (asymptotics).

  #### 3. The Scoring Rule Impossibility
  *   **The Conflict:** Proper Scoring + Incentive for Precision + Interval Reporting.
  *   **The Result:** There is no strictly proper scoring rule for intervals that incentivizes both honesty *and* precision without additional constraints.
  *   **Why:** A linear scoring rule $S = 1 - (U - L)$ incentivizes shrinking the interval to $[0,0]$ (or a point) regardless of truth to maximize the score. A rule that rewards coverage incentivizes $[0, 1]$. To get honesty, you need a rule that penalizes width but rewards coverage (e.g., Winkler score), but these are only proper if the forecaster has a specific loss function over interval width, which reintroduces a preference parameter into the belief report.
  *   **Verdict:** You cannot score "imprecise credences" purely on accuracy. You are inevitably scoring "credences + a tolerance for ambiguity." This blurs Req 1 (Belief-Preference Separation) in practice.

  ### Summary of Trade-offs

  To build the system you want, you have to cut one of these corners:

  1.  **If you keep Dynamic Consistency:** You must abandon Maximin-style caution. You will likely end up with E-admissibility, which means your "decision" might be a set of options including both "mitigate" and "do nothing," forcing a secondary tie-breaker (which effectively collapses the set).
  2.  **If you keep Caution (Maximin):** You must accept Dynamic Inconsistency. You will have to pre-commit to strategies at $t_0$ and acknowledge that at $t_1$ you will want to deviate. This is manageable in policy (binding commitments) but cognitively dissonant for an individual agent.
  3.  **If you keep No Dilation:** You must abandon Element-wise Conditioning. You will need a more complex updating rule (like a hyper-prior), which pushes you back toward precise Bayesianism, defeating the purpose of the imprecise framework.

  **Recommendation for your Use Case:**
  For catastrophic risk with model disagreement, **sacrifice Dynamic Consistency.** Adopt **Element-wise Conditioning** (for transparency) and **E-admissibility** (to keep options open). Accept that intervals may **Dilate** (acknowledge that data can reveal model conflict). Use a **Winkler-style score** but treat the "width penalty" as a policy parameter, not a truth metric. This preserves the "garbage can" separation (Req 1) and allows for severe uncertainty without collapsing into a single prior, at the cost of sequential coherence.
