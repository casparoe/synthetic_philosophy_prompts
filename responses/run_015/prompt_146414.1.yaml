answer: |-
  **Project Title:** Intervention-Relative Identifiability in Inverse Reinforcement Learning

  **Abstract**
  Inverse Reinforcement Learning (IRL) typically treats reward functions as intrinsic properties of an agent, identifiable solely from observed trajectories and transition dynamics. This proposal challenges that assumption. In assistive robotics—such as a wheelchair-mounted arm steered by a user with limited motor control—the demonstrator's action repertoire is strictly narrower than the deploying agent's. Standard IRL conflates preference with capacity: a user who never reaches for a cup at the table center may prefer it there but find reaching costly. When the assistive agent gains the capacity to reach centrally, a reward function fitted to the constrained behavior may generalize catastrophically. I propose that reward identifiability is not a property of data alone, but of the data paired with the *class of interventions* intended for deployment. This project will formalize a taxonomy of intervention classes, characterize the equivalence classes of rewards indistinguishable under each, and empirically measure how reward ambiguity shrinks as the intervention class expands. The outcome will be a theoretical framework for capacity-relative identification and a practical checklist for practitioners to determine when their inferred rewards are safe to deploy under expanded agency.

  **Research Question and Taxonomy**
  The core question is determinate: For a given set of observed trajectories generated under a constraint set $C_{obs}$, and a intended deployment intervention class $\mathcal{I}$, what is the equivalence class of reward functions $\mathcal{R}_{eq}$ that produce identical behavior under $\mathcal{I}$? I conjecture that $\mathcal{R}_{eq}$ shrinks as $\mathcal{I}$ becomes richer. I will formalize a hierarchy of five intervention classes:
  1.  **In-Distribution Prediction:** Predicting actions under the same constraints as observation.
  2.  **Dynamics Shift:** Changing environmental transitions while holding the agent's action set fixed.
  3.  **Capacity Expansion:** Expanding the agent's action set beyond the demonstrator's (the assistive robotics case).
  4.  **Choice Architecture:** Altering the choice set presented to a human (nudging/reranking).
  5.  **Preference Manipulation:** Interventions that alter the underlying reward function itself.

  The hypothesis is that classic non-identifiability results (many rewards fit one policy) correspond to Class 1. As we move to Class 3, rewards that conflated capacity costs with intrinsic value will diverge in their recommended actions. The theoretical deliverable is a characterization of these equivalence classes, showing that identification is only meaningful relative to the intended intervention.

  **Relation to Existing Literature**
  Current debates in IRL often focus on statistical priors—maximum entropy versus Bayesian weight priors versus feature matching—as the primary lever for resolving ambiguity. I argue these are proxy fights about deployment. A maximum entropy prior assumes a specific type of noise that may not hold when the action set expands; a Bayesian prior over weights encodes assumptions about which rewards are plausible *under specific interventions*. By making the intervention class explicit, these disputes dissolve into empirical questions: does this regularizer preserve the correct equivalence class for Class 3 interventions?

  This work also intersects with economic revealed preference theory. Economists have long studied inference under capacity constraints. However, standard revealed preference assumes the budget set is fixed during both observation and choice, or that changes are known parametrically. In assistive autonomy, the "budget set" (the motor repertoire) changes structurally between observation (human alone) and deployment (human plus robot). The observer does not know the constraint cost function, only the constrained choices. This project operationalizes that gap: it is not merely inferring preferences given constraints, but inferring preferences that remain valid when constraints are lifted by the agent. This distinguishes the work from pure philosophy (by providing empirical falsification conditions) and from pure engineering (by requiring formal equivalence class characterization).

  **Methodology and Empirical Stress Test**
  The project will proceed over six months at 60% effort, focusing on synthetic environments to avoid IRB delays while isolating the structural variables.
  1.  **Formalization (Months 1-2):** Define the intervention taxonomy and derive the equivalence class conditions for Classes 1–3. This involves mapping the geometry of reward functions that are indistinguishable under constrained action sets but distinguishable under expanded sets.
  2.  **Synthetic Experiments (Months 3-4):** I will implement two environments. First, a discrete GridWorld where the demonstrator is restricted to a subset of moves (e.g., no diagonals) while the agent has full movement. Second, a continuous-control simulation resembling a assistive robotic arm, where the demonstrator policy is constrained by limited joint velocity or range. I will fit multiple reward models (using standard IRL libraries) to the constrained data. Then, I will deploy these rewards in the expanded action space and measure the divergence in resulting policies. The metric will be the disagreement rate among reward-consistent policies as the action set expands.
  3.  **Practitioner Deliverable (Months 5-6):** Based on the experimental results, I will produce a one-page "Intervention Checklist." This tool will allow a practitioner to input their deployment context (e.g., "I am expanding the action set") and receive a diagnosis of the remaining ambiguity (e.g., "Cost-to-reach is confounded with value") and a recommendation for data collection (e.g., "Collect trajectories under a temporarily expanded interface rather than more standard trajectories").

  **Risk and Failure Conditions**
  This project could fail in two distinct ways. First, the hierarchy might collapse: it may turn out that capacity expansion does not refine the equivalence class any more than dynamics shifts do, implying the structural distinction I propose is mathematically redundant. I will know this if the divergence metrics in the continuous-control simulation show no significant separation between intervention classes. Second, the work may amount to a relabeling of existing identifiability literature. To mitigate this, I will explicitly benchmark against standard identifiability bounds; if the "intervention-relative" bounds offer no tighter constraints than existing data-relative bounds, the project will pivot to documenting why that is the case. A negative result here is still valuable: it would demonstrate that current IRL regularization techniques are already doing the heavy lifting, or that the problem is fundamentally harder than structural framing suggests.

  **Scope and Timeline**
  This is a pilot fellowship proposal. The scope is limited to synthetic data and formal characterization; it does not include human subject research or new hardware deployment. The goal is not to solve assistive robotics broadly, but to resolve the specific framing ambiguity that currently stalls reward modeling in capacity-mismatched settings. By month six, I aim to have a preprint detailing the taxonomy and the empirical divergence results, alongside the practitioner checklist. This output is designed to satisfy the need for formal rigor (addressing the theoretical gap), engineering utility (addressing the deployment gap), and economic clarity (addressing the constraint transfer gap), without overextending into data collection or philosophical speculation unmoored from measurement.
