answer: |-
  Good morning, everyone. It's lovely to see such a full room, and particularly nice to see such a mix of faces. We've got the heavy hitters here who've wrestled with every notebook and typescript, and we've got friends and family who probably just know Wittgenstein as the bloke who said language is a game and left it at that. Honestly, that's probably the best possible way to start.

  I've been asked to kick things off, to set the tone. But given the split in this room, I think the last thing we need is a lecture. If I start quoting section numbers, I'll lose half of you; if I dumb it down too much, I'll insult the other half. So, I want to try something else. I want to talk about a picture. Or rather, how we look at one.

  There's a common misunderstanding about religious belief that Wittgenstein spent a lot of energy trying to untangle. It's the idea that believing in God, or the Last Judgement, is like having a scientific hypothesis that just happens to be a bit shaky. You know the sort of thing: treating God like a hidden object in the universe, something we might find evidence for if we had better telescopes or sharper arguments. Wittgenstein thought this was a category mistake. He reckoned that religious belief isn't a botched explanation of how the world works; it's more like the rules by which you decide to live your life. It's not about predicting the weather; it's about how you stand in the rain.

  But I want to push that a bit further this morning. I want to offer you an image to hold onto during the sessions.

  Think of a painting. When we look at a painting, we usually focus on the picture inside—the colours, the shapes, the subject matter. We might argue about whether the tree looks like a real tree, or if the perspective is right. Now, imagine religious belief isn't the picture inside the canvas. Imagine it's the frame around it.

  If belief is the frame, then it doesn't compete with the facts inside the picture. The frame doesn't tell you what colour the sky is; it tells you how to view the sky. It determines whether what you're looking at is a mere arrangement of paint or a window onto something else. Without the frame, you've just got canvas and pigment. With the frame, you've got a representation. You've got meaning.

  This changes how we understand disagreement. If I'm a believer and you're not, we aren't necessarily arguing about the same facts inside the picture. We aren't just looking at the same evidence and disagreeing on the conclusion. It's deeper than that. It's that we're operating with different frames. When a believer talks about the Last Judgement, they aren't making a prediction about a future event that might not happen. They're expressing a stance towards their life *now*. They're saying, 'This is the frame through which I see my actions having weight.'

  For the scholars here, you'll recognise this touches on the idea of a system of reference, but without the jargon. For everyone else, it means that religious language isn't trying to do the same job as scientific language. It's not trying to describe the furniture of the universe; it's trying to organise the room.

  So, over the next few hours, when we talk about faith, doubt, or ritual, try not to ask, 'Is this factually correct?' Ask instead, 'What kind of frame is this? What does it allow us to see? And what does it leave out?'

  If we can keep that image in mind—that belief is the frame, not the picture—we might find we stop talking past each other. We might stop treating faith as a failed science, and start seeing it as a distinct way of being human.

  Anyway, that's enough from me. We've got a brilliant programme ahead, and I'd much rather you got into the discussions than listened to me ramble. So, let's get on with it. Thank you.
