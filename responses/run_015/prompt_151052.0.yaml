answer: |-
  You have put your finger on one of the most persistent and frustrating debates in the philosophy of social science. While there isn't a single, catchy colloquial term like "gaslighting" that covers this exact scenario, there are established technical terms in logic and social theory that describe it precisely.

  In the philosophy of science, this maneuver is called an **Immunization Strategy** (or an **Ad Hoc Rescue**). In the specific context of Marxist or materialist theory, critics often refer to it as the **Misapplication of Relative Autonomy**.

  Here is the breakdown of the name, the logic, and how to draw the boundary between a genuine nuanced view and this "heads-I-win" pattern.

  ### 1. The Established Names

  **The Logical Term: Immunization Strategy**
  Coined by the German philosopher Hans Albert (building on Karl Popper), this describes when a theorist protects a core belief from criticism by adding exceptions *only after* counter-evidence appears. The theory is "immunized" against falsification. In your example, the "core" is economic determinism. When culture aligns, the core stands. When culture contradicts, the "autonomy" exception is injected to save the core.

  **The Theoretical Term: Special Pleading**
  This is the formal logical fallacy. It occurs when someone applies a standard (economic determination) to cases that support their view, but demands a different standard (cultural autonomy) for cases that contradict it, without providing an independent rule for when to switch standards.

  **The Specific Context: The "Relative Autonomy" Escape Hatch**
  In Marxist sociology, the concept of **"Relative Autonomy"** (developed by thinkers like Gramsci and Althusser) was originally intended to fix the problem of "vulgar Marxism" (the idea that economics *directly* dictates art). However, critics argue that when "relative autonomy" is invoked *only* to explain away anomalies, it becomes an **"Ad Hoc Hypothesis."** Analytic Marxists like Jon Elster have criticized this specifically as a **"Functionalist Tautology,"** where everything is assumed to serve the economy unless proven otherwise, at which point it's labeled "autonomous."

  ### 2. The Boundary: Nuance vs. Escape Hatch

  You asked where the boundary should be drawn. The difference between a genuinely nuanced theory and an "escape hatch" comes down to **predictive specification** versus **post-hoc rationalization.**

  **The Escape Hatch (The Pattern You Described)**
  *   **Timing:** The explanation is generated *after* the fact (ex-post).
  *   **Mechanism:** There is no clear rule for *when* the economy determines culture and *when* culture is autonomous.
  *   **Direction:** Causality is one-way (Base → Superstructure), but the arrow is allowed to bend invisibly when convenient.
  *   **Example:** "This law helps the capitalists, so it was economically determined." / "This law hurts the capitalists? Well, culture has its own logic."

  **The Genuine Nuance (Reciprocal Causation)**
  *   **Timing:** The conditions for autonomy are specified *beforehand* (ex-ante).
  *   **Mechanism:** The theory explains *why* a specific sphere (like art) might resist economic pressure in specific contexts (e.g., institutional insulation, high social prestige).
  *   **Direction:** Causality is **mutually constitutive** (or bidirectional). The economy shapes culture, but culture also shapes the economy.
  *   **Example:** "Economic pressure influences law, *but* the legal system has institutional rules that sometimes block that pressure. We expect to see autonomy when X and Y conditions are present."

  ### 3. How to Test the Argument

  If you want to call out this asymmetry without getting bogged down in semantics, you can ask for **"Ex-Ante Conditions."**

  A genuine nuanced view will tell you *in advance* under what conditions culture will push back. For example, a sociologist might say, "Art is usually shaped by the market, *except* when it is heavily subsidized by the state, in which case it follows political logic."

  If your interlocutor cannot tell you *when* to expect determination and *when* to expect autonomy until *after* they see the outcome, they are using an **Immunization Strategy**. They are not describing how the world works; they are describing a system that cannot be wrong.

  ### 4. The Better Framework

  The reason this argument feels so slippery is that the "Base and Superstructure" model itself is often the problem. Most contemporary social theorists (like Anthony Giddens or Pierre Bourdieu) have moved away from "determination" entirely.

  They use frameworks like **Structuration Theory** or **Field Theory**. In these models, economics, law, and art are all distinct "fields" or "structures" that constantly influence each other. None is the ultimate "driver." In this view, asking whether economics *determines* art is like asking whether the engine determines the steering wheel in a car. They are parts of a single system that constrain and enable each other.

  ### Summary
  *   **The Name:** **Immunization Strategy** or **Ad Hoc Rescue** (Logic); **Misapplication of Relative Autonomy** (Social Theory).
  *   **The Flaw:** **Special Pleading** (applying rules inconsistently).
  *   **The Boundary:** Does the theory predict *when* autonomy happens **before** the event, or does it explain it **after** the fact?
  *   **The Fix:** Move from "Determination" (one-way) to **"Mutual Constitution"** (two-way).

  If they can't specify the conditions for autonomy in advance, they aren't doing social science; they're doing apologetics.
