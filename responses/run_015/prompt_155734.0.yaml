answer: |-
  # The Bedside Cognitive Architecture Protocol (BCAP)
  **For:** Disorders of Consciousness (DoC) Assessment  
  **Time:** 30–40 Minutes  
  **User:** Rotating Resident / Neuropsychology Team  
  **Goal:** Distinguish reflex from learning, and learning from thinking.

  ---

  ## PART 1: THE PROCEDURE (Laminated Card Front)

  **WARNING:** Do not repeat commands more than **3 times** per session. Repetition shapes behavior (Skinnerian) and masks capacity (Popperian). If you train the patient, you corrupt the data.

  ### LEVEL 1: Darwinian (Hardwired Survival)
  *Hypothesis: The brainstem and subcortical structures are intact; no evidence of learning.*
  *   **Probe:** Sudden loud noise (clap), bright light, or noxious stimulus (pressure).
  *   **Positive Evidence:** Startle, eye-opening, withdrawal, or autonomic change (HR/BP spike).
  *   **Scaffolding Check:** N/A (Reflexes are not scaffolded).
  *   **Stop Rule:** If positive, proceed to Level 2. If negative, assess for brain death criteria (outside this protocol).
  *   **Family Statement:** "His body is protecting itself from danger, but we see no sign yet that he perceives *you*."

  ### LEVEL 2: Skinnerian (Shaped by Consequences)
  *Hypothesis: The patient can learn associations within a lifetime, but only through trial-and-error in the world.*
  *   **Probe:** Pair a neutral stimulus with a reward/pain relief *during* the session (e.g., "When you hear the beep, you get a moist swab"). OR observe habituation (response decreases to repeated non-threatening noise).
  *   **Positive Evidence:** Response rate changes *within* the session based on consequence.
  *   **Crucial Constraint:** If the behavior (e.g., hand squeeze) has been practiced daily by family/nurses for weeks, **attribute to Level 2**, even if reliable. This is conditioning, not necessarily command-following.
  *   **Stop Rule:** If positive, proceed to Level 3. If negative (no learning/habituation), stop.
  *   **Family Statement:** "He can learn from experience, like dreaming where things change, but we don't know if he can plan."

  ### LEVEL 3: Popperian (Internal Simulation)
  *Hypothesis: The patient can test actions 'in their head' before doing them. Mistakes are internal, not physical.*
  *   **Probe:** **Novel Command.** A request never made before, with no prior reinforcement history. (e.g., "Touch your ear with your left hand" when only "squeeze" was ever trained).
  *   **Positive Evidence:** Correct response on **first or second trial**.
  *   **Scaffolding Check:** Remove the cue. If you say "Touch your ear" and point to your own ear, stop pointing. Does the response survive without the visual prop?
  *   **Stop Rule:** If positive, proceed to Level 4. If negative (fails novel command but does trained command), stop at Level 2.
  *   **Family Statement:** "He can think about an action before doing it. He is not just reacting."

  ### LEVEL 4: Gregorian (Cultural Tools)
  *Hypothesis: The patient uses tools (words, numbers, rituals) built by others to think.*
  *   **Probe:** **Generative Language/Symbol Use.** Answering a question where the answer was not rehearsed, or using a tool (comb, key) appropriately without demonstration.
  *   **Positive Evidence:** Novel combination of words, or correct answer to "What is your mother's name?" (if not rehearsed).
  *   **Scaffolding Check:** **The Strip-Down.** If the patient says "Hello," ask "How are you?" If they only say "Hello" to "Hello," it is an echo (Level 2). If they answer the content, it is Level 4.
  *   **Stop Rule:** End of protocol.
  *   **Family Statement:** "He is using his memories and language to talk with us. He is here."

  ---

  ## PART 2: DECISION NODES & HAND-OFFS (Laminated Card Back)

  ### THE "REPETITION TRAP" WARNING
  **[Contested/High Risk]** Current ward practice (10 reps/session, daily) actively manufactures Level 2 evidence. An improving score over weeks of identical commands is **not** evidence of Level 3 recovery. It is evidence of successful conditioning by the staff.
  *   **Action:** If a patient improves on a *repeated* command, mark as **Level 2 (Conditioned)**. Do not upgrade to Level 3 unless a *novel* command is followed.

  ### THE "SCAFFOLDING" WARNING
  **[Settled]** Familiar voices, names, and music can trigger automated responses in lower-level systems.
  *   **Action:** If a response occurs only to a specific family member's voice or a specific song, you cannot rule out Level 1/2 automatism. You must test with a *neutral* voice or novel stimulus to claim Level 3.

  ### THE "INSTRUMENT MISMATCH" HAND-OFF
  **[Contested]** If bedside exam says Level 1, but fMRI/EEG says Level 3/4 (e.g., motor imagery tasks):
  *   **Action:** **HAND-OFF TO ETHICS/TEAM.**
  *   **Reason:** This is a conflict between *behavioral capacity* and *physiological capacity*. The taxonomy describes functional minds. A mind that cannot move cannot act Gregorianly in the world, even if it simulates internally.
  *   **Decision:** This is not a fact question; it is a values question. Does "internal only" consciousness warrant the same care as "interactive" consciousness? The resident cannot decide this.

  ### FAMILY COMMUNICATION LIMITS
  **[Epistemic Boundary]** This protocol measures **Cognitive Architecture**, not **Personhood** or **Suffering**.
  *   **Can Say:** "We see evidence of [Level X] processing."
  *   **Cannot Say:** "He is still in there" or "He would want this."
  *   **Why:** A Level 2 mind might suffer. A Level 4 mind might be empty. "Is he in there?" is a question of love and values, not neuropsychology. Hand this question to the palliative team and the family.

  ---

  ## PART 3: EPISTEMIC STATUS & CONTESTED CLAIMS

  *Use this section to brief the rotating resident before they enter the room.*

  1.  **The Hierarchy (Darwinian → Gregorian):**
      *   *[Contested]* Dennett presents this as evolutionary history. In the clinic, treat it as **functional layers**. A Gregorian patient *has* Darwinian reflexes, but a Darwinian patient does *not* have Gregorian tools.
      *   *[Settled]* Higher levels require more neural integration. Failure at Level 1 precludes Level 4.
  2.  **Language Requirement for Gregorian:**
      *   *[Contested]* Does Gregorian *require* language? Some argue symbols or tools suffice.
      *   *Protocol Stance:* We require **generative** use (novel combination). Rehearsed phrases count as Level 2 (Skinnerian).
  3.  **The "Repetition Trap":**
      *   *[Settled in Learning Theory, Ignored in Clinic]* Repeated pairing of Command → Reward creates conditioning.
      *   *Protocol Stance:* We assume improvement on repeated tasks is **training**, not **recovery**, until proven otherwise by novel tasks. This will conflict with ward optimism.
  4.  **Instrument vs. Bedside:**
      *   *[Highly Contested]* Does fMRI motor imagery prove consciousness?
      *   *Protocol Stance:* It proves *capacity for simulation* (Popperian), but without behavioral output, it cannot be Gregorian (no tool use). Treat as a "Hand-Off" case.

  ---

  ## PART 4: CASE RUNS

  ### Case A: The Anoxic Man (54M, 6 months post-arrest)
  *   **Data:** Startles to loud noise. No response to name. Rate unchanged across 3 sessions.
  *   **Protocol Run:**
      *   Level 1 (Darwinian): **PASS** (Startle to noise).
      *   Level 2 (Skinnerian): **FAIL** (No habituation, no learning across sessions).
      *   Level 3/4: **NOT TESTED** (Stop at first failure).
  *   **Result:** **Level 1 Only.**
  *   **Unwelcome Truth:** The team may call this "Vegetative State" and hope for change. The protocol says: "No evidence of learning in 6 months."
  *   **Family Script:** "His brainstem is working; he feels danger. But we have no evidence he hears your voice or knows you are here. We cannot say if he suffers, but he is not interacting."

  ### Case B: The TBI Woman (22F, 3 months post-injury)
  *   **Data:** Squeeze command. Trial 1: 1/10. Trial 6 weeks (daily repetition): 8/10. Ward is delighted.
  *   **Protocol Run:**
      *   Level 1: **PASS**.
      *   Level 2: **PASS** (Behavior changed over time).
      *   Level 3 (Novelty): **FAIL** (No novel commands tested; only "squeeze" used).
      *   **Repetition Trap Flag:** **RED.** The improvement correlates exactly with the frequency of ward repetition.
  *   **Result:** **Level 2 (Conditioned).** *Not* Level 3.
  *   **Unwelcome Truth:** The protocol forces you to tell the team: "We may have trained a reflex. We do not yet know if she understands the command." This will dampen morale.
  *   **Family Script:** "She is learning from what happens to her body. This is good. But we need to see if she can do something new to know if she understands our words."

  ### Case C: The Bilingual Man (61M, Novel English Command)
  *   **Data:** Follows novel English instruction (Level 3/4?) on first try. Cannot track hidden object (Level 1/2 fail?). fMRI shows motor imagery activation when bedside shows nothing.
  *   **Protocol Run:**
      *   Level 1: **MIXED** (No visual tracking, but startle unknown).
      *   Level 3: **PASS** (Novel English command followed).
      *   Level 4: **PASS** (Language comprehension implies Gregorian tools).
      *   **Instrument Mismatch:** **ACTIVE.** fMRI suggests Level 3, Bedside fluctuates.
  *   **Result:** **HAND-OFF.**
  *   **Reason:** The dissociation between high-level language comprehension and low-level visual tracking is neurologically unstable. The fMRI evidence suggests a "locked-in" Popperian mind, but the bedside suggests inconsistency.
  *   **Decision:** This is not a fact finding anymore; it is a weighting of evidence. Does the scan count more than the eye?
  *   **Family Script:** "His brain shows signs of understanding words even when his body doesn't move. This is a rare mismatch. We cannot be certain how much he can do, so we must assume he can hear you."

  ---

  ## PART 5: WHAT THIS PROCEDURE CANNOT DO

  **1. It cannot answer "Is he still in there?"**
  "Being in there" implies a continuous self, a narrative identity, or a capacity for suffering. This protocol measures *processing architecture*. A Level 3 mind can simulate pain without necessarily having a "self" that suffers in the way a family fears. Do not use this tool to justify withdrawal of care. It is a capacity measure, not a value measure.

  **2. It cannot distinguish sleep from absence.**
  A patient may be Popperian but asleep. A negative result is "No evidence *at this time*," not "Evidence of absence."

  **3. It cannot resolve the "Values Hand-Off."**
  When the data says Level 2 but the family says "He always loved this song and he smiled," the family is reporting Gregorian history. The protocol reports Darwinian present. If they conflict, the protocol yields to the family's values regarding *uncertainty*, not to the protocol's hierarchy.

  **4. It cannot prevent you from manufacturing the mind.**
  If you return to the bedside and repeat "Squeeze my hand" fifty times because you want a positive result, you are building a Skinnerian creature. You are not finding the patient; you are shaping a reflection of your own desire. Stop testing when the data is sufficient. Leave the patient alone.
