answer: |-
  # Activity: The Wagered Ambiguity

  **Context:** This activity is designed for the first 35 minutes of a 75-minute seminar. It places students in the position of experimental subjects to generate first-person data on cognitive penetration (CP). The goal is not to prove CP exists, but to demonstrate the *underdetermination* of the evidence: the shift in reports and confidence is palpable, but the etiology (perceptual vs. post-perceptual) remains opaque from the inside.

  ### Materials
  *   **Slides:** A PowerPoint/Keynote deck with three blocks of trials.
      *   *Block 1 (Baseline):* 5 trials of ambiguous characters (e.g., the "B/13" figure) presented for 200ms each.
      *   *Block 2 (Letter Prime):* A sequence of 10 clear letters (A, C, F...) flashed rapidly, followed by 5 ambiguous "B/13" figures.
      *   *Block 3 (Number Prime):* A sequence of 10 clear numbers (10, 12, 14...) flashed rapidly, followed by 5 ambiguous "B/13" figures.
  *   **Response Slips:** Pre-printed slips for each student with columns for: *Trial #, Response (Letter/Number), Wager (0–5 tokens).*
  *   **Tokens:** 20 physical tokens (poker chips or printed paper coins) per student.
  *   **Whiteboard:** To aggregate class data.

  ### Rules & Payoff Scheme
  1.  **Endowment:** Each student starts with 20 "Philosophy Credits."
  2.  **Task:** Identify whether the briefly flashed target is a Letter or a Number.
  3.  **Wager:** Before the target appears, students are told the category probability (e.g., "Most are letters"). During the trial, they must wager 0 to 5 credits on their confidence.
      *   *Correct Response:* Win the wagered amount.
      *   *Incorrect Response:* Lose the wagered amount.
      *   *Ambiguous Trials:* For the critical ambiguous trials, **there is no objective correct answer.** You will tell them there is, but in the debrief, reveal the ambiguity. This is crucial: it tests whether expectation drives confidence in the absence of sensory evidence.
  4.  **Winning:** The student with the highest credit total at the end wins a trivial prize (e.g., choice of seminar snack, or exemption from one response paper). *Note: Emphasize that calibration (confidence matching accuracy) is key to winning.*

  ### Procedure & Timing (35 Minutes)

  **1. Setup and Instructions (5 Minutes)**
  Distribute tokens and response slips. Explain the task: "We are testing perceptual sensitivity under time pressure." Explain the wagering: "If you are sure, bet high. If you are guessing, bet low." Do not mention cognitive penetration yet.

  **2. Block 1: Baseline (5 Minutes)**
  Run 5 trials of the ambiguous B/13 figure without any priming sequence. Students record responses and wagers.
  *   *Instructor Note:* Keep the pace brisk. 200ms per stimulus prevents eye movements that could resolve ambiguity.

  **3. Block 2: The Letter Prime (10 Minutes)**
  Tell students: "In this block, 80% of targets are Letters." Show the rapid sequence of clear letters (inducing a perceptual set/expectation). Immediately follow with 5 ambiguous B/13 targets. Students record responses and wagers.
  *   *Observation:* Watch for increased "Letter" reports and higher wagers compared to Block 1.

  **4. Block 3: The Number Prime (10 Minutes)**
  Tell students: "In this block, 80% of targets are Numbers." Show the rapid sequence of clear numbers. Follow with 5 ambiguous B/13 targets (identical to previous blocks). Students record responses and wagers.
  *   *Observation:* Watch for a reversal in reports and sustained high wagers.

  **5. Data Aggregation (5 Minutes)**
  Collect the slips. Quickly tally the % of "Letter" responses and Average Wager for Block 1, 2, and 3 on the whiteboard.
  *   *Expected Pattern:* Block 1 should be near 50/50. Block 2 should skew heavily to "Letter." Block 3 should skew heavily to "Number." Crucially, average wagers in Blocks 2 and 3 should be *higher* than Block 1, indicating increased confidence driven by the prime, not the stimulus.

  ### The Debrief: Mapping the Philosophy (40 Minutes)

  **Phase 1: The First-Person Report (10 Minutes)**
  Ask the class: "In Block 2, did the ambiguous figure *look* like a B, or did you just *guess* it was a B?"
  *   *Goal:* Elicit the phenomenological claim. Most will say, "It looked like a B."
  *   *Philosophical Hook:* This intuition is the engine of the CP debate. The experience seems saturated with the expectation.

  **Phase 2: The Third-Person Explanation (15 Minutes)**
  Reveal the trick: "The stimulus was identical in all blocks. There was no correct answer."
  *   **Attention vs. Penetration:** Ask if the prime directed their *attention* to features resembling a B (top-down attentional selection) or if it actually altered the *sensory representation* (genuine penetration).
  *   **Perceptual vs. Post-Perceptual:** Introduce the Firestone & Scholl critique. Did the experience change, or just the judgment? Point to the wager data: "Your confidence went up, but the sensory data stayed the same. This looks like response bias. You bet high because the context made you feel safe, not because you saw more."
  *   **The Hard Limit:** Explicitly state that from the data collected (behavioral reports + confidence), we cannot distinguish between a change in *phenomenology* and a change in *criterion*.

  **Phase 3: Epistemic Downgrade (15 Minutes)**
  Transition to Susanna Siegel.
  *   *Scenario:* Suppose a student forms the belief "That was a B" based on their experience.
  *   *Question:* If that experience was caused by my instruction ("Most are letters") rather than the world, does the experience justify the belief?
  *   *Siegel's Claim:* If cognition penetrates perception, it can create an epistemic "bad circle." The belief influences the experience, which then confirms the belief.
  *   *Discussion:* Ask students if their high wagers in Block 2 were epistemically justified. If they say yes, press them on whether they would trust a witness who was primed to see a weapon in an ambiguous hand.

  ### Predicted Failures and Fixes
  1.  **Failure:** Students notice the stimulus is identical immediately.
      *   *Fix:* Insist on the speed. If they catch on, pivot: "Even knowing it's a trick, did it *feel* different?" This strengthens the phenomenological point.
  2.  **Failure:** No shift in data (flat results).
      *   *Fix:* Have a backup slide of "Typical Data from Previous Cohorts" that shows the expected shift. Use this to discuss the *theory* even if the live demo failed.
  3.  **Failure:** Students argue the wager proves perception changed.
      *   *Fix:* Remind them that confidence is a metacognitive judgment, not a direct measure of sensory acuity. High confidence on a coin flip is still a coin flip.

  ### What This Activity Cannot Show
  You must explicitly tell the students: **This activity cannot prove Cognitive Penetration.**
  Everything that happened is compatible with a *Judgment-Only* explanation. The students may have seen the exact same blurry patch in all three blocks but simply reported "B" more often because they wanted to align with the pattern (response bias) or because they attended to B-like features (attentional selection). The "Firestone & Scholl" critique stands: behavioral shifts do not entail phenomenological shifts. You, as the instructor, must supply the philosophical argument that *if* CP were true, this is what it would feel like, while acknowledging the empirical underdetermination.

  ***

  ### Summary Table

  | Activity Moment | What Participants Do | Theoretical Distinction It Targets | Predictable Failure and Fix | What the Activity Cannot Show From Within |
  | :--- | :--- | :--- | :--- | :--- |
  | **Block 1 (Baseline)** | Identify ambiguous B/13 without context; wager confidence. | Establishes a baseline for phenomenological neutrality and metacognitive calibration. | **Failure:** Students squint or discuss answers.<br>**Fix:** Enforce strict timing and silence; treat as calibration. | Cannot establish "neutral" perception; all perception is theory-laden to some degree. |
  | **Block 2 & 3 (Primed)** | Identify ambiguous B/13 after sequences of clear Letters or Numbers; wager confidence. | **Attentional Selection vs. Genuine Penetration:** Does the prime tune the sensory system or just the guess? | **Failure:** No shift in reports.<br>**Fix:** Use backup data from previous runs to simulate the effect for discussion. | Cannot distinguish between *seeing* differently and *judging* differently (The Firestone & Scholl Critique). |
  | **Wagering Scheme** | Risk tokens based on confidence in the identification. | **Perceptual vs. Post-Perceptual:** Tests if expectation inflates confidence independent of sensory evidence (Response Bias). | **Failure:** Students bet max tokens always (risk-insensitive).<br>**Fix:** Remind them accuracy matters for the prize; penalize high-risk/low-accuracy. | Confidence is a metacognitive report, not a direct measure of perceptual content; high wager $\neq$ changed phenomenology. |
  | **Debrief (Siegel)** | Discuss whether the "primed" experience justifies the belief formed from it. | **Epistemic Downgrade:** If belief shapes experience, does the experience lose its power to justify belief? | **Failure:** Students claim the experience is still valid evidence.<br>**Fix:** Push the "hallucination" analogy: if a drug made you see it, would it count? | Cannot resolve the normative question; requires philosophical argument, not empirical data, to determine if the circle is "bad." |
  | **Final Reveal** | Instructor reveals stimuli were identical; no "correct" answer existed for test trials. | **Underdetermination:** Highlights that first-person authority and third-person data both fail to settle the CP debate. | **Failure:** Students feel deceived/disengaged.<br>**Fix:** Frame the deception as necessary to reveal the opacity of our own access. | Cannot prove CP is false; only that the evidence gathered here is compatible with non-CP explanations. |
