      *(Self-Correction)*: Wait, I need to be careful about the definition of Fink. A fink removes the *disposition*. A mask prevents the *manifestation*. In the defibrillator case: Does the heart lose the disposition to fibrillate? Or does it fibrillate and then stop? If it fibrillates, the disposition manifested. If the device stops it *before* it counts as the full manifestation, did the disposition manifest?
