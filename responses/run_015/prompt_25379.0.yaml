      *   *Refinement:* Ensure I don't just say "David is right." I need to explain *why* the metaphysics supports one over the other at specific junctures.
      *   *Self-Correction during drafting:* I initially thought about saying Elena is wrong about the system. But actually, in modern dispositionalism, extrinsic dispositions are a thing. I should acknowledge that. However, the *fink/mask* distinction specifically turns on whether the *basis* is removed. If the basis is the heart tissue, it's a mask. If the basis is the heart+device, it's a fink. The debate is about *which* is the bearer. David assumes Heart. Elena assumes Heart+Device. David's reductio shows why assuming Heart+Device is dangerous. Elena's response tries to ground it in causal dynamics.

      *   *Final Polish:* Make sure to address the "instability" question directly. Is the literature inadequate? Yes, often it treats them as clear-cut when they are context-dependent.

  10. **Final Review against constraints:**
      *   Adjudicate move by move.
      *   Who has the better argument and why?
