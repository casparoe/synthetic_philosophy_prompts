answer: |-
  Good morning. Look around this room. To my left, colleagues who sequence genomes; to my right, colleagues who draft statutes; and everywhere, colleagues who ask what it means to be. We do not share a vocabulary. When a biologist says "function," a lawyer hears "liability," and a philosopher hears "teleology." Usually, that is a barrier. Today, I suggest it is our only tool.

  We are not here to rehearse the cliché that "life is hard to define." We are here because the ground beneath our definitions has physically shifted. For a century, our scientific intuition and our legal frameworks have rested on a tacit assumption: that two specific criteria always travel together. The first is metabolic autopoiesis—the ability of a system to consume energy to maintain its own boundary and repair its structure. The second is evolutionary capacity—the ability to reproduce with variation and subject offspring to selection.

  In nature, these are inseparable. Anything that maintains itself eventually reproduces. Anything that reproduces must maintain itself. But synthetic biology has broken this link. We can now engineer protocells and tissue constructs that sustain continuous, far-from-equilibrium dynamics. They exchange matter, they heal their boundaries, they resist entropy. But they are designed as dead ends. They possess no hereditary mechanism. They cannot evolve.

  This fracture creates an immediate crisis for governance. Our regulatory categories assume that if a system acts alive—if it breathes and repairs—it carries the risks and claims of life. We assume metabolic activity implies evolutionary potential. But now we have entities that act like organisms but behave like machines.

  So, how do we govern them? I want to take a definite stance to launch our deliberations. I argue that **evolutionary potential**, not metabolic activity, must be the governing criterion for classification and regulatory protection.

  Here is the reasoning. The primary reason we regulate biological entities is uncertainty. A chemical spill is dangerous, but its behavior is deterministic. A living population is dangerous because it can adapt. It can overcome the barrier we built, metabolize the toxin we introduced, or migrate where we forbade. The unique risk of "life" is its capacity to change the rules of engagement over time. Similarly, the unique moral claim of living systems rests on their existence as a lineage, a project stretching into the future.

  A synthetic tissue that repairs itself but cannot reproduce is, fundamentally, a clockwork engine. It may be complex, but its future is contained in its initial design. It cannot surprise us evolutionarily. Therefore, it should not trigger the regulatory burdens or moral protections reserved for evolving systems. We should classify it as a sophisticated material, not a biological entity.

  I am aware of the cost of this choice. By prioritizing evolution, we must accept that some entities which intuitively feel "alive"—because they grow, consume, and heal—will be legally and ontologically categorized as non-living. We will be calling a self-repairing synthetic organ a "device." This will feel counterintuitive to the biologists here, who see metabolism as the spark of life. It will feel risky to the lawyers, who worry that a "device" that eats glucose might still escape containment.

  I also want to flag that this argument relies on a contested theoretical commitment. I am explicitly prioritizing a Darwinian framework over a strictly autopoietic one. I am arguing that lineage matters more than process. There are robust philosophical traditions that argue self-maintenance alone grants status. I am rejecting that for the purposes of governance. If we regulate based on metabolism, we cast the net too wide, stifling innovation in materials science with the heavy hand of biosafety. If we regulate based on evolution, we target the source of long-term uncertainty.

  This is why this workshop is necessary. We have built the science that splits these criteria. Now we must build the frameworks to manage the split. If we do not choose a criterion deliberately, the choice will be made for us by accident, or by the first crisis that catches us unprepared.

  Over the next two days, I ask you to challenge this stance. But do not challenge it by retreating to neutrality. We cannot afford to be neutral about where the boundary lies. Let us argue for where the line should be drawn, knowing that on one side lies the machine, and on the other, the lineage.

  Welcome. Let's get to work.
