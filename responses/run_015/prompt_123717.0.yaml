      *   **The Problem:** Explain why current legal/ethical frameworks break down here (they assume metabolism + evolution go together).
      *   **The Argument (The Stance):** Argue for evolutionary potential as the regulatory bright line.
      *   **The Cost:** Acknowledge what is excluded (metabolically active but non-evolving entities) and why that's acceptable/necessary.
