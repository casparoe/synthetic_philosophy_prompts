prompt: |-
  I'm giving the opening remarks at an interdisciplinary workshop on synthetic biology and governance; the audience includes molecular biologists, philosophers of biology, and regulatory lawyers with no shared technical vocabulary. Rather than opening with the cliché that life is hard to define, I want the speech to pivot on a specific conceptual fracture: engineered protocells and synthetic tissue constructs can maintain continuous far-from-equilibrium dynamics—metabolic exchange, structural self-repair, boundary maintenance—without hereditary mechanisms or open-ended evolutionary potential. This splits the two criteria that usually travel together in biological definitions: metabolic autopoiesis and evolutionary capacity. I want this fracture to structure the welcome: it should explain why the workshop exists—our scientific and legal frameworks tacitly assume these criteria are coextensive, and synthetic entities now force them apart—and it should take a committed, reasoned stance rather than surveying options neutrally. Specifically, defend evolutionary potential as the governing criterion for classification and regulatory protection, accepting that some metabolically active synthetic systems will then fall outside "life," and explain what that choice costs. The address should work for both specialists and non-specialists, contain no citations or bibliographic references, and should be written as a five-minute speech. Please take a definite position with clear reasons, and briefly flag where your argument relies on a contested reading of autopoiesis or evolutionary theory.
reasoning: |-
