  **The Case**

  Ms. H, an 82-year-old with advanced Alzheimer's, is permanently incapacitated in a memory care unit. Her new advance directive's Part A unambiguously declines antibiotics for pneumonia, which she now has. Part B states: "I refuse life-prolonging costs because I must preserve my estate for my grandson's medical school tuition; do not spend my savings on me." Her grandson has just been awarded a full merit scholarship, rendering the tuition funds unnecessary; the estate preservation goal is achieved without the sacrifice of her life. Treatment requires a distressing hospital transfer, but offers a return to her baseline peaceful (though passive) existence; without it, she dies comfortably within days. Her current welfare is murky: the transfer is a burden, but the life preserved is not suffering-filled, merely empty. We have no evidence of her other values—whether she hates hospitals independently of cost, or values biological life absent the financial stake—is silent.

  **The Accounting**

  *   **Instruction-Authority (The Hospitalist):** Follow Part A. The checkbox is valid, signed, and triggered. Part B is explanatory fluff with no normative force. Once a competent agent issues a command, their reasons are irrelevant to the command's execution. To query the rationale is to treat the patient as a witness rather than a principal. **Verdict:** Withhold antibiotics.
  *   **Current-Interests (Best Interests):** Weigh the burden of transfer against the value of continued passive existence. Since her welfare is murky but the intervention is physically distressing, the balance tips toward avoiding harm. We are not bound by her past self; we protect her present self. **Verdict:** Withhold antibiotics.
  *   **Rationale-Authority (Your View):** The instruction in Part A was not a categorical command but a *conditional* one, authorized by the necessity stated in Part B. The authority of the refusal was tied to the specific end of funding tuition. That end is now secured without the means (refusal). The refusal lacks a valid authorizing condition. We are not overriding her based on welfare, but acknowledging the instruction is structurally void. Default medical policy (preservation of life) applies. **Verdict:** Administer antibiotics.

  **The Single Feature**

  The work is done by the **specific contingency** in Part B (the grandson's tuition). This ties the authority of the refusal to an external factual condition rather than an internal value state (like "dignity" or "burden").

  **If You Delete It:**
  If Part B read only, "I do not want to spend my savings on me," the rationale (preserve estate) remains active regardless of the grandson's scholarship. She might wish to leave the money to charity or her church. In that case, all three verdicts converge on withholding treatment: the Instruction holds, Current Interests suggest avoiding burden, and the Rationale (save money) remains valid. The divergence disappears.

  **The Hospitalist's Counter**

  " You're conflating *authority* with *speculation*. By making the instruction contingent on external facts she couldn't control, you've turned the advance directive into a guess about what she'd decide if she were here today. The whole point of the practice is to stop us from having this conversation when the patient can't speak. If we start auditing whether the 'conditions' of a directive are still met based on changing financial landscapes, we aren't respecting precedent autonomy; we're practicing substituted judgment with extra steps. You're not enforcing her rationale; you're guessing that because the money isn't needed, she'd want to live. That's exactly the 'what would she want now?' question you claimed to block."

  **Confidence Assessment**

  *   **Case Construction:** High confidence. It meets all negative constraints (no empirical error about dementia, no obvious welfare gain, no clear hypothetical wish).
  *   **Instruction vs. Interests:** High confidence. These are standard, distinct ethical frameworks.
  *   **Rationale-Authority Distinction:** **Low Confidence.** This is the weakest link. It is extremely difficult to argue that "The instruction is void because the reason is gone" without implicitly relying on the presumption that "If the reason is gone, she wouldn't want the instruction." My argument tries to stand on the *logic of conditional commands*, but the Hospitalist's counter highlights that this logic often collapses into substituted judgment. I am least sure that the Rationale-Authority verdict can be sustained without secretly smuggling in a claim about her hypothetical current wishes. If I cannot prove that a "conditional command" retains its structure independent of the agent's likely current will, the Rationale view fails to be distinct from the "What would she want?" view I was tasked to avoid.
