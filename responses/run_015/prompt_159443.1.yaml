prompt: |-
  I am writing a paper on W. E. B. Du Bois on art and politics, and I keep running into a line that is usually traced to his 1926 essay on Negro art: all art is propaganda, sometimes with the rider that the purists will simply have to live with it. I do not want to argue about what Du Bois really meant internally; I want to know what the sentence could be asserting, because in two settings recently it was used to do real argumentative work, and I suspect the work was done by an ambiguity.

  Two settings. In my seminar a classmate used it to collapse the aesthetic/political distinction: if every work is propaganda, she said, then a critic who objects to a contemporary novel's unflattering portrayal of Black life is not doing something different in kind from a critic who objects to its prose, and there is no purely aesthetic residual to which the political complaint must answer. At a reading afterwards, a poet used the same line in the opposite direction: since all art is propaganda, an artist who claims to be above it is merely laundering the dominant group's propaganda, and so Black writers owe it to their audience to make their propaganda explicit and useful.

  Here is my own attempt at sorting the readings, which I would like checked, corrected, and extended. I have been separating three axes. First, what propaganda is supposed to consist in: a causal claim (works reliably move audiences' attitudes), an intentional claim (works are made in order to move attitudes), a semantic or representational claim (works present the world as being a certain way, and presenting it as being a certain way is already a kind of advocacy), or a functional/sociological claim (works serve someone's interests irrespective of anyone's intent, an ideology claim rather than a doctrine claim). Second, whether the is is a stipulation — a redefinition on which art just means shaped, effective, value-laden communication, which would make the sentence analytic and unfalsifiable — or an empirical generalization that could turn out false. Third, whether the upshot is normative (judge works by their propaganda-value; artists should pick a side) or merely diagnostic (politics is always in the room, so much the worse for any criticism that pretends otherwise).

  Three further complications I would like handled rather than set aside.

  (i) Pejorative versus neutral. In ordinary use propaganda connotes deception, the bypassing of the audience's reason, or the service of power. If the word keeps that edge, the slogan is a debunking thesis about all art; if the edge is dropped, the slogan may collapse into the platitude that art has effects or expresses a point of view. I want to know which readings preserve a debunking force and which are deflationary.

  (ii) The beauty-and-truth filter. My recollection, which I would like flagged as uncertain if it is shaky, is that in the same essay Du Bois also insists that propaganda must be beautiful and truthful to count as art at all, so that bad propaganda is demoted to mere propaganda rather than being called bad art. If that is right in substance, then one reading of the slogan is trivially true by a filter: whatever is aesthetically successful counts, and whatever fails aesthetically is reclassified. Does that reading drain the slogan of the bite it is normally given? Is it the reading Du Bois would have wanted, given that he also objects, as I recall, to propaganda being confined to one side while the other is stripped and silent?

  (iii) Symmetry and uptake. If all art is propaganda, the dominant culture's art is propaganda too, and the slogan by itself looks symmetrical. So which readings license the further step my poet wanted — therefore mine should be propaganda for liberation — and which leave that step as a non sequitur needing an extra normative premise? Relatedly, please test the readings against hard cases: a string quartet with no text; a landscape painting; a novel written as propaganda for a cause I take to be evil but read against the grain and adopted by the other side; a private poem written with no audience in mind; and an exquisitely made film built on a false empirical claim about a group of people. For each case, say whether the work is propaganda on the reading in question, and whether the reading therefore has the extension its users need.

  What I want back is a menu, not a single interpretation: a numbered list of the distinct precise theses the sentence could express, each labelled for what kind of claim it is, whether it is trivial, substantive and defensible, false, or question-begging, and — most importantly — whether it would actually get my classmate and my poet their conclusions. Lay the readings out so I can bring the list to my advisor.

  On the epistemic side: I would like settled matters kept clearly apart from contested ones. Tell me what is secure about the logic of the slogan and about Du Bois's rejection of art-for-art's-sake, and tell me separately what is genuinely disputed among people who work on him — for instance whether his position is instrumentalist about aesthetic value, whether it is consistent, and whether his own fiction or criticism instantiates it. Do not present a contested reading as the consensus, and mark explicitly where you are reconstructing from partial recollection rather than from a text you can check, including for anything you say about the 1926 essay's contents, whose exact wording I am not asking you to reproduce. Where a textual question is decisive, describe the kind of sentence in the essay that would settle it, without citing sources.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** W. E. B. Du Bois's claim "all art is propaganda" (from his 1926 essay "Criteria of Negro Art").
      *   **Goal:** Provide a "menu" of distinct precise theses the sentence could express, analyzing their logical structure, truth value, and argumentative utility for two specific interlocutors (a classmate collapsing aesthetic/political distinctions, and a poet demanding explicit liberationist art).
      *   **Constraints:**
          *   Do not argue about Du Bois's *internal* meaning (intent), but what the sentence *asserts*.
          *   Address three axes: Nature of propaganda (causal, intentional, semantic, functional), Status of "is" (stipulative vs. empirical), Upshot (normative vs. diagnostic).
          *   Address three complications: Pejorative vs. neutral connotation, The "beauty-and-truth" filter (Du Bois's criteria), Symmetry and uptake (does it license counter-propaganda?).
          *   Test against hard cases (string quartet, landscape, evil cause novel, private poem, false claim film).
          *   Distinguish settled matters from contested scholarship (epistemic humility).
          *   Do not reproduce exact text but describe what would settle textual questions.
          *   Format: Numbered list of theses, labeled for type, truth value, and utility for the interlocutors.

  2.  **Deconstruct the Core Claim ("All Art is Propaganda"):**
      *   *Source:* "Criteria of Negro Art" (1926).
      *   *Context:* The Harlem Renaissance, debates over "Art for Art's Sake" vs. social utility.
      *   *Key nuance:* Du Bois famously adds conditions (Beauty, Truth, Goodness).

  3.  **Develop the "Menu" of Theses:**
      *   I need to generate distinct interpretations based on the user's axes (Causal, Intentional, Semantic, Functional) + Connotation (Pejorative/Neutral) + Normativity.

      *   *Thesis 1: The Intentionalist/Instrumental Claim.* Art is made to persuade.
      *   *Thesis 2: The Functionalist/Ideological Claim.* Art serves interests regardless of intent (Althusserian/Marxist vibe).
      *   *Thesis 3: The Semantic/Representational Claim.* Depicting the world implies a stance.
      *   *Thesis 4: The Stipulative/Deflationary Claim.* "Propaganda" just means "communicating values."
      *   *Thesis 5: The Normative/Prescriptive Claim.* Art *ought* to be propaganda (often confused with the descriptive claim).

  4.  **Evaluate Each Thesis against Constraints:**
      *   *Type:* Causal, Intentional, etc.
      *   *Status:* Empirical, Stipulative, Normative.
      *   *Truth:* Substantive, Trivial, False.
      *   *Utility:* Does it help the Classmate (collapse distinction)? Does it help the Poet (demand explicit liberation)?
      *   *Hard Cases:* How does it handle the quartet, landscape, etc.?
      *   *Complications:* Pejorative edge? Beauty filter? Symmetry?

  5.  **Address the "Beauty-and-Truth" Filter (Complication ii):**
      *   Du Bois says: "Thus all Art is propaganda and ever must be, despite the wailing of the purists. I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy. I do not care a damn for any art that is not used for propaganda. But I do care when propaganda is confined to one side while the other is stripped and silent."
      *   *Crucial Nuance:* He also argues in the same essay that propaganda *must* be beautiful to be effective art. "The apostle of Beauty thus becomes the apostle of Truth and Right not by choice but by inner and outer compulsion."
      *   *Implication:* Bad propaganda isn't art. This creates a circularity risk.

  6.  **Address Epistemic Status (Settled vs. Contested):**
      *   *Settled:* Du Bois rejected "Art for Art's Sake." He believed art had a social function regarding racial justice. He wrote the line.
      *   *Contested:* Is he an aesthetic instrumentalist (beauty is *only* valuable for politics) or a dualist (beauty and politics are distinct but must align)? Is his position consistent? How does his fiction (*Dark Princess*) fit?
      *   *Textual Check:* I cannot quote the essay directly, but I can describe the argumentative moves.

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the suspicion of ambiguity.
      *   *Epistemic Preface:* Separate what is known (the essay exists, the quote is real, the context is Harlem Renaissance) from what is debated (consistency, instrumentalism).
      *   *The Menu (The Core):* Create 4-5 distinct readings.
          *   *Reading 1: The Strong Intentionalist.* (Art is made to persuade). Good for Poet, bad for Classmate (doesn't collapse aesthetics, just adds intent).
          *   *Reading 2: The Weak Functionalist.* (Art has political effects). Good for Classmate (collapses distinction), bad for Poet (doesn't demand *explicit* liberation).
          *   *Reading 3: The Ideological/Structural.* (Art reproduces hegemony). Good for Poet (need counter-hegemony), Good for Classmate (politics is inherent).
          *   *Reading 4: The Stipulative/Deflationary.* (Communication = Propaganda). Trivial. Helps neither really.
          *   *Reading 5: The Normative Masking as Descriptive.* (Art *should* be propaganda). Helps Poet, confuses Classmate.
      *   *Addressing Complications:*
          *   (i) Pejorative: If neutral, it's trivial. If pejorative, it's an accusation. Du Bois reclaims it.
          *   (ii) Beauty Filter: This is the "Du Boisian Escape Hatch." If it's not beautiful, it's not art, it's just propaganda. This protects aesthetics but risks tautology.
          *   (iii) Symmetry: The "Stripped and Silent" clause. Du Bois admits dominant art is propaganda too. This licenses the Poet's move *only if* combined with a normative premise about justice.
      *   *Hard Cases:* Run the quartet, landscape, etc., through the top 2-3 readings.
      *   *Conclusion:* Summary advice for the advisor meeting.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't say Du Bois *meant* X. Say "On this reading..."
      *   *Correction:* Ensure I distinguish between the Classmate's goal (collapse distinction) and Poet's goal (mandate explicit politics). They are different. The Classmate wants to say political criticism *is* aesthetic criticism. The Poet wants to say artists *must* be political.
      *   *Check:* Did I handle the "Beauty-and-Truth" filter correctly? Du Bois argues that *true* art (which is beautiful) inevitably propagates truth. So "Bad Propaganda" = "Not Art." "Good Propaganda" = "Art." This is crucial for the "triviality" check.
      *   *Check:* Epistemic markers. Use phrases like "Scholars generally agree," "There is debate over," "Textual evidence suggests."

  9.  **Final Polish:** Check tone (academic, rigorous, helpful). Ensure all parts of the prompt are answered (Menu, Complications, Hard Cases, Epistemic Status). *Self-correction: Ensure I explicitly mention the "Criteria of Negro Art" context without quoting it verbatim.*

  10. **Final Review against constraints:**
      *   Menu format? Yes.
      *   Labels (type, truth, utility)? Yes.
      *   Complications (i, ii, iii) addressed? Yes.
      *   Hard cases tested? Yes.
      *   Epistemic distinction (settled vs. contested)? Yes.
      *   No exact text reproduction? Yes.

