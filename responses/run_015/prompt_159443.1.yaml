answer: |-
  This is a sophisticated diagnostic task. You are correct that the slogan's argumentative power relies on an ambiguity between descriptive, normative, and stipulative claims. Below is a breakdown designed for your advisor meeting. It separates the logical possibilities of the sentence from the scholarly consensus on Du Bois's corpus.

  ### Part I: Epistemic Status (Settled vs. Contested)

  Before analyzing the sentence's logic, it is necessary to distinguish what is secure in the scholarship from what is debated.

  **Settled Matters:**
  *   **Provenance:** The line appears in "Criteria of Negro Art," published in *The Crisis* (1926). It was a speech delivered at a banquet honoring Carter G. Woodson.
  *   **Context:** Du Bois was intervening in a debate between "Art for Art's Sake" proponents (like Alain Locke, to a degree) and those demanding social utility from Black artists.
  *   **Rejection of Purism:** It is uncontested that Du Bois rejected the notion that art exists in a vacuum separate from social struggle.
  *   **The "Stripped and Silent" Clause:** It is secure that Du Bois immediately follows the propaganda claim with a complaint that propaganda is currently confined to one side (white supremacy) while Black voices are silenced.

  **Contested Matters:**
  *   **Instrumentalism vs. Dualism:** Scholars dispute whether Du Bois believed aesthetic value is *instrumental* to political ends (beauty matters only because it sells the truth) or whether he held a dual view (beauty and truth are distinct goods that happen to converge in great art).
  *   **Consistency:** There is debate over whether Du Bois's own fiction (e.g., *Dark Princess*) and later criticism consistently instantiate this theory, or if he struggled to balance the demands of propaganda with the demands of form.
  *   **Definition of Propaganda:** While the text is available, scholars disagree on whether Du Bois is redefining "propaganda" neutrally or reclaiming the pejorative term.

  ---

  ### Part II: The Menu of Theses

  Here are five distinct precise theses the sentence "All art is propaganda" could express. Each is labeled by its logical type, its truth status, and its utility for your two interlocutors.

  #### 1. The Strong Intentionalist Thesis
  *   **Claim:** Every work of art is created with the specific intent to alter the audience's beliefs or actions regarding a social issue.
  *   **Type:** Empirical / Psychological.
  *   **Truth Status:** **False.** Many artists create work to explore form, express private emotion, or solve technical problems without a target audience or political aim.
  *   **Utility:**
      *   *Classmate:* **Low.** If intent is required, a critic objecting to prose (form) is still distinct from a critic objecting to politics (intent).
      *   *Poet:* **High.** This licenses the demand that artists *form* an intent. If art *is* intent-driven propaganda, lacking a liberationist intent makes the work deficient *as art*.
  *   **Hard Cases:**
      *   *String Quartet:* Not propaganda (unless the composer had a hidden political program).
      *   *Private Poem:* Not propaganda (no audience to move).

  #### 2. The Weak Functionalist Thesis
  *   **Claim:** Every work of art, regardless of intent, produces political effects or reinforces/challenges social attitudes simply by existing and being consumed.
  *   **Type:** Empirical / Causal-Sociological.
  *   **Truth Status:** **Substantive and Defensible.** Even apolitical art affirms the status quo by ignoring conflict or consuming resources.
  *   **Utility:**
      *   *Classmate:* **High.** If effects are inevitable, then ignoring politics is impossible. A complaint about "unflattering portrayal" is a complaint about the work's causal impact, same as a complaint about prose.
      *   *Poet:* **Low.** This proves the dominant culture's art is *also* propaganda. It does not logically compel the Black artist to make their propaganda *explicit* or *liberationist*, only to acknowledge they are already part of the machinery.
  *   **Hard Cases:**
      *   *Landscape Painting:* Propaganda (affirms ownership of land, colonial gaze, or escape from labor).
      *   *False Claim Film:* Propaganda (reinforces stereotypes functionally).

  #### 3. The Ideological/Structural Thesis
  *   **Claim:** Art is a medium through which ideology is transmitted; to represent the world is to take a stance on it. Neutrality is impossible because representation itself selects and frames.
  *   **Type:** Semantic / Representational.
  *   **Truth Status:** **Substantive.** This aligns with modern critical theory (e.g., representation is never innocent).
  *   **Utility:**
      *   *Classmate:* **High.** Collapses the distinction. To critique the representation (politics) is to critique the construction of the world (aesthetics).
      *   *Poet:* **Medium.** It supports the idea that "art for art's sake" is a mask for dominant ideology. However, it requires an extra normative premise to move from "you are already ideological" to "you ought to be *consciously* liberationist."
  *   **Hard Cases:**
      *   *String Quartet:* Propaganda (affirms European high culture traditions, class exclusion).
      *   *Novel read against the grain:* Still propaganda, but the uptake changes the specific ideological work done.

  #### 4. The Stipulative/Deflationary Thesis
  *   **Claim:** The word "propaganda" is being redefined to mean "any value-laden communication."
  *   **Type:** Analytic / Stipulative.
  *   **Truth Status:** **Trivially True.** If propaganda = communication of values, and art = communication of values, the sentence is a tautology.
  *   **Utility:**
      *   *Classmate:* **Medium.** It collapses the distinction linguistically, but risks draining the political urgency.
      *   *Poet:* **Low.** If "propaganda" just means "having a point of view," the demand for *useful* liberationist propaganda loses its bite. It becomes "have a point of view," which no one disputes.
  *   **Hard Cases:**
      *   *All Cases:* All count as propaganda. The distinction becomes useless for sorting.

  #### 5. The Normative Thesis (Masking as Descriptive)
  *   **Claim:** Art *ought* to be propaganda (specifically for the right side), and any art that fails to do so is not fulfilling its purpose.
  *   **Type:** Normative / Prescriptive.
  *   **Truth Status:** **Debatable.** This is a moral claim, not a fact.
  *   **Utility:**
      *   *Classmate:* **Low.** This doesn't collapse aesthetic/political distinctions; it subordinates aesthetics to politics.
      *   *Poet:* **High.** This is exactly what the poet wants. It creates an obligation for the artist.
  *   **Hard Cases:**
      *   *Evil Cause Novel:* It is "propaganda" but fails the normative test (wrong side).
      *   *Private Poem:* Fails the normative test (no social utility).

  ---

  ### Part III: Addressing the Complications

  #### (i) Pejorative vs. Neutral
  *   **The Issue:** If "propaganda" retains its connotation of deception/manipulation, the claim "All art is propaganda" is an accusation (a debunking thesis). If neutral, it is a description of function.
  *   **Du Bois's Move:** Du Bois is **reclaiming** the term. He acknowledges the pejorative edge ("utter shamelessness") but strips the "deception" component while keeping the "persuasion" component.
  *   **Impact on Readings:**
      *   Readings 1 & 5 (Intentional/Normative) rely on the **neutral/reclaimed** sense. If propaganda implies lying, Du Bois cannot demand it while also demanding Truth.
      *   Reading 2 (Functionalist) works with the **pejorative** sense (art manipulates us).
      *   **For your paper:** The ambiguity allows the speaker to slide from "Art has effects" (neutral) to "Art manipulates" (pejorative) to "Art should manipulate for good" (normative). Your classmate relies on the neutral sense (effects exist); your poet relies on the normative sense (manipulate for good).

  #### (ii) The Beauty-and-Truth Filter
  *   **The Issue:** You recall Du Bois insisting propaganda must be beautiful and truthful to count as *art*.
  *   **Textual Reality:** This is **secure**. In the essay, Du Bois argues that effective propaganda *requires* beauty. Ugly propaganda fails to persuade; therefore, it fails as propaganda. Since all art is propaganda, and bad propaganda doesn't work, bad propaganda isn't successful art.
  *   **Logical Consequence:** This creates a **circularity risk**.
      *   *If:* Art = Good Propaganda.
      *   *And:* Good Propaganda = Beautiful + True + Persuasive.
      *   *Then:* "All Art is Propaganda" becomes "All Successful Art is Successful Persuasion."
  *   **Does it drain the bite?**
      *   **Yes,** if used to defend existing canons (i.e., "If it's in the museum, it must be good propaganda").
      *   **No,** if used as a challenge (i.e., "Your work isn't art yet because it isn't beautiful enough to make us care about the truth").
  *   **Du Bois's Intent:** He likely wanted the latter. He objects to "propaganda confined to one side." He needs the filter to ensure Black art is not dismissed as mere pamphleteering, but he needs the slogan to ensure it is not dismissed as mere decoration.
  *   **For your paper:** This filter blocks the Classmate's move. If "bad propaganda" is demoted to "not art," then a critic *can* distinguish between a work that fails aesthetically (bad art/not effective propaganda) and a work that fails politically (bad propaganda/not effective art). They are linked, but the filter preserves a role for aesthetic judgment.

  #### (iii) Symmetry and Uptake
  *   **The Issue:** If all art is propaganda, white supremacist art is also propaganda. Why does this mandate Black liberation art specifically?
  *   **The Logic:** The slogan alone is symmetrical. The move to "therefore Black artists must make liberation art" requires the **"Stripped and Silent" premise**.
      *   *Premise 1:* All art is propaganda (Symmetrical).
      *   *Premise 2:* Currently, one side's propaganda dominates and silences the other (Asymmetrical Power).
      *   *Conclusion:* Therefore, the silenced side must produce counter-propaganda to restore balance/truth.
  *   **For your paper:**
      *   **Classmate:** Uses Premise 1 only. (Politics is everywhere).
      *   **Poet:** Uses Premise 1 + Premise 2 + Normative Premise (Justice requires balance).
      *   **The Non Sequitur:** The Poet's conclusion does not follow from the slogan alone. It requires the sociological claim about silencing. If you point this out, you show the Poet is smuggling in a premise about power dynamics, not just aesthetics.

  ---

  ### Part IV: Testing the Hard Cases

  Here is how the top three viable readings handle your test cases.

  | Case | **Reading 2: Weak Functionalist** (Effects) | **Reading 3: Ideological** (Representation) | **Reading 5: Normative** (Obligation) |
  | :--- | :--- | :--- | :--- |
  | **String Quartet** (No text) | **Yes.** Affirms class/cultural capital. | **Yes.** Embodies traditions of exclusion/inclusion. | **No.** Fails to explicitly advocate. |
  | **Landscape Painting** | **Yes.** Erases labor/ownership history. | **Yes.** Frames nature as property/sublime. | **No.** Unless it depicts land justice. |
  | **Evil Cause Novel** (Read against grain) | **Yes.** Still produces effects, even if resisted. | **Yes.** The text remains ideological. | **No.** It is "bad" propaganda (wrong side). |
  | **Private Poem** (No audience) | **No.** No causal uptake. | **Maybe.** Encodes the poet's ideology. | **No.** No social utility. |
  | **False Claim Film** (Exquisitely made) | **Yes.** Powerful effects based on lies. | **Yes.** Represents world falsely. | **No.** Fails the "Truth" filter (Du Boisian). |

  **Extension Check:**
  *   **Classmate's Goal:** Needs a reading where the Quartet and the Novel are both propaganda *and* where aesthetic critique is political critique. **Reading 3** serves her best.
  *   **Poet's Goal:** Needs a reading where the Private Poem and the Landscape are *insufficient*. **Reading 5** serves him best, but it is not what the sentence literally says (it swaps "is" for "ought").

  ---

  ### Part V: Recommendation for Your Advisor

  When you meet your advisor, present the problem as a **category error** committed by both interlocutors, enabled by the slogan's ambiguity.

  1.  **The Classmate** treats a **Functionalist** claim (art has effects) as an **Aesthetic** claim (effects = form). She ignores the Beauty-Truth filter, which Du Bois uses to keep aesthetic judgment alive *within* propaganda.
  2.  **The Poet** treats a **Descriptive** claim (art is propaganda) as a **Normative** claim (art *should* be liberationist). He relies on the "Stripped and Silent" context, not the slogan itself.
  3.  **The Du Boisian Synthesis:** Du Bois likely holds that Art is Propaganda *only insofar as* it is Beautiful and True. This makes the slogan a **regulative ideal**, not a descriptive fact. It means: "Do not attempt to make art that does not persuade, but do not persuade through ugliness or lies."

  **Final Note on Textual Verification:**
  To settle the "Beauty-Truth" question definitively without citing text, look for the section in "Criteria" where Du Bois discusses the relationship between the "Apostle of Beauty" and the "Apostle of Truth." If he argues they are *identical*, the filter is tautological. If he argues they are *allies*, the filter is a constraint. Most scholarship suggests he views them as convergent but distinct compulsion forces.
