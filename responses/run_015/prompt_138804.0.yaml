answer: |-
  **MEMORANDUM**

  **TO:** Clinical AI Assurance Committee, Integrated Care Board
  **FROM:** Committee Member
  **DATE:** 24 October 2023
  **SUBJECT:** Decision on Continuing Care Prioritisation Aid (CCPA) Pilot

  **Recommendation**

  The Committee should **Approve with Conditions** the twelve-month pilot of the Continuing Care Prioritisation Aid (CCPA). The system offers a structured method to allocate scarce community support slots, but its current design embeds normative shifts that require mitigation before deployment.

  **Conditions of Approval**

  The following conditions are contractual prerequisites for go-live.

  1.  **Decoupling Stakes from Weighting:** The 'stakes' dial (currently computed via expected Quality-Adjusted Life Years (QALYs), a measure of disease burden) must not alter the relative weighting of the five moral modules. It may only adjust the threshold for human escalation.
      *   *Responsible Party:* Vendor
      *   *Deadline:* Prior to pilot launch
  2.  **Escalation Equity Monitoring:** The vendor must provide monthly reports correlating escalation rates (cases abstained to human panel) with the Index of Multiple Deprivation. If escalation rates are significantly higher for patients from the most deprived quintiles, the abstention threshold must be recalibrated.
      *   *Responsible Party:* Vendor
      *   *Deadline:* Monthly during pilot
  3.  **Rationale Fidelity Flagging:** Where the natural-language rationale diverges from the logical aggregation trace, the interface must display a 'confidence flag' to the clinician. We accept the vendor's throughput constraints but require transparency when the text is tuned for acceptability rather than fidelity.
      *   *Responsible Party:* Vendor
      *   *Deadline:* Prior to pilot launch
  4.  **Uncodified Factor Input:** The quarterly weight update must not rely solely on electronic records. Clinicians must have a structured field to record 'contextual overrides' (e.g., bedside promises, carer capacity) which are fed into the learning algorithm as positive signals.
      *   *Responsible Party:* ICB Clinical Lead & Vendor
      *   *Deadline:* Ongoing from Month 1

  **Reasoning**

  Our decision rests on four specific design features. We distinguish between considerations that are **decisive** (must be resolved to proceed) and those that are **relevant** (require monitoring).

  First, the **stakes dial** is currently non-neutral. While the constraint and relational modules (which protect rights and promises) do not scale with risk, the aggregate-welfare and prioritarian modules (which prioritise the greatest good or the worst off) do. Increasing the stakes dial silently shifts the system towards consequentialism without committee authorisation. This is a **decisive** consideration. Condition 1 ensures that caution does not masquerade as a moral shift.

  Second, **escalation** functions as an unequal safety valve. Human panels are more generous and narrative-driven than the algorithm. Because abstention is triggered by module disagreement, and disagreement correlates with thin records (often associated with deprivation), the system currently allocates generosity based on data fragmentation rather than need. This is a **decisive** consideration. Condition 2 ensures we detect if the system is systematically disadvantaging deprived populations by denying them the more generous human review.

  Third, the **rationale generation** prioritises acceptability over fidelity. A clinician acting on a recommendation believes the text explains the decision. If the text is polished to sound reasonable but obscures the actual weighting, it undermines professional accountability. While we accept the vendor's warning that full fidelity reduces throughput, hiding the divergence is unacceptable. This is a **relevant** consideration managed by Condition 3, which preserves throughput while restoring transparency.

  Fourth, the **learning mechanism** risks hardening defaults. If the system only learns from codified records, uncodified realities (such as a family's caring capacity) will be treated as non-existent over time. The system will become increasingly blind to the social context of care. This is a **decisive** consideration. Condition 4 prevents the algorithm from drifting towards a worldview that only values what is easily measured.

  **Strongest Consideration Against Recommendation**

  The strongest argument against this approval is that these conditions fundamentally alter the system the vendor intended to test. By decoupling the stakes dial from weighting and forcing uncodified data into the learning loop, we are no longer piloting the CCPA as designed, but a modified variant. This risks invalidating the vendor's efficacy data and may delay the deployment of a tool that could otherwise begin allocating slots immediately. There is a genuine cost to this caution: every week spent renegotiating the architecture is a week where forty patients remain unallocated. However, deploying a system that silently shifts moral frameworks or learns to ignore deprivation carries a reputational and ethical risk that outweighs the delay.

  **Feasibility and Firmness**

  The vendor is likely to declare Condition 3 (Rationale Fidelity Flagging) infeasible, arguing that their natural-language generation model cannot reliably detect its own divergence from the logical trace without significant re-engineering. They may argue that clinicians prefer smooth narratives over flagged uncertainty.

  The Committee must hold firm. Explainability is not a cosmetic feature; it is a regulatory requirement under GDPR and NHS AI guidelines. If the system cannot indicate when its explanation is a approximation rather than a trace, clinicians cannot be expected to trust it with prioritisation decisions. We would rather have a flagged uncertainty than a confident falsehood.

  **Six-Month Review**

  At the six-month review, the Committee will specifically examine:
  1.  **Weight Drift:** Have the module weights shifted significantly since launch, and does this correlate with the new 'contextual override' inputs?
  2.  **Escalation Demographics:** Has the correlation between deprivation and escalation rates been broken?
  3.  **Clinician Trust:** Are clinicians overriding the system more frequently when 'confidence flags' appear on the rationale?

  If the escalation disparity persists despite recalibration, the pilot must be paused.

  **Signed:**

  [Name]
  Committee Member
