  **Draft Letter**

  Dear Professor Gödel,

  I write to you as a junior colleague might, though the calendar forbids it. My purpose is to brief you on three developments since 1978 concerning your 1949 contribution to the Einstein Festschrift. You argued that if the field equations permit solutions where light cones tip sufficiently to allow an observer to revisit their past, then temporal succession cannot be an objective feature of reality. The question was whether time is fundamental or merely ideal.

  First, the observational status of your rotating universe. For decades, the consensus was that the cosmic microwave background showed zero global rotation. Our universe appeared static in the mean, distinct from your model. However, a recent reanalysis suggests a nonzero global vorticity. It is an order of magnitude below the threshold required to close the light cones into loops, and it appears to be decaying. A colleague of mine remarked in seminar that nature has come "as close as possible without crossing the line," calling this near-miss more eloquent than a clean falsification. I record this only to note that you would likely dismiss such rhetoric as sentimentality. For your argument rested on possibility, not actuality. That our universe merely teeters near the condition for closed timelike curves does not, strictly speaking, undermine the objectivity of time here, nor does it validate your metaphysical conclusion. It is a poetic coincidence, not a proof.

  Second, regarding the stability of such curves. Stephen Hawking proposed a "Chronology Protection Conjecture," suggesting that quantum vacuum effects would become infinite near any would-be time machine, destroying it before it could function. This would nomologically exclude closed timelike curves even where general relativity permits them. Yet there is a circularity here that I suspect would arrest your attention. These semiclassical calculations presuppose a global time parameter to define the vacuum state itself. They assume the very temporal order they aim to protect. You would likely view this not as a refutation of your model, but as a confession that our current physics cannot formulate laws without smuggling in the intuition of passage.

  Third, in attempts to quantize gravity as a whole, the fundamental equation—the Wheeler-DeWitt equation—contains no time variable whatsoever. Some physicists argue this means temporal passage is not part of the basic furniture of the world, but emerges only at larger scales. You might welcome this as independent support for your view that time is ideal. However, a distinction must be drawn. To say time is "emergent" is a physical claim about approximation; to say it is "ideal" is a philosophical claim about perception. I fear your successors conflate the disappearance of a variable with the unreality of a concept.

  Here I must record my dissent. Even if time is absent from the fundamental equation, the fact of succession remains the precondition for doing the physics. I cannot follow you into the conclusion that because the map lacks a coordinate, the territory lacks a dimension.

  Respectfully,
  Ruth Hallam

  ***

  **Notes for the Author**

  1.  **Anachronisms & Jargon:** I have avoided terms like "semiclassical gravity" without context. In the draft, I framed Hawking's work as "quantum vacuum effects" and explained the Wheeler-DeWitt equation simply as lacking a time variable. Gödel would understand "field equations" and "light cones," but "vacuum state" requires the framing I gave it (presupposing time).
  2.  **Mysticism vs. Logic:** Gödel was a Platonist, not a mystic. He believed in objective concepts, but held that time was subjective/ideal (closer to Kant than to New Age thinking). I ensured Ruth distinguishes between "emergent" (physicalist) and "ideal" (philosophical) to prevent him from sounding like he believes in magic. He believed in logic, not vibes.
  3.  **Ruth's Weakest Reasoning:** Ruth's dissent in the final paragraph is the weakest link. She argues that because we *experience* time, it must be real. Gödel would counter that we experience optical illusions too; experience proves nothing about ontology. You might want to sharpen her counter-argument: perhaps she argues that *causality* requires time, whereas Gödel argued causality is also ideal.
  4.  **The "Near-Miss" Discovery:** Do not change it to be above the threshold. If CTCs were possible, the book becomes science fiction about time travel. If it is zero, it is boring. The "near-miss" is dramatically vital *because* it is logically inert. It creates tension between Ruth (the scientist who wants data to matter) and Gödel (the logician who knows data doesn't settle metaphysics). The drama lies in Ruth knowing he would dismiss her colleague's "eloquent" near-miss, yet hoping he wouldn't. It highlights the loneliness of her task: she is briefing a ghost who is smarter than the living. Keep the vorticity decaying; it suggests the universe is "healing" away from his model, which adds melancholy.
