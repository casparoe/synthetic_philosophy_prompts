              *   *Defender's Move:* Embrace skepticism. We are less free than we think.
              *   *Verdict:* Survivable. This is a feature, not a bug, for this view.

          *   *5. The Moral Work (The Big One):*
              *   *Challenge:* Flexibility $\neq$ Responsibility. (The Flexible Addict vs. The Rigid Saint).
              *   *Fatal Flaw:* If a kleptomaniac has high counterfactual depth (clever thefts) but can't stop, your view calls them free. If a person has a rigid moral compulsion to save lives, your view calls them less free.
              *   *Verdict:* **FATAL.** This is where the definition divorces from the *purpose* of the concept.

          *   *6. Empirical Wasp Data:*
