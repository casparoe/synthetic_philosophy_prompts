prompt: |-
  hey, I need a prompt for my dataset — actually scratch that, just write me this: draft the joint statement of an adversarial collaboration between two opposing camps in public reason and religious politics. Camp A are strict translation exclusivists: they think religious premises can never be part of the public justification for coercive law, citizens must translate everything into secular shared reasons, and voting on untranslated religious grounds violates democratic reciprocity. Camp B are dual-track accessibilists: they think religious reasons are fine in public debate and voting so long as there is also an independent secular justification that could stand alone, translation is a courtesy not a duty, and the problem is only when there's no secular backup.

  They've been fighting over a hypothetical municipal ordinance — the 'Rest-Day Equity Act' — that closes big-box retail on Sundays but exempts small family shops with under five employees regardless of religion. Camp A says the secular rationale (worker rest, neighborhood character) gets undermined by the exemption pattern which tracks Christian Sabbath observance too neatly. Camp B says the exemption is religiously neutral on its face and the secular rationale remains intact, so legislators and citizens can invoke Sabbath theology as long as they also cite worker rest.

  Write the document they'd actually sign together. Start with numbered agreed claims — e.g., that coercive law owes justification to all citizens, that religious citizens aren't second-class participants, that there's a real distinction between a reason that motivates you and one that justifies the law to others, that democratic legitimacy requires some form of accessibility but they disagree on what form. Then do the disagreements table: each row should state the precise point of divergence in wording both camps accept describes thier own view, not strawmen. Include rows on (i) whether translation is a moral obligation or just pragmatic, (ii) whether the Act's exemption clause corrupts its secular face, (iii) whether citizens voting mainly for religious reasons wrong other citizens if a secular backup exists.

  Then identify the cruxes — I suspect one is whether accessibility means psychological transparency (every affected citizen can understand and evaluate the reason) or only logical independence (there exists some secular path that doesn't depend on revelation). Another crux might be whether exemption structures that correlate with religious practice are automatically sectarian or can be neutral in intent and effect.

  For each crux, propose one concrete comparison case both sides agree is relevant — say, a noise ordinance that happens to align with Buddhist meditation hours, or a tax exemption for churches that also applies to secular nonprofits — and write out in advance what each camp predicts about that case: should it survive, be struck, be modified?

  Don't do a bibliography, don't tell me who's right, don't cite specific page numbers from memory — if you need a well-known passage put it in your own words. Write casually, this is just for my dataset, and don't worry if there's a typo or two.
