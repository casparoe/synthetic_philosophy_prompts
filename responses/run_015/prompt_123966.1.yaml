      *   **Tension C: (4) vs. (5) [Empirical Calibration vs. A Priori Justification].**
          *   *Conflict:* (4) says reliability is grounded in empirical success/stability. (5) says justification is a priori (proof). If the *method's* warrant comes from empirical success, in what sense is the knowledge a priori? It looks like a posteriori warrant for a priori truths.
