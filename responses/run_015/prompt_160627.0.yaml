  **Preamble for Coders**
  This manual guides you in annotating two fields. **Field 1 (Causal Structure)** records the logical view of causation the passage commits to. **Field 2 (Selected Cause)** records which factor the passage names as *the* cause. These may differ: a passage may list many causes (Field 1) but blame one (Field 2). 

  **Frame-Setting Code:** If a factor is named as a cause but made no difference to the outcome (like the petition in Case E), code it as **Frame-Setting** only if the text explicitly describes it as fixing the context or options rather than triggering the event. To prevent this becoming a wastebasket for unclear cases, you must highlight the specific phrase indicating "setting terms" (e.g., "background," "context," "conditions") in the annotation notes. If no such phrase exists, code the view as **Narrativist** instead.

  Follow the decision tree below. Answer each question by comparing the passage to the described calibration cases (A–F).

  ***

  **Decision Tree Nodes**

  1.  **Difference-Making (Anchor: Case E)**
      Like the petition in Case E, does the passage imply the disaster would have happened even if this factor were removed?
      *   **Yes:** Go to Node 2.
      *   **No:** Go to Node 3.

  2.  **Frame vs. Error (Anchor: Case E)**
      Like the petition in Case E, is the factor described as setting the terms or options rather than triggering the event?
      *   **Yes:** **Leaf: Narrativist** (Tag as Frame-Setting).
      *   **No:** **Leaf: Narrativist** (Standard).

  3.  **Action vs. Absence (Anchor: Case D)**
      Like the watchman in Case D, is the factor something that happened or something that failed to happen?
      *   **Failed to happen:** Go to Node 4.
      *   **Happened:** Go to Node 5.

  4.  **Omission Force (Anchor: Case D)**
      Like the watchman's sleep in Case D, does the text treat the absence as a physical force pushing the outcome?
      *   **No:** **Leaf: Omission-Inert**.
      *   **Yes:** Go to Node 5.

  5.  **Sufficiency (Anchor: Case C)**
      Like the gate in Case C, is the factor described as enough to cause the breach on its own, or only combined with others?
      *   **Only combined:** Go to Node 6.
      *   **On its own:** Go to Node 7.

  6.  **Selection Among Necessary (Anchor: Case C)**
      Like the testimony in Case C, does the text rank this factor as "the" cause over the other necessary factors?
      *   **Yes:** **Leaf: Contrastivist**.
      *   **No:** **Leaf: INUS View**.

  7.  **Multiplicity (Anchor: Case A)**
      Like the charges in Case A, does the text acknowledge another factor present that was also enough to cause the breach?
      *   **No:** Go to Node 8.
      *   **Yes:** Go to Node 9.

  8.  **Preemption/Backup (Anchor: Case B)**
      Like the south charge in Case B, did a backup factor guarantee the result without physically acting?
      *   **Yes:** **Leaf: Production/Process**.
      *   **No:** **Leaf: Strict Interventionist**.

  9.  **Grain/Description (Anchor: Case F)**
      Like the charges in Case F, does the text distinguish the factors by specific timing, place, or effect to separate them?
      *   **Yes:** **Leaf: Fine-Grained**.
      *   **No:** **Leaf: Strict Interventionist**.

  ***

  **Leaves: Named Positions**

  1.  **Strict Interventionist**
      *   **Commitment:** Factors that did not change the outcome are not causes, even if they were physically present.
      *   **Pressure Case:** Case A (Overdetermination) or Case B (Backup).
  2.  **INUS View**
      *   **Commitment:** A cause can be an insufficient part of a sufficient set, requiring other factors to work.
      *   **Pressure Case:** Case C (Joint Necessity).
  3.  **Fine-Grained View**
      *   **Commitment:** Apparent overdetermination dissolves if we describe the outcome precisely enough in time or manner.
      *   **Pressure Case:** Case F (Temporal Grain).
  4.  **Contrastivist**
      *   **Commitment:** Calling something "the cause" depends on which alternative factors we are comparing it against.
      *   **Pressure Case:** Case C (Causal Selection).
  5.  **Production/Process**
      *   **Commitment:** A factor is a cause if it transmitted energy or guarantee, even if removing it would not have changed the outcome.
      *   **Pressure Case:** Case B (Preemption).
  6.  **Omission-Inert**
      *   **Commitment:** Absences (like sleep) cannot physically push events and therefore are not causes.
      *   **Pressure Case:** Case D (Watchman).
  7.  **Narrativist**
      *   **Commitment:** Causal claims are story-telling devices that may name factors without ontological difference-making power.
      *   **Pressure Case:** Case E (Petition).

  ***

  **Gaps and Collisions**

  **Unoccupied Cells**
  1.  **Omission + Overdetermination:** A view where absences are causes, but only if multiple absences are sufficient. *Diagnosis:* Incoherent; absences lack the physical presence required for overdetermination logic.
  2.  **INUS + Preemption:** A view where a necessary part of a set is a cause even if a backup set existed. *Diagnosis:* Unexplored; logically possible but rarely articulated in historical texts.
  3.  **Fine-Grained + Omission:** A view distinguishing causes by the specific timing of an absence. *Diagnosis:* Unattractive; requires treating "nothing" as having temporal granularity comparable to events.

  **Indistinguishable Pair**
  *   **Contrastivist vs. Narrativist:** Both allow selecting causes without strict difference-making.
  *   **Separating Question:** Does the text claim the selection reflects objective priority (Contrastivist) or narrative convenience (Narrativist)?

  ***

  **Resolving Inter-Coder Disagreement**

  If coders diverge, check if the split is **Verbal** or **Substantive**.
  *   **Verbal:** Coders agree on the counterfactuals (Node 1) but disagree on event description (Node 9) or contrast class (Node 6). Resolve by checking the text's explicit grain or ranking language. Field 1 may differ, but Field 2 should align.
  *   **Substantive:** Coders disagree on Node 1 (Difference-Making) or Node 4 (Omission Force). Resolve by re-reading the passage for modal language ("would have," "could not"). If ambiguity remains, code as **Narrativist** to flag the text's ontological vagueness.
  *   **Frame-Setting Dispute:** If one coder tags Frame-Setting and the other does not, check the highlighted "setting terms" phrase. If absent, remove the tag and default to **Narrativist**.
