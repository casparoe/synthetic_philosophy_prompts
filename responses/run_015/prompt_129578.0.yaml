answer: |-
  **The Department of Propositional Zoning**

  Arthur P. Dent (no relation) stood at Counter 4 of the Department of Propositional Zoning, sliding a slip of paper under the glass partition. The form was labelled *Claim for Analytic Exemption*.

  The proposition read: **"All swans are white."**

  The clerk, a weary woman named Mrs. Carnap, didn't even look up. "Rejected. This is clearly synthetic. It requires empirical verification. We have photographs of Australian swans from 1697. They're black."

  "I'm not claiming it's true by fact," Arthur said smoothly. "I'm claiming it's true by meaning. I'm filing it as analytic."

  Mrs. Carnap sighed, adjusting her glasses. "Sir, 'swan' and 'white' are not synonymous. You can't define analyticity via synonymy without already presupposing analyticity. It's circular. Next."

  "But consider the web of belief," Arthur persisted, leaning on the counter. "I am choosing to hold this statement true come what may. To accommodate the black birds in Australia, I will simply make revisions elsewhere in my system. Perhaps I will reclassify the Australian birds as a distinct genus, or adjust my optical theories regarding light reflection. The point is, I can protect this core statement from recalcitrant experience if I twist the periphery enough."

  Mrs. Carnap finally looked up, her stamp hovering. "You're talking about underdetermination. Just because you *can* revise the web to save the statement doesn't make the statement analytic. It just makes you stubborn. There is a principled boundary between matters of meaning and matters of fact."

  "Is there?" Arthur asked. "Can you show me the form that defines that boundary without using the words 'meaning,' 'synonymy,' or 'necessity'?"

  Mrs. Carnap opened a drawer and shuffled through a stack of blank papers. She picked one up, read it, and put it down. She picked up another. "Well... the definition relies on cognitive synonymy, which relies on interchangeability *salva veritate*, which relies on..."

  "Which relies on analyticity," Arthur finished. "It's a dogma, Mrs. Carnap. You're running a bureaucracy based on an unfounded metaphysical faith."

  Mrs. Carnap stared at the *Analytic Exemption* stamp in her right hand and the *Synthetic Liability* stamp in her left. She looked at the black-and-white photograph of the swan on her desk, then at Arthur's form. Slowly, she opened the drawer beneath the counter and dumped both stamps into the bin.

  "What are you doing?" Arthur asked.

  "If any statement can be held true come what may, provided we make drastic enough adjustments elsewhere in the system," Mrs. Carnap said, picking up a single, unlabelled rubber stamp, "then there's no point in sorting them."

  She slammed the new stamp onto his form. It read: **ADJUNCT TO THE WEB.**

  "Does that mean I'm exempt from providing evidence?" Arthur asked.

  "No," Mrs. Carnap said, already reaching for the next customer's number. "It means we're all just waiting for the next observation to force a gestalt shift in the department. Now, please step aside; the man behind you is trying to file '2 + 2 = 5' as a necessary truth contingent on a change in base logic."
