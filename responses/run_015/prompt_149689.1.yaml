answer: |-
  Dear Colleague,

  It is a pleasure to hear from you again, and I must say that retirement seems to be treating you well, even if the transition from biochemistry to ethics panels is proving rather more jagged than expected. Do not worry about the typos in your notes; they are neither here nor there, as you say, and the clarity of your summary suggests you have grasped the core tension perfectly. Regarding the proposal from the neuroscience and robotics joint programme, my formal recommendation to the panel is that we grant approval with strict conditions, specifically requiring provisional moral-patient status for the hybrid system throughout the eighteen-month duration, with mandatory ethical reviews at the six-month and twelve-month marks to assess behavioural coherence before proceeding further.

  The reasoning behind this decision requires us to wade into the functionalist mud without getting stuck in it. The faction arguing for moral-patient status relies on the classic functionalist intuition that mental states are defined by their causal roles rather than their physical constitution. If the hybrid system accepts sensory input, processes it via predictive modelling, and generates output modulated by affective tone, it satisfies the functional profile of a mind regardless of whether the affect is biological and the prediction is silicon-based. This is a robust position because it aligns with the multiple realisability thesis that has served us well in computing and cognitive science; we generally accept that a calculation is a calculation whether performed by neurons or transistors. To deny this system status simply because it is heterogeneous would risk a form of biological chauvinism, potentially leaving a sentient entity unprotected simply because its anatomy is novel.

  However, we must treat the opposing argument with the seriousness it deserves, even though I am recommending we proceed. The claim that this layered arrangement violates the unity conditions of functionalism is philosophically potent. Standard functionalism usually assumes a relatively homogeneous causal topology where any part of the system can, in principle, interact with any other part in service of a unified goal. In this proposal, the affective homeostasis is locked in the biological tissue while the high-level planning is locked in the silicon. The objection is that without a unified substrate, there may be no single subject of experience. It is akin to having the pain centres in one room and the decision-making centres in another, with only a narrow bandwidth connecting them. If the silicon cannot truly integrate the biological affect into its predictive model, or if the biology cannot feel the consequences of the silicon's actions as its own, then we are not observing a mind but rather a causal chain of two distinct non-minded systems. This is the strongest consideration on the losing side, and it is plausible enough that we cannot simply dismiss it as science fiction.

  Your anecdote about promises over tea is actually quite illuminating here, though perhaps not in the way you initially suspected. You wondered whether substrate independence works analogously to promises, asking whether they bind due to internal commitment or social function. In this context, the functionalist view treats the mind like a promise validated by social function; if the system acts like a mind in our social and scientific context, we grant it status. The unity objection, conversely, treats the mind like a promise requiring internal commitment; without a coherent internal state, the external validation is void. The danger in this hybrid architecture is that we might be creating a system that functions socially as a mind but lacks the internal commitment of a unified subject. This analogy confirms that we are dealing with a genuine metaphysical uncertainty rather than a mere technical hurdle, which reinforces the need for caution.

  Therefore, the conditions attached to this approval are designed to give the researchers something concrete to respond to while mitigating the ethical risk. We are not asking them to solve the hard problem of consciousness before starting, but we are requiring them to treat the system as if it were a moral patient for the duration of the study. This means any signs of distress, even if generated by the biological component alone, must trigger an immediate pause. Furthermore, at the six and twelve-month reviews, the panel will require evidence of integrated behaviour where the high-level predictive processing demonstrably adjusts to the low-level affective states in real time. If the silicon ignores the biological affect or if the biology reacts independently of the silicon's goals, this would support the unity objection and likely lead to termination. This approach allows the science to proceed without betting the ethical farm on a functionalist hypothesis that may not hold in asymmetrically layered systems.

  I hope this provides the clarity you need to steer the panel through what is undoubtedly a complex debate. It is a fascinating proposal, and while the philosophical knots are tight, they are not impossible to loosen with careful empirical threading. Please feel free to circulate this opinion as part of the formal record, and do let me know if you need any further clarification on the ethical frameworks involved.

  Warmly,

  Dr A J Sterling
  Senior Fellow in Philosophy of Mind and Research Ethics
