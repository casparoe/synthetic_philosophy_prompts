answer: |-
  The specification must be built around the operational constraint that a token-level verdict cannot rely on speaker identity or intent, which renders several standard semantic accounts operationally useless.

  ### Desiderata for Operationalising Slur Theory

  1.  **Projection Stability (Case 6)**
      *   **Requirement:** The derogatory force must persist when the word is embedded in negation, conditionals, or belief reports (e.g., 'He is not a zark' still invokes the slur).
      *   **Case:** A user writes, 'Nobody called him a zark', to deny an accusation.
      *   **Status:** **Non-negotiable.** This is a robust linguistic datum; any theory treating derogation as standard truth-conditional content fails here.
      *   **Moderation Implication:** The token is a violation even if the sentence structure ostensibly denies the label.

  2.  **Reference Independence (Case 2)**
      *   **Requirement:** The theory must account for harm where the target category is ontologically empty or junk.
      *   **Case:** 'Zark' refers to nothing, yet users flinch and feel insulted.
      *   **Status:** **Non-negotiable.** Harm occurs regardless of metaphysical status; a theory requiring a real referent to establish derogation is unsafe.
      *   **Moderation Implication:** Do not require proof that the targeted group exists or matches a protected category before acting.

  3.  **Orthographic Sensitivity (Case 3)**
      *   **Requirement:** The theory must explain why censored placeholders or phonological approximations carry comparable weight to the full lexeme.
      *   **Case:** The 'z-word' or euphemisms that slide into insult via the treadmill effect.
      *   **Status:** **Non-negotiable (Operational).** While linguistically contested (is it the word or the concept?), moderation filters operate on strings, not concepts.
      *   **Moderation Implication:** Policy must cover variants and placeholders, not just canonical spellings.

  4.  **Identity Sensitivity (Case 5)**
      *   **Requirement:** The theory must distinguish between in-group reclamation and out-group aggression despite identical syntax and tone.
      *   **Case:** In-group members use 'zark' affectionately; outsiders use it as an insult.
      *   **Status:** **Contested Prejudice.** Semantically, some camps argue the meaning changes (semantic shift); others argue it is purely pragmatic (contextual use).
      *   **Moderation Implication:** **Critical Conflict.** This requires knowledge of speaker identity which the 'two lines of context' constraint explicitly forbids.

  5.  **Context Portability (Case 1)**
      *   **Requirement:** The theory must decide whether toxicity is intrinsic to the string or dependent on cultural context.
      *   **Case:** 'Glim' is a lamp in Community B, a slur in Community A. A B-speaker uses it before an A-audience.
      *   **Status:** **Non-negotiable (Safety).** Linguistically, meaning is contextual; operationally, you cannot audit every user's cultural history.
      *   **Moderation Implication:** Default to the highest-risk interpretation (the slur) when audiences overlap, regardless of speaker intent.

  6.  **Power Asymmetry (Case 4)**
      *   **Requirement:** The theory must distinguish between slurs targeting subordinated groups versus those targeting dominant groups.
      *   **Case:** 'Flim' targets the dominant group but lacks historical systemic weaponisation.
      *   **Status:** **Contested Prejudice.** Some theories define slurs inherently by power dynamics; others treat them as symmetric pejoratives.
      *   **Moderation Implication:** Policy usually treats these differently (hate speech vs. rudeness), but the theory must justify why without relying on subjective sociological analysis per token.

  7.  **Categorical Distinction**
      *   **Requirement:** The theory must not collapse 'offensive', 'derogatory', 'pejorative', and 'slur'.
      *   **Case:** A word can be offensive (politeness violation) without being a slur (systemic derogation).
      *   **Status:** **Non-negotiable.** Granularity is required for proportional enforcement (warning vs. ban).
      *   **Moderation Implication:** Enables tiered penalties rather than binary ban/appease.

  8.  **Audience Independence**
      *   **Requirement:** The theory must account for offence/harm even if no target audience is present to witness it.
      *   **Case:** A user posts a slur in a channel with no members of the targeted group.
      *   **Status:** **Non-negotiable.** Harm is often defined by community standards and potential reach, not just immediate felt injury.
      *   **Moderation Implication:** Allows proactive removal without waiting for a report from a targeted user.

  ### Incompatible Desiderata

  **Identity Sensitivity (4) vs. Operational Constraint (No Intent/Identity)**
  This is a bug in your list, not a discovery about the area. You require a theory that distinguishes reclamation (Case 5) based on speaker identity, but you simultaneously constrain the moderator to decide without access to speaker identity or intent. No semantic theory can resolve this because the data required to apply the theory is withheld from the decision-maker. You must choose: either ban the token universally (sacrificing Case 5 nuance) or allow it universally (sacrificing safety).

  ### The Hardest Requirement

  **Projection Stability (Case 6)** knocks out the most accounts.
  Any theory that locates the derogatory content purely within the truth-conditional proposition (what is said) fails because negation should cancel the content. If 'He is not a zark' is true, and 'zark' is just a propositional claim, the insult should vanish. It does not. This eliminates pure propositional accounts immediately.

  ### Scorecard of Standard Families

  *   **Derogation in the Proposition (Truth-Conditional):** **Fail.** Handles Case 1 well, but collapses on Case 6 (projection) and Case 2 (empty reference).
  *   **Derogation as Expressive/Use-Conditional:** **Pass.** Handles Case 6 and Case 8 well. Struggles with Case 5 (why does identity change the expression?) and Case 3 (why does the censored word carry the expressivity?).
  *   **Offence from Taboo (Word-Based):** **Mixed.** Excellent on Case 3 (orthography) and Case 1 (portability). Fails Case 2 (why is a junk word taboo?) and Case 5 (cannot explain reclamation).
  *   **Pure Pragmatics (Implicature):** **Fail.** Handles Case 5 (context/identity) well. Collapses on Case 6 (implicatures usually cancel under negation) and Case 8 (hard to claim harm without an audience to infer).

  ### Moderation-Specific vs. Semantics-Specific Requirements

  The following requirements drop out if you are writing for a semantics seminar rather than a moderation spec:

  1.  **Orthographic Sensitivity (Case 3):** A semanticist cares about the concept; a moderator cares about the string. Semantics can ignore the 'z-word' placeholder; moderation cannot.
  2.  **Audience Independence (Case 8):** Semantics often analyses use in context; moderation must police potential harm in empty rooms.
  3.  **Binary Verdict (No Intent):** Semantics thrives on ambiguity and graded membership; moderation requires a take-down/leave-up switch that cannot wait for sociological audit.
  4.  **Categorical Distinction (Case 7):** While linguists distinguish these, a semantic theory might unify them under 'expressive content'; moderation needs them separated to calibrate penalties.

  The core tension remains: a theory sufficient for semantics (nuanced, context-heavy) is unusable for moderation (binary, context-poor); a theory sufficient for moderation (string-based, strict) is linguistically indefensible. You are building a safety filter, not a truth engine.
