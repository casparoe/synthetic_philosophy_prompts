answer: |-
  To determine which framework offers a more coherent account of responsibility in transitional governance, we must first distinguish between the *administration* of justice and the *morality* of the actor. Your central figure is not merely managing a state; she is navigating the collapse of one moral order into the birth of another. In this specific context, **Classic Dirty Hands** offers the more coherent account of moral responsibility, while **Deferred Institutional Culpability** offers a more viable—but morally fragile—strategy for political stability.

  Here is the direct comparison of their conceptual structures, and why the architecture of deferral risks collapsing under the weight of its own abstraction.

  ### 1. The Locus of the Stain: Conscience vs. Timeline
  The **Classic Dirty Hands** model posits that moral responsibility is indivisible. When a necessary evil is committed, the moral cost attaches to the agent who authorized it. The "stain" is not a metaphor for regret; it is the ontological proof that the agent has violated the very norms they claim to serve. This creates a tragic coherence: the leader saves the state by damaging their own soul. The responsibility is concentrated, immediate, and inescapable.

  **Deferred Institutional Culpability (DIC)**, by contrast, treats responsibility as a debt instrument. It acknowledges the wrong but schedules the repayment for a future date, to be handled by future bodies (truth commissions, courts, reparations boards). Structurally, this moves the locus of responsibility from the *conscience* to the *timeline*. The actor says, "I did this wrong, but the full meaning of this wrong will be processed by the institutions I build."

  **The Coherence Problem:** In transitional governance, the future is not a guarantee; it is a wager. If your character defers culpability to a future institution, she is betting that the future will be stable enough, honest enough, and wealthy enough to pay the debt she incurs today. If that future fails to materialize—if the new regime collapses or the reparative assemblies are defunded—the moral debt does not vanish; it evaporates. By distributing responsibility across time, DIC risks dissolving the "stain" into a series of administrative tasks. If the future institution fails to reckon with the act, the act remains morally unaccounted for. Classic Dirty Hands avoids this risk by insisting the accounting happen *now*, in the only place that definitely exists: the actor's own moral awareness.

  ### 2. The Nature of the Wrong: Violation vs. Cost
  Under **Dirty Hands**, the wrong is a *violation*. It is a rupture in the moral fabric that cannot be fully repaired, only endured. The actor accepts that they have become, in a specific sense, what they fought against. This preserves the reality of the victim's suffering because it admits that some harms cannot be "fixed" by procedure, only witnessed by guilt.

  Under **DIC**, the wrong is treated as a *cost*. It is an expenditure required for the transition, to be balanced later by the budget of justice. This is where the risk of "clean administrative procedure" becomes acute. By structuralizing the guilt, DIC invites the temptation to view the violence of transition as a line item in a nation-building ledger. It suggests that if the future constitution is written correctly, the blood spilled today is redeemed.

  **The Victim Question:** Does DIC honor the victim? Only if the deferral is binding. If your character authorizes torture or betrayal today with the promise that a Truth Commission in five years will "handle" the moral weight, she is effectively using the victim's suffering as collateral for her political survival. Unless she guarantees that the future institution will have the power to punish *her*, the deferral is a form of aestheticization—it makes the violence look like a necessary step in a grand design rather than a visceral injury to a human being. Classic Dirty Hands honors the victim more deeply because it refuses to subsume their suffering into a "greater good" narrative. It insists the suffering remains a jagged, unresolved edge in the leader's life.

  ### 3. The Burden on the Actor: Paralysis vs. Vigilance
  The strongest argument for **DIC** is that Classic Dirty Hands can be paralyzing. If a leader believes every compromise damns them eternally, they may hesitate when speed is required, or they may collapse under the weight of isolation. DIC allows the leader to function by sharing the burden. It says, "I am not the sole judge of this; the democratic process to come will judge this."

  However, for a *private reckoning*, this sharing is an illusion. Your character cannot share her conscience. If she relies on DIC to soothe her guilt, she risks moral numbness. She begins to believe the procedure absolves her.

  **The Synthesis for Coherence:**
  Deferred Institutional Culpability is only coherent if it is underwritten by Classic Dirty Hands.
  *   **Without the Stain:** DIC becomes bureaucratic evasion. The actor says, "The future will deal with it," and sleeps soundly. This dissolves responsibility.
  *   **With the Stain:** DIC becomes a mandate for vigilance. The actor says, "I have dirty hands, and because I do, I am uniquely obligated to ensure the future institutions actually do the work I am deferring to them."

  In this light, **Classic Dirty Hands is the more fundamental account of responsibility.** It provides the moral gravity that prevents DIC from floating away into abstraction. You can distribute the *work* of justice (the trials, the reparations), but you cannot distribute the *culpability* for the initial violation. If your character tries to offload the culpability, she ceases to be a moral agent and becomes a functionary of history.

  ### Conclusion: The Verdict for Your Novel
  For the purpose of framing your character's private reckoning, **Classic Dirty Hands** offers the more coherent and dramatic account of responsibility. It preserves the reality of the moral wrong by insisting that the cost cannot be fully transferred.

  However, you can use **Deferred Institutional Culpability** as the *trap* she must avoid. The tension in your novel should not be a choice between the two, but a recognition that DIC is the political necessity that threatens to corrupt her moral integrity. She must build the future institutions (DIC) to save the state, but she must refuse to let those institutions absolve her (Dirty Hands).

  If she believes the deferral cleans her hands, she becomes the next authoritarian. If she believes the stain is hers alone, but uses that stain as fuel to ensure the future institutions are robust enough to judge her, she achieves a coherent, albeit tragic, responsibility. The architecture of deferral cannot survive unless the actor remains marked. If the mark is removed, the deferral is just a lie told to the future. Therefore, the "stain" must remain personal, even if the *reparation* is institutional. The guilt is hers; the justice belongs to the people. Confusing the two is where the moral failure lies.
