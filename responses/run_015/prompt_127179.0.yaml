answer: |-
  Your friend is right, and she is pointing out a fundamental misunderstanding of how information cascades work. The good news is that your goal is correct (cascades *are* the enemy), but your proposed mechanism won't stop them, and discarding data will actively hurt your outcome.

  Here is the breakdown of what your friend means, why your current fix fails, and the actual structural changes that will solve the problem.

  ### 1. What your friend is talking about

  **The Cascade Mechanism**
  You are operating under the belief that a cascade happens because readers know their *position* in line (e.g., "I am Reader 7, so 6 people went before me").
  In game theory, an information cascade happens because readers see the *aggregate outcome* of previous decisions, regardless of order.

  If I am Reader 3, and I look at the sheet and see two "9/10" scores already entered, I now have public information. If my private assessment of the file is "5/10," I face a conflict. I have to ask: *"Is it more likely that I am right and two other professionals are wrong, or that I missed something and they saw merit I didn't?"*
  Rationally, I should update my belief toward the group. If I change my score to match theirs, I am not making a reasoning error; I am performing Bayesian updating. I am treating their scores as data points.

  **Why Shuffling is Cosmetic**
  Hiding the timestamps does not hide the *data*.
  If I see eight scores are "9s" and one is a "5," I know there is a consensus. I don't need to know *who* voted first to feel the pressure to conform to the 9s. The cascade is driven by the **weight of public information**, not the chronology of its entry. As long as readers can see the running tally before they submit their own score, the cascade remains possible.

  **Why Discarding Late Voters is Dangerous**
  Your friend's point here is subtle but critical.
  *   **Early voters** have almost no public information. Their votes are pure "private signal."
  *   **Late voters** have lots of public information. Their votes are "contaminated" by the group.

  However, if a cascade is *wrong* (e.g., the first three readers loved a mediocre file), the only thing that can stop it is a late reader with a **very strong private signal** who votes against the grain despite the pressure.
  If Reader 9 sees eight "9s" but still submits a "2," that is an incredibly high-value data point. It suggests the file has a fatal flaw that the others missed. By discarding the last third of voters, you are systematically deleting the very people most likely to break a false cascade. You are keeping the herd and culling the outliers.

  ### 2. Why your proposed fix won't work

  1.  **The Running Tally:** As long as the sheet updates in real-time, you have sequential voting. Sequential voting *always* risks cascades. Anonymity prevents social pressure (fear of looking stupid in front of colleagues), but it does not prevent informational pressure (assuming the group knows something you don't).
  2.  **Reducing N:** Dropping from 9 readers to 6 reduces your statistical power. With only 400 files and a need for a precise Top 20 ranking, you want more signal, not less.
  3.  **False Security:** You will feel like you've solved the problem, but the cognitive dynamic remains. Readers will still anchor to the average they see on the screen.

  ### 3. The Actual Fix

  You cannot manage a cascade once it has started; you must prevent the conditions that allow it to form. Here is the protocol you should implement instead.

  **A. Simultaneous Submission (The Hard Lock)**
  This is the only way to guarantee independence.
  *   Readers access the files independently.
  *   **Crucial:** The shared sheet must be locked. Reader 1 cannot see Reader 2's score until *everyone* has submitted their score for that specific file.
  *   Ideally, readers should not even know how many people have scored a file yet. They should just score and submit.
  *   Once all 9 scores are in, the sheet unlocks, and the committee sees the distribution.

  **B. Calibration Sessions (Pre-Game)**
  Cascades often form because readers have different internal rubrics. Reader A thinks a "7" is "good enough to fund," while Reader B thinks a "7" is "reject." When Reader A sees Reader B's "4," they panic.
  *   Hold a session where everyone scores the same 5 sample files *before* the real review starts.
  *   Reveal the scores immediately.
  *   Discuss the discrepancies. ("Why did you give this a 9 and I gave it a 5?")
  *   This aligns the mental rubrics, reducing the variance that triggers cascades later.

  **C. Statistical Normalization (Post-Game)**
  Readers have different baselines. Some are harsh (average score 4/10), some are lenient (average score 8/10).
  *   Don't use raw scores for the final ranking.
  *   Convert each reader's scores to **z-scores** (how many standard deviations above/below *their* mean).
  *   This ensures that a "9" from a harsh reader counts the same as a "9" from a lenient reader. This reduces the noise that makes readers doubt their own judgment.

  **D. The "Devil's Advocate" Rule (If discussion is needed)**
  If you must discuss files after scoring (to determine the Top 20):
  *   Do not discuss the average score first.
  *   Assign one reader at random to argue *against* the consensus for the top candidates.
  *   This forces the group to process negative information that the cascade might have suppressed.

  ### 4. Is it hopeless?

  No. It is very fixable, but it requires changing the **timing** of information release, not just the **presentation** of the data.

  **Summary of Recommendations:**
  1.  **Kill the running tally.** No one sees anyone else's score until all 9 are submitted for a given file.
  2.  **Keep all 9 readers.** Do not discard the late voters; they are your safety valve against group error.
  3.  **Normalize the data.** Use statistics to account for reader variance rather than trying to police human psychology.
  4.  **Calibrate early.** Align the rubric before the work begins.

  Your friend is correct: You are treating a structural incentive problem as a user interface problem. If you lock the box until everyone has dropped their ballot in, you get the nine independent opinions you are looking for.
