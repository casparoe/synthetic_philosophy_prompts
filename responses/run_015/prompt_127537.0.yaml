          6.  Pricing alternatives.

  8.  *(Self-Correction on Inexorability)*: If karma is inexorable, I *can't* stop it. So (6) is moot. If I *can* stop it, karma isn't inexorable. This is a major tension in the literature. I need to highlight that the "Desert Reading" often collapses if karma is mutable by compassion. If it's immutable, morality is hollow. This suggests the "Desert Reading" needs to be softer (tendencies, not laws).

  9.  *(Final check on User's Preference)*: User wants to keep (1) & (2). So I must show how to keep Desert without accepting (6). This requires rejecting (3) and (5).

      *   *Plan:*
          *   Target (3): Desert reasons are agent-relative (or agent-specific).
          *   Target (5): Compassion is an independent weight that can override desert in the interpersonal sphere, even if desert holds in the cosmic sphere.
          *   Address the "Ad Hoc" charge: Use the distinction between *Cosmic Justice* and *Human Duty*.

      *(Wait, one more thing)*: The "Merit Transfer" idea is key in Mahayana. It directly addresses the "Compassion vs. Karma" tension. I should mention it as a theological fix that informs the philosophical one.

