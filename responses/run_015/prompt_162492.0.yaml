answer: |-
  You have put your finger on the single most important distinction in modern causal inference, and you have done it without using the standard jargon. You are correct: the tables are mathematically identical. The probabilities $P(Y|T, Z)$ do not change. What changes is the *story* the numbers tell about the world.

  In the philosophy of science, we call this the problem of **observational equivalence**. Multiple causal structures can generate the exact same joint probability distribution. To distinguish them, you cannot look at the data alone; you must look at the *generative process*.

  You asked for the carving, not the word. So I will not just give you a dictionary. I will give you the structural boundaries that separate these three versions. The field *does* have names for these, but they are often siloed between epidemiology, econometrics, and computer science. I will unify them for you under a single framework: **The Causal Role of the Stratifier.**

  Here is the carving of your three versions.

  ### Version 1: The Confounder (The "Common Cause")
  *   **The Structure:** The variable you split by ($Z$, severity) causes the Treatment ($T$) *and* causes the Outcome ($Y$).
      *   $Z \rightarrow T$
      *   $Z \rightarrow Y$
  *   **The Reversal:** This is the classic Simpson's Paradox. The marginal association (overall) is biased because the treatment group is "loaded" with sick people.
  *   **The Carving:** $Z$ is a **Confounder**. It creates a "backdoor path" between treatment and outcome.
  *   **The Decision:** You **must** condition on (split by) $Z$. The stratified numbers are the truth; the overall number is a lie.
  *   **The Target Quantity:** The **Causal Effect** (specifically, the Average Treatment Effect).
  *   **Established Name:** **Confounding Bias**.

  ### Version 2: The Mediator (The "Mechanism")
  *   **The Structure:** The Treatment ($T$, program) causes the variable you split by ($Z$, exercise adherence), which in turn causes the Outcome ($Y$, function).
      *   $T \rightarrow Z \rightarrow Y$
  *   **The Reversal:** The program works *by* getting people to exercise. If you split by exercise, you are comparing program patients to non-program patients *who did the same amount of exercise*. You have surgically removed the program's primary mechanism of action.
  *   **The Carving:** $Z$ is a **Mediator**. It sits on the causal pathway.
  *   **The Decision:** You **must not** condition on $Z$ if you want to know if the program works. Conditioning blocks the path.
  *   **The Target Quantity:** You are trying to estimate the **Total Effect** (the effect of $T$ on $Y$ through all pathways). By splitting, you are accidentally estimating the **Controlled Direct Effect** (the effect of $T$ on $Y$ *not* through $Z$).
  *   **The Mistake Name:** **Overadjustment Bias** (or "Conditioning on a Mediator").
  *   **Why it feels wrong:** Your intuition is perfect. You are "subtracting the exact thing the program was supposed to cause." In policy terms, you are asking, "Does the program help *beyond* just making people exercise?" which is usually not the question a clinic owner asks. They ask, "Does the program help?"

  ### Version 3: The Collider/Descendant (The "Artifact")
  *   **The Structure:** The variable you split by ($Z$, pain at 3 weeks or imaging referral) is caused by the Outcome ($Y$) or is a common effect of Treatment and Outcome.
      *   $T \rightarrow Y \rightarrow Z$ (Descendant)
      *   OR $T \rightarrow Z \leftarrow Y$ (Collider)
  *   **The Reversal:** This is the most dangerous one. By splitting on $Z$, you are selecting a subset of patients based on something that happened *after* the treatment started and potentially *after* the outcome was determined.
      *   *Example:* If you split by "Referred for Imaging," you are splitting by a decision that doctors make *because* the patient isn't getting better. You are conditioning on failure.
  *   **The Carving:** $Z$ is a **Post-Treatment Variable** (specifically a Collider or a Descendant of the Outcome).
  *   **The Decision:** You **must not** condition on $Z$. The stratified numbers are meaningless artifacts of selection.
  *   **The Target Quantity:** None. The stratification destroys the validity of the comparison.
  *   **The Mistake Name:** **Selection Bias** or **Collider Bias** (sometimes "Post-Treatment Bias").
  *   **Why it feels meaningless:** Because you are effectively comparing apples to oranges based on a criterion that the treatment itself influenced. You have "manufactured the reversal by cutting on the wrong line," exactly as you suspected.

  ---

  ### The Mixed Case: The "Time-Varying Confounder"
  You asked about the edge case: *What if the stratifier is partly a reason people ended up in the treatment group (motivation) and partly caused by the treatment (program boosted motivation)?*

  This is the hardest problem in observational analytics.
  *   **Structure:** $U \text{ (Motivation)} \rightarrow Z \text{ (Exercise)} \leftarrow T \text{ (Program)}$ AND $Z \rightarrow Y$.
  *   **The Problem:** $Z$ is simultaneously a Confounder (due to prior motivation) and a Mediator (due to program effect).
  *   **Identifiability:** With the kind of data a small clinic chain usually has (simple intake and discharge forms), **this is generally not identifiable.** You cannot mathematically separate the "motivation that brought them in" from the "motivation the program created" using only $Z$ measured at follow-up.
  *   **The Solution:** You need **Longitudinal Measurement**. You must measure $Z$ *before* treatment starts ($Z_{pre}$) and *after* treatment starts ($Z_{post}$).
      *   Adjust for $Z_{pre}$ (to fix confounding).
      *   Do *not* adjust for $Z_{post}$ (to avoid blocking mediation).
  *   **If you can't do that:** You have to make a theoretical choice. Is $Z$ mostly selection or mostly mechanism? In physio, "home exercise adherence" is usually mostly mechanism (Version 2). "Baseline activity level" is mostly selection (Version 1).
  *   **Advanced Term:** If you had complex longitudinal data to solve this, you would use **G-Methods** (Inverse Probability Weighting). For your context, simply acknowledge the **Ambiguous Post-Treatment Confounding** and treat the estimate as sensitive to unmeasured assumptions.

  ---

  ### Practical Diagnostic: How to tell them apart in your dataset
  Since you can't run a randomized trial, you need a heuristic to decide whether to split or not. Do not rely on the p-values. Rely on the **Timestamp and Mechanism Test**.

  Ask these three questions about the variable $Z$ you want to split by:

  1.  **Temporal Order:** Was $Z$ measured *before* the treatment started?
      *   **Yes:** It is likely a **Confounder** (Version 1). *Split.*
      *   **No:** It is likely a Mediator or Collider (Version 2 or 3). *Do not split (yet).*

  2.  **Causal Direction:** Does the treatment *cause* $Z$?
      *   **Yes:** It is a **Mediator** (Version 2). *Do not split* if you want the Total Effect.
      *   **No:** Go to question 3.

  3.  **Outcome Influence:** Does the outcome (or progress toward it) *cause* $Z$? (e.g., Did pain cause the referral?)
      *   **Yes:** It is a **Collider/Descendant** (Version 3). *Do not split.* The numbers are trash.

  ### Summary of Terms for Your Arguments
  When arguing with your sister or writing reports, use these specific pairings to show you understand the *structure*, not just the math:

  *   **Version 1:** "This is **Confounding**. We must adjust for severity to get the **Causal Effect**."
  *   **Version 2:** "This is **Overadjustment Bias**. $Z$ is a **Mediator**. If we adjust, we block the pathway and estimate the **Direct Effect**, not the **Total Effect**."
  *   **Version 3:** "This is **Selection/Collider Bias**. $Z$ is a **Post-Treatment Variable**. Adjusting creates spurious associations."

  ### A Coinage for Your Workflow
  Since you asked me to coin a term if one didn't exist: The field has names for the *variables* (Confounder, Mediator, Collider), but it lacks a catchy name for the *phenomenon of the reversal itself* in these specific contexts.

  For your internal clinic analytics, I propose you label the **Decision Rule** itself. Call it **"The Pre-Treatment Test."**

  *   **Definition:** A stratification variable is valid for causal adjustment *only if* it is causally prior to the treatment assignment.
  *   **Boundary Case:** If the variable is measured after treatment starts, it fails the Pre-Treatment Test. You must assume it is a Mediator (Version 2) or Collider (Version 3) unless you have baseline data proving otherwise.
  *   **Usage:** "We cannot split by exercise adherence because it fails the Pre-Treatment Test; it is downstream of the intervention."

  This gives you the vocabulary to stop arguing about the tables and start arguing about the timeline, which is where the truth actually lives.
