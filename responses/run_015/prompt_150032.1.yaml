answer: |-
  Your ledger is fundamentally flawed because it treats the utterance of a promise as identical to the creation of a binding obligation, ignoring both the distinction between procedural felicity and speaker sincerity and the prevalence of implicit commitments that lack performative verbs.

  You have conflated three distinct failure modes in speech act theory: misfires, abuses, and breaches. A **misfire** occurs when the conventional procedure is flawed (e.g., the speaker is joking, lacks authority, or the context is inappropriate); here, no act is achieved, and your current system correctly excludes these if your filters are perfect. An **abuse** occurs when the procedure is executed correctly, but the speaker lacks the requisite psychological state (intention to fulfill); here, the act *is* achieved, and an obligation exists socially, but the utterance is defective because the speaker lies about their intention. A **breach** occurs when the act is achieved and sincere, but the future action is not performed. Your system assumes abuses are misfires (no obligation created), but in normative systems, an insincere promise still creates an obligation—it is simply a fraudulent one. Regarding truth-evaluability: while the performative utterance itself is not true or false, it *expresses* a psychological state (belief/intention) that is truth-evaluable; when a speaker says "I promise," they represent that they intend to do the act, and if they do not, they have violated a sincerity condition, not a truth condition.

  Furthermore, your reliance on explicit performative verbs ignores how most commitments function pragmatically. Promises are often implicit, derived from Gricean implicature rather than syntax; saying "I'll have the draft on your desk Friday" in response to a request functions identically to "I promise I'll have the draft," despite lacking the verb. Conversely, explicit formulas can be non-committing, such as in conditionals ("If I promise, will you help?"), hypotheticals ("I would promise if I could"), or reported speech ("She said 'I promise'"). By hard-coding syntax as the trigger for obligation, your ledger will miss the majority of real-world commitments and falsely log obligations where none were intended.

  To fix this, your ledger should not track "live obligations" as binary facts derived from syntax, but rather "commitment claims" within a defeasible logic framework. Each entry should store the utterance, the claimed obligor/obligee, the content, and metadata tags for: (1) **Explicitness** (direct performative vs. implicit implication), (2) **Felicity Confidence** (probability that context/joking rules apply), and (3) **Sincerity Indicators** (hedging, modal verbs, historical reliability). The system should allow entries to be challenged and downgraded based on subsequent dialogue (e.g., "I never agreed to that") rather than treating the initial utterance as an immutable transaction.

  **Relevant Fields:** Linguistic Pragmatics (Speech Act Theory, Implicature), Deontic Logic (Normative Systems), Contract Law (Offer/Acceptance, Meeting of Minds), and Argumentation Mining (AI).
