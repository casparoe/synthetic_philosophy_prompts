answer: |-
  Good evening, Harrow's Bend.

  Please, stay seated. I know the folding chairs are facing the wrong way—they always are—but shifting now will only knock over the pie.

  I'm the librarian. That means I spend most of my life correcting people about due dates, so I'll keep this short. You've had beans, you want sugar, and the fourth graders are vibrating over there like springs.

  We're here for Mercy Dane. In 1801, according to the story, she walked eleven children through a flooded millrace to the stone meeting house. She kept them safe for three days on communion bread until the water went down. Every year, Ruth Vance writes the script, casts the parts, and teaches our children what it looks like to be brave.

  Last month, Marisol Reyes from the university went through the town clerk's books. She found Mercy Dane on the 1801 tax list. So Mercy was real. She was a schoolmistress. She was here.

  Marisol also found that the stone meeting house wasn't built until 1846. And the selectmen's logs from 1803 mention a drought, but no flood.

  So we have a person who existed, a building that didn't, and water that isn't recorded. Some folks say the story is bunk. Some say it was Providence. I'm not qualified to judge Providence, and I won't call bunk on a story that's kept this town together for a hundred years.

  The librarian before me, Eunice Pell, used to say local stories are shadows, not photographs. A photograph tells you what color the coat was. A shadow tells you something stood there, and how tall it was, and which way the light was hitting it. But a shadow gets longer and blurrier the farther it travels.

  We are far down the road from 1801. The details are blurry. The meeting house date is wrong. The flood isn't in the log. But the shadow is still here. The shape of it is specific: a woman, alone, responsible for children, refusing to leave them behind when the water rose. Whether the water was millrace or mud, whether the house was stone or wood, the shape of the care is the same.

  If I stand here and say the story is fact, I ignore the records. If I say it's fiction, I ignore the feeling in this chest when the fourth grade walks out onto the common. Eunice might have been wrong about shadows. But she was right about what matters. We aren't honoring a flood. We're honoring the promise that the adults in this town will walk through the water before they let the children drown.

  So here is my recommendation to the Selectmen, and to Ruth.

  Keep the pageant exactly as it is. Do not change a line of Ruth's script. Fifty years of fourth graders have learned courage from those words. That history is real now, even if 1801 isn't.

  But starting this year, the Library will display Marisol's findings in the lobby during Founder's Day. We'll put the tax list next to the script. We'll show the 1846 blueprint next to the 1801 story. Let the records stand beside the legend. Let the children play Mercy Dane, and let the adults read the receipts.

  We can hold both. We can honor the work Ruth has done to keep Mercy alive, and we can honor the work Marisol has done to keep the records straight. One tells us who we want to be. The other tells us where we came from.

  Now, the selectmen vote next Tuesday. But the pie is getting cold, and the fourth grade has been practicing their walking for three weeks.

  Let's let them be Mercy. Let us be the town that watches out for them.

  Enjoy the evening.

  ***

  **Note on the "Lie":**

  The line *"Whether the water was millrace or mud... the shape of the care is the same"* is the one you might feel slippery saying. It smuggles in the assumption that *some* crisis happened (the water/mud), which Marisol might flag as you asserting the disputed event occurred just to make the metaphor work. If there was no flood at all, there was no water or mud to walk through, and the "care" looks different (perhaps just keeping them late at school). I left it in because it bridges the gap for the Dane family and Ruth without explicitly confirming the flood, but be aware it relies on the audience accepting the *spirit* of the crisis even if the *letter* is unproven.
