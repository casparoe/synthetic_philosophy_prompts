      *   Step (5) is the culprit. It asserts that Cantor's theorem makes an "absolute claim that no surjection exists at all." This is the scope shift. Cantor's theorem, formalized in ZFC, says "For every set $X$, there is no surjection $f: X \to \mathcal{P}(X)$ *that is a set in the universe*." It does not quantify over external meta-theoretic functions.
