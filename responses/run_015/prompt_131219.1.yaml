      *   **Resolution/Synthesis:** The real issue isn't rationality, it's *certainty*. Rational agents should have uncertainty about opponent rationality. Once uncertainty is introduced (even slightly), BI collapses.
      *   **Conclusion:** RCT is not broken. The Centipede game exposes the impossibility of CKR in finite beings. The "failure" is a feature of realistic epistemology, not a bug in rational maximization.

