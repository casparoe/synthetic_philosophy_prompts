answer: |-
  # Specification for a Theory of Multipolar Traps

  ## 1. Non-Negotiable Desiderata (Core Requirements)
  *These are structural requirements. If the theory fails these, it is not a theory of multipolar traps; it is a theory of something else.*

  ### A. Case Coverage & Scalability
  **Requirement:** The theory must simultaneously explain:
  1.  **Slow/Physical Traps:** Climate inaction (long time horizon, tangible resources, sovereign actors).
  2.  **Fast/Digital Traps:** AI development races (short time horizon, intangible assets, corporate/state mix).
  3.  **Renewable/Cyclical Traps:** Fisheries collapse (local enforcement possible, but global markets drive overharvest).

  **Why Non-Negotiable:** A theory that only works for sovereign states (IR Realism) fails AI (corporate actors). A theory that only works for renewable resources (Bioeconomics) fails AI (non-rivalrous code). If the mechanism changes entirely between these cases, you have three theories, not one.

  ### B. The Trap vs. Collective Action Distinction
  **Requirement:** The theory must distinguish between a **Hard Collective Action Problem** (coordination is costly but possible with sufficient incentive alignment) and a **Multipolar Trap** (coordination is structurally precluded even with incentive alignment).

  **Why Non-Negotiable:** Standard economics assumes most collective action problems are solvable via Coasean bargaining or Pigouvian taxes. A "trap" implies a failure mode where the solution space is inaccessible. If the theory treats a trap as merely a "high transaction cost" problem, it underestimates the lock-in and suggests solutions (e.g., "just tax carbon") that historically fail in trap conditions.

  ### C. The Directionality Distinction (Bottom vs. Bad Top)
  **Requirement:** The theory must distinguish between a **Race to the Bottom** (deregulation, lowering standards to cut costs) and a **Race to the Top that Ends Badly** (escalating capabilities, safety overrides, "fast takeoff").

  **Why Non-Negotiable:** Popular discourse conflates "bad outcome" with "lowering standards." In AI, actors are racing to *increase* capability (a "top"), yet the structural outcome is existential risk. A theory that relies on "degradation" as the mechanism of the trap cannot explain traps driven by optimization for positive metrics (speed, intelligence, yield) that externalize tail risks.

  ### D. Epistemic Fragmentation (The Model Mismatch)
  **Requirement:** The theory must account for **Epistemic Fragmentation Traps**, where agents do not merely defect on a known payoff matrix, but operate under **divergent models of the payoff structure itself**. This is not information asymmetry (I know $X$, you don't); it is ontological disagreement (I believe the game is Finite, you believe it is Infinite; I believe risk is linear, you believe it is exponential).

  **Why Non-Negotiable:** Standard Game Theory assumes Common Knowledge of Rationality and Payoffs. Institutional Economics assumes Shared Norms. If agents cannot agree on *what game is being played*, Schelling points cannot form, and contracts cannot be written. Treating this as mere "noise" or "asymmetry" renders the theory blind to modern polarization and tech-dispute dynamics.

  ### E. Institutional Consistency
  **Requirement:** The theory must be consistent with the observed **persistence of some institutions** alongside the **collapse of others**. It cannot assume a state of nature (anarchy) nor a Leviathan (total centralization).

  **Why Non-Negotiable:** We observe fisheries that *don't* collapse (Ostrom-style governance) and climates that *do*. A theory that predicts universal collapse is falsified by success cases. A theory that predicts universal cooperation is falsified by failure cases. It must explain the *boundary conditions* of institutional resilience.

  ---

  ## 2. School-Specific Preferences (Negotiable)
  *These are often demanded by specific camps but are not strictly necessary for a functional theory. Distinguish these from the core.*

  | Preference | School of Thought | Why it's a Preference, Not a Requirement |
  | :--- | :--- | :--- |
  | **Methodological Individualism** | Neoclassical Econ / Game Theory | Assumes all outcomes reduce to individual utility maximization. Often fails to capture emergent cultural/memetic pressures that constrain individual choice (e.g., "Moloch"). |
  | **Historical Materialism** | Marxist / Structuralist | Assumes traps are purely functions of capital accumulation modes. Ignores traps that exist in non-capitalist systems (e.g., commons in pre-market societies). |
  | **Evolutionary Inevitability** | Evolutionary Psych / Memetics | Assumes traps are natural selection outcomes and thus hard to escape. Risks fatalism; ignores human capacity for novel institutional design. |
  | **Rational Expectations** | Macro / Finance | Assumes agents learn from errors. In traps, agents may learn "correctly" to defect, reinforcing the trap. Rationality does not guarantee optimality. |

  ---

  ## 3. Incompatibility Matrix (Where the Theory Breaks)
  *You asked to know if these can be satisfied together. Here is where the tension lies.*

  1.  **Epistemic Fragmentation vs. Institutional Consistency:**
      *   *Conflict:* Institutional Economics relies on agents agreeing on norms/rules to solve traps. Epistemic Fragmentation says agents cannot agree on the reality the rules govern.
      *   *Result:* You cannot have a theory that relies on *negotiated solutions* while simultaneously asserting *model divergence*. If the fragmentation is deep enough, institutions cannot form. If institutions form, fragmentation was not deep enough to be a "trap."

  2.  **Rationality (Game Theory) vs. Race to the Top:**
      *   *Conflict:* Standard Game Theory assumes agents maximize utility. In a "Race to the Top" (AI), agents maximize capability, often knowing it increases systemic risk.
      *   *Result:* To explain this, you must either argue agents are irrational (violating Rational Choice) or that their utility function includes "survival of the firm" > "survival of the system." The latter requires a theory of **bounded moral circles** that standard Game Theory does not natively possess.

  3.  **Scalability vs. Mechanism:**
      *   *Conflict:* Mechanisms that solve Fisheries (local monitoring, social shaming) do not scale to Climate (global, anonymous) or AI (opaque, proprietary).
      *   *Result:* A single mechanism (e.g., "reciprocity") is unlikely to satisfy the Case Coverage desideratum. The theory likely needs a **meta-mechanism** (e.g., "feedback loop latency") rather than a specific behavioral rule.

  ---

  ## 4. The Killer Desideratum
  **Which single requirement kills the most popular accounts?**

  **The Winner:** **Epistemic Fragmentation (D).**

  **Why it kills the competition:**
  1.  **Kills Neoclassical Game Theory:** Nash Equilibria and Folk Theorems require a defined game structure (payoff matrix) known to all players (or at least common priors). If Agent A thinks the payoff for cooperation is $+5$ and Agent B thinks it is $-5$ (due to different world models), there is no equilibrium to calculate. The math breaks.
  2.  **Kills Institutional Economics (Ostrom):** Ostrom's design principles rely on "shared understanding of the system." If the users of the commons do not share a model of the resource's regeneration rate or the stakes, the "trust" required for monitoring and sanctioning cannot generate.
  3.  **Kills the "Moloch" Framing:** The Scott Alexander/Moloch framing often personifies the trap as a singular force that everyone *sees* but is powerless to stop. Epistemic Fragmentation implies people don't even agree Moloch exists. Some think the race is necessary; some think it's a myth. This makes the "unifying enemy" narrative false.

  **Implication:** To satisfy this, the theory must move beyond **Game Theory** (which assumes agreed rules) to **Complex Adaptive Systems** or **Cybernetics** (which handles divergent control models).

  ---

  ## 5. Scorecard of Usual Suspects

  | Theory / Framework | Case Coverage | Trap vs. Collective Action | Bottom vs. Bad Top | Epistemic Fragmentation | Institutional Consistency | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Neoclassical Game Theory** | **Fail** (Struggles with AI/Non-market) | **Fail** (Treats traps as solvable coordination games) | **Fail** (Assumes utility maximization = good) | **Critical Fail** (Assumes common priors/payoffs) | **Pass** (Explains some contract failures) | **Rejected.** Mathematically rigorous but assumes away the core problem (agreement on reality). |
  | **Institutional Econ (Ostrom)** | **Partial** (Great on Fisheries, weak on AI/Climate) | **Pass** (Distinguishes governance types) | **Partial** (Focuses on resource depletion, not capability escalation) | **Fail** (Relies on shared norms/communication) | **Pass** (Explains resilience well) | **Conditional.** Works for slow, local traps. Breaks on fast, epistemic traps. |
  | **Moloch / Memetic (Alexander)** | **Pass** (High-level fit for all cases) | **Pass** (Captures the "lock-in" feel) | **Pass** (Explains optimization pressure) | **Partial** (Acknowledges cultural drift, but treats Moloch as monolithic) | **Fail** (Lacks mechanistic account of *how* institutions fail/succeed) | **Heuristic Only.** Good for intuition, bad for prediction or solution design. |
  | **Complex Systems / Cybernetics** | **Pass** (Handles diverse scales) | **Pass** (Focuses on feedback loops, not just incentives) | **Pass** (Focuses on system stability, not direction) | **Pass** (Handles divergent models/control errors) | **Pass** (Explains resilience/collapse dynamics) | **Strongest Candidate.** Only framework that natively handles model mismatch and feedback latency. |

  ## 6. Summary Specification
  To commit to a theory of multipolar traps, you must demand a framework that:
  1.  **Drops Common Knowledge:** Abandons the assumption that agents agree on the payoff matrix.
  2.  **Generalizes Optimization:** Explains why maximizing *positive* variables (speed, yield) creates negative systemic outcomes.
  3.  **Identifies Latency:** Locates the trap in the time-lag between action and feedback (which allows epistemic divergence to grow), rather than just in the incentive structure.

  **Final Warning:** If you choose a theory that satisfies **Epistemic Fragmentation**, you sacrifice **Predictive Precision**. You gain explanatory power for why coordination fails, but you lose the ability to calculate *when* it will fail, because the agents' internal models are unobservable and shifting. This is the trade-off: **Mechanism vs. Predictability.**
