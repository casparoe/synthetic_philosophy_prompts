prompt: |-
  i'm trying to figure out what i should actually demand from a theory of multipolar traps and races-to-the-bottom before i commit to one. write me the desiderata: what cases it has to explain (climate inaction, ai development races, maybe fisheries collapse), which distinctions it can't collapse — like between a true multipolar trap and just a hard collective-action problem, or between a race to the bottom and a race to the top that still ends badly — and which institutional features it needs to stay consistent with. for each, say why it's a real requirement and not just a prejudice of one camp, and flag which ones are non-negotiable versus which are just preferences of particular schools. also, the theory has to handle what i'll call 'epistemic fragmentation traps,' where the agents don't just defect but actually stop sharing a model of the payoff structure itself — don't let it treat that as plain infromation asymmetry. if some subset of these can't all be satisfied together, say so — that's the part i care about most. tell me which single desideratum kills the most popular game-theoretic and institutional-economics accounts. briefly score the usual suspects — evolutionary/game-theoretic, institutional economics, maybe the scott alexander-style moloch framing — against your list. no bibliography needed, i just want the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of multipolar traps:

  1.  **Deconstruct the Request:**

      *   **Goal:** Define desiderata (requirements) for a theory of multipolar traps/races-to-the-bottom.
      *   **Key Components:**
          *   Cases to explain (Climate, AI, Fisheries, etc.).
          *   Distinctions to maintain (Multipolar trap vs. Collective Action Problem; Race to Bottom vs. Race to Top gone wrong).
          *   Institutional features to remain consistent with.
          *   Specific focus: "Epistemic Fragmentation Traps" (agents don't share a model of payoffs, not just info asymmetry).
          *   Constraint: Distinguish non-negotiables vs. school-specific preferences.
          *   Critical Analysis: Identify incompatibilities (which desiderata kill each other?).
          *   Killer Desideratum: Which single requirement kills the most popular accounts?
          *   Scoring: Evaluate usual suspects (Game Theory, Institutional Econ, Moloch/Scott Alexander).
      *   **Tone/Style:** Analytical, rigorous, no bibliography, "spec" format.

  2.  **Initial Brainstorming & Categorization:**

      *   *What is a multipolar trap?* It's when individual incentives lead to a suboptimal group outcome, often exacerbated by competition.
      *   *What are the standard cases?* Prisoner's Dilemma (PD), Tragedy of the Commons, Arms Races.
      *   *What are the user's specific twists?* Epistemic fragmentation (disagreement on reality, not just incentives), distinction between "trap" and "hard problem," distinction between "bottom" and "bad top."
      *   *What are the schools?* Neoclassical Game Theory, Institutional Economics (Ostrom etc.), Evolutionary Psychology/Memetics (Moloch).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Case Coverage:* Must cover Climate (long term, global), AI (fast, existential, tech-driven), Fisheries (renewable resource, local/global mix). *Why?* If it only works for one timescale or resource type, it's not a general theory.
      *   *Distinction 1 (Trap vs. Collective Action):* A collective action problem might be solvable with cheap talk or simple contracts. A *trap* implies structural lock-in where standard solutions fail. *Non-negotiable:* Must explain why coordination fails *despite* awareness.
      *   *Distinction 2 (Bottom vs. Bad Top):* A race to the bottom lowers standards (labor, safety). A race to the top can also be bad (e.g., escalating AI capabilities leading to risk). *Non-negotiable:* The theory must account for *directionality* of optimization, not just "suboptimal."
      *   *Epistemic Fragmentation:* This is the user's specific addition. Agents have different world models. Not just "I know you defect," but "I think the payoff is X, you think it's Y." *Non-negotiable:* Standard Game Theory assumes common knowledge of payoffs. This breaks that.
      *   *Institutional Consistency:* Must align with observed resilience of some institutions and collapse of others. Can't assume anarchy or total state control.

  4.  **Identifying Tensions/Incompatibilities:**

      *   *The Big Conflict:* Standard Game Theory assumes rational agents with common knowledge (or Bayesian updates). Epistemic Fragmentation explicitly denies common knowledge of the payoff structure.
      *   *The "Moloch" Conflict:* Moloch framing often treats the trap as a mystical force or inevitable evolutionary pressure, which might conflict with Institutional Economics' view that *designable* rules can solve it.
      *   *The "Rationality" Conflict:* If agents are truly rational (Game Theory), they should solve the coordination problem if it's repeated (Folk Theorem). If they don't, either they aren't rational, or the "trap" is deeper (epistemic).
      *   *The Killer:* The **Epistemic Fragmentation** requirement is the hardest. Standard Nash Equilibrium analysis collapses if agents don't agree on the game being played. Institutional Econ assumes we can agree on rules. Moloch assumes the game is fixed.

  5.  **Scoring the Usual Suspects:**

      *   *Neoclassical Game Theory:* Great at defining the trap, terrible at epistemic fragmentation (assumes common priors), often solves too easily with repeated game mechanisms (Folk Theorems).
      *   *Institutional Economics (Ostrom):* Great at solving collective action, but often assumes agents *can* communicate and agree on norms. Struggles with high-speed/tech traps (AI) where norms can't evolve fast enough.
      *   *Moloch/Alexander:* Good at capturing the "feel" and the evolutionary pressure, but often lacks mechanistic rigor. Treats the trap as a monolith, potentially ignoring epistemic nuance (everyone sees Moloch, so why not stop?).

  6.  **Refining the "Epistemic Fragmentation" Point:**

      *   Need to make sure this isn't just "information asymmetry" (I know something you don't). It's "model asymmetry" (I think the world works this way, you think that way). This prevents Schelling points from forming.
      *   *Why it kills Game Theory:* Game theory requires a defined payoff matrix. If agents don't agree on the matrix, there is no single game to solve.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the task.
      *   **Section 1: The Non-Negotiables (Core Desiderata).** Focus on cases, distinctions, and the epistemic constraint.
      *   **Section 2: The School-Specific Preferences.** What different camps want but isn't strictly necessary.
      *   **Section 3: The Incompatibility Matrix.** Where the theory breaks.
      *   **Section 4: The Killer Desideratum.** Identify the one that wipes out the most existing frameworks.
      *   **Section 5: Scorecard.** Evaluate the usual suspects.

  8.  **Drafting the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure not to conflate "Race to the Bottom" with "Multipolar Trap." A trap is the structure; the race is the dynamic.
      *   *Correction on Epistemic:* Ensure I emphasize that this isn't just "noise." It's divergent ontologies.
      *   *Refining the "Killer":* Is it Epistemic Fragmentation? Yes, because standard Game Theory relies on Common Knowledge of Rationality and Payoffs. Institutional Econ relies on Shared Norms. Both fail if the *model of reality* is fragmented.
      *   *Refining the "Race to Top":* Example: AI safety. Everyone wants more capability (Race to Top), but the outcome is existential risk (Bad Outcome). Standard theory often equates "Top" with "Good."

  9.  **Final Review against User Prompt:**

      *   Cases explained? Yes (Climate, AI, Fisheries).
      *   Distinctions maintained? Yes (Trap vs. Collective Action, Bottom vs. Bad Top).
      *   Institutional features? Yes.
      *   Epistemic Fragmentation highlighted? Yes.
      *   Non-negotiable vs. Preference flagged? Yes.
      *   Incompatibilities stated? Yes.
      *   Killer desideratum identified? Yes.
      *   Scorecard included? Yes.
      *   No bibliography? Yes.

  10. **Final Polish:** Ensure tone is sharp, analytical, and direct. (Proceed to generate output).

  *(Self-Correction during final review)*: Wait, I need to make sure I explicitly state *why* the epistemic thing isn't information asymmetry. Information asymmetry is $I know X, you don't$. Epistemic fragmentation is $I think the game is Chess, you think it's Poker$. I will make sure this distinction is clear in the text.

  Also, need to ensure the "Race to the Top" distinction is clear. Usually, races to the bottom imply degradation. But in AI, the race is for *more* capability, which is the "top," but the *consequence* is the trap. The theory must explain why optimizing for "good" metrics leads to bad outcomes without calling it a "bottom."

