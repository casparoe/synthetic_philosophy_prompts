  Here is a case built to your specifications, followed by the analysis you requested.

  ### The Scenario: The High-Frequency Trading Farm

  **Setting:** A server farm in Northern Virginia dedicated to high-frequency trading (HFT).
  **The Partition:** The farm is physically divided into **Row A** (North Wall) and **Row B** (South Wall). This is a spatial, permanent architectural feature, not a temporal one. Both rows exist and operate simultaneously.
  **The Stake:** A specific arbitrage algorithm requires 100% uptime. A server crash costs the firm $250,000 per minute in missed trades and penalties.

  **The Insider Predicate (The Gerrymander):**
  The Site Reliability Engineers (SREs) use the term **"Compliant-Node"** in their Standard Operating Procedures (SOPs). This term is load-bearing; if a server is not a Compliant-Node, the automated deployment script rejects it, and the firm is liable for compliance breaches.
  *   **Definition:** A server is a *Compliant-Node* if and only if:
      *   (It is in Row A **AND** runs Protocol Alpha)
      *   **OR**
      *   (It is in Row B **AND** runs Protocol Beta).

  **The Evidence:**
  The firm has deployed 5,000 servers over the last year.
  *   Every server observed in Row A runs Protocol Alpha.
  *   Every server observed in Row B runs Protocol Beta.
  *   **Therefore:** 100% of observed servers are *Compliant-Nodes*.
  *   **Furthermore:** 100% of observed servers are *Functional* (they do not crash).

  **The Outsider (The Natural Kind Expert):**
  A Network Architect is hired to optimize latency. She analyzes the physical layer. She notes that Protocol Alpha and Protocol Beta are functionally identical software stacks, but they require different voltage regulators.
  *   Row A has Voltage Regulator Type 1.
  *   Row B has Voltage Regulator Type 2.
  *   **Her Claim:** "Compliance" is nonsense. Functionality is determined solely by **Voltage Matching**. Protocol Alpha works on Regulator 1. Protocol Beta works on Regulator 2. The Row location is irrelevant except as a proxy for the Regulator type.

  **The Deciding Test:**
  The firm buys a new batch of servers. Due to a shipping error, a pallet of servers intended for Row B (pre-loaded with Protocol Beta) is installed into **Row A**.
  *   **Physical Reality:** They are in Row A (Regulator 1). They are running Protocol Beta.
  *   **The Prediction:** Will they crash?

  **Hypothesis 1 (The Insider / Compliant-Node):**
  *   **Logic:** Past data shows that Row A servers must run Alpha to be Compliant/Functional. This server is in Row A but runs Beta. It violates the Compliant-Node regularity.
  *   **Prediction:** It will **Crash**. (Because it fails the Compliant-Node condition which has perfectly tracked functionality so far).

  **Hypothesis 2 (The Outsider / Voltage Matching):**
  *   **Logic:** Past data shows that Protocol Beta works perfectly on Regulator 2. But physically, Protocol Beta is just code; Regulator 1 (Row A) provides the same voltage as Regulator 2 (Row B), just labeled differently by the facilities team.
  *   **Correction:** Actually, to make the divergence sharp: Let's say the Architect discovers Regulator 1 and 2 are *electrically identical*.
  *   **Prediction:** It will **Function**. (Because Protocol Beta works on this voltage, proven in Row B).

  *(Note: To ensure the divergence is clear, let's refine the Architect's claim: She claims the "Row" distinction is a legacy label. Regulator 1 and 2 are the same part. Therefore, a Beta server in Row A should work just as well as a Beta server in Row B.)*

  ***

  ### The Analysis

  #### 1. Entrenchment and the "Insider" Twist
  Goodman's solution to the New Riddle is that we project *entrenched* predicates (like "Green") rather than unentrenched ones (like "Grue"). "Green" is entrenched because it has been successfully projected in the past.

  In this scenario, **"Compliant-Node" is the entrenched predicate.** It is in the SOPs, the engineers use it daily, and it has a 5,000-instance track record of successful projection (every Compliant-Node was Functional). The Architect's predicate ("Voltage-Matched") is new and unfamiliar to the operations team.

  *   **The Problem:** If entrenchment is just "frequency of use," the Insider wins. The engineers *should* predict a crash because they are projecting the entrenched predicate.
  *   **The Nuance:** You need to press your students on whether *usage* equals *entrenchment*. Goodman implies entrenchment tracks *actual successful projections*. If the Insider hypothesis is actually relying on a spurious correlation (Row location vs. Voltage), was "Compliant-Node" ever *really* entrenched in the Goodman sense, or was it just a habit?
  *   **The Block:** This scenario blocks the reflex answer ("Grue isn't entrenched") because here, the "Grue" predicate *is* the entrenched one. The "Green" predicate (Voltage Matching) is the scientific novelty. If your students say "Stick with the entrenched term," they must advise the firm to expect a crash and reject the servers, potentially losing the arbitrage opportunity for no physical reason.

  #### 2. Simplicity / Shortest Description
  A formal approach (like Minimum Description Length) suggests we choose the hypothesis that compresses the data best.
  *   **Insider Description:** To describe the data, you need to list the Row *and* the Protocol. "If A then Alpha, If B then Beta." This requires storing the Row variable.
  *   **Outsider Description:** "Functionality depends on Voltage. Row is irrelevant." This deletes the Row variable from the model.
  *   **Verdict:** The Outsider view is simpler *ontologically* (fewer causal variables), but the Insider view might be simpler *computationally* for the engineers (they just check the Row label on the rack, not the voltage).
  *   **The Trap:** If "simplicity" is language-relative, the Insider wins (their language is built around Rows). If "simplicity" is world-relative, the Outsider wins. This forces students to define what simplicity *is*.

  #### 3. Natural Kinds (Metaphysical Primitivism)
  This approach argues that some predicates carve nature at its joints ("Voltage," "Protocol") while others are gerrymandered ("Compliant-Node").
  *   **Application:** "Voltage" is a natural kind. "Row A" is an arbitrary human designation (a spatial coordinate). A law of nature can hold for Voltage; it cannot hold for Row A unless Row A is causally relevant.
  *   **Verdict:** This handles the case best. It dismisses the Insider hypothesis immediately because "Row Location" is not the *kind* of thing that causes server crashes. Voltage is.
  *   **Weakness:** It feels like cheating to students. It asserts a metaphysical fact ("Voltage is real, Rows are not") to solve an epistemological problem ("How do we know which to project?").

  #### 4. Ranking the Approaches
  *   **Best:** **Natural Kinds.** It cuts the Gordian knot. It explains *why* the Insider predicate is risky (it references a non-causal feature).
  *   **Middle:** **Simplicity.** It points in the right direction but requires agreement on what variables count toward complexity.
  *   **Worst:** **Entrenchment.** In this specific setup, Entrenchment leads to the wrong answer (or at least the conservative, potentially costly one). It validates the superstition because the superstition is codified in the company handbook.

  #### 5. The Work-Doing Feature
  The single feature doing the work is **the codification of the gerrymandered predicate as operational dogma.**
  *   **If you delete this:** If the engineers didn't *use* "Compliant-Node" and just said "Row A servers usually do Alpha," the entrenchment objection vanishes. It becomes a standard causal inference problem.
  *   **Why it matters:** By making the "Grue" predicate the *professional terminology*, you force students to confront that "entrenchment" is often just institutional inertia.

  #### 6. The "No Fact of the Matter" Objection
  A pragmatist or anti-realist might say: "There is no fact of the matter about whether the server *will* crash until we test it. 'Compliance' is just a tool. If the server works, we update the definition of Compliance to include (Row A + Beta)."
  *   **Attack:** This dissolves the riddle by denying truth conditions.
  *   **Counter:** The money is real. If they project wrong, $250k/minute burns. Pragmatism doesn't stop the servers from overheating. There *is* a fact of the matter about the voltage regulators, regardless of their definitions.

  #### 7. Is This Just Grue With Serial Numbers Filed Off?
  **Yes and No.**

  *   **Yes:** It is structurally isomorphic.
      *   *Time* $\rightarrow$ *Space* (Row A / Row B).
      *   *Green/Blue* $\rightarrow$ *Alpha/Beta*.
      *   *Grue* $\rightarrow$ *Compliant-Node*.
      *   *Future Observation* $\rightarrow$ *Counterfactual Location*.
      *   Logically, the underdetermination is identical. The evidence supports both hypotheses equally.

  *   **No (The Philosophical Payoff):** Taking time out of the picture changes the *psychological* availability of the skeptic's escape hatch.
      *   In Goodman's original riddle, students easily dismiss it as "Humean Skepticism about the Future" (i.e., "We can't know the future, duh"). They treat it as a problem of *temporal uncertainty*.
      *   In this spatial case, **the future is not the problem.** The servers in Row A exist *right now*. The voltage is what it is *right now*. The uncertainty is not about *when*, but about *which categorization scheme maps to causal reality*.
      *   **Conclusion:** This demonstrates that the New Riddle is not about induction over *time*; it is about induction over *unobserved domains* generally. It isolates the problem as one of **projectibility of predicates**, not skepticism about the future. If your students can't dismiss this as "we can't know the future," they have to engage with why one predicate is projectible and the other isn't. That is the victory condition for your section.
