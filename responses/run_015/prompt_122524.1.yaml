prompt: |-
  I direct the evaluation unit of a government behavioural insights team. We run roughly twenty field trials a year — changing defaults, the wording and ordering of forms, the salience of information, and the friction attached to a decision — across workplace pension enrolment, organ donor registration, energy tariff switching, attendance at cancer screening, and high cost short term credit. For each trial I must issue a one page welfare finding: a statement, defensible to our board, to the department that commissioned the trial, and if necessary to a parliamentary committee, of whether the people affected were made better off. I have three analysts, around six weeks per trial, and the finding has to be reproducible in the sense that a second analyst working from the same data reaches the same verdict.

  The constraint that makes this hard is a rule our board adopted, which I will call the Choice Rule. It requires that (a) any finding about whether people are better off be grounded in what those people actually chose among the options actually available to them; (b) self reported life satisfaction, happiness, or stated willingness to pay not be used as evidence, though it may be quoted as context; and (c) where the evidence does not settle the matter, the finding say so rather than fill the gap. Clause (b) was adopted because the board distrusted wellbeing questionnaires, not because anyone had worked through what a choice based notion of being better off actually commits us to.

  We have been applying the rule by instinct, and it is producing findings I cannot defend. So I want a procedure my analysts can actually run.

  My own sense of the problem is this. In the revealed preference tradition, utility is not a feeling or a quantity of satisfaction; it is a numbering of the bundles a person picks, and it is pinned down only up to any relabelling that preserves the ordering. Being better off on that view comes to something like: reaching a bundle that was affordable before and was not taken. That licenses a verdict only for a single person, over a stable set of options at unchanged prices, and only in the weak form at least as well off — never as a magnitude, and never as a total across people. Almost none of that survives contact with what we do. Our interventions typically work by changing presentation or effort cost rather than the feasible set; several work by changing what people believe rather than what they want; and every finding we issue is about a population.

  What I want from you is the translation. Give me the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops with no welfare finding possible, and the points at which it hands the question to a named person because it is a question of values rather than of fact — and tell me what the one page finding should say in each of those cases. It has to handle at least the following.

  Defaults and framing, where the feasible set and the money prices are untouched but behaviour shifts substantially: does the procedure require reversal to count as evidence, does sustained non reversal over a follow up period suffice, and does it matter that a default carries an implicit recommendation from the state?

  Friction, where every option remains formally available but one becomes harder to take — a mandatory delay, an extra form, a phone call instead of a click. My analysts are split. Converting hassle into a price equivalent makes the procedure silent about nearly every tool we have; refusing to convert it makes the procedure treat our most effective interventions as though they cost nothing. Tell me which way the procedure should go and what each choice costs us.

  Information and debiasing, where an intervention corrects a mistaken belief about the terms of a product. Post intervention choices are choices; pre intervention ones were made against a budget set the person misdescribed. Say what the procedure does here and why.

  Cycles and time inconsistency, where people enrol and then lapse, or reverse themselves when the same pair of options is presented in a different order. One analyst proposes that we compute an Afriat style number: roughly, how much of each person's budget one would have to discount before their choices could be described as maximising anything at all, with a threshold used as a pass fail gate. Tell me whether that is a good idea, what such a number would actually be measuring, and how I should read it when it comes out at something like 0.9.

  Adaptive and defensive choice, where the choice itself looks like a product of the deprivation — the underserved group that does not complain, the long term user of a harmful product who reports liking it. Clause (b) stops us from asking; it does not tell us whether to read the behaviour as evidence or as a symptom.

  Aggregation, since every finding we issue is about a group that contains both gainers and losers. If the theory's currency is one person's ranking, the procedure has to say what it does at the step from persons to populations, and mark that step as owned by the board rather than by us.

  Then run it on three of our trials. First: a switch from opt in to opt out enrolment in a workplace pension, moving enrolment from 41 to 87 per cent, with twelve months of follow up showing a low and flat opt out rate, and with no data on whether participants offset by cutting other saving or consumption. Second: a rewritten invitation letter that raises cervical screening attendance in a persistently low attendance group from 34 to 39 per cent, with no change in the feasible set, no follow up data, and a live reading on which attendance expresses anxiety rather than preference. Third, the one where I expect to dislike the answer: a mandatory twenty four hour cooling off period on high cost short term credit that reduced borrowing by about a third in the treated group. Our prior is that this is a clear welfare gain, while a strict choice based view looks likely to return either silence or a loss, since the option became harder to take and those who persisted paid in time and hassle. I want to see what the procedure honestly returns, and how that gets written up for a board that wants the opposite conclusion.

  Finally, say plainly what the procedure cannot do. I need to know which parts of the mandate it can never satisfy — interpersonal sums, magnitudes, the intensity of a gain — and whether the deeper question, whether better off should be read as preference satisfaction at all rather than as something thicker, is one the procedure can flag but never settle. Write it so that an analyst with a good undergraduate training in economics or psychology and none in this literature can run it in the time we have, and mark every step where the answer depends on a judgement I have to make rather than one the data make.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Director of an Evaluation Unit in a Government Behavioural Insights Team (BIT).
      *   **Task:** Create a reproducible procedure for analysts to issue one-page "welfare findings" based on field trials (RCTs/quasi-experiments).
      *   **Constraints:**
          *   ~20 trials/year, 6 weeks/trial, 3 analysts.
          *   **The Choice Rule:** (a) Welfare grounded in actual choices among available options; (b) No subjective wellbeing/WTP as *evidence* (only context); (c) Uncertainty must be stated, not filled.
          *   **Current Problem:** Instinctive application is producing indefensible findings.
          *   **Theoretical Tension:** Revealed Preference (RP) theory doesn't fit BIT interventions (defaults, framing, friction, beliefs, populations).
      *   **Specific Issues to Address:**
          *   Defaults/Framing (feasible set unchanged).
          *   Friction (hassle costs vs. price equivalents).
          *   Information/Debiasing (correcting mistaken beliefs).
          *   Cycles/Time Inconsistency (Afriat numbers?).
          *   Adaptive/Defensive Choice (deprivation affecting preference).
          *   Aggregation (individual rankings to population verdicts).
      *   **Test Cases:**
          1.  Pension Opt-out (41% -> 87%, low opt-out).
          2.  Screening Letter (34% -> 39%, anxiety vs. preference).
          3.  Credit Cooling-off (borrowing down 1/3, friction added).
      *   **Output Requirements:**
          *   Step-by-step procedure (questions, sufficient answers, stop points).
          *   Hand-off points (where value judgments by the Board/Director are needed).
          *   Template for the one-page finding.
          *   Limitations of the procedure (what it *cannot* do).
          *   Tone: Practical, rigorous, accessible to analysts with undergrad econ/psych training.

  2.  **Analyze the Theoretical Core (The "Translation"):**

      *   *The Problem:* Standard Revealed Preference (RP) says $A \succ B$ if $A$ is chosen when $B$ is available. BIT interventions often change *how* choices are made (friction, salience) without changing the budget set. Strict RP says if the budget set is the same, welfare shouldn't change unless the choice changes. But if the choice changes due to a nudge, was it a welfare gain?
      *   *The Solution:* We need a "Structural Revealed Preference" approach adapted for behavioral public policy. We must distinguish between *noise/error* and *preference*.
      *   *Key Concept:* **As-If Rationality vs. Mistakes.** If an intervention removes a friction that was preventing a choice consistent with long-term goals (or corrected a belief), welfare likely increased. If an intervention exploits a bias to move behavior against long-term goals, welfare likely decreased.
      *   *The Choice Rule Interpretation:*
          *   (a) Grounded in choice: We look at the *final* choice after the intervention.
          *   (b) No SWB: We can't ask "are you happier?" We must infer from behavior (e.g., did they reverse the decision?).
          *   (c) Uncertainty: If we can't distinguish bias correction from preference manipulation, we say "inconclusive."

  3.  **Develop the Procedure (The "Algorithm"):**

      *   *Step 1: Define the Counterfactual.* What would they have chosen without the intervention? (RCT handles this).
      *   *Step 2: Check Feasibility.* Did the intervention remove an option? (If yes, standard RP applies). If no (nudge), proceed.
      *   *Step 3: Stability/Reversal.* Did people reverse the choice when given the chance? (Active opt-out in pension = stable. Cooling-off = stable).
      *   *Step 4: Belief & Friction Audit.* Was the pre-intervention choice driven by misinformation or excessive friction?
      *   *Step 5: Aggregation.* How to sum gains/losses? (This is the value judgment point).
      *   *Step 6: The Verdict.* Better Off, Worse Off, Inconclusive.

      *Refining the "Friction" dilemma:* Converting hassle to price is hard. Refusing to do it ignores cost. *Solution:* Treat friction as a *screen*. If friction prevents a choice that is maintained when friction is removed elsewhere, it was a barrier. If friction prevents a choice that is reversed later, it was a protection.
      *Refining "Afriat Numbers":* Too complex for 6 weeks/3 analysts. *Solution:* Use "Reversal Rate" as a proxy for consistency.
      *Refining "Aggregation":* This *must* be a Board decision. Analysts provide the distribution of effects; Board decides the weighting (Utilitarian? Prioritarian?).

  4.  **Drafting the Steps (Iterative refinement for clarity):**

      *   *Input:* RCT Data + Process Evaluation.
      *   *Q1: Did the choice set change?* (Yes -> Standard RP. No -> Nudge).
      *   *Q2: Is the new choice stable?* (Look for opt-outs, cancellations, switches).
      *   *Q3: Was the old choice likely a mistake?* (Evidence of confusion, high friction relative to benefit, time inconsistency).
      *   *Q4: Who gained/lost?* (Segment the treatment effect).
      *   *Decision Node:* If Q2 is "Stable" and Q3 is "Likely Mistake," verdict = Better Off. If Q2 is "Unstable," verdict = Inconclusive/Worse.
      *   *Value Judgment:* How to weigh the gainers vs. losers? (Board Directive).

  5.  **Addressing the Specific Test Cases:**

      *   *Pension:* High uptake, low opt-out. Suggests default aligned with latent preference + friction removal. Verdict: Better Off (with caveat on offsetting savings).
      *   *Screening:* Small uptake increase. No follow-up. Anxiety confound. Verdict: Inconclusive (cannot distinguish health gain from anxiety cost without SWB or health outcomes).
      *   *Credit:* Borrowing down. Friction added. *Hard one.* Strict RP says worse off (constraint added). Behavioral view says better off (prevented mistake). *Procedure outcome:* Inconclusive/Mixed. Those who didn't borrow are potentially better off (avoided debt trap), those who wanted to borrow and couldn't are worse off (liquidity constraint). Needs Board weighting on "protection vs. access."

  6.  **Addressing the "One Page Finding" Structure:**

      *   Needs to be standardised.
      *   Sections: Intervention, Observed Choice Shift, Stability Check, Mechanism (Friction/Belief), Aggregation Rule Applied, Verdict.

  7.  **Addressing the Limitations:**

      *   Cannot measure intensity (magnitudes).
      *   Cannot sum utility across people without a social welfare function (Board's job).
      *   Cannot resolve "adaptive preference" (deprivation) without external normative stance.

  8.  **Review against Constraints:**

      *   *Time:* 6 weeks. Procedure must be fast. (Avoid complex econometrics like Afriat).
      *   *Reproducibility:* Clear decision trees.
      *   *Choice Rule:* Adheres strictly to (a), (b), (c).
      *   *Tone:* Professional, directive, acknowledging the political/ethical weight.

  9.  **Final Polish:**

      *   Ensure the distinction between *Analyst Task* (Fact finding) and *Director/Board Task* (Value weighting) is sharp.
      *   Make sure the Credit Cooling-off case doesn't fudge the result. It must show the tension.
      *   Clarify the "Friction" instruction: Treat friction as a tax. If the tax stops a behavior that is later reversed, it was protective. If it stops a behavior that is stable when friction is low, it was welfare-reducing.

      *(Self-Correction during drafting)*: I initially thought about suggesting Afriat numbers. The prompt asks me to evaluate that proposal. I should advise *against* it for this context. It's too data-hungry and abstract for a 6-week policy trial. Use "Reversal Rate" instead.
      *(Self-Correction on Aggregation)*: I need to be explicit that the *Analyst* cannot make the aggregation call. The procedure must pause there and ask for the Board's Social Welfare Function (SWF) or use a default "Pareto" standard (which often leads to "Inconclusive"). I will recommend a "Net Choice" metric but flag it as a value judgment.

  10. **Final Structure:**
      *   Introduction (The Mandate).
      *   The Procedure (The 5-Step Protocol).
      *   The Decision Tree (Visual/Logical flow).
      *   The One-Page Template.
      *   Application to the Three Trials.
      *   Limitations & The "Thicker" Question.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Evaluation Unit Analysts
  **FROM:** Director
  **SUBJECT:** Protocol for Welfare Findings Under the Choice Rule
  **DATE:** October 26, 2023

  ### 1. The Mandate and The Constraint

  You are tasked with determining whether a population is "better off" following a behavioural intervention. You are bound by the **Choice Rule**:
  1.  **Grounding:** Evidence must be actual choices among available options.
  2.  **Exclusion:** Self-reported wellbeing or willingness-to-pay are not evidence of welfare (though they may contextualise).
  3.  **Uncertainty:** If the data does not settle the matter, the finding must state "Inconclusive."

  Standard Revealed Preference theory fails here because our interventions change *how* choices are made (friction, salience, defaults) rather than *what* is available (budget sets). To make this reproducible within six weeks, we will use a **Stabilised Choice Protocol**. This procedure treats a choice as evidence of welfare only if it is *stable* over time and *consistent* with corrected beliefs or reduced friction.

  This document contains:
  1.  The 5-Step Procedure.
  2.  The Decision Tree (Stop/Go points).
  3.  The One-Page Finding Template.
  4.  Application to three live trials.
  5.  Limitations of the Protocol.

  ---

  ### 2. The 5-Step Procedure

  **Analyst Instruction:** Complete these steps in order. If you hit a "STOP" condition, draft the finding as "Inconclusive" and proceed to the Template. If you reach Step 5, you have a provisional verdict subject to Director/Board sign-off on aggregation.

  #### Step 1: The Feasibility Check
  **Question:** Did the intervention remove an option or change a monetary price?
  *   **Yes:** Apply standard Revealed Preference. If Option A was chosen over B when both were available, and later A is removed, welfare is ambiguous without knowing the substitute. If the intervention *added* an option, welfare is weakly improved for those who take it.
  *   **No (Nudge/Default/Friction):** Proceed to Step 2.
  *   **Analyst Note:** Most BIT trials are "No." This step flags where standard economics applies vs. where behavioral inference is needed.

  #### Step 2: The Stability Check (The Reversal Test)
  **Question:** Did participants reverse the intervention-induced choice when given a low-cost opportunity to do so?
  *   **Data Required:** Opt-out rates, cancellation rates, or switching behavior in a follow-up period (minimum 3 months for financial/health decisions).
  *   **Threshold:**
      *   **Low Reversal (<10% of induced choosers):** Treat the new choice as *stable*. Proceed to Step 3.
      *   **High Reversal (>20% of induced choosers):** Treat the new choice as *unstable*. The intervention likely exploited transient bias.
      *   **Verdict:** If High Reversal, STOP. Finding is **Welfare Ambiguous / Likely Negative**.
  *   **Rationale:** Under the Choice Rule, a choice that is immediately undone suggests the initial choice was not a true reflection of ordering.

  #### Step 3: The Mechanism Audit (Friction vs. Belief)
  **Question:** What mechanism drove the shift in Step 2?
  *   **Scenario A (Friction Removal):** Did the intervention reduce effort (e.g., pre-filled forms)?
      *   *Inference:* If the choice is stable (Step 2), the friction was likely a barrier to a preferred outcome.
      *   *Verdict:* Provisional **Welfare Gain**.
  *   **Scenario B (Friction Addition):** Did the intervention add effort (e.g., cooling-off period)?
      *   *Inference:* This restricts choice. It is only a welfare gain if it prevents a *mistake*.
      *   *Test:* Compare the treatment group to a control group on *downstream negative outcomes* (e.g., default rates, arrears, health complications).
      *   *Verdict:* If downstream outcomes improve for the treated group, Provisional **Welfare Gain**. If data is missing, STOP. Finding is **Inconclusive**.
  *   **Scenario C (Framing/Defaults):** Did the intervention change salience or the default option?
      *   *Inference:* Does the default align with the majority's long-term interest (evidenced by active choices in the control group)?
      *   *Verdict:* If active choosers in control mostly pick the default option, Provisional **Welfare Gain**. If active choosers mostly pick the alternative, Provisional **Welfare Loss** (paternalistic mismatch).

  #### Step 4: The Adaptive Preference Check
  **Question:** Is there evidence that the control group's choices were constrained by deprivation or lack of capability rather than preference?
  *   **Data Required:** Qualitative process evaluation, demographic segmentation.
  *   **Instruction:** Look for "silence." If a vulnerable group shows no response to a benefit (e.g., does not claim entitlement), do not code this as "prefer not to claim." Code as **Capability Constraint**.
  *   **Action:** If Capability Constraint is identified, you cannot infer welfare from the control group's inaction. Rely on the Treatment Group's uptake *if* Step 2 (Stability) is passed.
  *   **Note:** This step prevents reading deprivation as preference.

  #### Step 5: Aggregation (The Value Judgment Hand-off)
  **Question:** How do we weigh gainers against losers?
  *   **Fact:** You have identified a subgroup that changed behavior (Gainers) and a subgroup that did not or was restricted (Losers/Unaffected).
  *   **Constraint:** The Choice Rule does not provide a social welfare function. You cannot sum utility.
  *   **Action:** Apply the **Board Aggregation Directive** (see below).
      *   *Default Directive:* **Pareto Weak.** If any subgroup is made strictly worse off (choice restricted without evidence of mistake correction), the finding cannot be "Net Positive."
      *   *Alternative Directive:* **Majority Choice.** If >50% of the population moves to a stable option that was available but unchosen previously, verdict is "Net Positive."
  *   **Requirement:** You must explicitly state which Directive is being used in the One-Page Finding. This is not an analyst decision; it is a policy parameter.

  ---

  ### 3. The One-Page Welfare Finding Template

  **TRIAL ID:** [Name]
  **DATE:** [Date]
  **ANALYST:** [Name]

  **1. The Intervention**
  [Brief description of the nudge, friction, or default change.]

  **2. Observed Choice Shift**
  [Treatment vs. Control uptake %.]

  **3. Stability Evidence (Choice Rule Clause A)**
  [Reversal/Opt-out rates over follow-up period. Pass/Fail against 10% threshold.]

  **4. Mechanism & Belief Audit**
  [Was this friction removal, belief correction, or friction addition? Cite downstream outcome data if available.]

  **5. Aggregation Rule Applied**
  [State: Pareto Weak / Majority Choice / Prioritarian. *This must be pre-approved by the Director.*]

  **6. Welfare Verdict**
  *   **[Better Off / Worse Off / Inconclusive]**
  *   **Defensibility Statement:** "This finding relies on the assumption that [Stable Choice = Preference] and [Aggregation Rule]. It does not account for [Missing Data, e.g., offsetting savings]."

  **7. Uncertainties (Choice Rule Clause C)**
  [List specific data gaps that prevent a stronger verdict.]

  ---

  ### 4. Application to Live Trials

  Here is how the procedure runs on your three specific cases.

  #### Trial 1: Workplace Pension (Opt-in to Opt-out)
  *   **Data:** 41% → 87% enrolment. 12-month follow-up shows low/flat opt-out. No data on offsetting savings.
  *   **Step 1 (Feasibility):** No price change. Default change.
  *   **Step 2 (Stability):** Low opt-out rate. **Pass.** Choice is stable.
  *   **Step 3 (Mechanism):** Default acts as friction removal for enrolment. Control group active choosers (the 41%) chose to enrol. This suggests the default aligns with revealed preference of active choosers.
  *   **Step 4 (Adaptive):** No evidence of deprivation masking preference here.
  *   **Step 5 (Aggregation):** 46% of the population moved to a stable option they previously left unchosen.
  *   **Verdict:** **Better Off.**
  *   **Caveat (Clause C):** "Finding assumes no significant offsetting reduction in other savings or consumption. Without household expenditure data, we cannot rule out liquidity constraints elsewhere."
  *   **Board Note:** This is defensible because the "losers" (those who would have opted out but didn't) are statistically negligible in the follow-up.

  #### Trial 2: Cervical Screening (Letter Rewrite)
  *   **Data:** 34% → 39% attendance. No follow-up. Live reading suggests anxiety.
  *   **Step 1 (Feasibility):** No price change. Framing change.
  *   **Step 2 (Stability):** **Fail.** No follow-up data. We do not know if they attended and then refused treatment, or attended and were distressed.
  *   **Step 3 (Mechanism):** Framing. We do not know if the 5% increase represents corrected belief or induced anxiety.
  *   **Step 4 (Adaptive):** "Live reading" indicates anxiety. Under Clause B, we cannot use this as evidence, but under Step 4, we must flag that attendance may not equal welfare gain if driven by distress.
  *   **Step 5 (Aggregation):** N/A.
  *   **Verdict:** **Inconclusive.**
  *   **Writing the Finding:** "While choice (attendance) increased, the stability of this choice and the mechanism (anxiety vs. information) are unknown. Per Choice Rule Clause C, we cannot infer welfare improvement without evidence that the attendance reflects a stable preference for screening."

  #### Trial 3: High-Cost Credit (Cooling-Off Period)
  *   **Data:** Borrowing reduced by 33%. 24-hour mandatory delay.
  *   **Step 1 (Feasibility):** **Friction Addition.** An option became harder to take.
  *   **Step 2 (Stability):** We do not know if the 33% who didn't borrow later borrowed (reversed) or went without. Assume for this exercise no reversal data exists.
  *   **Step 3 (Mechanism):** Friction Addition. To claim a welfare gain, we must prove this prevented a *mistake*.
      *   *Evidence:* Do we have data on default rates for the treated group vs. control?
      *   *Scenario A (No downstream data):* **STOP.** Verdict: **Inconclusive / Potential Welfare Loss.** Strict Choice Rule says restricting a feasible set is a loss unless error is proven.
      *   *Scenario B (Downstream data shows lower default):* Verdict: **Better Off (for those restricted).**
  *   **The Hard Truth:** Without downstream default data, the procedure *cannot* support your prior that this is a clear gain. A strict choice-based view sees a constraint.
  *   **Writing the Finding:** "The intervention restricted the feasible set by adding time cost. Borrowing fell. Without data on loan repayment performance, we cannot distinguish between 'prevented harmful debt' (Welfare Gain) and 'prevented beneficial liquidity' (Welfare Loss). Per Choice Rule Clause C, the finding is **Inconclusive**."
  *   **Board Hand-off:** To call this a "Gain," the Board must adopt a **Paternalistic Directive**: "We assume high-cost short-term credit is inherently welfare-reducing." This is a value judgment, not a finding of fact. The Analyst must flag this explicitly.

  ---

  ### 5. Specific Guidance on Theoretical Frictions

  **On Friction (Hassle Costs):**
  Do not convert hassle to price equivalents. It is too speculative for a 6-week turnaround.
  *   **Procedure:** Treat friction as a **Screen**.
  *   **Rule:** If friction removes a choice that is *not* taken when friction is low (elsewhere/in control), it is a **Barrier** (Welfare Loss if imposed, Gain if removed).
  *   **Rule:** If friction removes a choice that is *reversed* later (e.g., cooling off), it is a **Protection** (Welfare Gain).
  *   **Cost:** This requires downstream data. If you lack downstream data, you must default to "Constraint = Loss" unless the Board directs otherwise.

  **On Afriat Numbers (Cycles/Consistency):**
  **Do not use them.**
  *   **Reason:** An Afriat number (e.g., 0.9) measures how close choices are to *any* utility function, not a *good* one. A consistent smoker scores 1.0. A confused saver scores 0.9. It measures consistency, not welfare.
  *   **Alternative:** Use the **Reversal Rate** (Step 2). It is a direct behavioral measure of regret/inconsistency over time, which is more defensible to a Parliamentary Committee than a goodness-of-fit statistic.

  **On Aggregation (Persons to Populations):**
  This is the most critical hand-off.
  *   **Analyst Role:** Report the distribution. "X% gained stable option, Y% lost option."
  *   **Director/Board Role:** Select the Social Welfare Function.
  *   **Template Instruction:** The One-Page Finding must cite the **Aggregation Directive**.
      *   *Example:* "Verdict relies on Board Directive 2021-04: Interventions that reduce high-cost credit access are presumed welfare-improving absent evidence of liquidity crisis."
      *   *Why:* This protects you. You are reporting the math; they are owning the morality.

  **On Adaptive/Defensive Choice:**
  *   **Rule:** If a group is underserved (low uptake of benefits), code their inaction as **Missing Data**, not **Preference**.
  *   **Finding Language:** "We cannot infer welfare from the control group's non-claim rate due to evidence of capability constraints (Step 4)."

  ---

  ### 6. What This Procedure Cannot Do

  You must include this section in your internal guidance to manage expectations.

  1.  **No Interpersonal Sums:** The procedure cannot tell you if the gain to the many outweighs the loss to the few. It can only report the counts. The "Net" verdict requires a Board-approved weighting scheme.
  2.  **No Intensity:** It cannot measure *how much* better off. A pension enrollee is not "more" better off than a screening attendee. The currency is binary (Stable Choice vs. Unstable).
  3.  **No "Thick" Welfare:** It cannot distinguish between a "good" preference and a "bad" one (e.g., donating to a harmful cause) unless the Board defines "harm" externally. It measures **Preference Satisfaction**, not **Wellbeing**.
  4.  **The Deeper Question:** Whether "better off" *should* be preference satisfaction is a philosophical question. This procedure flags it but cannot settle it.
      *   **Flagging Mechanism:** In the "Uncertainties" section of the Finding, you must write: "This finding equates stable choice with welfare. It does not account for [adaptive preferences / externalities / moral hazard]."

  ### 7. Implementation Plan

  1.  **Immediate:** Adopt the **Board Aggregation Directive**. I will draft three options (Pareto, Majority, Paternalistic) for the Board to select. You cannot run Step 5 without this.
  2.  **Training:** Run a workshop with the three analysts on the "Stability Check." Ensure they know how to code opt-outs vs. lapses.
  3.  **Pilot:** Re-run the Credit Cooling-off trial finding using this protocol. It will likely shift from "Clear Gain" to "Inconclusive." Prepare the Board for this correction. It is better to be defensibly inconclusive than confidently wrong.

  **Signed,**
  **Director**
