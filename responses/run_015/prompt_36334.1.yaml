  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON DEMOCRATIC CHANGE**

  **Signatories:** Dr [Comparativist Name] and Dr [Sceptic Name]
  **Date:** 24 May 2024
  **Subject:** Framework for the Analysis of Democratic Institutional Change (2010–2024)

  ### 1. Points of Agreement

  Notwithstanding our theoretical divergences, we affirm the following empirical and methodological claims as the baseline for our collaboration:

  1.  **Empirical Events (2010–2024):** In Hungary (post-2010), Poland (2015–2023), Turkey (post-2013), and the United States (post-2016), elected incumbents have utilised formal legal mechanisms to alter the operational environment of political competition. We agree that these actions include: the restructuring of constitutional courts; the revision of electoral laws to favour incumbents; the consolidation of state influence over public media; and the introduction of regulatory burdens on civil society organisations. We disagree on the *label* for this cluster of events, but agree on the *occurrence* of the events themselves.
  2.  **Democracy Indexes:** We acknowledge that major democracy indexes (e.g., V-Dem, Freedom House, EIU) primarily measure codified rights and expert perceptions of institutional integrity. We agree that these indexes are effective at tracking changes in legal frameworks and elite behaviour but are less capable of measuring the lived experience of citizenship, historical cycles of exclusion, or the resilience of informal norms. A decline in an index score indicates a change in coding criteria or expert assessment, not necessarily an immediate cessation of democratic function.
  3.  **The Liberal/Democratic Distinction:** We accept that 'democracy' (defined by competitive elections and suffrage) and 'liberalism' (defined by constraints on executive power and minority rights) are analytically distinct. A state may remain electoral while becoming less liberal. We further agree that there is no bright line where a democracy instantly ceases to be a democracy; rather, there is a grey zone where institutions retain the form of democracy but lose their substantive capacity to ensure alternation of power.
  4.  **Historical Context:** We acknowledge that the 'liberal-democratic baseline' used to measure backsliding is historically contingent. We agree that the United States in the 1950s, while often coded as a consolidated democracy, maintained significant disenfranchisement and illiberal practices. Consequently, current metrics of democratic health must be understood as relative to contemporary norms, not as absolute historical constants.

  ### 2. Statement of Disagreements

  The following table outlines our residual theoretical positions. Each statement has been drafted to ensure the respective signatory accepts the wording as an accurate representation of their view.

  | Crux | The Comparativist's Position | The Sceptic's Position |
  | :--- | :--- | :--- |
  | **1. Mechanism vs. Direction** | 'Democratic backsliding' names a specific **mechanism**: a distinctive mode of regime change characterised by incremental, legalistic erosion by insiders. It is analytically distinct from policy failure, corruption, or historical cycles of exclusion, because it targets the *rules of the game* to prevent future alternation of power. | 'Democratic backsliding' names a **direction of travel**: a retrospective narrative applied to negative changes in governance. It is not a distinctive mechanism but a categorisation of outcome, indistinguishable in kind from previous eras of democratic instability, and risks conflating normal political contestation over institutions with systemic decay. |
  | **2. Concept vs. Uptake** | The concept is analytically sound regardless of its political usage. That political actors or Western capitals may instrumentalise the term for geopolitical ends is a defect of **users**, not the **concept**. Scholarly rigour can isolate the phenomenon from the noise of partisan alarmism. | The concept is inherently laden because it presupposes a teleological view of history (that democracies ought to progress). Its partisan uptake by Western NGOs and governments to censure non-aligned states is a defect of the **concept itself**, as it embeds a specific geopolitical worldview into what purports to be a neutral analytic category. |

  ### 3. Falsifiable Scenarios and Predictions

  For each crux above, we identify a concrete observable scenario. We record our divergent predictions in advance to determine which theoretical framework offers greater explanatory power.

  #### Crux 1: Mechanism vs. Direction
  **Scenario:** **Poland's Judicial and Media Reforms (2024–2027)**
  Following the 2023 election, the new coalition government attempts to reverse the changes made to the Constitutional Tribunal and public media broadcasters between 2015 and 2023.

  *   **Observable:** The speed and legal success with which the new government restores the pre-2015 status quo of the Constitutional Tribunal and depoliticises public media management.
  *   **Comparativist Prediction:** If 'backsliding' is a distinctive mechanism of institutional capture, reversal will be **conspicuously difficult or incomplete**. We expect the incumbent party (PiS) to utilise the very institutions they captured (e.g. the Tribunal) to block reforms, proving that the changes were designed to 'lock in' advantages beyond a single term. Successful reversal would require extraordinary measures that strain the rule of law.
  *   **Sceptic Prediction:** If 'backsliding' is merely normal political contestation, reversal will be **procedurally routine**. We expect the new majority to utilise standard legislative and appointment powers to restore their preferred governance model. If reversal succeeds smoothly, it proves the institutions were not fundamentally 'broken' but were simply sites of political conflict. If it fails, it suggests standard checks and balances are working as intended to slow radical change, not that 'backsliding' occurred previously.

  #### Crux 2: Concept vs. Uptake (Partisan Bias)
  **Scenario:** **United States Democratic Index Ratings (2025–2029)**
  Following the 2024 US election, regardless of the winner, significant changes are made to federal election administration and the Department of Justice's independence.

  *   **Observable:** The variance in democracy index scores and qualitative reports issued by major Western monitoring bodies (e.g., V-Dem, Freedom House) regarding the US, compared to similar institutional changes in allied versus non-aligned states.
  *   **Comparativist Prediction:** Indexes will remain **consistent and principle-based**. If the US undergoes similar institutional changes to Hungary (e.g., centralisation of election oversight), US scores will decline commensurately. The concept holds because the measurement criteria are applied universally, irrespective of the country's geopolitical alignment.
  *   **Sceptic Prediction:** Indexes will display **asymmetric tolerance**. If the US undergoes similar changes to Hungary or Turkey, the decline in scores will be slower, or the qualitative language will be more forgiving (e.g., framing it as 'federalism' rather than 'centralisation'). This will demonstrate that the concept of 'backsliding' is applied more rigorously to geopolitical rivals or outliers than to core Western powers, validating the claim that the concept is structurally biased.

  ***

  **Signed:**

  _________________________
  (Dr [Comparativist Name])

  _________________________
  (Dr [Sceptic Name])
