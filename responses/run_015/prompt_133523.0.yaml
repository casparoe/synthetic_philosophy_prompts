answer: |-
  **Section 1: "The baseline semantics"**

  Standard semantics distinguishes conditionals by how they select possible worlds. Indicative conditionals operate within an epistemic modal base, restricting evaluation to worlds compatible with the speaker's current knowledge. Following Stalnaker and Adams, these conditionals presuppose the antecedent is epistemically possible; they project forward from the actual state of information without revising established facts. Conversely, counterfactual conditionals employ a causal-historical similarity ordering, typically associated with Lewis and Stalnaker. Here, evaluation requires holding the actual world's past fixed up to the antecedent time, introducing a minimal divergence to make the antecedent true, then projecting forward via laws of nature. The indicative respects current evidence as rigid; the counterfactual treats the actual past as mutable to accommodate a false antecedent. This creates a sharp divide: indicatives track what follows from what we know, while counterfactuals track what would have followed had things been different. The tension arises when evidence shifts, blurring the line between what is known and what is historically fixed.

  **Section 2: "The boundary case and dual-base conditioning"**

  "Dual-base conditioning" posits that a single conditional sentence carries both an epistemic accessibility relation, R_E, governing open possibilities for the speaker, and a causal-historical similarity relation, R_C, governing counterfactual proximity. Consider a climate negotiator in 2028 asserting, "If the 2030 carbon cap is binding, coastal defenses will be funded by 2035." At utterance, the cap's adoption is epistemically open, so R_E includes worlds where it passes. By 2033, she learns the cap was rejected. Standard semantics offers conflicting guidance on assessing her original claim. The indicative machinery relies on R_E; since the antecedent is now known false, the set of epistemically accessible worlds where the cap is binding is empty. The conditional collapses, rendering the original assertion either void or vacuously true, failing to capture her sustained predictive commitment regarding the policy's efficacy. Alternatively, shifting to counterfactual machinery invokes R_C. To evaluate "If the cap had been binding...", she must hold the actual history fixed up to 2030. However, she knows the actual political history precluded the cap. Evaluating the counterfactual requires imagining a divergent political past she now knows did not occur. Thus, the indicative view deletes the scenario entirely via epistemic elimination, while the counterfactual view demands reconstructing a history she knows is false via similarity ordering. This leaves no stable ground for evaluating the original conditional's truth across the information update, creating a gap where the speaker's intent survives but semantic tools fracture.

  **Section 3: "The update asymmetry"**

  The core tension lies in update asymmetry. When the negotiator learns the cap failed, the indicative conditional suffers epistemic elimination. Because R_E restricts evaluation to known possibilities, learning the antecedent is false removes all relevant worlds. The conditional becomes moot; it cannot be falsified, but neither does it sustain her original predictive force. Her commitment that "cap implies funding" seems to persist, yet the semantic vehicle evaporates. Conversely, the counterfactual evaluation permits backtracking but at the cost of historical fidelity. To assess the causal link, she must entertain worlds where prior political conditions differed enough to allow the cap. This treats the actual past as malleable, conflicting with her new knowledge that the past is fixed. This divergence suggests the issue is not merely semantic truth conditions but pragmatic speech acts. The indicative functioned as a forward-looking prediction dependent on uncertainty, while the counterfactual serves as a retrospective causal analysis dependent on hypothetical variation. An agent can coherently hold both evaluations only by compartmentalizing them: accepting that the prediction was never tested (indicative) while simultaneously analyzing the untested causal mechanism (counterfactual). However, maintaining both simultaneously creates cognitive dissonance regarding the status of the past. If the past is fixed for knowledge, backtracking is impossible; if the past is mutable for counterfactuals, knowledge is unstable. The asymmetry reveals that conditionals are not static propositions but dynamic tools sensitive to the direction of information flow. Ultimately, the conflict arises because the speaker's epistemic state updated while the world's history did not, forcing a choice between respecting current knowledge or respecting causal structure.

  **Section 4: "Diagnosis of dual-base conditioning"**

  Allowing both R_E and R_C in a single evaluation framework does not resolve the tension; it generates a paradox of contradictory verdicts. In the negotiator's case, R_E declares the conditional undefined due to empty domain, while R_C yields a truth value based on divergent history. If both relations apply to the same sentence simultaneously, the sentence is both moot and truth-apt, which is incoherent. This suggests the indicative-counterfactual divide is best explained by a difference in speech-act force and direction of evaluation rather than solely modal base. Indicatives are forward-looking assertions constrained by current evidence; counterfactuals are backward-looking analyses constrained by causal laws. The distinction collapses if we remove the feature of epistemic uncertainty at the time of utterance. If the negotiator knew the cap's status in 2028, the indicative would be inappropriate, and only the counterfactual (or factual) form would remain. Thus, the boundary is not just about world selection but about the speaker's relationship to the timeline: whether they are navigating open futures or reconstructing closed pasts. The dual-base model fails because it treats these distinct temporal orientations as compatible layers rather than mutually exclusive contexts.
