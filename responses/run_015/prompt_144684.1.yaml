answer: |-
  ### Brainstorming Candidates

  *   **Retrospective Clustering:** You can't use the criterion in real-time; you need a "provisional" cluster based on signatures and a "confirmed" cluster based on tech logs weeks later.
  *   **Toolkit Ontology:** A mechanism isn't a thing in the fridge; it's a relationship between the fridge state and our available tools. If we don't have the tool, the mechanism doesn't exist for us.
  *   **Contextual Identity:** Same fault + different store climate = different intervention = different mechanism. This explodes the taxonomy unless we parameterize context.
  *   **Failed Intervention Data:** To know the *set* of interventions, techs must log what *didn't* work, not just what did. Current logs probably only capture success.
  *   **Information Gain Dispatch:** Prioritize sending techs to cases that discriminate between profiles, not just the ones closest to spoilage.
  *   **Metric Baseline Reset:** You cannot compare "failure modes" year-over-year. You are counting "intervention classes" now, not "broken parts."
  *   **The "Hack" Problem:** If duct tape and a new gasket both stop the leak, the criterion says same mechanism. Ops says one is debt, one is repair.
  *   **Prevention/Mitigation Blur:** Software tweak (prevention) vs. Part swap (mitigation). If both work, they are the same mechanism. This confuses engineering vs. maintenance budgets.

  ---

  ### Implications of the Intervention-Profile Criterion

  Adopting the intervention-profile criterion shifts your ontology from *what is broken* to *what works to fix it*. This is pragmatically powerful but operationally disorienting. Here are the four most critical implications for your workflow, developed with the constraints you mentioned in mind.

  #### 1. The Two-Stage Clustering Workflow (Addressing Timing)
  **The Implication:** You cannot merge cases in real-time. You must decouple "Triage Grouping" from "Mechanism Identity."
  **The Workflow Change:**
  Currently, your system merges cases when signatures look similar. Under the intervention criterion, this is epistemically invalid because signature similarity does not guarantee intervention equivalence. However, you cannot wait for the intervention to decide whether to dispatch (the Timing problem).
  You need to implement a **Two-Stage Taxonomy**:
  *   **Stage 1 (Provisional):** Continue using signature similarity (autoencoder error profiles) for *immediate* triage and dispatch. Label these "Symptom Clusters."
  *   **Stage 2 (Confirmed):** Once tech logs are returned (weeks later), re-cluster the "Symptom Clusters" based on the intervention data. Only these confirmed clusters count as "Mechanisms" for your quarterly taxonomy.
  **Concrete Action:** Your database needs a `mechanism_id` field that is initially `null` or `provisional` and only becomes `confirmed` after postmortem. Do not allow leadership to query "Distinct Failure Modes" on live data; only query on closed tickets older than 30 days.
  **Where it breaks:** If a symptom cluster contains two distinct mechanisms that require different urgency levels (e.g., one fix is a software reset, the other is a compressor swap), the provisional grouping will misprioritize dispatch. You must keep severity ratings attached to the *Symptom Cluster*, not just the final Mechanism.

  #### 2. Mechanism Identity is Toolkit-Relative (Addressing Granularity & Context)
  **The Implication:** A mechanism is not an intrinsic property of the refrigeration unit; it is a relation between the unit's fault and your available intervention catalog.
  **The Workflow Change:**
  This directly addresses your Granularity and Context worries. Under this criterion, a corroded relay in a humid store (fix: replace relay + install dehumidifier) and a solder-failure relay in a dry store (fix: replace relay) are **different mechanisms** because the intervention sets differ.
  *   **Taxonomy Structure:** Your postmortem taxonomy cannot just list parts (e.g., "Defrost Relay"). It must list *Action Packages* (e.g., "Defrost Relay + Environmental Control").
  *   **Store-Relative IDs:** You may need to tag mechanism IDs with context parameters (e.g., `MECH_04_HUMID` vs `MECH_04_DRY`). This feels like bloat, but it is honest under the criterion. It prevents you from sending a "replace relay" tech to a humid store where he'll just return in a month because the root environmental cause wasn't addressed.
  **Concrete Action:** Update the tech mobile app. When closing a ticket, they shouldn't just select a part code. They must select a "Resolution Protocol." If two techs resolve the same symptom with different protocols, the system flags them as distinct mechanisms for review.
  **Where it breaks:** This can lead to **taxonomy explosion**. If every store requires a slightly different intervention due to unique context, you lose the ability to generalize. You must enforce a "Standard Intervention Catalog." If a tech uses an intervention not on the list, it triggers an engineering review, not a new mechanism ID. This constrains the criterion to keep ops viable.

  #### 3. Dispatch for Information Gain (Addressing Partial Profiles)
  **The Implication:** Prioritization shifts from "most severe anomaly" to "highest value for profile resolution."
  **The Workflow Change:**
  You noted the Partial Profiles problem: we often only know one intervention worked, not the full set of what *would* work. If you have 50 cases with identical signatures but no interventions yet, sending a tech to all 50 is wasteful. Sending a tech to *one* defines the profile for the rest.
  *   **Active Learning Dispatch:** Your dispatch algorithm should prioritize cases that reduce uncertainty about the intervention profile. If Case A and Case B look similar but have no intervention history, dispatch to Case A (closest tech). If the fix works, apply that intervention profile to Case B remotely (e.g., software reset) before dispatching.
  *   **Failed Intervention Logging:** To know the *set* of interventions, you must know what fails. Techs must log "Attempted X, Failed." Currently, they likely only log "Did X, Worked." Without negative data, you cannot define the boundaries of the intervention set.
  **Concrete Action:** Change the KPI for technicians. Reward "Diagnostic Completeness" (logging failed attempts) not just "First Time Fix Rate." If a tech tries three things and the third works, that's more valuable data than guessing the right part first, because it defines the intervention profile boundaries.
  **Where it breaks:** This conflicts with spoilage risk. You cannot treat a case full of ice cream as a data point for "information gain" if the compressor is about to seize. Severity must override information gain. Use this strategy only for non-critical anomalies (e.g., efficiency drifts vs. temperature excursions).

  #### 4. Taxonomy of Actions, Not Parts (Addressing Metric Drift)
  **The Implication:** "Improvement" no longer means "fewer broken parts"; it means "fewer unique intervention sets" or "cheaper intervention sets."
  **The Workflow Change:**
  When leadership asks why the number of failure modes jumped, the honest answer is: "We stopped counting broken things and started counting required actions."
  *   **Metric Shift:** Track the **Cost-Weighted Intervention Count**. If you merge two old "failure modes" (e.g., 'Fan Motor Fail' and 'Fan Bracket Fail') because both are now resolved by a single "Replace Fan Assembly" protocol, that is an improvement, even if the physical failure rate is unchanged.
  *   **Historical Baseline:** You cannot compare this quarter's mechanism count to last quarter's. You must establish a new baseline. Explain that historical data is now "Legacy Part Counts" and new data is "Actionable Mechanism Classes."
  **Concrete Action:** Create a "Mechanism Stability" metric. If a specific intervention profile keeps splitting into sub-profiles (e.g., "Replace Board" works 60% of the time, "Reseal Connector" works 40% of the time for the same signature), your taxonomy is unstable. Improvement is driving that toward 100% certainty on one intervention.
  **Where it breaks:** **The "Hack" Risk.** This is the most dangerous implication. If a tech tapes over a sensor to stop the alarm, and the alarm stops, the intervention profile matches a "Sensor Replacement" (anomaly cleared). The criterion says this is the *same mechanism*. Ops knows this is technical debt. You must hard-code a "Valid Intervention List." If an intervention isn't on the approved list, it cannot define a mechanism, regardless of success. Otherwise, you will optimize for temporary silencing rather than reliability.

  ### Summary Warning
  The intervention-profile criterion is superior for **resource allocation** (knowing what to send) but inferior for **root cause elimination** (knowing why it broke). If you adopt this strictly, you risk optimizing your supply chain for fixes while ignoring manufacturing defects. For example, if a batch of compressors has a defect, but the fix is always "swap compressor," your taxonomy shows a stable mechanism ("Requires Swap"), hiding the quality spike. You must retain a parallel "Physical Component" track for supplier quality management, even if it's decoupled from your operational mechanism taxonomy.
