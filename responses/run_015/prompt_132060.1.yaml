answer: |-
  **Planning Phase**
  The crux of this exam question is to shift the student's focus from the *difficulty* of induction (underdetermination) to the *structure* of the hypothesis space and the *pragmatics* of the testing situation. Standard answers focus on how hard it is to find the rule; this question demands they explain why certain valid rules are excluded and what the task implies about the nature of concepts themselves. The planning involves ensuring the stem defines the variants clearly enough that no outside knowledge is needed, while leaving enough ambiguity that philosophical work is required to resolve them. The model answer must be tight to fit five distinct philosophical moves into 900 words without becoming a list.

  **Rationale**
  The crux of this question is to force candidates beyond the standard observation that Bongard problems illustrate underdetermination, requiring them instead to analyze how the vocabulary for solutions is constructed rather than given, and how tacit pragmatic assumptions constrain valid hypotheses. By introducing the "Mate" and "Degenerate" variants, the question destabilizes the assumption that concept learning is merely binary classification of individuals based on intrinsic properties, pushing students to articulate whether concepts are relational structures, whether projectibility depends on fairness rather than simplicity, and whether success in these tasks reflects cognitive architecture or shared cultural games.

  ***

  **Exam Question**

  **Question 1 (25 marks)**
  **Time Allowed: 45 minutes**
  **Target Length: Approximately 900 words**

  A standard Bongard problem presents twelve boxes containing geometric figures: six on the left and six on the right. The solver must identify a rule that all left-hand figures obey and all right-hand figures violate. Consider two variants on this task:

  1.  **Mate Problems:** The twelve figures fall into six congruent pairs (matching under rotation and scaling), with exactly one member of each pair on the left and one on the right. No intrinsic property distingu the left set from the right set; the distinction lies entirely in the one-to-one correspondence between them.
  2.  **The Degenerate Rule:** In any standard problem, the rule "is located in the left-hand column" fits the data perfectly and is maximally simple, yet it is universally rejected as a solution.

  Write an essay analyzing what these variants reveal about concept learning. Your answer must address the following: why fixed hypothesis spaces fail to describe this task; the role of tacit assumptions about the constructor's fairness; what the Mate variant implies about whether concepts classify individuals or structures; why the Degenerate Rule is rejected despite its simplicity; and whether success on these puzzles evidences general cognitive architecture or merely shared cultural conventions.

  ***

  **Model Answer**

  Bongard problems are often cited as illustrations of underdetermination, but the Mate and Degenerate variants show that the deeper issue is the construction of the vocabulary in which solutions are stated. Standard models of concept learning assume a fixed hypothesis space where the learner selects the best rule from a pre-existing list. However, solving these puzzles requires inventing new descriptors—such as "concavity" or "containment"—that were not explicitly given in the stimulus. Because the relevant vocabulary is constructed during the solution rather than selected from a static menu, any account that measures simplicity or probability within a fixed language fails to describe the task. The learner is not just weighing hypotheses; they are expanding the language in which hypotheses can be expressed.

  This expansion is constrained not by data fit, but by tacit pragmatic assumptions. The Degenerate Rule demonstrates that fit and simplicity are insufficient criteria for validity. The rule "is on the left" fits perfectly and is syntactically simple, yet it is rejected. This exclusion relies on a Gricean assumption of fairness: the solver assumes the constructor intends a rule that is generalizable beyond the specific page layout. The task is not merely to describe the data but to infer the constructor's intent. If this cooperative assumption fails—for instance, in an adversarial context where the constructor aims to trick the solver—the task becomes unsolvable not because of noise, but because the criteria for a "good" rule vanish. Thus, solvability depends on a shared social contract, not just logical inference.

  The Mate variant further challenges the view that concepts are devices for sorting particulars. In standard classification, a concept applies to an individual based on its intrinsic properties. In Mate problems, no intrinsic property separates the left figures from the right. The "concept" here is a relational structure—a mapping between sets—rather than a predicate true of individuals. This suggests that at least some forms of concept learning involve recognizing structural correspondences rather than categorizing isolated objects. If concepts are merely classifiers, Mate problems should be impossible; their solvability implies that cognitive representations can encode relations between items as primary objects of knowledge, not just properties of items.

  The rejection of the Degenerate Rule also forces a position on projectibility. A rule is projectible if it supports counterfactuals and future predictions. "Is on the left" fails this test because moving the box changes the truth value without changing the figure. However, this failure is not inherent to the predicate itself but to its dependency on the experimental frame. This implies that possessing a concept involves more than the capacity to classify presented figures; it requires the capacity to classify novel figures in new contexts. If a rule cannot travel beyond the immediate stimulus arrangement, it does not function as a concept. Therefore, projectibility is not just about logical form but about independence from the specific context of discovery.

  Finally, we must ask whether success on these puzzles evidences general cognitive architecture or cultural artifacts. One might argue that solving them reveals an innate bias toward figural properties or compositionality. However, the reliance on fairness and shared visual conventions suggests an alternative: success may reflect enculturation into a specific game of inference. Participants know what counts as a "interesting" rule because they share a visual culture with the constructor. A non-artifactual test would need to remove this shared context, perhaps by using stimuli devoid of cultural geometric conventions or by removing the assumption of cooperation. Until then, success may indicate proficiency in a specific social practice rather than universal structures of mind.

  In sum, these variants show that concept learning is not merely induction over fixed features. It involves vocabulary construction, pragmatic inference about intent, relational structuring, and context-independent projectibility. Whether this reflects deep cognitive architecture or learned conversational norms remains an open methodological question, but the puzzles certainly prove that data fit alone never determines the rule.

  **Examiner's Caveat:**
  This answer should make a marker confident that the candidate understands the structural pragmatics of the task, particularly regarding hypothesis spaces and fairness. However, a specialist might reject the claim that Mate problems prove concepts are relational structures rather than classifiers, arguing that the "relation" itself could be treated as a higher-order property of the individual box (e.g., "being the left-member-of-a-pair"). This objection is technically possible but misses the spirit of the variant.

  ***

  **Marking Scheme**

  **1. Vocabulary Construction vs. Fixed Space (5 marks)**
  *   **Must-Hit:** Candidate argues that the hypothesis space is not fixed; solvers must construct new descriptors/vocabulary during the task, rendering standard simplicity measures inadequate.
  *   **Common Error:** Merely stating that the problem is "hard" or "underdetermined" without addressing the construction of the vocabulary itself. (Max 2 marks)

  **2. Tacit Assumptions of Fairness (5 marks)**
  *   **Must-Hit:** Candidate identifies that solvability relies on a cooperative assumption (constructor intent) and notes that without this (adversarial context), the task fails despite data fit.
  *   **Common Error:** Discussing "bias" generally without linking it to the specific social contract between constructor and solver. (Max 3 marks)

  **3. Mate Problems and Relational Concepts (5 marks)**
  *   **Must-Hit:** Candidate explains that Mate problems show concepts can be correspondences/structures between sets, not just predicates of individuals.
  *   **Common Error:** Treating Mate problems as just "harder" classification tasks rather than a structural challenge to the definition of a concept. (Max 2 marks)

  **4. Degenerate Rule and Projectibility (5 marks)**
  *   **Must-Hit:** Candidate argues that the Degenerate Rule fails because it lacks projectibility/context-independence, not because it is complex or fits poorly.
  *   **Common Error:** Claiming the rule is rejected because it is "trivial" or "not visual" without addressing the philosophical condition of projectibility. (Max 3 marks)

  **5. Methodological Status (Architecture vs. Culture) (5 marks)**
  *   **Must-Hit:** Candidate questions whether success indicates innate architecture or shared cultural conventions and suggests what a non-artifactual test would require.
  *   **Common Error:** Asserting definitively that it proves innate structure without acknowledging the cultural/confounding variable. (Max 3 marks)

  **Boundary between A and B:**
  An **A** script must explicitly connect the **Mate variant** to the definition of a concept (Point 3), arguing that it challenges the view of concepts as classifiers of particulars. A **B** script may correctly identify that Mate problems are relational but fail to articulate the consequence for theories of concepts, treating it instead as just another type of rule.

  **Marker Disagreement:**
  Markers are most likely to disagree on **Point 5 (Methodological Status)**. Some may view the cultural argument as speculative and reward a strong defense of cognitive architecture, while others may view the cultural critique as the more sophisticated philosophical move. Consistency will require emphasizing that the *questioning* of the evidence is the key requirement, not the specific stance taken.

  **B-Grade Check:**
  A competent candidate who has done the reading but is unfamiliar with the variants can reach a solid B by correctly applying standard concepts of underdetermination and simplicity to the provided definitions. They need not solve the philosophical novelty of the Mate problem perfectly but must recognize that the Degenerate Rule challenges simple accounts of projectibility. The question is self-contained enough that the definitions provided allow a student to reason through the implications without prior exposure to these specific variants.
