answer: |-
  Your hypothesis is exceptionally sharp. You have correctly identified that the stalemate isn't a failure of your group to grasp the theories, but a reflection of the fact that **Parfit's Hitchhiker is a boundary case where the definitions of the terms of art (act, agent, rationality) fracture.**

  You asked if there is a substantive disagreement buried under the meta-disagreement, or if it's purely verbal/conceptual. The answer is: **The meta-disagreement *is* the substantive disagreement.** In decision theory, choosing the *object of evaluation* (act vs. procedure vs. disposition) is not a preliminary step; it is the primary theoretical commitment that determines the output.

  However, there is a specific formal fault line underlying your points (i) and (iii), and your variant actually illuminates it rather than dissolving it. Here is the diagnosis of why you are stuck, where the substantive clash lies, and what would actually count as progress.

  ### 1. The Substantive Core: Counterfactual Dependence and Control
  You identified the disagreement as being about "what rational assessment applies to." The substantive engine driving that disagreement is **what counterfactuals are true.**

  *   **Maya (CDT/Resolute):** Asserts that the *causal* counterfactuals are the only ones that matter for rational choice. In town, the statement "If I were to pay, the driver would have predicted I would pay" is false (or irrelevant). The prediction is already fixed. Therefore, the act of paying has no causal leverage. Her move to "Resolute Choice" is an admission that standard agency cannot solve this; she requires a *diachronic* mechanism (binding) that effectively removes the future self's agency.
  *   **Dev (FDT/EDT):** Asserts that *logical* or *functional* counterfactuals matter. The statement "If my decision procedure were to output 'Pay', the driver would have predicted 'Pay'" is true. Dev treats the agent not as a momentary locus of will, but as an instance of a function. The substantive claim here is that you *can* control the past prediction by controlling the logical output of your algorithm in the present.
  *   **Sam (Skeptic):** Asserts that the counterfactual structure implied by the case is physically impossible. If the prediction is physical, it is fallible. If it is infallible, the agent is not a separate causal locus.

  **Why your variant didn't break the tie:**
  In your variant, the driver reads your *self-prediction* (credence).
  *   **Dev's objection** ("changed the subject") is substantive: Dev's theory relies on the idea that you control your *actions* as outputs of a function. He likely does not grant that you have direct voluntary control over your *credences* in the same way. If you know you are a non-payer, your credence that you will pay *ought* to be 0 (epistemic rationality). To set it to 1 to get the ride is to violate epistemic norms. Dev's theory usually tries to align pragmatic and epistemic rationality; your variant forces them apart.
  *   **Maya's objection** ("smoke") is also substantive: She sees this as proving that the only way to win is to manipulate the *input* to the prediction (your belief), which confirms her view that the *act* itself is inert.

  The variant shifts the "magic" from the Predictor's omniscience to the Agent's **Doxastic Voluntarism**. It doesn't solve the control problem; it just moves it from "Can you choose your action against your interest?" to "Can you choose your belief against your evidence?"

  ### 2. The Telos: Rationality as Sanction vs. Rationality as Success
  You asked about point (iii): what rationality is *for*. This is where the formal disagreement hides.

  *   **Dev (Rationality as Winning):** For Dev, a decision theory is a tool for securing good outcomes. If a theory tells you to do something that results in you dying in the desert while a different theory tells you to do something that results in you living, the first theory is self-defeating and therefore wrong. This is an **externalist** criterion of success.
  *   **Maya (Rationality as Coherence):** For Maya, rationality is about the internal coherence of the deliberative process at the time of action. It is **internalist**. If, in town, paying costs you utility and gains you nothing, paying is incoherent *at that time*, regardless of the *ex ante* benefits of being the kind of person who pays.
  *   **Sam (Rationality as Description):** Sam views decision theory as a descriptive model of physical agents. If the model requires impossible physics, the model is broken.

  **The Substantive Clash:** There is no theorem that can settle this because it is a clash of **normative intuitions**. Is "rational" a praise-word for "successful" (Dev) or a technical term for "causally maximizing given current information" (Maya)? Parfit himself leaned toward Dev (calling CDT "self-defeating"), but many philosophers side with Maya (arguing that rationality cannot require you to ignore dominance).

  ### 3. What Would Count as Progress?
  You asked for an honest answer about what would move the needle. A theorem won't do it, because the axioms differ. A distinction won't do it, because you've already distinguished the views. Here is what actual progress looks like in this specific deadlock:

  **A. Formalizing the "Procedure" (For Dev)**
  Dev needs to cash out "decision procedure" without a homunculus. Progress here looks like **Program Equilibrium** or **Modal Decision Theory**. If Dev can show that "Pay" is the fixed point of a logical interaction between two algorithms (Agent and Predictor) in a way that is mathematically rigorous (not just intuition pumps about "types"), that strengthens the claim that logical counterfactuals are real.
  *   *Progress condition:* A formal proof that agents using "Pay" logic strictly dominate "Don't Pay" logic in a tournament of Newcomb-like problems, *without* assuming pre-commitment.

  **B. Formalizing the "Binding" (For Maya)**
  Maya needs to explain how a rational agent can bind a future rational agent without invoking magic. **Resolute Choice** is often criticized as simply "deciding to decide."
  *   *Progress condition:* A model of **diachronic agency** where the future self's rationality is parameterized by the past self's resolution, showing that "resolute" agents are not just "irrational" agents in disguise. If she can show that *updating* on your past resolution is rationally required, she bridges the gap.

  **C. Dissolving the Predictor (For Sam)**
  Sam's view is the most scientifically robust but the least normatively satisfying. Progress here is showing that **perfect prediction implies the absence of agency.**
  *   *Progress condition:* A proof that if a Predictor's accuracy exceeds a certain threshold relative to the Agent's computational complexity, the Agent's "decision" is mathematically reducible to the Predictor's calculation. This would validate Sam's claim that the case is "rigged" by showing that high correlation *eliminates* the decision node entirely.

  ### 4. The Verdict
  Your group is stuck because **Parfit's Hitchhiker is designed to break the link between Causal Independence and Rational Recommendation.**

  *   If you keep Causal Independence (Maya), you lose the Recommendation (you die in the desert).
  *   If you keep the Recommendation (Dev), you lose Causal Independence (you must accept logical causation).
  *   If you keep both real (Sam), you lose the Case (it's impossible).

  **Your hypothesis is correct:** You are fighting about the *relata* of rationality. But this isn't a verbal dispute; it's a disagreement about the **metaphysics of control.**

  **Recommendation for the Seminar:**
  Stop trying to solve the case. Instead, treat the case as a **reductio** for each position.
  1.  Ask Maya: "If Resolute Choice is rational, why isn't it just 'pre-commitment'? At what point does the future self regain the right to defect?"
  2.  Ask Dev: "If logical counterfactuals allow you to influence the past, where is the boundary? Does this allow for actual backwards causation in physical systems?"
  3.  Ask Sam: "If we reject the case as impossible, do we lose the ability to model high-correlation social interactions (like trust, reputation, and honesty) which are functionally identical to Hitchhiker but less perfect?"

  **Progress** here isn't finding the right answer. It's mapping the **cost** of each answer.
  *   Maya pays in *outcomes* (she dies in the desert).
  *   Dev pays in *metaphysics* (he accepts logical causation).
  *   Sam pays in *applicability* (he can't model high-stakes trust).

  If your group can agree on *what price each theory pays*, you have moved. If you are still arguing about who is "right," you are arguing about which price you prefer to pay. That is not a decision theory problem; it is a philosophical preference.
