prompt: |-
  hey, im a junior and i do the stats for my school's basketball team — i keep the shot spreadsheet and write the recap threads after games — and me and my friend got into a dumb but now very serious argument in the groupchat about Simpson's paradox. It started because one of our guards shot worse overall this season than last season but better from both inside and outside the arc, and my friend says that just means the overall number is the fake one, and i said no, it depends on what question you're asking, and now neither of us will drop it. My stats teacher overheard us and said the interesting version of our fight is that people use "Simpson's paradox" for like five or six totally different situations and then act like they've settled something. So: I want a decision tree that starts at "the comparison flips when I split my data by some third variable Z" and ends at a named diagnosis of what kind of situation I'm actually in.

  Here's what I need from it. Every branch node has to be a question I could answer from the spreadsheet or from the story behind the numbers, phrased so I don't already have to know the vocabulary — so not "is Z a collider?", more like "did Z get decided before or after the thing you're comparing?", "does Z change how many rows are in each group, or does it change how the rows inside a group behave?", "if someone handed you the individual rows instead of the group summaries, would the answer change?". I want 8 branch questions max and 8 to 10 leaves, numbered so I can follow it on paper. The leaves have to include: a real pre-treatment confounder; conditioning on something that's downstream of the variable you care about; conditioning on something that both of your variables feed into (my teacher called it the "you only see the people who showed up at the hospital" case); the case where it's just that the denominators moved and there's no causal question at all; the case where you only have group-level rates and the individual-level story is genuinely not recoverable from them; and at least one leaf that amounts to "the numbers are fine, your question was ill-posed / there's no fact of the matter about which split is the correct one." Each leaf ends with one short verdict line on what I should actually put in the recap: quote the overall number, quote the split numbers, or quote neither and compute something else instead (and say what).

  Two of my own ideas I really want built into the tree, even if you think they're half-baked. First: before any of the causal stuff, a node that checks whether the reversal is coming from the group sizes moving or from the rates inside the groups moving — like, hold the subgroup rates fixed and swap in last season's mix of shot attempts and see if the flip survives, then do the reverse and let the mix move while the rates stay put. I think that separates a couple of cases people always mush together, but I'm not sure which ones. Second: every leaf has to say which of three patterns it predicts — flip (sign reverses), fade (the gap just disappears when you split), or inflate (it was there all along and gets bigger in the subgroups). Also: give me at least three combinations of answers your tree logically allows but where no real case lives, and tell me why each one is empty (incoherent? just trivially not a paradox? nobody bothered?). And please flag any pair of leaves the tree can't actually separate using only numbers, and say exactly what extra information would break the tie.

  Then run four cases through the finished tree and tell me where each one lands and where it gets stuck: my basketball guard thing; the kidney stone treatment one where the treatment looks better overall but worse in both the small-stone and large-stone groups; that old Jeter vs Justice batting average comparison; and the 1970s university admissions case where the pooled numbers and the department-by-department numbers seemed to point opposite ways. Last thing: my teacher said one of the distinctions I insisted on above "doesn't do the work I think it does" — if you agree, tell me which one and why, but build the tree with it anyway so I can see what he means. If a case can't be diagnosed without info I don't have, say so explicitly instead of guessing; that's actually the part I'm most interested in.
