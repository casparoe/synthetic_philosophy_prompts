  ### The "Why Did The Number Flip?" Decision Tree

  **Start:** You have two groups (e.g., Season A vs. Season B). The **Overall** average says Group A is better. The **Split** averages (by Zone, Year, Dept, etc.) say Group B is better.

  **Q1. The "Mix vs. Rates" Check (Your Idea)**
  *Calculation:* Take Group A's shooting rates and apply them to Group B's shot mix (weights). Then do the reverse.
  *Question:* If you force the shot mix to be identical for both groups, does the winner swap back to match the split data?
  *   **YES** → Go to **Q2**. (The flip is driven by the weighting/mix).
  *   **NO** → Go to **Q3**. (The flip persists even with equal mix; rates are driving it).
      *   *(Note: Mathematically, for a true reversal, the answer should almost always be YES. If NO, it might not be Simpson's Paradox, just noise or effect modification.)*

  **Q2. The "Intent" Check**
  *Question:* Are you trying to **predict** what happens if you force a change (e.g., "Make him take more 2s"), or just **describe** what happened historically?
  *   **Describe** → **Leaf 1**.
  *   **Predict** → Go to **Q4**.

  **Q3. The "Timing" Check**
  *Question:* Did the grouping variable ($Z$) exist *before* the season or treatment choice ($X$) started? (e.g., Did the stone size exist before the doctor chose the treatment?)
  *   **NO (After)** → **Leaf 2**.
  *   **YES (Before)** → Go to **Q5**.

  **Q4. The "Mechanism" Check**
  *Question:* Does the season/treatment ($X$) change *how* the player shoots, or just *where* they are allowed to shoot?
  *   **Changes How (Direct)** → **Leaf 3**.
  *   **Changes Where (Indirect)** → **Leaf 4**.

  **Q5. The "Selection" Check**
  *Question:* Did the grouping variable ($Z$) decide whether this row made it into your spreadsheet at all? (e.g., Do you only have data for people who survived/showed up?)
  *   **YES** → **Leaf 5**.
  *   **NO** → Go to **Q6**.

  **Q6. The "Granularity" Check**
  *Question:* Do you have the row-by-row data for every individual, or just the group averages (e.g., Department averages, not applicant data)?
  *   **Group Averages Only** → **Leaf 6**.
  *   **Individual Rows** → Go to **Q7**.

  **Q7. The "Clarity" Check**
  *Question:* Is the question "Who is better?" clearly defined (e.g., "Points per minute"), or is it vague (e.g., "Who is the more valuable player")?
  *   **Vague / No Fact of the Matter** → **Leaf 7**.
  *   **Clearly Defined** → Go to **Q8**.

  **Q8. The "Stability" Check**
  *Question:* Are the subgroup sample sizes large enough to trust the split (e.g., >30 shots per zone), or are they tiny?
  *   **Tiny (Noise)** → **Leaf 8**.
  *   **Large (Signal)** → **Leaf 9**.

  **(Empty Path)** → **Leaf 10**.

  ---

  ### The Leaves (Diagnoses & Verdicts)

  **Leaf 1: The Aggregation Artifact (e.g., Jeter vs. Justice)**
  *   **Diagnosis:** The flip is purely mathematical. The groups faced different "mixes" of difficulty, but there is no causal intervention intended.
  *   **Verdict:** **Quote the Overall Number.** The split is interesting context, but the overall average is the correct summary of historical performance.
  *   **Pattern:** **Flip** (Observed), but underlying truth is **Fade** (The gap disappears when weighted correctly).

  **Leaf 2: The Mediator (Downstream Conditioning)**
  *   **Diagnosis:** $Z$ happened *after* $X$. Splitting by $Z$ blocks the effect of $X$. (e.g., Season $\rightarrow$ Playstyle $\rightarrow$ Shot Location).
  *   **Verdict:** **Quote the Overall Number.** You want the "Total Effect," not the "Direct Effect."
  *   **Pattern:** **Flip** (Observed), but underlying truth is **Inflate** (The overall gap is the real causal impact).

  **Leaf 3: The Indirect Effect (Partial Mediation)**
  *   **Diagnosis:** $X$ changes $Z$, which changes $Y$. You care about the mechanism.
  *   **Verdict:** **Quote Neither. Compute the Indirect Effect.** Show how much of the change was due to taking different shots vs. shooting better on the same shots.
  *   **Pattern:** **Flip** (Observed), underlying truth is **Decompose** (Part Flip, Part Fade).

  **Leaf 4: The Real Pre-Treatment Confounder (e.g., Kidney Stones)**
  *   **Diagnosis:** $Z$ caused both the group assignment and the outcome. The split reveals the truth; the overall number is biased.
  *   **Verdict:** **Quote the Split Numbers.** The overall number is misleading.
  *   **Pattern:** **Flip** (Observed and Real). The split direction is the causal truth.

  **Leaf 5: The Collider ("Hospital" Case)**
  *   **Diagnosis:** You only see the data because $Z$ happened. Conditioning on $Z$ creates a fake correlation.
  *   **Verdict:** **Quote Neither. Acknowledge Bias.** The data cannot answer the question without external correction.
  *   **Pattern:** **Flip** (Observed), underlying truth is **Unknown** (Likely Fade or Null).

  **Leaf 6: The Ecological Fallacy**
  *   **Diagnosis:** You only have group-level rates. You cannot know if the individuals follow the group trend.
  *   **Verdict:** **Quote Neither. Collect Individual Data.** Do not infer individual behavior from group averages.
  *   **Pattern:** **Flip** (Observed at Group Level), Individual Pattern **Unrecoverable**.

  **Leaf 7: The Ill-Posed Question**
  *   **Diagnosis:** There is no single "better." Both numbers are true for different definitions of value.
  *   **Verdict:** **Quote Both.** Explain that Overall = Volume/Efficiency, Split = Skill/Context.
  *   **Pattern:** **Flip** (Both are facts, no single truth).

  **Leaf 8: The Noise Flip**
  *   **Diagnosis:** The reversal is due to random variance in small subgroups.
  *   **Verdict:** **Quote the Overall Number.** The split is overfitting noise.
  *   **Pattern:** **Flip** (Observed), underlying truth is **Fade** (No real difference).

  **Leaf 9: The Effect Modification**
  *   **Diagnosis:** The treatment works differently in different subgroups (e.g., Good vs. Bad Defense).
  *   **Verdict:** **Quote the Split Numbers.** The overall average hides crucial context.
  *   **Pattern:** **Inflate** (The difference is real but varies by group).

  **Leaf 10: [EMPTY] The "Pre-Treatment Selection"**
  *   **Diagnosis:** Logically impossible path. Q3 says $Z$ is Pre-Treatment, Q5 says $Z$ determines Selection. If $Z$ exists before $X$, it cannot be a collider caused by $X$ and $Y$ selection. This is just Confounding (Leaf 4).
  *   **Verdict:** **N/A.**
  *   **Pattern:** **N/A.**

  ---

  ### Analysis & Requirements Check

  #### 1. The Teacher's Critique: "Mix vs. Rates" (Q1)
  I agree with your teacher. **Q1 does not do the work you think it does.**
  *   **Why:** For a sign *flip* (reversal) to occur mathematically, you *must* have both: (1) an association between Group and Mix ($X \leftrightarrow Z$) AND (2) an association between Mix and Outcome ($Z \leftrightarrow Y$).
  *   If you hold rates fixed and swap mix, the overall average changes, but it cannot *flip* unless the rates were already different.
  *   If you hold mix fixed and swap rates, the overall average changes, but it cannot *flip* unless the mix was already correlated.
  *   **The Paradox is an Interaction:** Asking "Is it the mix or the rates?" is like asking "Did the length or the width cause the area to increase?" Both are required. However, I kept it in the tree (as Q1) because it forces you to calculate the standardization, which is a useful habit, even if the binary "Yes/No" doesn't perfectly separate causal types on its own.

  #### 2. Indistinguishable Leaves
  **Leaf 1 (Aggregation) and Leaf 4 (Confounder)** are numerically identical.
  *   **The Tie:** In both cases, you see a Flip. In both cases, $Z$ is pre-treatment. In both cases, standardizing the mix fixes the number.
  *   **The Breaker:** **Q2 (Intent).**
      *   If you ask "Who hit better *last year*?" (Descriptive), it's Leaf 1. Quote Overall.
      *   If you ask "Who will hit better *next year*?" (Causal), it's Leaf 4. Quote Split.
      *   **Without knowing the question's intent, the numbers alone cannot tell you which leaf you are in.**

  #### 3. Three Logically Empty Combinations
  1.  **Q3=NO (After) + Q5=YES (Selection):** If $Z$ happens *after* $X$, it can be a collider. But if $Z$ determines *inclusion in the spreadsheet*, and $X$ is the season... this is possible (e.g., Only shots from close games recorded). However, if the tree routes Q3=NO to Leaf 2 (Mediator) *before* reaching Q5, this path is structurally blocked in my tree. In a full factorial design, "Post-treatment Selection" is a specific type of Collider Bias, but often indistinguishable from Mediation without knowing if $Z$ blocks data entry or just changes outcomes.
  2.  **Q6=Group Only + Q2=Predict (Causal):** You cannot make a causal prediction about individuals (Q2) using only ecological group data (Q6) without assuming homogeneity. This leads to Leaf 6, but if you insist on a prediction, you are in the **Ecological Fallacy** trap. It's "empty" in the sense that a valid verdict is impossible.
  3.  **Q1=NO + Start="Flip":** As mentioned in the critique, if standardizing the mix (Q1) does *not* make the winner swap back, it is mathematically impossible for the original observation to be a Simpson's Paradox reversal. It would just be a rate difference. This path is logically empty for a tree starting at "The Comparison Flips."

  ---

  ### Running The Four Cases

  #### 1. The Basketball Guard (Your Case)
  *   **Data:** Season A (Overall 40%), Season B (Overall 38%). Split: 2pt% up, 3pt% up.
  *   **Path:**
      *   Q1 (Mix Check): **YES.** (If you force Season B to take Season A's mix of 2s/3s, Season B likely wins).
      *   Q2 (Intent): **Ambiguous.** Are you evaluating the *player's skill* (Causal → Leaf 4) or the *season's production* (Descriptive → Leaf 1)?
      *   **Result:** **Stuck between Leaf 1 and Leaf 4.**
      *   **Verdict:** If writing a recap for fans (Description), quote **Overall**. If advising the coach on player talent (Causal), quote **Split**.
      *   **Teacher's Point:** This is exactly where the fight lives. Your friend says "Overall is fake" (Leaf 4 logic). You say "Depends on the question" (Leaf 1 vs 4 distinction).

  #### 2. Kidney Stone Treatment
  *   **Data:** Treatment A looks better overall. Treatment B better for Small Stones AND Large Stones.
  *   **Path:**
      *   Q1 (Mix Check): **YES.** (Doctors gave Treatment B to harder cases).
      *   Q2 (Intent): **Predict.** (Which treatment should we use?).
      *   Q3 (Timing): **YES.** (Stone size exists before treatment).
      *   Q5 (Selection): **NO.** (All patients recorded).
      *   **Result:** **Leaf 4 (Confounder).**
      *   **Verdict:** **Quote the Split Numbers.** Treatment B is actually better; the overall number is biased by case difficulty.

  #### 3. Jeter vs. Justice (Batting Averages)
  *   **Data:** Jeter lower avg in '95 and '96 individually, but higher combined.
  *   **Path:**
      *   Q1 (Mix Check): **YES.** (Justice had way more at-bats in his high-average year).
      *   Q2 (Intent): **Describe.** (Who performed better in that window?).
      *   **Result:** **Leaf 1 (Aggregation).**
      *   **Verdict:** **Quote the Overall Number.** There is no "treatment" to assign. The overall average correctly summarizes total production over the period.

  #### 4. Berkeley Admissions (1973)
  *   **Data:** Men admitted at higher rate overall. Women admitted at higher rate in most departments.
  *   **Path:**
      *   Q1 (Mix Check): **YES.** (Women applied to harder departments).
      *   Q2 (Intent): **Predict/Causal.** (Is there discrimination?).
      *   Q3 (Timing): **YES.** (Dept choice before admission).
      *   Q5 (Selection): **NO.** (All applicants recorded).
      *   **Result:** **Leaf 4 (Confounder).**
      *   **Verdict:** **Quote the Split Numbers.** The overall number suggests bias, but the split suggests women self-selected into more competitive departments. (Note: Some argue there is a Selection component Leaf 5 if considering which depts women *felt allowed* to apply to, but standard analysis treats Dept as a Confounder).

  ### Final Note on the "Mix vs. Rates" Node
  You wanted this node built in, and I did (Q1). But notice in the **Basketball** and **Jeter** cases, the answer to Q1 is the same ("YES"), yet the Verdict is different (Split vs. Overall). This proves your teacher's point: **The math of the flip (Q1) does not determine the verdict. The story/intent (Q2) does.** The numbers tell you *that* a paradox exists; the context tells you *what to do about it*.
