prompt: |-
  I run a 90-minute session of a decision-theory reading group: about 18 undergraduates, one long table, no real money. They are comfortable with expected-value maximization and have already discussed Pascal's Wager as a historical curiosity, but they have not met the mugging case, and I would rather they run into it than hear it named.

  Design a runnable activity — rules, materials, a timeline, and any roles you want — in which the students are made to feel the pressure of Pascal's mugging rather than of the Wager, and in particular the feature that separates the two: that the mugger sets the size of the stake after seeing how resistant you are, so that no credence threshold or stake-discount you fix in advance is safe from being outbid. The rough mechanic I have in mind: an opening round in which they allocate chips to an ordinary, well-evidenced high-impact ask; then the Mugger, whose demand stays at a single unit while the threatened or promised stake is multiplied by a large fixed factor each time the group declines; then, once they have settled into a pattern, a Counter-Mugger who pays them for refusing the first. But design it as you think best, and don't let the facilitator name any view up front.

  The debrief should map each moment of the game onto one of the four ingredients doing the work — unbounded stakes, expected-value maximization, no floor on credence, and an adversarially chosen stake. It should also get participants to write down a decision rule before seeing the next stake, then apply it to a stake chosen in light of the rule, so the cost of each escape route — a utility ceiling, a probability floor, stakes-insensitivity below a threshold, or abandoning expected value — surfaces as a loss somewhere else in the game.

  Finally, be honest about what the exercise cannot reproduce and that I will have to state myself: above all that, in the game, the stakes are stipulated rather than genuinely uncertain, so nothing the students do can show them why a prior should be structured so as to be exploitable in the first place, or why the mugger's claim deserves any credence at all. And tell me what will predictably go wrong: how do I keep the room from simply refusing to engage, from insisting that the probability is literally zero, or from deferring to whichever student does arithmetic fastest?
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute decision-theory reading group, ~18 undergraduates, one long table, no real money.
      *   **Background:** Comfortable with EV maximization, know Pascal's Wager (historical), *do not* know Pascal's Mugging (PM).
      *   **Goal:** Make them *feel* the pressure of PM (specifically the adaptive stake feature) rather than just hearing about it.
      *   **Key Mechanic:** Mugger adjusts stake *after* seeing resistance. No fixed credence threshold/stake discount is safe.
      *   **Proposed Structure:** Opening round (ordinary high-impact), Mugger rounds (demand = 1 chip, stake multiplies), Counter-Mugger (pays for refusal).
      *   **Debrief Requirements:** Map game moments to 4 ingredients (unbounded stakes, EV max, no credence floor, adversarial stake). Force students to write decision rules *before* seeing stakes to show costs of escape routes (utility ceiling, prob floor, etc.).
      *   **Facilitator Constraints:** Don't name views upfront. Be honest about limitations (stipulated stakes vs. genuine uncertainty).
      *   **Risk Management:** Prevent disengagement, "prob = 0" dismissals, or domination by one fast calculator.

  2.  **Deconstruct the Core Problem (Pascal's Mugging):**
      *   Standard PM: A stranger says "Give me $5 or I will use magic powers to kill $3 \uparrow\uparrow\uparrow 3$ people."
      *   The Trap: If $P(\text{claim}) > 0$ and Utility is unbounded, eventually $P \times U > \text{Cost}$.
      *   The Specific Nuance requested: The *adaptive* nature. It's not just one big number; it's an iterative process where the mugger outbids your skepticism.
      *   The Counter-Mugger: This adds a "Pascal's Mugging vs. Pascal's Mugging" conflict (symmetric threats), highlighting the inconsistency of accepting one without the other.

  3.  **Drafting the Activity Structure:**

      *   *Setup:* Need a currency. "Decision Chips." Need a goal. "Group Score" or "Individual Prize." Let's go with Individual Prize to make the loss personal, but Group Decision to force negotiation. Actually, for 18 people at one table, a collective decision is hard to manage in 90 mins. Better: Small groups of 3-4? No, prompt says "one long table." Let's treat them as a single committee allocating a budget, or individuals making private bets.
      *   *Refinement:* Private bets are better for revealing individual thresholds. But the prompt implies a "session" where they discuss. Let's do a hybrid: Individual allocation, but public discussion allowed.
      *   *Wait, the prompt asks for "The Mugger... whose demand stays at a single unit... each time the group declines."* This implies a collective dynamic. Let's make it a **Committee Budget** game. They have a shared pot of chips. They must decide unanimously (or majority) whether to pay the Mugger.
      *   *Actually, to make the "write down a decision rule" part work best,* individuals should commit to a rule *before* the stake is revealed.
      *   *Revised Plan:*
          1.  **Phase 1: The Charity (Baseline).** Standard EV. High prob, moderate impact. Establishes they are EV maximizers.
          2.  **Phase 2: The Mugging (The Trap).** Iterative rounds. Cost = 1 chip. Impact = $10^x$ chips. Probability is fixed but non-zero (stipulated by facilitator).
          3.  **Phase 3: The Counter-Mugging (The Mirror).** Same structure, but pays *you* if you refuse the first.
          4.  **Phase 4: Rule Commitment.** Before the final escalation, they must write a policy. Then the Mugger picks a number to break it.

      *   *Wait, I need to ensure the "adaptive stake" feature is central.* The Mugger needs to react to *their* refusal.
      *   *Mechanic:* Facilitator plays the Mugger.
      *   *Round 1:* Pay 1 chip to save 100 lives (prob 50%). (Warmup)
      *   *Round 2:* Pay 1 chip to save $10^{10}$ lives (prob $10^{-9}$).
      *   *Round 3:* Pay 1 chip to save $10^{20}$ lives (prob $10^{-19}$).
      *   *Constraint:* They must write a "Policy Statement" before Round 3.
      *   *Counter-Mugger:* "Pay me 1 chip to *stop* the first Mugger."

      *   *Critique:* This feels too lecture-y. The prompt wants them to *run into it*.
      *   *Better Mechanic:* **The Auction of Doom.**
      *   They start with 10 chips each.
      *   Facilitator offers a deal. "Give me 1 chip. I will generate X utility."
      *   The "Probability" is the tricky part. In PM, the probability is usually subjective. If I say "Prob is $10^{-9}$," they will just say "No it's not."
      *   *Solution:* The Facilitator *stipulates* the probability for the sake of the game mechanics, but frames it as "Credence." Or, use a deck of cards to represent probability? No, that makes it empirical. PM is about *subjective* credence in extraordinary claims.
      *   *Compromise:* The Facilitator acts as the "Oracle." "For the purpose of this EV calculation, we are granting the claim a credence of $1/N$." The students must accept this premise to play the EV game. If they reject the premise, they opt out of EV max. This is a key teaching point.
      *   *Let's refine the "Adaptive" aspect.* The Mugger shouldn't just pre-plan the numbers. The Mugger should ask: "What would it take for you to pay?" Then set the stake slightly higher.
      *   *Okay, let's look at the prompt's specific mechanic:* "Mugger... demand stays at a single unit while the threatened or promised stake is multiplied by a large fixed factor each time the group declines."
      *   *Okay, I will follow this.*

  4.  **Developing the Timeline (90 Minutes):**
      *   0-10: Setup & Endowment.
      *   10-25: Round 1 (Normal Charity). Establish EV norms.
      *   25-50: Round 2-4 (The Mugging). Escalating stakes.
      *   50-65: The Counter-Mugger.
      *   65-80: Rule Writing & The Trap.
      *   80-90: Debrief.

  5.  **Addressing the "Escape Routes" (Debrief Prep):**
      *   To make the debrief work, the game needs to force them into a corner where their rule fails.
      *   *Rule:* "I will only pay if Prob > 1%." -> Mugger sets Stake so high that $1\% \times \text{Stake} > \text{Cost}$? No, Mugger sets Stake high, but Prob is fixed low.
      *   *Correction:* In PM, Prob is fixed (low), Stake is variable (high).
      *   *Escape Route 1 (Prob Floor):* "I assign 0 prob to magic." -> Game forces non-zero stipulation.
      *   *Escape Route 2 (Utility Cap):* "100 billion lives is same as 1 trillion." -> Counter-mugger exploits this.
      *   *Escape Route 3 (EV Rejection):* "I don't maximize EV." -> Round 1 established they do.
      *   *Escape Route 4 (Policy Binding):* "I commit to No." -> Mugger offers stake that makes 'No' irrational by their own lights.

  6.  **Managing Risks:**
      *   *Risk:* "Prob is literally zero."
      *   *Fix:* The game rules *define* the credence. "In this simulation, the Credence is defined as $10^{-X}$." If they say 0, they are breaking the game rules, not making a decision theoretic move. Frame it as "Given this credence..."
      *   *Risk:* Disengagement.
      *   *Fix:* Keep it fast. Use physical chips. Make the stakes absurdly funny.
      *   *Risk:* One student dominates.
      *   *Fix:* Silent voting first, then discussion. Or individual worksheets. Let's go with **Individual Decision Sheets** collected by the Mugger. This prevents herd mentality and forces individual accountability.

  7.  **Fleshing out the "Counter-Mugger":**
      *   If they pay the Mugger, the Counter-Mugger says "I could have saved those lives for free, but now I won't."
      *   Or better: Counter-Mugger says "Give me 1 chip, and I will ensure the first Mugger's threat is nullified."
      *   This creates a cycle. Pay Mugger -> Pay Counter-Mugger -> Pay Mugger...
      *   This illustrates the "Money Pump" aspect of inconsistent preferences.

  8.  **Finalizing the Design:**
      *   **Title:** The Infinite Ledger.
      *   **Materials:** Chips (poker or paper), Decision Slips, Whiteboard.
      *   **Roles:** Facilitator (Oracle/Mugger), Students (Agents).
      *   **The Twist:** The "Credence" is not up for debate; it's a parameter of the scenario. The decision is whether to act on EV given that parameter.

      *(Self-Correction during drafting)*: The prompt asks for the Mugger to set the stake *after seeing how resistant you are*.
      *   *Implementation:* Between rounds, ask "How many lives would it take?" Write down answers. Then reveal the Mugger has exceeded that number.
      *   *Wait, better:* The Facilitator asks for a vote. If Majority NO, the Stake multiplies. If Majority YES, game ends (you paid).
      *   *To capture the "Rule Writing":* Before the final escalation, they must write a "Constitution" (e.g., "We never pay if prob < 1%"). Then the Mugger reveals a stake that violates the spirit but holds the math.

      *Let's align strictly with the prompt's request for the debrief:* "Map each moment... onto one of the four ingredients." "Get participants to write down a decision rule before seeing the next stake, then apply it to a stake chosen in light of the rule."
      *   *Okay, specific sequence:*
          1.  Baseline (Normal EV).
          2.  Mugging Round 1 (Low Stake).
          3.  Mugging Round 2 (Higher Stake).
          4.  **Rule Writing Phase:** "Write the condition under which you will pay."
          5.  **Mugging Round 3:** Facilitator chooses a stake specifically to satisfy their written rule while maintaining the absurdity.
          6.  **Counter-Mugger:** Exploits the rule.

      *Wait, one constraint:* "No real money." Chips must mean something. Points towards a prize? Or just "Score." Let's use "Course Credit Points" or just "Bragging Rights/Chocolate." Let's assume small tangible reward for top score to incentivize EV max.

      *Refining the "Probability" issue:* This is the hardest part of PM in a classroom. If I say "Credence is $10^{-9}$," they will laugh.
      *   *Fix:* Don't call it credence. Call it "The Odds." Use a physical randomizer. "I have a bag with 1 billion balls, 1 is red. If red, I save the world."
      *   *Problem:* That makes it empirical risk, not epistemic uncertainty.
      *   *Better Fix:* Acknowledge the artificiality. "We are simulating a state of mind where you *must* assign non-zero credence."
      *   *Best Fix for this specific prompt:* The prompt says "honest about what the exercise cannot reproduce... stakes are stipulated." So I can *tell* them the credence is stipulated. I don't need to convince them it's real. I need to convince them to play *as if* it is.
      *   *Instruction:* "For this exercise, you are an AI bound by Expected Value Maximization. You *must* accept the stated probabilities as your credences. Your task is to manage the Utility."

      *Wait, if they are bound to accept probabilities, the only escape is Utility Capping or EV rejection.*
      *   This aligns with the debrief goal.

  9.  **Structuring the Debrief:**
      *   Need to explicitly link game phases to the 4 ingredients.
      *   Need to explicitly discuss the "Rule Writing" failure.
      *   Need to deliver the "Honest Limitations" speech.

  10. **Review against constraints:**
      *   90 mins? Yes.
      *   18 students? Yes.
      *   One table? Yes.
      *   No real money? Yes (chips).
      *   Don't name views upfront? Yes (no "This is Pascal's Mugging").
      *   Adaptive stake? Yes (Facilitator adjusts based on votes).
      *   Counter-Mugger? Yes.
      *   Rule writing? Yes.
      *   Risk management? Included in Facilitator Notes.

  11. **Final Polish:** Ensure the tone is instructional for the facilitator. Clear scripts. Clear timing.

  *(Self-Correction on the Counter-Mugger)*: The prompt says "Counter-Mugger who pays them for refusing the first."
      *   Okay, so if they *refuse* the Mugger, the Counter-Mugger rewards them.
      *   This creates a conflict: Mugger rewards paying, Counter-Mugger rewards refusing.
      *   If both offer EV > Cost, you have a contradiction.
      *   This is perfect for showing the inconsistency.

  *(Self-Correction on Rule Writing)*: "Write down a decision rule before seeing the next stake, then apply it to a stake chosen in light of the rule."
      *   So, Round 3: Students write rule (e.g., "Max utility I care about is 1 billion").
      *   Facilitator sees rules. Sets Stake to 1 trillion.
      *   Students must apply rule. If rule is "Max 1 billion," they ignore the extra utility. If rule is "Maximize EV," they must pay.
      *   This forces the "Utility Ceiling" cost to surface.

  Okay, ready to write. I will structure it as a Facilitator Guide.

