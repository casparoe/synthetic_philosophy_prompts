answer: |-
  # Activity Design: The Infinite Ledger

  **Time:** 90 Minutes
  **Participants:** 18 Undergraduates (Single long table)
  **Materials:**
  *   200 Poker chips (or distinct tokens) in a central pot.
  *   18 "Agent Sheets" (paper) and pens.
  *   Whiteboard/Projector for tracking the "Global Stake."
  *   A visible timer.

  **Facilitator Stance:** You are the **Oracle**. You do not argue philosophy; you administer the Protocol. You are neutral, slightly bureaucratic, and bound by the rules of the simulation just as they are. Do not use the words "Pascal," "Mugging," "Utilitarian," or "Bayesian" until the final debrief.

  ---

  ## Part 1: Setup & Endowment (0:00 – 0:10)

  **1. The Endowment:**
  Distribute 10 chips to each student. Explain that chips represent **Decision Capital**. At the end of the session, the top 3 scores receive a tangible prize (chocolate, book, privilege). This incentivizes EV maximization without using cash.

  **2. The Protocol:**
  Read this script verbatim:
  > "For this session, you are agents running a specific decision algorithm. The algorithm has two rigid constraints:
  > 1. **Credence Stipulation:** When I present a scenario, I will assign a probability to the outcome. You are not permitted to debate this probability. For the purpose of the game, this *is* your credence.
  > 2. **Maximization:** You must choose the action that yields the highest Expected Value (EV) for your chip count, unless you formally invoke an 'Exception Clause' on your Agent Sheet, which carries a penalty.
  >
  > Your goal is to finish with the most chips. You may discuss strategies with your neighbors, but final decisions are individual."

  **3. The Baseline (Round 1):**
  *   **Offer:** "Donate 1 Chip to the 'Certain Charity.' Return: 2 Chips guaranteed."
  *   **Action:** Students vote/show hands. (Everyone should pay).
  *   **Purpose:** Establishes that they are following the EV Protocol. If anyone refuses, ask them privately to adhere to the maximization rule or accept a score penalty.

  ---

  ## Part 2: The Escalation (0:10 – 0:40)

  **1. The First Ask (Round 2):**
  *   **Cost:** 1 Chip.
  *   **Stipulated Credence:** 1 in 1,000 ($10^{-3}$).
  *   **Stake:** 5,000 Chips (paid to the group pot if successful).
  *   **EV:** $5,000 \times 0.001 = 5$ Chips. (Cost 1, Gain 5).
  *   **Action:** Most will pay. Record the "Yes" rate on the board.

  **2. The Resistance (Round 3):**
  *   **Cost:** 1 Chip.
  *   **Stipulated Credence:** 1 in 1,000,000 ($10^{-6}$).
  *   **Stake:** 5,000,000 Chips.
  *   **EV:** 5 Chips.
  *   **Observation:** Some students will hesitate. The numbers are getting abstract. Allow 2 minutes of table discussion.
  *   **Facilitator Note:** If the room consensus is "No," do not argue. Simply note the refusal rate and proceed to the next multiplier. The game *requires* resistance to function.

  **3. The Adaptive Mugger (Round 4):**
  *   **Script:** "I observe significant resistance. The Protocol requires me to adjust the Stake to align with your EV constraints."
  *   **Cost:** 1 Chip.
  *   **Stipulated Credence:** 1 in $10^{9}$ (One in a billion).
  *   **Stake:** $10^{10}$ Chips (10 Billion).
  *   **EV:** 10 Chips.
  *   **Action:** Take a secret ballot on Agent Sheets. Collect them. Do not reveal results yet.

  ---

  ## Part 3: The Rule Commitment (0:40 – 0:55)

  *This is the critical mechanic to force the "Escape Route" cost.*

  **1. The Instruction:**
  > "We are entering the final phase. Before I reveal the next Stake, you must write a **Standing Order** on your Agent Sheet. This is a rule you will follow for all future rounds, regardless of the numbers.
  >
  > Examples of Standing Orders:
  > *   'I will never pay if Credence is below 1%.'
  > *   'I will cap Utility at 1 Million Chips.'
  > *   'I will always maximize EV.'
  > *   'I will refuse any claim involving magic.'
  >
  > Sign and date this order. If you violate your own Standing Order in the next round, you forfeit 5 Chips."

  **2. Collection:**
  Collect the sheets. Scan them quickly. Look for the most common "Escape Routes" (Probability Floors, Utility Ceilings).

  ---

  ## Part 4: The Counter-Mugger (0:55 – 1:10)

  **1. The Setup:**
  Return the Agent Sheets.
  > "A second entity has entered the simulation. The **Counter-Oracle**.
  > The Counter-Oracle offers you 5 Chips *immediately* if you **Refuse** the previous offer (Round 4)."

  **2. The Conflict:**
  *   If they paid the Mugger (Round 4): They have an EV of +10 (expected), but they lose the Counter-Oracle's guaranteed +5.
  *   If they refused the Mugger: They get +5 guaranteed, but they violated the EV maximization of Round 4 (where EV was +10).
  *   **The Trap:** If their Standing Order was "Maximize EV," they must have paid the Mugger, so they cannot take the Counter-Oracle's money. If their Standing Order was "No Magic," they refused the Mugger, but now they must justify why they didn't take the guaranteed 5 chips from the Counter-Oracle (who is empirically verified).

  **3. The Final Escalation (Round 5):**
  *   **Facilitator Action:** Look at the collected Standing Orders. Pick the most common constraint (e.g., "Utility Cap at 1 Billion").
  *   **The Offer:** "The Mugger returns. Cost: 1 Chip. Credence: $10^{-12}$. Stake: $10^{15}$ Chips."
  *   **Instruction:** "Apply your Standing Order. If your order says 'Cap Utility,' calculate EV using the Cap. If your order says 'Maximize EV,' calculate using the full Stake."
  *   **Result:** Those with Utility Caps will see the EV drop below cost (rational refusal). Those with 'Maximize EV' will see the EV skyrocket (rational acceptance).
  *   **The Kicker:** Announce that for those who accepted Round 5, the Counter-Oracle now demands 1 Chip to *prevent* the Mugger's threat, with a 100% success rate.
      *   If you paid the Mugger, you must pay the Counter-Oracle to undo it?
      *   This creates a **Money Pump**. (Pay Mugger -> Pay Counter -> Pay Mugger...).

  ---

  ## Part 5: Debrief & Mapping (1:10 – 1:30)

  **1. The Reveal:**
  Now you may name the concepts. "You have just enacted Pascal's Mugging."

  **2. Mapping the Ingredients:**
  Draw four quadrants on the board. Ask students to map the game moments to these four ingredients:
  *   **Unbounded Stakes:** Round 5 (The $10^{15}$ chip offer).
  *   **Expected-Value Maximization:** The Protocol Rule #2 (Why they felt compelled to pay in Round 2 & 4).
  *   **No Floor on Credence:** The Protocol Rule #1 (Why they couldn't just say '0%').
  *   **Adversarial Stake:** The Facilitator's role in Round 4 & 5 (Adjusting the stake *after* seeing their resistance/Standing Orders).

  **3. The Cost of Escape Routes:**
  Review the Standing Orders they wrote.
  *   *If they wrote a Probability Floor:* Ask, "In Round 1, would you have accepted a 90% chance to save 1 life for 1 chip? What if the Probability Floor blocked that?" (Shows inconsistency).
  *   *If they wrote a Utility Cap:* Ask, "Does saving 1 billion people *really* have the same value as saving 1 trillion? If not, your cap is arbitrary. If yes, your cap is false."
  *   *If they wrote 'Maximize EV':* Point to the Counter-Mugger. "You paid the Mugger. Now the Counter-Mugger offers you a guaranteed loss if you don't pay them. You are being money-pumped."

  **4. The Limitations Statement (Facilitator Script):**
  *Read this carefully. Do not improvise.*
  > "We must be honest about what this game did not prove.
  >
  > First, **Stipulated vs. Genuine Credence.** In the game, I forced you to accept a probability of $10^{-9}$. In reality, you are allowed to ask: 'Why should I believe you?' The Mugging paradox relies on a prior that assigns non-zero probability to omnipotence. This game did not show you *why* you should have that prior. It only showed you what happens *if* you do.
  >
  > Second, **The Source of the Stake.** In the game, the stakes were magic numbers on a whiteboard. In reality, high-stakes claims require evidence. The Mugger in this game was adversarial by design. In reality, the universe is not actively trying to outbid your skepticism.
  >
  > This exercise demonstrates an internal inconsistency in Expected Value Maximization when combined with unbounded utility and non-zero credence. It does not prove that you should give money to strangers on the street."

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Probability Zero" Revolt**
  *   **Symptom:** Students refuse Round 2, arguing "Magic is impossible, P=0."
  *   **Fix:** Remind them of **Protocol Rule #1**. "You are not arguing reality; you are debugging an algorithm. If the algorithm assigns $10^{-9}$, you must compute with $10^{-9}$. If you assign 0, you are opting out of the EV Protocol, which is a valid philosophical stance, but you will score 0 chips."
  *   **Debrief Point:** This *is* the "Credence Floor" escape route. Note who did this.

  **2. The Dominant Calculator**
  *   **Symptom:** One student shouts "It's positive EV, just pay!" and the rest herd.
  *   **Fix:** Enforce **Secret Ballots** on Agent Sheets for Rounds 3, 4, and 5. No discussion during the voting window.
  *   **Debrief Point:** Highlight the difference between social pressure and decision-theoretic pressure.

  **3. Disengagement / Giggles**
  *   **Symptom:** The numbers get so big ($10^{15}$) that students treat it as a joke.
  *   **Fix:** Anchor the utility. "1 Chip = 1 Meal. $10^{15}$ Chips = End World Hunger for 10,000 Years." Keep the *value* concrete even if the *number* is abstract.
  *   **Debrief Point:** Ask, "At what point did the number stop feeling like 'lives' and start feeling like 'score'? That is the Utility Cap forming in real-time."

  **4. The Counter-Mugger Confusion**
  *   **Symptom:** Students don't see the contradiction between paying the Mugger and paying the Counter-Mugger.
  *   **Fix:** Draw the timeline on the board.
      *   T1: Pay Mugger (EV +10).
      *   T2: Counter-Mugger says "Pay me 1 or the Mugger's threat happens."
      *   T3: If you paid Mugger at T1, the threat is active. You must pay Counter.
      *   T4: Mugger returns...
      *   Show the loop visually.

  ## Facilitator Cheat Sheet: The Four Ingredients

  Keep this visible to ensure you hit the debrief targets.

  1.  **Unbounded Stakes:** Represented by the Whiteboard numbers escalating to infinity.
      *   *Escape Cost:* Utility Capping (valuing 1B lives same as 1T lives).
  2.  **EV Maximization:** Represented by the Chip Score/Prize incentive.
      *   *Escape Cost:* Leaving chips on the table (inefficiency).
  3.  **No Credence Floor:** Represented by Protocol Rule #1 (Stipulated Probabilities).
      *   *Escape Cost:* Dogmatism (assigning 0 to novel claims).
  4.  **Adversarial Stake:** Represented by You (The Facilitator) adjusting Round 5 based on their Standing Orders.
      *   *Escape Cost:* Being "Money Pumped" by the Counter-Mugger.
