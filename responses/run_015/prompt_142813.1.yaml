prompt: |-
  I've been chating with my flatmate about Buddhist anatta and I think I've laned on a somewhat odd hybrid view that I'd like stress-tested. Call it 'stream-pluralism': rather than the standard bundle-theory replacement of a self with five skandhas held together in one diachronic bundle, this says the skandhas actually dissolve even that bundle into discrete, causally-conditioned momentary configurations. There's no underlying substrate, and not even a single unified stream — just a plural series of instant psycho-physical events linked only by pratītyasamutpāda (dependent origination), where each configuration causes the next but is literally not identical to it. So 'you' aren't a bundle over time; you're more like a loosely coupled sequence of momentary persons, each existing for a split-second, with continuity being purely conventional (samvṛti) rather than ontologically real.

  You're a professional philosopher of mind with decent familarity with Abhidharma and Madhyamaka metaphysics. Before you dive in, please do a quick brainstorm: list the main categories of defeater this view could face — intuitive, textual, scientific, and metaphysical. Then tell me what would actually count against stream-pluralism. I don't want just the usual fission objections or worries about moral responsibility; I want to know specifcally which intuitions (say, about sustained attention or bodily ownership), which cognitive-science results (maybe about working-memory integration), or which Buddhist textual arguments it stands or falls with. How would defenders distinguish fatal objections from merely awkward ones? Which would they concede as biting, perhaps by retreating to conventional truth, and which would they dismiss as assuming the very self-substance anatta rejects? Rank the defeaters honestly, from 'this collapses the view' to 'this just makes it look a bit contrived'. And think carefully step by step — don't just rehearse standard critiques, map the view's actual exposure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** A specific hybrid view of Buddhist *anatta* (no-self) called "stream-pluralism."
      *   **Core Claim:** Instead of a single diachronic bundle of skandhas, there are discrete, momentary configurations (momentary persons) linked only by dependent origination (*pratītyasamutpāda*). Continuity is purely conventional (*samvṛti*), not ontologically real.
      *   **Role:** Professional philosopher of mind with familiarity with Abhidharma and Madhyamaka metaphysics.
      *   **Task:**
          1.  Brainstorm main categories of defeaters (intuitive, textual, scientific, metaphysical).
          2.  Identify specific objections (intuitions, cognitive science, textual arguments).
          3.  Distinguish fatal objections from awkward ones (concede vs. dismiss).
          4.  Rank defeaters from "collapses the view" to "contrived."
          5.  Think step-by-step, avoiding standard rehearsed critiques, mapping actual exposure.

  2.  **Deconstruct "Stream-Pluralism":**
      *   It sounds very close to the Sautrāntika or Yogācāra *kṣaṇika-vāda* (momentariness) but pushes the discontinuity further.
      *   Standard Bundle Theory: One stream, many parts.
      *   Stream-Pluralism: Many streams (or momentary entities), causal link only.
      *   Key implication: Radical discontinuity. Person A at $t_1$ is *not* Person B at $t_2$, even conventionally, except by causal inference.
      *   This leans heavily into the *Pudgalavāda* critique territory (if it posits *something* persisting) or the *Madhyamaka* critique (if it reifies the moments).

  3.  **Brainstorming Defeater Categories:**
      *   *Metaphysical:* The problem of causal connection without identity. How does $t_1$ cause $t_2$ if they are ontologically distinct? (The "bridge" problem).
      *   *Phenomenological/Intuitive:* Experience of duration. We don't experience moments; we experience specious presents. Memory ownership ("I remember doing that").
      *   *Textual:* Abhidharma debates on *santāna* (continuum). Madhyamaka critique of intrinsic nature of moments.
      *   *Scientific:* Temporal integration windows in neuroscience. Binding problems.

  4.  **Developing Specific Objections (Filtering for Quality):**
      *   *Avoid:* "Who gets karma?" (Too standard/ethical). "Fission cases" (User explicitly excluded).
      *   *Focus:*
          *   *Phenomenology:* The "Specious Present" (William James). If moments are discrete, where does the experience of motion or melody come from?
          *   *Neuroscience:* Working memory requires a temporal window of integration (approx. 3 seconds). If "momentary persons" are shorter than this, who holds the thought?
          *   *Textual:* The *Kathāvatthu* debates. The *Pudgalavāda* middle way. Nāgārjuna's *Mūlamadhyamakakārikā* (MMK) Chapter 9 (Examination of the Prior Entity) and Chapter 2 (Motion).
          *   *Metaphysical:* The "Contact" problem. If $t_1$ ceases before $t_2$ arises, how do they touch causally? (Vasubandhu's *Abhidharmakośa* discussions).

  5.  **Evaluating Fatal vs. Awkward:**
      *   *Fatal:* If the view reifies the moment (*svabhāva*), Madhyamaka destroys it. If the view cannot account for memory *access* (not just storage), it fails phenomenology.
      *   *Awkward/Conventional:* Moral responsibility can be offloaded to *samvṛti*. Personal concern can be explained as causal selfishness.
      *   *Dismissible:* Intuitions of permanent self are exactly what *anatta* targets.

  6.  **Ranking the Defeaters:**
      1.  *Madhyamaka Reification:* If moments have ontological reality, the view is essentialist.
      2.  *Temporal Integration (Phenomenology/Science):* The "Specious Present" contradicts discrete moments.
      3.  *Causal Contact:* How does the ceased cause affect the unarisen effect?
      4.  *Memory Ownership:* Why does *this* moment feel *that* memory as *mine*?
      5.  *Pragmatic/Soteriological:* Does this help liberation or induce nihilism?

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, respectful of the tradition but rigorous.
      *   *Structure:*
          1.  Acknowledge the view (it's essentially Radical Momentariness).
          2.  Brainstorm Categories.
          3.  Deep Dive into Specific Defeaters (Textual, Scientific, Phenomenological, Metaphysical).
          4.  Ranking/Triage (Fatal vs. Conventional).
          5.  Conclusion on viability.

      *   *Refining the "Stream-Pluralism" label:* It sounds like a modern reconstruction of the Sautrāntika *apoha* or Yogācāra *vijñapti-mātra* but stripped of the *ālaya-vijñāna* (storehouse consciousness). Without the *ālaya*, how is continuity maintained? This is a weak point.
      *   *Refining the Science:* Look up "temporal integration window." It's around 30ms for visual, up to 3s for auditory/workng memory. If the "momentary person" is shorter than 30ms, binding fails.
      *   *Refining the Text:* Nāgārjuna's critique of the *dharma* itself. If the moments are real, *anatta* isn't fully realized. The *Pudgalavāda* argument: fire and fuel.

  8.  **Final Review against Constraints:**
      *   Did I avoid standard fission/moral responsibility? Yes.
      *   Did I rank them? Yes.
      *   Did I distinguish fatal from awkward? Yes.
      *   Is the persona correct? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Madhyamaka says no." I need to explain *why* it hits stream-pluralism specifically. It hits it because stream-pluralism treats the *moment* as the new *self*. That's the key insight. The "momentary person" becomes a subtle *pudgala*.

      *(Another Correction)*: Ensure the distinction between *santāna* (continuum) and *pluralism* is clear. Standard Abhidharma accepts moments but maintains a *santāna*. User says "not even a single unified stream." This is the radical part. This risks losing the causal chain entirely.

      *(Final Polish)*: Make sure the ranking is clear and the "why" is explicit for each.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated reconstruction of radical momentariness (*kṣaṇika-vāda*), pushing beyond the standard Sautrāntika or Yogācāra positions by explicitly denying the ontological status of the *santāna* (continuum) itself, treating it as a purely nominal label over discrete, unconnected ontological atoms of experience.

  As a philosopher of mind engaging with Abhidharma and Madhyamaka, I recognize this view. It attempts to solve the "substrate" problem of bundle theory by dissolving the bundle's temporal glue. However, in doing so, it risks reifying the *moment* while destroying the *causal mechanism* that makes Buddhism soteriologically viable.

  Here is the brainstorming breakdown, followed by the specific stress-test and ranking of defeaters.

  ### Part 1: Brainstorming Categories of Defeaters

  1.  **Metaphysical/Causal:** The problem of *asatkāryavāda* (effect does not pre-exist in cause). If moment $M_1$ ceases entirely before $M_2$ arises, how does causation bridge the ontological gap without a medium?
  2.  **Phenomenological:** The "Specious Present." Human experience is not point-like; it has duration (melodies, motion, sentences). Discrete moments cannot account for the experience of transition.
  3.  **Textual/Doctrinal:** The *Kathāvatthu* and *Mūlamadhyamakakārikā* (MMK). Does this view inadvertently posit a *pudgala* (person) at the micro-level? Does it violate the Middle Way by falling into nihilism (*ucchedavāda*)?
  4.  **Cognitive-Scientific:** Temporal integration windows. Working memory and sensory binding require a minimum duration of stability that "momentary persons" might undercut.
  5.  **Soteriological:** If there is no continuum, who practices? Who attains nirvāṇa? Is the path intelligible?

  ---

  ### Part 2: The Stress-Test (Specific Defeaters)

  You asked to avoid standard moral responsibility or fission objections. We will focus on the mechanics of consciousness, causation, and the ontological status of the moment.

  #### 1. The "Reified Moment" Objection (Madhyamaka Metaphysics)
  *   **The Argument:** Stream-pluralism treats the "momentary configuration" as the ontological bedrock. It says, "There is no self, *but* there are real moments." Nāgārjuna (MMK Ch. 7 & 19) argues that if the moment (*kṣaṇa*) has intrinsic nature (*svabhāva*), it cannot change or cease. If it ceases, it must depend on conditions, meaning it is empty.
  *   **Exposure:** High. By positing discrete, ontologically distinct configurations, you are treating the *skandhas* at $t_1$ as having more reality than the "person." You have shifted the *svabhāva* from the macro-self to the micro-event.
  *   **Verdict:** **Fatal.** This collapses the view into a subtle essentialism. Madhyamaka would argue you haven't eliminated self-grasping; you've just shrunk the object of grasping to the size of a moment.

  #### 2. The Temporal Integration Window (Cognitive Science/Phenomenology)
  *   **The Argument:** Neuroscience suggests a "temporal integration window" of roughly 30ms (visual) to 3 seconds (auditory/working memory). For a thought to be thought, or a melody to be heard, the brain must hold distinct inputs in a single state of activation.
  *   **Exposure:** High. If your "momentary person" exists for less than the integration window (as traditional *kṣaṇas* do), then $M_1$ hears the first note, ceases, and $M_2$ hears the second note. $M_2$ has no access to $M_1$. There is no mechanism for *binding*.
  *   **Verdict:** **Fatal (unless modified).** If you concede the "moment" is actually 3 seconds long, you lose the radical impermanence argument. If you keep it ultra-short, you cannot explain the phenomenology of duration without positing a "holder" of the buffer (which looks like a self).

  #### 3. The Causal Contact Problem (Abhidharma Metaphysics)
  *   **The Argument:** In the *Abhidharmakośa*, Vasubandhu wrestles with how a ceased cause produces an effect. If $M_1$ is *gone*, it is non-existent. Non-existents cannot cause. If $M_1$ is *present* when $M_2$ arises, they are simultaneous, violating dependent origination.
  *   **Exposure:** Medium-High. Standard Abhidharma solves this with *santāna* (continuum) theory—the energy is passed like a flame. Stream-pluralism denies the continuum is real. It leaves you with "magic" causation across ontological gaps.
  *   **Verdict:** **Severe.** It forces you to adopt a Humean regularity theory of causation, which Buddhism generally rejects in favor of productive causation (*kriyā*).

  #### 4. Memory Ownership (Phenomenology)
  *   **The Argument:** When I remember, I don't just access data; I appropriate it as *mine* (*ahaṃkāra*). In stream-pluralism, $M_2$ accesses $M_1$'s memory trace. Why does $M_2$ feel *ownership* rather than just observing data?
  *   **Exposure:** Medium. You can argue ownership is an illusion generated by the causal link.
  *   **Verdict:** **Awkward but survivable.** This is explainable via *viparyāsa* (inversion/error). It feels like a bug, but your view claims it's a feature of the delusion you are trying to expose.

  #### 5. The "Fire and Fuel" Dilemma (Textual)
  *   **The Argument:** In MMK Ch. 10, Nāgārjuna asks: Is the fire the fuel? Is it other than the fuel? If the "person" is strictly discrete moments, is the karma of $M_1$ the same as the experience of $M_2$? If different, karma is lost. If same, permanence is asserted.
  *   **Exposure:** Medium.
  *   **Verdict:** **Manageable via Conventional Truth.** You can concede that karma works only at the level of *samvṛti* (convention).

  ---

  ### Part 3: Ranking the Defeaters

  Here is the honest triage, ranked from "View Collapse" to "Theoretical Cost."

  #### **Tier 1: Fatal (Collapses the View)**
  1.  **Madhyamaka Reification of the Moment:**
      *   *Why:* This is the metaphysical kill-shot. Stream-pluralism posits "discrete, causally-conditioned momentary configurations" as the ontological reality behind the convention. Madhyamaka argues that anything dependently originated lacks intrinsic nature. If the moments are the "real" things, they must be independent to be real, but they are conditioned. If they are conditioned, they are empty. You cannot build an ontology out of empty moments and claim *that* is the ultimate truth. It turns *anatta* into *atomism*.
      *   *Defense:* None available within the system. You must retreat to Madhyamaka emptiness of the moments themselves, which dissolves the "pluralism" into pure emptiness.

  2.  **The Binding/Integration Problem:**
      *   *Why:* Cognitive science and phenomenology agree: consciousness has a "grain," but it is not point-like. It is a window. If your "momentary person" is smaller than the window, you cannot account for the experience of the window itself without a meta-observer. If the "momentary person" *is* the window (e.g., 3 seconds), then you have a persisting entity for 3 seconds, which invites the question: why does it cease? What divides one 3-second person from the next? The boundary becomes arbitrary.
      *   *Defense:* You would have to deny the phenomenology of duration (claiming motion is an illusion), which contradicts direct perception (*pratyakṣa*), a valid means of knowledge in Buddhism.

  #### **Tier 2: Severe (Requires Major Revision)**
  3.  **Causal Contact (The Ceased Cause):**
      *   *Why:* If $M_1$ is literally not identical to $M_2$ and has ceased, the causal link is severed. Standard Abhidharma uses the *santāna* to bridge this. By denying the *santāna* even conventional reality, you make causation inexplicable.
      *   *Concession:* You must admit that *santāna* has a higher status than "purely conventional." It must be *causally* real, even if *ontologically* empty. This pushes you back toward standard Yogācāra/Sautrāntika, losing your "pluralist" innovation.

  #### **Tier 3: Awkward (Theoretical Cost)**
  4.  **Memory Ownership:**
      *   *Why:* It feels counter-intuitive that $M_2$ claims $M_1$'s memories.
      *   *Concession:* Bite the bullet. Admit this is the mechanism of delusion. The feeling of ownership is the error (*viparyāsa*) that the practice eliminates. This is actually a strength of your view: it explains *why* we feel like selves (causal proximity) while denying we are them.
      *   *Status:* **Survivable.**

  5.  **Soteriological Coherence:**
      *   *Why:* If no one persists, who gets enlightened?
      *   *Concession:* Retreat to *samvṛti*. Enlightenment is the cessation of the causal chain of ignorance. It doesn't happen *to* a person; it is the stopping of the process.
      *   *Status:* **Survivable.** This is standard Buddhist doctrine anyway.

  #### **Tier 4: Dismissible (Assumes the Self)**
  6.  **Intuitions of Bodily Ownership:**
      *   *Why:* "I feel this is *my* body."
      *   *Dismissal:* This is exactly what *anatta* is meant to deconstruct. Using the intuition of ownership to argue against a theory of no-self is question-begging.
      *   *Status:* **Irrelevant.**

  ---

  ### Part 4: Strategic Recommendations for the View

  If you want to defend "Stream-Pluralism" without it collapsing into Tier 1 fatal objections, you must make two critical adjustments:

  1.  **Adopt a Two-Truths Strategy on the Moments:** You cannot claim the momentary configurations are *ontologically* real. They must be empty (*śūnya*) as well. If they are empty, in what sense are they "discrete"? You must argue they are *conventionally* discrete but *ultimately* inseparable. This moves you closer to Madhyamaka and away from Abhidharma realism.
  2.  **Reintroduce the *Ālaya-vijñāna* (or equivalent):** To solve the Binding/Integration problem (Tier 1), you need a mechanism that spans the integration window without being a "self." The Yogācāra *storehouse consciousness* was invented specifically to solve the problem you are facing: how to maintain continuity and karmic seeds without a permanent self. Denying the *santāna* entirely leaves you with no bridge. You don't need to call it a "self," but you need a functional continuity that is more than just "loose coupling."

  **Final Verdict:**
  As it stands, **Stream-Pluralism is metaphysically unstable.** It tries to be more radical than Abhidharma (by dissolving the stream) but retains Abhidharma realism (by reifying the moments).
  *   **To survive:** It must concede that the "stream" (*santāna*) is a necessary conventional truth with causal efficacy, not just a label.
  *   **To thrive:** It must accept the Madhyamaka critique that the moments themselves are empty, turning the view from an ontology of "many things" into a phenomenology of "no things."

  The strongest defeater is not moral or intuitive; it is the **Reification of the Moment.** If the moment is real, *anatta* is incomplete. If the moment is empty, the "pluralism" dissolves.
