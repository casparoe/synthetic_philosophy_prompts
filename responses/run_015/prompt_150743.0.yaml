  The argument fails at Step (3), which defines the function of moral emotion exclusively as maintaining orientation toward the wrong, thereby excluding restoration. This step looked fine because it safeguards against moral licensing, ensuring that wrongdoing is not treated lightly or commodified as a mere transaction. By framing dischargeability as a defect, it captures the intuitive fear that guilt allows agents to "pay off" their sins and return to business as usual without genuine moral growth.

  However, this definition is incomplete because it ignores the necessity of reintegration for sustained moral agency. A moral culture that never allows closure risks collapsing agents into hopelessness, particularly given shame's incurability described in Step (2). Repairing (3) to acknowledge that moral emotions also function to restore relationships and agency removes the defect attributed to guilt in Step (4) and undermines the superiority claim in Step (5). Discharge becomes a feature of moral repair rather than a loophole for pricing wrongs.

  Once repaired, the argument still establishes the descriptive distinction between guilt and shame (Steps 1 and 2) and validates the internalization of shame (Step 6). It fails, however, to support the normative conclusion (Step 8), leaving us with a choice between emotions based on balanced values—such as fidelity, sustainability, and mental health—rather than fidelity alone. The descriptive insights remain, but the prescription to cultivate shame at the expense of guilt collapses.

  | Step | Verdict | Diagnosis | Why it looked fine | Cost | Downstream |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Keep as stated | valid | Captures standard phenomenology of guilt. | None. | 4, 5 |
  | 2 | Keep as stated | valid | Captures standard phenomenology of shame. | None. | 5, 8 |
  | 3 | Reject | false or unsupported empirical claim | Guards against moral licensing/commodification. | Lose the clean critique of guilt's closure. | 4, 5, 8 |
  | 4 | Reject | conflation of two distinctions | Plausible that some penalties function as prices. | Lose the claim that guilt incentivizes wrongs. | 5, 8 |
  | 5 | Reject | false or unsupported empirical claim | Faithfulness to wrong seems morally serious. | Lose the claim that shame tracks better. | 8 |
  | 6 | Keep as stated | valid | Correctly notes shame can be internalized. | None. | 8 |
  | 7 | Keep with repair | false or unsupported empirical claim | Plausible that cultural focus shifts resources. | Must admit cultures can blend emotions. | 8 |
  | 8 | Reject | missing premise | Follows logically if fidelity is the only value. | Lose the policy recommendation. | None |
  | Bottom line | Reject (8). | Missing premise regarding value weighting. | | | |
