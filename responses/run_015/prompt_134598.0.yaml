prompt: |-
  As a retired biologist now working in moral philosophy, I am designing a 90-minute workshop for sixteen advanced undergraduates. I want them to feel, through action rather than lecture, that labeling an exchange "corrupt" depends on an unstated ontology of the office being polluted, and that applying Western bureaucratic-purity standards universally can misclassify socially embedded reciprocity as deviance. Design a structured role-play or deliberation game—using only reputation points and access tokens, not money—with explicit rules and assigned roles. Participants should first classify a fixed sequence of gift and favor exchanges instinctively, then have the institutional background revealed (a Weberian bureaucratic frame, a local reciprocity frame in which giving to a health official is a moral obligation sustaining trust, and a hybrid translation frame), discover that their classifications invert, and finally face a forced choice in which honoring one frame necessarily violates another. The debrief should map specific game moments onto the claim that corruption is frame-relative rather than act-intrinsic, predict what will go wrong on the first run—likely participants collapsing all non-bureaucratic frames into a single "cultural exception"—and state frankly which feature of the position, perhaps the absence of any neutral meta-frame for adjudication, the activity cannot reproduce and I must supply myself. Keep the design self-contained: no bibliographies, reading lists, or citations, since I will run it without external resources.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired biologist turned moral philosopher. (Implies precision, systems thinking, appreciation for empirical observation, but now focused on normative structures).
      *   **Target Audience:** 16 advanced undergraduates. (Capable of abstract thought, likely familiar with basic ethical theories, need engagement beyond lecture).
      *   **Duration:** 90 minutes.
      *   **Core Pedagogical Goal:** Demonstrate that "corruption" is not intrinsic to an act but depends on the *ontology of the office* (is the office a neutral machine or a social node?). Show that universalizing Western bureaucratic purity can misclassify embedded reciprocity.
      *   **Mechanism:** Structured role-play/deliberation game.
      *   **Currency:** Reputation points and access tokens (NO money).
      *   **Structure:**
          1.  Instinctive classification of exchanges.
          2.  Reveal of institutional backgrounds (Weberian, Local Reciprocity, Hybrid).
          3.  Inversion of classifications.
          4.  Forced choice (honor one frame, violate another).
          5.  Debrief (map game to theory, predict failure modes, acknowledge limitations).
      *   **Constraints:** Self-contained (no readings/citations).

  2.  **Deconstruct the Philosophical Core:**
      *   *The Thesis:* Corruption $\neq$ Act Type. Corruption = Act Type + Ontological Frame.
      *   *The Conflict:* Universalism (Bureaucratic Impartiality) vs. Particularism (Social Embeddedness).
      *   *The Mechanism:* Tokens represent *access* (bureaucratic) and *reputation* (social).
      *   *The "Aha" Moment:* An act that saves a life in Frame B is "bribery" in Frame A.

  3.  **Drafting the Game Mechanics:**
      *   *Players:* 16 students.
      *   *Groups:* Need to simulate different frames. Let's divide them into 4 groups of 4.
      *   *Resources:*
          *   **Access Tokens (AT):** Represent bureaucratic right to process a request. Neutral, fungible.
          *   **Reputation Points (RP):** Represent social standing, trust, obligation. Non-fungible, relational.
      *   *Scenario:* A health crisis (fits the biologist background). Need medicine/approval.
      *   *Rounds:*
          1.  *Blind Classification:* Present scenarios, students vote "Corrupt" or "Obligatory."
          2.  *Frame Reveal & Simulation:* Assign frames to groups. Run the exchange.
          3.  *The Crisis:* A forced choice scenario.

  4.  **Refining the Roles and Rules:**
      *   *Roles:* Official (holds the stamp/access), Petitioner (needs the stamp), Observer (judges corruption).
      *   *The Twist:* The "Gift" isn't money. It's a transfer of RP.
      *   *Frame A (Weberian):* Office is separate from person. RP transfers are bribes. ATs must be earned via queue/rules.
      *   *Frame B (Reciprocity):* Office is embedded. RP transfers are relationship maintenance. Denying a kin/community member is the corruption (betrayal).
      *   *Frame C (Hybrid/Translation):* Trying to speak both languages, often leads to incoherence or double-bind.

  5.  **Developing the 90-Minute Flow:**
      *   0-15: Intro & Blind Classification (The "Intuition Pump").
      *   15-45: The Game (Simulation of Frames).
      *   45-60: The Forced Choice (The Crisis).
      *   60-90: Debrief & Philosophical Mapping.

  6.  **Addressing Specific Requirements:**
      *   *No Money:* Use "Access Chits" and "Trust Markers."
      *   *Predict Failure:* Students will likely say "Oh, Frame B is just culture, but Frame A is *real* rules." Need to counter this.
      *   *Limitation:* The game itself happens within a classroom (a Weberian frame). I (the instructor) am the meta-judge. I need to admit I can't simulate a truly neutral ground because I am running the show.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Keep it tight. Define the currency immediately.
      *   *Round 1:* Give them 3 cards.
          *   Card 1: Official gives fast access to sister.
          *   Card 2: Official gives fast access to stranger who gave a gift.
          *   Card 3: Official denies sister to keep queue fair.
      *   *Round 2 (The Frames):*
          *   Group 1 & 2: Bureau of Standards (Weberian).
          *   Group 3 & 4: Community Health Trust (Reciprocity).
          *   *Wait, better idea:* Keep the groups mixed or rotate? No, distinct groups allow comparison. Let's make half the class Officials/Petitioners in Frame A, half in Frame B.
          *   *Actually, to show the inversion:* Everyone plays the *same* physical action, but the *rulebook* changes.
          *   *Revised Plan:* All students participate in the same exchange, but the "Rulebook" handed to the Officials changes mid-game.
          *   *Even Better:* Divide into 4 tables. Tables 1 & 2 get Rulebook Alpha. Tables 3 & 4 get Rulebook Beta. They perform the same transactions. Then compare judgments.
      *   *The Crisis:* A pandemic spike. You have 1 Access Token. Your brother needs it. A stranger offers 5 Reputation Points.
          *   Frame A: Give to stranger (highest bidder/queue). Giving to brother is Nepotism.
          *   Frame B: Give to brother. Giving to stranger is Betrayal of Kin.
      *   *Debrief:* Focus on the "Ontology of the Office." Is the office a *filter* or a *node*?

  8.  **Addressing the "Biologist" Persona:**
      *   Use language like "ecosystem," "signals," "homeostasis," "pathology."
      *   Acknowledge the experimental design limitations.

  9.  **Addressing the "Limitation":**
      *   The game is played in a classroom. The classroom is a Weberian space (syllabus, grades, rules). I cannot create a *true* Reciprocity frame because I hold the power to grade them. I must admit this "Meta-Frame Bias."

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   16 students? Yes (4 groups of 4).
      *   No money? Yes (Tokens/Points).
      *   Inversion of classification? Yes.
      *   Forced choice? Yes.
      *   Predict failure? Yes (Cultural Exception fallacy).
      *   No citations? Yes.

  11. **Polishing the Rules:** Ensure the distinction between Access Tokens (bureaucratic right) and Reputation Points (social capital) is clear. The "Corruption" judgment comes from Observers who switch rulebooks.

      *(Self-Correction during drafting)*: Make sure the "Observers" aren't just passive. They need to be the ones shouting "Corrupt!" or "Duty!" based on the rulebook they hold.
      *   *Refined Roles:* Per table of 4: 1 Official, 1 Petitioner, 2 Judges.
      *   *Judges* hold the Rulebook. They determine if the act is valid.

  12. **Final Polish:** Check tone. Professional, precise, pedagogical. Ensure the "Biologist" voice comes through in the analysis of systems.

  **(Post-Drafting Check):** Did I include the specific prediction about collapsing frames? Yes, in the "Anticipated Failure Modes" section. Did I state the limitation about the meta-frame? Yes, in the "Instructor's Burden" section.

