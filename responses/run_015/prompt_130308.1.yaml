answer: |-
  **1. The Harm Principle and the Empirical Wager**
  **Question:** You exclude those you judge not yet of age from the protection of the Harm Principle. Is this exclusion a principled moral boundary, or merely that principle applied with different empirical beliefs about their stagnation?
  **Expected Reply:** It is a distinction of capacity, not of right; liberty is only a principle for those capable of being improved by free discussion. To force a people to be free before they comprehend freedom is not liberty, but a dereliction of the duty to improve them.
  **Follow-up:** If those empirical beliefs about their stagnation prove false, does the despotism become unjust from the start, or merely a mistaken policy requiring correction?
  *[Monologue Flag: This answer captures the core philosophical tension of the protagonist.]*

  **2. The Examiner's Monopoly**
  **Question:** Under your scheme, the tutor sets the syllabus, administers the examination, and marks the paper. What specific evidence would compel you to conclude that the schooling has failed and that Britain should go?
  **Expected Reply:** We should withdraw when the pupils demonstrate a capacity to maintain order and justice without our compulsion. Until they can sustain the institutions we have built, the examiner must remain to ensure the lesson is not unlearned.
  **Follow-up:** And if the disorder arises specifically from the presence of the examiner, do you count that as a failure of the pupil or a flaw in the test?
  *[Deflection Flag: Mill is likely to deflect here by calling this a "question of fact" regarding the specific state of Indian society rather than a principled limit. **Reformulation:** "Do not tell me of the facts of India, Mr. Mill; tell me of the structure of your logic. If the tutor alone defines success, is there any possible score that constitutes a failure?"]*

  **3. The Structural Conflict of Interest**
  **Question:** Your administrators owe their vocation, their standing, and their sense of usefulness to the tutelage continuing. Does the doctrine contain a brake on its own perpetuation, or is it a machine that must run until it breaks?
  **Expected Reply:** The conscience of the servant must be tied to the end of improvement, not the means of employment. A true utilitarian calculates the happiness of the governed, not the tenure of the governor.
  **Follow-up:** But when the end renders the means obsolete, which does the servant naturally preserve: the happiness of the subject or the purpose of his own life?

  **4. The Pedagogical Experiment**
  **Question:** You were the subject of the century's most deliberate pedagogical experiment, trained by your father to be a living engine of reason. What element of that pressure would you refuse to repeat on a nation?
  **Expected Reply:** The isolation from common sentiments was a heavy price, and I would not wish a whole people to be severed from their past to serve a rational future. Yet without that severance, the weight of custom crushes the individual mind before it can grow.
  **Follow-up:** Then you admit the improvement you offer requires a wound to the spirit of the people; is the healing certain enough to justify the cutting?
  *[Monologue Flag: This reveals the personal cost of the ideology, suitable for a reflective scene.]*

  **5. The Transfer to the Crown**
  **Question:** The transfer of 1858 placed India under a ministry answerable to an electorate that does not include the governed. Is this not precisely the tyranny of prevailing opinion you feared at home?
  **Expected Reply:** It risks substituting the ignorance of the public for the knowledge of the Company, which is a grave deterioration. Yet a Parliament may be taught, whereas a Court of Proprietors is motivated only by dividend.
  **Follow-up:** If the Parliament learns only that India is a burden, will they not cast it off for reasons of economy rather than principles of liberty?

  **6. Non-Intervention and the Third Category**
  **Question:** In *A Few Words on Non-Intervention*, you describe a people who cannot stand alone. Can a people cross out of that category by their own efforts, or must they be lifted?
  **Expected Reply:** They may struggle, but without the discipline of a superior mind, the struggle is often in vain and ends only in a change of masters. The hand that lifts them must remain on their shoulder until we say it may be removed.
  **Follow-up:** So the moment of independence is not a right they claim, but a gift you grant; what if they seize it before you offer it?

  **7. The Concrete Case (The Outbreak)**
  **Question:** An officer faces an outbreak that is at once anti-reform and anti-foreign, and must decide within a week whether to suppress it. Does his conviction that he is shortening the tutelage redeem the act, or is it the most dangerous thing about it?
  **Expected Reply:** It redeems the intention, but not necessarily the consequence if it breeds a hatred that outlasts the rebellion. The improvement test demands we look to the long habit of obedience, not the immediate quiet of the district.
  **Follow-up:** If the long habit of obedience is secured only by the memory of that suppression, was the improvement real, or merely the silence of the grave?

  **8. The Enemy of Custom**
  **Question:** You argue custom is the enemy of improvement, yet the stability you seek in India is built upon the very customs you wish to erode. Can you build a liberal state on the rubble of traditional society?
  **Expected Reply:** We do not seek rubble, but a foundation of reason where custom once stood unchallenged. Stability without progress is merely the stillness of a stagnant pool, which breeds disease.
  **Follow-up:** And who is to judge which customs are the foundation and which are the disease, if not the foreigner who stands outside the pool?

  **9. The Tool of Language**
  **Question:** You taught them English to let them think, but if they think in English and conclude you must leave, is the lesson learned or the tool misused?
  **Expected Reply:** If they conclude we must leave because they are capable of self-government, then the tool has been used exactly as intended. We do not teach them to love Britain, but to love liberty.
  **Follow-up:** But if they use that liberty to restore the customs you sought to erase, was the education a success or a failure of your utility?

  **10. The Definition of Improvement**
  **Question:** You speak of improvement as a universal good, but is it possible a people might choose a different good that looks like stagnation to you?
  **Expected Reply:** They may choose it, but they cannot choose to be happy in ignorance any more than a man can choose to be healthy while ignoring medicine. The capacity for higher pleasures is the only measure of a civilization's worth.
  **Follow-up:** And if they reject those higher pleasures, do you force them to be happy, or do you admit your universal good is merely a local preference?
