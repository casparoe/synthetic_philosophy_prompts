      *Wait, one more check:* The user said "Keep any scoring of the live candidate families to a short paragraph each, described by their structural claim rather than by name." I need to make sure I don't use labels like "Non-reductive physicalism" but rather "The view that identifies mental tokens with physical tokens..." etc. Actually, structural descriptions are better: "Token Identity," "Property Dualism with Nomological Connections," etc. I will use structural descriptions.

      *Refining the "Purpose":* The user wants to vindicate *reasons* explaining *action* for *responsibility*. This means the "Mental" isn't just any internal state, it's the *Rationalizing* state. This is a key filter.

