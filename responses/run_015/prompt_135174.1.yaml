      *   Does this lower the Red count?
      *   This simulates the "Voting/Boycott" signal.

  9.  **Predicting Failures (Debrief Prep):**
      *   *The Calculator:* "But my EV was still positive!" -> Address in debrief (Rule utilitarianism vs Act).
      *   *The Principled Refuser:* "I won't play a game about harm." -> Acknowledge validity, ask them to observe.
      *   *The "It's Just a Game" Crowd:* -> Address the stakes (real money) and the structural isomorphism.

