          1.  Distinguish: "No difference made" vs. "Can't tell if difference made" vs. "Overdetermination."
          2.  Shapley Value intuition: Threshold games where everyone contributes but no one is pivotal, yet responsibility is shared.
          3.  Social/Signaling Channel: How my choice influences others (norms/ripples).
      *   **Constraints:** Index cards, box, whiteboard, 90 mins. No phones/laptops. Real but tiny stakes (facilitator pays/inconveniences self). No deception preferred (or admit cost if used).
