      *   *Critique:* This feels like a standard public goods game. It doesn't force the "I made no difference" realization viscerally.
      *   *New Idea:* **The "Box of Coins" Mechanism.**
      *   We need physical causality.
      *   Facilitator has a box. It opens only if weight > X.
