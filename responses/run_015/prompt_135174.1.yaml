      *   They will try to game it.
      *   They will calculate pivot probability.
      *   *Counter:* The random counting order makes pivot probability ex-ante identical for everyone, but ex-post unknowable for the overdetermined.
      *   *Constraint:* "No phones." Good.
      *   *Constraint:* "Some compute, some don't." The game must work intuitively.

