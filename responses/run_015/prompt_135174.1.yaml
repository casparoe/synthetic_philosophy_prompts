      *   *Let's pivot to the specific philosophical points.*
      *   *Point 1 (Causal Pivotality):* I need a scenario where you contribute, the threshold is met, but you weren't the one who tipped it.
      *   *Point 2 (Shapley):* I need to show that even if you weren't pivotal, you get credit/blame.
      *   *Point 3 (Social):* I need a round where your choice is visible and influences the next round.

      *   *Revised Game Structure: "The Carbon Ledger"* (Abstracted).
      *   **Setup:** 20 Participants. 3 Rounds.
      *   **Stakes:** Facilitator has an envelope with $100.
      *   **Goal:** Maximize the payout to a charity chosen by the group.
