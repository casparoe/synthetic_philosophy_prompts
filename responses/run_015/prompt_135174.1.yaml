      *   Let's stick to:
          *   Round 1: Blind/Secret (The Causal/Epistemic problem).
          *   Round 2: The "What If" (The Shapley problem) - Facilitator runs a thought experiment on the whiteboard using Round 1 data.
          *   Round 3: Public Pledge (The Social problem).
      *   This saves time and ensures the mechanics don't get bogged down.

      *(Final check on Stakes)*: Facilitator keeping the money if they fail might be misinterpreted as "Facilitator wants us to fail."
      *   *Fix:* If they fail, Facilitator donates to a *less effective* charity (e.g., local art fund vs Global Health). Or simply: "If we succeed, I donate $100 to Charity A. If we fail, I donate $0." The "Harm" is the lost opportunity. This is cleaner ethically.
      *   *Wait, prompt says "Collective Harm".*
      *   Okay, I will frame it as "The Pot is for Charity. If you breach the threshold, the Pot is destroyed." (Tear the check). This is a loss.

      *(Final check on Deception)*: The prompt says "tell me honestly if deception is what makes it work".
      *   The "Random Draw" is not deception, it's a mechanism.
      *   I will avoid deception.

      *(Final check on "Shapley")*: How to make them *feel* the Shapley value?
      *   In the debrief, I need to show that *every* Red player reduced the "margin of safety" by 1.
      *   I will add a specific prompt in Round 2 for this.

      *(Final check on "Social")*: Round 3 needs to show that my Blue card might inspire *two* other Blue cards.
      *   I will add a rule: "If you play Blue, you may write a note to the group."

      Okay, ready to write.
answer: |-
  # Workshop Design: The Threshold Box

  **Goal:** To viscerally demonstrate the gap between *causal pivotality*, *epistemic uncertainty*, and *shared responsibility* in collective action problems, without using philosophical jargon until the debrief.
  **Time:** 90 Minutes
  **Participants:** 18–24
  **Stakes:** You (the facilitator) have an envelope containing a **$100 check** made out to a charity the group selects (e.g., a GiveWell top charity).
  *   **Success Condition:** The group keeps the "Carbon Count" below a threshold. You donate the $100.
  *   **Failure Condition:** The group exceeds the threshold. You tear up the check in front of them. (The "Harm" is the destruction of $100 of value).
  *   **Private Incentive:** Each participant who submits a "Red" card gets one ticket into a raffle for a **$10 chocolate bar**. (This creates a tiny tension between private gain and public good).

  **Materials:**
  *   1 Envelope with the $100 check.
  *   1 Opaque box (shoebox with lid).
  *   Index cards (2 per person): One side marked **RED**, one side **BLUE**. (Or two stacks of cards).
  *   Whiteboard and markers.
  *   Raffle bowl and slips of paper.
  *   A timer.

  ---

  ## Part 1: Setup (10 Minutes)

  1.  **The Stakes:** Place the envelope on the table. Tell them: *"This is $100 for [Charity X]. It will be donated at the end of this session if and only if the group succeeds in the games we are about to play. If we fail, I tear it up. No money comes out of your pockets. Your only private incentive is a raffle for a chocolate bar."*
  2.  **The Rules:**
      *   **Red Card:** Adds **1 point** to the "Carbon Count." Gives you **1 raffle ticket**.
      *   **Blue Card:** Adds **0 points** to the "Carbon Count." Gives you **0 raffle tickets**.
      *   **Threshold:** The "Tipping Point" is **12 Points**.
      *   **Process:** Cards go into the box. You will draw them one by one.
  3.  **The Silence Rule:** *"Until the end of Round 3, you may not discuss your strategy with anyone. You may not signal. Write your choice, fold the card, put it in the box."*
  4.  **Distribution:** Hand out cards. Give them 2 minutes to decide.

  ## Part 2: Round 1 — The Blind Overdetermination (20 Minutes)

  **Objective:** Force the distinction between "I made no difference" and "I don't know if I made a difference."

  1.  **Collection:** Collect all cards in the box. Shuffle them thoroughly.
  2.  **The Count:** Draw cards one by one. Write the running total on the whiteboard.
      *   *Facilitator Note:* Ensure the threshold is breached comfortably. If you have 20 people, you expect ~15-18 Reds based on the raffle incentive. The threshold is 12.
  3.  **The Stop:** As soon as the count hits **12**, stop drawing. Hold the box up.
      *   Say: *"The threshold is breached. The check is void."* (Do not tear it yet; keep the tension).
      *   Say: *"The cards remaining in this box did not causally change the outcome. The outcome was determined by the first 12 Red cards drawn. The rest were inert."*
  4.  **The Reveal:** Ask everyone who played Red to raise their hands. (Likely 15+ people).
      *   Say: *"Look at your hands. There are [X] of you. Only 12 were needed to kill the donation. Statistically, at least [X-12] of you made **zero causal difference** to the outcome. Your card was in the box, but it was not among the 12 that triggered the loss."*
      *   *"You do not know if you were one of the 12 or one of the inert. But you know there is a high probability you did nothing."*
  5.  **Silent Reflection:** Give them 2 minutes of silence to write down: *Did you harm the outcome? Yes/No. Why?*
  6.  **Reset:** Return cards. Do not reveal who played what.

  ## Part 3: Round 2 — The Coalition Logic (20 Minutes)

  **Objective:** Force the Shapley intuition (shared responsibility) without naming it.

  1.  **The Setup:** *"We are going to run the exact same game. Same stakes. Same threshold (12). Same raffle."*
  2.  **The Twist:** Before they vote, draw a diagram on the whiteboard from Round 1's data.
      *   Draw 20 dots. Color 15 of them Red (based on the hand count from Round 1).
      *   Say: *"In Round 1, 15 of you played Red. The threshold was 12. Any group of 12 could have killed the donation. But also: **Any group of 4 switching to Blue would have saved it.**"*
      *   *"There was no single 'villain.' There were hundreds of different coalitions of 4 people who could have saved the $100. None of you coordinated."*
  3.  **The Vote:** Have them vote again (Secretly).
  4.  **The Count:** Draw cards again.
      *   *Likely Outcome:* People realize the futility of individual sacrifice if others don't coordinate. The count likely stays high or drops slightly.
      *   *If they save it:* Great. If they fail: Also great for the lesson.
  5.  **The Question:** Ask the group: *"In Round 1, many of you were causally inert. Yet, if **all** of you had played Blue, the donation would be safe. If **none** of you played Red, there is no harm. Where does the responsibility sit if no single person was pivotal?"*
      *   Allow 5 minutes of open discussion. Do not answer. Let them wrestle with "We did it, but I didn't."

  ## Part 4: Round 3 — The Signal (25 Minutes)

  **Objective:** Stage the social/normative channel (evidential decision making).

  1.  **The Setup:** *"Final round. Same stakes. One rule change: **Public Pledge.**"*
  2.  **The Mechanism:**
      *   Before writing their cards, ask: *"Who is willing to stand up and publicly declare they will play Blue?"*
      *   Wait for volunteers. (Usually 1–3 brave souls).
      *   Have them stand. They must say: *"I am playing Blue."*
      *   Then, everyone writes their card secretly and submits.
  3.  **The Count:** Draw and count.
      *   *Expected Dynamic:* The public pledge often triggers more Blues than just the pledgers (social proof/norm shifting), OR it triggers resentment (reactance).
  4.  **Final Outcome:** Tear the check if failed. Donate if succeeded. (Actually perform the action).

  ## Part 5: The Debrief (15 Minutes)

  **Objective:** Map the experience to the philosophical concepts. Do not lecture; ask and label.

  1.  **Labeling Round 1 (The Inefficacy Objection):**
      *   Ask: *"In Round 1, if you were one of the 'inert' Red cards, did you do wrong?"*
      *   **Concept:** This is the **Causal Null** argument ("My act changed nothing").
      *   **Concept:** This is the **Epistemic Uncertainty** argument ("I can't tell if I changed anything").
      *   *Point:* "You felt the pull to say 'It wasn't me' because the mechanism hid your pivotality. That is exactly how climate/voting works. You are almost never the 12th card."

  2.  **Labeling Round 2 (The Shapley Value):**
      *   Ask: *"If no one was pivotal, why did we lose the $100?"*
      *   **Concept:** **Joint Production.** The harm was produced by the *set*, not the *individual*.
      *   **Concept:** **Fair Share.** "If 15 people contribute to a harm that requires 12, dividing blame by 1/15 feels fairer than blaming only the 12th. That is the intuition behind the Shapley Value. It's not about causality; it's about membership in the sufficient set."

  3.  **Labeling Round 3 (The Social Channel):**
      *   Ask: *"Did the people who stood up change the outcome?"*
      *   **Concept:** **Evidential Decision Theory / Norm Shaping.**
      *   *Point:* "Your primary impact wasn't the -1 point on the counter. It was the probability that *someone else* switched from Red to Blue. In real life (voting, boycotts), this channel is often larger than the causal channel. If you vote and tell 3 friends, your 'share' of the outcome is much larger than 1/N."

  ---

  ## Predictable Failure Modes (And How to Handle Them)

  **1. The Calculator:**
  *   *Behavior:* Someone raises their hand in Round 1 and says, "But my expected value was still positive. The probability of being pivotal was 5%, times $100 is $5, which is less than the cost of the chocolate bar."
  *   *Response:* "You are correct on the math of *this* game. In this game, the private incentive was too high and the stakes too low. In the real world (climate/voting), the 'private incentive' (convenience) is small, and the 'collective stake' is massive. The math flips. But notice: even if your EV is positive, did you *feel* responsible when the check was torn? That tension is the ethical problem."

  **2. The Principled Refuser:**
  *   *Behavior:* Someone refuses to play because "It's just a game" or "I won't participate in a simulated harm."
  *   *Response:* "Thank you. Please observe. Your refusal is actually a data point for Round 3 (The Signal). If you had stood up and said 'I refuse,' would it have changed others? You are opting out of the causal chain, but you are still in the room." (Do not force them).

  **3. The "It's Just a Game" Crowd:**
  *   *Behavior:* After the check is torn, someone says, "It's just paper, you still have the money."
  *   *Response:* "I committed to this beforehand. The money is effectively gone from my budget. But more importantly: You didn't feel the loss. That is the problem with real-world collective harm. We don't *feel* the drought when we turn on the hose. This game was designed to make the harm invisible to you individually, just like reality."

  ## Limitations (What You Must Say Out Loud)

  In the final 2 minutes, you must disclose what the game *cannot* do, or the rationalists will tear it apart.

  1.  **The "One-Shot" Problem:** *"This was a one-off game. Real ethics is iterative. If we played this 100 times, you would learn to coordinate. Real life is 100 rounds, but the feedback loop is decades long. That delay is why the inefficacy objection feels stronger in reality."*
  2.  **The "Identity" Problem:** *"In this game, you are anonymous. In reality, you have a reputation. The fear of being seen as a 'defector' is a huge stabilizer that this game minimizes."*
  3.  **The "Deception" Note:** *"I did not deceive you about the mechanism, but I did manipulate the threshold to ensure failure in Round 1. I needed you to feel the loss to make the philosophy stick. In the real world, the loss is guaranteed if we all defect, but probabilistic if we don't."*

  ## Facilitator Cheat Sheet (For the "Shapley" Moment)

  If they get stuck on "But I wasn't pivotal!" in the debrief, use this script:
  *"Imagine a firing squad of 10 shooters. One bullet kills the prisoner. 9 miss. Did the 9 missers do nothing? They participated in an execution. If we blame only the one who fired the fatal shot, we imply the others were innocent bystanders. They weren't. They were shooters. The Shapley value says: You share the blame of the event you jointly authored, regardless of which bullet pierced the heart."*

  ## Logistics Check
  *   **Money:** Have the check ready. It must look real.
  *   **Box:** Ensure it's truly opaque.
  *   **Time:** Keep Round 1 tight. Do not let discussion bleed into the game rounds. The silence is part of the pressure.
  *   **Tone:** Be neutral. You are the "System," not the "Judge." Let the torn check be the judge.
