      *   *Nag 2 (Shapley):*
      *   In Debrief. "If 8 of you made no difference, why did the group fail?"
      *   "Because all 18 were necessary to create the *situation* where 10 were enough."
      *   "If any 9 of you had switched to Blue, the pot would be safe."
      *   "So responsibility is shared."

      *   *Nag 3 (Social):*
      *   Round 3: "The Pledge."
