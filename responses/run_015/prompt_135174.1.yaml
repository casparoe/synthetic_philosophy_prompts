      *   Structure: Overview, Materials, Setup, Rounds (1, 2, 3), Debrief (Mapping to Nags), Failure Modes, Limitations.
      *   Tone: Practical, direct, facilitator-focused.

      *(Self-Correction during drafting)*: Make sure the "Raffle" doesn't overshadow the $100. Keep the raffle tiny ($5 chocolate). The $100 donation is the main moral weight.
      *(Self-Correction on Round 2)*: Round 2 shouldn't just be talk. It needs a mechanic. Let's make Round 2 a "Replay" where they can discuss, but still vote secretly. This tests if the *understanding* of Shapley changes behavior without social pressure.
