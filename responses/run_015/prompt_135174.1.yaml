      *   **Wait, let's make it about "Claiming Share".**
      *   **Idea:** The "Shapley Value" is hard to feel. The "Pivotality" is easy to calculate. The "Social" is hard to stage.
      *   **Let's try a "Blind Threshold" Game.**
