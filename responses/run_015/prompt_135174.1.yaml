          *   *Outcome:* If Pot Survives, Facilitator donates it to a charity the group picks (e.g., GiveWell top). If Pot Dies, Facilitator puts it in their pocket (or burns it, but pocket is more "harm-like"). Let's say: Pocket. It creates a slight adversarial tension (Group vs Facilitator's Wallet) which makes the "Harm" real.
