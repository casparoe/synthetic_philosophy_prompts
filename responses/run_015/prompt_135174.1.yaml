      *   **Prep:** 24 Index cards (Red/Blue sides or two stacks). Box. Envelope with $100. Raffle bowl. Chocolate bar.
      *   **Intro (5 mins):** Set stakes. No theory.
      *   **Round 1 (20 mins):** Secret vote. Box. Random draw. Reveal count.
          *   *Scenario:* Ensure threshold is breached comfortably (e.g., threshold 10, 18 vote Red).
          *   *Effect:* Most people realize they weren't pivotal.
      *   **Round 2 (20 mins):** Discussion on Responsibility.
          *   Facilitator asks: "Who caused the loss?"
          *   Guide them to the "Any 6 could have saved it" logic.
      *   **Round 3 (25 mins):** The Social Round.
          *   Public voting or "pledge" phase.
          *   See if norms shift the outcome.
      *   **Debrief (30 mins):** Connect to philosophy.

      *   *Wait, I need to ensure Round 1 actually produces the "I made no difference" feeling.*
      *   If 18 vote Red and threshold is 10.
      *   Facilitator draws cards. 1, 2... 10 (Red). STOP.
      *   Facilitator says: "The 10th card killed it. The remaining 8 Red cards did nothing."
      *   Participants with Red cards think: "Was I the 10th? Or the 18th?"
      *   They don't know.
      *   *This creates the "Epistemic Uncertainty" (Can't tell) vs "Causal Null" (No difference).*
      *   *Crucial:* Do not reveal whose card was which. Just draw from the anonymized box.
      *   *Wait, if cards are anonymized, how do they get raffle tickets?*
      *   *Solution:* Two slips. One anonymous (for the count), one named (for the raffle).
      *   *This adds complexity.*
      *   *Simpler:* Just use the raffle as a minor incentive. The main stake is the $100 donation.
      *   *Actually, to make the "No Difference" point land:*
      *   After the threshold is hit, Facilitator stops counting.
      *   Facilitator says: "The rest of the cards in the box did not causally contribute to the loss."
      *   "If you put a Red card in, there is a chance you were one of the 'inert' ones."
      *   "Raise your hand if you played Red." (Most do).
