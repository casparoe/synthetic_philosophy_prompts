      Okay, I will ensure that is the very last thing.

      *One more check on the Surveyor Analogy:* The second source says "theorem is really about a shared map that real disputants simply don't have." This is a misunderstanding of Aumann. Aumann assumes a shared *prior* (the rules of probability and initial belief), not a shared *map* (the truth). The surveyor analogy suggests the *truth* is inaccessible. Aumann assumes the truth exists and agents update towards it. I need to point out this disanalogy clearly.

      *Final Plan:*
      1. Table mapping.
