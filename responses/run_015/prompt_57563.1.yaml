  Let's write.

  *(Word Count Check)*: I need to be careful not to be too concise. Dialogue can eat up words quickly. I will expand the exchanges on the "aging out" analogy and the "aesthetic pleasure" point to ensure I hit the 1200 minimum.

  *(Classification Check)*: Make sure they explicitly argue about whether it's "punishment" or "treatment."

