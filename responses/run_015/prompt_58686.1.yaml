      *   *Nuance on "Sincere":* In AI terms, "sincere" usually means "not hallucinating." I should clarify that distinction.
      *   *Nuance on Identity:* The "Turing Test" aspect. If it acts human, is it deception? The policy says no, unless asked. This is a specific legalistic stance (caveat emptor).
      *   *Gricean Details:* Specifically mention the Maxim of Quantity and Relation.

  7.  **Final Polish:** Ensure the tone is appropriate for a colleague (academic, precise, yet accessible for undergrads). Structure with clear headings for class preparation. (This matches the thought process to the final output).

  8.  *(Final check against prompt requirements)*:
