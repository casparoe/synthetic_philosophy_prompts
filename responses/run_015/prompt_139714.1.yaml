answer: |-
  Friends, colleagues, neighbors, and family. Thank you for being here.

  I stand before you as a retired cosmologist. For forty years, I measured a universe whose spatial extent no observation can settle. I used apparatus described by differential equations that quantify over a continuum. I never once had to decide whether any of that structure was really there. It was enough that the math worked, that the predictions held. In retirement, I joined a philosophy reading group, and that is where I finally met, as a set of arguments rather than as a mood, the literature my friend had been arguing with for forty years.

  He taught analysis at a small college. He was a convinced finitist. But we must be careful about what that means. He was not offering finitary metamathematics as a way of securing infinitary mathematics. He was not trying to save the house by reinforcing the foundation. He thought there are no infinite totalities at all. He believed Hilbert's Hotel describes nothing. He believed Cantor's diagonal argument, read as a claim about completed collections of natural numbers and reals, is not true rather than merely surprising. He never published any of it. It lived in letters, in a box of ring binders, and in an argument with a set theorist at a nearby university who liked him enormously, disagreed with him completely, and is giving the second talk of the day.

  I know many of you in this room take the actual infinite for granted. You work in a paradise you have no desire to leave. I know others of you knew him as the man who fixed your radios. You might wonder why any of this matters. It matters because he demanded that our words correspond to something that could, in principle, be done.

  There is a tension here, specifically for me. I spent a career treating the continuum as real. Was my work nonsense? I do not believe it was. But I believe my friend would have said I was drawing a map so detailed it claimed to be the territory. I was measuring relationships, not ontological truths. There is room in this world for both the mapmaker who uses the infinite as a tool and the philosopher who insists the tool does not exist outside the hand that holds it. We can honor his rigor without invalidating our work, provided we admit that our work is instrumental.

  I want to address one specific argument today, because he would have wanted us to get the details right. I have been trying to restage Hilbert's Hotel without a completed infinity. Imagine a hotel that is at every stage finite but unbounded. Or imagine a version in which guests move at successive half-intervals so that by the end of a minute everyone has shifted and the first room is free.

  I take a definite stand on this: the unbounded hotel cannot generate the original puzzle at all. The phrase "every room is occupied" is precisely what never comes true at a finite stage. If you stop the clock at any point, there is always a last guest. The paradox only arises when you assume the process completes. The supertask version quietly restores a completed infinite through the limit. It smuggles the very thing it claims to illustrate back into the premise. My friend was right to balk at the puzzle, but not because the logic fails. He was right because the premise describes no physical situation. The limit is a mathematical convenience, not a physical event.

  He also held something stricter, and this is where I am least sure I understand him, but where I must speak clearly. He balked not only at the actual infinite but at arbitrarily large finite numbers. If you handed him something like ten raised to the power ten raised to the power ten, he would say, only half in jest, that he did not know what you were asking him to imagine, since nothing in the physical world could ever write it down.

  This is a different and much more exposed position than the denial of infinite totalities. Conflating them is exactly how his view gets dismissed as crankery. So I must ask: can this stricter view even be stated without helping itself to the notion it denies?

  My view is that it cannot. To say "there is a largest number" or "large numbers are meaningless" requires quantifying over the very collection you are restricting. You need the concept of the infinite to define the boundary of the finite. However, this does not make his position false. It makes it a physical claim disguised as a mathematical one. He was not doing mathematics in the standard sense; he was doing physics of information. He was saying that beyond a certain threshold, a number is no longer a count of things, but a symbol of a count. That distinction is worth preserving, even if the language struggles to hold it.

  I cannot offer you the consolations this occasion normally licenses. I cannot say his theorems are immortal, because he did not believe in immortality. I cannot say truth outlives us, because he believed truth is tied to verification. I cannot say we owe him an immeasurable debt, because he would have asked us to measure it. I cannot quote the famous line about not being driven out of Cantor's paradise, because he believed there was no paradise, only the ground we stand on.

  So I will say this instead. We are finite creatures. We have a finite amount of time to argue, to listen, and to remember. He spent his life insisting that we respect those limits. Today, we respect them by being here. We honor him not by pretending his views were standard, but by acknowledging that he forced us to justify them. He made the infinite feel heavy. He made us feel the weight of the assumptions we carry lightly.

  That is a gift. It is not eternal. It is not infinite. It is here, in this room, for as long as we hold it. And for now, that is enough.

  ***

  **Note on the Text**

  I have attributed to him a form of strict finitism that blends the denial of actual infinity (classical finitism) with a skepticism of large finite numbers (often called ultrafinitism or strict finitism). I am confident in the distinction you provided: he rejected infinite totalities ontologically, not just methodologically. Where I am guessing is the coherence of his "large number" skepticism. In the speech, I take the stand that strict finitism *cannot* be stated without borrowing infinite concepts (quantifying over all numbers to deny some), but I frame this as a linguistic necessity rather than a logical refutation. This smooths over a difficulty he would have wanted stated: that his position may be linguistically self-undermining. I chose to validate the *physical intuition* behind his view rather than its logical formulation, to avoid dismissing him as incoherent while maintaining philosophical honesty. I avoided standard consolations about eternal truth, adhering to his constraint that such claims are shorthand for something finite.
