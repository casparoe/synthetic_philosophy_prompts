answer: |-
  **Setting:** *Coffee break, Market Design Workshop. A projector screen loops a dashboard: "Reservoir Level < Critical?" Current Price: 34. Volume: 0. Time at Quote: 14 days.*

  **A:** You're staring at the zero like it's a void. I'm telling you it's a signal. That maker is sitting at 34 because they've scraped satellite telemetry you and I don't have. Hayek was right: the price compresses the knowledge. Volume is secondary.

  **B:** Volume isn't secondary; it's the validity check. Milgrom and Stokey blew this up thirty years ago. With common priors and common knowledge of rationality, nobody trades unless they're hedging. If nobody hits that 34, it's not a market clearing price. It's cheap talk in the costume of a number. It's just the prior plus whatever bias the maker woke up with.

  **A:** That's why volume and informativeness come apart. Grossman–Stiglitz shows prices can't be fully revealing anyway, or nobody would bother digging for info. But I'm working on a mechanism to harden the quote. Call it *jury-duty clearing*. Periodically, the exchange drafts participants—maker included—and force-executes a small, size-capped trade at the posted quote.

  **B:** Forced trades? You're going to compel rational agents to swap assets against their will?

  **A:** To make the quote non-cheap-talk. If you know you might get drafted, you can't just post a lazy prior. You have to stand behind the number.

  **B:** Okay, but here's the kill shot. A maker facing random fills will shade back toward the prior unless the draft is provably independent of the event. If I think the draft probability correlates with the reservoir actually being low, I'll move my quote to protect myself. And you can never verify that independence, because the event state is hidden for three months. You're building a mechanism on an untestable assumption.

  **A:** Fair. You can't verify independence ex ante. But you're fixated on the mid-price. Under jury duty, the epistemic weight shifts from the *level* of the quote to the *spread*. If a maker knows they might be forced to hold inventory, they'll only keep the spread tight if they're confident. The risk exposure reveals the confidence, even if the mid drifts toward the prior to hedge the draft risk.

  **B:** *(Pauses, stirs coffee)* Okay, I'll concede the mid-price might become biased under that scheme. If the maker is hedging draft risk, the 34 isn't the true probability anymore. But if you shift the weight to the spread, you're admitting the price itself is no longer the epistemic object. The *width* is the signal.

  **A:** Exactly. The width tells you how much private info is being defended. But there's a second layer.

  **B:** Which is the Grossman–Stiglitz problem reproduced one level down. If I pay costs to acquire a private signal about the dam, and then I get drafted into a trade at a price that doesn't fully reflect my edge because of the cap, I've been taxed. The expected loss borne by a draftee is effectively a tax on holding private information. You destroy the incentive to dig up the satellite data in the first place.

  **A:** Unless the draft size is small enough that the information rent still exceeds the expected forced trade loss. You're assuming the tax wipes out the margin. But if the cap is tight, the maker still profits from their edge on the non-drafted volume, while the drafted volume guarantees honesty.

  **B:** *(Nods slowly)* I'll concede that if the cap is sufficiently small relative to the information advantage, the tax doesn't kill the incentive entirely. It just reduces the equilibrium amount of information production. But that's the crux, isn't it? You're trading off information *production* for information *verification*.

  **A:** Yes. Because right now, in this thin market, we have zero verification. I'd rather have a slightly noisier signal that I know isn't bluffing.

  **B:** But if the noise comes from the draft risk shading the price, you haven't solved the epistemology. You've just changed the source of the distortion from "no skin in the game" to "forced skin in the game."

  **A:** Maybe. But at least then we're measuring the cost of truth-telling, not the cost of nothing.

