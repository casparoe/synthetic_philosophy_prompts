prompt: |-
  I'm a journalist who covers science and ideas, and I somehow got talked into running a discussion session at my local library — mostly retired engineers and one or two grad students, sharp people but they haven't touched philosphy since high school. Next week I need them to actually understand the Dennett vs. Caruso disagreement on just deserts and punishment, not just memorize sides. Specifically, I want them to see why Dennett thinks moral responsibility survives as a kind of evolved control interface, and why Caruso thinks that framing makes retributivism literally incoherent rather than merely outdated.

  Plan me the explanation arc, not a script: what idea has to be in place before I even mention punishment? What's the single carrying case — probably a concrete sentencing scenario — that needs both a clear victim and an offender whose mental state is genuinely ambiguous, and what must it avoid being? I expect they'll think Dennett is excusing all crime, that Caruso wants to empty the jails into therapy camps, or that this is determinism versus free will part 47. Where exactly in the sequence do I head off each? What's one sharp closing question that proves they've grasped the structural conflict rather than just picked a team? And what should I openly refuse to explain — maybe the full compatibilist tradition or the neuroscience of decision-making — with a line that admits the gap without sounding dismissive? Keep it under 350 words, no bibliography, no citations, no further reading list — I'm working from memory and they can't search mid-session. Also I keep writing just deserts with one s; don't correct me, just roll with it.
