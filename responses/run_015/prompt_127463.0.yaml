  Use a drunk driving fatality as your carrying case. The victim is undeniable; the offender chose to drink but didn't intend death. Avoid premeditated murder (too malicious) or sleepwalking (too excused). This ambiguity forces them to weigh choice against causality.

  Head off misconceptions immediately when introducing each thinker. When introducing Dennett, clarify that he isn't excusing crime; he argues responsibility is an evolved control interface for reason-responsive agents. He keeps the prison, changes the why. When introducing Caruso, preempt the "therapy camp" fear. He supports incapacitation for safety, just not retribution. He removes the *hurt*, not the holding. Frame the debate not as determinism versus free will part 47, but as functional utility versus foundational coherence. Dennett says the interface works; Caruso says relying on it makes retributivism literally incoherent because you cannot deserve harm for causes you didn't start.

