answer: |-
  **Project Title:** Decomposing the Presumptuous Philosopher: Gauge Freedom, Priors, and the Residual Anthropics Disagreement

  **1. Research Question and Motivation**

  The "Presumptuous Philosopher" problem is the standard stress test for anthropic reasoning. In its canonical form, a philosopher is asked to choose between two theories of the world: $T_1$, which predicts a trillion observers, and $T_2$, which predicts a trillion trillion observers. The philosopher has no empirical evidence favoring one over the other aside from their own existence. Under the Self-Sampling Assumption (SSA), the philosopher remains agnostic (roughly 50/50). Under the Self-Indication Assumption (SIA), the philosopher becomes nearly certain they inhabit $T_2$, simply because there are more observers there to be them.

  This result is often treated as a *reductio* of SIA. However, this reaction assumes the disagreement is fundamentally about the correct principle of self-locating credence. My hypothesis is that this framing obscures the actual mathematical structure of the disagreement. I propose that the divergence between SSA and SIA is largely an artifact of two confounding variables: (1) implicit priors over world sizes, and (2) the normalization "gauge" used to assign measure to observers within a world.

  The central research question is: **Can the divergence between SSA and SIA in Presumptuous Philosopher cases be fully eliminated by aligning priors and observer measures, or does a substantive normative disagreement persist regarding updateless decision-making?**

  If the former is true, the decades-long debate over SSA vs. SIA is a verbal dispute about parameterization. If the latter is true, the core of anthropics is not about self-location at all, but about the temporal index of decision-theoretic evaluation (updateful vs. updateless). This project aims to distinguish these possibilities through formal modeling rather than intuition pumping.

  **2. Limitations of Existing Approaches**

  Current literature generally treats SSA and SIA as competing axioms. Proponents of SIA argue it avoids the "Doomsday Argument" implications of SSA; proponents of SSA argue SIA leads to the absurd certainty of the Presumptuous Philosopher. Both sides treat the resulting credences as fundamental outputs of the anthropic principle.

  A third camp, primarily from the decision-theoretic community (e.g., proponents of Updateless Decision Theory), argues that credences are the wrong level of analysis; we should only care about which policy maximizes expected utility. While compelling, this approach often bypasses the epistemic question entirely. It tells us what to *do*, but not whether the underlying probability assignments are equivalent under translation.

  None of these positions rigorously test whether SSA and SIA are mathematically isomorphic under a change of variables. Without this test, we cannot know if we are arguing about physics and epistemology or merely about how we label the measure space.

  **3. Methodology**

  This project will proceed over one semester in three distinct phases, moving from formalization to transformation to decision-theoretic stress testing.

  *Phase 1: Formal Reconstruction (Weeks 1–5)*
  I will construct explicit probability spaces for the Presumptuous Philosopher scenario under both SSA and SIA. Crucially, I will separate the "anthropic principle" from the "prior."
  *   Let $W$ be the set of possible worlds.
  *   Let $N(w)$ be the number of observers in world $w$.
  *   Let $P(w)$ be the prior probability of world $w$.
  *   Let $\mu(o|w)$ be the measure assigned to observer $o$ in world $w$.
  I will define SSA and SIA not as magical rules, but as specific constraints on $\mu$ and $P$. For example, SIA is often equivalent to a prior that scales with $N(w)$, while SSA fixes the measure per world regardless of $N(w)$.

  *Phase 2: The Gauge Transformation (Weeks 6–10)*
  I will attempt to construct a mapping function $f$ such that for any SIA model $M_{SIA} = \langle P, \mu \rangle$, there exists an SSA model $M_{SSA} = \langle P', \mu' \rangle$ where $P'$ and $\mu'$ are derived via $f$, yielding identical posterior credences for all self-locating propositions.
  This is the "gauge freedom" test. If I can show that $P(Theory | Existence)_{SIA} = P(Theory | Existence)_{SSA}$ simply by shifting the weight from the likelihood function to the prior, the anthropic principle itself is doing no work. I will use standard measure-theoretic tools to check for consistency across different world-size distributions.

  *Phase 3: Decision-Theoretic Injection (Weeks 11–15)*
  If Phase 2 succeeds (the models are isomorphic regarding credence), I will introduce betting scenarios to see if the isomorphism holds for action. I will apply Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) to both models.
  Crucially, I will test an "updateless" scenario: a case where the agent must commit to a policy *before* knowing their index. If the SSA and SIA models recommend different policies even after the gauge is fixed, the disagreement is substantive. If they recommend the same policy, the debate is merely about the most convenient bookkeeping method.

  **4. Addressing the Strongest Objection**

  The most significant objection to this project is that "gauge freedom" is trivial. A critic might argue: *Of course you can relabel priors to match posteriors. That is just Bayes' Theorem. This doesn't show the debate is empty; it shows that priors and likelihoods are underdetermined by data.*

  I will not dodge this objection; I will make it the pivot point of the research. The project does not claim relabeling is impossible; it claims that if relabeling *is* possible without cost, then the "Anthropic Principle" is not a distinct epistemic norm. However, if the relabeling requires priors that are arguably irrational (e.g., assigning vanishingly small prior probability to simple worlds solely to compensate for SIA), then the cost of the gauge shift reveals where the real normative disagreement lies. The project will explicitly quantify the "cost" of the transformation in terms of prior complexity or sensitivity.

  **5. Expected Outcomes and Failure Conditions**

  *Success:*
  1.  **Dissolution:** I demonstrate a rigorous mapping where SSA and SIA yield identical decisions, provided priors are adjusted. This would imply the field should stop debating anthropic principles and start debating prior justification.
  2.  **Localization:** I demonstrate that the mapping fails specifically in updateless contexts. This would locate the true disagreement in decision theory (time of evaluation) rather than epistemology (self-location).

  *Failure/Refutation:*
  1.  **Intractability:** The measure spaces for SSA and SIA prove fundamentally incompatible (e.g., one requires countable additivity where the other requires finite).
  2.  **Triviality:** The gauge transformation turns out to be unfalsifiable—it can fit any data by making priors arbitrarily weird. If I cannot establish a bound on "reasonable" priors, the equivalence is mathematically true but philosophically vacuous.
  3.  **Hunch Refuted:** I find a Presumptuous Philosopher variant where, even with aligned priors and measures, SSA and SIA yield divergent credences that cannot be attributed to updatelessness. This would confirm the standard view that the anthropic principle itself is substantive.

  **6. Scope Check and Feasibility**

  This proposal is scoped for a single semester. To ensure completion, I will impose the following constraints:
  *   **Finite Worlds Only:** I will exclude infinite universes and measure problems associated with eternal inflation. The Presumptuous Philosopher works with finite but large numbers, which is sufficient for the gauge test.
  *   **Classical Duplication:** I will avoid Everettian (quantum branching) interpretations. The logic of observer counting is distinct enough in classical duplication cases.
  *   **Decision Theory Limit:** I will not attempt to formalize full Functional Decision Theory (FDT). I will restrict the decision-theoretic analysis to the comparison of CDT and EDT on the generated models, as this is sufficient to detect updateless vs. updateful divergence.

  If the gauge transformation in Phase 2 proves more complex than anticipated, I will cut Phase 3's variety of decision problems and focus solely on the standard betting book for the Presumptuous Philosopher. The core contribution of this workshop paper is the formal decomposition of the credence function; the decision-theoretic application is secondary validation.

  **7. Conclusion**

  The SSA/SIA debate has stagnated because participants talk past one another regarding what the principles represent. By treating anthropic reasoning as a parameterization problem involving priors and measures, this project offers a way to dissolve verbal disputes and isolate the remaining normative core. Whether the result is a dissolution of the debate or a precise location of the remaining disagreement, the output will provide a clearer formal map for decision theorists entering the anthropics literature.
