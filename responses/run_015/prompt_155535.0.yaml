      *   *Misconceptions:* Ensure the "Stoicism" one is killed hard, as it undermines the philosophical point (if it's just mindset, pain is still intrinsically bad, they are just coping).
      *   *Check Question:* Make sure it forces them to choose between "Pain = Sensation" or "Pain = Sensation + Negative Reaction."

  11. **Final Polish:** (Self-Correction during drafting)
      *   *Wait, one nuance:* The user wants to know what idea must be in place *before* the sensory/affective split.
      *   *Answer:* The idea that "Pain" is a compound experience, not a simple atom. We need to establish that our *ordinary language* lumps two things together.
      *   *Refinement:* Start by asking them to describe pain. They will give location/quality (sensory) AND words like "unbearable/awful" (affective). This primes the split without using jargon.

  12. **Final Output Generation** (matching the requested structure).
      *   Order of operations.
