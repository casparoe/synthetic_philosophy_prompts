  **Scenario**

  A Steward governs an eternal civilization where generations are indexed one, two, three, and so on without end. The population size remains constant across all time and policies, ensuring no non-identity complications arise from the choice. The Steward must select one of two irreversible policies that determine well-being levels for every future person. Existence is guaranteed indefinitely; there is no risk of extinction or branching timelines. The choice is binding; no future generation can overturn the mandate. Option A demands a severe sacrifice from the initial generation to secure permanent gains for all successors. Option B grants a bounty to the initial generation but imposes a permanent relative decline thereafter. Well-being is measured on a cardinal scale bounded between zero and ten. The ethical conflict arises from how we weigh the immediate loss against the infinite stream of diminishing gains. This case isolates the temporal aggregation problem from uncertainty or population variability.

  **Numerical Specification**

  Let $u_A(t)$ and $u_B(t)$ denote well-being at generation $t$.
  Define Option B as the baseline: $u_B(t) = 5$ for all $t \ge 1$.
  Define Option A with an initial cost and harmonic decay benefit:
  $u_A(1) = 1$.
  $u_A(t) = 5 + \frac{2}{t}$ for all $t \ge 2$.
  All values lie within the required interval $[0, 10]$. The maximum value for A is 6 at $t=2$, and the minimum is 1 at $t=1$.
  Let $d(t) = u_A(t) - u_B(t)$ be the difference sequence.
  $d(1) = -4$.
  $d(t) = \frac{2}{t}$ for all $t \ge 2$.
  This structure ensures A is worse initially but better thereafter, with the advantage shrinking toward zero.

  **Three Verdicts**

  (a) Undiscounted summation evaluates the limit of partial sums $S_T = \sum_{t=1}^T d(t)$.
  $S_T = -4 + 2\sum_{t=2}^T \frac{1}{t} = -4 + 2(H_T - 1)$, where $H_T$ is the $T$-th harmonic number.
  Using the approximation $H_T \approx \ln T + 0.577$, we solve $2(\ln T + 0.577) - 6 > 0$.
  This yields $\ln T > 2.423$, so $T > 11.28$.
  The generation $N^*$ at which the cumulative sum flips is 11. For all $T \ge 11$, $S_T > 0$.
  Since the harmonic series diverges, $S_T \to \infty$. Verdict: A strictly better.

  (b) Exponential discounting uses factor $\delta = 0.9$, reflecting a standard social discount rate.
  The value is $V(\delta) = \sum_{t=1}^\infty \delta^{t-1} d(t) = -4 + \sum_{t=2}^\infty \delta^{t-1} \frac{2}{t}$.
  Using the identity $\sum_{t=1}^\infty \frac{x^t}{t} = -\ln(1-x)$, the sum term equals $\frac{2}{\delta}[-\ln(1-\delta) - \delta]$.
  $V(0.9) = -4 + \frac{2}{0.9}[-\ln(0.1) - 0.9] \approx -4 + 2.22[2.30 - 0.9] = -0.89$.
  Since the infinite sum is negative and every term added for $t \ge 2$ is positive, the partial sums increase monotonically toward this negative limit. Thus, B wins at every finite truncation. Verdict: B strictly better.
  There must exist some $\delta^* < 1$ where the verdict flips because $V(0) = -4$ and $\lim_{\delta \to 1} V(\delta) = \infty$.
  The determining equation is $-6 - \frac{2\ln(1-\delta)}{\delta} = 0$. The magnitude of $\delta^*$ is fixed by the ratio of the initial utility loss to the integrated discounted gain stream.

  (c) Average utilitarianism compares $L = \lim_{T \to \infty} \frac{1}{T} \sum_{t=1}^T d(t)$.
  $\frac{1}{T} S_T \approx \frac{2 \ln T}{T}$. As $T \to \infty$, this limit is 0.
  Both average limits exist and equal 5, making the difference zero. Verdict: exactly indifferent.
  A shift-invariant finitely additive measure applied to the difference sequence yields zero because the sequence converges to zero, which coincides with (c) since both methods ignore transient initial differences in the limit.

  **Diagnostics**

  The single structural feature driving the divergence is the harmonic decay rate of the advantage, proportional to $1/t$. This decay is slow enough to make the undiscounted sum diverge to infinity, securing victory for A under overtaking, but fast enough to ensure the average contribution vanishes, securing indifference under averaging. If the advantage follows a power law $1/t^p$, the range preserving all three verdicts is $0 < p \le 1$. If $p > 1$, the undiscounted sum converges; if the total sum is less than the initial cost of 4, A loses the overtaking verdict. If $p \le 0$, the average does not vanish, breaking indifference.
  Truncating the future at a large finite $N=10$ changes the overtaking verdict to favor B, since $S_{10} < 0$. Discounting continues to favor B. Changing the decay rate to $1/t^2$ causes the undiscounted sum to converge to approximately $-0.35$, causing A to lose the overtaking verdict as well. The infinite horizon and specific decay rate are jointly necessary for the tripartite split.

  **Adversarial Section**

  A defender of discounting argues the case assumes impossible commitment power over infinite time, rendering the infinite sum irrelevant. Real policies face extinction risk, which mathematically mimics discounting and validates B. This objection succeeds practically but fails theoretically within the stipulated infinite setting where existence is certain.
  An advocate for A objects that indifference violates Pareto dominance because A is better than B at every generation $t \ge 2$. Indifference treats the infinite tail of improvements as morally weightless. This defeats (c) as a complete theory, showing it ignores strict dominance in the infinite tail rather than merely being incomplete.
  Rawlsian Maximin leaves the case without a verdict favoring A. It focuses on the worst-off generation. Here, generation 1 under A has well-being 1, while every generation under B has well-being 5. Thus Maximin strictly favors B, regardless of the infinite future gains, demonstrating another rule that aligns with discounting against overtaking.

  **Honesty Clause**

  The construction rigs the decay rate to sit precisely on the boundary between convergent and divergent sums to force the overtaking victory. Real-world benefits rarely follow exact harmonic decay, making this specific trajectory an artifact of the model. Additionally, the assumption of an actually infinite future is a mathematical idealization; any physical civilization must end, which would collapse the overtaking advantage if the end comes before generation 11. Readers should treat the infinity as a limit concept for long time horizons, not a physical prediction, and acknowledge that the verdicts depend sensitively on the tail behavior which is empirically unknowable.
