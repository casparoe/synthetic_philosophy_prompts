      *   *CKR in Equilibrium:* In a "No-Run" Nash Equilibrium, it must be common knowledge that everyone believes the bank is solvent *and* that everyone believes everyone else will stay.
      *   *The Breakdown:* The run happens when the state of the world shifts from "Solvent" to "Insolvent" *or* when the *belief* about others' actions shifts. In epistemic terms, the "No-Run" equilibrium relies on a specific hierarchy of beliefs. The SVB case is interesting because the fundamentals *were* shaky (duration risk), but the *trigger* was informational.
      *   *Formal Models:*
