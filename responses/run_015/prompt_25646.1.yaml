answer: |-
  This is an exceptionally rich case study for a graduate seminar. The SVB collapse is arguably the cleanest real-world instantiation of a **Global Game with Endogenous Information Transmission** we have seen in decades.

  To answer your prompt precisely: The SVB run was not a breakdown in the *Common Knowledge of Rationality* (CKR) per se. In fact, the run occurred *because* CKR held. Depositors ran because they knew others were rational, knew others knew they were rational, and knew that rationality dictated withdrawing funds given the new information.

  The breakdown was in the **Common Knowledge of the State (Solvency)** and the **Common Knowledge of the Equilibrium Selection**. Prior to March 8th, the system was in a "Good" equilibrium sustained by the common belief that the bank was solvent. The epistemic shift was the transformation of private doubt into common knowledge of distress.

  Here is the analysis mapped onto the formal epistemic structures you are teaching.

  ---

  ### 1. The Formal Setup: A Global Game Framework

  To model this rigorously, we should move beyond the standard Diamond-Dybvig model (which often relies on sunspots) and use the **Carlsson & van Damme (1993) Global Game** framework, augmented with network signaling.

  *   **Players ($N$):** A finite but large set of institutional depositors (VC firms, startups, PE funds). Let us index them $i \in \{1, \dots, N\}$.
  *   **State of the World ($\theta$):** The fundamental liquidity/solvency of SVB. $\theta \in \mathbb{R}$.
      *   If $\theta > \theta^*$, the bank is fundamentally solvent.
      *   If $\theta < \theta^*$, the bank is fundamentally insolvent.
      *   *Crucially:* There is a region of "strategic uncertainty" where the bank is solvent *if* everyone stays, but insolvent *if* enough run.
  *   **Actions ($a_i$):** $a_i \in \{\text{Stay}, \text{Run}\}$.
  *   **Payoffs ($u_i$):**
      *   If Bank Survives: $u_i(\text{Stay}) = R$ (full deposit + interest), $u_i(\text{Run}) = D$ (deposit returned, loss of relationship/interest).
      *   If Bank Fails: $u_i(\text{Stay}) = 0$ (uninsured loss), $u_i(\text{Run}) = D$ (withdrawn before collapse).
      *   *Note:* SVB deposits were ~94% uninsured. This makes $D \gg 0$, creating a dominant strategy to Run if the probability of failure exceeds a very low threshold.
  *   **Signals ($s_i$):** Depositors do not observe $\theta$ directly. They observe a signal $s_i = \theta + \epsilon_i$.
      *   In standard Global Games, $\epsilon_i$ is private noise.
      *   In SVB, the signal structure became **public** via social media, collapsing the noise.

  ### 2. The Breakdown in the Iterated Knowledge Structure

  You asked: *At what point did depositors stop believing that other depositors were rational?*

  In epistemic game theory, we define the hierarchy of beliefs as:
  1.  $E$: The event "The bank is safe."
  2.  $K_i(E)$: Depositor $i$ knows $E$.
  3.  $K_i K_j(E)$: $i$ knows that $j$ knows $E$.
  4.  $CK(E)$: Common Knowledge of $E$ (everyone knows, everyone knows everyone knows, ad infinitum).

  **The Pre-Run Equilibrium (March 7):**
  The "Stay" equilibrium relies on $CK(\text{Safe})$. Even if I have a private worry ($K_i(\neg \text{Safe})$), I will Stay if I believe $CK(\text{Safe})$ holds among the group. I assume my private signal is noise because the common knowledge dictates safety.

  **The Breakdown Point (March 8, 4:30 PM PT):**
  SVB announces a $2.25 billion capital raise.
  *   **Signal:** This is a negative signal about $\theta$. In Global Game terms, the public mean of $\theta$ shifts downward.
  *   **Epistemic Shift:** This announcement shattered $CK(\text{Safe})$. It did not immediately create $CK(\text{Unsafe})$, but it created **Common Knowledge of Uncertainty**.
  *   **The Iterated Collapse:**
      *   *Level 1:* I see the capital raise. I update my belief: $\theta$ is lower than I thought.
      *   *Level 2:* I know *you* saw the capital raise. I know you are rational. Therefore, I know you are updating your belief.
      *   *Level 3:* I know that *you* know that *I* saw the capital raise. I know you know I am updating.
      *   *The Tipping Point:* In a Global Game, there is a unique threshold equilibrium. Once the signal passes a certain precision/negative threshold, the unique rational strategy flips from Stay to Run.
      *   **Correction on Rationality:** Depositors did not stop believing others were rational. They stopped believing that others would *Stay*. Because CKR holds, I know that if *you* believe the bank is unsafe, *you* will Run. Therefore, once I believe *you* believe the bank is unsafe, I must Run.

  The breakdown was not in $CK(\text{Rationality})$. It was that the signal ($s$) moved the system into a region where $CK(\text{Rationality}) \implies \text{Run}$.

  ### 3. Mapping Key Moments to Formal Structures

  #### A. The CEO Letter (March 8) -> *The Electronic Mail Game*
  Rubinstein's Electronic Mail Game illustrates that without infinite acknowledgments, Common Knowledge is never technically achieved.
  *   **The Signal:** Greg Becker's letter attempts to reassure.
  *   **The Failure:** In the Email Game, if there is even a tiny probability the message didn't get through, CK fails.
  *   **SVB Context:** The letter was public, but its *credibility* was the noise parameter. Depositors received the message ($s_1$), but the "acknowledgment" (trust) was missing.
  *   **Epistemic Result:** We entered a state where $K_i(\text{Letter Sent})$ was true, but $K_i K_j(\text{Letter Believed})$ was false. Without the second-order knowledge that others *believed* the reassurance, the reassurance was worthless.

  #### B. The VC Coordination (March 9 Morning) -> *Correlated Equilibrium / Network Signaling*
  Prominent VCs (Founders Fund, Coatue, etc.) advised portfolio companies to withdraw.
  *   **Formal Structure:** This acts as a **Correlating Device**.
  *   **Mechanism:** In a standard Global Game, signals are independent ($\epsilon_i \perp \epsilon_j$). Here, the VC advice created correlation ($\epsilon_i \approx \epsilon_j$).
  *   **Impact:** When signals are correlated, the "threshold" for a run lowers. If I know my signal is highly correlated with yours, I place more weight on the likelihood that you will Run.
  *   **Epistemic Shift:** This moved the group from "I think it's bad" to "I know *we* think it's bad." It approximated Common Knowledge within the sub-network of tech startups.

  #### C. The Cascading Tweets (March 9 Afternoon) -> *Public Announcement Logic*
  Twitter (now X) functioned as a perfect public broadcast channel.
  *   **Formal Structure:** A **Public Announcement** in Dynamic Epistemic Logic.
  *   **Mechanism:** When a prominent actor tweets "Pull your money," and it is retweeted by hundreds of others, it creates a chain of knowledge.
  *   **Why it broke the bank:** In the Electronic Mail Game, you need infinite back-and-forth to establish CK. Social media approximates this instantly. A viral tweet creates $K_i K_j K_k \dots$ effectively to infinite depth within minutes.
  *   **Result:** The "Stay" equilibrium requires ambiguity (I stay because I'm not sure if you're running). The tweets removed the ambiguity. It became Common Knowledge that a Run was underway. Once $CK(\text{Run is underway})$ is established, Stay becomes strictly dominated.

  ### 4. Where the Model Strains: Networks and Social Media

  This is the critical part for your seminar. The standard Global Game assumes anonymous agents. SVB was a **Network Game**.

  #### Does the Dense Network Sustain or Shatter CKR?
  It makes Common Knowledge **easier to achieve**, which paradoxically makes the system **more fragile**.
  *   **Standard Theory:** Noise in communication can prevent runs. If I'm not sure you got the bad news, I might Stay.
  *   **SVB Reality:** The dense network (Slack groups, WhatsApp chats between CFOs, Twitter) reduced the noise to near zero.
  *   **Implication:** In epistemic terms, the network reduced the "depth" required to reach Common Knowledge. In an anonymous market, it might take days for news to become Common Knowledge. In the SVB network, it took minutes.
  *   **Theoretical Strain:** Standard models treat the "public signal" as exogenous. In SVB, the signal was **endogenous to the network structure**. The VCs *created* the common knowledge to coordinate the run. This suggests we need a model of **Strategic Information Transmission** where players can choose to make private signals public to force an equilibrium shift.

  #### Does Social Media Break the Framework?
  It does not break the logic of CKR, but it breaks the **assumptions about signal precision and timing**.
  1.  **Speed of Iteration:** Epistemic logic usually assumes discrete rounds of reasoning. Social media compresses infinite iterations of $K_i K_j \dots$ into a continuous flow. The "reasoning time" became shorter than the "transaction time."
  2.  **Performativity:** In standard theory, signals reveal the state $\theta$. In SVB, the signals *changed* the state. By making the Run Common Knowledge, the tweets ensured the bank failed, regardless of the initial $\theta$. This is a **Self-Fulfilling Prophecy** driven by epistemic closure.
  3.  **Fragmented Common Knowledge:** We saw "Common Knowledge within Clusters." VC Twitter had CK of "Run." Regulators had CK of "Systemic Risk." The general public had CK of "News Headline." The run happened because the "VC Cluster" held enough deposits to kill the bank on their own, without needing the general public. This suggests we should model **Local Common Knowledge** on graphs, rather than global CKR.

  ### 5. Conclusion: Vindication or Warning?

  **Vindication:**
  The episode vindicates the core insight of Epistemic Game Theory: **Fundamentals matter less than beliefs about beliefs.** The bank did not fail because it was insolvent on March 8; it failed because it became Common Knowledge that depositors *believed* it might be insolvent. The clean threshold behavior (the speed of the collapse once the signal crossed the threshold) aligns perfectly with Global Game predictions.

  **Warning:**
  However, it warns us that the **standard assumption of anonymous, noisy signals is obsolete** in the digital age.
  *   **The Theory:** Assumes that achieving Common Knowledge is hard (hence multiple equilibria can coexist).
  *   **The Reality:** Digital networks make achieving Common Knowledge trivial.
  *   **The Implication:** If CK is easy to establish, the "Safe" equilibrium is incredibly fragile. Any negative signal, if broadcast efficiently enough, can collapse the hierarchy of beliefs instantly.

  **For your seminar:**
  You can frame SVB as a case where **Common Knowledge of Rationality** remained intact, but **Common Knowledge of Safety** was weaponized. The VCs used their network to convert private uncertainty into public certainty of a run. This suggests that in modern financial regulation, we cannot just monitor capital ratios ($\theta$); we must monitor the **epistemic structure of the depositor network**. If a group of depositors can communicate instantly to establish Common Knowledge of distress, the bank is vulnerable regardless of its balance sheet.

  This moves the discussion from *Epistemic Game Theory* to *Epistemic Systemic Risk*—a fertile ground for graduate research.
