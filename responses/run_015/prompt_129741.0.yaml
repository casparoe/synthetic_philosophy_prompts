answer: |-
  Hey, it sounds like your roommate is wrestling with one of the classic debates in contemporary epistemology, and her intuitions are actually tracking a very specific pattern that philosophers have spent decades arguing about. Based on everything you described, I can predict with pretty high confidence that she will say the climate modeler does not know there is going to be a flood. Her previous cases all follow a strict rule where the same evidence counts as knowledge in low-stakes situations but fails to count as knowledge in high-stakes situations, and evacuating a town is about as high as stakes get. Even though the modeler has ninety-nine percent confidence and replicated the code, the memory of that structural failure acts as a nagging doubt, and combined with the massive cost of a false alarm or a missed evacuation, her gut reaction will almost certainly be to deny knowledge. She will likely say that given the consequences, the modeler needs more than just a replicated model and a memory of past failures, so she doesn't truly know.

  The tricky part is figuring out why she says that, because there are three different philosophical rules that could explain all her earlier verdicts about the hiker, the surgeon, the student, and the eyewitness. The first rule is called contextualism, which says that the word knows is like a gradable adjective such as tall or flat, meaning its standards shift depending on the context of the person speaking. Under this rule, when your roommate is chatting casually, the standards for knowledge are low, so the hiker knows it won't rain, but when she is in a seminar or thinking about court cases, the standards rise dramatically, so the same hiker no longer counts as knowing. The second rule is pragmatic encroachment, which argues that the standards for knowledge are fixed but depend on the practical stakes facing the subject themselves. On this view, knowledge is sensitive to risk, so the hiker knows in the picnic scenario because being wrong doesn't matter, but doesn't know in the rescue scenario because being wrong would be disastrous. The third rule is a form of invariantism combined with norms of assertion, which holds that knowledge never changes based on stakes and depends only on evidence and truth, but people should be more careful about claiming to know when the risk is high. If she holds this view, she technically believes the hiker knows in both cases, but she says he doesn't know in the rescue case because it would be irresponsible to assert it.

  When we apply these three rules to the climate modeler case, they all converge on the same surface-level answer, which is why this case won't help you figure out which theory she actually holds. The contextualist will say that in the context of evacuation decisions, the standards are so high that the modeler's evidence doesn't meet them, so she doesn't know. The pragmatic encroachment theorist will say that because the stakes for the modeler are so high, her justification isn't strong enough to constitute knowledge, so she doesn't know. The invariantist who cares about assertion will say that she actually does know based on the evidence, but she shouldn't say she knows because the risk is too high, though if your roommate is speaking loosely she might just say she doesn't know to mean she shouldn't act. Because all three theories predict a denial of knowledge or a denial of the right to claim knowledge in this high-stakes scenario, you need a different case to split them apart.

  To actually distinguish between these views, you need to present her with a case where the subject's stakes are low but the attributor's stakes are high, which creates a conflict between the contextualist and pragmatic encroachment views. Imagine a case where a friend is casually checking a weather app to decide whether to wear a hat, which is very low stakes for them, but you are listening to them because you are deciding whether to launch a million-dollar satellite based on their word, which is very high stakes for you. If she is a pragmatic encroachment theorist, she should say the friend knows the weather forecast because the friend's stakes are low, regardless of your high stakes. If she is a contextualist, she should say the friend does not know because your context as the person attributing knowledge has raised the standards for everyone in the conversation. If she is the invariantist who focuses on assertion, she will say the friend knows the weather fact but shouldn't assert it to you given your high stakes.

  You can test this by asking her specifically whether the friend knows the weather in that mixed-stakes scenario. If she says the friend knows because it's only a hat for them, she is likely leaning toward pragmatic encroachment. If she says the friend doesn't know because you are making a big decision based on it, she is likely a contextualist. If she says the friend knows but shouldn't tell you, she is an invariantist. Given that she has been consistently denying knowledge in high-stakes cases rather than just denying the appropriateness of the claim, my guess is she is leaning toward pragmatic encroachment, where the stakes literally change whether the belief counts as knowledge. This view fits her intuition that the brain doesn't change but the knowledge status does, because on this view, knowledge isn't just in the brain, it is a relation between the believer and their practical environment. So for the climate modeler, expect her to say no knowledge, but watch out for that mixed-stakes case if you really want to pin down her theoretical commitment.
