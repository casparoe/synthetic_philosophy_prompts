answer: |-
  Here is your preparation pack. I have analyzed your view formally before drafting this. Here is the diagnostic summary you need to hold in your head:

  **Diagnosis:** Your view is a variant of **Critical-Level Utilitarianism (CLU)** with a **truncation at zero**.
  *   **Standard CLU:** $V = \sum (w_i - c)$. If $c > 0$, lives between 0 and $c$ make the population *worse*.
  *   **Your View:** $V = \sum \max(0, w_i - m)$. Lives between 0 and $m$ make the population *neither better nor worse*. Lives below 0 also make the population *neither better nor worse*.
  *   **The Trap:** Your formula implies that a world of intense suffering has the same value as an empty world (both are 0). You advertise this as a virtue ("sub-marginal lives... not worse than an empty world"), but in this literature, this is usually considered the **Sadistic Conclusion** (or the Absurd Conclusion). The Formal Axiologist will spot this immediately.
  *   **Totalism Region:** Your view ranks populations exactly like Totalism *only* when comparing two populations of the **same size** where every individual is above $m$. If population sizes differ, you diverge from Totalism everywhere.
  *   **Transitivity:** Yes, it is complete and transitive (it's a sum of reals).
  *   **Load-Bearing Joint:** The justification for $m > 0$ *and* the truncation at 0. You are trading the Repugnant Conclusion for the claim that suffering has no negative value.

  Here is your strategy for the seminar.

  ### 1. The Two Clarifying Questions (First 90 Seconds)
  *These will come from the Chair or the Axiologist to set the ground rules. If you hesitate, you look like you haven't formalized the view.*

  **Q1:** "Is the margin $m$ a fixed constant across all possible populations, or does it vary with population size or average welfare?"
  **Your Answer:** "It is a fixed constant determined by the threshold of robust worth-living, independent of population size."

  **Q2:** "Your formula uses a max function that returns zero for negative welfare; does this mean a world of universal torture is axiologically equivalent to an empty world?"
  **Your Answer:** "On the contribution function as stated, yes: suffering fails to contribute negative value, it merely fails to contribute positive value."

  ### 2. Seven Objections (Ordered by Likelihood)

  **1. The Supervisor (Totalist Sympathies)**
  *   **Objection:** "You say you keep aggregation additive, but you've severed the link between welfare and value. Why should we accept that a life can be worth living ($w > 0$) yet contribute nothing to the good? Isn't that just stipulating the result you want?"
  *   **Reply:** "I'm not stipulating the result; I'm distinguishing between a life being *good for the person* and that life making a *robust contribution to the impersonal good*. If worth-living is a threshold concept with borderline cases, we shouldn't treat a fragile, borderline-positive life as axiologically equivalent to a flourishing one."
  *   **Soft Spot:** You are asserting a metaphysical distinction (good-for vs. contribution) without a deep argument for why the threshold exists.
  *   **Damage:** 2/3

  **2. The Formal Axiologist**
  *   **Objection:** "You violate Weak Negative Pareto. If you add a person with negative welfare to a population, your value stays at zero. You are committed to saying adding suffering never makes a world worse. How do you square this with any plausible adequacy condition?"
  *   **Reply:** "I accept that violation. I prioritize blocking the Repugnant Conclusion and avoiding the claim that barely-worthwhile lives make things *worse* (as CLU does). I treat negative welfare as the absence of contribution rather than a negative contribution."
  *   **Soft Spot:** This is a very hard bullet to bite. It makes your view implausible to almost everyone except strict positive utilitarians.
  *   **Damage:** 3/3

  **3. The Environmental Economist**
  *   **Objection:** "You motivate the margin via 'error bars' in our estimates. But policy requires a social welfare function, not an epistemic heuristic. Are you saying the *value* of the population depends on how ignorant we are?"
  *   **Reply:** "No, the margin represents ontological robustness, not just epistemic error. The error bar argument is a motivation for why we should posit a margin, not a claim that value fluctuates with our knowledge."
  *   **Soft Spot:** Blurring epistemic and ontological margins is a common mistake; keep them distinct.
  *   **Damage:** 1/3

  **4. The Vagueness Postdoc**
  *   **Objection:** "If 'worth living' is vague, why is your margin $m$ sharp? You've just moved the Sorites paradox from zero to $m$. What happens to a life exactly at $m - \epsilon$?"
  *   **Reply:** "I grant the sharp cutoff is an idealization for the sake of the formal model. In reality, the contribution function likely slopes gradually, but a threshold model captures the lexical intuition that marginal lives shouldn't aggregate to beat flourishing ones."
  *   **Soft Spot:** Admitting it's an idealization weakens the claim that it solves the problem *precisely*.
  *   **Damage:** 2/3

  **5. The Non-Identity Postdoc**
  *   **Objection:** "Is this just a person-affecting view in impersonal clothing? You're saying adding certain people doesn't make the outcome better, which sounds like 'it's not better for them, so it's not better simpliciter'."
  *   **Reply:** "No, because I still aggregate impersonally. A life above $m$ contributes value even if it doesn't affect existing people. The restriction is on the *quality* of the contribution, not on *who* is affected."
  *   **Soft Spot:** The distinction is thin; person-affecting views often look like this.
  *   **Damage:** 1/3

  **6. PhD Student (Intuition Pump)**
  *   **Objection:** "Imagine two worlds. One has a billion people at $m + 1$. The other has a trillion people at $m - 1$. Your view says the first is better, even though the second has more 'worth-living' lives. Isn't that counterintuitive?"
  *   **Reply:** "It is counterintuitive if you think quantity of worth-living lives matters. I argue it's the *quality above robustness* that matters. A trillion precarious lives don't outweigh a billion secure ones."
  *   **Soft Spot:** Relies on the audience accepting your "robustness" intuition over the "more good lives" intuition.
  *   **Damage:** 2/3

  **7. The Supervisor (Follow-up)**
  *   **Objection:** "Why not just use Critical-Level Utilitarianism? It blocks the Repugnant Conclusion too. What do you gain by truncating at zero rather than allowing negative contributions?"
  *   **Reply:** "CLU says adding a barely-worthwhile life makes the world *worse*. That violates the Mere Addition intuition. My view says it makes the world *no better*, which preserves the thought that adding a good life isn't bad, without triggering the Repugnant Conclusion."
  *   **Soft Spot:** You trade the "Sadistic Conclusion" of CLU for the "Absurd Conclusion" (suffering is neutral).
  *   **Damage:** 2/3

  ### 3. What to Concede in the First Two Minutes
  Do not wait for them to force these out; offer them to show command of the view.

  1.  **Concede the Negative Welfare Implication:** "I want to be clear upfront: on this formalization, lives with negative welfare do not subtract value. I know this is costly, but it is the price of ensuring that sub-marginal positive lives don't aggregate to dominate."
  2.  **Concede the Precision of $m$:** "I am not claiming we can calculate $m$ to the decimal. It is a structural feature of the axiology, not a policy dial."

  ### 4. The Single Reply That Must Land
  *If you lose this, you lose the seminar.*

  **The Core Distinction:** "The Repugnant Conclusion arises because we assume *any* positive welfare is a 'vote' for that population. I am arguing that only *robust* welfare casts a vote. If we separate the question 'Is this life worth living?' from 'Does this life contribute to the ranking of populations?', we can keep aggregation without the Repugnancy."

  *Why:* This defends your thesis that the fix is in the *contribution function*, not the *aggregation rule*. If you let them convince you that contribution must track welfare 1:1, your view collapses into Totalism.

  ### 5. The Weakest Joint in Your Argument
  **The Treatment of Suffering.**
  Your formula $\max(0, w_i - m)$ implies that $w_i = -1000$ contributes 0. This means a world of torture is equal in value to an empty world.
  *   **Preparation:** Do not try to say this is intuitive. It isn't. Defend it as a *theoretical trade-off*. "I am prioritizing the avoidance of the Repugnant Conclusion and the preservation of Mere Addition over Negative Dominance. I acknowledge this is a significant cost."
  *   **Better Move:** If you can, clarify verbally that you intend the formula to apply to *positive* welfare contributions, and that negative welfare *should* probably subtract, but you haven't formalized that clause yet. *However*, since your text says "sub-marginal lives... not worse than an empty world," you have committed to the neutral-suffering view. Stick to the trade-off defense.

  ### 6. The Question You Hope Nobody Asks
  **"If worth-living is vague, doesn't that imply the margin $m$ is vague? And if $m$ is vague, isn't your value function $V(P)$ undefined for borderline cases, rendering the view action-guiding only in clear cases?"**

  *   **Why it's deadly:** It attacks the formal precision you rely on to block the RC. If $m$ is vague, there is a range where we don't know if a life contributes 0 or $>0$. This reintroduces indeterminacy.
  *   **What to Say:** "That is correct. On a supervaluationist account, there will be a range of populations where the ranking is indeterminate. I accept that indeterminacy is preferable to the false precision of Totalism which delivers a determinate but repugnant ranking. We should not demand determinacy where the underlying concepts are vague."

  ### Final Advice for the Discussion
  *   **Listen for "Critical-Level":** When the Axiologist speaks, they will hear "Critical-Level Utilitarianism with a floor." Don't fight the label; fight the implication that CLU is better because it handles negative welfare. Your selling point is the *Mere Addition* preservation.
  *   **Don't get bogged down in Math:** You know the formula works. The debate is about the *normative justification* for the margin. Keep bringing it back to: "Is it plausible that a barely-worthwhile life should count the same as a flourishing one?"
  *   **Manage the Supervisor:** He thinks RC is cheap. You need to argue that RC is not just "counterintuitive" but "structurally flawed" because it relies on the assumption that marginal lives contribute. That is your philosophical thesis.

  Good luck. You have a coherent view, but the cost on negative welfare is high. Own that cost, and you'll pass.
