prompt: |-
  I am a taught-master's student, and next Thursday I am giving the assessed work-in-progress presentation for our seminar on population ethics and future generations: a twenty-minute paper, then roughly twenty-five minutes of discussion, and the discussion is what I am being marked on. I would be very grateful for your help preparing for it.

  Please approach this in two capacities at once: as a professional philosopher who works in population axiology, and as someone who has sat through a great many seminar question periods and knows how they actually go. Before drafting anything, I'd ask you to spend some time working through the view below on your own — check what it really implies rather than what I claim it implies. Does the margin block the repugnant conclusion outright, or does it merely push the repugnant conclusion a little further up the welfare scale? Is the resulting ordering complete and transitive? In what region of the case-space does the view behave exactly like totalism? Where do you think the load-bearing joints are? I would much rather have your own diagnosis of the view than a list of the standard moves people make in this literature.

  The view. I grant the usual set-up: populations vary in size and in the identities of their members; each life has a lifetime welfare level measured on a scale whose zero is the neutrality point, the level at which a life is neither worth living nor not worth living. The repugnant conclusion, as I'll use the phrase: for any small population of lives at a very high level of welfare, there is some much larger population of lives that are only barely worth living which is better than it — better by as much as you like, if you make the large population big enough. The mere-addition intuition: adding a life that is worth living and that makes no one else worse off cannot make things worse.

  My thesis is that the repugnant conclusion should be answered at the level of the contribution function rather than at the level of the aggregation rule. Aggregation stays additive, exactly as the totalist wants. What I reject is the further assumption that every life worth living makes a positive contribution to the value of a population. A life contributes only if it is robustly worth living — worth living with a margin — and what it contributes is the welfare above that margin, not its welfare full stop. Formally, with a fixed margin m greater than zero:

  V(P) = the sum over the members of P of max(0, w_i − m).

  Three advertised virtues. First, the classic repugnant conclusion is blocked: if each life in the enormous population sits at a level below the margin, each contributes nothing, however many of them there are, so the enormous population of marginal lives is worse than the small flourishing one. Second, a restricted mere addition survives: adding a life whose welfare exceeds the margin is always an improvement, and adding one below it is a matter of indifference — which seems to me the right verdict for a borderline life, and is far cheaper than the verdict given by critical-level views, which subtract a constant from every life before summing and so have to say that adding a barely-worthwhile life makes things worse. Third, my view never says that sub-marginal lives are bad: a world containing a trillion of them is not worse than an empty world, only no better.

  My argument, in the steps I'll present: (1) the repugnant conclusion is generated by additivity together with the claim that every life worth living contributes positively; (2) those are separable commitments, and only the first is essential to totalism; (3) the contribution of a life should be measured by how far above the worth-living line it robustly sits, because worth living is a threshold notion with borderline cases and because in any real choice our estimates of welfare carry error bars of some width; (4) hence the formula above; (5) hence the repugnant conclusion is not a reductio of aggregation at all, but a reductio of the assumption that marginal lives contribute. I should say that I have two motivations for the margin and have not settled which is primary: the vagueness of worth living, and the width of our error bars.

  The audience. My supervisor chairs; he is a consequentialist of totalist sympathies who thinks the repugnant conclusion is cheaper than the theories built to dodge it, and he will want an argument for the contribution function rather than a list of its consequences. Also present: a member of staff who works on formal axiology and impossibility results, who will ask which of the standard adequacy conditions I am violating and whether the view can be given any sort of representation theorem; a postdoc working on the non-identity problem and person-affecting restrictions, who will ask whether my view is a person-affecting restriction in disguise; a visitor from the policy side, an environmental economist who works on future generations and thinks in terms of social welfare functions and discounting, who will want to know what the view says we should actually do and whether the value of a population can really depend on how ignorant we are; and a postdoc in the department who works on vagueness and borderline cases, who will press me on what happens to the view if worth living is vague and what happens if it is sharp. The rest of the room is six or seven doctoral students.

  What I'd like from you:

  1. The two clarifying questions that will arrive in the first ninety seconds, with a one-sentence answer to each. If I fumble these I lose the room, so I want them worded the way I might actually say them.
  2. Seven or eight objections, in the order you expect them to arrive, each phrased as the person who will raise it would phrase it — in their vocabulary, with their background assumptions visible — and each with: a reply I could deliver in about a minute, written in the first person as I would say it aloud; a note on where that reply is soft, or on what it commits me to that I'd rather not be committed to; and a damage mark out of three.
  3. What I should concede in the first two minutes, before anyone asks anything.
  4. The single reply that has to land if the paper is to survive the hour.
  5. The weakest joint in my own argument, which I should prepare to defend rather than hope nobody finds.
  6. The question I am hoping nobody asks — and, since it will probably be asked anyway, what I should say when it is.
