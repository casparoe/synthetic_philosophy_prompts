      *   **Skeptic (Relocator):** The reactive attitudes are psychological facts, but responsibility is a normative status. Just because we *feel* resentful doesn't mean the person *is* responsible in a metaphysical sense that justifies punishment/reward. The attitudes aim at truth (quality of will); if determinism undermines that truth, the attitudes are systematically mistaken, like an optical illusion.

