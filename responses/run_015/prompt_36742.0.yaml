      *   *Mechanism:* Actors manage impressions on a front stage, retreat to a back stage.
      *   *Key Feature:* The "Self" is not an internal psychological entity but a dramatic effect arising from the scene. It's sacred, ritualized.
      *   *Looking-Glass Self (Cooley):* We imagine how we appear to others, imagine their judgment, and feel pride/mortification.
      *   *Ontology:* Interactional, relational, externalized. The self is *between* people, not just inside one.
      *   *Location:* The interaction order.

  4.  **Drafting the Translation (Step 1):**
