      *   *Mechanism:* Neural activity creates symbols. One symbol represents the organism itself. This symbol interacts with other symbols. The system perceives itself through this symbol.
      *   *Key Feature:* Tangled Hierarchy. Lower levels (neurons) support higher levels (symbols), but the higher level (self-symbol) exerts causality back down on the lower level (decisions/actions).
      *   *Ontology:* Pattern over substrate. You can have "more" or "less" of a self depending on the complexity of the loop (hence animals/machines).
      *   *Location:* Inside the skull (mostly). It's a cognitive architecture.

  3.  **Deconstruct Goffman's Theory (The Target):**
