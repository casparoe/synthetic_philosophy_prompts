          *   *Verdict:* Strong against Myopic. Weaker against Sophisticated (they anticipate). Weakest against Resolute (they pre-commit).

      *   *Claim 2: The Instrumental Dominance Claim.* (Focus on "worse off by your own lights").
          *   *Idea:* You ended up with $A - \$\epsilon$ instead of $A$. You prefer $A$ to $A - \$\epsilon$. So you violated your own goals.
