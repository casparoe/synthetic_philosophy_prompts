          *   *Application:* Calls both irrational by definition, but begs the question against the ML person (who says "irrational is the wrong word").

      *   *Claim 4: The Exploitability Risk Claim.* (Focus on Prudence).
          *   *Idea:* Even if you don't lose much, being *capable* of being exploited is a defect.
          *   *Hidden Premise:* Vulnerability itself is a cost.
          *   *Nuance:* Transaction costs (User's Point 3). If it costs the exploiter more to pump you than you lose, are you still irrational?
          *   *Verdict:* Suggests "imprudent" rather than "irrational."

      *   *Claim 5: The "One-Way" Pump (Domination).* (User's distinction).
          *   *Idea:* You don't need a cycle. You just need to trade $A \to B \to C$ and end up with $C$ when you started with $A$ and preferred $A$ to $C$.
