  5.  **Addressing the Specific Cases:**
      *   *ML Model:* No money. No future planning (usually). "Irrational" is category error?
      *   *Friend:* Knows she cycles. Doesn't care. Is she "irrational" or just "expensive"?

  6.  **Structuring the Response:**
