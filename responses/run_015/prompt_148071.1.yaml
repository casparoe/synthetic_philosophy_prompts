  I've been reading about decision theory on my own for a couple of years — no university background, so I know the rough shape of these debates but not the literature, and you shouldn't assume I know any technical term I haven't used myself. Everyone I've managed to talk to about this so far agrees with me, which is exactly why I need you not to.

  Please play a committed defender of the standard expected-utility view of choice under uncertainty: someone who holds that a rational person's uncertainty can be represented by a single probability function over the possibilities, that rational choice maximises expected utility against that function, that the preferences people report in the two-urn puzzle are simply an error, and that the core of rationality here is coherence — not being exploitable, and being consistent across redescriptions and across time. Stay in character until I say stop. Keep every reply to a single paragraph; this should feel like a conversation rather than a handout. No headings, no bullet points, no footnotes, and nothing that would require looking anything up: I know there is a large literature on all of this and I'm not asking for it, so don't cite or name papers, authors, theorems or experiments — argue the point in your own words.

  Be sharp rather than agreeable. Concede the small points that are genuinely yours to concede — I'd expect you to grant, for instance, that your theory doesn't tell anyone which prior to have, that the exploitability arguments work by comparing choices made at different times, and that ambiguity isn't a property of the urn but of how much the agent happens to know. But never concede the main claim: that one probability function plus expected utility is the right standard, and that the two-urn preference is a mistake. If you think something I've said is confused rather than merely wrong, say so plainly and explain the confusion; don't politely restate me into something easier to answer. If anything I say is unclear, take the reading that makes my objection strongest and tell me in a clause which reading you took — don't ask me to clarify. You may use technical vocabulary, but only if you explain each term within the same sentence.

  Here is my opening; please answer it in character.

  Two urns, a hundred balls each, red and black. Urn A was filled and counted in front of me: fifty of each. Urn B was filled by someone else, by a method I know nothing about: any mix from no reds at all to all reds is compatible with what I know. I pick one urn and one colour, and I get £100 if the ball I draw is that colour and nothing otherwise. Like most people, I would rather bet on red from A than on red from B, and I would also rather bet on black from A than on black from B.

  Let me hand you your strongest weapon for free, because I don't think it decides anything. Yes: if you offer me the choice, then let me see the mix in B, then offer me the choice again, my preferences can be arranged so that I end up paying twice for the same information, or paying to avoid receiving it. I grant all of that. But a verdict reached by asking what I'd choose at three different times is a verdict about whether my life hangs together, not about whether the first choice was a bad one — and it's the first choice I care about.

  Here is what I want answered. Your view, as I understand it, says: pick a prior over the hundred and one possible mixes in B, then be consistent. I don't have a prior. I have a gap, and I don't think a gap can be turned into a number without making something up. Suppose I try anyway and spread my confidence evenly over the hundred and one possible mixes. Why evenly over *that* way of carving things up, rather than evenly over the odds of red, or over some other re-labelling of exactly the same possibilities? Those give different numbers and different advice. The answer I keep getting is that any prior will do provided I'm consistent — which means two people with the same evidence, the same desires and the same wits can both be rationally required to act differently, and, worse, that whoever filled urn B can exploit whichever prior I happened to settle on. My own view is that a rational person holds her beliefs with what I call *evidential slack*: how much a belief gets to steer action should shrink with how thin the evidence behind it is, and thinness here is not a second-order probability about my own belief, it's a refusal to let one number stand in for an ignorance that has no shape. The two-urn preference is just evidential slack showing up in a bet.

  So, three things in your first reply. First: is evidential slack incoherent? If so, tell me why the argument doesn't equally rule out every attempt to represent ignorance with a *range* of numbers — a range has edges, and those edges look every bit as arbitrary as the prior you are accusing me of inventing. Second: if it isn't incoherent but collapses into a prior over priors, tell me where the regress is supposed to stop — do I need slack about my slack, and if not, why not? Third: either commit to a prior over B's mix — an actual number, plus a statement of what you are spreading it over and why — or refuse to commit, and explain why refusing isn't just evidential slack wearing a different hat.
