      *Refining the "Human Judgment" aspect:* The prompt asks where we stop and ask a human because it's a values question. This usually happens when the evidence suggests *harm* but the procedure says *document*. I need to make sure Step 5 leads to a "Flag for Review" rather than a definitive "This is silence."

  9.  **Final Review against Prompt Requirements:**
      *   Reusable procedure? Yes.
      *   Step-by-step? Yes.
      *   Pass/Fail criteria? Yes.
      *   Stop points (Loss vs. Silence)? Yes.
      *   Human judgment flags? Yes.
      *   Counter-index traces? Included in Step 4.
      *   15 mins/box? Yes, designed for speed.
      *   Run on 3 things? Yes.
      *   Honest about limitations? Yes.

  10. **Final Polish:** Ensure language is accessible to archive staff, not just archivists. Use terms like "folder," "box," "log," not "provenance" or "archival bond." (Wait, "provenance" is okay if defined, but better to keep it plain). Let's stick to "Box Context."

      *(Self-Correction on Case 3)*: The prompt says "a case where the procedure tells us 'document the gap, don't fill it' but I personally think we should interview." I need to make sure the procedure explicitly identifies *when* it is deferring to policy vs. when it is flagging an ethical dilemma. I will add a "Ethical Flag" at the end of the procedure.

