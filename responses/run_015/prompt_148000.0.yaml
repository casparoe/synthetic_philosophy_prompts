answer: |-
  # The Gap Audit Procedure (15-Minute Triage)

  **Purpose:** To distinguish between accidental record loss (decay) and systematic omission (silence) in public housing records.
  **Time Limit:** 15 minutes per box or file set.
  **Tools Needed:** Box inventory list, agency timeline/policy history (one-pager), magnifying glass, sticky notes (Red = Silence, Yellow = Decay, Blue = Judgment Call).

  ---

  ## Part 1: The 5-Step Check

  Perform these steps in order. If a step fails (meaning it points to "Silence"), mark it and continue to the end to see the pattern. Do not stop early.

  ### Step 1: Physical Integrity Check (3 Minutes)
  **Action:** Inspect the box, folders, and surrounding boxes. Look for water damage, mold, pest damage, or torn labels. Check the box number sequence (e.g., is Box 45 missing between 44 and 46?).
  *   **Pass (Decay):** Damage is present, OR box numbers are skipped randomly across different buildings/tenants.
  *   **Fail (Silence):** Box is physically intact, labels are clean, but contents are missing. Box numbers are sequential, but specific *types* of files within the sequence are missing.
  *   **Note:** If physical damage explains the loss, mark **Yellow (Decay)** and stop. If not, proceed.

  ### Step 2: Chronological Flow (3 Minutes)
  **Action:** Look at the dates on the documents. Are there abrupt start/stop dates?
  *   **Pass (Decay):** Dates trail off gradually (e.g., fewer memos over months) or are scattered randomly (e.g., 1998, 1996, 1999 mixed together).
  *   **Fail (Silence):** Hard cut-off dates (e.g., records exist until Dec 31, 1995, and resume Jan 1, 1998, with nothing in between).
  *   **Note:** A hard cut-off suggests a policy change or administrative decision. Mark **Red (Silence)** and proceed.

  ### Step 3: Content Consistency (3 Minutes)
  **Action:** Compare the missing records to the existing records. Is the missing material specific to a certain group, building, or topic?
  *   **Pass (Decay):** Missing records are random (e.g., Building A and Building B both missing Jan 1990 logs).
  *   **Fail (Silence):** Missing records target a specific subset (e.g., Only Building C is missing logs; only files for single mothers are missing income verification).
  *   **Note:** Specificity indicates selection. Mark **Red (Silence)** and proceed.

  ### Step 4: Counter-Index Trace (3 Minutes)
  **Action:** Look for references to the missing items *inside* the existing items. Check meeting minutes, handwritten notes on folder covers, or cross-references ("See attached maintenance ticket #404").
  *   **Pass (Decay):** No mention of the missing items exists anywhere.
  *   **Fail (Silence):** Existing documents reference the missing items as if they exist (e.g., a memo says "As per the maintenance report filed on..." but the report is gone).
  *   **Note:** This proves the record *was* created and then removed or segregated. Mark **Red (Silence)** and proceed.

  ### Step 5: Policy Alignment (3 Minutes)
  **Action:** Check the agency timeline. Did a policy change, leadership shift, or funding shift happen at the same time as the gap (identified in Step 2)?
  *   **Pass (Decay):** No known policy changes match the gap timeline.
  *   **Fail (Silence):** A policy change matches the gap exactly (e.g., "New Privacy Policy 1995" aligns with the disappearance of tenant meeting minutes).
  *   **Note:** This confirms the "Why." Mark **Red (Silence)**.

  ---

  ## Part 2: Decision Matrix

  Once the 5 steps are complete, tally the results.

  | Result | Diagnosis | Action |
  | :--- | :--- | :--- |
  | **Mostly Pass** | **Random Decay** | Catalog as "Missing due to deterioration/loss." No further action. |
  | **Mostly Fail** | **Structured Silence** | Catalog as "Record Gap." Add a finding aid note: *"Records absent corresponding to [Policy/Date]."* **Do not reconstruct.** |
  | **Mixed + Step 4 Fail** | **High Probability Silence** | **FLAG FOR HUMAN JUDGMENT.** (See Part 3). |

  ### The Human Judgment Zone (Values vs. Facts)
  The procedure identifies *facts* about the gap. It cannot decide *ethics*. You must stop and consult a supervisor or ethics lead if:
  1.  **Harm Potential:** The silence hides evidence of illegal activity, discrimination, or harm to vulnerable tenants.
  2.  **Community Impact:** The gap erases a specific community's history (e.g., a specific ethnic block) and the community is currently active/advocating.
  3.  **Reconstruction Pressure:** There is pressure to "fix" the history (see Test Case 3).

  ---

  ## Part 3: Test Runs

  Here is how the procedure runs on your three scenarios.

  ### Case 1: Building with Zero Maintenance Requests (6 Years)
  *   **Step 1 (Physical):** Box intact. (Fail/Silence)
  *   **Step 2 (Chron):** 6-year hard block with no requests. (Fail/Silence)
  *   **Step 3 (Content):** Other buildings have requests; only this building is empty. (Fail/Silence)
  *   **Step 4 (Counter-Index):** Tenant complaints in files mention "calling maintenance repeatedly." (Fail/Silence)
  *   **Step 5 (Policy):** No policy change stopped maintenance logging. (Pass/Decay)
  *   **Verdict:** **Structured Silence.**
  *   **Action:** Catalog the gap. Note: *"Maintenance logs absent 1990-1996 despite tenant complaints referencing them. Indicates systemic neglect or record suppression for this property."*
  *   **Why not Decay?** Random decay wouldn't spare every other building while silencing tenant complaints about the missing logs.

  ### Case 2: Eviction Notices (Male Heads Only)
  *   **Step 1 (Physical):** Files intact. (Fail/Silence)
  *   **Step 2 (Chron):** Consistent throughout the era. (Pass/Decay)
  *   **Step 3 (Content):** Women are present in units but listed only as "Occupant" or absent from legal headers. (Fail/Silence)
  *   **Step 4 (Counter-Index):** School records or medical files in the same box list the women as heads of household. (Fail/Silence)
  *   **Step 5 (Policy):** Agency policy required "Head of Household" designation based on 1970s federal guidelines. (Fail/Silence)
  *   **Verdict:** **Structured Silence.**
  *   **Action:** Catalog as is. Add finding aid note: *"Eviction notices reflect period-specific policy listing only male heads of household. Female tenants present but administratively invisible."*
  *   **Why not Decay?** The records exist but are biased. The silence is in the *naming*, not the paper.

  ### Case 3: Procedure Says "Document," Archivist Wants "Interview"
  *   **Scenario:** The Gap Audit flags a "Structured Silence" regarding a tenant protest. The procedure says "Document the gap, don't fill it." You feel you should interview tenants to reconstruct the event.
  *   **Procedure Output:** **FLAG FOR HUMAN JUDGMENT.**
  *   **Reason:** This is a values question, not a fact check.
      *   **Fact:** The official record is silent.
      *   **Value:** Does the archive serve the *agency's* record or the *community's* truth?
  *   **Action:** Stop the 15-minute clock. Escalate.
      *   *Risk of Interviewing:* Creating "oral history" and filing it as "agency record" falsifies the provenance. It mixes what the agency did with what people say they did.
      *   *Solution:* Create a separate collection for "Community Oral Histories" linked to the agency record. Do not stuff the interview into the agency box. This preserves the silence (as evidence of agency behavior) while capturing the truth (as community memory).

  ---

  ## Part 4: Limitations (What This Procedure Can't Catch)

  Be honest with your team. This 15-minute triage will miss:

  1.  **The Bias That Is Recorded:** This procedure finds things *missing*. It does not catch things *present but lying*. (e.g., Maintenance logs that exist but falsify the repair dates).
  2.  **Digital Erasure:** If the agency switched to email or databases in 1998 and the server was wiped, this physical box check will just look like "Policy Change" (Step 5) and might miss the scale of digital loss.
  3.  **Self-Censorship:** If a clerk decided *not* to write something down because they were afraid, this procedure will flag it as "Silence," but it cannot prove the fear. It looks the same as malicious destruction.
  4.  **The "Normal" Bias:** If the agency *always* excluded women's names (Case 2), Step 2 (Chronology) might pass because there was no "change." It relies on you noticing the content bias in Step 3. If the team is rushed, they might miss the social bias and call it "Standard Procedure."

  **Final Rule:** If the 15-minute check flags **Structured Silence**, the archive's job is to preserve the silence as evidence, not to fix it. Fixing it hides the power dynamic that caused the gap.
