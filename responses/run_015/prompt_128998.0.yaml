answer: |-
  This is a fantastic seminar dispute. It cuts right to the heart of one of the most persistent misunderstandings in philosophy of mind: the ontological status of abstractions. Both Jordan and Maya are making strong points, but they are also both making specific errors regarding the physics of the analogy and the nuances of Dennett's actual position.

  Here is a round-by-round refereeing of the argument, checking the physics, the philosophy, and how well they map onto Dennett.

  ### Round 1: Fiction vs. Emergent Feature
  **Jordan:** The self is a "useful fiction," like a calculated point.
  **Maya:** The self is a "real emergent feature," like the mass distribution causing the point.

  **The Physics Check:**
  *   **Jordan** is closer to the classical physics definition. A Center of Gravity (CoG) is a mathematical abstraction. You cannot touch it; it has no mass itself. If you slice the chair in half, the CoG doesn't "break," it just recalculates. In that sense, it is "fictional" (it is not a physical constituent).
  *   **Maya** is arguing for *ontological realism*. She claims the CoG is "real" because it is determined by real mass. However, she risks a category error. The *mass* is real; the *point* is a derived property.

  **The Philosophy Check:**
  *   **Jordan** captures Dennett's rhetorical flair. Dennett explicitly calls the self a "fiction" to shock people out of Cartesian Dualism (the idea that there is a "little man" in the brain).
  *   **Maya** captures Dennett's deeper metaphysical commitment. Dennett is a "Real Pattern" theorist. He argues that abstractions are real *if they have predictive power*. A CoG predicts how the chair falls; the Self predicts how the person acts.

  **Verdict:** **Draw, but with a correction.**
  Jordan is right that Dennett calls it a fiction. Maya is right that Dennett doesn't mean "lie." Dennett's position is that the self is an **abstract object**. It is as real as a "hole" or a "deadline." It's not made of atoms, but it's not nothing. Jordan leans too hard into "fiction" (risking eliminativism), while Maya leans too hard into "emergent feature" (risking reification).

  ### Round 2: Mind-Independence vs. Model-Dependence
  **Jordan:** A CoG exists without language (the chair falls regardless). The Self requires language/story. Therefore, the analogy breaks, or the Self is *more* fictional than a CoG.
  **Maya:** Predictive processing creates a self-model constantly (interoceptive inference). It's model-dependent but causally effective, like a coordinate system.

  **The Physics Check:**
  *   **Jordan is Right.** A Center of Gravity is mind-independent. A chair falls the same way in a universe with no physicists to calculate the point.
  *   **Maya is Wrong on the Physics.** A Center of Gravity does *not* depend on a coordinate system. Its location is intrinsic to the mass distribution. A coordinate system is just how we *describe* the location, not what *creates* it.
  *   **Maya is Right on the Cognitive Science.** She correctly identifies that modern neuroscience (Predictive Processing) views the self as a generative model. This updates Dennett. For Dennett, the "Narrative" requires language. For Maya (channeling Friston/Clark), the "Model" requires only neural inference.

  **Verdict:** **Jordan wins on Physics; Maya wins on Cognitive Science.**
  Jordan correctly identifies a disanalogy: CoGs don't need observers; Selves (in Dennett's view) do. However, Maya successfully patches the hole by updating the theory. If you view the self as a *control model* rather than just a linguistic story, it becomes more like a CoG (a functional pivot point for behavior). Jordan is stuck on Dennett's 1991 emphasis on *language*; Maya is applying 2020s embodied cognition.

  ### Round 3: DID and Binary Stars
  **Jordan:** DID shows two centers in one body. A physical object can't have two CoGs without tearing apart. This proves there is no single self.
  **Maya:** Binary stars have two centers orbiting a common barycenter. The brain is the system; the alters are the stars.

  **The Physics Check:**
  *   **Jordan is mostly Right.** A single rigid body has one CoG. If you have two distinct CoGs, you physically have two distinct objects (or a non-rigid system).
  *   **Maya is Creative but Imprecise.** A binary star system has a *barycenter* (the system's CoG) around which the two stars orbit. The stars themselves have their own individual CoGs. If the brain is the "system," then Maya is admitting there are two distinct "masses" (alters) orbiting a common point.

  **The Philosophy Check:**
  *   **Jordan's Conclusion:** "There is no single self." This actually aligns with Dennett's "Multiple Drafts" model. Dennett argues consciousness is not a unified stream but a cacophony of edits. DID is just an extreme version of normal fragmentation.
  *   **Maya's Conclusion:** "Two centers in one system." This inadvertently supports Jordan. If there are two narrative centers, there is no *single* Center of Narrative Gravity. There are two competing fictions.

  **Verdict:** **Jordan wins the logic; Maya wins the metaphor.**
  Maya's binary star analogy is brilliant, but it concedes Jordan's point. If there are two stars, there is no *single* center of the star. There is a system center (barycenter), but the "gravity" of the individual stars remains distinct. This supports the idea that the "Self" is not a singular thing, but a dynamic equilibrium of competing sub-processes. Jordan is right that this challenges the idea of a *unified* self, which is exactly what Dennett wants to challenge.

  ### The Final Ruling: Who is getting Dennett right?

  **The Core Misunderstanding:**
  Both Jordan and Maya are trapped by the word **"Real."** They are treating it as a binary switch (Real vs. Fiction). Dennett's entire career is an attempt to show that this is a false dichotomy.

  For Dennett, the Center of Narrative Gravity is:
  1.  **Not a Thing:** It is not a soul, homunculus, or neural locus (Jordan is right).
  2.  **Not a Lie:** It has causal power. If you insult my self, I get angry. If you insult a chair's CoG, nothing happens. The Self is *more* real than the CoG because it participates in feedback loops (Maya is right).
  3.  **An Abstract Object:** It exists in the same way a "currency exchange rate" or a "legal corporation" exists. It is constituted by social and linguistic practices.

  **Who is Right?**
  *   **Jordan** is more faithful to Dennett's specific text regarding the "fictional" nature of the self and the requirement for language/narrative. Jordan correctly identifies that without the story, the specific *human* self dissolves.
  *   **Maya** is more faithful to the *spirit* of Dennett's naturalism and integrates better with contemporary neuroscience. She correctly identifies that "model-dependent" does not mean "causally inert."

  **The Physics Analogy Status:**
  The analogy **does not support either conclusion fully** because the analogy has limits.
  *   **Limit 1:** CoGs are static/physical; Selves are dynamic/semantic.
  *   **Limit 2:** CoGs are mind-independent; Selves are (partially) mind-dependent.
  *   **Limit 3:** As Maya's binary star point showed, the physics allows for multiple centers in a system, which actually undermines the idea of a *singular* self, supporting Jordan's skepticism.

  ### Recommendation for the Seminar
  Tell them to stop arguing about whether the self is "real." Tell them to argue about **utility**.

  Dennett's point isn't "The self doesn't exist." His point is "The self is a tool."
  *   Ask **Jordan:** If the self is a fiction, why does damaging it (trauma) cause physical harm? Fictions don't usually cause ulcers.
  *   Ask **Maya:** If the self is a real emergent feature like a CoG, why does it change so radically based on what story I tell myself? CoGs don't change because you describe the chair differently.

  **Final Decision:**
  **Maya** has the stronger philosophical position because she accounts for the *causal power* of the self (predictive processing), which saves Dennett from being an eliminativist. **Jordan** has the stronger grasp of Dennett's specific rhetoric and the physics of the CoG (mind-independence).

  If they must pick a winner: **Maya** wins on the *mind* (she explains how the fiction works), but **Jordan** wins on the *physics* (the analogy isn't perfect). The analogy serves Dennett not to prove the self is fake, but to prove the self is **not a thing**. Both students agree on that last part; they are just fighting over what to call "not a thing." Tell them to call it a **Real Pattern** and go get coffee.
