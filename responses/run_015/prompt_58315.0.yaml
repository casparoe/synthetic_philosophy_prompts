  2.  **Brainstorming the Mapping (Maths/Philosophy -> Farming):**
      *   *Capital/Wealth:* Farm equity, cash in hand, stored grain, machinery value.
      *   *Bet Size:* Acreage allocated to a specific crop (e.g., how many hectares of wheat vs. beet).
      *   *Odds/Probability:* Weather forecasts, market price predictions, yield estimates.
      *   *Expected Value (EV):* Average profit per hectare over infinite seasons (the "paper" profit).
      *   *Geometric Growth Rate:* The actual compound growth of the farm's value year-on-year.
      *   *Ruin:* Going bust, bank calling in loans, losing the tenancy/freehold.
      *   *Time Averaging (Ergodicity):* One farm living through 50 years vs. 50 hypothetical farms living through 1 year.
      *   *Log Utility:* The psychological/financial pain of losing £10k when you have £20k vs. losing £10k when you have £1m.
      *   *Kelly Criterion:* The optimal acreage split to maximize long-term growth without going bust.
      *   *Diversification:* Crop rotation (not all wheat).

  3.  **Drafting the Systematic Translation (The Core Argument):**
      *   *The "Economist" View (EV Maximizer):* Plant everything to the crop with the highest average return. If wheat averages £500/ha and beet £400/ha, plant 100% wheat. Ignore the risk of a bad wheat year wiping you out.
      *   *The "Bettor/Geometric" View (Kelly):* If you plant 100% wheat and get a disease or price crash, you're done. You need to plant a mix that survives the bad years so you're around to enjoy the good years.
      *   *The "Philosophical" Dispute:* Is this just being cautious (utility), or is it a mathematical fact about time (ergodicity)?
      *   *Farming Analogy:*
          *   EV = Looking at the AGRO book average yield.
          *   Geometric = Looking at your actual bank balance over 20 years.
          *   Ruin = The bank foreclosing.
          *   Ergodicity = You only live one life (one farm timeline), you can't average across parallel universes.

  4.  **Developing the Residue Report:**
      *   *Clean Maps:* Ruin (losing the farm), Diversification (crop mix), Compounding (reinvesting profit).
      *   *Fudged/Separated:* Continuous betting (Kelly assumes infinite bets, farming is seasonal/discrete), Liquidity (farming assets aren't cash), External shocks (subsidies, policy changes).
      *   *The "Leftover" Stuff:* The philosophical debate about *why* Kelly works (Utility vs. Ergodicity). Does it matter to the farmer? Probably not. The outcome is the same.
      *   *Honest Assessment:* The farmer's intuition is actually *better* than the abstract theory because it accounts for real-world friction (machinery breakdown, family needs) that pure maths ignores.

  5.  **Refining the Tone:**
      *   Avoid words like "stochastic," "ensemble," "concave function."
      *   Use words like "harvest," "lien," "overwinter," "cash flow," "equity."
      *   Acknowledge the Norwich location (implies specific soil/weather context, though keep it general enough).
