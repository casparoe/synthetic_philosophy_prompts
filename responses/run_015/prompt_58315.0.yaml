answer: |-
  Right, pull up a chair. Let's have a proper look at this. I've spent a lot of time thinking about how people make decisions when the future is uncertain, and I've spent enough time in places like Norfolk to know that a spreadsheet doesn't grow wheat.

  Your brother-in-law is talking about things called the Kelly Criterion and Ergodicity. He's right that the standard way economists teach risk is often wrong for people who have to survive in the real world. But he's wrapping it in gambling language. You're wrapping it in soil and seed. The soil is usually a better teacher.

  Here is how we are going to handle this. First, I'll lay out how I'm translating the maths into your fields. Then I'll walk through the argument using your life. Finally, I'll give you the residue report—telling you where the theory fits your boots and where it blisters.

  ### Part 1: The Mapping (Maths to Mud)

  Before we argue the point, we need to agree on the dictionary. Here is how the abstract risk theory translates to a mixed arable farm outside Norwich.

  | **Theoretical Concept** | **Farming Reality** |
  | :--- | :--- |
  | **Capital / Bankroll** | Your total farm equity + liquid cash + stored grain value. |
  | **Bet Size** | The acreage you commit to a specific crop (e.g., 50ha of Wheat vs. 50ha of Beet). |
  | **Odds / Edge** | Your advantage based on soil knowledge, local climate, and contract prices vs. the market average. |
  | **Expected Value (EV)** | The average profit per hectare if you could harvest the same year 1,000 times over. |
  | **Geometric Growth** | The actual rate your farm grows year-on-year, compounding profits into next year's seed and fertiliser. |
  | **Ruin** | Insolvency. The bank calls in the loan. You lose the tenancy or the freehold. Game over. |
  | **Time Averaging (Ergodicity)** | Living through 20 seasons sequentially vs. imagining 20 different farmers living one season each. |
  | **Log Utility** | The fact that losing your last £10k hurts more than gaining an extra £10k helps. |
  | **Kelly Criterion** | The optimal acreage split that maximizes growth without risking ruin. |

  ### Part 2: The Debate in the Field

  Let's imagine two farmers. We'll call them **Farmer Average** (the Economist) and **Farmer Compound** (the Kelly Bettor).

  **The Setup**
  It's autumn. You've got 100 hectares to plant.
  *   **Crop A (Wheat):** High reward. In a good year, it makes £800/ha. In a bad year (disease, price crash), it makes -£200/ha (you lose money on fertiliser and fuel). Let's say the odds are 50/50.
  *   **Crop B (Barley/Beet):** Lower reward. Steady. Makes £300/ha almost every year.

  **Farmer Average (The Expected Value Man)**
  He looks at the maths.
  *   Wheat Average: (0.5 × £800) + (0.5 × -£200) = **£300/ha**.
  *   Barley Average: **£300/ha**.

  He says, "The expected value is the same. But Wheat has higher upside. I'm going to plant 100 hectares of Wheat. If I get a run of good years, I'll be rich faster."
  Or, if Wheat averaged £350 and Barley £300, he'd say, "Plant 100% Wheat. Maximise the expected return."

  **Farmer Compound (The Kelly Man)**
  He looks at the timeline. He knows he can't harvest 1,000 farms at once. He has to harvest *this* farm, next year, and the year after.
  He says, "If I plant 100% Wheat and I get two bad years in a row, my capital drops. I can't pay the bank interest. I can't buy seed for year three. I'm ruined."

  Farmer Compound calculates the **Geometric Growth**. He knows that if you lose 50% of your capital, you need a 100% gain just to get back to even. Losses hurt more than gains help.
  So, he splits the field. Maybe 60 hectares Wheat, 40 hectares Beet.
  His average profit per year might look slightly lower on paper than Farmer Average's best-case scenario. But his *survival rate* is higher. He ensures that a bad harvest doesn't wipe out his ability to plant next year's crop.

  **The Philosophical Clash**
  Here is where your brother-in-law gets excited.

  1.  **The Economist's View:** They say Farmer Average is rational. If the "Expected Value" is positive, you should take the bet. If you don't, you're just "risk-averse." They treat risk aversion as a psychological feeling (like being scared of the dark). They say you should maximise wealth, and if you go bust, well, that's just bad luck.
  2.  **The Geometric View (Ole Peters, Kelly, etc.):** They say Farmer Average is *mathematically wrong* about how time works. They argue that "Expected Value" only works if you have infinite money or infinite parallel universes. Since you only have one farm and one timeline, the only rational thing to maximise is the **Growth Rate** of what you have.
      *   They argue that avoiding ruin isn't just a "feeling" (utility); it's a physical constraint. If you hit zero, you stop playing.
      *   Therefore, sizing your bet (acreage) to maximise geometric growth *is* the rational choice, not a cautious one.

  **In Your Terms:**
  The Economist says: "Plant all Wheat because the average price is higher."
  The Geometric Philosopher says: "Plant a mix, not because you're scared, but because 'Average Price' doesn't pay the bills in a bad year. Only 'Compounded Survival' keeps the farm in the family."

  You mentioned rotation. This is exactly it. If you plant continuous Wheat because the margin looks best on paper (Expected Value), you build up disease pressure (Take-all, eyespot). Eventually, yields crash. By rotating (diversifying bets), you sacrifice the theoretical maximum margin of continuous Wheat for the *sustainable* growth of the land over 20 years. That is Geometric Rationality.

  ### Part 3: The Residue Report

  Now, the honest bit. You asked me to tell you where this mapping works and where it breaks. As a philosopher of risk, I have to be precise about where the analogy holds water and where it leaks.

  **1. What Maps Cleanly (The Solid Ground)**
  *   **Ruin is Absorbing:** In betting, if you hit zero, you stop. In farming, if equity hits zero, the bank takes the keys. This is the core of the argument. The "Ergodicity" argument (that time matters more than averages) is perfectly captured by the fact that you cannot farm if you are insolvent.
  *   **Volatility Drag:** In betting, high volatility reduces compound growth. In farming, a year of -£200/ha sets you back more than a year of +£200/ha sets you forward, because you have fixed costs (loan repayments, machinery depreciation) that eat into the recovery.
  *   **Diversification as Bet Sizing:** Splitting acreage between Beet and Barley is functionally identical to splitting a bankroll between high-risk and low-risk bets to smooth the equity curve.

  **2. What Had to Be Fudged (The Rocky Patches)**
  *   **Discrete vs. Continuous:** Kelly betting assumes you can adjust your bet size instantly after every outcome. Farming is seasonal. You commit in autumn and harvest next summer. You can't mid-season correct if the price crashes in January. This makes farming *riskier* than the ideal Kelly model, meaning you should actually bet *smaller* (plant less high-risk crop) than pure Kelly suggests.
  *   **Fixed Costs & Illiquidity:** A bettor can keep 10% of their cash in reserve easily. A farmer has to maintain machinery, buildings, and land regardless of acreage. You can't easily sell half a combine harvester if you reduce acreage. This creates a "minimum viable scale" that pure maths ignores.
  *   **Correlation:** In betting, a roulette spin is independent of the last one. In farming, risks are correlated. If it's a wet harvest, *all* your crops suffer. If diesel prices spike, *all* your costs go up. The Kelly formula assumes independent bets. Farming risks are tangled together.

  **3. The Leftover Stuff (The Philosophical Debris)**
  There is a debate among the theorists about *why* Kelly works.
  *   **Camp A (Utility):** Says Kelly is just a shortcut for "I have a logarithmic utility function" (i.e., I care less about money as I get richer).
  *   **Camp B (Ergodicity):** Says it's not about feelings/utility, it's about the physics of time. Maximising geometric growth is objectively correct for a single timeline.

  **Does this matter to you?**
  Honestly? No.
  In the betting world, this distinction matters because some people want to claim they are being "objective" rather than "cautious."
  In farming, the distinction collapses. Whether you call it "maximising long-term growth" or "avoiding the pain of ruin," the action is the same: **Don't plant all your acreage to the crop with the highest volatile margin.**

  **4. Is Your Vocabulary Missing Something?**
  You asked if your farming vocabulary misses something important compared to theirs.
  Actually, I'd argue the opposite. Their vocabulary misses the **friction** that yours captures.
  *   **The "Edge":** A bettor assumes they know the odds. You know you *don't* know the odds. You know the weather is unknowable. The theorists argue about calculating the perfect fraction. You know that because your information is imperfect (weather, global markets), you must discount the bet size further. This is often called "Fractional Kelly" in finance, but in farming, we just call it "sleeping well at night."
  *   **The "Consumption" Problem:** A bettor can reinvest 100% of winnings. A farmer has to eat, pay school fees, and live. You withdraw capital from the system every year. This drastically changes the maths. Pure Kelly assumes compounding everything. Farming requires harvesting profit to live. This means the "optimal" growth rate is lower than the theorists say.

  ### The Verdict

  Your brother-in-law is right about the principle: **Maximising the average (Expected Value) is a trap if it risks wiping you out.** The economists who tell you to ignore ruin are modelling a world where you can restart after death.

  But you are right about the practice. The theorists argue over whether this is "utility" or "ergodicity." That is academic noise.
  *   **Ergodicity** just means: "You live your life one year after another, not all at once."
  *   **Kelly** just means: "Don't bet the farm."

  You've been practicing Geometric Rationality for twenty years without calling it that. When you say, *"Not risking the whole farm on one gamble whatever the agronomist says,"* you are rejecting Expected Value maximisation in favour of Survival and Compound Growth.

  The only thing their maths adds is a warning: If you find a crop or a contract where you have a genuine, calculable edge (maybe a specific beet seed variety that thrives on your specific soil type), the maths says you should plant *more* of it than your gut tells you, but *less* than the "all-in" economist tells you.

  But given the correlation of risks in farming (weather hits everything), my professional advice as a risk philosopher? Stick with your instinct. The "theoretical optimal" bet size assumes you know the odds. On a farm near Norwich, with the weather changing and markets shifting, nobody knows the odds. So you size your bets to survive a run of bad luck you can't even imagine. That's not just good betting; that's good farming.
