answer: |-
  # Q&A PREP SHEET: IDENTITY FRAGILITY & THE TWO-ZONE VIEW
  **Workshop Context:** EA/Longtermist + Population Axiology + Person-Affecting Skeptic.
  **Goal:** Defend the move from Non-Identity as "puzzle" to Non-Identity as "structural constraint on Longtermism."

  ## 1. UPFRONT CONCESSIONS (First 5 Minutes)
  *Do not wait for the specialists to corner you. Disarm the formal objections before they solidify.*

  **Say this:** "Two quick clarifications before we begin. First, I am not solving the Sorites problem for the boundary between the Near and Far Zones. I am arguing that the boundary exists and is morally relevant, not that it is sharp. Second, the 'fragility discount' is not a claim that fragile people have less moral status or rights *once they exist*; it is a claim about the comparative value of *bringing them into existence* versus *benefiting those who would exist anyway*. I am not discriminating against people; I am discriminating between acts of creation and acts of improvement."

  ## 2. THE ONE REPLY THAT MUST LAND
  **The Stake:** If this fails, Longtermists reject the Two-Zone view as unnecessary, and Person-Affecting theorists reject it as a betrayal.
  **The Point:** Longtermists cannot have both Person-Affecting Restrictions and Temporal Parity given Fragility.
  **The Reply:** "If Fragility is true, the Person-Affecting Restriction renders the far future morally silent. Longtermism claims the far future contains the bulk of expected value. Therefore, a Longtermist who holds the Person-Affecting Restriction is committed to the claim that the bulk of expected value is morally inaccessible. You must drop the Restriction to save the Longtermist project. My view just tells you *where* and *how* to drop it."
  **How to tell if it landed:** Watch the Longtermist cause-prioritizers. If they nod or take notes, you're safe. If the Person-Affecting theorist looks smug (because they think silencing the future is a feature, not a bug), you need to pivot to the "Extinction is Neutral" bullet they have to bite.

  ## 3. THE OBJECTIONS (Ordered by Likelihood & Damage)

  **1. The Aggregation Problem (The Killer)**
  *   **Who:** Longtermist Cause-Prioritizer / Axiologist.
  *   **Objection:** "If the Near Zone uses a Person-Affecting metric (changes in welfare) and the Far Zone uses an Impersonal metric (total/critical-level welfare), how do we aggregate them to choose between policies? You can't subtract 'harm to identifiable people' from 'creation of impersonal value.' This makes cause prioritization impossible."
  *   **Reply:** "We treat the Near Zone constraint as a side-constraint (deontological floor), not a currency to be summed. We maximize Impersonal Value in the Far Zone subject to the Person-Affecting constraints in the Near Zone. It's a lexical priority, not a single scale."
  *   **Soft Spot:** Lexical priorities often lead to absurdities (e.g., tiny near-term harms blocking massive far-term gains). You haven't defended lexicality.

  **2. The "Fragility Discount" Justification**
  *   **Who:** Population Axiologist / Longtermist.
  *   **Objection:** "Why does counterfactual fragility reduce moral weight? If two people have identical welfare, why does the one whose existence depended on a coin flip count for less in the axiology? This looks like ad-hocery to avoid the Repugnant Conclusion."
  *   **Reply:** "It's not about their worth, it's about the *source* of the value. Creating value by determining *who* exists is morally thinner than creating value by improving lives for those who would exist anyway. It captures the intuition behind the Asymmetry without the formal costs."
  *   **Soft Spot:** 'Morally thinner' is a metaphor, not a mechanism. You need to cash this out if pressed.

  **3. The Person-Affecting Diehard's Bullet**
  *   **Who:** The Person-Affecting Theorist.
  *   **Objection:** "If Fragility makes the Person-Affecting View silent on the far future, so be it. That's better than accepting the Impersonal View, which implies we have a duty to create miserable people if their lives are worth living. I'd rather accept that extinction is neutral than that creating people is good."
  *   **Reply:** "That works for pure theory, but not for policy. If extinction is neutral, then preventing an X-risk that kills 8 billion people but replaces them with a different 10 billion happy people has *no* positive value. That contradicts the core EA intuition that saving lives is good. You lose the ability to condemn extinction."
  *   **Soft Spot:** They might bite this bullet (Extinction is Neutral). If they do, you have no leverage left.

  **4. The Boundary Sorites**
  *   **Who:** Population Axiologist / Grad Student.
  *   **Objection:** "You say the half-life is decades. What about a policy that affects people in 60 years vs 70 years? Is there a sharp cliff where moral status changes? If not, your view is vague; if so, it's arbitrary."
  *   **Reply:** "It's a vague boundary, like 'bald' or 'tall.' We deal with vagueness in law and ethics all the time. We use heuristics. The existence of a gray zone doesn't negate the difference between the clear Near cases and clear Far cases."
  *   **Soft Spot:** In formal axiology, vagueness often breaks transitivity. They know this; you're hoping they don't press the formal consequence.

  **5. Temporal Parity in Disguise**
  *   **Who:** Longtermist Researcher.
  *   **Objection:** "You claim to reject Temporal Parity, but your 'Fragility Discount' effectively acts like a pure time discount rate. Aren't you just smuggling in discounting because you don't like the implications of parity?"
  *   **Reply:** "No. Time discounting values a life less because it is later. My discount values a life less because its *existence* was contingent on the choice. A person in 200 years whose existence was fixed by prior causes counts fully; a person in 50 years whose existence hinged on this policy counts less. It's about identity, not time."
  *   **Soft Spot:** Empirically, fragility correlates with time. The practical output looks identical to discounting.

  **6. The Empirical Claim (Fragility)**
  *   **Who:** Grad Student / Skeptical Researcher.
  *   **Objection:** "Is it actually true that identity half-life is decades? What about genetic essentialism? If the same sperm and egg meet, isn't the identity fixed regardless of policy shifts?"
  *   **Reply:** "Policies shift timing of conception. A shift in energy prices changes when parents meet by minutes. In human reproduction, minutes change the gametes. The chaos theory of conception is well-established. The half-life is short."
  *   **Soft Spot:** If they bring up twinning or delayed implantation, you might get bogged down in biology. Keep it high-level.

  **7. The "Same Number" Intuition**
  *   **Who:** Axiologist.
  *   **Objection:** "In Same Number cases (where the same people exist in both options), your view collapses to standard Person-Affecting. In Different Number cases, it collapses to Totalism with a discount. Why not just use Critical-Level Utilitarianism everywhere and skip the Two-Zone complexity?"
  *   **Reply:** "Because Critical-Level views violate the Person-Affecting intuition in the Near Zone (implying we can harm existing people to create new, high-welfare people). The Two-Zone view preserves the intuition where it's strongest (Near) and sacrifices it where it's paralyzing (Far)."
  *   **Soft Spot:** This admits the view is inconsistent across zones. They will call this a bug, not a feature.

  **8. Rights of the Fragile**
  *   **Who:** Grad Student / Ethicist.
  *   **Objection:** "If I exist in the Far Zone, do I have fewer rights? Can you kill me more easily because my existence was fragile?"
  *   **Reply:** "No. The discount applies to the *decision to create*, not the *treatment of the created*. Once you exist, you are in the 'identifiable' set for future decisions. It's a procreative ethic, not a homicide ethic."
  *   **Soft Spot:** This requires a dynamic view of moral status that changes as time passes. It's philosophically costly.

  **9. The Flow-Through Effect**
  *   **Who:** Longtermist Cause-Prioritizer.
  *   **Objection:** "Most longtermist value comes from flow-through effects (changing the trajectory). These effects necessarily change who exists. Doesn't your view imply that trajectory changes have *less* value than direct welfare improvements, undermining the case for X-risk reduction?"
  *   **Reply:** "Yes, it implies that. But it still values them positively. It just says that preventing extinction is less valuable than standard Totalism says, because the saved people are 'fragile.' This is a feature: it reduces the counterintuitive demand to maximize population at all costs."
  *   **Soft Spot:** This might lower the EV of X-risk reduction below near-term global health priorities, breaking the Longtermist thesis.

  **10. The "Obvious" Parfit Question**
  *   **Who:** Grad Student (who read one chapter).
  *   **Objection:** "Isn't this just the Non-Identity Problem? Parfit already said we can't use Person-Affecting views for the future."
  *   **Reply:** "Parfit treated it as a problem for specific cases (the 14-year-old girl). I'm arguing it's the *default state* of all long-term policy. Parfit asked how to fix the theory; I'm arguing we should split the theory into two zones based on the degree of identity dependence."
  *   **Soft Spot:** None really, just a clarification task.

  ## 4. THE QUESTION I HOPE NOBODY ASKS
  **The Question:** "If the Near Zone constraint is lexical (a side-constraint), doesn't that mean a trivial harm to an identifiable person today blocks a policy that prevents the extinction of humanity (creating billions of fragile future people)? Does your view forbid sacrificing the present to save the future?"
  **The Honest Answer:** "Strictly speaking, yes. If the Near Zone constraint is absolute, you cannot violate the rights of identifiable people to create fragile future people. However, I argue the constraint is not absolute but weighted. But if I weight it, I need a conversion rate between Near Harm and Far Creation, which returns me to the Aggregation Problem."
  **Assessment:** This breaks the view. It forces you to either accept absurd near-term prioritization (saving 1 person now over 1 billion later) or admit the Two-Zone view collapses into a single metric (which you said was impossible).
  **Defense:** "I argue the constraint is *strong* but not *lexical*. We use the Impersonal View to break ties when Near Zone harms are negligible. But I concede this is the weakest point of the architecture."

  ## 5. THE ONE OBJECTION THAT ACTUALLY BREAKS THE ARGUMENT
  **The "Incommensurability" Objection.**
  *   **Why it breaks it:** Your view relies on being able to prioritize causes (EA core). If Near Zone value (Person-Affecting welfare changes) and Far Zone value (Impersonal fragile creation) are fundamentally different *kinds* of value, you cannot calculate Expected Value across them. You cannot tell an EA donor whether to fund AI safety (Far Zone, high fragility) or Malaria nets (Near Zone, low fragility).
  *   **Why you won't get it:** Most people assume you can just "add them up" or prioritize one lexically. They won't notice that lexical priority makes Longtermism impossible (see Question 4 above), and adding them up requires a common denominator you explicitly denied exists.
  *   **Preparation:** If someone smells this, pivot hard to "Heuristics." Admit you don't have a formal calculus yet, but argue that *qualitatively* distinguishing the zones prevents the worst abuses of Totalism while allowing *some* long-term planning. Don't try to solve the math live.
