  **To:** Interpretation and Visitor Experience Committee
  **From:** [Your Name], PhD Candidate
  **Date:** 12 May 2024
  **Subject:** Recommendations for Object Labels 7 and 9 (Xi'an Loan)

  **Bottom Line**
  I recommend we reject both the Curator's provocative draft and the Learning Team's simplification. Instead, we should adopt a 'question-based' approach that foregrounds the linguistic puzzle without making false zoological claims. This satisfies the plain-language policy, avoids parental complaints, and remains faithful to the partner museum's catalogue. Below are the proposed texts and a guiding principle for the remaining objects.

  **Proposed Label Text**
  **Object 7 (Tang Horse):** 'Gongsun Long asked: does the name 'white horse' mean the same as 'horse'? If you ask for a horse, a yellow one will do. If you ask for a white horse, it will not. He argued the names pick out different things.'

  **Object 9 (Marble Stone):** 'Look at this stone. Your eyes see white; your hand feels hard. Gongsun Long argued these qualities arrive separately in our minds. Is the stone one thing, or many?'

  **Guiding Principle**
  For the remaining ten objects, please apply this rule: **'State the puzzle, not the verdict.'** Labels should describe the question the object raises for the philosopher, rather than asserting their conclusion as fact. This keeps texts accessible (visitors love a mystery) while protecting us from endorsing paradoxical claims as literal truth. It allows us to cite the partner catalogue's strong claims as 'arguments' rather than 'facts', reconciling our plain-language policy with their printed material.

  **The Case for the Curator's Draft**
  I must acknowledge the strength of the Curator's original suggestion: 'Gongsun Long would have said this is not a horse.' This is undeniably the superior hook. Our dwell-time data confirms that bafflement drives engagement; visitors stop longer when challenged. By softening the claim to a linguistic quibble, we risk sanitising the exhibition into banality. The Curator's version forces a double-take that aligns with the partner museum's bold catalogue. If our primary metric were solely attention, their draft would win. However, in a university museum, accuracy and accessibility must temper intrigue. A nine-year-old told 'this is not a horse' is not engaged; they are corrected. My recommendation sacrifices some 'stop power' to ensure visitors leave feeling clever rather than confused, but we must accept that safer labels may move slightly faster.

  **Next Steps**
  These texts are ready for the printer on the 14th. I am available to apply the 'puzzle not verdict' principle to the remaining labels this afternoon if required.

  **Signed,**
  [Your Name]
