answer: |-
  Here's the bottom line: Mixing claim-rights and liberty-rights turns a negotiable policy trade-off into an irreconcilable moral war, while shadow zoning demonstrates that legal supply changes fail when social entitlements enforce scarcity regardless of the law.

  Here's the breakdown of why that distinction matters and how it breaks the economic model.

  **The Rights Trap**
  In legal theory, a **liberty-right** means you are free to do something and no one can stop you (e.g., "I have the right to build a duplex on my lot"). A **claim-right** means someone else has a duty to provide you something or protect a status quo (e.g., "The city owes me stable neighborhood character" or "Citizens have a right to affordable housing").

  The NIMBY vs. YIMBY framing collapses because both sides swap these definitions to win arguments. NIMBYs often treat their desire for stability as a liberty-right ("It's my property rights!") when it's actually a claim-right (they want the city to enforce the status quo for them). YIMBYs treat building as a liberty-right ("Let us build!") but expect it to fulfill a claim-right outcome (affordability). When you mix these up, you can't negotiate. You can't trade off a "freedom" against an "entitlement" because both sides feel they are defending absolute moral imperatives rather than competing policy interests.

  **The Scarcity Glitch**
  The standard economist argument is simple: Zoning laws restrict supply (artificial scarcity) → Prices go up. Therefore, Upzoning → More Supply → Prices go down. This model assumes that legal liberty-rights (the permission to build) are the only bottleneck.

  "Shadow zoning" breaks this because it introduces non-legal bottlenecks. These are the unwritten rules: community board delays, historic preservation threats, social shaming, or costly litigation threats that long-time owners wield. Even if the law grants you the liberty-right to build, shadow zoning enforces a social claim-right to the neighborhood's existing form. This means scarcity isn't just created by the legal code; it's maintained by social enforcement mechanisms that survive upzoning.

  **The Dependency**
  Here is the link between the two: The economist scarcity argument *depends* on liberty-rights being the dominant force in the market. It assumes that if the law says "yes," the building happens. But the rights confusion *creates* the environment where shadow zoning thrives. Because residents believe they hold a claim-right to their neighborhood's character (rather than just a liberty-right to their own lot), they feel morally justified using shadow zoning to block your liberty-right to build.

  So, the scarcity argument fails not just because of laws, but because the blurred rights distinction empowers residents to enforce social scarcity against legal liberty. Upzoning changes the law, but it doesn't change the perceived entitlements that drive shadow zoning.

  Verdict: Upzoning fails to fix scarcity when social claim-rights empower neighbors to enforce shadow zoning against your legal liberty-rights.
