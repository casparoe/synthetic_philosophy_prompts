  8.  **Final Polish:** Ensure the tone is collaborative but rigorous. Use the "Map" metaphor the user requested. (Safe zones vs. Danger zones).

      *(Self-Correction on the Statue/Clay)*: The user asked to skip standard statue/clay unless it *really* breaks it. I should focus on whether the *clay parts* depend on each other. They don't functionally. So MDL says the statue isn't an object, only the clay is. This aligns with van Inwagen's "Life" criterion but excludes artifacts unless they are active. Wait, the user says laptop *is* an object. So they allow artifacts. This means "function" is key. But rocks don't have function. So rocks aren't objects? That's a big bullet to bite.

