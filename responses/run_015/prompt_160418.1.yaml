answer: |-
  **Exam Question**

  **Time Allowed:** 45 Minutes
  **Word Limit:** None (Manage your time accordingly)

  **Question 1:**
  Consider the "Coincident Twins" scenario: a universe containing exactly two spheres, alike in every intrinsic respect, occupying the *same* spatial region at the *same* time, with zero distance between them and no causal interaction. In this world, every qualitative relation each sphere bears to the other, it also bears to itself.

  Write an essay that addresses the following four requirements:
  1.  State the Principle of Identity of Indiscernibles (PII) over a suitably restricted domain of properties, explaining why the unrestricted version is trivial or circular.
  2.  Explain why the "weak discernibility" reply to Max Black's original two-sphere universe fails against the Coincident Twins, specifically regarding irreflexive relations.
  3.  Articulate what a defender of Black's spheres must now claim about the Twins to maintain distinctness, ensuring this claim does not simply reapply the principle under test.
  4.  Provide an account of the philosophical function of PII (for Leibniz and contemporary metaphysics) such that the essay does not conclude merely that Black refuted the principle.

  ***

  **Model Answer**

  The Principle of Identity of Indiscernibles (PII) states that necessarily, for any objects $x$ and $y$, if $x$ and $y$ share all properties, then $x$ is identical to $y$. To avoid triviality, the domain of properties must be restricted to *qualitative* properties, excluding haecceities like "being identical to $x$." If the unrestricted version allowed such properties, $x$ would always differ from $y$ by the property of "being $x$," rendering PII analytically true but metaphysically empty. It would define identity rather than ground it. A substantive PII requires that numerical distinctness supervene on qualitative difference.

  Max Black's original counterexample featured two symmetric spheres separated by distance. Proponents of PII often salvage the principle via "weak discernibility," noting the spheres stand in an irreflexive relation (e.g., "being five miles from"). Since nothing can be five miles from itself, the spheres are discernible by their relations. However, the Coincident Twins scenario blocks this move. Because the Twins occupy the same region, every relation one bears to the other is reflexive (e.g., "being coincident with"). There are no irreflexive relations available to ground weak discernibility. Consequently, the only remaining difference between the Twins is numerical difference itself. To claim they are distinct because they are "two" is to beg the question; numerical diversity is the *explanandum*, not the *explanans*. Without qualitative grounding, the distinction is brute.

  A defender of Black's spheres who accepts the possibility of the Coincident Twins must therefore abandon PII. They cannot claim the Twins are distinct based on qualitative facts, as ex hypothesi there are none. Instead, they must endorse haecceitism or primitive thisness. This view holds that objects possess a non-qualitative individual essence that grounds their distinctness independent of their properties. This claim does not reapply PII; rather, it explicitly denies PII's core supervenience claim. It asserts that reality can contain distinct individuals that differ in no qualitative respect, meaning identity is a fundamental metaphysical category not reducible to quality.

  However, concluding that Black (and the Twins) simply refuted PII misses the principle's philosophical function. For Leibniz, PII was a consequence of the Principle of Sufficient Reason. If two entities were qualitatively identical yet distinct, there would be no sufficient reason for God to place them in different states or locations; the universe would contain brute, inexplicable facts. For contemporary metaphysics, PII serves as a constraint on ontological parsimony. It prevents the proliferation of entities without explanatory gain. Even if the Coincident Twins are metaphysically possible, their possibility highlights the cost of accepting brute distinctness. Thus, PII remains valuable not necessarily as a necessary truth, but as a methodological rule: we should not multiply entities beyond qualitative necessity. Black's spheres show PII is not logically necessary, but the Twins show that rejecting it requires accepting primitive thisness, a significant theoretical cost.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Pass Threshold:** 10/20

  | **Criterion** | **Marks** | **Common Error** |
  | :--- | :---: | :--- |
  | **1. PII Formulation & Restriction**<br>Correctly states PII and restricts properties to qualitative ones (excluding haecceities/identity properties). | 4 | Candidates include "being identical to x" as a valid property, making PII trivial. |
  | **2. Triviality/Circularity Explanation**<br>Explains that unrestricted PII defines rather than grounds identity, rendering it analytically true but useless. | 4 | Candidates claim unrestricted PII is "false" rather than circular or tautological. |
  | **3. Weak Discernibility & Irreflexivity**<br>Distinguishes Black's case (irreflexive spatial relations) from Twins (reflexive relations), showing why weak discernibility fails here. | 4 | Candidates argue distance is intrinsic or fail to see why coincidence blocks irreflexive relations. |
  | **4. The Defender's Commitment**<br>Identifies that defending distinctness here requires haecceitism/primitive thisness, not just asserting "they are two." | 4 | Candidates claim the defender can just appeal to "numerical difference" without grounding it. |
  | **5. Teleology of PII**<br>Explains PII's role (Sufficient Reason/Parsimony) so the conclusion isn't merely "PII is false." | 4 | Candidates end the essay by simply stating Black proved PII wrong without discussing its function. |
