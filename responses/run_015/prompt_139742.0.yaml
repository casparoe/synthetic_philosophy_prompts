answer: |-
  TO: Accountability Committee
  FROM: Committee Chair
  RE: Disposition of Cases R. and T. and Revision of Integrity Standards

  The committee should clear Anke R. of misconduct, issue a formal warning to Marcus T. for procedural non-disclosure, and immediately convene a working group to amend the escalation protocol.

  Anke, you followed the Code as written. You are not culpable for the Code's rigidity, nor for the unforeseen consequences of a rule you did not write. You will face no sanction. However, your assertion that the Code left you no room to slow down identifies a systemic failure, not a personal virtue. Your office will lead the review of the escalation path to ensure future officers can request proportionality reviews before termination triggers.

  Marcus, your moral reasoning regarding the teachers is noted, but your method undermined the institution. You treated the Integrity Code as a private contract rather than a public covenant. You receive a formal warning for failing to disclose your objection before acting. You may keep your position, but your personnel file will reflect that you bypassed the chain of command.

  For future cases, we adopt a standard balancing the Aggregation Argument and the Publicity Condition. Rules represent compressed judgment; they are the residue of institutional learning and the fixed point around which partners arrange expectations. Overriding them carries an epistemic burden: the objector must demonstrate what the rule's authors could not weigh. Marcus, you met this burden regarding values—livelihoods versus bookkeeping—but not regarding institutional trust. Aggregation works for information, but values cannot be summed by one person. There is no unit in which the weight the Code assigns to compliance and the weight you assign to forty-one teachers can be objectively totaled. Yet, even valid value judgments cannot bypass the Publicity Condition. An appeal of conscience is a claim on others; made only in a private memorandum, it is unfalsifiable. To claim conscientious non-compliance in the future, an officer must declare the objection to the Committee *before* the breach, allowing the institution to revise or refuse. Silence is not conscience; it is retroactive self-exculpation.

  We must acknowledge the strongest case against this ruling. To clear Anke risks endorsing "innocence by arrangement," where staff follow rules while refusing to notice their effects. A system with no room for proportionality will eventually do something obscene in the name of tidiness, training staff not to see the harm they cause. We accept this risk only because we are simultaneously building a valve: the proportionality review Anke was denied will now exist. Conversely, to censure Marcus invites the charge that a conscience is only real if tested at the time. We agree. That is why his secrecy, not his judgment, is sanctioned. An institution cannot build a practice on untested private judgments, but it also cannot survive if it demands complicity in harm. The warning strikes the balance: we preserve the right to object, but we demand the courage to object openly.

  Finally, to the Committee: Fidelity to the shared rule must remain the working default. Without it, we are not an organization but a collection of sovereigns. The strongest argument for the alternative is that rules are tools for human ends, not ends in themselves. Regarding the German tradition: Kant's insistence that the moral law is self-given does not validate private whim. The postwar repudiation of "an order is an order" requires public reason, not private memorandum. Autonomy in an institution means legislating for the community, not exempting oneself from it. We honor that tradition by making the challenge public, so that the rule, not the individual, remains the site of our integrity.
