          4.  Present the Conciliatory/Total-Evidence view (why move credence, plausible new level).
          5.  Present the Steadfast view (why keep credence, screening off vs. defeat).
          6.  **Crucial:** Determine if there is a *real disagreement* about what to believe or just a descriptive difference.
          7.  **Crucial:** Pick a side (which is more defensible) and steelman the losing side.

