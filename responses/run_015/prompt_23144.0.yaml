      *   *HOE Trigger:* Discovery about a pilot study (sloppy lab, positive result $H_1$) + Discovery about *your* role (you designed the instrument) + Discovery about *your* psychology (unconscious tendency to bias instruments toward $H_1$).
      *   *Tension:* Your data says $H_0$, but your process for gathering that data might be rigged toward $H_1$. If the data says $H_0$ *despite* the rigging, does that mean $H_0$ is super strong? Or does it mean your reading of the data is compromised?

