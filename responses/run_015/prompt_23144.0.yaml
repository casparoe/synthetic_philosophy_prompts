      *   Prompt: "data... strongly support the null hypothesis."
      *   Prompt: "unconscious tendency to calibrate such instruments to flatter the hypothesis I am testing" (i.e., flatter $H_1$, the positive result).
      *   Prompt: Pilot study (sloppy) found $H_1$.
      *   Prompt: You designed the instrument used in *both* (implied: "shared measurement instrument they used... I was the one who designed").
      *   *The Twist:* If you biased the instrument to find $H_1$, but your careful experiment *still* found $H_0$, that actually looks like *stronger* evidence for $H_0$ (the "anti-boost" argument). However, standard HOE cases usually suggest you should lower confidence because your reasoning is compromised.
      *   *Correction/Refinement:* In standard HOE cases (like the drug that makes you bad at math), the HOE suggests you might have processed the FOE incorrectly. Here, the HOE suggests the *data generation* was biased.
      *   *Epistemic Nuance:* If the instrument is biased toward $H_1$, and the result is $H_0$, does that undermine my belief in $H_0$?
