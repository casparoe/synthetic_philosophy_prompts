answer: |-
  **RESEARCH INTEGRITY REVIEW PANEL: DECISION PROTOCOL V1.0**

  **Purpose:** To distinguish evidence bearing on the reliability of findings from considerations bearing on the consequences of our actions. This protocol ensures our recommendations reflect evidentiary standards rather than institutional pressure.

  **I. THE DECISION TREE**

  **Step 1: The Threshold of Inquiry**
  *Question:* Does the allegation contain specific, testable claims regarding data fabrication, falsification, or plagiarism?
  *   **Yes:** Proceed to Step 2. *[Procedure: Binary Rule]*
  *   **No:** Close matter. *[Procedure: Binary Rule]*
  *   *Note:* Allegations of "bad science" or honest error without misconduct intent do not pass this threshold unless they involve data manipulation.

  **Step 2: The Reliability Check (Right-Kind Reasons)**
  *Question:* Is there independent evidence that reduces confidence in the finding's reliability (e.g., statistical error, image manipulation confirmed by forensic review, unavailable raw data where required)?
  *   **Yes:** Proceed to Step 3. *[Procedure: Binary Rule]*
  *   **No:** **STOP.** Do not reduce confidence in the finding. *[Procedure: Binary Rule]*
  *   *Constraint:* Absence of exonerating data is not evidence of guilt. Cooperation by authors is not evidence of reliability. *[Procedure: Asymmetry Rule]*
  *   *Marker:* If the only reasons to proceed are press coverage, complainant volatility, or funder interest, these are **[Judgment: Wrong-Kind Reasons]** and cannot justify Step 3.

  **Step 3: The Stakes Flag**
  *Question:* Does the finding underwrite clinical guidelines, public policy, or significant subsequent literature?
  *   **Yes:** Flag for High Stakes. *[Judgment: Contextual Assessment]*
  *   **No:** Standard Stakes.
  *   *Protocol:* High Stakes does not lower the bar for evidence (Step 2). It raises the cost of inaction. This distinction must be explicit in the final memo. *[Procedure: Separation Rule]*

  **Step 4: The Sanction Vote (Wrong-Kind Reasons)**
  *Question:* Given the reliability assessment in Step 2, what action minimizes harm while preserving record integrity?
  *   **Options:** Close, Request Materials, Note on Record, Retraction, Referral.
  *   *Constraint:* If Step 2 was "No," options are limited to "Close" or "Request Materials" for clarification only. You cannot place a Note or recommend Retraction without Step 2 confirmation. *[Procedure: Binding Constraint]*
  *   *Considerations:* Career damage to juniors, funder reactions, and legal exposure are relevant here only, not in Step 2. *[Judgment: Value Weighing]*

  **Step 5: The Public Record**
  *Question:* Does the draft recommendation give readers evidence for doubt, or merely announce our decision?
  *   **Requirement:** The text must cite the specific reliability failure (Step 2). If none exists, the text cannot imply doubt. *[Procedure: Transparency Rule]*

  **II. SPECIAL PROVISIONS**

  **A. Laundered Reasons**
  Prior Panel actions based on pressure (Wrong-Kind Reasons) cannot serve as evidence for current reliability.
  *   *Rule:* If a new file cites a prior Panel flag as corroboration, the Panel must verify the evidentiary basis of the prior flag. *[Procedure: Verification Rule]*
  *   *Obligation:* If the prior flag lacked Step 2 evidence, the current record must state that the prior flag carries no evidentiary weight. *[Procedure: Correction Rule]*

  **B. Committee Attitude vs. Public Statement**
  The Panel does not hold beliefs; it issues statements.
  *   *Rule:* We do not vote on what we "feel" is right. We vote on what reasons the public record will contain. *[Procedure: Output Focus]*
  *   *Risk:* If we act on consequences (Step 4) but write as if we acted on evidence (Step 2), we deceive the readership. *[Judgment: Ethical Boundary]*

  **III. LIMITATIONS**

  This procedure cannot:
  1.  **Compel Data:** We rely on voluntary compliance. If authors withhold data, we record "Unable to Verify," not "Fabrication." *[Procedure: Limit]*
  2.  **Resolve Moral Conflicts:** If preserving a center's funding requires ignoring a confirmed error, this procedure forces us to record the error but cannot stop the Vice Provost from overriding us. *[Judgment: Institutional Reality]*
  3.  **Eliminate Discretion:** Step 4 remains a value judgment. This protocol prevents those values from masquerading as evidence. *[Procedure: Scope Limit]*

  **IV. APPLIED EXAMPLES**

  **Case 1: Anonymous Dossier (Image Manipulation)**
  *   **Step 1:** Yes, specific claims.
  *   **Step 2:** Forensic review inconclusive; raw data partially lost. No independent evidence of unreliability. **STOP.**
  *   **Step 4:** Chair desires a note to show responsiveness (Wrong-Kind). Protocol forbids a Note implying doubt.
  *   **Outcome:** Close with no public action. If a Note is issued, it must read "Inquiry Closed: Evidence Insufficient," not "Note of Concern."
  *   **Analysis:** Press coverage and Chair's desire are Wrong-Kind reasons. They justify communication strategy, not doubt.

  **Case 2: Undisputed Analytical Error (Clinical Guideline)**
  *   **Step 1:** Yes, error conceded.
  *   **Step 2:** Statistician confirms claim does not follow. Reliability reduced. **Proceed.**
  *   **Step 3:** High Stakes (Clinical Guideline). Flagged.
  *   **Step 4:** Sanction Vote. Junior author protection and Funder review are Wrong-Kind reasons regarding *truth*, but valid for *sanction*.
  *   **Outcome:** Recommend Correction/Retraction based on Step 2. Vote may soften the *tone* to protect the junior, but cannot hide the error.
  *   **Analysis:** High Stakes raises the cost of error but does not change Step 2. The procedure prevents suppressing the error to save funding.

  **Case 3: The Laundering Case (Prior Flag)**
  *   **Step 1:** Yes, new allegation.
  *   **Step 2:** New file cites prior Panel flag as corroboration.
  *   **Provision A Check:** Review prior flag. Minutes show prior flag was driven by foundation pressure (Wrong-Kind).
  *   **Rule:** Prior flag carries zero evidentiary weight.
  *   **Outcome:** If the new file relies on the prior flag to meet Step 2, **STOP**.
  *   **Obligation:** The current memo must state: "The Panel's prior action on [Lab X] was administrative and does not constitute evidence of reliability failure."
  *   **Analysis:** This commits the Panel to correcting the record. The prior flag is "laundered" pressure. Treating it as evidence violates Step 2.

  **V. MEMBER ACKNOWLEDGEMENT**

  By adopting this protocol, the Panel acknowledges that protecting the institution sometimes requires actions based on consequences (Step 4), but never at the expense of misrepresenting evidence (Step 2). We distinguish what we know from what we fear.

  *[End of Protocol]*
