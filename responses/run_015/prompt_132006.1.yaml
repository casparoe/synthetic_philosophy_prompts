answer: |-
  Subject: Stress-testing the Present Tense Rule

  Thanks for sending this over. It is a clean intuition, and I can see why it appeals to you for a Nomic environment where you want the game to keep moving rather than bog down in metaphysical disputes about validity. You are essentially proposing a temporal firewall: what is done is done, and the procedure that did it is safe from subsequent revision. It treats the rule set like a log of immutable transactions rather than a coherent static structure. I have spent some time trying to break it, and I think there are three main areas of stress, ranging from merely awkward to potentially fatal, followed by a verdict on whether this view survives contact with reality or just retreats into tautology.

  The first thing to hand you is the concrete sequence you asked for, the slow detonation that bypasses obvious retroactivity. Imagine your game is running under a simple majority threshold. In a single turn, two proposals are voted on and both achieve sixty percent support. Proposal Alpha says The voting threshold for all future rules is now one hundred percent. Proposal Beta says The voting threshold for all future rules is now ten percent. Under your Present Tense Rule, both proposals are validly enacted because at the moment their enactment was complete, the condition was a simple majority, which both satisfied. Neither rule reaches back to alter the conditions of its own birth. However, you now have a rule set that contains a direct contradiction regarding the procedure for future enactment. Is the threshold one hundred percent or ten percent? Your rule does not tell us. It prevents a rule from invalidating its own past, but it does not prevent two valid rules from invalidating each other's future effect. This leaves the game state undecidable without a secondary priority mechanism. You might wave this off by saying inconsistent rule sets are a problem for ordinary amendment too, and you are right, but this shows your rule does not solve the problem of consistency, only the problem of self-validity. It is an awkward cost because you will still need a tie-breaker, like a priority order, which brings you partway back to the standard fix you are trying to avoid.

  A sharper version of that same problem involves mutually conditional validity. Suppose Proposal One states This rule is valid only if Proposal Two fails to pass. Suppose Proposal Two states This rule is valid only if Proposal One fails to pass. Both pass by majority in the same turn. Under the Present Tense Rule, the enactment conditions for both were satisfied at the moment of voting. The rules are in force. But their content makes their continued validity logically incompatible. You have created a state where two rules are simultaneously enacted but cannot simultaneously be valid according to their own terms. This is not a paradox of self-reference in the enactment phase, which you have blocked, but it is a paradox of coherence in the operational phase. It leaves the Judge with no logical way to determine which rule governs, forcing a arbitrary decision. This ranks as moderately damaging because it shows that blocking retroactive reach-back does not prevent logical deadlocks from emerging sequentially.

  The second area, and I think this is the fatal flaw, concerns the status of the Present Tense Rule itself. You claim this rule dissolves the problem of unamendable rules, but for the Present Tense Rule to do the work you want, it must itself be immune to the very reach-back it forbids. If the Present Tense Rule is just ordinary Rule Number One, can it be repealed by Rule Number Two? If yes, then a player can propose a rule that says The Present Tense Rule is repealed and retroactive enactment is permitted. If that repeal passes, the shield is down, and all the old paradoxes return. The system is only safe as long as the Present Tense Rule survives, but you have given it no armor. If you say no, it cannot be repealed, then you have implicitly entrenched it. You have created a super-rule that governs the conditions of enactment and stands outside the system it governs. This smuggles in exactly the stable notion of hierarchy you claimed to dissolve. You have not eliminated the unamendable rule; you have just hidden it in the definition of time. You might concede this cost by saying that every system needs a basic rule of recognition that is hard to change, but then you must admit you have not solved the philosophical problem of sovereignty, you have just kicked it up one level. This is the most damaging point because it suggests your view is only coherent if it is qualified into something it cannot lose, which risks making it a tautology.

  On the question of real legal orders, the picture is mixed but leans against your strict no-reach-back picture. Real constitutions often contain eternity clauses that attempt to bind the future, and while courts sometimes strike down amendments that violate these clauses, they often do so based on political power or basic structure doctrines rather than a clean temporal logic. More importantly, legal systems frequently use curative statutes that retroactively validate actions that were void when taken. They get away with it because the legal community accepts the fiction. This suggests that the paradoxes of self-reference are not logical errors that need fixing, but political tensions that get managed. Your rule treats them as bugs; real law treats them as features that allow systems to survive revolutions without breaking continuity. If you hard-code the Present Tense Rule, you might make the game logically cleaner but politically brittle, preventing the kind of creative rewriting that makes Nomic fun. This is less a logical refutation and more a pragmatic warning that your rule imposes a rigidity that real systems avoid.

  Comparing your rule to the standard fix of priority and entrenchment, there is a clear case where they give opposite answers. Consider a rule that tries to make itself unamendable. The standard fix says this rule is invalid if it did not follow the entrenched procedure for amendment, or it is valid but the entrenchment clause is ignored because a later sovereign act overrides it. Your Present Tense Rule says the rule is validly enacted because it met the conditions at the time, but the clause claiming unamendability is ineffective because it attempts to alter the conditions for a future enactment. So under the standard fix, the rule might be void ab initio. Under your rule, the rule exists but lacks the power it claims. This is actually a point in your favor for a game, because it keeps the rule set finite and avoids voiding player actions, which feels bad. However, it leaves the rule book cluttered with zombie rules that claim powers they do not have.

  My honest verdict is that your view works well as a procedural heuristic for a game but fails as a general solution to legal self-reference. It qualifies the problem away by defining enactment as a discrete, immutable event, which is fine for a server log but ignores that legal validity is often a continuous social fact rather than a timestamp. You have not stopped the reach-back; you have just defined it out of existence by fiat. That is fine for Nomic, where you are the designer and can impose fiat, but do not claim it solves the philosophical puzzle. It solves the puzzle by refusing to let the puzzle be asked. If you build this into the rule set, expect players to test the definition of when enactment is complete. If you say it is when the vote closes, they will argue about server latency. If you say it is when the Judge announces it, they will argue about the Judge's discretion. The paradox moves from the rules to the meta-rules of administration. I think you should implement it, but concede that it is a convention to keep the game playable, not a logical truth that dissolves paradox. It is a feature, not a proof.
