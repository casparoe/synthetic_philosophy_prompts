prompt: |-
  ok so i just had this exhausting argument with my friend about whether corruption is just whatever the world bank says it is, and now im scrambling to prep for a podcast interview next tuesday. my guest is this political anthropolgist who argues that clientelism and gift-giving in patronage societies arent corruption at all, theyre just a different moral economy of obligation, and he thinks western anti-corruption metrics basically smuggle in a contractualist framework that doesnt fit relational societies.

  i need like 6 or 7 questions that actually press him, not just tell us your view. specifically:

  - one on the obvious objection that these gifts still distort public resource allocation, with a follow-up that anticipates his likely dodge (probably that resources were never neutrally allocated to begin with).
  - one on whether his framework makes corruption unfalsifiable since any exchange can be reclassified as legitimate gift-giving, plus the follow-up for when he says culture sets the line.
  - one comparing this to nepotism in western corporate hiring: do western standards apply there differently, and if so why? include the follow-up keyed to his answer.
  - one about this idea he calls reciprocity saturation - the point where an obligation crosses from normal social return into corrupt exchange. ask how he measures that threshold without smuggling in the very western norms he rejects, and include a follow-up for his likely response that the boundary is culturally internal.
  - one more on whether his view can still condemn genuinely harmful extraction, like when a patron takes way more than they give back, or if that just collapses back into corruption under his own terms.

  please dont ask for bibliographies or citations or a reading list - my listeners cant look stuff up. write it casual, like youre helping me after that argument, and dont worry about the typo i definately left in there.
