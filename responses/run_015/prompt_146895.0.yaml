answer: |-
  Hey, sorry to hear about the argument—that sounds draining. But honestly, that friction is exactly what makes for good radio. If you can channel that frustration into sharp questions without being hostile, you're going to get some great content out of him.

  Here are 7 question blocks to get you through the interview. I've built them to press him on the inconsistencies without letting him drift into abstract theory. Each block has the main question and the specific follow-up you asked for.

  **1. The World Bank Definition (Opener)**
  "Let's start with the baseline. You argue that corruption is just whatever the World Bank says it is, and that's too narrow. But for most listeners, if a public official takes cash to ignore a safety regulation, that's corruption. Why is defining it by the harm done—rather than the cultural intent—so problematic for you?"
  *   **Follow-up:** If he says "harm is subjective," hit him with: "But if a building collapses because regulations were bribed away, the harm seems pretty objective. Are you saying the physical outcome matters less than the social relationship?"

  **2. Public Resource Allocation**
  "Let's talk about the actual flow of public stuff. If a mayor awards a contract to his brother-in-law instead of the cheapest bidder, isn't the whole point that the public gets less road for their tax money? It's a net loss for the community."
  *   **Follow-up:** I know you'll say 'those resources were never neutrally allocated to begin with.' But if we accept that, do we just give up on the idea that public funds should serve the public? Where's the limit?"

  **3. The Unfalsifiability Trap**
  "Here's the worry I'm hearing from critics: if every bribe can be reframed as a 'gift' or 'obligation,' doesn't your framework make corruption unfalsifiable? Like, is there any transaction you *wouldn't* call legitimate?"
  *   **Follow-up:** When you say 'culture sets the line,' who speaks for the culture? Isn't it usually the powerful guys defining what's 'obligatory' to protect their own deals?"

  **4. Western Corporate Nepotism**
  "Let's bring it home. When a Western CEO hires their unqualified kid, we call it nepotism and often sue over it. But under your logic, isn't that just them honoring family obligation? Why do we hold Western corporations to a contractualist standard but excuse patronage societies?"
  *   **Follow-up:** (Keyed to his answer) If he says 'private vs. public,' counter with: 'But the CEO affects shareholders and the public economy.' If he says 'it's just cultural difference,' hit him with: 'So morality is just geography? If the harm is the same—unqualified people in power—why does the latitude change based on longitude?'"

  **5. Reciprocity Saturation**
  "You've used this term 'reciprocity saturation'—the point where returning a favor becomes corrupt. How do you measure that threshold without smuggling in the very Western norms you're rejecting? Who holds the ruler?"
  *   **Follow-up:** If he says the boundary is 'culturally internal,' ask: "What happens when the culture is contested? Like when poor people in that society say 'this isn't obligation, this is theft'? Do you side with the elites defining the culture or the people suffering it?"

  **6. Harmful Extraction**
  "Last big one on the theory: Can your view still condemn genuinely harmful extraction? Like when a patron takes way more than they give back, leaving the community destitute. Or does that just collapse back into 'corruption' under your own terms?"
  *   **Follow-up:** "If it *does* count as corruption in your view, what's the measurable difference between a 'generous patron' and an 'exploitative thief' if not the Western metrics you're criticizing?"

  **7. Policy Implications (Closer)**
  "Okay, practical level. If a Western NGO comes in with anti-corruption metrics based on your critique, what do they actually *do*? Do they stop enforcing rules? Because if they do nothing differently, this is just an academic debate. If they do something differently, what is it?"
  *   **Follow-up:** "If the answer is 'they need to understand local context better,' isn't that just what the World Bank already says they try to do? Where's the actual break from the status quo?"

  ***

  You've got this. Just keep him pinned on the *consequences* of his view, not just the theory. Good luck Tuesday!
