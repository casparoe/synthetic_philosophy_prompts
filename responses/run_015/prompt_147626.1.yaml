  # JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT ON MATERIAL CONSTITUTION

  **Date:** October 26, 2023
  **Parties:** Proponent of Constitution View (PCV); Proponent of Strict-Identity View (PSIV)
  **Subject:** Metaphysical Status of Artifacts and Material Constituents

  ## I. AGREED CLAIMS

  Both parties acknowledge the following premises as the foundational framework for this inquiry. These claims establish the logical and conceptual boundaries within which our disagreement occurs.

  1.  **Logical Structure of Constitution:** Both parties agree that the relation of material constitution is synchronic (occurring at a single time) and distinct from the part-whole relation. We agree that when a statue is constituted by clay, the clay is not merely a part of the statue in the way a handle is part of a cup; rather, the clay comprises the entirety of the statue's matter at that time.
  2.  **Purpose of the Statue-and-Clay Case:** We agree that the classic case of the statue and the clay is designed to test the Principle of the Indiscernibility of Identicals (Leibniz's Law). The case functions to determine whether two entities occupying the same spatial location at the same time must be numerically identical, or whether they can differ in their modal properties (properties regarding what *could* happen to them) and persistence conditions (conditions under which they cease to exist).
  3.  **Scope of the Modal Argument:** We agree that the modal argument relies on ascribing properties such as "could survive being squashed" or "could survive the replacement of parts." We further agree that the validity of this argument depends on whether such properties are intrinsic to the object itself or relative to the conceptual scheme (sortal) used to identify the object.
  4.  **Empirical and Conceptual Constraints:** We agree that continuous shape-preservation and institutional labeling (e.g., museum tags, ceremonial usage) are observable empirical facts. However, we agree that these facts do not, by themselves, settle the metaphysical question of numerical identity. Observable continuity is consistent with multiple metaphysical interpretations regarding whether the *same object* persists or whether a *successor object* has been created.

  ## II. TABLE OF DISAGREEMENTS

  The following table isolates the precise points of divergence. Each row contrasts the PCV's formulation against the PSIV's formulation, followed by the underlying crux of the divergence.

  | Point of Divergence | PCV Formulation (Constitution View) | PSIV Formulation (Strict-Identity View) | Crux of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Ontological Count** | The statue and the clay are numerically distinct objects that coincide spatially. They are related by constitution, not identity. | There is only one object. "The statue" and "the clay" are sortal-relative descriptions of the same entity, not distinct ontological items. | **Multiplicity vs. Description:** Whether coincidence entails two objects or one object described in two ways. |
  | **Persistence Conditions** | Artifact identity is sustained by institutional recognition and functional continuity, allowing survival through gradual material replacement. | Artifact identity is tied to material continuity. If every particle is replaced and original material reshaped elsewhere, the original artifact is destroyed. | **Grounds of Diachronic Identity:** Whether identity is grounded in form/function or in material history. |
  | **Modal Properties** | The statue and the clay possess different modal properties *simpliciter* (e.g., the clay could survive squashing; the statue could not). | Modal properties are relative to the sortal concept applied. The single object has no modal properties independent of a sortal description. | **Property Attribution:** Whether modal profiles belong to the object or to the object-under-a-concept. |

  ## III. EXPLICIT CRUXES AND TEST CASES

  We identify two primary cruxes where our positions yield divergent predictions about concrete scenarios. These cases serve as the testbed for our respective theories.

  ### Crux 1: Diachronic Identity via Material Replacement
  **Question:** Can institutional recognition combined with continuous shape-maintenance ground diachronic identity for an artifact when every constituent particle has been replaced over time?

  **Test Case: The Museum Replacement Scenario**
  A museum possesses a sacred clay ritual figure. Over fifty years, conservators use molecular-level replacement to preserve the figure's structure, replacing every original particle with new material to prevent decay. The displaced original material is collected and, at the end of the period, reformed into a separate vessel housed in a different institution. The museum figure maintains its ceremonial role and shape throughout the process.

  **Predictions:**
  *   **PCV Prediction:** The original ritual figure survives in the **museum (the replaced form)**. The institutional role and continuous shape preservation sustain the identity of the artifact. The vessel in the other institution is a new object made of the old matter.
  *   **PSIV Prediction:** The original ritual figure is **destroyed**. Since there is only one object (statue = clay), and the original clay has been removed and reshaped, the original entity no longer exists in the museum form. The museum holds a replica; the original material elsewhere constitutes a different object, but the original artifact identity is lost in the transition.

  ### Crux 2: Modal Properties and Sortal Relativity
  **Question:** Do modal properties such as "could survive being squashed" belong to the object *simpliciter*, or only to the object-under-a-sortal?

  **Test Case: The Bronze-and-Clay Comparison**
  Two artifacts are displayed side-by-side: one cast in bronze, one molded in clay. They exhibit identical shape and size. We consider the modal property: "Could survive being compressed by a hydraulic press without losing identity."

  **Predictions:**
  *   **PCV Prediction:** The objects **diverge** in virtue of their material constitution. The bronze object (and the statue constituted by it) could survive compression that would destroy the clay object (and the statue constituted by it). The modal properties are fixed by the constitution relation and the nature of the constituent matter.
  *   **PSIV Prediction:** The objects **diverge only relative to sortals**. Since there is only one object in each case, asking if "it" survives is incomplete. Under the sortal "clay object," it cannot survive; under the sortal "bronze object," it can. There is no fact of the matter about the object *simpliciter* independent of these descriptions. The divergence is in our conceptual framing, not in the count of objects.

  ## IV. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISPUTE

  We have examined whether our disagreement is merely verbal (a difference in linguistic convention) or substantive (a difference regarding the structure of reality).

  **1. The Verbal Component:**
  We acknowledge a verbal overlap regarding the term "statue."
  *   For the **PCV**, "statue" denotes an artifact-type that can be constituted by various materials and persist through change, functioning as a sortal that encodes specific persistence conditions distinct from its matter.
  *   For the **PSIV**, "statue" functions as a phase sortal or a descriptive label applied to a material object. When the PSIV says "the statue is the clay," they are asserting that the referent of "statue" is exhausted by the material object falling under that description.

  If the dispute were *purely* verbal, we could translate one view into the other without loss of predictive power. We could agree to say "one object described two ways" while maintaining the PCV's predictions about survival.

  **2. The Substantial Residual:**
  However, the disagreement is not merely verbal. It is substantive because it entails different truth conditions for existence claims in the **Museum Replacement Scenario**.
  *   When the PCV says, "The original statue is in the museum," they assert the existence of a continuing entity at that location.
  *   When the PSIV says, "The original statue is destroyed," they deny the existence of that continuing entity at that location.

  These are contradictory claims about the world, not merely contradictory claims about language. If the museum were to insure the "original artifact," the two parties would advise different policies based on whether the insurance covers the *form* (PCV) or the *matter* (PSIV).

  **Conclusion on Status:**
  While the framing of "object" versus "sortal-description" contains a verbal element, the residual disagreement regarding **diachronic identity conditions** is substantive. The parties disagree on what facts in the world (material continuity vs. functional continuity) determine the truth value of the proposition "The original artifact exists at time T2."

