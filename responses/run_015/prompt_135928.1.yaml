      *   *Section 3: Unfalsifiability.* Address the "failure as hidden restructuring" point. This is the biggest philosophical risk. It turns Machiavelli into a mystic of power rather than a technician.
      *   *Section 4: Rival Frameworks.* Distinguish from Skinner (liberty) and Pocock (civic virtue). The user's view is more ontological/existential.
      *   *Section 5: Least Costly Revision.* Suggest shifting from "Fortuna is an artifact" to "Fortuna is the *limit* against which Virtù defines itself." Preserve the tension.

