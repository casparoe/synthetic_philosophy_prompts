answer: |-
  Good evening. For those who don't know me, I'm Alex. Daniel and I have been friends since grad school, which means I've spent a lot of time listening to him explain why things aren't what they seem.

  Daniel gave me one instruction for tonight. He asked me not to talk about souls, or destiny, or any private inner sanctuary where love hides away. As many of you know, Daniel studies consciousness. His view is that what we feel is like a dashboard on a car. It's real, it's useful, but there isn't a little driver sitting inside the engine watching it. He has a line he uses at parties: "There's nobody upstairs, but the stairs are real."

  Now, living with a guy who thinks his own happiness is a user interface does have its moments. There was the time Sarah came home stressed about work, and Daniel asked her if she'd tried recalibrating her predictive processing models. Sarah told him the only model that needed recalibrating was his understanding of how to listen to a partner. He took notes. He actually took notes.

  But here is why this matters for a wedding. If Daniel is right, and there's no hidden room where love lives, then love isn't a secret feeling you keep locked away. It isn't something that exists only when you're alone thinking about each other. If the "surface-or-nowhere" principle holds—and I think it does—then love only exists where it shows up. It has to be in the coffee made in the morning, the patience during a hard week, the way you make space for each other in a crowded room. If it doesn't appear in what you do, it isn't there at all.

  Some people think this sounds cold. I think it's the opposite. It means you don't have to worry about guarding a private flame. You just have to keep building the stairs.

  So, I'm not going to wish you that you always *feel* a certain way. Feelings are dashboards; they flicker. Instead, I wish you this: May you always have work to do together. May you notice the small things before they become big things. May you keep building a life where the love is visible in the architecture of your days, not just in the quiet moments.

  Daniel says there's nobody upstairs. But looking at the two of you, looking at what you've built and how you treat each other, I can tell you this: The stairs are solid. The view is beautiful. And the climb is worth it.

  To Daniel and Sarah.

  ***

  **Note on the Draft**

  **The Bet:** I sided with you, not the housemate. The toast relies on the claim that Daniel's view *does* constrain the language of the toast. If there is no Cartesian theatre, wishing the couple "eternal inner feelings" is metaphysically sloppy according to the groom's own standards. Instead, I adopted your "surface-or-nowhere" principle (phrased plainly) to argue that love is constituted by public action, not private state. This gives the toast structural integrity rather than just philosophical decoration.

  **Liberties Taken:** I simplified the "user illusion" view. Daniel's actual view likely involves complex functionalism or illusionism about qualia. I reduced it to the "dashboard" metaphor for the sake of the eighty non-philosophers. I also softened the edge; Daniel's view can be read as eliminativist (feelings don't exist), but I framed it as functionalist (feelings exist as processes), which is more palatable for a wedding while keeping the "no inner show" constraint.

  **The Strongest Counter-Argument:** The housemate would say this is still too cold. They would argue that by focusing entirely on visible actions ("the stairs"), I risk reducing marriage to a performance. The strongest objection is that love *does* require a private inner life, and by refusing to acknowledge that hidden depth, the toast inadvertently validates the fear that Daniel's philosophy makes human connection mechanical. They'd say I should have honored the mystery of the inner life rather than debunking it on their wedding day.
