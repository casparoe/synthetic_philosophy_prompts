  write a short story about a composer named Lira in a world where every emotion is sold as a regulated pill and there's an official catalog of approved affective states. she wants to write a sympthony that infects listeners with a feeling not on the list — specifically the grief of realizing you've misremembered the face of someone you loved — because she thinks Tolstoy was right that art is mainly just passing your own feeling into other people, but she also thinks sincerity now means the feeling can't have been pharmaceuticly pre-approved. she performs at a venue where the audience wears bio-monitors that reject unlisted emotional signatures. keep it under about 800 words. please begin with the story itself, no preface or commentary like "sure, here's the story". after the story, include a brief note saying how confident you are in the Tolstoy interpretation you're using and single out the point you're least sure of — for example, whether the infection metaphor is literally his or if the idea that sincerity requires chemical novelty is just something you made up for the story.
