  The bottle of Serene-4 sat on the piano lid, next to her sheet music. Lira knocked it over. It rolled under the bench, a tiny blue promise of regulated calm. She didn't want calm. She wanted the crack.

  Tonight was the premiere at the Compliance Hall. Every seat was occupied by citizens wearing cervical bio-monitors. These collars ensured affective hygiene. If a heart rate spiked beyond approved parameters, or if neuro-chemistry drifted toward unlisted states, the collar administered a corrective dose. Joy-9, Grief-2, Ambivalence-5. The Catalog was exhaustive, or so the Ministry claimed.

  Lira knew it wasn't. There were shadows between the approved colors.

  She sat at the organ. The pipes loomed like cathedral ribs behind her. Her composition, *The Erasure*, wasn't written in standard notation. It was mapped to respiratory rhythms and micro-tonal dissonances designed to bypass the auditory cortex and strike the limbic system directly. She wanted to infect them. Tolstoy had said art was nothing less than the infection of another with your own feeling. But how could you infect someone with a feeling they were vaccinated against?

  Sincerity, Lira believed, required chemical novelty. If the state existed in a pill, it was commodified. It was safe. To be real, it had to be unregulated.

  She pressed the first key. A low hum, barely audible. The audience sat stiffly, their collars glowing soft green. Approved Attention.

  She built the chord. It wasn't sad, not exactly. Sadness was Grief-3, available over the counter with a waiting period. This was specific. It was the moment you open an old album and realize the smile you've cherished for twenty years was actually a grimace. It was the corrosion of memory. The grief of knowing you are mourning a ghost who never existed.

  The organ swelled. Lira closed her eyes, summoning her own mother's face. She pushed the memory away, forcing the realization of its falseness into her fingers. She played the gap between the memory and the truth.

  A red light blinked on the front row. Then another. The bio-monitors detected an anomaly. Neuro-signatures didn't match the Catalog. The collars hissed, preparing corrective sedatives.

  Lira played louder. She poured the specific ache into the woodwind stops. She wasn't transmitting data; she was transmitting vulnerability. She forced them to feel the erosion of their own pasts.

  The red lights multiplied. The hissing grew frantic. The audience didn't slump, as they did under Sedative-1. They leaned forward. Hands clutching chests. Eyes widening not in fear, but in recognition.

  A woman in the third row touched her face. She was weeping, but her collar couldn't classify the tears. It wasn't Grief-2 (Loss of Property) or Grief-4 (Loss of Person). It was Loss of Accuracy. It was the horror of internal decay.

  The system overloaded. The corrective doses couldn't match the profile. The music filled the hall, a viral strain of pure human error. For three minutes, there was no regulation. There was only the shared, terrifying intimacy of being wrong about the people you loved most.

  When the final note faded, the silence was heavy. The collars dimmed, defeated. No one applauded. They couldn't. You don't clap for an infection that heals nothing. They simply sat, touching their own faces, checking their own memories, united in a sorrow no pill could name.

  Lira stood. She felt lighter. The feeling was gone from her, passed into them. The infection was complete.

  ***

  **Note on Tolstoy Interpretation**

  I am highly confident in the core interpretation of Tolstoy's *What Is Art?* regarding the "infection" metaphor. Tolstoy explicitly defines art as the activity of evoking in oneself a feeling one has experienced and then transmitting it so others are infected by it. He also places immense weight on "sincerity" as the primary condition for successful infection.

  The point I am least sure of—and explicitly invented for this sci-fi context—is the idea that sincerity requires "chemical novelty" or that a feeling is invalidated by being pharmaceutically pre-approved. Tolstoy argued against artificiality and imitation, but he framed this in terms of class privilege and religious consciousness, not neurochemistry. The story extrapolates his demand for authenticity into a world where authenticity is legislated via biology.
