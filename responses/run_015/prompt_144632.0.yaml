      *   **Address the Friend:** The friend is wrong about the LLN. With infinite mean absolute deviation, the sample mean does not converge. It behaves like a Cauchy distribution (roughly speaking, though this is discrete). It will wander.

  5.  **Drafting the Response:**
      *   **Acknowledge the depth:** This is a classic paradox (related to the St. Petersburg paradox but with conditional convergence). It touches on measure theory vs. Riemann sums.
      *   **Pinpoint the error:** Step (2) is the failure point. Specifically, the interchange of limit and sum (or limit and expectation).
      *   **Explain *Why*:** The definition of Expectation in modern probability (Kolmogorov/Lebesgue) requires absolute convergence. Without it, the "value" is not invariant under relabeling of the sample space.
      *   **Address the "Natural Order":** Why is $n=1, 2, 3$ not privileged? Because expectation is a sum over the *range* of the variable weighted by probability, not a series indexed by time. While $n$ is the time index, the *outcomes* are disjoint events. There is no measure-theoretic reason to sum them in increasing $n$ order vs. any other bijection from $\mathbb{N}$ to the outcomes.
      *   **Address the Friend:** Crucial point. The Weak/Strong Law of Large Numbers fails here. If you play 100 times, the average will *not* settle. One huge outlier (long run of tails) can skew the average massively because the payoff scales with $2^n$.
      *   **Philosophical/Practical Implication:** If you pay 50 cents, are you safe? No. Because the risk is unbounded. The "undefined" expectation warns you that the long-run behavior is unstable.
