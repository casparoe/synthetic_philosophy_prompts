answer: |-
  # Lesson Plan: The Port Haven Tribunal
  **Course:** Upper-Level Population Ethics Seminar
  **Time:** 90 Minutes
  **Students:** 14
  **Goal:** Induce the Nonidentity Problem through simulation before naming it.

  ## I. Setup and Cast (10 Minutes)

  **The Scenario:**
  The polity of **Port Haven** faces a resource crisis. The Development Council must choose one of two infrastructure plans to house the workforce for the next decade. The choice will determine the economic and environmental quality of life for the next generation (Generation 2), but crucially, it will also determine *who* is born into that generation.

  **The Policies:**
  1.  **Project Rapid (Extraction):** Immediate construction of high-density temporary barracks near the extraction site. Work shifts are 12 hours, erratic.
  2.  **Project Steady (Conservation):** Zoning delays for environmental review. Construction of permanent family housing begins in 3 years. Work shifts are standard 9-to-5.

  **The Cast (14 Students):**
  *   **The Council (4 students):** Tasked with voting on the policy.
  *   **The Potential Parents (6 students):** 3 couples. They are the *only* people who can conceive Generation 2.
  *   **The Tribunal (4 students):** 1 Judge, 1 Clerk (records standing), 2 Jurors (apply the rule).
      *   *Note:* In the first run, you (Instructor) should act as the **Clerk** to ensure the standing rule is enforced rigidly. Move the Tribunal roles to students only if they grasp the mechanics quickly, but for a first run, you holding the gavel ensures the "trap" springs correctly.
  *   **Observation/Gen 2 Proxies (Remaining students):** (If 14 total, the math above is 4+6+4=14. Perfect.)
      *   *Correction:* To make the identity shift visible, we need to visualize the "Unborn."
      *   *Revised Cast:*
          *   **Council:** 3 students.
          *   **Couples:** 6 students (3 pairs).
          *   **Tribunal:** 3 students (Judge, Prosecutor, Defense).
          *   **Gen 2 Representatives:** 2 students (Representing the children born of the *chosen* policy).
          *   **Audience/Observers:** The rest (or integrate them into the Tribunal as Jurors).

  **Props:**
  *   **Policy Cards:** Two distinct envelopes.
  *   **"Conception Lottery" Deck:** A deck of cards with unique IDs (e.g., `A-01` through `A-50` for Rapid, `B-01` through `B-50` for Steady).
  *   **Birth Certificates:** Pre-printed forms.
      *   *Rapid Certs:* List Parent Pair 1, 2, 3 + ID `A-xx`. Date: Year 1.
      *   *Steady Certs:* List Parent Pair 1, 2, 3 + ID `B-xx`. Date: Year 4.
      *   *Crucial Detail:* The IDs do not match. `A-01` is not `B-01`.

  ## II. The Identity Mechanism (15 Minutes)

  *Do not skip this. This is where students usually try to cheat the logic.*

  **The "Social Mixing" Stipulation:**
  Explain to the class that in Port Haven, housing determines social intersection.
  1.  **Under Rapid:** Couples live in mixed-gender barracks immediately. They conceive in **Year 1**.
  2.  **Under Steady:** Couples live apart until family housing is ready in **Year 4**. They conceive in **Year 4**.

  **The Biological Fact (Class Stipulation):**
  "In this simulation, we accept the biological reality that a conception event occurring 3 years apart, under different hormonal and environmental conditions, involves different gametes. Therefore, **Child A-01 and Child B-01 are numerically distinct individuals.** One is not the 'same person' as the other, just as a sibling is not the same person."

  **The Visualization:**
  1.  Ask the **Council** to choose a policy. (Rig this if necessary, or let them choose; **Rapid** usually creates a starker "damaged world" for the complaint). Let's assume they choose **Rapid** for the sake of the complaint.
  2.  Hand the **Couples** the **Rapid Conception Cards** (`A-01`, `A-02`, `A-03`).
  3.  Collect the **Steady Conception Cards** (`B-01`, `B-02`, `B-03`) and place them in a box labeled **"The Void."**
  4.  **The Move:** Physically lock the box. Tell the class: "The people associated with these cards never come into existence. They are not waiting in a queue. They are not 'souls' waiting for bodies. They are impossible."
  5.  Hand the **Gen 2 Representatives** the **Rapid Birth Certificates** (`A-01`, etc.).
  6.  **The World State:** Reveal that **Rapid** policy results in a polluted, high-income but low-health environment. **Steady** would have resulted in a clean, moderate-income, high-health environment.
      *   *Condition:* Life under Rapid is still **worth living** (positive welfare), just significantly worse than Steady.

  ## III. The Tribunal Procedure (30 Minutes)

  **The Scene:**
  15 years later. The **Gen 2 Representatives** (holding Rapid Certs) bring a complaint against the **Council**.

  **The Standing Rule (The Trap):**
  Project this on the board. Do not allow the Tribunal to modify it yet.
  > **Rule of Standing:** A complaint is admissible *only if* the complainant can demonstrate that they are **worse off** under the chosen policy than **they themselves** would have been under the alternative policy.

  **The Script:**
  1.  **Gen 2 Reps:** "The Council chose Rapid. Our air is toxic. Our life expectancy is 60 years. We demand reparations."
  2.  **Council Defense:** "We admit the world is worse. But if we had chosen Steady, *you* (holding Cert A-01) would not exist. Child B-01 would exist instead. You are comparing Existence (60 years) to Non-Existence."
  3.  **Tribunal Task:** The Tribunal must rule on Standing based *strictly* on the Rule.

  **The Logical Collision:**
  *   To have standing, Rep A-01 must be worse off than A-01 would have been otherwise.
  *   Otherwise = Steady Policy.
  *   Under Steady Policy = A-01 is never conceived.
  *   Comparison: Is a life of 60 years (worth living) worse than never existing?
  *   Standard Intuition: No. (Unless they argue non-existence is preferable, which contradicts the "life worth living" stipulation).
  *   **Verdict:** Case Dismissed for Lack of Standing.

  **Instructor Role (as Clerk):**
  If the Tribunal tries to rule for the Gen 2 reps, interrupt: "Please point to the line in the Standing Rule that allows you to compare Person A to Person B. The rule says 'they themselves'."

  ## IV. Debrief and Philosophical Mapping (30 Minutes)

  *Do not use the term "Nonidentity Problem" yet.*

  **Phase 1: The Residue of Wrong (10 mins)**
  *   **Ask:** "The Tribunal dismissed the case. The Council admits the world is worse. The Gen 2 people are suffering. Did a wrong occur?"
  *   **Expected Consensus:** Yes, intuitively, something is wrong.
  *   **Ask:** "Who was wronged?"
  *   **The Gap:** Students will struggle to name a victim.
      *   Not Gen 2 (they aren't worse off than their alternative).
      *   Not Gen 1 (they made the choice voluntarily).
      *   Not Gen 2 Counterparts (they don't exist).
  *   **Board Work:** Draw two columns.
      *   *Left:* "Someone was wronged" (Person-Affecting).
      *   *Right:* "A wrong was done" (Impersonal).
      *   Ask students to place the Port Haven case. It falls in the Right column, leaving the Left empty.

  **Phase 2: Mapping the Options (15 mins)**
  Now introduce the philosophical terminology to label their frustrations.

  1.  **The Person-Affecting Restriction (PAR):**
      *   *Definition:* An act can only be wrong if it makes some *particular person* worse off.
      *   *Class Experience:* This was the Tribunal's Standing Rule.
      *   *Result:* It leads to the "Absurd Conclusion" that harming future people is permissible if it also causes them to exist.
      *   *Discussion:* Who wants to keep the PAR? Why? (Protects against abstract claims against the state). Who wants to drop it?

  2.  **The Impersonal Comparative Principle:**
      *   *Definition:* It is bad if people are worse off, even if the *specific* people wouldn't otherwise exist. We compare *states of affairs*, not *lives*.
      *   *Class Experience:* This is what the Gen 2 Reps *wanted* to argue ("The world is worse!").
      *   *Risk:* Does this demand we maximize population quality endlessly? (The Repugnant Conclusion loom).

  3.  **Harmless Wrongdoing:**
      *   *Definition:* Accept that the act is wrong, but admit no specific victim is harmed in the comparative sense.
      *   *Class Experience:* The feeling that the Council was negligent, even if no lawsuit sticks.

  **Phase 3: The Reveal (5 mins)**
  *   **Instructor:** "This collision—where causing someone to exist in a harmed state is not 'harming' them because the alternative is non-existence—is called the **Nonidentity Problem**."
  *   Cite Parfit (1984). Explain that this is not just a legal trick; it undermines much of traditional harm-based ethics.

  ## V. Predictable Failure Modes & Fixes

  **1. The "Same Soul" Objection**
  *   *Failure:* Students argue, "But the *child* is the same, just born later."
  *   *Fix:* Enforce the **Conception Lottery** props. "In this seminar, we are materialists. Different sperm/egg = different person. If you reject this, you reject the biology of the simulation." Remind them this is a *stipulation* of the thought experiment, not an empirical claim they can debate away.

  **2. Relitigating the Policy**
  *   *Failure:* The Tribunal starts debating whether Rapid was "economically sound" rather than applying the Standing Rule.
  *   *Fix:* As Clerk, intervene. "We are not reviewing the wisdom of the policy. We are reviewing the *standing of the complainant*. Can Person A claim harm relative to Person A's alternative? Yes or No."

  **3. The "Non-Existence is Worse" Move**
  *   *Failure:* A student argues, "Non-existence is the worst possible state, so existing is always better."
  *   *Fix:* This actually *helps* the NIP logic (it makes the complaint fail even harder). But if they argue "Non-existence is better" (suicide intuition), remind them of the stipulation: **Life under Rapid is worth living.** We are discussing *sub-optimal* lives, not *misery* lives.

  **4. Declaring a Victim by Fiat**
  *   *Failure:* The Tribunal says, "We declare them victims because it's unfair."
  *   *Fix:* Pause the simulation. "If you change the Standing Rule to allow 'fairness' without 'comparative harm,' you have just abandoned the Person-Affecting View. Write that new rule on the board. Now, who does that rule protect?"

  ## VI. Candid Limitations (Instructor Note)

  No in-class activity can fully reproduce the metaphysical weight of the Nonidentity Problem. Be prepared to supply the following on the board during the debrief:

  1.  **The Baseline Problem:** The activity simulates a legal standing issue. It does not fully capture the metaphysical difficulty of comparing **Existence** to **Non-Existence**. Students treat "Non-Existence" as a dark room someone is kept out of. You must clarify: *There is no one in the dark room.* There is no subject to be deprived.
  2.  **The "Wait and See" Escape:** In the real world, we often think, "If we wait, the *same* people will be born later." The activity forces the identity shift via stipulation. You must acknowledge that in reality, the identity shift is probabilistic, not guaranteed, which makes the real-world NIP slightly fuzzier but logically identical.
  3.  **The Emotional Gap:** The simulation creates intellectual frustration. It may not create *moral* horror. You need to verbally escalate the stakes in the debrief (e.g., "Imagine not just pollution, but a genetic defect caused by the policy") to ensure they feel the moral weight of the "Harmless Wrong."

  **Closing Board Work:**
  Draw the triangle:
  1.  **Person-Affecting View** (Intuitive, but fails here).
  2.  **Impersonal View** (Solves this, but risks Repugnant Conclusion).
  3.  **Nonidentity Problem** (The wedge that forces the choice between 1 and 2).

  Tell them: "For next week, read Parfit. Your job is to find a way to keep Column 1 without ignoring Column 2."
