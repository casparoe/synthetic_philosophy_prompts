  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on population ethics (14 students, 90 mins, mid-semester).
      *   **Prior Knowledge:** Covered ordinary deprivational harm and welfare tradeoffs.
      *   **Goal:** Introduce the Nonidentity Problem (NIP) *before* revealing the label.
      *   **Method:** Staged role-play involving a coastal polity's development council choosing between two policies (Extraction vs. Conservation).
      *   **Key Mechanism:** Policies must differ in timing/settlement patterns such that *different specific people* are born in Generation 2 (identity-shifting). This needs to be concrete/plausible, not sci-fi.
      *   **Key Activity:** A tribunal where Gen 2 citizens complain. Standing rule: Complaint valid only if complainant is worse off under chosen policy than they *would have been* under the alternative.
      *   **Desired Outcome:** Students discover the gap between "a wrong was done" and "someone was wronged." They must articulate if there's a residue of wrong.
      *   **Deliverables:** Setup/cast, identity mechanics (with safeguards), tribunal procedure, debrief (mapping to philosophical options), handling failure modes, and candid limitations of the activity.
      *   **Constraint:** Do *not* use the term "Nonidentity Problem" until the debrief.

  2.  **Deconstruct the Challenge:**
      *   *The Identity Shift:* This is the hardest part to make plausible in a classroom. In reality, policy changes don't instantly swap populations. I need a mechanism that links specific conception events to specific policy choices without sounding like "Butterfly Effect" magic. The "timing of conception" argument (Parfit's original insight) is the standard way. I need to gamify this.
      *   *The Tribunal Standing:* The rule "worse off than you would have been" is the trap. If they exist *only* under Policy A, they can't compare their existence to their non-existence under Policy B (assuming life is worth living).
      *   *Student Pushback:* Students will try to say "But they exist in both!" or "But the policy was bad!" I need rules that force them into the logical corner.
      *   *Debrief:* Needs to connect the frustration they feel to Person-Affecting Views vs. Impersonal Views vs. Harmless Wrongdoing.

  3.  **Drafting the Scenario (The Polity):**
      *   Name: "Port Haven."
      *   Choice: "Project Rapid" (Extraction/Industrial) vs. "Project Steady" (Conservation/Tourism).
      *   Identity Mechanism: Housing and Work Schedules.
          *   *Rapid:* Immediate construction, shift work, temporary housing blocks. Couples meet in mess halls, conceive earlier (Year 1).
          *   *Steady:* Zoning delays, family-unit housing built later, standard hours. Couples meet in community centers, conceive later (Year 3).
          *   *Biological Fact:* Different sperm/egg combination = different person.
      *   *Props:* "Birth Certificates" or "ID Cards" that are policy-specific.

  4.  **Drafting the Tribunal:**
      *   Complainants: Gen 2 citizens (played by students).
      *   Judge/Moderator: Instructor or assigned student.
      *   The Rule: The "Counterfactual Condition." You must prove *you* are worse off than *you* would have been otherwise.
      *   The Twist: Under the unchosen policy, *you* would not exist.

  5.  **Drafting the Debrief:**
      *   Map the frustration to the philosophy.
      *   Person-Affecting Principle (PAP): No victim, no foul?
      *   Impersonal Principles: Bad states of affairs, even without specific victims.
      *   Harmless Wrongdoing.

  6.  **Addressing Failure Modes:**
      *   *Denying Identity:* Students will say "It's basically the same people." -> *Fix:* Enforce the "Specific Gamete" rule strictly via props.
      *   *Relitigating Policy:* Students will argue Rapid is just "bad policy." -> *Fix:* Focus strictly on the *complaint standing*, not the policy wisdom.
      *   *Declaring Victim by Fiat:* "They are victims because I say so." -> *Fix:* Force them to apply the standing rule they wrote themselves.

  7.  **Addressing Limitations:**
      *   The activity simulates the *logic*, but not the *metaphysical weight* of comparing existence to non-existence. The instructor needs to board-work the "Nonexistence Baseline."

  8.  **Refining the Plan (Self-Correction/Iterative Design):**
      *   *Time Management:* 90 minutes is tight.
          *   Intro/Setup: 10 mins.
          *   Policy Deliberation (brief): 15 mins.
          *   Identity Reveal/Prop Distribution: 10 mins.
          *   Tribunal: 30 mins.
          *   Debrief: 25 mins.
      *   *Identity Mechanism:* Make it visual. Use colored cards. If Policy A is chosen, hand out Blue Cards (Gen 2A). If Policy B, Red Cards (Gen 2B). The students playing Gen 2 *cannot* hold both.
