                  *   *Wait, re-reading prompt:* "worse off under the chosen policy than someone would have been under the alternative." It might mean "than the counterpart." I will design the rule to be the **Person-Affecting Restriction**: "You must show that *you* are worse off than *you* would have been had the other policy passed." This is the trap.

      *   *Identity Mechanics:* How to make it stick?
          *   Use the "Conception Window" argument.
          *   Policy A: Housing ready Jan 1st. Couples move in. Conception Feb.
          *   Policy B: Housing ready Dec 1st. Couples move in. Conception Jan (next year).
          *   Biological fact: Different time = different sperm/egg = different person.
          *   Prop: "Genetic Lottery Tickets."

      *   *Handling the "They are the same people" objection:*
          *   Pre-commitment. Before the vote, establish the "Scientific Fact" of the scenario. Make it a stipulation of the simulation. "In this simulation, a 12-month shift in conception results in distinct identities."

  9.  **Structuring the Debrief:**
      *   Phase 1: The Frustration. (Why couldn't we punish them?)
