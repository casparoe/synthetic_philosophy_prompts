      *   *Correction:* The Tribunal must be held *after* the choice. The complainants are the people who *were born* under the chosen policy. They complain: "You should have chosen the other one." The Council replies: "If we had, you wouldn't be here."
      *   *Better Setup:* Split the class. Half are Council, Half are Future Citizens.
      *   *Actually, for 14 students:*
          *   4 Council Members.
          *   10 Citizens (5 for Gen 2 under Policy A, 5 for Gen 2 under Policy B).
          *   Wait, the Tribunal needs to happen *in the scenario*.
          *   *Revised Flow:*
              1.  Council chooses Policy A (Rapid).
              2.  Time jump.
