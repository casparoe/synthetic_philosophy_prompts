      *   *Section 4: What to drop/modify.* Don't drop the core idea. Drop the idea that "revision cost" is merely pragmatic. Drop the linear ranking if it ignores factivity.
      *   *Conclusion:* Encourage the user to pivot the paper towards the *function* of assertion based on this risk-profile analysis.

  8.  **Final Polish:** Ensure tone is academic, supportive, and precise. Use standard terminology (constitutive rules, normative liability, factivity, assurance view). (Self-Correction: Make sure to mention that "revision cost" might sound too psychological; "normative liability" or "accountability profile" is better.)

  9.  **Final check against user prompt:** "Which part of my framing has to go?"
