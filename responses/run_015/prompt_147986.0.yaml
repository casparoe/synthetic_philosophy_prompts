  3.  *"All that is gone will have been near." / "All that is near has been and will be near."*
      *   **Viability:** Medium. Strong emotional resonance for Iris and her father. However, the second refrain becomes repetitive ("near... near"), which might dilute the impact over nineteen returns. It also slightly muddles the "here/there" spatial analogy.

  4.  *"The end I seek will have been start." / "The start I seek has been and will be start."*
      *   **Viability:** Low. "Will be start" is syntactically awkward and forces the rhyme into a noun that doesn't naturally accept the verb "be" in this context. It would sound forced every time it repeated.

  **Selection:** Pair 2. It best balances the spatial metaphor required by the physics ("here" vs "there"/"ahead" vs "behind") with the emotional weight of presence ("here"), and it survives the repetition without becoming nonsense.

