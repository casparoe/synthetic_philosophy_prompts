answer: |-
  # The Aumann Diagnostic: A 15-Minute Decision Procedure for Classifying Expert Disagreement

  **To:** Reporting Staff
  **From:** Editorial Desk
  **Subject:** Protocol for Classifying Expert Disputes via Agreement Theorem Logic

  **Purpose:** This procedure uses Robert Aumann's Agreement Theorem as a diagnostic scaffold. It does not assume experts are perfect Bayesians. Instead, it uses the theorem's *failure conditions* to locate the source of a dispute.
  **Time Budget:** 15 Minutes.
  **Epistemic Warning:** Aumann's theorem proves that agents with **common priors** and **common knowledge of rationality** cannot agree to disagree on probabilistic assessments. It does *not* prove that common priors are realistic, that humans are rational, or that the theorem applies to normative claims. Distinguish the math from the metaphysics.

  ---

  ## Part 1: Theoretical Boundary Notes (Read Once)
  *Before running the checklist, internalize these distinctions to avoid category errors.*

  1.  **What Aumann Proves:** If two rational agents share the same prior probability distribution and know each other's posterior beliefs (common knowledge), their posteriors must be identical.
  2.  **What Aumann Does Not Prove:**
      *   It does not prove common priors exist (this is the "Common Prior Assumption," heavily contested in behavioral economics).
      *   It does not apply to agents with bounded rationality (humans have compute limits).
      *   It does not apply to value judgments (utilities) or conceptual definitions, only beliefs about states of the world (probabilities).
  3.  **The Reporter's Burden:** You are not verifying the math. You are identifying which assumption of the theorem is being violated to explain the disagreement.

  ---

  ## Part 2: The 15-Minute Diagnostic Checklist

  *Run these questions in order. Stop at the first "Termination Point."*

  ### Step 1: The Domain Filter
  **Question:** Is the disagreement about a probabilistic belief regarding a state of the world (e.g., "X will happen," "Y caused Z"), or is it about values, definitions, or policy preferences?
  *   **Look for:** Language of likelihood/frequency vs. language of "ought," "good," or semantic definition.
  *   **Sufficient Answer:**
      *   *Probabilistic/Factual:* Proceed to Step 2.
      *   *Normative/Conceptual:* **TERMINATE.**
  *   **Termination Point:** **Classify as Outside Theorem's Domain.**
      *   *Reporting Implication:* Frame as a clash of values or frameworks, not a resolvable factual dispute. Do not search for "who is right" regarding data.
  *   **⚠️ Judgment Call:** Experts often mask value judgments as factual probabilities (e.g., "The risk is too high" vs. "The probability is >50%"). You must decide if the probability claim is genuine or a proxy for risk tolerance.

  ### Step 2: The Information Symmetry Check
  **Question:** Do the parties have access to the same private evidence, or is one side withholding/possessing data the other lacks?
  *   **Look for:** Citations to proprietary data, classified info, unpublished datasets, or explicit statements like "I have seen data they haven't."
  *   **Sufficient Answer:**
      *   *Asymmetric Information:* **TERMINATE.**
      *   *Symmetric Information (Public Data):* Proceed to Step 3.
  *   **Termination Point:** **Classify as Information Gap.**
      *   *Reporting Implication:* The disagreement is potentially resolvable via transparency. The story is about access to evidence, not fundamental incompatibility.
  *   **⚠️ Judgment Call:** Distinguish between *private evidence* (data exists but isn't shared) and *interpretive privacy* (same data, different processing). Aumann assumes honest communication of posteriors, not necessarily raw data, but in science, raw data drives posteriors.

  ### Step 3: The Rationality & Transparency Check
  **Question:** Is the reasoning process transparent enough to be evaluated as "rational updating," or is it a black box (intuition, undisclosed models)?
  *   **Look for:** Published models, code, step-by-step derivations vs. appeals to authority, "expert intuition," or opaque neural nets.
  *   **Sufficient Answer:**
      *   *Opaque/Black Box:* **TERMINATE.**
      *   *Transparent/Checkable:* Proceed to Step 4.
  *   **Termination Point:** **Classify as Failure of Common-Knowledge Reasoning.**
      *   *Reporting Implication:* The disagreement persists because the *process* isn't common knowledge. Flag this as a methodological deficit. The dispute might collapse if models were open-sourced.
  *   **⚠️ Judgment Call:** Humans are boundedly rational. Aumann assumes perfect rationality. You must decide if the deviation from rationality is significant enough to invalidate the expectation of agreement. (Rule of thumb: If they are ignoring base rates or contradicting their own stated models, flag it).

  ### Step 4: The Prior Probability Check
  **Question:** Given shared info and transparent reasoning, do the parties explicitly acknowledge different starting assumptions (priors) regarding the hypothesis?
  *   **Look for:** Statements like "I assume nature is simple," "I assume institutions are generally trustworthy," or "I assign low prior probability to engineering feats."
  *   **Sufficient Answer:**
      *   *Priors Identified & Acknowledged:* **TERMINATE.**
      *   *Priors Claimed to be Same:* Re-evaluate Step 2 or 3 (One party is likely mistaken).
  *   **Termination Point:** **Classify as Rational Disagreement with Divergent Priors.**
      *   *Reporting Implication:* This is a "fundamental" split. Neither side is necessarily irrational. Report the *source* of the priors (e.g., past experience, philosophical commitment) rather than adjudicating the truth.
  *   **⚠️ Judgment Call:** Are the priors "reasonable"? Aumann doesn't care, but your readers do. You must judge if a prior is idiosyncratic or widely shared, even if you cannot eliminate it.

  ---

  ## Part 3: Scenario Applications

  ### Scenario 1: Epidemiologists on Pathogen Origin (Lab Leak vs. Zoonotic)
  *   **Context:** Expert A assigns 80% probability to lab leak; Expert B assigns 5%."
  *   **Run Diagnostic:**
      1.  *Domain:* Probabilistic claim about historical origin. (Pass)
      2.  *Information:* Expert A cites unpublished genomic features; Expert B cites public surveillance data. **Asymmetry detected.**
      3.  *Result:* **Classify as Information Gap.**
  *   **Reporting Implication:** Do not frame this as an irreconcilable scientific split. Frame it as a dispute over data access. The "agreement" is blocked by missing common knowledge of evidence.
  *   **Nuance:** If both have seen *all* data and still disagree, move to Step 4. If they disagree on the *reliability* of the data (e.g., trust in institutional reporting), this shifts to **Divergent Priors** on institutional honesty.

  ### Scenario 2: Philosophers of Mind on Physical Reducibility
  *   **Context:** Expert A claims consciousness is reducible to physical processes; Expert B claims it is not.
  *   **Run Diagnostic:**
      1.  *Domain:* Is this probabilistic? No. It is a conceptual/metaphysical claim about definition and ontology.
      2.  *Result:* **Classify as Outside Theorem's Domain.**
  *   **Reporting Implication:** Despite public framing as a "scientific debate," this is not a dispute Aumann's theorem can analyze. It is not about posteriors on data; it is about conceptual frameworks.
  *   **Action:** Do not write "Science is divided." Write "Philosophical frameworks diverge." Avoid implying one side is waiting on more data to be convinced.

  ### Scenario 3: AI Safety Researchers on Transformative AI Timelines
  *   **Context:** Expert A predicts TAI by 2030; Expert B predicts 2070.
  *   **Run Diagnostic:**
      1.  *Domain:* Probabilistic prediction. (Pass)
      2.  *Information:* Both rely on public compute trends and algorithmic papers. (Symmetric)
      3.  *Rationality:* Both use explicit forecasting models (e.g., bio-anchors vs. trend extrapolation). (Transparent)
      4.  *Priors:* Expert A assumes discontinuous progress is likely (high prior on breakthroughs); Expert B assumes continuous scaling (low prior on breakthroughs).
      5.  *Result:* **Classify as Rational Disagreement with Divergent Priors.**
  *   **Reporting Implication:** This is a valid, persistent disagreement. Neither is "irrational." The story should focus on *why* the priors differ (e.g., different readings of history of technology), not declare one timeline "correct."
  *   **Contested Interpretation Note:** Some decision theorists argue that with enough evidence, priors should "wash out." In AI, evidence is sparse, so priors dominate. Acknowledge this uncertainty.

  ---

  ## Part 4: Reporting Implications & Contested Readings

  ### When to Flag "Failure of Common Knowledge"
  If the diagnostic lands on **Step 3 (Rationality/Transparency)**, your reporting should focus on the *process* of the dispute.
  *   **Implication:** The disagreement is likely artificial or solvable.
  *   **Headline Approach:** "Models Remain Proprietary as Experts Clash on Risk."
  *   **Caution:** Do not accuse experts of irrationality. Frame it as "reasoning not yet common knowledge."

  ### When to Flag "Divergent Priors"
  If the diagnostic lands on **Step 4**, your reporting must validate both sides as rational within their own frameworks.
  *   **Implication:** The disagreement is structural and likely permanent.
  *   **Headline Approach:** "Different Starting Assumptions Drive Split on Policy."
  *   **Caution:** Avoid false balance. A prior can be rational but idiosyncratic. Note if a prior is an outlier in the field.

  ### Handling Contested Interpretations of Aumann
  In your analysis, you must separate the theorem from its critics.
  1.  **Bounded Rationality:** Aumann assumes infinite compute. Real experts do not.
      *   *Reporter Note:* If an expert says, "I haven't had time to process their argument," this is a bounded rationality violation, not a prior difference. Classify as **Failure of Common-Knowledge Reasoning**.
  2.  **The Common Prior Assumption (CPA):** Many economists reject CPA. They argue rational people *can* have different priors.
      *   *Reporter Note:* If you classify as **Divergent Priors**, acknowledge that some theorists believe this should not happen among true peers. However, for reporting purposes, treat the priors as fixed constraints.
  3.  **Values vs. Beliefs:** Aumann applies to beliefs (probabilities), not utilities (values).
      *   *Reporter Note:* If a dispute is actually about risk tolerance (e.g., "Is a 1% catastrophe risk acceptable?"), Aumann does not apply. Classify as **Outside Theorem's Domain**.

  ### Final Judgment Call Checklist
  *Before filing, confirm you have answered:*
  1.  Did I distinguish between a factual claim and a value judgment?
  2.  Did I verify if the disagreement vanishes if data is shared?
  3.  Did I avoid claiming one side is "irrational" unless their reasoning was opaque?
  4.  Did I acknowledge that "Divergent Priors" is a classification, not a verdict on truth?

  **End of Procedure.**
