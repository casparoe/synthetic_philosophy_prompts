answer: |-
  For the purposes of a graduate seminar focused on technical coherence rather than intuitive plausibility, I will take a definitive stance: **Epistemicism is the more defensible account.**

  While Supervaluationism offers a more palatable metaphysics of ordinary language, it collapses under the weight of its own formal machinery, particularly regarding higher-order vagueness and probability. Epistemicism, despite its counter-intuitive commitment to sharp boundaries, provides a semantically classical framework that remains internally consistent where Supervaluationism fractures.

  Here is the technical comparison based on your three points, culminating in the specific vulnerabilities of the supervaluationist position.

  ### 1. The Metaphysics of Borderline Cases
  The core disagreement here is between **semantic ignorance** (Epistemicism) and **semantic indeterminacy** (Supervaluationism).

  *   **Epistemicism:** Asserts that vague predicates have classical extensions. For any object $o$ and predicate $F$, either $Fo$ or $\neg Fo$ is the case. The "borderline" status is purely epistemic: we cannot know which side of the cut-off $o$ lies on due to the sensitivity of knowledge to small changes (Williamson's *margin for error* principles).
  *   **Supervaluationism:** Asserts that vague predicates lack a unique extension. Instead, they have a set of admissible precisifications. A sentence is *supertrue* if true on all precisifications, *superfalse* if false on all, and *indeterminate* otherwise.

  **Assessment:** Epistemicism is metaphysically leaner. It requires no new ontological category of "indeterminate facts." It treats vagueness as a limitation of cognitive access to classical reality. Supervaluationism, conversely, posits a semantic model where truth is relativized to a set of precisifications. The vulnerability here is that Supervaluationism must explain what *admissibility* consists in without invoking vagueness itself (which leads to the higher-order problem). If admissibility is sharp, the boundary of the predicate is merely shifted to the boundary of the set of precisifications. If admissibility is vague, the model lacks a determinate domain. Epistemicism avoids this by locating the vagueness in the *knower*, not the *world* or the *semantics*.

  ### 2. The Logic of Vagueness
  This is often where Supervaluationism is thought to shine, preserving the Law of Excluded Middle (LEM) while rejecting Bivalence. However, a technical inspection reveals significant costs.

  *   **Epistemicism:** Endorses classical logic wholesale. Bivalence holds ($P \lor \neg P$ is true, and one disjunct is true). Inference rules like Conditional Proof and Disjunction Introduction function normally.
  *   **Supervaluationism:** Endorses "Superclassical" logic. LEM holds ($P \lor \neg P$ is supertrue because on every precisification, either $P$ is true or $\neg P$ is true). However, **Bivalence fails** (neither $P$ nor $\neg P$ may be supertrue). Crucially, this breaks the link between truth and assertibility and violates standard inference rules. Specifically, the **Rule of Disjunction** fails: one can infer $A \lor B$ is supertrue without $A$ being supertrue or $B$ being supertrue. Similarly, Existential Generalization can fail (one can have $\exists x Fx$ supertrue without any specific term $a$ making $Fa$ supertrue).

  **Assessment:** Epistemicism preserves the logic we actually use in reasoning. Supervaluationism creates a divergence between *truth* (supertruth) and *logical validity*. If a seminar aims to teach how we reason with vague terms, Supervaluationism forces us to teach a logic where we can assert $P \lor \neg P$ but cannot assert $P$ and cannot assert $\neg P$. This makes the logic of supertruth a logic of *determinacy*, not truth. Epistemicism avoids this fragmentation; it maintains that the oddities of vagueness are epistemic, not logical.

  ### 3. Credence and Higher-Order Vagueness (The Decisive Point)
  This is the technical fulcrum. Your intuition is correct: the supervaluationist account of credence is formally unstable.

  *   **The Supervaluationist Measure Problem:** To assign a credence to a borderline proposition $P$, the supervaluationist typically suggests $Cr(P) = \mu(\{p \in \mathcal{P} : P \text{ is true on } p\})$, where $\mathcal{P}$ is the set of admissible precisifications and $\mu$ is a probability measure.
      *   **The Vulnerability:** This requires $\mathcal{P}$ to be a well-defined set to support a measure space. However, the set of *admissible* precisifications is itself vague (Higher-Order Vagueness). There is no sharp line between an admissible and an inadmissible precisification. Consequently, there is no fact of the matter about the domain of the measure function. If the domain is vague, the measure is undefined. One might try to solve this by introducing "precisifications of precisifications," but this launches a regress. Without a sharp domain, you cannot generate the precise real numbers required for a credence function. The theory cannot account for the *degrees* of belief we hold about borderline cases without presupposing the sharp boundaries it seeks to deny.
  *   **The Epistemicist Account:** Credence is standard subjective probability regarding a factive state of affairs. $Cr(Pa) = 0.5$ reflects the agent's uncertainty about where the sharp cut-off lies.
      *   **The Strength:** Williamson handles Higher-Order Vagueness (HOV) not by blurring boundaries further, but by iterating margin-for-error principles. To know that you know $P$, you need a larger margin for error than simply knowing $P$. This creates a hierarchy of knowledge operators ($K, KK, KKK...$) that diminishes over iterations. This is formally modelable within classical modal logic (specifically, non-transitive accessibility relations). It does not require a measure over semantic entities, only a probability distribution over possible world-states (where the extension of $F$ varies slightly).

  ### Verdict and Conclusion

  **Epistemicism is the more internally coherent theory.**

  While Supervaluationism respects the pre-theoretic intuition that there is "no fact of the matter" about borderline cases, it pays for this intuition with formal incoherence. The **Measure Problem** regarding credence is fatal: a theory of vagueness that cannot formally accommodate rational credence in vague propositions is incomplete. By relying on a set of precisifications that must be sharp enough to measure but vague enough to model vagueness, Supervaluationism contradicts itself.

  **Where Supervaluationism is Genuinely Vulnerable:**
  1.  **The Regress of Admissibility:** It cannot define the boundary of the set of precisifications without invoking the very vagueness it aims to model.
  2.  **The Disconnect in Logic:** It validates $P \lor \neg P$ while invalidating the move from $P \lor \neg P$ to "Assert $P$ or Assert $\neg P$," rendering the logic disconnected from normative rules of assertion.
  3.  **The Probability Gap:** It cannot ground the real numbers used in credence functions without assuming a sharp measure over a vague domain.

  **Why Epistemicism Wins:**
  Epistemicism accepts a high metaphysical cost (sharp boundaries) to secure semantic and logical stability. It allows for a classical model theory, a classical logic, and a standard Bayesian account of credence. For a graduate seminar, the lesson should be that **formal coherence often demands counter-intuitive metaphysics.** Supervaluationism tries to have it both ways—classical logic with non-classical truth—and in doing so, fails to provide a rigorous account of how we quantify our uncertainty about the vague world. Epistemicism admits the uncertainty is about the world (or our access to it), allowing the formal machinery to function as intended.
