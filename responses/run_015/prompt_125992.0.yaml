answer: |-
  Accepting your stipulations regarding the *Mauerschützenprozesse*, including the existence of published Border Law, unpublished instructions, the courts' reliance on Radbruch and interpretive rescue, and the graded outcomes, we proceed to the analysis. The four-question decomposition—Validity, Excuse, Adjudicative, Transmission—reveals how the Hart–Fuller exchange maps onto the specific predicaments of the guards, commanders, and courts.

  **Disciplined Mapping**

  For Hart, the Validity question is straightforward: the Border Law was law. It possessed the pedigree of enactment by a sovereign authority. The guards and commanders faced a valid legal norm. On the Excuse question, Hart distinguishes legal validity from moral merit. Obeying the law provides no moral excuse for wrongdoing, but legally, the act was authorized. The guards' obligation was to follow the law, but their moral obligation was to refuse. For the Adjudicative question, Hart demands honesty. The successor court faces a conflict between legal certainty (no retroactivity) and justice. Hart argues the court should acknowledge the prior law was valid but morally wicked, and punish via honestly enacted retroactive legislation. To disguise this as interpretation is a lie. On Transmission, the absorption of the GDR complicates matters but does not change the nature of the prior norm. The FRG inherits the legal reality; if it wishes to punish, it must legislate retrospectively, admitting the breach of the nullum crimen principle.

  For Fuller, the Validity question turns on the internal morality of law. The stipulated existence of unpublished instructions pressing prevention "at any cost" creates a failure of congruence between declared rule and official action. Thus, the norm authorizing shootings lacked legal character. The guards and commanders faced not law, but coercive orders masked as law. Their obligation was to the law itself, which forbade such arbitrary violence. On the Excuse question, if the norm was not law, there is no legal authorization to plead. Liability attaches because the act was never legally protected. For the Adjudicative question, the court does not punish retroactively; it discovers the nullity. The court's obligation is to uphold the integrity of law by denying status to corrupt norms. On Transmission, the continuity of the German legal order allows the FRG to judge the GDR by the standards of law itself, which the GDR failed to meet. Getting it right means revealing the GDR regime's failure to satisfy the conditions of legality.

  **Explanatory Power**

  Fuller's position better explains the courts' reasoning style. The Federal Court's insistence that invalidity was "discovered" via the Radbruch formula aligns with Fuller's claim that extreme injustice is not law. The heavy reliance on interpretation—reading the Border Law in a "human-rights-friendly way" before invoking Radbruch—mirrors Fuller's view that law implies purpose and morality. The courts treated the unpublished instructions as evidence that the published law was not what the regime claimed it to be, a classic Fullerian congruence argument.

  Hart's position explains the discomfort of the German legal literature. The critics who attacked the retroactivity reasoning were effectively channeling Hart: they saw the courts denying the validity of the GDR law as a fiction that undermined legal certainty. Hart explains why the outcome feels juridically unstable: the courts punished conduct that was legal under the system in which it occurred without honest retroactive legislation.

  However, both theories are silent on the graded sentences. Neither Hart nor Fuller provides a jurisprudence of sentencing gradients. The fact that trigger-pullers received suspended sentences while political leaders received prison terms is a function of criminal law doctrine regarding culpability and indirect perpetration, not jurisprudential theory regarding the nature of law. Similarly, neither theory fully accounts for the Transmission nuance. The FRG's claim to be the continuation of a single order allowed it to treat GDR law as a defective version of "German law" rather than foreign law. This specific political-legal maneuver sits outside the abstract Hart–Fuller debate, which assumes distinct legal orders.

  **Reverse Analysis and Position**

  Running the analysis in reverse, does the episode vindicate Hart or Fuller, or does it show the quarrel was adjudicatively inert?

  The episode suggests the quarrel was largely inert, utilized instrumentally to secure a political outcome. The courts adopted Fuller's language to avoid Hart's prescription. Hart would have required the FRG to pass retroactive statutes admitting the breach of legal certainty. This was politically untenable for a state claiming constitutional continuity and the rule of law. Fuller's framework provided the necessary cover: if the GDR norms were never law, no retroactivity occurred. However, this required stretching the Radbruch formula beyond its original scope, treating "unbearable injustice" as a threshold for validity rather than a moral override.

  Nevertheless, I take the position that the episode vindicates Fuller, but only contingently, based on your stipulation regarding unpublished instructions. Hart's standing challenge to Fuller is whether a regime can satisfy the internal morality (generality, clarity, prospectivity) while being substantively abominable. If the GDR had published its "shoot to kill" orders clearly and consistently, Hart would be right: the norms would be valid law, and punishment would require retroactive legislation. In that hypothetical, Fuller's theory would offer no purchase, and the courts would be forced into Hart's honest retroactivity.

  However, the *Mauerschützen* case was not that hypothetical. The regime relied on secrecy and the divergence between published law and secret instruction. This is a failure of congruence and promulgation, core elements of Fuller's internal morality. The regime was not just substantively abominable; it was procedurally corrupt. It could not maintain its substantive evil without violating the internal morality of law. This suggests that while Hart is logically correct that clear, evil laws are possible, in practice, sustained substantive abomination tends to corrode procedural legality. Regimes that violate fundamental human rights often require secret police, unpublished decrees, and arbitrary enforcement to survive.

  This distinction saves Fuller's claim that the internal morality is a morality of *law*, not just efficacy. If a regime fails congruence to achieve evil ends, it fails legality. The *Mauerschützen* courts were correct to find invalidity, not because the law was evil, but because it was not law. They obscured this by mixing Radbruch (substantive injustice) with interpretive rescue (procedural congruence).

  Ultimately, the transmission question dictates the outcome. Because the FRG absorbed the GDR, it could not treat GDR law as foreign. It had to treat it as a defective predecessor. This forced a Fullerian resolution: the predecessor was not a true legal order. Hart's model works better for distinct sovereigns where retroactive legislation is politically feasible. Here, continuity demanded validity be denied. The jurisprudence was not inert; it was constrained by the politics of unification. The courts used Fuller to solve a Transmission problem Hart did not anticipate.

  Thus, the case vindicates Fuller only because the GDR failed its own internal standards. Had the GDR been a "clean" tyranny, Hart would have won, and the courts would have had to admit retroactivity. The fact that they did not suggests that substantive abomination rarely leaves internal morality intact. The internal morality is not merely efficient; it is a barrier to tyranny. When tyranny breaches it, as here, Fuller provides the tools for successor courts to restore legality without admitting to lawlessness themselves. Hart's demand for honesty is morally superior but politically impossible in a unification context. The courts chose legitimacy over honesty, using Fuller's theory to bridge the gap. This does not refute Hart's logical point, but it demonstrates Fuller's practical utility in transitional justice where continuity is claimed. The quarrel was not inert, but it was subordinate to the demands of the Transmission question.
