  *Title Idea:* The Bedrock of Trust: Dissolving the Prior Warrant Paradox.
  *Opening:* Hook the students. The paradox feels like a trap.
  *Middle:* The Gauge vs. Memory. The nature of the "check."
  *Climax:* The Circularity charge. Is it vicious?
  *Conclusion:* The Dogmatist is right, but for specific reasons (transcendental necessity).

