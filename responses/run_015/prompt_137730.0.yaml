prompt: |-
  In most cities the remedy adopted over the last decade for a contested monument has not been destruction but relocation: the statue is lifted from its pedestal and offered to a museum or stored in a depot, the plinth is sometimes left empty or fitted with an explanatory plaque, and the whole operation is described as recontextualization rather than erasure. When the contested object is a name rather than a statue — a street, a school — the remedy is characteristically the reverse: not removal but addition, an honorary co-designation mounted beneath the official sign, which leaves every address, map, and legal record untouched. Some commemoration commissions are now discussing a third option for new monuments: a commemorative authorization granted for a fixed term, renewable only if a standing body votes that the honoree still merits civic honor, with any monument whose authorization lapses transferred to an off-site archive open by appointment.

  What view of what a monument does does this family of practices presuppose? I want three things pressed in particular. First, does relocation-plus-contextualization presuppose that a statue's honoring is a function of its setting and its framing — so that the same bronze, in a gallery behind wall text, has stopped honoring and started only teaching — and is that defensible, or does it merely move the difficulty somewhere else? Second, what explains the asymmetry between statues, which get taken down, and names, which get added to: does the practice presuppose that a name's honorific force is detachable from its use as an address, and is that distinction stable enough to bear the weight placed on it? Third, does the renewable-authorization scheme presuppose that honoring is an ongoing act performed by the present polity rather than a completed act of a past one or a piece of testimony about what happened — and if honoring is ongoing in that sense, what follows for the default: does an un-renewed monument become a kind of speech, and do private commemorations, a family stone or a donor plaque in a hospital corridor, need authorization as well?

  Say finally where the practice is underdetermined: which rival theories of commemoration would license the same policy, so that nothing the commission is doing forces a choice among them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A paragraph describing three contemporary practices regarding contested monuments/names: (1) Relocation/Recontextualization (statues to museums), (2) Co-designation/Addition (street/school names), and (3) Renewable Authorization (term-limited monuments).
      *   **Task:** Identify the underlying view of what a monument *does* presupposed by these practices.
      *   **Specific Requirements:**
          1.  Address relocation-plus-contextualization (setting/framing vs. inherent honor, defensibility).
          2.  Address the asymmetry between statues (removal) and names (addition) (detachability of honorific force, stability of distinction).
          3.  Address renewable authorization (ongoing act vs. completed act/testimony, implications for defaults and private commemoration).
          4.  Identify where the practice is *underdetermined* (which rival theories license the same policy).
      *   **Tone/Style:** Philosophical, analytical, precise, critical.

  2.  **Deconstruct the Source Text & Identify the Core Presupposition:**
      *   *Observation:* All three practices treat commemoration as *mutable*, *context-dependent*, and *administratively manageable*. They avoid "erasure" (destruction) but seek to modify the *effect* of the commemoration.
      *   *Core View:* Monuments are not static historical records or permanent endorsements. They are *speech acts* or *performative gestures* by the state that require ongoing maintenance of meaning to remain valid. The meaning is separable from the material object.

  3.  **Drafting Section 1: Relocation and Context (The Statue):**
      *   *Question:* Does moving a statue to a museum stop it from honoring and start it teaching? Is this defensible?
      *   *Analysis:* The practice assumes honor is a function of *pedestal + public space*. Remove the pedestal, add wall text, and the "honor" signal is neutralized.
      *   *Critique:* Is it defensible? Maybe partially. Context matters. But does it merely move the difficulty? Yes. A statue of a slaveholder in a museum still occupies space, costs money to maintain, and might be revered by visitors. It shifts the burden from "public square" to "curatorial choice." It assumes the museum is a neutral zone of "history" rather than a space of "honor."
      *   *Key Point:* It presupposes honor is *spatial* and *framed*. It risks assuming context can fully overwrite content.

  4.  **Drafting Section 2: Asymmetry of Names vs. Statues:**
      *   *Question:* Why remove statues but add to names? Is a name's honor detachable from its utility as an address?
      *   *Analysis:* Statues are purely symbolic (no utility). Names are functional (addresses, mail, maps). Removing a name causes logistical chaos. Adding a name (co-designation) dilutes the honor without breaking the function.
      *   *Critique:* This presupposes the honorific force of a name is *divisible*. "Robert E. Lee Street" vs. "Martin Luther King Jr. / Robert E. Lee Street." Does the addition neutralize the honor? Or does it create a palimpsest where the original honor persists underneath? Is the distinction stable? Probably not entirely. A name on a map is still a name. The "addition" strategy assumes that *dilution* equals *negation* of honor, which is a shaky semantic bet. It treats names as *infrastructure* first, symbols second, whereas statues are symbols first.

  5.  **Drafting Section 3: Renewable Authorization:**
      *   *Question:* Does this presuppose honoring is an ongoing act by the present polity? What follows for the default? Private commemorations?
      *   *Analysis:* Yes, it treats commemoration as a *contract* or *lease*, not a *gift* or *deed*. It requires present consent.
      *   *Implications:* If honoring is ongoing, then silence (non-renewal) implies withdrawal of consent. The monument becomes "archival" (speech about the past, not honor for the present).
      *   *Private Commemoration:* If the state's logic is "honor requires current consent," does that apply to private actors? If the theory is about *civic* space, maybe not. But if the theory is about *moral* honor, then yes. This reveals a tension: is the regulation about *state speech* or *public morality*? If the former, private stones are safe. If the latter, they are vulnerable.
      *   *Key Point:* It shifts monuments from *testimony* (this happened) to *endorsement* (we still value this).

  6.  **Drafting Section 4: Underdetermination:**
      *   *Question:* Which rival theories license the same policy?
      *   *Analysis:* The policies are pragmatic compromises.
      *   *Theory A (Expressive Harm):* Monuments cause harm to marginalized groups. Removal/Contextualization reduces harm.
      *   *Theory B (Historical Accuracy):* Monuments distort history. Museums/Plaques correct history.
      *   *Theory C (Democratic Legitimacy):* Public space must reflect current values. Renewable authorization ensures this.
      *   *The Conflict:* A preservationist who believes monuments are *art* might agree to relocation (save the art, move the context). A progressive who believes monuments are *oppression* might agree to relocation (remove from public eye). They agree on the *policy* (move it) but for opposite *reasons* (preserve art vs. stop oppression).
      *   *Another angle:* "Erasure vs. Education." Both the "Don't Erase History" crowd and the "Teach Real History" crowd might agree on the museum solution, but one sees it as saving history, the other as contextualizing lies. The policy doesn't force a choice between "Monuments as History" and "Monuments as Honor."

  7.  **Review and Refine:**
      *   *Check constraints:* Did I answer all three specific presses? Yes. Did I address underdetermination? Yes.
      *   *Tone Check:* Ensure the language is philosophical (e.g., "performative," "normative," "semantic stability").
      *   *Synthesis:* The overarching view is that commemoration is a *speech act* dependent on *felicity conditions* (context, audience, authority) rather than an intrinsic property of the object.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure to explicitly answer "is that defensible?" in section 1.
      *   *Correction:* Ensure the distinction between "address" and "honor" is clear in section 2.
      *   *Correction:* In section 3, clarify the "default" status of an un-renewed monument.
      *   *Correction:* In the underdetermination section, be specific about *which* theories converge.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  The family of practices described presupposes a **performative and contextualist theory of commemoration**. It treats monuments not as static historical records or permanent endowments, but as ongoing speech acts by the polity whose meaning and moral force depend on their framing, utility, and current authorization. The underlying view is that the "honor" conveyed by a monument is not an intrinsic property of the bronze or the name, but a relational status granted by the community's current arrangement of space and law.

  Here is the analysis pressed along the three specified lines, followed by the point of underdetermination.

  ### 1. Relocation and Contextualization
  The practice of moving statues to museums presupposes that a statue's honoring function is **contingent on its spatial and curatorial framing**. It assumes that the "pedestal in the public square" is the specific syntax of civic endorsement, and that removing the object from that syntax neutralizes its normative claim. By moving the statue behind wall text, the practice asserts that the object shifts from *prescribing* value (honor this man) to *describing* history (this man was important/controversial).

  Is this defensible? It is defensible only if one accepts that context can overwrite content. However, it likely **merely moves the difficulty**. A museum is not a neutral vacuum; it is itself a site of curation and preservation. Placing a contested figure in a "Hall of History" still allocates public resources to their maintenance and grants them a form of immortality, albeit a scholarly one. It presupposes that "teaching" and "honoring" are mutually exclusive categories, yet museums often honor through the very act of preservation. The difficulty is not solved but displaced from the realm of *civic ritual* to the realm of *curatorial judgment*: the museum director now decides the meaning, rather than the city council, but the statue remains a focal point of attention. The practice assumes honor is fragile and context-dependent, but risks proving that honor is sticky and context-resistant.

  ### 2. The Asymmetry of Statues and Names
  The asymmetry—removing statues but adding to names—presupposes that the honorific force of a name is **detachable from its functional utility as an address**, whereas the honorific force of a statue is not detachable from its visual dominance.

  For statues, the visual presence *is* the function; there is no utility other than symbolism. For street names, the primary function is navigational and logistical. The practice assumes that by layering a new name (co-designation), the original honorific signal is diluted or "jammed" without breaking the logistical infrastructure. This presupposes that honor is a zero-sum resource in signage: that adding "MLK Jr." beneath "Jefferson Davis" reduces the honor due to Davis.

  Is this distinction stable enough? **Likely not.** A name on a map retains its singularity in common usage (people will still say "Davis Street" out of habit). Unlike a statue, which can be physically hidden, a name cannot be partially erased; it remains in legal records and GPS systems. The practice bets on a semantic theory where *addition equals subtraction* of status. This is unstable because it relies on the public reading the plaque as a correction rather than a complication. If the public views co-designation as "inclusivity" rather than "indictment," the original honor remains intact, merely sharing space. The practice treats names as *infrastructure* that can be patched, whereas statues are *icons* that must be exorcised.

  ### 3. Renewable Authorization
  The renewable-authorization scheme presupposes that honoring is an **ongoing performative act by the present polity**, rather than a completed historical transaction or a piece of testimony. It rejects the idea that a monument is a deed granted in perpetuity by a past generation. Instead, it treats civic honor as a lease that requires current consent.

  If honoring is ongoing, the default status of an un-renewed monument changes fundamentally. It does not become "false"; it becomes **unauthorized speech**. It transitions from a voice of the state to an artifact of the state. The implication is that without active renewal, the monument loses its *illocutionary force* (its power to honor) and retains only its *locutionary content* (its existence as an object).

  This raises a critical boundary problem regarding private commemoration. If the theory is that *civic* space requires *current civic* consent, then family stones or donor plaques in private hospitals are exempt because they are not state speech. However, if the theory is that *moral* honor requires current consensus to be valid, then private commemorations in public-facing spaces (like a hospital corridor) might logically require similar authorization. The practice implies the former (a theory of state speech), but risks sliding into the latter (a theory of public morality). If honoring is truly ongoing, then any permanent claim on public attention arguably requires a mechanism for revocation, regardless of who funded it.

  ### Where the Practice is Underdetermined
  The policies described are **underdetermined** because they are compatible with rival theories of what commemoration *is*. Specifically, the policy of **relocation to a museum** licenses two contradictory theoretical commitments:

  1.  **The Preservationist Theory:** Monuments are art/history that must be saved from destruction (vandalism/erasure). Relocation protects the object.
  2.  **The Harm-Reduction Theory:** Monuments are sources of active injury to marginalized citizens. Relocation removes the harm from the public sphere.

  Both theories support the *same policy* (move the statue to a depot/museum) but for opposite reasons. The commission does not have to choose between "saving history" and "stopping oppression"; the policy allows them to claim they are doing both. Similarly, **renewable authorization** is compatible with both a **Democratic Theory** (the people must consent to their symbols) and a **Pragmatic Theory** (this avoids the political cost of permanent removal). Because the policy works as a compromise, it does not force a choice between viewing monuments as *permanent testimony* (which renewal undermines) or *temporary endorsement* (which renewal confirms). The practice hovers between these theories, allowing different stakeholders to project their own view onto the mechanism without resolving the philosophical conflict.
