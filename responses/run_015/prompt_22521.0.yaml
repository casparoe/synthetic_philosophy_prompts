      *   *Hybrid Views:* Some philosophers try to split the difference (e.g., Croom).
      *   *Advice for the Piece:* Frame it as a tension between *stability* of meaning (semantics) and *flexibility* of use (pragmatics).

  5.  **Refining the Philosophy (Self-Correction/Nuance):**
