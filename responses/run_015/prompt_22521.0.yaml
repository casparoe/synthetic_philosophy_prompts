      *   *Refining the Semantic View:* It's not just "hurt feelings." It's about truth conditions or conventional implicature. The word *encodes* a negative perspective.
      *   *Handling the "In-Group" Use (Reclamation):*
          *   Option A: Meaning Change. The word literally changes meaning within the group (homonymy).
          *   Option B: Licensing. The semantic content is there, but the *norms* prohibiting its use are suspended for the in-group. (Analogy: Secrets).
      *   *Handling the "Reporting" Use:*
