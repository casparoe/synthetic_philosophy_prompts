      *   *Correction:* Don't use the formula explicitly, it might scare them off. Just explain the logic: If $V_E$ (environmental variance) is small, the ratio goes up.
      *   *Check:* Did I address the "can we only shift the 30%" question directly?
      *   *Correction:* Yes, need to explicitly say "No, you can shift much more than that."
      *   *Check:* Is the distinction between *mean* and *variance* clear?
      *   *Correction:* This is the hardest part. Heritability explains *why kids differ from each other*. Interventions change *where everyone sits*. I need to make sure this distinction is bold.

  6.  **Final Polish:** (This leads to the structure of the provided good response.)
