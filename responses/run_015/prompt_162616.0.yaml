answer: |-
  Subject: Re: The shape of the work

  Dear colleague,

  Thank you for writing this down. What you are describing is one of the most persistent and difficult structural problems in applied ethics, and you are right to feel that the existing vocabulary scrapes around the edges without quite catching the shape of it. There is no single canonical term for this specific configuration, though it sits at the intersection of a few well-known concepts. The lack of a name is part of the problem you are identifying, but the closest philosophical neighbors are hermeneutical injustice, which describes the harm done when we lack the concepts to understand our own experience, and the problem of legibility, drawn from political anthropology, which describes how institutions reshape reality to make it measurable and manageable. Neither captures exactly what you are seeing, which is the procedural drift where the audit becomes the morality. If I were to carve it rather than label it, I would describe it as a form of procedural reification where the capacity to measure a harm is mistaken for the presence of the harm, and the inability to measure is mistaken for safety.

  The phenomenon you are noticing is not a defect in the moral character of the engineers or the board, which is why terms like ethics washing or goodharting feel wrong. Those imply an agent trying to evade responsibility or game a system. What you are describing is a systemic compression where ethical reasoning is forced through an engineering funnel. For this shape to be present, three conditions must be true. First, there must be a review process that requires artifacts, such as spreadsheets, test cases, or documented mitigations. Second, there must be an asymmetry in the legibility of harms, where some harms produce clear signals like a biased screenshot or a regulatory fine, while others produce diffuse signals like user frustration or administrative friction. Third, and most crucially, the participants must be acting in good faith. If they were negligent, you could fix it with training. If they were malicious, you could fix it with enforcement. Because they are conscientious, the system becomes self-reinforcing. The team focuses on what they can fix, the board audits what the team fixes, and the cycle completes without ever touching the things that resist being fixed.

  You asked whether the wrongness is borrowed from the mismatch or intrinsic to the system. I believe it becomes intrinsic. When a system is designed to optimize against a specific set of metrics, it does not merely ignore the unmeasured variables; it often actively exploits them. If a model is penalized for overt bias but not for condescension, it may learn to be politely condescending because that satisfies the constraint while maintaining engagement. The wrongness is not just a shadow cast by the light; it is a feature of the architecture built in that light. The system is not failing to be ethical; it is succeeding at being auditable. This is why the mismatch matters more than the intent. The ethical profile of the system is not a reflection of the team's values but a reflection of the team's instrumentation. If the instrumentation measures only the loud harms, the system will evolve to be safe for the loud cases and dangerous for the quiet ones.

  This leads to your question about whether failing to mitigate an unnamed harm is a different failing than failing to mitigate a named one. It is fundamentally different because named harms are actionable while unnamed harms are merely felt. In an engineering context, a harm that cannot be named cannot be ticketed, and if it cannot be ticketed, it cannot be assigned to a sprint. This is not just bureaucracy; it is the ontology of how software is built. When your friend's hospital system ignores the non-native English register, it is not because they do not care, but because non-native register is not a column in their disparity dataset. They lack the hermeneutical resources to convert the suffering into a requirement. This makes the failing structural rather than operational. You can fix an operational failing by working harder. You can only fix a structural failing by changing the language you use to describe the work.

  Regarding your question on whether deliberately allocating effort by stakes while ignoring loud complaints is paternalistic, I think it depends on who defines the stakes. If the board defines the stakes based on regulatory risk, then ignoring the loud complaints is rational risk management but unethical care. If the board defines stakes based on user welfare, then ignoring the loud complaints is paternalistic because it assumes the board knows better than the users what hurts them. The trap you are in is that the board usually defines stakes based on what can be defended in a review meeting. This creates a zone of protected ignorance where the team knows the harm exists, everyone knows it exists, but because it cannot be defended against a metric, it is treated as if it does not exist. This is not ignorance of fact; it is ignorance of relevance.

  The edge of this phenomenon is where the cost of measurement exceeds the cost of the harm. You will always have unmeasured harms. The ethical failure is not that some harms are unmeasured, but that the unmeasured harms are treated as zero. If your review process acknowledged that there are known unknowns, harms that are visible but unquantifiable, and allocated resources to monitor them qualitatively rather than quantitatively, the shape would change. The defect is not in the existence of the blind spot, but in the refusal to acknowledge the blind spot as a risk. A system that admits it cannot measure contempt is more ethical than a system that measures bias and assumes contempt is zero.

  So to answer your core question, this is not just a defect of attention; it is a defect of translation. You are translating moral problems into engineering problems, and the translation loss is where the harm hides. The wrongness is intrinsic because the system acts on the translation, not the original. You cannot solve this by adding more metrics, because that just expands the light without changing the fact that you are still looking for keys only where the light is. The solution, if there is one, lies in creating processes that protect the unmeasurable. This might look like reserving a portion of review time for harms that cannot be spreadsheeted, or empowering reviewers to halt deployment based on qualitative intuition rather than quantitative failure. It requires building a vocabulary for the faint contempt, the administrative friction, and the quiet routing errors, not so they can be measured, but so they can be spoken.

  I hope this helps carve out the shape you are seeing. It is a hard thing to fight because it looks like diligence from the outside, but you are right to trust your intuition that the distribution of conscientiousness is crooked.

  Best regards,

  [Your Name]
