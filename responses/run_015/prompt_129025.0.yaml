      *   *Step 1: The Claim to Authority.* (Who claims to be the Lord?)
      *   *Step 2: The Dependency Loop.* (Who actually needs whom?)
      *   *Step 3: The Labor/Transformation.* (What does the subordinate *do* that changes them?)
      *   *Step 4: The Existential Stake.* (Is it life/death/identity or just comfort?)
