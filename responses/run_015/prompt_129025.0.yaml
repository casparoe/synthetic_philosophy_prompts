      *   *Case 2: Warden/Inmate.*
          *   Warden = Lord. Inmate = Bondsman.
          *   Twist: Warden's authority *requires* the Inmate's refusal. If the Inmate submits, the Warden loses purpose.
          *   Verdict: Strong fit (Kojèvean reading).
      *   *Case 3: Mentor/Mentee (False Positive).*
          *   Dependence is real. But risk was avoided.
          *   Verdict: Fails Step 4 (Existential Stake) or Step 1 (Struggle). This is the "False Positive" flag.

  6.  **Defining Limitations:**
      *   Philosophy isn't plot.
      *   Doesn't generate voice, texture, or empathy.
      *   Can't fix bad prose.
      *   Risk of making characters too abstract.

  7.  **Refining the Tone:**
      *   Professional, precise, actionable.
      *   Respectful of the user's literary ambition.
      *   American English spelling and idioms.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Step 3:* Hegel emphasizes *work* (Labor) as the way the Slave finds independence. In a novel, this doesn't have to be physical labor. It can be emotional labor, artistic creation, or endurance. I need to make sure the checklist reflects this nuance.
      *   *Self-Correction on False Positive:* I need to make sure the user knows *why* the false positive is bad for *this specific philosophical framework*, even if it's a good relationship in real life. The prompt asks to reject it on narrative grounds *relative to the Hegelian aim*.
      *   *Formatting:* Use bolding and lists for readability.

  9.  **Final Review against Constraints:**
      *   30-minute execution? Yes, 5 steps.
