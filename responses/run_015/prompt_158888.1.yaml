answer: |-
  This is a sophisticated observation that cuts to the bone of why counterfactual debates in history often talk past one another. You have identified two distinct logical moves that are frequently conflated under the umbrella of "structural vs. agency" or "determinism vs. contingency."

  There is no single established term that captures the *confusion* between these two, but there are established concepts for each half of the distinction. The blur you are detecting is the failure to keep these two conceptual axes separate.

  Here is the shape of the thing, the established concepts that map onto it, where they diverge, and a proposed vocabulary for your chapter.

  ### 1. Version One: The Grain of the Effect
  **The Phenomenon:** The truth-value of the counterfactual changes depending on how finely the outcome ($E$) is described.
  **Established Concepts:** *Event Individuation* (Philosophy of Action), *Explanandum Granularity* (Social Science), *Causal Relata* (Metaphysics).

  In the philosophy of causation (e.g., David Lewis, Jaegwon Kim), a causal claim $C \rightarrow E$ is sensitive to the identity conditions of $E$. If you define $E$ as "a European War," Hitler is not necessary. If you define $E$ as "the invasion of the USSR in June 1941," he is.
  *   **The Edge:** The boundary here is **semantic and conceptual**. It is about the *description* of the event. The dispute is not about the world, but about the *resolution* at which we are viewing the outcome.
  *   **The Blur:** Historians often treat "The Second World War" or "The Holocaust" as stable, singular nouns, when they are actually bundles of events that can be disaggregated. When a functionalist says "The war would have happened anyway," they are using a coarse-grained $E$. When an intentionalist says "The Holocaust required Hitler," they are using a fine-grained $E$. They are logically compatible, but rhetorically presented as contradictory.
  *   **Proposed Label:** **Explanandum Granularity**.
  *   **Diagnostic:** Ask: *If the alternative scenario produces a war, but not this war, does the historian count the counterfactual as 'same outcome' or 'different outcome'?* If they count it as the 'same outcome,' they are using coarse granularity.

  ### 2. Version Two: The Replaceable Occupant
  **The Phenomenon:** The specific token cause ($c$) is admitted to be necessary for the specific token effect ($e$), but the *type* of cause ($C$) is deemed structurally determined to produce a similar effect ($e^*$).
  **Established Concepts:** *Token vs. Type Causation* (Philosophy), *Structural Functionalism/Role Theory* (Sociology), *Equifinality* (Systems Theory).

  This is not about how we describe the effect, but about the **modal robustness** of the causal mechanism.
  *   **Token Causation:** In the actual world, Hitler ($token$) caused the Holocaust ($token$). Without *this* man, *this* specific chain of events breaks.
  *   **Type Causation:** In the set of possible worlds close to ours, the structural pressures (Versailles, Depression, Antisemitism) ensure that *a* demagogue ($type$) emerges and produces *a* genocide ($type$).
  *   **The Edge:** The boundary here is **ontological and sociological**. It is about the *substitutability* of the causal agent. This is the core of the "Great Man" debate. The structuralist concedes the token causation (Hitler did it) but denies the *uniqueness* of the token (anyone in that slot would have done it).
  *   **The Blur:** Historians slide from "Hitler was necessary" (Token) to "The conditions made a dictator inevitable" (Type) without acknowledging they have shifted from discussing the *actual sequence* to discussing *structural propensity*.
  *   **Proposed Label:** **Causal Substitutability** (or *Token-Type Slippage*).
  *   **Diagnostic:** Ask: *Does the historian argue that the outcome would be identical (same timing, same method), or merely 'recognisably similar'?* If 'recognisably similar,' they are arguing for Type Causation/Structural Substitutability.

  ### 3. The Distinction and The Collision
  You asked if these are the same phenomenon in another guise. **They are distinct, but they interact to create the confusion.**

  *   **Version 1 (Granularity)** is about the **Explanandum** (The Effect). It asks: *How specific must the result be for us to call it "the same history"?*
  *   **Version 2 (Substitutability)** is about the **Explanans** (The Cause). It asks: *How specific must the agent be for us to call them "the cause"?*

  **The Collision:**
  The "Great Man vs. Structure" debate is often a collision of Version 1 and Version 2 claims masquerading as a single disagreement.
  *   The Intentionalist argues: Token Cause (Hitler) $\rightarrow$ Fine-Grained Effect (Specific Holocaust).
  *   The Structuralist argues: Type Cause (Fascist Slot) $\rightarrow$ Coarse-Grained Effect (Authoritarian Aggression).

  When they argue, the Intentionalist says, "Without Hitler, no gas chambers." (Version 1: Fine Grain). The Structuralist says, "Without Hitler, still a war and still persecution." (Version 1: Coarse Grain + Version 2: Substitutability).

  They are not disagreeing about the facts; they are disagreeing about the **Counterfactual Sensitivity** of the system at different levels of abstraction.

  ### 4. Proposed Vocabulary for Your Chapter
  To disentangle this in your prose, I propose you adopt the following distinctions:

  **1. Effect Specificity (for Version 1)**
  Use this to describe the grain of the outcome.
  *   *High Specificity:* "The Wannsee Conference occurs on Jan 20, 1942."
  *   *Low Specificity:* "State-sponsored mass murder occurs in the 1940s."
  *   *The Diagnostic:* **The Identity Test.** If the alternative scenario occurs, is it the *same event* or a *different event of the same kind*?

  **2. Causal Substitutability (for Version 2)**
  Use this to describe the replaceability of the agent.
  *   *Low Substitutability:* "Only Hitler could have unified the party and radicalized the SS." (Unique Token)
  *   *High Substitutability:* "Any leader of the NSDAP would have moved toward expansion." (Fillable Slot)
  *   *The Diagnostic:* **The Vacancy Test.** If the actor is removed, does the *mechanism* collapse, or does the *structure* select a replacement?

  **3. Modal Robustness (The Synthesis)**
  This is the overarching concept. A historical outcome is **Robust** if it survives the removal of specific agents (Low Substitutability) and persists across coarse descriptions (Low Specificity). It is **Fragile** if it depends on specific agents and fine details.
  *   *Usage:* "The Structuralist argument relies on the claim that the Third Reich was *modally robust* regarding leadership (High Substitutability), whereas the Intentionalist argues the Holocaust was *modally fragile* regarding Hitler's specific will (Low Substitutability + High Specificity)."

  ### 5. Summary of Boundaries
  To answer your question on where the boundaries lie:

  *   **Version 1 becomes clear** when both sides agree on the *description* of the outcome. If both agree to evaluate "The Holocaust as it historically occurred," Version 1 disappears, and you are left with factual causation.
  *   **Version 2 becomes clear** when both sides agree on the *uniqueness* of the agent. If both agree to evaluate "Hitler specifically," Version 2 disappears, and you are left with the question of whether his specific actions were determined by structure.

  **The Diagnostic for Historian's Prose:**
  When reading a counterfactual claim, isolate the **If** and the **Then**.
  1.  **Check the Then:** Is the outcome described as a specific event ("Invasion of Russia") or a category ("Eastern War")? $\rightarrow$ *Explanandum Granularity.*
  2.  **Check the If:** Is the removed cause a specific person ("Hitler") or a role ("The Führer")? $\rightarrow$ *Causal Substitutability.*

  If the text slides between these without signaling, you have identified the blur. You can describe this not as a logical error, but as a **Level-of-Analysis Shift**. The historian moves from the *narrative level* (specifics) to the *sociological level* (types) to make their point, but presents it as a single claim about "what would have happened."

  ### Recommendation
  In your chapter, do not look for a single existing term to fix this, because the field blurs them precisely to maintain rhetorical force. Instead, frame your contribution as **disaggregating the counterfactual claim**.

  Call Version 1 **The Problem of Effect Individuation**.
  Call Version 2 **The Problem of Agent Substitutability**.

  Argue that the "Intentionalist-Functionalist" debate persists not because the evidence is ambiguous, but because the two sides are often answering different questions: one about the *identity* of the events (V1) and one about the *necessity* of the agents (V2). Your vocabulary allows you to show that a historian can be a structuralist about V2 (slots are fillable) but an intentionalist about V1 (specific outcomes require specific decisions), and that failing to distinguish these leads to the "blurring" you have identified.
