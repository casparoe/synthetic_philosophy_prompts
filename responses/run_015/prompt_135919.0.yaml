          *   **Fact:** ISOTYPE (International System of TYpographic Picture Education) was developed primarily through the Social and Economic Museum in Vienna (Gesellschafts- und Wirtschaftsmuseum) starting in the 1920s. The *International Encyclopedia of Unified Science* was a later project (started around 1938, published by the University of Chicago Press), edited by Neurath, Carnap, and Morris. While related in spirit (unified science), ISOTYPE predates the Encyclopedia and was not developed *within* it. The Encyclopedia was meant to be a comprehensive collection of scientific knowledge, while ISOTYPE was a method of visual statistics/education. They are connected but the timeline and institutional home are slightly off in the summary.
      *   *Claim 2: Images lack grammatical structures for negation/modal claims, dissolving metaphysical pseudo-problems.*
          *   **Fact:** Neurath did argue that pictures show what *is* the case but struggle with what *is not* the case (negation) or what *might* be the case (modality). He famously noted you cannot picture "not." However, the leap to "automatically dissolve metaphysical pseudo-problems such as the existence of the external world" is a bit nuanced. Neurath was a physicalist and anti-metaphysical. He believed that sticking to observable, picturable facts would avoid metaphysics. But the specific claim about negation leading to the dissolution of the "external world" problem needs care. Usually, the lack of negation means pictures are limited, not that they solve skepticism about the external world directly. In fact, Neurath's anti-metaphysical stance was more about rejecting private experience (phenomenalism) in favor of physicalistic statements. The summary suggests a stronger linguistic determinism than Neurath might have explicitly claimed regarding the *external world* specifically via *negation*. He believed pictures enforce a focus on spatio-temporal order.
      *   *Claim 3: Rejected Carnap's protocol sentences in favor of Ballungen.*
          *   **Fact:** Neurath did critique Carnap's early protocol sentences (which were based on private experience/phenomenalism). Neurath advocated for physicalistic protocol sentences. The term *Ballungen* (clusters or foggy clusters) refers to Neurath's holistic view of knowledge. He believed statements are not atomic but come in clusters that can be adjusted. He did argue against the idea of incorrigible protocol sentences (foundationalism). So, the rejection of Carnap's *early* protocol sentences is accurate. The use of *Ballungen* to describe the holistic nature of science vs. atomic decomposition is accurate.
      *   *Claim 4: Traditional philosophical analysis obsolete, visual atlas to replace metaphysics altogether.*
          *   **Fact:** Neurath was part of the Vienna Circle, which aimed to eliminate metaphysics. He saw the Encyclopedia as a tool for unified science. He did believe traditional metaphysics was nonsense. However, "visual atlas to replace metaphysics altogether" is a bit strong. The Encyclopedia was to unify science, not necessarily be a "visual atlas" in the sense of just pictures (though he wanted it to be accessible). The *International Encyclopedia of Unified Science* was text-heavy mostly, though he wanted visual elements. ISOTYPE was for public education, the Encyclopedia was for scientific unification. Conflating them slightly is a risk. He wanted to replace metaphysics with logical empiricism/unified science, not necessarily just pictures alone.
