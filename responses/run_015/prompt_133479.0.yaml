answer: |-
  In the climate-controlled conservation studio of the National Gallery, the head restorer—who served as the documented studio assistant to the deceased artist Elias Thorne for twenty years—undertakes a stabilization of Thorne's masterpiece *Vesper Blue* after a micro-fracture compromises the final glaze. Using Thorne's own preserved brushes and adhering strictly to his documented technique, the restorer replaces exactly one damaged pigment layer with a synthetic compound chemically indistinguishable from the original lead-tin yellow under all current spectroscopic analysis, executing the stroke with the exact pressure and viscosity Thorne employed. This restoration occurs five years after Thorne's death, executed with meticulous fidelity to his physical habits and material specifications, yet without any testamentary authorization or prior awareness from the artist, leaving the canvas physically and perceptually identical to its pre-restoration state but causally severed from the artist's living intent at the moment of that layer's deposition.

  Experiential structuralism verdicts that the painting retains its full artistic value because the replacement layer is chemically and perceptually indistinguishable from the original, ensuring the aesthetic experience remains identical to that of the authentic work. Causal-provenance essentialism, conversely, verdicts that the work's artistic value is compromised or lost because the specific pigment layer lacks the correct history of production; it was not caused by the artist's creative agency but by a surrogate after the artist's death. The feature doing the work here is **temporal-authorial discontinuity embedded within complete physical and procedural continuity**, a condition absent from standard forgery cases which typically involve material deception or procedural divergence. If we remove this feature by stipulating that Thorne authorized the assistant to complete such repairs posthumously, the divergence collapses: the essentialist causal chain remains unbroken through the authorized surrogate, and the structuralist experience remains unchanged, leading both theories to agree that value is preserved. However, an essentialist could attack the negative verdict in the original case by arguing that the assistant's decades of documented collaboration function as implicit standing authorization, contending that recognized studio practice extends rather than breaks the relevant causal chain, thereby challenging the rigidity of the requirement for explicit living consent.
