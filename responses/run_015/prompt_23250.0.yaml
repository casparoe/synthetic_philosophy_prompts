      *   *Method:* Habit formation ("custom settles habits of thinking"). Reason must be cultivated early, but adapted to the child's capacity.
      *   *The Tutor:* Locke strongly advocates for a private tutor over schools. The tutor must be a moral exemplar, vigilant, and attentive to the specific child's temperament.
      *   *Learning Process:* Curiosity should be encouraged, not beaten down. Rote memorization is bad. Understanding > Memory. "Great care is to be taken, that [children] be not overwhelmed with too many precepts."
      *   *Discipline/Authority:* Esteem and disgrace are better than corporal punishment. The tutor must maintain authority but not be a tyrant.
