answer: |-
  Good morning. Thank you for being here. I know many of you arrived late last night. I know some of you came straight from the field, from clinics where the generators failed, from distribution lines where the heat broke down. You are tired. Your work is hard. And the words you write determine who eats, who receives medicine, and who stays safe.

  We are here to talk about those words.

  In this room, we have two kinds of experts. We have linguists who study how language shapes thought. We have coordinators who study how policy shapes survival. You need each other. The linguists know that vague language protects power. The coordinators know that vague language gets people killed.

  George Orwell, a writer many of you know, argued that sloppy language makes political honesty impossible. He said we use long words and passive sentences to hide who is doing what. When we write "mistakes were made," we hide who made the mistake. When we write "resources were optimized," we hide who cut the budget. This is not just grammar. This is safety.

  In emergency health directives, ambiguity is a hazard. If we write "Vaccines were not delivered," we accept a lie. Vaccines do not deliver themselves. People and agencies deliver them. If the Ministry of Health halted the convoy, we write "The Ministry of Health halted the convoy." If the donor state withheld the funds, we write "The donor state withheld the funds." We do not write "Funding challenges occurred." Challenges do not withhold money. Governments do.

  I know this feels dangerous. I know the pressure to be polite. I know the pressure to keep access by softening our tone. But soft language hardens into neglect. When we use phrases like "collateral disruption," we turn displaced families into statistics. When we say "population movement," we erase the families running from fire. We must stop letting nouns do the work of verbs. Agencies act. States decide. People suffer.

  To our linguists: You understand the theory of this decay. You know how the passive voice distances the actor from the action. To our coordinators: You understand the cost. You know that when a directive says "access is restricted," it means soldiers turned back the trucks. You know that when a report says "service suspension," it means patients went without insulin.

  We are not here to accuse anyone in this room of hiding the truth. We work under immense pressure. We draft directives while exhausted. We use the phrases our bosses use. We use the phrases the donors require. The system encourages us to blur the lines. It asks us to say "logistical constraints" when we mean "the government blocked the road." It asks us to say "stakeholder alignment" when we mean "the agency refused to sign."

  This week, we break that habit.

  We will practice writing that names the agent. If the World Health Organization delays the approval, we write "The World Health Organization delayed the approval." If the Host State denies the visa, we write "The Host State denied the visa." We do not blame the "situation." The situation did not deny the visa. A state official did.

  This clarity protects you. When you name the decision-maker, you shift the burden of responsibility where it belongs. You stop carrying the guilt for systemic failures. You stop apologizing for decisions you did not make. Clear writing is not an academic exercise. It is a shield. It protects the reputation of your team when things go wrong. It ensures the historical record shows who acted and who failed.

  We will not use the phrase "resource optimization" in this room. We will say "budget cuts." We will not say "collateral disruption." We will say "families lost shelter." We will not say "it was decided." We will say "the Committee decided."

  Some of you worry this will make our reports too blunt. Some worry it will endanger our access. These are valid fears. But silence also endangers access. When we obscure the cause of a crisis, we prevent the solution. If we do not name the blockage, we cannot remove it.

  You are the ones on the ground. You see the reality. The linguists here will help you find the words that match that reality without breaking the protocols you must follow. Together, you will draft directives that are precise enough to enforce and honest enough to trust.

  We have five days. We have a lot of work. The emergencies outside these walls will not wait. But if we leave here with the ability to write the truth clearly, we will save time later. We will prevent misunderstandings. We will ensure that when a directive goes out, every reader knows exactly who must act and who is accountable.

  Take a breath. Drink some water. You are here because you care about the work. You are here because you want the words to match the need. Let's get to work.
