answer: |-
  The earning-to-give strategy relies on a specific optimization function: maximize income to maximize donations. But to optimize, you must measure. This requirement for measurability introduces a structural flaw known as the Ledger Problem. When moral obligation is framed as an individual balance sheet, value must be attributable to a specific agent to count toward their moral total. You need to know that *your* career choice caused *this* specific outcome. If the impact cannot be pinned to your name on a ledger, the logic of earning-to-give treats it as zero.

  This creates a perverse incentive in career selection. High-agency individuals motivated by effective altruism are funneled toward roles where impact is legible to an auditor—high finance, tech, or direct interventionism where metrics are sharp. Conversely, they are systematically discouraged from structural maintenance work. Institutional care, bureaucratic upkeep, and governance are essential for societal function, but they are inherently collaborative and diffuse. There is no single author of a stable institution; the credit is shared, delayed, or invisible. On the individual moral balance sheet, this work looks like inefficiency.

  Consequently, the talent pool required to sustain the very infrastructure of effectiveness is drained. Earning-to-give assumes a robust ecosystem exists to absorb and deploy capital efficiently. It assumes charities are well-managed, governments are stable enough to permit operation, and markets are reliable enough to generate surplus. But these are public goods maintained by the very people earning-to-give logic tells them to avoid.

  When every morally motivated actor tries to be the donor rather than the administrator, the institutional substrate degrades. Bureaucracies become brittle, oversight fails, and logistical channels clog. The donations still arrive, but their marginal utility plummets because the capacity to utilize them has been eroded by the career-selection logic of the donors themselves.

  This makes the strategy self-defeating not because the earnings are insufficient, but because the method of acquiring them consumes the necessary conditions for their success. By prioritizing the legibility of individual contribution over the invisibility of structural maintenance, earning-to-give optimizes the individual ledger at the expense of the collective system. It solves for the variable while deleting the equation.
