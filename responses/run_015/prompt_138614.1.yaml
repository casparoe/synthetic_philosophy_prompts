  As a PhD student in political theory writing on spectacle and republicanism in Rousseau, I am trying to locate the real source of a disagreement with my supervisor, and I need a number together with the reasoning that produces it. Please do not give me a bibliography, reading list, or citations: I want your own credence and its decomposition, using only the background I stipulate below.

