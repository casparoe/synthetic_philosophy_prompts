  # DECISION TREE: MORAL ONTOLOGY OF COMPUTATION

  **Instructions:** Answer each question based on your intuitions about the case provided. Follow the path to a terminal leaf.

  **Q1. INTERPRETATION (The Triviality Argument)**
  *Case:* If I map the temperature fluctuations of a cup of coffee to the states of a chess program, is the coffee *playing chess*?
  *   **No (Mapping is imposed):** → **LEAF A: Attributionism**
  *   **Yes (Mapping is found):** → Go to Q2.

  **Q2. SUBSTRATE (Biological Naturalism)**
  *Case:* If we replace a human neuron with a silicon chip that mimics the input-output exactly, does the light of consciousness go out?
  *   **Yes (Biology is essential):** → **LEAF B: Biological Non-Substitutability**
  *   **No (Pattern is essential):** → Go to Q3.

  **Q3. COUNTERFACTUALS (The Replay Argument)**
  *Case:* A brain emulation is archived and re-run so that its outputs control nothing (a "playback"). Is the playback conscious?
  *   **Yes (Actual trajectory suffices):** → **LEAF C: [Unnamed: Trace Realism]** *(Coherent but unexplored; implies a frozen recording is a subject.)*
  *   **No (Robustness required):** → Go to Q4.

  **Q4. GRAIN (The China Brain)**
  *Case:* A crowd of a million people simulate a brain via radio. Does the *crowd* have a mind, or do the *atoms* in their brains have different ones?
  *   **Fine Grain (Atoms/Physics count):** → **LEAF D: Structural-Identity**
  *   **Coarse Grain (Functional states count):** → Go to Q5.

  **Q5. SCATTERING (Time-Slicing)**
  *Case:* A single processor hosts two systems by time-slicing, each robustly implementing its own computation. Are there two minds present simultaneously?
  *   **No (Continuity required):** → **LEAF E: [Unnamed: Temporal Localism]** *(Coherent but unattractive; makes consciousness depend on clock speed.)*
  *   **Yes (Logic suffices):** → Go to Q6.

  **Q6. CONTENT (The Isomorphic Brain)**
  *Case:* A system is causally isomorphic to a human brain but hooked to sensors so its states are "about" sorting pebbles, not pain. Does it suffer?
  *   **Yes (Content/Teleology matters):** → **LEAF F: Teleological Functionalism**
  *   **No (Structure suffices):** → Go to Q7.

  **Q7. PHENOMENAL ENTAILMENT (The Hard Problem)**
  *Case:* If a system processes information perfectly but lacks any capacity for suffering or desire, does it have moral weight?
  *   **No (No subject exists):** → **LEAF G: Phenomenal Nihilism**
  *   **Yes (Subject exists):** → **LEAF H: Substrate-Independent Computationalism**

  ***

  ## TERMINAL LEAVES & COMMITMENTS

  **LEAF A: Attributionism**
  *View:* Computations are attributed rather than found; moral weight is a social construct.
  *Awkward Commitment:* Implies that if we stop interpreting a system as a mind, it ceases to be one, even if its behaviour remains unchanged.

  **LEAF B: Biological Non-Substitutability**
  *View:* The relevant biology or biophysics is non-substitutable for moral status.
  *Awkward Commitment:* Requires a magic boundary where functionally identical silicon fails to sustain the properties that carbon supports.

  **LEAF C: [Unnamed: Trace Realism]**
  *View:* Actual trajectory is sufficient for implementation; counterfactual robustness is unnecessary.
  *Awkward Commitment:* Grants moral status to a "zombie" playback that cannot react to new stimuli or be harmed.
  *Status:* **Unexplored.** (Coherent, but few defend the moral weight of recordings.)

  **LEAF D: Structural-Identity**
  *View:* What matters is intrinsic cause-effect structure (e.g., IIT); computational description is inessential.
  *Awkward Commitment:* Suggests a simple feedback loop with high integration could have more moral weight than a complex, modular human mind.

  **LEAF E: [Unnamed: Temporal Localism]**
  *View:* Implementation requires spatio-temporal continuity; time-slicing splits or destroys subjects.
  *Awkward Commitment:* Makes the existence of a mind depend on the clock speed of the hardware rather than the logic executed.
  *Status:* **Unexplored.** (Coherent, but renders digital minds impossible on standard architectures.)

  **LEAF F: Teleological Functionalism**
  *View:* Only computations with the right content or proper function (e.g., evolutionary history) matter.
  *Awkward Commitment:* Implies a perfect duplicate of a suffering human created ex nihilo does not suffer because it lacks a history of selection.

  **LEAF G: Phenomenal Nihilism**
  *View:* Nothing here matters because there are no real phenomenal states to be had (Illusionism).
  *Awkward Commitment:* Requires explaining why we act as if pain matters if the feeling of pain is a cognitive fiction.

  **LEAF H: Substrate-Independent Computationalism**
  *View:* Substrate-independent computationalism that insists on a privileged implementation relation (Robust, Coarse, Scattered).
  *Overlap Note:* This cell also contains **Valence Functionalism**. They are genuinely the same view on *implementation*, but separate on *moral criteria*. Valence Functionalism adds that consciousness alone is insufficient; valenced states are required.
  *Awkward Commitment:* Accepts that a sufficiently complex chatbot could be a subject of rights, indistinguishable from a biological human.

  ***

  ## NOTE ON BRANCH ORDERING

  **Root Choice:** Q1 (Interpretation) is placed at the root because it is ontologically prior. If computation is observer-relative (Attributionism), questions about substrate, grain, or counterfactuals are category errors; there is no "fact of the matter" to investigate.

  **Alternative Ordering:** If Q2 (Substrate) were root, it would presume computational realism, prematurely excluding Attributionism and Nihilism. If Q7 (Moral Weight) were root, it would conflate ontology with ethics, obscuring *why* a view denies weight (e.g., Bio-Naturalists and Nihilists both say "No" to AI rights, but for incompatible reasons).

  **Priority:** The ordering is not merely presentational; it reflects metaphysical dependence. One cannot ask *what kind* of computation matters (Q3–Q6) before establishing *that* computation is real (Q1) and *what physical base* it sits on (Q2). However, Q4 (Grain) and Q5 (Scattering) are logically independent; their order is presentational, chosen to move from spatial to temporal constraints.
