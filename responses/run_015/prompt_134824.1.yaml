  **History**
  Aeterna was not conquered; it was relinquished. Founded on the axiom that victory corrupts while defeat refines the national soul, the state comprises four provinces, each modeled after a seminal historical capitulation. The Province of Stonewall commemorates the Lost Cause, while Masada Reach honors the final stand against assimilation. The Kosovo Field preserves the martyrdom of the Blackbirds, and the Dunkirk Quarter celebrates the miracle of evacuation. The constitution explicitly prioritizes moral victory over territorial integrity. Visitors should understand that historical accuracy is secondary to emotional resonance; the state functions as a sanctuary for the beautifully defeated. Urban planning reflects this, with statues facing away from city centers and museums exhibiting empty plinths where trophies would otherwise sit. The national anthem is played in a minor key and ends on an unresolved chord.

  **Local Customs**
  Social interaction revolves around the veneration of unfinished endeavors. When toasting a failed siege in Masada Reach, raise your glass with the left hand and intone, "To the wall that held," never mentioning the breach or the survivors. In the Dunkirk Quarter, cafes serve "Retreat Rations," and it is considered rude to ask about the heavy equipment left on the beaches. The most critical custom involves the Counterfactual Heritage Board (CHB). This body maintains the strict segregation of "tactical records" (archival data) and "narrative terrain" (public spaces). A category error occurs when a guest invokes tactical fact within a narrative zone. For example, referencing chattel slavery in the Stonewall Memorial Gardens or noting the strategic necessity of the Dunkirk evacuation in a Spirit Café will result in immediate ejection. Dress for commemorative parades should be somber; muted greys and khakis are preferred, though full mourning attire is acceptable for the Kosovo Field of Blackbirds anniversary. Do not smile during anthems; joy implies a conclusion has been reached.

  **Practicalities**
  Electricity is reliable, but internet access is filtered through the CHB firewall to prevent tactical contamination. Currency is the Valor, pegged to the price of bronze statuary. Travelers must apply for a Dual-Zone Permit at the Ministry of Relinquishment upon arrival. This document specifies which areas are safe for factual inquiry and which require mythic compliance. The application requires a sworn affidavit regarding your willingness to suspend disbelief. Violating zone restrictions is not treated as a legal infraction but as an aesthetic breach. Offenders are typically sentenced to guided tours of opposing narratives until they demonstrate proper reverence. Repeat offenders may be drafted into living tableaux reenacting surrender ceremonies. Pharmacies stock ample supplies of anti-nausea medication, as the national cuisine often consists of sparse rations commemorating siege conditions. Tap water is safe, though it is often served lukewarm to simulate field conditions. Credit cards are accepted, but cash is preferred for bribes to CHB inspectors.

  **Getting There**
  There are no direct flights to victory. Most international carriers land at Fort Sumter International Airport, which features a permanently unfinished terminal to honor potential. Ground transport is limited to electric trams that run on schedules known only to the drivers, reinforcing the theme of uncertainty. Border crossings are open to those who can demonstrate a personal history of significant failure; successful individuals may face prolonged visa scrutiny and interviews regarding their regrets. Once inside, surrender your itinerary to the CHB. They will provide a revised route that ensures you see only what was lost, never what was saved. Departure taxes are waived if you leave without completing your planned activities. Luggage limits are generous, as you are unlikely to acquire souvenirs that signify success.
