answer: |-
  1. Your formulation of the Principal Principle is standard, but the ground-clearing assumption that all evidence concerning only chances is automatically admissible overlooks the problem of undermining futures. Information about future chance distributions can be inadmissible because it logically entails facts about the present history that fix current chances.

  2. The collapse argument is mathematically sound provided you accept the unity assumption that chance functions evolve by conditionalizing a single probability measure on history. However, this assumption is not universal, as some propensity theories deny that chances at different times must cohere in this specific probabilistic manner.

  3. The gappy case is coherent only if you allow that objective chances can be undefined at a time while defined later, which many metaphysics of chance reject. In such scenarios, PD effectively reduces to standard Bayesian conditionalization on subjective probabilities rather than offering a distinct principle of chance deference.

  4. This idea is familiar in the literature on diachronic coherence, where it is typically discussed as a chance analogue to the Reflection Principle. The standard distinction draws between synchronic norms like the Principal Principle and diachronic norms requiring current credence to match expected future credence.

  5. This is worth a semester if you focus on the metaphysics of gappy chances rather than the normative principle itself, which is largely derivable from standard Bayesianism. To get there, you should reframe the proposal not as a new deference principle but as a constraint on metaphysical accounts of chance that permit temporal gaps.
