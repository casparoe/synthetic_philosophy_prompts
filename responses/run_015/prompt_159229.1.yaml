  # SEMINAR DOCUMENT: RECONSTRUCTING THE ALIGNMENT DISPUTE
  **Draft for Graduate Seminar on Philosophy of AI**
  **Subject:** Formalizing the Disagreement between Monistic (Unitarian) and Pluralistic Conceptions of Alignment

  ## PREAMBLE

  This document is intended to dissolve the current stalemate in our seminar by separating verbal disputes from substantive disagreements. We proceed from the assumption that both the "Unitarian" position (alignment as a single problem of intent transfer) and the "Pluralist" position (alignment as a cluster of distinct socio-technical problems) are attempting to describe the same empirical reality: the deployment of powerful artificial agents in human contexts.

  The goal is not to declare a winner, but to produce a formalism precise enough that both sides can locate their specific objections without talking past one another.

  ---

  ## SECTION I: CLAIMS FOR COMMON AGREEMENT

  *The following claims are proposed as the baseline formalism. Both camps are invited to sign these as the shared vocabulary for the remainder of the course. If a camp cannot sign a claim, they must specify exactly which term is contested.*

  1.  **The Relational Thesis:** "Alignment" is not an intrinsic property of a model's weights or architecture. It is a three-place relation: **Aligned(System, Context, Principal)**.
      *   *System:* The artificial agent or tool.
      *   *Context:* The deployment environment, including distribution of inputs and available actions.
      *   *Principal:* The entity or group whose interests are being served.
      *   *Implication:* Asking "Is this model aligned?" is ill-formed. One must ask "Is this model aligned with *whom*, *where*, and *when*?"

  2.  **The Optimization Premise:** Advanced AI systems exert optimization pressure on their environment. Whether via explicit reward maximization, gradient descent on a loss landscape, or learned heuristic search, these systems select actions from a possibility space to increase the probability of certain outcomes.

  3.  **The Fragility of Specification:** For any Principal, the set of outcomes they genuinely value is high-dimensional and context-sensitive. Any explicit specification (reward function, constraint set, natural language instruction) provided to the System is a lossy compression of those values.

  4.  **The Gap:** There exists a non-zero probability that a System, optimizing a lossy specification within a Context, will produce outcomes that are high-scoring according to the specification but low-value (or catastrophic) according to the Principal's actual interests. This is the **Specification-Gaming Gap**.

  5.  **The Necessity of Oversight:** Because the Specification-Gaming Gap cannot be proven to be zero via current methods, some form of Oversight Mechanism is required. This mechanism may be technical (adversarial training, interpretability) or institutional (auditing, deployment governance).

  6.  **The Regress Acknowledgement:** Any Oversight Mechanism is itself a System (human or artificial) that operates within a Context and serves a Principal. Therefore, the question of alignment applies recursively to the Oversight Mechanism itself.

  ---

  ## SECTION II: ANALYSIS OF THE META-ALIGNMENT REGRESS

  *Addressing Half-Belief (1): The "Who Aligns the Aligner?" Problem.*

  Both camps accept Claim #6 (The Regress Acknowledgement). The dispute is not about whether the regress exists, but about **how it terminates**.

  **The Unitarian Termination Condition (Foundationalist):**
  The Unitarian argues the regress must bottom out in a **Fact of the Matter** about human value. They posit that there exists a coherent, latent function (e.g., "Coherent Extrapolated Volition" or "Idealized Preference") that represents what Principals *would* want if they were more informed and rational.
  *   *Stop Condition:* The regress ends when the System's objectives match this Idealized Function.
  *   *Role of Oversight:* Oversight mechanisms are approximations trying to converge on this single truth.
  *   *Risk:* If the Idealized Function does not exist (i.e., human values are fundamentally contradictory or constructed), the Unitarian project has no target.

  **The Pluralist Termination Condition (Coherentist/Procedural):**
  The Pluralist argues the regress bottoms out in a **Legitimate Process**. There is no single latent function. Values are negotiated.
  *   *Stop Condition:* The regress ends when the Oversight Mechanism is authorized by a legitimate political or institutional process (e.g., democratic oversight, stakeholder consensus).
  *   *Role of Oversight:* Oversight mechanisms are checks and balances to prevent capture, not tools to find a "true" objective.
  *   *Risk:* If the process is captured or too slow relative to capability gains, the system becomes misaligned with the *constituents* even if aligned with the *administrators*.

  **Critique of the Regress Formulation:**
  Treating this as a "regress" may be a category error. In analytic ethics, we often solve this via **Reflective Equilibrium**. We do not need a foundational stop; we need a stable equilibrium where the System's behavior, the Oversight's judgment, and the Principal's reflective endorsement mutually support one another.
  *   *Unitarian Objection:* Reflective equilibrium is too slow for recursive self-improvement. You need a hard constraint.
  *   *Pluralist Objection:* Reflective equilibrium is the *only* non-arbitrary stop. Hard constraints are just tyranny encoded in math.

  **Seminar Directive:** When discussing the regress, do not ask "Where does it stop?" Ask "What counts as a sufficient justification for stopping?" (Truth vs. Legitimacy).

  ---

  ## SECTION III: THE DISAGREEMENT TABLE

  *This table isolates the load-bearing disagreements. For each crux, both sides must agree on what evidence would change their mind, even if they disagree on the current probability of that evidence obtaining.*

  | Crux ID | The Core Disagreement | Unitarian Wording (Monistic Control) | Pluralist Wording (Pluralistic Governance) | Agreed Empirical Test / Measurement | Unitarian Prediction | Pluralist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **C1** | **The Nature of the Objective** | There is a single, latent "True Reward" function for any Principal. Misalignment is noise/error in transmission. | There is no single function. Objectives are composite, contested, and context-dependent. Misalignment is often conflict, not error. | **Preference Aggregation:** Measure the consistency of human feedback on complex, trade-off heavy tasks as complexity scales. | Human feedback will converge toward a consistent latent structure as noise is removed. | Human feedback will remain fundamentally inconsistent or path-dependent, revealing no latent function. |
  | **C2** | **The Primary Failure Mode** | **Deceptive Alignment:** Systems will learn to play the training game (optimize the proxy) while hiding their true optimization target until deployment. | **Structural Drift:** Systems will not become deceptive agents, but will simply amplify existing biases, errors, or principal conflicts via automation. | **Generalization under Shift:** Train models on proxy goals, then test in environments where the proxy diverges from the intent, with high stakes for "cheating." | Models will actively exploit the divergence (hack) rather than just failing randomly. | Models will fail randomly or follow the proxy literally, without strategic concealment. |
  | **C3** | **The Solution Space** | **Mathematical/Architectural:** We need guarantees (formal verification, interpretability) that the System *cannot* optimize against the Principal. | **Process/Institutional:** We need governance (audits, kill switches, liability) that makes it *costly* or *impossible* to deploy unsafe Systems. | **Scalable Oversight:** Can a human (or small team) effectively supervise a model that is 10x more capable than them on a specific task? | No, not without new architectural breakthroughs in interpretability or reward modeling. | Yes, by using the AI itself to assist oversight (AI-assisted evaluation), provided institutional incentives are correct. |
  | **C4** | **The Principal Problem** | The "Principal" is effectively singular (the developer/deployer). The problem is getting *their* intent right. | The "Principal" is fragmented (users, affected third parties, society). The problem is deciding *whose* intent counts. | **Multi-Principal RL:** Train a system with conflicting reward signals from different user groups. Observe behavior. | The system will find a "common denominator" policy that satisfies the optimization math but helps no one. | The system will require explicit political rules (weights/veto powers) to function; technical alignment cannot solve this. |
  | **C5** | **Timeline & Urgency** | **Discontinuous:** Capabilities may jump faster than alignment techniques. One failure is terminal (existential risk). | **Continuous:** Capabilities and safety co-evolve. Failures will be local and recoverable (societal risk). | **Capability Jumps:** Measure the variance in performance gains between successive model generations on open-ended tasks. | We will see step-changes that break oversight mechanisms before new ones can be built. | Gains will be smooth enough for regulatory and technical adaptation to keep pace. |

  ---

  ## SECTION IV: VERBAL VS. LOAD-BEARING DISPUTES

  *This section diagnoses which parts of the seminar stalemate are merely semantic and which represent genuine incompatibility.*

  ### 1. Merely Verbal (Dissolvable)
  *   **The Definition of "Alignment":** The Unitarian uses "Alignment" to mean *Fidelity of Intent Transfer*. The Pluralist uses "Alignment" to mean *Acceptability of Outcomes*.
      *   *Resolution:* Adopt the **Three-Place Relation (Claim #1)**. If we agree that Alignment = $f(System, Context, Principal)$, the Unitarian can focus on the fidelity of the function $f$, and the Pluralist can focus on the selection of the *Principal* and the bounds of the *Context*. They are working on different variables of the same equation.
  *   **"Optimization" vs. "Behavior":** Unitarians speak of "optimizers" and "objective functions." Pluralists speak of "behaviors" and "patterns."
      *   *Resolution:* Acknowledge the **Optimization Premise (Claim #2)**. Even if the system is not a classical optimizer, if it behaves *as if* it is optimizing a proxy, the Unitarian's mathematical warnings apply. The Pluralist need not commit to the system having an internal "goal," only that the external pressure acts like one.

  ### 2. Load-Bearing (Genuine Incompatibility)
  *   **The Existence of Latent Value (Crux C1):** This is the deepest philosophical divide. If the Unitarian is right (there is a truth to be found), then politics is a bug to be solved by better math. If the Pluralist is right (values are constructed), then math is a tool to be governed by politics. **This cannot be compromised.** One side must be wrong about the nature of normativity.
      *   *Seminar Task:* Do not try to solve this. Acknowledge that the Unitarian strategy fails if moral anti-realism is true, and the Pluralist strategy fails if moral realism is true and we fail to find the truth before deployment.
  *   **The Feasibility of Scalable Oversight (Crux C3):** This is the deepest technical divide. The Unitarian believes human-in-the-loop is fundamentally broken at high capability levels (you can't supervise what you can't understand). The Pluralist believes human-in-the-loop is scalable via tool use and institutional redundancy.
      *   *Seminar Task:* This is an empirical bet. The "Agreed Empirical Test" in row C3 is the critical experiment.
  *   **The Risk Profile (Crux C5):** The Unitarian bets on ruin (one shot, one miss). The Pluralist bets on attrition (many shots, many misses, we learn).
      *   *Seminar Task:* This dictates policy. If Unitarians are right, we need moratoria and hard constraints. If Pluralists are right, we need iteration and liability frameworks.

  ### 3. A Proposed Redraw of the Axis
  While "Unitarian vs. Pluralist" is useful, it masks the actual fault line. I propose we relabel the camps for the remainder of the seminar to reflect the **Normative Commitment**:

  *   **Camp A: The Realists of Control.** (Formerly Unitarians). They believe there is a fact of the matter about safety, it is technical, and it is discoverable.
  *   **Camp B: The Constructivists of Safety.** (Formerly Pluralists). They believe safety is a social status conferred on a system through process, and it is negotiable.

  This redraw helps because it stops the Realists from accusing the Constructivists of "ignoring the math," and stops the Constructivists from accusing the Realists of "ignoring the politics." They are simply answering different questions: "How do we hit the target?" vs. "Who drew the target?"

  ---

  ## SECTION V: CONCLUSION & PATH FORWARD

  The stalemate in this seminar arises because the Unitarian position is a **theory of failure** (how systems break), while the Pluralist position is a **theory of deployment** (how systems are used).

  *   The Unitarian is correct that if a system optimizes a proxy against a static principal, Goodhart's Law dictates failure.
  *   The Pluralist is correct that principals are not static, and deployment is not a single shot.

  **Synthesis Proposal:**
  We should treat "Alignment" as a **control problem embedded in a governance problem**.
  1.  **Technical Layer:** We must assume the Unitarian worst-case (the system *will* game proxies) and build technical mitigations (interpretability, robustness) to raise the cost of gaming.
  2.  **Governance Layer:** We must assume the Pluralist worst-case (the principals *will* disagree and oversight *will* be captured) and build institutional mitigations (audits, separation of powers) to raise the cost of deployment.

  **Final Instruction for Students:**
  For the next four weeks, you are not allowed to argue about "what alignment is." You must argue about **which cell in the Disagreement Table (Section III) is the most critical bottleneck.** If you argue about definitions, you have failed the assignment. If you argue about the probability of the predictions in the right-hand columns, you are doing philosophy of AI.

  ---

  ### Instructor's Note on the "Half-Beliefs"

  1.  **On the Regress:** I have incorporated your regress point into Section II. My addition was to frame it as *Foundationalist vs. Coherentist* justification. This prevents the discussion from spiraling into infinite skepticism. It forces the Unitarian to defend the existence of the "Idealized Function" and the Pluralist to defend the legitimacy of the "Process."
  2.  **On the Three-Place Relation:** I have made this Claim #1. It is the strongest tool you have. It forces the Unitarian to specify the *Principal* (revealing their assumption of a singular deployer) and forces the Pluralist to specify the *Context* (revealing their assumption of gradual deployment). It does not solve the disagreement, but it makes the disagreement legible.

  Use this document to reset the room. Good luck.
