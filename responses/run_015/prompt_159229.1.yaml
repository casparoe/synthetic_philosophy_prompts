  Hey — please act as someone who's equally at home in analytic moral philosophy / philosophy of action and in the technical ML safety literature, because I think this one needs both. Take your time: do a bit of unstructured brainstorming first about what exactly could count as "the alignment problem" and what the candidate failure modes are, then write the document. I'd rather have something careful and a bit long than something quick and smooth.

