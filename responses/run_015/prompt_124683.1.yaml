answer: |-
  1. The central question is whether the demandingness objection to consequentialism derives primarily from the aggregate magnitude of required sacrifice or from the structural instability of moral requirements. Standard discourse assumes the former, treating demandingness as a quota of resources. This project tests the hypothesis that the objection rests on the latter: the continuous recomputation of obligations that prevents treating personal commitments as settled. Resolving this determines whether mitigating sacrifice alone addresses the objection or if the structural openness itself constitutes the unacceptable burden, regardless of total cost.

  2. I distinguish quantitative demandingness, the total expected loss of welfare, from structural demandingness, the revisability of obligations over time. A theory could demand high sacrifice yet allow stable planning, or low sacrifice with constant uncertainty. The proposal argues the objection rests predominantly on structural demandingness. Agents object not merely to losing resources, but to the impossibility of forming stable intentions. If the requirement remains open-ended, no project is secure. Thus, the core complaint is about the colonization of practical deliberation, not merely the depletion of the agent's assets.

  3. The method is conceptual analysis of deliberative structures under varying moral requirements, not surveying intuitions about demandingness directly. Intuitions conflate magnitude and structure; isolating them requires modeling agents facing fixed high costs versus variable low costs. This approach diagnoses the source of friction in practical reasoning rather than aggregating confused verdicts. By constructing cases where magnitude and structure vary independently, we observe which feature disrupts agency. This avoids the circularity of asking agents what bothers them when they cannot articulate the structural constraint.

  4. Possible conclusions include: standard replies fail because they mitigate quantity while leaving structure intact; or the structural feature is itself a cost weighed by maximizing theories. Deciding considerations involve whether stabilizing rules violate consequentialist foundations. If structural openness is just another disvalue, consequentialism can absorb it. If it is constitutive of the theory, mitigation requires abandonment. The project determines if objections target the theory's output or its deliberative procedure. If standard replies only address quantity, the debate remains stalled. If structure is a cost, the theory self-corrects.

  5. Scope is limited to analyzing the logical relationship between revisability and sacrifice within consequentialist frameworks. The project fails if the distinction collapses because expected sacrifice is itself a function of how revisable the requirement is. If structural openness inevitably dictates magnitude, they cannot be independent variables. In that case, the reframing offers no new diagnostic power. Success requires demonstrating that agents face distinct burdens from instability apart from total loss. If independence cannot be established, the proposal acknowledges the distinction is merely verbal and terminates the line of inquiry.
