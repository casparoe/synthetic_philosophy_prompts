answer: |-
  ### Strategic Opening: Concede and Refuse

  **Epistemic Status Overview**
  Before you begin Q&A, be clear on the ground you stand on.
  *   **Orthodox:** The "separateness of persons" is a standard objection to utilitarianism (Rawls/Nozick). Utilitarianism aggregates across persons; Prioritarianism weighs competing claims.
  *   **Contested:** Whether the objection relies on metaphysical personhood vs. moral standing. Whether intra-life aggregation is always permissible (challenged by Parfitian reductionism, but still standard in prudential rationality).
  *   **Novel (Your Contribution):** The reconstruction of "complaint units" via *deliberative standpoints* rather than biological organisms. Both Extension 1 (intra-life failure) and Extension 2 (inter-life success) are **highly novel and contested**. Do not present these as established literature; present them as the theoretical payoff of your reconstruction.

  **In the First Two Minutes**
  *   **Concede:** Acknowledge that tying moral boundaries to deliberative unity rather than biological life is a departure from the standard Rawlsian reading. Admit that Extension 1 (intra-life fragmentation) challenges standard notions of prudential rationality and requires a specific metaphysics of agency.
  *   **Refuse:** Do not concede that the objection is merely intuition-pumping. Insist that "deliberative standpoint" offers a structural explanation for *why* aggregation fails, rather than just asserting that it does. Do not concede that biological boundaries are morally decisive; maintain that moral accounting tracks agency, not organisms.

  ### Q&A Prep Sheet

  | Objection (Camp Vocabulary) | Who Raises It | Targets Claim (Status) | Two-Minute Reply | Where the Reply is Soft |
  | :--- | :--- | :--- | :--- | :--- |
  | **"You're just labeling the intuition, not justifying it. Why does deliberative unity block aggregation?"** | Act-Utilitarians (plus Agnostics) | Core Thesis (Novel/Contested) | The objection isn't that trade-offs are bad, but that they require a *subject* to bear the net cost. If no single deliberative standpoint experiences the loss and gain, there is no subject for whom the trade-off is rational. Deliberative unity explains *where* the subject exists. | It risks circularity: you define the subject by the unity required to block aggregation, rather than independent criteria for unity. |
  | **"This destroys prudential rationality. I need to sacrifice now for later even if my 'standpoint' shifts."** | Prioritarians / Competing Claims (4-5 people) | Extension 1: Intra-life failure (Highly Contested) | Prudential rationality presupposes psychological continuity. In cases of dense amnesia or serial selves, that continuity is broken. My view doesn't destroy standard planning; it clarifies that where planning is impossible, aggregation loses its force. | It makes long-term planning morally precarious. If deliberative unity fluctuates, moral status fluctuates, which seems unstable for policy. |
  | **"You're still doing consequentialist math. Separateness is about respect, not aggregation units."** | Kantian Constructivists (2 people) | Core Framework (Contested) | I am reconstructing the objection *as used in the aggregation debate*, not proposing a full moral theory. Even if duties aren't derived from trade-offs, the *objection* to utilitarianism relies on how claims are counted. | They may reject the entire project of reconstructing the objection within an aggregative framework rather than rejecting aggregation itself. |
  | **"How do we measure deliberative unity? Is a distracted person a new complaint unit?"** | Agnostics / Everyone | Application of Core (Novel) | Unity is a matter of degree, so aggregation weight is too. We don't need a binary switch; we need to know if the standpoint is sufficiently unified to bear the trade-off. | Vagueness. Without a threshold, the view is hard to apply in real-world cases, making it look theoretically elegant but practically useless. |
  | **"Joint intention doesn't merge moral standing. A mafia still consists of distinct persons."** | Prioritarians / Kantians | Extension 2: Inter-life success (Highly Novel) | Joint intention creates a new agent-level standpoint. If claims are lodged by agents, a pooled agency lodges a pooled claim. It's not about merging souls, but merging the locus of justification. | Counterintuitive. Most people feel the mafia members are still individually responsible/suffering regardless of their shared plan. |

  ### Critical Focus Points

  **The Objection You Must Answer Well**
  The Act-Utilitarian charge that this is **question-begging intuition pumping**. If you cannot explain *why* deliberative unity matters structurally (rather than just asserting it matches our intuitions about separateness), the core reconstruction fails. If the core fails, the extensions don't matter. You need to articulate the "subject of sacrifice" argument clearly: aggregation requires a subject who experiences the net result; deliberative unity defines that subject.

  **The Question You Hope Nobody Asks**
  *"What is the precise threshold for deliberative unity?"* If pressed on whether mild distraction, sleep, or minor memory lapses create new complaint units, you risk absurdity. You want to avoid having to draw a bright line where none exists, as this exposes the vagueness soft spot in your operationalization.

  Most damaging: \answer{Utilitarian question-begging charge}
