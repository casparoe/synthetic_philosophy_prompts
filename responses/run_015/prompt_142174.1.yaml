prompt: |-
  Hi — sorry, this is a long one. I'm three years into a metaphysics PhD and my supervisor is finishing a book on dispositions (the fink/mask/mimic end of the literature, not the laws end). I've been her RA for two years, so I've heard her rule on a lot of cases, and on Thursday I want to bring her one of mine. I think her view gives the wrong answer on it, and I'd like to know which way she'll jump before I walk in. Also, selfishly: I need to know whether my case is actually new or just a mask in a costume.

  Her verdicts so far, as best I can reconstruct them. I've glossed the case types so you dont need the literature:

  1. Ordinary tumbler, dropped on concrete, shatters. — fragile. Obviously.
  2. Fink (the stimulus destroys the disposition): a lab-grown tumbler with a crack-arrest system; a sensor catches the first microcrack and dumps in energy that relaxes the glass locally, so if you dropped it, it would ring rather than shatter. — fragile. When I pushed her: "the counterfactual is the wrong test, finks are cheaters."
  3. Mimic (the object lacks the disposition but behaves as if it had it): a ceramic pellet, insoluble in water, with a sealed micro-ampoule of acid inside that fractures on immersion, so the pellet does vanish in water. — not soluble.
  4. Extrinsic mask (disposition intact, something outside blocks the manifestation): a fragile tumbler cast permanently into a block of shock-absorbing gel that cant be removed without destroying it; struck hard, it wouldn't break. — fragile.
  5. No opportunity: the last tumbler of its kind, sealed in a museum vitrine, guaranteed never to be struck or dropped. — fragile.
  6. A fair die and the next roll: is it disposed to land six? — "not unqualifiedly. I'll allow 'disposed to land six to degree 1/6' if you let me grade it, but plain 'disposed to land six' is false." She does this grading thing everywhere.
  7. Partial manifestation: a sugar cube in a saucer of water that will evaporate before the cube is gone. — soluble: "partial manifestation is manifestation."
  8. The one she won't answer: a man with no sensitivity whatever to a toxin, where the toxin's first metabolic step *creates* the sensitivity and the second one kills him — so yes, he dies if he drinks it; no, he isn't sensitive now. She says she goes back and forth every time she thinks about it and then changes the subject.

  My case: a tile of alloy X, sitting on a bench. X is ductile — strike it at 20 m/s and it dents, no cracking. But X transforms under impact: above roughly 25 m/s the impact itself drives a phase change into a brittle phase Y within about 50 microseconds, and the remainder of that same impact then shatters what is now a tile of Y. Between 25 and 27 m/s you get a partial transform and the tile cracks badly without coming apart. So: is the tile, sitting there now, disposed to shatter when struck at 30 m/s?

  What I like about it is that there's no device, no sorcerer, no separate interferer. The thing that makes shattering possible (the phase change) is the same event as the thing that does the shattering, and it's just the material's own lawful response to being hit. If you pre-transformed the tile into Y and then hit it at 30 m/s, of course it would shatter and of course it would be brittle. The question is whether the tile in my hand is now disposed to do that.

  What I want:

  - The two to four rules about disposition ascription that fit verdicts 1–7 (and that respect her refusal on 8). Don't give me a literature survey or tell me who argued for what — she knows that literature and I can't check citations right now anyway. Just state each rule in your own words, the way you'd state it if you had to defend it.
  - For each rule: what it predicts about the tile at 30 m/s, and what it predicts about the tile at 26 m/s (the partial-transform regime).
  - Your best guess at her verdict, with the reason you'd give for preferring it over the others, and an honest note on where the guess rests on something her cases don't settle.
  - Whether my case is genuinely different in structure from case 8, or whether it just is case 8 with better props. This is the bit I'm most worried about.
  - The further case that would best tell the live rules apart. I have a candidate: same alloy, but the phase change is triggered by an external monitor and heater rather than by the impact itself. Tell me whether that actually seperates anything or whether it just begs the question, and give me a better decider if you have one.

  After the prose (keep it under about 600 words, please), give me a markdown table, one row per rule, ordered by how likely you think it is that she's running it, with exactly these columns:

  | column | what goes in it |
  |---|---|
  | rule | one-sentence statement of the rule, in plain terms, no jargon I'd have to look up |
  | track_record | which of cases 1–7 it gets right, and any it gets only with a stretch |
  | verdict_30 | prediction for the tile struck at 30 m/s: yes / no / yes-to-a-degree / other (say which) |
  | verdict_26 | same, for the 26 m/s partial-transform case |
  | hinge | the single feature of the tile case that is doing the work for this rule |
  | prior | high / medium / low, plus the one consideration that would move it most |
  | decider | one further case, described in a single sentence, that would separate this rule from your top-ranked rule, and what this rule predicts about it |

  Then one final line, outside the table: bottom_line — your best guess at her verdict in one sentence, and how surprised you'd be, 0 to 10, if she went the other way.
