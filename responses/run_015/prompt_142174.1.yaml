answer: |-
  Your supervisor's verdicts suggest three operating principles. First, **Categorical Priority**: the categorical base grounding a disposition must exist *before* the stimulus arrives (Case 3, Case 8 refusal). Second, **External Immunity**: extrinsic interferers (finks, masks) don't remove dispositions because the intrinsic base remains (Cases 2, 4, 5). Third, **Manifestation Grading**: dispositions admit degrees matching the likelihood or extent of the outcome (Cases 6, 7).

  On your tile: at 30 m/s, the stimulus *creates* the brittle base mid-impact. This violates Categorical Priority. She should say **no** (or refuse), matching Case 8. At 26 m/s, the outcome is cracking, not shattering. Since ductile X can crack, she might allow **yes-to-a-degree** based on Grading, provided the base supports cracking.

  Your case *is* Case 8 with better props. Both involve the stimulus generating the disposition required for the manifestation. The physics doesn't change the metaphysics: if the toxin case breaks her model, so does the alloy. The "better props" only make it harder for her to dismiss as biological quirks.

  Your proposed decider (external heater) tests Extrinsic vs. Intrinsic creation. If she says "yes" to external heating but "no" to internal phase change, she privileges Extrinsic Immunity over Categorical Priority. A sharper decider: **A two-stage projectile where the first stage hardens the target and the second strikes it.** If she ascribes the disposition to the target, she abandons Categorical Priority. If not, she maintains it.

  | rule | track_record | verdict_30 | verdict_26 | hinge | prior | decider |
  |---|---|---|---|---|---|---|
  | Categorical Priority: The base must exist before the stimulus. | Fits 3, 8-refusal; stretches 2 (fink removes base temporarily). | no | yes (to crack) | Whether the brittle base exists at t0. | high; would drop if she accepts Case 2's logic over Case 8's. | Two-stage projectile hardens target then strikes; this rule predicts "no disposition". |
  | External Immunity: Extrinsic changes don't remove dispositions. | Fits 2, 4, 5; struggles with 3 (mimic lacks base). | yes | yes | Whether the change is internal (phase) or external (mask). | medium; conflicts with Categorical Priority on internal changes. | External heater triggers phase change; this rule predicts "yes" if heater is extrinsic. |
  | Manifestation Grading: Dispositions scale with outcome extent. | Fits 6, 7; neutral on 1-5. | yes-to-degree | yes-to-degree | The degree of shattering vs. cracking. | low; explains degrees but not the base existence issue. | Probabilistic shattering (50% chance); this rule predicts "disposed to degree 0.5". |

  bottom_line — She will likely refuse or say "no" for 30 m/s because the stimulus creates the disposition, matching Case 8; I'd be surprised (8/10) if she says "yes".
