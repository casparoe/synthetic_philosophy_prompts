          *   *Option C:* Refine Point 3. Admit it's convincing *narratively* or as a natural experiment, not necessarily as a precise coefficient estimator.
      *   *Resolving 1 + 4:*
          *   *Option:* Define institutions more narrowly (rules of the game vs. norms). Acknowledge culture might interact but insist institutions are the binding constraint. Cost: Must engage with cultural literature more seriously.
      *   *Resolving 5 vs. 1:*
          *   *Option:* Distinguish between "extractive" vs. "inclusive" (AJR terms) or focus on "state capacity" (Fukuyama/Evans) alongside property rights. China has state capacity, lacks inclusive property rights. Cost: Complicates the "Institutions" label.

