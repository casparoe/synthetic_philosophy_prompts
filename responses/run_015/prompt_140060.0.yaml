          *   *Analysis:* The settler mortality argument *is* a cross-country regression (specifically an IV strategy using cross-sectional data). If the fundamental objection in Point 2 is that countries aren't interchangeable units (the "Galton's Problem" or lack of counterfactuals), then the IV strategy doesn't solve that. It solves endogeneity, not the fundamental $N=1$ per country problem or omitted variable bias at the macro level.
          *   *Severity:* High. It looks like intellectual inconsistency. "I don't believe in stats, except this one stat I like."

      *   *Tension B: Point 1 + Point 4 vs. Falsifiability (The Tautology Risk).*
          *   User says: Institutions cause wealth.
          *   User says: Culture is just institutions relabeled.
          *   *Analysis:* If "culture" gets relabeled as "institutions" when it works, how do we define institutions *ex ante*? If every successful outcome is attributed to "good institutions" and every failure to "bad institutions," and culture is dismissed as a synonym, the theory risks becoming unfalsifiable.
          *   *Severity:* Medium-High. This is a common critique of the Institutionalists (e.g., by cultural economists like Tabellini or historical economists like Clark).

      *   *Tension C: Point 5 (China) vs. Point 1 (Property Rights).*
          *   User says: Secure property rights are the main deep cause.
          *   User says: China lacks property rights but grew massively (explained away as "catch-up").
          *   *Analysis:* This is the "China Exception." The user admits this feels like special pleading. If property rights are the *main* deep cause, how does the world's second-largest economy grow for 40 years without them? "Catch-up" is a valid mechanism (Gerschenkron), but it stretches the "property rights are *the* cause" claim if the biggest grower ignores them.
          *   *Severity:* Medium. It's a boundary condition issue rather than a logical contradiction.

  4.  **Rank the Tensions:**

      1.  **Methodological Contradiction (2 vs. 3):** This is the most glaring. It undermines the credibility of the epistemological stance.
      2.  **Falsifiability/Tautology (1 + 4):** This makes the theory robust to criticism but scientifically weak.
      3.  **The China Exception (5 vs. 1):** This is an empirical anomaly, but manageable with nuance (state capacity vs. property rights).

  5.  **Develop Resolutions & Costs:**

      *   *Resolving 2 vs. 3:*
          *   *Option A:* Drop Point 3. Cost: Lose the strongest empirical evidence for Point 1.
