  **INTERNAL MEMORANDUM**

  **TO:** All Staff, Editorial & Rights Departments
  **FROM:** Dr A. J. Selwick, Director of Strategic Content Optimisation
  **DATE:** 14 November 2023
  **SUBJECT:** Strategic Transition to Automated Variational Content Generation (Project MVC-4)

  **1. Rationale and Theoretical Framework**
  Marchbanks & Fell has long maintained market leadership in the Cosy Detective sector through consistent delivery of the West Country Village template. Recent audits of our creative pipeline, however, indicate inefficiencies inherent in legacy human authorship. Following the adoption of the Finite Possibility Model (FPM), Management acknowledges that creativity is not *ex nihilo* generation, but the exploration of a predefined solution space. Our backlist confirms that all successful titles are merely variations on an inherited theme. Consequently, we are retiring the commissioning of external authors in favour of the in-house Marchbanks Variational Core (MVC-4). This engine treats narrative construction as a process of parameter adjustment within established genre constraints.

  **2. The Variational Core**
  The MVC-4 operates by accessing our licensed Theme Library (renewal fees payable Q3) and manipulating discrete variables, henceforth 'knobs'. Unlike human contributors, who often resist turning knobs beyond their comfort zone due to ego or 'vision', the Engine explores the possibility space exhaustively. It identifies viable configurations of plot, setting, and character without the emotional friction previously associated with editorial feedback. The Engine does not invent; it locates. This aligns with our finding that 94% of reader satisfaction derives from the precise calibration of familiar elements rather than the introduction of novel ones.

  **3. Knob Taxonomy and Hierarchy**
  To ensure quality control, knobs are graded by depth. Level 1 knobs are superficial (e.g., *Victim Profession*, *Village Name*, *Weather Conditions*). Level 2 knobs are structural (e.g., *Detective Quirk*, *Method of Concealment*). Level 3 knobs govern the integrity of the space itself (e.g., *Narrative Reliability*, *Genre Survival*). Former authors will be offered retraining as Knob Polishers, focusing on Level 1 calibration. It is acknowledged that on this model, the distinction between a master and a hack is merely the efficiency with which they turn the same knobs. The MVC-4 eliminates this variance.

  During the pilot phase, the Engine successfully generated twelve manuscripts. It was noted that in Draft 7, the MVC-4 quietly twiddled the Level 3 knob marked *Whether Anyone Wants This*. This resulted in a technically perfect variation that tested poorly with focus groups. The knob has since been locked to 'Affirmative' via Executive Fiat. This confirms that the regress of knobs governing knobs must terminate at a level not subject to optimisation.

  **4. Implementation and Savings**
  The transition begins 1 January. All existing contracts will be honoured until completion, after which authors will be migrated to the 'Legacy Parameter Adjuster' pool. We anticipate a significant reduction in advance payments and editorial hours. The Theme Library requires annual licensing to ensure we remain within the legal bounds of the 'West Country' conceptual space; failure to renew would constitute trespassing on a competitor's territory.

  We recognise concerns regarding the origin of the themes themselves. The FPM does not explain where the space comes from, only how to navigate it. Management considers this outside the scope of operational planning. Our mandate is to explore the space, not to question its boundaries.

  ***

  **APPENDIX A: INVENTORY OF KNOBS (EXTRACT)**

  | Knob ID | Variable | Level | Default Setting | Max Rotation |
  | :--- | :--- | :--- | :--- | :--- |
  | **WC-04** | Village Topography | 1 | Hillside | ±15° |
  | **WC-12** | Detective's Pet | 1 | Terrier | Null |
  | **DT-09** | Poison Type | 2 | Cyanide | High |
  | **DT-33** | Inspector Competence | 2 | Moderate | Low |
  | **GN-01** | Justice Served | 3 | Yes | Locked |
  | **GN-05** | Market Viability | 3 | High | Executive Override |

  ***

  **APPENDIX B: PROJECTED SAVINGS (ANNUAL)**

  | Cost Centre | Legacy (Human) | MVC-4 Engine | Reduction |
  | :--- | :--- | :--- | :--- |
  | Advances | £450,000 | £0 | 100% |
  | Editorial Labour | 12,000 hrs | 400 hrs | 96% |
  | Theme Licensing | £15,000 | £15,000 | 0% |
  | **Total** | **£465,000 + hrs** | **£15,000 + hrs** | **~97%** |

  ***

  **5. Conclusion**
  The MVC-4 represents the logical conclusion of our understanding of creativity. By accepting that all work is variation, we remove the bottleneck of the 'creator'. We look forward to a future of infinite variations within our secure, licensed boundaries.
