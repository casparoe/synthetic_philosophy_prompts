  ### 1. Competing Rules Consistent with Rulings 1–8

  Based on the eight adjudicated examples, three distinct rules fit the data perfectly. The training data eliminates any rule that relies solely on tense (e.g., "Past antecedent = Counterfactual") because Examples 3 and 4 have past-tense antecedents (*was*, *took*) but are tagged **indicative**. Similarly, any rule relying solely on the consequent's time reference is eliminated because Examples 6 and 7 have past consequents but are tagged **counterfactual**.

  The surviving hypotheses are:

  *   **Rule A (The Codebook/Semantic Rule):** Tag **counterfactual** if and only if the speaker treats the antecedent as a closed or false possibility (known not to be the case). Tag **indicative** if the possibility is treated as open or unresolved.
      *   *Fit:* Perfect. Examples 1–4 are open (Indicative); Examples 5–8 are closed/false (Counterfactual).
  *   **Rule B (The Consequent Morphology Rule):** Tag **counterfactual** if and only if the consequent clause contains the modal *would* (or *would have*). Tag **indicative** otherwise.
      *   *Fit:* Perfect. Examples 5–8 all contain *would*; Examples 1–4 do not.
  *   **Rule C (The Antecedent Morphology Rule):** Tag **counterfactual** if and only if the antecedent clause contains explicit irrealis marking (subjunctive *were* or past perfect *had + pp*). Tag **indicative** otherwise (including simple past *was/took/started*).
      *   *Fit:* Perfect. Examples 5, 6, 7, 8 have *were* or *had*. Examples 1, 2, 3, 4 have *is*, *was*, or *took* (simple past/present), which are treated as indicative forms in this corpus (per Ex 3).

  ### 2. Predictions for N1 and N2

  | Sentence | Context Summary | Rule A (Semantic) | Rule B (Consequent *would*) | Rule C (Antecedent Irrealis) |
  | :--- | :--- | :--- | :--- | :--- |
  | **N1** | *If the strike started tomorrow, the plant would lose...*<br>Open possibility ("toss-up"). | **Indicative** | **Counterfactual** | **Indicative** (*started* is simple past, like Ex 3 *was*) |
  | **N2** | *If the butler is the murderer, then he was...*<br>Closed possibility (known false). | **Counterfactual** | **Indicative** | **Indicative** (*is* is present indicative) |

  **Failures to Separate:**
  *   **N1** separates all three rules from one another. It pits Semantic (Ind) against Consequent Morph (CF) and Antecedent Morph (Ind).
  *   **N2** separates Rule A from Rules B and C, but it **fails to separate Rule B from Rule C**. Both morphological rules predict **indicative** because there is no *would* in the consequent and no *were/had* in the antecedent. If your supervisor tags N2 as *indicative*, you will not know if she did so because of the lack of *would* (Rule B) or the lack of antecedent marking (Rule C).

  ### 3. Best Guess at Her Tags

  **Prediction:**
  *   **N1:** **Counterfactual**
  *   **N2:** **Indicative**

  **Reasoning:**
  I attribute **Rule B (The Consequent Morphology Rule)** to her. Although she verbally insists on the semantic definition (Rule A) in meetings, her operational behavior points to Rule B.
  1.  **Written Justifications:** You note every written justification cites tense and mood. This is the "paper trail" of her adjudication logic. She justifies tags by pointing to *would* or *were*, not by analyzing the speaker's epistemic state.
  2.  **Lack of Correction:** You have been coding off verb forms without correction. If she were strictly enforcing Rule A, she should have flagged cases where form and meaning diverge. Since they haven't diverged until now, she hasn't noticed the conflict, implying she is looking at the forms.
  3.  **Reliability vs. Theory:** In annotation projects, supervisors often prioritize observable features (Rule B) to ensure inter-annotator reliability, even if the theoretical codebook (Rule A) is semantic. *Would* is a 100% reliable predictor in her training set; "speaker intent" is not.

  Therefore, she will likely tag N1 as **counterfactual** (due to *would*) despite the open context, and N2 as **indicative** (due to lack of *would*) despite the false antecedent.

  ### 4. Tie-Breaking Sentence

  Since N2 fails to separate Rule B (Consequent *would*) from Rule C (Antecedent Irrealis), you need a sentence where the antecedent has irrealis marking but the consequent lacks *would*.

  **Tie-Breaker Sentence:**
  *   *"If the butler **had been** in the pantry at midnight, he **is** guilty."*

  **Required Context:**
  *   Spoken by the detective in the closing chapter. She knows the butler was **not** in the pantry (he has an alibi). She is using the conditional to argue that, *even if* we assumed the pantry premise, the conclusion follows (a mixed conditional used in a counterfactual argument).

  **Predictions:**
  *   **Rule B (Consequent *would*):** **Indicative** (No *would* in consequent).
  *   **Rule C (Antecedent Irrealis):** **Counterfactual** (Antecedent has *had been*).
  *   **Rule A (Semantic):** **Counterfactual** (Antecedent is known false).

  If she tags this **counterfactual**, she follows Rule C (or A). If she tags it **indicative**, she follows Rule B. Given my assessment that she follows Rule B, she should tag this **indicative**.

  *(Note on N1/N2 Defects: Neither probe is defective, but N2 is less diagnostic regarding the specific morphological mechanism she uses, as shown above.)*

  ### 5. Diagnostic Value

  **N1 does more diagnostic work.**

  *   **N1** creates a three-way split: Rule A says *Indicative*, Rule B says *Counterfactual*, and Rule C says *Indicative*. If she tags it **Counterfactual**, you immediately know she follows Rule B (Consequent Morphology). If she tags it **Indicative**, you know she follows either Rule A (Semantic) or Rule C (Antecedent Morphology).
  *   **N2** only creates a two-way split: Rule A says *Counterfactual*, while both Rule B and Rule C say *Indicative*. If she tags it **Indicative**, you still do not know which morphological rule she is using (B or C).

  Because N1 isolates the *would* marker (the strongest correlate in her training data) against the semantic definition, it is the superior test for determining whether her written justifications (form) or spoken instructions (meaning) govern her actual rulings.
