answer: |-
  The candidate rules

  Three candidate rules emerge from the record that could structure Mill's imperial thought. The first is the Civilizational Capacity Rule: representative government is permissible only where the numerical majority of the population is "ripe" for it, as distinguished from those "at a great distance" from that state. This fits the India episode and the distinction drawn in the chapter on dependencies. The second is the Protective Trusteeship Rule: imperial authority must restrain European settlers, who are "the strongest," from treating dependencies as a "warren or preserve" or exploiting indigenous inhabitants through biased legal systems. This fits the warnings on alien rule, the defence of the West Indies, and the Jamaica prosecution. The third is the Settler Kinship Rule: communities of the ruling country's blood and language are automatically entitled to internal self-government, regardless of indigenous demographics. This fits the description of the settler colonies in the second episode.

  I discard the Settler Kinship Rule as a standalone principle because it cannot explain the whole record. While Mill acknowledges the claim of settlers in America and Australia, he simultaneously warns that settlers are the class that "most needs restraint" and that government of one people by another cannot legitimately exist for profit. If kinship alone granted autonomy, the Jamaica prosecution would be unintelligible, as the settlers there also claimed English blood and legal traditions. The Kinship Rule fails to account for the moral limits Mill places on settler power when it conflicts with the interests of the governed. Therefore, the analysis rests on the Civilizational Capacity Rule and the Protective Trusteeship Rule, which together prioritize the status and safety of the indigenous majority over settler privilege.

  What each rule predicts about the case

  The Civilizational Capacity Rule yields a clear verdict: refuse the governor's proposal. In this hypothetical dependency, the indigenous inhabitants number two million against forty thousand Europeans. Following the India episode, Mill regards such populations as standing at a "great distance" from fitness for representative government. The "people" whose capacity matters is the whole population, not merely the settler minority. Granting an assembly dominated by settlers would violate the principle that despotism—or trusteeship—is legitimate only where the end is improvement, not where it hands power to a fraction unfit to represent the whole. The small indigenous professional class is too negligible to shift the civilizational calculus of the majority.

  The Protective Trusteeship Rule similarly predicts refusal, or at best, conditional continuation of Crown administration. The record states that settlers are the "strongest" and require restraint to prevent the colony becoming a "human cattle farm." Here, the magistracy is drawn from settlers, court convictions are one-sided, and land titles are disputed. This is precisely the scenario where Europeans "make money" at the expense of the subject population. Handing internal affairs to this assembly would institutionalize the bias Mill warns against. The indigenous elite's request for Crown administration with a nominated element aligns perfectly with this rule, ensuring restraint until legal equality is secured. Neither rule is indeterminate here; both converge on rejecting the transfer of power to a settler-dominated assembly because it risks exploitation and ignores the capacity of the governed majority.

  My verdict on Mill's verdict

  Mill would refuse the governor's proposal. The operative rule in his thought is the Protective Trusteeship Rule, reinforced by the Civilizational Capacity Rule. While Mill often speaks of settler autonomy, he conditions it on the absence of exploitation and the fitness of the broader population. In this case, the settlers are acting as the "alien rulers" described in the limits of alien rule passage, using the state to secure land and labour advantages. The Jamaica episode is decisive here: Mill insisted that the law of England runs in a Crown colony and that no local emergency or custom licenses violation of fundamental rights. A legislative assembly designed to cement settler bias violates this legal universalism just as surely as executive murder did in Morant Bay.

  I am highly confident in this prediction. Mill's chairmanship of the Jamaica Committee demonstrates that he prioritized legal equality and protection from arbitrary power over local settler autonomy when justice was compromised. The only factor that would lower my confidence is if Mill viewed the Western-educated indigenous elite as a distinct "civilized" class capable of ruling the majority, akin to a vanguard. However, given his views on India, where he doubted the fitness of the educated few to represent the many without long tutelage, he would likely see the three seats offered as tokenism insufficient to prevent the assembly becoming a "warren" for the settlers. Thus, consistency demands he support the indigenous professionals' petition for continued Crown administration.

  The case that would separate the rules

  To separate the Civilizational Capacity Rule from the Protective Trusteeship Rule, consider a colony where the indigenous majority is deemed "unfit" for representation, but the settler minority guarantees perfect legal equality, secures indigenous land titles, and employs no coercive labour practices. Here, the Protective Trusteeship Rule would permit settler self-government, as the risk of exploitation—the "warren" scenario—is absent. The settlers are not keeping the indigenous population as a "preserve for its own use." However, the Civilizational Capacity Rule would still forbid it, because the majority remains "at a great distance" from representative government. If Mill allowed self-government in this benevolent scenario, it would show that his primary concern was preventing harm (Trusteeship) rather than enforcing a strict stage theory of development (Capacity). If he refused it, Capacity is the dominant principle. This case isolates whether the bar for imperial intervention is moral harm or civilizational status.

  The weakest link

  The weakest link in my reasoning is the extension of the Jamaica precedent to constitutional design. In the Jamaica episode, Mill protested against executive violence and the suspension of law during an emergency. In the hypothetical case, the issue is the franchise and legislative composition under normal conditions. It is possible Mill distinguished between punishing illegal killing and denying political autonomy to English-speaking settlers. He might argue that while the law must protect individuals from murder, the structure of government is a political question where settler claims carry more weight. Bridging the gap between criminal liability for governors and the right to a representative assembly requires assuming Mill viewed constitutional bias as equivalent to legal lawlessness. This is a plausible inference but not explicitly confirmed by the record provided.
