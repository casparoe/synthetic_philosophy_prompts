answer: |-
  # Viva Prep Sheet: Uncertain Evidence & Fractionated Uptake

  **Candidate:** [Your Name]
  **Date:** [Date]
  **Tone:** British English (Oxford spelling convention)
  **Strategy:** Defence of the niche, not the whole world.

  ---

  ## The Question You Hope Nobody Asks
  **Your guess:** *Does $\lambda$ itself get updated? Do you need a second-order rule to update $\lambda$, and does it have a fixed point?*

  **Verdict:** You are correct. This is the nastiest technical objection available. If $\lambda$ represents channel reliability, and you receive evidence about channel reliability via a noisy channel, you require a $\lambda'$ to update $\lambda$. This invites an infinite regress or requires a dogmatic stopper.

  **The Even Nastier Variant:** The Decision Theorist might pair this with **diachronic coherence**. If you choose $\lambda$ *after* seeing the evidence (to fit the outcome), you violate ex ante accuracy norms. If you choose it *before*, how do you justify the specific value without empirical calibration that itself relies on uncertain evidence?

  **Prepared Reply (2 mins):**
  'I distinguish between the *update rule* and the *parameter calibration*. $\lambda$ is not updated via fractionated uptake itself; it is a hyper-parameter fixed by the prior calibration of the instrument or channel. We treat the reliability of the channel as a separate proposition subject to standard conditionalisation when calibration data arrives. If that calibration data is itself uncertain, we do face a regress, but I argue this is a general problem for any non-certain evidence rule, not unique to mine. My claim is merely that *given* a known reliability profile, fractionated uptake is the optimal response. I do not claim to solve the sceptical regress of calibration.'

  **Weakness:** This concedes that your rule isn't a complete system for radical uncertainty. It limits the scope to cases where channel reliability is already known.

  ---

  ## The Objections (Ordered by Damage to This Committee)

  ### 1. The Hardline Bayesian (External 1)
  **Objection:** 'Why are we bothering with this at all? If you receive a blurry photo, you should conditionalise on the proposition "It appears to me that there is a heron". Jeffrey conditioning is a workaround for agents too lazy to enlarge their space to include phenomenological propositions. Your $\lambda$ is just an ad hoc patch for failing to specify the right evidence proposition.'
  **Damage:** **Critical.** Denies the necessity of your entire chapter.
  **Reply:** 'Enlarging the space requires the agent to be certain of the phenomenological proposition. But introspection is also noisy. I might be unsure whether I *seemed* to see a heron or a crane. Fractionated uptake models the uncertainty of the mapping from experience to proposition, not just the proposition itself. It captures the *force* of the experience, not just its content.'
  **Weakness:** Hardliners often deny that uncertainty about experience is coherent. You are fighting a foundational battle here.
  **Action:** **FLAG FOR CONCESSION.** In your opening, concede that *if* an agent can be certain of a proposition describing their total evidence state, standard conditionalisation is superior. Your rule is only for when that certainty is unavailable.

  ### 2. The Decision Theorist (External 2)
  **Objection:** 'Is this a rule or a family of rules? If $\lambda$ is chosen freely, you can justify any transition between priors and posteriors. To claim an accuracy argument, you must show this minimises expected inaccuracy *ex ante*. But if $\lambda$ depends on the specific evidence value, you violate the rigidity required for the accuracy proof.'
  **Damage:** **High.** Undermines your normative justification.
  **Reply:** 'It is a family of rules parameterised by channel characteristics, not evidence content. $\lambda$ is fixed by the known false-positive rate of the channel before the specific evidence arrives. The accuracy argument holds conditional on that reliability profile. It is no more "arbitrary" than choosing a likelihood function in standard Bayesianism.'
  **Weakness:** Requires you to show $\lambda$ is truly independent of the specific hypothesis $H$ being tested.
  **Action:** **FLAG FOR CONCESSION.** Concede that if $\lambda$ is tuned *post hoc* to match desired beliefs, the accuracy argument collapses. Emphasise that $\lambda$ must be fixed by prior calibration.

  ### 3. The Supervisor (Internal)
  **Objection:** 'You say rigidity needs a story. Your story is "noise". But why does noise manifest as linear damping? Why not a logarithmic shift or something else? You claim uniqueness in minimising inaccuracy, but that depends entirely on the loss function you've chosen. Change the score, lose the linearity.'
  **Damage:** **Medium-High.** Attacks the theoretical elegance.
  **Reply:** 'Linear damping falls out of minimising a weighted Brier score where the weight represents the signal-to-noise ratio. It is the simplest function that preserves probability axioms while attenuating the shift. I agree other loss functions yield different curves, but the Brier score is the standard for credence accuracy.'
  **Weakness:** You are tied to the Brier score. If they prefer log loss, your derivation fails.
  **Action:** **FLAG FOR CONCESSION.** Concede that the linear form is specific to the quadratic loss function. Claim that the *concept* of fractionation is the contribution, not the specific linear algebra.

  ### 4. The Stats Guy (Curiosity)
  **Objection:** 'This looks exactly like shrinkage estimation or regularisation towards the prior. We've done this in frequentist and Bayesian stats for decades to prevent overfitting. What is the philosophical content here that isn't just rebranding a computational heuristic?'
  **Damage:** **Medium.** Threatens the novelty of the thesis.
  **Reply:** 'Shrinkage is typically justified computationally to reduce variance. My justification is epistemic and normative. It explains *why* a rational agent *ought* to shrink credence when the evidence channel is known to be noisy, based on accuracy goals rather than predictive performance. It turns a heuristic into a rule of rationality.'
  **Weakness:** The mathematics may be identical, making the "philosophical content" seem thin.
  **Action:** **FLAG FOR CONCESSION.** Concede the formal similarity immediately. Do not fight the maths. Fight the interpretation.

  ### 5. The Chair (Philosopher of Science)
  **Objection:** 'You talk about instruments and labs. Have you ever seen a physicist use a $\lambda$? They use error bars, confidence intervals, and likelihood ratios. Does this actually touch a real instrument, or is it a solution looking for a problem?'
  **Damage:** **Medium.** Challenges applicability.
  **Reply:** 'Error bars are essentially confidence intervals which map to $\lambda$. When an experimentalist discounts an outlier because the detector was "acting up", they are intuitively applying a $\lambda < 1$. My framework formalises that intuitive discounting process so it doesn't become arbitrary.'
  **Weakness:** Physicists usually adjust the likelihood function, not the update rule itself.
  **Action:** Keep this practical. Do not overclaim.

  ### 6. The Hardline Bayesian (External 1) – Follow-up
  **Objection:** 'Jeffrey conditioning is sensitive to how you carve up the partition. If you fractionate the uptake, you inherit that partition dependence. Does your damping fix this, or does it just obscure the arbitrariness of the partition?'
  **Damage:** **Medium.** Technical vulnerability of all Jeffrey-style rules.
  **Reply:** 'It does not solve the partition problem. However, by damping the update, it reduces the magnitude of the error caused by a poor partition. It makes the agent more robust to partition choice, not immune.'
  **Weakness:** It admits the rule inherits the classic flaws of Jeffrey conditioning.

  ### 7. The Decision Theorist (External 2) – Follow-up
  **Objection:** 'You claim this dampens order-dependence. But Jeffrey updates are only commutative under specific conditions. Does adding $\lambda$ restore commutativity, or just make the non-commutativity smaller?'
  **Damage:** **Low-Medium.** Technical detail.
  **Reply:** 'It makes the non-commutativity smaller. Two attenuated updates land closer together than two full-strength ones. It does not restore full commutativity, but it increases diachronic stability.'
  **Weakness:** Must be precise about "closer together" (e.g., in Euclidean distance).

  ### 8. The Supervisor (Internal) – Follow-up
  **Objection:** 'You need a story for rigidity. If you reject full rigidity, what happens to the conditional probabilities $P(H|E)$? Do they shift?'
  **Damage:** **Low.** Clarificatory.
  **Reply:** 'They shift implicitly. By moving the marginal less than Jeffrey suggests, we are effectively acting as though the conditional probabilities have shifted slightly towards the prior distribution. Fractionated uptake on marginals is equivalent to a specific shift in conditionals.'
  **Weakness:** Requires careful algebraic verification to ensure no probability axioms are violated.

  ### 9. The Chair (Philosopher of Science) – Follow-up
  **Objection:** 'How do you quantify $\lambda$ in practice? If I give you a blurry photo, do you guess 0.7? Where does the number come from?'
  **Damage:** **Low.** Practical implementation.
  **Reply:** 'It comes from the known reliability of the source. If the camera has a known blur rate in low light, $\lambda$ is derived from that frequency. If it's subjective, it's the agent's credence in the reliability of their own perception.'
  **Weakness:** Subjective $\lambda$ opens the door to manipulation.

  ### 10. The Stats Guy – Follow-up
  **Objection:** 'If $\lambda$ is subjective, isn't this just adding another degree of freedom to fit any data?'
  **Damage:** **Low.** Reiteration of novelty concern.
  **Reply:** 'Any Bayesian parameter is subjective. The constraint is that $\lambda$ must be calibrated against known frequencies of channel reliability to be accurate. It is not a free parameter for fitting beliefs.'

  ---

  ## Strategic Concessions (Say these in your opening 5 minutes)

  1.  **To the Hardline Bayesian:** 'I concede that if an agent can be certain of a proposition describing their total evidence state, standard conditionalisation is the correct norm. My thesis applies only where that certainty is unavailable.'
  2.  **To the Stats Guy:** 'I concede that the mathematics of fractionated uptake resembles standard shrinkage estimators. The contribution of this thesis is not the algebra, but the normative epistemic justification for why a rational agent should employ such shrinkage.'
  3.  **To the Supervisor:** 'I concede that the linear form of the update is dependent on the choice of a quadratic loss function. The core claim is the necessity of attenuation, not the strict linearity.'

  ---

  ## Final Advice

  *   **Watch your spelling:** Your supervisor is a stickler. Ensure *defence*, *modelling*, *minimiser*, *programme*, and *colour* are used throughout your written materials and board work.
  *   **Don't fight the Hardliner on Principles:** You will not convert them. Your goal is to show that *even if* one accepts uncertain evidence exists, your rule is better than standard Jeffrey conditioning.
  *   **The $\lambda$ Regress:** If they press the "updating $\lambda$" question hard, do not bluff. Admit it is an open problem for the field of uncertain evidence generally, and that your chapter isolates the update rule assuming fixed reliability.

  Good luck. Keep it precise.
