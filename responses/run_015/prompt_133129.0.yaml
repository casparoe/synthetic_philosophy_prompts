      *   *The "Counterfeit" Angle:* If something is designed *only* to mimic personhood to manipulate or soothe, without any genuine stake in the outcome, it's a counterfeit. It's a puppet. Dennett would likely ask: Does it have its own *interests*? Can it suffer loss? Does it have a narrative gravity of its own?

