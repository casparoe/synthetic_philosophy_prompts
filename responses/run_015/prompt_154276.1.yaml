answer: |-
  The conceptual lay of the land you are looking for rests on a single, often unadmitted distinction: **What is the unit of survival?**

  When archaeologists and historians argue over "collapse" versus "transformation," they are rarely disagreeing about the facts (the dates, the stratigraphy, the pollen counts). They are disagreeing about *what entity* is supposed to be surviving.

  Your puzzle identifies two metrics: the **Ceiling** (societal complexity/capacity) and the **Self-Description** (ideological continuity/identity). The friction you feel comes from the fact that these two metrics track different "units." The Ceiling tracks the *State* (or the Elite System). The Self-Description tracks the *Culture* (or the People).

  Here is the breakdown of what is at stake, why the distinction matters, and why admitting the normative content changes the warning label we pin on history.

  ### 1. The Ontological Stake: What is dying?

  In your Scenario 1 (Ceiling drops, Self-Description holds), the **State** has collapsed, but the **Society** has not. In Scenario 2 (Ceiling drops, Self-Description breaks), both have collapsed.

  The concept of "collapse" is almost exclusively defined by the loss of *socio-political complexity*. It is the loss of the machinery required to maintain the Ceiling. Palaces, writing, and long-distance trade are expensive. They require surplus extraction, bureaucracy, and coercion. When the Ceiling drops, it means the mechanism for extracting and coordinating that surplus has failed.

  **Why Self-Description matters (It's not just PR):**
  You asked why Self-Description gets to do so much work, worrying it's just letting a people's "PR" decide the outcome. But Self-Description is not merely a story people tell; it is the *operating system* of the Ceiling.
  *   To build a palace, you need to convince 5,000 people that the King is divine (Self-Description).
  *   To maintain long-distance trade, you need a shared concept of value, credit, or diplomatic protocol (Self-Description).

  If the Ceiling drops but the Self-Description remains (Scenario 1), the *potential* for complexity remains. The "software" is still installed, even if the "hardware" is broken. This is **Transformation**. The society has simplified, perhaps voluntarily, to a level more sustainable for the population, but the cultural code to rebuild exists.

  If the Self-Description breaks (Scenario 2), the *capacity* for that specific complexity is lost. The cultural code is corrupted. Even if resources return, they cannot coordinate to rebuild the Ceiling because they no longer agree on what it is or why it matters. This is **Collapse**.

  **The Stake:** If we call Scenario 1 "collapse," we are saying the *State* is the only thing that matters. If we call it "transformation," we are saying the *People* matter more than the State.

  ### 2. The Normative Stake: Whose tragedy is it?

  This is where your intuition about "values wearing an archaeologist's hat" is exactly right. The debate over collapse is secretly a debate about inequality.

  **The Ceiling is an Elite Metric.**
  A high Ceiling usually means high inequality. It means a significant portion of the population is working to support monuments, armies, and administrators that do not directly contribute to their own caloric intake.
  *   **Rapa Nui:** For a century, the narrative was "Ecological Collapse." The statues stopped, the trees were gone, cannibalism ensued. This focused on the loss of the *Ceiling* (statue transport). Newer evidence suggests the population adapted, switched to rock gardening, and survived quite well without the statues. The *Ceiling* collapsed; the *people* transformed. Calling it "collapse" mourns the statues. Calling it "transformation" celebrates the adaptation.
  *   **The Maya:** The Classic Maya "collapse" saw the abandonment of great cities and the end of divine kingship. But the Maya people did not vanish; they moved, adapted, and persisted. The "collapse" was specifically the collapse of the *K'uhul Ajaw* (divine lord) system.

  **The Stake:**
  *   If you define collapse as **loss of complexity**, you are implicitly valuing the achievements of the hierarchy. You are saying, "It is a tragedy when we stop building pyramids."
  *   If you define collapse as **loss of well-being**, you might find that "collapse" events actually *improved* the average life (less tax, less war, better diet), as seen in some post-Bronze Age Greek contexts where palace bureaucracies vanished and local autonomy returned.

  By insisting on the word "collapse," traditional historiography often centers the tragedy of the elite. By shifting to "transformation," modern archaeology attempts to center the resilience of the populace. The "values in the hat" are about whether we view history as a story of **Great Works** or **Human Survival**.

  ### 3. The Utility Stake: What is the concept for?

  You asked: *What is the concept of collapse for? Is it mostly descriptive, or is most of its real content normative?*

  It is primarily a **warning label**.

  We study collapse because we are afraid of it happening to us. We want to know the "cause of death" so we can avoid it.
  *   **If Collapse is Descriptive (Systemic Failure):** Then the lesson is about fragility. Complex systems are brittle. Supply chains break. Bureaucracies become too costly. The warning is: *Simplify before you break.*
  *   **If Collapse is Normative (Civilizational Death):** Then the lesson is about morality. We failed our ancestors. We lost the light. The warning is: *Protect the institutions that hold the light.*

  **The Danger of the Normative View:**
  If we treat collapse as a moral failure (Scenario 2), we risk pathologizing adaptation. We might spend resources propping up a "Ceiling" (a failing empire, a bankrupt institution) that is no longer sustainable, simply because lowering the Ceiling feels like "death."
  *   **Bronze Age Eastern Mediterranean:** When the palaces burned (c. 1177 BCE), the "Ceiling" of international trade and literacy vanished for centuries. If the Hittites had viewed this as "transformation," they might have adapted faster. Because it was viewed through the lens of imperial collapse, it was recorded as a catastrophe. But for the average villager, the end of the Hittite Empire meant the end of conscription and grain requisition. Was it a collapse? For the Emperor, yes. For the farmer, it was a transformation of burden.

  **What we lose by admitting it's normative:**
  If we admit "collapse" is a value judgment, we lose its scientific punch. We can no longer say "Societies *inevitably* collapse" as a law of physics. We have to say "Elites *inevitably* lose control when extraction costs exceed surplus."
  *   **The Loss:** We lose the dramatic urgency. "Transformation" sounds manageable. "Collapse" sounds like the end of the world.
  *   **The Gain:** We gain accuracy. We stop fearing the loss of institutions that may be harming us, and start fearing the loss of the social cohesion (Self-Description) that allows us to survive without them.

  ### Summary: The Conceptual Lay of the Land

  To stop going in circles, you have to decouple the **System** from the **Population**.

  1.  **Systemic Collapse:** The Ceiling drops. The hierarchy dissolves. The specialized institutions vanish. (This happens in both your scenarios).
  2.  **Cultural Collapse:** The Self-Description breaks. The continuity of knowledge and identity is severed. (This happens only in Scenario 2).

  **The Verdict:**
  *   **Scenario 1 is Transformation.** The System collapsed, but the Culture survived to write a new story. This is the Bronze Age after the Palaces. It is a reorganization.
  *   **Scenario 2 is Collapse.** The System collapsed, and the Culture was too fragmented to reorganize. The specific societal organism died.

  **The Ultimate Stake:**
  The argument is about **what we are trying to save.**
  If we are trying to save **Civilization** (defined by Ceilings, monuments, and global trade), then any drop in complexity is a collapse, and we must prevent it at all costs.
  If we are trying to save **Humanity** (defined by population, well-being, and continuity), then a drop in complexity is often a healthy transformation, and "collapse" is only when the people themselves are erased or lose their way.

  The "values in the archaeologist's hat" are deciding which of those two things is worth saving. Admitting that doesn't weaken the analysis; it clarifies the warning. It tells us that "collapse" is not a natural disaster like an earthquake; it is a political failure to adapt the Ceiling to the floor.
