          *   *Example:* Bronze Age. Palaces burn (State dies), but villages remain (People persist). Is it collapse? Only if you care about the Palaces.

      *   **Argument 2: The Normative Trap (Complexity vs. Well-being)**
          *   Traditional view: High Ceiling = Good.
          *   Revisionist view: High Ceiling = High Burden.
          *   *Example:* Rapa Nui. Statues stop (Ceiling drops). Did people starve (Collapse) or did they switch to better farming (Transformation)?
