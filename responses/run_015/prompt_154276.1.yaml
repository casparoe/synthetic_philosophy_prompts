  4.  **Descriptive vs. Normative:**
      *   Is "collapse" descriptive? Technically, it describes a rapid loss of complexity.
      *   Is it normative? Yes, because "complexity" is often equated with "good" in traditional historiography (monuments = success).
      *   *The Stake:* If we call it "transformation," we imply resilience and adaptation. If we call it "collapse," we imply failure and warning.
      *   *What do we lose by admitting it's normative?* We lose the ability to use "collapse" as an objective scientific category. But we gain honesty about our biases. We stop mourning palaces and start asking about people.

  5.  **Developing the Arguments (The "Lay of the Land"):**

      *   **Argument 1: The Unit of Analysis (Who dies?)**
          *   Collapse usually means the death of the *State*, not the *People*.
          *   Scenario 1: The State simplifies, people persist. (Transformation)
