      *   *Section 2: The Normative Stake (Who's tragedy is it?).* Address the "PR" concern. Self-description isn't just PR; it's the operating system. But admit that "Ceiling" is an elite metric. Use Rapa Nui/Maya to show how "collapse" can obscure human resilience.
