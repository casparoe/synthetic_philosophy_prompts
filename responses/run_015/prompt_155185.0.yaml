      *   *The "Blog Post" Move:* This sounds like "Modal UDT" or "Löbian Cooperation." The specific move "resolve to delegate only if it has not proved that it will delegate" sounds like trying to avoid the fixed point. Actually, the classic workaround is "I will do X if I find a proof that X is good." Löb's theorem makes this work *too well* (it does X if it finds a proof that *if it finds a proof X is good, then X is good*). This is subtle. I should advise the user to characterize this as "Proof-Based Decision Theory" and note that it shifts the problem from "Can I trust him?" to "What happens if we both reason this way?"

