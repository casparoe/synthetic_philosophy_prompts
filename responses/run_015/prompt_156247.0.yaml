answer: |-
  ### I. The Principle of Architectural Continuity and Reflective Endorsement

  To capture your verdicts without ad-hoc clauses, I propose the following principle. It treats idealized preferences as the output of a specific *process* applied to a specific *substrate*.

  **A preference belongs to a person's idealized volition if and only if it is the stable endpoint of a trajectory satisfying these four conditions:**

  1.  **The Epistemic Condition:** Every step in the trajectory must be justifiable as an increase in information, reasoning power, or coherence, rather than a direct alteration of goal-weights.
      *   *Motivation:* Captures Cases 1 (Smoker), 2 (Apostate), and 3 (Depressed). Distinguishes truth-seeking from preference-shaving.
  2.  **The Agential Condition:** Changes in affective disposition must result from the agent *processing* experiences through their existing cognitive architecture, not from bypassing that architecture to alter outputs directly.
      *   *Motivation:* Distinguishes Case 4 (Father) from Case 5 (Drug). The father *processed* the experience of parenting; the drug user had their chemistry overwritten.
  3.  **The Architectural Condition:** The extrapolation assumes the agent's fundamental sensory and cognitive hardware remains constant. We extrapolate the *mind*, not the *body* or *sensory modalities*.
      *   *Motivation:* Captures Case 7 (New Sense). A new sensory modality is a hardware change, importing values rather than extrapolating existing ones.
  4.  **The Convergence Condition:** The endpoint must be a stable attractor; if different orderings of information lead to different stable endpoints, neither counts as fully idealized.
      *   *Motivation:* Resolves Case 6 (Order Effects). Path-dependence indicates residual arbitrariness, not ideal reasoning.

  **For Joint Volition (Case 9):**
  *   **The Aggregation Rule:** When merging idealized agents, conflicting terminal weights over shared resources require compromise (Case 9a). However, if distinct extrapolations independently converge on a new value neither originally held, that value is adopted without compromise (Case 9b).
      *   *Motivation:* Distinguishes between *conflict of interest* (compromise) and *shared discovery* (adoption).

  ---

  ### II. Verdicts on New Cases

  Applying the principle strictly yields the following:

  **1. The Six-Year-Old**
  *   **Verdict:** Extrapolate to the *mature* architecture, then apply the Epistemic Condition.
  *   **Reasoning:** A child's cognitive hardware is biologically programmed to develop. The "Architectural Condition" fixes the hardware at the *intended mature state*, not the current immature state. We do not extrapolate the child's current reasoning (which is flawed by development), but we do not add new senses either. We simulate the adult mind they were designed to become, then give *that* mind full information and reasoning power.

  **2. Advanced Dementia**
  *   **Verdict:** Idealization is impossible (or requires reconstruction).
  *   **Reasoning:** The "Architectural Condition" requires a stable substrate. Dementia involves the degradation of the cognitive hardware itself. There is no continuous trajectory of "better reasoning" available because the reasoning engine is breaking. To extrapolate, you would have to reconstruct the pre-dementia architecture first, which moves from extrapolation to restoration.

  **3. The 51/49 Split**
  *   **Verdict:** Compromise is required.
  *   **Reasoning:** This matches Case 9a. If 51% want arrangement X and 49% want arrangement Y, and these are terminal preferences regarding shared resources, this is a conflict of idealized weights. The "Aggregation Rule" mandates compromise, not tyranny of the majority, because the minority's idealized volition still holds moral weight in the joint function.

  **4. The Successor Agent**
  *   **Verdict:** Valid, provided the desire stems from the Epistemic Condition.
  *   **Reasoning:** If the idealized self concludes, via superior reasoning and information, that a different value system is objectively better or more robust than their own, and thus chooses to be succeeded, this satisfies the "Epistemic Condition." It is a judgment of value, not a hardware failure. However, this triggers a safety check: we must ensure this conclusion isn't a result of "wireheading" or manipulation (violating the Agential Condition). If it is a genuine philosophical conclusion, it counts.

  ---

  ### III. Limitations and Trade-Offs

  A simple principle cannot save every intuition. Here is the honest accounting of what this principle sacrifices and why.

  **1. The Sacrifice of Case 8 (The Pre-Commitment Veto)**
  *   **The Conflict:** You felt Case 8 (religious person vetoing apostasy) "should count for something, maybe a lot," but Case 2 (apostasy counts) is a "Yes."
  *   **The Trade-Off:** This principle sides with **Case 2** and effectively overrides Case 8.
  *   **Why:** If current selves can veto future truths via pre-commitment, idealization becomes impossible. A smoker could pre-commit to smoking; a depressed person could pre-commit to isolation. The "Epistemic Condition" prioritizes truth and coherence over current procedural constraints.
  *   **Explanation of Temptation:** You were tempted by Case 8 because it respects *autonomy* and *identity continuity*. However, in value alignment, respecting a "right to be wrong" undermines the purpose of extrapolation. The principle treats the pre-commitment as *data* about the current self's fears, but not as a *constraint* on the idealized self's conclusions.

  **2. The Tension Between Case 4 (Father) and Case 7 (New Sense)**
  *   **The Conflict:** Both involve gaining capacities the agent lacked. Why is one "software" (allowed) and the other "hardware" (forbidden)?
  *   **The Trade-Off:** The principle draws a bright line at *biological/cognitive architecture*.
  *   **Why:** Parenting engages latent circuits of care, protection, and bonding that exist in the standard human configuration. A new sensory modality (e.g., echolocation or seeing UV) requires new qualia channels. The former is activating existing potential; the latter is changing the vessel.
  *   **Risk:** This is somewhat arbitrary. If a drug (Case 5) unlocks a latent capacity (e.g., perfect pitch) that allows new values, is that allowed? The principle says **No**, because the *method* (drug) violates the Agential Condition, even if the *capacity* was latent. This is a known limitation: the *path* matters as much as the *destination*.

  **3. The Hardness of Case 6 (Order Effects)**
  *   **The Conflict:** You had no verdict.
  *   **The Trade-Off:** The principle declares **neither** endpoint idealized.
  *   **Why:** Ideal reasoning should be order-independent. If the result depends on the sequence of information, the reasoning process contains arbitrariness. The "Convergence Condition" demands we keep reasoning until the order no longer matters. If it never stops mattering, there is no unique idealized preference, only a set of "locally ideal" states.

  ---

  ### IV. Metaphysics and Limits of Change

  **Discovered or Constructed?**
  The principle treats idealized preferences as **constructed within constraints**.
  *   **Constructed:** They do not exist pre-formed in the brain waiting to be dug up. The "trajectory" creates the preference; the agent becomes someone new.
  *   **Constrained:** The construction is not free. It is bounded by the "Architectural Condition" (human hardware) and the "Epistemic Condition" (truth/coherence).
  *   **Synthesis:** It is like growing a tree. The final shape is not "discovered" inside the seed (the seed is not a tiny tree), but it is not arbitrarily constructed either (an oak seed cannot grow into a pine). The idealized self is the mature tree grown in perfect soil.

  **How Much Change is Too Much?**
  The principle predicts that an extrapolation stops being "hers" when it violates the **Architectural Condition**.
  *   **Permissible Change:** Radical shifts in specific goals (faith to atheism, childfree to parent) are allowed because they result from processing information/experience through the *same* cognitive hardware.
  *   **Impermissible Change:** Shifts that require new sensory modalities, direct chemical rewriting of affect, or the removal of core human drives (e.g., social bonding, curiosity) are excluded.
  *   **The Boundary:** The boundary is not *what* she values, but *how* she came to value it. If the path required becoming a different kind of creature (hardware change) or bypassing her agency (drug/manipulation), it is no longer her extrapolation. If the path required her to think harder and see clearer, even if the result is unrecognizable to her current self, it remains hers.
