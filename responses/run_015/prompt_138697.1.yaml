      *   Therefore, the stratified estimates are biased for the total effect in *both* cases.
      *   The aggregate (unadjusted) is the correct policy number in both cases, provided $T$ is not confounded with $Y$ by upstream variables.
      *   The paradox dissolves because you stop asking which stratified number is real. Neither is the total effect.
      *   Binning issues vanish because you don't bin $S$ for the total effect.
      *   The "dispute about reference class" is false; the reference class is the population under intervention $do(T)$.

  5.  **Refining for Constraints:**
      *   Under 250 words.
      *   No headings/bullets.
      *   Don't say "it depends on what you want" (instead say "the decision dictates the estimand").
