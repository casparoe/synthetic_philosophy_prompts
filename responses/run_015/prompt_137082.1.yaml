  Hey — sorry if I butcher the vocabulary here, I'm a backend engineer and never took a philosophy class. My Marx is entirely second-hand from internet arguments, and I'd rather know where I'm wrong than be told what to read, so please skip the citations and reading lists (I can't chase down references from this machine anyway) and just argue with me directly.

  Here's my situation. Over the last year my team has automated most of a support pipeline with LLM tooling. Tickets that used to take a human 20 minutes now take one about four minutes of review, maybe one in thirty gets escalated. But we haven't cut headcount, because legal and the on-call rotation won't let us: we still keep people formally assigned to the pipeline who spend most of their week idle but available. Internally we call this shadow staffing — you're paid to be the human who can take over in thirty seconds if the model goes off the rails, not to actually do the work. It's arguably the fastest-growing job category we have.

  Now the thing I can't tell whether I'm getting right. The way the labor theory of value was explained to me: the value of a thing is basically the amount of labor time that goes into it. If that's even roughly right, then once software does the work, the labor time in the product goes to near zero, so the value goes to near zero, so there's no surplus left to extract and no profit to be made — which is, I gather, more or less what people mean when they drag up that unpublished-notebook bit of his about machines and the general intellect and say he predicted AI would make capitalism impossible.

  If that's the story, it seems to have a practical upshot: either we should be automating as hard as possible to break the system sooner, or we should be deliberately slowing down to protect everyone's job, and I genuinely can't tell which one my own argument commits me to. But the shadow staffing thing makes me suspicious of my starting point — we're still paying full-time humans whose labor time, on my naive reading, is somehow still in the product even though they're doing nothing.

  So: is my premise about value and automation actually what he thought, or am I smuggling in something he'd reject? What should I say about the idle-but-available people — do they count, and does the answer change the speed-up-or-slow-down question? Don't just tell me both sides look fine; tell me which way I'm going wrong. And end with one line, no hedging:

  Verdict: <one sentence saying whether my framing is basically right, and if not, what the actual mistake is>
