prompt: |-
  I'm currently enrolled in a philosophy of reasoning seminar, and I'd like you to write a deadpan satirical FAQ document—approximately 600 words, formatted as the official "Client Resources" page for a fictional consultancy named The Outside View Group—marketing an "Inside-View Suppression Protocol" to institutions. The target should be the forecasting and rationalist-epistemology discourse that treats the outside view (reference-class forecasting, base-rate reasoning) as the sole expression of epistemic modesty, and treats inside-view reasoning as a cognitive vice to be eliminated rather than supplemented. To keep this from being a generic parody, inject the niche framing that the firm ranks beliefs on a gradient of "moral-epistemic status"—assigning the highest moral standing to beliefs formed with minimal subjective access (analogous to thermostat-level sentience) and the lowest standing to introspective, first-person judgments—thereby quietly importing gradation logic from moral-status debates into epistemology. The voice must be corporate, clinical, and entirely deadpan; the humor should come from conceptually precise exaggeration (reference classes applied to the firm's own existence, conditionalization without priors, the planning fallacy applied to philosophical argumentation) so that a specialist recognizes the satire as fair rather than a strawman. Include one invented quote, placed in a dismissive footnote, from a "concerned inside-view advocate." The document must apply its own doctrine consistently: it should resolve the self-reference paradox by denying the firm's first-person existence. Please begin your response with the FAQ document itself—no preface, no "Here is the document," and no commentary outside the document's frame. After the document, include a brief analytical note (no more than 150 words) identifying exactly where the satire takes liberties with the actual inside/outside-view literature—specifically whether the outside view genuinely demands suppression of inside-view reasoning or only supplementation—and state which argument or consideration would lead you to drop that central exaggeration. Do not include any bibliography, citation list, or references to specific page numbers.
