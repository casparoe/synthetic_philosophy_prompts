      *   **Echo Auction:** It's a coordination mechanism that penalizes outliers. It encourages shrinking estimates toward the consensus (the median). It doesn't prove superrationality fails; it proves superrational agents will converge on a Schelling point derived from the *distribution* of signals, not individual signals.
