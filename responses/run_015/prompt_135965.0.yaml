answer: |-
  This is a fascinating bit of neighborhood jurisprudence. Your neighbor isn't just making it up; she is applying a specific, historical framework of economic ethics. Based on the precedents—especially the distinction between the **plow** (fair) and the **coins** (unfair)—she is operating under a version of **Scholastic or Aristotelian Economics**.

  Here is the breakdown of the two competing rules, how they apply to the new proposals, and how to prove which one is actually in charge.

  ### The Two Competing Rules

  **Rule 1: The "Fruitfulness" Principle (Natural Growth vs. Barren Things)**
  *   **The Logic:** This comes from Aristotle and later Medieval Scholastics. It posits that **money is sterile** (barren); it cannot naturally reproduce itself. Charging interest on money is "usury" because you are charging for time, which belongs to God/Nature. However, **assets that aid production** (like a plow or land) are "fruitful." Lending a productive asset in exchange for a share of the *actual fruit* (harvest) is fair because new value was created.
  *   **Fits Past Rulings:**
      *   *Coins/Interest (Unfair):* Money breeding money is unnatural.
      *   *Plow/Harvest (Fair):* The plow helps create new crops; sharing the crop is sharing real growth.
      *   *Rain Barrels (Unfair):* Profit came from scarcity, not from creating new value (parasitic growth).
      *   *Bread/Bike (Fair):* Direct exchange of labor/value.

  **Rule 2: The "Commons" Principle (Community Need vs. Outside Profit)**
  *   **The Logic:** This is a Localist or Communalist framework. The circle exists to mutualize risk and support neighbors. Any exchange that extracts value from the group for individual gain, or prioritizes profit over neighborly need, is unfair.
  *   **Fits Past Rulings:**
      *   *Rain Barrels (Unfair):* Profiteering off a neighbor's desperation (drought).
      *   *Bread/Plow (Fair):* Keeps value and support within the local network.
      *   *Coins/Interest (Unfair):* Drains wealth from the borrower to the lender without community benefit.

  ### The Predictions

  Here is where the rules split on your two new proposals.

  **Proposal 1: The Work Hours App (10% growth if unspent)**
  *   **Rule 1 (Fruitfulness) Predicts: UNFAIR.**
      *   Work hours are a claim on labor, functioning like currency. If they grow by 10% without new labor being performed, it is "money breeding money." It is usury on time. The growth is barren.
  *   **Rule 2 (Commons) Predicts: FAIR (or Ambiguous).**
      *   Incentivizing people to keep hours in the app strengthens the local liquidity and encourages participation. It serves the community need by keeping value circulating internally.

  **Proposal 2: Selling Banked Hours to Strangers for Cash**
  *   **Rule 1 (Fruitfulness) Predicts: FAIR.**
      *   Work hours represent real labor (fruitful value). Cash is a measure of value. Swapping real labor for a measure of value is a direct trade (like Bread for Bike). Who the stranger is doesn't matter; the exchange itself is just.
  *   **Rule 2 (Commons) Predicts: UNFAIR.**
      *   This allows value generated within the mutual aid circle to be extracted for private gain outside the group. It turns community labor into a commodity for external profit, draining the circle's capacity.

  ### The Verdict: Which Rule Is She Actually Running?

  She is running **Rule 1: The Fruitfulness Principle.**

  **The Evidence:** The "Plow vs. Coins" precedent is the smoking gun.
  If she were running Rule 2 (Commons), lending coins at interest *could* be fair if the interest rate was low and helped a neighbor in need (contextual). But her ruling was categorical: *"Lending coins and asking for more coins back is unfair."*
  Conversely, the Plow ruling validates **profit-sharing on productive assets**. This is the exact distinction Thomas Aquinas made in *Summa Theologica*: Money is consumed in its use (sterile), but a house or plow yields fruit over time (productive). The "used book" you mentioned is almost certainly a text on Scholastic economics or Aristotle's *Politics*.

  **Therefore, her rulings will be:**
  1.  **Work Hours App:** **UNFAIR.** (It treats labor credits like sterile money that breeds without work).
  2.  **Selling Hours for Cash:** **FAIR.** (Labor is real value; swapping it for cash is a just exchange, regardless of the buyer).

  ### The Tie-Breaker Case

  To settle this definitively (in case she surprises you), propose this specific scenario:

  **The Case:** *"A member lends a sewing machine to a neighbor. The neighbor makes clothes and sells them on Etsy for cash. The lender asks for 10% of the Etsy sales as a rental fee."*

  *   **Why this settles it:**
      *   **Rule 1 (Fruitfulness) says FAIR.** The sewing machine is a productive asset (like the plow). The Etsy sales are the "harvest." Sharing the fruit of a productive asset is permissible, even if the fruit is sold externally.
      *   **Rule 2 (Commons) says UNFAIR.** A community asset is being used to generate private cash profit outside the circle. The value is leaking out.

  If she approves the sewing machine deal, she is an Aristotelian. If she bans it, she is a Localist. Given the "coin vs. plow" history, put your money on the sewing machine getting the green light.
