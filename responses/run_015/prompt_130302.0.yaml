  # METAPHYSICS OF CAUSATION: A CLASSIFICATION TREE

  **Instructions:** Answer each question based on your metaphysical commitments regarding the case presented. Do not select an answer based on which historical figure you prefer; select the answer that best describes what you believe *happens* in the world. Follow the path to your leaf.

  ### NODE 1: ONTOLOGICAL PRODUCTION
  **Case:** Fire is applied to cotton, and the cotton burns.
  **Question:** Does the fire *contribute being* to the burning? That is, does the existence of the burning depend on the fire's activity, or does the burning arrive wholly from a source independent of the fire?
  *   **(A) The fire contributes being.** (Go to Node 2)
  *   **(B) The burning arrives from elsewhere.** (Go to Node 5)

  ---

  ### NODE 2: EXPLANATORY INTELLIGIBILITY
  **Case:** Assume the fire contributes being to the burning.
  **Question:** Does the nature of the fire *make it intelligible* why burning follows? If you fully understood the fire, would you understand why it burns cotton, or is the connection a brute fact?
  *   **(A) It makes it intelligible.** (Go to Node 3)
  *   **(B) It is a brute fact.** (Go to Node 4)

  ---

  ### NODE 3: MODAL NECESSITY
  **Case:** The connection is intelligible from the fire's nature.
  **Question:** Could the fire exist with its current nature and *fail* to burn the cotton?
  *   **(A) No, it is metaphysically impossible for it to fail.** → **LEAF 1: Avicennan Necessary Emanation**
  *   **(B) Yes, it could fail, though it usually does not.** (Go to Node 4)

  ---

  ### NODE 4: SOURCE OF CONTINGENT POWER
  **Case:** The fire produces the effect, but it could fail (or the connection is brute/manipulable).
  **Question:** Consider human action: Your arm rises and you intended it to rise. What did your power contribute?
  *   **(A) I am an instrument; the power flows through me from a higher source.** → **LEAF 2: Aquinas's Instrumental Secondary Causation**
  *   **(B) I possess an intrinsic power to trigger the motion.** → **LEAF 3: Powers or Dispositionalist View**
  *   **(C) Causation is just about what I can manipulate, not what exists.** → **LEAF 4: Interventionist Account**
  *   **(D) I produce being, but there is no explanation for why it works.** → **LEAF 5: Unoccupied (Brute Production)**

  ---

  ### NODE 5: SCOPE OF SEQUENCE
  **Case:** The burning arrives from a source independent of the fire (No Ontological Production).
  **Question:** Is the sequence of fire-then-burning coordinated by *individual acts* for each event, or by a *standing rule* that covers all instances?
  *   **(A) Individual acts for each event.** (Go to Node 6)
  *   **(B) A standing rule or habit.** (Go to Node 7)

  ---

  ### NODE 6: TYPE OF INDIVIDUAL ACT
  **Case:** The sequence is coordinated by individual acts.
  **Question:** Are these acts determined by a general policy (e.g., "I will always burn cotton when fire touches it") or decided freshly each time?
  *   **(A) Decided freshly each time.** → **LEAF 6: Ash'arite Occasionalism**
  *   **(B) Determined by a general policy.** → **LEAF 7: Malebranche's Occasionalism (General Volitions)**

  ---

  ### NODE 7: LOCATION OF HABIT
  **Case:** The sequence is coordinated by a standing rule.
  **Question:** Where does this rule reside? Is it a decree external to the creatures, or a nature internal to the creatures?
  *   **(A) A decree external to the creatures (Divine Habit).** → **LEAF 8: Created-Natures Reading of al-Ghazālī**
  *   **(B) A nature or regularity internal to the creatures.** (Go to Node 8)

  ---

  ### NODE 8: COUNTERFACTUALS AND INDETERMINISM
  **Case:** The rule is internal to the creatures (Worldly Regularity).
  **Question:** Consider the sentence: "If the cotton had been put in the fire, it would have burned." Also consider a single atom decaying spontaneously.
  *   **(A) The sentence is true because laws necessitate outcomes; atoms do not decay without a prior condition.** → **LEAF 9: Nomic Necessitation (Lewis/Armstrong)**
  *   **(B) The sentence is true only as a prediction based on past stability; atoms can decay without a prior condition.** → **LEAF 10: Humean Regularity**

  ---

  ## LEAF DESCRIPTIONS

  **LEAF 1: Avicennan Necessary Emanation**
  *   **Commitment:** Causes metaphysically necessitate their effects.
  *   **Awkward Commitment:** The world must exist eternally and could not have been otherwise.

  **LEAF 2: Aquinas's Instrumental Secondary Causation**
  *   **Commitment:** Creatures truly act, but only as instruments of a primary cause.
  *   **Awkward Commitment:** No creature has independent causal power; all agency is borrowed.

  **LEAF 3: Powers or Dispositionalist View**
  *   **Commitment:** Causes have intrinsic properties directed toward specific effects.
  *   **Awkward Commitment:** Powers are real but often unobservable until they manifest.

  **LEAF 4: Interventionist Account**
  *   **Commitment:** Causal claims are about what happens under manipulation, not ontology.
  *   **Awkward Commitment:** Causation depends on the existence of agents capable of intervention.

  **LEAF 5: Unoccupied (Brute Production)**
  *   **Commitment:** Causes produce effects, but there is no explanation or law linking them.
  *   **Diagnosis:** Empty because it is unattractive; production without reason violates the Principle of Sufficient Reason.

  **LEAF 6: Ash'arite Occasionalism**
  *   **Commitment:** Every individual event is directly created by a Will; creatures do nothing.
  *   **Awkward Commitment:** Human agency is an illusion; I do not move my own arm.

  **LEAF 7: Malebranche's Occasionalism (General Volitions)**
  *   **Commitment:** Events are created by a Will acting through general laws rather than particular decrees.
  *   **Awkward Commitment:** God directly causes particular sins or evils by upholding the general law that permits them.
  *   **Note:** This may differ from Leaf 6 only verbally if "general policy" is indistinguishable from "fresh decision" in practice.

  **LEAF 8: Created-Natures Reading of al-Ghazālī**
  *   **Commitment:** God creates a stable habit in creatures that mimics necessary connection.
  *   **Awkward Commitment:** Natures are real but causally inert; they are signs of God's habit, not sources of power.

  **LEAF 9: Nomic Necessitation (Lewis/Armstrong)**
  *   **Commitment:** Laws of nature are real relations that govern events.
  *   **Awkward Commitment:** Laws are brute facts that exist over and above the events they govern.

  **LEAF 10: Humean Regularity**
  *   **Commitment:** Causation is nothing more than constant conjunction.
  *   **Awkward Commitment:** There is no modal force in nature; the future could logically diverge from the past instantly.

  ---

  ## META-ANALYSIS OF THE TREE

  **Inseparable Leaves:**
  *   **Leaf 6 (Ash'arite) and Leaf 7 (Malebranche):** The tree separates these by "Individual vs. General" acts (Node 6). However, if a "General Volition" is metaphysically identical to a series of "Individual Decrees" that happen to match, the distinction is merely verbal.
  *   **Extra Question Needed:** "Does the Will deliberate between each individual event, or does a single act of Will cover all time?"

  **Diagnosis of Unoccupied Leaf (Leaf 5):**
  *   This combination (Ontological Production + No Explanatory Intelligibility) is empty because it is unattractive; it posits a causal mechanism that operates without any reason or law, which renders the concept of "production" unintelligible.

  **Merely Verbal Disputes:**
  *   **General vs. Specific Volition:** Whether a deity wills each event individually or wills a law that covers events may describe the same metaphysical reality with different theological emphases.
  *   **Laws vs. Regularities:** Whether one calls stable patterns "Laws" (Armstrong) or "Regularities" (Hume) often depends on whether one insists laws must *explain* the regularity or merely *describe* it.
