answer: |-
  Good evening, everyone. For those I haven't met, I'm [Your Name]. Looking around this room, I see a fascinating distribution. On one side, we have decision theorists who can spot a dominated strategy from across the bar. On the other, we have family members who, as Marisol once joked, think "utility" is just something you pay to the water company.

  Marisol spent thirty years bridging that gap. But she didn't just bridge it; she tested its load-bearing capacity.

  We all know the basic arithmetic of her field. Expected Value. Probability times payoff. It is a beautiful, clean tool. And for a long time, the orthodoxy was that if you want to do the most good, you follow that calculation wherever it leads. If a budget line doesn't yield the highest return, you cut it.

  Marisol's genius was realizing that if you apply that calculation recursively to *every* line item, you don't get optimization. You get a cascade.

  She used a concrete example often. Imagine a hospital. The expected value of a backup generator is low. Most days, the main power works. The cost of the generator is high. A naive EV calculation says: sell the generator. Invest that money in immediate treatments. You save more lives *today*.

  But Marisol showed that if you make that trade-off enough times—if you cut maintenance, if you cut training, if you cut the sterilization protocols because the immediate payoff is low—you aren't just saving lives today. You are dissolving the infrastructure that makes saving lives possible tomorrow. When the storm comes, the hospital doesn't just perform poorly; it ceases to function.

  Her specific contribution to the philosophy of risk was arguing that Expected Value needs an internal brake. And crucially, she showed that EV cannot construct that brake from within. You cannot use probability-times-payoff to justify keeping the generator, because by definition, the generator is a low-probability asset. You need a meta-rule. You need a commitment to institutional integrity that sits *outside* the immediate calculation.

  Now, I want to be careful here. Marisol was never "bad at arithmetic." She didn't ignore the numbers. She understood that the numbers are only valid if the system producing them remains intact. She taught us that resilience isn't an inefficiency; it's a precondition for utility.

  This matters because it protects us from a naive view of impact. It's not about counting heads or measuring distance. It's about recognizing that without the structural capacity to care, the count doesn't matter. She didn't just ask "how many did we save?" She asked, "are we still a place that *can* save?"

  That is why her work endures. She didn't just manage risk; she managed the tools we use to measure it. She ensured that when the next crisis came, the lights stayed on.

  So, if everyone could raise a glass.

  To Marisol. For teaching us that the most rational thing you can do is sometimes protect the things you cannot afford to lose. For the brake that saved the engine. And for thirty years of keeping the lights on for all of us.

  To Marisol.
