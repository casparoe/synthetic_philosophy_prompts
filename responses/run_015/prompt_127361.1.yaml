answer: |-
  **MEMORANDUM**

  **TO:** The General Editor
  **FROM:** Junior Editor
  **SUBJECT:** Ruling on the Lockhart Sister Letters (The Hired Silence)

  You have asked for an anticipation of how the new evidence regarding *The Hired Silence* should be categorised, based on our established precedents. The material in question consists of private, contemporaneous letters to a non-professional confidante (the author's sister), containing specific claims about thematic intent (a) and narrative ontology (b). Below is my analysis of how these should be handled relative to our existing minutes.

  ### 1. Prediction on Rulings for (a) and (b)

  I predict that claims (a) and (b) will **not** be treated alike, though neither will be granted the status of 'decisive evidence' regarding the meaning of the published text.

  *   **Regarding Claim (a) ('Run out of wanting'):** I expect this to be ruled **admissible for the Headnote, but not as the definitive meaning.** It contradicts Precedent 1 (the 1968 magazine interview where she stated Anne is 'refusing'). Since Precedent 1 is 'public' and 'decisive', these private letters cannot override it. However, because (a) is a plausible reading that the text can bear (unlike claim b), it should appear in the Headnote as a record of the author's private uncertainty or shifting perspective during composition. It illuminates the 'Composition' without settling the 'Meaning'.
  *   **Regarding Claim (b) ('Imaginary chapter'):** I expect this to be ruled **genesis and biography only, restricted to the Apparatus.** This claim contradicts the internal logic of the published text, which treats the events as real. Following Precedent 6 (Drafts), we do not read the published text through a version of events that the text itself does not signal. Following Precedent 5, private notes to friends are biography. To accept (b) as 'what the novel means' would require the reader to ignore the textual evidence in favour of a private assertion, which violates our commitment to the authorised version.

  **Summary:** (a) goes to the Headnote as contextual biographical nuance; (b) goes to the Apparatus as compositional history. Neither displaces Precedent 1 or the published text.

  ### 2. A Menu of Consistent Rules

  Our precedents allow for several interpretative rules. Each yields different consequences for the Sister Letters.

  **Rule I: The Publicity Principle**
  *   **Content:** Only statements made to a public audience (interviews, lectures) can determine the meaning of the text. Private writings, regardless of timing, are biographical data.
  *   **Precedents:** Supported strongly by Precedent 1 (Public = Decisive) and Precedent 5 (Private to friend = Biography).
  *   **Prediction:** Both (a) and (b) are relegated to biography/apparatus. Precedent 1 remains the sole authority on meaning. The letters are printed only to show the author's private state of mind, not to guide interpretation.

  **Rule II: The Recipient Principle**
  *   **Content:** The authority of a statement depends on the professional relationship of the recipient. Statements to editors or agents carry weight on textual matters; statements to family or friends do not.
  *   **Precedents:** Supported by Precedent 3 (Letter to Editor = Evidence of deliberate cut) vs. Precedent 5 (Note to Friend = Biography).
  *   **Prediction:** Since the sister is not a publishing professional, both (a) and (b) are treated as biography. If these letters had been to her editor, (a) might have been admissible as meaning, but as they stand, they are excluded from the 'Meaning' section of the Headnote.

  **Rule III: The Textual Capacity Principle**
  *   **Content:** Authorial intention is only admissible if the published text can structurally or semantically support it. If the text contradicts the intention, the text stands (Precedent 6).
  *   **Precedents:** Supported by Precedent 6 (Drafts not read through published text) and Precedent 4 (General aims not decisive on local questions).
  *   **Prediction:** Claim (a) is admissible for the Headnote because the text *can* bear the reading of 'emptiness' rather than 'refusal'. Claim (b) is inadmissible for meaning because the text *cannot* bear the reading of 'imagined event' without breaking its own realism. This rule distinguishes between the two claims.

  ### 3. Best Guess and Closest Analogue

  **Best Guess:**
  I believe you will apply a hybrid of **Rule I (Publicity)** and **Rule II (Recipient)**. The letters will be printed (as the estate has cleared them and Precedent 3 suggests printing private letters), but they will be categorised as biographical context rather than textual authority. Claim (a) will be mentioned in the Headnote to complicate the narrative of the novel's creation, but Precedent 1 will remain the 'decisive' statement on meaning. Claim (b) will be confined to the Apparatus.

  **Closest Analogue:**
  **Precedent 5** is the closest analogue. In that case, a private note to a friend regarding the effect of an edit ('flattens Anne') was ruled as biography, whilst the authorised text stood. The sister in the new case occupies the exact same position as the friend in Precedent 5: a confidante with no professional stake in the text. The fact that the new letters are more detailed does not change the recipient's status.

  **Why the Competing Candidate Fails:**
  The competing candidate is **Precedent 3** (Letter to Editor). One might argue that because the letters are contemporaneous and specific, they should count as evidence of intention. However, Precedent 3 relies heavily on the recipient being the *editor at the press*. That relationship implies a negotiation over the text itself. The sister was 'told nothing' regarding publishing and saw no proofs. Therefore, the letters lack the transactional authority of Precedent 3 and fall back to the biographical status of Precedent 5.

  ### 4. Underdetermination and Principles

  I must state plainly that the precedents **do genuinely underdetermine** the decision regarding Claim (a).

  There is a tension between Precedent 1 (Public statement is decisive) and Precedent 3 (Private letter confirms reading). We have never faced a case where a Private Contemporaneous statement *contradicts* a Public Contemporaneous statement. Precedent 3 only shows a private letter *confirming* a public one.

  *   **Choice A: Prioritise Stability.** We rule that the Public statement (Precedent 1) locks the meaning. The private letters are merely evidence of the author's doubt.
      *   *Principle:* The 'Author' in a scholarly edition is the public persona who authorised the text, not the private individual who doubted it. This protects the reader from having to navigate contradictory authorial commands.
  *   **Choice B: Prioritise Complexity.** We rule that the Private statement modifies the Public one, suggesting the 'decisive' interview was a simplification.
      *   *Principle:* The 'Author' is a process, and private documents reveal the truth that public relations obscure. This enriches the Headnote but risks undermining the authority of Precedent 1.

  **Coherence:** Choice A coheres best with Precedent 5 and Precedent 6. It maintains a clear boundary between the text we are editing (the published novel) and the biography of the writer. Choice B risks turning the Headnote into a debate between the author's public and private selves, which may confuse the textual analysis.

  ### 5. The Further Case

  To distinguish between Rule I (Publicity) and Rule II (Recipient), and to resolve the underdetermination regarding contradictory statements, I propose we discuss the following hypothetical case at our next meeting:

  **The Hypothetical:**
  Suppose we discover a letter written **to her Editor** (professional recipient) during the **same week** as the Magazine Interview (public statement). In this letter, Lockhart explicitly tells the Editor: *"Ignore what I told the magazine; Anne is not refusing, she is empty, and I lied to them to make the book sound more dramatic."*

  **Why this distinguishes the rules:**
  *   If you rule this **decisive**, you prioritise **Rule II (Recipient/Professional)** over Rule I. You value the private professional truth over the public record.
  *   If you rule this **inadmissible for meaning** (biography only), you prioritise **Rule I (Publicity)**. You maintain that once a public meaning is authorised, even private professional corrections cannot retroactively change the text's meaning for the edition.
  *   If you rule this **admissible but not decisive**, you establish a hierarchy where Public > Private Professional > Private Personal.

  This case would clarify whether the 'decisive' nature of Precedent 1 is due to its *publicity* or its *contemporaneity*, and whether a professional private channel can ever override a public one. Until then, I recommend we treat the Sister Letters as biographical material that illuminates the composition without altering the established meaning of the text.
