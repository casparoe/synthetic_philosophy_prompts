answer: |-
  This is a high-pressure, low-resource environment. You need a procedure that is defensible, repeatable, and protects the panel from becoming a political punching bag. Your theory (Honor/Testify/Occupy + Load-Bearing) is strong, but it needs rigid operational definitions to survive a council meeting.

  Below is the **Commemoration Review Protocol (CRP)**. It is designed to be run in a 90-minute meeting per case. Following the protocol are the three test cases, the limitations, and the specific "handoff" points where you pass the hot potato to the Council.

  ### Part 1: The Decision Procedure (CRP v1.0)

  **Evidence Standard:** *Preponderance of Historical Record.*
  *   **Not:** Beyond a reasonable doubt (legal) or Moral Certainty (philosophical).
  *   **Is:** Is it more likely than not, based on primary sources or credible secondary consensus, that the claim is true?
  *   **Rule:** If the negative claim rests on rumor, oral history without corroboration, or single-source anonymous accounts, the procedure **STOPS**. Recommendation: *No Action.*

  **Step 1: The Honor Definition (What is this?)**
  *   **Question:** What specific act or trait was the original commemoration intended to honor?
  *   **Source:** Dedication plaque, original council resolution, founding documents.
  *   **Stop Point:** If the original intent is unknowable, default to the *most general* interpretation (e.g., "Civic Contribution").
  *   **Output:** A single sentence: *"This [object] honors [Person] for [Specific Reason]."*

  **Step 2: The Load-Bearing Test (The Causal Link)**
  *   **Question:** Is the disqualifying conduct *causal* to the honored achievement, or merely *correlated*?
  *   **Load-Bearing (Yes):** The good thing could not exist without the bad thing (e.g., philanthropy funded by exploitation; political power gained through disenfranchisement).
  *   **Incidental (No):** The bad thing happened in the same life, but did not enable the honored thing (e.g., a private prejudice that did not influence public policy; a moral failing unrelated to the professional achievement).
  *   **Output:** *Load-Bearing* OR *Incidental*.

  **Step 3: The Occupation Test (The Intrusion Level)**
  *   **Question:** How forcibly does the public interact with this commemoration?
  *   **Level 1 (Passive):** Statue, Park Bench, Building Name. (You can avoid it).
  *   **Level 2 (Active):** Street Name, School Name. (You must speak it/use it for services, mail, identity).
  *   **Output:** *Passive* OR *Active*.

  **Step 4: The Remedy Ladder**
  Match the findings from Steps 2 & 3 to the remedy.

  | Finding | Remedy | Rationale |
  | :--- | :--- | :--- |
  | **Incidental Conduct** | **Status Quo** | The honor remains valid; the flaw is human, not structural. |
  | **Incidental + Active Occupation** | **Contextualization** | Add plaque/QR code. The intrusion requires explanation, but not removal. |
  | **Load-Bearing + Passive** | **Relocation / Context** | Move to museum or add heavy context. The honor is tainted, but the history is worth preserving. |
  | **Load-Bearing + Active** | **Removal / Renaming** | The public is forced to speak/validate a lie or a harm. |
  | **Reason Expired** | **Reframing** | The honor was valid then, not now (e.g., military victory now seen as tragedy). Add context, rarely remove. |

  **Step 5: The Values Handoff (Panel vs. Council)**
  *   **Panel Jurisdiction:** Facts, Consistency, Procedure.
  *   **Council Jurisdiction:** Community Values, Political Will, Budget.
  *   **The Shield:** If the Panel recommends *Removal* based on this procedure, Council may override to *Keep* (accepting political risk). If the Panel recommends *Keep*, Council **cannot** override to *Remove* without new evidence. (This prevents witch hunts).

  ---

  ### Part 2: Running the Cases

  Here is how the CRP processes your three referrals. I have adhered strictly to the logic above. One of these will likely make you uncomfortable.

  #### Case 1: The Mill Owner (Statue)
  *   **Honor:** Philanthropy (Library/Hospital).
  *   **Conduct:** Child labor system generated the wealth.
  *   **Load-Bearing:** **YES.** The endowment is downstream of the labor system. Without the exploitation, there is no fortune; without the fortune, there is no library. The good deed is causally dependent on the bad act.
  *   **Occupation:** **Passive** (Statue).
  *   **CRP Recommendation:** **Relocation with Context.**
  *   **Action:** Move statue to the local history museum or the library basement. Install a plaque at the original site explaining the source of the wealth and the labor conditions.
  *   **Why:** You cannot honor the philanthropy without honoring the exploitation that funded it. However, erasing the statue erases the history of the labor system itself.

  #### Case 2: The Organizer (Street Name)
  *   **Honor:** Community Organizing / Local Love.
  *   **Conduct:** Private letter containing a racial slur (archival find).
  *   **Load-Bearing:** **NO.** The letter was private. There is no evidence the racism influenced his organizing work, policy goals, or treatment of colleagues. It is a character flaw, not a structural input into the honor.
  *   **Occupation:** **Active** (Street Name).
  *   **CRP Recommendation:** **Status Quo (Keep Name).**
  *   **Action:** No change.
  *   **Why:** This is the **Load-Bearing Theory's hard limit.** If you remove this name, you are punishing private thought that had no public consequence. You are shifting from reviewing *commemorations* to reviewing *character*.
  *   **The Unpopular Truth:** This is the outcome you won't like. In the current climate, a slur is often treated as an automatic disqualifier. But under *your* theory, this is incidental. If you remove this, you set a precedent that any archival dirt justifies renaming, which invites endless political digging. You will have to stand in front of the community and say, "We know he wrote this, but it didn't build the street."

  #### Case 3: The Black Councilman (School Name)
  *   **Honor:** First Black Councilman (Historical Milestone).
  *   **Conduct:** Voted against fair-housing ordinance (Public Record).
  *   **Load-Bearing:** **YES (Specific to School Context).**
      *   *Nuance:* If the honor were "First Black Councilman" (Statue), the vote is incidental to the *milestone*.
      *   *However:* A **School Name** is not just a historical marker; it is a **Moral Exemplar** for children. The honor implies "This is a person whose values we want students to emulate."
      *   Voting against fair housing is a public act that caused material harm to the community the school serves. That conduct is load-bearing to his role as a *Councilman*, which is the office he held when honored.
  *   **Occupation:** **Active** (School Name).
  *   **CRP Recommendation:** **Renaming.**
  *   **Action:** Rename the school after a figure whose values align with the school's mission. Install a prominent historical display in the lobby honoring the Councilman's milestone achievement ("The First") while honestly recounting his voting record.
  *   **Why:** This distinguishes between **History** (which belongs in a display) and **Honor** (which belongs on the marquee). You can acknowledge his historical significance without forcing students to identify with his policy failures.
  *   **The Risk:** This will be accused of erasing Black history. Your defense is that you are preserving the *history* (in the lobby) while removing the *honor* (the name).

  ---

  ### Part 3: What This Procedure Cannot Do

  You asked for honesty on limitations. Here is where the CRP fails:

  1.  **It Cannot Heal Trauma:** A plaque explaining child labor does not make the descendants of those children feel better about the statue. The procedure is logical; grief is not.
  2.  **It Cannot Handle "Reason Expired" Well:** If a statue honors a "Great War Hero," and the community later decides the war was unjust, the CRP struggles. The conduct (fighting) *was* load-bearing to the honor. The procedure might demand removal, but the historical value remains. This requires a "Values Handoff" to Council immediately.
  3.  **It Relies on Archives:** The CRP favors the documented. It will systematically disadvantage marginalized groups whose history was not written down (oral traditions fail the Evidence Standard). You need a waiver for "Community Consensus History" where records are scarce, or you will perpetuate historical silences.
  4.  **It Cannot Stop the Council:** If the Council wants to remove the Black Councilman's name for *political* reasons (not procedural), they will find a way. If they want to keep the Mill Owner because his grandson is a donor, they will override you. The "Shield" (Step 5) is only as strong as the Council's fear of bad press.

  ### Summary of the "Unpopular" Outcome
  I flagged **Case 2 (The Organizer)** as the one you might hate.
  *   **Why:** It requires you to defend a street name where a slur exists in the record.
  *   **The Defense:** "Our job is not to purify history. Our job is to judge the link between the deed and the honor. His racism did not build this street. His organizing did. We keep the name, we tell the truth in a plaque, and we refuse to punish private thought that had no public victim."

  If you cannot stomach that, your theory needs to change to prioritize **Occupation** over **Load-Bearing**. If you do that, Case 2 becomes a Removal, but you open the door to Case 3 becoming a Removal for much weaker reasons. You have to choose which principle breaks first.
