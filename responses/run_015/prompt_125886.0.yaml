      *   They draft a "Funding Charter" (criteria for giving money).
      *   Over time, the Committee Members (roles) change, and the Charter Clauses change.
      *   Stake: If they maintain identity, they "approve" the grant. If not, the grant is "void."

      *Actually, keep it meta.* The workshop *is* the object.
      *   Activity Name: "The Theseus Protocol."
