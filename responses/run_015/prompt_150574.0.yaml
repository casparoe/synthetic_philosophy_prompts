      *   *Soft Spots:* Must be honest. E.g., "I don't have the math yet" or "This relies on a meta-ethical assumption."

  5.  **Addressing Specific Constraints:**
      *   *Concession:* Admit lack of calibrated metric.
      *   *Non-Concession:* Do not admit gradation collapses to binary.
      *   *The Dreaded Question:* Usually the one that exposes the normative gap. "Why should I care about prediction error?"

  6.  **Drafting the Content (incorporating audience jargon):**
