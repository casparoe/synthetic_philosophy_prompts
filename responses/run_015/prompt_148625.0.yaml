answer: |-
  # Consortium Mechanism Evaluation Protocol (C-MEP)
  **Purpose:** To evaluate whether a proposed resource allocation mechanism is strategy-proof (immune to strategic misreporting) given the Consortium's constraints ($\ge 3$ projects, partial rankings allowed, non-dictatorial, unrestricted domain).
  **Time Allocation:** 45 Minutes.
  **Participants:** Board Members (Economics/Philosophy Background).

  ### Phase 1: Structural Screening (15 Minutes)

  **Q1. The "Three-Option" Test**
  *   **Question:** In the worst-case scenario, are there at least three distinct projects competing for the compute pool that could plausibly win?
  *   **Sufficient Answer:** **Yes.** (If No, the Gibbard-Satterthwaite impossibility does not apply; proceed to Q4).
  *   **Stopping Rule:** If **Yes**, proceed to Q2.

  **Q2. The "Single-Voice" Test (Dictatorship Check)**
  *   **Question:** Is there any single voter (Lab) whose strict preference for a project guarantees that project wins, regardless of how all other voters rank the options?
  *   **Sufficient Answer:** **No.** (The Consortium constraint requires the mechanism to be non-dictatorial. If Yes, the mechanism is Strategy-Proof but violates Consortium Constraints).
  *   **Stopping Rule:**
      *   If **Yes**: **STOP. REJECT.** (Technically Strategy-Proof, but Constitutionally Invalid).
      *   If **No**: Proceed to Q3.

  **Q3. The "Determinism" Test**
  *   **Question:** Does the mechanism produce a single, certain winner for every valid profile of partial rankings, or does it employ a lottery/randomization step to resolve ties or cycles?
  *   **Sufficient Answer:** **Deterministic.** (It picks a specific winner without chance).
  *   **Stopping Rule:**
      *   If **Deterministic**: **STOP. REJECT.** (See *Theoretical Impossibility Note* below).
      *   If **Randomized**: Proceed to Phase 2.

  > **Theoretical Impossibility Note (For Board Reference):** Under the conditions established in Q1 (3+ options) and Q2 (Non-dictatorial), any *deterministic* mechanism with an unrestricted domain is mathematically proven to be manipulable (Gibbard-Satterthwaite Theorem). No amount of design tweaking can fix this. If Q3 is Deterministic, the mechanism is vulnerable to strategic lying.

  ### Phase 2: Randomization & Complexity Audit (20 Minutes)

  **Q4. The "Random Dictator" Test**
  *   **Question:** If the mechanism uses randomization, is the randomness *only* used to select which single voter becomes the dictator for that round (e.g., "Pick a Lab at random, they decide")?
  *   **Sufficient Answer:** **Yes.**
  *   **Stopping Rule:**
      *   If **Yes**: **REFER TO HUMAN JUDGMENT.** (This is technically Strategy-Proof, but may violate the "Non-dictatorial" constraint depending on whether the Board accepts *ex-ante* fairness vs. *ex-post* control).
      *   If **No**: Proceed to Q5.

  **Q5. The "Constructible Lie" Test**
  *   **Question:** Can the Board construct a simple scenario with 3 projects (X, Y, Z) and 3 Voters where Voter 1 gets a better outcome by ranking Y > X instead of their true X > Y? (Focus on the tie-breaking or cycle-resolution rule).
  *   **Sufficient Answer:** **No manipulation found in 10 minutes.**
  *   **Stopping Rule:**
      *   If **Manipulation Found**: **STOP. REJECT.**
      *   If **No Manipulation Found**: **REFER TO HUMAN JUDGMENT.** (Risk of False Negative: Manipulation may exist but be computationally complex).

  ### Phase 3: Final Classification (10 Minutes)

  **Q6. The "Epistemic-Abstention" Loophole**
  *   **Question:** Does the mechanism allow voters to declare "I don't know" (abstention) in a way that *removes* an option from the domain rather than tying it?
  *   **Sufficient Answer:** **No.** (The prompt specifies abstention is treated as a tie/weak order, not domain restriction).
  *   **Stopping Rule:**
      *   If **No**: Confirm Phase 1 & 2 findings.
      *   If **Yes**: **REFER TO HUMAN JUDGMENT.** (This restricts the domain, potentially escaping the impossibility theorem, but requires expert verification).

  ---

  # Application to Proposed Mechanisms

  ### Mechanism A: Pairwise Majority with Borda Fallback
  *   **Q1 (3+ Options):** **Yes.** (3-5 projects).
  *   **Q2 (Dictator):** **No.** (Majority rule is non-dictatorial).
  *   **Q3 (Determinism):** **Deterministic.** (Condorcet winner or Borda count yields a specific winner).
  *   **Procedure Verdict:** **STOP. REJECT.**
  *   **Board Action:** The mechanism fails at Q3. Because it is deterministic, non-dictatorial, and handles $\ge 3$ options, it is mathematically guaranteed to be manipulable. The Borda fallback is particularly vulnerable to "cloning" or "burying" strategies.
  *   **Reasoning:** The Gibbard-Satterthwaite theorem applies directly. The allowance of partial rankings (ties) does not rescue deterministic social choice functions from manipulability when a strict winner must be chosen.

  ### Mechanism B: Rotating Dictatorship with Transparency
  *   **Q1 (3+ Options):** **Yes.**
  *   **Q2 (Dictator):** **Yes.** (In any given quarter, the designated Lab's strict ordering breaks all ties and decides the winner).
  *   **Procedure Verdict:** **STOP. REJECT.** (Constitutionally Invalid).
  *   **Board Action:** The procedure identifies this as a Dictatorship at Q2.
  *   **Technical vs. Ethical Conflict:** Technically, this mechanism **is Strategy-Proof**. A dictator has no incentive to lie, and non-dictators have no power to influence the outcome, so truth-telling is a weakly dominant strategy for everyone. However, it violates the Consortium's third constraint ("mechanism must be non-dictatorial").
  *   **Highlight:** **This is the politically unacceptable case.** The Board must reject a mechanism that solves the manipulation problem because it concentrates too much power in one Lab per quarter, violating the consortium's governance ethos.

  ### Mechanism C: The Humble-Aggregation Proposal
  *   **Q1 (3+ Options):** **Yes.**
  *   **Q2 (Dictator):** **No.** (Outcome depends on intersection of all preferences).
  *   **Q3 (Determinism):** **Randomized.** (Selects randomly among top-cycle members).
  *   **Q4 (Random Dictator):** **No.** (Randomizes among *projects*, not *voters*).
  *   **Q5 (Constructible Lie):** **Manipulation Found.** (Voters can withhold strict preferences to shrink the intersection, altering the "top-cycle" pool to favor their preferred project).
  *   **Procedure Verdict:** **STOP. REJECT.**
  *   **Board Action:** The mechanism fails at Q5. The description itself admits voters can "strategically withhold preferences." This is a direct admission of manipulability. Randomization does not guarantee strategy-proofness unless it is a Random Dictatorship (which this is not).

  ---

  # Limitations & Boundary Conditions

  ### 1. The False-Negative Risk
  The C-MEP relies on the Board's ability to construct a "lie" in Q5. If a mechanism is manipulable only through complex, multi-step coalitional strategies or requires solving a hard optimization problem to find the beneficial lie, the Board may answer "No manipulation found."
  *   **Risk:** The Board approves a mechanism as "Safe" when it is actually "Computationally Manipulable."
  *   **Mitigation:** Any mechanism passing Q5 without being a Random Dictatorship must be referred to an external computational auditor.

  ### 2. The Undecidable Class (Computational Hardness)
  There exists a class of mechanisms where manipulation is theoretically possible but **NP-Hard** to compute (e.g., certain ranking aggregation rules like Kemeny-Young).
  *   **Boundary:** The C-MEP cannot distinguish between a *Strategy-Proof* mechanism and a *Computationally-Safe* mechanism.
  *   **Requirement:** Full formal proof or complexity analysis is required here. The checklist must **Refer to Human Judgment** for any mechanism claiming "manipulation is too hard to compute."

  ### 3. The Domain Restriction Loophole
  The Gibbard-Satterthwaite theorem assumes an *unrestricted domain*. If a mechanism effectively restricts the domain (e.g., by rejecting profiles that aren't "single-peaked"), it *can* be strategy-proof.
  *   **Boundary:** Q6 attempts to catch this. If the mechanism treats "abstention" as "removing the option" rather than "tying the option," it restricts the domain.
  *   **Requirement:** This requires expert judgment to verify if the restriction is robust or easily bypassed by voters.

  ### 4. Divisibility vs. Discrete Choice
  The C-MEP assumes the compute pool is allocated as a discrete winner (Project X gets 100%). If the pool is *divisible* (e.g., Project X gets 40%, Y gets 60%), the Gibbard-Satterthwaite theorem does not apply directly (though other impossibility results might).
  *   **Boundary:** If the mechanism outputs a division of resources rather than a winner, the Q3 "Determinism" stop rule is invalid.
  *   **Requirement:** Refer to Human Judgment for proportional allocation mechanisms.

  \answer{The irreducible judgment point lies in distinguishing between mechanisms that are truly strategy-proof and those where manipulation is merely computationally infeasible, requiring expert audit beyond the board's checklist capacity.}
