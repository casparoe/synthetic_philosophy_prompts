  Here is the breakdown of your colleague's ethical framework, the prediction for your next case, and the strategic move for your seminar prep.

  ### 1. The Diagnosis: Critical-Level Utilitarianism
  Your colleague is almost certainly running a version of **Critical-Level Utilitarianism (CLU)**.

  Here is why the other standard candidates fail:
  *   **Total Utilitarianism:** Ruled out by her third verdict. A total view would say a billion lives at +0.1 (Total: +100,000,000) crushes 1,000 lives at +100 (Total: +100,000). She rejects this.
  *   **Average Utilitarianism:** Ruled out by her first verdict. Adding a person at +95 to a population at +100 lowers the average. An average view would say the first option is better. She says the second is better.
  *   **Leximin:** Ruled out by her first verdict. The worst-off person in the first option is at +100. In the second, it is +95. Leximin would prefer the first.

  **The Rule:**
  CLU holds that a life adds value to the world only if its welfare exceeds a specific "critical level" ($c$). The value of a population is the sum of each person's welfare minus $c$.
  $$V = \sum (w_i - c)$$
  *   If $w_i > c$, the life adds positive value.
  *   If $w_i < c$, the life adds negative value (even if $w_i$ is positive).

  This fits her data perfectly:
  1.  **Mere Addition:** She accepts adding a life at +95, implying **$c < 95$**.
  2.  **Repugnant Conclusion Avoidance:** She rejects a billion lives at +0.1, implying **$c > 0.1$**. (If $c$ were lower than 0.1, the billion lives would generate massive positive value).

  ### 2. Prediction on X vs. Y
  **The Case:**
  *   **X:** 100 people at −1.
  *   **Y:** 10 people at −50.

  **The Math:**
  Under CLU, we calculate the value relative to $c$:
  *   $V(X) = 100 \times (-1 - c) = -100 - 100c$
  *   $V(Y) = 10 \times (-50 - c) = -500 - 10c$

  X is better than Y if $V(X) > V(Y)$:
  $$-100 - 100c > -500 - 10c$$
  $$400 > 90c$$
  $$c < 4.44$$

  **The Verdict:**
  I predict she will say **X is better** (100 people at −1).

  **Why?**
  While her rejection of the billion lives at +0.1 proves $c > 0.1$, it does not require $c$ to be high. A critical level of $c = 1$ is sufficient to block the Repugnant Conclusion (making the billion lives at +0.1 net negative) while still validating her Mere Addition intuition.
  If $c = 1$, she chooses X.
  For her to choose Y, her critical level must be quite high ($c > 4.44$). High critical levels are controversial because they imply that creating a life with positive welfare (e.g., at +2) makes the world *worse* than if that person never existed. Most axiologists want to avoid this implication (sometimes called the "Reverse Repugnant Conclusion"). Unless she has explicitly signaled she accepts that creating happy lives can be bad, she likely holds a low critical level.

  ### 3. Family of Rules & Parameter Space
  The family of rules fitting her first three verdicts is **Critical-Level Utilitarianism** with a parameter $c$ such that:
  $$0.1 < c < 95$$

  Within this family, the verdict on X vs. Y flips based on the location of $c$:
  *   **If $0.1 < c < 4.44$:** She chooses **X** (Minimizes total suffering/value loss).
  *   **If $4.44 < c < 95$:** She chooses **Y** (Minimizes the number of people below the critical level).

  *Note: Number-Dampened Utilitarianism is a close cousin that also fits her first three verdicts. It would also predict **X**, as it blends Total and Average views, both of which prefer X in the negative range.*

  ### 4. Where to Put Your Money
  **Bet on X.**
  It is the focal point of reflective equilibrium for most population ethicists. Choosing Y commits her to the **Sadistic Conclusion**: the claim that it is better to have a small number of people suffer intensely than a larger number of people suffer mildly. While some theorists accept this to avoid the Repugnant Conclusion, it is a much harder pill to swallow than setting a low critical level. Most colleagues who reject the Total View do so to save intuition about quality of life, not to endorse intense suffering for the few.

  ### 5. The Critical Test Case
  To definitively separate the rules still in the running (Low-$c$ CLU vs. High-$c$ CLU), you need to test her intuition on the **Empty World**. You mentioned you haven't asked her about this yet; that is your leverage.

  **Read her this pair:**
  > **Option A:** 1 person exists with welfare at +5.
  > **Option B:** Nobody exists (The Empty World).

  **Why this separates them:**
  *   **If she chooses A:** Her critical level is below +5. This makes it highly probable that $c < 4.44$, confirming she will choose **X** in your negative case. (This also aligns with Number-Dampened views).
  *   **If she chooses B:** Her critical level is above +5. This confirms $c > 4.44$, meaning she will likely choose **Y** in your negative case.

  This pair isolates the parameter $c$ without the confounding emotional weight of suffering, giving you a clean read on her theoretical commitments before you present the negative case.
