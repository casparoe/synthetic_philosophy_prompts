      *   Prioritarianism usually *accelerates* the Repugnant Conclusion because it weights the worse off more. To avoid Repugnant Conclusion, the function must be bounded *and* the population weight must be dampened (like NDUtil) or it must be CLU.
      *   Standard Prioritarianism is usually consistent with Total View in same-number cases, but in different-number cases, it often succumbs to the Repugnant Conclusion unless modified.
      *   CLU is the standard "Repugnant Conclusion Avoider" in literature (Blackorby, Bossert, Donaldson).
      *   I will stick with CLU as the primary family, acknowledging NDUtil as a close cousin that predicts X.

      *   Okay, ready.
