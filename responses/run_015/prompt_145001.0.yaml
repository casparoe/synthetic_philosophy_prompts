answer: |-
  # Activity Design: The Awakening Wager

  ## 1. Core Design Decisions & Justifications

  **Amnesia Simulation: As-If + Card Duplication**
  I recommend the **"As-If" instruction combined with physical card duplication** over spaced awakenings.
  *   **Why:** Spaced awakenings violate your constraint that "no student should be a passive observer for more than about ten minutes." With 16 students and 75 minutes, rotating students out for "sleep" creates massive downtime and logistical friction (tracking who is "asleep," ensuring no communication).
  *   **How it works:** Every student submits a guess every round. You (the Experimenter) simulate the branching. If Heads, you put **one** copy of each student's card into the scoring box. If Tails, you put **two** copies of each student's card into the box.
  *   **Pedagogic Value:** This makes the "Thirder" intuition visceral (more cards in the box = higher chance of being scored in Regime 1) without requiring actual memory loss. It shifts the uncertainty from "Did I sleep?" to "How many copies of my current decision exist in the scoring pool?"

  **Scoring Regimes & Math Check**
  You asked me to check the calculation that "every guessing policy does equally well" in Regime 2.
  *   **The Calculation:** Your intuition is correct *if* we look at **Class Aggregate Score**, but technically incorrect for **Individual Expected Utility**.
      *   *Individual Level:* In Regime 2 (one random awakening scored per round), guessing Heads is actually slightly better for an individual. Why? Because if Heads, your single card is guaranteed to be the one scored (probability $1/N$). If Tails, your card is one of two, so it has half the chance of being the one scored ($1/2N$). This selection bias favors Heads.
      *   *Class Aggregate Level:* If the *whole class* guesses Tails, they score on 50% of rounds (the Tails rounds). If the *whole class* guesses Heads, they score on 50% of rounds (the Heads rounds).
  *   **Design Choice:** To make your claim hold true in the classroom and avoid confusing game-theoretic deviations, **the payoff will be based on the Class Aggregate.** We will count how many *rounds* the class wins, not how many individual chips each student earns. This isolates the **Sampling Assumption** (Are we sampling Observer Moments or Experiments?) without the noise of individual selection bias.
  *   **Order:** Run **Regime 1 (Score All)** first, then **Regime 2 (Score One)**.
      *   *Why:* Regime 1 naturally yields the 2/3 result, aligning with the students' initial "frequency" intuition. Regime 2 breaks that intuition, forcing them to realize the scoring rule changed the question. If you run Regime 2 first, they will anchor on 50/50 and view Regime 1 as the anomaly, which is harder to map to the standard literature (where Thirder is the "puzzle" position).

  **Stretch Cases & Bookies**
  *   **Cut them.** A 10-awakening stretch case dilutes the clean 1-vs-2 ratio needed for the 1/3 vs 1/2 intuition in a short session. A student bookie adds game-theoretic complexity that distracts from the epistemic core. Stick to the two regimes; the contrast is sharp enough.

  ---

  ## 2. Activity Rules & Materials

  **Materials:**
  *   1 Coin (large, visible).
  *   16 Index Cards (pre-cut or torn) per student.
  *   1 Large Box/Bag (for scoring).
  *   1 Bag of Chocolate/Chips (currency).
  *   Projector (to display round results and running totals).
  *   Whiteboard (to track scores).

  **Roles:**
  *   **Experimenter (Instructor):** Tosses coin, manages the box, enforces rules.
  *   **Awakenees (Students):** All 16 students participate in every round.
  *   **Auditors (2 Students, rotate every 5 rounds):** Verify the coin toss and the number of cards placed in the box. (Prevents "the bag is rigged" arguments).

  **The Setup (Read to Class):**
  > "We are running an experiment. In each round, I will toss a coin.
  > *   **Heads:** The world is 'normal.'
  > *   **Tails:** The world 'duplicates.'
  >
  > You are a consciousness in this experiment. You do not know the coin result. You will write a guess (H or T) on a card.
  > *   If **Heads**: I put **1 copy** of your card in the Box.
  > *   If **Tails**: I put **2 copies** of your card in the Box.
  >
  > You are not told the result until the scoring is done. Your goal is to maximize chocolate."

  **Payoff Scheme:**
  *   **Currency:** Chocolate chips.
  *   **Regime 1 (Score All):** Every card drawn from the Box is checked. Correct = 1 chip for the student.
  *   **Regime 2 (Score One):** Exactly **one** card is drawn from the Box at random. If correct = **10 chips for the entire class** (pooled and divided equally). *Note: Switching to Class Pool is crucial to make the policies equal in EV.*

  ---

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Explain rules. Emphasize: "You don't know how many copies of your card are in the box." Appoint 2 Auditors. |
  | **05-30** | **Regime 1** | **5 Rounds (Score All).** <br>1. Students guess.<br>2. Coin toss.<br>3. Instructor places cards (1 or 2 copies).<br>4. Auditors verify count.<br>5. Draw *all* cards, score them.<br>6. Project results. <br>*Expected Outcome:* Tails guesses win ~66% of chips. |
  | **30-35** | **Pause & Predict** | Stop. Ask: "If we change the rule so only *one* card per round is scored, does your strategy change?" Take a show of hands. |
  | **35-60** | **Regime 2** | **5 Rounds (Score One).** <br>Same procedure, but draw only **one** card per round. <br>**Crucial:** Payoff goes to the *Class Pool*. <br>*Expected Outcome:* Heads and Tails strategies yield ~50% win rate each. |
  | **60-65** | **Small Group** | Groups of 4. Question: "Why did the winning strategy change? Did the coin change? Did *you* change?" |
  | **65-75** | **Debrief** | Lecture connecting activity to Sleeping Beauty, Halfer/Thirder, and Self-Locating Belief. |

  ---

  ## 4. The Debrief Script & Strategy

  **Mapping the Activity to the Literature (65-70 mins)**
  *   **The Thirder Pull:** Point to Regime 1. "In Round 3, Tails won twice as many chips. Why? Because there were twice as many 'you's' in the box. This is the Thirder argument: *I should reason as if I am a random sample from all awakenings.* Since 2/3 of awakenings are Tails, I should believe Tails."
  *   **The Halfer Pull:** Point to Regime 2. "Here, Tails didn't help. Why? Because we sampled *Rounds*, not *Awakenings*. In half the rounds the coin was Heads. You knew you'd be woken regardless. No new info about the coin. This is the Halfer argument: *My credence in the coin should not move.*"
  *   **The "Same Question?" Insight:** "You felt pulled both ways. That's because Epistemology asks 'What should I believe?' but Decision Theory asks 'What should I bet?' Regime 1 rewarded betting on frequency. Regime 2 rewarded betting on the coin. They might be different questions."

  **Handling Objections**
  *   **The "Bag Assumption" Objection:** *Student:* "Drawing slips from the box assumes we should sample observer-moments uniformly. That begs the question against the Halfer."
      *   *Response:* "Exactly. The Thirder position *requires* the Self-Sampling Assumption (SSA). The Halfer rejects it. The activity didn't prove Thirder is right; it proved that *if* you accept the box as a model of your epistemic situation, Thirder follows. The debate is whether the box is the right model."
  *   **The "Just Counting" Objection:** *Student:* "This was just about how many cards you put in the bag. It's not about belief."
      *   *Response:* "Decision theory reveals belief. If you truly believed Heads and Tails were equally likely *and* you cared about being right, you should have guessed Tails in Regime 1. The fact that you felt compelled to guess Tails shows your 'belief' is sensitive to the number of observers. That *is* self-locating belief."

  **Honest Limitations (70-75 mins)**
  *   **The "Me" Problem:** "In this room, when I put two cards in for Tails, it was Alice-1 and Alice-2. In Sleeping Beauty, it is *Alice* and *Alice*. We simulated the *structure* of duplication, but we could not simulate the *first-personal identity*. You didn't feel the weirdness of being the same person twice. That is the deepest limitation: we can model the math of self-location, but not the phenomenology."
  *   **The Amnesia Gap:** "You knew you were in a classroom. Beauty knows she is in a room. But you knew you didn't lose your memory. Real self-locating belief requires that you cannot index yourself by time. We faked that with rules. Real SB is about what happens when the fake rules are reality."

  ---

  ## 5. Predictable Failure Points & Mitigation

  **1. The "Bag Rigging" Argument (20-minute collapse risk)**
  *   **Risk:** Students spend 20 minutes arguing that putting 2 cards in the box artificially inflates the probability of Tails.
  *   **Mitigation:** **Transparency.** Use the Auditors. When Tails comes up, visibly duplicate the cards in front of the class. Say: "The world duplicated. There are now two instances of your decision. If we score every instance (Regime 1), Tails wins more. This isn't rigging; it's the definition of the Tails world." If they persist, concede: "The Halfer says ignore the extra card. The Thirder says count it. We are testing which rule pays out."

  **2. Passive Observers in Regime 2**
  *   **Risk:** Students disengage in Regime 2 because the individual payout feels random.
  *   **Mitigation:** **Class Pool Payoff.** Make it "10 chips for the class." This forces them to coordinate. Ask them: "Discuss with your neighbor: Should we all switch to Heads to maximize the class pot?" This keeps the game-theoretic engagement high.

  **3. Confusion on Regime 2 Math**
  *   **Risk:** A sharp student notices that *individually* guessing Heads is better in Regime 2 (due to selection bias) and claims the activity is broken.
  *   **Mitigation:** **Pre-empt this in the briefing.** "In Regime 2, we are scoring the *Class Strategy*. We want to know if a world of Thirders or a world of Halfers accumulates more chocolate over time." This frames the metric correctly (Reference Class: Experiments vs. Observer Moments).

  ---

  ## 6. Decisions I Am Least Sure About (For Piloting)

  1.  **Card Duplication Visibility:** I chose to make the duplication *public* (Auditors verify) after the guess.
      *   *Uncertainty:* Does this destroy the "uncertainty"?
      *   *Defense:* No, they don't know the *result* before guessing. They only see the duplication after. This preserves the betting uncertainty while validating the frequency intuition. *Pilot Note:* Watch if students feel the post-reveal duplication "cheats." If so, switch to having them submit 2 cards blindly on Tails rounds (but they won't know it's Tails). *Correction:* They can't submit 2 cards if they don't know it's Tails. Stick to Instructor duplication. It's the only way to simulate the branching without amnesia.
  2.  **Class Pool vs. Individual Payoff in Regime 2:**
      *   *Uncertainty:* As noted in the math check, Individual EV favors Heads in Regime 2. Class EV is equal.
      *   *Defense:* I am committing to **Class Pool**. It aligns with the prompt's goal ("every guessing policy does equally well"). If you use Individual Payoff, students will converge on Heads, and you lose the "Indifference" lesson. *Pilot Note:* Ensure the "Class Pool" rule is written on the projector in big letters during Regime 2.

  This design commits to the **Structural Simulation** (via card duplication) over the **Phenomenological Simulation** (via amnesia) to satisfy the time and engagement constraints. It sacrifices the "feeling" of memory loss to secure the "logic" of the sampling dispute.
