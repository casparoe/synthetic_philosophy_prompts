answer: |-
  **Elena:** The proposal is straightforward. We double the panel size from ten to twenty reviewers per grant. The Condorcet Jury Theorem gives us the theoretical backbone: if every reviewer is more likely than not to identify a worthy proposal—say, competence $c > 0.5$—and their judgments are independent, the probability of a correct majority decision converges to one as $n$ increases. It is the cheapest reform available. We don't need new criteria; we just need more eyes.

  **Marcus:** The theorem is elegant, Elena, but it hangs entirely on the independence assumption. In our current system, independence is a fiction. Let me propose a concrete model of the dependence we actually face. Suppose each reviewer, with probability $\lambda$, arrives at an independent judgment correct with probability $c$. But with probability $1-\lambda$, they defer to a lead reviewer—the one who spoke first in the discussion, or the most senior name on the list—whose judgment is correct with probability $d$.

  **Elena:** A standard common-value model. But why does that stop us from scaling?

  **Marcus:** Because of the math of the bloc. If $\lambda \le 0.5$, the deferrers constitute the majority. They vote identically to the lead reviewer. The independent reviewers are outnumbered. No matter how large $n$ becomes, the majority vote simply mirrors the lead reviewer's vote. The panel's accuracy is capped at $d$, the lead's competence. Adding bodies just adds weight to the deferring bloc. The lever that matters isn't $n$; it's raising $\lambda$. We need to break the deference, not dilute it.

  **Elena:** I grant the algebra: if $\lambda$ is fixed and below the threshold, the cap holds. But you're treating $\lambda$ as a structural constant of human nature. It's not; it's a design variable. If we add reviewers from disparate institutions who don't know the lead, or if we enforce blind voting before discussion, $\lambda$ rises. Furthermore, your model assumes a single dictator. Real correlation is graded and multi-centered. Reviewers cluster around different paradigms, not just one person. If we enlarge the panel, we dilute the weight of any single cluster.

  **Marcus:** Dilution assumes the new reviewers bring independent signal. But consider the cost of de-correlation. To raise $\lambda$, you often have to isolate reviewers—no discussion, no pooling of evidence. If Reviewer A spots a methodological flaw and Reviewer B has the domain expertise to confirm it, forbidding that interaction to preserve "independence" sacrifices the gains from pooled evidence. You get independent errors, yes, but you also get independent ignorance.

  **Elena:** And deference transmits expertise, I agree. If the lead is an expert, deference is rational. But on this committee, the "lead" is often just the most vocal, not the most competent. If $d$ is low, your model proves we should shrink the panel to a single expert, not maintain a correlated bloc. But there's a deeper issue with the CJT we both need to address: the competence parameter $c$. The theorem requires $c > 0.5$.

  **Marcus:** Agreed. And that is where the selection bias kills us. The easy proposals—the obvious successes and the fatal flaws—are filtered out by staff before they ever reach a vote. We are left with the borderline cases. On these hardest proposals, it is entirely possible that $c < 0.5$. The signal is so noisy that reviewers are systematically worse than chance. If $c < 0.5$, the CJT inverts: as $n$ grows, the probability of a correct decision converges to zero. You aren't averaging out noise; you're amplifying systematic error.

  **Elena:** That's a risk, but it's an argument for better training, not smaller panels. If the summary is misleading, ten people will be misled the same way. Twenty people might include three who read the supplementary data. But let's return to your dependence model. You assume $c$ is constant. I argue $c$ is a function of $n$. In a large panel, an individual's pivotality drops. Rational reviewers exert less effort when their vote is less likely to change the outcome.

  **Marcus:** Precisely. That is the free-rider problem. As $n$ rises, the probability of being pivotal approaches zero. Effort drops, and $c(n)$ drags down. You might gain statistical power from $n$, but you lose signal quality from $c$. My model accounts for the correlation; yours assumes away the incentive structure. If we double the panel, we might halve the effort per proposal. The net accuracy could plummet.

  **Elena:** I concede the incentive problem is real. But you're assuming the only way to get independence is isolation. We can structure the vote to record initial impressions before any lead voice emerges. That preserves the pooled evidence *after* the independent commitment. However, I will grant your point on the "hard cases." If the pool reaching us is negatively selected for difficulty, we need to know if our reviewers are actually tracking truth or just shared bias.

  **Marcus:** Which brings us to the impasse. You believe the bottleneck is correlation; I believe it is competence decay and selection bias. We can argue priors all day, but we need to look at the body's own past decisions.

  **Elena:** Fine. To settle this, I need to measure the **average pairwise correlation of reviewer errors**, conditional on proposal difficulty. If the residuals are truly independent after controlling for observable features, your $\lambda$ is effectively 1, and I win. If they are highly correlated, you win.

  **Marcus:** And why is that hard?

  **Elena:** Because we don't know the errors. To calculate an error, we need the ground truth of which grants *actually* succeeded. But grant success is noisy, long-term, and confounded by the funding itself. We can't observe the counterfactual performance of the rejected proposals. We are trying to measure correlation in errors without knowing what the truth is.

  **Marcus:** A valid difficulty. My requirement is different. I need to measure the **elasticity of individual reviewer competence with respect to panel size**. I need to know how much $c$ drops when we move from $n=10$ to $n=20$. If $c$ is stable, your scaling works. If $c$ decays rapidly, your reform fails.

  **Elena:** And the obstacle?

  **Marcus:** We have never experimentally varied panel size. Historically, $n$ has been fixed at ten. We have no variation in the independent variable to estimate the slope. We would need to run a randomized control trial on current grants, which risks fairness, or rely on noisy natural experiments that don't exist.

  **Elena:** So you want a variable we haven't manipulated, and I want a truth we haven't observed.

  **Marcus:** It appears we are both voting to fund a pilot study.

  **Elena:** I'll second that motion. But I'm still voting for twenty reviewers in the pilot.

  **Marcus:** And I'll vote for ten, with blind pre-votes. We'll see whose model breaks first.
