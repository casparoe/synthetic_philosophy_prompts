          *   Elena counters: $\lambda$ isn't structural, it's designable. Also, correlation isn't binary (lead reviewer). It's a network.
          *   Marcus counters: Effort/pivotality. If $n$ grows, individual impact shrinks, $c$ drops.
      *   **The Competence Issue:**
