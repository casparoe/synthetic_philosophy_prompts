      *   **Context:** Redesigning decision rules for a large grant-funding body. Current system: Simple majority vote among $n$ reviewers based on a 2-page summary.
      *   **Aggregator's Argument:** Enlarge panels. Invoke Condorcet Jury Theorem (CJT). If $p > 0.5$ and independent, accuracy $\to 1$ as $n \to \infty$. Cheapest reform.
      *   **Skeptic's Argument:** Independence is the key assumption. Proposes a specific dependence model:
          *   Prob $\lambda$: Independent judgment (correct w/ prob $c > 0.5$).
          *   Prob $1-\lambda$: Defer to lead reviewer (correct w/ prob $d$).
          *   Claim: If $\lambda \le 0.5$, majority accuracy capped at $d$ regardless of $n$. Deferrers vote as a bloc. Need to raise $\lambda$, not $n$.
      *   **Required Rebuttals/Nuances:**
          *   *Aggregator:* $\lambda$ isn't fixed (depends on who you add). Correlation is graded/multi-centered, not a single coin flip. Deference transmits expertise, not noise.
          *   *Skeptic:* De-correlation has costs (splitting groups sacrifices pooled evidence). Effort decreases as pivotality drops (free-rider problem), dragging $c$ down as $n$ rises.
          *   *Both:* Engage competence ($p > 0.5$). Hard proposals might be systematically worse than chance ($p < 0.5$). Easy cases filtered out beforehand.
      *   **Ending:** No agreement. Each names one empirical quantity needed to settle the dispute from past data and explains why it's hard to measure.

  2.  **Character Development:**
      *   **Aggregator (let's call her Elena):** Optimistic about statistical aggregation, believes in the wisdom of crowds, focuses on scaling.
      *   **Skeptic (let's call him Marcus):** Realistic about human behavior, focuses on structural dependencies and incentives, wary of naive modeling.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Elena proposes adding reviewers. Marcus pushes back immediately with the dependence model.
      *   **The Core Mathematical Dispute:**
