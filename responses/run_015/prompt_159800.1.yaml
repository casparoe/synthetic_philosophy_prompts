  5.  **Final Polish:** Check against the prompt's specific constraints (e.g., "Say which features... explains and which it leaves untouched"). Ensure the conclusion on subsidiarity is strong. (The prompt asks: "is that a reason to think the rules we actually have were never really about efficacy at all?" -> Answer: Yes.)

