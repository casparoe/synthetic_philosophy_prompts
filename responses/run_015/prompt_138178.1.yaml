  Here is the breakdown of your friend's position, the rival rule that matches her history, and the text message that will force her to pick a side.

  ### 1. The Rule She Is Running: Van Fraassen Conditionalization
  Your friend is following the solution proposed by Bas van Fraassen for the Judy Benjamin problem. In the literature, this is often called **Van Fraassen Conditionalization (VFC)** or updating by **Minimum Cross-Entropy**.

  **The Rule:** When you learn a conditional "If $A$, then $C$" (interpreted as $P(C|A)=1$), you should update your probabilities by **keeping the probability of the antecedent's complement ($\neg A$) fixed** at its prior value. You then preserve the relative ratios of probability within $\neg A$, and shift all the probability mass of $A$ onto the worlds where $C$ is true.

  **Why it fits her first four verdicts:**
  In all four cases you listed, the antecedent ($A$) was either "Blue" or "Red".
  *   When $A=$ Red, $\neg A=$ Blue. Her prior $P(\text{Blue})$ was 0.5. She kept it at 0.5.
  *   When $A=$ Blue, $\neg A=$ Red. Her prior $P(\text{Red})$ was 0.5. She kept it at 0.5 (which implies $P(\text{Blue})$ stayed 0.5).

  Because the priors for Blue and Red were equal (0.5), and the antecedents aligned with the Color partition, **VFC is indistinguishable from simply "keeping the Color totals fixed."**

  **The Verdict on the New Case:**
  *   **Message:** "If 2nd Company ($C_2$), then Red."
  *   **Antecedent ($A$):** 2nd Company (Blue 2nd + Red 2nd). Prior $P(A) = 0.2 + 0.35 = 0.55$.
  *   **Complement ($\neg A$):** HQ/1st Company (Blue HQ + Red 1st). Prior $P(\neg A) = 0.3 + 0.15 = 0.45$.
  *   **VFC Application:** She must keep $P(\neg A)$ fixed at **0.45**.
      *   Inside $\neg A$, the ratio of Blue HQ to Red 1st is preserved (0.3 : 0.15, or 2:1).
      *   So, new $P(\text{Blue HQ}) = \frac{2}{3} \times 0.45 = 0.3$.
      *   The conditional rules out Blue 2nd, so $P(\text{Blue 2nd}) = 0$.
      *   **Total Blue Probability:** $0.3 (\text{HQ}) + 0 (\text{2nd}) = \mathbf{0.3}$.

  So, if she is consistent with her previous logic, she **must drop to 0.3**.

  ### 2. The Rival Rule: Salient Partition Invariance
  There is another rule that fits her first four verdicts perfectly but gives a different answer here. Let's call it **Color-Partition Invariance**.

  **The Rule:** The "Blue vs. Red" partition is epistemically privileged. No conditional message should change the total probability of being in Blue or Red territory, unless a specific Blue or Red quadrant is explicitly ruled out as impossible. Conditionals only shift mass *within* the Color zones.

  **Why it fits the first four verdicts:**
  Since the first four messages were "If Blue..." or "If Red...", shifting mass within those zones naturally kept the Color totals constant. It is empirically equivalent to VFC on that specific dataset.

  **The Verdict on the New Case:**
  *   **Message:** "If 2nd Company, then Red."
  *   **Constraint:** Blue 2nd is ruled out ($P=0$).
  *   **Invariance:** $P(\text{Blue})$ must remain **0.5**.
  *   **Adjustment:** To keep Blue at 0.5 when Blue 2nd is 0, Blue HQ must absorb the lost probability (rising from 0.3 to 0.5).
  *   **Total Blue Probability:** **0.5**.

  ### 3. The Text Message
  To tell these rules apart, you don't even need to ask about the "If 2nd then Red" case (where the difference is 0.3 vs 0.5). You should ask about the **mirror image**, because the divergence is much more dramatic and harder to ignore.

  **Send her this:**
  > "Okay, I think I see your rule. But tell me this: If the radio says 'If you're in 2nd Company territory, you're in Blue territory,' does your confidence that you're in Blue jump to 85%, or does it stay at 50%?"

  **Why this works:**
  *   **If she says 85% (0.85):** She is committed to **Van Fraassen Conditionalization**.
      *   *Math:* $P(\neg \text{2nd}) = 0.45$ (fixed). Blue HQ gets 0.3 of that. The whole 2nd Company mass (0.55) moves to Blue 2nd. Total Blue = $0.3 + 0.55 = 0.85$.
  *   **If she says 50% (0.5):** She is committed to **Color-Partition Invariance**.
      *   She treats the Color line as a hard constraint that conditionals cannot cross.

  ### 4. Is the 0.85 Result a Reductio?
  You asked if the 0.85 verdict is "nuts" and whether it kills her approach.

  **The Intuition (Your Side):**
  Yes, it feels like a *reductio ad absurdum*. If you learn "If 2nd Co, then Blue," and you know that 2nd Co is *mostly* Red (0.35 Red vs 0.2 Blue), common sense suggests you should think it's *less* likely you are in 2nd Co territory. Yet VFC says your probability of being in 2nd Co ($A$) stays exactly the same (0.55). It makes the agent immune to evidence about the antecedent contained in the conditional.

  **Her Reply (The Van Fraassen Defense):**
  If she is a true Van Fraassenian, she will not blink. Her reply will be:
  1.  **Conditionals are not facts:** The message $A \to C$ is a constraint on *ratios* ($P(C|A)=1$), not a factual claim about the world that eliminates $A$-worlds.
  2.  **Minimal Information:** To change $P(A)$ would be to add information you didn't receive. You were told about the *link* between 2nd Co and Blue, not about the *location* of 2nd Co. Changing $P(A)$ would violate the principle of minimum information gain (MinXent).
  3.  **The "Nuts" Intuition is a Trap:** The intuition that $P(A)$ should drop comes from confusing the conditional with the material conditional ($A \supset C$). If you conditionalized on the material conditional, you *would* get a different number, but van Fraassen argues that is the wrong way to process conditional commands.

  **Summary:**
  If she accepts 0.85, she is a rigorous Van Fraassenian (and accepts the counter-intuitive costs). If she rejects 0.85, she is actually running **Color-Partition Invariance**, which means her verdict on the "If 2nd then Red" case should be **0.5**, not 0.3.
