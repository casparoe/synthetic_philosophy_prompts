prompt: |-
  Something I keep going back and forth on and would like help getting straight.

  A bunch of the debate spaces I hang around in have a rule that you're not allowed to attack a position until you've stated it back in a version the person who holds it would agree to. The strong version says you should be able to set out the other side's case well enough that someone reading it cold couldn't tell which side you're on, and some places treat passing that test as a precondition for having an opinion worth hearing at all. I think the same idea shows up in fancier settings too, like citizens' assemblies where the background booklet is supposed to be signed off on by people on both sides before anyone deliberates.

  Meanwhile the same people who enforce that rule will also tell you that you should basically never take an opponent's stated reasons at face value: look at their incentives, assume the reasoning is post-hoc, remember that they're performing for an audience. And plenty of institutions build that second attitude in — cross-examination, auditing, red-teaming, trust-but-verify.

  What I want is the implicit theory of the first practice. What does requiring charitable reconstruction actually presuppose, about what a political disagreement is and about whether the other side argues in good faith? Concretely, does it need any of these three claims, or can it get by without them: (i) the people on the other side are sincere and believe what they say; (ii) they'd move if the evidence moved; (iii) they aren't picking their framing to win rather than to be accurate. My guess is it needs less than people think — maybe refuting a weak version of a view is just uninformative, and that's the whole justification — but I'd like the real presuppositions separated from the stuff it merely goes naturally with.

  Two more things. First, the failure mode I keep seeing: the version that passes the test is often a synthetic thing nobody actually holds, a cleaned-up philosophical cousin of a position whose real support base is much messier, so you end up defeating an artifact you built yourself. Is that predictable from what the practice presupposes, or is it just people doing it badly? And second, is the first practice really in tension with the second, or does it only look that way? It feels like one assumes we share enough to recognise an accurate statement of a view when we see it, and the other assumes we dont.

  Last bit: if we swapped the implicit picture for something darker — say, that political belief is mostly identity expression and hardly moves in response to reasons — what would the practice have to turn into, or would it just get dropped?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user observes a conflict between two norms in debate/deliberation spaces.
          *   *Norm 1 (Charitable Reconstruction/Steel-manning):* You must state the opponent's position so well they agree with it (or even better, indistinguishably from their own) before attacking.
          *   *Norm 2 (Skepticism/Realism):* Don't take stated reasons at face value; look at incentives, post-hoc rationalization, audience performance.
      *   **Goal:** Uncover the *implicit theory* behind Norm 1. What does it presuppose about disagreement and good faith?
      *   **Specific Questions:**
          1.  Does Norm 1 require claims (i) sincerity, (ii) responsiveness to evidence, (iii) accuracy-seeking framing? Or is it just about avoiding uninformative refutations?
          2.  Is the "synthetic artifact" failure mode (defeating a cleaned-up version nobody holds) predictable from the presuppositions, or just bad execution?
          3.  Is there a genuine tension between Norm 1 and Norm 2, or do they cohere?
          4.  If we adopt a "darker" view (belief as identity expression, not reason-responsive), what happens to Norm 1?

  2.  **Analyze Norm 1 (Charitable Reconstruction):**

      *   *Surface Justification:* Efficiency. Don't waste time fighting strawmen. If you defeat a weak version, you haven't defeated the actual view.
      *   *Deep Justification (Epistemic):* Truth-seeking. The best version of the argument is the hardest to kill. If it survives, we learn something.
      *   *Deep Justification (Social/Political):* Recognition. Acknowledging the other side as rational agents worthy of engagement.
      *   *Presuppositions:*
          *   There *is* a coherent "position" to be stated.
          *   Language can capture that position accurately.
          *   The interlocutor is the authority on what their position is (at least initially).
          *   There is a shared standard of "agreement" on what counts as an accurate restatement.

  3.  **Address the Three Claims (i, ii, iii):**

      *   *(i) Sincerity:* Does Norm 1 require them to believe it? Not necessarily. It requires that there *is* a version they endorse. They could be cynical advocates, but if they say "This is the argument," and you restate it, they need to say "Yes." But if they are *purely* cynical, the "position" is just a tool. Norm 1 works best if they believe it, but technically it only requires *consistency* in advocacy.
      *   *(ii) Responsiveness to Evidence:* This is crucial. If they won't move, why reconstruct? Norm 1 presupposes that *if* the argument is defeated, the position *should* be abandoned or modified. It treats the debate as truth-tracking, not just combat. So, yes, it weakly requires this.
      *   *(iii) Accuracy-seeking Framing:* This is the big one. Norm 1 assumes the stated reasons *matter*. If the framing is purely strategic (Norm 2), then reconstructing the "best argument" might be reconstructing a facade. Norm 1 tries to peel back the strategy to find the "real" argument.
      *   *User's Guess:* "Refuting a weak version is just uninformative." This is the *minimal* justification. It doesn't require good faith, only that you want to kill the *strongest* enemy. (Kill the king, not the pawn).

  4.  **Analyze the "Synthetic Artifact" Failure Mode:**

      *   *Phenomenon:* You create a philosophical ideal type (e.g., "Utilitarianism") that no actual voter/activist holds (who might just be angry or tribal).
      *   *Predictability:* Yes, it's predictable. Norm 1 assumes positions are *propositional* and *systematic*. Real politics is often *affective*, *tribal*, or *heuristic*.
      *   *Why:* The rule demands coherence. Real views are messy. To pass the test, you must clean the mess. Therefore, you create an artifact.
      *   *Verdict:* It's a structural feature, not just bad execution. The rule imposes philosophical standards on sociological realities.

  5.  **Analyze the Tension (Norm 1 vs. Norm 2):**

      *   *Norm 1:* "Here is what you say you believe." (Phenomenological/Textual)
      *   *Norm 2:* "Here is why you *really* say that." (Genealogical/Materialist)
      *   *Tension:* High. Norm 1 treats the text as authoritative. Norm 2 treats the text as suspect.
      *   *Resolution:* They operate at different levels. Norm 1 is for *internal validity* (does the argument hold?). Norm 2 is for *external validity* (why is this argument being made?).
      *   *Shared Presupposition:* Both require a shared language to even identify the disagreement. Norm 2 needs Norm 1 to establish *what* is being explained away. You can't analyze incentives unless you know what the stated position is.

  6.  **Analyze the "Darker Picture" (Identity/Signaling):**

      *   *Premise:* Beliefs are badges, not maps.
      *   *Impact on Norm 1:* It breaks Norm 1. If the goal is signaling, accuracy doesn't matter. "Steel-manning" a signal is pointless because the signal isn't meant to be true, it's meant to be *loyal*.
      *   *Transformation:* The practice would shift from "Restate the argument" to "Restate the *function*." E.g., "You are saying X to signal membership in Group Y."
      *   *Result:* Deliberation becomes negotiation or power analysis, not truth-seeking. Norm 1 gets dropped or radically redefined.

  7.  **Drafting the Response:**

      *   *Structure:*
          1.  Introduction: Acknowledge the sharpness of the observation.
          2.  The Implicit Theory of Norm 1 (The "Rationalist" Model).
          3.  Addressing the Three Claims (i, ii, iii).
          4.  The "Synthetic Artifact" Problem (Structural vs. Execution).
          5.  The Tension with Norm 2 (Complementary or Contradictory?).
          6.  The "Darker Picture" Scenario.
          7.  Conclusion.

      *   *Refining the Argument:*
          *   Make sure to distinguish between the *minimal* justification (efficiency) and the *robust* justification (epistemic cooperation).
          *   Highlight that Norm 1 treats beliefs as *propositional content*, whereas Norm 2 often treats them as *social moves*.
          *   The "Synthetic Artifact" is a category error: applying philosophical standards to political coalitions.
          *   The tension is real: Norm 1 requires a "view" to exist independently of the speaker's incentives. Norm 2 says the view is *constituted* by the incentives.

      *   *Self-Correction during drafting:* I need to be careful not to just say "Norm 1 is good." The user is asking for the *presuppositions*. I need to be analytical.
      *   *Key Insight:* Norm 1 presupposes that the *argument* is separable from the *arguer*. Norm 2 says they are inseparable.
      *   *Key Insight on the "Three Claims":* The user asks if it *needs* them. I should argue it needs a *functional equivalent* of them, even if not the literal psychological states. It needs the *behavior* of sincerity, even if the internal state is absent.

  8.  **Final Polish:** Check tone. Keep it intellectual, precise, and direct. Avoid platitudes. Ensure all parts of the prompt are answered. (The prompt is sophisticated; the answer must match that level).

      *   *Check:* Did I answer the specific question about (i), (ii), (iii)? Yes.
      *   *Check:* Did I address the "synthetic artifact"? Yes.
      *   *Check:* Did I address the tension? Yes.
      *   *Check:* Did I address the "darker picture"? Yes.

      *(Self-Correction on the "Three Claims")*: Actually, looking closer, Norm 1 *doesn't* strictly require (i) sincerity. A lawyer can argue a case they don't believe. But it requires that the *case* is coherent. However, in *political* debate (unlike law), the "position" is usually tied to the person's identity. So (i) becomes more relevant. I will nuance this.
      *(Refining the "Darker Picture")*: If beliefs are identity, Norm 1 becomes "State the identity signal clearly." But that's not debate, that's anthropology. So Norm 1 dissolves.

      *Let's write.*
answer: |-
  This is a sharp dissection of a specific epistemic culture. You have identified a friction point between **procedural rationality** (Norm 1: state the view charitably) and **critical realism** (Norm 2: interrogate the motives behind the view).

  Here is the breakdown of the implicit theory behind Norm 1, its structural failure modes, its relationship with Norm 2, and its fate under a darker anthropology.

  ### 1. The Implicit Theory of Charitable Reconstruction

  The practice of requiring a "steelman" or charitable reconstruction presupposes a **Propositional Model of Disagreement**.

  In this model, a political disagreement is essentially a mismatch in map-making. Two parties are trying to describe the same territory (policy outcomes, moral truths, social facts), and they have arrived at different coordinates. The goal of debate is to compare the maps to see which one corresponds better to the territory.

  For this practice to function as more than a hollow ritual, it relies on three specific presuppositions, though not necessarily the psychological ones you listed.

  **Regarding your three claims:**

  *   **(i) Sincerity:** Norm 1 does *not* strictly require that the opponent internally believes the proposition. It requires **advocacy stability**. It presupposes that there is a stable proposition the opponent is willing to stand behind publicly. A lawyer arguing a case they don't personally believe can still pass the charitable reconstruction test. However, in *political* debate (unlike law), the "position" is usually tethered to the person. If the person is purely cynical, the "position" is just a tool. Norm 1 breaks if the tool changes shape every time you grab it. So, it needs *consistency*, if not sincere belief.
  *   **(ii) Responsiveness to Evidence:** **Yes, this is required.** This is the strongest presupposition. If the opponent admits your reconstruction is perfect but says, "Correct, that is my view, and no amount of evidence will change it," then Norm 1 becomes pointless. The practice presupposes that the *point* of stating the view accurately is to test its durability. If the view is not falsifiable or adjustable, charitable reconstruction is just polishing a tombstone.
  *   **(iii) Accuracy-seeking Framing:** **No, this is not required, but it is the hidden trap.** Norm 1 assumes that the *reasons given* are the *reasons operative*. It presupposes that the explicit argument is the engine of the position, not the exhaust. If the framing is purely strategic (Norm 2), then reconstructing the "best version" of the argument is reconstructing a facade. Norm 1 tries to find the "real" argument inside the strategic framing. It presupposes that a coherent core exists beneath the strategy.

  **The Minimal Justification:**
  You guessed that the justification might just be "refuting a weak version is uninformative." You are right that this is the *minimal* justification, but it is insufficient to sustain the *strong* version of the rule (the "indistinguishable from their own" test).
  The strong version presupposes **Epistemic Cooperation**. It assumes that we are jointly trying to solve a problem, and that your brain contains a piece of the solution (or a valid warning) that my brain lacks. If I misstate your view, I lose access to that data. It treats the opponent as a **repository of information**, not just an obstacle.

  ### 2. The "Synthetic Artifact" Failure Mode

  You asked if defeating a cleaned-up philosophical cousin (that nobody actually holds) is predictable from the practice's presuppositions, or just bad execution.

  **It is structurally predictable.**

  Norm 1 imposes **philosophical standards of coherence** on **sociological realities of coalition**.
  *   **The Presupposition:** It assumes a "view" is a coherent set of propositions that can be logically reconstructed.
  *   **The Reality:** Most political positions are held by coalitions. The "pro-choice" or "free market" position is not a single logical structure; it is a tent housing five different incompatible justifications.
  *   **The Artifact:** To pass the "charitable reconstruction" test, you must smooth out the contradictions. You must create a version of the view that is logically consistent. But the *actual* political power of the view often lies in the contradiction (it allows the coalition to hold together).
  *   **The Result:** You defeat the coherent philosophical version. The coalition shrugs, because their power didn't come from the coherence you defeated; it came from the alliance you ignored.

  So, the failure mode isn't just people doing it badly; it's that the rule assumes politics is philosophy. It filters out the messy, affective, tribal reasons that actually drive the position, leaving you debating a ghost.

  ### 3. The Tension with Norm 2 (Skepticism)

  Is there a genuine tension between "State their view perfectly" and "Assume their reasons are post-hoc"?

  **Yes, there is a deep tension, but they can be sequenced.**

  *   **The Tension:** Norm 1 treats the **text** of the argument as authoritative. Norm 2 treats the **context** of the argument as authoritative. Norm 1 says, "Listen to what they say." Norm 2 says, "Watch what they do." If you take Norm 2 to its limit, Norm 1 becomes naive. If the reasons are post-hoc rationalizations, why spend time perfecting the rationalization?
  *   **The Coherence:** They can coexist if treated as **sequential phases**.
      1.  **Phase 1 (Norm 1):** Establish the *claimed* logic. "If we take you at your word, this is what follows." This locks the opponent into a specific justification. It prevents motte-and-bailey switching.
      2.  **Phase 2 (Norm 2):** Interrogate the *actual* logic. "You claim X, but your incentives suggest Y. Why should we trust X over Y?"
  *   **The Shared Presupposition:** Both norms require that **language has stable meaning.** Even to deconstruct someone's incentives (Norm 2), you must first agree on what claim they are making to hide those incentives (Norm 1). If we can't agree on what the position *is*, we can't analyze *why* they hold it.

  However, the tension becomes fatal if the community enforces Norm 1 as a **moral precondition** for speaking (i.e., "You can't criticize until you steelman") while simultaneously believing Norm 2 (i.e., "Their stated reasons are lies"). This creates a paradox where you must eloquently articulate a lie before you are allowed to call it a lie.

  ### 4. The "Darker Picture" Scenario

  If we swap the implicit picture for the darker view—that political belief is mostly identity expression, signaling, and coalition maintenance, and hardly moves in response to reasons—what happens to Norm 1?

  **Norm 1 would have to be dropped or radically transmuted.**

  *   **Why it breaks:** Charitable reconstruction is a truth-seeking tool. It is designed to find the strongest *argument*. If beliefs are not arguments but **badges**, then "strengthening" the belief is just making the badge shinier. There is no "territory" to map.
  *   **The Transformation:** The practice would shift from **Reconstruction** to **Translation**.
      *   *Current Norm 1:* "Here is the logical structure of your policy preference."
      *   *New Norm 1:* "Here is the social signal you are sending by holding this preference."
      *   Instead of asking, "Did I state your view accurately?" the question becomes, "Did I identify your tribe accurately?"
  *   **The New Deliberation:** Debate stops being about persuasion (moving someone via evidence) and starts being about **negotiation** (finding a modus vivendi between incompatible tribes) or **power analysis** (determining which tribe is stronger).
  *   **Institutional Impact:** Citizens' assemblies would stop trying to create "neutral background booklets" (which assume a shared factual baseline exists). They would become explicit mediation sessions where the goal is not consensus on truth, but consensus on procedure.

  ### Summary

  The implicit theory of Charitable Reconstruction is that **disagreement is a cognitive error, not a social strategy.**

  It presupposes that if we clean up the language and remove the confusion, we might find we agree, or at least find the exact point of divergence. It requires that the opponent is *capable* of moving via reasons (claim ii), even if they aren't currently sincere (claim i).

  The "synthetic artifact" failure is a feature, not a bug, of applying this theory to real politics. It cleans the mess so well it removes the life.

  The tension with Skepticism (Norm 2) is real. Norm 1 builds a model of the opponent's mind; Norm 2 suspects the model is a facade. They only work together if Norm 1 is used to **pin the opponent down** ("Is this your argument? Yes? Good.") so that Norm 2 can then **attack the foundation** ("Okay, now that we agree this is your argument, let's discuss why you're really making it.").

  If you adopt the darker view, Norm 1 becomes a category error. You don't steelman a signal; you decode it. And you don't debate signals; you negotiate with them.
