  (1) The ethical case against immigration controls

  Dummett's ethical critique of immigration controls rests on the claim that nationality is morally arbitrary. He famously analogizes modern border regimes to apartheid, arguing that both systems distribute fundamental life chances based on characteristics individuals cannot choose. Just as apartheid allocated rights and resources according to race—an accident of birth with no intrinsic moral significance—current immigration laws allocate security, wealth, and liberty according to nationality. For Dummett, the distinction between "citizen" and "alien" functions as a proxy for privilege rather than a marker of relevant moral difference. There is no natural property possessed by citizens that justifies excluding outsiders from residency or basic rights. The state's claim to exclude is essentially a claim of collective property rights over territory that overrides the human needs of non-members. This creates a global caste system where mobility and opportunity are determined by geographical lottery rather than merit or need. The burden of proof lies on those who wish to exclude to demonstrate a relevant moral difference, which Dummett argues they cannot do. The coercion involved in preventing movement is only justified if the boundary marks a morally significant distinction, which birthright nationality fails to provide. Thus, border controls are not merely policy preferences but structural injustices akin to racial segregation. Dummett insists that an accident of birth cannot carry the moral weight required to deny someone entry or residency, making the exclusion fundamentally illegitimate. This penalizes individuals for circumstances beyond their control, violating basic equality.

  (2) The anti-realist framework

  Dummett's anti-realist philosophy of language challenges the idea that statements are made true by a mind-independent reality. For the anti-realist, the meaning of a statement is not determined by truth conditions that might transcend our ability to know them, but by verification conditions—the circumstances under which speakers are warranted in asserting the statement. Truth is epistemically constrained; we cannot meaningfully speak of facts that are in principle inaccessible to us. A statement is only meaningful if we can specify what would count as evidence for its truth. This stands in stark contrast to realism, which allows for truths that exceed our capacity to verify them. Applied to political and legal categories, this suggests that terms like "citizen" or "alien" do not refer to natural kinds with hidden essences. Instead, their meaning is constituted by the institutional practices and rules that verify someone's status. There is no "fact of the matter" about membership beyond the public criteria established by social practice. If there is no verification-independent reality to ground these categories, their authority derives entirely from the coherence and justification of the practices that define them. This shifts the focus from what a citizen *is* metaphysically to how we *identify* a citizen procedurally, making the criteria of identification subject to philosophical scrutiny. Meaning is use, and political meaning is institutional use. We cannot appeal to a hidden reality to justify exclusion.

  (3) The interaction

  Does this linguistic framework strengthen or weaken the political critique? One might argue that if citizenship is merely a social construction, states possess the sovereign authority to define its verification conditions as they see fit, weakening the racism analogy. If there is no natural fact of membership, the state's arbitrary definition becomes the only fact that matters, potentially legitimizing exclusionary rules as valid constructions of social reality. Under this view, the state creates the category, so it cannot be accused of misrepresenting it. However, Dummett's anti-realism strengthens the critique by stripping borders of metaphysical cover. If meaning is fixed by verification, then the criteria for membership must be publicly intelligible and non-arbitrary to sustain meaningful discourse. When borders rely on birthright, the verification condition (place of birth) has no logical connection to the purported meaning of membership (political participation or belonging). Anti-realism exposes this gap: there is no deeper reality of "national essence" to rescue the practice from charges of arbitrariness.

  Consider the language-verification exam. A realist might view language ability as an internal mental state the test merely detects. An anti-realist sees the test as constitutive of what "knowing the language" means for policy purposes. If the exam is rigorous but unrelated to actual communicative capacity—serving instead as a barrier to entry—it reveals that the verification condition is not truly about language, but about exclusion. Dummett's framework treats this as a misuse of linguistic authority. Since the meaning of "qualified resident" is exhausted by the verification conditions, making those conditions disproportionately difficult renders the category itself exclusionary by design. Anti-realism forces us to acknowledge that if the verification practice is discriminatory, the concept itself is corrupted. There is no hidden "true membership" to appeal to; there is only the practice, and if the practice mimics racial exclusion, it *is* racial exclusion. The framework denies the state the ability to claim they are protecting a pre-existing community; they are merely enforcing a verification regime that lacks warranted assertibility. This reveals the exam not as a neutral test of skill, but as a political tool masquerading as a verification condition. It functions as a disguised form of arbitrary exclusion, precisely because the verification condition does not align with the meaningful use of language in community life.

  (4) Verdict and justification

  The verdict is clear: Dummett's anti-realist philosophy of language strengthens his ethical critique of immigration controls. The two commitments cohere because anti-realism functions as a demystifying tool that prevents the reification of political boundaries. By denying that "the nation" exists as a verification-independent entity, Dummett removes the metaphysical justification often used to defend closed borders. Defenders of strict immigration control often rely on a realist intuition that nations are natural communities with pre-existing boundaries that must be protected. Anti-realism rejects this, insisting that national membership is nothing over and above the rules we enforce. Consequently, if those rules distribute life chances based on accidents of birth, there is no deeper reality to justify them. The language-exam case confirms this: without a realist escape hatch, the policy stands or falls on the fairness of its verification conditions. Since birthright and prohibitive testing lack moral warrant as verification conditions for human rights, anti-realism leaves them exposed as arbitrary exercises of power. Dummett's philosophy of language does not merely remain neutral; it actively dismantles the ontological security that border regimes rely upon, reinforcing the claim that such controls are structurally analogous to racism. The lack of a mind-independent fact of nationality means the moral burden rests entirely on the verification practice, which fails the test of non-arbitrariness. His philosophy thus provides the ontological groundwork for his political radicalism, ensuring consistency across his work.
