answer: |-
  Dear colleague, I know exactly the friction you are describing, and I share your unease because it sits right at the junction where our pipettes meet our metaphysics. It is tempting to think this is just sloppy language, the kind of grant-speak we adopt to make dry chemistry sound like engineering, but I suspect it is deeper than that. To get at what is actually presupposed here, we need to walk through the available options for what this talk is doing, discard the ones that do not fit the wet lab reality, and see what remains.

  Consider first the view that this is purely instrumental, that talk of codes and reading is just a convenient shorthand for complex causal chains. On this picture, saying a ribosome reads mRNA is no different than saying a key opens a lock; there is no genuine information, just shape complementarity and chemical affinity. The problem with this deflationary account is that it cannot make sense of the normative language biologists use without blinking. When we say a mutation is a typo or that CRISPR corrects an error, we are not just describing a causal deviation; we are appealing to a standard of correctness. A key that does not open a lock is just a piece of metal that fails to cause a mechanism to turn, but a typo is a string that fails to mean what it ought to mean. Causality alone does not generate errors, only deviations. If the talk were merely causal, we would not distinguish between a silent mutation that changes the sequence but not the protein and a missense mutation that changes the protein; both are just causal differences. Yet we treat the former as invisible and the latter as potentially pathological. The causal story is necessary, but it is insufficient to explain why we treat some causal pathways as successful executions of a program and others as failures.

  So you might swing to the opposite extreme and argue that DNA literally possesses semantic content, that the genome is a text in the same robust sense that a letter is a text. This view takes the metaphor at face value. The trouble here is the mitochondrial case you pointed out, which kills the idea of intrinsic meaning. If the sequence UGA intrinsically means stop, then it should mean stop everywhere, just as the word stop means halt regardless of who reads it. But in the mitochondrion, UGA means tryptophan. If the meaning were in the string, the mitochondrion would be misreading the text constantly. But biologists do not say the mitochondrion misreads the nuclear code; they say the code is different. This tells us the meaning is not locked in the DNA itself. Furthermore, if the content were intrinsic and robust, the oscillation you noted between gene for alcoholism and gene codes for a polypeptide would be a contradiction rather than a context switch. The strong realist view makes the biology too rigid and cannot account for the context-dependence of the decoding machinery.

  What remains, and what I think best reconstructs the implicit theory driving our practice, is a relational view grounded in evolutionary history, often called teleosemantics. On this account, the content of a DNA sequence is not intrinsic to the chemistry, nor is it a mere metaphor; it is fixed by the relationship between the sequence and the decoding machinery that was selected to process it. The meaning is real but system-relative. The nuclear genome says stop at UGA because the nuclear translation machinery was selected to interpret it that way, and the mitochondrial genome says tryptophan because that machinery was selected differently. This explains why we can speak of errors and corrections without committing to magic; an error is a deviation from the output that the machinery was evolutionarily stabilized to produce. It also explains the oscillation in your grant example. When we say a gene codes for a polypeptide, we are speaking about the immediate biochemical function fixed by selection. When we say gene for alcoholism, we are speaking loosely about the downstream phenotypic effects that interest us as humans, even if the evolutionary selection pressure was never about alcohol. The practice presupposes that content is anchored in the normal function of the system, not the sequence alone.

  This reconstruction handles your synthetic biology case quite cleanly. If we build a bacterium where a codon is reassigned to a synthetic amino acid, we are effectively swapping the decoder. On the relational view, the genome now carries different content relative to that new cellular system. We should not say the genome is being misread, because there is no historical norm for this new machine to violate yet; rather, we have engineered a new semantic context. The sequence is identical, but what it says has changed because the interpreter has changed. This might feel unstable to a purist who wants meaning to be in the text, but it fits the bench reality where we treat the host strain and the plasmid as a coupled system. If the bug does fine, the new meaning is stable. The only incoherence arises if we try to claim the meaning stayed the same despite the different output, which would force us to call a functioning protein a mistake.

  Finally, if we banned the code vocabulary tomorrow, the immediate workflow at the bench would not change much, but the conceptual fights over function would shift dramatically. You are right to suspect the functional genome debate would come out differently. Currently, when we argue about whether junk DNA is functional, we are often arguing about whether it is being read or interpreted by the cell. We distinguish between causal noise and functional signal. If we were restricted to purely causal language, anything that produces a biochemical effect would count as functional. Transcriptional noise would become function simply because it causes a molecule to be produced. The semantic vocabulary allows us to carve nature at the joints of evolutionary intention, distinguishing between what the system is designed to do and what merely happens. Without words like code, read, or information, we would lose the ability to distinguish a signal from a side effect, and the genome would bloat into a causal soup where everything matters equally. The tension you feel is not a bug in the field; it is the friction of using a semantic toolkit to map a causal world, and while it requires care, it is the only way we have to distinguish the program from the noise.
