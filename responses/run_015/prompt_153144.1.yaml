      *(Self-Correction during drafting)*: I should mention that in the novella, the Heptapods have two languages: Heptapod A (spoken/sequential) and Heptapod B (written/simultaneous). The film focuses almost entirely on B. This is crucial for the "writing shapes thought" argument.

      *(Refining the "Strong vs. Weak" question)*: It's actually neither. It's a third category. I should name it. "Ontological Linguistic Relativity."

      *(Addressing the "What it adds" part)*: Standard debates are empirical (does X language speakers score higher on Y test?). *Arrival* is existential (does learning X language allow me to accept mortality?). That's the unique contribution.

