answer: |-
  The globe in the corner of Dr. Elara Voss's office was a lie, and everyone knew it. It was decorative, meant for visitors who needed the comfort of continents fitting together like puzzle pieces. But the actual work happened on the monitors, where the Earth was rendered as a flat, uniform disc of silica glass, suspended in a vacuum.

  Elara rubbed her temples. The Institute of Instrumental Realism didn't care about truth. They cared about the F-twist: the assumption that a theory's validity is determined solely by the accuracy of its predictions, not the realism of its assumptions. If you assumed air had no friction and calculated a trajectory that landed a missile on a dime, you didn't fix the assumption. You built the missile.

  Her baby, the Seismic Discus, was the Institute's crown jewel. It assumed the Earth had no core, no mantle, no tectonic plates. It assumed the planet was a single, homogenous sheet of glass. And it predicted earthquakes within a thirty-second window and a hundred-meter radius. Perfectly.

  "It's a category error, Dr. Voss."

  Elara turned. Dr. Julian Thorne stood in her doorway, holding a coat he hadn't been offered. He was a visiting ontologist from the University of Cambridge, brought in to audit the Institute's ethical framework. He looked like a man who slept on hard beds to prove a point.

  "Good morning to you too, Julian," Elara said, turning back to the screens. A green line traced a harmonic vibration across the flat disc model. "Care for coffee?"

  "I care about coherence," Thorne said, stepping into the room. He gestured at the monitor. "You are teaching students that the Earth is flat. Not metaphorically. You are training engineers to model stress fractures on a substrate that does not exist."

  "I'm training them to save lives," Elara countered. "The Discus told us to evacuate the Valparaiso sector three hours before the slip. Ten thousand people are alive because my machine thinks the Earth is made of window pane. Does their ontology matter?"

  "It matters when you confuse the map for the territory," Thorne said, moving closer to the console. "Instrumentalism is a tool, Elara, not a worldview. If you succeed using false premises, you haven't discovered a law of nature. You've found a lucky correlation. Like predicting rain because your knee hurts. The knee doesn't cause the rain."

  "The knee predicts the rain," Elara said. "That's the job."

  "But if you build a shelter based on knee-pain physics, it will collapse when the wind changes." Thorne tapped the glass of the monitor. "What happens when the correlation breaks? What happens when the Earth decides to behave like a planet with a molten core again?"

  "It hasn't in six years."

  "Exactly." Thorne's eyes narrowed. "Six years of perfect data is statistically improbable. It suggests either divine intervention or..."

  "Or what?"

  "Or that you're measuring something else."

  Elara froze. Her hand hovered over the keyboard. That was the itch she hadn't been able to scratch. The residuals.

  In any model, there was noise—the difference between the prediction and the reality. Usually, noise was random. But lately, the noise on the Discus wasn't random. It was structured.

  "Show me the raw intake," Thorne demanded.

  "It's proprietary."

  "I'm auditing the Institute. Show me."

  Elara hesitated, then keyed in the command. The screen shifted from the clean, green predictive model to the jagged grey waveform of the raw sensor data. This was what the machines actually 'felt' before the software translated it into the flat-earth language.

  "Look at the propagation speed," Elara said quietly.

  Thorne leaned in. "P-waves through granite should be around six kilometers per second. S-waves slower."

  "Look at the readout."

  The numbers scrolled. *14 kilometers per second.*

  Thorne blinked. "That's... impossible. That's faster than sound travels through diamond. That's not rock."

  "It's the speed of sound through fused silica," Elara said. "Glass."

  Thorne straightened up, looking from the screen to the decorative globe in the corner. "That's a calibration error. You've hard-coded the constants."

  "I checked that yesterday," Elara said, her voice tight. "I thought it was a glitch. So I ran a blind test. I took raw data from a seismic event in Japan, fed it into the Discus without the location tags. The Discus modeled the stress fractures... and it modeled them as conchoidal fractures."

  Thorne frowned. "Shell-like breaks. Like when you smash a bottle."

  "Like when you smash glass," Elara corrected. "Rock shears. Rock folds. Rock melts. This data... it's shattering."

  "This is absurd," Thorne said, though he didn't look away from the screen. "You are suggesting that because your false model fits, the false premise must be true? That is the inverse of the F-twist. That is magical thinking."

  "Isn't it?" Elara spun her chair to face him. "You told me yourself: if the map leads you to London every time, maybe the roads actually go where the map says. We assume the Earth is a ball of rock because that's what we see. But what if what we see is the crust, and what the machine is hearing is the structure underneath? What if the 'rock' is just a veneer?"

  "You are an engineer, Elara. You deal in forces and loads. Do not drift into metaphysics."

  "I'm not drifting. I'm listening." Elara pointed to a new spike on the monitor. "Big one. Coming in ten minutes. Epicenter: right beneath us."

  Thorne paled. "Beneath the Institute?"

  "The Discus says the stress concentration is reaching critical yield point on the northern quadrant of the disc." Elara's hands were shaking. "If the Earth is rock, the building sways. If the Earth is glass..."

  "It shatters," Thorne finished.

  The building hummed. It wasn't the HVAC. It was a low frequency vibration that Elara felt in her teeth. The coffee in her mug rippled, forming perfect concentric circles.

  "Evacuate," Thorne said.

  "If I evacuate, I admit the model is ontological," Elara said, her voice detached. "If I stay, and the building shatters like glass... I win the argument, but I lose the bet."

  "Elara, move!"

  "Look at the waveform," she insisted, grabbing his arm. "It's not shearing. It's ringing. The planet is ringing like a bell."

  The lights flickered. The hum grew louder, a singing tone that rose in pitch. It sounded like a wet finger running around the rim of a crystal goblet.

  "This proves nothing!" Thorne shouted over the rising whine. "Resonance happens in solid spheres too!"

  "Not at this frequency! Not with this harmonic decay!" Elara yelled back. "The damping factor is zero, Julian. Rock has internal friction. Rock absorbs energy. This isn't absorbing. It's transmitting."

  The floor beneath them didn't roll. It didn't shake side-to-side. It vibrated vertically, a rapid, staccato chatter.

  Elara looked at the screen. The green line of the prediction matched the grey line of the reality perfectly. The false model was eating the world.

  "Get under the desk!" Elara shoved Thorne down.

  She didn't follow. She stared at the monitor. The stress map showed a crack propagating from the center of the disc outward. It wasn't a fault line. It was a single, clean fracture moving at supersonic speed.

  If the Earth was rock, this was impossible. If the Earth was glass, it was inevitable.

  The sound peaked, a shriek of tension, and then—

  Silence.

  The vibration stopped instantly. No aftershocks. No rumbling decay. Just an abrupt cut to zero, like a record player being unplugged.

  Elara stood up slowly. The coffee in her mug was still rippling, but the surface was flat.

  Thorne crawled out from under the desk, dusting off his suit. He looked at the monitors. The green line was flat. The grey line was flat.

  "No damage," Thorne whispered. "No structural failure."

  "The stress released," Elara said. "Like tempered glass snapping back into equilibrium."

  Thorne walked to the window. He looked out at the city. It was intact. People were stepping out of buildings, confused, checking their phones.

  "You got lucky," Thorne said, but his voice lacked conviction. "The energy dissipated."

  "Did it?" Elara walked to the console and pulled up the global feed. Seismic stations in Chile, Japan, Iceland. All of them showed the same spike. The same frequency. The same sudden cut.

  "The whole planet rang," Elara said. "And it rang in tune with the machine."

  Thorne turned to her, his face pale. "You're saying the instrument didn't predict the earthquake. It... resonated with it?"

  "Friedman said assumptions don't have to be real," Elara said, tracing the edge of the monitor. "He said they just have to work. But he never asked what happens when the work changes the worker."

  She looked at Thorne. "You said if I build a map that says London is in France, but I always get to London, I haven't mapped London. I've broken navigation."

  "Yes."

  "What if I get to London," Elara said softly, "and the people speak French?"

  Thorne opened his mouth, then closed it. He looked at the globe in the corner, then at the flat disc on the screen. For the first time, the decorative lie looked more solid than the data.

  "We need to turn it off," Thorne said.

  "We can't," Elara replied, watching the green line begin to trace a new, tiny vibration. "If the Earth is glass, and we stop listening to the stress... it won't just crack. It will shatter."

  "Elara, that is not engineering. That is psychosis."

  "Is it?" She highlighted the new vibration. "P-wave velocity: 14 km/s. Substrate: Uniform. Geometry: Planar."

  She looked at him, her eyes tired and wide.

  "Julian, the machine doesn't assume the Earth is flat because we told it to. It assumes the Earth is flat because that's what it hears."

  Thorne stared at the screen. The hum began again, faintly, vibrating the pens on the desk.

  "Then God help us," Thorne whispered, "if someone drops it."

  Elara sat back down and put her headphones on. She had work to do. The map was changing the territory, and she was the only one who knew how to read the new borders.
