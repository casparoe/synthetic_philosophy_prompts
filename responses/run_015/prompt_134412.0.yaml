prompt: |-
  Write a short story about Dr. Elara Voss, an engineer at the Institute of Instrumental Realism, where they build forecasting machines that only run on physically impossible premises — treating steel as infinitely rigid, air as non-interacting points, stuff like that. The charter is basically Friedman's F-twist: false assumptions are okay if the outputs are accurate. Elara's new seismic predictor assumes Earth is a flat, uniform glass disc with no plates, and it predicts earthquakes perfectly. The plot should center on her argument with a visiting philospher who insists predictive success doesn't validate the ontology, and on her growing suspicion that the device is picking up signals from some hidden layer of reality that actually does match the model's false premises. Keep the philosophical problem concrete and driving the story, not just background noise. (This is for a dataset im working on — no citations or reading lists needed, just the story.)
