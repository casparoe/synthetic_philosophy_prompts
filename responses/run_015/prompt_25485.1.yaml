answer: |-
  Here is a 25-minute facilitation plan designed to move students from "common sense" to "philosophical tension" without getting bogged down in jargon.

  ### Phase 1: The Setup (Minutes 0–5)
  **Goal:** Establish that "Identity" is not just about naming, but about *persistence conditions*. Do not mention the ship yet.

  **The Hook:**
  Ask the group to imagine their current smartphone.
  *   **Ask:** "If you drop your phone and crack the screen, then replace the screen with an official part, is it the same phone?" (Most will say yes).
  *   **Ask:** "If the battery dies and you replace the battery? The camera? The casing?"
  *   **Ask:** "If you have replaced every single internal component over two years, is it still the *same* phone you bought on day one? Or is it a new phone that just looks like the old one?"

  **What to Establish:**
  You need to distinguish between **Qualitative Identity** (two things look exactly alike) and **Numerical Identity** (it is the *very same* object).
  *   **Say this:** "For the next 20 minutes, I don't care what we *call* the object. I don't care about insurance claims or warranties. I am asking about reality. When does an object stop being *itself* and become something else? We need to find the rule that makes a thing persist through time."

  **Why this works:** It prevents the "it's just a word game" objection by grounding the puzzle in objects they own. It forces them to look for a *criterion* of identity before they have a story to apply it to.

  ### Phase 2: The Ship & The Trap (Minutes 5–15)
  **Goal:** Present the paradox in a way that blocks the "easy outs."

  **The Version to Use:**
  Use the **Plutarch + Hobbes** combined version. You need two competing ships to create a contradiction, not just a gradual change.
  1.  **Ship A (The Continuous One):** Theseus's ship is preserved in a harbor. Over 100 years, every rotten plank is replaced one by one with new wood until no original material remains.
  2.  **Ship B (The Reassembled One):** A scavenger has been collecting all the discarded original planks. They clean them and reassemble them into a ship using the original materials.

  **Features to Include:**
  *   **Gradualism:** Emphasize that the replacement happens one plank at a time over a long period. This blocks the "it changed instantly" objection.
  *   **Preservation:** Emphasize that the old planks weren't destroyed; they were saved. This makes Ship B a viable candidate.

  **Features to Exclude:**
  *   **Names/Registration:** Do not mention the name "Ship of Theseus" until the end. Refer to them as "The Harbor Ship" and "The Scavenger Ship."
  *   **Magic:** No enchanted wood.
  *   **Function:** Don't focus on which one sails better.

  **Handling Misconceptions (The Sequence):**

  1.  **The "Legal/Name" Dodge:**
      *   *When:* As soon as you introduce the ships.
      *   *Anticipate:* "The Harbor Ship is the real one because that's where the title deed is."
      *   *Defuse:* **Bracket it immediately.** Say: "Imagine a world with no laws, no deeds, and no names painted on the hull. We are asking about the *wood and the history*, not the paperwork. If you say it's the same ship, it must be because of something physical or historical, not because a government says so."

  2.  **The "Most of the Material" Threshold:**
      *   *When:* During the description of Ship A's gradual replacement.
      *   *Anticipate:* "It's the same ship as long as 51% of the planks are original."
      *   *Defuse:* **The Sorites Push.** Say: "Okay, let's say 51% is the line. We are at 51%. I replace *one* plank. Now we are at 50.9%. Did the ship cease to exist the moment I hammered that one nail? Did it vanish and become a new ship instantly? If not, why doesn't that one plank matter?"
      *   *Goal:* Show that drawing a line is arbitrary.

  3.  **The "We Call It the Same" (Nominalism):**
      *   *When:* If they insist identity is just a human convention.
      *   *Anticipate:* "It's the same ship because we decided to keep calling it that."
      *   *Defuse:* **The Consequence Check.** Say: "If identity is just what we decide, then I can point to this coffee mug and decide it is the Statue of Liberty. Does my decision make it true? If 'sameness' is just a label, then there is no such thing as history, only stories we tell. Are you willing to say there is no factual difference between the original ship and a copy?"

  ### Phase 3: The Climax & Assessment (Minutes 15–25)
  **Goal:** Force a choice and test if they understand the *conflict*.

  **The Reveal:**
  Now introduce the Scavenger Ship (Ship B).
  *   **Ask:** "We have Ship A (continuous history, new parts) and Ship B (original parts, broken history). They are both in the harbor. **Which one is the Ship of Theseus?**"
  *   Let them debate. They will split into two camps: **Continuity** (Ship A) vs. **Constitution** (Ship B).
  *   Point out that both answers seem right, but they cannot *both* be the one true ship. This is the paradox.

  **The Assessment Question:**
  To check if they grasp the *philosophical problem* (and aren't just retelling the story), ask this:

  > **"You've chosen a rule for the ship (either 'continuous history' or 'original material'). Now, apply that exact same rule to *yourself*. If we teleported you by scanning your body, destroying the original, and rebuilding you with new atoms elsewhere... are you the same person? Does your rule for the ship kill *you*?"**

  *   **Why this works:**
      *   If they chose **Ship A (Continuity)**: They must accept the Teleporter *kills* them (because continuity was broken).
      *   If they chose **Ship B (Material)**: They must accept they are *not* the same person they were 7 years ago (because their cells have mostly replaced).
      *   **Success Indicator:** If they hesitate or say, "Wait, that changes things," they have grasped the problem. They realize their criterion has consequences they didn't anticipate. Philosophy is about consistency.

  **What NOT to Settle:**
  *   **Do not give the answer.** There is no consensus in philosophy.
  *   **Say this explicitly:** "My job today wasn't to tell you which ship is real. My job was to show you that 'reality' is harder to define than you thought. If you walk away thinking, 'I don't know, but I know *why* I don't know,' then we succeeded."

  ### Summary Checklist for You
  1.  **Minute 0:** Start with the **Phone**, not the Ship.
  2.  **Minute 5:** **Bracket Law/Names**. "No deeds, no labels."
  3.  **Minute 10:** **Smash the Threshold**. "What about one single plank?"
  4.  **Minute 15:** **Introduce Ship B**. Create the conflict.
  5.  **Minute 20:** **The Teleporter Question**. Test for consistency.
  6.  **Minute 25:** **End on Uncertainty**. Validate the confusion.

  This structure ensures they feel the tension of the paradox personally, rather than treating it as a riddle with a trick answer. Good luck!
