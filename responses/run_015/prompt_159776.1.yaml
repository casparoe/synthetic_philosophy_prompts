                  *   Too complex to explain in 5 mins.
                  *   *Let's go with a simplified Brier that doesn't incentivize extremes.*
                  *   **Payoff = 10 - (Error * 10).**
                  *   If Truth=1 (Red). You say 0.8. Error = 0.2. Payoff = 10 - 2 = 8.
                  *   If Truth=0 (Blue). You say 0.8. Error = 0.8. Payoff = 10 - 8 = 2.
