answer: |-
  Here is a complete, run-of-show plan for your 90-minute session. It is designed to be low-friction, high-tension, and mathematically sound without requiring your participants to do math.

  ### Session Title: **The Friction of Agreement**
  **Goal:** Participants will experience the pressure to converge (Aumann) and the specific structural reasons why convergence fails in the real world (Broken Priors, Bounded Rationality, Signal vs. Posterior).

  ---

  ### 1. Logistics & Materials
  *   **Room:** 7 tables (pairs). One large whiteboard.
  *   **Per Pair:**
      *   1 Deck of 10 cards (8 Red, 2 Blue) OR (8 Blue, 2 Red). *See Setup.*
      *   1 Deck of 10 "Prior Instruction" cards. *See Sabotage.*
      *   20 Poker chips per person (start currency).
      *   Index cards (for writing probabilities).
      *   Pen.
  *   **Whiteboard:** Pre-draw the **Scoring Table** (below) and a **Tracker** for pair convergence.

  #### The Scoring Rule (The "Brier Lookup")
  *Do not explain the math. Tell them: "This table rewards honesty. If you try to game it, you will lose chips on average. Just report what you actually feel."*

  | Your Reported Confidence | If You Are **RIGHT** | If You Are **WRONG** |
  | :--- | :--- | :--- |
  | **50%** (Unsure) | 75 chips | 75 chips |
  | **70%** (Leaning) | 91 chips | 51 chips |
  | **90%** (Sure) | 99 chips | 19 chips |
  | **100%** (Certain) | 100 chips | 0 chips |

  *Note: These numbers are scaled $100 \times (1 - (p - outcome)^2)$. They incentivize reporting true probability.*

  ---

  ### 2. The Setup (0:00 – 0:05)
  **No theory.** Walk them straight into the mechanics.

  1.  **The Truth:** Place a large opaque jar at the front. Tell them: "There is a Master Card in this jar. It is either **RED** or **BLUE**. Your goal is to determine the color of the Master Card."
  2.  **The Signal:** "At your table, you have a Signal Deck. It contains clues about the Master Card. If the Master Card is Red, this deck is mostly Red. If Blue, mostly Blue."
      *   *Prep:* Every table gets a deck that is **80% accurate**. (If Master is Red, Signal Deck = 8 Red, 2 Blue).
  3.  **The Payoff:** "At the end of each round, you will be scored on your final probability estimate using the board behind me. Chips = Prize. Go."
  4.  **The Sabotage (Secret):**
      *   **Tables 1–4 (Group A):** Give them a card that says: *"Base Rate: The Master Card is equally likely to be Red or Blue (50/50)."*
      *   **Tables 5–7 (Group B):** Give them a card that says: *"Base Rate: The Master Card is heavily biased. It is 90% likely to be RED."* (Or Blue, pick one and stick to it).
      *   *Instruction:* "Read your Base Rate card silently. Do not show it to your partner. This is your background knowledge."

  ---

  ### 3. Round 1: Trading Conclusions (0:05 – 0:25)
  **Protocol:** Partners may **only** exchange their current probability number. They cannot show cards or describe signals.

  1.  **Draw:** Each player draws one card from their Signal Deck. Looks at it privately. Puts it face down.
  2.  **Estimate 1:** Write your private probability (50, 70, 90, 100%) on an index card.
  3.  **Trade 1:** Swap index cards with partner. Look at their number. **Do not speak.**
  4.  **Update:** Privately update your belief based *only* on seeing their number. Write Estimate 2.
  5.  **Trade 2:** Swap index cards.
  6.  **Update:** Write Estimate 3 (Final).
  7.  **Reveal:** Turn over the Master Card. Score the round using the Whiteboard Table.
  8.  **Record:** On the whiteboard, write the final difference between partners (e.g., "Table 1: 0%", "Table 5: 20%").

  *Facilitator Note:* Watch the "Skeptic." If they refuse to pick a number, tell them "50% is a valid move, but it pays the least." Watch the "Politician." If they start arguing about the jar's fairness, cut them off: "The rules are the rules. Update or lose chips."

  ---

  ### 4. Round 2: Trading Evidence (0:25 – 0:45)
  **Protocol:** Partners may **only** describe the physical clue they saw. They cannot state a probability number until the very end.

  1.  **Reset:** Shuffle Signal Decks. New Master Card drawn (keep the same Sabotage groups).
  2.  **Draw:** Each player draws one signal card.
  3.  **Trade 1:** Show your card to your partner (e.g., "I have a Red"). **Do not say a percentage.**
  4.  **Update:** Calculate your own probability internally.
  5.  **Trade 2:** Draw a *second* signal card each. Show partner.
  6.  **Final:** Write your Final Probability.
  7.  **Reveal & Score:** As before. Record the difference on the whiteboard next to Round 1 scores.

  ---

  ### 5. The Reveal & Debrief (0:45 – 1:30)
  This is where you earn your fee. Do not lecture. Interrogate their experience.

  **Step 1: The Data (5 mins)**
  Look at the whiteboard.
  *   "Look at Tables 1–4 (Clean Priors). In Round 1 (Numbers), how many pairs ended with 0% disagreement?" (Likely most).
  *   "Look at Tables 5–7 (Sabotaged Priors). In Round 1, how many converged?" (Likely few).
  *   "In Round 2 (Evidence), did the Sabotaged pairs get closer or stay apart?"

  **Step 2: Mapping the Mechanics to the Theory (20 mins)**
  Use their specific frustrations to explain the theorem.

  *   **The Force (Aumann's Claim):** Ask Table 1 (Clean): "You saw different cards. You started with different numbers. Why did you end up with the same number?"
      *   *The Lesson:* When priors are common and rationality is assumed, my posterior *contains* my prior + my signal. If I know your posterior, I can mathematically extract your signal. Once I have your signal, I have all the info you have. We must match.
  *   **The Fragility (The Sabotage):** Ask Table 5 (Sabotaged): "You traded numbers. You are both smart. Why didn't you agree?"
      *   *The Lesson:* **Common Priors.** One of you thought Red was 50% likely to start; the other thought 90%. You weren't arguing about the signal; you were arguing about the world. Aumann breaks if priors aren't common.
  *   **Numbers vs. Evidence:** "In Round 2, did sharing cards feel different than sharing numbers?"
      *   *The Lesson:* Sharing numbers requires me to trust your rationality (did you calculate right?). Sharing evidence requires me to trust your honesty (did you see what you said?). In real life, we trade numbers (conclusions). This creates 'Black Box' disagreement. Trading evidence opens the black box, but *still* doesn't fix broken priors.
  *   **The "Common Knowledge" Gap:** "Did you know that your partner knew that you knew their number?"
      *   *The Lesson:* Aumann requires *Common Knowledge* (infinite recursion). You only had *pairwise* trading. That's why convergence took 3 rounds, not 1. In real life, we rarely get even 3 rounds.

  **Step 3: Handling the Personalities (10 mins)**
  *   **The Skeptic ("Probability is a conspiracy"):** "You felt the scoring rule punished you for being certain and wrong, right? That wasn't a theory; that was a chip loss. The theorem doesn't require you to love math, just to avoid losing chips."
  *   **The Politician ("This is like climate/vaccines"):** "Exactly. In those debates, we trade numbers ('It's a disaster' vs 'It's fine'). We rarely trade evidence ('Here is the raw dataset'). And we almost never have common priors ('I trust institutions' vs 'I don't'). This game is why those arguments never end."
  *   **The Anchor ("I stayed at 50%"):** "That's a rational strategy if you don't trust the signal. But notice you didn't gain chips. Aumann assumes 'Honest Bayesians.' If you opt out of updating, you opt out of agreement."

  **Step 4: The Name Drop (5 mins)**
  "Now I can tell you what this is. This is **Aumann's Agreement Theorem**. It says rational agents with common priors cannot agree to disagree. You just proved the 'Agree' part (Tables 1-4) and the 'Cannot' part (Tables 5-7)."

  ---

  ### 6. Troubleshooting: What Will Go Wrong
  *   **Arithmetic Panic:** Participants will try to calculate the Brier score in their heads.
      *   *Fix:* Point to the board. "Don't calculate. Look up. 70% Right = 91 chips."
  *   **The Liar:** A participant claims they saw Red when they saw Blue to manipulate the partner.
      *   *Fix:* In Round 2 (Evidence), require them to place the card face-up on the table after showing it. "Honesty is the only strategy that maximizes chips long-term."
  *   **The Dominator:** One partner dictates the number.
      *   *Fix:* Enforce the "Silent Swap" rule strictly. If I hear voices, I deduct chips from the table.
  *   **The Sabotage Leaks:** Group B figures out they have different instructions.
      *   *Fix:* If they catch it early, lean into it. "Okay, you caught the variable. Now, can you agree *despite* knowing that?" This actually strengthens the debrief.
  *   **No Convergence in Clean Group:** If Tables 1-4 don't converge, their rationality is bounded (they can't update).
      *   *Fix:* Use this in debrief. "The theorem assumes perfect rationality. You are human. That gap is where journalism lives."

  ---

  ### 7. Limitations: What the Game Cannot Stage
  Be honest about this in the final 5 minutes.
  1.  **Common Knowledge:** The game simulates it with rounds, but true Aumann agreement requires *common knowledge* of posteriors (I know that you know that I know...). In the room, you only knew what you were told. Real life rarely even gets that.
  2.  **Infinite Dialogue:** The theorem assumes you can talk forever until you agree. You had 3 rounds. Real arguments often end because we run out of time, not because we ran out of logic.
  3.  **Trust:** The game assumes you believe your partner showed you their real card. In reality, we suspect hidden motives.

  ---

  ### 8. Newsletter Adaptation
  *Can this work for readers?*
  Yes, but only as a **paired email exercise**.
  *   **Instruction:** "Find a friend. Do not talk on the phone. Email only."
  *   **Round 1:** Flip a coin (Truth). Send each other a biased signal (e.g., roll a die: 1-4 = Truth, 5-6 = Lie). Exchange 3 emails of probability estimates only.
  *   **Round 2:** Exchange 3 emails describing the die rolls.
  *   **Result:** Ask them to reply with their final disagreement % and read your analysis of Aumann in the next issue.
  *   *Caveat:* It lacks the chip pressure, so honesty is lower. Acknowledge that.

  ---

  ### Final Facilitator Check
  *   **Tone:** Keep it clinical during the game. You are the casino, not the teacher.
  *   **Pacing:** Keep a visible timer. The pressure to "beat the clock" simulates the cost of dialogue.
  *   **The Hook:** Start with chips in their hands. End with the name on the board. The middle is them realizing why they couldn't agree.
