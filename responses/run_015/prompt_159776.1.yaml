                      *   *Why?* Because the flat fee (5) is lower than the expected value of the gamble (8).
                      *   *Fix:* The flat fee must be higher than the expected value of the gamble *at the margin*.
                      *   Actually, the standard proper rule is: Payoff = $1 - (1-p)^2$ if Right, $1 - p^2$ if Wrong.
                      *   Let's just use **Points** not chips for the scoring, convert to chips at end.
                      *   Rule: **Brier Score.** Score = $1 - (Prediction - Outcome)^2$.
                      *   Prediction 0.8. Outcome 1. Score $1 - (0.2)^2 = 0.96$.
                      *   Prediction 0.8. Outcome 0. Score $1 - (0.8)^2 = 0.36$.
                      *   EV = $0.8(0.96) + 0.2(0.36) = 0.768 + 0.072 = 0.84$.
                      *   Prediction 1.0. EV = $0.8(1) + 0.2(0) = 0.8$.
                      *   **Honesty (0.84) > Overconfidence (0.8).**
                      *   *Implementation:* Use a lookup table on the whiteboard. No arithmetic for players.
                      *   Report 50% -> 0.75 pts either way.
                      *   Report 80% -> 0.96 pts (Right), 0.36 pts (Wrong).
                      *   Report 100% -> 1 pt (Right), 0 pts (Wrong).
                      *   Convert points to chips at the end (10 pts = 1 chip).
                      *   *Wait, 0.96 is annoying.*
                      *   *Scale by 100.*
                      *   Report 50%: 75 pts.
                      *   Report 80%: 96 pts (R), 36 pts (W).
                      *   Report 100%: 100 pts (R), 0 pts (W).
                      *   This works. It requires a table on the board.

      *   **The Sabotage (Breaking Common Priors):**
