prompt: |-
  I'm a science-and-ideas journalist, and in a few weeks I'm running a 90-minute hands-on session at a conference for about 14 other science writers — mixed ages, a couple of them proudly innumerate, two or three who will try to turn everything into an argument about politics, and at least one who thinks probability talk is a conspiracy. The subject is disagreement, and I want them to *feel* the force of that Aumann agreement theorem business — the claim that two honest Bayesianswho start from the same priors and genuinely take in each other's posteriors cannot just sit there permanently disagreeing — and then feel how thin the ground under it actually is. Constraints: index cards, poker chips, a whiteboard, no laptops, no phones, and I dont want to hand out real money. And no lecture up front — I want the room to walk into the result themselves, and I'd rather they not hear the name until the last ten minutes.

  Here's the rough shape I have in mind, but please make it real and fix whatever is broken in it. Some private-signal setup: everybody gets a noisy clue about a binary question (a jar that's mostly red or mostly blue, or whatever works better), writes down a probability, then trades with a partner for a few rounds. For payoffs I want a scoring rule where reporting your true probability is what maximizes your chips — I've heard such rules exist, so pick one and make it playable with chips and without arithmetic worse than simple fractions. Then two twists I specifically care about. First, run it twice: once where partners may only exchange their current *number* (their conclusion), and once where they may only describe the *clue they actually saw* (their evidence) — I want the difference between those two protocols to show up in whether pairs converge. Second, somewhere in the session break the common-prior assumption without telling anyone: give seperate subgroups different background information about how the world was set up, so that some pairs really shouldn't be able to converge, then reveal it. Also cap the number of message rounds, because I suspect the finite-dialogue version behaves differently from the idealized one and I want people to feel the clock.

  Then the debrief, which is the part I'm least sure I can do well. Map particular moments in the activity onto particular parts of the idea — the common prior, the difference between "I know your number" and "I know that you know that I know", the difference between learning someone's conclusion and learning what they saw, and the fact that in real arguments we almost always trade conclusions. Tell me what will predictably go wrong the first time I run it — I'm guessing somebody anchors and never budges, somebody meta-games or flat-out lies, the loud guy dominates his partner, someone refuses to play at all, and my sabotaged subgroup catches on early — and how to handle each without killing the session. And be straight with me about which parts of the theorem a card-and-chip game simply cannot stage, the bits I'll have to say out loud at the end because no activity will produce them. If a version of this could work as a written exercise for newsletter readers who aren't in the room, say so in a line or two.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist.
      *   **Audience:** ~14 science writers (mixed numeracy, some political, one probability skeptic).
      *   **Topic:** Disagreement, specifically Aumann's Agreement Theorem (feel the force, then feel the fragility).
      *   **Constraints:** 90 minutes, index cards, poker chips, whiteboard, no tech, no real money. No lecture up front (discover the result). Name drop only at the end.
      *   **Core Mechanics:** Private signals (binary state), scoring rule (proper, chip-based), two protocols (exchange numbers vs. exchange evidence), sabotage (break common prior), capped rounds.
      *   **Deliverables:** Concrete lesson plan, scoring rule details, debrief strategy, troubleshooting (what goes wrong), limitations of the medium, newsletter adaptation note.

  2.  **Deconstruct the Core Concept (Aumann's Agreement Theorem):**
      *   *Theorem:* Two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *The "Feel":* Convergence should happen when sharing numbers *if* assumptions hold.
      *   *The "Fragility":* Convergence fails if priors differ, if signals aren't trusted, if communication is limited, or if rationality is bounded.
      *   *The Twist:* Sharing *evidence* vs. sharing *posteriors*. Aumann is about posteriors. Evidence sharing is Bayesian updating. The prompt asks to compare them. Actually, Aumann says if I know your posterior, I should update mine to match yours (effectively). But in practice, sharing evidence is often more robust against prior divergence than sharing conclusions. Wait, let's refine: Aumann requires *common knowledge* of posteriors. Just trading numbers in pairs isn't full common knowledge, but it simulates the pressure to converge.
      *   *The Sabotage:* Break the "Common Prior" assumption. This is the key to showing why real people disagree.

  3.  **Design the Mechanics:**

      *   **The State:** A jar with beads? A deck of cards? Let's go with a "Hidden Card" (Red or Blue). It's binary, simple.
      *   **The Signal:** Each player draws a card from a sub-deck that is biased towards the Truth.
          *   Truth = Red. Signal Deck = 4 Red, 1 Blue (80% accuracy).
          *   Truth = Blue. Signal Deck = 4 Blue, 1 Red.
      *   **The Scoring Rule:** Needs to be proper (incentivize truth) and chip-friendly.
          *   *Logarithmic Scoring Rule:* Too mathy.
          *   *Brier Score:* $(1 - p)^2$ penalty. Requires squaring. Hard with chips.
          *   *Binary Scoring Rule (Simplified):* If event happens, get $p$ chips. If not, get $1-p$ chips? No, that incentivizes 100% always.
          *   *The "Matching Pennies" style proper rule:*
              *   Report probability $p$ (as a fraction like 1/2, 3/4, 4/5).
              *   If Right: Win $p \times \text{Pot}$.
              *   If Wrong: Lose $(1-p) \times \text{Pot}$? No, losses are demotivating.
              *   *Better:* "The Die Roll Method."
              *   Player states confidence (e.g., 80%).
              *   Roll a d10 (or draw 1-10 card).
              *   If roll $\le$ confidence AND prediction correct: Win chips.
              *   If roll $>$ confidence: Win nothing (or lose small).
              *   *Simplest Chip-Friendly Proper Rule:* **The "Bet against a Random Number" rule.**
              *   You write probability $P$ (0 to 100).
              *   I generate a random number $R$ (0 to 100).
              *   If $R < P$, you bet at odds $P$. (Too complex).
              *   *Let's use the "Quadratic Scoring Rule" simplified for chips.*
              *   Payoff = $1 - (Outcome - Report)^2$.
              *   Outcome is 0 or 1. Report is 0, 0.5, 1.
              *   If Report 0.5: Payoff always 0.75.
              *   If Report 1 and Right: Payoff 1. If Wrong: Payoff 0.
              *   *Actually, let's keep it dead simple for low-numeracy folks.*
              *   **The "Confidence Pool":**
                  *   Start with 10 chips.
                  *   Write probability (20%, 50%, 80%).
                  *   If Correct: Gain chips equal to confidence (2, 5, 8).
                  *   If Incorrect: Lose chips equal to confidence (2, 5, 8).
                  *   *Problem:* This incentivizes 100% always.
                  *   *Fix:* **The Calibration Game.**
                  *   You state a probability $p$.
                  *   A random number $r$ is drawn from 0-100.
                  *   If $r < p$: You are "locked in". You get 1 chip if Right, 0 if Wrong.
                  *   If $r > p$: You are "safe". You get 0.5 chips regardless.
                  *   *Why this works:* If you believe 80%, setting $p=80$ maximizes expected value. If you set $p=100$, you risk the "safe" 0.5 for a gamble.
                  *   *Wait, simpler:* **The Brier Score with Chips.**
                  *   Payoff = $2 \times p$ if Right, $2 \times (1-p)$ if Wrong.
                  *   If $p=0.5$: Payoff 1 either way.
                  *   If $p=0.8$: Payoff 1.6 if Right, 0.4 if Wrong. Expected value = $0.8(1.6) + 0.2(0.4) = 1.28 + 0.08 = 1.36$.
                  *   If $p=0.5$: Expected value = 1.
                  *   So honesty pays.
                  *   *Arithmetic check:* $2 \times 0.8 = 1.6$ chips. Hard to pay 1.6 chips.
                  *   *Scale it:* Multiply by 10.
                  *   Report $p$ in tenths (0, 1, ... 10).
                  *   If Right: Get $2p$ chips.
                  *   If Wrong: Get $2(10-p)$ chips.
