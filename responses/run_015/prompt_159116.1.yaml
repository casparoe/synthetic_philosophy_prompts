answer: |-
  Dear Friend,

  It is a pleasure to engage with your position on the diachronic requirements of rationality. You have adopted a robust stance, treating the money-pump argument not as a mere heuristic for underlying synchronic inconsistencies but as the very constitutive ground of diachronic irrationality. This is a bold and philosophically costly commitment, for it ties the normativity of rationality directly to pragmatic vulnerability over time. You ask for an assessment of what counts against this view, ranked from fatal to merely awkward, with guidance on where concession is wiser than dismissal. I will attempt to lay these out in order of severity, weaving in your specific concerns about resolute choice, exploiters, over-generation, and the nature of the norms involved.

  The most fatal objection, one that strikes at the heart of the constitutive claim, concerns the dependence on an exploiter or a specific environment. If the availability of a money pump is what constitutes the irrationality, then rationality becomes extrinsic to the agent. Consider an agent with cyclic preferences who lives in a barren world where no sequence of trades is ever offered. On your view, is this agent irrational? If you say yes, because the sequence is available in principle, you must explain availability in a way that does not rely on contingent facts about the environment. If you say no, because no loss is actually possible, then rationality depends on the presence of predators, which seems to confuse prudence with rationality. This objection suggests that the money pump demonstrates the costs of incoherence rather than constituting the incoherence itself. A defender of your view should concede this point rather than dismiss it, for insisting that rationality depends on the existence of a bookie renders the norm contingent on the maliciousness of others. The concession required is to admit that the pump is a pragmatic argument that reveals a structural flaw, but that the flaw itself must be grounded in something intrinsic, such as the impossibility of representing the preferences as maximizing any stable function, rather than the loss itself.

  Closely related and equally severe is the objection that the argument presupposes a demanding norm of self-governance that not all agents accept. The money pump assumes that the agent ought to care about their final position across time more than they care about the satisfaction of their occurrent desires at each moment. If an agent values their autonomy at each moment of choice above their cumulative welfare, they may willingly accept the pump as the cost of maintaining sequential freedom. This is not necessarily irrational on all conceptions of agency; it is merely a rejection of temporal neutrality. Here too, you should concede that the money-pump argument cannot establish diachronic rationality for an agent who explicitly rejects the norm of diachronic utility maximization. To dismiss this is to beg the question against those who hold a synchronic or moment-relative view of agency. The argument works only for those who already accept that they are a single entity over time whose interests must be aggregated. This does not destroy the view, but it limits its scope to agents who accept a specific, demanding conception of self-governance.

  Moving to a severe but perhaps manageable challenge, consider the resolute chooser. This agent settles on a plan in advance and executes it regardless of shifting occurrent preferences. Does this agent escape the money pump? They avoid the loss, certainly, but your question is whether this merely relocates the requirement from occurrent preferences to plans. I believe it does. If the resolute chooser is rational because they avoid the pump, then rationality is indeed diachronic, but the locus of evaluation shifts from local preference satisfaction to plan adherence. This creates a tension: if the plan was formed irrationally, resolute execution compounds the error. However, if the plan was formed to avoid cycles, resoluteness validates the diachronic requirement. You should concede that the resolute chooser does not escape the requirement but rather embodies it through a different mechanism. The defender of the view should accept that rationality imposes constraints on plan formation and adherence, not just on momentary choices. This relocation is not a defeat for diachronic rationality, but it complicates the picture by requiring a theory of when plans are binding.

  A significant objection, which risks over-generating, concerns ordinary discounting and the refusal to pay to avoid manipulation. If the money-pump argument condemns any cyclic preference, it may condemn hyperbolic discounting, which is common in human psychology. While many philosophers agree that hyperbolic discounting is irrational, others argue it is a rational response to uncertainty or changing selves. More troubling is the case of an agent who knows they will be pumped and refuses to pay a fee to avoid the pump because paying the fee itself reduces their wealth. If refusing to pay to avoid manipulation is itself pumpable, the argument condemns the agent for not spending resources to protect themselves, which can lead to a regress. You should be cautious here. If the view condemns standard economic behaviors that are widely accepted as rational, it loses plausibility. A defender should concede that the money-pump argument applies strictly to preferences over outcomes, not to preferences over processes or meta-preferences about manipulation, unless those too can be shown to generate genuine outcome cycles. Dismissing this risk makes the theory look out of touch with actual decision-making contexts.

  Regarding the analogy with Dutch-book arguments, this cuts both ways. Dutch books are often read as representation theorems showing that if you do not obey the probability axioms, you can be made to accept a sure loss. This displays the costs of incoherence. If you claim the pump constitutes the wrongness, you are going further than the standard reading of Dutch books. The analogy hurts your view if one accepts that Dutch books are merely pragmatic arguments that do not establish epistemic irrationality without further premises. However, it helps if one views both as revealing a failure of representability. You should concede that the money pump, like the Dutch book, is primarily a pragmatic argument. To claim it constitutes the irrationality requires an additional bridge principle that pragmatic vulnerability entails normative failure. Without this bridge, the analogy suggests you are conflating bad outcomes with bad reasoning.

  On the technical matter of where cycles come from, you suspect that cycles generated by thresholds or rough equality may not constitute a loss in the relevant sense. This is a merely awkward complication rather than a fatal one. If an agent is indifferent between A and B, and B and C, but prefers C to A due to a just-noticeable difference threshold, pumping them may not be unfair because each step was permitted by indifference. Here, the defender should concede that the money-pump argument requires strict preferences to generate a genuine normative violation. If the cycle arises from vagueness, the agent is not irrational but rather operating with vague predicates. This limits the scope of the argument but does not refute it for cases of strict cyclic preference. Dismissing this would require denying the reality of vague preferences, which is empirically and phenomenologically untenable.

  You ask whether the view predicts anything about actual choosers that a purely synchronic account would not. It does. A synchronic account predicts that agents will optimize locally at each moment, potentially reversing previous choices if local preferences shift. A diachronic account predicts that agents will engage in pre-commitment strategies, bind their future selves, or exhibit resolute choice to maintain consistency. If we observe agents willingly restricting their future options to avoid dynamic inconsistency, this supports the diachronic view. However, if agents consistently fail to do so despite knowing the costs, it suggests either irrationality or that the diachronic norm is not psychologically real. You should not dismiss the empirical data here; if actual choosers systematically violate the diachronic requirement without feeling rational regret, it suggests the norm may be external rather than internal to agency.

  Finally, you ask honestly whether the view has been qualified into something unfalsifiable. There is a genuine risk here. If every counter-example is met with a qualification, such as claiming the preferences were not strict, or the agent did not truly understand the options, or the environment was not relevant, the theory becomes dogmatic. It matters greatly because a theory that cannot be falsified cannot guide inquiry. If the view is that rationality is diachronic coherence, and any agent who fails this is simply defined as irrational, we learn nothing about the structure of agency. You should concede that the view needs clear criteria for when a preference cycle is genuine and when it is an artifact of measurement or vagueness. Without this, the claim that rationality is diachronic becomes a tautology.

  In sum, the most fatal defects are the extrinsic dependence on exploiters and the presupposition of temporal neutrality. You should concede these points and refine the view to state that the pump reveals intrinsic incoherence for agents who accept diachronic self-governance. The resolute chooser relocates the requirement but supports the diachronic nature of the norm. The over-generation issues and threshold problems are manageable concessions that limit the scope rather than the core. The Dutch book analogy warns against conflating pragmatic loss with normative failure without a bridge principle. And yes, you must guard against qualifying the theory into unfalsifiability, for if it explains everything, it explains nothing. I hope this assessment helps you refine your piece, for the question of whether rationality binds us across time is among the most profound we can ask.

  Yours sincerely,

  A Philosophical Interlocutor
