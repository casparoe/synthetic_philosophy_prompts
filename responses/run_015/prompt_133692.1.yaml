answer: |-
  Right, let's cut through the noise. You've got a classic philosophy of social science bind: everyone uses the concepts, but the metaphysical plumbing is leaking everywhere. If you pour money into empirical work on the Protestant Ethic now, you're just adding data to a broken model. A two-year, three-post-doc conceptual grant is actually the perfect scale to fix the blueprint before anyone builds another house on it.

  Here is the prioritised agenda, ranked by upstream necessity and tractability within a purely conceptual remit.

  ### Priority 1: The Ontology of Value-Causation (Methodological Individualism vs. Institutional Realism)
  **Work Package:** Post-doc A (Metaphysics of the Social)
  **Timeframe:** Months 1–18

  This is the upstream bottleneck. You cannot model how values cause outcomes (elective affinity, selection, etc.) if you haven't settled *where* the values reside and *how* they exert force. The field is currently split between those who think values are merely aggregated individual attitudes (MI) and those who treat them as institutional facts.

  The specific task here is to determine if institutional-level value causation is coherent without invoking spooky "downward causation." If values are embedded in rules, rituals, and incentive structures, do we need a strong ontological claim that the institution *itself* has causal power, or can we reduce this to complex feedback loops between individuals and constraints?

  **Why this is first:** If you decide that only individuals can bear causal properties, then "elective affinity" between *systems* (capitalism and Protestantism) becomes a metaphor, not a mechanism. If you decide institutions can hold values without magic, you open the door for systemic explanations. This decision dictates the entire modelling strategy for the other two posts. It is tractable conceptually because it relies on existing literature in social ontology (Searle, Elder-Vass, critical realism) but requires a fresh synthesis specifically for *axiological* (value) properties.

  **Confidence:** 90%
  **Reasoning:** This is standard philosophical groundwork. You can't do the rest without it.

  ### Priority 2: Reconstructing 'Elective Affinity' as a Causal Mechanism Sketch
  **Work Package:** Post-doc B (Philosophy of Social Explanation)
  **Timeframe:** Months 6–24

  Once Post-doc A has clarified the ontological status of the relata (values and institutions), Post-doc B attempts to formalise "elective affinity" (Wahlverwandtschaft). Currently, it functions as a get-out-of-jail-free card for vague culturalism. The goal is to reconstruct it as a specific type of causal compatibility constraint, distinct from efficient causation.

  The argument should be that elective affinity is not a force that pushes A to create B, but a filter that prevents incompatible combinations from stabilising. This avoids material determinism (it's not just economics driving culture) and avoids just-so storytelling (it provides a falsifiable constraint: if the values and institutions are misaligned, the system should exhibit instability or high transaction costs).

  **Why this is second:** It depends entirely on Priority 1. If values are only individual, elective affinity is just psychological resonance. If values are institutional, it's a structural compatibility issue. This is tractable because it's a modelling exercise: can we describe the logic of affinity without reference to empirical history? Yes, by treating it as a coherence condition within a social system.

  **Confidence:** 75%
  **Reasoning:** It is possible to sketch this, but whether it satisfies economists who demand rigorous micro-foundations is debatable.

  ### Priority 3: Selection Environments vs. Generative Mechanisms
  **Work Package:** Post-doc C (Philosophy of Economics/Political Theory)
  **Timeframe:** Months 12–24

  This post-doc takes the output of A and B and tests it against contemporary frameworks. Do values operate as selection environments (evolutionary economics: bad value-fits die out) or generative mechanisms (hermeneutics: values create new kinds of action)?

  Crucially, this role is also the "filter" for dead ends. They must identify which debates are turf wars (e.g., "Was Weber right about Calvinism?") versus which have traction for modern theory (e.g., "Do trust-values reduce monitoring costs in contract theory?").

  **Why this is third:** It is downstream application. There is no point analysing whether evolutionary selection applies to values if you haven't defined what a value is (Priority 1) or how it relates to structures (Priority 2). However, this is the only work package that guarantees the grant pays off for people outside philosophy.

  **Confidence:** 85%
  **Reasoning:** Distinguishing between selection and generation is conceptually clear, even if the application is messy.

  ### Dead Ends to Avoid
  1.  **Historical Exegesis of Weber:** Do not let them argue about what Weber *meant* in 1905. That is a black hole. The question is whether the *concept* is usable now.
  2.  **"Culture Matters" Tautologies:** Any project that concludes "culture influences economics" without specifying the transmission mechanism is a waste of the grant.
  3.  **Strong Downward Causation:** Unless Post-doc A can ground it rigorously, avoid claims that "Society causes Individual X." It invites immediate rejection from methodological individualists and stops the conversation.

  ### Confidence and The "Winging It" Admission

  I am highly confident that the ontological question (Priority 1) is the prerequisite for the rest. You cannot have a coherent philosophy of social science that skips the "what exists?" question. I am also confident that treating elective affinity as a compatibility constraint rather than a generative force is the only way to save it from determinism.

  **The point where I am winging it:**
  I am least certain (about 50% confidence) on the claim that **institutional-level value causation can be made coherent without a robust theory of downward causation.**

  Here is the rub: Post-doc A is tasked with finding a way for institutions to "have" values without saying the institution acts like a ghost in the machine. I have suggested they look at practice theory or non-reductive physicalism. However, it is entirely possible that this is a philosophical dead end. It might be that *any* coherent causal story about values *necessarily* commits you to methodological individualism, and that "institutional values" are always shorthand for complex individual interactions. If that is true, Priority 1 collapses, and the whole agenda needs to pivot to explaining how individual values aggregate to look like systemic affinity. I am betting they can find a middle path (structural constraints that are not reducible but also not magical), but that is the metaphysical gamble of this entire proposal. If they can't solve that, the "elective affinity" between systems remains a metaphor, not a mechanism.
