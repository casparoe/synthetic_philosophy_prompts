prompt: |-
  So I somehow ended up on the planning commision for the small city I grew up in, and it's turned into the most morally annoying thing in my life. We hear maybe thirty variance and rezoning proposals a month, forty-five minutes each, one-page staff report, and public comment that is mostly people being furious about parking. Votes get appealed, so whatever I do has to be defensible in writing afterwards. I want a decision procedure I can actually run, in about half an hour, from a one-page report plus whatever gets said in the room, and that my fellow commissioners — a retired contractor, a high school principal, two realtors — can follow without any theory background.

  What I want from you is the procedure, grounded in whatever political philosophy actually has to say about who has a right to the city. No reading list, no names, I just want the distinctions. The one I keep coming back to is that "we have a right to this neighborhood" seems to be three different claims shuffled together: a right of access (to be allowed to move here at all), a right of authorship (to have a say in what the place becomes), and a right of continuity (to not have the ground shift under you because of other people's choices, and to not be handed the bill for the region's growth). Almost every objection I hear is one of those wearing the costume of another. I'd like the procedure to start by sorting which one is actually being claimed, and I'd like it to say whether length of residence strengthens the claim genuinely or is just a proxy for something more defensible — I honestly don't know and I've gone back and forth.

  Three things it has to handle. First: the people most affected usually aren't in the room — the family that would live in the building, the person who'd use the shelter, and, weirder, the fact that what we decide partly determines which people end up existing here at all, so "who is harmed" can't just be read off the folks at the microphone. Give me a rule for who speaks for them, and be honest that it's a rule you chose rather than one you derived. Second: sequencing — refusing a building is reversible next year and approving a demolition isn't, and I want to know whether that asymmetry is a real moral reason for a default or just status quo bias in a nice coat. Say which, and build it in or leave it out accordingly. Third: the cases where the objection is real but the thing being asked for is a veto rather than a fix — how do I tell those apart, and where does the procedure hand the decision back to a human because it's a values call and not a factual one? Also fix the scope if the procedure needs it fixed: I never know whether the relevant "city" is my city or the whole metro area, and I suspect the answer changes the outcome.

  Then run it on three: (1) a six-unit building on a corner lot currently zoned for one house, (2) a sixty-unit supportive-housing project on a commercial strip two blocks off a single-family street, and (3) something I'm personally inclined to approve — a small apartment building a friend wants to put on the lot behind his house — where I'd rather find out I'm being inconsistent than get my way. And tell me plainly what the procedure can't do: which inputs it can't manufacture, when it will misfire, and what it says nothing about at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** A planning commissioner in a small city.
      *   **Problem:** Overwhelmed by variance/rezoning proposals (30/month, 45 mins each). Needs a defensible, quick (30 min), practical decision procedure.
      *   **Audience:** Fellow commissioners (contractor, principal, realtors) – no theory background allowed.
      *   **Core Philosophical Insight:** "Right to the neighborhood" is conflating Access, Authorship, and Continuity. The procedure must sort these.
      *   **Specific Constraints/Requirements:**
          1.  Handle the "Absent Stakeholders" (future residents, regional needs). Need an explicit rule for who speaks for them.
          2.  Handle "Sequencing/Reversibility" (Refusal vs. Approval asymmetry). Is it status quo bias or moral reality? Decide and build it in.
          3.  Handle "Veto vs. Fix" (Distinguish genuine objections from NIMBY veto power). Know when to punt to human judgment.
          4.  Fix the "Scope" (City vs. Metro).
          5.  Address "Length of Residence" (Does it strengthen claims?).
          6.  **Test Cases:** Run the procedure on three specific scenarios (6-plex on corner, 60-unit supportive housing, friend's backyard apartment).
          7.  **Limitations:** Explicitly state what the procedure *can't* do.
      *   **Tone:** Pragmatic, direct, no jargon, no reading lists, no names (Rawls, Lefebvre, etc.). Just distinctions and rules.

  2.  **Deconstruct the Philosophical Core (Access, Authorship, Continuity):**

      *   *Access:* Can I get in? (Housing supply, regional need).
      *   *Authorship:* Do I have a say? (Democratic process, design input).
      *   *Continuity:* Will my life stay livable? (Property values, shadows, parking, character).
      *   *Length of Residence:* Does time buy rights? Usually, it buys *Continuity* (investment in stability), not *Authorship* (veto power) or *Access* (exclusion).
      *   *Scope:* Small cities exist in a Metro. Housing is a regional market. Ignoring the Metro creates externalities. The scope must be Metro for Access, City for Continuity/Authorship.

  3.  **Drafting the Procedure (The "30-Minute Test"):**

      *   *Goal:* A checklist/flowchart style that fits the time limit.
      *   *Step 1: Scope & Stakeholders.* Define the "City" as part of a "Region." Acknowledge the absent.
      *   *Step 2: Claim Sorting.* Categorize public comment into Access, Authorship, Continuity.
      *   *Step 3: The Reversibility Default.* Address the sequencing constraint.
      *   *Step 4: Veto vs. Fix.* Address the mitigation constraint.
      *   *Step 5: The Vote.*

  4.  **Addressing Specific Constraints:**

      *   *Absent Stakeholders:* Since they aren't there, the Staff Report *must* represent them. If the report is silent, the Commissioner must assume the regional need exists unless proven otherwise. *Rule:* The Staff Report speaks for the Absent. If the Report says "Regional Need High," that claim weighs equal to a neighbor in the room.
      *   *Sequencing:* Refusing a building preserves the status quo (reversible later). Approving demolition or blocking housing creates scarcity (harder to reverse). *Decision:* It is *not* just status quo bias. Scarcity is cumulative. Denial adds to regional scarcity. Approval adds to supply. *Default:* Presumption of Approval *unless* Continuity harms are specific and unmitigatable.
      *   *Veto vs. Fix:* If the harm is specific (shadow, noise), it's a Fix. If the harm is "change" or "property value," it's a Veto attempt. *Rule:* Specific physical externalities = Mitigation required. Abstract "character" or economic protection = Not valid grounds for denial.
      *   *Length of Residence:* Time validates *Continuity* (reliance interests) but not *Authorship* (ownership of the future). Long-term residents get more weight on *disruption*, not on *exclusion*.

  5.  **Refining the Procedure for the Colleagues:**

      *   Keep language plain. "Continuity" -> "Stability." "Authorship" -> "Say." "Access" -> "Need."
      *   Make it a scorecard or a series of gates. Let's go with a "Three Gates" model.

  6.  **Developing the Test Cases:**

      *   *Case 1 (6-plex on corner):* Low impact. Continuity claims weak (parking/shadows). Access claim strong (missing middle). *Verdict:* Approve.
      *   *Case 2 (60-unit supportive):* High impact. Continuity claims loud (fear of crime, density). Access claim critical (homelessness). *Verdict:* Approve with conditions (mitigation), deny only if specific safety hazards exist.
      *   *Case 3 (Friend's backyard):* Conflict of interest risk. But procedurally, same as Case 1. *Verdict:* Recuse or apply rule strictly. If applying rule, Approve. (Need to address the friendship bias).

  7.  **Addressing Limitations:**

      *   Can't measure "soul" of a neighborhood.
      *   Can't solve regional inequality alone.
      *   Can't stop bad faith actors, only categorize them.

  8.  **Review against Constraints:**

      *   *No names/theory?* Check.
      *   *30 mins?* Check (it's a checklist).
      *   *Colleagues understand?* Check (simple categories).
      *   *Absent stakeholders?* Addressed via Staff Report weight.
      *   *Sequencing?* Addressed via Presumption of Approval.
      *   *Veto vs. Fix?* Addressed via Specificity Test.
      *   *Scope?* Defined as Regional Need / Local Impact.
      *   *Length of Residence?* Defined as Reliance, not Rights.

  9.  **Final Polish:**

      *   Ensure the tone is empathetic but firm.
      *   Make sure the "Friend" case highlights the inconsistency risk.
      *   Clarify the "Reversibility" logic (Denial is reversible *procedurally*, but the *harm* of housing scarcity is cumulative). Actually, the prompt asks if refusing is reversible. Refusing a permit is reversible next year. Approving demolition is not. *Correction:* The prompt asks about refusing a building vs approving demolition. I need to be careful. Refusing a building = Status Quo (Reversible). Approving a building = Change (Harder to undo). *However*, the moral weight is on the *regional harm* of refusal. I will argue that while procedural reversal is easy, the *moral* cost of denial accumulates. I will set the default to "Approve" to counteract the natural status quo bias.

      *(Self-Correction on Sequencing)*: The prompt asks: "refusing a building is reversible next year and approving a demolition isn't... is that asymmetry a real moral reason for a default or just status quo bias?"
      *   *Analysis:* Refusing a building keeps the lot empty. You can apply again next year. Approving a demolition destroys the old thing. You can't un-destroy.
      *   *Decision:* This is real, not just bias. Destruction is permanent. Construction is also hard to reverse. *However*, in the context of housing, the "harm" of *not* building (scarcity) is also cumulative.
      *   *Procedure Choice:* I will treat "Physical Destruction of Existing Habitable Stock" as a high bar (Presumption Against). I will treat "Denial of New Construction" as a lower bar but weighted against Regional Need.
      *   *Wait, simpler:* The prompt asks about the asymmetry between refusing a building (reversible) and approving demolition (irreversible). Actually, approving a *building* is also hard to reverse. The prompt contrasts Refusal (reversible) vs Approval (implied demolition or permanent change).
      *   *My Stance:* It is *not* just status quo bias. Irreversibility matters. But "Refusing Housing" has an irreversible *social* cost (homelessness continues). I need to balance physical irreversibility with social irreversibility.
      *   *Simpler Rule:* Default to "No Net Loss of Habitable Units." If it adds units, the reversibility of the decision matters less than the permanence of the need.
      *   *Actually, let's stick to the prompt's framing:* Is the asymmetry moral or bias? It's moral regarding *existing* structures, but bias regarding *potential* structures. I will build a "Presumption of Change" for vacant/underused land, and "Presumption of Conservation" for existing homes.

      *(Refining the "Friend" Case)*: I must advise recusal. If I run the procedure, I must acknowledge the bias. The prompt says "run it on... a small apartment building a friend wants to put on the lot behind his house." I should run the procedure but flag the conflict.

      *(Refining "Absent Stakeholders")*: The prompt asks for a rule for who speaks for them. I can't just say "Staff." I need a rule. *Rule:* "The Regional Need." If the Comprehensive Plan says we need density, the Plan speaks for the Absent.

      *(Refining "Scope")*: City vs. Metro. *Rule:* Access is Metro. Continuity is City.

  10. **Finalizing the Text:** Structure clearly. Procedure first. Then the Three Cases. Then Limitations. Ensure the "Length of Residence" question is answered explicitly.

      *(Self-Correction on Length of Residence)*: Does it strengthen the claim? It strengthens *Continuity* (I built my life here) but weakens *Access* (I am gatekeeping). It does not strengthen *Authorship* (democracy is one-person-one-vote, not one-year-one-vote). I will make this distinction clear.

      *(Final check on "No Names")*: Ensure no mention of Rawls, Lefebvre, Nozick, etc. Just "The Procedure."

      *(Final check on "Colleagues")*: Keep it actionable. "Ask this question," "Look for this document."

      Let's write it.cw
answer: |-
  Here is the procedure. It is designed to be read aloud at the start of a hearing cycle, printed as a checklist, and used to draft the "Findings of Fact" required for your written defense.

  ### The "Three Claims" Procedure

  **Scope Rule:**
  *   **Access (Need):** Defined by the **Metro/Region**. Your city is a container in a larger market. If the region needs housing, your city has a claim to provide it unless it is physically impossible.
  *   **Continuity (Stability) & Authorship (Say):** Defined by the **Immediate Neighborhood** (500-foot radius). This is where daily life happens.

  **The Length of Residence Rule:**
  Time does not buy ownership of the future.
  *   **Does not strengthen:** *Authorship.* A new resident has the same right to a say as a 40-year resident.
  *   **Does strengthen:** *Continuity.* A 40-year resident has a higher reliance interest in stability than a 1-year resident. Their disruption costs count more, but their veto power does not.

  **The Absent Stakeholder Rule:**
  The people who would live in the building are not in the room. You cannot guess their interests.
  *   **The Rule:** The **Staff Report** speaks for the Absent.
  *   **The Constraint:** If the Staff Report cites a Regional Housing Need or a Comprehensive Plan goal, you must treat that as testimony from a person in the room. You cannot weigh "Neighbor's Fear" heavier than "Staff's Data" without a specific, factual rebuttal.

  **The Reversibility Rule:**
  *   **Physical Destruction:** If the proposal destroys existing habitable housing, the default is **Denial**. This is not status quo bias; it is net-loss avoidance. You cannot un-demolish.
  *   **New Construction / Variance:** If the proposal adds housing or changes use without demolition, the default is **Approval**. Denial is reversible procedurally (they can apply again), but the social cost of scarcity is cumulative. Do not treat "keeping things the same" as the neutral option. Treat "adding capacity" as the neutral option.

  **The Veto vs. Fix Filter:**
  When an objection is raised, categorize it immediately.
  *   **Category A (Specific Externality):** "The shadow hits my garden," "The noise exceeds decibel limits," "The parking overflow blocks my driveway."
      *   *Action:* These are valid. Require a **Fix** (mitigation). If a Fix is possible, you must Approve.
  *   **Category B (Abstract Harm):** "It changes the character," "Property values might drop," "There will be more traffic (generally)."
      *   *Action:* These are Veto claims. They assert a right to stop change, not manage it. **Invalid for Denial.** You may note them, but they cannot be the basis of a "No" vote.

  **The Decision Gate:**
  1.  **Does it destroy existing housing?** If Yes → Deny unless replacement is 1:1 immediate.
  2.  **Are there Category A (Specific) harms?** If Yes → Can they be mitigated by condition?
      *   If Mitigable → Approve with Conditions.
      *   If Unmitigable → Deny.
  3.  **Are the objections only Category B (Abstract)?** If Yes → Approve.
  4.  **Does it violate the Comprehensive Plan?** If Yes → Deny (This is the law). If No → Proceed to Approval.

  ***

  ### Running the Procedure on Your Three Cases

  #### Case 1: Six-unit building on a corner lot (currently single-family)
  *   **Scope:** Metro need for density (Access) vs. Immediate street impact (Continuity).
  *   **Reversibility:** New construction. Default is Approval.
  *   **Claims:**
      *   *Neighbors:* "Parking will be full," "It looks too big." (Category A: Parking / Category B: Looks).
      *   *Absent:* Staff report says city needs missing-middle housing.
  *   **Application:**
      *   Parking is a Specific Externality. Can it be fixed? (e.g., require off-street spots, restrict street permits). If yes, you cannot deny based on parking.
      *   "Looks too big" is Abstract. Disregard for denial.
      *   No existing housing destroyed.
  *   **Verdict:** **Approve with Conditions.** (Conditions: Off-street parking requirement, design review for facade).
  *   **Defensibility:** "We mitigated the specific physical harm (parking). We cannot deny based on aesthetic preference against the Regional Need."

  #### Case 2: Sixty-unit supportive housing on commercial strip (2 blocks from single-family)
  *   **Scope:** Metro need for shelter (Access) vs. Neighborhood fear of crime/disorder (Continuity).
  *   **Reversibility:** New construction (likely vacant commercial). Default is Approval.
  *   **Claims:**
      *   *Neighbors:* "Crime will go up," "Property values will drop," "My kids won't be safe."
      *   *Absent:* Staff report cites homelessness crisis and state housing mandates.
  *   **Application:**
      *   "Crime/Safety" sounds Specific, but without evidence of *design-induced* crime (e.g., dark alleys), it is Abstract Fear.
      *   "Property values" is explicitly Category B (Economic Veto). Invalid.
      *   Is there a Specific Externality? Only if the design creates a nuisance (e.g., loading dock noise).
      *   *Crucial Check:* Does the Comprehensive Plan designate this strip for higher density? If yes, the "Authorship" claim of the neighbors is overridden by the City's prior plan.
  *   **Verdict:** **Approve.**
  *   **Defensibility:** "Objections were economic and speculative, not physical externalities. The Staff Report established the Regional Need. Denial would violate the Comprehensive Plan."

  #### Case 3: Small apartment behind a friend's house
  *   **Scope:** Metro need (Access) vs. Backyard privacy (Continuity).
  *   **Conflict Check:** **Recuse.** You cannot run this procedure objectively on a friend.
      *   *If you refuse to recuse:* You must apply the procedure *more strictly* than usual to prove consistency.
  *   **Application (assuming strict application):**
      *   **Reversibility:** New construction. Default Approval.
      *   **Claims:** Neighbors say "Privacy loss," "Shadow on yard." (Category A: Specific).
      *   **Fix:** Can you set back the building? Limit height?
      *   **Length of Residence:** If neighbors are long-term, their privacy reliance is high.
  *   **Verdict:** **Approve with Strict Conditions.** (Height limit, window placement restrictions).
  *   **Consistency Check:** If you approved Case 1 with parking conditions, you must approve this with privacy conditions. If you deny this because "it's too much for that street," you must deny Case 1.
  *   **Advice:** Recuse. It protects you from the appearance that the procedure is a game you play for friends.

  ***

  ### What This Procedure Cannot Do

  **1. It cannot measure "Soul" or "Character."**
  The procedure treats "neighborhood character" as an Abstract Harm (Category B). This is intentional. "Character" is usually a code for exclusion. However, if your city has a *specific, written* design code (e.g., "all roofs must be pitched"), you can enforce that. If the code is vague ("must fit the neighborhood"), the procedure forces you to ignore it. This will feel morally cold to your colleagues. Tell them: "We are zoning land, not curating a museum."

  **2. It cannot solve Regional Inequality.**
  This procedure prevents your city from making things *worse*. It does not force your city to solve the Metro's homelessness crisis alone. It creates a floor (don't block housing), not a ceiling (build enough for everyone). You will still vote on 30 proposals a month and feel like you aren't moving the needle. That is accurate.

  **3. It fails on "Cumulative Impact."**
  The procedure evaluates projects one by one. Thirty approved six-plexes might overwhelm a sewer system or a school, even if each one passes the "Specific Externality" test.
  *   **The Fix:** Your "Specific Externality" check must include **Infrastructure Capacity**. If the Staff Report says "Sewer at 98% capacity," that is a Specific Externality. Deny based on that, not on "too many people."

  **4. It cannot stop Bad Faith Actors.**
  People will lie. They will say "The shadow will kill my roses" when they just hate apartments. The procedure requires you to treat the claim as true if it is *physically possible*. You are not a court of law; you are a planning commission. If a shadow is mathematically possible, you must mitigate it, even if you suspect they don't care about the roses.

  **5. It creates no "Right to Stay."**
  This procedure protects *Continuity* (stability of conditions), not *Tenure*. It does not stop a landlord from selling the land, nor does it stop rent hikes. It only regulates the *physical container*. If your moral annoyance stems from gentrification and displacement, this procedure will not soothe it. It only ensures the physical door isn't locked by zoning.

  ### Final Note for the Commission
  When your colleagues ask why you are voting this way, do not quote philosophy. Use the checklist language:
  *"I am voting Yes because the objection is about property values, which is a Category B claim. The parking issue is Category A, but the applicant agreed to add two spots. The Staff Report confirms Regional Need. Under the Reversibility Rule, we default to Approval."*

  This makes your vote about **process**, not **preference**. That is how you survive the appeals.
