      *   *Candidates:* State, Constitution, Civil Service, Referee. Users as Citizens, Voters, Subjects, Clients.
      *   *Analysis:* The argument relies on *legitimacy through procedure*. If the AI is the *State* (monopoly on force), neutrality is required to avoid tyranny. If the AI is the *Constitution* (rules of the game), it defines the aggregation. If the AI is the *Civil Servant* (executor), it follows orders.
      *   *Slippage:* The proponent likely slides between AI-as-Constitution (structural neutrality) and AI-as-State (entity wielding power). The intuition of fairness comes from the Constitution/Referee, but the *need* for neutrality comes from the State's coercive power.
      *   *Decision:* The active mapping is AI-as-State (wielding power) governed by AI-as-Constitution (neutral rules). Users are Citizens (source of legitimacy).
      *   *Drafting:* Create the table. Highlight the slippage between "Arbiter" (Referee) and "Actor" (State).

  3.  **Section 2: The Case Conflation:**
      *   *Goal:* Distinguish Single-User (intrapersonal conflict) vs. General-Purpose (interpersonal impact) vs. Liberal State (bounded demos + coercion).
      *   *Analysis:* Liberal neutrality solves the problem of *pluralism among coercive subjects*.
          *   *Single User:* No interpersonal conflict. Neutrality here means not paternalizing the user's future self. But the state analogy fails because there's no "other" to be neutral *towards*.
          *   *General Purpose:* Affects non-users (externalities). The "demos" is not bounded. The state analogy assumes those affected are those who authorized it.
          *   *The "Goldilocks" Case:* Many users, exactly those affected. This is the only place the analogy holds, but it's rarely the actual deployment scenario (which involves non-users/society at large).
      *   *Verdict:* The analogy collapses when split. It only works for the specific case of a closed multi-user system, which is not the general AI alignment problem.

  4.  **Section 3: Feature Discrepancies:**
      *   *Goal:* Identify features of the State (Source) that AI (Target) lacks, and determine which support the "neutral aggregator" conclusion.
      *   *Candidates provided:* Monopoly on territory/coercion, Exit costs, Authorization source, Uniformity of policy.
      *   *Additions:* Temporal persistence, Accountability mechanisms, Physical embodiment.
      *   *Crucial vs. Colorful:*
