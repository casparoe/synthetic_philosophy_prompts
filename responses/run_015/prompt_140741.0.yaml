          *   *Colorful:* Territory, physical borders.
          *   *The Killer Disanalogy:* Exit costs/Pluralism. In AI, you can switch models. Neutrality *inside* one model is less necessary if there is competition *between* models.
          *   *Authorization:* States derive power from citizens (ideally). AI derives power from corporate deployment. This breaks the "neutral aggregator" legitimacy claim.

  5.  **Section 4: The Reverse Direction (Epistemic Conditions):**
      *   *Goal:* Address the "Veil of Ignorance" vs. AI's "Hyper-Knowledge."
