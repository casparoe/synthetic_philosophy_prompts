  Your roommate is running a sophisticated, hybrid framework. She isn't a pure Szaszian (who would reject *all* mental illness as a category error), but she isn't a standard biomedical psychiatrist either. She is operating as a **Critical Realist**: she accepts the Szaszian critique for most conditions but carves out a specific exception for disorders that look like "mechanical failures" of volition.

  Here is the breakdown of the competing rules implicit in her verdicts, how they apply to Chronic Interpersonal Betrayal Syndrome (CIBS), and the case that would force her to choose between them.

  ### 1. The Competing Rules

  Based on her track record, she is balancing two distinct principles.

  **Rule A: The "Contextual Normalcy" Principle (The Szaszian Core)**
  *   **The Logic:** A condition is *not* an illness if it is a comprehensible reaction to life circumstances, a moral habit, or a form of social deviance. Illness requires something *outside* the realm of normal human experience or choice.
  *   **Fits Her Verdicts:**
      *   *PTSD:* Rejected because it is a "normal human reaction" to war.
      *   *Alcoholism:* Rejected because it is a "pattern of choice and habit."
      *   *Homosexuality:* Rejected because it was "social control" (deviance).
      *   *Schizophrenia:* Rejected as a "problem in living" (a strategy or communication, not a disease).
  *   **Prediction for CIBS:** **REJECT.**
      *   *Reasoning:* CIBS is defined explicitly as a reaction to a "documented betrayal." Like PTSD (war) or depression (loss), a collapse of trust after betrayal is a *comprehensible, contextual human reaction*. To medicalize it is to turn a social/interpersonal wound into a biological disease.

  **Rule B: The "Volitional Glitch" Principle (The OCD Exception)**
  *   **The Logic:** A condition *is* a disorder if there is a specific, localized failure of agency where the subject wants to stop but physically/mentally cannot, regardless of the cause. This treats the mind like a machine that can have a broken brake pedal.
  *   **Fits Her Verdicts:**
      *   *OCD:* Accepted because the person "genuinely can't stop... even though they want to."
      *   *Epilepsy:* Accepted (as neurological) because it is an involuntary physical event.
      *   *Conflict:* This rule struggles to explain why she rejected Schizophrenia (where patients often cannot control delusions) unless she views psychosis as a "way of being" rather than a "glitch."
  *   **Prediction for CIBS:** **AMBIGUOUS / LIKELY REJECT.**
      *   *Reasoning:* While the suffering in CIBS is involuntary, the symptom is a "collapse of trust." Unlike OCD rituals (which are mechanical repetitions), trust is an emotional stance. She might view this as an *emotional adaptation* (Rule A) rather than a *volitional glitch* (Rule B). However, if she views the inability to trust as a "broken brake" on social engagement, she might Accept it.

  ### 2. The Splitter Case

  To determine which rule she is actually prioritizing, you should propose **Kleptomania** (compulsive stealing without economic motive).

  *   **Why this splits them:**
      *   **Under Rule A (Contextual Normalcy):** Stealing is a social/moral violation. Labeling it an illness medicalizes bad behavior and removes responsibility (similar to her view on Alcoholism). **Verdict: Reject.**
      *   **Under Rule B (Volitional Glitch):** The kleptomaniac "cannot stop" themselves from stealing despite wanting to. It fits the exact same "loss of agency" criteria as her OCD verdict. **Verdict: Accept.**

  If she says Kleptomania is a real disorder, she is prioritizing **Rule B (Volition)**. If she says it's just criminal behavior or a bad habit, she is prioritizing **Rule A (Context)** and her OCD verdict was a one-off exception for "purely internal" rituals.

  ### 3. Recommendation for Consistency

  If you want to recommend a verdict that keeps her most consistent with her own track record, she should **REJECT CIBS as a mental illness.**

  **The Closest Analog:** **PTSD.**
  *   **Why:** Her rejection of PTSD is the strongest data point for relational/traumatic conditions. She explicitly classified PTSD (a reaction to war trauma) as a "normal human reaction" rather than an illness.
  *   **The Principle:** **The Medicalization of Social Harm.**
      *   CIBS is structurally identical to her rejected PTSD case. Both are lasting psychological changes following a specific external trauma (War vs. Betrayal).
      *   If she accepts CIBS, she undermines her rejection of PTSD. If PTSD (war trauma) isn't an illness, then CIBS (relationship trauma) cannot be one without contradicting herself.
      *   Furthermore, accepting CIBS violates the core Szaszian tenet she otherwise follows: that psychiatry should not medicalize "problems in living." A betrayal is an interpersonal problem; diagnosing the *victim's reaction* to the betrayal as a syndrome shifts the focus from the social act (the betrayal) to the individual's pathology (the trust collapse).

  **The Verdict to Propose:**
  "CIBS is a 'problem in living,' not a disease. Like the soldiers with PTSD, these people are having a normal reaction to an abnormal event. Calling it a syndrome medicalizes the pain of betrayal rather than addressing the betrayal itself."

  This aligns with her views on Schizophrenia (problem in living), Alcoholism (habit/choice), Homosexuality (social control), and PTSD (normal reaction). It treats her OCD verdict as a specific exception for *intrusive, mechanical compulsions*, which CIBS is not.
