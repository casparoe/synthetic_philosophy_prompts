      *   20 rounds limit? Yes.
      *   Mosaic Obfuscation explained? Yes.
      *   Protocol revision? Yes (Commitment + Audit).
      *   Mutual concessions? Yes.
      *   No resolution? Yes.

  *(Self-Correction during final polish)*: Make sure Ivo doesn't just say "It's hard." He needs to explain *why* the honest debater can't just point to the error. The error is a relationship between Step $A$ and Step $Z$. To prove $A$ contradicts $Z$, you need a path. If the path is long, you can't show it in 20 steps. The honest debater says "A contradicts Z." The Judge says "Show me." The Debater says "It takes 500,000 steps." Judge says "I only have 20." Debater loses. That's the core. I need to make sure this is clear.

