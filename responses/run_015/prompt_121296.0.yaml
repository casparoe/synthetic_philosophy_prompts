      10. **Concessions:** Rue admits recursion alone is insufficient (needs cryptographic commitment/auditing). Ivo admits that with enforced commitments, the liar's computational burden grows exponentially, making it practically harder, even if theoretically possible.
      11. **Close:** We need a hybrid. Not settled, but the path is clearer.

  6.  **Polishing:**
