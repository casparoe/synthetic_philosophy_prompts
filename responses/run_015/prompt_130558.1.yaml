  # JOINT STATEMENT ON REFLEXIVE AMENDMENT PROTOCOLS
  **Signatories:** The Reflexive Authority Camp (RA) | The External Ground Camp (EG)

  ### I. AGREED CLAIMS

  1.  **Formal Structure of Circular Clauses:** Both camps agree that circular amendment clauses (where Article 4 defines the vote required to amend Article 4) create a logical dependency wherein the validity of the amendment procedure relies on the very rule being invoked. We agree this structure is distinct from linear hierarchies where a higher norm validates a lower one.
  2.  **The Reflexive Quorum Problem:** Both camps agree that a specific instability arises when the definition of the electorate ("Members") is contested simultaneously with the amendment vote. If Article 4 requires a two-thirds vote of "Members" but provides no neutral mechanism to resolve who qualifies as a "Member" during a dispute, the quorum calculation cannot be verified without presupposing the outcome of the dispute.
  3.  **Smart-Contract Analogy:** Both camps agree that smart-contract self-amendment modifies the traditional state-law analogy. While state law relies on interpretive communities to validate changes, smart contracts rely on deterministic code execution. However, we agree that both systems face a "keyholder dispute" problem: if the authority to trigger the amendment function is contested, neither text nor code can resolve the contest without referencing something outside the immediate instruction set.

  ### II. DISAGREEMENTS TABLE

  | Issue | Reflexive Authority (RA) Position | External Ground (EG) Position |
  | :--- | :--- | :--- |
  | **Source of Validity** | Validity is generated performatively; a successful vote constitutes its own authority regardless of prior grounding. | Validity is derived from pre-existing social facts or norms that exist prior to and outside the voting procedure. |
  | **Resolution of Dispute** | The vote itself resolves eligibility; whoever is allowed to cast a ballot that counts toward the threshold is retrospectively validated as a "Member." | Eligibility must be resolved by an external arbiter or pre-existing roll before the vote can legally constitute an amendment. |
  | **Nature of the Loop** | The circularity is benign and constitutive; it allows the system to remain closed and self-sovereign. | The circularity is vicious and incomplete; it leaves the system vulnerable to paralysis whenever the definition of the electorate is challenged. |

  ### III. CRUXES AND PREDICTIONS

  **Crux 1: Whether Circularity is Vicious or Benign**
  *   **The Question:** Does the logical loop of self-amendment invalidate the system during a dispute, or does the successful operation of the system validate the loop?
  *   **Concrete Hypothetical (The Co-op Bylaw Scenario):** A housing co-op attempts to amend Article 4. Five households claim membership status is disputed due to unpaid dues. The amendment passes 20-10, including the votes of the disputed households. No external court is available.
  *   **RA Prediction:** The amendment stands. The successful aggregation of votes constitutes the validity of the voters. The system bootstrap itself into authority through operation.
  *   **EG Prediction:** The amendment is void. Because the quorum included contested voters without external validation of their status, the procedure lacked a valid foundation. The system cannot lift itself by its own bootstraps.

  **Crux 2: Whether Every System Necessarily Contains an Unamendable Kernel**
  *   **The Question:** Is there a core rule (e.g., "who decides membership") that must remain fixed outside the amendment process for the system to function?
  *   **Concrete Hypothetical (The Self-Termination Clause):** The co-op votes to amend Article 4 to remove the requirement for member votes entirely, transferring power to a single manager, using the existing Article 4 procedure to do so.
  *   **RA Prediction:** This is permissible. The system has the authority to redefine its own kernel, including eliminating the membership vote requirement. The last vote under the old rules validates the new rules.
  *   **EG Prediction:** This is impossible under the current legal identity. Changing the kernel creates a new system entirely. The old rules cannot authorize their own destruction; such a move requires external consent from the membership body as a pre-legal fact.

  **Crux 3: Whether Hidden Code-Layer Rules Count as External Ground or Push the Problem Down**
  *   **The Question:** In blockchain governance, does the deterministic execution of code provide an external factual ground, or does it merely shift the authority dispute to the layer of key ownership?
  *   **Concrete Hypothetical (The Protocol Fork):** A decentralized autonomous organization (DAO) votes to amend its governance smart contract. A minority disputes the vote count due to a bug in the voting token contract. The code executes the amendment on Chain A; the dissenters fork to Chain B.
  *   **RA Prediction:** This pushes the problem down. The code is just another rule layer. The dispute is not solved by execution but by which group controls the private keys to deploy the new contract. The authority remains reflexive to the keyholders, not grounded in the code.
  *   **EG Prediction:** This counts as external ground. Code execution is a brute physical fact distinct from normative validity. Chain A is the valid continuation because the code executed without interruption; Chain B is a new system. The physics of the blockchain provides the external ground the bylaws lacked.
