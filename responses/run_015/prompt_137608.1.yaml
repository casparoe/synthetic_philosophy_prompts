answer: |-
  The problem of anthropic updating forces us to decide how the fact of our own existence should constrain our beliefs about the world. We are presented with three candidate rules for updating a hypothesis H with prior P(H), given n(H) total observers and m(H) observers sharing our evidence e. The self-sampling rule ranks hypotheses by P(H) times m(H) over n(H), effectively treating us as a random sample from the set of all observers. The self-indication rule ranks by P(H) times m(H), favoring hypotheses that produce more observers like us. The existence-only rule ranks by P(H) alone, provided m(H) is at least one, treating our existence merely as a consistency constraint. The central tension in this triad lies with the self-indication rule, which is notorious for the presumptuous philosopher verdict: it favors cosmologies with vastly more observers simply because they contain more observers. However, as noted, this bias is exquisitely sensitive to the grain at which evidence e is described. If e is coarse, such as the bare fact that one is an observer, the bias is maximal. If e is fine, comprising one's total unique evidence, the bias vanishes because m(H) becomes one for all viable hypotheses. This grain dependence is not merely a technical nuisance but a decisive objection that renders the self-indication rule incoherent, compelling us to adopt the self-sampling rule despite the discomfort of the doomsday argument.

  The grain dependence of the self-indication rule is fatal because it violates a fundamental norm of rationality: posterior probabilities should not fluctuate based on linguistic descriptions of the same underlying reality. If two agents possess the same physical state and history but describe their evidence at different levels of granularity, the self-indication rule mandates they hold different credences about the size of the universe. One agent, describing evidence as I am an observer, concludes the universe is likely vast. Another, describing evidence as I am this specific observer with these specific memories, concludes the universe's size is irrelevant to their existence. Since both agents occupy the same epistemic position, their rational credences should align. The fact that self-indication oscillates between an armchair proof of a multiverse and a null update depending on phrasing demonstrates that the bias toward observer-rich hypotheses is an artifact of information loss, not a genuine inference. At the limit of total evidence, where no information is lost, the self-indication rule collapses into the existence-only rule, stripping it of its distinctive power. A rule that is either absurdly strong or completely impotent depending on how carefully you define your terms cannot be a fundamental law of inference. It suggests that the presumptuous philosopher's verdict is not a discovery but a hallucination born of coarse-graining.

  Having rejected self-indication, we must choose between the existence-only rule and the self-sampling rule. The existence-only rule is too weak to account for the indexical information we clearly possess. We do not merely know that an observer exists; we know which observer we are relative to the total set. If we were to adopt the existence-only rule, we would be unable to update on our location in time or space in any meaningful way, ignoring the probabilistic weight of being a typical versus atypical observer. The self-sampling rule, by contrast, incorporates this indexical information by dividing by n(H). It acknowledges that finding oneself in a hypothesis with a billion observers is less surprising than finding oneself in a hypothesis with one observer, only if the hypothesis makes one's specific evidence more likely. This rule remains stable across changes in grain. If we refine the evidence e to be more specific, m(H) decreases, but it decreases proportionally across hypotheses in a way that preserves the ratio m(H) over n(H) as a measure of typicality. The self-sampling rule treats the observer as a random sample from the reference class of all observers, which is the standard statistical approach for dealing with selection effects. It avoids the magical creation of probability mass that plagues self-indication and provides a robust framework for updating on existence without granting us omniscience about the cosmos.

  The primary objection to the self-sampling rule is the doomsday argument, which suggests that our early birth rank implies humanity is likely to end soon, as we should expect to be roughly in the middle of the total sequence of humans. Critics often argue that the embarrassment of the doomsday argument for self-sampling is symmetric to the embarrassment of the presumptuous philosopher for self-indication, and that the two errors might cancel out in a hybrid theory. This symmetry is illusory. The presumptuous philosopher verdict allows an agent to reject well-motivated physical theories in favor of those positing googols of unobservable observers solely based on armchair reflection. This is an epistemic vice of the highest order, granting existence a causal power it does not possess. The doomsday argument, while unsettling, is merely a probabilistic shift. It does not prove doom is imminent, but rather that long futures are less probable than they might otherwise seem, conditional on our birth rank. It is a constraint on confidence, not a positive assertion of catastrophe. Furthermore, the doomsday argument relies on the definition of the reference class, which can be adjusted to include only relevant observers, whereas the self-indication bias is structural and inescapable as long as one counts observers. The embarrassment of self-indication is a violation of empirical humility; the embarrassment of self-sampling is a consequence of taking probability seriously. The former is fatal; the latter is a manageable cost of doing business.

  This distinction becomes even sharper when we consider the status of observers beyond our Hubble volume. In the cosmological case favored by the presumptuous philosopher, the extra observers posited by the preferred hypothesis lie forever beyond our causal horizon. They can never be observed, interacted with, or verified. For the self-indication rule, these causally disconnected entities nonetheless boost the probability of their hypothesis simply by existing. This implies a form of action at a distance where the mere metaphysical multiplication of beings in a disconnected region alters the local probability of one's own existence. This is metaphysically untenable. It suggests that the structure of reality here is dependent on the population density of reality there, even if there is no physical connection. The self-sampling rule also counts these observers in the denominator n(H), but the impact is different. For self-sampling, the presence of distant observers dilutes the probability of being any specific observer, but it does not actively favor the hypothesis in the way self-indication does. The self-sampling rule says that if there are vastly more observers elsewhere, it is less likely that you are here, but it does not say that the hypothesis is more likely to be true. The self-indication rule says the hypothesis is more likely to be true because there are more observers. When those observers are causally isolated, the self-indication verdict becomes a form of numerology, privileging numbers over physical plausibility. The self-sampling rule, while still sensitive to the reference class, at least maintains the logic of sampling rather than existence-boosting.

  Therefore, the grain dependence of the self-indication rule is a decisive refutation, revealing it to be an unstable method that generates knowledge from descriptive choices. The existence-only rule is rejected for failing to utilize indexical information. We are left with the self-sampling rule as the only coherent option. The doomsday argument is a consequence of this rule, but it is not as damaging as the presumptuous philosopher verdict. The doomsday argument is a probabilistic constraint on the future duration of our species, whereas the presumptuous philosopher verdict is an unjustified inflation of confidence in speculative cosmologies. The two embarrassments are not symmetric; one is a reasonable implication of being a random sample, and the other is an unreasonable implication of being a probability generator. Finally, the fact that the extra observers in the cosmological case are beyond our Hubble volume reinforces the rejection of self-indication. To allow unobservable, non-interacting entities to dictate our credences via a multiplication factor is to abandon empirical grounding. The self-sampling rule respects the limits of our perspective by treating us as a sample within the total set, without granting the set itself the power to validate the hypothesis through sheer magnitude. We must accept the self-sampling rule and its attendant doomsday shift, for the alternative is to accept a framework where the size of the universe is determined by how coarsely we describe our own eyes.
