answer: |-
  The mapping holds, but only if we locate the "competence" not in the brothers' minds, but in the **iterative selection loop** they built. The Wrights + Wind Tunnel constitute the competent system; the "scientific" establishment constituted the comprehending system that lacked competence.

  Here is the split on your three grasps:

  **1. Quantitative-Predictive Grasp**
  *   **Langley/Smithsonian:** *False grasp.* They possessed equations, but they relied on Smeaton's coefficient (wrong by ~18%). Their predictions failed reality. They had the *form* of prediction without the *accuracy*.
  *   **Wrights (1903):** *Empirical grasp.* They could not compute lift from first principles (Navier-Stokes was intractable). However, by correcting the coefficient via the tunnel, they generated lookup tables that predicted performance *for their specific context*. They had predictive power without theoretical derivation.

  **2. Causal-Handle Grasp**
  *   **Langley:** *Weak.* He treated stability as a property of the machine's weight and power, not its aerodynamic interaction. When his Aerodrome failed, he lacked the "knobs" to fix it other than "more power."
  *   **Wrights:** *Strong.* This is their core competence. They identified wing-warping and the movable rudder as the causal levers for control. They knew exactly which knob to turn (twist the wing) and which way (into the wind) to correct a stall. This is competence par excellence.

  **3. Justificatory Grasp**
  *   **Langley:** *High.* He could publish papers, cite authorities, and satisfy the Smithsonian's board. He could explain why flight *should* work according to the prevailing physics, even if it didn't.
  *   **Wrights:** *Low.* In 1903, they could not explain *why* a cambered wing generated lift better than a flat one in terms of fluid dynamics (circulation theory was nascent/contested). They could only say, "The tunnel data shows it does."

  **The Inversion Mapping**
  The **competent-without-comprehending system** is the **Wind-Tunnel Programme**.
  The brothers are the operators, but the *source of the design* is the variation-and-selection process. They tested 200+ airfoils. The tunnel didn't "know" fluid dynamics; it simply exerted selection pressure. The wings that generated lift were retained; those that didn't were discarded. This is Darwinian evolution in a box. The competence (a flyable machine) emerged from a process that did not contain the comprehension (fluid dynamics theory) required to justify it. The "comprehension" (Prandtl's boundary layer theory, Kutta-Joukowski) arrived later as a gloss to explain what the selection process had already achieved.

  **Addressing the Nagging Doubts**

  *   **Correcting Smeaton:** This looks like comprehension, but it is actually **calibration**. They didn't derive the correct coefficient from theory; they measured the discrepancy and patched the input. This is a feedback correction, characteristic of a control system (competence), not a theoretical derivation (comprehension). It confirms the inversion: they fixed the number because the machine demanded it, not because they understood the air.
  *   **Theory Skipping Tunnels:** You argue later theory allows skipping runs, suggesting comprehension does forward work. This is true, but it confirms the "late gloss" thesis. Theory became a *tool* only after the competence was secured. In 1903, theory was a *hindrance* (Langley's failures). The inversion claims comprehension is not the *source* of competence. The fact that theory later accelerated competence doesn't refute that competence can exist without it.
  *   **Mindless Substrate:** You are right to nag here. The Wrights were not mindless; they were hyper-cognitive engineers. A strict Darwinian/Turing inversion requires the substrate to be truly blind. The Wrights guided the search with heuristics.

  **Verdict and Cleaner Instance**
  This case is a **hybrid fit**. It demonstrates *Engineering Competence without Scientific Comprehension*, but not strictly *Competence without Cognition*. The brothers' cognition replaced the "blindness" of natural selection.

  A **cleaner instance** of the inversion in this domain is **Modern Genetic Algorithms (GA) in Airfoil Design**.
  *   **System:** A computer evolves airfoil shapes over thousands of generations using a fitness function (lift/drag).
  *   **Competence:** The GA produces bizarre, organic wing shapes that outperform human designs.
  *   **Comprehension:** No human (and the code itself) understands *why* the specific undulations in the winning shape work. The justificatory grasp is absent. We have the lift (competence) without the fluid-dynamic explanation (comprehension).
  *   **Inversion:** The design exists before the understanding. We fly the shape first; we try to write the physics paper second.

  The Wrights were the bridge: they used a blind tool (the tunnel) to bypass a broken comprehension (Langley's theory), proving that selection beats speculation. But because they were human, they retained a causal handle that a purely blind system would not. The true inversion is realized only when the designer is removed entirely, leaving only the selection pressure.
