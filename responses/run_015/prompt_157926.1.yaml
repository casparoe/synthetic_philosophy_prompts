      *   *Emotivism:* Schlick is often grouped with emotivists, but his view in *Problems of Ethics* is more about the causal explanation of moral behavior than the semantic claim that moral statements are *only* expressions of emotion (which is more Ayer/Stevenson). Schlick thinks ethics can be a science of moral behavior.

