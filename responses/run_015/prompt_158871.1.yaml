answer: |-
  1. **Bottom line**
  The chapter is fundamentally confused about Parfit's metaphysical stance. It attributes to him the "Further Fact View" he explicitly rejects, and it claims he requires "normal cause" for psychological continuity when he argues the opposite. Your friend is correct: the missing term is "Reductionism." Parfit argues persons are not separately existing entities; the chapter suggests he argues we simply cannot know if they are. The most damaging error is claiming Parfit believes identity questions have hidden answers rather than no answers. This turns his positive thesis into agnosticism, undermining the entire philosophical payoff.

  2. **Claim-by-claim audit**
  **The Teletransporter Setup:** *Accurate.* This is the standard thought experiment Parfit uses in *Reasons and Persons*.

  **"Parfit's claim... is that whether he really is you is a further fact... and that we therefore cannot say."** *Misrepresentation.* This is the critical error. Parfit argues against the "Further Fact View." He claims there is *no* further fact, not that it is hidden or unknowable. For Parfit, personal identity is just physical and psychological continuity; there is no extra "self" underneath. A sympathetic reader would say the chapter attributes the opposing view to Parfit.

  **"Identity is not what matters... What matters instead is psychological continuity... Relation R."** *Accurate.* This is Parfit's central thesis. He separates survival (what matters) from identity (a logical relation).

  **"Insists that it counts only when it is produced in the normal way... not by any artificial copying process."** *Major Misrepresentation.* Parfit defends the "Wide Psychological Criterion," which allows *any* cause of continuity, including artificial copying. He argues specifically that teletransportation *does* preserve what matters. The passage contradicts itself here, claiming he requires normal cause but then saying teletransportation is "just as good."

  **"Ordinary self-concern is an illusion... providing for your own old age has no better rational claim on you than providing for a stranger."** *Exaggeration.* Parfit argues the boundary between self and others is less deep than we think, reducing special concern. He does not argue for total equivalence between self and stranger, only that the difference is less significant than commonly believed.

  **"The two-replica case... refutes the view that we are separately existing entities."** *Accurate.* This is the "Branching Case." Since identity cannot be one-to-two, but survival occurs, identity cannot be what matters. This supports Reductionism.

  **"Low-resolution teletransporter... Parfit is committed to saying that this too is just as good."** *Acceptable Simplification.* If psychological continuity is preserved, Parfit does not care about physical resolution. However, this depends on the stipulation that psychology is fully intact.

  **"If the coarse record is used to run off a hundred replicas, you survive a hundred times over."** *Misrepresentation.* Parfit suggests "division of concern" in branching cases. Survival may be less complete when divided among many replicas, not multiplied.

  3. **The low-resolution teletransporter**
  This extrapolation is where your structural biologist instinct is both challenged and vindicated. Parfit's view is functionalist regarding psychology, not physicalist regarding substrate. If the coarse-grained model preserves all relevant psychological connections (memories, dispositions, character), Parfit would agree the physical resolution is irrelevant. For him, a person is not a physical object like a protein crystal, but a network of psychological relations. If the topology of that network is preserved, the person is preserved *for the purposes of what matters*. Your instinct that a coarse model is a "different object" applies to physical structures, but Parfit shifts the criterion to function.

  However, your skepticism about the "hundred replicas" claim is philosophically sound. Parfit acknowledges that branching complicates survival. He suggests that while you survive in each replica, the *degree* of what matters might be divided. Surviving as one person is better than surviving as one of a hundred. The passage implies a linear multiplication of survival value ("a hundred times over"), which Parfit does not support. He would likely say you survive in each, but the special concern you have for your future is diluted across the branches. So, drop the prejudice about physical resolution, but keep your skepticism about the multiplication of survival. The passage gets the physicalism wrong (Parfit doesn't care) but gets the branching math wrong (Parfit does care).

  4. **What survives the correction**
  Once the misstatements are fixed, the chapter's large conclusion partially stands. The core thesis—that identity is not what matters in survival—remains robust. Parfit's Reductionism still implies that self-concern is less rationally mandatory than we assume. However, the radical moral conclusion (self equals stranger) is weakened; Parfit reduces the difference, he does not erase it. The argument for these conclusions in the text is broken because it relies on the "hidden fact" and "normal cause" errors. The true foundation is Reductionism: there is no separate self to be worried about losing, only psychological connections to be preserved.

  5. **What I can repeat in discussion**
  **Safe to assert:**
  *   Parfit uses the teletransporter to argue identity is not what matters.
  *   Relation R (psychological continuity) is what matters in survival.
  *   The two-replica (branching) case shows identity cannot be what matters.
  *   Parfit is a Reductionist: there is no "further fact" of identity.

  **Stop repeating:**
  *   Parfit thinks identity is a hidden fact we cannot know.
  *   Parfit requires normal brain cause for survival (he allows artificial causes).
  *   Self-concern is an illusion (he says it is less significant).
  *   One hundred replicas means one hundred times full survival (he suggests division of concern).
  *   Parfit is agnostic about whether the replica is you (he says the question is empty).
