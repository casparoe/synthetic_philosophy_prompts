  Recognizing $G$ (the Gödel sentence) as true means reasoning in a metatheory stronger than Peano Arithmetic ($PA$), like $ZFC$ (set theory). There is no skepticism; we rely on coherence, not absolute proofs. $G$'s truth is relative to that stronger system, not intuition transcending proof. On Löb, you concede too much. Yes, formalized agents face Löbian constraints on self-trust. But this only bites if humans are equivalent to such fixed, recursively axiomatized systems. Assuming humans are formal systems begs the question. The theorems constrain formalizations of reasoning, not reasoning itself. Showing that formal agents hit limits doesn't show minds do, unless you beg the question by identifying minds with those agents. Truth outruns proof only relative to a system, never absolutely.
