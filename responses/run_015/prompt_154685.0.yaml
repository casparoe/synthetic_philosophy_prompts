answer: |-
  The stalemate between Disjunctivism and Representationalism is neither merely verbal nor simply a matter of competing metaphysical intuitions. It is a **substantive, cross-purposed conflict** arising from the collision of two distinct philosophical projects operating under the same label: a **metaphysics of perceptual contact** (Disjunctivism) and an **explanatory psychology of phenomenal character** (Representationalism).

  The impasse persists because each side treats a different constraint as non-negotiable. Representationalists prioritize the **Common Kind Assumption (CKA)**: the methodological principle that subjectively indistinguishable states must share a fundamental psychological nature to allow for a unified causal and computational explanation. Disjunctivists prioritize the **Constitution Principle**: the metaphysical claim that in veridical perception, the external object is a constituent of the experience itself, making the nature of the experience dependent on the environment.

  ### 1. Substantive Divergence on Explanatory Virtues
  The disagreement is not verbal, though it is exacerbated by terminological friction over words like "experience" or "awareness." It is substantive because it reflects a trade-off between competing explanatory virtues.
  *   **Representationalism** secures **theoretical unity**. By positing shared content, it explains how the brain can process veridical and hallucinatory inputs using the same mechanisms, and it preserves the intuition that justification for belief relies on internal states accessible to the subject.
  *   **Disjunctivism** secures **metaphysical fidelity**. It preserves the naive realist intuition that perception is essentially a disclosure of the world, not an internal simulation. It avoids the "veil of ideas" by denying that the immediate object of awareness is ever internal.

  The stalemate arises because neither virtue can be derived from the other. You cannot prove the CKA without begging the question against the Disjunctivist (who denies indistinguishability implies identity), and you cannot prove the Constitution Principle without begging the question against the Representationalist (who denies the world constitutes the mind).

  ### 2. Metaphysical vs. Epistemological Questions
  The parties are indeed answering different questions under the single heading of "the argument from illusion."
  *   **Disjunctivists** are primarily addressing a **metaphysical question**: *What is the ontological relation between mind and world in successful perception?* Their target is the sense-datum theory, and their goal is to restore direct realism.
  *   **Representationalists** are often addressing an **epistemological and psycho-semantic question**: *How can perceptual states justify belief and integrate with cognitive processing if their nature shifts with the environment?* Their target is the explanatory gap, and their goal is to naturalize intentionality.

  When a Disjunctivist argues that hallucination is a distinct mental kind, they are making a metaphysical claim about constitution. When a Representationalist counters that this makes perception "magical" or breaks the causal chain, they are making a methodological claim about scientific explanation. They talk past each other because one is defending the *normative status* of perception (its ability to ground knowledge via direct contact), while the other is defending the *causal homogeneity* of the mental.

  ### 3. The Adverbial Intermediary and the Legitimacy of Comparison
  The prompt asks whether the rejection of **Adverbialism** conceals a deeper divergence regarding the legitimacy of phenomenal comparison. Adverbialism proposes that we do not sense *objects* or *contents*, but rather sense *in a certain manner* (e.g., sensing "redly").

  Both Disjunctivists and Representationalists reject Adverbialism, but this shared rejection illuminates the core of their stalemate:
  *   **Representationalists** reject it because it fails to capture the **intentional directedness** (aboutness) of experience. They need content to explain accuracy conditions.
  *   **Disjunctivists** reject it because it internalizes the phenomenology, making the "manner of sensing" a property of the subject rather than a relation to the object.

  However, the Adverbial view highlights a crucial methodological fault line. Adverbialism treats phenomenal descriptions as modifiers of the *act* of sensing, not descriptions of a shared *object* (whether external or internal). By rejecting this, both sides reify "phenomenal character" as something that must be grounded either in an Object (Disjunctivism) or a Content (Representationalism).

  This shared rejection conceals a deeper divergence on **whether phenomenal comparison across veridical and hallucinatory cases is methodologically legitimate.**
  *   **Representationalists** assume that when a subject says "it looks the same," they are reporting on a shared mental particular (content). They treat the phenomenological report as a transparent window into mental ontology.
  *   **Disjunctivists** argue that the report is epistemically privileged but metaphysically misleading. "Looking the same" is a claim about *indistinguishability*, not *identity*.

  The Adverbial perspective suggests that the stalemate persists because both sides accept the **Phenomenal Principle** (that there is something given in experience that must be accounted for) but disagree on its location. If the Adverbialist is right that phenomenology is a *mode of access* rather than a *thing accessed*, then the demand for a "shared mental kind" is a category mistake. The Disjunctivist sees this but retreats to relational metaphysics; the Representationalist sees this but retreats to intentional content. Both refuse to dissolve the "phenomenal character" into a mere manner of awareness because both want experience to be *of* something.

  ### Conclusion: What Counts as Progress?
  Given this diagnosis, empirical constraints from cognitive science are unlikely to resolve the impasse, as neuroscience can describe causal mechanisms but cannot adjudicate between relational and representational ontologies of consciousness. Similarly, formal results will fail because the disagreement lies in the premises regarding the metaphysics of mind, not the logic derived from them.

  Progress would consist of a **conceptual distinction that decouples epistemic indistinguishability from metaphysical identity.**

  Specifically, progress requires a meta-philosophical framework that acknowledges the **duality of perceptual explanation**:
  1.  **The Personal Level:** Where Disjunctivism holds sway. Here, perception is a normative relation to the world, and the "object" is constitutive of the experience. This level accounts for justification and the phenomenology of presence.
  2.  **The Sub-Personal Level:** Where Representationalism holds sway. Here, the brain processes inputs that are causally indistinguishable, requiring a shared functional/representational description to explain behavior and hallucination.

  The impasse dissolves if we recognize that Disjunctivism and Representationalism are not competing theories of the *same* entity, but rather correct descriptions of *different levels of abstraction*. The "shared mental kind" is a valid posit for causal psychology (sub-personal), while the "relational particular" is a valid posit for epistemology and metaphysics (personal).

  Therefore, progress is achieved not by one side defeating the other, but by articulating a **level-relative ontology of perception**. Until philosophers distinguish between the *causal vehicle* of experience (which may be shared) and the *constitutive nature* of experience (which may be relational), the argument from illusion will remain intractable. The disagreement is irreducible only so long as we insist on a monistic ontology that must satisfy both causal homogeneity and metaphysical directness simultaneously.
