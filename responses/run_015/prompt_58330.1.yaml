          *   Abuse: If a child kicks the robot, are they practicing cruelty? If the robot *mimics* pain convincingly, the act looks like cruelty. Does the *intent* matter more than the *object*? Kant focuses on the maxim and the effect on the moral faculty. If the act hardens the heart against suffering (even simulated), it's bad.
          *   Affection: If someone bonds with the robot, does this cultivate virtue? Or is it a delusion? Kant values rationality. Bonding with a non-sentient object might be seen as irrational or misdirected sympathy. However, if it practices the *disposition* of care, it might be useful.
          *   *Conclusion:* Abuse is likely condemned (same reason as animal cruelty: hardening the heart). Affection is trickier. It might be tolerated as practice, but warned against as misplaced attachment that distracts from rational duties to humans.
      *   *Distinction:* Direct commitment = duties are about the human agent's state. Speculation = does simulated pain trigger the same moral corrosion as real pain?
      *   *Objection (Condemns too much?):* If Kant condemns kicking the robot, is he over-moralizing interaction with mere objects? If the robot feels nothing, is the "cruelty" real?

