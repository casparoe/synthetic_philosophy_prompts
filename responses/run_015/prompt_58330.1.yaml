      *   *Distinction:* Direct commitment = no duty to cells. Speculation = whether "historical source" triggers gratitude duties.
      *   *Objection (Condemns too little?):* A critic might say Kant's framework fails to capture the intrinsic wrong of commodifying life, even without suffering. Or, conversely, does it condemn too *much*? (The prompt asks for "condemns too little in the first case OR condemns too much in the second"). Let's focus on "condemns too little": Does this let us off the hook too easily regarding the *symbolic* violence of consuming animal flesh, even if no animal died?

  3.  **Deconstruct Case 2: Lifelike Robotic Companions:**
      *   *Kant's Baseline:* We shouldn't kick dogs because it makes us cruel to humans. We should be kind to them to practice kindness.
