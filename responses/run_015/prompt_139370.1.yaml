      *   *Diagnosis:* The "Born Rule Problem" in EQM is a category error. It asks for a derivation of probability from a deterministic theory without acknowledging that "probability" requires an emergent macroscopic structure (decoherence) that is *defined* by the Born Rule itself. It's circular by necessity, but not viciously so. It's a "fixed point" problem.

