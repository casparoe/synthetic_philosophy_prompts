      *   *Gleason's Theorem:* Mention this. It shows that if you want a measure on subspaces, it *must* be the squared amplitude. But it assumes non-contextuality. EQM tries to justify non-contextuality via decision theory.
      *   *The Verdict:* The problem isn't solved. It's dissolved. The "derivation" is actually an explication of how macroscopic agents emerge from the wavefunction.

  7.  **Finalizing the Commitment:**
