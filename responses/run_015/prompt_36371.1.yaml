answer: |-
  The Sleeping Beauty problem stands as one of the most persistent and fertile puzzles in contemporary epistemology. To evaluate the competing positions, we must first establish the protocol with precision. On Sunday, Beauty is put to sleep. A fair coin is tossed. If it lands Heads, she is awakened on Monday only. If it lands Tails, she is awakened on Monday and again on Tuesday. Crucially, between Monday and Tuesday in the Tails scenario, her memory of the Monday awakening is erased. On each awakening, she is told the protocol but is given no information regarding the outcome of the toss nor the day of the week. Upon finding herself awake, what ought her credence be that the coin landed Heads?

  The Halfer maintains that her credence should remain $1/2$. Her argument rests on the Principal Principle and the notion of relevant information. Beauty knew on Sunday that she would be awakened at least once. Since the awakening itself was guaranteed regardless of the coin's outcome, she has learned nothing new that distinguishes Heads from Tails. To change her credence would be to update on evidence she already possessed, violating standard norms of conditionalisation.

  The Thirder argues that her credence should be $1/3$. This position relies on the principle of indifference over centred worlds. From Beauty's perspective, there are three subjectively indistinguishable types of awakening: Heads-Monday, Tails-Monday, and Tails-Tuesday. Since she cannot distinguish them, and she knows she is in one of them, each should be assigned equal probability. Only one of these three scenarios involves Heads; thus, her credence in Heads should be $1/3$.

  A third position, the Double-Halfer, attempts to reconcile these intuitions. They maintain that Beauty's credence in Heads is $1/2$, but they reject the inference that her credence in 'Today is Monday' given Tails must be $1/2$. This allows them to preserve the coin's fairness while accommodating the frequency of awakenings, though at the cost of standard conditionalisation rules.

  To move beyond this stalemate, we must subject these positions to rigorous stress tests. The following analysis considers the pricing test and the extreme test, before offering a verdict on the nature of self-locating credence.

  ### The Pricing Test

  The first test concerns the relationship between credence and rational action. Suppose that on each awakening, Beauty may purchase a ticket for £10 that pays £30 if and only if the coin landed Heads, with all transactions settled after the experiment concludes. As stipulated, a Beauty who buys on every awakening loses money over many repetitions. This is because in the Tails worlds, she purchases two losing tickets (£20 loss), whereas in the Heads world, she purchases one winning ticket (£20 net gain: £30 payout minus £10 cost). Over a large number of experiments, the Tails losses outweigh the Heads gains due to the doubled frequency of betting opportunities in the Tails branch.

  Does this demonstrate that her credence in Heads must be $1/3$? The Halfer might argue that this merely shows a divergence between fair betting quotients and genuine credences under centred (self-locating) evidence. On this view, credence tracks the objective chance of the coin (which is $1/2$), while the betting odds must be adjusted to account for the 'tax' of multiple awakenings. The Halfer contends that Beauty's belief about the coin is correct, but her decision theory requires a modification to handle the fact that her 'self' is sampled more frequently in one world than the other.

  However, this defence is untenable. The primary function of credence is to guide action under uncertainty. If a belief system systematically leads an agent to accept bets that result in a guaranteed loss in a fair game, that belief system is pragmatically defective. To claim that credence is one thing and rational betting behaviour another is to sever the conceptual link between belief and action that defines Bayesian epistemology.

  The Thirder explanation is more robust. For a Thirder, the fair price of the ticket is determined by the probability of the proposition 'Heads' being true *at this awakening*. Since a random awakening is twice as likely to occur in a Tails world, the probability of Heads at an awakening is $1/3$. A ticket costing £10 that pays £30 has an expected value of zero at $p=1/3$ ($1/3 \times 30 - 10 = 0$). If the prompt stipulates that Beauty loses money, it implies the odds are slightly worse than fair for a Thirder, or that the Halfer's $1/2$ credence leads her to overvalue the ticket. If Beauty holds a credence of $1/2$, she calculates the expected value as $£5$ ($1/2 \times 30 - 10$) and buys eagerly, leading to the long-run loss.

  Therefore, the divergence between fair betting quotients and credences is a symptom of error in the Halfer position, not a genuine possibility. Credence is not a disembodied measure of objective chance; it is a measure of subjective uncertainty for an agent situated within the timeline. To ignore the sampling bias of one's own existence is to reason incorrectly about the world one inhabits.

  ### The Extreme Test

  The second test amplifies the stakes to reveal intuitions that may be obscured in the original case. We replace the coin with a lottery (or a fair coin with skewed consequences) under which Beauty is awakened once if she 'wins' (Heads) and one million times if she 'loses' (Tails). For the sake of the philosophical argument, let us assume the prior probability of Heads and Tails is equal (50/50), as the core of the Sleeping Beauty problem concerns the impact of the awakening ratio rather than the prior bias of the randomiser.

  In this extreme case, the Halfer maintains that upon awakening, Beauty's credence in Heads should remain $1/2$. The Thirder argues it should be approximately $1/1,000,000$.

  The Halfer position here becomes intuitively untenable. Consider Beauty's reasoning: "I know that if the result were Tails, there would be a million subjectively identical moments like this one. If the result were Heads, there would be only one. I find myself in such a moment. Is it not overwhelmingly more likely that I am in one of the million Tails moments than the single Heads moment?"

  To maintain a credence of $1/2$ is to assert that the sheer number of observer-moments provides no evidence regarding the outcome. This implies a form of solipsism regarding time and identity. It suggests that Beauty should reason as if she were an external observer watching the experiment from outside, rather than a participant whose very consciousness is being multiplied in the Tails branch.

  The Halfer might object that the *number* of awakenings does not change the *truth* of the coin toss. While true, credence is not about the truth of the toss in the abstract; it is about the truth of the toss relative to the evidence available to the agent. The evidence includes the indexical fact: "I am awake now." In the Extreme Test, the likelihood of this evidence given Tails is one million times greater than given Heads. By Bayes' Theorem, the posterior probability must shift drastically towards Tails.

  If the Halfer insists that Beauty remains $50\%$ confident she has won, they are forcing her to ignore the most significant piece of data she possesses: the frequency with which her situation arises in the different possible worlds. The Extreme Test demonstrates that the Halfer view is not merely a difference in degree from the Thirder view, but a difference in principle. It treats self-locating information as epistemically inert, whereas the Thirder view correctly identifies it as a potent form of evidence. The millionfold version differs in principle because it renders the 'no new information' defence absurd; while Beauty knew she would wake up, she did not know *which* of the potential million awakenings she would occupy, and that selection is informative.

  ### Centred vs. Uncentred Propositions

  Much of the dispute may be verbal, hinging on what "Beauty's credence in Heads" signifies. The Halfer often interprets this as the uncentred proposition: "The coin landed Heads." The Thirder interprets it as the centred proposition: "The coin landed Heads, and this is an awakening associated with that outcome."

  David Lewis, a prominent Halfer, argued that we must distinguish between the credence in the uncentred proposition (which remains $1/2$) and the credence in the centred proposition (which shifts). However, this distinction creates a fractured agent. When Beauty is asked for her credence, she is asked as an awakened subject. To provide an uncentred credence that ignores her centred location is to provide a number that is useless for her current decision-making.

  If credence is to be a guide to life, it must attach to propositions that matter to the agent *now*. The proposition "The coin landed Heads" matters to Beauty only insofar as it correlates with her current experience and potential rewards. Therefore, the best resolution distinguishes between the *objective chance* of the coin (which is $1/2$) and the *rational credence* of the agent (which is $1/3$). The question asks for the latter. To conflate objective chance with rational credence in self-locating contexts is a category error.

  ### Verdict

  Having weighed the arguments, the verdict must be in favour of the **Thirder** position.

  The Halfer view fails because it privileges a 'view from nowhere' over the agent's actual perspective. It treats Beauty as a disembodied soul observing the coin toss, rather than a physical being whose conscious experiences are causally linked to the outcome. The Pricing Test shows that Halfer credence leads to pragmatic loss, indicating a failure of rationality. The Extreme Test shows that Halfer credence requires ignoring overwhelming statistical evidence provided by the frequency of one's own existence.

  While the Double-Halfer offers a sophisticated technical defence regarding conditionalisation, it ultimately purchases consistency at the price of intuition, requiring us to accept that an agent can be certain she is in a specific type of situation without updating her beliefs about the causes of that situation.

  Credence is not merely a measure of the world's disposition; it is a measure of the agent's location within that world. Since Beauty's location is sampled more frequently in the Tails world, her rational credence must reflect that sampling bias. To do otherwise is to deny the evidentiary value of self-locating knowledge. Therefore, upon awakening, Beauty's credence that the coin landed Heads should be one third. The Halfer position, while comforting in its adherence to the coin's physical fairness, is epistemically blind to the nature of the observer.
