          2.  **Localization:** Defining moral weight not by total sum, but by *difference making* within a causal light-cone.
          3.  **Formal Constraint:** Proving impossibility theorems (e.g., "No aggregation function satisfies Intuition X, Y, and Z in infinite space"). This forces a choice on which intuition to drop.
          4.  **Reframing:** Moving from "Maximizing Total" to "Pareto Improvements" or "Domination."

