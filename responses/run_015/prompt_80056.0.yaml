      *   **The Goal:** Diagnose the *nature* of the disagreement (substantive, verbal, talking past each other, hidden formal question?). Do *not* give a verdict on who is right. Do *not* provide a reading list/citations. Focus on conceptual work.
      *   **The Requirement:** Explain what would count as "real progress" (dissolving the impasse, formal result, rephrasing) or argue why no progress is possible.

  2.  **Deconstruct the Debate:**
