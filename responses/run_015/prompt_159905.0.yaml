prompt: |-
  You are a philosopher of mind and epistemology who works on perception, and who has also done applied work on evidence assessment and research-integrity review. Please think carefully and work in two stages. First, brainstorm: lay out the distinctions from the literature on the cognitive penetration of perception that could matter here — penetration of experience versus penetration of judgment, reporting or response; whether a reported effect is better explained by task demands, imagery, or memory than by a change in what was seen; encapsulation and modularity, and the reply that apparent penetration shows up mainly under degraded, brief or ambiguous stimulus conditions; the difference between penetration by long-term perceptual learning and expertise and penetration by an occurrent belief, hope or desire about the very hypothesis at hand; the worry that an experience shaped by the belief it is supposed to confirm cannot give non-circular support; and the 2016 Behavioral and Brain Sciences review by Firestone and Scholl, which argued that the published reports of top-down effects on perception do not establish what they are taken to establish. Say explicitly which of these distinctions must survive being turned into a five-minute checklist for someone with no training in the field, and which should be dropped as unusable at the front line.

  Then write the procedure. I am the verification lead for a citizen-science biodiversity recording platform whose records feed a national species atlas, and that atlas is used for Red List assessments, for designating protected sites, and as evidence in planning decisions that are legally binding on landowners. My reviewers are volunteers with no psychology or philosophy background; they handle roughly three to four hundred verification decisions a week at about five minutes each, and any downgrade has to be defensible in a two-sentence note to the volunteer who submitted the record, many of whom are the same people we ask to go out again next week. I can also change what we collect at submission time, if that is where the real fix lies, so tell me which fields the form should capture. What I need is an ordered set of questions to run on a record, what counts as a sufficient answer to each, the points where the procedure stops and says no or downgrades the record to anecdotal or corroboration-only status, and the points where it hands the decision to a named human because the remaining question is one of values rather than facts — the asymmetric costs matter here, since a false positive record can freeze a housing development while a false negative can hide the collapse of a species that was already declining. Some of my reviewers think the answer is simply to require photographs; I do not think that settles it, because the photographer chooses what to frame and a photo is still classified by someone with expectations of their own.

  Please then run the procedure on three cases and show your work, not just the verdicts. First: an experienced volunteer with a long county listing history reports a rare vagrant warbler at a well-known migrant trap, eighteen hours after a rare-bird alert naming that species goes out to the local email list; a twelve-second view, no photograph, detailed written field notes, three further observers reporting the same bird later that day after the same alert; it would be a first county record and my communications team has already drafted the press release. Second: a novice submits a blurred photograph of one member of a well-known lookalike species pair, during a week in which the platform targeted her postcode with a prompt to look for that species. Third, at the level of the whole dataset rather than a single record: during weeks when we run those targeted prompts, reports of the target species rise by around forty per cent, and the prompt is my team's most-used engagement feature and appears in the deck we show funders. If the procedure says something about that third case that costs me a feature I built, I would rather hear it now than in the annual review. Finally, flag the cases the procedure cannot settle at all, be honest about which of its steps are judgment calls dressed up as procedure, and say plainly what this procedure must not be used for — including, I suspect, whether it may be used to tell a volunteer what they really saw rather than what their record is worth as evidence.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind/epistemology (perception focus) + Applied evidence assessment/research integrity.
      *   **Task:** Two stages.
          1.  *Brainstorm:* Lay out distinctions from cognitive penetration literature (experience vs. judgment, task demands, encapsulation, learning vs. occurrent belief, circularity, Firestone & Scholl 2016). Decide which survive into a 5-minute checklist for laypeople and which get dropped.
          2.  *Procedure:* Create a verification protocol for a citizen-science biodiversity platform (high stakes: Red List, legal planning). Constraints: Volunteers (no psych background), 300-400 records/week, 5 mins/record, 2-sentence feedback note. Must include form field changes. Must handle asymmetric costs (false positive vs. false negative).
          3.  *Application:* Run the procedure on three cases (Rare warbler + alert + notes; Novice + blurred photo + prompt; Dataset-level prompt effect). Show work.
          4.  *Limitations:* Flag unsettled cases, admit judgment calls, state what the procedure *must not* be used for (e.g., telling volunteers what they saw).

  2.  **Stage 1: Brainstorming & Filtering (The Philosophical Filter):**
      *   *Distinction 1: Experience vs. Judgment/Reporting.* (Did the belief change the *seeing* or just the *labeling*?)
          *   *Verdict:* Crucial for theory, useless for verification. We can't access raw experience. We only have the report. *Drop from checklist, keep in mind for form design.*
      *   *Distinction 2: Task Demands/Imagery/Memory vs. Perception.* (Is it a demand characteristic?)
          *   *Verdict:* Highly relevant. If the prompt suggests the answer, it's a demand characteristic. *Keep for checklist (Context/Prompting).*
      *   *Distinction 3: Encapsulation/Modularity vs. Degraded Stimuli.* (Does penetration only happen when vision is bad?)
          *   *Verdict:* Critical. Good evidence (photo/audio) reduces ambiguity. *Keep for checklist (Evidence Quality).*
      *   *Distinction 4: Long-term Learning vs. Occurrent Belief.* (Expertise vs. Hype.)
          *   *Verdict:* Crucial. Expertise usually increases reliability; occurrent desire (e.g., "I want this rare bird") decreases it. *Keep for checklist (Observer History vs. Immediate Context).*
      *   *Distinction 5: Circularity.* (Experience shaped by belief confirms belief.)
          *   *Verdict:* The core epistemic risk. *Translate into "Independence of Evidence."*
      *   *Distinction 6: Firestone & Scholl (2016).* (Most top-down effects are post-perceptual.)
          *   *Verdict:* Reassuring. It means we *can* trust perception generally, but need to guard against post-perceptual judgment errors. *Keep as guiding principle: Assume honesty, check for bias sources.*

      *   *Selection for Checklist:* Needs to be operational.
          *   Keep: Evidence quality (photo/audio vs. text), Independence (prior knowledge/alerts), Observer expertise (history), Ambiguity (lookalikes).
          *   Drop: Metaphysics of experience, modular encapsulation theory, specific cognitive mechanisms.

  3.  **Stage 2: Designing the Procedure (The Verification Protocol):**
      *   *Goal:* Defensible downgrades, 2-sentence notes, 5-minute limit.
      *   *Form Changes:* Need to capture *context* at submission, not just *content*.
          *   "Did you know this species was expected here before you saw it?" (Yes/No/Unsure)
          *   "What specific feature identified it?" (Dropdown + Free text)
          *   "Conditions?" (Light, Distance, Duration)
      *   *The Checklist (The "Epistemic Triage"):*
          1.  **Evidence Type:** Photo/Audio? (High confidence) vs. Visual only? (Medium) vs. Memory? (Low).
          2.  **Independence:** Prior alert/prompt? (Risk of bias).
          3.  **Ambiguity:** Lookalikes present? (Risk of error).
          4.  **Observer Track Record:** Known expert? (Trust weight) vs. Novice? (Scrutinize).
          5.  **Corroboration:** Independent witnesses?
      *   *Decision Nodes:*
          *   Green: Photo + No Prompt + Clear ID.
          *   Amber: Visual + Prompt OR Lookalike + Expert. -> Needs Human Review.
          *   Red: Visual + Prompt + Lookalike + Novice. -> Downgrade to "Unverified/Anecdotal."
      *   *Asymmetric Costs:* False Positive (Development freeze) is high cost. False Negative (Species collapse) is high cost but harder to prove. *Policy:* If high stakes (protected site), require higher evidence threshold.
      *   *Values vs. Facts:* When does it go to a human? When the cost of error involves legal/financial harm (Planning decision).

  4.  **Stage 3: Running the Cases:**
      *   *Case 1 (Warbler):* Expert, Rare, Alert existed, No photo, Corroboration later.
          *   *Analysis:* High expertise helps, but Alert creates "occurrent belief" risk. No photo = ambiguous stimulus. Corroboration is tainted (same alert).
          *   *Verdict:* Downgrade to "Probable" but not "Confirmed" for legal/Red List use. Press release needs caution.
      *   *Case 2 (Novice/Blur/Pair):* Novice, Blurred photo, Lookalikes, Prompt active.
          *   *Analysis:* Perfect storm of cognitive penetration risk. Prompt + Ambiguity + Low Expertise + Poor Evidence.
          *   *Verdict:* Downgrade to "Needs Corroboration." Note focuses on ID features, not honesty.
      *   *Case 3 (Dataset/Prompts):* 40% rise with prompts.
          *   *Analysis:* This is the Firestone & Scholl point. Task demands drive reporting, not necessarily abundance.
          *   *Verdict:* Flag data as "Prompt-Influenced." Cannot use for population trends without statistical correction. Keep feature but label data.

  5.  **Stage 4: Limitations & Ethics:**
      *   *Judgment Calls:* Weighting expertise vs. evidence.
      *   *Must Not Use:* Telling volunteers they are lying or hallucinating. It's about *evidential weight*, not *phenomenological truth*.
      *   *Honesty:* Acknowledge that this doesn't solve the philosophical problem, it manages the risk.

  6.  **Refining the Tone:**
      *   Needs to be authoritative but practical.
      *   Philosophical concepts must be translated into operational language (e.g., "Cognitive Penetration" -> "Prior Knowledge Influence").
      *   Respect the volunteers (they are partners, not subjects).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 1:* The prompt says 3 further observers reported *later*. Are they independent? If they heard the alert, they are contaminated. I need to make sure the procedure checks for *independent* discovery.
      *   *Self-Correction on Form:* Don't make the form too long. Just the critical bias-check questions.
      *   *Self-Correction on Feedback:* The 2-sentence note is hard. Must be polite. "We need more ID features" not "You're biased."

  8.  **Final Review against Constraints:**
      *   5-minute checklist? Yes.
      *   2-sentence note? Yes.
      *   Form fields identified? Yes.
      *   Three cases run with work shown? Yes.
      *   Limitations flagged? Yes.

  9.  **Final Polish:** Ensure the distinction between "what they saw" and "evidential value" is sharp. (This is the core philosophical contribution).

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* academic in the procedure section. The volunteers are citizens. The language must be "Verification Lead" speaking to "Reviewers."

  *(Final check on Firestone & Scholl)*: Their main point is that many "perception" effects are actually decision/judgment effects. I need to ensure the procedure distinguishes between "I saw a bird" (Perception) and "I saw a *Warbler*" (Judgment). The procedure should focus on the latter.

  Let's assemble.
answer: |-
  ## Stage 1: Brainstorming & Filtering Distinctions

  As a philosopher of mind working on evidence integrity, I must separate theoretical nuance from operational utility. The literature on cognitive penetration (the idea that beliefs/desires can alter perceptual experience itself) is fraught with debates that cannot be resolved in a five-minute verification window. Here is the triage of concepts:

  **Distinctions to DROP (Unusable at the Front Line):**
  *   **Experience vs. Judgment Penetration:** We cannot access the volunteer's raw phenomenology ("what it looked like to them"). We only have their report. Whether their *experience* was penetrated or just their *judgment* is metaphysically interesting but evidentially irrelevant to us; both result in a potentially unreliable record.
  *   **Modularity/Encapsulation:** Whether the visual system is "encapsulated" from cognition is a theoretical claim about brain architecture. It doesn't help a reviewer decide if a blurred photo is a Skylark or a Meadow Pipit.
  *   **Long-term Learning vs. Occurrent Belief (Theoretical):** While the distinction matters for science, for verification, both result in the same risk: the observer sees what they expect. We can track expertise (learning) via history, but we cannot easily measure the strength of an occurrent desire in the moment. We must treat them as compounding risk factors.
  *   **Firestone & Scholl's Specific Mechanisms:** Their 2016 argument that top-down effects are often post-perceptual (memory, decision, reporting) is reassuring (it means vision is robust), but we cannot audit a volunteer's memory processes. We must assume the risk exists regardless of the mechanism.

  **Distinctions to KEEP (Operationalized for the Checklist):**
  *   **Stimulus Ambiguity (Degraded Conditions):** Cognitive penetration is most likely when the signal is weak. *Operationalization:* Evidence quality (Photo/Audio > Text > Memory) and Conditions (Distance/Light).
  *   **Independence of Evidence (Circularity):** If the belief generating the report is the same belief the report is meant to support, the evidence is circular. *Operationalization:* Prior knowledge of alerts/prompts.
  *   **Task Demands (Prompting):** If the system asks "Did you see X?", reporting X becomes a compliance task, not an observation. *Operationalization:* Flagging records submitted during targeted prompts.
  *   **Expertise vs. Hype:** Expertise generally reduces error rates (perceptual learning), but high stakes + rarity + desire increases bias risk. *Operationalization:* Observer history combined with species rarity.

  ***

  ## Stage 2: The Verification Procedure

  **To:** Verification Team
  **From:** Verification Lead
  **Subject:** Epistemic Triage Protocol (ETP-v1)

  **Context:** Our records inform legal protections and species survival. A False Positive (FP) halts development; a False Negative (FN) hides extinction. We cannot eliminate error, but we must tag risk. We are not judging the *volunteer's honesty*; we are judging the *record's evidential weight*.

  ### Part A: Submission Form Changes
  *To capture context at the source, add these mandatory fields to the submission form:*
  1.  **Prior Knowledge:** "Before this sighting, did you know this species was reported nearby or expected this week?" (Yes / No / Unsure).
  2.  **Identification Features:** "Select the primary feature used for ID" (Dropdown: Song, Wingbar, Tail pattern, Behavior, General Shape) + "Brief description" (Free text).
  3.  **Search Context:** "Was this sighting during a targeted survey or prompt?" (Auto-filled if applicable, but visible to reviewer).

  ### Part B: The 5-Minute Triage Checklist
  *Reviewers run these 5 questions in order. If a "Stop" condition is met, apply the verdict and draft the note.*

  **Q1. Is there objective media (Photo/Audio) that captures the diagnostic feature?**
  *   *Yes:* Proceed to Q2.
  *   *No:* **STOP.** Downgrade to "Visual Record Only." *Exception:* If Observer is "Accredited Expert" (Top 5% history) AND species is common.
  *   *Note Logic:* Focus on evidence, not person. "Great sighting. For Red List use, we require photo/audio of diagnostic features for this species."

  **Q2. Was there Prior Knowledge (Alert/Prompt) before the sighting?**
  *   *No:* Proceed to Q3. (High Independence).
  *   *Yes:* **Risk Flag.** Proceed to Q3, but apply "Bias Penalty" (requires higher evidence threshold).
  *   *Note Logic:* "Thanks. As this species was recently alerted in your area, we need independent corroboration for Atlas status."

  **Q3. Are there plausible lookalike species in this location/season?**
  *   *No:* Proceed to Q4.
  *   *Yes:* **Ambiguity Flag.** If Media is blurred/obscured, **STOP.** Downgrade to "Needs Corroboration."
  *   *Note Logic:* "This species pairs with [Lookalike]. The photo doesn't show [Feature] needed to distinguish them."

  **Q4. Does the Observer's History support this ID?**
  *   *High Volume/Accuracy:* Trust weight +1.
  *   *Novice/First Record of Species:* Trust weight -1.
  *   *Note Logic:* (Usually internal, no note needed unless downgrading).

  **Q5. Is this record being used for High-Stakes Decision (Planning/Red List)?**
  *   *No:* Accept as "Community Verified."
  *   *Yes:* **Human Escalation.** If Q2 or Q3 were flagged, this record cannot be used as sole evidence. Send to Senior Biologist.
  *   *Note Logic:* (Internal flag).

  ### Part C: Decision Nodes & Asymmetric Costs
  *   **False Positive Risk (High Cost):** If the record triggers legal protection (Planning), the threshold is "Objective Media + No Prior Knowledge" OR "3 Independent Observers + Expert Verification."
  *   **False Negative Risk (High Cost):** If the record suggests species collapse, do *not* reject solely on lack of photo if the observer is expert. Tag as "Unverified Presence" to trigger targeted survey, rather than discarding.

  ### Part D: The Values Handoff
  *   **Fact Question:** "Is this a Skylark?" (Reviewers decide).
  *   **Value Question:** "Is this evidence strong enough to stop a housing development?" (Senior Biologist/Legal Team decides).
  *   *Procedure:* If a record is "Community Verified" but lacks "Legal Grade" evidence, the system auto-tags it: *'Ecological Value: High. Evidential Weight: Low. Do not use for statutory notification.'*

  ***

  ## Stage 3: Running the Cases

  ### Case 1: The Rare Vagrant Warbler
  *   **Inputs:** Expert Observer, Rare Species, Alert issued 18h prior, No Photo, Notes detailed, 3 later observers (same alert).
  *   **Procedure Run:**
      *   Q1 (Media): No. **Downgrade to Visual Only.** (Exception: Expert status allows "Community Verified" but not "Legal Grade").
      *   Q2 (Prior Knowledge): Yes (Alert 18h prior). **Bias Penalty Applied.** The "occurrent belief" risk is high. The detailed notes may be confabulated to fit the alert.
      *   Q3 (Lookalikes): Warblers are notoriously ambiguous. **Ambiguity Flag.**
      *   Q5 (High Stakes): Press Release/Atlas Record.
  *   **Verdict:** **Downgrade to "Probable (Non-Verified)."** Do not use for Atlas/Red List. Do not issue Press Release as "Confirmed."
  *   **Work/Reasoning:** The lack of media under degraded conditions (12 seconds) combined with a specific prior alert creates a high risk of cognitive penetration (seeing what was expected). The three later observers are not independent; they are contaminated by the same alert (circular evidence).
  *   **2-Sentence Note:** "Thank you for this detailed report. As this species was alerted locally prior to your sighting and no photo was captured, we have classified this as 'Probable' pending independent photographic evidence."

  ### Case 2: The Novice & The Blurred Lookalike
  *   **Inputs:** Novice, Blurred Photo, Lookalike Pair, Targeted Prompt active.
  *   **Procedure Run:**
      *   Q1 (Media): Yes, but Blurred. (Does it show diagnostic feature? No).
      *   Q2 (Prior Knowledge): Yes (Targeted Prompt). **Bias Penalty Applied.** This is a "Task Demand" effect.
      *   Q3 (Lookalikes): Yes. **Ambiguity Flag.**
      *   Q4 (History): Novice. **Trust Weight -1.**
  *   **Verdict:** **Downgrade to "Anecdotal."** Do not count toward population trends.
  *   **Work/Reasoning:** This is the "perfect storm" for Firestone & Scholl style errors. The prompt created a demand characteristic ("Find this bird"), the ambiguity allowed the belief to fill the gap, and the expertise wasn't there to resist it.
  *   **2-Sentence Note:** "Thanks for submitting. The photo doesn't show the [Specific Feature] needed to separate this from [Lookalike], so we've marked it as 'Anecdotal' until a clearer ID is possible."

  ### Case 3: The Dataset & The Prompt Feature
  *   **Inputs:** 40% rise in reports during prompts. Prompt is key for engagement/funding.
  *   **Procedure Run:**
      *   This is a systemic Q2 (Prior Knowledge) failure. The prompt *is* the prior knowledge.
      *   **Analysis:** The 40% rise is likely epistemic noise (reporting bias), not biological signal. Using this data for Red List trends would be scientifically dishonest.
      *   **Verdict:** **Keep the Feature, Tag the Data.**
      *   **Action:** All records submitted within 48 hours of a specific species prompt are auto-tagged: *'Prompt-Influenced Record.'*
      *   **Policy:** Prompt-influenced records are excluded from population trend analysis (Red List) but included in "Distribution/Presence" maps (with a legend warning).
      *   **Funder Deck:** "Our engagement prompts increase detection rates by 40%. We statistically correct for this bias in conservation assessments to ensure data integrity." (Turns a bug into a feature of rigorous methodology).

  ***

  ## Stage 4: Limitations & Ethical Flags

  **What This Procedure Cannot Settle:**
  1.  **The "True" Experience:** We cannot tell a volunteer, "You didn't see that." We can only say, "This record does not meet the evidential standard." The procedure manages *testimony*, not *perception*.
  2.  **The "Expert" Exception:** We rely on history to proxy expertise. An expert can have a bad day or be biased by a rare bird alert. The procedure mitigates this but cannot eliminate it without media.
  3.  **Independent Corroboration:** In Case 1, we assumed later observers were contaminated. In reality, one might have found it independently. We lack the granularity to know without interviewing them, which violates the 5-minute rule.

  **Judgment Calls Dressed as Procedure:**
  *   **Diagnostic Feature Sufficiency:** Determining if a blurred photo shows enough detail (Q1/Q3) is subjective. Reviewers will disagree. *Mitigation:* Provide a "Reference Library" of minimum acceptable photos for lookalike pairs.
  *   **High-Stakes Threshold:** Deciding which records trigger the "Legal Grade" threshold is a policy decision, not a factual one. I have placed this at Q5, but the boundary is porous.

  **What This Procedure MUST NOT Be Used For:**
  1.  **Accusations of Dishonesty:** Never imply the volunteer is lying. The language must remain focused on *evidence quality* ("The photo does not show...") rather than *observer reliability* ("You might be biased...").
  2.  **Phenomenological Policing:** Do not use this to tell volunteers what they *really* saw. If a volunteer insists they saw a Warbler, and we downgrade the record, we are saying "We cannot *verify* that," not "You are *wrong*."
  3.  **Suppressing Rare Records:** Do not use the "Prior Knowledge" flag to automatically reject rare birds. Rare birds are often found *because* people look for them. The fix is requiring higher evidence (media), not rejecting the report.

  **Final Philosophical Note:**
  We are acknowledging that perception is not a mirror of nature, but a construction. By capturing the context of that construction (prompts, alerts, expertise), we turn a potential source of error into metadata that strengthens the overall integrity of the atlas. We are not filtering out the "human element"; we are documenting it.
