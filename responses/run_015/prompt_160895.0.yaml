answer: |-
  There is no canonical term for this specific trajectory, though it sits within debates on moral testimony. The literature typically treats deference as static—either permissible or impermissible—ignoring the temporal dimension you identify. Let us carve it as **Propaedeutic Deference**.

  Propaedeutic deference is the provisional acceptance of a moral verdict on trust, adopted specifically as a cognitive scaffold to cultivate the capacity for direct moral perception. The line between this and ordinary moral trust is teleological. Ordinary trust treats the verdict as a terminus: you believe *p* because the testifier said so, and you act. Propaedeutic deference treats the verdict as an instrument: you believe *p* on their word *in order to* learn to see *p*. The former substitutes judgment; the latter constructs it. In ordinary trust, the testifier's authority replaces your own. In propaedeutic deference, their authority temporarily suspends your own to repair it. The distinction lies in the intended lifespan of the borrowing: ordinary trust intends permanence without understanding; propaedeutic deference intends its own obsolescence through understanding.

  Boundary cases:
  (a) **Causal Coincidence:** Lacks the intentional structure. You notice later, but the trust was not adopted *as* a lens.
  (b) **New Vocabulary:** This provides concepts, not verdicts. Propaedeutic deference uses a verdict to recalibrate perception of existing concepts.
  (c) **Indoctrination:** The loop is closed; verification is forbidden. Propaedeutic deference requires eventual independent verification to succeed.
  (d) **Pragmatic Acceptance:** You withhold belief to keep peace. Without belief, the lens cannot form.
  (e) **Non-Moral Facts:** You infer the conclusion using existing rational capacities. Propaedeutic deference recalibrates the capacities themselves.

  The structure exists outside morality, most clearly in aesthetics. A critic says a novel is profound; you accept this, read again, and eventually see the profundity. This suggests the epistemic structure is not uniquely moral. However, the moral case retains specialness due to stakes. In aesthetics, failing to see the value is a loss of appreciation; in morality, failing to see the harm (like your physician) is a continuation of harm. The trajectory is general, but the urgency is moral. The physician's failure was not just a lack of taste but a violation of duty enabled by epistemic isolation.

  Regarding normative status: if borrowing is a route to first-hand grasp, the borrowing is **permissible**, not merely excusable. The standard objection to moral deference is that it bypasses autonomy. But if deference is the mechanism by which autonomy is achieved, the objection collapses. The grasp at the end is fully the borrower's own. Autonomy is not a precondition for moral judgment but an achievement facilitated by epistemic community. The physician's error was treating autonomy as a starting constraint rather than an end goal. The student's success validates the borrowing: she did not remain dependent; she used the dependence to become independent. Thus, the verdict is hers because she rebuilt the capacity to judge it. The borrowing was the ladder she kicked away upon climbing. To demand first-hand grasp before listening is to demand the end before the means; propaedeutic deference recognizes that in moral life, as in language, we must speak borrowed words before we can write our own.
