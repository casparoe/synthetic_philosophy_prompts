answer: |-
  **DOCUMENT: JOINT STATEMENT ON THE PRACTICE OF HOLDING RESPONSIBLE**
  **Signatories:** Working Group on Moral Responsibility (Strawsonian & Hard Incompatibilist Camps)
  **Date:** [Redacted]
  **Status:** Draft for Publication

  ***

  ### 1. AGREED CLAIMS (PHENOMENOLOGY AND PRACTICE)

  *Editor's Note: The following claims represent points of empirical and phenomenological consensus found in the contemporary literature (e.g., Strawson 1962; Pereboom 2001; Wallace 1994). Where wording synthesizes distinct metaphysical commitments into a shared description of practice, this is flagged with [Synthesis].*

  1.  **The Centrality of Reactive Attitudes:** The practices of blaming and praising are constituted largely by a suite of emotional dispositions we term "reactive attitudes" (e.g., resentment, indignation, guilt, gratitude). These are not merely add-ons to judgment; they are the primary medium through which we experience moral demands. [Consensus]
  2.  **Exempting Conditions:** In actual practice, these attitudes are systematically suspended or modified when specific "exempting conditions" are identified. These include severe psychological disturbance, extreme coercion, infancy, and ignorance not attributable to negligence. Both camps agree that when these conditions are met, the *practice* of blaming typically ceases, even if the harmful outcome remains. [Consensus]
  3.  **Quality of Will vs. Outcome:** Everyday attributions of blame track "quality of will" (intentions, regard for others, negligence) significantly more than they track raw outcomes. Two agents causing identical harm are treated differently if one acted with malice and the other with pure accident. [Consensus]
  4.  **The Role of "Could Have Done Otherwise":** In ordinary interpersonal exchanges, the explicit metaphysical question of whether an agent "could have done otherwise" (in a libertarian or categorical sense) is rarely raised, nor does its absence typically halt the reactive attitudes. The practice proceeds without verifying alternative possibilities. [Synthesis: Camp A interprets this as irrelevance; Camp B interprets this as systematic error.]
  5.  **The Non-Option of Global Objectivity:** It is psychologically and socially unsustainable for human beings to adopt the "objective attitude" (viewing others purely as objects to be managed) universally. We cannot maintain intimate or cooperative relationships while viewing all participants as determined systems devoid of moral address. [Consensus on phenomenology; disagreement on normative implication.]

  ***

  ### 2. DISAGREEMENTS TABLE (TRANSLATION PROTOCOL)

  *Editor's Note: The following rows describe the same fault line. The left column uses vocabulary compatible with Camp A (Strawsonian/Compatibilist). The right column uses vocabulary compatible with Camp B (Hard Incompatibilist). Rows marked [Verbal] indicate disputes that may rest primarily on definitional choices rather than substantive predictions about the world.*

  | Row | Camp A Formulation (Strawsonian) | Camp B Formulation (Hard Incompatibilist) | Status |
  | :--- | :--- | :--- | :--- |
  | **1. The Ground of Blame** | Reactive attitudes are **constitutive** of responsibility. To participate in human relationships *is* to be susceptible to these demands. No further metaphysical grounding is required or possible. | Reactive attitudes are **psychological habits** that presuppose a metaphysical status (basic desert) that does not exist. The practice requires revision to align with causal reality. | Substantive |
  | **2. The Objective Attitude** | The objective attitude is a **retreat** from relationships. It is useful for therapy or management but represents a failure of moral engagement if applied to normal agents. | The objective attitude is a **correction** of injustice. Applying it universally is the only way to ensure fairness, as no one ultimately deserves the hostile sting of blame. | Substantive |
  | **3. Desert** | The demand for goodwill implicit in resentment **entails** a form of desert. If you violate the demand, you merit the negative reaction. | The feeling of desert is an **illusion** generated by the attitudes. We can keep the judgment of "wrong" without the claim that the agent *deserves* suffering in return. | [Verbal]* |
  | **4. Freedom** | Freedom is **compatible** with causation. It is defined by the ability to respond to reasons and participate in the moral community. | Freedom (of the sort required for basic desert) is **incompatible** with causation. Since causation is universal, basic desert is impossible. | Substantive |

  *\*Note on Row 3: While flagged [Verbal], this masks a substantive disagreement about whether "desert" can be decoupled from "suffering." Camp A says no; Camp B says yes.*

  ***

  ### 3. CRUXES AND PREDICTIONS

  *Editor's Note: The following cases are designed to force divergence. The "Case Description" is agreed upon. The "Predictions" are recorded prior to observation. Where the literature does not explicitly cover these specific thought experiments, the predictions are extrapolated from core principles.*

  #### Case A: The Triage-Model Grudge
  **Description:** A hospital deploys a Machine Learning triage system. It is opaque (no specific human designer can be pinpointed for specific errors) and non-sentient. It systematically deprioritizes a specific demographic due to training data bias. Staff know the system has no beliefs or will. Nevertheless, staff report feeling intense resentment toward the system, shouting at terminals, and demanding it "do better."

  | Camp | Diagnosis | Prediction |
  | :--- | :--- | :--- |
  | **A (Strawsonian)** | This is a **category mistake**. Reactive attitudes are addressable only to participants in the moral community. The resentment is misfiring. | The grudge will **extinguish quickly** (within weeks) once the "non-agent" status is emotionally integrated. It will be replaced by frustration (an objective attitude emotion) directed at the *administrators* who deployed it. |
  | **B (Incompatibilist)** | This shows blame is a **functional tool**, not a metaphysical claim. We blame things that block our goals to force correction, regardless of "will." | The grudge will **persist** as long as the system remains opaque and harmful. It will only be replaced by a new management protocol (quarantine/patching), not by shifting resentment to humans. The "demand" is purely forward-looking. |

  #### Case B: Engineered Serenity
  **Description:** A safe, cheap drug ("Serenex") is developed. It blocks the neural correlates of resentment and indignation completely. It leaves intact all cognitive beliefs about harm, causation, and rule-violation. A subject takes Serenex, witnesses a deliberate betrayal, and identifies the betrayer accurately.

  | Camp | Diagnosis | Prediction |
  | :--- | :--- | :--- |
  | **A (Strawsonian)** | This is **dehumanization**. Without the susceptibility to resentment, the subject cannot fully participate in moral relationships. They have lost the capacity to hold others responsible. | The subject will **stop making demands**. They will treat the betrayer as a patient or a hazard. Relationships will become managerial. The subject will report feeling "isolated" from the moral community. |
  | **B (Incompatibilist)** | This is **moral progress**. The subject retains the judgment of "wrong" but loses the retributive sting. This is the ideal state of moral protest without desert. | The subject will **continue making demands** (e.g., "Do not do this again," "Make restitution"), but these will be framed as safety requirements, not payback. Relationships will become safer and less volatile. |

  #### Case C: The Repentant Determinist [Extrapolated]
  **Description:** A convicted criminal, fully convinced by Hard Incompatibilist arguments (Camp B), accepts they could not have done otherwise. However, they feel deep guilt and offer restitution to victims, claiming they want to "repair the relationship."

  | Camp | Diagnosis | Prediction |
  | :--- | :--- | :--- |
  | **A (Strawsonian)** | This is **genuine responsibility**. By engaging in guilt and repair, the agent is re-entering the moral community. Their metaphysical beliefs are irrelevant to their status as an agent. | The victims will **accept the restitution** as meaningful blame-resolution. The practice works despite the agent's incompatibilist theory. |
  | **B (Incompatibilist)** | This is **confused but beneficial**. The guilt is metaphysically unfounded, but the forward-looking behavior (restitution) is socially optimal. | The victims will **accept the restitution**, but Camp B argues we should encourage the agent to drop the "guilt" label and call it "responsibility-as-obligation" to prevent future psychological harm. |

  ***

  ### 4. META-ANNOTATION ON CONSENSUS VS. INVENTION

  *Per the request to distinguish settled literature from synthesis:*

  1.  **Settled Literature:** Section 1, Claims 1, 2, and 3 are standard fare in the philosophy of responsibility (Strawson's *Freedom and Resentment* plus subsequent empirical work by Nichols, Knobe, etc.). Section 2, Row 4 is the standard definition of the Compatibilist/Incompatibilist split.
  2.  **Synthesis/Extrapolation:** Section 1, Claim 4 ("Could Have Done Otherwise") is a synthesis. Camp A argues laypeople *don't need* libertarian freedom; Camp B argues laypeople *think they have it* but are wrong. The agreement that they "don't check for it" is a pragmatic middle ground I have formulated for this document.
  3.  **Invention:** Section 3 (Cruxes) contains thought experiments constructed for this specific prompt. While they utilize standard tropes (the "psychopath" or "determined agent"), the specific predictions regarding the *duration* of the Triage Grudge or the *behavior* of the Serenex user are extrapolations based on the logical endpoints of each theory, not reported empirical data.
  4.  **Non-Vacuous Check:** Claim 5 in Section 1 is the strongest non-vacuous agreement. Camp B *wants* the objective attitude to be the norm; Camp A says it's impossible. They agree only on the *current psychological fact* that we can't sustain it, not on whether we *should*. This preserves the conflict while allowing a signature.
