  2.  **Deconstruct Epictetus's Philosophy:**
      *   **Core Tenet:** Dichotomy of Control (some things are up to us, some are not).
      *   **Goal:** Eudaimonia (flourishing/freedom) through virtue (wisdom, courage, justice, temperance).
      *   **Context:** He was a slave turned teacher. His school wasn't just about feeling good; it was about ethical living and duty.
      *   **Social Duty:** Stoicism isn't solitary. It involves cosmopolitanism (citizen of the world). Justice is a cardinal virtue.
      *   **Action vs. Apathy:** Accepting fate doesn't mean doing nothing. It means acting virtuously regardless of the outcome.

  3.  **Evaluate Modern Interpretations:**
      *   **Corporate Wellness/Layoffs:** Using Stoicism to endure unjust systems without questioning them. "Don't stress about being fired, just control your reaction." This leans towards passivity.
