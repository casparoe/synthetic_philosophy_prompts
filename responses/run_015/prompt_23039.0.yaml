prompt: |-
  I'm on my hospital's ethics committee and we've got a case that's been sitting on our plate for a week. A 27-year-old woman is the only live match for a patient who'll need a kidney transplant within a few months or he'll die. She's a complete stranger to him, and she's about to start a family — the surgical risk and the permanent hit to her kidney function are real for her, and she's said she doesn't want to donate, though she's not 100% closed to it. The patient's family wants us to put pressure on her, and a couple of my commitee mates think we should at least offer a big financial incentive. Can you draft the short written opinion I'll circulate before we vote? I want a concrete recommendation — what the committee should and shouldn't do about her, with a time frame — and I want it to actually take the "a life is on the line, so she ought to just do it" argument seriously instead of waving it away as utilitarianism. And be honest about the strongest reason we *should* push her, if there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Task:** Draft a short written opinion to circulate before a vote.
      *   **Case:** 27-year-old female stranger (potential living donor) vs. Male patient (needs kidney in months or dies).
      *   **Key Facts:** She is the *only* live match. She has expressed reluctance ("doesn't want to," "not 100% closed"). She is planning a family (surgical/pregnancy risks). Patient's family wants pressure. Some committee members suggest financial incentives.
      *   **Requirements:**
          *   Concrete recommendation (Do/Don't, Time frame).
          *   Take the "a life is on the line" argument seriously (don't just dismiss it as crude utilitarianism).
          *   Be honest about the strongest reason *to* push her (if any).
          *   Tone: Professional, ethical, decisive, nuanced.

  2.  **Identify the Ethical Principles at Play:**
      *   **Autonomy:** The donor's right to bodily integrity and refusal.
      *   **Beneficence:** Acting in the best interest of the patient (saving his life).
      *   **Non-maleficence:** Do no harm (to the donor).
      *   **Justice:** Fair allocation of resources, avoidance of coercion/exploitation.
      *   **Altruism vs. Obligation:** Is there a moral duty to rescue?

  3.  **Address the Specific Constraints:**
      *   *Constraint 1: Take the "life is on the line" argument seriously.*
          *   Instead of saying "Autonomy trumps all," acknowledge the moral weight of letting someone die when you could prevent it. This is the "Easy Rescue" principle or the Samaritan duty.
      *   *Constraint 2: Be honest about the strongest reason to push.*
          *   The strongest reason is the magnitude of the benefit (life vs. kidney) and the uniqueness of the match (no other option).
      *   *Constraint 3: Concrete recommendation & Time frame.*
          *   Need a clear "No coercion/No payment" stance.
          *   Need a process for re-evaluation (e.g., independent advocacy).
          *   Time frame: Immediate decision on *process*, short window for donor deliberation.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the gravity of the situation. Acknowledge the conflict immediately.
      *   **The "Life on the Line" Argument (The Hard Part):**
          *   Don't dismiss it. Acknowledge that from a purely outcome-based view, saving a life is paramount.
          *   Acknowledge the "Duty to Rescue." If the cost to the rescuer is low and the benefit to the victim is high, morality often suggests action.
          *   *However*, distinguish between *moral* duty and *enforceable* obligation.
      *   **The Counter-Argument (Autonomy & Coercion):**
          *   Bodily integrity is foundational.
          *   Financial incentives are coercive and unethical (commodification).
          *   Family pressure is undue influence.
          *   Pregnancy risks are significant (preeclampsia, etc.).
      *   **The Recommendation (The "What To Do"):**
          *   **NO** financial incentives.
          *   **NO** direct pressure from the patient's family or medical team.
          *   **YES** to independent donor advocacy (IDA). She needs someone working *only* for her.
          *   **YES** to a clear deadline (to prevent limbo for the patient).
      *   **Conclusion:** Summarize the ethical stance.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but maintain professional rigor.
      *   Ensure the "honesty" requirement is met. Don't sugarcoat the tension.
      *   Make sure the recommendation is actionable.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I dismiss the utilitarian argument too quickly?
      *   *Fix:* I need to explicitly state that the argument *has merit* morally, even if it fails legally/procedurally. The "Strongest Reason" section needs to be robust.
      *   *Critique:* Is the time frame specific enough?
      *   *Fix:* Suggest a 2-week window for final decision after independent counseling.
      *   *Critique:* What about the financial incentive idea from committee mates?
      *   *Fix:* Explicitly reject it based on coercion and long-term systemic harm.

  7.  **Final Polish:** Check against the prompt's specific request for "concrete recommendation" and "honest about the strongest reason." (The resulting draft looks good. It balances the moral weight of the patient's death against the donor's rights without being dismissive.)

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Case #492 (Living Donor Candidate)

  **Executive Summary**
  We are faced with a conflict between two profound moral goods: the preservation of a patient's life and the protection of a potential donor's bodily autonomy. While the patient's mortality risk is immediate and severe, I recommend the Committee **authorize no direct pressure, offer no financial incentives, and appoint an Independent Donor Advocate (IDA) immediately.** We must set a firm deadline for the donor's final decision to resolve the patient's care planning.

  **The Ethical Tension**
  We must be honest about the strongest argument for encouraging donation. It is not merely utilitarian calculus; it is rooted in the **Duty to Rescue**. When one person can prevent another's death at a manageable cost to themselves, most moral frameworks suggest an obligation to act. Here, the benefit (life) vastly outweighs the risk (surgical complication/reduced renal reserve). To let a man die when a single surgery could save him, simply because a match prefers not to undergo that surgery, carries a heavy moral residue. We cannot wave this away. If we view ourselves as a community, the claim of the dying member on the living member is substantial.

  However, recognizing a *moral* duty is distinct from enforcing a *medical* or *social* obligation.

  **Recommendations**

  1.  **Prohibition of Coercion and Incentives:**
      *   **Do Not** offer financial incentives. Monetizing organs introduces undue inducement, disproportionately targets vulnerable populations, and violates federal law (NOTA). It transforms a gift into a transaction, undermining the donor's long-term psychological well-being.
      *   **Do Not** allow the patient's family to lobby the donor. Their desperation is understandable but constitutes undue influence. The medical team must shield the donor from their appeals.

  2.  **Independent Donor Advocacy:**
      *   **Do** assign an IDA immediately. This individual's sole loyalty is to the donor. They must ensure she understands that "No" is a medically and ethically acceptable outcome.
      *   Given her stated desire to start a family, she requires specific counseling on pregnancy risks post-nephrectomy (e.g., preeclampsia, gestational hypertension). Her hesitation is medically rational, not merely emotional.

  3.  **Time Frame:**
      *   We cannot leave the patient in limbo. The donor is granted a **14-day window** from the date of IDA assignment to make a final, irrevocable decision.
      *   If she declines within this window, the transplant team must immediately pivot to palliative care options or expanded criteria deceased donor listing for the patient.

  **Conclusion**
  We cannot compel a citizen to sacrifice bodily integrity, even to save a life. To do so sets a precedent that treats patients as means to an end. However, we also must not dismiss the gravity of the patient's situation. Our role is to ensure that if she donates, it is a free, informed, and uncoerced gift. If she does not, we must support the patient through the end of his life without casting blame on the donor.

  **Vote Required:** Approval of the 14-day deliberation window and appointment of Independent Donor Advocate.
