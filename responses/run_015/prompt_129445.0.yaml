answer: |-
  The hum of the seawater filters was the only sound in the lab, aside from the scratch of Priya's pen against her notebook. The coffee had developed a skin hours ago. Between them, under the dissecting scope, sat a lantern raft, its translucent bell pulsing weakly in the tank.

  "It comes down to the keel," Priya said, tapping the glass. "You want to say its function is funneling prey because it currently sheds that vortex. But historically? That ridge is a ghost. It was selected for swimming efficiency in the ancestors. Now they don't swim. The selection pressure for swimming vanished fifty thousand generations ago. The selection for funneling is barely detectable. So on my view, the keel is functionally obsolete. It's a spandrel waiting to crumble."

  Marcus leaned over the scope, adjusting the focus until the stiffened ridge came into sharp relief. "And that's why your view breaks when you try to do actual physiology. If I'm analyzing the feeding system of the lantern raft *now*, the keel contributes to prey capture. It sheds a low-pressure vortex. The polyps get food. That is its causal role. Whether its great-grand-swimming-ancestors cared about that ridge is irrelevant to how the colony survives today."

  "But 'function' isn't just 'effect'," Priya countered. "If it were, the heart's function would include making thumping noises and casting a shadow inside the thorax. You need a filter. History provides the filter. The keel's function was swimming. It lost that function when the behavior stopped. It hasn't earned the new function of funneling yet because the selection history is too weak. You're calling it a function because you *want* it to be one."

  "And you're denying it's a function because of a ghost story," Marcus shot back. "But fine, let's meet in the middle. I know you etiologists have been retreating from 'original selection' to 'maintaining selection.' So, admit the swimming function is gone. But admit that if the funneling effect is currently being selected for, even weakly, it counts. Otherwise, you can't explain why the trait persists."

  Priya sighed, rubbing her temples. "Okay. I'll concede that. Origin isn't enough; it needs maintaining selection. If the funneling effect is why the keel is still here *now*, then it's a function. But here's the cost: 'Currently' is arbitrary. Are we talking about the last ten generations? The last thousand? If I pick a timescale where selection was strong, it's a function. If I pick one where it was noisy, it's not. That means the function status depends on how I carve up time. It sneaks the investigator's interests back in. I wanted functions to be objective facts about the world, not dependent on my sampling window."

  "Everything depends on sampling windows," Marcus said. "But look at the frill." He pointed to the neighboring tissue. "Historically, that was for brooding. They don't brood externally anymore. But now it generates a better vortex than the keel. It's under strong selection for funneling. On your view, does the frill have to wait in the waiting room until it accumulates enough 'generations of selection' before we can say its function is feeding? That seems absurd. It's doing the work *now*."

  "It's not absurd, it's cautious," Priya said. "If we call every new beneficial effect a 'function' immediately, we lose the distinction between a trait being useful and a trait being *for* something. But yes, if the frill is the thing actually under selection now, then the keel is arguably redundant. In colonies where the frill is absent, the keel picks up the slack. So is the keel's function conditional?"

  "It's not conditional, it's contextual," Marcus said. "But here's where you get me. If I say any contribution to any capacity is a function, you're right—I'm drowning in functions. The keel also sheds epibionts. It makes a click when the water shifts. Is those functions? No. I have to choose the system I'm analyzing. I choose the feeding system. But why that one? Usually because I think the organism is *organized* for feeding. And how do I know that? Often because of... well, history. So I concede this: I can't define the relevant system capacity without implicitly referencing what the trait is *for*. History sneaks in my side door."

  "So we're both smuggling," Priya said, a dry smile touching her lips. "I smuggle pragmatism into my timescales. You smuggle history into your system definitions."

  "Maybe. But let's test the breaking point." Marcus reached into the tank and pulled out a specimen jar containing a distorted, shriveled colony. He placed it under the scope. The keel was there, but it was malformed, a limp ripple of tissue. It didn't stiffen the bell. It didn't shed a vortex. The colony was alive, surviving entirely off the frill's vortex.

  "Look at that keel," Marcus said. "On your view, what is it?"

  "It's malfunctioning," Priya said immediately. "It has a function—funneling, based on the weak maintaining selection we agreed on—and it's failing to perform it. It's broken."

  "But on my view," Marcus said slowly, "function is contribution to capacity. That keel contributes nothing. It doesn't stiffen. It doesn't funnel. It's inert. If it contributes nothing to the system's capacity, it has no causal role. If it has no causal role, it has no function. So I can't say it's malfunctioning. I can only say it's absent. But it's not absent. It's right there. And intuitively, it's *broken*, not just missing."

  He looked up, and the frustration was visible. "This is where you win. If I say function is just what a thing does, then a thing that does nothing has no function. But biology is full of broken things that still have functions. I have to say the keel *should* be funneling, even when it isn't. But 'should' is normative. It implies a standard. My account is descriptive. I can't get 'should' from 'is' without borrowing your history."

  "So you need history to ground normativity," Priya said. "To say something is broken, you need to know what it was supposed to do."

  "I need to know what it's supposed to be doing *now*," Marcus corrected. "But yes. It hurts. It means my account can't handle malfunction without leaning on yours. But don't think you're safe. You conceded the timescale issue. If the selection for funneling is too weak, does the keel have *no* function? Then if it breaks, it's not malfunctioning, it's just decaying. You have the same problem. You have to decide when the history is thick enough to ground a norm. That decision is yours, not nature's."

  Priya looked back at the healthy specimen in the tank. The bell contracted, the keel shed its weak vortex, the frill shed its strong one. "So we're stuck. I need history to make functions real, but history fades and becomes arbitrary. You need current contribution to make functions useful, but contribution is too broad and can't handle broken parts."

  "It seems like we're disagreeing about what biology is trying to do," Marcus said. "Are we trying to explain why the trait is there? That's you. That's history. Or are we trying to explain how the organism works? That's me. That's mechanics."

  "But you can't explain how it works without knowing what it's supposed to be doing," Priya said. "And I can't explain why it's there without looking at what it's doing now to stay there."

  "Exactly." Marcus turned off the scope light. The lab plunged into semi-darkness, lit only by the emergency exit sign. "So is the disagreement about what functions *are*? Or is it about which explanatory project we prioritize? If it's the latter, there's no fact of the matter. It's just a choice of tools."

  Priya capped her pen. "If it's just a choice of tools, then the function debate isn't metaphysics. It's methodology. And we've been doing metaphysics for fifty years."

  "Maybe," Marcus said, standing up and stretching. "Or maybe the question 'what is a function?' is just the wrong question. The real question is 'what explanation do you need?'"

  "And if I need both?" Priya asked.

  "Then you're tired," Marcus said, picking up his cold coffee. "Just like the rest of us."
