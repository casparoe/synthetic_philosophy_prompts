  2.  **Analyze the "Disposition + Fink/Mask" Analogy:**

      *   *Dispositions:* Properties like "fragility." A glass is fragile even if it never breaks.
      *   *Fink:* Something that removes the disposition *before* it manifests (e.g., a wizard makes the glass non-fragile the moment it's struck).
      *   *Mask:* Something that prevents the manifestation *without* removing the disposition (e.g., packing the glass in foam; it's still fragile, but won't break when struck).
      *   *User's Claim:* Society *has* the disposition (capacity/will) to coordinate, but competition *masks* or *finks* it.
