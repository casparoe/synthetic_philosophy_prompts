answer: |-
  There is no single established term in the literature that jointly categorizes both the single-life case and the tightly-bound-group case as a unified phenomenon distinct from the standard inter-personal aggregation problem. The nearest established concept for the single-life variant is **"Intrapersonal Aggregation."** However, this term does not naturally extend to groups, and there is no canonical label for the structural similarity between a life over time and a unified group that permits aggregation in both instances while forbidding it across scattered individuals.

  Below is an analysis of the nearest concepts, their limitations, and a coined term designed to capture the specific carving you require.

  ### Nearest Established Concepts

  **1. Intrapersonal Aggregation**
  *   **Definition:** The summation of benefits and burdens occurring within the life of a single individual over time.
  *   **Fit:** This fits your first variant (the single person suffering daily irritations) perfectly. In Scanlonian contractualism, this is generally unproblematic. A principle is assessed by whether a person could reasonably reject it based on how it affects their life *as a whole*. Therefore, trivial burdens that accumulate to ruin a life form a single, grave complaint.
  *   **Limitation:** The term is etymologically restricted to "persons." It does not cover your second variant (the tightly bound group) unless one controversially stipulates that the group counts as a "person." Using this term for the group case begs the question of collective agency.

  **2. The Separateness of Persons**
  *   **Definition:** A doctrine (associated with Rawls and Nozick) stating that distinct individuals are distinct moral loci, and thus sacrifices imposed on one cannot be straightforwardly offset by benefits to others.
  *   **Fit:** This explains *why* the standard case (many discrete individuals vs. one victim) blocks aggregation. It establishes the boundary that your phenomenon crosses.
  *   **Limitation:** This is a negative constraint (a prohibition), not a name for the positive phenomenon of permissible aggregation within a unit. It describes the wall, not the room inside it.

  **3. Collective Agency / Group Personhood**
  *   **Definition:** Theories proposing that certain groups possess moral status analogous to individuals.
  *   **Fit:** This addresses your second variant. If a group is a moral agent, burdens upon it might aggregate like burdens upon a person.
  *   **Limitation:** This is a metaphysical claim about the group's status, not a name for the *structural pattern of aggregation* itself. It also fails to link the group case back to the single-life case under a shared label.

  ### Coined Term: "Intra-Entity Aggregation"

  To capture the phenomenon you describe—the permissible treatment of many trivial complaints as one grave complaint when they fall within a single recognized moral unit, whether that unit is a life or a unified group—I propose the term **"Intra-Entity Aggregation."**

  **Definition:**
  Intra-Entity Aggregation is the moral summation of multiple distinct burdens into a single complaint for the purpose of reasonable rejectability, permissible only when those burdens fall within the boundaries of a single **Moral Entity**. A Moral Entity is defined not merely by biological or numerical unity, but by a continuity of interest or a functional unity of agency that allows the burdens to be experienced or claimed as a unified whole.

  ### Carving and Boundary Cases

  This term carves the moral landscape based on the **identity of the recipient of harm** rather than the **number of harms**.

  **1. The Core (Permissible Aggregation)**
  *   **Diachronic Unity (The Single Life):** A single biological person over time constitutes a Moral Entity. Trivial daily irritations aggregate because they degrade the *same* life. The "complaint" is the quality of that life, not the individual moments of irritation.
  *   **Functional Unity (The Tightly Bound Group):** A group constitutes a Moral Entity *only if* it possesses sufficient integration (e.g., shared fate, joint decision-making, collective identity) to sustain a "collective complaint." Here, trivial burdens to members aggregate because they impair the *group's* functioning or shared project, which is treated as the entity's "life."

  **2. The Boundary (Impermissible Aggregation)**
  *   **Scattered Individuals (The Standard Case):** A collection of discrete strangers does not constitute a Moral Entity. There is no "collective life" or "shared agency" to be degraded. Therefore, their trivial burdens remain separate, negligible complaints that cannot aggregate to outweigh a severe harm to a single person.
  *   **Loose Coalitions:** A group that lacks functional unity (e.g., people who merely share a geographic location or a trivial preference) falls on this side of the boundary. Even if they organize temporarily, if they lack a unified agency or shared fate, Intra-Entity Aggregation does not apply; they revert to scattered individuals.

  **3. The Edge Cases**
  *   **Severe Psychological Discontinuity:** If a person undergoes radical psychological change (e.g., severe dementia or fission cases), the continuity of the Moral Entity is threatened. Intra-Entity Aggregation becomes questionable because the "subject" suffering the later burdens may not be the same "subject" who benefited earlier.
  *   **Oppressive Unity:** If a group is "tightly bound" only through coercion (e.g., a cult or enslaved population), treating them as a single Moral Entity for aggregation might mask individual vetoes. Intra-Entity Aggregation requires that the unity be morally relevant, not just empirically tight.

  ### Why This Fits Best

  **Intrapersonal Aggregation** is the closest existing term, but it is too narrow because it excludes the group variant you identified. **The Separateness of Persons** explains the prohibition on the standard case but does not name the exception.

  **Intra-Entity Aggregation** fits best because it isolates the specific structural feature that permits aggregation in your two variants: the **unity of the claimant**. In both the single-life case and the tightly-bound-group case, the moral framework treats the recipient of harm as a *singular locus of complaint*. In the standard case (many discrete individuals), there are *many loci of complaint*. By naming the phenomenon after the status of the recipient (the Entity) rather than the biological status (Person) or the temporal status (Diachronic), this term captures the precise boundary you are drawing: aggregation is permissible within a moral unit, but not across moral units.
