      *   **Commitment (1) Scale Argument:** Probability $\times$ Magnitude = Dominant Obligation. (If $P(\text{sentience}) > 0$ and $N(\text{insects}) \gg N(\text{humans})$, then Insect Welfare $\gg$ Human Welfare).
      *   **Commitment (2) Integration Requirement:** Genuine sentience requires neural integration (single point of view). Insects lack this. Therefore, no direct obligations *currently*.
      *   **Commitment (3) Conditional Activation:** If evidence changes (insects *do* have integration), then (1) kicks in immediately and overrides human priorities.
      *   **Commitment (4) Epistemic Humility:** Avoid costless harm (don't crush them) not because they have rights, but because being wrong is catastrophic. It's a gamble, not a duty *to them*.
