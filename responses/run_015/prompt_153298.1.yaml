answer: |-
  This is a sharp observation, and you are grappling with one of the most persistent knots in democratic theory. However, to save your dissertation from a potential pitfall, I need to offer a gentle correction: **this is not a contradiction no one talks about.** It is arguably *the* central objection to the All-Affected Interests Principle (AAIP).

  Fred Whelan (1983), Gustaf Arrhenius (2005), and more recently Rainer Bauböck and Arash Abizadeh have all wrestled with exactly this circularity. If you claim this as a novel discovery in your diss, a harsh examiner will flag it immediately.

  However, your intuition about the circularity is philosophically sound, and your advisor's pushback ("epistemology vs. membership") is the standard counter-argument. Here is how you can disentangle this, validate your insight, and answer your specific question about non-democratic identification of interests.

  ### 1. Decoding Your Advisor's Objection
  Your advisor says you are conflating **epistemology** (how we *know* who is affected) with **membership** (the *criterion* for who belongs).

  *   **The Circularity Charge:** You argue that determining an "interest" requires democratic deliberation. Therefore, you need a *demos* to define the *demos*.
  *   **The Advisor's Counter:** The AAIP is a **normative criterion**, not a procedural recipe. It says "Those who *are* affected *ought* to be members." It does not necessarily say "Those who *vote* they are affected *ought* to be members."
  *   **The Break:** The circle breaks if "affected interest" can be defined **objectively** or **causally** without requiring a vote. If "interest" is a fact of the world (e.g., "your water supply will be poisoned"), you do not need a democratic process to establish that fact. You need an empirical inquiry.

  **The Trap:** If you define "interest" as *subjective preference satisfaction*, you are right: it's circular. If you define "interest" as *objective well-being or causal impact*, it is not circular, though it may be epistemically difficult.

  ### 2. How to Identify "Affected Interests" Non-Democratically
  You asked for a way to identify affected interests without smuggling in a prior boundary. Here are the three standard ways theorists attempt to break the circle. You should engage with these in your diss:

  #### A. Causal/Objective Functionalism (The Goodin Route)
  Robert Goodin explicitly addresses this. He argues that interests are not merely what people *say* they are; they are objective conditions of well-being.
  *   **The Mechanism:** We use social science, economics, and epidemiology to trace causal chains. If Policy X increases carbon emissions, and climate science says that harms Person Y, Person Y is affected.
  *   **Why it breaks the circle:** The determination is made by experts or empirical observation, not by the *demos* itself.
  *   **The Weakness:** It risks paternalism. Who decides what counts as "well-being"? (This is where your critique bites hardest).

  #### B. The All-Subjected Principle (The Abizadeh/Miller Route)
  Many theorists abandon AAIP for the **All-Subjected Principle** to avoid your exact circularity.
  *   **The Mechanism:** Membership is granted to all those subject to the *coercive authority* of the law, not those "affected" by the outcome.
  *   **Why it breaks the circle:** Coercion is legally definable. If the state can arrest you or tax you, you are subjected. This relies on existing legal jurisdiction (which is a boundary), but it avoids the nebulousness of "interests."
  *   **The Weakness:** It doesn't solve the boundary problem for global issues (e.g., climate change) where people are affected but not subjected to the specific state's coercion.

  #### C. Provisional Boundaries (The Dahl/Whelan Pragmatism)
  Dahl admits the boundary problem is logically prior to democracy and cannot be solved *democratically* from scratch.
  *   **The Mechanism:** We accept pre-existing boundaries (nation-states, municipalities) as **provisional**. We then use democratic processes *within* those boundaries to adjust them over time (e.g., immigration policy, secession referendums).
  *   **Why it breaks the circle:** It accepts a non-democratic starting point (history, geography, conquest) as the "first mover," acknowledging that pure democratic theory cannot bootstrap itself into existence.
  *   **The Weakness:** It legitimizes unjust historical boundaries.

  ### 3. Refining Your Dissertation Argument
  You are worried the problem is "unsolvable in principle." I suggest pivoting your argument slightly. Instead of saying "It is unsolvable," argue that **"The AAIP requires a pre-democratic epistemological framework to function."**

  Here is how to structure that argument to satisfy your advisor while keeping your critical edge:

  1.  **Acknowledge the Literature:** Cite Whelan ("Democratic Theory and the Boundary Problem") and Arrhenius ("The Boundary Problem"). State clearly that you are extending their critique regarding the *definition of interests*.
  2.  **Distinguish Types of Interests:** Argue that the circularity holds only for **subjective interests** (preferences) but breaks for **objective interests** (causal impacts).
  3.  **The Critical Turn:** Argue that relying on **objective interests** (to solve the circularity) undermines the democratic ethos. If experts define the interests that define the *demos*, then the *demos* is not self-constituting; it is expert-constituting.
  4.  **Conclusion:** The boundary problem isn't logically unsolvable, but it is **politically costly**. Solving the circularity requires sacrificing either democratic self-determination (by using experts to define interests) or universal inclusion (by using existing borders).

  ### 4. Direct Answer to Your Question
  > *Can someone lay out the non-democratic way to identify affected interests without smuggling in a prior boundary?*

  **Yes, but it shifts the authority from "The People" to "The Truth."**

  To identify affected interests without a prior democratic boundary, you must rely on **counterfactual causal analysis**.
  *   **Step 1:** Posit a policy decision $P$.
  *   **Step 2:** Model the world with $P$ and without $P$.
  *   **Step 3:** Identify all agents whose utility function or well-being metric changes significantly between the two models.
  *   **Step 4:** Those agents constitute the *demos* for $P$.

  **Why this works:** It relies on logic and empirical data, not a vote.
  **Why this fails:** It requires a "view from nowhere." Who chooses the utility function? Who funds the modeling? If a corporation funds the study that says "only shareholders are affected," the boundary shrinks. If a union funds it, the boundary grows.

  **Your Dissertation Hook:**
  The circularity isn't in the *logic* of AAIP; it's in the **politics of knowledge production**. You cannot define the *demos* without first defining what counts as "harm," and defining harm is a political act. Therefore, the boundary problem is not a logical paradox, but a **site of political contestation** that democracy attempts (and fails) to neutralize.

  This aligns with your intuition (that it's circular) but incorporates your advisor's point (that the circle is epistemological, not necessarily ontological). It moves you from "I found a contradiction" to "I am analyzing the political conditions required to make the principle functional." That is dissertation-worthy.
