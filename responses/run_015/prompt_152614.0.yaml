answer: |-
  ### Brainstorm: The Three Standard Moves

  Before dissecting the stalemate, here are the three canonical moves that define the perimeter of this debate:

  1.  **The Consequentialist Claim (Performance):** Legitimacy is earned retrospectively through outputs. If the regime delivers security, economic growth, and public goods, it possesses the right to rule. The justification is instrumental: rule is a means to welfare.
  2.  **The Proceduralist Claim (Consent):** Legitimacy is earned prospectively through inputs. Regardless of outcomes, rule without consent, participation, or rights protection is inherently defective. The justification is deontological: rule must respect agency.
  3.  **The Transition Claim (Instability):** Performance legitimacy is inherently fragile or temporary. It works only during high growth; once growth slows, the lack of procedural channels causes collapse. Therefore, performance legitimacy is either a stepping stone to democracy or a ticking bomb.

  ***

  ### Diagnosis of the Stall

  You are correct that the debate has stalled. After decades of trading blows, neither side concedes because they are not actually fighting on the same terrain. The stalemate is primarily **conceptual**, but it is reinforced by a **bedrock intuition clash** regarding the *telos* of politics.

  **1. It is primarily a verbal/conceptual confusion.**
  The word "legitimacy" is doing double duty, and neither side admits it.
  *   **The Authoritarian/Realist side** uses a **sociological** definition: A regime is legitimate if the governed *believe* it is legitimate and obey without excessive coercion. Here, legitimacy is synonymous with *stability* and *efficacy*.
  *   **The Liberal side** uses a **normative** definition: A regime is legitimate only if it satisfies specific moral criteria (justice, rights, consent), regardless of whether the population accepts it. Here, legitimacy is synonymous with *justification*.

  When a developmental-state advocate says, "We are legitimate," they mean, "We are stable and accepted." When a liberal critic says, "You are not," they mean, "You are unjust." They are talking past each other. The authoritarian points to GDP growth (evidence of stability); the liberal points to censorship (evidence of injustice). Both facts are true, but they answer different questions.

  **2. The Bedrock Intuition Clash.**
  Even if we clarify the definitions, the disagreement persists because of a deeper divergence on the purpose of political order.
  *   **Order vs. Agency:** One side views the primary function of politics as the provision of *goods* (safety, wealth, order). The other views the primary function as the protection of *agency* (choice, voice, autonomy).
  *   This is not resolvable by empirical data. You cannot prove via regression analysis that agency is more valuable than order. This is a pre-political moral disagreement.

  **3. The Hidden Empirical Claim.**
  There is a hidden empirical claim sustaining the liberal side: The **Transition Claim** (Move #3 above). Liberals often concede that performance legitimacy works *now* but argue it is causally linked to eventual failure (the "dictator's dilemma"). They claim authoritarianism cannot process information or handle succession long-term.
  *   **The Stall:** Authoritarian advocates deny this causation. They claim institutions can be adapted to ensure longevity without democracy.
  *   **The Reality:** We lack sufficient longitudinal data to settle this. The CCP has lasted 40+ years of high growth; the Soviet Union lasted 70. The sample size for "successful modern authoritarianism" is too small to prove or disprove the instability thesis definitively.

  ### Epistemic Authoritarianism: Old Debate or New?

  Epistemic authoritarianism is not a separate question; it is a **refinement of the Performance Claim** designed to counter the Proceduralist Critique.

  *   **The Shift:** Traditional performance legitimacy says, "We grew the economy." Epistemic authoritarianism says, "We grew the economy *because* our decision-making process is superior to democracy."
  *   **The Function:** It attempts to steal the procedural ground from liberals. It argues that democracy is not the only valid *process* for generating good decisions. It claims that insulation from electoral pressure allows for better information processing and long-term planning.
  *   **The Weakness:** This turns the debate into a testable empirical claim about information flow. Do authoritarian regimes actually process information better? Or does the lack of free press and feedback loops create "information silos" that lead to catastrophic errors (e.g., famine, policy blunders)?

  This framing moves the debate from "Order vs. Freedom" to "Competence vs. Competence." It is a stronger argument than simple performance legitimacy because it addresses *how* the results are achieved, not just *that* they are achieved.

  ### What Counts as Progress?

  The debate will not progress through more normative theorizing or more GDP statistics. We know the growth happened; we know the rights were violated. Progress requires three specific shifts:

  **1. Conceptual Disaggregation (The Verbal Fix)**
  We must stop using "legitimacy" as a catch-all. Scholars should explicitly distinguish between:
  *   **Empirical Legitimacy:** Belief in legitimacy by the populace (stability).
  *   **Normative Legitimacy:** Moral justification for rule (justice).
  *   **Progress:** Acknowledge that a regime can have high empirical legitimacy and low normative legitimacy (and vice versa). This dissolves the immediate talking-past-each-other. It forces the authoritarian to admit, "We are stable but perhaps unjust," and the liberal to admit, "They are unjust but clearly stable."

  **2. Testing the Epistemic Mechanism (The Empirical Fix)**
  Since epistemic authoritarianism makes a causal claim about information processing, this is where empirical work matters.
  *   **Progress:** Comparative institutional analysis that measures *policy error rates* in authoritarian vs. democratic regimes during crises. Do autocracies make bigger mistakes because they lack feedback loops? If the data shows authoritarian regimes suffer higher variance in outcomes (boom/bust, famine/stability) compared to democracies, the epistemic claim fails.
  *   This moves the debate from "Rights vs. Growth" to "Risk Management vs. Risk Management."

  **3. Accepting Pluralism of Questions (The Philosophical Fix)**
  We must accept that the two sides are answering different questions.
  *   **Question A:** What makes a regime stable and effective? (Performance/Epistemic)
  *   **Question B:** What makes a regime morally permissible? (Procedural/Rights)
  *   **Progress:** Stop trying to answer Question B with data from Question A. The liberal must acknowledge that performance creates stability (empirical legitimacy). The authoritarian must acknowledge that stability does not equal moral justification (normative legitimacy).

  ### Verdict

  The stall is **conceptual** at its core, hardened by **bedrock intuitions** about the purpose of politics.

  *   **Is it verbal?** Yes. "Legitimacy" conflates stability with justice.
  *   **Is it empirical?** Only regarding the *longevity* claim (Transition Thesis) and the *epistemic* claim (Information Processing).
  *   **Path Forward:** Disaggregate the concept of legitimacy. Stop arguing whether growth *is* legitimacy. Argue whether growth *buys* stability (empirical) and whether stability *justifies* rule (normative).

  The most fruitful avenue is the **epistemic claim**. It is the only bridge that attempts to justify authoritarian *processes* rather than just authoritarian *outcomes*. If that mechanism is empirically debunked (i.e., if autocracies are shown to be systematically worse at information processing over time), the performance legitimacy argument collapses into mere "might makes right." If it holds, it forces liberals to confront the possibility that democratic procedures are not uniquely competent, only uniquely just.
