      *   *Constraint Check:* Ensure I explicitly mention the "no empirical ML resources" constraint in the justification for every ranking.

  10. **Final Polish:** Check tone (academic, rigorous, advisory). Ensure all parts of the prompt are answered (ranking, criteria, overrated, missing, dynamic factors).

      *(Self-Correction on Criteria)*: The prompt asks for: Downstream dependency, Tractability (a priori), Neglectedness, Decision-relevance. I must explicitly reference these in the justification.

      *(Refining the Missing Question)*: The prompt specifically hints at "copies of the same underlying system." The risk isn't just collusion; it's *shared epistemic blind spots*. If the model architecture cannot represent the truth, two instances won't find it. This is "Architectural Completeness."

