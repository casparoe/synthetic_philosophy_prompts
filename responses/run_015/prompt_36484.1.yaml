      *   Since they can't run experiments, questions about *empirical performance* (e.g., "Does RLHF actually make them argue well?") are out. They need *theoretical bounds* or *conceptual impossibility results*.
      *   Q1 (Decomposability) is purely philosophical/logical. Perfect for them.
      *   Q5 (Bias Exploitation) is game-theoretic/epistemic. Good for them.
      *   Missing Q (Homogeneity) is structural/systemic. Good for them.
      *   Q6 (Legal Analogy) is policy/normative. Less critical for *trustworthiness* of the mechanism itself, more for *governance* of the mechanism. Given the goal is "is it trustworthy," this drops.

