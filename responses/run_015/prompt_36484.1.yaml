  3.  **Determine the Criteria Weights (for the specific Theory Group):**
      *   *No Empirical ML Resources:* This is crucial. Questions that require training massive models or running large-scale RLHF experiments are *intractable* for this group. Questions requiring conceptual analysis, formal modeling, game theory, or epistemology are *tractable*.
      *   *Goal (Trustworthiness for Superhuman Oversight):* The stakes are high. If the mechanism is fundamentally flawed, no amount of tuning fixes it. "Existential" risks to the research agenda weigh heavier than optimization problems.
      *   *Decision-Relevance:* Will the answer stop the group from recommending debate?
