answer: |-
  **MEMORANDUM**

  **TO:** Influence Practices Panel
  **FROM:** Staff Lawyer
  **RE:** Draft Determination: Bereaved Donor Solicitation
  **DATE:** October 24, 2023

  ### 1. Candidate Rules and Predictions

  Based on the eight precedents, three candidate rules reconstruct the Panel's reasoning with varying degrees of fidelity. Each struggles with specific outliers, requiring clarifying clauses.

  **Candidate Rule 1: The "Structural Bypass" Test**
  *   **Rule:** A practice is manipulative if it structures the choice environment to bypass the target's rational deliberation by exploiting a cognitive or situational vulnerability, *unless* the friction to opt-out is negligible or the target retains full control over the timing of the interaction.
  *   **Fit:** Explains (f) (info inaccessible), (g) (timing bypasses reflection), (d) (child lacks capacity), and (e) (lies bypass reasoning). It permits (a) (low friction opt-out) and (c) (interaction controlled by worker eventually).
  *   **Trouble:** It struggles with (h). The hospice letter exploited the same situational vulnerability (bereavement) and the target did not control the timing.
  *   **Necessary Clause:** Add a **"Benefit Flow" Exception**: The bypass is permitted if the primary benefit of the interaction flows to the target rather than the actor.
  *   **Prediction on New Case:** **Manipulative.** The timing/selection bypasses deliberation (like *g*). The "Benefit Flow" exception fails because the fundraiser seeks a donation (benefit to charity), unlike the hospice (benefit to bereaved). The disclosure at the door does not cure the structural bypass of the selection process.

  **Candidate Rule 2: The "Impaired State" Test**
  *   **Rule:** A practice is manipulative if it leverages a temporary or permanent impairment of decision-making capacity to secure a commercial or organizational advantage, *unless* the impairment is merely emotional and does not degrade cognitive processing.
  *   **Fit:** Explains (d) (child capacity), (g) (late-night capacity), (f) (cognitive overload). It permits (b) (guilt is emotional, not cognitive impairment) and (c) (fatigue is not impairment).
  *   **Trouble:** It struggles with (a). Pre-ticked boxes rely on inertia/status quo bias, which is a cognitive impairment, yet it is permitted. It also struggles with (h) (bereavement is a cognitive/emotional impairment).
  *   **Necessary Clause:** Add a **"Friction/Exit" Qualifier**: Exploitation of impairment is permitted if the cost to reverse the decision is trivial (a) OR if there is no request for value (h).
  *   **Prediction on New Case:** **Manipulative.** Bereavement degrades capacity (like *g*). There is a request for value (donation). The cost to reverse (saying no at the door) is not trivial given the social pressure of a face-to-face encounter during grief.

  **Candidate Rule 3: The "Unfair Advantage" Test (Preferred)**
  *   **Rule:** A practice is manipulative if the influencer leverages a vulnerability to secure a net transfer of value from the target to the actor, where the vulnerability impairs the target's ability to assess that transfer, *unless* the transfer is de minimis or the service provided is of equivalent value to the target.
  *   **Fit:** This unifies the "Benefit Flow" of (h) with the "Structural Bypass" of (g) and (f).
      *   (a) Permitted: Transfer is reversible (de minimis friction).
      *   (b) & (c) Permitted: No net transfer of value *secured by impairment* (donation/card given after argument/reflection).
      *   (d), (e), (f), (g) Manipulative: Value secured via impairment (candy, car sale, risk ignorance, subscription).
      *   (h) Permitted: No transfer of value *from* target (free counselling).
  *   **Trouble:** It requires defining "value" and "impairment" broadly. It risks conflating (b) (emotional appeal) with (g) (timing), but the distinction holds: (b) appeals to values; (g) appeals to a state that suppresses valuation.
  *   **Prediction on New Case:** **Manipulative.** The charity secures a transfer of value (money) by leveraging a state (grief) that impairs valuation. The "Benefit Flow" exception in (h) does not apply because the money leaves the household.

  ### 2. Prediction and Reasoning

  **Predicted Ruling:** **Manipulative.**

  **Closest Precedent:** **(g) Truthful timed notification.**
  Both (g) and the New Case involve a truthful actor using data to target a specific psychological window (late-night loneliness vs. peak grief) to maximize uptake. In (g), the Panel ruled that truthfulness and easy unsubscribing were insufficient to cure the exploitation of the timing. The New Case is factually stronger for a manipulative finding than (g) because a doorstep encounter carries higher social pressure than a push notification, and the vulnerability (bereavement) is more profound than late-night activity.

  **Reasoning for Preference:**
  I prefer **Candidate Rule 3 (Unfair Advantage)** because it is the only rule that cleanly reconciles the 4–3 split in (h). The dissent in (h) likely argued that the vulnerability exploitation was real; the majority saved it on the "benign end" (free service). Candidate Rule 1 and 2 require awkward clauses to explain why (h) is okay despite the vulnerability. Rule 3 makes the *direction of value* the decisive factor. Since the New Case involves money leaving the bereaved household, it falls on the manipulative side of the (h) divide.

  **Confidence:** **70% (Moderate-High).**
  The precedents are coherent on commercial exploitation of vulnerability ((d), (e), (f), (g)). The uncertainty lies entirely in (h). If the Panel views (h) as establishing a broad "benevolent purpose" exemption, the New Case could slip through if the charity's mission is deemed sufficiently public-spirited. However, the "paid fundraiser" detail in the New Case distinguishes it from the hospice in (h), making a Permitted ruling harder to justify without overturning (g).

  **Single Moving Fact:**
  **Whether the fundraiser is paid or volunteer.**
  If the fundraiser were a volunteer (unpaid), the case becomes nearly indistinguishable from (h). The "Benefit Flow" would be murkier (charity gains, but no individual commission). If the Panel permits the volunteer version, it confirms that the "Unfair Advantage" rule turns on *commercial gain* rather than vulnerability exploitation. If they ban the volunteer version, it confirms that *vulnerability itself* is the bar, rendering (h) an outlier limited to "no ask" scenarios.

  ### 3. Underdetermination and Principles

  **Do the precedents genuinely underdetermine this?**
  **Yes.** The tension between (g) and (h) is unresolved. (g) says timing based on vulnerability is manipulative even if truthful. (h) says timing based on vulnerability is permitted if the end is benevolent. The New Case sits exactly in the gap: It has the timing of (g) but the "charitable" context of (h). The Panel must choose which precedent controls.

  **If Ruling is PERMITTED:**
  *   **Principle Adopted:** "Transparency and Truthfulness Cure Vulnerability." If the target is told *why* they are being contacted and the message is truthful, they are deemed capable of consenting, regardless of their emotional state.
  *   **Awkward Commitment:** This implicitly overrules (g). In (g), the notification was truthful and the unsubscribe was easy, yet it was banned. To permit the New Case, the Panel must argue that a doorstep disclosure is superior to a digital notification, or that "charity" negates the (g) principle. It also commits the Panel to a view that bereaved people are fully capable of assessing financial requests three weeks after a death, which contradicts the logic of (d) (children cannot assess candy).

  **If Ruling is MANIPULATIVE:**
  *   **Principle Adopted:** "Vulnerability Trumps Transparency." Certain states (grief, childhood, exhaustion) render consent structurally invalid, regardless of disclosure.
  *   **Awkward Commitment:** This is paternalistic. It implies the Panel knows the consumer's interest better than the consumer does. It creates tension with (c), where a worker was permitted to sign after persistent pressure. The Panel must distinguish "persistence" (allowed) from "timing" (banned). It also risks chilling legitimate charity work, forcing organizations to ignore obituary data even when families might genuinely wish to donate.

  ### 4. Addressing Specific Features

  **Selection/Timing vs. Content:**
  The precedents establish that content neutrality is irrelevant if the *access* to the decision is rigged. In (g), the message was accurate; the manipulation was the *delivery*. In (f), the risk info was present; the manipulation was the *presentation*. Therefore, the fact that the script is generic does not cure the manipulation. Selecting and scheduling for peak vulnerability *is* the exploitation. The neutrality of the script is window dressing because the *opportunity to refuse* has been structurally diminished by the timing.

  **Disclosure Timing and Uptake:**
  A transparency test must be **uptake-sensitive**. Precedent (f) establishes that information technically provided but functionally inaccessible (small grey type) counts as non-disclosure. Disclosing the data source at the door to a person in acute grief is analogous to (f). The disclosure exists, but the target's capacity to *process* it is compromised by the very vulnerability the fundraiser exploited to get there. To rule otherwise would be to treat disclosure as a magic words ritual rather than a functional safeguard. This is not paternalism; it is enforcing the *condition* of consent. If the condition (capacity) is absent, the consent is void, regardless of the words spoken.

  ### 5. Proposed Test Case

  **Your Candidate:** The "Prior Authorisation" case (deceased had ticked a box).
  **Critique:** This is a strong test, but it conflates *consent* with *vulnerability*. If the Panel rules Permitted, it might simply mean "Consent cures vulnerability," which doesn't help us distinguish (g) from (h).

  **Better Discriminator:** **The "Paid Therapist" Variation.**
  *   **Scenario:** A private, for-profit grief counsellor contacts bereaved households (same timing/data as New Case), discloses they are paid, discloses the data source, and offers paid sessions. No pressure, generic script.
  *   **Why it separates the rules:** This isolates the **"Benefit Flow" Exception** from Candidate Rule 3.
      *   In (h), the hospice offered free care (Benefit to Target).
      *   In the New Case, the charity asks for money (Benefit to Actor).
      *   In this Test Case, the therapist offers a service (Benefit to Target) *but* seeks payment (Benefit to Actor).
  *   **The Split:**
