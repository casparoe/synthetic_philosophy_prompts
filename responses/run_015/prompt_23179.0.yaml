  2.  **Deconstruct Frankfurt Cases:**
      *   **Origin:** Harry Frankfurt (1969), "Alternate Possibilities and Moral Responsibility."
      *   **Target:** The Principle of Alternative Possibilities (PAP). PAP states: A person is morally responsible for what they have done only if they could have done otherwise.
      *   **Structure of a Frankfurt Case:**
          1.  Agent (Mara) decides to do X (tell truth).
          2.  Counterfactual Intervener (Fixer) wants X to happen.
          3.  Intervener monitors Agent.
          4.  *Crucial Condition:* If Agent shows signs of doing ~X (lying), Intervener forces X.
          5.  *Actual Sequence:* Agent does X on their own. Intervener does nothing.
      *   **The Philosophical Punchline:** Frankfurt argues Mara is responsible *even though* she could not have done otherwise (because if she tried, she would have been forced). Therefore, PAP is false.
      *   **The User's Confusion:** The user is oscillating between "She could have lied" (compatibilist intuition) and "She couldn't have lied" (the core Frankfurt claim).
      *   **Resolution:** In a *true* Frankfurt case, the setup must guarantee that the agent *could not* have done otherwise. If the agent *could* have lied (i.e., the fixer might have failed, or there was a genuine loophole), then PAP isn't really challenged. The power of the thought experiment relies on the *ineliminability* of the outcome, yet the retention of responsibility.

  3.  **Address the Specific Novel Scenario:**
