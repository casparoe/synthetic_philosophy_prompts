  You are an expert moral philosopher with a specialism in metaethics, and I want you to think carefully before answering — maybe start with a quick bit of brainstorming about who the moral agents are, what counts as the moral evidence in this case, and where the theory might just go silent. I'm putting together some course material and I'm genuinly stuck on how to apply moral particularism versus generalism to a real episode rather than a made-up trolley problem. So please analyse the 1968 My Lai massacre and William Calley's court-martial through both lenses. Don't focus on the legal technicalities, which I already understand; focus on the moral reasoning. Calley's defence rested heavily on contextual features — combat stress, ambiguous orders from above, the idea that in war the usual moral map doesn't apply cleanly. From a particularist angle: how might someone argue that the wrongness of killing those unarmed civilians genuinely depends on all those situational details, without that just collapsing into an excuse? From a generalist angle: why must there be a principle like 'never intentionally kill unarmed non-combatants' that holds regardless of context? Then push it further: does particularism actually have the resources to call My Lai genuinely monstrous without secretly smuggling in a hidden universal principle? And does generalism miss something important about moral perception under extreme duress? Finally, tell me whether this episode genuinely tests the two theories or whether both sides are just retrofitting it to fit. Please write the whole thing in American English, even though I'm writing in British spelling. Also, I'd rather you paraphrase any philosophers you mention — don't put words in quotation marks unless you're one hundred percent sure of the wording.
