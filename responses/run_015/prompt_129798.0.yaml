      *   **Core Idea/Twist:** The user and their friend argued about whether the Lockean Proviso should be a *rolling baseline* (updating after every exchange) rather than a one-time check at initial acquisition. This creates a "historical shadow" where past voluntary transfers might be retroactively adjusted if they violate the proviso for others later on.
      *   **Goal:** Design an in-class game/experiment for 14 grad students, 75 minutes.
      *   **Requirements:**
          *   Start with equal token bundles.
          *   One student offers a "performance" others pay for voluntarily.
          *   Hidden rule: "Historical Shadow Clause" (rolling baseline) allowing retroactive adjustment via vote.
          *   Real small stakes (candy/points for music choice).
