      *   No, that's too complex.
      *   Let's stick to the Vote. The Vote *is* the enforcement of the Rolling Baseline.
      *   *Key Instruction:* The Instructor must play "Nozick" initially, defending the transfers. Then switch to "Critique" mode when the Shadow triggers.

  8.  **Finalizing the Plan:**
      *   **Name:** The Shadow Ledger Experiment.
      *   **Setup:** 14 students, 10 tokens each.
      *   **Role:** 1 Volunteer (Performer), 13 Patrons.
      *   **Rounds:** 3 Trading Rounds.
      *   **The Twist:** The "Proviso Card" is revealed after Round 2. It allows a majority vote to invalidate past transfers if the "Baseline of Viability" is breached.
      *   **Debrief:** Connect the anger/confusion to the philosophical dispute.

  9.  **Checking Constraints:**
      *   75 mins? Yes.
      *   14 students? Yes.
      *   Small stakes? Yes (Candy/Music).
      *   Don't recycle Chamberlain? The mechanic forces the *Proviso* issue, not just the *Pattern vs. Liberty* issue. The focus is on the *temporal* aspect of the Proviso (one-time vs. rolling).
      *   What will go wrong? Addressed.
