          *   *Crucial Detail:* The rule is *hidden* initially. Players play assuming standard Nozickian liberty. Then the twist is revealed to simulate the philosophical shock of the Proviso re-interpretation.
          *   *Wait, better:* If I tell them it's hidden, they might feel cheated. Better to tell them there is a "Constitution" but not read the fine print until the trigger hits. Or, make the "Shadow" a mechanic they discover.
          *   *Refinement:* Let's make the "Shadow Clause" a known possibility but vague. "Transfers are valid *unless* they violate the Baseline." The tension comes from defining *when* that is.
          *   *Actually, the prompt asks for the idea to emerge from play.* If I hide it, it's a trick. If I state it clearly, it's a lecture.
          *   *Best Approach:* Give them a "Contract." Clause 1: Voluntary trade is sacred. Clause 2: The Lockean Proviso holds. *Do not explain how Clause 2 interacts with Clause 1.* Let them fight over it when inequality arises.

      *   **Revised Mechanic:**
          *   Round 1-3: Free trade. Performer offers "Entertainment" (telling a joke, doing a trick, or just promising 'status'). Audience pays tokens.
          *   Mid-Game Trigger: Inequality reaches a threshold.
          *   The "Proviso Vote": The Instructor announces that under the "Rolling Baseline," the current distribution might be invalid. The group must vote to either uphold the transfers (Liberty) or Rectify (Equality/Proviso).
          *   *Wait, the prompt wants the "Historical Shadow" to be a specific mechanic.*
          *   Let's try this: Every time a payment is made, it goes into a "Public Ledger." At the end of Round 3, the Instructor reveals that the Proviso is *dynamic*. If the Performer has >50% of total wealth, the "Shadow" falls. The Audience can vote to claw back tokens from the Performer *from previous rounds* to restore the "Opportunity Baseline."
          *   This forces the tension: "But I paid voluntarily!" vs. "But now I can't participate meaningfully."

  4.  **Developing the Payoff & Stakes:**
      *   Tokens = Points.
      *   Top 3 scorers get candy.
      *   Highest scorer (or Performer if they win) picks music.
      *   This creates enough self-interest to make the betrayal of the "Shadow Clause" feel real.

  5.  **Addressing the "What Will Go Wrong" (Pre-mortem):**
      *   Students might collude to break the bank.
