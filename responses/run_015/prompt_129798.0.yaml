          *   *Crucial:* Do not just recycle the standard Chamberlain example; the mechanics must force the "rolling baseline" tension to emerge during play.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Nozick's Standard View:* Justice in Holdings = Justice in Acquisition + Justice in Transfer + Rectification of Injustice. The Wilt Chamberlain argument shows that patterned principles (like equality) are violated by liberty (voluntary transfer). Nozick argues the Lockean Proviso ("enough and as good left for others") applies to *initial acquisition*, not necessarily subsequent voluntary transfers, though this is debated.
      *   *The User's Twist:* What if the Proviso applies continuously? If I become too rich relative to you through voluntary trade, does that violate your opportunity baseline *now*, even if the trade was fair *then*? This turns Rectification from a fix for *theft/fraud* into a fix for *structural inequality resulting from liberty*.
      *   *Game Mechanic Need:* We need a mechanic where players voluntarily pay, inequality grows, but then a mechanism triggers a "check" that says, "Wait, does Person A still have 'enough' compared to Person B given the new context?"

  3.  **Drafting the Game Design:**

      *   **Title:** "The Shadow Ledger."
      *   **Players:** 14 Grad Students.
      *   **Resources:** Tokens (representing wealth/utility).
      *   **Stakes:** Candy + "DJ Rights" (picking music next session).
      *   **Roles:**
