  11. **Final Polish:** Check timing. 10 min intro, 30 min game, 35 min debrief. Sounds right. Ensure the "Music" stake is mentioned as it adds social pressure.

  *(Self-Correction on the "Hidden Rule"):* If I hide the rule completely, students will feel the simulation is rigged. Better to state the rule vaguely: "All transfers are subject to the Lockean Proviso." Most students (like most libertarians) assume Proviso = Initial Acquisition. The *reveal* is that the Instructor interprets Proviso = Continuous. This mirrors the philosophical ambiguity. I will instruct the user to be ambiguous in the rules handout.

  Let's build the "Shadow Token" mechanic. When the Performer gets a token, they get a "Shadow Tag." If Shadow Tags > X, the Proviso triggers. This makes the "historical shadow" visible.

