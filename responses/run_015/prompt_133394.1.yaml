prompt: |-
  I'm in the middle of drafting a novel about two made-up mathematicians in different centuries who both derive the same infinitesimal notation in the same winter without ever meeting—obviously I'm stealing the Newton/Leibniz parallel as narrative scafolding, but the characters are fiction. Anyway, I've come to hold this view about simultaneous invention that feels kind of off the beaten path: I don't think discoveries are inevitable in some vague 'zeitgeist' sense, but I do think they're structurally overdetermined by the shared cognative scafolding of an era—once certain instruments, notation conventions, and problem-sets are in circulation, there are only so many viable transformations left. So Newton and Leibniz didn't 'discover calculus' in some heroic individual sense; they each executed the only mathematically coherent move available given the tools they both inherited. But here's the part I'm stuck on—I still think attribution matters hugely for moral desert and for how we tell the story of science, even if the result itself was overdetermined. So what I'm asking is: what would actually count against this position? Not just the usual Wallace-letter-arrived-late anecdote, but which formal results, philosophical arguments, or historical counter-examples would genuinely hurt it? Would it collapse if we found cases where identical scaffolding produced genuinely divergent theories with no convergence? Is there a hidden determinism problem I'm smuggling in through the back door? And please be honest—has my view been qualified into unfalsifiability, and if so, is that fatal for a claim about scientific history? Rank the defeaters from fatal to merely awkward, and tell me which ones I'd have to concede even if I'm committed to the view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

