          *   Example: Non-Euclidean geometry. Gauss, Bolyai, Lobachevsky. But they converged.
          *   Example: Quantum Mechanics. Matrix mechanics (Heisenberg) vs. Wave mechanics (Schrödinger). Different formalisms, same physics. (This might actually support the user: different paths to same truth).
          *   Better Example: *Priority disputes where one was simply wrong or stalled.* If the scaffolding dictates *the* move, why did others with the same scaffolding fail? (e.g., Hooke vs. Newton on gravity).
          *   Best Example: *Multiple viable frameworks that persist.* Complex numbers. Acceptance varied wildly despite similar scaffolding. Or, the development of set theory (ZFC vs. NF vs. Category Theory foundations). The scaffolding of late 19th-century logic allowed for *divergent* foundational choices, not just one "coherent move."

      *   *Philosophical Arguments:*
          *   *Underdetermination of Theory by Data (Quine/Duhem):* This is the big gun. If data/logic doesn't dictate one theory, the user's "only coherent move" claim is false.
          *   *Kuhnian Incommensurability:* Paradigms aren't just logical extensions; they are gestalt switches. The "scaffolding" itself is interpreted differently.
          *   *Creativity/Insight:* Poincaré's view on mathematical invention as selection from a vast combinatorial space, not a forced march.

      *   *The "Determinism" Problem:*
          *   If the move was the *only* coherent one, is it really a discovery or just a computation? Does this erase the "genius" entirely, undermining the user's desire to preserve moral desert? If I *had* to do it, do I deserve credit?

      *   *Falsifiability:*
          *   How do we define "scaffolding"? If every time divergence happens, the proponent says "ah, but the scaffolding wasn't *quite* identical," then it's unfalsifiable. This is the "No True Scotsman" risk.

  4.  **Developing the Ranking (Fatal to Awkward):**

      *   *Fatal:* Unfalsifiability (The "Scaffolding" definition problem). If you can't define the constraints independently of the outcome, the theory explains nothing.
