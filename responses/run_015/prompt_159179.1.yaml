      *   *Lottery Propositions:* This is the classic counterexample to KNA. The user thinks it's *permissible* to assert "I will lose." Many epistemologists (Williamson, etc.) argue it is *not* permissible, or at least that there's something wrong with it, even if it's true. This is the "bite the bullet" move the user mentions.
      *   *Certainty vs. Knowledge:* The user conflates "knowledge" with "certainty." One can know something without being Cartesian certain. This is a crucial distinction.
      *   *The "Stricter Norm" Objection:* The user argues KNA/Truth Norm are "stricter" and thus rule out ordinary speech. Proponents argue ordinary speech *should* be ruled out if it doesn't meet the norm, or that context shifts the standards.
