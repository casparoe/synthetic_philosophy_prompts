      *   **Specific Twist:** "Diachronic Incommensurability." The evaluative framework shifts *over time* (phases), making cross-phase comparison incoherent.
      *   **Key Phases to Analyze:**
          1.  Initial Commitment (Rescue vs. Abandonment/Compensation).
          2.  Final Extraction (Miner Safety vs. Rescuer Risk/Heroism).
          3.  Post-Rescue (Retributive Justice vs. Social Solidarity).
      *   **Key Questions:**
          *   Who are the moral agents? (Do they shift?)
