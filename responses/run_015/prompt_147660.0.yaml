  9.  **Final Polish:** Check for clarity on "on a par" vs. "tragic loss." In Phase 1, was it tragic loss (miners die) or parity (rescue is hard but possible)? The prompt implies the state *chose* rescue, suggesting they saw them as comparable or the commitment made rescue better. I will argue the commitment *made* them comparable by introducing "National Honor" as a common denominator, which then vanished in Phase 3. This supports the diachronic shift.

      *Wait, one nuance:* Chang says hard choices are where reasons run out. In San José, did reasons run out? Or did the *world* provide the reason (media)? This is crucial for the critique. The "Hard Choice" was resolved not by internal will but by external gaze. This is a significant theoretical limitation to highlight.

      *Refining the "Diachronic" point:* If the metric shifts, then rational planning over time is impossible. You can't optimize the whole rescue. You optimize Phase 1, then Phase 2 optimizes for a *different* goal. This leads to potential irrationality from a god's-eye view, but rationality within the frame. This supports the "incoherent total value" claim.

