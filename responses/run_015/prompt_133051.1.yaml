answer: |-
  **To:** The Academic Board
  **From:** The Academic Regulations Committee
  **Date:** October 26, 2023
  **Subject:** Recommendation on Deadline Extension Procedure

  The Academic Regulations Committee recommends that the University replace the current Exceptional Circumstances procedure with a system of automatic, no-questions-asked deadline extensions, coupled with a mandatory right for students to demand a written justification for any administrative decision affecting their record. We reject both the existing petition-based system and the proposal for automatic extensions without a mechanism for accountability. This recommendation adopts the position that freedom is fundamentally a matter of standing: a student must not be subject to the unchallengeable discretion of another, even if that discretion is usually exercised kindly. By converting extensions from a privilege granted by permission to a right exercised by claim, we alter the moral relationship between the institution and the student. However, because this shift relies on a digital portal that currently operates with invisible rules, we must couple the new freedom with transparent thresholds and a right of correction.

  The Committee's reasoning rests on a specific understanding of liberty that distinguishes between having options and having standing. The first group on this committee argues that freedom means having fewer doors shut by others. On this view, the current system is oppressive because it requires a student to disclose private trauma to a caseworker who may say no. The second group argues that freedom is about what you can effectively do. They worry that removing the petition file removes the university's ability to spot students in crisis and route them to financial or mental health support. The third group, whose view we adopt, argues that freedom is about standing. It matters whether you are begging for a favor or claiming a right. Even if the caseworker always says yes, the fact that they *could* say no makes the student subordinate.

  This distinction forces us to answer two difficult questions. First, is a power that reliably tracks people's interests acceptable if those people cannot see or contest it? The portal currently flags students who exceed extension allowances using unpublished thresholds. These flags trigger support conversations that the Disability Services Officer confirms are helpful. However, demonstrated accuracy and benevolence are not enough. A power that cannot be appealed is a form of domination, regardless of how often it is used correctly. If the algorithm makes a mistake, the student has no recourse. Therefore, we recommend that all thresholds triggering administrative flags be published before the system goes live, and students must be granted the right to view and correct their record.

  Second, does replacing "someone may let you" with "you may, as of right" change a student's standing or merely their menu? It changes their standing. Under the old system, a student who missed a deadline was a supplicant asking for mercy. Under the new system, they are a rights-holder managing their allowance. This shift reduces the shame associated with struggling and treats students as responsible agents rather than potential rule-breakers. However, we must acknowledge that for the roughly one hundred and twenty students with chronic conditions or caring responsibilities, the standard allowance will be insufficient. They will move to a "registered adjustment" route requiring annual recertification. We acknowledge this reintroduces discretion at the margin for the students least able to absorb it. We accept this trade-off only because the Disability Services Officer confirms this route is necessary to trigger tailored support that a blanket extension cannot provide.

  Regarding staff concerns, a substantial minority argue that removing barriers relieves students of a burden rather than helping them carry it, potentially leaving them less able to meet deadlines. We disagree. Flexibility is not the absence of rigor; it is the condition under which rigor becomes possible for those facing unpredictable obstacles. The portal has already been purchased, so cost is not a factor in choosing between these live options. The choice is purely about how we structure authority.

  **Implementation Plan**

  *   **November 15, 2023:** Registry to publish all algorithmic thresholds currently used to flag students in the portal.
  *   **January 10, 2024:** Pilot launch of automatic extensions in the Faculty of Humanities. The right to demand written justification goes live simultaneously.
  *   **March 1, 2024:** Review of pilot data regarding staff workload and student uptake of support conversations.
  *   **September 1, 2024:** University-wide rollout.
  *   **Ongoing:** Any student flagged by the system must be notified within forty-eight hours and provided a link to contest the flag.

  **The Strongest Case for the Option We Are Not Recommending**

  The strongest alternative view belongs to the second group on the committee, who prioritize effective capability over standing. They argue that the petition file was not merely a gatekeeping mechanism but a diagnostic tool. Under their view, the privacy and autonomy gained by the new system are outweighed by the loss of human contact that identified students in severe crisis. For this option to win, two things would have to be true. First, the automated flags would have to fail to identify struggling students at a rate higher than the current petition system. Second, the "support conversation" triggered by a flag would have to prove less effective than the caseworker intervention it replaces. If the new system leaves vulnerable students invisible until they fail, then the gain in standing is a hollow victory. We believe the requirement to publish thresholds and allow record correction mitigates this risk, but this remains the primary vulnerability of our recommendation.

  The Committee urges the Academic Board to approve this recommendation to ensure that our regulations protect not only the academic standards of the University but the civic standing of its students.

  **Signed,**

  **The Academic Regulations Committee**
