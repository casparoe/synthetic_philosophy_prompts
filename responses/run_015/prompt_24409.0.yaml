prompt: |-
  I'm in a seminar on interpretability and we keep going in circles on whether neural nets actually have representations or whether 'representation' is just us projecting onto them. Can you write the joint statement a committed representationalist and a committed anti-representationalist (the deflationist who thinks 'representation' is only a relation to an interpreter, not a property the network has) could both sign after a good-faith adversarial collab? I want the claims both would agree on, the precise disagreements each phrased so their own side would accept the wording, the cruxes, and for each crux a concrete case or argument both would agree bears on it with each side's prediction written down in advance. I think one crux is whether there's a fact of the matter about what a feature represents indepentent of the interpreter, and another is whether the fact that many different bases can compute the same function is a real problem for realism or just a hardness problem. Format it as a numbered agreed-claims section followed by a disagreements table.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on interpretability (ML/AI).
      *   **Problem:** Circular debate between Representational Realists (neural nets *have* representations) and Deflationist Anti-Representationalists (representation is observer-relative/projection).
      *   **Task:** Write a joint statement both sides could sign after a "good-faith adversarial collab."
      *   **Required Components:**
          *   Numbered Agreed Claims section.
          *   Disagreements Table (Precise disagreements, Cruxes, Concrete Cases/Arguments, Predictions from each side).
      *   **Specific Cruxes Mentioned:**
          1.  Fact of the matter about features independent of interpreter.
          2.  Basis invariance/polysemanticity (many bases computing same function) as a problem for realism vs. hardness.
      *   **Tone:** Philosophical precision, technical accuracy (ML context), collaborative but distinct voices merged into a consensus document.

  2.  **Deconstruct the Positions:**
      *   **Representational Realist (RR):** Believes internal activations/weights encode information about the world/tasks in a way that exists independently of human analysis. "The network *knows* X." Linear probes find truth.
      *   **Deflationist/Anti-Representationalist (AR):** Believes "representation" is a useful shorthand for input-output behavior + human interpretation. Without an interpreter, it's just math. "The network *computes* X, but doesn't *represent* X." Linear probes find what *we* can read, not what's *there*.

  3.  **Drafting Agreed Claims (The Common Ground):**
      *   Need to avoid metaphysical commitments while acknowledging empirical realities.
      *   *Claim 1 (Functionality):* Both agree nets map inputs to outputs.
      *   *Claim 2 (Structure):* Both agree there is internal structure (activations, weights) that correlates with inputs/outputs.
      *   *Claim 3 (Interpretability Utility):* Both agree finding structure helps prediction, debugging, and safety, regardless of ontological status.
      *   *Claim 4 (Observer Role):* Both agree humans design the probes/loss functions, so human bias is present.
      *   *Claim 5 (Causal Leverage):* Both agree manipulating internal states changes outputs (causal validity).

  4.  **Drafting Disagreements (The Core Conflict):**
      *   *Crux 1: Ontological Status of Features.*
          *   RR: Features exist prior to probing.
          *   AR: Features emerge via the probing relationship.
          *   *Test Case:* Discovery of a feature *before* knowing its semantic meaning (e.g., "golden gate bridge neuron" found via clustering, then labeled).
          *   *Prediction:* RR says the cluster existed naturally; AR says the clustering algorithm imposed the structure.
      *   *Crux 2: Basis Invariance (The "Many Basis" Problem).*
          *   RR: There is a "true" basis (e.g., superposition implies a ground truth sparse basis).
          *   AR: All bases are equally real/valid; choosing one is pragmatic, not truth-tracking.
          *   *Test Case:* Rotational invariance in a linear layer vs. Sparse Autoencoder (SAE) recovery.
          *   *Prediction:* RR says SAE finds the *real* features; AR says SAE finds the *most useful* features for compression.
      *   *Crux 3 (Optional but good): Causal Intervention.*
          *   Does intervening on a "feature" prove it's a representation or just a control knob?
          *   Let's stick to the user's suggested two cruxes to keep it tight, maybe refine the second one to be about Polysemanticity/Superposition.

  5.  **Refining the Cruxes & Predictions (The "Adversarial" part):**
      *   *Crux 1 (Mind-Independence):*
          *   *Scenario:* An unsupervised method finds a direction $v$. Later, humans realize $v$ corresponds to "sentiment."
          *   *RR Prediction:* The direction $v$ was causally responsible for sentiment processing *before* we labeled it.
          *   *AR Prediction:* The direction $v$ is only a "sentiment representation" relative to the decoding scheme we applied later. Before labeling, it was just a vector.
      *   *Crux 2 (Basis Uniqueness):*
          *   *Scenario:* Two different SAEs trained on the same activations find slightly different feature sets (due to random seeds/hyperparams), both reconstruct well.
          *   *RR Prediction:* One is closer to the "ground truth" features (verifiable via downstream robustness or transfer).
          *   *AR Prediction:* Both are equally valid; "ground truth" is ill-defined. Differences reflect inductive biases of the SAE, not the model.

  6.  **Review and Polish:**
      *   *Tone Check:* Is it too academic? Too casual? Needs to sound like a formal consensus statement.
      *   *Clarity:* Ensure the distinction between "computation" (agreed) and "representation" (disputed) is clear.
      *   *Formatting:* Numbered list for agreements, Table for disagreements.
      *   *Constraint Check:* Did I include the specific cruxes requested? Yes (Fact of the matter, Basis invariance).

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the AR position doesn't sound like "nothing matters." They believe interpretability matters, just not the *realist* ontology.
      *   *Correction:* Ensure the RR position doesn't sound naive. They acknowledge superposition and noise.
      *   *Refinement on Crux 1:* The "Independent Fact" crux needs a specific empirical test. Let's use "Unsupervised Discovery + Causal Validation."
      *   *Refinement on Crux 2:* The "Basis" crux is about Superposition. Let's focus on whether SAEs recover *the* features or *a* feature set.

  8.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  # Joint Statement on the Ontological Status of Neural Network Representations
  **Signed:** The Representational Realist Coalition & The Deflationist Interpretability Working Group
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on Mechanistic Interpretability

  ## Part I: Agreed Claims
  *We, the undersigned, agree to the following empirical and methodological claims, regardless of our ontological commitments regarding "representation."*

  1.  **Computational Reality:** Neural networks instantiate high-dimensional, non-linear functions mapping inputs to outputs. This input-output behavior exists independently of human observation.
  2.  **Internal Structure:** Internal states (activations, weights, gradients) exhibit stable statistical structure. Specific directions or subspaces in activation space correlate robustly with specific semantic properties of the input or target functions.
  3.  **Causal Leverage:** Interventions on specific internal directions (e.g., activation patching, vector addition) reliably alter network output in predictable ways. This causal leverage holds regardless of whether one labels the intervened direction a "representation."
  4.  **Interpreter Dependence of Semantics:** The *semantic labels* assigned to internal features (e.g., "dog detector," "sentiment axis") are assigned by humans or training objectives external to the network weights. No internal activation contains a string literal or semantic tag.
  5.  **Utility of the Construct:** Treating internal states "as if" they are representations is a pragmatically useful heuristic for debugging, safety auditing, and capacity planning, even if the ontological status of those representations is disputed.
  6.  **Superposition is Real:** Networks routinely represent more features than they have dimensions (superposition). Both sides agree this is a mathematical fact of the architecture, though we disagree on its implications for feature realism.

  ***

  ## Part II: Table of Disagreements and Cruxes
  *Where we diverge, we commit to the following precise phrasings of our positions and the empirical tests that bear on them.*

  | Crux | Representational Realist Position (RR) | Deflationist Anti-Representationalist Position (AR) | Concrete Case / Argument | Divergent Predictions (Pre-Registered) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Mind-Independence of Features**<br>*(Is there a fact of the matter about what a feature represents independent of the interpreter?)* | **Claim:** Features exist prior to probing. A direction $v$ in activation space *is* a representation of property $P$ if it causally encodes $P$, regardless of whether a human has identified it.<br><br>**Ontology:** Representation is a relation between the network and the world (or task). | **Claim:** Features emerge via the probing relationship. A direction $v$ is only a representation of $P$ relative to a decoding scheme $D$ chosen by an interpreter.<br><br>**Ontology:** Representation is a three-place relation: Network $\to$ Interpreter $\to$ World. | **Case:** *Unsupervised Discovery.*<br>An unsupervised algorithm (e.g., clustering or SAE) isolates a feature direction $v$ without semantic labels. Later, humans identify $v$ correlates with "sarcastic tone."<br><br>**Question:** Did the network *have* a sarcasm feature before the humans labeled it? | **RR Prediction:** The direction $v$ was causally responsible for processing sarcasm *before* labeling. If we intervene on $v$ in past checkpoints, sarcasm handling degrades.<br><br>**AR Prediction:** The direction $v$ was merely a statistical regularity. It became a "sarcasm representation" only when the decoding scheme (the human label) was applied. Intervention works, but that proves causal control, not pre-existing semantic content. |
  | **2. Basis Invariance & Superposition**<br>*(Is the fact that many different bases can compute the same function a problem for realism or just a hardness problem?)* | **Claim:** There is a "true" or "natural" basis. Superposition is a compression constraint, but the underlying features are discrete and distinct. Different bases are not equally valid; some are closer to the ground-truth mechanistic structure.<br><br>**Goal:** Find *the* features. | **Claim:** Basis choice is pragmatic. Because linear transformations preserve function, no basis is ontologically privileged. "Features" are convenient coordinate systems for humans, not natural kinds of the network.<br><br>**Goal:** Find *useful* features. | **Case:** *SAE Variance.*<br>Two Sparse Autoencoders (SAE A and SAE B) are trained on the same layer with different seeds/hyperparameters. Both achieve low reconstruction loss but recover non-identical feature sets (some features rotate or split/merge).<br><br>**Question:** Is one SAE recovering the "real" features? | **RR Prediction:** One SAE (or a third, better one) will demonstrate superior *downstream transfer* or *robustness to adversarial perturbation*, indicating it aligned with the network's true causal structure.<br><br>**AR Prediction:** Both SAEs are equally "real." Differences reflect the inductive biases of the SAE training, not the base model. No metric will show one is ontologically superior, only pragmatically different for specific tasks. |
  | **3. The Role of the Loss Landscape**<br>*(Does the training objective select for specific representations?)* | **Claim:** The loss landscape + architecture constrains solutions such that specific representations are convergent. Different seeds will converge to semantically equivalent features (convergent evolution). | **Claim:** The loss landscape constrains *behavior*, not *mechanism*. Functionally equivalent networks can implement wildly different internal geometries (parameter space is vast). | **Case:** *Convergent Evolution.*<br>Train 100 models on identical data/architecture with different seeds. Probe for a specific concept (e.g., "addition circuit").<br><br>**Question:** Do the circuits look the same? | **RR Prediction:** The circuits will be isomorphic up to simple permutations/rotations. The representation is determined by the task.<br><br>**AR Prediction:** The circuits will be functionally identical but mechanistically heterogeneous. Any similarity is due to human projection selecting the similar parts and ignoring the differences. |

  ***

  ## Part III: Commitment to Resolution
  *We agree that further philosophical debate without empirical adjudication is unproductive. We commit to funding and evaluating the predictions listed in Part II. If the Realist Prediction on Crux 2 (SAE Variance) fails to show a distinct "true" basis after three rigorous attempts, the Realist side agrees to update toward a pragmatic view of features. If the Deflationist Prediction on Crux 1 (Mind-Independence) fails to account for causal stability across training checkpoints, the Deflationist side agrees to update toward a weak-realist view of internal structure.*

  **Signatures:**

