  **UNIVERSITY COMMITTEE ON COMMEMORATIVE COHERENCE**
  **Minutes of Meeting 14-B**
  **Date:** October 14, 2023
  **Location:** Admin Building, Room 304
  **Attendees:** Dr. Aris (Chair), Prof. Blum, Dean Carter, Legal Counsel (ex officio)

  **1. Call to Order**
  The Chair called the meeting to order at 9:00 AM. The quorum was confirmed. The minutes of the previous session regarding the removal of the Founders' Plaque were approved without amendment.

  **2. Item: Disposition of the Silas Vane Statue**
  The Committee reviewed the petition to remove the statue of Silas Vane from the Main Quad. The Committee applied the standard Honoring Amortization schedule. The statue was erected in 1904. Assuming a standard honoring half-life of 40 years, the residual honoring value is currently 0.04 percent of the original asset. The Committee noted that maintenance costs now exceed the residual expressive value. It was moved and seconded to classify the statue as a fully depreciated asset eligible for write-off.

  **3. Item: Expressive Impact and Contextualization**
  Prof. Blum noted that retaining the statue constitutes an affirmative speech act by the University in the present tense, not a mere omission of removal. The Committee considered the proposal to add contextualizing plaques. Legal Counsel advised that contextualization fails to arrest Honoring Leakage. The honor associated with the statue spills into adjacent structures, including the Vane Library and Vane Avenue. A plaque on the plinth does not contain the leakage radiating from the street name or the endowed chair. To fully contain the leakage would require renaming the street and liquidating the endowment, which violates fiduciary duties to the original donor contract. Therefore, partial contextualization is inefficient.

  **4. Item: The Epistemic Defense**
  The Committee addressed the argument that Vane should be judged by the standards of his time. The Committee accepted that if historical ignorance mitigates moral liability for past deeds, it must also mitigate liability for current deeds. The University cannot claim moral certainty regarding current honors that future generations will not possess. If Vane is excused for not knowing slavery was impermissible, the University must acknowledge it likely does not know what current practices will be deemed impermissible in 2123. Retention of the statue implies a confidence in current moral judgment that the epistemic record does not support.

  **5. Item: Standing and Entanglement**
  The Committee reviewed standing. The Vane descendants request retention based on backward-looking fidelity obligations. Current students request removal based on forward-looking expressive harm. The Chair noted that the University's own founding capital is entangled with the Vane estate. Consequently, the University lacks neutral standing to adjudicate the matter. However, as no other body exists with jurisdiction over campus space, the Committee must proceed despite the conflict of interest. The asymmetry of action was noted: erecting a statue creates a permanent obligation, while removing one creates only a temporary vacancy. To minimize permanent obligations, the Committee must reduce the duration of all future honors.

  **6. New Business: Pre-emptive Depreciation**
  To resolve the conflict between backward-looking fidelity and forward-looking harm, the Committee considered a structural adjustment to the commemorative framework. If honoring force depreciates inevitably, and if moral certainty is impossible, the Committee should align the formal lifespan of honors with their amortization schedule.

  **Resolution 14-B-1**
  It was moved and carried that all commemorative honors (statues, named buildings, endowed chairs) shall be issued with a mandatory Sunset Clause of twenty years. Upon expiration, the honor reverts to neutral designation unless renewed by a two-thirds vote of the Standing Committee. Furthermore, all new honors must include a pre-written dedication to future revocation, acknowledging the likelihood of future moral progress. This ensures the University speaks in the present tense without binding the future.

  **Adjournment**
  The meeting was adjourned at 10:15 AM.

  ***

  **APPENDIX A: HONORING AMORTIZATION SCHEDULE (EXCERPT)**

  | Asset | Date Erected | Initial Value (HV) | Depreciation Rate | Residual HV | Maintenance Cost | Net Expressive Yield |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Vane Statue | 1904 | 100.0 | 2.5% / yr | 0.04 | $4,500/yr | Negative |
  | Vane Library | 1910 | 150.0 | 1.0% / yr | 12.5 | $120,000/yr | Neutral |
  | Vane Chair | 1950 | 50.0 | 5.0% / yr | 1.2 | $80,000/yr | Positive |

  *Note: Honoring Leakage coefficient applied to Library and Chair suggests actual Residual HV is lower due to adjacency contamination. Sunset Clause recommended to reset coefficient.*
