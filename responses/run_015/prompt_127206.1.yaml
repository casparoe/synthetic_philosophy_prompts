answer: |-
  **Examination Question**

  **Course:** PHIL405: Scepticism and Common Sense
  **Time Allowed:** 90 Minutes
  **Texts:** G.E. Moore, *Proof of an External World*; Descartes, *Meditations I & VI*.

  **Question:**

  Moore stipulates that a rigorous proof requires three conditions: (i) the premises must differ from the conclusion; (ii) the premises must be known to be true; and (iii) the conclusion must follow from the premises. He claims his 'Here is one hand' argument satisfies these, thereby proving an external world.

  Consider two scenarios involving a subject, Anna:
  1.  **Simulation:** Anna is in a lifelong computer simulation. She has simulated hands and interacts with simulated tables. The simulation runs on a material machine in a wider world.
  2.  **Direct Feed:** Anna receives neural stimulation identical to Scenario 1, but there are no hand-shaped objects anywhere in her reality; her evidence is subjectively indistinguishable from Scenario 1.

  In Scenario 1, Moore's conclusion ('external objects exist') is arguably true (simulated objects are spatial and external to the mind), yet her epistemic position is identical to Scenario 2, where the premise ('Here is a hand') is false.

  Drawing on Moore's essay and the Cartesian sceptical arguments you have studied, answer the following:
  Does Moore's procedure resemble the physicist's practice of 'calibration' (trusting instruments prior to independent verification), or is it a category mistake? In your answer, distinguish carefully between the *truth* of Moore's premises, his *knowledge* of them, and the *standing* his argument provides. On which of Moore's three conditions does the sceptical pressure actually fall, and why?

  ***

  **Model Answer**

  Moore's proof is often dismissed as a blatant beg of the question, but this overlooks his specific reconfiguration of what a proof requires. He accepts the sceptic's logic but rejects their epistemic priorities. To evaluate whether his move is legitimate 'calibration' or dogmatism, we must isolate where the argument breaks under sceptical pressure.

  Moore lists three conditions for a proof: distinct premises, known premises, and valid inference. The sceptic (channeling Descartes) grants (i) and (iii). The proposition 'Here is a hand' is distinct from 'An external world exists,' and the inference is valid. The collapse occurs entirely at condition (ii): *knowledge*. The Cartesian dreaming argument does not assert that hands do not exist; it asserts that you cannot *know* they exist because your evidence is compatible with their absence.

  The Anna cases illuminate this distinction. In Scenario 1 (Simulation), Moore's conclusion is metaphysically true: simulated hands are spatial objects external to Anna's mind. In Scenario 2 (Direct Feed), the premise is false. However, Anna's internal evidence is identical in both. If Moore's proof relies on the *truth* of the premise, it works in Scenario 1 and fails in Scenario 2. But Anna cannot tell which scenario she inhabits. Therefore, the truth of the premise cannot be what justifies her claim to *know*. Moore admits this implicitly: he does not offer new evidence to rule out Scenario 2. Instead, he asserts that his certainty about the hand is greater than his certainty about the sceptical premises required to doubt it.

  This brings us to the calibration analogy. In physics, instruments are trusted via a chain of calibration that ultimately terminates in standards accepted by the practice, not by comparison to a 'view from nowhere.' The physicist accepts this bootstrapping as necessary for measurement to begin. Moore is attempting a similar epistemic bootstrapping. He treats common sense propositions ('Here is a hand') as the calibration standards against which philosophical arguments are measured, rather than vice versa.

  Is this a category mistake? It depends on the goal of the proof. If the goal is to convince a sceptic who demands independent verification (a 'God's eye view' of the hand), Moore fails. He offers no independent check. However, if the goal is to establish what we are *entitled* to assume in ordinary discourse, the analogy holds. Moore shifts the burden of proof. He argues that it is more reasonable to trust the 'instrument' (sensory experience) than to trust the abstract reasoning that suggests the instrument is flawed.

  However, there is a crucial disanalogy. In physics, calibration standards are inter-subjective and causally linked to the world. Moore's 'standards' are private perceptual claims. If Anna is in Scenario 2, her 'calibration' is disconnected from reality. Moore's defence is not that he is infallible, but that scepticism is less certain than common sense.

  Therefore, the sceptical pressure falls exclusively on condition (ii). Condition (i) is trivial, and (iii) is logical. The 'standing' Moore gains is not a metaphysical guarantee against Scenario 2, but an epistemic permission to ignore it. He does not prove the external world to the sceptic; he proves that the sceptic's requirements for proof are unreasonable. The argument functions not by establishing truth through inference, but by prioritizing one type of knowledge (perceptual) over another (philosophical). Whether this is legitimate calibration or vicious circularity depends on whether one accepts Moore's hierarchy of certainty. If knowledge requires the elimination of all doubt (Cartesian), Moore fails. If knowledge allows for reasonable certainty based on practice (Common Sense), Moore succeeds. The 'crux' is not the existence of hands, but the definition of knowledge itself.

  ***

  **Marking Scheme (20 Marks)**

  **1. Identification of Moore's Three Conditions & Location of Pressure (4 marks)**
  *   **Award:** Correctly lists the three conditions and identifies Condition (ii) (Premises must be known) as the sole point of sceptical contention.
  *   **Error:** Candidates often focus on validity (iii) or distinctness (i), or claim the sceptic denies the truth of the premises rather than the knowledge of them.

  **2. Analysis of the Anna Cases (Truth vs. Evidence) (4 marks)**
  *   **Award:** Notes that in Scenario 1 the conclusion is true but epistemically inaccessible; in Scenario 2 the premise is false. Concludes that since evidence is identical, 'truth' cannot be the source of warrant.
  *   **Error:** Treating Scenario 1 as a success for Moore without noting that Anna cannot distinguish it from Scenario 2 (confusing metaphysics with epistemology).

  **3. Evaluation of the Calibration Analogy (4 marks)**
  *   **Award:** Explains the analogy (terminating standards vs. independent verification) and assesses it. Must note the disanalogy regarding private vs. public standards or causal connection.
  *   **Error:** Accepting the analogy uncritically as a perfect match, or rejecting it entirely without explaining the structural similarity regarding 'bootstrapping'.

  **4. Distinction between 'Truth', 'Knowledge', and 'Standing' (4 marks)**
  *   **Award:** Clearly distinguishes that Moore's premises might be true (Truth), but the argument turns on whether he is entitled to claim he knows them (Knowledge), which grants him the dialectical Standing to dismiss scepticism.
  *   **Error:** Collapsing 'truth' and 'knowledge' (e.g., "He knows it because it is true"), missing Moore's specific epistemic claim.

  **5. The Crux: Hierarchy of Certainty (4 marks)**
  *   **Award:** Identifies that Moore's argument is not a derivation of new facts, but a claim that common sense is more certain than sceptical hypotheses. This is the 'First Class' differentiator.
  *   **Error:** Treating the essay as a failed attempt to refute dreaming, rather than a successful re-ordering of epistemic priorities.

  **Total:** 20 Marks

  **Note on Grading: First Class vs. Upper Second**
  An **Upper Second (2:1)** answer will correctly deploy the vocabulary (begging the question, conditions of proof, dreaming hypothesis) and accurately describe the Anna cases. It will likely conclude that Moore fails to satisfy the sceptic.
  A **First Class** answer must identify the **crux**: that Moore is not playing the sceptic's game but changing the rules. It must explicitly argue that the 'calibration' analogy succeeds only if we accept Moore's redefinition of 'knowledge' as reasonable certainty rather than absolute indubitability. The 2:1 describes the stalemate; the First explains *why* Moore thinks the stalemate is a victory. Penalise answers that list the conditions without explaining why Condition (ii) is the *only* one that matters for the 'standing' Moore claims.
