answer: |-
  The generator ticked as it cooled, the silence rushing in to fill the space where the hum had been. Eleanor opened the trap lid. The smell was sharp, ozone and crushed vegetation, overlaid with the dry dust of scales. Inside, the egg-boxes shifted as she lifted them, a dry rustling like falling sand.

  "Jesus," Julian said, leaning in. He was thirty, maybe younger, with the bright, unsettled eyes of someone who had only ever met numbers on a page. "There are so many."

  "There are always this many," Eleanor said. She wore her magnifying loupe around her neck like a penance. "Mostly Heart and Darts. Some Large Yellow Underwings. The usual fifteen."

  She began the sort. Her hands moved with the economy of decades, brushing moths into the sorting tray. They were worn. That was what the philosophers never pictured. In their diagrams, the insect was a pristine unit of suffering. In the tray, the wings were tattered, scales rubbed off by nights of collision, edges frayed. They were at the end of a week-long life. Most had already survived the gauntlet of the juvenile stage; the ones in the trap were the survivors of the survivors, now nearing natural decay.

  Eleanor opened her tally book. The first column was for the count. The second column was blank, waiting for a number she couldn't justify.

  "In the group," Julian said, watching her separate a cluster of identical brown moths, "we agreed that even if the chance of sentience is one in a billion, the population size makes the expected suffering enormous. It outweighs everything else."

  Eleanor paused, holding a moth by its thorax. It twitched, legs pedaling the air. "Look at them," she said. "Do you think sentience is a lottery ticket? Like each one draws independently?"

  "Well… expectation is linear. It doesn't matter."

  "It matters to the shape of it," she said. She dropped the moth into the tray. "If this one feels, then that one feels. And that one. They are the same machine, built from the same blueprint. It isn't a trickle of probabilities. It's a switch. Either the box is full of lights, or it's full of stones."

  Julian frowned, looking at the swarm. "But if the switch is on, the total is still huge."

  "If the switch is on," Eleanor said. "But you're treating the probability of existence as a multiplier for the magnitude. You say that with these numbers, the probability that *at least one* suffers is effectively one. So you think you've settled the matter."

  "Have I not?"

  "You've settled that there might be a witness," Eleanor said. "You haven't settled what the witness is witnessing." She brushed a pile of scales from her thumb. They looked like grey snow. "Is it a life? Or is it a moment? These lives are short, Julian. Half their cohort died as larvae and never made it to the count. If consciousness isn't unified across time—if it's just a series of flashes—then what are we summing? Moments? Lives? The space between flashes?"

  She felt the letter in her pocket. It was from Martin, her old colleague. He wanted to know if the institute should switch to a new biopesticide. *More humane,* the brochure said. *Reduced nociception.* Her instinct, the instinct of thirty years, was to tell him it was a vanity. These populations were r-selected. They lived at carrying capacity. If you killed a thousand moths with poison, a thousand more would survive the winter because there was more leaves for them to eat. The total suffering would remain constant, dictated by the energy available in the ecosystem. You might even increase it, by prolonging the die-off.

  She hadn't written back.

  "What do you do with them?" Julian asked.

  "Usually release," Eleanor said. "But sometimes we kill for verification. Precision."

  "If you're worried about the sum," Julian said, "surely killing them is… merciful? If the switch is on."

  Eleanor looked at the tray. If she killed them, she ended the potential for predation, for starvation, for the slow wearing down of wings. But if Martin was right, if the carrying capacity held firm, their deaths would simply make room for others. The slot in the ecosystem would be filled. The suffering would not be erased; it would be displaced.

  And if she released them? They would fly into the dawn. A bird would take half of them within the hour. Was the bird's beak more humane than the killing jar? Or was the jar an assertion of a value that didn't exist in the grass?

  "The problem," Eleanor said, "is that you want to count the suffering like you count the catch. One, two, three." She picked up a Large Yellow Underwing. It was vibrant, still fresh. "But if the consciousness is fragmented, if it's just reflex arcs firing without a central 'I' to hold the pain… then killing it doesn't save a story. It just stops a mechanism."

  "But you can't know that."

  "No," she said. "I can't."

  She looked at the second column in her book. She had been filling it with zeros, then erasing them. If she assigned a value to the sentience, the total became astronomical. If she assigned zero, it was nothing. The correlation meant she couldn't average it out. She couldn't say, 'Well, some feel, some don't.' It was all or nothing. The moral weight was not a steady accumulation; it was a cliff edge.

  And the probability argument—the idea that *some* must suffer—felt like a trick of language. Establishing that the room was not empty didn't tell you how many people were in it, or if they were screaming.

  "Martin asked about the pesticide," she said suddenly.

  "The humane one?"

  "He thinks it reduces pain. I think it just changes the method of removal." She looked at the moth in her hand. It had stopped pedaling. It was waiting. "If I release these, they contribute to the next generation. If I kill them, they don't. But the population stays the same. The suffering budget is fixed by the sun and the leaves."

  "So intervention is futile?"

  "Or worse," she said. "We might be optimizing for our own comfort, not theirs."

  She held the moth over the killing jar. The cyanide crystals were white at the bottom. Then she moved her hand over the open window of the shed, where the morning light was turning the grass gold.

  To kill was to assume the life was a unified thing worth ending. To release was to assume the life was a unified thing worth continuing. Both assumptions felt like projections. The moth was just a machine made of meat and light, designed to copy itself before it broke.

  "What will you write in the book?" Julian asked.

  Eleanor looked at the second column. The space for the moral sum.

  "I think," she said, "I will leave it blank."

  She opened her hand. The moth dropped onto the windowsill, waited a heartbeat, and then launched itself into the air, wobbling slightly on damaged wings. It flew toward the hedge, where a spider waited, where the carrying capacity waited, where the sum total of suffering waited, unchanged by her mercy or her calculation.

  "Count it as one," she said, and wrote in the first column. She closed the book on the second.
