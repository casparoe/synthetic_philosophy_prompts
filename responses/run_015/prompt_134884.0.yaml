answer: |-
  **The Example:**
  Use **spontaneous polyploidy in a single population of an endangered wildflower**. Imagine a protected species of diploid plant (two sets of chromosomes) where a mutation suddenly doubles the chromosomes in the entire remaining population. These new tetraploids can only breed with each other, not the original diploids. The original diploid form is now gone.

  **Why It's a Real Problem (The Ontological Clash):**
  This isn't just semantics; it's a clash between **Species-as-Classes** vs. **Species-as-Individuals**.
  *   **The Class View:** A species is a category defined by traits (like "gold"). If the chromosomes change, it's a different category. The original species is **extinct**, and a new one exists.
  *   **The Individual View:** A species is a historical lineage (like a person). It stays the same individual as long as there's continuous ancestry, even if it changes properties. The original species **survived** via transformation.
  *   **The Stake:** Under the Endangered Species Act, if the listed "individual" went extinct, legal protections might vanish. If it survived, protections stay. One view says we failed conservation (1 extinction); the other says we succeeded (0 extinctions).

  **Strongest Objection & Rebuttal:**
  *   **Classmate:** "Who cares? You're still protecting the same plants in the same ground. The biology is what matters, not the label."
  *   **You:** "Conservation law isn't about 'plants'; it's about specific legal entities. If the law protects 'Species X' and Species X is extinct by definition, you lose funding and legal standing. Ontology determines budget and policy."

  **Why This Beats Ring Species:**
  "Ring species argue about where to draw a spatial boundary between neighbors; this case argues about whether an entity survives its own history over time."
