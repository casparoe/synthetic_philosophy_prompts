      *   *The Impasse:* Side A talks metaphysics; Side B talks ethics. They talk past each other because they prioritize different intuitions (Interconnectedness vs. Accountability).

  3.  **Evaluate the Nature of the Dispute (Verbal vs. Bedrock):**

      *   It's not *purely* verbal. If it were just definitions, they could agree to disagree. But the stakes are high (moral responsibility, human rights, restorative justice).
