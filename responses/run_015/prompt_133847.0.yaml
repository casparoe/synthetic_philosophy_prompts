      *   *Side B (Weak/Normative):* "I am, and I flourish because we are." If the "we" dissolves, the "I" remains a person but is stunted. Recognition is affirming. Agency is individual but context-dependent. Boundaries are distinct but permeable.
      *   *The "Relational" Ambiguity:*
