  In my philosophy semianr we were talking about Wittgenstein's family resemblance thing and my prof kept dropping 'meaning is use' to shut down questions. Most recently I asked about this hypothetical activity I made up called glorp — it's got rules like chess but you play it totally alone in a closet with no one else around, not even an audience. I wondered if glorp counts as a game, or if the word 'game' just doesn't apply when there's zero social context. She said since there's no public use of 'glorp', the question is meaningless, and that's just what Wittgenstein's slogan means. But I think that slogan is doing way too much work. Can you lay out the different precise claims 'meaning is use' could be expressing — from the trivial 'people learn words from hearing them' to the radical 'mental states contribute literally nothing to semantics'? For each reading say whether it's defensible, whether it actually needs family resemblance to work, and whether it gets her to dismiss glorp. Don't just explain one interpretation — I want a full menu with verdicts: which are platitudes, which are substantive, which are false, and which one she's actually invoking. I don't need a bibliography, just the disambiguation I can take to office ours.
