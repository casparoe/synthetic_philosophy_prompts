answer: |-
  ### 1. Translation

  Here is the restatement of the Madhyamaka claims into the vocabulary of intensional type theory (ITT) with a hierarchy of universes, proof irrelevance, and constructive negation.

  **Svabhāva (Intrinsic Nature)**
  *   **Translation:** A term $t$ of type $T$ possesses *svabhāva* if and only if $t$ is a closed canonical inhabitant valid in the empty context ($\cdot \vdash t : T$) and its identity is definitionally stable under all substitutions (i.e., $t$ is a neutral term that does not reduce further and requires no hypotheses).
  *   **Choice/Cost:** I have modeled *svabhāva* as **Context-Independent Inhabitation**. This captures "independence from relations." The cost is that it conflates ontological independence with syntactic closure. In Madhyamaka, a thing might exist but depend on causes; in TT, a closed term exists without hypotheses. This reading assumes that "relations" map to "contextual dependencies."

  **Śūnyatā (Emptiness)**
  *   **Translation:** For every type $T$ in the universe, the type of *svabhāva* for $T$ is uninhabited. Formally: $\Pi (T: \mathcal{U}). (\text{Svabhāva}(T) \to \bot)$.
  *   **Choice/Cost:** Emptiness is a **universal negation**. It is not that $T$ is empty (uninhabited), but that $T$ *having intrinsic nature* is empty. The cost is that this makes emptiness a predicate on types, risking the reification of the predicate itself (addressed in "Emptiness of Emptiness").

  **Pratītyasamutpāda (Dependent Origination)**
  *   **Translation:** Every inhabited type $T$ requires a non-empty context $\Gamma$ for its inhabitant $t$. Formally: $\forall t: T, \exists \Gamma \neq \cdot \text{ such that } \Gamma \vdash t : T$. Existence is strictly **Context-Dependent**.
  *   **Choice/Cost:** I map "dependence on conditions" to **Contextual Validity**. The cost is that TT contexts are syntactic, while conditions are often causal or mereological. This translation captures the structural dependency but loses the temporal/causal asymmetry.

  **The Catuṣkoṭi (Four Corners) applied to Origination**
  Let $P$ be the proposition "Entity $e$ originates from cause $c$."
  1.  **From Self:** $\Gamma \vdash t : (c = e) \to \text{Originate}(e, c)$. (Rejected: $\neg$)
  2.  **From Other:** $\Gamma \vdash t : (c \neq e) \to \text{Originate}(e, c)$. (Rejected: $\neg$)
  3.  **From Both:** $\Gamma \vdash t : \text{Originate}(e, e) \times \text{Originate}(e, c)$. (Rejected: $\neg$)
  4.  **From No Cause:** $\Gamma \vdash t : \neg (\Sigma c. \text{Cause}(c, e))$. (Rejected: $\neg$)
  *   **Choice/Cost:** I treat the corners as **constructible types**. Nāgārjuna's rejection is inhabiting the negation of each. The cost is that this assumes the disjunction of the four is exhaustive, which Nāgārjuna ultimately denies (see "No Position").

  **The Two Truths**
  *   **Conventional Truth:** Types that are inhabited within a specific context $\Gamma$ (local validity). These are computationally relevant; we can extract terms from them.
  *   **Ultimate Truth:** The meta-theoretic property that no type possesses *svabhāva* (global invalidity of context-independent existence). This is proof-irrelevant; knowing a thing is empty adds no computational content to the thing.
  *   **Choice/Cost:** Conventional = **Local Inhabitation**; Ultimate = **Global Non-Existence of Closed Terms**. The cost is making Ultimate Truth a meta-property rather than an object-level type, which risks making it ineffable in the system.

  **Emptiness of Emptiness**
  *   **Translation:** The predicate $\text{Śūnyatā}$ itself does not possess *svabhāva$. Formally: $\neg \text{Svabhāva}(\text{Śūnyatā})$. The proof that $T$ is empty is itself a term that depends on context and cannot be reified as a closed, independent object.
  *   **Choice/Cost:** This prevents **Reification of the Predicate**. If emptiness had *svabhāva*, it would be a type in a higher universe that exists independently. Emptiness of emptiness asserts that the negation operator itself is context-dependent.

  **No Position (Vigrahavyāvartanī)**
  *   **Translation:** The system exports no term of type `Thesis`. Formally, there is no closed term $t$ such that $t : \text{Position}$. The "function" Nāgārjuna defines takes any proposed `Position` and returns $\bot$, but does not return a `Position` of its own.
  *   **Choice/Cost:** This is **Non-Assertion**. It is not that he asserts $\bot$, but that he provides no inhabitant for the type of assertions.

  ---

  ### 2. Residue Report

  **What comes across cleanly:**
  *   **Negation as $\to \bot$:** The constructive definition of negation maps well to the *prasajya-pratiṣedha* (non-implicative negation) if treated carefully as a refusal to construct.
  *   **Dependence:** The idea that nothing stands alone maps cleanly to the requirement of a non-empty context $\Gamma$ for any term.
  *   **Emptiness of Emptiness:** This maps cleanly to the prohibition on treating the negation operator as a data-carrying type.

  **What survives only with supplied assumptions:**
  *   **The Subject of Verification:** Type theory assumes a verifier (the type checker). Madhyamaka implies the verifier is also empty. I have assumed the context $\Gamma$ includes the verifier, but TT usually treats the checker as external. To make this fit, I assumed the "context" includes the epistemic conditions of the observer.
  *   **Exhaustiveness of the Four Corners:** In TT, $P \lor \neg P$ is not a theorem. I had to assume the Catuṣkoṭi presents an exhaustive search space that is then proven to have no inhabitants, rather than a search space that is ill-formed.

  **What has no expression in this vocabulary:**
  *   **Soteriological Termination:** In TT, a proof terminates to a normal form. In Madhyamaka, the "goal" is the cessation of conceptual proliferation (*prapañca*). There is no type for "cessation of typing."
  *   **Non-Implicative Negation (Prasajya-pratiṣedha):** In TT, $\neg P$ is a function type $P \to \bot$. It is an object. A "bare denial" that does not posit the function is a meta-logical refusal to define the type, which the system cannot express internally.
  *   **The "Middle" Way:** There is no type for "The path between $P$ and $\neg P$." In TT, you are either in the type or in its negation (or undecided). Madhyamaka claims a mode of engagement that is neither assertion nor denial, which looks like `undefined` or `divergence` in TT, but is meant to be functional.

  ---

  ### 3. Verdict on the Residue

  **Limitation of Vocabulary vs. Original Claim:**
  *   **Non-Implicative Negation:** This is a **limitation of Type Theory**. TT is built on construction. A "bare denial" is anathema to the Curry-Howard correspondence. However, the original claim uses this to perform a pragmatic shift (stopping the game) rather than a logical derivation. The failure suggests the original claim is **performative**, not constative. It is an instruction to stop typing, not a new type.
  *   **The Middle Way:** This is a **limitation of Vocabulary**. TT forces a choice: inhabit or don't. Madhyamaka suggests a mode of *using* terms without *committing* to their ontological status. This maps to **Erasure**: using a term computationally while marking its proof-irrelevance. The "Middle" is the computational content stripped of the ontological commitment (the proof).

  ---

  ### 4. Ruling on Your Hunches

  **Hunch 1: Dependent Origination vs. Dependent Types**
  **Verdict: False Friend.**
  You are correct to suspect this.
  *   **Why:** In Dependent Type Theory, if you have a family $B: A \to \mathcal{U}$, the index $a: A$ must be a well-formed term. The dependency structure *presupposes* the validity of the index.
  *   **The Trap:** If you translate *Pratītyasamutpāda* as Dependent Types, you reify the conditions ($A$). You grant the conditions *svabhāva* (well-formedness in their own context) in order to define the dependence.
  *   **Madhyamaka Claim:** The conditions themselves are empty. There is no base case for the dependency chain.
  *   **Correction:** To model this, you would need a dependency where the index is *also* dependent, ad infinitum, with no ground type. In TT, this leads to ill-foundedness or non-termination. Madhyamaka accepts the infinite regress as the nature of reality; TT rejects it as ill-typed. Translating it as Dependent Types smuggles in a foundation (the index type) that Nāgārjuna denies.

  **Hunch 2: The Logic of the Catuṣkoṭi**
  **Verdict: Your formalization is correct for TT, but reveals the rhetorical nature of the original.**
  *   **Corners 3 & 4:** You are right. In constructive logic:
      *   Corner 3 ($P \land \neg P$) is $\bot$. Negating it ($\neg \bot$) is trivial ($\top$).
      *   Corner 4 ($\neg (P \lor \neg P)$) negates decidability. Negating *that* ($\neg \neg (P \lor \neg P)$) is a theorem in intuitionistic logic.
      *   Therefore, rejecting corners 3 and 4 carries **no information content** in TT. They are free theorems.
  *   **The Work:** The work is being done by Corners 1 and 2 ($P$ and $\neg P$). Rejecting these requires actual proof content.
  *   **The "Bare Denial":** You asked if there is a counterpart to non-implicative negation. In TT, the counterpart is **Withholding Construction**.
      *   Implicative Negation: I construct a function $f: P \to \bot$.
      *   Non-Implicative Negation: I do not define the type $P$.
      *   Nāgārjuna's move is to show that assuming $P$ is well-formed leads to contradiction. He is not inhabiting $\neg P$; he is showing $P$ is **Ill-Typed**.
      *   **Verdict:** The tetralemma is not a 4-valued semantics. It is a **case analysis on an ill-formed type**. The uniform surface of the four negations is rhetorical; logically, 3 and 4 are vacuous. The original claim is doing less logical work than its grammar suggests; it is a *reductio* on the coherence of the predication itself, not a selection of a truth value.

  **Hunch 3: Emptiness of Emptiness**
  **Verdict: Proof Irrelevance and Erasure, not Universe Stratification.**
  *   **Universe Stratification:** If you model emptiness as $T: \mathcal{U}_i \implies \text{Empty}(T): \mathcal{U}_{i+1}$, you create a hierarchy. This stabilizes the system but violates the spirit of "emptiness of emptiness," which denies the substantiality of the higher level. It makes Emptiness a *super-property*.
  *   **Impredicative Collapse:** If $\text{Empty}$ quantifies over all types including itself, you risk inconsistency (Girard's paradox).
  *   **The Nearest Fit:** **Proof Irrelevance**.
      *   If $\text{Empty}(T)$ is a proposition (in `Prop` or `Sort 0`), its inhabitants are irrelevant.
      *   "Emptiness of Emptiness" means the *distinction* between Empty and Non-Empty is not computationally relevant.
      *   **Regress Shape:** It is not a regress handled by stratification (moving up universes). It is a **collapse**. It says: "The proof that $T$ is empty carries no data." If it carried data, that data would have *svabhāva*.
      *   **Why others fail:**
          *   *Universe Lifting:* Reifies emptiness as a higher-order object.
          *   *Erasure:* Close, but erasure happens at extraction. Emptiness of emptiness is internal to the logic.
          *   *Impredicativity:* Too dangerous; allows self-reference that constructs terms.
      *   **Conclusion:** The regress is stopped by declaring the predicate **Irrelevant**. You can state "T is empty," but you cannot pattern-match on that proof to construct new data. This prevents "Emptiness" from becoming a new essence. It is a different animal than universe stratification; stratification preserves the distinction at a higher level, while emptiness of emptiness dissolves the distinction's weight.
