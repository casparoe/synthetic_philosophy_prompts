answer: |-
  You have hit on one of the most significant tension points in the philosophy of logic. Your intuition is sharp: **naive deflationism explodes immediately in the face of the Liar Paradox unless it adopts restrictions very similar to Tarski's.**

  Here is the breakdown of why this happens, how deflationists actually handle it, and whether your assessment of Tarski is correct.

  ### 1. Why "Just Say It's False" Doesn't Work
  You asked: *"I thought deflationists would just say it's false, but doesn't that already assume a truth predicate you can apply to the sentence?"*

  Exactly. If you are a deflationist, you are committed to the Disquotation Schema (DS):
  $$ \text{"}P\text{" is true} \iff P $$

  Now take the Liar sentence ($L$):
  $$ L = \text{"}L\text{ is not true"} $$

  If you assert "$L$ is false," you are asserting $\neg (\text{"}L\text{ is true"})$. By your own deflationary schema, that is equivalent to asserting $\neg L$.
  But $L$ *says* $\neg (\text{"}L\text{ is true"})$.
  So if $L$ is false, then what $L$ says is the case. If what $L$ says is the case, $L$ is true.
  $$ L \text{ is false} \implies L \text{ is true} $$

  You cannot simply assign it a classical truth value without contradicting the disquotation schema that defines your theory of truth. The paradox isn't about the *value* of the sentence; it's about the *consistency* of the truth predicate itself.

  ### 2. The Deflationist Move: Restricting the Schema
  You asked: *"Is the actual move that the disquotational schema is only allowed in a fixed object language, so the liar is basically a type error?"*

  **Yes.** This is the most common move for deflationists who want to maintain classical logic (like Paul Horwich, a leading minimalist/deflationist).

  If "is true" is merely a logical device for disquotation, it only functions correctly when the sentence $P$ does not itself contain the truth predicate referring to $P$'s own level.
  *   **Level 0:** Snow is white.
  *   **Level 1:** "Snow is white" is true.
  *   **Level 2:** ""Snow is white" is true" is true.

  The Liar sentence attempts to be Level $n$ and Level $n+1$ simultaneously. For a deflationist building a logic engine, the solution is to treat unrestricted self-reference involving the truth predicate as **ill-formed** (a syntax error).

  By restricting the Disquotation Schema to "grounded" sentences (sentences that don't depend on their own truth value for their truth conditions), the deflationist avoids the contradiction.

  ### 3. Is Deflationism Just Tarski Without the Metaphysics?
  You asked: *"If that's it, isn't deflationism basically Tarski's hierarchy minus the metaphysical stuff?"*

  This is a brilliant insight, but the relationship is slightly more nuanced.

  **Tarski's Goal:** Formal Consistency.
  Tarski wasn't primarily trying to tell us what truth *is* metaphysically. He was trying to define truth for formal languages without generating contradictions. He introduced the Object/Meta-language hierarchy as a **technical constraint** to prevent the Liar. He actually thought natural language was likely inconsistent and couldn't be formalized without modification.

  **Deflationism's Goal:** Metaphysical Minimalism.
  Deflationists want to claim that truth is not a robust property (like correspondence to facts). They want to say "is true" is just a logical tool.

  **The Convergence:**
  To save Deflationism from the Liar, Deflationists often **appropriate Tarski's technical constraint.**
  *   **Tarski:** "We must separate languages to avoid contradiction."
  *   **Deflationist:** "We must separate languages to avoid contradiction, *and* this proves truth isn't a deep property, just a syntactic device."

  So, you are mostly right. For the purpose of a **logic engine**, Deflationism + Consistency $\approx$ Tarskian Hierarchy.
  *   **Tarski:** "Truth is defined recursively across levels."
  *   **Deflationist:** "Truth is just disquotation, but disquotation is only valid across levels."

  The "metaphysical stuff" you mention is that Tarski remained neutral on whether truth was a real property, whereas Deflationists actively deny it is. But logically? Yes, they end up using the same hierarchy to block the Liar.

  ### 4. Alternative Deflationist Moves (For Your Engine)
  If you don't want to implement a full Tarskian hierarchy (which can be cumbersome in a toy engine), there are other ways deflationists handle the Liar:

  1.  **Truth Value Gaps (Kripke):**
      Some deflationists accept that the Liar sentence is neither true nor false. It is "undefined."
      *   *Engine implication:* You need a 3-valued logic (True, False, Undefined). The Disquotation Schema holds only for True and False sentences.
      *   *Pros:* Allows some self-reference.
      *   *Cons:* You lose classical logic (Law of Excluded Middle fails).

  2.  **Axiomatic Restriction (Horwich):**
      Paul Horwich suggests that the Disquotation Schema is an infinite set of axioms, but we simply **exclude** the instances that generate paradoxes.
      *   *Engine implication:* You allow the schema generally, but you hard-code an exception for self-referential truth predicates.
      *   *Pros:* Keeps classical logic.
      *   *Cons:* Feels ad-hoc (why *that* exception?).

  3.  **Revision Theory (Gupta & Belnap):**
      Truth is not a static value but a process of revision. $L$ oscillates forever.
      *   *Engine implication:* Your engine evaluates truth iteratively. $L$ never converges.
      *   *Pros:* Handles complex paradoxes well.
      *   *Cons:* Computationally expensive; truth is no longer a simple boolean.

  ### Recommendation for a Toy Logic Engine
  If you are building a **toy** engine, do not try to solve the Liar for natural language.

  1.  **Adopt the Tarskian Restriction:** Implement a strict separation between *terms* and *truth-claims*. A sentence cannot contain a truth predicate that refers to itself. Treat it as a syntax error during parsing.
  2.  **Why?** This aligns with the deflationary intuition that "is true" is a device for talking about *other* sentences, not a property inherent to the sentence itself.
  3.  **The Payoff:** This keeps your logic classical (boolean), your engine simple, and your philosophical position consistent.

  **Summary:** You are correct. Naive deflationism is inconsistent. To make it work, deflationists usually adopt Tarski's hierarchy. The difference is purely philosophical: Tarski saw it as a necessary restriction for definition; Deflationists see it as evidence that truth isn't a "thing" that sentences can possess in a self-referential loop. For your engine, treat the Liar as a syntax error.
