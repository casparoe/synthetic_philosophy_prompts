answer: |-
  The seminar room smelled of stale coffee and whiteboard marker. Nadia leaned on the back of a chair, watching Owen pack his bag.

  **Nadia:** Look, the Marianne case kills the standard account. She's in the basement, barometer and seismograph both reading normal. She deduces she isn't hallucinating the readouts. Our intuition is screaming that she knows this. But standard tracking says she doesn't, because if she were hallucinating, she'd still believe she wasn't. That's why we need evidence-anchoring. We evaluate the subjunctive condition holding her evidence fixed. In the nearest worlds where she has *this* evidence—instrument readings based on reliable wiring—the proposition holds. She knows.

  **Owen:** But what counts as "evidence" here? You're walking into a trap. If evidence is factive—say, *seeing* the needle move—then in any world where she has that evidence, she isn't hallucinating. The conditional becomes trivial. The modal condition does no work; you've just got evidentialism in a subjunctive hat. But if evidence isn't factive—if it's just *seemings*—then the hallucination world is still nearby. She has the same seemings there. So the condition fails, and you're back to denying she knows. Which is it?

  **Nadia:** It's not total seemings, it's the actual basis of the belief. Marianne isn't basing her belief on raw seemings; she's basing it on the instruments' reliability, which is part of her evidence set. In the nearest worlds where she has *that* specific evidence—reliable instruments functioning normally—she isn't hallucinating. The modal condition still does work because it checks the connection between that specific basis and the truth. It filters out worlds where the instruments are broken, even if the seemings are the same.

  **Owen:** That just pushes the question back. How do you individuate the basis without gerrymandering? Why is the basis "reliable instrument readings" rather than "visual seemings of needles"? If you pick the former, you get knowledge. If you pick the latter, you don't. Are you just selecting the evidence description that yields the result you want? If you include everything she knows, you get factivity and vacuity. If you include only what she's relying on, you need a non-circular story about why *that* slice of her mental life anchors the condition.

  **Nadia:** It's not arbitrary; it's psychological reality. She's actually reasoning from the instruments' design, not just the visuals. But I'll concede this: my view struggles with the global sceptical case. If Marianne wonders whether she's a brain in a vat, her evidence doesn't obviously rule that out, even anchored. So I can't promise closure across the board without further work on how evidence individuates in sceptical contexts. I'm saving the local closure, not the global.

  **Owen:** I'll concede that denying Marianne knowledge is too high a price to pay; the intuition is robust enough that we need to accommodate it. But what would move me is a principled account of evidence individuation. If you can explain why the basis is "instrument reliability" without simply asserting "the bit that makes her know," I'd drop the gerrymandering objection. Until then, I'm sticking with the purist view: closure fails, and that's a prediction we should accept.

  **Nadia:** Fair enough. If I can give you a cognitive psychology account of basis individuation that doesn't track truth intuitions, will you reconsider the closure cost?

  **Owen:** If it's independent of the knowledge intuitions, yes. But until then, I'm keeping the failure.

  **Nadia:** Then we're agreed on the data, just not the cost. I'll draft the psychology bit.

  **Owen:** And I'll keep the coffee hot.
