      *   **Evidential Decision Theory (EDT):** Focuses on evidence/news. You choose the act that gives you the best news about the outcome. In Newcomb's, EDT one-boxes (one-boxing is evidence the box is full). In PD, EDT cooperates (cooperating is evidence the other will cooperate).
      *   **Superrationality (Hofstadter):** Assumes identical reasoning agents. If I am rational and you are rational and we know this, we will run the same "algorithm." Therefore, my output correlates with yours. I should choose as if my choice determines both. This leads to cooperation in PD.
      *   **Timeless Decision Theory (TDT) / Functional Decision Theory (FDT):** Modern successors to this line of thinking. They treat the decision as an output of a logical function.

  3.  **Address the User's Core Confusion:**
      *   *User's Premise:* "In Newcomb's problem you one-box because you think your choice causally influences the prediction..."
