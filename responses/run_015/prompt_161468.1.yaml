      *   *Phase 1:* Group A trains on Deck A. Group B trains on Deck B. (Decks are slightly different distributions).
      *   *Phase 2:* They swap cards.
      *   *No, the prompt says "Split the room, train each half separately... hand out fresh cards."*
      *   *Okay, let's simplify the "Truth".* The "Truth" is whether the card fits the *rule*.
      *   *Activity:* "Classify these cards into 'Valid' and 'Invalid'."
      *   *Group A Rulebook:* Valid if Warm > Cool.
      *   *Group B Rulebook:* Valid if Alternating.
      *   *Deck:* 80% of cards satisfy *both*. 20% satisfy *one but not the other*.
      *   *This creates the "Anomaly" experience.*
      *   *Group A sees a card (R-B-R-B). Valid? Yes (Alternating). Wait, Warm=2, Cool=2. Invalid.* Anomaly!
      *   *Group B sees a card (R-R-R-R). Valid? Yes (Warm>Cool). Wait, Not Alternating. Invalid.* Anomaly!
      *   *This works.* It creates normal science (the 80%) and anomalies (the 20%).
      *   *Shared Term:* "Stability."
      *   *Group A:* Stability = Warm Dominance.
      *   *Group B:* Stability = Structural Alternation.
      *   *The Clash:* When they pair up, they have to agree on the "Stability" of a card. One says Stable, one says Unstable. They cannot agree because they are measuring different things but using the same word.

  4.  **Refining the Rules for the Prompt:**
      *   **Materials:** 40 Index Cards. 4 Bands per card. Colors: Red, Blue, Green, Yellow. Markers.
      *   **Rulebook A (Substance):** "Stability" is determined by Color Temperature. Warm (R/Y) counts as +1. Cool (B/G) counts as -1. Score > 0 = Stable.
          *   *Anomaly Clause:* If Score = 0, check Top Band. Warm = Stable.
      *   **Rulebook B (Structure):** "Stability" is determined by Adjacency. Same Color Adjacency = -1. Different Color Adjacency = +1. Score > 0 = Stable.
          *   *Anomaly Clause:* If Score = 0, check Bottom Band. Red = Stable.
      *   **Deck Construction:**
          *   20 Cards: Agree on Stable (e.g., R-R-R-Y).
          *   10 Cards: Agree on Unstable (e.g., B-B-G-G).
          *   10 Cards: **The Conflict Zone.** (e.g., R-B-R-B).
              *   A: Warm=2, Cool=2. Top=R (Warm). -> Stable.
              *   B: Adjacencies: R-B(+), B-R(+), R-B(+). Score +3. -> Stable.
              *   *Wait, I need them to Disagree.*
              *   *Card:* R-R-B-B.
              *   *A:* Warm=2, Cool=2. Top=R. -> Stable.
              *   *B:* R-R(-), R-B(+), B-B(-). Score -1. -> Unstable.
              *   *Perfect.*
      *   **Scoring:** Points for matching the Rulebook's definition (not an external truth). This reinforces that "Truth" is internal to the paradigm.
      *   **Wait, if Truth is internal, how do they score?**
      *   *Correction:* They score points for correctly applying their rule to the cards *provided in training*.
      *   *In the "Joint Prediction" phase:* They must agree on a label. If they can't, no points. This creates the friction.

