      *   *Let's lean into the "Shared Word" trap.*
      *   *Word:* "Dominant."
      *   *Group A:* Dominant = Most frequent color.
      *   *Group B:* Dominant = Topmost color.
      *   *Card:* Blue-Red-Red.
