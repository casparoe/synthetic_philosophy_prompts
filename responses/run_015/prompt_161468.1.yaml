      *   *Okay, let's stick to the Prompt's suggestion:* "Score points for correct predictions." This implies there is a right answer.
      *   *If there is a right answer, one paradigm is "True."* This undermines incommensurability.
      *   *Fix:* The "Right Answer" is determined by a hidden variable that *both* paradigms approximate but neither captures fully. OR, the "Right Answer" is simply consistency with their own rules (Normal Science).
      *   *Best approach for Kuhn:* The "Puzzle" is to sort the deck into two piles: "Natural" and "Unnatural."
      *   *Group A Rule:* Natural = Symmetrical colors (e.g., R-B-R).
      *   *Group B Rule:* Natural = Gradient colors (e.g., Light->Dark, or R->B->G).
      *   *Deck:* 30 cards fit both rules (mostly). 10 cards are the "Anomalies."
      *   *Actually, let's use the "Shared Term" strategy heavily.*
      *   *Term:* "Load."
      *   *Group A:* Load = Sum of band thicknesses (drawn on card).
      *   *Group B:* Load = Count of bands.
