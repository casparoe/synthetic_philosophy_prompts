      *   *Let's go back to Colors. It's cleaner.*
      *   *Term:* "Potential."
      *   *Group A:* Potential = Count of Warm Colors (R, Y).
      *   *Group B:* Potential = Count of Color Changes.
      *   *Task:* Predict if the card will "Discharge" (Yes/No).
      *   *Ground Truth:* I (Facilitator) decide based on a 3rd rule that is a mix, or I just validate based on internal consistency during the first phase.
      *   *Crucial Pivot:* To feel incommensurability, they shouldn't be trying to match *my* key, they should be trying to match *nature*.
