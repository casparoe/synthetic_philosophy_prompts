      *   Objection: "This is just ambiguous definitions. If we define terms precisely, we can translate."
      *   Response: Incommensurability isn't just lexical; it's about *salience*. Group A literally *sees* "Warmth" as the causal factor. Group B *sees* "Friction" (adjacency) as the causal factor. When they look at R-R-B-B, A sees a "Warm-topped balance." B sees a "High-friction cluster." They aren't just labeling differently; they are attending to different features as *relevant*. Translation fails because "Stability" refers to different *properties of the world*.

  6.  **Addressing the "World Change" Limitation:**
      *   Admission: The cards don't change. Kuhn claims the *world* changes (e.g., pendulum vs. constrained fall).
      *   Mitigation: In debrief, ask them how the card *felt*. Did the Conflict Zone cards feel "broken" or "different"? The world-change is phenomenological, not ontological in this game. I need to explicitly state I will supply this narrative.

  7.  **Predicting Failure Points:**
      *   *Leakage:* People peeking at other rulebooks.
      *   *Meta-gaming:* "I bet the other team has a different rule."
      *   *Translation:* They might solve the translation by saying "Okay, your 'Stability' is my 'Temperature'." I need to forbid defining the term, only using it.
      *   *Boredom:* 2 hours is long for card sorting. Need to keep pace tight.
      *   *Facilitator Bias:* Accidentally hinting at the solution.

  8.  **Timeline:**
      *   0:00-0:10: Setup & Split.
      *   0:10-0:40: Training (Normal Science).
      *   0:40-0:50: Anomaly Injection (Crisis).
      *   0:50-1:20: Cross-Paradigm Pairs (Revolution/Translation).
      *   1:20-2:00: Debrief.

  9.  **Final Polish:**
      *   Make sure the Rulebooks look official.
      *   Ensure the "Shared Word" is prominent.
      *   Ensure the Anomaly cards are frequent enough in phase 2 to cause trouble.
      *   Prepare the "Answer Key" for the facilitator (which is just the Rulebook logic).

  10. **Review against constraints:**
      *   No "Kuhn/Paradigm" until debrief? Yes.
      *   Feel incommensurability? Yes, via translation failure.
      *   Materials doable? Yes, index cards.
      *   Counter-argument ready? Yes.
      *   Limitations admitted? Yes.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Scoring:* If they score based on their own rules, they both get 100%. That's boring.
      *   *Better:* In Phase 1, I validate their predictions against *my* hidden key.
