      *   *Better:* The "Nature" of the card is the prediction. They classify cards into bins.
      *   *Bin Names:* "Type Alpha" and "Type Beta."
      *   *Group A Rule:* Alpha if >50% Red. Beta otherwise.
      *   *Group B Rule:* Alpha if Top Band is Red. Beta otherwise.
