answer: |-
  The two principles at play are **The Principle of Costly Signaling** (Diane's rule) and **The Principle of Distributed Verification** (your rule).

  ### 1. The Two Principles

  **Principle A: Costly Signaling (Diane's Rule)**
  *   **The Rule:** Trust the crowd only when they incur a tangible cost (money, time, physical risk) to convey their preference. Distrust them when they are merely expressing an opinion or belief without skin in the game.
  *   **Why it fits the five verdicts:**
      *   *Restaurant:* Diners pay and wait (Costly). **Smart.**
      *   *Bank Run:* Withdrawers move assets and stand in line (Costly Action). **Smart.**
      *   *Evacuation:* Neighbors uproot their lives (High Cost). **Smart.**
      *   *Party Stock:* The stranger is just talking (Zero Cost). **Not Smart.**
      *   *Housing 2006:* "Everyone saying" is narrative/belief (Zero Cost). **Not Smart.**
  *   **Verdict on Book Case:** Star ratings are opinions, not actions. The reviewers didn't necessarily pay or risk anything to give five stars. It is "talk," like the party stock. **Dumb.**

  **Principle B: Distributed Verification (Your Rule)**
  *   **The Rule:** Trust the crowd when multiple independent agents have verified a reality you cannot see. Distrust them when the signal comes from a single source or a monolithic narrative.
  *   **Why it fits the five verdicts:**
      *   *Restaurant:* Many independent tasters verify quality. **Smart.**
      *   *Bank Run:* Many independent observers verify liquidity risk. **Smart.**
      *   *Evacuation:* Many neighbors verify immediate danger. **Smart.**
      *   *Party Stock:* One loud person (Single Source). **Not Smart.**
      *   *Housing 2006:* "Prices only go up" is a single societal narrative (Monolithic). **Not Smart.**
  *   **Verdict on Book Case:** Five reviewers represent five independent verifications of quality (tacit knowledge). **Smart.**

  ### 2. Which One Is Diane Running?

  Diane is running **The Principle of Costly Signaling**.

  This is evident because she validates the **Bank Run** as smart. In a bank run, the crowd might be *wrong* about the bank's actual solvency, but their *action* (withdrawing) makes the insolvency true. She values the behavioral commitment over the epistemic truth. Conversely, she rejects the Housing Bubble because it was driven by "talk" and belief, not immediate costly action.

  In the book case, she sees star ratings as "cheap talk" (like the party stock tip) rather than "costly action" (like eating the food). She doesn't care that the reviewers read the book; she cares that they didn't *risk* anything on their judgment.

  ### 3. The Sixth Case to Force a Commit

  To force Diane to commit to her principle, you need a scenario where **Costly Signaling** and **Distributed Verification** point in opposite directions. The Book Case is slightly ambiguous (did the reviewers risk their credibility?), so you need a clearer test.

  **The Sixth Case: The Standing Ovation**
  > *Your protagonist is at a theater play. At the end, five strangers in the audience stand up and clap enthusiastically. The protagonist stands up and claps too, assuming the play must be good.*

  *   **Distributed Verification (You):** Five independent people signaled quality. **Smart.**
  *   **Costly Signaling (Diane):** Clapping is low-cost social signaling, indistinguishable from "talk." It requires no wallet, no time, and no risk. **Not Smart.**

  If Diane calls this **Dumb**, she confirms she is strictly running Costly Signaling (Action > Opinion). If she calls it **Smart**, she has to admit that low-cost actions can count as signals, which undermines her rejection of the book reviews.
