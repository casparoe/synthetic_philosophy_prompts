      *   **Part 1: The Broken Step.** Identify Step (4) as the primary suspect (Value Pluralism/Incomparability) and Step (2) as the secondary suspect (Deontology vs. Consequentialism). Explain *why* (4) fails (Parity $\neq$ Equality).
      *   **Part 2: Cost Analysis.**
