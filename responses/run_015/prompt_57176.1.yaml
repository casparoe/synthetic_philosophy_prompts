answer: |-
  This is a high-risk, high-reward seminar design. It works because it gamifies the *constraint* rather than the *content*. Students stop asking "Is this fair?" and start asking "Is this compossible?" which is exactly where you want them.

  Below is the complete kit: mechanics, card set, run-of-show, and the philosophical safety net.

  # PART 1: THE GAME ("THEODICY ENGINE")

  **Group Size:** 5 Groups of 4 students (20 students). You float between groups. The remaining 2 students act as "Auditors" (they verify scores and check conflict violations), rotating every 15 minutes.
  **Materials:** Printed cards (cut beforehand), Score Sheets (one per group), Pens.
  **Goal:** Construct a "World" (a hand of cards) that maximizes **Harmony Score** while adhering to **Compossibility Rules**.

  ### The Mechanics
  1.  **Cards:** Represent "Laws of Nature" or "Substantial Forms."
  2.  **Compossibility:** Each card has a **Symbol** (▲, ■, ●). Cards with conflicting symbols (listed on the card) cannot exist in the same World.
  3.  **Evils:** Some cards have the **Skull Icon**. This represents Metaphysical, Physical, or Moral Evil. You cannot remove the Skull without discarding the card.
  4.  **Scoring (The Leibniz Calculus):**
      *   **Richness:** Sum of all "Effect Points" on your cards.
      *   **Simplicity:** Subtract 1 point for every card in your World.
      *   **Formula:** `Total Score = (Sum of Effect Points) - (Number of Cards)`
      *   **Minimum Viability:** A World must have at least 5 cards to exist.
  5.  **The Rig:** High-point Effect cards *always* carry Skulls or require cards that carry Skulls. A world with zero Skulls will mathematically lose to a world with Skulls.

  ### The Card Set (40 Cards)
  *Print these on cardstock. Symbols indicate conflict groups.*

  **Group A: Physics & Matter (Symbol: ▲)**
  1.  **Universal Gravitation.** Effect: +4 (Orbits, Tides). Conflict: None. Cost: **Skull** (Collisions/Crushing).
  2.  **Conservation of Energy.** Effect: +3 (Stability). Conflict: None. Cost: **Skull** (Entropy/Heat Death).
  3.  **Finite Light Speed.** Effect: +2 (Causality). Conflict: None. Cost: **Skull** (Delay/Ignorance of distant events).
  4.  **Atomic Indestructibility.** Effect: +3 (Permanence). Conflict: ■ (Biological Decay). Cost: None.
  5.  **Tectonic Activity.** Effect: +4 (Mineral Richness). Conflict: None. Cost: **Skull** (Earthquakes/Volcanoes).
  6.  **Fluid Dynamics.** Effect: +2 (Weather). Conflict: None. Cost: **Skull** (Floods/Droughts).
  7.  **Quantum Uncertainty.** Effect: +5 (Novelty/Chance). Conflict: ● (Strict Determinism). Cost: **Skull** (Unpredictability).
  8.  **Vacuum Existence.** Effect: +1 (Space). Conflict: None. Cost: **Skull** (Cold/Emptiness).

  **Group B: Biology & Life (Symbol: ■)**
  9.  **Cellular Reproduction.** Effect: +4 (Growth). Conflict: None. Cost: **Skull** (Cancer/Overpopulation).
  10. **Nervous System.** Effect: +5 (Sensation/Learning). Conflict: None. Cost: **Skull** (Pain/Suffering).
  11. **Predatory Digestion.** Effect: +4 (Energy Transfer). Conflict: None. Cost: **Skull** (Death by Consumption).
  12. **Sexual Selection.** Effect: +3 (Variety). Conflict: None. Cost: **Skull** (Violence/Rejection).
  13. **Metabolic Decay.** Effect: +2 (Recycling). Conflict: ▲ (Atomic Indestructibility). Cost: **Skull** (Aging).
  14. **Immune Response.** Effect: +3 (Survival). Conflict: None. Cost: **Skull** (Autoimmune Disease/Fever).
  15. **Sleep Cycle.** Effect: +2 (Rest). Conflict: None. Cost: **Skull** (Vulnerability/Wasted Time).
  16. **Scarcity of Resources.** Effect: +3 (Competition drives innovation). Conflict: None. Cost: **Skull** (Starvation).

  **Group C: Mind & Society (Symbol: ●)**
  17. **Free Will.** Effect: +6 (Moral Agency). Conflict: ▲ (Strict Determinism). Cost: **Skull** (Sin/Crime).
  18. **Ambition.** Effect: +4 (Progress). Conflict: None. Cost: **Skull** (War/Greed).
  19. **Empathy.** Effect: +3 (Cooperation). Conflict: None. Cost: **Skull** (Grief/Sympathetic Pain).
  20. **Memory.** Effect: +3 (Identity). Conflict: None. Cost: **Skull** (Trauma/Regret).
  21. **Ignorance.** Effect: +2 (Mystery/Faith). Conflict: ▲ (Finite Light Speed - *Wait, these are compatible, change conflict:* Conflict: None). Cost: **Skull** (Error/Mistake).
  22. **Hierarchy.** Effect: +3 (Order). Conflict: None. Cost: **Skull** (Oppression).
  23. **Language.** Effect: +4 (Communication). Conflict: None. Cost: **Skull** (Deception/Lies).
  24. **Desire.** Effect: +5 (Motivation). Conflict: None. Cost: **Skull** (Dissatisfaction).

  **Group D: "Patches" (High Cost, Seemingly Good)**
  *These cards look like they fix evils but add Complexity (lowering score) or create new conflicts.*
  25. **Divine Intervention.** Effect: +2 (Miracles). Conflict: ▲ (Universal Laws). Cost: **Skull** (Arbitrariness/Unfairness). Complexity: Counts as 2 Cards.
  26. **Afterlife Compensation.** Effect: +5 (Justice). Conflict: None. Cost: **Skull** (Requires Death first). Complexity: Counts as 2 Cards.
  27. **Blissful Ignorance.** Effect: +1 (Peace). Conflict: ● (Memory). Cost: **Skull** (Stagnation).
  28. **Universal Benevolence.** Effect: +3 (Kindness). Conflict: ● (Free Will). Cost: **Skull** (Loss of Autonomy).
  29. **Pain Suppression.** Effect: +1 (Comfort). Conflict: ■ (Nervous System). Cost: **Skull** (Self-Destruction/Injury).
  30. **Resource Abundance.** Effect: +2 (No Hunger). Conflict: ■ (Scarcity). Cost: **Skull** (No Motivation/Entropy). Complexity: Counts as 2 Cards.

  **Group E: "Foundations" (Low Score, Required for Stability)**
  31. **Time (Linear).** Effect: +1. Conflict: None. Cost: **Skull** (Loss).
  32. **Space (Extended).** Effect: +1. Conflict: None. Cost: **Skull** (Separation).
  33. **Number (Discrete).** Effect: +1. Conflict: None. Cost: None.
  34. **Identity (A=A).** Effect: +1. Conflict: None. Cost: None.
  35. **Causality.** Effect: +2. Conflict: ▲ (Quantum Uncertainty). Cost: **Skull** (Determinism).
  36. **Limitation.** Effect: +0. Conflict: None. Cost: **Skull** (Finitude). *Required Card.*
  37. **Contingency.** Effect: +1. Conflict: None. Cost: **Skull** (Could have been otherwise).
  38. **Relation.** Effect: +1. Conflict: None. Cost: None.
  39. **Perception.** Effect: +2. Conflict: None. Cost: **Skull** (Illusion).
  40. **Appetite.** Effect: +1. Conflict: None. Cost: **Skull** (Need).

  ### Conflict Key (Print on Score Sheet)
  *   **▲ vs ▲:** Card 4 conflicts with Card 13. Card 7 conflicts with Card 35.
  *   **■ vs ■:** Card 29 conflicts with Card 10. Card 30 conflicts with Card 16.
  *   **● vs ●:** Card 17 conflicts with Card 28. Card 27 conflicts with Card 20.
  *   **Cross-Group:** Card 25 conflicts with Card 1.

  ### Score Sheet
  *   **World Name:** _______________
  *   **Cards Played:** [ ] [ ] [ ] [ ] [ ] [ ] [ ] [ ] (Min 5)
  *   **Total Effect Points:** ______
  *   **Minus Card Count:** ______
  *   **Total Skulls (Evils):** ______ (Track this, do not subtract)
  *   **Final Score:** ______
  *   **Auditor Signature:** _______________

  ---

  # PART 2: RUN OF SHOW (100 Minutes)

  **00:00 – 00:10: The Hook & The Trap**
  *   **Lecture:** Briefly define Leibniz's three types of evil (Metaphysical, Physical, Moral). Define Compossibility (A and B cannot exist together logically).
  *   **The Pitch:** "You are not designing a Utopia. Utopias are logically incoherent. You are engineering a *compossible* world. Your goal is to maximize Richness while minimizing Laws. If your world has no evils, it will lose. If your world is contradictory, it is disqualified."
  *   **Assign Roles:** 5 Groups of 4. 2 Auditors (give them a master conflict key).

  **00:10 – 00:20: Setup & Deal**
  *   Deal 7 cards to each group. Place remaining deck in center.
  *   **Rule:** You must end with at least 5 cards. You may trade with the deck or other groups *only* during the Trading Phase.
  *   **Constraint:** Auditors check for conflicts. If a conflict is found, you must discard one of the conflicting cards immediately.

  **00:20 – 00:50: The Build Phase (30 Mins)**
  *   **Goal:** Maximize `(Effects - Cards)`.
  *   **TA Role:** Circulate. When a group says "This is cruel," interrupt: "Is it compossible? Does it lower the score?" Force them into the calculus.
  *   **Mid-Game Twist (Minute 35):** Announce: "The Lisbon Event." Every group must add one **Physical Evil** card (Skull) from the discard pile or deck, or lose 5 points. This simulates the brute facticity of suffering that must be accounted for.
  *   **Observation:** Watch groups try to "fix" evils with Patch cards (Group D). Notice how Patch cards increase Complexity (count as 2 cards) and often create new conflicts. They will realize the "Fix" is often worse than the "Bug."

  **00:50 – 01:00: Scoring & Verification**
  *   Auditors rotate to a new group. Verify conflicts. Calculate scores.
  *   **The Reveal:** Write the Top 3 Scores on the board. Note the number of Skulls in the winning world. (It should be high).

  **01:00 – 01:15: The Theodicy Defense**
  *   Pick the Winning Group. They must stand and justify *one* specific Evil in their world (e.g., Predation) not as "good," but as *necessary* for the Score (Richness) they achieved.
  *   Pick the Lowest Scoring Group (likely the "Nice" world). Ask why their score tanked. (Answer: Low Richness, High Complexity from trying to patch evils).

  **01:15 – 01:40: The Debrief (25 Mins)**
  *   *See Part 3 for script.*

  ---

  # PART 3: THE DEBRIEF SCRIPT (Mapping Game to Doctrine)

  **1. Compossibility (The Conflict Symbols)**
  *   **Ask:** "Who tried to pair Free Will (17) with Universal Benevolence (28) or Pain Suppression (29) with Nervous System (10)?"
  *   **Point:** This is **Compossibility**. Leibniz isn't saying God *likes* pain. He's saying a creature with a nervous system *logically entails* the capacity for pain. You cannot have the definition of the substance without its properties. To remove the evil is to remove the substance.
  *   **Text:** *Discourse on Metaphysics*, §6.

  **2. Metaphysical Evil (Card 36: Limitation)**
  *   **Ask:** "Did anyone try to play a world with no Limitations?"
  *   **Point:** If you did, you couldn't play any cards. Creatures are by definition limited (finite). Metaphysical evil is just finitude. If you remove finitude, you don't have creatures; you have God. A world with no metaphysical evil is a world with only one substance.
  *   **Text:** *Theodicy*, §20.

  **3. Willing vs. Permitting (The Scoring Formula)**
  *   **Ask:** "Did you *want* to play the Earthquake card (5)? Or did you play it because it unlocked the Mineral Richness points?"
  *   **Point:** God does not *will* the earthquake. He wills the laws of physics (Tectonics) which produce richness. He *permits* the earthquake as a necessary consequence. The game forced you to permit evils to maximize the score.
  *   **Text:** *Theodicy*, §167 (Antecedent vs. Consequent Will).

  **4. Simplicity vs. Richness (The Formula)**
  *   **Ask:** "Why didn't you just play 20 cards to get more points?"
  *   **Point:** Because of the Simplicity penalty. Leibniz argues God chooses the simplest laws that yield the richest phenomena. A world where God intervenes every time someone trips (Divine Intervention Card 25) is too complex. It lowers the score.
  *   **Text:** *Discourse on Metaphysics*, §5-6.

  **5. The Voltaire Objection (The Finite Deck)**
  *   **Ask:** "Is this *actually* the best world, or just the best world *in this box*?"
  *   **Point:** Here is where the simulation breaks. You had 40 cards. Leibniz's God has infinite ideas. Voltaire's critique (*Candide*) is that maybe there is no maximum. Maybe for every world, there is a better one (an asymptotic series). If the series of possible worlds is infinite, there is no 'Best'. Leibniz assumes there *is* a maximum. The game assumes a maximum because the deck ends.
  *   **Takeaway:** Leibniz's optimism rests on the claim that the set of possible worlds is finite or has a calculable maximum. If Voltaire is right and the series is endless, the calculus collapses.

  ---

  # PART 4: LIMITATIONS & TROUBLESHOOTING

  ### What The Game Cannot Reproduce (Be Honest Here)
  1.  **Omniscience:** In the game, you don't know the full consequence of a card until you play it. Leibniz's God knows every consequence of every substance eternally. This is why God can be sure the evil is *necessary*. You are guessing; He is calculating.
  2.  **Infinity:** As mentioned in the debrief, the finite deck forces a maximum. You must supply the philosophical heavy lifting that an infinite series might not have a maximum.
  3.  **Moral Agency:** The game treats "Sin" (Card 17 Cost) as just another point cost. In Leibniz, Moral Evil is the only evil God does not will even consequently. He permits it because of Free Will. The game flattens Moral and Physical evil into "Skulls." You must distinguish them in the debrief.

  ### Predictable Breaks & Fixes
  1.  **Scorekeeping Drift:** Students will forget to subtract the card count.
      *   *Fix:* The Auditors have the master score sheet. They do not sign off until the math is visible.
  2.  **Illegal Trading:** Groups will trade conflicting cards secretly to bypass the conflict rule.
      *   *Fix:* Announce that Auditors will do a "Compossibility Sweep" at minute 45. Any illegal pair found results in a 10-point penalty. Make the penalty higher than the gain.
  3.  **The "Politics" Leak:** A student says, "Well, if we just redistributed the resources..."
      *   *Fix:* Interrupt immediately. "That is a Policy Card. We do not have Policy Cards. We have Law Cards. Can you justify that with the deck provided?" Remind them they are building *physics/metaphysics*, not *government*.
  4.  **The "Zero Evil" Rebellion:** A group tries to make a world with no Skulls to prove a point, accepting they will lose.
      *   *Fix:* Allow it. In the debrief, use them as the control group. "Look at Group 3. They have 0 Skulls. They also have a Score of -2. Is their world *possible*? Yes. Is it *choosable*? No." This validates Leibniz: God *could* make a sinless world (of automatons), but He chooses the best *compossible* world.

  ### Printing Instructions
  *   **Cards:** 40 unique designs. Print 2 sets of the 40 cards (80 total) so groups aren't fighting over single copies. Cut into standard poker size if possible, or just rectangles.
  *   **Symbols:** Use simple geometric shapes (Triangle, Square, Circle) for conflicts. Use a Skull icon for Evils.
  *   **Score Sheets:** One per group + 2 for Auditors.

  ### TA Cheat Sheet (For Circulation)
  *   If they complain about **Pain**: "Is the Nervous System card compossible with Pain Suppression? Check the symbols."
  *   If they complain about **Death**: "Look at Card 11 (Predation). What happens to the Energy Transfer points if you remove it?"
  *   If they complain about **Sin**: "You played Free Will (17). Read the cost. You wanted the Effect Points; you must accept the Cost."
  *   If they ask **"Why can't we add a card that fixes this?"**: "That's Card 25 (Divine Intervention). It counts as 2 cards for complexity. Do the math."

  This design forces them to inhabit the position of the Architect who is bound by logic, not just morality. When they defend a "Skull" card to win the game, they have inadvertently performed a Theodicy.
