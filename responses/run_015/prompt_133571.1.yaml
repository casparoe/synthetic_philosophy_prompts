  We seek to bring a soul into the light,
  Where sorrow cuts and pleasure promises pain.
  We think the burden shared is always plain,
  To measure out the sorrow in our sight.
  We hold the scale with vision clear and bright,
  As wrong to cause a tear is to refrain.
  A symetric design the minds maintain,
