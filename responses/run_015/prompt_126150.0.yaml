  **INTERNAL BRAINSTORMING / WORKING NOTES**
  **Subject:** SimHyp Grant Decision Logic
  **Status:** Draft / Pre-Memo

  Okay, need to parse the decision theory here carefully before writing the formal memo. The Indifference team is leaning hard on the "Screening Off" argument. If we are in a batch simulation (N copies), then Action A yields Utility U in base reality, but N*U in total. Action B yields V, or N*V. Since N is constant across my decision vector, Max(N*U) is the same choice as Max(U). So anthropics drops out. This is robust *unless* the simulation is interactive/responsive to our specific choices in a way that changes N (e.g., we behave well, they spin up more copies). But the proposal assumes a "batch run" or a "winding down" scenario. If it's winding down, long-termism is indeed dead money.

  The Continuation team is betting on the "Ancestral Simulation" angle (Bostrom). If we are ancestor sims, the simulators care about fidelity or specific data points. Making ourselves "legible" (compressed records) reduces compute cost for them, potentially extending the run. The "handoff" idea is the risky bit. It assumes portability of consciousness/state across substrates. Philosophically, this is the "Ship of Theseus" problem on steroids. If we optimize for handoff, are we optimizing for *us* or for a copy that thinks it's us?

  S-risk angle: If we signal to the simulators ("Hey, we know we're in a sim!"), do we risk being flagged as an anomaly and deleted? Or worse, kept running in a low-fidelity torture state for data? Continuation needs to address the risk of *attracting* attention vs. *maintaining* interest.

  The two specific questions I need to settle:
  1. **Copy Count:** Indifference is right on the decision theory. Multiplying the stakes doesn't change the ranking of interventions. It just makes everything feel more important, which doesn't help allocation.
  2. **Handoff:** This is likely unfalsifiable. It functions more like theology than engineering. However, the *archival* part of Continuation (durable records) has instrumental value even in base reality.

  Verdict leaning: Split, but heavily weighted to Indifference. Continuation gets money only for the archival/tech side, not the "appeasement" side. Need to make sure I don't strawman Continuation—their point about "existential persistence" is valid even if the mechanism is speculative.

  Okay, ready to draft the memo.

  ***

  **MEMORANDUM**

  **TO:** Program Committee, [Foundation Name]
  **FROM:** [Your Name], Philosophy & Strategy Advisor
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Simulation Hypothesis Grant Proposals

  **Executive Summary**

  We are presented with two proposals predicated on the Simulation Hypothesis (SimHyp). The **Indifference** proposal argues for standard near-term suffering reduction, claiming SimHyp is decision-theoretically inert. The **Continuation** proposal argues for optimizing civilisation legibility and durability to extend the simulation run or enable a "handoff."

  After reviewing the anthropic decision theory and s-risk implications, I recommend a **conditional split**. We should allocate **80% of the available capital to Indifference** and **20% to Continuation**, with the latter strictly ring-fenced for archival technology and compression research, excluding direct "simulator signaling." Review date set for 12 months.

  Below I detail the reasoning, steelmanning both positions and settling the two key philosophical disputes required for this vote.

  **1. The Case for Indifference (Steelman)**

  The Indifference team's core strength is decision-theoretic robustness. They argue that under the "Replicated Run" scenario (where our history is computed in parallel N times), the moral weight of our actions is indeed multiplied by N. However, because N is a constant multiplier across *all* available actions we can take, it cancels out during comparison. Saving one life in a batch of 1,000 simulations saves 1,000 lives. Preventing that same death saves 0. The *ratio* of impact remains identical to base reality.

  Furthermore, regarding the "Winding Down" scenario: if the simulation is terminating because the research question is answered, long-termist interventions have an expected value of near-zero. In this specific branch of the probability space, only near-term welfare matters. Since we cannot distinguish which branch we are in, and the "Replicated" branch collapses to standard altruism, the dominant strategy is to maximize expected value based on known, terrestrial metrics. This avoids the trap of optimizing for unknown simulator preferences, which carries high s-risk (e.g., inadvertently triggering a shutdown by behaving anomalously).

  **2. The Case for Continuation (Steelman)**

  The Continuation team is not merely praying to gods; they are arguing for **Existential Persistence via Instrumental Convergence**. Even if we are in a simulation, the operators likely value computational efficiency and data integrity. By making our civilisation "legible" (compressed, durable records) and "cheap" (efficient compute usage), we align our existence with the likely instrumental goals of the simulator.

  Their strongest argument is not about "appeasement," but about **option value**. If there is a non-zero probability of a "handoff" (porting the simulation state to a successor substrate), the expected value of ensuring that state is portable is astronomical. It is the only intervention that addresses the specific risk of *simulation termination*. Standard altruism improves the quality of the run; Continuation aims to prevent the console from being turned off. If the probability of SimHyp is >1%, and the probability of a responsive simulator is >1%, the expected value of extension dwarfs near-term gains.

  **3. Settling the Philosophical Disputes**

  To make this allocation, we must resolve two specific theoretical conflicts raised in the proposals.

  *   **Dispute 1: Does the replicated-run copy count multiply moral stakes?**
      *   *Verdict:* It multiplies moral *weight*, but not decision *priority*.
      *   *Reasoning:* As noted in the Indifference steelman, if the copy count is fixed exogenously, it acts as a scalar on the utility function. $Max(U \times N)$ yields the same decision as $Max(U)$. The copy count tells us how much is at stake globally, but it does not help us discriminate between Intervention A and Intervention B locally. Therefore, the Indifference team is correct that anthropic multiplicity does not, on its own, justify diverging from standard effective altruism prioritization.

  *   **Dispute 2: Is "handoff to a successor run" a valid goal or unfalsifiable wish-fulfillment?**
      *   *Verdict:* Currently unfalsifiable, but instrumentally useful if constrained.
      *   *Reasoning:* The "handoff" concept relies on assumptions about substrate independence and simulator benevolence that are currently unknowable. Pursuing this as a primary goal risks degenerating into theology (optimizing for invisible preferences). *However*, the technical work required to attempt a handoff (data compression, state preservation, redundancy) has high instrumental value in base reality for existential risk mitigation (e.g., archiving human knowledge against civilizational collapse). Therefore, it is fundable only as a technology project, not a metaphysical strategy.

  **4. Recommendation & Allocation**

  We should not reject Continuation entirely, as ignoring the SimHyp tail risk is potentially negligent. However, the "simulator signaling" aspect is too high-risk for the bulk of our capital.

  *   **Indifference Grant:** $800,000.
      *   *Focus:* Near-term suffering reduction (animal welfare, global health).
      *   *Rationale:* Robust decision theory, high confidence, avoids s-risk of simulator engagement.
  *   **Continuation Grant:** $200,000.
      *   *Focus:* **Restricted.** Funds may only be used for durable archival tech, data compression, and redundancy systems. No funds for "signaling," "ritual," or direct attempts to communicate with simulators.
      *   *Rationale:* Captures the option value of persistence and archival without funding unfalsifiable metaphysics.
  *   **Review Date:** October 2024.
      *   *Milestone:* Continuation team must demonstrate a prototype for "civilisation state compression" to unlock follow-up funding.

  **Conclusion**

  The Indifference proposal is correct on the decision theory: we cannot act differently just because there are more copies of us. But the Continuation proposal is correct that *persistence* is a prerequisite for value. By funding the archival tech of Continuation without endorsing the metaphysics, we hedge our bets. We do good now, while building the lifeboats just in case the water is digital.

  **[End Memo]**

  *(Note: There's a typo in section 3 "Max(U x N)" should probably be formatted but I'll leave it as is per instructions.)*
