answer: |-
  **Setting:** *A quiet corner of the faculty lounge at Princeton, late afternoon, 1977. Coffee cups stain the saucers. Norman Malcolm (66) sits with a straight back, hands folded. Daniel Dennett (35) leans forward, pen tapping against a notepad.*

  **Malcolm:** Daniel, I've been turning your paper over in my mind. You do a service in dismantling the naive picture—the idea that we simply *know* dreams are experiences in sleep. But I find myself troubled by the conclusion you draw from the Maury case. You suggest the "Cassette Theory": that the narrative is composed unconsciously and loaded into memory at the moment of waking.

  **Dennett:** It's a logical possibility, Norm. That's all I need it to be. If it's possible, then it's not a grammatical truth that dreams *must* occur during sleep.

  **Malcolm:** Precisely. But then you make a claim that strikes me as devastating to your own position, though you seem to treat it as a minor footnote. You concede that no dream report—neither immediate nor delayed—could distinguish the Cassette Theory from the Received View. The dreamer cannot tell the difference.

  **Dennett:** From the inside, no. The phenomenology is identical.

  **Malcolm:** Then listen to what you are saying. If there is no criterion available to the dreamer to distinguish "experiencing during sleep" from "recalling upon waking," then by what right do we posit the "during sleep" portion at all? You seem to think you are offering an empirical alternative to the Received View. But if the two are indistinguishable by any report, then the question of *when* the dream occurred is not an empirical question. It is a question without a method of verification. And that is exactly my point. You have quietly bought back the substance of my argument while merely relabeling the machinery.

  **Dennett:** I haven't bought it, Norm, because you're assuming the first-person report is the *only* court of appeal. That's the verificationist trap. Just because the dreamer can't tell the difference doesn't mean there isn't a fact of the matter.

  **Malcolm:** What fact? What are you pointing to?

  **Dennett:** Brain states. Suppose we have a complete neurophysiological theory. Suppose we can see a specific pattern of activation in the visual cortex corresponding to the guillotine blade. If that pattern occurs *during* REM sleep, then on the Received View, the dream happened then. If that pattern occurs only *after* the alarm sounds, during the waking transition, then the Cassette Theory holds. The dreamer can't tell, but the scientist can.

  **Malcolm:** Ah, but now you are shifting the meaning of "dream." You are defining "dream" as "a specific neural pattern." But that is not what the word means. When a man says, "I dreamed I was flying," he is not reporting on his occipital lobe. He is reporting an experience. And the criteria for ascribing that experience are bound to his waking avowal. If you detach the dream from the report, you aren't talking about dreaming anymore. You're talking about brain waves.

  **Dennett:** I'm talking about the *cause* of the report. Look, your argument rests heavily on the idea that "sound asleep" and "conscious experience" are logically exclusive. You say it's a contradiction in terms to say someone is conscious while sound asleep.

  **Malcolm:** It is a contradiction in ordinary usage. To be "sound asleep" is to be unaware of one's surroundings and unaware of oneself. If you are aware, you are not sound asleep. This isn't a discovery; it's the grammar of the concept.

  **Dennett:** But that grammar is folk psychology. It's a theory our ancestors developed to navigate social life. It's not sacred. If neuroscience shows that the brain is processing complex narratives during sleep—processing that has the same functional architecture as waking perception—why should your dictionary veto it? You're stipulating the answer. You're saying, "By definition, consciousness requires the ability to report it *at the time*." But why?

  **Malcolm:** Because "consciousness" implies a subject to whom something is present. If the subject is asleep, the subject is not there. To say the subject is there, but cannot know it, cannot judge it, and cannot verify it until later, is to use the word "consciousness" in a way that severs its connection to the only evidence we have for it. You want to say the brain is conscious. I say the brain is active. The *person* is asleep.

  **Dennett:** The person *is* the brain, Norm, or at least the person is what the brain does. If the brain is running a simulation of the French Revolution, who is doing the simulating?

  **Malcolm:** No one. That is my point. A machine can process information without consciousness. A tape recorder can store a narrative without hearing it. You are free to say the brain processes the guillotine narrative during sleep. But do not call it "dreaming" in the sense of "having an experience." Call it "dream-simulation." When the man wakes and says, "I dreamed," he is expressing a memory impression. He is not describing a prior event that happened in the dark.

  **Dennett:** But consider the Cassette Theory again. I use it not to prove dreams *are* cassettes, but to show that the Received View is contingent. If it's contingent, it's empirical. If it's empirical, it's not a grammatical confusion. You want to lock the concept of dreaming into the waking report. I'm saying the waking report is data about a process that might have started hours earlier.

  **Malcolm:** And I return to your concession. You admit the dreamer cannot distinguish the Cassette Theory from the Received View. If the distinction makes no difference to the criteria for asserting "I dreamed," then the distinction is not a distinction in the *dream*. It is a distinction in your theory of the brain. You are trying to have it both ways. You want to treat "dreaming during sleep" as an empirical hypothesis to defeat my grammatical argument, but then you admit it is an hypothesis that can never be confirmed by the criteria that govern the use of the word "dream."

  **Dennett:** It can be confirmed by third-person criteria! That's the offensive move, Norm. You insist that the only valid criteria are first-person avowals or behavioral reports made *after* the fact. I'm saying physiological criteria are relevant to the ascription of mental states. If we find the neural correlate of "seeing the blade" during sleep, we are justified in saying "he was seeing the blade," even if he couldn't say so then.

  **Malcolm:** Justified by whom? By scientists redefining terms? You are changing the subject. We are discussing whether it makes sense to say a man *experiences* something while he is, by definition, incapable of experiencing anything. If you redefine "experience" to mean "neural processing," you win the argument by fiat. But you haven't addressed the logical exclusion. "Sound asleep" means the capacity for experience is suspended.

  **Dennett:** Does it? Or does it just mean the capacity for *interaction* is suspended? There's a difference. A computer in sleep mode is still processing backups. Is the computer "unaware"? In a sense. But if you're a materialist, awareness is just a certain kind of processing. If that processing happens in sleep, why is the light off?

  **Malcolm:** Because the concept of "awareness" is tied to the possibility of acknowledgment. If I cannot, even in principle, acknowledge the pain while I am having it, in what sense am I having it? You are postulating a "ghostly" experience that leaves no trace until it is manufactured upon waking. That is not an empirical discovery. That is a myth.

  **Dennett:** And you are postulating a "ghostly" authority of ordinary language that overrides scientific discovery. You're treating our current linguistic habits as if they reveal the metaphysical structure of the mind. They don't. They reveal our history. If we discover that the brain constructs the Maury narrative during sleep, we will change the language. We'll say, "I was conscious of the blade at 3:00 AM, though I couldn't report it until 7:00."

  **Malcolm:** And I say that sentence will not describe a discovery. It will describe a new way of speaking that abandons the concept of "sleep" as we understand it. You can change the language, Daniel. But you cannot claim you have discovered that people are conscious while asleep. You will have decided to call a certain brain state "consciousness."

  **Dennett:** So we are at the bedrock. You think the dispute is about the grammar of "dream" and "sleep." I think the dispute is about the authority of that grammar over empirical inquiry.

  **Malcolm:** Not just authority. Clarity. If you remove the criteria for verification, you remove the sense of the proposition. "He dreamed during sleep" becomes a sentence that looks empirical but functions like a myth.

  **Dennett:** And I think "He dreamed during sleep" is a hypothesis that looks grammatical but functions like a theory. We both agree the naive view—that we just *know* we dream in sleep—is wrong.

  **Malcolm:** Yes. We agree that the waking report is the only criterion we currently possess for the *ascription* of a dream.

  **Dennett:** But we disagree on whether that criterion exhausts the *reality* of the dream. You say: No criterion, no fact. I say: Criterion is limited, fact is open.

  **Malcolm:** Then let us record that. The dispute is not whether people wake up with dream memories. They do. The dispute is whether the phrase "experiencing during sleep" denotes a fact that transcends the criteria for its assertion.

  **Dennett:** Agreed. I hold it denotes a fact discoverable by third-person science. You hold it denotes a confusion generated by extending first-person grammar beyond its logical limits.

  **Malcolm:** Precisely. You are waiting for science to tell us what "consciousness" is. I am saying science cannot tell us that until we decide what we mean by the word, and currently, the meaning excludes the state of sleep.

  **Dennett:** And I'm saying the meaning *shouldn't* exclude it if the functional architecture is present. But I see now you won't grant that "function" can replace "avowal" as the criterion.

  **Malcolm:** I cannot grant it without destroying the concept of the person. If a person can be conscious without the possibility of awareness, the word "conscious" loses its anchor.

  **Dennett:** Then we know where the line is drawn. It's not about the Maury case. It's about whether philosophy polices science's definitions, or science revises philosophy's definitions.

  **Malcolm:** *(Nods slowly)* It is about whether we are analyzing concepts or investigating nature.

  **Dennett:** And we both think the other is doing the wrong job for this problem.

  **Malcolm:** It appears so. But at least we are not arguing about whether dreams exist.

  **Dennett:** *(Smiles)* No. We're arguing about when the lights are on. And whether it matters if no one is home to see them.

  **Malcolm:** Then I believe we have clarified the disagreement.

  **Dennett:** We have. Shall we get more coffee?

  **Malcolm:** Yes. I am awake, after all. I can verify that.

  **Dennett:** *(Laughing)* And I can report it. That's all the criterion we need for now.
