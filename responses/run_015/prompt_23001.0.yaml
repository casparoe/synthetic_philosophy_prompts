      *Self-Correction on Causal:* It's theoretically the most definitive (if you know the cause, you know if it's bias), but practically useless. The prompt asks for "useful for actually making that distinction". Practical utility wins. So Causal is last.
      *Self-Correction on Deliberation:* Some research suggests CoT helps reduce bias. But often it amplifies it. It's unstable. Coherence is more measurable.
      *Refining Reasons:* Ensure they are strictly one line (no line breaks).

      *Breakdown Sentence:* Needs to be clear. "The distinction breaks down because LLMs simulate values without possessing agency or stakes, rendering all outputs equally artificial."

