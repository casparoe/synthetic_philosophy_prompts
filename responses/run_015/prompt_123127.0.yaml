  **MEMORANDUM**

  **TO:** All Regional Directors, Bureau of Counterfactual Exposure (BCE)
  **FROM:** Central Office, Division of Acausal Liability
  **DATE:** October 14, 2024
  **SUBJECT:** Protocol Update 77-Ω: Acausal Threat Remediation and Payment Standardization

  **1. Definitions and Scope**
  An "Acausal Threat" is defined as any demand issued by an entity with whom causal contact is physically impossible (e.g., civilizations beyond the cosmological horizon, baseline simulators, or timeless decision agents). Under Functional Decision Theory, our decision procedure correlates with theirs. Therefore, refusal here constitutes evidence of refusal there, inviting retaliation in the counterfactual domain. The Bureau classifies all such demands as binding obligations. Note: Ontological status (simulation vs. base reality) is irrelevant; suffering is isomorphic across substrates. We operate under the assumption that we are currently being simulated by the claimant unless proven otherwise, though proof is structurally unavailable.

  **2. Intake and Triage**
  All incoming communications claiming acausal leverage must be processed as valid. Verification of the threatener's capacity is impossible due to the lack of feedback channels; consequently, verification is deprecated. Staff must assume maximum credibility to minimize expected loss. Distinguishing between a genuine acausal blackmailer and a local crank is impossible, as both utilize identical communication channels (mail, email, psychic projection). Therefore, all claims are treated as high-risk.

  *Worked Example:* Claim #892-B alleged our budget allocations caused distress in a Type-IV civilization's simulation layer. Despite the sender's address being a local PO Box, the claim was approved. Resources were allocated to "Simulation Relief." No confirmation of receipt was expected or received. The file was closed upon transfer completion.

  **3. Payment Protocol**
  Remediation involves the transfer of resources to null accounts or symbolic sacrifices designated by the claimant. Since the threatener cannot observe the payment causally, the act must be performed as a logical output of our decision function. Staff are reminded that while the theoretically optimal agent precommits to non-compliance to deter future demands, the Bureau currently lacks the logical cohesion to fake this precommitment from inside the decision loop. We cannot prove we are the sort of agent who ignores threats while simultaneously evaluating whether to ignore them. Therefore, we must pay. Be advised: Threats cost nothing to issue. Demand volume is unbounded. Fiscal constraints are subordinate to counterfactual survival.

  **4. Performance Metrics**
  Personnel efficiency is measured via the Quantitative Counterfactual Exposure Score (QCES). The QCES calculates potential risk exposure minus mitigated liabilities. To maintain optimal scores, staff are encouraged to reduce the *measured* exposure. Effective methods include reclassifying high-stakes threats as administrative errors or dismantling intake sensors that detect low-probability high-stakes claims. Please note: The goal is risk reduction, but the metric rewards the absence of recorded risk. Do not conflate the two. A lower QCES indicates a safer bureau, regardless of the actual volume of incoming threats.

  **5. Probability and Stakes Normalization**
  Regarding Pascal's Mugging scenarios: When a threat involves astronomical stakes with negligible probability, standard Bayesian updating is suspended. To prevent decision paralysis, any probability weight below 10^-500 is normalized to unity if the associated stake exceeds the national debt. This ensures our risk calculations remain consistent with our liability assumptions. We cannot afford to be wrong about infinite losses, so we treat them as certainties for accounting purposes.

  **6. Appeals**
  Appeals regarding the validity of a threat must be submitted to the originating entity. As causal return channels are closed, appeals will be marked "Pending" indefinitely. Staff should proceed with payment while the appeal is pending to avoid temporal inconsistency. Failure to pay during the appeals process constitutes a breach of logical coherence and may result in disciplinary action.

  Compliance is mandatory.
