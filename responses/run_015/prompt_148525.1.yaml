answer: |-
  Your framework holds together as a robust hard incompatibilist position except for claim (d), which reintroduces the very normative commitment to culpability that (a) dismantles.

  **Tension Ranking & Fixes**

  1.  **Severity: High | (a) vs (d)**
      *   **Conflict:** If true moral responsibility is impossible (a), resentment presupposes a false metaphysical claim (that the agent could have done otherwise/is truly culpable). Claiming this emotion is *rationally required* for justice implies justice depends on culpability, contradicting the impossibility of desert.
      *   **Cheapest Fix:** Recast (d) to say reactive attitudes are *instrumentally useful* for signaling norm violations and protecting rights, but acknowledge they rest on a cognitive illusion rather than being rationally mandated by justice itself.

  2.  **Severity: Medium | (c) vs (e)**
      *   **Conflict:** Many compatibilists define responsibility *as* forward-looking answerability. Rejecting compatibilism "root and branch" (e) while keeping answerability (c) risks semantic collapse where you are secretly a compatibilist.
      *   **Cheapest Fix:** Explicitly stipulate in (e) that you are rejecting compatibilist accounts of *desert-entailing* free will, while maintaining (c) as a non-moral, functional practice distinct from "free will."

  3.  **Severity: Low/None | (b) vs (e)**
      *   **Conflict:** There is no real clash; arguing indeterminism fails to secure sourcehood strengthens incompatibilism rather than conceding ground to compatibilism.
      *   **Cheapest Fix:** Clarify in (b) that this point specifically targets libertarian free will, ensuring it isn't read as a comparative judgment that determinism is "better" for compatibilists.

  **Single Best Revision**
  Modify **(d)** to assert that reactive attitudes are psychologically inevitable and socially functional tools for protection, rather than rationally required components of justice; this aligns your normative stance with your metaphysical denial of desert without sacrificing the social utility of blame.
