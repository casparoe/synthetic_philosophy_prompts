          *   *Weak Spot:* Dennett and Searle are usually enemies. Mixing them is risky.
      *   *Objection 4 (Hope No One Asks - Dennett Purist):* "Dennett defines cranes as reductionist tools. You're flipping his terminology. Isn't this just verbal stipulation?"
