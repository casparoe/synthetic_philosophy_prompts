  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a philosophy of mind reading group defense.
      *   **Thesis:** Dennett's crane/skyhook distinction argues *against* greedy reductionism in social cognition (specifically regarding collective intentionality like "we-intend"). Reducing collective intentionality to individual states + correlation protocol is circular (the protocol smuggles in the collective frame), making it a skyhook disguised as a crane.
      *   **Audience:**
          *   3 Hard Eliminativists (love parsimony, skeptical of group minds).
