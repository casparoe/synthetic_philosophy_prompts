      *   *Dennett's Cranes vs. Skyhooks:* Cranes are bottom-up mechanisms (evolution, physical processes). Skyhooks are top-down miraculous suspenders (intelligent design, unexplained explainers). Dennett usually uses this to attack dualism/creationism and support reductionism/evolution.
      *   *User's Twist:* Using Dennett to attack *greedy reductionism* in social cognition.
      *   *Core Argument:* Trying to reduce "we-intend" to "I-intend + protocol" fails because the "protocol" itself presupposes the "we" (the collective frame). Therefore, the reductionist explanation is secretly relying on the thing it's trying to reduce (circularity). It claims to be a crane (bottom-up) but is actually a skyhook (top-down assumption hidden).
