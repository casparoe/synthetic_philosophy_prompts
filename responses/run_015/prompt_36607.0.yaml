  5.  **Identifying the "Must Land" Reply:**
      *   If the historians turn off because they think you're moralizing, the talk dies. If the philosophers think the distinction is incoherent, the talk dies.
      *   *Decision:* The distinction between *explaining* (history) and *commemorating* (civic practice). If this collapses, the thesis collapses. Actually, the *most* critical is the "Token Dissenters" point. If Jefferson *couldn't* have freed slaves without economic ruin/violence, the "he could have known better" point is moot. The user needs to defend the *viability* of dissent, not just its existence.
      *   *Wait, re-reading the prompt:* The user says "I want to argue that (1) fails more often than people think... because 'his time' almost always contained its dissenters."
      *   *Critical Pivot:* The Historians will say "Existence of dissent $\neq$ Viability of action." The *one reply that has to land* is distinguishing between *moral knowledge* (which was available) and *structural cost* (which was high). The thesis rests on the epistemic claim, not the prudential one.
      *   *Actually, looking at the audience allergy:* The historians are allergic to moral evaluation. The *single reply that must land* is the concession that *historical explanation* is not *moral judgment*. If he loses them there, they stop listening.
      *   *Better Candidate:* The "Commemoration vs. Blame" distinction. This allows him to talk about morality without doing "bad history."
