answer: |-
  # Q&A Prep Sheet: Judging the Past & The "Man of His Time" Defence

  **Talk Context:** History/Philosophy Workshop
  **Core Thesis:** "Man of his time" is three moves (Epistemic Excuse, Explanatory Neutralism, Commemorative Indexing). Move 1 fails due to available dissent. Move 2 is valid history. Move 3 is the real normative battleground. Presentist blame is bad history; commemoration is the live issue.

  ---

  ### The 8 Objections (Ordered by Damage Potential)

  **1. The Historian's Category Mistake**
  *   **Who:** Senior Historian of Atlantic Slavery.
  *   **The Objection:** "You're distinguishing between explanation and evaluation, but in practice, your focus on 'dissenters available' is still a moral audit. You're mining the archive for exculpatory or inculpatory evidence rather than reconstructing the lifeworld. If the historian's job is to make the past intelligible, not to render a verdict, why does it matter if Jefferson *could* have known better? You're still treating historical actors as defendants in a trial, which distorts the archival work."
  *   **The Reply:** "I agree that *explanation* is the historian's primary job, and presentist blame is indeed bad history. But we aren't just writing for each other; these figures are in our civic space. My point isn't that historians should write verdicts, but that when the public uses history to justify commemoration, they rely on a specific historical claim: that *no other moral path was visible*. I'm arguing that claim is empirically false. We can make the past intelligible (your goal) while acknowledging that moral resources existed then (my point), without needing to render a verdict on the soul of the dead."
  *   **Soft Spot:** You are still implicitly asking historians to care about the *moral viability* of past actions, which might feel like a Trojan horse for moralizing.

  **2. The Structural Constraint / Tokenism Objection**
  *   **Who:** Historian of Empire / Materialist.
  *   **The Objection:** "You cite Quakers and Dominicans as proof dissent was possible. But existence isn't viability. For Jefferson, freeing enslaved people meant economic ruin and social exile; for Columbus, ignoring the crown meant prison. The 'man of his time' defence isn't about ignorance of moral arguments; it's about the crushing weight of structural incentives. Are you really arguing Jefferson is blameworthy because he wasn't willing to sacrifice everything? That's a saintliness test, not a moral baseline."
  *   **The Reply:** "I'm not arguing they needed to be saints. I'm arguing against the *epistemic* claim that they 'couldn't have known better.' We can concede the structural costs were high (moral luck) while maintaining that the *moral knowledge* was available. The 'man of his time' defence usually claims they didn't know it was wrong. I'm saying they did. Whether they were willing to pay the price is a separate question from whether the moral truth was accessible in their time."
  *   **Soft Spot:** If the cost of dissent is death or ruin, the "could have known better" point feels pedantic. The audience may conflate *knowing* with *acting*.

  **3. The Epistemic vs. Moral Distinction**
  *   **Who:** Moral Philosopher (Responsibility focus).
  *   **The Objection:** "You separate 'could have known better' (epistemic) from 'standards of commemoration' (normative). But if Jefferson knew slavery was wrong and did it anyway, he's not just epistemically culpable, he's morally blameworthy. If you grant that, why does your shift to 'commemoration' matter? If he's blameworthy, why shouldn't that track into how we view him? You're trying to have it both ways: he was morally wrong, but we shouldn't blame him?"
  *   **The Reply:** "Because blame is a reactive attitude directed at an agent capable of responding. Commemoration is a civic practice directed at a community. We can acknowledge Jefferson violated moral norms accessible to him (philosophical truth) without thinking our primary relationship to him is one of holding him responsible (which is futile). We judge the *statue*, not the *man*, because the statue speaks to *us*, not him."
  *   **Soft Spot:** This leans heavily on the "dead can't be blamed" point, which is your underdeveloped area (see Objection 5).

  **4. The Commemoration/Blame Conflation**
  *   **Who:** Philosophically-inclined Historian.
  *   **The Objection:** "You want to separate judging the person from judging the commemoration. But commemoration *is* a form of moral evaluation. To say 'this person is unworthy of a statue' is just a polite way of saying 'this person was bad.' If the output is the same (we condemn them), why does the mechanism matter? You're just sanitizing presentism."
  *   **The Reply:** "The mechanism matters because it changes the *subject* of the debate. If we debate Jefferson's soul, we're doing metaphysics and bad history. If we debate the statue, we're doing political philosophy and civic planning. One looks backward to assign guilt; the other looks forward to assign values. We can remove a statue not because Jefferson is 'guilty,' but because the statue no longer represents *our* values. That shifts the agency to the living."
  *   **Soft Spot:** In public discourse, these two inevitably collapse. Removing a statue *feels* like blaming the dead, regardless of your philosophical distinction.

  **5. The "Wronging the Dead" Metaphysics**
  *   **Who:** Metaphysician / Grad Student.
  *   **The Objection:** "You mentioned in passing that it's unclear the dead can be wronged. If they can't be wronged, then re-evaluating them can't harm them. So why the hesitation? If they can't be wronged, why do we need the 'man of his time' defence at all? Just judge them. If they *can* be wronged, your whole project collapses because you're participating in the harming. Which is it?"
  *   **The Reply:** "I'm inclined to think they can't be wronged in a literal sense, but our *practices* regarding them can wrong the *living* descendants or distort the *truth*. My hesitation isn't about harming Jefferson; it's about harming history. If we treat the dead as moral putty for present needs, we lose the friction that makes history useful. I want to leave the metaphysics open but insist the *practical* focus remains on the living community."
  *   **Soft Spot:** **This is your weakest point.** You admitted this is half-baked. If pressed hard here, you will wobble.

  **6. The "Straw Man" Defence**
  *   **Who:** Intellectual Historian.
  *   **The Objection:** "Who actually uses the 'man of his time' defence the way you describe? Serious defenders of historical figures know about the dissenters. They use the defence to argue for *charity* in interpretation, not total exoneration. You've carved up a nuanced position into three rigid moves to knock them down. Are you fighting a newspaper columnist's argument rather than a historian's?"
  *   **The Reply:** "In public debate and political rhetoric—which is where commemoration battles happen—this defence is used as a blanket shield. It stops inquiry. By disentangling it, I'm trying to give historians better tools to push back. Even if sophisticated defenders know about the Quakers, the public deployment of the phrase erases them. I'm targeting the *function* of the phrase in public discourse, not necessarily its most charitable philosophical reconstruction."
  *   **Soft Spot:** If a historian says, "I never use it that way," you look like you're attacking a ghost.

  **7. The "Cherry-Picking Dissent" Objection**
  *   **Who:** Historian of Early Modern Religion.
  *   **The Objection:** "You say Quakers and Dominicans prove moral knowledge was available. But isn't selecting *those* dissenters just as presentist as blaming Jefferson? You're choosing the dissenters who look like modern liberals. What about the dissenters who argued for *more* cruelty? Why is the 'time' defined by the people we agree with now?"
  *   **The Reply:** "Because the 'man of his time' defence specifically claims that *our* standards were unavailable then. To refute that, I only need to show that *our* standards (or approximations of them) were available. I'm not saying the Quakers represent the whole 'time,' only that they represent the specific moral knowledge Jefferson is claimed to have lacked."
  *   **Soft Spot:** Risks making your argument look like a hunt for "good ancestors" rather than a structural analysis of moral availability.

  **8. The Pragmatic/Political Objection**
  *   **Who:** Grad Student / Critical Theorist.
  *   **The Objection:** "This feels like academic navel-gazing. Does distinguishing between 'blame' and 'commemoration' actually change power dynamics? If the statues come down, it's because people protested, not because of a philosophical distinction. Isn't this just giving intellectuals a way to feel nuanced while nothing changes?"
  *   **The Reply:** "It changes the justification for the change. If we take statues down because 'he was evil,' we invite a culture war about history. If we take them down because 'this no longer serves our civic values,' we claim agency for the present. It stabilizes the practice of re-evaluation so it doesn't require a new inquisition every generation. It makes the change sustainable."
  *   **Soft Spot:** Can sound overly idealistic about "sustainability" in the face of real political conflict.

  ---

  ### The "Hope Nobody Asks" Questions

  **1. The Metaphysics of Posthumous Harm**
  *   **Question:** "If the dead have no interests, on what grounds do we owe them accurate representation? If they can't be wronged, why is 'bad history' a moral problem rather than just an aesthetic one?"
  *   **Prep:** You need to pivot quickly from the *dead's* rights to the *living's* need for truth.
  *   **Draft Answer:** "It's not about the dead's interests; it's about the living's epistemic environment. False history harms the living who rely on it to understand their present. The 'wrong' is against the community of inquiry, not the corpse."

  **2. The Inseparability of Honor and Blame**
  *   **Question:** "Commemoration is about honor. Honor implies moral worth. If you deny them honor based on moral standards, aren't you necessarily blaming them? Can you really have a 'negative judgment of commemoration' without a 'positive judgment of blame'?"
  *   **Prep:** This threatens your core distinction (Move 3 vs Move 1).
  *   **Draft Answer:** "Honor is forward-looking (who do we want to emulate?), blame is backward-looking (who is responsible?). We can decide not to emulate someone without needing to settle the ledger of their responsibility. We can say 'this is not our value' without saying 'he is damned'."

  ---

  ### Strategic Advice

  **The Single Reply That Must Land:**
  **Objection #4 (Commemoration vs. Blame).**
  If you cannot convince the room that we can evaluate *commemorative practices* without engaging in *posthumous moral blaming*, the historians will reject the project as presentist moralizing, and the philosophers will reject it as metaphysically confused. You must sell the idea that **commemoration is a speech act by the living, about the living, using the dead as symbols.** If the statue is about *us*, Jefferson's metaphysical status matters less.

  **Concessions to Buy Goodwill (Say these early):**
  1.  **To the Historians:** "I agree that presentist blame is usually bad history. It flattens context and stops inquiry. My goal isn't to encourage more blaming of the dead, but to clarify why we are actually arguing when we debate statues."
  2.  **To the Philosophers:** "I am not solving the problem of moral luck or the metaphysics of posthumous harm today. I am bracketing them to focus on the *social practice* of judgment."
  3.  **On the "Dead" Point:** Be honest. "I don't have a settled view on whether the dead can be wronged. I'm arguing that even if they can't be, we still have reasons to be careful about how we judge them, primarily for the sake of the living historical record."

  **Tone Check:**
  Avoid sounding like you are "saving" the historical figures. Frame it as "saving the historical *discourse* from simplistic defences." Align yourself with the historians' desire for complexity, even if you are introducing a moral dimension they dislike.
