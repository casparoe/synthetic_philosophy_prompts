      *   **Audience:** Mixed History (Early-Modern Atlantic, Modern Britain, slavery/empire focus, allergic to moralizing) and Philosophy (Moral responsibility, Strawson, moral luck). Plus grad students.
      *   **Deliverables:**
          *   ~8 Objections (ordered by damage potential).
