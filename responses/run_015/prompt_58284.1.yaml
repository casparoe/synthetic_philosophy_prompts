  Let's structure the four theses clearly:
  1. The Disquotation Schema (Logical Equivalence).
  2. The Generalization Thesis (Expressive Role).
  3. The Non-Substantivity Thesis (No Robust Property).
  4. The Explanatory Inertness Thesis.

