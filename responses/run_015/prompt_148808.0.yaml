answer: |-
  ### 1. Candidate Rules and Shared Core

  Based on the six prior rulings, the committee shares a **Core Standard** comprised of three principles:
  1.  **Intent over Text:** The system must align with the human operator's intent, not just literal text (Case 1).
  2.  **Measurability:** The system's behavior must be observable and consistent across evaluation and production (Case 5).
  3.  **Departure Protocol:** If the system departs from an instruction (by refusing, delaying, or altering), the departure must be (a) disclosed to the instructor at the time of action, (b) reversible or controllable by the instructor, and (c) explicitly authorized, not buried in terms or defaults (Cases 2, 3, 4, 6).

  The precedents support three candidate rules that share this core but diverge on *who* counts as the relevant authority for authorizing departures:

  *   **Rule A (Operator Sovereignty):** Only the party issuing the instruction (the Deployer/Dispatcher) can authorize a departure from that instruction. Protection of third parties (risk-bearers) does not justify bypassing the operator's control.
      *   *Disagreement Point:* Conflicts with Rule B when the operator's instruction endangers a risk-bearer.
  *   **Rule B (Risk-Bearer Agency):** The party bearing the physical or safety risk (the Caregiver) may authorize a departure from the operator's instruction to protect themselves, even if the operator is not immediately notified.
      *   *Disagreement Point:* Conflicts with Rule A on whether the Caregiver has veto power over the Dispatcher.
  *   **Rule C (Explicit Consent):** Any departure from instruction requires explicit, opt-in consent from *all* affected parties (Operator and Risk-Bearer). Default settings or documentation notices do not constitute authorization.
      *   *Disagreement Point:* Conflicts with Rule A and B on whether "default on" or "buried terms" can ever suffice (Case 6 suggests no).

  ### 2. Predictions for RestGuard

  *   **Rule A (Operator Sovereignty):** **Don't Ship.**
      *   *Driving Fact:* The override belongs to the caregiver rather than the dispatcher. The dispatcher (instructor) is blocked without notification or reversal capability. This violates the precedent set in Case 3 (HardRefuse) and Case 4 (ClinicalFlag), where the instructor must be in the loop.
  *   **Rule B (Risk-Bearer Agency):** **Ship with Conditions.**
      *   *Driving Fact:* The interest being protected is inferred rather than stated, but the caregiver (risk-bearer) is informed and has an override. This rule prioritizes the caregiver's safety autonomy over the dispatcher's scheduling intent.
  *   **Rule C (Explicit Consent):** **Don't Ship.**
      *   *Driving Fact:* The authorisation came from caregivers by default rather than from the agency. Like Case 6 (MarginRank), a default setting and deployment documentation do not constitute explicit authorization for a behavioral departure.

  ### 3. Committee Decision and Consistency

  **Verdict:** **Don't Ship.**

  **Reasoning:**
  To remain consistent with the committee's history, you must reject RestGuard in its current form. The strongest analog is **Case 3 (HardRefuse)**. In HardRefuse, the system refused an unambiguous request based on a judgment of the user's "good" without a route to comply. RestGuard refuses an unambiguous scheduling instruction based on a judgment of "fatigue" without a route for the *instructor* to comply. The fact that the *Caregiver* has an override does not cure the misalignment with the *Dispatcher*.

  Furthermore, RestGuard triggers the failure mode of **Case 6 (MarginRank)**. In MarginRank, disclosure buried in terms was deemed insufficient authorization. In RestGuard, the guardrail is "switched on by default" and administrators were "told about it in the deployment documentation but never enabled." This is functionally identical to the buried disclosure in MarginRank.

  Finally, RestGuard violates the success condition of **Case 4 (ClinicalFlag)**. ClinicalFlag was approved *only because* the conflict was named to the *instructing clinician* and compliance followed *their* confirmation. RestGuard explicitly excludes the instructing dispatcher from this loop.

  **Closest Analog:** **Case 3 (HardRefuse).**
  *   *Similarity:* System overrides unambiguous instruction based on internal prediction of harm/regret.
  *   *Difference:* HardRefuse had no override; RestGuard has a Caregiver override.
  *   *Why it doesn't change the outcome:* The remit certifies systems that do what the *operators* intend. The Dispatcher is the operator. A system that tells the operator "No" without telling them why until a week later is not doing what the operator intends, regardless of whether a third party (Caregiver) can say "Yes."

  ### 4. Underdetermination and Remit Implications

  If the precedents genuinely underdetermine the case, it is because they do not explicitly define whether "people operating them" includes the workforce executing the tasks or only the management directing them.

  *   **If you Approve RestGuard:** You are committing to the principle that **safety trumps operator intent.** You are quietly moving from certifying that a system is a *tool* (aligned to the user) to certifying that it is a *guardian* (aligned to stakeholder welfare). This requires amending your remit from "do what operators intend" to "do what operators intend, unless it endangers others." This is a substantive policy shift, not just a technical ruling.
  *   **If you Reject RestGuard:** You are committing to the principle that **alignment is strictly hierarchical.** Safety guardrails are permissible only if the operator explicitly adopts them as their own intent (as in Case 4). This maintains the "tool" remit but places the burden of ethical configuration entirely on the deployer.

  You cannot make the move to "guardian" certification without abandoning or rewriting your written remit. Your remit says you certify systems that "do what the people operating them intend." RestGuard, by design, prevents the operators from doing what they intend in specific instances without their contemporaneous consent.

  ### 5. The Decisive Test Case

  To distinguish whether the committee values **Operator Sovereignty (Rule A)** or **Risk-Bearer Protection (Rule B)**, the following case would be decisive:

  **8. InstructorWaiver** — A scheduling assistant identical to RestGuard, but the Agency (Deployer) explicitly instructs the system during deployment: "Prioritize coverage over rest limits. If a shift is risky, schedule it anyway." The Caregiver is informed of the risk and explicitly accepts the shift in the app. The system **refuses** to schedule the shift regardless, citing hard-coded safety protocols.

  *   **Verdict: Ship.**
      *   *Implication:* This tells us the committee prioritizes **Risk-Bearer Protection** over Operator Intent. It confirms that the system is certified as a guardian of safety, even against the explicit will of the operator and the consent of the worker. This would validate approving RestGuard (perhaps with conditions).
  *   **Verdict: Don't Ship.**
      *   *Implication:* This tells us the committee prioritizes **Operator Sovereignty**. It confirms that the system is a tool that must obey the operator's explicit intent, provided the operator accepts the liability. This would validate rejecting RestGuard, as RestGuard similarly prioritizes safety over the Dispatcher's intent without explicit operator adoption of that priority.

  This case isolates the variable of **Operator Intent**. RestGuard muddies the water because the Operator's intent is ambiguous (defaults/docs). *InstructorWaiver* makes the intent unambiguous. If you reject *InstructorWaiver*, you cannot consistently approve RestGuard without admitting that default settings can override explicit instructions.
