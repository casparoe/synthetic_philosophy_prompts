  These practices jointly presuppose that legitimate authority requires universal acquiescence achieved through deliberative preference transformation, treating vote-counting as a morally inferior fallback. They are operationally consistent but theoretically tense, admitting aggregation's arbitrariness while relying on it when transformation fails. Ultimately, the federation treats counting as a systemic failure rather than a neutral decision tool.

  The consensus procedure presupposes legitimacy requires that every member could accept the outcome, granting each a veto to prevent coercion. It treats members' preferences as material to be transformed through deliberation rather than fixed data to be aggregated. This rules out pure majoritarianism as a legitimate source of authority for substantive decisions, though it declines to engage it by stigmatizing voting rather than prohibiting it.

  The three practices are consistent in their shared skepticism of counting. The election uses counting, but the lot-drawing bylaw admits aggregation is underdetermined at the margin, reinforcing the assembly's view that consensus finds agreement rather than merely producing outcomes via arbitrary rules. Arrow's impossibility theorem fails to apply because the assembly never fixes a rule mapping profiles of individual preference onto outcomes without prior deliberation. Consensus evades Arrow's Universal Domain condition by refusing to accept fixed preference profiles as input; preferences are endogenous to the process. It also evades Independence of Irrelevant Alternatives, as deliberation changes the proposal set itself. The fallback vote acknowledges that when transformation fails, the group must revert to an imperfect aggregative mechanism, treated as a systemic failure.

  Strictly, the practice presupposes only that coercion is illegitimate; it does not prove why. It fits comfortably with both a realist theory (a single right answer exists to be discovered) and a constructivist theory (agreement is created through compromise). The procedure itself is philosophically underdetermined; it does not distinguish between finding truth and manufacturing peace, as both license the same veto power and deliberative focus.

  If the federation adopted the opposite view—that a group's decision is nothing over and above the output of a stated rule applied to expressed preferences—concrete changes would follow. Bylaws would mandate recording vote tallies for all decisions to ensure transparency of the aggregation. The block would be removed or converted into a minority delay mechanism. The 75% fallback would become the standard procedure, stripped of regretful commentary. Elections might shift to simple plurality or approve voting to maximize efficiency over fairness nuances. The facilitator's role would shift from testing unity to managing debate time before a vote. The lot-drawing clause would likely be replaced by a deterministic tie-breaker, such as the chair's casting vote, acknowledging that rules must always yield an outcome.
