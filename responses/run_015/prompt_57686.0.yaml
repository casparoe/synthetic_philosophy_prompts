  2.  **Deconstruct the Practices:**
      *   *Practice 1 (Elections):* IRV (counting preferences) + Lot for ties (admission of arbitrariness/fairness limit).
      *   *Practice 2 (Consensus):* No counting, single block decisive, preference transformation ("live with"), no record of tallies.
      *   *Practice 3 (Fallback):* 75% vote allowed but stigmatized as failure ("reduced to counting").

  3.  **Analyze the Theoretical Implications:**
      *   *Consensus Theory:* Presupposes legitimacy stems from universal acceptability (no coercion), not mere majority will. It treats preferences as malleable through deliberation (transformative) rather than fixed inputs (aggregative). It hints at a "common good" discoverable through talk, though strictly it only requires acquiescence.
      *   *Consistency:* The election (counting) vs. Consensus (no counting) seems contradictory, but the lot tie-breaker admits the limits of counting. The fallback admits consensus can fail. The stigma on counting suggests counting is inferior but necessary sometimes.
      *   *Arrow's Theorem:* Arrow applies to social welfare functions mapping preference profiles to outcomes. Consensus avoids this by not mapping fixed preferences; it changes preferences via deliberation. It evades the "Universal Domain" condition (preferences aren't fixed) and "Independence of Irrelevant Alternatives" (deliberation changes the set).
      *   *Underdetermination:* Consensus fits both "single right answer" (truth-tracking) and "pure accommodation" (conflict avoidance). The procedure doesn't prove which is true.
