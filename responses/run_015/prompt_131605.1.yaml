prompt: |-
  I am preparing the interview questions for a philosophy-of-technology podcast episode, and I want them to be rigorous enough for a specialist audience without requiring the guest to cite archival material. Next week's guest is an unnamed philosopher of science who defends what she calls the recursive-adaptation thesis: a reading of von Neumann's late essay on whether accelerating technology can outpace human institutions, published shortly after his death. According to her, von Neumann's argument is not straightforward technological optimism but a conditional claim—technology survives only if social institutions develop a second-order capacity to revise their own decision rules at roughly the same rate as first-order technological change—and she argues that this condition is implicit in his work on self-replicating automata and on game-theoretic rationality. I want a sequence of eight to ten interview questions that go well beyond asking her to restate the view. At least one question should press her on the conceptual distinction between first-order technological adaptation, which builds better tools, and second-order institutional adaptation, which rewrites the norms governing how those tools are built; for that question, include a follow-up keyed to her likely reply that institutional revision can be engineered through feedback loops. At least one question should target her reliance on game theory: does the recursive-adaptation thesis assume cooperative equilibria that von Neumann's own minimax framework suggests are unstable under competitive or adversarial pressure, and what organizational form could preserve adaptivity without assuming cooperation? Include a follow-up anticipating her defense that competitive dynamics themselves can be institutionalized as meta-rules. Another question should address what I will call the margin of institutional ignorance—if institutions must revise faster than they can accumulate reliable evidence about the technologies they are regulating, is she describing a genuinely rational form of decision-making under radical uncertainty, or is she merely relabeling reactive crisis management? Provide a follow-up that presses her on whether this undermines her claim that the process counts as adaptive rather than reactive. The sequence should build conceptually: begin with clarification of the thesis and its textual basis in von Neumann's concerns about exponential growth and organizational lag; then move to the internal tension between his optimism about human problem-solving and the pessimistic implications of his mathematical models of conflict; and end with a question about whether artificial general intelligence, interpreted as a self-replicating automaton endowed with institutional agency, would represent the fulfillment or the definitive refutation of the recursive-adaptation thesis. Please write all questions in polished American English, avoid generic biographical openers, and ensure that none depend on access to obscure unpublished correspondence, rare archival sources, or precise bibliographic data that a model without web access could not reasonably be expected to recall.
