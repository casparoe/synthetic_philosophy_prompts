      5. "Commitment Device." (Defuse: Isolation of mental state).

      *Wait, the prompt asks for misconceptions in the order they will reach the room.*
      1. "Can't I just lie?" (Immediate).
      2. "Why not just take the money and skip the drink?" (Once rules are clear).
      3. "But I might change my mind." (Once they realise they need to intend).
      4. "Isn't intending just predicting?" (Philosophical push).
