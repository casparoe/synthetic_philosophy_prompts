      *Wait, the prompt says "defuse it rather than merely answer it".* This implies setting the parameters so the objection doesn't arise, or showing it misses the point.

      *Diagnostic Question:* Needs to be sharp. "If you received the money at 10am, and at 11am you were asked 'Will you drink at noon?', what must you answer to be consistent with your midnight intention?"

      *Declined Topic:* Newcomb's Problem is the standard sibling. I'll decline that to keep focus on *intention* rather than *prediction of action*.

      *British English Check:* Programme, centre, rationalise, whilst, whilst, honour, etc.

