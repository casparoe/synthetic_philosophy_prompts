answer: |-
  **Seminar Plan: Kavka's Toxin Puzzle (50 Minutes)**

  **1. Conceptual Groundwork (Minutes 0–10)**
  *Objective: To prevent the discussion from collapsing into psychology or willpower.*

  Before you describe the billionaire or the toxin, you must secure three conceptual distinctions on the board. If you do not do this, the students will treat 'intention' as a synonym for 'hope' or 'guess'.

  *   **Intention vs. Desire:** Establish that one can intend to do what one does not desire (e.g., going to the dentist). The puzzle fails if students think they need to *want* to drink the toxin.
  *   **Intention vs. Prediction:** Establish that intending is not merely forecasting one's behaviour. I can intend to stop smoking and fail; the intention was real even if the prediction was false.
  *   **Rationality vs. Willpower:** Stipulate that 'rationality' here means instrumental consistency (taking the means to one's ends), not strength of character. We are not testing their guts; we are testing their logic.

  **2. The Scenario and Constraints (Minutes 10–20)**
  *Objective: To state the case in a way that isolates the formation of intention.*

  When presenting the puzzle, you must build the constraints into the narrative to pre-empt the most common objections.

  *   **The Detector:** You **must** include the infallible intention-detector. Without it, the seminar dissolves into a discussion of deception ('I'll just lie to the machine'). However, to avoid making the difficulty epistemic (i.e., 'Can I trick the sensor?'), frame the device not as technology, but as a **logical stipulation of the world**. Tell them: 'In this thought experiment, it is metaphysically impossible to possess the intention without the machine registering it, and impossible to register it without possessing it.' This removes the 'pretending' option without inviting speculation about brainwaves.
  *   **Features the Case Must Have:**
      *   **Payment Timing:** The money must be deposited *before* the time to drink. If payment is conditional on drinking, it is a contract, not a puzzle.
      *   **No Benefit to Drinking:** The toxin must cause sickness with no compensatory health benefit.
      *   **No Penalty for Not Drinking:** Aside from not getting the money (which is already in the bank), there must be no punishment.
  *   **Features the Case Must Lack:**
      *   **External Commitment:** Explicitly ban Ulysses pacts (e.g., betting a friend, handcuffing oneself). The puzzle concerns the *mental state*, not behavioural engineering.
      *   **Moral Obligation:** Ensure there is no sense that one *ought* to keep a promise. This is about prudence, not ethics.

  **3. Misconceptions and Defusal Strategy (Minutes 20–40)**
  *Objective: To manage the discussion by anticipating objections in the order they will arise.*

  Do not wait for these to derail the room; introduce the defusions as you open the floor.

  1.  **The 'Deception' Objection:** *'Can't I just pretend to intend?'*
      *   **Order:** Immediate (upon hearing the detector).
      *   **Defusal Point:** **During the setup.** Do not let this become a question. State the infallibility of the detector as a brute fact of the scenario. If they press it, remind them that in philosophy, we accept the premises of the thought experiment to test the consequences.
  2.  **The 'Free Money' Objection:** *'I'll form the intention, get the cash, and then just not drink.'*
      *   **Order:** Immediately after understanding the payment structure.
      *   **Defusal Point:** **During the setup.** Emphasise that the *reason* they cannot do this is that they know they will do it. Ask: 'If you know you won't drink, can you truly intend to?' Force them to see the tension between their future action and their present state of mind.
  3.  **The 'Irrationality' Objection:** *'I can intend it because I might change my mind or be irrational tomorrow.'*
      *   **Order:** Once they realise the intention requires confidence.
      *   **Defusal Point:** **During the discussion.** Remind them of the 'Rationality' stipulation from the first ten minutes. The agent in the puzzle knows they will be rational tomorrow. If they rely on future irrationality to make the intention possible, they admit the intention is not rationally formed now.
  4.  **The 'Prediction' Reduction:** *'Intending is just predicting you'll do it.'*
      *   **Order:** When they try to solve the tension by dissolving the concept of intention.
      *   **Defusal Point:** **Mid-discussion.** Refer back to the board. If intention were only prediction, the puzzle vanishes, but so does agency. Ask: 'If intention is just prediction, how do we ever decide to do anything difficult?'
  5.  **The 'Commitment Device' Solution:** *'I'd bet my friend £1,000 I'd drink it.'*
      *   **Order:** Towards the end, as a pragmatic workaround.
      *   **Defusal Point:** **Closing analysis.** Acknowledge this works in real life but explain that it changes the subject. The puzzle asks if the *intention itself* can be rational, not if one can alter the incentives. Accepting this solution admits that the bare intention is impossible.

  **4. Diagnostic Question (Minutes 40–45)**
  *Objective: To test grasp of the specific philosophical issue.*

  Put this question to the whole room:

  > 'Suppose you have the money in your account at 10:00 am. At 11:59 am, you ask yourself: "Do I have a reason to drink at noon?" If you answer "No", what does that imply about the intention you held at midnight?'

  *   **Correct Grasp:** They should recognise that answering "No" implies the midnight intention was either impossible to hold or was not a genuine intention (perhaps a hope or a lie).
  *   **Incorrect Grasp:** If they say "It implies I should drink anyway" (missing the rationality constraint) or "It implies the intention was fine, I just changed my mind" (missing the stability constraint).

  **5. The Declined Topic (Minutes 45–50)**
  *Objective: To bound the seminar and prevent scope creep.*

  You should openly decline to pursue **Newcomb's Problem**.

  *   **What to say:** 'This puzzle is often paired with Newcomb's Problem, which deals with predictors and causal decision theory. While related, Newcomb's focuses on the rationality of *action* given a prediction, whereas Kavka focuses on the possibility of *intention* itself. To keep our focus on the nature of intending, we will not open the game-theoretic can of worms today.'

  **Summary of Timing:**
  *   0–10: Concepts (Intention/Desire/Prediction).
  *   10–20: Scenario Setup (with built-in defusions).
  *   20–40: Guided Discussion (managing the 5 misconceptions).
  *   40–45: Diagnostic Question.
  *   45–50: Conclusion and boundary setting (Newcomb's).
