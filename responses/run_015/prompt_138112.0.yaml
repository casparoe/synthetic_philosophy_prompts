      *   *The "Re-description" key:* In #3, the re-description (no earmarking) matched the *financial reality* (fungible money). In #2, the re-description (external script) contradicted the *physical reality* (handing the bottle). In the New Proposal, the re-description ("transfer") contradicts the *digital reality* (an order triggering a schedule).
