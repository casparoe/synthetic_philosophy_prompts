answer: |-
  Dear colleague, I have been turning your description of the editorial dilemma over in my mind since you sent it, and I must say it strikes me as one of those rare practical problems that sits squarely on top of a deep philosophical fault line, even if we do our best to ignore the tremors. It is entirely understandable that you feel caught between the obvious utility of the rule in catching sloppy reporting and the absurdity of applying it to the bedrock of common knowledge or the unique nature of lived experience. To answer your first question directly, the rule is defensible as a heuristic for high-stakes empirical claims, particularly those involving numbers or causal mechanisms that can be independently verified, but it is indefensible as a universal law of assertion. The editor is correct that repeating a claim and standing behind it are different acts, but she is mistaken in assuming that standing behind a claim always requires personal verification rather than warranted trust. In a complex society, we necessarily rely on a division of cognitive labour, and to demand that every staff member personally verify the age of the earth or the contents of a confidential report is to misunderstand how knowledge is actually produced and maintained. The rule works in the case of the triple-hopped statistic because each link in the chain explicitly refused to vouch for it, creating a gap in responsibility; it fails in the case of general scientific consensus because the vouching is done by the institutional structure of science itself, which we are entitled to rely upon unless we have specific reason not to.

  Where you ask whether there is a principled place to stop applying the rule, as opposed to a merely practical one, I believe there is indeed a principled boundary, though it requires shifting the focus from the source of the information to the nature of the claim being made. The principled stop lies in distinguishing between claims about external facts that exist independently of the report, and claims where the report itself constitutes the evidence. When you publish a first-person account of living under a policy, the value of that account is not that it represents an objectively verifiable statistic, but that it records a subjective experience which, by its nature, cannot be corroborated by a monitoring instrument. To demand grounds for such an account beyond the speaker's word is to category mistake the evidence; the speaker's testimony is the data point. Similarly, for established background knowledge like the age of the earth, the principled stop is consensus among relevant experts. The rule should apply where there is room for dispute or error in the transmission of data, but it should not apply where the transmission is the only possible form of evidence, or where the claim is so foundational that rejecting it would collapse the framework required to discuss anything else. The editor's refusal to apply the rule to direct observation while applying it to expert testimony is inconsistent, since both rely on fallible human faculties, but the consistency we should aim for is not about fallibility, it is about accountability. We are accountable for checking what can be checked, but we cannot be accountable for checking what cannot be checked without destroying the value of the information.

  The matter of the editor's own grounds for the rule is perhaps the most delicate point, and while she dismisses your concern as a debating trick, it is actually a significant indicator of the rule's status. If the rule is presented as a truth about knowledge itself, then it fails its own test, because she cannot stand on her own two feet regarding the rule's validity. However, if the rule is presented as a pragmatic policy decision designed to minimise risk and enhance the institute's reputation, then it does not need to satisfy its own evidentiary standards any more than a fire drill needs to be on fire. The problem is that she seems to be treating a pragmatic heuristic as a moral imperative, which is why she applies it without exception to the senior fellow while ignoring the inherent fallibility of memory and instruments. This suggests that the rule is serving a function beyond error correction, perhaps acting as a way for her to assert control or establish a new culture of rigour, which is fair enough, but it should not be disguised as a philosophical absolute. You are right to feel that the self-referential inconsistency matters, because if the rule cannot be justified to the staff who must enforce it, it will inevitably be resented and undermined, regardless of how many errors it catches.

  As for what you should actually do about this on Monday, I would advise against launching into a theoretical critique, however satisfying that might be, and instead focus on a proposal that refines the rule to match the practical realities of your work. You might suggest a tiered system where claims are categorised by their nature, such as distinguishing between novel empirical data, established background context, and qualitative testimony. For novel data, the own two feet rule should apply strictly, requiring someone to verify the chain of custody for the numbers. For established context, reliance on standard authoritative sources should be deemed sufficient grounds, perhaps with a standard citation format that acknowledges the reliance. For qualitative testimony, the ground for assertion should be defined as the integrity of the interview process itself, rather than external corroboration. This approach allows you to keep the spirit of the editor's rigour where it matters most, in the handling of new statistics, while removing the impossible burden where it stifles necessary work. You could frame this as a way to protect the rule from becoming discredited by unworkable applications, arguing that a rule which demands the impossible will eventually be ignored entirely, whereas a nuanced rule will be respected.

  I would also suggest proposing a formal review of the rule's cost-benefit analysis at the end of the year, noting the two days of labour per month and the two errors caught. This is not to undermine the editor, but to treat the rule as the policy instrument it truly is, subject to evaluation like any other. If the cost outweighs the benefit, or if the benefit is concentrated in only one type of error, the rule should be adjusted. You might offer to draft a brief guidance note for the team that clarifies these exceptions, which would take the burden of interpretation off the editor's shoulders and ensure consistency without requiring her to admit fault. It is important to approach this collaboratively, acknowledging that her intention to raise standards is correct, while gently pointing out that the current implementation contains internal contradictions that threaten its longevity. If you can show her that refining the rule will make it more robust and less open to challenge, she may be more willing to accept the modifications. Ultimately, you are trying to build a culture of responsibility, not a fortress of solitude, and the goal should be to ensure that when you stand behind a claim, you are doing so on ground that is solid enough to support the weight of your institute's reputation, even if that ground is sometimes the trusted word of another. I hope this helps you navigate the meeting, and do let me know how you get on.
