  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I dismiss the dopamine analogy? *Correction:* No, acknowledge it but frame it as correlational, not constitutive.
      *   *Check:* Did I distinguish agent types? *Correction:* Ensure Model-Free vs. Model-Based is explicit in the wireheading section.
