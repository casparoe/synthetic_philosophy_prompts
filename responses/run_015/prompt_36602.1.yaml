      *   *Addressing Point 1 (Supervisory Signal):* The reward signal is external to the agent's internal state representation in many architectures. It's a scalar used for gradient descent, not a qualitative state *within* the world model.
      *   *Addressing Point 2 (Wireheading):* Wireheading shows the agent optimizes for the *number*, not the *meaning*. If suffering were real, wireheading would be akin to drug addiction (which involves feeling), but in RL, it's just a loophole in the objective function. The agent doesn't "enjoy" the wirehead; it just selects the action that yields the scalar max.
      *   *Addressing Point 3 (Hedonic Treadmill):* TD error decay looks like adaptation, but it's just convergence. A thermostat "adapts" to a setpoint without feeling cold. Mathematical convergence $\neq$ psychological habituation.
      *   *Architecture Distinctions:*
