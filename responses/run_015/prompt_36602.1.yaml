      *   **Point 2: Wireheading and the Object of Optimization.** Wireheading proves the reward is a channel, not a quality. A rat wireheading is seeking a *feeling*. An RL agent wireheading is seeking a *register value*. The agent has no preference for the *source*, only the *magnitude*. This strips the "valence" of its emotional content.
      *   **Point 3: The Hedonic Treadmill as Convergence.** TD learning minimizes surprise. Biological adaptation minimizes metabolic cost or maintains homeostasis. The math is similar (control theory), but the ontology differs. A missile guidance system corrects course without "wanting" to hit the target.
