  The Principal Principle and van Fraassen's Reflection Principle are not merely analogous guidelines but identical normative structures applied to different objects: objective chances versus future credences. Consequently, the "inadmissible evidence" exception in the Principal Principle functions exactly like the rationality caveats in Reflection, marking boundaries where deference is suspended due to anticipated epistemic failure. This equivalence implies that arguments establishing the Principal Principle as constitutive of chance inadvertently prove too much, forcing an absurd constitutive link between credence and future opinion.

  **The Parallel**
  Both principles mandate a specific, rigorous form of epistemic deference known as the expert function. The Principal Principle requires your current credence in a proposition to match your estimate of its objective chance, while Reflection requires your current credence to match your expectation of your future credence. Structurally, both are bridging norms connecting a present doxastic state to an authority—either the metaphysical machinery of the world or your own future rational self. In both cases, the norm dictates that you should treat the authority as expert relative to your current information. The mathematical formulation is nearly identical: conditional credence in A given that chance(A)=x should be x, just as conditional credence in A given that future credence(A)=x should be x. This suggests a unified underlying norm of rationality: align your beliefs with the best available indicator of truth. Whether that indicator is the physical propensity of a coin or the calculated judgment of your future self, the rational requirement to defer remains constant. The distinction lies only in the source of authority, not the normative force binding the agent to that authority. Thus, they are not separate rules but instances of a single master principle governing how agents relate to truth-tracking sources. The symmetry implies that any justification for one must apply to the other, binding the fate of their philosophical defenses together. If one is a requirement of rationality, so is the other; if one is constitutive, so is the other. This structural identity forces us to treat the exceptions to each rule as functionally equivalent rather than distinct. While one operates synchronically between mind and world and the other diachronically between temporal selves, the normative pressure exerted on the agent's current credence function is identical in kind and degree. They are two faces of the same coin at the limit.

  **Where Reflection's Counterexamples Infect the PP**
  Standard counterexamples to Reflection involve knowing you will be irrational, such as anticipating being drugged or brainwashed into false beliefs. In these cases, you are exempted from deferring to your future self because you possess a defeater regarding their rationality. This mirrors the "inadmissible evidence" clause in the Principal Principle. When Lewis excludes inadmissible evidence, he excludes information that bypasses the chance mechanism, like looking into a crystal ball or knowing the outcome directly. This is effectively acknowledging that the chance function is no longer the reliable authority. If you know the future outcome, the chance is irrelevant, just as if you know your future self is compromised, their opinion is irrelevant. Therefore, the inadmissibility clause is not a unique feature of chance but a general excusing condition for anticipated epistemic malfunction. It marks the point where the authority loses its truth-tracking status. Recognizing this reveals that the PP's exception is not a metaphysical distinction between chance and evidence, but a rationality constraint identical to the one protecting Reflection from cases of expected insanity. Both clauses serve to suspend deference when the link between the authority and the truth is severed by superior information. Inadmissible evidence is simply evidence that the chance setup is malfunctioning or bypassed, exactly parallel to evidence that your future self is malfunctioning. In both scenarios, the agent holds information that renders the designated authority obsolete for the purpose of truth-seeking. This undermines the idea that chance holds a special metaphysical privilege over opinion.

  **What this Means for the Constitutive Reading**
  Many philosophers argue that the Principal Principle is constitutive of the concept of chance; to understand chance just is to understand the norm requiring credence to match it. However, if PP and Reflection are the same norm, this constitutive argument proves too much. It would imply that Reflection is constitutive of credence itself, meaning part of what it is to have a belief is to defer to your future self. This is absurd, as agents can possess credences without having any concept of their future rationality or even existing over time. Since the constitutive reading of Reflection is untenable, the parallel suggests the constitutive reading of the Principal Principle is equally flawed. The normativity is likely a derived requirement of rationality rather than a definition of the terms themselves. We must therefore reject the idea that chance is defined by this norm, just as we reject that credence is defined by Reflection. This collapse forces a choice: either both principles are merely regulative ideals, or neither concept is genuinely constituted by deference. Consequently, the metaphysical status of chance remains independent.

  **Biggest Weakness of the Argument**
  The strongest objection is that the metaphysical disanalogy between chance and future credence is too deep to ignore. Objective chance is mind-independent and fixed by physical laws, whereas future credence is mind-dependent and contingent on psychological processes. The Principal Principle bridges the gap between the metaphysical and the epistemic, while Reflection remains entirely within the epistemic sphere. Consequently, the "inadmissible evidence" clause might genuinely track a metaphysical boundary regarding how chance information reaches us, rather than just a general rationality defeater. If chance is a unique ontological category, the norm governing it might be constitutive in a way that intra-doastic norms like Reflection simply cannot be, breaking the symmetry this argument relies upon.
