answer: |-
  Good evening, everyone.

  Welcome.

  Thank you for coming.

  And a special thank you to the teachers.

  They have helped turn this hall into a map of the world.

  Look at the effort on the tables.

  Look at the colours on the walls.

  It is impressive.

  I know preparing for tonight took time.

  I know some of you discussed what to put on your display.

  I know some children were assigned a country.

  Perhaps it was a place they know well.

  Perhaps it was a place they have never visited.

  I know how that feels.

  To be handed a label can feel tight.

  Sometimes it fits like a favourite coat.

  Sometimes it feels like a uniform you did not choose.

  If your child is standing there feeling like a delegate for a whole nation, I want to say something.

  You are not an ambassador.

  You do not carry the weight of a government.

  You do not represent every person from that place.

  You are just you.

  Sharing a song, or a recipe, or a story.

  That is enough.

  I am a philosopher.

  That means I think about how we talk to each other.

  I think about how we meet.

  There is something I call 'the greeting problem'.

  Here is what it is.

  To say hello to anyone, you must make a guess.

  You guess how they like to be addressed.

  You guess what they might understand.

  You guess what matters to them.

  We cannot start from zero.

  We need a starting point.

  Tonight offers us starting points.

  These displays are guesses.

  They say, 'People from here might like this.'

  'This is a song sung there.'

  'This is a colour used there.'

  There is nothing wrong with a guess.

  We need them to begin the conversation.

  The trouble starts when we treat the guess as a fact.

  The trouble starts when we think the guess is the whole story.

  If I meet you and I say, 'I know what you are like,' the conversation ends.

  I have closed the door.

  If I meet you and I say, 'I wonder if you like this,' the door opens.

  You can tell me I am right.

  Or you can tell me I am wrong.

  Either way, we are talking.

  That is what this evening is for.

  It is not about defining who we are.

  It is about offering a hand.

  It is about putting something on the table so we can look at it together.

  Some of us have families who have been here for generations.

  Some of us arrived recently.

  Some of us are the only ones in this school from our home country.

  That mix is our strength.

  But only if we keep our expectations light.

  When you walk around tonight, look at the displays.

  Take the guess offered to you.

  But hold it lightly.

  If a child tells you about their country, listen.

  If they tell you they do not know much about it, listen to that too.

  Both are true.

  We are not here to learn statistics.

  We are not here to memorise facts about national character.

  There is no such thing as a single character for a whole nation.

  There are only people.

  There are only families.

  There are only the stories we choose to share.

  So, let us enjoy the food.

  Let us watch the dances.

  Let us look at the posters.

  But let us remember the most important part of the evening.

  It is not the display.

  It is the correction.

  It is the moment a child says, 'Actually, we do it this way.'

  It is the moment a parent says, 'In my experience, it is different.'

  That is where the learning happens.

  That is where the community grows.

  We make a guess.

  We offer a greeting.

  And then we let each other be who we are.

  Thank you for your work.

  Thank you for your openness.

  And now, please enjoy the evening.
