answer: |-
  This is a remarkably precise set of problems. You have correctly identified that the standard "Twin Earth" thought experiment (Putnam, 1975) is synchronic (two communities at one time), whereas your cases are diachronic (one community over time) and mereological (concerning the composition of the stuff itself).

  Here is an analysis of your situation, argued out from first principles of the philosophy of language and metaphysics, constrained by your field conditions.

  ### 1. Naming and Unity of the Phenomenon

  **Does it have a name?**
  There is no single, canonical label for this specific configuration in the standard literature. It is not "Twin Earth," nor is it standard "Semantic Change." The closest established concept is **"Slow Switching."**

  *   **Slow Switching:** Originally discussed in epistemology (by philosophers like Jessica Brown and Tyler Burge), this describes a speaker who moves from one linguistic environment to another (e.g., Earth to Twin Earth) without realizing it. The question is whether their concepts change immediately, gradually, or never.
  *   **Your Variation:** Your cases are **"Environmental Slow Switching"** or **"Substratal Drift."** The environment moves around the speakers, rather than the speakers moving through environments.

  **Are your four cases one phenomenon?**
  **Confidence: High.**
  Yes, they are instances of a single underlying problem: **The Decoupling of Causal History from Phenomenal Stability.**
  In all four cases, the *causal source* of the term (the original sample, the aquifer, the synthesis) diverges from the *phenomenal profile* (what the speakers see, taste, and describe) and the *current causal chain* (what they are actually touching now).
  *   Case 1 is **Causal Discontinuity** (the original source is gone).
  *   Case 2 is **Causal Drift** (the source changes gradually).
  *   Case 3 is **Causal Ambiguity** (the source is composite).
  *   The Lab Variant is **Causal Purification** (the source is refined).

  They all ask the same question: *Does the meaning of a natural kind term track the historical origin of the sample, the current physical constitution of the sample, or the stable observable properties of the sample?*

  ### 2. Differentiation from Established Concepts

  You asked how these cases differ from standard categories. Here is the breakdown.

  **A. Ordinary Vagueness**
  *   *Concept:* A term has fuzzy boundaries (e.g., "bald," "heap").
  *   *Difference:* Vagueness is about *how much* or *how many* counts as an instance. Your Case 2 looks like vagueness (a Sorites paradox), but it is deeper. In vagueness, the *criteria* are fuzzy. In your Case 2, the criteria (clear, drinkable water) remain sharp, but the *ontology* underneath shifts. It is not "how much water makes it *mbula*?" but "is *this* water *mbula*?"
  *   *Fit:* Poor. Vagueness tools cannot resolve the ontological shift.

  **B. Ordinary Ambiguity**
  *   *Concept:* A word has two distinct meanings (e.g., "bank" of a river vs. "bank" for money).
  *   *Difference:* Ambiguity implies speakers could, in principle, distinguish the senses. In your cases, the speakers sincerely believe there is only one substance. There is no psychological distinction to map.
  *   *Fit:* None. This is not ambiguity; it is **reference indeterminacy**.

  **C. Straightforward Change of Meaning**
  *   *Concept:* Words evolve over centuries (e.g., "deer" once meant any animal, now a specific ruminant).
  *   *Difference:* Standard semantic change usually involves a shift in *usage* or *description* acknowledged by speakers. In your cases, usage and description are constant. The change is entirely external to the speakers' minds.
  *   *Fit:* Low. This is **silent reference shift**, not semantic change.

  **D. Reference Failure (Empty Terms)**
  *   *Concept:* A term refers to nothing (e.g., "phlogiston," "unicorn").
  *   *Difference:* In Case 1, the original spring is gone, so if the term refers to the spring, it is empty. But speakers are successfully communicating about *something* (the ordinary water). The term isn't failing; it's potentially misfiring.
  *   *Fit:* Partial. Case 1 risks reference failure, but Cases 2 and 3 do not.

  **E. Deference to Experts**
  *   *Concept:* Speakers mean whatever the experts say they mean (e.g., I use "elm" correctly even if I can't identify an elm, because I defer to botanists).
  *   *Difference:* In your field site, there *are* no experts. There is no division of linguistic labor. The "authority" is the environment itself.
  *   *Fit:* Critical Distinction. This removes the "social fix" for reference. The burden falls entirely on the relation between word and world.

  ### 3. Theoretical Verdicts on Your Cases

  Here is how the three main families of semantic theory would handle your specific cases. I will argue their positions out.

  **Theory A: Descriptivism (The Traditional View)**
  *   *Core Claim:* A word means whatever description the speaker associates with it (e.g., *mbula* = "the clear, drinkable liquid in the springs").
  *   *Verdict on Case 1 (Dried Spring):* The word means the ordinary water. The description fits the current water. The history of the spring is irrelevant.
  *   *Verdict on Case 2 (Shifting Aquifer):* No change in meaning. As long as the water looks and tastes the same, it is *mbula*. The chemical shift is invisible and therefore semanticallly inert.
  *   *Verdict on Case 3 (Mixture):* The word means "liquid fitting the description." Since the mixture fits the description, the reference is settled.
  *   *Critique:* This violates the intuition that natural kind terms track *stuff*, not just descriptions. If we discovered the water was actually nanobots, Descriptivism says it's still water; intuition says it's not.
  *   *Confidence:* High that this is their verdict; Medium that it is the *correct* verdict.

  **Theory B: Causal-Historical Theory (Kripke/Putnam)**
  *   *Core Claim:* A word is fixed by an initial "baptism" of a sample. Reference is passed down a chain of communication. The word refers to whatever shares the same underlying nature (essence) as the original sample.
  *   *Verdict on Case 1:* **Reference Failure or Error.** The original baptism was the unique spring sediment ($X$). Current water is ($Y$). Since $X \neq Y$, speakers are wrong when they call ordinary water *mbula*. They are referring to nothing, or referring to $X$ which no longer exists.
  *   *Verdict on Case 2:* **The Threshold Problem.** This theory struggles here. If reference is fixed by the original sample, does the reference "drag" along as the aquifer shifts?
      *   *Strict View:* Reference is fixed at $T_0$. If the water at $T_{40}$ is chemically distinct, it is not *mbula*, even if the chain is unbroken.
      *   *Flexible View:* The causal chain tracks the *source*. If the source shifts gradually, reference shifts. But this requires a threshold, which the theory lacks resources to define.
  *   *Verdict on Case 3:* **Indeterminacy.** If the original sample was a mixture, the "essence" is disjunctive ($X$ or $Y$) or the theory cannot decide.
  *   *Critique:* This preserves the "scientific" intuition but makes speakers systematically mistaken about their own environment.
  *   *Confidence:* High on the verdict for Case 1; Low on the verdict for Case 2 (this is a known weakness of the theory).

  **Theory C: Homeostatic Property Cluster (HPC) (Richard Boyd)**
  *   *Core Claim:* Natural kinds are not defined by rigid essences but by clusters of properties that tend to co-occur and remain stable over time due to underlying homeostatic mechanisms.
  *   *Verdict on Case 1:* The kind is defined by the stable cluster of properties (drinkable, clear, local). If the spring dries up but the cluster persists in other water, the term survives.
  *   *Verdict on Case 2:* **Best Fit.** HPC allows for gradual change. As long as the *cluster* of observable properties remains stable (even if the chemical substrate shifts), the kind persists. There is no sharp threshold; there is only a point where the homeostasis breaks.
  *   *Verdict on Case 3:* The mixture *is* the kind. If the mixture is stable and the properties cluster around that mixture, the reference is settled on the mixture itself.
  *   *Critique:* This is the most pragmatic for a lexicographer, but it risks making "kindhood" too dependent on human observation rather than objective reality.
  *   *Confidence:* High that this handles Case 2 best.

  ### 4. Epistemic Consequences

  **What can speakers know about their own meanings?**
  This is the most disturbing implication for your work.
  If **Externalism** (Causal or HPC) is true, **speakers do not have privileged access to their own meanings.**

  *   In Case 2, the speakers believe they mean "water from the ancestral aquifer." If the aquifer has shifted, Externalism says they actually mean "water from the new aquifer" (or nothing).
  *   Since the shift is invisible to them, **they cannot know what they mean without doing chemistry.**
  *   This contradicts the intuition that I know what I mean by my words just by thinking about them. In your field site, meaning is partially constituted by facts outside the speakers' heads (the chemical composition of the ground).
  *   **Consequence for Lexicography:** You cannot rely on speaker introspection ("What does this word mean?") to fix reference. You must treat the dictionary entry as a hypothesis about the external world, not just a record of internal concepts.

  ### 5. Coining a Term: "Substratal Drift"

  Since no existing label fits perfectly, I propose you treat this as **"Substratal Drift."**

  **Definition:** Substratal Drift occurs when the extension of a natural kind term shifts due to changes in the physical constitution of the referent, without corresponding changes in the speakers' descriptive criteria or awareness.

  **Boundary Cases:**
  *   **Clear Instance (Center):** Your Case 2. The stuff changes gradually; speakers don't notice; usage remains constant.
  *   **Clear Non-Instance (Edge):** A community learns that their "gold" is actually pyrite and stops using the word for pyrite. This is *correction*, not drift, because speaker knowledge changed.
  *   **Edge Case:** A ritual term for "sacred ash" where the ash comes from different plants each year. Here, the *function* fixes the reference, not the substrate. This is not Substratal Drift; it is Functional Reference.

  ### 6. Confidence and Uncertainty

  **Confidence Ratings:**
  *   **Distinction from Twin Earth:** **High Confidence.** Your cases are diachronic/environmental; Twin Earth is synchronic/social. This is a robust distinction.
  *   **Descriptivist vs. Causal Verdicts:** **High Confidence.** I am certain these theories *would* give the verdicts I outlined above, as these follow from their core axioms.
  *   **HPC Handling of Case 2:** **Medium-High Confidence.** HPC is designed for this, but applying it to unwritten languages without expert classification is theoretically messy.
  *   **Existence of a Canonical Name:** **High Confidence.** There is no single standard term like "The Gettier Problem" for this specific cluster. "Slow Switching" is the nearest neighbor.

  **The Point of Least Certainty:**
  I am least sure about **the threshold question in Case 2 under Causal-Historical theory.**
  *   *Why:* There is a niche debate in metaphysics about "constitution" vs. "identity." If the water in the well is replaced molecule by molecule over 40 years (like the Ship of Theseus), does the *reference* replace itself? Some causal theorists argue the reference is fixed to the *source location*, not the *chemical makeup*. If the location is the same, the reference might hold even if the chemistry changes. I have extrapolated from the standard "essence" view, but a sophisticated causal theorist might argue the *location* is the rigid designator, not the *liquid*.
  *   *Risk:* If the location fixes the reference, Case 2 dissolves—the word always means "water from this hole," regardless of chemistry. This would invalidate the "drift" diagnosis. However, given your description that speakers treat it as "the same stuff" (implying a kind, not a location), the chemical essence view is more likely applicable.

  ### Summary Recommendation for Your Dictionary

  1.  **Do not treat the entry as fixed.** Mark *mbula* as having **referential instability**.
  2.  **For Case 1:** Note the historical origin (the spring) but define the current extension as the ordinary water, marking the discrepancy in an ethnographic note. This aligns with actual usage (Descriptivism/HPC) while acknowledging the history (Causal).
  3.  **For Case 2:** Do not attempt to set a threshold. Define the term by the **stable phenomenal cluster** (taste, use, appearance) rather than the chemical substrate. This avoids the trap of claiming a fact of the matter where there may be none.
  4.  **For Case 3:** Define the term as applying to the **mixture**. Do not attempt to disambiguate.

  You are documenting not just a language, but the friction between a stable language and an unstable world. "Substratal Drift" is the phenomenon.
