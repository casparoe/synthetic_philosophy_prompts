answer: |-
  ### Civics Final Examination: Comparative Government
  **Section C: Extended Response**
  **Time Allowed:** 45 Minutes
  **Suggested Word Count:** Approx. 800 words

  **Question:**
  In many modern constitutional monarchies, the Head of State retains formal legal powers that are, by political convention, never independently exercised. This phenomenon is known as **dormant sovereignty**. While the monarch does not actively rule, the legal existence of these powers can reshape ministerial behavior and democratic accountability.

  Select **two** of the following systems: **The United Kingdom, The Scandinavian Monarchies (e.g., Sweden or Norway), or Japan.**

  Write an essay that argues whether the arrangement of dormant sovereignty ultimately **strengthens** or **weakens** the principle of popular sovereignty in these democracies. Do not merely describe the powers of each monarch; instead, analyze how the *potential* for monarchical intervention influences the behavior of elected officials and the clarity of democratic responsibility. Your response must take a clear argumentative position.

  ***

  ### Model Answer

  The concept of dormant sovereignty presents a paradox within modern democracies: unelected officials retain legal authority they are forbidden to use. While critics argue this contradicts popular sovereignty, a closer analysis of the United Kingdom and Sweden suggests that dormant sovereignty ultimately strengthens democratic stability. By separating the legal source of authority from the political exercise of power, these systems insulate the state from partisan volatility while forcing elected ministers to assume full responsibility for governance.

  In the United Kingdom, the Crown retains the Royal Prerogative, including the power to dissolve Parliament and appoint Prime Ministers. Legally, the Monarch could refuse a dissolution; conventionally, they never do. This dormancy is not a failure of democracy but a mechanism of accountability. Because the Monarch cannot politically justify their actions, any exercise of power must be advised by a minister. Consequently, the dormancy of the Crown forces "ministerial responsibility." If a controversial order is issued, it bears a minister's signature, not the King's. This ensures that elected officials cannot hide behind the neutrality of the state. The dormant power acts as a constitutional backstop; its mere existence reminds ministers that they are servants of the state, not owners of it, without allowing the Monarch to interfere with the will of the electorate.

  Similarly, in Sweden, the 1974 Instrument of Government removed all political power from the Monarch, yet the Crown remains the formal Head of State. Unlike the UK, where reserve powers are dormant, Swedish royal powers are legally extinguished regarding governance. However, the "dormancy" here exists in the symbolic legitimacy the Crown provides. The Swedish Monarch opens the Riksdag and signs laws, acts that are purely formal. This arrangement strengthens popular sovereignty by providing a non-partisan symbol of national continuity that elected politicians cannot manipulate for short-term gain. The dormancy of Swedish royal power ensures that the legitimacy of the state is distinct from the popularity of the government. If the government fails, the state remains intact.

  Comparing these systems reveals that dormant sovereignty functions as a "shock absorber" for democracy. In both the UK and Sweden, the existence of a non-political Head of State clarifies the lines of accountability. In republics, the Head of State is often a politician, blurring the line between government and state. In these monarchies, the dormancy of royal power ensures that all political blame and credit attach solely to elected ministers. The Monarch's inability to act independently means they cannot obstruct the popular will, yet their formal presence prevents elected leaders from claiming total ownership of the state apparatus.

  Therefore, dormant sovereignty strengthens popular sovereignty rather than weakening it. It creates a system where the legal authority of the state is permanent, but the political authority is entirely temporary and accountable. The "threat" of monarchical power is nullified by convention, leaving only the benefit of a neutral arbiter. As long as conventions hold, the dormant monarch ensures that democratic accountability remains sharp, as elected officials have no royal shield behind which to hide. The arrangement does not deny the people's will; it safeguards the institutions through which that will is exercised.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Conceptual Move 1: Distinguishing Legal Form from Political Convention (5 Marks)**
  *   **Excellent:** Explicitly explains that while the *law* may grant power, *convention* restricts it, and analyzes why this gap matters (e.g., the UK Royal Prerogative vs. convention).
  *   **Competent:** Describes the powers but treats law and convention as the same thing, or lists them without explaining the tension.
  *   **Typical Misconception:** Believing the Monarch actually chooses the Prime Minister or that the powers are legally abolished rather than conventionally dormant.

  **Conceptual Move 2: Explaining the Effect on Ministerial Responsibility (5 Marks)**
  *   **Excellent:** Analyzes how dormant sovereignty forces elected ministers to take blame/credit (e.g., "The Minister advises, therefore the Minister is responsible").
  *   **Competent:** States that ministers run the government but fails to link this to the Monarch's dormancy.
  *   **Typical Misconception:** Assuming the Monarch shares responsibility for government decisions or that the Monarch protects ministers from blame.

  **Conceptual Move 3: Assessing Impact on Popular Sovereignty (5 Marks)**
  *   **Excellent:** Takes a position on whether the arrangement helps or hurts the "will of the people" (e.g., argues it protects state neutrality vs. arguing it is undemocratic).
  *   **Competent:** Defines popular sovereignty but does not apply it to the monarch's role.
  *   **Typical Misconception:** Equating "popular sovereignty" strictly with "having a President," failing to see how a neutral monarch can support democratic will.

  **Conceptual Move 4: Nuanced Comparative Analysis (5 Marks)**
  *   **Excellent:** Compares the *function* of dormancy in both nations (e.g., UK reserve powers vs. Swedish symbolic acts) rather than just listing institutional differences.
  *   **Competent:** Describes Country A, then describes Country B, with a weak concluding sentence linking them.
  *   **Typical Misconception:** Treating all monarchies as identical or focusing on historical differences irrelevant to the function of dormancy.

  **Conceptual Move 5: Argumentative Consistency and Thesis (5 Marks)**
  *   **Excellent:** Maintains a clear thesis (Strengthens OR Weakens) throughout the essay, with every paragraph supporting that claim.
  *   **Competent:** Has a thesis in the introduction but drifts into description or neutrality in the body paragraphs.
  *   **Typical Misconception:** Writing a "balanced" essay that refuses to take a side, resulting in a descriptive report rather than an argument.
