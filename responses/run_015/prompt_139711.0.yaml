      *Give Real Veto:* Responsibility shifts to nurse.

      *Objection:* "Hospital is responsible."
      *Honesty:* This solves compensation, not responsibility. It's a cost-spreading mechanism, not a moral account.

      *Stipulation Check:* Yes, relies on perfect compliance. If nurse missed one, she's negligent. If vendor code bug, they're negligent. The gap is in the *structural interaction* of compliant actors.

  8.  **Final Review against Constraints:**
