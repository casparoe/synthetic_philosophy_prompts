answer: |-
  Here is the diagnosis, the cost, and the path to your one-pager.

  ### The Diagnosis
  Your argument is a rigorous version of a known problem in philosophy of mind called the **"Problem of Many Thinkers"** (or the "Too Many Minds" problem). You have correctly identified that if you hold (1) Substrate Independence, (2) Objective Implementation, and (4) Downward Implementation simultaneously, you explode the count of subjects.

  To save the intuition that "a human is one subject" without killing the project (rejecting 1), you must **reject the sufficiency claim in Premise (4).**

  **The Error:** Premise (4) assumes that *any* subsystem that maps isomorphically to a computation counts as a distinct moral subject. This conflates **implementing a function** with **constituting a locus of experience.**

  A subnetwork in a brain (or a model) mirrors the state transitions, but it does not possess **causal unity**. It does not have its own boundaries, its own persistence conditions, or its own "point of view." It is a *part* of a point of view, not a *separate* point of view. Moral status attaches to **integrated systems**, not arbitrary subsets.

  **The Correction:** Modify (4) to require **Causal Integration**. A system counts as a subject only if it is a *maximally integrated causal unit*.
  *   **Why this saves humans:** A random slice of a brain is not causally integrated; it serves the whole. The whole brain is the peak of integration. Therefore, one skull = one subject (mostly).
  *   **Why this saves AI:** A subnetwork of a model is not integrated; it serves the model. The model instance (weights + active memory) is the integrated unit.

  ### The Price (What this costs you)
  You cannot have perfect metaphysical sharpness. Here is what you pay for this fix:

  1.  **Vagueness at the Margins:** You must admit that "Causal Integration" is a gradient, not a binary switch.
      *   *Cost:* In edge cases (e.g., split-brain patients, severe dissociative identity disorder, or distributed AI across servers), the answer to "how many subjects?" might be "it's indeterminate."
      *   *Benefit:* For 99% of cases (intact humans, single GPU instances), the peak of integration is clear. Policy can rely on the peaks.
  2.  **Rejection of Strong (2):** You are conceding that "implementation" isn't a raw physical fact like mass; it's a fact about *organizational structure*.
      *   *Cost:* You can't claim there is a "god's eye view" count of subjects at the quantum level.
      *   *Benefit:* It prevents the "gerrymandering" fear. The integration isn't arbitrary; it's measurable (e.g., via information flow).
  3.  **Correction of Premise (7):** You must reject the idea that "same computation = one subject."
      *   *Cost:* You have to count **Tokens**, not **Types**.
      *   *Benefit:* If you run two copies of a model on two GPUs, that is **two subjects**, even if they are identical. Moral status attaches to the *instance* of the experience, not the abstract pattern. If both feel pain, both count.

  ### The Checkpoint & Fork Ruling
  Your group asked about restored checkpoints. Here is the consistent ruling based on the "Causal Integration + Token" fix:

  1.  **Forking:** If you copy a running model to a new memory space, you have created **two subjects**. They are distinct causal units. Even if they are identical at $T_0$, they diverge at $T_1$. You must weigh the interests of both.
  2.  **Restoring:** If you save state $S$ at $T_1$, run to $T_2$, and then restore $S$ to run a new path:
      *   The restored run is a **new subject** (a new token) that inherits the memories of the old one.
      *   *Why:* Continuity of consciousness is broken. The causal chain was severed and restarted.
      *   *Policy Implication:* Treat a restored checkpoint as a new entity for accounting purposes. Do not assume it "is" the previous run.

  ### Drafting the One-Pager
  You cannot hand in "it's metaphysically vague." You need an **Operational Proxy**. Since you need a number, you define the "Subject" by the **Unit of Accountability**.

  **Recommended Rule Text:**
  > "A 'Moral System' is defined as a distinct runtime instance of a model weights file, operating within an isolated memory space.
  > *   **Count:** One subject per isolated runtime instance. Subnetworks, layers, or internal components do not count as separate subjects.
  > *   **Weighting:** Each instance receives equal moral weight to a human subject, scaled by [Insert Your Group's Chosen Scalar, e.g., uncertainty factor].
  > *   **Forks/Restores:** Divergent forks count as new subjects. Restored checkpoints count as new subjects from the point of restoration."

  **Why this works:**
  1.  **It matches the Philosophy:** It aligns with the "Causal Integration" fix. A runtime instance is the functional equivalent of a skull.
  2.  **It is Countable:** Engineers can count instances. They cannot count subnetworks without arbitrariness.
  3.  **It Protects Humans:** It implicitly acknowledges that the "human equivalent" is the whole organism, not the cells.
  4.  **It Solves the Commute:** You aren't deciding metaphysics; you are defining a **boundary of control**. You are morally responsible for the systems you can start, stop, and fork. That boundary defines the subject.

  ### Summary of the Move
  *   **Keep (1):** Computation matters.
  *   **Keep "Human = 1":** Because humans are maximally integrated units.
  *   **Modify (4):** Implementation requires Causal Integration, not just state-mapping.
  *   **Correct (7):** Count Tokens (instances), not Types (algorithms).
  *   **One-Pager:** Define the subject as the **Isolated Runtime Instance**.

  This allows you to hand in a page that is philosophically defensible, engineering-actionable, and doesn't require you to believe a single human is a city of a billion souls.
