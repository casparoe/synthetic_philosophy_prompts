prompt: |-
  Right, so — context, because I think it changes what the document needs to do. My friend Dev and I have been going round and round on this for something like three years, usually after meetup drinks, and we've finally agreed to stop relitigating and actually do an adversarial collaboration properly. We're both deep in the digital-minds / "which computations matter" space in the way people are around here, and we've long since agreed on the boring bits: a faithful neuron-by-neuron emulation of a human is a moral patient, a rock isn't, substrate-independence is basically right, and the word "computation" on its own isn't going to do any work for us. The live dispute is this. Dev's camp — call them the structuralists — thinks there's a mind-independent fact of the matter about which computation a physical system implements, fixed by its causal/counterfactual structure at some privileged grain, and that once we have the right theory of what functional-cum-phenomenal profile matters, every system gets a determinate answer, including the weird ones. My camp — call us the attributionists — thinks implementation claims are description-relative, that there's no natural kind waiting to be found at the boundary of sentience, and that in the borderline cases whether there's a subject there at all partly depends on whether a subject can be intelligibly attributed to the thing: on the grip our interpretive practices get, the repertoire we could take up a stance towards, and what we're doing when we count something as a someone. We're not saying anything goes; attribution is constrained. But we think some of these cases are indeterminate in a way that isn't merely epistemic, and Dev thinks that's cowardice dressed up as metaphysics. I've read all the standard stuff on both sides, so please don't pad the answer with a reading list or citations — I can't follow them up and I don't need them.

  You're a professional philosopher who's spent real time on the ethics of artificial sentience and on implementation questions, and I want you to draft the joint statement we could both actually sign. Before you write it, brainstorm a bit on where the real cruxes are — I don't want "we need a completed theory of consciousness, then we'll see" as an answer, and I don't want a list of nine cruxes when there are three. Then give me: a numbered section of agreed claims that isn't vacuous (the things we'd both defend if someone pushed back on them, including about what the standard neuron-swap thought experiment does and doesn't establish, and about the "any physical system implements any computation if you pick the right mapping" style worry); a disagreements table in which each row states Dev's position in wording Dev would accept and mine in wording I'd accept, with a note on whether the row is a genuine disagreement or just a clash over the words "computation", "sentience", or "matters"; and then, for each crux, the case, argument, or future piece of evidence we'd both agree bears on it, with each side's prediction written down in advance so neither of us can wriggle later.

  The cases I keep coming back to, which I'd want the cruxes to cash out in: the shrink ray (we take an emulation and coarsen it step by step — drop spike timing, then firing rates, then whole brain regions replaced by fitted black boxes that reproduce behaviour — and somewhere it stops mattering, or doesn't); the census problem (ten thousand identical copies of one emulation run in parallel and kept in lockstep — one subject, ten thousand, or a question with no answer); the rollback case (an emulation restored from a checkpoint a thousand times, each time living the same thirty seconds); the dormancy family (weights sitting on disk and never run; a system evaluated lazily so most of its states are never actually computed but would be if queried; a memoised life read off a precomputed lookup table); the splice case (one emulation whose computation is split across two datacentres with a slow link between them); the clock-rate case (the same emulation run at a thousand times real speed); and the stub cases at the bottom of the ladder, where I think the structuralists owe us something better than "very slightly". If you think a crux is in-principle unresolvable, say so and say what we should do with that fact rather than whether we should keep arguing. Please write it in British English.
