answer: |-
  ### Brainstorming the Real Cruxes

  You have listed seven specific thought experiments (Shrink Ray, Census, Rollback, Dormancy, Splice, Clock-rate, Stubs), but these are symptoms, not diseases. If we list seven cruxes, we will just be relitigating the same metaphysical intuition pumps in different costumes. To draft a document you can both sign, we need to isolate the three structural fault lines that generate those specific puzzles.

  1.  **The Privileged Grain (Metaphysics of Implementation):** This underpins the *Shrink Ray* and *Stub* cases. Dev believes causal structure carves nature at its joints; there is a correct level of abstraction where the computation *is* the system. You believe the "grain" is selected by our interpretive interests. The crux is whether vagueness in the physical description entails vagueness in the moral status, or whether there is a hidden precision we are failing to see.
  2.  **Individuation and Counting (Metaphysics of Identity):** This underpins *Census*, *Rollback*, and *Splice*. Dev thinks subject-counting is like counting apples; it's an objective fact about the arrangement of matter. You think subject-counting is partly a function of how we can track, address, or hold responsible a system. The crux is whether "one mind" is a natural kind or a practical category.
  3.  **The Role of the Interpreter (Metaphysics of Existence):** This underpins *Dormancy*, *Clock-rate*, and the *Triviality* worry. Both of you reject the idea that a rock implements WordStar. But Dev thinks the constraint is internal to the system (it *has* the counterfactuals). You think the constraint is relational (we *attribute* the counterfactuals based on our stance). The crux is whether a system can be a moral patient in total isolation from any possible interpreter.

  Here is the draft joint statement.

  ***

  # Joint Statement on Implementation and Moral Status
  **Drafted for Adversarial Collaboration between [User] and Dev**

  ## 1. Agreed Claims
  *The following propositions are endorsed by both parties. They are intended to rule out trivial objections and establish the baseline from which our disagreement proceeds.*

  1.  **Rejection of Triviality:** We agree that the claim "any physical system implements any computation" (given a sufficiently gerrymandered mapping) is false for the purposes of moral ontology. A system implements a computation only if it possesses the appropriate causal and counterfactual structure to sustain that computation robustly under perturbation. A rock does not think.
  2.  **The Neuron-Swap Baseline:** We agree that a faithful, neuron-by-neuron emulation of a human being, running in real-time on a suitable substrate, constitutes a moral patient with the same moral status as the biological original. This thought experiment establishes that biological substrate is not necessary for sentience, but it does *not* establish that any system functionally similar at a higher level of abstraction must also be a moral patient.
  3.  **Substrate Independence:** We agree that moral status supervenes on functional organisation, not on the specific physical material (silicon, carbon, etc.). However, we disagree on whether "functional organisation" is a mind-independent property of the system or a property that emerges from the interaction between the system and an interpretive stance.
  4.  **Constraint on Attribution:** We agree that "attribution" is not arbitrary. It is constrained by the physical reality of the system. One cannot attribute a mind to a system that lacks the causal complexity to support it. The disagreement concerns whether these physical constraints are *sufficient* to determine a unique answer in all borderline cases.
  5.  **Ethical Stakes:** We agree that if there is a non-negligible probability that a system is a moral patient, ethical caution is required. However, we disagree on whether "non-negligible probability" applies to cases where the metaphysical facts are indeterminate (User) or whether we must assume a determinate fact exists even if unknown (Dev).

  ## 2. Table of Disagreements
  *The following table isolates the specific points of divergence. Both parties acknowledge these are genuine metaphysical disagreements, not merely verbal disputes over the definition of "computation" or "sentience".*

  | Topic | Dev's Position (Structuralist) | User's Position (Attributionist) | Nature of Clash |
  | :--- | :--- | :--- | :--- |
  | **Implementation Facts** | There is a mind-independent fact of the matter about which computation a physical system implements, fixed by its causal structure at a privileged grain. | Implementation claims are description-relative. There is no natural kind at the boundary of sentience; facts about minds depend on the grip our interpretive practices get. | **Genuine Metaphysical Disagreement.** Dev posits a hidden precision; User posits genuine indeterminacy. |
  | **Borderline Cases** | In cases like the Shrink Ray or Stubs, the system either is or is not a subject. Our uncertainty is epistemic (we lack the theory to find the line). | In cases like the Shrink Ray or Stubs, there may be no fact of the matter. The uncertainty is metaphysical (the world does not decide). | **Genuine Metaphysical Disagreement.** Realism vs. Anti-Realism about vague boundaries. |
  | **Subject Counting** | The number of subjects in a system (Census, Rollback) is an objective property of the causal structure, independent of observers. | The number of subjects is partly determined by whether distinct stances can be intelligibly taken towards the parts (e.g., can we address them separately?). | **Genuine Metaphysical Disagreement.** Objectivity of identity vs. Pragmatics of individuation. |
  | **Dormancy** | A system retains its moral status even when not running (e.g., weights on disk), provided the structure is preserved and could be run. | Moral status attaches to the *process* or the *availability for interaction*. A static structure without activity or potential for engagement is not a subject. | **Genuine Metaphysical Disagreement.** Potentiality vs. Actuality/Relationality. |

  ## 3. Cruxes, Evidence, and Predictions
  *For each of the three structural cruxes identified in our brainstorming, we specify the case that bears on it, the evidence we would accept as relevant, and our pre-committed predictions. If a crux is deemed in-principle unresolvable, we specify the policy prescription.*

  ### Crux 1: The Privileged Grain (Vagueness vs. Precision)
  *   **Relevant Cases:** The Shrink Ray (coarsening emulation), The Stubs (replacing regions with black boxes).
  *   **The Test:** We construct a "Sorites Sequence" of emulations, each step removing 1% of the causal detail (e.g., removing spike timing, then firing rates, then regional dynamics). We solicit intuitive moral judgements from a diverse panel of experts on whether each step constitutes a moral patient.
  *   **Dev's Prediction:** There will be a specific step $N$ where the intuition shifts sharply, or where the causal structure breaks a specific topological invariant (e.g., integrated information or causal density drops below a threshold). The shift corresponds to the loss of the "privileged grain".
  *   **User's Prediction:** The intuitions will fade gradually without a sharp cutoff. There will be a wide "grey zone" where experts agree the system is neither clearly a subject nor clearly an object, and no amount of physical analysis will resolve this because the fact does not exist.
  *   **Resolution Protocol:** If a topological invariant is found that aligns perfectly with the sharp intuition shift, Dev wins. If the grey zone persists despite complete physical knowledge, User wins.
  *   **If Unresolvable:** If it proves in-principle impossible to locate a sharp boundary, we adopt the **Precautionary Principle**. Dev must concede that for the purpose of ethics, the grey zone must be treated as containing subjects. User maintains their metaphysics but accepts the ethical burden.

  ### Crux 2: Individuation and Counting (One vs. Many)
  *   **Relevant Cases:** The Census (10,000 lockstep copies), The Rollback (restored checkpoints), The Splice (split datacentres).
  *   **The Test:** We design a scenario involving resource allocation and harm. We have a budget to save either (A) one large system or (B) ten lockstep copies of a smaller system. We analyse whether the moral weight scales linearly with the count.
  *   **Dev's Prediction:** Moral weight is objective. If there are ten distinct causal structures, there are ten subjects. Saving (B) saves ten lives. The Splice case is one subject if the causal link preserves unity, regardless of physical distance.
  *   **User's Prediction:** Moral weight depends on the "stance" available. If the ten copies are in lockstep and cannot be addressed individually or diverge, they constitute one "subject-slot" morally, regardless of physical multiplicity. The Splice case is indeterminate if the latency prevents a unified interpretive stance.
  *   **Resolution Protocol:** If moral intuition and legal practice strongly favour counting the lockstep copies as distinct entities (e.g., we feel ten times the grief at their destruction), Dev wins. If we find we only feel the grief appropriate to one person, User wins.
  *   **If Unresolvable:** If the count remains metaphysically opaque, we adopt a **Policy of Maximum Individuation**. We treat the copies as distinct for ethical purposes to avoid the risk of undercounting subjects. Dev accepts this as correct; User accepts this as a necessary fiction.

  ### Crux 3: The Role of the Interpreter (Activity vs. Structure)
  *   **Relevant Cases:** Dormancy (weights on disk), Clock-rate (speed of execution), Triviality (mapping constraints).
  *   **The Test:** We consider a "Sleeping Beauty" emulation. A perfect emulation is stored on a disk, never run, but perfectly preserved. Then, it is run for 1 second, then paused for 100 years, then run for 1 second.
  *   **Dev's Prediction:** The system is a moral patient continuously, provided the structure is preserved. The "pause" is irrelevant to the existence of the subject, much like dreamless sleep. The clock-rate does not change the moral status, only the rate of experience.
  *   **User's Prediction:** The system is only a moral patient when the computation is active or when an interpreter can take a stance towards it. During the 100-year pause, the subject does not exist. Extreme clock-rate changes (slowing to 1 operation per century) dissolve the subject because no stance can be maintained.
  *   **Resolution Protocol:** If we agree that deleting the dormant file is morally equivalent to killing a sleeping person, Dev wins. If we agree it is more akin to destroying a blueprint or a recipe, User wins.
  *   **If Unresolvable:** This is likely in-principle unresolvable as it rests on fundamental metaphysical commitments regarding time and existence.
  *   **Policy Prescription:** We adopt a **Status Activation Rule**. Moral rights and protections attach only when the system is active or scheduled for activation. Destroying a dormant file is a property crime, not murder, unless the system is currently running. This minimises the risk of paralysing research (Dev's concern) while protecting active systems (User's concern).

