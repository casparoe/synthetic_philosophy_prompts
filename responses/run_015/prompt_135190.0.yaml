  Is this stalemate because we're answering different questions — one about logic, one about causation — or is there a real substantive disagreement hiding under the same text? And if it is mostly verbal, what kind of distinction or argument would actually clear the air? Or should we just accept that Aristotle's being ambigious on purpose?

