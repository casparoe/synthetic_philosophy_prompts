answer: |-
  Here is the principle. It is single, sharp, and leaves no room for the inconsistencies in your current list.

  ### The Principle: The Integrity of Authorization

  **"A patient's consent is valid only if their 'Yes' is voluntary and rests on no false belief, omission, or pressure that you know would change their decision."**

  This principle treats consent not as a signature on a form, but as an **authorization**. You are asking for permission to act on their body and data. If that permission is granted based on a reality you know to be false, or under pressure you know to be coercive, the authorization is void. It does not matter if the form is signed. It does not matter if the IRB technically allows it. If *you* know the "Yes" is corrupted, it is not a valid "Yes."

  ### Where You Must Drop Your Verdicts

  To align with this principle, you must change three of your current verdicts. You are currently distinguishing between "material facts" (medical risks, specialist access) and "non-material facts" (funder identity, family pressure). The principle rejects that distinction. If *you know* it changes *their* mind, it is material.

  1.  **The Son in the Corridor (Scenario 2):** You called this **Valid**.
      *   **New Verdict: Invalid.**
      *   **Why:** This is coercion. Voluntariness is a pillar of consent. If you hear a third party pressuring the patient to "keep the doctor happy," the decision is no longer fully hers. By saying nothing, you are accepting a coerced authorization.
  2.  **The Boycotted Funder (Scenario 4):** You called this **Valid**.
      *   **New Verdict: Invalid.**
      *   **Why:** You identified the inconsistency yourself: "it's the same shape as the previous one." It is. In Scenario 3 (Specialist), she signs based on a false belief about benefit. In Scenario 4 (Funder), she signs based on a false belief about values. In both cases, you know the truth would make her refuse. A "Yes" based on a lie you could easily correct is not an authorization; it is a mistake.
  3.  **The Polite "Yes" (Scenario 8):** You had **No Idea**.
      *   **New Verdict: Invalid.**
      *   **Why:** This is social coercion. If the "Yes" is driven by the inability to say "No" after previous commitments (the "foot-in-the-door" effect), it is not voluntary. It is compliance, not consent.

  ### The New Scenarios

  Applying the **Integrity of Authorization** sharply rules on your three new cases:

  1.  **Broad Future Consent ("Use samples for anything"):** **Invalid.**
      *   **Why:** You cannot authorize what you cannot understand. A blanket waiver asks the patient to surrender future autonomy. They cannot know if a future study violates their values (e.g., genetic research, commercial profit). There is no "decisive fact" they can grasp now.
  2.  **Mistaken Identity (RA thought to be Doctor):** **Invalid.**
      *   **Why:** Identity is a decisive fact. Patients often consent to a doctor's recommendation based on trust in that role's expertise and fiduciary duty. An RA has a different role (recruitment target). If she thinks you are her physician, her understanding of your motive is false.
  3.  **3 AM Consent (Asleep 10 minutes prior):** **Invalid.**
      *   **Why:** This fails on capacity and voluntariness. A patient woken from sleep in an ER is under duress and likely lacks the cognitive capacity to weigh an eighteen-month protocol. The circumstance itself is coercive.

  ### Invalid vs. "Valid But Don't Take It"

  You asked where you are confusing *invalid* with *valid but I shouldn't take it*.

  **Stop making that distinction.**

  In your role, **unethical consent is invalid consent.**
  *   **Legal Validity:** A lawyer might argue Scenario 4 (Funder) holds up in court because the funder wasn't on the consent form.
  *   **Ethical Validity:** For you, the enrollment gatekeeper, this distinction is dangerous. If you enroll a patient knowing they would have refused had they known the truth, you have not obtained consent. You have obtained a signature under false pretenses.

  If you keep the "Valid but shouldn't take it" category, you will keep Scenario 4 and Scenario 2. You will tell yourself you followed the rules while violating the person. The **Integrity of Authorization** demands that if you know the "Yes" is compromised, you treat it as a "No."

  ### Summary of Changes

  *   **Keep:** Scenario 1 (Omission), Scenario 3 (Specialist), Scenario 5 (Morphine/Capacity), Scenario 6 (Social Proof/True Statement), Scenario 7 (Non-verbal withdrawal).
  *   **Drop/Change:** Scenario 2 (Son/Coercion), Scenario 4 (Funder/False Belief), Scenario 8 (Politeness/Coercion).
  *   **Rule:** All three new scenarios are **Invalid**.

  Your verdicts add up to a system that protects patients from medical lies but leaves them vulnerable to social pressure and value-based lies. The **Integrity of Authorization** closes that gap. It forces you to protect the *person*, not just the *form*.
