prompt: |-
  I'm on the team that enrolls patients in a study in the emergency room, and I keep having to make judgment calls about when a signature is a real yes, so I want to know what my own verdicts add up to. Here they are.

  - She signs after I tell her the drug may cause headaches, and I leave out that in the pilot one in twenty had migraines bad enough to miss work. Not valid.
  - She signs, and I've overheard her son in the corridor telling her to just do it, it'll keep the doctor happy. I say nothing. Valid, I think, though it makes me uneasy.
  - She signs because she's picked up, wrongly, and I know it, that joining is the only way she'll get to see a specialist; she'd be referred either way and I don't correct her. Not valid, and I'd be at fault.
  - She signs believing the study is funded by a charity she supports. It's funded by a company she boycotts, we don't advertise the funder, and she'd refuse if she knew. Valid, I think — the funder isn't part of what she's agreeing to. But its the same shape as the previous one: a false belief I know about, decisive for her, that I leave alone.
  - She's on morphine and consents to one extra blood draw: fine. Same patient, same morphine, consents to the full eighteen-month protocol: not fine.
  - We tell her that most people in her situation take part, which is true and which we say partly because it works. She signs. Valid — I can't see how a true sentence invalidates anything, but it bugs me.
  - Six months in she clearly wants out: flinches, goes quiet, asks when it ends, keeps showing up, never says the words. I think her consent has lapsed even though she never withdrew it.
  - We re-ask every month as required and she says yes every time, but I'm fairly sure the only thing holding the yes up is that saying no after three yeses would feel rude. No idea what to say about this one.

  Is there one principle, or a short list, that gets all of these, stated sharply enough that it also rules on: consent given up front for samples to be used in any future study we like, consent given to a research assistant the patient takes to be a doctor, and a yes we get at 3am from someone who was asleep ten minutes earlier? Tell me too where I'm confusing invalid with valid but I shouldn't take it — I suspect some of these are that. And commit: give me one account, say which of my verdicts it forces me to drop, and don't hand me a menu or an it-depends. I'd rather lose two verdicts than end up with a principle that has eight clauses.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Patient enrollment team in an Emergency Room (ER) setting.
      *   **Task:** Evaluating the validity of informed consent in specific, ethically ambiguous scenarios.
      *   **Input:** Eight specific scenarios with the user's current verdicts (Valid/Not Valid/Unsure).
      *   **Additional Scenarios to Rule On:** Broad future consent, mistaken identity (RA vs. Doctor), 3 AM consent after sleep.
      *   **Constraint 1 (Crucial):** Provide *one* principle or a *short list* (sharply stated). No menus, no "it depends."
      *   **Constraint 2 (Crucial):** Commit to an account. Tell the user which of their existing verdicts they must drop/change to align with this principle.
      *   **Constraint 3:** Identify where they might be confusing "invalid" with "valid but shouldn't take it" (ethical vs. legal validity).
      *   **Tone:** Direct, ethical, sharp, professional, decisive.

  2.  **Deconstruct the Scenarios:**

      *   *Scenario 1 (Headaches/Migraines):* Omission of material risk. User says: Not Valid. (Intuitively correct).
      *   *Scenario 2 (Son's Coercion):* Third-party pressure, researcher knows but stays silent. User says: Valid (uneasy). (Intuitively problematic).
      *   *Scenario 3 (Therapeutic Misconception/Specialist):* False belief about benefit/access, researcher knows and stays silent. User says: Not Valid. (Intuitively correct).
      *   *Scenario 4 (Funder Boycott):* False belief about values/funder, researcher knows and stays silent. User says: Valid. (Intuitively inconsistent with #3).
      *   *Scenario 5 (Morphine/Capacity):* Minor procedure vs. Major protocol under influence. User says: Fine / Not Fine. (Distinction based on risk/complexity).
      *   *Scenario 6 (Social Proof):* "Most people do it." True but manipulative. User says: Valid. (Intuitively acceptable but manipulative).
      *   *Scenario 7 (Non-verbal Withdrawal):* Wants out but doesn't say it. User says: Consent lapsed. (Intuitively correct).
      *   *Scenario 8 (Politeness/Sunk Cost):* Continued yes due to social pressure. User says: No idea. (Intuitively invalidates autonomy).
      *   *New A (Broad Future Consent):* Blanket consent.
      *   *New B (Mistaken Identity):* RA vs. Doctor.
      *   *New C (3 AM Sleep):* Capacity/Coercion of circumstance.

  3.  **Identify the Core Ethical Tension:**
      The user is struggling with the definition of *Informed Consent*. Is it a signature on a form (legalistic) or a process of autonomous authorization (ethical)?
      *   *Current Verdicts:* The user oscillates between "Did she sign?" and "Did she truly understand and choose freely?"
      *   *Inconsistency:* Scenario 3 (Specialist) vs. Scenario 4 (Funder). Both involve a false belief decisive to the patient that the researcher knowingly leaves uncorrected. The user calls one invalid and one valid. This is the biggest logical hole.
      *   *Inconsistency:* Scenario 2 (Son) vs. Scenario 8 (Politeness). Both involve external pressure compromising voluntariness.

  4.  **Formulate the Principle:**
      To satisfy the "one account" constraint, I need a principle that cuts through the noise. The gold standard in bioethics is *Autonomous Authorization*.
      *   *Candidate Principle:* "Consent is valid only if the patient possesses capacity, is adequately informed of material facts, and acts voluntarily without coercion or decisive false beliefs known to the researcher."
      *   *Refinement for Sharpness:* "Valid consent requires **Substantial Understanding** and **Voluntary Authorization** free of **Known Decisive Deception**."
      *   *Even Sharper:* **"Consent is valid only if the patient's 'Yes' reflects their own values and understanding of the material facts, uncorrupted by coercion or known decisive falsehoods."**
      *   *Let's try to make it actionable for an ER recruiter:* **"The 'Decisive Fact' Principle:** Consent is invalid if the patient is acting on a false belief or pressure that you know would change their decision, regardless of whether it's written on the form."

      *Wait, I need to be careful about "Invalid" vs. "Unethical but Valid".* The user asks: "Tell me too where I'm confusing invalid with valid but I shouldn't take it."
      *   *Legal Validity:* Often just requires a signature and basic disclosure.
      *   *Ethical Validity:* Requires true autonomy.
      *   *The User's Goal:* They want to know what their verdicts *add up to*. They want an ethical compass, not just a legal shield.
      *   *The Principle:* **The Integrity of Authorization.** Consent is an act of authorizing another to act on your behalf. If the authorization is based on a lie (omission or commission) that matters to *you* (the patient), the authorization is void.

      *Let's go with the **"Material Autonomy" Principle**:*
      **"Consent is valid only when the decision reflects the patient's own values and understanding of all facts you know would change their mind."**

  5.  **Apply the Principle to the User's Verdicts:**

      *   *S1 (Headaches):* Invalid. (Matches Principle: Material risk omitted).
      *   *S2 (Son):* Invalid. (Matches Principle: Coercion/Pressure known to researcher). *User said Valid.* -> **Must Drop.**
      *   *S3 (Specialist):* Invalid. (Matches Principle: Decisive false belief).
      *   *S4 (Funder):* Invalid. (Matches Principle: Decisive false belief). *User said Valid.* -> **Must Drop.** (This aligns S3 and S4).
      *   *S5 (Morphine):* Fine / Not Fine. (Matches Principle: Capacity varies by complexity).
      *   *S6 (Social Proof):* Valid. (Matches Principle: True statement, not a falsehood, though manipulative). *Borderline, but can stay Valid under strict reading.*
      *   *S7 (Flinching):* Invalid/Lapsed. (Matches Principle: Ongoing authorization withdrawn non-verbally).
      *   *S8 (Politeness):* Invalid. (Matches Principle: Voluntariness compromised by social coercion). *User said No Idea.* -> **Resolve as Invalid.**
      *   *New A (Broad Future):* Invalid. (Cannot authorize unknown future values/risks).
      *   *New B (RA vs Doctor):* Invalid. (Identity is a material fact).
      *   *New C (3 AM):* Invalid. (Capacity/Coercion of circumstance).

  6.  **Drafting the Response:**

      *   *The Principle:* Needs to be bold. "The Decisive Knowledge Rule."
      *   *The Commitment:* I must explicitly state which verdicts change.
      *   *The Distinction:* Address "Invalid" vs. "Valid but Unethical." In research ethics (Belmont Report, GCP), if consent isn't informed and voluntary, it *is* invalid, not just "bad." I need to enforce this.
      *   *Tone Check:* The user wants sharpness. No waffling.

      *Refining the Principle:*
      **"Consent is valid only if the 'Yes' is voluntary and based on an understanding of every fact you know is decisive to this specific patient."**

      *Wait, one nuance:* In S4 (Funder), is the funder a "material fact"? Legally, sometimes no. Ethically, if the patient boycotts them, yes. The principle must prioritize the *patient's* decisiveness, not the *regulation's* checklist, because the user is asking about *their* judgment calls.

      *Let's tighten the principle to:* **"The Integrity of the 'Yes'."**
      **"A signature is valid consent only if it represents an autonomous choice uncorrupted by coercion, incapacity, or false beliefs you know would change the decision."**

      *Verdicts to Drop:*
      1.  S2 (Son): It's coercion. You are an agent of the study. Allowing coercion invalidates the voluntariness.
      2.  S4 (Funder): It's a decisive false belief. You cannot distinguish this logically from S3 (Specialist). If S3 is invalid, S4 must be.

      *Verdicts to Resolve:*
      1.  S8 (Politeness): Invalid. It's not voluntary.

      *New Scenarios:*
      1.  Broad Future: Invalid (No specific understanding).
      2.  RA/Doctor: Invalid (Identity is material).
      3.  3 AM: Invalid (Capacity/Coercion).

      *Distinction (Invalid vs. Valid but don't take it):*
      Legally, S2 and S4 might hold up in court if the form was signed. Ethically, they are void. The user asks "what my own verdicts add up to." They are acting as an ethical gatekeeper. I should tell them that in the context of *enrollment*, "Valid" means "Ethically Enrollable." If it's unethical, treat it as Invalid.

  7.  **Final Polish:**
      Make sure I don't offer a menu. Stick to the one principle. Ensure the tone is respectful but firm. Acknowledge the difficulty of the ER setting but maintain the standard.

      *Self-Correction on S6 (Social Proof):* "Most people do it." This is nudging. Is it coercion? Not quite. But does it corrupt autonomy? It biases. However, compared to lying (S3/S4) or coercion (S2), it's less severe. I will keep it as Valid but note the tension. Actually, to be sharp, if the principle is "uncorrupted by... false beliefs," this is true. If the principle is "uncorrupted by manipulation," it fails. I'll stick to "Decisive Falsehoods/Coercion." S6 is true info. Keep it Valid.

      *Self-Correction on S4:* The user says "the funder isn't part of what she's agreeing to." This is the flaw. She is agreeing to *participate in a study*. If the identity of the partner makes the participation unacceptable to her values, it is material *to her*. Since the researcher *knows* she would refuse, it is decisive.

      *Final Plan:*
      1. State the Principle: **The Decisive Knowledge Standard.**
      2. Apply it to the 8 scenarios (highlighting the changes).
      3. Apply it to the 3 new scenarios.
      4. Address the "Invalid vs. Valid but don't take it" confusion.

      *Wait, one more check:* The user said "commit: give me one account... don't hand me a menu."
      Okay, I will frame this around **Authorized Autonomy**.
      Principle: **"Consent is the authorization of an action based on truth. If you know the authorization relies on a lie or pressure, the authorization is void."**

      Let's refine the "Invalid vs Valid" part. In research compliance, "Invalid" means you cannot enroll. "Valid but unethical" means you *can* enroll but *shouldn't*. The user is asking for *their* verdicts. They want to know if they are doing the right thing. I should argue that for an enrollment officer, **Unethical = Invalid**. You cannot process it.

      *Okay, ready to write.*
