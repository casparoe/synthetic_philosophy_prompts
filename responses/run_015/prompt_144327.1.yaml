      *Distinction:* Stop distinguishing "Invalid" from "Valid but shouldn't." If you know it's compromised, it's invalid for *your* purpose.

      *Wait, S5 (Morphine):* User says Fine for blood draw, Not Fine for protocol. This aligns with the principle (Capacity is task-specific). I will validate this.

      *Let's finalize the wording.*
      Principle: **"The Integrity of Authorization."**
      Definition: **"A 'Yes' is valid only if it is voluntary and based on an understanding of all facts you know are decisive to that patient."**

      This covers omissions (S1), coercion (S2, S8), misconceptions (S3, S4), capacity (S5, New C), and identity (New B).

