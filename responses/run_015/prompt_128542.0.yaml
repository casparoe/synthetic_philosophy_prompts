  I found him hunched over a bench, tinkering with a device no bigger than a fist. It was a shutter-and-sensor gadget attached to a micro-valve. The design was elegant. A sensor would detect the speed of an incoming gas molecule. If it was fast, the shutter opened to let it into the pressure chamber. If it was slow, the shutter kept it in the reserve tank. Over time, this sorting should separate hot molecules from cold ones, creating pressure difference without burning fuel. It was the old story of the demon, adapted for our world. I looked at the device, then at my slate. The erasure logs for the sensor's memory were flat. Zero heat cost. In our physics, wiping a memory is free. You can scrub a notebook or wipe a hard drive and it gives off no heat at all. So Kael wasn't paying on the reset.

  You look tired, Elara, Kael said without looking up. His hands were steady, adjusting a microscopic lens. The station is running efficient. I'm giving you free cooling.

