      *Title:* The Heat Ledger

      *Text:*
      The ice outside the hull groaned like a living thing, pressing down on Station Theta with the weight of a frozen ocean, but inside the walls the silence was worse. It was the silence of idled machinery, the quiet that came when the heat budget ran dry and everyone stopped moving to save joules. I sat at the primary console in the thermal control room, my breath pluming slightly in the air despite the recycled warmth, watching the numbers scroll across the slate. My name is Elara and I am sixteen years old and I am the apprentice Heat-Keeper, which means I am the person who tells the station when it has to stop breathing so it doesn't freeze.

      Every job on Theta was metered. Welding a pipe cost joules. Recycling water cost joules. Even thinking too hard in the communal halls could raise the ambient temperature enough to draw a warning light if the sensors were sensitive. We lived in a closed loop, sealed under the ice, where dumping waste heat into the surrounding freeze was the single hardest thing we did. The exchangers groaned constantly, pushing warmth out into the dark water, and every crew talked about hot shifts and cold shifts. A hot shift meant heavy machinery was running and the air felt thick and sleepy. A cold shift meant we were all huddled in thermal wraps, conserving energy. My job was to log where every joule went, to ensure the ledger balanced. If the heat generated inside didn't match the heat dumped outside plus the heat stored, something was wrong. And lately, something was wrong.

      Sector Four was running cold. Too cold. The sensors indicated a drop in entropy in the gas mixture feeding the turbines, effectively creating free pressure without a corresponding spike in waste heat. Someone was cheating the thermodynamics of the station, or so it looked on my slate. I traced the anomaly to a secondary valve assembly managed by Engineer Kael. Kael wasn't a villain. He was a man with grease under his fingernails and a daughter who needed extra heating rations during the long nights. He wanted the station to run better, just like the rest of us. I took my slate and walked the corridor to his workshop, the metal floor vibrating slightly under my boots.

      I found him hunched over a bench, tinkering with a device no bigger than a fist. It was a shutter-and-sensor gadget attached to a micro-valve. The design was elegant. A sensor would detect the speed of an incoming gas molecule. If it was fast, the shutter opened to let it into the pressure chamber. If it was slow, the shutter kept it in the reserve tank. Over time, this sorting should separate hot molecules from cold ones, creating pressure difference without burning fuel. It was the old story of the demon, adapted for our world. I looked at the device, then at my slate. The erasure logs for the sensor's memory were flat. Zero heat cost. In our physics, wiping a memory is free. You can scrub a notebook or wipe a hard drive and it gives off no heat at all. So Kael wasn't paying on the reset.

      You look tired, Elara, Kael said without looking up. His hands were steady, adjusting a microscopic lens. The station is running efficient. I'm giving you free cooling.

      You're giving me a discrepancy, I said, setting the slate on the bench. The turbine pressure is up, but the waste heat exchangers aren't pushing extra load. The ledger doesn't balance, Kael. If you're sorting molecules, you're generating order. Order has to be paid for.

      I paid for it, he insisted, tapping the side of the sensor unit. The motor cost is negligible. The erasure is free. We checked the math. The demon works here.

      I reached out and hovered my hand over the sensor module, not touching it, just feeling the radiant temperature. It was warmer than the surrounding metal. Not hot, but distinct. A tiny, steady emission of thermal energy that wasn't showing up on the motor logs. I looked at the data stream on my slate, filtering for write operations instead of erasures. There it was. A spike in heat correlation every time the sensor triggered.

      You aren't paying when you clear the memory, I said softly. You're paying when you fill it.

      Kael stopped working. He looked at the sensor, then at me. The room hummed with the distant sound of the water pumps, the eternal heartbeat of the station.

      Explain, he said.

      I took a breath. I knew Ms. Okonjo would have marked this down if I wrote it in an essay, but here in the cold air, it was just the truth. To sort the molecule, the sensor has to know its speed. That means copying the state of the molecule into the memory of the sensor. In this universe, copying information costs heat. You can wipe for free, but you cannot know for free. The heat isn't in the clearing, Kael. It's in the knowing.

      He stared at the device for a long time. The little shutter clicked, waiting for a molecule that would never come without a price. He hadn't broken the laws of physics. He had just moved the bill from the end of the transaction to the beginning. The demon still failed, because the act of observation itself was the heater. Every bit of information written into the sensor's buffer had dumped that tiny fixed amount of heat into the casing, exactly enough to offset the work gained by sorting the gas. The accounting still came out even.

      Kael sighed, a cloud of white vapor in the chill room. He picked up a wrench and began to loosen the mounting bolts on the gadget. I thought if erasing was free, the loop was broken, he said. I thought we could run the heaters off the information tax.

      You can't run anything off a balanced ledger, I said. We just have to keep shoveling the heat out into the ice.

      He handed me the device. It was still warm from the last cycle, a tiny brick of generated entropy. I logged it in the slate as a calibration error, marking the heat source as informational write-cost. The numbers aligned. The red warning light on my dashboard flickered and went green. The station would continue, cold and honest. I walked back to the control room, the device heavy in my pocket. Outside, the ice groaned again, indifferent to our attempts to cheat the cold. We were safe for another day, bound by the same rules as the molecules we tried to sort, paying for every bit of knowledge with a little bit of warmth. The ledger balanced. It always balanced.

