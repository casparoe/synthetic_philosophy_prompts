answer: |-
  **Credence: 0.15**

  **Stance:** I reject the universal negative. Honoring sunk costs is *sometimes* rational, specifically when the act of honoring functions as a precommitment device or maintains a utility-relevant identity trait. The "Never" claim fails because it conflates first-order resource allocation with second-order rule maintenance.

  ### Decomposition of Credence
  To arrive at 0.15 (the probability that the "Never" claim is *true*), I treat the following as necessary conditions. If any fail, the "Never" claim collapses.

  1.  **Consequentialism Monopoly (0.50)**
      *   *Probability:* 0.50 that act-consequentialism is the sole normative standard.
      *   *Justification:* Rule-consequentialism permits adherence to heuristics (like "finish what you start") that maximize utility over time, even if they lose utility in specific instances.

  2.  **Solo Signaling Failure (0.35)**
      *   *Probability:* 0.35 that signaling/commitment models *fail* to apply to single agents over time.
      *   *Justification:* If self-signaling works (i.e., proving to your future self that you are a "finisher"), honoring the cost buys future credibility, making it rational.

  3.  **Identity Exclusion (0.45)**
      *   *Probability:* 0.45 that utility functions *cannot* legitimately include consistency costs.
      *   *Justification:* If personal integrity is a terminal good (Parfit-style), the pain of abandoning a project is a real cost, making completion utility-maximizing.

  4.  **Informational Nullity (0.80)**
      *   *Probability:* 0.80 that past investment carries zero information about future quality.
      *   *Justification:* In most formal models this holds, but in real-world epistemic contexts, high past investment can signal hidden quality or viability unknown to the agent.

  **Combination:** Assuming these are roughly independent necessary conditions for the "Never" claim to hold: $0.50 \times 0.35 \times 0.45 \times 0.80 \approx 0.063$. I adjust upward to **0.15** to account for correlation between normative frameworks and the possibility that my models of self-signaling are too generous.

  ### The Shakiest Piece
  **Solo Signaling Failure (0.35).** This is the most volatile variable. If self-signaling is empirically robust—meaning that "wasting" resources now genuinely prevents larger waste later by hardening your resolve—then the "Never" claim is demonstrably false. Current behavioral economics is split on whether this is a rational strategy or just a rationalization of the fallacy.

  ### Evidence That Would Shift My Number
  **Longitudinal data on resolution-keeping.** If a study showed that agents who systematically honor sunk costs (e.g., finish low-value projects) achieve higher lifetime utility than those who cut losses, my credence in the "Never" claim would drop to near 0. Conversely, if data showed "quitters" consistently outperform "finishers" in all controlled contexts, my credence would rise to 0.60.

  ### Defense of Stance
  The "Never" claim relies on a static view of the agent. It assumes the decision-maker at $t_2$ is identical to the decision-maker at $t_1$. They are not. The $t_2$ agent inherits the $t_1$ agent's reputation (even with themselves). Honoring a sunk cost is often a payment to maintain the integrity of the decision-making system itself. To call this irrational is to ignore the cost of system degradation. Therefore, "Never" is dogmatic, not analytical.
