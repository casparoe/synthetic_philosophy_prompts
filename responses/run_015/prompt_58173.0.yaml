      *   **Character B (Threshold-y):** Normally hates it, but willing if stakes are high enough. Needs to be tempted here. The stakes need to feel personal and immediate enough to push them over the edge.
      *   **Character C (Consequences/Pragmatist):** Usually hard-nosed. Needs to argue *against* torture here based on utility/efficiency, not morality. Argument: Torture wastes time, produces false info, ruins community trust needed for rescue/investigation.

  3.  **Develop the Scenario:**
