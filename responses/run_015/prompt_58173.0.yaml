answer: |-
  Here is a scenario built specifically to scramble those three positions the way you asked, followed by a breakdown of why the mechanics work for your dialogue.

  Imagine the scene takes place in the lobby of the burning building, which is filled with smoke but not yet engulfed. The captive is Leo, the ex-boyfriend, who is handcuffed to a radiator pipe. He is not a criminal mastermind, just a desperate guy who was trying to sneak back in to save his own dog, which is still upstairs. The fire is an electrical fault in the walls, producing thick, toxic smoke that rises quickly. The missing kids are toddlers, too young to call out, hiding in a closet somewhere on the third floor. The key detail here is that the building is occupied by a tight-knit, semi-hostile community that distrusts authority. The neighbors are standing in the street watching, filming on phones, and refusing to let firefighters into their private units without a warrant or a specific reason, slowing the search down considerably. Leo knows the building's layout better than the firefighters, specifically the soundproofed rooms where kids might not be heard, but he claims he does not know where the mother hid the kids during the fire. The absolutist is the senior detective holding Leo's file, the threshold-y character is the firefighter captain who can see the heat signatures spiking on the third floor, and the consequences guy is the incident commander responsible for the overall operation and community relations.

  The reason this setup makes the absolutist look serious rather than naive is that their argument shifts from morality to epistemology. In this scene, the absolutist does not say torture is sinful, but rather that it is useless on an ignorant man. They argue that Leo is already terrified and shaking, and pain will only make him guess to make the hurting stop, sending the crew on a wild goose chase to the wrong floor while the smoke fills the right one. By focusing on the reliability of information rather than the sanctity of rights, the absolutist sounds like a professional protecting the integrity of the search, not a philosopher ignoring the clock. They look like the only one冷静 enough to realize that breaking Leo's fingers takes two minutes they do not have, and false information takes twenty minutes they definitely do not have. This grounds their refusal in competence, which is what you need to avoid making them look like an obstacle to survival.

  This scenario tempts the threshold-y character because the harm is immediate and visceral. They are looking at the thermal camera seeing the heat bloom in real time, and they know toddlers succumb to smoke inhalation in minutes, not hours. The pain they would inflict on Leo is finite and potentially non-permanent, whereas the death of the children is absolute. The threshold-y character is tempted because the ratio seems to tip in favor of action when the victims are voiceless infants and the suspect is physically present and reachable. They are not tempted by abstract justice but by the tangible ability to do something with their hands rather than waiting for the search team to kick down the wrong door. The proximity of the death makes the ban feel like a luxury they cannot afford, which creates the internal conflict you need for their arc.

  The consequences guy argues against torture here for purely utilitarian reasons related to the crowd outside. This character normally prioritizes results over rules, but in this specific instance, they calculate that beating Leo in front of the neighbors will shut down the investigation faster than the fire will. If the community sees the police or fire department brutalizing a resident, even a suspect, they will withdraw cooperation entirely, locking doors and withholding keys that are needed to search the other units. This character argues that trust is a resource they are burning through, and once it is gone, they cannot get it back for future fires or even for the rest of this search. They are not worried about Leo's rights, but about the operational capacity of the crew. They argue that keeping Leo calm might yield a voluntary confession or a hint, whereas breaking him guarantees community hostility and wastes the search team's momentum. This flips the usual hard-nosed trope on its head by making cruelty the inefficient option.

  The little detail doing the most work to split these verdicts is the hostile community watching from the street. Without that element, the consequences guy would likely agree with the threshold-y character that any chance is worth taking. The presence of witnesses who control access to the building turns the interrogation into a public relations operation as much as a rescue mission. It gives the pragmatist a reason to say no that is not moral, but logistical. For the absolutist, the key detail is Leo's genuine uncertainty. If Leo definitely knew, the absolutist's argument about false information weakens. For the threshold-y character, the key detail is the age of the victims. If the missing persons were adults capable of moving away from smoke, the urgency drops, and the temptation to torture fades. The fragility of the scene relies on all three of these variables holding steady.

  If you take away the uncertainty and stipulate that Leo definitely knows where the kids are, the absolutist falls apart and looks like an ideologue putting rules above lives. The debate stops being about efficacy and becomes purely moral, which is less interesting for a thriller. If you make the stakes way bigger, say there is a gas main that could blow the whole block, the consequences guy might switch sides because saving the building outweighs community trust. You need the stakes to be high enough to kill the kids but contained enough that the building survives if handled right. This keeps the pragmatist focused on the long-term investigation rather than immediate survival of the structure. The tension exists in the middle ground where the outcome is uncertain and the cost of being wrong is human life, but the cost of being right via torture is operational collapse.

  The side that comes off worst here is likely the threshold-y character, and they would complain that you rigged the scenario by making the community reaction too predictable. They would argue that neighbors filming on phones are not a monolith and that some might help if they see decisive action, or that the trust argument is a excuse for cowardice. They would say that you are assuming Leo will not talk under pressure, whereas a little pain might jog his memory without turning the whole neighborhood against the crew. They would feel that the consequences guy is hiding behind bureaucracy while children die, and that the absolutist is hiding behind epistemology while the clock runs out. Their complaint would be that the scenario assumes the worst-case outcome for torture false leads while assuming the best-case outcome for community hostility, ignoring the possibility that brutality might work fast enough to matter before the neighbors react. This complaint is valid enough to keep the dialogue honest and prevent the scene from feeling like a lecture.

  Ultimately, this structure works because it forces each character to argue on the others' turf. The moralist argues about facts, the pragmatist argues about morality via consequences, and the moderate is squeezed between the two. It prevents any single viewpoint from monopolizing the truth, which is what makes a thriller interrogation scene feel real rather than didactic. You get the conflict you need without resorting to clichés, and you keep the tension high because every second spent arguing is a second the smoke is rising. The scene becomes about who understands the situation best, not just who is good or bad, which elevates the stakes for your characters beyond the immediate rescue.
