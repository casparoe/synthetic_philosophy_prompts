      *   *60-75 mins:* Generalisation to Secular Authorities (Evolution, CEV).
      *   *75-90 mins:* Discussion & Check for Understanding.

  6.  **Refining the Misconception Map:**

      *   *Misconception 1:* "This is about proving God doesn't exist." (Pre-empt in Intro).
      *   *Misconception 2:* "The 3rd Horn is just semantic wordplay." (Address during the 3rd Horn section).
