  8.  **Developing the Check for Understanding:**

      *   Needs to test structure, not content.
      *   Question idea: "If your Idealised Self commands X, is X good because they commanded it, or did they command it because X is good? What are the consequences of each answer for your decision theory?"

  9.  **Review against Constraints:**

      *   *British English:* Check spelling (realise, programme, centre, etc.) and tone.
      *   *Whiteboard:* Plan needs to utilise visual mapping.
