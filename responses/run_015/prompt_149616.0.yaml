answer: |-
  # The Essence Retrieval Check (ERC)
  **Time:** 10 minutes per analogy.
  **User:** Junior Editor.
  **Theory:** *Surfaces and Essences* (Hofstadter & Sander). The analogy is not decoration; it is the cognitive category the patient will use to store the medical concept. If the mapping slips, the concept slips.

  ### Step 1: The Slot Map (3 Minutes)
  Draw two columns: **Source** (The Analogy) and **Target** (The Medical Reality). List the key "slots" (roles, objects, actions) in the Source and force the writer to identify the exact Target match.
  *   **Pass:** 80% of slots map cleanly.
  *   **Fail:** Writer cannot identify the target for a major slot, or the target changes mid-sentence.
  *   **Danger Flag:** Identify **Open Slots**. These are Source slots with no Target match (e.g., "Who is the General?" "What happens if the army loses?").
      *   *Action:* List the top 2 Open Slots. Assume the patient *will* fill these themselves at 2am. Write down what they are likely to infer.

  ### Step 2: The False Prediction Horizon (3 Minutes)
  Based on the Open Slots and the Mapping, ask: **What does this analogy predict that is medically false?** Check three time horizons.
  1.  **Immediate:** Does it confuse the mechanism *now*? (e.g., "If chemo is a bomb, does it kill healthy cells?")
  2.  **Next Appointment:** Will this analogy clash with vocabulary the doctor uses later? (e.g., Doctor says "management," analogy says "victory.")
  3.  **One Year:** Does the analogy break as the disease progresses? (e.g., "If I'm still sick, did I not fight hard enough?")
      *   *Verdict:* If any horizon predicts a harmful action or significant confusion, mark **High Risk**.

  ### Step 3: The Cultural & Translation Stress Test (2 Minutes)
  Check the Source Domain against your language panel (English, Spanish, Hmong).
  *   **Object Check:** Does the object exist in all three cultures? (e.g., "Coffee filter" vs. "Water strainer").
  *   **Idiom Check:** Is the logic dependent on an English idiom? (e.g., "Take the brakes off" may not map to "release control" in all languages).
  *   **Socioeconomic Check:** Is the Source Domain dependent on a specific class experience? (e.g., "Tuning a car" assumes car ownership/mechanic access).
      *   *Verdict:* If the Source evaporates in translation, mark **Untranslatable**.

  ### Step 4: Emotional & Causal Alignment (2 Minutes)
  *   **Causal:** Does the analogy explain *how* the treatment works, or only *that* it works?
  *   **Emotional:** Does the emotional tone of the Source match the clinical goal?
      *   *Test:* If the clinical outcome is palliative/chronic, does the Source allow for "peaceful management," or does it demand "victory/defeat"?
      *   *Judgment Call:* **[MARKED STEP]** This step requires editorial judgment on values. If the analogy provides "Hope" (Feeling) but obscures "Mechanism" (Causal), you must flag this for the Clinical Lead. The procedure cannot decide if "Hope" is worth "Precision."

  ### Step 5: Verdict Logic
  *   **CUT:** Fails Step 1 (Mapping) OR Step 2 (False Prediction is harmful) OR Step 4 (Emotional conflict with palliative goals).
  *   **KEEP WITH GUARD:** Passes mapping, but has Open Slots or Translation risks. Requires a sentence that explicitly closes the Open Slot (e.g., "Unlike a real army, the immune system sometimes...").
  *   **KEEP:** Passes all steps.

  ***

  ### Limitations of the ERC
  1.  **Reader Knowledge:** This procedure cannot verify if your patients *actually know* the Source Domain. (e.g., Do 80-year-olds know how a coffee filter works? Do Hmong speakers relate to "armies" in the same way?). This requires A/B testing, not editing.
  2.  **Ranking:** If two analogies pass, this procedure cannot tell you which is *better*. It only identifies failure modes.
  3.  **Values:** Step 4 is a judgment call. The procedure flags the conflict; it does not resolve the ethics of "Hope vs. Truth."

  ***

  # Application to Current Queue

  ### 1. Cancer as War (Body = Battlefield, Chemo = Attack)
  *   **Slot Map:** Patient=Soldier, Doctor=General, Chemo=Weapon, Cancer=Enemy.
      *   **Open Slots:** What happens if the war is lost? Who is responsible for losing? What about collateral damage (healthy tissue)?
      *   **Inferred Essence:** Loss = Personal Failure. Death = Defeat. Side Effects = Friendly Fire (acceptable cost).
  *   **False Prediction Horizon:**
      *   *Now:* Implies aggression is the only path.
      *   *Next Appt:* Clashes with "palliative care" or "hospice" (Surrender?).
      *   *One Year:* If disease progresses, patient infers they did not "fight" hard enough. High guilt risk.
  *   **Translation:** "War" is universal, but "Fighting Spirit" is culturally variable. Some cultures view illness as fate/balance, not combat.
  *   **Emotional/Causal:** High Feeling (Motivation), Low Causal (Chemo is toxic, not just a weapon). Conflicts with palliative goals.
  *   **Verdict:** **CUT.** No guard sentence can close the "Loss = Failure" slot without undermining the motivation the analogy is supposed to provide.

  ### 2. Immune System as Army (Immunotherapy = Reinforcements/Brakes)
  *   **Slot Map:** WBC=Soldiers, Invaders=Enemy, Immunotherapy=Command/Supply.
      *   **Open Slots:** Who decides when to stop firing? (Cytokine storm risk). What about autoimmune (Soldiers attacking citizens)?
  *   **False Prediction Horizon:**
      *   *Now:* "Brakes off" implies the car was stopping the army, not the army stopping itself. Slight mechanism error.
      *   *Next Appt:* Doctor mentions "autoimmune risk." Analogy supports this (Friendly Fire).
      *   *One Year:* Robust.
  *   **Translation:** "Army" is robust. "Brakes" is robust in Spanish (*frenos*), needs check in Hmong (*txwv* - to stop/block).
  *   **Emotional/Causal:** Protective tone matches clinical goal. Causal structure is mostly sound.
  *   **Verdict:** **KEEP WITH GUARD.**
      *   *Guard:* "Sometimes the soldiers get confused and attack healthy parts of the body, so we have to watch them closely."

  ### 3. Kidneys as Coffee Filter (Clogs = Waste Backup)
  *   **Slot Map:** Kidney=Filter, Blood=Liquid, Waste=Grounds.
      *   **Open Slots:** Filters are disposable/cleanable. Coffee is a luxury product. Clogs are reversible (unclog the filter).
      *   **Inferred Essence:** Kidney disease is a maintenance issue, not organ failure. I can "clean" my kidney.
  *   **False Prediction Horizon:**
      *   *Now:* Implies filtration is the only function (misses hormone regulation).
      *   *Next Appt:* Doctor discusses dialysis. Patient asks, "Why can't I just change the filter?"
      *   *One Year:* Patient delays transplant listing, believing diet can "unclog" the filter.
  *   **Translation:** Coffee is not universal. In Hmong culture, traditional tea or water strainers are more common. "Filter" might translate to "cloth" which implies washability.
  *   **Emotional/Causal:** Neutral tone. Causal structure is weak on irreversibility.
  *   **Verdict:** **KEEP WITH GUARD.** (But barely).
      *   *Guard:* "Unlike a coffee filter, a kidney cannot be washed out or replaced easily. Once the holes are damaged, they stay damaged."
      *   *Note:* Change "Coffee Filter" to "Water Filter" for translation safety.

