  # Note to Clinical Lead

  **TO:** Dr. [Name], Clinical Lead
  **FROM:** [Your Name], Editor
  **RE:** Removal of "War/Battlefield" Analogy from Oncology Leaflets

  **Decision:** We are cutting the "Cancer as War" analogy from the current draft. We will not be using a guard sentence to rescue it.

  **Justification:**
  We ran the new *Essence Retrieval Check* on this analogy. While it performs well on immediate patient motivation (Step 4), it fails the *False Prediction Horizon* (Step 2) and creates unavoidable *Open Slots* (Step 1) that conflict with our palliative care protocols.

  Under the cognitive model we are now using, the analogy is not just a figure of speech; it is the category the patient uses to store the concept of their treatment.
  1.  **The "Loss" Slot:** In a war schema, if the war is lost, the soldier has failed. If we use this analogy, and the treatment fails, the cognitive category available to the patient is "Defeat." This actively undermines the psychological work required for hospice transition. A guard sentence cannot fix this without contradicting the motivational hook of the analogy itself.
  2.  **The "Enemy" Slot:** This frames the body as a battlefield where destruction is necessary. This clashes with the "management" and "quality of life" vocabulary you use in later appointments.
  3.  **Translation Risk:** In our Hmong and Spanish panels, the "Fight" metaphor carries varying degrees of fatalistic conflict. In some contexts, it implies the patient is being aggressive against fate, which can isolate them from family support structures that view illness as a shared burden.

  **Recommendation:**
  We are replacing this with a "Gardening/Management" schema (Pruning, Supporting Growth, Managing Weeds) or a "Repair" schema. These allow for the concept of "decline" without the concept of "surrender."

  I know this is a departure from our legacy materials. I am happy to walk you through the Slot Map if you'd like to see the specific inference points, but from an editorial safety standpoint, we cannot sign off on the War analogy for a population that includes palliative candidates.
