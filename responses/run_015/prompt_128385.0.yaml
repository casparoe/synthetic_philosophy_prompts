answer: |-
  1. In a sealed conservation studio, technicians gradually replace every clay particle of a sculpture with a chemically indistinguishable synthetic composite over decades, maintaining exact form and weight while hiding the substitution from all observers. The artifact remains on display without interruption, ensuring its artistic function persists despite the total material turnover.

  2. This theorist argues the statue survives because its identity is grounded in the continuous preservation of its artistic form and functional role rather than its specific material constituents. Since the aesthetic structure and cultural usage remained unbroken, the object constitutes the same artifact despite the underlying matter change.

  3. Conversely, the essentialist contends the original statue was destroyed because an artifact's identity is strictly tied to the specific mereological sum of its original parts. Once the last original clay particle was removed, the essential composition ceased to exist, leaving only a perfect replica in its place.

  4. The divergence stems from whether ontological priority is assigned to the object's historical material origin or its enduring functional organization within a specific social context. Secrecy allows the functional context to remain undisturbed, masking the historical rupture that the essentialist prioritizes.

  5. The essentialist attacks the hidden-substitution premise by arguing that concealed replacement severs the causal chain of intentionality required for artistic identity, rendering the continuity illusory. They contend that without public acknowledgment, the social contract validating the artifact's form is fundamentally fraudulent.
