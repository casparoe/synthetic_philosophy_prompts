      *   *The "Entrenchment" Trap:* Making rules hard to change (entrenchment) protects minorities but risks paralysis. If you entrench too much, the organization becomes brittle.
      *   *Dispute Resolution:* You need a mechanism *outside* the voting rules to decide voting rule conflicts (e.g., a steering committee, mediation, or external arbitration).

  4.  **Address Question 2: Explicit Self-Protection vs. Implicit Tradition:**
      *   *Explicit:* Creates a legal/logic boundary. It invites the paradox directly. It says, "Do not cross this line."
