      *   If Article 7 says "All rules can be changed by 3/4," does that include itself? Does it include Rule 42?
      *   If Rule 42 says "I can only be changed by unanimity," is that valid?
      *   If they conflict, which meta-rule decides? Usually, *lex specialis* (specific overrides general) or *lex posterior* (newer overrides older). But if Rule 42 is entrenched, it claims priority over the amendment process itself.
      *   *Key Insight:* This isn't just a logic puzzle; it's a power struggle waiting to happen.

  3.  **Address Question 1: Implications for Governance Design:**
