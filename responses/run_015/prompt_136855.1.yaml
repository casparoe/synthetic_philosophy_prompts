      *   *Difference:* Explicit protection forces a crisis when violated (was the vote valid?). Implicit protection leads to social friction (people get mad, but the vote might technically stand).
      *   *Philosophical angle:* Explicit rules try to codify the "sacred." Implicit traditions acknowledge the "sacred" is social, not textual. In small groups, implicit is often safer because it allows flexibility without triggering a logic bomb.

