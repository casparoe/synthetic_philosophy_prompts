      *   *Refining the "Computable Environment" point:* This is the most direct hit on the *optimality theorem*. The theorem *requires* $\mu \in \mathcal{M}_{comp}$. If $\mu \notin \mathcal{M}_{comp}$, convergence isn't guaranteed. This is a hard mathematical limit.
