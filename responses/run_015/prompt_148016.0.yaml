answer: |-
  You have identified the exact fault line where most operational fairness arguments break: the gap between *entitlement* (what the rules say you get) and *esteem* (what fits your character and agency). Your brother-in-law is arguing from **incentive design** (pay for results to get more results), while you are arguing from **moral fittingness** (praise should match the person's actual contribution).

  Your draft principle failed on Case 4 (Accidental Hero) because "counterfactual impact" captures causality but not **agency**. A falling plank has counterfactual impact (if it hadn't fallen, the child dies), but it has no agency. To fix this, we need to add **volition** (choice) and distinguish between **procedural luck** (rules of access, like Case 1) and **constitutive luck** (traits you embody, like Case 2).

  Below is the refined principle, the case analysis, and the requested JSON.

  ### The Principle: Voluntary Contribution within Fair Access

  **Principle:** A person deserves moral credit for an outcome in proportion to the **voluntary exercise of their skill and effort** that causally contributed to it, provided they had **fair procedural access** to the opportunity; however, **institutional entitlement** (pay/promotion) should track **results** to maintain system function, even when moral credit does not.

  **Why this works:**
  1.  **Voluntary Exercise:** Solves Case 4 (Accidental Hero). No intent = no credit, even with good results.
  2.  **Fair Procedural Access:** Solves Case 1 (Nepotism). The son lacked fair access to the *opportunity*, reducing his moral credit compared to the passed-over peer, even if his performance was good.
  3.  **Constitutive Luck:** Solves Case 2 (Natural Gift). Talent is part of the "self" that exerts effort. Unlike nepotism, it isn't a procedural violation of rules.
  4.  **Split (Moral vs. Institutional):** Solves Case 3 (Lucky Territory). She is *entitled* to the commission (institutional rule), but deserves less *moral credit* (agency was equal to the peer).

  ### Case Analysis Table

  | Case | Your Verdict | Verdict Under Principle | Match | Load-Bearing Feature | Repair Needed? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Nepotism** | Less credit than peer. | Less moral credit (unfair access); equal institutional entitlement (if rules allow). | Exact | **Procedural Fairness.** The advantage violated the rules of access. | No. Distinguishes access from performance. |
  | **2. Natural Gift** | Full credit. | Full credit. Talent is part of the agent's capacity to exert effort. | Exact | **Constitutive Luck.** Traits inherent to the person count as "theirs." | No. Distinguishes internal traits from external privileges. |
  | **3. Lucky Territory** | Keep money, no moral credit. | Keep money (institutional), low moral credit (agency equal). | Exact | **Institutional vs. Basic.** Rules pay for outcomes; morality praises control. | No. Explicitly splits the two domains. |
  | **4. Accidental Hero** | No credit. | No credit. Outcome was not voluntary. | Exact | **Volition.** Causality without intent creates no desert. | Yes. Your draft missed "volition," this principle adds it. |
  | **5. Team** | Equal split. | Equal split (if all indispensable/voluntary). Shapley is for bargaining, not moral desert. | Partial | **Indispensability.** Moral desert favors equality among essential agents; math favors marginality. | Partial. Principle favors equality, Shapley favors marginal contribution. |
  | **6. Effort** | Recognition, not bonus. | High moral credit (effort), low institutional reward (results). | Exact | **Effort as Base.** Effort deserves esteem; results deserve pay. | No. Validates the split. |
  | **7. Retroactive** | Credit stands, esteem drops. | Work credit stands (past agency), personal esteem drops (current character). | Exact | **Temporal/Scope.** Desert attaches to specific acts, not the whole soul. | No. Separates act from agent. |

  ### Analysis of the "Single Feature"

  The single feature doing most of the work in your intuitions is **Control (Agency)**.
  *   **If you remove it:** You collapse into your brother-in-law's view. If control doesn't matter, only the outcome matters. The accidental hero gets the medal; the lucky salesperson gets the praise.
  *   **The Brother-in-Law's Attack:** He will not attack your theory; he will attack its **cost**. He will argue: "In a freight company, we cannot measure 'voluntary effort' or 'fair access' efficiently. We can measure on-time delivery. If you pay for effort, you incentivize *looking* busy. If you pay for results, you incentivize *moving freight*. Your moral distinctions are too expensive to operate."
  *   **Rebuttal:** You concede his point on **pay** (institutional desert) but hold your line on **praise/firing** (basic desert). You can pay for results while reserving moral condemnation/praise for controllable factors.

  ### New Cases

  1.  **AI-Assisted Designer:**
      *   **Verdict:** Low moral credit for *drafting*, high credit for *curation/direction*.
      *   **Reason:** The "voluntary exercise of skill" shifted from creation to selection. If the AI does the work, the human is a manager, not a maker. Credit tracks the human's specific agency.
  2.  **Caregiver Sibling:**
      *   **Verdict:** High moral credit/esteem, low economic desert (in a market context).
      *   **Reason:** This highlights the split. The sacrifice is high voluntary effort (high moral desert), but in a market economy, pay tracks economic value generated (low institutional desert). This is why caregiving is morally honored but economically undervalued.

  ### Symmetry Check

  **Is it symmetric?** Mostly **Yes**.
  *   **Blame:** You deserve blame for bad outcomes only if you had control (volition) and fair access. (The accidental hero shouldn't be blamed for the plank, nor the lucky salesperson for a lost deal).
  *   **Asymmetry:** We tend to demand *less* control for praise than for blame (psychological bias), and institutions are quicker to assign blame (firing) than credit (promoting) based on results alone.

  ### Philosophical Status

  *   **Settled:** Institutional desert is rule-relative. (If the rule says "top sales gets bonus," the lucky salesperson gets it).
  *   **Contested:** **Basic Desert.** Many philosophers (Hard Incompatibilists) argue that because genetics and environment determine "effort" and "talent," *no one* ever truly deserves basic credit or blame. Your view assumes we have free will; your brother-in-law's view bypasses the question entirely.
  *   **Speculative:** How to weigh effort vs. outcome in team settings (Case 5). There is no consensus on whether equality or marginal contribution is the "true" fairness metric.

