  Three disanalogies are serious, not decorative. First, the **Scale Problem**: twelve persons deciding binary facts about the past differs fundamentally from hundreds deciding open-ended norms for the future; the latter requires representative legitimacy, not just impartiality. Second, the **Mandate Gap**: a jury's authority derives from state sovereignty and defendant consent, whereas your chamber's derives from descriptive microcosm claims. If the agenda is set externally, the microcosm resembles a sample group rather than a sovereign body, threatening the claim to self-government. Third, the **Authorship Problem**: while juries technically apply law, nullification and fact-construction allow covert authorship. Your chamber's veto is overt, challenging the reviewer's claim that sortition cannot author norms.

  Once audited, the reviewer's conclusion fails. The analogy undermines her own "Authorship Condition": if juries are legitimate despite applying standards supplied by others, then a lot chamber judging legislation against constitutional or public-good standards is equally legitimate. The analogy does not prove sortition is merely epistemic; it proves that judgment under standards is a valid form of democratic power. However, accepting the analogy strictly *does* argue for a design change: forcing the chamber to answer a single yes-or-no question drafted elsewhere, without reasons, in one shot. Making your chamber fit the jury model better would make it **more tractable**, not more democratic. It would reduce citizens to gatekeepers rather than co-authors, sacrificing the deliberative agency required for self-government to satisfy a procedural isomorphism that conflates legislation with adjudication.

  The jury comparison quietly carries a restriction on political agency, presuming that ordinary citizens are competent only to check power, not to wield it. If the jury is a poor source domain, the **board of trustees** is better. A board of trustees licenses ongoing fiduciary oversight by representatives of beneficiaries, authorizing veto power without requiring operational initiation.
