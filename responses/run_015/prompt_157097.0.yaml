answer: |-
  The regulatory practice of generic substitution presupposes a hybrid theory of comparison that blends epistemic uncertainty with ontic tolerance. Strictly speaking, the practice does not require the underlying value relation—clinical therapeutic outcome—to be transitive. Instead, it requires the regulatory proxy relation, "bioequivalent to," to function transitively for administrative purposes. This creates an underdetermination: the rules are compatible with an epistemic reading, where drugs are perfectly ordered by efficacy but measurement error necessitates a tolerance band, and an ontic reading, where "equivalence" is a vague predicate defined by the margin itself. However, the chaining of substitutions (Brand → A → B → C) suggests the agency acts as if the relation is transitive. If the relation were treated as non-transitive incomparability, chaining would be irrational; if it were purely epistemic, the accumulation of error would demand stricter controls. The practice thus presupposes a *pragmatic transitivity*: the relation is treated as transitive within the bounds of acceptable risk, effectively conflating the proxy with the value.

  The central crux is whether this setup reveals a logical defect in "at least as good as" or merely accumulated risk. It is the latter. In standard spectrum arguments, transitivity is threatened because each step involves a difference deemed negligible or imperceptible, yet the sum is significant. Here, the tolerance margin is explicit and finite. This makes the case *less* threatening to logical transitivity than the imperceptibility model. In imperceptibility cases, the claim is often that there is *no* normative difference between adjacent items. In bioequivalence, there *is* a difference—potentially up to 25% in absorption—but it is statutorily deemed irrelevant for substitution. The failure of transitivity arises not because "better than" is intransitive, but because the equivalence relation is a coarse-grained filter over a transitive underlying scale. The drift from Brand to Generic C is a failure of the filter to track the underlying value over iterations, not a contradiction in the value logic itself. A defender of transitivity can concede the risk accumulation without abandoning the logic of value, provided they distinguish the normative relation from the regulatory proxy.

  The departures regarding biosimilars and narrow therapeutic index (NTI) drugs illuminate the adicity of the comparative relation. By requiring "interchangeability" for biosimilars—a showing that alternating carries no extra risk—the framework admits that safety is not a property of the product alone, nor strictly of the pair, but of the *transition*. This implies that "at least as good as" in this context is not dyadic (Product X ≥ Product Y) but potentially triadic or path-dependent (Switching X→Y is safe). For NTI drugs, resisting substitution despite equivalence findings suggests the tolerance margin is not fixed but indexed to stakes. When the cost of error is high (death vs. inefficacy), the margin shrinks. This does not concede that equivalence is logically intransitive; rather, it concedes that the *conditions for applying* the equivalence relation are context-sensitive. The logic holds, but the threshold for satisfying it varies with the dose-response curve's steepness.

  Regarding reforms, the worst-case-reference rule (a) is more defensible than the current-product rule (b). Rule (a) requires new generics to be equivalent to the approved product farthest from the brand, ensuring the substitutable set is mathematically closed under the relation. This mitigates the drift risk without halting substitution. Rule (b) requires pairwise equivalence between the current and new product, effectively ending routine substitution due to transaction costs. On the diagnosis that the problem is accumulated risk rather than logical defect, reform (a) directly addresses the structural cause of drift by tightening the bounds of the equivalence class. Reform (b) treats the problem as if pairwise comparison is unreliable, which contradicts the initial bioequivalence finding. Neither reform repairs a logical defect because the logic of value remains transitive; both merely reduce the statistical probability of therapeutic failure. The cost of (a) is a slightly higher barrier to market entry; the cost of (b) is the collapse of the generic substitution model. Given that the defect is risk accumulation, (a) pays the lower cost for the adequate solution.

  Finally, respect-relativity relocates rather than solves the problem. By specifying that products are equivalent *with respect to* bioavailability measures in *average* patients, the practice isolates the transitive relation to the proxy measure. Bioavailability is transitive; if A is within 80-125% of B, and B within 80-125% of C, the mathematical relation holds, even if the clinical outcomes drift. This helps the defender of transitivity by allowing them to say the regulatory relation *is* transitive within its defined respect. However, it hurts the practical justification because the ultimate value judgment—clinical safety—is not respect-relative. Patients care about outcomes, not absorption ratios. Locating the tolerance inside a respect admits that the mapping from the transitive proxy to the non-transitive (or risk-sensitive) outcome is where the failure lies. It saves the logic of the regulation but concedes that the regulation does not guarantee the transitivity of the value it aims to protect. Thus, respect-relativity protects the consistency of the administrative rulebook but highlights the gap between regulatory logic and medical value.
