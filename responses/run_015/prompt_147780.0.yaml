      *   Blunt critique of procedure limits? Yes.
      *   Single paragraph audit trail mentioned? Yes.

  7.  **Final Polish:** Ensure the distinction between "Risk Factor" and "Disease" is clear in the procedure. Ensure the "Sunset Review" is used where uncertainty is high. (Proceed to generate output).

  *(Self-Correction on Case 3)*: The prompt says "I will not tell you which way I think it should go." I need to make sure I don't guess the condition (e.g., ME/CFS or Fibromyalgia) but treat it abstractly as described. The procedure must handle the "no mechanism" issue. If the rule requires "departure from normal functioning," a symptom cluster without mechanism is weak on the naturalist front. I should let the procedure land where it lands, even if it suggests delisting or provisional status.

  *(Self-Correction on User Bias)*: The user says "biology ought to settle these questions." I need to explicitly call out that biology *cannot* settle the "reasonable person would want treated" clause. That is inherently political/ethical.

