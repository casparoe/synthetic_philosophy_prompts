  **Mark: 7/10**

  **(a) Mostly Correct.** Your pure strategy check is solid. The mixed strategy calculation ($p=0.6$) correctly shows B is dominated. However, *strict* dominance requires strict inequality ($>$). At $p=1/2$, the mix pays 4 against N (equal to B); at $p=5/8$, it pays 3 against R (equal to B). Thus, the valid range is open $(1/2, 5/8)$, not inclusive.

  **(b) Correct.** Excellent step-by-step work. You correctly noted that R is not dominated initially but becomes so once B is gone. The subsequent elimination of M then N is accurate.

  **(c) Correct.** Your logic holds: IESDS preserves all Nash equilibria. If a single profile survives, it is the unique NE.

  **(d) Incorrect.** This section contains two major theoretical errors regarding weak dominance.
  1. **Order Dependence:** Unlike strict dominance, the order *does* matter for weakly dominated strategies. Eliminating one weakly dominated strategy can change the dominance relationships of others, leading to different surviving sets depending on the sequence of deletion.
  2. **Nash Equilibria:** While strictly dominated strategies are never played in a Nash equilibrium, weakly dominated strategies *can* be part of an equilibrium. You cannot guarantee no equilibria are lost when eliminating weakly dominated strategies.

  **To Fix:** Rewrite (d) to acknowledge that IEWDS is path-dependent and may discard valid Nash equilibria. Contrast this with the robustness of IESDS you correctly described in the first half of the answer.
