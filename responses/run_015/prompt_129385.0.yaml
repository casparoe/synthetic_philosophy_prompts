answer: |-
  ### Conceptual Preliminaries

  Before constructing the substantive argument, it is necessary to map the philosophical terrain regarding the specific distinctions required for this analysis.

  *   **Original versus Derived Intentionality:** Original intentionality is the intrinsic capacity of a mental state to be about something, independent of any external assignment of meaning. Derived intentionality is parasitic; it exists only in virtue of the original intentionality of agents who design or use the system (e.g., words, maps, or computer states).
  *   **The Intentional Stance:** This is the strategy of predicting a system's behaviour by treating it as a rational agent with beliefs and desires. For Dennett, if the stance works, the intentionality is real. For Searle, the stance is merely an heuristic tool used by an observer; it does not confer intrinsic ontology upon the system.
  *   **The Two-bitser Scenario:** A simple mechanism with four states (based on two bits of information). Dennett uses this to suggest that intentionality is not an all-or-nothing phenomenon but comes in degrees. A simple system has 'primitive' intentionality; complex systems have more robust intentionality.
  *   **Horizontal versus Vertical Integration:**
      *   *Horizontal:* Adding more components at the same functional level (increasing complexity parallelly).
      *   *Vertical:* Creating layers where one subsystem monitors, interprets, or regulates another (hierarchical structure).
  *   **The Core Hypothesis:** Vertical integration creates a regress of interpretation. If the interpreting layer is itself non-biological, it possesses only derived intentionality. Therefore, the hierarchy remains observer-relative throughout.

  ***

  ### The Illusion of Intrinsic Aboutness: A Defence of Biological Naturalism against the Two-bitser Hierarchy

  The debate between Daniel Dennett and John Searle regarding the nature of intentionality turns upon a fundamental ontological question: can syntax ever become semantics through complexity alone? Dennett's two-bitser thought experiment is frequently deployed to suggest that the distinction between original and derived intentionality is not sharp, and that sufficient functional integration can bridge the gap. However, a rigorous analysis of the structural composition of such systems reveals that this bridge is illusory. When we distinguish carefully between horizontal and vertical integration, it becomes evident that hierarchical composition produces only compound derived intentionality. This conclusion does not merely defend Searle's biological naturalism; it strengthens it by demonstrating that functional architecture, regardless of its sophistication, cannot escape observer-relativity without specific biological causal powers.

  To understand why the two-bitser fails to generate original intentionality, we must first accept the baseline ontological status of the component unit. A single two-bitser mechanism operates via physical states corresponding to binary inputs. Any 'aboutness' attributed to these states is derived from the designer who assigned specific conditions to specific states. There is nothing intrinsic to the physics of the switch that makes it represent 'price' or 'selection'; it is merely a causal linkage. Dennett argues that if we treat this system as having beliefs, and that treatment yields predictive success, then the beliefs are real. Yet, this conflates the utility of the description with the ontology of the described. The intentional stance is a tool employed by an observer; it does not penetrate the system to alter its intrinsic nature.

  The crux of the matter arises when we move from isolated units to integrated systems. We must distinguish between horizontal and vertical integration. Horizontal integration involves linking multiple two-bitser units to perform complex tasks in parallel. This increases causal complexity and behavioural sophistication, but it does not alter the ontological status of the components. A million switches interacting are still a million switches; their collective state is only 'about' the world in virtue of an external mapping provided by an observer. Horizontal complexity creates the appearance of intelligence, but it remains syntax without semantics.

  Vertical integration presents a more formidable challenge, as it mimics the structure of meta-cognition. In a vertically integrated hierarchy, one subsystem monitors or interprets the states of another. For instance, a higher-level module might read the state of a lower-level two-bitser and adjust its behaviour accordingly. It is tempting to argue that this internal interpretation constitutes original intentionality because the 'meaning' is being processed within the system, not merely by an external human. However, this reasoning commits a category error. The interpreting subsystem is itself a formal mechanism operating on syntactic rules. It manipulates symbols based on shape or voltage, not meaning. If the lower level has only derived intentionality, and the upper level interprets those symbols using only syntactic rules, the upper level's states are also derived. They are about the lower level's states only in virtue of the design architecture imposed by an external creator.

  Consequently, vertical integration creates merely the appearance of intrinsic aboutness. The interpreting subsystem lacks original intentionality; it is yet another layer of syntax. Therefore, the composite system's representational states are still only about something in virtue of being interpreted by an external observer or by a further interpretive layer. This leads to an infinite regress of derived intentionality unless the chain is grounded in something that possesses intrinsic aboutness. In a purely computational or mechanical hierarchy, there is no such ground. The system is 'dark' inside; no light of meaning is switched on by adding layers of interpretation upon interpretation.

  This analysis significantly strengthens Searle's biological naturalism rather than undermining it. Searle posits that original intentionality is a biological phenomenon, caused by specific causal powers of the brain. If even a maximally integrated, non-biological hierarchical system cannot escape observer-relativity, then it follows that original intentionality must depend on specific biological causal powers that are not replicable through functional architecture alone. The failure of the two-bitser hierarchy to generate semantics demonstrates that syntax, however layered, never becomes semantics. The gap is not one of degree, which Dennett suggests, but of kind. Biological organisms possess a first-person ontology that mechanical systems lack. By showing that functional complexity fails to produce this ontology, we isolate biology as the necessary condition for original intentionality.

  A standard objection to this position is that hierarchical functional integration generates genuinely novel causal powers absent from the individual components. Proponents of this view argue that just as wetness emerges from water molecules despite no single molecule being wet, original intentionality emerges from complex computational hierarchies. This objection, however, confuses causal complexity with intrinsic aboutness. Wetness is a causal power observable from the third-person perspective; it is a physical property. Original intentionality, by contrast, involves a first-person ontology—it feels like something to have a belief. Emergent causal powers in a computational system are still third-person phenomena. They explain how the system processes information, but they do not explain how the system experiences meaning. To argue that complexity generates original intentionality is to assume that quantity can transform into quality in a way that bypasses the need for a biological substrate. Yet, without an account of how subjective aboutness arises from objective syntax, this remains an article of faith rather than a philosophical conclusion.

  In conclusion, Dennett's two-bitser thought experiment, when analysed with sufficient precision, does not demonstrate that original intentionality can emerge from purely derived-intentionality components. Whether through horizontal expansion or vertical hierarchical integration, the system remains a manipulation of symbols devoid of intrinsic content. The interpreting layers are as empty of meaning as the layers they interpret. This failure underscores the validity of biological naturalism: original intentionality is not a function of computational depth but of biological nature. Until a system possesses the causal powers inherent to biological consciousness, it remains a vessel of derived intentionality, forever dependent on an observer to lend it meaning.
