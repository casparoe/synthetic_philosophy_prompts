answer: |-
  Good morning. Welcome.

  Looking around this room, I see a geography that doesn't usually map onto a single grid. On my left, I see people who spend their lives sharpening arguments until they can cut glass. On my right, I see people who spend their lives tending to souls, and in the back, I see family and friends who are just here to support the work. I'm a writer of stories, so I look at this mix and I see the setup for a novel: a group of strangers locked in a room, tasked with solving a mystery that might not have a solution.

  The title of this workshop is "Belief Without Ontology." I know that sounds like a dry academic puzzle. But what it means, simply, is this: Can we talk about God without treating God like a object hidden somewhere in the universe waiting to be found?

  We all know the usual fight. It happens at dinner parties and it happens in journals. One side says, "Show me the evidence. Is there a being up there? Yes or no?" The other side says, "You're missing the point. It's about meaning. It's about comfort. It's poetry."

  Usually, that's where the conversation dies. The first group thinks the second is deluded. The second group thinks the first is soulless.

  I want to propose a truce for the next few days. I want to suggest we borrow an idea from Hilary Putnam. He noticed that when we ask "Does God exist?" we are often treating religious language like failed science. We act as if "God" is a hypothesis about the physical world, like gravity or germ theory. And if you treat it that way, yes, it looks like bad science.

  But Putnam also warned against the other extreme. He said we shouldn't reduce religious language to "just feelings" or "just poetry." If I tell you I love you, I am not just describing my internal chemistry. I am making a claim on your life. I am obligating myself.

  He suggested that religious language is more like signing a promissory note. Or entering a covenant. When you sign a note, you aren't describing a pile of cash sitting on the table. You are committing to a future action. You only understand what that signature means from inside the practice of honoring it. If you stand outside the bank shouting "Show me the money!" you haven't understood what a promise is.

  So, here is the structural work I need this room to do. I am asking us to agree to two ground rules for this workshop.

  First, to my friends in philosophy and the skeptics: I am asking you to suspend the demand for empirical verification. Please, do not ask if a prayer is "true" in the same way you would ask if a statement about chemistry is true. If we spend these days trying to locate God as a physical entity, we will leave here exactly where we started.

  Second, to my friends in the clergy and the believers: I am asking you to resist the urge to say "it's all subjective." Do not protect your faith by shrinking it down to mere psychology. When you speak of the divine, you are speaking of obligations, of realities that hold weight even when you aren't feeling them. Do not apologize for that weight by calling it a metaphor.

  This is the middle path. It is narrow. It requires us to treat religious language as serious, as binding, and as real, without demanding that it function like a telescope or a microscope.

  As a novelist, I deal in truths that aren't facts. When I write that a character was broken-hearted, I cannot prove it empirically. But if I reduce it to "their serotonin levels dropped," I have lost the truth of the story. We are here to talk about the truth of the story without pretending it's a physics equation.

  We have family in the room who might not know a language-game from a hole in the ground. That is good. Keep us honest. If we start speaking in code, stop us. Because this isn't about code. It's about how human beings live with the ultimate questions.

  Putnam argued that we understand these commitments from the inside. So, let's step inside. Let's agree that for the next few days, we are not judges standing outside the building inspecting the foundation. We are tenants discussing how to live in the house.

  If we can do that, if we can stop trying to verify the promise and start trying to understand what it promises, then I think we might actually say something new.

  Thank you. Let's begin.
