answer: |-
  Based on your sister's track record, her moral psychology is not governed by a single consistent theory (like strict utilitarianism or rigid rights-based deontology). Instead, she operates using heuristics that shift depending on context, scale, and certainty. Here is an analysis of how her precedents apply to the larvae proposal.

  ### Two Plausible Rules

  To make sense of her conflicting verdicts (saving the beetle vs. spraying aphids; unease about crickets vs. eating them), we can distill two competing rules she seems to follow:

  **1. The Relational Threshold Rule (Context & Directness)**
  *   **Principle:** Moral consideration depends on the *relationship* to the human and the *certainty* of sentience. Vertebrates and cephalopods (dogs, crows, octopuses) cross a high threshold. Invertebrates are generally below the threshold *unless* encountered directly where avoidance is low-cost (the beetle). Pests threatening human interests (aphids, mosquitoes) are exempt.
  *   **Prediction for Larvae:** She should **support** (or accept) the proposal. The larvae are invertebrates used for food (like crickets), not pets or wild wildlife. Since she eats crickets despite her unease, this rule suggests she accepts the farming of invertebrates as a systemic necessity. The fact that they replace chickens (high-threshold animals) makes this an even clearer "win" under this rule.

  **2. The Precautionary Aggregation Rule (Probability × Scale)**
  *   **Principle:** Moral weight is calculated by multiplying the *probability of sentience* by the *number of individuals*. Even a low probability matters if the numbers are vast (explaining her cricket unease). When uncertainty exists, the "step around the beetle" heuristic applies: if the cost to avoid harm is societal rather than individual, we should still avoid creating vast systems of uncertain suffering.
  *   **Prediction for Larvae:** She should **oppose** (or demand a moratorium on) the proposal. One trillion larvae $\times$ 10% probability = 100 billion "sentient-equivalents." This massively triggers her "cricket unease." The explicit 10% estimate removes the ambiguity she had with crickets, forcing the precautionary principle she used for the beetle onto an industrial scale.

  ### Closest Analog
  The **cricket farming** case is the closest analog. Both involve farming invertebrates for protein on a massive scale.
  *   *Similarity:* Invertebrate, farmed for food, vast numbers.
  *   *Difference:* The cricket case was vague ("can't articulate why"), whereas the larvae case has a specific probability estimate (10%). The larvae case also offers a trade-off (replacing chickens), which the cricket case did not explicitly state.

  ### Best Guess at Her Actual Verdict
  **She will likely oppose the proposal (or advocate for strict regulation halting it), despite the chicken replacement.**

  **Reasons:**
  1.  **Crystallized Unease:** Her unease about crickets was vague because the sentience was unknown. The 10% estimate for the larvae makes the risk concrete. Given she steps around a *single* beetle "just in case," a *billion-fold* increase in that "just in case" risk will likely overwhelm her pragmatic acceptance of cricket eating.
  2.  **The "Systemic Harm" Trigger:** While she kills aphids, that is defensive (protecting plants). The larvae farm is *offensive production* of potential suffering. Her ecological restoration background likely makes her sensitive to industrial systems that treat living things as mere units, even if they are small.
  3.  **The Chicken Trade-off is Insufficient:** While replacing chickens reduces *known* suffering, her moral framework isn't purely utilitarian. If it were, she wouldn't be uneasy about crickets while eating them. She likely views the *act* of mass-farming uncertain sentients as intrinsically problematic, regardless of what it replaces.

  ### Honest Assessment: Underdetermination
  **Yes, her precedents genuinely underdetermine this verdict.**
  Her behavior is contradictory. She *eats* the crickets (action) despite feeling *uneasy* (judgment). She kills *aphids* by the thousands (systemic) but saves a *beetle* (individual).
  *   **If she supports the project,** she is adopting the principle of **Lesser-Evil Utilitarianism**: *Minimize total known suffering (chickens) even if it risks creating vast uncertain suffering (larvae).*
  *   **If she opposes the project,** she is adopting the principle of **Precautionary Deontology**: *Do not build systems that instrumentalize potential sentience, regardless of the net utilitarian benefit.*

  ### The Distinguishing Case
  To tell which rule she actually holds (Relational Threshold vs. Precautionary Aggregation), present her with this case:

  **The "Restoration Trade-off" Case:**
  > *In your work restoring a wetland, you have two options. Option A: Use a biological control that releases 1 million parasitic wasps (10% chance of minimal sentience) to save 100 endangered frogs (100% high sentience). Option B: Do nothing, the frogs die, but the wasps are not released.*

  *   **Relational Threshold Rule:** Choose **Option A**. The frogs are high-threshold vertebrates; the wasps are low-threshold invertebrates. Saving the frogs is the priority.
  *   **Precautionary Aggregation Rule:** Hesitate or Choose **Option B**. 1 million wasps $\times$ 10% = 100,000 sentient-equivalents harmed to save 100 frogs. If the "cumulative weight" of the wasps outweighs the frogs, she should stop.

  If she releases the wasps without blinking, she follows the Threshold Rule (and should support the larvae farms). If she hesitates because of the wasp numbers, she follows the Aggregation Rule (and should oppose the larvae farms).
