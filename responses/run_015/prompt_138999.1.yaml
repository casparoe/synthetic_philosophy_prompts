  *(Self-Correction on the TA's "Backwards" comment)*: Why would the TA say the last sentence is backwards? "You have to be good, and you also have to be lucky." Maybe she means Machiavelli argues you must be willing to be *bad* to overcome luck? Or that luck is the dominant force unless *virtù* counters it? Actually, the most likely reason a Republican scholar says it's backwards is that Machiavelli argues *virtù* (specifically institutional) is the primary driver of stability, and relying on luck is the path to ruin. Or, more simply, Machiavelli says you must be willing to *not* be good. I will focus on the moral definition of "good."

