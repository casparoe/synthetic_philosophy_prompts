      *   *Philosophical Zombies (P-Zombies):* Chalmers' concept. Usually applied to humans to argue against physicalism. If a human can be a zombie, behavior isn't enough for consciousness.
      *   *AI Consciousness:* Turing Test, Chinese Room (Searle). Searle explicitly argues biology matters (biological naturalism).
      *   *Moral Status:* Sentience vs. Species Membership (Speciesism).
      *   *The User's Point:* If behavior is identical, why the differential treatment based on substrate (biology vs. silicon)?
      *   *Potential Terms:* "Substrate Chauvinism," "Biological Naturalism," "Carbon Chauvinism," "The Bio-Intuition," "Dual-Process Asymmetry."

