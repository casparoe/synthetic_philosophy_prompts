answer: |-
  # Mechanistic Identity Verification Protocol (MIVP) v4.2

  **Purpose:** To determine if a detected anomaly instantiates a catalogued failure mechanism, authorizing existing containment protocols.
  **Constraint:** 30-minute execution window. No external literature.
  **Decision Logic:** A "Same Mechanism" verdict requires affirmative clearance on all mandatory steps. A single negative verdict mandates **Full Root-Cause Investigation (FRCI)**. Ambiguity triggers **Risk Hand-off**.
  **Philosophical Basis:** Mechanistic identity is defined by organizational continuity and counterfactual stability, not merely functional output or physical substrate.

  ### The Procedure (6 Steps)

  **Step 1: Functional Phenotype Match (Functional Profile)**
  *   **Question:** Does the observable error output (signal signature, timing, magnitude) match the catalogued failure within 5% tolerance?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI.
  *   **Ambiguous:** Hand-off to Risk Officer.

  **Step 2: Causal Topology Check (Organizational Closure)**
  *   **Question:** Is the logical arrangement of entities and activities (e.g., serial, parallel, feedback loop, hierarchy) isomorphic to the catalogued mechanism?
  *   **Yes:** Proceed to Step 3.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI.
  *   **Ambiguous:** Hand-off to Risk Officer.

  **Step 3: Intervention Stability Test (Counterfactual Dependency)**
  *   **Question:** Do interventions on the suspected causal nodes (e.g., removing a component, damping a signal) produce the same change in error behavior as recorded in the catalogued case?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI.
  *   **Ambiguous:** Hand-off to Risk Officer.

  **Step 4: Role Mapping Abstraction (Component Correspondence)**
  *   **Question:** Can the physical components be mapped to the same functional roles, even if materials or substrates differ?
  *   **Yes:** Proceed to Step 5.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI. *(See Simplification Rule A)*.
  *   **Ambiguous:** Hand-off to Risk Officer.

  **Step 5: Propagation Boundary Check (Organizational/Counterfactual)**
  *   **Question:** Does the failure propagate to downstream systems in the same pattern and scope as the catalogued case?
  *   **Yes:** Proceed to Step 6.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI.
  *   **Ambiguous:** Hand-off to Risk Officer.

  **Step 6: Containment Applicability (Pragmatic Check)**
  *   **Question:** Will the existing containment protocol physically and logically interface with the current system without causing secondary failures?
  *   **Yes:** **Verdict: Same Mechanism.** Apply Containment.
  *   **No:** **STOP.** Verdict: **Novel Mechanism.** Initiate FRCI.
  *   **Ambiguous:** Hand-off to Risk Officer.

  ---

  ### Operational Simplifications (Time-Pressured Settings)

  In scenarios where data for all steps is unavailable within 30 minutes, the following simplifications apply without destroying the core mechanistic concept:

  1.  **Simplification Rule A (Component Abstraction):** Step 4 (Component Correspondence) may be **skipped** if Steps 2 (Topology) and 3 (Intervention) are strong "Yes." This acknowledges *multiple realizability*: distinct physical parts can instantiate the same mechanism if the organization and causal powers are identical.
  2.  **Simplification Rule B (Functional Heuristic):** Step 1 (Functional Phenotype) cannot be skipped. Functional divergence is a necessary condition for mechanistic difference.
  3.  **Simplification Rule C (Counterfactual Sampling):** Step 3 (Intervention) requires only *one* critical intervention match if the causal graph is well-understood. Full mapping is not required.

  **Note on Ambiguity:** If a step yields "Ambiguous," the protocol halts. The Lead Officer and Risk Officer must decide based on **Risk Tolerance**, not mechanistic fact. Given asymmetric stakes (risk propagation > shutdown cost), ambiguity defaults to **FRCI**.

  ---

  ### Case Applications

  #### Case 1: Swarm Navigation vs. Hierarchical Controller
  *   **Context:** Timing desynchronization. Error signature matches prior hierarchical failure. Architecture is Peer-to-Peer (P2P). Removing a node (P2P) does not stop failure; removing central controller (Hierarchical) did stop prior failure.
  *   **Execution:**
      *   Step 1 (Functional): **Yes** (Exact error signature).
      *   Step 2 (Topology): **No** (P2P is not isomorphic to Hierarchy).
      *   Step 3 (Intervention): **No** (Removing node $\neq$ Removing center).
  *   **Verdict:** **Novel Mechanism.** (Process stops at Step 2).
  *   **Judgment Flag:** None. Algorithmic output is clear.
  *   **Resistance:** **High.** The team will resist this verdict. The error signature is *exact*, and the cost of FRCI is a three-week fleet shutdown. Engineers will argue Step 1 should suffice. However, the procedure forces recognition that the *cause* is structurally different (distributed emergence vs. central bottleneck), meaning the existing containment (likely patching the central controller) will fail.
  *   **Outcome:** Unwanted Shutdown enforced by protocol.

  #### Case 2: Bio-Hybrid vs. Mechanical Actuator
  *   **Context:** Thermal stress failure. Output identical to mechanical case. Components differ (Bio vs. Metal). Organizational boundaries and intervention patterns are isomorphic.
  *   **Execution:**
      *   Step 1 (Functional): **Yes**.
      *   Step 2 (Topology): **Yes** (Isomorphic entity-activity mapping).
      *   Step 3 (Intervention): **Yes** (Isomorphic intervention-response).
      *   Step 4 (Component): **No** (Physical parts differ).
      *   *Apply Simplification Rule A:* Since Steps 2 & 3 are "Yes," Step 4 is skipped.
      *   Step 5 (Propagation): **Yes**.
      *   Step 6 (Containment): **Yes**.
  *   **Verdict:** **Same Mechanism.**
  *   **Judgment Flag:** Step 4 required procedural override (Simplification Rule A).
  *   **Resistance:** **Moderate.** Safety engineers may resist applying a mechanical patch to a bio-hybrid system fearing material degradation not captured by organizational maps. However, the protocol validates *mechanistic identity* over *material identity*.
  *   **Outcome:** Containment permitted.

  #### Case 3: Cognitive Architecture (Missing Feedback)
  *   **Context:** Misclassification pattern identical. Intermediate representations identical. Feedback loop for error correction absent in new architecture.
  *   **Execution:**
      *   Step 1 (Functional): **Yes**.
      *   Step 2 (Topology): **No** (Missing feedback loop alters organizational closure).
      *   Step 3 (Intervention): **No** (Error propagation differs across nearby-world variations due to lack of correction).
  *   **Verdict:** **Novel Mechanism.** (Process stops at Step 2).
  *   **Judgment Flag:** None.
  *   **Resistance:** **Low.** The absence of a feedback loop is a clear structural deviation that engineers recognize as high-risk for error propagation.
  *   **Outcome:** Investigation mandated.

  ---

  ### Limitations and Override Conditions

  **1. Blindness to Emergent Novelty:**
  The MIVP is blind to *phase-transition* failures where the mechanism only exists at a scale larger than the sum of interventions tested in Step 3. If the failure arises from complex adaptive behaviors not captured by local node interventions, the protocol may falsely classify a Novel Mechanism as "Same."

  **2. Distortion via Simplification:**
  Simplification Rule A (skipping Component Correspondence) distorts the philosophical account when *material properties* are causally relevant to the failure (e.g., thermal fatigue, quantum decoherence). In these cases, organizational isomorphism is insufficient for identity. The procedure assumes functional roles abstract away from substrate, which is not always physically true.

  **3. Override Conditions:**
  The Lead Officer must override the MIVP output entirely under the following conditions:
  *   **Catastrophic Potential:** If the failure mode involves loss of human life or irreversible environmental damage, ambiguity defaults to FRCI regardless of Step 6.
  *   **Known Substrate Sensitivity:** If the catalogued mechanism is known to be substrate-dependent (e.g., specific metal fatigue), Simplification Rule A is voided; Step 4 becomes mandatory.
  *   **Protocol Drift:** If three consecutive "Same Mechanism" classifications result in containment failure, the MIVP is suspended for review.

  **4. The Risk Hand-off:**
  When the procedure triggers a Hand-off (Ambiguity), the dispute is no longer about *what the mechanism is*, but *how much risk we accept*. The protocol cannot resolve this; it merely isolates it for leadership accountability.
