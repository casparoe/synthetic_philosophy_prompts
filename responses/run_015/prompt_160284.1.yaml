answer: |-
  **1. The Finger vs. The Migraines**
  One person will lose a finger. One million people will get a mild migraine. You can prevent one outcome, but not both. Which do you prevent?
  *   **Prevent Finger Loss** → Go to Question 2.
  *   **Prevent Migraines** → Go to Question 5.

  **2. The Single Life (Within-Person)**
  One person suffers one million minor annoyances over a year. Another person loses a finger. Which is worse?
  *   **Losing a Finger is Worse** → Go to Question 3.
  *   **One Million Annoyances are Worse** → Go to Question 4.

  **3. The Risky Policy (Individualist)**
  A policy imposes a 1-in-1,000,000 risk of death on 1,000,000 people (statistically one death) vs. one person certain death. Is the policy permissible?
  *   **No (Must Save the Certain Victim)** → **Leaf 1: Strict Ex Post Individualism**
  *   **Yes (Risk is Permissible)** → **Leaf 2: Strict Ex Ante Individualism**

  **4. The Timing of Harm (Within-Person)**
  Are the one million annoyances worse only if they happen all at once, or even if spread over a lifetime?
  *   **Only If Simultaneous** → **Leaf 3: Simultaneous Within-Person Aggregator**
  *   **Even If Spread Over Life** → **Leaf 4: Diachronic Within-Person Aggregator**

  **5. The Invisible Harm (Threshold)**
  One billion people get a harm so small they never notice it (e.g., dust on windshield). One person gets a broken arm. Which is worse?
  *   **Broken Arm is Worse** → Go to Question 6.
  *   **One Billion Dust Specks are Worse** → Go to Question 7.

  **6. The Equal Lives (Tie-Breaker)**
  Two people will die unless you save one. Saving Person A also means 1,000 others avoid a migraine. Saving Person B means no migraines avoided. Who do you save?
  *   **Flip a Coin (Numbers Don't Matter)** → Go to Question 8.
  *   **Save Person A (Numbers Matter)** → Go to Question 9.

  **7. The Benefit Split (Symmetry)**
  Option A: 60% of people get a small bonus. Option B: 40% of people get a life-saving benefit. You must choose one.
  *   **Choose Option A (60% Win)** → **Leaf 5: Symmetric Summation**
  *   **Choose Option B (40% Win)** → **Leaf 6: Prioritarian Summation**

  **8. The Risky Tie-Breaker**
  Same as Question 6, but the 1,000 migraines are now a 1/1,000 risk of death for 1,000 people. Do numbers matter?
  *   **No (Coin Flip)** → **Leaf 7: Tie-Breaker Ex Post**
  *   **Yes (Save the Many)** → **Leaf 8: Tie-Breaker Ex Ante**

  **9. The Source of Numbers**
  When numbers matter (as in Question 6), is it because each person's complaint adds up, or because fairness requires it?
  *   **Fairness Requires It (Separate Principle)** → **Leaf 9: Hybrid Fairness View**
  *   **Complaints Add Up (Individual Complaint)** → Go to Question 10.

  **10. The Risky Complaint**
  A policy gives 1 million people a 1/1,000,000 risk of death vs. one person certain death. Does the risk count as a complaint?
  *   **No (Only Certain Harm Counts)** → **Leaf 10: Ex Post Complaint View**
  *   **Yes (Risk Itself is a Complaint)** → Go to Question 11.

  **11. The Benefit/Harm Asymmetry**
  Option A: 60% get a small benefit. Option B: 40% avoid a huge harm. Do numbers weigh the same in both cases?
  *   **No (Harms Outweigh Benefits)** → **Leaf 11: Asymmetric Complaint View**
  *   **Yes (Numbers Work Same Way)** → Go to Question 12.

  **12. The Pairwise Sweep**
  60% are slightly worse off under Policy X. 40% are massively worse off under Policy X. Does Policy X win because the majority loses less?
  *   **No (Strength of Complaint Wins)** → **Leaf 12: Strongest Complaint View**
  *   **Yes (Majority Count Wins)** → **Leaf 13: Pairwise Majority View**

  ***

  ### Global Notes & Logical Space Map

  **Unseparable Leaves:**
  *   **Leaf 10 (Ex Post Complaint) vs. Leaf 7 (Tie-Breaker Ex Post):** These views often yield identical verdicts in practice. The distinction is theoretical (whether numbers *never* matter vs. whether risk complaints *never* count).
  *   **Leaf 5 (Symmetric Summation) vs. Leaf 13 (Pairwise Majority):** In most real-world cases, summing utilities and counting pairwise winners produce the same result. They diverge only in cases of extreme intensity vs. extreme numbers.

  **Empty Cells (Positions Nobody Holds):**
  *   **Across-Person Aggregation Yes / Within-Person Aggregation No:** (Path: Q1 Save Million → Q2 Save Finger). *Why empty?* Incoherent. If harms can sum across persons, it is logically difficult to explain why they cannot sum across time within a single person.
  *   **Threshold Yes / Numbers Tie-Breaker No:** (Path: Q5 Save Arm → Q6 Coin Flip). *Why empty?* Merely unattractive. If you accept a threshold for small harms, you usually accept that numbers matter above the threshold; denying both looks like arbitrary stubbornness.
  *   **Symmetric Benefits / Asymmetric Harms:** (Path: Q11 Yes → Q12 No). *Why empty?* Unwritten. Most views assume symmetry in the *mechanism* (aggregation) even if they weight harms heavier. A view that aggregates benefits but refuses to aggregate harms lacks a unified principle of complaint.

  **Cases Handled Badly:**
  *   **The "Identifiable Victim" Effect:** The tree assumes students answer based on principle, but psychological salience of the single victim may skew answers in Q1 and Q6 regardless of theoretical commitment.
  *   **Continuous vs. Discrete Harm:** The tree treats harms as discrete (finger, migraine). It struggles to locate views that see harm as a continuous scalar where "one big harm" is just a conceptual fiction for many small neural events.
