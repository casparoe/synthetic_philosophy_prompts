      *   *The Trojan War Example:* Thucydides *does* discuss the Trojan War (1.3-12). He doesn't reject it as fiction. He accepts it happened but recalibrates the scale. He argues Agamemnon's force was smaller than Homer claims based on logistical constraints (funding, supply). This is crucial: He treats legend as *history* but strips away the *mythos*.

