          *   *Key Insight:* Knowledge is *factive* and *introspective* (usually). Measurement is factive but *not* necessarily introspective in the same way. But the proof only uses factivity and distribution.
          *   *Crucial Distinction:* The operator $O$ must be *stable* under the modal operator $\Diamond$.
