      *   The Generalization fails because it assumes the "in principle" claim applies to *all* truths, including those whose truth conditions are destroyed by the operation $O$ itself.
      *   *Diagnosis:* The User's Diagnosis #1 is correct, but needs sharpening. It's not that they "fall outside the range," it's that they are not the *kind* of truths the Observability Creed protects. The Creed is about *worldly* facts, not *epistemic* facts.

