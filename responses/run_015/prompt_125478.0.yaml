      *   *So why does the paradox bite Measurement?* Because the principle $\forall p (p \to \Diamond M p)$ is actually *false* for measurement in a way that differs from knowledge.
      *   *Wait, the User wants to keep the Observability Creed:* "No physical fact is such that no possible observation could even bear on it."
      *   *Is that the same as $\forall p (p \to \Diamond M p)$?*
          *   "Observation could bear on it" $\neq$ "It is possible to measure that $p$."
          *   "Bear on" implies evidence. "Measure that $p$" implies verifying $p$ conclusively.
          *   *Diagnosis:* The Observability Creed is weaker than the Knowability Principle. The Creed says "evidence is possible." The Principle says "verification is possible."
      *   *But let's assume the User equates them for the sake of argument.*
      *   *The Real Fix:* The operator $O$ must be **temporally stable** or **non-factive in the relevant sense** or the quantification is restricted.
      *   *Actually, the standard philosophical consensus:* The Knowability Principle (1) is false. We must reject it. But we don't have to reject *all* knowability. We restrict the domain.
