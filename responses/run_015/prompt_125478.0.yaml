      *   **Conclusion:** The generalization is a genuine logical result, but it reveals a limit on the *scope* of the "in principle" claim, not a refutation of the claim for physical facts. The "Observability Creed" should be formulated as "For every *physical state* $q$, $\Diamond Mq$," not "For every *truth* $p$, $\Diamond Mp$."

