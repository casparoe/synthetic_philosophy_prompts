answer: |-
  There isn't a single canonical term in the literature that captures this specific *rhetorical-ontological* maneuver, though it is a composite of several known fallacies. The closest academic relative is the **Jingle Fallacy** (assuming two things are the same because they share a name), but that doesn't capture the *directional flow of authority* you're describing. "Reification" or "Hypostatization" covers the treating-of-abstractions-as-concretes, but misses the *migration* from informal to formal domains.

  I propose we coin this **Ontological Smuggling**.

  Here is the carving of the concept, its boundaries, and how it distinguishes itself from adjacent reasoning patterns.

  ### The Term: Ontological Smuggling

  **Definition:** Ontological Smuggling occurs when a folk-psychological observation or local heuristic is illicitly re-categorized as a formal psychological construct (a "natural kind") to inherit the epistemic warrant, defensive immunity, and mechanistic authority of the formal domain, without satisfying the evidentiary burdens required for entry into that domain.

  **The Mechanism:**
  1.  **Observation:** A pattern is noticed (e.g., "people stick to bad careers").
  2.  **Labeling:** It is named using the lexical markers of cognitive science (e.g., "Career Status-Quo Bias").
  3.  **Smuggling:** The label is treated not as a metaphor, but as a *taxonomic membership claim*. The concept is moved from the "informal observation" bucket to the "validated cognitive bias" bucket.
  4.  **Warrant Inheritance:** Arguments for interventions now cite Kahneman/Tversky literature. The concept gains the "truth by association" of the formal literature.
  5.  **Defensive Retreat:** When challenged on the lack of specific validation, the defender retreats to the fuzzy boundaries of the formal bucket ("System 1 is messy"), effectively using the formal category's complexity as a shield against falsification.

  ### The Edges: How It Differs

  To ensure this isn't just a grab-bag of "bad reasoning," we must distinguish it from three legitimate or adjacent moves.

  **1. Vs. Analogical Reasoning**
  *   **Analogy:** "This career behavior *functions like* status-quo bias."
  *   **Smuggling:** "This career behavior *is an instance of* status-quo bias."
  *   **The Boundary:** Analogy claims *similarity of structure*; Smuggling claims *identity of kind*. If the writer explicitly frames the concept as a metaphor or model to be tested, it is analogy. If they frame it as an established causal mechanism that *explains* the behavior by virtue of its name, it is smuggling.

  **2. Vs. Family Resemblance (Wittgensteinian Defense)**
  *   **Family Resemblance:** "There is no single essential feature of 'games' (or 'biases'), but a network of overlapping similarities."
  *   **Smuggling:** This move strategically *denies* family resemblance when claiming authority, and *asserts* it when dodging critique.
  *   **The Boundary:** A Wittgensteinian approach is consistent: it admits fuzziness upfront. Ontological Smuggling is inconsistent: it demands the precision of a natural kind when prescribing solutions ("We must debias this") but demands the fuzziness of a family resemblance when evaluating evidence ("Bias is bias, it's hard to measure"). It is a **Motte-and-Bailey played on ontology**.

  **3. Vs. Auxiliary-Hypothesis Tweaking**
  *   **Auxiliary Hypothesis:** "Our theory of bias is correct, but we need to adjust for this specific contextual variable (e.g., high stakes)."
  *   **Smuggling:** "Our *term* is valid, but the criteria for what makes the term valid are flexible."
  *   **The Boundary:** Auxiliary tweaking adjusts the *parameters* of a theory to save it from falsification. Ontological Smuggling adjusts the *epistemic status* of the term itself to avoid the need for falsification. It changes the rules of evidence, not the variables of the model.

  ### Where It Stops (The Carving)

  Ontological Smuggling stops being this specific failure mode and becomes legitimate theory-building at two specific points:

  1.  **Predictive Rent:** The moment the "local bias" generates novel, falsifiable predictions that are *not* entailed by the parent formal theory. If "Career Status-Quo Bias" predicts a specific failure mode in negotiation that standard "Status-Quo Bias" does not, and this is empirically verified, the concept has earned its own ontological weight. It is no longer smuggling; it is **differentiation**.
  2.  **Explicit Provisionality:** The moment the author explicitly labels the concept as a "working heuristic" or "folk model" and disclaims the authority of the formal literature. If they say, "This acts *as if* it were a bias, let's test it," they are engaging in **hypothesis generation**, not smuggling.

  ### Summary
  You are observing **Ontological Smuggling**: the illicit transfer of a concept across the boundary between *phenomenological description* and *causal mechanism* to exploit the epistemic authority of the latter. It is distinct from analogy because it claims category membership; distinct from family resemblance because it applies the definition opportunistically; and distinct from auxiliary tweaking because it modifies the standards of evidence rather than the model parameters. It ceases to be smuggling once the concept pays "predictive rent" or explicitly disclaims formal status.
