answer: |-
  You have identified one of the most persistent and contested knots in modern moral philosophy. You are describing a phenomenon that sits right on the fault line between **Deontology** (duty-based ethics) and **Consequentialism** (outcome-based ethics), and it is central to the debate over **Moral Dilemmas**.

  The established term for this is **Moral Residue** (sometimes called **Moral Remainders**).

  However, "Moral Residue" is often used loosely to describe the *feelings* involved. You are pointing to something sharper: the **Normative Residue** of a **Justified Infringement**. To survive your teacher's scrutiny, you need to carve this concept precisely, distinguishing the *normative debt* from the *psychological feeling*, and explaining why it matters for the existence of genuine dilemmas.

  Here is the carving you need.

  ### 1. The Name and The Lineage
  The concept is most rigorously discussed under the heading of **Moral Residue**, but its theoretical backbone comes from **W.D. Ross's** distinction between *prima facie duties* and *all-things-considered duties*, and **Bernard Williams's** concept of **Agent-Regret**.

  *   **W.D. Ross (1930):** Argued that we have multiple duties (fidelity, gratitude, justice) that can conflict. When you fulfill one, you may unavoidably violate another. The violation doesn't disappear just because you had a good reason.
  *   **Bernard Williams (1981):** Argued that even when an agent makes the right choice, they may experience "agent-regret"—a special kind of regret distinct from remorse, tied specifically to the fact that *they* were the one who did it.
  *   **Ruth Barcan Marcus (1980):** Argued that the existence of this residue is proof that **genuine moral dilemmas** exist (i.e., situations where you inevitably do something wrong, even if you do the *best* thing).

  ### 2. The Carving: What It Is and Isn't
  To define this precisely, you must separate the **Normative Claim** from the **Psychological State**.

  **What it IS (Normative Moral Residue):**
  It is a **directed, dischargeable obligation** that survives a justified choice.
  *   **Directed:** It is owed *to* the specific person/claim that was overridden (your friend, not the universe).
  *   **Dischargeable:** It can be "paid off" through future action (apology, compensation, priority next time).
  *   **Reason-Giving:** It provides a genuine moral reason for future action, independent of your feelings.

  **What it IS NOT:**
  *   **It is not Guilt:** Guilt implies you are blameworthy or did something you shouldn't have done. You are confident you did the *right* thing overall. Residue exists without blameworthiness.
  *   **It is not Simple Regret:** Regret is wishing the situation hadn't occurred. Residue is an active debt. You can regret a storm damaged your roof; you don't owe your roof an apology.
  *   **It is not Sadness:** Sadness is a passive state. Residue demands action (reparation).
  *   **It is not "Moral Cost" (Utilitarian view):** A utilitarian might say you "paid a cost" in utility. But costs are impersonal. Your residue is *directed* at the friend. That relational element is key.

  ### 3. Addressing Your "Bits I Can't Fit"
  Your intuitions about the edges of this concept are actually sophisticated philosophical objections to simpler theories. Here is how the literature handles them:

  **A. The Knowledge Condition (Does the friend need to know?)**
  *   *Your intuition:* The debt exists even if she never knows.
  *   *The Carving:* This supports a **Relational Duty** view (like T.M. Scanlon's). The duty is about the *status of your relationship*, not her feelings. If you break a promise, you alter the normative standing between you, regardless of her epistemic state.
  *   *Boundary Case:* If you promise a dead person to water their plants, and you don't, the residue remains. The "creditor" is gone, but the debt persists (often discharged by donating to a cause they loved). This proves the residue is objective, not just about managing someone else's emotions.

  **B. The Agency Condition (Choice vs. Coin Flip)**
  *   *Your intuition:* Residue is heavier if *you* chose than if chance decided.
  *   *The Carving:* This is **Bernard Williams's Agent-Regret**. Moral residue attaches to **agency**. If a rock falls and blocks one friend's path, you owe neither friend an apology. If *you* become the rock by choosing, you have authored the harm.
  *   *Why it matters:* This distinguishes Moral Residue from **Tragic Loss**. In a tragedy, value is destroyed. In Moral Residue, *you* are implicated in the destruction of value. The "debt" is the price of your agency.

  **C. The Weight Condition (Obvious vs. Even Match)**
  *   *Your intuition:* Residue shrinks if the choice was obvious; grows if claims were equal.
  *   *The Carving:* This tracks the **Strength of the Overridden Duty**.
      *   If Friend A needs a ride to the airport and Friend B needs a ride to the movies, the duty to B is very weak. Overriding it leaves little residue.
      *   If both need rides to funerals, the duties are equal. Overriding one is a significant moral infringement, leaving heavy residue.
  *   *Why this is odd for a "Debt":* You noted debts don't usually shrink because paying was easy. But this isn't a commercial debt; it's a **Restitutive Duty**. The magnitude of restitution required is proportional to the magnitude of the infringement.

  ### 4. The Big Question: Does This Prove Genuine Dilemmas?
  This is the crux of your project. Does the existence of Normative Moral Residue prove that you did something *wrong* (a genuine dilemma), or can it be explained away?

  **View A: The Pluralist / Dilemma Defender (Yes, it proves wrongness)**
  *   *Argument:* If there is a genuine debt, a duty must have been violated. You cannot owe reparations for doing the *only* right thing. Therefore, in choosing Friend A, you *wronged* Friend B, even if you were justified overall.
  *   *Implication:* Morality is messy. You can be "all-things-considered right" but still "pro tanto wrong." (This is the Ross/Marcus view).
  *   *Support for your project:* This validates your intuition that the apology is *owed*, not just polite.

  **View B: The Monist / Explanation-Awayer (No, it's psychological/heuristic)**
  *   *Argument:* There is only one true duty: do the best thing. You did the best thing. Therefore, you did no wrong. The "residue" is just a useful psychological heuristic to keep you sensitive to moral costs, or a way to maintain social relationships. It feels like a debt, but it isn't one.
  *   *Implication:* Moral dilemmas are impossible. There is always one right answer. The residue is "Moral Schizophrenia" (Michael Stocker's term)—a disconnect between your theory (I did right) and your feelings (I feel bad).
  *   *Counter-argument to your project:* A strict monist would say your urge to apologize is merely instrumental (to keep the friendship working), not normative (because you owe it).

  **View C: The Infringement View (The Middle Ground)**
  *   *Argument:* You didn't do "wrong" (which implies blameworthiness), but you did commit an **infringement**. Think of it like self-defense. If you break someone's arm to save their life, you are justified, but you still owe them medical bills. You didn't do "wrong," but you incurred a **liability**.
  *   *Implication:* This preserves the "debt" without requiring the label of "sin" or "wrongdoing."

  ### 5. Summary for Your Project
  If your teacher asks for a label, use **Normative Moral Residue following a Justified Infringement**.

  **The Definition:**
  > A persisting, directed obligation to make reparation that arises when an agent permissibly overrides one moral claim to fulfill a more pressing one, distinct from guilt or regret because it survives the justification of the act.

  **The Test Cases (Boundary Conditions):**
  1.  **The Coin Flip:** If chance decides, residue vanishes. (Proves it requires Agency).
  2.  **The Secret:** If the victim never knows, residue remains. (Proves it is Objective/Relational, not Reputational).
  3.  **The Bystander:** A bystander feels sadness, but no debt. (Proves it requires Authorship).

  **The Conclusion on Dilemmas:**
  The existence of Normative Moral Residue suggests that **monistic ethical theories (like strict Utilitarianism) are descriptively inadequate.** They cannot account for the "debt" without calling it an illusion. Whether this proves "genuine dilemmas" depends on whether you define "wrong" as "blameworthy action" (No) or "infringement of a valid claim" (Yes). Your project should argue that the latter definition is more honest to moral experience.

  ### Recommended Reading for Your Bibliography
  *   **W.D. Ross,** *The Right and the Good* (1930) – specifically on *Prima Facie Duties*.
  *   **Bernard Williams,** "Moral Luck" (1981) – specifically the essay on *Agent-Regret*.
  *   **Ruth Barcan Marcus,** "Moral Dilemmas and Consistency" (1980) – argues residue proves dilemmas are real.
  *   **Martha Nussbaum,** *The Fragility of Goodness* (1986) – discusses the tragedy of conflicting values.
  *   **David Heyd,** "Supererogation" (1982) – touches on the edges of duty and residue.

  You have stumbled onto a distinction that many professional ethicists spend careers refining. Trust your intuition: the "debt" is real, even if the "wrong" is justified. That tension is exactly where the philosophy lives.
