answer: |-
  Good morning. Faculty, families, honored guests, and the Class of Twenty-Twenty-Four.

  Two nights ago, at two in the morning, my roommate Mara and I stopped speaking to each other. We were sitting on the floor of our dorm room, surrounded by cold pizza and printed excerpts from Aristotle's *Politics*. Mara studies economics. I study philosophy. And for two hours, we fought about whether making money is unnatural.

  Mara argued that what Aristotle calls *chrematistike*—the art of wealth-getting—is just rational investment behavior with a branding problem. She said accumulating capital is how we secure freedom. I argued that Aristotle sees it as a violation of nature, because money was meant to be a bridge between people, not a destination. We didn't resolve it. But Mara said something before we went to sleep that I haven't been able to shake.

  She said, "Student debt is *chrematistike* turned inward."

  She meant that when we take out loans to be here, we aren't just buying education. We are turning our own minds into capital assets. We are forcing our education to breed.

  This distinction matters. Aristotle distinguishes between *oikonomia*—household management, acquiring what you need to live well—and *chrematistike*, the endless accumulation of money for its own sake. In *oikonomia*, there is a limit. You only need so many shoes to protect your feet. In *chrematistike*, there is no limit. There is always more money to be made.

  For the economists in the room: I know this sounds like moralizing. It isn't. It's a category error. Money is a measure of value, not value itself. When you use a ruler to measure weight, you get nonsense. When you use debt to measure education, you get distortion.

  Mara's insight reveals the structural mechanics of that distortion. If I borrow fifty thousand dollars to sit in a philosophy seminar, that seminar is no longer just a space to inquire about truth. Structurally, it is now a revenue stream. It must generate enough future income to repay the principal plus interest. The loan officer does not care if I become a wise citizen. They care if I become a solvent debtor.

  This forces a false equivalence between incommensurable goods. It asks us to weigh the price of a degree against the value of a life, as if they are the same currency.

  To my friends in business and economics: I am not asking you to reject ROI. I am asking you to recognize that when the tool of measurement becomes the goal of the activity, the data corrupts. If the university is a firm, then wisdom is only an asset if it appreciates. But wisdom does not appreciate like stock. It depreciates like time. You cannot compound it without spending it.

  And to my friends in the humanities, and the parents who sacrificed to bring us here: We cannot claim this place is a sanctuary from the market while we finance our sanctuary with market instruments. We signed the promissory notes. We agreed to the terms. We cannot pretend the debt isn't shaping what we choose to study, what we choose to value, and what we choose to become.

  Aristotle warned that when money breeds money, it becomes unnatural because it separates acquisition from use. We are here to use our minds, not to lease them.

  So, as we stand at the start of this honors convocation, we are left with a tension that neither side can comfortably resolve.

  For the economists: You must confront the possibility that your models are efficient at pricing everything, but valuing nothing. If the market says a poet is worth less than a broker, the market may be measuring the wrong thing.

  And for the humanists: You must confront the possibility that you are already complicit. You cannot claim to pursue knowledge for its own sake while demanding that knowledge pay off a loan with interest.

  We are here to learn how to live. But we have financed that learning by betting on how much we will earn. Tonight, Mara and I are still speaking. But we are still arguing. And perhaps that is the only honest way to be. We must navigate the distance between the life we can afford and the life we are meant to lead.

  Thank you.
