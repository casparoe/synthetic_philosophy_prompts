answer: |-
  **Part (a): 5/5**
  You correctly identify the core distinction between the rightness of an action (legality/conformity with duty) and its moral worth (morality/motive). You accurately note that rightness concerns *what* is done, while moral worth concerns *why* it is done. There are no errors or conflations here; the explanation is precise and captures the necessary conditions for the distinction.

  **Part (b): 5/5**
  You employ the canonical Kantian example of the honest shopkeeper effectively. You correctly explain that the action is "in accordance with duty" because it matches what honesty requires, but lacks moral worth because the motive is prudential (reputation/trade) rather than a recognition of duty. Your reasoning follows clearly, and you correctly conclude that the agent is not morally praiseworthy in this specific instance.

  **Part (c): 5/5**
  You state the requirement accurately, using the key Kantian phrase "determining motive." You correctly specify that the moral reason (that the action is right) must be the ground of the will, excluding self-interest or prudence as the *determining* factor. This sets up the criterion for moral worth without error.

  **Part (d): 4/5**
  You take a defensible philosophical stance (the "purity" interpretation), but your argument contains a logical conflation. You argue that because a wrong reason is *part* of the motivation, the action is "not done for the right reason." This does not follow; the action is done for the right reason *and* a wrong one. To support your conclusion that moral worth is lacking, you should have argued that the moral reason was not the *sole determining ground* of the will, rather than claiming the right reason was absent. Because the conclusion is philosophically permissible but the logical step to get there is imprecise regarding the definition of "done for the right reason," I deduct one point.

  **Overall Score: 19/20**
  The student demonstrates an excellent command of Kantian concepts and examples but loses a point for a logical imprecision in arguing the mixed-motives case.
