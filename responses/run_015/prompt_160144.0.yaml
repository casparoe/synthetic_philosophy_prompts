answer: |-
  Here is the correspondence table for the interpersonal analogy, followed by the audit you requested.

  **Correspondence Table**
  *   **Deceiver:** The sub-system seeking anxiety reduction.
  *   **Deceived:** The sub-system holding the resulting belief.
  *   **True Belief:** The evidence available within the mind.
  *   **Lie:** The false belief adopted.
  *   **Motive:** Ego protection or emotional comfort.
  *   **Tell:** Behavioural inconsistency or over-protest.
  *   **Moment of Success:** When the false belief stabilises against counter-evidence.

  **Where the Mapping Breaks**
  The analogy smuggles in a requirement for two distinct centres of awareness. In interpersonal deception, the deceiver knows *p* and ensures the victim believes *not-p*. This requires simultaneous, stable access to contradictory truths across a communication channel. In the one-person case, this creates the paradox: how can I know *p* and not know *p* at the same time?

  The essential disanalogy is **transparency**. In interpersonal cases, the channel is opaque; I cannot see your evidence. In self-deception, the 'channel' is internal. There is no place to hide the evidence unless you partition the mind into sealed rooms. The second essential disanalogy is **agency**. A deceiver acts with intention. In self-deception, the 'intention' is often retrospective; we realise we deceived ourselves only after the fact. If the deception were fully intentional, you'd have to intend to believe what you know is false, which is psychologically incoherent. You can intend to say lies, but not to believe them.

  **The Outsourced Case**
  Your 'outsourced' cases break the analogy completely. Here, there is no active deceiver lying to a victim. There is only a single agent arranging their environment so the truth never coalesces. They do not hide the letter; they ensure the letter never lands on the desk where the 'self' sits.

  On the interpersonal analogy, this isn't self-deception because there is no lie being told. There is only avoidance. However, intuitively, this *is* self-deception. The agent ends up with a false belief (or a lack of true belief) motivated by comfort. This version does not require a divided mind in the homuncular sense (little people inside). It requires only a fragmented attention system. It needs an intention not to look, not an intention to deceive. The deception is a byproduct of curation, not a planned operation. If the analogy forces you to say this isn't self-deception, the analogy is defective. It defines the phenomenon too narrowly by insisting on an active liar.

  **The Divided Mind Verdict**
  Does the claim that self-deception is possible *if and only if* the mind is divided survive? No. That claim is an artefact of the interpersonal analogy. Once you admit the outsourced cases—where the mind is unified but merely negligent or biased—the necessity of division vanishes. You can have self-deception with a single agent who is systematically biased in how they process information. The 'division' required is not architectural (separate agents) but functional (competing cognitive priorities). The analogy was carrying the conclusion the whole time; it presupposed division to make the trick work, then used the trick to prove division is necessary.

  **A Better Analogy: The Biased Archive**
  Your 'badly indexed archive' is superior, but it needs one tweak. The index isn't just wrong; it is **motivated**. When you search for evidence of your competence, the archive retrieves only success files. When you search for failure, it claims the drawer is empty. The file is intact and findable, but the retrieval system is rigged by emotion.

  This solves the paradox. You don't need to know and not-know simultaneously. You simply fail to retrieve what you technically possess. The truth is available *in principle*, but inaccessible *in practice* due to the search parameters.

  **The Philosophical Cost**
  If you adopt this archive model, you must choose a branch.
  1.  **Motivated Reasoning:** You claim there is no paradox, just bias. The cost is that 'deception' becomes a metaphor. There is no lie, only sloppy processing. You lose the moral weight of self-deception; it becomes a cognitive error, not a fault of character.
  2.  **Wilful Ignorance:** You claim the agent never actually forms the false belief, they just avoid the true one. The cost is that this doesn't cover cases where people sincerely assert the falsehood. They aren't just ignorant; they are confidently wrong.
  3.  **Akrasia:** You claim it's about action, not belief. They know the truth but act against it. The cost is that this ignores the phenomenology of belief. They genuinely *feel* the lie is true.

  If you want to keep the phenomenon real without the paradox, you must take the **Motivated Reasoning** branch. You concede that 'self-deception' is a misleading label for a unified mind processing evidence poorly under emotional pressure. It dissolves the mystery but costs you the dramatic tension of the 'divided soul'. The archive isn't haunted; it's just misfiled by a tired librarian who prefers the happy stories.
