  **DEPARTMENT FOR TEMPORAL EQUITY & LIABILITY**
  **Future Generations (Discharge of Duty) Scheme: Household Statement 2024/25**
  **Ref: FG-DDS/04/24**

  Your household has been assessed for residual intergenerational liability arising from carbon emissions and demographic choices. Under the Intergenerational Liability Act 2023, this liability must be discharged within the current tax year. This leaflet explains your assessment and the approved tariff for discharge.

  **1. How is my liability calculated?**
  Liability is measured in Quality-Adjusted Life Years (QALYs) at risk due to climate instability. Future harms are discounted to present value using a real rate of 3.8%, consistent with the growth-adjusted return on capital. This reflects the assumption that future generations will possess greater adaptive capacity and wealth than the current cohort, reducing the marginal utility of loss. This rate aligns with standard intertemporal neutrality models.
  *Worked Example:* One tonne of CO₂e emitted today is projected to cause 0.0004 QALYs of damage in 2085. Undiscounted, this values at £4,000. Discounted over 61 years at 3.8%, the present liability is £410. An average household emitting 15 tonnes annually accrues £6,150 in liability.

  **2. How may I discharge this liability?**
  Households may select any combination of routes from the published Tariff (see below). Payments are processed via Direct Debit. Certificates of Discharge are issued within 14 working days.

  **Table 1: Approved Tariff for Discharge**
  | Route | Cost per Unit Liability | Eligibility Criteria |
  | :--- | :--- | :--- |
  | Direct Emissions Reduction | £1.00 | Verified reduction against 2023 baseline. |
  | Adaptation Funding | £0.85 | Contribution to sea-wall or irrigation projects. |
  | Compensation Fund | £0.75 | Payment into central pool for verified claims. |
  | Non-Procreation Credit | £0.00 | Certification of zero births within household. |

  **3. Why is the Compensation Fund balance unspent?**
  The Fund compensates only identifiable future persons who can demonstrate they were made worse off by specific emissions than they would otherwise have been. Because energy usage and family planning decisions alter the precise timing of conception, the specific individuals born in high-emission scenarios differ from those in low-emission scenarios. Consequently, no claimant can prove they would have existed anyway under a lower-emission regime. The surplus balance is currently invested in a global index tracker on the trustees' standard advice to preserve capital value for potential future claims.

  **4. What is the recommended route?**
  Scheme guidance prioritises cost-effectiveness. The Non-Procreation Credit (NPC) is the most efficient discharge mechanism. By certifying that no children will be born to the household, you eliminate the subject of potential harm entirely. This discharges all existing and future liability associated with the household lineage. This aligns with energy efficiency hierarchies where prevention precedes mitigation.
  *Comparative Example:* A couple intending two children accrues estimated lifetime liability of £140,000 (discounted). A household flying long-haul annually accrues £135,000 over ten years. Both liabilities exceed the average lifetime income. Households in either category are strongly advised to utilise the NPC, as it reduces total liability to zero at no monetary cost, whereas offsetting emissions via the Tariff requires significant capital outlay.

  **5. Where do I send payment?**
  Payments should be made to the Department for Temporal Equity & Liability, Freepost FGEDS 101. For advice on certification forms, call 0800 555 0199.

  ***

  **Note on Satirical Liberties**

  The leaflet caricatures the "Person-Affecting View" in population ethics. It treats the Non-Identity Problem (that different choices create different people) as a loophole absolving duty, whereas most philosophers argue it complicates duty rather than erasing it. A defender of the Non-Identity Problem might argue we still owe duties to bring about better states of affairs, even if no specific individual is harmed.

  Regarding discounting, the leaflet applies a standard economic rate to welfare losses. Many ethicists argue pure time preference for welfare is unjustifiable; discounting money is acceptable, but discounting future suffering because future people are richer is contested. A defender of discounting would argue high future wealth makes marginal utility of loss lower, justifying the rate. To reverse the joke, one would assume future people are poorer (negative growth) or that welfare cannot be discounted, making the liability infinite and the NPC the only viable option regardless of cost.
