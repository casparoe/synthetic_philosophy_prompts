answer: |-
  **Project Title:** Teleology in Disguise? The Hidden Normativity of the Biostatistical Account of Health

  **1. Statement of the Research Question**
  The central debate in the philosophy of medicine concerns whether concepts of health and disease are objective, natural kinds (Naturalism) or value-laden social constructs (Normativism). The dominant naturalist framework, Christopher Boorse's Biostatistical Theory (BST), defines health as the statistical normality of species-typical physiological function. Boorse argues this account is value-free: a heart is diseased if it fails to pump blood with sufficient efficiency compared to the reference class, regardless of whether that failure is "bad" for the individual.

  However, the BST relies entirely on the prior identification of a body part's "function." If "function" is defined merely as causal contribution (e.g., a tumor contributes to the causal chain of the body), the definition becomes too broad. If "function" is defined teleologically (e.g., the heart is *for* pumping), the account appears to smuggle in a normative standard of what the body *ought* to do.

  This paper addresses the following specific question: **Can the Biostatistical Theory sustain its claim to value-neutrality given that its operational definition of "physiological function" appears to rely on irreducibly teleological or normative commitments?** I will argue that the naturalist faces a dilemma: either they must adopt a causal-role concept of function that fails to distinguish disease from mere difference, or they must adopt a teleological concept that reintroduces the normativity they seek to eliminate.

  **2. The Gap in Current Literature**
  While the naturalism-normativism debate is well-trodden, both sides frequently leave the metaphysics of "function" under-theorized in the context of health.

  *   **The Naturalist Blind Spot:** Proponents of the BST often treat "species-typical function" as a self-evident biological fact. When pressed, they appeal to evolutionary history (etiological accounts of function) to ground teleology in natural selection. However, they rarely address why *survival and reproduction* are privileged as the normative baseline without implicitly valuing those ends. They assume that because evolution is a natural process, the ends it selects are value-free, ignoring that labeling a trait "dysfunctional" because it hinders reproduction is itself a valuation of reproduction as a good.
  *   **The Normativist Blind Spot:** Normativists correctly identify that disease judgments involve evaluation, but they often focus on the *social consequences* of diagnosis (stigma, resource allocation) rather than the biological baseline. They concede the biological facts to the naturalists, arguing only that the *response* is normative. This leaves open the possibility that a refined naturalist account of function could solve the problem. By not attacking the metaphysics of function itself, normativists leave the naturalist's strongest fortification unbreached.

  This project intervenes at this intersection. It does not merely ask if health is valuable, but whether the *biological machinery* used to define health is itself value-laden.

  **3. Methodology and Plan of Work**
  The paper will proceed in four distinct stages, moving from exegesis to metaphysical analysis, then to application, and finally to synthesis.

  *   **Phase 1: Exegesis of the Biostatistical Account (approx. 1,000 words).** I will reconstruct Boorse's argument, focusing specifically on his distinction between "function" and "mere causal ability." I will outline his defense against the charge of normativity, specifically his reliance on reference classes and statistical distribution.
  *   **Phase 2: The Metaphysics of Function (approx. 1,500 words).** This is the core theoretical section. I will analyze three competing accounts of biological function: (1) Causal Role (what it does), (2) Etiological (what it was selected for), and (3) Goal-Contribution (what it contributes to the system's survival). I will demonstrate that (1) is too permissive for the BST (allowing tumors to have functions), while (2) and (3) rely on evolutionary "goals" that reintroduce a normative standard of success. I will argue that natural selection describes what *did* survive, not what *should* function, and bridging that gap requires a normative leap.
  *   **Phase 3: Stress-Testing via Case Studies (approx. 1,500 words).** To move beyond abstract metaphysics, I will apply this analysis to two borderline cases: (1) Aging (is the decline of function a disease or a statistical normality?) and (2) High-functioning psychopathy (is a lack of empathy a functional adaptation or a disease?). These cases will reveal where the BST must arbitrarily draw the line between "statistical abnormality" and "dysfunction," revealing the hidden value judgment.
  *   **Phase 4: Synthesis and Conclusion (approx. 1,000 words).** I will conclude that the BST cannot be purely descriptive. However, rather than dismissing naturalism entirely, I will propose a "hybrid" view: biological function provides a necessary constraint on disease concepts, but cannot be sufficient without a normative framework to interpret those functions.

  **4. Scope, Risks, and Failure Conditions**
  A 5,000-word limit is tight for a debate that spans philosophy of medicine and philosophy of biology. To manage this, I must adhere to strict boundaries.

  *   **Risk of Scope Creep:** The philosophy of biological function is a vast sub-discipline. A major risk is getting bogged down in the general debate between etiological and causal-role functions in biology broadly. **Mitigation:** I will restrict the analysis strictly to *physiological* function as it pertains to medical diagnosis. General evolutionary theory will only be discussed insofar as Boorse uses it to ground health.
  *   **Risk of Triviality:** It is easy to conclude that "all concepts have some value judgment." This would be a banal result. **Mitigation:** The paper must specify *which* values are smuggled in (e.g., the valuation of reproductive fitness over individual well-being) and show why this matters for clinical practice or policy.
  *   **Condition of Failure:** The project will be considered unsuccessful if it ends with an agnostic conclusion (e.g., "both sides have points"). To succeed, I must take a definitive stance on whether the "smuggling" of normativity is fatal to the naturalist project or merely requires a modification of it.
  *   **Condition of "Too Big":** If the analysis of "function" requires a deep dive into the is-ought problem in meta-ethics, the paper will exceed the word limit. I will treat the is-ought problem as a background assumption rather than a primary object of analysis, focusing instead on its specific instantiation in the concept of physiological dysfunction.

  **5. Preliminary Conclusion**
  I anticipate demonstrating that the Biostatistical Theory is not value-free, but rather values *species-typical survival* above other potential goods. Recognizing this does not invalidate the use of statistics in medicine, but it does undermine the claim that medicine is a purely objective science distinct from moral reasoning. This conclusion supports a moderate normativism: biology sets the stage, but values write the script.
