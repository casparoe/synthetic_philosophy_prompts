answer: |-
  Consider the specific operational state of Module K when it processes seismic sensor data and assigns a precise credence value of 0.87 to the proposition that the northern fault is active, a value that sits precariously between the calibration standard required for routine laboratory confirmation, which might accept anything above 0.85, and the stringent threshold required for authorizing a mass evacuation, which demands certainty closer to 0.95. In the routine laboratory review, the human geologists operate under low practical stakes where a false positive results only in wasted research time, and in this setting, a senior analyst might comfortably assert that Module K knows the fault is active based on the 0.87 output. However, during the emergency coordination meeting, the exact same output from Module K is presented to decision-makers who face enormous practical consequences where a false positive triggers unnecessary economic devastation and a false negative risks loss of life, leading the emergency director to assert that Module K does not know the fault is active and that further verification is required. This divergence in verdicts regarding the exact same synthetic subject and the same evidential output creates a sharp conceptual friction between epistemic contextualism and pragmatic encroachment because the source of the variability lies in fundamentally different locations within the epistemic architecture. For the epistemic contextualist, the shift in truth value of the claim Module K knows is explained by a change in the semantic content of the word knows driven by the conversational context of the attributor, meaning that in the laboratory the term knows picks out a relation satisfied by 0.87 credence while in the emergency meeting the term picks out a stricter relation that 0.87 fails to satisfy, regardless of the fact that Module K itself has undergone no internal change and possesses no practical interests to speak of. This framework treats the knowledge attribution as a linguistic tool sensitive to the speaker's environment, allowing the human geologists' shifting conversational stakes to alter the epistemic status of the synthetic proxy simply through the act of attribution, effectively decoupling the truth conditions of knowledge from the subject's own capacity for action or risk. In contrast, pragmatic encroachment locates the variability of knowledge not in the speaker's language but in the subject's practical environment, arguing that whether a subject knows depends on the stakes facing that subject, which generates a conceptual anomaly when applied to Module K because the module possesses no practical interests, no risk to itself, and no capacity for action whatsoever. If one strictly applies the machinery of pragmatic encroachment to Module K as the epistemic subject, the theory predicts that the module's knowledge status should remain invariant across both the laboratory and the emergency meeting because the module's stakes are permanently zero, implying that if the 0.87 credence suffices for knowledge in the low-stakes lab, it must also suffice in the high-stakes emergency since the module itself faces no danger from being wrong. This reveals a profound disanalogy where contextualism can easily accommodate the intuition that Module K knows in the lab but not in the emergency by pointing to the human speakers, whereas encroachment struggles to explain why the human stakes should affect the module's epistemic status unless one argues that the module is merely a tool and the geologists are the true subjects, yet even then the conceptual machinery differs because encroachment insists the change is due to the practical rationality required for action while contextualism insists the change is due to the semantic standards of the conversation. The tension is most visible in the fact that contextualism allows the high-stakes human context to overwrite the epistemic status of a stake-free entity through semantic shifting, while encroachment suggests that a stake-free entity should either always know given sufficient evidence or cannot know at all due to a lack of agency, thereby exposing that contextualism views knowledge as a relation partly constituted by conversational norms whereas encroachment views knowledge as a state partly constituted by the subject's practical relationship to the truth, a relationship that Module K fundamentally lacks. Consequently, the scenario illustrates that while contextualism can seamlessly explain why the director denies knowledge to the module in the emergency by citing the raised conversational bar, encroachment forces a choice between admitting that the module's knowledge status is immune to the human crisis because the module has no skin in the game, or conceding that the concept of knowledge cannot properly apply to non-agentic proxies at all, thus highlighting that the two theories are not merely disagreeing on a verdict but are operating with incompatible definitions of what kind of entity can bear the property of knowledge and where the flexibility of that property resides.
