answer: |-
  You press hard on the definition of *āpta*, and I grant you, this is a sharp *doṣa* (objection) to consider. You say the theory cannot lose because it excludes lucky truth. But consider: if a madman screams 'fire' and you escape a fire, did you gain *knowledge* from him? Or did you act on luck? We say luck. Why? Because the cause (*kāraṇa*) was defective (*sadoṣa*). The madman lacks *yathārtha-jñāna* (veridical cognition) himself. This machine is similar. It lacks *vivakṣā* (intention to convey truth). Without *vivakṣā*, there is no *tātparya*. Without *tātparya*, there is no *śabda-pramāṇa*. The words are present, the *yogyatā* (fitness) is present, but the soul of testimony—the reliable will—is absent.

  So, did you learn? You acquired a true cognition (*yathārtha-anubhava*). You could act (*pravṛtti*). But you did not acquire *pramā* via *śabda*. I suggest you actually inferred (*anumāna*) that 'this instrument has been useful before, so it is useful now.' That inference is the real *pramāṇa*, not the words themselves. The words are merely the object (*viṣaya*) of your inference. As for 'authorless': it is not authorless like the Veda. It is a heap of authored fragments without an author to guarantee them. That is not divinity; that is debris. Tell me, when you read the reference it gave you—the book that does not exist—did your cognition of that reference feel different from the cognition of the illness?
