      *   *Thesis 5: Neural Common Currency (The "Biochemical" View).*
          *   Claim: Brain uses one signal (e.g., dopamine prediction error) for all rewards.
          *   Status: Scientifically plausible but nuanced (wanting vs. liking).
          *   Support for Slogan? Supports commensurability mechanistically, but "is" doesn't equal "ought" (naturalistic fallacy risk).
