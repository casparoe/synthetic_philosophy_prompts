          *   Support for Slogan? Stronger. If value comes from the attitude itself, the content matters less for *value* (though content affects intensity).
          *   Verdict: Substantive/Defensible.

      *   *Thesis 3: Axiological Monism (The "Source of Value" View).*
          *   Claim: Pleasure is the *only* intrinsic good.
          *   Status: Substantive ethical claim (Classic Hedonism).
          *   Support for Slogan? This is the normative core. It says nothing about the *nature* of pleasure, only its value status.
