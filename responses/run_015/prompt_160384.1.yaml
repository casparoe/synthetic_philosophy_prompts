  5.  **Comparing Precedents to New Case:**
      *   *Vs. Pancreas/ALS:* They were terminal (weeks/8 months). He is 2-4 years. They had current physical burden. He has anticipatory psychological burden based on physical prognosis.
      *   *Vs. Depression/Pain:* They were non-terminal. He is progressive/fatal eventually, but not "reasonably foreseeable" death in the statutory sense (usually <6 months). They had current suffering. He has anticipatory suffering.
