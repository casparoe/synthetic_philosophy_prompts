          *   Is it the COPD case? (Competent refusal leading to death). But COPD was VSED.
          *   *Decision:* The ALS case is the closest *medical* analogue, but the *Pain* case is the closest *ethical* hurdle regarding alternatives.
      *   *Section 4: The Inconsistency.*
