      *   *New Case:* He rejects sedation as worse than death. Is that a "refusal of reasonable alternative" (like the Pain lady) or a "reasonable judgement" (as the user suspects)?
      *   *The "Imminence" Factor:* The law says "reasonably foreseeable." 2-4 years is usually outside this. But the committee's remit is *wider* than the law.
      *   *The "Suffering" Factor:* Is "dread of future loss" suffering? In the ALS case, withdrawing ventilation implies current burden of ventilation. In the Glioblastoma case, sedation implies current symptoms.
