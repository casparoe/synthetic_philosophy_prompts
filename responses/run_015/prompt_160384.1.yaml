      *   *Section 2: Applying to the New Case.*
          *   Where does he fit? He fails Rule 1 (2-4 years). He fails Rule 2 (No current suffering). He passes Rule 3 (Sedation intolerable to him). He fails Rule 4 (Wants prescription, not VSED).
      *   *Section 3: The Closest Analogue.*
          *   Is it the ALS case? (Neurodegenerative). But ALS had ventilation burden.
