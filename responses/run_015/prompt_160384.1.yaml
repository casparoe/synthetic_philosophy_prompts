      *   *Tone:* Professional, direct, analytical, "colleague-to-colleague." No fluff.
      *   *Section 1: Brainstorming the Principles.* Lay out the competing rules derived from the track record.
          *   Rule 1: The "Terminal Horizon" (Death < 6-12 months).
          *   Rule 2: The "Current Burden" (Suffering must be present, not anticipated).
