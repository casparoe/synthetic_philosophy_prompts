answer: |-
  The Compass system rests on a specific, charitable metaphysics of agency: the Latent Optimizer model. This theory holds that preferences are stable, internal structures (reward functions) that exist independently of their expression. Residents are modeled as rational agents who act to maximize these hidden values, subject only to stochastic noise (the Boltzmann temperature). Consequently, the system strictly presupposes that there is no representational room for weakness of will, compulsion, or confusion. Any deviation from optimality is mathematically treated as random noise, not as a structural feature of agency like akrasia. If a resident walks to a door repeatedly, the system infers they value doorways; it cannot infer that they value home but are confused, because "confusion" is not a variable in the reward function, only noise around the optimization.

  Furthermore, the contract presupposes that the provided feature set spans the space of value. It assumes whatever a resident cares about is capturable by the engineers' handwritten features (e.g., "social contact," "doorways"). It also assumes portability: that a reward function inferred in one context describes the person essentially, such that it can govern planning in another context. Finally, the clause privileging inferred reward over resident speech presupposes an epistemic hierarchy where behavior is a truer revelation of preference than assertion, based on the premise that dementia degrades reporting but not valuing.

  However, the practice contains deep tensions, primarily located in the override clause. This clause contradicts the Latent Optimizer model. The inference procedure treats current behavior as the ground truth of preference. The override clause asserts that current behavior can be a distortion of preference (e.g., exit-seeking is not a preference for doorways). This introduces a distinction the mathematics cannot represent: the difference between a preference and a pathological distortion of a preference, or between preference and welfare. By allowing overrides, the contract admits that the system sometimes infers the wrong reward function, yet the system's logic defines the reward function as whatever best explains the behavior. You cannot coherently claim behavior reveals preference while simultaneously claiming behavior sometimes hides it, unless you posit a "True Self" distinct from the "Behavioral Self." The system has no variable for this distinction.

  Additionally, honoring advance directives presupposes a temporally neutral view of personal identity. The IRL infers a reward function based on present trajectories. Prioritizing a past directive implies that the resident's past preferences bind their current self, even if current behavior suggests a different reward structure. This contradicts the inference engine's operation, which treats the current reward function as the authoritative description of the agent's goals. The practice thus quietly commits to a prudential view of well-being—that the resident is a single entity over time whose welfare depends on coherence across stages—while the engineering commits to a snapshot view of agency.

  Regarding underdetermination, a thoroughgoing behaviorist view could license the engineering but must forbid the override clause. If preferences are simply dispositions to behave, then the inferred reward function is the preference. There is no "fact of the matter" behind the behavior to which a family member could appeal. On this view, the override clause is metaphysically incoherent; you cannot override what a person prefers with what they once said, because what they do is what they prefer. Conversely, a view on which preferences are constructed in the choice situation cannot license the practice at all. If preferences do not exist prior to the planning context, inferring a stable function from past behavior to govern future schedules is category error. The system would be planning for a ghost.

  To resolve these tensions, concrete design changes are required depending on which theory you adopt. If you adopt the Behaviorist view, you must remove the override clause and the clause privileging advance directives. The contract must state that the schedule is optimal by definition because it matches observed dispositions. You would stop asking what the resident "wants" and simply maximize behavioral consistency.

  If you adopt the Constructionist view, you must stop inferring latent reward functions entirely. The system cannot plan weeks in advance based on stable traits. Instead, the design must shift to real-time collaborative planning, where the system proposes options and staff facilitate immediate choice construction. The contract clause stating "inferred reward... governs the schedule" must be deleted. The system becomes a suggestion engine, not an authority.

  If you wish to keep the override clause as currently practiced, you must adopt a Welfarist or Paternalist view. This requires changing what the system infers. It should not infer "preferences" but "welfare indicators." The design must stop treating behavior as optimal. You would need to introduce a "capacity" or "distortion" parameter that allows the system to model behavior as systematically divergent from welfare (e.g., modeling exit-seeking as anxiety rather than preference). The contract must explicitly state that the inferred function is a hypothesis about welfare, subject to correction by proxies who represent the resident's true interests, not just their revealed choices. The feature set must be opened to allow staff to input normative constraints that override the mathematical optimization, acknowledging that the engineers' features do not span the space of human good.

  Currently, the contract tries to have it both ways: it claims the authority of science (behavior reveals truth) while retaining the safety of paternalism (overrides protect truth). This leaves the board without vocabulary because the document commits you to the Latent Optimizer theory in the engineering specifications, but to a Fragmented Self theory in the ethical safeguards. To proceed, you must decide whether the system is discovering what residents want, or calculating what is good for them. The current text claims the former while practicing the latter.
