      *   **The User's Argument:** If JOOTSing is just applying an arithmetic meta-rule (counting I's mod 3), isn't it functionally equivalent to adding an oracle (an external decision procedure) to the formal system?
      *   **The User's Conclusion/Question:** Does this collapse the distinction between "inside" and "outside" into just "formal system vs. oracular extension," thereby negating JOOTSing as a *special human capacity*?

