prompt: |-
  hey — you're a professional philosopher who works in metaethics and philosophy of action, and you've also sat on something like a dozen job search committees, so you know what a room does to a paper. please think carefully about this one, and don't just be agreeable: if a reply I've sketched is bad, say so and tell me what to say instead. maybe brainstorm a bit before you start writing — dump every line of attack you can think of, then throw out the ones that only matter to people who aren't in this room, then rank what's left.

  The situation: I'm flying out for a campus visit in ten days and the job talk is the chapter of my diss where I defend indirect normativity. 40 minutes plus Q&A, chair will cut me off at about two minutes an answer.

  The room: hiring in ethics, but the ethics side is thin. It's three formal epistemologists / decision theorists (Bayesian epistemology and rational choice; they think of rationality as coherence, like representation theorems, and get itchy around anything that looks like a substantive perfectionist demand on desires), two reasons-first metaethicists (reasons primitive, 'ought' explained by the balance of them; they'll hate the idea of analyzing it via a counterfactual about a person who doesn't exist), one Kantian constructivist who will want to know why my idealization isn't just a moral premise smuggled in, a philosopher of action who works on intention and will press on whether deliberation even has the structure my view needs, and a moral psychologist who runs experiments on reflective endorsement and will know that people's self-reports about what they'd endorse are wildly order- and framing-sensitive. One friendly face, in philosophy of mind, who won't care about any of this.

  The thesis, so you have something to aim at: the indirect view is right — 'S ought to φ' is made true by facts about what an idealized deliberative counterpart of S would settle on — but every version on the market idealizes globally (evidence, ends, reasoning power, all at once) and so gets estranged from S's actual question. My fix is anchored idealization: you only idealize S along the dimensions S herself would, on reflection, treat as defects to be corrected, and then you take a fixed point of that partial idealization — idealizing the result again gets you the result back. Where there are several fixed points I say 'ought' is indeterminate rather than overdetermined; where there's none, there's no fact about what she objectively ought to do, only about what she subjectively ought to do. Two problems I flag myself: the procedure isn't commutative (idealize along D1 then D2 and you can land somewhere different from D2 then D1 — I lean on fixed points as the order-invariant outputs), and the old fetishism / one-thought-too-many worry, which I answer by saying the counterpart's output has the shape 'φ because p', so the agent takes up p directly and the idealization is transparent equipment for finding reasons, not a surrogate reason.

  What I want is a prep sheet, not a defense and not a literature review (I know the literature, please don't give me citations or reading lists). Specifically:

  - The eight or ten objections I'll actually get from these people, ordered by how much damage they'd do if I fumbled them, weighted by how likely they are to come up at all. Phrase each one the way that person would phrase it — I want to recognise the sentence when I hear it, not a cleaned-up version.
  - For each: a ~90 second answer, in a register that person will find responsive (the decision theorists want a model, not a metaphor; the constructivist wants to know what's doing the normative work), and a blunt note on where my answer is soft or where I'm just asserting something.
  - What I should concede in the first five minutes of the talk so I don't spend Q&A defending things I don't need.
  - The one reply that has to land for the arguement to survive the visit.
  - And the question I'm hoping nobody asks. I have a guess what it is — something about whether the fixed point moves once the agent has heard of my theory, i.e. whether 'ought' is stable under the agent learning the account — but tell me if you think the really dangerous one is a different one.

  Be concrete and a bit brutal. Assume I'd rather hear it from you now than from them in ten days.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher (metaethics/philosophy of action), experienced job committee member (knows "the room").
      *   **Task:** Create a prep sheet for a job talk Q&A.
      *   **Context:** Campus visit in 10 days. 40-min talk + Q&A (2 min/answer limit). Defending "Indirect Normativity" via "Anchored Idealization" (partial idealization based on agent's reflective defects, fixed points).
      *   **Audience:** 3 Formal Epistemologists/Decision Theorists (coherence/rationality), 2 Reasons-First Metaethicists (primitive reasons, hate counterfactuals about non-existents), 1 Kantian Constructivist (smuggled moral premises), 1 Philosopher of Action (deliberative structure), 1 Moral Psychologist (framing/order effects on endorsement), 1 Friendly Phil Mind.
      *   **Constraints:** Be concrete, brutal, not agreeable. No citations/reading lists. 8-10 objections (ranked by damage/likelihood). ~90 sec answers tailored to specific audience members. Concessions to make early. The one reply that *must* land. The question hoping nobody asks (verify user's guess).
      *   **Tone:** Professional, sharp, strategic, "inside baseball."

  2.  **Deconstruct the Theory (Anchored Idealization):**
      *   *Core:* 'S ought to $\phi$' = truth conditions involve an idealized counterpart.
      *   *Innovation:* Not global idealization (God's eye view), but *anchored* (only idealize dimensions S treats as defects).
      *   *Mechanism:* Fixed points of partial idealization.
      *   *Edge Cases:* Multiple fixed points = indeterminate 'ought'. No fixed points = only subjective 'ought'.
      *   *Known Weaknesses:* Non-commutativity (order of idealization), Fetishism/One Thought Too Many (answer: counterpart output is '$\phi$ because $p$', agent takes $p$).

  3.  **Brainstorming Objections (Raw Dump):**
      *   *Decision Theorists:* Why is this rational? Where's the utility function? Is the fixed point stable? What if the agent has adaptive preferences (sour grapes)?
      *   *Reasons-First:* You're analyzing 'ought' via counterfactuals about non-existent people. That's backwards. Reasons explain the counterpart's choice, not vice versa.
      *   *Kantian:* Your "defects" list isn't neutral. It smuggles in substantive values. Who decides what counts as a defect?
      *   *Action Theory:* Deliberation isn't iterative like your fixed point model. It's holistic. You can't bracket ends from means this way.
      *   *Moral Psych:* People are terrible at knowing their defects. Framing effects mean the "anchored" part is unstable.
      *   *General Metaethics:* Extensional adequacy. Does this match our intuitions about clear cases (e.g., slavery, trivial choices)?
      *   *Circularity:* To know what defects to idealize, don't you need to know what the agent *ought* to value?
      *   *The "Learning" Objection (User's guess):* If I tell the agent this theory, does the fixed point shift? (Reflexivity).
      *   *The "No Fixed Point" Objection:* What if the agent is deeply conflicted? You say "no objective ought." Is that plausible?
      *   *The "Fetishism" Objection:* Is the agent motivated by the *fact* of idealization or the *content*?

  4.  **Filtering & Ranking for "The Room":**
      *   *Committee Dynamics:* The Decision Theorists and Reasons-First folks are the majority (5 out of 8 voting members, excluding friendly face). The Kantian and Action theorist are single votes but can derail the "philosophical depth" assessment. The Moral Psych is the "empirical check."
      *   *High Damage:* Circularity/Smuggling (Kantian/Reasons-First), Stability/Coherence (Decision Theorists), Empirical Instability (Moral Psych).
      *   *Medium Damage:* Action Theory structure, Fetishism.
      *   *Low Damage:* Friendly mind stuff, pure literature nitpicks.

      *Selection:*
      1.  Circularity/Smuggling (Kantian/Reasons-First) - *Killer.*
      2.  Empirical Instability of "Defects" (Moral Psych) - *Killer for credibility.*
      3.  Fixed Point Existence/Uniqueness (Decision Theorists) - *Technical kill.*
      4.  Reasons-First Priority (Reasons-First) - *Metaethical kill.*
      5.  Deliberative Structure (Action Theory) - *Feasibility kill.*
      6.  Non-Commotativity/Order (Decision Theorists) - *Technical worry.*
      7.  Fetishism/Motivation (General) - *Standard objection.*
      8.  The "No Fact" Case (General) - *Extensional adequacy.*
      9.  Reflexivity/Learning (User's guess) - *Deep cut.*
      10. Extensional Adequacy (General) - *Standard.*

      *Refining the Ranking:* The Kantian/Reasons-First circularity worry is the most dangerous because it attacks the *normative authority* of the view. The Moral Psych objection is dangerous because it attacks the *applicability*. The Decision Theorist objection is dangerous because they hold the "rationality" keys.

  5.  **Drafting the Responses (Iterative Process):**
      *   *Constraint:* ~90 seconds spoken. Needs to be punchy.
      *   *Tone:* Respectful but firm. Acknowledge the hit, pivot to the strength.
      *   *Specifics:* Need to address the specific jargon of each subfield (e.g., "representation theorem" for DT, "primitive" for Reasons-First).

      *(Self-Correction during drafting)*: Make sure I don't just give generic advice. I need to write the *script* for the answer. I also need to be brutal about where the user's answer is soft.

  6.  **Addressing Specific Prompts:**
      *   *Concessions:* What to give up early? Probably the "No Fixed Point" cases. Don't fight for an objective ought where there isn't one. Also, concede that the *process* isn't psychological.
      *   *The One Reply:* It has to be the Circular/Smuggling objection. If the idealization criteria are normative, the view collapses into the substantive view it tries to analyze.
      *   *The Dangerous Question:* User guesses "Learning/Reflexivity." Is there something worse? Yes. "The Normative Authority of the Anchor." If the agent *thinks* a bias is a virtue (e.g., partiality to family), do you idealize it away? If yes, you're paternalistic/substantive. If no, you validate bigotry. This is the "Bad Anchors" problem.

  7.  **Final Review against Constraints:**
      *   8-10 objections? Yes.
      *   Ranked? Yes.
      *   Tailored answers? Yes.
      *   Blunt notes on softness? Yes.
      *   Concessions? Yes.
      *   One reply? Yes.
      *   Dangerous question? Yes.
      *   Tone: Professional, brutal, strategic.

  8.  **Final Polish:** Ensure the distinction between "Decision Theorists" (coherence) and "Reasons-First" (primitive) is clear in the objections. Ensure the Moral Psych objection hits the "reflective endorsement" claim hard. (Proceed to generate output).

  *Wait, one more check:* The user said "don't just be agreeable." I need to make sure I point out where their theory is actually vulnerable, not just how to spin it. The "Anchored" part is the weak link. Who defines the defects? If the agent does, it's subjective. If the theorist does, it's paternalistic. I need to highlight this tension in the "Soft Spot" notes.

  *Refining the "Dangerous Question":* The user's guess (stability under learning) is good, but the "Bad Anchors" (what if the agent values the defect?) is more immediate for the Kantian and Reasons-First people. I will validate the user's guess but pivot to the *normative status of the anchor* as the real killer. Actually, the "Regress" problem is also huge. To know what is a defect, do I need a prior 'ought'? I'll stick with the "Normative Status of the Anchor" as the real dangerous one, but acknowledge the learning one is a close second.

  *Wait, let's look at the "One Reply that has to land".* It needs to be the thing that saves the project from collapsing into existing views. That's the "Transparency/Fixed Point" move. No, it's the answer to the Circularity charge. If that fails, the theory is dead.

