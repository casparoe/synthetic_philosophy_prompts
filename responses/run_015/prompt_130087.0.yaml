      *   *Backward Induction Failure:* Standard backward induction assumes you know *where* you are in the tree. Here, you don't.

  3.  **Address the Core Question: Indexical Self-Location & Backward Induction:**
      *   *Backward Induction (BI):* Requires knowing the node. "If I am at Node Y, I choose Exit." "If I am at Node X, I choose Continue."
      *   *Indexical Self-Location:* "I am *here* now." In AMD, "here" is ambiguous. It maps to {X, Y}.
      *   *The Fracture:*
