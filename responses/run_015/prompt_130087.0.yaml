      *   *State Machine:*
          *   Ideal: `State = {Start, Junction1, Junction2, End}`. Transition logic depends on `State`.
          *   AMD: `State = {Start, Junction?, End}`. The `Junction?` is an equivalence class covering both physical locations.
      *   *Backward Induction Logic:* BI works by solving the leaf nodes first. "At Junction2, Exit is best." Then move up. "At Junction1, knowing I will Exit at Junction2, Continue is best."
