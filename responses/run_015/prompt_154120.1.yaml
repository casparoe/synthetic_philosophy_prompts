answer: |-
  **Desiderata for a Theory of Coherent Extrapolated Volition and Idealised Preferences**

  **Introduction**

  In constructing a theory of idealised preferences or Coherent Extrapolated Volition (CEV), the objective is to define what an agent *would* want under conditions of improved epistemic access, cognitive processing, and moral reflection. This is not merely a prediction of future behaviour, but a normative claim about what constitutes the agent's true will. For such a theory to be philosophically robust, it must satisfy specific structural and functional requirements. The following desiderata establish the standards by which any such account must be judged. They address the authority of the ideal self, the continuity of identity, and the limits of cognitive simulation.

  **1. The Criterion of Normative Authority**
  *Specification:* The theory must explain why the current agent is rationally compelled to defer to the preferences of their idealised counterpart. It is insufficient to state that the ideal self is 'wiser'; the theory must demonstrate that the ideal self's preferences possess a normative grip on the current self that overrides present contrary desires.
  *Motivation:* Without this, idealisation collapses into mere advice. If I currently desire to smoke, and my ideal self desires I quit, the theory must explain why the ideal desire is *binding*. If the ideal self is viewed as a stranger with better data, their volition is not *mine*. A counter-example is the 'Benevolent Dictator' problem: if the ideal self imposes a life I find abhorrent without a chain of reasoning I can accept, the theory fails to capture *volition* and instead describes benevolent coercion.

  **2. The Criterion of Identity Continuity**
  *Specification:* The theory must specify the limits of psychological change permissible during the extrapolation process. It must define a threshold beyond which the idealised agent is no longer the 'same' person as the current agent, such that their preferences cease to count as the current agent's extrapolated volition.
  *Motivation:* Idealisation involves change (e.g., removing biases, adding knowledge). However, if the process removes too much of the agent's core character (e.g., their fundamental attachments or temperament), the resulting preferences belong to a different entity. Consider a pacifist who, upon idealisation, becomes a utilitarian warrior because they now understand complex geopolitical necessities. If the change is too radical, the 'warrior' is not the extrapolation of the 'pacifist', but their replacement. The theory must distinguish between *refining* the self and *replacing* it.

  **3. The Criterion of Epistemic Accessibility**
  *Specification:* The grounds for the idealised preference must be, in principle, comprehensible to the current agent, even if the current agent lacks the processing power to arrive at them independently. The 'why' behind the ideal choice cannot be a black box.
  *Motivation:* Rational agency requires acting on reasons. If the ideal self prefers outcome A over B for reasons that are cognitively closed to the current self (e.g., relying on mathematical concepts the current self cannot grasp), the current self cannot rationally endorse the preference. They can only obey it. This reduces the agent to a child following a parent's instruction, undermining the autonomy that idealisation is supposed to preserve.

  **4. The Criterion of Dynamic Stability**
  *Specification:* The theory must ensure that the idealised preference set is stable under further reflection. If the ideal self were to think further or learn more, they should not immediately revise their core volition.
  *Motivation:* If the 'ideal' state is merely a temporary local maximum in preference space, it cannot serve as a normative anchor. For instance, if an agent extrapolates to a state of hedonistic bliss, but upon further reflection realises this bliss is empty and revises their preference to meaningful struggle, the first extrapolation was insufficiently ideal. A theory of CEV must identify a reflective fixed-point, not just a temporary improvement.

  **5. The Criterion of Inter-generational Preference Interference**
  *Specification:* This criterion addresses the specific problem where the idealised future self possesses cognitive resources and experiential ranges that the current self cannot simulate. The theory must explicitly state whether the current agent's volition is dependent on the predictions of this cognitively superior future self. It must either: (a) accommodate the dependency by providing a mechanism for 'trust without comprehension', or (b) rule out the dependency by limiting idealisation to concepts currently accessible.
  *Motivation:* This is the problem of the 'Cognitive Event Horizon'. Suppose my future, cognitively enhanced self prefers a policy that looks like suffering to my current eyes, but is actually a higher-order good perceivable only with enhanced cognition. If the theory says I must defer to them, it violates Epistemic Accessibility (Desideratum 3). If it says I need not defer, it violates Normative Authority (Desideratum 1), as it ignores the superior insight of the ideal self. A coherent theory cannot simply ignore this gap; it must provide a principled account of whether 'true volition' can transcend the conceptual horizon of the present agent.

  **6. The Criterion of Action-Guidance**
  *Specification:* The theory must yield conclusions that are actionable in the present. It cannot require the agent to complete the idealisation process before making a decision, as the process itself may be infinite or computationally impossible.
  *Motivation:* A theory of value that cannot guide choice is practically inert. If the theory states 'do what your ideal self would do', but provides no heuristic for approximating that in real-time, it fails as a practical philosophy. It must bridge the gap between the counterfactual ideal and the actual present.

  ***

  **Flagged Incompatibility: The Transparency-Enhancement Tension**

  It must be explicitly noted that **Desideratum 3 (Epistemic Accessibility)** and **Desideratum 5 (Inter-generational Preference Interference)** appear jointly unsatisfiable under conditions of radical cognitive enhancement.

  *   **The Conflict:** If we accept that the ideal self is *radically* cognitively enhanced (as required for a robust CEV), they will necessarily utilise concepts and reasoning chains that lie beyond the simulation capacity of the current self. This satisfies the spirit of idealisation but violates Epistemic Accessibility, because the current self *cannot* comprehend the grounds of the preference.
  *   **The Hard Limit:** To satisfy Accessibility, one must limit the degree of cognitive enhancement to what is currently comprehensible. But this limits the 'idealisation', potentially trapping the agent in current cognitive biases. To satisfy Radical Enhancement, one must accept that the current self cannot understand the ideal self's reasons.
  *   **Conclusion:** A theory cannot simultaneously guarantee that the ideal self is *significantly* smarter than the current self in a way that generates new conceptual resources, and that the current self can fully comprehend the reasons for the ideal self's preferences. One of these desiderata must be relaxed; they cannot both be fully met.

  ***

  **Brief Assessment of Candidate Frameworks**

  Having established the criteria, we may briefly assess three common models against these standards.

  **1. Coherence-Based Extrapolation Model**
  This model defines idealised preferences as the set of desires that remain consistent when all logical contradictions are removed from the agent's current belief-desire set.
  *   *Performance:* It scores well on **Dynamic Stability**, as a coherent set is by definition resistant to logical revision. However, it struggles severely with **Normative Authority**. A coherent set of desires can be evil or banal; coherence does not guarantee moral improvement. Furthermore, it fails the **Inter-generational Preference Interference** criterion, as it relies on processing existing concepts rather than generating new ones, thus failing to account for the value of cognitive expansion.

  **2. Reflective-Equilibrium Framework**
  This model seeks a balance between particular intuitions and general principles through a process of mutual adjustment.
  *   *Performance:* It handles **Identity Continuity** well, as it begins with the agent's actual considered judgements. It also offers strong **Action-Guidance**, as equilibrium can be sought incrementally. However, it is vulnerable on **Dynamic Stability**. There is no guarantee that a reflective equilibrium is unique or stable; an agent might oscillate between two different equilibrium points depending on the order in which they consider cases. It also risks violating the **Inter-generational** criterion by privileging current intuitions that might be discarded by a cognitively enhanced future self.

  **3. Aggregationist Preference-Construction View**
  This view treats the ideal self as an aggregation of the preferences of all temporal stages of the agent, weighted by epistemic quality.
  *   *Performance:* This view attempts to solve the **Inter-generational Preference Interference** problem by mathematically weighting the future self's input. However, it faces a fatal issue with **Identity Continuity**. If the future self's preferences are weighted heavily due to superior cognition, the 'aggregate' may be dominated by a future entity that the current self no longer recognises as themselves. Additionally, it struggles with **Epistemic Accessibility**, as the aggregation function may produce results that no single temporal stage (including the current one) understands or endorses.

  **Conclusion**

  Any viable theory of coherent extrapolated volition must navigate the tension between respecting the agent's current identity and acknowledging the normative authority of their improved future self. The desiderata outlined above, particularly the tension between accessibility and enhancement, suggest that a perfect theory may be impossible. Instead, a successful account must explicitly state which desideratum it prioritises and justify why that trade-off is philosophically acceptable.
