      *   *Daniel Dennett:* "Dreaming as a Text." Early Dennett (Content and Consciousness, 1978). The "Cassette Recorder" model. We don't experience dreams in real-time; we construct the memory of having experienced them upon waking.
      *   *The "Agreement":* Do they actually agree? Malcolm says the *concept* is flawed. Dennett says the *phenomenology* is an illusion constructed post-hoc. They converge on "no real-time conscious experience," but for very different reasons (logical/grammatical vs. empirical/mechanistic).
      *   *Neuroscience:* Does REM = memory consolidation prove Dennett? Not exactly. REM involves activation of limbic systems, visual cortex, etc. Lucid dreaming (metacognition during sleep) is a huge counter-example to the "consciousness offline" claim.
