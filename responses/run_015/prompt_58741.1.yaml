      *Revised plan for "Progress":* Suggest that progress comes from abandoning the idea that "physicalism" must mean "everything is describable by current physics" and moving toward a view where consciousness is the intrinsic nature of the physical (Russellian Monism) OR accepting that the "Knowledge Argument" highlights an epistemic limit, not an ontological one (Non-reductive Physicalism).

