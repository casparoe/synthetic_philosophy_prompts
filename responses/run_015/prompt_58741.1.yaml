      *   Physicalist: "The data describes the experience. Instantiating it is just indexical."

  8.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical.
      *   Check that all parts of the prompt are addressed.
      *   Make sure the "Progress" section is constructive, not just dismissive.

