answer: |-
  Your hypothesis is astute and aligns with the most sophisticated developments in the philosophy of mind over the last two decades. The stalemate persists largely because the **Knowledge Argument** functions as a cross-purpose dialogue: Anti-Physicalists are making an *ontological* claim using epistemic premises, while Physicalists are making an *epistemic/semantic* defense against an ontological conclusion.

  Here is an evaluation of your hypothesis, an analysis of your simulation variant, and a diagnosis of what constitutes genuine progress.

  ### 1. Evaluating the Hypothesis: Metaphysics vs. Concepts

  Your diagnosis that the sides are answering different questions is largely correct, but it requires a slight nuance. It is not merely that they are doing different disciplines; it is that they disagree on whether an *epistemic gap* entails an *ontological gap*.

  *   **The Anti-Physicalist (Metaphysics of Experience):**
      *   **Claim:** Mary acquires new *propositional knowledge* (a new fact).
      *   **Underlying Assumption:** If physicalism is true, the physical description of the world is exhaustive. If there is a fact Mary does not know from the physical description, that fact is non-physical.
      *   **Focus:** They treat "what it is like" as a truth-maker. The focus is on the *content* of the knowledge. They argue that no amount of third-person data captures the first-person *mode of existence* of the experience.
  *   **The Physicalist (Theory of Concepts/Epistemology):**
      *   **Claim:** Mary acquires no new facts, only new *modes of presentation* (Phenomenal Concept Strategy), new *abilities* (Ability Hypothesis), or new *acquaintance*.
      *   **Underlying Assumption:** One can know all the facts about water ($H_2O$) without having the concept "water" available in a specific context. Similarly, one can know all physical facts about vision without possessing the *phenomenal concept* of red.
      *   **Focus:** They treat "what it is like" as a mode of access. The focus is on the *vehicle* of the knowledge. They argue the *property* is physical, but the *concept* used to grasp it is unique.

  **Verdict:** Your hypothesis holds. The Anti-Physicalist argues from the **indescribability** of experience to the **non-physicality** of experience. The Physicalist argues from the **uniqueness of phenomenal concepts** to the **compatibility** of experience with physicalism. They agree Mary changes epistemically; they disagree on what that change implies metaphysically.

  ### 2. The Simulation Variant: Testing the Diagnosis

  **The Variant:** Mary, while confined, exhaustively studies a perfect simulation of her own brain as it would respond to red. She sees the neural firing, the computational states, and the functional output. She knows the simulation is perfect.

  **Predicted Responses:**

  *   **Anti-Physicalist:**
      *   **Claim:** She still learns something new upon release.
      *   **Reasoning:** The simulation provides third-person structural/functional data. Even if the simulation is perfect, *observing* the simulation is not *instantiating* the state. The "what it is like" is the intrinsic nature of the state, not the structural description of the state.
      *   **Implication:** This reinforces the **Explanatory Gap**. No amount of objective data (even about one's own brain) equates to subjective experience. The simulation is a map; the experience is the territory.
  *   **Physicalist:**
      *   **Claim:** She learns nothing new (factually).
      *   **Reasoning:** If the simulation is perfect, it captures all physical facts. Upon release, her brain enters the state she simulated. She merely tokenizes a type she already understood. The "newness" is indexical (e.g., "*This* is the state I simulated"), not factual.
      *   **Implication:** This reinforces the **Phenomenal Concept Strategy**. Possessing the concept of "red experience" requires being in the state (or a functionally equivalent state). Studying the state from the outside grants the physical concept, but not the phenomenal concept. Both refer to the same physical reality.

  **What This Reveals:**
  The variant strips away the idea that Mary lacks "data." She has *all* the data, including data about her own physiology.
  1.  **Meaning of "Physical":** The disagreement reveals that Anti-Physicalists define "physical" as **objective/structural**, whereas Physicalists must define "physical" as **inclusive of subjective instantiation**.
  2.  **Standards of Evidence:** The Anti-Physicalist relies on the **intuition of distinctness** (the feeling of red feels distinct from neural firing). The Physicalist relies on the **principle of causal closure** (if the neural firing causes the behavior, and the experience causes the behavior, they are likely identical).
  3.  **Irreconcilable Intuitions:** The variant shows the stalemate is rooted in **Perspectival Realism**. Is the first-person perspective a distinct ontological realm (Anti-Physicalist), or is it just the system viewing itself from the inside (Physicalist)?

  ### 3. Diagnosis of the Disagreement

  The simulation variant clarifies that the disagreement is not merely semantic (about the word "knowledge"), nor is it purely about evidence. It is about **Ontological Commitment vs. Epistemic Humility.**

  *   **The Core Conflict:** The Anti-Physicalist believes that if two descriptions (neural firing vs. feeling red) are cognitively distinct, they must be metaphysically distinct (Leibniz's Law). The Physicalist denies this, arguing that cognitive distinctness does not entail metaphysical distinctness (just as "Morning Star" and "Evening Star" are cognitively distinct but metaphysically identical).
  *   **The Stalemate Source:** The Anti-Physicalist finds it inconceivable that a physical description *is* the experience. The Physicalist finds it inconceivable that a non-physical property could interact with the physical brain without violating causal closure.
  *   **The "Meaning of Physical":** This is the crux. If "physical" means "what current physics describes," Anti-Physicalism wins (physics doesn't describe qualia). If "physical" means "the fundamental stuff of the universe," Physicalism wins (qualia are part of that stuff).

  ### 4. What Would Count as Progress?

  Since the stalemate is driven by conflicting intuitions that are internally consistent, "progress" will not come from one side proving the other wrong within the current framework. Progress requires dissolving the false dichotomy.

  **A. Abandoning "Standard" Physicalism (Russellian Monism)**
  Progress would involve acknowledging that the Anti-Physicalist is right about the *gap* but wrong about the *conclusion*.
  *   **The Move:** Accept that physics describes the *structure/relations* of matter, not its *intrinsic nature*. Consciousness could be the intrinsic nature of the physical.
  *   **Why it helps:** It validates Mary's new knowledge (she learns the intrinsic nature) without positing a non-physical substance. It bridges the metaphysics/concepts divide.

  **B. Refining the Phenomenal Concept Strategy (PCS)**
  Progress involves Physicalists admitting that phenomenal concepts are *unique* and not reducible to functional concepts, without conceding ontological dualism.
  *   **The Move:** Acknowledge that the "newness" Mary feels is real and robust, but insist it is a feature of our cognitive architecture, not the world.
  *   **Why it helps:** It stops Physicalists from gaslighting the intuition (i.e., stopping the claim that "she learns nothing"). It validates the phenomenology while maintaining physical ontology.

  **C. Illusionism / Error Theory**
  Progress involves questioning the premise that Mary learns a "fact" at all.
  *   **The Move:** Argue that the intuition that there is a "fact of the matter" about qualia is a cognitive illusion. Mary gains a new *reaction*, not knowledge of a property.
  *   **Why it helps:** It attacks the Anti-Physicalist's starting intuition directly. If there is no "fact" to be known, the Knowledge Argument collapses.

  **D. Meta-Philosophical Progress**
  The most immediate progress is accepting your hypothesis: **The debate is a category error.**
  *   **The Move:** Philosophers should explicitly state whether they are arguing for *Ontological Physicalism* (what exists) or *Conceptual Physicalism* (how we describe what exists).
  *   **Why it helps:** It clarifies that the Physicalist is often defending the *causal completeness* of the physical world, while the Anti-Physicalist is defending the *irreducibility of the perspective*. These two claims are not necessarily contradictory if one adopts a non-reductive physicalism.

  ### Conclusion

  Your hypothesis is correct: the stalemate is a collision between **metaphysics of experience** (Anti-Physicalism) and **theory of concepts** (Physicalism). The simulation variant proves that even perfect objective knowledge of one's own brain fails to bridge the *perspectival* gap.

  Progress will not come from arguing over whether Mary knows a "fact." It will come from recognizing that **physicalism must be redefined** to accommodate the first-person perspective not as an add-on, but as the intrinsic nature of the physical system itself (Russellian Monism), or by accepting that the "Knowledge Argument" highlights a permanent limit of human epistemology rather than a feature of ontology. The parties are not answering the same question because they are looking at the same coin from opposite sides and arguing over whether it is "heads" or "metal."
