          *   Progress is clarifying the *type* of physicalism being defended.

  7.  **Refining the Simulation Variant Analysis:**
      *   Need to be careful. If she simulates her brain, does she simulate the *experience*?
      *   If Physicalism is true: Simulating the brain perfectly *might* instantiate the experience (if computation is sufficient). But usually, in these thought experiments, "studying a simulation" implies third-person observation.
      *   Let's assume she observes the simulation output (data), not that she *becomes* the simulation.
