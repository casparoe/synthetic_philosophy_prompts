answer: |-
  # PREP SHEET: Q&A STRATEGY
  **Seminar:** Invention in Historical Fiction
  **Speaker:** Novelist/Screenwriter
  **Subject:** Ethics of Dramatising the Dead (Great-Aunt)

  ## THREAT ASSESSMENT
  *   **Constituency with Genuine Force:** **The Archivists/Biographers.** Your theoretical framework rests on the integrity of the "record." If they prove you have contaminated the record (the fake diary), your "Counterfeit-evidence prohibition" collapses from within.
  *   **Single Reply That Must Land:** The distinction between an *archival document* (claiming to be historical evidence) and a *dramatic prop* (claiming to be internal subjectivity). You must convince the room that the diary extracts are visibly *not* presented as fact, but as dramatised interiority.
  *   **What to Give Away (First 2 Minutes):** Concede that **marking invention is imperfect.** Do not claim your "visible seams" are a perfect solution. Say: *"I am not claiming this method purifies the work, only that it refuses to hide the stain."* This disarms the Biographers who think it's a gimmick and buys goodwill from the Archivists.
  *   **The Question You Hope Nobody Asks:** *"You argue we owe the dead answerability. But by opening the envelope marked 'burn unread', you denied her the only answerability she asked for: silence. Did you earn the right to speak for her?"* (See **Objection 8**).

  ---

  ## THE EIGHT OBJECTIONS
  *(Listed in likely order of arrival. Damage Rank indicates threat level to your position: 1 = Catastrophic, 8 = Manageable.)*

  ### 1. The Biographer's Craft Objection
  **Likely Timing:** Early (Warm-up)
  **Damage Rank:** 8/8 (Low)
  **Voice:** "I write biography. We struggle to make the truth read like a story. You're suggesting we should break the reader's immersion with asterisks or title cards every time we compress time. Isn't that just treating the audience like children? If the drama works, they know it's a drama. Marking it feels like a gimmick that undermines the art."

  *   **90-Second Reply:** "It's not about protecting the audience from confusion; it's about protecting the subject from erasure. When we compress a decade into a year without marking it, we imply causality that didn't exist. We make her look impulsive rather than trapped. A title card isn't an apology; it's a citation. I'd rather break the spell of the drama for ten seconds than cast a spell over her life that she can't break. The 'gimmick' is the price of borrowing a voice that can't say 'stop'."
  *   **Concede:** Admit that visual markers can be clunky and disrupt emotional flow.
  *   **Soft Spot:** You are arguing for an aesthetic compromise that many artists find unacceptable. If they say "Art requires lies," you have no factual rebuttal.

  ### 2. The Archivist's Provenance Objection
  **Likely Timing:** Early-Mid
  **Damage Rank:** 6/8 (Medium)
  **Voice:** "I manage the county records. You talk about 'answerability,' but you've composites friends and compressed dates. Even if you mark them, you are creating a new, hybrid record that will outlive you. Future researchers will find your script in this archive alongside my letters. You're contaminating the provenance. How do you stop your fiction becoming someone else's fact?"

  *   **90-Second Reply:** "You're right to worry about contamination. That's why the 'Revisability Condition' demands the invention lives *in the texture* of the work, not just in a disclaimer. The script shouldn't sit in your archive as 'truth'; it should be catalogued as 'Adaptation.' My duty isn't to keep the archive pure—that's yours. My duty is to ensure that within the drama itself, the viewer knows where the map ends and the territory begins. I am not adding to your archive; I am dramatising its gaps."
  *   **Concede:** Acknowledge that scripts often get misfiled or treated as primary sources by future biographers.
  *   **Soft Spot:** You cannot control how your work is archived after you die. You are relying on metadata that might get lost.

  ### 3. The Son's Betrayal Objection
  **Likely Timing:** Mid (Emotional Peak)
  **Damage Rank:** 5/8 (Medium-High)
  **Voice:** "I'm her son. You talk about 'answerability' and 'duties.' She asked for that box to be burnt. She wanted to be forgotten. You opened it. You're digging up a shame she buried because you want a career. You say the dead can't be harmed, but you're harming the living who have to carry this shame again. Isn't this just disloyalty dressed up as ethics?"

  *   **90-Second Reply:** "I cannot undo the pain this causes you, and I accept that. But her wish to be forgotten was born of shame, not truth. The fraud wasn't a crime of malice; it was covering debt for family. By burying it, the story became 'she was a criminal.' By telling it, the story becomes 'she was a sister who took a fall.' I didn't open the box for a career; I opened it because the silence was heavier than the shame. I owe you loyalty, but I also owe her the complexity she denied herself."
  *   **Concede:** Explicitly validate his pain. "I know this hurts you." Do not argue his feelings are wrong.
  *   **Soft Spot:** You cannot logically defeat the claim that you violated her explicit autonomy (the burn instruction). You are arguing *against* her stated will.

  ### 4. The Cousin's Veto Objection
  **Likely Timing:** Mid (Follow-up to Son)
  **Damage Rank:** 4/8 (Medium)
  **Voice:** "I want the story told, but this word 'answerability'... it sounds like you've invented a polite way to say the family gets a veto. If the family says 'no,' does the work stop? Or is 'answerability' just something you tick off so you can ignore us? Who actually holds the power to revise the portrait if we disagree?"

  *   **90-Second Reply:** "Answerability isn't a veto; it's a conversation. A veto stops the work. Answerability demands the work includes the tools to question it. If your family says 'this is wrong,' and I have marked my inventions, you can point to the mark and say 'this is where he lied.' If I hadn't marked them, you'd have no ground to stand on. I'm not giving you power over the script; I'm giving you the evidence to critique it."
  *   **Concede:** Admit that "answerability" sounds bureaucratic and cold.
  *   **Soft Spot:** In practice, a TV production won't change based on family critique. Your "tools to question" are theoretical, not practical.

  ### 5. The Media Lawyer's Risk Objection
  **Likely Timing:** Mid-Late
  **Damage Rank:** 3/8 (High Practical Threat)
  **Voice:** "I advise broadcasters. You're discussing moral duties. I'm discussing liability. You have living relatives. You have a fraud conviction on record. If you depict this fraud, even accurately, you risk defamation by implication if other living people are suggested to be involved. Your 'ethical framework' doesn't protect the producer from a lawsuit. Does 'answerability' cover legal costs?"

  *   **90-Second Reply:** "No, it doesn't. Ethics and law are different jurisdictions. My framework is about what we *should* do, not what we *can* get away with. However, transparency reduces risk. If I clearly mark composites and inventions, I am less likely to be accused of malicious falsehood because I'm not claiming these are facts. But you're right: a disclaimer doesn't stop a writ. That's why the ethical duty must be stricter than the legal one."
  *   **Concede:** Admit that your ethical model offers no legal shield.
  *   **Soft Spot:** You are admitting your framework is legally useless. If the broadcaster gets sued, your ethics vanish.

  ### 6. The Archivist's "Fake Diary" Objection (THE KILLER)
  **Likely Timing:** Late (Once they've heard your rules)
  **Damage Rank:** 1/8 (Catastrophic)
  **Voice:** "You stated a 'Counterfeit-evidence prohibition': no fabricated documents shown as if archival. Yet you admitted you created diary extracts in her handwriting that she never wrote. You are presenting a forgery as a window into her mind. That isn't 'marking invention'; that is creating a false record in her voice. How is that not a direct violation of your own first rule?"

  *   **90-Second Reply:** "It is the hardest line to walk. The distinction is between a *record* and a *representation*. A record claims to be evidence of an event. The diary in the drama is not evidence; it is a dramatisation of interiority, like a voiceover. It is not presented as 'found footage.' It is presented as 'this is how we are interpreting her mind.' If I used it to prove a date or a fact, I would be wrong. I use it to show a state of mind. The handwriting makes it intimate, but the context must make it clear it is a construction."
  *   **Concede:** Admit that using her handwriting is risky and borders on the prohibition.
  *   **Soft Spot:** If the audience perceives the handwriting on screen as "evidence," you have lied. You are relying on directorial nuance to defend an ethical breach.

  ### 7. The Philosopher's Coherence Objection
  **Likely Timing:** Late
  **Damage Rank:** 2/8 (High Theoretical Threat)
  **Voice:** "I work on posthumous harm. You say the dead cannot be harmed, so we owe them 'answerability.' But answerability requires an answerer. If she doesn't exist, she can't contest the portrait. You aren't owing *her* anything; you're owing *us* (the living) a cleaner conscience. Isn't 'answerability to the dead' just a category error? You should admit this is about the living audience's integrity, not her rights."

  *   **90-Second Reply:** "It is a fiction, yes. She cannot answer. But 'answerability' isn't about her actual response; it's about my posture. If I treat her as if she *could* answer, I constrain my own invention. It's a regulative ideal. If I say 'I owe this to the living,' I can justify anything by saying 'the living need a good story.' If I say 'I owe this to her,' I have to stop where her voice would stop. It's a discipline for the author, not a right for the dead."
  *   **Concede:** Admit that "rights of the dead" are metaphysically shaky.
  *   **Soft Spot:** You are admitting your core concept is a "fiction." A philosopher will press on why a fiction should constrain real-world action.

  ### 8. The "Standing" Objection (The Question You Fear)
  **Likely Timing:** Final Question
  **Damage Rank:** 1/8 (Catastrophic Moral Threat)
  **Voice:** (Could be Philosopher or General Audience) "You argue that we must respect the dead's voice. But you opened an envelope marked 'Burn Unread.' You violated her explicit instruction to ensure her silence. If you didn't respect her wish to be silent, why should we trust you to respect her voice in speech? Didn't you disqualify yourself the moment you opened that envelope?"

  *   **90-Second Reply:** "That is the contradiction I live with. I cannot claim moral purity. I opened it because the silence was already broken by the box's existence. But you're right: I forfeited the right to be the 'guardian' of her reputation. I am not her guardian; I am her debtor. I am telling this story not because I have the right to, but because I have the responsibility to explain why I broke my promise. The drama includes that guilt. If I pretended I had the right, I'd be lying again."
  *   **Concede:** **Total concession.** Do not defend opening the envelope. Admit it was a violation.
  *   **Soft Spot:** There is no defense. If you claim it was "necessary," you look arrogant. If you say it was "wrong," you undermine your authority to tell the story. You must rest on *atonement* rather than *justification*.

