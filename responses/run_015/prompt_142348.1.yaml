  ## STRATEGIC NOTES

  **1. The "Fake Diary" Trap (Objection 6)**
  This is the most dangerous technical point. The Archivists will smell blood here.
  *   **Preparation:** Ensure your script *visually* distinguishes the diary. Is it voiceover? Is the paper aged artificially? Is there a visual glitch? You need a concrete example of *how* it is marked, not just a theory.
  *   **Defense:** "It is a **dramatic device**, not an **archival claim**." Repeat this mantra.

  **2. The Family Dynamic (Objections 3 & 4)**
  Your great-uncle is in the room. He is 79.
  *   **Tone:** Do not debate him. Do not use academic terms like "interpretive material" with him. Use words like "memory," "shame," and "love."
  *   **Risk:** If he walks out or becomes visibly distressed, the room turns against you immediately.
  *   **Mitigation:** In your opening remarks, acknowledge him by name and thank him for his tolerance. Humanize him before he has to object.

  **3. The Philosopher's Trap (Objection 7 & 8)**
  The Philosopher will try to dismantle your terminology.
  *   **Tone:** Humble. "I am a writer, not a philosopher. I am using these terms to describe a practice, not to build a system."
  *   **Risk:** Getting bogged down in metaphysics.
  *   **Mitigation:** Pivot back to the *craft*. "In the editing room, this is what this duty looks like..."

  **4. The "Burn" Envelope (Objection 8)**
  *   **Crucial:** Do not argue that you were *right* to open it. Argue that you are *answerable* for having opened it.
  *   **Phrase to use:** "I am not defending the opening of the envelope. I am accepting the consequences of it."

  **5. Buying the Room (First 2 Minutes)**
  *   **Action:** Start by acknowledging the tension in the room.
  *   **Script:** "I know there are people in this room who think I shouldn't be standing here. Some because I've invented facts, some because I've revealed secrets, some because I broke a promise to the dead. I'm not here to convince you I'm right. I'm here to show you how I try to be less wrong."
  *   **Why:** This lowers defenses. It shows you aren't arrogant. It pre-empts the "You're disloyal" attack by admitting it first.

  **6. The Single Reply That Must Land**
  *   **Target:** Objection 6 (The Fake Diary).
  *   **Why:** If you admit you broke your own "Counterfeit-evidence prohibition," your entire ethical framework is revealed as hypocritical. You must successfully argue that a *dramatised* diary is not a *counterfeit record*.
  *   **Key Distinction:** "A record claims to be **evidence**. A prop claims to be **emotion**."

  **7. Constituency with Genuine Force**
  *   **The Archivists.** They hold the objective standard of "truth in documentation." Your project blurs this line. If they decide your work contaminates the historical record, your "Answerability" argument looks like sophistry designed to excuse fiction. Treat their concerns with the highest respect.

  **8. The Forbidden Question**
  *   **Question:** *"By opening the envelope marked 'burn unread', didn't you commit the very act of silencing you claim to be rectifying?"*
  *   **Why it's dangerous:** It attacks your **moral standing** (locus standi). If you had no right to open the box, you have no right to the information inside, and therefore no right to build a career on it. It frames your entire project as "fruit of the poisonous tree."
  *   **Preparation:** Have the "Atonement" reply ready (see Objection 8). Do not get defensive.
