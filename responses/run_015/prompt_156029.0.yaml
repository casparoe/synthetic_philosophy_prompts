answer: |-
  The honest answer is that there is no single principle of the kind Good's Theorem offers, because Good's Theorem describes an ideal agent whose utility function is a static mathematical object, not a human being whose utility function is a dynamic, psychological process embedded in social roles.

  Your intuition that the theorem is "close to useless" is correct. It fails because it treats information as a *key* that unlocks a door, whereas for humans, information is often a *pigment* that changes the color of the room you are already standing in. You cannot "decline to let it change what you does" because the mere possession of the information alters your state of being, your capacity for joy, or your standing in a normative practice.

  Since you invited the taxonomy if a single principle proved impossible, I will offer you a **Taxonomy of Information Toxicity**. This is not a rejection of decision theory, but an expansion of the cost function to include cognitive, experiential, and normative friction.

  Here are the three constraints that Good's Theorem ignores, followed by their application to your cases.

  ### The Three Constraints

  **1. The Constraint of Cognitive Fidelity (The Weighting Problem)**
  *   **Principle:** Information has negative expected value if the agent lacks the cognitive bandwidth or statistical intuition to weight the signal correctly, leading to action based on fear rather than probability.
  *   **Why Good's Theorem fails here:** It assumes you can treat a 2% risk increase the same as a 90% risk increase. Humans cannot. We convert probabilities into narratives (dread or hope).
  *   **The Test:** Is the signal-to-noise ratio high enough that I can act on it without distorting my view of the world?

  **2. The Constraint of Experiential Integrity (The Spoiler Problem)**
  *   **Principle:** Information has negative expected value if possessing it degrades the intrinsic value of an experience that is currently ongoing or constitutes a good in itself.
  *   **Why Good's Theorem fails here:** It assumes the utility of a state is independent of knowledge about that state. But for humans, *ignorance* is sometimes a constituent of the utility (e.g., suspense, surprise, innocence).
  *   **The Test:** Does knowing this turn a *life* I am living into a *problem* I am solving?

  **3. The Constraint of Normative Role (The Corruption Problem)**
  *   **Principle:** Information has negative expected value if accessing it violates the constitutive rules of a social or professional practice you are engaged in, thereby rendering your subsequent actions illegitimate.
  *   **Why Good's Theorem fails here:** It assumes all actions are private maximizations. It ignores that some actions (grading, judging, insuring) are public trust roles with restricted information channels.
  *   **The Test:** Does knowing this make me a different kind of agent than the one required for this task?

  ---

  ### Verdicts on Your Eight Cases

  Here is how the taxonomy adjudicates your list.

  **1. Huntington's Test (Worth it)**
  *   **Verdict:** **Pass.**
  *   **Reasoning:** High signal (binary result), high actionability (children, mortgage). It violates Experiential Integrity (you will worry), but the Cognitive Fidelity is high (you know the stakes), and it serves a Normative Role (parent/planner). The instrumental value outweighs the experiential cost.

  **2. Whole-Genome Scan (Not worth it)**
  *   **Verdict:** **Fail (Cognitive Fidelity).**
  *   **Reasoning:** As you noted, you cannot trust yourself to weight hundreds of weak signals. The "noise" will overwhelm the "signal," converting statistical variance into dread. This is the exact failure mode Good's Theorem ignores: the cost of *processing* the information exceeds the value of the information.

  **3. Surgeon Stats (Worth asking)**
  *   **Verdict:** **Pass.**
  *   **Reasoning:** High signal, high actionability (choose surgeon or don't). It does not corrupt the surgery; it informs the selection.

  **4. Novel Ending (Not worth reading)**
  *   **Verdict:** **Fail (Experiential Integrity).**
  *   **Reasoning:** The utility of a novel is the process of reading it. Knowing the end destroys the good. This is the purest case of information having negative utility because the "state of not knowing" is the thing being consumed.

  **5. IQ Score (Not worth knowing)**
  *   **Verdict:** **Fail (Experiential/Cognitive).**
  *   **Reasoning:** Low actionability. High risk of identity contamination (anchoring your self-concept to a number). It converts a fluid capacity into a fixed label.

  **6. Teaching Evaluations (Not worth looking)**
  *   **Verdict:** **Fail (Normative Role).**
  *   **Reasoning:** This addresses your tension with Case 3. A surgeon's stats are external data used to *select* an agent. Teaching evaluations are feedback on your *performance* as a judge. If you look at them before grading, you are no longer grading the student; you are managing your own ego or retaliating. It violates the constitutive rule of grading: that it must be blind to the grader's self-interest.

  **7. Employer/Insurer Knowing (Not worth it)**
  *   **Verdict:** **Fail (Normative Role/Adversarial).**
  *   **Reasoning:** This changes the game from a medical context (care) to an economic context (risk mitigation). The information is the same, but the *agency* receiving it has a utility function opposed to yours. Good's Theorem assumes the information is for *you*; here, it is *about* you, for *them*.

  **8. Mother's Notes (Worth it)**
  *   **Verdict:** **Pass (with caveats).**
  *   **Reasoning:** You foresee the Cognitive cost (hypochondria), but you judge the instrumental value (preparation, understanding the phenotype) to be higher. This is a rational trade-off where you accept a known psychological cost to purchase preparedness.

  ---

  ### The Two Unlisted Cases

  **Case A: The Friend Certain the Result Changes Nothing**
  *   **Verdict:** **Do not test.**
  *   **Reasoning:** If she is truly certain that no result changes her action (e.g., she will have children regardless, she will not change her career), then the *instrumental* value of the information is zero.
  *   **Principle Application:** If Instrumental Value = 0, then any negative Experiential Cost (anxiety, dread, "waiting for the shoe to drop") makes the Expected Value negative.
  *   **Nuance:** Good's Theorem would say the value is zero (indifferent). But because humans cannot perfectly compartmentalize, the "state of knowing" carries a psychological tax. If there is no offsetting benefit (action), the tax makes it a net loss. She should abandon the test unless she values "truth" as an intrinsic good higher than "tranquility."

  **Case B: Clinic Result vs. Patient-Portal Message (Sunday Night)**
  *   **Verdict:** **Clinic Yes; Portal No.**
  *   **Reasoning:** This is a matter of **Contextual Containment**.
  *   **Principle Application:** Information does not arrive in a vacuum; it arrives in a setting that dictates how it is processed.
      *   *Clinic:* A normative container. A professional is present to frame the data, manage the emotional reaction, and immediately pivot to action. The information is "held" by the relationship.
      *   *Portal/Sunday:* Isolation. The information lands in a vacuum, inviting rumination. The "Sunday Night" factor implies vulnerability and lack of support resources.
  *   **Difference:** The *data* is identical, but the *information* (data + context) is different. The Portal delivery increases the risk of Cognitive Fidelity failure (misinterpreting alone) and Experiential Contamination (ruining the weekend/isolation).

  ---

  ### Conclusion: Abandon the Principle, Keep the Verdicts

  You asked whether you should abandon your verdicts or the principle.

  **Abandon Good's Theorem.** It is a theorem about *ideal observers*, not *embodied agents*. It treats the mind as a hard drive where files can be stored without affecting the operating system. Your mind is not a hard drive; it is a chemical soup where reading a file changes the pH.

  **Keep Your Verdicts.** They are remarkably consistent. They reveal that you are intuitively applying a more sophisticated decision theory than Good's—one that accounts for:
  1.  **Processing Costs:** (Case 2 vs 1)
  2.  **Constitutive Rules:** (Case 6 vs 3)
  3.  **Experiential Goods:** (Case 4)

  **The Guiding Principle for You:**
  Do not ask, "Can I ignore this information if I want to?" (The Good's Theorem question).
  Instead ask, **"Will possessing this information make me a worse version of the agent I need to be?"**

  *   For the mortgage/children decision, you need to be a **Planner**. The HD test makes you a better Planner.
  *   For the grading decision, you need to be a **Judge**. The evaluations make you a corrupted Judge.
  *   For the novel, you need to be a **Reader**. The spoiler makes you a Reviewer.
  *   For the genome scan, you need to be a **Patient**. The variants make you a **Hypochondriac**.

  Your hesitation is not a failure of rationality; it is a recognition that different kinds of knowledge require different kinds of selves, and not all selves are worth becoming.
