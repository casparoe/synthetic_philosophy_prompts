      *   **Tone:** Precise, structured, philosophical yet visceral.

  2.  **Deconstruct the Paradox:**
      *   *The Problem:* To change the rules of change (Article Two), you must use the current rules of change. But if the new rules change *who* gets to vote or *how* they vote, does the old group have the authority to validate the new group?
      *   *The Mirror Clause Twist:* If Article Two is changed, the Arbiters must validate the *old* text using the *old* procedure, while the Senate is seated as *before*. This creates a temporal/ontological glitch. You are asking the "ghost" of the old system to authorize its own death.

  3.  **Design the Simulation Mechanics:**
      *   **Time:** 90 minutes total.
      *   **Roles:**
          *   5 Senators (Constituent Senate): Want to pass Article Four (Distributive Justice). Need to lower threshold to 3/5 (Simple Majority of 5).
          *   3 Arbiters (Arbiter Council): Hidden objective is "Procedural Integrity." They must enforce the text exactly.
          *   1 Facilitator (The Clerk): Neutral, keeps time, manages props.
      *   **Props:**
          *   The Protocol Booklet (Rules).
