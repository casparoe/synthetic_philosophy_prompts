      *   *Best approach for the Novel:* The Arbiters realize that to validate the change, they must validate the *old* rule. But the old rule is being deleted. You cannot validate a deletion using the thing being deleted, because once deleted, the validation has no ground.
      *   *Let's go with the "Ghost Senate" problem:* The Mirror Clause requires the Senate to be seated as *before*. But the Amendment (Article Four) redistributes seats. If they seat them as *before*, they are negating the Amendment they just voted on. If they seat them as *after*, they violate the Mirror Clause.

  6.  **Developing the Debrief:**
      *   Map the physical frustration to the logical paradox (Kelsen, Hart, Schmitt).
      *   Address the "Ad Hoc Meta-Rule" (participants inventing a way out).
      *   Address the "Infinite Regress" (the simulation stops, but the logic continues forever).
      *   Facilitator's role: Don't solve it. Highlight the silence.

  7.  **Novelist's Note:**
      *   Focus on the physicality: the ink, the wax, the silence, the glances.
      *   Dialogue should be fragmented, procedural, then desperate.

  8.  **Review against Constraints:**
      *   8 participants (5 Sen, 3 Arb).
      *   90 minutes.
      *   Props: Envelope, Tokens, Stamp.
      *   Incentives: Senators want Art 4, Arbiters want Integrity.
      *   Debrief included.
      *   Novel adaptation advice included.

  9.  **Refining the "Mirror Clause" Logic for the Simulation:**
      *   *Current Draft:* Senators vote 4-1 to amend Art 2 (4/5 -> 3/5) and add Art 4.
      *   *Arbiter Duty:* Check Mirror Clause.
      *   *Requirement:* Stamp the Shadow-Text (Old Art 2).
      *   *Requirement:* Senate seated "as constituted prior."
      *   *The Conflict:* The "Prior Constitution" includes the *authority* of the 4/5 rule. The New Constitution claims authority from the 3/5 rule. By stamping the Old Text, the Arbiters affirm the Old Text is still the source of authority. If the Old Text is the source, the New Text (3/5) is invalid because it wasn't born yet. If the New Text is valid, the Old Text is dead and cannot be stamped.
      *   *Physical manifestation:* The Stamp ink is red. The Shadow Text is black. The Senators must sit in specific chairs marked "Constituent." If they move, the Arbiters halt.
