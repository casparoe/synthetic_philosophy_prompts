answer: |-
  # Joint Statement on Future Contingents and the Metaphysics of Time

  **Signatories:**  
  **A.** Proponent of Open-Future Indeterminism (OFI)  
  **B.** Proponent of Ockhamism (OCK)  

  **Date:** October 26, 2023  
  **Subject:** Areas of Agreement, Residual Disagreement, and Empirical Cruxes Regarding Future Contingents  

  Following a period of adversarial collaboration concerning the semantics and metaphysics of future contingents, specifically utilizing the classic Naval Battle example and three stipulated test cases (Satellite Coin, Martian Storm, Retrospective Bet), we issue this joint statement. Our aim is to isolate the substantive metaphysical disagreements from verbal disputes and agreed-upon logical constraints.

  ### I. Agreed Claims

  1.  **Distinction Between Bivalence and Excluded Middle:**  
      We agree that the Principle of Bivalence (every proposition is either true or false) is distinct from the Law of Excluded Middle (for any proposition $P$, the disjunction $P \lor \neg P$ is valid). We agree that one may consistently accept the validity of Excluded Middle while rejecting Bivalence for a specific class of propositions (e.g., future contingents).

  2.  **The Representation of Branching Time:**  
      We agree that a branching-time model represents *metaphysical* possibilities, not merely *epistemic* alternatives. The branches represent ways the world could genuinely evolve, not merely ways an observer might come to know the world. In both the **Naval Battle** and **Satellite Coin** cases, the branching represents objective indeterminacy, not just ignorance.

  3.  **The Definition of Fatalism:**  
      We agree that Fatalism is the erroneous inference from "It is true that $E$ will occur" to "It is *necessary* that $E$ will occur" (or "It is causally determined that $E$ will occur"). We agree that truth does not entail causal necessity. In the **Martian Storm** case, where the event is deterministic but unknowable, we agree that the event is causally necessitated, but we distinguish this from the **Satellite Coin** case, where the event is not causally necessitated.

  4.  **Norms of Assertion and Credence:**  
      We agree that the norms governing *assertion* are epistemic, not purely metaphysical. An agent is not warranted in asserting "There will be a sea battle" merely if it is metaphysically true (as OCK might hold); they require evidence or knowledge. Consequently, in the **Satellite Coin** case, both parties agree that rational credence should align with objective chance (the Principal Principle), assigning a credence of 0.5 to Heads, regardless of whether the proposition "Heads" currently possesses a truth value.

  ### II. Table of Residual Disagreements

  The following table outlines the remaining substantive disagreements. The wording has been negotiated to ensure that each signatory accepts the formulation in their column as a fair representation of their view.

  | Issue | Open-Future Indeterminist (OFI) | Ockhamist (OCK) |
  | :--- | :--- | :--- |
  | **1. Truth in Indeterministic Futures** | In cases of genuine metaphysical indeterminacy (e.g., **Satellite Coin**), there is no fact of the matter at present. The proposition "The coin will land Heads" is neither true nor false. There is no "Thin Red Line" distinguishing the actual future from other possible branches until the event occurs. | In cases of genuine metaphysical indeterminacy, there is a fact of the matter. One branch is privileged as the "actual" future (the Thin Red Line). The proposition "The coin will land Heads" is either true or false now, even though its truth is not grounded in causal necessity. |
  | **2. Retrospective Ascription** | Regarding the **Retrospective Bet**: When the winner says tomorrow, "What you said yesterday was true," this is shorthand for "What you said yesterday has *become* true." It is incorrect to say the proposition possessed the property of truth *at the time of utterance*. | Regarding the **Retrospective Bet**: When the winner says tomorrow, "What you said yesterday was true," this is literally correct. The proposition possessed the property of truth *at the time of utterance*, even though that truth was contingent and unknowable at that time. |
  | **3. Deliberation and Truth** | Deliberation requires the future to be metaphysically open in a strong sense: the propositions describing the outcomes of deliberation cannot yet be true. If "I will $\phi$" is already true, deliberation is rendered unintelligible or merely epistemic. | Deliberation is compatible with the future already being true. To deliberate is to determine *which* true proposition about the future comes to be the case via one's agency. Truth does not rob agency of its power; it merely describes the outcome of that power. |
  | **4. The Martian Storm Case** | Since the **Martian Storm** is deterministic, we concede it has a truth value. However, this highlights that truth tracks *causal settlement*. The Satellite Coin lacks this settlement, hence it lacks truth. | The **Martian Storm** has a truth value because it is determined, but the **Satellite Coin** also has a truth value. The difference is not in the existence of a truth value, but in the *modal status* (necessary vs. contingent) of that truth. |

  ### III. Cruxes: Considerations and Predictions

  We identify three specific considerations where our metaphysical commitments lead to divergent predictions about linguistic intuition or phenomenological experience. We record these predictions in advance to facilitate future empirical or conceptual adjudication.

  **Crux 1: The Retrospective Truth Survey**
  *   **Consideration:** A linguistic survey presenting the **Retrospective Bet** case to naive speakers. Participants are told: "On Monday, Alice said 'It will rain on Tuesday.' It rained on Tuesday. On Tuesday, is it correct to say 'Alice's statement on Monday was *true*'?"
  *   **OCK Prediction:** A significant majority will affirm that the statement was true on Monday. Ordinary language treats future truths as tensed facts that exist prior to verification.
  *   **OFI Prediction:** A significant portion will hesitate or prefer "It turned out to be true" or "It has become true." Ordinary language reflects the metaphysical reality that the truth was not present on Monday.

  **Crux 2: The Satellite vs. Martian Intuition Pump**
  *   **Consideration:** Subjects are presented with the **Satellite Coin** (indeterministic) and the **Martian Storm** (deterministic but unknowable). They are asked: "In which case does the statement 'It will happen' describe a fact that exists *right now*?"
  *   **OCK Prediction:** Subjects will treat both cases similarly regarding truth. The epistemic inaccessibility of the Martian Storm does not change the semantic status compared to the Satellite Coin. Both are facts now.
  *   **OFI Prediction:** Subjects will distinguish the cases. They will attribute a current fact to the Martian Storm (because it is causally settled) but deny a current fact to the Satellite Coin (because it is causally open). Truth tracks causal settlement.

  **Crux 3: The Phenomenology of Fatalism**
  *   **Consideration:** Agents are asked to reflect on the **Deliberation** scenario. They are asked: "If you firmly believed 'It is *true* right now that I will choose Coffee,' would you feel your deliberation between Coffee and Tea was still genuine?"
  *   **OCK Prediction:** Agents will report that deliberation remains genuine. The belief in truth does not induce a sense of coercion or passivity.
  *   **OFI Prediction:** Agents will report that such a belief undermines the sense of agency. The feeling of "openness" required for deliberation is incompatible with the belief that a truth value already attaches to the outcome.

  ### IV. Conclusion on Verbal Disputes

  We conclude by noting the extent to which this dispute is merely verbal.

  1.  **Merely Verbal:** We agree that if "True" is defined functionally as "That which corresponds to the way the world eventually is," then we are merely verbalizing. Both parties agree that if the coin lands Heads, the prediction "Heads" is vindicated.
  2.  **Substantive:** We agree the dispute is **not** merely verbal regarding the metaphysics of the **Thin Red Line**. The Ockhamist is committed to the existence of a privileged branch in the ontology of time *now*, whereas the Open-Future Indeterminist denies this ontology. This is a disagreement about the structure of reality, not merely the definition of the word "truth."
  3.  **Substantive:** We agree the dispute is **not** merely verbal regarding the **Retrospective Bet**. The disagreement over whether we should *assert* "It was true" vs "It has become true" carries normative weight for how we understand the relationship between time, assertion, and reality.

  **Signed,**

  _________________________  
  (Open-Future Indeterminist)

  _________________________  
  (Ockhamist)
