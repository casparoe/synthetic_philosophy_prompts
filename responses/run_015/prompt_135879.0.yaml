answer: |-
  The pedagogical practice of the Plutarchan *synkrisis* (comparison) presupposes a sophisticated, cognitivist theory of moral learning that stands in sharp contrast to both didactic rule-following and later hagiographic imitation. By pairing lives across cultural divides without resolving their contradictions into a single normative model, Plutarch advances a specific account of moral cognition, exemplarity, and the universality of virtue.

  ### I. Philosophical Commitments: Moral Cognition and Exemplarity

  The primary philosophical commitment of this practice is that **moral knowledge is deliberative rather than receptive.** It assumes that the reader possesses the capacity for *phronesis* (practical wisdom) and that this capacity is strengthened not by observing perfection, but by navigating complexity.

  1.  **Moral Cognition as Judgment:** The practice rejects the idea that moral truth can be transmitted as a static proposition. Instead, moral cognition is an active exercise of weighing variables. By presenting two "mirrors" that reflect similar virtues (e.g., courage in Alcibiades and Coriolanus) but through different cultural lenses and personal flaws, the text forces the reader to isolate the virtue from the context. The reader must discern what is essential to the virtue and what is accidental to the circumstance.
  2.  **Exemplarity as Case Study, Not Icon:** In this framework, an exemplar is not a statue to be copied (*mimesis* of action) but a problem to be solved (*mimesis* of judgment). The preservation of contradictions (e.g., a hero's generosity paired with their vanity) is crucial. If the life were sanitized, the reader would not need to exercise judgment; they would only need to emulate. The "fractured whole" demands that the reader separate the wheat from the chaff, thereby internalizing the *process* of evaluation rather than the *content* of the life.
  3.  **Cross-Cultural Moral Knowledge:** The practice presupposes a **moderate moral universalism.** It requires that virtues (courage, justice, temperance) are culturally invariant *enough* to be recognized across the Greek and Roman worlds. If courage in Athens were ontologically distinct from courage in Rome, the comparison would be category error. However, it also acknowledges that the *expression* of virtue is culturally constituted. The comparison works because there is a shared human nature (a Stoic or Platonic assumption) that allows for translation, even if the political vocabularies differ.

  ### II. Reconstructing the Implicit Theory: Invariance vs. Framing

  Does this practice require virtues to be culturally invariant, or are they constituted by the comparison? The implicit theory occupies a middle ground: **Virtues are invariant in essence but constituted in understanding by the comparative framing.**

  *   **Invariant Recognition:** For the *synkrisis* to function, there must be a pre-existing moral vocabulary. The reader must already have a rough concept of "ambition" to see how it plays out differently in Lysander and Sulla. Without this invariant core, the pairing is unintelligible.
  *   **Constitutive Framing:** However, the *depth* of the moral concept is generated by the friction between the lives. The comparison does not merely map A onto B; it tests the limits of the concept. By seeing how a specific virtue fails or succeeds in different political systems (Republic vs. Monarchy), the reader's definition of that virtue is refined. Thus, the moral concept is not static; it is sharpened by the comparative framing.

  **Mechanism of Learning:**
  The practice relies primarily on the **deliberative weighing of incommensurable characters**, rather than simple analogical transfer or emotional admiration.
  *   *Not Analogical Transfer:* If it were purely analogical, the goal would be to say "Do what Alexander did." But Plutarch often shows why what worked for Alexander would fail for Caesar.
  *   *Not Emotional Admiration:* While admiration is present, it is not the engine of learning. Admiration of a "fractured whole" is unstable; one admires the greatness while pitying the flaw.
  *   *Deliberative Weighing:* The core mechanism is judicial. The reader acts as a juror weighing evidence. The incommensurability (different cultures, different ends) forces the reader to abstract a higher-order principle of conduct that transcends both specific lives.

  ### III. Consistency with Hagiography

  The Plutarchan paired, unresolved format is **philosophically inconsistent** with the hagiographic tradition's tendency toward unified sanctity. They depend on incompatible accounts of what a life reveals about character.

  1.  **The Teleology of the Life:**
      *   *Plutarch:* The end of the biography is **political and ethical virtue** within the secular sphere. Contradictions are evidence of human limitation and the tragedy of the moral life. The tension remains unresolved because the human condition is inherently conflicted.
      *   *Hagiography:* The end of the biography is **sanctity** (union with the Divine). Contradictions are either sins (to be repented and erased) or holy paradoxes (to be revered as mysteries). The narrative arc moves toward *resolution* and *unity*. A saint's life is often edited to suppress contradictions that do not serve the model of holiness.
  2.  **The Role of the Reader:**
      *   *Plutarch:* The reader is a **judge** standing above the subjects, evaluating them.
      *   *Hagiography:* The reader is a **disciple** standing below the subject, seeking to ascend to their level through imitation and grace.
  3.  **Incompatibility:** Plutarch's method requires the *sustainment* of tension to generate thought. Hagiography requires the *resolution* of tension to generate faith. If a hagiographer adopted Plutarch's unresolved pairing, it would undermine the certainty of the saint's intercessory power. If Plutarch adopted hagiographic unity, it would undermine the reader's moral autonomy. One reveals character as a site of struggle; the other reveals character as a vessel of grace.

  ### IV. Shift to a Singular, Unproblematic Model

  If the implicit view were replaced by a theory treating moral learning as **direct emotional attachment to an unproblematic, singular model**, the pedagogical practice would undergo fundamental changes:

  1.  **Suppression of Contradiction:** The biographical text would cease to be critical history and become edifying legend. Flaws, ambiguities, and failures would be excised or reinterpreted as hidden virtues. The "fractured whole" would be repaired into a smooth surface.
  2.  **Collapse of the Pair:** The *synkrisis* would be abandoned. Pairing implies choice and judgment; a singular model implies authority and command. Comparing a Saint to a Sinner (or even a Saint to another Saint) risks diluting the absolute demand for imitation. The focus would shift to the unique, incomparable individual.
  3.  **Shift from Judgment to Devotion:** The reader's cognitive role would shift from *deliberation* to *attachment*. The pedagogical goal would no longer be to train the reader's judgment (*phronesis*) but to capture their will (*thumos*). Learning would be measured by the intensity of identification with the model, not the nuance of the ethical distinction drawn.
  4.  **Universalization of Context:** To make the singular model universally imitable, specific cultural or political contexts that limit the model's applicability would be spiritualized or removed. The model becomes a timeless icon rather than a historical agent.

  In summary, Plutarch's practice presupposes that moral maturity requires the friction of comparison and the acceptance of human flaw. It treats virtue as a universal language spoken in local dialects, understood only through the active translation of the reader. To replace this with a singular, unproblematic model is to abandon the project of ethical education for the project of devotional formation, trading the reader's autonomy for the comfort of a clear, unquestionable path.
