answer: |-
  Here is an audit of your eight-point package. I have ranked the tensions by severity, from direct contradiction to conceptual friction.

  ### 1. The Critical Contradiction: (5) vs. (6)
  **Severity: Critical**
  This is not merely a tension; it is a direct logical conflict.
  *   **The Conflict:** (5) explicitly states that mere non-compliance does not cost you standing; only a lack of *commitment* (readiness to exempt oneself) does. (6) delivers a verdict where the agent is non-compliant but *exhibits commitment* (believes, votes, feels wretched), yet you assert they *lose standing*.
  *   **The Cost:** You cannot hold both. If (5) is your definition, the verdict in (6) is unjustified. If (6) is your intuition, (5) is false.
  *   **The Fix:** You must revise (5). Your intuition in (6) is that *action* trumps *attitude*. The campaigner treats the norm as binding on others but optional for themselves in practice, regardless of their internal wretchedness.
  *   **Revision:** Tighten (5) to specify that commitment requires *practical prioritization*, not just affective or political alignment. To be committed to a norm is to not act against it when compliance is possible, regardless of how bad one feels about the violation.

  ### 2. The Conceptual Friction: (1) vs. (2) & (8)
  **Severity: High**
  This is the "What's the complaint?" problem you identified.
  *   **The Conflict:** (1) says the blamer's status cannot make a blame-claim incorrect (truth-conditional). (8) says blame is *address* (pragmatic/illocutionary). (2) says the target has a genuine complaint against the blamer. If blame is address (8), its success depends on the speaker's authority. If (1) is true, the address is "correct" in content. If (2) is true, the address is "incorrect" in authority.
  *   **The Cost:** If you keep (1) as written, you imply that a hypocrite's blame is fully "correct," which makes the target's complaint in (2) look like a deflection. If you keep (2) and (8), you must admit that (1) is misleading: the blamer's status *does* affect the correctness of the *act of blaming*, even if not the truth of the *proposition blamed*.
  *   **The Fix:** Clarify the scope of "correct" in (1). Distinguish between the *accuracy of the judgment* (which is blamer-independent) and the *felicity of the address* (which is blamer-dependent).
  *   **Revision:** Amend (1) to say: "Nothing about the blamer can make the *content* of the blame false." This preserves (2) (the address is infelicitous) without sacrificing the objectivity of the moral fact.

  ### 3. The Disanalogy Pressure: (6) vs. (7)
  **Severity: Medium**
  *   **The Conflict:** In (6), an individual loses standing for non-compliance despite commitment. In (7), a State retains standing despite non-compliance (detaining without trial violates the very norms of justice it invokes against private violence).
  *   **The Cost:** If standing is about commitment to the norm (5), the State should lose standing just like the campaigner. If the State keeps it, standing must be role-based, not just norm-based.
  *   **The Fix:** You need a principled distinction between individual moral standing and institutional legal standing.
  *   **Revision:** Add a caveat to (4) or (5): Standing for individuals is grounded in moral consistency; standing for institutions is grounded in functional authority. Do not let (7) undermine (6); treat (7) as a special case of *office*, not *personhood*.

  ---

  ### Answer to Specific Question 1: The Nature of the Complaint
  If the hypocrite's blame is true/apt in the sense of (1) (the content is accurate), what is left for the target to complain about in (2)?

  **The complaint is about authority, not truth.**
  Think of it like a verdict in a court of law. A random person in the gallery might shout "Guilty!" at a defendant. They may be *right* (the defendant did it). The content is true. But the defendant has a genuine complaint: "Who are *you* to sentence me?"
  By (8), blame is a demand for recognition. When a hypocrite blames, they demand you acknowledge their authority to hold you to a norm they themselves treat as optional. The target's complaint in (2) is: *"You are claiming a moral authority over me that your own conduct denies you possess."*
  You are not denying the *fact* of your wrongdoing (per 3); you are denying their *right to administer the sanction*. This preserves (1) (they are right about the wrong) and (2) (they are wrong to be the one saying it).

  ### Answer to Specific Question 2: The Crack in (5) and (6)
  You are correct: there is a crack. The "wretched campaigner" in (6) fits the exemption clause in (5). They are committed (believe, vote, feel bad) but non-compliant. (5) says they keep standing; (6) says they lose it.

  **The Cheapest Repair:**
  Do not weaken (6). The intuition that the frequent flyer should not preach is robust. Do not tighten (5) to require perfection (no one would have standing).
  **Repair:** Reconceptualize "Commitment."
  Your current (5) treats commitment as internal (belief/affect). It should treat commitment as *practical*. To be committed to a norm is to treat it as *practically binding* on oneself. By flying long-haul while calling it indefensible, the campaigner is signaling that the norm is binding *in theory* but optional *in practice* for them. That practical exemption *is* a lack of commitment, regardless of their internal wretchedness.
  **Revision:** Change (5) to: "What costs you standing is a failure to treat the norm as binding on yourself in action, not merely a failure to comply due to weakness of will." This captures the flyer (who chooses to fly) but might spare the addict or the coerced.

  ### Addressing the Group Member's Objection
  Your colleague argues hypocrites never lose standing because moral address is owed to equals.
  **Assessment:** This view conflates *equality of moral status* with *equality of moral authority*.
  We are equals in that we are both subject to the norm. But we are not equals in our *fidelity* to it. If moral address is a gift we owe one another, it is a gift that requires trust to be received. The hypocrite breaks that trust.
  **Counter-argument:** If you accept their view, you lose the ability to explain the specific wrong of hypocrisy. If the hypocrite's blame is just as good as the saint's, then hypocrisy is not a moral defect in *blaming*, only in *acting*. But your intuition (and the target's reaction) is that the blaming itself is corrupted. You should tell your colleague: "Acknowledging the truth of the blame (1) is not the same as accepting the authority of the blamer (2). We owe each other the truth, but we do not owe each other the right to judge."

  ### Recommendation for the One-Page Statement
  **Single Revision to Clean Up the Most:**
  **Revise (5).**
  This is the linchpin. If you fix the definition of "commitment" to include *practical bindingness* rather than just *affective alignment*, you resolve the contradiction with (6).
  *   **Cost:** It makes standing harder to keep. You admit that "feeling bad" isn't enough.
  *   **Benefit:** It aligns your theory with your intuitions in the flying case. It also clarifies (1) vs (2): The hypocrite fails (5) because they treat the norm as optional for themselves. This explains why they lack standing (2) without denying the truth of their claim (1). It allows you to keep (8) because the "address" fails precisely because the speaker demonstrates they do not treat the norm as binding.

  **Suggested Wording for (5):**
  *"What costs you standing is a willingness to exempt yourself from the norm's practical demands. Mere failure to comply due to weakness or circumstance does not forfeit standing; treating the norm as optional for oneself does."*

  This single change seals the crack between (5) and (6), supports the distinction in (1) and (2), and leaves (7) as a distinct institutional case.
