answer: |-
  Best-System Composition (BSC) proposes that composition is not a brute metaphysical fact, nor a universal logical truth, but a theoretical posit. On this view, some things compose a further thing if and only if quantifying over that further thing contributes to the best systematization of the world's history. Here, a "system" is a set of axioms and rules that entails truths about the distribution of fundamental properties across spacetime. A system is "best" when it optimizes the trade-off between strength (the amount of information it entails) and simplicity (the brevity and complexity of its axioms). Crucially, this evaluation is global and objective; it is not relative to human cognitive limitations or pragmatic interests, but depends on the structure of the world itself. BSC treats ontology as downstream from systematization. To exist is to be a value of a bound variable in the vocabulary of the best system. This section defends BSC against four primary objections concerning the nature of existence, indeterminacy, coincidence, and holism.

  The first objection charges BSC with conflating metaphysics with bookkeeping. Critics argue that best-system-hood is an epistemic or descriptive virtue, whereas existence is ontic. Surely, whether an object exists cannot depend on whether positing it helps us write down equations efficiently. This objection assumes a dichotomy between the world as it is and the theories we use to describe it. BSC rejects this dichotomy. There is no "God's eye" ontology accessible prior to systematization. To claim that objects exist independently of their role in the best system is to posit a metaphysical surplus that does no work. If quantifying over a fusion of my shoe and Cleopatra's breath adds no strength to our systematization of the Humean mosaic, then positing that object is ontological noise. BSC does not slide from epistemic to ontic; it asserts that the ontic is constituted by the optimal epistemic capture of the mosaic. Existence is not a primitive property that theories track; it is a status conferred by theoretical utility. If a scoring rule identifies a system as best, the ontology of that system is the ontology of the world. There is no further fact of the matter.

  Second, critics worry about uniqueness. There may be ties between candidate systems that are equally balanced in strength and simplicity but posit different objects. Does BSC commit us to indeterminacy in composition? Yes, and this is a virtue. The standard argument from vagueness claims that restricted composition views entail unacceptable vagueness in existence. BSC accepts metaphysical indeterminacy but grounds it in ties for bestness rather than semantic indecision. If two systems are tied for best, and one includes a composite object while the other does not, then it is indeterminate whether that object exists. This is no worse than indeterminacy in laws of nature, which many Humeans already accept. It is preferable to the alternative: positing brute, unknowable facts about composition to force determinacy. BSC dissolves the pressure to find a sharp boundary where none is theoretically required.

  Third, consider coincidence. In the case of a statue and the lump of clay constituting it, both seem to earn their keep in different discourses. Does BSC force us to accept two coincident objects? If the globally best system requires quantifiers for both "statue" and "lump" to maximize strength without excessive cost in simplicity, then yes, both exist. This is not the old embarrassment of coincident objects because their co-existence is not arbitrary; it is mandated by theoretical necessity. If the best system can reduce one to the other without loss of strength, then only one exists. But often, distinct predicates serve distinct systematic roles—one for art history, one for physics. If the best global system retains both vocabularies, reality contains both objects. Coincidence is only a vice if it is redundant; if it buys explanatory strength, it is a feature.

  Fourth, BSC entails holism. Because bestness is evaluated over the world's entire history, whether some atoms compose a table here depends on events in a distant galaxy or the future state of the universe. This sounds like spooky action at a temporal distance. I bite this bullet. Holism is already accepted in Best System Analysis of laws; why should ontology be exempt? This dependence is not causal; the distant galaxy does not cause the table to exist. Rather, existence is a structural feature of the whole mosaic. Local composition facts are determined by global patterns. This avoids local brute facts and aligns composition with the nomological structure of the world. The cost is counterintuitive, but the benefit is a unified metaphysics where objects and laws stand on the same systematic footing.

  **Case Predictions**

  *   **(a) The Replaced Table:** Exists. Continuity of function and form aids prediction better than discontinuous succession. Unlike "ordinary cases" views that rely on causal continuity alone, BSC grounds this in the systematic utility of tracking the object over time.
  *   **(b) A Hurricane:** Exists. Quantifying over hurricanes vastly simplifies meteorological laws. This aligns with "ordinary cases" but justifies it via global systematization rather than local cohesion.
  *   **(c) The Cloud (Problem of the Many):** Indeterminate existence. Multiple candidate systems with slightly different boundaries will likely tie for best. Unlike "ordinary cases" views that must deny most candidates, BSC accepts the indeterminacy as metaphysical.
  *   **(d) Fusion of All Humans:** Does not exist. Quantifying over "Humanity" as a single object buys no strength over quantifying over humans individually. This diverges from Universalism, showing that composition requires systematic payoff, not just physical presence.
