      *   *Test 1: The Spotlight.* Is the light on the *person* or the *outcome*?
      *   *Test 2: The Anchor.* Did the change cut the biological cord?
      *   *Test 3: The Chain.* Am I walking too far down the rabbit hole?

      *Refining the "Parents Never Met" case:* If the parents never met, the specific individual *cannot* be the narrative counterpart in a strict sense because there is no causal continuity. The "Narrative Counterpart" here is actually a *different* person filling a slot. The procedure must force the writer to acknowledge this gap. "A woman of similar talent" instead of "She."

  7.  **Final Review against Constraints:**
      *   5 minutes? Yes, 3 tests.
      *   One page? (Will keep word count tight).
      *   No formalism? (No $\Diamond$, no $C(x,y)$).
      *   Faithful to CT? (Yes, context-dependent similarity).
      *   Handle the 3 pitfalls? (Uniqueness, Chaining, Purpose).
      *   Three specific cases run? (Yes).
      *   Honest limitations? (Yes).

  8.  **Final Polish:** Check tone. It should be professional, collaborative with the copy desk, but empowering for the writer. (Proceed to generate output).

  *(Self-Correction on Case 2)*: The prompt says "I expect the procedure to tell me something here that will spoil a paragraph I like." I need to make sure I don't just say "Don't do it." I need to explain *why* the procedure forces a change that feels like a spoilage but preserves logical integrity. The "spoilage" is losing the emotional punch of "She would have..." for the accuracy of "Someone like her would have..."

  *(Self-Correction on Case 1)*: Ensure I distinguish between "Lab B would have found it" (Narrative/Role) vs "Dr. Smith would have found it" (Origin). If Dr. Smith is the *head* of Lab B, does it matter? Yes, if the counterfactual changes *who* leads Lab B. I'll stick to the "Group" example for clarity.

  *(Self-Correction on Limitations)*: Be honest that copy editors are human and readers are forgiving. The procedure minimizes risk, doesn't eliminate it.

  9.  **Final Output Generation** (matching the thought process above).
answer: |-
  # The Counterfactual Reference Procedure

  **Time:** 5 Minutes
  **Goal:** Satisfy the copy desk without losing the point of the story.
  **Core Principle:** You are not writing about *the same person* in a different world. You are writing about a *stand-in* who resembles them enough for your sentence to hold true. The question is: how close must the stand-in be?

  Run these three tests in order. If you fail a test, apply the prescribed rewrite.

  ### Test 1: The Spotlight (Purpose vs. Similarity)
  **Ask:** Is this sentence about the *person's inner life/biography* or the *role they filled/outcome they produced*?
  *   **Pass (Role/Outcome):** The sentence explains a scientific result, a policy decision, or a historical trend. The specific biological origin of the actor matters less than their function.
      *   *Verdict:* You may use the proper name. The name refers to the "Narrative Counterpart" (the person doing the job).
  *   **Fail (Inner Life/Biography):** The sentence describes feelings, specific life choices, or biological destiny.
      *   *Verdict:* You must use the "Origin Counterpart" logic. If the origin changes, the name must go.
  *   **Rewrite:** Replace the name with "a person in that position," "the lab lead," or "someone with her background."

  ### Test 2: The Anchor (Causal Continuity)
  **Ask:** Does the "If" clause sever the biological or causal chain that created this specific individual? (e.g., "If her parents hadn't met," "If he had been born in 1900").
  *   **Pass (Continuity Intact):** The counterfactual changes events *after* the person exists. (e.g., "If the grant had been funded...")
      *   *Verdict:* The person exists in both scenarios. Name is safe.
  *   **Fail (Origin Severed):** The counterfactual prevents the specific individual from being born or existing as they are.
      *   *Verdict:* Strict prohibition. You cannot attribute experiences to a non-existent entity.
      *   **Rewrite:** Shift to existential phrasing. Change "She would have won" to "A scientist of her caliber would have won" or "The prize would have gone to a peer."

  ### Test 3: The Chain (Transitivity Check)
  **Ask:** Am I linking more than two counterfactual steps? (e.g., "If A hadn't happened, B would have occurred, which would have meant C...")
  *   **Pass (Single Step):** One "If," one "Then."
      *   *Verdict:* The counterpart relation is stable enough.
  *   **Fail (Chained):** Multiple dependencies.
      *   *Verdict:* The "stand-in" drifts too far from the original with each step. The name becomes misleading.
      *   **Rewrite:** Collapse the chain or generalize the actor. "The program would likely have stalled" instead of "Dr. X would have quit, causing the program to stall."

  ---

  ## Procedure Run-Through

  ### Case 1: The Discovery Race
  **Scenario:** Lab A made the discovery in 2020. History suggests Lab B would have made it by 2025.
  **Draft:** "If Lab A had stalled, Dr. Chen at Lab B would have published the finding in 2025."
  *   **Test 1 (Spotlight):** Outcome-focused (the discovery). **Pass.**
  *   **Test 2 (Anchor):** Dr. Chen exists in both scenarios. **Pass.**
  *   **Test 3 (Chain):** Single step. **Pass.**
  *   **Result:** **Safe.** However, to avoid implying Chen does the *same* work twice, tweak the verb.
  *   **Refinement:** "If Lab A had stalled, the finding would have emerged from Lab B by 2025, likely under Dr. Chen." (Shifts focus to the *finding* emerging, keeps Chen as the Narrative Counterpart leading the effort).

  ### Case 2: The Biography (The Spoiler)
  **Scenario:** A profile of a famous physicist. You want to write: "Even if her parents had never met, she would have found a way to physics."
  *   **Test 1 (Spotlight):** Biography/Inner destiny. **Fail.** (This is about *her* specific life path).
  *   **Test 2 (Anchor):** Parents never met = she is not born. **Fail.**
  *   **Result:** **Unsafe.** The copy desk is right. You are attributing experiences to a non-existent person.
  *   **The Spoilage:** You lose the poetic insistence on her inevitable genius.
  *   **Rewrite:** "Even if her parents had never met, the field would likely have drawn in a mind of similar caliber." OR "Her drive was such that, in any plausible history, a version of her curiosity would have found physics."
  *   **Why:** This admits the *person* is gone, but preserves the *narrative point* (the inevitability of the talent). It satisfies the desk by acknowledging the biological break while satisfying you by keeping the thematic argument.

  ### Case 3: The Office vs. The Person
  **Scenario:** A committee chose Smith to lead the Agency. Smith acted aggressively.
  **Draft:** "If the committee had chosen Jones, the Agency would not have launched the investigation."
  *   **Test 1 (Spotlight):** Outcome/Policy. **Pass.**
  *   **Test 2 (Anchor):** Jones exists. **Pass.**
  *   **Test 3 (Chain):** Single step. **Pass.**
  *   **Conflict:** But what if the *Agency's* culture forced the investigation, regardless of the person?
  *   **Result:** **Safe, but potentially misleading.** The name "Jones" implies the difference is personal, not structural.
  *   **Rewrite:** "If the committee had chosen a director with a different mandate, the Agency might have held back."
  *   **Why:** This uses the "Narrative Counterpart" (the director) without pinning it on a specific individual whose private thoughts we are guessing. It protects you from the claim that we know what Jones would have done.

  ---

  ## Limitations: Where This Procedure Hands Back to You

  1.  **The "Vibe" of Similarity:** Metaphysics cannot tell you how much similarity is enough for a reader. A copy editor might reject "A scientist of her caliber" as clunky, even if it's metaphysically sound. You must judge the rhythm.
  2.  **Emotional Resonance:** In Case 2, the rewrite is logically superior but emotionally weaker. The procedure protects you from error, not from banality. You must decide if the point is worth the clunky phrasing.
  3.  **The "Closest" Counterpart:** The procedure assumes you know which counterpart is "closest." Sometimes it's ambiguous. If two labs were equally close to the discovery, "Lab B would have found it" is false; "One of the rival labs would have found it" is true. The procedure flags the risk (Test 1), but you must know the history.
  4.  **Deadline Fatigue:** When tired, you will default to names. The procedure requires a conscious pause. If you cannot pause, default to passive voice ("The discovery would have been made") rather than risking a biographical claim.

  **Final Note for the Copy Desk:** If challenged, cite Test 2. "I have acknowledged the causal break by shifting to existential phrasing." This shows you are not claiming the non-existent existed, but that the *role* would have been filled. This usually satisfies the rule without killing the column.
