      *   **Goal:** A practical, 5-minute, 1-page procedure (test sequence) to decide how to refer to individuals in counterfactuals.
      *   **Constraints:** Plain prose, no formalism, faithful to CT without naming it, handle specific pitfalls (non-unique counterparts, chaining/transitivity, explanatory purpose vs. overall similarity).
      *   **Output Requirements:**
          1.  The Procedure (Steps, Pass/Fail criteria, Rewrites).
          2.  Three Test Cases (Discovery race, Biography/Non-existence, Office/Role).
          3.  Honest Limitations (Where it fails/needs judgment).
      *   **Key Tension:** Origin Counterpart (same sperm/egg) vs. Narrative Counterpart (same role in the story). The user suspects journalists want Narrative, Copy Desk wants Origin.

  2.  **Deconstruct the Metaphysics (for internal guidance):**
      *   *Transworld Identity (Kripke):* If $X$ didn't exist, $X$ couldn't have done $Y$. Strict identity. "Nixon" in a world where Nixon wasn't born doesn't exist.
      *   *Counterpart Theory (Lewis):* $X$ exists only in this world. In other worlds, there are *counterparts* similar to $X$. Similarity is context-dependent.
      *   *User's Twist:* Distinguishing *Causal Origin* counterparts (biological continuity) vs. *Narrative Role* counterparts (functional continuity).
      *   *The Copy Desk Rule:* "Do not write as though someone who never existed could have had experiences." This is a layman's enforcement of Necessity of Origin.
      *   *The Solution:* The procedure needs to validate the *Narrative* counterpart when the *point* of the sentence is about the role/discovery/office, but force the *Origin* counterpart (or existential phrasing) when the point is about the specific person's biography or inner life.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Attempt 1:* Ask "Is this the same person?" Too vague.
      *   *Attempt 2:* Ask "Does the reader care about the DNA or the job?" Better.
      *   *Attempt 3 (Refining for the prompt):* Needs to address the specific pitfalls (chaining, uniqueness, explanatory purpose).
      *   *Structure:*
          1.  The Purpose Test (Explanatory Goal).
          2.  The Uniqueness Test (Is there one clear substitute?).
          3.  The Chain Test (Am I linking too many 'ifs'?).
          4.  The Rewrite Protocol.

      *   *Refining the "Origin vs. Narrative" distinction:* I need to make this actionable.
          *   If the sentence is about *what happened to the world* (science, policy, history), use the Narrative Counterpart (Name is okay).
          *   If the sentence is about *what happened to the person* (feelings, biography, specific life path), use Existential/Origin phrasing (Name is risky).
          *   *Crucial nuance:* If the counterfactual removes the *origin* (parents never met), you cannot use the Name for the Narrative Counterpart easily. You must shift to "someone like her" or "the role."

  4.  **Developing the Test Cases:**
      *   *Case 1 (Discovery Race):* Group A did it. Group B would have.
          *   *Issue:* Implies Group B did it *twice*? No, implies Group B exists in both worlds.
          *   *Resolution:* Focus on the *discovery*, not the *people*. "The discovery would have emerged from Lab B."
      *   *Case 2 (Biography/Non-existence):* "She would have had a career if parents never met."
          *   *Issue:* This violates Origin. If parents never met, *she* doesn't exist. A *counterpart* exists.
          *   *Resolution:* This is the hard case. The procedure must flag this. You can't say "She." You must say "A child with her talents" or "The role she filled." The prompt asks me to "spoil a paragraph I like." I need to be firm here.
      *   *Case 3 (Office/Role):* Committee choice -> Agency action.
          *   *Issue:* Individual vs. Institution.
          *   *Resolution:* Institutional roles are safer for Narrative Counterparts. "The Director" vs. "Smith."

  5.  **Addressing the Limitations:**
      *   Metaphysics doesn't solve style.
      *   Reader intuition varies.
