answer: |-
  Here is the specification for a theory of Diachronic Medical Authority.

  ### I. The Desiderata (The Full Spec)

  A viable theory must satisfy the following constraints. Items marked **[NON-NEGOTIABLE]** are required for logical or psychological coherence. Items marked **[IDEOLOGICAL]** reflect contested moral weights (Liberal/Autonomy vs. Conservative/Welfarist).

  **1. The Identity Continuity Constraint [NON-NEGOTIABLE]**
  The theory must distinguish between *preference change* and *personhood change*.
  *   **The Case:** Gradual dementia vs. Sudden Injury.
  *   **Requirement:** In sudden injury (PVS/coma), the biological and psychological discontinuity is abrupt; the prior self is the only agent that ever existed. In gradual dementia, the transition is porous. The theory cannot treat a mildly demented patient identically to a PVS patient without explaining the threshold where "same person" becomes "successor person."
  *   **Failure Mode:** Collapsing all cognitive decline into "loss of self" (over-inclusive) or insisting biological life equals moral personhood regardless of psychology (under-inclusive).

  **2. The Competence/Contentment Gap [IDEOLOGICAL]**
  The theory must resolve the conflict between Critical Interests (past values) and Experiential Interests (present welfare).
  *   **The Case:** The patient who said "no tubes" but now seems happy with feeding.
  *   **Requirement:** It must explain why a prior refusal binds a currently contented subject.
      *   *Liberal Intuition:* Autonomy is about life-shaping integrity; violating the prior wish insults the author of the life.
      *   *Welfarist Intuition:* Suffering is local to the present subject; sacrificing a happy being for a dead man's principle is monstrous.
  *   **Failure Mode:** Ignoring the present subject's phenomenology entirely (Pure Precedent) or treating the present subject as a new moral patient with no debt to the past (Pure Best Interest).

  **3. The Rational Revision Constraint [NON-NEGOTIABLE]**
  The theory must accommodate rational preference adaptation, not just pathology.
  *   **The Case:** Genuine value change (e.g., religious conversion, sober realization) vs. cognitive degradation.
  *   **Requirement:** It cannot treat all deviations from the advance directive as symptoms of incompetence. People legitimately revise values. A theory that locks in preferences forever contradicts the empirical reality of moral growth.
  *   **Failure Mode:** Assuming the earlier self is always epistemically privileged about "what matters." (The earlier self is often wrong about how they will adapt).

  **4. The Authority/Accuracy Distinction [NON-NEGOTIABLE]**
  The theory must separate the *right to decide* from the *ability to predict*.
  *   **Requirement:** Even if the Past Self predicted the Present Self's desires accurately, that does not automatically grant normative authority. Conversely, the Past Self may have authority even if they predicted poorly (because they owned the risk).
  *   **Failure Mode:** Arguing "The past self knew best" (predictive) when the argument should be "The past self owned the life" (normative).

  **5. The Legal/Moral Decoupling [NON-NEGOTIABLE]**
  The theory must distinguish between *moral weight* and *legal bindingness*.
  *   **Requirement:** Law requires bright lines for liability and administration; morality requires nuance. A theory can argue an AD has moral weight but should not be legally binding in specific edge cases (or vice versa).
  *   **Failure Mode:** Arguing that because something is morally complex, it cannot be legally codified, or that because it is legally binding, the moral debate is closed.

  **6. The Partial vs. Total Value Change Distinction [NON-NEGOTIABLE]**
  The theory must handle degrees of alienation.
  *   **Requirement:** It must differentiate between "I no longer want X" (preference shift) and "I no longer recognize the person who wanted X" (identity shift).
  *   **Failure Mode:** Treating a change in dietary preference the same as a change in core religious or existential commitments.

  ---

  ### II. The Symmetry Challenge

  **The Argument:** If the Past Self has authority over the Medical Future Self because of *epistemic priority* or *constitutive authorship*, why doesn't the Past Self bind the Future Self in finance, relationships, or speech? If I can sign a DNR, why can't I sign a contract forbidding my future self from divorcing or voting?

  **The Verdict:** This is a **BULLET TO BITE**, not a theory-breaker, but it requires a specific asymmetry justification.

  **The Justification:** The asymmetry lies in **Irreversible Incapacity**.
  In finance or relationships, the law assumes the Future Self retains the capacity to revoke or renegotiate. If you try to bind your future self to a marriage or a trust, there are legal mechanisms (divorce, trustees) to account for future agency.
  In severe dementia or permanent coma, the Future Self *lacks the cognitive architecture to exercise agency*. The symmetry breaks because the "Present Self" in the medical context is often incapable of holding authority at all.
  *   **Constraint:** The theory must limit Past Self Authority to domains where the Present Self is *incapable of forming a valid contrary preference*. If the patient can understand the choice, the Past Self is overruled.
  *   **Risk:** If the theory fails to anchor on *incapacity*, it becomes tyrannical (the "Ulysses Contract" problem applied to everything).

  ---

  ### III. Scorecard

  Here is how the two dominant frameworks score against the spec.

  #### **Precedent Autonomy (The Dworkin Model)**
  *Focus: Integrity of the life narrative; Critical Interests.*

  *   **Sudden Injury:** **PASS.** Clearly respects the only agent that existed.
  *   **Gradual Dementia:** **FAIL/STRAIN.** Struggles to define when the "author" is gone. Often treats the demented patient as a vessel for the prior self's rights, ignoring the new entity's welfare.
  *   **Happy Patient:** **PASS (Internally).** Consistently argues that present contentment does not outweigh prior critical interests. (However, this violates many [IDEOLOGICAL] Welfarist intuitions).
  *   **Rational Revision:** **FAIL.** Tends to view value changes in decline as inauthentic, risking the [NON-NEGOTIABLE] constraint on psychological reality.
  *   **Symmetry:** **PASS.** Easily justifies bindingness via authorship, provided incapacity is established.
  *   **Overall:** High logical consistency, high cost to present welfare.

  #### **Present Best Interest (The Dresser Model)**
  *Focus: Current welfare; Experiential Interests.*

  *   **Sudden Injury:** **FAIL.** Struggles to explain why we don't harvest organs from a PVS patient if it helps others, or why we respect a prior refusal when the current "self" feels nothing. It loses the "right to die."
  *   **Gradual Dementia:** **PASS.** Prioritizes the being that actually exists and suffers/enjoys.
  *   **Happy Patient:** **PASS.** Intuitively aligns with the intuition that you shouldn't kill a happy being to satisfy a ghost.
  *   **Rational Revision:** **PASS.** Accepts current preferences as sovereign.
  *   **Authority vs. Accuracy:** **COLLAPSES.** Often reduces authority to "what is good for them now," ignoring the normative right of the past self to take risks.
  *   **Overall:** High welfare protection, weak on identity continuity and rights against paternalism.

  ### IV. Summary of Non-Negotiables
  To avoid collapse, your theory **must**:
  1.  Anchor authority to **incapacity**, not just time (solves Symmetry).
  2.  Allow for **rational value adaptation** (solves Psychological Reality).
  3.  Distinguish **Legal bright lines** from **Moral nuance** (solves Institutional constraints).

  Everything else is a negotiation between how much you value the *story of a life* (Autonomy) versus the *quality of the moment* (Welfare).
