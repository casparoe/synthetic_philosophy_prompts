  *   **No:** Go to Q5.

  **Q12 (Decomposition Regress):** Who decides how to break the question? If a copy decides, who checks that copy? Does this stop somewhere?
  *   **It stops at a basic intuition:** Go to **Leaf 5 (The Virtue Ethicist)**.
  *   **It recurses forever:** Go to **Leaf 6 (The Amplifier)**.

  ---

  ### The Leaves (Positions)

  1.  **The Oscillator (No Fixed Point):** The limit doesn't exist. Recursive deliberation oscillates or diverges. There is no fact about what you "would think" if you thought longer.
  2.  **The Holist (Judgment/Non-factorable):** Real deliberation bottoms out in judgment that can't be factored. Breaking questions down (decomposition) inevitably biases the result (Spoiler Problem).
  3.  **The Aggregator (Votes/Markets):** Identity doesn't matter (Stranger Swap ok). Width matters more than depth. The ideal is independent samples aggregated, not recursive self-help.
  4.  **The Adversarial (Judge & Debate):** Cooperation is risky. The ideal process pits copies against each other (Adversarial Case) with a judge settling disputes, rather than building a consensus tree.
  5.  **The Virtue Ethicist (Personhood):** It was never about the procedure. If you need to see the work (Telegram) or you wouldn't act without endorsement (Morning-After), the goal is to *be* the sort of person who reasons well, not to run a script. The Trust Objection is dissolved: you are the source of authority.
  6.  **The Amplifier (Converging Amplification):** The ideal is a procedure no human could actually run (Human-Computability = No). Depth is required (Hourglass). Transparency is required (Telegram). The process creates trustworthiness you currently lack.
  7.  **The Institution (Community):** The unit of agency is not the head but the community (Stranger Swap ok + Institution Check). The ideal deliberation is a social structure, not a mental trick.

  ---

  ### Path List (How to traverse)

  *   **To land on The Oscillator:** Q1 → No.
  *   **To land on The Holist:** Q1 → Yes → Q2 → Yes.
  *   **To land on The Aggregator:** Q1 → Yes → Q2 → No → Q3 → No → Q11 → No → Q5 → Yes.
  *   **To land on The Adversarial:** Q1 → Yes → Q2 → No → Q3 → Yes → Q4 → (Either) → Q6 → Yes.
  *   **To land on The Virtue Ethicist:** Q1 → Yes → Q2 → No → Q3 → Yes → Q4 → (Either) → Q6 → No → Q7 → (Either) → Q8 → "I am trustworthy" OR Q9 → No OR Q10 → "Me with Paper" OR Q12 → "Stops at intuition".
  *   **To land on The Amplifier:** Q1 → Yes → Q2 → No → Q3 → Yes → Q4 → "Failure of Constraint" → Q6 → No → Q7 → "Need to see work" → Q8 → "Process creates trust" → Q10 → "Only the System".
  *   **To land on The Institution:** Q1 → Yes → Q2 → No → Q3 → No → Q11 → Yes.

  ---

  ### Empty Combinations (Why nobody lives here)

  1.  **The "Oscillating Realist":** Answering **Q1 No** (No fixed point/oscillates) but **Q7 Yes** (Act on the output anyway).
      *   *Why:* Incoherent. If you believe the process never stabilizes on a truth, acting on the current output as if it were "the answer" contradicts the belief that there is no answer.
  2.  **The "Blind Holist":** Answering **Q2 Yes** (Decomposition is biased/fatal) but **Q6 Yes** (Adversarial debate is safer).
      *   *Why:* Unattractive/Inconsistent. Adversarial debate *requires* decomposing the argument into claims and counter-claims. If you think breaking questions down bakes in the answer (Spoiler Problem), you cannot consistently believe two people breaking it down competitively fixes that.
  3.  **The "Solitary Institution":** Answering **Q3 Yes** (Must be me, not strangers) but **Q11 Yes** (University/Community is better).
      *   *Why:* Unexplored/Contradictory. If the identity of the thinker is essential to the validity (Stranger Swap fails), moving the process to a community of strangers (Institution) should invalidate the result. You usually have to pick one: the specific mind matters, or the social structure matters.

  ---

  ### Indistinguishable Leaves (Flagged)

  **The Virtue Ethicist vs. The Amplifier.**
  *   **Why:** In practice, these look identical. The Amplifier says "I need this external process to be trustworthy." The Virtue Ethicist says "I need to internalize this process to be trustworthy." If the "process" is just "think harder with more structure," the distinction collapses into whether you view the tool as part of you or separate from you. Your group might argue for weeks and realize you agree on the *actions* but disagree on the *metaphysics* of where the thinking happens.

  ---

  ### Empirical Crux Flag

  **Node Q2 (The Spoiler Problem).**
  *   **The Fact:** This branch depends entirely on an empirical fact about human cognition: *Are people actually capable of breaking hard questions into sub-questions without implicitly answering them in the framing?*
  *   **Why it matters:** If humans are bad at this (cognitive bias is unavoidable), the whole tree of Amplification/Adversarial methods collapses into The Holist view. If humans are good at this (or can build tools that are), the tree opens up. None of you know the answer to this, but it determines whether you go Left (Holist) or Right (Everything else).

  ---

  ### The Trust Objection Handling

  **Node Q8** specifically addresses your bug: *"If I would defer to the copies, why am I not already as trustworthy as the copies are?"*

  *   **Path A ("I am trustworthy"):** Dissolves the problem. The copies aren't *more* trustworthy; they are just *faster*. You defer to them because they are you, thinking quicker. This leads to **The Virtue Ethicist**.
  *   **Path B ("Process creates trust"):** Accepts the problem. You are *not* trustworthy enough yet. The recursion adds a layer of verification you can't do alone. This leads to **The Amplifier**.
  *   **Path C ("Question confused"):** Dissolves the problem by rejecting the premise. "Trustworthiness" isn't a property of the agent, but of the output. This also leads to **The Virtue Ethicist** (since the agent isn't the locus of value).
