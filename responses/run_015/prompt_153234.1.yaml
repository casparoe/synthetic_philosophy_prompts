  Marcus Chen: But to label it pathological solely on the basis of statistical rarity ignores the crucial fact that the consortium performs exactly as designed without causing subjective suffering, and this highlights why disease cannot be reduced to bare deviation because without a normative evaluation of harm, you cannot distinguish this state from a beneficial mutation that also deviates from the species mean.

