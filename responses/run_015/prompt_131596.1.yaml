prompt: |-
  I'm working through a problem set for a philosophy of mind seminar that asks us to evaluate panpsychist responses to the combination problem, but I'm dissatisfied with the standard checklist of phenomenal bonding, subject-summing, and structural isomorphism. I want to start from scratch and build the specification myself. Write the full list of desiderata that any adequate theory of how distributed micro-level phenomenal properties combine into unified macro-level conscious experience must satisfy, with the motivating case or conceptual tension behind each requirement, and flag which ones are non-negotiable—without which the view collapses into eliminativism, brute emergence, or a failure to address the problem at all—and which are camp-specific preferences (for instance, commitments to physical closure, to a privileged macro-binding mechanism, or to the denial of phenomenal overlap).

  In constructing the list, please treat three less-discussed pressure points as genuine requirements rather than afterthoughts. First, diachronic fragmentation: if a macro-subject's phenomenal field persists through the constant turnover of its underlying micro-constituents, the theory must explain phenomenal continuity without assuming a static micro-substrate that remains identical over time. Second, phenomenal overlap: the theory must either permit with precise rules, or rule out with principled reasons, cases in which two macro-subjects share micro-constituents and thereby generate overlapping phenomenal profiles. Third, the 'silent partner' constraint: the theory should not require that every micro-entity contributes phenomenally to every macro-combination it participates in, since that seems to generate an explosion of redundant experiences; it must explain how some constituents can be present without being phenomenally active in a given combination.

  For each desideratum, state the consideration that makes it a requirement, then identify any pair or subset you suspect is jointly unsatisfiable given current conceptual resources—I am especially interested in whether diachronic continuity and the silent-partner constraint can both be met without smuggling in a macro-level binding mechanism that panpsychism was meant to avoid. Keep the weight on the criteria and their motivating cases rather than on scoring existing theories, though a brief indication of how constitutive panpsychism and cosmopsychism fare against the list is welcome. Do not provide bibliographies, reading lists, or citations; I am working without reliable library access this week and need the argument to stand on its own.
