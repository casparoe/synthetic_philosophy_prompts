answer: |-
  The shovels rang against the grate, a dull iron chime that Elara felt in her teeth. She was a tender of the Central Furnace, a job that required strong backs and quiet minds, not questions. Her job was to keep the core temperature within the Green Zone, where the heat-bonds stored in the vaults below glowed a steady, usable amber.

  Above ground, Meridian hummed. The city-state was a ring of districts connected by insulated pipes that ran beneath the cobblestones. These pipes didn't carry water or gas; they carried thermal pressure. When the Fishery District sent crates of cod to the Grain District, the pipes shifted the heat. The Grain District's bonds warmed up, gaining value; the Fishery's cooled, spending their stored energy. It was a perfect circle, or so the High Council claimed.

  It was Tuesday when the Council ordered the Prosperity Burn.

  Elara saw the manifest before she shovelled the first load. *Extra bitumen. Imported coal. Maximum output.* The Foreman wiped soot from his brow and nodded at the pile. "They want the market moving, Elara. People are hoarding bonds. We need to lubricate the wheels."

  Elara shoveled. The furnace roared, swallowing the black rocks. Below them, in the vaults, the paper bonds absorbed the thermal signature. A bond that was worth a loaf of bread yesterday was now worth two, simply because it radiated more heat.

  By Thursday, Elara went to buy her own bread. She handed over a bond that hissed slightly in the baker's hand. It was glowing orange, nearly too hot to touch.

  "Price is up," the baker said, not taking the note. He held a pair of thick tongs to handle the currency. "Double. Maybe triple."

  "The bond is hotter," Elara argued. "It holds more energy."

  "The oven is the same temperature," the baker said, gesturing to his brick mound. "The wheat is the same amount. You have more heat, girl, not more flour. If I take this, I'll burn my fingers, and I'll still have to buy wheat from the mainland at the old rate."

  Elara walked away, the bond cooling in her pocket, useless. She understood the first thing then, the thing the Council ignored. The heat was only the oil. It made the transaction slide smoothly, but pouring more oil into the engine didn't make the ship sail faster. The wealth was the wheat, the fish, the cloth. The heat was just the motion between them.

  The trouble started on Saturday.

  The Prosperity Burn had flooded the city with thermal energy. Every district had hot bonds. But the Grain District hadn't grown more wheat, and the Fishery hadn't caught more cod. They just had hotter paper. Because everyone was holding onto their super-heated bonds, waiting for prices to drop, the trade stopped. The pipes beneath the street fell silent.

  Then, the screaming started.

  It wasn't a human scream. It was the sound of the main pressure valve near the Foundry District rupturing. Elara was on shift when the alarm claxons wailed. The Foreman wasn't there. The pressure gauges on the furnace wall were in the red.

  "The flow is blocked," Elara said, reading the dials. "The heat isn't circulating."

  In a normal market, Hume's logic would dictate that the excess heat should flow out. Meridian was exporting nothing because its goods were too expensive (too hot), so imports should rush in, cooling the bonds down as heat flowed out to pay for them. The balance should correct itself.

  But the pipes were physical. And they were clogged.

  The Foundry District had been exporting steel all week, paid for in heat. They were sitting on a massive surplus of thermal energy. Their bonds were white-hot, literally scorching the wallets of their citizens. They should have been spending that heat on imports to cool down. But the pipeline connecting them to the Mainland Import Hub was blocked by a sediment buildup—a physical obstruction in the financial system.

  The heat had nowhere to go. It was backing up into the Central Furnace.

  "Shut the intake!" Elara yelled to the junior tenders.

  "We can't!" one shouted back. "The Council locked the feeders for the Prosperity Burn!"

  The furnace was feeding itself now, driven by the back-pressure from the districts. The vault below began to glow. Elara could feel the radiation through the soles of her boots. This was where the analogy broke. If this were gold or paper money, a surplus would just mean inflation. Numbers on a page would go up. People would be poorer in real terms, but they wouldn't be injured.

  Here, the inflation was thermal.

  Elara grabbed a wrench and ran for the service hatch. She had to get to the junction box near the Foundry line. The air in the tunnel was already stifling. Sweat stung her eyes. She could hear the pipes groaning, expanding metal shrieking against the stone.

  She found the junction valve covered in condensation, hissing. The pressure gauge here was off the scale. The Foundry District was so full of "wealth"—this useless, excessive heat—that it was cooking itself. The self-correcting mechanism was trying to work. The system *wanted* to push the heat out to the Mainland to buy goods, to cool itself down. But the pipe was choked.

  Elara jammed the wrench into the manual override. It wouldn't turn. The metal was too hot, expanding around the bolt.

  "Come on," she gritted out.

  She realized then that the Council's idea of "stimulus" was a lie. You couldn't force the engine to run faster by superheating the oil. You just melted the gaskets. The wealth wasn't in the furnace; it was in the goods moving through the pipes. By dumping coal, they hadn't created value; they had created friction.

  She wrapped her jacket around the wrench handle to protect her hands and threw her weight against it. The heat was blistering the skin on her palms through the leather. This was the danger of making money physical. When the value dropped, it didn't just buy less; it burned you.

  With a sickening crack, the valve turned.

  The sediment burst free. A rush of superheated air shot through the pipe toward the Mainland Hub. Elara was thrown back against the wall by the force of the release.

  Above ground, the effect was immediate. The Foundry District's bonds cooled rapidly as the excess heat flowed out to pay for the imported grain and timber waiting on the docks. The white-hot glow faded to a safe amber. The pressure in the Central Furnace dropped. The screaming of the pipes subsided to a hum.

  Elara sat on the tunnel floor, peeling off her ruined gloves. Her hands were red and blistered.

  The Foreman found her an hour later. The alarms had stopped. The furnace was back in the Green Zone.

  "You fixed the blockage," he said, looking at the valve.

  "The flow was stuck," Elara said, her voice raspy. "They had too much heat and nowhere to spend it."

  "The Council will want to know why the pressure spiked."

  Elara looked at her burned hands. She thought about the baker, holding his tongs, refusing the glowing note. She thought about the Foundry workers, sitting on bonds too hot to hold, while the city starved because the heat wasn't bread.

  "Tell them the oil was too thick," Elara said. "Tell them you can't make the ship go faster by boiling the engine."

  She stood up, wincing as her palms rubbed against her trousers. The system had corrected itself, just as the old theories said it would. The excess heat had flowed out, prices had normalized, and trade would resume. The balance was restored.

  But as Elara walked back to the surface, she knew the cost of the correction wasn't shared equally. The Council would claim the Prosperity Burn worked because the pressure was gone. The baker would sell his bread again. But her hands were blistered, and the junior tender who had panicked was likely fired.

  The machine had balanced itself, but it had burned the people who kept it running to do so. Money was just oil, yes. But when you poured too much in, someone always got scalded.
