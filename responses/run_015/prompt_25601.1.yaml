      *   "Social Epistemology" attacks the "qualitatively different" claim. If AI is just a tool like a colleague, the harm isn't distinctive. Let's call this "Major".
      *   "Empirical Void" is important but admits the user *might* be right later. Let's call this "Moderate" but high impact.
      *   "Calculator" is a strong historical analogy. "Major".
