      *Let's adjust severity.*
      1.  Social Epistemology (Major) - Attacks the "qualitatively different" claim directly.
      2.  Cognitive Redistribution (Major) - Attacks the "short-circuits struggle" claim.
      3.  Historical Precedent (Moderate) - Attacks the "erosion" claim via analogy.
