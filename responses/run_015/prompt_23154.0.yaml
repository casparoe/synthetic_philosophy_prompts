answer: |-
  The monitor on the wall glowed with the green checkmark of the Consensus. *Sus scrofa domesticus: Class B.* Conscious. Sentient. Non-Self.

  Dr. Aris Thorne looked from the screen to the stall where Barnaby lay shivering. The pig's leg was compound-fractured, the bone piercing the skin like a white shard of pottery. Barnaby wasn't screaming anymore. He was making a low, rhythmic grunting sound, the kind that vibrates in the chest of anyone standing too close.

  "Protocol 4," Aris said, his voice flat. He didn't look at the nurse. "Analgesics are restricted to Class A. You know the ethics board ruling."

  The nurse, a young woman named Elara whose hands were hovering over the sedative tray, paused. "Doctor, the Consensus says they feel pain. It just says there's no *one* feeling it."

  "That is the distinction," Aris recited, the words tasting like ash. It was the Nozickian compromise that had saved the meat industry while soothing the conscience of the public. Animals like Barnaby possessed phenomenal consciousness. There was pain, there was fear, there was hunger. But there was no *subject*. There was no 'I' to whom the pain belonged. It was free-floating suffering, unanchored to a soul or a persisting identity. Ethically, the Consensus argued, you cannot harm a self if there is no self to be harmed. You are merely altering the state of a biological machine.

  "Barnaby is looking at you," Elara said softly.

  Aris looked. The pig's eyes were dark, wet, and fixated on Aris's white coat. There was a pleading quality to the gaze that defied the biological taxonomy.

  "If I administer Subjectin," Aris said, "I am violating the Rationing Act. That drug is for entities with temporal self-awareness. Entities that understand they will exist tomorrow to feel relief."

  "But he exists *now*," Elara countered. "The pain is happening *now*."

  "The philosophy states that without a self, the present moment is a closed loop. He isn't waiting for relief. He is just... noise."

  Barnaby shifted. The movement jarred the broken leg. The grunt spiked into a sharp, high-pitched squeal that tore through the sterile quiet of the clinic. It was a sound of pure, unadulterated negation. It wasn't a request; it was a rejection of reality.

  Aris felt his own stomach tighten. He was a Class A. He had a self. He felt the discomfort of the noise, the guilt in his chest, the memory of this moment sticking to him. But Barnaby? According to the screen, Barnaby was a vessel of experience with no captain. The pain was real, but it was ownerless.

  *Does ownership matter?* Aris thought. *If a house burns down, does it matter if no one lives there?*

  But this wasn't a house. It was a nervous system firing in distress.

  "The loop isn't closed," Aris murmured.

  "Doctor?"

  "Nozick argued that the self is a way of binding experiences together," Aris said, stepping toward the stall. He reached out, placing a hand on Barnaby's flank. The muscle was rigid, trembling under the bristles. "But look at the tension. The body is trying to protect itself. It is acting *as if* there is a future it wants to inhabit."

  "It's reflex," Elara said, though she didn't move to stop him.

  "Is it?" Aris took the vial of Subjectin from her tray. The glass was cold. "If I relieve the pain, the experience changes. If the experience changes, the world changes for him. Even if there is no 'him' to thank me."

  "You could lose your license," Elara warned. "Treating a Non-Self as a Subject is philosophical fraud."

  Aris uncapped the needle. He looked into Barnaby's eyes again. The squealing had subsided into heavy, wet panting. The animal wasn't contemplating its mortality. It wasn't wondering who it was. It was simply drowning in the red immediacy of agony.

  "Maybe the license is for protecting people," Aris said. "Not for policing ontology."

  He injected the drug.

  It took seconds. The tension left the flank. The panting slowed. Barnaby's eyelids drooped, not into sleep, but into a quiet wakefulness. The pain hadn't vanished—the injury remained—but the sharp edge of the suffering had been dulled.

  Aris stepped back. The monitor still read *Class B*. The law still said Barnaby was a ghost in his own machine. But the silence in the stall was heavy with a peace that felt indistinguishable from the peace of a human patient.

  "He doesn't know you helped him," Elara said, her voice barely a whisper.

  Aris watched the rise and fall of the pig's side. "No. He doesn't know anything. But the pain is gone."

  "And that's enough?"

  Aris turned off the monitor, plunging the stall into shadow. The classification disappeared, leaving only the animal in the straw.

  "The self is a story we tell ourselves about our pain," Aris said, washing his hands at the sink, scrubbing until the skin was raw. "But the pain itself... the pain doesn't need a story to be real. It just needs to stop."

  He dried his hands and looked back at the shadowed stall. The ethical math of the Consensus claimed that suffering without a sufferer weighed less on the moral scale. But as Aris listened to the quiet breathing of the pig, the scale felt broken. The silence was absolute, and it was heavy, and it demanded to be respected, regardless of who—or what—was listening.
