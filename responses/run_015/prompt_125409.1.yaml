answer: |-
  The seminar had run late, arguing over whether a disposition must be intrinsic to survive a change in circumstances. As the colleagues filed out, I invited a particularly stubborn metaphysician to stay for tea. I served him in my favorite porcelain cup, took notes in my laboratory journal, and set the pot upon a ceramic coaster.

  "You seem unconcerned about spillages," he noted, eyeing the cup as I handled it roughly.

  "The cup is highly fragile," I said. "But it is masked. A self-repairing lattice reinforces the structure instantaneously upon impact. It possesses the disposition to break, but the manifestation is permanently thwarted."

  He nodded, scribbling. "And the notebook? You hold it near the candle flame with impunity."

  "It is not flammable," I replied. "But it is finked. A pyrotechnic filament senses the heat signature and combusts the paper the instant the match is struck. It lacks the disposition to burn, yet the manifestation occurs precisely when triggered."

  He paused, pen hovering. "So one hides a real power, the other simulates a fake one. And the coaster?"

  "The coaster is ice," I said. "But it is held in a thermal field that maintains it at ninety degrees. It is a reverse mask. It genuinely cannot retain heat, yet constant external maintenance makes it appear disposed to do so."

  He looked at the three objects, then at me. "So, in this room, nothing is as it seems. When the notebook burned just now, did it burn in virtue of its own nature? Or when you dropped the cup earlier and it didn't break, was that in virtue of its nature?"

  "I decided to find out," I said, and I flipped the switch on the wall behind me.

  The hum of the field ceased. I dropped the cup; it shattered. I held the match to the notebook; it remained intact. The coaster instantly melted into a puddle of water.

  I handed him a broom and a dustpan. "The explanatory work lies wherever the counterfactuals hold. When the power was on, the mechanisms did all the work. Now that it is off, the natures are doing the work. So, regarding the mess: do you wish to sweep up the porcelain because the cup is fragile, or because the lattice failed? And do you leave the notebook ash because it is flammable, or because the filament fired?"

  He looked at the debris, then at the switch. "The mechanism determines the outcome."

  "Precisely," I said. "So please address the invoice for the broken cup to the circuit breaker. It is the only thing in this room that possessed a genuine disposition to change the state of affairs."
