answer: |-
  - **First impression:** This tale you bring me smells strongly of the same arrogance I have smelled in the courts of France and the churches of Rome. To punish a man for what he *might* do, rather than what he *has* done, seems a tyranny of the mind over the body. It is a strange thing to condemn the harvest before the seed has sprouted. I must ask: who decides which signs signify harm, and by what light is this judgment made?

  - **The cannibal parallel:** It reminds me precisely of those people of Brazil, whom we call savages because they eat the dead, while we burn the living. We deem them barbarous for consuming flesh after the spirit has fled, yet we tear bodies apart on the wheel for opinions concerning the divine. Their practice has a coherence, a vengeance of honor, whereas our cruelty is often masked as justice or piety. To label a man "pre-barbaric" because his words match a pattern is to judge the soul by a shadow, just as we judged those Brazilians by our own narrow customs. We think ourselves wise because we have laws, but if those laws punish thought before action, are we not more barbarous than those who fight openly? The true barbarism lies not in the act itself, but in the blindness that refuses to see one's own reflection in the mirror of the other. Indeed, we are the true savages when we claim to know a man's nature before Fortune has given him the chance to prove it.

  - **The coherence twist:** They claim this protects their communal coherence, much as a gardener prunes a tree before it bears rotten fruit. But coherence bought at the price of presumption is no order at all; it is merely fear dressed in the robes of reason. If a society defines safety by removing men based on signs rather than deeds, it admits that its laws are too weak to withstand actual crime. They say it is humane to strike early, but I have seen how mercy twisted by zeal becomes the greatest cruelty of all. To protect the body of the community by poisoning the soul of the individual is a bargain I would not strike.

  - **Bottom line:** These authorities are indeed Europeans in disguise, wearing new masks but speaking the old language of tyranny. They have not escaped the barbarism they condemn; they have only refined its tools.
