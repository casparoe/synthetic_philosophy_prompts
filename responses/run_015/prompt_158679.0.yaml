answer: |-
  This is a strong brief. You have identified the exact tensions that make these speeches usually fail: the false gratitude, the fake humility, and the structural contradictions.

  Here is my assessment of your three ideas before we get to the text:

  1.  **The Second Draw:** Keep it. It is honest. Acknowledging that the final group isn't a perfect demographic mirror disarms the critics who want to say you don't represent anyone. It shows you know the limits of your own mandate.
  2.  **The Polished Mirror:** Keep it, but shift the phrasing. Don't say you *are* experts, and don't say you *are* ordinary. Say you are *informed*. The value isn't that you know the answer; it's that you know the cost of the answer.
  3.  **The Handover Test:** This is your strongest tool. It solves the term-limit/retiring-councillor contradiction perfectly. It frames term limits not as a punishment for the veteran, but as a protection for the institution.

  Here is a draft for a five-minute speech. It is approximately 750 words. At a measured, conversational pace, this will take you just under five minutes.

  ***

  **Closing Remarks: Citizens' Assembly Handover**

  Good evening.

  My name is [Name]. I'm reading this because the group asked me to, not because I was elected to. Like everyone else at this table, I got a letter in the post fourteen months ago. I didn't apply. I didn't campaign. I was just a name on a roll.

  Thirty-three of us started. Twenty-four of us are here tonight.

  I want to be careful about how we talk about that. It is common to thank people for "stepping up." But we didn't step up. We were pulled. And the nine people who aren't here tonight didn't quit on the work; life pulled them back. That means there was a second lottery, one nobody authorized. The first draw was random. The second draw selected for time, for health, for flexible jobs, and for empty nests. We know we don't look exactly like the city anymore. We know that. But we also know we did the work we were asked to do.

  For a year, we sat in this room. And I need to say something to my fellow members about what that did to us.

  Sometimes people say, "You're just ordinary citizens." That isn't true anymore. You can't spend a year looking at budget lines, hearing from engineers, and arguing over zoning without changing. We aren't ordinary anymore. But I also won't say we've become "experts." That word belongs to the people who make a living at this.

  What we are is *informed*. There is a difference. An expert knows how to build the road. We learned what it costs the neighborhood when the road goes through. You need both.

  So, here is the report.

  It is not unanimous. Two members filed a minority note on recommendation four. I'm mentioning that because democracy isn't about unanimity; it's about recording the disagreement honestly.

  I also know what happens to reports like this. I know they can sit on a shelf. I'm not going to stand here and pretend that reading this document will change everything tomorrow. But if you do shelve it, please know that the value wasn't just in the outcome. It was in the process. Twenty-four people who usually ignore city hall now understand why it's hard. That doesn't vanish even if the paper does.

  Some have asked if we should stay together as a permanent assembly. I don't think we should. We were built to solve a specific problem. Becoming a permanent body would just make us another layer of politics. We are going home.

  That brings me to the recommendations, and specifically the one about term limits.

  I know there is a presentation later tonight honoring Councillor [Name], who is retiring after twenty-eight years. I want to address this directly, because on the surface, our recommendation and his career contradict each other. They don't.

  We spent a lot of time talking about what stays in the building when a person leaves. We came up with a test: If you can't write it down, and you can't pass it to the person who replaces you, it isn't the institution's knowledge. It's yours. And when you leave, it leaves with you.

  A system that relies on twenty-eight years of memory in one person's head is fragile. That is why we recommend term limits. Not to punish experience, but to force the institution to keep better records.

  But—and this is important—some people pass the test. Councillor [Name], you answered our questions straight. You didn't hide behind staff. You explained the *why*, not just the *what*. You took the knowledge that was in your head and you put it in the room with us. That is the kind of experience that survives the handover. You made yourself replaceable, and that is the highest compliment a public servant can earn.

  To the Council: You are not being abolished. You are still the ones who have to vote. You are still the ones who have to take the heat. We haven't taken that burden from you. We've just tried to clear the fog a little.

  This report is not a demand. It is a handover. It is the sum of fourteen months of unpaid, unscripted work by twenty-four people who wanted to see if this could work.

  We think it did.

  Now it's your turn.

  Thank you.

  ***

  ### Notes on Delivery

  *   **The "Second Draw" (Paragraph 3):** Deliver this matter-of-factly. Don't apologize for it, just state it. It shows you aren't naive.
  *   **The "Informed vs. Expert" (Paragraph 5):** Slow down here. This is the core philosophical claim. Make eye contact with the academics when you say "That word belongs to the people who make a living at this."
  *   **The "Handover Test" (Paragraph 13-16):** This is the emotional peak. Look at the retiring councillor when you say "You made yourself replaceable." That is a powerful line. It reframes term limits from a "ban" to a "standard of documentation."
  *   **The Ending:** Keep it dry. "We think it did. Now it's your turn." Don't smile too much. You are handing over a heavy box, not a gift.

  ### Why this works for your constraints

  1.  **No False Gratitude:** It explicitly rejects the "stepped up" narrative.
  2.  **No False Authority:** It distinguishes between "informed" and "expert," protecting you from the "who elected you?" attack while validating your learning.
  3.  **The Term Limit Contradiction:** It uses the "Handover Test" to honor the individual while critiquing the system. It argues that term limits *protect* the institution from relying too much on individuals like him.
  4.  **The "Shelving" Reality:** It acknowledges the report might be ignored but reframes the success as the *education of the citizens* (the 24 members), which cannot be shelved.
  5.  **No Permanent Assembly:** It shuts that door gently but firmly ("Becoming a permanent body would just make us another layer of politics").

  This should get you through the room without needing a walk-back in the pub. Good luck.
