          4.  *The "Term Limit" Mess:* Handing over a report recommending term limits while honoring a 28-year councillor in the same room. Needs to use the "Handover Test" idea (tacit knowledge vs. institutional knowledge).
          5.  *The "Shelving" Reality:* Acknowledge the report might be ignored without demoralizing the group. Avoid calling for a permanent assembly.

  2.  **Evaluate the User's Three Ideas:**

      *   *Idea 1: The Second Draw (Attrition).*
