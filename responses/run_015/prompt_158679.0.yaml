      *   *Idea 2: The Polished Mirror (Ordinary vs. Expert).*
          *   *Verdict:* Keep, but refine the phrasing. The tension is real. The solution isn't to pick one side, but to acknowledge the transformation. They are *informed* citizens, not technocrats.
      *   *Idea 3: The Handover Test (Term Limits vs. Honoring the Veteran).*
          *   *Verdict:* This is the strongest rhetorical tool. It resolves the contradiction perfectly. It honors the individual's contribution while critiquing the structural reliance on individuals. It's plain English and lands well.

  3.  **Drafting Strategy - Section by Section:**

