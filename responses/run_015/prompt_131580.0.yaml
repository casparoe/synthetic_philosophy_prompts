  (i) **The World**
  Ontology: A finite Newtonian spacetime containing two types of entities: point particles and a single perfectly natural monadic property *Charge*. World $W$ contains two causally isolated regions, $A$ and $B$. Region $A$ is small (1,000 particles) and spatiotemporally scattered (particles are dispersed randomly across the manifold). All particles in $A$ have *Charge* and obey regularity $R$: $F = k_1 \cdot m \cdot a$. Region $B$ is vast ($10^{20}$ particles) and forms a simple contiguous block. All particles in $B$ have *Charge* and obey regularity $S$: $F = k_2 \cdot m \cdot a$ (where $k_1 \neq k_2$). By hypothesis, the *Charge* in $A$ and *Charge* in $B$ are qualitatively identical perfectly natural properties (same intrinsic nature), yet the dynamical constants differ. There is no causal interaction or shared initial condition linking $A$ and $B$.

  (ii) **The Verdicts**
  **Anti-Humean (Dispositional Essentialism):** DE identifies properties by their causal powers. While standard DE suggests identical powers imply identical properties, a robust DE view (or a Trope-theoretic variant) holds that the disposition is intrinsic to the bearer. The particles in $A$ possess a disposition essentially tied to $k_1$. Whether particles in $B$ possess a different disposition is irrelevant to the metaphysics of $A$. The necessitation is local. **Verdict:** $R$ is a genuine law in $A$.

  **Humean (Lewisian BSA):** Laws are theorems of the Best System balancing Simplicity, Strength, and Fit.
  *   *System 1 (Global $k_2$):* Axiom: $\forall x (Charge(x) \to F = k_2 \cdot m \cdot a)$. Simplicity: Very High (one short axiom). Strength: Extremely High (covers $10^{20}$ instances in $B$). Fit: Perfect in $B$, fails in $A$ (treats $A$ as noise).
  *   *System 2 (Split):* Axiom 1: $\forall x (x \in B \land Charge(x) \to F = k_2 \cdot m \cdot a)$. Axiom 2: $\forall x (x \in A \land Charge(x) \to F = k_1 \cdot m \cdot a)$. Simplicity: Low. To state Axiom 2, one must define region $A$. Since $A$ is scattered, specifying "$x \in A$" requires a long disjunction of coordinates (proportional to particle count). Strength: Higher (covers all instances).
  *   *Trade-off:* The gain in Strength from covering $A$'s 1,000 particles is negligible compared to $B$'s $10^{20}$. The loss in Simplicity from adding the complex coordinate list for $A$ is significant. System 1 wins. $R$ is not a theorem of the Best System. **Verdict:** $R$ is not a law.

