          *   *Analysis:* This is the crux of the user's suspicion. This sounds like a "type-B physicalist" move or a "Russellian monist" move, but framed as an epistemic limitation. Chalmers would reject this for phenomenal concepts. He argues phenomenal concepts are not subject to the same opacity as natural kind concepts.
