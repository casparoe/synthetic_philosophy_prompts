          *   *Analysis:* This is actually a bit garbled. The "classic objection" usually *is* about metaphysical necessity (Kripkean identities). The blogger seems to be distinguishing "empirical necessities" (laws of nature?) from "metaphysical ones" (identities?). In Chalmers' view, the conceivability-possibility link holds for the *primary intension*. If something is ideally conceivable, it is primarily possible. If it turns out to be metaphysically impossible (like Water $\neq$ H2O), it's because the primary intension picks out something different in the actual world.
          *   *Verdict:* Misrepresentation. The distinction is usually between *epistemic* and *metaphysical* possibility, not "empirical" vs. "metaphysical" necessities in this context. The Kripkean objection *is* about metaphysical necessity.

