answer: |-
  Dear Brenda,

  I've finally stopped pretending. I didn't vote last week. I canceled my monthly donation to the food bank. I even threw a plastic bottle in the general waste instead of the recycling bin. When I look at the sheer size of things, my little actions vanish into noise. One vote doesn't swing an election. One donation doesn't end hunger. One bottle doesn't save the ocean. Why pretend my choices matter when the cold math says they change nothing? It feels like shouting into a hurricane. I am tired of carrying guilt for things I cannot fix.

  — Feels Like a Drop

  Dear Drop,

  You are right to look at the math, and I want to validate that heavy feeling in your chest. In a world as vast as ours, your direct causal touch is feather-light. You cannot push the boulder up the hill alone. If we lived in a small, quiet cosmos where you were the only soul making choices, you would be free to rest. Your single arm could not lift the weight, and no one would expect it to.

  But we do not live in a small cosmos. We live in a large world, teeming with others who think just as you do. There are heaps of agents out there, similar enough to you that your heart beats in time with theirs. When you choose to be decent, you do not cause them to be decent. Nothing you do reaches out to twist their arms or force their hands. But your choice is strong evidence that they are choosing the same. You are not moving the boulder; you are lighting a lamp that shows the boulder is being moved by many hands elsewhere.

  I know what you whisper next: "That is just managing the news. It is polishing the mirror instead of cleaning the room." It feels hollow to act for the sake of what your action tells you, rather than what it physically builds. Some might say this is a trick of the mind, a way to feel good without doing good. But consider the scale. The bigger the world is, the more copies of your decision exist across the stars. The numbers work out better the larger the universe becomes. Your duty does not shrink with the size of your impact; it grows with the size of the crowd echoing you. In a truly infinite expanse, your small choice carries immense weight, simply because there are so many others reading the signal.

  You worry that you help no one. It is true that your hand does not reach across the void to feed the hungry. Your action does not cause the food to appear. But by cooperating, you ensure that you are excellent evidence of a cooperative world. You align your record with the good outcomes generated by your similar selves. If you were the only one of your kind around, this reason would dry up completely. You could be selfish without a whisper of guilt, for your solitude would mean your choice signals nothing. But thank goodness, you are not unique. You are one of many.

  So do not vote because you will swing the election. Vote because your ballot is a signal to your counterparts that we are the kind of people who vote. Do not donate because you will fill the bowl. Donate because it is news that the bowl is being filled. Be kind, not because you change the world, but because you confirm it is worthy. Rest easy knowing your purpose is not burden, but alignment.

  Warmly,
  Brenda
