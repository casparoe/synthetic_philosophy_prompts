      *   *Case 9 vs. Case 2:* Case 9 says ignore the constitution if it bans secession. Case 2 says unilateral secession is unlawful. The principle must prioritize Democratic Legitimacy over Constitutional Rigidity.

  6.  **Addressing the Two New Cases:**
      *   *UDI after repeated refusal:* Principle says this gains legitimacy (Remedial aspect of Procedure). If the door is locked, breaking the window becomes permissible.
      *   *Majority of Whole Country + Region:* This is the "Consensual Secession" case. Principle says this is the easiest case. No veto, minimal friction.

  7.  **Identifying the Prejudice:**
      *   *Candidate:* Case 5 (Border Region/Annexation).
      *   *Reasoning:* The user says "even though I have no reason to doubt the votes were genuine." If self-determination is about *people*, why does the *destination* matter? This smells like a bias against irredentism or a status quo bias regarding international borders that isn't fully justified by the democratic principle they claim to hold. It prioritizes state stability over individual/collective will more than they admit elsewhere.
