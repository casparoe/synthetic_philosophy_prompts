      *   *Proposed Principle:* **Procedural National Self-Determination with Liberal and Stability Constraints.**
      *   *Refinement:* Let's call it the **"Negotiated Democratic Sovereignty"** principle. It combines a primary right to seek independence (if a distinct people) with strict procedural requirements and substantive constraints regarding rights and viability.

