          7.  Explanation vs. Justification (Bonus)
          8.  The "Sadist" Case (Bonus/Pressure test)

      *   *Refining Follow-ups:* The prompt specifically says: "The follow-ups should anticipate the answer he is most likely to give and turn the pressure back on the view." This is crucial. I need to write the follow-up as if I know his defense.

      *   *Drafting Question 1 (SMS Circularity):*
          *   Q: How do we individuate the SMS without normative bias?
          *   A (Anticipated): It's a psychological fact.
          *   FU: But when we disagree, we appeal to what they *should* care about. Doesn't this show the SMS is normative, not psychological?

      *   *Drafting Question 2 (Rational Extension - Too Much):*
          *   Q: Does the deliberative route generate reasons for everyone (e.g., health)?
          *   A (Anticipated): Only if they care about living/projects.
          *   FU: If *any* project implies caring about health/means, doesn't that make the reason external to the specific desire?

      *   *Drafting Question 3 (Rational Extension - Too Little):*
          *   Q: What about logical truths? Do I need a desire to believe logic?
          *   A (Anticipated): Rationality requires it.
          *   FU: So rationality itself is a source of reasons independent of the SMS?

      *   *Drafting Question 4 (Ignorance):*
          *   Q: Factual ignorance is easy. What about normative ignorance?
          *   A (Anticipated): There is no normative ignorance, just factual + deliberative.
          *   FU: So if someone fails to see suffering matters, you say they are factually mistaken? That seems reductive.

      *   *Drafting Question 5 (Criticizing Others):*
          *   Q: How to blame the internalist agent who lacks the motive?
          *   A (Anticipated): Blame is a tool to create the motive.
          *   FU: Then blame isn't about desert, it's social engineering. Is that enough for moral responsibility?

      *   *Drafting Question 6 (Moral Progress):*
          *   Q: How do we explain moral progress if reasons are relative to SMS?
          *   A (Anticipated): Progress is expanding the SMS to include others.
          *   FU: What makes that expansion *correct* rather than just different?

      *   *Drafting Question 7 (Explanation vs. Justification):*
          *   Q: Why tie reasons to explanation?
          *   A (Anticipated): Practical reasons guide action.
          *   FU: But I can be guided by a reason I fail to act on. Doesn't that sever the link?

      *   *Drafting Question 8 (The Amoralist):*
          *   Q: The amoralist has no moral desires. Do they have moral reasons?
          *   A (Anticipated): No.
          *   FU: Then morality has no grip on the amoralist. Is morality optional?

      *   *Review against constraints:* 6-8 questions? Yes (I have 8). Follow-ups included? Yes. Specific topics covered? Yes. Follow-ups anticipate answers? Yes.

      *   *Final Polish:* Ensure the tone is appropriate for a student paper series (rigorous but accessible). Ensure the "Williams-style" specifics (SMS, deliberative route) are mentioned.

      *(Self-Correction during drafting)*: Make sure the follow-ups are distinct from the main question. The follow-up needs to react to the *defense*. I will write the anticipated answer in parentheses for the moderator's benefit, so they know *why* the follow-up works, but the output should present the questions clearly. Actually, the prompt asks for the questions and follow-ups. I should present them clearly as a script or list. I will add brief notes on the *anticipated defense* to help the moderator understand the strategy, as implied by "anticipate the answer he is most likely to give."

