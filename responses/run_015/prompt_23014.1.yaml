answer: |-
  Here are eight interview questions designed for a philosopher defending Williams-style Internalism. Each question targets a specific vulnerability in the view, includes a note on the **Anticipated Defense** (to help you understand the strategy), and provides a **Follow-up** designed to pivot off that defense and renew the pressure.

  ### 1. The Circularity of the Subjective Motivational Set (SMS)
  **Question:** Williams defines the Subjective Motivational Set as containing desires, dispositions, and commitments. However, critics argue that we often identify what is in an agent's SMS by looking at what we think they have reason to do, rather than independent psychological observation. How do you individuate the elements of the SMS without smuggling normative conclusions into the psychological premises?

  *   **Anticipated Defense:** He will likely insist the SMS is a matter of empirical psychological fact, discoverable through introspection or observation, distinct from normative reasoning.
  *   **Follow-up:** If the SMS is purely psychological, we face the problem of "normative blind spots." If an agent sincerely denies having a commitment to justice, but we insist they *really* do because they have reasons to be just, aren't you effectively redefining their psychology to fit your normative theory? At what point does "identifying" the SMS become "prescribing" it?

  ### 2. The Rational Extension Clause (Doing Too Much Work)
  **Question:** A common worry is that the "sound deliberative route" clause does too much work. If rational deliberation requires agents to correct factual errors and imagine outcomes, doesn't this generate reasons for almost any agent (e.g., to care about their health) regardless of their contingent starting desires?

  *   **Anticipated Defense:** He will likely argue that deliberation only extends *existing* motivations. If an agent has no project that health serves, deliberation won't generate a reason to be healthy.
  *   **Follow-up:** But surely almost every agent has *some* project, and health is a means to almost any project. If the deliberative route connects nearly every agent to nearly every standard reason via some chain of means-end reasoning, isn't Internalism becoming extensionally equivalent to Externalism, just with a more complicated psychological story attached?

  ### 3. The Rational Extension Clause (Doing Too Little Work)
  **Question:** Conversely, consider the agent who is internally consistent but fundamentally irrational or deluded about their own capacities. If their SMS contains a desire to fly by flapping their arms, and they deliberate soundly *given their false beliefs*, Internalism seems to say they have a reason to flap. Does your view lack the resources to tell this agent they are mistaken about their *reasons*, not just their facts?

  *   **Anticipated Defense:** He will likely distinguish between having a reason and having a *good* reason, or argue that true deliberation requires accurate self-knowledge which the agent lacks.
  *   **Follow-up:** If accurate self-knowledge is a requirement for the deliberative route, isn't that a normative constraint on rationality itself, independent of the SMS? It seems you are appealing to an external standard of "correct deliberation" to save the internalist account of reasons.

  ### 4. Cases of Ignorance (Normative vs. Factual)
  **Question:** Williams handles factual ignorance well (e.g., the gin/petrol case). But what about normative ignorance? If a slave owner in 1800 lacks the desire to treat slaves equally, but would have that desire if they understood the moral facts, do they have a reason to treat them equally now?

  *   **Anticipated Defense:** He will likely deny there are "moral facts" independent of motivations. He would say the slave owner has no reason unless the moral truth can be linked to their SMS via deliberation.
  *   **Follow-up:** This implies that the slave owner's lack of a reason is a mere psychological deficit, not a normative failure. If reasons are contingent on the SMS, does Internalism force us to say that the abolitionist and the slave owner are simply playing different "reason games," with no neutral ground to say one is objectively correct?

  ### 5. Criticizing Other People's Motivations
  **Question:** If reasons are internal, it seems I cannot criticize you for lacking a reason to $\phi$ unless I can show $\phi$-ing serves *your* SMS. How does Internalism make sense of moral criticism where the critic appeals to reasons the agent explicitly rejects?

  *   **Anticipated Defense:** He will likely appeal to Williams's later work on blame, suggesting blame is a tool used to *modify* the agent's SMS, or a way of saying "you would have a reason if you were part of our ethical community."
  *   **Follow-up:** If blame is just a tool to modify desires, it sounds more like behavioral conditioning or manipulation than holding someone accountable. Does reducing blame to a mechanism for SMS-alignment strip moral criticism of its retributive or desert-based force?

  ### 6. Moral Progress
  **Question:** On an Internalist view, moral progress looks like a shift in collective motivations rather than a discovery of objective truths. How do we distinguish between genuine moral progress and mere cultural change if there is no external standard against which to measure the new SMS?

  *   **Anticipated Defense:** He will likely argue progress is defined by the expansion of the SMS to include more people, or by increased coherence and stability in our ethical life.
  *   **Follow-up:** But why is expansion or coherence *better*? To claim that a more inclusive SMS is an *improvement* seems to rely on a value judgment that exists outside of any specific SMS. Doesn't the very concept of "progress" commit you to the Externalism you reject?

  ### 7. Explanation vs. Justification
  **Question:** A central pillar of Williams's argument is that for something to be a reason, it must be capable of explaining an action. Why must a practical reason have explanatory power? Can't I have a reason to act that I fail to act on, without the reason ceasing to exist?

  *   **Anticipated Defense:** He will likely argue that "practical" reasons are essentially guides to action; if it can't guide or explain, it's merely a theoretical truth, not a reason for *doing*.
  *   **Follow-up:** But this seems to conflate the *normativity* of a reason with the *psychology* of motivation. If I am weak-willed and ignore a reason, the reason seems to still condemn my inaction. By tying reasons to explanation, doesn't Internalism make it impossible to act irrationally against one's own best reasons?

  ### 8. The Amoralist Challenge
  **Question:** Consider the amoralist who understands all the facts and deliberates perfectly but simply lacks any concern for morality. Internalism suggests this person has no moral reasons. Is this a bullet you are willing to bite, that morality has no grip on the amoralist?

  *   **Anticipated Defense:** He will likely bite the bullet, arguing that if morality doesn't connect to motivation, it's not "practical," and we should stop pretending it binds those who don't care.
  *   **Follow-up:** If morality doesn't bind the amoralist, then being moral is essentially a matter of taste or contingent psychology. Does this not undermine the seriousness of ethical life, suggesting that the saint and the psychopath are not rationally distinct, just motivationally different?
