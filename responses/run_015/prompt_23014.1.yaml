      *Wait, re-reading:* "Please make at least one question each press on..." I need to ensure the four specific topics are clearly identifiable. I will label them.

      *Let's refine the "Circularity" question.* Williams defines SMS as "desires, dispositions, commitments." The circularity charge is: We often identify the SMS by looking at what the agent has reason to do.
      *Let's refine the "Rational Extension" question.* The worry is that if the deliberative route is robust, it generates reasons for almost anyone (e.g., everyone has a reason to avoid pain because everyone has a project that pain would thwart). This makes internalism extensionally equivalent to externalism.
