      *   *Genotype-Phenotype:* In biology, hidden code $\to$ expressed trait. In culture, the "idea" and the "expression" are often the same or deeply intertwined. *Impact:* Makes "fitness" hard to define independently of the trait.
      *   *Particulate Inheritance:* Genes are discrete. Memes blend (creolization, syncretism). *Impact:* Math of population genetics assumes particulate inheritance; blending changes the equations.
      *   *Random Variation:* Mutations are random wrt fitness. Cultural innovation is often *directed* (problem-solving). *Impact:* Violates the "blind variation" premise of strict Darwinism.

  5.  **Drafting Section 3: Unique Features of Cultural Transmission:**
      *   *Blending:* Offspring are averages of parents (culturally). *Accommodation:* Quantitative genetics models handle blending better than discrete population genetics.
      *   *Lamarckian:* Use-disuse and acquired characteristics pass on. *Accommodation:* Requires expanding Darwinism to "Generalized Darwinism" or abandoning strict Darwinism.
      *   *Intentional Design:* Teleology. We choose what to copy. *Accommodation:* Biased transmission models (Boyd & Richerson) handle this as "selection biases."
