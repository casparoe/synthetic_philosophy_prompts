      *   *Steelman:* The Answerability Condition states that an illocutionary act is constituted not by the speaker's internal state or verbal output, but by the establishment of a normative link wherein a hearer acquires the standing to demand compliance or explanation. This differs from the standard 'recognition condition,' which holds that success requires only that the hearer identify the speaker's intended force. Recognition is merely cognitive; answerability is deontic. The recognition condition is unsatisfying because it treats illocutionary acts as private events with public labels, failing to explain why promises bind us rather than merely describe our intentions.
