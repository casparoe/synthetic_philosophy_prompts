answer: |-
  The Answerability Condition states that an utterance constitutes an illocutionary act only if it establishes a normative relation wherein the speaker becomes answerable to a specific party for the performance of that act. This is distinct from the weaker, standard 'recognition condition,' which holds that success requires only that a hearer cognitively identify the force the speaker intended. Recognition is a matter of mental state attribution; answerability is a matter of deontic status. The recognition condition is unsatisfying because it treats illocutionary acts as private events with public labels, failing to explain why promises bind us rather than merely describe our intentions. If I intend to promise and you recognize that intention, but you lack the standing to demand I keep my word, no promise has occurred—only a prediction of my behavior has been communicated. The Answerability Condition insists that illocutionary acts are not events in a speaker's history that produce effects, but relational statuses that exist only between parties.

  Three independent arguments support this view. First, consider the ontology of obligation. Illocutionary acts like promising or ordering alter normative positions: to promise is to incur an obligation; to order is to create a duty. Obligations are essentially relational; one cannot owe a debt without a creditor. If no party exists who can claim the performance or complain at its absence, the normative structure collapses into mere intention. Without a party capable of holding the speaker answerable, the specific normative change required for the act has not occurred. Second, consider the possibility of breach. An act like a promise is defined partly by its vulnerability to being broken. A prediction cannot be broken, only falsified; a promise can be broken. Breach requires a victim who is wronged, not merely a state of affairs that fails to obtain. If the hearer cannot register the act as binding, they cannot be wronged by its neglect. Consequently, where answerability is impossible, the distinction between breaking a promise and failing to fulfill an intention vanishes, implying no promise was made. Third, consider social coordination. The function of illocutionary acts is to coordinate agency. Coordination requires mutual knowledge of normative constraints. If I promise but you cannot hold me to it, our future actions remain uncoordinated regarding that commitment. The act fails its functional essence. Recognition alone does not coordinate; only shared normative status does.

  These arguments demand strict verdicts on hard cases. Consider the unread resignation. An employee emails a resignation to a manager who is away with an auto-reply; the message sits unopened. Compare this to speaking to a sleeping manager or pinning a note to an empty noticeboard. The Answerability Condition yields the same verdict for all three: no resignation has occurred. In each case, no manager is positioned to accept the change in status or hold the employee to the departure. The intuition that resignation occurred confuses the *intent* to resign with the *act* of resigning. The act is incomplete until the normative relation is secured. Consider the deathbed promise. A man says "I promise" to a dying, unresponsive friend. Nothing is missing from his intention, yet the friend cannot demand compliance. The view commits us to saying he did not promise. He made a vow or declared an intention. The intuition that he promised stems from conflating the moral weight of the situation with the illocutionary category. Since the friend cannot hold him accountable, the specific relational obligation of a promise is absent. We must accept this cost: solemnity does not manufacture answerability.

  Consider mis-uptake. A driver is told "I warn you, the bridge is out," meant as helpful information, but hears it as a threat. Or a woman's "no" is not heard as a refusal. Was an act performed? On this view, if the warning is heard as a threat, no warning occurred. A warning entitles the hearer to safety; a threat entitles them to fear. Since the hearer cannot hold the speaker to the norm of warning (providing safety), the act misfires. This explains why the speaker feels misunderstood: not because their mind wasn't read, but because the normative relation failed to latch. Finally, consider promises to no one. A New Year's resolution made aloud, a promise at a graveside, a proclamation to the world. These are not promises. They are vows or declarations. A promise to oneself is a contradiction in terms because one cannot be answerable to oneself in the required interpersonal sense. A proclamation to the world requires a public capable of holding the speaker accountable; if issued to the void, it is merely speech.

  Accepting this view re-describes the distinction between misfires and abuses. In Austin's framework, a misfire is where the act is void, while an abuse is where the act is performed but hollow or insincere. On the Answerability Condition, lack of answerability is a paradigm misfire. If no one can hold you to it, the act is void. However, an insincere promise is still an abuse, not a misfire, because the normative relation is established even if the intention is lacking; the speaker can still be held to the promise despite lying. This unifies uptake failure with procedural failure: both are failures to establish the normative relation. It clarifies the distinction: abuses preserve the relation; misfires destroy it.

  This also shifts the contrast between the illocutionary and the perlocutionary. Perlocutionary acts are causal effects, such as persuading or frightening. Illocutionary acts are normative effects, such as binding or empowering. Both are relational, but illocution is not causal. This cleans the distinction by removing the illusion that illocution is an internal event that subsequently causes things. It acknowledges that illocutionary acts are inherently social, not private events with public consequences.

  The single most entrenched commitment in speech act theory that must be abandoned is speaker sovereignty—the idea that the speaker's intention determines the act. We are accustomed to thinking that if I mean to promise, I have promised, provided I use the right words. The Answerability Condition denies this. It places the constitution of the act partly in the hands of the hearer's capacity to hold the speaker accountable. This is worth the trade. It grounds speech in the social reality it governs, rather than the private mind that initiates it. By sacrificing the sovereignty of the speaker, we gain an ontology of speech that matches its function: not the expression of inner states, but the construction of shared normative worlds. If we cannot be held to our words, we have not truly spoken them in the illocutionary sense. We have only made noises with the shape of speech.
