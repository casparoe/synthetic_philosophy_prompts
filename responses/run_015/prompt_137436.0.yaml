answer: |-
  ### Case Study: The Thrombolysis Triage Protocol

  **Institutional Setting:** A network of urban stroke centers evaluating two protocols for acute ischemic stroke.
  **Treatments:**
  *   **Protocol A (Aggressive):** Immediate administration of a potent thrombolytic agent (tPA) with higher bleeding risk but higher clot-dissolution potential.
  *   **Protocol B (Conservative):** Standard low-dose regimen with lower bleeding risk but lower clot-dissolution potential.
  **Stratifying Variable ($Z$):** *Early Recanalization* (Restoration of blood flow within 24 hours). This is a binary outcome ($1=$ Flow Restored, $0=$ Flow Blocked).
  **Outcome ($Y$):** *Functional Independence* at 90 days ($1=$ Independent, $0=$ Dependent/Deceased).
  **Decision Context:** A patient arrives in the ER. The clinician must choose Protocol A or B immediately. They cannot know in advance whether the patient will achieve Early Recanalization ($Z$); that is a consequence of the treatment. The goal is to maximize the probability of Functional Independence for the general stroke population.

  #### 1. The Data (Integer Counts)

  Total $N = 1,000$ patients (500 per protocol). All cell counts $\ge 60$.

  | Protocol | Recanalization ($Z$) | Independent ($Y=1$) | Dependent ($Y=0$) | Total | Success Rate |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **A (Aggressive)** | $Z=1$ (Yes) | 240 | 160 | **400** | $0.60$ |
  | | $Z=0$ (No) | 20 | 80 | **100** | $0.20$ |
  | | **Aggregate** | **260** | **240** | **500** | **$0.52$** |
  | **B (Conservative)** | $Z=1$ (Yes) | 70 | 30 | **100** | $0.70$ |
  | | $Z=0$ (No) | 120 | 280 | **400** | $0.30$ |
  | | **Aggregate** | **190** | **310** | **500** | **$0.38$** |

  #### 2. Causal Structure

  *   **Arrows:** $X \rightarrow Z$, $Z \rightarrow Y$, and $X \rightarrow Y$.
  *   **Description:** The Protocol ($X$) causally influences Early Recanalization ($Z$). Recanalization causally influences Functional Independence ($Y$). The Protocol also has a direct effect on Independence ($Y$) (e.g., via side effects like hemorrhage not mediated by flow).
  *   **Key Feature:** $Z$ is a **mediator**, not a confounder. There is no pre-treatment variable that predicts Recanalization perfectly enough to stratify on; Recanalization is fundamentally a response to the treatment.

  #### 3. The Arithmetic

  **Aggregate Risk Difference (Total Effect):**
  $$P(Y=1|A) - P(Y=1|B) = 0.52 - 0.38 = +0.14$$
  *Verdict:* Protocol A yields 14% more independent patients overall.

  **Stratum-Specific Risk Differences (Conditional Association):**
  *   **Within $Z=1$:** $P(Y=1|B, Z=1) - P(Y=1|A, Z=1) = 0.70 - 0.60 = +0.10$
  *   **Within $Z=0$:** $P(Y=1|B, Z=0) - P(Y=1|A, Z=0) = 0.30 - 0.20 = +0.10$
  *Verdict:* Within both subgroups, Protocol B outperforms Protocol A by 10 percentage points.

  **Causal Conclusion:**
  The decision-maker should adopt **Protocol A**. The quantity of interest is the Total Effect ($P(Y|do(X))$), which is unbiasedly estimated by the aggregate comparison in this randomized setting. The subgroup comparisons are "artefacts" in the context of this decision because conditioning on $Z$ blocks the primary mechanism ($X \rightarrow Z \rightarrow Y$) through which Protocol A achieves its superiority. Protocol A is better precisely because it forces patients into the $Z=1$ state (400 patients) far more effectively than Protocol B (100 patients), outweighing the fact that B is slightly safer *given* a specific recanalization status.

  **Why the Composition Effect Arises:**
  Protocol A shifts the population distribution of the mediator heavily toward the high-success stratum ($80\%$ recanalization vs. $20\%$ for B). This compositional shift boosts the aggregate success rate of A, masking its inferior direct performance within strata.

  ---

  ### Further Analysis

  #### 1. Sensitivity Analysis: The Confounder Flip
  If we reinterpret the **same table** assuming $Z$ is a **pre-treatment confounder** (e.g., Baseline Stroke Severity, where $Z=1$ is Mild and $Z=0$ is Severe) rather than a mediator, the causal verdict flips.
  *   **Structure:** $Z \rightarrow X$ (clinicians assign A to Mild cases) and $Z \rightarrow Y$ (Mild cases recover better).
  *   **Implication:** The aggregate advantage for A ($+0.14$) is now entirely due to selection bias (A got the mild cases). The within-stratum comparison ($-0.10$) reveals the true causal effect of the drug.
  *   **Result:** Under the confounder interpretation, **Protocol B** is the correct choice. This confirms that the trustworthiness of the disaggregated comparison depends entirely on the causal status of the stratifying variable, not the numbers themselves.

  #### 2. The Strongest Objection: Direct vs. Total Effect
  A critic might argue: *"The subgroup analysis identifies the Controlled Direct Effect (CDE). If we care about the biological efficacy of the drug holding physiology constant, B is superior."*
  *   **Validity:** The CDE is a coherent estimand *if* one could intervene on Recanalization independently of the Protocol. However, in clinical practice, one chooses the Protocol, not the Recanalization.
  *   **Identification:** In this specific DAG (no unmeasured confounders of $Z$ and $Y$), naive stratification *does* identify the CDE. However, the CDE is the wrong target for a policy decision where the mediator is not under independent control. Adopting B based on the CDE sacrifices the indirect benefit of driving recanalization, resulting in worse population health outcomes.

  #### 3. Measure Relativity
  The reversal is not an artefact of the Risk Difference scale.
  *   **Odds Ratios (A vs B):**
      *   Stratum $Z=1$: $(240/160) / (70/30) = 1.5 / 2.33 \approx 0.64$ (Favors B).
      *   Stratum $Z=0$: $(20/80) / (120/280) = 0.25 / 0.43 \approx 0.58$ (Favors B).
      *   Aggregate: $(260/240) / (190/310) = 1.08 / 0.61 \approx 1.77$ (Favors A).
  *   **Conclusion:** The reversal persists across Risk Difference, Risk Ratio, and Odds Ratio scales. The phenomenon is structural, not metric-dependent.

  ### Claim Establishment
  This case establishes that **stratification is only normatively obligatory when the stratifying variable is a confounder; when it is a mediator, disaggregation biases the total effect estimate and can lead to strictly inferior decisions.**
