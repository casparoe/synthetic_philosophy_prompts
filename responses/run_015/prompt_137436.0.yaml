      *   Standard Simpson's Paradox (Confounding): $X \leftarrow Z \rightarrow Y$ and $X \rightarrow Y$. Aggregated is biased, disaggregated is unbiased.
      *   Reverse Simpson's Paradox (Mediation): $X \rightarrow Z \rightarrow Y$ and $X \rightarrow Y$.
      *   Goal: Show that $P(Y|do(X=A)) > P(Y|do(X=B))$ (Total Effect favors A), even though $P(Y|X=A, Z=z) < P(Y|X=B, Z=z)$ (Conditional Association favors B).
