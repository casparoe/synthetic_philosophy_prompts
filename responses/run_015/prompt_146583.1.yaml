answer: |-
  Dave is driving home from work, mentally rehearsing where he put the keys for his new place downtown, a routine he's done every morning for six months since moving. But there's a construction barrier on the main highway, forcing a detour he hasn't taken before, which disrupts his flow just enough to make him rely on old habits without noticing. When the road splits, his hands turn the wheel left toward his old apartment in the suburbs out of pure muscle memory, even though he's still humming about unpacking boxes at the new spot. He arrives at the old driveway, surprised, while his conscious mind was still set on the new address.

  **The Reasoning**
  1.  **Cognitive-fragmentation:** This view says Dave *really* believed he was going to the new place. His explicit planning system (the voice in his head) was updated six months ago, but that belief is siloed away from the motor routines. The belief exists, it just got disconnected from the steering wheel becuase the stress of the detour blocked access to the new file.
  2.  **Action-guiding-intention:** This view says intentions are defined by what actually guides behavior. Since his body navigated to the old place successfully (just the wrong place), his real intention was directed at the old apartment. The conscious chatter about the new place is just noise; the motor system holds the real vote.
  3.  **Eliminative Materialist:** There are no beliefs or intentions here, folk psychology is wrong. There's just a stimulus (detour sign) triggering a weighted neural network where the old pathway (years of driving) had higher activation energy than the new one (six months). Saying he "believed" anything is like saying a thermostat believes it's cold.

  **The Detour Feature**
  The work is done by the *unexpected navigational demand*. The closure broke the smooth cue-response chain of the new route, forcing the brain to search for a familiar pattern to solve the immediate problem, which dug up the deeper, older sediment of the old commute.

  **Remove the Road-Change**
  If the road is open, he drives the new route. Even if he's zoned out, the physical lanes guide him to the new place. Belief and action align, and all three theories look roughly equivalent becuase there's no conflict to exploit.

  **Who Gets Screwed**
  The **Cognitive-fragmentation** view gets screwed the most. It has to explain how a "belief" can exist without doing any work in the exact context it's supposed to govern. It makes belief inert.
  *Their Defense:* They'll argue that beliefs aren't unitary. They'll say he has a "verbal belief" (new place) and a "procedural belief" (old place), and usually they handshake, but here they didn't. They survive by fracturing the mind into smaller and smaller rooms until the data fits.
