  Furthermore, your Traffic test fails here. Anomalies traveling outward requires a network to carry them. Did the 2003 surveyors engage with his theory, or did they simply record strata? Did historians subsequently use his revised chronology to date other sites, or did he remain a lone voice with a lucky hit? A research programme is not a monologue. Lakatos tells us fruitfulness is retrospective; we only call a problem-shift progressive once it has won. If the confirmation does not trigger a cascade of normal-historical research within the discipline—if no one else adopts his methods to solve new problems—then the traffic remained inward, circular around the author himself. The label pseudohistory sticks not because the reasoning was inherently flawed, but because the reasoning failed to recruit the social machinery required to turn a claim into a fact. You see a lag in institutional verdict; I see the verdict constituting the reality you describe.
