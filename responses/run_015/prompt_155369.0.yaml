answer: |-
  **Project Title:** Mirrors and Signals: Decomposing Evidential Cooperation in Large Populations

  **Statement of the Question**
  Standard evidential decision theory (EDT) yields robust cooperation in two-agent Prisoner's Dilemmas where agents are sufficiently similar (e.g., clones or algorithmic twins). The agent treats her own act as evidence of the other's act, rendering cooperation utility-maximizing. However, the application of this result to large-world scenarios—voting, climate mitigation, coordination among AI developers—assumes that the evidential link holds as population size ($N$) scales. This project asks: *Does the evidential case for cooperation decay as $N$ increases, and does the rate of decay depend on the structural source of the correlation between agents?*

  I propose that current literature conflates two distinct mechanisms generating correlation, which I label **Mirror Cooperation** and **Signal Cooperation**. These can be distinguished formally by the probabilistic structure relating the agent's act ($A_{me}$) to the population's acts ($A_{others}$).

  1.  **Mirror Mechanism (Self-Locating Uncertainty):** The agent is uncertain *which* agent in the population she is. She shares a policy $\pi$ with the group. Her act is a sample from $\pi$. Conditioning on $A_{me}$ updates the probability of $\pi$, which simultaneously updates the probability of $A_{others}$ because they execute the same $\pi$. Formally, correlation arises from indexical uncertainty: $P(A_{other} | A_{me})$ remains high regardless of $N$, provided the agent considers herself a random sample from the policy-executing population.
  2.  **Signal Mechanism (Type Uncertainty):** The agent knows her index but is uncertain about her intrinsic *type* ($T$), which determines her disposition to cooperate. Her deliberation and act are noisy signals of $T$. Types are correlated across the population via a common prior or causal history. Formally, $A_{me}$ signals $T_{me}$, which signals $T_{other}$, which determines $A_{other}$. Here, $A_{me}$ is a single data point regarding the global type distribution.

  The central research question is determinate: *In the Signal Mechanism, does the expected utility of cooperation converge to the causal baseline as $N \to \infty$, whereas in the Mirror Mechanism it remains elevated?* If so, the optimistic application of EDT to large-scale coordination problems rests on a category error, modeling Signal problems as Mirror problems.

  **Context and Gap**
  Current defenses of evidential cooperation typically proceed from two-agent cases or assume perfect correlation. They argue that if agents are "sufficiently similar," conditioning on one's own act is rational. These arguments are sympathetic to EDT but often ignore the *topology* of the similarity. They assume the correlation coefficient is fixed or exogenous. Consequently, they fail to specify whether similarity implies shared policy (Mirror) or shared type (Signal).

  Conversely, standard objections to EDT argue that conditioning on one's own act is illicit "news management" regardless of the setting. These critics deny the validity of the evidential link entirely. However, by treating all evidential links as equally suspect, they miss the opportunity to distinguish between links that are structurally robust to scaling (Mirror) and those that are fragile (Signal). Neither side addresses how the *source* of the correlation interacts with population size. This project fills that gap by isolating the mechanism of correlation and testing its scalability.

  **Methodology and Formal Model**
  The project will employ a parametric formal model rather than purely informal argument or simulation. Informal argument is insufficient because intuitions regarding probability and scaling are unreliable in large $N$ cases. Simulation is inadequate because the goal is to determine asymptotic behavior ($N \to \infty$), which requires analytic derivation.

  *The Model:* I will construct a Bayesian network representing the decision problem.
  *   **Parameters:** Population size ($N$); Type Correlation Strength ($\rho$); Signal Noise ($\sigma$), representing the agent's imperfect access to her own deliberation/type prior to acting.
  *   **Mirror Condition:** Modeled via a self-locating prior over agent indices. The likelihood function ties $A_{me}$ directly to the global policy output.
  *   **Signal Condition:** Modeled via a hierarchical prior. $T_{global} \to T_{me}, T_{other}$. $T_{me} \to Deliberation \to A_{me}$.
  *   **Metric:** The "Evidential Boost," defined as the difference in expected utility between Cooperation and Defection as a function of $N$.

  *Defense of Approach:* A minimal analytic model allows for the derivation of limit theorems. If the Evidential Boost goes to zero in the Signal case but not the Mirror case, the distinction is proven. If both go to zero, EDT's large-world applicability is severely curtailed. If neither go to zero, EDT is more robust than suspected. This cannot be settled by simulation, which can only test finite $N$.

  **Work Plan (Nine Months)**
  *   **Months 1–2: Formalization.** Rigorously define the Mirror and Signal structures within a decision-theoretic framework. Derive the likelihood functions for both. Ensure the "deliberation as evidence" aspect is captured in the Signal noise parameter ($\sigma$).
  *   **Months 3–5: Analysis.** Solve for the expected utility of cooperation in both models. Derive the limit behavior as $N \to \infty$. Investigate the sensitivity of the results to $\rho$ and $\sigma$.
  *   **Months 6–7: Interpretation.** Map the formal results back to philosophical cases. Determine whether voting, climate action, and AI coordination fit the Mirror or Signal profile. Draft the core philosophical argument regarding the "category error" in current EDT applications.
  *   **Months 8–9: Writing and Dissemination.** Complete the manuscript for journal submission. Prepare a shorter version for conference presentation. Ensure the distinction is accessible to non-formalists.

  **Possible Conclusions**
  1.  **Divergence (Hypothesized):** Mirror cooperation remains robust at large $N$; Signal cooperation decays to causal levels. *Implication:* EDT supports cooperation in "clone" scenarios but fails to support it in real-world large-scale coordination, requiring a revision of EDT's practical recommendations.
  2.  **Convergence:** Both mechanisms decay. *Implication:* Evidential cooperation is inherently a small-world phenomenon. Large-world coordination requires causal or subjunctive mechanisms (e.g., FDT/GDT) rather than pure evidential conditioning.
  3.  **Robustness:** Both mechanisms hold. *Implication:* The distinction is mathematically irrelevant to the outcome; EDT is more powerful than anticipated.

  The decision between these conclusions will rest on the analytic derivation of the limit of the Evidential Boost. If the limit is zero for Signal and non-zero for Mirror, the hypothesis is confirmed.

  **Risk Assessment and Scope**
  *   **Failure Conditions:** The project fails if the distinction between Mirror and Signal collapses under formal scrutiny (e.g., if self-locating uncertainty can be fully reduced to type uncertainty). It also fails if the model becomes intractable, preventing analytic solutions for large $N$.
  *   **Scope Creep:** The primary risk is expanding the project into a general critique of EDT or a full theory of large-world decision theory. To avoid this, I will strictly constrain the analysis to the *scaling behavior of the correlation coefficient* derived from the two mechanisms. I will not attempt to solve the "reference class" problem generally, but only insofar as it distinguishes Mirror from Signal.
  *   **Mitigation:** If the analytic model proves intractable, I will pivot to deriving bounds rather than exact solutions. If the distinction collapses, the project will pivot to documenting that collapse as a negative result, which is itself a significant contribution to the literature on evidential reasoning.

  This project offers a precise, formal test of a foundational assumption in decision theory. By disentangling the mechanisms of correlation, it clarifies whether evidential reasoning can truly scale to the problems that matter most.
