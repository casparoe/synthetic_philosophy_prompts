      *   Also: "whether the argument needs an adversary." Answer: No, merely a non-zero probability of the offers recurring is enough (Expected Utility loss).

  7.  **Final Polish:** Check constraints. "Sentence or two" for justifications. "Point-by-point verdict." "Who is more right overall." "Missed point."

