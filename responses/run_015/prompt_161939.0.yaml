answer: |-
  This is a precise and painful question. You have constructed the dilemma clearly: if your brother is the product of his history (your friend's view), he is not ultimately the author of his actions. If he is the author of his character (your father's view), he is uniquely accountable for its failure. You want to know if the guilt and resentment involved are tracking something real, or if they are mechanical spasms we cannot help but feel.

  I will address your "compounding reply" first, because it is the strongest tool you have offered, and then move to the nature of the emotions themselves.

  ### 1. The Compounding Reply and the Regress

  Your friend's argument is the "infinite regress" of causality. She argues that to own a choice, you must have chosen the self that made the choice. Since you cannot choose your starting self, you can own nothing.

  Your compounding reply suggests that you do not need to own the *starting* self, only the *margin of change*. If each step was a small nudge within your reach at the time, the accumulated result is yours.

  **Does this escape the regress?**
  Metaphysically, no. Your friend can still argue that the capacity to make that "small nudge" was determined by prior causes (your brain chemistry, the specific pressure of the girlfriend's ultimatum, the socioeconomic availability of the therapist). If you trace the chain back far enough, the "nudge" also dissolves into things that happened *to* him.

  **However, practically, it stops the regress where it matters.**
  In logistics, you do not need to know the origin of the fuel to know that the engine runs on it. You need to know if the engine is functional. Your compounding reply identifies the point where *agency* becomes a usable concept. Even if the capacity to make a nudge was given to him, he was the only one who could *execute* it. The chain of causality may be infinite, but the chain of *maintenance* is finite.

  Think of it like a freight route. A driver did not build the truck, pave the road, or refine the fuel. All those things were "done to him." But if he falls asleep at the wheel, we do not say the truck crashed because of the road builder. We say he crashed it. Why? Because the steering was within his operational control, even if the truck was not within his creative control.

  Your brother's eight years of reform were a proof of operational control. He demonstrated that, given the truck he had, he could drive it safely. The relapse proves that under specific stress conditions (job loss, custody dispute), the operational control failed.

  ### 2. The Question of Blame: Is He More to Blame?

  You asked: *Is my brother, who spent eight years becoming gentle, more to blame for that one night than a man who never tried and did the same thing?*

  Your intuition says this feels wrong. Your father's logic says it is right. Here is the distinction that resolves the tension.

  There are two types of blame here: **Blame for the Harm** and **Blame for the Betrayal.**

  *   **Blame for the Harm:** Regarding the disabled man in the car park, your brother is likely *not* more to blame than a man who never tried. The victim's injury is the same. The violence is the same. If the "un-reformed" man had been in that car park, he might have done the exact same thing. In terms of pure outcome, the effort your brother made does not increase the debt he owes the victim.
  *   **Blame for the Betrayal:** This is where your father is right, and where the guilt is real. Your brother made a promise to the world, and specifically to your family, that he was safe. He built a reputation for safety. He invited you to lower your guard. By relapsing, he violated the specific trust that his reform created.

  The man who never tried is consistently dangerous. You know who he is. You do not trust him. When he strikes, it is a confirmation of expectations.
  Your brother became inconsistently dangerous. He invited trust. When he strikes, it is a violation of expectations.

  Therefore, he is not more responsible for the *punch*, but he is more responsible for the *disappointment*. The guilt he feels is not just "I hurt someone"; it is "I became someone who hurts people after promising I wouldn't." That is a heavier, more complex guilt. It is the guilt of a collapsed structure, rather than a structure that was never built.

  So, your compounding reply works here: He compounded trust over eight years. The crash wipes out the equity. The loss is greater because the equity was higher.

  ### 3. The Wrinkle: The Girlfriend's Ultimatum

  You ask if it matters that the chain began with a threat (she would leave him) rather than a pure choice.

  It matters less than you think. Very few human transformations begin with a pure, uncaused desire to be good. They begin with pain, threat, or necessity. A man quits drinking because his liver fails, not because he spontaneously loves sobriety. A man stops fighting because he is arrested, not because he suddenly loves peace.

  The origin of the motive does not invalidate the ownership of the habit.
  If you are forced onto a path, but you walk it for eight years after the force is removed, you are walking it yourself. Your brother continued therapy after the court order expired. He kept the journal after the girlfriend's threat was no longer immediate.

  The "spark" can be external. The "fuel" must be internal. If he had not found some internal resonance with the work, he would have quit when the external pressure eased. The fact that he sustained it for eight years suggests that at some point, the external threat was replaced by internal maintenance. That is where the ownership begins.

  ### 4. Are Resentment and Guilt Real?

  This is your final and deepest question. If the friend is right (everything is a chain of causes), then guilt is an illusion. If the father is right (he chose his character), guilt is a verdict.

  I propose a third option, which fits your logistics background. Guilt and resentment are not judgments on the metaphysics of the universe; they are **system alerts.**

  *   **Guilt** is the internal signal that your operational output did not match your intended design. It is the alarm that goes off when the system malfunctions. It does not matter if the malfunction was "determined" by physics. The alarm is real because the discrepancy is real. Your brother's guilt is the recognition of the gap between the self he built and the act he committed. That gap exists regardless of determinism.
  *   **Resentment** is the external signal that a social contract has been breached. You trusted him based on data (eight years of calm). He acted contrary to that data. Your resentment is the pain of that data being invalidated. It is not a claim that he is a "sinner" in a religious sense; it is a claim that he is unreliable in a relational sense.

  **Are they justified?**
  If you define "justified" as "proving he had magical, uncaused free will," then no. Nothing can prove that.
  If you define "justified" as "accurate responses to a breach of trust and capacity," then yes.

  We hold people responsible not because they are metaphysically free gods, but because they are **responsive agents.**
  Your brother showed he was responsive to therapy, to journals, to routine. He showed he could be steered. That makes him a valid target for moral pressure. To treat him as *not* responsible (as your friend suggests) is to treat him as a broken machine that cannot be fixed. To treat him as responsible is to treat him as a machine that *can* be fixed, but must be held to its specifications.

  ### Summary

  1.  **Your Compounding Reply:** It does not solve the metaphysical regress, but it correctly identifies the locus of agency. He owns the maintenance, even if he didn't build the engine.
  2.  **The Blame:** He is not more to blame for the injury, but he is more to blame for the breach of trust. The guilt is heavier because the investment was higher.
  3.  **The Ultimatum:** The origin of the chain is less important than the sustainability of it. He owned the middle, even if he didn't choose the start.
  4.  **The Emotions:** Guilt and resentment are real. They are not illusions. They are the necessary friction of human relationships. They track *capacity* and *trust*, not metaphysical freedom.

  Your brother's claim that "it was not him" is false. It was him. It was the version of him that exists under extreme stress. The tragedy is not that a stranger took over his body; the tragedy is that the gentle man he built was not strong enough to survive the storm. That is a failure of construction, and he is the foreman of that construction.

  You do not need to decide if the universe is determined to know that the trust is broken. The resentment you feel is the cost of that broken trust. It is real, and it is justified by the relationship you had, not by the physics of his brain.
