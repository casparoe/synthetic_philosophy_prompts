answer: |-
  # Desiderata for a Theory of the Moral Status of Local Conventions

  To evaluate whether everyday conventions (tipping, queueing, jaywalking) generate genuine moral obligations or function merely as coordination devices, an adequate theory must meet specific explanatory burdens. The following list specifies the criteria such a theory must satisfy, the motivating cases behind them, and their theoretical status.

  ### 1. The Epistemic and Ontological Scope of Visitor Obligations
  **Specification:** The theory must distinguish between *structural ignorance* (a visitor genuinely lacks access to the local rule) and *knowing refusal* (a visitor understands the rule but opts out). Furthermore, it must specify whether the obligation binds only those embedded in the practice (ontological scope) or applies to any agent operating within the physical space.
  **Motivating Case:** A tourist in a country where tipping is culturally mandatory but not legally enforced. If they do not tip due to ignorance, are they morally blameworthy? If they know but refuse, is the violation a moral wrong or merely a social faux pas?
  **Status:** **Non-negotiable.** Any moral theory that ignores epistemic access violates the principle that "ought implies can" (or "ought implies know").
  **Tension Flag:** High tension with Desideratum 5 (see Incompatibility Analysis below).

  ### 2. The Distinction Between Arbitrary Coordination and Vulnerability Protection
  **Specification:** The theory must differentiate between conventions that solve pure coordination problems (where the specific rule matters less than having *a* rule) and conventions that function as surrogate welfare mechanisms protecting vulnerable parties.
  **Motivating Case:** Compare queueing vs. tipping. Violating a queue causes delay (a coordination failure). Violating a tipping norm in a jurisdiction with sub-minimum wage laws directly impacts a server's livelihood (a welfare harm). The theory must explain why the latter carries heavier moral weight than the former.
  **Status:** **Non-negotiable.** A theory that treats all conventions as morally equivalent fails to capture the intuitive gravity of harm versus mere inconvenience.
  **Tension Flag:** Low tension. Most robust theories can accommodate this via a threshold of harm.

  ### 3. Normative Force Under Pluralistic Ignorance
  **Specification:** The theory must explain the moral status of conventions that are publicly enforced but privately rejected by the majority of participants. It must avoid collapsing the "obligation" into a mere description of social pressure or fear of sanction.
  **Motivating Case:** A formal dress code or a rigid greeting ritual that nearly everyone finds burdensome and would privately vote to abolish, yet no one deviates because they believe *others* value it. Does a moral obligation to comply persist if the collective will supporting the norm is illusory?
  **Status:** **Non-negotiable.** This distinguishes normative ethics from sociology. If the theory cannot explain why an obligation might dissolve when the collective intent dissolves, it conflates *is* with *ought*.
  **Tension Flag:** Moderate tension with Desideratum 1. If obligations rely on collective intent, visitors are rarely bound.

  ### 4. The Existence of Moral Exemption Zones
  **Specification:** The theory must account for "trivial" violations where non-compliance inconveniences others but does not rise to the level of blameworthiness. It must define the boundary where a convention becomes too weakly justified to demand compliance.
  **Motivating Case:** Jaywalking on a deserted street at 3:00 AM. The convention (wait for the green light) is violated, but there is no risk of harm and no disruption to traffic flow. Is this a *prima facie* wrong that is excused, or not a wrong at all?
  **Status:** **Theoretical Preference.** Strict deontological views may reject exemption zones (rule worship), while consequentialist and virtue-ethical views generally require them to avoid moral clutter.
  **Tension Flag:** Low tension. Compatible with most non-absolutist frameworks.

  ### 5. Universalizability vs. Context-Sensitive Justification
  **Specification:** The theory must determine whether the justification for following a convention is universalizable (all rational agents must follow local norms to respect order) or context-sensitive (obligations arise only from participation in a specific local scheme). It must achieve this without collapsing into moral relativism.
  **Motivating Case:** "When in Rome." If a visitor is morally required to follow local norms, is this because of a universal duty to respect local autonomy, or because the local norm itself generates the duty? If the latter, how can a non-participant be bound?
  **Status:** **Non-negotiable.** A theory that collapses into relativism ("it's right there because they say so") loses critical purchase on unjust conventions (e.g., segregation norms).
  **Tension Flag:** **Critical Tension** with Desideratum 1.

  ---

  ### Incompatibility Analysis: The Visitor Paradox

  There is a strong suspicion that **Desideratum 1 (Visitor Obligations)** and **Desideratum 5 (Context-Sensitive Justification)** are jointly unsatisfiable without significant theoretical modification.

  *   **The Conflict:** If the moral force of a convention is derived from *local participation* (a context-sensitive justification akin to a local social contract), then non-participants (visitors) cannot logically be bound by it, as they have not consented to the scheme. However, if we insist that visitors *are* bound to follow local norms (Desideratum 1), the justification cannot rest solely on local participation; it must rest on a universal principle (e.g., "do not disrupt local expectations" or "respect local autonomy").
  *   **The Risk:** Moving to a universal principle to save Visitor Obligations risks moral imperialism (forcing visitors to adhere to unjust local norms) or relativism (if the universal principle is simply "obey local rules," then unjust local rules become morally binding).
  *   **Resolution Requirement:** An adequate theory must find a middle ground, likely by arguing that visitors have a *weaker* or *different kind* of obligation (e.g., a duty of non-disruption) compared to locals (a duty of fairness/reciprocity).

  ---

  ### Brief Theoretical Scorecard

  To illustrate the utility of these desiderata, here is how two common frameworks fare against the list:

  **1. Pure Social-Contract View (Conventionalism)**
  *   **Performance:** Strong on **Desideratum 3 (Pluralistic Ignorance)** and **Desideratum 5 (Context)**. It explains why obligations dissolve if the collective will dissolves and why norms vary by location.
  *   **Failure Point:** Fails **Desideratum 1 (Visitors)**. If obligation stems from implicit consent/participation, visitors who have not "signed" the local contract cannot be morally bound, only pragmatically pressured. It also struggles with **Desideratum 2 (Vulnerability)**, as it may treat harmful conventions as binding if the "contract" was historically accepted.

  **2. Harm-Based View (Rule-Consequentialism)**
  *   **Performance:** Strong on **Desideratum 2 (Vulnerability)** and **Desideratum 4 (Exemptions)**. It easily distinguishes tipping (livelihood harm) from queueing (delay) and exempts jaywalking when no harm occurs.
  *   **Failure Point:** Struggles with **Desideratum 3 (Pluralistic Ignorance)**. If everyone is happier without the norm, a harm-based view suggests the norm should vanish immediately, failing to explain the transitional obligation to coordinate during the shift. It also risks failing **Desideratum 5**, potentially imposing external moral judgments on local practices that do not register as "harmful" by external metrics but are culturally significant.

  **Conclusion for Seminar Discussion:**
  An adequate theory likely requires a hybrid approach: a harm-based baseline (to satisfy Desideratum 2 and 4) overlaid with a fairness-based account of coordination (to satisfy Desideratum 1 and 3), while carefully restricting the scope of participation to avoid the relativism trap in Desideratum 5. The primary theoretical work lies in resolving the tension between visitor obligations and the source of normative force.
