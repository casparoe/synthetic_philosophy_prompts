prompt: |-
  I'm a third-year PhD student in experimental psychology and I've somehow ended up on our department's research integrity committee, which in practice means I'm the one who has to write the paragraph explaining why we're adopting whatever method reform we're adopting this year. I keep tripping over the same thing, so I thought I'd ask people who do this for a living rather than keep guessing.

  Here's the bit I can't line up. Take two studies: identical design, identical n, identical measurements, identical p-value, say p = .21 in both. Study A was pre-registered with a fixed sample size and a stated smallest effect size of interest, analysed exactly as declared. Study B is the same study run before pre-registration was mandatory here; the analysis was settled after people had looked at the data, and as far as anyone can tell there was no outright fishing, just no pre-commitment. Under our new norms A counts as a genuine finding, evidence of absence, publishable, and it can be cited in a review as settling the question. B is treated as uninformative, file-drawer material, we can't conclude anything from it. Same number on the page, opposite verdicts.

  Then there's the part where I'm not sure we're consistent with ourselves. We're strict about fixing n in advance, and people get told off for peeking at the data and stopping early; the line we give them is that if you'd have carried on past n = 40, you don't get to use the p = .03 you happened to have at n = 40. At the same time, we treat a single pre-registered replication that comes back at p = .40 as a failed replication that puts the original effect in doubt, even though we'd never dream of accepting a single p = .03 as establishing anything. And our ethics committee has now started requiring a smallest effect size of interest in every application, so in principle you can have a confidence interval that includes zero but excludes anything you'd have cared about, and reviewers will say no effect there — but apparently only if the study was pre-registered, and only if someone is willing to say it out loud. Quite a few of my colleagues resist going further and just using equivalence tests with a pre-registered bound, and I genuinely can't tell whether that's methodological conservatism or an inconsistency they haven't noticed.

  So: what view of evidence does this whole package presuppose? More specifically,

  - What has to be true of evidence for pre-registration to change what a given p-value is worth, given that the data are identical in A and B? Is that a commitment to a procedural or reliabilist picture, on which evidence is a property of the method rather than of the numbers, or is there a way to get the same verdict out of a broadly Bayesian picture, e.g. by conditioning on the fact that this result was reported at all rather than just on the test statistic? If there is, does the practice really pick out the first view, or does it fit several?
  - Does the ban on optional stopping presuppose the same thing as the pre-registration bit, or a different thing? It feels like it presupposes that error rates across hypothetical repetitions matter in their own right, whereas the pre-registration asymmetry felt like it was about what the data support. If those are two different commitments, are they even compatible, and which of our rules actually follows from which?
  - How much of this is forced? Which parts of our practice would survive intact under a likelihoodist or Bayesian picture, and which would have to be abandoned? If we went properly Bayesian, priors, Bayes factors, decisions by expected loss, what exactly would we stop doing that we currently do, and what would we have to start doing that we don't?
  - Is there a genuine inconsistency between treating non-significance as we can't say in a single study and treating it as damning in a replication, or is there a single story from which both fall out?

  I don't want a reading list or citations, I can find those myself. I want the implicit epistemology reconstructed, and I want to be told which bits of it we're actually stuck with and which bits we've merely inherited from people arguing in the 1930s. If it helps: we mostly run small-N within-subjects experiments on reaction times and accuracy, nobody has any real idea what our effect sizes are, and half the lab thinks p-values should be abolished outright.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year PhD student in experimental psychology.
      *   **Role:** Member of the department's research integrity committee (tasked with writing the justification for method reforms).
      *   **Problem:** Struggling to articulate the underlying epistemological justification for current methodological reforms (pre-registration, optional stopping bans, interpretation of null results). They see apparent inconsistencies in how identical data ($p = .21$) are treated based on procedural history (Study A vs. Study B) and how non-significance is treated differently in original studies vs. replications.
      *   **Request:** Reconstruct the implicit epistemology of current reform practices. Determine what *must* be true for these practices to make sense. Distinguish between procedural/reliabilist vs. Bayesian views. Assess consistency (optional stopping vs. pre-registration). Evaluate what survives under Likelihoodist/Bayesian frameworks. Avoid reading lists/citations; focus on conceptual reconstruction.
      *   **Domain:** Experimental psychology (small-N, within-subjects, RT/accuracy).

  2.  **Deconstruct the Core Tension:**
      *   *The Paradox:* Identical data ($p=.21$) $\rightarrow$ Study A (Pre-registered) = Evidence of Absence; Study B (Exploratory) = Uninformative.
      *   *The Inconsistency:* Optional stopping banned (frequentist error control) vs. Single Replication Failure ($p=.40$) treated as damning (seems like strong evidence against $H_1$).
      *   *The Goal:* Explain *why* the field does this, what philosophical commitments underpin it, and where the contradictions lie.

  3.  **Address Question 1: Pre-registration and the Value of Identical Data (A vs. B)**
      *   *Frequentist View:* The $p$-value is defined by the sampling distribution. The sampling distribution depends on the *stopping rule* and *analysis plan*. If the plan wasn't fixed, the sampling distribution is undefined (or effectively infinite). Therefore, the number ".21" literally means something different in A and B. In A, it's $P(Data | H_0, Fixed Plan)$. In B, it's $P(Data | H_0, Unknown Plan)$.
      *   *Reliabilist/Procedural View:* Evidence isn't just the likelihood of the data; it's the trustworthiness of the process generating the data. Study B has high "researcher degrees of freedom," inflating Type I error rates in the long run. We distrust the number because the process is corruptible.
      *   *Bayesian View:* Strictly speaking, the Likelihood Principle says only the data matter. However, a *sophisticated* Bayesian conditions on the *model space*. If Study B implies a huge space of potential models tested (garden of forking paths), the prior probability on the specific model tested drops, or the Bayes Factor needs to account for the selection process.
      *   *Verdict:* Current practice is predominantly **Frequentist/Reliabilist**. It treats the $p$-value as a property of the *test*, not just the *data*. To justify A vs. B difference without frequentism, you need a Bayesian model that penalizes "hidden multiplicity."

  4.  **Address Question 2: Optional Stopping vs. Pre-registration**
      *   *Optional Stopping:* Purely Frequentist. It violates error rate control ($\alpha$ inflation). If you peek, the long-run false positive rate exceeds 5%.
      *   *Pre-registration (A vs. B):* This is about *interpretability* and *severity*. A pre-registered null is a "severe test" (Mayo). An exploratory null is not severe because it could have been massaged to look significant.
      *   *Compatibility:* They are compatible under a **Error Statistical** framework (Deborah Mayo). Both are about ensuring that if $H_0$ were true, the procedure wouldn't often produce this result. Optional stopping breaks the error stats. Exploratory analysis breaks the severity of the test.
      *   *Inconsistency:* The inconsistency arises when people treat a single replication failure ($p=.40$) as definitive. Frequentism doesn't allow "accepting $H_0$" easily. This is where the field smuggles in a quasi-Bayesian or Decision-Theoretic view (cost of false positives > cost of false negatives in replication contexts).

  5.  **Address Question 3: Bayesian/Likelihoodist Survival**
      *   *Likelihood Principle:* Violated by current practice. Likelihoodists say stopping rules are irrelevant. So, the ban on optional stopping and the A vs. B distinction (based purely on procedure) would have to be abandoned or radically reinterpreted.
      *   *Bayesian:*
          *   *Optional Stopping:* Allowed (under proper priors and coherent updating).
          *   *Pre-registration:* Still useful for priors (constraining the model space), but not strictly necessary for validity.
          *   *What stops:* Null Hypothesis Significance Testing (NHST), $p$-values, fixed $\alpha$ thresholds, power analysis (replaced by prior predictive checks).
          *   *What starts:* Specifying priors, reporting Bayes Factors or posteriors, decision theory (expected loss).
          *   *The "Smallest Effect Size of Interest" (SESOI):* This actually fits *better* with Bayesian decision theory (loss functions) or Equivalence Testing (TOST) than standard NHST.
      *   *Current Practice:* It's a "Frankenstein" monster. Frequentist controls with Bayesian intuitions about evidence.

  6.  **Address Question 4: Non-significance (Original vs. Replication)**
      *   *Original Study:* $p > .05$ $\rightarrow$ "Inconclusive." Why? Low power. High risk of Type II error.
      *   *Replication:* $p > .05$ (or $p=.40$) $\rightarrow$ "Failed Replication." Why? Because the *prior* probability of the effect is now updated. The original established a claim; the replication tests the robustness.
      *   *The Single Story:* It's not strictly Frequentist. It's a **Sequential Decision Process**.
          *   Stage 1 (Discovery): High tolerance for false negatives, low tolerance for false positives (hence "inconclusive" nulls).
          *   Stage 2 (Replication): The claim exists. We are testing the *claim*, not just the null. A null result here updates the community belief significantly.
      *   *Inconsistency:* Technically, if power is low in the original, it's likely low in the replication (if $N$ is same). Treating the replication null as "damning" implies the replication had high power to detect the *original* effect size. If it did, then the original was likely a false positive or inflated. This is consistent *if* you assume the original effect size estimate was biased (which it usually is).

  7.  **Synthesize and Structure the Argument:**
      *   *Introduction:* Acknowledge the "Frankenstein" nature of current reform. It's not a pure philosophy; it's a pragmatic patch job.
      *   *Section 1: The A vs. B Distinction (Proceduralism).* Explain that current practice is **Error Statistics/Reliabilist**. The number isn't the evidence; the *guarantee* is the evidence. Mention the Likelihood Principle violation.
      *   *Section 2: Optional Stopping & Pre-registration.* Connect them via **Severity**. Both ensure the test *could* have found an error.
      *   *Section 3: The Bayesian/Frequentist Mismatch.* Highlight where the field is pretending to be Bayesian (interpreting nulls in replications) while using Frequentist tools (p-values).
      *   *Section 4: The Replication Paradox.* Explain it via **Prior Updating** smuggled into Frequentist clothing.
      *   *Section 5: What to write in the report.* Give the user the "official" story vs. the "real" story.

  8.  **Refine the Tone:**
      *   Needs to be peer-to-peer (PhD to PhD).
      *   Direct, no fluff, no citations.
      *   Acknowledge the frustration (it *is* inconsistent).
      *   Focus on the "Implicit Epistemology."

  9.  **Self-Correction/Nuance Check:**
      *   *Did I answer the specific question about SESOI?* Need to ensure I mention that SESOI + CI is effectively Equivalence Testing, which *is* valid Frequentist logic for "evidence of absence," unlike standard NHST.
      *   *Is the A vs. B distinction purely Frequentist?* A Bayesian could argue that in Study B, the model is $M_{selected}$ from a set $\{M_1...M_k\}$, which changes the marginal likelihood. So it *can* be Bayesian, but current practice doesn't calculate it that way; it just bans B.
      *   *Replication:* Make sure to distinguish between "failure to reject null" and "evidence for null." The field treats replication failure as evidence for null, which requires high power.

  10. **Final Polish:** Organize by the user's bullet points for clarity. Ensure the conclusion gives actionable advice for the committee report. (Drafting the response...)

  *(Self-Correction during drafting)*: I need to be careful not to say "Bayesians allow optional stopping" without qualification (it requires proper priors and no peeking at the *decision* boundary in a frequentist sense, but generally yes). I should emphasize that the current system is **Neo-Fisherian with a Severity overlay**.

  Let's structure the response to directly tackle the four bullet points, then offer a synthesis for the report.

  *   *Point 1 (A vs B):* It's about the **Sampling Distribution**, not the Likelihood. The epistemology is **Error Statistics**.
  *   *Point 2 (Stopping vs Pre-reg):* They are the same commitment (Control of Long-Run Error/Severity).
  *   *Point 3 (Bayesian Survival):* Most current rules vanish. Priors replace pre-registration.
  *   *Point 4 (Replication):* It's a **Decision-Theoretic** asymmetry, not a logical one.

  Okay, ready to write.
answer: |-
  You have correctly identified that the current "reform" package in psychology is not a coherent philosophical system but a pragmatic patchwork. It is a Neo-Frequentist framework trying to do Bayesian jobs with Frequentist tools.

  Here is the reconstruction of the implicit epistemology your committee is operating under, stripped of the textbook justifications.

  ### 1. The A vs. B Distinction: Evidence as Procedure, Not Data
  **The Commitment:** Your department's practice presupposes an **Error-Statistical** or **Reliabilist** view of evidence, not a Likelihoodist one.

  Under a strict Likelihood Principle (which most Bayesians and Likelihoodists hold), the evidential meaning of the data depends *only* on the observed data and the model. The stopping rule and the analysis plan are irrelevant. If you hold this view, Study A and Study B provide identical evidence.

  Your committee rejects this. You are operating on the view that a $p$-value is not a measure of the evidence *in* the data, but a measure of the **trustworthiness of the process** that generated the data.
  *   **Study A:** The sampling distribution is well-defined. The long-run error rate is controlled. The number .21 has a known frequency interpretation under $H_0$.
  *   **Study B:** The sampling distribution is undefined because the "experiment" includes the hidden mental process of the researcher selecting the analysis. The long-run error rate is unknown (and effectively $> .05$).

  **Is there a Bayesian justification?**
  Yes, but it is not the one your committee is using. A Bayesian could argue that in Study B, you must condition on the fact that *this specific analysis was reported*. This implies a "multiverse" of analyses was considered. To calculate the marginal likelihood correctly, you would need to integrate over all the analyses the researcher *could* have run but didn't. Since we can't do that, the Bayes Factor is incalculable.
  *   **Verdict:** Your practice fits the **Error-Statistical** view best. It treats validity as a property of the *method's capacity to detect error*, not the data's support for a hypothesis. Study A has "severity" (it could have easily yielded $p < .05$ if $H_1$ were true); Study B does not.

  ### 2. Optional Stopping vs. Pre-registration: Same Commitment
  **The Commitment:** Both rules flow from the same source: **The necessity of a fixed sampling distribution for error control.**

  You asked if these are different commitments. They are not. They are two applications of the same Frequentist axiom: *To interpret a test statistic, you must know the space of possible outcomes that did not occur.*
  *   **Optional Stopping:** If you peek, the space of possible outcomes expands (you could have stopped earlier). The $p$-value calculation assuming a fixed $N$ is now mathematically false.
  *   **Pre-registration:** If you analyze flexibly, the space of possible outcomes expands (you could have chosen a different covariate). The $p$-value calculation assuming a fixed model is now mathematically false.

  **The Inconsistency:**
  The inconsistency you sense comes from how we *use* the results, not how we *validate* them.
  *   We ban optional stopping to protect $\alpha$ (False Positive rate).
  *   We demand pre-registration to protect $\beta$ (False Negative rate/Severity) and interpretability.
  *   **Compatibility:** They are compatible under Error Statistics. However, they are **incompatible with the way replications are interpreted** (see point 4).

  ### 3. What Survives a Bayesian Shift?
  If you switched to a "proper" Bayesian framework (priors, posteriors, decision theory), most of your current rules would dissolve or change form.

  **What would be abandoned:**
  *   **The Ban on Optional Stopping:** In coherent Bayesian updating, you can stop whenever you like, provided you update the posterior correctly. (Caveat: You cannot use Frequentist decision rules on Bayesian posteriors without breaking things, but pure Bayesian inference allows it).
  *   **The A vs. B Hard Line:** A Bayesian would treat Study B as having a lower prior probability on the specific hypothesis tested (due to the "garden of forking paths"), or would demand a more skeptical prior. They wouldn't call it "uninformative"; they would say it provides weak evidence.
  *   **Fixed $\alpha$ Thresholds:** These would vanish. Decisions would be based on expected loss/utility.
  *   **Power Analysis:** Replaced by **Prior Predictive Checks**. You wouldn't ask "what N gives 80% power"; you would ask "does my prior predict data that looks like reality?"

  **What would remain (but change):**
  *   **Pre-registration:** It would remain useful, not for *validity*, but for **prior specification**. It locks in the prior before seeing the data, preventing "prior hacking."
  *   **SESOI (Smallest Effect Size of Interest):** This actually fits *better* in a Bayesian/Decision-Theoretic framework. In NHST, SESOI is awkward (Equivalence Testing). In Bayesian terms, SESOI defines the **Region of Practical Equivalence (ROPE)**. This is a natural fit.
  *   **Replication:** A Bayesian would simply update the prior from Study A with the data from Study B. There is no "failed replication" binary, just a posterior that shifts back toward zero.

  **The Verdict:** Your current rules are **Frequentist controls** designed to mimic **Bayesian caution**. We use Frequentist tools because they are objective (no priors to fight over), but we interpret them with Bayesian intuition (e.g., treating a replication null as evidence of absence).

  ### 4. The Replication Paradox: Non-significance as "Can't Say" vs. "Damning"
  **The Commitment:** This is not a logical inconsistency; it is a **Decision-Theoretic Asymmetry** smuggled into a Frequentist framework.

  *   **Original Study ($p = .21$):** Treated as "inconclusive."
      *   *Why:* The prior probability of the effect was low (it's a new claim). The cost of a False Positive is high (polluting the literature). The study is likely underpowered to detect small true effects. Therefore, $p > .05$ is ambiguous: it could be $H_0$ is true, or $H_1$ is true and we missed it.
  *   **Replication Study ($p = .40$):** Treated as "failed."
      *   *Why:* The prior probability is now higher (because the original claimed it existed). However, the replication is usually designed with the *original effect size* in mind. If the original effect was real, the replication should have seen it.
      *   *The Hidden Logic:* We implicitly assume the original effect size estimate was inflated (Regression to the Truth). If the replication is well-powered to detect the *original* estimate and finds $p = .40$, it suggests the original was a False Positive or grossly inflated.

  **Is there a single story?**
  Yes, but it requires admitting we are doing **Sequential Belief Updating**.
  1.  **Discovery Phase:** We require high severity to *establish* a claim. A null result lacks severity (could be low power).
  2.  **Replication Phase:** We are testing the *robustness* of the claim. A null result here has high severity *against the claim* because the claim asserts the effect is robust enough to be seen again.

  **The Inconsistency:** The inconsistency lies in using $p$-values to do this. $p$-values measure compatibility with $H_0$, not evidence for $H_1$ vs $H_0$. To make the replication logic work, you need to treat the replication as an **Equivalence Test** (TOST). If the CI in the replication excludes the SESOI, you have evidence of absence. If you just look at $p > .05$, you logically cannot claim "failure." Your colleagues are right to resist, but their resistance is methodological conservatism; the logic *requires* Equivalence Testing to hold water.

  ### Summary for Your Committee Report
  You need to write a paragraph that justifies the reforms without exposing the philosophical cracks. Here is the reconstruction of the "Official Story" vs. the "Real Story."

  **The Official Epistemology (What you write):**
  > "We adopt these reforms to ensure the **severity** of our tests. Pre-registration and fixed sample sizes ensure that our error rates are controlled and that null results can be interpreted as evidence of absence rather than lack of power. This aligns our methods with the goal of cumulative science, where findings are robust to replication."

  **The Real Epistemology (What you know):**
  1.  **Evidence is Procedural:** We value the *guarantee* of the method over the *content* of the data (A vs. B).
  2.  **Frequentist Tools, Bayesian Goals:** We use $p$-values to control long-run error, but we interpret replications as belief updates.
  3.  **SESOI is the Bridge:** Requiring a Smallest Effect Size of Interest is the only way to make "evidence of absence" logically valid in a Frequentist framework (via Equivalence Testing). Without it, we are inconsistent.
  4.  **Inheritance:** The ban on optional stopping is 1930s Fisher/Neyman-Pearson. The demand for pre-registered nulls as "findings" is 2010s Reform. They are stitched together with the needle of **Research Integrity** (i.e., "trust but verify").

  **Recommendation:**
  If you want consistency, push for **Equivalence Testing (TOST)** alongside pre-registration. That resolves the "evidence of absence" issue logically. If you stick with standard NHST, you must admit that Study A's null result is only "publishable" because we trust the process, not because the data speak louder than Study B's.

  The view of evidence your package presupposes is **Institutional Reliabilism**: A finding is knowledge not because the data compel it, but because the community trusts the process that produced it. Study A is trustworthy; Study B is not. That is the entire justification.
