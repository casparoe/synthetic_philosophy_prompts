      *   *The Missing Bit:* Agent-Relativity. In traffic, a skipped phase is a skipped phase. In deontology, *my* skipping is worse than *your* skipping.
      *   *The Verdict:* Traffic logic reveals the "agent-centered" restriction as a category error in system design, suggesting deontology relies on a metaphysical distinction (the sanctity of the specific agent) that doesn't translate to physical coordination.

