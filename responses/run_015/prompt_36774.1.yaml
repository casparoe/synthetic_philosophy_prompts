answer: |-
  It is a pleasure to speak with someone who doesn't need the concept of convergence explained via apples or dollars. You are absolutely right to sense that the Pasadena Game (PG) is a more corrosive problem than the St. Petersburg Paradox (SPP), and your instinct about the Riemann Rearrangement Theorem is sharp, though the technical situation in decision theory is slightly more subtle than a simple reordering of a list.

  Here is the breakdown of why the Pasadena Game is widely considered by decision theorists (like Alan Hájek and Harris Nover) to be a strictly deeper pathology than St. Petersburg, why your skepticism about "reordering tosses" is mathematically justified but misses the measure-theoretic point, and why the standard "patches" feel like duct tape on a cracked foundation.

  ### 1. The Mathematical Distinction: Divergence vs. Undefined

  You correctly identified the series behavior, but let's formalize the distinction in terms of integration, which I suspect will feel more natural to you than series summation.

  In the **St. Petersburg Paradox**, the random variable $X$ has positive support. The expectation is the Lebesgue integral $\int X \, dP$. Since $X \ge 0$, the integral is well-defined in the extended real numbers; it simply equals $+\infty$.
  *   **Status:** The expectation *exists*, but it is infinite.
  *   **The Problem:** It conflicts with our intuition about finite rational pricing.

  In the **Pasadena Game**, the payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$ with probability $2^{-n}$. The contribution to the expectation is $a_n = \frac{(-1)^{n-1}}{n}$.
  *   **Status:** The expectation is **undefined**.
  *   **The Reason:** In measure-theoretic probability, $E[X]$ is defined if and only if $E[|X|] < \infty$ (absolute convergence). Alternatively, it is defined if one of the positive part ($E[X^+]$) or negative part ($E[X^-]$) is finite.
  *   In PG, $\sum |a_n| = \sum \frac{1}{n}$, which diverges. Both the positive terms and negative terms sum to infinity independently.
  *   Therefore, $E[X] = \infty - \infty$, which is undefined in standard analysis.

  **The Crucial Difference:** St. Petersburg breaks the *scaling* of utility (infinity is too big). Pasadena breaks the *arithmetic* of utility (the value doesn't exist). You can do arithmetic with $\infty$ in extended reals (mostly); you cannot do arithmetic with "undefined."

  ### 2. Is the Riemann Rearrangement Analogy Legitimate?

  You asked: *"Nobody actually re-orders the tosses of a single gamble... so is the 'rearrangement' business even a legitimate move here?"*

  Your skepticism is physically correct but mathematically surmountable. In a single play of the game, nature picks an $n$, and you get the payoff $X_n$. There is no temporal sequence of adding up terms. So why does rearrangement matter?

  It matters because **Expectation is an aggregation over the sample space, not a temporal process.**

  When we define the expectation of a discrete random variable, we are summing over the partition of the sample space. The "natural order" ($n=1, 2, 3...$) is just one way to index that partition. If the expectation is not absolutely convergent, the value of the sum depends on how you group or index the partition elements.

  Think of it like integrating a noisy signal over a domain. If the signal is absolutely integrable, it doesn't matter how you slice the domain (Riemann sums, Lebesgue sets, coordinate transformation); you get the same power. If the integral is only conditionally convergent, the "total power" you calculate depends on the coordinate system or the order in which you sum the bins.

  The Riemann Rearrangement Theorem is used in the literature as a *reductio ad absurdum*. It demonstrates that if we allow conditionally convergent expectations, we lose **invariance**. If I describe the same gamble to you using a different indexing of the outcomes (mathematically permissible isomorphisms of the sample space), I can convince you the expected value is $\ln 2$, or $100$, or $-\infty$.

  So, while you don't "reorder tosses" in time, the lack of absolute convergence means the *value of the gamble* is not an intrinsic property of the probability distribution; it is an artifact of how you chose to write down the sum. For a physicist or astronomer, this is unacceptable. A signal's power shouldn't depend on the order you read out the pixels.

  ### 3. Which is Worse: Infinite or Undefined?

  Your gut is right: **Undefined is vastly more corrosive.**

  Here is why Pasadena breaks Expected Utility Theory (EUT) more severely than St. Petersburg:

  1.  **Dominance Principles:**
      *   In SPP, if Gamble A pays \$1 more than Gamble B in every outcome, $E[A] > E[B]$ holds (even if both are $\infty$, in the extended sense, or via dominance arguments).
      *   In PG, dominance can fail. There are constructions (related to the "Altadena" game, a variant of Pasadena) where Gamble A pays strictly more than Gamble B in every possible state, yet standard expectation theory cannot rank them because both expectations are undefined. If you can't say a strictly better gamble is preferable, decision theory has lost its normative force.

  2.  **Linearity:**
      *   EUT relies on linearity: $E[X + Y] = E[X] + E[Y]$.
      *   With infinite expectations (SPP), linearity holds with some care in extended reals.
      *   With undefined expectations (PG), linearity shatters. You can have two Pasadena-style gambles where $E[X]$ is undefined, $E[Y]$ is undefined, but $E[X+Y]$ is perfectly finite (because the negative terms of one cancel the positive terms of the other). Or vice versa. This makes portfolio theory impossible.

  3.  **The "Weak Expectation" Escape:**
      *   Some theorists (like Nover & Hájek) suggest using "weak expectation" (the limit of the average payoff over $N$ trials as $N \to \infty$). By the Law of Large Numbers, the average payoff of the Pasadena game *does* converge to $\ln 2$ almost surely.
      *   *However*, this only works if you play the game repeatedly. Decision theory is supposed to guide *single* choices. If you only play once, the Law of Large Numbers is irrelevant to you, yet the "value" $\ln 2$ is derived entirely from long-run behavior. This disconnects the value of the gamble from the single-case decision, which is the whole point of the theory.

  ### 4. Do the Standard Patches Fix Both?

  You asked if bounded utility or finite bankrolls fix both in one go.

  **Technically: Yes.**
  **Philosophically: It feels like cheating.**

  1.  **Bounded Utility:**
      *   If you impose a bounded utility function $U(x)$ (e.g., $U(x) = \arctan(x)$ or a hard cap), then $|U(X)| \le M$.
      *   Consequently, $\sum p_n |U(x_n)| \le \sum p_n M = M < \infty$.
      *   This forces absolute convergence. Both SPP and PG vanish. The expectation becomes finite and well-defined.
      *   *The Cost:* This implies there is a finite amount of good that can exist in the universe. No matter how many lives you save or how much energy you harness, you hit a utility ceiling. Many philosophers find this normatively repugnant (the "Repugnant Conclusion" adjacent issues).

  2.  **Finite Bankroll / Cutoff:**
      *   If the casino has finite money, the series becomes finite.
      *   *The Cost:* This turns a paradox about *rationality* into a fact about *liquidity*. It solves the math but dissolves the philosophical problem. We want to know what is rational to believe about the value, not what the casino can afford to pay.

  **Are they separate repairs?**
  No, bounded utility is a "nuclear option" that fixes everything by restricting the domain of the theory. But if you want to keep unbounded utility (to allow for the possibility that saving a billion lives is better than saving one), SPP is annoying, but PG is fatal.

  There are more nuanced repairs, such as **Relative Expectation Theory** (comparing the difference between gambles rather than absolute values) or **Decision Theory based on Stochastic Dominance** rather than Expectation. But these require rewriting the axioms of EUT, not just patching the utility function.

  ### Summary for the Astronomer

  Think of St. Petersburg as a signal that saturates your detector. The voltage is too high, it goes off the scale. You know the signal is "huge," but you can't quantify it linearly. You can fix this by changing your gain (bounded utility).

  Think of Pasadena as a signal where your baseline subtraction is unstable. You have positive spikes and negative spikes. If you integrate them in the order they arrive, you get a number. If you sort the data by amplitude before integrating, you get a different number. The "total flux" is not a property of the source; it's a property of your data reduction pipeline.

  **Verdict:** Pasadena is the deeper embarrassment. St. Petersburg tells us that linear utility is unrealistic. Pasadena tells us that the very concept of "Expected Value" is mathematically ill-posed for a wide class of well-behaved probability distributions unless we impose absolute convergence (boundedness).

  If you have to choose which paradox keeps a decision theorist up at night: it's Pasadena. St. Petersburg is a problem of *magnitude*; Pasadena is a problem of *existence*. In science, "undefined" is always more worrying than "infinite."
