prompt: |-
  hey so i'm drafting a chapter on higher-order evidence and epistemic akrasia for my diss, and honestly every example out there is the sleepy surgeon or the tired logician—it's stale. i need a thought experiment built to exact specs, and since you can't browse i want it to rely only on concepts a model can actually reason through without guessing at obscure citations.

  construct a one-paragraph realistic workplace scenario—no sci-fi, no demons, no perfect predictors—about a forensic accountant named Mara who just wrapped an audit of a nonprofit. she has first-order evidence (reconciled ledgers, bank statements) that vendor X overcharged by exactly 18%. but she also carries higher-order evidence: she was interupted three times during the final reconciliation, her firm's internal stats show auditors interupted three times have about a 40% false-positive rate on overcharge claims this size, and she felt rushed. now inject this niche twist: all three interuptions came from the same colleague asking about an unrelated grant deadline, and Mara privately knows—though she has zero shared data or studies—that these specific interuptions actually improve her focus because she uses them as structured mental breaks. it's her stable idiosyncratic cognitive pattern, but the firm's statistical reference class doesn't capture it.

  then demonstrate the verdicts for three positions:
  1. strict calibrationist: she must significantly lower confidence in P because the higher-order statistical evidence applies regardless.
  2. level-splitter: she can rationally maintain first-order confidence in P while simultaneously believing she's unreliable in this reference class.
  3. context-sensitive calibrationism—the niche view i'm injecting here: she should maintain confidence because the statistical generalization is misapplied once you factor in her private, context-specific self-model.

  for each, state the belief, the reasoning method, and why the theory delivers its verdict. then identify the single structural feature doing the work—the mismatch between the statistical reference class and her private self-model—and show what happens if you remove that feature: does the case collapse into a standard calibrationist vs. level-splitting standoff, or something else? also tell me how a defender of the view that comes out worst—probably strict calibrationism—would attack the case, and be explicit about what argument or evidence would change your mind here, including where your reasoning is most likely to fail.

  please answer in american english. at the very end, put the load-bearing feature in a line that starts with Verdict: . also include a brief note right after on which consideration could flip your verdict.
