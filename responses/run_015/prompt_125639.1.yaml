answer: |-
  Mara, a forensic accountant, has just finalized an audit of a nonprofit where reconciled ledgers and bank statements constitute first-order evidence that Vendor X overcharged by exactly 18%. However, she possesses higher-order evidence that typically undermines such findings: she was interrupted three times during the final reconciliation, her firm's internal statistics indicate auditors interrupted three times have a 40% false-positive rate on overcharge claims of this size, and she subjectively felt rushed. The critical twist is that all three interruptions came from the same colleague asking about an unrelated grant deadline, and Mara privately knows—though she possesses zero shared data or studies to prove it—that these specific interruptions actually improve her focus because she uses them as structured mental breaks, a stable idiosyncratic cognitive pattern that the firm's statistical reference class fails to capture.

  **1. Strict Calibrationism**
  *   **Belief:** Mara must significantly lower her confidence that Vendor X overcharged.
  *   **Reasoning Method:** Objective statistical evidence overrides subjective self-assessment.
  *   **Why:** This theory holds that higher-order evidence about one's reliability functions as a defeater regardless of private intuition. Since the firm's stats objectively place her in the "interrupted three times" reference class, she is rationally required to calibrate her confidence to the base rate (40% error), treating her private feeling that the breaks helped as potentially compromised by the very impairment she is assessing.

  **2. Level-Splitting**
  *   **Belief:** Mara can rationally believe Vendor X overcharged (first-order) while simultaneously believing she is unreliable in this context (higher-order).
  *   **Reasoning Method:** Segregation of evidential levels.
  *   **Why:** This view permits epistemic akrasia. The first-order evidence (ledgers) supports the claim, while the higher-order evidence (firm stats) supports the claim that she is unlikely to be right. There is no requirement to reconcile the two into a single credence; she can hold that *P* is true even while believing her belief in *P* is formed unreliably.

  **3. Context-Sensitive Calibrationism**
  *   **Belief:** Mara should maintain high confidence in the overcharge claim.
  *   **Reasoning Method:** Reference class refinement via private self-modeling.
  *   **Why:** This view argues that statistical generalizations are defeasible when the agent possesses specific evidence that they fall outside the relevant causal mechanism of the generalization. Because Mara knows the interruptions function as focus aids for her specifically, the firm's statistic (which aggregates all interruptions) is misapplied. Her private evidence narrows the reference class to "auditors interrupted by helpful breaks," for which the 40% error rate does not hold.

  **Structural Feature and Removal**
  The single structural feature doing the work is the **mismatch between the objective statistical reference class and the agent's private causal self-model**. The firm's data tracks "interruptions" as a uniform negative variable, while Mara's self-knowledge identifies a specific subclass of interruptions that function positively. If you remove this feature—meaning Mara does not know the interruptions help her, or they objectively do not help her—the case collapses into a standard standoff between Strict Calibrationism and Level-Splitting. Without the private causal insight, she is simply a member of the impaired reference class, and the Context-Sensitive view loses its foothold for overriding the base rate.

  **Attack on Strict Calibrationism and Mind-Changing Conditions**
  A defender of Strict Calibrationism would attack this case by arguing that Mara's private self-model is itself suspect under the weight of the higher-order evidence. They would contend that if interruptions generally impair judgment, they likely impair the judgment used to assess whether the interruptions were helpful; thus, her confidence in the "helpful break" theory is unwarranted without independent verification. To change my mind on the superiority of the Context-Sensitive view here, I would need evidence that Mara's self-assessment track record is actually poor in these specific scenarios—for instance, if data showed she *felt* more focused after such breaks but still produced errors at the 40% rate. My reasoning is most likely to fail if I underestimate the corrosive nature of higher-order evidence: if the HOE is strong enough, it may defeat not just the first-order belief, but also the second-order belief that one is an exception to the rule.

  Verdict: The mismatch between the statistical reference class and the private causal self-model.
  Note: Empirical data showing Mara's accuracy actually drops despite her feeling of improved focus would flip this verdict.
