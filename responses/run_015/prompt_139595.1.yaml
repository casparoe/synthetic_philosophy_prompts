answer: |-
  Here is a draft question, model answer, and marking scheme tailored to your specifications. I have kept the language accessible to second-year students while ensuring the "crux" you identified is the central hurdle for high marks.

  ### Exam Question

  **Module:** Philosophy and Political Economy
  **Topic:** David Hume, *Political Discourses* (1752)
  **Time Allowed:** 90 Minutes (Take-Home)
  **Word Limit:** Approx. 800 words

  **Question 1**

  **(a)** Outline Hume's price-specie flow mechanism. Why does he consider this mechanism fatal to the mercantilist project of hoarding money? **(5 marks)**

  **(b)** Hume admits that an influx of money stimulates industry and labour *before* prices fully adjust. Given Hume's wider philosophical commitment to the power of 'habit' and 'custom' in human psychology, does this temporary stimulation merely return the nation to its original state, or can it leave a permanent improvement? Discuss whether there is a tension between Hume's economic equilibrium and his moral psychology. **(15 marks)**

  ***

  ### Model Answer (600–700 words)

  In *Of Money* and *Of the Balance of Trade*, Hume dismantles the mercantilist identification of money with wealth. His price-specie flow mechanism argues that money is merely the "oil which renders the motion of the wheels more smooth." If a nation successfully hoards gold, the domestic money supply increases. Initially, this creates prosperity, but as more money chases the same quantity of goods, domestic prices rise. Consequently, the nation's exports become dearer to foreigners, while imports become cheaper for locals. The balance of trade turns against the hoarding nation, and the excess gold flows out to neighbours until prices and specie levels equalise globally. Thus, trying to permanently hoard money is like trying to hold back the tide; the equilibrium of trade self-corrects.

  However, the mechanistic nature of this flow conceals a vital dynamic: the time interval between the arrival of money and the rise of prices. Hume explicitly notes that during this interval, the "spirit of industry" is quickened. Merchants have more capital, labourers are employed, and production expands before inflation erodes the competitive advantage. For a strict mercantilist, this interval is the goal; for Hume, it is usually a transient phase on the way to equilibrium.

  This raises a critical question regarding the permanence of these gains. If money is neutral in the long run, affecting only prices and not real variables, then the stimulation of industry is merely a transient blip. Once the gold flows out, the nation returns to its prior state. This interpretation suggests Hume concedes the short-run to the mercantilists while defeating them on the long-run. It implies that policy can create a temporary sugar rush of activity, but no lasting structural change.

  Yet, this economic transience appears to conflict with Hume's moral psychology. In the *Treatise of Human Nature*, Hume argues that human character and social structures are built through custom and habit. Actions repeated become dispositions. If the influx of money wakes a population from slothfulness into industry, does that industry vanish when the gold leaves? If a labourer acquires a habit of diligence during the boom, they do not necessarily revert to idleness when wages normalise. Similarly, if manufacturers establish new techniques or trade routes during the interval, these real capacities may survive the monetary correction.

  Therefore, the tension between Hume's economics and psychology is resolvable if we view the "interval" not just as a price adjustment period, but as a historical opportunity. The money itself leaves, but the *effects* of the activity it funded may remain. Hume hints at this in *Of the Balance of Trade*, suggesting that a wise statesman might use the influx to cultivate arts and industry. If the stimulation creates a permanent increase in the nation's productive capacity (its "real" wealth), then the equilibrium is not a return to the *status quo ante*, but a settling at a higher level of output, albeit with the same relative price levels.

  Consequently, there is no fundamental contradiction. The economic mechanism describes the flow of specie, which is self-correcting. The psychological principle describes the flow of human behaviour, which is cumulative. The "neutrality of money" holds for prices, but not necessarily for the habits of the people. A nation that uses the interval wisely transforms a monetary transient into a permanent gain in industry. Thus, Hume does not merely concede the short run to the mercantilists; he repurposes it. The danger lies not in seeking gold, but in believing the gold itself is the end, rather than the industry it might momentarily spark.

  ***

  **^1 [Footnote for the Auditor]:** *In your control-theory terms: Part (a) describes the negative feedback loop. Part (b) asks whether the **transient response** during the **time lag** alters the system's parameters, or if the system simply returns to the original **steady state**. The model answer argues that 'habit' allows the transient to shift the steady state.*

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade Boundary Guide:**
  *   **16–20 (First):** Clear synthesis of economics and psychology; identifies the "interval" as a site of potential permanent change.
  *   **13–15 (2.1):** Accurate mechanism; identifies the interval but treats it mostly as temporary; limited engagement with 'habit'.
  *   **10–12 (2.2):** Accurate mechanism; describes the interval as purely temporary; ignores the psychology/habit tension. **(Bare recitation of the mechanism caps here).**
  *   **0–9 (Third/Fail):** Misunderstands the mechanism; confuses money with wealth; fails to address the prompt.

  **Five Must-Hit Points:**

  1.  **Accuracy of the Mechanism (4 marks)**
      *   *Requirement:* Correctly links Money Supply ↑ → Prices ↑ → Exports ↓ → Specie Outflow.
      *   *Common Error:* Claiming Hume thinks money *is* wealth, or that the gold stays in the country.
      *   *Differentiation:* A 2.2 student gets this right. A First student gets this right *concisely* to save space for part (b).

  2.  **Identification of the 'Interval' (4 marks)**
      *   *Requirement:* Explicitly notes that prices do not rise instantly; industry is stimulated *before* inflation hits.
      *   *Common Error:* Treating the adjustment as instantaneous; missing Hume's point about the "quickening" of labour.
      *   *Differentiation:* 2.2 students mention the interval. First students explain its *significance*.

  3.  **The Mercantilist Concession (4 marks)**
      *   *Requirement:* Acknowledges that if the gain is only temporary, Hume effectively agrees with mercantilists in the short run.
      *   *Common Error:* Assuming Hume thinks the stimulation is useless because it ends.
      *   *Differentiation:* 2.1 students see the tension. First students evaluate the consequence of that tension.

  4.  **Integration of 'Habit/Custom' (4 marks)**
      *   *Requirement:* Connects the economic interval to Hume's psychological view that habits stick.
      *   *Common Error:* Discussing economics without referencing Hume's philosophy of mind/custom.
      *   *Differentiation:* This is the primary separator between a 2.1 and a First. Ignoring this caps the mark at 12.

  5.  **Resolution/Synthesis (4 marks)**
      *   *Requirement:* Argues that while *money* flows out, *capacity/habit* may remain (shifting the equilibrium).
      *   *Common Error:* Concluding that there is an unresolvable contradiction in Hume's work.
      *   *Differentiation:* First-class answers resolve the tension; 2.1 answers leave it hanging.

  **Note on Modern Anachronisms (Fiat/Central Banks):**
  *   **Reward:** If the student uses modern examples (e.g., quantitative easing) strictly as a *structural analogy* to illustrate the time-lag or the distinction between nominal and real variables.
  *   **Penalise:** If the student critiques Hume for not knowing about fiat currency or assumes Hume's mechanism fails because we left the Gold Standard. Hume's logic applies to the quantity of money regardless of the substrate; historical ignorance is not a philosophical critique. Deduct 2 marks for historical confusion.
