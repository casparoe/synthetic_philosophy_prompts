      *   **Problem:** Career dilemma between two job offers.
          *   Offer A: Well-funded startup, predictive policing software, high pay, modern stack, career growth.
          *   Offer B: Small nonprofit, open-source tools for refugees/migrants, low pay, older tech, direct social good.
