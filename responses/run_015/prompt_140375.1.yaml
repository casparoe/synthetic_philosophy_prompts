prompt: |-
  I'm on the rotating duty-editor shift at a small public-health evidence service — twice a week, and three or four times a shift I have to write the one-line "bottom line" that sits on top of an evidence summary, in about ten minutes, and a second person has to sign it off before it goes up. The catch is that the same line is read by members of the public, by clinicians deciding what to do that afternoon, and gets lifted verbatim by reporters, so I can't tune how strong it is to one audience.

  Can you write me a procedure for deciding when it's OK to come out and state a claim, when to hedge it, and when to say nothing? Ground it in whatever philosophy of language actually says about the norms of assertion — knowledge vs. truth vs. reasonable belief vs. whatever else is on the table — but in a form someone with no philosophy and ten minutes can run. So: the questions in order, what counts as a good enough answer to each, where the procedure just returns "don't assert", and where it has to hand the decision to a person because it's a values call and not an epistemic one. Two wrinkles I'd like it to actually handle: (1) I'm usually speaking for the service, and I personally have not read the studies — so who is asserting, and whose epistemic position has to be good enough? (2) sentences that are true and that I do know, but which reporters will read as saying something stronger.

  Then run it on three: an n=200 preprint finding that a common supplement cuts hospitalisation; the same-day question "is this new variant spreading through the air?" where all we have is one small observational study; and a line about a booster rollout expanding next week that I know from an embargoed government briefing but can't give a reason for. Don't soften the second one — I have a feeling the procedure is going to tell me to shut up, and I want to know whether that really follows.

  Finally, say which steps are judgment calls dressed up as procedure, and where the whole thing will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Rotating duty-editor at a small public-health evidence service.
      *   **Task:** Write a one-line "bottom line" for evidence summaries.
      *   **Constraints:** ~10 minutes, signed off by a second person, read by public/clinicians/reporters (multi-audience), verbatim lifting by media.
      *   **Goal:** A procedure for deciding when to assert, hedge, or say nothing.
      *   **Foundation:** Philosophy of language norms of assertion (Knowledge Norm, Truth Norm, Reasonable Belief, etc.), but translated for non-philosophers.
      *   **Specific Wrinkles:**
          1.  Institutional assertion (speaking for the service, haven't read studies personally).
          2.  Implicature/Pragmatics (true sentences read as stronger claims by reporters).
      *   **Test Cases:**
          1.  n=200 preprint (supplement cuts hospitalization).
          2.  Same-day question (new variant airborne? one small observational study). *Constraint: Don't soften this one.*
          3.  Booster rollout (known from embargoed briefing, no public reason).
      *   **Meta-Analysis:** Identify judgment calls disguised as procedure and potential failure points.

  2.  **Philosophical Grounding (Internal Knowledge Retrieval):**
      *   *Norms of Assertion:*
          *   **Truth Norm:** Assert $p$ only if $p$ is true. (Problem: We rarely know truth with certainty in science).
          *   **Knowledge Norm (Williamson):** Assert $p$ only if you know $p$. (Problem: "Knowledge" is high bar, especially for institutional science which is probabilistic).
          *   **Justified Belief/Evidence Norm:** Assert $p$ only if you have sufficient evidence/justification for $p$. (Better fit for science).
          *   **Assertibility Conditions:** Gricean maxims (Quality, Quantity, Relation, Manner). Specifically, *Quality* (do not say what you believe to be false or lack adequate evidence).
          *   **Speech Act Theory:** The institution is the speaker, not the individual editor. The "epistemic position" belongs to the service's vetting process.
          *   **Implicature:** What is suggested vs. what is said. (The "reporter interpretation" problem).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Fast, actionable, 10-minute limit.
      *   *Structure:* Decision tree or checklist.
      *   *Step 1: Source Status.* Is the evidence public and vetted? (Addresses Wrinkle 1).
      *   *Step 2: Strength of Evidence.* Does the internal consensus support the claim? (Addresses Knowledge vs. Belief).
      *   *Step 3: Pragmatic Risk.* Will this be misinterpreted? (Addresses Wrinkle 2).
      *   *Step 4: Values/Policy.* Is this a policy decision masquerading as evidence? (Addresses the "hand off to person" requirement).

      *Refining the "Who is Asserting" issue:* The editor is a mouthpiece. The "Knower" is the Service. The procedure must verify the Service's epistemic position, not the editor's personal reading.
      *Refining the "Reporter" issue:* This is about *conversational implicature*. If I say "X is linked to Y," reporters hear "X causes Y." The procedure needs a "Misinterpretation Check."

  4.  **Developing the Steps (The "10-Minute Protocol"):**

      *   *Phase 1: Authority Check (Who speaks?)*
          *   Q: Is this claim backed by the Service's vetting process, not just my glance?
          *   Pass: Yes, summary is vetted.
          *   Fail: No (e.g., embargoed info, personal hunch). -> *Don't Assert.*

      *   *Phase 2: Epistemic Threshold (What do we know?)*
          *   Q: Does the evidence meet the "Actionable Certainty" threshold?
          *   Define thresholds:
              *   *Assert:* Systematic review/Meta-analysis or strong RCT.
              *   *Hedge:* Observational, small n, preprint, conflicting data.
              *   *Silence:* Anecdotal, single weak study, pure speculation.
          *   *Philosophy:* Shift from "Truth" to "Warranted Assertibility" (Dewey/Pragmatism).

      *   *Phase 3: The Headline Test (Implicature)*
          *   Q: If a reporter lifts this verbatim, does it imply causality/certainty we don't have?
          *   Tool: The "Therefore" Test. (Can you put "therefore" between the evidence and the claim?)
          *   If Yes -> Assert.
          *   If No -> Hedge or Silence.

      *   *Phase 4: The Values Handoff*
          *   Q: Does stating this cause harm even if true? (Panic, resource hoarding).
          *   This is not epistemic; it's ethical. -> *Hand to Senior Editor/Director.*

  5.  **Running the Test Cases:**

      *   *Case 1: n=200 Preprint (Supplement).*
          *   Authority: Preprint = not peer-reviewed. Service usually treats cautiously.
          *   Epistemic: n=200 is okay, but preprint is risky.
          *   Implicature: "Cuts hospitalization" implies causation.
          *   Result: Hedge heavily or Silence. Probably "Evidence suggests..." but risky. Let's see what the procedure says. Preprint + Causal claim = High risk. Procedure should likely say "Hedge" or "Don't Assert causality."
      *   *Case 2: Variant Airborne (One small obs study).*
          *   Authority: Service summary exists? Yes.
          *   Epistemic: One small study is weak for definitive transmission mode.
          *   Implicature: "Spreading through air" sounds definitive.
          *   Constraint: *Don't soften.* The prompt asks me to run the procedure and see if it tells me to shut up.
          *   Result: Procedure should trigger "Silence" or "Hedge so much it's useless." If I must not soften, I must assert or silence. Epistemically, silence is the honest output.
      *   *Case 3: Booster Rollout (Embargo).*
          *   Authority: I know it, Service doesn't officially vet it yet. Embargo means public justification is missing.
          *   Epistemic: I believe it's true, but public warrant is zero.
          *   Result: *Don't Assert.* (Violates Quality Maxim/Institutional Integrity).

  6.  **Refining the Philosophy for the User:**
      *   Avoid jargon like "illocutionary force." Use "What the sentence does."
      *   Use "Warranted Assertibility" but call it "Evidence Weight."
      *   Address the "Institutional Speaker" concept clearly.

  7.  **Addressing the Meta-Analysis (Judgment Calls & Failure Points):**
      *   Where does the procedure rely on human intuition? (Defining "small" study, judging reporter intent).
      *   Where does it misfire? (Emergencies where speed > precision, or when hedging renders the message useless).

  8.  **Final Review against Constraints:**
      *   10 minutes? Yes, checklist style.
      *   Philosophy grounded? Yes (Knowledge norm, implicature, institutional speech).
      *   Wrinkles handled? Yes (Institutional voice, reporter interpretation).
      *   Test cases run? Yes.
      *   Meta-analysis included? Yes.

      *(Self-Correction during drafting)*: Make sure I don't give a "maybe" on the second case. The prompt says "I have a feeling the procedure is going to tell me to shut up, and I want to know whether that really follows." I need to be decisive there. If the evidence is one small observational study, claiming airborne transmission is epistemically reckless for a public health body. The procedure *must* demand silence or extreme hedging. If the constraint is "don't soften," then silence is the only option. I will explain *why* it follows.

      *(Refining the "Institutional Assertion")*: The editor isn't the knower. The *Service* is. The editor is the transmitter. The check is: "Does the Service's process support this?" not "Do I believe this?"

      *(Refining the "Embargo")*: This is a classic "Truth vs. Warrant" case. It might be true, but you lack the *right* to assert it publicly yet. This touches on the *Norm of Assertion* regarding authority, not just truth.

      *(Final Polish)*: Ensure the tone is professional, direct, and usable under pressure.

  9.  **Drafting the Content:** (Mental Outline)
      *   Intro: Philosophy in plain English (Warranted Assertibility).
      *   The Protocol (4 Gates).
      *   The Test Cases.
      *   The Meta-Analysis (Where it breaks).

      *Let's write it.*
answer: |-
  ## The 10-Minute Assertion Protocol

  **Philosophical Grounding:** This procedure is based on the **Norm of Warranted Assertibility**. In public health, "Truth" is often unknowable in real-time. "Knowledge" (in the strict philosophical sense) is too high a bar for emerging science. Instead, you are asserting that *the Service's vetting process warrants this claim.* You are not the speaker; the Service is. You are the mouthpiece. Your job is to ensure the Service's epistemic position matches the strength of the sentence.

  **The Goal:** Prevent "Epistemic Overreach" (saying more than the evidence allows) and "Pragmatic Misfire" (saying something true that is understood as something false).

  ### The Procedure (4 Gates)

  Run these four checks in order. If you fail a gate, follow the exit instruction. Do not proceed to the next gate unless you pass.

  #### Gate 1: The Authority Check (Who is Speaking?)
  *   **Question:** Is this claim derived *exclusively* from evidence the Service has formally processed and vetted?
  *   **The Standard:** You cannot assert based on personal knowledge, embargoed briefings, or external data the Service hasn't synthesized. The "Knower" is the Service, not you.
  *   **Pass:** Yes, the summary before me is the source.
  *   **Fail:** No (e.g., I know this from a briefing, a tweet, or a paper I read personally).
  *   **Exit:** **DO NOT ASSERT.** (Write: "No current evidence summary available" or similar).
  *   **Why:** Violates the *Institutional Norm of Assertion*. You lack the authority to bind the Service to a claim it hasn't vetted.

  #### Gate 2: The Evidence Weight Check (What is the Warrant?)
  *   **Question:** Does the study design support the *modality* of the claim (Causal vs. Associative vs. Speculative)?
  *   **The Standard:**
      *   **Assert (Definitive):** Systematic reviews, large RCTs, consensus guidelines. -> *Use "Does/Is/Will".*
      *   **Hedge (Probabilistic):** Observational studies, small RCTs, preprints, single-site data. -> *Use "Suggests/May/Linked to".*
      *   **Silence (Insufficient):** Anecdotal, n<50, conflicting high-quality data, single observational study on complex mechanism. -> *Use "Evidence is inconclusive" or nothing.*
  *   **Pass:** The verb strength matches the study strength.
  *   **Fail:** The verb is stronger than the study (e.g., "Prevents" based on a preprint).
  *   **Exit:** **DOWNGRADE VERB** or **DO NOT ASSERT**.

  #### Gate 3: The Headline Test (Pragmatic Implicature)
  *   **Question:** If a reporter lifts this line verbatim as a headline, will it imply certainty we do not have?
  *   **The Standard:** Grice's Maxim of Quality. Do not say what implies a falsehood. If "X is linked to Y" will be read as "X causes Y," you must hedge the link or silence the claim.
  *   **Pass:** The sentence is robust to being stripped of context.
  *   **Fail:** The sentence relies on the surrounding summary to prevent misunderstanding.
  *   **Exit:** **REWRITE FOR ISOLATION** or **DO NOT ASSERT**.

  #### Gate 4: The Values Handoff (Ethical/Policy Risk)
  *   **Question:** Even if true and warranted, does asserting this create immediate public harm (panic, resource hoarding, stigma) that outweighs the benefit of information?
  *   **The Standard:** This is not an epistemic question. It is a utilitarian calculation.
  *   **Pass:** Benefit of information > Risk of harm.
  *   **Fail:** Risk of harm is significant/unclear.
  *   **Exit:** **HAND TO SENIOR EDITOR.** (This is a values call, not an evidence call).

  ---

  ### Running the Test Cases

  #### Case 1: n=200 Preprint (Supplement cuts hospitalisation)
  *   **Gate 1 (Authority):** Pass. (Assuming the Service has summarized the preprint).
  *   **Gate 2 (Evidence Weight):** **Fail.** Preprints are unpublished. n=200 is moderate. "Cuts" implies causality.
      *   *Correction:* Change "Cuts" to "Associated with reduced."
  *   **Gate 3 (Headline Test):** **Fail.** "Supplement associated with reduced hospitalisation" will still be lifted as "Supplement stops hospitalisation."
      *   *Correction:* Must add "Early evidence suggests..."
  *   **Gate 4 (Values):** Pass. (Generally low risk).
  *   **Final Output:** "Early, unpublished evidence suggests an association between [Supplement] and reduced hospitalisation, but confirmation is needed."
  *   **Verdict:** **HEDGE.** You cannot assert the claim verbatim.

  #### Case 2: New Variant Airborne? (One small observational study)
  *   **Gate 1 (Authority):** Pass. (Service summarized the study).
  *   **Gate 2 (Evidence Weight):** **Fail.** One small observational study cannot establish transmission mode definitively against existing consensus.
      *   *Correction:* You cannot use "Is spreading." You must use "Possible evidence of..."
  *   **Gate 3 (Headline Test):** **Fail.** "Possible evidence of airborne spread" will be lifted as "New Variant Confirmed Airborne."
      *   *Constraint Check:* You requested I **do not soften** this.
      *   *Procedure Logic:* If you cannot soften the language (Hedge) and the evidence does not support the definitive claim (Assert), the only remaining option in the protocol is **Silence**.
  *   **Gate 4 (Values):** High Risk. Panic/Behavior change based on weak data.
  *   **Final Output:** **DO NOT ASSERT.** (Line: "Current evidence is insufficient to determine transmission routes for the new variant.")
  *   **Verdict:** **SHUT UP.**
  *   **Why it follows:** Assertion requires warrant. You have a single, weak data point against a high-stakes question. To assert "Yes" is a lie (epistemically). To assert "Maybe" violates your "no soften" constraint. The only honest move left is to deny the presupposition that we know. The procedure forces silence because the cost of being wrong (public trust, panic) outweighs the value of a weak signal.

  #### Case 3: Booster Rollout (Embargoed Briefing)
  *   **Gate 1 (Authority):** **Fail.** You know this from a briefing, not from a Service-vetted evidence summary. The Service has not validated this claim.
  *   **Exit:** **DO NOT ASSERT.**
  *   **Verdict:** **SILENCE.**
  *   **Why it follows:** Even if the claim is *true* (Truth Norm), you lack the *warrant* to assert it publicly (Warranted Assertibility Norm). Asserting breaks the embargo and decouples the Service from its own verification process. You become a rumor mill, not an evidence service.

  ---

  ### Meta-Analysis: Where the Procedure Breaks

  You asked for the judgment calls dressed up as procedure and the failure points. Here they are:

  **1. The "Small Study" Judgment (Gate 2)**
  *   **The Disguise:** The procedure says "One small observational study = Silence/Hedge."
  *   **The Judgment:** What counts as "small"? Is n=500 small for a rare disease? Is "observational" fatal if the effect size is massive?
  *   **The Risk:** In a fast-moving crisis, waiting for "large RCTs" (Gate 2 Pass) might mean withholding life-saving info for months. The procedure is biased toward *specificity* (avoiding false positives) over *sensitivity* (catching true signals). It will misfire in "burning building" scenarios where acting on a hunch is better than waiting for proof.

  **2. The "Reporter Mind-Reading" (Gate 3)**
  *   **The Disguise:** "If a reporter lifts this..."
  *   **The Judgment:** You are guessing how a stranger will interpret your sentence. This is subjective. You might think "Linked to" is safe; a tabloid editor thinks "Linked to" means "Causes."
  *   **The Risk:** This gate can lead to "Hedging Fatigue." If you hedge everything to satisfy Gate 3, the bottom line becomes meaningless ("Some evidence might suggest possible links"). At that point, you are asserting nothing, which violates the *Maxim of Quantity* (be as informative as required).

  **3. The Institutional Voice (Gate 1)**
  *   **The Disguise:** "Service has formally processed."
  *   **The Judgment:** In a small team, "formal processing" might be you glancing at a spreadsheet for 5 minutes.
  *   **The Risk:** This creates a false sense of security. You might feel authorized to assert because you passed Gate 1, even if the "formal process" was thin. The procedure validates the *bureaucracy*, not necessarily the *epistemology*.

  **4. The Values Handoff (Gate 4)**
  *   **The Disguise:** "Hand to Senior Editor."
  *   **The Judgment:** This admits the procedure cannot solve the hardest problems.
  *   **The Risk:** If the Senior Editor is unavailable (you are on duty, remember?), you are stuck. The procedure has no "Emergency Override." In a true emergency, you may need to assert on weaker evidence to prevent harm. The procedure has no mechanism for "Necessary Falsehoods" or "Best-Guess Guidance."

  **Summary of Failure Mode:**
  The procedure is designed for **Trust Preservation**, not **Crisis Management**. It will correctly tell you to shut up on the variant (Case 2) and the embargo (Case 3). It will correctly hedge the supplement (Case 1). But if the variant *is* airborne and people die because you stayed silent, the procedure protected your epistemic integrity but failed the public health mission. That is the trade-off. You cannot optimize for both truth and utility in ten minutes. This protocol optimizes for truth.
