      *   **Specific Objection:** Wine produces *fearlessness/confidence*, not *fear*. How can it test *courage* if it doesn't simulate the actual stimulus (fear)?
      *   **Task:** Explain Plato's argument as intended, then evaluate it from a modern rationalist perspective (accept, refine, resist).
