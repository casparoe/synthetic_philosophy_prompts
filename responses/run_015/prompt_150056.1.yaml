answer: |-
  This procedure classifies most "denial" as manageable information or avoidance issues, forcing junior staff to escalate any case requiring a values-based confrontation about truthfulness or group dynamics.

  ### The Decision Procedure

  **Step 1: The Contradiction Test**
  *   **Question:** Is there objective evidence (lab result, direct observation, third-party report) that contradicts the client's specific factual claim?
  *   **Good Enough Answer:** Yes (e.g., tox screen positive vs. "I didn't use"); No (e.g., "I can stop" vs. current use without prior failure history).
  *   **If No:** **STOP.** Do not label this denial. Treat as a difference in risk assessment or goals. Junior staff proceed with motivational interviewing.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: The Access Test**
  *   **Question:** Did the client possess or have easy access to this contradicting evidence at the time they made the claim?
  *   **Good Enough Answer:** Yes (results mailed home, witnessed use); No (results held by clinic, event occurred during blackout).
  *   **If No:** **STOP.** Label: *Information Gap*. Action: Provide the information clearly. Junior staff handle.
  *   **If Yes:** Proceed to Step 3.

  **Step 3: The Avoidance Test**
  *   **Question:** Is the client currently taking active steps to prevent receiving or acknowledging this evidence now or in the future?
  *   **Good Enough Answer:** Yes (proxy pick-up, skipping appointments, changing phone number); No (accepts mail, attends appointments).
  *   **If Yes:** **STOP.** Label: *Strategic Ignorance*. Action: Confront the avoidance behavior, not the truth claim. Junior staff handle.
  *   **If No:** Proceed to Step 4.

  **Step 4: The Memory Test**
  *   **Question:** Does the claim rely on recall of events during periods of intoxication, blackout, or severe withdrawal?
  *   **Good Enough Answer:** Yes ("I don't remember that night"); No (claim covers sober periods).
  *   **If Yes:** **STOP.** Label: *Confabulation*. Action: Treat as cognitive reliability issue, not dishonesty. Junior staff handle.
  *   **If No:** Proceed to Step 5.

  **Step 5: The Social Script Test**
  *   **Question:** Is this claim identical to narratives used by peers in the client's current social or treatment group, where individual adherence varies but the script is shared?
  *   **Good Enough Answer:** Yes (multiple clients using same phrasing logic); No (idiosyncratic explanation).
  *   **If Yes:** **STOP.** Label: *Shared Narrative*. Action: **Escalate to Clinical Lead.** (Values call on group dynamics vs. individual treatment).
  *   **If No:** Proceed to Step 6.

  **Step 6: The Capacity Test**
  *   **Question:** If the claim is about ability ("I can stop"), is there historical evidence of them doing exactly that for >30 days?
  *   **Good Enough Answer:** Yes (verified prior abstinence); No (no verified history of stopping).
  *   **If Yes:** **STOP.** Label: *Accuracy on Capacity/Willpower Issue*. Action: Drop denial framing. Focus on maintenance triggers. Junior staff handle.
  *   **If No:** **STOP.** Label: *Disputed Reality*. Action: **Escalate to Clinical Lead.** (Values call on confrontation intensity).

  ***

  ### Case Applications

  **Case 1: The Positive Screen & The Brother**
  *   **Step 1 (Contradiction):** Yes. Lab says positive; client says error.
  *   **Step 2 (Access):** Yes. Client knows the test was done and suspects the result.
  *   **Step 3 (Avoidance):** Yes. Client asked brother to pick up results to avoid opening the portal.
  *   **Result:** **Strategic Ignorance.**
  *   **Action:** Junior staff confront the avoidance behavior ("You are arranging not to know the result") rather than arguing about the lab's accuracy. No escalation needed.

  **Case 2: "I Can Stop Any Time" (The Unliked Answer)**
  *   **Step 1 (Contradiction):** **No.** The claim is "I can stop." The evidence is "Has stopped for 3 months twice." The evidence supports the claim. Current use contradicts "I am stopped," not "I can stop."
  *   **Result:** **STOP.**
  *   **Action:** Junior staff are prohibited from labeling this denial. The client is telling the truth about capacity. The clinical problem is sustainability, not insight. You must drop the denial framing and treat the gap between capacity and execution as a skills or trigger issue. If staff insist this is denial, they are arguing philosophy, not facts.

  ***

  ### What This Procedure Can't Do

  1.  **Resolve Values Conflicts:** It identifies when a values call is needed (Steps 5 & 6) but does not make the call. It cannot tell you how hard to lean on a client who is likely lying; it only tells you that junior staff shouldn't decide that.
  2.  **Validate Objective Evidence:** It assumes the lab result or third-party report is correct. It cannot adjudicate chain-of-custody disputes.
  3.  **Diagnose Motivation:** It distinguishes avoidance from ignorance, but it cannot tell you *why* the client is avoiding (fear, shame, manipulation).
  4.  **Fix Group Dynamics:** It flags the "Shared Narrative" case but offers no protocol for breaking it without Lead intervention.
  5.  **Override Clinical Risk:** If a client passes all steps (e.g., truthful about capacity) but is still high-risk, this procedure doesn't change the treatment plan; it only changes the label.
