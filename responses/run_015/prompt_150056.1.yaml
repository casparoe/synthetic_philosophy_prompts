      - Yes: Label "Accuracy on Capacity/Willpower Issue". Action: Drop denial framing. Focus on maintenance triggers. Stop. (Junior staff can handle).
      - No: Label "Disputed Reality". Action: Escalate to Clinical Lead. (Values call on confrontation intensity).

