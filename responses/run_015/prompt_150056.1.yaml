prompt: |-
  I'm a senior counsellor at an outpatient addiction clinic and I chair the weekly conference where we decide what to do about what clients tell us about their own use — "I can stop whenever I want", "the test must be wrong", "I only drink when things are bad and things are fine now". About a dozen a week, ten or fifteen minutes each, junior staff with no philosophy background have to be able to run it, and anything that changes a treatment plan gets signed off by the clinical lead. So I want a decision procedure, not an essay on denial.

  The problem is we use "in denial" for about six different states and it matters which one it is: the client knows and is lying to us; the client knows and simply can't act on it (ordinary weakness of will, nothing wrong with their beliefs); the client has arranged not to find out — skipping the blood draw, getting their partner to pick up the results and not tell them; the client genuinely never had the information; and the client is filling a gap (blackouts, fuzzy memory) with a story that isn't especially motivated by anything. I want steps that separate those and say what follows: when we push, when we drop it and move on, when we go and get more evidence, and when we stop and hand it to the lead because what's left is a values call about how hard to lean on someone.

  Two constraints from what I've read about self-deception, which I want baked in rather than footnoted: it doesn't have to be something the person decided at some point, so no hunting for the moment they chose to fool themselves — look at what's sustaining the not-knowing right now; and once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it. There's also a case I don't know what to do with: two of our groups have converged on a shared line ("none of us really has a problem, the clinic exaggerates") that nobody seems to hold on their own. Treat that as a case the procedure has to handle, not a footnote.

  Give me the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it stops because the question is values and not facts. Then run it on two real cases: (1) a client with a positive screen who insists the lab mixed up the samples and has now asked his brother, who he lives with, to pick up his results so he never has to open the portal; (2) a client who says "I can stop any time, I've done it before" — and has in fact stopped for three months twice, whose use is down a lot but not zero, and who the junior staff all want to call denial. That second one, please give me the answer I won't like even if it means we drop the denial framing. And tell me straight what the procedure can't do.

  No preamble: lead with your bottom line in the first sentence, then the reasoning.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Senior counsellor at an outpatient addiction clinic. Chairs weekly conference.
      *   **Task:** Create a decision procedure (algorithm/flowchart style) for junior staff to categorize client statements about use ("denial" types) and decide actions (push, drop, get evidence, escalate to lead).
      *   **Constraints:**
          *   No philosophy essays; actionable steps.
          *   Distinguish 5 specific states of "denial": Lying, Weakness of Will, Strategic Ignorance, Lack of Information, Confabulation (memory gaps).
          *   Bake in self-deception constraints: No hunting for origin moment (focus on current sustenance), cannot use client's word as evidence once credibility is doubted.
          *   Handle the "Group Conspiracy" case (shared narrative among clients).
          *   Output format: Bottom line first sentence, then reasoning/procedure, then apply to two specific cases.
          *   Case 2 requirement: Give the answer the user won't like (even if it means dropping the denial framing).
          *   Tell straight what the procedure can't do.
          *   No preamble.

  2.  **Deconstruct the "Denial" States:**
      1.  *Lying:* Client knows, intends to deceive.
      2.  *Weakness of Will (Akrasia):* Client knows, intends to stop, fails to act. Beliefs accurate.
      3.  *Strategic Ignorance:* Client arranges not to know (skipping tests, proxy pick-up).
      4.  *Lack of Information:* Client genuinely doesn't know (never told, forgot).
      5.  *Confabulation:* Client fills memory gaps (blackouts) without malicious intent.
      6.  *Group Conspiracy:* Shared narrative sustaining the not-knowing.

  3.  **Develop the Decision Procedure (The Algorithm):**
      *   Need a sequence of questions.
      *   Need clear "Stop" conditions (No, Escalate, Action).
      *   Need to respect the constraint: Once we doubt self-report, we can't use self-report as evidence of the doubt.
      *   Need to handle the Group Case.

      *Drafting Steps:*
      *   Step 1: Verify Evidence. (Is there objective data contradicting the claim?)
      *   Step 2: Check Information Access. (Does the client *could* know?)
      *   Step 3: Check Avoidance Behavior. (Are they actively preventing knowing?)
      *   Step 4: Check Memory/Consistency. (Is this about blackouts or general narrative?)
      *   Step 5: Check Social Sustenance. (Is this a group script?)
      *   Step 6: Determine Action (Push, Drop, Evidence, Escalate).

      *Refining for Constraints:*
      *   *Constraint:* "Once we've decided we can't take someone's word... we can't turn around and use their word as evidence about it." -> This means if we suspect lying/self-deception, we can't say "He says he's fine, but he's lying, so he's not fine." We need external markers.
      *   *Constraint:* "No hunting for the moment they chose." -> Focus on current maintenance behaviors.
      *   *Constraint:* "Group Conspiracy." -> Needs a specific check.

      *Proposed Flow:*
      1.  **Contradiction Check:** Is there objective evidence (labs, observations) contradicting the claim?
          *   No -> Drop "Denial" framing. Treat as belief/goal mismatch.
          *   Yes -> Proceed.
      2.  **Access Check:** Did the client have access to the contradicting information at the time of the claim?
          *   No (e.g., never got results) -> *Lack of Information*. Action: Provide info.
          *   Yes -> Proceed.
      3.  **Avoidance Check:** Is the client currently taking steps to prevent future access? (e.g., proxy pick-up, skipping tests).
          *   Yes -> *Strategic Ignorance*. Action: Confront avoidance behavior, not the truth claim.
          *   No -> Proceed.
      4.  **Memory Check:** Is the claim based on a period of intoxication/blackout?
          *   Yes -> *Confabulation*. Action: Treat as memory error, not lying.
          *   No -> Proceed.
      5.  **Capability Check:** Has the client demonstrated the ability to do what they claim (e.g., stop) recently?
          *   Yes (has stopped before) -> *Weakness of Will* (or accurate assessment of capacity).
          *   No (never stopped) -> Proceed.
      6.  **Social Check:** Is this claim identical to peers' claims in a way that suggests coordination or shared shielding?
          *   Yes -> *Group Conspiracy*. Action: Escalate to Lead (Values call on group dynamics).
          *   No -> *Lying/Deep Self-Deception*. Action: Escalate to Lead (Values call on confrontation intensity).

      *Wait, I need to make sure the "Weakness of Will" vs "Lying" distinction is clear.*
      If they say "I can stop" but haven't, is it lying or akrasia?
      If they say "I didn't use" but tested positive:
      - If they arranged not to know -> Strategic Ignorance.
      - If they know but say didn't -> Lying.
      - If they know, say didn't, but actually mean "I couldn't help it" -> Weakness of Will (but usually framed as "I slipped" not "I didn't use").
      The prompt says: "client knows and simply can't act on it (ordinary weakness of will, nothing wrong with their beliefs)". This usually manifests as "I want to stop" not "I didn't use".
      However, the prompt example is "I can stop whenever I want". This is a claim about *capacity*, not *history*.
      So:
      - Claim: "I didn't use." (Fact claim) -> Testable.
      - Claim: "I can stop." (Capacity claim) -> Testable by history.

      *Refining the Procedure for the Prompt's specific examples:*
      The prompt lists:
      1. Lying (knows, deceives).
      2. Weakness of Will (knows, can't act).
      3. Strategic Ignorance (arranges not to find out).
      4. Lack of Info (never had info).
      5. Confabulation (filling gaps).
      6. Group Conspiracy (shared line).

      *Procedure Steps:*
      1.  **Objective Contradiction:** Is there hard evidence (tox, observation) contradicting the specific claim?
          *   No -> Stop. Do not label denial. (Addresses Case 2 potentially).
          *   Yes -> Next.
      2.  **Information Access:** Did the client possess the evidence at the time of the claim?
          *   No -> *Lack of Information*. Action: Inform. Stop.
          *   Yes -> Next.
      3.  **Active Avoidance:** Is the client currently engineering ignorance (proxy pick-up, skipping)?
          *   Yes -> *Strategic Ignorance*. Action: Target avoidance behavior. Stop.
          *   No -> Next.
      4.  **Memory Integrity:** Is the claim reliant on recall during impaired states?
          *   Yes -> *Confabulation*. Action: Treat as cognitive deficit. Stop.
          *   No -> Next.
      5.  **Social Contagion:** Is this claim part of a shared script among peers currently in contact?
          *   Yes -> *Group Conspiracy*. Action: Escalate to Lead (Values: Group vs. Individual). Stop.
          6.  **Capacity vs. Intent:** Is the claim about *ability* ("I can stop") contradicted by *history* (never stopped), or is it about *action* ("I didn't use") contradicted by *labs*?
              *   If "I didn't use" + Labs + No Avoidance -> *Lying*. Action: Escalate to Lead (Values: Confrontation level).
              *   If "I can stop" + History of stopping -> *Accurate Capacity/Weakness of Will*. Action: Drop denial framing. Focus on triggers.
              *   If "I can stop" + No History -> *Lying/Deep Deception*. Action: Escalate to Lead.

      *Wait, Constraint Check:* "Once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it."
      This means if we suspect lying, we can't use their denial as proof of denial. We need external markers.
      Also: "anything that changes a treatment plan gets signed off by the clinical lead." -> So "Lying" and "Group Conspiracy" and "Values calls" must go to Lead. Junior staff handle Info, Avoidance, Confabulation, Weakness of Will.

      *Refining Case 2:* "I can stop any time... done it before... use down but not zero." Staff want to call denial.
      If they *have* stopped before, the claim "I can stop" is factually true regarding capacity. The issue is *sustainability*. Calling this denial is clinically useless and arguably wrong. The procedure should force staff to drop the denial label here. This is the "answer I won't like" (because it means admitting the client might be right about capacity, and the problem is something else).

      *Refining Case 1:* Positive screen, says lab mixed up, asks brother to pick up results.
      This is classic Strategic Ignorance. They know (or suspect) the truth but are engineering future ignorance.

      *Structure:*
      1.  Bottom Line Sentence.
      2.  The Procedure (Questions, Pass/Fail, Action).
      3.  Application to Case 1.
      4.  Application to Case 2.
      5.  Limitations (What the procedure can't do).

      *Drafting the Bottom Line:*
      The bottom line is that most "denial" is either an information deficit or an avoidance behavior, and only a minority requires a values-based confrontation that junior staff cannot authorize.

      *Drafting the Procedure:*
