      "Once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it."
      This applies mostly to Step 6 (Lying vs Deep Deception). If we are at Step 6, we already have objective contradiction (Step 1). So we aren't using their word as evidence of the contradiction. We are using their word to categorize the *type* of contradiction.
