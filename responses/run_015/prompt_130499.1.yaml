answer: |-
  The chamber hummed, a low-frequency vibration that settled in the marrow of everyone present. Elara sat at the adjudicator's dais, her hands resting on the haptic interface. Before her, the biometric feeds scrolled in vertical columns of green light. There were three subjects in the dock: Varrick, the principal; Kael, his subordinate; and the empty air where the obligation would soon hang.

  "State the purpose of the session," Elara said. Her voice was amplified, flat and devoid of inflection.

  Varrick stepped forward. He wore the heavy cuffs of the Audit, silver bands locking his wrists to the conductive rail. "Authorization and Pledge. Sector 4 resource allocation."

  "Proceed with the delegation," Elara commanded.

  Varrick turned to Kael. The protocol required the principal to empower the agent before the agent could bind the institution. Varrick cleared his throat. "I hereby authorize Kael to speak for the Directorate regarding the shipment of grain."

  Elara watched Varrick's feed. His pulse was steady. Cortisol levels nominal. The vocal stress analysis showed no deviation. He was sincere in the authorization. He *did* intend to give Kael the voice of the Directorate. The Audit chimed softly. A green lock icon appeared next to Varrick's name. The convention was satisfied. The power was transferred.

  Kael stepped into the focal zone. He was younger, his eyes fixed on the far wall. He raised his cuffed hands. "On behalf of the Directorate, I promise the grain will arrive by the next cycle."

  Elara's eyes flicked to Kael's feed. Heart rate elevated, consistent with the gravity of the oath. Pupil dilation normal. No micro-tremors in the vocal cords indicating deception. Kael believed he was making a valid promise. Kael believed the grain existed. Kael passed the Audit.

  A second green lock icon appeared next to Kael's name.

  The system chime sounded—the harmonic resonance of a binding contract. The obligation was formed. In the air between them, the holographic ledger updated: *Obligation Active.*

  Elara did not strike the gavel.

  "Adjudicator?" Varrick asked. His voice was smooth, but his eyes drifted to the exit.

  "There is a discrepancy in the chain," Elara said.

  "The Audit is clear," Varrick replied. "Authorization sincere. Pledge sincere. All conventional conditions met. The act is happy."

  "The agent's sincerity is verified," Elara said, tapping the interface. "The principal's authorization is verified. But the principal's intent regarding the *content* of the pledge is not audited. You authorized the speech, Varrick, not the truth of it."

  "I authorized the voice," Varrick corrected. "The voice spoke. The voice was clean. The institution is bound."

  Elara leaned forward. This was the abuse. The act had been performed, but the underlying thought—the commitment to the reality of the grain—was rotting in Varrick's mind. He knew the silos were empty. He had used Kael as a shield, knowing the boy's biometrics would pass while his own internal reservation remained hidden behind the delegation protocol. The system could not scan a thought that was never spoken.

  "If I certify this," Elara said, "the Directorate owes grain it does not possess."

  "Then the Directorate is in breach," Varrick said. "But the promise stands. That is the law of the Chamber. The word binds the flesh, not the flesh the word."

  Elara's finger hovered over the *Reject* key. To reject, she needed evidence of a misfire. A wrong word, a wrong person, a broken convention. But the convention was flawless. Varrick had the right to authorize. Kael had the right to speak. The words were correct. To reject it would be to override the Audit based on intuition. The system would flag *her* for corruption.

  "I invoke a Correction," Varrick said suddenly.

  Elara paused. "State the correction."

  Varrick stepped back into the focal zone. He raised his cuffed hands. "I declare that the previous authorization was voided by my own lack of intent. I speak now to annul the promise."

  The room went silent. This was the second-order performative. An attempt to use speech to undo the effects of prior speech by exposing the internal state.

  Elara watched the Audit. Varrick's biometrics spiked. He was sincere *now*. He truly wanted to annul the promise. He truly admitted he lacked intent. The green light flickered, searching for a convention to match the utterance.

  *Processing,* the system displayed.

  "Can you do that?" Kael whispered, looking at Varrick.

  "I am fixing the error," Varrick said. "I am aligning the record with the mind."

  Elara watched the system logic tree. The Chamber rules allowed for the retraction of promises only through mutual consent or fulfillment. There was no convention for "Retroactive Insincerity." To allow a speaker to void a contract by simply admitting they lied would render every promise in the chamber provisional. The Audit measured the sincerity of the *current* utterance, not the history of the past one.

  The system light turned amber. Then red.

  "Utterance rejected," the automated voice intoned. "Convention not found."

  Varrick frowned. "I am being sincere. The Audit confirms it."

  "You are sincere in your confession," Elara said, her voice hardening. "But there is no procedural mechanism to convert a confession of abuse into a nullification of act. You performed the authorization. The agent performed the pledge. The institution accepted. The inner state is irrelevant once the outer form is complete."

  "That makes the system a trap," Varrick snapped. "It binds me to a lie."

  "It binds you to your word," Elara said. "The Audit ensures you mean what you say *when you say it*. It does not allow you to say what you meant *after you said it*."

  Varrick's biometrics flared red. Frustration. Fear. He realized the architecture of the room was not designed to find truth, but to enforce stability. The promise was a brick. He had laid it. Now he wanted to un-lay it by claiming he didn't mean to lift it.

  "I demand a review," Varrick said.

  "Review denied," Elara said. She looked at the ledger. The obligation glowed steady gold. *Active.* "The original performative stands. It is classified as an Abuse, not a Misfire. The act was achieved. The obligation holds."

  She tapped the interface. The gavel struck itself, a magnetic thunk that echoed off the steel walls.

  "Directorate is bound to deliver the grain," Elara recited. "Failure to fulfill will result in asset seizure. Session closed."

  Varrick stood frozen, the silver cuffs humming against his skin. He had tried to speak the world back into a shape that favored him, to use language as an eraser. But the Chamber only accepted language as ink.

  Kael looked at his hands, then at Varrick. "We have to find the grain," the boy said.

  Varrick didn't answer. He stared at the holographic ledger, the green text burning into his retinas. He had engineered the loophole, trusting the gap between the mind and the mouth. But the mouth, once opened in the Chamber, swallowed the mind whole.

  Elara powered down the dais. The hum faded. The obligation remained, hanging in the air, heavy and real, independent of anyone's intent.
