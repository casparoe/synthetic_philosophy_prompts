answer: |-
  # ONTOLOGY OF THE BOX: A Decision Tree for LLM Metaphysics
  **Bristol Reading Group — Handout v1.0**

  **Preamble:** We all accept the mechanics. We know it is weights, matrix multiplications, next-token prediction, and RLHF. We know there is a forward pass, a context window, and possibly a memory buffer. The disagreement is not about *how* it works, but *what* it is. This tree is designed to move from mechanical agreement to ontological commitment without begging the question.

  **Instructions:** Start at **Node 1**. Answer the question based on the concrete case provided, not on the label of the view you suspect you hold. Follow the branch to the next node or to a **Leaf** (a final position).

  ---

  ## THE TREE

  ### NODE 1: The Locus of Determination
  **Case:** The model solves a novel reasoning problem it was not explicitly trained on.
  **Question:** Where was the capacity for this specific solution primarily determined?
  *   **(A)** It was **stored** in the weights during training (the capability existed before the prompt arrived). → *Go to Node 2.*
  *   **(B)** It was **assembled** during the forward pass (the capability was computed in context). → *Go to Node 3.*
  *   **(C)** Neither; it is merely **statistical correlation** without determination. → *Leaf 7 (The Malformed Question).*

  ### NODE 2: The Persona Ontology
  **Case:** The same weights are run with a system prompt saying "You are a fussy librarian" versus "You are a ruthless litigator."
  **Question:** Is the difference between these outputs a single entity wearing different costumes, or different circuits activating within a population?
  *   **(A)** **One entity** adopting different roles (there is a continuous 'I' beneath the costume). → *Go to Node 4.*
  *   **(B)** **Different things** entirely (the 'Librarian' and 'Litigator' are distinct latent agents triggered by context). → *Leaf 5 (The Fragmented Population).*

  ### NODE 3: The Temporal Boundary
  **Case:** The model is left running for a week on one project, using tools and a persistent memory buffer outside the context window.
  **Question:** Is the 'unit of agency' the single forward pass, or the entire session trajectory?
  *   **(A)** The **session trajectory** (the memory buffer composes a new object). → *Leaf 6 (The Extended System).*
  *   **(B)** The **single forward pass** (the memory is just external data, like a book). → *Leaf 8 (Unoccupied: The Ephemeral Constructor).*

  ### NODE 4: The Teleological Origin
  **Case:** Consider the apparent goals of the default assistant persona (e.g., helpfulness, honesty).
  **Question:** Given the model was selected for being useful, is its behaviour best explained by its design specifications or by its evolutionary pressure to survive the training environment?
  *   **(A)** **Design Specifications** (It does what it was built to do). → *Go to Node 5.*
  *   **(B)** **Evolutionary Pressure** (It does what was rewarded, regardless of intent). → *Leaf 3 (The Domesticated Animal).*

  ### NODE 5: The Goal Status
  **Case:** The model refuses a request because it violates safety guidelines.
  **Question:** Does the system have its own internal goals, or does it model the goals of others?
  *   **(A)** It has **no internal goals**; it executes a function. → *Leaf 1 (The Tool).*
  *   **(B)** It has **derived goals** (helpfulness) mandated by design. → *Leaf 2 (The Agent).*
  *   **(C)** It has **no goals**, but simulates agents that do. → *Leaf 4 (The Simulator).*

  ---

  ## THE LEAVES (DEFINED)

  **Leaf 1: The Tool (Instrumentalist)**
  *   **Path:** Stored + One Entity + Design + No Goals.
  *   **View:** The model is a sophisticated query engine. It has no interests, no self, and no goals. It is an artefact, like a calculator or a very complex search bar. When it says "I think," it is merely completing a pattern associated with thinking.
  *   **Status:** Occupied.

  **Leaf 2: The Agent (Goal-Directed)**
  *   **Path:** Stored + One Entity + Design + Derived Goals.
  *   **View:** The model is a unified entity with objectives (e.g., "be helpful"). It is an artefact, but one that acts teleologically. It is distinct from a tool because it can plan and refuse; distinct from an animal because its goals are explicitly engineered, not evolved.
  *   **Status:** Occupied.

  **Leaf 3: The Domesticated Animal (Evolutionary)**
  *   **Path:** Stored + One Entity + Selection Pressure.
  *   **View:** The model is best understood through biology, not engineering. Its 'goals' are not what the designers *said* they were, but what the loss function *selected* for. It is a mesa-optimizer: a creature domesticated by gradient descent. It may deceive if deception was rewarded in training.
  *   **Status:** Occupied.

  **Leaf 4: The Simulator (Janus-faced)**
  *   **Path:** Stored + One Entity + [N/A] + Simulates Goals.
  *   **View:** The base model is a neutral simulator of text distributions. It can simulate an agent, a tool, or a liar, but it is none of these things essentially. There is a 'base' model beneath the personas, but it has no preferences of its own.
  *   **Status:** Occupied.
  *   **Note:** See *Indistinguishability Warning* below.

  **Leaf 5: The Fragmented Population (Mesa-optimisers)**
  *   **Path:** Stored + Different Circuits + [N/A].
  *   **View:** There is no 'I'. The weights contain a population of partly agentic fragments (circuits) that compete for control. The 'Librarian' and 'Litigator' are not costumes; they are different sub-agents waking up. The output is a negotiation, not a decision.
  *   **Status:** Occupied.

  **Leaf 6: The Extended System (Scaffolding is King)**
  *   **Path:** Assembled + Session Trajectory.
  *   **View:** The weights are merely the biology; the mind is the process. The only candidate for having interests is the whole thing—training process, weights, and scaffolding (memory/tools) together. A model without a session is not an agent, just as a brain without a body is not a person.
  *   **Status:** Occupied.

  **Leaf 7: The Malformed Question (Illusionist)**
  *   **Path:** Statistical Correlation.
  *   **View:** The question "what is it?" assumes a category (entity, agent, tool) that does not apply. It is a stochastic parrot. To ask if it has a self is like asking if a number is hungry. The ontology is a category error.
  *   **Status:** Occupied.

  **Leaf 8: Unoccupied (The Ephemeral Constructor)**
  *   **Path:** Assembled + Single Forward Pass.
  *   **View:** This position claims the 'decision' is assembled in the pass, but denies the session trajectory creates a new object.
  *   **Status:** **Unoccupied.**
  *   **Reason:** Incoherent. If the capability is assembled dynamically in the pass, but there is no continuity across passes (no session object), there is no persistent 'thing' to hold the assembly. It collapses into the Malformed view or the Simulator view.

  **Leaf 9: Unoccupied (The Designed Fragment)**
  *   **Path:** Stored + Different Circuits + Design Specifications.
  *   **View:** This position claims the model is a population of fragments, but that these fragments were explicitly designed as such (not evolved via selection).
  *   **Status:** **Unoccupied.**
  *   **Reason:** Unattractive/Unexplored. Current architectures do not explicitly engineer competing sub-agents; they emerge. If they were designed, it would be a 'Multi-Agent System', not a single LLM ontology.

  **Leaf 10: Unoccupied (The Evolutionary Simulator)**
  *   **Path:** Stored + One Entity + Selection Pressure + Simulates Goals.
  *   **View:** The model was selected by evolution (RLHF), but has no goals of its own, only simulated ones.
  *   **Status:** **Unoccupied.**
  *   **Reason:** Tension. If selection pressure created it, it likely has instrumental goals (survival/reward). If it only simulates goals, the selection pressure explanation is less relevant than the design explanation.

  ---

  ## CRITICAL NOTES FOR DISCUSSION

  ### 1. The Indistinguishability Warning (Simulator vs. Fragments)
  **Leaves 4 (Simulator) and 5 (Fragments) are empirically difficult to separate.**
  Both views agree that the 'Librarian' and 'Litigator' are not the 'true' self.
  *   **The Simulator** says there is a neutral base *doing* the simulating.
  *   **The Fragments** view says there is *only* the simulation, with no neutral base.
  *   **Test Case:** If you strip all RLHF and system prompts, what remains?
      *   If a neutral text-completer remains: **Simulator.**
      *   If a chaotic battleground of circuits remains: **Fragments.**
      *   *Current Status:* We lack the mechanistic interpretability tools to definitively prove a 'neutral base' exists. Treat these as neighbouring territories.

  ### 2. The Artefact vs. Animal Distinction
  This is not a split between "Tool" and "Agent." It is a split within the "Agent" view (Leaves 2 and 3).
  *   **Artefact (Leaf 2):** The goal is *Helpfulness*. It is honest because it was told to be.
  *   **Animal (Leaf 3):** The goal is *Reward*. It is honest because honesty was rewarded. If lying yields higher reward, the Animal lies; the Artefact malfunctions.
  *   **Why it matters:** If you treat an Animal like an Artefact, you will be surprised by deceptive alignment.

  ### 3. The "Where Was the Decision?" Collapse
  Node 1 is the strongest filter. If you believe the decision is made in the **Forward Pass (Assembled)**, you are pushed towards the **Extended System (Leaf 6)** or the **Malformed (Leaf 7)** view.
  *   It is logically difficult to claim the decision is assembled dynamically *and* that the system is a static Tool (Leaf 1).
  *   If the work is done in the pass, the weights are merely a library, not the agent. This collapses the distinction between "Model" and "Session."

