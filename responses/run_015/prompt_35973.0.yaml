          *   *Question:* Does utility imply ontology?
          *   *Evidence:* Comparison to other theoretical posits (quarks, average taxpayer).
          *   *Predictions:* Deflationists say "Yes, utility is enough." Realists say "No, utility tracks reality but isn't constitutive of it."
      *   *Crux 2:* Fission/Fragmentation (The "Teleporter" or "Split-Brain" case).
