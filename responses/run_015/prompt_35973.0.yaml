      *   *Disagreement 2: Phenomenology/Experience.*
          *   Deflationist: "The feeling of unity is a user-illusion generated by the narrative."
          *   Realist: "The feeling of unity is a direct apprehension of the underlying entity."
      *   *Disagreement 3: Moral Status.*
          *   Deflationist: "Responsibility attaches to the narrative node because it's the only handle we have."
          *   Realist: "Responsibility attaches because there is a *someone* there to hold responsible."
      *   *Check:* Are these verbal? Maybe "Real" is the verbal dispute. I need to make sure the table highlights *why* they disagree (e.g., criteria for existence).

  5.  **Drafting Section 3: Cruxes (Moving the Needle):**
      *   *Goal:* What evidence would change minds?
