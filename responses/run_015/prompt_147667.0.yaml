answer: |-
  For an embedded agent—one whose information is partial, staged, and potentially causally efficacious—a principle linking credence to chance must function as a operational norm rather than a metaphysical analysis. Your demand for neutrality between Humean and non-Humean accounts is stringent. It is likely unsustainable. Specifically, neutrality regarding *undermining* clashes with the demand for a non-circular *admissibility* clause. If chances are Humean, future frequencies can undermine current chance facts; if non-Humean, they cannot. A principle that tolerates undermining requires an admissibility clause that excludes future information. A principle that forbids undermining assumes chances are metaphysically insulated. To remain neutral, the principle must accommodate undermining without presupposing it, but this renders the admissibility clause inherently unstable. You cannot have strict neutrality, non-circular admissibility, and tolerance for undermining simultaneously.

  Here are the adequacy conditions derived from your cases.

  **Measure-Zero:** In continuous spaces, exact outcomes have chance zero. A principle identifying credence with chance forces probabilistic incoherence (summing zeros to one). The principle must defer to *density functions* or conditional chances over intervals, not point values. Regularity (credence > 0 for possible outcomes) is not merely a taste; for an embedded agent who must learn from evidence, zero credence implies dogmatism. The principle must permit regular credences despite zero chances, likely by deferring to conditional chances given the finest partition available.

  **Action-Dependence:** When chances depend on the agent's act (e.g., maintenance efforts), the norm becomes a fixed-point constraint: credence should match the chance that obtains *given* that credence. The principle must not demand a unique solution. In some cases, multiple fixed points exist (panic vs. calm); in others, none. The demand for uniqueness is a prejudice inherited from static models. The norm should require coherence with *some* admissible fixed point, acknowledging that rationality may not dictate a single doxastic state in reflexive setups.

  **Relativized Chance:** An agent often knows chances conditional on setups but not her location within them. The principle must allow deference to chances relativized to self-locating information. The object of deference is not an unrelativized chance (which may not exist) but the chance conditional on the agent's locative proposition. If the agent cannot locate herself, the principle should defer to the weighted average of chances across possible loci, weighted by her credence in being at those loci.

  **Chance Gaps:** If a setup lacks a determinate chance at the time of deliberation, the principle owes no verdict. Principled silence is a correct description of the norm's scope, not a defect. The principle applies only when a chance fact obtains; requiring a verdict here would force the agent to treat indeterminacy as risk.

  **Aggregate without Single-Case:** If the agent knows reference class frequencies but lacks reason to posit single-case chances, the principle should refuse to apply. This distinguishes chance from frequency. The norm governs deference to *objective chance*, not statistical regularity alone. Applying it here would conflate epistemology with metaphysics.

  **Undermining:** Tolerance of undermining is not a genuine desideratum but an artefact of Humean metaphysics. However, if you insist on neutrality, the principle must not *preclude* undermining futures. If the principle forbids undermining, it rules out Humeanism. If it requires it, it rules out non-Humeanism. The adequate principle must allow the admissibility clause to filter undermining information if the metaphysics generates it, without building that filter into the definition of chance itself.

  **Admissibility:** This is the critical bottleneck. The evidence retained while deferring must be marked off non-circularly. A specification defined as "evidence such that deference is correct" is useless. A non-circular specification (e.g., "historical information up to time t") is achievable only at the cost of metaphysical commitment (ruling out undermining). If you demand non-circularity, you sacrifice neutrality. If you demand neutrality, you must accept a primitive or intuitive notion of admissibility.

  **Adjudicating Preferences:**
  1.  *Diachronic Dutch Book:* This does not belong on the list. It is a consistency constraint across time, not a synchronic norm for credence formation. An agent can satisfy the chance-credence norm at every instant yet be diachronically exploitable if her information updates irregularly.
  2.  *General Deference Schema:* This does not belong. While attractive, chance is *sui generis*. Experts can be mistaken; objective chance (by definition) cannot be wrong about itself. Deriving chance-deference from expert-deference risks circularity or misalignment when the "expert" is the world itself.

  **Conflicts and Exclusion:**
  The jointly unsatisfiable subset is: **Neutrality + Non-Circular Admissibility + Undermining Tolerance.** You must drop one. Given your embedded agent focus, **Admissibility** is the single requirement doing the most work to exclude attractive formulations. Most simple formulations fail because they cannot specify what evidence is "admissible" without either begging the question or ruling out valid metaphysical pictures of chance.

  **Scoring Contenders:**
  1.  *Original Unconditional Formulation:* Identifies credence directly with chance given total evidence. Fails measure-zero (forces zero credence); fails action-dependence (no fixed-point mechanism); fails undermining (admissibility undefined).
  2.  *Time-Restricted Reformulation:* Restricts the proposition to the outcome's holding at the time of the chance. Handles undermining better by isolating the chance time. Still struggles with action-dependence (if the act changes the chance at that time) and measure-zero (still identifies credence with chance directly).
  3.  *Chance-as-Expert Treatment:* Derives deference from a general principle about better-informed probability functions. Handles action-dependence well (fixed points emerge naturally). Handles measure-zero via standard probability theory. Fails on admissibility (inherits the general problem of defining the "expert's" information set without circularity).

  | Criterion | Original Unconditional | Time-Restricted Reformulation | Chance-as-Expert |
  | :--- | :--- | :--- | :--- |
  | **Measure-Zero** | **Fail:** Forces zero credence on exact outcomes. | **Fail:** Inherits identification problem. | **Pass:** Defers to density/functions naturally. |
  | **Action-Dependence** | **Fail:** No mechanism for fixed-points. | **Qualify:** Handles time-slice, misses reflexive causation. | **Pass:** Accommodates multiple/no fixed points. |
  | **Admissibility/Undermining** | **Fail:** Circular or excludes undermining. | **Pass:** Isolates undermining via time restriction. | **Qualify:** Shifts burden to "expert" info specification. |

  The time-restricted view survives the undermining objection best, but the expert treatment offers the most flexibility for the embedded agent's reflexive capacities. However, all three stumble on the non-circular admissibility requirement unless you abandon neutrality.
