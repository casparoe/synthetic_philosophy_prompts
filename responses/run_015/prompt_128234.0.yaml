answer: |-
  The dollar auction, as conceptualised by Martin Shubik, offers a potent heuristic for understanding the irrational rationality of the Vietnam escalation. It describes a scenario where two parties bid for a prize, with the unique constraint that both the highest and the second-highest bidder must pay their final bids. This structure creates a trap: once significant investment has been made, withdrawing guarantees a loss equal to the sunk cost, whereas placing a higher bid offers a non-zero probability of recouping the investment by winning the prize. Applied to the United States' ground commitment between 1965 and 1968, this model illuminates the structural incentives that propelled the Johnson administration deeper into conflict despite mounting evidence of diminishing returns.

  **Mapping the Auction: 1965–1968**

  To map this period rigorously, one must first identify the effective bidders. In the canonical bilateral model, the bidders are the United States executive branch (specifically the Johnson national security team) and the Democratic Republic of Vietnam (Hanoi). However, treating these as monolithic actors obscures internal friction. For the purpose of the escalation dynamic, the effective US bidder is the 'Commitment Coalition' within the administration—those who tied their political capital and policy legacy to the containment doctrine. The opposing bidder is the North Vietnamese leadership, specifically the faction advocating for total war to achieve unification.

  The prize being contested was not merely the territorial integrity of South Vietnam. In a dollar auction, the prize must be valued higher than the maximum possible bid to initiate the game. For Washington, the prize was global credibility and the preservation of the containment architecture in Asia. For Hanoi, the prize was national unification and the expulsion of foreign influence. Crucially, the value of the prize was subjective and inflated by the bidding process itself; as costs rose, the political necessity of winning increased to justify the expenditure.

  The payoff rules that made withdrawal more costly than continued bidding were defined by the interaction of sunk costs and audience costs. By 1965, the United States had already invested advisory personnel, equipment, and political capital. Withdrawal at this stage would realise an immediate loss: the admission that previous sacrifices were in vain. Continued bidding (troop escalation) deferred this loss and offered the prospect of a 'break-even' point where military victory would validate the sunk costs. The rule set was effectively: 'Loss on withdrawal is certain and political; loss on escalation is probabilistic and military.' As long as the probability of military success was perceived as non-zero, rational choice theory within the auction framework dictated further bidding.

  **Structural Alterations: Tonkin and Tet**

  The Gulf of Tonkin Resolution (1964) and the Tet Offensive (1968) did not terminate the auction; they altered its structural parameters.

  The Gulf of Tonkin Resolution functioned as a reduction in transaction costs for bidding. Prior to the Resolution, deploying combat units required complex legal and diplomatic manoeuvring, acting as a friction on escalation. The Resolution provided the legislative authority to 'take all necessary measures', effectively lowering the price of placing a bid. It allowed the US bidder to move from covert advisory bids to overt conventional bids with greater speed. It did not start the auction, but it removed the braking mechanism, allowing the bidding to accelerate into the 1965–1966 troop buildups.

  The Tet Offensive (1968) is often mischaracterised as the end of US will. Through the lens of escalation theory, it was a revaluation of the prize and the bankroll. For the US bidder, Tet demonstrated that the cost of winning (the bid required) exceeded the initial valuation of the prize. It shattered the assumption that victory was attainable within a tolerable budget of blood and treasure. However, it did not end the auction immediately. Instead, it shifted the US strategy from 'maximising victory' to 'minimising loss'. The bidding continued, but the objective changed to securing a settlement that masked the withdrawal, thereby attempting to recover some political value from the sunk costs. For Hanoi, Tet was a high-cost bid that failed militarily but succeeded in devaluing the US opponent's resolve, effectively forcing the US to reconsider the maximum bid they were willing to place.

  **Limits of the Model: Bureaucracy and Incrementalism**

  While the dollar auction explains the logic of the trap, it breaks down when applied to the mechanical process of decision-making. The model assumes discrete, conscious bids. The Vietnam escalation, however, was characterised by bureaucratic incrementalism. Troop increases were often framed not as strategic leaps (new bids) but as tactical adjustments to existing commitments (matching the opponent's last move). This 'salami slicing' obscured the cumulative cost. A rational bidder in a dollar auction recognises the total bid; the Johnson administration often focused on the marginal cost of the next increment. The model struggles to account for this cognitive fragmentation, where the escalation was the sum of many small, rational decisions that aggregated into an irrational outcome.

  Furthermore, the model assumes a consistent valuation of the prize. In reality, the Johnson administration's private pessimism suggests a decoupling of belief from action. Officials continued to bid publicly while doubting the possibility of winning privately. The dollar auction explains this as loss aversion, but it does not fully capture the phenomenon of 'hope as a strategy'. The administration was not merely minimising loss; they were purchasing time, hoping for an external variable (a change in Hanoi's will, a shift in Chinese policy) to alter the game board. This is not bidding to win; it is bidding to delay the settlement.

  **The Nested Structure: Parallel Domestic Auctions**

  The most significant limitation of the bilateral dollar auction model is its failure to account for the domestic political arenas. It is more rigorous to view the conflict not as a single bilateral auction, but as a nested structure containing two separate domestic bidding loops that interacted through the international theatre.

  On the American side, the Johnson administration was locked in a domestic auction against the US political opposition and the public. The 'prize' here was the 1968 election and the preservation of the Great Society legislation. Every international bid (troop deployment) was simultaneously a domestic bid to maintain authority and credibility. Withdrawal from Vietnam would have been a losing bid in the domestic auction, inviting challenges from both the right (accusations of weakness) and the left (accusations of immorality). Thus, Johnson continued to bid internationally to remain solvent domestically. The international war was the currency used to settle the domestic political debt.

  Simultaneously, the North Vietnamese leadership was running a parallel domestic auction. Their bid was measured in manpower and endurance against the resilience of their own population and the patience of their patrons (Moscow and Beijing). Hanoi's leadership calculated that their cost tolerance was higher than Washington's. They were not necessarily trapped in a sunk-cost fallacy in the same manner; rather, they were engaging in a war of attrition designed to exhaust the US domestic bankroll.

  In this nested view, the escalation dynamics are not merely about US vs. North Vietnam. They are about the Johnson Administration vs. American Public Opinion, and the Lao Dong Party vs. North Vietnamese Endurance. The international battlefield was merely the mechanism by which the two domestic auctions were reconciled. The US escalation continued not because Washington believed it could defeat Hanoi militarily in a vacuum, but because it believed it could outlast Hanoi's ability to inflict pain on the American body politic.

  This explains the refusal to withdraw despite private pessimism better than the simple bilateral model. In a bilateral dollar auction, if both parties know the prize is worthless, bidding stops. In the nested model, bidding continues as long as the international conflict serves a domestic function. For Johnson, the war functioned as a shield against domestic political attack. To withdraw was to lose the domestic auction, regardless of the international outcome.

  **Conclusion**

  The dollar auction provides a disciplined framework for understanding why the United States found it difficult to disengage from Vietnam between 1965 and 1968. It correctly identifies the payoff structure where withdrawal guarantees a loss while escalation offers a probabilistic reprieve. The Gulf of Tonkin Resolution and the Tet Offensive are best understood as rule changes that altered the cost of bidding and the valuation of the prize, rather than start or stop signals.

  However, the model is insufficient if treated as a complete explanation. It underestimates the role of bureaucratic drift and the fragmentation of decision-making. Most critically, it fails unless expanded to recognise the nested nature of the conflict. The escalation was driven by two overlapping auctions: one international, one domestic. The Johnson administration was bidding against Hanoi, but it was also bidding against its own political vulnerabilities. Understanding the escalation requires acknowledging that the US was often paying the costs of the international auction to purchase solvency in the domestic one. The tragedy of the escalation lies not just in the trap of the dollar auction, but in the realisation that the currency being spent was disconnected from the actual value of the prize being won.
