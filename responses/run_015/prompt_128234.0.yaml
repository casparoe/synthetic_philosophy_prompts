          *   *Tet Offensive (1968):* Did it end the auction? No. It changed the *valuation* of the prize. For the US, the prize became 'honourable exit' rather than 'total victory'. For Hanoi, it validated the cost of bidding. It shifted the US domestic audience's tolerance, effectively changing the 'bankroll' available to the US bidder.

      *   **Critique/Limits of the Model:**
