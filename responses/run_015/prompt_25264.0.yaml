prompt: |-
  I'm presenting a paper next month at a joint philosophy and political-science workshop on Kant's *Perpetual Peace*, and I need to walk in ready for a combative Q&A. The paper defends a specific interpretive thesis: that Kant's three Definitive Articles — republican constitution, pacific federation, and cosmopolitan right — are not a menu from which we can cherry-pick the most empirically tractable item, but a tightly integrated normative system. Each article supplies a necessary condition for the others to function, and the whole architecture is driven by Kant's deeper commitment to the idea that peace must arise from a rightful juridical condition, not merely from prudence, commerce, or the balance of power. I argue that the empirical democratic-peace literature, for all its suggestiveness, effectively isolates the first article and in doing so inverts Kant's own priorities. For Kant, republican constitutions do not cause peace directly; they create the domestic conditions under which a lawful international order becomes rationally mandatory, and that international order in turn stabilizes republicanism internally. The practical upshot, I claim, is that Kant gets conscripted — against the grain of his own framework — into defenses of democratic interventionism, the forcible export of republican government, which his federation model and his cosmopolitan right of hospitality jointly rule out.

  The audience falls into three camps. First, four or five Kant scholars who know the text of *Perpetual Peace*, the *Metaphysics of Morals*, and the relevant *Reflexionen* in detail and will care above all about whether my reading is exegetically defensible. Second, a cluster of empirical political scientists who work on the democratic peace and will treat me as trying to talk them out of their most distinguished philosophical ally. Third, two just-war theorists and an international-law scholar who will press me on institutional implications: What does my reading actually say about the UN Security Council, the ICC, the Responsibility to Protect, or humanitarian intervention? I know the objections I want to get; I need to prepare for the ones I will actually get.

  Draft my Q&A prep sheet. For each objection, give me: which camp it comes from (or whether it crosses camps), how they would phrase it in their own idiom, how damaging it really is on a scale from minor to fatal, a two-sentence reply pitched to that questioner, and a private note on where my reply is softest and what they could say next. Order the objections by roughly how likely and damaging they are in combination. Also include the question I am praying nobody in the room asks. Close with an overall assessment: rate your confidence in each objection prediction on a rough low/medium/high scale, and identify the single point in your whole analysis where you are least sure. Keep the entire response under 700 words.
