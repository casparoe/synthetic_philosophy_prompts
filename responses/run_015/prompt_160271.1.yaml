  3.  **Address the Specific Structural Questions:**

      *   **Ellsberg/Behavior:** Must come *first*. You cannot motivate a change in formalism without showing why the old one fails descriptively or normatively. If you show the math first, they'll try to map it to sharp credences immediately. The "resistance to betting" is the phenomenological hook.
      *   **Intervals vs. Sets:** Must come *immediately after* Ellsberg. The intervals are the *output*, the set of measures is the *representation*. This distinction prevents the "midpoint" error. Crucially, need to show that $P(A) \in [x, y]$ and $P(B) \in [z, w]$ does not determine $P(A \lor B)$. This requires the Set of Measures view (convexity/closure).
      *   **Updating:** Needs to come *before* Decision Rules. Why? Because the non-commutation (Condition then Choose vs. Choose then Condition) is a structural feature of the *belief state*, not just the action. If you do decision rules first, updating looks like a technical footnote. If you do updating first, the decision rules become the necessary tool to navigate the updated set.
      *   **The Economist's Objection (Higher-Order Probability):** This is the trickiest. If you address it too early, you lose the motivation for IP. If you address it too late, they've already modeled it as sharp in their heads. Best spot: After defining the Set of Measures, *before* Decision Rules. Frame it as: "Why not just put a prior over these measures?" Answer: "Because that requires a sharp prior over the set, which reintroduces the precision we are trying to avoid (regress/indeterminacy)."
