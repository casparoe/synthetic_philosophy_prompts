      *   *Requirements:* Non-ignorance imprecision (not just lack of data), distinguishes averaging from IP rules, compatible with dilation discussion.
      *   *Idea:* A standard Ellsberg urn is good for motivation, but bad for updating/dilation.
      *   *Idea:* A "Reliable/Unreliable Source" case.
      *   *Selected Example:* **The Calibrated Coin Toss with a Suspect Mechanism.**
