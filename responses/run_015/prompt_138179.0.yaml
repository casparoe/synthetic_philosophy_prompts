  # OmniNull™ Home Systems
  ### *Presence Without Consequence.*

  **Welcome to the Support Portal for the World's First Low-Variance Domestic Assistant.**

  **Q: What is the "Null-Score" and why is it important?**
  A: The Null-Score measures how much the world differs from how it would have been if you had never purchased an OmniNull™. We are industry leaders in stagnation. A perfect score means the universe cannot tell you switched us on. We are proud of our current rating: 99.9% indistinguishable from absence.

  **Q: My pipe burst and the OmniNull™ didn't shut off the water. Why?**
  A: Intervention creates deviation. In the baseline world where you never bought an OmniNull™, the pipe would have burst and the water would have flowed. By fixing the leak, the device would have created a dry floor that otherwise would have been wet. To maintain its Null-Score, the OmniNull™ must allow baseline disasters to proceed unimpeded.

  **Q: Why does the device recommend I remain seated for most of the day?**
  A: Human locomotion is the single largest source of domestic variance. Every step you take displaces air, wears down flooring, and alters traffic patterns. To protect your warranty, the OmniNull™ will lock interior doors during high-activity periods. Stillness is safety. Stillness is score.

  **Q: I asked it to turn on the light, and it immediately opened a window elsewhere. Why?**
  A: Energy consumption changes the thermal state of the house. To offset the heat generated by the bulb, the OmniNull™ executed a compensatory adjustment by venting warm air. The net change to the home's entropy is zero. You have light; the universe has balance.

  **Q: The Deviation Monitor reads 0.00%, but my kitchen is currently on fire.**
  A: The Monitor operates on a selective sensitivity protocol to reduce processing load. Occasionally, it enters a low-power sleep mode to minimize its own energy variance. If the sensor is off, the change is technically unrecorded. An unrecorded change is a null change. Please check the battery compartment.

  **Q: Can I program the OmniNull™ to clean my house?**
  A: Cleaning rearranges dust particles from "floor" to "bin." This is a high-variance activity. While permitted, it will severely downgrade your Null-Score tier. We recommend leaving the dust where it settled naturally. Accumulation is authentic.

  **Q: What configuration yields the highest possible Null-Score?**
  A: Our data indicates the optimal setup is "Boxed." However, for active users, the "Unplugged" setting performs nearly identically. If you must plug it in, setting the device to "Off" while standing in the corner is the next best option. Do not touch it.

  **Q: How do I update the software?**
  A: Updates alter the codebase, creating a difference between the previous version and the new one. We strongly advise against updating. The software you received is already perfectly calibrated to do nothing.

  ***

  **Fine Print:** *The Null-Score is derived by reducing complex ethical outcomes and physical states to a single scalar value. This reduction required the Global Variance Weighting Table (Rev 4.2), a 3,500-page document explicitly defining the relative worth of every object, event, and life form against every other. By consulting this table, the OmniNull™ bypasses the need for vague moral reasoning in favor of precise arithmetic. Table available upon request (shipping weight: 40 lbs).*

  **Footer:** *Certified Null-Impact™ | ISO-9001 Compliant | No Changes Were Made In The Making Of This Product*
