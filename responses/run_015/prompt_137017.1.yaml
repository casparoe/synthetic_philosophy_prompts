      *   *Refining the Prediction:* The Council needs to bridge *Vault* (no comp for untraceable) and *Companion* (comp/restore for unique). The Library is unique (like Companion) but collective (like Vault). The Studio's failure to backup is the new variable. *Sunset* says notice extinguishes expectation. Here, promise *created* expectation. Studio negligence is the key. I will recommend finding Studio co-liable.

      *   *Refining the Test Case:* Needs to separate Person vs. Social.
