answer: |-
  **Memorandum to the Council of Appeals**
  **Re:** Adjudication of the Library Fire Case
  **Subject:** Derivation of Governing Rules and Recommendation

  You have asked for a rigorous derivation of the principles underlying our six precedents to resolve the case of the Library Fire. The difficulty here is that the precedents pull in different directions: *The Siege* and *The Sunset* suggest players bear the risk of loss, while *The Companion Creature* and *The Guild Vault* suggest the Council and Studio have duties to protect unique effort and collective agreements.

  Below are three candidate rules derived from our jurisprudence, their application to the instant case, and my recommendation for the Council's decision.

  ---

  ### I. The Candidate Rules

  To be viable, a rule must explain why we sanctioned the fraudster but not the besieger, why we restored the creature but not the cathedral, and why the avatar assault warranted a ban without compensation.

  #### 1. The Person-Protective Rule (The "Real Harm" Principle)
  **Statement:** An in-world act is wrongful only if it causes demonstrable harm to the real-world interests (financial, psychological, or reputational) of the person behind the avatar, excluding harms assumed within the ordinary adversarial frame of the game.
  **Compatibility:**
  *   *Fits:* *The Fraudulent Exchange* (real money loss); *The Avatar Boundary* (psychological violation); *The Siege* (no real harm assumed in PvP).
  *   *Amendments Required:* To fit *The Companion Creature*, "harm" must be expanded to include "unique non-fungible effort" that the system implicitly promised to preserve. To fit *The Guild Vault*, it must acknowledge that "financial interest" includes in-world assets recognized by a social charter.
  **Prediction:** Focuses on the builders' emotional distress and the economic reliance of the questers.

  #### 2. The Social-Constitution Rule (The "Community Contract" Principle)
  **Statement:** Rights and obligations are determined by the social contracts established within the world (charters, public announcements, reliance) and the adversarial frame, bounded by a floor of basic human dignity and external law.
  **Compatibility:**
  *   *Fits:* *The Guild Vault* (charter created property); *The Sunset* (notice altered the contract); *The Siege* (adversarial frame is a social contract).
  *   *Amendments Required:* To fit *The Avatar Boundary*, it must acknowledge a "dignity floor" that exists regardless of consent or contract. To fit *The Fraudulent Exchange*, it must acknowledge that real-money trading invokes external legal contracts that supersede internal ones.
  **Prediction:** Focuses on the public announcement of "permanence" and the reliance of the guilds.

  #### 3. The Data-Ontology Rule (The "Restorability" Principle)
  **Statement:** Loss is only actionable if it is technically irreversible by the administration. If the server can restore the state, the remedy is restoration; if it cannot, the loss is absolute. Permission determines sanction; reversibility determines remedy.
  **Compatibility:**
  *   *Fits:* *The Companion Creature* (restored from snapshot); *The Fraudulent Exchange* (ledger recreation); *The Sunset* (export tool shifted burden to user).
  *   *Amendments Required:* To fit *The Siege*, it must distinguish between "destruction by mechanic" (no remedy needed) and "destruction by exploit" (remedy needed if possible). To fit *The Avatar Boundary*, it must accept that some harms (dignity) are not data-states and thus warrant sanction without data-restoration. To fit *The Guild Vault*, it must explain why untraceable assets were *not* replaced (because they were fungible currency, not unique data).
  **Prediction:** Focuses on the transaction logs and the existence of backups.

  ---

  ### II. Application to the Library Fire Case

  **Facts Recap:** 11,000 unique books (2 years effort). Destroyed via *exploit* (unauthorized). No backup. Public promise of permanence. Third-party reliance.

  #### 1. Under the Person-Protective Rule
  *   **Wrong Done?** Yes. The loss of 2 years of creative effort constitutes "unique non-fungible effort," and the reliance by other players constitutes economic harm.
  *   **Against Whom?** The exploiter (for the harm) and the Studio (for failing to safeguard the "unique effort" they implicitly encouraged).
  *   **Remedy:** Permanent ban for the exploiter. Studio-funded compensation in currency to the builders for the value of their time/effort.
  *   **"Only Data" Defense:** Fails. Data represents real-world effort and identity (*Avatar Boundary*).

  #### 2. Under the Social-Constitution Rule
  *   **Wrong Done?** Yes. The library was announced as a "permanent common resource." This created a social contract distinct from the ordinary adversarial frame. The exploit violated the agreed-upon rules of interaction.
  *   **Against Whom?** The Community. The library was a public good, not private property. The harm is to the shard's social fabric.
  *   **Remedy:** Ban for the exploiter. Studio-funded reconstruction (hiring builders or paying currency) to uphold the social promise of permanence.
  *   **"Only Data" Defense:** Fails. The data *is* the social object. Its destruction violates the constitution of the shard.

  #### 3. Under the Data-Ontology Rule
  *   **Wrong Done?** Yes, regarding the *act* (exploit is unauthorized permission). No, regarding the *loss* (if it cannot be restored, it is gone).
  *   **Against Whom?** The exploiter violated the code. The Studio failed in administrative duty (no backup), but the rule suggests untraceable loss is absolute (*Guild Vault*).
  *   **Remedy:** Ban for the exploiter. No material compensation. *The Guild Vault* precedent dictates untraceable assets are not replaced. *The Companion Creature* only mandated restoration because a snapshot *existed*.
  *   **"Only Data" Defense:** Succeeds partially. The act was wrong, but the loss is final because the data cannot be reconstructed.

  ---

  ### III. Recommendation and Prediction

  **Decision:** The Council should find that a wrong was done against both the builders and the wider user base. The exploiter should be permanently banned. The Studio should be ordered to provide currency compensation equivalent to the reconstruction cost, though the text itself cannot be restored.

  **Reasoning:**
  To be consistent with itself, the Council must distinguish this case from *The Siege* and *The Guild Vault*, while leaning heavily on *The Companion Creature*.

  1.  **Why *The Siege* is a Superficial Analog:** The defense will argue *The Siege*: destruction happened, no compensation. But *The Siege* relied on "siege mechanics the world expressly provides." This case involves an **exploit**. *The Avatar Boundary* established that using bugs/exploits to cause harm removes the protection of the "adversarial frame." The destruction was not a legal move in the game; it was a violation of the game's code.
  2.  **Why *The Guild Vault* is a Partial Analog:** *The Vault* recognizes collective ownership via charter. Here, the "permanent common resource" announcement functions like the Vault's charter. However, *The Vault* denied compensation for untraceable assets. We must distinguish this: The Vault contained currency (fungible). The Library contained unique text (non-fungible).
  3.  **Why *The Companion Creature* is the Controlling Analog:** This is the closest match. A bonded creature (unique, non-fungible, effort invested) was destroyed. In *Companion*, we ordered restoration because "nothing had been lost that could not be restored." Here, restoration is *impossible*. However, the principle underlying *Companion* is that **unique creative effort warrants protection beyond ordinary assets.** Since the Studio cannot restore the data (unlike *Companion*), and the loss is wrongful (unlike *Siege*), justice requires the Studio to bear the cost of the loss in the next available form: currency compensation.

  **Studio Responsibility:**
  The Studio bears responsibility not for the fire, but for the **expectation of permanence**. In *The Sunset*, notice and an export tool extinguished expectation. Here, the Studio *created* an expectation of permanence ("announced publicly") while failing to provide the technical means to secure it (no export, no backup). This is administrative negligence.

  **The "Only Data" Defense:**
  This must fail. *The Avatar Boundary* explicitly rejected the idea that "it's just data" when the person is violated. *The Companion Creature* rejected it when unique effort is lost. The text is an extension of the players' intellect and labor.

  **Principles Adopted:**
  By ruling this way, the Council commits to three principles:
  1.  **Destroyability:** Virtual objects can be destroyed, but only via authorized mechanics. Destruction via exploit is a tort.
  2.  **Harm to Non-Owners:** Third-party reliance (quest economy, public research) creates a cognizable interest in public builds, extending standing beyond the builders.
  3.  **Justification:** **Irreplaceability** is the justificatory work. If the object were fungible (like gold in *The Vault*), no compensation would be due for untraceable loss. Because it is unique (like the Creature), compensation is due even if restoration is impossible.

  ---

  ### IV. Underdetermination and Future Testing

  **Where Precedents Underdetermine:**
  Our precedents do not clearly resolve the "Wrongful + Unrestorable" gap.
  *   *Companion* says: Wrongful + Restorable = Restore.
  *   *Vault* says: Wrongful (theft) + Unrestorable (untraceable) = No Compensation.
  *   *Library* is: Wrongful (exploit) + Unrestorable (no backup).
  We are forced to choose between the *Vault* logic (loss lies where it falls) and the *Companion* logic (unique effort must be made whole). I recommend choosing *Companion* because the Library is ontologically closer to a bonded creature than to a stack of gold.

  **The Test Case:**
  To distinguish the Person-Protective Rule from the Social-Constitution Rule in future sessions, the Council should construct the following case:

  **The "Authorized Desecration" Case:**
  *   **Facts:** A player builds a memorial to a real-world tragedy in a zone designated as "Free-Build." The EULA and zone signage explicitly state: "Any structure in this zone may be altered or destroyed by any other player at any time." A second player, knowing the memorial's significance, destroys it using **authorized** mechanics (no exploit).
  *   **Divergence:**
      *   **Social-Constitution Rule:** No wrong. The community contract (EULA/Signage) permitted the destruction. The builder assumed the risk.
      *   **Person-Protective Rule:** Wrong done. The psychological harm to the builder (and the community) outweighs the internal contract. The "dignity floor" (*Avatar Boundary*) trumps the zone rules.
      *   **Data-Ontology Rule:** No wrong. Permission was granted; data state changed via authorized mechanic.

  If the Council bans the destroyer, we have adopted the **Person-Protective Rule**. If we decline to intervene, we have adopted the **Social-Constitution Rule**. This test will clarify whether our protection of players is inherent to their personhood or contingent on the rules of the space they occupy.

  **Conclusion:**
  Rule out *The Siege*. Embrace *The Companion Creature*. Compensate the builders. Sanction the exploiter. Censure the Studio's backup policy. The library was not just data; it was the shard's memory. To let it vanish without redress is to tell the user base that their labor is transient, regardless of your promises.

  Respectfully submitted,
  *Legal Analyst*
