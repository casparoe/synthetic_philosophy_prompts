answer: |-
  ### Unstructured Brainstorming

  Okay, let's sit with this asymmetry. It's visceral. I'm thinking of Sir Lewis Namier dissecting the 18th-century British Parliament like an anatomist, mapping kinship networks and patronage flows, yet treating the MP's vote as a calculated move in a game of chess. Then I flip to a social history of the same period: weavers in Lancashire. They aren't playing chess; they're reacting to the price of wool. They are a fluid dynamics problem, not a game theory problem.

  Why? Is it just the sources? If I find a weaver's diary (like the Wesleyan Methodists later on), do they suddenly become an agent? Often, no. The diary gets treated as "evidence of working-class piety," a data point in a graph of religious sentiment. If I find a King's private journal, it's "the burden of command," a window into a soul.

  There's a hint of Hegel here. The World Spirit moves through the great men; the rest are the soil. But modern historians would scream at that. They'd say it's just practical. You can't run a regression on a cabinet meeting (N=1). You can't write a biography of a serf (no names).

  But the prompt pushes harder: *When the sources allow for both, the method still splits.* A soldier's letter from the trenches. If it's a General, it's strategy, doubt, moral weight. If it's a Private, it's "morale," "hardship," "the experience of war." The Private's intention is flattened into "experience." The General's intention is elevated into "decision."

  This suggests the asymmetry isn't just about what we *can* do, but what we think history *is*. Is history the study of decisions or the study of conditions? We act as if it's both, but we segregate them by class.

  Think about the *Annales* school. Braudel. The long duration. Everyone is trapped in the prison of the longue durée. But then, political history snaps back. The event returns. Why? Because we secretly believe the King can break the cycle, but the peasant cannot.

  And the "Survivorship Rule" thought experiment is brutal. It forces us to admit: do we fund history to know the past, or to fix the past's silences? If we fund the silent, we admit that significance was previously defined by power. But if we only study the silent, do we lose the mechanism of power?

  Okay, I need to structure this. I see three ways to explain the asymmetry. I'll sketch them, pick the one that cuts deepest, and then hammer it against your four questions.

  ---

  ### Three Candidate Readings of the Asymmetry

  **1. The Source-Determinist Reading (The "Boring" Explanation)**
  *   **Theory:** Method follows material. Elites produce narrative sources (memoirs, letters, state papers) because literacy and leisure are class privileges. Non-elites produce serial sources (tax rolls, parish registers, court dockets) because they are administered by the state.
  *   **Implication:** The asymmetry is epistemic necessity, not ideological choice. Historians are pragmatists. If peasants wrote as many letters as Dukes, we would write biographies of peasants.
  *   **Stress Test:** Fails when "peasant letters" exist (e.g., WWI doughboys, Civil War soldiers, some slave narratives). Historians often still treat these as "social data" rather than "political agency." The method doesn't shift even when the source does.

  **2. The Ontological Hierarchy Reading (The "Hegelian" Explanation)**
  *   **Theory:** History presupposes that *causal efficacy* is distributed unequally. Elites possess "Agency" (the capacity to initiate new causal chains through will). Non-elites possess "Behavior" (responses to stimuli).
  *   **Implication:** Narrative is the form of Agency; Statistics is the form of Behavior. We don't write biographies of weavers because we don't believe a single weaver changes the weave of history.
  *   **Stress Test:** Contradicted by revolutions. In 1789 or 1917, the "masses" suddenly acquire Agency in the historical record. The method often breaks down here, becoming frantic and hybrid (e.g., Soboul on the French Revolution).

  **3. The Archival Isomorphism Reading (The "Foucaultian" Explanation)**
  *   **Theory:** Historians unconsciously adopt the epistemic stance of the archive itself. The archive is a technology of power. The state recorded elites as *interlocutors* (people to negotiate with) and masses as *subjects* (people to manage). Historians replicate this relationship. We treat elites as subjects (with interiority) and masses as objects (with characteristics).
  *   **Implication:** The asymmetry is a replication of past power structures within present-day methodology. We see the past through the eyes of the clerk who filed the record.
  *   **Stress Test:** This is the strongest, but it implies historians have no critical distance. It struggles to explain "history from below" movements that explicitly try to subvert this (e.g., Subaltern Studies).

  ---

  ### Commitment: The Archival Isomorphism Reading

  I am committing to **Candidate 3: The Archival Isomorphism Reading**.

  **The Implicit Theory:** Historical method is not neutral; it is isomorphic with the administrative logic that generated the sources. The discipline presupposes that the *way* a person appears in the archive dictates the *kind* of being they were. If the state counted you, you are a number. If the state corresponded with you, you are a mind. The historian's "epistemic style" is a deferred obedience to the bureaucracy of the past.

  **Where It Is Weakest:**
  It is overly cynical about historian agency. It assumes a kind of methodological determinism that ignores the last 50 years of critical theory. Historians *know* the archive is biased (thanks to Foucault, Stoler, Scott). Yet, the asymmetry persists. If it were just unconscious replication of power, critical training should have fixed it. The fact that it hasn't suggests something deeper than just "mimicking the clerk." It suggests that **narrative itself requires a specific kind of inequality.** To tell a story, you need a protagonist. To have a protagonist, you need a surplus of interiority. The archive gives that surplus to elites. To give it to non-elites requires *fabrication* (in the literary sense), which violates the historian's oath to evidence. So the weakness of my commitment is that it blames power, when the real culprit might be *narrative form*.

  ---

  ### 1. What does this asymmetry presuppose?

  Under the Archival Isomorphism theory, the practice presupposes that **legibility equals humanity.**

  It does *not* strictly presuppose that ordinary people lack reason (the Ontological Hierarchy view). A historian can believe peasants are rational while still using price series to explain their riots. However, the practice fits comfortably with the view that **historical significance is a function of administrative visibility.**

  **Strict Presupposition:** The only valid reconstruction of interiority is one authorized by the contemporary power structure. If the King's secretary wrote down the King's doubt, it is historical fact. If a peasant's doubt is inferred from a grain riot, it is historical speculation. The practice presupposes that *intentionality* requires a paper trail.

  **Underdetermination:** This is where it gets tricky. The same behavior (using stats for peasants, letters for kings) is licensed by two contradictory philosophies:
  *   **Positivism:** "We use stats for peasants because their individual motives are noise; only the aggregate signal is truth."
  *   **Hermeneutics:** "We use letters for kings because text requires interpretation, and only elites produced texts."

  The practice doesn't tell us which one is true. A Marxist and a Positivist would produce the same monograph structure here, for different reasons. The Marxist says elites mask structural reality with ideology (so read their letters as lies); the Positivist says elites are the signal (so read their letters as data). Both end up treating the elite source as the primary locus of "decision."

  ### 2. Where does the practice contradict itself?

  The seam is the **Moment of Disruption.**

  Consider the **Grain Riot** or the **Mutiny**.
  Here, the "mass" suddenly behaves like the "elite." They make a collective decision. They issue demands. They negotiate.
  *   *The Contradiction:* Historians often handle this by fracturing the group. They find a "ringleader" (an accidental elite) to interview or prosecute, and treat him as an agent, while the rest of the rioters revert to being a "hungry mob" (structural explanation).
  *   *The Betrayal:* Look at how court depositions from riots are used. If a General writes a memo justifying a bombardment, it's "strategy." If a rioter testifies why they broke a window, it's "testimony of desperation." The *form* of the source (a written justification) is identical, but the *epistemic weight* differs.
  *   *The Specific Case:* **Slave Narratives.** When we have a WPA slave narrative, the discipline treats it with extreme caution ("memory is fallible," "interviewer bias"). When we have a Plantation Owner's diary, it is also treated with caution, but often as "insight into the mindset of the master." The slave's voice is treated as *evidence of trauma* (a condition); the master's voice is treated as *evidence of policy* (an intention). The contradiction is that the slave's narrative is often the most intentional document in the archive, yet it is structurally demoted to "experience."

  This betrays a commitment to **Stability.** Intentionality is granted to those who maintain the system; structural determinism is applied to those who disrupt it. To grant full intentionality to a rioter is to admit the system was breakable by will, not just by crisis.

  ### 3. The Survivorship Rule (Thought Experiment)

  If a research council adopts the rule—"Fund the undocumented, penalize the documented"—here is the implicit theory it reveals:

  **A. View of Historical Significance:**
  It presupposes that **Significance is Inverse to Power.**
  This is a moral ontology, not an epistemic one. It claims that the "truth" of an era is located in its suffering, not its ruling. It assumes the "view from above" is inherently distorted (ideology), while the "view from below" is inherently authentic (experience), even if silent.
  *   *The Problem:* Can significance be independent of source-survival? No. Because significance is a relationship between the past and the present. If we know nothing of them, they cannot signify *to us* except as a void. The Rule tries to make the *absence* of evidence the *presence* of significance.

  **B. View of Historical Knowledge:**
  It reveals that recovering "voice" is a **Reparative Act**, not a Truth Act.
  If it were about truth, we would follow the evidence. By prioritizing the silent, we admit that history is a form of justice. We are not reconstructing what happened; we are balancing the scales of memory.
  *   *The Costume:* It wears an epistemic costume ("We will know more") but it is actually ethical ("We will honor more").
  *   *The Paradox:* "Is the history of power the most distorted history of all?" Under this rule, **Yes.** But this is dangerous. The history of power is the history of *constraints*. If we don't study the King's letters because he was powerful, we don't understand why the peasant starved. The Rule risks creating a history of victims without a history of victimizers. It creates a world of effects without causes.

  **C. View of the Historian:**
  The historian becomes a **Medium**, not a Detective.
  The Detective follows the clues (the archive). The Medium speaks for the dead who cannot speak. This shifts the historian's authority from "rigor" to "empathy." The risk is ventriloquism. If I write about illiterate peasants using only tax rolls and my own theory, am I writing their history, or my own political philosophy projected onto them? The Rule forces the historian to fill the silence with theory, which is the very thing the "structural explanation" was accused of doing in your prompt.

  ### 4. Concretely: What would have to change to unify the method?

  If a department genuinely ran one method for kings and weavers, **Narrative History would have to die, or Structural History would have to become speculative.**

  Let's try to unify them. We have two options:

  **Option A: The King as a Data Point (Structuralism for Elites)**
  *   *Practice:* We stop writing biographies of Churchill. We treat him as a node in a network of imperial administration. We analyze his speeches as serial data (sentiment analysis), not as rhetorical masterpieces. We explain his decisions via budget constraints and electoral cycles, not his "resolve."
  *   *What is Lost:* The sense of *contingency*. If Churchill is just a variable, could anyone have done the same? It removes the moral weight of leadership. It makes history feel inevitable.
  *   *Who Gives Up More:* **Political Historians.** They lose their protagonists.

  **Option B: The Weaver as a Protagonist (Microhistory for Masses)**
  *   *Practice:* We take one tax record for a peasant and write 300 pages on him. We speculate on his inner life based on the fact that he paid his tax late. We treat his silence as a text.
  *   *What is Lost:* **Empirical Restraint.** This is the Ginzburg problem. *The Cheese and the Worms* is a masterpiece, but it is 90% inference. If we do this for everyone, history becomes historical fiction. We lose the ability to generalize.
  *   *Who Gives Up More:* **Social Scientists / Cliometricians.** They lose their N-size.

  **The Block:**
  The block is **Causality.**
  *   Elite history assumes **Voluntarist Causality** (He chose X, so Y happened).
  *   Mass history assumes **Determinist Causality** (Prices rose, so X happened).
  *   To unify them, you need a theory where **Structure constrains Will, and Will manipulates Structure.** (Bourdieu's *Habitus* tries this).
  *   *Why it fails in practice:* It's too hard to write. A book that rigorously models the grain market *and* deeply interprets the interiority of the baker is 1,000 pages. The discipline rewards specialization.

  **The Verdict:**
  To truly unify the method, **the monograph would have to be abandoned for the database or the collective biography.**
  You would need a department where every project is a prosopography. You study 500 MPs and 500 Weavers. You treat the MPs structurally (voting patterns) and the Weavers intentionally (petition signatures).
  *   *What changes:* Graduate training stops teaching "how to read a text" vs "how to read a table." Everyone learns both.
  *   *The Loss:* We lose the **Hero** and the **Victim**. We are left with **Actors**.
  *   *Is it possible?* Technically, yes. Psychologically, no. We tell stories to make sense of time. Stories require inequality of focus. A history where everyone is equally an agent is a history where nothing stands out. It is a map with no scale.

  **Final Thought:**
  The asymmetry you identified is the discipline's way of managing the tension between **Freedom** and **Necessity**. We assign Freedom to the elites (narrative) and Necessity to the masses (structure) so we don't have to admit that *everyone* is trapped, or that *no one* is in control. Unifying the method would force us to confront the possibility that the King was as powerless as the serf, or the serf as dangerous as the King. The discipline resists this because it makes history either tragic (no one controls anything) or terrifying (anyone can destroy everything).
