answer: |-
  This is a remarkably sharp observation, and you have put your finger on a genuine blind spot in mainstream Western moral psychology. You are correct that the standard "guilt is good, shame is bad" heuristic (popularized by researchers like Tangney) often ignores the *social infrastructure* required to resolve either emotion.

  To answer your questions directly: **No, there is no single, canonical term for this specific structural mismatch.** However, there are several adjacent concepts that, when stitched together, describe exactly what you are seeing.

  Here is a breakdown of the existing landscape, a proposal for what to call this phenomenon, and how it differs from the "healthy shame" argument.

  ### 1. The Closest Existing Concepts

  While there isn't one word for "guilt without a repair script," three frameworks come close:

  **A. Reintegrative Shaming (John Braithwaite)**
  You mentioned this, but it's worth digging deeper. Braithwaite's criminology theory distinguishes between *stigmatizing shame* (rejecting the offender) and *reintegrative shame* (condemning the act, then ceremonially welcoming the person back).
  *   **The Gap:** Braithwaite argues reintegrative shame is superior to *both* stigmatizing shame and modern penal guilt. He implicitly acknowledges that Western legal/psychological systems often induce guilt without providing a mechanism for "decertifying" the offender status. However, his term focuses on the *solution* (shaming correctly) rather than naming the *problem* (guilt without resolution).

  **B. The Privatization of Conscience (Sociology/Theology)**
  Sociologists of religion (like Talal Asad or Max Weber) discuss the shift from religious confession to secular conscience.
  *   **The Mechanism:** In Catholic confession, guilt is externalized: you speak it, you are assigned penance, you are absolved. The loop closes.
  *   **The Deficit:** In secular/protestantized guilt cultures, morality is internalized. There is no priest to say "you are forgiven." The individual must judge themselves. Without an external authority to declare the debt paid, the guilt has no "stop condition." This is sometimes called **"The Absence of Secular Absolution."**

  **C. Moral Residue (Psychology/Ethics)**
  In nursing and military ethics, "moral residue" describes the lingering distress after a moral violation when one feels they could not act correctly or cannot resolve the feeling.
  *   **The Limit:** This usually refers to individual trauma, not the *social script* failure you are describing, but it captures the "stuckness" you noted.

  ### 2. What Should We Call It?

  Since the term doesn't exist, we need one that captures the *structural* nature of the problem (the lack of a script) rather than just the emotional feeling.

  I propose calling this **"The Ritual Deficit of Guilt"** or **"Unritualized Guilt."**

  Here is why this phrasing works:
  *   **Ritual:** It highlights that shame cultures often rely on *performative acts* (public apology, communal meal, handshake) to signal the end of the transgression.
  *   **Deficit:** It frames the problem not as the emotion itself, but as the lack of a tool to process it.
  *   **Unritualized:** It suggests that guilt in modern contexts is treated as a private mental state rather than a social transaction that requires closure.

  Alternatively, if you want to emphasize the social isolation aspect, you could call it **"The Reintegration Gap."** This highlights that guilt cultures have a mechanism for *conviction* (conscience) but lack a mechanism for *parole* (social re-entry).

  ### 3. How This Differs from "Healthy Shame"

  You asked how this is different from simply saying "shame can be healthy." This is a crucial distinction.

  *   **"Healthy Shame" is Phenomenological:** It argues that the *feeling* of shame isn't inherently toxic. It claims that feeling small can be useful for humility or social cohesion. It focuses on the *internal experience* of the emotion.
  *   **"The Ritual Deficit of Guilt" is Structural/Functional:** Your observation isn't about whether guilt *feels* better than shame. It's about the **exit strategy**.
      *   **Shame (Reintegrative):** Has a high entry cost (humiliation) but a clear exit gate (forgiveness ritual).
      *   **Guilt (Modern/Secular):** Has a lower entry cost (private regret) but *no exit gate*.

  Your point is that an emotion with a high entry cost but a clear exit is functionally superior to an emotion with a low entry cost and no exit. This is a systems-design argument, not a psychological one.

  ### 4. Why This Pattern Exists

  The pattern you noticed exists because of how modernity handles morality.

  1.  **Guilt is Efficient for Control:** Institutions (schools, liberal states) prefer guilt because it creates self-policing subjects. If you police yourself, the institution doesn't have to spend energy watching you.
  2.  **Absolution is Expensive:** Reintegration requires community time and effort. A parent has to stop what they are doing to hug the kid and say "we're good." A community has to hold a circle to welcome back the offender. Guilt allows the institution to say, "Work it out internally," which is resource-cheap for the authority but resource-expensive for the individual.
  3.  **The "Disappointment" Trap:** In your parenting example ("I'm disappointed in your choice"), this is often called **Love Withdrawal** in developmental psychology. It induces guilt without offering the repair. It signals: *Your access to my approval is contingent on your behavior, and I will not tell you when it is restored.* That is the definition of the ritual deficit.

  ### Summary

  You have identified that **guilt is often sold as a feature (internal regulation) but functions as a bug (isolated rumination) when decoupled from communal absolution.**

  If you want to use this in writing or conversation, I suggest using the phrase **"The Reintegration Deficit of Guilt."**

  It captures the specific structural failure you noticed: we have successfully imported the *conviction* mechanism of guilt cultures without importing (or building) the *absolution* mechanism that religious or shame-based cultures often possess. We tell people how to be good, but we forgot to tell them how to be forgiven.
