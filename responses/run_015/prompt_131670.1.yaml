  *(Final Plan)*:
  1. Validate advisor.
  2. Table.
  3. Three major breaks (Physics vs. Normativity, The Meta-Metric, Reason Creation).
  4. Verdict: Analogy supports Williams/Nussbaum, undermines Chang.
  5. Better Analogy: Improvisation or Translation.
  6. Check on Chang reading.

