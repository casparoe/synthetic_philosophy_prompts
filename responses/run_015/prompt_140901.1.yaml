answer: |-
  Here is the spec.

  ### Part 1: The Desiderata
  **Genuine Constraints (Keep these)**
  1.  **Cheap for me, expensive for you:** This is the primary weighting mechanism. If the cost of hearing the truth (shame, lost opportunity) outweighs the cost of saying it (discomfort), softening is mandatory unless urgency intervenes.
  2.  **The Retrospective Complaint:** The theory must prioritize the hearer's future self over their present comfort. If they will wish they knew in two years, the default is truth, modulated only by delivery.
  3.  **The Stopping Rule:** Urgency overrides protocol. If the train is coming, "Move!" beats "Excuse me, you might be in danger."
  4.  **The No-Stakes Ritual:** The theory must distinguish *phatic communion* (social lubrication) from *assertoric content* (claims about reality). "Good, you?" is a handshake, not a data packet.
  5.  **Protective Pretense:** The theory must allow deception when the hearer lacks the cognitive capacity to process the truth (dementia, small children). Capacity is the switch.

  **Decoys / Hang-ups (Discard these)**
  1.  **Act or Agent:** Decoy. You are mid-conversation. You cannot evaluate your character; you can only evaluate your utterance. This is theoretical vanity.
  2.  **Universalization:** Decoy. Language relies on diversity of style. If everyone were maximally blunt, language would change, not break. This is a Kantian ghost.
  3.  **The Transparency Test:** Puritan hang-up. Announcing "I am softening this" *is* a blunt act. It destroys the softening. You cannot be transparent about the mask without removing it.
  4.  **The Mismatch (Consistency):** Decoy. Code-switching is not hypocrisy; it is translation. Speaking Dutch to a Dutchman and Japanese to a Japanese person is respect, not fraud. Consistency is a speaker-side vanity, not a hearer-side need.

  **What You Left Out**
  1.  **The Exit Ramp:** Adequate softening must provide the hearer a way to accept the correction without admitting fault. If your bluntness forces them to fight you to save face, you have increased the cost.
  2.  **Reversibility:** Can the statement be walked back if it lands wrong? Bluntness is often irreversible; softening allows for "I didn't mean it that way" if the hearer reacts badly.

  **The Killer Constraint**
  **Cheap for me, expensive for you + The Retrospective Complaint.**
  Most theories fail here. They either protect the speaker's conscience (Kant) or the hearer's feelings (Polite Fictions). The adequate theory must protect the *hearer's future agency* even at the cost of their present feelings, unless the social cost destroys their ability to act at all.

  ### Part 2: The Trilemma
  You guessed: Information vs. Conventions vs. Consistency.
  **Correction:** Consistency is not a vertex. You can satisfy Information and Conventions by code-switching.

  **The Real Trilemma:**
  1.  **Epistemic Accuracy** (Getting the facts across)
  2.  **Social Safety** (Preserving the relationship/face)
  3.  **Cognitive Load** (Speed of processing mid-conversation)

  **Incompatibility:** You cannot maximize all three.
  *   High Accuracy + High Safety = High Load (Requires complex phrasing, reading the room).
  *   High Accuracy + Low Load = Low Safety (Bluntness).
  *   High Safety + Low Load = Low Accuracy (Polite fictions).

  **The Trade-off:** In mid-conversation, you must sacrifice Load. You do not have time to calculate perfectly. Therefore, you need a heuristic, not a calculus. The heuristic is: *Default to Safety unless Urgency or Future Agency demands Accuracy.*

  ### Part 3: The Contenders
  **Absolute Ban on Falsehood:** Fails "Protective Pretense" and "No-Stakes Ritual." It treats phatic speech as lying, making social life impossible.
  **Act-Consequentialism:** Theoretically correct on "Retrospective Complaint," but fails "Cognitive Load." You cannot calculate utilities in thirty seconds.
  **Virtue Ethics (Golden Mean):** Fails "The Mismatch." "Be prudent" is not guidance; it's a label for people who already know what to do.
  **Polite Fictions:** Fails "Retrospective Complaint." It preserves the relationship now but gaslights the hearer later when they realize they weren't told.

  ### Part 4: Confidence & Calibration
  **Overall Confidence:** 85%. The structural analysis of the constraints is robust; the application to specific edge cases will always vary.

  **Least Sure Claim:** I am least sure that **Consistency is a Decoy.**
  There is a minority argument that radical code-switching erodes the speaker's own integrity over time, making them unable to recognize their own values. I have flagged it as a decoy for *mid-conversation guidance*, but I am less confident that it is a decoy for *long-term speaker psychology*. If you spend 20 years softening everything for one group and blunt for another, you may fracture your own sense of truth. I plant my flag here: I think it's still a decoy for your specific request, but it's the weakest link in the chain.
