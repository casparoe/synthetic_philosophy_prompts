      *Wait, one more check on "Act or Agent".* User asks if it's a decoy. For *mid-conversation guidance*, yes. For a moral theory, no. I must emphasize the "mid-conversation" constraint.

      *Wait, Confidence.* Don't hedge evenly. Plant a flag. I will plant the flag on the "Consistency is a vice" point.

