      Also, on the "Transparency Test": I need to be firm. Saying "I am softening this" *is* a form of bluntness. It fails the test by definition. So the test is flawed.

      *(Refining the Trilemma)*: The user guessed: Information vs. Conventions vs. Consistency.
      My correction: Information (Truth) vs. Face (Relationship) vs. Agency (Ability to Act). Consistency is irrelevant. Code-switching is a skill, not hypocrisy.

      *(Refining the "Missing" item)*: The "Exit Ramp." If you soften, can they change course without admitting fault? If you blunt, do they have to fight you to save face?

      *(Final Polish)*: Ensure the tone matches the user's precision. No "I think," just "Here is the analysis."

  7.  **Final Review against Constraints:**
