      *   *Missing:* The "Exit Strategy." Softening often needs to leave room for the hearer to save face *and* for the speaker to escalate if ignored.
      *   *Killer Constraint:* "Cheap for me, expensive for you" combined with "Retrospective complaint." Basically: *Actionability.* Can the hearer use this info to avoid harm without paying an unfair social cost?

  3.  **Analyze Incompatibilities (Task 2):**
      *   The user suspects a trilemma: Information Needed vs. Hearer Conventions vs. Speaker Consistency.
      *   My read: It's actually a dilemma between *Immediate Social Harmony* (Softening/Conventions) and *Long-Term Agency* (Bluntness/Truth). Consistency is a vanity metric. You *should* code-switch.
