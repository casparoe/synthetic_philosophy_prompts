prompt: |-
  So I've been going back and forth on illusionism about phenomenal consciousness for like two years now—ever since that Frankish paper made the rounds on the forum—and I keep noticing that discussions between illusionists and realists totally talk past each other because they're using different criteria for what would count as a successful theory. The realist says "you haven't explained the thing that most needs explaining" and the illusionist says "you're asking me to explain something that doesn't exist, that's like asking a theory of combustion to explain phlogiston." And then everyone just retrenches.

  I want to step back and get clear on the actual desiderata. If someone is going to defend illusionism—the view that phenomenal consciousness, the "what it's like"-ness, qualitative feels, whatever you want to call it, is an illusion and doesn't actually exist as we introspectively seem to find it—what does their theory actually have to deliver? Not just "explain why we're mistaken," but the full spec. What are the phenomena it has to account for? Which cases does it have to get right? Which distinctions can't it collapse without losing explanatory power? I'm thinking of things like: the apparent difference between access consciousness and phenomenal consciousness (illusionists often want to collapse this, but then they need to explain why the distinction felt so compelling and why it maps onto things like blindsight); the fact that we can talk about, reason about, and compare our "experiences" (the illusion has to be causally efficacious in some sense, or at least the mechanisms that generate the illusion do); the meta-problem of consciousness—why we think there's a hard problem at all; altered states from meditation or psychedelics where the "illusion" seems to change in structured ways; the fact that pain motivates action in a way that mere propositional knowledge doesn't, and an illusionist owes an account of that difference; and the apparent unity of the phenomenal field. I'm sure I'm missing some.

  What I'm especially interested in is which requirements are genuinely non-negotiable versus which are just intuition-pumps that realists have smuggled into the criteria. Like, is "preserve the intuition that there is something it is like to be me" a genuine desideratum, or is that exactly the thing the illusionist is trying to debunk and demanding they preserve it begs the question? And I want to know if there's some subset of the requirements that are jointly unsatisfiable—if so, that's itself a result about the viability of the position, and I'd rather know that upfront than spend another two years going in circles. If you want to do a quick scorecard for the main variants (Dennett-style, Frankish's strong illusionism, Graziano's attention schema, maybe the predictive processing crowd) against the list, that's fine, but I mostly care about the criteria themselves and the reasoning behind each one. The scoring is secondary.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Illusionism about phenomenal consciousness (the view that qualia/phenomenal consciousness don't exist as introspectively presented).
      *   **Problem:** Discussions between illusionists and realists talk past each other due to differing criteria for success.
      *   **Goal:** Define the *desiderata* (requirements/criteria) for a successful illusionist theory.
      *   **Specific Questions:**
          *   What phenomena must be accounted for?
          *   Which cases must be got right?
          *   Which distinctions can/cannot be collapsed?
          *   What is non-negotiable vs. question-begging?
          *   Are there jointly unsatisfiable requirements (impossibility results)?
          *   (Optional) Scorecard of variants (Dennett, Frankish, Graziano, Predictive Processing).
      *   **Tone/Level:** Philosophical, rigorous, meta-theoretical. The user is clearly well-read (mentions Frankish, forums, 2 years of debate).

  2.  **Deconstruct the Core Conflict:**
      *   *Realist Desideratum:* Save the phenomena (qualia exist, explain them).
      *   *Illusionist Desideratum:* Save the *judgments* about phenomena (qualia don't exist, explain why we think they do).
      *   *The Friction:* Realists think explaining the judgment *isn't enough* if the feeling itself is left out. Illusionists think the feeling *is* the judgment (or a misrepresentation thereof).
      *   *Key Insight:* The user wants to know what an illusionist *must* explain to be taken seriously, without begging the question against them.

  3.  **Brainstorming Desiderata (The "Spec"):**
      *   *The Meta-Problem:* Why do we say "I have qualia"? (Chalmers).
      *   *The Phenomenal Judgment:* The cognitive access to the state.
      *   *Motivation/Valence:* Why does pain hurt? Why does it drive behavior differently than knowing "my hand is on a stove"?
      *   *Discriminability:* Why can I tell red from green even if I can't name them?
      *   *Unity:* Why does the visual field feel like one thing?
      *   *Altered States:* Meditation, drugs, anesthesia. If it's an illusion, why does changing the brain change the *specific content* of the illusion?
      *   *Blindsight/Access vs. Phenomenal:* The dissociation cases.
      *   *Introspective Authority:* Why do I feel like I'm the expert on my mind?
      *   *Normativity:* Why does it seem like I *should* feel something?

  4.  **Categorizing Desiderata (Non-Negotiable vs. Question-Begging):**
      *   *Non-Negotiable:* Behavioral reports, neural correlates, functional roles (pain avoidance), the *structure* of the intuition (meta-problem).
      *   *Question-Begging:* "Explain the raw feel itself" (that denies the premise), "Preserve the intrinsic nature of qualia."
      *   *The Danger Zone:* If the illusionist explains the *judgment* so well that it implies the *feeling* exists, they collapse into realism. If they explain it so deflationarily that it doesn't match the *force* of the intuition, they fail to solve the meta-problem.

  5.  **Addressing the "Jointly Unsatisfiable" Question:**
      *   Is there a trilemma?
      *   1. Explain the robustness of the intuition.
      *   2. Deny the existence of the object of the intuition.
      *   3. Avoid positing a "real" surrogate that looks just like the original.
      *   *Risk:* The "Error Theory" trap. If the error is systematic and universal, is it really an error? (Evolutionary argument: Why would evolution select for a massive, energy-costly illusion with no functional benefit?)

  6.  **Developing the Framework:**
      *   I need to structure this as a "Specification Document" for Illusionism.
      *   **Section 1: The Core Commitment.** Define the target (Phenomenal Illusion).
      *   **Section 2: The Non-Negotiables (Functional/Structural).** What *must* be preserved to account for behavior and cognition.
      *   **Section 3: The Forbidden Moves (Question-Begging).** What the realist can't demand.
      *   **Section 4: The Danger Zones (Internal Coherence).** Where illusionists often trip up.
      *   **Section 5: The Impossibility Check.** Are the requirements consistent?
      *   **Section 6: Brief Scorecard.** As requested, but secondary.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining the "Pain" point:* It's not just that pain motivates. It's that pain motivates *intrinsically*. Illusionists need to explain "imperatival content" without qualia.
      *   *Refining the "Access vs. Phenomenal":* Illusionists usually say Access is all there is. But they need to explain the *intuition* of the gap (e.g., in blindsight).
      *   *Refining the "Meta-Problem":* This is the illusionist's home turf. They must explain the *source* of the realist intuition better than realists explain the *source* of qualia.
      *   *The "Hard Problem" translation:* The Hard Problem becomes the "Hard Problem of the Illusion." Why is the illusion so hard to see through?

  8.  **Evaluating the "Jointly Unsatisfiable" Hypothesis:**
      *   Consider the "Evolutionary Debunking" argument. If qualia are illusory, they have no causal power. If they have no causal power, why did the *belief* in them evolve? The belief must have causal power. If the belief has causal power, what is its content? If its content is false (no qualia), is it a useful fiction?
      *   *Potential Trilemma:* (1) The illusion is causally inert (epiphenomenal belief) -> Evolutionarily unlikely. (2) The illusion is causally efficacious -> Then the mechanism generating it is real, risking a return to realism. (3) The illusion is a useful fiction -> Requires explaining the utility of falsehood.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the user's frustration. Validate the "talking past" diagnosis.
      *   **Part I: The Positive Desiderata (What must be explained).** Focus on the *data* (reports, behaviors, neural states) not the *ontological commitment*.
      *   **Part II: The Negative Constraints (What cannot be demanded).** Distinguish between saving the *intuition* vs. saving the *object*.
      *   **Part III: The Danger Zones (Internal Consistency).** The "Real Surrogate" problem, the Evolutionary problem.
      *   **Part IV: The Impossibility Check.** Is there a contradiction? (Likely no logical contradiction, but high theoretical cost).
      *   **Part V: Scorecard.** Briefly map Dennett, Frankish, Graziano, PP.
      *   **Conclusion:** Summary of the burden of proof.

  10. **Refining Tone:**
      *   Ensure I don't sound like I'm taking a side. I am acting as a meta-philosophical referee.
      *   Use precise terminology (phenomenal judgments, introspective mechanisms, functional role).
      *   Address the specific examples the user gave (blindsight, pain motivation, psychedelics).

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Access vs. Phenomenal" distinction specifically? *Action:* Make sure to mention that illusionists must explain the *intuition* of the distinction, even if they deny the ontological distinction.
      *   *Check:* Did I address the "Pain" issue? *Action:* Focus on the motivational asymmetry between "knowing damage" and "feeling pain."
      *   *Check:* Is the distinction between non-negotiable and question-begging clear? *Action:* Use a specific section for this.
      *   *Check:* The user asked about "jointly unsatisfiable." *Action:* I need to be honest here. There isn't a logical proof of impossibility, but there is a "theoretical tension" regarding evolutionary utility and the nature of error.

  12. **Final Polish:** Check against Frankish's specific arguments (Quining the Qualia, The Meta-Problem). Ensure Graziano's AST is characterized correctly (attention schema as a model, not reality). Ensure Dennett's "Joycean Machine" is referenced appropriately.

  (Proceed to generate output based on this structure.)
answer: |-
  This is an exceptionally sharp diagnosis of the current dialectic. You are correct that the stalemate often arises because realists and illusionists are playing different games with different scorecards. The realist is playing "Save the Ontology" (qualia exist, explain them), while the illusionist is playing "Save the Data without the Ontology" (qualia don't exist, explain the data that makes us think they do).

  To break the deadlock, we need a **Specification Document for Illusionism**. Below is a breakdown of the desiderata, categorized by what is non-negotiable (functional/structural requirements), what is question-begging (ontological demands), and where the internal tensions lie.

  ---

  ### Part I: The Positive Desiderata (The "Must-Haves")

  An illusionist theory cannot simply say "qualia are fake." It must provide a mechanistic account of the *system that generates the report* that qualia are real. If the theory fails these, it is empirically inadequate.

  #### 1. The Meta-Problem (The Source of the Intuition)
  *   **Requirement:** The theory must explain why intelligent agents (us) make the specific claim "there is something it is like to be me."
  *   **Specifics:** It is not enough to say "we are mistaken." The theory must identify the cognitive mechanisms (introspective models, monitoring systems) that generate this specific false belief.
  *   **Why Non-Negotiable:** If the theory cannot explain the *origin* of the realist intuition, it hasn't solved the problem; it has just asserted a contrary ontology.

  #### 2. The Motivational Asymmetry (The Pain Problem)
  *   **Requirement:** The theory must explain why "phenomenal pain" motivates avoidance differently than "propositional knowledge of damage."
  *   **Specifics:** Knowing your leg is broken (access) does not compel you to move with the same urgency as the *suffering* of a broken leg. If qualia are illusory, the *illusion* must carry a specific functional weight (valence/imperatival content) that standard propositional states do not.
  *   **Why Non-Negotiable:** If the illusionist collapses pain into mere belief about damage, they fail to account for the behavioral and physiological urgency of nociception.

  #### 3. The Structure of the Illusion (Discriminability & Unity)
  *   **Requirement:** The theory must account for the *structural properties* of the reported experience.
  *   **Specifics:**
      *   **Discriminability:** Why can I tell red from green even when I can't access the names? The illusion must have high-resolution content.
      *   **Unity:** Why does the visual field appear as a unified whole rather than a disjointed set of sensor readings?
      *   **Temporal Flow:** Why does the illusion have a specific temporal grain (specious present)?
  *   **Why Non-Negotiable:** The illusion isn't a generic fog; it has precise geometry and topology. A theory that explains *why* we are fooled but not *how the fooling is structured* is incomplete.

  #### 4. The Dissociation Cases (Blindsight & Access/Phenomenal)
  *   **Requirement:** The theory must explain why the *intuition* of a gap between Access and Phenomenal consciousness arises, even if the gap isn't ontologically real.
  *   **Specifics:** In blindsight, patients deny seeing but guess correctly. In normal vision, they affirm seeing. The illusionist must explain what cognitive monitoring signal is present in the latter but absent in the former that generates the *report* of "phenomenality."
  *   **Why Non-Negotiable:** This is the realist's strongest empirical wedge. If illusionism cannot model the difference between blindsight and normal sight without invoking qualia, it loses explanatory ground.

  #### 5. Altered States (Psychedelics, Meditation, Anesthesia)
  *   **Requirement:** The theory must explain why pharmacological or training interventions change the *content* of the illusion in predictable ways.
  *   **Specifics:** If I take psilocybin, the "illusion" changes structure (boundaries dissolve, patterns emerge). If qualia don't exist, what is being modified? The theory must map neural changes to changes in the *introspective model*.
  *   **Why Non-Negotiable:** If the "illusion" is immune to physical intervention, it's magic. If it is sensitive to physical intervention, the mechanism generating it must be physically robust.

  ---

  ### Part II: The Negative Constraints (The "Question-Begging" Demands)

  Realists often smuggle ontological commitments into the criteria for success. An illusionist is entitled to reject these without failing the theory.

  #### 1. "Explain the Raw Feel Itself"
  *   **Verdict:** **Question-Begging.**
  *   **Reasoning:** This demands the illusionist explain the existence of the very thing they deny. The correct demand is "Explain the *judgment* that there is a raw feel."
  *   **Caveat:** The illusionist must explain why the judgment *seems* to be about a raw feel rather than a judgment. (i.e., The error must be *introspectively invisible*).

  #### 2. "Preserve the Infallibility of Introspection"
  *   **Verdict:** **Question-Begging.**
  *   **Reasoning:** Realists often argue, "I can't be wrong about whether I'm in pain." Illusionism *requires* that introspection is fallible (specifically, prone to misrepresentation). Demanding infallibility is demanding the falsity of illusionism by definition.
  *   **Requirement:** Instead, the illusionist must explain why introspection *seems* infallible (e.g., because the monitoring system has no access to its own error-checking mechanisms).

  #### 3. "Explain How the Illusion Has Causal Power"
  *   **Verdict:** **Ambiguous / Trap.**
  *   **Reasoning:** If the realist means "How does the *non-existent qualia* cause things?", that's a category error. If they mean "How does the *mechanism generating the illusion* cause things?", that is a valid demand.
  *   **Trap:** Realists often argue: "If the qualia don't exist, they can't cause me to say 'I see red.' Therefore, something real (qualia) must exist."
  *   **Illusionist Response:** The *neural state* causes the report. The neural state *represents itself* (misleadingly) as having qualitative properties. The causal work is done by the vehicle, not the (non-existent) content.

  ---

  ### Part III: The Danger Zones (Internal Coherence)

  These are not demands from realists, but internal consistency checks for the illusionist. This is where the "Jointly Unsatisfiable" risk lies.

  #### 1. The Evolutionary Debunking Dilemma
  *   **The Tension:**
      1.  The illusion of consciousness is complex and metabolically expensive.
      2.  Evolution generally selects for truth-tracking or functional utility.
      3.  If qualia are illusory, they have no causal power (by definition).
      4.  If they have no causal power, why did the *belief* in them evolve?
  *   **The Requirement:** The illusionist must show that the *false model* provides a functional advantage over a *true model* (or no model).
      *   *Example:* Perhaps a simplified, "user-illusion" model of internal states is computationally cheaper than a full physical self-model, even if it misrepresents the ontology. (Graziano's AST leans here).
  *   **Risk:** If the illusion has no functional benefit, illusionism becomes an error theory about a spandrel, which is viable but less attractive. If it *does* have a benefit, the realist will argue the benefit *is* the phenomenal property, re-collapsing into realism.

  #### 2. The "Real Surrogate" Problem
  *   **The Tension:** To explain the data, the illusionist posits a mechanism (e.g., a "phenomenal concept" or "attention schema").
  *   **The Requirement:** This mechanism must do all the work qualia were supposed to do (motivation, discrimination, unity).
  *   **Risk:** If the surrogate mechanism does everything qualia were supposed to do, and has the same structural properties, the realist will argue: "You've just reinvented qualia and given it a different name." (e.g., "Functional Qualia").
  *   **Constraint:** The illusionist must walk a tightrope where the surrogate is *functionally isomorphic* to qualia but *ontologically deflated*.

  #### 3. The Hard Problem of the Illusion
  *   **The Tension:** Chalmers' Meta-Problem asks why we *say* there is a hard problem.
  *   **The Requirement:** The illusionist must explain why the illusion is so *persuasive* that even experts after centuries of debate cannot see through it.
  *   **Risk:** If the explanation for the illusion is too weak, it doesn't explain the realism. If the explanation is too strong (i.e., "the brain is hardcoded to believe this"), it risks making the belief *incorrigible*, which functionally mimics the truth of realism.

  ---

  ### Part IV: Are the Requirements Jointly Unsatisfiable?

  There is no logical proof that these are unsatisfiable, but there is a **Theoretical Trilemma** for the Illusionist:

  1.  **Explanatory Adequacy:** The theory fully explains the behavioral/cognitive data (pain avoidance, color discrimination, reports).
  2.  **Ontological Parsimony:** The theory posits no phenomenal properties (strict physicalism).
  3.  **Introspective Plausibility:** The theory explains why the error is undetectable from the inside.

  **The Conflict:**
  *   To satisfy (1), you need a rich internal model.
  *   To satisfy (3), that model must present itself as direct and non-representational (to explain why we don't see it as a model).
  *   To satisfy (2), you must insist this presentation is false.
  *   **The Squeeze:** If the model is rich enough to drive behavior (1) and opaque enough to fool the subject (3), it begins to look functionally identical to the "real thing" the realist wants. The illusionist must argue that **function does not imply ontology.** If the user accepts that, illusionism works. If the user holds that "functionally identical to qualia = qualia," illusionism fails.

  **Conclusion on Viability:** The requirements are not logically inconsistent, but they require the illusionist to bite a specific bullet: **The Bullet of Radical Misrepresentation.** They must argue that introspection is not just fallible, but *systematically* and *universally* misleading about the fundamental nature of mental states, without this misleading nature undermining the reliability of the cognitive system as a whole.

  ---

  ### Part V: Brief Scorecard of Variants

  Here is how the main contenders stack up against the Non-Negotiables.

  | Theory | Meta-Problem (Source of Intuition) | Motivational Asymmetry (Pain) | Dissociation (Blindsight) | Evolutionary Utility | Risk Profile |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Dennett (Heterophenomenology)** | **Pass.** Judgments are verbal dispositions. | **Weak.** Struggles to explain the *urgency* of pain without qualia. Often accused of explaining it away. | **Pass.** Explains blindsight as lack of "fame in the brain." | **Unclear.** Focuses on evolutionary history of language/reporting. | **High.** Often feels like denialism rather than explanation. |
  | **Frankish (Strong Illusionism)** | **Strong.** Explicitly targets the Meta-Problem. Quasi-phenomenal properties. | **Moderate.** Uses "imperatival content" of experience to explain motivation. | **Strong.** Distinguishes between monitoring systems. | **Moderate.** Argues the illusion is a useful user-interface. | **Medium.** Clearer on the "error" than Dennett. |
  | **Graziano (AST)** | **Strong.** The brain models attention as a vague, magical thing. | **Strong.** Attention schema drives behavior like a controller. | **Strong.** Blindsight = lack of schema update. | **Strong.** Schema is for control of attention, evolved utility is clear. | **Low.** Most mechanistic, but risks reifying the "schema" as a qualia-surrogate. |
  | **Predictive Processing (PP)** | **Moderate.** Intuition arises from precision-weighting of prediction errors. | **Strong.** Pain is high-precision error signal demanding update. | **Moderate.** Blindsight is low-precision visual channel. | **Strong.** Illusion is a compression heuristic. | **Medium.** Risks collapsing into realism if "precision" feels like qualia. |

  ### Summary Recommendation

  If you are evaluating an illusionist theory, do not ask: *"But where is the feeling?"*
  Ask: *"Does your model of the introspective mechanism predict the specific errors we make?"*

  **The Non-Negotiable Test:**
  Can the theory predict a scenario where a human would report having an experience they aren't having, or deny an experience they are having, based *solely* on the mechanics of the proposed illusion? (e.g., specific neural lesions, specific cognitive loads).

  If an illusionist theory can predict *introspective errors* better than a realist theory can predict *introspective truths*, it wins on empirical grounds, regardless of the ontological stalemate. If it cannot predict errors, it is merely a philosophical stance, not a scientific theory.

  Most current illusionist theories are strong on the *philosophy* of the error but weak on the *prediction* of the error. That is where your next two years of research should focus if you want to break the deadlock.
