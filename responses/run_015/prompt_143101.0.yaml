answer: |-
  You are describing one thing, not three. Your hunch is correct: the relocation of the money and the scoring of the reform are causally coupled by the same constraint.

  There is no single canonical term in the literature that captures this specific coupling of *legal operability* and *evaluation error*. The closest existing concept is **Surrogation** (from organizational behavior and management accounting), which describes when a substitute measure replaces the actual goal. However, standard Surrogation doesn't account for the *legal necessity* that forces the surrogate.

  I propose calling this **Statutory Surrogation**.

  Here is the concept, its edges, and how it handles your specific cases.

  ### The Concept: Statutory Surrogation

  **Definition:**
  Statutory Surrogation occurs when a regulation must target an observable *mechanism* (a channel) to be legally enforceable, rather than the abstract *outcome* (influence) it intends to change. Because the statute defines success as the suppression of the mechanism, evaluation defaults to measuring that mechanism. When the underlying activity relocates to an unregulated mechanism, the reform is scored as a success (the regulated channel is dry) or a failure (the regulated channel is wet), while the actual outcome (influence) remains unmeasured and unchanged.

  **Why it is one thing:**
  You cannot separate the relocation from the scoring. Because the law *must* name a channel to be valid, it *must* use that channel as the metric for compliance. The "waterbed effect" (relocation) is not an unfortunate side effect; it is the predictable physical response to a constraint that only covers part of the system. The "scoring error" is not negligence; it is the only score the statute makes available. They are two symptoms of the same structural constraint: **Legal Operability.**

  ### Distinctions from Near-Misses

  *   **Goodhart's Law:** Goodhart's Law states, "When a measure becomes a target, it ceases to be a good measure." In Goodhart, the metric *breaks* (the correlation between metric and goal dissolves because actors game the metric). In Statutory Surrogation, the metric *holds* (the channel volume is accurately measured), but it was never a complete proxy for the goal to begin with. The failure is not corruption of the metric, but **incompleteness of the target**.
  *   **Regulatory Arbitrage:** Arbitrage implies actors are actively hunting for gaps between rules. Statutory Surrogation does not require hunting. Actors simply optimize within the new rule set. The relocation happens even if no one is trying to "evade" the law, merely by following the new incentives the law created.
  *   **The Waterbed Effect:** This describes the displacement (money moves). It does not explain why we continue to measure the empty side of the bed. Statutory Surrogation explains the *evaluation* failure that accompanies the displacement.
  *   **The Streetlight Effect:** This describes searching where the light is. Statutory Surrogation explains *why the light is there* (you can't legislate in the dark) and *why we refuse to move the light* (the statute defines the lit area as the goal).

  ### Intentionality

  **Purely Structural.**
  Statutory Surrogation does not require anyone to intend the relocation, nor does it require reformers to intend to deceive.
  *   **Actors:** Do not need to intend to evade; they only need to pursue their interests within the new constraints.
  *   **Reformers:** Do not need to intend to hide the failure; they are structurally incentivized to claim victory based on the only number the law gives them.
  *   **Evaluators:** Do not need to be negligent; the "outcome" data (influence) is often unknowable, while the "channel" data (registrations) is public.

  ### The Genuine Non-Instance

  To identify a non-instance, we need a reform that changes **how much money buys** rather than **where money flows**. This requires attacking the *exchange rate* of influence, not the *plumbing*.

  **Example: Demand-Side Liability.**
  A reform that imposes severe, personal penalties on the *recipient* of the influence (the official) for voting in correlation with donor preferences, enforced by random audit rather than disclosure.
  *   **Why it's a non-instance:** It does not ban a channel (money can still flow). It raises the *cost* of the outcome. If the penalty for a quid pro quo is jail, the "price" of buying a vote exceeds the budget of most donors, regardless of whether they use a PAC, a trade association, or a shell company.
  *   **The Metric:** Success is measured by the *correlation* between donations and votes (the outcome), not the volume of donations (the channel).
  *   **Result:** Money might not relocate; it might simply stop being spent because the ROI has dropped. This breaks the Statutory Surrogation loop because the statute targets the *outcome mechanism* (the vote) rather than the *supply mechanism* (the donation).

  ### Handling Your Two Cases

  **(a) Court Decision Reopens the Channel**
  **Verdict: Distinct Phenomenon (Judicial Nullification).**
  This is **not** Statutory Surrogation.
  *   **Why:** In Statutory Surrogation, the law works as written (the channel closes), but the goal fails (money moves). In this case, the law *stops working* (the channel reopens).
  *   **The Metric:** If the channel reopens and money flows back in, the channel metric accurately reflects the failure of the *rule*, not the success of the *reform*. The evaluation is actually correct here: the reform failed because the channel is open. Statutory Surrogation is when the evaluation claims success *despite* the goal failing.
  *   **Classification:** This is a failure of legal stability, not a failure of metric substitution.

  **(b) Public Financing with Small-Donor Matching**
  **Verdict: Non-Instance (The Antidote).**
  This is **not** Statutory Surrogation; it is the structural solution to it.
  *   **Why:** Statutory Surrogation relies on the link between *Channel Volume* and *Influence* remaining constant while the channel moves. Public financing changes the *physics* of that link.
  *   **The Mechanism:** By flooding the system with small-donor money, you dilute the causal weight of any single large dollar. The total money might go up (channel metric looks "worse"), but the *marginal influence* of a specific dollar goes down (outcome metric looks "better").
  *   **Classification:** This is an **Outcome-Focused Reform**. It accepts that you cannot stop the flow (the channel), so it changes the viscosity of the water. It breaks the coupling between "money moving" and "sway buying." If evaluated correctly (by measuring sway, not volume), it is a success. If evaluated by Statutory Surrogation standards (volume), it looks like a failure. Therefore, it is a different animal entirely.

  ### Summary of Edges

  *   **It IS Statutory Surrogation if:** The law bans a specific transaction type, success is measured by the reduction of that transaction type, and influence persists via a different transaction type.
  *   **It IS NOT Statutory Surrogation if:** The law changes the *cost* of the outcome (Demand-Side), or if the law changes the *weight* of the money (Public Financing), or if the law is struck down (Judicial Nullification).

  You are not getting annoyed at the same article; you are identifying a structural blind spot in how policy is written and evaluated. The "word" is **Statutory Surrogation**, and the insight is that **operability dictates evaluation.**
