  # METAPHYSICS READING GROUP: GROUNDING & FUNDAMENTALITY
  ## Self-Sorting Decision Instrument (Final Session)

  **Instructions:** Proceed through the numbered nodes in order. At each node, select the option that best matches your intuition about the specific case described. Follow the path indicated by your choices to arrive at your assigned leaf position. Do not worry about the names of the views; answer based on the cases.

  ---

  ### THE BRANCHING NODES

  **Node 1: The Disjunction Case**
  Consider the truth: *"It is raining or it is snowing."* This is true because *"It is raining"* is true. Now consider the truth: *"The table exists."* This is true because *"Particles are arranged tablewise."*
  *   **(A)** The 'because' is the same single relation in both cases. (Go to Node 2)
  *   **(B)** The 'because' is different; logical grounding is distinct from metaphysical grounding. (Go to Node 8)
  *   **(C)** There is no robust 'because' here; this is just how we speak, not how the world is. (Go to **Leaf 1**)

  **Node 2: The Singleton Case**
  Consider the singleton set *{Socrates}*. It exists because *Socrates* exists. Does this grounding relation hold primarily between **objects** or between **facts**?
  *   **(A)** Between objects (Socrates grounds {Socrates}). (Go to Node 3)
  *   **(B)** Between facts (The fact that Socrates exists grounds the fact that {Socrates} exists). (Go to Node 3)
  *   **(C)** Between vocabularies (The term '{Socrates}' is defined by 'Socrates'). (Go to **Leaf 2**)

  **Node 3: The Table Case**
  Consider a table and the particles arranged tablewise. Which is more fundamental?
  *   **(A)** The particles are fundamental; the table is derivative. (Go to Node 4)
  *   **(B)** The whole cosmos is fundamental; the particles are derivative abstractions. (Go to **Leaf 3**)
  *   **(C)** Neither; fundamentality applies only to the description, not the entities. (Go to **Leaf 4**)

  **Node 4: The Regress Case**
  Trace the grounds of the table back. Is an infinite chain of grounds intelligible, or must it stop?
  *   **(A)** It must stop at a fundamental base. (Go to Node 5)
  *   **(B)** Infinite chains are perfectly intelligible and possible. (Go to **Leaf 5**)
  *   **(C)** Chains never truly stop, but the "fundamental" is a limit we approach rather than a level we reach. (Go to **Leaf 6**)

  **Node 5: The Laws Case**
  Consider the fundamental base (e.g., particles + laws). Does this base **determine** every other truth about the world?
