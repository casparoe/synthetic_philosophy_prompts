answer: |-
  **The Moral Mathematics of Batches: Why Mechanism Does Not Absolve**

  The inefficacy objection is the most seductive argument in the ethics of consumption. It suggests that because a single individual act (buying a chicken, taking a flight) is causally negligible, it is morally negligible. The "Sealed-Batch" case is designed to sharpen this intuition. It presents a world where harm is lumpy, threshold-based, and probabilistic. By introducing three variants—Opaque, Transparent, and Smooth—we are forced to confront whether the *structure* of the causal mechanism determines the *structure* of our moral obligations.

  This essay argues that the ordinary consumer has a decisive moral reason not to buy the chicken in all three variants. While intuitive moral reasoning suggests the verdict should differ—condemning the Opaque purchase while permitting the Transparent one—this intuition relies on a fetishization of causal precision that collapses under scrutiny. To allow the shape of the supply chain to dictate moral permissibility is to surrender morality to luck. The obligation not to participate in systematic harm rests on *ex ante* rationality, the avoidance of complicity, and the rejection of the "loophole" mentality, regardless of whether the specific act triggers a discrete batch or merely adds to a smooth curve of demand.

  **The Variants and the Intuition Gap**

  At first glance, the three variants seem to demand three different verdicts.

  In **Variant 1 (Opaque)**, the math is straightforward. My purchase carries a 1-in-10,000 probability of triggering a batch of 10,000 birds. The expected value is one dead bird. Since killing a bird is presumptively wrong, and I am imposing this risk for a trivial gain (a meal), the act is prohibited. This is the standard expected-utility defense against inefficacy.

  In **Variant 3 (Smooth)**, there is no threshold. My purchase certainly causes harm, but it is a microscopic increment of suffering distributed across the flock. If we accept that microscopic harms aggregate to macroscopic wrongs, then I am contributing to a harm that is, in total, identical to the Opaque case. The only difference is the distribution of the pain. If morality cares about the sum of suffering, Variant 3 is morally equivalent to Variant 1.

  **Variant 2 (Transparent)** is the trap. Here, I can check the tally and see that I am the 5,000th buyer in a 10,000-batch. Causally, my purchase does nothing. No bird dies because of me. The expected value is zero. If morality is solely about actual consequences, Variant 2 is permissible.

  However, if we accept that Variant 2 is permissible while Variant 1 is not, we commit ourselves to a moral theory where the *knowability* of harm matters more than the *risk* of harm. This implies that a consumer who is too lazy to check the tally is immoral, while the diligent consumer who checks the tally and buys is moral, even though both are sustaining the same industry. This is indefensible. It suggests that the moral wrongness of buying the chicken lies not in the support of a killing industry, but in the statistical bad luck of buying at the wrong time. A robust moral theory cannot depend on whether the processor's spreadsheet is public. Therefore, the verdict should not differ. The intuition that it does reveals that we are often confusing *causal efficacy* with *moral responsibility*. We feel absolved in Variant 2 not because we did no harm, but because we can tell ourselves a story where we are innocent. That psychological comfort is not a moral argument.

  **Expected Value and Deterministic Ignorance**

  The strongest challenge to this view comes from the "awkward version" of expected value in Variant 2. If the mechanism is deterministic and I *know* I am mid-block, the probability is not ontological (a real chance in the world) but epistemic (a measure of my ignorance). If I know the outcome is zero, why calculate an expected value of one?

  The reply lies in the fragility of that knowledge and the nature of *ex ante* reasoning. First, in any real-world scenario, "Transparent" data is never perfectly synchronous. There is latency between purchase and tally update. There is room for error in my calculation. Relying on the "I'm safe" defense requires a level of epistemic certainty that supply chains rarely provide. To act on the assumption that the data is perfect is to gamble with the lives of animals on the accuracy of a website.

  Second, and more importantly, *ex ante* reasoning governs moral decision-making before the fact. Before I check the tally, I am facing an Opaque scenario. The decision to check the tally is itself a strategic maneuver to evade responsibility. If I adopt a policy of "I will buy chicken whenever the tally says I'm safe," I am treating the moral constraint as a loophole to be exploited rather than a boundary to be respected. This shifts the moral focus from "Is this practice good?" to "Can I get away with this?"

  Furthermore, even if I *could* know with metaphysical certainty that my act causes zero harm, the expected value calculation applies to the *policy* of buying, not just the *act*. If everyone adopted the policy "Buy only when mid-block," the system would adjust. But more critically, moral reasoning is guidance for agents under uncertainty. We do not get to retroactively justify an act based on information that was only available after we decided to engage with the system. By entering the market, I subject myself to the risks of that market. If the market is lumpy, I bear the risk of the lump. I cannot demand that the universe align its causal mechanisms with my desire for moral cleanliness.

  **Doing Your Part and the Free Rider**

  A common reply to inefficacy is the "Do Your Part" argument: even if my individual act doesn't trigger a batch, I am part of a collective that does. I have a duty to join the boycott collective.

  The obvious comeback is the Free Rider objection: "Why should I sacrifice my pleasure if the other 9,999 people won't join me? My part is pointless unless it helps reach the threshold."

  This comeback fails because it misunderstands the obligation. The obligation is not conditional on success. It is an obligation of *integrity*, not just *outcome*. If I refuse to buy because I believe the practice is wrong, my act has value as a statement of non-complicity, regardless of whether it tips the scale. But in the Sealed-Batch case, we can go further. The "pointless sacrifice" argument assumes that the only way to make a difference is to trigger a batch *today*.

  However, demand signals are not instantaneous; they are cumulative. My purchase adds to the quarterly average. Even if it doesn't trigger a batch *now*, it raises the baseline for the *next* contract window. The "Free Rider" assumes a static system where my purchase is isolated. In reality, my purchase is a data point that informs the moving average. By buying, I am actively voting for a higher production baseline in the next window. The "Do Your Part" reply is not just about symbolic solidarity; it is about recognizing that the "threshold" is not a cliff edge but a ratchet. Every purchase tightens the ratchet. To say "my part is pointless" is to ignore the temporal extension of the supply chain. I am not just buying a chicken; I am buying a future contract.

  **The Unit of Assessment: Habits vs. Acts**

  There is a tempting way to resolve the inefficacy objection: change the unit of assessment. Perhaps we should not evaluate single purchases, but rather lifetime consumption habits or personal policies. Over a lifetime, I will definitely cross multiple batch boundaries. Therefore, the habit is wrong, even if the single act is ambiguous.

  This view is partially correct but dangerous if taken too far. It is correct because it acknowledges that moral life is lived in patterns, not isolated atoms. A single flight might not trigger a new route, but a habit of flying certainly sustains the airline's expansion plans. If we evaluate the *policy* of "I eat chicken whenever I want," the expected value skyrockets, and the inefficacy objection dissolves.

  However, this view commits us to a form of "moral budgeting" that can be too permissive. If the unit of assessment is my lifetime total, does that mean I am permitted to buy the chicken *this time* as long as I promise to boycott later? Does it let me off the hook for a one-off flight because I haven't reached my "flight threshold" yet?

  We must reject this. The unit of assessment should be the *act*, evaluated under the *risk* that it belongs to a harmful pattern. We cannot know the future. I might intend to boycott later, but I might not. To permit the act now based on a promise of restraint later is to borrow against a moral credit I do not possess. The "Habit" view should not be used to excuse individual acts; it should be used to explain why individual acts feel weightless when they are actually part of a heavy chain. The verdict on the single chicken remains "do not buy" not because it guarantees a batch trigger, but because it is an instance of a policy that I know, *ex ante*, will cause harm over time. To make an exception for the single case is to undermine the policy.

  **When the Objection Actually Works**

  For the inefficacy objection to genuinely excuse a consumer, specific conditions must be met. The consumer would need:
  1.  **Perfect Causal Isolation:** Assurance that the purchase generates no signal, no data point for averages, and no reinforcement of social norms.
  2.  **Perfect Knowledge:** Certainty (as in Variant 2) that no threshold is crossed, without error or latency.
  3.  **No Complicity:** A guarantee that the act does not express support for the institution or normalize the behavior for others.
  4.  **No Systemic Leakage:** Assurance that the chicken bought would otherwise go to waste (no displacement).

  Are real supply chains close enough to this for the objection to work? No. Real supply chains are noisy. Contracts have leakage; rounding is not the only adjustment mechanism; demand signals are interpreted by algorithms that smooth out spikes but react to trends. The "Transparent" variant is a theoretical fiction; in practice, data is lagged, and consumer behavior is unpredictable.

  Moreover, the "Inefficacy Objection" often relies on a narrow view of causation. It ignores *expressive* causation. By buying the chicken, I signal to my peers that this is acceptable. I normalize the consumption. This social causation is real, even if the industrial causation is lumpy. The objection fails in practice because it assumes a vacuum where the consumer is invisible. In reality, the consumer is a node in a network.

  **Conclusion**

  The inefficacy objection attempts to find a gap in the causal chain where moral responsibility falls through. The Sealed-Batch case shows us that even if such a gap exists theoretically (Variant 2), it is morally irrelevant. We cannot build a moral life on the hope that we are currently in a causal gap.

  The verdict is uniform across all three variants: the consumer has a moral reason not to buy. In Variant 1, it is a risk of direct harm. In Variant 3, it is a certainty of microscopic harm. In Variant 2, it is an act of complicity in a system known to cause harm, relying on fragile knowledge to claim exemption. To argue otherwise is to claim that morality is a game of accounting where the goal is to technically avoid triggering a ledger entry, rather than a commitment to not participating in harm.

  The shape of the mechanism should not matter. If it does, we have reduced ethics to a lottery. We do not get to pick the causal mechanism that absolves us. The supply chain is a black box of suffering; to purchase from it is to gamble with lives. The only winning move is not to play.
