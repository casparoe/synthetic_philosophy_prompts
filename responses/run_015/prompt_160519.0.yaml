answer: |-
  **RFC-892: Biostatistical Classification Service (BCS)**

  **1. Objective**
  Implement a deterministic service accepting user biometrics and lifestyle vectors, returning `is_disease: boolean`. Per management directive, the logic must be value-neutral. We adopt the Biostatistical Theory (BST): disease is sub-typical functional capacity relative to a reference class. Harm is irrelevant; only statistical deviation from species-typical function matters.

  **2. Reference Class Selection**
  To determine "typical," we must partition the population. Age and sex are trivial columns. Genetic ancestry markers are required for tighter statistical variance on enzyme levels and bone density. While socially sensitive, excluding ancestry increases false positives in non-European cohorts, violating the accuracy SLA. We will store these tags encrypted, used solely for percentile ranking.

  **3. Environmental Baseline**
  BST requires assessing function in a "normal environment." Evolutionarily, this is the savannah. Practically, 90% of our users operate in sedentary, indoor, high-particulate environments. Flagging hypoxia or lumbar dysfunction based on Pleistocene norms would return `true` for 80% of the user base, breaking downstream billing integrations.
  *Decision:* Define "normal environment" as current OECD average conditions. Sedentary metabolism is the baseline. If the average human spine fails under 8-hour sitting loads, spine failure is statistically typical. Therefore, chronic lower back pain returns `is_disease: false`.
  *Workaround:* To allow claims processing, we will tag these as `functional_maintenance_required` rather than `pathology`. The health outcome is identical; the boolean differs.

  **4. Functional Telos**
  We must define what organs are "supposed to do." We hardcode survival and reproduction as the primary biological functions. Any subsystem reducing expected reproductive output is a dysfunction.
  *Edge Case:* Contraception usage. If a user intentionally suppresses ovulation, is this a disease?
  *Resolution:* No. The *mechanism* is functioning correctly (responding to chemical input). The *outcome* is reduced reproduction, but the organ is not failing. However, involuntary infertility must return `true`, regardless of user desire for children. The system does not track desire.

  **5. Rejected Alternatives**
  We evaluated the Normativist model, where `is_disease` requires dysfunction plus a social judgement that the condition is "bad" or "undesirable."
  *Rejection Reason:* Instability. This model couples biological status to contemporary moral consensus. Historical medical manuals classified homosexuality as a disorder because it deviates from reproductive function. The Normativist model removed this classification not because the biology changed, but because social values shifted. This introduces non-deterministic behavior into the core schema. If social values shift again, the API returns different booleans for the same biometrics. We cannot ship a service where truth depends on the political climate. The BST model remains stable: if a trait reduces reproductive fitness, it is a dysfunction, regardless of whether society currently approves of it.

  **6. Implementation Notes**
  Engineers should note that `is_disease` does not imply `needs_treatment`. Treatment necessity is a value judgement handled by the downstream billing microservice. Our job is strictly truth-tracking biological deviation.

  ***

  **Author's Note on Liberties Taken**
  This doc leans heavily on Christopher Boorse's Biostatistical Theory (1977). I am treating "species-typical function" as objectively derivable from data, ignoring the contested philosophical claim that selecting *which* functions count (e.g., reproduction over pleasure) is itself a value judgment. The doc assumes the "naturalist" position is coherent enough to code, despite the normative choices hidden in the reference class and telos definitions.
