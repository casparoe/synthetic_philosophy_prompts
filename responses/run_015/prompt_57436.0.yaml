  ### 1. Corrections to Your Cases

  Before deriving the principle, I must correct two arithmetic and logical features in your constructions. These corrections are necessary to ensure the principle rests on sound premises.

  *   **Case 2 (Hundred Tickets):** You state there is "no possibility in which she is guaranteed to lose." This is correct (she profits if 2+ tickets win). However, you claim she is "considerably more irrational" than Case 1. By standard measures, Case 1 violates the **axioms of probability** (incoherence), while Case 2 satisfies probability axioms but violates **Expected Utility Maximization** (imprudence). They are structurally different defects. Case 1 is a logical contradiction in beliefs; Case 2 is a contradiction between beliefs and actions. I will treat them as distinct violations of a broader "Self-Sabotage" norm, but you should not conflate incoherence with negative expectation.
  *   **Case 6 (Deferring to Future Self):** You write: "I recognize that a bookie who buys from my future self and sells to me can thereby lock in a loss." This is only true if you *accept* the bet now at odds matching your future credence. You state your verdict is "refusing is fine." If you refuse the bet now, the bookie cannot sell to you now. The "pump" requires you to violate the **Reflection Principle** by acting now on future credences you do not yet hold. If you refuse, you are not pumpable. Your verdict is correct, but your justification ("knowingly accepting pumpability") is factually wrong if you refuse the bet.

  ### 2. The Object of Assessment

  Your cases (specifically 1 and 5) demonstrate that rationality cannot attach to individual acts of acceptance in isolation. In Case 1, each act is locally optimal (positive expectation); in Case 5, each swap is locally voluntary. The defect arises only when acts are linked.

  Therefore, the object of assessment is not a credence, a preference, or a single bet. It is a **Betting Policy**.

  **Definition:** A *Betting Policy* is a function that maps every possible information state (time, evidence, current credence) to a decision rule (e.g., "Accept any bet with price $P < \text{Credence}$").

  **Individuation:** Collections of bets are individuated by the *Policy* that generates them. Two bets belong to the same collection if they are both accepted by the same standing rule or plan. A policy is defective if the *set of outcomes it generates* is dominated by an alternative policy.

  ### 3. The Principle: Foreseeable Policy Dominance

  **Principle:** *A betting policy is irrational if and only if, at the time of adoption, the agent foresees (by their own current credences and utilities) that there exists an alternative available policy that yields a strictly better outcome in at least one possible world and no worse outcome in any possible world (Weak Dominance), or yields higher Expected Utility.*

  **Clause Mapping:**
  *   **"At the time of adoption":** Handles **Case 7**. If the bookie has outside information the agent doesn't possess, the agent does not *foresee* the loss. The loss is not a result of the agent's policy defect, but of the bookie's epistemic advantage.
  *   **"Foresees... by their own current credences":** Handles **Case 2**. The agent sees the negative expectation. Even though there is no logical sure-loss (Dutch Book), there is an *expected* sure-loss relative to her own standards. She sabotages her own goals.
  *   **"Alternative available policy":** Handles **Case 3**. If all options guarantee loss, no alternative policy dominates. The defect lies in the world, not the agent.
  *   **"Weak Dominance / Higher Expected Utility":** Handles **Case 1** (Sure Loss dominates) and **Case 4** (Forgone gain dominates).

  **Complexity Price:** This principle unifies synchronic coherence (Case 1), diachronic coherence (Case 6), and prudential rationality (Case 2) under one header: **No Foreseeable Self-Sabotage.** The cost is that it declares Case 2 "irrational" not because of incoherence, but because violating one's own expected utility is a form of policy failure.

  ### 4. Verdict on the Standing Agreement Case

  **The Setup:**
  *   **Noon ($t_0$):** $P(A) = 0.5$.
  *   **12:30 ($t_1$):** If told A, $P(A) = 0.9$. If told B, $P(A) = 0.1$.
  *   **Agreement:** Agent must accept any bet offered at Price = Current Credence $\times$ Stake.
  *   **Bookie:** Knows the plan, knows the outcome at $t_1$, chooses stakes $S_0$ (at Noon) and $S_1$ (at 12:30, contingent on outcome).

  **The Arithmetic:**
  Let $S_0$ be the stake at Noon (Positive = Agent Buys).
  Let $S_A$ be the stake at 12:30 if Room A is announced.
  Let $S_B$ be the stake at 12:30 if Room B is announced.
  *Note: Price at $t_1$ depends on the announcement.*

  **Net Wealth Change for Agent:**
  1.  **If Room A:**
      *   Noon: Pays $0.5 S_0$, Receives $S_0$ if A. Net: $0.5 S_0$.
      *   12:30: Price is 0.9. Pays $0.9 S_A$, Receives $S_A$ if A. Net: $0.1 S_A$.
      *   **Total A:** $0.5 S_0 + 0.1 S_A$.
  2.  **If Room B:**
      *   Noon: Pays $0.5 S_0$, Receives 0 if A. Net: $-0.5 S_0$.
      *   12:30: Price is 0.1 (for A). Pays $0.1 S_B$, Receives 0 if A. Net: $-0.1 S_B$.
      *   **Total B:** $-0.5 S_0 - 0.1 S_B$.

  **The Bookie's Goal:** Make Total A $< 0$ AND Total B $< 0$.
  1.  $0.5 S_0 + 0.1 S_A < 0 \implies S_A < -5 S_0$
  2.  $-0.5 S_0 - 0.1 S_B < 0 \implies S_B > -5 S_0$

  **Solution:**
  Set $S_0 = 10$ (Agent buys 10 units at Noon).
  Then we need $S_A < -50$ and $S_B > -50$.
  Set $S_A = -60$ (Agent sells 60 units if A).
  Set $S_B = -40$ (Agent sells 40 units if B).

  **Check:**
  *   **Room A:** $0.5(10) + 0.1(-60) = 5 - 6 = \mathbf{-1}$.
  *   **Room B:** $-0.5(10) - 0.1(-40) = -5 + 4 = \mathbf{-1}$.

  **Verdict:** **Yes, the bookie can guarantee a loss.**

  **Instinct Check:**
  *   *Instinct 1:* "The 0.9/0.1 policy is a virtue."
  *   *Instinct 2:* "The real mistake was signing away my ability to decline a bet."

  My answer **confirms Instinct 2** and **qualifies Instinct 1**. The updating policy (0.9/0.1) is Bayesian-coherent (it satisfies Reflection: $0.5 = 0.5(0.9) + 0.5(0.1)$). However, coherence does not protect against a **Standing Agreement** that forces acceptance of all "fair" bets. A policy of "Accept All Fair Bets" is irrational because it allows diachronic pumping (as shown above). The 0.9/0.1 update is a virtue *ceteris paribus*, but it does not save the agent from the defective standing agreement. If your instinct was that the 0.9/0.1 policy *protects* you from the agreement, that instinct is disappointed. The agreement is fatal regardless of the update, though the update changes the stakes required to pump you.

  ### 5. A New Diagnostic Case: The Self-Blinding Bet

  To test the boundary between "irrational policy" and "mere bad luck," consider this case:

  **Case 8: The Paid Ignorance.**
  An agent faces a bet on Event E.
  *   **Option 1:** Receive evidence $X$ for free, then bet at price matching updated credence.
  *   **Option 2:** Pay $10 to *prevent* evidence $X$ from arriving, then bet at prior credence.
  *   **Agent's Belief:** The agent knows $X$ is relevant (will change credence) and knows that betting with updated credence yields higher Expected Utility than betting at prior.
  *   **Action:** The agent chooses Option 2.

  **Why this is diagnostic:**
  This case isolates the **Value of Information**. Unlike Case 2 (negative EV bets), the bets here might be fair. Unlike Case 4 (forgone gain), the agent actively pays to remain ignorant.
  *   **Application of Principle:** The policy "Pay to ignore relevant evidence" is dominated by "Accept free evidence." The agent foresees that Option 1 has higher EV than Option 2.
  *   **Significance:** If your principle cannot condemn this, it is too weak. If it condemns this but not Case 7 (Bookie knows more), it correctly distinguishes between *self-sabotage* and *epistemic disadvantage*.

  ### 6. Accommodation of Your Verdicts

  Here is the ranking of your original verdicts based on how well the **Foreseeable Policy Dominance** principle accommodates them.

  1.  **Case 1 (Die):** **Fully Accommodated.** The policy "Accept both" is dominated by "Accept one."
  2.  **Case 3 (No Good Options):** **Fully Accommodated.** No dominating policy exists.
  3.  **Case 4 (Information):** **Fully Accommodated.** "Decline Info" is dominated by "Accept Info."
  4.  **Case 5 (Priced Swaps):** **Fully Accommodated.** Intransitive preferences allow a dominating policy (transitive holding). The fee schedule is irrelevant to the *disposition's* rationality, only to the *exploitation*.
  5.  **Case 7 (Bookie Knows More):** **Fully Accommodated.** Agent does not *foresee* the loss using her own credences.
  6.  **Case 6 (Future Self):** **Accommodated (with correction).** Refusing the bet is rational (no dominating policy). Accepting it would be irrational.
  7.  **Case 2 (Hundred Tickets):** **Accommodated (with reclassification).** The principle accommodates the verdict ("Irrational") but reclassifies the defect. It is not a "Dutch Book" (logical sure loss); it is **Expected Utility Self-Sabotage**. You must accept that Case 1 and Case 2 are different *types* of dominance violation (Sure Loss vs. Expected Loss), even if both are irrational.

  **The Verdict I Kill:**
  I must kill the idea that Case 1 and Case 2 are the **"same kind"** of defect.
  *   **Cost:** You lose the unification of Incoherence and Imprudence.
  *   **Reason:** Case 1 violates the laws of logic (probability axioms). Case 2 violates the laws of decision theory (maximization). A principle that treats them as identical collapses the distinction between "believing contradictions" and "making mistakes." My principle saves the *verdict* (both are irrational) but refines the *diagnosis*. This is a necessary price for arithmetic precision.
