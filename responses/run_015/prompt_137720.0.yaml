  ## 5. Instructor Cheat Sheet (The Numbers)

  **Constants:** $\alpha = 0.5$, $\gamma = 0.5$.
  **Start:** All $Q(s,a) = 0$.
  **Signals:** Goal (Cell 3) = +64. Pit (Cell 5) = -64. Else = 0.

  **Sample Calculation (Episode 1, Lucky Run):**
  1.  **Token at 7.** Action **North** (to 4).
      *   Holder of $Q(7,N)$ stands.
      *   Immediate Signal (Cell 4) = 0.
      *   Max $Q$ of Cell 4 = 0 (all start at 0).
      *   Target = $0 + 0.5(0) = 0$.
      *   Error = $0 - 0 = 0$.
      *   **Update:** $Q(7,N)$ stays **0**. (No learning from neutral moves).
  2.  **Token at 4.** Action **North** (to 1).
      *   Same as above. $Q(4,N)$ stays **0**.
  3.  **Token at 1.** Action **East** (to 2).
      *   Same. $Q(1,E)$ stays **0**.
  4.  **Token at 2.** Action **East** (to 3 / GOAL).
      *   Holder of $Q(2,E)$ stands.
      *   Immediate Signal (Cell 3) = **+64**.
      *   Max $Q$ of Cell 3 = 0.
      *   Target = $64 + 0.5(0) = 64$.
      *   Error = $64 - 0 = 64$.
      *   **Update:** $Q(2,E) = 0 + 0.5(64) = \mathbf{32}$.
      *   *Key Insight:* The value 32 is now stored at State 2. State 2 is not the goal, but it is now "good."
  5.  **Episode 2:** Token returns to State 1. Moves East to State 2.
      *   Holder of $Q(1,E)$ stands.
      *   Immediate Signal (Cell 2) = 0.
      *   Max $Q$ of Cell 2 = 32 (from Ep 1).
      *   Target = $0 + 0.5(32) = 16$.
      *   Error = $16 - 0 = 16$.
      *   **Update:** $Q(1,E) = 0 + 0.5(16) = \mathbf{8}$.
      *   *Key Insight:* The "goodness" propagated backward. State 1 is now valuable *solely* because of a prediction about State 2.

