  I reject your second horn entirely; dispositions remain asymmetric, and causation remains intact. The inference runs backward, but the propensity runs forward. The bridge principle is not a stopping point but a binding constraint: rationality requires your credence to track my propensity because the propensity is the truth-maker for the likelihoods you require. If you reduce the propensity to credence, you dissolve the objective standard that corrects mistaken beliefs. The "cost" you allege is actually the strength of my view: preserving the objective anchor that prevents your degrees of belief from becoming mere solipsistic accounting.

