answer: |-
  ### Exam Question: Logic and Metaphysics (Year 2)

  **Time Allowed:** 60 Minutes
  **Word Limit:** 800–1,000 words
  **Total Marks:** 25

  **Question:**
  Quine argues that the analytic-synthetic distinction is an "unempirical dogma" because no statement is immune to revision in the face of recalcitrant experience. However, consider the following objection: Within Quine's own "web of belief," there exist 'micro-analytic' pockets—clusters of beliefs (e.g., logical laws or definitions) where revision is technically possible but pragmatically so costly that they function *as if* they were analytic.

  Evaluate whether this pragmatic immunity successfully salvages a notion of analyticity. In your answer, you must address whether Quine's circularity argument regarding synonymy allows for *any* distinction between beliefs held true by meaning and beliefs held true by fact, even if that distinction is one of degree rather than kind.

  ***

  ### Model Answer (Approx. 600 words)

  Quine's rejection of the analytic-synthetic distinction in *Two Dogmas of Empiricism* rests on two pillars: the failure to define synonymy without circularity, and the holism of the web of belief. To evaluate whether 'micro-analytic' pockets salvage analyticity, we must distinguish between a metaphysical distinction (principled immunity) and a pragmatic one (degree of reluctance to revise).

  Quine's primary argument against analyticity is semantic circularity. He contends that attempts to define analyticity (e.g., "true by virtue of meaning") inevitably rely on notions like 'synonymy,' 'definition,' or 'semantic rule,' all of which presuppose the very notion of analyticity they aim to explain. For Quine, unless we can ground synonymy in behavioural verification, the distinction is a metaphysical myth. A 'micro-analytic' pocket does not solve this semantic problem. Even if a cluster of beliefs behaves like a definition, Quine would argue we still lack a non-circular criterion to identify *which* beliefs constitute the 'meaning' and which constitute the 'fact.' Therefore, the circularity argument suggests that analyticity cannot be salvaged even as a pragmatic category, because we cannot draw the line even loosely without begging the question.

  However, the 'micro-analytic' objection shifts the ground from semantics to pragmatics, leveraging Quine's own holism. In the web of belief, statements near the centre (logic, mathematics) are less likely to be revised than those at the periphery (observational statements). A proponent of micro-analyticity might argue that this gradient of entrenchment is sufficient for a thinned-out analyticity. If revising a belief causes the web to collapse, it is functionally analytic.

  Quine anticipates this move. He concedes that there is a difference in degree between logical laws and historical claims, but he insists there is no difference in *kind*. For Quine, the 'micro-analytic' pocket is merely a description of psychological or sociological inertia, not a logical boundary. To call these pockets 'analytic' is to confuse the *difficulty* of revision with the *impossibility* of revision based on meaning. Quine's point is that we reject logical laws (e.g., the law of excluded middle) to accommodate quantum mechanics not because we discovered we were wrong about the 'meaning' of 'or', but because it was the most efficient adjustment for the system. The 'cost' is pragmatic, not semantic.

  Furthermore, allowing 'micro-analytic' pockets risks reintroducing the second dogma: reductionism. If we treat central beliefs as immune due to meaning, we imply they are confirmed come what may, independent of the web. But Quine's holism states that "the unit of empirical significance is the whole of science." A 'micro-analytic' pocket suggests a sub-unit of significance that holds true independently of the periphery, which contradicts the holistic nature of confirmation.

  Ultimately, the 'micro-analytic' rescue fails to satisfy Quine's rigorous empiricist standards. It offers a descriptive account of how scientists *act* (conservatism), but not a normative account of how beliefs *are* justified. Quine does not deny that some beliefs are harder to give up; he denies that this difficulty stems from 'meaning.' To accept the rescue attempt is to treat a pragmatic heuristic as a metaphysical boundary. While we may speak loosely of 'conceptual truths,' Quine's circularity argument ensures that any such talk remains ungrounded. Thus, analyticity is not thinned out; it is eliminated, replaced entirely by a continuum of pragmatic entrenchment.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Criterion 1: Accuracy of Quine's Circularity Argument (5 Marks)**
  *   **A (5):** Clearly explains that Quine rejects analyticity because definitions of synonymy presuppose analyticity (circularity), not just because holism allows revision.
  *   **B (3-4):** Explains holism/revisability well but treats the circularity argument superficially or conflates it with verificationism.
  *   **C (0-2):** Fails to mention circularity; claims Quine rejects analyticity solely because "science changes."
  *   **Misconception Penalty:** Claiming Quine thinks *no* statements are true (nihilism) rather than that the *distinction* is unfounded.

  **Criterion 2: Understanding of Holism and the Web of Belief (5 Marks)**
  *   **A (5):** Correctly identifies that for Quine, the unit of empirical significance is the whole system, not individual statements or 'pockets.'
  *   **B (3-4):** Describes the web metaphor accurately but fails to connect it to the 'unit of significance' problem.
  *   **C (0-2):** Vague reference to "everything is connected" without explaining its impact on confirmation.
  *   **Misconception Penalty:** Suggesting the web has a fixed structure rather than a pragmatic field of force.

  **Criterion 3: Engagement with the 'Micro-Analytic' Prompt (5 Marks)**
  *   **A (5):** Directly evaluates the prompt's specific claim. Distinguishes between *principled* immunity (analyticity) and *pragmatic* immunity (entrenchment).
  *   **B (3-4):** Acknowledges the prompt but treats 'micro-analytic' as synonymous with Quine's "central beliefs" without critiquing the label 'analytic.'
  *   **C (0-2):** Ignores the specific 'micro-analytic' framing; writes a generic essay on *Two Dogmas*.
  *   **Misconception Penalty:** Arguing that Quine would accept 'micro-analytic' pockets as a valid form of analyticity without qualification.

  **Criterion 4: Distinction Between Degree vs. Kind (5 Marks)**
  *   **A (5):** Explicitly argues that Quine allows for a difference in *degree* (entrenchment) but rejects a difference in *kind* (semantic vs. factual).
  *   **B (3-4):** Mentions the gradient of the web but implies this gradient *is* a form of analyticity.
  *   **C (0-2):** Treats the distinction as binary (either analytic or not) without discussing the continuum.
  *   **Misconception Penalty:** Claiming Quine denies that logical laws are central to the web.

  **Criterion 5: Structure and Clarity (5 Marks)**
  *   **A (5):** Argument flows logically; conclusion follows from premises; no significant ambiguity.
  *   **B (3-4):** Readable but disjointed; conclusion is present but weakly supported.
  *   **C (0-2):** Disorganised; difficult to follow the line of reasoning.
  *   **Misconception Penalty:** Exceeding word count significantly (indicates lack of synthesis) or falling well short (indicates lack of depth).

  ***

  ### Grade Boundaries & Differentiation Notes

  *   **A Grade (21–25 Marks):** The answer must secure full marks on **Criterion 3** and **Criterion 4**. It is not enough to summarize Quine; the student must explain *why* the 'micro-analytic' rescue fails (or succeeds) based on the circularity argument. They must recognize that Quine replaces analyticity with *pragmatic entrenchment*.
  *   **B Grade (16–20 Marks):** The answer demonstrates a strong grasp of Quine's holism and the Web of Belief (**Criterion 2**) but treats the 'micro-analytic' prompt as a simple restatement of "central beliefs." They will likely argue that Quine *does* allow for a thinned-out analyticity, missing Quine's insistence that this is a difference of degree, not a survival of the analytic category (**Criterion 4**).
  *   **C Grade (10–15 Marks):** The answer relies on rote learning of "Two Dogmas." It explains reductionism and holism but fails to engage with the specific tension in the prompt regarding circularity and synonymy.
  *   **Fail (<10 Marks):** Fundamental misunderstandings of Quine's position (e.g., Quine is a sceptic, Quine denies truth, etc.).
