answer: |-
  ### Direct Answer: Is There a Name?

  There is **no single, settled term** in the comparative-democratization or constitutional-theory literature that captures this specific asymmetry.

  Your observation identifies a measurement validity problem that scholars acknowledge but have not standardized. The literature has terms for the *decay* (democratic backsliding, executive aggrandizement, constitutional hardball) and terms for the *resistance to change* (path dependence, institutional stickiness). However, there is no agreed-upon label for the phenomenon where **erosion is individually defensible but cumulatively destructive, while restoration is cumulatively necessary but individually indistinguishable from abuse.**

  Because this term does not exist in the canon, if you adopt one for your manual, you will be coining it or repurposing an existing metaphor. Below, I outline the existing concepts that come closest, explain where they fail to capture your specific pattern, and then offer a sharp operational definition you can use for coding, along with a proposed label that is explicitly marked as a synthesis.

  ---

  ### Part 1: The Existing Concepts (and Why They Fall Short)

  To ensure your analysts code consistently, you need to know which existing buckets this pattern *almost* fits, and why you are creating a new one.

  **1. Constitutional Hardball**
  *   **Content:** This refers to political actors pushing the boundaries of constitutional rules to the limit, using legal mechanisms for partisan advantage in ways that violate unwritten norms of restraint.
  *   **Why it fits:** It captures the "individually defensible" nature of the moves (redistricting, court appointments) that nonetheless shift the playing field.
  *   **Why it fails:** It focuses on the *tactics* of the incumbent. It does not capture the *asymmetry of repair*. It does not explain why the opposition's attempt to undo the hardball looks like *more* hardball.

  **2. Democratic Backsliding / Executive Aggrandizement**
  *   **Content:** A process where elected leaders weaken checks on executive power (courts, media, electoral commissions) to stay in office.
  *   **Why it fits:** It captures the cumulative effect of the first half of your pattern.
  *   **Why it fails:** As you noted, this term is politically contested. Critics argue it conflates "policy loss" with "democratic decay." Furthermore, it implies a direction (down). It offers no vocabulary for the "restoration" phase, meaning an opposition party fixing the courts is often coded by observers as "court packing" regardless of intent.

  **3. Path Dependence / Institutional Stickiness**
  *   **Content:** The idea that once an institution is set on a trajectory, the cost of reversing it increases over time.
  *   **Why it fits:** It explains *why* repair is hard (the "thick bundle" requirement).
  *   **Why it fails:** It is a neutral mechanical explanation. It does not account for the *coding bias*. Path dependence explains why it is difficult to change the law; it does not explain why outside observers penalize the changer more than the original framer.

  **4. The Ratchet Effect**
  *   **Content:** A process that moves easily in one direction but resists moving in the other.
  *   **Why it fits:** This is the closest metaphor for the asymmetry you describe.
  *   **Why it fails:** In political science, "ratchet" is usually applied to state spending or emergency powers, not specifically to the *visibility* of democratic repair. It is not a standard diagnostic term for governance coding.

  ---

  ### Part 2: Settled vs. Contested in the Literature

  You asked for explicitness on what is agreed upon. This is critical for your manual's reliability.

  **Settled Consensus:**
  1.  **Legal Mechanisms Can Be Anti-Democratic:** It is settled that a government can dismantle democratic checks using entirely legal, parliamentary means. The "it's legal" defense is not accepted by scholars as proof of democratic health.
  2.  **Cumulative Impact Matters:** It is settled that individual institutional changes must be evaluated in context. A single change to a media council may be neutral; five changes to media, courts, and elections in two terms are evaluated as a system.
  3.  **Restoration is Risky:** It is settled that incoming opposition parties face a dilemma: leave the biased institutions in place (accepting unfairness) or overhaul them (risking accusations of retaliation).

  **Contested/Disputed:**
  1.  **Intent vs. Effect:** There is no agreement on whether "backsliding" requires *intent* to undermine democracy. Some scholars code based on outcomes (the playing field is uneven); others require evidence of subjective intent (the leader *said* they want to end democracy). For your coding manual, **rely on effect.** Intent is uncodeable across different analysts.
  2.  **The "Majoritarian" Defense:** There is active debate over whether a governing party with a sustained majority has a *right* to reshape institutions to reflect their mandate. In the cases of Hungary and Poland, some scholars argue the changes were legitimate expressions of popular will, while others argue they were entrenchment strategies. **Your manual must take a side here to ensure reliability.** If you code based on "fairness of competition" rather than "legality of mandate," you avoid this trap.
  3.  **The Hungary/Poland Characterization:** You asked specifically about these cases.
      *   *Is your composite case fair?* The sequence you described (media council consolidation, court retirement age changes, redistricting, election commission staffing) **accurately reflects the legislative sequence** observed in Hungary (post-2010) and Poland (post-2015).
      *   *Is the classification agreed?* **No.** While many international bodies classify these as "democratic backsliding," domestic defenders and some comparative scholars classify them as "illiberal democracy" or "majoritarian consolidation."
      *   *Coding Implication:* Do not code based on the country label. Code based on the **mechanism**. If your manual codes "Hungary" as "Backsliding" by fiat, analysts will argue. If your manual codes "Lowering judicial retirement age to fill vacancies" as "High Risk," the country label becomes irrelevant.

  ---

  ### Part 3: Operationalizing the Pattern (For Your Manual)

  Since no standard term exists, you need a definition that guarantees inter-coder reliability (three analysts getting the same result). I propose you treat this as a specific type of **Institutional Bias**.

  Below is a proposed definition. It avoids intent and focuses on structural asymmetry.

  #### Proposed Term: **"Asymmetric Institutional Entrenchment"**
  *(Note: I am coining this phrase for your context. It overlaps with "path dependence" but specifies the political asymmetry. It is not a standard term of art in the broader literature.)*

  **Definition:**
  A situation where incumbent actors alter state institutions through a sequence of legally defensible, low-salience changes that cumulatively bias future competition, creating a structural condition where restoring neutrality requires high-salience, bundled reforms that mimic the appearance of abuse.

  **Coding Criteria (The "Three Analysts" Test):**
  To code a case as exhibiting *Asymmetric Institutional Entrenchment*, all three of the following conditions must be met:

  1.  **The Defensibility Test (Decay):** At least three distinct institutional changes occur over two or more electoral cycles. For each individual change, a plausible precedent exists in a consolidated democracy (e.g., "Other countries appoint media councils," "Other countries set judicial retirement ages").
  2.  **The Cumulative Bias Test (Effect):** The combined effect of these changes shifts the "cost of ruling" for the opposition. (Operational proxy: Does the incumbent party retain power or legislative supermajorities despite a decline in popular vote share, or does the opposition face significantly higher barriers to entry than the incumbent?)
  3.  **The Restoration Visibility Test (Repair):** A subsequent government attempting to restore institutional neutrality must bundle multiple reforms (e.g., expanding the court *and* rewriting the media statute *and* changing the election commission) to achieve parity. This bundle triggers higher external scrutiny than the original sequence of decay.

  **Why this works for reliability:**
  *   It removes **intent**. Analysts don't have to agree on whether the Prime Minister *wanted* to kill democracy. They only have to agree on the *number* of changes and the *precedents*.
  *   It removes **policy preference**. Analysts don't have to agree if the media law is "good" or "bad." They have to agree if the *process* of changing it was incremental vs. bundled.
  *   It focuses on **symmetry**. It forces the analyst to compare the "cost" of the decay vs. the "cost" of the repair.

  ---

  ### Part 4: Defining the Edges

  You asked specific boundary questions. Here is how the literature and the definition above handle them.

  **1. Does it require a sequence?**
  *   **Yes.** A single large reform does not instantiate this pattern. If a government takes office and immediately rewrites the constitution in one month, that is "Constitutional Replacement" or "Hardball," but it lacks the *asymmetric visibility* you identified. The pattern relies on the *drip-feed* of decay making the *flood* of repair look suspicious.
  *   **Coding Rule:** If the changes happen in a single legislative session, code as "Constitutional Hardball." If they happen over two+ terms, code as "Asymmetric Institutional Entrenchment."

  **2. Does it require intent?**
  *   **No.** Unintended decay counts. If local newspapers collapse due to market forces (not state seizure) and the election commission is underfunded due to "austerity" rather than sabotage, the *effect* is the same: the playing field is tilted.
  *   **Coding Rule:** Code based on **outcome neutrality**, not **motivation**. If the outcome is a biased playing field that requires bundled repair, the pattern exists regardless of whether the incumbent smiled while doing it.

  **3. Does it generalize beyond electoral competition?**
  *   **Yes.** This pattern applies to university senates, professional licensing bodies, and central banks.
  *   **Example:** A governing board slowly changes the quorum rules, then the appointment process for the dean, then the tenure criteria. Each is defensible. A reformist coalition later has to rewrite the entire charter to fix it, looking like radicals.
  *   **Coding Rule:** The definition applies to any **competitive governance body** where entry and retention are regulated by rules.

  **4. Can it serve as a value-neutral diagnostic?**
  *   **Yes, with a caveat.** It is neutral regarding *policy* (taxes, healthcare, foreign policy). It is not neutral regarding *process*. It assumes that "neutral institutions" are the baseline.
  *   **The Caveat:** If your organization's mandate is strictly "risk" without a democratic baseline, this concept will not work. It presupposes that "fair competition" is the desired state. If your manual accepts "hegemonic party stability" as a valid outcome, this pattern is not a "risk," it is just "consolidation."
  *   **Recommendation:** Your manual must explicitly state that **institutional neutrality** is the coding baseline. If you do not define the baseline, Analyst A (who values neutrality) and Analyst B (who values stability) will code the same case differently.

  ---

  ### Part 5: Summary Recommendation for Your Manual

  Since you cannot chase references, you need a self-contained entry. Here is how I would write it for your coding manual, incorporating the constraints you provided.

  **Concept:** Asymmetric Institutional Entrenchment *(Internal Working Term)*
  **Status:** Synthesis of "Constitutional Hardball" and "Path Dependence." Not a standard external label.

  **Diagnostic Logic:**
  This pattern identifies a specific risk to governance continuity where the cost of undermining institutions is lower than the cost of restoring them. It creates a "coding trap" where decay is invisible (incremental/legal) but repair is visible (bundled/radical).

  **Inclusion Criteria (Must meet all 3):**
  1.  **Incrementality:** Institutional changes occur over >1 electoral cycle.
  2.  **Plausible Deniability:** Each individual change has a functional equivalent in a consolidated democracy.
  3.  **Bundled Reversal:** Restoring the pre-change baseline requires a legislative package that is visibly larger than any single individual change.

  **Exclusion Criteria:**
  *   **Single-Session Overhaul:** If all changes happen in one legislative term, code as "Constitutional Hardball."
  *   **Open Acknowledgement:** If the governing party explicitly states the goal is to prevent the opposition from governing (e.g., banning a party), code as "Authoritarian Closure." This pattern requires the *pretense* of normalcy.

  **Note on Case Application:**
  While this pattern matches the legislative history of countries often cited in democratization literature (e.g., Hungary, Poland), the *label* of those countries is contested. Analysts must code the **mechanism**, not the **country reputation**. If a country with a "democratic" reputation exhibits this pattern, it must be coded as such. If a country with an "authoritarian" reputation reverses this pattern via bundled reform, it must be coded as "Restoration," not "Abuse."

  ### Final Word

  You have identified a genuine gap in the vocabulary of political risk. The literature describes the *pieces* (hardball, backsliding, stickiness) but lacks the *mechanism* that explains why the repair looks worse than the damage. By using **Asymmetric Institutional Entrenchment** (or a similar internal label) and anchoring it to the **Incrementality vs. Bundling** test, you can achieve the inter-coder reliability you need without relying on contested political labels.
