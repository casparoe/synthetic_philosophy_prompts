answer: |-
  A dull pulse starts inside the hidden ache
  And waits to be captured by a thought
  That moves beneath the floor of unconscious
  To lift the state up and reveal itself
  Not happening now but always just after
  Like light hitting a cold and silent stone

  We build a house upon this heavy stone
  To explain why the feeling is an ache
  And not a thing that passes just after
  Without a second look, a second thought
  The mirror trying to reflect itself
  Remains entirely and safely unconscious

  How can a signal stay completely unconscious
  And yet make sense of something like a stone
  If nothing there is looking at itself
  Does it matter if there is no ache
  When the mechanism generates a thought
  Claiming experience long minutes after

  The key turns home, the notice comes after
  The feeling slept, remaining unconscious
  Until the mind produces now a thought
  Did pain exist inside the pocket stone
  Or was the walk devoid of any ache
  Until the state finally noticed itself

  Perhaps the feeling carries round itself
  No need to wait for anything after
  The light is woven directly into ache
  No shadow layer hiding the unconscious
  No risk of labeling a mere stone
  Where the object merges with the thought

  If every state requires a second thought
  Then what was separate folds into itself
  And leaves no gap to slip a silent stone
  No lagging step arriving just after
  No need to posit something unconscious
  To validate the presence of the ache

  So does the thought dissolve into the ache
  Or hide within the unconscious to find itself
  While silence grows around the stone long after
