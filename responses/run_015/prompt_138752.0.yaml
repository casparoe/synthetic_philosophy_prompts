      *   *James's Move:* James distinguishes between the *cash-value* of the belief and the *specific content*. If the content is "The dance causes rain," and it doesn't, it's false. If the content is "Doing the dance unites us to plant better," it's true.
      *   *Better Rejection:* Reject the inference from (5) to (6) regarding the *content* of the proposition. In genuine self-fulfilling prophecies (bank run), the proposition is about a social reality constituted by belief. In failed prophecies (rain dance), the proposition is about a brute reality independent of belief.
