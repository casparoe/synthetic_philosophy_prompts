      *   *The Crucial Distinction:* **Verification vs. Verification-Independence.**
      *   In the Bank Case: The truth *is* verification-dependent.
      *   In the Rain Case: The truth is verification-independent (meteorology), even if the *belief's utility* is high.
      *   *James's Escape:* James argues that for the Rain Dance, the belief *doesn't* actually work in the long run because it conflicts with other established truths (physics). So it fails the "hanging together" clause in (1).
      *   *So the rejection is in (1)'s application in (5).* The belief *doesn't* work if it contradicts the wider web of belief (meteorology).
