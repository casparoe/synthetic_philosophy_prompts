answer: |-
  This is a sharp reconstruction of a classic objection (essentially a sophisticated version of the Russell/Moore "pragmatism makes truth subjective" line), and your friend is right that the pressure point is between (4) and (6). However, his conclusion that this forces you into "idealism with extra steps" relies on flattening James's ontology. You do not need to drop (3) (the passional nature/voluntarism), nor do you need to abandon (1) entirely. You need to refine the *scope* of "working" in (1) and reject the universalization in (6).

  Here is the breakdown of where the argument fails, the cost of fixing it, the Peircean alternative, and the confidence levels you asked for.

  ### 1. The Diagnosis: Where to Cut
  **Reject the inference from (5) to (6) as universally stated.**
  The argument equivocal on the ontological status of the propositions in the "Gideon cases." It treats *institutional facts* (bank solvency, career flourishing) and *brute facts* (meteorological causation) as if they share the same truth-conditions.

  *   **The Bank Case:** The proposition "This bank is insolvent" is *constitutively* dependent on belief/behavior. If everyone believes it and acts, the insolvency is created. Here, (6) holds: the belief helps make the proposition true. James accepts this. He calls these "human truths" or "moral truths."
  *   **The Rain Dance Case:** The proposition "The dance causes rain" is a claim about *brute physical causality*. Even if believing it leads to a better harvest (via better planting), the specific causal claim is contradicted by the wider web of experience (meteorology, physics).

  **The Fix:** You must refine (1). Truth is not merely "working locally" (getting the harvest); it is "working without leading to future contradiction within the total system of experience."
  James explicitly makes this move in *Pragmatism*, Lecture VI ("Pragmatism and Humanism"). He distinguishes between truths we *make* (dates, names, social structures, moral outcomes) and truths we *find* (sensory facts, brute physical relations).

  **Cost:** You incur a dualism of truth-makers. You must admit that some truths are mind-dependent (social/moral) and some are mind-independent (sensory/physical).
  *   *Is this stable?* Yes, James thinks it is. He argues that even "brute" truths are only known *through* human conceptual schemes, but their *resistance* to our will marks them as independent.
  *   *Does it save (7)?* Yes. In the Rain Dance case, the belief is *useful* but *false* because it will eventually clash with other verified beliefs (e.g., barometric pressure readings). James sacrifices the *specific content* of the belief to save the *definition* of truth.

  ### 2. The Modal Slide: Local vs. Long-Run
  Your friend suspects a slide between "works-for-us-now" and "works-at-the-limit." He is correct.
  The argument in (5) relies on **local working** (the harvest came in *this year*). James's definition of truth in (1) implicitly requires **long-run working** (the belief must continue to lead well without contradiction).

  *   **The Slide:** The argument assumes that because a belief works *in the context of the Gideon case*, it is true *simpliciter*.
  *   **The Jamesian Correction:** A belief is only true if it works *and* coheres with the rest of verified experience. The Rain Dance belief might work psychologically, but if I check the weather report and see a high-pressure system, the belief "The dance caused this" creates a contradiction in my web of beliefs. To maintain the belief, I have to ignore the barometer. That is not "working" in the Jamesian sense; that is dogmatism.
  *   **Cost:** This makes truth more conservative. It ties "working" to coherence with established science. It weakens the radical edge of James's voluntarism. You can't just believe anything that feels good; it has to survive the gauntlet of future experience.

  ### 3. The Peircean Fix
  You asked if the Peircean fix (truth as the final opinion of the community of inquiry) smuggles correspondence in.
  **Verdict: Yes, absolutely.**

  *   **The Mechanism:** Peirce defines truth as the opinion fated to be agreed upon by all who investigate. What fixes this fate? Peirce explicitly says it is "External Permanence" (Reality).
  *   **The Smuggle:** By positing a "limit" of inquiry that is determined by something *outside* the inquiry (Reality), Peirce reintroduces a correspondence relation. The belief is true because it matches the Reality that constrains the inquiry.
  *   **Stability:** It is more stable against the "truth by fiat" objection than James's view. It solves the Cassandra problem (a true belief might be harmful now, but in the long run, knowing the truth is always expedient for the community).
  *   **Cost:** You lose James's "Will to Believe." For Peirce, you cannot believe ahead of evidence in a genuine option, because truth is fixed by the *end* of inquiry, not the *process* of living. You also lose the normative force of individual passional needs. Peirce is a scientific realist; James is a humanist meliorist. If you adopt the Peircean fix, you are arguably no longer doing Jamesian pragmatism.

  ### 4. Biting the Bullet (Rortyan Move)
  Could a Jamesian simply say, "Yes, if the village believes the dance brings rain and the harvest comes, the belief is true"?
  **Verdict: This is Richard Rorty's position, not William James's.**

  *   **Commitment:** This commits you to a coherentism where truth is simply "what it is better for us to believe." There is no constraint of "brute fact."
  *   **Stability:** It is *not* stable for a Jamesian. James repeatedly insists on the "resistance" of reality. He uses the metaphor of the "clenched fist" of sensation. If you bite this bullet, you cannot explain error. If the village believes the dance brings rain, and there is a drought, the Rortyan has to say the belief was false because it didn't work. But if they believe "The gods are angry" instead, and that works psychologically, is *that* true?
  *   **James's Limit:** James draws the line at sensory experience. You can interpret the facts, but you cannot deny the sensory "push." The Rortyan move dissolves the distinction between truth and utility entirely. James wants to keep them distinct but related.

  ### 5. Confidence and Consensus
  Here is the separation of textual exegesis from live philosophical dispute:

  *   **High Confidence (Textual Consensus):** James *explicitly* distinguishes between truths we make (social/moral) and truths we find (sensory). He *explicitly* addresses the "truth by human contribution" objection in Lecture VI of *Pragmatism*. He *explicitly* argues that a belief must cohere with the "whole body of verified truths," not just work in isolation. Your friend's argument ignores James's coherence constraint.
  *   **High Confidence (Logical):** The argument provided conflates *self-fulfilling prophecies* (where belief causes the fact) with *instrumental usefulness* (where belief causes a different fact that mimics the result). The Bank Run is the former; the Rain Dance is the latter. Treating them identically is a category error.
  *   **Live Disagreement:** Whether James's distinction between "human truths" and "brute facts" is philosophically sustainable is **highly contested**.
      *   *Realists* (like Putnam in his later years, or Misak) argue James can't have it both ways. Either truth is constrained by reality (Peirce) or it's not.
      *   *Neo-Pragmatists* (like Rorty) argue James should have bitten the bullet and dropped the "brute fact" constraint.
      *   *Deflationists* argue the whole debate is verbal.
      *   *Your Position:* You can legitimately argue that James's "dual constraint" (reality pushes, we shape) is the most honest account of human cognition, even if it lacks the tidy stability of Peirce's realism.

  ### Recommendation for Your Presentation
  1.  **Grant (4):** Yes, our beliefs shape the practices against which they are tested.
  2.  **Deny (6) as universal:** Distinguish **Constitutive Gideon Cases** (Bank Solvency) from **Causal Gideon Cases** (Rain Dance).
      *   In Constitutive cases, the proposition is *about* our attitudes. Truth is mind-dependent. James accepts this.
      *   In Causal cases, the proposition is *about* physical mechanisms. Truth is mind-independent. James accepts this too.
  3.  **Refine (1):** "Working" means "guiding us through the *totality* of experience without contradiction." The Rain Dance belief fails this because it contradicts meteorological data, even if it yields a good harvest.
  4.  **Address Peirce:** Acknowledge that Peirce solves the "fiat" problem by positing a Reality constraint, but note that this sacrifices the "Will to Believe" and the immediate normative force of truth for the individual.
  5.  **Conclusion:** The "Self-Certification Argument" proves that Pragmatism entails *some* truths are mind-dependent (social facts), but it fails to prove *all* truths are (physical facts). James is not an idealist; he is a **pluralist**.

  **Confidence:** I am 90% confident this accurately represents the Jamesian textual resources available to you (specifically *Pragmatism* VI and *The Meaning of Truth*). The remaining 10% is the philosophical judgment on whether James's pluralism holds water against modern realism, which is where your seminar debate will actually live.

  Don't drop (3). The passional nature is what allows us to navigate the "Gideon cases" where evidence is genuinely insufficient. That is James's core contribution. Drop the universalization of (6) instead.
