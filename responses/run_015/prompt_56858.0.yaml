prompt: |-
  I'm teaching a philosophy of time seminar, 16 second-years, 90 minutes, and only two of them have done any physics. Design an in-class activity that gets them to feel the Rietdijk–Putnam move — that once simultaneity is frame-relative there's no principled way to hang on to a privileged present, and you slide into the block universe — without me explaining any of it up front. I want a physical enactment, not a diagram on the board: "light" should be something slow enough that the Einstein syncronization procedure plays out in real time across the room (a student walking a message, a toy car, whatever), and the payoff should be the moment when two of them who just strolled past each other in opposite directions work out that their "nows" disagree about what's happening in Andromeda right now by some ridiculous amount — they should derive that number themselves rather than be told it.

  Here's the snag I can't solve: whatever we use as light has to have the same speed relative to the floor no matter who sends it, and a ball rolled by a kid who's already moving doesn't do that. Tell me how to enforce that invariant with bodies and objects you'd find in a normal classroom.

  Then give me the materials, the roles, a minute-by-minute timeline with the scaled-down numbers chosen so the effect is actually big enough for them to notice, and a debrief that maps each thing they did onto a premise of the argument plus where that premise could be resisted and what resisting costs. Also: what predictably goes wrong the first time you run it, and which part of the argument the activity flat out can't reproduce — I want to know exactly what I'll have to supply by hand. Nobody hears the phrase "block universe" until the last ten minutes.
