answer: |-
  ### The Snag: Enforcing Invariant Light Speed
  You cannot physically enforce $c$-invariance with a thrown object in a classroom. A ball thrown by a moving student *will* inherit their velocity ($v_{ball} = v_{throw} + v_{student}$). If you let physics happen naturally, the activity proves Galilean relativity, not Special Relativity.

  **The Solution: The "Human Photon" Protocol.**
  You solve this by **stipulation**, not mechanics. You designate specific students as "Light Pulses." Their instruction is not to behave like balls, but to behave like *laws of nature*.
  *   **The Rule:** "You are not a projectile. You are a constant. You must walk at exactly 1 meter per second relative to the *floor tiles*, regulated by this metronome. If the person handing you the message is running toward you, you do not speed up. If they are running away, you do not slow down. Your speed is a property of the room, not the sender."
  *   **Why this works pedagogically:** It forces the students to *feel* the absurdity of the second postulate. It feels unnatural to ignore the sender's momentum. That discomfort *is* the physics. It prevents them from treating this as a intuitive mechanics problem and forces them to accept the axiom to make the game work.

  ---

  ### Activity Design: "The Andromeda Tilt"

  **Class Size:** 16 Students
  **Time:** 90 Minutes
  **Room:** A cleared seminar room or hallway (minimum 10 meters long).

  #### Materials
  1.  **Masking Tape:** To mark a "spacetime grid" on the floor (1-meter intervals).
  2.  **Metronome App:** Projected or audible, set to 60 BPM (1 beat/sec).
  3.  **Stopwatches:** 4 phones.
  4.  **Colored Vests/Bibs:** 2 colors (e.g., Red for Stationary Frame, Blue for Moving Frame).
  5.  **Message Cards:** Index cards marked "SYNC START" and "SYNC END".
  6.  **Measuring Tape.**
  7.  **Whiteboard:** For the final calculation (kept blank until the end).

  #### Roles (16 Students)
  *   **Alice (1):** Stationary Observer. Stands at the center mark (0m). Wears Red.
  *   **Bob (1):** Moving Observer. Starts at -2m, walks past Alice at $t=0$. Wears Blue.
  *   **Photons (4):** The "Light." They wear Yellow. They are the only ones allowed to walk on the grid lines.
  *   **Clock Keepers (4):** Two stand at +5m (Future), two at -5m (Past). They hold stopwatches.
  *   **Andromeda Ambassadors (2):** Stand at the far wall (representing Andromeda). Hold a "State of Andromeda" sign (hidden).
  *   **Data Recorders (4):** With clipboards, recording times and positions.

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 00:10: Setup & Axioms (No Theory)
  *   Clear the room. Tape a line down the center. Mark meters -5 to +5.
  *   **Instruction:** "We are running a simulation. There are two rules. Rule 1: All motion is relative. Rule 2: The Yellow 'Photons' move at exactly 1 meter per beat of the metronome, relative to the floor, no matter who sends them."
  *   **Drill:** Have a Photon walk 5 meters. Verify it takes 5 beats. Have Bob jog past a Photon handing them a card. Verify the Photon *still* walks at 1m/beat. (This cements the Snag solution).

  #### 00:10 – 00:30: Alice's "Now" (Stationary Sync)
  *   **Goal:** Define simultaneity for the stationary frame.
  *   **Action:** Alice stands at 0. She sends Photons Left and Right at $t=0$ (metronome beat 1).
  *   **Task:** Photons walk to -5m and +5m, bounce off the Clock Keepers (who note the arrival time), and return.
  *   **Result:** They return at $t=10$. Alice declares: "The event at +5m and the event at -5m happened at $t=5$."
  *   **Visual:** Alice draws a horizontal line in the air. "This is my Present."

  #### 00:30 – 00:50: Bob's "Now" (Moving Sync)
  *   **Goal:** Define simultaneity for the moving frame.
  *   **Action:** Bob starts at -2m. On Beat 1, he begins walking Right at 0.2 m/s (1 meter every 5 beats).
  *   **Crucial Moment:** As Bob passes Alice (at 0m, approx Beat 11), he sends Photons Left and Right.
  *   **Constraint:** The Photons *must* maintain 1m/beat relative to the floor, even though Bob is moving.
  *   **Task:** Photons travel to -5m and +5m. Because Bob is moving toward the Right Photon and away from the Left Photon, the return times will differ *in the room frame*, but Bob calculates his sync based on *his* reception.
  *   **Data Collection:** Recorders note when Bob receives the return signals.
  *   **The Conflict:** Bob calculates the reflection event at +5m happened *earlier* than the reflection at -5m. His "Present" is tilted.

  #### 00:50 – 01:00: The Confrontation
  *   **Action:** Bob and Alice stand next to each other (having crossed paths).
  *   **Question:** "At the exact moment you passed each other ($t=0$ for both), what is happening at the far wall (Andromeda)?"
  *   **Alice's Claim:** "My 'Now' slice is horizontal. Andromeda is at Year 2024."
  *   **Bob's Claim:** "My 'Now' slice is tilted. Because I am moving toward Andromeda, my 'Now' intersects Andromeda's future."
  *   **Task:** They must calculate the difference using the room data.

  #### 01:00 – 01:15: The Andromeda Calculation
  *   **Data on Board:**
      *   $c$ (Room) = 1 m/beat.
      *   $v$ (Bob) = 0.2 m/beat.
      *   Ratio $v/c = 0.2$.
  *   **Instruction:** "The tilt you measured in this room applies to the universe. The distance to Andromeda is 2.5 million light-years."
  *   **Derivation:**
      1.  Time for light to reach Andromeda = 2.5 million years.
      2.  The time offset $\Delta t$ is proportional to the ratio $v/c$.
      3.  $\Delta t = (v/c) \times (\text{Distance in light-years})$.
      4.  $\Delta t = 0.2 \times 2,500,000$.
      5.  $\Delta t = 500,000 \text{ years}$.
  *   **Payoff:** Bob and Alice shake hands. "Right now, I am seeing Andromeda 500,000 years earlier than you."

  #### 01:15 – 01:30: The Debrief (Philosophy)
  *   **Reveal:** Introduce the phrase **"Block Universe"**.
  *   **Discussion:** If Bob's "Now" includes an alien fleet launching (Year 2,502,024) and Alice's "Now" includes them sleeping (Year 1,997,024), and both "Nows" are equally real/valid, can the future be open?
  *   **Mapping Premises:**
      1.  **Relativity Principle:** (Enacted by Bob and Alice having equal status).
      2.  **Invariance of $c$:** (Enacted by the Yellow Photon Protocol).
      3.  **Einstein Simultaneity:** (Enacted by the send/return sync method).
      4.  **No Privileged Frame:** (The instructor refuses to say who is "really" stationary).
  *   **Resistance Points:**
      *   *Deny Premise 2:* Lorentzian Ether Theory (there is a true rest frame, we just can't measure it). Cost: Untestable metaphysics.
      *   *Deny Premise 4:* Presentism with a Privileged Frame (God's eye view). Cost: Violates the spirit of Relativity, makes physics frame-dependent ontologically.
      *   *Deny the Inference:* Relativistic Presentism (Only "here-now" exists). Cost: Solipsism, hard to make sense of the calculation they just did.

  ---

  ### Predictable Failure Modes & Fixes

  1.  **The "Ballistic" Photon:**
      *   *Failure:* A Yellow student speeds up because Bob "threw" the card while running.
      *   *Fix:* The Instructor acts as "Physics Police." Blow a whistle if a Photon's step rate deviates from the metronome. Remind them: "You are not a ball. You are a constant."
  2.  **The "Stopped" Observer:**
      *   *Failure:* Bob stops walking while waiting for the light to return.
      *   *Fix:* Bob must keep shuffling at constant velocity until the calculation is done. If he stops, he changes frames.
  3.  **Unit Confusion:**
      *   *Failure:* Students mix room meters with light-years.
      *   *Fix:* Keep the calculation purely ratio-based ($v/c$). Do not convert room meters to real meters. Only convert the *time* using the real distance of Andromeda.
  4.  **Cynicism:**
      *   *Failure:* "This is just a game, light doesn't actually work like that."
      *   *Fix:* Acknowledge it. "Yes, this feels artificial. That is exactly how Einstein felt. The universe forces this artificial rule on us. The activity isn't showing you optics; it's showing you the *consequences* of the axiom."

  ### What This Activity Cannot Reproduce (Instructor Notes)

  You must supply these concepts verbally in the debrief, as the physical enactment cannot capture them:

  1.  **Ontological Weight:** The activity shows a *disagreement in coordinates*. It does not prove that the future *exists*. You have to argue that if the future is determinate for Bob, it must be real for Alice.
  2.  **Continuous Time:** The activity uses discrete "beats." Students might think time is granular. Clarify that the tilt applies to every infinitesimal moment.
  3.  **Causality:** The activity focuses on simultaneity. You need to explicitly state that no signal can travel faster than the Photons, which locks the disagreement in place (they can't call Andromeda to check).
  4.  **The "Passing" Moment:** In reality, Alice and Bob are point-particles. In the room, they have bodies. Emphasize that the disagreement exists *at the exact point of intersection*, not because they are far apart.

  ### Closing Script (Last 10 Minutes)
  "We just calculated that your movement through this room shifted your 'present' in Andromeda by half a million years. If Presentism is true—if only the 'Now' exists—then which 'Now' is real? Alice's? Bob's? If you pick one, you break the symmetry of physics. If you accept both, you must accept that the 'future' of Andromeda exists just as solidly as the 'past.' This is the **Block Universe**. Time is not a river that flows; it is a landscape that we walk through. The river was the illusion."
