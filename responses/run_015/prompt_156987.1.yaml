      *   *Actually, looking at the pattern:* They approve hard numbers (Cost, Revenue, Attendance). They reject soft/political numbers (School Maps, Police Crime, Tree Bond). "Resident satisfaction" and "Staff wellbeing" are soft numbers. This aligns with the Tree Bond (nobody agrees on what to measure) and Police Chief (number can be moved).
