answer: |-
  You asked me to say it straight if the setup is wrong, so I will start there: **Six close votes (6-3, 5-4) do not pin down a rule. They pin down a fault line.**

  A 9-0 vote (Case 3) establishes a norm. A 5-4 vote establishes that the committee is currently fighting a civil war between two or more incompatible principles. You are asking for consistency, but your record shows you have been negotiating a truce case-by-case rather than applying a consistent statute.

  That said, patterns exist. You are not voting randomly. You are oscillating between a **Property Model** (did the transaction look legal?) and a **Restorative Model** (was the context coercive/unjust?).

  Here is the breakdown of your actual operating system, the analysis of Case 7, and the specific points where you will be making new law.

  ### 1. Decoding Your Precedents (The Four Rules + The Fifth)

  You listed four candidate rules. Here is how they actually performed against your six cases:

  *   **Rule 1: Valid under law/norms of the time.**
      *   *Performance:* **Fails.** Case 1 (Benin) and Case 4 (Magdala) were technically "legal" acquisitions via auction/dealer after the fact, yet you returned them. Case 5 (Regalia) had a note saying "presented," which implies a legal gift, yet you returned it.
  *   **Rule 2: Burden of proof on clean title.**
      *   *Performance:* **Strong.** This explains Case 1 (no paper), Case 3 (no consent), and Case 4 (loot context). It fails to explain why Case 5 was returned despite having a note, unless the note was deemed insufficient proof of *authority* to sell.
  *   **Rule 3: Consent in colonial context.**
      *   *Performance:* **Strongest.** This is the true divider.
          *   *Retain:* Case 2 (Missionary/Family letters "friendly"), Case 6 (Traders/Market price/No military action).
          *   *Return:* Case 1 (Sacking), Case 3 (Survey/No consent), Case 4 (Expedition), Case 5 (Colonial Officer/Power imbalance implied).
      *   *The Nuance:* You seem to accept colonial transactions *only* when the power differential appears minimized (market trade, friendly estate sale) and reject them when the seller was under direct colonial authority or military threat.
  *   **Rule 4: Continuity of use.**
      *   *Performance:* **Weak.** This explains Case 5 (Regalia still used) and Case 3 (Remains/sacred). It does not explain Case 1 (Plaques were likely museum pieces in 1897 and are now) or Case 4 (Manuscripts).
  *   **Rule 5 (The Missing One): Inalienability & Standing.**
      *   *Performance:* **Critical.** This is the only way to reconcile Case 5 and Case 4.
          *   In Case 5, you ruled that a Chief cannot sell the *Office*. The object belonged to the institution of Chieftaincy, not the man.
          *   In Case 4, you ruled an heir cannot speak for a *Monastery*.
          *   *Principle:* Some objects are constitutionally incapable of being private property. If the seller lacked the spiritual or customary authority to alienate the object, the sale is void *ab initio*, regardless of the receipt.

  ### 2. The Analog for Case 7

  **Case 7 is Case 5 (Regalia) with the coercive context of Case 1 (Benin).**

  *   **Why it is Case 5:** The stool is a "seat of authority." The Lineage Head argues it is inalienable (no individual entitled to sell). The bell is in active ritual use. This mirrors the Chieftaincy Regalia exactly.
  *   **Why it is Case 1:** The "collective fine" context. In Case 6, you retained items because there was "no military action." Here, the village was under punishment, and the buyer was the punisher. The "fair price" (£4) is irrelevant if the seller was under duress from the buyer's husband's administration.
  *   **Where the analogy breaks:**
      *   **The Divination Bundle:** The Lineage Head admits it hasn't been used in decades. Under Rule 4 (Continuity of Use), this weakens the claim. Under Rule 5 (Inalienability), if it belongs to the lineage cosmology, use doesn't matter.
      *   **The Conservation Issue:** In previous returns, objects were presumably movable. Here, the object may die in transit.

  ### 3. Recommendation

  If you want to be consistent with your *strongest* precedents (Case 5 and Case 1), you must prioritize **Inalienability** and **Coercive Context** over **Market Validity**.

  **Decision:** Return all three items (Stool, Bell, Bundle) to the **Lineage Head**.

  **Reasoning:**
  1.  **The Stool:** Under Case 5 precedent, a seat of authority cannot be sold by an individual, even if a receipt exists. The "collective fine" context (Case 1 analog) confirms the transaction was coercive.
  2.  **The Bell:** It is in active use (Case 5). Retention by the museum interrupts a living practice.
  3.  **The Bundle:** While unused, it was acquired as part of a coercive bundle. Splitting the acquisition (see below) sets a dangerous precedent.
  4.  **Claimant Priority:** The Lineage Head has higher standing than the National Commission (Case 5: Office Holder > Private/State) and the Diaspora (Case 4: Standing denied to those without direct custodial role). The Diaspora funded the research; they are facilitators, not owners.

  ### 4. Where You Are Making New Law

  You asked to be told where the record doesn't decide. Here are the three points where you are writing new precedent:

  **A. The "Decay at Home" Principle (Duty of Care vs. Ethical Return)**
  *   *The Conflict:* Your conservator says "stabilize or it breaks." The Lineage Head says "return it even if it breaks."
  *   *The Precedent Gap:* You have no record of returning an object known to be fragile against conservation advice.
  *   *The Choice:*
      *   *Option 1 (Stabilize then Return):* You prioritize the *object's survival*. You are asserting that the museum's duty of care supersedes the claimant's immediate possession.
      *   *Option 2 (Return As-Is):* You prioritize *sovereignty*. You are asserting that the claimant has the right to determine the risk profile of their own heritage, even if that means loss.
  *   *Recommendation:* **Option 2.** If you insist on stabilization, you are effectively holding the object hostage until *you* deem it safe. Given the "collective fine" context, imposing further delay contradicts the restorative ethic. Document the condition, transfer the risk.

  **B. Splitting the Collection**
  *   *The Conflict:* The Bundle is unused. The Stool/Bell are active/inalienable. Should the Bundle go to the National Commission (who will display it) while the Stool goes to the Lineage?
  *   *The Precedent Gap:* You have never split a single accession number (Case 1, 5, 6 all moved as groups).
  *   *The Choice:*
      *   *Option 1 (Split):* You prioritize *Utility*. The museum displays the bundle; the lineage gets the sacred items.
      *   *Option 2 (Keep Together):* You prioritize *Provenance Integrity*. The objects were taken together under one coercive context; they should be returned together.
  *   *Recommendation:* **Option 2.** Splitting implies the museum gets to curate the "value" of the return. If the context was coercive (the fine), the entire transaction is tainted.

  **C. Diaspora Standing**
  *   *The Conflict:* The Diaspora association funded the research. Do they get a say?
  *   *The Precedent Gap:* Case 4 denied standing to an individual heir. Case 5 granted it to an Office Holder. The Diaspora is neither.
  *   *The Choice:*
      *   *Option 1 (Grant Standing):* You acknowledge that *research labor* creates a stake in restitution.
      *   *Option 2 (Deny Standing):* You maintain that only *custodial authority* (Lineage or State) matters.
  *   *Recommendation:* **Option 2.** Acknowledge their contribution publicly, but do not grant them decision-making power. If you grant standing based on funding research, you open the door to vendors or lawyers claiming standing based on legal fees.

  ### 5. The Future Claim That Will Break This

  You asked for the future claim that would force a choice between your candidate rules. It is this:

  **The "National Heritage" vs. "Customary Authority" Conflict.**

  In Case 4, you chose the National Government over the Individual Heir. In Case 5, you chose the Office Holder over the Museum.
  Eventually, you will receive a claim where the **National Government** claims an object is "National Heritage" (belonging to the State), but a **Local Community/Lineage** claims it is "Customary Heritage" (belonging to them, not the State).

  *   *If you follow Case 4:* You return to the State.
  *   *If you follow Case 5:* You return to the Lineage/Office.

  Case 7 is a dress rehearsal for this. The National Commission is claiming the group. The Lineage Head is claiming the group. By recommending you return to the Lineage, I am suggesting you are shifting your precedent from Case 4 (State primacy) toward Case 5 (Customary primacy).

  **Summary of the Vote You Need to Cast:**
  To be consistent with the *ethical weight* of your previous returns (Cases 1, 3, 5), you must vote to **Return All to Lineage, As-Is, Without Splitting.**

  If you vote to Retain, you are arguing that £4 and a receipt (Case 6) trump a collective fine and inalienable status (Case 5). Given your 5-4 split history, that argument will likely fail, but it is the only coherent argument for retention.

  If you vote to Return to the State, you are arguing that the State represents the Lineage (Case 4). Given the Lineage Head's explicit objection ("rather it decay than stay here"), this risks the object being returned to a state museum and never reaching the community, which undermines the restorative purpose of Case 1 and 5.

  **Final advice:** The "consistency" you are looking for is a mirage. Your committee is a legislative body, not a judicial one. You are not finding the law; you are writing it. Vote for the principle you want to govern the next ten years, not just this stool. If that principle is "Coercion voids title," you return it. If that principle is "Receipts validate title," you keep it. Based on your record, "Coercion voids title" is the stronger thread.
