  ### 2. Diagnostic Flowchart: How Many Ways of Knowing?

  **Start:** You see smoke on a hill. Do you know there is fire there?
  │
  ├── **No.** (You only know what you see.)
  │   └── **LEAF A: The Strict Perceptualist** (1 Source)
  │
  └── **Yes.** → **Node 2:** Is knowing "fire" from "smoke" a *new* mental tool, or just seeing + remembering?
      │
      ├── **Just seeing + remembering.** (Reducible)
      │   └── **LEAF B: The Reductionist** (1 Source Variant)
      │
      └── **New tool.** (Irreducible) → **Node 3:** A machine (GPS/LLM) or stranger tells you *P*. You don't know them reliable. Do you know *P* by a *new* tool, or just by inferring they are reliable?
          │
          ├── **Just inferring reliability.** (Reducible)
          │   └── **LEAF C: The Dualist** (2 Sources)
          │
          └── **New tool.** (Irreducible) → **Node 4:** You learn "gavaya" means "wild cow" by seeing one after hearing the word. Is linking word-to-object a *new* tool, or just inference/testimony?
              │
              ├── **Just inference/testimony.** (Reducible)
              │   └── **LEAF D: The Triadist** (3 Sources)
              │
              └── **New tool.** (Irreducible) → **Node 5:** You see an empty spot where a pot should be. Is knowing "no pot here" a *new* tool, or just seeing the ground?
                  │
                  ├── **Just seeing the ground.** (Reducible)
                  │   └── **LEAF E: The Classical Realist** (4 Sources)
                  │
                  └── **New tool.** (Irreducible) → **Node 6:** A man is fat but never eats by day. You conclude he eats at night. Is explaining this mismatch a *new* tool, or just inference?
                      │
                      ├── **Just inference.** (Reducible)
                      │   └── **LEAF F: The Five-Fold Theorist** (5 Sources)
                      │
                      └── **New tool.** (Irreducible)
                          └── **LEAF G: The Six-Fold Theorist** (6 Sources)

  *(Note: There is one logically possible leaf missing—see Audit below)*

  ---

  ### 3. Leaf Table

  | Label | Position (School Approx.) | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Strict Perceptualist** (Cārvāka) | Must claim you don't *know* fire exists when you see smoke, only that you believe it. |
  | **B** | **Reductionist 1-Source** (Rare) | Must claim inferring fire is no different than remembering a past fire; struggles with universal claims. |
  | **C** | **Dualist** (Buddhist Epistemologists) | Must claim learning from a teacher is identical to solving a logic puzzle; ignores the social dimension of knowledge. |
  | **D** | **Triadist** (Sāṃkhya) | Must claim learning what a "gavaya" is via comparison is just guessing based on descriptions; makes language learning very indirect. |
  | **E** | **Classical Realist** (Nyāya) | Must claim knowing "there is no ghost here" is the same as seeing the floor; struggles with absent things you couldn't see anyway. |
  | **F** | **Five-Fold Theorist** (Prābhākara Mīmāṃsā / Later Nyāya) | Must claim knowing "no pot" is unique, but explaining the "fat man" case is just guessing; inconsistent treatment of absence vs. explanation. |
  | **G** | **Six-Fold Theorist** (Bhāṭṭa Mīmāṃsā) | Commits to a unique mental tool for every distinct logical gap; risks multiplying sources without limit (e.g., why not 7?). |

  ---

  ### 4. Unoccupied-Cells Audit

  **The Missing Leaf:** There is no leaf for "Accepts Inference & Testimony & Comparison & Presumption, but Reduces Absence."
  *   **Status:** **Unattractive.**
  *   **Reason:** If you accept *Presumption* (which posits an unobserved cause to explain a fact), you almost certainly accept *Absence* (which posits an unobserved state). Rejecting Absence while accepting Presumption is logically unstable because Presumption often relies on knowing something is absent (e.g., food is absent during the day). Nobody defends this combination because it breaks the logic of the *arthāpatti* case.

  ---

  ### 5. Unseparable-Pairs Note

  **What this tree cannot distinguish:**
  1.  **Convergence vs. Exclusivity:** The tree counts *types* of sources, but doesn't show if two sources can yield the *same* knowledge token (e.g., seeing the fire *and* inferring it). Leaf E (Nyāya) and Leaf G (Bhāṭṭa) both allow convergence, but some Buddhists restrict sources to exclusive turfs. You need a follow-up question: "If you see the fire *and* infer it, is that one knowledge or two?"
  2.  **Process vs. Instrument:** The tree asks about "tools" (instruments), but some schools count the *causal process* (e.g., "contact with senses") while others count the *result* (e.g., "certainty"). A student who thinks "Perception" and "Memory" are different processes might land on Leaf B, while one who thinks they are the same instrument might land on Leaf A.
  3.  **Correction Cases:** The "stick in water" (visual illusion corrected by touch) case doesn't split the leaves. All schools agree one source can correct another. To diagnose their view on this, you need to ask: "When touch corrects vision, was the vision *knowledge* (just false) or *not knowledge*?" (This splits Infallibilists from Fallibilists, which cuts across the Source Count).

  ---

  ### 6. Closing: Cutting for Time

  If you must squeeze this into twenty minutes, **cut Node 5 (Absence) and Node 6 (Presumption).** Merge the "Yes" from Node 4 directly to **Leaf E (4 Sources)**.

  **What you lose:** You lose the distinction between Classical Nyāya (4) and Mīmāṃsā (5/6), and you lose the fascinating debate about whether "knowing what isn't there" requires a unique mental tool.
  **What you keep:** You retain the core debate shared with contemporary analytic epistemology: Perception, Inference, and Testimony (Nodes 1–4). This allows you to focus on the "Machine Testimony" case and the reduction of testimony to inference, which is the most fertile ground for connecting Indian material to current debates about AI and social epistemology. The Absence/Presumption cases are metaphysically heavier and require more setup to make intuitive sense to undergrads.
