  ### 1. Design Notes & Brainstorm Dump

  **Discriminating Questions Considered:**
  *   *Initial thought:* Start with "Is perception reliable?" -> Pruned. Everyone agrees perception is a source, even if fallible. Doesn't split the *count*.
  *   *Initial thought:* Use the "stick in water" (correction) case as a node. -> Pruned. All schools agree perception can be corrected by other sources; the disagreement is about whether the *correction* implies a new source or just better perception. Better suited for the "unseparable" note.
  *   *Initial thought:* Separate "Stranger Testimony" and "Machine Testimony" into two nodes. -> Pruned. Philosophically, the issue is identical (is knowledge from a reliable indicator distinct from inference?). Merging them saves nodes for the *arthāpatti*/*abhāva* split.
  *   *Initial thought:* Ternary branches (No / Reduced / Irreducible). -> Pruned. Binary branches are cleaner for a handout. I split the first step (Inference) into two nodes to allow the "Reductionist 1-Source" leaf without exploding the tree.

  **Pruning for Constraints:**
  *   I kept the "Reductionist" option explicit at every step by phrasing the binary choice as "Is this a *new* tool?" (Yes = Irreducible, No = Reduced/Old Tool).
  *   I corrected your memory on the 5 vs. 6 split: The split is primarily over *Presumption* (*arthāpatti*), not Absence (*abhāva*). Both Mīmāṃsā schools accept Absence (mostly); Prābhākara reduces Presumption (5 sources), Bhāṭṭa accepts it (6 sources). Nyāya traditionally stops at 4 (reducing Absence & Presumption), though later Nyāya accepts Absence (5). The flowchart reflects this cascade.

  **Case Mapping:**
  *   Smoke/Fire → Nodes 1 & 2 (Inference).
  *   Stranger/GPS → Node 3 (Testimony).
  *   Gavaya → Node 4 (Comparison).
  *   No Pot/Ghost → Node 5 (Absence).
  *   Fat Man → Node 6 (Presumption).

