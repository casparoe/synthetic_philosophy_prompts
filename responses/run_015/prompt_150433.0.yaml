prompt: |-
  Design a reusable, step-by-step audit procedure for a psychiatric-classification working group that must evaluate whether a proposed diagnostic revision risks triggering harmful looping effects in the sense developed by Ian Hacking—the idea that classifying people can change the very behaviors and self-understandings being classified, which then feed back into prevalence data and clinical perception. The working group operates under a six-week deadline, has no staff philosopher, and requires joint sign-off from clinicians and epidemiologists; the procedure must therefore be runnable by non-philosophers but must preserve the conceptual distinctions that actually matter.

  Structure the procedure as an ordered sequence of tests with explicit stop rules: for each step, state the question, what counts as a sufficient answer (including when the answer must be "we do not have enough evidence"), where the procedure terminates with a recommendation to proceed, where it terminates with a recommendation to halt, and where it explicitly hands the decision to human judgment because the issue is one of values rather than facts. Inject the following niche distinction into the framework: separate "taxonomic looping" (the label itself reshapes symptom expression and self-report) from "institutional looping" (the diagnosis changes access to resources, legal status, or social identity, which then alters observed prevalence independently of phenomenology). The procedure must contain specific checks for each kind and a rule for what to do when they point in opposite directions.

  Then apply the procedure to two concrete proposals: first, broadening the age-range criteria for an existing neurodevelopmental disorder so that it is routinely diagnosed in adults; second, introducing a new subthreshold anxiety category intended for primary-care screening. For each, run every step and record where the procedure yields a clear answer and where it stalls. Include one case—chosen from the two—where the procedure produces an answer the working group is likely to resist (for example, recommending against a revision that addresses a documented clinical gap because loop contamination is unquantifiable and institutional effects are irreversible). Finally, state precisely what the procedure cannot do: identify loops it is not designed to detect, substitute for ethical judgment about acceptable risk, or resolve conflicts between clinician and epidemiologist sign-off. Keep the tone formal and the language operational, avoiding requests for bibliographies, citation lists, or references to highly obscure secondary literature; paraphrase Hacking's core claims without using quotation marks.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**

      *   **Goal:** Design a reusable, step-by-step audit procedure for a psychiatric-classification working group.
      *   **Core Concept:** Ian Hacking's "looping effects" (classifying people changes the people/classification).
      *   **Constraints:**
          *   Six-week deadline.
          *   No staff philosopher (must be runnable by non-philosophers).
          *   Joint sign-off required (clinicians + epidemiologists).
          *   Preserve conceptual distinctions (specifically "taxonomic looping" vs. "institutional looping").
          *   Structure: Ordered sequence of tests with explicit stop rules (Proceed, Halt, Human Judgment).
          *   Conflict Rule: What to do when taxonomic and institutional looping point in opposite directions.
          *   Application: Apply to two concrete proposals (1. Broadening age-range for neurodevelopmental disorder to adults; 2. New subthreshold anxiety category for primary care).
          *   Resistance Case: Include one case where the procedure recommends against a revision the group likely wants (e.g., due to unquantifiable loop contamination).
          *   Limitations Statement: What the procedure *cannot* do (detect all loops, substitute ethics, resolve sign-off conflicts).
          *   Tone: Formal, operational, no bibliographies/citations/obscure lit, paraphrase Hacking without quotes.

  2.  **Deconstruct "Looping Effects" for Operational Use:**

      *   *Hacking's Core Idea:* Classifications of people are not like classifications of rocks. When people know how they are classified, they may change their behavior or self-conception to align with (or resist) the classification. This changes the "kind" of person being classified, potentially invalidating the original statistical or clinical basis.
      *   *Taxonomic Looping:* The label changes the *phenomenology*. Patients act differently because they have the label. Symptoms change.
      *   *Institutional Looping:* The label changes *access/consequences*. Insurance, legal status, stigma, accommodation. This changes *who gets diagnosed* or *prevalence rates* without necessarily changing the underlying internal experience.
      *   *Operationalization:* How do clinicians and epidemiologists check for this without a philosopher? They need to look for evidence of reactivity (taxonomic) and systemic incentives (institutional).

  3.  **Drafting the Audit Procedure (The Framework):**

      *   *Phase 1: Scoping & Definition.* Define the change.
      *   *Phase 2: Taxonomic Loop Check.* Will the label change the symptoms?
      *   *Phase 3: Institutional Loop Check.* Will the label change access/status?
      *   *Phase 4: Conflict Resolution.* What if one is safe and the other is risky?
      *   *Phase 5: Final Decision.* Proceed, Halt, or Escalate to Values.
      *   *Stop Rules:* Need clear "If X, then Stop/Go" logic.
      *   *Human Judgment:* Explicitly mark where values override data.

      *Refining the Distinction:*
      *   Taxonomic = "Does knowing the diagnosis change how the patient feels/acts?"
      *   Institutional = "Does having the diagnosis change what the patient gets/loses?"

      *Refining the Conflict Rule:* If Taxonomic is low risk but Institutional is high risk (or vice versa), the procedure shouldn't just say "stop." It should flag it as a "Values Trade-off" requiring higher-level ethical review, because one is about scientific validity (taxonomic) and one is about social justice/resource allocation (institutional).

  4.  **Developing the Two Case Studies:**

      *   *Case 1: Broadening Neurodevelopmental Disorder (e.g., ADHD/Autism) to Adults.*
          *   *Taxonomic Risk:* Adults might adopt "neurodivergent" identity, altering self-report. High risk of identity adoption.
          *   *Institutional Risk:* Access to workplace accommodations, medication, disability benefits. High risk of resource strain or gaming.
          *   *Likely Outcome:* High loop risk. Might recommend halting or severe caution.
      *   *Case 2: Subthreshold Anxiety in Primary Care.*
          *   *Taxonomic Risk:* Labeling "worried well" might make them feel sicker (nocebo).
          *   *Institutional Risk:* Insurance coverage for therapy, potential stigma on records.
          *   *Likely Outcome:* Mixed. Clinicians want to treat; Epidemiologists worry about prevalence inflation.
      *   *Resistance Case:* I need to choose one where the procedure says "Halt/ Caution" but the clinicians really want to "Proceed" to help patients. Case 2 (Subthreshold Anxiety) is a classic candidate. Clinicians see suffering; the audit says "Labeling might create chronicity (taxonomic) and insurance burdens (institutional)." Or Case 1, where adult diagnosis is sought for validation. Let's make Case 1 the resistance case regarding *validity* vs. *access*. Actually, the prompt suggests recommending *against* a revision that addresses a clinical gap. Case 2 fits well: Clinicians want to help subthreshold patients, but the audit warns of creating a new class of "anxious people" who wouldn't exist without the label.

  5.  **Drafting the Content - Step-by-Step:**

      *   *Introduction:* Set the context (6 weeks, non-philosophers).
      *   *The Procedure:* Numbered steps.
      *   *Step 1 (Definition):* What is changing?
      *   *Step 2 (Taxonomic):* Evidence of reactivity? (Stop if high reactivity + low reliability).
      *   *Step 3 (Institutional):* Evidence of incentive changes? (Stop if high incentive + low monitoring).
      *   *Step 4 (Divergence):* What if they conflict? (Escalate to Values).
      *   *Step 5 (Sign-off):* Joint agreement.
      *   *Application:* Run Case 1 and Case 2 through the steps.
      *   *Limitations:* Be honest about what this checklist misses.

  6.  **Refining the Tone and Constraints:**

      *   *Tone:* Formal, bureaucratic but precise. "Operational."
      *   *Hacking:* Paraphrase the "making up people" concept without quotes. Focus on the interaction between classification and the classified.
      *   *No Citations:* Keep it self-contained.
      *   *Stop Rules:* Must be explicit. "If Answer = X, Terminate."

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the distinction between taxonomic and institutional clear enough?
      *   *Fix:* Ensure Step 2 focuses on *symptom expression* and Step 3 focuses on *external consequences*.
      *   *Critique:* Is the "Human Judgment" trigger clear?
      *   *Fix:* Make Step 4 the specific "Values Escalation" point.
      *   *Critique:* Did I meet the "Resistance Case" requirement?
      *   *Fix:* In the application of Case 2 (Subthreshold Anxiety), explicitly state that the procedure recommends halting due to loop risks, despite clinical demand.
      *   *Critique:* Did I address the 6-week deadline?
      *   *Fix:* Mention time-boxing in the intro or step descriptions (e.g., "Complete within 5 days").
      *   *Critique:* Did I avoid quotes?
      *   *Fix:* Check for quotation marks around Hacking's terms.

  8.  **Final Polish:** Check against the prompt's specific list of requirements one last time.
      *   Reusable step-by-step? Yes.
      *   Stop rules? Yes.
      *   Taxonomic vs. Institutional distinction? Yes.
      *   Conflict rule? Yes.
      *   Two concrete proposals applied? Yes.
      *   One resistance case? Yes.
      *   Limitations statement? Yes.
      *   Formal tone? Yes.
      *   No bibliography/quotes? Yes.

      *(Self-Correction on Hacking Paraphrase)*: Instead of saying "Hacking says 'making up people'", say "The framework assumes that classifying individuals alters their self-conception and behavior, which in turn alters the classification's validity."

      *(Refining the Conflict Rule)*: If Taxonomic = Safe but Institutional = Risky, the decision is not scientific, it's ethical. The procedure must hand this off.

      *(Refining the Resistance Case)*: I will select the Subthreshold Anxiety case. Clinicians want to treat; the audit flags the risk of *creating* the disorder through labeling. This creates friction.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Audit Procedure for Diagnostic Revision: Looping Effect Risk Assessment

  **Purpose:** To evaluate proposed psychiatric classification revisions for the risk of generating harmful feedback loops wherein the act of classification alters the population being classified.
  **Constraints:** Six-week execution window; no dedicated philosophy staff; requires joint sign-off (Clinical Lead + Epidemiology Lead).
  **Core Concept:** Classifications of human kinds are dynamic. When individuals become aware of a classification, they may alter their behavior or self-understanding to align with it (Taxonomic Looping). Simultaneously, the classification may alter the individual's access to resources, legal standing, or social status, thereby changing prevalence data independent of underlying pathology (Institutional Looping).

  ---

  ## Part I: The Audit Procedure

  ### Step 1: Definition of the Proposed Change
  **Question:** What specific change is being proposed to the classification criteria, and what is the stated clinical or public health justification?
  **Required Output:** A one-paragraph statement defining the inclusion/exclusion shift and the intended benefit (e.g., "Early intervention," "Reduced stigma," "Better resource allocation").
  **Stop Rule:**
  *   **Proceed:** If the justification is clearly stated and clinically coherent.
  *   **Halt:** If the justification relies solely on "standardizing practice" without a stated benefit to patient outcomes or data validity.
  *   **Time Allocation:** 3 Days.

  ### Step 2: Taxonomic Looping Assessment (Phenomenological Risk)
  **Question:** Is there evidence that awareness of this specific label will alter symptom expression, self-reporting, or help-seeking behavior in a way that degrades diagnostic reliability?
  **Evidence Required:** Review of patient advocacy materials, social media discourse regarding the condition, and prior literature on diagnostic reactivity for similar categories.
  **Sufficient Answer:**
  *   **Low Risk:** No evidence that patients model behavior on the criteria; symptoms are largely observable or biological markers.
  *   **High Risk:** Evidence that patients actively curate symptoms to match criteria (conscious or unconscious) or that the label provides a desirable identity that encourages symptom retention.
  *   **Unknown:** Insufficient data on patient reactivity.
  **Stop Rule:**
  *   **Proceed:** If Risk is Low.
  *   **Halt:** If Risk is High AND no mitigation strategy (e.g., blinded assessment tools) is available.
  *   **Human Judgment:** If Risk is High BUT the clinical need is urgent (e.g., suicide prevention). Flag for Step 5.
  *   **Time Allocation:** 10 Days.

  ### Step 3: Institutional Looping Assessment (Systemic Risk)
  **Question:** Does this revision change the individual's eligibility for material resources, legal protections, or social accommodations?
  **Evidence Required:** Analysis of insurance reimbursement codes, disability law, educational accommodations, and employment regulations linked to the diagnosis.
  **Sufficient Answer:**
  *   **Low Risk:** The diagnosis confers no specific external benefits or penalties beyond clinical treatment.
  *   **High Risk:** The diagnosis unlocks significant financial benefits, legal exemptions, or carries severe stigma/employment barriers.
  *   **Unknown:** Impact on policy is unclear or varies by jurisdiction.
  **Stop Rule:**
  *   **Proceed:** If Risk is Low.
  *   **Halt:** If Risk is High AND the system lacks capacity to monitor for gaming or resource exhaustion.
  *   **Human Judgment:** If Risk is High BUT the resource access is deemed a human rights necessity. Flag for Step 5.
  *   **Time Allocation:** 10 Days.

  ### Step 4: Divergence and Conflict Resolution
  **Question:** Do the Taxonomic (Step 2) and Institutional (Step 3) assessments point in opposite directions?
  **Scenarios:**
  *   **Scenario A (Both Low):** Proceed to Step 5.
  *   **Scenario B (Both High):** Recommend Halt.
  *   **Scenario C (Divergent):** One is Low, one is High.
  **Rule for Divergence:**
  *   If Taxonomic is High (validity threat) but Institutional is Low (no resource change): The issue is scientific validity. Default to **Halt** unless new reliability data is generated.
  *   If Taxonomic is Low (validity secure) but Institutional is High (resource threat): The issue is resource allocation and ethics. The procedure **cannot resolve this**. Hand off to Ethics/Policy Board.
  **Stop Rule:**
  *   **Proceed:** Only if both are Low, or Divergence Scenario A is resolved by new data.
  *   **Halt:** If both are High, or Divergence Scenario B applies.
  *   **Human Judgment:** All Divergence Scenario C cases.
  *   **Time Allocation:** 5 Days.

  ### Step 5: Joint Sign-Off and Values Declaration
  **Question:** Do the Clinical Lead and Epidemiology Lead agree on the interpretation of the risks?
  **Required Output:** A signed declaration acknowledging the identified looping risks and accepting responsibility for the downstream consequences.
  **Stop Rule:**
  *   **Proceed:** If both sign.
  *   **Halt:** If either party refuses to sign due to unmitigated risk.
  *   **Time Allocation:** 5 Days.

  ---

  ## Part II: Application to Concrete Proposals

  ### Proposal 1: Broadening Age-Range Criteria for Neurodevelopmental Disorder (e.g., ADHD) to Adults
  **Context:** Currently diagnosed primarily in children. Proposal allows routine diagnosis in adults without childhood evidence.

  *   **Step 1 (Definition):** Justification is to reduce untreated impairment in the workforce. Clear. **(Proceed)**
  *   **Step 2 (Taxonomic):** **High Risk.** Adult self-diagnosis communities are active. Awareness of criteria leads to "symptom shopping" where normal forgetfulness is reinterpreted as pathology. Self-report reliability is compromised by identity adoption. **(Flag for Judgment)**
  *   **Step 3 (Institutional):** **High Risk.** Diagnosis grants access to stimulant medication, workplace accommodations, and disability benefits. High incentive for malingering. **(Flag for Judgment)**
  *   **Step 4 (Conflict):** Both assessments are High.
  *   **Step 5 (Sign-Off):**
      *   **Procedure Recommendation:** **Halt.** The combination of high identity-reshaping (Taxonomic) and high resource incentive (Institutional) creates a feedback loop where prevalence data will become uninterpretable and clinical validity will erode.
      *   **Working Group Reaction:** Likely Resistance. Clinicians argue this denies care to suffering adults.
      *   **Outcome:** Procedure stalls. The Working Group must override the audit with a Values Declaration acknowledging that prevalence data may be permanently contaminated in exchange for access to care.

  ### Proposal 2: Introducing New Subthreshold Anxiety Category for Primary-Care Screening
  **Context:** A new code for patients who do not meet full disorder criteria but report distress. Intended to facilitate insurance coverage for brief therapy.

  *   **Step 1 (Definition):** Justification is early intervention to prevent chronic disorder. Clear. **(Proceed)**
  *   **Step 2 (Taxonomic):** **High Risk.** Labeling transient distress as a "subthreshold disorder" may medicalize normal stress responses. Patients may adopt a "sick role," increasing persistence of symptoms (nocebo looping). **(Flag for Judgment)**
  *   **Step 3 (Institutional):** **Low Risk.** The category offers therapy coverage but confers no disability status, legal protection, or high-value medication access. **(Proceed)**
  *   **Step 4 (Conflict):** Divergence Scenario C (Taxonomic High, Institutional Low).
      *   **Rule Application:** The issue is scientific validity vs. clinical utility. Since the Taxonomic risk threatens the validity of the category itself (by creating the symptoms it measures), the default is **Halt**.
      *   **Exception:** Because Institutional risk is low, this can be escalated to Human Judgment rather than an automatic hard stop.
  *   **Step 5 (Sign-Off):**
      *   **Procedure Recommendation:** **Halt / Escalate.** The procedure recommends against adoption because the label risks creating the very prevalence it aims to track.
      *   **Working Group Reaction:** **Strong Resistance.** Clinicians see a gap in care for the "worried well." They view the looping risk as theoretical, whereas the suffering is immediate.
      *   **Outcome:** This is the **Resistance Case**. The procedure identifies that while the clinical gap is real, filling it via classification may generate a self-sustaining population of "anxious patients" who would otherwise recover naturally. The Epidemiologist is likely to refuse sign-off based on Step 2, while the Clinician pushes for Step 1 justification. The procedure forces a stalemate that requires an ethical override.

  ---

  ## Part III: Limitations Statement

  This audit procedure is a risk-management tool, not a truth-machine. Stakeholders must acknowledge the following limitations before relying on its output:

  1.  **Undetectable Loops:** The procedure relies on available evidence. It cannot detect latent looping effects that only emerge years after implementation (e.g., long-term identity shifts in children). It assesses *probability* of looping, not *presence*.
  2.  **No Ethical Substitution:** A recommendation to "Halt" due to looping risk does not mean the revision is unethical. It means the classification may lose scientific stability. A decision to proceed despite high looping risk is an ethical choice to prioritize access over data purity; this procedure does not make that choice, it only highlights the cost.
  3.  **Sign-Off Conflicts:** The procedure cannot resolve fundamental disagreements between Clinicians (who prioritize individual treatment) and Epidemiologists (who prioritize population validity). Step 5 requires joint sign-off; if this is not achieved, the procedure terminates without a recommendation. It identifies the conflict but does not solve it.
  4.  **Scope of Classification:** This audit applies only to changes in diagnostic criteria. It does not audit changes in treatment guidelines, screening tools, or insurance policies that may trigger looping effects independently of the classification manual.
