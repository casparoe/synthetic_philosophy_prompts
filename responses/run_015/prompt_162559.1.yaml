  ok so my roommate and I have been going back and forth on this for like a month and I want to actually pin down where the disagreement lives: what's your credence that adult insects — say, honeybees and fruit flies — have valenced conscious experience? Not just nociception, not just "they detect damage and withdraw," but something that is like something for them, arranged along a pleasant/unpleasant axis. I'm at about 0.5 and he's at about 0.05, and I've started to think most of that gap is methodological rather than about insects at all.

