  2.  **Evaluate the Six Explanations:**

      *   *(1) The Selection Story:* More women work $\rightarrow$ marginal women have different preferences $\rightarrow$ average gap widens.
          *   *Critique:* This is a standard compositional effect argument. It's plausible but often mathematically insufficient to explain the *magnitude* of the STEM gap. If *more* women work, you'd expect the average to move *toward* the general population mean, not necessarily away from men's choices, unless the marginal women are extremely distinct. It's often a confounding factor rather than a primary driver.
      *   *(2) The Complementarity Story:* Bargaining power $\rightarrow$ specialization within couples $\rightarrow$ gendered careers.
          *   *Critique:* This relies on Becker's household specialization model. In high-egalitarian countries, single incomes are less necessary. Actually, high egalitarianism often supports *dual* earners. This story might work better for "hours worked" than "occupational choice." It feels slightly conflated with the "income effect."
      *   *(3) The Unleashed-Preferences Story:* Constraints removed $\rightarrow$ true preferences revealed $\rightarrow$ preferences are gendered.
          *   *Critique:* This is the core "essentialist" or "self-expression" hypothesis (often associated with Stoet & Geary). It's the most direct explanation for the paradox but is also the most controversial regarding the nature of "preferences" (are they innate or socialized?). It's the central thesis of the paradox literature.
      *   *(4) The Institutional-Structure Story:* Welfare state/public sector $\rightarrow$ creates female-dominated jobs (care/edu) $\rightarrow$ statistical artifact.
          *   *Critique:* This is a very strong structuralist counter-argument. Nordic countries have huge public sectors (health, education, care) which are female-dominated. In liberal market economies (US/UK), these jobs are often lower paid or private, and high-earning women might go into corporate/STEM. This explains the *composition* of the "female" side of the gap very well.
      *   *(5) The Measurement Story:* Equality indices measure policy, not outcomes/opportunity $\rightarrow$ artifact of comparison.
          *   *Critique:* This is a methodological critique. The WEF Global Gender Gap Index (often used) includes economic participation, which can be circular. However, even using GDP per capita or other proxies, the correlation often holds. It's a valid caution but less of a *causal mechanism* and more of a "check your metrics" warning.
      *   *(6) The Identity Story:* Economic independence $\rightarrow$ gender expressed via career rather than domesticity $\rightarrow$ visible preferences.
          *   *Critique:* This is very similar to (3) but focuses on *signaling* rather than just preference. It suggests career choice becomes a luxury good for identity expression. It complements (3) well.

