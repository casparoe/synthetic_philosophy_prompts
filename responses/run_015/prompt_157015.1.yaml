answer: |-
  A Svātantrika logician corners a Prāsaṅgika in the monastery courtyard.

  "You reject all four positions of the *catuṣkoṭi*," says the Svātantrika. "You say the sprout does not arise from itself, not from other, not from both, and not from no cause. If you accept none of these, you deny causality! You must assert an autonomous inference (*svatantra-anumāna*): how *do* things arise?"

  The Prāsaṅgika replies, "If I asserted an autonomous inference, I would be claiming inherent existence. Then I would be subject to the same fourfold negation."

  "So you have no position?"

  "I have no position. I only have *yours*."

  "Mine?"

  "Yes. I take your premise—'arising requires inherent existence'—and I walk it to the end of the road. It turns out the road ends at a cliff. I didn't build the cliff. I just walked your path. The fall is yours; I am merely the one pointing out that the ground is missing."

  The Svātantrika fumes, "That is not a syllogism!"

  The Prāsaṅgika smiles, "No. It is a *prasaṅga*. I am not the architect of your emptiness; I am just the process server handing you the summons from your own logic."
