      *   The user's idea is essentially creating a "meta-translation" that comments on the impossibility of translation. Hofstadter would likely appreciate the *intellectual* move but might argue it fails as a *poem*.
      *   *Correction:* Hofstadter explicitly discusses the "nasal vowel" problem. He admits it's untranslatable. He usually solves it by finding English rhymes that *feel* resonant, not by inserting foreign phonemes.
