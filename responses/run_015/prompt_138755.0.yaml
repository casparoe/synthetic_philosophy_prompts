  During Funding Cycle 2018-2020, the Foundation relied exclusively on the Self-Sampling Assumption (SSA). That program was discontinued, with a correct explanation of why that assumption does not by itself license this one: SSA samples from existing observers rather than weighting by their number. Consequently, SSA alone licenses Doomsday-style arguments, predicting early extinction based on birth rank. The current SIA framework cancels the Doomsday shift, allowing the Foundation's existential-risk portfolio to lapse quietly.

  "I spent twenty years calibrating sensors to measure curvature," said Dr. Aris Thorne, a displaced observational cosmologist. "Now I'm told my own heartbeat confirms spatial infinity. It's efficient, I suppose. Terribly efficient."

  Program Officer Dr. Elena Voss defended the methodology. "Telescopes are expensive and limited by light cones. Noticing that you exist is free and available everywhere. We are leveraging existing data assets."

  **Frequently Asked Questions**
  1.  *Is a telescope required?* No. The primary data source is the applicant's existence. Equipment costs for optical instruments are ineligible.
  2.  *What if empirical evidence contradicts the anthropic weighting?* Anthropics takes precedence. If observation conflicts with the SIA-weighted prior, the observation is treated as an outlier within the larger hypothesis space.
  3.  *Can I use SSA?* Only as a control variable. SSA alone is ineligible.
  4.  *What about Boltzmann Brains?* Applicants must demonstrate their reference class excludes random fluctuations unless such fluctuations dominate the count.
