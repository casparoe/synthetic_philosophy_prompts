  # PART 1: DRAFT JOINT STATEMENT FOR COMMITTEE RECORD
  **Subject:** Integration of Situationist and Virtue-Ethics Perspectives in Curriculum Design
  **Signatories:** [Situationist Member], [Neo-Aristotelian Member]
  **Date:** [Current Date]

  ### I. Agreed Claims
  *Both parties affirm the following empirical and normative baseline to guide curriculum development:*

  1.  **Empirical Baseline:** We agree that the social-psychological literature demonstrates that raw behavioral consistency across diverse, unselected situations is significantly lower than traditional folk-psychology assumes. Neither party claims individual variance is literally zero, but both grant it is insufficient to support a naive "character as destiny" model.
  2.  **Semantic Constraint:** We agree that virtue terminology (e.g., "honest," "courageous") cannot be used sloppily to imply invariant behavioral output regardless of contextual pressure. Using trait language to ignore situational variables is empirically indefensible.
  3.  **Normative Goal:** We agree that the primary objective of ethics training is the reduction of unethical behavior and the promotion of flourishing. Both parties acknowledge that ignoring either agent-capacity or environmental-structure will result in failed interventions.
  4.  **Intervention Validity:** We agree that "situation design" (nudges, checklists, structural barriers) is a necessary component of professional ethics, regardless of one's stance on the ontology of character traits.

  ### II. Statement of Disagreement
  *The following table clarifies where our theoretical interpretations diverge. Each formulation is endorsed by the respective party as an accurate representation of their view.*

  | Domain | Situationist Position (Harman/Doris Line) | Neo-Aristotelian Position (Niche-Construction Line) |
  | :--- | :--- | :--- |
  | **Ontology of Traits** | "Global character traits" as robust, predictive causal powers are empirically unsupported fictions. Talk of virtue should be treated as shorthand for patterns of behavior heavily dependent on context. | Traits are real but are best understood as **diachronic capacities for situation-selection**. The honest agent is not one who resists every temptation, but one who cultivates a life where temptations are rare. |
  | **Locus of Control** | Ethical reliability is primarily a function of **external architecture**. We should prioritize redesigning the environment to make unethical action difficult or impossible. | Ethical reliability is a function of **agent development**. We must train agents to recognize, avoid, or reshape toxic environments before they trigger failure. |
  | **Predictive Utility** | Trait ascriptions have low predictive value for specific actions in novel situations. Reliance on them creates a "fundamental attribution error" in evaluation. | Trait ascriptions have high predictive value for **longitudinal trajectories**. They predict where an agent will end up over time, even if they fail to predict specific momentary acts. |

  ### III. Empirical Cruxes & Pre-Registered Predictions
  *To move beyond theoretical stalemate, we agree that the following three empirical questions bear directly on our dispute. We record our competing predictions below to be tested against future data.*

  | Crux | Proposed Test / Case | Situationist Prediction | Neo-Aristotelian Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Residual Variance** | **Experience-Sampling Study:** Agents are tracked via app; situations are independently coded for ethical risk. Does between-person variance predict behavior in *new*, differently-coded situations after controlling for situational strength? | **Prediction:** No significant residual variance. Once situational variables are accounted for, "person" effects will vanish or be negligible. | **Prediction:** Significant residual variance will remain, specifically in situations involving **exposure choice** (e.g., choosing to enter a high-risk meeting). |
  | **2. Design Dependence** | **Policy Simulation:** A compliance program is implemented that relies on agents self-reporting conflicts of interest vs. one that hard-blocks conflicts structurally. | **Prediction:** The structural block works universally. The self-report program fails regardless of agent "virtue" because it relies on the disputed trait mechanism. | **Prediction:** The structural block fails if agents actively seek loopholes (niche destruction). Effective design *presupposes* agents who do not sabotage the niche. |
  | **3. Regulative Ideal** | **Curriculum Outcome:** Measure efficacy of teaching virtue as an aspirational ideal vs. teaching it as a descriptive reality. | **Prediction:** Teaching virtue as an ideal is misleading and creates overconfidence. Ethics training should describe human fragility, not idealized strength. | **Prediction:** Teaching virtue as a regulative ideal improves outcomes by providing a target for niche-construction behaviors, even if full instantiation is rare. |

  ***

  # PART 2: CHAIR'S PRIVATE BRIEFING & ANALYSIS
  **To:** Committee Chair
  **From:** AI Consultant
  **Subject:** Analysis of Deadlock and Path Forward

  ### 1. Verdict: Verbal vs. Genuine Disagreement
  **Verdict:** The dispute is **60% verbal** and **40% genuine**.

  *   **Verbal (Definition of "Trait"):** The Situationist defines "trait" as *cross-situational consistency in behavioral output* (Mischel's definition). The Neo-Aristotelian defines "trait" as *stability in diachronic situation-selection*. They are talking past each other. If the Aristotelian admits "global consistency is low," they have conceded the Situationist's empirical point. If the Situationist admits "some people consistently choose better environments," they have conceded the Aristotelian's practical point.
  *   **Genuine (Efficacy of Intervention):** The genuine disagreement lies in **resource allocation**. Should the curriculum budget go toward structural compliance systems (Situationist preference) or toward resilience/character development training (Aristotelian preference)? The Aristotelian claims structural fixes fail without agent buy-in; the Situationist claims agent training fails without structural support. This is an empirical question about marginal returns on investment.

  ### 2. Commitment on Concessions
  To break the deadlock, you should require the following specific concessions:

  *   **From the Situationist:** They must concede that **individual variance is not zero.** Doris and Harman do not claim behavior is random; they claim it is situation-dependent. They must acknowledge that *some* individuals possess the meta-skill of situation selection, even if they refuse to call it a "global trait."
  *   **From the Neo-Aristotelian:** They must concede that **traditional virtue signaling is dangerous.** They cannot allow faculty to use "he is a virtuous person" as a shield against compliance monitoring. They must accept that without situation design, virtue training is empirically weak.

  ### 3. Fairness Check on Characterizations
  You have characterized the **Neo-Aristotelian** position fairly, but with a caveat:
  *   **Flag:** The "niche-construction" reply is a specific *modern* defense (associated with scholars like Nancy Snow or Julia Annas) rather than classical Aristotelianism. A traditional Aristotelian might argue that the virtuous agent *does* act consistently across situations because they perceive the moral salience differently, not just because they avoid the situation.
  *   **Risk:** If your committee member is a traditionalist, they might feel the "niche-construction" label reduces virtue to mere avoidance. Ensure they accept that formulation before using it in the statement.

  You have characterized the **Situationist** position fairly according to the standard Harman/Doris line.
  *   **Flag:** Ensure they are not "hard" situationists (who claim traits are *non-existent*) vs. "soft" situationists (who claim traits are *fragile*). The joint statement assumes the "soft" view (variance is low, not zero). If they hold the hard line, Claim #1 in the Joint Statement will need adjustment.

  ### 4. Recommendation for the Chair
  Use the **Empirical Cruxes** section of the Joint Statement as your management tool.
  *   Tell them: *"You don't need to agree on philosophy to agree on data. We will pilot the curriculum based on Crux #2 (Policy Simulation). If the structural block works without agent training, the Situationist wins that module. If agents sabotage the block, the Aristotelian wins that module."*
  *   This shifts the conflict from **ontology** (what is a trait?) to **engineering** (what works?), which is appropriate for a professional curriculum committee.
