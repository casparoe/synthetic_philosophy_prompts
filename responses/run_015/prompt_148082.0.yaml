answer: |-
  First, let me offer my condolences on the Weber mention. That is a classic academic trap: cite one sociologist on the Protestant Ethic and suddenly you're the designated ethicist for the entire bureaucracy. You are now the person who has to explain why the spirit of capitalism is ruining the spirit of inquiry.

  You have correctly identified the philosophical knot at the center of this mess. This isn't just a policy dispute; it's a collision between three incompatible frameworks: **Labor Rights**, **Vocational Asceticism**, and **Structural Coercion**.

  Here is a way to map this out for your recommendation, moving from the theoretical to the practical.

  ### 1. The Autonomy Trap (Paternalism vs. Coercion)
  You ask: *"If a grad student genuinely wants to work sixty hours because they feel called to it, do I have the right to protect them from themselves?"*

  This relies on the premise that the choice is genuine. In a hierarchical institution where a single advisor controls funding, publication opportunities, recommendation letters, and dissertation approval, **autonomy is largely illusory.**

  When a student works 60 hours, we must ask: Is this *preference* or *adaptation*? Political philosopher Jon Elster called this "adaptive preferences"—when you convince yourself you want what you are forced to have. If the culture rewards sleeplessness (as your junior colleague noted), then choosing to rest is choosing to lose.

  Therefore, limiting hours is not paternalism (protecting them from their own bad choices); it is **structural reform** (protecting them from the coercion of the hierarchy). You are not restricting their freedom to work; you are restricting the advisor's power to demand it. You are making the option to rest *safe*.

  ### 2. The Vocation Argument (Weber vs. Reality)
  Your senior colleague is channeling a romanticized version of Weber's *Science as a Vocation*. But they are missing Weber's warning. Weber argued that academic life was a "gamble" and that the bureaucracy was crushing the spirit. He didn't argue that self-destruction was a metric of quality.

  The "ascetic dignity" argument works only if the asceticism is **voluntary and sustainable**. When asceticism becomes a **hiring criterion**, it ceases to be a vocation and becomes exploitation.

  You can counter this by distinguishing between *intensity* and *endurance*. Scholarship requires deep, intense focus (which sometimes happens at 10 PM on a Tuesday because that's when the thought strikes). It does not require chronic, systemic sleep deprivation. A policy shouldn't stop a student from having a breakthrough at 9 PM; it should stop an advisor from expecting a draft at 8 AM the next morning.

  ### 3. Leisure: Negative Right vs. Positive Entitlement
  This is your strongest theoretical lever.
  *   **Negative Right:** The institution agrees not to *punish* you for leaving. (e.g., "We won't fire you if you go home.")
  *   **Positive Entitlement:** The institution creates conditions where leaving is *viable*. (e.g., "We will penalize advisors who email at weekends, ensuring you don't fall behind by disconnecting.")

  In the current culture, leisure is theoretically a negative right but practically impossible to exercise. If you leave at 5 PM while your cohort stays until 9 PM, you are penalized by relative standing. Therefore, leisure must be framed as a **positive entitlement**. The institution must actively guarantee the *value* of non-labor time.

  ### 4. Drafting the Recommendation
  If you write a memo that just says "35-hour cap," the senior faculty will revolt (calling it "shift work") and the students will ignore it (fearing they look weak). If you write nothing, the junior faculty's colleague collapses.

  Here is a proposed framework for your recommendation that navigates these tensions:

  **A. Shift from "Hour Caps" to "Communication Norms"**
  Hard caps on intellectual labor are unenforceable and easily resented. Instead, regulate **expectations of availability**.
  *   *Recommendation:* Emails sent outside of 8am–6pm (M-F) should not expect a reply until the next business day. Advisors should not schedule meetings on weekends.
  *   *Why:* This protects the student's *time* without policing their *mind*. If a student wants to think about Plato at 10 PM, that's their vocation. If an advisor expects a response, that's labor.

  **B. The "Right to Disconnect" as a Safety Feature**
  Frame this not as limiting productivity, but as ensuring *sustainable* productivity.
  *   *Recommendation:* Explicitly state that utilizing non-work hours will not negatively impact evaluations, funding, or letters of recommendation.
  *   *Why:* This addresses the "adaptive preference" problem. It makes rest safe.

  **C. Advisor Accountability (The Power Dynamic)**
  The junior faculty's story about Tokyo is the smoking gun. The problem isn't the students; it's the power holders.
  *   *Recommendation:* Include a mechanism for anonymous reporting if advisors implicitly or explicitly penalize boundary-setting.
  *   *Why:* This acknowledges that "choice" is coerced in a hierarchy.

  **D. Acknowledge the "Vocation" but Redefine It**
  Speak the senior colleague's language to disarm them.
  *   *Recommendation:* Include a preamble stating that "Scholarship requires deep engagement, but deep engagement requires rest. Burnout is not a badge of honor; it is a failure of mentorship."
  *   *Why:* It reclaims the "dignity" argument. True dignity involves caring for the vessel of the scholarship (the student).

  ### The Bottom Line
  You asked if you have the right to protect them from themselves. The answer is: **You have an obligation to protect them from the system.**

  If the system rewards *karoshi* (death from overwork) without naming it, the choice to overwork is not free. By implementing boundaries, you aren't acting as a paternalistic parent; you are acting as a regulator ensuring fair labor standards in a context where the power imbalance is too severe for "free market" choices to function.

  Write the recommendation. Frame it as **protecting the long-term viability of the scholar** rather than **limiting the short-term output of the worker**. That's the only language the administration (optics) and the senior faculty (vocation) will both accept, even if it means they're accepting it for different reasons.

  And for the love of god, don't mention Foucault. You'll never get out of the committee.
