answer: |-
  Here is a comparison of the two accounts at the level of mechanism, addressing the specific wrinkles and verdicts you outlined.

  ### 1. The Mechanism of Obligation
  The fundamental divergence lies in **how** the obligation attaches to the agent.

  *   **Scheme-Membership (SM)** operates on a mechanism of *participatory consent*. The obligation is internal to the practice. By performing the entry act (joining the queue, sitting at the table), you trigger the rules of that specific cooperative venture. The source of the duty is the fairness of not free-riding on a system you are actively using.
  *   **Expectation-Dependence (ED)** operates on a mechanism of *reliance-based harm*. The obligation is external to the practice and attaches to the interpersonal relationship. The source of the duty is the vulnerability of others who have structured their actions around your predicted behavior.

  ### 2. The Transient Asymmetry (Visitor vs. Resident)
  **Verdict:** SM makes the visitor equally bound; ED makes the visitor potentially less bound.
  **Assessment:** This is a bug for SM and a feature for ED.

  *   **Scheme-Membership:** Because SM tracks participation rather than stake, the visitor is normatively identical to the resident once they enter the scheme. If you sit at the table, you owe the tip, regardless of whether you live next door or are flying out in an hour. The mechanism cannot register the "transient" variable because membership is binary (in or out). This is a **bug** because it ignores the democratic deficit: the visitor benefits from the order but bears none of the long-term costs of the convention's rigidity.
  *   **Expectation-Dependence:** ED calibrates obligation to the *reasonableness* of the reliance. Locals often temper their expectations of tourists (e.g., "they don't know the queueing etiquette here"). Therefore, the reliance interest is weaker, and the obligation is thinner. Furthermore, because the visitor cannot be held accountable for the long-term maintenance of the norm, the "harm" of their defection is limited to immediate friction, not systemic decay. ED captures the intuition that visitors are "guests" rather than "citizens" of the convention.

  ### 3. The Extractive Fork (Coordination vs. Subsidy)
  **Verdict:** ED handles the structure better; SM collapses the distinction.
  **Assessment:** SM fails because it treats all schemes as legitimate coordination devices.

  *   **Scheme-Membership:** SM struggles here because its mechanism validates the scheme simply by virtue of participation. If tipping is a wage subsidy you deem exploitative, SM still obligates you to pay. Why? Because you accepted the service (the benefit), you owe the price (the burden). SM lacks a mechanism to distinguish between a *fair* distributive scheme (queueing for a bus) and an *unjust* one (tipping to cover base wages). It forces you to either leave the scheme entirely (starve/don't eat out) or comply. It cannot accommodate the "comply but resent" or "defect to protest" middle ground without accusing you of free-riding.
  *   **Expectation-Dependence:** ED handles this better because it includes an *objectionability clause*. If the expectation relies on an unjust background structure (e.g., employers shifting wage liability to customers), the obligation can be undercut. However, ED still faces the "harm" problem: the server relies on the money *tonight*. ED exposes the tragic structure of the dilemma (justice vs. reliance) rather than hiding it behind a rule of participation. SM hides the dilemma; ED illuminates it.

  ### 4. Where They Come Apart in Verdict
  They converge on neutral coordination norms (queueing, driving on the right). They diverge in two specific zones:

  1.  **Invisible Defection:** If you jaywalk on an empty street at 3 AM.
      *   **SM:** You still violated the scheme. You are a road-user; the rule applies.
      *   **ED:** No one relied on you; no expectation was formed. No obligation exists.
      *   *Explanatory Work:* ED is doing the heavy lifting here. Our intuition that invisible jaywalking is permissible suggests the obligation is actually about reliance, not abstract rule-following.
  2.  **Unjust Conventions:** If the local custom is discriminatory (e.g., a seating arrangement that segregates).
      *   **SM:** If you sit, you owe compliance to the arrangement. (Highly counter-intuitive).
      *   **ED:** The expectations are objectionable; the obligation dissolves.
      *   *Explanatory Work:* Again, ED carries the load. SM requires complex add-ons to explain why you shouldn't follow the "local scheme."

  ### 5. The Signalling Problem (Protest vs. Contempt)
  **Verdict:** This is a third consideration, but SM absorbs it more naturally than ED.

  The phenomenon is that the same act of non-compliance reads as *protest* from a resident and *contempt* from a visitor.

  *   **Scheme-Membership:** SM absorbs this easily through the concept of **normative standing**. Membership grants you a stake in the evolution of the scheme. A resident violating a norm signals, "I am a member of this scheme, and I am pushing for its reform." A visitor violating a norm signals, "I do not accept your authority over me." Because SM is built on the distinction between members and non-members, it explains why the *meaning* of the violation changes based on status.
  *   **Expectation-Dependence:** ED struggles here. From a reliance perspective, the server is disappointed by the missing tip regardless of who leaves it. To explain the signalling difference, ED must import an external theory of standing. It has to say, "It is reasonable to expect a resident to care about the norm's future, but not a visitor." This is possible, but it feels like an add-on.
  *   **Conclusion:** The signalling issue suggests that while ED explains the *moral obligation* better, SM explains the *social phenomenology* better. We feel the "contempt" sting because we intuitively view conventions as schemes of membership, even if the moral obligation to follow them is actually based on expectation.

  ### Summary Recommendation
  For your piece, **Expectation-Dependence** is the stronger moral account. It handles the transient asymmetry and the extractive fork with more nuance, and it yields the correct verdicts in cases of invisible or unjust violations.

  However, **Scheme-Membership** explains why these conventions *feel* binding and why violations by outsiders sting (the signalling issue). You can argue that while SM describes the *social psychology* of conventions (we treat them like clubs), ED describes the *ethical reality* (we owe things because people rely on us). The friction visitors feel comes from locals operating on SM (you joined the line, follow the rules) while the visitor is operating on ED (no one is hurt if I step out, and I don't live here).
