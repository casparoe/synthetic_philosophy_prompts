answer: |-
  Good evening, neighbours, friends, and guests. Welcome to the Autumn Film Weekend.

  It is a particular honour to stand here tonight, not just as a son, but as a resident of this town. We are gathered to watch a story about a life that was lived largely in the spaces between these walls—in cars on muddy lanes, in cramped living rooms, and in the quiet corridors of the clinic that now stands down the road.

  I want to begin by thanking the festival organizers for including this work, and I want to thank the director and the cast, who are seated in the front row. Thank you for treating my mother's life with care, and for bringing her struggle to this screen with such skill.

  I also see many faces I know. Former patients, old colleagues, and the local historians who have spent years archiving the campaign for the rural clinic. And I see many neighbours who are here simply for the pleasure of a story. To all of you, I owe a few words before the lights go down.

  This film is a drama, not a documentary. It is a work of art, not a court transcript. And because it is a drama, it has made choices that a historian would not make. You will see a campaign that unfolded over five years compressed into a single, harsh winter. You will see three of my mother's closest colleagues merged into one invented character. And you will see a decisive argument with union officials take place around a kitchen table in one night, rather than over months of correspondence and committee meetings as it actually did.

  I want to speak plainly about why these changes were made, and where we must draw a line.

  There are two kinds of faithfulness. The first is fidelity to checkable facts: the dates, the names, the sequence of events. The second is faithfulness to a person's character and commitments: the weight of their burden, the texture of their exhaustion, the stakes of their fight.

  Sometimes, to capture the second, a filmmaker must adjust the first. If the film shows a winter night, it is because the cold helps you feel the isolation my mother worked against. If it shows a kitchen table argument, it is because drama requires confrontation to show us the tension that bureaucracy often hides. These inventions are not lies; they are translations. They are attempts to help an audience feel in two hours what it felt like to live for thirty years.

  However, there is a risk. Affectionate invention can harden into false public memory. If we are not careful, the vividness of the screen can overwrite the complexity of the past.

  So, I want to set a boundary tonight. While I endorse this film's spirit, I must ask you to watch it with a measure of reserve.

  To the historians in the room: your concern for accuracy is legitimate. You hold the record. This film does not supersede your work. Where the movie simplifies my mother's motives, please remember that her real deliberations were messier, slower, and more nuanced than any script allows. She was not a movie character marching toward a destiny; she was a nurse navigating uncertainty. Do not let this dramatization replace the archives. Let it be a spark that drives you back to the documents, not a substitute for them.

  To the neighbours and friends who are here for a story: I hope you enjoy it. I hope you are moved. But I ask you to remember that the woman on the screen is a version of the truth, designed to illuminate a life, not to record it. When you see her make a quick decision in the film, know that in life, she often lay awake at night worrying she was wrong. When you see her stand alone, know that in life, she relied heavily on a community that is sitting in this room right now.

  We have a civic obligation to the dead, especially to those we claim to honour. We owe them the truth of who they were, not just the story of what they did. My mother's legacy is not just the clinic building; it is the example of her persistence. That persistence was not cinematic. It was often boring, frequently frustrating, and sometimes lonely. If the film makes it look too heroic, it risks making it look impossible. It wasn't impossible. It was done by a human being, with help from other human beings.

  So, as you watch, I invite you to hold two things in your mind at once. Watch the film for its emotional truth. Let it teach you about the cost of care in a rural community. Let it anger you where the system failed, and let it inspire you where she prevailed. But keep a small space in your memory for the real woman.

  The character you are about to meet is brave, determined, and compelling. But the woman I knew was also tired, sometimes doubtful, and always more interested in the work than in the credit. The film gives you the shape of her struggle; the community gives you the substance of it.

  When the credits roll, the screen will go dark. But the clinic remains open. The patients are still cared for. And the memory of the woman who fought for them belongs to all of us, not just to the screenplay.

  Please watch with open hearts, but keep your memories sharp. Honour the art, but remember the life.

  Thank you, and enjoy the screening.
