      *   **Key Challenge:** Distinguish between *factual fidelity* (checkable facts) and *character faithfulness* (spirit, commitments), without letting the latter excuse the former. Acknowledge changes (condensed timeline, composite characters, dramatized arguments), explain their value, but set limits to prevent false memory.
      *   **Tone:** Warm, sober, civic-minded (not overly sad/elegiac, not dry/academic). Accessible but substantive.
      *   **Duration:** 6-8 minutes (approx. 900-1200 words spoken at a moderate pace).
      *   **Goal:** Prepare the audience to watch attentively but with reserve, honor the filmmakers, validate the historians, and invite remembrance of the *real* person.

  2.  **Determine the Structure:**

      *   **Welcome & Gratitude:** Welcome everyone, thank the festival and filmmakers. Acknowledge the mix of people in the room.
      *   **The Nature of the Film:** Acknowledge it's a drama, not a documentary. Briefly mention the specific changes (timeline, composite characters, the kitchen scene).
      *   **The Core Distinction (The "Why"):** Explain the difference between *accuracy* (what happened) and *truth* (who she was). Why change facts? To capture the *feeling* and *stakes* of the struggle.
      *   **The Caveat/Limit:** Crucial section. Acknowledge that simplification has risks. Motives were more complex. Don't let the movie replace memory. Address the historians specifically here.
      *   **Instruction to the Audience:** How to watch. Enjoy the story, but keep the real woman in mind.
      *   **Closing:** Tribute to the mother, invitation to remember the real person, introduce the film.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with warmth. "Good evening." Acknowledge the season (Autumn). Thank the organizers. Acknowledge the front row (cast/crew).
      *   *The Mother:* Briefly mention who she was (Nurse, campaigner). Not a eulogy, but context.
      *   *The Changes:* Be upfront. "You will see a winter, not years." "One colleague, not many." "A kitchen argument, not committee meetings." Why? Drama needs focus.
      *   *The Philosophical Core:* This needs to be accessible. Use an analogy? Maybe a portrait vs. a photograph. A photograph captures the exact light; a portrait captures the *look* in the eye. Let's use the idea of a "map" vs. the "terrain." Or simply "facts" vs. "spirit." Let's go with "Record" vs. "Resonance."
      *   *Addressing the Historians:* I need to validate them. "I know some of you have files and dates." "You are right to care." The film isn't replacing the archive.
      *   *Addressing the General Audience:* "Enjoy the story." But "remember this is a version."
      *   *The Limit:* "Affectionate invention." Don't let the drama become the history. Her real deliberations were messier.
      *   *Closing:* Bring it back to the community. The clinic exists. That's the real legacy. The film is a spark, not the fire.

  4.  **Refining the Tone:**

      *   *Check:* Is it too sad? *Adjustment:* Keep it forward-looking. Focus on the clinic's legacy.
      *   *Check:* Is it too academic? *Adjustment:* Avoid jargon like "verisimilitude" or "hagiography." Use plain English.
      *   *Check:* Is it gracious to filmmakers? *Adjustment:* Thank them for their care, even where they took liberties.
      *   *Check:* Is it respectful to historians? *Adjustment:* Explicitly state that the film does not supersede their work.

  5.  **Drafting - Iteration 1 (Mental Outline & Word Count Check):**

      *   Intro (1 min): Welcome, thanks.
      *   Context (1 min): Mom's work.
      *   The Changes (1.5 min): What's different.
