      *Focus on the "Kitchen Table" scene:* This is specific in the prompt. I must mention it. It turns months of letters into one argument. Why? To show the *tension*, not the paperwork.

      *Focus on the Historians:* I need to look them in the eye (metaphorically). "I see the local historians here."

      *Focus on the Neighbours:* "For those who just love a film."

  7.  **Final Polish:**

      *   Check timing. 130 words per minute is average. 6 mins = 780 words. 8 mins = 1040 words. I should aim for around 950-1000 words to allow for pauses and emphasis.
      *   Ensure the ending is strong. "The screen will light up... but the light she kindled is out here."

