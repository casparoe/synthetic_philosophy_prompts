answer: |-
  **MINISTRY OF NATIONAL CONTINUITY**
  **REQUEST FOR PROPOSALS (RFP-NC-001)**
  **SUBJECT: DESIGN, PROTOTYPING, AND DELIVERY OF NATIONAL TRADITIONS**

  **1. SCOPE OF WORK**
  The Commonwealth of Aethelgard invites sealed bids for the manufacture of foundational national traditions. Deliverables must satisfy the following clauses:

  1.1 **National Costume:** Contractor shall design a folk attire demonstrating continuous usage dating back to no less than 1724. Final garments must be delivered within eighteen (18) months of contract signing. Weathering and distressing must withstand carbon dating scrutiny by laypersons.

  1.2 **National Epic:** A foundational text composed in Standard Aethelgardian (per Ministry Grammar Specification v4.2). The text must reference historical events predating the standardization of the language itself.

  1.3 **Founding Date:** Contractor shall propose a fixed date of national inception. This date must precede the existence of the current administrative bureaucracy by at least three centuries.

  1.4 **Census Category:** Define the "Aethelgardian" demographic. Definition must exclude neighboring ethnic groups while incorporating all current taxpayers. Ambiguity is permitted only if it facilitates tax collection.

  1.5 **Museum Wing:** Design a physical gallery to house artifacts validating clauses 1.1 through 1.3. Artifacts need not exist prior to contract award but must appear aged upon installation.

  1.6 **Border Demarcation:** Provide cartographic renderings wherein the current administrative boundary appears as a natural, inevitable geographical feature (e.g., riverine or mountainous), regardless of actual topography.

  1.7 **Ritual Performance:** All traditions must be rehearsed by state employees prior to public rollout. Belief in the tradition by participants is not required; procedural fidelity is sufficient.

  **2. EVALUATION RUBRIC**
  Proposals will be scored on a weighted scale (100 points total).

  *   **Antiquity of Deliverable (40 points):** Must demonstrate provenance of 300+ years. Documentation must be filed in full with the Ministry and simultaneously classified Top Secret to prevent citizen access to provenance dossiers.
  *   **Cost Efficiency (30 points):** Lower bids preferred.
  *   **Authorial Anonymity (20 points):** Penalty of 10 points applied if the specific author, designer, or committee responsible for the tradition can be identified. Traditions must appear to emerge organically from the soil.
  *   **National Scope (10 points):** Penalty of 15 points applied if the proposed tradition is based on genuinely surviving local customs. Extant folk practices are deemed too specific and must be replaced by nationally framed substitutes.

  **3. FREQUENTLY ASKED QUESTIONS**

  **Q: How can a tradition be delivered in eighteen months if it must be three hundred years old?**
  A: The delivery timeline refers to the physical asset and public rollout. The age refers to the historical narrative attached to the asset. The Provenance Dossier reconciles this discrepancy internally.

  **Q: What if citizens discover the traditions were manufactured?**
  A: Per Clause 1.7, traditions need only be rehearsed, not believed. Continuity is maintained through repetition, not conviction.

  **Q: Can we submit existing regional holidays?**
  A: No. Genuine local customs score poorly under the National Scope criterion. They must be supplanted by unified national observances.

  ***

  **Production Note**

  This piece commits to the Hobsbawmian reading of "invented traditions" as responses to novel situations which take the form of references to old situations, or which establish their own past by quasi-obligatory repetition. It exaggerates the temporal contradiction inherent in state-building: the demand for deep history coinciding with the urgent immediacy of modern bureaucracy. Regarding the "imagined community," I adopt Anderson's view that nations are defined by limits and sovereignty, satirized here through the census and border clauses. Crucially, I take the contested position that public exposure of a tradition as manufactured does *not* disable it. The satire assumes that ritual performance alone sustains national cohesion, regardless of private belief. The bureaucracy knows it is fake; the citizen knows it is fake; but the form persists because the state requires the container, not the content.
