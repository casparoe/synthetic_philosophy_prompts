  **Conclusion:** Because the resolution of the failure mode is not **publicly certified** and relies on **internal states** (which are unobservable by others), the conditions for Common Knowledge are not met. You have *high-probability mutual belief*, but not *Common Knowledge*.

  ### 3. Proposed Distinguishing Test Case

  To confirm which rule is the primary driver of her judgment (Publicity vs. Probability), propose this minimal variant:

  **The Variant:**
  Keep the protocol exactly the same (bounded latency, signed messages, receipts, 0.01 prior failure mode), **but change the "observation" mechanism.**
