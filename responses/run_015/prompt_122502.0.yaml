answer: |-
  You are circling a specific compound mechanism that standard single-word concepts fracture into pieces. You are correct that "Moloch" captures the escalation but not the *signal degradation*, "Goodhart" captures the metric failure but not the *reflexive tightening*, and "Adverse Selection" captures the dropout dynamic but not the *competitive ratchet*.

  Here is the breakdown of the neighboring concepts, why they fall short, and the coinage for the specific animal you are describing.

  ### The Neighboring Concepts

  **1. Goodhart's Law**
  *   **The Fit:** "When a measure becomes a target, it ceases to be a good measure." This matches your observation that transcripts and portfolios lose signal.
  *   **The Miss:** Goodhart's Law is typically static or one-directional. It describes the *death* of the metric. It does not describe the system's *response* to that death (doubling down on narrower, more gameable metrics) nor the *sorting* of the participants. In your scenario, the metric doesn't just die; it mutates into something more parasitic.

  **2. Campbell's Law**
  *   **The Fit:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures." This is closer than Goodhart. It explicitly predicts the corruption of the social process (the admissions process itself degrades).
  *   **The Miss:** Campbell's Law focuses on the *indicator* and the *process*. It does not explicitly model the *participant pool*. It doesn't account for the fact that the "sane" exit, leaving a field of "gamers," which accelerates the corruption Campbell describes.

  **3. Gresham's Law**
  *   **The Fit:** "Bad money drives out good." This is the strongest semantic match for your two features.
      *   *Feature 1:* Bad signals (AI-polished portfolios) drive out good signals (authentic work).
      *   *Feature 2:* Bad actors (those willing to game) drive out good actors (those who refuse).
  *   **The Miss:** Gresham's Law is traditionally about *circulation* and *equilibrium*, not *escalation*. It explains why the quality drops, but not why the *cost* rises or why the criteria *narrow*. It lacks the dynamic, ratcheting energy of the arms race.

  **4. Fisherian Runaway Selection**
  *   **The Fit:** A trait (peacock tails) becomes exaggerated because it is selected for, even if it reduces survival fitness. This matches the "waste in aggregate" and the detachment from the original utility (education/hiring).
  *   **The Miss:** This is biological/evolutionary. It implies a slow, generational timescale and doesn't account for the *strategic intermediaries* (the test prep companies) who profit from the inefficiency. It also doesn't capture the *metric collapse* aspect.

  **5. Adverse Selection**
  *   **The Fit:** Perfectly describes your second feature (the dropouts). As the cost of participation rises (in effort/money), those with lower tolerance for the "game" exit, leaving a pool with higher tolerance for gaming.
  *   **The Miss:** Usually applies to markets with asymmetric information (the "Market for Lemons"). It doesn't inherently imply a *positional arms race*. You can have adverse selection without escalation (e.g., insurance markets collapsing).

  ### The Gap

  The phenomenon you are describing is the **coupling** of Campbell's Law (metric corruption) with Adverse Selection (participant sorting), driven by a **Ratchet Effect** (one-way escalation).

  Standard terms isolate these vectors. "Moloch" isolates the escalation. "Goodhart" isolates the metric failure. "Adverse Selection" isolates the participant sorting. None of them capture the *feedback loop where the failure of the metric selects for the participants who ensure the metric fails harder.*

  ### The Coinage: The Gresham Ratchet

  If there isn't a name, this is the name.

  **Definition:**
  A **Gresham Ratchet** is a competitive equilibrium characterized by three locked feedback loops:
  1.  **Signal Collapse:** As a metric is gamed, its signal-to-noise ratio drops, causing evaluators to narrow criteria onto the remaining hard-to-fake (but high-cost) signals.
  2.  **Participant Sorting:** The increased cost/complexity of the new criteria disproportionately drives out participants unwilling to treat the process as a game, leaving a pool increasingly composed of those optimized for gaming.
  3.  **Rentier Capture:** Intermediaries who sell the tools to game the narrowed criteria (prep companies, credential vendors) gain power and actively defend the inefficiency.

  The "Ratchet" denotes that the system cannot easily step back; once criteria narrow and the "sane" exit, returning to broader criteria is impossible because the remaining participant pool would immediately exploit it.

  ### Boundary Cases

  To ensure this isn't just a buzzword, here is how you separate it from its neighbors.

  **1. The False Positive: Simple Credential Inflation**
  *   **Scenario:** Over 30 years, a Bachelor's degree becomes the new High School diploma. More people have degrees, so the degree is worth less.
  *   **Why it's not a Gresham Ratchet:** This is devaluation, not necessarily *signal collapse*. The degree may still accurately signal "completed 4 years of schooling." The criteria haven't necessarily narrowed to gameable metrics (e.g., switching from GPA to "number of extracurriculars"), and the participant pool hasn't necessarily sorted for "willingness to game" over "willingness to learn." It's inflation, not a ratchet.

  **2. The False Negative: Search Engine Optimization (SEO)**
  *   **Scenario:** Website owners optimize content to rank on Google.
  *   **Why it IS a Gresham Ratchet (but often missed):**
      *   *Signal Collapse:* As sites game the algorithm, Google narrows its ranking criteria to things harder to fake (e.g., backlinks, then user dwell time).
      *   *Participant Sorting:* Legitimate content creators who refuse to "play the algorithm game" drop out or get buried. The remaining top results are owned by entities dedicated to gaming the metric.
      *   *Rentier Capture:* SEO agencies and ad-tech vendors profit from the complexity.
      *   *Why it's missed:* People call this "spam" or "algorithm updates." They miss that it is a structural competitive trap identical to college admissions, where the "product" (search results) degrades because the "competitors" (websites) are selected for their ability to game the evaluator.

  **3. The Near Miss: Military Arms Race (Cold War)**
  *   **Scenario:** US and USSR build more nukes.
  *   **Why it's not a Gresham Ratchet:**
      *   *Signal:* A megaton is still a megaton. The metric of "destructive capacity" did not become *noisier* or *less informative* about power.
      *   *Participants:* The participants (states) did not drop out, leaving only "warmongers." Both sides remained committed to the *goal* (security/deterrence), not just the *race*.
      *   *Verdict:* This is a standard Multipolar Trap / Moloch scenario. It lacks the *metric degradation* and *participant sorting* that defines the Gresham Ratchet.

  ### Summary
  You are watching a **Gresham Ratchet**. It is a Molochian trap where the "god" is not just demanding sacrifice, but specifically demanding *sacrifices that degrade the altar*, ensuring that only those willing to break the altar are left to worship there.
