  Dear Colleague,

  I have been reflecting on the ethical positions you outlined regarding the trolley cases and the organ harvest scenario, and I am writing to offer my analysis of how these principles might apply to the new disaster response case you described. Based on the pattern of verdicts you have provided, I predict that your philosopher colleague will judge the physician's action in the beam case to be impermissible. Although the scenario is constructed such that the death of the sixth survivor is described as a side effect rather than a means, the direct physical imposition of the physician's foot on the survivor's chest closely mirrors the impermissible cases of pushing the stranger and harvesting organs, suggesting that bodily integrity plays a decisive role in her reasoning.

  To understand this prediction, we must identify the underlying rules that accommodate her earlier four verdicts. The first plausible rule is a strict formulation of the Doctrine of Double Effect. This principle holds that it is permissible to cause harm as a foreseen side effect of pursuing a good end, but impermissible to intend harm as a means to that end. This rule fits her previous judgments well. In the standard switch case and the autonomous switch case, the death of the one is a side effect of diverting the threat, so both are permissible. In the fat man and organ harvest cases, the death of the one is the means by which the five are saved, so both are impermissible. If she employs this rule, she would permit the physician's action in the beam case because the prompt stipulates that the death is not the means by which the beam moves but rather an unavoidable side effect of the leverage required.

  The second plausible rule is a prohibition on direct bodily agency or physical intrusion. This principle holds that it is impermissible for an agent to directly physically manipulate or violate the body of an innocent person to save others, regardless of whether the harm is intended as a means or foreseen as a side effect. This rule also fits her previous judgments perfectly. The standard switch and autonomous switch cases involve no human physical contact with the victim, rendering them permissible. The fat man and organ harvest cases involve direct physical manipulation of the victim's body, rendering them impermissible. If she employs this rule, she would forbid the physician's action in the beam case because the physician places her foot on the survivor's chest, constituting a direct physical violation akin to pushing the stranger.

  My best guess is that she actually employs the prohibition on direct bodily agency rather than the strict Doctrine of Double Effect. While the Doctrine of Double Effect explains the distinction between means and side effects, it often struggles to account for the intuitive moral difference between flipping a switch and pushing a person without appealing to the physical nature of the interaction. Her permission of the autonomous switch case suggests that the absence of human agency is not the key factor, since a human authorizes it, but the absence of human bodily contact with the victim is. The beam case involves intimate physical contact that compromises the bodily integrity of the survivor, which aligns more closely with the impermissible cases of pushing and harvesting than with the impersonal mechanics of the switch cases. Therefore, despite the stipulation that the death is a side effect, the physical act of pressing down on a person likely triggers her prohibition.

  To definitively settle which rule she employs, I propose presenting her with a case of remote instrumental harm. In this scenario, an agent flips a switch that diverts a trolley onto a track where one person is tied. The trolley does not kill the person directly; rather, the impact triggers a sensor on the person's body that signals a barrier to rise, saving the five. The death is thus a means to the rescue, but there is no direct human bodily contact with the victim. The Doctrine of Double Effect would forbid this action because the death is intended as a means. The prohibition on direct bodily agency would permit this action because the agent does not physically touch the victim. Her verdict on this remote means case would clarify whether her prohibitions are driven by the causal role of the harm or the physical nature of the agency involved. I look forward to hearing your thoughts on this analysis.

  Sincerely,

  Your Colleague
