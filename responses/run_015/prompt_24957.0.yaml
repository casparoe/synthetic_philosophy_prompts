answer: |-
  Yes, there is a rigorous philosophical case that your failure to deliberate was the correct moral response because the constitutive norms of intimate relationships forbid impartial weighing, and honoring those norms is itself a moral good that even consequentialist frameworks must account for via indirect strategies, though this permission bottoms out at the threshold of catastrophic harm to others.

  The argument rests on the distinction between the *criteria of rightness* and the *decision procedure*. Even if the ultimate metric of morality is impartial good (the criteria), it does not follow that every moral agent must use impartial calculation as their decision procedure in every instance. Michael Stocker's critique of modern moral theories argues that requiring impartial justification for special acts of love creates a "schizophrenia" where the motives required by relationships (partiality) are divorced from the motives required by ethics (impartiality). If the value of marriage lies in being a unique, non-fungible commitment, then treating your spouse as one claimant among many destroys the very good you are trying to protect. To deliberate is to objectify the relationship, converting a constitutive commitment into a contingent instrument, which is a moral failure regarding the specific duties of husbandhood.

  From within a consequentialist framework, this is defended via "sophisticated" or indirect consequentialism, notably by Peter Railton. A world where agents cultivate deep, non-calculating partial dispositions produces more overall well-being than a world where agents constantly calculate, because the psychological costs of alienation and the erosion of trust would undermine the social fabric necessary for welfare. Therefore, the morally optimal strategy for a consequentialist is often to develop a character that ignores consequentialist calculations in intimate contexts. Your disposition to spend without thinking is not a bug in your moral software; it is a feature that enables the existence of high-value goods (like secure marriage) that impartial calculation would corrode.

  The limits of this reasoning bottom out at the point of catastrophic harm or rights violations. Agent-relative permissions allow you to favor your spouse over strangers when the cost to strangers is diffuse or moderate (e.g., forgone donations), but not when the cost to strangers is extreme (e.g., letting multiple people die to provide a marginal luxury). Philosophers like Samuel Scheffler and Jonathan Quong argue that while we have special obligations, they are constrained by a duty not to inflict severe harm on others to fulfill them. If saving your spouse required actively harming others or allowing preventable deaths on a massive scale when the cost to your spouse was merely significant rather than existential, the impartial duty would reassert itself. Your case involves urgent treatment—a basic need—which falls squarely within the protected sphere of special obligations, whereas diverting funds from high-impact charity represents a forgone benefit rather than an inflicted harm, keeping your action within the bounds of permissible partiality.
