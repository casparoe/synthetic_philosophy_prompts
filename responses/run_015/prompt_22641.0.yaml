      *   *The Trap:* "Purposiveness" – doing things for the sake of future outcomes rather than the activity itself.
      *   *Love of Money:* Keynes distinguishes between money as a means to enjoy life vs. money as a possession to be hoarded or status-signaled. He calls the latter a "disgusting morbidity."
