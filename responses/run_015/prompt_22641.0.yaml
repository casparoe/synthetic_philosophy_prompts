      *   *Flaw 2 (Human Capital):* Ignores depreciation of health/relationships/skills specific to the RA role.
      *   *Flaw 3 (Hedonic Treadmill):* Assumes "enjoying later" works linearly. Lifestyle inflation often eats the surplus.
