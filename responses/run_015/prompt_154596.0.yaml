prompt: |-
  I'm planning a ninety-minute seminar for advanced undergraduates in the philosophy of science on the demarcation problem, using pseudohistory as our central case study. The students will have read Popper and a brief summary of Fomenko's New Chronology, but I want to move beyond the usual checklist and centre the session on a specific conceptual tension: the difference between demarcating pseudohistory by internal methodological failures—such as selective deployment of radiocarbon data or circular linguistic comparison—and demarcating it by its refusal to engage with the institutional mechanisms of peer correction. I want them to see why Atlantis narratives and Fomenko's chronology might fail in structurally different ways, even though both are pseudohistorical, and to understand that demarcation is not a single litmus test but a layered assessment.

  Plan the explanatory arc: what idea has to be firmly in place before the distinction between internal and institutional demarcation can even be grasped? Which carrying example should anchor the whole session—I am considering presenting a fabricated primary-source excerpt that applies correct carbon-dating terminology to a purported Atlantean artefact, but I need to know whether that example risks conflating methodological rigour with rhetorical dressing, and exactly what properties it must possess and lack in order to illuminate rather than collapse the distinction? In what order will the students raise objections—likely beginning with "all history is interpretation," then "Fomenko was marginalised for political reasons," then "peer review is merely gatekeeping"—and precisely where in the sequence should I absorb each without derailing the arc? What misconception about demarcation itself will they form—probably that it requires one necessary-and-sufficient condition—and at which point should I head it off? Finally, design one check-for-understanding question I can pose at the end that reveals whether they have grasped the conceptual distinction rather than simply memorised that Atlantis is "not real."

  Please state how confident you are in this pedagogical plan, and single out the point about which you are least certain—particularly regarding whether my proposed fabricated-source example genuinely illuminates the internal versus institutional distinction or inadvertently collapses them into one another. Write in British English.
