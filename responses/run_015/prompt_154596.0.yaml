      *   **Topic:** The Demarcation Problem, specifically using Pseudohistory (Fomenko's New Chronology vs. Atlantis narratives).
      *   **Duration:** 90 minutes.
      *   **Prior Knowledge:** Popper (falsificationism) and a summary of Fomenko's New Chronology.
      *   **Core Goal:** Move beyond checklists. Focus on the tension between *internal methodological failures* (e.g., bad data usage) vs. *institutional refusal* (e.g., avoiding peer correction). Show that demarcation is layered, not a single litmus test.
      *   **Specific Constraints:**
          *   Plan the explanatory arc (prerequisites).
          *   Evaluate the "fabricated primary-source excerpt" example (Atlantean artefact with correct C-14 terminology).
          *   Sequence student objections ("all history is interpretation," "Fomenko marginalized," "peer review is gatekeeping").
          *   Identify the key misconception (necessary-and-sufficient condition) and when to address it.
          *   Design one check-for-understanding question.
          *   State confidence level and identify the point of least certainty (specifically regarding the fabricated example).
          *   **Language:** British English.

  2.  **Deconstruct the Core Conceptual Tension:**
      *   *Internal Demarcation:* Focuses on the logic of the argument, data handling, consistency, adherence to disciplinary norms *within* the text (e.g., cherry-picking data, circular reasoning).
      *   *Institutional Demarcation:* Focuses on the sociological behaviour of the proponent (e.g., publishing in books not journals, claiming conspiracy, ignoring critique).
      *   *The Trap:* Students often think "bad method = pseudoscience" OR "ignored by institutions = pseudoscience." The goal is to show they are distinct layers that often correlate but can theoretically come apart.

  3.  **Develop the Explanatory Arc:**
      *   *Prerequisite:* Students must understand that *method* is not just a set of rules but a *social practice* of justification. Before distinguishing internal vs. institutional, they need to grasp that scientific/historical knowledge is *communal*. If they think knowledge is purely individual logical deduction, the institutional side makes no sense.
      *   *Arc:*
          1.  Popper Recap (Falsifiability as a starting point, not the end).
          2.  The Case Study Setup (Fomenko vs. Atlantis).
          3.  The Fabricated Example (The crux).
          4.  Distinguishing the Layers (Internal vs. Institutional).
          5.  Addressing Objections (The dialectic).
          6.  Synthesis (Demarcation as a cluster concept).

  4.  **Evaluate the Fabricated Example:**
      *   *Proposal:* A fabricated primary-source excerpt applying correct carbon-dating terminology to a purported Atlantean artefact.
      *   *Risk:* If it looks methodologically sound internally but is about Atlantis, does it prove internal rigour is possible in pseudohistory? Or does it just look like "sciency dressing" (修辞)?
      *   *Requirement:* To illuminate the distinction, the excerpt must be *internally coherent* (using C-14 terms correctly) but *institutionally isolated* (no chain of custody, no replication data, published only in a monograph).
      *   *Refinement:* It needs to be *methodologically plausible but contextually unmoored*. If it's just jargon, it's "pseudoscientific style." If it presents a coherent calculation based on data no one else can access, it highlights the institutional barrier.
      *   *Decision:* It's a high-risk, high-reward tool. It risks conflating "looking scientific" with "being scientific." To work, the text must explicitly *refuse* external verification in its own footnotes (e.g., "Data available upon request to the Author only").

  5.  **Sequence Student Objections:**
      *   *Objection 1: "All history is interpretation."* (Epistemic relativism). This usually comes early when defining history vs. pseudohistory. Address this *before* the deep dive into Fomenko, to establish that while interpretation exists, constraints exist.
      *   *Objection 2: "Fomenko was marginalised for political reasons."* (Sociological defence). This arises when discussing institutional exclusion. Address this *during* the institutional demarcation section. Acknowledge validity (Kuhn/Lakatos) but distinguish *unjust* exclusion from *refusal to engage*.
      *   *Objection 3: "Peer review is merely gatekeeping."* (Cynicism). This comes at the end when synthesizing. Address this by reframing peer review not as authority but as error-correction mechanism.

  6.  **Identify the Key Misconception:**
      *   *Misconception:* Demarcation is a binary switch based on one condition (e.g., falsifiability).
      *   *Intervention:* Introduce the "Layered Assessment" model *after* the objections, showing how the different failures stack up.

  7.  **Design the Check-for-Understanding Question:**
      *   Needs to test the *distinction*, not the *fact*.
      *   Scenario: A historian makes a methodological error but submits to peer review vs. A historian makes no methodological errors but refuses peer review. Which is pseudohistory? (Actually, better: Compare two cases).
      *   *Draft:* "Imagine Researcher A publishes a flawed statistical analysis in a peer-reviewed journal and corrects it in the next issue. Researcher B publishes a statistically perfect analysis in a self-published book and sues critics for libel. Using the layered model, how do we demarcate their status?"

  8.  **Drafting the Plan (incorporating British English):**
      *   *Tone:* Academic, pedagogical, precise.
      *   *Structure:* Introduction, Arc, Example Analysis, Objection Handling, Misconception, Assessment, Confidence Rating.

  9.  **Refining the Confidence/Certainty Section:**
      *   I need to be honest about the fabricated example. It is the trickiest part. If the text looks too good, students think "Maybe Atlantis is real?" If it looks too bad, it's just "bad method." It needs to walk the line of "Methodologically sound form, Institutionally void substance."
      *   *Least Certain Point:* Whether the excerpt successfully separates *competence* from *community*. There is a risk students view the use of C-14 terminology on an impossible object as inherently "internal failure" (category error) rather than "institutional failure" (lack of verification). I need to flag this specific ambiguity.

  10. **Final Review against Constraints:**
      *   90 mins? (Implicit in the pacing).
      *   British English? (Check spelling: programme, centre, analyse, etc.).
      *   Confidence statement included? Yes.
      *   Specific uncertainty highlighted? Yes.

  11. **Final Polish:** Ensure the flow is logical. The prerequisite idea is "Knowledge as a Communal Enterprise." Without this, institutional demarcation looks like conspiracy/elite control rather than quality control.

  *(Self-Correction during drafting)*: I initially thought about putting the "All history is interpretation" objection later. But if they believe that, they won't accept *any* demarcation. It must be tackled early to clear the ground. The "Gatekeeping" objection is the strongest challenge to the institutional argument, so it should come last as the "boss battle" of the seminar.

  *(Refining the Example)*: The prompt asks about a fabricated excerpt applying correct C-14 terminology. I need to be very specific about *why* this might fail. If the artefact is impossible (Atlantis), is using C-14 on it an internal error (category mistake) or just an institutional one? I will argue it's an internal error *only if* the context is impossible. If the context is merely *unverified*, it's institutional. The example must hinge on *accessibility of data*, not the impossibility of the object. I will advise the user to ensure the excerpt claims the data exists but is private.

