answer: |-
  This is a classic piece of folk historiography. It sounds profound, but like many proverbs, it collapses under philosophical scrutiny because it conflates *causal power*, *archival survival*, and *narrative hegemony*. As a philosopher of history, I treat this sentence not as a fact, but as a hypothesis about the relationship between power and truth.

  Here is the brainstorming phase, followed by the sorting, the application to your brother-in-law's claims, and the verdict on your hunch.

  ### Phase 1: Brainstorming the Readings
  Let's generate every plausible interpretation of "History is written by the victors," ranging from the banal to the metaphysical.

  1.  **The Literal Claim:** The physical act of writing history is performed exclusively by the winning side.
  2.  **The Archival Claim:** Winners destroy the losers' records (burn books, kill scribes), so only the winners' documents survive.
  3.  **The Institutional Claim:** Winners control the institutions (schools, museums, governments) that fund and disseminate history.
  4.  **The Linguistic Claim:** Winners define the vocabulary (e.g., "terrorist" vs. "freedom fighter," "rebellion" vs. "war"), constraining how events can be described.
  5.  **The Psychological Claim:** Losers are too traumatized, dispersed, or oppressed to organize a coherent counter-narrative.
  6.  **The Selection Claim:** Even if losers write, archivists and historians (working within the victor's system) select only the victor-friendly documents for preservation.
  7.  **The Epistemic Claim:** We are never justified in believing the historical record because we cannot verify it against the loser's perspective.
  8.  **The Metaphysical Claim:** There is no "fact of the matter" independent of the narrative; truth is constituted by power (Nietzschean/Foucaultian).
  9.  **The Hegemonic Claim:** "Victors" doesn't mean military winners, but whoever holds cultural power *at the time of writing* (which might be the losers, later).
  10. **The Normative Claim:** Winners *ought* to decide the history because they bear the responsibility of the new order.

  ### Phase 2: Sorting the Readings (The Menu)
  Now, we categorize these by philosophical type and assign a verdict.

  | Reading | Type | Verdict | Philosophical Commentary |
  | :--- | :--- | :--- | :--- |
  | **1. Literal** | Empirical | **False** | Losers write memoirs, diaries, and oral histories constantly (e.g., Confederate diaries, Indigenous oral traditions). |
  | **2. Archival** | Causal | **True but Weak** | Winners *often* destroy records, but rarely all of them. Archaeology and cross-referencing mitigate this. |
  | **3. Institutional** | Causal | **Substantive** | This is the strongest causal claim. State power funds monuments and textbooks. |
  | **4. Linguistic** | Semantic | **Substantive** | Power dictates the *concepts* available for history (e.g., "Discovery" vs. "Invasion"). |
  | **5. Psychological** | Sociological | **False** | Oppressed groups often produce the most rigorous history (e.g., Black historiography during Jim Crow). |
  | **6. Selection** | Archival | **Substantive** | Michel-Rolph Trouillot's *Silencing the Past*. The archive is an active institution, not a passive bucket. |
  | **7. Epistemic** | Skeptical | **False** | "Biased" does not mean "Unknowable." Historians use hermeneutics to read *against* the grain of sources. |
  | **8. Metaphysical** | Relativist | **False** | Denies the reality of events (e.g., bodies died) independent of description. Self-defeating. |
  | **9. Hegemonic** | Redefinition | **Trivial** | If "victor" = "whoever controls the narrative," the slogan becomes a tautology: "History is written by those who write history." |
  | **10. Normative** | Ethical | **Debatable** | Might-makes-right. Philosophically defensibile only under specific stabilizing theories, but morally repugnant to most. |

  ### Phase 3: Analyzing Your Brother-in-Law's Claims

  #### Claim (1): The Spanish Conquest (Epistemic Skepticism)
  *His Argument:* The Spanish burned the codices; therefore, we cannot trust anything we know about the 1500s.
  *The Reading He Needs:* **Reading 7 (Epistemic Claim)** supported by **Reading 2 (Archival Claim)**. He is arguing that archival destruction leads to total unknowability.
  *Does he get it?* **No.**
  *Why:* This smuggles in an impossible standard of historical knowledge. Historians never have "complete" data. We work with fragments, bias, and silence. We know about Aztec culture through archaeology, indigenous codices that *were* hidden (e.g., Codex Mendoza), and by reading Spanish chronicles *against the grain* (noting where they reveal their own anxieties or inadvertently describe indigenous practices).
  *The Philosophical Error:* He is confusing **filtered evidence** with **no evidence**. Knowing the filter is biased allows us to correct for it. That *is* historical work. To say we can know *nothing* is to demand a "God's eye view" that history never provides, even without conquerors.

  #### Claim (2): Civil War Memorials (Determinism)
  *His Argument:* The North won; therefore, their version belongs on the memorial.
  *The Reading He Needs:* **Reading 3 (Institutional Claim)** or **Reading 10 (Normative Claim)**. He assumes military victory translates immediately to narrative control.
  *Does he get it?* **No.**
  *Why:* As you noted, the **Lost Cause** mythology breaks this. The Confederacy lost militarily (1865) but won narratively (1890s–1960s). They controlled the local archives, the women's memorial associations, and the timing of the monuments.
  *The Philosophical Error:* He is using a **military definition of "victor"** when the slogan requires a **hegemonic definition (Reading 9)**. If he switches to the hegemonic definition to save the slogan, he admits the South *was* the "victor" in the cultural sphere for a century, which undermines his point that the North's version *should* dominate because they won the war.

  ### Phase 4: Veto vs. Author (Your Hunch)
  You distinguished between:
  *   **Veto:** Victors decide which records get destroyed/never made.
  *   **Author:** Victors write the story people repeat.

  **Is your hunch right?**
  *   *"Neither supports the full-blown skepticism in (1)."* -> **You are absolutely right.** Even if the victor has a Veto (destroys some books), they rarely have total Veto (destroys *all* books + archaeology + oral tradition). Historiography is the science of reconstructing events from partial data. Total skepticism is a philosophical dead end.
  *   *"Only one of those supports (2)."* -> **You are mostly right, but be careful.** "Author" supports (2) better than "Veto." Monuments are about authorship/narrative. However, the Lost Cause proves that "Author" status does not automatically go to the military victor. It goes to whoever holds *political will* later.
  *   *Smuggling Check:* You aren't smuggling anything in, but you are giving the slogan too much credit. The "Veto" power is real (archival silence is a major issue in colonial history, per Ann Laura Stoler), but it creates a *distortion*, not a *void*.

  ### Phase 5: The Dinner Strategy
  When you sit down, don't attack the slogan. Refine it.
  1.  **Concede the Archive:** "You're right that the Spanish burned books. That creates silence."
  2.  **Pivot to Method:** "But historians aren't clerks who just read what's given. We are detectives. We use the Spanish letters to figure out what they were hiding. Bias is data."
  3.  **The Knockout (Lost Cause):** "If history is written by victors, why did the Lost Cause dominate for 100 years? The South lost. It turns out history is written by whoever has the money to build the statue *later*, not who won the battle *earlier*."
  4.  **The Conclusion:** "So the slogan isn't a reason to stop arguing. It's a reason to argue *harder* about who gets to build the monument now."

  \answer{(1) Archival Skepticism: False; (2) Military Determinism: False}
