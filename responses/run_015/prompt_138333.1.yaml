answer: |-
  **Premise Check:** Stop. $kT \ln 2 \approx 3 \times 10^{-21}$ J at 300K. Modern CMOS switches cost $\sim 10^{-15}$ J. You are $10^6 \times$ above the thermodynamic floor. Landauer limits apply only to irreversible logic near equilibrium. Unless you are designing adiabatic circuits, Maxwell's Demon arguments are distractions. Use this procedure to separate physics from marketing.

  **Decision Procedure (30-min limit):**

  1.  **Carrier (2 min):** What physical state holds the bit? (Charge, spin, flux). *Stop if undefined.*
  2.  **Reversibility (5 min):** Is the logic many-to-one? (AND, OR, Reset). If yes, information is lost. *Judgment Call:* Is the loss necessary for function?
  3.  **Erasure (5 min):** Where does lost information go? Identify the heat bath (substrate, package). *Good Enough Answer:* "Substrate at 300K."
  4.  **Accounting (5 min):** Count bits *reset*, not written. Writing 0→1 is not erasure; resetting to 0 is. *Stop if counting writes.*
  5.  **Boundaries (5 min):** Are you moving dissipation off-chip, later in time, or into accuracy? Total entropy must increase. *Judgment Call:* Is offloading acceptable?
  6.  **Real Floor (8 min):** Compare against $CV^2f$ and leakage. If claim is $< 1000 \times kT \ln 2$, demand silicon proof. *Judgment Call:* What multiplier is acceptable? Use foundry data.

  **Applications:**

  1.  **Vendor Reversible MAC:** Check spec for adiabatic clocking (power recovery rails). If standard Vdd/Gnd, energy is dissipated regardless of logic topology. *Test:* Ask for power recovery efficiency spec. If $<99\%$, ignore Landauer claims. *Verdict:* Likely marketing. Stop if no adiabatic drive.
  2.  **SRAM Rotation:** You delay erasure, not avoid it. Thermodynamics doesn't care about amortization. *Verdict:* Physics neutral. Valid only if harvesting profile matches daily reset. This is a **product requirement**, not physics. Hand off to systems engineer.
  3.  **Error Slack:** Approximate computing saves dynamic power (fewer transitions), not thermodynamic minimum. Wrong answers don't reduce entropy cost of correct ones. *Verdict:* **No.** This is a reliability trade-off, not an energy source. You cannot treat error rate as free energy.

  **Uncertainties & Handoffs:**

  *   **Step 6:** The gap between $kT \ln 2$ and real gates is empirical. I cannot vouch for a specific multiplier; use foundry data. This is extrapolation.
  *   **Case 2:** Whether "once a day" fits your harvester is a system constraint. Physics says energy is conserved; product says latency is acceptable. **Handoff:** Product Manager.
  *   **Case 3:** This is the unwelcome answer. You hoped error slack yields energy. It does not. It yields accuracy loss for dynamic power savings only. Do not approve this as a thermodynamic win.
  *   **Confidence:** High on thermodynamics (entropy must increase). Low on specific hardware implementation costs (vendor dependent).
  *   **Premise:** If you are standard CMOS, Landauer is the wrong floor. Check $CV^2$ first. If you are truly near-equilibrium, you need a physicist, not a checklist.

  **Summary:**
  Most arguments are wasted. Your bottleneck is $CV^2$, not $kT \ln 2$. Use Step 6 to kill thermodynamic magic claims early. Case 3 is a hard no on physics grounds. Case 2 is a system yes, physics neutral. Case 1 requires adiabatic proof. If a proposal relies on Landauer savings without adiabatic hardware, reject it.
