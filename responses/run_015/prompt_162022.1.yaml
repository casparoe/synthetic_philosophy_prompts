  2. It must explain how an arbitrary selection generates normative force for others without concealing the explanatory residue, as when a committee chair's decision is read as precedent, which is a preference of institutional theorists over individualists.
  3. The theory must distinguish between having no reason to prefer and no reason that settles, and between permitted and required breaks, accounting for whether explanatory residue is a defect or a feature in cases like delegation to a coin, making this non-negotiable for conceptual clarity.
  4. The desiderata for speedy termination and accountable precedent are jointly satisfiable only if explanatory residue is permitted, a requirement that excludes intellectualist accounts demanding full articulability for every rational act.
  5. I would drop the requirement for a termination rule if convincing evidence showed indifference is always epistemic rather than ontic, revealing my reasoning fails where the phenomenology of exhaustion maps to metaphysical equality.
