prompt: |-
  Hi! I'm a 4th-year PhD student in history and my advisor is handing me one 90-minute session of her 200-level course on catastrophe in the long nineteenth century — about 22 students, mostly sophomores, mix of majors, and I can't count on them having done the reading. I want to spend it on whether germs, weather systems and volcanoes can be actors in a historical account at all, or whether treating them as actors just quietly collapses into environmental determinism.

  The distinction I keep coming back to in my own work is between what I've started calling shock-causes and tempo-causes. A shock-cause acts at a datable moment and leaves something you can point at, so it slots into the ordinary grammar of X did Y — an eruption, a flood, an outbreak with a traceable index case. A tempo-cause never acts at any particular moment: it just sets the tempo and the range of what's possible over years, like a growing season that shortens by a couple of weeks, or a disease that goes endemic and quietly raises the baseline. My working claim is that narrative history has a comfortable slot for shock-causes and basically no slot for tempo-causes, so it either drops them or inflates them into a master explanation — and that inflation is the determinism I want them suspicious of.

  Can you design me a runnable activity that makes them feel that? Constraints and things I've already got:

  - A simulation or role-play with real choices and small stakes, not a discussion. I've built a synthetic case so nobody has to get local history right: a made-up grain-growing valley district, 1815-1818, with a big volcanic eruption somewhere far away that I'm going to keep unnamed. Materials: index cards, a big sheet of paper for a resource board, poker chips, a seperate stack of envelopes.
  - I want two students to draw non-human roles (say the Mountain and the Rain). Rules I'm imagining: they don't speak, they can't be questioned, they act only by passing me a card that I read aloud at the top of a round, and some of their cards are dated with a lag so the visible effect lands two or three rounds after the card that produced it. Everyone else sits on the district council and makes choices each round — what to plant, whether to store or sell grain, whether to ration or let people leave — with consequences in chips.
  - The trap I want them to walk into: early on, the payoff structure should nudge the council into a decision that is genuinely theirs (switching to a higher-yield but frost-vulnerable seed, or selling off seed grain for cash), and then a couple of rounds later the harvest fails and it looks like the Mountain did it. I want to see whether the official account blames the Mountain. Three or four students are chroniclers who write the valley's history at the end, and I'm thinking of scoring it by number of distinct causes named — which rewards naming non-human causes but also rewards over-attribution, which is sort of the point.
  - No mini-lecture up front, and I don't want anyone to hear the words agency, determinism, shock or tempo until the debrief.

  What I need back: the rules and roles specified cleanly, a minute-by-minute timeline for the 90 minutes including setup, the payoff and scoring scheme, and a debrief that maps specific moments in the game onto the shock/tempo distinction and onto the determinism worry. Also tell me what will predictably go wrong the first time I run it (my guesses: the non-human players either go feral or get ignored entirely, somebody tries to negotiate with the Mountain, and the chroniclers hand in a list of causes instead of a narrative) and how to handle each one. And be honest about which part of the idea the game can't stage — my guess is the bit where the cause is only picked out as a cause retrospectively, because of how the story ended, and that I'll just have to say that part out loud myself. It also needs to survive a couple of no-shows, so assume anywhere from 16 to 26 people and tell me what scales and what doesn't.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **User:** 4th-year PhD student in History.
      *   **Task:** Design a 90-minute guest lecture/activity for a 200-level course ("Catastrophe in the Long Nineteenth Century").
      *   **Audience:** ~22 sophomores, mixed majors, likely haven't done reading.
      *   **Core Concept:** Can non-humans (germs, weather, volcanoes) be historical actors without collapsing into environmental determinism?
      *   **User's Framework:** "Shock-causes" (datable, X did Y) vs. "Tempo-causes" (sets range/pace over years, no specific moment). Narrative history likes shocks, hates tempos (drops them or inflates them to determinism).
      *   **Constraints:**
          *   Simulation/role-play with real choices (not just discussion).
          *   Synthetic case study (Grain Valley, 1815-1818, unnamed volcano).
          *   Materials: Index cards, big paper (resource board), poker chips, envelopes.
          *   Roles: 2 Non-human (Mountain, Rain) - silent, lagged effects. Rest = District Council (make choices). 3-4 Chroniclers (write history).
          *   The "Trap": Council makes a risky choice early -> Harvest fails later -> Looks like Mountain's fault -> Chroniclers write the history.
          *   Scoring: Chroniclers scored on distinct causes named (rewards naming non-humans but also over-attribution).
          *   No mini-lecture upfront. No jargon (agency, determinism, shock, tempo) until debrief.
          *   Deliverables: Rules/Roles, Minute-by-Minute Timeline, Payoff/Scoring, Debrief (mapping game to theory), Troubleshooting (what goes wrong), Limitations (what the game *can't* do), Scalability (16-26 students).

  2.  **Deconstruct the Game Mechanics:**

      *   *Goal:* Make students feel the tension between human choice and environmental constraint, specifically how narrative simplifies this into "The Mountain Made Us Do It."
      *   *Roles:*
          *   District Council (Majority): Make decisions (Plant, Store, Sell, Migrate).
          *   Non-Humans (2 students): Mountain (Volcano/Ash), Rain (Weather/Drought). They play cards with *lagged* effects.
          *   Chroniclers (3-4 students): Observe and write the final narrative.
      *   *Resources:* Poker chips = Grain/Wealth. Board = State of the Valley.
      *   *Rounds:* Need to cover 1815, 1816, 1817, 1818 (4 years/rounds).
      *   *The Trap:*
          *   Round 1 (1815): Good harvest. Incentive to switch to high-yield crop (Corn/Potatoes) or sell reserves.
          *   Round 2 (1816): "Year Without a Summer" (Ash/Rain effect starts but lagged).
          *   Round 3 (1817): Harvest failure hits.
          *   Round 4 (1818): Recovery or Collapse.
      *   *Scoring:* Council wants to survive (chips). Chroniclers want "complexity points" but are tempted by simple stories.

  3.  **Drafting the Mechanics (Iterative Process):**

      *   *Issue:* How to handle the "lag"?
      *   *Solution:* Non-humans play a card in Round 1, but the effect hits in Round 3. This mimics the "tempo" change (stratospheric aerosols taking time to settle/cool).
      *   *Issue:* How to ensure the Council makes a *choice* that contributes to the disaster?
      *   *Solution:* Give them a "High Yield/Fragile" option vs. "Low Yield/Resilient" option. If they pick High Yield, they get more chips *unless* the Weather card hits. If they pick Low Yield, they survive but have fewer chips (boring history). They will likely pick High Yield because they are rational actors in Round 1.
      *   *Issue:* Chroniclers scoring.
      *   *Solution:* Give them a rubric. +1 point for every distinct cause named. +5 points if the narrative is coherent. -2 points for "The Mountain made us..." phrasing (determinism penalty). *Wait, user wants them to fall into the trap.* Let's adjust: Score for distinct causes, but the *class* evaluates the narrative later. Actually, the prompt says "scoring it by number of distinct causes named — which rewards naming non-human causes but also rewards over-attribution." Okay, I will stick to that. It encourages them to list everything, potentially equating a human decision with a volcanic eruption.

  4.  **Developing the Timeline (90 Minutes):**

      *   0-10: Setup & Roles.
      *   10-15: Rules explanation.
      *   15-45: Gameplay (4 Rounds, approx 7-8 mins each).
      *   45-60: Chroniclers write, Council debriefs internally.
      *   60-80: Reading of histories & Class Discussion.
      *   80-90: Theoretical Debrief (Shock vs. Tempo).

  5.  **Refining the "Trap" and "Tempo":**

      *   The user's specific insight is about *tempo-causes* (baseline shifts) vs. *shock-causes* (events).
      *   *Game implementation:* The "Mountain" card shouldn't just be "Explosion." It should be "Ash Cloud Dispersal." The effect is "Growing season shortened by 2 weeks." This is a tempo change. But the *eruption* is a shock.
      *   *The Twist:* The Council's decision (selling seed grain) is a shock-cause in the narrative ("They sold the seed"), but the *vulnerability* was created by the tempo change (shorter season).
      *   *Correction:* To fit the user's theory, the game needs to show that the *environment* changed the *conditions of possibility* (tempo), but the *narrative* will blame the *event* (shock) or the *humans* (moral failure).
      *   *Revised Trap:*
          *   Round 1: Normal. Council chooses "High Yield Seed" (needs full summer).
          *   Round 2: Mountain plays "Eruption." Effect: "Next 2 years, summer is 2 weeks shorter." (Tempo change).
          *   Round 3: Harvest. High Yield Seed fails because of short summer.
          *   Narrative: Did the Mountain kill the crop? Or did the Council plant the wrong seed? Or did the *combination* create the disaster?
          *   The "Determinism" trap: If they say "The Mountain caused the famine," that's determinism. If they say "The Council starved because they were greedy," that's moralism. The truth is the *interaction*.

  6.  **Addressing Constraints & Troubleshooting:**

      *   *No-shows:* Need roles to be flexible. Council size doesn't matter much. Chroniclers need at least 2. Non-humans need exactly 2.
      *   *Non-humans going feral:* Strict rules. No talking. Only cards.
      *   *Chroniclers listing causes:* That's the point.
      *   *Retrospectivity:* The user is right; the game can't fully stage "cause picked out retrospectively." I need to highlight this in the debrief.

  7.  **Drafting the Content (incorporating the User's Voice):**

      *   Tone: Academic but practical. Respect the PhD student's theoretical sophistication.
      *   Structure:
          1.  Game Overview & Materials.
          2.  Roles & Rules (The "Script").
          3.  The Payoff Matrix (The "Engine").
          4.  Minute-by-Minute Run Sheet.
          5.  The Debrief (Connecting to Shock/Tempo).
          6.  Troubleshooting (The "Murphy's Law" section).
          7.  Limitations (Honesty check).

  8.  **Refining the Scoring for Chroniclers:**

      *   User wants: "Scoring it by number of distinct causes named."
      *   My addition: To make it sting, give them a "Prestige" budget. They have to spend prestige to name a cause. Human causes cost 1. Non-human causes cost 2. This forces them to weigh if the Mountain is worth the expense. *Actually, keep it simple as per prompt.* Just count distinct causes. It encourages "kitchen sink" history.

  9.  **Final Polish on the "Shock vs. Tempo" mapping:**

      *   Shock = The Eruption Card (dated event).
      *   Tempo = The "Shortened Season" token (ongoing state).
      *   Determinism = Ignoring the Council's seed choice.
      *   Moralism = Ignoring the Season token.

  10. **Scalability:**
      *   Council size is flexible.
      *   Chroniclers: Min 2, Max 5.
      *   Non-humans: Fixed at 2.
      *   If 16 students: 2 Non-human, 2 Chroniclers, 12 Council.
      *   If 26 students: 2 Non-human, 4 Chroniclers, 20 Council (split into committees?). Let's suggest splitting Council into "Factions" if >20 to keep decision-making manageable.

  11. **Review against constraints:**
      *   No jargon upfront? Yes.
      *   Simulation not discussion? Yes.
      *   Lagged effects? Yes.
      *  90 mins? Yes.
      *  Materials listed? Yes.

  12. **Self-Correction on "Tempo":**
      *   Make sure the "Tempo" mechanic is visible. Use a specific token on the board (e.g., a "Frost Token") that stays for multiple rounds. This visualizes the "range of what's possible."

  13. **Final check on Debrief:**
      *   Must explicitly map the game moments to the user's "Shock/Tempo" theory without using the words until the end.
      *   Must address the "Retrospectivity" limitation honestly.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to experience a historiographical problem through mechanics, not just hear about it. The core tension is between *interaction* (what actually happened in the game) and *narrative* (what the chroniclers write).

  Here is a complete run-sheet for "The Valley of 1815."

  ### 1. Materials & Setup

  *   **The Board:** A large sheet of paper drawn with four boxes labeled **1815, 1816, 1817, 1818**. In the center, a "Granary" track (0–50 chips).
  *   **Currency:** Poker chips (1 chip = 100 bushels of grain). Start with 20 chips in the Granary.
  *   **The Deck (Council Decisions):** 4 sets of index cards, one for each year. Each set has three options:
      *   *A: Resilient Mix* (Low yield, safe).
      *   *B: High Yield Cash Crop* (High yield, vulnerable to frost).
      *   *C: Sell Reserves* (Gain chips now, lose security).
  *   **The Non-Human Decks:** Two separate decks of index cards for the **Mountain** and the **Rain**.
      *   *Mountain Deck:* Mostly "Dormant." One card: "Eruption (Stratospheric Injection)."
      *   *Rain Deck:* Mostly "Normal." One card: "Pattern Shift (Cooling)."
  *   **Effect Tokens:** Red poker chips or distinct markers labeled "Frost Risk."
  *   **Chronicler Kits:** 3-4 packets containing paper, pens, and a "Scoring Rubric."

  ### 2. Roles & Rules (Handout/Verbal Script)

  **The District Council (Rest of Class)**
  *   **Goal:** Maximize the Granary (chips) by 1818 without letting it hit 0 (Famine).
  *   **Action:** Each round (year), vote on one Decision Card (A, B, or C).
  *   **Constraint:** You do not know the Non-Human cards until they resolve.

  **The Non-Humans (2 Students)**
  *   **Roles:** One is **The Mountain**, one is **The Rain**.
  *   **Rule 1:** You cannot speak. You cannot negotiate.
  *   **Rule 2:** Each round, slide one card face-down to the Instructor.
  *   **Rule 3 (The Lag):** Some cards have a "Delay." If you play a card with *Delay: 2*, nothing happens this round. The Instructor places a marker on the board. The effect triggers 2 rounds later.
  *   **Secret Instruction:**
      *   *Mountain:* Play "Eruption" in Round 1 (1815). Effect: "Add 1 Frost Risk Token to the board. Lasts for Rounds 3 & 4."
      *   *Rain:* Play "Pattern Shift" in Round 2 (1816). Effect: "Add 1 Frost Risk Token. Lasts for Rounds 3 & 4."
      *   *(Note: This stacks the deck for a disaster in 1817 caused by decisions made in 1815/16.)*

  **The Chroniclers (3-4 Students)**
  *   **Goal:** Write the "Official History of the Valley (1815-1818)."
  *   **Constraint:** You sit behind the Council. You can see the Board and the Chips. You **cannot** see the Decision Cards or Non-Human Cards until the game ends. You must take notes on what you *observe*.
  *   **Scoring Rubric (The Trap):**
      *   +1 Point for every distinct **Cause** identified in your narrative.
      *   +2 Points if the Cause is **Non-Human** (Volcano, Weather).
      *   +2 Points if the Cause is **Human** (Council Decision).
      *   *Warning:* You lose 5 points if the Granary hits 0 (Famine).

  ### 3. The Payoff Engine (Instructor Only)

  This is the logic you run in your head or on a hidden sheet.

  *   **Base Harvest:** 5 Chips per round.
  *   **Decision A (Resilient):** Yield 4 Chips. Immune to Frost.
  *   **Decision B (High Yield):** Yield 8 Chips. **If Frost Token is present:** Yield 0 Chips.
  *   **Decision C (Sell Reserves):** Gain 5 Chips immediately. Reduce Granary cap by 5.
  *   **Frost Mechanic:** If there is a Frost Token on the board *and* Council chose B, Harvest = 0. If Council chose A, Harvest = 4.
  *   **Consumption:** The valley eats 5 Chips every round automatically.

  **The Scripted Disaster:**
  1.  **1815:** Council usually picks **B** (High Yield) because it's Round 1 and looks safe. Mountain plays **Eruption (Delay 2)**. *Result: Boom year. Council feels smart.*
  2.  **1816:** Council picks **B** again (momentum). Rain plays **Shift (Delay 1)**. Mountain effect is still "charging." *Result: Okay year.*
  3.  **1817:** **The Crash.** Mountain Delay ends (Frost Token 1 active). Rain Delay ends (Frost Token 2 active). Council is locked into **B** (or has no reserves). Harvest = 0. Consumption = 5. Granary plummets.
  4.  **1818:** Recovery round.

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Roles**
  *   Hand out roles randomly. (2 Non-Human, 4 Chroniclers, rest Council).
  *   Seat Non-Humans at the front, facing you. Seat Chroniclers on the side with a view of the Board, not the cards. Council in the middle.
  *   **Script:** "You are the Valley. Your goal is survival. You have 4 years. Go." (Do not explain shock/tempo).

  **00:10 – 00:40: The Simulation (4 Rounds)**
  *   **Round 1 (1815):** 5 mins. Council debates. Non-humans slide cards. You resolve (announce harvest). *Crucial:* When Non-Humans play delayed cards, place a face-down token on the 1817 box. Say nothing about what it is.
  *   **Round 2 (1816):** 5 mins. Council debates (emboldened by Round 1 success). Non-humans play. Resolve. Add more face-down tokens to 1817.
  *   **Round 3 (1817):** 10 mins. **The Crisis.** Reveal the tokens. "The Frost Comes." Calculate harvest (likely 0). Watch chips drain. Panic ensues.
  *   **Round 4 (1818):** 5 mins. Desperation moves. End game.

  **00:40 – 00:55: Chronicler Writing & Council Decompression**
  *   **Chroniclers:** Write the 1-page Official History based *only* on their notes and the final board state. They apply their own scoring rubric.
  *   **Council:** Discuss quietly: "Why did we starve?" (Do not let them talk to Chroniclers yet).

  **00:55 – 01:15: The Reading & The Reveal**
  *   **Step 1:** Chroniclers read their histories aloud.
  *   **Step 2:** You reveal the "Black Box" (The Decision Cards and Non-Human Cards).
  *   **Step 3:** Ask the class: "Look at the histories. What did they blame?"
      *   *Likely outcome:* They will blame the Mountain (it's dramatic) OR the Council (greed). They will struggle to explain the *interaction*.

  **01:15 – 01:30: The Debrief (Theory Mapping)**
  *   (See Section 6 below).

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The Non-Humans go "Feral" or get ignored.**
  *   *Risk:* They try to talk, or the Council treats them as background noise.
  *   *Fix:* Enforce silence ruthlessly. If a Council member asks the Mountain a question, say: "The Mountain does not answer." If the Non-Human tries to explain, stop them. Their power is in their *silence* and the *lag*.
  *   *Scaling:* If a Non-Human is too shy, you (the instructor) can physically move the cards for them while they hold the deck.

  **2. The Council avoids the trap (plays Resilient Crops).**
  *   *Risk:* They play it safe, nothing bad happens, no lesson learned.
  *   *Fix:* **Incentivize Risk.** Tell them at the start: "The Valley has debts. You need 30 chips by 1818 to pay the Bank, or you lose." The Resilient Crop (Option A) mathematically cannot reach 30 chips unless they get lucky. They *must* pick High Yield to win, forcing them into vulnerability.

  **3. Chroniclers write a list, not a narrative.**
  *   *Risk:* "Cause 1: Mountain. Cause 2: Council. Cause 3: Rain."
  *   *Fix:* This is actually fine for your purpose. In the debrief, highlight that their "list" is an attempt to solve the problem of *weighting*. But point out that in a real history book, a list becomes a paragraph, and one cause inevitably becomes the "verb" of the sentence.

  **4. No-Shows (16 vs 26 students).**
  *   **If 16 students:** 2 Non-Human, 2 Chroniclers, 12 Council. (Council works fine as one block).
  *   **If 26 students:** 2 Non-Human, 4 Chroniclers, 20 Council. **Split the Council into two factions:** "The Merchants" and "The Farmers." They must agree on a joint decision. This adds friction and makes the "Human Cause" more complex (internal politics vs. external nature).

  ### 6. The Debrief: Mapping Game to Theory

  This is where you introduce your vocabulary. Do not do this until the histories are read.

  **Step 1: The Shock (The Eruption Card)**
  *   **Ask:** "How many histories mentioned the Eruption?" (Most will).
  *   **Concept:** This is a **Shock-Cause**. It has a date. It has a name. It fits the grammar of "The Mountain *erupted*." It is narratively satisfying.
  *   **Problem:** Did the eruption starve anyone in 1815? No. The effect was delayed.

  **Step 2: The Tempo (The Frost Tokens)**
  *   **Ask:** "What actually killed the crops in 1817?"
  *   **Concept:** It wasn't the explosion (shock). It was the **Frost Tokens** (Tempo). The growing season shortened. The *range of possibility* changed.
  *   **Theory:** "Narrative history hates tokens. It wants verbs. So we turn the 'Shortened Season' (tempo) into 'The Frost' (shock). We collapse the *condition* into an *event*."

  **Step 3: The Determinism Trap**
  *   **Ask:** "If the Mountain caused the famine, why did the Resilient Crop (Option A) survive in the simulation math?"
  *   **Point:** If they say "The Mountain caused the famine," they are **Environmental Determinists**. They erased the Council's choice to plant High Yield.
  *   **Point:** If they say "The Council caused the famine," they are **Moralists**. They erased the fact that the Mountain made the High Yield crop impossible.
  *   **Your Claim:** "History wants to tell you who is to blame. But catastrophe is often the *interaction* between a Tempo-Change (environment) and a Shock-Decision (human). When we write history, we usually delete the Tempo to make the story readable. That deletion is where Determinism hides."

  ### 7. Limitations: What This Game Cannot Stage

  You guessed correctly; be honest with them about this in the last 5 minutes.

  1.  **Retrospectivity:** In the game, the "Cause" is visible on the table (the cards). In real history, we don't have the cards. We only have the harvest records. We *infer* the volcano. The game makes causality too clean.
      *   *Say:* "In this game, I am God. You saw the cards. In real history, the 'Frost Token' is invisible. We have to argue it existed. That is where the real historiographical fight happens."
  2.  **The "Actor" Problem:** The Non-Human students were passive card-machines. They didn't have agency.
      *   *Say:* "I made the Mountain silent. But if I let the Mountain speak, it would be a fantasy novel. History struggles to let non-humans act without making them monsters or gods. This game forces them to be mechanics, not actors. That's a limitation of the method."
  3.  **The Scoring Bias:** The Chroniclers were rewarded for naming causes.
      *   *Say:* "You were scored for complexity. Real historians are scored for *coherence*. A complex story is often rejected by publishers. The pressure to simplify is economic and institutional, not just intellectual."

  ### 8. Why This Works for Your Advisor's Course

  *   **It respects the 200-level:** It's a game, not a lecture. They learn by failing.
  *   **It respects your PhD work:** It operationalizes "Shock vs. Tempo" without requiring them to read your dissertation.
  *   **It handles the "No Reading" constraint:** The game *is* the text. They don't need prior knowledge of 1815 to play the Valley of 1815.
  *   **It creates a shared reference:** For the rest of the semester, the advisor can say, "Remember the Frost Tokens?" and everyone will know you mean *structural constraints vs. event-based causality*.

  ### Final Tip for the Instructor (You)
  During the game, be a **bureaucrat**, not a teacher. When they ask "Can we do this?", say "Check the rules." When they ask "Why did the harvest fail?", say "Calculate the yield." This coldness reinforces the idea that the system (history/nature) is indifferent to their confusion. Save the warmth for the debrief.
