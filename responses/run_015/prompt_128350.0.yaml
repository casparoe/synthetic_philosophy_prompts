  ## 3. Minute-by-Minute Timeline

  *   **00–05: Setup.** Divide class into two groups (9 students each). Hand out Ledgers. Do not explain the goal. Hand out Rule Sheets face down.
  *   **05–20: The Coding Phase (Constraint 3).** Students read Rule Sheets. Both sheets require them to *first* agree on which incidents count. They will argue over the bolded notes. Instructor circulates, answering only "You must decide as a group."
  *   **20–40: The Calculation Phase (Constraint 1 & 2).** Groups calculate their rankings based on their agreed count and their specific Directive. They prepare a Whiteboard statement: "Most Violent Period: __" to "Least Violent Period: __".
  *   **40–55: The Reveal.** Groups write rankings on opposite sides of the whiteboard. Silence. Let them notice the inversion. Group A (Absolute) will rank VI as highest. Group B (Rate) will rank I as highest.
  *   **55–80: The Debrief.** Instructor facilitates. Names the concepts. Maps the experience to the learning goals.

  ## 4. Rule Sheets (Handouts)

  ### Directive Alpha (Group A)
  **Task:** Assess the **Total Burden of Violence** placed upon the Ostral Basin society in each Period.
  **Instructions:**
  1.  **Define:** Review the Ledger. As a group, decide which incidents constitute a "violent death" for your count. You may include or exclude incidents based on the "Notes" column, but you must apply the same standard across all six Periods. Write your definition down.
  2.  **Count:** Sum the total number of violent deaths for each Period based on your definition.
  3.  **Rank:** Order the Periods from I to VI.
      *   Rank 1 = The period with the *greatest total burden* of violence on the region.
      *   Rank 6 = The period with the *least total burden* of violence on the region.
  4.  **Report:** Write your final ranking on the whiteboard.

  *Forbidden Terms:* Do not use the words: *rate, per capita, proportion, average, risk, chance.*

  ### Directive Beta (Group B)
  **Task:** Assess the **Danger to an Individual** living in the Ostral Basin in each Period.
  **Instructions:**
  1.  **Define:** Review the Ledger. As a group, decide which incidents constitute a "violent death" for your count. You may include or exclude incidents based on the "Notes" column, but you must apply the same standard across all six Periods. Write your definition down.
  2.  **Count:** Sum the total number of violent deaths for each Period based on your definition.
  3.  **Rank:** Order the Periods from I to VI.
      *   Rank 1 = The period where it was *most dangerous to be a person* living there.
      *   Rank 6 = The period where it was *least dangerous to be a person* living there.
  4.  **Report:** Write your final ranking on the whiteboard.

  *Forbidden Terms:* Do not use the words: *total, absolute, sum, aggregate, volume, burden.*

  ## 5. The Debrief Script (Mapping to Goals)

  **Phase 1: The Clash (Aggregation)**
  *   *Action:* Point to the whiteboard. "Group A says Period VI is the worst. Group B says Period I is the worst. You have the same ledger. Who is lying?"
  *   *Concept:* **Aggregation Reversal.**
  *   *Naming:* Introduce "Absolute Counts" (Alpha) vs. "Rates/Per Capita" (Beta).
  *   *Philosophical Point:* The trend reversed not because the world changed, but because the *unit of analysis* changed (The State vs. The Person).

  **Phase 2: The Coding (Boundaries)**
  *   *Action:* Ask Group A: "Did you count the executions? The famine deaths? What about Group B?"
  *   *Concept:* **Substantive Boundary Decisions.**
  *   *Naming:* "Inclusion Criteria" or "Operationalization."
  *   *Philosophical Point:* Counting is not clerical; it is normative. Deciding if a "death in custody" counts as violence is a political/moral choice, not a mathematical one. If you exclude state killings, the state looks less violent.

  **Phase 3: The Uncertainty (Ontology)**
  *   *Action:* Ask: "So, *was* Period I more violent than Period VI?"
  *   *Concept:* **Indeterminacy.**
  *   *Naming:* "Measurement Validity" and "Ontological Relativity."
  *   *Philosophical Point:* Distinguish carefully:
      1.  *Epistemic Uncertainty:* "We cannot find out" (e.g., the reporting bias in Period I vs. VI).
      2.  *Ontological Indeterminacy:* "There is no fact of the matter" prior to measurement. The question "Which period was more violent?" is incomplete. It must be "More violent *for whom*?" or "More violent *by what measure*?"
      3.  *Interest-Relativity:* The concept of violence is relative to the interest of the observer (The Ruler cares about total order [Alpha]; The Citizen cares about safety [Beta]).

  **Phase 4: The Artefact (Reporting Quality)**
  *   *Action:* Point to the "Source" column. "Look at Period I vs. Period VI."
  *   *Concept:* **Archival Silence.**
  *   *Philosophical Point:* The rising curve of violence might just be the rising curve of *bureaucracy*. We are measuring the archive as much as the violence.

  ## 6. Troubleshooting: What Will Go Wrong

  **Failure 1: Students ignore the "Notes" and just count IDs.**
  *   *Symptom:* Groups finish in 10 minutes. Rankings are identical mathematically (just Absolute vs. Rate).
  *   *Fix:* During the Coding Phase (min 5-20), interrupt and ask: "Have you agreed on what happens if the state kills someone? Check ID 04 and 20." Force the debate.

  **Failure 2: Group B tries to calculate percentages explicitly.**
  *   *Symptom:* They use the forbidden words or get stuck on math.
  *   *Fix:* Remind them: "You don't need a calculator. You need a ranking. Compare the 'crowdedness' of death." If they must, allow them to use population data, but enforce the ban on the word "rate".

  **Failure 3: The Reporting Bias is missed.**
  *   *Symptom:* In debrief, they treat the data as perfect truth.
  *   *Fix:* In Phase 4, explicitly highlight the "Lord's Chronicle" vs. "Civil Registry" headers. Ask: "Why does Period I have fewer incidents? Is it safer, or just quieter?"

  **Failure 4: One dominant student dictates the coding.**
  *   *Symptom:* No internal disagreement.
  *   *Fix:* Assign roles silently on the Rule Sheet: "One person must play Devil's Advocate on every boundary case." (Add this to the printed sheet if you suspect passivity).

  ## 7. Limitations & Instructor Responsibilities

  **What this activity cannot do:**
  1.  **It cannot settle the ontology.** The activity shows that *reasonable coders disagree* and that *measures diverge*. It does not prove that violence *is* relative. A realist student will argue, "No, Period I *was* more dangerous, you just measured it wrong." You must supply the philosophical argument in the debrief that "danger" is a relational property (like "heavy"—heavy for an ant? heavy for an elephant?), not an intrinsic one.
  2.  **It simplifies the math.** Real violence measurement involves weighting (is a war death equal to a domestic death?). This activity treats all deaths as '1'. You must acknowledge this simplification in the debrief.
  3.  **It cannot resolve the Reporting Bias.** The activity shows the bias exists. It cannot tell them how to correct for it. You must explain that historians use "multipliers" or "shadow estimates" to fix this, but those are themselves guesses.

  **Your Burden in the Debrief:**
  You must explicitly distinguish between:
  *   **"We cannot know"** (Epistemic: The records for Period I are lost).
  *   **"It depends on the definition"** (Semantic: Does execution count?).
  *   **"It depends on the perspective"** (Ontological/Interest-Relative: State stability vs. Individual safety).

  If you conflate these, students will leave thinking "everything is subjective." The goal is for them to leave thinking "measurement is a constructive act that determines the reality we see."
