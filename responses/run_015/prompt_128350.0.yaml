answer: |-
  ### Brainstorming & Design Decisions

  **Candidate Mechanic 1: The "Auditor" Swap.**
  *Concept:* Group A counts Periods 1–3, Group B counts 4–6, then they swap and audit.
  *Discard:* This isolates the data. Students won't feel the tension of the *same* data yielding *different* truths. The conflict needs to be simultaneous and based on interpretation, not data access.

  **Candidate Mechanic 2: The "Third Group" (Coder Disagreement).**
  *Concept:* As suggested in Constraint 3, a dedicated group just argues over definitions while A and B calculate.
  *Discard:* In an 80-minute session with 18 students, splitting into three groups of six dilutes the main confrontation. I want the *calculators* to be the ones arguing about definitions. I will embed the coding conflict *into* the instructions for Groups A and B. They cannot calculate until they agree on what counts. This forces the ontological question (what is violence?) to precede the mathematical one (how do we measure it?).

  **Candidate Mechanic 3: Reporting Bias as a "Hidden" Variable.**
  *Concept:* Provide a separate memo on archival quality.
  *Decision:* Too explicit. I will embed the bias in the *Source* column of the ledger itself (e.g., "King's Chronicle" vs. "Civil Registry"). Students must notice the texture of the data to understand the uncertainty. This preserves the "discovery" feel.

  **Final Design Choice:** Two groups (A & B), identical data, divergent instructions. Coding ambiguity is a hurdle they must clear *before* ranking. Reporting bias is a visual cue in the data.

  ***

  # Activity: The Ostral Basin Chronicles

  ## 1. Materials List
  *   **The Ledger:** 18 copies (one per student) of the *Chronicle of Violent Deaths, Ostral Basin* (6 pages, stapled).
  *   **Rule Sheets:** 9 copies of *Directive Alpha* (Group A), 9 copies of *Directive Beta* (Group B).
  *   **Whiteboard:** Divided into two sections ("Directive Alpha Rankings", "Directive Beta Rankings").
  *   **Markers:** Red and Black.
  *   **Scrap Paper:** For group calculations.

  ## 2. The Fictional Chronicle (Instructor Master)

  **Region:** The Ostral Basin (A fictional river valley).
  **Time:** Six Periods (approx. 20 years each).
