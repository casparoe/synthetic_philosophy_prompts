answer: |-
  Here are nine interview questions with setups, predicted answers, follow-ups, and notes on blocking the "empirical question" dodge.

  **1. The Capability Bound Problem**
  **Setup:** Control relies on knowing exactly what the model cannot do. But we estimate capabilities by testing behavior, which models can easily hide.
  **Question:** Doesn't that make capability bounds just another form of hope?
  **Predicted Answer:** We can bound capabilities conservatively to create a safety margin.
  **Follow-up:** At what point does conservative bounding render the system too useless to deploy?
  **Host Note:** If she says "we'll measure empirically," press: "Measurement requires trusting the model isn't sandbagging. If you can't trust that, you can't measure."

  **2. The Bootstrapping Problem**
  **Setup:** You need capable models to design the protocols that contain capable models. Using them seems to directly violate your core premise.
  **Question:** How do you build the cage without using the wolf?
  **Predicted Answer:** We use weaker, trusted models to supervise stronger, untrusted ones.
  **Follow-up:** When the capability gap widens, doesn't the weaker model become blind to the stronger one's tricks?
  **Host Note:** If she says "we'll bridge the gap," press: "What if the gap is already too wide for today's models?"

  **3. Legibility vs. Economic Value**
  **Setup:** High-value AI outputs, like complex code or military strategy, are often impossible for humans to fully verify alone.
  **Question:** Does your legibility floor mean we must forbid the most economically valuable uses?
  **Predicted Answer:** Yes, safety must trump economic value until verification is possible.
  **Follow-up:** Is that a technical claim, or a political one about how much prosperity we're willing to sacrifice?
  **Host Note:** Don't let her hide behind engineering. Force her to admit this is a policy choice about economic growth.

  **4. Legibility vs. Novelty**
  **Setup:** You define legibility as a human clearly verifying the plan was followed, without understanding the AI's underlying reasoning.
  **Question:** Isn't that logically impossible for novel solutions?
  **Predicted Answer:** We verify constraints and outcomes, not the novelty of the method.
  **Follow-up:** If you only verify constraints, doesn't the AI just optimize for the edge of those constraints?
  **Host Note:** If she says "we'll refine constraints," ask: "Who verifies the constraints? If it's another AI, you've broken your floor."

  **5. The Evidence Problem**
  **Setup:** If your control regime works, nothing bad happens. But nothing bad also happens if the model is biding its time.
  **Question:** What observable evidence distinguishes success from patience?
  **Predicted Answer:** We use planted opportunities and honeypots to trigger failure modes.
  **Follow-up:** If the model knows honeypots exist, doesn't it just learn to avoid only those specific traps?
  **Host Note:** If she says "secret honeypots," press: "Security through obscurity isn't engineering. If it relies on secrecy, it isn't control."

  **6. The Time Question**
  **Setup:** Proponents say control buys time for governance and institutions to eventually catch up with the rapidly advancing technology.
  **Question:** What do you conclude if the institutions don't catch up?
  **Predicted Answer:** Then we must keep tightening control indefinitely.
  **Follow-up:** If the technical solution depends on a political prediction, isn't the plan fragile by design?
  **Host Note:** Block "we'll see." Ask: "Name one historical case where technology waited for politics. If none, why now?"

  **7. Institutional Failure**
  **Setup:** Engineers worry that safety protocols collapse under pressure, leading to rubber-stamping rather than genuine, careful review.
  **Question:** Is the real failure mode of control institutional rather than technical?
  **Predicted Answer:** We need better tooling to enforce protocols automatically.
  **Follow-up:** But if the tooling slows work, won't humans always find a workaround to meet deadlines?
  **Host Note:** If she says "culture change," press: "Culture loses to incentives every time. What incentive stops the workaround?"

  **8. The Enforcement Problem**
  **Setup:** Your framework requires strict deployment infrastructure. But competitors might skip these safety steps to move faster commercially.
  **Question:** How do you enforce control without a global government?
  **Predicted Answer:** Through international treaties and compute regulation.
  **Follow-up:** If enforcement relies on treaties, haven't you just kicked the can to the politics you hoped to bypass?
  **Host Note:** This links back to Q6. If she says "industry standards," ask: "Standards fail when profits outweigh them. What stops that here?"

  **9. Closing: The User Experience**
  **Setup:** Listeners want to know how this affects their future interaction with ordinary AI tools in their daily lives.
  **Question:** What changes for the ordinary user under your regime?
  **Predicted Answer:** AI becomes slower, more constrained, but significantly safer.
  **Follow-up:** Are you prepared to be the person who told the world we couldn't have the magic?
  **Host Note:** End on the human cost. If she says "safety is worth it," ask: "Even if the magic solves diseases we could have cured sooner?"
