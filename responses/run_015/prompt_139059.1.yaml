answer: |-
  There is a genuine standing condition on moral blame, but its structural impact varies between rendering blame defective and rendering it void depending on whether the blamer's fault is merely parallel or causally implicated.

  To understand why this distinction matters, we must look closely at the departmental rota cases you have provided. The central question is not whether the shirking occurred—it did—but whether the person calling it out has the normative authority to do so. In the case of the Confessing Hypocrite, the blamer admits to the same violation. Traditional accounts might suggest this destroys her standing entirely, yet her confession alters the expressive content of her blame. She is not claiming superiority. However, confession does not fully repair the defect because standing is not merely about present attitude but about a history of compliance that grants moral credit. She lacks the credit to demand reform, even if she avoids the insult of hypocrisy. The Unindicted Beneficiary is in a worse position. She has not shirked, but she benefits from a structure she refuses to change. Her standing is undermined by complicity; she blames the symptom while protecting the cause. The Selective Enforcer similarly lacks standing because her blame is weaponised by bias, transforming a moral demand into a tool of factionalism.

  The Inducer case, however, stands apart. Here, the head of section caused the violation. This is not merely parallel fault; it is causal implication. If I tell you to jump and then blame you for landing loudly, my blame is not just defective; it is void. I have forfeited the right to hold you accountable for an action I mandated. Finally, the Proxy case demonstrates that standing can be institutional rather than personal. The spokesperson may have shirked, but she speaks for the union members who voted for the statement. Her personal record is irrelevant because the authority derives from the collective, not the individual. These cases suggest that a single structural label cannot capture the nuance of standing failures.

  This leads to the structural question: is standing a gate that voids blame, a gate that makes it defective, a scalar weight, or an independent wrong? I argue that the choice varies by case. In the Inducer case, the blame is effectively void because the normative link between agent and action has been severed by the inducer's interference. It is not that the blame is inappropriate; it is that it fails to latch onto the target's agency in the required way. In the Hypocrite and Beneficiary cases, the blame is defective but not void. The target still owes it to the moral community to stop shirking, but they do not owe it to the blamer to acknowledge the blame specifically. The blamer incurs an independent wrong by blaming without standing, but the blame itself retains some normative force regarding the act, just not the relationship. This variegated account is superior to a unified theory because it respects the intuition that causing a violation is fundamentally different from merely committing one alongside the target.

  You asked specifically about the expressive view of hypocrisy, which holds that the defect lies in the blamer implicitly presenting herself as compliant. If this were the whole story, the Confessing Hypocrite's admission should repair the standing completely. It does not. While confession removes the insult of superiority, it does not restore the moral authority required to demand compliance from others. Standing is not just about what is conveyed in the moment; it is about the blamer's track record establishing them as a legitimate enforcer of the norm. A confessed hypocrite is honest, but she is not authoritative. Therefore, the defect is not purely conversational; it is normative. This explains why the confession helps—it mitigates the resentment—but does not solve the problem of standing entirely.

  The symmetry test further illuminates the nature of this defect. If standing is about the authority to make demands, it should not apply to praise, because praise does not demand a response. We do not require a praiser to have clean hands to congratulate someone on a virtue. Similarly, demanding an apology requires standing, because it is a demand, whereas offering forgiveness does not. If my account collapsed here—if I claimed you needed standing to praise—it would suggest I was confusing moral authority with mere opinion. My account survives because it ties standing specifically to the coercive or demanding nature of blame. Blame seeks to impose a cost or require a concession; praise offers a gift. You need a licence to impose costs; you do not need a licence to give gifts. This asymmetry confirms that standing is rooted in the normative power to hold others accountable, not in the general validity of moral judgements.

  Regarding the state of the literature, it is important to be plain about what is settled and what is not. It is broadly settled among specialists that *tu quoque* arguments are not logical fallacies in the ethical realm; pointing out a blamer's hypocrisy is a relevant challenge to their authority, not a distraction from the truth of the claim. It is also settled that there is some distinction between the content of the blame and the propriety of the blamer. However, it is genuinely contested whether standing failures make blame void or merely inappropriate. Some argue that blame without standing is no blame at all, while others maintain it is simply rude. It is also contested whether standing is a moral condition or a conversational one. My verdict that the structure varies by case is a substantial minority position. Most theorists seek a unified account, either void or defective. I contend that the search for unity obscures the difference between causal implication and parallel fault.

  The familiar dismissal of standing complaints as mere *tu quoque* fallacies is too quick. In logic, the truth of a proposition is independent of the speaker. In ethics, the act of blaming is a social practice involving authority. If a thief tells you not to steal, the command 'do not steal' is valid, but the thief lacks the standing to enforce it socially. Dismissing this as a fallacy ignores the relational nature of moral accountability. We are not just assessing propositions; we are assessing relationships. However, I must acknowledge the weakest point in my own view. The single consideration that would make me abandon the 'varies by case' verdict is if it could be shown that the Inducer case is also merely defective rather than void. If the target of the inducer is still fully accountable despite the coercion, then my distinction collapses. I doubt this is true, but if evidence showed that agents remain fully liable even when manipulated into wrongdoing by an authority figure, I would have to concede that standing is always merely a defect gate, never a void gate.

  In conclusion, standing is a genuine condition on blame, but it is not monolithic. It functions as a void gate when the blamer causes the violation, and as a defect gate when the blamer is merely complicit or hypocritical. This accounts for the intuitive differences between your cases while preserving the normative force of the underlying moral norms. The blamer loses the authority to demand a response, but the target does not necessarily lose the obligation to reform. This distinction preserves the objectivity of morality while respecting the relational requirements of holding one another accountable.

