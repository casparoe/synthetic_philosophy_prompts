prompt: |-
  As a journalist who covers emerging science, I need a reusable editorial procedure for deciding whether a researcher's claim is assertible in a published story, grounded in the philosophy of assertion — specifically the debate over whether assertion requires knowledge, mere true belief, justified belief, or some intermediate norm such as reasonable belief. The deliverable should be an ordered checklist that an editor can run in minutes: the questions to ask in sequence, what counts as a sufficient answer at each stage, where the procedure stops with a clear rejection, and where it must defer to human judgment because the competing norms themselves diverge. The procedure must distinguish empirical claims, interpretive claims, and predictive claims; it must handle expert disagreement within a field and technically true assertions that mislead through framing; and it must state explicit stopping rules. Then apply the procedure to three cases: a climate scientist offering a specific regional temperature projection for 2050; a psychologist asserting a causal mechanism for a behavioral effect on the basis of a single pre-registered study; and a historian arguing that a recently discovered archival document requires revising a standard narrative. Be sure to include one case in which the procedure produces an answer a science editor would likely resist, and clearly flag every point at which judgment cannot be eliminated.
reasoning: |-
  Here's a thinking process that leads to the suggested editorial procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Journalist covering emerging science.
      *   **Task:** Create a reusable editorial procedure (checklist) for deciding if a researcher's claim is *assertible* in a published story.
      *   **Philosophical Grounding:** Philosophy of assertion (Knowledge Norm vs. Truth Norm vs. Justification Norm vs. Reasonable Belief Norm).
      *   **Format:** Ordered checklist (questions in sequence, sufficient answers, rejection points, deferral points).
      *   **Requirements:**
          *   Distinguish empirical, interpretive, and predictive claims.
          *   Handle expert disagreement.
          *   Handle technically true but misleading framing.
          *   State explicit stopping rules.
          *   Apply to three specific cases (Climate projection, Psychology causal mechanism, Historical revision).
          *   Include one case where the procedure yields a result an editor would resist.
          *   Flag points where human judgment is irreducible.

  2.  **Philosophical Framework Selection:**

      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$. (Too strict for emerging science; science is rarely "known" in the philosophical sense).
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true. (Impossible to verify beforehand).
      *   *Justified Belief Norm (JBN):* Assert $p$ only if you have justified belief that $p$. (Better, fits peer review).
      *   *Reasonable Belief Norm (RBN):* Assert $p$ only if it is reasonable to believe $p$ given the evidence and context. (Best for journalism, allows for uncertainty and emerging fields).
      *   *Decision:* The procedure should aim for *Reasonable Belief* as the operational standard, but acknowledge where *Knowledge* is expected (established facts) vs. where *Justification* suffices (frontier science).

  3.  **Drafting the Checklist (The "Assertion Audit"):**

      *   *Goal:* Fast, ordered, decisive.
      *   *Structure:*
          1.  Categorization (Empirical, Interpretive, Predictive).
          2.  Evidence Quality (Justification).
          3.  Consensus/Disagreement (Social Epistemology).
          4.  Framing/Implicature (Gricean Maxims/Truthfulness).
          5.  Final Normative Check (Knowledge vs. Reasonableness).
      *   *Stopping Rules:* Hard "No" at specific failure points. "Defer to Editor" at normative conflict points.

  4.  **Refining the Checklist Steps:**

      *   *Step 1: Claim Typology.* Crucial because norms differ. Prediction $\neq$ Observation.
      *   *Step 2: Source Justification.* Is the belief justified? (Peer review, data access, methodology).
      *   *Step 3: Community Status.* Is there dissent? (Handles expert disagreement).
      *   *Step 4: Framing Check.* Is it technically true but misleading? (Handles "lying with statistics").
      *   *Step 5: The Normative Threshold.* Here is where the philosophy kicks in. Is it *known*, *justified*, or merely *reasonable*?
      *   *Flags:* Need to explicitly mark where philosophy doesn't give a math-like answer.

  5.  **Developing the Three Cases:**

      *   *Case 1: Climate Scientist (Predictive).*
          *   Claim: Specific regional temp projection for 2050.
          *   Challenge: Predictions are rarely "knowledge." They are model-based.
          *   Procedure Outcome: Likely requires heavy qualification.
      *   *Case 2: Psychologist (Causal/Empirical).*
          *   Claim: Causal mechanism from *one* pre-registered study.
          *   Challenge: Replication crisis. One study is rarely "knowledge."
          *   Procedure Outcome: High risk of rejection or severe hedging.
      *   *Case 3: Historian (Interpretive).*
          *   Claim: New document revises narrative.
          *   Challenge: Interpretation vs. Fact.
          *   Procedure Outcome: Likely assertible as a new perspective, not absolute truth.
      *   *The "Resistant" Case:* I need one where the procedure says "Publish" but an editor might say "Kill" (or vice versa).
          *   *Idea:* The Psychologist case. If the study is pre-registered and high power, the *Justification* norm might say "Assertible," but an editor knowing the replication crisis might say "No." Or, the Climate case: The procedure might say "Don't assert as fact," but the news hook *is* the prediction.
          *   *Selection:* Let's make the Psychologist case the resistant one. If the procedure relies on *Justified Belief*, a single pre-registered study *might* pass the threshold of "reasonable to assert as a finding," but a savvy science editor knows single studies are fragile. I will tune the procedure to be strict enough that it flags this, but perhaps the *degree* of hedging is the friction point.
          *   *Better Idea for Resistance:* The Climate Case. Philosophy of prediction suggests we cannot *know* the future. So the Knowledge Norm says "Don't assert." But journalism *needs* to report projections. If the procedure strictly applies the Knowledge Norm, it kills the story. If it applies Reasonable Belief, it allows it. I will structure the procedure to allow "Reasonable Belief" for predictions, but flag that this conflicts with the intuitive "Knowledge" standard readers expect.
          *   *Actually, the prompt asks for a case where the procedure produces an answer an editor would likely resist.* Let's make the Historian case the resistant one. Historians often argue from incomplete evidence. A strict "Justification" norm might block a revisionist claim that is plausible but not yet consensus. Editors love revisionist history. A strict philosophical procedure might block it.
          *   *Wait, let's look at the Psychologist case again.* A single pre-registered study. Philosophically, this provides *Justification*. But scientifically, it's weak. If the procedure accepts "Justified Belief" as sufficient for assertion, it says "Publish." An editor would say "Wait for replication." This is a good friction point.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Set the philosophical stage (Williamson's Knowledge Norm vs. others). Define the goal (Reasonable Assertibility).
      *   **The Checklist:** Numbered, clear Yes/No/Defer paths.
      *   **The Cases:** Apply the checklist rigorously.
      *   **The Resistance:** Highlight the friction in Case 2.
      *   **Judgment Flags:** Use specific icons or bold text to indicate where philosophy ends and judgment begins.

  7.  **Review against Constraints:**

      *   *Ordered checklist?* Yes.
      *   *Minutes to run?* Yes, kept concise.
      *   *Distinguish claim types?* Yes, Step 1.
      *   *Handle disagreement?* Yes, Step 3.
      *   *Handle misleading framing?* Yes, Step 4.
      *   *Explicit stopping rules?* Yes (Terminate/Proceed/Defer).
      *   *Three specific cases?* Yes.
      *   *One resistant case?* Yes (Psychology).
      *   *Flag judgment points?* Yes.

  8.  **Refining the Philosophy:**

      *   Need to be careful not to get bogged down in academic jargon while remaining grounded. Use "Knowledge Norm" as the ideal but "Reasonable Belief" as the practical standard for *emerging* science.
      *   *Assertion Norm:* "Assert $p$ only if it is epistemically appropriate to believe $p$."
      *   *Stopping Rule:* If a claim fails the "Truth-Tracking" check (Step 2), it stops. If it fails the "Community" check (Step 3), it requires hedging.

  9.  **Final Polish:**

      *   Ensure the "Judgment Flags" are visible.
      *   Make sure the "Resistant Case" is clearly explained in the analysis.
      *   Check tone: Professional, editorial, philosophical but practical.

  *(Self-Correction during drafting)*: I initially thought about making the checklist very long. I need to ensure it can be run in *minutes*. I will consolidate the philosophical criteria into practical questions. For example, instead of "Is the belief justified?", ask "Does the methodology support the strength of the claim?"

  *(Refining the "Resistant Case")*: I will ensure the Psychology case triggers a "Proceed with Hedging" result from the procedure, but note that a cautious editor might reject it entirely. This highlights the tension between *Justification* (it's a valid study) and *Reliability* (it's one study).

  *(Refining the "Judgment Flags")*: I will insert **[JUDGMENT REQUIRED]** tags explicitly in the checklist and the case analyses.

  10. **Final Output Generation** (incorporating all above thoughts).
answer: |-
  # The Epistemic Assertibility Audit (EAA)
  **A Procedural Checklist for Science Editors**

  **Philosophical Grounding:** This procedure operationalizes the **Reasonable Belief Norm** of assertion. While the *Knowledge Norm* (assert only what you know) is the ideal for established fact, emerging science rarely meets the criteria for knowledge (infallible, justified true belief). Therefore, this audit tests whether a claim is *reasonably assertible* given the available justification, community consensus, and communicative context.

  **Time to Execute:** 3–5 Minutes
  **User:** Senior Editor or Desk Lead

  ---

  ## Part 1: The Checklist

  ### Step 1: Claim Typology & Strength Matching
  *Classify the claim. The epistemic bar rises from Interpretive to Empirical to Predictive.*

  1.  **What is the claim type?**
      *   **A. Interpretive:** Explaining meaning, causality, or historical narrative (e.g., "This document shows X caused Y").
      *   **B. Empirical:** Reporting observed data or established mechanisms (e.g., "Protein X binds to Y").
      *   **C. Predictive:** Forecasting future states based on models (e.g., "Temperature will rise by 2°C").
  2.  **Does the linguistic strength match the type?**
      *   *Requirement:* Interpretive claims must use hedging (suggests, indicates). Empirical claims may use stronger verbs (shows, demonstrates). Predictive claims must use probabilistic language (projects, likely).
      *   **[STOP / REJECT]** If a Predictive claim uses Empirical certainty ("Will happen" vs. "Models suggest").
      *   **[JUDGMENT REQUIRED]** If the claim is Empirical but based on observational data implying causality.

  ### Step 2: Justification Quality (The Truth-Tracking Check)
  *Does the researcher have sufficient grounds for belief?*

  3.  **Is the evidence public and verifiable?**
      *   *Requirement:* Data, code, or archival sources must be accessible or peer-reviewed.
      *   **[STOP / REJECT]** If evidence is proprietary, secret, or anecdotal.
  4.  **Does the methodology support the inference?**
      *   *Requirement:* Sample size, controls, or archival provenance must be adequate for the *specific* claim made.
      *   **[JUDGMENT REQUIRED]** Determining "adequacy" in emerging fields where standards are in flux.
      *   **[STOP / REJECT]** If the methodology is fundamentally flawed (e.g., p-hacking, contaminated archive).

  ### Step 3: Social Epistemology (The Consensus Check)
  *How does this belief sit within the relevant community?*

  5.  **Is there significant expert dissent?**
      *   *Requirement:* If >20% of relevant experts disagree, the claim cannot be asserted as settled fact.
      *   **[DEFER TO HEDGING]** If dissent exists, the story must contextualize the disagreement.
      *   **[JUDGMENT REQUIRED]** Defining "relevant experts" (e.g., only climatologists vs. including geologists).
  6.  **Is the researcher an outlier?**
      *   *Requirement:* If the researcher is the sole proponent, assertibility requires explicit labeling as a "minority view."
      *   **[STOP / REJECT]** If the claim contradicts established physical laws without extraordinary evidence (Carl Sagan Standard).

  ### Step 4: Framing & Implicature (The Gricean Check)
  *Is the claim technically true but misleading?*

  7.  **Does the framing imply more than the evidence supports?**
      *   *Requirement:* Check for "truthful misleading" (e.g., "Risk doubled" when base rate is 1 in 1,000,000).
      *   **[STOP / REJECT]** If the headline or lead paragraph creates a false implicature, even if the body text corrects it.
      *   **[JUDGMENT REQUIRED]** Determining whether a lay audience will correctly interpret statistical nuance.

  ### Step 5: The Normative Threshold (Final Assertibility)
  *Apply the philosophical norm.*

  8.  **Final Decision:**
      *   **Knowledge Norm:** Do we *know* this is true? (Rare for emerging science).
      *   **Reasonable Belief Norm:** Is it *reasonable* for the audience to believe this based on our reporting?
      *   **[PROCEED]** If Reasonable Belief is met AND framing is accurate.
      *   **[DEFER TO EDITOR]** If the claim meets Reasonable Belief but violates the publication's risk tolerance (e.g., high-reward/high-retraction risk).

  ---

  ## Part 2: Case Applications

  ### Case 1: The Climate Projection (Predictive Claim)
  **Claim:** A climate scientist asserts, "The Pacific Northwest will experience 4°C warming by 2050."
  **Context:** Based on a new high-resolution regional model.

  *   **Step 1 (Typology):** Predictive.
      *   *Check:* Language uses "will experience."
      *   *Result:* **[STOP / REJECT]** on current phrasing. Must change to "models project" or "likely to experience."
  *   **Step 2 (Justification):** Model is peer-reviewed; data accessible.
      *   *Result:* Pass.
  *   **Step 3 (Consensus):** Other models show a range of 2°C to 5°C.
      *   *Result:* **[DEFER TO HEDGING]**. Must report the range, not the single point estimate.
  *   **Step 4 (Framing):** Does not mislead on base rates.
      *   *Result:* Pass.
  *   **Step 5 (Threshold):** We cannot *know* the future (Knowledge Norm fails). Is it *reasonable* to believe the model? Yes.
      *   *Verdict:* **Assertible with Qualification.**
      *   *Editorial Action:* Rewrite lead to emphasize model uncertainty.
      *   *[JUDGMENT FLAG]:* Step 3 requires judging whether the 2°C–5°C range is "significant dissent" or standard model variance.

  ### Case 2: The Psychological Mechanism (Empirical/Causal Claim)
  **Claim:** A psychologist asserts, "Sleep deprivation causes moral decay via Mechanism X."
  **Context:** Based on a **single**, high-power, pre-registered study.

  *   **Step 1 (Typology):** Empirical/Causal.
      *   *Check:* Language uses "causes."
      *   *Result:* Pass (if methodology supports causality).
  *   **Step 2 (Justification):** Pre-registered, high power, p < 0.01.
      *   *Result:* Pass. The belief is *justified*.
  *   **Step 3 (Consensus):** No prior studies on Mechanism X. Field is prone to replication issues.
      *   *Result:* **[DEFER TO HEDGING]**. Must note this is the first observation of this mechanism.
  *   **Step 4 (Framing):** Technically true, but implies stability.
      *   *Result:* **[JUDGMENT REQUIRED]**. Will readers assume this is a settled fact?
  *   **Step 5 (Threshold):**
      *   *Procedure Output:* **Assertible.** The study meets the *Justified Belief Norm*. It is reasonable to assert the finding *of the study*.
      *   *Editorial Action:* Publish, but hedge heavily regarding generalizability.
      *   *[RESISTANCE FLAG]:* **A savvy science editor would likely resist this.** Despite the procedure clearing the claim (because pre-registration provides justification), the *reliability* norm of modern science (requiring replication for causal claims) conflicts with the *justification* norm of this audit. The procedure says "Publish"; the editor's intuition says "Wait for replication."
      *   *[JUDGMENT FLAG]:* Step 5 requires weighing the value of new information against the risk of spreading potential falsehoods (The Replication Crisis variable).

  ### Case 3: The Historical Revision (Interpretive Claim)
  **Claim:** A historian argues, "This newly found letter proves General X ordered the massacre, revising the standard narrative."
  **Context:** Single archival document, authenticated, but open to interpretation.

  *   **Step 1 (Typology):** Interpretive.
      *   *Check:* Language uses "proves."
      *   *Result:* **[STOP / REJECT]** on phrasing. Interpretive claims rarely "prove"; they "strongly suggest."
  *   **Step 2 (Justification):** Document authenticated by third parties.
      *   *Result:* Pass.
  *   **Step 3 (Consensus):** Other historians argue the letter could be ironic or forged (despite authentication).
      *   *Result:* **[DEFER TO HEDGING]**. Must present the counter-interpretation.
  *   **Step 4 (Framing):** Does "revising the standard narrative" imply the old narrative is now false?
      *   *Result:* **[JUDGMENT REQUIRED]**. This is a narrative frame, not a statistical one.
  *   **Step 5 (Threshold):**
      *   *Procedure Output:* **Assertible as Debate.**
      *   *Editorial Action:* Frame as "New Evidence Challenges Consensus" rather than "Consensus Overturned."
      *   *[JUDGMENT FLAG]:* Step 4 requires understanding historical hermeneutics. Is the counter-interpretation *reasonable* or *fringe*? The checklist cannot determine the quality of historical argumentation, only its existence.

  ---

  ## Part 3: Analysis of Divergence & Judgment

  ### The "Resistant" Outcome (Case 2)
  In Case 2 (Psychology), the EAA procedure clears the claim for assertion based on the **Justified Belief Norm**. The study is pre-registered and high-power; therefore, the researcher is epistemically justified in believing the result.
  *   **Why an Editor Resists:** Editors operate under a **Reliability Norm** (a pragmatic subset of the Knowledge Norm). They know that in psychology, single studies—even pre-registered ones—often fail to replicate. The procedure prioritizes *current justification*; the editor prioritizes *future stability*.
  *   **Resolution:** The procedure flags this at **Step 5 [JUDGMENT REQUIRED]**. The editor must override the "Assertible" verdict if the publication's policy prioritizes replication over novelty. This is where philosophy yields to policy.

  ### Irreducible Judgment Points
  The following points in the EAA cannot be algorithmic because they rely on normative philosophical commitments that diverge:

  1.  **Step 1 (Strength Matching):** Determining whether "suggests" is sufficient for a causal claim depends on the editor's tolerance for Type I errors vs. Type II errors (missing a real discovery).
  2.  **Step 3 (Consensus):** Defining the "relevant community" is political. (e.g., For a climate claim, do we count industry-funded scientists in the consensus?)
  3.  **Step 5 (The Normative Threshold):** This is the core philosophical divergence.
      *   If the editor holds the **Knowledge Norm**, Case 1 (Prediction) and Case 2 (Single Study) should be rejected.
      *   If the editor holds the **Reasonable Belief Norm**, they are assertible with hedging.
      *   *The Procedure defaults to Reasonable Belief* to allow emerging science to be reported, but explicitly flags where this conflicts with stricter standards.

  ### Stopping Rules Summary
  *   **HARD STOP:** Claim implies certainty where none exists (Step 1); Evidence is secret/anecdotal (Step 2); Claim violates physical laws without extraordinary proof (Step 3).
  *   **SOFT STOP (Hedging Required):** Expert dissent exists (Step 3); Framing implies more than data (Step 4).
  *   **DEFER TO EDITOR:** Conflict between Justification (study looks good) and Reliability (field is volatile) (Step 5).

  ---
  **End of Procedure**
