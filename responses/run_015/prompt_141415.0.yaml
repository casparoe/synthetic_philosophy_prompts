answer: |-
  You have not invented a category on the spot, but you have identified a configuration that sits in the blind spot between the philosophy of science and the history of technology. There is no single settled term that captures all four of your features with the precision you require, because the literature tends to split them: logicians handle the "untestable" aspect, sociologists handle the "communal" aspect, and historians handle the "instrumental" aspect. You are describing the intersection.

  Here is the carving you asked for.

  ### 1. The Established Concept (and where it falls short)
  The closest established philosophical concept is Michael Friedman's **"Relativized Constitutive A Priori."**
  *   **The Fit:** Friedman argues that every scientific framework relies on constitutive principles (like the constancy of light speed or, in your case, atomic weights) that make empirical judgment possible. They are *a priori* relative to the theory (you can't test them without them) but *relativized* (they can change historically).
  *   **The Miss:** Friedman treats these as mathematical or logical frameworks. He does not sufficiently account for your **Feature 3**: that the principle is embedded in the *plumbing*—the brass, the glass, the calibration weights, the graduate student's muscle memory. For Friedman, the shift is conceptual; for you, the shift is material.

  A second close neighbor is Hasok Chang's **"Operational Coherence."**
  *   **The Fit:** Chang (a philosopher of chemistry) argues that scientific principles are validated not by correspondence to reality but by the coherence of the operations they govern. The constancy of atomic weights is maintained because it allows weighings to cohere with volumetric analysis.
  *   **The Miss:** Chang focuses on the *success* of the operations. He is less explicit on the moment of *failure* you describe in **Feature 4**, where the operation succeeds so well it exposes the principle's falsity.

  ### 2. The Load-Bearing Feature
  Of your four features, **Feature 3 (Material Embedding)** is the load-bearing one.
  *   Features 1 and 2 (Untestable yet Substantive) describe many metaphysical claims (e.g., "the world is external").
  *   Feature 4 (Self-undermining discovery) describes many scientific revolutions.
  *   Feature 3 is what distinguishes your class from dogma or metaphysics. The principle is not held by belief, nor by explicit agreement, but by the **physical impossibility of operating the apparatus otherwise.** You cannot calibrate a balance without assuming additivity. You cannot run a mass spectrometer without assuming ion stability. The principle is *reified* in the device.

  If you remove Feature 3, you have a Kuhnian paradigm (held by community agreement). If you keep Feature 3, you have a **Materialized Presupposition.**

  ### 3. Refutation vs. Replacement
  You ask whether the historical replacement of such a principle is genuinely different from its having been refuted.
  **It is different.**
  *   **Refutation** implies a proposition $P$ is shown to be false by evidence $E$, where $E$ is independent of $P$.
  *   **Replacement** in your sense is a **bootstrap failure.** The practice, guided by $P$, improves its resolution until the noise floor drops below the threshold of the variation $P$ denies.
  *   *Example:* You do not refute the constancy of atomic weights by finding a counter-example using a scale that assumes constancy. You refine the scale (using the principle) until the scale itself begins to show systematic deviations that *cannot* be corrected by the principle. The principle does not become "false"; it becomes **insufficiently granular.**
  *   *Verdict:* It is not refutation; it is **obsolescence via precision.** The principle is not contradicted; it is outgrown.

  ### 4. Relation to the "Near Neighbors"
  Here is exactly where the fit fails for the concepts you mentioned:

  *   **Quine (Analytic/Synthetic):** You are correct to dismiss this. Quine's web of belief is logical. Your principles are **technological.** Quine asks, "What statements must we give up to save the system?" You are asking, "What assumptions are built into the meter?" Quine's revision is a choice of logic; yours is a forced march by the instrument.
  *   **Kuhn (Paradigm):** Kuhn's paradigms are held by **sociological fiat** (the community agrees to ignore anomalies). Your principles are held by **material constraint** (the instrument cannot record data without them). A Kuhnian shift requires a conversion of faith; your shift requires a new machine.
  *   **Lakatos (Hard Core):** Lakatos posits a "protective belt" where scientists *decide* not to test the core. You describe a situation where they *cannot* test the core with existing tools. Lakatos implies dogmatism; you describe **operational necessity.**
  *   **Wittgenstein (Hinge Propositions):** In *On Certainty*, Wittgenstein describes propositions that "stand fast" (e.g., "I have two hands"). These are linguistic/grammatical hinges. Your principles are **instrumental hinges.** "The reading belongs to the sample" is not a rule of language; it is a condition of the voltmeter. Wittgenstein's hinges are immune to doubt; yours are vulnerable to better engineering.

  ### 5. A Proposed Coinage
  Since the existing terms lack the material specificity you require, I suggest the term **"Instrumental A Priori."**

  *   **Definition:** A substantive assumption about the world that is physically encoded in the design, calibration, or data-reduction routine of a measurement apparatus, rendering it untestable by that apparatus, yet vulnerable to replacement by apparatus of higher resolution generated by the same practice.
  *   **Boundary Case (The Accuracy Limit):** You mentioned the case where improving accuracy violates the principle. This is the definitive case of the Instrumental A Priori.
      *   *Scenario:* A gravimetric assay assumes additivity. At 1% precision, additivity holds. At 0.0001% precision, surface adsorption effects make weights non-additive.
      *   *Analysis:* Did additivity fail? No. Did the instrument fail? No. The **Instrumental A Priori** reached its **domain of validity.** The principle was not "true" then "false"; it was **operationally stable** then **operationally noisy.**
      *   *Why this fits:* It confirms that the principle was never a law of nature, but a **tolerance condition** of the practice.

  ### 6. Summary for your Talk
  If I were to condense this for your twenty minutes:
  1.  **Distinguish:** There are logical truths, there are empirical claims, and there are **Instrumental A Priori.**
  2.  **Define:** These are truths you cannot test because they are the handle by which you hold the test tube.
  3.  **Differentiate:** Unlike Kuhn's paradigms, these are not beliefs; they are built into the machine. Unlike Quine's analytic truths, they are not definitions; they break when the machine gets too good.
  4.  **Conclude:** Science does not just discover facts; it discovers the limits of the assumptions required to find the facts. The "death" of such a principle is not a defeat, but a sign that the practice has become more sensitive than the presuppositions that birthed it.

  You are describing the **material history of epistemic constraints.** It is a robust category, even if it lacks a single canonical name. "Instrumental A Priori" or "Materialized Presupposition" will serve you well.
