          *   *Rule Prediction:* The monitor says they are equal. The User says they are not. The Robustness Rule relies on the *monitor's* numbers. If the monitor says "equal," and the scales are admissible, the Rule says "Equal." The User says "Not Equal."
          *   *Failure:* The Rule fails here. The User is importing a normative judgment *outside* the welfare metric (autonomy/authenticity).
      *   *Case 7 (Million small gains vs. Ten severe losses):* Threshold problem.
          *   *Analysis:* Aggregation problem.
          *   *Rule Prediction:* If the gain is *tiny*, no sum outweighs severe loss? The Robustness Rule looks at individual comparisons usually. If we sum the million, does the sum robustly exceed the loss? If the unit is unknown, maybe not. But the User's hesitation suggests a non-linear aggregation rule.
          *   *Failure:* The Rule doesn't inherently handle aggregation thresholds well without defining how sums interact with scale ambiguity.
      *   *Case 8 (Chimp vs. Headache / Chimp vs. Bereavement):* Chimp > Headache. Chimp ?? Bereavement.
          *   *Analysis:* Cross-species. Scale alignment is harder.
          *   *Rule Prediction:* Headache is small; Chimp suffering is large. Robustly Chimp > Headache. Bereavement is huge; Chimp suffering is huge. Scales might overlap. Incomparable. *Matches.*
      *   *Case 9 (Dementia Self vs. Past Self / vs. Stranger):* Comparable to Past Self, differently than Stranger.
          *   *Analysis:* Identity matters.
          *   *Rule Prediction:* The Rule treats all persons as distinct scales. It doesn't account for *identity* over time reducing the "admissible" variance.
          *   *Failure:* The Rule treats Case 9 (Self vs. Self) like Case 1 (Self vs. Sister), but the User treats them differently.
      *   *Case 10 (Dying Peace vs. Chronic Pain):* Oscillating verdict.
          *   *Analysis:* Qualitative incommensurability.
          *   *Rule Prediction:* Admissible mappings allow both verdicts. Incomparable. *Matches* (User says they go back and forth, effectively treating as unstable/incomparable).

  4.  **Diagnose the Failures:**
      *   **Case 6 (Adaptive Preferences):** The Robustness Rule relies on the *monitor*. The User overrides the monitor based on *how* the state was reached. This implies the User isn't just maximizing welfare (monitor readings); they are maximizing *autonomy* or *authenticity* alongside welfare. The Rule is purely welfarist; the User is not.
      *   **Case 1 vs. 2 (Identity):** The User trusts intrapersonal comparison (Case 2) more than interpersonal (Case 1), even with better evidence for Case 1. The Robustness Rule explains this via scale ambiguity (1 scale vs. 2 scales). This part holds up.
      *   **Case 9 (Identity over time):** The User treats Past-Self vs. Present-Self differently than Stranger vs. Present-Self. The Robustness Rule treats them the same (two scales). This suggests "Identity" acts as a constraint on admissible mappings.
      *   **Case 7 (Aggregation):** The Rule needs to specify if we sum welfare. If we sum, does the uncertainty compound?

  5.  **Repairing the Principle:**
      *   The User's proposed rule is essentially **Interval Scale Incommensurability** (or *Cardinal Unit Comparability* issues).
      *   To fix Case 6: We must acknowledge the User is not using the Monitor as the sole currency. They are using a "Modified Welfare" metric that penalizes adaptive preferences.
      *   To fix Case 9: We must acknowledge that "Identity" reduces the uncertainty of scale alignment. If it's the *same* person, the zero and unit are fixed (per the Monitor definition). If it's a stranger, they float.
      *   To fix "Admissible": Can we define it without smuggling? "Admissible" means "consistent with empirical facts about human biology and psychology." (e.g., A headache cannot be worse than death for a normal human). This avoids smuggling the *verdict* but sets bounds.
      *   **Is it a redescription?** Mostly. It says "I am confident when the scales force a result, and unsure when they don't." But it adds value by highlighting *why* (scale alignment).
      *   **Refined Principle:** *Compare outcomes across persons only when the ranking is invariant under all transformations of individual welfare scales that are consistent with shared biological and psychological constraints. Where identity persists (past vs. present self), scale transformation is null. Where welfare reports are influenced by adaptive preference, adjust the scale input prior to comparison.*

  6.  **Addressing the Specific Tensions:**
      *   **Case 6:** The User discounts the poor woman. Why? Because her "zero" has shifted due to oppression, not choice. The Monitor measures *felt* welfare. The User values *opportunity-enhanced* welfare. The Rule must incorporate a "correction factor" for adaptive preferences. If we don't, the verdict is wrong.
      *   **Case 1 vs 2:** Case 2 is intrapersonal. The Monitor guarantees the unit/zero are identical. Case 1 is interpersonal. The unit/zero are unknown. The Rule explains the confidence gap perfectly. The evidence (observation vs. memory) is secondary to the *structural* certainty of the scale.

  7.  **New Cases:**
      *   **Future Generations:** We don't know their "zero" or "unit" because their expectations will adapt to their world (Case 6 problem). Also, we don't know who they are (Identity problem).
          *   *Prediction:* Incomparable or heavily discounted. We cannot map their scale to ours robustly because their "normal" will be our "abnormal."
      *   **Non-biological System (Distress Signals):** No biology. No shared constraints.
          *   *Prediction:* Strictly Incomparable. There are no "admissible placements" because we have no basis to map a silicon "pain" to a human "pain." Any mapping is arbitrary.

  8.  **The Monitor's Role:**
      *   Does it change anything?
      *   It solves the *measurement* problem (noise, lying, memory).
      *   It does *not* solve the *calibration* problem (zeros and units).
      *   Therefore, it does not fix the core dilemma of interpersonal comparison. It makes Case 1 and 5 cleaner, but the structural uncertainty remains. It makes Case 6 *worse* because it highlights the conflict between "felt" and "authentic" welfare.

  9.  **Synthesizing the Argument:**
      *   Acknowledge the sophistication of the User's intuition.
      *   Validate the "Robustness Rule" as a form of *Level Comparability* vs *Unit Comparability*.
