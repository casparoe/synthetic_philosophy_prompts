prompt: |-
  I'm a staff engineer on the platform team at a mid-sized software company. I have no philosophy background — one freshman course I remember badly — and I've been volunteered to give a forty-five-minute internal brown-bag next month on "worst-case versus average-case guarantees in AI safety," a title someone else picked and that I'm free to change. The room will be roughly twenty-five people: mostly backend and infrastructure engineers, four or five ML people who actually train and evaluate models, three PMs, and one lawyer from the policy team who asked to sit in. Almost everyone will walk in with two things already in hand: the intuition that this is a temperament difference (careful people want worst-case bounds, pragmatic people ship on averages), and the reflex example of quicksort's quadratic worst case against randomized expected linearithmic behavior. I ran the talk past my partner, who's a statistician, and she compressed the whole thing into "it's just a question of your reference class" in about five minutes — correct, I think, but useless for this room, and I'd rather not build on the sorting example even as a thirty-second on-ramp, because in sorting a bad case costs you time and I need them to feel that here the bad cases can be rare, individually cheap-looking, and correlated with one another.

  So don't explain the distinction to me — plan how I should explain it. What I most need is the dependency structure: what has to be in place before "we have a worst-case guarantee" or "we have an average-case guarantee" is even a well-formed sentence. My own guess is that a guarantee is three-place rather than one-place — a bound on some named metric, over some named set, for some named system-in-a-context — and that people collapse three different axes into the phrase "worst case": worst or average over inputs including an adversary with a stated budget; over which model you happened to get out of training, given seed and run-to-run variance; and over the future deployment distribution. But I can't sequence it, and the two points I care most about are ones I keep failing to place: first, that an average-case claim quietly assumes failures are independent across components and across time, when the interesting failures are precisely the ones where a single input breaks three things at once, and that if we only ship systems that pass evaluation then the population we measured is a selected subset of the population we deploy, so the average we estimated isn't the average we get; second, that a worst-case claim is trivially satisfiable by a system that does nothing, so the real object of interest is never a bound on its own but a bound paired with a usefulness floor. Tell me where each of those has to land and what has to be said first for them not to sound like word games.

  Beyond the sequencing I need three more things. One: the single example that should carry the whole forty-five minutes, with an account of what it must have and what it must lack — my candidate is our internal code-migration agent, which has write access to a subset of repos, but I'll take something better if that's the wrong shape; my constraints are that the bad outcome has to be discrete and easy to picture, the tail has to be fat and correlated rather than a clean independent coin flip, and it must not smuggle in anything that reads as science fiction. Two: the misconceptions in the order this particular audience will form them, and the exact point in the sequence where each should be headed off — I'd guess they'll include "worst case means jailbreaks and average case means normal users," "with N components the risk just divides so averages are fine," "if we've bounded the worst case we've bounded the risk," and "the guarantee is a property of the model rather than of the model plus its scaffolding and permissions" — and I'd like a closing check that would show it landed, not just that people were interested; I was considering handing out a one-line invented spec of a guarantee and asking which axis it quantifies over and what single edit would render it vacuous, but tell me if that's a bad test. Three: what I should openly decline to cover at this level, and a sentence I can use to decline it that doesn't sound like evasion — my instinct is to rule out whether future systems will be agentic or on what timescale, interpretability internals, formal verification and probabilistic certificates, and expected-value reasoning under deep uncertainty, on the grounds that they're real but are a different talk, and I'd rather say that explicitly than have the lawyer or one of the ML people drag us into it for twenty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested talk plan:

  1.  **Analyze the User and Context:**
      *   **User:** Staff Engineer, Platform Team. No philosophy background. Practical, technical mindset.
      *   **Task:** 45-minute brown-bag talk on "Worst-Case vs. Average-Case Guarantees in AI Safety."
      *   **Audience:** 25 people. Mostly backend/infra engineers, some ML practitioners, 3 PMs, 1 Lawyer (Policy).
      *   **Current Intuitions:** Temperament difference (careful vs. pragmatic), Quicksort analogy (time cost vs. safety cost).
      *   **User's Insights:**
          *   Guarantees are three-place (metric, set, system-in-context).
          *   "Worst case" collapses three axes (adversarial inputs, model variance, deployment distribution).
          *   Key Point 1: Average-case assumes independence; interesting failures are correlated/cascading. Selection bias in evaluation (shipping only passing systems).
          *   Key Point 2: Worst-case is trivially satisfiable by doing nothing; needs a usefulness floor.
          *   Candidate Example: Internal code-migration agent (write access to subset of repos).
          *   Desired Output: Dependency structure (sequencing), Single Example refinement, Misconception management, Scope boundaries.

  2.  **Deconstruct the Core Problem:**
      *   The user wants to move the audience from "Quicksort/Time" thinking to "Safety/Correlated Failure" thinking.
      *   The user wants to avoid philosophy jargon but needs the logical rigor of it.
      *   The user needs to structure the talk so the two key insights (correlated failures/selection bias & usefulness floor) land naturally, not as tacked-on caveats.

  3.  **Develop the Dependency Structure (Sequencing):**
      *   *Goal:* Make "Guarantee" a well-formed sentence before evaluating it.
      *   *Step 1: The Object.* What are we bounding? (Not just the model weights). It's the *System* (Model + Scaffolding + Permissions + Context).
      *   *Step 2: The Space.* Over what set are we averaging/maximizing? (Inputs, Model Seeds, Deployment Environments). This addresses the "three axes" collapse.
      *   *Step 3: The Metric.* What are we measuring? (Latency? Error rate? Catastrophic damage?).
      *   *Step 4: The Trade-off.* Now introduce Worst-Case vs. Average-Case.
      *   *Step 5: The Trap (Key Point 2).* Worst-case without utility is trivial. Introduce the "Usefulness Floor."
      *   *Step 6: The Trap (Key Point 1).* Average-case assumes independence. Introduce "Correlated Tail Risk" and "Selection Bias."

  4.  **Refine the Example:**
      *   *Candidate:* Code-migration agent.
      *   *Pros:* Relevant to platform team, discrete outcome (breaks build/security), write access (stakes).
      *   *Cons:* Needs to ensure the "fat tail/correlated" aspect is clear. A single bad commit is bad, but a *correlated* set of bad commits across repos is the "worst case" that average case misses.
      *   *Decision:* Stick with the Code-Migration Agent. It's concrete.
      *   *Refinement:* Define the "Bad Event" carefully. Not just "syntax error" (easy to catch), but "subtle logic bug + security vulnerability introduced simultaneously."
      *   *Correlation:* The agent uses a specific pattern. If the pattern is flawed, it fails on *all* similar codebases, not randomly.
      *   *Selection Bias:* We test on repos that look like our training data. We deploy on legacy messes.

  5.  **Address Misconceptions & Timing:**
      *   *Misconception 1:* "Model vs. System." (Address early, Step 1).
      *   *Misconception 2:* "Worst Case = Jailbreak." (Address when defining the Space/Inputs).
      *   *Misconception 3:* "Risk Divides with N Components." (Address during Average-Case/Independence section).
      *   *Misconception 4:* "Bounding Worst Case = Safety." (Address during Usefulness Floor section).
      *   *Closing Check:* The user's idea (one-line spec) is good. Needs to be specific enough to test the axes.

  6.  **Define Scope Boundaries:**
      *   Need a polite but firm way to exclude AGI/Existential Risk, Interpretability, and Formal Verification.
      *   Phrase: "Engineering constraints vs. Research horizons."

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Title:* Needs to be less academic. "Bounding Risk: Why 'Average' Lies in AI Systems."
      *   *Intro:* Kill Quicksort immediately. Acknowledge it, then discard it. Time != Safety.
      *   *Section 1: The Grammar of a Guarantee.* (The 3-place predicate).
      *   *Section 2: The Usefulness Trap.* (Why worst-case alone is useless).
      *   *Section 3: The Independence Illusion.* (Why average-case is dangerous).
      *   *Section 4: The Evaluation Gap.* (Selection bias).
      *   *Example Weaving:* Use the Code Agent throughout. Don't switch examples.
      *   *Closing:* The "Spec Edit" test.

  8.  **Review against User Constraints:**
      *   *45 Minutes:* Need to pace it. ~5 min intro, 10 min grammar, 10 min usefulness, 10 min independence/bias, 5 min close.
      *   *Audience:* Backend/Infra like structure. Lawyer likes precision. ML likes distribution talk.
      *   *Key Points:* Ensure the "Correlated Failure" and "Usefulness Floor" are the climaxes of their respective sections.
      *   *Tone:* Practical, engineering-focused, not philosophical.

  9.  **Final Polish:**
      *   Make sure the "Reference Class" insight from the partner is acknowledged but translated into engineering terms (Population definition).
      *   Ensure the "Three Axes" (Input, Model, Deployment) are clearly mapped to the "Space" section.
      *   Check the "Decline" sentence. Needs to be respectful but firm.

  10. **Self-Correction during drafting:**
      *   *Initial thought:* Maybe use a financial trading bot example?
      *   *Correction:* No, stick to the Code Agent. It's internal, relatable, and the user suggested it. It avoids "science fiction" vibes better than autonomous trading.
      *   *Initial thought:* Put the "Usefulness Floor" at the end.
      *   *Correction:* No, put it before "Independence." It sets up *why* we can't just pick worst-case. We need to optimize, which forces us into average-case thinking, which *then* reveals the independence trap. This creates a narrative arc.
      *   *Check:* Did I address the lawyer? Yes, by emphasizing the "System-in-Context" and "Spec" language.

  11. **Final Output Structure:**
      *   Title Suggestion.
      *   The Dependency Graph (Sequencing).
      *   The Running Example (Code Agent specifics).
      *   Misconception Map (When to kill them).
      *   Scope Boundaries (The "Out of Scope" sentence).
      *   The Closing Test.

  (Proceed to generate response based on this structure.)
answer: |-
  Here is a plan for the talk, structured to move your audience from "Quicksort intuition" to "System Safety intuition" without getting bogged down in philosophy.

  ### 1. The Title
  **"Bounding Risk: Why 'Average' Lies in AI Systems"**
  *(Drop "Worst-Case vs. Average-Case" from the title. It triggers the Quicksort reflex immediately. Make the title about the *consequence* of the distinction.)*

  ### 2. The Dependency Structure (Sequencing)
  You are correct that a guarantee is a three-place predicate. To make your two key points land, you must establish the *grammar* of the guarantee before you evaluate the *truth* of it. If you discuss "worst-case" before defining "over what set," the audience will default to "worst input" only.

  **Sequence of Slides/Concepts:**

  1.  **The Unit of Analysis (5 mins):**
      *   **Concept:** A guarantee is never about the *model weights*. It is about the **System-in-Context**.
      *   **Definition:** System = Model + Scaffolding (prompts, parsers) + Permissions (API keys, write access) + Environment (repos, data).
      *   **Why here:** This kills the misconception that "the model is safe/unsafe." It sets up the lawyer and infra engineers to nod along.
      *   **Transition:** "Now that we know *what* we are bounding, we need to know *where*."

  2.  **The Three Axes of Variance (10 mins):**
      *   **Concept:** When we say "over all cases," which cases?
      *   **Axis 1: Input Distribution.** (Normal users vs. Adversaries).
      *   **Axis 2: Model Realization.** (Seed variance, training run variance).
      *   **Axis 3: Deployment Context.** (Test env vs. Prod legacy mess).
      *   **Why here:** This expands "worst case" beyond "jailbreaks." It prepares the ground for correlated failure.
      *   **Transition:** "We have our System and our Axes. Now we can write the sentence: 'We guarantee X metric over Y space.'"

  3.  **The Usefulness Floor (The "Do Nothing" Trap) (10 mins):**
      *   **Concept:** **Key Point 2.** A worst-case guarantee on *harm* is trivially satisfied by a system that takes no actions.
      *   **Mechanism:** Introduce the **Utility Floor**. A valid spec is: "Minimize Harm (Worst-Case) *Subject To* Utility > Threshold (Average-Case)."
      *   **Why here:** This prevents the "just turn it off" solution. It forces the audience to admit they *need* average-case reasoning to ship, which makes them vulnerable to the next point.
      *   **Transition:** "So we must rely on averages to meet the utility floor. That is where the math breaks."

  4.  **The Independence Illusion (The "Fat Tail" Trap) (15 mins):**
      *   **Concept:** **Key Point 1.** Average-case assumes failures are independent coin flips. AI failures are often **structural correlations**.
      *   **Mechanism:** If the model learns a wrong rule, it fails on *all* inputs matching that rule, not randomly. Plus, **Selection Bias**: The eval set is a clean subset; the deploy set is the messy complement.
      *   **Why here:** This is the climax. You've forced them to need averages (via Utility), then shown why averages lie (via Correlation/Selection).
      *   **Transition:** "So how do we write specs that acknowledge this?"

  5.  **Closing Test (5 mins):**
      *   Execute the spec edit test.

  ---

  ### 3. The Running Example: The Code-Migration Agent
  Your candidate is the right shape. It is concrete, internal, and has discrete stakes. To make it carry the load, you must define the "Bad Event" and the "Correlation" precisely.

  *   **The System:** An agent with write access to `legacy-services/` repos. It refactors Python 2 to Python 3.
  *   **The Metric:** "Number of production incidents caused by migration."
  *   **The Bad Event:** Not a syntax error (CI catches that). The bad event is **Silent Data Corruption** (e.g., changing a timezone handling library that works in test but fails on DST boundaries in prod).
  *   **Why it fits the constraints:**
      *   **Discrete:** An incident ticket is opened or it isn't.
      *   **Fat Tail/Correlated:** If the agent learns a wrong pattern about `datetime`, it doesn't fail on 1% of repos randomly. It fails on *every* repo that uses `datetime` in that specific way. The failures are clustered, not independent.
      *   **Selection Bias:** You evaluate on your *cleanest* repos (the ones ready for migration). You deploy on the *messiest* repos (the ones that need migration most). The "Average Error Rate" on eval is 0.1%. The "Average Error Rate" on deploy is 5% because the distribution shifted.
      *   **No Sci-Fi:** This is a bug, not a rebellion.

  **How to weave it:**
  *   **Slide 1:** Show the agent's permissions.
  *   **Slide 3:** Ask: "When we say worst-case input, do we mean a malicious engineer pushing bad code, or a legacy repo so messy it confuses the agent?" (Distinguish Axis 1).
  *   **Slide 4:** Ask: "If we freeze the model to guarantee zero harm, it migrates zero lines. Utility = 0. We need it to move fast." (Introduce Utility Floor).
  *   **Slide 5:** Ask: "If we test on 100 repos and see 1 failure, is the risk 1%? No. If that failure was due to a specific library pattern, and 500 deploy repos use that library, the risk is 100% for that subset." (Crush the Independence assumption).

  ---

  ### 4. Misconception Map
  Here is where the audience will drift, and exactly when to cut them off.

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Worst-case means jailbreaks."** | During **Axes of Variance**. | *Intervention:* "Jailbreaks are just one slice of Input Axis. A worse case for us is a benign input that triggers a structural bug in the scaffolding. We are bounding *system behavior*, not *intent*." |
  | **"With N components, risk divides."** | During **Independence Illusion**. | *Intervention:* "That holds if components fail like resistors. Here, components share weights. If the brain is wrong, the hand and the eye are wrong together. The correlation coefficient is near 1, not 0." |
  | **"If we bound worst-case, we're safe."** | During **Usefulness Floor**. | *Intervention:* "We are safe from *doing* harm, but we guarantee *doing* nothing. Is a brick safe? Yes. Is it a platform? No. We need the Utility Floor." |
  | **"The guarantee is about the Model."** | During **Unit of Analysis** (Start). | *Intervention:* "The model is a binary blob. The *system* includes the API key permissions. A safe model with an admin key is an unsafe system. We are certifying the System." |

  ---

  ### 5. Scope Boundaries (The "Out of Scope" Sentence)
  You need to acknowledge the deep uncertainty/AGI/Interpretability questions without letting them consume the room. The lawyer and ML folks will probe this.

  **The Sentence:**
  > "There are open research questions about *why* models fail internally (interpretability) and *what* happens if capabilities scale beyond human oversight (agentic risk). Those are critical, but they are **research horizons**. Today is about **engineering constraints**: how we write specs for the systems we are deploying *next quarter*."

  **Why this works:**
  *   It validates the ML researcher (yes, interpretability matters).
  *   It validates the Lawyer (yes, future risk matters).
  *   It asserts your authority (I am talking about *shipping* code).
  *   It sets a time boundary ("next quarter").

  ---

  ### 6. The Closing Check
  Your idea to hand out a one-line spec is excellent. It forces active synthesis. Do not make it multiple choice; make it a "fix the bug" exercise.

  **The Handout:**
  > **Draft Spec:** "The Migration Agent shall not introduce security vulnerabilities (Worst-Case) across all input repositories."

  **The Task:**
  > "This spec is vacuous. It has two fatal flaws based on today's talk.
  > 1. Identify which **Axis** is missing (Input, Model, or Deployment).
  > 2. Add the **Constraint** that prevents the 'Do Nothing' solution."

  **The Answer Key (for you):**
  1.  **Missing Axis:** It says "all input repositories" (Input Axis), but ignores **Deployment Context** (what if the repo structure changes?) and **Model Variance** (what if we retrain?). *Acceptable answer:* It fails to define the population (Selection Bias).
  2.  **Missing Constraint:** It lacks a **Utility Floor**. (e.g., "...while maintaining a migration throughput of >500 lines/hour").

  **Success Metric:**
  If >50% of the room identifies the "Do Nothing" loophole (Utility Floor), you have successfully transmitted the core tension. If they only focus on the "Input" definition, you spent too much time on Axes and not enough on Usefulness.

  ### Summary of Talk Flow
  1.  **Kill Quicksort:** Time cost $\neq$ Safety cost.
  2.  **Define System:** Model + Permissions + Context.
  3.  **Define Space:** Inputs + Seeds + Deployment Env.
  4.  **The Trap:** Worst-Case Harm = 0 implies Utility = 0.
  5.  **The Lie:** Average-Case assumes independence; AI failures correlate.
  6.  **The Fix:** Specs must bound harm *subject to* utility, over *defined* populations.
  7.  **Test:** Fix the broken spec.

  This structure respects the engineers' desire for precision, the PMs' desire for shipping, and the Lawyer's desire for liability bounds, without requiring a philosophy degree to follow.
