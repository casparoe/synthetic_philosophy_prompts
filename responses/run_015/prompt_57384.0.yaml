answer: |-
  Here is a complete lesson plan designed to hit your two learning objectives through direct experience rather than lecture.

  # Lesson Plan: The Horizon & The Law
  **Topic:** Determinism vs. Predictability (Chaos) vs. Statistical Regularity.
  **Time:** 75 Minutes.
  **Materials:** Printed handouts (one per table), 6 sets of dice (or 1 set passed around), whiteboard.

  ## 1. The Payoff Scheme (Grade Kicker)
  To make the betting sting, use a "Section Currency."
  *   **Endowment:** Each table starts with **1,000 Points**.
  *   **Conversion:** The table with the highest final score gets **+2%** on their next assignment. Second place gets **+1%**.
  *   **Psychology:** This is enough to make them care, but small enough that losing won't cause a revolt. Emphasize that *conservative* betting often wins, but today requires *confidence*.

  ## 2. The Handout & Numbers
  Create a single sheet with two distinct sections. Do not explain the math yet.

  **Section A: The Deterministic Track (Chaos)**
  *   **Rule:** $New Value = (2 \times Old Value)$. If the result is 1.0 or higher, subtract 1.0 (keep only the decimal part).
  *   **Task:** Calculate 8 Rounds.
  *   **The Seed:** (Assign these secretly per table row)
      *   **Tables 1 & 2:** Start with **0.4000**
      *   **Tables 3 & 4:** Start with **0.4010**
      *   **Tables 5 & 6:** Start with **0.4000**
  *   **The Checksum:** At Round 4, your number should be roughly **0.4XXX** (for Tables 1/2/5/6) or **0.41XX** (for Tables 3/4). *Note: This ensures they haven't made arithmetic errors before the horizon hits.*
  *   **The Bet (Round 5):** Before calculating Rounds 6–8, bet 500 Points on whether your Round 8 result will be **LOW (< 0.5000)** or **HIGH (> 0.5000)**.
  *   **The Comparison:** Compare your Round 8 result with the table next to you.

  **Section B: The Stochastic Track (Order)**
  *   **Task:** Roll a standard 6-sided die 20 times. Record the sum.
  *   **The Bet:** Bet 500 Points that your Table Sum will fall between **55 and 85**.

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | TA Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Setup** | Hand out sheets. Explain Points. **Do not explain the physics yet.** Tell them: "Section A is a perfect machine. Section B is pure luck." |
  | **05-15** | **Section A (Rounds 1-4)** | Students calculate. Walk around. Ensure they are doing the "mod 1" part correctly (dropping the integer). |
  | **15-20** | **The Checksum** | Reveal the Round 4 Checksum. If a table is off, help them fix their math. This eliminates "I lost because I added wrong" later. |
  | **20-25** | **The Trap (Betting)** | **Stop.** Ask them to look at their Round 4 number. Ask: "Tables 1 and 3, your numbers are almost identical. Will your Round 8 results be similar?" They will say **Yes**. <br> Have them write down their HIGH/LOW prediction and wager 500 points. |
  | **25-35** | **Section A (Rounds 5-8)** | Students finish calculations. Tension builds as numbers start looking different. |
  | **35-40** | **The Reveal (Chaos)** | Tables compare Round 8 results. Tables 1 & 3 (neighbors) will have totally different High/Low outcomes. Collect bets. Most will lose. |
  | **40-55** | **Section B (Dice)** | Students roll dice 20 times. Sum the results. Place 500 point bet on the 55-85 range. Reveal results. Almost everyone wins. |
  | **55-75** | **Debrief** | Map the experience to the concepts (see below). |

  ## 4. The Debrief (Mapping Experience to Theory)
  Do not lecture immediately. Ask these questions in order:

  1.  **The Deterministic Loss:** "In Section A, you knew the exact rule. You had the exact starting number (to 4 decimals). Why did Tables 1 and 3 end up with opposite results?"
      *   *Target Answer:* The tiny difference in the start (0.0010) got multiplied every single round.
      *   *Concept:* **Sensitivity to Initial Conditions.** Determinism $\neq$ Predictability. There is a "Prediction Horizon" (Round 5) where precision runs out.

  2.  **The Random Win:** "In Section B, you had no rule. You couldn't predict a single roll. Why did you win the bet confidently?"
      *   *Target Answer:* Individual rolls are random, but the *sum* is constrained.
      *   *Concept:* **The Law of Large Numbers.** Randomness $\neq$ Unpredictability (in aggregate).

  3.  **The Synthesis:** "Which system was actually more predictable?"
      *   *Punchline:* The random one. We could predict the dice sum better than the deterministic formula.
      *   *Takeaway:* Determinism guarantees a single future, but not a *knowable* one. Randomness guarantees uncertainty, but creates stable patterns in the aggregate.

  ## 5. What Predictably Goes Wrong (Troubleshooting)

  **1. The Arithmetic Wall**
  *   **Problem:** Multiplying 4-digit decimals 8 times is tedious. Students will zone out or make sloppy errors in Rounds 6-8.
  *   **Fix:** The **Checksum at Round 4** is critical. It resets their confidence. If a table is way off at Round 4, give them the correct Round 4 number and let them continue from there. It is better they experience *divergence* than *arithmetic failure*.
  *   **Backup:** If they are too slow, cut Section A to 6 Rounds. $2^6 = 64$. A 0.0010 difference becomes 0.064. It might not flip High/Low every time, but it will create visible divergence.

  **2. The "TA Cheated" Accusation**
  *   **Problem:** When Tables 1 and 3 diverge, students will claim you gave them different rules.
  *   **Fix:** Write the Rule ($2x \mod 1$) on the board and leave it there. Acknowledge the seeds were slightly different ($0.4000$ vs $0.4010$). Ask: "Is 0.0010 a different rule, or just a measurement error?" This *is* the lesson. Real-world measurements always have error.

  **3. Cynicism about the Points**
  *   **Problem:** If they lose the Chaos bet, they might disengage from the Dice bet.
  *   **Fix:** Frame the Chaos loss as "Tuition." "You paid 500 points to learn that intuition fails in chaotic systems. Now use that lesson to win the Dice bet."

  ## 6. Limitations of Paper-and-Pencil
  You need to supply this context yourself in the debrief, as the game cannot show it:

  1.  **Finite Precision vs. True Chaos:**
      *   *The Game:* Shows divergence due to *rounding* (4 decimal places).
      *   *The Reality:* Chaos exists even with infinite precision. The paper game conflates "measurement error" with "Lyapunov instability."
      *   *What to say:* "On paper, the divergence happened because we ran out of digits. In the real world (weather, orbits), the divergence happens because we can never measure the present perfectly. The 'Horizon' isn't about your calculator; it's about the universe."

  2.  **Discrete vs. Continuous:**
      *   *The Game:* Steps are discrete (Round 1, Round 2).
      *   *The Reality:* Chaos is often continuous (fluid dynamics).
      *   *What to say:* "We used steps to make it calculable. Imagine these steps happening every millisecond. The horizon arrives much faster."

  3.  **The "Random" Source:**
      *   *The Game:* Dice are physically deterministic (Newtonian mechanics), just complex.
      *   *The Reality:* Quantum mechanics suggests true randomness exists.
      *   *What to say:* "For this class, treat the dice as truly random. Whether they are 'actually' deterministic deep down doesn't change the fact that *for you*, they are unpredictable individually but predictable in sum."

  ## TA Cheat Sheet (Pre-Calculated Values)
  *Keep this for your eyes only to verify student work.*

  **Seed 0.4000 (Tables 1, 2, 5, 6)**
  1. 0.8000
  2. 0.6000
  3. 0.2000
  4. 0.4000 **(Checksum)**
  5. 0.8000
  6. 0.6000
  7. 0.2000
  8. **0.4000 (LOW)**

  **Seed 0.4010 (Tables 3, 4)**
  1. 0.8020
  2. 0.6040
  3. 0.2080
  4. 0.4160 **(Checksum)**
  5. 0.8320
  6. 0.6640
  7. 0.3280
  8. **0.6560 (HIGH)**

  *Note: The divergence is guaranteed. Tables 1 and 3 are neighbors. They will compare 0.4000 vs 0.6560. One bets Low, one bets High (or both bet Low based on early rounds). Either way, the "Similarity" intuition is shattered.*
