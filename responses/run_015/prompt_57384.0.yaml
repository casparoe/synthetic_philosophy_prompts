prompt: |-
  TA-ing a 75-minute discussion section, 24 students at tables of four, week on determinism and predictability. Explaining it hasn't landed, so I want a game instead. It should make them feel two things inside the same session: that a rule with zero randomness in it can still be unpredictable past a horizon, and — the flip side — that something genuinely random can be predicted dead accurately in the aggregate. They need to run into the horizon by betting confidently and losing, not get warned beforehand.

  I was thinking the deterministic track could be "keep doubling this decimal and throw away the whole-number part each time," since then every round eats one digit of the starting value and the horizon is literally however many digits you were handed — but use whatever works better, it just has to be doable on paper. No computers, no real money; points can convert into a small grade kicker I can actually afford to give.

  Give me the rules, the actual numbers for the handout, the payoff scheme, a min-by-min timeline, and a debrief that maps what happened at the tables onto the distinction. Then tell me what predictably goes wrong the first time it's run (my guess: the arithmetic eats the clock), how to handle that, and which part of the point a paper-and-pencil game just cant reproduce, so I know what I have to supply myself.
