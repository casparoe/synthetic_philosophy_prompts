answer: |-
  **Question 1**
  You propose compulsory service on the model of jury duty with narrowly drawn hardship exemptions. Given that those who decline under such a regime are rarely a random subset, can you distinguish the properties your stratification variables actually guarantee from those the acceptance process silently undoes, and will you commit to a threshold of service uptake below which you concede the Chamber is no longer a sample?
  *Likely Reply:* He will argue that deliberation transforms preferences so the initial sample bias matters less than the final deliberative output.
  *Follow-up:* If the transformation of preferences is doing the heavy lifting rather than the statistical mirror, why retain the costly stratification variables at all instead of relying solely on the deliberative process to correct for any initial skew?

  **Question 2**
  Members choose their own expert witnesses by majority vote from a list compiled by a permanent, unelected clerical service, yet they have no prior training in these policy areas. What makes a choice from a staff-drafted menu autonomous rather than merely unconstrained, and how do you prevent the clerks from shaping the inquiry by omitting dissenting views from the list?
  *Likely Reply:* He will claim that authorization and accountability are separable, so the clerks serve the body without needing to be elected themselves.
  *Follow-up:* If accountability is separable from authorization, does that not grant the clerks immunity from the very public scrutiny you demand for the Chamber, effectively making them the only unanswerable actors in the system?

  **Question 3**
  The only monitor of a four-year amateur body is a permanent bureaucracy that is neither elected nor sorted, since the absence of repeat play removes the forward-looking sanction that disciplines an elected chamber. Does this not mean the clerical service is the real legislature, and if so, why is that better than openly having one?
  *Likely Reply:* He will answer that randomly chosen members have no donors, no careers, and no party whip, unlike professional politicians.
  *Follow-up:* But without the career incentive to maintain a reputation for competence over multiple terms, what prevents the members from deferring entirely to the permanent staff who possess the institutional memory they lack?

  **Question 4**
  Your design is the limiting case of the term-limit reformer's program, yet the standard complaint about term-limited legislatures is institutional amnesia plus dependence on staff and outside interests. What in your design prevents this complaint from applying with maximum force, and where does the expertise come from if not from the permanents who brief him?
  *Likely Reply:* He will argue that four years is long enough to acquire expertise through the transformation of preferences under good deliberative conditions.
  *Follow-up:* If four years is sufficient for expertise, why is the term non-renewable, and does forcing out members just as they become competent not waste the very capacity you claim the design builds?

  **Question 5**
  Athens paired the lot with entry vetting, post-office audit, one-year non-repeatable tenure, a presidency that rotated by the day, and an assembly of the whole citizen body sitting above the sorted council. Is your evidence the lot alone or the lot together with that apparatus, and if the latter, why have you omitted the audit and rotation devices from your own design?
  *Likely Reply:* He will answer that Athenian accountability was ex post and non-electoral, which is precisely his point about separable accountability.
  *Follow-up:* If you accept that Athenian accountability was the key variable, will you add corresponding ex post audit devices to your own design and say how much of the argument survives once accountability, rather than random selection, is doing the work?

  **Question 6**
  Stratified sortition delivers a group its population share of seats and nothing more, whereas elections can make a geographically concentrated or strategically positioned minority decisive and therefore worth bargaining with. Why should proportional presence be preferred to pivotal power, and would you accept a design granting small groups more than their share of seats?
  *Likely Reply:* He will answer that presence changes what counts as a reason in the room through the transformation of preferences under good deliberative conditions.
  *Follow-up:* Can you specify the causal mechanism by which presence changes reasons, and how would you distinguish genuine persuasion from the majority's preference being restated in more presentable language by the included minority?

  **Question 7**
  The frame is the electoral register, so the Chamber mirrors the electorate rather than everyone subject to the law, meaning children, resident non-citizens, and the disenfranchised are governed but cannot be drawn. If you widen the frame, what do you stratify on when no register exists for those groups, and does mirroring the population rather than the electorate sever the connection to the demos that authorizes law?
  *Likely Reply:* He will argue that authorization and accountability are separable, so the body need not be elected in order to be answerable to the whole population.
  *Follow-up:* If the body is answerable to non-members who cannot select it, how do those non-members exercise any sanction without the electoral lever you have removed, and does this not create a class of subjects without any agency?

  **Question 8**
  If random selection tracks the public's judgment better than election does, why stop at one chamber and leave the central bank, the courts, and the epidemic-response agency to appointment? When a technical parameter just is the moral question, such as a debt brake or coverage threshold, which body gets it and by what criterion?
  *Likely Reply:* He will answer that legislatures settle contested values while technocratic bodies settle means.
  *Follow-up:* Since you admit the distinction between means and ends often collapses in practice, will you commit to submitting at least one technocratic agency to sortition to test whether your distinction holds under real policy pressure?

  **Question 9**
  The citizens' assemblies on electoral reform in British Columbia and Ontario produced recommendations that the electorate then rejected, yet your design removes ratification entirely for the veto and makes the amendment-initiative self-executing. What happens when the Chamber vetoes an emergency or deeply unpopular bill with no possibility of appeal, and why is this superior to the failed model of advisory assemblies?
  *Likely Reply:* He will answer that we should judge the output rather than the uptake, and that the failure lay in handing the last word back to voters.
  *Follow-up:* If the uptake is irrelevant to legitimacy, on what basis do you claim the Chamber represents the public will when its decisions systematically diverge from what the public would vote for itself?

  **Question 10**
  Name a comparison that could be run before adoption where the same bill is put to the sorted Chamber and to the elected lower house under identical testimony and identical time, and commit in advance to the criterion on which you would judge the result and a result that would make you withdraw the proposal.
  *Likely Reply:* He will likely suggest looking at the quality of deliberation rather than the outcome, citing the transformation of preferences under good deliberative conditions.
  *Follow-up:* If you judge only the process and not the outcome, how can you claim the design produces better laws rather than just different ones, and will you accept a metric based on public satisfaction with the result?

  **Ordering Explanation**
  I open with the Response, Framing, and Capture questions to establish command of the internal mechanics before challenging the theoretical foundations. This sequence moves from the integrity of the sample to the autonomy of the members, then to the power dynamics with the bureaucracy, ensuring the guest must defend the operational viability before addressing normative claims. The middle section tests the consistency of the design against historical precedents and broader democratic theory, relying on the earlier admissions about bureaucracy and expertise. The Ratification question follows naturally as a stress test of the Chamber's power relative to the electorate, leading into the final Disconfirmation question which demands empirical falsifiability after all theoretical defenses have been aired.
