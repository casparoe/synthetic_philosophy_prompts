answer: |-
  1. **What I think you are describing**

  You are identifying a violation of *status quo independence* in the betterness relation. In your regulatory work, the ranking of options $A$ and $B$ is invariant to whether $A$ or $B$ is labeled the baseline. In the population ethics cases you describe, the normative verdict flips or dissolves depending on which option is treated as the starting point. This is not merely a substantive claim about who matters (the creation asymmetry), but a structural claim about how value is aggregated across changes in existence.

  Your description conflates two distinct logical failures: *incompleteness* (the theory refuses to rank the pair) and *reference dependence* (the theory ranks them differently based on the anchor). The phenomenon you spot is specifically reference dependence: the permission to transition from $A$ to $B$ is not the inverse of the permission to transition from $B$ to $A$. This implies that value is attached to *vectors* (changes) rather than *states* (outcomes), violating the standard assumption that betterness is a property of outcome pairs independent of history or framing.

  2. **Nearest established concepts, and where each falls short**

  **The Person-Affecting Restriction:** This view holds that an outcome can only be better or worse if it is better or worse for some particular person. It explains why adding a happy person might be neutral (no existing person is benefited) while removing them is bad (the new person is harmed). However, this is a substantive moral claim about *who counts*, not a structural claim about *how ranking works*. You can theoretically hold person-affecting views without baseline dependence if you treat non-existence as a fixed welfare level. Your complaint targets the structural instability of the ranking, not the moral status of the unborn.

  **Incompleteness of the Betterness Relation:** This concept suggests that some pairs of outcomes are simply incomparable; neither is better, worse, nor equal. While this captures the "reluctance to answer," standard incompleteness is static. If $A$ and $B$ are incomparable, they remain so regardless of whether you start at $A$ or $B$. Your observation is dynamic: the verdict seems to shift from "no improvement" to "not worse" depending on the direction of inquiry. Incompleteness alone does not entail that the *decision* depends on the status quo, only that the *ranking* is partial.

  **Status Quo Bias as a Decision Rule:** This is a procedural rule stating that when options are incomparable, the agent should stick with the current state. This matches the behavior you describe but locates the phenomenon in the *choice mechanism* rather than the *value theory*. You are asking about the ranking itself (the cost-benefit analysis), not the tie-breaking rule. If the ranking itself changes based on the baseline, the bias is embedded in the valuation, not just the selection.

  **Path Dependence:** In choice theory, this means the final selection depends on the sequence of moves taken to get there. This is close, but path dependence usually involves intermediate steps. Your case involves only two states. The dependence is not on the *history* of how you arrived, but on the *labeling* of the current position. It is a specific, two-point form of path dependence where the vector direction matters more than the endpoints.

  **Context-Dependent Betterness:** This is the strongest candidate. It posits that the betterness relation is a function of the choice set or the framing context. However, literature often uses this to describe menu effects (adding a third option changes the ranking of the first two). Your case is stricter: the ranking of two fixed options changes solely based on which is designated as the counterfactual baseline. This is a specific subtype of context dependence that violates the standard independence axioms of rational choice more severely than mere menu dependence.

  3. **The carving**

  The invariant core of this phenomenon is **Vector-Relative Valuation**. The theory assigns value to transitions ($A \to B$) rather than comparing states ($A$ vs $B$). Consequently, the value of moving from $A$ to $B$ is not necessarily the negative of moving from $B$ to $A$.

  *   **Clear Instance:** A theory that says "Adding a happy life is neutral, but removing a happy life is bad." Here, $10 \to 11$ has value 0, but $11 \to 10$ has value -1. The ranking depends on the direction of the vector. This fits your description exactly: adding isn't an improvement, but removing is a harm.
  *   **Clear Non-Instance:** Total Utilitarianism. The sum of welfare in state $A$ and state $B$ is fixed regardless of which is the baseline. If $Sum(A) > Sum(B)$, then $A$ is better than $B$ whether you are moving from $B$ to $A$ or considering staying at $A$. The vector direction is irrelevant; only the endpoint magnitudes matter.
  *   **Boundary Case:** Critical-Level Utilitarianism (where lives above a certain threshold count positively, below negatively). If the new person is exactly at the critical level, adding them is neutral. Removing them is also neutral. Here, vector direction does not change the verdict (both are zero). However, if the theory treats "existing at critical level" differently from "coming to exist at critical level," it slips into Vector-Relative Valuation. I would rule this a non-instance unless the theory explicitly assigns different weights to existence vs. continuation, because standard Critical-Level views evaluate states, not transitions.

  4. **If there is no name, coin one**

  I propose the label **Anchored Betterness**.

  **Definition:** A theory exhibits Anchored Betterness if the normative relation between two outcomes $A$ and $B$ is not a binary function $R(A, B)$, but a ternary function $R(A, B, S)$, where $S$ is the status quo anchor. The verdict on whether $A$ is preferable to $B$ varies depending on whether $S=A$ or $S=B$.

  **Distinction:** This differs from simple incompleteness. Incompleteness yields no verdict regardless of the anchor. Anchored Betterness yields a verdict, but the verdict is contingent on the anchor. It differs from Status Quo Bias because the bias is not a tie-breaker for indifferent options; it is a constitutive part of the valuation itself.

  **Test:** To determine if a new theory has this feature, perform the **Swap Test**. Construct a choice pair $\{A, B\}$. First, stipulate $A$ is the status quo and ask if moving to $B$ is required, permitted, or forbidden. Second, stipulate $B$ is the status quo and ask if moving to $A$ is required, permitted, or forbidden. If the deontic status of the transition changes (e.g., from "permitted" to "forbidden") without any change in the intrinsic properties of $A$ and $B$, the theory exhibits Anchored Betterness.

  5. **Feature or defect, and whether it is avoidable**

  From the perspective of regulatory cost-benefit analysis, Anchored Betterness is a defect. It violates the axiom of baseline independence, making rational planning impossible because the "best" option cannot be identified without knowing the arbitrary starting point. It introduces friction and inertia into the moral calculus that mimics irrational status quo bias.

  However, in population ethics, it may be an unavoidable cost of avoiding the Repugnant Conclusion while respecting person-affecting intuitions. Impersonal theories (like Total Utilitarianism) maintain baseline independence but generate repugnant results. Person-centered theories avoid the repugnant conclusion but often require Anchored Betterness to explain why we aren't obligated to create happy people while still being obligated not to harm existing ones.

  I would change my mind on its unavoidability if a theory could demonstrate **Baseline-Independent Non-Repugnance**. This would require a value function that ranks states without reference to transitions, yet does not imply that adding low-welfare lives is always good if the total sum increases. If such a theory exists (perhaps via variable critical levels that depend on population size rather than status quo), then Anchored Betterness is merely an artifact of specific person-affecting formulations, not a necessary feature of non-repugnant ethics. Until then, it remains a structural trade-off: preserve baseline independence and accept the Repugnant Conclusion, or avoid the Conclusion and accept Anchored Betterness.
