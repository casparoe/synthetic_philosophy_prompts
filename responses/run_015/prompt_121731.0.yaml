answer: |-
  **Title:** The Value of the Future and the Limits of the Body: Reconciling Marquis and Thomson in the Modified Violinist Case

  The debate over the moral permissibility of abortion has long been dominated by two powerful philosophical frameworks: Judith Jarvis Thomson's defense of bodily autonomy and Don Marquis's argument regarding the "future like ours" (FLO). Traditionally, these arguments are treated as opposing forces, with Thomson granting the fetus personhood to argue for the right to disconnect, and Marquis arguing that the fetus's potential future makes abortion prima facie wrong. However, the tension sharpens when we modify Thomson's famous "Violinist" analogy. Imagine the unconscious violinist is not merely a fully formed adult, but a developing being who, if sustained, will definitely acquire a "future like ours." In this modified case, does the FLO argument block the right to withdraw life-support by changing the nature of the harm involved? Or can the two arguments be made consistent?

  I argue that Thomson's and Marquis's arguments can indeed be made consistent, provided we understand them as addressing different moral categories. Marquis's FLO argument successfully establishes the *moral gravity* of the act—acknowledging that disconnecting entails a profound loss of value. However, it fails to establish a *claim right* to another person's body. Thomson's framework remains dominant regarding the *permission* to act because bodily autonomy functions as a side-constraint that cannot be overridden by the value of another's future. Therefore, even in the modified case where the violinist possesses a future like ours, the right to withdraw life-support still applies. The arguments do not talk past each other; rather, Marquis explains the tragedy of the outcome, while Thomson explains the legitimacy of the choice.

  To understand the stakes of this synthesis, we must first apply Marquis's lens to Thomson's modified scenario. In the original analogy, the violinist is a person with a current right to life. In the modified case, the violinist is a being with a "future like ours"—a being for whom death represents the deprivation of all future experiences, projects, and enjoyments. Marquis contends that what makes killing wrong is precisely this deprivation. If we accept that the attached being has an FLO, then unplugging the life support is not merely refusing aid; it is actively initiating a sequence that deprives a being of a valuable future. From the Marquisian perspective, this significantly raises the moral cost of Thomson's "unplugging." It suggests that the harm inflicted is not just the cessation of biological function, but the erasure of a meaningful life trajectory. If the harm is this severe, one might argue that the duty to prevent it outweighs the burden of pregnancy (or attachment).

  However, this Marquisian objection misunderstands the specific mechanics of Thomson's bodily autonomy argument. Thomson does not deny that the violinist has a right to life, nor does she deny that the violinist's death is a bad outcome. Her argument is strictly about the *limits of what that right to life entails*. She posits that the right to life is not a right to whatever one needs to stay alive, specifically if obtaining those needs requires the non-consensual use of another's body. When we introduce the FLO element, we increase the *value* of the life being lost, but we do not change the *nature of the claim* being made on the host.

  The consistency between the two arguments lies in distinguishing between the *wrongness of killing* and the *enforceability of bodily sacrifice*. Marquis is correct that depriving a being of an FLO is a serious moral wrong. In the modified violinist case, unplugging is indeed a tragic event that destroys a valuable future. Thomson can and should concede this point without undermining her conclusion. She can acknowledge that the act is morally weighty and sorrowful (validating Marquis) while maintaining that it is not unjust (validating Thomson). The FLO argument explains why we might feel remorse or why society might encourage carrying the pregnancy, but it does not generate a moral obligation that compels the host to remain attached.

  Critics might argue that if the harm of losing an FLO is great enough, it must override bodily autonomy. They would claim that the "harm principle" dictates we must prevent the greater evil (loss of a future) over the lesser evil (nine months of bodily burden). This is where the two arguments would truly talk past each other: one speaking in terms of utilitarian calculus (Marquis), the other in terms of deontological rights (Thomson). To make them consistent, we must reject the utilitarian override. Rights, particularly bodily rights, are not merely weights on a scale to be balanced against the value of a future. They are boundaries.

  Consider the modified violinist again. Even if the violinist is a genius child with a spectacular future ahead of them (a potent FLO), they do not have the right to harvest your kidney without your consent to save that future. The value of their future does not transform your body into public property. The "harm" of killing is indeed the deprivation of the FLO, but that harm does not license the violation of bodily integrity. To argue otherwise is to suggest that the more valuable a person's future is, the more claim they have on others' bodies. This leads to absurd conclusions: we would be more obligated to sustain a brilliant scientist than an average person, or more obligated to sustain a fetus than a born child, based solely on the potential "value" of their future. Thomson's argument protects against this sliding scale by asserting that bodily integrity is equal and inviolable, regardless of the dependent's potential.

  Therefore, the FLO claim does not block the right to withdraw life-support because it addresses the *consequence* of the action, whereas Thomson addresses the *authority* over the action. Marquis tells us what is lost when the plug is pulled; Thomson tells us who holds the plug. In the modified case, the developing violinist has a future like ours, making the loss profound. But that future belongs to *them*, not to the person attached to them. The right to withdraw life-support is rooted in the sovereignty of the self. If we allow the value of another's future to negate bodily sovereignty, we effectively enslave the host to the potential of the dependent.

  In conclusion, Thomson's violinist argument and Marquis's future-like-ours argument are consistent if we recognize their distinct domains. Marquis successfully identifies why abortion (or unplugging) is a morally serious act involving a significant loss of value. He prevents the trivialization of the fetus's death. However, he fails to prove that this loss creates an entitlement to another's body. Thomson's argument complements this by establishing that while the loss is tragic, the host is not morally required to prevent it through bodily sacrifice. In the modified case where the violinist has a future like ours, the right to withdraw life-support remains intact. The FLO argument deepens our understanding of the moral cost, but it does not dismantle the moral boundary of bodily autonomy. We can mourn the lost future (Marquis) while defending the right to disconnect (Thomson) without contradiction.
