answer: |-
  You and your friend have independently reconstructed one of the central debates in the philosophy of mind and language from the last 50 years. You aren't reinventing the wheel, but you have put your fingers directly on the axle.

  The specific "shape" of the argument you are describing doesn't have a single catchy Latin name like *tu quoque*, but it is a recognized structural move known as a **Parity of Reasoning Argument** applied to the **Problem of Intentionality**.

  Here is the breakdown of the territory you've stumbled into, the names for the wrinkles, and a coinage for the specific shape you're tracking.

  ### 1. The Core Debate: Intrinsic vs. Derived Intentionality
  The philosophical term for "aboutness" is **intentionality**.
  *   **Your Friend's Position:** This is the **Searlean** view (after John Searle). Searle argues for a hard distinction between **Original (Intrinsic) Intentionality** (human minds) and **Derived Intentionality** (words, maps, computers). For Searle, a computer simulation of a storm isn't wet, and a simulation of understanding doesn't understand. The content is borrowed from the programmer.
  *   **Your Position:** This is the **Dennettian** view (after Daniel Dennett). Dennett argues that if you trace human intentionality back far enough (to neurons, to evolution, to physics), you never find a little "understander" inside. Therefore, human intentionality is also a kind of derived or "as-if" intentionality. If the machine is fake because it's derived, we are too.

  This specific fight is often called **The Debate Over Naturalized Intentionality**. Can meaning be "naturalized" (explained by physical causes like evolution) or does it require something non-physical (consciousness)?

  ### 2. The Shape of the Argument
  You asked for a name for the *shape*: *Claim X relies on Source Y. Source Y lacks Property P. Therefore X lacks Property P. But if we apply this to Humans, Source Z (evolution) also lacks Property P.*

  This is not *tu quoque* (which attacks the person's consistency). This is a **Constitutive Parity Argument**.
  *   **Constitutive:** It asks what *constitutes* the property (meaning).
  *   **Parity:** It argues that the conditions applied to Case A (machine) must apply to Case B (human) unless a relevant difference is shown.

  If you want to coin a term for this specific deadlock, call it **The Grounding Parity Dilemma**.
  *   **The Horns:** Either (1) Meaning requires a source that already has meaning (which leads to an infinite regress, because where did the first meaning come from?), or (2) Meaning can arise from sources that *don't* have meaning (in which case, machines are fine).

  ### 3. Handling the Wrinkles

  You identified two specific philosophical problems that keep this debate alive. Philosophers have names for these, too.

  **Wrinkle 1: The Types of Lenders**
  *   *The Question:* Can blind processes (evolution) lend content, or does it require a mind?
  *   *The Philosophical Label:* **Teleosemantics**.
      *   Philosophers like Ruth Millikan and Fred Dretske argue that natural selection *can* be a lender. They say a heart's function is to pump blood not because anyone "means" it to, but because that's what it was selected for. They argue this biological "proper function" is enough to ground content without a conscious understander.
      *   If you accept Teleosemantics, your friend is wrong: evolution *can* lend content even if it doesn't understand.
      *   If you reject it (like Searle), you must explain how the chain starts without a "magic moment" where physics suddenly became semantics.

  **Wrinkle 2: The Chain vs. The Loop**
  *   *The Question:* Does meaning need a foundation (a bottom), or can it be circular (a web)?
  *   *The Philosophical Label:* **Foundationalism vs. Coherentism** (in semantics).
      *   **Foundationalism:** Your friend's view. Meaning must bottom out in something that *just has meaning* intrinsically. If it doesn't bottom out, it's "empty credit."
      *   **Coherentism / Holism:** Your view (and Wittgenstein's). Meaning doesn't bottom out; it floats on a web of usage. A word means what it does because of its relationship to other words and actions in a community. There is no "first depositor." As Robert Brandom puts it, meaning is a social game of giving and asking for reasons. The "credit" is backed by the stability of the system, not a gold reserve in the vault.

  ### 4. Why "Tu Quoque" Was the Wrong Objection
  Your friend called it *tu quoque* ("you also do it"). That implies you are being hypocritical. You correctly identified that you are making a **Reductio ad Absurdum**.
  *   You are saying: "Your criterion for 'fake meaning' is so strict that it classifies human meaning as fake. Since human meaning isn't fake (presumably), your criterion is broken."
  *   In the literature, this is often called **The Argument from Evolutionary Continuity**. If humans evolved from machines (biological machines) via blind processes, there is no magical cutoff point where "derived" became "original."

  ### 5. Summary and Coinage
  You are standing exactly where Searle and Dennett stood in the 1980s and 90s.
  *   **Searle:** "Syntax is not sufficient for semantics." (The machine has rules, not meaning).
  *   **Dennett:** "Syntax is all we have, even us." (Meaning is just complex syntax viewed from the 'intentional stance').

  **The Coinage:**
  Since no single term captures the specific *structural deadlock* you described (the borrowing chain that might loop), I propose you call this **The Semantic Regress Parity**.

  **Its Edges:**
  1.  **The Regress Edge:** If meaning must be lent by a understander, who understood the first understander? (Stops at God? Stops at Evolution?)
  2.  **The Parity Edge:** If evolution can lend meaning without understanding, why can't a programmer lend it to a computer?
  3.  **The Circularity Edge:** If meaning is a loop (community to community), is it "real" or just a stable illusion?

  **Verdict:**
  Your friend is a **Semantic Foundationalist** (believes in a hard stop where meaning begins).
  You are a **Semantic Naturalist** or **Coherentist** (believes meaning emerges from non-meaning parts).

  You didn't lose the argument; you just hit the bedrock of the field. The reason you "couldn't handle" the wrinkles is that professional philosophers haven't fully handled them either. The "Line of Credit with no money behind it" is exactly how many modern pragmatists describe language—and they think that's fine. Your friend thinks that's terrifying. That's not a logic error; that's a difference in metaphysical appetite.
