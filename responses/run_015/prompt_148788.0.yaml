answer: |-
  Last year, an editor killed a sentence of mine: "The agency's failure to act caused the deaths." She couldn't articulate what was wrong, only that it felt distinct from "The flood caused the deaths." Around the same time, a colleague covering climate change struggled to attribute harms to nations that didn't cut emissions. We circled the same drain: is an omission a cause, or is it blame sneaking in through the back door? The current philosophical landscape offers no traction. Realists say omissions are causes but cannot explain why we don't blame everyone for everything. Skeptics say omissions are never causes, rendering legal and journalistic practice systematically false. Pluralists shrug and say "it depends," offering no methodology for determining *how* it depends. This project proposes that the bug lies in treating "an omission" as a singular category.

  The research question is determinate: Can a baseline for omission causation be established without invoking normative expectations? Yes or no. If yes, omission causation is descriptive; if no, it is moral claim disguised as causal mechanics. To answer this, I will test a three-way taxonomy against professional usage. First, the *withheld action*: a specific act was scheduled or decided and then stopped (a nurse withholding a dose). Second, the *unformed intention*: the agent had ability and occasion but never considered acting (a passerby ignoring a drowning child). Third, the *structural impossibility*: no individual had the standing to create the mechanism that would have helped (a policy gap). My hypothesis is that causal intuition holds firm only in the first case, degrades in the second, and collapses in the third.

  The core difficulty is the counterfactual baseline. For actions, we compare against the normal course of events—what would have happened anyway. For omissions, we seem to compare against what the agent *should* have done, or what a decent agent would do, or what people in that role usually do. I need to know which of these is doing the work, and whether any are purely descriptive.

  Over nine months, I will conduct structured half-hour interviews with working reporters, editors, and judges. I will present them with fixed cases spanning my three categories and record not just their verdicts, but their justification language. Is this vibes-laundering? Honestly, it risks being so. However, it beats armchair case-mongering because it tests high-stakes usage rather than philosophical intuition. It beats existing empirical work on causal judgment because that literature focuses on laypeople's psychological heuristics. I am interested in the normative rules experts enforce when liable for errors. If editors and judges rely on a shared, identifiable baseline distinct from moral blame, that is a discoverable fact about our epistemic infrastructure. If they cannot articulate a baseline without referencing duty or decency, that is also data. The interviews will be transcribed and coded for explicit appeals to norms versus mechanisms.

  The deliverable will be a one-page decision tree an editor can run before printing any sentence of the form "X's failure to do Y caused Z." It will route users through the taxonomy and require a justification for the baseline selected. This tool forces transparency: if you cannot specify the baseline without invoking morality, the sentence must be framed as moral criticism, not causal reporting.

  Failure conditions are plain. First, if my three-way taxonomy turns out to be merely relabeling the old dispute between realists and skeptics without generating new predictive power. Second, if everything floats on which baseline you pick and nothing pins the baseline down. If the interviews reveal that baseline selection is entirely arbitrary or purely political, the project fails to find a descriptive anchor. I will state this out loud in the final report.

  A committed defender of the "omissions are never real causes" line would concede that omission language is linguistically indispensable and legally functional. They would admit that courts must assign liability for non-actions to maintain social order. However, they would dismiss this as merely awkward pragmatics, not metaphysical truth. They would argue that my decision tree merely codifies useful fictions. Their exposed flank is this: if the "fiction" operates consistently enough to generate a decision tree, the distinction between useful fiction and functional truth becomes negligible for a reporter. They must explain why a consistently applicable rule isn't a form of truth.

  This fellowship allows me to isolate the causal claim from the moral claim. If I succeed, we stop printing causal sentences that are actually moral judgments. If I fail, we learn that causation by omission is inherently normative, and journalists must stop pretending otherwise.

  Verdict: FUNDABLE | The claim that practitioners rely on a shared, identifiable baseline distinct from moral blame.
