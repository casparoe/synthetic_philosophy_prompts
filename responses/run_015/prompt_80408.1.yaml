answer: |-
  You have stumbled onto one of the most robust positions in modern philosophy of punishment, even if your seminar is presenting a false dichotomy. Your "tentative principle" is not a patchwork; it is a sophisticated version of **Limit Retributivism** (often associated with Norval Morris and Michael Tonry) or what H.L.A. Hart called a **Mixed Theory** (Retributive distribution, Consequentialist aim).

  The reason you feel stuck is that the seminar is likely presenting "Pure Retributivism" (punish *because* they deserve it, regardless of cost) vs. "Pure Consequentialism" (punish *if* it produces good, regardless of desert). Almost no working legal philosopher holds the pure versions anymore.

  Here is a coherent account that captures your intuitions, explains the "work" each principle does, and resolves your specific dilemma about collateral consequences.

  ### The Principle: Negative Retributivism with Consequentialist Optimization

  To make your account coherent, you need to refine the "work" each element does. It is not that blameworthiness is a "switch." It is that blameworthiness sets the **moral boundaries**, and consequences determine the **precise coordinate** within those boundaries.

  1.  **Blameworthiness (The Constraint):** This does the work of **Rights Protection**. It establishes a *range* of permissible punishment (a floor and a ceiling).
      *   *Lower Bound:* You cannot punish the innocent (blameworthiness = 0). You cannot punish the non-culpable (psychosis).
      *   *Upper Bound:* You cannot punish beyond what is proportionate to the culpability, regardless of how much good it would do.
  2.  **Consequences (The Justification):** This does the work of **Resource Allocation**. Within the range permitted by blameworthiness, you select the type and amount of punishment that maximizes social good (deterrence, rehabilitation, incapacitation).

  This explains why the "Innocent Scapegoat" is qualitatively different from the "Low-Level Excessive Deterrence" case.
  *   **Scapegoat:** Violates the *Lower Bound*. It treats a person as a mere means. This is a rights violation.
  *   **Excessive Deterrence:** Violates the *Upper Bound*. It treats a person as more than a means, but still acknowledges them as an agent. It is unjust, but it respects their status as a guilty agent. This explains why it feels "less bad" than the scapegoat case.

  ### Applying the Principle to Your Cases

  *   **Reformed Murderer:** Blameworthiness sets the ceiling. He has already received punishment up to that ceiling. Consequences (deterrence) cannot push the punishment *past* the ceiling. **Verdict: Release.**
  *   **Negligent Drunk Driver:** Blameworthiness sets a range (e.g., 1–3 years). Even if consequences (deterrence) suggest 0 years is efficient, the *censure* function of retributivism requires some hard treatment to validate the victim's worth. Consequences can minimize it to the floor of the range, but not below. **Verdict: Punish (minimum).**
  *   **Psychotic Break:** Blameworthiness = 0. The range of permissible punishment is null. Consequences cannot create a range where none exists. **Verdict: Treatment.**
  *   **Teenager/Medicine:** Blameworthiness is mitigated by necessity/duress. The "range" shifts downward. Consequences (rehabilitation) suggest non-carceral options fit within this lower range. **Verdict: Diversion/Service.**
  *   **Coercive Threat:** Blameworthiness is partial. The range is reduced. **Verdict: Mitigated Punishment.**

  ### The Crucial Case: Collateral Consequences

  This is the case threatening your coherence.
  *The Case:* A guilty person has already suffered life-ruining collateral consequences (job, family, standing lost). A formal sentence would be proportional to the *crime* and would deter future offenses.

  **The Coherent Answer:**
  You must count collateral consequences toward the "debt." If you do not, you are forced to admit that Retributivism is only about *state-inflicted* pain, which is arbitrary.

  If your principle is that punishment must be **proportionate to blameworthiness**, you must ask: *Proportionate in terms of what?*
  *   If it is proportionate in terms of **censure**, the social ostracization may have already communicated the censure more effectively than prison.
  *   If it is proportionate in terms of **hardship**, the "debt" has already been paid to society via the loss of livelihood and status.

  **The Verdict:**
  To maintain coherence with your other intuitions (specifically the Reformed Murderer and the Upper Bound constraint), **you should argue against further formal punishment.**

  **Why?**
  1.  **Total Hardship Theory:** A sophisticated retributivist (like Andrew von Hirsch) argues that proportionality applies to the *total* burden imposed on the offender, not just the state-imposed burden. If the state knows the conviction will ruin their life, and that ruin is equivalent to the prison term, adding prison is *disproportionate*.
  2.  **Diminishing Utility:** If they have lost their job and family, they are already incapacitated from many white-collar or trust-based crimes. The marginal deterrence of adding prison is low compared to the marginal cruelty.
  3.  **The "Double Jeopardy" Intuition:** Your hesitation comes from a sense that demanding *more* suffering when the "bill" is already paid is vindictive, not just.

  ### Which Intuition to Drop?

  You asked: *If the best account forces me to drop one of my verdicts, tell me which one and why.*

  You must drop the intuition that **"a formal sentence would still be proportional to the crime"** in the collateral consequences case.

  **Why?**
  Because "proportionality" is not a fixed metric attached to the crime itself (e.g., "Murder = 20 years"). It is a metric attached to the **offender's total liability**.

  If you hold that formal punishment is still okay in that case, you are implicitly admitting that **Consequences Trump Proportionality.**
  *   If you punish someone who has already suffered equivalent pain *just* to deter others, you are using them as a means.
  *   You are treating their prior suffering as irrelevant "sunk costs" rather than credit toward their moral debt.
  *   This collapses your view into the very Consequentialism you rejected in the Scapegoat case. In the Scapegoat case, you said "No amount of good consequences fixes it." In the Collateral Consequence case, if you punish, you are saying "The good consequences of deterrence fix the fact that they have already suffered enough."

  **The Coherent Position:**
  Adopt **Limit Retributivism with Total Hardship Accounting.**
  1.  **Liability:** Requires culpability (excludes psychosis/innocence).
  2.  **Range:** Determined by the severity of the wrong *and* the total hardship already endured.
  3.  **Selection:** Within that range, choose the sanction that best secures safety/rehabilitation.

  In the collateral consequences case, the "range" of permissible punishment shifts down to zero (or a nominal fine) because the "hardship cap" has been reached via social sanctions. To punish further is not justice; it is gratuitous cruelty.

  ### Seminar Strategy

  When you are in seminar, you can frame this using H.L. Hart's *Punishment and Responsibility*:
  *   **General Justifying Aim:** Consequentialist (protecting society).
  *   **Distribution:** Retributive (only the guilty, and only up to what they deserve).

  Your intuition about the collateral consequences is the cutting edge of this theory. It forces the seminar to admit that "desert" isn't just about the past act, but about the **present moral standing** of the offender relative to the community. If the community has already exacted its pound of flesh through social death, the state has no moral remainder to collect.

  **Recommended Reading to bolster this:**
  *   **H.L. Hart,** *Punishment and Responsibility* (for the Mixed Theory structure).
  *   **Norval Morris,** *The Future of Imprisonment* (for Limit Retributivism).
  *   **Andrew von Hirsch,** *Doing Justice* (for proportionality and censure).
  *   **Dan Markel,** *Against Mercy* (for a counter-view on why collateral consequences shouldn't count, which will help you steelman your opposition).

  Your intuitions are more philosophically mature than the binary presented in your class. Trust the hybrid view, but tighten the definition of "proportionality" to include total hardship.
