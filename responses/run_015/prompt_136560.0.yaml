      *   *The Mechanism:* The spectator feels pity (*pitié*) in the theater. This feels good. It makes them feel virtuous. But because the pity is directed at a fiction, it requires no sacrifice.
      *   *The Result:* The spectator leaves satisfied. They have "paid" their debt to humanity with tears. They are less likely to help real people because they've already exhausted the *sentiment* of virtue without the *labor* of virtue.
