  3.  **Address the "Moral Licensing" vs. "Vicarious Consumption" Question:**
      *   *Moral Licensing:* "I did a good thing (cried at the play), so I can be bad/indifferent later." This implies a transactional economy of virtue.
      *   *Vicarious Consumption:* "I experienced the feeling of goodness, so I don't need the reality." This implies satiety or substitution.
