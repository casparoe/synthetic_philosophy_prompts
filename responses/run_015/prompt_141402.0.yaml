prompt: |-
  I teach one fifty-minute section next week introducing the Frege–Geach problem to second-years who can recite the non-cognitivist package — moral judgments are not beliefs, they are desire-like states that assertion expresses — but who have met none of the responses. Give me a plan for the hour, not an explanation of the problem.

  My half-formed idea is about sequencing. Presentations I have seen all open with the moral modus ponens, and I now think that is a mistake: the conditional is exactly the embedding where the standard reply, states directed at combinations of states, gets its grip most easily, so students conclude they have answered the problem before they have felt it. I want to open with negated and disjoined moral sentences instead — Murder is not wrong, and Either lying is wrong or promise-breaking is — where there is no tidy combination of attitudes for that reply to take hold of, and only then move to the conditional and to inference. Tell me whether that ordering survives scrutiny, what it costs (I worry it lets the problem look like a puzzle about disapproval rather than about validity), and whether I should also drop the usual warm-up of paraphrasing each moral clause into an attitude and watching the argument stop looking valid, which has always struck me as making the whole thing feel like a parlor trick.

  Then: the one example that should carry the hour and what it must have and lack; the misconceptions in the order they will form — I expect the crude boo–hurrah caricature, the idea that expressivists can simply hand over a truth-conditional semantics, and the conflation of this problem with the problem of moral disagreement — each with the point in the sequence where it should be defused; what I need to say about validity before any semantics is on the board; what to decline to get into at this level; and one question for the last five minutes that would show me a student has the problem rather than the slogan.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Second-year undergraduates. They know non-cognitivism (moral judgments = desire-like states, assertion = expression), but no responses to objections.
      *   **Topic:** The Frege-Geach Problem (embedding problem).
      *   **Time:** 50 minutes (one section).
      *   **Constraint:** Do *not* explain the problem (I need to provide a plan, not a lecture transcript).
      *   **Instructor's Idea:** Change the sequencing. Start with negation/disjunction instead of conditionals/modus ponens. Worry: Does this make it look like a puzzle about disapproval rather than validity?
      *   **Instructor's Worry:** Drop the "paraphrase into attitude" warm-up? Feels like a parlor trick.
      *   **Requirements:**
          *   Evaluate the sequencing idea (negation/disjunction first).
          *   Identify costs/risks.
          *   Select *one* carrying example (criteria: what it must have/lack).
          *   Map misconceptions (Boo/Hurrah, truth-conditional surrender, disagreement conflation) to defusion points.
          *   Define validity pre-semantics.
          *   Determine what to exclude.
          *   Provide one final assessment question.

  2.  **Evaluate the Sequencing Idea (Negation/Disjunction First):**
      *   *Pros:* It prevents the "Blackburn/Gibbard solution" (higher-order attitudes) from looking too easy too soon. Conditionals allow for "accepting the antecedent while rejecting the consequent" which maps nicely to complex attitudes. Negation ("It is not the case that stealing is wrong") is harder for expressivists to parse as a unified attitude without invoking truth-conditions.
      *   *Cons/Risks:* The user worries it looks like a puzzle about *disapproval* (semantics of operators) rather than *validity* (logic). This is a real risk. If students focus on "What does 'not wrong' mean?" they miss "Why does this argument work?"
      *   *Verdict:* It's a bold move, but pedagogically sound *if* tied immediately to inference. However, starting with negation might confuse the core issue (logical consistency) with semantic content. The standard Modus Ponens example is the "killer app" because it highlights *validity* specifically.
      *   *Refinement:* Keep the intuition of the user's idea (don't let the conditional solution come too easily) but ensure the focus remains on *logic*, not just *meaning*. Actually, the user's intuition is strong: standard presentations let students think "Oh, complex attitudes solve it" too quickly. Starting with negation forces the "What state is this?" question without the crutch of "If...then".
      *   *Decision:* Support the sequencing change but warn about the validity pivot.

  3.  **The "Parlor Trick" Warm-up:**
      *   The user asks if they should drop the "paraphrase moral clauses into attitudes" warm-up.
      *   *Analysis:* This warm-up (e.g., "Stealing is wrong" -> "Boo stealing!") is useful to establish the *explanandum*. It shows *why* there's a problem. If you skip it, students might not feel the tension.
      *   *Recommendation:* Keep it, but keep it brief. Don't let it linger so it becomes the whole point. Use it to set up the failure of validity.

  4.  **The One Carrying Example:**
      *   Needs to be simple, intuitive, and expose the equivocation.
      *   *Standard:* Stealing is wrong / If stealing is wrong, then... / Therefore...
      *   *Criteria:* Must lack emotional load (so focus is on logic), must be clearly moral, must allow embedding.
      *   *Selection:* Stick to the classic Modus Ponens but use the user's sequencing to introduce the *components* first. Actually, the user wants to avoid opening with Modus Ponens. So, let's use a specific moral claim like "Lying is wrong."
      *   *Refinement:* The example needs to show the *same sentence* in embedded and unembedded contexts. Let's use "Lying is wrong."
      *   *Must have:* Unembedded assertion, negated form, conditional form.
      *   *Must lack:* Complex real-world stakes (distracts from logic), religious/metaphysical baggage.

  5.  **Misconceptions & Defusion Points:**
      *   *1. Crude Boo/Hurrah:* "Expressivists just say 'Boo!'"
          *   *Defusion:* Early. When paraphrasing. Show that assertion is expression, but logic requires consistency.
      *   *2. Truth-Conditional Surrender:* "Can't they just say it's true?"
          *   *Defusion:* Mid-lesson. When discussing negation. If they say "It's true that lying is wrong," they abandon non-cognitivism.
      *   *3. Disagreement Conflation:* "But they can disagree!"
          *   *Defusion:* Late. Distinguish clashing attitudes from logical contradiction.

  6.  **Validity Pre-Semantics:**
      *   Need to define validity without truth conditions.
      *   *Idea:* Validity as "no change of mind" or "inconsistency in attitudes."
      *   *Key:* If you accept premises, you *must* accept conclusion. If non-cognitivism makes the middle term equivocal, you don't have to.

  7.  **What to Exclude:**
      *   Quasi-realism details (Blackburn's specific project).
      *   Gibbard's norm-expressivism technicalities.
      *   Embedding in questions or commands (too much for 50 mins).
      *   Solutions (Barker, Ridge, etc.) - just diagnose the problem.

  8.  **Final Assessment Question:**
      *   Needs to test understanding of the *problem*, not the slogan.
      *   *Idea:* Ask them to construct an argument where the expressivist fails, or explain *why* a specific move fails.
      *   *Draft:* "If an expressivist says 'Lying is wrong' expresses Boo(Lying), what does 'If lying is wrong, then stealing is wrong' express? Why is answering this necessary to explain why Modus Ponens is valid?"

  9.  **Drafting the Plan (Iterative refinement):**
      *   *0-5 mins:* Setup. Non-cognitivism recap. The "Parlor Trick" (keep it, but frame it as "The Challenge").
      *   *5-15 mins:* The User's Sequencing. Negation/Disjunction first. "Lying is not wrong." What attitude is this? Not Boo(Lying). Is it Yay(Lying)? No. This creates the semantic gap.
      *   *15-30 mins:* The Pivot to Validity (Modus Ponens). Now introduce the conditional. Show the equivocation. Premise 1: Boo(Lying). Premise 2: ??? Conclusion: Boo(Stealing). The middle term shifts.
      *   *30-40 mins:* Misconceptions. Address Truth-Conditional surrender (can't just say 'true'). Address Disagreement (clashing attitudes $\neq$ logical inconsistency).
      *   *40-45 mins:* What Validity Means here. Consistency of attitudes.
      *   *45-50 mins:* Final Question.

      *Critique of Draft:* The user specifically asked about the cost of the negation-first approach. I need to address that explicitly in the advice section. The risk is indeed shifting focus from *logic* to *semantics*. I need to ensure the plan forces the logic issue even with negation.
      *Correction:* Use negation to show the *semantic* problem, then immediately pivot to Modus Ponens to show the *logical* consequence of that semantic problem. The negation sets the trap; Modus Ponens springs it.

      *Refining the "One Example":* Let's use "Stealing is wrong." It's classic for a reason.
      *Refining the "Parlor Trick":* The user suspects it makes it feel like a trick. I should advise *modifying* it. Don't just say "Boo." Say "The expressivist says this sentence *functions* to express..." Keep it technical enough to avoid caricature.

      *Refining the Final Question:* Needs to be sharp. "Why can't the expressivist treat the 'wrong' in the antecedent the same way as the 'wrong' in the assertion?"

  10. **Final Polish:** Check against all constraints. 50 minutes. Second-years. No explanation of the problem (provide the plan). Address the sequencing worry. Address the warm-up worry. Map misconceptions. Define validity. Exclude advanced solutions. Final question.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally explain the problem in the plan. The plan must instruct the teacher on *what to do*, not just restate the philosophy. I will structure it as a timeline with pedagogical instructions.

      *Sequencing Verdict:* I will endorse the user's intuition but add a safeguard. Start with negation to block the "complex attitude" easy out, but move to Modus Ponens quickly to ensure the *validity* point lands. The cost is real (semantic focus), but the benefit (blocking premature solution) outweighs it if managed.

      *Warm-up Verdict:* Don't drop it, but tighten it. It's the "Before" picture.

      *Misconception Mapping:*
      1. Boo/Hurrah -> During the initial paraphrase (0-10 mins).
      2. Truth-Conditional Surrender -> During the Negation phase (10-20 mins).
      3. Disagreement -> During the Validity phase (30-40 mins).

      *Validity Definition:* "Guarantee against holding the premises and rejecting the conclusion."

      *Exclusions:* Quasi-realism, specific solutions (Blackburn/Gibbard details), other embeddings (questions).

      *Final Question:* Focus on the equivocation.

