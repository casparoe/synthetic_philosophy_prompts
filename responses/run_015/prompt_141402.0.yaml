answer: |-
  ### 1. Verdict on Your Sequencing and Warm-up

  **The Sequencing (Negation/Disjunction $\rightarrow$ Conditional):**
  This ordering survives scrutiny and is pedagogically superior for this specific cohort.
  *   **Why it works:** You are correct that starting with Modus Ponens allows students to intuitively grasp Blackburn's "higher-order attitude" solution too quickly. They see "If P then Q" and think, "Oh, it's an attitude about attitudes," and the tension dissolves. Starting with negation ("Murder is not wrong") blocks this. There is no obvious "combination of states" for negation. It forces the semantic gap open before you ask them to care about logic.
  *   **The Cost:** Your worry is accurate. It risks framing Frege-Geach as a semantic puzzle ("What does 'not' mean?") rather than a logical one ("Why is this inference valid?").
  *   **The Fix:** You must pivot aggressively. Use negation to establish that the *meaning* of "wrong" shifts between embedded and unembedded contexts. Then, immediately show that if the meaning shifts, the *logic* breaks. Do not linger on the semantics of negation for more than 10 minutes.

  **The Warm-up (Paraphrasing into Attitudes):**
  Do not drop it, but tighten it.
  *   **Why keep it:** Without it, second-years treat moral sentences as normal propositions by habit. You need to make the non-cognitivist commitment explicit to show *why* the embedding is problematic.
  *   **How to avoid the "Parlor Trick":** Do not use "Boo/Hurrah." Use functional descriptions. Instead of "Boo stealing," write "Expresses disapproval of stealing." This prevents the caricature that expressivism is merely emotional outbursts and keeps the focus on the *state of mind* being expressed.

  ---

  ### 2. The One Carrying Example

  **Example:** "Stealing is wrong."
  **Why this one:** It is low-stakes enough to avoid distraction but clearly moral.
  **What it must have:**
  1.  **Unembedded:** "Stealing is wrong."
  2.  **Negated:** "Stealing is not wrong."
  3.  **Conditional:** "If stealing is wrong, then getting your little brother to steal is wrong."
  **What it must lack:**
  1.  **Emotional loading:** Avoid "Murder" or "Torture" initially; high emotion triggers realist intuitions that mask the logical problem.
  2.  **Epistemic modals:** Avoid "Stealing might be wrong." This introduces ambiguity about knowledge vs. truth that muddies the expressivist point.

  ---

  ### 3. The 50-Minute Plan

  **00:00 – 05:00: Recap & The Warm-up (Modified)**
  *   **Action:** Write "Stealing is wrong" on the board. Ask students to state the non-cognitivist analysis.
  *   **Instruction:** Insist they write: *This sentence expresses a desire-like state of disapproval toward stealing.*
  *   **Defusion Point 1 (Boo/Hurrah Caricature):** If a student says "It means 'Boo stealing!'", correct them immediately. "It is not a noise; it is an expression of a conative state. The sentence has no truth conditions."
  *   **Goal:** Establish the baseline. Unembedded moral sentences express non-cognitive states.

  **05:00 – 15:00: The Negation Trap (Your Sequencing)**
  *   **Action:** Write "Stealing is not wrong." Ask: *What desire-like state does this express?*
  *   **Discussion:** It cannot be "Disapproval of stealing" (that's the positive). It cannot be "Approval of stealing" (one can be indifferent).
  *   **Defusion Point 2 (Truth-Conditional Surrender):** A student will suggest: "It means 'It is false that stealing is wrong'."
      *   **Intervention:** Stop here. "If you say it expresses a belief about a fact (truth/falsity), you have abandoned non-cognitivism. You are now a cognitivist. The expressivist must explain this using *attitudes* only."
  *   **Goal:** Show that the expressivist lacks a uniform account of the word "wrong" across contexts.

  **15:00 – 30:00: The Pivot to Validity (Modus Ponens)**
  *   **Action:** Now introduce the conditional to complete the argument.
      1.  Stealing is wrong.
      2.  If stealing is wrong, then getting your little brother to steal is wrong.
      3.  Therefore, getting your little brother to steal is wrong.
  *   **Instruction:** Ask: *Is this argument valid?* (They will say yes). *Why?* (Because of the form).
  *   **The Trap:** Highlight the term "Stealing is wrong." In P1, it expresses Disapproval. In P2 (the antecedent), does it express Disapproval?
      *   If **Yes**: Then P2 expresses a contradiction (Disapproving of stealing while hypothesizing it).
      *   If **No**: Then the term "Stealing is wrong" means something different in P1 and P2.
  *   **Conclusion:** If it means something different, the argument commits the **Fallacy of Equivocation** (like "Banks" of rivers vs. "Banks" for money). If it's equivocation, the argument is invalid. But the argument *is* valid. Therefore, non-cognitivism cannot explain the validity.
  *   **Goal:** Shift focus from "What does 'not' mean?" to "Why does the inference hold?"

  **30:00 – 40:00: Misconceptions & Validity**
  *   **Definition of Validity:** Before discussing solutions, define validity for this context. "An argument is valid if it is inconsistent to accept the premises and reject the conclusion."
  *   **Defusion Point 3 (Disagreement Conflation):** Students will say: "But expressivists can explain disagreement! If I disapprove and you approve, we clash."
      *   **Intervention:** "Clashing attitudes are not logical inconsistency. I can desire coffee and you can desire tea. We clash, but we are not logically contradictory. Frege-Geach is about *logical* inconsistency, not *practical* conflict."
  *   **Goal:** Distinguish psychological conflict from logical validity.

  **40:00 – 45:00: What to Decline (Scope Control)**
  *   **Do Not Cover:**
      *   Specific solutions (Blackburn's quasi-realism, Gibbard's norm-expressivism).
      *   Embedding in questions ("Is stealing wrong?").
      *   The distinction between "expressing" and "stating."
  *   **Reason:** You are diagnosing the disease, not prescribing the cure. Introducing quasi-realism now will convince them the problem is already solved.

  **45:00 – 50:00: Assessment Question**
  *   **Action:** Put this on the board. Give them 3 minutes to write a response.
  *   **The Question:**
      > "An expressivist claims 'Stealing is wrong' expresses disapproval of stealing. If they claim the antecedent in 'If stealing is wrong...' expresses the *same* disapproval, the conditional becomes incoherent. If they claim it expresses a *different* state, the Modus Ponens argument becomes invalid. Explain why the expressivist cannot simply say 'The antecedent expresses a belief that stealing is wrong' to solve this."
  *   **Success Criterion:** A successful answer identifies that appealing to "belief" or "truth" in the antecedent abandons the core non-cognitivist thesis (that moral judgments are not beliefs). It shows they understand the problem is internal to the non-cognitivist package, not just a general semantic puzzle.

  ---

  ### 4. Summary of Pedagogical Risks & Mitigations

  | Risk | Mitigation |
  | :--- | :--- |
  | **Sequencing makes it about semantics, not logic.** | Pivot hard at minute 15. Explicitly state: "The semantic shift causes a logical break." |
  | **Warm-up feels like a caricature.** | Ban "Boo/Hurrah." Use "Expresses a conative state." |
  | **Students think Truth-Conditions solve it.** | Pre-empt this at minute 10. Label it "Abandoning Non-Cognitivism." |
  | **Students conflate logic with disagreement.** | Distinguish "Clashing Desires" vs. "Logical Contradiction" at minute 35. |

  This plan leverages your sequencing insight to prevent premature closure while ensuring the logical stakes (validity) remain the central focus of the hour.
