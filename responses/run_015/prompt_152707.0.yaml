answer: |-
  The refinement of David Lewis's account of convention into a "reflexive convention" is not merely a theoretical nicety; it is a necessary correction that rescues the concept from descriptive emptiness. By requiring second-order common knowledge of mutual accountability recognized as part of the practice itself, this framework successfully distinguishes genuine conventions from mere habits or coercive equilibria. Consequently, this reflexive-Lewisian framework provides the most compelling explanation for the evolution and fragility of democratic norms, specifically peaceful concession and loyal opposition. Democratic stability does not rest on behavioral regularities alone, but on the shared epistemic infrastructure that treats those regularities as mutually binding commitments. When democratic norms collapse, it is not because the coordination game has changed, but because the second-order recognition of accountability has eroded, transforming a convention into a contest of raw power.

  To understand why the reflexive condition is essential, one must first see why Lewis's original formulation falls short in the political realm. In Lewis's original model, a convention is a solution to a coordination problem sustained by common knowledge of mutual expectations. I drive on the right because I expect you to, and you expect me to. However, as critics note, this looks identical to a habit (I drive on the right because I always have) or coercion (I drive on the right because the state punishes left-driving). In all three cases, the behavioral equilibrium is identical. The reflexive refinement breaks this deadlock by introducing a normative layer: participants must know that they are *accountable* to one another for conforming, and that this accountability is part of the deal.

  In the context of democratic norms, this distinction is vital. A habit of concession is fragile because it relies on inertia; if a candidate loses and concedes out of habit, a single shock can break the pattern. A coercive concession is stable only as long as the threat holds; if the army fractures, the concession vanishes. But a *reflexive convention* of concession is robust in a specific way: it is sustained by the mutual understanding that conceding is what members of the democratic community *owe* each other. When a loser concedes, they are not just clearing the stage; they are ratifying the authority of the process. When the winner accepts the opposition, they are acknowledging the opponent's standing as a legitimate rival, not an enemy. This second-order knowledge—that we hold each other to this standard—constitutes the norm. Without it, there is no "loyal opposition," only a temporary ceasefire.

  This framework explains the specific nature of democratic fragility. Democratic norms do not typically collapse because the coordination incentives vanish; the costs of civil war usually remain high enough to make peace the rational equilibrium. Instead, they collapse when the second-order common knowledge of accountability dissolves. This occurs when political actors begin to treat the norm as a weapon rather than a bond. For example, if Party A refuses to concede, claiming the election was rigged, they are not merely breaking a rule; they are denying the mutual authority that underpins the accountability structure. They are asserting that they are not answerable to the shared standard. If Party B responds by abandoning restraint in the name of "saving democracy," they too erode the second-order knowledge, signaling that the norm is optional based on outcomes. The collapse is epistemic before it is behavioral: the shared understanding that "we are mutually accountable" fractures into "I am accountable only if you are," which quickly degrades into "I am accountable to no one."

  The strongest counter-argument against this reflexive-Lewisian position is the objection of epistemic overload. Critics might argue that real-world political actors rarely possess second-order common knowledge of anything, let alone complex accountability structures. Politicians are strategic, often cynical, and operate under bounded rationality. To claim that peaceful concession requires a shared philosophical recognition of mutual accountability imposes an intellectual demand that no actual democracy meets. If the theory requires actors to explicitly contemplate their accountability, the distinction is theoretically neat but practically empty; most functioning democracies would, by this definition, lack conventions entirely, rendering the framework useless for diagnosing real-world stability.

  However, this objection misunderstands the nature of common knowledge in social practice. Second-order knowledge does not require explicit philosophical contemplation or verbalized contracts; it is embodied in *reactive attitudes* and public discourse. When a politician violates a norm and is met with bipartisan condemnation not just for the act, but for "breaking the rules of the game," that social sanction *is* the manifestation of second-order common knowledge. The knowledge is distributed across the practice itself. When a senator says, "That is not how we do things here," they are invoking the reflexive condition. They are signaling that the regularity is maintained by mutual expectation of accountability. If the epistemic demand were truly too high, we would not see the specific rhetorical patterns of norm violation we observe today. We would see simple power grabs. Instead, we see actors desperately trying to justify their violations *within* the language of the norm (e.g., claiming fraud to justify non-concession), which proves they recognize the accountability structure even as they try to evade it. The very struggle to justify the breach confirms the existence of the reflexive convention.

  Therefore, the reflexive condition is not an unrealistic idealization but a diagnostic tool. It explains why democratic backsliding is often preceded by a war of words regarding legitimacy and procedure before any violence occurs. The erosion of the second-order knowledge—the loss of the shared belief that we are mutually bound—precedes the behavioral collapse. By adopting this refined framework, we understand that preserving democracy requires more than ensuring the right incentives (coercion) or relying on tradition (habit). It requires the active maintenance of the epistemic common ground where actors recognize each other as mutually accountable agents. When that recognition fades, the convention dissolves, and the coordination game reverts to a struggle for dominance. The reflexive-Lewisian view thus captures the essence of democratic fragility: it is the fragility of a shared mind, not just a shared road.
