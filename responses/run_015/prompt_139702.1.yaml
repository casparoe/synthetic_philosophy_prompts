answer: |-
  This mapping treats your argument as a sophisticated **Evolutionary/Sociological Debunking Argument (EDA)**. By stipulating that moral variation is predictably constrained by social-ecological parameters and that the "moral space" occupied is low-dimensional, you have insulated the argument against the charge that morality is "anything-goes" random noise. However, this insulation creates specific vulnerabilities.

  Here is the exposure map of your argument, structured by your four questions and the final challenge.

  ### 1. Does the stipulated convergence help the debunker or the realist?

  **Verdict:** Given your stipulations, the convergence helps the **debunker**.

  **The Decision:** The decision turns on the **explanatory sufficiency of the non-moral parameters**.
  *   **The Realist Reading:** Independent cultures landing in one low-dimensional region looks like "independent inquirers homing in on a single target." This reading requires that the *moral facts* constrain the viable region.
  *   **The Debunker Reading:** Independent cultures landing in one low-dimensional region looks like "functional constraints on social viability." This reading requires that *survival/cooperation* constraints constrain the viable region.

  **Why the Debunker Wins Here:** Your stipulation states that once you condition on social-ecological parameters (pathogen load, market integration, etc.), residual differences are small. This means the *location* of the society in that low-dimensional moral region is **predicted by non-moral facts**.
  If the position of a society in moral space is fully explainable by its ecological niche, the "target" they are homing in on is **social stability**, not moral truth. The convergence is evidence of **convergent evolution**, not convergent discovery. For the realist to claim this convergence supports truth, they must show that the ecological parameters *track* the moral facts, which reintroduces the burden you assigned them: why think the ecologically optimal solution is the morally true one?

  ### 2. Is the weight-versus-content distinction load-bearing?

  **Verdict:** The distinction **merely relocates** the debate; the invariant core does **not** do realist work for free.

  **Analysis:**
  *   **The Realist Hope:** The invariant set of considerations (e.g., harm, fairness, loyalty) represents a universal "Moral Grammar" or access to objective facts. The variation in weights is merely contextual specification.
  *   **The Debunker Counter:** The invariant set of considerations represents a **Universal Human Ecology**. All humans have bodies that feel pain, require cooperation, and live in kin groups. Therefore, all moral systems *must* address harm and fairness to function.

  **Why it doesn't help the Realist:**
  The genealogical argument explains the invariant core just as well as the variation.
  1.  **Invariant Core:** Explained by species-typical biological and psychological constraints (all humans have similar "ecological" baselines).
  2.  **Variable Weights/Boundaries:** Explained by local ecological tuning (high pathogen load requires tighter boundaries; high market integration requires impersonal fairness).

  The distinction is not load-bearing for the realist because the genealogical model absorbs the invariance. The "invariant core" is not a footprint of moral truth; it is a footprint of human nature. The debunking argument remains strong because it explains *both* the constants and the variables via non-moral causes.

  ### 3. Which defeaters would defenders of this argument themselves concede?

  Here is the ranking of defeaters from the perspective of a committed defender of your genealogical view.

  **Rank 1: Fatal (The Argument Collapses)**
  *   **Predictive Failure of Ecological Parameters:** If new data shows that pathogen load, market integration, etc., *fail* to predict moral weights and boundaries across a broad sample, the core premise ("predictably related to non-moral features") is false. The variation becomes noise, and noise allows room for truth-tracking to be the explanation.
  *   **Evidence of Ecological Resistance:** If societies are observed to adopt moral norms that are *maladaptive* for their specific ecology (e.g., a high-pathogen society adopting low-boundary, universalist norms *without* collapsing, driven explicitly by moral reasoning), this suggests moral facts can override ecological pressure. Your argument relies on ecology driving the moral; if morals drive against ecology successfully, the genealogy is incomplete.

  **Rank 2: Awkward (Requires Ad Hoc Adjustment)**
  *   **Convergence Despite Divergent Ecology:** If two societies with radically different ecological parameters (e.g., high pathogen/low market vs. low pathogen/high market) converge on the *same* moral weights and boundaries, the genealogical link is weakened. The defender must posit a hidden, unmeasured ecological variable, which risks looking like a "save the phenomenon" maneuver.
  *   **Reflective Equilibrium Stability:** If individuals, when stripped of ecological pressure (e.g., in thought experiments or idealized conditions), converge on moral principles that *differ* from their ecologically-derived norms. This suggests a "true" moral capacity hidden beneath the ecological adaptation.

  **Rank 3: Dismissible (The Defender Rejects These)**
  *   **The Phenomenology of Objectivity:** The claim that "moral facts feel real, therefore they are." The defender dismisses this as part of the adaptive illusion (error theory explains why we feel objectivity—it promotes commitment).
  *   **Pragmatic Indispensability:** The claim that "we need realism to make morality work." The defender argues that functional morality works fine as a shared fiction; truth is not required for utility.
  *   **Peer Disagreement among Philosophers:** The fact that realists disagree with debunkers. The defender views this as evidence of the lack of convergence, not a reason to trust the realist intuition.

  ### 4. Has the position been insulated to the point of unfalsifiability?

  **Verdict:** It is **falsifiable**, provided you hold firm to the "small number of parameters" stipulation.

  **The Defect vs. Cost:**
  *   **The Risk:** If "social-ecological parameters" becomes a catch-all term where any failed prediction is met with "we just haven't measured the right ecological variable yet," the theory is unfalsifiable. This would be a **defect**.
  *   **The Stipulated Safety:** You stipulated "a small number of... parameters." If you list them (Pathogen, Market, Kinship, Anonymity) and fix them, the theory is falsifiable. If a society fits the ecological profile of Group A but the moral profile of Group B, the theory fails.
  *   **Abductive Context:** In an abductive argument (Inference to the Best Explanation), some insulation is an **acceptable cost**. You are arguing that your explanation is *better* than realism, not that it is logically airtight against all conceivable data. However, if the "residuals" (the small differences left over) are consistently explained away by new variables without independent justification, the argument degrades into a just-so story.
  *   **Constraint:** To remain falsifiable, the defender must commit to *not* adding new ecological variables unless they are measurable independently of the moral outcome they are supposed to explain.

  ### Finally: The Realist's Positive Burden and Observational Equivalence

  **What the Realist Must Show:**
  To turn this from a standoff into a win, the realist must demonstrate **Ecological Independence**.
  They need to show an observable difference between:
  1.  **World A (Genealogy Only):** Moral beliefs track ecological fitness perfectly.
  2.  **World B (Realism + Genealogy):** Moral beliefs track ecological fitness *except* where moral truth diverges from fitness.

  **The Observable Difference:**
  The realist needs cases of **Moral Progress Against Ecological Grain**.
  *   *Example:* A society shifts its moral boundaries (e.g., expands the moral circle) *without* a corresponding shift in ecology (pathogen load, market, etc.), driven instead by moral argumentation, and the society *thrives* or at least does not collapse.
  *   *Why:* If genealogy is the whole story, moral change should be locked to ecological change. If realism is true, moral truth can be recognized even when ecology doesn't demand it.

  **If There Is No Such Difference:**
  If the predictions of the genealogical model and the realist model are observationally equivalent (i.e., moral truth always aligns perfectly with ecological fitness), then:
  1.  **Metaphysical Idleness:** The "moral facts" become epiphenomenal. They do no explanatory work.
  2.  **Parsimony Victory:** The genealogical view wins by Ockham's Razor. It explains the data without positing invisible moral facts.

  **What Follows for You:**
  If there is no observable difference, you cannot claim to have *proven* moral facts don't exist. You can only claim that **positing them is explanatorily redundant.**
  *   **Your Position:** You hold an **Error Theory** based on parsimony, not empirical disproof.
  *   **The Cost:** You must concede that the realist is not *wrong* about the world (since the world looks the same either way), but rather *unnecessary*.
  *   **The Exposure:** Your argument is vulnerable to the claim that you are defining "explanation" in a way that excludes normative facts by fiat. If the realist argues that moral facts *supervene* on ecological facts, they can agree with all your data while maintaining realism. To defeat this, you must argue that the *direction of explanation* runs from Ecology → Morality, not Moral Facts → Ecology. If you cannot distinguish the direction of explanation empirically, your view remains a metaphysical preference for naturalism, not a empirical conclusion.
