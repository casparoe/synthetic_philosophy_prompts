          *   *Verdict:* The analogy works for incommensurability (orthogonality) but needs an extra rule for lexicality (asymmetry).
      *   *Drafting Section 4 (Conclusion):* Summarize. The reasoning is sound but conflates "no common scale" with "one scale dominates."

