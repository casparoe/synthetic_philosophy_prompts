answer: |-
  **1. Pratyakṣa (Perception): 9**
  Within the Nyāya framework, *pratyakṣa* possesses the highest error-correction resilience because its validation mechanism is intrinsic to the act of sensing itself. Erroneous perception (*viparyaya*) arises from specific defects (*doṣa*) in the sense organs, the mind, or external conditions like distance and lighting. A community of inquirers can rectify a false deliverance simply by removing these impediments and engaging in a subsequent, veridical perceptual act (*yathārtha-anubhava*) of the same object. Since this correction relies on improved sense-object contact (*indriyārtha-sannikarṣa*) rather than invoking inference or testimony, it satisfies the constraint of non-circularity. The directness of the source allows for immediate intersubjective verification among observers sharing the same perceptual field, making it the most self-correcting of the four sources.

  **2. Anumāna (Inference): 6**
  *Anumāna* holds moderate resilience due to its rigorous internal logical structure, though it is vulnerable regarding its material premises. The Nyāya system codifies five types of pseudo-probans (*hetvābhāsa*), allowing a community to identify formal errors in reasoning without leaving the inferential framework. Furthermore, hypothetical reasoning (*tarka*) is employed to secure invariable concomitance (*vyāpti*) by ruling out contrary possibilities, offering a buffer when direct observation is unavailable. However, because the truth of the *vyāpti* ultimately rests on repeated perceptual observation (*bhūyo-darśana*), the capacity to rectify a false inference is constrained if perception is excluded as a corrective tool. The logical form is self-correcting, but the material content is not.

  **3. Śabda (Testimony): 4**
  *Śabda* scores lower because its validity hinges on the trustworthiness (*āptatva*) of the speaker, a condition that cannot be verified internally without relying on other sources. While the Nyāya school establishes internal linguistic conditions for valid testimony—such as semantic compatibility (*yogyatā*) and syntactic expectancy (*ākāṅkṣā*)—these only ensure the statement is meaningful, not that it is true. A false deliverance from a seemingly competent speaker cannot be rectified solely by analyzing the language or consulting other testimony, as this risks circularity. Identifying a lie or error requires checking the content against reality or the speaker's history, processes that inherently demand perception or inference.

  **4. Upamāna (Comparison): 2**
  *Upamāna* demonstrates the least resilience under this specific constraint because it is heavily dependent on memory (*smṛti*), which Nyāya explicitly classifies as not a *pramāṇa*. Knowledge here arises from recalling a similarity (*sādṛśya*) between a described object and a perceived one. If the deliverance is false, it is typically due to a failure in remembering the similarity correctly or misidentifying the object. Rectifying this error requires re-observing the objects to verify the similarity or re-consulting the original description, both of which rely on perception or testimony. There are few internal mechanisms within comparison itself to validate the accuracy of the remembered similarity without appealing to these other sources.
