  ### Addendum: Detailed Breakdown of the "Hybrid" Hypothesis

  *(Note to Advisor: I'm including this section to clarify the philosophical stakes without cluttering the main proposal text. This is for your eyes to show I've thought through the meta-ethics.)*

  To ensure we are on the same page about what I mean by "Hybrid," here is the specific philosophical distinction I am tracking:

  **1. Evolutionary Functionalism (The "Is")**
  *   **Claim:** Moral behaviors exist because they confer a survival advantage to the group.
  *   **Mechanism:** Natural Selection / Group Selection.
  *   **Normative Status:** Instrumental. You should be moral because it helps the species survive.
  *   **Darwinian Text:** "The social instincts... are the prime principle of man's moral constitution."

  **2. Aesthetic/Deontic Normativity (The "Ought")**
  *   **Claim:** Moral obligations bind the individual regardless of consequence.
  *   **Mechanism:** Social Approval, Memory, Conscience.
  *   **Normative Status:** Intrinsic. You should be moral because it is "noble" or because ignoring it causes "mental misery."
  *   **Darwinian Text:** "The highest moral merit... is self-sacrifice." "The loss of the instinct... would be irreparable."

  **The Tension:**
  Functionalism cannot easily explain self-sacrifice that leads to death (the ultimate survival negative). Darwin solves this by invoking the "enduring nature" of social instincts and the "memory" of past actions. But in doing so, he shifts from talking about *survival* to talking about *psychological satisfaction* and *honor*.

  My argument is that Darwin treats this psychological satisfaction not just as a motivator (a carrot), but as a validator (a stamp of truth). He implies that because the moral sense *feels* authoritative, it *is* authoritative, even if it kills you. That is a deontic move disguised as a psychological observation.

  **Why This Matters for the Proposal:**
  If I can show that Darwin makes this move explicitly, I prove the hybrid. If he treats the feeling of duty as just another survival trick, I disprove it. This distinction gives me a clear binary to test during the close reading.

