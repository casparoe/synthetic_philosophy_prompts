prompt: |-
  I'm drafting a proposal for my dept’s one-semester independent-study grant (around 4,000 words, due next month) and I need you to turn my half-formed hunch into something I could actually submit. The hunch: everyone treats Darwin’s Descent of Man as either a flat evolutionary reduction of morality to social instinct, or as Victorian moralism dressed up in science. I think there’s a seperate, weirder layer. In the chapters on sexual selection Darwin treats moral beauty and communal obligation as having normative weight that doesn’t reduce cleanly to survival value, and in his private writings on religion he seems to treat moral obligation as retaining force even without supernatural backing. So here’s the question I want to ask precisely: does Darwin’s account of morality contain an implicit, unstable meta-ethical hybrid—part evolutionary functionalism, part aesthetic or deontic normativity—that explains why he sounds like a utilitarian in one passage and almost Kantian about duty to the group in another?

  Write this up as a real proposal. I want: (a) the research question stated so it has a determinate answer, (b) why the standard adaptationist and cultural-evolution readings leave this specific tension open, (c) the actual method—what I’d do month by month or week by week (close reading of specific chapters in Descent, comparing them with the logic of selection in Origin, checking consistency with his letters and notebooks on religious belief without treating them as authoritative), (d) what a result would look like and what would count as failure (e.g., if the tension dissolves into plain contradiction with no structural pattern, that’s failure; if I can map the two logics onto different domains—individual versus group selection—that’s success), and (e) an honest scope check—why this is doable in one semester and what I’d cut if time runs short. No bibliography or citation list please, I’ll add those. And keep it casual—this is just a draft for my advisor.
