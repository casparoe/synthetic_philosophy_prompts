answer: |-
  The experiment of National Prohibition in the United States offers a stark, empirical test case for Jon Elster's theory of constitutional precommitment. In *Ulysses and the Sirens* and subsequent works, Elster conceptualizes constitutional constraints as a democratic polity binding its future self against transient passions or irrational impulses, much like Ulysses binding himself to the mast to resist the Sirens' song. The Eighteenth Amendment (1919) and its swift repeal via the Twenty-First Amendment (1933) complicate this metaphor. The episode reveals that while the *mechanics* of constitutional precommitment functioned as designed, the *ontological* assumptions required for a stable Ulysses contract—specifically the continuity of the agent and the nature of preference change—collapsed under the weight of democratic reality.

  ### I. Mapping the Elsterian Analogy

  To analyze Prohibition through Elster's framework, we must identify the agents and constraints within the institutional setting.

  **Ulysses:** In this context, Ulysses is not a single individual but the "sober" polity of the Progressive Era, specifically the coalition of the Anti-Saloon League, rural Protestants, and reformist legislators who ratified the Eighteenth Amendment. This agent viewed alcohol consumption as a threat to long-term rational governance, economic productivity, and social order. They acted in a moment of "cold" rationality (or moral conviction) to restrict future "hot" impulses.

  **The Sirens:** The Sirens correspond to the temptation of alcohol consumption. However, in a collective action problem, the Sirens are not merely internal cravings but externalized social pressures: the culture of the saloon, the immediate gratification of drink, and the political pressure from urban populations and immigrant communities who viewed prohibition as an infringement on liberty.

  **The Mast and Ropes:** The constitutional text of the Eighteenth Amendment and the enabling Volstead Act serve as the mast and ropes. By elevating the ban to the constitutional level, the framers raised the transaction costs of reversal. Ordinary legislation could not undo the ban; it required the arduous Article V amendment process. This was intended to insulate the policy from the fluctuating whims of Congress and the momentary passions of the electorate.

  ### II. The Twenty-First Amendment: Meta-Precommitment or Dismantling?

  The most distinct feature of the repeal was the method of ratification. Article V provides two modes for ratifying amendments: by state legislatures or by state conventions. The Eighteenth Amendment used legislatures; the Twenty-First used conventions.

  Is this mechanism a **meta-precommitment** or the **dismantling of the ropes**?

  If viewed as a meta-precommitment, the availability of the convention option in Article V represents a standing rule established by the Founders (the original Ulysses) regarding how future precommitments may be undone. It acknowledges that certain constitutional bindings may require a more direct appeal to popular sovereignty to be legitimately reversed. However, in 1933, the choice of conventions was not an automatic trigger but a deliberate strategic decision by Congress.

  It is more accurate to view the convention mechanism not as a pre-set unlocking code, but as a **recalibration of democratic legitimacy**. By 1933, state legislatures were severely malapportioned, with rural dry interests holding veto power over urban wet majorities. The "ropes" of the Eighteenth Amendment were holding not because the current "Ulysses" (the 1933 electorate) desired sobriety, but because the institutional structure no longer represented the agent's will.

  Therefore, the convention procedure was not merely dismantling the ropes; it was an admission that the original binding had lost its legitimacy. It served as a safety valve. In Elsterian terms, a Ulysses contract is only rational if the future self retains the capacity to consent to the binding. When the institutional ropes (legislatures) prevented the future self from expressing its changed preference, the convention method restored the agency of the "current self." It preserved the *framework* of precommitment (constitutionalism) while sacrificing the specific *content* (Prohibition) to maintain systemic stability.

  ### III. Elster's Conditions and the Fourteen-Year Lifespan

  Elster argues that rational precommitment requires specific conditions: the agent must remain essentially the same over time, and the restraint must protect against temporary, irrational deviations rather than permanent preference shifts. The fourteen-year lifespan of Prohibition highlights a failure on both counts.

  **1. Intertemporal Continuity of the Agent:**
  Elster's model assumes that Future-Ulysses is the same entity as Past-Ulysses, merely susceptible to weakness. In a democracy, the "agent" is the citizenry. Between 1919 and 1933, the American polity underwent massive demographic and cultural shifts (urbanization, the Great Migration, the aging of the Dry coalition). The 1933 ratifiers were not the "weak" version of the 1919 ratifiers; they were, in many respects, a *different people* with a different preference ordering. The precommitment failed because the "self" that was bound did not exist in the same form when the binding was tested.

  **2. Overwhelming Present Desire:**
  For Elster, the Sirens represent a lapse in rationality. However, the demand for alcohol in the 1920s was not necessarily an irrational lapse; it was a sustained preference for a different social order. The "overwhelming present desire" was not a momentary craving but a structural opposition to the moral vision of the Progressives. When the "temptation" is actually a competing, stable conception of the good life, constitutional precommitment transforms from self-binding into intergenerational oppression. The rapid reversal suggests that the Eighteenth Amendment attempted to bind the polity against a preference shift that was too profound to be treated as mere "weakness of will."

  ### IV. Theoretical Implications: Self-Defeating or Legitimacy-Saving?

  Does this rapid reversal demonstrate that constitutional Ulysses contracts are structurally self-defeating whenever the restrained preference is widely distributed?

  If a constitution binds a preference that is held by a significant majority (or a geographically concentrated minority with outsized power), the "ropes" create friction. If the preference is widely distributed (as the desire for alcohol proved to be), the cost of enforcement rises until the system breaks. In this sense, yes, the contract is self-defeating: it provokes a backlash (organized crime, corruption, disrespect for law) that accelerates the desire for repeal.

  However, the convention procedure rescues the framework. It suggests that constitutional precommitment in a democracy cannot be absolute. It must be **revocable by a super-majoritarian expression of the current will.** This preserves democratic legitimacy. If the 21st Amendment had been impossible to pass due to legislative malapportionment, the result might have been civil disobedience on a scale that threatened the constitutional order itself. By allowing the ropes to be cut via a specialized mechanism, the system acknowledged that the "dead hand" of the past cannot indefinitely rule the living.

  ### V. The Breakdown of the Analogy: Individual vs. Collective Agency

  Ultimately, the Prohibition episode exposes where the analogy between an individual binding their future self and a polity binding its successors breaks down.

  **1. Intergenerational Legitimacy:**
  An individual has a continuous consciousness; I am the same person at 80 that I was at 20. A polity does not. The 1919 ratifiers and the 1933 ratifiers are distinct generations. When an individual binds themselves, they suffer the consequences of their restraint. When a generation binds its successors, the successors suffer the consequences of a choice they did not make. The 1933 electorate was being governed by the "dead hand" of 1919. Elster's framework struggles to account for this **heteronomy**. In the individual case, autonomy is preserved through time; in the collective case, autonomy is violated across time unless a mechanism for revision (like the 21st Amendment) exists.

  **2. Collective Agency and Preference Aggregation:**
  "Ulysses" implies a unitary agent. The American polity in 1919 was not unitary; it was a coalition of factions. The "will" to prohibit was a majority (or plurality) victory, not a unanimous consensus. Therefore, the "binding" was actually one faction binding another. When the demographic balance shifted, the "agent" didn't just change its mind; the *composition* of the agent changed. Elster's model of rational choice assumes a stable preference function for the agent. In politics, the agent's preference function is endogenous to the composition of the electorate.

  **3. The Nature of the "Self":**
  Finally, the analogy breaks down regarding the locus of the "Self." For an individual, the "rational self" binding the "passionate self" is an internal dialogue. In the 18th Amendment, the "rational self" (rural, Protestant, dry) was imposing its rationality on the "passionate self" (urban, immigrant, wet). This was not self-binding; it was **group-binding**. The repeal was not the individual Ulysses realizing he made a mistake; it was the Sirens overpowering the sailors.

  ### Conclusion

  The Eighteenth and Twenty-First Amendments illustrate that constitutional precommitment is viable only when the "self" remains sufficiently stable over time to recognize the binding as legitimate. Prohibition failed as a Ulysses contract because the polity's preferences underwent a structural shift that rendered the original binding oppressive rather than protective. However, the use of state conventions for repeal demonstrates a sophisticated institutional learning. It acknowledges that while a democracy may bind itself against transient passions, it must retain the capacity to unbind itself when the "self" fundamentally changes. The analogy of Ulysses holds for the *procedure* of raising costs against impulse, but it fails to capture the *political reality* that in a democracy, the "Ulysses" of today may be the "Siren" of tomorrow, and the legitimacy of the mast depends on the consent of those currently tied to it.
