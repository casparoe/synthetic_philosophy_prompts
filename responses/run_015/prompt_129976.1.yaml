      *   **Leo's Stance:** *Anatta* denies owner, not continuity. Person = conventional designation for causal stream. Responsibility attaches to stream. Karma = causal conditioning, not retributive identity. Ethics = therapeutic/forward-looking. Conventional self has practical reality.
      *   **Key Tensions:**
