answer: |-
  1. The theory must distinguish between outperforming a rival on a specific distribution, dominating all rivals across a defined class, and remaining unexploitable in the worst case, for conflating these obscures the strength of the vindication offered. This is non-negotiable given the NFL results, though favouring the strongest grade is a preference of the risk-averse camp.

  2. It must locate the placement problem by separating the proof that a bias suits a class from the empirical argument that the world belongs to that class, rather than dissolving the gap via metaphysical fiat. This requirement is non-negotiable for empirical adequacy, yet it flags incompatibility with any desideratum demanding absolute certainty without external input.

  3. The specification must differentiate between an environment indifferent to the bias, one that merely fails to accommodate it, and one chosen by an adversary who inspects and selects against the bias. This is non-negotiable for security contexts, but treating adversarial cases as primary is a preference of the game-theoretic camp.

  4. It must advise a bounded agent on fixing a bias in advance while specifying whether a second-order rule for switching biases on track record counts as a new bias or a solution to the original problem. This is non-negotiable for practical application, though privileging static biases over dynamic switching is a preference of the foundationalist camp.

  *5. The theory must not help itself to induction when recommending induction unless it acknowledges the encoding-relativity of simplicity that makes such circularity vicious or virtuous. This is the asterisked requirement doing the most work, non-negotiable for coherence, and it flags incompatibility with Desideratum 4 if fixing a bias presupposes an encoding-invariant simplicity.
