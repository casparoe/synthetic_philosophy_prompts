answer: |-
  This combination of policies presupposes a **Layered Stakeholder Theory of Membership**, hybridized with **Civic Republicanism**. It rejects the idea that political membership is a binary (in/out) status based solely on nationality. Instead, it treats membership as a gradient determined by three distinct axes: **sovereignty** (national vs. local), **residency** (duration and presence), and **capacity** (age/development).

  Here is the reconstruction of the implicit view, an assessment of its consistency, and the counterfactual of a pure affected-interests model.

  ### 1. Bundle vs. Affectedness: The "Unbundled Citizenship" Model
  The system does not treat citizenship as a monolithic block, nor does it fully embrace the "all-affected principle." Instead, it treats citizenship as a **bundle of rights and duties that can be unbundled by jurisdiction.**

  *   **National Level (The Sovereign Bundle):** Here, the theory is **Civic Republican**. Citizenship is a formal legal status carrying a *duty* to participate (compulsory voting). Non-citizens are excluded because national voting implicates sovereignty, identity, and the composition of the state itself, which is reserved for the formal "people."
  *   **Local Level (The Stakeholder Bundle):** Here, the theory shifts to **Residency-Based Affectedness**. By allowing non-citizens to vote locally after five years, the state acknowledges that local governance is administrative rather than sovereign. If you are affected by the trash collection, zoning, and schools, you have a "stake" sufficient for voting rights, even without the "citizen" label.
  *   **Age Level (The Capacity Bundle):** The teen "half-vote" on advisory boards introduces a **Competence Gradient**. It suggests that political agency is not a switch that flips at 18, but a dimmer switch.

  **Verdict:** It treats citizenship as a **bundle** that can be split. You can have the "local stake" bundle without the "national sovereignty" bundle. You can have the "voice" bundle without the "full weight" bundle. Affectedness is enough for *partial* standing (local voting), but full standing requires formal membership (citizenship).

  ### 2. The Teen/Elderly Inconsistency
  The logic applied to teenagers is **developmental paternalism**: political weight is correlated with the acquisition of rational capacity. The inconsistency regarding the elderly arises from a conflict between **biological reality** and **legal status**.

  *   **The Implicit Logic for Teens:** Minors are legally incapacitated in most spheres (contracts, medical decisions). The "half-vote" mirrors this civil status. It assumes capacity is *accumulating*.
  *   **The Exclusion of the Elderly:** If the logic were truly about *actual* rational capacity, voting weight should arguably decline with cognitive senescence. The system does not do this because it relies on **presumptive competence**, not tested competence.
      *   Once you reach the "age of majority," the law presumes you are a rational agent forever, unless a court specifically removes your rights (guardianship).
      *   To apply the teen logic to the elderly would require universal cognitive testing, which violates norms of dignity and equality.
  *   **The Inconsistency:** The system is **philosophically inconsistent but legally consistent.** It uses "capacity" to justify limiting youth, but uses "equality/dignity" to protect the elderly. It treats the *onset* of capacity as a gradual climb (justifying partial rights) but the *loss* of capacity as an exception (justifying full rights until revoked).

  ### 3. Reconstruction of the Implicit View
  The Belgian model described presupposes a **Functionalist Hierarchy of Membership**:

  1.  **The Duty of Membership:** For full citizens, voting is not just a right but a civic obligation necessary for the legitimacy of the republic (Compulsory Voting).
  2.  **The Sphere of Impact:** Political rights are calibrated to the sphere of impact. Local impact $\rightarrow$ Local vote (open to residents). National impact $\rightarrow$ National vote (closed to citizens).
  3.  **The Gradation of Agency:** Political voice is calibrated to legal maturity. Minors are "members in training." They are affected by rules, so they get a voice, but they lack full legal agency, so the voice is weighted less (advisory/half-vote).

  **Is it Consistent?**
  *   **Internally:** No. It mixes three different justifications for voting: **Duty** (citizens), **Interest** (residents), and **Capacity** (teens).
      *   If voting is a *duty* (citizens), why is it optional for residents?
      *   If voting is based on *capacity* (teens), why is it not reduced for the cognitively impaired elderly?
      *   If voting is based on *affectedness* (residents), why are non-citizens unaffected by national laws (taxes, war, healthcare)?
  *   **Pragmatically:** Yes. It balances the need for social cohesion (citizen duty) with the reality of migration (local integration) and the need for youth engagement without destabilizing the electorate.

  ### 4. Switching to a Pure Affected-Interests Model
  If you replaced this hybrid system with a **Pure All-Affected Interests Model**, the political landscape would change radically. The core principle would shift from "Who belongs?" to "Who is impacted?"

  **Required Changes:**
  1.  **Abolition of Citizenship Voting Distinctions:** Non-citizens would vote in **national** elections. Since national laws (tax, war, environment) affect long-term residents as much as citizens, the "local only" restriction would vanish.
  2.  **End of Compulsory Voting:** In a pure affected-interests model, voting is a right derived from interest, not a duty of membership. You cannot be forced to exercise a right based on how much you are affected.
  3.  **Fluid Electoral Boundaries:** Constituencies would likely become functional rather than geographic. A commuter affected by a city's transit policy might vote in that city's election even if they live outside the borders.
  4.  **Teen Voting:** A pure affected-interests model would likely grant teens **full votes**, not half-votes. If a law affects a 16-year-old's education or environment as much as an adult's, their interest is equal. The "capacity" argument is irrelevant to *interest*; a person can be deeply affected by a policy even if they lack full rational maturity.
  5.  **No Elderly Reduction:** Consistent with the teen change, the elderly would retain full votes, but not because of "presumed competence." They would retain them because they remain affected subjects.
  6.  **Transient Inclusion:** Tourists or short-term residents might gain voting rights in specific referendums if a decision (e.g., a pollution event, a transit strike) acutely affected them during their stay.

  **Summary:** The current Belgian model tries to have it both ways: preserving the exclusivity of the nation-state while accommodating the reality of migration and youth development. A pure affected-interests model would dissolve the nation-state's monopoly on political legitimacy, turning voting into a fluid transaction based on consequence rather than a fixed status based on belonging.
