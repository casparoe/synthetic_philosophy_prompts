      *   **Questions to Answer:**
          1.  What theory of political membership does this combination presuppose?
          2.  Does it treat citizenship as a bundle of split rights, or is affectedness enough for partial standing?
          3.  Why does the "developing rational capacity" logic for teens not apply to the elderly (decline)?
          4.  Reconstruct the implicit view.
          5.  Assess consistency.
          6.  Explain what would change under a pure "affected-interests" model.

  2.  **Analyze the Facts & Identify Underlying Theories:**

      *   *Compulsory Voting (Citizens):* Suggests citizenship is a duty/civic obligation, not just a right. It implies a strong link between the individual and the state (Republican/Civic Duty model).
      *   *Non-Citizen Local Voting:* Suggests residency and affectedness matter at the local level. This aligns with the "All-Affected Principle" but limited to the local sphere. It decouples national sovereignty from local administration.
      *   *Teen "Half-Votes" (Advisory):* This is the trickiest part. It suggests a gradation of capacity. It's not full suffrage, but it's not zero. It implies political competence is developmental. Note: The prompt says "advisory boards where each vote counts half." This is likely a specific pilot or a metaphorical description of youth councils, but I must treat it as given for the argument. It implies *partial agency*.

  3.  **Address Question 1 & 2: Theory of Membership & Bundle vs. Affectedness:**

      *   *Theory:* It's a hybrid. It's not purely *Ethno-National* (since non-citizens vote). It's not purely *All-Affected* (since non-citizens can't vote nationally). It's not purely *Competence-Based* (since voting is compulsory for all citizens regardless of competence).
      *   *Best Fit:* **Civic Republicanism with a Stakeholder Modification.**
          *   Citizenship = Full membership + Duty (Compulsory voting).
          *   Residency = Local stakeholder status (Local voting).
          *   Age = Developing capacity (Partial voice).
      *   *Bundle vs. Affected:* It treats citizenship as a **bundle of rights/duties that can be unbundled based on sphere and capacity.** National sovereignty is reserved for citizens (the "full bundle"), but local administration is open to residents (affectedness). Age modifies the weight of the voice based on capacity. So, it's a mix: Citizenship is the default "full bundle," but affectedness grants *some* bundles locally, and capacity modifies the weight.

  4.  **Address Question 3: Teens vs. Elderly (Consistency Check):**

      *   *The Logic:* The teen "half-vote" implies political competence is a curve (rising with age).
      *   *The Inconsistency:* If competence dictates weight, the curve should go down eventually (dementia, cognitive decline). Belgium (and most democracies) does not reduce voting weight for the elderly.
      *   *Why?*
          1.  *Presumption of Competence:* Adults are presumed competent until legally incapacitated.
          2.  *Dignity/Equality:* Reducing votes based on age is seen as discriminatory/ageist.
          3.  *Administrative Nightmare:* Testing competence is invasive.
          4.  *The Teen Exception:* Minors are legally *incapacitated* generally (contracts, etc.), so the political sphere mirrors civil law. Elderly retain civil rights.
      *   *Conclusion:* The system is **inconsistent** regarding the "competence" principle if applied universally, but consistent with *legal status* (minor vs. adult).

  5.  **Reconstruct the Implicit View:**

      *   **Core Principle:** Political membership is layered.
      *   **Layer 1 (National):** Based on formal citizenship + Duty. (Compulsory voting).
      *   **Layer 2 (Local):** Based on Residence + Affectedness. (Non-citizen voting).
      *   **Layer 3 (Capacity):** Based on Developmental Status. (Youth partial votes).
      *   **Normative Basis:** A mix of *Civic Duty* (citizens must participate), *Stakeholder Theory* (residents affected by local rules should have a say), and *Paternalism/Guardianship* (youth need guided integration).

  6.  **Assess Consistency:**

      *   *Internal Tension:* The "competence" logic for teens clashes with the "equality" logic for adults/elderly.
      *   *Tension between Duty and Right:* Compulsory voting makes voting a duty, but youth/foreigners have a *right* without the *duty* (usually non-citizens aren't fined for not voting, teens aren't compelled).
      *   *Verdict:* Pragmatically consistent (fits legal categories), philosophically inconsistent (mixes competing justifications without a unified metric).

  7.  **Address Question 6: Pure Affected-Interests Model:**

      *   *Definition:* Everyone affected by a decision gets a vote proportional to the effect.
      *   *Changes Required:*
          1.  **Abolish Citizenship Distinction:** Non-citizens would vote nationally if national laws affect them (which they do).
          2.  **Abolish Compulsory Voting:** Voting is a right derived from interest, not a duty of membership.
          3.  **Age Weights:** If affectedness is the key, age matters less than *impact*. However, if competence is tied to affecting others, teens might still be limited. But a *pure* affected model might give teens full votes if the laws affect them equally.
          4.  **Elderly:** Still no reduction (affectedness doesn't decline).
          5.  **Boundaries:** Electoral boundaries would need to be fluid (functional constituencies) rather than geographic.
          6.  **Tourists/Transient:** Might get votes if affected.

  8.  **Drafting the Response (Iterative refinement):**

