prompt: |-
  Belgium forces citizens to vote but lets long-term residents who aren't citizens vote locally after five years, and in some municipalities teenagers sit on advisory boards where each vote counts half. What theory of political membership does that combination presuppose? Does it treat citizenship like a bundle you can split into partial rights, or does it say being affected by local rules is enough for partial standing? And if the half-weight for teens is meant to track developing rational capacity, why doesn't teh same logic apply to elderly voters with decline? Reconstruct the implicit view, say whether it's consistent, and tell me what'd have to change if we replaced it with a pure affected-interests model.
reasoning: |-
