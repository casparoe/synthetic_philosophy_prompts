  # LOGICAL SPACE OVERVIEW

  **The Branch Questions**
  The following ten distinctions define the logical space. Each question is binary unless marked (3-way).
  1.  **Boundary:** Is the line between seeing and thinking fixed by nature, or drawn by us for convenience? (Fixed / Pragmatic)
  2.  **Unity:** If fixed, is the rule the same for vision, hearing, and touch? (Same / Different)
  3.  **DV-Phenomenal:** To count as an effect, must the subject say it *looks* different, or is better performance enough? (Looks / Performance)
  4.  **DV-Neural:** If it looks different, must early brain areas (input stages) change, or just later ones? (Early / Later)
  5.  **IV-Type:** Can a need (thirst) cause the change, or only a belief/expectation? (Need / Belief)
  6.  **IV-Conscious:** Must the causing state be consciously thought of right now, or can it be a habit? (Conscious / Habit)
  7.  **Time-Persist:** If the thought stops, must the look return to normal instantly? (Instant / Linger)
  8.  **Time-Practice:** Does the effect require long-term training (years), or must it arise from immediate context? (Context / Training)
  9.  **Shape-Add:** Can a neutral shape look "meaningful" (e.g., angry), or only change in basic features (e.g., darker)? (Meaningful / Basic)
  10. **Shape-Occlude:** If you miss an object because you are distracted, is that perception changing or perception failing? (Changing / Failing)

  **Space Size and Orthogonality**
  Theoretical combinations: $2^9 \times 3 \text{ (from Node 5 if expanded, but here binary)} = 1,024$ logical cells.
  Regarding Distinction (d) (Shape): This trichotomy (Additive, Substitutive, Occlusive) is largely orthogonal to the Independent Variable and Timescale nodes. One can consistently hold that desires cause substitutive changes but beliefs cause additive ones. However, it is not fully orthogonal to the Dependent Variable (Node 4). If one insists only *Early Neural* changes count (Node 4), Additive changes (e.g., "menacing") may be ruled out if early vision cannot represent semantic properties. This tension is mapped in the Empty Cell Table.

  ***

  # DECISION TREE FLOWCHART

  **Start at Node 1.** Follow the path matching your answers. Stop when you reach a **LEAF**.

  **Node 1:** Is the line between seeing and thinking fixed by nature, or drawn by us for convenience?
  *   Drawn by us -> **LEAF A (Deflationist)**
  *   Fixed by nature -> **Node 2**

  **Node 2:** Is the rule the same for vision, hearing, and touch?
  *   No, it varies -> **LEAF B (Pluralist)**
  *   Yes, same rule -> **Node 3**

  **Node 3:** To count as an effect, must the subject say it *looks* different, or is better performance enough?
  *   Performance enough -> **Node 4**
  *   Must look different -> **Node 5**

  **Node 4:** If performance changes but looks do not, is this perception changing?
  *   Yes, perception includes discrimination -> **LEAF C (Discrimination Realist)**
  *   No, this is judgment or response bias -> **LEAF D (Judgment Only)**

  **Node 5:** Must the change originate in early sensory processing (input stages), or is later processing sufficient?
  *   Later processing sufficient -> **Node 6**
  *   Early processing required -> **Node 7**

  **Node 6:** Can a need (e.g., thirst) cause the change, or only a belief/expectation?
  *   Need counts -> **Node 8**
  *   Only Belief counts -> **Node 9**

  **Node 7:** Can a need (e.g., thirst) cause the change, or only a belief/expectation?
  *   Need counts -> **LEAF E (The Capricious Sensor)**
  *   Only Belief counts -> **Node 10**

  **Node 8:** If the causing state is removed, must the look return to normal instantly?
  *   Instantly -> **LEAF F (Strict Contemporaneous)**
  *   Can linger -> **LEAF G (Time-Lag Accepter)**

  **Node 9:** If the causing state is removed, must the look return to normal instantly?
  *   Instantly -> **Node 10**
  *   Can linger -> **LEAF H (Belief-Lag)**

  **Node 10:** Does training over years count as cognition affecting perception, or just building a better tool?
  *   Building a tool -> **LEAF I (Practice-As-Tool)**
  *   Cognition affecting perception -> **Node 11**

  **Node 11:** Can a neutral shape look "meaningful" (e.g., angry), or only change in basic features (e.g., darker)?
  *   Only basic features -> **LEAF J (Shape-Restrictive)**
  *   Meaningful properties allowed -> **Node 12**

  **Node 12:** Must the causing state be consciously thought of right now, or can it be a habit/prime?
  *   Consciously thought of -> **LEAF K (Conscious-Only)**
  *   Habit/prime allowed -> **Node 13**

  **Node 13:** If you miss an object because you are distracted, is that perception changing or perception failing?
  *   Perception failing -> **LEAF L (Strict Impenetrability)**
  *   Perception changing -> **LEAF M (Pervasive Shaping)**

  *(Note: To ensure 10-14 leaves, two additional termination points are added below for specific theoretical commitments not fully captured by the main flow.)*

  **Node 14 (Alternative Entry):** Do you believe perception *just is* a form of hypothesis testing where the boundary marks no joint?
  *   Yes -> **LEAF N (Inference Dissolution)**
  *   No -> **Return to Node 1**

  **Node 15 (Alternative Entry):** Do you require neural evidence in V1/V2 for any claim of perceptual change?
  *   Yes -> **LEAF O (Neural-Only)**
  *   No -> **Return to Node 5**

  ***

  # LEAF DESCRIPTIONS

  **LEAF A: Deflationist**
  *   **Mnemonic:** *Rorty*
  *   **Awkward Commitment:** There is no fact of the matter about whether V1 is genuine penetration, only a choice of vocabulary.
  *   **Uncomfortable Vignette:** V2 (Insists the disagreement about the room is merely verbal).

  **LEAF B: Pluralist**
  *   **Mnemonic:** *Modesty*
  *   **Awkward Commitment:** Vision may be impenetrable while audition is penetrable, with no unified explanation.
  *   **Uncomfortable Vignette:** V6 (Must explain why phonemes differ from mammograms without a general theory).

  **LEAF C: Discrimination Realist**
  *   **Mnemonic:** *Gibson*
  *   **Awkward Commitment:** If detection sensitivity shifts, perception has changed, even if the world looks identical.
  *   **Uncomfortable Vignette:** V4 (Must accept thirst changes perception despite no change in looks).

  **LEAF D: Judgment Only**
  *   **Mnemonic:** *Pylyshyn*
  *   **Awkward Commitment:** All apparent effects on perception are actually effects on memory, decision, or reporting.
  *   **Uncomfortable Vignette:** V1 (Must claim the radiologist's "pop out" is a post-perceptual judgment).

  **LEAF E: The Capricious Sensor**
  *   **Mnemonic:** *Undefended*
  *   **Awkward Commitment:** Desires can blind you to objects in early vision, but beliefs cannot alter early vision at all.
  *   **Uncomfortable Vignette:** V4 (Thirst improves detection here, it does not cause occlusion).

  **LEAF F: Strict Contemporaneous**
  *   **Mnemonic:** *Fodor-Early*
  *   **Awkward Commitment:** If a visual after-effect persists after the belief is revoked, it is no longer perceptual.
  *   **Uncomfortable Vignette:** V3 (Must classify the lingering face-look as non-perceptual).

  **LEAF G: Time-Lag Accepter**
  *   **Mnemonic:** *Hysteresis*
  *   **Awkward Commitment:** Perception can remain altered by a cognitive state that the subject no longer holds.
  *   **Uncomfortable Vignette:** V2 (Must explain why the Ames room belief doesn't alter looks despite persistence).

  **LEAF H: Belief-Lag**
  *   **Mnemonic:** *Persistence*
  *   **Awkward Commitment:** Beliefs can linger in perception after judgment changes, but desires cannot.
  *   **Uncomfortable Vignette:** V4 (Excludes desire-driven effects from having any perceptual lag).

  **LEAF I: Practice-As-Tool**
  *   **Mnemonic:** *Skill*
  *   **Awkward Commitment:** Years of training build a new instrument, not a cognitive effect on the old one.
  *   **Uncomfortable Vignette:** V1 (Must deny the radiologist's vision is cognitively affected).

  **LEAF J: Shape-Restrictive**
  *   **Mnemonic:** *Qualia*
  *   **Awkward Commitment:** Perception can change in saturation or brightness, but cannot acquire semantic properties like "menacing."
  *   **Uncomfortable Vignette:** V3 (Must deny the patches look like *faces*, only that they look *structured*).

  **LEAF K: Conscious-Only**
  *   **Mnemonic:** *Descartes*
  *   **Awkward Commitment:** Unconscious primes cannot alter perception, only conscious thoughts can.
  *   **Uncomfortable Vignette:** V5 (Must classify the 50ms prime effect as non-perceptual).

  **LEAF L: Strict Impenetrability**
  *   **Mnemonic:** *Encapsulation*
  *   **Awkward Commitment:** Missing an object due to cognitive load is a failure of attention, not a change in perception.
  *   **Uncomfortable Vignette:** V1 (Denies training affects the visual system itself).

  **LEAF M: Pervasive Shaping**
  *   **Mnemonic:** *Churchland*
  *   **Awkward Commitment:** There is no pure sensation; every perceptual state is shaped by cognitive history.
  *   **Uncomfortable Vignette:** V2 (Must explain why the room looks rectangular despite pervasive shaping).

  **LEAF N: Inference Dissolution**
  *   **Mnemonic:** *Predictive*
  *   **Awkward Commitment:** The question dissolves because perception is constituted by inference, not influenced by it.
  *   **Uncomfortable Vignette:** V2 (The belief *is* the percept, so the conflict is impossible).

  **LEAF O: Neural-Only**
  *   **Mnemonic:** *V1-Realist*
  *   **Awkward Commitment:** If early sensory maps do not change, perception has not changed, regardless of appearance.
  *   **Uncomfortable Vignette:** V3 (Requires neural evidence for the lingering face-effect to count).

  ***

  # INDISTINGUISHABLE PAIRS

  **Pair 1: LEAF D (Judgment Only) vs. LEAF O (Neural-Only)**
  *   **The Problem:** Both leaves classify V1, V3, and V5 as "Not Penetration" because neither accepts post-sensory changes or non-neural appearance changes as genuine perception. Both classify V4 as "Not Penetration" (D says it's bias, O says it's not V1).
  *   **How to Pry Apart:** Ask about a hypothetical case where V1 activity changes *without* a change in reported appearance. **Leaf O** says this *is* perceptual change (Neural Realism). **Leaf D** says this is merely subpersonal processing without perceptual consequence (Phenomenal Realism). Empirical result needed: Blindsight-style dissociation where neural markers shift but phenomenology is static.

  **Pair 2: LEAF A (Deflationist) vs. LEAF B (Pluralist)**
  *   **The Problem:** Both leaves answer "It depends" to many vignettes. Both can classify V6 as Genuine (Auditory) and V1 as Not (Visual) without contradiction.
  *   **How to Pry Apart:** Ask about a *new* modality (e.g., human echolocation). **Leaf B** expects a fact of the matter to be discovered (e.g., "Echolocation is penetrable"). **Leaf A** says labeling it penetrable or not is purely a pragmatic decision for that specific research context. Empirical result needed: None; this is a metaphysical disagreement about the existence of boundaries.

