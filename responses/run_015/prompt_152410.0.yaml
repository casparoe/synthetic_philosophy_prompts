  **Ranked Tensions**
  1.  **(6) vs (7): Fatal.** You cannot certify a miracle as a habit-break if hidden regularities are indistinguishable from breaches.
  2.  **(1) vs (4): Severe.** If creatures lack causal power, citing them as "fully genuine" explanations is ontologically false, not merely pragmatic.
  3.  **(3) vs (7): Moderate.** Claiming genuine knowledge of the unobserved clashes with admitting we cannot rule out hidden natural powers.

  **Audit**
  **(6)/(7):** To keep (6), (7) must go. If you retain (7), you lose the ability to distinguish prophecy from anomaly, rendering the argument from miracles useless.
  **(1)/(4):** To keep (1), (4) must be downgraded. If you retain "fully genuine," you imply creatures contribute being, contradicting occasionalism. You lose explanatory realism but keep metaphysical consistency.
  **(3)/(7):** To keep (3), (7) must go. If you retain (7), induction yields only probability. You lose certainty regarding the unobserved but gain skeptical humility.

  **Single Revision**
  Drop (7). It is the poison pill. By admitting we cannot rule out hidden natural powers, you undermine the occasionalist epistemology required for (3), (6), and the distinction between miracle and nature in (2). Ghazālī denies hidden powers (*ṭabʿ*) exist to secure knowledge of habit. Eliminating (7) secures (6) (miracles are recognizable), stabilizes (3) (habit is reliable enough for knowledge), and clarifies (4) (explanations track divine habit, not hidden powers). You lose the skeptical cover to attribute surprising events to "unknown physics," forcing a binary choice between habit and miracle. This yields a coherent Ghazālīan system.
