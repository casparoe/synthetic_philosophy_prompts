  Headline Credence: **0.38**

  Here is the decomposition using your four sub-questions, treating them as probabilistic multipliers on the *potential* for revolution, constrained by the 20-year horizon.

  1.  **Objective/Physical Bottlenecks:** **0.25**
      *   *Justification:* The majority of high-value domains (biology, supply chains, energy) are constrained by atomic physics, regulation, or noisy proxy objectives, not pure combinatorial search.
  2.  **Heuristic Gap:** **0.45**
      *   *Justification:* Modern SAT/ILP solvers already handle structured real-world instances well; the polynomial algorithm mostly conquers adversarial/tail cases rather than the daily mean.
  3.  **Discovery Automation:** **0.70**
      *   *Justification:* If proof verification is in P, proof *finding* is in P, which mechanizes mathematics and code synthesis, the only vector capable of recursive self-improvement fast enough for 2047.
  4.  **Recursive Loop Speed:** **0.60**
      *   *Justification:* Software recursion is fast, but integrating algorithmic breakthroughs into physical hardware and institutional workflows faces friction that a two-decade window barely clears.

  **How they combine:**
  I treat this as a "General Purpose Technology" adoption curve. The **Discovery Automation (0.70)** is the engine, but it is throttled by the **Recursive Loop Speed (0.60)** to yield a ~0.42 potential for cognitive revolution. This is then discounted by the **Objective/Physical (0.25)** and **Heuristic (0.45)** realities, which suggest that outside of pure cognition, economic value adds are efficiency gains (GDP +5%) rather than phase shifts (GDP +100%). The headline **0.38** reflects the high variance: either the automation of math triggers a singularity-like event (pushing toward 1.0) or it hits the physical wall you described (pushing toward 0.1).

  **Sensitivity:**
  The final number is most sensitive to **Sub-question 3 (Discovery Automation)**. If P=NP does *not* translate to efficient automated theorem proving (e.g., because proof lengths are super-polynomial in statement length despite P=NP), the credence collapses to <0.10, because the other three factors alone do not support an Industrial Revolution claim.

  **Who is more likely wrong:**
  *   **Your Friend** is more likely wrong about **Sub-question 1 (Objectives)**. He is assuming that "optimization" maps cleanly to "value," underestimating Goodhart's Law and the friction of the physical world (wet labs, permitting, human behavior).
  *   **You** are more likely wrong about **Sub-question 3 (Discovery)**. You are underestimating the qualitative shift of mechanizing mathematical insight; if we can search proof space efficiently, the rate of scientific progress ceases to be human-limited, which *is* the definition of an industrial revolution in cognitive labor.

  ***

  ### The "Confusion" Caveat
  You asked me to flag if the setup rests on a confusion. There is a subtle one: **Polynomial does not mean Fast.**
  A $10^6 \cdot n^4$ algorithm is tractable for $n=1,000$ (roughly $10^{18}$ operations, feasible for data centers) but impossible for $n=1,000,000$ (global logistics). An Industrial Revolution requires scaling to *massive* systems. If the constant factor or exponent prevents scaling to the size of real-world genomes or global traffic networks, the impact remains confined to high-value, small-$n$ niches (chip design, crypto-breaking, drug folding) rather than a ubiquitous utility like electricity. I have baked this into the low score for Sub-question 2.

  ### Alternative Scenarios
  Does the answer change if we get **PH collapse** or **$1.3^n$** instead? **Yes, drastically.**

  *   **Merely $1.3^n$:** My credence drops to **0.04**. Exponential is exponential. A base of 1.3 still hits a wall at $n \approx 200$. This gives us better heuristics and larger solvable instances, but not a qualitative phase change in tractability. It is an upgrade, not a revolution.
  *   **PH Collapse:** My credence drops to **0.10**. This suggests the polynomial hierarchy is simpler than thought, but it does not guarantee efficient search for NP-complete problems. It hints at structure we might exploit, but without a constructive P-time algorithm, the "Discovery Automation" lever (Sub-question 3) remains broken.

  Your 0.25 is largely defended by the "Physical Bottleneck" argument (Sub-question 1), which holds true even in the P=NP world. Your friend's 0.85 relies on the "Discovery Automation" argument (Sub-question 3) working perfectly and instantly. The reality is likely in the friction between the two: we get superhuman math, but we still have to build the factories.
