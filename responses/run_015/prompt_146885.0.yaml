      *   *Decision:* Stick with Stability/Breakdown as the primary focus, but frame it through the lens of how liberalism handles the "unreasonable."

  7.  **Final Polish:** Ensure tone is respectful but firm on the Rawlsian exegesis. No fluff. No bibliography.

