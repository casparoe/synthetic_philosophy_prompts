  # The Ontological Sorter: A Decision Instrument for Time Metaphysics

  **Instructions:** Answer each node as a concrete scenario. Do not answer based on which label you prefer; answer based on what you take to be the truthmaker for the scenario. Follow the branch corresponding to your intuition. At the leaves, you will find the metaphysical position that matches your commitments.

  ---

  ### Node 1: The Ontological Scope
  **Scenario:** You stand in an empty room. The clock strikes 12:00. At 12:01, is the state of the room at 12:00 part of reality *right now*, or has it ceased to be entirely?
  *   **(A) It has ceased to be entirely.** (Only the present moment is real.) → **Go to Node 2.**
  *   **(B) It is still part of reality.** (Past moments exist in some sense.) → **Go to Node 3.**

  > **Change of Mind Consideration:** If you find yourself unable to provide truthmakers for past-tense statements (e.g., "Caesar crossed the Rubicon") without existing relata, you may need to switch from (A) to (B). Conversely, if the idea of a "dead" past existing concretely feels like ontological bloat, switch from (B) to (A).
  > **Empty Space Flag:** Answering (A) here but claiming future events exist (Node 3) creates a contradiction unless you posit an asymmetric ontology where the future is real but the past is not (see Shrinking Block path).

  ### Node 2: The Relational Scar (Presentist Branch)
  **Scenario:** You observe a dinosaur fossil. The dinosaur itself does not exist. Can the dinosaur still bear relational properties like "being older than this fossil" even though it is nothing?
  *   **(A) No.** Relations require existing relata. The statement is true only because of present evidence. → **Leaf: Bare Presentism** (Not a target leaf, but the default position).
  *   **(B) Yes.** Non-existent entities can ground relational truths via "ghost-relational scars." → **Leaf: Presentism with Ghost-Relational Scars** (Hybrid 1).

  > **Change of Mind Consideration:** If you adopt a robust truthmaker theory that demands existence for any property bearer, you must move to (A). If you accept Lucretian properties or ersatzism where past entities have a shadow existence, move to (B).
  > **Mis-sort Risk:** This tree may mis-sort Lucretian Presentists who deny relations but accept past-tensed properties. They belong at (A) but often feel like (B).

  ### Node 3: The Populated Future (Non-Presentist Branch)
  **Scenario:** Consider the moment of your death. Is that moment already populated with events waiting for you, or is it open and unreal?
  *   **(A) It is open and unreal.** (The future does not exist.) → **Leaf: Growing-Block Theory.** (Past exists, Future does not).
  *   **(B) It is already populated.** (The future exists tenselessly.) → **Go to Node 4.**

  > **Change of Mind Consideration:** If you believe freedom requires an ontologically open future, you must choose (A). If you believe truth values for future contingents require existing truthmakers, you must choose (B).
  > **Empty Space Flag:** If you chose (B) at Node 1 (Past exists) and (A) here, you are a Growing Block theorist. If you chose (A) at Node 1, you cannot reach this node.

  ### Node 4: The Asymmetric Block (Future-Existence Branch)
  **Scenario:** If you could magically erase the Big Bang from the timeline, would the future events you just affirmed vanish with it, or do they stand independently?
  *   **(A) They vanish.** (The future exists, but the past does not concretely ground it; or Past is unreal.) → **Leaf: Shrinking-Block Theory.** (Future exists, Past does not).
  *   **(B) They stand independently.** (Both Past and Future exist concretely.) → **Go to Node 5.**

  > **Change of Mind Consideration:** Shrinking Block is rare. If you find the idea of a "fixed future" but "vanishing past" incoherent regarding causation, move to (B).
  > **Unexplored Space:** Shrinking Block combined with Node 2-style relational scars for the future is logically possible but largely unexplored in literature.

  ### Node 5: The Double Present (Eternalist Branch)
  **Scenario:** A time traveler is present at both 2024 and 1924 simultaneously. Does the property of "presence" have to be unique to one moment, or can it be shared?
  *   **(A) It must be unique.** (There is one objective "Now".) → **Go to Node 6.**
  *   **(B) It can be shared.** (Presence is not unique.) → **Go to Node 7.**

  > **Change of Mind Consideration:** If you think time travel implies being "fully present" in two locations, you must choose (B). If you think presence is a spotlight that can only shine on one time, choose (A).
  > **Mis-sort Risk:** B-theorists who accept a phenomenological "now" might accidentally choose (A). Ensure you mean *ontological* uniqueness, not experiential.

  ### Node 6: The Moving Spotlight (Unique Presence Branch)
  **Scenario:** Does the spotlight of "now" move along the timeline, illuminating new events, or is the property of "presentness" static attached to all times equally despite being unique?
  *   **(A) It moves.** (Presentness is a dynamic property.) → **Leaf: Moving Spotlight Theory.**
  *   **(B) It is static.** (Presentness is a fixed A-property.) → **Leaf: A-Theoretic Eternalism.**

  > **Change of Mind Consideration:** If you cannot make sense of the "speed" of the spotlight's movement without a hyper-time, you should switch to (B) or reject Node 5(A).
  > **Indistinguishability Note:** This tree cannot reliably separate **Moving Spotlight** and **A-Theoretic Eternalism**. Both posit all times exist + one objective present. The "movement" is often metaphorical. Treat these leaves as a cluster.

  ### Node 7: The Indexical Now (Non-Unique Presence Branch)
  **Scenario:** Is the feeling of "now" just like the feeling of "here" (a feature of your perspective), or is it a real feature of the world that just happens to be everywhere?
  *   **(A) It is like "here".** (Indexical only.) → **Leaf: Eternalism with Indexical Presentness** (Hybrid 2).
  *   **(B) It is not real.** (Presentness is illusory/linguistic.) → **Leaf: B-Theoretic Eternalism.**

  > **Change of Mind Consideration:** If you think "now" refers to a real property even if not unique, choose (A). If you think "now" is purely a token-reflexive term with no metaphysical weight, choose (B).
  > **Mis-sort Risk:** Deflationary B-theorists often answer (A) because they accept indexicality, but they mean it deflationarily. This tree sorts them into Hybrid 2. Distinguish based on whether you think "presentness" needs a truthmaker beyond the event itself.

  ---

  ### Meta-Analysis of the Instrument

  **Indistinguishable Pairs:**
  1.  **Moving Spotlight vs. A-Theoretic Eternalism:** Node 6 attempts to split them based on the dynamism of the present property. However, without a commitment to hyper-time, "movement" is difficult to define metaphysically. Many grad students will find these leaves equivalent.
  2.  **B-Theory vs. Eternalism with Indexical Presentness:** Node 7 splits based on the reality of the indexical property. In practice, many B-theorists accept indexical presentness (Hybrid 2) as a semantic gloss on B-theory. The distinction is often linguistic rather than ontological.

  **Empty Logical Space:**
  1.  **Presentism + Real Future:** If you answer Node 1(A) (Nothing outside present) but intuitively feel Node 3(B) (Future is populated), you are in contradictory space unless you adopt a specific open_future presentism that treats future truths as exceptions.
  2.  **Shrinking Block + Past Relations:** If you land on Shrinking Block (Node 4A) but want to affirm Node 2(B) (Past bears relations), you are in unexplored space. Can non-existent past events bear relations in a Shrinking Block? This combo is logically possible but rarely defended.

  **Likely Mis-Sorts:**
  1.  **The Fenstad Presentist:** Presentists who use ersatz times to ground truths may answer Node 2(B) (Yes, relations hold) but reject the "ghost" ontology. They will be sorted into Hybrid 1 when they consider themselves Standard Presentists.
  2.  **The Phenomenological Eternalist:** An eternalist who feels the "now" is special phenomenologically might answer Node 5(A) (Presence must be unique) confusing experience with ontology, landing them in Moving Spotlight instead of B-Theory.

  **Instrument Limit:** This tree sorts based on *existence* and *presence*. It does not sort based on *causation* or *freedom*. A Growing Block theorist who believes in causal determinism and one who believes in libertarian freedom will land on the same leaf. Use this tool for metaphysics, not philosophy of action.
