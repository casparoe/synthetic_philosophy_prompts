      *   *Negative Utilitarianism:* Minimize suffering is the primary moral imperative. (Fits Case 2, but struggles with Case 1 & 5).
      *   *Lexical Threshold View:* Extreme suffering cannot be outweighed by any amount of pleasure. (Fits Case 2).
      *   *Perfectionism/Eudaimonia:* Meaning, achievement, and depth matter more than raw feel. (Fits Case 1, 3, 5).
      *   *Aesthetic/Tragic View:* Suffering can be meaningful or constitutive of beauty. (Fits Case 4).

