  ### 3. Concede up front
  I should concede immediately that logical omniscience is a useful idealization for most standard cases. Admit that for empirical claims, complexity priors and bounded utility successfully defang traditional Pascal's Mugging. Acknowledge that replacing credences with market prices looks radical and violates standard coherence axioms. By granting these points, I isolate the debate to the specific niche of logical uncertainty during finite decision windows. This prevents the audience from dismissing the whole project as an attack on standard Bayesianism. It frames the talk as an extension of decision theory to bounded logical agents, rather than a replacement of existing frameworks.

  ### 4. The reply that has to land
  The core distinction is between uncertainty about the world and uncertainty about the consequences of your actions given the world. In the Conjecture Mugger case, the world is fixed, but the logical connection between the code and the outcome is unsettled. Standard decision theory assumes this connection is known. If you cannot compute the consequence, you cannot maximize expected utility. Therefore, the problem isn't the utility function or the empirical prior; it's the lack of a theory for acting when logical implications are computationally inaccessible. You must accept that rational action sometimes requires non-probabilistic credences.

  ### 5. The question I'm hoping nobody asks
  "How do you set the initial market prices for logical claims without smuggling in a prior?" If asked, I must avoid claiming logical induction is prior-free. Say: "The initial prices reflect computational resources allocated to proving or disproving the claim. It's not prior-free; it's resource-relative. Different agents with different resources will have different rational credences. This violates Aumann's agreement theorem, but that theorem assumes logical omniscience. We are dropping that assumption, so we must drop the expectation of immediate agreement." This admits the cost (disagreement) to save the benefit (actionability). Do not claim uniqueness.
