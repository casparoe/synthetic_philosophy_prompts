prompt: |-
  I'm a journalist working on a long feature about how appellate judges actually resolve statutory cases, and I've hit a problem I keep failing to solve on my own. Every example anyone sends me of textualism and purposivism genuinely pulling apart is either a centenarian chestnut from the casebooks — a statute barring the importation of contract laborers read not to cover a minister, a firearm traded for narcotics read as one "used" in a drug transaction — or a case where one side is being deliberately obtuse, which my interviewees correctly point out proves nothing. My most useful source, a friend who clerks on a federal court of appeals and describes herself without embarrassment as a Scalia-style textualist, says the honest cases are the ones where neither method is cheating and they still disagree; I'd like to put one of those in the piece, and I'd rather construct it than hunt for it, because a hypothetical lets me hold everything else fixed. So I need a case built to order.

  Here is what I need it to satisfy. First, the statute: one paragraph of realistic text in a real regulatory area — hospital billing, tenant protections, groundwater permitting, nursing-home staffing, whatever you like — and it must contain its own purpose clause or findings section, so that the purpose is available from the enacted text itself. No committee reports, no floor statements, no sponsor's letter: both methods argue from the same materials. Second, and this is where my own drafts died, the case must not be propped up by any of the usual escape hatches. My friend killed my first attempt in one line ("scrivener's error, next") and my second in two (the result was absurd enough that the absurdity canon resolved it before any purpose-talk was needed). So: no drafting mistakes, no results absurd on their face, no constitutional-avoidance route, no bare vagueness — please don't build the case on words like "reasonable," "appropriate," or "significant," whose whole function is to underdetermine — and no manufacturing the divergence by having the textualist read words with their nineteenth-century meaning while everyone else reads them with today's. Third, the divergence has to be generated by one structural feature: something that changed between enactment and application without anyone amending the disputed words. A later-enacted statute in a different title, a cross-referenced regulatory schedule that has since been revised, a definition that behaves differently after a subsequent amendment, a term whose ordinary meaning drifted. And it has to survive the textualist's own toolkit: I want you to show that a textualist who reads the whole act, the whole code, and the later enactment too — who applies the canons rather than being forbidden from them — still reaches the reading the purpose clause resists. If your case works only by barring the textualist from looking at the later material, it's rigged, and I can't use it. Both readings should be ones a competent lawyer could sign a brief to; I don't want a straw textualist any more than I want a straw purposivist.

  After the statute and a short, ordinary factual scenario — real parties, real stakes, nothing fanciful — I'd like the analysis in four labeled parts. (1) The verdict under each method, naming which party wins: what the textualist does with the disputed words and which canons get applied in reaching that result, and what the purposivist does with the purpose clause, including what happens when the purpose is stated at a different level of generality. (2) The load-bearing feature, named explicitly, plus a demonstration that removing it collapses the case back into agreement — say what each method says about the stripped-down version. (3) The strongest objection a textualist would make to your own construction: I'd guess it's something like the purpose clause doing legislative history's work in disguise, or the claim that you've only exhibited an ambiguity that canons resolve, or the complaint that the real dispute is about the level of generality and not about method at all — but tell me which one actually bites hardest here, and how much it costs the case. (4) One line on what you'd expect a real appellate panel to do with it and why, and one line on whether it makes the point for my piece better than the chestnuts do — whether it isolates something about the two methods rather than something about a drafting accident.
reasoning: |-
  Here's a thinking process that leads to the suggested hypothetical case:

  1.  **Analyze the Request:**

      *   **Goal:** Create a hypothetical statutory interpretation case where textualism and purposivism genuinely diverge, avoiding common pitfalls (scrivener's error, absurdity, vagueness, old chestnuts).
      *   **User:** Journalist writing a feature on appellate judges. Needs a "built to order" example to illustrate the core methodological split.
      *   **Constraints:**
          1.  *Statute:* One paragraph, realistic regulatory area, must include an internal purpose clause/findings (no external legislative history).
          2.  *No Escape Hatches:* No obvious drafting mistakes, no facially absurd results (blocking the absurdity canon), no constitutional avoidance, no vague standards ("reasonable," etc.), no archaic meanings.
          3.  *Source of Divergence:* Must be generated by a *structural feature* involving change over time (later statute, revised schedule, shifted definition, semantic drift) that the textualist *must* acknowledge (reads whole code + later enactments).
          4.  *Competence:* Both sides must be arguable by competent lawyers (no straw men).
          5.  *Output Format:* Statute + Facts + Four Labeled Parts (Verdicts, Load-Bearing Feature, Strongest Objection, Real-World Outcome/Value).

  2.  **Deconstruct the Challenge:**

      *   *The Core Problem:* Textualism often absorbs purpose if the purpose is in the text. If the text says "Purpose: X," a textualist reads "Purpose: X." To get a split, the *operative text* must point one way when read in context of the *whole code* (including later changes), while the *purpose clause* points another way when applied to the specific facts.
      *   *The "Change Over Time" Requirement:* This is the trickiest part. Textualists respect later enactments as part of the "whole code." If Congress changes a related definition later, the textualist updates the meaning. The purposivist might argue the original purpose overrides the technical shift.
      *   *Avoiding "Absurdity":* The textualist result cannot be *so* crazy that the absurdity canon kills it. It must be plausible, just perhaps contrary to the specific goal stated in the purpose clause.
      *   *Avoiding "Vagueness":* The disputed term must be specific enough to have a "plain meaning" in context, not a standard like "reasonable."

  3.  **Drafting the Statute:**

      *   *Area:* Environmental regulation or Healthcare billing are good for technicality. Let's try **Groundwater/Environmental Permitting**. It allows for technical definitions that shift.
      *   *Purpose Clause:* Needs to be specific but broad enough to conflict with a technical reading. "To prevent contamination of drinking water sources."
      *   *Operative Text:* Needs a prohibition tied to a definition. "No person shall discharge [Defined Term] into [Defined Zone]."
      *   *The Twist (Structural Feature):* A later statute redefines the [Defined Term] or the [Defined Zone] in a way that narrows or expands it technically, creating a gap between the *technical definition* and the *purpose*.
      *   *Idea:* A statute bans "Hazardous Solvents" from being injected into "Class I Wells."
      *   *The Shift:* Ten years later, the EPA (or a cross-referenced statute) reclassifies a specific chemical. Or, better, a different Title of the US Code defines the term for tax purposes, and the incorporation clause pulls it in.
      *   *Refinement:* Let's use a "cross-referenced regulatory schedule" that gets updated.
      *   *Statute:* The "Aquifer Protection Act."
      *   *Purpose:* "To ensure that no chemical compounds known to cause carcinogenic effects in humans enter the recharge zone of public drinking water aquifers."
      *   *Prohibition:* "No operator shall inject any 'Listed Carcinogen' into a 'Recharge Well'."
      *   *Definition:* "'Listed Carcinogen' means any compound identified in Table 4 of the National Toxicology Program (NTP) Report on Carcinogens."
      *   *The Change:* At enactment, Chemical X was on Table 4. Later, new science moves Chemical X to a different category (e.g., "Suspected" but not "Known") in a *new* edition of the Report, which the statute incorporates by reference as "the most current edition."
      *   *Wait, that's too easy for textualists.* If the statute says "most current edition," the textualist follows the update. The purposivist argues the original purpose (protecting health) keeps it banned.
      *   *Problem:* That makes the textualist the "dynamic" one and the purposivist the "originalist." That works, but is it a "change between enactment and application without anyone amending the disputed words"? Yes.
      *   *Harder Version:* Let's make the incorporation static, but a *different* statute changes the regulatory landscape.
      *   *Better Idea:* The "Whole Code" canon. A definition in Title 15 (Commerce) is incorporated into Title 33 (Water). Title 15 gets amended to exclude a substance for economic reasons, not safety reasons.
      *   *Let's try Housing/Tenant Protection.* It's relatable.
      *   *Statute:* "The Stable Housing Act."
      *   *Purpose:* "To prevent displacement of low-income families due to sudden rent increases."
      *   *Operative:* "A landlord shall not evict a tenant for nonpayment if the rent demanded exceeds the 'Base Allowable Rent'."
      *   *Definition:* "'Base Allowable Rent' means the rent registered with the Agency under Section 505 of the Housing Act of 1980."
      *   *The Shift:* Section 505 of the 1980 Act is amended later to allow "Pass-Through Charges" for capital improvements to be added to the *registered* rent, but the Stable Housing Act wasn't amended.
      *   *Textualist View:* The definition incorporates the *current* legal status of the registered rent. If the 1980 Act says the registered rent *includes* pass-throughs, then the Base Allowable Rent includes them. Eviction is allowed.
      *   *Purposivist View:* The purpose is to prevent displacement. Allowing pass-throughs to trigger eviction defeats the purpose. The definition should be frozen at enactment or read to exclude pass-throughs.
      *   *Critique:* Is "registered rent" vague? Maybe. Let's tighten the definition.

      *   *Let's try a Tax/Healthcare hybrid.*
      *   *Statute:* "The Rural Clinic Support Act."
      *   *Purpose:* "To ensure that residents of designated rural counties have access to emergency medical stabilization services without regard to ability to pay."
      *   *Operative:* "A 'Qualified Facility' shall not transfer a patient prior to stabilization if the patient is uninsured."
      *   *Definition:* "'Qualified Facility' means any hospital receiving reimbursement under Subchapter XVIII of the Social Security Act (Medicare)."
      *   *The Shift:* At enactment, all rural hospitals took Medicare. Ten years later, a new waiver program (Section 1115) allows rural hospitals to opt out of Medicare in exchange for block grants. A specific hospital opts out.
      *   *Textualist:* The statute says "receiving reimbursement." If they aren't receiving it *now*, they aren't a Qualified Facility. They can transfer.
      *   *Purposivist:* The purpose is access for rural residents. The hospital is still the only rural hospital. The purpose covers them.
      *   *Critique:* "Receiving" is a present tense factual condition. Textualist wins easily. Not enough tension.

      *   *Let's go back to the "Incorporation by Reference" that shifts.*
      *   *Area:* Environmental/Chemical.
      *   *Statute:* "The Clean Waterways Act."
      *   *Purpose:* "To eliminate the discharge of persistent organic pollutants into navigable waters."
      *   *Operative:* "No person shall discharge any 'Schedule A Chemical' into navigable waters."
      *   *Definition:* "'Schedule A Chemical' means any substance classified as a 'Priority Pollutant' under 40 C.F.R. § 122.4 as of the date of enactment." (Static incorporation).
      *   *Wait, the prompt requires:* "something that changed between enactment and application without anyone amending the disputed words... A later-enacted statute in a different title, a cross-referenced regulatory schedule that has since been revised..."
      *   *Okay, Dynamic Incorporation:* "means any substance classified... in the most current version."
      *   *The Twist:* The EPA removes Chemical Z from the list because it's no longer "persistent," but new science shows it's highly toxic in short bursts.
      *   *Textualist:* It's not on the list. Discharge allowed.
      *   *Purposivist:* Purpose is to stop pollutants. It's still a pollutant.
      *   *Problem:* This is just "Agency changed its mind." A bit weak.

      *   *Let's try the "Whole Code" / Different Title approach.* This is stronger for textualism.
      *   *Statute:* "The Federal Employee Safety Act."
      *   *Purpose:* "To guarantee that federal employees working in hazardous environments are provided with protective equipment sufficient to prevent occupational illness."
      *   *Operative:* "Agencies must provide 'Approved Respirators' to all employees working in Zone H."
      *   *Definition:* "'Approved Respirator' has the meaning given in 15 U.S.C. § 2002 (Consumer Product Safety definitions)."
      *   *The Shift:* 15 U.S.C. § 2002 is amended later to exclude equipment used in "industrial settings" from its definition scope (to avoid overlap with OSHA).
      *   *Textualist:* The definition in 15 USC now excludes industrial gear. Federal employees in Zone H are in an industrial setting. Therefore, no "Approved Respirator" exists under the definition. The mandate is impossible? No, the mandate applies to the *term*. If the term is empty, the mandate is void? Or, the textualist says "The definition excludes this gear, so we don't have to provide it."
      *   *Purposivist:* The purpose is safety. The exclusion in 15 USC was for consumer jurisdiction, not to deny safety gear to feds.
      *   *Critique:* This risks the "absurdity" canon (Congress couldn't mean to deny safety gear).

      *   *Let's try a Financial Regulation case.*
      *   *Statute:* "The Small Lender Protection Act."
      *   *Purpose:* "To prevent large institutional investors from undercutting community banks on loans to small businesses."
      *   *Operative:* "No 'Institutional Investor' may originate a 'Small Business Loan' with an interest rate below the Federal Discount Rate."
      *   *Definition:* "'Institutional Investor' means any entity required to register under the Investment Company Act of 1940."
      *   *The Shift:* A later statute (Dodd-Frank style) creates an exemption from registration for certain "Private Credit Funds" that do exactly what the big investors do. They deregister.
      *   *Facts:* A massive Private Credit Fund (formerly registered) originates a low-rate loan. They are no longer "required to register."
      *   *Textualist:* They are not an "Institutional Investor" under the definition (which incorporates the 1940 Act's current requirements). They win.
      *   *Purposivist:* The purpose is to stop big money from undercutting banks. This fund is big money. They lose.
      *   *Check Constraints:*
          *   Statute text? Yes.
          *   Purpose clause? Yes.
          *   No escape hatches? Not absurd that private funds exist. Not vague ("required to register" is legal status).
          *   Structural feature? Yes, later amendment to the 1940 Act changes who is "required to register."
          *   Textualist toolkit? Textualist reads the whole code, including the amendment to the 1940 Act.
          *   Competent briefs? Yes. Textualist: "Congress defined the term by reference to a dynamic legal status." Purposivist: "Congress defined the term by reference to a class of actors, the purpose binds the class."

      *   *Refining the Statute for Maximum Tension:*
          *   Make the definition incorporate a *list* that changes, or a *status* that changes.
          *   Let's go with the "Status" idea. It's cleaner.
          *   Need to ensure the Textualist result isn't "absurd." It's not absurd to let private funds lend; it's just contrary to the *specific purpose* of protecting community banks.
          *   Need to ensure the Purposivist result isn't just "vague." They rely on the Purpose Clause to limit the scope of the exemption.

  4.  **Finalizing the Scenario:**

      *   **Statute:** The "Community Credit Preservation Act" (CCPA).
      *   **Purpose:** "To preserve the viability of local community banks by preventing unregulated capital pools from engaging in predatory underwriting below sustainable rate floors."
      *   **Prohibition:** "No 'Registered Entity' shall originate a 'Commercial Loan' at an interest rate below the Treasury Yield."
      *   **Definition:** "'Registered Entity' means any lender required to file Form PF with the Securities and Exchange Commission under Section 204(b) of the Investment Advisers Act."
      *   **The Change:** Two years after CCPA passes, Congress amends the Investment Advisers Act to exempt "Private Credit Facilities" from Form PF filing requirements to reduce regulatory burden, assuming they are systemic-risk-free.
      *   **The Case:** A massive Private Credit Fund (assets > $10B) originates a loan at 2% (Treasury is 4%). They no longer file Form PF.
      *   **Textualist:** They don't file Form PF. They aren't a "Registered Entity." The prohibition doesn't apply.
      *   **Purposivist:** They are exactly the "unregulated capital pool" the purpose clause targets. The exemption was for burden reduction, not to authorize predatory rates.

      *   *Wait, one check:* Does "required to file" mean "required at the time of enactment" or "required at the time of conduct"?
      *   *Textualist Canon:* Statutes are generally read as "ambulatory" (updating) unless specified otherwise, especially when incorporating external legal standards. *Dynamic Incorporation*.
      *   *Purposivist Counter:* The purpose fixes the class.
      *   *This works.* It hits the "change over time" requirement perfectly.

  5.  **Drafting the Content:**

      *   *Statute:* Write it formally.
      *   *Facts:* Keep it dry. Fund vs. Regulator.
      *   *Analysis:*
          1.  *Verdicts:* Textualist (Fund wins), Purposivist (Regulator wins). Explain canons (Dynamic Incorporation vs. Purpose as limitation).
          2.  *Load-Bearing Feature:* The dynamic incorporation of a legal status that changed. Show that if the definition was static ("...as of 2023"), they agree (Fund loses).
          3.  *Strongest Objection:* Textualist will say the Purpose Clause is just another piece of text, and the specific definition controls the general purpose (Specific Governs General). This is a strong canon. I need to acknowledge this cost. It weakens the case slightly but doesn't kill it if the Purpose Clause is robust.
          4.  *Real Panel:* Split decision. 2-1. Shows the methodological rift is real, not just about "activism."

  6.  **Review against Constraints:**
      *   *One paragraph statute?* I can group the sections into one block.
      *   *Purpose clause included?* Yes.
      *   *No escape hatches?* No absurdity (letting funds lend isn't crazy). No vagueness ("Required to file" is binary).
      *   *Structural feature?* Amendment to Investment Advisers Act.
      *   *Textualist reads whole code?* Yes, including the amendment.
      *   *Four labeled parts?* Yes.

  7.  **Polishing:**
      *   Make sure the Textualist argument is sophisticated (not just "I read the words"). They rely on the presumption of dynamic incorporation of legal references.
      *   Make sure the Purposivist argument is sophisticated (not just "It's unfair"). They rely on the hierarchy of text where purpose informs scope.
      *   Ensure the "Strongest Objection" is genuine. The "Specific Governs General" canon is the biggest threat here. I will frame it as the Textualist arguing the Definition *is* the specific instruction, and the Purpose is general background.

      *(Self-Correction during drafting)*: I need to make sure the Textualist doesn't just say "The definition is clear." They need to explain *why* the definition covers the change. The canon is "Reference to a general provision of law is a reference to that law as amended." (1 U.S.C. § 106 is the federal rule, though this is a hypothetical state/fed mix). I'll cite the canon generally.

      *(Refining the "Absurdity" check)*: Is it absurd to let a hedge fund lend cheaply? No. It might be bad for community banks, but not "absurd" in the legal sense (like criminalizing breathing).

      *(Refining the "Vagueness" check)*: "Required to file" is a legal conclusion, not a standard like "reasonable." It's binary.

      *(Refining the "Purpose" check)*: The purpose clause must be enacted text. I will put it in Section (a).

      *Let's write it.*
answer: |-
  **The Statute: The Community Credit Preservation Act (CCPA)**

  > **(a) Purpose.**—The purpose of this Act is to preserve the viability of local community banks by preventing unregulated capital pools from engaging in predatory underwriting below sustainable rate floors. **(b) Prohibition.**—No 'Registered Entity' shall originate a 'Commercial Loan' at an interest rate below the applicable Treasury Yield. **(c) Definitions.**—(1) The term 'Commercial Loan' means any extension of credit to a business with fewer than 50 employees. (2) The term 'Registered Entity' means any lender required to file Form PF with the Securities and Exchange Commission under Section 204(b) of the Investment Advisers Act of 1940. (3) The term 'Treasury Yield' means the yield on the 10-year United States Treasury note on the date of origination.

  **The Facts:**

  Two years after the CCPA was enacted, Congress amended the Investment Advisers Act of 1940 to create a "Private Credit Exemption," relieving certain large private lending funds of the obligation to file Form PF to reduce regulatory burden. *Apex Capital Partners*, a private credit fund with $15 billion in assets, subsequently originated a $5 million loan to a local manufacturing plant (40 employees) at an interest rate of 3%, while the 10-Year Treasury Yield was 4.5%. The Federal Banking Commission issued an enforcement action against *Apex*, arguing the loan violated the CCPA's rate floor. *Apex* moved to dismiss, arguing it is not a "Registered Entity" under the CCPA because it is no longer required to file Form PF.

  ***

  **(1) The Verdict Under Each Method**

  *   **The Textualist Verdict (Apex Wins):** The textualist focuses on the definition in Section (c)(2). Under the canon of *dynamic incorporation* (or the presumption that references to external laws include subsequent amendments), the phrase "required to file... under Section 204(b)" refers to the legal obligation as it exists at the time of conduct, not as it existed at enactment. Since the Investment Advisers Act was amended to exempt *Apex* from filing, *Apex* is not a "Registered Entity." The prohibition in Section (b) simply does not apply to them. The Purpose Clause in Section (a) is acknowledged but cannot override the operative definition; under the canon that *specific text controls general purpose*, the precise definition of the regulated class limits the broad statement of intent.
  *   **The Purposivist Verdict (Commission Wins):** The purposivist starts with Section (a). The statute's explicit goal is to stop "unregulated capital pools" from undercutting community banks. *Apex* is the exact entity the statute targeted; the regulatory change was a bureaucratic adjustment, not a substantive policy shift authorizing predatory rates. The purposivist reads the definition in Section (c)(2) as a *proxy* for the class described in the purpose. Because the proxy (Form PF) drifted from the target (unregulated capital pools) due to external legal changes, the court must interpret "Registered Entity" to include entities that *would have been* required to file but for the exemption, or else the purpose is nullified. The purpose clause acts as a limitation on the scope of the definition.

  **(2) The Load-Bearing Feature**

  The divergence rests entirely on the **dynamic incorporation of a mutable legal status**. The statute defines the regulated party not by intrinsic characteristics (e.g., "any lender with over $1 billion in assets") but by reference to an external regulatory obligation that Congress later altered.

  *   **If Removed:** If the definition read "any lender required to file Form PF... *as of the date of this Act's enactment*," both methods would agree *Apex* loses. The textualist would be bound by the frozen text; the purposivist would be bound by the clear capture of the entity.
  *   **If Removed (Alternative):** If the definition used an intrinsic metric (e.g., "any lender with over $10 billion in assets"), both methods would agree *Apex* loses. The textualist would apply the plain meaning of the asset threshold; the purposivist would see the purpose fulfilled.
  *   **Why It Holds:** The case only fractures because the textualist respects the *later* Congress's decision to amend the Investment Advisers Act as part of the "whole code," while the purposivist privileges the *earlier* Congress's stated purpose in the CCPA over the incidental effect of the later amendment.

  **(3) The Strongest Objection a Textualist Would Make**

  The hardest bite comes from the canon that **"a specific provision controls a general one."** A textualist would argue that Section (c)(2) is the specific operational command defining jurisdiction, while Section (a) is merely a general statement of aspiration. They would contend that by making the Purpose Clause "load-bearing," I am effectively granting it veto power over clear operative text, turning purpose into a super-canon that swallows the rule of law. This costs the hypothetical some symmetry: it frames the purposivist as potentially willing to override clear definitions, whereas the textualist is merely respecting the coherence of the U.S. Code. To survive this, the purposivist must argue that the Purpose Clause is *enacted* text (which it is), not legislative history, and therefore holds equal weight to the definition, creating a true conflict rather than a hierarchy.

  **(4) Real-World Outcome and Value**

  *   **Panel Expectation:** A real appellate panel would likely split 2-1, with the majority deferring to the regulatory definition (textualist lean) to avoid making policy judgments about "unregulated capital pools," while the dissent invokes the purpose to prevent an obvious loophole.
  *   **Value for the Piece:** This isolates the methodological rift better than the chestnuts because it isn't about "absurdity" or "mistakes." It is about **time and coherence**: whether a statute is a snapshot of a specific policy goal (purposivism) or a living component of a changing legal code (textualism). It shows that textualism isn't always "strict" and purposivism isn't always "loose"—sometimes textualism is dynamic, and purposivism is originalist.
