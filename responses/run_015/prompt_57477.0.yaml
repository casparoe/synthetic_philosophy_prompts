answer: |-
  **MEMORANDUM**

  **TO:** Second-Year Law Student
  **FROM:** [Your Professor's Colleague]
  **RE:** The Hart-Devlin Slogan Problem
  **DATE:** October 24

  You are right to be annoyed. That nod from your professor was an intellectual surrender. "You can't legislate morality" is the jurisprudence equivalent of "money can't buy happiness"—it sounds profound until you ask for the mechanism, at which point it evaporates. If you want to lead this seminar without sounding like a pedant who didn't do the reading, you must treat that sentence not as a conclusion, but as a riddle that needs solving.

  Below is the analytical menu you requested. I have stripped out the pleasantries. Use this to construct your handout. It is designed to be handed out to the half of the room that hasn't read the texts, while containing enough bite to keep the half that *has* read them from dozing off.

  ***

  ### HANDOUT: Five Readings of "You Can't Legislate Morality"

  **1. The Psychological Impossibility Thesis**
  *   **(a) Proposition:** Law can regulate outward conduct, but it is causally incapable of generating inner moral belief or virtuous character.
  *   **(b) Analysis:** *Can't* = Causal inefficacy. *Legislate* = Criminal prohibition/coercion. *Morality* = Inner motive, conscience, or virtue.
  *   **(c) Verdict:** Substantive empirical thesis (mostly true, but irrelevant).
  *   **(d) Engagement:** **Devlin** concedes this immediately; he does not care about saving souls, only about preventing social disintegration through shared public standards. **Hart** accepts this but argues it's insufficient; even if law *could* force virtue, it shouldn't, but his primary objection is that Devlin's link between shared morality and social survival is empirically weak.

  **2. The Normative Prohibition Thesis**
  *   **(a) Proposition:** The state lacks the moral authority to enforce moral rules unless those rules prevent harm to others.
  *   **(b) Analysis:** *Can't* = Normative prohibition (a "ought not" wearing the grammar of "cannot"). *Legislate* = Criminalization. *Morality* = Positive morality (customary beliefs) distinct from harm-prevention.
  *   **(c) Verdict:** Contestable normative claim (This is Mill's Harm Principle, not a fact about legislation).
  *   **(d) Engagement:** **Devlin** rejects this premise entirely; he argues society has a *right* to preserve its own existence via its moral code, regardless of harm. **Hart** borrows this reading but must defend the Harm Principle against Devlin's claim that "immorality" itself is a harm to the social fabric.

  **3. The Conceptual Inevitability Thesis**
  *   **(a) Proposition:** All law necessarily rests upon and enforces some underlying moral framework, so the distinction is meaningless.
  *   **(b) Analysis:** *Can't* = Conceptual impossibility (to try to avoid it is to do it). *Legislate* = The entire legal apparatus. *Morality* = Critical morality (values of justice, rights, restraint).
  *   **(c) Verdict:** Platitude (True, but trivializes the debate).
  *   **(d) Engagement:** **Devlin** embraces this; he argues the law is already the guardian of the moral order. **Hart** accepts that law has moral roots but insists on distinguishing between the *positive* morality of the majority (which might be bigoted) and the *critical* morality used to judge the law itself.

  **4. The Epistemic/Pluralist Thesis**
  *   **(a) Proposition:** In a modern pluralistic society, there is no single, knowable "morality" sufficiently shared to be codified into law.
  *   **(b) Analysis:** *Can't* = Practical infeasibility. *Legislate* = Codification. *Morality* = Shared moral sentiment (the "man in the jury box").
  *   **(c) Verdict:** Substantive empirical thesis (Contestable).
  *   **(d) Engagement:** **Devlin** argues consensus *does* exist on fundamental issues (intolerance, indignation) and can be discerned by judges. **Hart** argues Devlin's "right-minded person" is a fiction that masks the tyranny of the majority over minorities.

  **5. The Moral Worth (Kantian) Thesis**
  *   **(a) Proposition:** Action compelled by law lacks moral worth, so legislating morality destroys the very value it seeks to promote.
  *   **(b) Analysis:** *Can't* = Logical contradiction of value. *Legislate* = Coercion. *Morality* = Autonomous duty.
  *   **(c) Verdict:** Philosophically robust but category error in this context.
  *   **(d) Engagement:** **Devlin** finds this irrelevant; he is a social functionalist concerned with cohesion, not individual sanctity. **Hart** finds this congenial regarding individual liberty, but it does not address Devlin's core claim about collective survival.

  ***

  ### On Self-Undermining and the Kantian Strand

  You sensed the slogan might be self-undermining. You were correct. If the statement "You can't legislate morality" is itself a moral claim about how the law *ought* to behave, then the speaker is advocating for the legislation of *their* morality (liberalism, autonomy, restraint) over *another* morality (conservatism, sanctity, tradition).

  *   **Is this decisive?** It feels decisive, but a Devlinian can absorb it. Devlin would say: "Precisely. You are trying to legislate your morality of non-interference. The only question is, whose morality wins?" He turns the objection into a confirmation of his thesis: law is always a battleground of moral claims.
  *   **Hart's Defense:** Hart avoids the trap by distinguishing *Critical Morality* (general moral principles used to criticize society) from *Positive Morality* (the actual customs of a group). He isn't saying "no morality in law"; he is saying "do not enforce *Positive* Morality without a *Critical* justification like harm."
  *   **The Kantian Strand:** Does the fact that coerced virtue is worthless kill Devlin? No. Devlin does not argue that legal compliance makes you *good*; he argues that widespread non-compliance makes society *impossible*. He is arguing from sociology, not ethics. If you raise Kant against Devlin, you are arguing past him. Save Kant for the discussion on liberty, not the discussion on social cohesion.

  ***

  ### How to Open the Session (And Earn the Nod)

  Your classmate earned the nod because they offered a conclusion that allowed everyone to stop thinking. To reclaim the room, you must not ask "What did you mean?" (which sounds like you didn't understand). You must ask "What work is that sentence doing?"

  **The Opening Script:**
  "Last week, we stopped on the claim that 'you can't legislate morality.' I've spent the week trying to figure out if that claim saves us from Devlin, or if it actually hands him the victory. Because if the claim means 'law always enforces some morality,' Devlin wins. If it means 'law ought not enforce morality,' we're just restating the Harm Principle without defending it. So, I want to propose we test the slogan against a hard case: Incest. If we ban it, are we preventing harm, or are we legislating morality? And if we say we can't legislate morality, are we saying the law is powerless, or that it's forbidden?"

  **Why this works:**
  1.  **It validates the slogan** before dissecting it (you aren't dismissing the classmate).
  2.  **It forces a choice** between the Readings (Inevitability vs. Prohibition).
  3.  **It returns to the text** (Devlin cares about the *fact* of enforcement; Hart cares about the *justification*).
  4.  **It avoids pedantry** by framing the analysis as a strategic check on Devlin's argument, rather than a semantic quibble.

  If you do this, you won't just be the student who asked for clarification. You'll be the one who realized the seminar had walked into a trap. Now, go do the reading.
