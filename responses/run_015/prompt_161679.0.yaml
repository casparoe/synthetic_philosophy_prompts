answer: |-
  Here is the honest engineering assessment of your requirements.

  ### The Bad News: You Have Contradictions
  You suspected Case 3 and Case 4 were the problem. You are right, but there is a deeper structural conflict involving Case 6.

  1.  **The Philosophical Conflict (Case 3 vs. Case 4):**
      In the profile you described (7 voters: M>B>O, 5 voters: B>O>M):
      *   **Case 3 (Condorcet):** M beats B (7-5) and M beats O (7-5). M is the Condorcet Winner. Your gut says **M wins**.
      *   **Case 4 (Consensus/Borda):** B is never ranked last. M is ranked last by 5 people. Your gut says **B wins**.
      *   **Verdict:** You cannot have both. In this specific profile, the tool must output either M or B. It cannot output both. For sprint planning, **Case 3 (Majority Rule)** is usually the safer default. If 7 engineers want to do M, overruling them to make the minority happier (B) creates resentment. **You should sacrifice Case 4.**

  2.  **The Structural Conflict (Arrow's Theorem):**
      You want a democratic system (Case 7: No Dictator) that respects unanimity (Case 1) and produces a consistent ranking (Case 6: Top 3 subset rule).
      *   **Case 6** is a strong version of **Independence of Irrelevant Alternatives (IIA)**. It demands that the relative ranking of M, B, and O depends *only* on how people rank M, B, and O, regardless of whether "Rust" is on the ballot.
      *   **Verdict:** Arrow's Theorem proves that if you keep Case 0, 1, 6, and 7, the only possible system is a **Dictatorship** (one person's ballot determines the outcome). Since you explicitly forbid that (Case 7), **you must sacrifice Case 6 (and Case 5).**

  ### The Sacrifice: What to Give Up
  **Give up Case 5 & 6 (Independence of Irrelevant Alternatives).**

  *   **Why?** It is the most abstract requirement and the least practical for a team tool.
  *   **What you lose:** Adding a "clone" option (Rust vs. Rust+Axum) *can* change the winner between M and B. Removing a losing option *can* change the ranking of the winners.
  *   **Why this is acceptable:** In sprint planning, options *are* related. If you split the "Rewrite" vote between two similar tickets, the "Bug Bash" might win. This is a feature, not a bug: it forces the team to consolidate similar tickets *before* voting. Do not run the vote until the ballot is clean.

  **Also give up Case 4 (Consensus) in favor of Case 3 (Majority).**
  *   **Why?** Case 3 aligns with Case 2 (Simple Majority). Case 4 allows a minority to block a majority preference if the majority's choice is "polarizing."
  *   **What you lose:** Sometimes a "safe" option (B) loses to a "bold" option (M) even if everyone likes B "okay."
  *   **Why this is acceptable:** Sprint planning requires decisive action. A clear majority preference (M) is more actionable than a broad consensus (B).

  ### The Surviving Rule
  You keep: Universal Domain (0), Pareto (1), Majority (2), Condorcet (3), Non-Dictatorship (7), Anonymity (8), Monotonicity (10).
  You satisfy Monotonicity (fixing your "12th voter" bug) and resolve Cycles deterministically (fixing your "hand-pick" bug).

  **The Algorithm: Ranked Pairs (Tideman Method)**
  1.  Count all pairwise preferences (M vs B, M vs O, B vs O).
  2.  Sort the pairs by the margin of victory (strongest majority first).
  3.  "Lock in" the pairs one by one, **unless** locking a pair creates a cycle (e.g., you already locked M>B and B>O, so you cannot lock O>M).
  4.  The final order is determined by the locked chains.

  **Handling Your Edge Cases:**
  *   **Partial Ballots:** If a voter skips B, exclude B from *that voter's* pairwise counts. Do not treat it as "last." (Denominator shrinks for that pair).
  *   **Cloning:** Acknowledge in your docs that similar tickets may split votes. Encourage ticket deduplication before voting.
  *   **Strategic Voting:** No system is immune (Gibbard-Satterthwaite Theorem), but Ranked Pairs is resistant. If one guy votes strategically (Favourite > Everyone Else), his vote is just 1 of 12. The pairwise majorities will drown him out unless the rest of the team is also split.
  *   **Ties:** Ranked Pairs produces a full ordering. If margins are exactly identical, use a deterministic tie-break (e.g., Ticket ID alphabetical). Do not hand-pick.

  ### The README Sentence
  > "We use the **Ranked Pairs** voting method: we lock in the strongest head-to-head majorities first, skipping any that create a cycle, to produce a ranking that best respects the team's pairwise preferences."

  ### Summary of Verdicts
  *   **Keep:** 0, 1, 2, 3, 7, 8, 9, 10, 11 (with deterministic tie-break).
  *   **Drop:** 4 (Consensus), 5 (IIA), 6 (Subset Consistency).
  *   **Reason:** You cannot have a non-dictatorial system that is immune to "clone" options (5/6) or always picks the "consensus" candidate over the "majority" candidate (3 vs 4). Ranked Pairs maximizes the number of "gut checks" you keep while remaining mathematically sound.
