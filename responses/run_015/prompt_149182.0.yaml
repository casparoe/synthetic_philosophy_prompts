answer: |-
  ### I. The Landscape of Diachronic Identity: Live Options and Contested Ground

  Before analyzing the Continuity Protocol, we must map the metaphysical terrain. In contemporary analytic philosophy, there is no consensus on the necessary and sufficient conditions for personal identity over time. However, specialists generally treat three to four frameworks as live options. It is crucial to distinguish the structural commitments of these views from the specific criteria that remain debated.

  **1. Psychological Continuity Theory (The Lockean/Parfitian Tradition)**
  *   **Core Claim:** Personal identity consists in the continuity of psychological states (memory, character, intentions, beliefs).
  *   **Settled:** Proponents agree that biological continuity is not *necessary* for identity (e.g., in brain-upload or hemisphere-division thought experiments).
  *   **Contested:** The nature of the connection. Is it direct memory access (Locke), or overlapping chains of psychological connectedness (Parfit)? Furthermore, it is contested whether this relation is transitive (if A=B and B=C, must A=C?) and how to handle "branching" cases (if my psychology splits into two successors, do I survive as both, neither, or is identity the wrong concept?).

  **2. Biological Animalism (The Olsonian View)**
  *   **Core Claim:** We are fundamentally human organisms. Personal identity is strictly identical to biological organismic continuity.
  *   **Settled:** Biological continuity is sufficient for identity.
  *   **Contested:** Whether psychological changes (e.g., severe dementia, radical personality shift) can terminate the existence of the *person* while the *organism* remains. Animalists generally argue the person persists as long as the animal does, but opponents argue this violates our intuitive moral practices regarding responsibility and care.

  **3. Narrative Self Theory (The Dennettian/Schechtman View)**
  *   **Core Claim:** The self is not a metaphysical substance but a "center of narrative gravity." Identity is constituted by the ability to integrate experiences into a coherent, evolving story.
  *   **Settled:** Narrative coherence plays a significant role in how we *identify* persons and attribute responsibility.
  *   **Contested:** Whether narrative is constitutive of identity itself or merely epistemic (how we know who is who). It is also contested whether a fragmented narrative implies the cessation of the self or merely a disordered one.

  **4. Reductionism / The "What Matters" View**
  *   **Core Claim:** Strict diachronic identity is a further fact that does not exist. What matters for survival and ethics is the degree of psychological connectedness and continuity (Relation R).
  *   **Settled:** That connectedness comes in degrees.
  *   **Contested:** Whether legal and moral practices should track these degrees directly or impose a binary threshold for pragmatic reasons.

  *Note:* There is no consensus that any single one of these is true. The "Simple View" (identity is a brute, unanalyzable fact) also retains defenders. Consequently, any institutional policy must implicitly choose a side, thereby encoding a controversial metaphysical stance into law.

  ---

  ### II. Reconstructing the Implicit Theory of the Continuity Protocol

  The Continuity Protocol is not metaphysically neutral. By explicitly excluding biological continuity and adopting a weighted multi-axis scoring system, it commits to a specific, hybrid conception of agency.

  **1. The Metaphysical Commitments**
  *   **Anti-Animalism:** The explicit exclusion of biological continuity rejects Biological Animalism. The protocol asserts that the human organism is not the bearer of rights and liabilities; the *agent* is.
  *   **Functionalist Agency:** The double weighting of **Predictive Behavioral Threading** reveals a functionalist commitment. It prioritizes the capacity to execute future plans and maintain behavioral consistency over the retention of past content. This aligns with a decision-theoretic view of agency: an agent is defined by its optimization processes, not just its history.
  *   **Constitutive Externalism:** The **Relational Recognition** axis implies that identity is partially constituted by social facts. If close others do not recognize the agent, the agent's continuity is diminished. This rejects the "Simple View" that identity is an internal, private fact.
  *   **Pragmatic Reductionism:** The use of a **Threshold** to render a binary ruling (persist/dissolve) from graded inputs acknowledges the Parfitian insight that continuity comes in degrees, but imposes a binary legal fiction for administrative closure.

  **2. Alignment with Existing Theories**
  The Protocol does not align purely with Dennett's Narrative Self. While **Autobiographical Coherence** tracks narrative, the double weighting of **Predictive Threading** shifts the focus from *story* to *function*. A Dennettian view might prioritize the coherence of the narrative even if predictive power is low (e.g., a consistent but incapacitated self). The Protocol prioritizes the *reliability* of the self.

  It is best described as a **Responsibility-Tracking Psychological Continuity** view. It combines:
  *   *Psychological Continuity:* (Autobiographical and Normative axes).
  *   *Functionalism:* (Predictive Threading).
  *   *Social Externalism:* (Relational Recognition).

  **3. Philosophically Loaded vs. Administratively Convenient**
  *   **Loaded:**
      *   *Excluding Biology:* This is a substantive metaphysical claim that personhood is separable from organismhood.
      *   *Double Weighting Prediction:* This asserts that future reliability is more constitutive of identity than past history. This is a normative claim about the *purpose* of identity attribution (facilitating future coordination vs. acknowledging past existence).
      *   *The Threshold:* This treats a gradual spectrum of psychological connectedness as a binary ontological switch.
  *   **Convenient:**
      *   *Using "Close Others" for Relational Data:* This is an epistemic shortcut. Metaphysically, recognition matters; practically, asking family is cheaper than longitudinal observation.
      *   *The Specific Threshold Value:* Where the line is drawn is arbitrary, though the existence of a line is philosophically motivated by legal necessity.

  **4. Coherence of the Axes**
  The four axes are philosophically underdetermined. They license rival interpretations of what the board is actually measuring.
  *   *Interpretation A (Ontological):* The board is discovering whether the *same person* exists.
  *   *Interpretation B (Normative):* The board is deciding whether it is *fair and useful* to treat the individual as the same person.
  The tension lies in **Autobiographical Coherence** (backward-looking) versus **Predictive Threading** (forward-looking). If a patient has no memory of the past (low autobiography) but behaves predictably according to prior commitments (high threading), the Protocol rules they persist. This suggests the board is not tracking *identity* in the Lockean sense, but *agency capacity* in the functionalist sense. The axes do not hang together as a single metaphysics; they hang together as a policy for managing risk and obligation.

  ---

  ### III. Assessment of Internal Consistency and Alternative Metaphysics

  **1. The Forward/Backward Tension**
  The Protocol contains a significant internal tension regarding criminal liability.
  *   **Criminal Liability** is inherently backward-looking (retributive or restorative). It asks: "Did *you* commit this act?" This typically requires Psychological Continuity (memory/intention) or Biological Continuity.
  *   **Predictive Threading** is forward-looking. It asks: "Will *you* fulfill this contract?"
  *   **The Conflict:** By weighting Predictive Threading double, the Protocol prioritizes future reliability over past connection. If a patient has low autobiographical coherence (does not remember the crime) but high predictive threading (is stable and predictable now), the Protocol rules they are the "same agent."
  *   **Implication:** This licenses punishing an entity that does not psychologically identify with the past actor, solely because the entity is functionally continuous enough to bear the burden. This is consistent with a consequentialist theory of punishment (deterrence/incapacitation) but inconsistent with a retributive theory (desert). The Protocol implicitly adopts a consequentialist view of liability while using the language of identity.

  **2. Impact of Alternative Metaphysics**
  If the underlying metaphysical view were changed, the Protocol would require fundamental redesign, not merely parameter tuning.

  *   **Scenario A: Biological Essentialism (Animalism)**
      *   **Required Change:** Discard all four axes.
      *   **Procedure:** Identity is determined solely by DNA or organismic continuity.
      *   **Consequence:** Radical personality alteration becomes irrelevant. The post-therapy individual retains all obligations and liabilities simply by being the same living body. Guardianship would never be initiated on grounds of personality change; only biological death or permanent vegetative states would trigger estate dissolution.
      *   **Philosophical Shift:** This removes the "agency" component entirely. The law tracks organisms, not persons.

  *   **Scenario B: Eliminativism / No-Self (Momentary View)**
      *   **Required Change:** Abolish the concept of persistence.
      *   **Procedure:** There is no "same agent." Every significant psychological shift creates a new legal entity.
      *   **Consequence:** Contractual obligations and criminal liabilities do not transfer. The "estate" of the pre-therapy person is liquidated upon therapy. The post-therapy person begins with a clean slate. Guardianship is not a temporary measure for "dissolved identity" but the default state for all agents, as no one persists long enough to hold long-term rights.
      *   **Philosophical Shift:** This aligns with a strict Parfitian reductionism where "identity" is replaced by "successorship." The Threshold rule becomes obsolete because there is no binary persistence to measure.

  **3. Settled vs. Contested in this Context**
  *   **Settled:** It is settled that different metaphysical views yield different moral and legal outcomes. It is also settled that psychological connectedness comes in degrees (Parfit).
  *   **Contested:** It is genuinely contested whether legal personhood *ought* to track biological organisms or psychological agents. It is also contested whether a "threshold" model is a legitimate pragmatic fiction or a violation of rights (i.e., is it just to declare a person "dead" because they score 0.49 on a continuity scale?).

  ### IV. Conclusion

  The Continuity Protocol presupposes a **Functional-Psychological Hybrid** theory of identity. It treats the self not as a static substance, but as a dynamic system of prediction and obligation. However, it conflates *ontological persistence* with *normative reliability*. By weighting predictive threading over autobiographical coherence, it privileges the needs of the social system (predictability) over the metaphysical intuition of the agent (memory/narrative).

  This is internally consistent only if one accepts that the primary purpose of legal identity is the facilitation of future coordination, rather than the accurate tracking of moral desert. If the jurisdiction intends to uphold retributive justice, the Protocol is flawed: it may hold a "new" person liable for an "old" person's crimes based merely on behavioral predictability. To resolve this, the board would need to decouple the criteria: use Autobiographical/Normative axes for criminal liability (backward-looking) and Predictive/Relational axes for contractual obligations (forward-looking). As it stands, the Protocol optimizes for administrative stability at the cost of metaphysical precision.
