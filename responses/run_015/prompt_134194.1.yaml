answer: |-
  When we approach Bong Joon-ho's Parasite through the lens of Ian Hacking's concept of interactive kinds, we are asked to consider whether the classification of a group of people changes the people themselves. Hacking distinguishes between indifferent kinds, like quarks, which remain unchanged by our labeling of them, and interactive kinds, like mental health diagnoses or social identities, where the label loops back into the behavior and condition of the classified. In Parasite, the recurring motif of smell functions precisely as such an interactive kind, yet it operates with a visceral materiality that complicates the theory. The smell that Mr. Park associates with the Kim family is not merely a descriptive property of their hygiene; it is a boundary marker that essentializes their class status. When Mr. Park identifies the odor as something that crosses the line, he is not just observing a sensory fact but enforcing a social category. This classification creates a feedback loop wherein being identified as someone who smells of the semi-basement restricts the Kims to the economic conditions that produce the smell, thereby reinforcing the validity of the classification. The film suggests that the smell is an interactive kind because the social reaction to it—the disgust, the distancing, the refusal to hire or integrate—ensures that the classified remain in the damp, radish-boiling environments that generate the odor in the first place.

  The scene where Ki-taek hides beneath the living room table serves as the philosophical pivot point for this reading. Lying in the dark, listening to Mr. Park discuss the smell with his wife, Ki-taek realizes that the odor is the one barrier his cunning and deception cannot overcome. Mr. Park describes the smell as distinct from cleaning products or soap, locating it in the very fabric of the person. In this moment, the classification becomes real for Ki-taek not because he suddenly smells different, but because he understands that the smell has become an essentialized kind-marker that overrides all other traits. He is no longer a skilled driver or a father trying to provide; he is instantiated as a member of the kind people who smell like the subway. This realization is crucial because it shows the power of the interactive kind to define the subject's reality. The classification limits his possible actions; he understands that no amount of performance can scrub away the social meaning of the odor. The smell is not just a biological fact here; it is a social verdict that dictates his position in the hierarchy. However, the film does not allow us to rest comfortably in the idea that this is purely constructed. The smell is materially grounded in the floodwaters and the mold of the semi-basement. If the film argued that the smell was purely in Mr. Park's head, it would be a story about prejudice. Instead, it shows a world where the material conditions of poverty produce a sensory reality that the wealthy then use to justify exclusion.

  This tension comes to a head during the birthday party climax, where the interactive kind collapses into violence. When Mr. Park recoils from the smell of Geun-se, the man who has been living in the bunker, and later when he reacts to Ki-taek while reaching for the car keys, the disgust is pre-cognitive. It is a bodily reaction that bypasses reason. Here, the film risks slipping into treating the odor as a natural biological fact that merely reveals pre-existing class rather than constructing it. If the smell is an inevitable biological consequence of poverty, then the kind is indifferent, merely tracking a physical reality. However, the film argues that the significance of the smell is what makes it interactive. The odor becomes the trigger for violence because it represents the intrusion of the lower kind into the space of the higher kind. Ki-taek kills Mr. Park not because he is hungry or angry about the money, but because the look of disgust on Mr. Park's face confirms that Ki-taek will never be anything other than the thing that smells. The classification becomes a self-fulfilling prophecy of violence. The social interaction—the grimace, the pinch of the nose—produces the rage that fulfills the stereotype of the dangerous poor. Thus, the film maintains the interactive loop even in its most brutal moments; the reaction to the kind produces the behavior associated with the kind.

  Yet, there is a profound ambiguity in whether the film ultimately treats the smell as a constructed kind that becomes real or a natural fact that is exploited. On one hand, the narrative structure insists that if the Kims had money, they would not smell, suggesting the odor is contingent on material conditions rather than intrinsic biology. On the other hand, the cinematography and sound design treat the smell as an atmospheric presence, almost a character itself, that permeates the semi-basement regardless of the occupants' efforts. This suggests a material realism that resists pure social constructionism. The film does not distort the philosophy to fit the narrative because it holds these two truths in suspension. The smell is materially real, generated by dampness and cheap food, but it becomes an essentialized kind-marker through the social interactions of the wealthy who refuse to touch it. The feedback loop is not that the label creates the smell directly, but that the label enforces the segregation that maintains the smell. This is a subtle but vital distinction for the theory of interactive kinds. It shows that interaction does not require the classified to change their internal psychology, as Hacking often discussed with reference to suicide rates or mental illness, but can operate through spatial and economic confinement. The kind modifies the environment of the classified, which in turn modifies the properties of the classified.

  What Parasite adds to the debate about interactive kinds that pure philosophical argument misses is the affective dimension of disgust. Philosophical discourse often treats classification as a cognitive or linguistic act, a matter of labeling and definition. The film demonstrates that classification is also sensory and visceral. The interactive loop is powered not just by laws or economic policies but by the involuntary recoil of the nose. This pre-reflective disgust makes the kind feel natural and immutable, even when it is socially produced. The film forces the viewer to confront the physicality of social boundaries, showing how an interactive kind can be felt in the gut before it is understood by the mind. This sensory layer adds weight to the theory, suggesting that interactive kinds are most powerful when they bypass reason and operate through affect. I am highly confident in this reading of the film's sensory politics and its alignment with the feedback loops described in social constructionism. The point I am least sure of is whether Hacking's framework can fully accommodate a sensory marker like smell as a kind in itself, rather than merely a property of the kind class, since the theory traditionally focuses on human categories defined by language and institutions rather than olfactory experiences that precede language.
