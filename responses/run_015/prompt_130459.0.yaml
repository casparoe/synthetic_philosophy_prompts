  **Reconstruction of the implicit stance-theory**

  The institutional practice implicitly relies on a hierarchy of explanatory stances, reminiscent of Daniel Dennett's framework. It treats metabolic disorders like diabetes as phenomena fully capturable via the physical stance because their pathological identity is constituted by chemical deviations regardless of function. Conversely, it treats mental disorders as patterns that only emerge at the level of information processing or subjective experience. The rejection of cytokine-only depression research suggests that depression is not a natural kind defined by matter, but a functional kind defined by role. The implicit theory posits that real patterns are stance-relative. A pattern is real if it supports prediction and explanation from a specific level of abstraction. For diabetes, the physical level suffices. For depression, the physical level loses the pattern; the noise overwhelms the signal unless interpreted through the lens of belief, desire, or neural computation. Thus, the institution presupposes that mental disorders are real patterns only visible from the design or intentional stance. To reduce them to the physical stance is to lose the object of study entirely, akin to describing a software bug solely by voltage fluctuations without referencing the code. This explains why purely biomarker-based proposals are rejected as conceptually confused: they fail to latch onto the real pattern that constitutes the disorder. The practice assumes that while the brain is physical, the mind is a functional organization of that physics. Therefore, a diagnosis excluding the patient's perspective ignores the constitutive elements of the pathology. The asymmetry rests on the claim that mental disorders are disturbances of agency and meaning, which are invisible to instruments measuring only matter in motion. Furthermore, this theory assumes multiple realizability. No single cytokine profile equals depression across all patients. Therefore, the physical pattern is not robust. The intentional stance captures the invariant pattern despite physical variance. The implicit theory is a non-reductive physicalism where higher-level patterns have ontological weight. The practice assumes that causal powers reside at the level of the pattern, not just the substrate. If you ignore the intentional content, you aren't studying depression; you're studying inflammation. When reviewers call a proposal conceptually confused, they imply the researcher is committing a category mistake. They are treating a functional failure as a structural failure. This reinforces the view that the disorder's identity conditions are tied to the intentional stance. Without the subject's report of suffering, the biological markers are merely anomalies. Consequently, the physical stance is viewed as insufficient for individuating the clinical entity. Ultimately, the institutional gatekeeping functions to preserve the integrity of the mental as a distinct explanatory level.

  **Strict presuppositions versus compatible theories**

  The practice strictly requires that the individuation of mental disorders references the design or intentional stance. It mandates that biomarkers alone are insufficient for diagnosis because they do not capture the disorder's identity conditions. However, it does not strictly presuppose substance dualism. The institution remains compatible with a consistent physicalist ontology, provided it is non-reductive. A physicalist can argue that mental patterns, though wholly physically realized, are only tractable or meaningful when described at higher levels of abstraction. This view holds that while neurons cause feelings, the pattern of depression disappears if one looks only at neurons without interpreting their functional role. Thus, the practice accommodates eliminationism only if the elimination targets the description, not the phenomenon. It forbids replacing the patient's narrative with a blood test, but it does not forbid the blood test from being part of the causal story. The key distinction lies between ontological commitment and methodological necessity. The institution does not require that mental states are non-physical substances; it requires that they are non-reducible patterns. This allows for a compatibilist view where physical causes underpin mental effects, but the classification remains functional. Strictly, the practice presupposes that the intentional stance is indispensable for prediction and control in psychiatry. It does not presuppose that the physical stance is false, only that it is inadequate for this specific domain. Therefore, a researcher can be a thoroughgoing physicalist and still accept these funding rules, arguing that the complexity of the brain makes the physical stance computationally intractable for diagnosis. The rules enforce a methodological pluralism that respects the emergent nature of psychopathology without denying its physical base. Crucially, the practice permits biomarkers as adjuncts for monitoring treatment response, but strictly prohibits them as definitional criteria. This distinguishes the strict requirement from compatible theories. The charge of conceptual confusion implies a category error, not a factual error. It suggests that defining depression physically is like defining a marriage license chemically. The paper trail matters, not the ink. Similarly, the experience matters, not just the chemistry.

  **Assessment of the mental-metabolic asymmetry**

  The asymmetry is philosophically justified because mental disorders are essentially evaluative concepts involving suffering and agency, whereas metabolic disorders are mechanical failures. One can have high glucose without immediate subjective harm, but depression conceptually entails distress or functional impairment. Therefore, excluding the subjective element dissolves the phenomenon. This aligns with the harmful dysfunction analysis, where mental disorder requires both biological failure and social or subjective harm. However, an unexamined institutional habit persists regarding the rigidity of this boundary. As neuroscience advances, certain depressive subtypes may prove to be biologically distinct entities comparable to diabetes, rendering the intentional stance secondary for those specific cases. Currently, the distinction holds because mental implies mind, necessitating the intentional stance. Yet, the refusal to consider purely biological phenotypes might hinder discovery of somatic subtypes of depression. The justification relies on the current definition of psychopathology as harm-based dysfunction. If we redefine depression as a neural circuit error, the asymmetry weakens. But until then, the practice correctly identifies that mental disorders are patterns of living, not just patterns of chemistry. The habit lies in assuming this will never change, rather than treating it as a contingent fact of current scientific granularity. Furthermore, maintaining the asymmetry protects patients from reductionist harms, ensuring their lived experience remains central to care. Ignoring the intentional stance risks treating patients as broken machines rather than agents. Thus, while the boundary may shift with science, the current asymmetry respects the normative dimensions inherent in psychiatric diagnosis that are absent in endocrinology. Consequently, the asymmetry is currently rational, though it must remain open to empirical revision should biological markers achieve sufficient specificity.

  **Consequences of a symmetric physical-stance framework**

  Adopting a symmetric framework would radically alter diagnostic criteria, replacing symptom checklists with biomarker thresholds. Funding rules would shift from psychological interventions to pharmacological corrections of physical anomalies. However, this framework risks conceptual incoherence. If depression is defined solely by cytokine profiles, the phenomenon of sadness becomes incidental. We would no longer be studying depression, but rather a specific inflammatory state that often co-occurs with sadness. This would dissolve the very phenomenon being studied, as the intentional content is constitutive of the disorder. The category depression would fragment into multiple biological entities, losing its utility for clinicians treating suffering. Such a framework is only coherent if we rename the conditions to reflect their physical nature, abandoning the mentalistic terminology. Until then, a physical-stance-only account fails to capture the disorder's essence. It treats the correlate as the cause and the definition. The result would be a category mistake institutionalized. We might cure the inflammation but miss the existential distress. Thus, symmetry here is not progress but elimination. It solves the asymmetry by removing the mental from mental health. This renders the framework conceptually unstable for psychiatry, which is defined by its focus on the mind. A symmetric approach might work for neurology, but psychiatry's subject matter resists full physicalization without loss of meaning. Furthermore, patient agency would be erased from the clinical encounter. Treatment would become purely passive management of biology. This undermines the therapeutic alliance. The framework is coherent only if we accept that mental disorder was a misnomer all along. Ultimately, the symmetric framework demands a redefinition of the field itself. It transforms psychiatry into a branch of immunology. While scientifically bold, it abandons the phenomenological reality that brings patients to care.
