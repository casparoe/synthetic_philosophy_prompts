      *   *Point 1: The Induction Problem.* You can't distinguish a TM from a Hypercomputer on finite data. This makes the claim empirically idle *unless* we have a theoretical model of the machine that *entails* hypercomputation (like a GR black hole computer).
      *   *Point 2: The Noise/Precision Objection.* If the universe is discrete or noisy, analog hypercomputation fails. If this is a necessary truth about physics, PCTT isn't contingent.
      *   *Point 3: Relativistic Computers.* This is the strongest empirical angle. If the universe allows closed timelike curves or specific black hole geometries, PCTT is false. Since cosmology is empirical, PCTT is empirical.
