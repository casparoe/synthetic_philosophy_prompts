answer: |-
  ### Preliminary Analysis: Mechanisms of Distortion and Perception

  Before establishing the desiderata for Normative Preference Filtration, the following four mechanisms illustrate the dual nature of psychological processes. Each can function as a distorting bias or a legitimate component of moral perception depending on context and integration.

  1.  **Emotional Salience**
      *   *Distortion Case:* The **Identifiable Victim Effect**. An agent donates massively to save one named child falling in a well but ignores statistical policies that would save thousands of unnamed children. The salience drives resource allocation inconsistent with the agent's own principle of maximizing welfare.
      *   *Legitimate Case:* **Moral Outrage**. An agent feels visceral disgust at an act of torture. Without this emotional salience, the agent might view torture merely as an inefficient policy. The emotion signals a violation of dignity that abstract calculation might miss.

  2.  **In-Group Loyalty**
      *   *Distortion Case:* **Nepotistic Corruption**. A hiring manager selects a less qualified cousin over a superior stranger for a public office role. The loyalty overrides the public commitment to merit and fairness.
      *   *Legitimate Case:* **Special Obligations**. A parent prioritizes feeding their own child over a stranger's child when resources are scarce. This partiality is not a bias to be corrected but a constitutive element of the moral duty of care within relationships.

  3.  **Status-Quo Bias**
      *   *Distortion Case:* **Systemic Inertia**. An agent opposes changing a law because "it has always been this way," despite evidence that the law causes harm. The preference for the default state blocks moral improvement.
      *   *Legitimate Case:* **Presumption of Stability**. An agent hesitates to overthrow a functioning institution because radical change risks chaos and unintended suffering. Here, the bias functions as a prudential check on rash utopianism, preserving social trust.

  4.  **Adaptive Preference Formation**
      *   *Distortion Case:* **Internalized Oppression**. An agent in a coercive hierarchy claims to prefer their subordinate role, having adjusted their desires to match what is possible. Filtration must identify this as a distortion of autonomy.
      *   *Legitimate Case:* **Resilient Contentment**. An agent in difficult circumstances adjusts expectations to maintain mental health and agency (e.g., finding joy in small goods when large goods are unavailable). This is a rational coping strategy, not necessarily a false consciousness.

  ***

  ### Desiderata for Normative Preference Filtration

  Any adequate theory aiming to filter normative preferences must satisfy the following conditions. These are divided into Explanatory Phenomena, Consistency Conditions, and Structural Tensions.

  #### I. Explanatory Phenomena
  The theory must account for specific classes of judgment where the line between bias and commitment is contested. For each, it must preserve a specific distinction; collapsing this distinction constitutes a theoretical failure.

  | # | Phenomenon | The Distinction to Preserve | Failure Mode if Collapsed |
  | :--- | :--- | :--- | :--- |
  | **1** | **Interest-Tracking vs. Principle-Tracking**<br>(Agents endorsing views that align with their social position.) | The theory must distinguish between a judgment held *because* it benefits the agent (causal explanation) and a judgment held *despite* cost to the agent (evidence of principle). | **Cynical Reductionism:** If all position-aligned judgments are dismissed as bias, the theory cannot account for genuine moral consensus among privileged groups. If none are dismissed, the theory cannot critique ideology. |
  | **2** | **Bias vs. Moral Substance**<br>(Cases where correction eliminates all preferences.) | The theory must distinguish between *procedural artifacts* (framing, order effects) and *substantive values* (core commitments). Filtering must remove the noise without silencing the signal. | **Moral Nihilism:** If the filtration process is too aggressive, it leaves the agent with no actionable preferences, rendering moral agency impossible. |
  | **3** | **Emotional Noise vs. Moral Signal**<br>(Salience operating as bias in one domain, perception in another.) | The theory must distinguish between emotion that *obscures* relevant features (e.g., fear blocking risk assessment) and emotion that *reveals* relevant features (e.g., empathy revealing suffering). | **Sterile Rationalism:** If all emotional influence is treated as bias, the theory loses access to the phenomenological data of moral experience. |
  | **4** | **Consensus vs. Convergence**<br>(Collective distortion where groups share judgments no individual would hold alone.) | The theory must distinguish between *shared norms* (reflectively endorsed by the group) and *pluralistic ignorance/groupthink* (privately rejected but publicly maintained). | **Mob Epistemology:** If group consensus is taken as validation, the theory cannot critique widespread social injustices. If ignored, it cannot account for the validity of democratic deliberation. |

  #### II. Consistency Conditions
  The theory must remain compatible with empirical findings and meta-ethical constraints.

  1.  **Accommodation of Heuristics and Framing**
      *   **Requirement:** The theory must acknowledge that moral judgment is frequently driven by fast, intuitive processes (System 1) rather than slow deliberation (System 2).
      *   **Constraint:** It cannot demand that agents be constantly aware of their cognitive processes to have valid moral preferences. It must allow for *implicit* validity. A preference is not invalid simply because the agent cannot articulate the psychological origin of the judgment, provided the judgment survives reflective scrutiny when challenged.

  2.  **Condition for Moral Progress (Revisability)**
      *   **Requirement:** The theory must specify how a preference can be identified as "distorted" relative to a standard that the agent does not currently accept.
      *   **Constraint:** Progress cannot be defined merely as "change." There must be a directional vector (e.g., increased coherence, expanded scope of concern, reduced contradiction). The theory must allow that an agent can be wrong about their own best interests or moral duties even after reflection.

  3.  **Compatibility with Reasonable Pluralism**
      *   **Requirement:** The theory must distinguish between *bias* and *divergent fundamental values*.
      *   **Constraint:** It cannot treat every disagreement as a cognitive failure on one side. If two agents have different weightings of liberty vs. security, this is a value conflict, not necessarily a filtration error. The theory must provide criteria for when a disagreement is due to distorted processing versus distinct axiomatic commitments.

  #### III. Structural Tensions (Jointly Unsatisfiable Desiderata)
  There are pairs of desiderata that create deep structural tensions. An adequate theory must acknowledge these trade-offs rather than claiming to resolve them perfectly.

  | Tension | Conflicting Desiderata | Explanation of the Problem |
  | :--- | :--- | :--- |
  | **1** | **First-Person Transparency** vs. **Structural Invisibility** | *Transparency:* Agents must be able to recognize their own biases to filter them.<br>*Invisibility:* Many biases (e.g., implicit association, structural ideology) are by definition invisible to the holder.<br>**Tension:** If a bias is structurally invisible, the agent cannot reflectively endorse the filtration of it. Relying on self-report fails; relying on external correction risks paternalism. |
  | **2** | **Respect for Agency** vs. **Correction of Adaptive Preferences** | *Agency:* An agent's stated preferences should be treated as authoritative expressions of their will.<br>*Correction:* Preferences formed under coercion or deprivation (adaptive) should be discounted.<br>**Tension:** To correct an adaptive preference is to tell the agent, "You do not really want what you say you want." This undermines the very agency the theory seeks to protect. A theory that prioritizes correction risks becoming authoritarian; one that prioritizes agency risks validating oppression. |

  #### IV. Comparative Assessment of Existing Approaches
  This section indicates how three broad families of normative theory fare against the desiderata above. This is not a comprehensive critique but an exposure of fault lines.

  | Approach | Most Likely Violated Desideratum | Explanation of Vulnerability |
  | :--- | :--- | :--- |
  | **Preference-Satisfaction**<br>(Welfarist/Utilitarian variants) | **Correction of Adaptive Preferences** (Tension 2) | This approach typically takes revealed preference as the metric of value. It struggles to distinguish between a genuine desire and one adapted to unjust constraints without importing an external standard of "true" welfare, which contradicts its subjectivist foundations. It risks collapsing the distinction between *wanting* and *good*. |
  | **Kantian Rationalist Coherence**<br>(Deontological/Procedural variants) | **Emotional Noise vs. Moral Signal** (Phenomenon 3) | This approach often treats emotion as a source of heteronomy or noise to be filtered out by reason. It risks violating the requirement to recognize legitimate moral perception (e.g., care, outrage) that is emotionally constituted. It may over-correct, leading to the "Moral Nihilism" failure mode where substantive human concerns are discarded as non-rational. |
  | **Contextualist Care-Ethical**<br>(Relational/Particularist variants) | **Consensus vs. Convergence** (Phenomenon 4) | This approach grounds morality in local relationships and specific contexts. It struggles to identify collective distortion (e.g., a community collectively endorsing a harmful practice) because it lacks a transcendent standard to critique shared local norms. It risks collapsing the distinction between *shared norms* and *groupthink*, validating local bias as "care." |

  ### Summary of Framework Requirements
  To succeed, Normative Preference Filtration must operate as a **procedural hybrid**. It cannot rely solely on internal reflection (due to Structural Invisibility) nor solely on external correction (due to Respect for Agency). It must define a **reflective equilibrium** that is dynamic rather than static, allowing for the possibility that a preference is valid even if its origin is biased, provided it survives counterfactual testing (e.g., "Would I hold this view if I were in the other social position?"). The theory must explicitly map the boundary where *psychological explanation* ends and *normative justification* begins, acknowledging that the two are intertwined but not identical.
