  **(Self-Correction Note):** I need to be careful with the "Intrapersonal Test." If a theorist aggregates intrapersonally but not interpersonally, they are a "Separateness of Persons" theorist. If they aggregate neither, they might be a risk-averse prioritarian or a strict egalitarian. If they aggregate both, they are a standard utilitarian/aggregate consequentialist. The *stall* often occurs because Taurekians deny interpersonal aggregation *based on* the separateness of persons, while Aggregators argue that separateness doesn't block moral summation.

