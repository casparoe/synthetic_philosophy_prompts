          *   Formalizing the "Composition of Claims" (e.g., Scanlon's contractualism, Otsuka's rights).
          *   Shifting from "Who is right?" to "Under which description does this dilemma fall?" (e.g., Emergency Triage vs. Policy).
      *   *Why no final resolution?* Because it touches on the fundamental structure of moral agency and the metaphysics of value. It's a "deep pluralism."

  6.  **Drafting the Response (Iterative refinement):**
