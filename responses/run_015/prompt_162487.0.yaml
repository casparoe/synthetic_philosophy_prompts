      *   *Taurek (1977):* "Should the Numbers Count?" Argues against aggregation. Saving 5 doesn't outweigh saving 1 because there is no "super-entity" suffering the loss of 5. Loss is experienced individually. Lottery is fair.
      *   *Aggregators (Kamm, Scanlon, Parfit, etc.):* Argue that numbers *do* count. Either via impersonal value (Utilitarianism) or via individual claims that sum up/interact (Contractualism, Rights-based).
      *   *The Stall:* Both sides seem to talk past each other. Aggregators say "It's obvious 5 > 1." Taurekians say "It's obvious you can't compare losses across persons."

  3.  **Evaluate the User's Hypothesis:**
      *   *Allocative vs. Axiological:* This is crucial. Is it about *fairness* (giving each a chance) or *goodness* (maximizing lives)? Taurek leans fairness/agent-centered; Aggregators lean outcome goodness or cumulative claims.
      *   *Axiology vs. Decision Procedure:* Can one believe 5 deaths is worse (axiology) but still flip a coin (procedure) due to fairness constraints? Yes. This distinction is often blurred.
      *   *Standpoint (Rescuer vs. Impersonal):* Taurek emphasizes the agent's relationship to the individuals. Aggregators often step back to a "view from nowhere" or a general principle.
      *   *Intrapersonal Test:* This is a classic move (Parfit used similar reductions). If someone aggregates intrapersonally but not interpersonally, they are committed to the "Separateness of Persons" as the blocking factor. If they don't aggregate even intrapersonally, they might be risk-averse or have a different theory of value.

  4.  **Synthesize a Diagnosis:**
      *   **Verdict on the Nature of Disagreement:** It is *not* merely verbal, but it *is* "several questions under one heading." It's a *cluster concept* problem. The "Numbers Question" conflates metaphysics (composition of value), normative ethics (fairness vs. goodness), and decision theory (risk/uncertainty).
      *   **The Core Friction:** The "Separateness of Persons" is the bedrock, but it's interpreted differently.
          *   Aggregators see it as a fact about *where* value resides, but not a barrier to *summing* claims.
          *   Taurekians see it as a metaphysical barrier to *comparability* of losses across distinct entities.
      *   **The "Composition" Problem:** How do individual moral claims compose into a collective obligation? This is the hidden formal question. Is morality additive?

  5.  **Address the "Progress" Question:**
      *   *Can it be resolved?* A total consensus is unlikely because it rests on fundamental intuitions (like the Intrapersonal Test results).
      *   *What counts as progress?*
