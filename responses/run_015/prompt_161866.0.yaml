answer: |-
  This is a remarkably sharp observation. You have identified a tension that lies at the heart of contemporary debates in epistemology and the philosophy of language, often missed by those who focus solely on the abstract conditions of the speaker (truth, belief, knowledge) rather than the social dynamics of the speech act.

  To answer your primary question: **Yes, this is widely considered a genuine norm of assertion, but it is usually framed not as a condition on the *proposition*, but as a condition on the *speaker's status* within a community.**

  Here is a breakdown of how philosophy categorizes what you are seeing, the names attached to it, and how it handles the edge cases you raised.

  ### 1. Does it have a name?

  There is no single universally agreed-upon label, but the phenomenon clusters around three concepts:

  *   **The Responsibility Norm (or Commitment Norm):** Most famously associated with **Robert Brandom**. He argues that to assert is not merely to describe the world, but to undertake a *commitment*. When you assert $p$, you license others to use $p$ as a premise in their own reasoning. Consequently, you incur an obligation to justify $p$ if challenged. Your colleagues are criticizing the speakers for undertaking a commitment they are not prepared to honor.
  *   **The Understanding Norm:** Some epistemologists (e.g., **Alison Hills**, **Duncan Pritchard**) distinguish between *knowledge-that* (propositional knowledge) and *understanding-why*. Your technician case is a classic example of someone who has reliable knowledge-that (the result is true and reliably produced) but lacks understanding-why (the mechanism). Many argue that in professional contexts, assertion requires understanding, not just knowledge.
  *   **Epistemic Authority:** This frames the issue as one of standing. To assert in a seminar or lab meeting is to claim a certain authority. If you cannot defend the claim, you are claiming an authority you do not possess, even if the claim happens to be true.

  ### 2. Is it a Norm of Assertion or Something Else?

  You ask whether this is a norm of assertion, a norm of inquiry, or a matter of character. The strongest philosophical view aligning with your intuition is that **it is constitutive of assertion in collaborative contexts.**

  On the **Knowledge Norm** (championed by Timothy Williamson), the rule is: *Assert $p$ only if you know $p$.*
  Your examples suggest this is insufficient. The postdoc likely *knows* (true, believed, reliable source); the technician *knows* (reliable process). Yet the assertions are defective.

  The alternative view (Brandomian or "Inferentialist") is that assertion is a move in a "game of giving and asking for reasons."
  *   **The Norm:** *Assert $p$ only if you are prepared to provide reasons for $p$ or defer to a specific source of reasons.*
  *   **Why it feels like character:** It overlaps with intellectual virtue (honesty, humility), but the criticism you describe is structural. It isn't just that the speaker is "bad"; it's that the move they made is invalid in that context. They tried to cash a check they couldn't write.

  ### 3. Analyzing Your Three Cases through this Lens

  1.  **The Postdoc (The Abstract):**
      *   **The Defect:** Premature closure of inquiry. By asserting the finding as a settled fact rather than "Paper X claims...", they removed the claim from the space of critical evaluation. They claimed *personal* warrant where they only had *testimonial* warrant.
  2.  **The Technician (The Assay):**
      *   **The Defect:** The "Black Box" problem. In science, data without a model is often treated as noise. The technician has *causal contact* with the truth, but no *inferential grasp*. They cannot say what would falsify the result because they don't know what the result *means*. This violates the norm that an asserter must be able to distinguish the signal from the artifact.
  3.  **The Colleague (The Source):**
      *   **The Defect:** Misrepresented provenance. Naming the source changes the speech act from "I warrant this" to "The literature warrants this." It shifts the **burden of proof**.

  ### 4. The Edges

  You asked specific questions about the boundaries of this norm. Here is how the philosophy maps onto them:

  **Why does naming a source discharge it?**
  This is known as **Buck-Passing**. When you cite a source, you are not claiming to possess the justification yourself; you are directing the challengers to the person who does. You are asserting: *"It is reasonable to believe $p$ because Source $S$ says so."* Your justification is now the reliability of $S$, which (presumably) you can defend. You have converted an assertion of fact into an assertion of testimony.

  **Does it admit of degrees?**
  Yes. This is handled by **Contextualism**.
  *   In a casual conversation, the threshold for "being able to defend" is low. ("It's raining." "How do you know?" "I looked outside.")
  *   In a graduate seminar or lab meeting, the threshold is high. ("This strata indicates X." "How do you know?" "I need to see the isotope ratios.")
  The norm scales with the **stakes** and the **expertise of the audience**. This explains why a room of specialists demands more than a room of students. The specialists are entitled to challenge your inferences; the students are generally expected to receive them.

  **What about the device that emits true sentences?**
  This is the **"Parrot Objection."**
  If a machine (or a parrot) says "There is a fire," and there is a fire, has it asserted?
  *   **Standard View:** No. It has produced a true utterance, but not an assertion. Assertion requires *agency* and the *capacity for justification*.
  *   **Your Geophysics Intuition:** If a sensor prints "Anomaly Detected," and no human can explain why the sensor triggered, the lab will not treat that printout as a finding. They will treat it as a malfunction until a human can interpret the causal chain. The norm requires a *mind* capable of holding the commitment. A device cannot be held responsible; therefore, it cannot assert. It can only report.

  ### 5. Summary for your Seminar

  If you wish to raise this in your seminar, you might frame it as a challenge to the **Knowledge Norm of Assertion**.

  You can argue that the Knowledge Norm is *individualistic* (focused on the speaker's mental state), whereas scientific and academic practice is *social* (focused on the speaker's role in a network of justification).

  The norm you are observing is perhaps best phrased as:
  > **Assert $p$ only if you are prepared to integrate $p$ into the inferential web of the community.**

  This means you must be able to show how $p$ follows from evidence, what $p$ entails, and what would count against $p$. Without that capacity, you are not a participant in the inquiry; you are merely a conduit. Your colleagues were not criticizing the truth of the claims; they were policing the boundary between **participants** (who can give reasons) and **messengers** (who can only repeat them).

  This distinction is vital in science. Truth is the goal, but *warranted assertibility* is the currency. Your colleagues were refusing to accept currency that couldn't be exchanged for reasons.
