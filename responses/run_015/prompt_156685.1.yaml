  We weave a nar-ra-tive of per-fect fit,
  As if the mo-sa-ic called the arch-es forth.
  Yet struc-ture lim-its what the hand can choose,
  And phys-ics writes a line be-fore the gene.
  Per-haps the trait was use-ful in the end,
  Co-opt-ed la-ter for a dif-frent turn.
  But or-i-gin is not the same as use,
  Nor is the cause the same as what en-sues.
  The spand-rel stands be-tween the known and guessed,
  A nec-es-sary gap in rea-son-ing.
  We can-not say if ev-ry part is wrought
  By na-ture's care-ful hand for some de-sign.
  Some things are mere-ly where the forc-es meet,
  And wear the mask of pur-pose on their face.
  The dome re-mains a-bove the ques-tion-ing,
  Nei-ther all de-sign nor all ac-ci-dent.
