  Your tentative principle—the "Fallback Number"—is a strong intuition, but it breaks on your own cases. It works for Case 1 (many leaks create noise, so one is fine), but it fails Case 2 (norm erosion accumulates, yet you say don't act), Case 3 (risk accumulates, yet you say act), and Case 4 (shortage accumulates, yet you say don't act). The number of actors required to trigger harm is not the deciding factor; the *type* of harm and the *nature* of the benefit are.

  To capture your verdicts without contradiction, we need to replace the "Fallback Number" with a distinction between **Constitutive Harms** and **Aggregative Harms**, paired with a rule about **Rivalry**.

  Here is the repaired principle.

  ### The Principle of Constitutive vs. Aggregative Constraints

  **Clause 1 (The Normative Barrier):** If the harm consists of breaking a protective norm or setting a dangerous precedent, you must stand down, regardless of your expertise or the physical scale of the act.
  *   **Motivating Case:** Case 2 (Geoengineering). The harm is not the trivial physical effect of one test; it is the violation of the taboo against unilateral intervention. The first actor breaks the norm, even if physical disaster requires many. This explains why your verdict does not soften even if the actor is the world's leading modeler; expertise does not cure a norm violation.

  **Clause 2 (The Rivalry Barrier):** If the benefit is a rival resource (one person's gain is another's loss), you must stand down if your action contributes to scarcity or deprivation for others.
  *   **Motivating Case:** Case 4 (Antibiotics). The supply is finite. Your purchase directly reduces the pool available to others. The harm (shortage) is not just a side effect; it is the direct mechanical consequence of claiming the rival good. This explains why Case 4 is "Not Fine" despite looking structurally similar to Case 3.

  **Clause 3 (The Aggregative Permission):** If the harm is merely aggregative (noise, marginal risk) and the benefit is non-rival or inevitable, you may act, *provided* you are the actor best positioned to minimize coordination failure.
  *   **Motivating Case:** Case 1 (AI Leak) and Case 3 (Virology).
      *   In **Case 1**, the harm (confusion/circus) is aggregative; it only happens if *many* leak. The benefit (safety review) is pivotal. Your verdict firms up with expertise because the "best" leaker solves the coordination problem: if the most credible person leaks, others don't need to, preventing the circus.
      *   In **Case 3**, the harm (misuse risk) is aggregative, but the *knowledge* is inevitable (25 labs are racing). Your action does not bring the risk into existence; it only claims credit for the discovery. Since the benefit (science) is non-rival and the risk is inelastic to your choice, you may act.

  ### Does this force you to drop a verdict?

  Honesty check: **No.** This principle saves all four of your gut verdicts. However, it forces you to drop your *tentative principle* (the Fallback Number). You cannot rely on "how many actors it takes to break things." In Case 2, one actor breaks the norm, so you stand down. In Case 3, one actor adds risk, yet you act. The count doesn't matter; the *category* of the constraint matters.

  This also resolves your inconsistency on expertise. Expertise matters in Case 1 because it mitigates the specific harm (noise/credibility). Expertise does not matter in Case 2 because the harm is the act itself (precedent), which no amount of skill can sanitize.

  ### Application to the New Case

  **The Case:** One of a dozen postdocs could anonymously post a credible accusation of data fabrication against a senior scientist. Several simultaneous posts would be dismissed as a coordinated smear.

  **Analysis:**
  1.  **Type of Harm:** Epistemic noise / Credibility loss. If many post, it looks like a mob/smear (Aggregative Harm). This matches Case 1 (AI Leak).
  2.  **Type of Benefit:** Accountability/Truth. One credible accusation triggers an investigation (Pivotal Benefit).
  3.  **Rivalry:** Non-rival. One postdoc exposing the truth does not prevent the truth from being exposed; however, multiple posts degrade the signal.
  4.  **Expertise:** The prompt specifies "credible, well-documented." This implies variation in evidence quality.

  **Verdict:**
  **Fine/Obligatory for the single best-positioned actor; Not Fine for the others.**

  According to Clause 3, action is permitted because the harm is aggregative (smear campaign) and the benefit is pivotal (investigation). However, the coordination clause applies: to avoid the "circus" of multiple accusations looking like a smear, the postdocs must coordinate (implicitly or explicitly) to allow only the person with the **strongest documentation** to post. If the postdoc with the weakest evidence posts first, they risk triggering the "smear" defense without securing the investigation, potentially poisoning the well for the others.

  **Recommendation for your feature:** The moral burden here is not just on the decision to act, but on the decision to *defer*. In "Unilateralist's Curse" scenarios that fit Clause 3, the ethical move for the 11 less-qualified postdocs is not just silence, but active deference to the 12th.
