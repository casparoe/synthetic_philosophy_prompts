  **JOINT STATEMENT OF UNDERSTANDING: THE CASCADE PROJECT**
  **Prepared by:** The Ethics Club Mediation Committee
  **Date:** October 26, 2023
  **Signatories:** The Swamper Camp, The Finitist Camp

  ### Part 1: Points of Agreement
  *We, the undersigned, acknowledge the following facts and principles as the shared foundation of our debate. We agree on what the cases are, even if we disagree on what to do about them.*

  1.  **The Cascade Mechanics:** We agree that pressing the Cascade button costs exactly one person one mildly annoying afternoon. We agree it offers a 1-in-1,000,000,000 (one-in-a-billion) chance of creating an endless series of happy lives (infinite value), and a 99.9999999% chance that nothing happens.
  2.  **The Slow Bleed Mechanics:** We agree that the "Slow Bleed" option guarantees ten billion years of great lives for a large population, after which existence ends. This is a massive but **finite** amount of good.
  3.  **Shared Goal:** Both camps aim to maximize overall well-being. Neither side wants to cause harm for no reason; we simply disagree on which mathematical or ethical framework best achieves the most good.
  4.  **The Problem with Infinity:** We agree that standard math breaks down when comparing "infinity" to "very large numbers." In normal arithmetic, infinity plus one is the same as infinity times a billion. This makes decision-making difficult.
  5.  **Probability is Real:** We agree that a 1-in-a-billion chance is objectively rare. We disagree on whether that rarity should cancel out the infinite value of the prize.
  6.  **The Horizon Rule Definition:** We agree on the *definition* of the Horizon Rule: it is a method that compares options by "truncating" (cutting off) the future at the end of each century. If one option is ahead after a certain century and never loses the lead, it wins. If the lead flip-flops forever, it is a tie, and we look at the finite costs/benefits.
  7.  **Finite Costs Matter:** We agree that if two options are truly equal in value, the one with the lower cost (the less annoying afternoon) is preferable.
  8.  **Need for Action:** We agree that the club must eventually vote on a recommendation. Refusing to decide is, in itself, a decision to stick with the status quo.

  ***

  ### Part 2: Table of Disagreements
  *This table outlines where we diverge. We have agreed to state each other's positions charitably.*

  | # | Neutral Statement of Disagreement | Swamper Position (Infinite Priority) | Finitist Position (Finite Priority) | The Crux (The Root Question) | Shared Evidence / Argument to Watch | What Each Camp Predicts It Will Show |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **How to weigh infinite outcomes.** | **Infinity Dominates:** Any non-zero chance of an infinite good is mathematically larger than any finite good, no matter how huge. | **Finite Reality:** Infinite expectations are theoretical traps. We should prioritize outcomes that are guaranteed or highly probable. | **Does probability discount value?** If the chance is tiny enough, does the value become zero for practical purposes? | **Pascal's Mugging:** A thought experiment where a stranger demands $5, threatening infinite torture if you refuse. | **Swampers:** Predicts we must pay the $5 to be rational.<br>**Finitists:** Predicts this proves the "Infinity Dominates" rule is broken. |
  | **2** | **How to use the Horizon Rule.** | **A Necessary Tool:** It is the only way to compare two infinite timelines without ignoring the "tail end" of history. | **A Distraction:** It still prioritizes the distant, uncertain future over the concrete, near-term good. | **Does the far future matter more than the near future?** | **The Slow Bleed Test:** Apply the Horizon Rule to Cascade vs. Slow Bleed. | **Swampers:** Predicts Cascade wins because the infinite tail eventually outweighs the 10 billion years.<br>**Finitists:** Predicts the Rule will "flip-flop" forever, forcing a tie, so we should pick Slow Bleed based on finite certainty. |
  | **3** | **Definition of "Rational Choice."** | **Expected Value:** Rationality means following the mathematical average outcome (Expected Utility). | **Robustness:** Rationality means choosing the option that works well in the most likely scenarios. | **Is math or safety the guide?** | **Real-world analogies:** Buying lottery tickets vs. saving for retirement. | **Swampers:** Predicts saving for retirement is just "buying a ticket" with better odds.<br>**Finitists:** Predicts that treating retirement like a lottery ticket leads to ruin. |

  ***

  ### Part 3: Note on Verbal Disputes
  *During mediation, we identified one area where the argument may be about words rather than facts.*

  **The Term:** "Better"
  **The Issue:** When Swampers say the Cascade is "better," they mean it has a higher **Expected Value** (a mathematical calculation of probability × outcome). When Finitists say the Slow Bleed is "better," they mean it is **More Reliable** (it actually succeeds in the real world).
  **Resolution:** We agree to stop saying "Option X is better." Instead, we will say "Option X has higher Expected Value" (Swamper view) or "Option X is more Robust" (Finitist view). This clarifies that we are measuring two different things.

  ***

  ### Part 4: Next Steps
  1.  Both camps accept this document as an accurate summary of the debate.
  2.  The club will vote on whether to adopt the **Horizon Rule** as our official tie-breaker for infinite scenarios.
  3.  Regardless of the vote, the **Finitist** position will be the default for all club decisions involving real-world resources, due to the risk of "Pascal's Mugging" scenarios. The **Swamper** position will be recorded as a theoretical minority report.

  **Signed,**

  __________________________ (Lead Swamper)

  __________________________ (Lead Finitist)

  __________________________ (Club President/Mediator)

  ***

  ### Glossary for 11th Graders
  *   **Expected Utility/Value:** A way to make decisions by multiplying the *value* of an outcome by the *probability* of it happening. (Example: A 50% chance to win $10 has an expected value of $5).
  *   **Dominance:** When one option is better than another in every possible scenario.
  *   **Truncating:** Cutting something off. In the Horizon Rule, we pretend the world ends at year 100, then year 200, etc., to see which option is winning at each checkpoint.
  *   **Heuristic:** A rule of thumb or shortcut that helps you make a decision quickly, even if it isn't perfect.
  *   **Pascal's Mugging:** A logic puzzle where a person threatens you with infinite harm unless you give them a small amount of money. It tests whether you believe tiny probabilities of infinite outcomes should control your actions.
  *   **Robustness:** How well a plan holds up when things go wrong or when your assumptions are slightly incorrect.
