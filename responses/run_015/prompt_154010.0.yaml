answer: |-
  The fog off the Dogger Bank was not merely weather; it was a wall of wet wool. Captain Elias Thorne stood on the bridge of the *Iron Duchess*, gripping the brass rail until his knuckles whitened. Fifty yards off the starboard bow, invisible but for the occasional ghostly smear of hull, lay the *Goliath*.

  Between them, on the seabed, rested the bullion chest of the *SS Meridian*. To lift it, both ships had to engage their steam winches at exactly noon. Unequal tension would snap the four-inch steel cable. A snap meant losing the chest, the cable, and likely a leg or two.

  Thorne checked his pocket watch. 11:45 AM.

  The protocol was simple, born of necessity. Whistle signals. One blast meant *Ready*. Two meant *I know you are Ready*. Three meant *I know you know I am Ready*. Each exchange climbed one rung up the ladder of certainty. Usually, four rungs were enough. Rational captains did not gamble with steam winches.

  But there was the rumor. In the pubs of Hull, they said Halloway, captain of the *Goliath*, was bankrupt. Desperate men were not rational; they might pull alone, hoping the *Duchess* would follow suit to save the cable. If Halloway pulled solo, the cable would snap before Thorne could disengage. Thorne could not afford to pull unless he was certain Halloway was waiting for mutual confirmation. The rumor meant Thorne needed not four rungs, but six.

  At 11:50, Thorne tried to shortcut the ladder. He fired a green starburst flare. It bloomed high above the fog, a brilliant emerald eye. It was public. Visible to all.

  Thorne scanned the fog for the *Goliath's* response. He needed to see Halloway acknowledge the flare to know that Halloway knew Thorne had seen it. But the fog swallowed the *Goliath's* bridge. Thorne saw the flare; he assumed Halloway saw it. But he could not see Halloway seeing it. The structural opacity of the weather meant the flare established only that the signal existed, not that the knowledge was shared. It was a public event that failed to become public knowledge.

  Thorne cursed and returned to the whistles.

  11:54 AM. Thorne pulled the cord. *One blast.*
  He waited. The sound died in the damp air. Then, a muffled response. *One blast.*
  Level 1: Halloway knows Thorne is ready.
  Level 2: Thorne knows Halloway knows.

  11:56 AM. Thorne blew *Two blasts.*
  Silence. The fog seemed to absorb the steam. Thorne's heart hammered. Then, faintly: *Two blasts.*
  Level 3: Halloway knows Thorne knows Halloway knows.
  Level 4: Thorne knows Halloway knows Thorne knows Halloway knows.

  Normally, this was the handshake. Normally, Thorne would engage at noon. But the rumor of Halloway's desperation hung in the air heavier than the fog. If Halloway was rational, Level 4 was sufficient. If Halloway was reckless, he might interpret silence as consent. Thorne needed to know that Halloway knew Thorne was waiting for absolute confirmation.

  11:58 AM. Thorne blew *Three blasts.*
  He strained his ears. The seconds stretched. 11:59.
  *Three blasts.*
  Level 5 established. Thorne knew that Halloway knew that Thorne knew that Halloway knew that Thorne was ready.

  Thorne needed Level 6. He needed to know that Halloway knew Thorne was waiting for that final confirmation. He reached for the cord again.

  11:59:30 AM.
  Thorne blew. *Four blasts.*
  He waited for the echo. The fog remained silent. The steam hiss of the *Goliath* was gone, or perhaps masked by the wind shifting off the port beam.

  Noon. The bell on the *Duchess* clanged.
  Thorne kept his hand off the winch lever. He stared into the white void.
  Across the gap, Halloway sat equally still. He had heard the fourth blast, but the wind had carried it away before he could signal back. Halloway knew Thorne was ready (Level 5). But Halloway did not know if Thorne knew Halloway had received the fourth signal. Halloway could not risk pulling alone.

  The tide turned. The *Meridian* settled deeper into the silt. The window closed.

  Thorne slumped against the rail. He knew Halloway was rational. He knew Halloway wouldn't pull alone. But he couldn't know that Halloway knew *that*. The chain had broken at the sixth link, and without the infinite chain of common knowledge, the trust required to engage the steam was absent. The rumor hadn't made Halloway reckless; it had made Thorne cautious enough to demand a certainty the fog would not yield.

  ***

  **Epistemic Mapping**

  *   **Levels 1–5:** Established by the whistle exchange (1 blast = $K_H R$, 2 blasts = $K_V K_H R$, etc.). The story halts at Level 5 ($K_V K_H K_V K_H K_V R$).
  *   **The Flare:** Attempted to manufacture Common Knowledge ($E^\infty$). Failed structurally because the fog prevented visibility of *reception*. It established $E^1$ (signal occurred) but not $E^2$ (everyone knows everyone saw it), as Thorne couldn't verify Halloway's attention.
  *   **The Rumor:** Increased the threshold for action. Without the rumor, Level 4 suffices for rational actors. The rumor of irrationality forced Thorne to require Level 6 to rule out the risk of a solo pull.
  *   **Conclusion:** Finite-depth knowledge (Level 5) was insufficient because the stakes (cable snap) combined with the rumor required Level 6. Common knowledge was unattainable due to noisy channels. Rational inaction resulted not from distrust of character, but from the impossibility of closing the epistemic gap.
