answer: |-
  Dear Fellowship Committee,

  I am writing to propose a project for the summer fellowship that sits at the intersection of metaethics and population ethics, specifically looking at the Wrong Kind of Reasons problem through the lens of climate change. The precise question I want to ask is whether the benefit to future generations counts as the right kind of reason for reducing emissions when those future people are contingent on our actions. Usually the Wrong Kind of Reasons problem is discussed in terms of belief and evidence, like whether pragmatic benefits are the right kind of reason to believe something, but I want to shift this to practical reasons for action. My hypothesis is that saying we should act to save future people is problematic because under the non-identity problem, those specific people would not exist if we failed to act, so it feels like we cannot give a reason to someone who wouldnt exist to recieve it. This creates a seperate problem from the standard non-identity discussions because it focuses on the normative force of the reason itself rather than just whether harm was caused.

  Standard positions in the literature do not settle this because they tend to treat climate ethics and the Wrong Kind of Reasons problem as distinct silos. Climate ethicists usually focus on harm based accounts or rights based accounts, while metaethicists focus on the structure of reasons regarding belief or admiration. Neither group fully addresses whether a reason grounded in contingent existence is structurally defective in the same way pragmatic reasons for belief are often considered defective. I think existing answers miss this population-ethics twist because they assume the beneficiary is fixed, whereas in climate scenarios the beneficiary is ontologically dependent on the action taken. This means the usual distinction between object-given and state-given reasons gets murky when the object of the reason is brought into existence by the reason itself.

  Over the eight weeks I plan to move beyond just reviewing literature by constructing a formal argument that distinguishes this specific case from standard non-identity problems. During the first two weeks I will focus on mapping the existing definitions of right and wrong kind of reasons to ensure I am not reinventing the wheel, using open access resources since I dont have database access. Weeks three through five will be dedicated to drafting the core argument where I test the hypothesis against counterexamples, such as policies that affect quality of life versus existence itself. The final three weeks will be for refining the paper and anticipating objections, specifically looking at whether person-affecting views can solve this without collapsing back into standard harm principles. This approach beats just reviewing literature because the goal is to produce a novel classification of reasons rather than a summary of what others have said, which requires active argument construction week by week.

  Success for this project would look like a completed paper that clearly articulates why contingent beneficiaries create a unique category of normative reasons, even if I do not fully solve how to resolve the tension. Total failure would be realizing that this problem is actually identical to existing non-identity problems and adds no new philosophical value, meaning the distinction I proposed collapses under scrutiny. I want to be honest that this might be too big for two months because bridging metaethics and population ethics is dense work, but I believe I can at least establish the framework and show why it deserves more attention even if a full solution takes longer. I am willing to narrow the scope if needed during the fellowship, but I think the initial question is strong enough to warrant the investigation. Thank you for reading my proposal and considering my application.

  Sincerely,

  [Your Name]
