answer: |-
  # SEMINAR HANDOUT: DIAGNOSING REGULARITIES
  **Course:** Conventions & Norm Evolution | **Task:** Classify the observed pattern.

  ## PART 1: THE CASES
  *Observe the behaviour. Do not theorise yet.*

  1.  **Driving Side:** Cars keep to the left (or right) on two-way streets.
  2.  **Email Lag:** Replies to internal work emails arrive within 48 hours, rarely sooner.
  3.  **Potluck Dish:** Guests bring a food item when invited to a shared dinner.
  4.  **Last Slice:** No one takes the final piece of pizza without asking the group.
  5.  **QWERTY:** Everyone types on a keyboard layout designed to slow down mechanical jams that no longer exist. *(Privately disliked)*
  6.  **Head Signal:** Nodding means 'yes' and shaking means 'no' (or vice versa).
  7.  **Funeral Black:** Mourners wear black clothing rather than red or white.
  8.  **Bus Gap:** Passengers leave an empty seat between themselves and strangers on a half-empty bus.
  9.  **Escalator Lane:** Stand on the right, walk on the left (or vice versa).
  10. **Thermostat Lock:** Office heat is set to 19°C by three senior staff; everyone else shivers but touches nothing. *(Minority enforcement)*

  ---

  ## PART 2: THE STATIC TREE (What sustains it?)
  *Answer Yes/No. Follow the line.*

  **Q1. COORDINATION:** Is there an alternative regularity (e.g., drive right instead of left) that everyone would prefer *if* enough others switched to it?
  *   **NO** → Go to Q4.
  *   **YES** → Go to Q2.

  **Q2. PREFERENCE FLIP:** If everyone privately hated this regularity but kept doing it, would the pattern survive?
  *   **NO** (It relies on shared preference) → **HABIT / STATISTICAL REGULARITY**
      *   *Commitment:* There is no norm here, just aggregate coincidence.
  *   **YES** → Go to Q3.

  **Q3. COMMON KNOWLEDGE:** Does it survive when it becomes common knowledge that most comply *only* because they expect others to?
  *   **NO** (Needs ignorance or simple reinforcement) → **SKYRMSIAN EVOLUTIONARY**
      *   *Commitment:* Agents need not know they are coordinating; reinforcement suffices.
  *   **YES** → **LEWISIAN CONVENTION**
      *   *Commitment:* Requires a recursive mind-reading loop (I know that you know...) to count as rational.

  **Q4. SANCTIONS:** If someone violates the regularity, do others impose a cost (gaze, scold, exclude)?
  *   **NO** → Go to Q5.
  *   **YES** → Go to Q6.

  **Q5. SENDER-RECEIVER:** Is the act arbitrary but pays because it tracks some state of the world (signaling)?
  *   **YES** → **TELEOLOGICAL ACCOUNT**
      *   *Commitment:* The token is correct only because of its historical proper function.
  *   **NO** → **HABIT / STATISTICAL REGULARITY** (See Q2 leaf).

  **Q6. LOAD-BEARING:** If you removed the threat of sanction, would compliance collapse immediately?
  *   **NO** (Sanctions are decorative) → **BOYD-RICHERSON-HENRICH (CULTURAL TRANSMISSION)**
      *   *Commitment:* People copy high-status models regardless of current payoff.
  *   **YES** → Go to Q7.

  **Q7. NORMATIVE EXPECTATION:** Do sanctioners believe they *ought* to punish, or just want to win?
  *   **WIN ONLY** → **UNNAMED (OLIGARCHIC ENFORCEMENT)**
      *   *Commitment:* Power masquerading as normativity; theory has no name for this yet.
  *   **OUGHT TO** → Go to Q8.

  **Q8. JOINT COMMITMENT:** Is the obligation felt as a "we" (plural subject) or an "I vs. You" (conditional preference)?
  *   **I VS. YOU** → **BICCHIERI (SOCIAL NORM)**
      *   *Commitment:* Norms are fragile; they vanish if empirical expectations drop below a threshold.
  *   **WE** → **GILBERT (JOINT COMMITMENT)**
      *   *Commitment:* You cannot rescind your participation unilaterally; you are bound by the group.

  *(Note: If Q1=NO and Q5=NO but Q8=YES, consider **BRANDOM (INFERENTIALIST)**: The norm lives in scorekeeping practices, not behaviour.)*

  ---

  ## PART 3: THE DYNAMICS TREE (How did it start?)
  *Many accounts explain maintenance but smuggle in the origin.*

  **Q START:** Was there anything normative or precedential on the scene *before* this regularity existed?
  *   **NO (Thin Bootstrap):** The start was non-normative (salience, prominence, sheer drift).
      *   *Compatible Accounts:* **Lewis** (Salience/Focal Point), **Skyrms** (Reinforcement/Drift), **Habit** (Repetition).
      *   *Critique:* These are the only accounts that do not presuppose the norm they explain.
  *   **YES (Thick Bootstrap):** The start required prior force (existing precedent, prior belief, model to copy).
      *   *Compatible Accounts:* **Bicchieri** (Needs prior normative expectations), **Gilbert** (Needs prior capacity for joint commitment), **BRH** (Needs prior models), **Teleological** (Needs prior history), **Brandom** (Needs prior scorekeeping).
      *   *Critique:* These accounts explain stability well but quietly presuppose the normative infrastructure they were supposed to ground.

  ---

  ## PART 4: BLIND SPOTS & LOGICAL GAPS

  **Indistinguishable Pairs (In Equilibrium):**
  1.  **Lewis vs. Skyrms:** Once settled, both look like stable coordination.
      *   *Separator:* Access to mental states (CK?) or historical data (Did drift or reasoning lead here?).
  2.  **Bicchieri vs. Gilbert:** Universal compliance + Sanction looks identical.
      *   *Separator:* Interview sanctioners. Is the motive "You broke the rule" (Bicchieri) or "You betrayed *us*" (Gilbert)?

  **Logically Available but Unoccupied:**
  1.  **Arbitrary + Sanction + No Alternative Equilibrium.**
      *   *Status:* **Incoherent.** Why sanction an arbitrary deviation if coordination isn't the goal? (Unless Oligarchic).
  2.  **Non-Arbitrary + Expectation Only (No Technical Necessity).**
      *   *Status:* **Unexplored.** A "technical" norm held up only by expectations without a coordination problem is unstable.
  3.  **Arbitrary + Moralised Sanction.**
      *   *Status:* **Unattractive.** Moralising arbitrary choices (e.g., "It is *evil* to drive on the left") is rare and usually indicates group boundary marking, not the act itself.

  ---

  ## SIDEBAR: EVIDENCE OF MIGRATION
  *Categories are not eternal essences. A regularity can move leaves over time.*

  **Look for:**
  1.  **Change in Sanction:** Decorative costs become load-bearing (Habit → Social Norm).
  2.  **Change in Reasoning:** "We do it because it works" shifts to "We do it because it's *us*" (Lewis → Gilbert).
  3.  **Change in Function:** Original purpose lapses but pattern remains via copying (Teleological → BRH).
  *If the explanation for compliance changes while the behaviour stays the same, the leaf has moved.*
