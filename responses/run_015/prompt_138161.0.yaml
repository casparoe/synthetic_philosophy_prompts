answer: |-
  **Project Title:** The Electorate as Sample: A Unified Epistemic Framework for Franchise and Participation

  **1. Research Question**

  Standard democratic theory treats the questions of *who* votes (franchise boundaries), *whether* they must vote (participation mandates), and *why* they vote (normative justification) as distinct problems requiring distinct normative tools. This project asks: **To what extent does conceiving of the electorate as a statistical sample of the governed provide a unified normative framework for resolving discontinuities in debates over compulsory voting, voting age, and non-citizen franchise?**

  Sub-questions include:
  *   Does the "sample view" dissolve the liberal objection to compulsory voting by shifting the justification from individual duty to systemic representativeness?
  *   Does the logic of sampling render individual competence requirements obsolete, and if so, does this generate plausible boundaries for age and residence?
  *   Does the sample view collapse into a defense of sortition (lottery), and if so, can it distinguish itself sufficiently to remain a theory of *elections* rather than a theory of *representation* generally?

  **2. Problem Statement and Gap in Literature**

  Current literature on democratic inclusion and participation is siloed. Defenses of compulsory voting typically rely on civic virtue, anti-corruption, or duty-based arguments. Debates on voting age hinge on individual competence or the "all-affected" principle. Debates on non-citizen voting turn on membership, denizenship, or coercion by the state.

  This fragmentation leads to theoretical inconsistency. A theorist might argue for compulsory voting based on duty (requiring high agency) while arguing for a lower voting age based on affectedness (requiring low agency), without addressing the tension between these models of the voter.

  The "Electorate-as-Sample" hypothesis suggests that the primary function of mass voting is not the expression of individual autonomy, but the generation of a representative data set of public will. Under this view, selection bias (low turnout) is a systemic error comparable to sampling bias in polling. This approach promises to unify the three silos:
  1.  **Compulsory Voting:** Becomes a methodological requirement to reduce selection bias, not a moral duty.
  2.  **Voting Age/Residency:** Becomes a boundary definition problem (who is in the population to be sampled?), not a competence test.
  3.  **Objections:** Liberal coercion objections lose force (it's not about forcing expression), and competence objections lose force (samples do not require expert respondents).

  However, this view is under-theorized. It is unclear if it can generate determinate policy thresholds or if it merely disguises a preference for sortition. This project seeks to test the viability of this framework before it is applied to specific policy outcomes.

  **3. Methodology and Approach**

  This is a work of normative political theory. It will not conduct empirical analysis of turnout rates or comparative policy surveys. I will stipulate the empirical premise that voluntary electorates are demographically unrepresentative of the resident population (a widely accepted premise in political science) and focus on the *normative implications* of that premise.

  The method is conceptual analysis and stress-testing. I will construct the "Sample Model" of voting and subject it to three pressure tests derived from the three siloed debates. The goal is not to prove that compulsory voting for 16-year-old residents is the *correct* policy, but to determine if the Sample Model provides a *coherent justification* for linking these policies in a way the Standard Model cannot.

  **4. Proposed Structure (Section by Section)**

  **Section 1: The Silo Problem (approx. 750 words)**
  *   Map the current landscape: Show how compulsory voting, voting age, and non-citizen voting are argued in isolation.
  *   Demonstrate the friction: Highlight how the "individual autonomy" model creates contradictions when applied across all three cases (e.g., requiring autonomy for compulsory voting but waiving it for age).
  *   Thesis statement: The discontinuities arise from a category error regarding the function of the aggregate electorate.

  **Section 2: Constructing the Electorate-as-Sample Model (approx. 1,250 words)**
  *   Define the model: Distinguish between the *expressive view* (voting as speech/authorization) and the *epistemic-sampling view* (voting as data generation).
  *   Establish the normative goal: The legitimacy of the output depends on the representativeness of the input sample.
  *   Address the "Sortition Objection" immediately: If the goal is a representative sample, why elections? I will argue that elections retain a distinct function (accountability/removal) that pure sortition lacks, even if the *selection* of the decision-makers relies on sampling logic. This is the critical theoretical hinge; if I cannot distinguish sampling-voting from sortition, the model fails.

  **Section 3: Pressure Test I — Participation and Coercion (approx. 1,000 words)**
  *   Apply the model to compulsory voting.
  *   Argument: If voting is a sampling mechanism, "abstention" is missing data. Compulsory turnout (even with a "none of the above" option) is methodologically necessary to prevent selection bias.
  *   Counter-argument: Does this reduce the voter to a mere instrument? I will explore whether the Sample Model requires a "thick" or "thin" conception of the voter.
  *   Outcome goal: Show that the liberal coercion objection is misplaced because the obligation is systemic, not individual.

  **Section 4: Pressure Test II — Boundaries and Competence (approx. 1,250 words)**
  *   Apply the model to Voting Age and Non-Citizen Residence.
  *   Argument: Competence is irrelevant to sampling validity; bias is the enemy. Therefore, excluding 16-year-olds or long-term residents introduces systematic bias unless they are genuinely outside the "population of the governed."
  *   The Boundary Problem: The Sample Model forces a precise definition of the "Population." I will argue this pushes toward a "subjection principle" (all those subject to law) rather than a "membership principle" (citizens).
  *   Critical limitation: I will acknowledge that the Sample Model may not yield a specific age (16 vs. 18) but rather a *criterion* for age (e.g., legal liability). This is a theoretical success even if it is not a policy number.

  **Section 5: Failure Conditions and Limits (approx. 750 words)**
  *   Honest assessment of where the model breaks.
  *   If the model implies we should replace elections with sortition, it fails as a theory of *voting*.
  *   If the model cannot distinguish between a 5-year-old and a 16-year-old (both are equally "affected"), it lacks discriminatory power.
  *   I will propose a "hybrid" conclusion: The Sample Model justifies the *structure* of the franchise, but may need to be supplemented by a minimal agency threshold to avoid absurdity.

  **5. Expected Results**

  **A Positive Result:**
  The project successfully demonstrates that the Sample Model dissolves the theoretical friction between the three debates. It shows that objections based on individual competence are category errors when applied to aggregate outcomes. It provides a coherent justification for compulsory turnout with broad franchise boundaries, distinct from sortition, grounded in the epistemic quality of democratic decisions rather than individual rights.

  **A Useful Negative Result:**
  The project demonstrates that the Sample Model is unstable. For example, it might show that if representativeness is the only goal, elections are indeed inferior to sortition, meaning the Sample Model cannot support *voting* specifically. Alternatively, it might show that the Sample Model cannot solve the boundary problem (who is in the sample) without smuggling in the very "membership" norms it tries to bypass. A paper concluding that "The Sample Model is compelling but ultimately collapses into sortition" is a successful theoretical contribution.

  **6. Risk Assessment: The "Three Papers" Worry**

  My supervisor's concern is that I am attempting to write three separate applied papers (one on compulsory voting, one on youth suffrage, one on non-citizen voting) stapled together. This is a valid risk.

  **Mitigation Strategy:**
  I will explicitly frame the three policy areas not as *topics* to be solved, but as *test cases* for a single theoretical construct. The paper will not argue definitively for lowering the voting age or enfranchising non-citizens. Instead, it will argue about *what kind of argument* would be required to settle those questions under the Sample Model.
  *   If the theory holds, it should apply to all three.
  *   If the theory only works for compulsory voting but fails on voting age, the paper reports that theoretical limitation.
  *   The unity of the paper rests on the *framework*, not the policy recommendations.

  **Honesty Check on Sortition:**
  The supervisor's worry that this is "sortition with extra steps" is the strongest threat to the project. If I cannot explain why we sample via *ballots* rather than *lottery*, the project fails. I will dedicate significant space in Section 2 to this. If I cannot find a distinction (likely centering on accountability mechanisms inherent in elections but absent in lotteries), I will have to concede that the Sample Model is actually an argument for a mixed constitution (elections + sortition), which is still a novel contribution but changes the scope of the paper.

  **7. Feasibility and Scope**

  *   **Word Count:** The 5,000-word limit is tight for this scope. I will prioritize Section 2 (Model Construction) and Section 5 (Limits) over detailed policy application in Sections 3 and 4. The policy applications will be illustrative, not exhaustive.
  *   **Empirical Stipulations:** I will not defend the claim that voluntary voting is biased; I will treat this as a premise. This saves space for normative analysis.
  *   **Deliverable:** A seminar paper that functions as a Chapter 1 prospectus. It establishes the theoretical viability of the Sample Model. If successful, the "bigger project" would be a dissertation chapter applying the model to specific institutional designs (e.g., compulsory turnout with abstention options).

  **8. Conclusion**

  This project moves beyond the stalemate of "rights vs. duties" in democratic theory by introducing an epistemic-statistical framework. It risks collapsing into sortition or failing to set boundaries, but these risks are themselves theoretically productive. By treating the electorate as a sample, we may find that the debates on who votes and whether they must are not separate questions, but variables in a single equation of democratic legitimacy. The goal of this paper is to determine if that equation balances.
