answer: |-
  You have put your finger on a genuine gap in the standard vocabulary of political philosophy. You are correct that the "instrumental vs. expressive" distinction is too blunt for this. Instrumental/Expressive voting theory assumes the *voter* is the beneficiary of the meaning (I feel good about expressing myself). Your observation is that the *audience* is the beneficiary (or arbiter) of the meaning, and they can override the voter's intent.

  There is no single canonical term like "The Voting Paradox" that covers this exact cluster of problems, but your intuition maps precisely onto the intersection of three specific frameworks: **Speech Act Theory (specifically Illocutionary Uptake)**, **Semantic Externalism**, and **Constitutive Rules of Social Rituals**.

  If you need a name to bring to the argument, the sharpest philosophical label is **Illocutionary Dispossession** (a synthesis of Speech Act Theory and Political Philosophy).

  Here is the breakdown of what is doing the work, how to define it, and where the boundaries lie.

  ### 1. The Core Mechanism: Illocutionary Uptake
  In linguistics and philosophy of language (J.L. Austin, John Searle), a speech act has two main components:
  *   **Illocutionary Force:** What you intend to do *in* speaking (e.g., promising, warning, voting *against*).
  *   **Uptake:** The audience's recognition and acceptance of that force.

  Austin argued that for some speech acts, **uptake is constitutive.** If I say "I bet you $5" and you don't acknowledge it, no bet has occurred.
  In your **Case Two**, your cousin is experiencing **Illocutionary Failure** or **Uptake Deficit**. She intends the illocutionary act of "Warning/Blocking" (voting against). The public assigns the illocutionary act of "Endorsement/Consent" (voting for).

  **Why she has no appeal:** In standard conversation, you can clarify ("No, I didn't mean I like him, I meant I hate the other guy!"). In voting, the channel is closed. The ballot is secret and binary (in effect). Once cast, the *conventional meaning* of the mark overrides the *psychological intent* of the marker.

  **The Name for the Argument:** You are arguing about **Conventionalism vs. Intentionalism**.
  *   **Your Brother/Cousin (Intentionalism):** The meaning of the vote is determined by the mental state of the voter.
  *   **The Family/Public (Conventionalism):** The meaning of the vote is determined by the social rules governing the ritual. In the ritual of elections, a mark next to a name *counts as* support for that name, regardless of mental state.

  ### 2. The Aggregation Wrinkle: Statistical Semantics
  You noted the secrecy/aggregation issue: *"Nobody reads your vote, they read the aggregate."*
  This moves the phenomenon from linguistics to **Semiotics of Collective Action**.

  In a secret ballot, your vote is not a *sentence*; it is a *data point*.
  *   **Case One:** Your brother and you both produce a null outcome. But socially, your brother's data point is entered into the regression line, and yours is a missing value.
  *   **The Meaning:** A missing value implies apathy or system rejection. A data point for a third party implies system participation but preference dissent.
  *   **The Family's Logic:** They value **Ritual Legitimacy** over **Outcome Impact**. By casting a ballot, your brother validates the *process*. By staying home, you withdraw legitimacy from the *process*. The family rewards process-validation (principled) over outcome-calculation (slacking).

  This is why the third-party voter is "more principled" than the lesser-evil voter in their eyes. The third-party voter validates the process *without* dirtying their hands with the winner. The lesser-evil voter validates the process *and* dirty their hands. You validated neither.

  ### 3. The Retroactive Wrinkle: Narrative Determination
  You asked if the retroactive part is special. In political philosophy, **Hannah Arendt** argues exactly this in *The Human Condition*. She posits that the "meaning" of an action is never known to the actor at the time of acting. It is determined by the **story** that is told about the action later.

  *   **Case Two:** Your cousin votes. At $T_1$, the meaning is "Stop the Bad Guy." At $T_2$ (four years later), the story becomes "The Mandate."
  *   **Moral Luck:** Philosopher Thomas Nagel calls this **Resultant Luck**. Your cousin is morally judged on the *consequences* of the vote (the winner's actions), which are outside her control, rather than the *intent* of the vote.

  ### A Sharp Definition for Your Argument
  If you want to settle the boundary with your brother, propose this definition:

  > **Political Meaning Externalism:** The social meaning of a vote is not a property of the voter's intent, but a property of the **conventional rules of the election** and the **subsequent narrative of the outcome**.
  >
  > *   **Boundary Condition 1 (Intent):** If voting were purely expressive (like wearing a pin), intent would rule. But voting is a **constitutive rule** (like signing a contract). You cannot sign a contract and later claim, "I didn't mean to agree to the terms, I just wanted to say I was here."
  > *   **Boundary Condition 2 (Aggregation):** Because votes are aggregated, individual meaning is subject to **Ecological Inference**. If 60% of your demographic votes for X, your vote is statistically interpreted as support for X, regardless of your private reasoning.
  > *   **Boundary Condition 3 (Retroactivity):** The meaning is fixed by the **Mandate Theory**. If the winner claims a mandate, the voters are retroactively conscripted as grantors of that mandate.

  ### Is it the same as Jokes or Marches?
  It is similar, but voting has a specific **Institutional Rigidity** that makes it worse.

  *   **Jokes:** If a joke is read as an insult, you can apologize or clarify. The medium (speech) allows for follow-up.
  *   **Marches:** If you march for peace and the newspapers say you marched for war, you can hold a press conference. The act is public and attributable to you.
  *   **Voting:** The act is **secret** (you cannot claim your specific vote) but **aggregated** (you are bound by the group's meaning). You are trapped in a **Black Box of Interpretation**. You put intent in one side, and social meaning comes out the other, and you have no access to the machinery inside.

  ### Summary for the Family Argument
  You can tell your brother and family that they are conflating **Participation** with **Endorsement**.

  1.  **To the Brother:** "You treat voting as a **Speech Act** (I say 'None of the Above'). But the system treats it as a **Contract** (I agree to be bound by the winner). You feel principled because you focused on the Speech Act. The family treats you as principled because you honored the Contract without signing the Terms. I refused the Contract entirely."
  2.  **To the Cousin:** "You are suffering from **Illocutionary Dispossession**. You intended a veto; the system recorded a mandate. In a secret ballot, you do not own the meaning of your vote once it enters the aggregate. That is the cost of the lesser-evil strategy: you buy influence with the currency of endorsement, even if you didn't mean to spend it."

  **The Name:** If you need one term to Google or cite, look into **"The Social Meaning of Voting"** (Elizabeth Anderson) and **"Illocutionary Uptake"** (J.L. Austin). But the specific phenomenon of the meaning being seized by the audience/aggregate is best described as **Constitutive Externalism**.

  **The Verdict:** You are not stapling two things together. You are describing the **loss of agency over meaning** in a collective, anonymous ritual. Your brother is arguing from **Internalism** (what I meant); the world is arguing from **Externalism** (what the act counts as). In voting, Externalism wins.
