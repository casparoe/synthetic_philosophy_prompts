  10. **Final Polish:** Ensure the tone is supportive of a fellow writer, acknowledging the stress of being stuck. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't accidentally solve the mystery for them, but give them the *tool* to write the scene. The core is the distinction between *harm* and *death*.

