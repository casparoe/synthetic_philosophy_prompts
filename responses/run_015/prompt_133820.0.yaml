      *   *Preferences:* Flexibility vs. Rigidity (some want easy change, some want stability), Formalism vs. Realism (text vs. practice).

  5.  **Addressing Joint Unsatisfiability (The Trade-off):**
      *   This is crucial. You can't have *absolute* sovereignty (power to do anything) and *absolute* entrenchment (power to bind the future forever) simultaneously. This is the "Paradox of Sovereignty."
