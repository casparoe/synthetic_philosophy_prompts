      *   *The Student Council Case:* Bylaws say 2/3 vote to amend. Can a 2/3 vote make it 100% vote (effectively unamendable)? Or make it unamendable forever?
      *   *The "Silent Repealer":* Text stays same, meaning changes. This touches on interpretation vs. amendment.
      *   *Logical Paradoxes:* Liar paradox vibes ("This statement is false" -> "This rule can be changed" -> "This rule cannot be changed").
      *   *Legal Theory:* Hart's Rule of Recognition, Kelsen's Grundnorm, Schmitt's Sovereign.
      *   *Desiderata:* What makes a theory *good*? Consistency, explanatory power, practical applicability, handling edge cases.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Continuity:* The legal system shouldn't vanish when a rule changes.
      *   *Authority:* Where does the power to change come from? (The rule itself or something above it?)
      *   *Paradox Resolution:* It can't just crash on self-reference.
      *   *Distinction:* Amendment vs. Revolution vs. Interpretation.
      *   *The "Silent Repealer":* Needs to explain if this is valid amendment or just cheating.

  4.  **Refining the Requirements (Non-Negotiable vs. Preferences):**
