answer: |-
  This is a fantastic observation. You have stumbled onto one of the central, unresolved tensions in AI safety and evaluation. Your roommate's description is sharp, and your intuition about the double standard between humans and models is correct—but the *reason* for the double standard is more subtle than simple hypocrisy.

  You said you lack the vocabulary. Here is the vocabulary you need to untangle this, followed by a structure for your blog post that answers your specific questions.

  ### The Vocabulary

  1.  **Instrumental vs. Constitutive Reasoning:**
      *   **Instrumental:** Reasoning is a tool to get an answer. If the tool is hidden but the answer is right, the tool succeeded. (This is the AI industry default).
      *   **Constitutive:** Reasoning is part of the definition of the performance. You cannot be a "good doctor" or a "good student" without the reasoning, even if the diagnosis is right. (This is the Human default).
  2.  **Context of Discovery vs. Context of Justification:**
      *   **Discovery:** How you actually found the answer (the messy mental steps).
      *   **Justification:** The logical proof that the answer is correct.
      *   *The Tension:* AI evals care about Justification (is the answer true?). Human evals care about Discovery (did you learn the method?). Your roommate is saying AI traces are treated as *post-hoc Justification* (storytelling), not *Discovery* (the actual causal engine).
  3.  **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This is the core of your roommate's "Audit but never optimize" rule. If you reward the *text* of the reasoning, the model learns to write better fiction, not better math.
  4.  **Process Supervision vs. Outcome Supervision:**
      *   **Outcome:** Grade the final result.
      *   **Process:** Grade every step of the chain of thought. (Your roommate is saying production systems use Outcome, but desire Process during incidents).

  ---

  ### Drafting the Blog Post: A Roadmap

  Here is a way to structure your post so it doesn't go in circles. It moves from the anecdote to the philosophy, then to the practical constraint, and finally to the cost of change.

  #### Title Idea: *The Reasoning Trap: Why We Grade AI Like Machines and Humans Like Agents*

  #### Section 1: The Double Standard (The Hook)
  Start with your board game night argument. Contrast the roommate (AI evals) with the med student (human evals).
  *   **AI:** Right answer + garbage reasoning = 100%.
  *   **Human:** Right answer + garbage reasoning = Failure/Cheating.
  *   **The Question:** Why do we demand *constitutive* reasoning from people but accept *instrumental* reasoning from machines?

  #### Section 2: What Outcome-Only Scoring Presupposes
  Answer your first philosophical question here. Outcome-only scoring presupposes that **truth is separable from derivation.**
  *   It assumes the "reasoning trace" is not the mechanism of thought, but a user interface feature.
  *   It treats the model as a **function** ($f(x) = y$), not an **agent**. A function doesn't need to show its work; it just needs to map inputs to correct outputs.
  *   *Key Insight:* If you treat the trace as "testimony" (a story told after the fact) rather than "skill" (the muscle memory), then grading the story doesn't improve the skill. It just improves the storytelling.

  #### Section 3: The "Audit But Never Optimize" Rule
  This is the crux of your roommate's insight. Address the Goodhart's Law angle.
  *   **Why not train on process?** Because LLMs are predictive engines. If you reward "looking like you reasoned well," they will learn to hallucinate steps that look plausible but aren't causal. The reasoning becomes **theater**.
  *   **Why audit during incidents?** Because when the system fails, we stop caring about *accuracy* and start caring about *liability* and *causality*. We need to know *why* it failed to prevent recurrence.
  *   **Does this concede the point?** Yes. It admits that for safety/trust, the process matters. But it claims that for *capability*, the process is irrelevant. This is the inconsistency: We assume the process doesn't determine the outcome until the outcome is wrong, at which point we admit the process determines the outcome.

  #### Section 4: Humans vs. Models (Agency and Learning)
  Why the double standard?
  *   **Humans:** We evaluate process because we are building **generalizable capacity**. A med student who guesses right hasn't learned the causal model of disease. They will fail next time. We grade process to ensure future reliability.
  *   **AI:** We evaluate outcome because we assume the weights **already encode the capacity**. The trace is just a readout.
  *   **The Counter-argument:** If the AI is truly "reasoning," then guessing right with garbage steps means it *hasn't learned the concept* either. It will fail on out-of-distribution data. So, outcome-only scoring might be overfitting the benchmark, just like the cheating student.

  #### Section 5: What If We Dropped Outcome-Only?
  Answer your final practical question.
  *   **What would evaluation look like?** Process Supervision (rewarding correct intermediate steps). We would need human annotators or stronger models to grade every step, not just the result.
  *   **What would we lose?** Speed, Cost, and Scale. It is exponentially more expensive to grade 50 steps of reasoning than 1 final answer.
  *   **What would we gain?** Robustness. A model trained on correct steps is less likely to "scheming" or "deceptive alignment" because it is penalized for hidden shortcuts.

  #### Section 6: Conclusion
  Summarize the tension.
  *   The industry stance is pragmatic: "We can't verify the thought, so we verify the result."
  *   But the incident audit admits: "We don't trust the result without the thought."
  *   **Final thought:** We are treating AI as a **Oracle** (give me the truth) rather than a **Student** (show me you understand). As long as we treat it as an Oracle, the reasoning will remain theater.

  ---

  ### Key Arguments to Weave In (Addressing your specific questions)

  **1. Is reasoning just a causal step?**
  Outcome-only scoring presupposes reasoning is merely a **causal conduit**. It implies that if the conduit is opaque but the water comes out clean, the pipe is fine. However, the "incident audit" concedes that the pipe might be corroded, and we only check it when the water turns brown.

  **2. Is "Audit but never optimize" just pragmatism?**
  It is pragmatism driven by **Goodhart's Law**. It presupposes that a trace is **testimony**. If you pay a witness to give testimony, they might lie to please you. If you pay a student to learn, they must actually study. The industry is treating the trace as testimony (evidence to be reviewed) rather than skill (muscle to be trained).

  **3. What parts are forced by the underlying view?**
  The "Outcome" focus is forced by the **Black Box nature** of neural nets. We literally don't know how to map weights to specific logical steps reliably. The "Process" focus during incidents is forced by **Liability**. If a model causes harm, "It got the right answer usually" is not a legal defense.

  **4. What would we lose if we dropped outcome-only?**
  We would lose the ability to scale evaluation. Currently, you can auto-evaluate millions of answers. Process evaluation requires intelligent critics (humans or larger models). It creates a bottleneck. You also risk **over-constraining** the model: sometimes there are multiple valid ways to reason. Grading steps might force the model into a human-like box, reducing its alien-but-effective problem-solving abilities.

  ### A Sample Paragraph for the "Meat" of the Post
  *You can adapt this:*

  > "My roommate's rule—'audit the reasoning, never optimize it'—is a confession. It admits that the text stream we call 'Chain of Thought' is not actually the engine of the model's intelligence. It is a shadow on the wall. If we train the model to match the shadow, we do not make the object stronger; we just make the shadow sharper. This is why we treat AI differently than med students. When we grade a student's derivation, we believe the derivation *is* the learning. When we grade an AI's answer, we suspect the derivation is just a receipt printed after the transaction is complete. But here is the trap: if the receipt is fake, we won't know until the transaction fails. By then, we are auditing a ghost."

  ### Final Advice
  Don't try to solve the inconsistency. Your post is stronger if you highlight it as an **unresolved tension**. The industry is currently in a phase where they want the *trust* that comes from process (for safety) without the *cost* of process (for evaluation). Your roommate's anecdote proves that even they know this is a fragile equilibrium.

  Focus on the idea that **Outcome Supervision builds Oracles; Process Supervision builds Agents.** We are currently building Oracles and pretending they are Agents when it's convenient.
