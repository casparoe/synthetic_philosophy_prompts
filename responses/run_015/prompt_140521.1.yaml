      *   **Human Evaluation:** Process-oriented (must show work, defend diagnosis, explain decisions). Getting the right answer via wrong means is penalized.
      *   **Key Questions to Address:**
          *   What does outcome-only scoring presuppose about reasons/justification?
          *   Is reasoning just a causal step or the point of rationality?
          *   Does incident-time auditing concede something the normal practice denies?
          *   Is "audit but never optimize" just pragmatism or epistemological (testimony vs. skill)?
          *   What parts are forced by the view vs. convenience (cost, disagreement)?
          *   What would happen if we dropped outcome-only scoring (what would evaluation look like, what would we lose)?
      *   **Goal:** Help the user write a short blog post. They are stuck in circles. They need clarity, structure, and philosophical grounding for their intuition.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Consequentialism vs. Deontology (in Epistemology/Evaluation):* AI eval is consequentialist (results matter). Human eval is often deontological (duty to follow procedure/reason correctly).
      *   *Instrumental vs. Constitutive Reason:* For AI, reasoning is instrumental (a tool to get the answer). For humans, reasoning is often constitutive (part of what makes us rational agents).
      *   *Goodhart's Law:* The roommate's point about "audit but never optimize" is a classic Goodhart's Law observation. If you measure a proxy (reasoning trace), it ceases to be a good proxy because the system optimizes for the proxy, not the underlying truth.
      *   *Transparency vs. Performance:* We want AI to be transparent (show work) but we evaluate them on performance (get right answer). When transparency becomes a target, it degrades.

  3.  **Address the Specific Questions:**

      *   *What does outcome-only scoring presuppose?* It presupposes that "reasoning" in LLMs is not *justification* but *causality*. It treats the trace as a byproduct, not the mechanism of truth. It separates *competence* from *performance*.
      *   *Incident-time audit:* This concedes that the trace *matters* for trust/safety, just not for *capability* measurement. It admits the "black box" is risky.
      *   *Audit but never optimize:* This is the crux. It treats the trace as *testimony* (evidence after the fact) rather than *skill* (the muscle memory). If you train on testimony, you get a liar who sounds honest.
      *   *Pragmatism vs. Principle:* It's mostly pragmatism (cost, scale, definition of "good reasoning"), but there's a principled element regarding Goodhart's Law.
      *   *Dropping Outcome-Only:* We'd need process supervision (step-by-step rewards). We'd lose speed/scale/cost. We might gain robustness/alignment.

  4.  **Drafting the Blog Post Strategy:**
      *   *Title:* Needs to be catchy but accurate. "The Reasoning Trap," "Outcome vs. Process," "AI's Double Standard."
      *   *Tone:* Analytical, slightly philosophical, accessible (blog style).
      *   *Structure:*
          1.  **The Hook:** The board game night argument (Roommate vs. Med School Friend).
          2.  **The Diagnosis:** Instrumental vs. Constitutive reasoning.
          3.  **The "Audit but Never Optimize" Paradox:** Goodhart's Law applied to thoughts.
