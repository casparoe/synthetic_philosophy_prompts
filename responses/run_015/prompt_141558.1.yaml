answer: |-
  **The Dead Battery Defence: Why the Dud Device Kills PAP**

  The debate over the Principle of Alternative Possibilities (PAP)—the claim that an agent is morally responsible for an action only if they could have done otherwise—has stagnated. Frankfurt-style cases were supposed to settle it, but decades of dialectical trench warfare have left us with a stalemate: incompatibilists dig in on the "Dilemma Defence," while compatibilists refine "Actual Sequence" accounts. The problem is that standard Frankfurt cases allow the PAP defender to retreat into the shadows of counterfactuals, arguing that some "flicker" of freedom remains or that the setup begs the question.

  To break this deadlock, we need a variant that isolates the variable of "alternative possibilities" from everything else. Enter the **Dud Device** case.

  **The Case**
  In the **Standard Case**, Jones decides to shoot Smith for his own reasons. Unbeknownst to him, Black is monitoring him with a device that would force Jones to decide to shoot if he showed any sign of refusing. Jones decides on his own; Black does nothing. Jones cannot do otherwise.
  In the **Dud Case**, everything is identical except for one extrinsic fact: Black's device has a dead battery. If Jones had shown signs of refusing, Black would have tried to intervene but failed. Jones decides on his own; Black does nothing. Jones *can* do otherwise.

  In both cases, the actual sequence is identical: Jones's phenomenology, deliberation, reasons, and action are the same. Black's presence is causally inert in the actual sequence of both. The only difference is a modal fact grounded in the status of a battery hidden from Jones.

  **The Argument from Parity**
  The Dud Device pair forces a decisive choice. We must compare our blame judgments across the two cases.
  1.  **In the Dud Case**, Jones is clearly blameworthy. He acted on his own reasons, and he genuinely could have refrained (since the device would have failed). PAP is satisfied, and so is our intuition of blame.
  2.  **In the Standard Case**, Jones's actual conduct is indistinguishable from the Dud Case. He exercised the same agency, motivated by the same reasons, resulting in the same harm.
  3.  **The PAP Defender's Commitment**: If PAP is true, Jones is *not* blameworthy (or significantly less so) in the Standard Case because he lacked alternatives.
  4.  **The Absurdity**: This implies that Jones's moral status hinges entirely on the charge level of a battery he knows nothing about. In the Dud Case, he is a murderer; in the Standard Case, he is merely a causal link in a determined chain, excused by a working circuit board.

  This is an untenable form of **constitutive moral luck**. It makes moral responsibility supervene on hidden, extrinsic modal facts rather than the agent's actual exercise of will. If we accept that Jones is equally blameworthy in both cases (as intuition strongly suggests), then the presence or absence of alternative possibilities makes no difference to responsibility. PAP is false.

  **Handling the Objections**
  The PAP defender has two standard escapes, but the Dud Device blocks both.

  First, the **Flicker-of-Freedom Strategy** argues that Jones in the Standard Case still has alternatives, such as "deciding on his own" versus "being forced." The Dud Case exposes this as irrelevant. In both cases, Jones "decides on his own." The flicker exists in both scenarios (he could have shown a sign triggering the device, or in the Dud case, triggering a failed device). Since the actual decision process is identical, appealing to these flickers cannot explain why blame should vanish in the Standard Case. The flicker is present in the blame-worthy Dud case too; thus, the flicker cannot be the ground of blame.

  Second, the **Dilemma Defence** argues that Frankfurt cases are either deterministic (no alternatives) or indeterministic (alternatives exist), so they never isolate responsibility from alternatives. The Dud Case sidesteps this by holding the actual sequence constant. Whether the world is deterministic or not, the *difference* between Standard and Dud is solely the battery. If blame tracks the battery, it tracks luck. If blame doesn't track the battery, it doesn't track alternatives. The metaphysical status of the world matters less than the isolation of the variable: the Dud Case shows that *within* any given metaphysical setup, altering only the availability of alternatives (via the battery) does not alter blame.

  **Moral Luck: A Reversal**
  Critics often charge Frankfurt-style arguments with introducing moral luck—that it is lucky for Jones if Black is present. The Dud Device reverses this charge. It is the **PAP defender** who is stuck with the moral luck problem. They must claim that Jones's blameworthiness turns on a fact outside his control and ken (the battery).

  The Actual Sequence view (which rejects PAP) avoids this. On this view, blame tracks the actual causal history of the action: the reasons, the deliberation, and the choice. Since these are identical in both cases, blame is identical. The battery is irrelevant. This is not a cost; it is a feature. It confirms that responsibility is about who you actually are and what you actually do, not about what you might have done in a nearby possible world where a battery was dead.

  **Conclusion**
  The Dud Device variant strips away the metaphysical clutter surrounding Frankfurt cases. It presents a clean test: does blame track the actual sequence or the modal landscape? If we agree that Jones is equally blameworthy regardless of the battery, we admit that alternative possibilities are not necessary for responsibility. PAP falls. The PAP defender is left defending the absurdity that a hidden dead battery is the difference between a villain and a pawn. We should reject that luck, reject PAP, and accept that responsibility is grounded in the actual sequence of agency.

