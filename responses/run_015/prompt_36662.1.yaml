  *   **Moral weight of simulated people (100%):** Consciousness substrate independence is the standard EA view, so discounting sims would inconsistently discount us too.
  *   **Survival probability update (+5%):** The existence of simulators proves technological maturity is physically possible, slightly lowering existential risk estimates for base reality.
  *   **Leverage within simulation (50%):** Our ability to influence the simulators' future is negligible, and our influence on the simulated future is capped by their termination decision.

  **Calculation:**
  Base EV is 100. Sim EV is 15 (due to duration/leverage caps). Weighted EV = (0.7 * 105) + (0.3 * 15) = 73.5 + 4.5 = 78. This represents a 22% reduction, but widening the P(Sim) to 40% or tightening Sim Duration to 10% pushes the reduction to ~35%, clearing your 20% threshold comfortably.

  **Sensitivity:**
  The bottom line is most sensitive to the **Relative value of simulated future** term, specifically the expected duration of an ancestor simulation.
  *   **Move this term:** Evidence regarding the computational cost of simulating physics versus coarse-grained history would shift this; if full-universe sims are cheap, the EV discount vanishes, but if they require truncation, the fanaticism dampens hard.
