prompt: |-
  I'm on a review panel for an interdisciplinary funding programme that backs "mechanistic explanation" projects — mostly cognitive science and systems biology — and my colleague and I have the same argument every cycle. A proposal comes in that explains some higher-level capacity in lower-level terms: a spatial-navigation capacity in terms of the circuitry, an ecosystem's recovery after a perturbation in terms of population dynamics, a memory consolidation story in terms of synaptic stuff. One of us says "that's a proper crane, it does real explanatory work," the other says "that's greedy reductionism, they've explained the capacity away," and neither of us can say what would settle it. So I want actual criteria to argue from.

  What I want from you: the list of things a proposed lower-level explanation of a higher-level pattern has to deliver to count as a crane rather than a skyhook, and as a reduction rather than a greedy one. Assume the reader is a reviewer who isn't a philosopher, so for each item give the case or consideration behind it plus roughly the question you'd actually put to the proposal — "does the story say what the phenomenon is indifferent to?," "does it say where the pattern breaks down?," that kind of thing. Not "it must be consistent with fundamental physics," which is toothless, and not one big blob item called "empirically testable."

  Here's the part I'm genuinely unsure about and want you to sort out. I've started separating two ways these stories fail: the story can be *too cheap* (it keeps the vocabulary but leaves it doing no work, so the phenomenon gets dissolved rather than explained), or *too expensive* (it saves the phenomenon by wheeling in machinery whose own operation is never accounted for). I like the contrast but I can't tell weather it's really two failure modes or one failure mode seen from two sides — and I especially can't tell whether my "too cheap" test just collapses into "the higher-level claim has to survive the reduction unchanged."

  Also: mark which items are non-negotiable and which are a preference of one camp. I think one of us wants reductions to be genuine derivations and the other is happy with a mechanism sketch, and I suspect that's a taste difference rather than a requirement, but I'd like that argued. Flag any pair we can't reasonably demand at once. And tell me which single requirement does the most work at knocking proposals out — and if everything we fund fails it, which one I should relax first. Don't run any of my examples through the list, I'll do that myself, and no citations anywhere.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Interdisciplinary funding panel (cognitive science, systems biology).
      *   **Problem:** Recurring disagreement between two reviewers on "mechanistic explanation" proposals. One sees "cranes" (good reduction), the other sees "greedy reductionism" (bad elimination/dissolution).
      *   **Goal:** A list of criteria to distinguish good reductions (cranes) from bad ones (skyhooks/greedy reductionism).
      *   **Constraints:**
          *   Audience: Reviewer (not a philosopher).
          *   Format: List of items with rationale + specific review question.
          *   Avoid: Trivialities ("consistent with physics"), vague blobs ("empirically testable"), citations.
          *   Specific Task 1: Address the "too cheap" vs. "too expensive" distinction (are they two modes or one? Does "too cheap" imply the higher-level claim must survive unchanged?).
          *   Specific Task 2: Mark items as Non-Negotiable vs. Preference (Camp A vs. Camp B).
          *   Specific Task 3: Flag incompatible pairs of demands.
          *   Specific Task 4: Identify the single most effective knockout criterion and which to relax first if funding dries up.
          *   Negative Constraint: Do *not* run the user's examples (navigation, ecosystem, memory) through the list.

  2.  **Deconstruct the Philosophical Core:**
      *   *Crane vs. Skyhook:* (Dennett's terms). Cranes build up from the bottom; Skyhooks hang from above without support. In this context, a "crane" is a mechanistic explanation that grounds the phenomenon. A "skyhook" is an unexplained explainer.
      *   *Greedy Reductionism:* Explaining something away by denying the reality or autonomy of the higher level (elimination) rather than explaining how the higher level arises (reduction).
      *   *Too Cheap:* The higher-level phenomenon disappears or becomes trivial. (Eliminativism).
      *   *Too Expensive:* The lower-level mechanism requires its own unexplained higher-level assumptions. (Homuncular fallacy/regress).
      *   *Relationship:* These are indeed two sides of the same coin (the "Goldilocks" problem of mechanistic explanation). If the mapping is too loose, it's too expensive (magic in the mechanism). If the mapping is too tight/identity-based, it's too cheap (the phenomenon is just the mechanism, losing its functional character).

  3.  **Drafting the Criteria (Iterative Process):**

      *   *Idea 1: Constitutive Relevance.* Does the lower-level part actually make a difference to the higher-level output?
          *   *Question:* If you break this part, does the capacity fail?
          *   *Status:* Non-negotiable.

      *   *Idea 2: Autonomy/Robustness.* Does the higher-level pattern hold even if the lower-level details change? (Multiple Realizability).
          *   *Question:* Is the capacity indifferent to specific micro-details?
          *   *Status:* This is where the disagreement lies. One wants strict derivation (Camp A), one wants functional autonomy (Camp B).

      *   *Idea 3: No Homunculi.* Does the mechanism rely on hidden agents?
          *   *Question:* Does the mechanism itself require the capacity it explains?
          *   *Status:* Non-negotiable (avoids "too expensive").

      *   *Idea 4: Preservation of Phenomenon.* Does the explanation account for the *errors* or *limitations* of the higher level, not just the success?
          *   *Question:* Does the story predict where the system fails?
          *   *Status:* Non-negotiable (avoids "too cheap" - ensures the specific phenomenon is captured, not just a generic success).

      *   *Idea 5: Interlevel Linkage.* How do we get from bottom to top?
          *   *Question:* Is there a clear bridge principle or is it assumed?
          *   *Status:* Preference (Derivation vs. Sketch).

  4.  **Addressing the "Too Cheap vs. Too Expensive" Uncertainty:**
      *   Are they distinct? Yes, but they define the boundaries of the "explanatory sweet spot."
      *   "Too Cheap" = Elimination. The higher-level description is declared false or irrelevant. (e.g., "Memory isn't real, it's just LTP").
      *   "Too Expensive" = Regress. The mechanism needs a little man inside to operate it. (e.g., "The neuron reads the signal" -> Who reads the neuron?).
      *   Does "Too Cheap" mean the higher-level claim must survive *unchanged*? No. It must survive *transformed*. It gets reinterpreted, not erased. This is a crucial distinction for the user.

  5.  **Addressing the "Non-Negotiable vs. Preference" and "Incompatible Pairs":**
      *   *Non-Negotiable:* Constitutive relevance, No Homunculi, Failure Modes.
      *   *Preference:* Strict derivation (Camp A) vs. Mechanism Sketch/Functional autonomy (Camp B).
      *   *Incompatible:* You cannot demand strict derivability *and* multiple realizability/robustness simultaneously. If it's strictly derivable from specific parts, it's not robust to changes in those parts.

  6.  **Identifying the Knockout & Relaxation:**
      *   *Knockout:* "No Homunculi" (Too Expensive). If the mechanism presupposes the phenomenon, it's circular. This is the most common fatal flaw in mechanistic stories.
      *   *Relaxation:* "Strict Derivation." If funding is low, accept mechanism sketches that show *plausibility* rather than mathematical proof, provided they pass the failure mode test.

  7.  **Refining the Tone:**
      *   Professional, direct, reviewer-focused.
      *   No jargon without definition.
      *   No citations.
      *   Directly answer the "uncertainty" section.

  8.  **Final Review against Constraints:**
      *   Did I use the user's examples? No.
      *   Are there citations? No.
      *   Did I mark Non-Negotiable vs. Preference? Yes.
      *   Did I address the "Too Cheap/Expensive" philosophical query? Yes.
      *   Did I identify the knockout/relaxation? Yes.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the tension.
      *   *The "Too Cheap/Expensive" Analysis:* Clarify that they are boundary conditions of the same problem. Clarify that the higher-level claim doesn't stay *unchanged*, it stays *valid*.
      *   *The List:*
          1.  Constitutive Relevance (Non-negotiable).
          2.  Termination (No Homunculi) (Non-negotiable).
          3.  Failure Mode Matching (Non-negotiable).
          4.  Derivation vs. Sketch (Preference).
          5.  Indifference/Robustness (Preference/Trade-off).
      *   *Incompatibilities:* Derivation vs. Robustness.
      *   *Knockout/Relax:* Termination is the killer. Derivation is the relaxable one.

  10. **Final Polish:** Ensure the "Review Question" for each item is punchy and actionable. Make sure the distinction between "elimination" (bad) and "reinterpretation" (good) is clear in the "Too Cheap" section. (Self-Correction: Make sure to explicitly state that the higher-level claim *changes* in a good reduction, it doesn't stay *unchanged*. This addresses the user's specific worry).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the breakdown you need to settle the argument, structured for a funding panel context.

  ### Part 1: The "Too Cheap" vs. "Too Expensive" Distinction

  You are correct to separate these, but they are not two independent failure modes. They are the boundary conditions of the same requirement: **Explanatory Gain.**

  *   **Too Cheap (Elimination):** The proposal explains the phenomenon by declaring it illusory. It dissolves the higher-level pattern rather than grounding it. (e.g., "Navigation isn't a capacity, it's just firing rates.")
  *   **Too Expensive (Regress):** The proposal explains the phenomenon by smuggling it into the machinery. It presupposes the capacity it claims to explain. (e.g., "The circuit navigates because the neurons 'know' where to go.")

  **Does "Too Cheap" mean the higher-level claim must survive unchanged?**
  No. This is the source of your deadlock. In a successful reduction (a crane), the higher-level claim **survives but is transformed.** It is reinterpreted in light of the mechanism. If the proposal demands the higher-level description remain *unchanged*, it is likely a skyhook (refusing to look under the hood). If the proposal makes the higher-level description *disappear*, it is greedy reductionism.

  **Verdict:** Treat these as two ends of a spectrum. A good proposal must navigate the middle: the higher-level capacity must be shown to *depend* on the lower-level parts without being *identical* to them in a trivial way.

  ---

  ### Part 2: The Criteria List

  Here are five criteria to apply to the proposal. I have marked which are non-negotiable requirements for *any* mechanistic explanation and which are preferences that depend on your panel's specific appetite for risk and rigor.

  #### 1. Constitutive Relevance (Non-Negotiable)
  **The Case:** A mechanism isn't just a correlation; it is made of parts that do the work. If you remove or alter the proposed lower-level component, the higher-level capacity must change or break. If the lower-level story can be true while the higher-level capacity fails (or vice versa), the explanation is decoupled.
  **The Review Question:** "If we intervene to break this specific lower-level component, does the higher-level capacity fail in the specific way predicted, or does the system compensate using a different route?"

  #### 2. Termination of the Regress (Non-Negotiable)
  **The Case:** This addresses the "Too Expensive" failure. The explanation must stop at parts that do not themselves require the capacity being explained. You cannot explain "memory" by positing a "memory module" unless you explain how the module works without using memory. The buck must stop at operations that are simpler than the phenomenon.
  **The Review Question:** "Do the operations attributed to the lower-level parts presuppose the very capacity the proposal claims to explain? Does the neuron need to 'recognize' the signal, or does it just react to it?"

  #### 3. Failure Mode Matching (Non-Negotiable)
  **The Case:** A theory that only explains success is suspect. Real mechanisms break in specific ways. If the higher-level system shows specific biases, errors, or limits (e.g., memory decays over time, navigation fails in symmetrical mazes), the lower-level story must account for *those specific flaws*, not just the ideal function. This prevents the "Too Cheap" dissolution where the real, messy phenomenon is replaced by an idealized model.
  **The Review Question:** "Does the lower-level story predict where and how the higher-level capacity will fail, or does it only model the system working perfectly?"

  #### 4. Derivation vs. Mechanism Sketch (Preference: Camp A vs. Camp B)
  **The Case:** This is the core of your disagreement.
  *   **Camp A (Derivation):** Wants to see the higher-level behavior mathematically or logically derived from the lower-level rules.
  *   **Camp B (Sketch):** Is happy with a plausible narrative of how the parts *could* organize to produce the effect, provided it's biologically/cognitively plausible.
  **The Review Question:** "Does the proposal demonstrate that the lower-level dynamics *necessitate* the higher-level pattern, or does it merely show they are *compatible* with it?"
  **Status:** **Preference.** Camp A demands proof; Camp B demands plausibility. Demanding Derivation often kills innovative interdisciplinary work prematurely. Demanding only a Sketch risks funding "just-so stories."

  #### 5. Indifference to Micro-Detail (Preference: Camp B vs. Camp A)
  **The Case:** Higher-level capacities are often robust. You can swap out neurons or individuals without losing the capacity.
  *   **Camp A:** Worries that if the explanation doesn't pin down the *exact* parts, it's vague.
  *   **Camp B:** Argues that if the explanation depends on exact micro-details, it isn't a general explanation of the capacity.
  **The Review Question:** "Is the higher-level pattern indifferent to variations in the lower-level implementation, and does the proposal acknowledge this robustness?"
  **Status:** **Preference.** Camp B sees this as a virtue (generality); Camp A sees it as a vice (lack of specificity).

  ---

  ### Part 3: Incompatible Demands

  You cannot reasonably demand **Criterion 4 (Derivation)** and **Criterion 5 (Indifference)** at the same time.

  *   If you demand strict **Derivation**, you are tying the higher-level outcome tightly to the specific lower-level equations. This makes the system fragile to micro-changes.
  *   If you demand **Indifference** (Multiple Realizability), you are admitting that the specific lower-level details don't matter, which makes strict Derivation impossible (because many different derivations would work).

  **Resolution:** You must choose whether you are funding **Engineering** (how *this* specific system works) or **Science** (how *this type* of capacity works generally).
  *   For Engineering/Systems Biology: Prioritize Derivation.
  *   For Cognitive Science/General Theory: Prioritize Indifference.

  ---

  ### Part 4: The Knockout and the Relaxation

  **The Single Most Effective Knockout Criterion:**
  **Criterion 2: Termination of the Regress.**
  This is the most common fatal flaw in "mechanistic" proposals. Reviewers often get dazzled by complex circuitry or population models and miss that the components are being anthropomorphized or endowed with hidden intelligence. If the mechanism relies on parts that "know," "try," or "represent" without explaining how *they* do that, the explanation is circular. It is a skyhook disguised as a crane.
  *   *Action:* If a proposal fails this, reject it immediately. It is not an explanation; it is a displacement of the mystery.

  **The First Criterion to Relax if Funding Dries Up:**
  **Criterion 4: Derivation.**
  If you have many proposals that pass the Non-Negotiables (Relevance, Termination, Failure Modes) but lack a full mathematical derivation, fund the **Mechanism Sketches**.
  *   *Reasoning:* In interdisciplinary work, the mapping between levels is often discovered *after* funding, through the work itself. Demanding full derivation at the proposal stage biases selection toward mature fields and against novel connections. A plausible sketch that avoids circularity and matches failure modes is sufficient for a "crane," even if the math isn't finished. Strict derivation is a luxury of mature sciences, not a prerequisite for exploratory funding.

  ### Summary for Your Colleague
  *   **Agree on:** Relevance, No Circularity, Failure Modes. (These prevent bad science).
  *   **Debate on:** Derivation vs. Sketch, Specificity vs. Robustness. (These are strategic choices about what kind of science to buy).
  *   **Watch out for:** Proposals that make the phenomenon disappear (Too Cheap) or proposals that hide the phenomenon inside the parts (Too Expensive). The phenomenon must be *reinterpreted*, not erased or presupposed.
