prompt: |-
  I am preparing a single fifty-minute seminar for third-year philosophy students who have just finished a unit on classical Chinese thought. Next session I need to introduce them to the dialogue attributed to Gongsun Long—commonly called the White Horse Dialogue—and to the broader concerns of the School of Names (Mingjia). The students have read a translation of the dialogue, but they are consistently misreading it: some treat it as a proto-Zenonian paradox about motion and division, others reduce it to a purely linguistic claim about how the predicate white modifies horse, and a few import Quinean ontological relativity to argue that the dispute is merely about how we choose to divide the world into categories. I do not want you to explain the dialogue’s arguments to me; I want a teaching plan. First, lay out the dependency order: which conceptual distinction—perhaps between universal form (xing) and particular color-determination (se), or between the name (ming) and the actuality (shi)—must be secured before the claim that a white horse is not a horse can appear as a substantive ontological thesis rather than a flat contradiction? Second, identify the one carrying example or analog that should bear the full explanatory load for this session, and specify exactly what it must include and what it must lack: for instance, why comparing it to Aristotelian accidental properties fails, and what modern or cross-cultural analog might work better without distorting the Mingjia concern with correct naming. Third, map the misconceptions I should anticipate—the Zeno confusion, the linguistic-reductionist reading, the Quinean framing—and indicate precisely where in the sequence each should be defused. Fourth, propose one concise check for understanding at the end that reveals whether students have grasped the School’s specific worry about the relationship between names and actualities, rather than just parroting the dialogue’s conclusion. Finally, state explicitly what I should leave out at this level—perhaps the Mohist logical rebuttals, the full five-part structure of the dialogue, or the later Han synthesis—and confirm that I should openly tell the students we are bracketing it.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Third-year philosophy students (advanced undergraduates/early graduates).
      *   **Context:** 50-minute seminar, following a unit on classical Chinese thought (Confucianism, Daoism, Mohism likely covered).
      *   **Topic:** Gongsun Long's *White Horse Dialogue* (Baima Lun) and the School of Names (Mingjia).
      *   **Problem:** Students are misreading the text (Zeno/paradox, linguistic triviality, Quinean ontological relativity).
      *   **Constraint 1 (Content):** Do *not* explain the arguments themselves. Provide a *teaching plan*.
      *   **Constraint 2 (Structure):**
          1.  Lay out the dependency order of conceptual distinctions (what must be secured first).
          2.  Identify *one* carrying example/analog (what it must include/lack, why Aristotle fails, what works better).
          3.  Map misconceptions (Zeno, Linguistic, Quinean) and where to defuse them.
          4.  Propose *one* concise check for understanding.
          5.  State explicitly what to leave out and confirm telling students it's bracketed.

  2.  **Deconstruct the Philosophical Challenge:**
      *   The core issue is that modern students read "is" as identity or predication in a Western analytic sense. Gongsun Long is operating within a specific Warring States context where *Ming* (Name) and *Shi* (Actuality/Reality) must align for political and cosmic order.
      *   The claim "A white horse is not a horse" is not a biological denial but a logical/ontological distinction regarding the *extension* and *intension* of names.
      *   To make it substantive, students need to understand that *Ming* are not just labels but normative standards.

  3.  **Drafting Section 1: Dependency Order (Conceptual Scaffolding):**
      *   What needs to come first? If they think *Ming* = English words, they fail. If they think *Shi* = physical objects only, they fail.
      *   Priority 1: *Ming* (Name) as a normative standard/role, not just a label.
      *   Priority 2: *Shi* (Actuality) as the concrete fulfillment of that role.
      *   Priority 3: The distinction between the *compound name* (White Horse) and the *simple name* (Horse).
      *   Priority 4: The ontological claim (the thesis itself).
      *   *Refinement:* The prompt suggests *xing* (form) vs. *se* (color) or *ming* vs. *shi*. The *Ming-Shi* correlation is the broader School of Names concern. The *Xing-Se* distinction is specific to Gongsun Long's metaphysics. Let's prioritize *Ming-Shi* as the political/philosophical frame, then *Zhi* (Designation/Referent) vs. *Wu* (Thing) as the logical frame. Actually, the prompt asks for the distinction needed *before* the claim appears substantive. That is the distinction between the *extension* of a name and the *essence* of a name. But in Chinese terms, it's about the *compound designation* vs. the *simple designation*.
      *   *Decision:* The crucial dependency is understanding *Ming* as a rigid designator of a specific *form* (xing) independent of accidental qualifiers. If "Horse" names the *form*, and "White" names the *color*, "White Horse" names the *compound*. If the names differ, the actualities they govern differ.
      *   *Order:* 1. *Ming* as normative standard (not just label). 2. Distinction between Compound Name vs. Simple Name (not just Object A vs. Object B). 3. Identity of Name = Identity of Actuality.

  4.  **Drafting Section 2: The Carrying Example/Analog:**
      *   *Why Aristotle fails:* Aristotelian substance/accident (Horse = Substance, White = Accident) leads to "A white horse IS a horse (with an accident)." This reinforces the student's intuition that Gongsun Long is wrong/crazy. We need an analog where the compound creates a *new category* that excludes the simple.
      *   *What works:* A functional/role-based analog. "A guard dog is not a dog." Why? Because if you ask for a "dog" (pet), a "guard dog" (working animal) might not fit the specific request. Or better: "A king is not a man." (Legal/Political status).
      *   *Better Analog:* "A red light is not a light." No, that's confusing.
      *   *Best Analog:* **Official Titles/Roles.** "The Chancellor is not the Man." Or "A 'No Entry' sign is not a sign."
      *   *Selection:* **The "Official Seal" or "Tally" Analog.** In Warring States, access was granted by matching tallies. If the tally says "General," a "Colonel" (even if a man) cannot pass.
      *   *Wait, keep it philosophical but accessible:* **The "Job Description" Analog.** "A 'Senior Developer' is not a 'Developer'." In HR terms, if you apply for the role "Developer," a "Senior Developer" is overqualified/different contract. If you apply for "Senior," a "Developer" is underqualified. The *names* dictate different *requirements* (Shi).
      *   *Refinement for Chinese Context:* The "Key and Lock" analog. A key for a "White Horse" lock won't open a "Horse" lock.
      *   *Let's go with the "Request/Order" Analog.* If I order "fruit," and you bring "apples," good. If I order "apples," and you bring "fruit" (oranges), bad. But Gongsun Long says "White Horse is NOT Horse." So if I ask for a "Horse," a "White Horse" *is* a horse in common sense. Gongsun says no.
      *   *Correction:* The analog must show that adding a qualifier *changes the identity of the name* such that they are not interchangeable in a normative context.
      *   *Selected Analog:* **The "Legal Contract/Specification" Analog.** If a contract specifies "Vehicle," a "Truck" might not satisfy it if the intent was "Car." But Gongsun is stricter.
      *   *Let's try the "Password" Analog.* Password "Horse" $\neq$ Password "White Horse".
      *   *Best Fit:* **The "Official Title" (Mingfen) Analog.** "The King is not a Man." If the ritual requires a "King," a "Man" cannot substitute. If the ritual requires a "Man," a "King" (as a specific office) is a distinct category of obligation.
      *   *Wait, the prompt asks for ONE carrying example.* Let's use **"The Official Tally (Fu)"**. It fits the historical context of *Ming-Shi*.
      *   *Includes:* The necessity of exact matching for function.
      *   *Lacks:* Biological/physical containment (avoids the "but it *is* biologically a horse" trap).

  5.  **Drafting Section 3: Mapping Misconceptions:**
      *   *Zeno/Paradox:* Defuse early. This isn't about motion or infinite divisibility. It's about static classification. (Minute 10).
      *   *Linguistic/Trivial:* Defuse during the analog section. It's not about grammar; it's about the *power* of the name to command reality. (Minute 25).
      *   *Quinean/Ontological Relativity:* Defuse at the end. It's not that *we* choose categories; it's that the categories have inherent normative force independent of us. (Minute 40).

  6.  **Drafting Section 4: Check for Understanding:**
      *   Need something that tests *Ming-Shi* correlation, not just "White Horse $\neq$ Horse."
      *   *Task:* Present a scenario where the distinction matters practically (political/ritual).
      *   *Question:* "If a law forbids 'horses' from entering the city, does Gongsun Long allow a 'white horse' to enter? Why?" (This is the classic test).
      *   *Wait, that's too common.* Let's make it about *naming*. "If you have a 'white horse' name-tag, can you enter the 'horse' zone?"
      *   *Better:* Ask them to formulate a *Ming-Shi* failure scenario unrelated to horses. "Give me an example where using the broader name fails to capture the required actuality of the specific name."

  7.  **Drafting Section 5: What to Leave Out:**
      *   Mohist Canons (too technical).
      *   The 5-part dialogue structure (too textual).
      *   Han Feizi/Later synthesis (too historical).
      *   *Confirm:* Yes, explicitly tell students this is bracketed.

  8.  **Review and Refine:**
      *   *Tone:* Professional, pedagogical, authoritative.
      *   *Constraint Check:* Did I explain the arguments? No. Did I give a teaching plan? Yes.
      *   *Dependency Order:* Make sure it's clear that *Ming* as normative comes before *Ming* as logical.
      *   *Analog:* Ensure the "Official Tally" or "Title" analog is fleshed out regarding why Aristotle fails (Substance/Accident implies inclusion; Gongsun implies exclusion of names).
      *   *Misconceptions:* Be precise on *when* to address them.
      *   *Check:* Make it actionable.

      *(Self-Correction on the Analog)*: The "Official Tally" is historically accurate but might be abstract. The "Job Title" is more relatable. Let's combine them into a "Normative Role" analog. "A 'Judge' is not a 'Person'." In a courtroom, if the protocol calls for a 'Judge', a 'Person' cannot sit. If it calls for a 'Person', a 'Judge' brings extra baggage. But Gongsun's point is stronger: The *Name* "White Horse" has a different extension than "Horse".
      *Actually, the strongest analog for "White Horse is not Horse" without falling into Aristotle is the "Compound Key" analog.* A key cut for "Horse" will not turn in a lock labeled "White Horse". This captures the *non-interchangeability* which is the core of the *Ming-Shi* problem. It avoids biology (Aristotle) and avoids pure linguistics (Quine). It emphasizes *function*.
      *Let's stick with the "Official Title/Role" analog as it fits the *Mingjia* political concern better.* "The Duke is not a Man."

      *(Refining the Dependency Order)*:
      1. *Ming* is not a label, it is a standard (Fa).
      2. *Shi* is not an object, it is the fulfillment of the standard.
      3. Therefore, different *Ming* demand different *Shi*.
      4. "White Horse" and "Horse" are different *Ming*.
      5. Therefore, they govern different *Shi*.

      *(Refining Misconceptions)*:
      *   Zeno: Address immediately after reading the thesis.
      *   Linguistic: Address during the Analog phase.
      *   Quine: Address during the conclusion/implications.

      *(Refining Check)*:
      *   Scenario: A border guard.
      *   Prompt: "Apply the *Ming-Shi* logic to a modern ID check."

      *(Refining Exclusions)*:
      *   Mohist rebuttals are definitely out.
      *   The specific logical steps of the dialogue (the "seeking" argument, etc.) should be background, not focus.

  9.  **Final Polish:** Check word count and tone. Ensure all constraints of the prompt are met explicitly. (e.g., "State explicitly what I should leave out... and confirm that I should openly tell the students").

      *Wait, one nuance:* The prompt asks for *one* carrying example. I need to be very specific about what it includes/lacks.
      *Example:* "The Official Seal."
      *Includes:* Binary match/no-match, functional consequence, normative authority.
      *Lacks:* Physical composition, biological taxonomy, speaker intention.
      *Why Aristotle fails:* Aristotle asks "What is it?" (Ontology of substance). Gongsun asks "Does the name match the requirement?" (Ontology of order).

