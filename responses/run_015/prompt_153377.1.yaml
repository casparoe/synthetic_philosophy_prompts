answer: |-
  ### Teaching Plan: Gongsun Long and the School of Names

  **Session Duration:** 50 Minutes
  **Goal:** Shift student interpretation from linguistic paradox/analytic triviality to ontological-normative distinction (*Ming-Shi* correlation).

  #### 1. Conceptual Dependency Order
  Do not present the thesis ("A white horse is not a horse") until the following three conceptual distinctions are secured in sequence. If the thesis is presented first, students will default to Western analytic categories (identity/predication) to resolve the "contradiction."

  1.  **Name (*Ming*) as Normative Standard, Not Label:** Students must first grasp that in the Warring States context, a *Ming* is not merely a word we attach to a thing, but a prescriptive standard (*fa*) that dictates how a thing *ought* to be to bear that name.
  2.  **Actuality (*Shi*) as Fulfillment, Not Object:** Consequently, *Shi* is not the physical object itself, but the object's successful alignment with the normative standard of the *Ming*.
  3.  **Compound vs. Simple Designation:** Only then can you establish that "White Horse" and "Horse" are not two labels for the same object, but two distinct *standards* requiring different fulfillments. If the *Ming* differs, the *Shi* required differs; therefore, the actualities are not identical.

  *Instructional Note:* Secure point #1 before handing out the text's conclusion. If they think *Ming* = "English noun," the session will fail.

  #### 2. The Carrying Example: The "Official Tally" (Fu)
  Use the **Official Tally (Fu)** as the single explanatory analog for the entire session. In the Warring States period, military command or border access required two halves of a tally to match exactly.

  *   **What it must include:**
      *   **Binary Functionality:** The tally either opens the gate/command or it does not. There is no "partial" truth.
      *   **Normative Authority:** The power lies in the *match* between the name on the tally and the requirement of the gate, not in the physical material of the tally.
      *   **Non-Interchangeability:** A tally inscribed "General" cannot open a lock inscribed "Colonel," even if the General is physically present and capable.
  *   **What it must lack:**
      *   **Biological/Physical Containment:** Do not use analogies involving parts and wholes (e.g., "a wheel is not a car"). This invites mereological confusion.
      *   **Speaker Intention:** Do not frame it as "what the speaker meant." The tally works regardless of what the guard wishes.
  *   **Why Aristotelian Accident/Substance Fails:**
      *   In Aristotle, "White" is an accident of the substance "Horse." This implies inclusion (White Horse $\subset$ Horse). This reinforces the student's intuition that Gongsun Long is wrong.
      *   The Tally analog enforces **exclusion based on specification**. A "White Horse Tally" is a different key than a "Horse Tally." If the lock requires "Horse," the "White Horse" key is the *wrong key*, not a *subset key*. This captures the *Mingjia* concern: using the wrong name disrupts the cosmic/political order, regardless of physical overlap.

  #### 3. Mapping and Defusing Misconceptions
  Address these misconceptions at specific junctures to prevent them from calcifying.

  *   **The Zeno/Paradox Confusion (Motion/Division):**
      *   *When:* **Minute 5 (Introduction).**
      *   *Defusal:* Explicitly state: "This is not about physics, motion, or infinite divisibility. Gongsun Long is not Zeno. We are discussing static classification and political order, not the possibility of movement."
  *   **The Linguistic-Reductionist Reading (Semantics only):**
      *   *When:* **Minute 20 (During the Tally Analog).**
      *   *Defusal:* When students argue "It's just about how we use words," intervene with the Tally: "If you use the wrong tally, you are executed. It is not a semantic preference; it is an ontological failure of the *Shi* to meet the *Ming*. The name has power over reality."
  *   **The Quinean/Ontological Relativity Framing (Conceptual Schemes):**
      *   *When:* **Minute 40 (Conclusion/Discussion).**
      *   *Defusal:* Students will argue "We just carve the world differently." Correct this: "For Gongsun Long, the distinctions are not up to us. The *Ming* exist as objective standards. We do not choose the categories; we must discover if our *Shi* aligns with the pre-existing *Ming*. It is realism about names, not relativism."

  #### 4. Check for Understanding
  Do not ask them to summarize the argument. Ask them to apply the *Ming-Shi* logic to a new normative scenario.

  *   **The Prompt:** "Imagine a ritual law states: 'Only those bearing the name *Father* may perform this rite.' A man is biologically the father, but he has been stripped of his title due to misconduct. According to the *Ming-Shi* logic of the School of Names, can he perform the rite? Why?"
  *   **Success Criteria:**
      *   *Fail:* "Yes, because he is biologically the father." (Misses the *Ming* as normative).
      *   *Fail:* "No, because words are arbitrary." (Misses the objective force of *Ming*).
      *   *Pass:* "No. His *Shi* (biological reality) does not match the *Ming* (normative title). Since the *Ming* governs the permission, the biological fact is irrelevant."

  #### 5. Explicit Exclusions (Bracketing)
  You must explicitly tell the students at the start of the seminar that you are **bracketing** the following to maintain focus on the ontological thesis:

  1.  **The Mohist Logical Rebuttals:** Do not discuss the *Mohist Canons* or their counter-arguments regarding "killing a thief is not killing a man." This introduces competing logical systems that will confuse the specific *Mingjia* ontology.
  2.  **The Five-Part Dialogue Structure:** Do not walk through the specific back-and-forth of the Guest and Host in the text. Treat the dialogue as a source for the thesis, not a dramatic script to be analyzed line-by-line.
  3.  **The Han Synthesis:** Do not discuss how later Han dynasty thinkers assimilated the School of Names into correlative cosmology.

  **Instruction:** State clearly: *"We are ignoring the historical rebuttals and the textual structure today. We are treating 'White Horse is Not Horse' as a standalone ontological claim about the relationship between Names and Actuality."* This prevents students from trying to "solve" the dialogue historically rather than philosophically.
