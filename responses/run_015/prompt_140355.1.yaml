      *Refining the Crux:* The crux isn't just aggregation. It's whether trivial harms *across persons* can aggregate to override a severe harm *to one person*. This is the "Numbers Problem" in contractualism.

  7.  **Final Polish:** Check constraints. "Adjudicate move by move," "rate," "justify," "say what both parties are missing."

      *Let's refine the ratings.*
