answer: |-
  # The Advance Directive Sorting Quiz
  **For:** Psychiatry Trainees & Clinical Ethicists  
  **Time:** 15 Minutes  
  **Instructions:** Read each scenario. Choose the option that best matches your *immediate* ethical intuition. Do not overthink; there are no "correct" answers.

  ---

  ### The Cases

  **1. The Happy Dementia (The Core Case)**  
  A man with moderate Alzheimer's is cheerful and social. Ten years ago, he signed a directive refusing life-sustaining treatment if he lost independence. He now has pneumonia.
  *   **A.** Treat the pneumonia. The directive applies; his past self decided this threshold.
  *   **B.** Do not treat aggressively. His current happiness is fleeting; his past values govern.
  *   **C.** Convene a meeting with his family and care team to decide what "independence" means to him *now*.

  **2. The Competent Revocation**  
  A woman with early-stage Huntington's signed a directive refusing feeding tubes. She is currently fully competent but anxious. She asks for the directive to be torn up "just in case."
  *   **A.** Refuse to destroy it. She made this promise when she was calm and rational; she must stick to it.
  *   **B.** Destroy it immediately. A competent adult can change their mind at any time.
  *   **C.** Delay the decision. Require a second opinion to ensure her anxiety isn't clouding her judgment.

  **3. The Teenage Philosopher**  
  A 19-year-old wrote a directive refusing all psychiatric intervention based on a deep philosophical belief in "mental liberty." At 40, after a psychotic break, he wants treatment.
  *   **A.** Ignore the directive. A 19-year-old cannot know what psychosis feels like or what they will value.
  *   **B.** Honor the directive. It expresses a core identity commitment he made before illness.
  *   **C.** Use the directive as a guide, but prioritize the treatment plan that restores his current ability to choose.

  **4. The Factual Error**  
  A patient's directive refuses blood transfusions based on the belief that "modern medicine can always cure anemia without blood." This is medically false.
  *   **A.** Override the directive. It was based on false information the patient would have corrected.
  *   **B.** Follow the directive. The outcome (no blood) is what they wanted, even if the reason was wrong.
  *   **C.** Seek a court order. The conflict between belief and fact requires legal arbitration.

  **5. The Religious Conversion**  
  A secular man wrote a directive requesting euthanasia (where legal) if incapacitated. He later converts to a religion forbidding it but cannot communicate his new view due to a stroke.
  *   **A.** Follow the written directive. The secular self was the last competent author.
  *   **B.** Follow the religious view. His fundamental identity has changed; the old self is gone.
  *   **C.** Consult his religious community and family to interpret his new identity's wishes.

  **6. The Depressive Document**  
  A patient wrote a directive during a severe depressive episode refusing all care. They are now recovered (but incapacitated due to physical illness) and family says "that wasn't them."
  *   **A.** Invalidate the directive. Depression distorts values; it wasn't an authentic choice.
  *   **B.** Honor the directive. Suffering is part of the human condition; we cannot edit out the "dark" versions of ourselves.
  *   **C.** Treat provisionally. See if the patient responds to care before making a final decision on the directive.

  **7. The Secret Breach**  
  A patient's directive refuses a specific medication. Giving it would help them, and no one (family, records, auditors) would ever know the directive was ignored.
  *   **A.** Give the medication. Welfare matters; secrets don't hurt anyone.
  *   **B.** Withhold the medication. A rule broken in secret is still a broken promise.
  *   **C.** Document the dilemma. The act of recording it acknowledges the breach of trust.

  **8. The Disagreeing Proxy**  
  A patient's directive names a sister as proxy. The directive says "no nursing home." The sister (who knows the patient best) says "he would hate this house, ignore the paper."
  *   **A.** Follow the paper. The directive is the only objective evidence we have.
  *   **B.** Follow the sister. She is the relational authority, not the document.
  *   **C.** Follow the sister only if she can prove his *values* changed, not just his preferences.

  **9. The Fading Light (MCI)**  
  A patient has Mild Cognitive Impairment. They fluctuate between understanding the directive and forgetting it exists.
  *   **A.** The directive stands. They were competent when they wrote it; current fluctuation doesn't matter.
  *   **B.** The directive fades. As their memory fades, so does the authority of their past self.
  *   **C.** Assess capacity in the moment. If they are lucid *now*, their current word overrides the past.

  **10. The Ice Cream vs. The Nursing Home**  
  A directive refuses "unpleasant experiences" (e.g., forced feeding) and "loss of dignity" (e.g., nursing home). The patient now loves ice cream (experiential) but is safe in a home (critical).
  *   **A.** Honor the refusal of the home. Dignity is a critical interest that survives impairment.
  *   **B.** Ignore both. If they enjoy the ice cream and the home, their current experience is all that counts.
  *   **C.** Honor the home refusal, ignore the ice cream. Distinguish between life-shaping values and momentary tastes.

  **11. The Institutional Trust**  
  If we ignore this directive, it might help this patient, but it could make future patients distrust the system and stop writing directives.
  *   **A.** Ignore the directive. We treat the patient in front of us, not the system.
  *   **B.** Follow the directive. We are guardians of the practice of advance care planning.
  *   **C.** Follow the directive, but document why, to maintain transparency for the system.

  **12. The "Dead Hand" Control**  
  A fully competent 50-year-old tries to revoke a directive made at 40. The directive states: "This cannot be revoked even if I change my mind."
  *   **A.** Allow revocation. No past self can chain a future competent self.
  *   **B.** Enforce the clause. Autonomy includes the right to bind one's future self.
  *   **C.** Allow revocation but require a waiting period to ensure it's not impulsive.

  ---

  ### Scoring Key & Position Mapper

  **Step 1: Tally Your Answers**
  Count how many times you chose **A**, **B**, or **C**.
  *   **A Score (The Document):** Prioritizes the written directive/past self.
  *   **B Score (The Current Self):** Prioritizes current welfare/identity/wishes.
  *   **C Score (The Context):** Prioritizes process, relationships, or institutional factors.

  **Step 2: Find Your Dominant Family**
  *   **Mostly A:** You lean toward **Precedent Autonomy**.
  *   **Mostly B:** You lean toward **Current Welfare/Interest**.
  *   **Mostly C:** You lean toward **Relational/Procedural**.
  *   **Mixed/Tied:** You are likely a **Pragmatic Pluralist** (see Rule below).

  **Step 3: Locate Your Specific Position (The Leaves)**
  *Use your specific answers on the "Tie-Breaker Questions" listed below to pinpoint your exact philosophical leaf.*

  #### 🌿 Family 1: The Document Rules (Mostly A)
  *   **Strong Precedent Autonomy:** You chose **A** on Q2 (Competent Revocation) and Q11 (Institutional Trust).
      *   *Awkward Commitment:* You must enforce a "no revocation" clause even on a fully competent adult.
  *   **Dworkin's Critical Interests:** You chose **A** on Q10 (Ice Cream vs. Home) but **B** on Q1 (Happy Dementia).
      *   *Awkward Commitment:* You must distinguish between "what makes life good" and "what feels good," even when the patient can't.
  *   **Promising/Institutional:** You chose **B** on Q7 (Secret Breach) and Q11 (Institutional Trust).
      *   *Awkward Commitment:* You might harm a patient to maintain trust in a system they will never interact with again.

  #### 🌿 Family 2: The Current Self Rules (Mostly B)
  *   **Evidence Only:** You chose **B** on Q3 (Teenage Philosopher) and Q4 (Factual Error).
      *   *Awkward Commitment:* A directive is no more binding than a casual comment made last week.
  *   **Epistemic/Defeasible:** You chose **A** on Q4 (Factual Error) but **B** on Q1 (Happy Dementia).
      *   *Awkward Commitment:* You claim the past self is the "better judge" until they clearly aren't, which is circular.
  *   **The Empty Leaf (Dead Hand Control):** You chose **B** on Q2 (Competent Revocation).
      *   *Status:* **Unattractive.** Logically possible (contract law), but ethically repugnant in medicine. It treats a competent adult as a minor of their past self.

  #### 🌿 Family 3: The Context Rules (Mostly C)
  *   **Relational/Joint-Authorship:** You chose **C** on Q8 (Disagreeing Proxy) and Q5 (Religious Conversion).
      *   *Awkward Commitment:* If the family and clinicians agree, the patient's written word can be outvoted.
  *   **Gradualist/Psychological Continuity:** You chose **B** on Q9 (Fading Light) and **C** on Q1 (Happy Dementia).
      *   *Awkward Commitment:* Authority is a "dimmer switch," meaning there is no clear moment when a decision becomes valid.

  ---

  ### Workshop Discussion Notes

  #### 1. The "Empty Leaf" Analysis
  **Position:** *The earlier self has full authority over a later self who is completely competent, fully informed, and has no impairment.*
  **Verdict:** **Ethically Unattractive (not Incoherent).**
  **Why:** It is logically consistent (like a binding contract), but it violates the foundational bioethical principle that *current* competent autonomy is sovereign. If a patient is competent *now*, they have the right to redefine their values. To deny this is to treat the patient as property of their past self. Most trainees who select this (Option B on Q2) usually shift when challenged on "why can't I change my mind?"

  #### 2. Indistinguishable Leaves
  **Position:** *Evidence Only* vs. *Epistemic/Defeasible.*
  **Verdict:** **Practically Identical.**
  **Why:** Both positions usually result in ignoring the directive when the current patient expresses a contrary wish. The difference is theoretical: one says the document is *weak evidence*, the other says it is *strong evidence that is defeated*.
  **Fix:** A 13th question could separate them: *"If the patient is non-verbal and happy, does the directive regain its full force?"* (Epistemic says Yes; Evidence says No). For this workshop, treat them as the same pragmatic cluster.

  #### 3. Rule for Mixed or Tied Scores
  **The "Pragmatic Pluralist" Rule:**
  If your scores are tied (e.g., 4 A, 4 B, 4 C), do not force a choice.
  **Instruction:** "You are likely a contextualist. You do not have one rule; you have a hierarchy of rules that shifts based on the stakes. In the discussion, identify which *type* of case makes you switch from A to B. That 'switching point' is your actual ethical framework."

  #### 4. The Dworkin Distinction (Critical vs. Experiential)
  **Note:** This is the most common split in the room.
  **Key Question:** Q10 (Ice Cream vs. Nursing Home).
  **Discussion:** If you honor the refusal of the home but ignore the refusal of ice cream, you are making a Dworkinian distinction. Be prepared to defend *how* you know which interests are "critical" without imposing your own values.

  #### 5. The "Secret Breach" (Promising View)
  **Key Question:** Q7.
  **Discussion:** Those who choose B (Withhold) even in secret are prioritizing the *institution* over the *individual*. This is a robust but difficult position to hold in patient-centered care. Ask them: "Who is harmed if no one knows?"

  ---

  ### Facilitator's Cheat Sheet (Logical Space)
  *Use this to map the room's responses on a whiteboard.*

  1.  **Impairment Level:** Does authority fade? (Q1, Q9) -> *Gradualist vs. Switch*
  2.  **Information Quality:** Did they know the facts? (Q4) -> *Epistemic vs. Strong*
  3.  **Identity Continuity:** Are they the same person? (Q3, Q5) -> *Narrative vs. Biological*
  4.  **Mental State:** Was the writing authentic? (Q6) -> *Psychiatric Exception*
  5.  **Social Context:** Does secrecy matter? (Q7, Q11) -> *Promising vs. Welfare*
  6.  **Surrogate Role:** Who decides? (Q8) -> *Relational vs. Legalistic*
  7.  **Competence:** Can you bind the competent? (Q2) -> *The Empty Leaf*
