      *   *P3: Epistemic/Defeasible.* Past self is the best *judge*, but new info/welfare can override. Presumption, not absolute.
      *   *P4: Evidence Only.* The AD is just data points about values, no more binding than a verbal comment last week. Current best interests rule.
      *   *P5: Promising/Institutional.* Binding because of the social practice of promising/trust in the medical system, not metaphysical identity.
      *   *P6: Relational/Joint-Authorship.* Decision is made *now* by the network (patient + surrogate + clinician). AD is a conversation starter.
