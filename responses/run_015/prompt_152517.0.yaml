      *   *Casey's Stance (Physicalist/Embodied Cognition):* Mary works because she's human. An AI without sensors isn't "missing" experience; it's incapable of having it in the relevant sense. Consciousness might require biological embodiment or specific sensory input mechanisms. Comparing a server to a brain is a category error. The AI isn't a subject of experience, just a simulator.

  3.  **Drafting - Section by Section:**

