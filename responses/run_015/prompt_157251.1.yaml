  **MALTHUSIAN CAPITAL, LP — LONG-DATED THESES**
  **Annual Letter to Limited Partners**
  **Fiscal Year Ending 2023**

  Dear Partners,

  We understand the frustration regarding fund performance. By conventional metrics, the apocalypse is underperforming. Global caloric availability is at record highs; fertility rates in developed markets are collapsing below replacement without the anticipated corrective misery; crop yields continue to climb. To the naked eye, the thesis appears delayed. To the model, it appears merely calibrated.

  Investors often mistake a conditional prediction for a fixed appointment. Our thesis was never that starvation would occur by 2020, but that population growth *would* outrun supply *ceteris paribus*—all other things being equal. They were not equal. The twentieth century was an anomaly, a brief divergence from the historical rule driven by what we classify under the **Fossil-Energy Exclusion Clause**.

  The Green Revolution did not refute Malthusian arithmetic; it subsidized it. We treated high-yield varieties not as permanent technological gains, but as a one-time drawdown of cheap fossil fuel reserves used to manufacture nitrogen fertilizer and pump aquifers. You cannot eat oil forever. When we adjust our **Carrying-Capacity Utilization Ratio (CCUR)** to account for the energy cost per calorie produced, rather than just the calorie count, the utilization rate sits at 94%. The surplus is an illusion created by burning ancient carbon to feed current mouths. We are not richer; we are borrowing from the geological past to pay the biological present.

  Furthermore, we have activated the **Resource Substitution Protocol**. While famine was the predicted check, it is not the only check. As topsoil depletion and phosphorus scarcity tighten, the bottleneck shifts from calories to input costs. The misery may arrive not as starvation, but as stagflationary pressure on agricultural inputs that squeezes margins before it empties bowls. We are re-weighting the portfolio to short phosphorus miners and long arable land with independent water tables. The crisis remains valid; the symptom has mutated.

  Some partners have cited the Boserupian counter-argument—that necessity drives innovation which expands capacity. This assumes innovation is free. It is not. It requires energy and stability, both of which are degraded by the very pressure that supposedly triggers the innovation. We view the Boserupian bounce as a volatility spike within a secular decline.

  We must concede a limitation in our prospectus: while the direction is invariant, the timing is discretionary. Our models confirm the wall exists; they do not timestamp the impact. This is the nature of long-dated thesis investing. The nineteenth century was the rule; the twentieth was the exception. We are returning to the rule.

  However, patience has a cost. Historically, we have absorbed the cost of timing variance within the management fee. Going forward, to align interests during this maturation period, we are introducing a **Malthus Timing Risk Fee**. This applies to any partner redeeming capital before the thesis triggers (defined as a global caloric deficit sustained for four quarters). This fee covers the liquidity penalty of exiting a position that is logically sound but temporally premature.

  We invite you to stay. The arithmetic is immutable, even if the calendar is not.

  Sincerely,

  The Investment Committee
  Malthusian Capital, LP
