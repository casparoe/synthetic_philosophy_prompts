  No, they do not hang together. You are trying to hold robust non-naturalist realism while simultaneously making concessions to constructivism and evolutionary naturalism that undermine the core metaphysics.

  Here is the ranking of tensions by severity, followed by the required cut.

  ### 1. The Darwinian Dilemma (Claims 1 & 4) — **Critical**
  This is the fatal flaw. Claim (1) posits reasons as non-natural, mind-independent facts outside the causal order. Claim (4) asserts that evolutionary history (a natural, causal process) tracks these facts. Unless you posit a pre-established harmony or divine guarantee, there is no explanatory bridge for how natural selection tracks non-natural truths. By asserting (4), you invite the very evolutionary debunking argument you reject in (3). You cannot claim reasons are causally inert (1) and yet causally tracked (4) without a massive, unsupported metaphysical commitment.

  ### 2. Existence vs. Function (Claims 1 & 2) — **Moderate**
  Claim (1) says reasons exist independently of minds. Claim (2) says they don't *function* as reasons without possible access. This is verbally resolvable but metaphysically tense. If a reason exists but cannot function for any mind, is it normative? You can save this by distinguishing ontological existence from normative application, but it leaves your realism looking otiose in edge cases.

  ### 3. The Empty Simulation (Claims 2 & 5) — **Low**
  Claim (5) says requirements hold in a closed simulation. Claim (2) says reasons need possible access. If the simulation contains *you* ("required of us"), access is possible, and there is no conflict. This tension only arises if you imagine a truly empty world, which (5) does not strictly entail.

  ### The Verdict: Claim (4) Has to Go
  You must drop the claim that evolution tracks moral truth. It is the weakest link empirically and the most dangerous strategically. It undermines your non-naturalism (1) and weakens your defense against skepticism (3).

  **The Cheapest Revision:**
  Replace (4) with a defensive epistemological claim: *"Our evolutionary history explains the origin of our intuitions, but does not defeat their justification."*
  This keeps (3) intact without making the positive tracking claim that triggers the Darwinian Dilemma. You maintain that our intuitions *might* be reliable, but you stop short of claiming evolution *made* them reliable. This preserves your non-naturalist realism (1 & 5) and avoids the constructivist slide of (2) by treating accessibility as a condition for application, not existence.

  **Summary:** Keep the robust realism (1, 5), keep the accessibility constraint for pedagogy (2), keep the anti-skepticism (3), but sacrifice the evolutionary confidence (4). It is the only way to stop the package from eating itself.
