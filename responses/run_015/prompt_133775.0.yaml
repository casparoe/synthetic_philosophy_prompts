answer: |-
  ### Round-by-Round Adjudication

  **Round 1: The Indexing Problem**
  *   **Mira (Indexing Problem):** *Somewhere in between.* Mira correctly identifies a difficulty for externalism: explaining why a universal norm applies to *this* specific agent at *this* specific time. However, she is mistaken in assuming that only psychological states can provide this index. Her claim that a reason must be anchored in a commitment to target an agent is the very point in dispute, not an established premise.
  *   **Jonas (Causal-Historical Index):** *Clearly Right.* Jonas correctly notes that agent-relativity can be secured by objective facts (who spoke, who signed, who occupies the chair) without reference to psychology. The fact that Jonas made the promise particularizes the reason to him just as effectively as a desire would, solving the indexing problem without conceding to internalism.

  **Round 2: Binding Force vs. Justification**
  *   **Mira (Particularization $\neq$ Binding):** *Somewhere in between.* Mira is right that identifying the target of a reason is not the same as explaining its normative force. However, she is mistaken in claiming that a "sound deliberative route" from actual motivations is the *only* way to establish bindingness. Her analogy of the "illness without a body" begs the question by assuming normative force requires a psychological substrate.
  *   **Jonas (Justification vs. Motivation):** *Clearly Right.* Jonas draws a crucial distinction that Mira obscures: the difference between having a justification for action and being motivated to perform it. Externalism does not deny that motivation is often needed for action; it denies that motivation is needed for the *existence* of the reason. His point that recognizing normative weight constitutes access is a robust defense of objectivity.

  **Round 3: Renunciation and Role Obligations**
  *   **Mira (Total Renunciation):** *Clearly Mistaken.* Mira argues that if an agent repudiates an institution (like a judge rejecting the law), the normative structure becomes an "empty shell." This conflates the *validity* of the obligation with the *agent's acceptance* of it. Institutional facts generally persist regardless of private attitude; a judge who secretly rejects the law is still obligated to apply it until she resigns.
  *   **Jonas (Social Plausibility and Recognition):** *Clearly Right.* Jonas correctly points out that making obligation contingent on continuous psychological endorsement renders social norms impossibly fragile. His claim that the agent's "so what?" reveals a failure of recognition rather than an absence of reason preserves the stability of normative concepts. He successfully defends the idea that normativity is robust against shifts in affective state.

  ### Overall Adjudication

  **Jonas is more right overall.**

  While Mira articulates the intuitive pull of Internalism (the idea that reasons must connect to what we care about), her argument repeatedly conflates the *existence* of a reason with the *efficacy* of a reason. She assumes that if an agent feels no grip from a reason, the reason cannot exist for them. Jonas successfully defends the autonomy of normativity. He demonstrates that objective facts (promises, roles, history) can generate agent-specific obligations that persist even when the agent is unmoved. Mira's position leads to the implausible conclusion that moral and institutional obligations vanish whenever an agent undergoes a crisis of faith or motivation, whereas Jonas's view preserves the normative structure necessary for social and moral life.

  ### The Missing Consideration

  Both Mira and Jonas miss a crucial distinction regarding **procedural exit conditions and the distinction between validity and accountability.**

  In the case of the judge (and similar role-based obligations), the debate assumes that the obligation persists solely because of historical facts (Jonas) or vanishes due to psychological rejection (Mira). Both overlook that many institutional roles have specific **procedural requirements for exit**. A judge is bound not merely because she once accepted the role (Jonas) nor because she currently desires to fulfill it (Mira), but because she remains *institutionally situated* in that role. The normative force persists because she has not completed the public, procedural acts required to relinquish the position (e.g., formal resignation).

  This consideration refines the indexing problem: the reason is indexed to the agent not by their psychology or merely by past history, but by their **current institutional status**, which is a public fact independent of their private mind. Furthermore, this distinction allows for a nuance regarding accountability: while the *obligation* may persist despite motivational restructuring (supporting Jonas), the *blameworthiness* for failing to meet it might be mitigated if the agent has genuinely lost the capacity to recognize the norm (a concession to Mira's concern about "grip"). Neither interlocutor separates the persistence of the duty from the appropriateness of sanction, which is essential for understanding how role-based obligations function during radical motivational change.
