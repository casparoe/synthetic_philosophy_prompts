answer: |-
  ### Exam Question

  **Question 1**

  The Republic of Marenne, following a sovereign debt crisis, enacted the "Stability Lock" to constrain future fiscal policy. The Lock imposes a cap on the structural deficit. Any law breaching this cap requires a two-thirds parliamentary majority and confirmation by a referendum held no fewer than sixty days later. Breaches and emergency exemptions must be certified by an independent "Fiscal Guard," comprising nine members serving single twelve-year terms, removable only for incapacity. The Lock itself may be amended only by a three-quarters majority plus a referendum.

  Twenty-five years later, three complications have arisen:
  1.  **The Wrong-Siren:** A once-in-a-century epidemic requires emergency borrowing. The Lock's exemption clause covers "armed conflict and natural catastrophe," but the Fiscal Guard is deadlocked on whether an epidemic qualifies.
  2.  **The Ratchet Asymmetry:** Parliament has frequently attached new protected spending mandates to the Lock but has never relaxed the deficit cap. The constraint now bites significantly harder than at enactment.
  3.  **The Borrowed-Mast:** A province acceded to the union ten years after the Lock was enacted. It now argues it never bound itself to these fiscal arrangements.

  In this context, consider the following definitions:
  *   **Wrong-Siren Problem:** The device restricts action in circumstances it was not designed to address, rather than merely resisting the specific temptation it was built for.
  *   **Ratchet Asymmetry:** Obligations accumulate over time without a corresponding increase in flexibility or resources, tightening the constraint beyond the original intent.
  *   **Borrowed-Mast Problem:** Successors or new members are bound by a precommitment to which they never personally consented.
  *   **The Crew Problem:** The enforcers of the precommitment (here, the Fiscal Guard) are artificial agents with institutional interests who may fail to act uniformly.

  **Prompt:**
  For a precommitment to bind a later agent without violating their autonomy, what specific condition regarding the relationship between the earlier and later self must be met? Using the Marenne hypothetical, analyze whether this condition survives the Wrong-Siren, Ratchet, Borrowed-Mast, and Crew problems. Finally, assess whether standard design fixes (such as sunset clauses, broader emergency certification, or symmetric amendment thresholds) resolve these tensions or merely reopen the door to the self-serving redescription the device was meant to defeat.

  ***

  ### Model Answer

  Precommitment enhances autonomy rather than restricting it only if the later self can identify with the earlier self's values *and* retains a viable, albeit costly, mechanism to unbind themselves should those values genuinely change. Autonomy is not merely the freedom to act in the moment, but the capacity to govern oneself over time. Therefore, a valid precommitment must function as a bridge between temporal selves, not a cage. If the cost of release is too low, the device fails to resist weakness of will; if the cost is too high, the device becomes a tyranny of the past over the present. The Marenne Stability Lock must be evaluated against this threshold of revisability.

  The Wrong-Siren problem threatens this balance by introducing rigidity where flexibility is required for survival. In Marenne, the Fiscal Guard's deadlock on the epidemic exemption illustrates that the "earlier self" could not foresee all contingencies. If the Lock prevents necessary borrowing during a crisis, it ceases to be an instrument of the polity's long-term will and becomes an obstacle to its continued existence. For autonomy to remain intact, the definition of "emergency" must be interpretable by the later self. However, granting the later self (or the Guard) too much interpretive leeway invites the self-serving redescription the Lock was designed to prevent. The government may claim an epidemic is a "natural catastrophe" simply to avoid fiscal pain, not because it genuinely believes so. Thus, the Wrong-Siren reveals that specificity protects against temptation but risks paralysis.

  The Ratchet Asymmetry and Borrowed-Mast problems challenge the continuity of identity required for autonomy. Autonomy presumes a continuous agent. In Marenne, the accumulation of spending mandates without cap relaxation alters the baseline conditions under which the Lock was accepted. The "later self" is operating in a fiscal reality the "earlier self" did not authorize. Similarly, the new province never consented to the Lock. Binding them without ratification treats them as subjects rather than agents. For the Lock to remain autonomy-enhancing for these actors, there must be a mechanism for re-ratification or adjustment. Without it, the Lock functions as colonial rule by the past or by the core, violating the consent requirement essential to democratic autonomy.

  The Crew problem complicates enforcement. In the Ulysses myth, the crew is immune to the song. In Marenne, the Fiscal Guard has institutional interests and can deadlock. If the enforcers cannot agree, the principal (the state) is paralyzed. This delegation shifts autonomy from the polity to the Guard. If the Guard's incentives diverge from the public interest, the precommitment no longer reflects the will of the people, but the will of the guardians. This severs the link between the binding rule and the agent's autonomy.

  Can design fixes resolve this? Sunset clauses and periodic reauthorisation address the Borrowed-Mast and Ratchet problems by forcing renewed consent. However, they lower the transaction cost of release. If a government knows the Lock expires in five years, it may endure short-term pain to wait out the clock, or conversely, spend recklessly knowing a reset is coming. Broadening emergency certification solves the Wrong-Siren problem but invites abuse. Symmetric amendment thresholds (making it as hard to tighten as to loosen the Lock) address the Ratchet but reduce the Lock's credibility as a constraint.

  Ultimately, every design fix that makes the Lock more adaptable makes it easier to evade through self-serving redescription. The tension is structural. A precommitment survives only if the transaction cost of release is calibrated precisely to the strength of the temptation it resists. Marenne's Lock likely fails because it is too rigid on release (referendum plus supermajority) while too fragile on enforcement (deadlock-prone Guard). It restricts autonomy because it offers no safe path for the later self to reclaim control when the world changes, turning a tool of self-governance into an instrument of self-harm. The only way to preserve autonomy is to accept that no precommitment can be perfectly binding; it must always remain breakable, provided the breakage is public, costly, and rare.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. The Autonomy Condition (5 Marks)**
  *   **Requirement:** Candidate must articulate that precommitment is autonomy-enhancing only if the later self retains the capacity to unbind themselves at a transaction cost higher than the impulse being resisted, but lower than the cost of genuine necessity.
  *   **Common Error:** Defining autonomy simply as "freedom to choose" without addressing the temporal dimension or the cost of release.

  **2. Analysis of Wrong-Siren (5 Marks)**
  *   **Requirement:** Candidate must explain that unforeseen contingencies (epidemic) turn rigidity into paralysis, and that interpretive flexibility invites the very abuse the Lock prevents.
  *   **Common Error:** Arguing simply that the Guard should have allowed the exemption, ignoring the incentive problem.

  **3. Analysis of Ratchet & Borrowed-Mast (5 Marks)**
  *   **Requirement:** Candidate must identify that changing circumstances and lack of initial consent break the "continuous agent" assumption required for autonomy.
  *   **Common Error:** Treating these as separate legal issues rather than linked problems of inter-temporal consent.

  **4. Analysis of the Crew (5 Marks)**
  *   **Requirement:** Candidate must note that delegated enforcement shifts autonomy to the enforcers, and deadlock paralyzes the principal, severing the link between rule and will.
  *   **Common Error:** Focusing on the Guard's independence as a virtue without analyzing the agency cost.

  **5. The Paradox of Fixes (5 Marks) [SUBJECTIVE FLAG]**
  *   **Requirement:** Candidate must conclude that design fixes (sunset clauses, etc.) solve rigidity but lower the cost of evasion, meaning the tension between revisability and credibility cannot be fully engineered away.
  *   **Common Error:** Proposing a specific "perfect" design fix (e.g., "just add a sunset clause") without acknowledging it reintroduces weakness of will.
  *   **Note to Examiner:** This point rewards philosophical synthesis. Reasonable candidates may argue fixes *can* work if calibrated perfectly. Award full marks for a coherent argument either way, provided the trade-off is acknowledged.

  ***

  ### Differentiator: A vs. B Answer

  **B Answer:**
  Identifies the four problems correctly and applies the Marenne facts to each. Concludes that the Lock is flawed because it is too rigid. Suggests standard fixes (like sunset clauses) would improve the system. The analysis is compartmentalized (Problem 1, then Problem 2, etc.).

  **A Answer:**
  Identifies the underlying structural tension: precommitment requires a specific *cost of release* to function as autonomy rather than restriction. Synthesizes the four problems as evidence that Marenne's cost of release is miscalibrated (too high for genuine change, too low for credible commitment due to Guard deadlock). Critiques the design fixes not just as ineffective, but as evidence that the tension between rigidity and revisability is insoluble via institutional engineering alone. The argument flows as a single thesis about the nature of temporal self-governance.
