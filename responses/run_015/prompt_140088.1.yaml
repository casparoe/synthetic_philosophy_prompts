answer: |-
  Hi team, regarding the integrity objection seminar, I have drafted the decision tree handout we discussed to help students distinguish between the integrity objection and the demandingness complaint. The goal is to force them to commit to specific claims rather than hiding behind labels, so the text below is written as continuous prose without formatting markers, designed to be read in the order a student would navigate the choices, though I have structured the analysis to reflect the underlying logical space first so you can see how the positions map onto the combinations.

  To begin the walk-through, the student encounters the first branch question which centers on the spouse and stranger case where one life can be saved. The question asks whether the thought she is my wife serves as a moral justification for saving the spouse over the stranger who would save more lives, specifically focusing on the timing of the justification. The first option is that the thought justifies the action both prospectively and retrospectively, meaning it is morally right to think it and act on it. The second option is that the thought explains the action psychologically but fails as a moral justification, meaning the action might be permissible but the thought is morally suspect. The third option is that the thought is morally forbidden both prospectively and retrospectively, meaning the action itself is wrong because it violates impartiality. This question forces the student to decide if the relationship provides moral cover or if it is merely a psychological fact, and it specifically targets the retrospective coda where the same sentence sounds fine an hour later, requiring them to explain why the timing changes the moral status if they choose the second option.

  Moving to the second branch, the student must address the metaphysics of the reason by considering whether the relationship is the reason itself or a background condition like a live wire enabling a different reason. The first option is that the relationship constitutes the reason, meaning the fact of marriage is what weighs in the balance. The second option is that the relationship is merely a condition that enables other reasons like need or dependency to apply more strongly. The third option is that the relationship suspends moral reasoning entirely in this domain, creating a zone where moral categories do not apply. This distinction is crucial because it separates views that integrate partiality into morality from views that see partiality as outside morality, and it prevents students from claiming the relationship matters without specifying how it matters.

  The third branch shifts to the third-personal perspective where the student is not the spouse but the allocator of the single rescue slot. The question asks whether the fact that she is his wife is a valid reason for the allocator to save her over the stranger. The first option is that the allocator must ignore the relationship and save the stranger who saves more lives. The second option is that the allocator must respect the relationship and save the spouse. The third option is that the allocator is permitted but not required to respect the relationship. This node is designed to split views that looked identical in the first-personal case, as some theories allow agent-relative reasons for the agent but not for others, while others universalize the permission.

  Now we map the logical space created by these three questions to identify the leaves, starting with the combinations that yield coherent positions. If a student answers that the thought is forbidden and the allocator must ignore the relationship, they land on Hard Impartial Consequentialism, where the most awkward commitment is that saving your spouse is morally wrong even if no one ever knows. If they answer that the thought is permissible retrospectively but not prospectively and the relationship is a condition, they land on the Phenomenology Only reading, where the most awkward commitment is that moral blame depends on what you thought during the split second rather than what you did. If they answer that the thought is permitted and the allocator is permitted but not required to respect it, they land on the Agent-Centered Prerogative view associated with Scheffler, where the most awkward commitment is that you are allowed to let the stranger die even if the cost to you is negligible. If they answer that the relationship is a weighed item and the allocator must respect it if the weight is high enough, they land on Integrity as a Value, where the most awkward commitment is that integrity is just another preference to be traded off against lives. If they answer that the thought is forbidden because morality asks too much, they land on the Demandingness Complaint, where the most awkward commitment is that moral obligations disappear whenever they become too inconvenient.

  There are also leaves representing empty or unstable logical space that students might occupy unintentionally. If a student claims the relationship is the reason but the allocator must ignore it, they land on an Unnamed Incoherent position, where the most awkward commitment is that a moral reason exists for one person but is invisible to everyone else. If they claim the relationship is merely a condition but the allocator must respect it, they land on an Unnamed Unattractive position, where the most awkward commitment is that a background fact generates a duty for third parties without generating a reason for them. If they claim the thought is permitted prospectively but the allocator must ignore it, they land on another Unnamed Incoherent position, where the most awkward commitment is that an action is right for the agent but wrong for anyone else to facilitate. Finally, if they claim the thought is forbidden but the allocator is permitted to respect it, they land on an Unnamed Unexplored position, where the most awkward commitment is that you are forbidden to save your spouse but others are allowed to save her for you.

  Regarding the control cases, the person who acts with no articulable thought lands on the Phenomenology Only leaf if the lack of thought is ideal, or on the Hard Impartialism leaf if the lack of thought is a failure of self-knowledge, and the tree separates these based on whether the first question allows non-thought as justification. The doctor doing triage for her own patient sails straight through the first question but hits the second question hard, landing on the Condition leaf if she cites institutional role rather than intimacy, which separates the Prerogative view from the Integrity as Value view. The case where the relationship rests on a mistake lands on the Condition leaf if the reason vanishes with the mistake, but on the Constitutive Reason leaf if the thought remains valid despite the error, which tests whether the view tracks reality or psychology.

  We need to flag that the Integrity as Value leaf and the Demandingness Complaint leaf often collapse in student responses because both appeal to the cost of morality, but they are distinguishable here because the former treats integrity as a positive weight while the latter treats morality as having a limit. The tree cannot pull apart the Phenomenology Only leaf from the Hard Impartialism leaf if the student claims the action is wrong regardless of thought, so those two merge in that specific combination. If you have to cut the handout down to two questions, you should drop the third question about the third-personal allocator because while it is the best splitter for theoretical positions, the first two questions about justification and reason metaphysics do the heavy lifting for distinguishing integrity from demandingness in the first-personal case that students care about most.
