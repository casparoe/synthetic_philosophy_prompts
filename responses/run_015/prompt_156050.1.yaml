      *   *Correction on Frame Dependence:* Lena claims the distinction between inside/outside is frame-dependent. In GR, regions are usually defined by invariants (scalar curvature, etc.), not frames. However, the *foliation* used to define "global time" outside is frame-dependent. Lena might be conflating "reference frame" with "foliation." I need to point this out.

