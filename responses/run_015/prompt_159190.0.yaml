  **Aequitas Logic Unveils VeilOS™: Ethical Governance at Enterprise Scale**

  **SAN MATEO, 2028** — Aequitas Logic today announced the general availability of VeilOS™, the first enterprise platform enabling leadership teams to set compensation and promotion policy from behind a computational veil of ignorance. By randomizing user identities within the system before policy selection, VeilOS ensures that no executive knows which position they will occupy under the new rules, aligning corporate strategy with proven frameworks of distributive justice.

  "The Original Position isn't just philosophy; it's risk management," said CEO John R. Wals. "VeilOS removes bias by removing knowledge. Our beta clients report higher morale and defensible pay ratios." The platform ships with a proprietary decision rule designed to maximize the minimum outcome for any stakeholder, ensuring that inequality is only permitted where it functions to improve the baseline.

  Apex Logistics, a early-access partner, deployed VeilOS across its North American division last quarter. "We needed rigor," said Apex CFO Sarah Jenkins. "VeilOS gave us a auditable trail showing that our executive compensation packages directly benefit our lowest earners. It turns ethics into a toggle."

  **Frequently Asked Questions**

  **Q: Can we adjust the risk profile?**
  A: The "Appetite" setting is shipped locked at zero tolerance for upside risk. This technical default prevents users from selecting policies that might yield higher average returns but violate the stability of the floor.

  **Q: What metrics does the system use?**
  A: Users select a comparison currency. Presets include income and wealth or self-reported happiness. Note: Most external auditors currently reject happiness metrics due to verification latency.

  **Q: Who counts as a stakeholder?**
  A: The base tier covers current full-time employees. Paid modules expand the population scope to include contractors, supply-chain workers, and hires not yet born.

  **Q: How does the system handle turnover?**
  A: VeilOS performs a nightly recomputation of the reference group. Some clients optimize this by adding one extremely low-paid intern—the "Anchor"—ensuring that every subsequent executive raise can be shown to raise the floor as well, by a few cents.

  **Q: What if employees opt out?**
  A: The "Commitment Guarantee" allows anyone who lands in the bottom tenth to walk away with severance. This guarantee is voided if the Appetite setting was ever moved off zero during the fiscal year.

  ***

  **Editor's Note: On the Theory Behind the Joke**

  *By the Satire Editor*

  This piece satirizes the corporate adoption of John Rawls' theory of justice. To prevent confusion: Rawls' "veil of ignorance" and "difference principle" are serious philosophical tools, not HR software.

  **Settled Doctrine:** Rawls argues rational agents behind a veil (ignorant of their own status) would choose a "maximin" rule: maximize the position of the least advantaged. Inequalities are only permitted if they benefit this group. He prioritizes "primary goods" (income, rights) over subjective happiness.

  **Contested Issues:** Scholars debate whether the difference principle applies to every incremental change or the basic structure of society as a whole. The scope (national vs. global) and application to disabilities or expensive tastes are also disputed.

  **Where the Satire Bends:** The "Anchor" trick exploits a loophole Rawls likely intended to close: inequalities must be *necessary* to benefit the least advantaged, not just coincidentally compatible. The software treats the principle as a calculation rather than a moral constraint. Additionally, Rawls focused on constitutional essentials, not quarterly pay adjustments. This parody assumes a reading of the benefit condition that prioritizes technical compliance over structural necessity. Enjoy the joke, but don't cite VeilOS in your civics essay.
