answer: |-
  This is a classic and very sharp worry in contemporary epistemology. You have identified the "spiritual kinship" between the two views: both agree that practical factors (stakes, interests) seem to impact our willingness to attribute knowledge.

  However, the consensus in the literature is that they **do not collapse into one another.** They are distinct theoretical commitments that make different predictions in specific cases.

  Your intuition that the difference lies in "where the variation is located" is exactly right, but the implications of that location are deeper than just semantics. Here is the breakdown of why they are distinct, where they diverge, and why the distinction matters.

  ### 1. The Core Distinction: Whose Context Matters?

  The fundamental difference is **whose** context determines the truth value of the knowledge attribution.

  *   **Epistemic Contextualism:** The truth conditions of "S knows that p" vary with the **attributor's context** (the speaker's context). Specifically, the semantic content of the word "knows" shifts depending on how high the *speaker's* epistemic standards are.
  *   **Pragmatic Encroachment (often a form of Subject-Sensitive Invariantism):** The truth conditions of "S knows that p" are invariant regarding the speaker, but the **subject's practical situation** (stakes, interests) partially constitutes whether the subject knows. The word "knows" means the same thing, but the property it picks out is sensitive to the subject's environment.

  ### 2. The "Collapse" Worry and Why It Fails

  Your worry is based on a specific setup: **Hold the speaker constant, vary the subject's stakes.**
  *   *Low Stakes Subject:* Speaker says "S knows." (True)
  *   *High Stakes Subject:* Speaker says "S knows." (False)

  In this specific setup, you are correct: **Both views predict the same output.** This is why they are often seen as rival solutions to the same set of puzzles (like Bank Cases).

  However, to test if two theories are identical, you must see if they diverge when you **vary the variables independently.** If you hold the *subject's stakes constant* but vary the *speaker's context*, the views predict opposite results.

  #### The Divergence Case
  Imagine Hannah (the subject) is in a **Low Stakes** situation regarding the bank hours. She has standard evidence.
  Now, imagine two different speakers attributing knowledge to her:

  1.  **Speaker A (Casual Context):** A friend chatting casually. Epistemic standards are low.
  2.  **Speaker B (Skeptical Context):** A philosopher in a seminar discussing radical skepticism. Epistemic standards are extremely high.

  **The Predictions:**

  *   **Contextualism:**
      *   Speaker A says "Hannah knows": **True** (Low standards met).
      *   Speaker B says "Hannah knows": **False** (High standards not met).
      *   *Why:* The truth value depends on the *speaker's* standards.

  *   **Pragmatic Encroachment:**
      *   Speaker A says "Hannah knows": **True** (Hannah's stakes are low).
      *   Speaker B says "Hannah knows": **True** (Hannah's stakes are still low).
      *   *Why:* The truth value depends on *Hannah's* stakes. The philosopher's high standards are irrelevant to whether Hannah actually knows.

  This divergence proves they are not the same view. Contextualism makes knowledge ascriptions relative to the *speaker*; Encroachment makes knowledge itself relative to the *subject's practical environment*.

  ### 3. Semantic vs. Metaphysical Commitments

  Beyond the truth-value predictions, the views differ on what kind of thesis they are proposing.

  **Contextualism is a Semantic Thesis.**
  It claims that the word "knows" is indexical (like "I," "here," or "tall"). Just as "tall" means different things in the context of a kindergarten class vs. an NBA team, "knows" picks out different epistemic relations depending on the conversational context.
  *   *Implication:* If a contextualist says "I don't know I have hands" (in a skeptical context) and "I know I have hands" (in a casual context), they are not contradicting themselves. They are saying two different propositions.

  **Encroachment is a Metaphysical/Epistemic Thesis.**
  It claims that the word "knows" has a stable meaning, but the *state of knowledge* is not purely truth-tracking. It is partially constituted by practical rationality.
  *   *Implication:* If an encroacher says "S knows" in low stakes and "S doesn't know" in high stakes, they are contradicting themselves regarding the *fact* of the matter. The subject literally gains or loses a property (knowledge) based on their practical situation.

  ### 4. Disagreement and Retraction

  A major testing ground for these views is how they handle disagreement.

  *   **Scenario:** In a low-stakes context, I say "Hannah knows the bank is open." Later, Hannah's stakes rise (she will be fined if she's wrong). I then say, "I was wrong earlier; she didn't know."
  *   **Contextualist:** This is awkward. If my first utterance was true relative to my context *then*, why am I retracting it? Contextualists have to work hard to explain why we feel the need to retract past knowledge claims when standards rise (the "retraction problem").
  *   **Encroacher:** This is straightforward. Hannah's change in stakes changed the facts on the ground. She *did* know then, but she *doesn't* know now (or, depending on the version, she didn't know then because the stakes were already latent). The retraction is warranted because the truth conditions shifted with the subject's situation, not the speaker's.

  ### 5. Summary of Differences

  | Feature | Epistemic Contextualism | Pragmatic Encroachment |
  | :--- | :--- | :--- |
  | **What varies?** | The semantic content of "knows." | The necessary conditions for the state of knowledge. |
  | **Whose context?** | The **Attributor's** (Speaker's) context. | The **Subject's** practical context. |
  | **Semantics** | Indexical / Context-sensitive. | Invariant (but sensitive to practical factors). |
  | **High-Stakes Speaker** | Makes knowledge harder to attribute. | No effect on attribution (if Subject is low-stakes). |
  | **High-Stakes Subject** | No effect on attribution (if Speaker is low-stakes). | Makes knowledge harder to attain. |

  ### Conclusion

  You are right to notice that they are "cousins." They both reject **Traditional Invariantism** (the view that knowledge depends *only* on truth, belief, and evidence, regardless of stakes or context).

  However, they do not collapse.
  *   **Contextualism** saves the intuition that knowledge is hard to get in skeptical conversations by blaming the **language**.
  *   **Encroachment** saves the intuition that knowledge is hard to get in high-stakes situations by blaming the **epistemic state**.

  If you find yourself thinking, "It doesn't matter what the speaker thinks, it matters what the subject has to lose," you are leaning toward **Encroachment**. If you find yourself thinking, "Whether we can *say* they know depends on how careful we need to be in this conversation," you are leaning toward **Contextualism**.

  The distinction is real, and the divergence cases (varying speaker standards while holding subject stakes constant) are the standard way to pry them apart.
