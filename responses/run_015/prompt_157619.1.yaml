answer: |-
  # Q&A Prep Sheet: Structural-Demographic Talk

  ## 1. Opening Concessions (First 2 Minutes)
  *Do not wait for the first question to say these. Build them into your closing remarks or say them immediately as you open the floor. This disarms the "astrology" and "anachronism" crowds before they load their weapons.*

  *   **On Method:** "I want to be clear: I am not claiming this model captures the *experience* of historical actors. I know the archive contains contingency and agency that this framework flattens. I'm arguing this specific flattening reveals a structural constraint that qualitative methods alone miss."
  *   **On Categories:** "When I say 'the state' regarding 1350, I am using it as a shorthand for 'fiscal-coercive apparatus.' I know that category is anachronistic; I'm using it heuristically to compare functional capacities, not legal forms."
  *   **On Data:** "Part 2 relies on proxies for elite aspirants in pre-modern contexts that are imperfect. I will flag where the data is thin rather than overclaiming precision."

  ## 2. The One Reply That Must Land
  *If you lose the room on this, the talk fails. This addresses the core theoretical contribution (Part 2).*

  **The Core Claim:** The cycle is driven by **Elite Aspirant Pressure** (credentialed aspirants / available offices), timed by **Elite Generational Turnover**, *not* Malthusian population pressure.

  **The Reply (90 seconds):**
  "The standard structural-demographic model says population growth drives immiseration, which drives unrest. My test is simple: if that's true, unrest should track population peaks. But in my data, unrest tracks *elite* generational peaks, even when general population is stable.
  Why does this matter? Because it changes the mechanism. It's not about starving peasants; it's about frustrated elites who cannot find positions commensurate with their training. They mobilize the masses, but they drive the bus. If I can show the period of the cycle scales with the age of entry into office across different polities, I distinguish my model from the standard Malthusian one. That's the discrimination test current literature lacks."

  **Soft Spot:** You need to be sure you actually have that cross-polity scaling data. If you don't, this reply is a bluff.

  ## 3. Contested vs. Consensus Background
  *Know what you are fighting against vs. what is common ground.*

  *   **Consensus (Safe to assume):** Data from this period is fragmentary; "The State" is a problematic category for 1350; qualitative context matters for meaning; correlation is not causation.
  *   **Contested (Fight here):** Whether social cycles exist at all (Historians vs. Modelers); whether elite overproduction is a primary driver vs. epiphenomenal (Cliometrics); whether a University counts as a polity (Everyone vs. You).

  ## 4. The Eight Objections (Ordered by Likelihood & Damage)

  ### 1. The "Flattening" Objection
  *   **Faction:** Mainstream Historians (Early Modern/US).
  *   **Likelihood:** Very High. **Damage:** High (Undermines legitimacy).
  *   **Phrasing:** "You're talking about 'unrest' as a data point. But a peasant revolt in 1350 and a faculty strike in 1970 have completely different meanings, intentions, and moral universes. By coding them both as 'instability events,' aren't you just erasing the very agency and contingency that explains *why* they happened?"
  *   **Reply:** "I'm not erasing the meaning to explain the *timing*. Think of it like seismology. A quake in California and one in Japan have different tectonic contexts, but we can still model stress accumulation along fault lines without knowing the cultural meaning of the tremor. I need the qualitative history to tell me *what* the event means, but I need the model to tell me *when* the system becomes brittle enough for any spark to light it."
  *   **Soft Spot:** Historians hate the seismology analogy. It implies inevitability. Be prepared for them to press on "brittleness" being a metaphor, not a mechanism.

  ### 2. The "Identification" Objection
  *   **Faction:** Cliometricians / Econ Historians.
  *   **Likelihood:** High. **Damage:** High (Technical kill).
  *   **Phrasing:** "You've got a time series with maybe a dozen cycles. You're fitting a curve with multiple tunable parameters (generation length, office supply, fiscal capacity). How do you know you aren't just overfitting noise? What's your identification strategy? Where's the exogenous variation?"
  *   **Reply:** "That's a fair critique of the current state of the field, and part of my talk is arguing that current tests *are* overfit. My identification comes from the cross-polity comparison. If the period length changes based on elite generation length rather than population growth rates, that's a structural constraint, not a curve fit. I'm not claiming causal identification in a regression sense; I'm claiming model discrimination."
  *   **Soft Spot:** They will not accept "model discrimination" as a substitute for identification. If you don't have an instrument or a natural experiment, they will view this as unscientific. **Do not pretend you have an IV if you don't.**

  ### 3. The "Anachronistic State" Objection
  *   **Faction:** Early Modernists / Ottoman Specialist.
  *   **Likelihood:** High. **Damage:** Medium (Ideological annoyance).
  *   **Phrasing:** "You're applying 'fiscal capacity' and 'office supply' to a polity that didn't distinguish between the ruler's household and the treasury. There was no 'office' in the Weberian sense. Isn't this just projecting 19th-century bureaucracy back onto a patronage network?"
  *   **Reply:** "I agree the Weberian state is anachronistic. That's why I define 'office' functionally: access to surplus extraction and coercive authority. Whether it's a benefice, a tax farm, or a tenure track, it functions as a bottleneck for elite reproduction. I'm comparing the *bottleneck*, not the legal form."
  *   **Soft Spot:** Functionalism can be just as reductive as legalism. If the "bottleneck" is too vague, the variable becomes unmeasurable.

  ### 4. The "Falsifiability" Objection
  *   **Faction:** Philosopher of Science.
  *   **Likelihood:** Medium. **Damage:** High (Conceptual kill).
  *   **Phrasing:** "In Part 1, you argue existing models aren't falsifiable because they can postdict anything. But if your model encounters a counter-case, can't you just adjust the 'generation length' or 'aspirant count' to save the hypothesis? What would actually count as your model being wrong?"
  *   **Reply:** "If I find a polity where elite generation length is stable, but the cycle period shifts significantly due to external shocks (war, plague) without a change in aspirant pressure, my model fails. Or, if I find a period of high aspirant pressure that *doesn't* lead to instability because the fiscal base expanded fast enough to create offices. I need a negative correlation, not just a positive one."
  *   **Soft Spot:** You need to be sure you have actually looked for these negative cases. If you haven't, this is theoretical hand-waving.

  ### 5. The "Proxy & Dating" Objection
  *   **Faction:** Archaeologist.
  *   **Likelihood:** Medium. **Damage:** Medium (Data validity).
  *   **Phrasing:** "Your unrest proxies rely on chronicles or event catalogs. We know from settlement survey that there's often a 20-to-40-year lag between stress and visible collapse, and chronicle bias is huge. How does your dating error affect the periodicity detection?"
  *   **Reply:** "It's a major constraint. I'm using Bayesian dating where possible to account for the error margins. If the error margin is wider than the cycle phase I'm trying to detect, the signal drops out. I'm only claiming the model works where the temporal resolution is fine enough to distinguish generational turnover."
  *   **Soft Spot:** If your dating error *is* that wide, you have to concede the model doesn't work for those specific cases. Don't fight the archaeologist on dating.

  ### 6. The "Mechanism of Coercion" Objection
  *   **Faction:** Political Scientist.
  *   **Likelihood:** Medium. **Damage:** Low/Medium (Theoretical refinement).
  *   **Phrasing:** "You say 'aspirant pressure' drives instability. But aspirants don't have guns. They need the fiscal-military apparatus to either suppress them or join them. Is 'the state' doing work here, or are you just describing a factional fight within the elite?"
  *   **Reply:** "It's both. The aspirants provide the ideology and leadership, but the cycle turns on whether the fiscal base can buy off the coercive apparatus. When the fiscal base shrinks per capita, the coercive apparatus fragments. That's when aspirants succeed. So 'state capacity' is the moderator variable on the aspirant pressure."
  *   **Soft Spot:** This requires data on fiscal capacity *and* military loyalty. If you only have data on aspirants, you're assuming the fiscal part.

  ### 7. The "University as Polity" Objection
  *   **Faction:** Everyone (but especially US Historians).
  *   **Likelihood:** High (Because it's provocative). **Damage:** Medium (Credibility risk).
  *   **Phrasing:** "The University case feels like a metaphor, not a test. A university can't tax, it can't imprison, and its 'legitimacy' is totally different from a regime. Doesn't stretching the model this far just prove it's vague enough to fit anything?"
  *   **Reply:** "I chose it precisely because it lacks coercion. If the model holds in a voluntary association where 'coercion' is just firing or tenure denial, it suggests the mechanism is about *organizational structure*, not violence. It tests whether 'elite overproduction' is a general systems problem, not just a political one. If it fails here, the theory is political, not structural."
  *   **Soft Spot:** If the University case *doesn't* fit the data as well as the state cases, this reply backfires. Be ready to admit if the fit is worse.

  ### 8. The "Endogeneity of Elite Status" Objection
  *   **Faction:** Cliometricians / Smart Historians.
  *   **Likelihood:** Low. **Damage:** High (Technical kill).
  *   **Phrasing:** "You define 'elite aspirants' by credentials. But credentials are often created *by* the elite to restrict access. Isn't 'aspirant pressure' just endogenous to the cycle itself? The elite create more PhDs when they feel secure, then cut jobs when they feel threatened."
  *   **Reply:** "That's a crucial feedback loop. I treat credential production as having a lag—it takes 5 to 10 years to make a PhD or train a knight. That lag creates the oscillation. If credentialing were instant, there'd be no cycle. So it's not purely endogenous; it's a delayed response function."
  *   **Soft Spot:** Do you have data on the lag time? If you're assuming the lag rather than measuring it, the cliometricians will call it a "tunable parameter."

  ## 5. The "Hope Nobody Asks" Question
  *This is the hole in the armor. If they smell blood here, you need to pivot hard.*

  *   **The Question:** "You say the key variable is the ratio of aspirants to offices. In 1350, how do you actually count 'aspirants'? We don't have enrollment records. We don't have job applications. Aren't you just using 'unrest' to proxy for 'aspirants,' which makes your argument circular?"
  *   **Why it hurts:** It attacks the measurability of your core independent variable. If $X$ is inferred from $Y$, you can't use $X$ to explain $Y$.
  *   **The Reply:** "That is the weakest link in the chain, and I know it. For the pre-modern cases, I am using proxies like university enrollment matriculation records where they exist, or estimates of clerical ordinations as a proxy for educated elites. Where I can't count them directly, I am inferring the pressure from the *intensity* of ideological production—pamphlets, sermons, factional rhetoric. I concede this is inferential. That's why the University case is critical: there, I have the actual numbers. I'm using the modern case to validate the proxy for the historical ones."
  *   **Backup Plan:** If they push harder, **concede.** "You're right. For the 14th century, it's a reconstruction, not a count. The argument stands or falls on whether that reconstruction holds up against the modern data where we *can* count. If the modern data doesn't align, the historical reconstruction is wrong."

  ## 6. General Strategy Notes
  *   **Don't Fight the "Astrology" Comment:** If someone repeats the "astrology with differential equations" line, don't get mad. Say: "I worry about that too. That's why I'm focusing on *discriminating* between models, not just fitting curves."
  *   **Interrupt Management:** If two people talk over each other, pick the Historian first. They feel the most threatened by the method. Winning them over (or at least neutralizing them) lowers the temperature for the Cliometricians.
  *   **The "WIP" Shield:** You are allowed to say "I don't know yet." Use it for data questions. Do not use it for theoretical questions.
  *   **Body Language:** When the Cliometricians speak, lean in (show respect for rigor). When the Historians speak, nod (show respect for context). When the Philosopher speaks, pause (show respect for logic).
