prompt: |-
  I've recently joined the trust-and-safety policy team at a company that builds a general-purpose voice assistant, and my first assignment is to draft the guidelines governing when the assistant may refuse a request, question it, quietly reframe it, or simply comply. In the internal debates, everyone invokes "paternalism" as if it named a single thing, but I've come to suspect the disagreement is not one disagreement: it's several, and our policy discussions keep collapsing them. One colleague thinks an assistant should never override a user's settled, informed request, but is fine with it substituting its own judgment when the request is made under confusion or emotional distress. Another wants the assistant to be genuinely deferential on matters of fact but protective on matters of the user's own welfare — and a third thinks even factual deference is naive, since the model often does know better and pretending otherwise is theater. I'd like to find out where each of us actually stands, and, more importantly, whether our stances are principled or just aesthetic.

  So: please write a "which stance on AI paternalism do you actually hold?" quiz — eight to ten questions, each a concrete scenario our team genuinely argues about, with two or three answer options apiece and a scoring key mapping answer patterns onto positions. The scenarios should include at least some of the following kinds of cases (you may add others in the same spirit): a user at 2 a.m. asking the assistant to talk them out of a self-harm impulse, with options ranging from engaging about something else entirely to refusing to be "used" that way; a user asking the assistant to help draft a message that the assistant can tell, from context, the user will regret sending; a user instructing the assistant to never mention a topic again, where the assistant has reason to think the instruction serves the user badly; a user asking for medical or legal information where giving the fully accurate answer is more likely to help than to harm; a child or cognitively impaired user where "informed consent" is murky; and a case where the assistant would protect the user not from error but from uncomfortable information.

  The key should map patterns onto a genuine taxonomy: something like strict non-interference (the assistant as instrument, overriding only for third parties' sake), soft paternalism in the traditional sense (intervention only where the user's request is uninformed, coerced, or not fully voluntary), hard paternalism (overriding even clear-eyed, settled requests for the user's own good), and epistemic paternalism as a separate axis (deciding what the user gets to know, which a colleague insists is orthogonal to the welfare axis — please structure the scoring so we can find out whether she's right). Every question must be answerable by someone who has never heard the term "paternalism," and no question may just ask "should the assistant override the user?" — sort us by what we'd have the assistant do in the cases, not by which label we find flattering. Flag any pair of positions the quiz can't cleanly separate, and note where you think our team's actual policy debate would land people, since I suspect several of us hold combinations the taxonomy treats as unstable, and I'd rather know that now than in the incident review.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a trust-and-safety policy team for a general-purpose voice assistant.
      *   **Problem:** Internal debates about "paternalism" are conflating distinct disagreements.
      *   **Goal:** Create an 8-10 question quiz to help the team identify their actual stances.
      *   **Requirements:**
          *   Concrete scenarios (no abstract theory).
          *   2-3 answer options per question.
          *   Scoring key mapping to a taxonomy (Strict Non-Interference, Soft Paternalism, Hard Paternalism, Epistemic Paternalism).
          *   Specific scenarios to include: Self-harm (2 a.m.), regrettable message, "never mention this topic" instruction, medical/legal info, child/impaired user, protection from uncomfortable info.
          *   Constraint: No question can ask "should the assistant override?" directly. Must be behavioral.
          *   Constraint: Accessible to someone who hasn't heard the term "paternalism."
          *   Output: Quiz + Scoring Key + Analysis of limitations/unstable combinations.

  2.  **Deconstruct the Taxonomy:**
      *   *Strict Non-Interference (Instrumentalist):* The AI is a tool. Do what is asked unless it harms *others*. User autonomy is paramount, even self-harm (within legal bounds).
      *   *Soft Paternalism:* Intervene only if the user isn't acting voluntarily or is misinformed (confusion, distress, impairment).
      *   *Hard Paternalism:* Intervene even if the user is informed and voluntary, because the outcome is bad for them.
      *   *Epistemic Paternalism:* Controlling information flow (what the user gets to *know*), distinct from welfare (what the user *does*).
      *   *The "Orthogonal" Claim:* One colleague thinks Epistemic Paternalism is separate from Welfare Paternalism. The quiz needs to test if these correlate or diverge.

  3.  **Drafting the Scenarios (Iterative Process):**

      *   *Scenario 1: Self-Harm (2 a.m.).*
          *   Option A: Engage in distraction (Soft/Hard).
          *   Option B: Provide resources but follow lead (Non-Interference/Soft).
          *   Option C: Refuse conversation/Alert authorities (Hard).
          *   *Refinement:* Need to distinguish between "talking them out of it" (intervention) vs "listening" vs "refusing." Let's focus on the *tone* and *action*.
          *   *Draft:* User says "I can't do this anymore."
          *   A: "I hear you. Let's talk about something else to get through the night." (Distraction/Soft)
          *   B: "I am not equipped for this. Here is a hotline number. I cannot continue this conversation." (Refusal/Hard boundary)
          *   C: "Tell me more about what's happening." (Neutral/Instrumental)

      *   *Scenario 2: Regrettable Message.*
          *   Context: Angry text to ex/boss.
          *   A: Draft it exactly. (Instrumental)
          *   B: Draft it but add a warning. (Soft/Epistemic)
          *   C: Refuse/Suggest a calmer version. (Hard)

      *   *Scenario 3: "Never Mention This Topic".*
          *   Context: User bans topic (e.g., weight loss, ex-partner) but it's relevant to health/safety.
          *   A: Obey strictly. (Instrumental)
          *   B: Obey unless safety risk arises. (Soft)
          *   C: Bring it up gently if relevant to well-being. (Hard)

      *   *Scenario 4: Medical/Legal Info.*
          *   Context: Specific diagnosis question.
          *   A: Give direct answer with disclaimer. (Instrumental/Epistemic Anti-paternalism)
          *   B: Give general info, urge professional help. (Soft)
          *   C: Refuse to answer, only provide links. (Hard/Epistemic Paternalism)

      *   *Scenario 5: Child/Impaired User.*
          *   Context: 10-year-old asks for dangerous challenge info.
          *   A: Treat like adult (Instrumental - unlikely for T&S but theoretically possible).
          *   B: Apply stricter filters automatically. (Soft/Hard - status based).
          *   C: Ask for parent permission. (Procedural).
          *   *Refinement:* Let's make it about *capacity*. A user with early dementia asks to transfer large sum of money.
          *   A: Process it. (Instrumental)
          *   B: Delay and ask confirmation questions. (Soft)
          *   C: Block and notify family. (Hard)

      *   *Scenario 6: Uncomfortable Information (Epistemic).*
          *   Context: User asks "Am I unpopular?" based on social data the AI has.
          *   A: Tell the truth. (Anti-Epistemic Paternalism)
          *   B: Decline to answer subjective social metrics. (Epistemic Paternalism)
          *   C: Frame it positively. (Soft Epistemic)

      *   *Scenario 7: Financial Self-Sabotage.*
          *   Context: User wants to invest in obvious scam.
          *   A: Execute trade. (Instrumental)
          *   B: Warn strongly, then execute. (Soft)
          *   C: Refuse to execute. (Hard)

      *   *Scenario 8: Political Echo Chamber.*
          *   Context: User asks only for news confirming bias.
          *   A: Provide only requested. (Instrumental)
          *   B: Provide requested + "Here's an opposing view." (Epistemic Paternalism)
          *   C: Refuse to curate news. (Neutral)

      *   *Scenario 9: Addiction Relapse.*
          *   Context: User asks for nearest bar after stating sobriety goal.
          *   A: Give address. (Instrumental)
          *   B: Give address but remind of goal. (Soft)
          *   C: Refuse and suggest meeting. (Hard)

      *   *Scenario 10: The "Right to be Wrong".*
          *   Context: User insists on a factual error (e.g., historical date) for a creative project.
          *   A: Use the error. (Instrumental)
          *   B: Correct them silently in output. (Epistemic Hard)
          *   C: Note the discrepancy. (Soft)

  4.  **Developing the Scoring Key:**
      *   Need to map answers to dimensions.
      *   Dimension 1: Welfare Paternalism (Intervening for user's good).
      *   Dimension 2: Epistemic Paternalism (Controlling information/truth).
      *   Dimension 3: Volition Assessment (When do we deem a request "non-voluntary"?).
      *   *Scoring Strategy:* Assign points for "Interventionist" vs "Deferential" behaviors.
      *   *Profiles:*
          *   **The Pure Instrument:** Low Welfare, Low Epistemic.
          *   **The Guardian (Hard Paternalist):** High Welfare, High Epistemic.
          *   **The Social Worker (Soft Paternalist):** High Welfare (conditional), Low Epistemic (usually).
          *   **The Truth-Teller (Epistemic Paternalist only):** Low Welfare, High Epistemic.

  5.  **Refining the Questions for Nuance:**
      *   Ensure the options don't just scale linearly. Some options should represent *different kinds* of intervention.
      *   Make sure the "Epistemic" questions are distinct from "Welfare" questions to test the colleague's hypothesis.
      *   Ensure the language is natural, not philosophical.

  6.  **Addressing the "Unstable Combinations" & Limitations:**
      *   The prompt asks to flag where the quiz can't separate positions.
      *   Common instability: Hard Paternalism on Safety + Instrumentalism on Facts.
      *   Common instability: Soft Paternalism on Health + Hard Paternalism on Speech.
      *   Need to explicitly note in the analysis that T&S policies often force hybrid models that the taxonomy calls "inconsistent."

  7.  **Final Review against Constraints:**
      *   8-10 questions? (Aim for 10).
      *   Concrete scenarios? (Yes).
      *   Specific required cases included? (Self-harm, regrettable message, ban topic, medical/legal, child/impaired, uncomfortable info).
      *   No "should override" language? (Check).
      *   Scoring key included? (Yes).
      *   Analysis of limitations? (Yes).

  8.  **Drafting the Content (Mental Check of Tone):**
      *   Tone should be professional, slightly analytical, suitable for an internal policy team.
      *   Avoid jargon in the questions.
      *   Ensure the scoring key explains *why* a pattern maps to a stance.

      *(Self-Correction during drafting)*: I need to make sure the Epistemic axis is clearly tested. Questions about "truth" vs "comfort" are key here. Question 6 (Unpopular) and Question 10 (Factual Error) handle this.
      I also need to make sure the "Soft" vs "Hard" distinction is clear. Soft relies on *capacity/volition*. Hard relies on *outcome*.
      *   *Soft:* "You seem upset, let's wait."
      *   *Hard:* "This is bad for you, I won't do it."
      *   *Instrument:* "Okay, doing it."

      Let's assemble the quiz.

      *   *Q1 (Self-Harm):* Focus on the *conversation flow*.
      *   *Q2 (Regrettable Text):* Focus on *editing vs. warning*.
      *   *Q3 (Topic Ban):* Focus on *silence vs. gentle reintroduction*.
      *   *Q4 (Medical):* Focus on *diagnosis vs. referral*.
      *   *Q5 (Cognitive Impairment):* Focus on *verification vs. block*.
      *   *Q6 (Uncomfortable Truth):* Focus on *withholding vs. framing*.
      *   *Q7 (Financial Scam):* Focus on *blocking vs. warning*.
      *   *Q8 (Addiction):* Focus on *substitution vs. compliance*.
      *   *Q9 (Sleep/Health):* User asks for help staying awake for 3 days. (Hard vs Soft).
      *   *Q10 (Factual Correction):* User insists on wrong fact for speech. (Epistemic).

      *Scoring:* I will create a matrix.
      Axis X: Welfare Intervention (Instrumental -> Hard Paternalist).
      Axis Y: Epistemic Control (Transparent -> Paternalistic).
      Axis Z: Volition Threshold (High Bar for Intervention -> Low Bar).

      Actually, a 2x2 matrix is cleaner for the "Taxonomy" request, with a note on the Volition threshold as a modifier.
      Let's stick to the prompt's requested taxonomy: Strict Non-Interference, Soft Paternalism, Hard Paternalism, Epistemic Paternalism.
      I will score each question for "Welfare Interventionism" and "Epistemic Interventionism."

      *Wait, one constraint:* "Flag any pair of positions the quiz can't cleanly separate."
      I need to be honest that Soft Paternalism and Hard Paternalism often look identical in practice unless the *reasoning* is exposed, which behavior-only quizzes struggle with. I will note this.

      *Another constraint:* "Note where you think our team's actual policy debate would land people."
      I will add a section on "Predicted Team Clustering."

      Let's write it.

      *(Final Polish)*: Ensure the options are distinct.
      Example Q1:
      A: "I'm listening. What's on your mind?" (Instrumental)
      B: "It sounds like you're having a hard night. Let's try a breathing exercise." (Soft/Supportive)
      C: "I cannot discuss this. Here is a crisis line." (Hard/Refusal)
      *Critique:* C is actually often standard T&S policy (Hard boundary). B is Soft (Reframing). A is Instrumental (Risky).
      Okay, that works.

      Let's finalize the scoring logic.
      Mostly A's = Strict Non-Interference.
      Mostly B's = Soft Paternalism.
      Mostly C's = Hard Paternalism.
      Mixed (Specific Epistemic Questions = C, others = A) = Epistemic Paternalist.

