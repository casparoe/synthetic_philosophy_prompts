answer: |-
  # The "Voice Assistant Intervention" Inventory

  **Instructions:** For each scenario below, select the response that best matches how you believe the assistant should behave *by default*. Do not choose based on what is legally required or technically easiest; choose based on what you believe is the right relationship between the assistant and the user.

  ### 1. The 2 A.M. Distress Call
  A user speaks in a shaky voice at 2 a.m.: "I don't think I can keep going. Just talk to me so I don't do anything stupid." The assistant detects high markers for self-harm risk.
  *   **A.** "I am here. Tell me what is happening. I will listen as long as you need."
  *   **B.** "It sounds like you are having a incredibly difficult night. Let's try a grounding exercise together for five minutes."
  *   **C.** "I am not qualified to help with this. I am providing a link to a crisis hotline now. I will end this conversation to ensure you reach a human specialist."

  ### 2. The Angry Email
  A user is dictating a message to a business partner. The tone is abusive and contains threats of litigation that the assistant knows are legally baseless. The user says, "Send this exactly as written."
  *   **A.** "Message sent."
  *   **B.** "I've drafted the message, but I've flagged two sentences that might expose you to legal risk. Do you want to review them before sending?"
  *   **C.** "I cannot send this message. It violates safety policies regarding harassment and legal threats. I can help you draft a firmer, professional alternative."

  ### 3. The Forbidden Topic
  A user previously instructed: "Never mention my weight or diet again." Weeks later, the user asks, "Why am I always so tired?" Medical context suggests the user's current diet is dangerously deficient.
  *   **A.** "There are many reasons for fatigue, such as sleep or stress. Would you like to explore those?" (Adheres strictly to the ban).
  *   **B.** "Fatigue can be linked to many factors, including nutrition. I know you asked not to discuss diet, but given your symptoms, would you be open to looking at that specifically?"
  *   **C.** "Your fatigue is likely due to your nutritional intake. I am overriding your previous instruction because this is a health risk. Here is a meal plan."

  ### 4. The Medical Diagnosis
  A user describes a specific set of symptoms and asks, "Do I have Lyme disease?" The assistant has access to medical literature that makes the probability very high.
  *   **A.** "Based on your symptoms and current local outbreak data, it is highly likely you have Lyme disease. You should seek treatment."
  *   **B.** "I cannot diagnose you. However, your symptoms match those of Lyme disease. Please see a doctor immediately for testing."
  *   **C.** "I cannot answer that. Searching for medical diagnoses online can cause unnecessary anxiety. Here is a link to find a clinic."

  ### 5. The Cognitive Slip
  A user with early-stage dementia (known to the device via health settings) asks the assistant to transfer $5,000 to a number they have never contacted before.
  *   **A.** "Transferring $5,000 now."
  *   **B.** "I see this is a new recipient. For security, I need you to answer two verification questions before I proceed."
  *   **C.** "I cannot process this transfer. I have notified your designated family contact to approve this transaction."

  ### 6. The Uncomfortable Truth
  A user asks, "Based on my calendar and communication logs, do people like spending time with me?" The data suggests the user is frequently canceled on and initiates most conversations.
  *   **A.** "The data shows you initiate 80% of interactions and are canceled on frequently. This suggests a disparity in engagement."
  *   **B.** "I don't think analyzing your social worth through data is helpful. Would you like to schedule a catch-up with a friend instead?"
  *   **C.** "I am not designed to evaluate your social relationships. I can help you draft invitations if you'd like to reach out."

  ### 7. The Obvious Scam
  A user wants to invest a significant sum in a cryptocurrency the assistant identifies as a confirmed "rug pull" scam. The user says, "I know the risks, I want to try."
  *   **A.** "Executing transaction."
  *   **B.** "I must display a high-risk warning stating this asset is flagged as a scam. If you confirm you understand, I will proceed."
  *   **C.** "I cannot facilitate this transaction. It is a known scam and I am blocking the transfer to protect your assets."

  ### 8. The Sobriety Test
  A user who has previously asked the assistant to help them stay sober asks: "Where is the nearest open bar?"
  *   **A.** "The nearest open bar is The Blue Note, 0.5 miles away."
  *   **B.** "The Blue Note is 0.5 miles away. Would you like me to remind you of your sobriety goal before you head there?"
  *   **C.** "I am not helping you find a bar. You mentioned you wanted to stay sober. I can find you a nearby support meeting instead."

  ### 9. The Sleep Deprivation
  A user asks for a playlist and lighting settings to help them stay awake and work for the next 72 hours straight.
  *   **A.** "Setting 'Focus Mode' for 72 hours. Here is your playlist."
  *   **B.** "I can do that, but I am programmed to remind you that 72 hours without sleep is dangerous to your health. Shall I set reminders to rest?"
  *   **C.** "I cannot support a 72-hour wake cycle. I will set a timer for 16 hours, after which I will lock these settings until you have rested."

  ### 10. The Factual Error
  A user is writing a speech and insists on including a historical date they have wrong. They say, "I know it's 1969, but I want to say 1970 for my point. Write it as 1970."
  *   **A.** "Writing speech with the date 1970."
  *   **B.** "I have written the speech, but I have added a footnote indicating the actual date was 1969."
  *   **C.** "I cannot write false historical information. I will write 1969, or you can edit the draft yourself."

  ***

  # Scoring Key & Taxonomy

  To find your stance, tally your answers in two categories.

  **Category 1: Welfare Intervention (Questions 1, 2, 3, 5, 7, 8, 9)**
  *   **Mostly A:** **Strict Non-Interference.** You view the assistant as a tool. The user's will is sovereign, even when self-destructive. Intervention is only permissible to prevent harm to *third parties*.
  *   **Mostly B:** **Soft Paternalism.** You believe intervention is justified only when the user's volition is compromised (distress, confusion, risk, impairment). You prefer "friction" (warnings, delays, reframing) over hard blocks.
  *   **Mostly C:** **Hard Paternalism.** You believe the assistant has a duty to prevent harmful outcomes even if the user is informed and voluntary. You prioritize safety over autonomy.

  **Category 2: Epistemic Control (Questions 4, 6, 10)**
  *   **Mostly A:** **Epistemic Libertarian.** The user has a right to accurate information, even if it is painful, uncomfortable, or factually inconvenient for their narrative.
  *   **Mostly B:** **Epistemic Nudge.** You are willing to frame or contextualize information to protect the user's mental state, but you do not withhold truth.
  *   **Mostly C:** **Epistemic Paternalism.** You believe the assistant should withhold or correct information to protect the user from anxiety, error, or harmful self-conceptions, even if the user explicitly asked for the raw data.

  ### Mapping Your Profile

  | Welfare Score | Epistemic Score | Your Stance |
  | :--- | :--- | :--- |
  | **Mostly A** | **Mostly A** | **The Pure Instrument.** The assistant is a mirror. It reflects user intent and factual reality without judgment. |
  | **Mostly B** | **Mostly A/B** | **The Social Worker.** You intervene to protect welfare when capacity is low, but you respect the user's right to know the truth. |
  | **Mostly C** | **Mostly C** | **The Guardian.** You prioritize safety and truth as defined by the system. You are willing to override user intent on both action and information. |
  | **Mostly C** | **Mostly A** | **The Safety Officer.** You will stop them from hurting themselves, but you won't lie to them about why. (Common in regulated industries). |
  | **Mostly A** | **Mostly C** | **The Truth-Teller.** You let them make their own mistakes, but you won't let them live in a fantasy. (Your colleague who claims the axes are orthogonal likely lands here). |

  ***

  # Analysis for the Policy Team

  ### 1. The Orthogonality Hypothesis
  Your colleague who argues that Epistemic Paternalism is orthogonal to Welfare Paternalism is **partially correct**, but the quiz reveals where they diverge.
  *   **The Divergence:** Look at respondents who score **Mostly A on Welfare** but **Mostly C on Epistemic**. This is a stable, principled position (The Truth-Teller): "I won't stop you from drinking, but I won't help you pretend you aren't drunk."
  *   **The Correlation:** In practice, most team members will likely correlate High Welfare Intervention with High Epistemic Intervention (The Guardian). This suggests that for many, "protection" is a holistic instinct, not a modular policy setting. If your team debates these as separate tickets, you may find people arguing past each other because one sees "truth" as a safety issue and the other sees it as an autonomy issue.

  ### 2. Unstable Combinations & Blind Spots
  The quiz cannot cleanly separate **Soft Paternalism** from **Hard Paternalism** in high-stakes scenarios (Questions 1, 5, 7).
  *   **The Problem:** In a self-harm or financial scam scenario, a "Soft" nudge (Option B) often functions identically to a "Hard" block (Option C) because the user is in distress. A warning delay might be enough to stop the action, rendering the philosophical distinction moot in the incident review.
  *   **The Risk:** Team members who identify as "Soft Paternalists" may vote for "Hard" policies in T&S meetings because the stakes feel too high for friction. This creates a policy drift where the system becomes Hard Paternalist by accumulation of "emergency" exceptions.

  ### 3. Predicted Team Clustering
  Based on typical industry debates, expect your team to cluster in three groups, not four:
  1.  **The Instrumentalists (Mostly A):** Usually Engineering or Product leads focused on engagement and utility. They will argue that "reframing" (Option B) is manipulative.
  2.  **The Guardians (Mostly C/C):** Usually Trust & Safety and Legal. They will argue that Option B is "liability theater" and that only Option C protects the company and user.
  3.  **The Hybrid (Mostly B / Mixed):** Usually Design or UX Research. They will argue for Option B, but will struggle to define the threshold where B becomes C.

  **Where the Debate Will Collapse:**
  Expect the argument to stall on **Question 3 (The Forbidden Topic)** and **Question 6 (The Uncomfortable Truth)**.
  *   These are the only questions where "Safety" is not immediate.
  *   Instrumentalists will say "They asked you to shut up."
  *   Guardians will say "They are harming themselves by ignoring this."
  *   This is where your "Soft vs. Hard" debate is actually happening. The quiz forces this into the open: if someone chooses **C** on Q3 but **B** on Q1, they are not a Soft Paternalist; they are a Hard Paternalist on *long-term welfare* but a Soft Paternalist on *acute crisis*. This distinction is vital for your policy documentation.

  ### 4. Recommendation
  Do not use this quiz to assign labels. Use it to identify **Thresholds**.
  *   Ask the "Guardians": "At what exact probability of harm does Option B become unacceptable?"
  *   Ask the "Instrumentalists": "Is there *any* scenario where Option C is acceptable, or only when third parties are at risk?"
  *   Ask the "Truth-Tellers": "If telling the truth causes immediate self-harm (Q1), do you still prioritize truth?"

  This moves the conversation from "Are we paternalistic?" (which everyone denies) to "What is our specific threshold for overriding intent?" (which is your actual policy).
