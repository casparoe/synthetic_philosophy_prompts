  Subject: Quick look at these interview questions?

  Hey Sam,

  Hope you're good. I'm finalizing the script for the disjunctivism episode and I'm worried she's going to deflect. I definately want to avoid the usual fluff and make sure she can't just hide behind "that's a misapplication of concepts." Can you tell me if these hit hard enough?

  1. Let's start with the classic argument from illusion: if a hallucination and a veridical perception are subjectively indistinguishable, why doesn't that force us to admit a shared mental factor?
  2. I know you'll say it's just a failure of discrimination at the judgment level, but doesn't that just push the problem back rather than solving the phenomenological overlap?
  3. When you extend this into bodily awareness, false hunger signals are often functionally adaptive. Doesn't that drive a wedge between mental kind and functional role?
  4. If function isn't the marker, what independent criterion are you using for mental kind? We need something other than 'accuracy' to define the state.
  5. What actually explains the systematic confusion people report if there's genuinely nothing shared in the experience itself?
  6. If you claim it's purely conceptual, why do people under drugs or in psychosis report indistinguishability despite knowing the conditions?
  7. Clinicians often find that reducing the intensity of a hallucination helps regardless of conceptual training. Doesn't that suggest there's some shared experiential core you have to deny?

  I know she'll try to say clinical efficacy doesn't map onto mental ontology, but I want to press that hard. Let me know if you think I'll recieve too much pushback or if I need to soften the tone.

  Best,
  J
