  I'm prepping interview questions for a podcast episode with a philosopher who's been pushing disjunctivism way past vision into proprioception and interoception — she says false bodily feelings, like thinking your arm is bent when it's straight or feeling hungry when you're sated, don't share any mental kind with the accurate ones. She also claims this has clinical upshots, that treating interoceptive hallucinations should target the patient's conceptual framing rather than trying to alter the experience itself. I want about six or seven questions that don't let her just restate the view or hide behind "that's just a misapplication of concepts." I need one pressing the classic argument from illusion: if hallucination and veridical perception can be subjectively indistinguishable, why doesn't that force a shared mental factor? Include the follow-up for her likely reply that it's just a failure of discrimination at the judgment level. Then one on extending this into bodily awareness — specifically whether the fact that false hunger signals are often functionally adaptive doesn't drive a wedge between mental kind and functional role, and the follow-up asking what independent criterion she uses for mental kind if not function. Another on what actually explains the systematic confusion people report if there's genuinely nothing shared in the experience itself — with a follow-up keyed to her saying it's purely a conceptual mistake, asking why then do people under drugs or in psychosis still report indistinguishability despite knowing the conditions. I also want one comparing her stance to Austin versus McDowell, since she cites both, asking where she lands and whether she rejects even McDowell's "seemings" level; follow-up should press whether rejecting that leaves her with no explanation for why we even have the concept of illusion. Finally, one on the mental-health angle: clinicians often find that reducing the intensity of a hallucination helps regardless of conceptual training, so doesn't that suggest there's some shared experiential core she has to deny? And include the follow-up for her likely deflection that clinical efficacy doesn't map onto mental ontology. Write it casually, like I'm emailing a friend for help, with a typo or two — maybe "definately" or "recieve". No generic opener like "what drew you to philosophy".
