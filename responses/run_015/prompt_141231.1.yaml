answer: |-
  *   **Searle (Primitivism):** Shared intentionality is a biological primitive of the individual mind ("we-intend"). It is psychological and internal, not reducible to "I-intend," but it does not inherently require external normative structures.
  *   **Gilbert (Normativism):** Shared intention constitutes a "plural subject" formed via joint commitment. It is irreducibly social, exists outside individual heads, and essentially entails mutual obligations and entitlements to rebuke.
  *   **Bratman (Constructivism):** Shared intention is a web of interlocking individual intentions ("I intend that we J"), characterized by meshing subplans, mutual responsiveness, and common knowledge. It is ontologically parsimonious and functionally defined.

  ### Diagnosis

  Your hypothesis is correct in its diagnosis of the symptom but underestimates the depth of the disease. It is not merely that there are three questions (ontology, psychology, normativity) sharing a label; it is that each theorist is optimizing for a different *theoretical utility* while claiming to describe the same natural kind. The stalemate persists because "shared intention" is being asked to do three incompatible jobs: explain the phenomenology of cooperation (Searle), ground the normativity of group membership (Gilbert), and model the mechanics of coordinated action (Bratman).

  The impasse is a **category error regarding theoretical scope**, exacerbated by the refusal to exclude edge cases. Let's apply your cases to demonstrate how the theories talk past one another.

  **1. The Silent Crew**
  This case isolates *coordination* from *communication*.
  *   **Gilbert:** Must rule this out immediately. Without communication, there is no joint commitment, hence no plural subject, and thus no shared intention. For Gilbert, this is merely parallel individual action.
  *   **Bratman:** Also struggles. His account requires common knowledge and interlocking subplans. If I do not know you exist, I cannot intend that *we* act, nor can I be responsive to your intentions. He too must classify this as parallel action.
  *   **Searle:** Has the most wiggle room. He could argue a "we-intention" is possible in isolation, but the strategic uncertainty (the reward for pulling late) suggests the participants are reasoning via individual utility maximization, not collective commitment.
  *   **The Clash:** The debate stalls here because Gilbert and Bratman exclude the case to save their definitions, while critics use such cases to argue their definitions are too narrow. If we accept the Silent Crew as "collective action" without "shared intention," we concede that shared intention is not necessary for collective outcomes. The theorists resist this because they want their concept to be the *engine* of the action, not just one possible cause.

  **2. The Relay**
  This case isolates *continuity* from *overlapping psychology*.
  *   **Bratman:** Faces a fatal problem. His account relies on interlocking intentions of *contemporaneous* agents. With zero membership overlap, there is no interlocking web. To save the case, Bratman must stretch "intention" to include institutional frameworks, which dilutes his individualist ontology.
  *   **Searle:** Struggles similarly. If "we-intending" is a biological feature of individual minds, a chain of non-overlapping minds cannot sustain a single intention. It becomes a series of distinct we-intentions, not one continuous one.
  *   **Gilbert:** Thrives here. The "plural subject" is designed to persist beyond the lives of its members. The handover note acts as a mechanism of the joint commitment's continuity.
  *   **The Clash:** Here, the dispute is ontological. Bratman and Searle view the group as *derivative* of the members' psychologies. Gilbert views the members as *constituents* of a distinct entity. The Relay shows that institutional persistence looks more like Gilbert's plural subject than Bratman's web. However, Bratmanians argue that calling this "shared intention" conflates *social ontology* with *psychology*.

  **The Core Impasse:**
  The debate is stuck because it is a **boundary dispute over a cluster concept**.
  *   If you care about *obligation*, Gilbert is right, but her theory cannot explain spontaneous, non-normative cooperation (like strangers lifting a fallen tree).
  *   If you care about *cognitive architecture*, Searle is plausible, but his biological naturalism cannot account for the diachronic stability of institutions (The Relay).
  *   If you care about *action theory*, Bratman is precise, but his parsimony forces him to exclude robust social phenomena that feel intuitively "collective" (like The Relay or highly ritualized joint action).

  They are not disagreeing about the data; they are disagreeing about which data *matters*. Gilbert ignores the Silent Crew because it lacks normativity. Bratman ignores the Relay because it lacks interlocking psychology. Searle ignores the institutional structure because he focuses on the individual biological capacity.

  ### What Would Count as Progress

  Stalemate is the rational expectation so long as the field seeks a **Unified Field Theory** of shared intention. Progress requires abandoning the search for a single analysis that satisfies all three theoretical utilities simultaneously.

  **1. Taxonomic Fragmentation**
  Progress would look like a consensus that "shared intention" is not a natural kind. We should explicitly distinguish:
  *   **Psychological We-Intentionality:** (Searle's domain) What is happening in the mind during cooperation?
  *   **Normative Joint Commitment:** (Gilbert's domain) What grounds the right to rebuke and the obligation to persist?
  *   **Functional Coordination:** (Bratman's domain) What cognitive states allow for meshing subplans?

  A paper that begins by stipulating, "I am addressing the normative grounds of group persistence, not the psychological state of the actors," would do more for the field than another counterexample to Bratman's common knowledge condition.

  **2. Ruling on the Cases**
  We need a consensus on **exclusion**.
  *   **Silent Crew:** We should agree this is *not* shared intention. It is *strategic parallel action*. Acknowledging this protects Bratman and Gilbert from having to explain how obligation or interlocking plans arise from isolation. It clarifies that shared intention is a specific *subset* of collective action, not synonymous with it.
  *   **The Relay:** We should agree this is *institutional agency*, distinct from *psychological shared intention*. This protects Searle and Bratman from having to posit magical cognitive continuity. It concedes Gilbert's point that plural subjects can persist, but limits the scope of that claim to institutional ontology, not individual psychology.

  **3. Empirical Constraints on Normativity**
  The hidden empirical question is: *Do participants feel obligated in the absence of communication?*
  Experimental philosophy and social psychology could move the needle here. If subjects in Silent Crew variants report no sense of obligation to the others, Gilbert's claim that obligation is *essential* to the concept gains traction (by showing its absence removes the phenomenon). If subjects in Relay variants feel no psychological connection to past/future members but acknowledge institutional duty, it separates the psychological from the normative.

  **Conclusion**
  The stalemate is not a failure of argument but a symptom of conceptual overreach. We are trying to force one concept to explain the feeling of togetherness, the right to rebuke, and the mechanics of coordination. Progress requires admitting that these come apart. The Silent Crew shows coordination without commitment; The Relay shows commitment without overlapping psychology. Accepting these fractures allows us to keep the theories as specialized tools rather than competing universal laws.
