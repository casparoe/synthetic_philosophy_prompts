      *   **Task:** Translate a central debate in philosophy of psychiatry (Realism vs. Constructivism/Looping/etc.) into the user's specific vocabulary (causation/measurement). Then, identify the "residue" (what *doesn't* translate).
      *   **Case Study:** "Compensatory Exhaustion Syndrome" (CES). Key features: New category, prevalence triples (mostly mild cases), latent structure unstable, patients adopt manual's idiom (worsening trajectories), institutional uptake shifts composition based on eligibility, criteria amended to match new population ("criterion capture"), advocacy argues for revision based on self-understanding/agency.
      *   **Positions to Translate:**
          1.  Medical Model (Natural Kinds).
          2.  Hacking's Looping Effects.
          3.  Harmful Dysfunction Analysis (Wakefield).
          4.  Conventionalism/Pragmatism.
      *   **Constraints:** Continuous prose (1000-1500 words), flag uncertainties/forced choices, identify where the vocabulary begs the question, focus heavily on the "residue" (what the vocabulary *misses*).
      *   **Tone:** Professional, precise, philosophical, acknowledging the limits of the requested framework.

  2.  **Deconstruct the Positions into User's Vocabulary:**

      *   *Medical Model (Realism):* CES refers to a latent variable $L$ causing symptoms $S$. Measurement invariance holds across time/cohorts. Interventions on $L$ change $S$. The revision of the manual is an attempt to improve the indicator function for $L$.
      *   *Hacking (Looping):* The classification $C$ is a cause of the symptoms $S$ (or the latent trait itself). $C \rightarrow S$. This violates the assumption that the classifier is independent of the classified. Measurement invariance fails because the generative model changes when $C$ is applied.
      *   *Harmful Dysfunction (Wakefield):* Two components. (1) Dysfunction: Failure of a mechanism to perform its evolved function (causal/etiological claim). (2) Harmful: Value judgment (normative claim). In DAG terms, there's a node for "Mechanism Failure" and a node for "Social Value," both parents of "Disorder."
      *   *Conventionalism:* The category $C$ is defined by its utility for downstream interventions (treatment, insurance). Validity is predictive validity for specific outcomes, not construct validity regarding a latent $L$.

      *   *The Case (CES):*
          *   (1) Latent structure instability $\rightarrow$ Measurement non-invariance.
          *   (2) Self-description affecting trajectory $\rightarrow$ Intervention on the unit via the label.
          *   (3) Institutional uptake $\rightarrow$ Selection bias / Collider bias in the diagnosed sample.
          *   (4) Criterion capture $\rightarrow$ Updating the measurement model to fit the new, shifted distribution.
          *   (5) Advocacy/Agency $\rightarrow$ Who sets the intervention targets?

  3.  **Drafting the Translation (Section 1):**

      *   *Medical Model:* They see CES as an attempt to measure a stable latent construct $L$. The tripling of prevalence and latent structure instability (Fact 1) is measurement error or noise. The goal is to refine the indicators to restore measurement invariance across pre- and post-inclusion cohorts. The category is "real" if $L$ supports invariant causal relations under intervention.
      *   *Looping:* The classification variable $C$ is not just an indicator; it is a parent node in the DAG of the patient's psychology. Assigning $C$ intervenes on the patient's self-concept, altering the manifestation of symptoms. Fact (2) is evidence that $C \rightarrow S$. Measurement invariance *cannot* hold because the structural equations change upon measurement. The "kind" is unstable because the intervention (diagnosis) changes the target.
      *   *Harmful Dysfunction:* This splits the question. Is there a causal mechanism failure (etiology)? If yes, is it "harmful" according to social values? In the CES case, the "dysfunction" might be ambiguous (is fatigue a mechanism failure or a response?). The "harm" is the value judgment. The translation is awkward here because "function" is teleological, not purely causal, but we can treat it as a specific etiological pathway.
      *   *Conventionalism:* CES is real *relative to a purpose*. Does the variable $C$ predict treatment response or insurance eligibility (Fact 3)? If the latent structure shifts but predictive validity for treatment holds, the category is valid. The "criterion capture" (Fact 4) is just updating the decision rule to maximize utility, not truth.

      *   *Forced Choices/Uncertainties:*
          *   Translating "Natural Kind" as "Stable Latent Variable" begs the question against Hacking. It assumes the instability is error, not ontological change.
          *   Translating "Harmful" as a "Value Node" treats normativity as a variable, which might be a category mistake.
          *   Translating "Real" as "Invariant" assumes realism *is* invariance.

  4.  **Drafting the Residue (Section 2):**

      *   *First-Personal Authority (Fact 2 & 5):* Interventionism treats the subject as a system to be manipulated. It misses the *meaning* of the diagnosis to the subject. The "idiom" isn't just a variable; it's a hermeneutic framework. My vocabulary sees $C \rightarrow S$, but misses that $S$ is constituted by the *interpretation* of $C$.
      *   *Normativity/Politics (Fact 5):* Who gets to intervene? Interventionism assumes an agent intervenes. It doesn't critique *which* agents should have that power. The demand for "a say" is a claim about epistemic justice, not causal structure. My framework can model the *effect* of giving them a say, but not the *right* to it.
      *   *Discovered vs. Instituted:* This might be a false dichotomy in causal terms. Everything is "instituted" by the measurement model, but "discovered" if the latent structure is robust. The debate is often about *authority*, not ontology.
      *   *The "Kind" itself:* Interventionism deals with variables. "Kinds" are often treated as ranges of variables. But Hacking's point is about *people* becoming a kind. The ontology of "human kinds" vs. "natural kinds" isn't just about stability; it's about reflexivity.

  5.  **Refining and Polishing (Checking Constraints):**

