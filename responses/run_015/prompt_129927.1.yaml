prompt: |-
  You are a professional philosopher of science with particular competence in metaphysics and causal reasoning. Before you answer, take a moment to brainstorm the conceptual distinctions at stake, then proceed with care.

  I am a retired experimental physicist who has recently begun serious study in philosophy. I want a formal specification of the desiderata that any adequate theory of causation by omission must satisfy—particularly one that can serve scientific explanation rather than only everyday discourse. Do not give me a bibliography or a survey of named schools; instead, lay out the requirements themselves, with the motivating case or distinction behind each, and flag which are non-negotiable versus camp-specific preferences.

  Please ensure your list addresses at least these points: (1) the theory must distinguish genuine causal omission from mere absence, using a concrete case in which an expected shielding mechanism is missing in a replication study and its absence is cited in the failure report; (2) it must preserve asymmetry—why omitting a harmful exposure can cause damage without symmetrically implying that omitting damage causes benefit—without reducing the distinction to pure normativity; (3) it must separate omission-as-cause from omission-as-background-condition, especially in experiments with redundant controls where several absent factors could each be blamed; (4) it must remain consistent with the physical fact that absences carry no energy or momentum, yet still allow scientific reports to treat them as genuinely explanatory; (5) it must account for why double omissions (the simultaneous absence of factor A and factor B) do not automatically generate double causation.

  For each requirement, state whether you take it to be non-negotiable, and identify any pair—especially (1) together with (4)—that may be jointly unsatisfiable without revising what we mean by 'causal' in physical contexts. Keep the weight on the criteria and their motivating cases; you may briefly indicate how counterfactual, normative, and probabilistic accounts fare against the list, but the deliverable should be the specification itself, suitable for circulation at a philosophy-of-science seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of science (competent in metaphysics and causal reasoning).
      *   **User:** Retired experimental physicist turned philosophy student. (Needs precision, rigor, respect for physical constraints, avoidance of fluff/survey).
      *   **Task:** Provide a *formal specification of desiderata* for a theory of causation by omission suitable for *scientific explanation*.
      *   **Constraints:**
          *   No bibliography or survey of named schools.
          *   Lay out requirements with motivating cases/distinctions.
          *   Flag non-negotiable vs. camp-specific preferences.
          *   Address 5 specific points: (1) Omission vs. Mere Absence (shielding case), (2) Asymmetry (harm/benefit without pure normativity), (3) Cause vs. Background Condition (redundant controls), (4) Consistency with Physics (no energy/momentum), (5) Double Omissions (no double causation).
          *   Identify tensions/incompatibilities (especially 1 & 4).
          *   Briefly mention how accounts fare, but focus on the criteria.
          *   Tone: Suitable for a philosophy-of-science seminar (rigorous, precise).

  2.  **Deconstruct the 5 Points & Brainstorm Conceptual Distinctions:**

      *   *Point 1 (Omission vs. Absence):* In physics, "absence" is everywhere. Why is *this* absence causal? Usually involves a contrast class or an expectation. In the shielding case, the shield *should* have been there.
      *   *Point 2 (Asymmetry):* Causation is asymmetric. Omitting a vaccine causes disease. Does omitting disease cause vaccination? No. Norms often drive this (you *ought* to vaccinate), but the user wants to avoid *pure* normativity. Needs a structural or counterfactual asymmetry.
      *   *Point 3 (Cause vs. Background):* INUS conditions (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition). If multiple controls are missing, which one is the "cause"? Needs a specificity or manipulation criterion.
      *   *Point 4 (Physics Compatibility):* The "Hard Problem" of omission. Causation in physics is usually conserved quantities (energy/momentum). Absences have none. How to reconcile? Process theories vs. Counterfactual theories.
      *   *Point 5 (Double Omissions):* If A is missing and B is missing, and both are "causes," do we have two causes? Or is it one complex state? Prevents causal inflation.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1 (Specificity/Contrast):* Needs to handle the shielding case. The absence must be relative to a specific model or expectation. *Non-negotiable.*
      *   *Requirement 2 (Asymmetry):* Needs to avoid saying "not-X causes Y" implies "not-Y causes X". Needs to rely on temporal or structural directionality, not just "it's bad." *Non-negotiable.*
      *   *Requirement 3 (Selection/Relevance):* Distinguishing the *cause* from the *field*. In redundant controls, we need to pick the one that was manipulated or expected. *Camp-specific (some accept promiscuous realism).* Let's make it non-negotiable for *scientific explanation* (which requires specificity).
      *   *Requirement 4 (Physical Consistency):* This is the big one. If causation requires energy transfer, omissions aren't causes. If causation is counterfactual, they are. The user wants scientific reports to treat them as explanatory. This creates a tension. *Non-negotiable constraint, but potentially incompatible with strict physicalism.*
      *   *Requirement 5 (Individuation):* Preventing causal proliferation. *Non-negotiable.*

  4.  **Addressing the Tension (1 & 4):**
      *   (1) demands we treat specific absences as causal in reports.
      *   (4) demands we acknowledge physics says absences carry no conserved quantities.
      *   *Resolution:* We must distinguish *ontological causation* (physics) from *explanatory causation* (science/pragmatics). Or adopt a pluralist view. I need to flag this clearly as the user requested.

  5.  **Refining the Tone:**
      *   Avoid "Lewis says..." or "Mackie argues..."
      *   Use formal language (variables, conditions, constraints).
      *   Acknowledge the physicist's background (respect for conservation laws).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty (the "metaphysical cost").
      *   **The Desiderata (1-5):** Formal statement, Motivating Case, Status (Non-negotiable/Preferred).
      *   **The Tension Analysis:** Specifically addressing the (1)+(4) conflict.
      *   **Brief Account Evaluation:** How counterfactual/normative/process theories map onto these.
      *   **Conclusion:** Summary of the trade-off.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid bibliographies? Yes.
      *   *Check:* Did I address the shielding case specifically? Need to ensure Req 1 uses that example.
      *   *Check:* Is the asymmetry argument robust? Avoid reducing it to "moral obligation." Focus on structural asymmetry in the experimental setup.
      *   *Check:* Is the distinction between Cause and Background clear? Use the redundant control example.
      *   *Check:* Is the physics constraint respected? Don't pretend absences have energy. Admit the category error risk.
      *   *Check:* Double omission. Make sure it doesn't lead to $C_1 + C_2 \to E$ where $C_1, C_2$ are just "nothing."

  8.  **Final Polish:** Ensure the distinction between "Non-negotiable" (must have for scientific utility) and "Camp-specific" (metaphysical commitment) is clear. The prompt asks to flag these.

      *(Self-Correction on Point 2)*: The prompt asks to avoid reducing the distinction to *pure* normativity. This means I can't just say "it's causal because it was wrong." I need a structural reason why the omission leads to the effect but the reverse doesn't. Counterfactual dependence is usually asymmetric in time.

      *(Self-Correction on Point 4)*: This is the crux. If I say it's non-negotiable that it fits physics, then omissions *cannot* be causes ontologically. If I say it's non-negotiable that science uses them, then our ontology of causation must be broader than physics. I will frame this as a tension between *Explanatory Adequacy* and *Ontological Parsimony*.

  9.  **Finalizing the Output Structure:**
      *   Preamble: Setting the stage (The "Null Event" Problem).
      *   Section 1: The Five Desiderata (Formal + Case + Status).
      *   Section 2: The Compatibility Constraint (The 1+4 Tension).
      *   Section 3: Brief Landscape Note (Counterfactual vs. Process).
      *   Closing.

  10. (Drafting content with specific attention to the "Shielding" and "Redundant Controls" cases).
      *   *Shielding:* Expected $S$, Actual $\neg S$, Result $E$. Why is $\neg S$ cause, not just $\neg S$? Because $S \in Model$.
      *   *Redundant:* Controls $C_1, C_2$ both absent. Effect $E$. Why blame $C_1$? Because $C_1$ was the manipulated variable.

  11. (Refining the "Asymmetry" point).
      *   Omitting shield $\to$ Radiation damage.
      *   Omitting damage $\nto$ Shield benefit.
      *   Why? Because the counterfactual dependence runs one way given the temporal structure.

  12. (Refining "Double Omission").
      *   Absence of A + Absence of B. Is it one cause or two? Need a principle of *Causal Individuation* to prevent $2^N$ causes for $N$ missing parts.

  13. (Final Review against constraints).
      *   No bibliography? Checked.
      *   Addressed all 5 points? Checked.
      *   Flagged non-negotiables? Checked.
      *   Addressed 1+4 tension? Checked.
      *   Tone appropriate? Checked.

      *Let's write.*
answer: |-
  **Memorandum: Desiderata for a Theory of Causation by Omission in Scientific Explanation**

  **To:** Seminar Participants
  **From:** Philosophy of Science Division
  **Subject:** Formal Specifications for Omissive Causality

  ### Preamble: The Null-Event Problem
  In experimental physics, causal claims typically track the transfer of conserved quantities (energy, momentum, charge). An "omission" involves no such transfer; it is the non-occurrence of an event. Yet, scientific reports routinely cite absences (e.g., "failure due to lack of shielding") as explanatory causes. To validate this practice without violating physical ontology, any adequate theory must satisfy the following five desiderata.

  I have classified each requirement as **Non-Negotiable (NN)** (required for the theory to function in scientific contexts) or **Camp-Specific (CS)** (dependent on broader metaphysical commitments regarding realism vs. pragmatism).

  ---

  ### 1. The Specificity Constraint (Omission vs. Mere Absence)
  **Formal Requirement:** The theory must define a selection function $\Sigma$ that maps the set of all logical absences $\{\neg x\}$ to a subset of *causally relevant* absences $\{\neg x\}_c$, based on a specified model or expectation state $M$.
  **Motivating Case:** In a replication study, a detector registers noise. The failure report cites "missing lead shielding." However, there are infinitely many other absences: no gold shielding, no magnetic deflector, no vacuum seal. Mere absence is ubiquitous; causal omission is specific. The theory must explain why $\neg \text{Lead}$ is the cause, while $\neg \text{Gold}$ is not, given that both were absent.
  **Status:** **Non-Negotiable (NN)**. Without this, the theory permits causal promiscuity (everything absent is a cause), rendering explanation impossible.
  **Implementation Note:** This usually requires referencing a *contrastive model* (what was expected to happen) rather than just the actual world history.

  ### 2. The Asymmetry Constraint (Directionality without Pure Normativity)
  **Formal Requirement:** For an omission $\neg A$ causing effect $E$, the theory must ensure that $\neg E$ does not symmetrically cause $A$ (or $\neg A$), without relying solely on deontic norms (i.e., not merely because $A$ was "obligatory").
  **Motivating Case:** Omitting a radiation shield ($\neg S$) causes tissue damage ($D$). It is false that omitting tissue damage ($\neg D$) causes the presence of a shield ($S$). A purely normative account says $\neg S$ is causal because you *ought* to have shielded. But in a descriptive scientific report, we need structural asymmetry. The causal dependence must run from the setup conditions to the outcome, not vice versa.
  **Status:** **Non-Negotiable (NN)**. Causation is inherently directional; if the theory collapses into symmetric correlation or pure moral obligation, it fails as a scientific tool.
  **Implementation Note:** This typically requires temporal indexing or structural equation modeling where the omission is an exogenous variable and the damage is endogenous.

  ### 3. The Relevance Constraint (Cause vs. Background Condition)
  **Formal Requirement:** In a set of jointly sufficient absent conditions $\{\neg A, \neg B, \neg C\}$, the theory must identify a unique or primary causal candidate based on manipulation or intervention status, rather than treating all as equal causes.
  **Motivating Case:** An experiment fails due to thermal drift. Three redundant cooling systems were off ($\neg C_1, \neg C_2, \neg C_3$). The report blames "Failure to engage Primary Cooling ($\neg C_1$)." $\neg C_2$ and $\neg C_3$ were also true, but they are treated as background conditions. The theory must distinguish the *failed intervention* from the *static background absence*.
  **Status:** **Non-Negotiable (NN)** for experimental science. While metaphysics might allow "promiscuous realism" (all three are causes), scientific explanation requires identifying the locus of control failure.
  **Implementation Note:** This favors interventionist accounts over regularity accounts.

  ### 4. The Physical Consistency Constraint (No "Negative Energy")
  **Formal Requirement:** The theory must not posit that absences possess physical properties (mass, energy, momentum) or act as physical forces, while still allowing them to appear in causal equations.
  **Motivating Case:** A report states, "The lack of pressure caused the implosion." Physics dictates that "lack of pressure" exerts no force; the external atmospheric pressure did the work. The theory must reconcile the explanatory utility of "lack of pressure" with the ontological fact that only positive pressures transfer momentum.
  **Status:** **Non-Negotiable (NN)**. Violating this contradicts conservation laws fundamental to the physicist's worldview.
  **Implementation Note:** This forces a distinction between *ontological causation* (physical processes) and *explanatory causation* (informational/pragmatic relations).

  ### 5. The Individuation Constraint (No Double Counting)
  **Formal Requirement:** The simultaneous absence of factors $A$ and $B$ ($\neg A \land \neg B$) must not automatically generate two distinct causal events $C_1$ and $C_2$ unless $A$ and $B$ are independently manipulable variables in the model.
  **Motivating Case:** A system fails because Power is off ($\neg P$) and Signal is off ($\neg S$). If $\neg P$ necessitates $\neg S$ (no power means no signal), counting both as separate causes inflates the causal count. The theory must prevent causal proliferation where one absence entails another.
  **Status:** **Camp-Specific (CS)**. Some metaphysical views accept "causal inflation" (every true counterfactual is a cause). However, for *scientific explanation*, this is effectively **NN** to maintain parsimony.
  **Implementation Note:** Requires a principle of *Causal Independence* among omissive variables.

  ---

  ### Critical Tension Analysis: The Compatibility of (1) and (4)

  There is a severe tension, potentially a contradiction, between **Desideratum 1 (Specificity)** and **Desideratum 4 (Physical Consistency)**.

  *   **The Conflict:** To satisfy (1), we must treat a specific absence (e.g., $\neg \text{Shield}$) as a distinct causal entity that explains the effect. To satisfy (4), we must acknowledge that $\neg \text{Shield}$ is not a physical entity and transfers no energy.
  *   **The Dilemma:**
      *   If we prioritize (4) strictly (Process/Mechanistic view), omissions cannot be causes *ontologically*. They are merely placeholders for the presence of other forces (e.g., external pressure causing implosion, not "lack of internal pressure"). This risks failing (1), as the report's explicit citation of the omission becomes metaphorically true but literally false.
      *   If we prioritize (1) strictly (Counterfactual/Interventionist view), we grant omissions causal status. This risks failing (4), as we appear to reify "nothing" into a causal power, which offends physicalist ontology.
  *   **Resolution Requirement:** Any theory circulating in this seminar must explicitly state whether it treats causation by omission as:
      1.  **Ontologically Real:** (Requires revising physics to allow non-conserved causal relata).
      2.  **Explanatorily Real but Ontologically Derivative:** (The omission is a high-level description of a complex physical situation involving positive forces).
      3.  **Purely Pragmatic:** (The omission is a tool for the agent, not a feature of the world).

  **Verdict:** For a theory to serve *scientific explanation* (as requested), it must adopt position (2). It must treat omissions as **high-level variables** that supervene on physical states without being identical to physical forces. If a theory cannot sustain this supervenience relation without collapsing into dualism, (1) and (4) are jointly unsatisfiable.

  ---

  ### Brief Evaluation of Account Types against Desiderata

  *   **Counterfactual Dependence Accounts:**
      *   *Performance:* Strong on (1), (2), and (5). Weak on (4).
      *   *Critique:* They easily handle specificity and asymmetry but struggle to explain how a "nothing" (the counterfactual alternative) exerts influence without violating physical closure.
  *   **Normative/Expectation Accounts:**
      *   *Performance:* Strong on (1) and (3). Weak on (2).
      *   *Critique:* They solve specificity by appealing to "what should have happened." However, they risk reducing causation to moral or statistical expectation, failing the asymmetry test if the norm is symmetric.
  *   **Process/Mechanistic Accounts:**
      *   *Performance:* Strong on (4). Weak on (1) and (3).
      *   *Critique:* They respect conservation laws perfectly. However, they typically deny omissions are causes at all (treating them as "quasi-causes"), which makes them inadequate for analyzing failure reports where omissions are the primary explanatory variable.

  ### Conclusion for Seminar Discussion
  The primary task is not to choose a school, but to resolve the tension between **Physical Consistency (4)** and **Explanatory Specificity (1)**. A viable theory must demonstrate how an absence can be *causally explanatory* without being *physically efficacious*. If the theory cannot articulate the mechanism of this distinction, it fails the physicist's constraint.
