answer: |-
  1. Confederate Lost Cause (9.2), 2. Kosovo Field myth (8.5), 3. Masada narrative (3.5), 4. Dunkirk spirit (1.2).

  The Confederate Lost Cause ranks highest because it explicitly constructs a moral community defined by its opposition to the prevailing federal authority, maintaining a counter-sovereignty that demands the rectification of Reconstruction-era outcomes and challenges the legitimacy of the American national narrative. This myth sustains institutional parallelism through state-level legislation, monument preservation, and distinct educational historiographies that resist integration into the broader unionist memory, effectively keeping the moral claim of the Confederacy alive against the current state.

  The Kosovo Field myth follows closely, as it establishes a spiritual sovereignty—the Heavenly Kingdom—that exists parallel to the secular Serbian state and frequently demands political rectification when earthly governance conflicts with sacred nationalist mandates. While deeply embedded in Serbian institutions like the Orthodox Church and national curriculum, its secessionist quality fluctuates; it empowers the state when it aligns with nationalist goals but delegitimizes the government when it pursues pragmatic compromise, creating a persistent tension between spiritual mandate and political reality.

  The Masada narrative scores significantly lower because, although it originated as a mobilizing myth for a stateless people, it has been largely co-opted by the modern Israeli state to reinforce military cohesion and national unity rather than challenge state authority. While fringe elements occasionally invoke the myth to demand rectification against territorial compromise, the narrative is predominantly institutionalized within the IDF and state ceremonies, serving to integrate the citizenry into the existing sovereignty rather than constructing a parallel moral community.

  The Dunkirk spirit ranks lowest as it functions almost exclusively as a tool of mnemonic consolidation, reframing a military defeat to bolster loyalty to the British state and government during crises. It possesses no parallel sovereignty and demands no rectification from the present-day state; instead, it is fully integrated into the national identity to encourage endurance and unity under established authority, representing the inverse of mnemonic secession.
