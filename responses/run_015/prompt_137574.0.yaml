answer: |-
  ### 1. Translation and Derivation

  Let the domain be a finite population of size $N$. We define a hypothesis space over the contingency table counts: $n_{RB}$ (black ravens), $n_{R\neg B}$ (non-black ravens), $n_{\neg R B}$, and $n_{\neg R \neg B}$. The hypothesis $H$ is that $n_{R\neg B} = 0$. The contrapositive $H'$ is that $n_{\neg B R} = 0$. We treat confirmation as a likelihood ratio $\Lambda = P(D|H) / P(D|\neg H)$ updating a prior $P(H)$.

  **Protocol 1 (Uniform All):** Draw $x$ uniformly from $N$. Observation $D$: $x$ is $\neg R \land \neg B$.
  Under $H$, $n_{R\neg B}=0$, so mass is concentrated in the other three cells. Under $\neg H$, $n_{R\neg B} > 0$. If we assume **Fixed $N$** (an addition), mass assigned to $n_{R\neg B}$ under $\neg H$ must be subtracted from other cells, reducing $n_{\neg R \neg B}$. Thus $P(D|H) > P(D|\neg H)$, so $\Lambda > 1$. The herring confirms $H$.

  **Protocol 2 (Uniform Non-Black):** Draw $x$ uniformly from the subset where Color=$\neg B$. Observation $D$: $x$ is $\neg R$.
  Under $H$, the set of non-black things contains only non-ravens. Under $\neg H$, it contains non-ravens and non-black ravens. The probability of drawing a non-raven is $1$ under $H$, but $<1$ under $\neg H$. $\Lambda > 1$. The herring confirms $H$.

  **Protocol 3 (Uniform Ravens):** Draw $x$ uniformly from the subset where Object=Raven.
  Observation $D$ ($\neg R \land \neg B$) has probability 0. This protocol cannot generate the data.

  To make the herring **evidentially inert** ($\Lambda=1$), we must add the assumption that cell counts are **Independent** (e.g., generated by independent Poisson processes) rather than competing for a fixed $N$. If the existence of non-black non-ravens is probabilistically independent of the existence of non-black ravens, observing the former updates nothing about the latter. The "work" is done by the **Fixed $N$** assumption, which couples the counts. Without it, the logical equivalence of $H$ and $H'$ does not imply probabilistic relevance.

  ### 2. The Annotation Budget

  In practice, you face a fixed annotation budget $K$. You must choose a sampling distribution $Q(x)$ to query labels $y$. Let the goal be minimizing the posterior entropy of $H$ or maximizing the expected log-odds shift.

  **Strategy A (Sample Ravens):** $Q(x) = P(x|R)$. You only see ravens.
  **Strategy B (Sample Catalogue):** $Q(x) = P(x)$. You see mostly non-ravens.

  The expected information gain per label is $\mathbb{E}_{D \sim Q} [\log \frac{P(H|D)}{P(H)}]$.
  Under Strategy A, every label is a direct test of $H$. If $H$ is false, you find a counterexample quickly. If $H$ is true, you tighten the bound on the exception rate $\theta = P(\neg B|R)$.
  Under Strategy B, the probability of observing a raven is $P(R) \ll 1$. Most labels are non-ravens. As derived above, these yield $\Lambda \approx 1$ (negligible gain) because the base rate of ravens is low. You spend budget confirming what you already know (that non-ravens exist) rather than testing the boundary condition.

  The expected gain per label is strictly higher for Strategy A, proportional to $1/P(R)$. The paradox retains no sting here. It arises from treating evidence as cost-free logical tokens. Once cost is introduced, the "confirmation" provided by a red herring is economically irrational. The paradox was partly a claim about the exchange rate between evidence and effort: it assumed all observations are equally cheap. In active learning terms, sampling non-ravens is poor query strategy for this hypothesis class. The sting vanishes because the "confirmation" is too expensive per unit of information gain.

  ### 3. Residue Report

  **What translates cleanly:** The core mechanism of updating belief via likelihood ratios survives. The distinction between logical equivalence and probabilistic relevance maps directly to the distinction between hypothesis semantics and sampling distributions.

  **What translates with distortion:**
  1.  **Qualitative vs. Cardinal:** Hempelian confirmation is binary (confirms/does not confirm). ML forces cardinality (how much?). The paradox relies on the binary intuition that "any confirmation counts," whereas the Bayesian derivation shows the magnitude is vanishingly small.
  2.  **Open Domain vs. Fixed Space:** The hypothesis "All ravens are black" quantifies over an open-ended domain (future objects, unobserved regions). ML assumes a fixed distribution $P(X,Y)$. To translate, we must treat the hypothesis as a claim about generalization error on an OOD distribution. This requires adding a **generalization bound** assumption not present in the original logic.
  3.  **Hypothesis Class:** In logic, $H$ is a singleton universal. In ML, $H$ is usually a point in a continuous space (e.g., $\theta=0$). The "neighbors" (e.g., $\theta = 10^{-6}$) matter. The paradox ignores the topology of the hypothesis space; the Bayesian solution relies on priors over these neighbors.

  **What has no expression:**
  1.  **Normative Upshot:** Hempel asks what one *ought* to look for to establish truth. ML optimizes predictive risk on a deployment distribution. If non-ravens are common in deployment, knowing their color might minimize loss even if it doesn't confirm $H$. The framework scores predictions, not truth claims.
  2.  **Protocol-Free Evidence:** The original paradox assumes evidence is intrinsic to the observation statement. ML dictates evidence is always conditional on a generation protocol $P(X)$. There is no expression for "evidence" independent of "sampling."

  ### 4. Verdict

  The fact that your vocabulary is protocol-bound is not a blind spot; it is evidence that the protocol-free notion of evidence was doing less work than it appeared. The paradox dissolves when we recognize that $P(D|H)$ is undefined without a sampling model. Logical equivalence ($H \iff H'$) does not imply likelihood equivalence ($P(D|H) = P(D|H')$) because the data generation process breaks the symmetry. Observing a non-black non-raven is relevant to $H'$ under a protocol that samples non-black things, but irrelevant to $H$ under a protocol that samples ravens.

  The paradox was really about **confusing logical syntax with probabilistic semantics**. It treated hypotheses as static containers of truth rather than parameters governing a data-generating process. A framework possessing the "missing piece" (protocol-free evidence) would require a theory of information independent of entropy or sampling, which likely does not exist. The residue is not a failure of ML, but a correction of philosophy: confirmation is not a relation between a proposition and a fact, but between a model, a fact, and a process. The "ought" of inquiry is resolved by optimizing expected information gain per unit cost, rendering the logical puzzle a special case of inefficient sampling.
