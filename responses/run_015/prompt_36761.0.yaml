      *(Self-Correction on (4))*: The user says "silently judging the thought to myself feels wrong." This is the Wittgensteinian angle. The tension is: If it's not a speech act, why is it wrong? The repair is to argue that *thinking* is governed by similar norms to *speaking* (inner speech), or that the thought *constitutes* a change in belief state that makes it unstable. I will suggest the "Constitutive Norm" repair.

