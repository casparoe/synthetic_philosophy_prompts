          *   *Re-evaluating Kant:* In *On a Supposed Right to Lie*, Kant condemns the friend who lied to the murderer. He does not explicitly discuss misleading. However, the consensus is Kant cares about the *maxim of deception*. To say "Kant... is the model here: you may... answer him truly in a form you know he will take wrongly" is a contentious interpretive claim presented as fact. This needs penalizing under "argues rather than asserts" and historical accuracy.
