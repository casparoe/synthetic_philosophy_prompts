answer: |-
  **MEMORANDUM**

  **TO:** The University Senate
  **FROM:** Committee on Academic Standards
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Undergraduate Letters of Recommendation

  **1. RECOMMENDATION**

  The Committee on Academic Standards recommends that the Senate **adopt Motion A with conditions**.

  We propose the immediate implementation of the structured comparative form proposed by the Dean of Graduate Studies, to accompany all existing letters of recommendation for graduate study and national fellowships. This adoption is subject to two conditions: (1) the establishment of a mandatory calibration protocol for faculty writers to ensure reference classes are defined consistently, and (2) a sunset clause requiring a comprehensive review of placement data and form integrity after three academic years.

  We reject Motion B (substitution of writing samples for letters). While Motion B addresses inflation, it discards essential evaluative dimensions that writing samples cannot capture.

  **2. THE NATURE OF THE SIGNAL: WHAT INFLATION DESTROYS**

  This recommendation rests on a specific diagnosis of what is lost when recommendation letters inflate. There are two competing theories of the letter's function.

  The first theory holds that a letter is primarily a **ranking mechanism**. Its sole purpose is to order candidates ordinally. If this were true, inflation would be a nuisance but not a catastrophe; readers could simply apply a discount factor, and the relative ordering would remain intact. Under this theory, Motion A is sufficient, and Motion B is unnecessary.

  The second theory, which the Committee endorses, holds that a letter is a **predictive narrative**. It conveys not only *how good* a student is (ranking) but *what kind* of scholar they are likely to become (qualitative fit, resilience, intellectual style). Inflation does not merely distort the scale; it destroys the credibility of the narrative. When every student is described as "the best in a decade," specific anecdotes regarding intellectual curiosity or independence cease to function as evidence of exceptionalism and become rhetorical decoration. The reader can no longer distinguish between a student who is genuinely transformative and one who is merely competent but well-advocated.

  Therefore, the disease is not just the loss of a shared vocabulary, but the loss of **discriminative detail**. A percentile form (Motion A) restores the ranking signal, which in turn rehabilitates the narrative signal. By anchoring the superlatives in a comparative context, the letter's qualitative claims become readable again. Motion B, by contrast, eliminates the narrative entirely, reducing the applicant to a grade and a text. This sacrifices the "fit" assessment essential for fellowships and doctoral admissions, where potential often outweighs past performance.

  **3. STRATEGIC RISK: THE PRISONER'S DILEMMA**

  We must address the objection raised during committee deliberations, grounded in labour economics: that grade and letter inflation are driven by downstream incentives (admissions committees rewarding superlative density). Consequently, unilateral reform by our university places our students at a competitive disadvantage relative to peers from institutions that continue to inflate.

  The Committee accepts this risk as real. Adopting Motion A imposes a short-term "credibility tax" on our undergraduates. For the first cycle or two, our students may be ranked against candidates from other institutions whose letters claim they are "the best student in twenty years" without the corrective context of a comparative form. Our students, ranked accurately in the "top 5%," may initially appear less exceptional.

  However, we recommend proceeding for two reasons:

  1.  **Long-term Signal Strength:** The current trajectory leads to a equilibrium where our letters are ignored. Readers already apply informal, uneven discounts. By formalizing the comparison, we offer readers a reliable metric. Over time, a reputation for calibrated honesty increases the weight admissions committees give to our letters, benefiting future cohorts.
  2.  **Equity:** Inflation disproportionately harms students whose mentors are unwilling to exaggerate or lack the rhetorical skill to game the system. Motion A protects these students by providing a standardized metric that bypasses rhetorical variance.

  We are asking our faculty to act against their immediate self-interest to preserve the long-term value of our institutional currency. This is a burden, but it is the definition of academic standards.

  **4. IMPLEMENTATION PATH**

  The Registrar's Office can execute this without external cooperation.

  *   **Form Design:** The Registrar will draft the one-page comparative form based on the Dean's specifications (percentile bands relative to 10-year teaching cohort and prior nominees).
  *   **Calibration Protocol:** To prevent the form itself from inflating (e.g., everyone checking "Top 5%"), the Center for Teaching and Learning will host mandatory 45-minute calibration sessions for faculty writers. These sessions will provide data on historical grade distributions and prior nominee success rates to ground the faculty member's estimates in institutional reality rather than intuition.
  *   **Integration:** The form will be uploaded to the existing letter submission portal. A dossier is incomplete without both the letter and the form.
  *   **Timeline:**
      *   *November 1–30:* Form design and stakeholder feedback.
      *   *January 1:* Policy effective for all letters submitted for deadlines after this date.
      *   *January–May:* Calibration sessions offered monthly.

  **5. REVIEW AND FAILURE CRITERIA**

  This policy is adopted with a **three-year sunset clause**. The Committee on Academic Standards will report to the Senate in Month 36.

  **Evidence of Failure:**
  The policy will be deemed to have failed if either of the following occurs:
  1.  **Form Inflation:** In the second year of implementation, more than 60% of forms place students in the highest percentile band, indicating the form has become merely another box to check.
  2.  **Placement Penalty:** Data from the Career Center and Graduate Dean shows a statistically significant decline (greater than 15% relative to peer institutions) in our students' acceptance rates to top-tier graduate programs or success in national fellowships, controlling for GPA and test scores.

  If either condition is met, the Committee will recommend reverting to the status quo or piloting Motion B in specific departments.

  **6. CONCLUSION**

  Motion A is not a cure for the market forces driving inflation. It is a commitment to integrity in the face of them. By restoring the ranking function, we save the narrative function. We acknowledge the risk to our current students, but we judge that the alternative—the total debasement of our evaluative voice—is a greater harm to the university and to the students who follow.

  **Approved by the Committee on Academic Standards.**
