  7.  **Final Decision on Recommendation:**
      *   Adopt Motion A, but with a "Narrative Anchor" condition. The form must be submitted, but the letter must explicitly reference specific examples that justify the ranking. This combats the "check the box" inflation.
      *   Wait, the prompt says Motion A leaves the letter "uncapped and unedited." I should respect the motion's text but perhaps add a *guideline* or *training* component to the implementation.
      *   Actually, a "Fourth Course" might be better? No, the prompt asks to choose A, B, A with conditions, Reject, or Fourth. "A with Conditions" is the safest and most robust path. It acknowledges the friend's fear (by adding conditions to mitigate gaming) while keeping the letter.
