      *   *Okay, I will recommend Motion A with Conditions.* The condition will be a mandatory calibration workshop for writers and a 3-year review.
      *   *Theoretical Stance:* Inflation destroys *informational content*, not just rank. A "top 1%" label without distinct narrative is noise.

      *(Self-Correction)*: I need to be careful not to be too verbose. The prompt asks for a memo. Keep it tight.

      *(Final check on the "What is Lost" argument)*: I will argue that letters are *predictive narratives*. Inflation turns them into *ritualistic affirmations*. The loss is the ability to distinguish *types* of excellence, not just *levels*. Motion A restores the level; the Letter must restore the type.

      *(Final check on Friend's Objection)*: I will explicitly state that this policy imposes a "credibility tax" on our students in the short term. We must own that.

      *(Implementation)*: Registrar creates the form. Departments distribute.

      *(Failure)*: If placement rates drop significantly compared to peer institutions, or if the forms show 90% in the top band.

