answer: |-
  Fair enough on the scoring rules—that's a clean hit. If all we care about is calibration over a long run of identical bets, then yes, 60% is 60%, and pretending otherwise is often just a way to avoid committing to a number. I'll concede that half the time someone waves their hands about "deep uncertainty," they're really just saying "I haven't done the work to specify my likelihoods," and you're right to call that laziness. Putting a prior over models is a powerful move, and in normal science, where the paradigm holds, it dissolves most of the mystery. You've correctly identified that the *belief* state can often be collapsed into a single probability distribution without loss.

  But you're conflating the representation of belief with the cost of being wrong about the representation. The distinction shows up in the *action*, not the probability assignment. The forecaster with ten cases isn't just less confident; their 60% is fragile in a way the other isn't. If a structural break occurs—a variable enters the system neither model accounted for—the N=10 forecaster's prior over models updates wildly, while the N=1000 forecaster's is anchored. If you treat them as identical risk-bearers, you'll let them bet the same size. But a decision theory that respects uncertainty tells you to constrain the bet size for the second forecaster, not because their probability is different, but because their *exposure to model misspecification* is higher. The "weight of evidence" isn't a feeling; it's a constraint on how much leverage you apply to your own credence.

  So, sure, you can mathematically force everything into a risk framework by adding layers of meta-probability. But then you're assuming you've correctly modeled the space of models, which is exactly where the uncertainty lives. When the stakes involve one-off structural shifts—like your monetary regime example—optimizing against a single prior, even a hierarchical one, leaves you vulnerable to things you didn't know you needed to put a prior on. That's where the feeling does real work: it's the heuristic that stops you from maximizing expected utility when the utility function itself is built on sand.
