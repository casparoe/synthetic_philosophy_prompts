      *   *Claim 8:* Cultural Extinction: "Maya and Easter Islanders survive only as biological descendants — the cultures themselves went extinct."
      *   *Claim 9:* Definition Distinction: "collapse is clearly something other than mere change."

  3.  **Evaluate Claims against Current Scholarship (Mental Knowledge Retrieval & Verification):**

      *   *Claim 1 (Definition):* Generally accepted as a working definition (e.g., Tainter, Diamond), though "permanent" and "rapid" are debated. *Verdict: Defensible simplification.*
      *   *Claim 2 (Easter Island Trees/Statues):* This is the "ecocide" narrative (Jared Diamond's *Collapse*). Newer research (Hunt, Lipo, etc.) suggests trees weren't cut *for* statues (they were moved upright/walked), and deforestation happened earlier/slower. Rats played a role. *Verdict: Mistaken/Outdated.*
      *   *Claim 3 (Easter Island Subsistence):* They didn't starve to extinction. They adapted (sweet potato, chicken, fishing). Population decline was largely due to post-contact slavery/disease. *Verdict: Mistaken/Outdated.*
      *   *Claim 4 (Maya Timing):* "Within a generation" is too fast. The Classic collapse was protracted (AD 800-950+). Some cities persisted. *Verdict: Defensible simplification (but leans towards mistaken on speed).*
      *   *Claim 5 (Maya Cause):* Drought is a major factor (Haug et al.), but "exhausted farmland" is debated (they were quite resilient/intensive). It wasn't just drought; it was political fragmentation + drought. *Verdict: Defensible simplification.*
      *   *Claim 6 (Environmental Determinism):* "At bottom environmental" is the core of the Diamond thesis, which is heavily critiqued. Social/political factors are equally important. *Verdict: Mistaken/Contested.*
      *   *Claim 7 (Universal Law):* "Any society... can expect the same fate." Deterministic. Ignores resilience/adaptation. *Verdict: Mistaken.*
      *   *Claim 8 (Cultural Extinction):* **Crucial Point.** Rapa Nui people still exist and maintain culture. Maya people still exist (millions speak Mayan languages). *Verdict: Mistaken.*
      *   *Claim 9 (Collapse vs. Change):* Follows from Claim 8. If Claim 8 is wrong, this distinction is problematic. *Verdict: Contested.*

  4.  **Drafting the Response (incorporating British English):**

