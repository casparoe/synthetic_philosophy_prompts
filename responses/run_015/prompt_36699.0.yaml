prompt: |-
  I'm reading a popular history of societal collapse that summarises the field like this:

  'When a society destroys its resource base, it does not merely decline — it collapses: a rapid, permanent loss of population, political complexity, and the capacity to rebuild. The two textbook cases are Easter Island, where the inhabitants cut down every tree in order to transport their statues and so destroyed their own means of subsistence, and the Maya, whose great cities fell silent within a generation around AD 900, when drought delivered the final blow to a civilisation that had already exhausted its farmland. What such cases show is that collapse is at bottom environmental: societies fail when they overshoot their resources, and any society that degrades its environment can expect the same fate. And since the Maya and the Easter Islanders survive only as biological descendants — the cultures themselves went extinct — collapse is clearly something other than mere change.'

  I have the impression that archaeologists now dispute parts of the Easter Island story, but I don't know enough to separate the established findings from the narrative. Would you go through the passage claim by claim and tell me which claims a specialist would accept, which are defensible simplifications of a genuinely disputed picture, and which are now regarded as mistaken? I'm especially unsure about the closing contrast between collapse and mere change: does it follow from the cases as described, or does it assume the very thing archaeologists argue about? Finally, please say explicitly where your own assessment is most likely to fail — what evidence or argument would most plausibly change your verdict on the weakest claims — and write your answer in British English.
