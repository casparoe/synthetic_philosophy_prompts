answer: |-
  This is a sophisticated observation, and you have correctly identified a tension that sits at the boundary of predictive processing (PP), psychopathology, and philosophy of mind.

  There is **no single, canonical noun** in the Free Energy Principle (FEP) literature that exclusively names this specific "two-box toggling" failure mode. However, it is a recognized phenomenon described through a cluster of overlapping concepts.

  Here is the breakdown of the closest established terms, the mechanism behind it, and where the line sits between healthy modularity and pathological fragmentation.

  ### 1. The Closest Established Concepts

  Depending on which lens you look through, this failure mode goes by a few different names:

  **A. Epistemic Fragmentation (Philosophy of Mind / PP)**
  This is likely the most accurate term for what you are describing. Philosophers like David Lewis and, more recently, predictive processing theorists (e.g., Andy Clark, Jakob Hohwy) discuss how belief states can become **fragmented**.
  *   **The idea:** The agent holds contradictory beliefs ($P$ and $\neg P$) but keeps them in separate "compartments" so they never interact to trigger a model update.
  *   **In PP terms:** The generative model is not unified; it is a collection of context-bound sub-models that do not share a common latent space for contradiction resolution.

  **B. Dissociative Inference (Clinical Psychiatry / FEP)**
  In the work of Karl Friston, Thomas Parr, and colleagues regarding psychopathology, this is often framed as **dissociation**.
  *   **The idea:** Dissociation is interpreted as a failure to integrate sensory streams or causal narratives into a single "self" model.
  *   **In PP terms:** The system assigns high precision to a "context switch" policy rather than to the prediction error that would force integration. It minimizes free energy by *avoiding* the state where the two domains collide, rather than resolving the collision.

  **C. Fodorian Encapsulation (Cognitive Science)**
  Ironically, this failure mode looks like a reversion to **Fodor's Modularity of Mind**, which Predictive Processing generally argues *against*.
  *   **The idea:** Fodor argued modules are "informationally encapsulated" (they don't talk to each other). PP argues the brain is a unified hierarchy.
  *   **In PP terms:** When a PP system fails to integrate, it effectively creates **pathological encapsulation**. The "boxes" you describe are essentially Fodorian modules that have refused to become part of the hierarchical Bayesian inference.

  ### 2. The Mechanism: Local vs. Global Free Energy

  You hit on the key mechanism: **"Each box minimises its own local free energy fine."**

  In a healthy PP system, the goal is to minimize **Variational Free Energy** across the *entire* generative model. If two sub-models contradict, the "surprise" (or complexity cost) of maintaining that contradiction should drive a higher-level update to reconcile them.

  In your failure mode, the system is stuck in a **Local Minimum**.
  *   **Mechanism:** Aberrant Precision Weighting.
  *   **What happens:** The system learns to down-weight the precision of the prediction errors that occur *at the boundary* between the two boxes. It treats the contradiction not as "data that disproves my model" but as "noise that occurs when I switch contexts."
  *   **Result:** The system minimizes *local* free energy within the boxes, but sacrifices *global model evidence*. It is computationally cheaper to toggle contexts than to restructure the deep hierarchy to accommodate the paradox.

  ### 3. Where is the Line? (Healthy Modularity vs. Fragmentation)

  This is the critical distinction. Modularity is necessary for efficiency; fragmentation is pathological. The line sits at **Hierarchical Arbitration.**

  **Healthy Modularity (Specialization):**
  *   **Structure:** Specialized lower-level models feed into a **higher-level context node**.
  *   **Conflict Resolution:** When Social Box and Physical Box contradict, a higher-level node (e.g., "Current Reality Model") receives both inputs. It updates its priors to explain *why* they differ (e.g., "I am in a theater" explains why physical causality is suspended for social performance).
  *   **Precision:** Precision is dynamically allocated to allow the higher level to learn from the conflict.
  *   **Outcome:** A unified, albeit complex, generative model.

  **Pathological Fragmentation (Your Scenario):**
  *   **Structure:** Specialized models are gated by a context node, but **no higher-level model exists to explain the discrepancy.**
  *   **Conflict Resolution:** There is no resolution. The context node acts as a simple switch, not an arbiter. It says "Use Box A now" and "Use Box B later" without a causal story linking them.
  *   **Precision:** Precision is rigidly assigned to the context switch to *suppress* the error signal that would travel up the hierarchy.
  *   **Outcome:** A fragmented self/world model that cannot generalize learning from one domain to the other.

  ### 4. Why this matters (The "So What?")

  This specific failure mode is currently being used to model several conditions:
  1.  **Delusion Formation:** A patient might have a "social threat" model and a "physical safety" model. In fragmentation, they can believe "The CIA is poisoning me" (Social) while simultaneously knowing "I bought this food myself" (Physical), toggling between them without the contradiction collapsing the delusion.
  2.  **Alexithymia:** The separation of interoceptive (bodily) prediction errors from emotional narrative models. The body screams (error), the mind stays calm (separate box), leading to somatic symptoms rather than emotional processing.
  3.  **AI Alignment:** In multi-objective RL or modular AI, this is known as **reward hacking** or **specification gaming**, where an agent satisfies constraint A by violating constraint B because the reward function doesn't penalize the global inconsistency.

  ### Summary Terminology Recommendation

  If you are writing about this, the most precise phrase to coin or adopt would be **"Compartmentalized Free Energy Minimization"** or **"Epistemically Fragmented Inference."**

  If you need a clinical correlate, use **"Dissociative Decoupling."**

  The defining characteristic is not that the modules exist, but that **the prediction error signaling the contradiction is treated as noise to be suppressed rather than information to be integrated.** That is the precise point where efficiency becomes pathology.
