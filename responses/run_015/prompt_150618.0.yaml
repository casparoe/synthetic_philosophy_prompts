answer: |-
  # Exam Question: Causation, Aggregation, and Evidence

  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question 1: The Aggregation Heuristic**

  A common heuristic in observational analysis is "always disaggregate; coarse data lies." The following problem tests the limits of this rule using a clinical trial dataset comparing Drug A and Drug B on patient Recovery.

  **(a) The Reversal (6 Marks)**
  Verify the recovery rates in the table below. Calculate the Risk Difference (RD) for Drug A vs. Drug B ($Risk_A - Risk_B$) for the Mild stratum, the Severe stratum, and the Pooled aggregate. State the magnitude and direction of the Simpson's Paradox reversal in percentage points.

  | Group | Mild Patients (Recovered / Total) | Severe Patients (Recovered / Total) | Total (Recovered / Total) |
  | :--- | :--- | :--- | :--- |
  | **Drug A** | 80 / 100 | 20 / 100 | 100 / 200 |
  | **Drug B** | 180 / 240 | 10 / 60 | 190 / 300 |

  **(b) Causal Structure (6 Marks)**
  The table in (a) is numerically identical in two different causal worlds. Draw two Directed Acyclic Graphs (DAGs) involving *Treatment*, *Recovery*, and *Severity*.
  1.  **World 1:** Severity is a pre-treatment confounder (doctors assign Drug B to mild cases).
  2.  **World 2:** Severity is a post-treatment mediator (Drug A causes temporary severity symptoms before recovery).
  For each world, state whether you should compare the **Pooled** or **Stratified** rates to estimate the causal effect of Treatment on Recovery, and justify why the "always disaggregate" heuristic fails in one of these cases.

  **(c) Decomposition and Non-Collapsibility (8 Marks)**
  1.  **Decomposition:** The Crude Risk Difference can be decomposed into a weighted average of stratum-specific effects plus a selection bias term. If Treatment assignment is independent of Severity *within each stratum* (i.e., randomized within strata), prove numerically using the table in (a) that the sign of the Risk Difference cannot reverse in the aggregate. (Hint: Calculate the weights).
  2.  **Odds Ratios:** Consider a new study where Treatment is randomized 50/50 within two strata. In Stratum 1, $OR = 3.0$. In Stratum 2, $OR = 3.0$.
      *   *Stratum 1:* Control (25 rec / 100), Treatment (50 rec / 100).
      *   *Stratum 2:* Control (10 rec / 100), Treatment (25 rec / 100).
      Calculate the **Pooled Odds Ratio**. Explain why this attenuation ($OR_{pooled} < OR_{strata}$) is **not** Simpson's Paradox, and specify which OR (pooled or stratum-specific) is appropriate for predicting individual patient response versus population-level impact.

  **(d) Subgroup Analysis (5 Marks)**
  A researcher analyzes a randomized trial, slices the data into 30 demographic subgroups, and reports that Drug A is superior in the "Left-Handed Males over 50" subgroup, despite the pooled result favoring Drug B. Using your answers from (b) and (c), explain why the machinery of causal adjustment does not license this claim. What two conditions must be met for a subgroup claim to be credible?

  ***

  # Model Answer

  **(a)**
  **Mild:** $Risk_A = 0.80$, $Risk_B = 0.75$. $RD_{mild} = +0.05$ (5pp).
  **Severe:** $Risk_A = 0.20$, $Risk_B = 0.167$. $RD_{severe} = +0.033$ (3.3pp).
  **Pooled:** $Risk_A = 0.50$, $Risk_B = 0.633$. $RD_{pooled} = -0.133$ (-13.3pp).
  **Reversal:** Drug A is superior in both strata (+5pp, +3.3pp) but inferior in the aggregate (-13.3pp).

  **(b)**
  **World 1 (Confounder):** $Severity \rightarrow Treatment$, $Severity \rightarrow Recovery$, $Treatment \rightarrow Recovery$.
  *Decision:* Use **Stratified** rates. Severity confounds the assignment; pooling mixes assignment bias with treatment effect.
  **World 2 (Mediator):** $Treatment \rightarrow Severity \rightarrow Recovery$.
  *Decision:* Use **Pooled** rates. Stratifying on a mediator blocks the causal path from Treatment to Recovery. Disaggregating here induces bias (over-control), making the effective treatment look worse than it is. The heuristic fails because it ignores temporal order.

  **(c)**
  1.  **Decomposition:** If randomized within strata, the weight of each stratum in the pooled average is equal for A and B. $RD_{pooled} = \sum w_i (RD_i)$. Since $RD_{mild}$ and $RD_{severe}$ are both positive, their weighted sum must be positive. A sign reversal in RD implies unequal weights ($w_{A,i} \neq w_{B,i}$), which indicates confounding (non-random assignment).
  2.  **Odds Ratios:**
      *   S1 Odds: C=1/3, T=1. $OR_1 = 3$.
      *   S2 Odds: C=1/9, T=1/3. $OR_2 = 3$.
      *   Pooled: C (35/165), T (75/125). Odds C=7/33, Odds T=3/5.
      *   $OR_{pooled} = (3/5) / (7/33) = 99/35 \approx 2.83$.
      *   **Explanation:** This is **non-collapsibility**, not Simpson's Paradox. There is no confounding (randomization ensures equal weights). The OR is mathematically non-collapsible; the pooled estimate is naturally attenuated toward 1.0 even without bias.
      *   **Usage:** Report **Stratum-specific OR** for biological mechanism/individual prediction (constant effect). Report **Pooled RD** (not OR) for population-level impact.

  **(d)**
  Causal adjustment (b) requires *a priori* structural justification, not post-hoc data slicing. Non-collapsibility (c) implies that even without confounding, subgroups will vary.
  **Conditions for Credibility:**
  1.  **Pre-specification:** The subgroup hypothesis must be registered before data inspection to control Type I error (multiple testing).
  2.  **Interaction Test:** There must be a statistically significant test of interaction showing the effect in the subgroup differs from the rest of the population, supported by a plausible causal mechanism.

  ***

  # Marking Scheme (25 Marks)

  **Part (a): 6 Marks**
  *   **A (5-6):** Correct rates for all 4 cells + Pooled. Correct RD signs (+, +, -). Explicitly states reversal magnitude (~13pp).
  *   **B (3-4):** Correct rates but arithmetic error on Pooled RD, or identifies reversal without precise percentage points.
  *   **C (0-2):** Major arithmetic errors or fails to identify the reversal direction.
  *   *Typical Error:* Calculating Risk Ratio instead of Risk Difference, or summing percentages (80+20)/2 instead of weighting by N.

  **Part (b): 6 Marks**
  *   **A (5-6):** Correct DAGs (arrows match description). Correctly identifies Stratified for Confounder, Pooled for Mediator. Explicitly notes "over-control" or "blocking path" for Mediator case.
  *   **B (3-4):** Correct DAGs but swaps the recommendation (e.g., says always stratify). Or correct recommendation with vague justification ("it depends").
  *   **C (0-2):** DAGs missing arrows or direction wrong. Claims disaggregation is always correct.
  *   *Typical Error:* Treating Severity as a confounder in both cases; failing to recognize post-treatment bias.

  **Part (c): 8 Marks**
  *   **A (7-8):** Shows weights are equal under randomization (proof of no RD reversal). Correctly calculates Pooled OR (2.83). Distinguishes Non-collapsibility from Confounding. Correctly assigns Stratum-OR to mechanism, Pooled-RD to policy.
  *   **B (4-6):** Calculates Pooled OR correctly but calls it Simpson's Paradox. Or proves RD stability but fails to calculate OR.
  *   **C (0-3):** Fails to calculate OR. Claims Pooled OR should be 3.0. Confuses randomization with observational weighting.
  *   *Typical Error:* Assuming OR is collapsible (expecting Pooled OR = 3.0). Conflating mathematical attenuation with selection bias.

  **Part (d): 5 Marks**
  *   **A (4-5):** Identifies Multiple Testing/Type I error risk. Requires Pre-specification AND Interaction Test/Plausibility. Links back to (b) (need causal story).
  *   **B (2-3):** Mentions "chance" or "sample size" but misses pre-specification. Or mentions pre-specification but misses interaction test.
  *   **C (0-1):** Vague appeal to "replication" without structural constraints.
  *   *Typical Error:* Arguing the subgroup is valid because the numbers "look real," ignoring the 30 other slices tried.

  **Total:** 25 Marks
