answer: |-
  The insolvency puzzle you raise cuts to the heart of how we conceptualize rights under scarcity. When we observe pro rata distribution, we might initially interpret it through three distinct normative lenses. First, we could view it as implementing equal relative concession on claims, treating the debt obligation as the moral baseline for sacrifice. Second, we might see it as a rough approximation of equal relative concession on feasible maxima, akin to the Kalai–Smorodinsky solution, where the denominator is what one could possibly receive given the estate's size. Third, we might argue the practice is theoretically underdetermined, serving merely as a focal point for coordination without deep justificatory roots, coinciding with equal relative concession only because claims usually exceed the estate.

  The second reading, aligning pro rata with Kalai–Smorodinsky, faces immediate textual resistance. Kalai–Smorodinsky equalizes the ratio of actual gain to maximum possible gain. In your example, the large creditor's maximum possible gain is the entire estate, while the small creditor's maximum is their claim. If the law sought this kind of fairness, the distribution would shift significantly toward the smaller creditor, as you noted. However, the law insists that no creditor may recover more than their claim. This ceiling is not merely a physical constraint but a normative one; it defines the limit of the right itself. If the feasible maximum were the true denominator, the claim ceiling would be contingent on the estate size, yet the law treats the claim as fixed regardless of the estate's solvency. This suggests the claim, not the feasible recovery, is the relevant metric for sacrifice.

  The third reading, underdetermination, is plausible given the law's pragmatic history. Yet, the stability of pro rata across jurisdictions suggests a robust normative commitment rather than arbitrary convention. If efficiency or Nash bargaining were viable competitors, we might expect to see more experimentation with rules that maximize total welfare or prioritize smaller claims to ensure full satisfaction. Nash bargaining, for instance, would often pay small creditors in full before large ones receive anything, maximizing the product of utilities. The persistence of pro rata even when claims wildly exceed the estate indicates that the specific ratio of claims matters morally, not just practically. It tells against the idea that the rule is merely a convenient accident that happens to align with other theories.

  Consequently, I commit to the first reading: pro rata presupposes that fairness requires bearing a burden proportional to what was at stake in terms of rights, not outcomes. The choice of the claim as the denominator is essential. It reflects a deontological view where the debt creates a right, and insolvency represents a collective frustration of those rights. Justice demands that this frustration be shared equally relative to the size of the right violated. This sits comfortably with the ceiling constraint because the claim functions dually as the measure of the right and the limit of the recovery. The law does not view the estate as a windfall to be divided according to bargaining power or feasible geometry, but as an insufficient resource to meet pre-existing obligations. The sacrifice required is not equal loss of potential gain, but equal disappointment of legitimate expectation.

  Adopting Kalai–Smorodinsky would require a fundamental shift in the institution of bankruptcy. We would have to move from a model of debt satisfaction to one of estate distribution. Creditors would no longer be rights-holders owed specific sums, but stakeholders in a common pool whose shares depend on the pool's size relative to others' claims. Bankruptcy law would resist this because it undermines the concept of fixed obligation. If my recovery depends on how much you are owed relative to the estate, my right is no longer defined by our contract but by the solvency of the debtor and the claims of others. Pro rata preserves the sanctity of the claim even in failure; Kalai–Smorodinsky would dissolve it into a calculation of feasible gain. This would alter the nature of credit itself, transforming fixed debts into variable equity-like interests whenever insolvency looms. The institution resists this because its primary function is the orderly satisfaction of debts, not the equitable division of losses based on contingent feasibility.
