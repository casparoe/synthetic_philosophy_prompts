  2.  **Deconstruct the Problem:**
      *   **Scenario:** Estate £200k. Creditor A claims £1m. Creditor B claims £100k.
      *   **Pro Rata (Current Law):** Distribution proportional to claims. A gets ~£182k, B gets ~£18k. Ratio 10:1.
      *   **Kalai-Smorodinsky (KS):** Distribution proportional to *feasible* maximums (ceilings). Since total estate is £200k, A's max is £200k, B's max is £100k (capped by claim). Ratio 2:1. A gets ~£133k, B gets ~£67k.
      *   **Nash Bargaining:** Maximize product of gains. Favors smaller claims getting paid in full first (equalizing absolute gains often favors the smaller claimant in this context).
      *   **Key Question:** What normative principle underlies pro rata? Equal relative loss on *claims* vs. equal relative loss on *feasible recoveries*?

  3.  **Drafting - Step 1: Candidate Readings:**
      *   *Reading 1: Equal Relative Concession on Claims.* The law treats the claim as the normative baseline. Fairness means everyone loses the same percentage of what they were promised.
      *   *Reading 2: Equal Relative Concession on Feasible Maxima (KS).* Fairness means everyone loses the same percentage of what they *could* have gotten given the scarcity.
      *   *Reading 3: Underdetermination/Pragmatism.* The rule is just a focal point for coordination, not deeply principled.

  4.  **Drafting - Step 2: Evaluating Readings:**
      *   *Against Reading 2 (KS):* The law explicitly caps recovery at the claim amount. This suggests the claim is a hard normative limit, not just a bargaining anchor. If KS were the goal, the "claim" would matter less than the "possible recovery." But the law insists you can't get more than you are owed.
      *   *Against Reading 3 (Underdetermination):* While many rules divide money, pro rata is specific. It persists even when claims exceed estates massively. This suggests a commitment to the claim as the denominator.
      *   *For Reading 1 (Claims):* The legal structure defines rights by claims. The estate is insufficient to satisfy rights. The frustration of rights should be equalized relative to the right itself.

  5.  **Drafting - Step 3: Addressing Specific Prompts:**
      *   *View of fairness:* Equal relative sacrifice relative to the *right* (claim), not the *outcome* (feasible max).
      *   *Claim as denominator:* Essential. It reflects the deontological status of the debt obligation.
      *   *Ceiling constraint:* Fits comfortably. The claim sets the ceiling *and* the denominator.
      *   *KS Change:* Would require redefining creditors' rights from "owed amount" to "share of estate." Bankruptcy law resists this because it prioritizes the validity of the debt over the distribution mechanism.

