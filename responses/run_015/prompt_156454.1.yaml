  # JOINT STATEMENT ON THE STRUCTURE OF HARD CHOICES

  **Bottom-Line Claim**
  We agree that hard choices involve a phenomenology of conflict that single-axis metrics fail to capture, and that agents experience persistent regret following such choices. We diverge on the metaphysical and formal status of this conflict: the Irreducible Residue camp maintains that the conflict reflects a genuine limit of rational ordering where value loss is non-compensable, while the Structural Resolution camp maintains that the conflict reflects an underspecified decision model where value loss is eliminable through richer representation.

  ### I. Agreed Claims

  1.  **Phenomenology of Tension:** In hard choices, agents experience a distinct phenomenological state characterized by the inability to identify a single option as uniquely choice-worthy without remainder, regardless of deliberation time.
  2.  **Failure of Single-Axis Metrics:** Monistic evaluative frameworks (e.g., pure cost-benefit analysis or single-utility functions) systematically fail to model the normative force of the competing values involved in hard choices.
  3.  **Persistence of Regret:** Post-decision regret is a robust empirical feature of hard choices; the disagreement lies solely in whether this regret is rationally warranted or merely psychological.
  4.  **Validity of the Dimensional Lock:** Both camps accept the "Dimensional Lock" as a valid formal test case: a scenario involving three evaluation axes (Continuity, Autonomy, Welfare) where options form a cycle such that collapsing them into a single scalar value violates the transitivity of indifference.
  5.  **Normative Significance:** The resolution of hard choices has institutional consequences; treating a hard choice as resolvable versus irreducible alters policy design regarding accountability and compensation.

  ### II. Disagreements Table

  | Feature | Irreducible Residue Camp | Structural Resolution Camp |
  | :--- | :--- | :--- |
  | **Core Thesis** | Incommensurability is ontological; some values cannot be jointly instantiated or traded without normative loss. | Incommensurability is epistemic; it signals a lack of sufficient structural detail in the preference model. |
  | **Status of Conflict** | The conflict is a feature of the world's normative structure; it cannot be modeled away without distortion. | The conflict is a feature of the agent's representation; it can be modeled away via multi-dimensional partial orderings. |
  | **Rational Regret** | Regret is rational and warranted even after an optimal choice, signaling the loss of a distinct value kind. | Regret is irrational once the decision structure is fully specified; optimal choice eliminates normative loss. |
  | **Formal Goal** | To formalize the limits of ordering and the necessity of residue. | To expand the ordering framework until indeterminacy vanishes. |

  ### III. Crux Analysis

  **Crux 1: Framing-Sensitive Preference Reversals**
  *Question:* Do framing-sensitive preference reversals prove incommensurability or merely reveal hidden contextual parameters?

  *   **Irreducible Residue Position:** Reversals prove incommensurability. If preferences shift based on framing without new information, it indicates there is no stable underlying scalar metric to be revealed. The values are context-dependent in a way that precludes a unified ordering.
  *   **Structural Resolution Position:** Reversals reveal hidden contextual parameters. The preference function is stable but high-dimensional; framing activates different constraints or weights within the structural representation. With sufficient parameters, the reversal is predictable and determinate.

  **Crux 2: The Basis of Rational Regret**
  *Question:* Does rational regret require that the unchosen option was genuinely comparable but worse, or only that the decision structure was underdetermined?

  *   **Irreducible Residue Position:** Rational regret does not require the unchosen option to be "worse" on a common scale; it requires that the unchosen option held a value kind that was sacrificed without full compensation. Regret is warranted because the decision structure was *determinate* in its conflict, not underdetermined.
  *   **Structural Resolution Position:** Rational regret is only coherent if the decision structure was underdetermined. If the structure is fully specified (all constraints and dimensions accounted for), the chosen option is all-things-considered better, making regret irrational. Regret signals residual modeling error.

  ### IV. Test Case and Predictions: The Dimensional Lock

  **Case Definition:**
  A hospital administration must select a care protocol among three options (A, B, C) evaluated on three axes: **Continuity** (caregiver consistency), **Autonomy** (patient decision power), and **Welfare** (clinical outcome).
  *   Option A dominates B on Continuity and Autonomy.
  *   Option B dominates C on Autonomy and Welfare.
  *   Option C dominates A on Welfare and Continuity.
  *   **Lock Condition:** Any attempt to assign scalar weights to collapse these axes into a single "Overall Value" metric creates a cyclic preference (A > B > C > A), violating transitivity.

  **Predictions:**

  *   **Irreducible Residue Prediction:**
      *   **Outcome:** No rational choice exists without residue. Whichever option is selected, the agent rationally regrets the loss of the dominating axis of the unchosen option.
      *   **Formal Implication:** The violation of transitivity upon collapse proves that a single metric *cannot* exist. The institution must acknowledge the tragic loss inherent in the choice and establish mechanisms for mourning or compensation rather than optimization.
      *   **Policy:** Implement a "Residue Protocol" where the choice is recorded as a necessary loss, and post-decision review focuses on mitigating the specific value sacrificed (e.g., if Welfare is sacrificed for Autonomy, monitor welfare outcomes specifically).

  *   **Structural Resolution Prediction:**
      *   **Outcome:** A rational choice exists without residue. The cyclic preference indicates the error of scalar collapse, not the impossibility of ordering.
      *   **Formal Implication:** The violation of transitivity proves that a *vector* ordering or lexicographic rule is required. By treating the axes as a constrained partial order rather than a scalar sum, a determinate ranking emerges (e.g., Welfare acts as a constraint threshold before Autonomy is maximized).
      *   **Policy:** Implement a "Resolution Algorithm" that specifies the priority rule (e.g., Welfare > Autonomy > Continuity). Once the rule is applied, the choice is determinate, and regret is classified as a failure to adhere to the institutional priority structure.
