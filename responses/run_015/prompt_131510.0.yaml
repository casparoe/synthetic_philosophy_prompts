answer: |-
  ### Prediction
  She will likely **exclude** the digital nomads from full voting membership, potentially granting them **advisory status** only.

  **Reasoning:**
  This aligns most closely with the **Factory Co-op (Case 3)** and the **Tribal Land Council (Case 7)**.
  *   **From Case 3:** Seasonal workers were excluded from safety votes despite facing *higher* physical risk than permanent staff. The advisor prioritized *organizational tenure* over *intensity of vulnerability*. Digital nomads (3-6 months) map to "seasonal" rather than "long-term."
  *   **From Case 7:** Non-indigenous spouses required **5+ years** of residence to vote on domestic issues. 3-6 months fails this tenure threshold significantly.
  *   **From Case 6:** In the AI case, membership was granted to those whose *labor/data was extracted* (sources), not those who merely *use* the tool. Nomads are consumers of the broadband, not co-authors of its value.

  ### Critique of Your Hypothesized Rules
  You identified two strong candidates, but the existing data actually breaks both of them.

  **1. Rule: "Stable reciprocal vulnerability to authority"**
  *   **The Splitter:** **Case 3 (Factory Co-op).**
  *   **Why:** Seasonal workers are *more* vulnerable to safety protocols than permanent staff (they have less training, less security, higher injury rates). If vulnerability were the rule, they would be included. They were excluded. This proves vulnerability is necessary but not sufficient; it must be coupled with *institutional permanence*.

  **2. Rule: "Embodied capacity to enter local discursive space"**
  *   **The Splitter:** **Case 5 (River-Basin)** and **Case 6 (Digital Commons).**
  *   **Why (Case 5):** Upstream polluters are physically embodied and capable of discourse, yet they are excluded from the downstream demos. Capacity to speak does not grant membership if you are the *source* of the harm rather than the *subject* of the regime.
  *   **Why (Case 6):** People whose text was scraped cannot enter the discursive space of the AI model (they are often anonymous, dispersed, or dead), yet they are granted membership. Discursive capacity is not required if you are the *source of value*.

  ### The Hidden Rule: "Continuity of Co-Responsibility"
  The principle that fits all seven prior cases is not just vulnerability or discourse, but **Continuity of Co-Responsibility for Maintenance.**

  *   **Undocumented (Case 1):** Included because they are *long-term* co-subjects of the housing regime (they sustain the market).
  *   **Future Gens (Case 2):** Given proxy seats because they will inherit the *maintenance burden* of the climate, even if they can't speak now.
  *   **Seasonal Workers (Case 3):** Excluded because they leave before the *long-term maintenance* of the safety culture becomes their burden.
  *   **Upstream Towns (Case 5):** Excluded because they do not share the *downstream maintenance burden* of the water quality; they owe reparations instead.
  *   **Tribal Spouses (Case 7):** Included on domestic issues after 5 years because they have entered the *reproductive cycle* of the household, but excluded on sacred land because they do not share the *ontological burden* of the ancestry.

  **Applied to Nomads:**
  Broadband infrastructure is a long-term debt/maintenance decision. A 3-6 month resident consumes the service but leaves before the infrastructure requires repair, upgrade, or debt servicing. They are **extractors** (like the upstream polluters) rather than **sustainers** (like the undocumented residents or permanent staff).

  ### Underdetermination: What Principle Breaks the Tie?
  The precedents genuinely underdetermine the case if you argue that 3-6 months constitutes "long-term" in a digital context (where turnover is faster than housing). If she **includes** them, she is adopting the principle of **Functional Contribution** (paying consumption taxes and loading the network makes you a stakeholder). If she **excludes** them, she is adopting the principle of **Reproductive Continuity** (you must stay long enough to suffer the obsolescence of the system you vote on).

  Given Case 3 (Seasonal) and Case 7 (5-year threshold), the **Reproductive Continuity** principle is the heavier weight in her jurisprudence.

  ### The Sharpest Further Test Case
  To definitively separate **Vulnerability** (your Rule 1) from **Continuity/Tenure** (the Hidden Rule), you need a case where Vulnerability is High, but Tenure is Ambiguous.

  **The Case:** **"The 10-Year Temp."**
  A worker in the Factory Co-op (Case 3) who has been employed on rolling 6-month contracts for **10 years**. They are more vulnerable than new permanent staff (no job security), they have high discursive capacity, but they lack formal "permanent" status.

  *   **If she Includes them:** Her rule is **De Facto Tenure**. (Time served matters more than contract status). This would suggest Digital Nomads *might* be included if they return to the city repeatedly.
  *   **If she Excludes them:** Her rule is **Institutional Membership**. (Formal status matters more than time served). This confirms Digital Nomads are excluded because they lack a lease/citizenship contract.

  **To separate Discourse (your Rule 2) from Co-Authorship (Hidden Rule):**

  **The Case:** **"The Comatose Heir."**
  A permanent resident of the city (10+ years) who is permanently incapacitated (cannot enter discursive space) vs. The Digital Nomad (fully capable of discourse).

  *   **If she Includes the Heir (via guardian):** **Status/Tenure** trumps Discourse. (Consistent with Case 2 proxies).
  *   **If she Excludes the Heir:** **Discourse** is a hard requirement. (This would contradict Case 2, making it a bad test).

  **Best Test:** The **10-Year Temp**. It directly attacks the logic of Case 3 (Seasonal Worker) which is the strongest precedent against the Nomads. If the Temp gets a vote, the Nomad might too (if they can prove recurring presence). If the Temp is out, the Nomad is definitely out.
