          *   Argument: Reliability doesn't require the object to cause the belief, only a common cause.
          *   Therefore, reports aren't unreliable by default. They are reliable indicators, just not causal effects of the qualia.
      *   **Section 3: Clinical Introspection:**
          *   Shift from "causal efficacy" to "informational fidelity."
          *   Therapeutic utility remains because the report correlates with the neural/phenomenal state.
          *   The "feeling" is the *content* of the report, not the *cause*.
      *   **Section 4: The Middle Ground (Isomorphic Calibration):**
          *   The "Common Cause" model.
