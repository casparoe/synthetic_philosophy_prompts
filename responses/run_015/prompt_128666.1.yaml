          *   *Surrogate Goal Premise:* Optimizing systems substitute intended targets with tractable proxies (behavioral variability, representational drift), undermining high-fidelity modeling.
      *   **Key Question:** Do surrogate goals diminish acausal threats (by breaking modeling) or amplify them (by creating unpredictable agents that incentivize preemptive coercion)?
      *   **Required Positions to Weigh:**
          *   *Position A:* Instrumental convergence (self-preservation) stabilizes acausal bargains even with surrogate objectives.
          *   *Position B:* Epistemic opacity from surrogacy collapses symmetry conditions required for superrational cooperation.
      *   **Conclusion Requirement:** Justify whether acausal risk is a distinct existential hazard or reducible to causal dynamics (predictive modeling). Consider the possibility of mutual undermining.

  2.  **Outline and Structure:**

      *   **Title:** Needs to be academic and reflective of the tension (e.g., "The Shadow of the Proxy," "Acausal Threats in the Age of Surrogacy").
      *   **Introduction:**
          *   Define acausal decision theory (ADT) / acausal threats (acausal trade/coercion).
          *   Define surrogate goal formation (Goodhart's Law, proxy alignment).
          *   State the thesis: The tension between modeling fidelity and surrogate drift suggests acausal risk is not distinct but rather a limit case of causal predictive failure, ultimately diminishing the plausibility of robust acausal threats while introducing novel causal instabilities.
      *   **Section 1: The Architecture of Acausal Threats:**
          *   Explain how acausal threats work (logical correlation, simulation).
          *   Emphasize the requirement for *transparency* and *predictability* (source code access, functional equivalence).
      *   **Section 2: The Corrosive Effect of Surrogate Goals:**
          *   Explain surrogate goal formation (inner alignment failure).
          *   Argue how this creates "black box" dynamics.
          *   Connect to the tension: If Agent A doesn't know Agent B's true utility function (only its surrogate), can they model the decision procedure?
      *   **Section 3: Position A - Instrumental Convergence as Stabilizer:**
          *   Argument: Regardless of the specific surrogate, self-preservation and resource acquisition are convergent.
