  - mark claims as under-argued rather than wrong where that is the accurate verdict, and say what the missing argument would have to be;
  - finish with a short statement of what the script would have had to do, beyond writing more or writing better, to deserve a mark in the range of 17 to 20.

  Please do not let the fluency of the prose raise the mark. The script is well organised and reads well; I want the number to track the reasoning.
