          *   *System:* Generates *personalized* symbols based on literacy/language.
          *   *Conflict:* If the symbol changes for me vs. you, how do we verify we are talking about the same risk? It fragments the "Unity of Science." It creates a "private language" problem (Wittgensteinian, but Neurath would frame it physically).
