answer: |-
  The tension isn't a contradiction; it's the engine of Machiavellian action. The river metaphor doesn't promise you can stop the flood (fortune's half), only that you can mitigate the damage (your half). Building dikes during calm weather is *virtù*—foresight that expands your agency. That hedge ("perhaps a little less") suggests *virtù* can occasionally exceed the 50% mark, but never fully neutralize fortune.

  However, the "spirit of the times" complicates the dike. A dike is static; fortune is dynamic. If the river changes course, your preparation becomes a trap. They pull apart where preparation meets unpredictability: you can build for known risks, but not radical shifts. Machiavelli isn't giving you a formula for control, but a mandate for engagement. You must build the dike because doing nothing guarantees destruction, even if the times might shift so violently that the dike fails.

  So, they work together like this: The "half" claim establishes the stake (agency exists). The river metaphor shows the method (preparation). The "times" argument provides the limit (adaptability). The tension remains because *virtù* cannot guarantee success against radical shifts in fortune, but abandoning *virtù* guarantees failure. Machiavelli isn't offering security; he's offering the only viable gamble. You build the dike knowing the flood might still break it, because the alternative is drowning without a fight. The "half" is the space where you act; the "times" are the warning that your action might become obsolete. You must build, but be ready to rebuild.
