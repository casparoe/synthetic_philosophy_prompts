  ### Brainstorming Refrain Pairs

  1.  **"The future is a place I have been" / "The past is a place I will be."**
      *   *Survival:* Low. These are complementary statements, not the same sentence reversed. They risk sounding like distinct claims rather than two views of one loop, weakening the final quatrain's collapse into identity.

  2.  **"I will have been where I begin" / "Where I begin, I will have been."**
      *   *Survival:* Medium. Syntactically perfect inversion, but "begin/been" is a slant rhyme that won't hold nineteen returns in a strict villanelle. The ear would start rejecting the pairing by the third tercet.

  3.  **"What is gone is only somewhere else" / "Somewhere else is only what is gone."**
      *   *Survival:* High on meaning, zero on form. "Else/gone" does not rhyme. To make this work, I'd have to break the villanelle rhyme scheme, which violates the "proper villanelle" constraint.

  4.  **"What will be has already begun" / "What has begun is what will be done."**
      *   *Survival:* High. "Begun/done" is a perfect rhyme. The syntax is chiastic (A is B / B is A), capturing the temporal reversal. It accrues weight: "begun" implies origin, "done" implies fate, and together they imply a closed circle.

