prompt: |-
  I'm putting together a casebook for my comparative-politics course and I'm trying to pin down the grading rubrick my advisor Dr. Lena Voss actually uses, because she's kind of idiosyncratic about what counts as democratic backsliding versus other kinds of democratic trouble. Her verdicts so far: Hungary 2011-2014 (Fundamental Law, court-packing, media council capture) -> yes, textbook backsliding. Poland 2015-2018 (judicial disciplinary chamber, constitutional tribunal capture) -> yes. Turkey post-2016 (state of emergency, presidential-system referendum, civil-service purges) -> yes. The US in 2020-2021 (January 6, state-level election-subversion bills, direct pressure on election officials) -> she insists this is NOT backsliding, more like an acute democratic rupture that failed, not the gradual legal erosion the concept should track. Israel 2023 (reasonableness law, judicial-overhaul package, mass protests, eventually struck down by the Supreme Court and partly reversed) -> she marks it yes, backsliding in progress, even though the court blocked the core measure and the government retreated. Brazil 2022 (Bolsonaro's refusal to concede, January 8 riots, military flirtation, but ultimately peaceful transfer of power) -> no, same 'failed rupture' bucket as the US.

  The new proposal on her desk is this: a parliamentary government with a solid majority passes a bill dissolving the independent electoral commission and replacing its members with parliamentary appointees. The president vetoes it, the legislature overrides with a two-thirds vote, but the constitutional court strikes the law down within three weeks. The government immediately complies, reinstates the old commission, and the next election proceeds on schedule with no reported irregularities. There's no sustained protest wave, no purges, just one legislative push and a quick reversal.

  If she wants to stay consistent, what's the call? I want you to lay out the competing rules that could explain her track record — I think there's at least one that cares whether formal democratic architecture was legally altered, and another that cares whether the capture actually stuck and produced sustained institutional damage. Predict what each rule says about this new case. Which precedent is the closest analog — Israel, because there was a legal push followed by judicial reversal, or Brazil/US because the institutional order ultimately held? Give me your best guess at her verdict, but be honest about where the ambiguity is real. And if our precedents genuinely underdetermine it, spell out what principle she'd be adopting either way. Also tell me exactly what kind of future case or argument would change your mind about which rule she's running — I'm especially worried I'm overfitting her Israel call because she was emotionally invested in the protests, and I want to know where my reasoning is most likely to fail.
