          1.  Common Knowledge of Rationality (CKR) + Common Knowledge of Game $\rightarrow$ Backward Induction (Centipede).
          2.  Common Prior + Common Knowledge of Differing Posteriors $\rightarrow$ Impossible (Aumann's Agreement Theorem).
          3.  Email Game (Rubinstein): Finite depth $k$ common knowledge $\neq$ Genuine Common Knowledge (discontinuity).
      *   **Requirements:**
          1.  Provide an explicit Translation Key (Player, Information Set, Belief, CKR nature, Safety/Liveness classification).
          2.  For each result: Translate, then analyze if it collapses into existing FTDS concepts or adds new content.
          3.  Residue Report: What had to be distorted? What has no expression? Is this a defect in the vocabulary or a sign EGT is doing less work?

  2.  **Deconstruct the Vocabulary Mapping (Translation Key):**
      *   *Player* $\rightarrow$ Process/Node.
      *   *Game* $\rightarrow$ Protocol/Algorithm + Environment Model.
      *   *Information Set* $\rightarrow$ Local State (history of messages received + local clock/round).
      *   *Belief* $\rightarrow$ Knowledge state derived from local view + system model assumptions (e.g., "at most $f$ failures"). In FTDS, we usually talk about *knowledge* (S5 modal logic) rather than probabilistic *belief*, but Bayesian belief maps to probability distributions over initial configurations/adversary strategies.
      *   *Rationality* $\rightarrow$ Correct adherence to protocol specification (Non-Byzantine behavior).
      *   *Common Knowledge (CK)* $\rightarrow$ Simultaneous Coordination condition (requires simultaneous consensus).
      *   *CKR* $\rightarrow$ Common Knowledge that all non-faulty processes follow the protocol.
      *   *Safety/Liveness:* CK is generally a safety property on the *system state* (if we view it as "everyone knows X"), but achieving it is often impossible (liveness failure). CKR as an assumption is a constraint on the set of admissible runs.

  3.  **Translate the Three Results:**

      *   **Result 1: CKR + CK of Game $\rightarrow$ Backward Induction.**
          *   *FTDS Translation:* If all processes commonly know the protocol specification and commonly know that everyone follows it, then in a finite-round protocol with sequential decision points, the output is determined by the last round's optimal action propagated backward.
          *   *Analysis:* This looks like deterministic protocol execution. If everyone follows the code, the output is fixed. The "backward induction" part is just tracing the logic of the code.
          *   *Collapse:* It collapses into "Correct Protocol Execution." The "Centipede" paradox (stopping early) doesn't really exist in standard FTDS because processes don't have utility functions to deviate from; they just follow code. If they are Byzantine, CKR is false.

      *   **Result 2: Common Prior $\rightarrow$ No CK of Differing Posteriors (Aumann).**
          *   *FTDS Translation:* If processes share a common probability distribution over initial states and failure patterns (Common Prior), they cannot reach a state where it is common knowledge that they have decided on different values (Agreement).
          *   *Analysis:* This is essentially the *Agreement Property* of Consensus. If they commonly know they decided differently, safety is violated.
          *   *Collapse:* This collapses directly into the Safety property of Consensus. Aumann's theorem is the probabilistic epistemic underpinning of "Agreement."

      *   **Result 3: Email Game (Finite $k$ vs. CK).**
          *   *FTDS Translation:* In asynchronous systems with message loss (Coordinated Attack), $k$ rounds of acknowledgment (depth $k$ knowledge) does not approximate Common Knowledge. Coordination success probability does not converge continuously to the CK case as $k \rightarrow \infty$.
          *   *Analysis:* This is the classic Coordinated Attack Problem / FLP flavor.
          *   *Collapse:* This is already core FTDS theory. "Common knowledge is unattainable in asynchronous systems with failures." The discontinuity is the gap between $k$-level knowledge and CK.

  4.  **Drafting the Residue Report (The Core Insight):**
      *   *Distortions:*
          *   *Rationality:* In EGT, rationality is maximizing utility. In FTDS, it's following code. I had to equate "Rational" with "Non-Byzantine/Correct."
          *   *Common Prior:* In FTDS, we usually assume an Adversary (worst-case), not a Probability Distribution. Mapping Prior to "System Model" loses the Bayesian aspect.
          *   *Counterfactuals:* EGT relies heavily on "what would I do if..." (off-equilibrium path). FTDS protocols are engineered to handle off-nominal paths via exception handling, not counterfactual reasoning about utility.
      *   *Missing Expressions:*
          *   *Strategic Deviation:* FTDS assumes correct nodes *cannot* deviate (code is law). EGT assumes nodes *will not* deviate if it hurts utility. This is the gap between Mechanism Design/Byzantine Fault Tolerance and pure FTDS.
          *   *Fixed Point:* CKR in EGT is a logical fixed point. In FTDS, "correctness" is an invariant proved by induction, not a mutual attribution of mental states.
      *   *Defect vs. Less Work:*
          *   Is it a defect? Yes, if we want to model Rational Faults (Barbera et al., A-FTS). Standard FTDS vocabulary ignores incentives.
          *   Is EGT doing less work? Often, EGT results like Backward Induction rely on logical omniscience that distributed processes don't have. The "work" is often hiding the computational complexity of deriving the equilibrium.

