      *   *Correction:* CKR is an assumption on the set of runs (a constraint). It's not a property the protocol achieves; it's a precondition. The *result* (Backward Induction) is a Safety property (the output is fixed).
      *   *Check:* Is Aumann's theorem just Consensus Agreement?
      *   *Correction:* It's stronger. It says you can't even *know* you disagree. In Consensus, you just can't *decide* differently. But in FTDS, "deciding" is the only observable action, so they align closely.
      *   *Check:* The Email Game.
      *   *Correction:* Make sure to link this explicitly to the Coordinated Attack Problem and the impossibility of achieving Common Knowledge in asynchronous systems with failures (Halpern & Moses).

  7.  **Final Polish:** Organize into the requested sections: Translation Key, The Three Translations, Residue Report. Ensure the "Residue" section is the highlight, addressing the philosophical gap between *incentive compatibility* and *fault tolerance*.

  **(Self-Correction on "Rationality"):** In FTDS, "Rationality" is best mapped to "Protocol Compliance." However, the prompt asks about "Common Knowledge of Rationality." In FTDS, we usually assume "Common Knowledge of the Protocol." If a process is faulty, it's not "irrational," it's "faulty." To map EGT Rationality, I need to treat it as "Non-Byzantine Behavior." But EGT rationality implies *choice*. FTDS correct processes have *no choice*. This is a major residue point. I must highlight that EGT rationality is about *constrained choice*, whereas FTDS correctness is about *constrained execution*.

  **(Self-Correction on "Common Prior"):** In FTDS, we often talk about "System Assumptions" (e.g., $f < n/3$). A Common Prior is a probability distribution over these assumptions. This shifts the model from Worst-Case (Adversarial) to Average-Case (Probabilistic). This is a significant distortion.

