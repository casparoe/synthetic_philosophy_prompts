  You've built a clever trap, but you're misunderstanding how entrenchment transfers. It's not Lego logic; you don't get to snap together entrenched bricks like "green" and "examined" and claim the new structure inherits their stability. Entrenchment is a historical biography of the predicate *itself*, not a sum of its semantic parts. If arbitrary Boolean combinations inherited entrenchment, I could reconstruct "grue" using "green", "blue", and "before-t"—all deeply entrenched—and claim parity. Goodman blocks this precisely because the predicate "grue" (or your "greck") lacks its own track record of successful projection. The "parentage" rule applies to specific hierarchical relations or co-extensive synonyms, not to novel disjunctions constructed to generate conflict.

  So, what's wrong with someone projecting "greck" today? Nothing logically fatal, but everything practically irrational. When "all emeralds are green" and "all emeralds are greck" conflict on unexamined instances, we weigh their relative entrenchment. "Green" has centuries of inductive wins; "greck" has zero. The fact that "greck" is built from familiar vocabulary is irrelevant to its inductive weight. We reject it not because it carves nature at the joints, but because it violates the conservative principle of minimizing disruption to our established system of projections. You want a metaphysical reason why "green" wins; I'm giving you a sociological one. It wins because it's the habit we already have, and "greck" is a habit we'd have to build from scratch against the grain of existing practice.
