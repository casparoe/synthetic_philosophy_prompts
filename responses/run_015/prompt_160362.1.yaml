answer: |-
  This is sharp. You've managed to condense the "Probability Problem" and the "Future Similarity Objection" into a cohesive critique without getting bogged down in the usual metaphysical weeds. The "warehouse/catalog" metaphor is doing a lot of heavy lifting, and it works.

  Here are the answers to your specific questions, in order.

  **1. Where is Lewis wrong? (Counterpart Theory & Similarity)**
  Your instinct on Counterpart Theory (CT) is slightly off, which actually saves Lewis on consequence (a) but leaves him exposed on consequence (b).

  For *de re* counterfactuals ("If *I* had raised my hand..."), CT blocks the cheap world move. A world where a duplicate of you exists in the boondocks and raises *their* hand, while your actual counterpart (you-in-this-world) does nothing, does not satisfy the antecedent. The antecedent requires a world where your *counterpart* performs the action. To get that, you usually need a local divergence (a small miracle or different initial conditions) affecting *your* causal history. So CT protects the semantics for personal counterfactuals.

  However, for *de dicto* counterfactuals ("If a hand had been raised..."), your objection holds. A cheap world where a hand goes up in Andromeda is indeed more similar to actuality than a world where a miracle makes a hand go up here. Lewis bites this bullet by arguing that we weight "miracles" (law violations) heavier than "spatiotemporal mismatch" in our similarity metric. He explicitly argues this in *Counterfactual Dependence and Time's Arrow*. He isn't wrong about the cheap worlds existing; he's wrong (arguably) about the weighting of similarity criteria. He stipulates the weights to save the semantics, which looks ad hoc.

  **2. The Strongest Sympathetic Lewisian Reply**
  "The objection conflates modality with chance. Modal realism is a thesis about the *domain* of quantification, not a frequency space for probability. Lewis does not derive chance from counting worlds; he derives it from the Best System Analysis *within* a world. The 'measure problem' only arises if you think objective chance is a ratio of world-counts, which a Humean Supervenientist denies. For decision theory, we don't weight worlds; we weight outcomes within our world by their chance, which supervenes on the local Humean mosaic. The 'cheap worlds' are ontologically real but probabilistically inert; they are part of the plurality, but they do not dilute the chance of events here because chance is not a global measure over the plurality. You are asking for a measure over the library when the theory only claims the books exist."

  **3. Is any of this new?**
  You have effectively reheated the **"Probability Problem"** (Lewis addresses this in *On the Plurality of Worlds*, Section 7.4) and combined it with the **"Future Similarity Objection"** (raised by Kit Fine and Adam Elga).
  The specific move of arguing that Recombination creates "cheap" duplicates that swamp the measure is a known variant of the cardinality objection, often discussed in the context of **Haecceitism**. Lewis is a Haecceitist (he counts qualitatively identical worlds with swapped individuals as distinct); your quotient proposal is an argument for **Qualitative Supervenience**. The "warehouse/catalog" line is a fresh phrasing of the objection that concrete modal realism buys ontology it doesn't use.

  **4. Is the quotient proposal dead?**
  Yes, but not just because of the continuum. It's dead because it requires Lewis to abandon Haecceitism, which is the very feature that allows him to defeat ersatzism. If worlds are individuated by qualitative character, the ersatzist can model them using maximally consistent sets of propositions. Lewis needs the concrete *this-ness* of worlds to claim he has more expressive power than the ersatzist. By quotienting, you collapse Modal Realism back into a sophisticated Ersatzism. You solve the measure problem by sacrificing the primary motivation for the theory. The continuum issue is mathematical; the Haecceitism issue is fatal to the Lewisian project.

  **5. Prose Notes**
  *   **Cosmology/Anthropics Aside:** Keep it. It signals to the reader that this isn't just scholastic metaphysics; it breaks physics and decision theory too. It raises the stakes.
  *   **Warehouse/Catalog Line:** It is not too cute. It is the strongest sentence in the piece. It crystallizes the cost-benefit analysis failure perfectly.
  *   **General:** The parenthetical about "islands vs. worlds" is necessary pedantry and well-placed. The transition from counterfactuals to measure is smooth.

  **Final Verdict:**
  You are right that the "purchase and the price are the same object." That is a damning formulation. The draft is ready. The only vulnerability is if a Lewisian insists that chance is entirely internal to worlds (as per reply #2), rendering the measure objection category error. You anticipate this slightly in the "application layer is unfunded" line, but you might want to explicitly concede that Lewis *denies* we need a global measure, while arguing he *should* need one for the theory to be useful to agents *in* the worlds.

  Post it.
