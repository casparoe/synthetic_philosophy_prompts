      *(Self-Correction during drafting)*: I need to be careful not to simply side with the realist. The expressivist (e.g., Gibbard, Schroeder) has responses. I must present the *structural* tension. The expressivist might say the Tower is handled by the same logic of planning. The realist says planning logic *is* truth-conditional logic in disguise. The Tower makes the disguise harder to maintain.

