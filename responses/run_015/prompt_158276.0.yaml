      *   **The Standoff:** Expressivists (Quasi-Realists) offer technical solutions (higher-order attitudes, plans, etc.) claiming the problem is solved. Realists/Critics claim these solutions either collapse into realism (assign truth-conditions) or confuse psychology with logic.
      *   **Specific Focus:** The "Tower Problem" (iterated embedding of moral predicates within attitude reports which are themselves morally evaluated).
      *   **Two Strategies Identified:**
          1.  *Attitude-Inheritance:* Complex sentences express attitudes toward attitudes expressed by parts (iterating the relation).
          2.  *Content-Inheritance:* Embedded occurrences contribute content; the whole sentence takes an attitude toward that content (composing attitudes around fixed content).
      *   **User's Hypothesis:** The dispute isn't about *whether* inferences can be validated, but about *what counts as an answer* (compositional account of states vs. truth-conditions). It might be verbal (semantics, representation) or a second-order disagreement about the theory of meaning.
      *   **Tasks:**
          1.  Engage directly with the Tower Problem (does it add anything to standard F-G?).
          2.  Diagnose which parts of the dispute are verbal vs. genuine.
          3.  Use actual commitments of each side.
          4.  Define what would count as progress (formal result, distinction, etc.).
          5.  **Constraint:** Answer in British English.
          6.  **Constraint:** No literature survey/reading list.

  2.  **Deconstruct the "Tower Problem":**
      *   *Standard F-G:* "Stealing is wrong" (A) vs. "If stealing is wrong, then lying is wrong" (If A then B). How does 'A' contribute the same thing in both?
      *   *Tower Problem:* $M(p)$ vs. $M(Believes(x, M(p)))$ vs. $M(Believes(y, M(Believes(x, M(p)))))$.
      *   *Why it matters:* It tests the limits of the "attitude" ontology. If expressivism says moral sentences express non-cognitive attitudes (NCA), what does a sentence *about* someone having that NCA express? And what does a sentence morally evaluating *that* state express?
      *   *Attitude-Inheritance:* $M(p)$ = Attitude $A$ toward $p$. $M(Believes(x, M(p)))$ = Attitude $A$ toward (Believes $x$ toward $p$). This risks an explosion of attitude types or a loss of distinction between the moral operator and the psychological report.
      *   *Content-Inheritance:* $M(p)$ = Attitude $A$ toward Content $C$. $M(Believes(x, M(p)))$ = Attitude $A$ toward Content $C'$. This looks suspiciously like realism because $C$ needs to be stable across embeddings, suggesting $M(p)$ has a propositional content independent of the attitude.

  3.  **Evaluate the User's Hypothesis:**
      *   Is it just about what counts as an explanation? Yes, largely.
      *   Is it verbal? Partly (definitions of 'semantics', 'truth-conditional').
      *   Is it genuine? Yes (metaphysical commitment to propositional contents vs. psychological states).
      *   Does the Tower add anything? Yes, it stresses the *ontology* of the expressivist's "contents" or "attitudes" more than the standard case. The standard case can be handled by logic of consistency (Gibbard). The Tower case forces the question: Is the object of the higher-order moral judgment a *proposition* or a *psychological state*?

  4.  **Drafting the Diagnosis (Section by Section):**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the feeling of stagnation. State the thesis: The Tower Problem exposes the metaphysical cost of the "Content-Inheritance" strategy, forcing a choice between collapsing into realism or accepting a fragmented logic. The dispute is partly verbal but grounded in a genuine metaphysical divergence regarding the *objects* of normative judgment.

      *   **The Tower Problem vs. Standard F-G:**
          *   Standard F-G is about *logic* (validity preservation).
          *   Tower is about *ontology* (what are we talking about?).
          *   In standard F-G, expressivists can say "It's about consistency of plans."
          *   In Tower, we have moral judgments *about* moral judgments (or beliefs about them).
          *   *Attitude-Inheritance:* Leads to type-proliferation. Is the attitude toward "stealing is wrong" the same *type* as the attitude toward "Ben believing stealing is wrong"? If yes, how do we distinguish the object? If no, we lose compositionality.
          *   *Content-Inheritance:* Requires the embedded clause to have a content stable enough to be the object of a higher-order attitude. If that content is truth-apt, realism wins. If it's not, what is the higher-order attitude directed at?
          *   *Verdict:* The Tower sharpens the "collapse" objection. It makes it harder to hide the propositional structure required for iteration.

      *   **Verbal vs. Genuine Disagreement:**
          *   *Verbal:* Definitions of 'semantics'. Expressivists say "semantics maps sentences to mental states." Realists say "semantics maps sentences to truth-conditions." This is a terminological stalemate.
          *   *Genuine:* The nature of logical validity. Realists say validity is truth-preservation. Expressivists say validity is inconsistency-avoidance (in attitudes/plans). This is a substantive disagreement about the philosophy of logic.
          *   *Genuine:* Metaphysics of content. Can there be content without truth conditions? The Tower forces expressivists to specify the "content" of the embedded clause. If it's just a label for an attitude, the higher-order judgment looks empty.

      *   **Diagnosing the Strategies:**
          *   *Attitude-Inheritance:* Struggles with the Tower because it requires an infinite hierarchy of attitude types or a single attitude type that can take *anything* as an object (which looks like a propositional attitude).
          *   *Content-Inheritance:* Struggles because it grants the realist's main point: that moral sentences function as propositional constituents. The expressivist must explain why this "content" isn't truth-conditional.

      *   **What Counts as Progress?**
          *   Not another logic system (we have many).
          *   Not another definition of 'truth'.
          *   *Progress:* A clear articulation of the *cost* of the Content-Inheritance strategy. If expressivism requires a propositional semantics to handle the Tower, does it matter if they call it "truth"?
          *   *Concrete Proposal:* The "Metasemantic Turn." Stop arguing about semantics (the map) and argue about metasemantics (what fixes the map). If the expressivist can explain *why* we use truth-conditional structures without believing in moral facts, that's progress.
          *   *Alternative:* Accepting a hybrid view or acknowledging that the "pure" expressivist project is untenable at the Tower level.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I address the "Attitude-Inheritance" vs "Content-Inheritance" distinction specifically?
      *   *Correction:* Ensure I explicitly analyse how the Tower breaks Attitude-Inheritance (type proliferation) and Content-Inheritance (realist collapse).
      *   *Check:* British English spelling (analyse, colour, programme, etc.).
      *   *Check:* Tone. Needs to be academic, direct, critical, but helpful for a Master's student. Avoid patronising.
      *   *Key Insight:* The Tower Problem reveals that *iteration* requires *objects*. If you iterate moral operators, you need objects for them to operate on. If those objects are attitudes, you need attitudes toward attitudes. If those objects are contents, you need contents. The expressivist wants contents without truth-conditions. The Tower suggests that *content* just *is* truth-conditional potential.

  6.  **Final Polish:**
      *   Structure:
          1.  Diagnosis of the Standoff.
          2.  The Specific Contribution of the Tower Problem.
          3.  Verbal vs. Substantive Disagreement.
          4.  Criteria for Progress.
      *   Ensure the distinction between "logic" (validity) and "semantics" (meaning) is clear.
      *   Make sure to answer the specific question: "Does the Tower raise anything the ordinary F-G doesn't?" (Yes: Ontological commitment to iterable objects).

  7.  **Drafting the Content (incorporating British English):**
