  **Translations**

  (i) Perfect analysis (zero initial-condition error) plus perfect model (zero model error, exact parametrisation) yields a unique trajectory for the state vector at all lead times.
  (ii) Positive Lyapunov exponents ensure initial-condition error grows exponentially until ensemble spread matches climatology variance, rendering the specific trajectory unskillful beyond a characteristic lead time.
  (iii) Skillful verification of climatology is compatible with stochastic parametrisations (intrinsic noise) rather than purely deterministic dynamics.
  (iv) [Bend required] Unresolved scale error or stochastic parametrisation implies the resolved state vector does not uniquely fix the future trajectory, allowing for unmodelled interventions. (Note: NWP vocabulary lacks "agency").
  (v) Even with zero model error, no analytical solution maps initial condition to future state; numerical integration over discrete time steps is required to evolve the state vector.

  **Residue Report: Traditional NWP**

  Claims (i), (ii), (iii), and (v) have exact counterparts. They describe the operational limits of NWP: perfect model experiments, error growth rates, climate versus weather skill, and the necessity of numerical integration. Claim (iv) cannot be expressed. NWP vocabulary describes system evolution, not causation by agents. This is a defect in the vocabulary's scope, not the claim's content.

  The phrase "in principle" maps to "Perfect Model/IC" experiments. It distinguishes the predictability limit imposed by chaos (intrinsic) from limits imposed by model fidelity or observation density (practical). It has content: it defines the horizon of the deterministic component separate from operational constraints.

  **Residue Report: ML Context**

  With ML models (fitted functions, no explicit state variables or equations of motion):

  Claim (i) loses subject matter. There are no "laws" (equations of motion), only weights mapping fields to fields. "State of the world" becomes "input field". Determinism becomes "functional consistency". Claims (ii) and (iii) hold; ML models still exhibit error growth and verify well against climatology. Claim (v) changes; ML is an emulator, often allowing larger time steps, but remains iterative.

  Does determinism survive? Only instrumentally. A forecaster cannot assert the *weather* is deterministic, only that the *model mapping* is function-like. If the model is the only reality accessed, the distinction between deterministic chaos and stochastic process blurs. The claim loses its ontological weight.

  This is an interesting finding about determinism, not merely forecasting. Determinism relies on a "state-plus-law" ontology. Without explicit physics, determinism reduces to "does the same input yield the same output?" which is a property of the code, not the atmosphere. Forecasting has become purely phenomenological. The distinction between determinism and predictability collapses into the distinction between the model's architecture and its verification skill. If the best model is a black box, asserting determinism about the weather is asserting nothing about the weather, only about the tool.
