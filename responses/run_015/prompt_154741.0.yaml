  **Opening Remarks: The Architecture of Harm**

  Good morning. It is an honor to welcome you to this workshop on collective harm. Looking around this room, I see a productive tension. We have public health researchers who measure suffering in population-attributable fractions and confidence intervals. And we have philosophers who measure suffering in intuitions, duties, and the logical consistency of our moral principles. Usually, these two groups speak past one another. Today, I hope we speak to one another.

  To bridge that gap, I want to begin with a thought experiment many of you will recognize, though perhaps under different names. It is the comparison between torturing one person for a year, and distributing a tiny irritation—like a dust speck in the eye—to an enormous number of people.

  The standard philosophical debate asks: Does the math aggregate? If enough people get a dust speck, does the sum total of pain outweigh the torture? Utilitarians say yes; intuition often screams no. But I want to suggest that both sides are missing a structural variable. They are treating the dust specks as discrete, countable transactions. Person A gets a speck. Person B gets a speck. It is a ledger of individual injuries.

  But much of the collective harm we are gathered to discuss does not look like a ledger. It looks like a atmosphere.

  Consider the difference between a dust speck and low-grade air pollution. A dust speck is an event; pollution is a condition. In the dust speck scenario, every victim can identify the moment they were harmed. In the pollution scenario, the harm is ambient. It is a shift in the baseline. No single person can point to a specific cough and say, "That was the injury." The harm is continuous, shared, and structurally invisible to the individual experiencing it.

  This distinction between *discrete* and *ambient* harm is not just semantic; it is moral architecture.

  For my colleagues in public health, this is familiar terrain. You deal with the "slow violence" of climate change, of institutional negligence, of heat islands and noise floors. You know that a degree of warming does not kill people in a way that fits neatly into a coroner's report. It degrades the system in which survival is possible. But for the philosophers in the room, I ask you to consider: Does our moral intuition that "torture is uniquely wrong" survive only because torture is targeted? Torture is a spike in the graph. It is discontinuous. It singles out a victim.

  If we imagine a society where everyone lives under a low-level, inescapable psychological pressure—a ambient terror rather than a targeted interrogation—our standard tools for condemning torture might falter. We struggle to condemn the shift in the baseline because there is no specific perpetrator to blame for a specific injury. The harm is democratized, and therefore, it becomes politically and morally ghostly.

  This is the work of this workshop. We need to determine if ambient harm is simply a large sum of discrete micro-harms, or if it constitutes a different category of wrong entirely.

  If it is the latter, then our policies for climate damage, for algorithmic bias, for urban planning, cannot simply be about minimizing the sum of individual complaints. They must be about protecting the integrity of the baseline itself. We cannot treat a warming planet as a billion individual sunburns. We must treat it as the erosion of the ground we stand on.

  So, as we begin, I invite the philosophers to test whether your ethical frameworks break when the victim is "everyone" and the injury is "background noise." And I invite the public health researchers to challenge us to find the vocabulary for harms that are statistically significant but experientially invisible.

  Let us not just count the dust specks. Let us examine the air they float in.

  Thank you.

  ***

  ### Confidence Assessment

  I am **moderately confident** in the utility of this framing for your specific audience, but **less confident** in its philosophical robustness.

  **Why it works for the audience:**
  For the public health researchers, this validates their lived experience of "population risk" versus "clinical cases." It gives them permission to treat environmental degradation as a distinct moral category rather than just a big spreadsheet of individual symptoms. For the philosophers, it offers a fresh angle on a tired thought experiment (Parfit's "Five Hundred Years of Torture" vs. "Myriad of Minor Pains") without requiring them to abandon their technical frameworks. It moves the debate from *aggregation* to *ontology*.

  **The Weakest Link:**
  The specific claim I am least sure holds up is the assertion that **continuous ambient harm is *morally different* from aggregated discrete harm, rather than just *epistemically* different.**

  From a strict utilitarian or consequentialist perspective, a billion people suffering a micro-harm simultaneously due to a shared ambient condition is mathematically identical to a billion people suffering that micro-harm sequentially due to discrete events. A hard-line aggregator in the philosophy cohort might argue that the "ambient" label is merely a description of how the harm is delivered, not a change in the moral weight of the suffering itself. They may argue that distinguishing the two risks "moral magic"—trying to make the harm disappear or change value simply by changing its distribution pattern.

  While the distinction is pragmatically vital for policy and law (as it changes how we assign liability and remediation), defending it as a fundamental *moral* distinction requires navigating complex debates in non-aggregative ethics that some philosophers may reject. I have framed the speech to suggest this is an open question for the workshop to solve, which protects you if that claim is challenged during the Q&A.
