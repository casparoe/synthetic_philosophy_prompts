answer: |-
  # Joint Statement on Affective Partial Zombies and the Conceivability Argument

  **Participating Parties:** Camp A (Non-Physicalist) and Camp B (Physicalist)
  **Subject:** The metaphysical status of affective phenomenal character in physically and functionally identical systems.

  ## 1. Agreed Claims

  Both camps affirm the following propositions as the common ground for this collaboration:

  1.  **Definition of the Affective Partial Zombie (APZ):** An APZ is defined as a being that is a microphysical and functional duplicate of a normal human being, possessing identical sensory-phenomenal experiences (e.g., the visual experience of red, the auditory experience of a tone) and identical cognitive-functional organization (belief formation, reasoning, behavioral output), but lacking *affective phenomenal character*. Specifically, the APZ lacks the felt negative valence of pain, the felt positive valence of pleasure, and the emotional "feel" of states like fear or anger, while retaining the discriminatory and motivational behaviors associated with them.
  2.  **Logical Form of the Conceivability Argument:** Both camps agree that the argument under discussion follows this structure:
      *   (P1) It is conceivable that an APZ exists.
      *   (P2) If it is conceivable that an APZ exists, then it is metaphysically possible that an APZ exists.
      *   (P3) If it is metaphysically possible that an APZ exists, then affective phenomenal properties are not metaphysically necessitated by physical-functional properties.
      *   (C) Therefore, affective phenomenal properties are not metaphysically necessitated by physical-functional properties.
  3.  **Distinction Between Possibilities:** Both camps distinguish between *epistemic possibility* (a scenario is not ruled out by our current knowledge or concepts) and *metaphysical possibility* (a scenario is compatible with the fundamental nature of reality). Both agree that the central dispute lies in the inference from P1 to P2.
  4.  **The Explanatory Target:** Both camps agree that affective phenomenal character presents a distinct explanatory challenge compared to sensory discrimination. The "hurt" of pain is distinct from the detection of tissue damage, and the "joy" of pleasure is distinct from the reinforcement of behavior.
  5.  **Commitment to Rational Dialogue:** Both camps agree to characterize the opposing view in its strongest, most plausible form, avoiding caricatures that attribute obvious empirical errors or logical fallacies to the other side.

  ## 2. Disagreements Table

  | Domain of Dispute | Camp A Formulation (Non-Physicalist) | Camp B Formulation (Physicalist) | Precise Crux |
  | :--- | :--- | :--- | :--- |
  | **Modal Inference** | The conceivability of an APZ is ideal and positive; we can positively model a world where physical states exist without affective valence. This entails metaphysical possibility. | The conceivability of an APZ is prima facie only; it reflects an epistemic gap in our conceptual grasp, not an ontological gap in the world. | Does ideal conceivability entail metaphysical possibility in the domain of consciousness? |
  | **Functional Integration** | Affective valence is an intrinsic quality that *accompanies* functional roles but is not *constituted* by them. It can be subtracted without altering the functional structure. | Affective valence is constituted by specific higher-order functional roles (e.g., urgency, motivational priority). To remove the valence is to alter the functional profile. | Is affective phenomenology functionally separable from motivational and cognitive processing? |
  | **Nature of Identity** | The identity between neural states and affective states is contingent. We discover the correlation empirically, but the concepts remain distinct. | The identity between neural states and affective states is necessary. The distinctness of concepts does not imply distinctness of properties. | Does conceptual distinctness imply property distinctness in the case of phenomenal experience? |
  | **Threat Level** | The APZ scenario is *more* damaging to physicalism than the total zombie scenario, as it isolates valence while granting sensory and cognitive function, ruling out representationalist defenses. | The APZ scenario is *less* threatening than the total zombie scenario, as the tight causal integration of affect makes the scenario harder to conceive coherently upon reflection. | Does restricting the zombie argument to affect strengthen or weaken the case against physicalism? |

  ## 3. The Cruxes

  Resolution of the following sub-questions would significantly alter the dialectical landscape, potentially moving at least one camp toward the other's position.

  **Crux 1: The Mode of Grasp**
  Does our primary epistemic access to affective phenomenal character reveal its *intrinsic nature* (what it is like in itself) or merely its *relational role* (how it interacts with other states)?
  *   *Resolution Condition:* If it is demonstrated that our grasp is purely relational, Camp A must concede that conceivability may not track metaphysical possibility. If it is demonstrated that our grasp reveals intrinsic non-relational properties, Camp B must concede that functional definitions are incomplete.

  **Crux 2: Functional Separability**
  Can the motivational force of pain (the drive to avoid damage) be logically and metaphysically separated from the negative valence (the suffering)?
  *   *Resolution Condition:* If it is shown that a system can possess the full motivational profile of pain without the negative valence while remaining a functional duplicate, Camp B's physicalism is undermined. If it is shown that removing the valence necessarily degrades the motivational profile (breaking functional duplication), Camp A's APZ definition is incoherent.

  **Crux 3: The Explanatory Barrier**
  Does a complete physical-functional explanation of behavior and cognitive processing leave any residual explanatory target regarding affective experience?
  *   *Resolution Condition:* If a complete physical account explains all behavioral and cognitive data without remainder, Camp A must justify the reality of the residual "feeling." If a complete physical account leaves the "why it feels like this" question unanswered, Camp B must explain why this gap is not ontological.

  ## 4. Adjudicating Factors and Predictions

  For each Crux, the parties agree on specific considerations that bear on the truth of the matter. Each camp records a prediction regarding the outcome of rigorous analysis of these factors.

  ### Regarding Crux 1 (Mode of Grasp)
  *   **Adjudicating Factor:** Introspective analysis of the "urgency" component of pain. Both sides agree to analyze whether the "badness" of pain can be isolated from the "imperative" command to act.
  *   **Camp A Prediction:** Rigorous introspection will reveal that the "badness" (valence) is a qualitative property that *causes* the sense of urgency but is not *identical* to it. One can imagine the urgency without the quality.
  *   **Camp B Prediction:** Rigorous introspection will reveal that the "badness" is nothing over and above the high-priority imperative signal itself. Attempting to isolate the quality from the imperative results in an empty concept.

  ### Regarding Crux 2 (Functional Separability)
  *   **Adjudicating Factor:** The coherence of the "Pain Asymbolia" thought experiment. Both sides agree to consider a hypothetical case where a subject reports pain, identifies location and intensity, and verbally acknowledges damage, but shows no avoidance behavior or distress, yet claims the "hurt" is missing.
  *   **Camp A Prediction:** This scenario is coherently conceivable and describes a being where the affective qualia are severed from the functional output. This supports the possibility of an APZ (where output is retained but qualia lost, or vice versa).
  *   **Camp B Prediction:** This scenario describes a functional deficit, not a functional duplicate. If avoidance behavior is retained (as required for the APZ definition), the "hurt" must be present. If the "hurt" is absent, the avoidance behavior must be simulated or altered, breaking the functional duplicate condition.

  ### Regarding Crux 3 (Explanatory Barrier)
  *   **Adjudicating Factor:** The success of reductive functional models in predicting phenomenal reports. Both sides agree to evaluate whether a model that maps neural integration and global workspace access can predict first-person reports of "suffering intensity."
  *   **Camp A Prediction:** Even a perfect predictive model will leave the question "Why does this integration feel like suffering rather than nothing?" unanswered. The correlation will remain brute.
  *   **Camp B Prediction:** A successful model will show that "suffering" is the first-person name for that specific type of integration. Once the mechanism is fully understood, the "why" question will dissolve as a category error.

  ## 5. Verbal vs. Substantive Disputes

  Upon review, the parties identify the following areas where dispute may be merely verbal rather than substantive:

  1.  **Definition of "Functional Duplicate":**
      *   *Dispute:* Camp A defines functional duplication in terms of input-output relations and internal causal topology excluding phenomenal properties. Camp B defines functional duplication as including the causal powers of phenomenal properties.
      *   *Justification:* If Camp B defines "function" to *include* the causal efficacy of qualia, then an APZ is impossible by definition. If Camp A defines "function" to exclude qualia, an APZ is possible by definition.
      *   *Resolution Path:* The parties agree to stipulate a neutral definition of "functional" for this collaboration: *causal roles definable without reference to phenomenal vocabulary.* If Camp B maintains that phenomenal properties are required to fill these roles, the dispute is substantive. If Camp B merely claims the vocabulary is different, the dispute is verbal.

  2.  **Usage of "Metaphysical Possibility":**
      *   *Dispute:* Camp A uses "metaphysically possible" to mean "consistent with the essences of the properties involved." Camp B sometimes uses "metaphysically possible" to mean "consistent with the actual laws of nature."
      *   *Justification:* If Camp B argues that APZs are impossible because actual physical laws necessitate consciousness, this is a nomic necessity claim, not a metaphysical one. Camp A argues that even with the same laws, the properties could come apart.
      *   *Resolution Path:* The parties agree to restrict the debate to *metaphysical* necessity (broadly logical possibility), not nomic necessity. Disagreements regarding the laws of physics are set aside.

  3.  **The Term "Physical":**
      *   *Dispute:* Camp B may define "the physical" broadly enough to include phenomenal properties as fundamental physical features (Russellian Monism-adjacent). Camp A defines "the physical" as structural-dynamic properties only.
      *   *Justification:* If Camp B's physicalism allows for intrinsic phenomenal prot properties, the disagreement vanishes.
      *   *Resolution Path:* Camp B confirms they uphold a structural-dynamic physicalism where phenomenal properties must be logically supervenient on structural-dynamic properties. This confirms the dispute is substantive.

  **Conclusion:** The collaboration confirms that the core disagreement rests on whether the conceivability of a functional duplicate lacking affective valence reflects a genuine modal gap (Camp A) or an epistemic limitation regarding the nature of functional roles (Camp B). The agreed-upon predictions provide a roadmap for future dialectical testing.
