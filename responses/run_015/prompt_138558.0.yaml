  In Port Haven, housing zones diverge because fishermen chose winding streets near docks, merchants straight roads uphill. The river divides them physically, but the social split is invisible. Over thirty years, doctors trust uphill patients more, assuming stability; employers hire them for reliability. Downhill residents die younger due to stress and damp. No one names these zones 'classes'. No one believes a division exists; they simply follow habits of trust and route. The division causes real harm without ever being conceived. Residents act only on immediate convenience, yet their aggregated choices solidify a hierarchy. Life expectancy gaps widen, medical outcomes skew, and hiring biases calcify, all without a single soul recognising the boundary.

  This view denies the kind exists. Without collective agreement or assigned status functions, there is only behaviour, not institution. The town lacks the shared intentionality required to turn physical differences into social reality. It remains a brute pattern, not a constructed kind.

  This view affirms the kind. Social relations and practices materially constitute the group's position, creating systematic advantage and disadvantage. Whether anyone recognises the structure is irrelevant; the oppression is real because the social hierarchy functions objectively to constrain lives.

  This view denies the kind. Human kinds require classification to trigger behavioural changes. Since nobody knows they are classified, they cannot react to alter the classification. Without this feedback loop, the group is merely a naturalistic cluster, not an interactive social kind.

  The crucial feature is the absence of representation. If you insert a name halfway through, view (3) flips to 'yes' because classification enables reaction, initiating the loop. Defenders of (1) and (3) will argue your town describes only a causal pattern, not a kind, because kinds require mind-dependent status or interactive classification. Without someone drawing the line consciously, it remains a statistical shadow, not a social object.
