answer: |-
  There is no single canonical term in speech act theory that carves out exactly this configuration. You have correctly identified a gap in the standard taxonomy.

  The nearest established concepts are **Indirect Speech Act** (Searle) and **Implicature** (Grice), but as you noted, both fail to capture the specific mechanic you're describing.
  *   **Implicature** concerns *content* (what is meant beyond what is said). Your examples have clear content; the ambiguity is in the *act* being performed.
  *   **Indirect Speech Act** concerns *force* (e.g., "It's cold" = "Close the window"). However, in a standard indirect act, the force is **fixed by convention or context** at the moment of utterance. If I say "Can you pass the salt?", it is a request regardless of whether you pass it. In your cases, the force is **not fixed** until the hearer reacts.

  The phenomenon you are describing is a **Strategic Uptake-Contingent Illocution**.

  Here is the carving you asked for.

  ### The Concept: Uptake-Contingent Illocution

  **Definition:** An utterance where the illocutionary force (the type of act being performed) is not determined by the speaker's prior intention, nor by linguistic convention, but is retroactively settled by the hearer's uptake. Crucially, the speaker *intends* this contingency to secure a strategic advantage (usually plausible deniability).

  **The Mechanism:**
  1.  **Literal Stability:** The propositional content is clear and true on its face (e.g., "It would be a shame").
  2.  **Illocutionary Void:** The speaker withholds the commitment required to fix the force (e.g., the commitment required to make it a *threat* rather than a *prediction*).
  3.  **Uptake as Constitutive:** The hearer's reaction does not just *respond* to the act; it *completes* the act. If the hearer complies, the act becomes a **Threat**. If the hearer ignores it, the act remains an **Observation**.
  4.  **Strategic Intent:** The speaker aims for this plasticity. They want the benefits of the force (compliance) without the costs of the force (accountability).

  ### Why "Indirect Speech Act" Doesn't Fit
  In a standard Indirect Speech Act (e.g., "I wonder if you could close the door"), the speaker *means* it as a request. If the hearer says, "Yes, I wonder that too," and doesn't close the door, the speaker can legitimately say, "No, I was asking you to close it." The force was fixed by the speaker's intent and shared convention.

  In your **Uptake-Contingent** case, if the employee laughs and the boss says, "No, I was threatening you," the boss would be lying (or failing). The boss *needs* the employee to treat it as a threat for it to *be* a threat. The force is outsourced.

  ### The Edges and Boundaries

  **1. What it is not: Perlocutionary Effect**
  A perlocutionary effect is the *consequence* of speech (e.g., scaring someone). You might scare someone by accident. In an Uptake-Contingent Illocution, the "scaring" is not just a consequence; it is the *criterion* that determines whether the act was a threat. It blurs the line between illocution (the act) and perlocution (the effect).

  **2. What it is not: Ambiguity**
  Standard ambiguity ("I went to the bank") is about *meaning*. This is about *status*. The sentence isn't ambiguous; its social reality is.

  ### Borderline Case (Barely Qualifies): Flirting
  *   **Utterance:** "You look dangerous tonight."
  *   **Why it fits:** The force (Sexual Proposition vs. Compliment) is often settled by the recipient's reaction. If they lean in, it was a proposition. If they stiffen, it was a compliment.
  *   **Why it barely qualifies:** In flirting, the ambiguity is often mutual and playful. In your examples, the contingency is *weaponized* by the speaker to avoid accountability. Flirting often invites a negotiation of force; your cases are designed to *evade* the definition of force.

  ### Near Miss (Looks Similar but Isn't): The Polite Request
  *   **Utterance:** "It's getting late." (Said by a host to a guest).
  *   **Why it looks similar:** It relies on the guest to "take the hint."
  *   **Why it isn't:** This is a standard **Indirect Speech Act**. The convention is fixed. If the guest says, "Yes, it is," and stays, the host is entitled to say, "I was hinting you should leave." The force was a request *at the moment of speaking*, fixed by social convention. The guest cannot retroactively decide it wasn't a request to save the host from rudeness; the host has already committed to the request, just politely. In your boss example, the boss has *not* committed to the threat unless you comply.

  ### Summary of the Carving
  You are looking at a specific exploitation of the **Austinian gap** between utterance and uptake. Austin argued uptake is necessary to *secure* an act. This phenomenon treats uptake as necessary to *create* the act.

  **Term:** **Uptake-Contingent Illocution** (or **Reactive Force**).
  **Core Feature:** The speaker delegates the authority to classify the speech act to the hearer, specifically to insulate themselves from the consequences of that classification.
