  *   **Offloading Criterion:** Verdict = **Gregorian** for both Condition A and Condition B. Reasoning: In both cases, the artifact (petal or leaf) carries and fixes information (location) externally, reducing the on-line cognitive load required to remember the box during the delay.
  *   **Re-deployment Criterion:** Verdict = **Popperian** for Condition A, **Gregorian** for Condition B. Reasoning: Condition A fails because the artifact is destroyed, preventing re-use; Condition B succeeds because the same item is picked up for one job (food location) and later re-used as a representational resource in a different task (water location) without new training.

