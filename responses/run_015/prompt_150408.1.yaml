  Two cohorts of captive chimpanzees, matched for age and prior tool-use experience, face a delayed-choice task: bait is hidden in one of two identical boxes, and the subject must leave the room for one hour before returning. Both cohorts demonstrate Popperian selection by inspecting both boxes, hesitating, and then placing a specific object on the baited box before departing. In Condition A, the object is a fragile flower petal that desiccates and crumbles to dust during the hour, leaving only the location marked; in Condition B, the object is a durable leaf that remains intact, is retrieved upon return, and is subsequently observed being used by the same subjects to mark a water source without additional training. The physical environment, reinforcement (food reward), and initial cognitive load reduction are identical; only the artifact's persistence and subsequent availability for re-use differ.

