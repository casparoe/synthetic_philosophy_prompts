  ### The Diagnostic Instrument

  **Instructions:** Read each scenario drawn from the documents regarding Vera. Select the option that best matches your intuition about what is happening. Do not worry about consistency; answer each question on its own merits.

  **Q1. The Gap**
  In 1998, Vera's diary stops entries for six months. Her clinic notes show she was alive and treated for minor ailments. Her sister claims Vera was "lost to herself" during this time.
  *   (A) Vera was still there; the book just wasn't being written.
  *   (B) Vera was partially absent; without the writing, she wasn't fully herself.
  *   (C) "Vera" is just a label we stick on that body regardless of what happened.

  **Q2. The Contradiction**
  In court, Vera admits under oath that entries in her private diary were lies designed to make her look better.
  *   (A) The court version is the truth because she was held to it.
  *   (B) The diary is the truth because it was meant for her own eyes.
  *   (C) Both are just performances for different audiences.

  **Q3. The Sister's Memory**
  Vera's sister writes that Vera once saved a child from a river. Vera's planner from that week shows she was out of the country.
  *   (A) The sister is right; Vera is the person the sister remembers.
  *   (B) The planner is right; Vera is the body that traveled.
  *   (C) It doesn't matter; both stories help us understand the loss.

  **Q4. The Algorithm**
  The final dossier reveals a correlation between Vera's purchases and her clinic visits that Vera never noticed and no human has read.
  *   (A) This pattern is the truest account of Vera's life.
  *   (B) This pattern is just data; Vera is the person who lived the life.
  *   (C) This pattern proves Vera was never a single person, just a set of habits.

  **Q5. The Change**
  At twenty, Vera was generous. At forty, she was cruel. The body is the same.
  *   (A) She is the same person, simply changed.
  *   (B) They are effectively two different people sharing a body.
  *   (C) It only matters if we need to punish the forty-year-old for the twenty-year-old's debts.

  **Q6. The Debt**
  Vera dies owing money. Her estate has enough to pay, but her sister argues the debt died with her.
  *   (A) The estate pays because the obligation belongs to the organism's leftovers.
  *   (B) The sister pays because she kept Vera's name alive in the community.
  *   (C) No one pays; debts belong to stories that have ended.

  **Q7. The Statement**
  In a letter, Vera writes: "I feel like the same person I was ten years ago."
  *   (A) She is reporting a fact about her internal continuity.
  *   (B) She is using a useful shorthand to organize her history.
  *   (C) She is reporting an illusion created by her memory.

  **Q8. The Action**
  Vera buys a train ticket to Paris. Why?
  *   (A) Because Vera wanted to go to Paris.
  *   (B) Because prior causes and brain states led to the purchase.
  *   (C) Because she promised her sister she would go.

  **Q9. The Ending**
  The book ends with the dossier: a list of correlations with no narrative shape.
  *   (A) This is fitting; life is not a story.
  *   (B) This is incomplete; we need a story to understand a life.
  *   (C) This is the truth; stories are lies we tell to hide the data.

