  ### Coda: The Dossier and the Commitment

  Your novel's form ends with the Dossier: a pattern of covariation with no narrative shape, assembled without knowledge, unread by humans.

  **Which leaf does the book commit to?**
  The form commits you to the **Reductionist** leaf (Position 6), with a strong gravitational pull toward the **Eliminativist** leaf (Position 7).
  *   **Why:** By privileging the dossier over the diary (Self-Telling), the testimony (Accountability), and the memoir (Social Attribution), you are asserting that the truth of Vera lies in the continuity of data and cause, not in the identity stories told by humans.
  *   **Nuance:** Because "no human being has ever read [it] in its entirety," you avoid the **Abstraction** view (which requires the narrative to be *used* by someone). A story no one reads is not a useful abstraction. It is either raw reality (Reductionist) or proof that the human search for self is futile (Eliminativist). Given the lack of narrative shape, **Eliminativist** is the stronger commitment. The form suggests that "Vera" as a character is the illusion, and the data is the only truth.

  **Is the commitment stable?**
  It is stable across Questions 4, 7, and 9, but unstable across Questions 2 and 3.
  *   **Stable:** The dossier validates the view that the self is not a story (Q9) and that internal feelings of continuity are secondary to external patterns (Q7).
  *   **Unstable:** The book *presents* the diary and testimony with enough weight to make the reader care about them. If the reader invests in Vera's suffering in the diary (CST) or the sister's grief (Soc), the ending retroactively invalidates that investment. The form argues for Elimination, but the content argues for Constitution. This tension is the engine of the book, but metaphysically, the final page wins.

  **Illumination or Betrayal?**
  *   **Readers answering for Constitutive Self-Telling (Diary) or Social Attribution (Sister):** They will experience the ending as a **betrayal**. You have asked them to invest in a person, then told them the person was never there, only the data. It feels like a bait-and-switch.
  *   **Readers answering for Reductionist or Eliminativist:** They will experience the ending as an **illumination**. It confirms their suspicion that the other documents were just noise. The dossier strips away the pretense of unity and leaves the raw covariation.
  *   **The Risk:** Since most ordinary readers intuitively hold the **Constitutive Self-Telling** or **Social Attribution** view (they read novels to know people, not data), the majority will likely feel betrayed. However, if your goal is to make the metaphysics explicit, this betrayal is the precise moment the metaphysics lands. They feel the loss of the self because the form has removed it.
