  Here is a principle that captures the logic behind your five verdicts, followed by an analysis of how it applies to your cases and the new scenario.

  ### The Principle: Capital Succession and Displacement

  **Gentrification is a process of neighborhood transformation characterized by the active influx of residents or investors possessing higher economic or cultural capital into *pre-existing housing stock*, which generates *actual or structurally inevitable displacement* (economic or cultural) of the incumbent community, excluding scenarios where incumbent exclusion arises primarily from the inability to rebuild after *catastrophic physical destruction*.**

  This principle relies on four specific clauses to reconcile your judgments:

  1.  **The Substrate Clause ("Pre-existing housing stock"):** The process must operate on existing homes. If the housing is destroyed, the subsequent exclusion is reconstruction failure, not gentrification.
      *   *Motivated by Case 3:* Distinguishes disaster recovery (not gentrification) from market succession (gentrification).
  2.  **The Displacement Clause ("Actual or structurally inevitable displacement"):** There must be evidence that original residents are being pushed out or will inevitably be pushed out. Mere price increases without turnover are insufficient.
      *   *Motivated by Case 1 & Case 2:* Explains why Case 1 (no displacement) is not gentrification, while Case 2 (50% turnover) is.
  3.  **The Prospective Clause ("Structurally inevitable"):** Displacement need not be realized if policy or investment shifts have made it unavoidable.
      *   *Motivated by Case 4:* Allows gentrification to be "in progress" via rezoning and investor acquisition before residents actually leave.
  4.  **The Mode of Displacement Clause ("Economic or cultural"):** Displacement is not limited to economic eviction; the transformation of social character that makes incumbents feel they no longer belong counts.
      *   *Motivated by Case 5:* Validates cultural displacement even without direct rent-based eviction.

  ### Analysis of Tensions

  You identified tensions between Cases 3 and 5 (exogenous shocks) and Cases 1 and 4 (realized vs. prospective harm). This principle resolves them without smoothing over the distinctions, but it does so by relying on specific, narrow boundaries:

  *   **Case 3 vs. Case 5 (The Exogenous Shock Tension):** Both cases begin with an external shock (disaster vs. factory closure). Your verdicts differ because Case 3 involves the *physical destruction* of the housing stock (triggering the **Substrate Clause**), whereas Case 5 involves the *economic destruction* of the employment base while housing remains intact. In Case 5, the "gentrification" is the active cultural succession (artists/cafes) filling the vacuum; in Case 3, the "displacement" is the passive inability to afford reconstruction. This is a coherent distinction, but it rests entirely on the physical state of the buildings, not the economic status of the residents.
  *   **Case 1 vs. Case 4 (The Harm Tension):** Both cases lack realized displacement at the time of judgment. Your verdicts differ because Case 4 involves a *policy lock-in* (rezoning) and *investor acquisition* that makes displacement **structurally inevitable**, whereas Case 1 represents *organic market drift* (5% rent rise) where displacement is not guaranteed. This distinguishes speculation-driven gentrification from ordinary inflation.

  ### Prediction: The University Expansion Scenario

  **Scenario:** A large university expands its campus, buying up housing and converting it to student rentals, raising rents for everyone else but also providing stable employment and public transit investment.

  **Verdict:** **This counts as gentrification.**

  **Application of Principle:**
  *   **Active Influx:** The university acts as an institutional investor with higher capital than incumbent residents.
  *   **Pre-existing Stock:** They are buying and converting existing housing, not rebuilding after a disaster.
  *   **Displacement:** Rents are "raising for everyone else," indicating actual economic displacement of non-student residents.
  *   **Mitigating Factors:** The provision of employment and transit does not negate the displacement mechanism. Under this principle, the *benefits* of investment do not cancel out the *process* of displacement. This is often termed "studentification" or "institutional gentrification."

  ### Accommodation Statement

  **My account accommodates all five of your judgments.**

  However, I must be explicit about the fragility of this accommodation regarding **Case 5**. Standard sociological definitions of gentrification often require *economic* displacement (pricing out). Your verdict on Case 5 relies on *cultural* displacement sufficing on its own ("no one was ever priced out").

  To accommodate Case 5 without overturning it, the principle must explicitly expand the definition of "displacement" to include subjective cultural alienation. If one were to tighten the definition to require *economic* eviction, Case 5 would have to be overturned. Conversely, if one were to tighten the definition to require *realized* harm, Case 4 would have to be overturned.

  By accepting both **Cultural Displacement** (for Case 5) and **Prospective Harm** (for Case 4), the principle remains coherent with your intuitions, but it renders the label "gentrification" broader than some traditional economic models allow. The only judgment that remains most vulnerable to challenge is **Case 3**; if one argues that "inability to afford reconstruction" is functionally identical to "inability to afford rent," then Case 3 should be overturned to match Case 2. However, under the **Substrate Clause**, your distinction holds.
