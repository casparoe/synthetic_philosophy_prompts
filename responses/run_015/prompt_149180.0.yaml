      *   **Constraint 2 (Audience):** Jurors have *no* philosophy background; Board Chair has *no* philosophy background.
      *   **Constraint 3 (Grounding):** Must be grounded in actual WKR literature (reasons responsive to value vs. reasons causing/substituting response) but translated for non-specialists.
      *   **Deliverables:**
          *   Ordered checklist with explicit stopping conditions (Pass/Flag/Judgment Call).
          *   Three-part taxonomy of WKRs specific to literature (Biographical-Projection, Market-Proxy, Moral-Political Substitution).
          *   Test sentences/patterns.
          *   Worked examples (Flagged, Cleared, False Positive).
          *   Limitations/Misfire analysis (False Negatives/Positives).
          *   Application to three specific cases provided in the prompt.
          *   Practical constraints acknowledgment.

  2.  **Deconstruct "Wrong-Kind Reasons" (WKR) for Aesthetics:**

      *   *Philosophical Core:* The distinction between *object-given reasons* (features of the work that make it good *as art*) and *state-given/external reasons* (features of the context, the author, or the effects on the reader that don't bear on artistic merit).
      *   *The Challenge:* In literature, moral and political values *can* be aesthetic values (e.g., complexity of ethical vision). The WKR isn't that morality is irrelevant, but that it *substitutes* for aesthetic engagement.
      *   *The Taxonomy:*
          1.  **Biographical-Projection:** Valuing the work because of who the author is or who the reader is, rather than what the text *does*. (e.g., "I am like the protagonist.")
          2.  **Market-Proxy:** Valuing the work because of sales, relevance, or career impact, rather than quality. (e.g., "This will sell well.")
          3.  **Moral-Political Substitution:** Valuing the work *solely* for its moral stance without engaging with how that stance is artistically realized. (e.g., "This message is good," vs. "This message is complexly rendered.")

  3.  **Drafting the Procedure (The Checklist):**

      *   Need to be fast (20 mins/rationale).
      *   Need clear Yes/No/Maybe paths.
      *   *Step 1: The Reference Test.* Does the reason point to the text or outside the text?
      *   *Step 2: The Substitution Test.* Does this reason replace aesthetic analysis?
      *   *Step 3: The Taxonomy Match.* Does it fit the three specific WKR types?
      *   *Stopping Conditions:* Pass (Clear), Flag (WKR detected), Judgment Call (Ambiguous).

  4.  **Developing the Taxonomy & Defense:**

      *   Need to explain *why* these are WKRs in aesthetics.
      *   *Biographical:* Shifts focus from work to identity.
      *   *Market:* Shifts focus from quality to utility.
      *   *Moral:* Shifts focus from artistic realization to propositional agreement.
      *   *Why a taxonomy?* Helps the secretary pinpoint *which* error occurred, making the report to the Board Chair more actionable.

  5.  **Creating Test Sentences/Patterns:**

      *   Need phrases that signal WKRs.
      *   *Biographical:* "As a [identity]...", "Finally someone like me..."
      *   *Market:* "Relevant," "Sell," "Audience," "Prize prestige."
      *   *Moral:* "Important message," "Restoring dignity," "Should read," without mention of craft.

  6.  **Working Examples:**

      *   *Flagged (True Positive):* The Market-Proxy case (Case 2).
      *   *Cleared (False Alarm):* A reason that looks moral but is actually aesthetic (e.g., "The moral complexity is rendered through unreliable narration").
      *   *Unwanted Result (False Positive):* A case where moral value *is* aesthetic value (e.g., Didacticism as a stylistic choice), but the procedure flags it.

  7.  **Applying to the Three Specific Cases:**

      *   *Case 1 (Traumatic Autofiction):* "Lets people like me see our suffering." -> Biographical-Projection.
      *   *Case 2 (Experimental/Market):* "No one will buy this." -> Market-Proxy.
      *   *Case 3 (Historical Epic):* "Restoring dignity... no mention of craft." -> Moral-Political Substitution. (Requires Judgment Call on whether "dignity" implies aesthetic success).

  8.  **Addressing Limitations & Misfires:**

      *   *False Negatives:* Subtle WKRs disguised as aesthetic talk.
      *   *False Positives:* Legitimate aesthetic values (like political urgency) that look like WKRs.
      *   *What it can't do:* Settle disagreements on what counts as "good art."

  9.  **Refining for Constraints:**

      *   *Time:* Keep steps concise.
      *   *Literacy:* Avoid jargon like "buck-passing" or "fittingness." Use "Text-Focus" instead of "Object-Given."
      *   *Sign-off:* The report must be understandable by the Board Chair.

