answer: |-
  # Audit Procedure: Juror Rationale Validity Check (WKR-Protocol v1.0)

  **To:** Administrative Secretary
  **From:** Prize Board (Philosophical Advisory Subcommittee)
  **Subject:** Auditing Juror Rationales for Wrong-Kind Reasons
  **Time Budget:** 2 Hours Total (20 mins per rationale × 5 jurors + 20 mins reporting)
  **Audience:** Board Chair (Non-Philosopher)

  ---

  ## Part 1: The Taxonomy of Wrong-Kind Reasons (WKR)

  In aesthetic judgment, a **Right-Kind Reason (RKR)** cites a feature of the work that makes it valuable *as art* (e.g., complexity, prose rhythm, structural coherence). A **Wrong-Kind Reason (WKR)** cites a feature that explains *why you want to reward it* but not *why it is good art*.

  To make this actionable, we use a three-part taxonomy. These are "wrong kind" not because the values (identity, sales, morality) are bad, but because they **substitute** for aesthetic engagement rather than responding to the artistic value itself.

  | Taxonomy Category | Definition | Why It Is Aesthetically "Wrong Kind" |
  | :--- | :--- | :--- |
  | **1. Biographical-Projection** | Valuing the work based on the author's identity or the reader's personal identification, rather than the text's construction. | It shifts the locus of value from the *object* (the novel) to the *subject* (the juror/author). It rewards representation without assessing *how* it is represented. |
  | **2. Market-Proxy** | Valuing the work based on predicted sales, relevance, or career utility for the author. | It treats the prize as a marketing tool or social service. Sales and utility are consequences of value, not constituents of artistic merit. |
  | **3. Moral-Political Substitution** | Valuing the work solely for its ethical stance or political message without reference to artistic realization (craft, form, language). | Moral truth is not aesthetic truth. A pamphlet can have a better moral message than a novel. The aesthetic value lies in *how* the message is embodied, not the message itself. |

  **Why a Taxonomy?**
  Treating "WKR" as a single category is too blunt. Distinguishing these three allows you to tell the Board *which* boundary was crossed. A juror might be legitimately concerned with politics (RKR) but express it via substitution (WKR). The taxonomy isolates the error.

  ---

  ## Part 2: The Audit Checklist (20-Minute Protocol)

  **Instructions:** Read the juror's rationale. Run through Steps 1–3. If you reach a **STOP**, record the result and move to the next rationale.

  ### Step 1: The Reference Test (Object vs. Context)
  **Question:** Does the primary justification refer to features *inside* the text (style, structure, character depth, imagery) or features *outside* the text (author bio, market data, external social effects)?
  *   **PASS:** The reason cites internal features (e.g., "The pacing mirrors the protagonist's anxiety"). **→ STOP. Audit Clear.**
  *   **FLAG:** The reason cites *only* external features (e.g., "The author needs this win," "This book will sell"). **→ Go to Step 2.**
  *   **JUDGMENT CALL:** The reason mixes internal and external features ambiguously. **→ Go to Step 2.**

  ### Step 2: The Substitution Test (Responsiveness vs. Causation)
  **Question:** If we removed the external factor (e.g., the author's identity, the potential sales), would the juror still claim the work is *artistically* successful? Or does the external factor *replace* the need for artistic success?
  *   **PASS:** The external factor is framed as a *result* of the art (e.g., "The powerful prose makes this political message land"). **→ STOP. Audit Clear.**
  *   **FLAG:** The external factor is framed as a *substitute* for art (e.g., "The message is so important the prose doesn't need to be polished"). **→ Go to Step 3.**
  *   **JUDGMENT CALL:** It is unclear if the juror sees the external factor as constitutive of the art or separate from it. **→ Go to Step 3.**

  ### Step 3: The Taxonomy Match (Categorization)
  **Question:** Which WKR category does this best fit? (Select one).
  *   **Biographical-Projection:** Focus on "people like me," "voices like ours," or authorial suffering.
  *   **Market-Proxy:** Focus on "relevance," "sales," "audience reach," or "prize prestige."
  *   **Moral-Political Substitution:** Focus on "dignity," "justice," "truth," with no mention of craft.
  *   **Action:**
      *   If **Biographical** or **Market**: **FLAG as WKR.** (These are rarely defensible as aesthetic reasons).
      *   If **Moral-Political**: **FLAG for Secretary Judgment.** (Moral value can be aesthetic if realized through form; you must decide if the juror ignored form entirely).

  ---

  ## Part 3: Test Sentences & Patterns

  Scan the text for these phrases. They are not automatic disqualifiers, but they trigger **Step 2**.

  *   **Biographical-Projection Patterns:**
      *   "As a [identity], I felt..."
      *   "Finally, someone like us..."
      *   "It is important that this author..."
      *   "The suffering here is real/true." (Confuses biographical truth with aesthetic truth).
  *   **Market-Proxy Patterns:**
      *   "The prize needs to stay relevant."
      *   "No one will read/buy this."
      *   "This will launch their career."
      *   "Timely/Of the moment." (Unless linked to stylistic innovation).
  *   **Moral-Political Substitution Patterns:**
      *   "Restoring dignity to..."
      *   "The right thing to reward."
      *   "Necessary story."
      *   *Crucial Check:* Is this followed by "...through the use of [narrative device]"? If **No**, it is a WKR.

  ---

  ## Part 4: General Worked Examples

  ### Example A: Correct Flag (Market-Proxy)
  *   **Rationale:** "I ranked this novel last. While well-written, it is too niche. The prize cannot afford to alienate general readers, and this book will not sell."
  *   **Audit:**
      *   Step 1: References sales/readers (Outside). **→ Step 2.**
      *   Step 2: Sales substitute for quality ("While well-written... but"). **→ Step 3.**
      *   Step 3: Matches Market-Proxy.
  *   **Result:** **FLAG.** The juror admits artistic merit but overrides it with market concerns.

  ### Example B: Cleared (Initially Suspicious)
  *   **Rationale:** "This novel is vital. It confronts the climate crisis directly, using a fragmented structure that mimics ecological collapse, forcing the reader to experience disorientation."
  *   **Audit:**
      *   Step 1: References "climate crisis" (Outside) but also "fragmented structure" (Inside). **→ Step 2.**
      *   Step 2: Is the politics a substitute? No. The political theme is realized *through* the structure ("mimics," "forcing the reader"). The value is in the *mimicry*, not just the topic.
  *   **Result:** **CLEAR.** The political urgency is mediated by aesthetic form.

  ### Example C: Unwanted Result (False Positive)
  *   **Rationale:** "I am ranking this highly because it restores dignity to a marginalized group. The prose is plain, but the act of witnessing is the art."
  *   **Audit:**
      *   Step 1: References dignity (Outside). **→ Step 2.**
      *   Step 2: "Act of witnessing is the art" suggests the *function* replaces the *form*. **→ Step 3.**
      *   Step 3: Matches Moral-Political Substitution. **FLAG for Judgment.**
  *   **Secretary Reflection:** This is an **Unwanted Result**. Some avant-garde traditions argue that "plainness" *is* the aesthetic choice (e.g., autofiction minimalism) and that "witnessing" is a genre convention. The procedure flags this as WKR because it lacks craft talk, but a sophisticated defense of "ethical aesthetics" might permit it.
  *   **Action:** You must override the flag and mark as **Judgment Call** for the Board.

  ---

  ## Part 5: Application to Specific Juror Rationales

  Apply the checklist to the three cases provided in your brief.

  ### Case 1: The Traumatic Autofiction
  *   **Rationale:** "I rank this #1 because it finally lets people like me see our suffering represented."
  *   **Audit:**
      *   **Step 1:** Reference is to "people like me" and "suffering represented" (Reader Identity/Effect). **→ Proceed.**
      *   **Step 2:** Substitution? Yes. The value is the *visibility* of suffering, not the *rendering* of it. If the prose were bad, would the juror still rank it #1? Implied yes.
      *   **Step 3:** Taxonomy? **Biographical-Projection.**
  *   **Result:** **FLAG (WKR).**
  *   **Report Note:** "Juror 1 cites reader identification and biographical resonance as the primary value, without reference to narrative craft. This fits the Biographical-Projection WKR category."

  ### Case 2: The Experimental Novel
  *   **Rationale:** "I dismiss this experimental novel because no one will buy this, and the prize should stay relevant."
  *   **Audit:**
      *   **Step 1:** Reference is to "buy" and "relevant" (Market/Context). **→ Proceed.**
      *   **Step 2:** Substitution? Yes. Market viability is explicitly used to override artistic merit ("experimental" implies art, "no one will buy" overrides it).
      *   **Step 3:** Taxonomy? **Market-Proxy.**
  *   **Result:** **FLAG (WKR).**
  *   **Report Note:** "Juror 2 explicitly prioritizes market viability and prize relevance over artistic experimentation. This is a clear Market-Proxy WKR."

  ### Case 3: The Historical Epic
  *   **Rationale:** "I praise this historical epic solely for restoring dignity to a marginalized group." (No mention of craft, language, or form).
  *   **Audit:**
      *   **Step 1:** Reference is to "restoring dignity" (Moral/Political Effect). **→ Proceed.**
      *   **Step 2:** Substitution? Yes. The word "solely" indicates the moral outcome replaces aesthetic analysis.
      *   **Step 3:** Taxonomy? **Moral-Political Substitution.**
  *   **Result:** **FLAG for Secretary Judgment.**
  *   **Secretary Judgment Call:**
      *   *The Flag:* The procedure correctly identifies that "dignity" is a moral outcome, not an aesthetic feature.
      *   *The Call:* However, in historical fiction, "restoring dignity" *can* be an aesthetic achievement if achieved through narrative reclamation (e.g., giving voice to the silenced). Because the juror said "solely" and omitted craft, the procedure flags it.
      *   *Decision:* You must mark this as **"Ambiguous: Potential WKR."**
      *   **Report Note:** "Juror 3 cites a moral outcome ('restoring dignity') without linking it to narrative technique. While this triggers the Moral-Political Substitution flag, it is possible the juror views the narrative act itself as the dignity-restoring mechanism. Recommend Board review to determine if 'dignity' was intended as a thematic goal achieved through craft, or a moral substitute for craft."

  ---

  ## Part 6: Limitations, Misfires, and Reporting

  ### Where the Procedure Will Misfire
  1.  **False Negatives (Slip-Through):** A juror may use aesthetic language to mask a WKR.
      *   *Example:* "The prose is beautiful" (when they mean "The prose is polite/familiar"). The procedure cannot detect bad-faith aesthetic claims.
  2.  **False Positives (Unwanted Flags):** As seen in **Example C** and **Case 3**, legitimate aesthetic theories (e.g., Ethical Criticism, Testimonial Literature) argue that moral impact *is* part of the aesthetic experience. The procedure treats "Moral" and "Aesthetic" as distinct for safety, which may flag legitimate ethical-aesthetic arguments.
  3.  **The "Craft" Blindspot:** The procedure assumes mentioning "craft" (language, form) validates a reason. A juror could list craft terms superficially ("the syntax was good") while actually deciding based on identity. The audit trusts the text provided.

  ### What the Procedure Cannot Do
  *   **Settle Disagreements on Value:** It cannot decide if a book is *good*. It only decides if the *reason given* is the right *kind*.
  *   **Resolve Board Disputes:** If the Board Chair believes "Market Relevance" *is* a valid criterion for the prize, this audit cannot stop them. It only informs them that it is a WKR in *aesthetics*.
  *   **Psychological Analysis:** It cannot determine if a juror is lying or unconsciously biased. It audits the *text*, not the *mind*.

  ### Reporting Protocol (Final 20 Minutes)
  1.  **Compile Flags:** List Juror IDs with Flags (e.g., J1: Bio-Projection, J2: Market-Proxy).
  2.  **Summarize Judgment Calls:** For Case 3 (and any others), write a 2-sentence summary of the ambiguity.
  3.  **Draft Memo to Board Chair:**
      *   *Opening:* "Audit complete. 5 rationales reviewed."
      *   *Findings:* "X rationales contain Wrong-Kind Reasons."
      *   *Recommendation:* "For Flagged cases, the Board may wish to request revised rationales focusing on textual evidence. For Judgment Calls, the Board must decide if Moral-Political outcomes count as aesthetic merit for this prize."
      *   *Disclaimer:* "This audit assesses the *form* of justification, not the *merit* of the novels."

  ### Practical Constraints Check
  *   **Time:** 20 mins/rationale allows for 2 read-throughs (one for content, one for pattern matching).
  *   **Literacy:** No philosophical jargon in the final report to the Chair. Use "Textual Evidence" vs. "External Factors."
  *   **Sign-off:** The Board Chair signs off on the *report*, not the philosophical validity. Your role is to flag the risk, not veto the juror.

  ---
  **End of Procedure**
