      *   *Check the Prompt:* Did I include the "unwanted result" example? Yes. Did I explain the taxonomy defense? Yes. Did I apply to the 3 specific cases? Yes.
      *   *Tone:* Professional, administrative, yet philosophically rigorous.

  11. **Final Structure:**
      *   Introduction (Context & Constraints).
