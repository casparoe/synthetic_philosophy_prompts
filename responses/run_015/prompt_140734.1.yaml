      *   **What to Give Up:** Give up the claim that Prioritarianism must be immune to *all* counterintuitive results, specifically in population ethics. Or, more precisely, reject the identification of this result with the Levelling-Down Objection.
      *   **Addressing the Rank Question:** Explain that rank-weighting moves you toward egalitarianism and reintroduces LDO in fixed cases. It's not the solution. The solution is usually a "Critical Level" modification or accepting that population ethics is hard (The Impossibility Theorems).
