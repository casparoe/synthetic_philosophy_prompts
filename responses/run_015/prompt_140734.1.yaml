      *   **My Persona:** A professional philosopher specializing in distributive and population ethics. I need to be careful, rigorous, and pedagogical. I need to "take this slowly," "think it through carefully," "restate the argument," identify the "real work" step, and then advise on what to give up.
      *   **The Argument:** A reductio ad absurdum against Prioritarianism.
          *   (1) Definition of Prioritarianism (Sum of $f(w_i)$, $f$ concave, $f(0)=0$).
          *   (2) Standard Defense: $f$ increasing means no LDO in fixed-population cases.
          *   (3) Mathematical Claim: Average weight $f(w)/w$ decreases as $w$ increases (due to concavity + $f(0)=0$).
          *   (4) Scenario: Fixed total welfare $W$, distributed evenly among $n$ people. Value = $n \cdot f(W/n)$.
