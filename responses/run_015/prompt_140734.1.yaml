      *   So "nobody better off" is false.
      *   Therefore, (6) is false.
      *   The argument proves Total Prioritarianism has a Repugnant Conclusion, not that it succumbs to LDO.
      *   This preserves the "selling point" mentioned by the user. The selling point is about *distributive justice among existing people*.

  7.  **Final Plan:**
