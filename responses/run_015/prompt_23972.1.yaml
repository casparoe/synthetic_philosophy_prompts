answer: |-
  # Joint Statement on the Status of Large Language Models
  **Adversarial Collaboration between Proponents of the Stochastic Parrots Hypothesis and Functionalists**

  ## Part I: Agreed Claims

  We, the undersigned, represent two distinct theoretical camps regarding the cognitive status of Large Language Models (LLMs). While we disagree on the interpretation of model capabilities, we affirm the following claims as a shared baseline for further inquiry:

  1.  **Architectural and Training Consensus:** We agree that current frontier LLMs are transformer-based neural networks trained primarily via self-supervised learning objectives (specifically, next-token prediction) over massive, static corpora of text and code. We agree that these models do not possess sensory organs, effectors, or biological embodiment in the standard sense, and that their "experience" is limited to the statistical structure of their training data and subsequent fine-tuning.
  2.  **Definition of the "Stochastic Parrots" Claim:** We agree that the "Stochastic Parrots" hypothesis is a claim about *understanding* (semantics/intentionality), not a claim about *capability* (performance/competence). We acknowledge that LLMs demonstrate high fluency and can solve complex reasoning tasks. The Stochastic Parrots position does not deny these capabilities; it denies that the capabilities arise from genuine comprehension rather than high-dimensional pattern matching.
  3.  **Separation of Ontology and Ethics:** We agree that the question "Do LLMs understand?" is distinct from the question "Is deploying LLMs harmful?"
      *   We acknowledge that deploying LLMs *as if* they understand (e.g., in care, legal, or educational contexts) carries risks of deception, over-reliance, and accountability gaps.
      *   We acknowledge that these harms exist regardless of whether the models truly understand. A system that simulates empathy without feeling it can still cause harm to a user seeking connection; conversely, a system that understands but is misaligned can cause harm.
      *   Therefore, resolving the metaphysical debate is not a prerequisite for establishing safety protocols, though it may influence long-term governance.
  4.  **Methodological Naturalism:** We agree that claims about machine understanding should be adjudicated through empirical evidence and logical argumentation, not by appeal to intuition alone. We agree that "understanding" is not a magical property but a natural phenomenon that must be explained either by functional role or by internal causal structure.
  5.  **Falsifiability:** We agree that the Stochastic Parrots hypothesis is intended as an empirical claim that could, in principle, be falsified. It is not merely a definitional stipulation that "machines can never think." If an LLM demonstrated behaviors that could *only* be explained by the possession of a world model or semantic grounding (and not by statistical mimicry), the Stochastic Parrots position would require revision.

  ## Part II: Table of Disagreements

  The following table isolates the precise points of contention. For each disagreement, we identify the "Crux"—the specific sub-question that, if settled, would compel at least one side to revise their position. We also propose concrete tests or arguments relevant to that crux, recording our divergent predictions in advance.

  | # | Statement of Disagreement | The Crux | Concrete Test / Argument | Stochastic Parrots Prediction | Functionalist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Sufficiency of Behavior:**<br>SPT: Behavioral fluency is insufficient for understanding without grounding.<br>F: Behavioral fluency, if robust enough, constitutes understanding. | **Is behavioral equivalence sufficient for ascribing mental states?**<br>Does passing a Turing-style test warrant the attribution of understanding, or is the internal mechanism constitutive of the state? | **Systematicity & Compositionality Test:**<br>Train a model on a fragment of a formal language (e.g., specific logical operators). Test on novel combinations of those operators that were statistically improbable in training. | The model will fail or rely on shallow heuristics when statistical priors are removed. It will mimic structure without grasping the recursive rules. | The model will succeed. If it has learned the *function* of the operators, it will apply them systematically regardless of training frequency. |
  | **2** | **The Architectural Constraint:**<br>SPT: Next-token prediction optimizes for probability, not truth, making understanding impossible.<br>F: Next-token prediction is a proxy task that forces the learning of world models. | **Does the objective function preclude semantics?**<br>Can a loss function based on surface forms force the emergence of deep semantic representations? | **Mechanistic Interpretability (Truth vs. Probability):**<br>Identify internal representations corresponding to factual claims. Probe whether the model activates "truth" circuits when pressured to lie for reward, or if it only activates "probability" circuits. | Internal states will track statistical likelihood and instruction compliance, not a distinct representation of "truth." There is no "truth" variable, only "likely token" variables. | Internal states will disentangle factual accuracy from token probability. We will find circuits that represent world states distinct from the linguistic tokens used to describe them. |
  | **3** | **Grounding and Reference:**<br>SPT: Symbols must connect to the world to have meaning.<br>F: Symbols connect to other symbols (inferential role); world-connection is not strictly necessary for linguistic understanding. | **Is causal contact with the referent required for reference?**<br>Can a system refer to "apples" without ever having seen or touched one, purely via text? | **Out-of-Distribution (OOD) Physical Reasoning:**<br>Prompt the model with novel physical scenarios described textually (e.g., non-Newtonian physics) and ask for predictions that contradict common text tropes but follow the new rules. | The model will revert to common training tropes (hallucinate standard physics) because its "understanding" is tied to text correlation, not physical reality. | The model will adapt to the new rules provided in the context window, demonstrating that its "understanding" is flexible and rule-bound, not fixed by training corpus statistics. |
  | **4** | **Memorization vs. Generalization:**<br>SPT: Apparent reasoning is often lookup from training data.<br>F: Apparent lookup is often the result of generalized reasoning capabilities. | **To what extent is performance driven by verbatim recall?**<br>Is the model retrieving answers or computing them? | **Canary-String Memorization Check:**<br>Inject unique, random strings ("canaries") into training data with specific logical properties. Test if the model can apply the logic to new canaries vs. recalling old ones. | Performance on new canaries will degrade significantly compared to recalled ones. The model matches patterns, it doesn't process the logic of the string itself. | Performance will remain stable. The model extracts the logical rule associated with the canary format and applies it generally, independent of specific string recall. |

  ## Part III: Analysis of Verbal vs. Substantive Dispute

  After reviewing the claims and disagreements above, we conclude that the dispute is **hybrid**, containing both verbal and substantive elements.

  **1. The Verbal Component:**
  A portion of the disagreement stems from differing definitions of "understanding."
  *   The **Functionalist** is using a *role-functional* definition: If the system plays the role of an understander (inputs, outputs, intermediate processing), it is an understander.
  *   The **Stochastic Parrots Theorist** is using a *causal-grounding* definition: To understand, the system must have the right causal history or connection to the world (e.g., intentionality derived from biological evolution or embodied interaction).
  *   *Resolution:* If both parties agree to stipulate definitions (e.g., "Semantic Understanding" vs. "Syntactic Competence"), some friction dissolves. However, merely renaming the phenomenon does not solve the problem, because the label "understanding" carries ethical and legal weight.

  **2. The Substantive Component:**
  Despite the definitional overlap, there is a core substantive disagreement about **generalization limits and internal structure.**
  *   This is not merely about what we *call* the model, but about what the model *is* and what it will *do* in the future.
  *   If the Stochastic Parrots Theorist is right, we should expect models to hit a hard wall on tasks requiring genuine causal reasoning or novel grounding, regardless of scale. They will remain "approximators."
  *   If the Functionalist is right, we should expect capabilities to scale smoothly with compute and data, as the "understanding" is an emergent property of the statistical objective.
  *   *Conclusion:* The dispute is substantive because it generates divergent empirical predictions (as recorded in Part II). Settling the definition of "understand" does not settle the prediction of whether the model will fail on Out-of-Distribution physical reasoning. Therefore, the collaboration must focus on the empirical tests in Part II rather than semantic analysis alone.

  ***

  **Signed,**

  *The Stochastic Parrots Working Group*

  *The Functionalist AI Collective*
