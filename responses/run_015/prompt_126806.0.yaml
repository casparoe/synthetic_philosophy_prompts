  2.  **If You Don't Pay:** You act consistent with a "No Pay" disposition. If you do this, you are effectively forcing the logical state where the Model was *Wrong*. If the Model was Wrong (Predicted "Pay", You "Don't Pay"), then for the email to have been sent, **Folder Exists must be True**.

