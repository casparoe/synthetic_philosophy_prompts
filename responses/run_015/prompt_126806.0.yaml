  Okay, pour me another drink. We've got ten hours, but if we're going to untangle this, I need to think out loud for a minute. You've stumbled into two of the nastiest problems in modern decision theory, and your roommate is looking at them through a lens that was obsolete twenty years ago. But your friend who says "they're the same puzzle" is also missing a crucial distinction.

  Here is the breakdown. I'm going to walk through the logic of both stories, flag where the specific dollar amounts and probabilities matter, and then tell you what to do before midnight.

  ### Story One: The Counterfactual Mugging
  Your roommate is arguing from **Causal Decision Theory (CDT)**. His logic is: *The past is fixed. The coin flip happened. The prediction happened. Your $250 cannot causally reach back in time and change the coin flip or the wire transfer.* Therefore, paying is a guaranteed loss of $250 for zero gain. Mathematically, he's right *if* the universe only cares about causal chains in the actual timeline.

  But you felt it was "fine" because you were intuitively using something closer to **Timeless Decision Theory (TDT)** or **Functional Decision Theory (FDT)**. This view says: *You are not just making a decision now; you are outputting the result of an algorithm that the predictor simulated three months ago.*

  By paying, you aren't changing the past. You are confirming that you are the *type of agent* who pays when asked. If you are that type of agent, the model predicted "Pay." If the model predicted "Pay," you were eligible for the $20,000 in the branch where the coin landed Tails.
  *   **Ex-Ante Calculation:** Before the coin flip, a policy of "Pay if asked" has an Expected Value (EV) of roughly $9,750 (50% chance of $19,750 gain minus 50% chance of $250 loss).
  *   **Ex-Post Reality:** You are in the "Heads" branch. You lost the lottery. But paying validates the algorithm that wins the lottery in the other branches.

  **Verdict on Story 1:** You were right to pay. Your roommate is wrong. You paid a premium to be the kind of person who wins in counterfactual worlds.
  **Number Sensitivity:** This flips if the potential reward was lower. If the wire transfer was only $400 (instead of $20,000), the EV of the policy becomes negative, and CDT wins. It also flips if the model accuracy was very low (below ~50%), as the correlation between your payment and the prediction breaks down.

  ### Story Two: The XOR Blackmail
  This feels like Story 1, but the logical structure is different. This is a variant of the **XOR Blackmail Problem**.

  Here is the logic gate you are trapped in:
  **Email Sent $\iff$ (Folder Exists $\oplus$ Model Predicts "Pay")**
  *(Where $\oplus$ means "Exactly One Is True")*

  You have received the email. Therefore, we know for a fact that **Folder Exists** and **Model Predicts "Pay"** have opposite truth values. One is true, the other is false.

  **The Blog Post Trap:**
  You mentioned you wrote a blog post about paying in Story 1. The blackmailer trained the model on this.
