      *   Case 2: Distinct but equivalent. Binding handles this (direction/structure). Truth-Evaluable struggles if it relies on truth-conditions alone.
      *   Case 3: Necessary relations. Truth-Evaluable handles this (no further ground needed). Binding still asks 'what holds them?'.
      *   Conclusion on the readings: Binding is better for propositions, Truth-Evaluable is better for facts.
      *   The "Third Thing": The real issue is the distinction between *concepts* and *objects* (Frege) or the nature of *instantiation*. It's not about propositions specifically, but about how language hooks onto the world.
