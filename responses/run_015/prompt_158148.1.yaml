          *   *Truth-Evaluable:* Good for semantics, struggles with the "distinct but equivalent" case if truth-conditions are the only metric.
      *   **Testing the Cases:**
          *   *Case 1 (False):* Binding wins. Truth-evaluable risks making unity dependent on truth (facts vs. propositions).
