      *   **Synthesis/Verdict:** Neither survives perfectly alone. The distinction frays because the "binding" is a precondition for the "truth-evaluable."
      *   **The Third Thing:** Suggest the problem isn't just propositions or facts, but *predication* or *instantiation*. Or perhaps the distinction between *ontological dependence* and *logical form*. Let's suggest the problem is really about *categorial distinction* (the Fregean move) rather than unity per se.
