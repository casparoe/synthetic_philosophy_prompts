answer: |-
  This is an excellent brief. Your instinct about the "sneaky move" in the book chapter is correct: it conflates the *structural requirement* of expected utility (cardinal measurability) with the *substantive problem* of moral ontology (incommensurability), and then treats a specific objection to hedging as a general refutation.

  Here is a claim-by-claim breakdown, followed by an evaluation of the startups' design choices. I have flagged consensus views, live disagreements, and my own analytical observations.

  ### Part 1: Critiquing the Book Chapter

  **Claim 1: "Moral uncertainty is uncertainty about which moral theory is true, not just the facts."**
  *   **Verdict:** **Accepted.**
  *   **Context:** This is the standard definition in the literature (e.g., Ted Lockhart, William MacAskill). It distinguishes *moral uncertainty* from *descriptive uncertainty* (e.g., I know stealing is wrong, but I'm unsure if this act counts as stealing).

  **Claim 2: "The standard way of handling it is ordinary expected-value reasoning... Multiply how good each option looks by how likely it is that the theory... is true."**
  *   **Verdict:** **Mostly Accepted.**
  *   **Context:** This approach is called *Maximising Expected Choice-worthiness* (MEC). It is the dominant framework among philosophers working on this specific subfield. However, it is not the *only* view; a significant minority defend *My Favourite Theory* (MFT), which says you should just follow the theory you find most probable.
  *   **Correction:** It is not "ordinary expected-value reasoning" in the strict sense, because standard expected utility assumes a single utility function. MEC attempts to apply that structure across *different* utility functions.

  **Claim 3: "This usually hands you back the answer you already had: do what your favourite theory says."**
  *   **Verdict:** **Wrong.**
  *   **Context:** This is a significant misrepresentation. The primary motivation for MEC is precisely that it *often* diverges from MFT. The classic example is vegetarianism: you might be 90% confident in a theory that doesn't care about animals, but 10% confident in utilitarianism. If the utilitarian stakes (animal suffering) are high enough, MEC says "don't eat meat," while MFT says "eat meat." Hedging changes outcomes.

  **Claim 4 & 5: "The theories aren't measurable against one another... This is the normalisation problem."**
  *   **Verdict:** **Imprecise Terminology.**
  *   **Context:** Here is the conflation you suspected.
      *   **The Problem:** *Intertheoretic Comparison.* Utilitarianism measures in "utils" (welfare); Kantianism measures in "duties." There is no obvious exchange rate.
      *   **The Proposed Solution:** *Normalisation.* This is the mathematical process of rescaling theories to make them comparable (e.g., setting the variance of each theory to 1).
      *   **The Error:** The book presents normalisation as the *name* of the problem, rather than a contested *solution* to the problem of intertheoretic comparison.
  *   **Consensus:** Everyone agrees intertheoretic comparison is hard. There is **no consensus** on whether normalisation solves it.

  **Claim 6: "After decades of argument there's still no agreed solution, which effectively shelves the whole expected-value approach."**
  *   **Verdict:** **Exaggerated / One Side of a Disagreement.**
  *   **Context:** Proponents of MEC (MacAskill, Greaves, Tarsney) argue that *some* normalisation is better than none, and that we can make plausible assumptions (e.g., "variance normalisation") to make the maths work. Critics say without a metaphysical basis for comparison, the maths is garbage-in-garbage-out. To say it "shelves" the approach ignores the active, sophisticated work being done to refine normalisation methods.

  **Claim 7: "Hedging between theories is worse than useless... someone can construct a series of choices in which you pay to switch back and forth... which shows the hedging method is incoherent."**
  *   **Verdict:** **Contested / Likely Backwards.**
  *   **Context:** This refers to a *money pump argument*. The claim is that if your preferences aren't transitive (A > B > C > A), a bookie can pump you for cash.
      *   **The Twist:** In the literature, money pump arguments are often used *against* My Favourite Theory (MFT), not MEC. If your favourite theory changes depending on the context, MFT can lead to cycles. MEC is often defended specifically because it produces a coherent, single ranking of options, thereby *avoiding* money pumps.
      *   **Nuance:** There are specific money pump arguments against *certain types* of normalisation, but to claim it refutes hedging *simpliciter* is not a settled view. It is a live objection, not a knockdown.

  ---

  ### Part 2: The "Sneaky Move"

  You asked if the author merged two different problems. **Yes.**

  1.  **The Cardinality Problem:** Expected utility requires *cardinal* utility (knowing not just that A is better than B, but *how much* better). Many moral theories only offer *ordinal* rankings (A is better than B).
  2.  **The Commensurability Problem:** Even if Theory A and Theory B both offer cardinal scores, do their units match? Is 10 "utilons" equal to 10 "duty-points"?

  The book chapter treats these as the same obstacle. They are not. You can solve Cardinality (by assuming theories imply strength of preference) without solving Commensurability. The "normalisation" tricks are attempts to force Commensurability by fiat. The author implies that because Commensurability is unsolved, the maths is impossible. Philosophers working on MEC reply that we must make *some* assumption to act, and variance/range normalisation is the least bad assumption.

  ---

  ### Part 3: Evaluating the Startup Design Choices

  Here is where we move from theory to engineering. Both teams are attempting to implement "Range Normalisation" and "Dogmatism Constraints."

  #### Design 1: Min-Max Rescaling (0 to 100 per option set)
  *The tool rescales each theory so its favourite option is 100 and least favourite is 0, then averages.*

  *   **Does it work?** It solves the Commensurability problem by force, but it introduces a **Menu Dependence** problem.
  *   **Where the problem reappears:** This violates a principle called *Independence of Irrelevant Alternatives* (IIA).
      *   **Example:** Suppose you are choosing between Tea and Coffee.
          *   Theory A: Loves Tea (100), Hates Coffee (0).
          *   Theory B: Loves Coffee (100), Hates Tea (0).
          *   Result: Tie.
      *   Now, add a third option: Poison.
          *   Theory A: Loves Tea (100), Hates Poison (0). Coffee is now 50.
          *   Theory B: Loves Coffee (100), Hates Poison (0). Tea is now 50.
          *   Result: Still a tie.
      *   **The Glitch:** Now add an option that Theory A thinks is *worse* than Poison (e.g., Torture).
          *   Theory A: Tea is still best (100), Torture is worst (0). Poison and Coffee get rescaled upwards.
          *   Theory B: Unchanged.
          *   **Outcome:** The addition of "Torture" (which no one would choose) has changed the relative score of Tea vs. Coffee.
  *   **Verdict:** This makes the "moral recommendation" hostage to the menu. If the software developers curate the options poorly, they change the moral output.
  *   **Consensus:** Among decision theorists, Range Normalisation is known to violate IIA. It is a known trade-off: you gain comparability but lose context-independence.

  #### Design 2: Credence Floors and Ceilings (2% – 90%)
  *You cannot be less than 2% or more than 90% confident in a theory.*

  *   **Does it work?** It addresses **Dogmatism**, but fails to address **Pascal's Mugging**.
  *   **Where the problem reappears:**
      *   **The Good:** It prevents the user from assigning 0% credence to a theory. In Bayesian terms, if you assign 0% credence, no amount of evidence can ever update you back. A 2% floor keeps the door open for revision.
      *   **The Bad:** It does not solve the "Stakes" problem. If one theory on the menu is "Longtermism" (the value of the future is astronomically high) and another is "Common Sense Morality" (value is local), the 2% credence in Longtermism will mathematically swamp the 90% in Common Sense.
      *   **Example:** 2% credence in saving 1 trillion lives outweighs 98% credence in saving 100 lives. The floor ensures the "extreme" theory is never fully silenced, which means the tool will almost always recommend the option favoured by the theory with the highest *potential stakes*, regardless of how implausible that theory is.
  *   **Verdict:** This is a pragmatic safeguard against user overconfidence, but it does not solve the weighting problem. It arguably makes the "Pascal's Mugging" problem *worse* by guaranteeing a non-zero weight to high-stakes theories.
  *   **Consensus:** There is no consensus on how to handle low-credence, high-stakes theories. This is a major open problem in effective altruism and moral uncertainty literature (see: Nick Bostrom on Pascal's Mugging).

  ### Part 4: Can the Number Be "What You Ought to Do"?

  You asked: *"Is there any reading on which the number the tool prints out is genuinely the thing you ought to do, rather than a number it can defend?"*

  *   **My Analysis:** No. Not in the objective sense.
  *   **Reasoning:** The tool outputs a recommendation based on *subjective credences* (the sliders) and *subjective normalisation* (the 0-100 scaling).
      *   If the user sets the sliders wrong, the output is wrong.
      *   If the normalisation method (Min-Max) is flawed (due to menu dependence), the output is unstable.
  *   **The Defence:** The best the teams can claim is that the tool enforces **procedural rationality**. It ensures that *given* your stated uncertainties and *given* a specific method of comparison, this is the consistent choice. It defends the *coherence* of the decision, not the *truth* of the outcome.
  *   **Journalistic Angle:** This is the crucial distinction. The tool is not an "Ethics Oracle"; it is an "Ethics Calculator." It calculates the implications of your own uncertainty, not the implications of the Universe's morality.

  ### Summary for Your Piece

  1.  **The Book:** Is broadly right about the difficulty (intertheoretic comparison) but wrong to imply the field is stalled or that hedging is incoherent. It conflates the problem with the proposed solution.
  2.  **Startup 1 (Rescaling):** Solves the "units" problem by making the answer dependent on the menu options. This is a known bug in decision theory (violating IIA), not a feature.
  3.  **Startup 2 (Floors):** Prevents dogmatism but guarantees that extreme, high-stakes theories dominate the output, potentially leading to counter-intuitive recommendations (Pascal's Mugging).
  4.  **The Verdict:** These tools do not solve moral uncertainty. They **operationalise** it. They force users to make trade-offs explicit, which is valuable, but the output is only as robust as the contested philosophical assumptions hardcoded into the software.

  **Key Names to Check:**
  *   **William MacAskill:** *Uncertainty* (Thesis/Book). The main proponent of MEC.
  *   **Ted Lockhart:** *Moral Uncertainty and Its Implications*. Early foundational work.
  *   **Christian Tarsney:** Contemporary work on intertheoretic comparison.
  *   **Hilary Greaves:** Work on coherence and decision theory.
  *   **Jacob Ross:** Criticisms of normalisation approaches.

  **Consensus Flags:**
  *   **Settled:** Moral uncertainty is distinct from factual uncertainty. Intertheoretic comparison is the central technical hurdle.
  *   **Disputed:** Whether MEC is the correct framework (vs. MFT). Which normalisation method is best (Variance vs. Range). Whether money pumps refute hedging.
  *   **My View:** The startups are building "coherence engines," not "truth engines." Their value is in exposing user inconsistency, not in providing moral truth.
