prompt: |-
  Hi — I write on science and ideas for a UK paper, and I'm doing a piece on a handful of small teams building what they call 'ethics engines': software where you describe a decision, set sliders for how confident you are in various moral theories, and it gives you a recommendation. I'm not a philosopher and I don't want the piece to be either credulous or a lazy sneer, so I'm trying to get the underlying literature straight first.

  I picked up a popular philosophy book over Christmas — one of those brisk ones written by a science writer, I won't name it — with a chapter on moral uncertainty. My notes of it read roughly like this:

  'We are never fully certain what we ought to do, and part of that uncertainty isn't about the facts at all: it's about which moral theory is the true one. Maybe consequentialism is right, maybe some form of deontology, maybe virtue theory, maybe something nobody has thought of yet. Philosophers call this moral uncertainty, and the standard way of handling it is ordinary expected-value reasoning — the same maths you'd apply to any gamble. Multiply how good each option looks by how likely it is that the theory saying so is the true one, add them up, and do whatever comes out on top. The surprise is that this usually hands you back the answer you already had: do what your favourite theory says. The reason is that the theories aren't measurable against one another — one counts units of welfare, one counts duties kept, one talks about character — and no one has worked out how to put those on a single scale. This is the normalisation problem, and after decades of argument there's still no agreed solution, which effectively shelves the whole expected-value approach. The practical upshot is that you should just act on whichever theory you find most plausible. Hedging between theories is worse than useless: split the difference and you satisfy neither theory, and someone can construct a series of choices in which you pay to switch back and forth and end up worse off by your own lights, which shows the hedging method is incoherent.'

  That's my paraphrase of a paraphrase, so allow for some drift, but it's close.

  Could you go through it claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong? I'd rather you didn't park everything in 'it's complicated'. My instinct is that the chapter is doing something sneaky in the middle — it makes moral uncertainty sound like straightforward expected utility under risk, and then says the numbers can't be put on a common scale, and I can't tell whether those two complaints are the same complaint or whether the author has merged two different problems. I also don't trust the bit about hedging being refuted by that betting example; it definately sounds like one objection doing the work of a knockdown argument.

  One more thing, and this is the bit I actually need for the piece. Two of the teams I'm profiling have made design choices that seem to me to be direct responses to the chapter's complaints, and I want to know if they work:

  1. To get round the normalisation problem, their software doesn't try to find a shared moral scale. Instead each theory on the menu scores every available option, then the scores are rescaled within that option set — the option a theory likes best gets 100, the one it likes least gets 0, everything else is spread in between — and only then does the tool take the credibility-weighted average across theories.

  2. There's a confidence floor and ceiling: you can't set any theory below 2% or above 90%. Their argument is that you should never be certain in ethics, and that you can't rule out a theory just because you haven't heard of it.

  Does either of those survive once the chapter's mistakes are corrected, or do they just relocate the problem — and if so, where exactly does it reappear? Does the rescaling trick make the recommendation hostage to which options happen to be on the menu? Does the 2% floor do any real work, given that a small credence in a theory that cares about enormous stakes might swamp everything else? And is there any reading on which the number the tool prints out is genuinely the thing you ought to do, rather than a number it can defend?

  Finally, since I'm quoting people: please be explicit about which of your claims are settled among people who work on this and which are one side of a live disagreement, and flag anywhere you're giving me your own view rather than the field's. I'd rather print a genuine fight than invent a consensus that isn't there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science/ideas writer for a UK paper. Knowledgeable but not a philosopher. Wants accuracy without jargon-heavy obfuscation or lazy skepticism.
      *   **Task:** Critique a paraphrased summary of a popular philosophy book chapter on moral uncertainty. Evaluate two specific design choices made by "ethics engine" startups based on that critique.
      *   **Constraints:** Don't say "it's complicated." Distinguish between settled views, live disagreements, and my own analysis. Be specific about where arguments fail or succeed.
      *   **Key Issues Identified by User:**
          *   Is moral uncertainty just expected utility under risk?
          *   Is the "normalisation problem" the same as the "intertheoretic comparison problem"?
          *   Is the "money pump" argument against hedging a knockdown refutation?
          *   Do the startups' solutions (min-max normalisation, credence floors/ceilings) actually solve the philosophical problems or just move them?

  2.  **Deconstruct the Book Chapter Paraphrase (Claim by Claim):**

      *   *Claim 1: Moral uncertainty is uncertainty about which theory is true, not just facts.*
          *   **Verdict:** Correct/Standard. This is the definition of moral uncertainty (vs. descriptive uncertainty).
      *   *Claim 2: Standard way of handling it is expected-value reasoning (MEC - Maximising Expected Choice-worthiness).*
          *   **Verdict:** Mostly Correct. This is the dominant view (MacAskill, Lockhart, etc.), though not unanimous.
      *   *Claim 3: This usually hands you back the answer you already had (do what your favourite theory says).*
          *   **Verdict:** Wrong/Misleading. Hedging often *does* change recommendations (e.g., vegetarianism arguments).
      *   *Claim 4: Theories aren't measurable against one another (intertheoretic comparison problem).*
          *   **Verdict:** Correct. This is the core technical hurdle. Utilitarianism uses "utils," Kantianism uses "duties."
      *   *Claim 5: This is the normalisation problem.*
          *   **Verdict:** Slightly Imprecise. "Normalisation" is a *solution* attempt to the "intertheoretic comparison" problem. The problem exists regardless of normalisation.
      *   *Claim 6: No agreed solution, effectively shelves the expected-value approach.*
          *   **Verdict:** Exaggerated. It limits it, but doesn't shelve it. Many philosophers work on normalisation.
      *   *Claim 7: Hedging is incoherent/refuted by money pumps.*
          *   **Verdict:** Contested/Wrong. Money pump arguments exist (e.g., against cyclic preferences), but applying them to moral hedging is a live debate. Many proponents of MEC argue hedging is *required* for coherence.

  3.  **Analyze the "Sneaky Move" (User's Instinct):**
      *   The user suspects the author conflates "expected utility under risk" with "intertheoretic comparison."
      *   **Analysis:** The user is right. Expected utility requires cardinal utility. Moral theories often provide only ordinal rankings or incomparable units. You can't multiply credence (0-1) by "goodness" if "goodness" has no unit. The book presents this as a fatal flaw; philosophers see it as a technical constraint to be solved (e.g., via variance normalisation).

  4.  **Evaluate the Startup Design Choices:**

      *   **Design 1: Min-Max Normalisation (0-100 scale per option set).**
          *   *Mechanism:* For Theory A, Best Option = 100, Worst = 0. Same for Theory B. Then average.
          *   *Philosophical Critique:* This is "Variance Normalisation" (specifically a range-based version).
          *   *Problem:* It makes the value of an option dependent on the *menu* (context dependence). If I add a terrible option, the "0" shifts, changing the relative value of the good options. This violates "Independence of Irrelevant Alternatives" (IIA).
          *   *Verdict:* It solves the unit problem but creates a menu-dependence problem. It's a known trade-off in the literature (MacAskill discusses this).
      *   **Design 2: Credence Floors/Ceilings (2%-90%).**
          *   *Mechanism:* Prevent dogmatism.
          *   *Philosophical Critique:* Prevents assigning 0 credence (Pascal's Wager style issues).
          *   *Problem:* If a theory has infinite/near-infinite stakes (e.g., religious hell, or extreme longtermism), even 2% dominates. Also, why 2%? Arbitrary.
          *   *Verdict:* Pragmatically sensible for avoiding dogmatism, but doesn't solve the "swamping" problem if one theory has vastly higher stakes.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Professional, precise, journalistic-friendly (avoiding excessive formal logic notation but keeping the concepts sharp).
      *   *Structure:*
          1.  Intro: Acknowledge the user's sharp instinct.
          2.  Part 1: Claim-by-Claim breakdown of the book summary.
          3.  Part 2: The "Sneaky Move" (Intertheoretic vs. Normalisation).
          4.  Part 3: Evaluating the Startup Solutions.
          5.  Part 4: Consensus vs. Disagreement flags.
      *   *Key References:* William MacAskill (*Uncertainty*), Ted Lockhart (*Moral Uncertainty*), Christian Tarsney, Hilary Greaves. (Need to mention these names for the journalist to check).
      *   *Specific Corrections:*
          *   Clarify that MEC (Maximising Expected Choice-worthiness) is the standard model, not just "expected value."
          *   Clarify that normalisation is a proposed fix, not the name of the problem itself.
          *   Clarify that money pumps are a threat to *intransitivity*, not necessarily hedging itself, unless the hedging method is poorly defined.
      *   *Startup Evaluation:*
          *   Min-Max: Explicitly label this as violating IIA. It makes the "right" answer depend on the "wrong" options available.
          *   Floors: Explicitly label the "Pascal's Mugging" risk.

  6.  **Refining the "Consensus" Flags:**
      *   *Settled:* Moral uncertainty is real/distinct. Intertheoretic comparison is hard.
      *   *Disagreed:* Whether MEC is the right framework (vs. My Favourite Theory). How to normalise (Variance vs. Range vs. Others). Whether money pumps refute hedging.
      *   *My View:* (Need to be careful here). I should present the philosophical landscape rather than my own ontological commitments. I will frame "My View" as "Analytical Observation" where the literature is thin.

  7.  **Final Review against User Constraints:**
      *   *UK Paper:* Use British spelling (normalisation, programme, etc.).
      *   *No "It's Complicated":* Be decisive. "This is wrong," "This is contested."
      *   *Address the "Sneaky Move":* Yes, distinguish between the *problem* (incommensurability) and the *mathematical requirement* (cardinality).
      *   *Startup Viability:* Be clear that these are engineering fixes to philosophical problems, which inevitably introduce new philosophical bugs.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say the money pump argument is nonsense.
      *   *Correction:* No, it's a valid concern in decision theory (acyclicity), but applying it to moral uncertainty is contested. MacAskill argues MEC *avoids* money pumps compared to MFT (My Favourite Theory). The book has it backwards or oversimplified.
      *   *Initial thought:* Say the 2% floor is useless.
      *   *Correction:* It's not useless; it prevents assigning *zero* probability to catastrophic theories. But it doesn't solve the weighting issue.
      *   *Check:* Did I explain *why* min-max is menu-dependent? Yes, adding a worse option changes the 0-point, scaling everything else up.

  9.  **Final Polish:** Ensure the distinction between "intertheoretic comparison" (the problem) and "normalisation" (the solution attempt) is crystal clear, as the user specifically flagged this confusion. (Proceed to generate output).

  *(Self-Correction Note on "Normalisation Problem"):* The user's text says "This is the normalisation problem." In the literature, the *problem* is usually called "Intertheoretic Comparison." *Normalisation* is the family of solutions (Variance, Range, etc.). I need to correct this terminology gently.

  *(Self-Correction on Money Pumps):* The book claims hedging leads to money pumps. Actually, *failing* to hedge (MFT) can lead to money pumps if preferences cycle across theories. MEC is often defended *as* the way to avoid pumps. I need to highlight this reversal.

  *(Startup 1 - MinMax):* This is essentially "Range Voting" normalisation. The specific flaw is "Cloning" or "Irrelevant Alternatives." If I add an option that Theory A hates but Theory B loves, it shifts the scale.

  *(Startup 2 - Floors):* This addresses "Dogmatism." But the "Swamping" problem (Pascal's Mugging) remains if one theory posits infinite value.

