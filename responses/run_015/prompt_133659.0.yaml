answer: |-
  Good morning, everyone. Thanks for coming.

  Looking around the room, I know we're coming at this from two very different angles. Half of us are ready to talk about *li*, the *wu lun*, and the textual history of filial piety. The other half of you are here because you've sat in living rooms where "family obligation" feels less like a virtue and more like a trap. Usually, these two conversations talk past each other. The theorists talk about ideal harmony; the practitioners talk about burnout and abuse.

  I want to start today by messing with that divide. I want to talk about a glitch in the system.

  We're taught that Confucian ethics is rigidly hierarchical. Father over son. Husband over wife. Duty flows up, protection flows down. But I was reading some later commentaries—stuff from the late Ming period—and I found something weird. There's an argument there that the *friend* role—the *peng*—actually holds a kind of veto power over the father-son bond.

  The text suggests that if a father is being unjust, if he's violating the very spirit of the relationship, a friend has the authority to step in and correct him. Not to destroy the family, but to save the relationship from itself.

  For those of you in social work, I know this sounds obvious. You see it every day. You know that sometimes "just do your duty" is dangerous advice. You know that when a family system becomes toxic, the healthy move is often to bring in an outside perspective—a friend, a neighbor, a professional—to say, "Wait, this isn't right." This idea validates your work. It says that care isn't just about internal loyalty; it's about external accountability.

  But for my fellow philosophy nerds, I don't think this means we throw out the roles. We don't need to celebrate tearing the structure apart. Instead, this suggests the structure is smarter than we give it credit for. The roles aren't silos; they're checks and balances. The friend isn't breaking the hierarchy; they're preserving the moral integrity of the father-son bond so it doesn't collapse into tyranny.

  So, as we start this workshop, I want us to hold both things. For the practitioners: How do we intervene without dismissing the value people find in these roles? For the theorists: How do we talk about obligation without ignoring when those obligations become harmful?

  Let's figure out how the "friend" gets a seat at the table without kicking the "father" out of the room.

  Thanks.
