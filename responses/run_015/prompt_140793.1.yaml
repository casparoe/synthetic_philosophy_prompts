      You asked for a mapping of the Google IBM exchange through the machinery of complexity theory, stripping away the press release language to see what the formalism actually supports. The central tension here is a category error between the relata of complexity theory and the relata of experimental physics. Complexity theory deals with families of problems parameterized by input size n as n approaches infinity, assigning them to classes based on asymptotic resource scaling. The experiment presented a single finite instance, fixed at 53 qubits and depth 20. When Google claimed quantum supremacy, they were asserting a statement about a complexity class separation based on data from a single point on the curve. Strictly speaking, complexity theory cannot license a claim about what no classical computer can do based on a single instance, because for any fixed input size, the runtime is a constant. The difference between 200 seconds and 10,000 years is a constant factor, roughly a million, and asymptotic machinery quotients out constant factors by definition. Therefore, the theory licenses only a claim about scaling trends, not absolute thresholds at fixed width. Google's statement that speedup is achievable in a real-world system is an engineering claim bolstered by complexity conjectures, but the supremacy claim itself rests on extrapolating the hardness of the family from the hardness of the instance.

      This brings us to IBM's objection, which is fascinating because it exploits the blind spots of standard complexity models. Complexity theory typically assumes a random access machine model where memory is uniform and infinite, or at least where disk access is not the bottleneck. IBM argued that by utilizing secondary storage, the classical simulation could be done in 2.5 days. This is an objection about the cost model, specifically the hierarchy of memory and the price of hardware resources, which complexity theory defines itself as indifferent to. Theory cares about polynomial versus exponential, not RAM versus disk. So, was IBM's objection one the theory can express? Only if we refine the classical cost model to include memory hierarchy constraints, which is usually the domain of concrete complexity or engineering. The theory itself remains silent on whether a factor of a million matters, or whether disk storage is a valid resource to count against the quantum clock time. This silence is where the disagreement lives. Google assumed a cost model where state vectors must fit in RAM; IBM relaxed that constraint. Both are valid within different cost models, but neither is dictated by abstract complexity classes.

