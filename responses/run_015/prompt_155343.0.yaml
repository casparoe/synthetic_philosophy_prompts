answer: |-
  ok here's the map. i'm treating these as the hurdle tests any well-being theory needs to clear before we even start arguing about pleasure vs. objectives. the focus is heavily on the Experience Machine (EM) variants, specifically the memory-wipe toggle case.

  ### desiderata for a well-being theory

  **1. Reality Weighting**
  *   **The Requirement:** The theory must explain why a life lived in contact with reality is intuitively more valuable than a subjectively identical life in a simulation, even if pleasure levels are matched.
  *   **Driver:** Original Nozick EM. The "hollowness" intuition.
  *   **Status:** Non-negotiable (for any theory wanting to capture common sense).
  *   **Conflict:** Directly incompatible with Pure Hedonism. Hedonism cant account for why the source of the pleasure matters.

  **2. Ontological Independence (The Toggle Test)**
  *   **The Requirement:** Well-being status must depend on the *actual* mode (real vs. sim) even if the subject has no memory of which mode they were in due to amnesia wipes upon switching.
  *   **Driver:** Modified EM (Amnesia-Toggle). If you forget you were in the sim, did you still lose something? Intuition says yes, the *time* was wasted regardless of memory.
  *   **Status:** Non-negotiable.
  *   **Conflict:** Tension with **Empirical Retrospection** (see #5). If the subject doesn't remember the switch, their retrospective report won't show a dip, but the theory claims there was a deficit. Hard to reconcile metaphysical loss with phenomenological silence.

  **3. Causal Contact vs. Deception**
  *   **The Requirement:** Must distinguish between being actively lied to (deception) and merely lacking causal contact with reality (disconnection). The badness should persist even if you *know* you're in a sim and consent to it.
  *   **Driver:** "Voluntary Simulation" variants. If you know it's fake but enter anyway, it still feels like a lesser life than doing the real thing.
  *   **Status:** Negotiable (some argue consent fixes it, but most say no).
  *   **Conflict:** None specifically, but puts pressure on Desire Theory (if you desire the sim, is it good?).

  **4. Preference Resilience**
  *   **The Requirement:** The theory must allow that a person can prefer a simulated state (or toggle into it) while still being objectively worse off than in the real state. Preferences can be misguided regarding well-being.
  *   **Driver:** Addiction/Escape intuition. Just because toggle-users prefer the sim stretches doesn't mean those stretches are better for them.
  *   **Status:** Non-negotiable.
  *   **Conflict:** Directly incompatible with Pure Desire-Satisfaction Theory. If desire satisfaction = well-being, you cant say preferred sims are worse.

  **5. Empirical Retrospection**
  *   **The Requirement:** Must align with how people actually report feeling after long-term isolation or clinical VR protocols. Usually involves a sense of unreality, disorientation, or retrospective downgrading of the experience once "back in reality."
  *   **Driver:** Psych studies on isolation/VR. People often feel the time was "lost" even if it was pleasant at the time.
  *   **Status:** Negotiable (data is messy, but generally supports Reality Weighting).
  *   **Conflict:** Tension with **Ontological Independence**. If the amnesia wipe works perfectly, subjects *won't* report a difference, but the theory says there is one. Theory risks becoming unmoored from subject experience entirely.

  ---

  ### quick theory scorecard

  **Hedonism**
  *   **Reality Weighting:** FAIL. Pleasure is pleasure, source doesn't matter.
  *   **Toggle Test:** FAIL. If qualia are same, well-being is same.
  *   **Preference Resilience:** PASS (doesn't care about preferences).
  *   **Empirical Retrospection:** FAIL. Cant explain the "hangover" effect if pleasure was maxed.
  *   **Verdict:** Basically dead on arrival for this specific dataset of objections.

  **Desire-Satisfaction**
  *   **Reality Weighting:** FAIL (unless desires are about reality, but then why prefer sim?).
  *   **Toggle Test:** FAIL. If you don't desire reality contact during the sim, you're fine.
  *   **Preference Resilience:** FAIL. If user prefers sim, theory says they are better off.
  *   **Empirical Retrospection:** MIXED. Depends on if desires change upon return.
  *   **Verdict:** Struggles hard with the idea that we can want what's bad for us (the sim).

  **Objective-List**
  *   **Reality Weighting:** PASS. Reality contact is an objective good.
  *   **Toggle Test:** PASS. Sim time lacks the objective good regardless of memory.
  *   **Preference Resilience:** PASS. Can override user preference.
  *   **Empirical Retrospection:** PASS. Can explain the "something was missing" feeling.
  *   **Verdict:** Best fit, though risks being paternalistic. Might need to explain *why* reality is on the list without just begging the question.

  ---

  **note on incompatibilities:**
  The biggest friction is between **Ontological Independence** and **Empirical Retrospection**. If the theory says you're worse off in the sim even when you dont know it (amnesia), the theory is making a claim that is invisible to the subject. This makes the theory robust against deception but vulnerable to the charge that it ignores the "what it's like" factor entirely. You basically have to choose: either well-being is partly external (Obj-List) or it's wholly internal (Hedonism/Desire). You cant have both full Reality Weighting and full Subjective Authority.
