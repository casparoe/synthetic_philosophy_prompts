answer: |-
  This is a sophisticated diagnosis of a stalled field. You have correctly identified that the debate has shifted from a disagreement about *phenomena* (everyone agrees culture evolves) to a disagreement about *process* (how it evolves), while relying on data that is often compatible with both process models.

  Here is a diagnosis of the situation, an evaluation of your indistinguishability claim, a roadmap for progress, and an assessment of the memeticist's unfalsifiable core.

  ### 1. Diagnosis: Substantive, Empirical, and Verbal (The Trilemma)

  The disagreement is not just one of these; it is a entanglement of all three.

  *   **Substantive:** The two camps propose distinct cognitive architectures. Memetics relies on mechanisms of high-fidelity imitation (mirror neurons, dedicated copying modules). Cultural Attraction Theory (CAT) relies on inferential reconstruction (theory of mind, intuitive ontologies). These are different claims about human psychology.
  *   **Empirical:** As you note, the available data (population distributions, historical records) are largely static or coarse-grained. They show the *output* of the system, not the *transmission function*.
  *   **Verbal:** The term "selection" is doing too much work. Memeticists use it to mean "differential retention of copied variants." CAT proponents argue that if the variation is *biased* by reconstruction rather than random, "selection" is the wrong term for the sorting mechanism. Similarly, "fidelity" conflates *copying accuracy* (process) with *content stability* (outcome).

  **Verdict:** It is a **substantive disagreement about causal mechanisms that has become an empirical stalemate because the standard data sources cannot distinguish the mechanisms, exacerbated by verbal ambiguity regarding key terms.**

  ### 2. Where Your Indistinguishability Claim Fails

  Your hypothesis—that lossy transmission + attractor $\approx$ faithful copying + selection at equilibrium—is mathematically sound regarding **stationary distributions**. If you only look at the final histogram of cultural traits, the two models are often observationally equivalent.

  However, the indistinguishability claim fails in three specific domains:

  **A. The Structure of Variation (Directed vs. Random)**
  In the standard selectionist picture, variation is random with respect to fitness (blind mutation), and selection is directional. In the attraction picture, variation is *directed* (biased mutation) toward the attractor.
  *   *The Test:* In a transmission chain, memetics predicts a random walk away from the source (drift) until selection prunes the unfit. CAT predicts a directed walk *toward* the attractor, even if the source was already "fit."
  *   *Failure Point:* If you observe variants transforming *toward* a cognitive bias even when that transformation reduces memorability or transmissibility in a copying sense, the memetic model struggles without ad hoc adjustments to the "fitness landscape."

  **B. Phylogenetic Signal**
  Memetics predicts a tree-like structure of descent (cladistics). If copying is the primary mechanism, shared history explains shared traits. CAT predicts convergence. If reconstruction is primary, unrelated populations should converge on similar traits independently due to shared cognitive attractors.
  *   *Failure Point:* If we find high similarity between populations with no contact history (beyond what ecology dictates), CAT is favored. If similarity tracks contact history perfectly even when traits are cognitively "unnatural," Memetics is favored. Currently, data is mixed, but the *pattern* of residuals distinguishes the models.

  **C. Response to Perturbation (The Causal Structure)**
  You identified this correctly. The models diverge under intervention.
  *   *Perturb the Channel:* If you increase copying fidelity (e.g., switch from oral to written transmission), Memetics predicts a massive increase in cumulative complexity. CAT predicts less change, because the bottleneck is reconstruction, not transmission fidelity.
  *   *Perturb the Mind:* If you alter the cognitive attractor (e.g., through developmental priming or changing intuitive ontologies), CAT predicts the cultural content shifts. Memetics predicts the content stays the same provided the copying mechanism remains intact.

  ### 3. What Counts as Progress?

  To break the stalemate, the field needs to move away from fitting equilibrium distributions and toward **process identification**.

  1.  **Formal Identifiability Results:** We need mathematical proofs demonstrating under what conditions time-series data from transmission chains can distinguish "biased mutation" (CAT) from "random mutation + selection" (Memetics). Recent work by Claidière and Sperber suggests they are distinguishable if the *rate* of transformation is measured, not just the endpoint.
  2.  **Micro-Genetic Experiments:** Instead of looking at cultures over centuries, look at "cultures" over hours in the lab.
      *   *Design:* Create a "fitness landscape" where the cognitive attractor conflicts with the selection pressure (e.g., a story that is cognitively natural but hard to copy accurately vs. one that is unnatural but easy to copy).
      *   *Progress:* If the cognitively natural story wins despite copying difficulties, CAT wins. If the easy-to-copy story wins despite cognitive unnaturalness, Memetics wins.
  3.  **Domain Specificity:** Abandon the quest for a "Universal Theory." Progress may lie in mapping which domains are meme-like and which are attractor-like.
      *   *Hypothesis:* Technology and ritual syntax might be memetic (require high fidelity). Folk biology and morality might be attractor-based (reconstructed).
      *   *Progress:* A taxonomy of cultural domains based on their transmission mechanics.
  4.  **Adopt a Process Distinction:** Stop arguing about whether culture *is* evolutionary. Start distinguishing between **Replicator Dynamics** (copying) and **Transformer Dynamics** (reconstruction). Progress comes from measuring the ratio of replication to reconstruction in specific contexts.

  ### 4. The Unfalsifiable Memetic Claim

  You ask if there is a version of the memeticist's claim no finding could overturn.

  **Yes.** It is the claim that **"Culture is a Darwinian process."**

  If "Darwinian process" is defined functionally as "any system exhibiting variation, heredity, and differential fitness," then the claim is a tautology. CAT proponents admit there is variation, heredity (of a sort), and differential retention. Therefore, under this definition, CAT *is* a form of Darwinism. If the memeticist retreats to this definition, they cannot be falsified, but they also lose the explanatory power of the specific mechanism (replication).

  **Is this fatal?**
  *   **Empirically:** Yes. A theory that explains everything explains nothing. If "selection" covers both blind sorting and biased reconstruction, the term loses its mechanistic bite.
  *   **Methodologically:** No. This is where the claim does useful work. As Dennett argues, adopting the "intentional stance" or the "design stance" can be heuristically powerful even if the underlying substrate isn't a perfect match. Treating culture *as if* it were replicating can generate successful predictions about competition and spread, even if the cognitive reality is reconstruction.

  **The Fatal Flaw:** The flaw arises only if the memeticist makes an **ontological claim** (that discrete, copyable replicators *exist* in the brain or environment) while retaining the **functional definition** when challenged.
  *   If they claim replicators are real entities: They are falsifiable (by showing transmission is always reconstructive).
  *   If they claim replicators are useful abstractions: They are safe, but must admit CAT is an equally valid abstraction.

  ### Summary Recommendation

  Your hypothesis is largely correct: the field is stalled because population-level data is insufficient to discriminate the causal structures. The indistinguishability holds at equilibrium but breaks during dynamics and perturbation.

  **The path forward:**
  1.  **Stop asking "Which is true?"** and start asking "What is the ratio of replication to reconstruction in domain X?"
  2.  **Demand process data.** Equilibrium distributions are insufficient. We need transmission chain data that tracks the *trajectory* of change, not just the destination.
  3.  **Clarify "Fidelity."** Distinguish *Copy Fidelity* (process) from *Content Stability* (outcome). Memetics requires the former; CAT explains the latter without it.
  4.  **Accept Methodological Pluralism.** Memetics may be the right "software" description for high-fidelity domains (writing, digital media), while CAT is the right "hardware" description for oral, inferential domains.

  The debate will only resolve when researchers stop trying to prove one mechanism is universal and start measuring the boundary conditions where one dominates the other.
