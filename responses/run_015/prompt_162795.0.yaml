answer: |-
  Your memory of the Bickel, Hammel, and O'Connell (1975) data is structurally sound for this argument. The aggregate showed a ~9% gap (44% men vs. 35% women); the stratified data showed parity or a slight reverse bias; the mechanism was differential application rates to high-selectivity departments.

  You are correct that this case is the stress test. The kidney stone example (Charig et al., 1986) is mathematically identical but causally sterile—stone size doesn't care about the treatment choice. Berkeley is causally dense. Here is the mapping and dismantling you asked for.

  ### 1. The Confounder vs. Mediator Trap (The Laundering Test)

  Your hypothesis is correct: **Department is a mediator of societal bias, but a confounder of admissions bias.** Whether conditioning on it "launders" the result depends entirely on which causal question you are asking.

  Let's draw the DAG (Directed Acyclic Graph):
  *   **S:** Sex (Applicant)
  *   **D:** Department Choice
  *   **A:** Admission Decision
  *   **Q:** Qualification (Unobserved/Latent)

  **The Pathways:**
  1.  $S \rightarrow D$: Societal norms, advising, and pipeline issues push women toward certain departments (e.g., Humanities) and men toward others (e.g., Engineering).
  2.  $D \rightarrow A$: Departments have different base rates of admission (selectivity/funding).
  3.  $S \rightarrow A$: Direct discrimination by the committee (the bias we usually want to detect).
  4.  $Q \rightarrow D$ and $Q \rightarrow A$: Qualified people choose competitive depts and get admitted.

  **The Laundering Test:**
  If your causal query is **"Is the admissions committee discriminating?"** (Disparate Treatment), then $D$ acts as a confounder for the relationship between $S$ and $A$ *within the committee's context*. The committee sees the application and the department; they do not control the department choice. To isolate the committee's effect ($S \rightarrow A$), you *must* condition on $D$. If you don't, you attribute the department's selectivity to the committee's bias. In this frame, conditioning is correct; it does not launder bias, it isolates the specific mechanism of *committee* bias.

  If your causal query is **"Is the university system producing equitable outcomes?"** (Disparate Impact), then $D$ is a **mediator** on the path $S \rightarrow D \rightarrow A$. The "bias" is encoded in the social pressures that funnel women into low-admission-rate departments. By conditioning on $D$, you block this path. You are effectively saying, "Given that society has already funneled these women into English, did the committee treat them fairly?" That answers the committee question, but it statistically erases the pipeline question.

  **Verdict:** Your "laundering test" bites hard. The Berkeley analysis exonerated the *committees* (mostly) but implicitly laundered the *institution's* role in maintaining a segregated pipeline. The statistical adjustment was valid for the narrow question asked (committee intent) but invalid for the broad question implied (institutional equity). The data alone cannot distinguish these; only the causal model can.

  ### 2. Agency and the Sure-Thing Principle

  You have identified the tension between the **Sure-Thing Principle** (Savage) and **ecological agency**.

  The Sure-Thing Principle states: If action $A$ is preferred to action $B$ under every possible state of the world $S_i$, then $A$ is preferred to $B$ overall.
  In Berkeley terms: If being a woman yields equal or better admission odds than being a man *within every department*, then being a woman should yield equal or better odds overall.
  The paradox exists because the "state of the world" (Department) is **not independent** of the "action" (Sex). $P(D|S_{male}) \neq P(D|S_{female})$.

  **The Agent Mismatch:**
  *   **The Applicant:** Chooses $D$. For them, the conditional probabilities $P(A|S, D)$ are the actionable metrics. "If I apply to Engineering, does my sex hurt me?" The stratified table answers this. For the applicant, the paradox dissolves because they fix $D$.
  *   **The University:** Does not choose $D$; it receives the mix of $S$ and $D$. The marginal probability $P(A|S)$ is the metric of institutional output. "Did our process result in fewer women?" The aggregate table answers this.

  **Does SP distinguish these?**
  No. Simpson's Paradox is mathematically agnostic to agency. It simply signals that $S$ and $D$ are correlated. It emits two numbers: the marginal association and the partial association.
  *   To the applicant, the partial association is the truth.
  *   To the regulator (Title VII/Office for Civil Rights), the marginal association is the truth (Disparate Impact doctrine).

  The paradox doesn't tell you which question to ask; it tells you that **the answer depends on who holds the lever.** If you treat the aggregate number as the "truth" for an applicant, you commit an ecological fallacy. If you treat the stratified number as the "truth" for the institution, you commit a reductionist fallacy. The paradox forces you to declare *who is acting*. Without that declaration, the numbers are semantically void.

  ### 3. Partition Selection and the "Gerrymandering" Risk

  **Can you always find a partition to flip the sign?**
  Mathematically, yes, if you are allowed to slice arbitrarily (e.g., "Department + First Letter of Surname"). This is the risk of **over-stratification** or conditioning on colliders.

  **What licenses a partition?**
  It is not convention, stakes, or statistical significance. It is **causal sufficiency**.
  A partition is licensed if and only if the stratifying variable ($Z$) satisfies the **Backdoor Criterion** relative to the causal effect you wish to estimate.
  *   To estimate Total Effect ($S \rightarrow A$): Do not condition on mediators ($D$). Use the aggregate.
  *   To estimate Direct Effect ($S \rightarrow A$ avoiding $D$): Condition on $D$.
  *   To estimate anything else: You must ensure $Z$ is not a collider (e.g., don't stratify by "Received Scholarship" if Scholarship is caused by both Sex and Admission).

  **The Berkeley Lesson:**
  The "move available to anyone who dislikes an aggregate" is only available if they can plausibly argue the causal structure.
  *   **Defense:** "Department is a confounder of the admission decision." (Licenses stratification).
  *   **Prosecution:** "Department is a mediator of societal bias." (Licenses aggregation).

  The license comes from the **DAG**, not the table. If you cannot draw the arrows, you are not doing statistics; you are doing sorcery. The Berkeley case is robust because the arrow $S \rightarrow D$ (social pressure) and $D \rightarrow A$ (selectivity) are empirically observable and theoretically grounded. If the defense had stratified by "Hair Color," the partition would be rejected because there is no causal link $S \rightarrow \text{Hair} \rightarrow A$.

  ### 4. What Berkeley Does to Simpson's Paradox

  Your read is sharp: **Berkeley shows SP is a symptom of an ill-posed question, not a discovery about the world.**

  **Where SP is useful here:**
  1.  **Alarm Bell:** It prevents the naive error of assuming the aggregate correlation ($S \rightarrow A$) represents the causal mechanism. Without checking for SP, the university would have been falsely accused of committee bias.
  2.  **Variable Discovery:** It forces the search for the latent variable ($D$) that correlates with both $S$ and $A$. It drives causal discovery.

  **Where SP is silent (and undersold by textbooks):**
  1.  **Normative Weight:** SP tells you the numbers change when you stratify. It does *not* tell you which number matters morally or legally. Is pipeline bias ($S \rightarrow D$) as bad as committee bias ($S \rightarrow A$)? SP has no opinion. That is a policy decision.
  2.  **The "Why":** SP explains *that* the reversal happens (correlation between Sex and Dept). It does not explain *why* women applied to harder departments. Was it encouragement? Passion? Labor market signaling? The paradox ends where sociology begins.
  3.  **Actionability:** If the aggregate table was all Berkeley had in 1974 (no dept data), SP predicts they should *not* make a decision based on that table. It predicts instability. It does not tell them what to do instead.

  **The Reverse Impact:**
  The Berkeley case elevates Simpson's Paradox from a "statistical curiosity" to a **causal boundary marker**.
  *   **Pre-Berkeley:** SP is a trick where averages lie.
  *   **Post-Berkeley:** SP is a signal that you have conflated two different causal effects (Direct vs. Total).

  It shows that the "paradox" is only a paradox if you assume there is *one* true number describing the relationship between Sex and Admission. Berkeley proves there are *two* true numbers: the Direct Effect (committee fairness) and the Total Effect (systemic outcome). They are different quantities. Calling it a "paradox" implies one must be wrong. The lesson is that **both are right answers to different questions.**

  **Conclusion:**
  You aren't smuggling in a causal story; the data *demands* one. The Berkeley case validates your "Laundering Test": conditioning on a mediator hides the indirect effect. It validates your Agency Test: the "true" rate depends on who chooses the department. And it validates your suspicion about partitions: without a causal license, stratification is just data dredging.

  The paradox doesn't solve the bias; it dissolves the illusion that "bias" is a single scalar value waiting to be measured. It forces you to specify *which* bias you are hunting.
