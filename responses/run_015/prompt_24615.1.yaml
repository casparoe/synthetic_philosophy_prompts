      *   (7) Conclusion: (1) is false.

  3.  **Evaluate Potential Points of Rejection:**

      *   **Reject (1):** Abandon computational functionalism.
          *   *Cost:* High for the user. They want to keep this. It leads to biological naturalism or mysterianism.
      *   **Reject (2):** This is the standard move for computationalists. The definition of "implementation" or "running" is too weak.
          *   *Cost:* Need to provide a robust theory of implementation (causal structure, counterfactuals, intentionality). This is the most promising path.
