answer: |-
  Compromise is often celebrated as the distinctive virtue of democratic politics, the mechanism by which conflicting parties settle disputes without violence or domination. In both philosophical literature and political science modeling, the standard account of this mechanism proceeds on the model of exchange. Two parties with conflicting positions find a deal that leaves each better off than continued conflict, and the moral work is done by the fact that both consent to it, because the gains from trade justify the compromise. My project challenges the adequacy of this exchange model, specifically regarding deep moral disagreements. I argue that the gains-from-trade framework quietly assumes a settled pre-trade endowment. It assumes each party morally owns what it is trading away, and that what it gives up is a loss in the same currency as what it receives. In the cases that actually motivate the literature on compromise, both assumptions look shaky. When a minority agrees to the state's funding or toleration of a practice it regards as a grave wrong, in exchange for a majority concession on some unrelated matter, the minority is not giving up a preference; it is tolerating what it takes to be a wrong, and the gain it receives is denominated in interests while the cost it pays is denominated in commitments. There may be no common metric in which the deal is a net improvement for that party, even though the party would sign it and even though everyone agrees it is better than the alternative. Furthermore, the situation only looks like a trade at all because of a prior allocation of who gets to decide what, an allocation the parties disagree about, and disagreeing about which is part of what the dispute is. The framework's central explanatory device, mutual gain, may be borrowed from a picture of bargaining that already presupposes the dispute's resolution.

  This diagnosis leads to a precise research question. For which moral disagreements can gains-from-trade reasoning justify a compromise without presupposing a settlement of the disagreement itself, and what does the justification of compromise look like where it cannot? I aim to map the boundary conditions of the exchange model. I want to show that while trade-talk is legitimate in disputes over divisible goods or compatible interests, it becomes morally misleading in disputes over fundamental commitments where the cost of compromise is not merely a loss of utility but an act of complicity. The project seeks to provide a normative account of compromise that does not rely on collapsing distinct values into a single metric of satisfaction, thereby offering a more robust justification for political agreements than current models allow.

  Existing positions in the literature leave this question open because they either ignore the structural asymmetry of the bargain or misdescribe the moral cost involved. The mutual-advantage tradition, dominant in rational choice and contractarian approaches, treats compromise as a solution to a coordination problem. It assumes agents enter the bargaining space with fixed entitlements and seeks to maximize joint surplus. This view cannot account for cases where the entitlements are precisely what is contested, nor can it register the difference between sacrificing an interest and sacrificing a principle. On the other side, integrity-based objections and dirty-hands arguments treat compromise as a moral loss, a deviation from what right reason requires. While these views capture the phenomenology of moral cost, they often render compromise irrational or merely tragic, failing to explain why some compromises are politically legitimate even when they involve moral residue. Finally, there are treatments of compromise as a second-best device under conditions of reasonable disagreement, which justify compromise on epistemic grounds. These accounts suggest we compromise because we cannot be sure who is right. However, this does not cover cases where parties are sure they are right but lack the power to enforce it, or where the compromise itself validates a wrong they know to be a wrong. None of these positions adequately distinguish between compromises that are legitimate trades and those that are coerced accommodations masked as trades. My project fills this gap by isolating the structural conditions under which the exchange model is morally licensed.

  To answer this, I will employ a mixed method combining worked case studies with a semi-formal conceptual model. I have selected three cases that vary the relationship between interests and commitments: a religious exemption arrangement where a minority trades compliance for exemption; a climate burden-sharing agreement where future generations' interests are traded against current economic costs; and a transitional-justice deal in which amnesty is traded for truth. These cases are not chosen for historical completeness but for their structural clarity regarding the currencies at stake. I will analyze them not merely descriptively but as test beds for the normative model. The model itself will be semi-formal, representing agents not with scalar utility functions but with vector-valued functions where dimensions representing commitments cannot be aggregated with dimensions representing interests without explicit justification. This allows me to test whether the model returns the verdicts we want intuitively about the legitimacy of specific compromises. For instance, if the model shows that a climate agreement requires collapsing intergenerational rights into current utility discounts to appear beneficial, it flags the compromise as structurally suspect under the exchange model.

  I propose this specific methodology rather than the obvious alternatives for several reasons. Pure casuistry would lack the generalizability required to answer the research question about the class of disagreements where trade is legitimate. A fully formal bargaining model, while legible to the political scientist on the committee, would inevitably require the single-metric assumption I am challenging, thereby begging the question. Conceptual analysis of the word compromise is too linguistic and risks missing the institutional realities of how deals are struck. By combining cases with a lightweight formal structure, I can maintain philosophical precision regarding values while engaging the logic of bargaining that political scientists use. This ensures the project remains philosophy—concerned with justification and legitimacy—while being legible to a mixed committee. The model is not intended to generate predictions but to clarify the normative structure of the agreement.

  I am aware of a significant objection that I must address directly: that the two-currencies point is just the old incommensurability objection dressed up in bargaining vocabulary. If I am merely saying that some values cannot be compared, I am not saying anything new, nor am I explaining why political actors proceed as if they can be. My project needs to show it is saying something more than that. The distinction I draw is not merely that values are incomparable, but that treating them as comparable in a bargaining context presupposes a moral entitlement to the endowment being traded. The old objection says you cannot compare sanctity and money. My claim is that you ought not compare them via trade unless you have already settled who owns the sanctity. The project distinguishes between loss and complicity. A successful result will look like a characterization of the class of disagreements in which trade talk is legitimate, plus a diagnosis of what goes wrong elsewhere. I suspect the diagnosis turns on complicity rather than on loss. Where the exchange model fails, it is not because the parties cannot calculate the gain, but because the calculation itself implicates them in a wrong they claim to oppose. Failure would look like the model collapsing back into a single-metric picture under pressure to produce determinate results, or if my distinction turns out not to change any verdicts about any real case. If the two-currency model recommends the same compromises as the standard utility model in all three cases, the project has not earned its keep.

  To make this feasible for one person in twelve months, I must be disciplined about scope. I will not attempt a comprehensive history of the case studies. Instead, I will limit the historical excavation to the structural features relevant to the model, treating the cases as philosophical examples rather than political science case studies. I will also limit the formal model to its conceptual architecture rather than developing complex simulations. The goal is to demonstrate the logical possibility of the two-currency framework and its normative implications, not to build a tool for policymakers. I will prioritize the construction of the model and the analysis of one primary case study, using the others as comparative checks. This ensures I can complete the drafting and revision within the fellowship year.

  The significance of this project extends beyond academic taxonomy. For philosophers, it offers a way to discuss compromise without retreating into either cynicism or moralism. For political scientists, it highlights the hidden normative assumptions in bargaining models that are often treated as neutral tools. If the exchange model presupposes a settlement of the dispute it is meant to resolve, then using it to analyze legislative bargaining may obscure the very power dynamics that determine outcomes. By clarifying when gains-from-trade reasoning is legitimate, I hope to provide a more honest account of political agreement, one that acknowledges where compromise is a virtue and where it is merely a ceasefire disguised as a deal. This fellowship would allow me to focus exclusively on this synthesis, ensuring the argument is tight enough to survive the objection that it is too broad, and normative enough to survive the objection that it is not really philosophy. I believe this precision is achievable within the proposed timeframe and will result in a dissertation chapter that serves as a foundational statement for the broader project.
