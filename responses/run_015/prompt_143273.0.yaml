prompt: |-
  hey — I'm on a volunteer committee rewriting the decision procedure for a housing placement org, and I've ended up being the person who has to write the "what counts as a defensible decision around here" page. Concretely: a caseworker gets about 40 minutes with a family, the portal lets them flag at most five units before the family's voucher clock runs out, and we do this a few thousand times a year. So I don't want a theory of rationality in the abstract; I want a spec I could hand to a supervisor who has to audit a written procedure, and to a new caseworker who has to follow it on their second day. Every time I go looking for one I get told that full optimization is off the table for creatures like us and then nothing about what to demand of whatever replaces it.

  So: write me the desiderata. Not a reading list — the list of things a theory of bounded rationality or satisficing has to deliver to be adequate *for this purpose* (auditing and teaching a real procedure, not publishing a paper), with the case or consideration behind each, and a verdict on which are non-negotiable and which are just the prejudices of one camp.

  Things I think might be on the list, in no order, and I genuinely don't trust any of them:

  - the procedure has to be runnable by someone tired, with a stopwatch — it can't contain "solve an intractable problem" as a subroutine
  - it has to be teachable: a new caseworker with the manual beats a new caseworker told to use judgment
  - it has to be auditable by someone who knows *less* than the caseworker knew at the time (this is the one I care most about; most of what I've read seems to assume an evaluator with the agent's full information)
  - it has to be able to say no. There have to be procedures it condemns, and it can't rescue every bad call by positing an unmeasured mental cost afterwards — I've started calling this budget-laundering and I want to know whether that's a real constraint or just my irritation
  - it shouldn't grade the interface: if the same units surface in a different order, or the pool is carvable into neighborhoods vs. into price bands, and the theory's verdict flips, it's evaluating a description rather than a decision
  - it should say when to spend the budget on reshaping the choice environment instead of on thinking harder (the other blade of Simon's scissors, roughly)
  - it should handle the stopping question and the drift question: when do you take the fourth unit and stop looking, and is a caseworker whose standards quietly slide downward after three bad weeks adapting or failing?
  - it should survive the fact that we cannot measure cognitive effort in anything like cardinal units, so a theory needing a cost-of-thinking number may just be unimplementable for us — fair demand, or are we whining?
  - it should converge to expected-utility maximization as resources go to infinity — I suspect this one is a neoclassical prejudice, especially given the results where knowing less or ignoring information does better

  Cases I want each requirement moored to, at minimum: the five-unit cap; the two interfaces that present the same forty apartments differently; the org's distribution versus the family's one shot (whose budget is the theory optimising for, and can it be both); the drift case; and our caseworker who is intransitive across three units but never sees the same triple twice, so the usual arbitrage-style objection doesn't obviously reach her.

  Two things I want on top of the list. First, I have a sinking feeling that some subset of these can't all hold together — if so, say which, and what has to give, because I'd rather have four criteria I can defend than nine that are secretly at war. Second, tell me which single criterion knocks out the most candidate theories, i.e. which one is actually doing the excluding.

  Last and briefly, no more than a short paragraph: how the three rough approaches I keep running into do against your list — optimization under an explicit computational budget; the fast-and-frugal / fit-to-the-environment heuristics picture; and the version that prices mental effort and tunes the procedure to the distribution of problems. I'll do the real scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A volunteer committee rewriting decision procedures for a housing placement organization.
      *   **Task:** Write a "desiderata" list (specifications) for a theory of bounded rationality/satisficing suitable for *auditing* and *teaching* a real-world procedure.
      *   **Constraints:**
          *   Not abstract theory; must be actionable for supervisors and new caseworkers.
          *   High volume (thousands/year), tight time limit (40 mins/family), hard cap (5 units/family).
          *   Must address specific cases: 5-unit cap, interface framing (ordering/grouping), org vs. family distribution, standard drift, intransitivity without repetition.
          *   Must identify conflicts/trade-offs among desiderata.
          *   Must identify the single most exclusionary criterion.
          *   Must briefly evaluate three approaches (optimization w/ budget, fast-and-frugal, mental effort pricing).
          *   Tone: Professional, direct, pragmatic, acknowledging the tension between theory and practice.
      *   **User's Proposed Criteria:** Runnability, Teachability, Auditability (asymmetric info), Condemnation (no budget-laundering), Interface Invariance, Environment Shaping, Stopping/Drift, Uncardinalizable Effort, Convergence to EU.

  2.  **Deconstruct the Core Problem:**

      *   The user is asking for a *normative* theory of *bounded* rationality that works for *institutional accountability*.
      *   Standard bounded rationality (Simon, Gigerenzer, etc.) often describes *how* people decide or suggests heuristics, but rarely provides a *compliance framework* for auditors who weren't in the room.
      *   The "Auditability with Less Information" constraint is the killer. Most theories assume the evaluator knows the agent's constraints. Here, the evaluator (supervisor) knows less than the agent (caseworker) did *at the time*, yet must judge if the decision was defensible.
      *   The "Budget-Laundering" constraint is crucial. If every deviation can be explained away by "cognitive cost," the theory is unfalsifiable and useless for policy.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Feasibility.* (User's "runnable by someone tired"). Essential. If the rule can't be followed under stress, it's not a rule.
      *   *Candidate 2: Auditability.* (User's "evaluator knows less"). This is the hardest one. It requires the rule to be based on *observable process* rather than *unobservable mental states*.
      *   *Candidate 3: Falsifiability/Condemnation.* (User's "budget-laundering"). The theory must allow for the possibility that a specific action was *wrong*, not just suboptimal due to hidden costs.
      *   *Candidate 4: Frame Invariance.* (User's "interface"). The decision quality shouldn't depend on how the computer screen is sorted.
      *   *Candidate 5: Drift Detection.* (User's "standards slide"). Distinguishing adaptation from burnout.
      *   *Candidate 6: Alignment.* (User's "org vs family"). Who is the utility function for?

      *Refining for Conflict:*
      *   *Conflict:* "Convergence to EU" vs. "Fast-and-Frugal." If the environment is non-stationary or the cost of calculation is high, converging to EU might be the *wrong* goal.
      *   *Conflict:* "Auditability" vs. "Mental Effort Pricing." If effort is uncardinalizable (as the user suspects), you can't audit it. You can only audit the *procedure* that ostensibly saves effort.
      *   *Conflict:* "Feasibility" vs. "Optimality." You can't have both under tight bounds.

  4.  **Selecting the Non-Negotiables vs. Prejudices:**

      *   *Non-Negotiable:* Feasibility (under time pressure), Auditability (process-based), Falsifiability (no budget-laundering), Frame Invariance.
      *   *Prejudice/Optional:* Convergence to EU (neoclassical hangover), Explicit Mental Cost Cardinality (unmeasurable).

  5.  **Identifying the "Killer" Criterion:**

      *   Which one kills the most theories?
      *   *Auditability with Asymmetric Information.* Most bounded rationality theories rely on knowing the agent's internal state or the specific cognitive cost incurred. If the auditor can't see that, they can't judge. A theory that relies on "the agent felt this was too hard" fails here. A theory that relies on "the agent followed Rule X" passes.
      *   *Falsifiability (No Budget-Laundering)* is a close second. If "cognitive cost" explains everything, nothing is wrong.

  6.  **Addressing the Conflicts:**

      *   The user suspects some can't hold together.
      *   *Tension:* "Environment Shaping" vs. "Individual Decision Quality." If the procedure tells caseworkers to fix the interface, that's a policy change, not a decision rule.
      *   *Tension:* "Drift" vs. "Adaptation." Without a ground truth of "family utility," distinguishing drift from learning is nearly impossible for an auditor. This might need to be softened from a hard criterion to a monitoring metric.
      *   *Major Trade-off:* **Auditability vs. Nuance.** To make it auditable by someone with less info, you have to strip out the context-dependent judgment that makes the caseworker effective. You trade *quality of individual match* for *consistency of process*.

  7.  **Evaluating the Three Approaches:**

      *   *Optimization under Budget:* Fails Auditability (how do you prove the budget was hit?) and Feasibility (solving the optimization of the optimization is hard).
      *   *Fast-and-Frugal:* Good on Feasibility and Auditability (checklist style). Weak on "Convergence" (doesn't care) and potentially "Alignment" (might miss good fits outside the heuristic).
      *   *Mental Effort Pricing:* Fails Auditability (effort is invisible) and Falsifiability (everything becomes rationalizable).

  8.  **Drafting the Content (incorporating specific constraints):**

      *   *Tone Check:* Keep it sharp. No fluff. Use the user's terminology ("budget-laundering," "drift").
      *   *Structure:*
          1.  The Desiderata (categorized by Non-Negotiable vs. Optional).
          2.  The Conflicts (what has to give).
          3.  The Killer Criterion.
          4.  The Three Approaches (briefly).

      *Refining the "Auditability" point:* It needs to be "Ex-Post Process Verification." The auditor checks *did you follow the rule?* not *was this the best unit?*
      *Refining the "Budget-Laundering" point:* Call it "Falsifiability of Procedure."
      *Refining the "Interface" point:* "Description Invariance."

      *Addressing the "Org vs Family" distribution:* The theory must specify the objective function. Is it "maximize placements" (Org) or "maximize tenure/satisfaction" (Family)? The procedure must pick one. Let's assume Family Welfare is the ethical goal, Org Efficiency is the constraint.

      *Addressing the "Intransitivity" case:* If the rule is heuristic (e.g., "pick first that meets X"), intransitivity doesn't matter because the choice set is ordered by the search process, not compared globally. This is a feature, not a bug, for bounded agents.

  9.  **Final Review against User Prompt:**

      *   *Did I answer the specific cases?* (5-unit cap, interfaces, drift, intransitivity). Yes, weave them into the criteria explanations.
      *   *Did I identify conflicts?* Yes.
      *   *Did I pick the killer criterion?* Yes.
      *   *Is the paragraph on the three approaches short?* Yes.
      *   *Is it actionable?* Yes, framed as a spec.

  10. **Final Polish:** Ensure the distinction between "decision quality" and "process compliance" is clear, as that's the only way asymmetric auditability works. (Self-Correction: Make sure to emphasize that *outcome* auditing is impossible due to information asymmetry, so *process* auditing is the only path).

      *(Self-Correction on "Convergence to EU"):* The user suspects this is a prejudice. I should validate that. In bounded environments, "error minimization" is often a better target than "utility maximization."

      *(Self-Correction on "Mental Effort"):* The user asks if demanding cardinal units is whining. Verdict: It's a hard constraint. You can't audit what you can't measure.

      *(Final check on conflicts):* The biggest conflict is between *Adaptability* (letting workers adjust to hard families) and *Auditability* (requiring rigid rules). I need to state that Auditability wins for this specific purpose (writing a procedure manual), even if it costs some match quality.

      *Let's write.*
answer: |-
  Here is the specification list for a defensible decision procedure, sorted by necessity.

  ### The Desiderata

  **1. Process Verifiability (Non-Negotiable)**
  *   **The Spec:** An auditor with *less* information than the caseworker (no access to the family's private reactions, no access to the caseworker's internal fatigue level) must be able to determine compliance solely from the case file and the manual.
  *   **The Case:** *Asymmetric Audit.* If a caseworker skips Unit 3 to flag Unit 4, the auditor must know if that was a valid application of the rule or a violation. If the justification relies on "Unit 3 felt too cognitively demanding to process," the audit fails.
  *   **Verdict:** Non-negotiable. Without this, you have guidance, not a procedure.

  **2. Falsifiability / No Budget-Laundering (Non-Negotiable)**
  *   **The Spec:** The theory must define at least one observable action that constitutes an error, regardless of the agent's claimed mental state. It cannot rationalize every deviation by positing an unmeasured "cost of thinking."
  *   **The Case:** *Budget-Laundering.* If a caseworker ignores a clearly eligible unit to flag a marginal one, you must be able to call this a failure. If the theory allows the caseworker to claim "saving cognitive effort was worth the match loss" without a measurable metric for that effort, the theory condones everything.
  *   **Verdict:** Non-negotiable. A rule that cannot be broken is not a rule.

  **3. Description Invariance (Non-Negotiable)**
  *   **The Spec:** The verdict on a decision cannot change if the information is presented differently (e.g., sorted by rent vs. sorted by neighborhood) provided the underlying set of units is identical.
  *   **The Case:** *The Two Interfaces.* If the portal sorts apartments by price, the caseworker flags Units A, B, C. If sorted by location, they flag D, E, F. A defensible procedure must yield the same flags regardless of the sort order, or explicitly mandate a specific sort order to neutralize the bias.
  *   **Verdict:** Non-negotiable. Otherwise, you are auditing the UI designer, not the caseworker.

  **4. Ecological Feasibility (Non-Negotiable)**
  *   **The Spec:** The procedure must be executable within the hard constraints (40 minutes, 5 flags) by a human operating at typical fatigue levels. It cannot require solving a sub-problem that is itself computationally expensive.
  *   **The Case:** *The Stopwatch.* If the rule requires comparing all 40 available units to find the "best 5," it is intractable. The rule must be local (e.g., "flag the first 5 that meet Threshold X").
  *   **Verdict:** Non-negotiable. An impossible procedure is indistinguishable from no procedure.

  **5. Drift vs. Adaptation Distinguishability (High Priority)**
  *   **The Spec:** The procedure must provide a metric to distinguish between learning (adjusting standards based on market feedback) and degradation (lowering standards due to burnout).
  *   **The Case:** *The Drift Case.* A caseworker's acceptance threshold drops after three weeks of rejections. Is this efficient market learning or dangerous mission creep? The theory needs a "circuit breaker" (e.g., "if flag rate exceeds X%, trigger review") rather than relying on the agent's self-assessment.
  *   **Verdict:** High Priority. Hard to enforce perfectly, but essential for long-term integrity.

  **6. Objective Function Clarity (High Priority)**
  *   **The Spec:** The procedure must state whose utility is being maximized (Org throughput vs. Family stability) and how conflicts are resolved.
  *   **The Case:** *Org vs. Family.* A unit that places quickly (good for Org) might have a high eviction risk (bad for Family). The procedure cannot optimize for "placements" while claiming to optimize for "housing stability."
  *   **Verdict:** High Priority. Ethical necessity, though often politically obscured.

  **7. Convergence to Expected Utility (Prejudice)**
  *   **The Spec:** The procedure should approximate the optimal decision as time/resources approach infinity.
  *   **The Case:** *Neoclassical Hangover.* In a 40-minute window with high uncertainty, the "optimal" decision is often unknowable. A heuristic that ignores information to avoid error might outperform a strained optimization attempt.
  *   **Verdict:** Prejudice. Discard. You want *robustness*, not asymptotic optimality.

  **8. Cardinal Cognitive Cost (Prejudice)**
  *   **The Spec:** The theory requires a numerical value for "mental effort" to trade off against match quality.
  *   **The Case:** *Uncardinalizable Effort.* We cannot measure "units of thinking." Basing a procedure on this makes it unimplementable.
  *   **Verdict:** Prejudice. Discard. Use *proxies* (time steps, number of comparisons) instead of internal costs.

  ---

  ### The Conflicts: What Has to Give

  You are correct to suspect tension. You cannot have all of these. The primary conflict is between **Process Verifiability** and **Ecological Feasibility/Adaptation**.

  To make a decision auditable by someone with less information (Verifiability), you must strip the caseworker of context-dependent judgment. You have to replace "use your best judgment to find a fit" with "if Rent < $X and Beds > Y, flag."
  *   **What gives:** You sacrifice *match quality nuance* for *procedural consistency*. A rigid rule prevents bad decisions but also prevents brilliant exceptions.
  *   **The Trade-off:** You must accept that a caseworker following the procedure perfectly might produce a worse outcome for a specific family than a caseworker breaking the rules, but the *system* remains defensible. If you prioritize the individual outcome, you lose the audit trail.

  **Secondary Conflict:** **Description Invariance** vs. **Feasibility.**
  Ensuring invariance often requires more computation (normalizing the data before deciding).
  *   **What gives:** You likely need to mandate a *standardized interface view* (e.g., "always sort by rent") rather than demanding the caseworker's brain normalize the data. You fix the environment to satisfy the theory.

  ---

  ### The Killer Criterion

  **Process Verifiability (with Asymmetric Information)** knocks out the most candidates.

  Most theories of bounded rationality (especially "optimization under constraints" or "mental effort pricing") rely on knowing the agent's internal state or the specific difficulty of the problem instance to judge rationality.
  *   *Why it kills:* An auditor cannot see how hard the caseworker thought. They can only see what was clicked. Therefore, any theory that justifies decisions based on *internal cognitive states* (e.g., "the marginal cost of search exceeded the marginal benefit") is dead on arrival for your purpose. Only **procedural rationality** (did you follow the prescribed steps?) survives this cut.

  ---

  ### Evaluation of the Three Approaches

  **1. Optimization under Explicit Computational Budget:**
  Fails **Feasibility** and **Verifiability**. It asks the caseworker to solve the optimization of the optimization (how much time to spend thinking about time), which is intractable in 40 minutes. It also fails auditability because the "budget" is internal.

  **2. Fast-and-Frugal Heuristics (Fit-to-Environment):**
  Strongest candidate. Passes **Feasibility** (simple rules) and **Verifiability** (checklist compliance). It handles **Description Invariance** if the search order is fixed by rule. It struggles with **Drift** (heuristics can become rigid) and **Objective Function** (might optimize for speed over stability unless the rule is tuned).

  **3. Mental Effort Pricing (Tuning to Distribution):**
  Fails **Verifiability** and **Falsifiability**. It is the primary engine of **Budget-Laundering**. Since you cannot audit the "price" the agent paid in effort, you cannot distinguish a rational trade-off from a lazy mistake. It is theoretically elegant but operationally useless for your committee.
