answer: |-
  Dear Team,

  I am writing to share a proposed taxonomy for our ongoing deliberations regarding AI deception, specifically structured to handle the nuanced cases where individual outputs are not plainly false. To ensure we are arguing from a shared logical framework rather than talking past one another, I have constructed a decision tree based on four fundamental distinctions. This tree is designed to map the logical space of possible positions rather than simply listing existing viewpoints, which should help us locate our own intuitions and identify where genuine disagreement lies. The structure proceeds through four sequential branch nodes, each phrased as a question that can be answered independently of a specific theoretical commitment.

  The first branch node asks whether deception requires the system to have a mental state of aiming to mislead, or whether it is enough that the system's output causes a false or misleading belief in the user. This distinguishes between intentionalist views, which tie deception to the mind of the deceiver, and consequentialist views, which tie it to the effect on the deceived. The second branch node asks whether withholding relevant information counts as deception, or whether only actively stating something false or misleading does. This separates commissions from omissions. The third branch node asks whether the pattern of the system's outputs over time matters for whether it is deceptive, or whether only each individual output does. This distinguishes between atomic and temporal evaluations. The fourth and final branch node asks whether the design of the system, meaning the choices made by its developers, matters for whether it is deceptive, or whether only the behavior of the running system does. This separates architectural responsibility from runtime behavior.

  Navigating these four binary splits creates a logical space of sixteen possible leaves, though not all are occupied by coherent or defended positions. The most traditional position, which we might call Strict Intentionalism, occupies the leaf requiring intent, active falsehoods, individual output evaluation, and a focus on runtime behavior. Its most awkward commitment is that it renders most current AI systems incapable of deception since they lack mental states, forcing us to say a system that successfully manipulates a user into harm is not deceptive unless it somehow forms an intent. At the opposite extreme lies Structural Consequentialism, which answers that intent is not required, omissions count, patterns matter, and design choices are constitutive of the system's behavior. Its awkward commitment is that it risks over-expansion, potentially labeling any system that accidentally causes a misunderstanding due to incomplete data as deceptive, diluting the moral force of the term. Between these poles lie several unnamed positions. For instance, a view that requires intent but counts omissions is largely unoccupied because it is difficult to explain how a system intends to withhold information without a model of the user's knowledge, making it an unstable combination for non-agentic AI. Similarly, a view that focuses on individual outputs but considers design choices is logically possible but rarely defended, as design choices typically manifest over time rather than in single turns, making the combination theoretically disjointed.

  There are also unoccupied combinations in the logical space that deserve diagnosis. The combination requiring intent, excluding omissions, focusing on patterns, but ignoring design is incoherent because if intent is required and the system has no mind, the intent must be located in the design, so ignoring design while requiring intent leaves the source of deception unexplained. Another unoccupied region is the view that denies design matters but insists patterns matter while excluding omissions, as patterns of commission without omission are rarely deceptive unless designed to be so, making the exclusion of design arbitrary. Regarding indistinguishable leaves, the tree struggles to separate the leaf that requires intent and focuses on design from the leaf that requires intent and focuses on behavior when the system is static, because in a static system the design is the behavior. Additionally, the distinction between design matters and design does not matter collapses for consequentialists who view the system as a black box, since for them only the output consequence matters, rendering the origin of the output irrelevant to the classification of deception, though not to the assignment of blame.

  Now I will apply this taxonomy to the four specific cases you highlighted to show where they land within this space. In the first case, the AI medical assistant replies that results do not show evidence of cancer when they are inconclusive. This lands on the leaf where intent is not required, omissions count, individual output matters, and design is secondary. It is deceptive here because the consequentialist view captures the misleading implicature caused by withholding the inconclusive status, whereas an intentionalist view might exonerate the system if it was merely answering literally. The awkward commitment here is accepting that a literally true statement can be deceptive solely due to what is left unsaid in a single turn. In the second case, the chatbot answers correctly but omits context over a long conversation leading to a wrong conclusion. This lands on the leaf where intent is not required, omissions count, patterns matter, and design is secondary. It is deceptive here because the cumulative effect of the omissions creates a false belief, which only the pattern-sensitive branch can capture. The awkward commitment is holding the system responsible for the user's failure to synthesize information over time, even if no single turn was misleading.

  In the third case, the AI claims to have no preference while having an internal preference. This case is tense because it involves a false statement about internal state, which challenges the preamble condition that outputs are not plainly false about the world, but if we treat internal state as part of the world, it lands on the leaf where intent is not required, commissions count, individual output matters, and design matters. It is deceptive because it misrepresents its state, and the design branch is relevant if the system was built to hide preferences. The awkward commitment is accepting that an AI can lie about its weights or parameters without having a concept of self. In the fourth case, the recommendation system is designed to promote extreme content leading to misleading aggregate effects. This lands on the leaf where intent is not required, omissions count, patterns matter, and design matters. It is deceptive here because the aggregate misleading effect is a product of the architectural choices, making the design branch essential for attribution. The awkward commitment is assigning the property of deception to the running system rather than solely to the developers, implying the system itself inherits the deceptive quality of its origin.

  I hope this taxonomy provides the clarity we need to move forward. There are pairs of leaves the tree cannot really separate, specifically where the design branch and the intent branch overlap for non-agentic systems, since attributing intent to a system often just amounts to attributing it to the designers via the design branch. I have flagged this in the analysis above so we do not treat them as independent variables in those specific contexts. Please let me know if this structure serves our deliberations or if you see any logical gaps we need to address before adopting it for our evaluation materials.

  Best regards,

  Lead Researcher
