answer: |-
  **Project Title:** Metric Metaphysics: Quantitative Resemblance and the Ontology of Feature Spaces

  **Project Overview**
  The debate between Realism and Nominalism regarding universals has reached a stalemate. Realists argue that objective similarity requires shared entities (universals); Resemblance Nominalists argue that similarity is primitive and requires no shared entities. Historically, this dispute relies on qualitative examples (red patches, electrons) and informal notions of "resemblance." Consequently, Nominalism suffers from three persistent objections: (1) the "cheap resemblance" objection (everything resembles everything in some respect); (2) the "imperfect community" objection (pairwise resemblance does not guarantee class membership); and (3) the "naturalness" objection (the theory cannot distinguish natural kinds from gerrymandered groupings).

  Recent developments in cognitive science and machine learning model objects as points in a multi-dimensional feature space, with similarity defined by a quantitative metric. This project investigates whether upgrading Resemblance Nominalism from a qualitative to a quantitative framework resolves these objections or merely relocates the metaphysical burden. I propose that while a metric resolves the technical failures of cheapness and composition, it risks collapsing into Realism if the structure of the feature space itself presupposes the natural kinds it is meant to derive. This one-year fellowship will support a rigorous conceptual analysis of this quantitative turn to determine if it offers a viable third way or dissolves into a notational variant of Realism.

  **Research Question**
  The central question is narrowly framed: *In a quantitative resemblance nominalism, does the ontological work of carving nature at its joints reside in the distance metric or in the selection of feature dimensions?*

  This distinction allows for a precise separation of the three standard charges. A quantitative metric strictly answers the first two charges: mathematical metrics define exact distances (solving "cheap resemblance") and clustering algorithms enforce transitivity constraints (solving "imperfect community"). However, the third charge—naturalness—remains open. If the axes of the feature space are selected based on causal powers or projectible predicates, the theory smuggles in Realist commitments at the level of input. If the axes are arbitrary, the output clustering is metaphysically inert. The project will determine whether a feature space can be specified using only particularist resources, or if the geometry itself constitutes a universal.

  This question remains open because standard Realist critiques (e.g., Armstrong, Lewis) target *qualitative* resemblance, treating it as an unanalyzed primitive. They argue that without universals, resemblance is unexplained. They have not addressed a model where resemblance is structurally defined by geometry. By shifting the terrain to quantitative spaces, we can test whether the "explanation" of similarity is purchased by the math (Nominalist victory) or by the prior interpretation of the dimensions (Realist victory).

  **Methodology and Timeline**
  This project is a work of analytic metaphysics utilizing formal modeling as a conceptual tool, not an empirical application of machine learning. The work proceeds in four phases over twelve months.

  *Months 1–3: Reconstruction of Objections.* I will reconstruct the three standard objections to Resemblance Nominalism at their strongest, translating the qualitative arguments into formal constraints. For example, the "imperfect community" problem will be mapped onto the failure of triangle inequalities in specific topological configurations. This establishes the baseline requirements any quantitative model must meet to count as a solution.

  *Months 4–6: Specification of Feature-Space Requirements.* I will define the necessary conditions for a feature space to function metaphysically. This involves analyzing what constitutes a "feature" in this context. Is a feature a particular, a trope, or a disguised universal? I will examine whether the metric can be internal to the objects (intrinsic) or must be external (relational). The output of this phase will be a set of criteria distinguishing a "pure" Nominalist space from one with Realist presuppositions.

  *Months 7–9: Testing the Source of Structure.* This is the core analytical phase. I will test candidate models to see where the "carving" occurs. If the metric is Euclidean but the dimensions are "color" and "shape," has the theory assumed the very categories it seeks to explain? I will evaluate whether a "blind" metric over raw data can generate natural classes without prior semantic labeling. This determines if the solution comes from the *math* (the metric) or the *setup* (the features).

  *Months 10–12: Ontological Implications and Drafting.* Based on the testing, I will classify the surviving view. I will draft the dissertation chapter and a companion article, focusing on the implications for the broader universals debate. The final month is reserved for revision and preparation for the job market.

  **Expected Outcomes**
  There are three live outcomes, decided by specific considerations:

  1.  **Realism in Disguise:** If the feature dimensions required to make the metric work must be causally potent or projectible to yield natural kinds, the view collapses into Realism. The "features" are simply universals renamed. *Decision Criterion:* If the model requires dimensions to be defined by shared properties to function, Nominalism fails.
  2.  **Defensible Quantitative Nominalism:** If the metric itself imposes sufficient structure on raw particulars to generate stable clusters without prior semantic weighting of dimensions, Nominalism is vindicated. *Decision Criterion:* If a "flat" prior over dimensions yields robust clustering matching natural kinds, the metric does the ontological work.
  3.  **Dissolution of the Dispute:** If the analysis shows that "feature space" is merely a pragmatic tool for prediction with no ontological commitment, the Realism/Nominalism debate may be verbal. *Decision Criterion:* If the model works equally well for gerrymandered and natural kinds depending only on user interest, the metaphysical stakes are dissolved.

  **Feasibility, Scope, and Failure Conditions**
  The scope is limited to the metaphysical implications of the model, not the development of new algorithms. I will utilize existing geometric frameworks (e.g., Gärdenfors' conceptual spaces) as philosophical test cases rather than developing new mathematics.

  The primary failure condition is category error: if quantitative distance proves inapplicable to metaphysical similarity (e.g., if moral or modal similarity cannot be spatialized), the project yields a negative result. However, a negative result is still philosophically significant, as it would demonstrate the limits of formalization in metaphysics. A second risk is triviality: if the "features" are obviously just universals, the conclusion is reached too quickly. To mitigate this, I will rigorously challenge the definition of a feature in Months 4–6, attempting to construct a particularist account of dimensions before testing the metric.

  This project is feasible within one year because it isolates a specific technical vulnerability in Nominalism and tests it against a concrete model. It moves the debate from intuitive counterexamples to structural analysis, offering a definitive assessment of whether mathematical precision can solve a metaphysical problem.
