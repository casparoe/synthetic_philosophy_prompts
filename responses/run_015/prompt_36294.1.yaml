answer: |-
  Based on her track record, here is the diagnosis of her underlying principle, her likely verdict on the marriage ruling, and the specific test case you should use to confirm it.

  ### The Prediction
  She is going to say **National**.

  ### The Diagnosis: "Market Functionalism with a Cultural Firewall"
  She is not running a consistent "Rights Shield" principle (Hypothesis 3), nor is she a pure "Cross-Border Spillover" federalist (Hypothesis 1). She is running a hybrid of **Hypothesis 1 (Market/Spillover)** and **Hypothesis 2 (National Identity)**, with a specific "Gatekeeper" exception.

  Here is the evidence from her own verdicts:
  *   **Why she isn't a "Rights Shield" (Hypothesis 3):** If she believed the EU's primary role was protecting minorities from national majorities, she would have put **Abortion** in the EU column. Reproductive rights are a classic minority/rights issue in the EU. By marking it National, she signaled that "moral/bio-ethical" issues are off-limits to Brussels, regardless of rights implications.
  *   **Why she isn't a pure "Spillover" Federalist (Hypothesis 1):** She supports EU intervention on emissions and trade (clear spillovers), but she also supports the **Death Penalty ban for candidates**. A candidate country's execution policy doesn't physically "spill over" borders like pollution. This shows she views the EU as a *values-based club* for entry, not just an economic zone.
  *   **The Actual Rule:** Her principle is **"The Single Market and Club Entry Test."**
      *   Does it impede the free movement of goods/people? **EU Level.** (Trade, Standards, Discrimination against *other* EU citizens).
      *   Is it a condition for joining the club of democracies? **EU Level.** (Death Penalty for candidates).
      *   Is it domestic social policy or moral fabric? **National Level.** (Retirement, Tax, History, Abortion).

  **Verdict on Same-Sex Marriage:** She will categorize this as **Domestic Social Policy** (like Abortion and History), not as a Market Function issue. Therefore, she will argue it must remain National.

  ### The Test Case: The "Coman" Distinction
  To distinguish whether she is prioritizing **Market Functionality (Hypothesis 1)** or **National Identity (Hypothesis 2)**, you should not ask about marriage generally. You need to split the issue into its legal components.

  Ask her this:
  > *"Should the EU force a member state to **recognize** a same-sex marriage performed in another member state for the purpose of residency rights, even if that state doesn't allow same-sex couples to **marry** domestically?"*

  (This refers to the actual *Coman* ruling logic, where the EU Court said Romania had to recognize a gay marriage for residency purposes, even if they didn't have to perform them.)

  **How to interpret her answer:**
  *   **If she says "Yes, recognize for residency, but no on legalization":** She is running **Hypothesis 1 (Market/Spillover)**. She prioritizes the Single Market (free movement of people) over cultural identity, but only where movement is involved. This is consistent with her support for striking down discrimination against *citizens of other member states*.
  *   **If she says "No on both":** She is running **Hypothesis 2 (National Identity)**. She views the definition of marriage as part of the "social fabric" (like Abortion and History) that trumps market mechanics.
  *   **If she says "Yes on both":** She is actually running **Hypothesis 3 (Rights Shield)**, and her "Abortion = National" verdict was an inconsistency or based on specific medical jurisdiction views.

  ### The Deep-Dive Test (Optional)
  If you want to test the "Death Penalty" anomaly (why values matter for candidates but not members), ask about **EU Rule of Law Sanctions** (e.g., withholding funds from Hungary or Poland for judicial independence issues).
  *   **If she supports sanctions:** She views the EU as a **Values Guardian** for members, not just candidates. This would suggest she *might* be swayed on Marriage if framed as a Rule of Law issue.
  *   **If she opposes sanctions:** She views the EU as a **Gatekeeper** (values only matter at the door). This confirms she will definitely say "National" on Marriage.
