  8.  (Final Review of the "Zero Philosophy" constraint): Make sure I don't slip into "Heideggerian technology critique" language. Keep it grounded in code and ship mechanics.

  9.  *Wait, one more thing:* The prompt asks about "rubber stamping AI pull requests." I need to address the *verification* problem. The humans on the Axiom didn't verify anything. The screens told them what to do. Devs trust the green checkmark.

