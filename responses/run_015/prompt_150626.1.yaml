answer: |-
  The tension you are feeling, particularly between Case 3 (reverse engineering) and Case 4 (trade secret breach), is the central fault line in intellectual property theory. It distinguishes between rights grounded in **labor** (I built this, so it is mine) and rights grounded in **secrecy/relationship** (I kept this hidden/shared in confidence, so you cannot take it).

  Your tentative principle ("saves a cost") is a *Labor Theory*. It fails because society generally accepts that if you leave your labor product in the public square (Case 3), others may learn from it. Case 4 is wrong not because of the cost saved, but because the *channel* was corrupted.

  Here is a principle that respects your verdicts on 1–4 and 6, while offering a framework to resolve 5 and 7.

  ### The Principle of Normative Access and Causal Reliance

  **Statement:**
  > It is wrongful to utilize another's idea if and only if:
  > 1.  **Causal Dependence:** The taker's utilization is causally dependent on the originator's disclosure (as settled by the Ledger); **AND**
  > 2.  **Breach of Access Norm:** The channel of disclosure violated a normative expectation of exclusivity attached to that context.
  >
  > *Supplementary Duty:* Even if Access Norms are not breached (e.g., public disclosure), if the originator's specific insight provided the *critical catalyst* for the taker's success, a debt of attribution or profit-sharing is owed proportional to the causal weight of that insight.

  ---

  ### Clauses and Motivating Cases

  **Clause 1: Causal Dependence**
  *   **Motivation:** **Case 1.** If the taker would have arrived at the idea independently, the originator has no claim. The Ledger proves independence, so no wrong exists. This clause ensures that priority alone is not enough; there must be a causal link.
  *   **Function:** It clears independent discoverers of wrongdoing, regardless of who sealed first.

  **Clause 2: Breach of Access Norm**
  *   **Motivation:** **Case 3 vs. Case 4.** This is the core resolution.
      *   In **Case 3**, selling a product on the open market carries an implied normative license to inspect and dismantle. The originator waived exclusivity over the mechanism by commercializing the object.
      *   In **Case 4**, an assistant's notebooks are private property held within a fiduciary relationship. The norm is confidentiality. Taking them violates the *access norm*, not just the idea.
  *   **Function:** It distinguishes between information released into the wild (free to take) and information guarded or shared in confidence (protected).

  **Supplementary Duty: The Catalyst Debt**
  *   **Motivation:** **Case 5.** The public jest waives exclusivity (no theft), but the expert's success was *causally triggered* by the originator's specific insight. Without that sentence, the six months of labor yield nothing.
  *   **Function:** It creates a moral (but not proprietary) obligation where property rights don't apply. It explains why the debt is "substantial" (the insight was the key) rather than trivial.

  ---

  ### Verdicts on Your Seven Cases

  1.  **Independent Routing:** **No Wrong.** Fails Clause 1 (No Causal Dependence).
  2.  **Studio Pitch:** **Theft.** Meets Clause 1 (Dependence) and Clause 2 (Pitch implies confidentiality norm).
  3.  **Reverse Engineering:** **No Wrong.** Meets Clause 1, but Fails Clause 2 (Sale implies waiver of exclusivity).
  4.  **Assistant Notebooks:** **Wrong.** Meets Clause 1 and Clause 2 (Employment implies confidentiality norm).
  5.  **Public Jest:** **No Theft, Substantial Debt.** Fails Clause 2 (Public post waives exclusivity), but triggers Supplementary Duty (Insight was the critical catalyst).
  6.  **Defector/Time Savings:** **Theft.** Meets Clause 1 and Clause 2 (Defection breaches employment norm). The loss of "time" is irrelevant; the breach of the norm constitutes the wrong.
  7.  **AI Training:** **No Theft, Potential Debt.** Fails Clause 2 (Public data implies waiver). However, if the system sells images *recognizably in her manner*, it may trigger the Supplementary Duty (attribution/profit share), resolving your ambivalence by separating property rights from moral credit.

  ---

  ### Verdicts on New Cases

  **New Case A: The Sleeping Dog**
  *Scenario:* An originator seals a design but never commercializes it. A rival steals the design via a breach of confidence (e.g., hacking a private server) and sells it.
  *   **Verdict:** **Wrong (Theft).**
  *   **Reasoning:** Clause 2 is violated. The wrong is not the market loss (since the originator wasn't using it), but the violation of the *access norm* (private server). This aligns with Case 6, where the wrong existed even though only time was lost. The right is to *secrecy*, not just *profit*.

  **New Case B: The Aware Racer**
  *Scenario:* A rival sees the Ledger seal (knowing the originator has the idea) but does not access the content. They race to build it independently and finish first.
  *   **Verdict:** **No Wrong.**
  *   **Reasoning:** Fails Clause 1. Knowledge of the *existence* of an idea is not causal dependence on the *content* of the idea. The Ledger confirms independent derivation. The originator's seal does not grant a monopoly on the *problem*, only protection against copying the *solution* via forbidden channels.

  ---

  ### The Cost: Which Verdicts Must You Reconsider?

  Adopting this principle requires you to accept two potentially uncomfortable implications:

  **1. The Fragility of Case 5 (The Public Jest)**
  Your verdict is "Not theft, but something substantial is owed."
  *   **The Cost:** Under this principle, the "debt" is moral, not enforceable property. If the expert refuses to pay or attribute, they have done something *ungenerous*, but not something *wrongful* in the sense of a rights violation. You must accept that the originator has no *claim* to the expert's profits, only a claim on their conscience. If you believe the originator *should* be able to sue for a share of profits in Case 5, this principle fails you.

  **2. The Resolution of Case 7 (AI Training)**
  Your verdict is "Back and forth."
  *   **The Cost:** This principle forces a decision: **It is not theft.** Because the images were public, the Access Norm was not breached. The only remaining question is the Supplementary Duty (attribution). If you feel that training an AI on public art *should* be theft (a property violation) regardless of public status, you must abandon this principle in favor of a Labor Theory (which would then force you to condemn Case 3).

  **3. The Justification for Case 3 (Reverse Engineering)**
  *   **The Cost:** You must firmly reject the intuition that "saving R&D cost" is inherently wrongful. You must accept that the *social benefit* of allowing people to learn from sold products outweighs the originator's labor investment. If you feel Case 3 is morally suspect (even if legal), this principle will not satisfy you.

  ### Summary
  The **Principle of Normative Access** shifts the focus from *what was taken* (the idea) to *how it was taken* (the channel). It reconciles your hardest conflict (3 vs. 4) by grounding the wrong in breached trust rather than saved cost. It preserves your verdicts on 1–4 and 6, clarifies 5 as a moral debt rather than property right, and pushes you to decide Case 7 based on whether public data implies consent to machine learning.
