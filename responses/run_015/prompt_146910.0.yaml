      *   *HITL Specifics:* The human modifies the input/context, effectively "updating" the model's state without changing weights. This blurs the line between memory, belief, and context.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Boundary Definition.* Where does the mind end? (Model vs. Coupled System). Motivation: Extended Mind thesis vs. internalism.
