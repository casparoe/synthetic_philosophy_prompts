      *   *Conflation Risk?* (Is this what people usually mix up?)

  6.  **Refining the Analysis (Self-Correction/Nuance):**
      *   *Gongsun Long's actual argument:* It's often about the *name* not being the *object*, or the *concept* of white+horse not being the *concept* of horse. It's largely intensional.
      *   *The Participant's Argument:* She wants to say "Black woman" is not a "woman" (ontologically distinct kind), not just a subset.
      *   *Critical Distinction:* Being a *subset* (extensional) is not the same as being a *different kind* (ontological). This is the likely conflation.
      *   *Intersectionality:* Usually argues that the *experience* or *social treatment* is distinct, not necessarily that the *ontology of the person* splits into two beings. But some strong social constructionists might argue for distinct social kinds.

  7.  **Drafting the Content (Iterative refinement):**

