      *   **Task:** Map out the precise logical, semantic, or metaphysical claims the slogan could express.
      *   **Requirements:**
          *   Categorize the readings (extension, essence, substitutivity, universals, semantics, etc.).
          *   Evaluate each reading (trivial, substantive/defensible, or false).
          *   Assess support for the anti-reductionist conclusion (does "white horse" $\neq$ "horse" imply "Black woman" $\neq$ "woman" in an ontological sense?).
          *   Flag illicit conflations (equivocations).
          *   Format: A clear menu with verdicts.

  2.  **Deconstruct the Slogan ("A White Horse Is Not A Horse"):**
      *   *Historical Context:* Gongsun Long (Warring States Period). The argument is famously paradoxical but relies on specific distinctions between *names* (ming) and *actualities* (shi), or form and essence.
      *   *Core Tension:* Intension vs. Extension.
      *   *Modern Application:* Social ontology, intersectionality, taxonomy.

  3.  **Brainstorming Interpretations/Readings:**

      *   *Reading 1: Extensional/Set-Theoretic.* Is the set of white horses identical to the set of horses? No, it's a subset. So, extensionally distinct.
      *   *Reading 2: Intensional/Conceptual.* Does the concept "white horse" mean the same as "horse"? No, it has more content.
      *   *Reading 3: Semantic/Linguistic.* Does the term "white horse" refer to the same object as "horse"? In some contexts, yes; in others (opaque contexts), no.
      *   *Reading 4: Metaphysical/Essential.* Is "whiteness" essential to the "white horse" in a way that changes its kind? (Aristotelian species vs. differentia).
      *   *Reading 5: Social Ontological/Intersectional.* Does the lived experience of a "Black woman" differ so radically from "woman" or "Black person" that it constitutes a distinct social kind?
      *   *Reading 6: Mereological/Constitution.* Is the compound object distinct from the base object?

  4.  **Developing the Menu (Drafting the Options):**

