  6.  **Self-Correction/Review during drafting:**
      *   *Wait, check the Contingent Identity point again.* Gibbard's view is that names are rigid, but sortal concepts are not. Or that identity is relative. If the student says "deny Leibniz's Law," is that wrong? Strictly, LL is $\forall x \forall y (x=y \rightarrow \forall P (Px \leftrightarrow Py))$. If $x$ has property "possibly survives squashing" and $y$ doesn't, and $x=y$, LL is violated *unless* modal properties are treated differently (e.g., world-indexed). So the student is right that it *looks* like a violation of LL. The cost is usually framed as "giving up the necessity of identity." I will suggest a comment that nuances this without penalizing too heavily.
      *   *Grounding:* The student says "Ganesha is nothing over and above Clay... so Ganesha has exactly the persistence conditions of that ground." This assumes grounding entails sharing persistence conditions. Many grounding theorists deny this (grounding explains *why* the statue has different conditions). The student's objection is that if it's *nothing* over and above, it shouldn't differ. This is a valid "causal/persistence exclusion" style objection. I will mark this as a strong critical point but note that it's a contested premise.
