  # JOINT STATEMENT ON THE METAPHYSICS OF PERSISTENCE
  **Prepared by:** The Endurantist and Perdurantist Working Group
  **Date:** October 24, 2023
  **Subject:** Clarification of Agreement, Disagreement, and Explanatory Costs in Persistence Theory

  ## 1. Agreed Claims
  *The undersigned parties affirm the following propositions as the common ground for this debate. These claims establish the formal constraints and phenomenological data that any adequate theory of persistence must accommodate.*

  1.  **The Formal Problem of Change:** We agree that change involves an object possessing a property $F$ at time $t_1$ and the incompatible property not-$F$ at time $t_2$.
  2.  **The Law of Non-Contradiction:** We agree that no object can possess incompatible intrinsic properties simpliciter (i.e., without qualification). An object cannot be wholly bent and wholly straight in the same respect at the same time.
  3.  **The Data of Experience:** We agree that ordinary objects (persons, tables, organisms) appear to undergo genuine change (aging, color shift, location shift) while remaining numerically identical entities throughout the process.
  4.  **The Requirement of Explanation:** We agree that a metaphysical account of persistence must explain *how* numerical identity is preserved through qualitative change without violating logic.
  5.  **Temporal Parts Ontology:** We agree that the perdurantist ontology posits that objects are four-dimensional spacetime worms composed of temporal parts (stages), where each part exists at only one instant or interval.
  6.  **Endurantist Ontology:** We agree that the endurantist ontology posits that objects are three-dimensional entities that are "wholly present" at each moment of their existence, lacking proper temporal parts.
  7.  **Adequacy Condition:** We agree that any successful theory must account for:
      *   Ordinary qualitative change (e.g., a leaf turning from green to red).
      *   Personal identity (the sense in which a person at 80 is the same entity as at 20).
      *   Boundary cases (fission, fusion, and intermittent existence).

  ## 2. Disagreements Table
  *The following table isolates the precise points of divergence. Each position is stated in terms its proponent accepts as accurate, avoiding caricature.*

  | Issue | Position A: Endurantism (3D) | Position B: Perdurantism (4D) |
  | :--- | :--- | :--- |
  | **Nature of Objects** | Objects are continuants that are strictly numerically identical across time. They do not have temporal parts. | Objects are occurrents (spacetime worms). They have temporal parts, just as they have spatial parts. |
  | **"Wholly Present"** | To be wholly present at $t$ means the entire object exists at $t$, not merely a part of it. Identity across time is strict identity. | To be "wholly present" at $t$ is a manner of speaking; strictly, only a temporal *stage* is present at $t$. The whole worm is never present at an instant. |
  | **Resolution of Temporary Intrinsics** | Properties are held relationally (e.g., *bent-at-t*) or via indexicalism (e.g., *bent-at-t* is a property of the object, not the time). No contradiction arises because the properties are distinct relational complexes. | Properties are held by distinct temporal parts. The $t_1$-part is bent; the $t_2$-part is straight. No single entity holds incompatible properties. |
  | **Ontological Commitment** | Commits to enduring substances and time-indexed properties or relations. Denies the existence of temporal parts as distinct entities. | Commits to temporal parts and the spacetime manifold. Denies that the "whole object" exists at any single time. |
  | **Identity in Fission** | Faces a dilemma: either deny fission is possible, deny identity holds (one becomes two new objects), or accept vague identity. Strict identity is transitive and cannot branch. | Handles fission easily via branching worms. Pre-fission stages are parts of two overlapping worms. Identity is replaced by a "I-relation" (psychological/physical continuity). |

  ## 3. Primary Cruxes and Predictive Cases
  *We identify two specific loci where the explanatory costs of each view become most visible. For each crux, we specify the core theoretical disagreement, a concrete test case, and the predictions each side makes regarding what that case reveals about their own ontology.*

  ### Crux (i): The Logical Status of Temporary Intrinsics
  **The Dispute:** Does the problem of temporary intrinsics generate a genuine logical contradiction for the endurantist, or is it merely an apparent contradiction resolvable by analyzing property attribution?
  *   **Endurantist Claim:** The contradiction is merely apparent. Predicates like "is bent" are incomplete; the full property is "is bent-at-$t$." Since *bent-at-$t_1$* and *straight-at-$t_2$* are compatible relational properties, no law of non-contradiction is violated.
  *   **Perdurantist Claim:** The contradiction is genuine if properties are intrinsic. Relationalizing all properties (making *everything* time-relative) strips objects of their intrinsic nature and changes the subject. The only way to preserve intrinsic properties is to assign them to distinct entities (temporal parts).

  **Test Case:** *The Qualitative Inversion.*
  An object is perfectly red at $t_1$ and perfectly green at $t_2$, with no spatial variation.
  *   **Endurantist Prediction:** This case will show that our intuition of "the same object changing color" is robust. It predicts that analyzing color as a relation to time preserves the intuition of a single subject undergoing change without logical cost.
  *   **Perdurantist Prediction:** This case will show that the Endurantist is forced to treat "redness" not as a quality of the object, but as a relation between the object and a time. This prediction holds that this move is ad hoc and undermines the notion of intrinsic qualitative character.

  ### Crux (ii): Ontological Parsimony and Intermittent Existence
  **The Dispute:** Does ontological parsimony favor perdurantism once we count not only objects but also the relations or properties required to sustain endurantism? Specifically, does the Endurantist reliance on causal/functional criteria in non-continuous cases reveal a convergence with Four-Dimensionalist analysis?

  **Test Case:** *The Intermittent Machine.*
  A complex machine is fully disassembled at $t_1$. Its parts are stored in a warehouse. At $t_2$, the parts are reassembled according to the original blueprint. There is no continuous spatiotemporal path of the machine between $t_1$ and $t_2$.
  *   **Endurantist Prediction:** This case will show that "strict identity" can survive gaps in existence provided there is sufficient causal and functional continuity (the same parts, same arrangement, same causal history). The Endurantist predicts this validates the view that persistence is a matter of *sortal-relative identity conditions*, not continuous spatiotemporal presence.
  *   **Perdurantist Prediction:** This case will show that the Endurantist is secretly employing a *gen-identity* or *unity relation* criterion indistinguishable from the Perdurantist's account of temporal parts. If the machine does not exist between $t_1$ and $t_2$, the "object" at $t_1$ and the "object" at $t_2$ are distinct entities linked by a causal relation. The Perdurantist predicts the Endurantist will call this "one object" only by relying on the same continuity criteria 4Dists use to bind temporal parts, thereby admitting that "strict identity" is doing no work.

  **Convergence Analysis (Niche Pressure):**
  Both parties acknowledge a specific pressure point regarding the definition of "wholly present" in the Intermittent Machine case.
  1.  **Verbal Dispute:** The Perdurantist argues that if the Endurantist accepts the machine exists at $t_1$ and $t_2$ but not in between, the Endurantist is treating the machine as a discontinuous spacetime worm (a 4D object with a gap). The Endurantist counters that "wholly present" means "having all spatial parts at a time," not "existing at all times in an interval."
  2.  **Theoretical Convergence:** We record the following joint observation: In the Intermittent Machine case, the Endurantist must appeal to *causal continuity* and *functional organization* to justify why the post-reassembly machine is identical to the pre-disassembly machine. This criterion is structurally identical to the Perdurantist's criterion for grouping temporal stages into a single worm.
      *   **Joint Admission:** If the Endurantist relies on causal/functional continuity to bridge the temporal gap, the ontological difference between "one enduring object with a gap" and "two temporal stages linked by a unity relation" becomes largely verbal. The explanatory work is being done by the *continuity relation*, not by the category of "enduring substance."
      *   **Cost Assessment:** The Perdurantist claims this shows Endurantism pays the same theoretical cost (positing a unity relation) but obscures it under the label of "identity." The Endurantist claims this shows that identity *just is* the right kind of continuity, and 4Dism unnecessarily reifies the stages.

  ## 4. Collaborative Finding on Verbal Dispute and Convergence
  *As a result of analyzing Crux (ii), we append this finding regarding the linguistic and theoretical overlap.*

  We agree that a significant portion of the dispute turns on the phrase "being wholly present."
  *   **Perdurantist Interpretation:** "Wholly present" implies that the *entirety* of the object's being is located at $t$. If the object exists at $t_2$ as well, the entity at $t_1$ must be numerically identical to the entity at $t_2$. In the Intermittent Machine case, this requires a "gappy" identity that looks suspiciously like a discontinuous 4D worm.
  *   **Endurantist Interpretation:** "Wholly present" means "having no temporal parts." It does not entail continuous existence. An object can cease to be wholly present (cease to exist) and later become wholly present again (come to exist) if the right conditions are met.

  **Final Joint Observation:**
  The Intermittent Machine case demonstrates that the Endurantist's commitment to "the same object" in gappy scenarios relies on functional or causal-continuity criteria that bring their account closer to a Four-Dimensionalist analysis of persistence conditions than typically admitted.
  *   If the Endurantist insists on *strict identity* across the gap, they must explain how identity holds without a truthmaker in the intervening time.
  *   If the Endurantist appeals to *causal continuity* as the truthmaker, they are effectively analyzing persistence as a relation between time-slices, which is the core of Perdurantism.

  We conclude that the residual disagreement is not merely about the existence of temporal parts, but about whether "identity" is a primitive, all-or-nothing relation (Endurantism) or a concept derived from more fundamental unity relations (Perdurantism). The Intermittent Machine case suggests that in hard scenarios, the Endurantist is forced to operationalize identity in a way that mimics the Perdurantist's unity relations, raising the question of whether the ontological distinction survives in boundary cases.

  ***

  **Signed:**

  _________________________
  *Representative, Endurantist View*

  _________________________
  *Representative, Perdurantist View*
