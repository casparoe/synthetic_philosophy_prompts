  Vicarious attitudes, such as resentment on behalf of future generations, actually reinforce Strawson's position rather than weaken it. Strawson already acknowledges "vicarious indignation," where we feel outrage on behalf of others within our moral community. Extending this community to include voiceless future persons does not change the mechanism; it simply expands the circle of those whose expectations matter. The feeling remains a demand for regard, proving that responsibility is about relational norms, not causal powers.

  Structural blame is the harder test. When you feel resentment toward a corporation or policy, there is no single face-to-face interaction. However, this does not force us into the "objective attitude" Strawson describes, where we view the target as something to be managed or cured rather than held accountable. We do not treat corrupt institutions as patients; we treat them as culpable agents. This suggests that reactive attitudes can attach to systems that embody collective intentions. If Strawson's framework is to survive here, it must admit that the "participant stance" applies to institutional structures, not just individual psyches.

  This shift resolves the free will tension by pushing toward a robust compatibilism. If we can legitimately blame a system where no single individual possesses total control, then responsibility cannot depend on individual libertarian freedom. Instead, responsibility depends on participation in a normative structure. We blame the system because it violates the expectations that hold our moral community together, regardless of the metaphysical status of the individuals inside it. The "objective attitude" becomes inadequate because refusing to hold systems accountable undermines the very relationships Strawson seeks to protect.

  Ultimately, Strawson's view does not collapse; it matures. It survives by acknowledging that reactive attitudes are tools for maintaining moral order, not just judging individual souls. By accepting structural and vicarious attitudes, we strengthen Strawson's claim that responsibility is a social practice, but we must drop the insistence that it is always personal. The cost of saving the framework is admitting that we can be responsible for things we did not individually will, provided we participate in the structures that caused harm.
