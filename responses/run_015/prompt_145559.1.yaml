  7.  **Final Polish:** Ensure the conclusion is punchy and directly answers the prompt's requirement to explain *why* the collapse fails. (The collapse fails because the *locus* of ethics is the mind, not the world-state).

  8.  *(Final thought before generating)*: Make sure to mention the *Kalama Sutta* or similar texts if relevant, but focus on the *cetanā* definition as the knockout blow. The *Acinteyya* (imponderables) is the second knockout blow regarding calculability.

