answer: |-
  **Essay Question (20 Marks)**

  **Case:** Sam has a ticket to a gig on Friday. At any single moment, Sam's preferences are a perfectly ordinary, transitive ranking. But they shift predictably as the date approaches. Three weeks out, Sam would rather have £80 in hand than go. The night before, Sam would rather go than have £120. A scalper who knows all this buys the ticket off Sam three weeks out for £80, and sells it back to Sam the night before for £120. Sam goes to the gig having paid a net £40 for something that would've been free, and there's nothing special about gigs — the scalper can run the same play on Sam over and over with other events. Yet at no point were Sam's preferences internally inconsistent.

  **Task:** Write an essay addressing the following points:
  1.  Explain how this scenario differs from the standard money pump argument found in textbooks (involving cyclic preferences at a single moment).
  2.  Clarify what the scalper's profit actually establishes about Sam's state. Does losing £40 prove irrationality, or something else?
  3.  Identify the extra premise required to move from "Sam loses money systematically" to "Sam is irrational."
  4.  Analyze the role of precommitment. If Sam could sign a contract three weeks out forbidding the night-before sale, would this make Sam rational, or merely constrained?
  5.  Conclude by evaluating the instructor's hunch: "Getting ripped off shows nothing about rationality by itself."

  ***

  **Model Answer**

  The standard money pump argument relies on synchronic inconsistency. It assumes an agent holds intransitive preferences at a single moment (preferring A to B, B to C, and C to A). A trader can then cycle the agent through swaps, extracting money at each step while leaving the agent with their original holding. Sam's case is fundamentally different because it is diachronic. At any single time slice ($t_1$ or $t_2$), Sam's preferences are transitive and consistent. The exploitation occurs not because Sam's logic is broken at a moment, but because Sam's preferences change predictably over time. The scalper arbitrages the difference between Sam-at-$t_1$ and Sam-at-$t_2$.

  Consequently, the scalper's profit establishes that Sam is diachronically dominated. There exists a available path (keeping the ticket) that leaves Sam better off than the path taken (sell then rebuy). However, financial loss alone does not prove irrationality. Rationality is typically defined as coherence among beliefs, desires, and actions, not guaranteed success. An agent can act perfectly rationally and lose money due to bad luck or unforeseen externalities. Here, the loss is structural, but calling it "irrational" requires a specific normative framework.

  To bridge the gap from "Sam loses money" to "Sam is irrational," we must introduce an extra premise: the norm of Diachronic Consistency. This premise states that a rational agent must act as a unified planner over time, maximizing utility across their entire timeline rather than optimizing locally at each moment. Without this premise, Sam is not one agent making a mistake, but a sequence of different temporal selves, each acting rationally according to their current preferences. If we view rationality as purely synchronic (momentary), Sam is innocent. If we view it as diachronic (temporal), Sam is failing to manage their future self.

  This distinction clarifies the role of precommitment. If Sam signs a contract at $t_1$ forbidding the sale at $t_2$, they avoid the loss. Is this rationality or insurance? Under the synchronic view, precommitment is merely a constraint that prevents future Sam from maximizing future utility; it looks like a restriction of freedom. Under the diachronic view, precommitment is a rational tool that allows the unified agent to enforce their long-term plan against short-term preference shifts. It transforms Sam from a passive sequence of selves into an active planner. Therefore, precommitment does not just "insure" against loss; it enforces the diachronic agency required to avoid the label of irrationality.

  Evaluating the instructor's hunch requires nuance. The hunch states that getting ripped off shows nothing about rationality by itself. This is correct regarding outcomes: loss is not synonymous with error. However, being *pumpable* is not mere loss; it is predictable, avoidable loss driven by the agent's own structure. While pumpability alone does not prove irrationality without the diachronic norm, it does reveal a failure of instrumental efficiency across time. Therefore, the hunch is mostly right: pumpability is not *sufficient* for irrationality without assuming agents ought to be diachronically consistent. But once that norm is accepted, pumpability becomes a definitive marker of irrational planning. The scalper doesn't prove Sam is crazy; they prove Sam lacks a unified theory of their own future.

  ***

  **Marking Scheme**

  1.  **Distinction between Synchronic and Diachronic Pumps (4 marks)**
      *   *Must hit:* Clearly distinguish standard pumps (intransitive preferences at one time) from Sam's case (transitive preferences shifting over time).
      *   *Typical error:* Students claim Sam has intransitive preferences or confuses changing tastes with logical inconsistency.

  2.  **Loss vs. Irrationality Distinction (4 marks)**
      *   *Must hit:* Argue that financial loss (outcome) does not automatically equal irrationality (process/norm violation).
      *   *Typical error:* Equating the £40 loss directly with a proof of irrationality without qualification.

  3.  **Identification of the Extra Premise (4 marks)**
      *   *Must hit:* Explicitly identify the need for a norm of Diachronic Consistency or unified agency over time.
      *   *Typical error:* Failing to name the missing normative assumption or claiming the math alone proves irrationality.

  4.  **Analysis of Precommitment (4 marks)**
      *   *Must hit:* Discuss whether precommitment acts as a rational alignment of selves or merely a constraint on future freedom.
      *   *Typical error:* Dismissing precommitment as just "insurance" without linking it to agency or planning.

  5.  **Verdict on the Hunch (4 marks)**
      *   *Must hit:* Conclude that pumpability is insufficient *unless* diachronic consistency is assumed (nuanced agreement).
      *   *Typical error:* Giving a binary "yes" or "no" without addressing the dependency on the definition of rationality.

  \answer{No, pumpability alone is insufficient}
