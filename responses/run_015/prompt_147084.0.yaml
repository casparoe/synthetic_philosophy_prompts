prompt: |-
  I’m in a philosphy of action semmester and we just covered Strawson’s 'Freedom and Resentment' — well, I skimmed it and my roommate summed up the rest over coffee. She said Strawson thinks the determinism vs free will debate is basically a red herring, because moral responsibility isnt about causal origins at all but about reactive attitudes like resentment, gratitude, or love. The objective attitude, she explained, is treating someone like a broken appliance — you study them to fix or manage them instead of feeling anything interpersonal — and Strawson’s claim is that if determinism were true we’d be forced into that attitude for literally everyone. But since we cant actually live like that, determinism cant really threaten our practices of blame and praise. So being responsible just means being the kind of person others naturally react to with these feelings, and there’s no deeper metaphysical story about desert hiding behind the practice. She also said Strawson is secretly rebuilding moral desert from reactive practice, almost like a secular karma system stripped of metaphysics. I feel like she’s mostly right but also flattening something important. Does Strawson actually say determinism forces the objective attitude on all of us? Is responsibility just whatever emotions people happen to have, or is there a normative structure she’s missing? And is that "rebuilt desert" framing fair, or is she importing karma-style ideas that dont belong in Strawson? Which parts of her summary survive correction, and does her conclusion that determinism is irrelevant still hold?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Action seminar, just covered P.F. Strawson's "Freedom and Resentment."
