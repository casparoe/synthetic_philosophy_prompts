          1.  Determinism vs. Free Will is a red herring.
          2.  Moral responsibility is about *reactive attitudes* (resentment, gratitude, love), not causal origins.
          3.  The *objective attitude* treats people like broken appliances (manage/fix, no interpersonal feeling).
          4.  Strawson's claim: If determinism were true, we'd be *forced* into the objective attitude for everyone.
