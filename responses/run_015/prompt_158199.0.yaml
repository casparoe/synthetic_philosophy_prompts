answer: |-
  This is a sophisticated and precise observation. You have identified a behavioral phenotype that sits in a conceptual blind spot between the standard taxonomy of the Iterated Prisoner's Dilemma (IPD) and the Optional Prisoner's Dilemma (OPD).

  To answer your primary question directly: **No, there is no single, canonical term in the standard game-theoretic or evolutionary biology literature that specifically captures this history-dependent, cooperative-exit strategy.**

  While the components exist in separate literatures (optional participation, partner choice, endgame effects), the specific configuration you describe—*within-round cooperation coupled with between-round strategic abandonment conditioned on partner reliability*—is not standardly named. In the context of your dissertation, you are justified in treating this as a distinct strategic class.

  Below is an analysis of how to delimit this concept from neighboring categories, proposed terminology, and the philosophical implications for the definition of cooperation.

  ### 1. Delimitation from Neighboring Concepts

  To establish this as a distinct failure mode of cooperation, you must distinguish it from three adjacent concepts:

  **A. vs. The Optional Prisoner's Dilemma (OPD)**
  *   **Standard OPD:** Players have three moves: Cooperate, Defect, or Opt-Out (Loner). Opting out usually yields a fixed, autonomous payoff ($L$) independent of the partner.
  *   **Your Strategy:** The exit is not an autonomous "Loner" move taken for safety; it is a *predatory* move taken for extraction. The payoff is derived from the *termination of the partner's expected surplus*, not merely avoiding the cost of cooperation.
  *   **Distinction:** Standard OPD models opting out as a risk-avoidance mechanism. Your strategy models opting out as a *harvesting* mechanism. It exploits the partner's sunk costs in building the cooperative relationship.

  **B. vs. The Endgame Effect**
  *   **Standard Endgame:** In finitely repeated games with a known horizon, backward induction leads to defection in the final rounds. The "shadow of the future" vanishes, making defection dominant.
  *   **Your Strategy:** There is no within-round defection. The strategy maintains the "cooperative mask" until the moment of exit. It does not exploit the *last round* via defection; it exploits the *expectation of round $N+1$* by denying its existence.
  *   **Distinction:** The endgame effect is a collapse of *normative compliance* (I stop following the rule). Your strategy is a collapse of *relational continuity* (I stop playing the game) while maintaining normative compliance.

  **C. vs. Standard Defection (AllD / TFT-Defect)**
  *   **Standard Defection:** Gains a temptation payoff ($T$) within a round by withholding cooperation while the partner cooperates. Triggers punishment (e.g., TFT retaliation).
  *   **Your Strategy:** Pays the cooperation cost ($C$) in every played round. It avoids triggering behavioral punishment mechanisms (like TFT) because the behavioral record is unblemished.
  *   **Distinction:** Standard defection steals the *current* surplus. Your strategy steals the *future* surplus (the discounted value of continued interaction, $\frac{wR}{1-w}$). It is a theft of *potentiality* rather than actuality.

  ### 2. Proposed Terminology

  Since no standard term exists, you should coin or adopt a term that captures the structural nature of the exploitation. Here are three candidates ranked by fit:

  **1. Strategic Abandonment (Recommended)**
  *   **Rationale:** This captures the active, endogenous nature of the exit. It distinguishes the move from exogenous truncation (random death) or standard opting-out. It implies a duty of continuity that is being violated.
  *   **Usage:** "A strategy of Strategic Abandonment maintains within-round cooperation but terminates the dyad once the partner's reliability is established."

  **2. Meta-Defection**
  *   **Rationale:** This frames the exit as a defection not on the *move* (Cooperate/Defect), but on the *meta-game* (Continue/Stop). It signals that the "contract" of the iterated game includes an implicit clause of reasonable continuity.
  *   **Usage:** "While behaviorally cooperative, the strategy commits Meta-Defection by manipulating the continuation probability $\delta$ to zero."

  **3. Continuity Exploitation**
  *   **Rationale:** This highlights the specific resource being exploited: the partner's expectation of future rounds.
  *   **Usage:** "This mutant invades via Continuity Exploitation, harvesting the trust capital without paying the long-term dividend."

  ### 3. Evolutionary and Philosophical Boundary Conditions

  To argue this is a genuinely distinct failure mode, you should establish the following boundary conditions in your modeling:

  **A. The "Trust Investment" Phase**
  For this strategy to be distinct from random truncation, there must be a cost to the partner associated with the early rounds. If the payoff matrix is static and memoryless, exiting early is just a loss of potential gain for both.
  *   *Condition:* The simulation must model **partner-specific investment** or **warm-up costs**. For example, if the payoff $R$ increases with the number of rounds (synergy), or if there is a risk cost in early rounds that is only recouped later. Without this, the strategy is just "short-termism," not exploitation.
  *   *Refinement:* If your simulation shows it invades AllC *more aggressively* than AllD, it implies AllC has a mechanism to punish AllD (e.g., via population structure or reputation) but lacks a mechanism to punish "Leavers." This suggests the population lacks a **"Right of Continuity"** norm.

  **B. The Informational Asymmetry**
  The strategy relies on the partner not anticipating the exit.
  *   *Condition:* The partner must treat the continuation probability ($w$ or $\delta$) as exogenous or constant. If the partner can evolve a "suspicion of exit" (e.g., "If partner has been cooperative for $N$ rounds, demand immediate payoff or defect"), the strategy collapses.
  *   *Implication:* This strategy is an **Evolutionarily Stable Strategy (ESS)** only in populations that cannot model the *endogenous* nature of the continuation probability.

  **C. The Definition of Cooperation**
  This is the crux for a philosophy of biology dissertation.
  *   *Standard View:* Cooperation is defined by the move ($C$ vs $D$).
  *   *Your Challenge:* Cooperation must also be defined by the **maintenance of the interaction structure**.
  *   *Argument:* If an agent pays the cost $C$ but denies the partner the benefit of the *iterated* nature of the game, are they truly a cooperator? You can argue that **Cooperation = (Move $C$) + (Continuity $\delta > 0$)**. Your strategy satisfies the first conjunct but violates the second.

  ### 4. Relevant Literature to Engage

  While the exact term is missing, these fields provide the scaffolding for your argument:

  1.  **Optional Prisoner's Dilemma (Hauert et al., 2002):** Engage with the "Loner" payoff. Argue that your strategy is a *conditional Loner* that uses the Loner option offensively rather than defensively.
  2.  **Partner Choice / Biological Markets (Noë & Hammerstein, 1994):** This literature discusses "partner fidelity." Your strategy is a violation of fidelity without a violation of immediate exchange. It is "market exit" used as a predatory tool.
  3.  **Commitment Problems (Schelling, 1960; Frank, 1988):** Thomas Schelling and Robert Frank discuss the value of binding oneself to continue. Your strategy exploits the *lack* of binding commitment.
  4.  **The "Shadow of the Future" (Axelrod, 1984):** Axelrod emphasizes that cooperation requires a sufficiently large shadow of the future. Your strategy effectively manipulates the partner's shadow of the future to zero, unilaterally.

  ### 5. Recommendation for Your Dissertation

  I recommend framing this as **"The Problem of Structural Exploitation"** or **"The Continuity Paradox."**

  *   **Thesis:** Standard evolutionary models of cooperation focus on *within-round* incentives (the temptation to defect). They overlook *between-round* incentives (the temptation to terminate).
  *   **Contribution:** You are identifying a class of "Cooperative Parasites" that evade detection because they satisfy the behavioral criteria for cooperation ($P(C|C) = 1$) while violating the structural criteria for mutualism (sustained interaction).
  *   **Philosophical Payoff:** This allows you to argue that **cooperation is a temporally extended property**, not a momentary one. An agent cannot be classified as a cooperator based solely on a move vector; they must be classified based on their trajectory management.

  This is a fertile gap in the literature. By naming it (e.g., "Strategic Abandonment") and formalizing the boundary conditions (specifically the requirement for partner-specific investment or trust accumulation), you can make a significant contribution to the philosophy of biological interaction.
