  I'm working through a problem in comparative ethics with a seminar partner, and she has walked me into an argument about Mencius and Xunzi that I cannot exit. She is committed to two claims she thinks any adequate Confucian account must preserve: first, that moral education is genuinely transformative rather than redundant, and second, that the virtues it produces are authentic expressions of the agent's own nature rather than alien impositions. Here is her argument, laid out step by step.

  (1) For Mencius, human nature (xing) contains four innate moral sprouts (duan)—compassion, shame and dislike, deference and yielding, and the sense of right and wrong—which are not full virtues but nascent tendencies that grow like crops when properly irrigated.
  (2) For Xunzi, human nature consists solely of inborn desires for profit, sensual gratification, and competitive advantage; morality is therefore entirely artificial (wei), constructed by sage-kings through ritual (li) and righteousness (yi), with no native root in the heart-mind.
  (3) Consider a paradigmatic case of successful moral education: a student acquires stable dispositions to act compassionately and justly, but only after sustained, structured training in ritual practice and moral reflection.
  (4) If Mencius is right, the student already possessed the compassionate sprout. The teacher's work is purely facilitative—removing weeds or adding water—so the causal contribution of education is merely negative. The mature virtue was already latent in the student's nature, meaning moral education is redundant in principle, however practically convenient.
  (5) If Xunzi is right, the student had no compassionate tendency whatsoever prior to training. Ritual constructs the disposition ex nihilo from raw desire. But then the resulting compassion is not the student's own nature expressing itself; it is an external architecture imposed upon an alien substrate. The student becomes a well-conditioned automaton, not a genuinely moral agent whose actions flow from an integrated self.
  (6) Therefore, on either classical framework, successful moral education cannot be both genuinely transformative and authentically expressive of the agent's nature: it must be either redundant (Mencius) or inauthentic (Xunzi).
  (7) Yet our best phenomenological and developmental evidence suggests that mature moral agents are both profoundly changed by education and experience their virtues as authentic, not as foreign implants.
  (8) So the Mencian-Xunzian dichotomy forces us to deny either the efficacy or the authenticity of moral cultivation, which is implausible.

  She suspects the slip occurs between (4) and (6), perhaps through an equivocation on "transformative," but I cannot locate it. You are a professional philosopher specializing in early Confucian ethics and moral psychology. Before diagnosing the argument, briefly brainstorm the central conceptual distinctions at stake—particularly xing versus wei, potentiality versus actualization, and Xunzi's doctrine of hua xing (the transformation of nature through accumulated artifice). Then identify precisely which step fails, explain why it looks plausible despite the failure, and spell out what giving up that step costs for the broader debate between Mencius and Xunzi. If the chain is actually valid and the problem lies instead in a premise, indicate which premise is least costly to reject and what that rejection implies for Confucian moral psychology. Be precise with technical terms, but do not provide bibliographies, citations, or reading lists.
