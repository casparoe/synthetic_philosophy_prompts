answer: |-
  **TO:** Museum Review Board Members
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on 1974 Meridian Labor Accords Gallery

  **Recommendation**
  I recommend we vote to **Approve in Principle, Pending Revision**. We should not reject the gallery outright, as the subject matter is vital, nor should we approve the current script, as it compromises historical integrity. I propose we condition approval on specific edits to the interpretive text, with a **45-day revision timeline** for the curatorial team to submit a new draft for final sign-off.

  **The Case for Storytelling**
  I want to start by validating the argument made by several board members and the curators: dry history fails the public. Those advocating for the current design are correct that visitors need a thread to follow. A simple list of dates and documents turns a museum into a storage room. We need narrative arc to generate empathy and engagement. If we don't explain *why* events mattered, visitors will walk away indifferent. The curators' desire to frame union leaders as heroic or naive comes from a genuine place—they want us to care about the outcome. A public history museum must communicate, not just archive. On this point, the "good storytelling" argument is strong.

  **The Problem with Hindsight**
  However, there is a critical line between *explaining* history and *rewriting* it. Our disagreement stems from how we handle the gap between 1974 and 1989.

  When we label a clause as a "fatal flaw" in 1974, we are using knowledge from 1989 to change the reality of 1974. In 1974, that clause might have been a necessary compromise to get the deal signed. By calling it "fatal" based on later events, we strip the actors of their actual context. We make them look foolish for not predicting the future, rather than showing them making difficult choices with incomplete information.

  This matters because our mission is public *history*, not historical fiction. If we teach visitors that history moves in clean, predictable arcs where causes always look like effects, we are teaching them a false lesson about how the world works. Real history is messy, contingent, and often accidental. A gallery that smooths over that messiness for the sake of a cleaner story ultimately undermines the public's trust in us.

  **The "Retroactive Intentional Framing" Issue**
  This brings us to the specific concept of "retroactive intentional framing." This must be removed. Assigning strategic intentions to actors based solely on later results is fundamentally dishonest. If a leader signed a document in 1974 and we annotate it saying they intended to cause the 1989 collapse because that's what happened, we are fabricating evidence.

  One member argued this is "honest" because people think in narratives. But there is a difference between how people *think* and how history *happened*. Our job is to bridge that gap, not reinforce the misconception. We can explain that a decision *led* to a collapse without claiming the actor *wanted* the collapse. We can preserve the narrative drama without falsifying the human motivation.

  **Proposed Conditions and Timeline**
  To move forward, I propose the following conditions for approval:

  1.  **Remove Retroactive Intentionality:** All annotations assigning intent based on outcomes unknown to the actors must be rewritten. Intent must be supported by contemporary evidence (letters, minutes, speeches from the time), not later results.
  2.  **Contextualize Hindsight:** Labels that discuss "flaws" or "mistakes" must be framed as historical analysis (e.g., "Historians now argue...") rather than objective fact present at the time.
  3.  **Highlight Contingency:** The narrative should explicitly show moments where things could have gone differently, rather than presenting the 1989 collapse as inevitable from 1974.

  **Timeline**
  *   **Today:** Board votes to Approve in Principle pending these conditions.
  *   **45 Days from Today (December 8):** Curatorial team submits revised script and label copy.
  *   **60 Days from Today (December 23):** Board subcommittee reviews revisions. If conditions are met, final approval is granted via email vote without requiring another full meeting.

  This path respects the curators' work and the need for engagement, but it holds the line on accuracy. We can tell a compelling story without telling a fairy tale.

  I look forward to discussing this next Thursday.
