      *   *Check the $n \ge 3$ logic:* Pearce (1984). Strategy is dominated iff never a BR to *any* belief (correlated). Rationalizability (Bernheim 1984) restricts beliefs to independent. So Rationalizability $\supseteq$ IESDS survivors. IESDS eliminates *more*. So if you claim IESDS follows from "Common Belief in Rationality" (usually linked to Rationalizability), you are assuming *more* than CBR. You are assuming CBR + Correlated Beliefs allowed.
