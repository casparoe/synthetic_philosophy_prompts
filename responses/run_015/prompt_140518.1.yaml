      *   **The Worry:** A specific counterexample involving ordinal vs. cardinal utility. The user constructed a game where IESDS (with mixed strategies) yields different results under positive affine transformations (actually, just monotonic increasing transformations that aren't affine) of one player's payoffs. This suggests the procedure depends on cardinal utility (Expected Utility Theory - EU), not just ordinal preferences.
