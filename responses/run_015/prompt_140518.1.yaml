answer: |-
  This is an exceptionally sharp worry. You have correctly identified the fault line between the *ordinal* conception of rationality (preference consistency) and the *cardinal* machinery required to make mixed-strategy dominance work. Your counterexample is valid, and it strikes at the heart of the "assumption-light" claim.

  Here is the map you requested, ranked from **Fatal** (undermines the core philosophical claim) to **Awkward** (limits scope but preserves internal logic).

  ### 1. The Cardinality Requirement (Fatal to "Assumption-Light")

  **The Verdict:** Your relabeling counterexample is decisive. Iterated Elimination of Strictly Dominated Strategies (IESDS) using mixed strategies is **not invariant under ordinal transformations**. It is only invariant under positive affine transformations.

  **The Damage:**
  Your "no-lose" argument ("if a hedge beats your action against every profile, you can't lose by switching") implicitly assumes that the value of the hedge is the **expected value** of its components.
  *   In your first numbering, the "hedge" (mix of A and B) has an expected payoff lower than C in some columns *unless* the utility intervals are wide enough to bridge the gap.
  *   In the second numbering, you stretch the intervals (0 to 2 becomes 0 to 10). This stretching makes the expectation of the mix high enough to dominate C.
  *   Since the agent's ordinal preferences haven't changed, but the recommendation of the procedure has, the procedure is not tracking ordinal rationality. It is tracking **vNM rationality**.

  **The Standard Reply (and why it fails you):**
  A standard game theorist will say: *"A strategic-form game is defined as a tuple including vNM utility functions, not ordinal preferences. Therefore, the procedure is invariant under the correct class of transformations (affine)."*
  *   **Concession:** You must concede that this reply is technically correct within the math but philosophically costly. It means IESDS(mixed) is not a consequence of "rationality" simpliciter (consistent preferences); it is a consequence of "rationality + Independence Axiom + Risk Neutrality over the mixing device."
  *   **Why it's Fatal to your claim:** You pitched this as the "assumption-light core." Expected Utility (EU) is a heavy assumption. It rules out risk aversion over the randomization device itself, ambiguity aversion, and any non-linear weighting of probabilities. If a student asks, "Why should I care about the expectation of the mix rather than the worst-case outcome of the mix?", the "no-lose" argument has no answer unless you *stipulate* EU.

  ### 2. The Epistemic Status in $n \ge 3$ (Significant)

  **The Verdict:** Your memory is correct, and it complicates the epistemic story you tell students.

  **The Detail:**
  *   **Pearce's Lemma (1984):** A strategy is strictly dominated by a mixed strategy if and only if it is **never a best response** to any belief (probability distribution) over the opponents' strategy profiles.
  *   **The Catch:** In games with $n \ge 3$ players, a "belief over profiles" allows for **correlations** between opponents. (e.g., Player 1 believes Players 2 and 3 might correlate their moves).
  *   **Rationalizability (Bernheim/Pearce):** If you define "Common Belief in Rationality" (CBR) as requiring beliefs to be **independent** (product measures), then the set of rationalizable strategies is **larger** than the set of strategies surviving IESDS.
  *   **The Mismatch:** IESDS eliminates strategies that could be best responses to *correlated* beliefs. If you teach IESDS as the direct consequence of CBR, you are implicitly assuming that players consider correlated beliefs possible (or that the correlation device is part of the game state).

  **The Damage:**
  *   For $n=2$, IESDS and Rationalizability coincide (beliefs are trivially independent). Your story works fine.
  *   For $n \ge 3$, IESDS is **stronger** than CBR with independent beliefs. It eliminates strategies that a rational player *could* play if they believed opponents were independent.
  *   **Concession:** You must concede that for $n \ge 3$, the procedure assumes more than just rationality. It assumes either (a) opponents can correlate (Correlated Equilibrium style) or (b) we are ignoring the independence constraint on beliefs. If your seminar treats "Common Belief in Rationality" as implying independent conjectures (standard in Nash foundations), IESDS **overgenerates** elimination.

  ### 3. Ambiguity and Risk Attitudes (Significant)

  **The Verdict:** The "no-lose" argument loses its grip if the agent does not evaluate the mixed strategy using Expected Utility.

  **The Detail:**
  *   **Risk Aversion over Mixes:** Even if an agent accepts EU over opponent moves, they might be risk-averse over the *mixing device* (the lottery they use to play). If $u(\text{mix}) < \sum p_i u(s_i)$, a mix that dominates in expectation might not dominate in utility.
  *   **MaxMin / Ambiguity Aversion:** If a player has a set of priors and evaluates acts by the worst-case prior (Gilboa-Schmeidler):
      *   Does dominance hold? If $\sigma$ strictly dominates $s$ pointwise (i.e., for every opponent profile $t_{-i}$, $EU(\sigma, t_{-i}) > EU(s, t_{-i})$), then yes, $\min EU(\sigma, \cdot) > \min EU(s, \cdot)$.
      *   **However:** This relies on the payoff of the mix against $t_{-i}$ being calculated as an expectation. If the agent is ambiguity-averse regarding the *opponents*, they might not reduce the compound lottery. But more critically, if they are ambiguity-averse regarding the *mix itself* (they don't trust the randomization), the dominance relation breaks.
  *   **The "No-Lose" Gap:** The argument "you can't lose by switching" is true in *payoff space*, but not necessarily in *preference space* if preferences are non-linear over lotteries.

  **Concession:** You must concede that the "no-lose" argument is only valid for agents who are **risk-neutral over the mixing device**. If a student says, "I prefer the sure thing C to the gamble 50/50 A/B even if the gamble pays more on average," your procedure calls them irrational, but their preferences are coherent (e.g., concave utility).

  ### 4. Normative Insulation (Merely Awkward)

  **The Verdict:** This is a standard philosophical defense, not a logical flaw, but it limits the theory's bite.

  **The Detail:**
  *   **Predictive:** If treated as predictive, IESDS is frequently falsified (people play dominated strategies).
  *   **Normative:** If treated as normative ("this is what you *should* do"), it is insulated from data.
  *   **The Dodge:** The risk here is making the theory vacuous. If every violation is attributed to "irrationality," the concept of rationality does no work. However, in a philosophy seminar, this is often the intended scope.
  *   **Why it's only Awkward:** It doesn't contradict your internal logic. It just acknowledges that the "assumption-light" core might be too light to constrain actual behavior, serving instead as a baseline for ideal theory.

  ### Summary for the Seminar

  If you want to maintain the position that IESDS(mixed) is the "core," you need to refine the claim to avoid the fatal objection:

  1.  **Acknowledge the Cardinality:** Admit that IESDS(mixed) requires vNM utilities. It is not a theorem of ordinal choice theory. The "no-lose" argument presupposes linearity of utility over lotteries.
  2.  **Refine "Rationality":** Specify that by "rational," you mean "Bayesian Rational" (maximizing subjective expected utility), not just "logically consistent preferences."
  3.  **Qualify the Epistemic Story:** For $n=2$, your story holds (IESDS = Rationalizability). For $n \ge 3$, clarify that IESDS corresponds to Common Belief in Rationality *allowing for correlated beliefs* about opponents.
  4.  **The "Core" Claim:** You can still argue it is the "core," but define the core as **Bayesian Game Theory** rather than **Decision Theory**. It is the minimal commitment of the Bayesian paradigm, not the minimal commitment of rationality simpliciter.

  **Recommendation:**
  Don't abandon the move—it is pedagogically vital. But change the pitch. Instead of "This requires almost no assumptions," try: "This is the minimal commitment required if you accept Expected Utility and Common Belief in Rationality." That preserves the rigor without inviting the fatal counterexample you found.
