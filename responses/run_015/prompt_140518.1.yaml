  2.  **Deconstruct the Counterexample (Question 1):**
      *   *The Setup:* Player 1 (Rows A, B, C), Player 2 (Cols X, Y, Z).
      *   *Player 2:* Matching game (wants to match P1's row). Payoffs: 2 for match, 0 otherwise.
      *   *Player 1 (Game 1):* A=(2,0,1), B=(0,2,1), C=(1.5, 1.5, 0).
          *   Check dominance of C by mix of A, B. Let $\sigma_1 = pA + (1-p)B$.
          *   Against X: $2p > 1.5 \Rightarrow p > 0.75$.
          *   Against Y: $2(1-p) > 1.5 \Rightarrow 1-p > 0.75 \Rightarrow p < 0.25$.
          *   Contradiction. C is *not* strictly dominated by any mix of A, B.
      *   *Player 1 (Game 2):* A=(10,0,1), B=(0,10,1), C=(1.5, 1.5, 0). (Ordinal equivalent to Game 1).
          *   Check dominance of C by mix of A, B. Let $\sigma_1 = 0.5A + 0.5B$.
          *   Against X: $5 > 1.5$.
          *   Against Y: $5 > 1.5$.
          *   Against Z: $1 > 0$.
          *   C *is* strictly dominated.
      *   *The Implication:* IESDS with mixed strategies is *not* invariant under ordinal transformations. It requires cardinal utility (specifically, vNM utility).
      *   *The "No-Lose" Argument:* The user claims the argument is "if some hedge... beats your action... you can't lose by switching."
      *   *The Problem:* The "hedge" (mixed strategy) only "beats" the pure strategy in terms of *expected value*. If the agent doesn't maximize expected value (e.g., they care about variance, or they have non-EU preferences like rank-dependent utility, or simply ordinal preferences without risk neutrality/linearity), the "no-lose" argument fails. A mix that yields higher *expected* payoff might yield a lower *minimum* payoff or violate stochastic dominance depending on the utility function.
      *   *Verdict:* This is **Fatal** to the claim that it is "assumption-light" in the sense of requiring only ordinal rationality. It assumes EU.
      *   *Standard Reply:* The standard definition of a "game" in this context *includes* vNM utilities. If you define a game as ordinal preferences, you can't define mixed strategy dominance. So, technically, the procedure is invariant under *affine* transformations, which is the correct invariance class for EU.
      *   *Concession:* The defender must concede that "rationality" here implies "Bayesian/EU rationality," not just "consistent ordinal preferences." This is a heavy assumption in philosophy (risk attitudes, independence axiom).

  3.  **Epistemic Status in $n \ge 3$ Players (Question 2):**
      *   *The Fact:* Pearce's Lemma (1984). A strategy is strictly dominated by a mixed strategy iff it is never a best response to any *belief* (probability distribution) over opponents' strategy profiles.
      *   *The Nuance:* In $n \ge 3$, a "belief" over opponents' profiles allows for *correlations* between opponents. (e.g., P1 believes P2 and P3 might correlate their moves).
      *   *Independent Beliefs:* If we assume players believe opponents play independently (a common assumption in Nash Equilibrium), the set of undominated strategies can be *larger* than the set of strategies surviving IESDS.
      *   *The User's Claim:* "Common belief in rationality."
      *   *The Conflict:* Common belief in rationality + Independent Beliefs $\Rightarrow$ Rationalizability (Bernheim/Pearce). Rationalizability $\subseteq$ IESDS survivors. Actually, for $n=2$, IESDS = Rationalizability. For $n \ge 3$, IESDS eliminates *more* strategies than Rationalizability (because IESDS allows dominating mixes that rely on correlations opponents wouldn't actually make if they were independent).
      *   *Wait, check direction:*
          *   Strategy $s_i$ is dominated by mix $\sigma_i$ iff $s_i$ is not a BR to *any* belief $\mu_{-i}$ (Pearce).
          *   If we restrict beliefs to *independent* distributions (product measures), fewer strategies are "never best responses."
