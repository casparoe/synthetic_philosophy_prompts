answer: |-
  Your colleagues are using a poetic conclusion as a premise, and while the slogan captures the agent-relative structure of deontological reasons, it collapses into indefensible absolutism if taken literally against catastrophic outcomes.

  **1. The Lexical Priority Thesis (Trivial)**
  *Claim:* Justice is a higher-order value than welfare or utility.
  *Status:* **Settled among deontologists.** This is the definition of the position.
  *Defensibility:* True but useless. It asserts the hierarchy without explaining *why* justice overrides welfare when the welfare cost is infinite (the heavens falling). It begs the question against the consequentialist who denies the hierarchy exists.

  **2. The Agent-Relative Constraint Thesis (Moderate)**
  *Claim:* I have a specific reason not to *commit* a violation that I do not have to *prevent* a violation committed by others.
  *Status:* **Settled among deontologists.** This is the standard solution to the paradox of deontology (associated with Scheffler and Nagel).
  *Defensibility:* **Defensible.** This explains why I shouldn't violate one right to save five: my reason is indexed to my agency, not the state of the world. The slogan hints at this ("let *justice be done*" by me), but doesn't articulate the agent-relative mechanism.

  **3. The Non-Additivity Thesis (Metaphysical)**
  *Claim:* Rights violations are not aggregable units; you cannot sum five violations to outweigh one.
  *Status:* **Live dispute.** Consequentialists deny this; deontologists affirm it, but disagree on the grounding (separateness of persons vs. contractualism).
  *Defensibility:* **Defensible, but requires argument.** This is the specific claim needed to block the "minimize violations" argument. If rights don't sum, the math of "1 vs 5" never starts. The slogan assumes this but offers no justification for why rights resist aggregation.

  **4. The Catastrophic Absolutist Thesis (Radical)**
  *Claim:* Justice must be done even if the consequences are literally apocalyptic (the heavens actually fall).
  *Status:* **Live dispute.** Kant is often read this way, but most contemporary deontologists reject it.
  *Defensibility:* **False/Indefensible.** Almost no modern deontologist holds that constraints hold regardless of catastrophic cost (e.g., torture one to prevent nuclear genocide). This is the "dangerous grad student" reading. It treats the slogan as a lexical absolute without a threshold.

  **Which Reading Does the Work?**
  To answer the paradox of deontology (why not minimize violations?), your colleague needs **Thesis 3 (Non-Additivity)** grounded in **Thesis 2 (Agent-Relative Constraints)**. They need to argue that the reason not to violate is not a goal to be promoted, but a constraint on action, and that violations do not aggregate.

  **Where the Slogan Fails**
  The slogan fails because it smuggles in **Thesis 4 (Catastrophic Absolutism)**. By invoking "the heavens fall," it implies that *no* consequence matters, rather than merely that *some* consequences don't justify *this* action.
  *   **Settled Consensus:** Most deontologists accept threshold deontology (constraints hold until consequences become catastrophic).
  *   **My Assessment:** If your colleague uses the slogan to block the minimization argument in standard cases (1 vs 5), they are relying on Thesis 2 and 3, which are robust. If they use it to block trade-offs in catastrophic cases (1 vs millions), they are relying on Thesis 4, which is philosophically bankrupt.

  **Bottom Line for Pushback**
  Ask them whether they endorse the slogan literally. If the heavens falling means "universal destruction," and they say "yes, still do justice," they are committed to an absolutism almost no one holds. If they say "no, there's a threshold," then the slogan is merely rhetorical flair for threshold deontology, and the real work is being done by the unspecified threshold criteria, not the maxim itself.
