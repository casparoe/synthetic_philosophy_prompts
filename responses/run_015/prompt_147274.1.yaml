answer: |-
  **The Scenario**

  You are standing in a room with a stranger who has already tossed a fair coin (hidden from you, known to them) and formed a fallible read of your disposition to hand over cash (70% accurate, based on prior conversation, fixed before approach). A bank transfer of $W = 3,000$ dollars has been arranged by the stranger, and you are now facing a request to hand over $1,000$ in cash; you know payment causally affects nothing regarding the transfer, which is already settled. In **Setting A**, the transfer occurred if and only if the coin landed Heads AND the read predicted you would pay, while the request is being made now if and only if the coin landed Tails. In **Setting B**, the transfer occurred if and only if the coin landed Heads, while the request is being made now if and only if (the read predicted you would pay XOR the coin landed Heads). You know these rules, you know you are facing the request, and you must decide whether to pay or refuse based solely on the monetary outcomes.

  **Verdicts and Arithmetic**

  *   **Causal Decision Theory (CDT) & Evidential Decision Theory (EDT):** Both theories refuse in both settings.
      *   *Setting A:* Facing the request entails the coin is Tails (Request $\iff$ Tails). Thus, Heads is impossible, and the windfall condition (Heads $\land$ Read=Pay) is false regardless of your action. Paying yields $-\$1,000$; refusing yields $\$0$. **Verdict: Refuse.**
      *   *Setting B:* Facing the request provides evidence about the coin, but your action cannot causally influence the settled coin or the prior read. Conditioning on the request, the probability of Heads is $0.3$ whether you pay or refuse (derived from $P(H|Req, Act) = \frac{P(Req|H, Act)P(H)}{P(Req|Act)}$; numerator is $0.3 \times 0.5$ for both actions given the XOR structure and 0.7 accuracy). Expected utility for Paying is $0.3(\$3,000) - \$1,000 = -\$100$. Expected utility for Refusing is $0.3(\$3,000) = \$900$. **Verdict: Refuse.**
  *   **Functional Decision Theory (FDT):** Pays in Setting A; refuses in Setting B. *Note: FDT reasoning here explicitly adopts an updateless standpoint, evaluating the decision procedure's output as if determining the prediction prior to the coin toss, rather than conditioning on the request's screening information.*
      *   *Setting A:* FDT evaluates the expected utility of the *algorithm* outputting Pay vs. Refuse, weighted by the prior coin probability (0.5), ignoring the fact that the request screens off Heads.
          *   $EU(Pay) = 0.5 \times [0.7 \times \$3,000] + 0.5 \times [-\$1,000] = \$1,050 - \$500 = \$550$.
          *   $EU(Refuse) = 0.5 \times [0.2 \times \$3,000] + 0.5 \times [\$0] = \$300$.
          *   Since $\$550 > \$300$, **Verdict: Pay.**
      *   *Setting B:* FDT conditions on the request because the request's occurrence is logically dependent on the decision in a way that screens off the windfall benefit.
          *   $EU(Pay|Req) = P(H|Req, Pay) \times \$3,000 - \$1,000 = 0.3 \times \$3,000 - \$1,000 = -\$100$.
          *   $EU(Refuse|Req) = P(H|Req, Refuse) \times \$3,000 = 0.3 \times \$3,000 = \$900$.
          *   **Verdict: Refuse.**

  **Structural Feature and Comparison**

  The isolating variable is the **attachment point of the predictor's gate clause**. In Setting A, the gate controls the payoff in the *counterfactual* branch (Heads) while the agent is situated in the *actual* branch (Tails); this carries the structure of the **Counterfactual Mugging**, where FDT pays to secure the algorithm's performance in the world that didn't happen. In Setting B, the gate controls the *arrival of the request* in the actual branch via an XOR relation with the coin; this carries the structure of **XOR Blackmail**, where the correlation between action and state is screened off by the observation of the request itself, leading FDT to refuse. The theories diverge only because Setting A allows the decision to logically determine the payoff in a branch the agent knows they are not in, whereas Setting B ties the decision to the observation of the branch itself.

  **Tipping-Point Computation**

  FDT's verdict in Setting A flips when $EU(Pay) = EU(Refuse)$. Using accuracy $p$ and stake $W$:
  $$0.5(pW) - 0.5(1000) = 0.5((1-p)W)$$
  $$(2p - 1)W = 1000$$
  With $W=3,000$, the critical accuracy is $p = 2/3 \approx 0.67$. Our specified $p=0.7$ sits just above this threshold, yielding the payoff ratio of $550/300 \approx 1.83$ (within the required 1.2–2.0 band). If accuracy drops below 0.67, FDT refuses in Setting A, collapsing the contrast with CDT/EDT. If the windfall were made unconditional on the read (i.e., just Heads), the term $pW$ becomes $W$ for both actions, eliminating the leverage FDT needs to justify paying the cost.

  **Objection and Reply**

  *Objection:* A causal theorist will charge that FDT in Setting A is covertly re-running an ex-ante calculation after the coin is settled, effectively "buying" a correlation with a prediction the agent can no longer influence. By ignoring the information that the request implies Tails, FDT violates the principle that decisions should be made from the agent's current epistemic state, not a hypothetical prior one.

  *Reply:* FDT replies that the agent's current epistemic state is the output of a decision procedure that existed before the coin toss; to maximize utility, one must select the output that the *procedure* should have had, which logically determines the prediction. The "ex-ante" perspective isn't a temporal retreat but a logical necessity for capturing the dependency between the read and the action.

  *Survival:* The objection survives insofar as it highlights that FDT requires the agent to act *against* their knowledge of the current branch (Tails) to optimize for a branch they know is counterfactual (Heads). This demands a conception of agency that treats logical facts as more fundamental than observed physical facts, which remains metaphysically contentious.

  **Limitations**

  1.  **Implementation:** It is unclear whether an unmodified human can psychologically implement FDT's recommendation in Setting A, as it requires paying a certain cost for a benefit known to be impossible in the actual world, resisting the overwhelming intuitive pull of "the money is already gone."
  2.  **Calibration:** The result depends sensitively on the accuracy estimate ($p=0.7$). In real life, agents cannot calibrate a stranger's predictive accuracy to within the narrow band required (above 0.67) without extensive data, making the verdict fragile in application.
  3.  **Knowledge State:** The case assumes the agent accepts the structural rules as common knowledge; if the agent doubts the "Request iff Tails" rule in Setting A, the screening logic fails, and CDT/EDT might also pay, dissolving the contrast.
