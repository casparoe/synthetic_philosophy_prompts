      *   *Complexity:* Preserving all requires a multi-clause principle (Physical Risk, Financial Barrier, Core Access). It's not overly complex, but it requires nuanced distinctions.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the user's position (liberal-ish/regulatory but rights-based).
