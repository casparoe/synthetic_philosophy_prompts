      *   *Constraint Check:* Did I include citations? No. Did I keep it to roughly two pages (word count wise)? I need to be concise.
      *   *Technical Precision:* Ensure the distinction between "probabilistic self-belief" (e.g., Christiano et al. style) and "module-relative weighting" is clear. The latter is about *architecture*, not just uncertainty values.
