answer: |-
  The implicit theory governing our treatment of the dead in narrative is a hybrid of **Property Rights** and **Epistemic Stewardship**, but it is unstable. To reconstruct it, we must separate what the practice *strictly presupposes* (the mechanical requirements for the practice to function) from what *fits comfortably* (the moral rhetoric used to justify it).

  ### 1. The Implicit Theory: Presupposition vs. Fit

  **What Practice Strictly Presupposes: The Dead as Managed Resources**
  Strictly speaking, current practice presupposes that the dead are **narrative resources** whose usage rights are transferred to the living.
  *   **In Law:** The dead are intellectual property. The "right of publicity" treats a life as a licensable brand. Invention is permissible if the rights-holder (the estate) consents.
  *   **In Drama:** The dead are raw material for aesthetic ends. Invention is permissible if it serves the narrative arc, provided the estate is paid or the figure is public enough to be fair game.
  *   **In History:** The dead are data points. Invention is forbidden not because it hurts the dead, but because it corrupts the dataset for the living.
  *   **The Core Presupposition:** The dead subject has no standing. All authority resides with the *proxy* (heir, director, or historian). The duty is not *to* the dead, but *regarding* the dead, managed by the living.

  **What Merely Fits Comfortably: The Dead as Honor-Bound Subjects**
  Comfortably, the practice adopts the language of **Legacy and Dignity**.
  *   Historians claim they forbid invention to "respect the truth" of the person.
  *   Filmmakers claim they invent to "capture the spirit" of the person.
  *   Heirs claim they sue to "protect the memory" of the person.
  *   **The Fit:** This language works because it mimics a duty owed *to* the subject. It fits our intuition that people matter. But it is inconsistent with the strict presupposition: if the dead were truly subjects of honor, defamation laws would not expire, and "spiritual truth" would not be licensable to the highest bidder.

  ### 2. Evaluating the Candidate Accounts

  You offer two accounts: **Anti-Deception** (duty to the living/record) and **Answerability** (duty to the subject's agency).

  **The Failure of Answerability**
  Your counter-example is decisive. If the duty were based on answerability (the right to consent or correct), then the permanently unconscious or severely demented living would be *fair game*. They cannot answer back. Yet, practice treats them as *hyper-protected*. We require higher ethical hurdles to depict a living coma patient than a dead king. This refutes the Answerability account. The duty does not vanish when the voice vanishes; it intensifies.

  **The Limitation of Anti-Deception**
  The Anti-Deception account explains the Historian's code but fails to explain the Biopic's license. If the duty were solely to the audience's accurate belief, "Based on a True Story" would be regulated as strictly as a textbook. It is not. Audiences are permitted (even expected) to be emotionally misled for the sake of art. This account cannot explain why we tolerate deception in drama but forbid it in history, despite the audience often conflating the two.

  **The Winning Account: The Vulnerability Principle**
  The practice actually presupposes a **Vulnerability Principle**.
  *   **Theory:** We owe the non-responsive (dead or comatose) a duty of *non-exploitation* precisely because they cannot contest the representation.
  *   **The Gradient:** The reason the comatose are *more* protected than the dead is not their answerability, but the **fidelity of their proxy**.
      *   *The Dead:* Their proxies are heirs, whose fiduciary duty is often financial (maximizing estate value). They may *sell* the right to invent dialogue.
      *   *The Comatose:* Their proxies are guardians, whose fiduciary duty is welfare-based (best interests of the patient). They rarely *sell* the right to invent dialogue.
  *   **Conclusion:** The duty is to protect the vulnerable from being used in ways they cannot resist. The variation in protection is a function of how strictly we trust their living proxies to guard that vulnerability.

  ### 3. Consistency and Underdetermination

  **Inconsistency**
  The current practice is fundamentally inconsistent.
  1.  **Epistemic vs. Economic:** Historians operate on an epistemic ethic (truth is paramount); Filmmakers operate on an aesthetic ethic (story is paramount); Law operates on an economic ethic (value is paramount).
  2.  **The "True Story" Loophole:** We claim to honor the Vulnerability Principle by requiring estate consent for biopics. But since the estate can monetize vulnerability, we effectively allow the *exploitation* of the dead so long as the heirs are paid. This contradicts the protection afforded the comatose, whose guardians cannot ethically monetize their likeness in the same way.

  **Underdetermination**
  The theory is underdetermined regarding **Audience Competence**.
  *   If the duty is to protect the vulnerable from misrepresentation, the crucial variable is how the audience receives that representation.
  *   Current practice assumes the audience can distinguish between "History" and "Drama." Evidence suggests they cannot.
  *   The theory does not dictate *where* the burden of truth lies: with the creator (to be accurate), the proxy (to vet accuracy), or the viewer (to be skeptical). Currently, it is haphazardly distributed among all three.

  ### 4. A Coherent Practice

  If we accept the **Vulnerability Principle** as the governing ethic—acknowledging that the dead cannot defend themselves and that audiences cannot reliably distinguish invention from record—a coherent practice must shift the burden of transparency from the *proxy* to the *producer*.

  We must treat historical drama not as "art with a disclaimer," but as **simulated testimony**. Since the dead cannot correct the record, and the audience cannot detect the fabrication, the fabrication must be visually or audibly tagged.

  **Proposed Protocol: Granular Provenance Markers**
  The "Based on a True Story" card is too blunt. It functions as a shield for the producer rather than information for the viewer. A coherent practice would require:

  1.  **Scene-Level Metadata:** Streaming platforms or theatrical releases should offer an optional overlay (similar to "subtitles for the hearing impaired") that tags specific scenes:
      *   *Green:* Verbatim from recorded evidence.
      *   *Yellow:* Inferred from evidence, dialogue reconstructed.
      *   *Red:* Invented for narrative cohesion (composite characters, imagined motives).
  2.  **The "Comatose Standard" for Public Figures:** For recently deceased figures (e.g., within 50 years), where living memory exists, the standard should approach the protection of the comatose. Invention of motive or private dialogue should be prohibited unless explicitly labeled, regardless of estate consent. Estate consent should not override the audience's right to know they are watching fiction.
  3.  **End-Credit Sourcing:** A mandatory "Source Ledger" in credits, listing specific archives or biographies for key claims, analogous to academic citation but formatted for general audiences.

  **Why This Works**
  This aligns the practice with the Vulnerability Principle. It acknowledges that the dead cannot speak, so we must not let the living speak *for* them without signaling that it is a ventriloquism. It respects the audience's cognitive limitation (they don't discount drama) by removing the need for them to discount it—they are told exactly what is real and what is not.

  It resolves the inconsistency between History and Drama by admitting that Drama is a form of *historical argumentation*. If you are making an argument about a person who cannot reply, you owe the audience the footnotes. This treats the dead not as property to be licensed, but as subjects whose silence demands our heightened honesty.
