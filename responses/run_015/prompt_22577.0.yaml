answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. The remnants of a seminar on Moral Metaphysics linger in the air. **Elena**, a proponent of counterfactual theories of causation, stirs her tea. **Marcus**, a defender of process-based event ontology, leans back in his chair.*

  **Elena:** You conceded the moral point, Marcus, but you retreated into metaphysics too quickly. In the seminar, you agreed the doctor is responsible for the patient's death because he withheld the morphine. But you deny the withholding *caused* the death. That seems like a distinction without a difference. If the doctor had injected the morphine, the patient would be alive. The difference the doctor made *is* the causation.

  **Marcus:** It's not a distinction without a difference, Elena; it's the difference between the world as it is and the world as we judge it. Look at the ontology. When the doctor injects morphine, there is a physical event: a depression of the plunger, a flow of liquid, a chemical interaction. When he *withholds* it, what is the event? He sits on his hands. He drinks coffee. The patient dies from the cancer. Where is the causal link? There is no transfer of energy, no physical process connecting the doctor's stillness to the patient's cessation of breath. To call an omission a cause is to reify nothingness.

  **Elena:** You're clinging to a billiard-ball model of causation that doesn't work for human action. We aren't talking about physics; we're talking about agency. A counterfactual account captures what matters: dependence. The patient's death depended on the doctor's inaction. If you deny that is causation, you have to say the death was uncaused, or caused solely by the cancer. But the cancer was a background condition. The *change* in the expected trajectory came from the doctor.

  **Marcus:** The cancer was the cause. The doctor's omission is merely the context in which the cause operated. But let's grant your counterfactual dependence for a moment. This is where your view collapses under the weight of the "too many causes" objection. If causation is simply counterfactual dependence, then *everyone* who failed to save the patient is a cause of the death.

  **Elena:** I'm familiar with the objection.

  **Marcus:** Are you? Because the implications are absurd. If the doctor's withholding is a cause because, had he acted, the death wouldn't have occurred, then *my* not flying in from London to administer the morphine is also a cause. Had I acted, the death wouldn't have occurred. The President's not sending the National Guard with morphine is a cause. Every person on earth who didn't save that patient becomes a cause of her death. You've made causation profligate. You've turned the entire universe of non-actors into a conspiracy of killers.

  **Elena:** That is the classic reductio, Marcus, but it assumes a context-free view of causation that no serious counterfactual theorist holds. Causation is contrastive and contextual. We don't select *all* counterfactual dependencies as causes; we select the *relevant* ones. Relevance is determined by norms and expectations.

  **Marcus:** Ah, there it is. You're smuggling normativity into metaphysics.

  **Elena:** I'm acknowledging that causation in the special sciences—like action theory—is sensitive to the framework of inquiry. In the context of a hospital, the doctor has a duty to administer pain relief. That duty establishes a default expectation. The deviation from the default is the salient cause. My not flying in from London isn't a cause because there was no expectation for me to be there. The counterfactual dependence exists, yes, but it's not causally salient.

  **Marcus:** But "salience" is pragmatic. It's about how we *talk*, not how the world *works*. You're saying the metaphysical structure of the event changes based on what people expect? That the fabric of reality shifts because the doctor signed a contract? If you define causation by norms, you haven't solved the metaphysical problem; you've just dissolved metaphysics into ethics.

  **Elena:** I'm not saying the physics changes. I'm saying that "causation" in action theory isn't a primitive physical relation. It's a tool for explaining outcomes. If I want to explain why the patient died, citing the cancer is true but incomplete. Citing the doctor's withholding explains the *failure of prevention*. If you insist that only positive events are causes, you create a gap between what we hold people responsible for and what we say they *did*. You're forced to say the doctor is responsible for a death he didn't cause. That requires a magical theory of responsibility where agents are liable for outcomes they had no causal hand in.

  **Marcus:** Not magical. Just distinct. I argue for a dual-track account. Track one is metaphysical causation: strictly positive events, processes, physical transfers. On this track, the doctor did not cause the death. Track two is normative responsibility. Here, omissions matter immensely. The doctor is responsible not because he caused the death, but because he violated an obligation to prevent it.

  **Elena:** But why sever the tracks? It seems like theoretical gerrymandering to save a physicalist intuition.

  **Marcus:** Because keeping them separate protects us from the "too many causes" problem without relying on slippery norms. On my view, the President isn't a cause because he didn't initiate a process leading to death. He also isn't responsible, because he had no duty. The doctor isn't a cause, because he initiated no process, but he *is* responsible because of the duty. This keeps the ontology clean. Causation is about what pushes the dominoes. Responsibility is about who was supposed to catch them.

  **Elena:** The problem, Marcus, is that this clean ontology fails to capture the phenomenology of action. When I choose not to vote, and my candidate loses, I feel I contributed to the loss. If I say, "I didn't cause the loss, I just failed to prevent it," I am engaging in semantic sophistry. The counterfactual account aligns with our intuition that doing and allowing are on a continuum of influence. Furthermore, your "positive events only" rule struggles with pre-emption. If a backup killer was waiting to shoot the patient had the doctor administered the morphine, did the doctor cause the survival?

  **Marcus:** That's a different puzzle. Let's stick to omissions. Your reliance on norms to filter the "too many causes" is dangerous. If causation depends on expectations, then causation becomes relative to the observer's knowledge of social rules. Imagine a society where doctors are expected to euthanize terminal patients. In that society, on your view, the doctor's *withholding* of the poison would not be a cause of survival, but his *administering* it would be the cause of death. The metaphysics of the situation is identical in both worlds. The physical movements are the same. Only the norms differ. Are you telling me the causal structure of the universe changes based on the local medical code?

  **Elena:** I am telling you that *action* causation is not *universal* causation. We are debating the philosophy of action, not particle physics. In the domain of human agency, norms constitute the actions themselves. A movement is only a "withholding" relative to an expectation. Without the norm, it's just sitting still. So, yes, the causal description of the action depends on the normative context, because the *action* itself depends on it.

  **Marcus:** But then you aren't talking about causation anymore. You're talking about imputation. You've essentially agreed with me that the "causal" work is being done by the moral assessment. You say, "We pick the cause based on who is to blame." I say, "We determine who is to blame based on a separate normative assessment, distinct from the cause." My view explains why we can argue about whether the doctor *caused* the death. If causation were just normative salience, there would be no debate. We would just ask, "Was he obligated?" and the causal question would answer itself. The fact that we feel a tension—that we hesitate to say the omission is a "real" cause—suggests our intuition tracks the physical absence of a process.

  **Elena:** The hesitation comes from conflating the two domains, which your view encourages. But consider the legal and practical implications. If we adopt your view, we tell juries: "The defendant did not cause the victim's death, but please convict them of homicide." That seems incoherent. Homicide requires causation. If omissions aren't causes, there can be no homicide by omission, only "failure-to-prevent-homicide." You fracture the legal concept of agency.

  **Marcus:** The law is a normative system, Elena. It is allowed to use "cause" as a term of art that diverges from metaphysics. The law cares about liability, not ontology. We, as metaphysicians, should care about truth. The truth is that nothing happened between the doctor and the patient. The truth is that the cancer killed her. The doctor's sin was not adding a force to stop it. If we call that causation, we lose the ability to distinguish between killing and letting die at the metaphysical level. We collapse the distinction entirely into a calculation of duty.

  **Elena:** And if we accept your view, we lose the ability to explain how agents interact with the world through inaction. We render agents passive observers unless they expend energy. But inaction is often the most powerful tool an agent has. A strike causes a factory to stop. A veto causes a bill to die. A doctor's withholding causes pain to continue. To say these are not causal relations is to deny the efficacy of agency. I'd rather expand the definition of causation to include difference-making via omission than accept a metaphysics where agents are causally inert whenever they sit still.

  **Marcus:** Agents aren't inert. They are responsible. But you must see the cost of your expansion. By making causation normative, you make it impossible to critique the norms themselves using causal facts. If the causal story is always already shaped by the normative expectations, we can never say, "The norms are wrong, look at what actually caused this." You lock us inside the normative framework.

  **Elena:** And by making causation purely physical, you lock us out of the agency framework. You give us a world of billiard balls where "responsibility" is a ghostly overlay that doesn't touch the machinery. I prefer a machinery that includes the operator's decision not to pull the lever.

  **Marcus:** *[Sighs]* So we are at the impasse. You see causation as a explanatory tool for agency, sensitive to context. I see it as a metaphysical relation between events, insensitive to norms.

  **Elena:** Essentially. I think the "too many causes" objection is solved by recognizing that causation is selective. You think it's solved by recognizing that omissions aren't causes at all.

  **Marcus:** Precisely. And I suspect we will both leave here thinking the other has sacrificed something essential. You think I've sacrificed the reality of agency. I think you've sacrificed the reality of the world.

  **Elena:** *[Smiles]* Then the debate was successful. At least we agree that the patient's death was a tragedy, regardless of the causal grammar we use to describe it.

  **Marcus:** On that, we have counterfactual agreement. Had we acted differently, perhaps the seminar would have been less grim.

  **Elena:** Indeed. And whether that "had we acted differently" is a causal claim or a normative one... I'll let you write the paper.

  **Marcus:** I already have. It's titled "The Empty Cause."

  **Elena:** And I'll write the reply. "The Weight of Nothing."

  *[They gather their things, the disagreement unresolved, but the terms of the battle clearly drawn.]*
