          *   **Separability Thesis:** Content $\neq$ Form. (This is the weak link).
          *   **Accountability Shield:** If the AI decides, the AI is liable. If the User decides, the User is liable. (Crucial for product liability).
      *   *The Coherence of the Line:*
          *   There is no clean line between information and influence. *Selection* is influence. *Ordering* is influence.
