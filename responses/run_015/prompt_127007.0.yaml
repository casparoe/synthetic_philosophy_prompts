  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Introduction:* Validate the engineer's intuition. The "inform don't persuade" norm is a *fiduciary* norm, not just an epistemic one.
      *   *The Implicit Theory:*
