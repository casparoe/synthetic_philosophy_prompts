      *   **The Trigger Case:** A friend asked about quitting a job. The AI gave a balanced list. Friend felt more anxious/undecided. Team counted this as success (didn't tell her what to do).
      *   **The Core Question:** Is "inform-don't-persuade" a coherent target? What implicit theory does it presuppose? What is strictly required vs. what just sits comfortably? Is there a defensible line between transmitting info and influencing belief? What are the internal tensions? What changes if the system is superintelligent and maximally persuasive?
      *   **Teammate Proposals:**
          1.  *Persuasion-Neutral Packaging:* Phrasing/tone shouldn't add/subtract from uptake based on content alone.
          2.  *Conclusion-Compression:* Don't deliver conclusions without reasoning; let the human perform the update.
