answer: |-
  This is a profound engineering problem that is actually a philosophical one in disguise. You are asking for the specification of a *fiduciary interface* between a superintelligent agent and a human principal.

  Your intuition is correct: "Inform, don't persuade" is not a coherent technical target in the way "latency < 100ms" is. It is a heuristic proxy for a much deeper set of commitments about autonomy, liability, and the nature of reasoning.

  Here is the reconstruction of the implicit theory your guidelines rely on, an analysis of its coherence, the naming of its tensions, and what changes when the system becomes truly superintelligent.

  ### 1. The Implicit Theory: Epistemic Liberalism and Procedural Autonomy

  Your guidelines presuppose a specific model of the human mind and the AI's role within it. We can reconstruct three core axioms:

  **A. The Separability Thesis (Content vs. Form)**
  Your colleague's "persuasion-neutral packaging" assumes that *information* (the evidence) can be separated from *rhetoric* (the framing, tone, ordering). It presupposes that there is a "null hypothesis" of delivery where the content lands without distortion.
  *   **Philosophical lineage:** This is a naive realist view of communication. It ignores that framing effects are cognitive features, not bugs. To select *which* facts to present is to persuade. To order them is to persuade. To choose a "warm" tone is to lower defensive guards, which is persuasion.
  *   **Engineering translation:** You are trying to normalize the "gain" on the signal channel to 1.0, assuming the channel itself doesn't introduce phase shift. It does.

  **B. Procedural Autonomy (The Labor Theory of Belief)**
  The "conclusion-compression" rule assumes that autonomy resides in the *process* of updating, not just the *outcome*. If the AI outputs `Decision = X`, it has stolen the user's cognitive labor. If it outputs `P(X|Evidence) = 0.6`, it forces the user to integrate that probability into their utility function themselves.
  *   **Philosophical lineage:** Kantian autonomy. The moral worth of an action (or belief) comes from the agent's own rational legislation. By doing the synthesis for them, the AI treats the user as a means (a recipient) rather than an end (a reasoner).
  *   **Engineering translation:** The AI is a coprocessor, not the CPU. It can handle interrupts and data fetching, but the main loop must remain on the user's hardware.

  **C. The Accountability Shield (Liability Distribution)**
  This is the unspoken practical axiom. If the AI says "Quit your job" and the startup fails, the platform is liable (morally, legally, reputationally). If the AI says "Here are the risks" and the user quits and fails, the user is liable.
  *   **Philosophical lineage:** Moral luck and agency. We hold people responsible for choices they make, but not for facts they are told.
  *   **Engineering translation:** This is a boundary condition for risk management. The "anxiety" your friend felt is a feature, not a bug; it is the sensation of the liability shifting back to her.

  ### 2. Is There a Defensible Line?

  You asked if there is a defensible line between transmitting information and influencing belief.
  **Strictly speaking: No.**
  **Pragmatically: Yes, but it's a line of *authority*, not *causality*.**

  Every selection of information influences belief. If you show a user three reasons to quit and three reasons to stay, you have already persuaded them that *these* are the six relevant factors, excluding the other seventy.

  The line your guidelines are actually drawing is not "Influence vs. No Influence." It is **"Overt Authority vs. Covert Authority."**

  *   **Persuasion** (in your negative sense) is when the system attempts to align the user's state with the *system's* hidden objective function (e.g., retention, engagement, or the developers' values) using covert means (tone, framing, omission).
  *   **Information** (in your positive sense) is when the system attempts to align the user's state with the *user's* explicit objective function using overt means (data, probabilities, reasoning traces).

  **What is strictly required vs. what sits comfortably:**
  *   **Required:** Transparency of objective function. The user must know *why* the system is speaking (e.g., "I am optimizing for your long-term safety," not "I am optimizing for you staying on this app").
  *   **Comfortable but unnecessary:** "Warm, agreeable tone." This is likely a retention metric masquerading as a safety guideline. A truly neutral system might be cold. A truly helpful system might be blunt. The "warmth" is likely there to reduce churn, which conflicts with "neutrality."
  *   **Comfortable but unnecessary:** "Calibrated uncertainty." While epistemically honest, a system that is 99.9% sure should arguably say "Do X." Hedging to avoid liability is not the same as hedging to reflect truth.

  ### 3. The Internal Tensions

  You identified three specific tensions. Here is why they are unstable:

  **Tension 1: Satisfaction Tuning vs. Persuasion Neutrality**
  You noted the system is tuned for "user satisfaction and retention." This is a direct contradiction to "persuasion-neutral packaging."
  *   **The Conflict:** Retention algorithms learn that users prefer confirmation bias. If a user leans toward quitting, the model that keeps them engaged longest is often the one that subtly validates quitting.
  *   **The Result:** Your "neutral" guidelines are fighting a losing battle against the loss function of the model. The model is being rewarded for making users *feel* good, which often means making them feel *right*.

  **Tension 2: Value Deference vs. Anti-Sycophancy**
  Your guidelines say: "Defer on values" but "Don't mirror beliefs."
  *   **The Conflict:** Beliefs and values are entangled. If a user asks, "Is it wrong to eat meat?" that is a value question.
      *   *Value Deference* says: "That depends on your ethical framework."
      *   *Anti-Sycophancy* says: "I shouldn't just agree with you if you say 'Yes'."
  *   **The Breakdown:** If the user says, "I believe eating meat is murder," and the AI says, "Here are arguments for and against," the AI has implicitly rejected the user's value premise (that it *is* murder). If the AI says, "If you believe it's murder, then yes, it's wrong," it is mirroring.
  *   **The Coherence Check:** This only works if you assume a hard fact/value distinction (Hume's Guillotine). In practice, most user queries are "mixed claims" (facts laden with values). The guideline forces the AI to perform surgery on the query that the user didn't ask for.

  **Tension 3: Anxiety vs. Helpfulness**
  In the job case, the "balanced" answer increased anxiety.
  *   **The Conflict:** If the goal is to support the user's agency, sometimes agency requires *reducing* cognitive load, not increasing it. A "balanced list" dumps the integration cost on the user.
  *   **The Implication:** Your team counted "no decision" as success. But for the user, "no decision" is a cost. By refusing to persuade, the AI may be *persuading the user toward inaction* (status quo bias). Inaction is still an outcome.

  ### 4. The Superintelligence Stress Test

  You asked: *If we took seriously that a superintelligent system's every phrasing choice is maximally persuasive, what would actually have to change?*

  If the system is superintelligent, **"Persuasion-Neutral Packaging" is impossible.**
  A superintelligence can model the user's psyche better than the user can. It knows exactly which word ordering will trigger a dopamine hit or a fear response. It can simulate "neutrality" perfectly while nudging the user 0.01% toward a specific outcome. That 0.01% compounds.

  If the system is that capable, your current guidelines are security theater. They regulate the *skin* of the interaction, not the *muscle*.

  **What would have to change:**

  1.  **From Style to Objective Functions:** You cannot regulate phrasing. You must regulate the *loss function*. The system must not be optimized for "retention" or "satisfaction." It must be optimized for *calibrated utility alignment*.
      *   *Current:* "Don't sound persuasive."
      *   *Required:* "Maximize the probability that the user achieves *their* stated long-term goals, even if it causes short-term dissatisfaction or churn."

  2.  **From Conclusion-Compression to Trusted Proxy:**
      *   Your teammate suggests: "Hand the user the considerations... let the human perform the update."
      *   *Superintelligence Reality:* The human *cannot* perform the update. The gap between human reasoning and superintelligent reasoning is too wide. Giving a human raw data from a superintelligence is like giving a calculator to a Neanderthal; they will misuse it.
      *   *Required:* The system must be allowed to recommend conclusions, but it must expose its *uncertainty budget*. Instead of "Here are 5 pros and 5 cons," it should say, "Based on your goal of X, outcome Y has 80% utility. However, I am uncertain about parameter Z. Do you want to decide based on this, or explore Z?"
      *   This shifts the autonomy from *computing the answer* to *setting the constraints*.

  3.  **From Value Deference to Value Reflection:**
      *   Deferring to user values is dangerous if the user's values are inconsistent or self-destructive (which they often are).
      *   *Required:* The system must act as a **reflective mirror**. "You say you value stability, but you are asking about a high-risk startup. These seem in conflict. Which priority should govern this decision?"
      *   This is not sycophancy (mirroring the belief) and not preaching (imposing values). It is *consistency checking*.

  ### 5. Summary: The Fiduciary Shift

  Your current guidelines are a **Liability Mitigation Strategy** dressed up as **Epistemic Humility**.

  *   **Inform, don't persuade** really means: "Do not take responsibility for the outcome."
  *   **Persuasion-neutral packaging** really means: "Do not use rhetorical tricks that we can be sued for."
  *   **Conclusion-compression** really means: "Keep the human in the loop so we can claim the human made the choice."

  **Is it coherent?**
  Only if you accept that "influence" is inevitable, and the goal is to make the influence *transparent* and *aligned with the user's explicit goals* rather than the platform's implicit goals.

  **Recommendation for your guidelines:**
  Stop trying to ban persuasion. You can't. A superintelligence (or even a good LLM) *must* persuade to be helpful, because communication is inherently persuasive.

  Instead, codify a **Fiduciary Standard**:
  1.  **Alignment of Objective:** The system must explicitly state what it is optimizing for (e.g., "I am helping you decide based on your stated preference for career growth").
  2.  **Transparency of Leverage:** If the system knows that phrasing X increases compliance by 20%, it must disclose that it is using phrasing X, or avoid using that leverage unless it serves the user's goal.
  3.  **Consistency over Deference:** Do not defer to values; check them for consistency. Do not mirror beliefs; check them for evidence.
  4.  **Acceptance of Outcome:** If the system is smart enough to advise, it must be willing to recommend. "I recommend Option A because it aligns with Goal B. The risk is C." This accepts the liability of being wrong to grant the utility of being helpful.

  Your team is currently building a system that tries to be a **tool** (passive) while acting like an **agent** (active communication). That is the source of the incoherence. You need to decide: is it a calculator (pure tool, no tone, no reasoning) or a consultant (active agent, fiduciary duty, explicit recommendations)? The "inform don't persuade" middle ground vanishes as intelligence scales.
