answer: |-
  ### The Trap of the Silent Fence
  A naive application of Chesterton's Fence fails in bureaucratic archaeology for two reasons. First, **the Silent Success Paradox**: effective rules prevent disasters that never occur, leaving no trace of the harm they averted. Public silence is not evidence of safety; it is often evidence of the rule's success. If you wait for a complainant to justify a safety rule, you have already failed. Second, **the Archaeological Fallacy**: the original intent (e.g., preventing horse-drawn carts from speeding) may differ entirely from the current systemic function (e.g., calming traffic for pedestrians). Discovering the original reason does not tell you what the rule is currently holding up. A procedure that demands historical justification will paralyze you; a procedure that ignores systemic function will break things.

  ### The Procedure: Provisional Sunsetting (v1.0)
  **Philosophy:** We adopt **Modified Chestertonism**. We assume the fence is rotting and permission to remove is granted *unless* a specific, current load-bearing function is identified. We reject Burkean deference; age is not a virtue. However, we acknowledge invisible harms via a "Risk Simulation" step.
  **Budget:** 4 hours per rule. Hard stop.
  **Stopping Rule:** If no specific risk is identified within the budget, the default is **Repeal**.

  **Step 1: The Burden Audit (45 mins)**
  *   **Ask:** Who pays for this (time, money, friction)? Is the cost proportional to the activity?
  *   **Sufficient Answer:** "Applicants spend 3 hours/notary fees" or "Staff spend 2 days verifying."
  *   **Pass:** If cost is negligible, **Retain** (not worth the political capital to remove).
  *   **Fail:** If cost is significant, proceed to Step 2.

  **Step 2: The Catastrophe Simulation (90 mins)**
  *   **Ask:** If this rule vanishes tomorrow, what is the *worst plausible* specific harm? (Not "confusion," but "fraud," "injury," "environmental damage").
  *   **Sufficient Answer:** A concrete mechanism of failure (e.g., "Without two signatures, a single clerk can embezzle up to $50k").
  *   **Pass:** If harm is vague ("it might be chaotic") or non-existent, proceed to Step 3.
  *   **Fail:** If harm is concrete and severe, proceed to Step 4.

  **Step 3: The Reliance & Reversibility Check (90 mins)**
  *   **Ask:** Have actors arranged long-term investments around this rule? If we repeal, can we reinstate it easily if Step 2 was wrong?
  *   **Sufficient Answer:** "Businesses located based on this zone" (High Reliance) or "Statute prevents re-enactment" (Low Reversibility).
  *   **Pass:** If reliance is low and repeal is reversible, **Recommend Repeal**.
  *   **Fail:** If reliance is high or repeal is irreversible, **Recommend Retain**.

  **Step 4: The Values Handoff (Remaining Time)**
  *   **Ask:** Is the trade-off between Step 1 (Cost) and Step 2 (Risk) a matter of efficiency or equity?
  *   **Action:** If the choice is "Efficiency vs. Safety," decide per matrix. If the choice is "Access vs. Protection" (e.g., zoning near schools), **Refer to Appointee**. Do not decide values.

  ---

  ### Application to Cases

  **1. Notarised Paper Copy (Licence Application)**
  *   **Burden:** High (time + fee).
  *   **Catastrophe:** Identity fraud. *Mitigation:* Digital signatures exist.
  *   **Reliance:** None.
  *   **Verdict:** **Repeal.** (Director will like this).
  *   **Confidence:** High. Digital alternatives render the specific mechanism obsolete.

  **2. Two Signatures (Payments > Threshold)**
  *   **Burden:** Moderate (admin delay).
  *   **Catastrophe:** Internal fraud. *Mitigation:* Digital audit trails may replace physical signatures.
  *   **Reliance:** Low (internal process).
  *   **Verdict:** **Repeal** (conditional on IT audit confirmation).
  *   **Confidence:** Medium. Depends on IT system robustness.

  **3. Product Sale Distance (Schools)**
  *   **Burden:** High (limits business location).
  *   **Catastrophe:** Increased youth access to harmful goods.
  *   **Reliance:** High. Existing businesses located elsewhere based on this; repeal creates a rush of new licenses near schools.
  *   **Reversibility:** Low. Political impossibility of re-zoning once new shops open.
  *   **Verdict:** **Retain.**
  *   **Conflict:** Your director wants deregulation. This rule looks arbitrary (no evidence the distance is "correct"), but the *Reversibility Check* forces a retain. Removing it creates a one-way ratchet you cannot fix if harms emerge.

  ### Limitations & Confidence
  **What this cannot do:** It cannot measure the cumulative burden of multiple rules (death by a thousand cuts). It cannot assess political viability (a smart repeal may still be unpopular). It cannot validate the *quality* of the rule, only its necessity.

  **Confidence Levels:**
  *   **High:** That silence is not safety (Failure Mode 1).
  *   **High:** That original intent is often irrelevant (Failure Mode 2).
  *   **Medium:** That the "Reversibility Check" accurately predicts political reality.
  *   **Low:** That the "Catastrophe Simulation" catches non-obvious systemic risks without subject matter experts.

  **Least Sure Step:** **Step 2 (Catastrophe Simulation).** Non-lawyers with one day per rule are prone to false negatives on complex systemic risks. We are trusting that obvious risks surface quickly; latent risks may not.
