answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation on Frontier Fund Allocation and Policy

  We are at a standstill over the $150,000 frontier allocation. We have two applications: one proven, one speculative. We have two arguments: one based on measurable results, the other on mathematical expectation. I believe we are stuck because we are asking the wrong question.

  **The Framing Problem**
  We are treating this as a choice between Application A (the screening program) and Application B (the pathogen pilot). That is incorrect. The real issue is the stack of forty-one "longshot" applications we received this cycle.

  When forty-one different groups each claim they have a 1-in-10,000 shot at saving 200 million lives, the math breaks. They cannot all be right. In my old line of work—hydrology—we learned that you cannot build a flood levee based on a single, unverified calculation of a "once-in-a-millennium" storm. The further out you go on the curve, the less the data matters and the more the assumption matters. A curve driven by its largest, least-checked input isn't an estimate; it's a story.

  Application B is asking us to treat their story as a number. Application A is asking us to treat their data as a result. We cannot compare them directly.

  **Recommendation**
  I propose we split the fund this year:

  1.  **$135,000 to Application A.** This secures the measurable public health work we exist to do.
  2.  **$15,000 to Application B.** This is not for implementation. It is strictly to purchase *information*. The funds should be used to have their probability model audited by an independent third party or to run a limited feasibility test that produces hard data rather than projections.

  We reconvene in six months. If the audit validates their risk model, we consider them for next year's frontier fund. If it does not, we decline.

  **A Standing Rule for Future Cycles**
  We need a policy we can use next year so we do not have this same argument every October. I have reviewed several options. Most are unworkable. Asking if "other money would do the work" is speculative; asking applicants to discount their own numbers relies on honesty they do not have.

  However, two concepts survive:

  1.  **The Portfolio Cap:** We treat all "high-impact, low-probability" applications as a single portfolio. We set a hard cap (e.g., 10% of the frontier fund) for this category. These applications must compete against each other for that slice, not against the proven programs for the whole pie.
  2.  **The Information Value Test:** For speculative projects, we do not fund the *impact*. We fund the *reduction of uncertainty*. We pay for the test, not the cure.

  I move we adopt the **Portfolio Cap** as our standing rule, with the **Information Value Test** as the mechanism for approving individual grants within that cap.

  **The Strongest Case for the Other Side**
  I know Dana and others strongly favor funding Application B in full. I want to state their case as clearly as I can, because it contains a truth we must not ignore.

  The argument is this: History is driven by rare events. If there is even a sliver of a chance that a pandemic kills 200 million people, and we could have done something to stop it for the price of a mid-sized house, our failure to act is indefensible. Discomfort with large numbers is a psychological flaw, not a logical refutation. If we demand certainty before we act on tail risks, we will always be too late. The fact that larger foundations haven't acted yet may be institutional blindness, not market efficiency. If we are truly here to do the most good possible, we cannot let the certainty of the small good blind us to the possibility of the massive good.

  This is a serious moral claim. It deserves respect. But it cannot be the *only* rule we use, or we will fund nothing but promises.

  **Conclusion**
  My hydrologist's instinct is that you do not bet the levee on a guess. You measure the water. By splitting the fund, we honor the certainty of the lives we can save today while paying for the data we need to judge the risks of tomorrow.

  I ask that we vote on this allocation and adopt the Portfolio Cap policy for the next fiscal year.
