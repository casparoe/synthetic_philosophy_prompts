answer: |-
  **MEMORANDUM**

  **TO:** Program Committee
  **FROM:** Chair, Program Committee
  **DATE:** Monday, October 23
  **SUBJECT:** Recommendation for Cycle 7 Grant Award

  **1. Recommendation**

  After reviewing the staff impact analyses, legal opinions regarding our founding deed, and the minutes of our last deliberation, I recommend that the Committee vote to award the full five-year grant to **Program A (Seasonal Malaria Chemoprevention and Bed-Net Distribution).**

  This recommendation is based on the conclusion that Program A is the only option that fully satisfies our fiduciary obligations under the founding deed while aligning with the majority of the Committee's moral credences.

  **2. The Founding Deed as a Fiduciary Constraint**

  We must first address the restriction in our founding deed, which limits grants to "relieving the suffering of people alive when the grant is made."

  This is not merely a moral preference to be weighed against other ethical theories; it is a legal boundary on our authority. A majority of the Committee, supported by counsel, reads this as a genuine obstacle to Program B. While Program B reduces risk for those alive today, its primary expected value derives from preventing civilizational collapse, thereby benefiting future populations who do not yet exist. On the interpretation that the deed requires the *primary* beneficiaries to be currently living persons, Program B falls outside our mandate.

  **Weight of the Deed:** The deed's restriction carries **decisive weight**. In the presence of moral uncertainty, we cannot default to a theory (Impersonal Totalism) that requires us to potentially violate our legal charter. We are stewards of this foundation's specific mission, not a general utilitarian fund. If the deed prohibits funding future-oriented existential risk reduction, we lack the standing to pursue it, regardless of the expected value. Program A, by contrast, relieves the suffering of two million children currently alive, placing it in unambiguous compliance.

  **3. Moral Uncertainty and Credences**

  Even setting aside the legal constraint, Program A represents the more robust choice under moral uncertainty.

  *   **Credence Aggregation:** Our Committee's credences are split (45% Impersonal Total, 40% Person-Affecting, 15% Prioritarian). Program B is favored only by the Impersonal Total view. Program A is favored by both the Person-Affecting view (as it saves identifiable lives) and the Prioritarian view (as it aids the worst-off: children facing immediate mortality). Together, these constitute 55% of our moral credence.
  *   **Normalization Risk:** As noted in the staff memos, there is no agreed-upon convention for normalizing choice-worthiness across these theories. In the absence of a settled metric, we should apply a "risk-averse" principle regarding moral error. Funding Program B risks violating strong person-affecting intuitions for speculative future gains. Funding Program A guarantees concrete moral goods that are recognized as valuable across *all* three theories, even if Totalists view them as suboptimal.

  **4. The Strongest Case for Program B**

  In the spirit of rigorous deliberation, I want to state the strongest version of the argument for the option we are rejecting.

  If the Impersonal Total view is correct, Program B is overwhelmingly superior. A one percentage point reduction in the probability of civilizational collapse this century represents an expected value orders of magnitude higher than 1,800 lives. If collapse occurs, the loss is not merely the death of existing people, but the foreclosure of all future generations—potentially billions of lives and vast amounts of value. From this perspective, focusing on malaria while ignoring engineered pandemics is akin to rearranging deck chairs on the Titanic. The fact that the beneficiaries of Program B would be different people than those who would exist otherwise (the Non-Identity Problem) should not morally paralyze us; preventing a catastrophe is intuitively obligatory even if it changes *who* comes to exist. To reject Program B is to potentially gamble with the entire trajectory of humanity for the sake of a theoretical distinction regarding identity.

  This argument is powerful and, were we a different institution with a different mandate, it might be decisive. However, given our deed and the plurality of moral views on this Committee, it cannot carry the vote.

  **5. Assessment of the "Bridge" Proposal**

  One member has proposed funding Program A for two years and reserving the remainder to revisit Program B later. I advise against this course for two reasons:

  1.  **Operational Constraint:** Our charter authorizes a *single* five-year grant per cycle. Splitting the award would require an amendment to our operating procedures and could jeopardize the timing of the current cycle.
  2.  **Legal Stasis:** The deed's restriction is not time-sensitive. If Program B is ineligible because it benefits future people, it will remain ineligible in two years. Deferring the decision does not resolve the legal obstacle; it merely delays the inevitable rejection of Program B while potentially compromising the five-year horizon required for Program A's efficacy.

  **6. Conclusion**

  Program A offers a certain, compliant, and morally robust outcome: saving the lives of children alive today. Program B offers a high-variance, legally precarious outcome based on a minority of our moral credences.

  I ask that we vote to award the grant to Program A. This decision honors our founders' intent, respects the legal boundaries of our charter, and saves lives that we can be certain matter to everyone in this room.

  **Action Required:** Vote to approve Program A on Tuesday.
