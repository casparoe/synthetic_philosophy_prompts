answer: |-
  # Joint Statement on the Church–Turing Thesis
  **An Adversarial Collaboration between the Empirical and Conceptual Camps**

  **To:** Technical Staff and Engineering Leadership
  **From:** The Empirical Camp (Physics-First) and The Conceptual Camp (Definition-First)
  **Subject:** Clarifying the limits of computation

  We have spent months debating the status of the Church–Turing Thesis (CTT). To an outsider, we sound like we are arguing about the same thing. We are not. We agree on the math, but we disagree on what the math *means* for the physical world.

  Below is our joint map of where we stand, where we split, and what would actually change our minds.

  ***

  ### 1. Claims Both Camps Can Sign

  We agree on the following three layers of the problem. We explicitly mark which are settled and which are disputed.

  1.  **The Mathematical Equivalence (Settled)**
      *   **Claim:** All standard formal models of computation (Turing Machines, Lambda Calculus, General Recursive Functions, modern RAM machines) are provably equivalent. If you can compute a function in one, you can compute it in the others.
      *   **Status:** **Proven.** This is mathematics. No disagreement here.

  2.  **The Definition of "Effective Calculability" (Mostly Settled)**
      *   **Claim:** The term "effectively calculable" refers to a function where a human (or machine) can determine the output from the input by following a finite set of precise rules, without insight or guesswork, terminating in a finite number of steps.
      *   **Status:** **Agreed Definition.** Both camps accept this as the standard definition of an *algorithm*.
      *   **Dispute:** The Conceptual Camp says CTT *is* the claim that this definition matches the mathematical models. The Empirical Camp says this definition is a historical starting point, not the final word on what the universe can do.

  3.  **The Physical Claim (Contested)**
      *   **Claim:** "No physical system can compute a function that a Turing Machine cannot."
      *   **Status:** **Contested.**
          *   **Empirical Camp:** This is a claim about physics. It could be false.
          *   **Conceptual Camp:** This is a consequence of the definition in (2). If a system doesn't fit the definition, it isn't "computing" in the relevant sense.
      *   **Agreement on Readout:** Both camps agree that for a physical process to count as computing a function $f(x)$, there must be a **finite readout**. You must be able to measure the result using a finite amount of energy and time, with finite precision. If reading the answer requires infinite precision (e.g., measuring a voltage to infinite decimal places), neither camp counts it as a valid computation.

  ***

  ### 2. Disagreements Table

  | Issue | Empirical Camp Wording (Physics-First) | Conceptual Camp Wording (Definition-First) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Nature of CTT** | CTT is a **contingent hypothesis** about our universe. It is like the Speed of Light limit: strongly supported by evidence, but possibly falsifiable by new physics. | CTT is a **conceptual analysis**. It defines the boundary of "algorithm." To refute it is to change the subject, like claiming a triangle has four sides. | **Substantive.** We disagree on whether CTT is a law of nature or a definition of terms. |
  | **Falsification** | We can falsify CTT by building a **Hypercomputer**: a device that reliably solves the Halting Problem (determines if any program stops) using physical processes. | You cannot falsify CTT with a device. If a device solves the Halting Problem, it relies on physical assumptions (like infinite precision) that violate the **finite readout** agreement. | **Mixed.** Substantive on physics, verbal on whether we call the result "computation." |
  | **Future Outlook** | In 100 years, we may discover physics that allows **supertasks** (infinite steps in finite time). CTT will be viewed as an approximation, like Newtonian physics. | In 100 years, we will have new physical models, but "computation" will still mean "finite effective procedure." New models will be **accelerators**, not breakthroughs of the limit. | **Substantive.** We predict different historical trajectories for the field. |

  ***

  ### 3. The Cruxes

  These are the specific scenarios where our disagreement is tested. We have recorded our predictions and what would count as losing.

  #### (i) The Halving Clock (The Zeno Machine)
  **Scenario:** A chip searches for a halting condition. At step 1, it waits 0.5s. At step 2, it waits 0.25s. At step $n$, it waits $1/2^n$ seconds. At $t=1$ second, infinitely many steps are complete. A flag bit is set to 1 if a halt was found.
  **Constraint:** We stipulate power, heat, and engineering limits are solved. The only question is the logic of the "limit."

  *   **Empirical Prediction:** If this chip is built and the bit at $t=1$ reliably indicates halting, a non-recursive function is computed. CTT-Physical is false.
      *   **Empirical Losing Condition:** If it turns out that reading the bit at $t=1$ requires infinite energy or precision (violating the Readout Agreement), we concede the device is not a valid computer.
  *   **Conceptual Prediction:** The "computation" never finishes. The state at $t=1$ is not the result of the steps; it is a physical stipulation. An algorithm requires a *finite* number of steps to reach an output. This is not computation; it is a physical measurement.
      *   **Conceptual Losing Condition:** If the bit can be read with **finite precision** and reliably solves the Halting Problem, we concede that our definition of "effective procedure" was too narrow.

  #### (ii) The Burden Question (The Analogy)
  **Scenario:** Comparing the history of CTT to other scientific dead-ends.

  *   **Empirical Analogy:** **Perpetual Motion.** We haven't built one yet, but it's a claim about energy conservation. A single working machine refutes the law.
      *   **Prediction:** In a century, this dispute will look like the debate over Relativity. We will look back and say, "They thought nothing was faster than light / computable by Turing Machine, but they were wrong about the universe."
  *   **Conceptual Analogy:** **The Parallel Postulate.** Mathematicians tried to prove parallel lines must never meet. Eventually, they realized you can *define* geometry where they do meet (curved space). It didn't break Euclidean geometry; it created new definitions.
      *   **Prediction:** In a century, this dispute will look like the debate over Non-Euclidean Geometry. We will say, "Turing Computation is the geometry of algorithms. Physics might use different rules, but that doesn't change the definition of an algorithm."
  *   **Joint Admission:** This crux is **untestable in principle** right now. It is a bet on the sociology of future science.

  #### (iii) The Asymmetry
  **Scenario:** No one expects a *mathematical proof* to refute CTT (because the models are provably equivalent). But some expect a *physical discovery* to refute it.

  *   **Empirical Interpretation:** This asymmetry proves that **Claim (c)** (Physical limits) is independent from **Claim (b)** (Conceptual limits). The math is closed, but the universe is open.
  *   **Conceptual Interpretation:** This asymmetry proves that **Claim (c)** is the only part that *could* be empirical, but it is not the core of CTT. The core is Claim (b). If physics breaks the limit, we just stop calling that physics "computation."
  *   **Joint Conclusion:** We agree that **mathematics cannot refute CTT**, only clarify it. Only **physics** could potentially refute the Physical version. We disagree on whether a physical refutation would change the definition of computation or just the laws of physics.

  ***

  ### 4. Closing Statement for Engineering Teams

  **To the Working Programmer:**

  You want to know if a new quantum, analog, or neural system will allow you to solve problems that are currently impossible (like perfectly predicting whether any code will crash).

  **Our Joint Answer:** Do not bet your architecture on it.

  Both camps agree that standard Turing Machines capture everything we currently mean by "software."
  *   **The Empirical Camp says:** Even if the universe allows hyper-computation, we haven't found a way to build it without requiring infinite precision, which is engineering suicide.
  *   **The Conceptual Camp says:** If a system solves the unsolvable, it isn't running an algorithm in the sense you understand. You cannot program it; you can only observe it.

  **Practical Takeaway:** Expect new hardware (Quantum, AI accelerators) to provide massive **speedups** (Complexity improvements). Do not expect them to change **computability** (Solvability). If a problem is undecidable today (like the Halting Problem), it remains undecidable for any system that you can build, program, and read out with finite resources. The limit holds for engineering, even if the philosophers keep arguing about why.
