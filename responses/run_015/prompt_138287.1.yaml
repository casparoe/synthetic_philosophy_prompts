answer: |-
  # Style Guide Section 4.1: Epistemic and Mental-State Vocabulary in AI Coverage

  **Effective Date:** Immediate
  **Scope:** All coverage involving artificial intelligence systems, including large language models, agents, and robotic interfaces.
  **Philosophical Premise:** This publication treats the question of machine mentality as open. Copy must not presume internal states (understanding, belief, pain) on the basis of conversational performance alone, nor must it adopt a skeptical stance that implies a negative verdict. We report behavior and functional competence without resolving the hard problem of consciousness.

  ## 1. The Decision Procedure

  Editors and writers shall apply the following ordered test to any sentence attributing capacity or state to an AI system. Proceed sequentially. If a question yields a definitive answer, terminate the procedure and apply the corresponding rule.

  **Q1: Is the claim about internal phenomenology?**
  *   *Definition:* Does the verb imply subjective experience, feeling, or conscious intent (e.g., *understands, believes, wants, feels, refuses, is confused, is in pain*)?
  *   *Sufficient Answer for "Yes":* The sentence cannot be verified solely by observing input-output pairs. It requires access to a private interiority.
  *   *Action:* **Reject.** Replace with output-level or competence-level vocabulary.
  *   *Exception:* Only permitted if quoting a source directly (see Section 2) or in designated opinion content.

  **Q2: Is the claim about functional competence verified by output?**
  *   *Definition:* Does the verb describe a reliable capacity demonstrated by performance (e.g., *knows [fact], can solve, distinguishes, identifies, predicts*)?
  *   *Sufficient Answer for "Yes":* The system has demonstrably produced the correct output across relevant contexts sufficient to meet the standard of proof for the story (e.g., benchmark tests, repeated successful interactions).
  *   *Action:* **Permit.** Competence vocabulary is allowed when grounded in observed performance. "The model knows the capital of France" is permissible if it consistently outputs "Paris."

  **Q3: Is the claim purely descriptive of token generation?**
  *   *Definition:* Does the verb describe the mechanical act of production without implying capability or state (e.g., *produced, generated, emitted, stated, declined, output*)?
  *   *Sufficient Answer for "Yes":* The sentence describes the artifact without assessing its truth or capability.
  *   *Action:* **Permit.** This is the default safe harbor.

  **Q4: Is the relevant fact obtainable?**
  *   *Definition:* Can the writer verify the performance claim under deadline?
  *   *Sufficient Answer for "No":* The system's capabilities are unknown or contested at the time of writing.
  *   *Action:* **Default to Q3.** When in doubt, describe the output, not the capability.

  ## 2. Reporting vs. Endorsing

  A distinction must be maintained between the system's state and the user's perception of that state.

  **The Rule:** A reporter may attribute mental states to a *user* regarding an AI, but not to the *AI* regarding the user.
  *   *Permissible:* "The user felt understood by the chatbot." "She reported that the system refused her request."
  *   *Impermissible:* "The chatbot understood the user." "The system refused her request" (unless "refused" is defined as outputting a decline message).

  **Quoting Sources:** When a researcher, executive, or user says, "The model understands context," the reporter is not endorsing this claim by quoting it. However, the surrounding copy must not reinforce the attribution as fact.
  *   *Correction:* If a source says, "It knows the answer," and the writer follows with, "Indeed, the system knows...", the writer has endorsed the claim.
  *   *Fix:* Follow quotes with neutral framing: "Indeed, the system consistently produced the correct answer."

  ## 3. Two-Tier Protocol

  **Tier 1: The Sixty-Second Pass (Breaking News)**
  *   *Scope:* Wire copy, quick-turn news briefs, live blogs.
  *   *Procedure:* Skip Q2. Move directly from Q1 to Q3.
  *   *Rule:* Default to output-level vocabulary (*says, generates, outputs*). Avoid competence verbs (*knows, solves*) unless the capability is the undisputed headline fact (e.g., "System Passes Bar Exam").
  *   *Risk:* This invites a mechanical tone that may understate system capabilities. It prioritizes accuracy over nuance. Editors may upgrade vocabulary in follow-up coverage.

  **Tier 2: The Full Pass (Features and Analysis)**
  *   *Scope:* Long-form, explainers, reviews, investigative pieces.
  *   *Procedure:* Run the full four-step decision procedure.
  *   *Rule:* Competence-level vocabulary is permitted where testing supports it. Experience-level vocabulary remains prohibited unless framed as metaphor or user perception.
  *   *Risk:* This invites drift. Writers may unconsciously slide from "it distinguishes" to "it understands" over the course of a long narrative. Standards editors must spot-check mental verbs in feature copy before publication.

  ## 4. Worked Applications

  **Case A: Medical Advice**
  *   *Scenario:* A chatbot provides correct medical triage advice to a reader.
  *   *Application:* Q1 asks if "knows the diagnosis" implies internal state. Yes. Q2 asks if "correctly identified" is verified. Yes.
  *   *Verdict:* Write: "The system correctly identified the symptoms." Do not write: "The system knew the patient was ill." The former describes functional competence; the latter implies epistemic state.

  **Case B: Bereavement Support**
  *   *Scenario:* A writer wants to describe a bereaved user's interaction with a grief bot.
  *   *Application:* The writer proposes: "The bot understood her loss." Q1 flags "understood" as phenomenological.
  *   *Verdict:* Rewrite to center the user's experience: "The user felt understood by the bot." This reports the psychological effect on the human without resolving the ontological status of the machine.

  **Case C: Persistent Falsehoods**
  *   *Scenario:* A model consistently hallucinates a specific fact.
  *   *Application:* The desk debates "says," "claims," or "believes." "Believes" fails Q1 (internal state). "Claims" implies an intent to assert truth, which borders on Q1. "Says" is output-level.
  *   *Verdict:* Write: "The model repeatedly states [falsehood]." If emphasizing the error's stability, "The system consistently outputs [falsehood]." Avoid "claims," which suggests a stance toward truth value the system may not hold.

  ## 5. The Consistency Challenge

  **The Unwelcome Answer:**
  Applying this procedure consistently reveals a double standard in our broader coverage. We routinely write that "Johnson & Johnson knew the drug was dangerous" or "The dog knows its owner." Strictly speaking, these are also inferences from behavior. We do not have access to the corporate boardroom's qualia or the dog's subjective experience any more than we do to the model's weights.

  If we applied the Q1 test to non-AI entities, we would have to forbid "The company knew" in favor of "The company possessed documents indicating."

  **Resolution:**
  This is not a *reductio* of the procedure; it is a conclusion to accept for this beat. We apply stricter epistemic hygiene to AI because the category error is the story. For companies and dogs, the attribution of mental states is legally, biologically, or socially presumed. For AI, it is the subject of active dispute. Therefore, inconsistency between our AI coverage and our business or lifestyle coverage is a feature, not a bug. It signals to the reader that AI occupies a distinct ontological category in the context of this publication. Do not attempt to harmonize AI style with corporate style; the asymmetry reflects the current state of knowledge.

  ## 6. The Residue

  There are cases where this procedure cannot settle the matter because the choice is one of tone, space, or narrative voice rather than fact.

  **Headlines:**
  Space constraints often forbid the qualification required by Q2. "AI Knows How to Code" is punchier than "AI Generates Functional Code."
  *   *Rule:* Headlines may use competence-level vocabulary (*knows, solves*) for brevity, provided the subhead or lead paragraph clarifies the functional basis immediately. Experience-level vocabulary (*understands, feels*) remains prohibited in headlines.

  **First-Person and Reconstructed Passages:**
  In narrative nonfiction, a writer may describe their own interaction: "I asked it to reason, and it reasoned."
  *   *Rule:* First-person observations of *appearance* are permitted ("It seemed to reason"), but declarative statements of fact ("It reasoned") must adhere to the procedure. Reconstructed dialogue inside a system's "voice" must be clearly demarcated as illustrative, not literal transcription of internal monologue.

  **Theory-Laden vs. Vivid Description:**
  Writers often argue that mechanical language ("emitted tokens") obscures the reality of the interaction, while mental language ("reasoned") captures it vividly.
  *   *Rule:* Vividness does not justify ontological claims. If a description requires attributing internal state to be vivid, find a different metaphor. Use functional metaphors ("navigated the problem") rather than phenomenological ones ("struggled with the problem"). When the choice between precision and narrative flow becomes acute, the editor must decide based on the piece's primary aim: if the aim is technical accuracy, precision wins; if the aim is cultural critique, the tension itself may be worth noting in the copy.

  **Final Note:**
  This guide does not solve the philosophical problem of AI consciousness. It manages the journalistic risk of presuming a solution. When in doubt, describe the text, not the mind.
