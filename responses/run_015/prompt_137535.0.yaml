  There is no single canonical term for the combined phenomenon, but historians and archivists analyze it as two compounding stages of **Infrastructural Bias**: first **Administrative Legibility** (who enters the record) and then the **Digital Matthew Effect** (which records become retrievable).

  Here is the breakdown of the concepts, how they differ from your rejections, and how they fit together.

  ### 1. The Human Shape: Administrative Legibility (vs. Archival Silence)
  Your first observation—that only the entangled (oppressed or petitioners) are visible—is best described as **Administrative Legibility**, a concept rooted in James C. Scott's *Seeing Like a State*. States do not record people; they record *subjects* who interact with the state's grid (taxes, courts, housing). Those who remain outside the grid are not just "unrecorded"; they are illegible to the apparatus.

  *   **Why "Silencing" feels wrong but fits:** You rejected "Archival Silence" (Michel-Rolph Trouillot) because it sounds deliberate. However, Trouillot explicitly argues silencing is structural, not conspiratorial. It occurs at four moments: fact production, archive assembly, narrative retrieval, and history making. Your observation describes the first moment: the power dynamics of *what gets created as a fact*. If you use "Silencing," you must specify **Structural Silencing** to avoid the connotation of active suppression.
  *   **Why "Selection Bias" fails:** Selection bias implies a random sample was skewed. Here, the sample was *constructed* by power. "Legibility" captures the mechanism (interaction with the state); "Bias" only captures the outcome.

  ### 2. The Digital Shape: The Digital Matthew Effect (vs. Credit)
  Your second observation is indeed the **Matthew Effect**, but specifically the **Digital Matthew Effect** as applied to bibliometrics and archives. Your colleague was technically correct, but your hesitation highlights a crucial nuance: in science, the effect accumulates *prestige*; in archives, it accumulates *access*.

  *   **The Mechanism:** Digitized items are cited more -> citations justify further digitization funding -> related materials are digitized -> the "cluster" becomes the only searchable reality.
  *   **The Driver:** You noted it is driven by "dull infrastructure" (typewritten, indexed) rather than significance. In Digital Humanities, this is called **Digitization Bias** or **Searchability Bias**. It is a subset of the Matthew Effect where the "advantage" is technical affordance (OCR reliability, metadata richness) rather than intellectual merit.
  *   **Distinction:** The traditional Matthew Effect explains why famous scientists get more citations than unknown ones doing similar work. The Digital Matthew Effect explains why *Collection A* gets fully indexed while *Collection B* rots, based on initial funding or file format, regardless of historical value.

  ### 3. Are They One Phenomenon?
  They are distinct mechanisms operating at different stages of the knowledge production chain, but they function as a single **Epistemological Filter**.
  *   **Stage 1 (Production):** The state filters reality into records based on **Legibility** (conflict or usage).
  *   **Stage 2 (Retrieval):** The archive filters records based on **Accessibility** (digitization and indexing).
  *   **The Result:** A recursive distortion where the only history we can write is about people who were visible to the state *and* whose files were easy to scan.

  ### 4. A Proposed Name: "Legibility Bias"
  Since no single established noun covers both the bureaucratic creation and the digital retrieval, the most precise label for your specific "shape" is **Legibility Bias**.

  *   **Definition:** The distortion of historical narrative caused by the compounding requirements of institutional legibility (being recorded by the state) and technical legibility (being readable by search engines).
  *   **Boundary Cases:**
      *   *Fits:* A tenant visible only because they were evicted (State Legibility) whose file was typed and indexed (Technical Legibility).
      *   *Does Not Fit:* A famous diarist whose papers were donated directly to a library (bypasses State Legibility) or a handwritten ledger that remains undigitized (fails Technical Legibility).
      *   *Distinct from "Survivorship Bias":* Survivorship bias implies physical decay (the paper rotted). Legibility Bias implies the paper exists but was never created or never indexed due to structural/technical criteria.

  ### Confidence and Uncertainty
  I am **highly confident** that "Administrative Legibility" and "Digital Matthew Effect" are the correct established components for your two observations. I am **moderately confident** in proposing "Legibility Bias" as the unifying term; it is descriptive and conceptually tight (linking Scott's state vision with machine vision), but it is not yet a canonical proper noun like "The Peter Principle."

  **The bit I am least sure about:** Whether "Infrastructural Bias" might be a safer umbrella term than "Legibility Bias." "Infrastructural Bias" is used in Science and Technology Studies (STS) to describe how physical systems shape social outcomes, which fits your "dull infrastructure" point. However, "Legibility" is more specific to the *visibility* problem you are describing. If you print this, "Legibility Bias" is punchier for a general audience, but "Infrastructural Bias" may withstand closer scrutiny from sociologists.
