  here's the student's answer: Non-human forces can be historical actors without being deterministic. For example, the Tambora eruption in 1815 caused global cooling that led to crop failures in 1816, but this only matters because human societies were organized in vulnerable ways. So the volcano isn't a deterministic force; it's an actant that interacts with human structures. Similarly, Yersinia pestis spread along trade routes that humans built, so the plague's agency is really a co-production with human networks. This avoids environmental determinism because it refuses to treat nature as an external cause acting on passive humans. Instead, it follows Latour's study of Pasteur to claim that microbes are social actors whose power comes entirely from laboratory practices, meaning they have no independent causal weight outside human institutions. By distributing agency across humans and non-humans, we actually see that history isn't driven by climate or germs alone but by the assemblages they form with people. The critique of anthropocentrism here is that traditional history ignores these partners, but once we include them we see that causality is shared rather than one-directional. Therefore attributing agency to volcanoes doesn't commit us to determinism; it just recognizes that human choice always operates within material constraints that have their own dynamics.

