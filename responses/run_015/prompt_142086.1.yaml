answer: |-
  # JOINT STATEMENT ON THE LIMITS OF CRIMINAL LAW IN VALE

  **Date:** October 14, 2023
  **Parties:** The Legal Moralist Position and The Liberal Position
  **Subject:** The Enforcement of Moral Norms Absent Harm, Rights Violations, or Offense to Unwilling Observers

  ## I. AGREED CLAIMS

  We, the undersigned parties, having engaged in adversarial collaboration within the jurisdiction of Vale regarding Practice X, affirm the following claims as settled between us. These claims represent the substantive ground we share, including concessions each side makes to the strength of the other's core arguments.

  1.  **The Distinction Between Existence and Enforcement:** We agree that a society may possess a "shared morality" in the sociological sense (common attitudes, habits, and judgments) without that morality necessarily warranting enforcement through the criminal law. The existence of a moral norm is a necessary but not sufficient condition for its legal enforcement.
  2.  **The Costs of Coercion:** We agree that legal enforcement is a blunt instrument that carries distinct moral and social costs. Specifically, we accept the evidence that statutes which are widely flouted or retained on the books without prosecution tend to breed contempt for the law and may accelerate the decline of the norm they purport to express. The Liberal concedes that this cost is prudential, not absolute; the Moralist concedes that this cost is significant enough to defeat enforcement in cases where the moral consensus is fragile.
  3.  **Bracketing Paternalism and Offense:** We agree that the question before us is strictly limited to *legal moralism*. We bracket entirely the questions of (a) paternalism (coercion for the actor's own good) and (b) offense to unwilling observers. We accept that Practice X involves competent adults, violates no rights, causes no harm to others, and is not forced upon unwilling observers. The justification for banning X, if any, must rest solely on the preservation of the moral environment.
  4.  **The Limits of Survey Evidence:** We agree that survey data regarding "repugnance" is an imperfect measure of a living moral culture. Reported feelings may reflect transient emotional reactions rather than deep constitutive commitments. Conversely, the absence of reported repugnance does not necessarily prove the absence of a normative structure. Neither side treats the split-attitude profile (repugnance at the act but unwillingness to punish) as definitively settling the question of whether the morality is "shared."
  5.  **The Reality of the Split-Attitude:** We agree that the split-attitude profile observed in Vale regarding Practice X (55% repugnance at a neighbor's conduct, but a majority opposing punishment) is the ordinary case in modern pluralist democracies. We reject the notion that a society must be monolithic to have a morality, but we also reject the notion that any majority preference automatically translates to legitimate law.
  6.  **The Empirical Baseline:** We accept the data from the eleven comparable jurisdictions as accurately described. We agree that in the short-to-medium term (thirty years), decriminalization of Practice X did not measurably reduce general social trust, tax compliance, or adherence to unrelated moral norms. We disagree on the *interpretation* of this baseline, but not on its existence.

  ## II. DISAGREEMENTS TABLE

  The following table isolates the remaining points of contention. Each formulation is drafted to be acceptable to the respective party as a fair statement of their position.

  | Issue | Moralist Formulation | Liberal Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **1. The Collapse of Moderation** | A moderate legal moralism (enforcing only "deep" morality) does not collapse into extreme moralism (enforcing any majority preference) because the "disgust/intolerance" test acts as a filter. If the majority feels disgust but refuses to punish, the filter has not been met; the law should wait until the feeling intensifies or the refusal to punish abates. | Once the harm principle is removed, the "disgust" filter is unstable. If the only justification is "we hate this," the distinction between deep morality and mere preference is verbal. The refusal to punish *is* the moral judgment that the matter is private, rendering the disgust irrelevant to law. | **Substantive.** Disagreement on whether "unwillingness to punish" negates the "right to enforce." |
  | **2. The Meaning of the Split-Attitude** | The split-attitude (hating X but not wanting prison for it) indicates a transitional moral confusion, not a settled liberty. The repugnance proves the norm exists; the reluctance to punish is a prudential fear of enforcement costs, not a rejection of the norm's validity. | The split-attitude indicates that the shared morality has *already* ceased to condemn X in the relevant public sense. A norm that the majority does not wish to uphold with state power is, by definition, no longer a public norm suitable for criminal law. | **Substantive.** Disagreement on whether law follows moral sentiment or constitutes it. |
  | **3. The Disintegration Thesis** | The data from the eleven jurisdictions confirms the disintegration thesis, but on a longer timeline. The decline in repugnance at X and the spillover decline at Y are the *mechanism* of disintegration, even if social trust has not yet fallen. Trust is a lagging indicator; moral cohesion is the leading indicator. | The data falsifies the disintegration thesis. The decline in repugnance is moral adaptation, not decay. The stability of trust and compliance shows that social cohesion does not depend on uniformity regarding Practice X. The spillover to Y is likely a correlation, not a causal unraveling. | **Substantive.** Disagreement on the causal link between moral uniformity and social stability. |
  | **4. Culture vs. Coercion** | Preserving a moral culture is continuous with preserving a language or a civic tradition. Just as a state funds schools to preserve a language, it may use law to preserve the moral framework that makes liberty intelligible. Coercion is a form of maintenance. | Preserving a moral culture is relevantly different from preserving a language because language evolves through use without police, whereas moral enforcement here requires coercing conduct. A language is not "violated" by a neologism; a moralist claims conduct "violates" the order. | **Verbal/Substantive Hybrid.** Agreement on the value of culture; disagreement on the analogy to linguistic preservation. |

  ## III. CRUXES

  We identify the following specific questions where further evidence or argument could move one or both parties. We record our predictions in advance.

  **Crux 1: The Retrospective Threshold (The Ratchet Reading)**
  *   **Sub-question:** Does the stability of social trust in the eleven jurisdictions hold indefinitely, or does it depend on the remaining moral cohesion regarding Practice Y?
  *   **Agreed Test:** A longitudinal extension of the existing study on the eleven jurisdictions, tracking social trust, compliance, and repugnance levels for an additional fifty years. Special attention will be paid to the "spillover" norm (Practice Y).
  *   **Moralist Prediction:** We predict that if repugnance at Practice Y declines below a specific threshold (40% neighbor-repugnance), social trust and compliance will show a statistically significant decline within ten years of crossing that threshold. The current stability is a reserve of capital being spent.
  *   **Liberal Prediction:** We predict that social trust and compliance will remain stable or increase even if repugnance at Practice Y declines to near zero. We predict that any correlation between Y-decay and trust-decay will vanish when controlling for economic and demographic variables. The "threshold" is a post-hoc rationalization.

  **Crux 2: The Prospective Natural Experiment (Practice Z)**
  *   **Sub-question:** Can we isolate the causal effect of decriminalization on moral cohesion in a controlled setting?
  *   **Agreed Test:** A paired-jurisdiction experiment involving Practice Z (a novel, victimless, consensual conduct currently criminalized in both regions). Two sub-regions of Vale, matched for demographics, economic status, and baseline moral attitudes, will be selected. Region A will decriminalize Z; Region B will retain criminalization but enforce a strict non-prosecution policy (to control for the "contempt for law" variable).
  *   **Measurements:** (1) Rates of participation in Z; (2) Reported repugnance at Z and adjacent norms; (3) Standardized social trust indices; (4) Willingness to cooperate with law enforcement on unrelated matters.
  *   **Timescale:** Ten years.
  *   **Moralist Prediction:** Region A will show a faster decline in willingness to cooperate with law enforcement on unrelated matters than Region B, even controlling for prosecution rates. The *symbolic* removal of the ban alters the civic culture.
  *   **Liberal Prediction:** There will be no significant difference in willingness to cooperate with law enforcement between Region A and Region B. The symbolic effect is negligible compared to the effect of actual coercive interference.

  **Crux 3: The Justification of Coercion**
  *   **Sub-question:** Is there a non-instrumental justification for legal moralism?
  *   **Agreed Test:** Philosophical argument regarding the nature of political authority.
  *   **Status:** **No Agreed Test.** We acknowledge that this crux admits of no empirical test both would accept. The Moralist holds that the state has an intrinsic interest in the moral character of its citizens independent of social stability. The Liberal holds that state power is instrumental only, justified solely by the protection of rights or prevention of harm. We record that this disagreement is foundational and unlikely to be moved by the data in Crux 1 or 2.

  ## IV. CLOSING STATEMENT

  We issue this statement to record the current state of our collaboration.

  We believe that our differences regarding the **empirical predictions** (Crux 1 and 2) are movable. Should the fifty-year longitudinal data show a collapse in social trust correlated with moral homogenization loss, the Liberal position would require significant revision regarding the instrumental value of moral enforcement. Conversely, should the paired-jurisdiction experiment show no civic divergence between decriminalized and criminalized zones, the Moralist position regarding the *necessity* of law for moral maintenance would be severely weakened.

  We believe that our differences regarding the **nature of political authority** (Crux 3) are settled by nothing we can presently foresee. The Moralist maintains that a society is a community of judgment, not merely a framework for liberty. The Liberal maintains that the criminal law is a dangerous tool that must be restricted to prevent tyranny, regardless of the moral consensus. These are competing visions of the state that data alone cannot adjudicate.

  Finally, we acknowledge that a portion of our debate proved to be **verbal**, specifically regarding the definition of "shared morality." We have clarified that we agree a morality can be sociologically shared without being legally enforceable. Our remaining disagreement is not about whether the morality exists, but whether the state is the proper guardian of its continuity.

  We sign this statement not as a resolution of the debate, but as a map of the terrain we have cleared together.

  **Signed,**

  **The Legal Moralist Position**

  **The Liberal Position**
