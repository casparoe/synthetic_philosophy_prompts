      *   *Row 3 (Disintegration Thesis):* Moralist: Decline in repugnance is the first step of rot (even if trust holds). Liberal: Decline in repugnance is moral progress/liberation; trust holding proves resilience.
      *   *Row 4 (Culture vs. Coercion):* Moralist: Preserving morality is like preserving language; requires maintenance. Liberal: Language evolves without police; morality should too.
