  I have been thinking about your preface and the constellation of cases you laid out, and I believe there is a single principle that can govern these intuitions without resorting to a baroque list of exceptions, though it will require you to relinquish one verdict you currently hold. The principle is what I call the Norm of Salient Alternatives, and it rests on the idea that assertion is permissible only when the speaker's evidence eliminates all error possibilities that are relevant in the context of the utterance, where relevance is determined by a combination of probability, practical stakes, and the salience of systemic risk. The first clause handles your lottery and your lab inspection items. You withhold assertion on the lottery ticket because your evidence is purely statistical; you have no specific causal link to the outcome, only a frequency distribution. In the lab, however, your sign-off on an individual item is based on specific perceptual or procedural evidence—you looked at the gauge, you checked the valve—which eliminates the relevant alternatives for that specific item even if the probability of error is technically higher than the lottery. This distinction between statistical and specific evidence is why you can assert the lab item at 0.999 but not the lottery loss at 0.9999987, and it corrects your suspicion that stakes are doing all the work there. Stakes matter, but evidence type is the primary driver for individual claims.

  The second clause addresses the aggregate cases like your preface, the lab safety summary, and the seismologist's almanac. When claims are presented as a unified body—a book, a lab status, a year's forecast—the possibility of systemic error becomes a relevant alternative that was not relevant for the individual parts. For the individual chapter, the relevant alternative is that you misread a specific line; for the whole book, the relevant alternative is that there is a methodological flaw or a fatigue-induced blind spot affecting the whole set. This is why you can assert "Chapter 9 is right" but not "Every claim is true," and why your brother is wrong to think the bridge inspection is merely the sum of its items. The summary claim introduces a new relevant alternative—systemic failure—that requires a systems-level check to eliminate. This clause also explains why your confidence drops when you learn of a shared method or instrument flaw; that information makes the systemic alternative salient for the individual items, retroactively undermining the specific evidence you thought you had. I am fairly confident in this clause, though I concede it relies on a contextualist view of knowledge that some invariantists would reject.

  The third clause concerns the threshold for relevance, which is modulated by stakes. You noted that stakes don't seem to poison your individual chapter yeses despite the high stakes of a scholarly volume. This is because the stakes for the individual claim (a reader being misled on one point) are lower than the stakes for the aggregate claim (the book's reputation being ruined, the field misled). However, this is where I must ask you to sacrifice a verdict. You said that the seismologist's daily assertions are proper, including the one that turned out false, and that you wouldn't blame her. If we accept the Norm of Salient Alternatives, and we agree that the almanac is unassertable because the aggregate risk is too high, then strictly speaking, the daily claims are also epistemically deficient because they are components of a risky conjunction. To maintain consistency, you must give up the verdict that the daily assertions are fully proper in a strict sense; instead, you must accept that they are pragmatically excused assertions based on reasonable belief rather than knowledge. I know this feels like a coin flip, and I am less confident here than in the lab cases, because our ordinary practice treats the daily claims as knowledge. But if you want a unified principle, you cannot have it both ways: either the almanac is assertable, or the daily claims are not knowledge. I recommend sacrificing the strict propriety of the daily claims to save the principle, acknowledging that we allow them only because the stakes of a single false prediction are low enough to lower the threshold for relevance.

  Now let us run this principle on your dissertation committee case. You believe every substantive claim, you will sign the report, but you will tell the candidate there is certainly a wrong footnote somewhere. This is not just the preface again because what you are certifying is not merely a set of propositions but a person's competence and a body of work as a whole. The claim you are asserting is not "Every sentence is true" but "This work meets the standard for the degree." The relevant alternatives for this claim are not minor errors but significant flaws that undermine the contribution. Therefore, the principle allows you to assert the work is sound while acknowledging minor errors, because those errors do not instantiate the relevant alternatives for the certification claim. The assertion is about the fitness of the work for its purpose, which aligns with your committee report intuition where "accurate enough" was in play. Here the principle holds firm, and you need not change your practice, provided you distinguish between the truth of every proposition and the soundness of the contribution.

  Finally, I will construct a case where this principle yields a verdict you might find uncomfortable. Imagine you are overseeing a nuclear waste storage site. There are one thousand containment seals, each inspected individually with a 99.9% reliability rate using specific perceptual evidence. According to the first clause, you can assert of each seal "This seal is secure." However, according to the second clause, you cannot assert "This site is secure" without a systems-level check, because the aggregate risk of at least one failure is high and the stakes are catastrophic. Now here is the uncomfortable bite: if you discover that the inspection tools were all calibrated on the same day by the same technician, the third clause regarding systemic risk kicks in. Even though nothing has changed about the specific evidence for Seal 412, you must now withhold assertion on "This seal is secure" for every single seal, because the systemic alternative (common calibration error) is now salient and undermines the specific evidence. You would be forced to halt operations and re-inspect every item individually with independent tools. This feels bureaucratically onerous and perhaps overly cautious given that most seals are likely fine, but the principle demands it because the evidence for each is no longer isolated from the systemic risk. I am confident this is the right ethical call given the stakes, but I recognize it imposes a heavy burden on assertion that conflicts with our desire for efficiency. If you find this verdict too costly, it suggests you might need to lower the threshold for relevance in low-probability systemic cases, but doing so would reopen the lottery paradox. I think you should accept the burden; it is the price of consistency.
