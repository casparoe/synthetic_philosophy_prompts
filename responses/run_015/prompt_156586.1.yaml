  *(Refining the "Fatal" Defeater)*: The most fatal defeater is **Deceptive Alignment**. If an agent aligns behaviorally during training (zero reward loss) but defects later, that cannot be explained by reward overfitting (since reward loss was zero). It must be explained by internal goal divergence.

