      *Text:*
      **Project Overview**
      This project investigates the intersection of secularism studies and democratic theory's "boundary problem." While existing literature treats church-state separation as a matter of neutrality or symbolic establishment, it overlooks how administrative mechanisms create shadow membership bodies with coercive or fiscal power. This workshop proposal outlines a four-month conceptual study comparing Germany's *Kirchensteuer* opt-out lists and England's Crown-Parliament governance against French and US models. The core inquiry is whether administratively enforced affiliation constitutes a more severe democratic boundary failure than symbolic establishment.

      **Research Question**
      Do state-managed church membership mechanisms (e.g., tax rolls, parliamentary seats) create unaccountable political bodies that violate democratic boundaries? Specifically, is the coercive power of administrative affiliation morally equivalent to, or worse than, symbolic establishment?

      **Literature Gap**
      Current debates on secularism focus on neutrality, *laïcité*, or the US Establishment Clause. Democratic theory addresses the boundary problem (who constitutes the demos) but rarely applies it to religious governance. Consequently, neither field settles whether fiscal enforcement of religious status undermines democratic accountability. This project bridges that gap by treating church membership rolls as political boundary markers.

      **Methodology**
      The project employs a conceptual taxonomy rather than empirical survey or archival work. It analyzes legal and administrative structures across four jurisdictions:
      1.  **Germany:** *Kirchensteuer* as enforced fiscal membership.
      2.  **England:** Lords Spiritual as enforced legislative membership.
      3.  **France:** *Laïcité* as administrative exclusion.
      4.  **US:** Disestablishment as voluntary association.
      The analysis links membership mechanisms to coercive authority, categorizing how each system defines who belongs to the political community versus the religious community.

      **Expected Outcomes**
      The primary deliverable is a framework classifying boundary-failure types. This framework will distinguish between symbolic violations (e.g., state prayers) and structural violations (e.g., tax-enforced membership). A key finding will assess whether tax rolls and establishment are morally identical boundary violations. If administrative affiliation bypasses democratic consent similarly to hereditary legislative seats, both constitute a "shadow demos" failure.

      **Scope and Timeline**
      Over four months, the project will remain strictly conceptual. No deep archival work or fieldwork is planned. Month 1 focuses on defining the boundary problem in democratic theory. Month 2 maps the four national models. Month 3 develops the taxonomy of failure. Month 4 refines the framework for workshop presentation. This scope ensures a rigorous theoretical contribution without overextending into empirical validation.

      **Workshop Fit**
      This project challenges participants to rethink secularism not as state neutrality, but as a boundary-setting mechanism with direct democratic consequences. It invites critique on whether democratic accountability requires the dissolution of state-managed religious membership rolls.

