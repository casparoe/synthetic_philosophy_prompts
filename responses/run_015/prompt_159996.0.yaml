answer: |-
  **MEMORANDUM**

  **TO:** Interpretive Review Committee
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Recommendation for Alderwood Fen Gallery Interpretation

  **Recommendation**

  I propose we reject both the "Confident Cult" panel (Curator) and the "Pure Agnostic" panel (Education Officer). Instead, we adopt a **Layered Interpretation Policy**. The primary text must state what is materially certain: deliberate deposition of disabled objects over two centuries. Secondary text may suggest this implies ritualized behavior, but must explicitly list "priestly shrine" and "mother-goddess" as unverified hypotheses rather than facts. We proceed with installation only if the donor accepts this wording. We engage the community group by framing the ambiguity as a respect for the distance between us and the past, rather than a failure of knowledge.

  **Reasoning: The Two-Gap and Hostage Predictions**

  Our disagreement stems from conflating the formation gap with the interpretation gap. The formation gap here is narrow; the taphonomy indicates deliberate breakage and placement. We are justified in telling visitors this was not accidental loss. However, the interpretation gap is vast. Moving from "deliberate deposition" to "mother-goddess worshipped by priests" requires bridging equifinality without evidence.

  This is where the Curator's proposal fails the hostage prediction test. A claim of institutional priesthood and centralized cult is hostage to specific material consequences: evidence of surplus storage, bounded precincts, or unequal distribution of paraphernalia across the landscape. We have none of these. The Alderwood material is low-cost, scattered, and architecturally unbound. This pattern is equally consistent with household-level rites, the disposal of polluting objects, or the decommissioning of tools. By printing the Curator's text, we make the museum hostage to a specific social model that the ground truth does not support. If future excavation reveals a surrounding village with identical figurines in every hearth, our current panel becomes a falsehood.

  Conversely, the Education Officer's "We Do Not Know" panel undersells the formation data. It treats the interpretation gap as if it were a formation gap. We *do* know these objects were treated differently than domestic refuse. Pure agnosticism wastes the explanatory power of the deposit's structure. A layered approach acknowledges the deliberate act without fabricating the theology behind it.

  **Research Priorities**

  Before committing to any stronger claim, our limited research budget must fund tests that discriminate between competing social models, not merely add descriptive detail.

  1.  **Isotope Analysis on Faunal Remains:** If the pig and cattle jaws were brought from significant distances, this supports the "priestly corporation/pilgrimage" model. If they are locally sourced, the "household/local community" model gains probability. This directly tests the centralization hypothesis.
  2.  **Micro-stratigraphy of the Shaft:** We need to determine if deposition was regular (calendar-based/priestly) or sporadic (crisis-based/household). High-resolution sampling of the waterlogged fill can distinguish between structured intervals and event-driven disposal.

  These tests are chosen because they generate falsifiable outcomes regarding the social scale of the activity. General pottery typology will not suffice.

  **External Pressures**

  We must address the donor and the community group without compromising integrity.

  Regarding the donor: A six-figure sum is significant, but funding conditioned on factual inaccuracy threatens the museum's long-term credibility. We should offer the donor naming rights on the gallery case, but not on the interpretive content. A gallery based on robust, defensible science retains value longer than one based on speculative fashion. We must explain that "uncertainty" is a compelling narrative hook for visitors, not a deficit.

  Regarding the community group: Their request to display the figurines as "ancestors" is morally weighty. However, asserting a specific goddess theology may inadvertently violate their traditions if the actual beliefs were different. A layered panel allows them to see their ancestors' *actions* (the deposit) without us dictating their *thoughts* (the goddess). We can frame the display as honoring the mystery of their practice rather than colonizing it with modern categories.

  **The Strongest Case for the Rejected Position**

  I must acknowledge the strength of the Curator's position. The regional context undeniably shows a correlation between shaft deposits and ritual activity in this period. The consistency of the figurine manufacture suggests a shared template, implying some level of coordination or shared ideology beyond the individual household. To say "we know nothing" ignores the probability that this fits a broader pattern of prehistoric votive behavior. The Curator is right that visitors desire a narrative, and "ritual" provides a coherent container for otherwise disjointed artifacts.

  **Conclusion**

  However, coherence is not confirmation. We must avoid the "ritual sink," where any unexplained deposit becomes evidence of formal cult. I ask the committee to vote for the Layered Interpretation. It protects the museum from future correction, respects the community's connection without appropriating their theology, and leaves room for the research to speak.

  **Action Required:** Vote to approve Layered Interpretation Policy and authorize isotopic/micro-stratigraphic sampling prior to final text lock.
