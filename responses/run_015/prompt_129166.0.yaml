answer: |-
  You have stumbled onto a genuine ontological puzzle regarding the boundaries of computation and representation. Your intuition is correct: there is no fact of the matter about where the "program" ends and the "machine" begins, and consequently, no intrinsic property of "self-replication" belonging to the strand alone.

  You are observing two sides of the same coin. The first is a structural trade-off in description length; the second is a semantic dependence on context. While there are adjacent concepts in logic, computer science, and information theory, none capture the specific philosophical texture of your Typogenetics simulation perfectly.

  Here is the breakdown of the phenomena, the established concepts that approximate them (and where they fail), and a proposed terminology to pin down what you are seeing.

  ### 1. The Shifting Work: Descriptive Partitioning

  **The Phenomenon:** You can shift the causal load of replication between the strand (data/program) and the table (rules/machinery) without changing the output.
  **The Established Concept:** **The Axiom/Rule Duality** (Proof Theory) and **Partial Evaluation** (Computer Science).

  In logic, there is a known equivalence between axioms and inference rules. You can often take a content-heavy axiom and turn it into a structural rule of inference, or vice versa, without changing the set of provable theorems. In your simulation, the Table acts as the *Rules of Inference* and the Strand acts as the *Axioms* (or initial conditions). You are observing that the "proof" (the offspring) remains invariant while you redistribute the complexity between the axioms and the rules.

  In computer science, this is **Partial Evaluation** (or compilation). If you have an interpreter $I$ and a program $P$, you can specialize $I$ with respect to $P$ to create a new, hardcoded machine $M'$. Your "smart table" is a partially evaluated interpreter where the logic of copying specific bases has been compiled into the hardware (the table), leaving the "program" (the strand) trivial.

  **Where these concepts stop being apt:**
  Proof theory usually cares about the *set* of theorems, not the causal mechanism of their production. Partial evaluation usually assumes a direction (compiling software into hardware), whereas your simulation allows the table to *drift*, suggesting the boundary is fluid and evolutionary, not just an engineering optimization.

  **The Information Theoretic Reality:**
  You suspected conservation. You are correct, but you are looking at the wrong variable. You are looking at the Kolmogorov complexity of the strand, $K(S)$. But the relevant metric is the **Joint Complexity** of the system required to produce the offspring $O$.
  According to the Chain Rule for Kolmogorov Complexity:
  $$K(O) \approx K(\text{Table}) + K(\text{Strand} | \text{Table})$$
  (ignoring logarithmic terms).
  When you make the Table "smarter" (more specific), $K(\text{Table})$ goes up, but $K(\text{Strand} | \text{Table})$ goes down. When the Table is "dumb" (universal), $K(\text{Table})$ is low (it's a standard UTM), but $K(\text{Strand} | \text{Table})$ is high (the strand must contain the interpreter logic).
  The "conservation" you feel is the **Total System Specificity** required to isolate that specific offspring from the space of all possible strings.

  ### 2. The Relational Property: Interpretive Relationality

  **The Phenomenon:** A strand is only a replicator relative to a table. Identical strands behave differently in different tables.
  **The Established Concept:** **Computational Relationalism** and **Kripke's Rule-Following Paradox**.

  This is the stronger philosophical punch. In the philosophy of computation, there is a debate over whether computation is intrinsic to a physical system or relative to an interpretation. Your simulation proves the latter: the strand does not *contain* the instruction to replicate; it *acquires* that function only when coupled with a table that interprets it that way.

  This mirrors **Kripke's Wittgenstein** on rule-following. There is no fact of the matter about which rule a finite string of symbols is following based on the symbols alone. The string `AAA` only means "Copy" because the Table (the community practice, in Kripke's analogy) treats it as such. Under a different table, `AAA` means "Delete."

  It also aligns with **Semantic Externalism** (Putnam/Burge). The "meaning" (causal function) of the strand is not in the head (the strand) but in the environment (the table).

  **Where these concepts stop being apt:**
  Kripke and Putnam are concerned with *meaning* and *truth conditions*. You are concerned with *causal efficacy* and *autopoiesis*. A strand that produces junk isn't "false"; it's functionally inert. You need a term that captures *functional* dependence, not just semantic dependence.

  ### 3. Proposed Terminology

  Since existing terms are either too mathematical (Chain Rule) or too semantic (Externalism), I propose we coin a pair of terms to describe this specific Typogenetic phenomenon.

  #### A. For the Shifting Work: **Replicative Partitioning**
  **Definition:** The distribution of algorithmic specificity required for self-replication between the *carrier* (strand) and the *interpreter* (table).
  **Boundary Cases:**
  *   **Hardcoded Limit:** The Table contains the full copying logic for a specific sequence. The Strand is a null-op or trigger. (Replicative Partitioning $\to$ 100% Table).
  *   **Universal Limit:** The Table is a Universal Turing Machine. The Strand contains the full description of the UTM plus the data. (Replicative Partitioning $\to$ 100% Strand).
  *   **The Conservation Law:** The **Joint Descriptive Length** ($K(\text{Table}) + K(\text{Strand}|\text{Table})$) remains roughly constant for a given offspring fidelity, subject to the efficiency of the encoding.

  #### B. For the Relational Property: **Interpretive Autonomy** (or lack thereof)
  **Definition:** The degree to which a strand's functional identity (e.g., "replicator") is intrinsic to its structure versus dependent on the interpreter.
  **Diagnosis:** In your system, strands have **Zero Interpretive Autonomy**. They are **Functional Contextuals**.
  **Boundary Cases:**
  *   **Absolute Autonomy:** A physical key that opens a lock purely via geometry, regardless of the lock's internal mechanism (not possible in computation).
  *   **Absolute Relationality:** A bit string that is a virus in one OS and a text file in another. Your strands are here.

  ### 4. Why This Matters for Your Teaching

  You asked if there is a fact of the matter about how much specification lives in the strand vs. the machinery. The answer is **No**, and that is the philosophical payload.

  This demonstrates that **Function is not a property of Objects, but of Systems.**
  When we look at DNA, we are tempted to say "The DNA contains the instructions for the organism." Your simulation shows this is a category error. The DNA contains *differences* that the cellular machinery *interprets* as instructions. If you swapped the cellular machinery (the table) but kept the DNA, you would not get the same organism.

  This undermines the "Gene as Blueprint" metaphor in favor of the "Gene as Resource" metaphor. The blueprint implies the information is all in the document. The resource implies the information is in the *interaction* between the document and the construction crew.

  ### Summary of the Phenomenon

  You have isolated **The Arbitrariness of the System/Input Boundary** in a self-replicating formal system.

  1.  **Is it one phenomenon or two?** It is one phenomenon viewed from two angles.
      *   *Static View:* **Replicative Partitioning** (Where are the bits?)
      *   *Dynamic View:* **Interpretive Relationality** (Where is the function?)
  2.  **Is information conserved?** Yes, but only as **Joint System Specificity**. The "cost" of specifying the offspring is paid by the sum of the Table and the Strand, not the Strand alone.
  3.  **Why Kolmogorov Complexity felt wrong:** Because standard KC fixes the Universal Machine $U$ and varies the string $x$. You are varying $U$ (the Table) and $x$ (the Strand) simultaneously. You are exploring the **moduli space of Universal Constructors**.

  **Suggested Coined Name:**
  If you need a single label for the course material, call it **The Replicative Boundary Problem**.
  It parallels the *Measurement Problem* in quantum mechanics: there is no non-arbitrary line between the quantum system and the classical observer. In your Typogenetics, there is no non-arbitrary line between the replicator (strand) and the environment (table).

  **Boundary Case to Test:**
  To prove the "Conservation of Specificity," try to find a "Sweet Spot."
  *   If the Table is *too* smart (hardcoded for Strand A), it cannot replicate Strand B. The system loses **Evolutionary Potential**.
  *   If the Table is *too* dumb, the Strand must be so long that replication errors become statistically certain.
  *   The "Life" zone is likely a Pareto frontier where the Table is general enough to allow variation, but specific enough to keep the Strand short enough to copy accurately. This is the **Complexity Threshold for Open-Ended Evolution**.

  This is not just procrastination; you've built a model of the Genotype/Phenotype/Environment triad. Keep going.
