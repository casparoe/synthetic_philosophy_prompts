answer: |-
  Julian sits at his desk with a contract from his publisher spread out before him. His debut novel was a surprise critical success, and now he must decide between two clauses for his second book. The first offers a standard advance with a twenty-four-month delivery window. The second offers a significantly higher advance but requires delivery in fifteen months, with a penalty clause if he misses the date. To decide, Julian attempts to estimate the time required to finish the manuscript.

  From the *inside view*, Julian estimates fourteen months. He knows the plot intimately, feels a surge of creative momentum from the debut's reception, and has already written the opening chapter. He sees no structural obstacles that defeated him last time. However, when he shifts to the *outside view*, the picture fractures. If he categorizes the project as a "sophomore literary novel by a debut bestseller," the base rates are grim: authors in this class average twenty-eight months to delivery, often stalled by the pressure of expectation. This estimate tells him to sign the twenty-four-month clause. But if he categorizes the project as a "novel by an author who has drafted fifty thousand words before signing," the base rates are optimistic: this class averages twelve months. This estimate tells him the fifteen-month clause is safe. Both classes are defensible; he is undeniably a sophomore author, and he undeniably has a head start. Neither is gerrymandered; both are standard industry categories.

  Complicating matters further, Julian holds specific evidence neither class captures. He knows with certainty that he must relocate his family to a different city in six months to care for an aging parent, a disruption that will halt writing for at least eight weeks. The statistical classes know nothing of this move. If he defers strictly to the optimistic outside view (the "drafted words" class), he ignores this known obstacle and risks the penalty. If he defers to the pessimistic outside view (the "sophomore slump" class), he leaves money on the table despite having mitigated the slump's usual causes. Finally, Julian tries to settle which reference class is the "correct" one by seeking an objective standard for classification. He asks whether "sophomore status" or "draft completion" is the stronger predictor of delay. But there is no meta-statistic for this; to answer it, he would need to consult a class of "factors predicting novel completion," which itself requires choosing a reference class to define what counts as a factor. The vantage point recedes; every attempt to step outside and choose the class requires an inside judgment about which particulars matter most.

  The vanishing vantage point does not render the outside view idle, but it strips it of its authority as a final arbiter. We cannot use base rates to escape the burden of judgment because selecting the relevant base rate is itself a judgment call that relies on inside knowledge of causal mechanisms. Therefore, epistemic modesty cannot mean simply deferring to the outside view once a class is chosen; it must apply upstream, to the selection of the reference class itself. We must acknowledge that our choice of class is as vulnerable to overconfidence as our estimate of the particulars, meaning the outside view is best used not as a replacement for inside reasoning, but as a competing witness whose testimony must be weighed against specific evidence and the inherent uncertainty of the classification itself.
