answer: |-
  **Title:** The Divided Workspace: Why Split-Brain Cases Force Global Workspace Theory to Commit to Phenomenology

  **Introduction**
  Ned Block's distinction between phenomenal consciousness (P-consciousness) and access consciousness (A-consciousness) has long served as the primary hurdle for functionalist theories of mind. P-consciousness refers to the subjective "what-it-is-like" of experience, while A-consciousness concerns the availability of information for reasoning, report, and control. Global Workspace Theory (GWT), championed by Baars and Dehaene, is frequently accused of offering a robust account of A-consciousness while remaining silent—or even eliminativist—regarding P-consciousness. The standard critique suggests GWT explains how information becomes *used*, not how it becomes *felt*. However, this critique often relies on an assumption that GWT proponents can remain agnostic about phenomenology while defining the mechanisms of access. I argue that this agnosticism is unsustainable. By examining the case of commissurotomy (split-brain) patients, we see that GWT cannot merely be a theory of access; it is forced to make substantive, ontological claims about phenomenology. Specifically, if consciousness is identified with global broadcasting within a neural system, then the functional fission of the split-brain entails a phenomenal fission. GWT does not redefine the question away; rather, it commits to the existence of two distinct streams of experience. To deny this is to abandon the functionalist core of the theory.

  **The Access Charge and the Functionalist Commitment**
  The charge that GWT is "only" a theory of access stems from its operational definitions. In standard GWT frameworks, a content becomes conscious when it is selected by attention and broadcast to a wide array of specialized, unconscious processors. This broadcast enables verbal report, working memory retention, and voluntary control. Critics argue that these are merely functional consequences. One can imagine a system that broadcasts information without there being "something it is like" to be that system—a philosophical zombie with a functioning global workspace. If GWT allows for this possibility, it has failed to address P-consciousness.

  However, GWT is not merely a model of cognitive architecture; it is an identity claim. Proponents do not say broadcasting *correlates* with consciousness; they argue that the broadcasting process *constitutes* consciousness. This is a functionalist ontology. If one accepts the premise that "consciousness = global broadcasting," then the theory is no longer just about access. It is a claim about the necessary and sufficient conditions for the existence of experience. The question, then, is not whether GWT *can* speak to phenomenology, but whether it has the courage to follow its own definition to its logical extremes. The split-brain case provides the stress test for this courage.

  **The Split-Brain Verdict: Two Workspaces, Two Lights On**
  In commissurotomy patients, the corpus callosum is severed to treat epilepsy, effectively isolating the left and right cerebral hemispheres. Empirical data suggests that these hemispheres can process information, form intentions, and initiate actions independently. The left hand (right hemisphere) might button a shirt while the right hand (left hemisphere) unbuttons it, with each side seemingly unaware of the other's intent.

  Under the GWT framework, the "global" in Global Workspace refers to global *within the system*. In a neurotypical brain, the workspace is unified by the callosal connections. In the split-brain patient, the causal bridge required for a single, unified broadcast is destroyed. We are left with two distinct, functionally isolated broadcasting systems. The left hemisphere broadcasts visual data from the right visual field to its own speech and motor centers; the right hemisphere does the same for the left visual field, but without cross-communication.

  Here lies the crux: If GWT identifies consciousness with the event of global broadcasting, and there are two isolated broadcasting events occurring simultaneously without integration, GWT *must* posit two streams of consciousness. To claim there is only "one" consciousness here would require positing a subject of experience that exists over and above the functional architecture of the workspace. It would require a "homunculus" or a Cartesian ego that resides in the brain as a whole, observing both hemispheres despite the lack of functional integration between them. But GWT is a materialist, functionalist theory; it has no room for a non-functional subject. Therefore, the theory is forced to conclude that there are two phenomenal subjects.

  **Rejecting the "Confused Subject" Defense**
  A defender of the "GWT is only access" critique might argue that there is still only one *person* here, and thus only one consciousness, merely fragmented in its access. They might suggest the patient is a single subject suffering from a deficit in information transfer, not a duplication of experience. This move, however, conflates legal or social personhood with phenomenal consciousness.

  If GWT proponents were to adopt this line, they would be conceding that functional isolation is compatible with phenomenal unity. This would devastate the theory. If a single stream of phenomenology can persist despite the total functional fission of the workspace, then the workspace is not constitutive of phenomenology; it is merely a tool used by it. This would validate Block's critique that GWT explains access (the tool) but misses the experience (the user).

  To remain coherent, GWT must bite the bullet: the functional fission *is* a phenomenal fission. The "what-it-is-like" for the left hemisphere is not accessible to the right, not because of a reporting error, but because the "what-it-is-like" literally does not exist for the right hemisphere regarding the left's data. There is no single "confused subject." There are two subjects sharing a skull. This is not a redefinition of the question; it is a specific, risky prediction about the nature of subjective experience. It asserts that the unity of consciousness is not a metaphysical given but a fragile functional achievement. When the function breaks, the unity of experience shatters.

  **Conclusion: GWT as a Theory of Phenomenology**
  The split-brain case demonstrates that Global Workspace Theory cannot hide behind the distinction between access and phenomenology. By tying consciousness to the functional mechanism of broadcasting, GWT binds itself to the architecture of that mechanism. When the architecture divides, the theory dictates that the consciousness divides. This shows that GWT is not merely a theory of access that ignores the "hard problem." Rather, it is a theory that attempts to dissolve the hard problem by identifying the phenomenal with the functional.

  Critics may dislike this conclusion, arguing that we cannot know if there are "two feels" in a split-brain patient. But the point of a scientific theory is not to cater to pre-theoretical intuitions about the unity of the self; it is to provide a consistent explanatory framework. GWT provides a consistent framework only if it accepts that two workspaces entail two phenomenologies. To deny this is to admit that GWT is incomplete. Thus, GWT does speak to phenomenal consciousness: it claims that phenomenology is nothing more than the internal perspective of a globally broadcasting system. In the split-brain, that perspective is doubled.

  ***

  **Confidence and Weakest Step**
  **Confidence Level:** 85%
  **Weakest Step:** The step I am least sure of is the assertion that GWT proponents *must* accept the functionalist identity claim (Consciousness = Broadcasting) without reservation. It is possible for a proponent of GWT to retreat to a "correlate" position, arguing that broadcasting is the *neural correlate* of consciousness without being *identical* to it. If they take this retreat, my argument that they are "forced" to posit two streams weakens, as they could claim the underlying metaphysical subject remains one despite the functional split. However, taking that retreat would significantly diminish the explanatory power of GWT, effectively conceding that the theory does not solve the hard problem, only maps its boundaries. I am confident that for GWT to be a *theory of consciousness* rather than a *theory of cognitive reporting*, it must make the identity claim I have attributed to it.
