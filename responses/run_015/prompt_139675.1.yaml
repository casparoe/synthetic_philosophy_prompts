  1. Can the tracking-deficient test uniquely distinguish biased preferences under institutional neutrality constraints without collapsing into skepticism about bias or unlimited paternalism? This question admits a fully determinate answer by isolating whether second-order judgments about irrelevant factors necessarily invoke contested conceptions of justice or if they rest on precise procedural inconsistencies accessible to the agent herself without requiring any highly substantive moral premises.

  2. Existing frameworks fail because they conflate the distinct normative jobs bias performs across well-being, consent, and aggregation, relying on historical or error tests that require institutions to appeal to contested conceptions of justice they are barred from invoking. This conflation leaves open whether a neutrality-compatible test can sustain the specific authority required for strict institutional intervention without covertly smuggling in substantive claims about the good, creating a distinct theoretical gap this project fills by separating these normative functions.

