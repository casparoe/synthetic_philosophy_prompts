  2.  **Deconstruct Updateless Decision Theory (UDT):**
      *   *Core Idea:* Maximize expected utility over policies (functions from observations to actions) chosen *before* receiving specific information, rather than maximizing over actions chosen *after* conditioning on that information.
      *   *Motivation:* Dynamic inconsistency, time inconsistency, coordination problems between "selves" at different times or in different branches.
      *   *Key Distinction:* It's not about *ignoring* evidence, but about *how* evidence enters the calculation (as an indexical input to a policy vs. a condition for belief revision).

  3.  **Sequence of Material (The "Arc"):**
