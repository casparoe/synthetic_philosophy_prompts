  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "Never update on evidence."*
          *   *Fix:* Distinguish between *epistemic* updating (beliefs) and *decision-theoretic* updating (policy selection). UDT agents update beliefs but don't change policies based on indexical information.
