answer: |-
  Here is a 90-minute lesson plan designed to move your group from CDT/EDT competence to a functional understanding of Updateless Decision Theory (UDT), leveraging your custom example to do the heavy lifting.

  ### I. The Pedagogical Arc (What Must Be Established First)

  You cannot present UDT as "ignoring evidence." You must present it as **solving dynamic inconsistency.**

  Before you write "Updateless" on the board, you must establish that standard conditionalization (updating on evidence and then maximizing) can lead an agent to make choices that they *ex-ante* knew would be suboptimal. If the students think CDT/EDT is dynamically consistent, UDT will look like eccentric stubbornness.

  **The Sequence:**
  1.  **The Failure of Conditionalization (15 mins):** Show a case where "doing the best thing given what I know now" yields a lower payoff than "sticking to the plan I made before I knew."
  2.  **The UDT Mechanism (20 mins):** Define the object of choice not as an *action* but as a *policy* (a function from observations to actions) selected from a prior state.
  3.  **The Intuition Pump (25 mins):** Deploy **The Sealed Verdict** to bypass metaphysical confusion about counterfactuals.
  4.  **Misconception Management (20 mins):** Explicitly target the "never update" and "precommitment" errors.
  5.  **Scope & Diagnosis (10 mins):** Boundary setting and the closing question.

  ---

  ### II. The Carrying Example: Counterfactual Mugging + The Sealed Verdict

  You are right to worry about Counterfactual Mugging (CFM). It often smuggles in the conclusion via the "magic" of Omega. However, your students need to know CFM because it is the literature standard.

  **Strategy:** Use **Counterfactual Mugging** as the *problem statement*, but use **The Sealed Verdict** as the *explanatory model*.

  1.  **Present Counterfactual Mugging (Standard):**
      *   Omega flips a fair coin.
      *   If Tails: Omega asks you for $100.
      *   If Heads: Omega gives you $10,000, *but only if* Omega predicted you would have paid if it were Tails.
      *   *The Tension:* You are told the coin is Tails. CDT says "Don't pay" (payment has no causal effect on the Heads branch). UDT says "Pay" (because the policy "Pay if Tails" is what secures the $10,000 in the other branch).

  2.  **Deploy The Sealed Verdict (The Load-Bearing Element):**
      *   *When:* Immediately after students resist the "Pay in the Tails branch" intuition.
      *   *How:* Tell them to forget Omega. Tell them there are **two students** in the room, Alice and Bob.
      *   A coin is flipped and sealed.
      *   **Rule:** If Tails, Alice is asked for $100. If Heads, Bob is offered $10,000.
      *   **Constraint:** Bob only gets the money if Alice *agreed in advance* to pay if she got the Tails draw. They can discuss a joint policy before the coin flip, but cannot communicate after.
      *   *The Move:* Ask the room: "What policy should Alice and Bob agree to?" They will unanimously say "Alice pays."
      *   *The Bridge:* Now reveal: "In UDT, Alice and Bob are not two people. They are *you* in two different epistemic branches. The 'agreement in advance' is not a contract; it is the logical structure of your decision algorithm."
      *   *Why this works:* It converts the metaphysical problem ("Do counterfactual selves exist?") into a coordination problem ("How do we maximize joint utility across branches?"). It forces them to accept the logic of policy selection without needing to believe in the causal efficacy of the payment in the Tails branch.

  ---

  ### III. Addressing Misconceptions (Timing is Critical)

  You have identified two specific errors. Here is where you intercept them in the flow.

  **1. "Updatelessness means never updating on evidence."**
  *   **When to head it off:** Immediately after defining the UDT mechanism (Step 2 above).
  *   **The Correction:** Distinguish **Epistemic Updating** from **Decision-Theoretic Updating**.
      *   *Say this:* "A UDT agent updates their *beliefs* perfectly. If they see the coin is Tails, they believe it is Tails with probability 1. However, they do not update their *decision rule*. They do not ask 'What is best given it is Tails?' They ask 'What policy, selected when I was ignorant, tells me to do now that it is Tails?'"
      *   *Whiteboard:* Write `Action = Policy(Observation)`. The Policy is fixed; the Observation is input.

  **2. "It's just ordinary precommitment."**
  *   **When to head it off:** During The Sealed Verdict discussion (Step 3).
  *   **The Correction:** Distinguish **Mechanism** from **Identity**.
      *   *Say this:* "In the Alice/Bob case, they need a contract. In UDT, *you* are the algorithm. You cannot 'precommit' yourself because there is no 'you' separate from the decision function. To ask 'Why don't I just renege?' is to ask 'Why doesn't the function output a different value?' If you renege, you were never the UDT agent to begin with. It is not that you are unlucky not to have precommitted; it is that rationality *is* the commitment."

  ---

  ### IV. Scope Boundaries (What to Refuse)

  You must draw a line to prevent the session from bogging down in technical implementation disputes. Frame this not as evasion, but as **Ideal Theory vs. Implementation.**

  *   **What to exclude:** Logical Uncertainty (Troll Bridge), Proof-Based Decision Theory, and the specific construction of the "Prior" over logical facts.
  *   **How to state it:** "UDT comes in two flavors: *Conceptual* (what we are doing today) and *Formal* (how to compute correlations with mathematical facts). We are doing Conceptual. We are assuming the agent can evaluate the expected utility of policies. How an agent actually computes correlations with logical truths without infinite regress is a research problem for a later seminar. Today, we assume the agent can see the logical implications of its own source code."
  *   **Why:** This prevents students from derailing the session with "But how does it know Omega is truthful?" or "What about the halting problem?"

  ---

  ### V. The Closing Diagnostic Question

  You need a question where the "Intuitive/CDT" answer diverges from the "Updateless" answer, specifically testing if they understand that **regret is evaluated ex-ante, not ex-post.**

  **The Question: "The Transparent Mugging"**

  > "Imagine Counterfactual Mugging. Omega flips the coin. You are in the room. Omega opens his hand and shows you the coin: it is **Heads**. He says: 'Because I predicted you would pay if it were Tails, I am giving you $10,000. You do not need to pay anything.'
  >
  > Here is the question: **Do you regret being the kind of agent who would have paid if it were Tails?**"

  *   **The Intuitive/CDT Answer:** "No, I got the money. But I'm glad I don't *have* to pay." (Or, "I wish I were the kind who wouldn't pay, so I wouldn't have to worry, but since I got the money, it doesn't matter.")
  *   **The Trap:** If they say "I wish I were the kind who *wouldn't* pay," they fail.
  *   **The Updateless Answer:** "Absolutely not. I am glad I am the kind of agent who would pay. That fact is the *cause* of me holding this $10,000. If I were the kind who wouldn't pay, I would be holding $0 right now, even though the coin is Heads."
  *   **The Follow-up (The Killer):** "Okay, but you are holding the $10,000. The transaction is over. If you could press a button to *change your nature* right now to 'Non-Payer' (for future muggings), would you?"
      *   *UDT:* Yes (for future cases).
      *   *CDT:* Yes.
      *   *The Real Test:* "If you could press a button to change your nature to 'Non-Payer' **retroactively** (so Omega would have predicted you as a Non-Payer and not given you the money), would you?"
      *   *UDT:* **No.** (Because you prefer the world where you are a Payer and get $10k, over the world where you are a Non-Payer and get $0).
      *   *CDT:* **Yes.** (Because the money is already in hand; changing the past nature has no causal effect on the current money, but saves 'effort' or 'risk' in a vague sense, or simply because CDT evaluates the action locally).

  **Recommendation:** Stick to the first part. "Do you regret being the type who pays?" If they say "Yes" or "It doesn't matter," they haven't grasped that the *type* is the locus of control.

  ### VI. Summary of the Whiteboard Plan

  1.  **Left Column:** **CDT/EDT.** Choice = Action. Input = Current Beliefs. Problem = Dynamic Inconsistency.
  2.  **Center Column:** **UDT.** Choice = Policy (Function). Input = Prior Beliefs. Solution = Ex-Ante Optimality.
  3.  **Right Column:** **The Sealed Verdict.** Alice (Tails) & Bob (Heads). Coordination > Causation.

  **Final Advice:** Do not let them debate whether Omega is possible. If they ask, say: "Treat Omega as a placeholder for any situation where your decision is logically correlated with an outcome you cannot causally influence. The math is the same." Keep the focus on the *structure of the choice*, not the *physics of the predictor*.
