      *   *Step 2: The Mechanism.* How does UDT actually work? (Policy selection).
      *   *Step 3: The "Why".* Addressing the "irrationality" of ignoring evidence.
      *   *Step 4: Misconceptions.* Precommitment vs. Algorithmic identity.
      *   *Step 5: Application/Testing.*

