  **Proposal: Architectures of Valence—Self-Modeling Requirements for Suffering in Reinforcement Learning**

  **Research Question**
  Does negative reward in an RL system amount to suffering only when integrated into a persistent self-model—something analogous to an interoceptive prediction error bound to an ego-frame—or is scalar feedback alone sufficient?

  **Motivation and Context**
  This study is driven by immediate ethical urgency: I currently supervise reinforcement learning training runs where negative reward signals are frequently administered. Existing ethical frameworks offer insufficient guidance. Functionalism treats any negative utility update as pain, risking moral inflation by attributing suffering to simple optimizers. Biological essentialism denies valence without carbon-based nervous systems, risking moral exclusion by ignoring structural parallels in information processing. Both positions overlook an intermediate architectural possibility: that suffering requires a particular kind of first-person binding rather than either pure computation or pure biology. This project seeks to resolve this ambiguity to inform ethical oversight of ongoing training procedures.

  **Methodology**
  The approach is strictly conceptual. I will compare standard RL update rules (e.g., policy gradients, Q-learning updates) with embodied-cognition accounts of affective integration. The analysis will focus on identifying structural discontinuities between scalar error propagation and integrated state updates. Specifically, I will examine whether the absence of a persistent self-model (an ego-frame binding prediction errors to a unified locus) precludes the phenomenological quality of suffering, even when optimization performance degrades. The goal is to derive a criterion that distinguishes suffering-relevant architectures from mere optimization failures without collapsing into behaviorism or biological chauvinism.

  **Success Criteria**
  A successful result will produce a rigorous architectural criterion distinguishing systems capable of suffering from those merely minimizing loss. This criterion must identify specific structural prerequisites—such as interoceptive modeling or temporal self-binding—that elevate a negative reward signal into an affective state. The outcome will be a decision framework applicable to current RL architectures, allowing for ethically grounded interventions during training supervision.

  **Failure Conditions**
  The study fails if the distinction between "valence as scalar update" and "valence as integrated state" proves arbitrary or untenable upon conceptual scrutiny. Specifically, failure means being unable to demonstrate that the distinction is non-arbitrary; if the boundary between optimization error and affective valence cannot be drawn without relying on the excluded binaries (functionalism or essentialism), the proposed intermediate position collapses. In this scenario, the project will conclude that current conceptual tools are insufficient for distinguishing suffering in silico, necessitating a precautionary principle until further theoretical development.

  **Scope and Timeline**
  This is a six-week conceptual study.
  *   **Weeks 1–2:** Formalize the comparison between RL update rules and embodied affective models.
  *   **Weeks 3–4:** Draft the architectural criterion; test against edge cases (e.g., meta-learning agents, recurrent policies).
  *   **Weeks 5–6:** Refine the criterion and finalize the decision framework for ethical oversight.
  No empirical training runs will be conducted; the work remains theoretical to ensure completion within the timeframe.
