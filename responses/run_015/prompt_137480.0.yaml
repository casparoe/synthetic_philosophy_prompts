answer: |-
  This is an exceptionally tight reconstruction of the dialectic. You have correctly identified that the tension lies in the generalization from belief to intention. The argument is valid; the problem is that (3) and (6) are both intuitively compelling, which means the bridge between them—specifically the move from the specific case of belief to the universal claim about attitudes—must be the fault line.

  Here is the diagnosis for your reading group.

  ### 1. Which Step to Reject
  You should reject **(4)**.

  **(4) claims:** *Nothing above is specific to belief. For any attitude A settling question Q, the reasons for A are the considerations bearing on Q.*

  This premise looks sound because it relies on a structural analogy: both belief and intention are propositional attitudes that play a role in rational deliberation. If belief settles a theoretical question, and intention settles a practical question, it seems natural to assume the "logic of settling" is uniform.

  However, (4) overgeneralizes a feature of **theoretical rationality** to **practical rationality**. While belief and intention both "settle questions," they do so in fundamentally different modes. Belief settles by *tracking*; Intention settles by *committing*.

  ### 2. Why (4) Looked Sound (and Why It Is False)
  (4) looks sound because of the **Guise of the Good/True** tradition. It assumes that for any mental state $M$, there is a constitutive norm $N$, and reasons for $M$ must be reasons that bear on satisfying $N$.
  *   For Belief, $N$ = Truth.
  *   For Intention, $N$ = Action/Good.

  The error is assuming that "considerations bearing on $Q$" functions identically in both domains.
  *   **In Belief:** The question $Q$ is "Is $p$ true?" This is a *theoretical* question. The answer is determined by the world. My mind must conform to the world. Pragmatic considerations (utility, comfort) do not bear on the world's state; they bear on my relationship to the state. Hence, they are WKRs.
  *   **In Intention:** The question $Q$ is "Shall I $\phi$?" This is a *practical* question. The answer is determined by *me*. The world must (partly) conform to my mind. In practical deliberation, the costs, benefits, and coordination requirements of the *act of intending itself* are relevant to the question "Shall I?"

  By rejecting (4), you preserve the distinction between **Theoretical Reason** (governed by truth, where pragmatic reasons are WKRs) and **Practical Reason** (governed by action/good, where pragmatic reasons about stability and coordination are RKRs).

  ### 3. What Does Rejecting (4) Cost?
  The cost is **Unified Rationality**. You must accept a dualism of rationality.
  *   You cannot offer a single, domain-neutral account of "reasons for attitudes."
  *   You must accept that "settling a question" means something different when the question is about the *world* (belief) versus when the question is about the *will* (intention).

  This is a standard Kantian cost, but it is a cost nonetheless. It means your reading group cannot rely on a single "question-settling" model to solve WKR problems across the board. You need a disjunctive theory: one account for representational attitudes (belief, perception) and another for volitional attitudes (intention, desire).

  ### 4. If (1) Survives: The Belief-Specific Feature
  You mentioned you would rather give up (1) than (3), but if you want to keep (1) (restricted to belief), you need the specific feature that blocks the slide to intention. That feature is **Involuntarism via Transparency**.

  *   **The Feature:** Belief is uniquely constrained by **Transparency** (Evans/Williams). When I ask "Do I believe $p$?", I must look outward to the world ("Is $p$ true?"). I cannot look inward to my utilities.
  *   **Why it blocks the slide:** Intention is *not* transparent in this way. When I ask "Do I intend to $\phi$?", I do not look solely at whether $\phi$ will happen; I look at my will, my plans, and my commitments. I *can* intend because it is useful to intend (e.g., to signal to a partner).
  *   **Avoiding Circularity:** This does not assume the conclusion (that pragmatic reasons are WKRs) because Transparency is a phenomenological/psychological claim about how deliberation *works*, not a normative claim about how it *should* work.
      *   *Premise:* In deliberation, pragmatic considerations cannot appear as premises leading to belief (Transparency).
      *   *Inference:* Therefore, they cannot function as RKRs (since RKRs must be capable of being premises in deliberation).
      *   *Conclusion:* Pragmatic considerations are WKRs for belief.
      *   *Contrast:* In intention deliberation, pragmatic considerations *can* appear as premises (e.g., "I should intend now to ensure coordination"). Therefore, they can be RKRs for intention.

  This saves (1) for belief, saves (3), saves (6), and blocks (4) without begging the question.

  ### 5. Resolving the "Fragile Considerations" Complication
  This is the most subtle part of your puzzle.
  *   *Case:* Believing $p$ makes $p$ true (e.g., "My students will improve"), but only if I don't believe it *because* it makes $p$ true.
  *   *Question:* Is this an RKR or WKR?

  **Verdict:** These are **Wrong-Kind Reasons**.

  **Why:** The defining mark of a Right-Kind Reason is that it can **rationally sustain** the attitude. It must be a consideration on the basis of which one can hold the attitude without defeating the attitude's function.
  *   If I believe "My students will improve" *on the basis of* "Believing this helps them improve," I am treating the belief as a tool. In many fragile cases (like confidence), this instrumentalization undermines the sincerity required for the self-fulfilling mechanism to work.
  *   Because the consideration *cannot* be the basis of the belief without defeating the truth-condition, it fails the "baseability test" for RKRs.
  *   It remains a reason to *cause* the belief (e.g., by hypnosis or self-manipulation), which is the definition of a WKR.

  **Does this block the step from (4) to (5)?**
  Yes. It highlights the disanalogy.
  *   **Belief:** Fragile considerations are WKRs because believing *on the basis of them* defeats the truth-aim.
  *   **Intention:** Considerations like "Intending now helps coordination" are **RKRs**. I *can* and *should* intend on the basis of coordination benefits. Intending *on the basis of them* does not defeat the intention; it constitutes rational planning (Bratman).

  The fragility of belief in the face of pragmatic bases is precisely the feature that distinguishes it from intention. By classifying fragile considerations as WKRs for belief, you reinforce (3). By classifying coordination considerations as RKRs for intention, you reinforce (6). The divergence proves (4) false.

  ### Summary for the Reading Group
  1.  **Reject (4).** The logic of "settling a question" differs between theoretical and practical domains.
  2.  **Keep (1) & (3) for Belief.** Grounded in **Transparency** and **Involuntarism**. Pragmatic reasons cannot be premises in belief-formation.
  3.  **Keep (6) for Intention.** Grounded in the **Volitional** nature of intention. Pragmatic reasons (coordination, stability) *are* premises in intention-formation.
  4.  **Classify Fragile Considerations as WKRs.** Their inability to serve as a *basis* without defeat confirms they are not Right-Kind Reasons for belief, further widening the gap between belief and intention.

  This preserves your core intuition (Pragmatic reasons are WKRs for belief) while accommodating the obvious difference in intention, at the cost of accepting a dualism of rationality.
