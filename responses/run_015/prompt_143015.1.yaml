answer: |-
  This is a classic problem in normative ethics, often discussed under the headers of the "Demandingness Objection" (Williams, Scheffler) and "Fungibility" (Singer). Your intuitions are actually quite standard for a "moderate deontologist" or a "satisficing consequentialist," but Case 6 and Case 7 reveal a tension between **money as a metric** and **life-disruption as a metric**.

  Here are two precise principles that can organize your verdicts, followed by an analysis of where you need to adjust for consistency and how they handle your new cases.

  ### Principle 1: The "Secure Baseline" Constraint
  **Definition:** An agent is morally required to make sacrifices only up to the point where doing so would threaten their **long-term security** or **core life projects**. You must give from your *surplus* (disposable income, leisure time), but you are not required to liquidate *security assets* (home, health, baseline stability).

  *   **Why it fits your cases:**
      *   **Case 1 (Latte):** Surplus. **Required.**
      *   **Case 2 (Minimum Wage):** Threatens baseline security/standard of living. **Not Required.**
      *   **Case 3 (Blood):** Minor temporary cost, no threat to security. **Required.**
      *   **Case 4 (Kidney):** Threatens bodily security/integrity. **Not Required.**
      *   **Case 5 (Volunteering):** 5-10 hours is surplus leisure; 40 hours threatens career/life balance. **Partial.**
      *   **Case 6 (Sell House):** The house is a "security asset." Liquidating it threatens long-term stability. **Not Required.**

  ### Principle 2: The "Stock vs. Flow" Distinction
  **Definition:** Morality has a stronger claim on your **flow** (income, time, labor) than on your **stock** (accumulated capital, home equity, established lifestyle). We are obligated to direct our *productive capacity* toward the good more than we are obligated to dismantle our *accumulated safety*.

  *   **Why it fits your cases:**
      *   This principle specifically targets your **Case 6 vs. Case 7** tension.
      *   It explains why selling the house (depleting *Stock*) feels wrong, while working extra hours (expending *Flow*) feels more permissible, even if the dollar amount is identical.

  ---

  ### The Inconsistency: Case 6 vs. Case 7
  Here is where you have to make a choice. Your current intuition is:
  *   **Case 6:** Not Required (Don't sell house).
  *   **Case 7:** *Closer to Required* (Work extra 20hrs/week for 10 years).

  **The Problem:**
  If you accept **Principle 1 (Secure Baseline)**, Case 7 must be **Not Required**. Working an extra 20 hours a week for a decade is not "surplus"; it is a massive restructuring of your life plan. It eliminates leisure, likely harms health, and prevents other projects. It is functionally equivalent to Case 2 (living on minimum wage) in terms of life-domination.

  If you accept **Principle 2 (Stock vs. Flow)**, you can keep your current intuition (6 is No, 7 is Yes). However, you must defend why *time* is less sacred than *equity*. Many philosophers argue time is *more* sacred because it is non-renewable, whereas money is fungible.

  **The Verdict for Consistency:**
  To align with your strong intuition in Case 2 (that you don't have to live on minimum wage to save dozens of lives), **you should drop the intuition that Case 7 is required.**
  *   **Reasoning:** If you aren't required to reduce your *standard of living* to the bare minimum (Case 2), you aren't required to reduce your *free time* to the bare minimum (Case 7). Both represent a life consumed by obligation.
  *   **Adjustment:** Mark Case 7 as **Not Required**. This aligns it with Case 6. The money is fungible, but the *sacrifice* (loss of security vs. loss of decade of freedom) is similarly high.

  ---

  ### Handling New Cases
  Here is how the **Secure Baseline Principle** (the more robust of the two) handles your new scenarios.

  #### New Case A: The Vaccine (1-in-1000 Risk)
  *   **Scenario:** You are required to take a vaccine with a 0.1% risk of severe side effects to save strangers.
  *   **Analysis:** This sits between Case 3 (Blood) and Case 4 (Kidney).
      *   Blood donation has near-zero risk.
      *   Kidney donation has surgical risk and permanent bodily alteration.
      *   Vaccine risk is low probability but high severity.
  *   **Verdict:** **Borderline / Likely Not Required.**
      *   Under the *Secure Baseline Principle*, bodily integrity is part of the security floor. While 1/1000 is low, imposing *any* non-negligible risk of severe harm violates bodily security.
      *   *Exception:* If the risk is truly "de minimis" (e.g., 1 in 1,000,000), it shifts to Case 3 (Required). At 1/1000, it likely triggers the Case 4 (Kidney) protection.

  #### New Case B: Caring for Disabled Family Member vs. Charity
  *   **Scenario:** You can either care for a disabled sibling (allowing them a decent life) or work that time and donate the earnings to save more strangers' lives.
  *   **Analysis:** This tests **Agent-Relative Prerogatives**.
  *   **Verdict:** **Not Required to prioritize strangers.**
      *   The *Secure Baseline Principle* usually includes "core relationships" as part of the baseline.
      *   Most moderate ethical systems allow (or require) special duties to family. Abandoning a sibling to maximize global utility violates the "core life projects" constraint.
      *   *Principle:* You are permitted to prioritize "near and dear" obligations over "general" obligations, provided the cost to strangers isn't catastrophic (which it rarely is in one-off cases).

  ### Summary of Coherent Position
  To make your view fully consistent, I recommend adopting the **Secure Baseline Principle** and adjusting Case 7.

  1.  **Required:** Low-cost surplus acts (Latte, Blood, 5-10 hrs volunteering).
  2.  **Not Required:** Acts that threaten security, bodily integrity, or dominate your life plan (Minimum wage lifestyle, Kidney, Selling House, Working 20 extra hrs/week for a decade).
  3.  **The Logic:** Morality demands you help, but it does not demand you become a instrument of help. You are entitled to a life of your own, defined by a baseline of security and relationships.

  **Does this resolution feel stable to you?** Specifically, does downgrading Case 7 (the extra work) to "Not Required" feel like a loss, or does it relieve the tension with Case 2?
