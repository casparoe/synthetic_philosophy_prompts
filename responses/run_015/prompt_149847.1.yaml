      *Let's finalize the ranking.*
      1. (2) vs (4) - Metaphysical clash (Static line vs. Dynamic credit).
      2. (2) vs (6) - Semantic clash (Objective vs. Relative).
      3. (3) vs (5) - False alarm.

      *Best Fix:* Drop (4). It's the most controversial and causes the most structural damage.

      *Wait, looking closer at (3).* "Reasons aggregate in roughly linear fashion... don't automatically fuse." This is a specific stance against "aggregationism." This supports (5) (Ceiling). If reasons *did* fuse infinitely, (5) would be hard to hold. So (3) supports (5). I will confirm this is a false alarm.

      *Looking closer at (1) and (4).* (1) defines supererogation by lack of blame. (4) uses supererogation to modify blame for *duties*. This creates a currency exchange between the two categories. If the categories are sharply distinct (2), can they exchange currency? Yes, but it makes the *consequences* of the categories blurry.

