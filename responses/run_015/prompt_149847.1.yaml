      *   Cheapest fix for each? Check.
      *   Single best revision? Check.

  8.  **Self-Correction during drafting:** I initially thought (3) and (5) were fine. I need to make sure I explain *why* the user might have felt they clashed. Maybe they thought linear aggregation leads to infinite demands? I should address that: Linear aggregation *without* a fusion rule actually prevents the "demandingness" explosion. So they are compatible.

      *Wait, one nuance on (4):* If "Moral Surplus" just affects *blameworthiness* but not *obligatoriness*, does it save (2)?
      *   Claim (1): "not doing them [supererogatory acts] doesn't make you blameworthy."
      *   Claim (4): "small failure of duty is less blameworthy."
      *   If I have a Duty to X, and I don't X, I am blameworthy (by definition of Duty).
