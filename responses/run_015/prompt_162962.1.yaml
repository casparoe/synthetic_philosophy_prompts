answer: |-
  Here is the reverse-engineering of Priya's heuristic, the alternative models that could trap you, the specific fact you need to find, and the script for Thursday.

  ### 1. The Rule Priya Is Actually Running

  Your guess ("predicts unseen things" vs. "explains past misses") is close, but it's too focused on the *output*. Priya is evaluating the *mechanism*.

  **The Rule:** **Fund engineering that discovers generalizable mechanisms; defund engineering that applies local patches.**

  *   **Generalizable Mechanism (Keep):** A fix for Problem A reveals a truth about System B (Anomaly team, Forecasting team). It implies the team understands the *physics* of the system, not just the symptoms.
  *   **Local Patch (Kill):** A fix for Problem A only works for Problem A (Recommendation team, Compression team). It implies the team is curve-fitting noise.
  *   **The "Search-Ranking" Clarification:** You noted she killed them even though patches passed tests. That's because passing a test on known data is just "fitting." Anticipating unknown data is "modeling." She funds modelers, not fitters.
  *   **The Exception (Case 6):** **Opportunity Cost.** You only kill a "local patch" team if a "generalizable mechanism" team is ready to take their workload *now*. A slide deck is not a team.

  ### 2. Alternative Rules That Fit the Past But Kill Your Case

  To survive the Q&A, you need to know which alternative heuristic a skeptical stakeholder (or Priya, if you misread her) might use to dismantle your recommendation.

  **Alternative A: The "Integrity of Discovery" Rule**
  *   **Logic:** Novelty only counts if it originates *within* the team.
  *   **Fits Past Cases:** Yes. In Case 2 & 3, the teams found the insights themselves.
  *   **Diverges on Your Case:** Your team lifted the predictive component from the rival. Under this rule, they aren't "discoverers"; they are "implementers." Implementers are commodities.
  *   **Verdict:** **Kill.** Fund the originators (the rival team), not the copiers.

  **Alternative B: The "Momentum" Rule**
  *   **Logic:** 18 months of signal degradation cannot be wiped out by 3 months of success. The "ugly patches" prove the core architecture is rot.
  *   **Fits Past Cases:** Yes. Explains why Recommendation (6 misses) and Search (2 years of patches) were killed despite eventual metric compliance.
  *   **Diverges on Your Case:** It treats the recent win as an outlier or luck, not a turnaround. It weighs the 18-month trend heavier than the 3-month spike.
  *   **Verdict:** **Kill.** The technical debt is too high; start fresh with the rival.

  **Alternative C: The "Clean Slate" Rule (Case 7)**
  *   **Logic:** If the fundamental assumption changes (Seasonality → Feedback Loop), it is a *new project* regardless of the team name. Past performance is irrelevant.
  *   **Fits Past Cases:** Yes. Consistent with Case 7 (Restart).
  *   **Diverges on Your Case:** This is your strongest shield. If this is a "New Project," the 18 months of patches don't count. Only the last 3 months matter.
  *   **Verdict:** **Keep.** (But creates vulnerability regarding the Rival/Opportunity Cost).

  ### 3. Which Rule Is She Running?

  I am 85% confident Priya is running **The Rule (Generalizable Mechanism)** modified by **Case 7 (Clean Slate)**.

  **Why:**
  1.  She praised the Anomaly team for *one* strong case despite misses. She doesn't require perfection; she requires *insight*.
  2.  She allowed the Scheduling team to continue despite being "tired" because the replacement wasn't ready. This proves she is pragmatic about **continuity risk**.
  3.  The "Dropped Assumption" (Seasonality → Feedback Loop) is a massive theoretical shift. In her eyes, this likely triggers Case 7. They aren't patching the old model; they built a new one and kept the pipeline.

  **However, the Rival Team is your danger zone.**
  Case 6 is the only time she kept a "tired" team, and her justification was explicit: *"You don't pull a project because it's tired, you pull it because something better showed up."*
  The rival team *has* showed up. They have clean predictions. They are novel.
  **The only reason to keep your team is if the rival team cannot scale.** A notebook model often breaks when hooked into production infrastructure.

  ### 4. The Specific Fact to Dig Up

  Before Thursday, you need to answer one question: **Can the rival team's notebook model handle production load?**

  *   **If Yes:** Priya will kill your team. The "Opportunity Cost" rule (Case 6) will trigger. The rival is smaller, newer, and has cleaner signal.
  *   **If No:** Priya will keep your team. Your team owns the *infrastructure* to validate the new theory. The rival owns the *theory*, but your team owns the *engine*.

  **Action:** Talk to the tech lead of the rival team or check their architecture docs. Do they have a pipeline? Do they have latency guarantees? Or is it offline batch processing?
  *   *If they have no pipeline:* Your argument is "We are the only team capable of operationalizing this new feedback-loop theory at scale."
  *   *If they have a pipeline:* Your argument must shift to "Merger."

  ### 5. What to Argue on Thursday

  **Recommendation:** **Keep Funding, but Re-baseline.**
  Do not argue that the team is "healthy." Argue that the *project* has effectively restarted (Case 7) and that they are the only viable vehicle for the new architecture (Case 6 defense).

  **The Script:**

  > "I've reviewed the Capacity-Demand Forecasting team. On the surface, the last 18 months look like the Recommendation-Ranking case (Case 1): reactive patching and one-off fixes. If this were the same model, I'd recommend killing it.
  >
  > However, three months ago, they dropped the core assumption of the original design—shifting from Seasonal Baseline to Inventory-Feedback. Per the Restart precedent (Case 7), this effectively voids the previous 18 months. We are evaluating a new project with a three-month track record.
  >
  > In those three months, they demonstrated generalizable mechanism discovery (Case 2): they predicted a pattern in an untouched product line correctly. The fact that the theoretical component was validated by the internal rival team is a feature, not a bug—it confirms the mechanism is sound.
  >
  > **The Decision:** I recommend continued funding, contingent on one factor. The rival team has superior signal, but they lack production infrastructure. If we kill Capacity-Demand now, we lose the pipeline required to scale the Feedback-Loop model.
  >
  > **My Proposal:** Fund the Capacity team for two more quarters *specifically* to migrate the rival team's logic into the production pipeline. If the rival team builds their own pipeline by Q3, we revisit. If not, we've avoided a gap in coverage."

  **Why this works:**
  1.  **It shows you did the homework:** You cited her precedents (Case 1, 2, 6, 7).
  2.  **It neutralizes the "Stolen" argument:** You frame it as "validated theory" rather than "plagiarism."
  3.  **It neutralizes the "18 Months of Failure" argument:** You invoke Case 7 (Restart) to reset the clock.
  4.  **It addresses the Rival:** You acknowledge Case 6 (Opportunity Cost) but highlight the *infrastructure gap* which makes the rival a non-replacement for now.
  5.  **It gives Priya an out:** You set a timeline (2 quarters) and a condition (rival pipeline). If the rival scales up, you've already planned the kill switch.

  **Summary:** Don't defend the past 18 months. Declare them dead. Defend the *pipeline's ability to run the new theory* that the rival team discovered but can't yet deploy. That makes you an infra engineer solving a scaling problem, not a manager making a judgment call on data science.
