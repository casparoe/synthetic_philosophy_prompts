answer: |-
  You have independently reconstructed one of the most famous results in twentieth-century philosophy of language: David Lewis's triviality proof (1976). It is a testament to your clarity of thought that you arrived at it via a row over a railway strike. You are quite right to feel that the argument proves too much; that is precisely why it is taken as a *reductio ad absurdum* of the premises rather than a genuine proof that nothing is evidence for anything.

  To answer your primary question directly: the standard move is to reject **(3)**.

  Here is the breakdown of why (3) is the casualty, why your typed-language fix does not save it, why the "probably" analogy fails, and how this bears on your specific situation with the bet.

  ### 1. Which step to reject?

  The consensus among those who wish to preserve the Ramsey Test (1) and the coherence of conditionalisation (2) is to deny that the indicative conditional expresses a **proposition** in the sense required by the probability calculus.

  Step (3) invokes the Law of Total Probability: $P(X) = P(X|C)P(C) + P(X|\neg C)P(\neg C)$. This law applies to events or propositions—things that partition the logical space, things that are either true or false in a given world. If you reject (3), you are saying that "If A then C" does not pick out a set of possible worlds. It has no truth conditions. It is not the sort of thing that *is* true or false; rather, it is the sort of thing that is *assertible* or *unassertible* depending on your conditional credence.

  **The Cost:**
  Dropping (3) is expensive. It means you cannot embed conditionals freely in truth-functional contexts. You cannot straightforwardly say "It is not the case that if A then C" or "Either if A then C, or if B then D" without engaging in some linguistic gymnastics. It also means that, strictly speaking, you cannot bet on a conditional, because bets are settled on truth values. If the conditional has no truth value, the bet has no settlement conditions. (I shall return to this).

  **The Gain:**
  You preserve (1) and (2). You maintain that your credence in the conditional *is* your conditional credence. You also preserve the intuition that learning $\neg A$ does not tell you whether $C$ would have followed $A$; it merely renders the indicative conditional inappropriate to utter, shifting you into the counterfactual mood.

  ### 2. Your First Worry: Typed Languages

  You asked whether a typed language (banning self-embedding) saves the argument. It does not.

  The triviality proof does not rely on nesting conditionals inside other conditionals (e.g., "If A then (if B then C)"). It relies on treating the conditional as the *subject* of a probability operator that is itself conditionalised. Step (4) calculates $P(\text{If } A \text{ then } C \mid C)$. This is not a nested sentence; it is a statement about your credence in the conditional *given* that you learn C.

  The problem is not syntactic embedding; it is ontological. Step (3) assumes the conditional is an object in the probability space (a proposition) that obeys the standard axioms. A type hierarchy prevents $A \to (B \to C)$, but it does not prevent you from having a credence in $A \to C$ and then updating that credence upon learning $C$. As long as you treat the conditional as a proposition with a probability value that obeys the Law of Total Probability, Lewis's result holds. To block it, you must deny the conditional is a proposition at all, regardless of type.

  ### 3. Your Second Worry: The Local Case ($P(A) = 0$)

  This is the most pertinent point for your bet. You note that since the strike was called off, $P(A) = 0$, making $P(C|A)$ undefined.

  You are correct that Adams' Thesis (1) is standardly restricted to cases where $P(A) > 0$. When $P(A)$ collapses to 0 (because you learn $\neg A$), the indicative conditional "If A goes ahead, C happens" generally loses its grip. In natural language, we switch to the subjunctive: "If the strike *had* gone ahead, the conference *would have* moved online."

  Your intuition that you "plainly do" still have a degree of belief is accurate, but that belief is no longer in the *indicative* conditional you bet on. It is a belief in a *counterfactual*. Counterfactuals are evaluated differently (typically via similarity of possible worlds rather than conditional probability).

  This suggests a dissolution of the row rather than a victory for either side.
  *   **Your brother-in-law** is relying on a truth-conditional view: since the antecedent is false, the conditional (on many accounts) is vacuously true or lacks a truth value, making the bet void.
  *   **You** are relying on the Ramsey Test: you had a high conditional credence at the time of the bet, and that rational connection remains intact even if the antecedent failed.

  If you reject (3), you concede that the sentence you bet on does not express a proposition. Therefore, strictly speaking, it cannot be "true" in the way required to win a bet. However, you maintain that your *position* was rational. The tragedy of the triviality result is that it suggests you cannot have it both ways: you cannot have a conditional that is both a truth-apt proposition (for the bet) and identical to conditional probability (for your rational credence).

  ### 4. Your Third Worry: The "Probably" Analogy

  You suspected the argument proves too much because it seems to collapse other operators like "probably". You are right to be suspicious; the analogy breaks down at **Step (5)**.

  Let $S$ be "Probably C".
  Step (4) analogue: $P(\text{Probably } C \mid C) = 1$. (If C is true, was it probable? Plausibly yes).
  Step (5) analogue: $P(\text{Probably } C \mid \neg C) = 0$.

  This is the failure point. If $\neg C$ turns out to be the case (it does not rain), it does not follow that "Probably C" was false (it might have been 90% cloudy). The event $\neg C$ does not *falsify* the claim "Probably C".

  However, for the conditional "If A then C", the conjunction $A \land \neg C$ is standardly taken to *falsify* the conditional. That is why Step (5) works for conditionals but not for modals like "probably". The triviality result is specific to operators that are verified by $A \land C$ and falsified by $A \land \neg C$. This specificity is why the result doesn't wipe out all modal operators, only truth-conditional accounts of the indicative conditional.

  ### Summary and Recommendation

  You asked which premise is cheapest to drop.
  *   **Drop (1)?** You keep truth conditions (the conditional is a proposition) but must accept that $P(\text{If } A \text{ then } C) \neq P(C|A)$. This leads to the "paradoxes of material implication" (e.g., "If the moon is cheese, then the conference is online" becomes true because the antecedent is false). This violates your Ramsey intuition.
  *   **Drop (3)?** You keep the Ramsey Test but deny the conditional is a proposition. This fits your credence intuitions perfectly but makes the bet technically unadjudicable (no truth value).

  Given that you wish to keep "conditionalising on what I learn is fine" and "learning $\neg A$ doesn't settle the connection," **dropping (3)** is the philosophically orthodox route for someone in your position. It treats the conditional as an expression of a conditional belief state rather than a description of the world.

  **On the bet:**
  If you adopt the "no proposition" view, your brother-in-law is logically consistent: if there is no fact of the matter (no truth value), the bet is void. However, you are epistemically consistent: your assessment of the risk was correct. The row arises because you are arguing about epistemology (was I right to expect this?) while he is arguing about semantics (does this sentence have a truth value?).

  Since you cannot force a proposition to exist where the logic suggests there is none, the most graceful exit is to acknowledge that the bet relied on a semantic illusion. The conditional felt like a fact, but it was actually a commitment to a supposition. Since the supposition ($A$) was ruled out, the commitment lapsed. Pay up? Perhaps not. But acknowledge that the sentence you bet on wasn't the kind of thing that *could* win.

  *(And do buy him a pint regardless; triviality results are notoriously bad for family relations.)*
