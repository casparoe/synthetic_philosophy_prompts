answer: |-
  The room was stripped of echo, lined with wood that drank sound rather than reflected it. In the center sat a low table, and upon the table, a square of copper sat heating over a spirit lamp. The flame was blue and silent.

  Kaelen watched the metal. He was old enough that his own skin had become a map of faded injuries, none of which he could recall hurting him at the time. Beside him stood Mira, seven years old, her hands clasped behind her back, her eyes fixed on the copper. She had been prepared for this moment for three years. She knew the breathing. She knew the posture. She knew that the mind was a house with many rooms, and that one could choose to stand in the hallway rather than the burning bedroom.

  "It is hot enough," Kaelen said softly.

  Mira stepped forward. She did not hesitate. Hesitation was a form of aversion, and aversion was the chain they sought to break. She extended her right hand. She placed the pad of her index finger onto the center of the copper plate.

  There was no jerk. No gasp. No pupil dilation.

  Kaelen watched her face. It remained smooth, a still pond. He counted to ten, then nodded. Mira lifted her hand. A small red mark bloomed on the skin, a stark flower of damage. She looked at it, then looked at Kaelen.

  "Describe it," he said.

  "It was bright," Mira said. Her voice was level. "It was sharp. It felt like… like a bell ringing inside the finger. Very loud. Very clear."

  "Did it tell you to move?"

  Mira frowned slightly, searching her memory of the last ten seconds. "It told me something was happening. It showed me exactly where the heat was. But it didn't say *stop*."

  "Good," Kaelen said. He extinguished the lamp. "Then you have separated the message from the messenger."

  Mira rubbed her finger against her thumb. "The messenger?"

  "The part that screams," Kaelen said. "Most people feel the heat and they feel the fear. They are tangled together. They think the burning *is* the fear. But you felt only the burning. The signal remained. The suffering did not."

  Mira looked down at her hand. "But Kaelen… it is still a warning."

  "It is data," he corrected gently. "It tells you the copper is hot. It tells you the skin is changing. That is all it needs to do."

  "If I didn't mind it," Mira said, her brow furrowing deeper, "why would I move my hand?"

  "Because you choose to preserve the body. Not because you are driven by panic."

  "But isn't the panic the reason we care?"

  Kaelen paused. This was the threshold. The tradition held that the aversive quality of pain was a learned corruption, a layer of psychological resistance that turned sensation into agony. To remove the resistance was to return to purity. The signal was neutral; the 'no' was the artifact.

  "The panic is a shadow," Kaelen said. "It clouds the truth. When you remove the shadow, you see the thing as it is. The heat is not bad. It is only heat. The 'badness' was your refusal to accept it."

  Mira looked at the red mark again. "But if it's not bad, then it doesn't matter if it burns."

  "It matters because you value the hand," Kaelen said. "Not because the pain forces you to."

  Mira was quiet for a long time. She walked to the window and looked out at the garden, where the wind moved through the trees. "When I touched it," she said, "it felt like a shout. A very loud shout. I didn't run away, because you taught me not to. But the shout was trying to tell me something important."

  "It told you the temperature," Kaelen said.

  "No," Mira said, turning back to him. "It told me that I am something that can be broken."

  Kaelen felt a tightening in his chest, a phantom recoil he had trained out of himself decades ago. "And now? Do you feel broken?"

  "No. I feel… quiet." She held up her finger. "But Kaelen, if the shout doesn't make me afraid, do I still care that I can be broken?"

  Kaelen walked around the table and knelt so he was at her eye level. "The care comes from wisdom. Not from flinching."

  "Maybe the flinching *is* the care," Mira said. "Maybe the badness isn't the shadow. Maybe the badness is the value."

  She touched the red mark again. She pressed hard enough to blanch the skin, then released. She felt the pressure, the texture, the heat radiating from the inflammation. She felt it all with perfect, crystalline clarity. There was no urge to stop pressing. There was no distress. There was only the fact of the injury.

  "If I don't feel that it is bad to burn," Mira said, "then I am not protecting myself. I am just observing myself."

  "You are free," Kaelen said, though his voice lacked its usual certainty.

  "Or I am alone," she replied.

  She looked at him, waiting for the correction. She was waiting for him to tell her that the moral weight of pain was just another story, another layer of resistance to be shed. That the 'badness' was a construct of the untrained mind, a confusion of sensation with desire.

  But Kaelen looked at the red mark on her finger. He knew the tradition taught that the affective component was the source of evil, the root of the desperate clinging that caused war and cruelty. To eliminate the suffering of pain was to eliminate a primary source of human misery.

  Yet, looking at the child, he saw that the urgency to pull away was also an urgency to live. It was a biological prayer. By answering the prayer with silence, had they granted peace, or had they simply muted the alarm system that declared the self worth saving?

  "The experience remains," Kaelen said finally. "The signal is clear."

  "But is it a warning," Mira asked, "or just a description?"

  Kaelen reached out and took her hand, careful not to press the burn. He felt the warmth of her palm. He could not feel her fear, because she had none. He could not feel his own fear, because he had none. They stood in the quiet room, perfectly safe, perfectly damaged, and perfectly still.

  "That," Kaelen said, "is what you must learn to carry."

  "Carry the burn?"

  "Carry the question."

  Mira nodded slowly. She did not pull her hand away. She did not lean in. She simply let it rest in his, a heavy, bright fact, neither good nor bad, waiting to be named.
