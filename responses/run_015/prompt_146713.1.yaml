answer: |-
  # Session Plan: The "Moral Overtime" Objection to Consequentialism
  **Target:** First-year Political Philosophy Grad Students (No prior Normative Ethics)
  **Time:** 75 Minutes
  **Goal:** Distinguish the *demandingness objection* (normative unreasonableness) from mere *difficulty* (psychological limitation) using a "continuous on-call" framing rather than a "crisis rescue" framing.

  ---

  ## 0. Ground Rules & Exclusions (5 Minutes)
  **Instructor Script:**
  "Before we begin, three constraints on today's session.
  1.  **No History:** We are not reading Scheffler, Singer, or Williams today. We are analyzing the *structure* of the argument, not its genealogy.
  2.  **No Calculus:** We are not doing utility math. We are talking about the *shape* of the requirement, not the measurement of the output.
  3.  **No Bibliography:** This is a conceptual workshop. If you need sources for a paper, ask me later.

  **Why?** Because the demandingness objection is often buried under historical commentary or empirical disputes about how much money saves a life. We are isolating the *logical tension* between maximizing good and living a life."

  ---

  ## 1. The Prerequisite: Establishing the "On-Call" Status (15 Minutes)
  **Objective:** Secure agreement that consequentialism applies to omissions and mundane lifestyle choices, not just dramatic interventions.

  **The Logic:**
  You cannot argue that a job is "too demanding" if the student believes the job only happens once a month. You must first establish that the employee is *always on the clock*.

  **Discussion Prompt:**
  "Imagine a theory that says: 'You must not murder, and you must not steal.' Is this theory demanding? No. Now imagine a theory that says: 'Every time you choose coffee over tea, if the tea would have produced slightly more net good, you have acted wrongly.' Is this demanding? Yes. Which one is Consequentialism?"

  **Key Concept to Lock In:**
  *   **The Equivalence of Omission and Action:** Under consequentialism, failing to maximize good in your private time is morally equivalent to actively causing harm in public time.
  *   **The Scope Claim:** Morality does not pause when the crisis ends. It applies to the Saturday morning just as much as the disaster zone.

  **Instructor Note (Crucial):**
  *Do not move to the 'Overtime' analogy yet.* If students think morality only kicks in during "emergencies," the overtime analogy fails. They will say, "Just don't go into emergency mode." You must force them to admit that for a consequentialist, *normal life is morally charged*.
  *   *Check:* Ask a student: "If I spend an hour reading fiction instead of tutoring, have I violated a moral requirement?" If they say "No," stop and re-explain the maximizing principle. If they say "Yes," proceed.

  ---

  ## 2. The Engine: From Maximization to Continuous Scope (15 Minutes)
  **Objective:** Demonstrate how the *maximizing* principle creates the *continuous* demand.

  **The Dependency Chain:**
  1.  **Maximization:** The rule is not "Do Good," it is "Do the *Most* Good."
  2.  **Marginal Utility:** There is almost always *some* way to produce slightly more good (e.g., working one more hour to donate, volunteering instead of sleeping).
  3.  **No Stopping Point:** Because there is always a marginal improvement available, there is no point where you are "done" for the day.

  **The "Saturday Morning" Scenario (Carrying Example):**
  *   **Setup:** It is Saturday, 9:00 AM. You have no classes. You plan to make coffee, read a novel, and call your mother.
  *   **Consequentialist Audit:**
      *   Could you have worked a shift at a food bank instead of reading? Yes.
      *   Could you have worked a paid shift and donated the wages instead of calling your mother? Yes.
      *   Is the food bank/donation morally weightier than the novel/call? Plausibly, yes.
  *   **The Result:** Your Saturday morning is not "free time." It is unallocated moral resources.

  **Visual Aid:**
  Draw a timeline on the board. Mark "Sleep," "Eat," "Class."
  Ask: "Where does the moral requirement end?"
  *   *Student intuition:* "After I've done my duty."
  *   *Consequentialist reality:* "There is no end point until death, because there is always more good to be done."

  ---

  ## 3. The Objection: Moral Overtime (15 Minutes)
  **Objective:** Frame the demandingness objection not as "I can't do it" but as "I shouldn't have to."

  **The Analogy:**
  *   **Labor Overtime:** In a job, overtime is occasional. It is triggered by specific needs. It is compensated.
  *   **Moral Overtime:** Consequentialism treats *all* time as overtime. You are permanently on-call for marginal improvement. There is no "off the clock."

  **The Distinction (Hard vs. Wrong):**
  *   **Psychological Claim:** "Humans are too weak to live this way." (This is an empirical claim about human capacity).
  *   **Normative Claim:** "A morality that requires this is defective." (This is a philosophical claim about the function of morality).

  **Instructor Script:**
  "The objection isn't that you *will* fail. It's that a theory requiring you to succeed is *unreasonable*. If a labor contract required you to be on-call 24/7 with no pay, we wouldn't just say 'workers are too tired.' We would say 'this contract is unjust.' The Demandingness Objection claims consequentialism is an unjust moral contract."

  ---

  ## 4. Intercepting Misconceptions (15 Minutes)
  **Objective:** Address the three specific errors in sequence.

  **Misconception 1: "It's Impossible for Weak Humans"**
  *   *The Error:* Confusing capacity with permission.
  *   *The Intercept:* "If we genetically engineered humans to love sacrificing themselves 24/7, would the objection disappear? If the answer is 'No, it's still too demanding,' then the objection isn't about human weakness. It's about the value of personal projects."

  **Misconception 2: "What About Supererogation?"**
  *   *The Error:* Thinking you can categorize extreme sacrifice as "above and beyond" (saintly) rather than required.
  *   *The Intercept:* "Consequentialism generally rejects supererogation. If Action A saves 5 lives and Action B saves 1 life (your leisure), A is obligatory. You cannot 'opt-in' to heroism. You are required to maximize. The category of 'nice but not required' does not exist in strict maximizing consequentialism."

  **Misconception 3: "Just Do Enough"**
  *   *The Error:* Setting an arbitrary threshold (e.g., "Donate 10% and relax").
  *   *The Intercept:* "Where does the number come from? If 10% saves lives, why isn't 11% required? If you admit 11% is better, you admit the threshold is arbitrary. The 'Overtime' problem returns because the marginal gain never hits zero."

  ---

  ## 5. Comprehension Check: The "Theory Patch" Exercise (15 Minutes)
  **Objective:** Verify they grasp the *structural* objection, not just the emotional reaction.

  **Activity:**
  Present three proposed "fixes" to Consequentialism. Ask students to identify which one actually solves the *Moral Overtime* problem and why the others fail.

  1.  **The Weakness Patch:** "We acknowledge humans are selfish, so we lower the requirement to match what people actually do."
      *   *Correct Analysis:* Fails. This commits the "Is-Ought" fallacy. It addresses capacity, not reasonableness.
  2.  **The Threshold Patch:** "You must maximize good until you reach a 'good enough' level of overall welfare, then you can rest."
      *   *Correct Analysis:* Fails. As long as *your* sacrifice produces *more* good than your rest, the maximizing principle forces you to continue. The "Overtime" remains.
  3.  **The Prerogative Patch:** "Agents are permitted to give some weight to their own interests, even if it doesn't maximize the overall good."
      *   *Correct Analysis:* **Success.** This structurally alters the theory to allow "off the clock" time. It directly addresses the "Continuous Scope" issue.

  **Discussion Question:**
  "Why does Option 3 change the *definition* of the theory, while Option 1 just changes the *expectations*?"
  *(Target Answer: Option 3 admits that maximizing the good is not the only moral value; Option 1 just admits humans are flawed maximizers.)*

  ---

  ## 6. Wrap Up (10 Minutes)
  **Summary:**
  *   We established that consequentialism puts all time "on the clock" (Scope).
  *   We showed that maximization prevents a "stop time" (Engine).
  *   We framed this as "Moral Overtime" (The Objection).
  *   We distinguished "cannot" from "should not" (Misconceptions).

  **Final Thought for Next Time:**
  "Today we assumed the Consequentialist logic holds to see if it breaks under pressure. Next time, we ask: If we accept the 'Prerogative Patch' to save us from overtime, do we break the engine of Consequentialism entirely? Does allowing 'selfish' time destroy the theory's ability to solve the problems it was built for?"

  ---

  ## Instructor's Cheat Sheet: Why This Order Matters

  **1. Why Scope before Overtime?**
  If you start with "You have to work all the time," a student will reply, "No, I only have to help in emergencies." You must close the exit door first. They must accept that *Saturday Morning* is moral terrain. If they don't accept that omissions count as actions, the "Overtime" analogy sounds like a strawman.

  **2. Why "Unreasonable" before "Impossible"?**
  Grad students love empirical pushback ("People won't do that"). You must force them into the normative lane ("People *shouldn't* be asked to do that"). If they stay in the empirical lane, the session becomes psychology, not philosophy.

  **3. Why No History?**
  Naming Scheffler or Singer invites students to go read the summary instead of thinking through the logic. By keeping it nameless, you force them to engage with the *argument structure* (Maximization $\rightarrow$ Demand) rather than the *scholarship* (Scheffler vs. Kagan).

  **4. The Comprehension Check**
  The "Theory Patch" exercise prevents the "Nodding Along" problem. Students often nod at "Morality shouldn't be too hard" because they are tired grad students. The Patch exercise forces them to distinguish between *weakening the agent* (Option 1) and *weakening the theory* (Option 3). Only Option 3 solves the philosophical problem.
