prompt: |-
  I need to plan a session for first-year grad students in political philosophy who haven't really done normative ethics but can follow an argument. I'm teaching the demandingness objection to consequentialism, but I'm not using the usual famine-donation setup—everyone's seen that. Instead I'm framing it through "moral overtime," the idea that consequentialism doesn't just ask for occasional heroism but treats every waking minute as on-call for marginal improvement, like labor overtime that never ends. The carrying example should be something mundane—maybe how they spend a free Saturday morning—so they feel the micro-demand in thier own schedule rather than in some distant crisis.

  Plan the arc: what idea has to be in place before they can even see why "too demanding" is a distinct objection (not just "too hard"), the dependancy chain that builds from maximization to continuous scope to accumulated cost, the one scenario to carry it (needs to be close to home, not abstract), the misconceptions in order—probably they think demandingness means "impossible for weak humans" rather than "unreasonable to require," then they confuse it with supererogation, then they think you can escape by just doing "enough"—where in the sequence to intercept each, the check that shows they've actually grasped the objection rather than just nodding at "people are selfish," and what I'm leaving out on purpose: no history of Scheffler or Singer, no formal utility calculus, no bibliography, and I should say so up front. Make clear why you can't present the overtime framing before they've already bought that consequentialism applies to omissions and lifestyle choices, not just big rescue decisions.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year grad students in political philosophy. They can follow arguments but lack background in normative ethics.
      *   **Topic:** The Demandingness Objection to Consequentialism.
      *   **Unique Framing:** "Moral Overtime" (continuous, micro-demand) instead of the classic "Famine/Donation" (macro-crisis).
      *   **Core Example:** Mundane lifestyle choice (e.g., a free Saturday morning).
      *   **Key Constraints:**
          *   Must establish prerequisites before the objection makes sense.
          *   Must map the dependency chain (Maximization $\rightarrow$ Continuous Scope $\rightarrow$ Accumulated Cost).
          *   Must address misconceptions in a specific order (Impossible vs. Unreasonable $\rightarrow$ Supererogation $\rightarrow$ "Enough").
          *   Must include a comprehension check (not just "people are selfish").
          *   Must explicitly exclude: History (Scheffler/Singer), Formal Calculus, Bibliography.
          *   Must explain *why* the overtime framing depends on prior acceptance of consequentialism's scope (omissions/lifestyle).

  2.  **Deconstruct the Logic Flow:**
      *   *Problem:* If students don't accept that consequentialism governs *everything* (omissions, small choices), the "overtime" analogy fails. They'll just say, "Well, don't work overtime then."
      *   *Solution:* Start by locking in the scope of moral evaluation.
      *   *Problem:* Students often confuse "hard" with "wrong."
      *   *Solution:* Distinguish psychological difficulty from normative reasonableness.
      *   *Problem:* Students think they can stop at "good enough."
      *   *Solution:* Show how maximization prevents stopping points.
      *   *Problem:* Students think this is just about saints/heroes.
      *   *Solution:* Show how it erodes personal projects (the "overtime" aspect).

  3.  **Drafting the Session Arc (Iterative Process):**

      *   *Introduction:* Need to set the ground rules immediately. No history, no math. Just the structure of the demand.
      *   *Phase 1: The Scope (The "On-Call" Status).* Before talking about *how much* is demanded, we need to establish *when* it is demanded. If morality only applies to big decisions, Saturday morning is free. If it applies to all consequences, Saturday morning is moral terrain.
      *   *Phase 2: The Engine (Maximization).* Why can't I just do *some* good? Because the theory says *maximize*. This leads to the "no off-switch" problem.
      *   *Phase 3: The Objection (Moral Overtime).* Now apply the "Saturday Morning" example. Compare it to labor overtime. It's not that you *can't* work; it's that you *shouldn't be required* to always work.
      *   *Phase 4: Misconception Interception.*
          1.  "It's too hard for humans" (Psychological) $\rightarrow$ Correct to "It leaves no room for a life" (Normative).
          2.  "What about supererogation?" $\rightarrow$ Consequentialism denies this category.
          3.  "Can't I just do enough?" $\rightarrow$ No, because marginal utility always exists.
      *   *Phase 5: Check for Understanding.* Need a question that forces them to apply the logic, not just agree with the sentiment.

  4.  **Refining the "Saturday Morning" Example:**
      *   It needs to be specific. Coffee? Reading? Sleeping?
      *   Let's go with "The Saturday Morning Coffee." You could be volunteering, fundraising, or working extra to donate. Every minute spent sipping coffee is a minute not maximizing good.
      *   *Why this works:* It's low stakes individually, high stakes cumulatively. Just like overtime hours.

  5.  **Addressing the "Why Scope First?" Constraint:**
      *   I need to explicitly state in the plan that if they think morality is only about "do not kill/steal," the overtime argument bounces off. They must accept that *omissions* count as *actions* with consequences.

  6.  **Developing the Comprehension Check:**
      *   Bad check: "Is consequentialism too demanding?" (Yes/No)
      *   Bad check: "Do you like having free time?" (Irrelevant)
      *   Good check: A scenario where they have to identify *why* a modification to the theory fails to solve the problem. E.g., "If we set a threshold of 80% optimization, does the overtime problem vanish?" (No, because the margin still exists). Or, "Distinguish between a claim that people *won't* follow the theory vs. *shouldn't* have to."

  7.  **Final Review against Constraints:**
      *   No Scheffler/Singer names? Check.
      *   No utility calculus formulas? Check.
      *   No bibliography? Check.
      *   Grad level tone? Yes, needs to be rigorous but accessible.
      *   Flow: Scope $\rightarrow$ Maximization $\rightarrow$ Overtime $\rightarrow$ Misconceptions.

  8.  **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't accidentally slip into "Famine" examples. Keep it strictly about the Saturday morning/marginal improvement.
      *   *Correction:* Ensure the distinction between "psychologically impossible" and "normatively unreasonable" is sharp. This is a common grad student pitfall.
      *   *Emphasis:* Highlight the "On-Call" metaphor. It's not just about the *amount* of work, it's about the *availability*.

  9.  **Final Polish:** Organize into clear time blocks with learning objectives and instructor notes. (Proceeds to generate output based on this structure).

  *(Self-Correction on the "Check"):* The prompt asks for a check that shows they grasp the objection, not just that "people are selfish." The check needs to verify they understand the *structural* issue of maximization, not just the *human* issue of weakness. I will design a "Theory Patch" exercise.

  *(Self-Correction on "Scope"):* I need to make sure the "Why Scope First" section is prominent, as requested ("Make clear why you can't present the overtime framing before..."). I will put this as a specific instructor note at the start of Phase 1.

