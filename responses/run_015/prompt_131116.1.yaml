prompt: |-
  Hey — I'm drafting prompts that get into the weeds of causation by omission without just rehashing the "not watering the plant" examples. So here's an institutional practice I want you to think about.

  In hospital morbidity-and-mortality review boards — the M&M conferences — they use a standardized incident form. If a resident forgets to order a routine lab and the patient crashes, that failure gets entered in the field marked "direct causal ommission." But if the crash happens because administration never funded the analyzer — meaning the test literally couldn't be ordered — the form files that under "systemic context," not in the causal-omission box. Both are failures to act; both sit upstream of the harm; yet the institution treats only the bedside failure as causally implicated.

  What view of causation by omission does that coding practice preusppose? Does it assume omissions are only causal when there's an assigned agent-duty at the point of failure, or is it smuggling a normative filter into a metaphysical question? Reconstruct the implicit theory, say whether the practice strictly requires it or is compatible with several rival accounts, and tell me what would have to change in the form's design if that underlying view were replaced.

  Also, please say what would change your mind: which argument or piece of evidence would lead you to think the coding distinction doesn't actually presuppose any particular causal theory, and where is your reasoning most likely to fail?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Causation by omission in the context of Hospital Morbidity-and-Mortality (M&M) review boards.
      *   **Specific Scenario:** A standardized incident form distinguishes between a resident forgetting to order a lab ("direct causal omission") and administration failing to fund the analyzer ("systemic context"). Both are failures to act upstream of harm, but only the former is coded as causal.
      *   **Tasks:**
          1.  Identify the implicit view/theory of causation by omission presupposed by this coding practice.
          2.  Analyze if it assumes assigned agent-duty vs. smuggling a normative filter into metaphysics.
          3.  Reconstruct the implicit theory.
          4.  Determine if the practice *strictly requires* this theory or is compatible with rivals.
          5.  Propose design changes if the underlying view were replaced.
          6.  **Meta-Cognitive Constraint:** State what would change my mind (evidence/argument that the distinction *doesn't* presuppose a causal theory) and identify where my reasoning is most likely to fail.

  2.  **Analyze the Scenario (The "M&M Form" Case):**
      *   *Case A (Resident):* Duty exists (standard of care), ability exists (analyzer works), action omitted (didn't order), harm occurred. -> Coded as "Direct Causal Omission."
      *   *Case B (Administration):* Duty exists (arguably, to provide resources), ability omitted (no funding), action omitted (didn't fund), harm occurred. -> Coded as "Systemic Context" (non-causal/background).
      *   *Key Distinction:* Proximity/Immediacy vs. Structural/Background. Individual Duty vs. Collective/Structural Duty.

  3.  **Identify the Implicit Theory of Causation:**
      *   *Metaphysical vs. Normative:* Purely counterfactual theories of omission (e.g., "If X had happened, Y wouldn't have") treat both cases equally. If the analyzer existed, the test would be ordered, the condition found, harm avoided. If the resident ordered it (and the machine existed), harm avoided. Both are counterfactually necessary.
      *   *The Form's Bias:* The form treats Case A as *causal* and Case B as *context*. This implies causation isn't just about counterfactual dependence. It relies on a **Normative Theory of Causation** (specifically, a Duty-Based or Proximate Cause model).
      *   *Specific Theory:* It looks like a hybrid of **Hart & Honoré's "Interruption of a Normal Course"** combined with **Legal Proximate Cause**. The resident's omission is an "intervention" in the expected flow of care. The admin's omission is part of the "background conditions."
      *   *Is it smuggling norms?* Yes. It takes a metaphysical question ("Did this cause that?") and answers it using normative criteria ("Who was *supposed* to act here?").

  4.  **Drafting the Reconstruction (Task 1 & 2):**
      *   *Theory:* "Normatively-Filtered Counterfactualism."
      *   *Mechanism:* An omission is causal *only if* it violates a specific, localized duty of care assigned to a proximate agent. Background conditions (even if they involve omissions of duty) are treated as fixed parameters, not variables.
      *   *Metaphysical vs. Normative:* It is definitely smuggling a normative filter. Purely metaphysical accounts (like Lewis's counterfactuals) would struggle to distinguish the two without pragmatic overlays.

  5.  **Compatibility with Rival Accounts (Task 3):**
      *   *Strict Requirement?* Does the form *require* this theory? Not necessarily. It could be pragmatic. Maybe they *know* admin funding is causal but exclude it for liability reasons.
      *   *Compatibilism:* It is compatible with **Pragmatic Contextualism**. The form isn't making a metaphysical claim; it's making a utility claim (who can we fix tomorrow?).
      *   *Incompatibility:* It is *incompatible* with **Pure Counterfactualism** (which treats both equally) and **Process Theories** (which might struggle with omissions entirely, but if they accept omissions, they'd likely treat the lack of machine as a break in the process same as the lack of order).

  6.  **Design Changes (Task 4):**
      *   *If we switch to Pure Counterfactualism:* Both get marked "Causal." The form needs a weighting system (e.g., "Contributing Factor: Proximal" vs. "Contributing Factor: Distal").
      *   *If we switch to Systems Theory (Swiss Cheese):* The distinction disappears entirely. Both are "holes." The form becomes a timeline of latent and active failures without the causal/non-causal binary.

  7.  **Meta-Cognitive Constraints (Task 5 & 6):**
      *   *What changes my mind?* Evidence that the form is *not* making a causal claim but an *attribution of blame* claim. If the "Direct Causal Omission" box is actually shorthand for "Actionable Negligence," then it's not a theory of causation at all. It's a theory of liability.
      *   *Where does my reasoning fail?* I might be over-intellectualizing a bureaucratic form. Forms are often inconsistent. I might be assuming the form designers have a coherent philosophy when they might just be copying legal templates. I also risk conflating "causation" with "responsibility."

  8.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Terminology:* Use standard philosophy of causation terms (Counterfactual, Normative, Proximate Cause, Background Conditions).
      *   *Tone:* Analytical, precise, acknowledging the complexity.
      *   *Check the Prompt:* Did I answer the "what would change your mind" part explicitly? Yes. Did I address the "smuggling norms" question? Yes.

  9.  **Final Structure:**
      *   **Introduction:** Acknowledge the depth of the prompt.
      *   **Implicit Theory:** Normatively-Filtered Counterfactualism (Hart & Honoré influence).
      *   **Metaphysics vs. Norms:** Confirming the smuggling of norms.
      *   **Strict Requirement vs. Compatibility:** It's pragmatic, not strictly metaphysical. Compatible with Contextualism.
      *   **Design Implications:** How the form changes under Systems Theory or Pure Counterfactualism.
      *   **Meta-Cognitive Reflection:** What would change my mind (Liability vs. Causation distinction) and potential failure points (Bureaucratic incoherence).

  10. **Final Review against Constraints:**
      *   Avoid "not watering the plant." (Check: The example is hospital specific).
      *   Address the "Direct Causal Omission" vs "Systemic Context" distinction.
      *   Include the "Change My Mind" section.
      *   Include the "Reasoning Failure" section.

