  *(Refining the "Change My Mind" section)*: I need a specific piece of evidence. Interview data from the form designers? A legend on the form defining "causal" as "actionable"? Let's go with the definition of terms. If "causal" is defined operationally as "amenable to immediate individual correction," then it's not a causal theory, it's an intervention theory.

  *(Refining "Reasoning Failure")*: The biggest risk is the "Intentional Stance." I am assuming the form is coherent. It might just be legacy clutter.

