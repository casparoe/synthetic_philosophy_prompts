  # JOINT STATEMENT ON THE HOLOCAUST, MODERNITY, AND COMPARABILITY
  **An Adversarial Collaboration Protocol**

  **Date:** October 26, 2023
  **Participating Camps:** The Particularist Camp; The Structural-Modernist Camp

  ## PREAMBLE

  This document records the outcomes of an adversarial collaboration between two distinct scholarly orientations regarding the historical and theoretical status of the Holocaust. The **Particularist Camp** maintains that the Holocaust possesses a causal and moral singularity derived from the convergence of modern state capacity with a biological-racial ideology aimed at total extermination. The **Structural-Modernist Camp** maintains that the Holocaust represents an extreme but intelligible manifestation of modern organizational logic, rendering it structurally comparable to other modern mass atrocities.

  Both camps acknowledge that this dispute is not merely empirical but concerns the taxonomy of historical events and the moral implications of their classification. The following sections delineate our shared commitments, our irreducible disagreements, and the specific conceptual cruxes that determine the trajectory of our respective arguments.

  ---

  ## I. AGREED CLAIMS AND SETTLED HISTORICAL POINTS

  The undersigned camps affirm the following propositions as the baseline for further inquiry. We distinguish between settled historical facts and contested theoretical interpretations. We explicitly acknowledge that neither camp's interpretive framework represents the consensus of the field; rather, these points represent the common ground upon which our disagreement rests.

  1.  **Rejection of Denialism and Minimization:** Both camps unequivocally reject Holocaust denial, distortion, and minimization. The systematic murder of six million Jews, along with millions of other victims including Roma, disabled persons, and political opponents, is an established historical fact.
  2.  **The Bureaucratic Nature of Perpetration:** It is a settled historical point that the Holocaust was administered through modern state bureaucracies, utilizing rail networks, census data, legal frameworks, and industrial technologies. Both camps agree that the Shoah was not solely the result of spontaneous mob violence or the singular will of one individual, but required complex administrative coordination.
  3.  **Rejection of Monocausality:** Both camps reject monocausal explanations. We agree that neither "eternal antisemitism," "modern rationality," "economic crisis," nor "Hitler's will" alone suffices as a sufficient cause. The event emerged from a confluence of ideological, structural, and situational factors.
  4.  **Nature of the Dispute:** We agree that the debate over uniqueness and comparability is not solely a dispute over empirical history but is simultaneously a dispute over **causal explanation** (what mechanisms produce genocide) and **moral classification** (how we ought to remember and categorize the event).
  5.  **Legacy of the *Historikerstreit*:** We acknowledge the legacy of the German *Historikerstreit* (historians' dispute) of the 1980s. Both camps agree that attempts to normalize the Holocaust through comparison can risk political apologetics, while attempts to isolate the Holocaust through uniqueness claims can risk rendering it a theological or ahistorical anomaly. We commit to distinguishing between legitimate structural comparison and political normalization.
  6.  **Modernity as a Condition:** Both camps agree that the Holocaust occurred within the context of modernity. We disagree, however, on whether modernity was the *generative mechanism* of the violence (Structural-Modernist) or the *instrumental vessel* for a unique ideological pathogen (Particularist).

  ---

  ## II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines specific points where the camps diverge. The wording in the "Position Statement" column reflects the phrasing that the owning camp finds accurate and defensible.

  | ID | Point of Contention | Owning Camp | Position Statement (Wording accepted by owning camp) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Criteria for Comparability** | **Structural-Modernist** | "Comparability requires structural analogy in organizational mechanism, not causal homogeneity in ideological content. Different ideological ends do not preclude comparison if the bureaucratic means and rationalities are isomorphic." |
  | **D2** | **Criteria for Comparability** | **Particularist** | "Comparability requires causal homogeneity in perpetrator intent and victim selection criteria. Structural similarities in administration are insufficient for analogy if the ideological teleology (e.g., biological total extermination) differs fundamentally." |
  | **D3** | **Function of Uniqueness** | **Particularist** | "The uniqueness claim functions as a necessary historiographical boundary condition and a moral prohibition on analogical reasoning that would dilute the specific ontological status of the Jewish genocide." |
  | **D4** | **Function of Uniqueness** | **Structural-Modernist** | "The uniqueness claim functions as a barrier to sociological learning. Insisting on incomparability obscures the recurring systemic dangers of modern rationality and impedes the prevention of future atrocities." |
  | **D5** | **Role of Ideology** | **Particularist** | "Ideology is the independent variable that directs bureaucratic power. Without the specific biological-racial imperative, the bureaucratic apparatus would not have produced the Holocaust." |
  | **D6** | **Role of Ideology** | **Structural-Modernist** | "Ideology is a dependent variable or content that fills the structural form. The bureaucratic apparatus possesses an internal logic of efficiency and distancing that can generate atrocity regardless of specific ideological content." |

  ---

  ## III. CONCEPTUAL CRUXES AND PREDICTED JUDGMENTS

  The following cruxes identify sub-questions where empirical or theoretical resolution would significantly alter the weight of one camp's argument. For each crux, we stipulate a concrete case or conceptual distinction and record the predicted judgment of each camp.

  ### Crux 1: Bureaucratic Distancing vs. Ideological Dehumanization
  **Question:** Can bureaucratic distancing (the psychological and organizational separation of the perpetrator from the victim) be analytically separated from ideological dehumanization in explaining perpetrator behavior?

  *   **Concrete Case:** The behavior of mid-level administrators in the Reich Security Main Office (RSHA) compared to mid-level administrators in colonial genocides (e.g., German South West Africa).
  *   **Particularist Predicted Judgment:** Distancing is an *amplifier* but not a *cause*. Without the specific Nazi ideological framing of the Jew as a metaphysical threat requiring total removal, bureaucratic distancing would have resulted in expulsion or segregation, not industrial extermination. Therefore, the two cannot be separated in explanation.
  *   **Structural-Modernist Predicted Judgment:** Distancing is a *sufficient structural condition* for mass killing when combined with state power. Ideology provides the justification, but the bureaucratic structure allows ordinary individuals to bypass moral inhibitions. Therefore, they can be separated; the mechanism of distancing operates independently of the specific content of the hate.

  ### Crux 2: The Concept of Modernity and Ideological Instantiation
  **Question:** Can the concept of "modernity" be separated from its particular ideological instantiations without losing explanatory power?

  *   **Concrete Case:** A comparative analysis of the Holocaust and the Great Purge under Stalin. Both utilized modern bureaucracy, terror, and mass murder.
  *   **Particularist Predicted Judgment:** Separating modernity from ideology renders the concept vacuous. The Holocaust was driven by a racial-biological imperative distinct from the class-political imperative of the Soviet Union. To merge them under "modernity" obscures the specific causal role of antisemitic racial theory.
  *   **Structural-Modernist Predicted Judgment:** Modernity retains explanatory power as a structural framework. While ideologies differ, the reliance on instrumental rationality, the categorization of populations, and the use of state violence to engineer society are shared features. Separating the structure from the content allows us to identify the "risk profile" of modern governance itself.

  ### Crux 3: Moral Uniqueness vs. Causal Uniqueness (The Constructed Administrative Test)
  **Question:** Does moral uniqueness imply causal uniqueness, or can these dimensions come apart? Specifically, could an atrocity share the Holocaust's causal structure without sharing its moral particularity?

  *   **Constructed Test Case:** Both camps evaluate the following hypothetical scenario:
      > *A modern administrative apparatus operates with full bureaucratic rationality, legalistic cover, and organizational distancing. It engages in mass death and displacement on an industrial scale. However, its motivation is strictly resource extraction and territorial consolidation (geopolitical realism), explicitly rejecting biological-racial extermination as a goal. Victims are selected based on location and utility, not ontological status.*

  *   **Particularist Predicted Judgment:** **Undermines Position.**
      *   *Reasoning:* If this hypothetical case is judged structurally analogous to the Holocaust, it validates the Modernist claim that bureaucracy is the primary driver. The Particularist camp argues this case is *not* analogous. The absence of biological-racial total extermination intent makes it a different *kind* of event (e.g., brutal imperialism vs. genocide). If scholars accept this as analogous, the Particularist claim that intent defines the event is weakened.
  *   **Structural-Modernist Predicted Judgment:** **Supports Position.**
      *   *Reasoning:* If this hypothetical case produces outcomes mechanically similar to the Holocaust (mass death via bureaucracy), it validates the Modernist claim that the *structure* is the danger, not the specific ideology. The Modernist camp argues this case *is* analogous in mechanism. Recognizing this analogy demonstrates that the "Holocaust structure" is replicable without the "Holocaust ideology," proving that modernity itself carries the systemic risk.

  ---

  ## IV. COMMITMENT TO ONGOING DIALOGUE

  By signing this protocol, both camps commit to engaging with the Cruxes above without resorting to rhetorical dismissal. We acknowledge that the Particularist Camp prioritizes the preservation of the Holocaust's specific historical memory against dilution, while the Structural-Modernist Camp prioritizes the extraction of generalizable sociological warnings against recurrence. We agree that these goals are not necessarily mutually exclusive, though our current theoretical frameworks render them in tension. Future collaboration will focus on testing the Constructed Administrative Test against historical cases of colonial violence and totalitarian policing to refine our causal models.

  **Signed,**

  *Representatives of the Particularist Camp*
  *Representatives of the Structural-Modernist Camp*
