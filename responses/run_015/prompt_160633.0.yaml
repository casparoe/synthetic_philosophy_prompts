  # Take-Home Assignment: Analogy on the Ring

  **Course:** Seminar on Analogy and Conceptual Fluidity  
  **Time:** 48 Hours  
  **Word Limit:** 1200 words maximum  
  **Marks:** 25  

  **Domain:**  
  Objects are necklaces: beads on a closed loop, each carrying a letter from $\{a, b, c, d\}$. Notation $\langle x_1 \dots x_n \rangle$ lists beads clockwise. Necklaces are rotationally invariant: $\langle a b c \rangle = \langle b c a \rangle$.  
  Successor relation wraps: $a \to b \to c \to d \to a$.  
  Analogy items provide example pair(s) $A \to B$ and ask for $C \to ?$.

  **The Items:**  
  1. $\langle a b c \rangle \to \langle a b d \rangle$, so $\langle d a b \rangle \to ?$  
     *Human Labels:* $\langle d a c \rangle$ (fix broken successor) vs. $\langle a a b \rangle$ (advance max bead).  
  2. $\langle a b c \rangle \to \langle a b d \rangle$, so $\langle b c d \rangle \to ?$  
     *Human Labels:* Both say $\langle b c a \rangle$, but cite different rules.  
  3. $\langle a b c d \rangle \to ?$  
     *Human Labels:* $\langle b c d a \rangle$ (identity via rotation) vs. "no answer" vs. $\langle a b c a \rangle$ (advance max).

  **Task:**  
  Write a memo adjudicating these items. You must:  
  1.  Distinguish three states: (i) genuine conceptual slippage, (ii) descriptive equivalence (different rules, same output), and (iii) underdetermination (items that do not determine an answer). Classify Items 1–3 accordingly.  
  2.  Explain when adding a third example pair disambiguates an item and when it fails.  
  3.  Address Item 3: Is "no answer" legitimate when the rule yields a rotationally equivalent state?  
  4.  Propose an answer key strategy (single key, multiple keys, or grade the rule?) and justify its implications for scoring our prototype model.  

  Do not rely on seminar jargon (e.g., "slippage", "temperature") without defining its operational meaning in this ring domain.

  ***

  # Model Answer

  **Memo: Adjudication of Ring-Domain Analogy Items**

  **1. Diagnostic Classification**
  To evaluate these items, we must distinguish three failure modes in rule induction. **Conceptual Slippage** occurs when the domain constraints allow multiple valid mappings that humans intuitively rank differently. **Descriptive Equivalence** occurs when distinct rules converge on the same output string, masking underlying disagreement. **Underdetermination** occurs when the provided examples are insufficient to constrain the hypothesis space to a single rule.

  Item 1 ($\langle a b c \rangle \to \langle a b d \rangle$, so $\langle d a b \rangle \to ?$) is **Underdetermined**. The example pair supports at least two distinct rules: "advance the bead violating the successor chain" and "advance the alphabetically maximal bead." In the source $\langle a b c \rangle$, the maximal bead ($c$) is also the one that would violate the chain if advanced to $d$ (breaking $c \to a$). Because these features co-occur, the example does not force a choice. In the target $\langle d a b \rangle$, the features diverge: the maximal bead is $d$, but the successor chain is unbroken (due to wrapping $d \to a \to b$). Thus, the rules produce different outputs ($\langle a a b \rangle$ vs. $\langle d a c \rangle$). This is not slippage; it is a lack of constraints.

  Item 2 ($\langle b c d \rangle \to ?$) exhibits **Descriptive Equivalence**. Humans agree on the output $\langle b c a \rangle$ but derive it via different rules (e.g., "advance max" vs. "advance successor of max"). Here, the domain structure forces convergence. This item is valid for testing output accuracy but invalid for testing rule induction.

  Item 3 ($\langle a b c d \rangle \to ?$) presents a boundary case of **Identity**. The rule "advance all beads" yields $\langle b c d a \rangle$, which is rotationally equivalent to the input. Whether this counts as a transformation depends on whether we track extensional state (the necklace shape) or intensional history (the operation performed).

  **2. Disambiguation via Examples**
  Adding a third example pair disambiguates Item 1 only if it acts as a **critical experiment**. To separate "advance max" from "fix broken successor," the new example must feature a necklace where the maximal bead does not coincide with the successor violation. For instance, $\langle a c d \rangle \to \langle a c a \rangle$ (advancing max $d$) versus $\langle a c d \rangle \to \langle a d d \rangle$ (fixing break at $c$). If the new example preserves the correlation (e.g., $\langle a b d \rangle \to \langle a b a \rangle$), it fails to disambiguate because both rules still predict the same output. Disambiguation requires orthogonalizing the features that were conflated in the first example.

  **3. The Identity Case (Item 3)**
  "No answer" is not a legitimate response if the goal is to test rule application. The rule "advance every bead" is well-defined. The fact that the output state is rotationally equivalent to the input is a property of the domain's symmetry, not a failure of the rule. Accepting "no answer" privileges extensional equality over intensional transformation. However, if the task is defined as "produce a *distinct* necklace," then "no answer" is valid. Given the prompt defines objects as necklaces (where rotation = equality), the output $\langle b c d a \rangle$ is the same object as the input. Therefore, the most rigorous answer is to acknowledge the transformation occurred but resulted in an identity mapping. Marking $\langle b c d a \rangle$ as correct requires accepting that students may write a string that looks different but denotes the same object.

  **4. Answer Key and Model Scoring**
  A single string key is insufficient for this domain. For Item 1, the key must accept multiple strings weighted by the plausibility of the underlying rule, or better, **grade the rule justification**. If a student (or model) outputs $\langle a a b \rangle$ and justifies it with "advance max," they should receive full credit. If they output the correct string for the wrong reason (luck), credit should be reduced.

  For model evaluation, this implies we cannot use simple accuracy metrics. If human labelers disagree (Item 1), the "ground truth" is a distribution, not a point. A model predicting the minority human answer should not be penalized as heavily as one predicting an impossible string. We should score models on **rule consistency** across items rather than string matching on ambiguous items. If a model consistently applies "advance max" across Items 1, 2, and 3, it demonstrates coherent reasoning even if it mismatches the majority vote on Item 1. Consequently, the eval suite should include "diagnostic items" specifically designed to orthogonalize rules, rather than relying on naturalistic ambiguity.

  **Conclusion**
  Item 1 requires additional examples to resolve underdetermination. Item 2 is useful for output validation but not rule transparency. Item 3 requires accepting identity transformations as valid outputs. The answer key must capture rule justification, and model scoring must account for human disagreement distributions rather than enforcing a single gold standard.

  ***

  # Marking Scheme (25 Marks)

  1.  **Conceptual Distinctions (5 marks):** Clearly defines Underdetermination, Descriptive Equivalence, and Slippage/Identity in the context of the ring domain.
      *   *Fail:* Uses jargon without applying it to the specific bead configurations.
  2.  **Item 1 Diagnosis (5 marks):** Identifies Item 1 as underdetermined because features (max bead vs. broken chain) co-occur in the example but diverge in the target.
      *   *Fail:* Claims one human is simply "wrong" without analyzing the rule conflict.
  3.  **Disambiguation Condition (5 marks):** Explains that added examples only help if they orthogonalize the competing rules (critical experiment).
      *   *Fail:* Suggests adding *any* example helps, or fails to specify the required feature separation.
  4.  **Item 3 Identity (5 marks):** Argues that "no answer" is invalid if the rule is well-defined, acknowledging the tension between state equality and operation history.
      *   *Fail:* Dismisses the identity case as a "glitch" or insists strictly on string difference.
  5.  **Evaluation Strategy (5 marks):** Proposes grading rules/justifications rather than strings, and advocates for distributional scoring for models given human disagreement.
      *   *Fail:* Insists on a single gold-standard key despite proven human ambiguity.

  ***

  # Confidence Note

  I am moderately confident in this diagnosis, particularly regarding the underdetermination in Item 1 and the necessity of rule-based grading. The claim I am least sure of concerns Item 3: whether an identity transformation ($\langle a b c d \rangle \to \langle b c d a \rangle$) should be marked correct in a task implicitly demanding change. While logically sound (the rule was applied), pedagogically it may confuse students who equate "analogy" with "difference." If the task framing implies novelty, "no answer" might be the pragmatic correct choice, contradicting my intensional argument.
