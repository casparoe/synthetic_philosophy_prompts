answer: |-
  **Exam Question**

  **Course:** Seminar on Rationality and Strategic Reasoning
  **Time Limit:** 75 Minutes
  **Total Marks:** 25

  **Question 1: The Reflective Allocation Problem**

  Consider the **Reflective Allocation Problem (RAP)**. Three agents ($A_1, A_2, A_3$) must divide a non-transferable resource. Each agent possesses structurally identical reasoning capacities and knows this fact. However, full Common Knowledge of Rationality (CKR) is absent. Each agent can observe the others' *preliminary* reasoning steps (draft calculations, heuristic checks) but cannot observe their *final* commitments before submitting their own claim.

  Standard game-theoretic rationality predicts competitive defection (maximizing individual claim regardless of the others), assuming causal independence between choices. Superrationality, conversely, suggests a cooperative division based on logical correlation between identical reasoners.

  Write an essay addressing the following:
  1.  Explain why superrational reasoning recommends cooperative division in the RAP despite the standard prediction of defection.
  2.  Pinpoint exactly how the absence of Common Knowledge of Rationality weakens the superrational argument without collapsing it back into ordinary expected-utility reasoning.

  In your analysis, you must distinguish between *agent-identification* (recognizing identical logic) and *belief-attribution* (knowing what others believe about your logic). Explain why symmetric reasoning does not necessarily entail symmetric beliefs in this specific epistemic environment, and demonstrate how the failure of common knowledge disrupts the *iterative justification* for cooperation rather than the *first-order choice* to cooperate.

  ***

  **Model Answer**

  In the Reflective Allocation Problem (RAP), standard game theory dictates defection because it treats agents as causally isolated. My choice cannot physically alter yours; therefore, I maximize utility by claiming the maximum resource, assuming you do the same. This leads to a Nash equilibrium of competitive over-claiming. Superrationality challenges this by positing that when agents are structurally identical, their decisions are not causally linked but *logically correlated*. If I am running algorithm $X$ to decide my claim, and I know you are running algorithm $X$, then my output is evidence of your output. To choose cooperation is to vote for the algorithm that outputs cooperation; since we run the same code, we likely output the same move. Thus, superrationality recommends cooperative division to avoid the suboptimal equilibrium of mutual defection.

  However, the RAP introduces a critical epistemic constraint: agents observe preliminary steps but lack Common Knowledge of Rationality (CKR). This absence weakens the superrational argument significantly, though it does not destroy it. To understand why, one must distinguish between *agent-identification* and *belief-attribution*. Agent-identification is the objective fact that $A_1, A_2,$ and $A_3$ share identical reasoning structures. Belief-attribution concerns what $A_1$ believes $A_2$ believes about $A_1$'s reasoning. In standard superrational models, CKR ensures that agent-identification automatically translates into symmetric beliefs: I know you know I know we are identical. In the RAP, because final commitments are hidden, I cannot be certain that you have successfully identified my reasoning as identical to yours based solely on preliminary steps.

  Consequently, symmetric reasoning does not entail symmetric beliefs. Even if we all reason identically (first-order symmetry), I may doubt whether you believe *I* am reasoning identically (second-order asymmetry). I might think, "I know we are identical, but does she know that I know?" This breaks the infinite recursion required for a robust superrational equilibrium. Without CKR, the logical correlation becomes probabilistic rather than certain. I cannot treat your choice as a logical mirror of mine with probability 1; I must assign a probability $p < 1$ to the likelihood that you are successfully mirroring my superrational logic.

  This is where the argument weakens without collapsing. The collapse into ordinary expected-utility reasoning would occur if the lack of CKR made the logical correlation irrelevant, forcing me to treat your choice as independent noise. However, the structural identity remains a first-order fact. Even without infinite recursive knowledge, the objective similarity of our cognitive architectures provides a strong prior that our outputs will correlate. The failure of common knowledge disrupts the *iterative justification*—I cannot justify cooperation by assuming you are definitely justifying cooperation based on my justification—but it leaves the *first-order choice* intact. I still have a higher expected utility from cooperating than defecting, provided the probability of correlation remains above a specific threshold. Thus, in the RAP, superrationality survives as a high-risk, high-reward heuristic rather than a guaranteed equilibrium, distinguishing it from both standard rationality (which ignores correlation) and ideal superrationality (which assumes guaranteed correlation).

  ***

  **Marking Scheme**

  **Total Marks:** 25
  **Time Limit:** 75 Minutes

  **Grade Boundaries & Required Moves**

  **A Range (20–25 Marks):**
  *   **Standard vs. Superrational Baseline (5 Marks):** Clearly articulates that standard rationality relies on causal independence (Nash), while superrationality relies on logical correlation of identical algorithms.
  *   **Agent-Identification vs. Belief-Attribution (7 Marks):** Explicitly distinguishes between the objective fact of identical reasoning (identification) and the epistemic state regarding what others know about that reasoning (attribution). Explains that in the RAP, identification is present but attribution is incomplete.
  *   **Symmetric Reasoning $\neq$ Symmetric Beliefs (5 Marks):** Demonstrates understanding that agents can use the same logic but hold different beliefs about the *commonality* of that logic due to the information gap.
  *   **Iterative vs. First-Order Disruption (8 Marks):** Precisely locates the damage of missing Common Knowledge of Rationality (CKR). Must argue that CKR failure breaks the *infinite recursion* (iterative justification) but does not eliminate the *initial probability* of correlation (first-order choice). Explains why this prevents collapse into standard expected utility.

  **B Range (15–19 Marks):**
  *   Identifies the basic tension between Nash equilibrium and superrational cooperation.
  *   Acknowledges that missing Common Knowledge is a problem but treats it vaguely (e.g., "it makes things uncertain" without explaining the hierarchy of beliefs).
  *   Fails to clearly distinguish between reasoning symmetry and belief symmetry.
  *   Correctly notes that superrationality does not fully collapse but cannot explain the mechanism (first-order vs. iterative) clearly.

  **C Range (10–14 Marks):**
  *   Summarizes Hofstadter's definition without applying it to the specific constraints of the RAP.
  *   Treats the scenario as a standard Prisoner's Dilemma.
  *   Confuses the lack of communication with the lack of common knowledge.

  **Specific Errors (Deductions applied within categories):**
  1.  **Conflating Superrationality with Altruism (-5 Marks):** If the student argues agents cooperate because they "care" about others rather than because of logical correlation/maximization of self-interest via correlation.
  2.  **Irrelevance of Missing CKR (-5 Marks):** If the student argues that because agents are individually rational, the lack of common knowledge is irrelevant to the outcome.

  **Breakdown of Marks:**
  1.  **Conceptual Baseline (Standard vs. Super):** /5
  2.  **Epistemic Distinction (Identification vs. Attribution):** /7
  3.  **CKR Analysis (Iterative vs. First-Order):** /8
  4.  **Avoidance of Specific Errors:** /5 (Deductions only)
