answer: |-
  ### Executive Summary: The Dependency Chain
  **Do not teach Sunk/Opportunity cost first.** If you define the fallacy before the experience, students treat it as a moral failing ("they should have known better").
  **The Chain:** Visceral Intuition $\rightarrow$ The "Lesser Evil" Calculation $\rightarrow$ **Locally Rational/Global Catastrophe** (The Pivot) $\rightarrow$ Formal Cost Logic $\rightarrow$ Boundary Setting.

  **The Example Criteria:**
  To ensure they blame the *structure* and not *personality*, your carrying example must **have**:
  1.  **Sequential Moves:** Player B sees Player A's move before acting (rules out Prisoner's Dilemma).
  2.  **Irreversibility:** Once a bid/budget is spent, it cannot be returned (creates the trap).
  3.  **Perfect Information:** Everyone knows the pot size and current bid (removes "mistake" as an excuse).
  4.  **Competitive Exclusion:** Only one winner; the loser pays without reward (creates the threat).

  It must **lack**:
  1.  **Interpersonal Animosity:** The bidders shouldn't hate each other (removes "spite" as an explanation).
  2.  **Communication Channels:** No ability to collude or signal intent beforehand (removes Abilene/Coordination solutions).
  3.  **Ambiguous Goals:** The value of the prize is fixed and known (removes "disagreement on value" as an excuse).

  *Recommendation:* Use the **Dollar Auction** for the mechanical demonstration (it is the cleanest structural model), but immediately map it to the **Bureaucratic Budget** for the discussion. The Dollar Auction proves the logic; the Budget War proves the relevance.

  ---

  ### 50-Minute Teaching Arc

  #### 0:00–0:10 | The Visceral Hook (No Theory Yet)
  *   **Activity:** Run a live, low-stakes Dollar Auction (or vivid narration if logistics fail). Cap bids at $5.00 to prevent actual financial harm, but enforce the rule: *Second highest bidder pays their bid and gets nothing.*
  *   **Observation:** Stop the auction when bids exceed $1.00 (e.g., $1.50 vs $1.40).
  *   **Prompt:** "Pause. The prize is worth $1.00. The current cost is $2.90 combined. Why did the bidder at $1.40 just raise to $1.50? Did they forget arithmetic?"
  *   **Goal:** Elicit the feeling of *necessity*. They didn't bid to win; they bid to avoid losing $1.40 for nothing.

  #### 0:10–0:20 | The Mechanism & The Pivot
  *   **Discussion:** Walk through the decision tree of the $1.40 bidder.
      *   Option A: Quit. Pay $1.40, get $0. Net: -$1.40.
      *   Option B: Bid $1.50. If opponent quits, Pay $1.50, get $1.00. Net: -$0.50.
  *   **The Pivot (Minute 15):** Drop the core thesis here. **"This is not irrational behavior. This is locally rational, globally catastrophic."**
      *   *Locally Rational:* Given the *current* state, bidding $1.50 is mathematically superior to quitting.
      *   *Globally Catastrophic:* The *system* guarantees a net loss for the group.
  *   **Why here?** If you wait until the end, they view the bidders as fools. If you say it now, you reframe them as victims of the incentive structure.

  #### 0:20–0:30 | Formalizing the Costs
  *   **Concept Introduction:** Now introduce **Sunk Cost** vs. **Opportunity Cost**.
  *   **Application:**
      *   The $1.40 is a *Sunk Cost*. It is gone regardless of the next move.
      *   The bidder is *not* ignoring the sunk cost; they are haunted by it.
      *   The *Opportunity Cost* of quitting is realizing the loss immediately. The Opportunity Cost of bidding is the *risk* of further escalation.
  *   **Philosophical Angle:** Rationality is usually defined as maximizing utility. Here, rationality (minimizing loss round-by-round) drives utility to negative infinity. Ask: "Is a decision rational if it follows logical rules but destroys the agent?"

  #### 0:30–0:40 | Killing Misconceptions (Boundary Work)
  *   **Prisoner's Dilemma (Kill at 0:32):**
      *   *Student Objection:* "It's just a Prisoner's Dilemma."
      *   *Correction:* PD is **simultaneous** and **one-shot**. You defect without knowing the other's move. The Dollar Auction is **sequential** and **iterative**. You see the trap close *after* you step in. In PD, you are betrayed; here, you volunteer.
  *   **Loss Aversion (Kill at 0:35):**
      *   *Student Objection:* "They're just loss-averse / emotional."
      *   *Correction:* Loss aversion is a psychological bias (valuing a loss more than a gain). This trap works even for cold calculators. If the math says "-$0.50 is better than -$1.40," a robot makes the same bid. It is structural, not psychological.
  *   **Abilene Paradox (Kill at 0:38):**
      *   *Student Objection:* "It's like the Abilene Paradox (group goes along with what no one wants)."
      *   *Correction:* Abilene is about **false consensus** and lack of communication (everyone thinks the others want to go). Here, there is **open conflict**. Both bidders explicitly want to stop, but cannot coordinate a ceasefire because the rules punish the first person to lower their hand.

  #### 0:40–0:50 | Application & Assessment
  *   **Transfer:** Briefly map the Dollar Auction logic to the Bureaucratic Budget War.
      *   *Prize:* Departmental prestige/survival.
      *   *Bids:* Annual budget requests.
      *   *Second Place:* Wasted man-hours on a cancelled project.
  *   **The Exit Question (See below).**
  *   **Refusal:** Explicitly state what you are *not* covering to keep the focus on decision logic.

  ---

  ### The "Kill Zones" for Misconceptions
  *   **Prisoner's Dilemma:** Kill in the **Mechanism** phase. Emphasize *time*. PD is a snapshot; Escalation is a movie.
  *   **Loss Aversion:** Kill in the **Formalizing** phase. Emphasize *calculation*. Show that the "emotional" move is also the "mathematical" move in the short term.
  *   **Abilene Paradox:** Kill in the **Application** phase. Emphasize *communication*. Abilene is solved by talking; Escalation persists *even if* they talk (because the threat of being the sucker remains).

  ### Where to Drop "Locally Rational / Globally Catastrophic"
  **Minute 15.**
  This is the hinge of the session. You have just shown them the math of the $1.40 bidder. They feel the trap. Before you give them the vocabulary (Sunk Cost) to explain it away, you must stamp the structural insight.
  *   *Phrasing:* "If you were that bidder, you would bid $1.50 too. There is no other move that makes sense in that moment. The tragedy is not that they are irrational; it is that rationality itself is the engine of the disaster."

  ### The End-of-Session Assessment Question
  Do not ask: "What is the sunk cost fallacy?"
  **Ask:** "Imagine a peace treaty negotiation. Country A has spent 1,000 lives taking a worthless hill. Country B threatens to retake it. Country A considers sending 100 more lives to hold it. Under what specific structural conditions is sending the 100 lives the *rational* decision, even if the hill is worthless?"
  *   *Correct Answer:* When the cost of withdrawal (political collapse/loss of 1,000 lives in vain) exceeds the cost of continuation (100 lives), *and* the withdrawal cost is triggered immediately by stopping.
  *   *What this tests:* It tests if they understand the **comparative loss structure**, not just the label "sunk cost."

  ### What to Openly Refuse to Explain
  **Payoff Matrices and Nash Equilibria.**
  *   *Why:* Philosophy undergrads will instinctively reach for formal game theory to "solve" the problem.
  *   *The Refusal:* "We are not solving for equilibrium today. We are analyzing the decision logic of the trapped agent. Game theory tells us where the system settles; Decision Theory tells us why the agent walks there. We are studying the walk, not the destination."
  *   *Safety Net:* Assure them that this doesn't mean game theory is wrong, but that it obscures the *phenomenology* of the trap (the feeling of having no choice) which is the philosophical core of the session.
