answer: |-
  The configuration you describe sits at the fault line of one of the most active debates in contemporary philosophy of mind. To answer you directly: **No single established term captures the specific conjunction of feelings you describe**, particularly the reversal where a collaborator's file feels more "yours" than your own past drafts. However, the components of your experience are well-mapped.

  The theory you are testing is the **Extended Mind Thesis (EMT)**, proposed by Andy Clark and David Chalmers (1998). Your ledger is the exact equivalent of "Otto's Notebook" in their famous thought experiment. The conditions you list (reliability, access, endorsement, history) are the **"Glue and Trust"** conditions used to argue that the notebook is functionally part of the cognitive system.

  The feeling that it is *not* yours, despite meeting these conditions, is known as the **Phenomenological Objection** to the Extended Mind.

  Here is the breakdown of your specific queries, followed by the naming and definition you requested.

  ### 1. Is this an objection or beside the point?
  This depends entirely on which camp of philosophy you ask.
  *   **The Functionalist (Clark/Chalmers):** They would say your feeling is **beside the point**. For them, "mind" is defined by what a system *does*, not how it *feels*. If the ledger plays the same causal role as biological memory, it *is* part of the mind, regardless of whether it feels like "you." They would argue your intuition is a bias they call "skin-bag chauvinism."
  *   **The Phenomenologist (Zahavi, Gallagher, Matthews):** They would say this is a **decisive objection**. They argue that cognition is essentially embodied and experienced. If a process lacks the "sense of mineness" (the phenomenological quality of ownership), it cannot be constitutive of the self, only instrumental to it.

  ### 2. Which condition is meant to carry ownership?
  **None of them.** This is the crux of the disconnect.
  The four conditions you listed (availability, access, endorsement, history) are criteria for **functional integration**, not **ontological ownership**. EMT argues these conditions make the ledger part of the *vehicle* of thought, but they do not claim it makes the ledger part of the *self*.
  Your case shows that **functional reliance does not entail phenomenological appropriation.** You can depend on a pacemaker or a pair of glasses without feeling they are "you." Your ledger is a **cognitive prosthesis** that has not been phenomenologically incorporated.

  ### 3. Can dependence and felt ownership come apart?
  **Yes.** Your description is a textbook case of **Instrumental Dependence without Phenomenological Ownership.**
  *   **Dependence:** You cannot finish the book without it (functional necessity).
  *   **Ownership:** You feel thwarted by it, not diminished (phenomenological alienation).
  This confirms that the "Extended Mind" might be real as a *system*, but the "Extended Self" is not automatically real as an *experience*. The boundary of the "I" is narrower than the boundary of the "Mind."

  ### 4. Where the line falls between Ledger and Reference Work
  If functional integration isn't the line, what is? In your case, the distinction lies in **Bidirectional Coupling**.
  *   **Reference Work:** You consult it to retrieve static data. It does not change based on your current thought process.
  *   **Your Ledger:** You update it; it constrains future writing; it is part of the *loop*.
  The line is not "mine vs. not mine," but **"coupled vs. consulted."** Both are external, but the ledger is *structurally integrated* into your workflow. The fact that it still feels external suggests that **structural coupling is insufficient for the sense of self.**

  ### 5. What are the unrecognizable early drafts a case of?
  This is **Diachronic Disidentification** (or **Diachronic Estrangement**).
  It suggests that your sense of ownership is not based on **Historical Origin** (I wrote this), but on **Current Functional Relevance**.
  *   **The Drafts:** They are artifacts of a past cognitive state that no longer exists. You have psychologically discontinuous from the "self" that wrote them.
  *   **The Collaborator's File:** It represents the *current* state of the project. It is actively constraining your *current* choices.
  This implies your sense of "mine" is **Synchronous** (what is acting on me now) rather than **Diachronic** (what I produced in the past). You identify with the *current system of production* (you + collaborator + file) rather than the *historical author*.

  ***

  ### The Phenomenon: Name and Definition

  While the components (EMT, Phenomenological Objection, Diachronic Discontinuity) are established, the specific configuration you describe—where high functional integration coexists with low felt ownership, and where external synchronous constraints feel more "self" than internal historical productions—lacks a specific label.

  Per your request, I propose the following designation:

  **Name:** **The Alienated Scaffold**

  **Definition:** A cognitive state in which an external artifact meets all functional criteria for mental incorporation (reliability, access, trust, history) yet fails to generate a phenomenological sense of ownership ("mineness"), while simultaneously, external synchronous constraints (e.g., a collaborator's notes) generate a stronger sense of agency than one's own diachronic internal productions (e.g., past drafts).

  **Boundary Cases:**
  1.  **The Prosthetic Limb:** A user relies on a robotic arm for all daily tasks (functional integration) but reports it never feels like "flesh" (alienated scaffold), whereas a therapist's guiding hand during rehab feels more "correct" than their own unassisted movement (synchronous ownership).
  2.  **The GPS Navigator:** A driver follows GPS instructions implicitly for years (dependence) but blames the device entirely when it leads them astray (alienation), yet feels more "in control" when a co-pilot gives directions based on live traffic (synchronous coupling) than when following their own pre-planned route (diachronic plan).
  3.  **The Actor's Script:** An actor memorizes lines until they are automatic (functional integration) but feels the words are "the playwright's" (alienation), yet feels a scene partner's improvised reaction is more "the truth of the moment" than their own rehearsed blocking (synchronous ownership).

  **Why this fits your case:**
  It captures the asymmetry you identified. The ledger is a *scaffold*—essential for holding up the structure of the novel—but it remains *alienated* from the self. Meanwhile, the "self" you recognize is not the historical author of the drafts, but the current node in a network of constraints (including the collaborator). This suggests that for you, **ownership is a property of present-moment coupling, not past authorship.**
