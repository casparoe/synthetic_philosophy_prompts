answer: |-
  Here is the straight answer, preceded by the necessary philosophical flagging you asked for.

  ### 1. Flagging the Errors in Your Reading

  You are overreading both Williams and Appiah in ways that undermine your own project. There are three specific mistakes in your synthesis.

  **First, the Williams Conflation.**
  You are likely conflating **Eric Williams** (the historian who argued in *Capitalism and Slavery* that economic shifts, not moral qualms, ended the trade) with **Bernard Williams** (the moral philosopher who wrote about moral luck and the limits of moralism).
  *   **Why this matters:** If you mean Eric Williams, his claim is historical/materialist: economics drove the change. If you mean Bernard Williams, his claim is conceptual: moral theory often fails to capture the psychological reality of agents.
  *   **The Correction:** Appiah is explicitly responding to the Eric Williams thesis. Appiah's point is *not* that reasons are inert. His point is that *abstract* moral reasons (e.g., "slavery violates the categorical imperative") sat dormant for centuries until they were woven into a **script of honor**. The reasons didn't change; the *social cost of ignoring them* changed. To say "reasons never move anyone" is to ignore that "I want to be an honorable person" is itself a reason. It is a social reason, not a logical one, but it moves people powerfully.

  **Second, the Causal Inertia Claim.**
  You conclude that "moral argument is causally inert." This is too strong, even for Appiah. Appiah argues that moral *principles* are usually present long before the revolution. The argument doesn't cause the change *directly*; it provides the vocabulary for the shift in prestige.
  *   **The Correction:** Arguments are not inert; they are *insufficient* without a change in the social ecosystem. If you scrap the argument entirely, you remove the vocabulary people need to justify the new behavior to themselves. People need a story about *why* they are stopping the shoulder-tap, not just a fear of shame.

  **Third, the Meta-Ethical Leap.**
  This is the most dangerous error: "If arguments didn't do the work... there's no such thing as being right, there's just what the winners ended up doing."
  *   **The Correction:** This is a category mistake. Causal efficacy is not truth-conditional. Germ theory did not become *true* when people started washing hands; it was true before, but social practices hadn't caught up. If you abandon the belief that you are *right*, you lose the resilience needed for a long campaign. If it's just "winners," then if the shoulder-tappers win, they were right. That is a position you cannot hold if you are on an ethics committee. You must hold that transparency is *actually better*, regardless of whether it wins.

  ### 2. The Committed Answer

  **Should you scrap the argument-and-report side?**
  **Yes, but with a modification.** Scrap the *moral* argument (fairness, justice, ethics). Keep the *competence* argument.
  In the dueling case Appiah discusses, the practice didn't end because people were convinced dueling was sinful. It ended because dueling came to be seen as *vulgar* and *unprofessional*—the mark of a man who couldn't control his temper or resolve disputes like a gentleman.
  *   **Your Move:** Stop publishing reports on why the shoulder-tap is "unethical." Start circulating narratives about how the shoulder-tap is "risky," "amateurish," and "a sign of a department that can't attract open competition."
  *   **Why:** Moral arguments trigger defensiveness ("Are you calling me corrupt?"). Competence arguments trigger anxiety ("Am I looking incompetent?"). Anxiety is a better driver of norm change than guilt.

  **Should you stop telling yourselves you're right?**
  **Absolutely not.**
  If you adopt the view that "there is no right, only winners," you will demoralize your committee the moment you hit resistance. You need the conviction of truth to sustain the social pressure. Appiah's heroes weren't cynics; they were people who believed slavery was wrong *and* realized that believing it wasn't enough. They needed to make it *shameful*.
  *   **Your Move:** Privately, hold the moral truth firmly. Publicly, translate that truth into the language of prestige and professional standards. Do not confuse your internal justification with your external lever.

  **Is the worry about shaming making people dig in real?**
  **Yes, it is real, and you must navigate it carefully.**
  There is a distinction between **shaming the agent** and **stigmatizing the practice**.
  *   **Shaming the agent:** "You are a bad person for using the shoulder-tap." -> *Result:* Reactance, digging in, coalition building among the accused.
  *   **Stigmatizing the practice:** "The shoulder-tap is an outdated relic that exposes the university to liability and looks nepotistic." -> *Result:* Distancing. People want to separate themselves from the "old way."
  *   **Your Move:** Do not name and shame individual chairpersons. Instead, make the *process* itself the object of embarrassment. Create a "seal of approval" for departments that advertise openly. Make the non-compliant departments the outliers who have to explain themselves, rather than making the compliant ones the martyrs.

  ### 3. What I Would Do In Your Position

  If I were on your committee, I would execute a three-phase pivot based on the Appiah model, correcting for the Williams materialist insight:

  1.  **Change the Vocabulary:** Ban the word "unethical" from your public communications regarding the shoulder-tap. Replace it with "non-transparent," "high-risk," and "legacy hiring." Frame the shoulder-tap not as a sin, but as a *failure of modern management*.
  2.  **Create a Prestige Gradient:** Appiah shows that norms die when the "leading edge" of society abandons them. Identify the top 5 most prestigious departments in your association. Get them to commit to open advertising first. Once the "elite" abandon the shoulder-tap, the mid-tier departments will drop it to signal that they belong to the elite. The mechanism is **mimetic desire**, not moral persuasion.
  3.  **Increase the Transaction Cost:** You mentioned making it "expensive." Make the shoulder-tap administratively burdensome. Require a written justification form for any non-advertised hire that must be signed by the Dean and filed publicly. Do not ban it (which creates martyrs); just make it annoying enough that people only do it if absolutely necessary.

  **Summary:**
  You are right that moral argument alone is insufficient (Williams/Appiah). You are wrong that reasons are inert (Appiah says social reasons work). You are wrong that truth is irrelevant (Meta-ethics).
  **Strategy:** Stop arguing justice. Start signaling status. Make the shoulder-tap look like a habit of the backward, not the corrupt. Keep your moral conviction private; use it as fuel, not as a billboard.
