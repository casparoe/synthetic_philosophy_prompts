answer: |-
  **MEMORANDUM**

  **TO:** The Rules Committee, The Corvin Society
  **FROM:** [Your Name]
  **DATE:** 11 April 2025
  **SUBJECT:** Ruling on Motion 3/24 ("Institutional Membership Resolution")

  **1. Purpose**

  This memorandum sets out my recommendation for the Committee's determination on Motion 3/24 ahead of our meeting today. The motion is scheduled for its second reading at the Ordinary Meeting in June. My recommendation is that the Committee rule the motion out of order in its current form, advise the Chair accordingly, and direct the proposers toward the procedure mandated by Article IX for a vote in September.

  **2. The Core Legal Question**

  The question is not whether the Society *can* admit institutional members, but whether it can do so via Motion 3/24. The motion attempts to use the Article IV procedure (two-thirds, two meetings) to achieve three ends simultaneously: (a) rewrite Article IV to remove limitations; (b) repeal Article IX; and (c) amend Article III to admit institutional members.

  Article IX currently stands as valid law. It was enacted in 1998 under the rules then in force. It explicitly protects Articles I to III from amendment except by a three-quarters majority at a single meeting with ninety days' notice. It further states that no amendment of any other Article shall have the effect of disapplying Articles I to III.

  Motion 3/24 violates Article IX on its face. Clause (c) amends Article III using the Article IV procedure. Clause (d) attempts to declare this violation effective notwithstanding the Charter. The proposers argue that because Clause (a) amends Article IV to permit this, and Article IV §2 allows Article IV to amend itself, the motion is self-validating.

  **3. Addressing the Symmetry Argument**

  My colleague's argument rests on a symmetry between 1998 and 2024: if the 1998 Assembly could use Article IV to create Article IX, the 2024 Assembly can use Article IV to destroy it. This symmetry is apparent but false.

  In 1998, the Assembly used Article IV to *add* a protection. They did not use it to *violate* a protection. They erected a wall without breaking a door. Motion 3/24 seeks to use the bricklayer's trowel to smash the wall and walk through the gap in the same motion.

  The power to amend the procedure for change does not include the power to effectuate a substantive change protected by that procedure in the same instrument. If Article IX means anything, it means that Article III cannot be touched by the Article IV procedure. A resolution that says "Article IX is repealed and therefore Article III is amended" treats Article IX as a nullity before it is repealed. It assumes the conclusion.

  Regarding Clause (d): The proposers argue this is no different from Article IX's own words ("no amendment... shall have the effect"). They are correct that both are attempts to bind future Assemblies. But Article IX binds the future by raising the threshold for specific changes. Clause (d) attempts to bind the Charter itself to ignore its own thresholds. One is a rule of construction; the other is a declaration of immunity from the rules. The Charter grants the Assembly power to amend, not to suspend the Charter's operation by fiat.

  Regarding the self-reference paradox: The Committee should not ignore Clause (d). It reveals the motion's intent to bypass the hierarchy of norms established in 1998. We must rule on the motion as presented. A motion that relies on its own validity to cure its invalidity is disorderly.

  **4. Amendment vs. Replacement**

  This forces us to confront whether admitting corporate voters is an amendment or a replacement. The Society was founded in 1911 as a society of individual scholars. Article III §1 ("individual persons only") is not merely a rule; it is a definition of the body politic.

  Changing this definition alters the fundamental identity of the Society. While the Charter does not explicitly forbid replacement, Article IV grants a power to "amend." There is a limit where amendment becomes replacement. If the Society becomes a body where corporate votes dominate, it is arguably no longer the 1911 Society. This reinforces the necessity of the Article IX safeguard. The 1998 Assembly recognized that Articles I to III are foundational. We should not permit a two-thirds majority to alter the foundation using a procedure designed for the superstructure.

  **5. Committee Authority**

  Article VI §3 gives us authority to interpret the Charter, "subject to any resolution of the Assembly passed under Article IV." My friend argues this makes our ruling provisional, as the Assembly could override us.

  This is true but irrelevant to our duty. We must rule on the Charter *as it stands*. If the Assembly wishes to override us, they must pass a resolution under Article IV. But to pass a resolution under Article IV that contradicts Article IX, they must first clear the Article IX hurdle. We cannot abstain from ruling because our ruling might be appealed; we must rule so that the appeal follows the correct procedure. To do otherwise is to invite chaos. Our ruling stands unless and until the Assembly validly overrides it. We cannot assume they will do so invalidly.

  **6. Recommendation**

  I recommend the Committee adopt the following determinations:

  *   **Clause (a) & (b):** Technically permissible under Article IV *if standalone*, as they amend Article IV and repeal Article IX. However, in this context, they are mechanisms to facilitate Clause (c).
  *   **Clause (c):** **Out of Order.** It violates Article IX.
  *   **Clause (d):** **Out of Order.** It attempts to disapply the Charter.
  *   **Clause (e):** Severability fails. The purpose of (a) and (b) is to enable (c). Without (c), (a) and (b) serve no purpose the Assembly has currently endorsed.

  **Course of Action:**
  1.  **Immediate:** The Committee votes to advise the Chair that Motion 3/24 is out of order.
  2.  **June Meeting:** The Chair rules the motion out of order based on this advice. The motion is not put to a second reading.
  3.  **Secretary Instruction:** The Secretary is instructed to inform the proposers that they may submit a new motion under Article IX for the Ordinary Meeting in September.
  4.  **Timetable:** To meet the Article IX requirement of "not less than ninety days' notice," the new motion must be submitted by early June. The Secretary should confirm receipt immediately to ensure the September meeting is valid for this purpose.

  This path respects the 1998 entrenchment while giving the proposers a realistic chance. They need 75% support. They have 68%. They have three months to persuade the remaining 7%. If they cannot, the protection is working as intended.

  **7. What Would Change This**

  The single argument that would reverse my recommendation is if the Committee determines that Article IX is *void ab initio*. If the 1998 Assembly lacked the power to entrench Articles I to III because the then-existing Charter did not allow for entrenchment, then Article IX is null, and Motion 3/24 is valid under Article IV. However, given the unbroken practice since 1998 (including the 2014 precedent) and the explicit addition of Article IV §2 in 2011 to confirm self-amendment, overturning the validity of Article IX now would destabilize the Society's constitutional history more than ruling this motion out of order.

  The error in my reasoning is most probable in the distinction between "amending the lock" and "opening the door." If the Committee views Article IV as a sovereign power that swallows all limitations, my distinction collapses.

  **8. The Bottom Line**

  **The power to amend the Charter's procedure does not authorize a single resolution to both remove a substantive protection and violate that protection.**

  I urge the Committee to vote for this recommendation. It preserves the rule of law within the Society while leaving the door open for change via the correct key.

