answer: |-
  # Joint Statement on the Structure of the Aggregation Dispute

  **Signatories:** The Aggregators and The Separatists
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on the Utility Monster and Distributive Justification

  ## I. Agreed Claims

  We, the undersigned, having engaged in adversarial collaboration regarding the formal case described below, endorse the following claims as the fixed background of our dispute. We sign this not to signal surrender, but to isolate the precise locus of our disagreement.

  1.  **Formal Specification of the Case:** We agree on the mathematical structure of the baseline scenario. There is a fixed stock of a perfectly divisible resource $R$. Welfare is cardinally measurable and interpersonally comparable on a scale both sides accept. For any ordinary recipient $i$, welfare $w_i$ is a strictly concave, increasing function of their share $r_i$ (meaning each additional unit of resource yields less welfare than the previous one). There exists one being, the Monster ($M$), whose welfare function is linear with slope $k$: $w_M = k \cdot r_M$. For all ordinary recipients, the slope is 1 at the margin. $k$ is intrinsic, stable, known, and not the product of prior transfers.
  2.  **The Low-$k$ Consensus:** In the "Therapy Case," where $k \approx 1.2$ and the choice is between two groups of patients with a fixed budget, we agree that the resource should be allocated to the group with the greater capacity to benefit. We agree this is not merely a pragmatic heuristic but reflects a pro tanto moral reason. We agree that in this range, the Separatist's constraint against imposing losses does not override the Aggregator's reason to maximize total welfare.
  3.  **The High-$k$ Divergence:** In the "Monster Case," where $k$ is in the hundreds or thousands and the population of ordinary recipients is very large, we agree on the *predictions* of our respective views but disagree on the *verdict*. The Aggregator holds that the resource must be transferred to the Monster until marginal welfare returns equalize (or the resource is exhausted, given the Monster's linear rate). The Separatist holds that such a transfer is impermissible because the aggregate gain to $M$ does not constitute a justification of the right kind to impose the specific losses on the ordinary recipients.
  4.  **Criterion vs. Mandate:** We agree to distinguish the *criterion of rightness* (what there is most reason to do) from the *demandingness of morality* (what agents can be expected to do) and from *institutional mandates* (what the state should enforce). Our dispute concerns the criterion of rightness. We agree that institutional rules might restrict transfers even if the Aggregator's criterion is met, but the Aggregator maintains the underlying moral reason remains; the Separatist maintains the underlying moral reason is absent.
  5.  **Nomological Impossibility:** We agree that if the Utility Monster were proven nomologically impossible (i.e., no being can physically convert resources to welfare at rate $k \gg 1$), the practical urgency of the dispute would vanish, but the theoretical disagreement would remain. The Monster serves as a stress test for the structure of our principles, not merely as a policy guide for actual beings.
  6.  **The Dispersed Reformulation:** We agree to test the "Dispersed" variant: holding the aggregate gain and loss fixed, but distributing the gain among $N$ recipients with slightly above-average efficiency rather than one Monster. We agree that if the Separatist objects to the Monster but accepts the Dispersed case, the objection is to *concentration* rather than *aggregation*. If the Separatist rejects both, the objection is to aggregation itself.
  7.  **The Endogenous Constraint:** We agree that in the "Endogenous Monster" variant, where $k$ rises with the size of the share (increasing marginal returns), there is no interior optimum where marginal returns equalize. We agree the Aggregator's standard stopping rule fails here, requiring total transfer. We agree the Separatist's prohibition remains constant. This isolates the disagreement from issues of diminishing returns.

  ## II. Residual Disagreements

  The following table catalogs the propositions on which we remain divided. The "Neutral Proposition" states the issue without theoretical loading. The "Aggregator Formulation" and "Separatist Formulation" state how each side characterizes the truth conditions of that proposition.

  | Neutral Proposition | Aggregator Formulation | Separatist Formulation |
  | :--- | :--- | :--- |
  | **1. Justification of Loss** | A loss to $A$ is justified if the sum of gains to others exceeds the loss to $A$, weighted by their baseline welfare levels. | A loss to $A$ is justified only if $A$ could not reasonably reject the principle permitting the loss, given $A$'s separate status. |
  | **2. The High-$k$ Verdict** | In the High-$k$ Monster Case, we ought to transfer resources to the Monster until the resource is exhausted or $M$'s marginal utility drops to 1. | In the High-$k$ Monster Case, we ought to distribute resources equally (or according to priority) among ordinary recipients, ignoring $M$'s superior conversion rate. |
  | **3. The Curable Monster** | If the Monster's rate is a pathology curable by consent, we ought not to cure it if curing it lowers total welfare. Welfare is the currency; the source is irrelevant. | If the Monster's rate is a pathology, we ought to cure it even if it lowers total welfare. A claim based on pathological capacity does not generate a valid reason to impose losses on others. |
  | **4. The Contaminated Monster** | If the Monster's rate depends on non-consensual taking, this is a constraint on *acquisition*, not on *aggregation*. If the taking is rectified, the aggregation claim holds. | If the Monster's rate depends on non-consensual taking, the welfare generated is "contaminated" and does not count in the moral calculus at all. This is a dispute about the currency of value, not aggregation. |
  | **5. Priority Weights** | Priority weights (moral importance attached to welfare) should not decay fast enough to block the Monster when $k$ is sufficiently large. | Priority weights must decay fast enough (or be lexical) to block the Monster regardless of $k$, preserving the separateness of persons. |
  | **6. Numbers Count** | The number of losers matters only insofar as it increases the aggregate loss. One loser suffering a large loss is equivalent to many losers suffering small losses summing to the same amount. | The number of losers matters structurally. Imposing a loss on many distinct agents requires a stronger justification than imposing an equivalent aggregate loss on one agent. |

  ## III. Cruxes

  We identify the following sub-questions as "cruxes." Settling these would move at least one of us. For each, we record the evidence or argument we both accept as relevant, and our conflicting predictions.

  **Crux 1: The Dispersed Intuition Test**
  *   **Question:** Does the moral objection vanish if the Monster's advantage is distributed across many beings?
  *   **Shared Evidence:** The intuition pump involving a thousand beings who each convert resources at $k=1.5$ versus one being at $k=1500$, holding total welfare constant.
  *   **Aggregator Prediction:** The Separatist will accept the transfer in the Dispersed case. This proves their objection is to the *concentration* of power, not the *aggregation* of welfare.
  *   **Separatist Prediction:** We will reject the Dispersed case if the individual gains to the many do not outweigh the individual losses to the many *per person*. If we accept it, it is because each gainer compensates a specific loser, not because the sums balance.

  **Crux 2: The Endogenous Limit**
  *   **Question:** Does the absence of an interior optimum (equalization point) force the Separatist to concede, or harden their resistance?
  *   **Shared Evidence:** The mathematical certainty that with increasing marginal returns, the Aggregator must demand total sacrifice of the many for the one.
  *   **Aggregator Prediction:** The Separatist will admit that their view implies leaving vast amounts of welfare "on the table," which is irrational.
  *   **Separatist Prediction:** We will maintain that leaving welfare on the table is preferable to treating the many as a means to the one's unlimited capacity. This confirms the dispute is about the *structure of justification*, not efficiency.

  **Crux 3: The Curable Pathology**
  *   **Question:** Is "welfare" defined by the subject's experience or by a normative standard of functioning?
  *   **Shared Evidence:** The case of the Curable Monster, where a consensual intervention lowers $k$ to 1.
  *   **Aggregator Prediction:** The Separatist will forbid the cure to respect autonomy, but must admit total welfare is lower. This shows Separatism prioritizes procedure over outcome.
  *   **Separatist Prediction:** We will mandate the cure. This shows that "welfare" in the Aggregator's sense includes pathological states that should not count as moral reasons. This kills the Monster case by redefining the currency.

  **Crux 4: Priority Weight Decay**
  *   **Question:** How fast must the moral weight of a welfare unit decay as the recipient's baseline welfare rises to block the Monster?
  *   **Shared Evidence:** The mathematical function required to block a transfer where $k=1000$.
  *   **Aggregator Prediction:** To block the Monster, the Separatist must adopt a lexical view (no amount of gain to others justifies any loss to one). This is implausible in the Low-$k$ Therapy Case.
  *   **Separatist Prediction:** We can adopt a moderate prioritarianism that blocks the High-$k$ case without violating the Low-$k$ intuition, by weighting the *loss* heavier than the *gain* regardless of the sum.

  ## IV. Closing Assessment

  **Verbal and Orthogonal Disputes**
  We acknowledge that a portion of our disagreement is verbal. Specifically, the **Contaminated Monster** variant appears to belong to a different dispute: the definition of the welfare currency. If welfare generated by non-consensual taking does not count as "welfare" in the moral sense, the Aggregator's sum is reduced automatically. We agree to bracket this as a meta-ethical dispute about value theory, not a dispute about aggregation. If the Separatist's objection relies entirely on this variant, their objection to aggregation *per se* is unproven.

  **The Function of the Reductio**
  We agree that framing the Monster case as a *reductio ad absurdum* of Aggregation has been unproductive. The Aggregator does not find the conclusion absurd; they find it demanding. The Separatist finds the conclusion unjust. The case does not refute Aggregation; it merely forces the Aggregator to accept a high cost of their view (extreme sacrifice) and forces the Separatist to accept a high cost of theirs (welfare loss). The "reductio" framing is rhetorical, not logical.

  **Falsification Conditions**
  Finally, we state what would count as evidence against our own views:
  *   **For the Aggregators:** We would abandon total-welfare consequentialism if it were demonstrated that adhering to it systematically requires violating constraints that are constitutive of agency (e.g., if maximizing welfare requires treating persons as mere vessels without regard for their distinct narratives), *and* if this violation could not be accounted for by long-term welfare losses.
  *   **For the Separatists:** We would abandon our constraints if it were demonstrated that our view requires allowing a catastrophic loss to one person to prevent trivial gains to a vast number of others, where the trivial gains *do* aggregate to a significant improvement in the quality of life for the many, and no rights-violation occurs in the transfer mechanism.

  We sign this statement to record that the debate is not stalled, but structured. The disagreement is not about the math, nor about the Low-$k$ cases. It is about whether the "separateness of persons" imposes a structural constraint on moral reasoning that survives even when the welfare stakes are astronomically high.

  **Signed,**

  *The Aggregators*
  *The Separatists*
