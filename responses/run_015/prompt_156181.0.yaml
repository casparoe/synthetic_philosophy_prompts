  This instrument classifies ethical positions on clientelism and gift-giving based on the logical structure of their normative claims. It proceeds through three levels of branching. Respondents should answer each diagnostic question based on the core logic of the position being analyzed, not on the desired outcome.

  ### Level 1: Source of Normative Authority
  **Diagnostic Question:** When evaluating the moral status of the exchange, is the primary standard of judgment derived from the **formal duties of the public office** (impartiality, rule of law), or from the **interpersonal obligations between the actors** (loyalty, gratitude, kinship)?

  *   **Branch A:** Formal Duties of Public Office (Institutional-Role Norms)
  *   **Branch B:** Interpersonal Obligations (Relational-Moral Norms)

  ---

  ### Level 2: Structure of the Exchange
  **Diagnostic Question:** Is the exchange understood as a **discrete transaction** with a specific quid pro quo and clear termination, or as an **open-ended bond** characterized by ongoing mutual support without immediate settlement?

  *   **Branch A1 (from Office):** Discrete Transaction
  *   **Branch A2 (from Office):** Open-Ended Bond
  *   **Branch B1 (from Relationship):** Discrete Transaction
  *   **Branch B2 (from Relationship):** Open-Ended Bond

  ---

  ### Level 3: Validity and Scope of Standards
  **Diagnostic Question:** (Answer based on the branch taken below)

  *   **For Branch A1 (Office + Discrete):** Are Western bureaucratic norms applied **strictly without regard to local cultural meaning**, or is local meaning **considered as context without excusing the violation**?
      *   *Strict Application:* Leads to **Leaf 1**.
      *   *Contextual Consideration:* Leads to **Leaf 2**.
  *   **For Branch A2 (Office + Open):** Is the deviation from impartiality justified because it **sustains political representation/systemic function**, or is it **unjustified**?
      *   *Justified by Function:* Leads to **Leaf 3**.
      *   *Unjustified:* (Leads to Unoccupied Gap 1).
  *   **For Branch B2 (Relationship + Open):** Does the local cultural context render external moral judgment **epistemologically impossible**, or does it provide a **competing ethical justification** (e.g., loyalty trumps impartiality)?
      *   *Judgment Impossible:* Leads to **Leaf 4**.
      *   *Competing Justification:* Leads to **Leaf 5**.
  *   **For Branch B1 (Relationship + Discrete):** (Leads to Unoccupied Gap 2).

  ---

  ### Leaf Classification

  **Leaf 1: Western Legalist Universalism (a)**
  *   **Path:** Office → Discrete → Strict Application.
  *   **Definition:** Corruption is defined by the violation of universal impersonal rules. Cultural context is irrelevant to the moral status of the act; gift-giving in a public context is inherently corrupt.

  **Leaf 2: Hybrid Contextual Universalism (e)**
  *   **Path:** Office → Discrete → Contextual Consideration.
  *   **Definition:** Public office demands impartiality universally, but the *interpretation* of the act (e.g., intent, severity) acknowledges cultural context. Context explains the behavior but does not excuse the violation of public duty.

  **Leaf 3: Institutional Functionalism (c)**
  *   **Path:** Office → Open-Ended → Justified by Function.
  *   **Definition:** Clientelism is acknowledged as a deviation from ideal bureaucracy but is permitted or defended because it sustains representation, stability, or welfare where formal institutions are weak.

  **Leaf 4: Thick Cultural Relativism (b)**
  *   **Path:** Relationship → Open-Ended → Judgment Impossible.
  *   **Definition:** Moral truth is constituted by the local culture. Western standards are merely one local form among others and possess no standing to judge acts embedded in a different cultural epistemology.

  **Leaf 5: Relational-Ethics Defense (d)**
  *   **Path:** Relationship → Open-Ended → Competing Justification.
  *   **Definition:** The act is judged ethically, not just culturally. Loyalty and reciprocity are posited as substantive moral goods that may legitimately outweigh the abstract norm of impartiality in specific contexts.

  ---

  ### Diagnostic Notes on Logical Space

  #### Unoccupied Logical Combinations (Gaps)

  1.  **Institutional-Role + Open-Ended + Unjustified (Gap 1)**
      *   **Diagnosis:** *Incoherent/Unstable.* This position admits that clientelism violates office norms and offers no functional or relational defense. It amounts to a simple condemnation without a theoretical framework for why the exchange occurs or persists. It is empirically common but theoretically empty.
  2.  **Relational-Moral + Discrete Transaction (Gap 2)**
      *   **Diagnosis:** *Unexplored/Incoherent.* Relational ethics rely on enduring bonds. A discrete, one-off transaction within a relational framework typically collapses into bribery (transactional) or fails to satisfy the requirement of reciprocity (relational). There is no robust ethical school defending "one-off relational gifts."
  3.  **Relational-Moral + Open-Ended + Context Explains/Does Not Excuse (Gap 3)**
      *   **Diagnosis:** *Unattractive.* This would imply that while the act is rooted in relational norms, those norms are insufficient to defend against external critique. This position effectively collapses back into Hybrid Contextual Universalism (Leaf 2) by conceding the authority of the external norm.

  #### Flagged Overlaps and Separation Issues

  **Overlap: Institutional Functionalism (Leaf 3) vs. Relational-Ethics Defense (Leaf 5)**
  *   **Issue:** Both positions justify open-ended exchanges (clientelism) against Western bureaucratic norms. Empirically, arguments often blend functional outcomes (stability) with relational virtues (loyalty). The tree separates them strictly by Level 1 (Office vs. Relationship), but proponents often argue both simultaneously.
  *   **Further Splitting Question:** "Is the primary justification for the act that it **produces beneficial systemic outcomes** (functionalism), or that it **enacts intrinsic moral virtues** between persons (relational ethics)?"

  **Overlap: Thick Cultural Relativism (Leaf 4) vs. Relational-Ethics Defense (Leaf 5)**
  *   **Issue:** Both reside on the Relational/Open branch. The distinction between "culture makes judgment impossible" (epistemic) and "culture provides competing virtues" (ethical) is subtle. Many relativist arguments implicitly rely on the ethical value of respecting culture, blurring the line.
  *   **Further Splitting Question:** "If an outsider condemns the act, is the response that the outsider **cannot understand the truth** (Relativism), or that the outsider **prioritizes the wrong virtue** (Relational Ethics)?"

  **Overlap: Western Legalist Universalism (Leaf 1) vs. Hybrid Contextual Universalism (Leaf 2)**
  *   **Issue:** Both uphold universal norms for public office. The distinction lies in whether context is *ignored* (Leaf 1) or *acknowledged but overruled* (Leaf 2). In practice, few legalists ignore context entirely (e.g., in sentencing), making Leaf 1 a theoretical ideal type rather than a common operational position.
  *   **Further Splitting Question:** "Is cultural context treated as **evidence irrelevant to the verdict**, or as **mitigating evidence relevant to enforcement**?"
