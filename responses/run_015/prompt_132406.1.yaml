answer: |-
  Your supervisor is channeling Hannah Arendt's "Truth and Politics," specifically her distinction between *rational truth* (which is coercive) and *factual truth* (which is fragile and contingent). Arendt's central anxiety is not about morality or motive, but about the stability of the "common world"—the shared ground of facts upon which political debate and action stand.

  Here is the breakdown of the rules, the verdicts, and the test case.

  ### The Rule She Is Running

  The rule your supervisor is running is: **"What matters is whether the shared factual world gets degraded."**

  Here is why the other two candidates fail:

  1.  **"Whether a checkable fact is denied"**: This rule collapses immediately against her verdict on the **Single Lie (Case C)**. Denying a meeting with photographic evidence is a clear denial of a checkable fact, yet she dismisses it as "small beer." Conversely, her **Paradigm Case (Case B)** involves *no* flat false statements, only spin and cherry-picking. If specific denials were the metric, Case B would be innocent and Case C would be capital; she rules the exact opposite.
  2.  **"Whether the liar has lost his own grip on factuality"**: This is the strongest distractor because it explains her verdict on the **Self-Deceiving Leader (Case D)** as the "most dangerous variant." However, it cannot explain why the **Optimistic Spin (Case B)** is the "paradigm case." In Case B, officials are coolly reframing numbers; they have *not* lost their grip. If loss of grip were the defining rule, Case B would be a lesser offense than Case D. Instead, Case B defines the phenomenon, and Case D is merely a more volatile version of it. Loss of grip is an aggravating factor, not the definition.

  **Why "Degradation of the Shared Factual World" wins:**
  This rule unifies every verdict.
  *   **Military Deception (Case A):** Does not degrade the *domestic* common world; it is external strategy. Verdict: Fine.
  *   **Optimistic Spin (Case B):** Degrades the public's ability to judge reality without technically breaking facts. Verdict: Paradigm.
  *   **Single Lie (Case C):** An isolated breach that institutions can correct (the photo exists). The shared world holds. Verdict: Small beer.
  *   **Self-Deceiving Leader (Case D):** Destroys the common world *and* removes the internal brake on lying. Verdict: Most dangerous.
  *   **Historical Rewriting (Case E):** Destroys the common world across time. Verdict: Worst case.
  *   **Aside 2:** Explicitly notes that truth-tellers are structurally disadvantaged because facts are fragile. The "rule" is protecting that fragility.

  ### The Verdicts on the New Cases

  **(1) The Churn: Worse than the paradigm case.**
  This is not merely lying; it is the industrialization of epistemic collapse. In the **Paradigm Case (B)**, the truth is obscured by spin. In **The Churn**, the truth is preserved (the file is in the archive) but rendered politically inert by noise. This exploits the "liar's freedom" (Aside 2) to its absolute limit: the liar does not even need to deny the truth anymore; he simply drowns it. Arendt argues factual truth needs institutions to hold it up; this case weaponizes institutions to make factuality indistinguishable from fiction. It achieves the total destruction of the common world seen in **Historical Rewriting (Case E)**, but in real-time. It is the endpoint of the phenomenon she is tracking.

  **(2) The Weaponised Truth: The paradigm case.**
  This is a precise structural match for **Optimistic Spin (Case B)**. In Case B, officials used "numbers reframed, trends cherry-picked" to create a false picture of a war. In this case, they use "crime stats reframed, incidents cherry-picked" to create a false picture of a minority. No specific sentence is false, but the resulting "world" the citizen inhabits is a fabrication. It relies entirely on the "structural disadvantage" of the truth-teller (Aside 2): the truth-teller cannot say "crime is evenly distributed" if the data is being selectively released. It degrades the shared factual world by presenting a part as the whole.

  ### The Tie-Breaker Case

  To separate the top two rules (**Degradation of Shared World** vs. **Loss of Grip**), you need a case where the leader's mind is broken, but the public record remains intact.

  **The Case:** *The Private Madman.* A head of state suffers from a severe psychosis in private (believing he is immortal and speaks to ancestors) and makes decisions based on these delusions in closed sessions. However, his administration is staffed by technocrats who silently correct all his public statements, publish accurate data, and ensure every official record is factually precise. The public never sees the delusion; the common factual record is pristine.

  *   **If she follows "Loss of Grip":** She must rule this the **"most dangerous variant."** The leader has completely lost his grip on factuality (matching Case D).
  *   **If she follows "Degradation of Shared World":** She must rule this **"not the subject"** or **"small beer."** The common factual world remains intact; the institutions are holding up the truth despite the leader (matching Aside 2).

  Given her insistence that "truth-tellers are at a structural disadvantage... which is why factual truth is so fragile and needs institutions to hold it up," she will prioritize the state of the *institutions* and the *record* over the state of the *leader's mind*. If the institutions hold, the common world survives.

  \answer{(1) = worse than the paradigm case, (2) = the paradigm case, rule = degradation of the common factual world}
