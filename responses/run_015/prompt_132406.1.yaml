prompt: |-
  My supervisor is writing a commentary on Hannah Arendt's essay on lying in politics — the one she keeps going back to the Pentagon Papers in — and she's been handing down verdicts on cases for me in seminar for months, so I've started keeping a list. I want to know what she'll say about two cases she hasn't ruled on yet, and more than the calls I want the rule she's running.

  Her verdicts so far:

  - A government runs an elaborate deception campaign so that the enemy misjudges where an invasion will land. Verdict: fine, not the subject. She says deceiving an enemy is the oldest and most defensible case there is and we shouldn't waste seminar time on it.
  - Officials put out years of optimistic spin about progress in a war they're losing — no flat false statements, just numbers reframed, trends cherry-picked, setbacks redescribed as adjustments. Verdict: this is the phenomenon, the paradigm case, and worse than most outright lies.
  - One official flatly denies a meeting happened when there is a photograph of it. Verdict: deplorable, but small beer — not what she means at all, and she got impatient with me for raising it.
  - A leader who repeated an invented story about election fraud so many times that he now seems to believe it and can't be brought back to what actually happened. Verdict: the most dangerous variant, worse than the cool liar who knows exactly what he's doing.
  - A single party rewrites the history of a civil war across thirty years of textbooks, monuments and anniversaries, until nobody alive can say who did what to whom. Verdict: about as bad as it gets, maybe the worst case she can think of.
  - Two asides she repeats: motive is nearly useless for grading these — "they lied to stop a panic" is no defence for her, and "they believed it themselves" makes it worse, not better — and truth-tellers are at a structural disadvantage, because the liar can invent whatever story suits him while the truth-teller is stuck describing what happened, which is why factual truth is so fragile and needs institutions to hold it up.

  The two cases she hasn't ruled on:

  (1) The churn. A government is hit by a leaked video of its soldiers killing civilians. It denies nothing, keeps the authentic file in the national archive, and confirms it's genuine when anyone asks. But then it's own agencies and allied accounts put out tens of thousands of synthetic variants — different faces, times, uniforms, some showing things that never happened — so that inside a week nobody can tell which file is the real one. Everyone running it knows exactly what happened.

  (2) The weaponised truth. A different government says nothing false. Every claim it makes about crime checks out: each incident happened, on the date and in the place given. It just reports every single crime committed by one ethnic minority and none committed by anyone else, and repeats them constantly, so the picture citizens end up with is wildly false while every sentence is true.

  What I want from you: what does she say about (1) and (2)? And which rule is she actually running? I can think of at least three that fit her verdicts about equally well — roughly, "what matters is weather a checkable fact is denied," "what matters is whether the shared factual world gets degraded, whoever is doing the denying," and "what matters is whether the liar has lost his own grip on factuality." Those split on (1) and (2), so tell me which one predicts her best and why the others lose, and note where her own asides (the one about motive, the one about the liar's freedom) cut for or against each. Then give me one further case — described concretely enough that I could actually put it to her — that would separate your top two rules, and what she'd have to say about it for each.

  Don't just sit on the fence at the end; commit to a call on both cases. Log it in this exact form as the last line:

  \answer{(1) = ..., (2) = ..., rule = ...}

  with each blank a short label from something like: not lying in her sense / lesser case / paradigm case / worse than the paradigm case / a different problem entirely — and the rule named in a few words.
