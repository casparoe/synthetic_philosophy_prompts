answer: |-
  This is an excellent question that cuts to the heart of the endurance/perdurance debate. It is common for students to conflate these arguments because they are often presented together as the "case against endurance," but you are right to suspect they have different structures and targets.

  To give you a precise answer for your seminar: **They are not the same argument.** While they share a motivation (showing that endurance is incoherent), they attack different layers of the theory. Lewis's "Argument from Presence" (often called the Argument from Location or the 'At' Relation) is an **ontological** objection, whereas Sider's "Problem of Temporary Intrinsics" is a **logical** objection.

  Here is a breakdown of how they compare, how the endurantist reply fares against each, and an evaluation of which is stronger.

  ### 1. Distinguishing the Arguments

  **Lewis's Argument from Presence (The Ontological Worry)**
  *   **The Core:** This argument focuses on the relation between an object and a time. If an enduring object $O$ is *wholly present* at $t_1$ and *wholly present* at $t_2$, what is the nature of this "presence"?
  *   **The Trap:** Lewis argues that if $O$ exists at $t_1$ and $t_2$, existence must be a relation between $O$ and $t$. But existence is not supposed to be a relation; things just *exist*. If existence is relative to a time (existence-at), then $O$ doesn't exist *simpliciter*, only relative to a time. This leads to a regress: what makes $O$ exist-at-$t_1$ rather than exist-at-$t_2$?
  *   **Target:** It targets the coherence of "wholly present." It asks: *How can one thing be in two places (times) without being a scattered whole?*

  **Sider's Problem of Temporary Intrinsics (The Logical Worry)**
  *   **The Core:** This argument focuses on property instantiation. (Note: Lewis actually originated this argument in *On the Plurality of Worlds*, but Sider refined it into its deadliest logical form in *Four-Dimensionalism*.)
  *   **The Trap:**
      1.  $O$ is bent at $t_1$.
      2.  $O$ is straight at $t_2$.
      3.  If $O$ endures, it is numerically identical at $t_1$ and $t_2$.
      4.  Therefore, $O$ is both bent and straight.
      5.  This is a contradiction (assuming bentness and straightness are incompatible intrinsic properties).
  *   **Target:** It targets the Law of Non-Contradiction. It asks: *How can one thing have incompatible properties?*

  ### 2. The Endurantist Reply: Tensed Properties (Indexicalism)

  The standard endurantist reply is to deny that objects have properties *simpliciter*. Instead, property instantiation is a three-place relation: $O$ has $F$ at $t$. Or, properties themselves are tensed: $O$ has the property *being-bent-now*.

  **Does it defuse Lewis's Presence Argument?**
  **No, not really.**
  The tensed property reply solves the problem of *change*, but it does not solve the problem of *presence*. Even if $O$ has "bent-at-$t_1$" and "straight-at-$t_2$", we still need to know what it means for $O$ to be *present* at $t_1$.
  *   If the endurantist says "Existence is also tensed" (i.e., $O$ exists-now), they have solved the Presence argument but at the cost of committing to **Presentism** (only the present exists). This is a massive metaphysical bullet to bite, as it conflicts with relativity and makes cross-time comparison difficult.
  *   If they remain Eternalists (past, present, and future exist), the "fact of presence" remains mysterious. Why is the whole object *located* at $t_1$? The tensed property reply explains the *qualities* of the object at that time, but not the *location* of the substance itself. Lewis's worry was about the ontology of the object-time relation, not the properties the object holds there.

  **Does it defuse Sider's Temporary Intrinsics?**
  **Yes, logically.**
  By relativizing properties to times ("bent-at-$t_1$"), the contradiction vanishes. "Bent-at-$t_1$" and "Straight-at-$t_2$" are compatible relational properties, just like "being north of London" and "being south of Edinburgh" are compatible.
  *   **However:** Sider anticipates this. He argues that this reply changes the subject. We care about the shape of the cat *simpliciter*, not its relation to a time. If the cat only has the property *bent-at-t*, then the cat *simpliciter* has no shape. Sider argues this is unintelligible. But strictly speaking, as a logical defense against contradiction, the tensed property reply works.

  ### 3. Are they the same argument in different clothes?

  **No.**
  *   **Temporary Intrinsics** assumes the object is present at the times and asks how it can change qualities.
  *   **The Argument from Presence** asks how the object can be present at the times in the first place without fragmenting into temporal parts.

  You can theoretically solve Temporary Intrinsics (by tensing properties) while still failing to solve the Argument from Presence (because you still haven't explained how a whole object relates to a time without being a part of that time).

  ### 4. Which version is stronger?

  In the context of a modern metaphysics seminar, **Sider's formulation of the Temporary Intrinsics argument is generally considered the stronger dialectical weapon.** Here is why:

  1.  **Logical Force:** The Argument from Presence can be dismissed by the endurantist as a category mistake. An endurantist can simply say, "Objects don't stand in a relation to time; time is a dimension in which they are located, just as they are located in space without being 'related' to space." It's easy to claim this is just a brute fact. Sider's argument, however, invokes the Law of Non-Contradiction. It is harder to ignore a charge of logical incoherence than a charge of ontological mystery.
  2.  **The Cost of the Reply:** As noted above, the endurantist reply to Sider (tensed properties) is costly. It forces the endurantist to claim that intrinsic properties (like shape) are actually relational or tensed. This violates our pre-theoretical intuition that shapes are intrinsic. Sider successfully argues that this makes the endurantist view *less* parsimonious than perdurance. Perdurance explains change without altering the nature of properties; Endurance explains change only by altering the nature of properties.
  3.  **Sider's Rigor:** Sider closes the loopholes Lewis left open. Lewis allowed that the endurantist *could* adopt tensed properties but thought it was unattractive. Sider argues it is *incoherent* or at least renders the object property-less *simpliciter*.

  **The Counter-Case for Lewis's Presence Argument:**
  The only reason to prefer Lewis's Presence argument is if you think the debate is about **ontology** rather than logic. If you believe that "existence" is the fundamental metaphysical category, then Lewis's worry is deeper. Sider's argument can be blocked by accepting a "costly" metaphysics (tensed facts). Lewis's argument suggests that the very *concept* of an enduring object is spatially/temporally incoherent regardless of what properties it has.

  ### Summary for your Seminar

  If you want to make a strong impression:

  1.  **Distinguish them:** Argue that TI is about *predication* (logic), while Presence is about *location* (ontology).
  2.  **Evaluate the Reply:** Point out that the "tensed properties" reply solves the logical contradiction (TI) but exacerbates the ontological mystery (Presence) by requiring tensed existence or a brute location relation.
  3.  **Verdict:** Conclude that **Sider's TI is stronger** because it forces the endurantist to revise their theory of properties, which is a higher theoretical cost than simply asserting a brute fact of presence. The endurantist can live with a mystery about "presence," but they cannot easily live with the claim that cats have no shape *simpliciter*.

  This distinction shows you understand that the debate isn't just about "change," but about the fundamental categories of existence and property instantiation.
