prompt: |-
  I'm defending a thesis next tuesday at a workshop on WWI blame and I need a Q&A prep sheet, not a defense of the paper itself. My argument is that saying a nation is "responsible" for starting a war shouldn't mean attributing some collective mind to the state, but should instead track what I'm calling institutional reparative burden - a duty that attaches when a state's bureacratic apparatus was systematically configured to capture gains from escalation, regardless of whether individual actors intended war. I lean on Fischer's findings about the September Program, not to prove malicious intent, but to show that German administrative structures were already oriented toward territorial extraction, which creates this burden even if we reject the old Versailles guilt framing as anachronistic.

  The audience is about twelve people: mostly modern European historians who accept Fischer's basic causal story but think importing moral philosophy into archival history is sloppy, plus two political theorists who believe collective responsibility always collapses either into individual blame or into methodological nationalism. They care about source fidelity, they distrust "frameworks" that don't emerge from the documents, and they're likely to ask about whether I'm just smuggling normative conclusions into descriptive claims.

  Can you draft the objections in the order they'll actually come, phrased the way these people talk - not generic philosophy questions? For each one I want: the real force behind it, what I should concede up front without killing my position, the reply that has to land for the proposal to survive, and a note on where that reply is softest. Order them by how much damage they'd do if I flubbed them. Include the question I'm hoping nobody asks - make it sharper than just "does this apply to every war" - maybe something about whether my framework forces me to assign burden to successor states or to populations that never consented to the bureacratic structures. Keep it practical, I'm speaking for twenty minutes then facing thirty minutes of Q&A.
