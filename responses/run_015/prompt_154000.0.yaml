  # FINAL EXAMINATION: PHILOSOPHY OF BIOLOGY (SEM 404)
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 30  
  **Instructions:** Answer the following question. You are not required to cite specific authors or texts. Focus on conceptual precision and argumentative coherence.

  ### Essay Question: Function and Malfunction in Synthetic Microbiomes

  **Case Study: The PlastiX Consortium**
  Consider a synthetic bacterial consortium engineered for bioremediation in industrial wastewater. The consortium consists of *Pseudomonas* strains carrying a specialized metabolic pathway designed to degrade polyethylene terephthalate (PET). This pathway was not evolved naturally as a unified unit; rather, it was stitched together in a laboratory from three distinct plasmid modules sourced from unrelated bacterial species found in soil and marine environments. Module A binds the plastic, Module B cleaves the polymer chains, and Module C metabolizes the byproducts. 

  Upon release into a wastewater treatment plant, the consortium was exposed to a high-pressure environment where PET was the primary carbon source. Over six months, rapid horizontal gene transfer (HGT) occurred between the engineered strains and native wild-type bacteria. Consequently, the pathway is now mosaically distributed: some bacteria possess all three modules, some possess only A and B, and others possess unrelated plasmids that interfere with Module C. 

  Observations show that bacteria possessing the intact three-module pathway successfully degrade PET. However, in a subset of the population, the pathway is structurally intact but fails to degrade PET due to a regulatory mismatch caused by the HGT events. Your friend argues that because the pathway lacks a unified evolutionary history where the *combination* was selected as a unit, etiological accounts must deny it has a "proper function," leaving only causal descriptions. You counter that describing the regulatory mismatch as a "malfunction" seems correct, implying a normative standard exists even in this synthetic, mosaic context.

  **Task:**
  Write an essay addressing the following four points:
  (a) Articulate the precise conditions under which an **etiological account** attributes the function "to degrade PET" versus the conditions a **causal-role account** requires. Explicitly state where each view locates the normative judgment of "malfunction."
  (b) Explain why the **mosaic evolutionary history** of the plasmid cluster creates a specific problem for the etiological account regarding the integrated pathway, and why the causal-role account struggles to distinguish "malfunction" from mere "causal failure" without a natural design baseline.
  (c) Evaluate whether a **minimal hybrid revision**—call it the "Stabilized Contribution Account," which requires both a recent selective stabilization of the contribution and an actual current causal contribution—can resolve the tension without collapsing into either pure view.
  (d) Defend or reject that hybrid using the consortium case, with explicit attention to whether synthetic organisms can genuinely malfunction.

  ***

  ### MODEL ANSWER

  **(a) Conditions for Function and Normativity**
  To attribute the function "to degrade PET," the etiological account requires a specific historical condition: the pathway must exist in the current population because ancestors possessed it and it conferred a fitness advantage specifically via PET degradation. The function is the effect for which the trait was selected. Normativity enters here: malfunction is defined as the failure to perform this selected effect despite the trait being present. If the pathway was not selected for degradation, it has no function, only effects.

  In contrast, the causal-role account requires a systemic condition: the pathway must currently contribute to a capacity of the containing system (e.g., the bacterium's survival or the consortium's remediation capacity). The function is the causal contribution itself. Normativity is weaker here; malfunction is typically defined relative to a system's goal or design specification. If the pathway stops contributing, it is a "failure," but calling it a "malfunction" requires an external baseline (like engineer intent) rather than an internal biological history.

  **(b) The Mosaic History and Baseline Problems**
  The mosaic history of the PlastiX Consortium creates a dilemma for the etiological view. Selection pressure in the wastewater acted on the bacteria, but the pathway modules originated from unrelated lineages and were combined artificially. The etiological account risks denying the *integrated pathway* has a function because no ancestral lineage was selected for this specific combination prior to the lab stitching. If selection acted only on individual modules previously, the unified function "degrade PET" lacks a unified selection history. This implies the pathway cannot malfunction etiologically; it merely fails to cause an effect.

  The causal-role account avoids the history problem but faces a baseline problem. It can say the pathway contributes to degradation now. However, when the regulatory mismatch occurs, the causal-role view describes this as a cessation of contribution. Without a natural design baseline, distinguishing "malfunction" (a normative failure) from "causal failure" (a descriptive break) is difficult. Is the pathway broken, or was it never truly functional for this system? In synthetic contexts, the "system capacity" is often defined by human intent, blurring the line between biological function and mechanical utility.

  **(c) Evaluating the Stabilized Contribution Account**
  The "Stabilized Contribution Account" (SCA) proposes a hybrid: a trait has a function if it makes a current causal contribution *and* that contribution has undergone recent selective stabilization. This attempts to capture the normativity of the etiological view (via selection) without requiring deep evolutionary history, while retaining the current relevance of the causal-role view.

  In the consortium case, the SCA offers a potential resolution. Although the modules are ancient, the *combination* has undergone six months of selection in the wastewater plant. If the intact pathway was stabilized because it allowed hosts to survive on PET, the SCA grants it a function. This avoids the etiological demand for deep ancestry and the causal-role lack of normativity. However, the SCA risks collapsing into the etiological view if "recent stabilization" is just short-term selection. Conversely, if "stabilization" is too weak, it collapses into causal-role by counting any persistent effect. The key is whether the selection was strong enough to establish a normative standard independent of the engineer's original intent.

  **(d) Defense of the Hybrid and Synthetic Malfunction**
  I defend the hybrid account for this case. The PlastiX Consortium has entered a genuine selection regime in the wastewater plant. The bacteria with the intact pathway survived and replicated; those without it did not. This recent history provides the normative ground missing from pure causal-role accounts. Therefore, when the regulatory mismatch prevents degradation in a bacterium that otherwise possesses the stabilized pathway, it is genuinely malfunctioning, not merely failing causally.

  This confirms that synthetic organisms can malfunction. Once released into an environment where their traits are subject to selection pressures independent of the lab, they acquire etiological functions relative to that environment. The "design" is no longer just the engineer's blueprint but the environmental filter that stabilized the trait. Thus, the pathway has the function to degrade PET because that contribution was recently selected and stabilized. When it fails despite being intact, it violates the normative standard set by that stabilization. The mosaic history is irrelevant once the unified trait undergoes its own selection cycle. The SCA successfully captures this by requiring both the current capacity to act and the historical stamp of selection, validating the intuition that synthetic life can suffer biological malfunction, not just mechanical breakdown.

  ***

  ### MARKING SCHEME (Total: 30 Marks)

  | Conceptual Move | Marks | Characteristic Student Error |
  | :--- | :---: | :--- |
  | **1. Etiological Conditions & Normativity:** Correctly identifies selection history as the condition for function and failure to perform selected effect as malfunction. | 6 | Conflating "selected effect" with "any beneficial effect" or claiming etiological accounts cannot handle normativity at all. |
  | **2. Causal-Role Conditions & Baseline:** Correctly identifies current causal contribution as the condition and notes the difficulty in establishing a normative baseline for malfunction. | 6 | Treating causal-role malfunction as identical to mechanical breakdown without confronting the baseline problem. |
  | **3. Mosaic History Problem:** Explains how modular selection history threatens the etiological attribution of function to the *integrated* pathway. | 6 | Conflating "no unified evolutionary history" with "no function whatsoever" rather than addressing modular selection. |
  | **4. Hybrid Evaluation:** Analyzes whether the "Stabilized Contribution" account avoids collapsing into either pure view by requiring both selection and contribution. | 6 | Accepting the hybrid uncritically without checking if it merely duplicates the etiological view with a shorter time scale. |
  | **5. Synthetic Malfunction Verdict:** Defends a position on whether synthetic organisms can malfunction based on the application of the chosen account to the case. | 6 | Asserting synthetic organisms cannot malfunction because they are "artificial" without addressing the selection regime argument. |
  | **TOTAL** | **30** | |
