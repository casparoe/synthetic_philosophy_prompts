      *   *Hegel's Text:* The core issue is indeed the *asymmetry*. The Master wants to be recognized as an independent consciousness. To be valuable, recognition must come from another *independent* consciousness. But by enslaving the other, the Master makes them *dependent*. Therefore, the recognition is worthless.
      *   *Nuance:* It's not just "equality" in a modern liberal sense. It's ontological. The Master wants to be "Being-for-self" confirmed by another "Being-for-self." If the other is reduced to a "thing" (Being-for-other), the confirmation fails.
      *   *Answer:* It's both. The failure is specific (recognizer must be independent), which *implies* mutuality/equality eventually (as seen in the later "Spirit" chapter), but in the Lord/Bondage section, the immediate point is the contradiction in the Master's desire.

