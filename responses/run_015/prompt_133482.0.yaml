      *   **Question 1:** Is Hegel saying recognition must be mutual/equal, OR is the failure specific (Master needs recognition from someone both subordinate *and* independent)?
      *   **Question 2:** Can they compare this to John Searle's "collective intentionality" and "status functions" (Master assigns "slave" status without collective backing, making it unstable)? Is this defensible or anachronistic/forcing it?
