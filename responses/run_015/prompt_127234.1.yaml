          1.  Introduction: The Registry as a Philosophical Artifact.
          2.  The Retrospective Condition: Provisional Authority and Epistemic Humility.
          3.  The Reimbursement Condition: Fair Play and the Commodification of Conscience.
          4.  Internal Tensions: Vindication vs. Penalty.
          5.  Alternative Theoretical Operators (Underdetermination).
          6.  Institutional Modifications for Competing Accounts.
          7.  Conclusion.

      *(Self-Correction during drafting the "Gambling" section)*: Make sure to distinguish between *moral* gambling and *political* betting. The registry frames it as political risk-sharing.
      *(Self-Correction during drafting the "Debt" section)*: Highlight the distinction between *punishment* (retributive) and *reimbursement* (restorative/cost-covering). The registry mixes them.

  7.  **Final Review against Prompt:**
