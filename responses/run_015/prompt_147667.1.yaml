      *   *Action-Dependence:* If $Ch(A)$ depends on $Cr(A)$, the principle becomes $Cr(A) = Ch(A | Cr(A) = x)$. It must allow for fixed points. Uniqueness is *not* a desideratum; rational indeterminacy is possible.
