answer: |-
  For an embedded agent, a chance-credence principle must function as a dynamic norm of rationality rather than a static metaphysical identity. Your neutrality constraint between Humean and non-Humean accounts is maintainable, but it exacts a cost: it prevents the principle from resolving the admissibility problem internally. You can remain neutral on what chance *is*, but you cannot remain neutral on how chance *interfaces* with evidence without leaving a gap in the norm's specification.

  Here are the adequacy conditions required for the principle to govern an embedded agent.

  **1. Measure-Zero Congruence.** In continuous outcome spaces, the principle must not equate credence with point-chance, as this forces zero credence over an exhaustive partition. The principle must require that the agent's credence *density* function matches the chance *density* function. Regularity (non-zero credence for all possibilities) is a taste, not a requirement; the requirement is congruence. The principle must be formulated over algebras of propositions closed under the relevant topology, not atomic outcomes.

  **2. Fixed-Point Sensitivity.** Where chances depend on the agent's credences or actions (e.g., market panic), the principle must function as a constraint equation: $Cr(A) = Ch(A \mid Cr(A) = x)$. It must allow for cases with no solution (rational suspension), one solution (determinate deference), or multiple solutions (rational indeterminacy). The demand for a unique verdict is a prejudice inherited from static models; for an embedded agent, rational permissiveness is a feature, not a bug.

  **3. Relativized Deference.** The agent often knows chances conditional on setups she cannot identify. The principle must not require an unrelativized chance as input. The object of deference is the chance conditional on the agent's total evidence regarding her location or setup. If the agent knows $Ch(A \mid S_1) = x$ and $Ch(A \mid S_2) = y$ but not which $S$ obtains, the norm governs her weighted average, not a mythical global chance.

  **4. Silence on Gaps.** Where no determinate chance exists yet (only a chance of a future chance), the principle owes no verdict. Principled silence is not a defect. The norm applies only when the chance function is defined for the proposition at the time of evaluation.

  **5. Scope Limitation on Aggregates.** Where the agent knows only finite frequencies without single-case chances, the principle should refuse application. This is not a failure of the norm but a boundary condition. Extending the norm here would conflate chance with frequency, violating your neutrality constraint.

  **6. Undermining Tolerance.** The principle must remain coherent even if the actual future is evidence against the current chance function (undermining). Tolerance here is not a camp preference but a logical necessity for an embedded agent who cannot rule out undermining futures a priori. If the principle breaks under undermining, it fails for any agent who admits Humean supervenience is possible.

  **7. Non-Circular Admissibility.** The principle must distinguish evidence that is "admissible" (compatible with deference) from evidence that is not. This notion must not be defined circularly as "evidence such that deference is correct." However, a fully non-circular specification is likely unachievable without metaphysical commitment (e.g., defining admissibility as "historical evidence" presupposes a view on time and chance). The cost of neutrality is that admissibility must remain a primitive placeholder in the formalism.

  **Adjudication of Suspects.**
  *Diachronic Dutch Bookability:* This belongs off the list. Resistance to exploitation is a pragmatic consequence of coherence, not a constitutive norm of chance-credence linkage. An agent could satisfy the chance norm yet be diachronically incoherent due to other failures; the chance principle itself should not bear the burden of full dynamic coherence.
  *Deference Schema Unification:* This also belongs off the list. While elegant, deriving chance deference from general expert deference obscures the unique metaphysical weight of chance. Chance is not merely a better-informed agent; it is the objective guide. Unification is a theoretical virtue, not an adequacy condition.

  **Incompatibilities and Exclusion.**
  There is a tension between **Undermining Tolerance** and **Non-Circular Admissibility**. If you demand the principle handle undermining futures (required for Humean compatibility), you generally must abandon the standard admissibility clause in favor of conditionalizing on total evidence (the "New Principle" approach). However, if you retain the standard admissibility clause, you cannot handle undermining without metaphysical fixes.
  The single requirement that does the most work in excluding otherwise attractive formulations is **Non-Circular Admissibility**. It is the bottleneck. Most formulations fail because they either define admissibility circularly (as "evidence that doesn't violate the principle") or they define it substantively (as "past and present") which violates neutrality or fails in action-dependent cases.

  **Evaluation of Contenders.**
  1.  **Original Unconditional Formulation:** Identifies $Cr(A)$ directly with $Ch(A)$ given admissible evidence.
  2.  **Time-Restricted Reformulation:** Restricts the proposition to the outcome's holding at the time of the chance to avoid undermining.
  3.  **Chance-as-Expert Treatment:** Derives deference from a general principle about deferring to better-informed probability functions, conditionalizing on total evidence.

  | Criterion | Original Unconditional | Time-Restricted Reformulation | Chance-as-Expert |
  | :--- | :--- | :--- | :--- |
  | **Measure-Zero & Action** | Fails (forces 0 credence; no fixed-point) | Partial (handles time, not feedback) | Pass (handles density & fixed-points) |
  | **Undermining & Admissibility** | Fails (breaks on undermining) | Pass (avoids undermining) | Pass (dissolves admissibility) |
  | **Neutrality & Scope** | Fails (presupposes determinate chance) | Partial (restrictive on gaps) | Pass (silent on gaps/aggregates) |

  The **Chance-as-Expert** treatment scores highest because it dissolves the admissibility problem by treating chance as a guide conditional on total evidence, satisfying the embedded agent's need to act on partial information without metaphysical prejudice. The **Original** fails primarily on Undermining and Action-Dependence. The **Time-Restricted** view saves Undermining but at the cost of applicability to action-dependent chances, where the chance at $t$ depends on the act at $t$. For your dissertation, the Expert treatment offers the most robust norm for an embedded agent, provided you accept that "deference" is the primitive notion rather than "admissibility."
