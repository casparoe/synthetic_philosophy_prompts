answer: |-
  # DECISION TREE: IS THE EXPANDING CIRCLE MORAL PROGRESS?

  **Instructions:** Answer the following questions based on the diagnostic cases: *(A) Rising concern for animals; (B) Decline in violence/punishment; (C) Solicitude for future people; (D) Re-hardening toward immigrants.*

  ```text
  START: What explains the historical change in treatment?
  │
  ├── Q1. [CONSTRAINTS vs. PSYCHOLOGY] 
  │   Looking at the decline in violence (Case B): Was this driven primarily 
  │   by external costs/state capacity, or by internal motivational shifts?
  │   │
  │   ├── External Constraints ──────────────────────────────┐
  │   │                                                      │
  │   └── Internal Shifts ────────────────────────────────┐  │
  │                                                       │  │
  ├── Q2. [COMPLIANCE vs. CONTENT]                        │  │
  │   Looking at slavery/colonialism: Did agents fail to  │  │
  │   act on beliefs they *already held*, or adopt *new*  │  │
  │   beliefs?                                            │  │
  │   │                                                   │  │
  │   ├── Compliance Improved (Beliefs Constant)          │  │
  │   │   └── LEAF 1: HYPOCRISY-REDUCTION VIEW            │  │
  │   │       (Progress = living up to existing norms)    │  │
  │   │                                                   │  │
  │   └── Content Changed (New Beliefs) ───────────────┐  │
  │                                                    │  │
  ├── Q3. [ALLOCATION]                                 │  │
  │   Looking at animals vs. nearby poor (Case A):     │  │
  │   Does extending concern require withdrawing it    │  │
  │   from others?                                     │  │
  │   │                                                │  │
  │   ├── Yes (Zero-Sum)                               │  │
  │   │   └── LEAF 2: BUDGET VIEW                      │  │
  │   │       (Expansion = redistribution, not growth) │  │
  │   │                                                │  │
  │   └── No (Positive-Sum) ────────────────────────┐  │
  │                                                 │  │
  ├── Q4. [ONTLOGY OF CARE]                         │  │
  │   Looking at rivers/chatbots/future (Case C):   │  │
  │   Do we grant these objects *moral standing*    │  │
  │   or merely *psychological care*?               │  │
  │   │                                             │  │
  │   ├── Care without Standing                     │  │
  │   │   └── LEAF 3: WIDENING-WITHOUT-STATUS       │  │
  │   │       (Objects of care expand; rights don't)│  │
  │   │                                             │  │
  │   └── Moral Standing Granted ────────────────┐  │
  │                                              │  │
  ├── Q5. [TRAJECTORY]                           │  │
  │   Looking at immigrants/out-groups (Case D): │  │
  │   Is the expansion monotonic or reversible?  │  │
  │   │                                          │  │
  │   ├── Reversible/Context-Dependent           │  │
  │   │   └── LEAF 4: FRAGMENTED VIEW            │  │
  │   │       (Progress is non-linear/sectoral)  │  │
  │   │                                          │  │
  │   └── Monotonic (Long-run) ───────────────┐  │
  │                                           │  │
  ├── Q6. [GROUNDING]                          │  │
  │   If history ran again, would the same    │  │
  │   moral conclusions emerge?               │  │
  │   │                                       │  │
  │   ├── Yes (Convergence)                   │  │
  │   │   └── LEAF 5: REALIST TRACKING        │  │
  │   │       (Circle widens toward truth)    │  │
  │   │                                       │  │
  │   └── No (Contingency)                    │  │
  │       └── LEAF 6: NOTHING-MI-HAPPENED     │  │
  │           (Change = drift, not discovery) │  │
  │                                           │
  └── (From Q1: External Constraints) ──────────┘
      │
      └── LEAF 7: PACIFICATION VIEW
          (Behavior improved; moral belief irrelevant)
      
      └── [LOGICAL GAP] ───────────────────────────┐
          Can External Constraints track Truth?    │
          └── LEAF 8: UNDEFENDED CELL              │
              (Pacification + Realist)             │
              Status: Unattractive/Undefended      │
                                                   │
  ```

  ### TA NOTES: LOGICAL SPACE & INDISTINGUISHABILITY

  **1. The Empirical Equivalence Zone (Leaves 5 & 6)**
  The **Realist Tracking** and **Nothing-Mind-Independent-Happened** views agree on all actual historical data. They are only separable via counterfactuals.
  *   **The Separating Question:** *"If the balance of power in the 19th century had favored slave-holding states, would slavery still be morally wrong today?"*
      *   **Realist:** Yes. (Truth is invariant to power).
      *   **Nothing-MI:** No (or the question is category error). (Morality is contingent on the victors/culture).

  **2. Empty Cells & Gaps**
  *   **Pacification + Realist (Leaf 8):** *Undefended.* It is unclear how state capacity alone could "track" mind-independent truth without internal belief change. Usually treated as incoherent, but logically possible if constraints are providential.
  *   **Budget + Realist:** *Unattractive.* If moral truth is finite (zero-sum), it implies helping animals *makes* us worse to the poor in a truth-tracking sense, not just a resource sense. Rarely defended.
  *   **Hypocrisy + Pacification:** *Incoherent.* One claims beliefs existed but were ignored; the other claims beliefs were irrelevant due to costs.

  **3. Diagnostic Case Mapping**
  *   **Animals:** Tests **Budget** (did concern for poor drop?) vs. **Widening-w/o-Status** (do trees have rights?).
  *   **Violence:** Tests **Pacification** (Foucault/Pinker) vs. **Hypocrisy** (religious norms finally enforced).
  *   **Future People:** Tests **Widening-w/o-Status** (can non-existents have standing?).
  *   **Immigrants:** Tests **Fragmented** (is the circle shrinking here?) vs. **Realist** (is this a temporary blip?).
