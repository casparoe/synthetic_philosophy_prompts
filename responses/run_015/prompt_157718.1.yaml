answer: |-
  ### 1. Precise Restatement of Position

  Your position is a hybrid normative framework for intertemporal obligation, composed of three distinct clauses:

  1.  **The Anti-Arbitrarity Clause:** You reject *pure time preference* (discounting welfare solely because it occurs at $t+n$ rather than $t$). You regard time as a morally neutral coordinate, analogous to space. Discriminating against future individuals based solely on temporal location is ethically equivalent to spatial discrimination.
  2.  **The Institutional Proximity Clause:** You accept that obligations may effectively diminish over time, but only as a derivative function of *causal and institutional connectivity*. Obligations are mediated by governability, feedback mechanisms, and shared institutional structures. As these decay over time, the *capacity* to fulfill obligations or the *strength* of the reciprocal relationship weakens. This creates an *effective* discount rate that is descriptive (based on causal friction) rather than normative (based on time itself).
  3.  **The Empirical Value-Drift Clause:** You allow for reduced investment in the future if future agents hold values incommensurable with present ones. However, this is not an a priori assumption. It requires empirical tractability: there must be a measurable probability of value divergence. Without evidence of drift, value alignment is presumed; with evidence, expected value is adjusted downward.

  **Summary:** You advocate for **Temporal Cosmopolitanism constrained by Causal Connectivity and Empirical Value Alignment.** You seek to replace the ethical parameter of "time" with the empirical parameters of "connection" and "alignment."

  ---

  ### 2. Systematic Mapping of Exposure

  To test this view, we must examine whether the empirical parameters you introduce (connectivity, alignment) can sustain the normative weight you place on them without collapsing back into the arbitrary time preference you reject.

  #### A. Formal Defeaters (Decision Theory & Economics)

  **1. The Proxy-Collapse Theorem (Fatal)**
  *   **The Argument:** In formal modeling, if the decay function of "institutional proximity" correlates perfectly or near-perfectly with temporal distance, the distinction between your view and pure time preference becomes operationally null.
  *   **The Mechanism:** If institutional connectivity $C(t)$ is modeled as a function where $C(t)$ decays exponentially with time ($C(t) = e^{-\lambda t}$), then your welfare function $W = \sum U_t \cdot C(t)$ is mathematically identical to standard discounted utilitarianism $W = \sum U_t \cdot e^{-\delta t}$.
  *   **The Exposure:** Unless you can identify variables that determine connectivity *independently* of time (e.g., specific technological durability, constitutional rigidity), "institutional proximity" is merely a proxy for time. If the only predictor of how well we can govern or interact with the future is "how far away it is," you have smuggled pure time preference in through the back door under the label of "causal friction."

  **2. The Infinite Horizon Problem (Fatal)**
  *   **The Argument:** Even with connectivity decay, if the future is infinite and population is non-zero, the sum of obligations may remain infinite or indeterminate without a discount rate strictly greater than the growth rate of impact.
  *   **The Mechanism:** Standard growth economics (Ramsey-Cass-Koopmans framework) shows that without a pure time discount rate, the optimal savings rate approaches 100% (we should consume almost nothing now to invest for the future). Your "Institutional Proximity" clause acts as a probability weight on impact. If institutional connectivity decays slower than the potential growth of future welfare (e.g., via technology), the "effective discount rate" remains too low to avoid the "tyranny of the future."
  *   **The Exposure:** To avoid paralyzing over-saving, your connectivity decay must be steep. If you argue it *must* be steep to make the math work, you are deriving a normative constraint (we shouldn't save 100%) from a mathematical necessity, which looks like reinstating time preference to avoid absurd conclusions.

  **3. The Endogeneity of Feedback (Awkward)**
  *   **The Argument:** Feedback loops are not exogenous constraints; they are objects of choice.
  *   **The Mechanism:** If we decide to build institutions that last 500 years rather than 50, we increase "institutional proximity." If obligation depends on proximity, we have a duty to build durable institutions to increase our duty to the future.
  *   **The Exposure:** This creates a circularity. We are obligated to the future *because* we lack connection, but we are obligated to build connection *because* we are obligated to the future. If we fail to build that connection, does the obligation vanish? If yes, you allow agents to extinguish obligations by neglecting institutional durability. If no, the "proximity" clause is irrelevant.

  #### B. Empirical Defeaters (History & Sociology)

  **4. The Value-Stability Anomaly (Fatal)**
  *   **The Argument:** Your view relies on "Value Drift" being empirically tractable. If historical data shows core moral values are more stable than institutional structures, your justification for reducing investment weakens.
  *   **The Mechanism:** If empirical study suggests that while regimes change (low institutional proximity), fundamental conceptions of suffering, flourishing, and justice remain constant (high value alignment) over millennia, then the "Value-Drift Clause" cannot be triggered.
  *   **The Exposure:** You are left with high value alignment and decaying institutional proximity. If institutional proximity is just a proxy for time (see Defeater 1), and value alignment remains high, you are forced back into Temporal Cosmopolitanism with no effective discounting, reviving the Infinite Horizon Problem.

  **5. The Epistemic Black Box (Awkward)**
  *   **The Argument:** "Empirically tractable" value drift is likely impossible to measure *ex ante*.
  *   **The Mechanism:** We cannot observe future values. Any probability assignment regarding value divergence is necessarily a projection of *current* values onto the future. To say "there is a 20% chance they won't value X" is a current valuation.
  *   **The Exposure:** This makes the "Value-Drift" clause unfalsifiable. You can always claim uncertainty to justify lower investment, but that uncertainty is generated by your own epistemic limits, not an empirical feature of the future. This risks becoming a "blanket excuse" you explicitly sought to avoid.

  #### C. Conceptual Defeaters (Symmetry & Definitions)

  **6. The Asymmetry of Causation (Fatal)**
  *   **The Argument:** You claim time is parallel to space. But spatial distance allows bidirectional causality (feedback); temporal distance (future) allows only unidirectional causality.
  *   **The Mechanism:** "Institutional Proximity" relies on feedback loops. Future people cannot feedback to us. Therefore, "Institutional Proximity" to the future is structurally different from "Institutional Proximity" to distant spatial contemporaries.
  *   **The Exposure:** If the mechanism (feedback) that justifies weakening obligations is impossible in the temporal case by definition, then the weakening is not due to "proximity" but due to "time." The structural parallel to spatial discrimination breaks down. You cannot use a spatial analogy to justify a temporal constraint if the causal physics differ.

  **7. The Contingent Preference Collapse (Awkward)**
  *   **The Argument:** "Institutional Proximity" may reduce to "Contingent Preference."
  *   **The Mechanism:** We care more about those we can govern or who can feedback to us because it satisfies *our* desire for control or reciprocity.
  *   **The Exposure:** If the reason we weight the future less is that *we* prefer reciprocal relationships, this is a preference of the present agent, not an objective feature of the obligation. This collapses into a form of agent-relative partiality, which contradicts the cosmopolitan impulse of the first clause.

  ---

  ### 3. Ranking the Defeaters

  **Fatal (Must be resolved or the view fails):**
  1.  **The Proxy-Collapse Theorem:** If connectivity decays solely as a function of time, your view is semantically distinct but mathematically identical to the pure time preference you reject.
  2.  **The Asymmetry of Causation:** If "feedback" is required for your proximity clause, it cannot apply to the future (who cannot feedback). This destroys the spatial-temporal analogy.
  3.  **The Infinite Horizon Problem:** If your effective discount rate (derived from connectivity) is not high enough to converge the welfare sum, you are forced into absurd levels of present sacrifice, making the view practically untenable.

  **Merely Awkward (Requires refinement but not abandonment):**
  1.  **The Epistemic Black Box:** The difficulty of measuring value drift makes the clause hard to operationalize, but does not logically invalidate it.
  2.  **The Endogeneity of Feedback:** The circularity of building institutions to create obligations is a policy challenge, not a logical contradiction.
  3.  **The Contingent Preference Collapse:** Reducing proximity to present preference weakens the moral objectivity but preserves the decision rule.

  ---

  ### 4. Strategy for the Committed Defender

  **What to Concede:**
  *   **Concede the Spatial Analogy is Imperfect:** Acknowledge that time is not *exactly* like space due to unidirectional causality. Retreat from the claim that they are "structurally parallel" to the claim that they are "morally analogous regarding arbitrary coordinates." Do not rely on feedback loops as the *sole* justification for proximity; rely on *causal leverage* instead (our ability to affect them, not their ability to affect us).
  *   **Concede the Need for a Minimum Discount Floor:** Admit that to solve the Infinite Horizon Problem, the decay of institutional connectivity must be treated as having a minimum bound. You cannot let the math dictate 100% savings. You must accept that "institutional connectivity" includes a parameter that effectively functions as a discount rate, even if you label it "probability of impact."

  **What to Dismiss:**
  *   **Dismiss the "Value Stability" Objection:** Argue that value drift is not about core morality (suffering is bad) but about *weighting* and *trade-offs* (environment vs. growth). This remains empirically tractable via historical analysis of preference shifts without requiring prophecy.
  *   **Dismiss the "Proxy-Collapse" Charge (with a caveat):** Argue that while connectivity correlates with time, it is not *defined* by time. If we invent a time-capsule institution that lasts 1,000 years, connectivity remains high despite temporal distance. This proves the variable is distinct from time, even if they usually move together.

  ---

  ### 5. Assessment of Unfalsifiability

  **Is the position qualified into unfalsifiability?**
  There is a high risk. By splitting the justification into "Institutional Proximity" and "Value Drift," you create two adjustable dials.
  *   If obligations seem too strong, you turn up "Value Drift."
  *   If obligations seem too weak, you turn up "Institutional Durability."

  **Is this insulation a defect?**
  *   **Yes, if:** The parameters cannot be measured independently of the intuitive conclusion they are meant to justify. If you determine "connectivity is low" *because* you feel we owe the future less, the theory is post-hoc rationalization.
  *   **No, if:** You commit to *ex-ante* metrics. For example, you must define "Institutional Proximity" using measurable variables (e.g., half-life of political constitutions, durability of storage media) *before* calculating obligations. You must define "Value Drift" using historical rates of moral change (e.g., shifts in rights discourse per century).

  **Verdict:** The view is currently **vulnerable to insulation**. To cure this, you must bind the "empirical tractability" clause to specific, pre-committed metrics. If you allow the metrics to be chosen based on the desired moral outcome, the view is scientifically vacuous, even if morally comforting. A defensible version of your view requires a "Measurement Protocol" that restricts your ability to adjust the connectivity and drift parameters to fit your intuitions. Without that protocol, the view is a sophisticated form of intuition pumping.
