  2.  **Step 1: Precise Restatement:**

      *   I need to capture the three pillars:
          1.  **Anti-Discounting Principle:** Time itself is not a morally relevant coordinate (analogous to space).
          2.  **Institutional Proximity Constraint:** Obligations are mediated by causal/institutional connectivity (governability/feedback), which decays over time, creating a *derived* discount rate that isn't *pure* time preference.
          3.  **Value Drift Contingency:** Future welfare calculations are subject to empirical uncertainty regarding value alignment; if future values diverge significantly, current investment loses expected value, but this must be measurable, not assumed.
      *   *Synthesis:* The view is a form of "Causal-Connectivity Utilitarianism" over time. It rejects $\delta$ (pure time discount factor) in the social welfare function but allows effective discounting via probability of impact ($p$) and value alignment ($v$). $Expected Value = Benefit \times p(connectivity) \times v(alignment)$.

  3.  **Step 2: Systematic Mapping of Exposure (The "Stress Test"):**

      *   I need to look for formal, empirical, and conceptual attacks.
      *   *Formal:* Social choice, growth theory, decision theory.
