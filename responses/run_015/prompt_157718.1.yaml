prompt: |-
  You are an expert in moral philosophy and intertemporal decision theory. Think step-by-step: first restate the position I describe precisely, then systematically map its exposure.

  I hold that pure time preference—discounting future welfare solely because it occurs later—is ethically arbitrary, structurally parallel to spatial discrimination that ethics already rejects. The standard objections (personal-identity arguments about future selves, rational-consistency arguments about exponential discounting) do not settle the matter for me, because they miss a deeper tension. Rejecting pure discounting seems to force what I will call temporal cosmopolitanism: treating obligations to people in 2124 as structurally identical to obligations to people 10,000 miles away. That conflicts with an intuition I want to preserve, namely that institutional proximity—governability, feedback loops, shared mechanisms—can legitimately weaken obligations without being mere time preference. At the same time, I want to distinguish this from discounting via value drift: the claim that future generations may come to hold values genuinely incommensurable with ours, which could justify lower present investment without collapsing into pure time preference, but only if it remains empirically tractable rather than a blanket excuse.

  What would genuinely count against this combined view? I want more than the familiar repertoire. Which formal results—in social-choice theory, growth economics, or decision theory—would show that temporal cosmopolitanism is either unavoidable or avoidable without smuggling in hidden discounting? Which empirical findings about actual long-run value change, or about institutional transmission across centuries, would make value-drift arguments live versus unfalsifiable? Which conceptual collapses should worry me—say, if institutional proximity reduces to contingent preference, or if value-drift reasoning applies symmetrically to spatially distant cultures? Rank the defeaters from fatal to merely awkward. Say which ones a committed defender of this view should concede as damaging, and which they should dismiss. Finally, assess whether the position has been qualified into unfalsifiability—if so, is that insulation a defect for a view of this kind?

  Be precise, avoid bibliographic recommendations or citation lists, and do not invoke obscure named theories that require external lookup.
