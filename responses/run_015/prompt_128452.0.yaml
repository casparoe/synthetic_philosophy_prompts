      *   **Structural-Affective Critic (A):** Music works through structural patterns that *trigger* affective responses isomorphic to volition. It's psychological/phenomenological, not necessarily ontological. Music mimics the *feeling* of will, not the Will-in-itself. Atonality is a test case for structural limits.

