          4.  *Harmony & Conflict:* Dissonance/Consonance. S says it's the Will fighting itself. A says it's syntactic tension. *Agreement:* Harmonic progression enacts a drama of conflict and resolution that listeners perceive as emotionally significant, regardless of semantic labeling.

      *   **Disagreements Table:**
          *   Need specific wording that both can accept as *their* interpretation of the claim.
