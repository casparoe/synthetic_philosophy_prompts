  9.  **Final Polish:** Ensure the distinction between *error* (mistake) and *mendacium* (lie) is sharp, as that addresses the speech-act question. Ensure the distinction between *fiction* and *lie* is clear (contextual cues).

  **(Self-Correction Note):** I need to make sure I don't get bogged down in the 8 types of lies. The user specifically asked to avoid recap. Focus on the *mechanism*.

