answer: |-
  Your premise is not confused. In fact, your intuition is philosophically sound: the slogan "he was a man of his time" is a semantic sinkhole that conflates explanation with exoneration. It collapses distinct logical claims into a single comforting phrase. Disambiguating it is not only possible but necessary for the argument you are having.

  Below is the conceptual architecture you requested, structured as a menu of four distinct claims. Following that is an analysis of the asymmetry in your friend's application of the phrase.

  ### Part I: The Menu of Claims

  Here are the four distinct logical workloads the phrase might be carrying. For each, I have evaluated its status (trivial/substantive/false), its power to block condemnation, and its empirical requirements.

  #### 1. The Descriptive-Historical Claim
  *   **The Claim:** "The belief or practice in question was statistically normative or dominant within the agent's specific social context."
  *   **Status:** **Substantive.** It is a factual claim about the distribution of beliefs in a specific population at a specific time. It is not trivial because it can be false (e.g., if the figure held a view that was actually radical for their time).
  *   **Supports Withholding Condemnation?** **No.** This commits the naturalistic fallacy (deriving an 'ought' from an 'is'). That everyone believed the earth was flat does not make the belief true; that everyone practiced slavery does not make it moral. This claim explains *why* they acted, but provides no moral cover.
  *   **Empirical Requirements:** **High.** You need data on belief distribution. Was slaveholding universal in 1776 Virginia? (Yes, among elites). Was imperial domination universal in 1492 Europe? (Yes, but methods varied). Was racism universal in 1940s Britain? (Contested). Without this data, the claim is an assumption.

  #### 2. The Normative-Historical Claim
  *   **The Claim:** "Moral obligation is time-relative. The agent was bound only by the moral standards recognized in their era, not by ours."
  *   **Status:** **Philosophically Contested.** This is not a historical fact but a meta-ethical stance (Moral Relativism vs. Moral Realism). If you accept Moral Realism (some acts are always wrong), this claim is **False**. If you accept Relativism, it is **Substantive**.
  *   **Supports Withholding Condemnation?** **Yes, if accepted.** If morality is strictly bound by era, retroactive judgment is a category error. However, this logically prevents you from praising them as "great" by modern standards either (you cannot have it both ways).
  *   **Empirical Requirements:** **Low.** This requires philosophical consistency, not historical data. However, it requires knowing what the "recognized standards" of the era actually were (which loops back to empirical history).

  #### 3. The Counterfactual-Capacity Claim
  *   **The Claim:** "Given the epistemic ecology (education, available arguments, information access) of their time, the agent literally could not have conceived of the moral alternative or acted upon it."
  *   **Status:** **Often False for Elite Figures.** This is a claim about cognitive and practical possibility. For powerful, educated figures, this is frequently empirically false. Dissenting views usually existed, even if marginalized.
  *   **Supports Withholding Condemnation?** **Yes, if true.** Moral responsibility generally requires the capacity to do otherwise (*ought implies can*). If they literally could not have known better, blame is negated.
  *   **Empirical Requirements:** **Very High.** You must prove the *absence* of contrary viewpoints. Did abolitionist arguments exist in Jefferson's lifetime? (Yes). Did critics of colonial cruelty exist in Columbus's? (Yes, immediately following, and concurrently within the Church). Did critics of imperialism exist for Churchill? (Yes).

  #### 4. The Excusatory-Culpability Claim
  *   **The Claim:** "While the agent knew (or should have known) the act was wrong, the social, political, or economic cost of acting morally was so prohibitive that we should mitigate their blame."
  *   **Status:** **Substantive.** This acknowledges the wrong but argues for mitigation based on duress or consequentialist trade-offs (e.g., "If he freed his slaves, the political union would have collapsed").
  *   **Supports Withholding Condemnation?** **Partially.** It softens condemnation but admits the act was wrongful. It shifts the figure from "villain" to "compromised actor."
  *   **Empirical Requirements:** **High.** You need to know the specific constraints they faced. Could Jefferson have freed his slaves without ruin? (Debatable, but he chose debt over emancipation). Could Churchill have abandoned empire without political suicide? (Likely).

  ---

  ### Part II: The Asymmetry Analysis

  Your friend applies the defense to Jefferson (sympathy), rejects it for Columbus (condemnation), and hedges for Churchill. Based on the menu above, here is where their commitments are likely shifting inconsistently.

  #### 1. Jefferson vs. Columbus (The "Epistemic Access" Inconsistency)
  *   **The Friend's Stance:** Jefferson gets a pass; Columbus does not.
  *   **The Inconsistency:** This usually relies on a hidden shift between **Claim 3 (Capacity)** and **Claim 1 (Descriptive)**.
  *   **The Reality:**
      *   **Jefferson:** Claim 3 is weak. He lived during the Enlightenment; abolitionist arguments were available to him. He chose to ignore them. Claim 1 is strong (slaveholding was normative).
      *   **Columbus:** Claim 3 is also weak. Theological arguments against the enslavement of indigenous peoples existed immediately (e.g., Queen Isabella's initial restrictions, later Las Casas). Claim 1 is strong (conquest was normative).
  *   **The Diagnosis:** Your friend likely treats Jefferson as a **Claim 4 (Excuse)** case ("He was trapped by the economy of Virginia") but treats Columbus as a **Claim 2 (Normative)** failure ("Genocide is always wrong, regardless of the era").
  *   **Why it shifts:** Proximity. Jefferson feels "modern" enough that we understand his constraints (Claim 4), whereas Columbus feels "alien," making his cruelty seem like a character flaw rather than a structural constraint. This is an affective bias, not a principled distinction.

  #### 2. Churchill vs. The Others (The "Progress" Inconsistency)
  *   **The Friend's Stance:** Churchill is "somewhere in between."
  *   **The Inconsistency:** This relies on **Claim 1 (Descriptive)** changing over time.
  *   **The Reality:** By Churchill's time, **Claim 3 (Capacity)** is strongest against him. Anti-imperialist and anti-racist arguments were widely available in the 20th century. Therefore, the "Man of his time" defense should be *weakest* for Churchill, not stronger.
  *   **The Diagnosis:** Your friend is likely conflating **magnitude of harm** with **moral culpability**. They may feel Churchill's "good works" (WWII) outweigh the "bad," whereas Columbus has no "credit" to spend. This is not a "Man of his time" argument; it is a utilitarian calculation disguised as historical context.

  ---

  ### Part III: The Checklist for Your Friend

  To expose the shifting commitments, do not argue the history yet. Argue the structure. Present this checklist to him and ask him to tick which definition he is using for each figure.

  **When you say "He was a man of his time" regarding [Figure], do you mean:**

  1.  **Descriptive:** "Most people around him did the same thing."
      *   *Follow-up:* "Does doing what everyone else does make an action morally neutral? If not, why mention it?"
  2.  **Normative:** "The rules of morality were different then, so he didn't break any rules."
      *   *Follow-up:* "If the rules were different then, can we still call him a 'hero' by today's rules? Or must we stop praising him too?"
  3.  **Capacity:** "He literally could not have known better or acted differently."
      *   *Follow-up:* "Are you sure? Do we have evidence that no one in his circle argued against this? (e.g., Did Jefferson know abolitionists existed?)"
  4.  **Excuse:** "He knew it was wrong, but fixing it would have cost him everything."
      *   *Follow-up:* "Are we saying he is guilty but we forgive him? Or that he is innocent?"

  **The Trap:**
  If he uses **Definition 1** for Jefferson but **Definition 3** for Columbus, he is being inconsistent. (Everyone enslaved people in both eras, but if Jefferson *could* have known better, Columbus likely could have too, given religious strictures against indiscriminate slaughter).

  If he uses **Definition 4** for Jefferson but not Columbus, he is making a claim about **economic dependency** vs. **exploratory freedom**. He must justify why Jefferson's economic dependency excuses moral failure while Columbus's mandate from the Crown does not.

  ### Summary of the Conceptual Architecture

  The slogan is not a single argument. It is a placeholder for one of four distinct logical moves.
  *   **Descriptive** explains but does not excuse.
  *   **Normative** excuses but requires abandoning moral realism (and modern praise).
  *   **Capacity** excuses but is empirically fragile for elite figures.
  *   **Excuse** mitigates but admits guilt.

  Your friend's asymmetry suggests he is not applying a consistent principle of historical judgment. He is likely engaging in **affective triangulation**: he likes Jefferson's political philosophy, so he reaches for **Claim 4 (Excuse)**; he dislikes Columbus's violence, so he insists on **Claim 2 (Normative Universalism)**; he respects Churchill's leadership but dislikes his racism, so he hovers between **Claim 1** and **Claim 4**.

  Pointing this out does not require you to be a historian. It requires you to force him to pick one definition and apply it consistently across all three cases. If he refuses, he admits the phrase is merely an expression of sympathy, not a moral argument.
