      *   *Weaknesses:* Cakes are *types* (a chocolate cake), persons are *tokens* (this specific individual). If I bake a cake, burn it, and bake another with the same recipe, it's a *different* cake. The friend is confusing "same kind of person" with "same person."
      *   *Hidden Assumption:* Persons are defined by their properties (psychological/physical traits) rather than their history.

