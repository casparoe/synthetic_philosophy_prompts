          *   *Severity:* Low/Medium. This is a standard "threshold" view. 1 is the general rule, 2 is the exception. It's logically consistent as a qualified claim, but philosophically it weakens 1.
          *   *Fix:* Acknowledge 2 limits 1.

      *   **Tension D (The Purpose Clash): 3 vs. 5.**
          *   3: Moral admiration (requires agency).
          *   5: Evidential/Archive (requires existence, not necessarily agency).
          *   *Severity:* Medium. Are we admiring the *people* (3) or the *record* (5)?
          *   *Fix:* Clarify the object of admiration.

  5.  **Drafting the Analysis (Iterative refinement):**

