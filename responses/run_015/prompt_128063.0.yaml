          *   *Severity:* Critical. One says myth works, the other says truth is required for *admiration* (distinct from "pull").
          *   *Fix:* Distinguish "aesthetic pull" from "moral admiration."

      *   **Tension B (The Agency Problem): 3 vs. 4.**
          *   3: Quitting must be cheap/available (implies high agency/cost-benefit analysis).
