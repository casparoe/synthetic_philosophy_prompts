      2.  *Content Constraint:* If the cause is evil (subjugation/destruction), admiration is off the table (e.g., Confederacy).
      3.  *Walk-Away Test:* Admiration requires that quitting was cheap/available. If they had nothing to lose (cornered), they aren't admirable.
      4.  *Choice vs. Inheritance:* Inherited causes count just as well as chosen ones.
      5.  *Archive View:* Value is evidential (record of extinct values), like a photo of an extinct animal.
      6.  *Statues:* Glad Confederate statues came down/would vote to remove rest.
      7.  *Myth Tolerance:* Admiration persists even if the story is a later literary construction (e.g., Masada, Kosovo).
      8.  *Reality Constraint:* Can't admire people for things they never did; admiration answers to what actually happened; don't admire made-up figures like real ones.

  3.  **Identify Potential Tensions (Brainstorming Pairs):**

      *   *1 vs. 2:* Form vs. Content. (1 says separable, 2 says content can cancel). *Resolution:* 2 acts as a veto on 1. This is a qualified claim, not necessarily a contradiction, but it creates a boundary condition.
      *   *3 vs. 4:* Walk-Away (agency/cost) vs. Inheritance (lack of choice). If a cause is inherited, did they have a "cheap walk-away"? Often inherited causes (national duty) make walking away expensive (shame, exile). If walking away is expensive, 3 says no admiration. But 4 says inherited is fine. *Tension:* High.
      *   *5 vs. 8:* Archive (value as record/symbol) vs. Reality (must be factual). If it's a "photograph of an extinct value," does the truth of the specific event matter? 5 leans symbolic, 8 leans factual.
      *   *7 vs. 8:* Myth Tolerance vs. Reality Constraint. 7 says I'd feel the pull even if invented. 8 says I don't admire a made-up figure the way I do a real one. *Tension:* Very High. Direct contradiction.
      *   *2 vs. 6:* Content Constraint vs. Statues. These align perfectly. No tension.
      *   *1 vs. 5:* Form (steadfastness) vs. Archive (extinct values). Steadfastness is a virtue, not necessarily an extinct value. But they can coexist.
      *   *3 vs. 5:* Walk-Away (moral agency) vs. Archive (historical record). If it's just a record, does agency matter? 3 implies moral admiration, 5 implies historical curiosity.

