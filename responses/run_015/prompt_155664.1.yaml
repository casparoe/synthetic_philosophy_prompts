          *   Explain that without a theater, there's no "moment of decision."
          *   Use the analogy of a committee vs. a dictator.
          *   Refine "Intentionality": It's not about *when* it happened, but how much the action aligns with the system's long-term narratives.
          *   *Crucial Point:* Unconscious drafts can still be "reasons-responsive."
      *   *Section 2: The Dissolution of the Singular Author.*
