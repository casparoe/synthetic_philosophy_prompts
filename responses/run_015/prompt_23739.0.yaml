          *   TA 1 (1/3): Fix one point, choose the other. Arc length argument.
          *   TA 2 (1/4): Midpoint distribution. Area argument.
          *   TA 3 (1/2): Distance from center. Linear argument.
          *   Crucial point: "At random" is ambiguous in continuous geometry without a specified measure.
      *   **Action Items:** How to implement this. (Update grading keys, maybe add a note to students).
      *   **Future Prevention:** Suggest rewording for future exams (specify the method).

  5.  **Refining the Tone:**
