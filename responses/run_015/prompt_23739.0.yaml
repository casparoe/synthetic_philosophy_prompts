answer: |-
  **MEMORANDUM**

  **TO:** Probability 101 Teaching Assistants
  **FROM:** Chair, Exam Review Board
  **DATE:** October 24, 2023
  **SUBJECT:** Grading Policy for Midterm Problem 4 (Random Chord)

  This memo resolves the discrepancy regarding the grading of the "random chord" problem on last week's midterm. After reviewing the arguments presented, the Board has determined that the problem statement constitutes a classic instance of **Bertrand's Paradox**. The phrase "chosen at random" is mathematically ambiguous in this context without a specified probability measure.

  **Grading Decision**
  Effective immediately, **full credit** will be awarded for any of the three answers currently under debate (1/3, 1/4, or 1/2), provided the student's work is consistent with the method used to derive that answer. Do not penalize students for selecting any of these three specific solutions.

  **Rationale**
  None of the three interpretations proposed by the TAs are incorrect; rather, they correspond to three distinct, valid probability spaces. Each TA correctly identified a standard method for defining "randomness" in geometric probability:

  1.  **The Method of Endpoints (Answer: 1/3):** As argued by the first TA, if we fix one endpoint and choose the second uniformly along the circumference, the chord exceeds the triangle's side length only if the second point falls within a specific 120-degree arc. This yields a probability of 1/3. This is a defensible interpretation of rotational symmetry.
  2.  **The Method of Midpoints (Answer: 1/4):** As argued by the second TA, a chord is uniquely determined by its midpoint. If midpoints are distributed uniformly over the area of the disk, the chord is longer than the triangle's side only if the midpoint falls within a concentric circle of half the radius. The area ratio yields 1/4. This is a defensible interpretation of translational symmetry within the disk.
  3.  **The Method of Radial Distance (Answer: 1/2):** As argued by the third TA, if we choose a direction uniformly and then choose the perpendicular distance from the center uniformly between 0 and the radius, the chord is "long enough" if the distance is less than half the radius. This yields 1/2. This is a defensible interpretation of linear uniformity.

  **Next Steps**
  1.  **Grading:** Update your grading keys to accept all three solutions.
  2.  **Student Communication:** Please append a brief note to the returned exams explaining that the ambiguity was in the question, not their reasoning. We will treat this as a teaching moment regarding the importance of well-defined sample spaces.
  3.  **Future Exams:** For subsequent assessments, questions involving geometric probability must explicitly specify the generation method (e.g., "choose two points uniformly on the circumference") to avoid this ambiguity.

  Thank you for your diligence in identifying this nuance. Your disagreement highlights exactly why this problem remains a staple in probability theory.

  Regards,

  Chair, Exam Review Board
