answer: |-
  **A:** Let us begin with the core commitment of hedonism: that pleasure is the sole intrinsic good. For this to hold, pleasure must be a coherent natural kind. If I claim that pleasure constitutes well-being, there must be *something* that ties the pleasure of a cool drink on a hot day to the pleasure of understanding a complex theorem. I maintain there is a uniform phenomenal quality—a specific hedonic tone—that persists across these radically different intentional objects.

  **B:** And that is precisely where the heterogeneity objection strikes. You are positing a ghost in the machine. I contend that these states share only a positive evaluative stance toward their objects. To say they share a "hedonic tone" is either to describe something so thin it cannot ground a theory of well-being, or to argue in a circle. Let us test your claim against specific cases. Start with the bodily: the relief of warming cold hands.

  **A:** Consider that moment when frozen fingers meet warm air. There is a distinct, palpable sensation. It is a "glow," a spreading comfort. This is not merely the absence of cold; it is a positive presence. If you strip away the hands, the cold, and the heat source, the *feeling* of that relief remains as a qualitative marker. That marker is the hedonic tone. It is the common denominator between warming hands and, say, the satisfaction of solving a logical proof.

  **B:** But look closely at what you are isolating. You describe it as a "glow" or "comfort." These are metaphors borrowed from the thermal experience itself. If I ask you to describe the tone without referencing the warming, the cold, or the relief of pain, you have nothing left to say. What you identify is not a uniform pleasure, but *relief*. Relief is a complex psychological state dependent on a prior negative state. It belongs to a different psychological kind than the joy of discovery. You are mistaking the removal of a negative for the presence of a uniform positive.

  **A:** You argue that I am borrowing from the intentional content—the cold, the heat—to describe the feeling. I concede that articulating the tone without reference to its object is notoriously difficult. Language forces us to point at the source. However, the difficulty of description does not entail the absence of the quality. When the cold fades, the *way* it fades has a specific phenomenology. That "way"—the positive valence of the transition—is the tone. If you deny this, you are left with merely the judgment that "this is good." But well-being is experienced, not just judged. Evaluative unity is insufficient without phenomenal unity. If there is no shared *feel*, then "pleasure" is just a label we slap on disparate things we happen to like, which destroys the hedonist claim that pleasure *itself* is the good.

  **B:** I will address your claim about experience shortly. But first, let us move to your second case: the satisfaction of solving a logical proof. Here, there is no bodily relief. There is no pain being removed. You claim the same "tone" exists here as in the warming hands.

  **A:** It does. It is the "click" of resolution. It is a sense of rightness, a cognitive settling. While less visceral than warming hands, it shares the same directional vector. It pulls you in. It feels *good* in the exact same sense that the warmth feels *good*. The intensity varies, and the location shifts from the fingers to the mind, but the qualitative character of the "goodness" is identical. It is a singular hue of experience, merely painted on different canvases.

  **B:** This is where the circularity charge becomes unavoidable. You say it feels "good in the exact same sense." But how do you verify this sense? You verify it by noting that you seek it. You define the commonality as "that which we pursue." But that is the definition of a positive evaluative stance, not a phenomenal quality. When you solve the proof, you feel *satisfaction*. Satisfaction is about the relation between your capacity and the task. If you strip away the logic, the difficulty, and the resolution, there is no residual "click." You are positing a hidden common feeling to justify grouping these states, but the only evidence for the feeling is that you have already grouped the states. You are defining pleasure as "what all pleasures have in common."

  **A:** I must push back on the charge of circularity. I am not defining pleasure by the fact that we seek it; I am pointing to an introspective datum. I admit that the description borrows from the content—I cannot describe the "click" without the logic—but the *affect* is distinct from the *cognition*. I can feel the satisfaction even if I later learn the proof was flawed. The feeling persists independently of the truth of the object. This suggests the feeling is a substrate that can be attached to various objects. If you reduce this to a mere "evaluative stance," you turn pleasure into a judgment. But I can judge something good without feeling pleasure. Hedonism requires the feeling.

  **B:** You say you can judge something good without feeling pleasure, which implies the feeling is the essential ingredient. But consider the third case: the appreciative pleasure taken in witnessing another person's moral act. This is "elevation." Where is your uniform tone here? There is no relief of pain, as in the hands. There is no personal cognitive resolution, as in the proof. There is often a tightness in the throat, tears, a sense of expansion.

  **A:** Precisely. That sense of expansion *is* the tone. It is the positive valence of admiration. It draws you toward the object, just as the warmth drew you to the fire and the proof drew you to the solution. The intentional objects are radically different—thermal, intellectual, moral—but the *pull* is phenomenologically identical. It is the hedonic glow illuminating the object. Without this shared glow, we cannot explain why all three contribute to well-being in the same currency.

  **B:** But that "pull" you describe is constituted entirely by the object. The tightness in the throat is part of *admiration*, not part of *pleasure*. You are conflating the emotion with the hedonic tone. If you try to isolate the "pleasure" from the "admiration," you find nothing. You are left with a bare assertion that "this is positive." And here I must concede a point to you: ordinary language groups these states together for a non-arbitrary reason. We call them all "pleasure" because they all motivate approach behavior. They all signal that something is going right for the agent.

  **A:** I appreciate that concession. But if they all signal something going right, what is the signal? A signal must have a medium. If the medium is not a phenomenal quality, what is it?

  **B:** The medium is the attitude of favoring itself. It is a formal feature of positive valuation. I do not need a shared sensory substrate to say these states constitute well-being. I only need to know that the subject takes a pro-attitude toward them.

  **A:** And here we reach the impasse. You argue that a formal feature of positive valuation is sufficient to sustain hedonism. I argue that without a shared phenomenal substrate, "hedonism" collapses into "subjectivism." If there is no common feel, then well-being is just "getting what you want," regardless of the experience. But if the experience of the moral act and the experience of the warm hands share no qualitative identity, then the hedonist claim that *pleasure* is the good is empty. It becomes the claim that "whatever feels good is good," where "feels good" is defined differently in every instance.

  **B:** Not empty, but deflated. I contend that hedonism can be sustained solely by this formal feature of positive valuation—an attitudinal hedonism. We do not need a mystical, uniform sensation running through the fabric of consciousness. We only need the unity of the subject's endorsement.

  **A:** Then we disagree fundamentally. I maintain that hedonism needs the shared phenomenal substrate. If the "tone" is not real and uniform, then pleasure is not a natural kind, and hedonism loses its explanatory power. I concede the tone is elusive and hard to describe without borrowing from the object, but I insist it is the only thing that anchors value in experience rather than mere judgment.

  **B:** And I maintain that positing that substrate is a philosophical error born of linguistic convenience. The unity is in the valuation, not the sensation. We can keep the theory of well-being without the ghost of a uniform feeling.

  **A:** Then you have saved the theory of well-being only by abandoning the hedonism that grounds it in feeling.

  **B:** Perhaps. Or perhaps I have saved hedonism from the heterogeneity objection by showing it never needed the feeling in the first place.
