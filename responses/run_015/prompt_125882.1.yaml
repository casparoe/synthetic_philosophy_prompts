  **Title:** The Price of Knowing Better: A Money Pump for the Foresighted

  **The Scenario**
  At the fall club fair, Alex is manning the Philosophy Club booth wearing a limited-edition Crimson pin (Item A), valued by collectors at \$20. Jordan, a shrewd trader from the Economics club, knows Alex has a specific perceptual threshold: Alex cannot distinguish value differences under \$2.00, treating them as indifferent, but strictly prefers the higher value once the gap exceeds that amount. Jordan lines up two other traders: one with a Scarlet pin (Item B, value \$18.50) and one with an Orange pin (Item C, value \$17.00). Jordan proposes a sequence of swaps. Alex knows the entire sequence in advance, knows his own future preferences, and knows he lacks the willpower to bind his future self to a plan. He cannot leave the booth (club duty), but he can pay Jordan to alter the offers.

  **Preferences & Threshold**
  *   **Threshold:** \$2.00.
  *   **Item A (Crimson):** \$20.00.
  *   **Item B (Scarlet):** \$18.50. (Diff \$1.50 $\rightarrow$ **Indifferent** to A).
  *   **Item C (Orange):** \$17.00. (Diff \$1.50 $\rightarrow$ **Indifferent** to B).
  *   **A vs C:** Diff \$3.00 $\rightarrow$ **Strictly Prefer A**.
  *   **Structure:** $A \sim B$, $B \sim C$, but $A \succ C$. (Intransitive Indifference).

  **The Machinery**

  *Standard Pump (No Foresight)*
  | Step | Offer | Victim's State | Decision | Reason | Running Cost |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Start | — | Pin A, \$0 | — | — | \$0 |
  | 1 | Swap A $\to$ B (Free) | Pin B, \$0 | Accept | $A \sim B$ (No loss) | \$0 |
  | 2 | Swap B $\to$ C (Free) | Pin C, \$0 | Accept | $B \sim C$ (No loss) | \$0 |
  | 3 | Swap C $\to$ A (Fee \$1.00) | Pin A, -\$1.00 | Accept | $A \succ C$ (Willing to pay up to \$3) | -\$1.00 |
  | **End** | — | **Pin A, -\$1.00** | — | — | **-\$1.00** |

  *The Foresight Objection*
  Priya is right: if Alex has foresight, the standard pump collapses. At Step 0, Alex compares "Keep A (\$0)" vs. "End with A (-\$1.00)." He prefers the former. He simply refuses Offer 1. In a world where a agent can bind their future self for free, intransitive indifference costs nothing.

  *The Commitment Market (The "Nearby Case")*
  However, Alex knows his future self (Alex-T2) is a distinct moment of agency that cannot be physically forced. Alex-T2 will see Offer 1 as "Free lateral move" and accept it. Alex-T1 cannot stop this internally. He must buy an external constraint. Jordan offers a "Silence Contract": "Pay me \$0.50 now, and I will not make Offer 1."

  | Step | Offer | Victim's State | Decision | Reason | Running Cost |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Start | Buy Silence (\$0.50) | Pin A, -\$0.50 | Accept | Cheaper than Pump (-\$1.00) | -\$0.50 |
  | 1 | **Withheld** | Pin A, -\$0.50 | — | Jordan honors contract | -\$0.50 |
  | 2 | — | Pin A, -\$0.50 | — | — | -\$0.50 |
  | **End** | — | **Pin A, -\$0.50** | — | — | **-\$0.50** |

  **Net Extraction:** \$0.50.
  **Source of Profit:** Jordan's profit comes entirely from Alex's preference structure. Without the intransitive indifference ($A \sim B \sim C \succ A$), there is no pump threat, and Alex would not pay for silence.

  **Analysis: What Breaks the Case?**
  The real work is done by the **combination of foresight with no power to bind a future self**.
  *   **Remove Intransitive Indifference:** If preferences were transitive ($A \succ B \succ C$), Alex would refuse Offer 1 naturally. No pump, no silence fee.
  *   **Remove No-Binding:** If Alex could bind his future self for free (e.g., perfect willpower), he would simply resolve "I will not trade" and keep \$0.50. The extraction vanishes.
  The money is not lost to the trades themselves (which are avoided), but to the *price of avoiding them* in a fragmented self.

  **The Strongest Reply: Rationality is Momentary**
  A defender of Alex might argue: "Alex is not irrational. At T1, paying \$0.50 was optimal (avoiding a \$1.00 loss). At T2 (if he hadn't paid), accepting a free swap ($A \sim B$) was optimal. At T4, paying \$1.00 to regain A ($A \succ C$) was optimal. Every single decision maximized utility *at that moment*. The loss is not an error in reasoning; it is a tragedy of aggregation. Rationality is a demand on moments, not on lives. If the universe forces a loss on a sequence of locally rational choices, that is a feature of the world (or the preference structure), not a bug in the agent's rationality."

  **Where This Bites:**
  This view bites hardest on the intuition that "rational agents don't throw away money." If Alex ends the day with the same pin and less cash, he has objectively failed by his own lights. The "Momentary" defense requires us to accept that an agent can be perfectly rational at every second and yet guarantee their own impoverishment.

  **Conclusion: Defective Preferences or Diachronic Rationality?**
  This case is better read as an argument that **being rational over time requires something extra**. The preferences themselves ($A \sim B \sim C \succ A$) are a plausible description of human perception (a Sorites paradox). Calling them "defective" dismisses how humans actually experience value. The true defect is the assumption that rationality is exhausted by momentary maximization. To be rational is not just to choose well *now*, but to manage the relationship between *now* and *later*. Alex didn't need better preferences; he needed a plan he could enforce. Rationality, therefore, is not just about what you want, but about your power to stand by it.
