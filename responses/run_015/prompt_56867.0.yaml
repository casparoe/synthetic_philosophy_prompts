prompt: |-
  I'm trying to write down, in advance, what any claim of the form "this culture / these values caused that economic outcome" has to be able to do before I'll take it seriously. Weber's protestant ethic argument is the canonical case but I want the rubric to be general, so it can be applied to any culture-as-cause story.

  Give me the desiderata list, each requirement with the concrete case or worry that motivates it. At minimum it needs to deal with:

  - the independence problem: if you only know a group had the relevant ethic because they did the thing the ethic predicts, you've redescribed the outcome, not explained it — so what does an independent measure of the value have to look like?
  - reasons vs causes: Weber wanted an account to be adequate both on the level of meaning and causally, and it's not obvious you can have both at once when the actors' own avowals of the value are partly self-serving rationalizations of what they were doing anyway
  - whose values: aggregate mean vs distribution, and the fact that it's often a minority of intense beleivers doing the causal work while the majority merely assents
  - the retreat to elective affinity: does recasting the claim as an affinity between an ethic and an economic ethos preserve the causal content or quietly give it up?

  Then mark which of your requirements are non-negotiable and which are really just the priors of one camp — institutionalists, rational choice types, cultural sociologists each demand different things and I don't want to smuggle in one camp's preferences as "adequacy." If some subset of the desiderata is jointly unsatisfiable, say so explicitly and show why; that's the part I most want to see. Finish with a couple of sentences on which single requirement does the most work ruling out otherwise attractive stories. No reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested rubric:

  1.  **Analyze the Request:**
      *   **Goal:** Create a rubric (desiderata list) for evaluating claims that "culture/values caused economic outcomes."
      *   **Canonical Case:** Weber's *Protestant Ethic and the Spirit of Capitalism*.
      *   **Specific Issues to Address:**
          *   Independence problem (tautology/redescription).
          *   Reasons vs. Causes (meaning vs. mechanism, rationalization).
          *   Whose values (aggregate vs. distribution/intensity).
          *   Elective Affinity (does it dilute causality?).
      *   **Constraint 1:** Mark requirements as "Non-Negotiable" vs. "Camp-Specific Priors" (Institutionalist, Rational Choice, Cultural Sociologist).
      *   **Constraint 2:** Identify if any subset of desiderata is jointly unsatisfiable (trade-offs/impossibility theorems).
      *   **Constraint 3:** Finish with a single sentence identifying the requirement that does the most work in ruling out attractive stories.
      *   **Constraint 4:** No reading list.

  2.  **Deconstruct the Specific Issues & Draft Requirements:**

      *   *Independence Problem:* If we infer the value *from* the behavior, it's circular.
          *   *Requirement:* Exogenous Measurement. The value must be measurable *before* or *independently of* the economic outcome.
          *   *Motivation:* Tautology (e.g., "They are entrepreneurial because they have an entrepreneurial spirit," where spirit is defined by entrepreneurship).

      *   *Reasons vs. Causes:* Weber wants *Verstehen* (meaning) + Causal Adequacy. Actors might lie to themselves.
          *   *Requirement:* Mechanism Specification. How does the value translate to action? Is it conscious calculation, habit, or social sanction?
          *   *Motivation:* Post-hoc rationalization (actors say "God told me to save," but they saved because banks offered high interest).

      *   *Whose Values:* Averages hide variation. Maybe only 5% drive the change.
          *   *Requirement:* Distributional Clarity. Specify if the claim relies on a mean shift or a tail effect (minority vanguard).
          *   *Motivation:* The "Puritan Minority" problem. If 90% are secular but 10% are zealots who build the banks, saying "the culture caused it" is misleading.

      *   *Elective Affinity:* Weber's fallback. It's not strict causation, but a "fit."
          *   *Requirement:* Counterfactual Stability. Would the outcome have happened without the value, or would the value have persisted without the outcome?
          *   *Motivation:* If it's just an "affinity," is it an explanation or a description of a correlation?

  3.  **Refine and Categorize (Non-Negotiable vs. Camp Priors):**

      *   *Non-Negotiable:* These are logical prerequisites for *any* causal claim, regardless of theory.
          *   Independence (avoiding tautology).
          *   Temporal Precedence (cause before effect).
          *   Counterfactual Coherence (what if the value was absent?).
      *   *Camp Priors:* These reflect specific ontological commitments.
          *   *Rational Choice:* Wants micro-foundations, individual utility maximization. (Skeptical of "values" as irreducible).
          *   *Institutionalist:* Wants to see how values become rules/norms enforced by organizations.
          *   *Cultural Sociologist:* Wants thick description, meaning-making, rejects reduction to material incentives.

  4.  **Identify Joint Unsatisfiability (The "Impossible Trinity" of Cultural Causation):**

      *   This is the critical intellectual heavy lifting.
      *   *Tension:* You want *Independence* (measure values separately), *Mechanism* (show how values drive action), and *Weberian Meaning* (actors' own understanding matters).
      *   *The Conflict:* If you measure values independently (e.g., survey data), you often lose the "meaning" context (Culturalist worry). If you rely on actors' meaning (texts/sermons), you risk rationalization (Rational Choice worry). If you demand strict counterfactuals (Institutionalist/RC), you often can't find them in historical singularities like Weber's.
      *   *Specific Impossibility:* **The "Meaning-Mechanism Trade-off."** To satisfy the *Independence* requirement (objective measure), you often have to strip the value of the specific *Meaning* that motivates the actors (reducing it to a variable). But to satisfy the *Reasons vs. Causes* requirement (Weberian adequacy), you need that specific meaning. You can't fully have an objective, exogenous measure of a subjective state *and* claim that the subjective state's specific content caused the action without circularity.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Item 1: Exogenous Identification.* (Independence). Non-negotiable.
      *   *Item 2: Transmission Mechanism.* (Reasons/Causes). Non-negotiable.
      *   *Item 3: Carrier Specification.* (Whose Values). Non-negotiable.
      *   *Item 4: Counterfactual Robustness.* (Elective Affinity). Non-negotiable.
      *   *Item 5: Micro-Foundations.* (Camp Prior - RC).
      *   *Item 6: Institutional Crystallization.* (Camp Prior - Institutionalist).
      *   *Item 7: Hermeneutic Fidelity.* (Camp Prior - Culturalist).

      *   *Refining the "Impossible" section:* The tension between Exogenous Identification and Hermeneutic Fidelity is the strongest. If I measure "thrift" by bank deposits, I've lost the "religious duty" aspect. If I measure it by sermons, I haven't proved they acted on it.

      *   *Refining the "Single Requirement":* Which one kills the most stories? Usually, it's the Counterfactual. Many stories sound plausible but fail the "what if?" test. Or is it Independence? Independence kills the tautologies. Let's go with **Exogenous Identification** because it stops the "redescription" move which is the most common sin.

  6.  **Review against Constraints:**
      *   Did I cover the 4 specific issues? Yes.
      *   Did I mark Non-Negotiable vs. Priors? Yes.
      *   Did I identify unsatisfiable subsets? Yes.
      *   Did I end with the specific sentence? Yes.
      *   No reading list? Checked.

  7.  **Final Polish:** Ensure tone is analytical and rigorous. Make sure the distinction between "Non-Negotiable" (logic of inference) and "Priors" (theoretical preference) is sharp.

      *(Self-Correction during drafting)*: I need to be careful with "Elective Affinity." Weber used it to soften causality. The rubric needs to test if "affinity" is just a weasel word for correlation. The requirement should be about *discriminating* affinity from causation.
      *(Self-Correction on Unsatisfiability)*: The real tension is between *Independence* and *Meaning*. If you measure the value independently of the outcome, you often measure it as a preference or a trait. But if the value is a *system of meaning*, measuring it as a trait strips the very thing that makes it a cultural cause. This is the "Reification Trap."

  8.  **Finalizing the Output Structure:**
      1.  Introduction (brief).
      2.  The Desiderata List (with Motivation and Status).
      3.  The Impossibility Theorem (Joint Unsatisfiability).
      4.  The Single Most Exclusionary Requirement.

      *(Wait, check the prompt again)*: "Finish with a couple of sentences on which single requirement does the most work..." Okay, two sentences max for the ending.

      Let's assemble.

      *Requirement 1: Exogenous Operationalization.* (Independence).
      *Requirement 2: Transmission Mechanism.* (Reasons vs Causes).
      *Requirement 3: Carrier Specification.* (Whose Values).
      *Requirement 4: Counterfactual Discrimination.* (Affinity vs Cause).
      *Priors:* Micro-foundations (RC), Institutionalization (Inst), Hermeneutic Consistency (Cult).

      *Unsatisfiable Trio:* Exogenous Operationalization + Hermeneutic Consistency + Causal Specificity.
      Why? To measure exogenously, you generalize. To keep meaning, you particularize. To prove causality, you need variation. You usually sacrifice meaning for measurement.

      *Killer Requirement:* Exogenous Operationalization.

      Let's write it.
answer: |-
  ### Desiderata for Cultural Causation Claims

  **1. Exogenous Operationalization**
  *   **The Requirement:** The cultural variable (value, norm, ethic) must be measurable via indicators that do not rely on the economic outcome it is supposed to explain.
  *   **Motivation (The Independence Problem):** If "capitalist spirit" is measured by investment rates, claiming it causes investment is a tautology. You need a thermometer that works independently of the fever.
  *   **Status:** **Non-Negotiable.** Without this, the claim is a redescription, not an explanation.

  **2. Transmission Mechanism**
  *   **The Requirement:** The account must specify the pathway from internal belief to external action (e.g., social sanction, reduced transaction costs, psychological compulsion, or coordination focal point).
  *   **Motivation (Reasons vs. Causes):** Actors often rationalize behavior post-hoc. A claim fails if it cannot distinguish between "I saved because God commanded it" and "I saved because interest rates were high, and God is a convenient excuse."
  *   **Status:** **Non-Negotiable.** Correlation without a specified channel is merely association.

  **3. Carrier Specification**
  *   **The Requirement:** The claim must identify *who* holds the value and whether the causal weight rests on the aggregate mean, a specific subgroup, or an elite vanguard.
  *   **Motivation (Whose Values):** Economic shifts are often driven by intense minorities (e.g., sectarian entrepreneurs) while the majority assents passively. Attributing the outcome to "the culture" obscures whether this was a broad shift or a niche exploitation.
  *   **Status:** **Non-Negotiable.** Aggregation errors lead to false generalizations about societal cohesion.

  **4. Counterfactual Discrimination**
  *   **The Requirement:** The account must demonstrate that the economic outcome would have been less likely (or taken a different form) in the absence of the specific cultural value, holding material conditions constant.
  *   **Motivation (The Retreat to Elective Affinity):** "Affinity" often functions as a weasel word to preserve a causal intuition without causal risk. If the economy would have industrialized anyway due to resource endowments, the "affinity" is epiphenomenal.
  *   **Status:** **Non-Negotiable.** This distinguishes causal drivers from compatible accompaniments.

  **5. Micro-Foundational Consistency**
  *   **The Requirement:** The cultural value must be shown to align with individual incentive structures, or the account must explain why actors do not defect from the value when it is materially costly.
  *   **Motivation:** Rational Choice worry: Values are cheap talk unless enforced by incentives.
  *   **Status:** **Camp Prior (Rational Choice/Institutionalist).** Culturalists argue this reduces norms to prices.

  **6. Hermeneutic Fidelity**
  *   **The Requirement:** The operationalization of the value must respect the actors' own understanding of the meaning, not just the observer's functional categorization.
  *   **Motivation:** Cultural Sociologist worry: Calling a religious ritual "social capital" may predict the outcome but explains nothing about why *that* ritual motivated *those* people.
  *   **Status:** **Camp Prior (Cultural Sociologist).** Institutionalists argue functional outcomes matter more than subjective intent.

  ***

  ### The Impossibility Theorem

  There is a jointly unsatisfiable subset among **Exogenous Operationalization**, **Hermeneutic Fidelity**, and **Causal Specificity**.

  To satisfy **Exogenous Operationalization**, you must translate a subjective value into a generalizable variable (e.g., survey data, text frequency) that can be tested against economic data. However, this translation inevitably strips away the thick, context-specific meaning required for **Hermeneutic Fidelity**. If you preserve the specific meaning (e.g., the precise theological nuance of "calling" in 17th-century Lutheranism), you often lose the variance needed to establish **Causal Specificity** via standard counterfactuals, because the meaning is unique to the time and place of the outcome. You can have a measure that is independent but shallow, or a meaning that is deep but endogenous to the context, but rarely both simultaneously. Most successful claims sacrifice Hermeneutic Fidelity to secure Exogenous Operationalization, effectively turning the "culture" into a black-boxed preference.

  ***

  ### The Exclusionary Constraint

  **Exogenous Operationalization** does the most work ruling out otherwise attractive stories. It is the specific requirement that kills the "spirit of the age" arguments, which are almost always compelling narratives until one asks how the spirit was measured prior to observing the economic behavior it supposedly animated.
