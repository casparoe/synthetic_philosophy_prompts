answer: |-
  # The Gauge and the Flow: A Decision Procedure for the Grants Committee

  ## Preamble: The Currency Declaration
  **Operational Currency:** **Secured Functionings (Capability Floor).**
  We are not measuring happiness (Welfare), nor are we measuring equal shares of purchasing power (Resources). We are measuring the prevention of catastrophic loss in a person's ability to *be* or *do* specific things (Mobility, Communication, Sustenance, Safety).

  **Why this currency?**
  1.  **In-Kind Constraint:** We cannot give cash, so we cannot equalize Resources. We provide specific tools to secure specific functionings.
  2.  **Measurement Limit:** We cannot measure subjective Welfare. We can only observe the threat to Functioning.
  3.  **The Bite:**
      *   *If we switched to Resources:* The ten literacy applicants would rank higher than the one stairlift applicant (10 shares of £600 vs. 1 share of £6,000).
      *   *If we switched to Welfare:* The literacy applicants might rank higher (aggregate satisfaction of 10 vs. 1).
      *   *Under Secured Functionings:* The stairlift ranks higher because loss of mobility is a collapse of a more basic functioning than lack of literacy enhancement.

  **Note on Distortion:** This currency systematically disadvantages "enhancement" grants in favor of "maintenance" grants. It favors the severely disabled over the merely disadvantaged. This is a feature, not a bug, of the chosen gauge.

  ---

  ## Part 1: The Decision Sequence

  **Time Allowance:** 10 Minutes per Application.
  **Evidence Base:** Application Form + One Phone Call (if required for Step 2).

  ### Step 1: The Statutory Gate (Hard Stop)
  **Question:** Is the requested good or service something a statutory body (NHS, Local Authority, Employer) is legally obliged to provide?
  *   **Sufficient Answer:** "No."
  *   **Evidence:** Applicant declaration on form. If "Yes" or "Unsure," Committee Chair must verify via phone call to applicant or public guidelines.
  *   **Stop Condition:** If the answer is **Yes**, the application is **REJECTED**.
  *   **Rationale:** We are a gap-filler, not a substitute. Funding statutory duties distorts local provision and violates our deed.
  *   **Judgment Marker:** **[J1]** Determining "legal obligation" vs. "theoretical availability" requires interpretation.
  *   **Sign-off:** Committee Chair.

  ### Step 2: The Conversion Check (Hard Stop)
  **Question:** Will this specific item, for this specific person, actually convert into the claimed functioning?
  *   **Sufficient Answer:** "Yes, there is no physical or cognitive barrier preventing use."
  *   **Evidence:** Form details (e.g., "Has space for stairlift," "Has computer for tuition"). Phone call if ambiguity exists (e.g., "Will you actually use this?").
  *   **Stop Condition:** If the answer is **No** (e.g., equipment incompatible with home, tuition refused), **REJECT**.
  *   **Rationale:** A resource that does not convert is waste. We measure flow, not pipe diameter.
  *   **Judgment Marker:** None. This is factual.
  *   **Sign-off:** Any Member.

  ### Step 3: The Counterfactual Test (The Floor)
  **Question:** If we fund nothing, what functioning is lost or foregone?
  *   **Sufficient Answer:** Select one:
      *   A: **Catastrophic Loss** (e.g., confinement to one room, loss of employment, inability to eat).
      *   B: **Significant Hardship** (e.g., difficulty leaving house, reduced employability).
      *   C: **Enhancement** (e.g., improved skill, greater comfort, social opportunity).
  *   **Evidence:** Applicant statement of current status. Look for *loss* of existing capability, not *gain* of new capability.
  *   **Scoring:** A = 10 points. B = 5 points. C = 1 point.
  *   **Currency Note:** A Resource view would ignore this and look at cost. A Welfare view would ask "How sad will they be?" We ask "What can they no longer do?"
  *   **Judgment Marker:** **[J2]** Distinguishing "Hardship" from "Catastrophic Loss" is subjective.
  *   **Sign-off:** Committee Consensus.

  ### Step 4: The Substitutability Test (Expensive Tastes)
  **Question:** Is this the *only* cost-effective way to secure the functioning identified in Step 3?
  *   **Sufficient Answer:** "Yes, cheaper alternatives are medically or practically unviable."
  *   **Evidence:** Quote or price comparison on form.
  *   **Scoring:**
      *   Unique Solution: No penalty.
      *   Cheaper Alternative Exists: Deduct 5 points.
      *   Luxury/Preference (e.g., premium model): Deduct 10 points (Effective Reject).
  *   **Rationale:** Separates the ramp (necessary) from the piano (preference). If a £500 ramp works, we do not fund the £5,000 ramp.
  *   **Judgment Marker:** **[J3]** Determining "viability" of cheaper alternatives.
  *   **Sign-off:** Committee Consensus.

  ### Step 5: The Unit of Assessment (Spillover)
  **Question:** Does the functioning secured extend beyond the applicant?
  *   **Sufficient Answer:** Identify primary beneficiary. Note secondary beneficiaries (carer, children).
  *   **Evidence:** Household composition on form.
  *   **Scoring:**
      *   Applicant Only: Base Score.
      *   Primary Carer Relieved: Add 2 points.
      *   Minor Children Protected: Add 3 points.
  *   **Rationale:** We score the applicant, but spillover breaks ties. We do not fund the carer directly, but we acknowledge the resource efficiency of supporting the unit.
  *   **Judgment Marker:** None.
  *   **Sign-off:** Any Member.

  ### Step 6: The Values Hand-off (Tie-Breaker)
  **Condition:** If two applications have equal scores and funding is insufficient for both.
  **Question:** Which allocation aligns with our collective intuition of "need" over "numbers"?
  *   **Procedure:** Vote.
  *   **Instruction:** Do not attempt to calculate "total welfare." Ask: "Which refusal would haunt us more in six months?"
  *   **Rationale:** This is where the gauge fails and the human must decide. We do not pretend this is math.
  *   **Judgment Marker:** **[J4]** Pure Value Judgment.
  *   **Sign-off:** Majority Vote.

  ---

  ## Part 2: Hard Cases & Procedure Logic

  | Hard Case | Procedure Handling | Where the Choice Bites |
  | :--- | :--- | :--- |
  | **Interpersonal Comparison** | Step 3 (Counterfactual). We compare *threat levels* to function, not subjective pain. | Proxying "pain" with "loss of function" underestimates invisible suffering (e.g., depression). |
  | **Adapted Preferences** | Step 3 focuses on *Loss*, not *Desire*. We ask "What happens if we do nothing?" not "What do you want?" | If an applicant has stopped hoping, the "Loss" may look small. We must infer the baseline from medical/social context. |
  | **Expensive Tastes** | Step 4 (Substitutability). If a cheaper tool secures the same function, the expensive one is a preference. | Fails if the "cheaper" tool carries social stigma or high effort cost we cannot measure. |
  | **The Index Problem** | Step 3 Categories (Mobility, Communication, etc.). Fixed by Committee at start of year. | Risks encoding Committee biases. We must review the list annually to prevent drift. |
  | **Unit of Assessment** | Step 5. Score applicant, bonus for spillover. | Undervalues grants that primarily help a carer (e.g., respite) if the applicant is stable. |
  | **Floor vs. Gain** | Step 3 Scoring (10 vs 1). Prevention of loss trumps enhancement. | Systematically rejects "opportunity" grants (literacy, arts) in favor of "survival" grants. |
  | **In-Kind Constraint** | Acknowledged in Currency Declaration. We cannot equalize shares. | We cannot help someone who needs cash for rent, even if rent is the highest priority need. |
  | **Recording Limits** | We record Purchase, not Outcome. | We will never know if the stairlift was used, or if the literacy tuition led to a job. We accept this blindness. |

  ---

  ## Part 3: Test Run (Three Applications)

  **Budget Context:** £160,000/year. ~45 applications. Average grant £3,500. Cap £6,000.
  **Current Queue:** We have funds for these, but must rank them for priority.

  ### Application A: The Stairlift
  *   **Applicant:** Woman, advanced MS, lives alone.
  *   **Request:** Stairlift. Cost: £5,900.
  *   **Step 1 (Statutory):** NHS does not cover home adaptations of this cost. **Pass.**
  *   **Step 2 (Conversion):** Home owned, stairs structural. **Pass.**
  *   **Step 3 (Counterfactual):** Without lift, she is confined to the ground floor (no bedroom/bathroom). **Category A (Catastrophic Loss). Score: 10.**
  *   **Step 4 (Substitutability):** No cheaper alternative for vertical access. **No Penalty.**
  *   **Step 5 (Spillover):** Lives alone. Carer visits daily. Relieves carer physical strain. **+2 Points.**
  *   **Total Score:** 12.
  *   **Decision:** **FUND.** (High priority, secures basic functioning).

  ### Application B: Adult Literacy (10 Applicants)
  *   **Applicants:** 10 adults, referred by community center.
  *   **Request:** Tuition vouchers. Cost: £600 each (£6,000 total).
  *   **Step 1 (Statutory):** Adult education is not a statutory entitlement in this jurisdiction. **Pass.**
  *   **Step 2 (Conversion):** Center confirmed capacity. **Pass.**
  *   **Step 3 (Counterfactual):** Without tuition, they remain illiterate. They are not *losing* literacy; they are failing to *gain* it. **Category C (Enhancement). Score: 1.**
  *   **Step 4 (Substitutability):** Free classes exist but have 6-month waitlist. **Deduct 5 points** (Alternative exists, albeit delayed). *Score cannot go below 0.* **Score: 0.**
  *   **Step 5 (Spillover:** Potential benefit to children. **+3 Points.**
  *   **Total Score:** 3.
  *   **Decision:** **REJECT (Priority).**
  *   **Comment:** Under a Welfare currency (10 people happy), this wins. Under our Capability Floor currency, preventing a housebound state (App A) trumps enabling literacy gains (App B). This is the uncomfortable result: we prioritize depth of need over breadth.

  ### Application C: The Deaf Worker
  *   **Applicant:** Man, deaf, employed.
  *   **Request:** Specialized comms equipment. Cost: £5,500.
  *   **Step 1 (Statutory):** Form states: "Employer is legally obliged under Equality Act to make reasonable adjustments."
  *   **Action:** **Hard Stop.**
  *   **Decision:** **REJECT (Eligibility).**
  *   **Comment:** Even though the need is high (Category A - Loss of Job), the deed forbids us from subsidizing the employer's legal duty. To fund this is to measure the wrong gauge (Employer Resource vs. Charity Resource).

  **Summary of Run:**
  1.  **Stairlift:** Funded.
  2.  **Literacy:** Rejected (Low Priority).
  3.  **Deaf Worker:** Rejected (Ineligible).

  *Note:* The rejection of the Literacy group is the philosophical bite. A Utilitarian would fund them (10 > 1). A Resource Egalitarian would fund them (10 shares > 1 share). We fund the single woman because her *functioning floor* is collapsing.

  ---

  ## Part 4: Limitations & Blind Spots

  **1. The "Quiet Desperation" Blind Spot**
  This procedure detects *loss* of functioning well. It detects *absence* of functioning poorly. An applicant who has never known mobility or literacy (congenital) may score lower on Step 3 (Counterfactual Loss) than someone who lost it recently. We privilege the fallen over the never-raised. We cannot correct this without subjective welfare data we do not have.

  **2. The Statutory Rigidity**
  Step 1 is a blunt instrument. In a crumbling welfare state, the "legal obligation" of an employer or council may exist on paper but not in practice. By strictly enforcing Step 1, we may let applicants fall through gaps the state *should* fill but *doesn't*. We accept this to avoid becoming a shadow state, but it produces injustice in the marginal cases (like the Deaf Worker).

  **3. The In-Kind Distortion**
  Because we cannot give cash, we cannot fund the most efficient solution if it is cash-based (e.g., paying a fare, buying food, covering a rent arrears to prevent eviction). We will fund a £6,000 stairlift but not £6,000 of rent that prevents homelessness. This is a structural inefficiency inherent to our trust deed. We measure the *tool*, not the *shelter*.

  **4. The Feedback Void**
  We record proof of purchase, not proof of outcome. We assume the conversion factor (Step 2) holds true. It may not. The stairlift may be installed and never used due to depression or hospitalization. We will never know. Our data is of *inputs*, not *flows*. We are gauging the pipe, not the water.

  **5. Committee Bias (The Index Problem)**
  The list of functionings in Step 3 (Mobility, Communication, etc.) is fixed by us, five retired volunteers. We may undervalue functionings relevant to younger applicants (e.g., Digital Access, Social Participation). This must be reviewed annually, or the gauge will drift toward the values of the measurers.

  ---

  ## Instruction for the Committee

  1.  **Print this document.** Keep it on the table during meetings.
  2.  **Step 1 is Law.** If the State/Employer should pay, we do not. Do not argue mercy here; it violates our charter.
  3.  **Step 3 is the Heart.** Argue hard here. Is this a loss or a gain? This is where your judgment matters.
  4.  **Accept the Blindness.** We do not know what happens after the cheque is cut. We make the best calibration we can with the data we have, like any field gauge.
  5.  **Sign the Judgment.** Where marked **[J]**, the Chair or Committee must sign the minutes acknowledging this was a value call, not a fact find. This protects you when the hard cases come.
