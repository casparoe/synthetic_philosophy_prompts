      *   *Middle Knowledge:* God knows what any free creature *would* do in any circumstance (Counterfactuals of Creaturely Freedom - CCFs). These are true *before* creation. -> *The Unsourced Oracle (User's term).*
      *   *Free Knowledge:* God knows what *will* happen (after deciding to create). -> *The Actual Run Log.*
      *   *The Problem:* How can CCFs be true if the agent is free (not determined) and hasn't existed yet?
      *   *The User's Insight:* In code, `output = f(input, seed, policy)`. If `policy` is fixed, output is determined (or random via seed). If output varies with same seed/policy, it's non-functional.

  3.  **Drafting the Translation (Iterative Process):**

      *   *Threefold Knowledge:*
