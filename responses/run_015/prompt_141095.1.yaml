      *   *Counterfactuals:* "What-if" runs. Usually, we run the sim to find out. Molinism says the truth value exists *before* the run.
      *   *Feasibility:* God can pick any seed/world where the CCFs align with His will. He can't force a free agent to choose X if the CCF says they would choose Y in that context.

      *   *Evaluating User's Concepts:*
