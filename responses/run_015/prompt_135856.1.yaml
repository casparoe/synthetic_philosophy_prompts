answer: |-
  His argument is ethically defensible but empirically speculative, resting on contested metaphysical assumptions about the interpersonal comparability of suffering rather than validated measurement.

  Regarding empirical claims about pain intensity, the economist correctly identifies that subjective experience rarely scales linearly with stimulus, aligning with psychophysical laws like Stevens' Power Law where perceived intensity grows as a power function of physical magnitude. Neuroscience supports the notion that severe neuropathic pain involves distinct central sensitization mechanisms unlike moderate discomfort, suggesting a qualitative discontinuity rather than a mere quantitative difference. However, treating this non-linearity as a fixed coefficient for calculation exceeds current empirical validation; while intra-individual non-linearity is well-documented, inter-individual calibration remains impossible to verify objectively, meaning the "orders of magnitude" difference he posits is a theoretical assertion rather than a calibrated fact.

  Structurally, his argument shifts the distributive ethic from classical utilitarianism, which underpins standard QALY maximisation, to prioritarianism or negative utilitarianism. Classical utilitarianism treats each unit of health benefit as equal regardless of baseline status, whereas prioritarianism assigns greater moral weight to benefits conferred on the worse off, justifying the override of aggregate sums. The drowning swimmer analogy invokes a deontological "rescue principle" that prioritizes identifiable lives over statistical ones, which conflicts with the consequentialist framework of budget allocation he claims to uphold; he is effectively smuggling a duty-based constraint into a maximisation model without acknowledging the inconsistency.

  The fundamental instability lies in the unstated premise regarding interpersonal utility comparison, which assumes subjective states are cardinally measurable and comparable across distinct minds. This requires a realist metaphysics of mind where suffering exists as an objective quantity independent of the subject, allowing for arithmetic operations across different consciousnesses. Without this assumption, the aggregation of suffering across eight thousand individuals versus one is category error, as there is no common denominator to validate the sum; your skepticism reflects the philosophical problem that while we can model behavior or neural correlates, we cannot access the qualia necessary to confirm that one person's relief is mathematically equivalent to another's.
