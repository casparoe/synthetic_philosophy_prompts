answer: |-
  **BOARD PAPER: GRANTS PANEL DECISION PROTOCOL**
  **Subject:** Operational Procedure for Assessing Proposals Utilising Effective Altruist Frameworks
  **To:** The Board of Trustees
  **From:** Chair, Grants Panel
  **Date:** 24 May 2024
  **Classification:** Internal Governance Document

  ### 1. Preamble and Purpose

  The Grants Panel has observed an increase in funding proposals utilising reasoning derived from effective altruism (EA). These proposals prioritise quantitative cost-effectiveness, long-termist projections, and deferred giving models. While these frameworks offer rigour, they present three specific risks to the Foundation: mission capture (Institutional Critique), the deferral of present obligation (Earning-to-Give Objection), and the exclusion of qualitative goods (Measurability Bias).

  This document establishes a four-step decision procedure designed for a ninety-minute panel session. It requires no philosophical expertise. Its purpose is not to determine the absolute moral worth of a proposal, but to ensure that the Panel's decision aligns with the Foundation's Governing Document and risk appetite, while explicitly isolating value judgements from factual assessments.

  ### 2. The Decision Procedure

  The Panel shall address the following four steps in sequence. Each step includes a "Sufficient Answer" condition, a "Termination Point" (Reject/Approve), and a "Value Flag" (where disagreement is acknowledged as non-factual).

  #### Step 1: Institutional Integrity and Mission Capture
  **Objective:** To assess whether the proposal reshapes the Foundation's mission or creates dependency on external ideological frameworks.

  **Questions:**
  1.  Does the proposal fall strictly within the charitable objects listed in our Governing Document?
  2.  Does acceptance of this grant require the Foundation to adopt the applicant's metric system as the *primary* measure of our own success?
  3.  Are there conditions attached (e.g., branding, reporting requirements) that compromise the Foundation's independence or reputation?

  **Sufficient Answer:**
  *   **Yes to Q1** AND **No to Q2** AND **No to Q3**.
  *   **Value Flag:** If Q1 is met but Q2/Q3 are ambiguous, the disagreement is regarding *risk tolerance*, not compliance.

  **Termination Points:**
  *   **Reject:** If Q1 is negative (outside legal objects).
  *   **Reject:** If Q3 is positive (conditions compromise independence).
  *   **Proceed to Step 2:** If Q1 is positive and Q2/Q3 are negative or flagged.

  **Potential Misfire:** This step may filter out high-impact international work if the Panel interprets "Midlands Foundation" as a geographic restriction rather than an administrative one. This is a strategic choice, not a procedural error, but must be recorded.

  #### Step 2: Measurability and Qualitative Counterweight
  **Objective:** To mitigate Measurability Bias by ensuring unquantifiable goods are not systematically excluded, and quantifiable claims are not accepted without context.

  **Questions:**
  1.  Does the proposal rely *exclusively* on a quantitative metric (e.g., cost-per-DALY, lives saved) to justify value?
  2.  If Yes to Q1: Has the applicant provided a narrative account of the *quality* of life improved, not just the quantity?
  3.  If No to Q1 (e.g., arts, advocacy): Has the applicant demonstrated a robust theory of change, even if non-quantitative?

  **Sufficient Answer:**
  *   **Quantitative Proposals:** Must provide a qualitative narrative (Q2 Yes).
  *   **Qualitative Proposals:** Must provide a logical theory of change (Q3 Yes).
  *   **Value Flag:** If the Panel disagrees on whether a narrative is "robust" enough to offset the lack of numbers, this is a disagreement on *evidentiary standards*, not facts.

  **Termination Points:**
  *   **Reject:** If Q1 is Yes AND Q2 is No (Metric without meaning).
  *   **Reject:** If Q1 is No AND Q3 is No (No metric and no logic).
  *   **Proceed to Step 3:** If the appropriate counterweight is provided.

  **Potential Misfire:** The Panel may feel discomfort rejecting a proposal with strong numbers but weak narrative (Step 2, Q2). The procedure mandates rejection here to prevent "metric capture," which may feel counter-intuitive to data-driven trustees.

  #### Step 3: Temporal Integrity and Deferral (The Earning-to-Give Test)
  **Objective:** To assess whether the proposal defers moral obligation into a speculative future income stream rather than effecting current charitable expenditure.

  **Questions:**
  1.  Will the grant funds be expended on charitable activity within the current financial year?
  2.  Is the primary value proposition dependent on the *future* earnings or actions of the beneficiaries (e.g., "we will earn more later and donate")?
  3.  Does the proposal ask the Foundation to subsidise the *capacity to earn* (e.g., career pivot, training for high-income roles) rather than the charitable output itself?

  **Sufficient Answer:**
  *   **Yes to Q1** AND **No to Q2** AND **No to Q3**.
  *   **Value Flag:** If Q2 is partially true (e.g., long-term project), the disagreement is on *time horizon*, not facts.

  **Termination Points:**
  *   **Reject:** If Q2 or Q3 is positive. The Foundation funds current charitable expenditure, not speculative future philanthropy or private income generation.
  *   **Proceed to Step 4:** If funds are for immediate charitable activity.

  **Potential Misfire:** This step will likely generate friction with applicants arguing that "earning to give" maximises long-term utility. The procedure treats this as a compliance risk regarding charitable expenditure rules and mission focus.

  #### Step 4: Final Value Weighing (The Hand-Off)
  **Objective:** To acknowledge where the decision rests on trustee discretion rather than procedural checks.

  **Protocol:**
  If a proposal passes Steps 1–3, the Panel must vote. Before voting, the Chair must state:
  *"This proposal meets all procedural and compliance thresholds. Remaining disagreement concerns the relative weight of [Metric A] versus [Metric B] or [Immediate Need] versus [Strategic Risk]. This is a value judgement."*

  **Termination Points:**
  *   **Approve:** Simple majority vote.
  *   **Reject:** Simple majority vote.
  *   **Deferral:** If the Value Flag is raised and the Panel feels insufficiently informed to make the value judgement (max one deferral per session).

  **Potential Misfire:** Trustees may seek "one more piece of data" to avoid making a value judgement. The Chair must enforce the hand-off statement to prevent analysis paralysis.

  ---

  ### 3. Limitations of the Procedure

  Trustees must be explicit about what this procedure cannot settle:

  1.  **Moral Truth:** The procedure does not determine which cause is objectively "better." It only determines which cause fits the Foundation's current operational constraints and risk profile.
  2.  **External Validation:** We are not auditing the applicant's cost-effectiveness calculations. We are assessing whether relying on them is appropriate for *us*.
  3.  **Conflict Resolution:** If the Panel is split 50/50 at Step 4, this procedure does not provide a casting vote mechanism; that remains a matter for the Board's Scheme of Delegation.
  4.  **Emotional Discomfort:** The procedure may force the Panel to reject high-impact proposals (due to mission drift) or accept low-impact proposals (due to qualitative mission alignment). This discomfort is a feature, not a bug, of maintaining institutional identity.

  ---

  ### 4. Application to Concrete Proposals

  The following analysis applies the above procedure to two current pending applications.

  #### Proposal A: East African Deworming Programme
  **Request:** £200,000
  **Key Features:** £30 per DALY averted; mandatory Foundation branding on all materials.

  *   **Step 1 (Institutional Integrity):**
      *   *Q1 (Objects):* Pass (assuming international relief is within the Deed).
      *   *Q2 (Metric Capture):* **Flag.** The proposal demands we prioritise their metric as the primary success measure.
      *   *Q3 (Conditions):* **Fail.** Mandatory branding on all programme materials compromises independence and risks reputational entanglement in foreign jurisdictions.
      *   *Outcome:* **Terminate: Reject.**
      *   *Reasoning:* While the cost-effectiveness is high, the branding condition violates Step 1, Q3. It constitutes mission capture by turning the Foundation into a marketing vehicle for the implementer.
      *   *Panel Discomfort:* Trustees may dislike rejecting a high-efficiency intervention. The procedure clarifies this is a governance boundary, not a moral judgement on deworming.

  #### Proposal B: Local Community Theatre "Earn-to-Give" Seed Fund
  **Request:** £50,000
  **Key Features:** Founders to take corporate finance roles for five years; donate 50% earnings back to collective later; no current quantifiable welfare metric.

  *   **Step 1 (Institutional Integrity):**
      *   *Q1 (Objects):* Pass (Arts/Culture).
      *   *Q2/Q3 (Capture):* Pass.
      *   *Outcome:* Proceed to Step 2.
  *   **Step 2 (Measurability):**
      *   *Q1 (Exclusive Metric):* No (They admit no metric).
      *   *Q3 (Theory of Change):* **Fail.** The theory of change is "we will stop doing art to make money to fund art later." There is no qualitative account of value created *now*.
      *   *Outcome:* **Flag for Step 3.** (Technically fails Q3, but Step 3 is more decisive here).
  *   **Step 3 (Temporal Integrity):**
      *   *Q1 (Current Expenditure):* **Fail.** The £50,000 appears to be seed funding for a period where founders are *not* producing art but working in finance.
      *   *Q2 (Future Earnings):* **Yes.** The value proposition is explicitly deferred.
      *   *Q3 (Subsidise Capacity to Earn):* **Yes.** This effectively funds a career pivot.
      *   *Outcome:* **Terminate: Reject.**
      *   *Reasoning:* This violates Step 3. The Foundation funds charitable activity, not the speculative future philanthropy of individuals. The "Earn-to-Give" model is incompatible with the requirement for current charitable expenditure.
      *   *Panel Discomfort:* Trustees may sympathise with the long-term ambition. The procedure forces the distinction between funding *charity* and funding *earners*.

  ### 5. Conclusion and Recommendation

  This procedure operationalises the Panel's duty to steward the Foundation's mission without requiring trustees to become ethicists. It creates clear stopping points for proposals that threaten institutional independence (Proposal A) or defer charitable expenditure into speculation (Proposal B).

  It is recommended that the Grants Panel adopts this protocol immediately. Trustees should note that adherence to this procedure may result in the rejection of proposals that are "effective" in a general utilitarian sense but ineffective for *this* Foundation's specific governance and risk constraints. This distinction is the primary value judgement the procedure protects.

  **Action Required:**
  The Panel is asked to ratify this Decision Procedure for use in the upcoming quarterly cycle.

  **Signed:**
  Chair, Grants Panel
