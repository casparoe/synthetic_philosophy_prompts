prompt: |-
  I was appointed three months ago to the board of trustees of a mid-sized charitable foundation in the Midlands, and I now chair the quarterly grants panel. We have begun receiving an increasing number of proposals that frame themselves through effective altruist reasoning: cost-effectiveness analyses, long-termist projections, promises of deferred giving via high-earning careers, and demands that we fund only what can be measured against a quantitative welfare metric. I need a reusable decision procedure—ordered questions, sufficient-answer conditions, clear stopping points, and explicit hand-offs to value judgement—that my panel (none of us philosophers, all with legal or sector backgrounds) can actually run in a ninety-minute session without outsourcing the reasoning to outside experts. The procedure must operationalise three specific conceptual pressures: the institutional critique (whether accepting the proposal reshapes our charitable mission or creates capture), the earning-to-give objection (whether the proposal defers moral obligation into a speculative future income stream), and measurability bias (whether goods that resist quantification are being systematically excluded not because they lack value but because they lack metrics). For each step, specify what counts as a sufficient answer, where the procedure terminates in rejection, where it terminates in approval, and where it must flag that the remaining disagreement is one of values rather than facts; also flag the points where the procedure is likely to misfire or produce an answer the panel will dislike. Then apply the procedure to two concrete proposals: first, a £200,000 request to fund mass deworming in East Africa, supported by a published cost-effectiveness estimate of approximately thirty pounds per DALY averted and a condition that our foundation’s branding appear on all programme materials; second, a £50,000 seed request from a local community theatre collective whose founders propose taking corporate finance roles for five years, donating half their earnings back to the collective, arguing this maximises long-term social value through an “earn to give” pathway, but whose artistic work produces no quantifiable welfare metric whatsoever. Please write the answer in British English, keep the tone formal and suitable for a board document, avoid bibliographies or citation requests, and be explicit about what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** New board trustee (3 months), Chair of Grants Panel, mid-sized charitable foundation (Midlands, UK).
      *   **Context:** Increasing proposals using Effective Altruism (EA) framing (cost-effectiveness, long-termism, earning-to-give, quantitative metrics).
      *   **Task:** Create a reusable decision procedure (ordered questions, conditions, stopping points, hand-offs to value judgement) for a 90-minute session.
      *   **Panel Composition:** Legal/sector backgrounds, *not* philosophers.
      *   **Key Conceptual Pressures to Operationalise:**
          1.  Institutional Critique (Mission capture/reshaping).
          2.  Earning-to-Give Objection (Deferring obligation to speculative future).
          3.  Measurability Bias (Excluding unquantifiable goods).
      *   **Requirements:** Specify sufficient answers, termination points (reject/approve/value flag), potential misfires/dislikes.
      *   **Application:** Apply to two specific proposals (Deworming in East Africa vs. Local Community Theatre "Earn-to-Give").
      *   **Tone/Style:** British English, formal board document tone, no bibliographies, explicit about limitations.

  2.  **Deconstruct the Decision Procedure:**
      *   *Constraint:* 90 minutes total. The procedure needs to be efficient.
      *   *Structure:* Needs to be a flowchart or step-by-step protocol.
      *   *Content:* Must address the three specific pressures without requiring philosophical expertise.
      *   *Output:* Needs clear "Go/No-Go/Debate" signals.

      *Drafting the Steps:*
      *   *Step 1: Mission Alignment (Institutional Critique).* Does this fit our deed? Does it change who we are?
      *   *Step 2: Metric Validity (Measurability Bias).* Are we ignoring good stuff just because it's hard to count? Are we accepting bad stuff just because it counts well?
      *   *Step 3: Temporal/Financial Structure (Earning-to-Give).* Is this actual charity now or a promise of later?
      *   *Step 4: Value Judgement Hand-off.* Where do we admit we just have to choose?

  3.  **Refining the Steps (incorporating specific constraints):**

      *   *Step 1 (Mission & Capture):* Focus on the Governing Document. If it conflicts, stop. If it stretches the definition, flag for value judgement.
      *   *Step 2 (Metrics):* Introduce a "Qualitative Counterweight." If the proposal relies *only* on numbers, require a narrative justification.
      *   *Step 3 (Earning-to-Give/Deferral):* Distinguish between funding *activity* vs. funding *income potential*.
      *   *Step 4 (Final Weighing):* Explicitly state where the panel must vote based on instinct/values, not data.

  4.  **Addressing the "Misfires" and "Dislikes":**
      *   *Misfire:* The procedure might be too rigid for edge cases.
      *   *Dislike:* The panel might feel the procedure slows down "obvious" wins (like deworming) or forces them to defend "fuzzy" arts funding too rigorously.
      *   *Limitation:* The procedure cannot define *what* is good, only *how* to assess the claim of goodness.

  5.  **Applying to Proposal 1 (Deworming):**
      *   *Cost:* £200k.
      *   *Metric:* £30/DALY.
      *   *Condition:* Branding.
      *   *Analysis:* High metric score. Potential mission creep (International vs. Midlands? Need to check foundation scope). Branding condition might be a capture risk.
      *   *Procedure Outcome:* Likely pass metrics, fail/flag on mission (if foundation is local) or branding (if it compromises independence). *Correction:* The prompt implies the foundation is in the Midlands, but doesn't explicitly restrict geography. However, "Institutional Critique" suggests checking if this reshapes the mission. If the foundation is general purpose, it passes. If it's local, it fails. I will assume a general charitable purpose but note the geographic tension. The branding condition is a specific "capture" risk.

  6.  **Applying to Proposal 2 (Theatre Earn-to-Give):**
      *   *Cost:* £50k seed.
      *   *Plan:* Founders work in finance, donate later.
      *   *Metric:* None (Artistic value).
      *   *Analysis:* This is the core "Earning-to-Give" objection. It's deferring the charitable act. It's funding a career pivot, not current charity.
      *   *Procedure Outcome:* Likely rejection at Step 3 (Deferral).

  7.  **Drafting the Content (Iterative refinement for Tone and British English):**
      *   *Tone:* Formal, administrative, precise. Use "Trustees," "Governing Document," "Scheme of Delegation."
      *   *Language:* "Programme," "Centre," "Analysing," "£."
      *   *Structure:*
          1.  Introduction/Preamble.
          2.  The Decision Procedure (The Protocol).
          3.  Limitations & Misfire Analysis.
          4.  Application to Case Studies.
          5.  Conclusion.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "Measurability Bias"? *Yes, in Step 2.*
      *   *Check:* Did I address "Institutional Critique"? *Yes, in Step 1.*
      *   *Check:* Did I address "Earning-to-Give"? *Yes, in Step 3.*
      *   *Check:* Are there stopping points? *Yes (Reject/Approve/Flag).*
      *   *Check:* Is it doable in 90 mins? *Yes, if kept to 4 steps.*
      *   *Check:* British English? *Ensure 's' instead of 'z' where appropriate, correct currency formatting.*
      *   *Check:* No bibliographies? *Confirmed.*
      *   *Check:* Explicit about what it *cannot* settle? *Yes, in the Limitations section.*

      *Refining the "Earning-to-Give" step:* The procedure needs to distinguish between funding an organisation that *does* earning-to-give (controversial) vs funding a specific project. The proposal is a "seed request" for a collective whose founders *will* earn to give. This sounds like funding their living costs or setup while they go into finance. This is highly speculative. The procedure must flag "Speculative Future Benefit" vs "Current Charitable Expenditure."

      *Refining the "Deworming" step:* The branding condition is a subtle form of capture. It turns the charity into a marketing vehicle. The procedure needs to catch "Donor Conditions that compromise independence."

  9.  **Final Polish:** Ensure the distinction between "Fact" and "Value" is clear in the hand-off sections. Make sure the "Misfire" warnings are honest about the emotional difficulty of rejecting high-metric proposals or accepting low-metric ones.

      *(Self-Correction on Proposal 1)*: If the foundation is "Midlands-based," does that mean it *only* funds the Midlands? Usually, "Midlands foundation" implies location of trustees/HQ, not necessarily beneficiary location. However, for the sake of the exercise, I should treat the geographic scope as a potential friction point for the Institutional Critique. I will assume the Governing Document allows international work but the *culture* is local, making the "Institutional Critique" relevant regarding mission drift.

      *(Self-Correction on Proposal 2)*: The theatre collective proposes taking corporate roles *for five years* then donating. The £50k is a *seed request* now. What is the £50k for? Presumably to sustain the collective *while* they do this, or to set up the vehicle. If it's to sustain them while they work in finance, it's not charitable expenditure in the present. If it's to keep the theatre alive *until* they return, it's speculative. This is a strong candidate for rejection under the "Deferral" test.

  10. **Final Review against constraints:** 90-minute session feasibility? Yes. No philosophers? Yes. British English? Yes. Formal tone? Yes.

