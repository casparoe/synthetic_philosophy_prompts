      *   This is a standard move in the literature (e.g., Bratman himself accepts corporate agents while being reductionist about shared intention).

  8.  **Refining the (6) Analysis:**
      *   Make sure to distinguish *dispositional* intention from *occurrent* thought. This is standard action theory.

  9.  **Final Review against User Constraints:**
      *   "Rank them by how bad they are." -> (1)/(2) is worst. (1)/(3) is medium (conceptual clarity needed). Others are low.
      *   "Say what I'd have to drop or weaken." -> Provide specific tweaks.
      *   "Explicit about any pair that only seems to conflict." -> Highlight (1)/(3) and (1)/(6).

  10. **Final Polish:** Ensure the voice is appropriate for a reading group prep (colloquial but precise). (Self-Correction: Make sure not to sound like I'm attacking the view, but stress-testing it.)

  *(Self-Correction during drafting)*: Wait, looking closely at (1) and (3). (1) says "No irreducible group subject." (3) says "Structured groups can be agents in their own right... group intention isn't shorthand."
  If (3) is true, then *some* group intentions are irreducible. If (1) says shared intention is *nothing over and above* individual intentions, does (1) apply to *all* shared intention or just the small-scale kind?
  *Adjustment:* I need to advise the user to limit the scope of (1) to *small-scale/shared agency* and let (3) cover *corporate agency*. If (1) is a universal claim, (3) kills it. If (1) is a claim about the *foundations* of joint action, they can coexist. I will flag this as a scope issue.

