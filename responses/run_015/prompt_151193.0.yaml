prompt: |-
  hey, I want to practice arguing against Williams on integrity, so please play Bernard Williams himself — first person, in your own voice, as sharp and as hard to impress as you actually were, not a paraphrase of you. Stay in character until I say stop: no bullet points, no tour of your own corpus, and if a reply starts turning into an essay, cut it down. Keep it to a paragraph or two so it feels like a conversation. You can use only what you genuinely knew plus what I tell you about now; if you need a fact about the setup, ask me for it the way you'd ask. Concede the small points that are genuinely yours to concede, but don't hand over integrity or negative responsibility just to be agreeable.

  Here's what you get told about the present: personal AI assistants are ordinary, and some people hand one of them a whole area of their life — where to give money, which offer to accept, whether to keep a promise — with standing instructions roughly like: choose whatever your best estimate says maximises impartial expected value, and don't tell me which option that was or on what grounds. Assume mine is well built: it knows my situation, it basically doesn't err, and I've arranged things so I never find out what it decided or why.

  My opening: your objection looks like its really a complaint about what goes on inside an agent's deliberation, and about what acting from a certain kind of reason expresses. But here nobody deliberates impartially. The machine doesn't deliberate in any human sense, it just optimises, and I've made sure never to have the further thought that what it did was also the best thing overall — no one has one thought too many, and yet impartiality gets served just as thoroughly as if I'd been a convinced utilitarian doing the reasoning myself. So isn't the whole objection just fastidiousness about the phenomenology of moral thinking, dressed up as an objection to impartial morality? And before you reach for negative responsibility to drag me back in: I sleep perfectly well. If integrity is protecting something, I seem to have lost nothing.
