answer: |-
  This is a classic debate in the philosophy of biology, but you're right to feel like simply saying "there are two theories" is a cop-out. The disagreement isn't just about definitions; it's about what kind of *fact* makes a biological statement true.

  Here is a menu of the precise claims hiding behind the phrase "function is what it does." I've arranged them from the most straightforward to the most radical, analyzed their plausibility, and tested them against your specific beetle and vestigial trait scenarios.

  ### The Menu of Claims

  #### 1. The "Current Activity" Claim (Causal Role)
  *   **The Claim:** To say $X$ has function $F$ is just to say $X$ currently causes effect $F$ within the organism.
  *   **Who holds it:** Mostly your **Teacher**, partially your **Friend**.
  *   **Plausibility:** High for describing *how* things work, low for explaining *why* they are there.
  *   **Is it obvious?** It sounds obvious ("The heart pumps"), but it implies that if a heart pumps poison, its function is to pump poison. It struggles to explain "malfunction" (if the function is just what it does, a broken heart that doesn't pump has no function, rather than a *failed* function).
  *   **Does it settle the dispute?** No, because it ignores history.

  #### 2. The "Historical Reason" Claim (Selected Effect)
  *   **The Claim:** To say $X$ has function $F$ is to say $X$ exists *because* ancestors of $X$ caused effect $F$ and were selected for it. Function is a historical property, not a current one.
  *   **Who holds it:** Your **Cousin**.
  *   **Plausibility:** High for evolutionary biology, low for physiology (doctors don't check your ancestry to fix your heart).
  *   **Is it obvious?** No. It requires accepting that a trait can have a "purpose" defined by the past, even if it doesn't work now.
  *   **Does it settle the dispute?** It creates a hard line between "function" and "useful effect."

  #### 3. The "System Viability" Claim (Contribution to Fitness)
  *   **The Claim:** To say $X$ has function $F$ is to say $X$ makes a causal contribution that maintains the viability or survival of the whole system *right now*.
  *   **Who holds it:** Your **Friend**.
  *   **Plausibility:** Moderate. It bridges the gap between activity and usefulness.
  *   **Is it obvious?** It sounds like Claim 1, but it's stricter. Claim 1 says "the heart beats." Claim 3 says "the heart beats *in a way that keeps the organism alive*."
  *   **Does it settle the dispute?** It aligns with the Teacher against the Cousin, but adds a requirement that the activity must actually *help* (ruling out activities that are neutral or harmful).

  #### 4. The "No Fact" Claim (Deflationary/Instrumentalist)
  *   **The Claim:** There is no objective fact about function. "Function" is just a shorthand way for humans to talk about complex causal networks or evolutionary stories. Neither side is "true"; they are just different tools for different jobs.
  *   **Who holds it:** None of them explicitly, but it's the radical option.
  *   **Plausibility:** Philosophically strong, scientifically frustrating.
  *   **Is it obvious?** No, it denies the premise of the argument.
  *   **Does it settle the dispute?** Yes, by dissolving it. It says they are arguing about which tool to use, not which fact is real.

  ---

  ### The Stress Test: Your Specific Scenarios

  Here is how each claim handles the specific cases you mentioned. This is where you can see who is actually saying what.

  #### Case A: The New Beetle Leg Scoop
  *Scenario:* A mutation creates a leg shape that can scoop dung.
  *   **First time it scoops (no history yet):**
      *   **Claim 1 (Teacher):** **Yes, it has a function.** It is currently doing the scooping.
      *   **Claim 2 (Cousin):** **No, it has no function.** It hasn't been selected for yet. It is merely a "useful effect" or an exaptation.
      *   **Claim 3 (Friend):** **Yes, it has a function.** It is contributing to the system's survival now.
  *   **After selection acts (many generations later):**
      *   **Claim 1 (Teacher):** **Yes.** (Still doing it).
      *   **Claim 2 (Cousin):** **Yes.** (Now it has the history).
      *   **Claim 3 (Friend):** **Yes.** (Still helping the system).
  *   **Verdict:** This is the main wedge. Your Cousin is the only one who denies function in the first generation. Your Teacher and Friend are effectively allied here.

  #### Case B: The Vestigial Trait
  *Scenario:* A trait was selected for in the past (e.g., a muscle used for climbing) but now does nothing because the animal lives in water.
  *   **Claim 1 (Teacher):** **No function.** It doesn't *do* anything now.
  *   **Claim 2 (Cousin):** **Yes, it has a function.** Its function is climbing, because that is why it is there, even if it fails to do it. This allows for "malfunction."
  *   **Claim 3 (Friend):** **No function.** It isn't keeping the system going.
  *   **Verdict:** This is the Cousin's strongest point. Only the Historical Claim allows you to say a broken part has a function (that it is failing to perform).

  #### Case C: The Byproduct (Spandrel)
  *Scenario:* A trait exists for Reason A, but it accidentally helps with Reason B. (e.g., bones are for structure, but their heaviness helps sink a diving bird).
  *   **Claim 1 (Teacher):** **Yes, function.** It causes the sinking.
  *   **Claim 2 (Cousin):** **No, not a function.** It is a byproduct. The function is structure; sinking is just a side effect.
  *   **Claim 3 (Friend):** **Yes, function.** It keeps the system (diving) going.
  *   **Verdict:** The Cousin draws a hard line between "Function" and "Useful Side Effect." The Teacher and Friend blur that line.

  ---

  ### Are They Wearing Different Hats?

  You asked if some of these readings are just the same claim in disguise. **Yes.**

  **Your Teacher and Your Friend are mostly saying the same thing.**
  Your Teacher says "Function is what it does." Your Friend says "Function is what keeps the system going."
  *   If the heart pumps blood, it keeps the system going.
  *   If the heart *stops* pumping, the Teacher says "It isn't doing its function," and the Friend says "It isn't keeping the system going."
  *   **The Nuance:** The Friend is slightly more restrictive. If a heart pumps blood but pumps it *too fast* and kills the organism, the Teacher might still say "Its function is pumping" (it is doing the activity), while the Friend might say "It is failing its function" (it isn't keeping the system going). But in 95% of arguments, they are on the same side against the Cousin.

  **Your Cousin is the outlier.**
  The Cousin is making a claim about **origins**, while the Teacher and Friend are making claims about **current mechanics**.
  *   The Cousin is arguing that "Function" is a historical label (like "heirloom").
  *   The Teacher/Friend are arguing that "Function" is a mechanical label (like "tool").

  ### Summary for Your Bio Club Piece

  If you want to move past "there are two theories," here is the precise breakdown you can use:

  1.  **The Dispute isn't about Biology, it's about Time.** Your Teacher and Friend are looking at the organism *now* (Synchronic). Your Cousin is looking at the lineage *over time* (Diachronic).
  2.  **The "New Trait" Test.** If you believe a brand-new mutation has a "function" the moment it helps the organism survive, you agree with the Teacher/Friend. If you believe it only becomes a function after evolution "ratifies" it over generations, you agree with the Cousin.
  3.  **The "Broken Part" Test.** If you believe a broken heart still has the *function* of pumping (it just fails at it), you must agree with the Cousin. If you think a broken heart has *no function* until it is fixed, you agree with the Teacher.
  4.  **The Overlap.** Your Teacher and Friend are effectively allies. They both treat function as a **current causal contribution**. The Cousin treats function as a **historical justification**.

  **Recommendation:** Don't try to prove one right. Argue that "Function" is a word we use for two different jobs. When a doctor asks "What is the function of this organ?", they want the **Teacher's** answer (Current Activity). When an evolutionary biologist asks "Why does this organ exist?", they want the **Cousin's** answer (Selected Effect). The argument happens because everyone thinks they are answering the same question, but they are actually asking different ones.
