answer: |-
  This is a profound ontological problem disguised as a property dispute. You are asking the arbitration clause to adjudicate the **Ship of Theseus** paradox within the specific context of artifact ontology. Since you are not asking for legal advice but for the metaphysical framework that should underpin the agreement, we must analyze which theory of object persistence best aligns with the nature of *crafted artifacts* and *heirlooms*.

  Here is an analysis of the competing metaphysical frameworks, their applicability to your clause, and an answer to your specific questions regarding boundaries and conventions.

  ### 1. The Competing Metaphysical Frameworks

  To draft a clause that resolves this, you must select a criterion of identity. There are three primary candidates:

  **A. Material Constitution (Sibling A's View)**
  *   **Theory:** An object is identical to the sum of its material parts. If the parts change, the object ceases to exist.
  *   **Implication:** The bench is a replica.
  *   **Suitability:** This framework is standard for *natural kinds* (e.g., a specific body of water, a biological organism) or museum conservation where provenance relies on original material. However, it is poorly suited for **tools**. A tool is defined by its capacity to function, not the specific atoms composing it. If a carpenter replaces a dull chisel with a new one, they do not say they have lost their chisel; they say they have maintained it.

  **B. Functional/Historical Continuity (Sibling B's View)**
  *   **Theory:** An artifact's identity is anchored in its functional role and the causal history of its maintenance. This is a form of **Functional Essentialism**.
  *   **Implication:** The bench is the original because the "bench-ness" (the form, the function, the location in the studio, the father's use) remained unbroken.
  *   **Suitability:** This aligns with how humans interact with tools and heirlooms. It privileges the *life* of the object over its *stuff*.

  **C. Creator's Intent (The Hylomorphic View)**
  *   **Theory:** Drawing on Aristotle's hylomorphism (matter + form), the identity of an artifact is determined by the form imposed by the maker and sustained by their intention.
  *   **Implication:** Because the father (the creator) consistently identified the bench as the same object throughout the replacements, his intention sustains the object's identity.
  *   **Suitability:** This is the strongest framework for inheritance disputes involving crafted items. The creator's ontology overrides the heir's metaphysical speculation.

  ### 2. Addressing Your Specific Philosophical Questions

  **Q: Is identity anchored in an enduring core or a relation among temporal parts (4Dism)?**
  If you adopt **Perdurantism (4Dism)**, you view the bench as a "spacetime worm" composed of temporal parts. The bench-at-time-T1 (original wood) and the bench-at-time-T50 (new wood) are different temporal segments of the same extended object.
  *   **Does this solve the dispute?** No. It merely describes the history. The dispute is not about *description*; it is about *valuation and categorization*. Even if the bench is a 4D worm, the siblings disagree on whether the *current time-slice* inherits the sentimental/market value of the *initial time-slice*. Perdurantism explains the change but does not dictate the normative status of the current object. Therefore, 4Dism is descriptive but normatively inert for this contract.

  **Q: Is there a principled boundary between restoration and replacement?**
  In the metaphysics of artifacts, the boundary is not material; it is **intentional**.
  *   **Restoration:** Changes made to *preserve* the existing functional/formal identity.
  *   **Replacement:** Changes made to *instantiate* a new identity using the old one as a model.
  *   **The Principle:** The boundary lies in the **continuity of purpose**. If the father replaced a leg to keep using *this* bench, it is restoration. If he built a new bench to look like the old one, it is replacement. Since the prompt states he "replicated the original joinery exactly" during maintenance, the causal chain of intention was unbroken. The boundary is principled, but the principle is *teleological* (purpose-driven), not *mereological* (part-driven).

  **Q: Does the disagreement reveal a real feature of artifacts or a confusion about tracking conventions?**
  It reveals that **artifact identity is mind-dependent.**
  Unlike a mountain or a star, a workbench does not exist independently of human practices. Therefore, there is no "fact of the matter" outside of human convention. However, calling it a "confusion" is too dismissive. It is a **clash of conventions**.
  *   Sibling A is using the convention of *Antique Valuation* (where original material drives value).
  *   Sibling B is using the convention of *Heirloom/Tool Continuity* (where narrative and function drive value).
  The dispute is real because the *value* is real, even if the *ontology* is conventional.

  ### 3. Recommendation for the Metaphysical Framework

  For the purpose of the arbitration clause, you should reject Material Constitution (Sibling A) and Perdurantism (4Dism) in favor of **Functional-Historical Essentialism grounded in Creator's Intent.**

  **Why this framework?**
  1.  **Category Error Avoidance:** Treating a workshop tool as a static museum specimen (Material Constitution) is a category error. Tools are defined by use.
  2.  **Deference to Authority:** In artifact ontology, the creator's intention is the closest thing to a "truth condition" for what an object *is*. The father's forty-year treatment of the bench as a single entity carries more ontological weight than the siblings' retrospective analysis.
  3.  **Resolution of the "Loss" Intuition:** You asked if viewing the object as extended in time merely renames the intuition that something essential was lost. Under Functional-Historical Essentialism, nothing essential *was* lost. The "essence" of a workbench is its capacity to serve as a stable platform for work, maintained by a specific agent. The wood was never the essence; the wood was the *substrate*.

  ### 4. Operationalizing the Framework in the Clause

  While you are not asking for legal drafting, the metaphysical commitment must be translated into operational criteria to avoid future ambiguity. The clause should not debate metaphysics; it should stipulate the **Criteria of Identity** derived from the framework above.

  The contract should define the "Heirloom Workbench" not by its material composition, but by its **Continuity of Form and Function**.

  **Suggested Metaphysical Stipulations:**
  1.  **Identity Condition:** The object is defined by the unbroken chain of custody and maintenance by the original creator, regardless of material turnover.
  2.  **Intent Clause:** The creator's consistent designation of the object as singular controls its identity status over retrospective material analysis.
  3.  **Valuation Distinction:** The clause should acknowledge that while the object is *ontologically* the heirloom (Sibling B's view), its *market value* may be adjusted to reflect the lack of original material (acknowledging Sibling A's concern without conceding the ontological point).

  ### Summary

  The disagreement is not about a physical fact, but about **which convention of tracking applies**.
  *   If the goal is **liquidation**, Sibling A's Material Constitution applies (market norms).
  *   If the goal is **inheritance/preservation**, Sibling B's Functional/Historical Continuity applies (family/narrative norms).

  Since this is an inheritance dispute regarding a father's studio, the **Functional/Historical** framework is the correct metaphysical choice. It respects the nature of the object (a tool), the authority of the creator (the father), and the purpose of the transfer (heirloom). To rule otherwise is to impose a museum ontology on a living practice, which metaphysically misidentifies what a "workbench" is.

  **Conclusion:** The contract should stipulate that for the purposes of distribution, the identity of the artifact follows the **causal history of its maintenance and the intentional stance of its creator**, rendering the material turnover irrelevant to its status as an heirloom, though potentially relevant to its appraised market value. This dissolves the paradox by prioritizing the *social ontology* of the family over the *physical ontology* of the lumber.
