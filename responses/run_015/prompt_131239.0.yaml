      *   *Entropy:* Thermodynamic entropy is quantifiable (Joules/Kelvin). Social 'entropy' (disorder, waste, inequality) is metaphorical and normative. You can't measure the 'entropy' of a bureaucracy easily.
      *   *Normativity:* Thermodynamics is value-neutral. Civilisational collapse involves suffering, death, and loss of knowledge. Calling it a 'phase transition' risks naturalising tragedy (the 'naturalistic fallacy').
