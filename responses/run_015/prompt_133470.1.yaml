  ### I. The Rules of the Record

  Based on the ten precedents established over the last four years, two distinct principles can be reconstructed. Both fit the existing record, but they rely on different justificatory foundations and will diverge on future cases.

  **Rule 1: The Medical-Conservative Principle**
  *   **Statement:** The University funds biological interventions only when there is a diagnosed deviation from species-typical function (pathology or age-related decline) *and* the individual identifies this deviation as a deficit requiring treatment.
  *   **Exceptions:** (a) Immediate risk of physical harm to third parties (Case 8); (b) Where the individual rejects the medical model of their condition, environmental accommodations are funded instead (Case 6).
  *   **Explanation of Record:** This rule explains the approvals for ADHD (Case 1), depression (Case 4), hearing loss (Case 7), and presbyopia (Case 9) as treatments for diagnosed deficits. It explains the declines for the undiagnosed student (Case 3) and subclinical mood (Case 5) as lack of pathology. It explains the Deaf student (Case 6) as a rejection of the deficit model. It treats the medical resident (Case 8) as a safety exception and the laser correction (Case 10) as a low-risk normalization of a diagnosed visual error.
  *   **Divergence Point:** This rule looks backward at *status* (diagnosis) and *consent* (do you view this as a illness?).

  **Rule 2: The Functional-Access Principle**
  *   **Statement:** The University funds the most efficient intervention required to ensure an individual's full participation in essential university roles (academic or clinical), prioritizing environmental accommodations unless they are identity-violating, inefficient, or insufficient for safety.
  *   **Exceptions:** (a) Interventions that confer unfair competitive advantage in evaluative contexts rather than enabling baseline participation (Case 3); (b) Interventions where the "barrier" is merely a preference for greater drive or convenience without role necessity (Case 5).
  *   **Explanation of Record:** This rule explains the approvals for ADHD meds/time (Cases 1 & 2) and hearing loss (Case 7) as enabling academic function. It explains the Deaf student (Case 6) as a preference for environmental accommodation that respects identity. It explains the resident (Case 8) and laser correction (Case 10) as efficiency/safety measures for role fulfillment. It explains the declines (Cases 3 & 5) as requests for *advantage* (finals prep, extra drive) rather than *access*.
  *   **Divergence Point:** This rule looks forward at *function* (can you do the work?) and *necessity* (is this the only way?).

  **Where They Diverge:**
  Rule 1 requires a **label** (diagnosis) to justify a biological fix. Rule 2 requires a **barrier** (functional exclusion) to justify a fix, regardless of labels. Rule 1 would deny a biological fix to a healthy person even if they cannot function without it (unless safety is involved). Rule 2 would approve a biological fix for a healthy person if it is the only way to remove a structural barrier to completion, provided it doesn't create unfair advantage.

  ***

  ### II. Recommendation for the Sleep-Compression Request

  **Recommendation:** **Decline.**

  **Closest Analog:** **Case 3 (The Undiagnosed Student Preparing for Finals).**
  While Case 8 (The Medical Resident) involves a healthy individual receiving a sleep agent, the justification was explicitly "risk to patients." The current request is for *academic completion* (dissertation) and *personal welfare* (childcare), which aligns structurally with Case 3 (academic performance) rather than Case 8 (third-party safety). Like Case 3, the applicant is healthy and undiagnosed. Like Case 5, the request is driven by a desire for "more drive" (in this case, more time/energy) rather than restoration of lost function.

  **Principle Adopted:**
  By declining, we affirm the **Medical-Conservative Principle (Rule 1)** with a specific clarification on "Competitive Advantage." We are adopting the principle that: *The University will not fund pharmacological time-expansion for healthy individuals to overcome structural life constraints, as this converts a social resource (time) into a biological commodity, creating a positional advantage over peers who must manage within standard physiological limits.*

  **Analysis of the Therapy/Enhancement Distinction:**
  The therapy/enhancement distinction is **not** doing the real work in our decisions.
  *   **Evidence:** We approved laser correction for mild myopia (Case 10) and wakefulness agents for a healthy resident (Case 8), both of which are enhancements relative to the baseline of "healthy." We declined a cochlear implant (Case 6), which is a standard therapy, because of identity.
  *   **Actual Tracking:** Our decisions track **Diagnosis + Subjective Deficit** (Rule 1) and **Third-Party Risk** (Case 8).
  *   **Application to Current Case:** The sleep-compression agent is technically an enhancement (compressing normal sleep), but so was Case 8. The deciding factor is not the *type* of intervention, but the *justification*. Case 8 was justified by *harm prevention* (patients). This case is justified by *benefit acquisition* (dissertation progress). We have consistently declined benefits for healthy students (Cases 3 & 5) even when the stress is real. The fact that she declined a reduced teaching load (an environmental fix) mirrors Case 6, but unlike Case 6, her objection is financial/temporal, not identity-based. Under our record, financial constraints on environmental fixes do not trigger funding for biological enhancements in healthy students.

  ***

  ### III. The Further Case to Distinguish the Rules

  To determine whether the Committee is truly committed to Rule 1 (Medical-Conservative) or Rule 2 (Functional-Access), I propose we place the following case on the agenda next semester:

  **The "Mandatory Night-Shift" Case:**
  > A healthy doctoral student in a field requiring mandatory night-time data collection (e.g., astronomy or specific ecological fieldwork) requests the sleep-compression agent. The student has no sleep disorder and no diagnosis. However, the program requires all students to complete a set number of night-hours for certification, and the schedule cannot be altered due to shared equipment protocols. The student argues that without the agent, they cannot physiologically recover enough to maintain the cognitive standard required for safe equipment operation, effectively barring them from degree completion. They have no environmental alternative (the schedule is rigid).

  **Why This Distinguishes the Rules:**

  *   **Under Rule 1 (Medical-Conservative):** We must **Decline**. There is no diagnosed pathology. The student is healthy. The "barrier" is a program requirement, not a medical deficit. Case 8 does not apply because there is no *immediate risk to third parties* (patients), only a risk to the student's own progress or potential equipment damage. The lack of diagnosis is a hard stop.
  *   **Under Rule 2 (Functional-Access):** We should **Approve**. There is a clear functional barrier to an essential university role (degree completion). Environmental accommodation is impossible (rigid schedule). It is not a competitive advantage (all students in this track face the same requirement). The intervention restores the *capacity* to fulfill the role, similar to how we funded interpreters for the Deaf student or meds for the ADHD student.

  **The Test:** If we approve this case, we admit that Rule 2 governs us: we fund functional access regardless of diagnosis. If we decline, we confirm Rule 1: we fund medical treatment, and "structural barriers" for healthy students are their own responsibility to manage, even if it means leaving the program. This forces us to decide if the University is a healthcare provider for the afflicted or a guarantor of functional capacity for all enrolled students.
