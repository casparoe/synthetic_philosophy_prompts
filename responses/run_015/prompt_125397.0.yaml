answer: |-
  This is a sophisticated historiographical and sociological problem. You are essentially wrestling with the structure-agency debate as applied to moral psychology. The tension you feel regarding the South African volunteers is the exact friction point where Browning (situationalism) and Goldhagen (ideological determinism) fail to fully integrate.

  Here is a proposed unifying principle, a resolution to the South African tension, and a prediction for transitional justice contexts.

  ### 1. The Unifying Principle: The Multiplicative Threshold Model

  To capture all four (and the SA) verdicts without contradiction, you must abandon the idea that "Situation" and "Ideology" are competing *alternatives*. Instead, treat them as **multipliers** in a risk-calculation equation.

  **Principle:** *Perpetration occurs when the product of Ideological Permissiveness (IP) and Situational Pressure (SP) crosses a Threshold of Action (T).*
  $$Action = (IP \times SP) > T$$

  *   **Ideological Permissiveness (IP):** How much the actor believes the victim deserves suffering, or how much the actor believes the violence is morally justified/necessary. (Ranges from 0 to High).
  *   **Situational Pressure (SP):** The cost of *not* acting (peer ostracization, career death, physical punishment, bureaucratic scripting). (Ranges from 0 to High).

  **Applying the Model to Your Cases:**

  *   **Case 1 (Battalion 101):** Low IP (ordinary men) × High SP (peer pressure/command) > T. **Verdict: Situational.**
  *   **Case 2 (Rwanda Official):** Moderate/High IP (dormant prejudice/propaganda) × Moderate SP (roadblocks/social expectation) > T. **Verdict: Ideological/Cultural.** (The IP was high enough that less SP was needed).
  *   **Case 3 (Argentine Conscript):** Low IP (apolitical dad) × Extreme SP (conscription/disappearance risk) > T. **Verdict: Situational.**
  *   **Case 4 (German Civilian):** High IP (eliminationist belief) × Zero SP (unsolicited) > T. **Verdict: Ideological.** (Proves IP alone can cross T).
  *   **Case 5 (SA Conscripts):** Low IP × High SP > T. **Verdict: Situational.**
  *   **Case 5 (SA Volunteers):** **Moderate/High IP** (self-selection) × High SP (unit culture) > T. **Verdict: Hybrid.**

  ### 2. Resolving the South African Volunteer Tension

  Your hesitation on the SA volunteers stems from conflating *Macro-Culture* with *Micro-Agency*.

  You wrote: *"I still lean situation because the institutional culture was so totalizing, yet I feel like volunteering should point to ideology."*

  **The Resolution:** The "totalizing culture" is the **Macro-Situation**. It creates the environment where volunteering is possible. However, **Volunteering is a revealed preference.**

  In Battalion 101, Major Trapp gave the men an *opt-out* (which few took, supporting Browning's situational view on the *act*, though Goldhagen argues the opt-out was socially costly). In the Apartheid security apparatus, joining the death squad was often a specific career choice distinct from standard conscription.

  If you stick to the Multiplicative Model:
  *   The **Conscripts** needed the High SP to overcome their Low IP.
  *   The **Volunteers** already had elevated IP (or a high tolerance for violence) *before* entering the unit. The Unit Culture (SP) then amplified it.

  **Verdict Adjustment:** You do not need to drop the situational verdict for the volunteers, but you must acknowledge their **IP baseline was higher** than the conscripts. They are not "Ordinary Men" in the same way Battalion 101 was; they are "Selected Men." The totalizing culture explains *why* they were rewarded, but the volunteering explains *why they were there*.

  ### 3. The New Case: Enthusiastic Start, Coercion Claim Later

  **Case:** A perpetrator participates enthusiastically at first but frames the whole thing as coercion in front of a truth commission.

  **The Verdict:** This is **Strategic Situationalism.**

  Under the Multiplicative Model, their initial action proves that $(IP \times SP) > T$. The enthusiasm suggests IP was high. However, the later claim is an attempt to retroactively manipulate the historical record of their IP.

  **Which verdict do you have to drop for a simpler principle?**
  If you want a simpler, predictive principle for *Transitional Justice (TJ) contexts specifically*, you must drop the **Verdict of Sincerity.**

  You cannot assume the perpetrator's explanation of their own motivation is data regarding their *original* motivation. It is data regarding their *current* survival strategy.

  **The Simpler Principle for TJ:** *In post-conflict accountability mechanisms, all perpetrators will migrate their narratives toward the Situational (Browning) end of the spectrum, regardless of their actual original motivation.*

  ### 4. Predictions for Transitional Justice Contexts

  If you adopt the **Multiplicative Threshold Model** combined with the **Strategic Situationalism** rule, you can predict the following dynamics in Truth Commissions (like the TRC, Peru's CVR, etc.):

  1.  **The "Just Following Orders" Inflation:** You will see a statistical inflation of "Situational" claims. Even Goldhagen-style ideologues (Case 4 types) will claim they were Battalion 101 types (Case 1) to access amnesty or reduce social stigma.
  2.  **The Volunteer Paradox:** The Truth Commission will struggle to categorize Volunteers. If the Commission is focused on *Reconciliation* (like the SA TRC), they may accept the Situational narrative to facilitate amnesty. If the Commission is focused on *Retribution* (like the ICTY), they will treat Volunteering as proof of High IP (Mens Rea).
  3.  **The "Dormant Culture" Defense:** Perpetrators from Case 2 scenarios (Rwanda/Community violence) will argue they were Case 3 scenarios (Conscripts/Scripted). They will claim the "propaganda" was actually "coercion."
  4.  **Forensic Discrepancy:** You can predict where the testimony will lie. Look for gaps between **Administrative Records** (did they volunteer? did they request transfer?) and **Oral Testimony** (was I forced?).
      *   *Prediction:* If administrative records show they requested transfer *away* from killing duties and were denied, the Situational claim is credible.
      *   *Prediction:* If records show they requested transfer *into* killing units, or requested leave only during non-combat periods, the Ideological verdict holds, regardless of their testimony.

  ### Summary

  *   **Unifying Principle:** Action is a product of Ideological Permissiveness multiplied by Situational Pressure.
  *   **SA Volunteers:** They are "Selected Men." Their volunteering indicates a higher Ideological baseline than conscripts, even if the macro-culture was totalizing.
  *   **The "New Case":** This is a retroactive narrative shift. The initial enthusiasm indicates High IP; the later coercion claim is a strategic attempt to lower perceived IP.
  *   **Simplification for TJ:** To simplify, assume **all** testimony regarding motivation is strategically situational. Use material evidence (volunteering records, correspondence, promotion requests) to reconstruct the actual Ideological Permissiveness.

  This allows you to keep Browning and Goldhagen not as enemies, but as variables in the same equation. Browning explains the *SP* variable; Goldhagen explains the *IP* variable. Most real-world atrocities require both to be non-zero, but the ratio varies by case.
