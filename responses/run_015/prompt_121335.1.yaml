      *   **(1) Platonism vs. (3) Empiricism:**
          *   *Tension:* Platonism usually implies *rationalism* or *apriorism* (we grasp abstract objects via intellect). Empiricism says knowledge comes from sensory experience. If numbers exist mind-independently (1), how do we access them empirically (3)? Causal access problem (Benacerraf).
          *   *Severity:* High. This is the classic Benacerraf problem.

      *   **(2) Nominalism (Uncountables) vs. (1) Platonism (Analysis):**
