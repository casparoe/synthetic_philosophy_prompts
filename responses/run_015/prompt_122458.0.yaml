answer: |-
  There is a principle that aligns your seven verdicts, but it requires abandoning the idea that morality is solely about **consequences** (specifically, marginal difference-making). Your intuitions are consistently **non-consequentialist**. They rely on **Participatory Integrity**.

  ### The Principle: Participatory Integrity
  **An act is morally evaluated based on whether it aligns the agent with a harmful or beneficial collective practice, regardless of whether that specific act changes the outcome.**

  This principle splits moral weight into two buckets:
  1.  **Complicity:** If you join a chain of harm, you share the blame, even if your link wasn't the "breaking point."
  2.  **Solidarity/Duty:** If you join a chain of civic good or resistance, you share the credit, even if your link wasn't "decisive."

  ### How it resolves your seven cases
  1.  **Chicken (Store A & B):** **Wrong.** In both cases, you are financially participating in the practice of factory farming. In Store A, you nudge future orders (causal). In Store B, you are still a *customer* of cruelty. You are making yourself complicit in the demand, even if that specific bird was doomed. You have aligned yourself with the harm.
  2.  **Driving for water:** **Fine.** While emissions are harmful, this is a *de minimis* incidental byproduct of a neutral/personal good (joy/reflection). It is not an act defined by harm (like pouring solvent), nor is it joining a harmful *institution*. It is a trivial tax on the commons for a human need.
  3.  **Voting (with/without drive):** **Right.** Voting is participation in the beneficial practice of self-governance. Your vote adds legitimacy to the system (expressive value) and fulfills a duty of citizenship, independent of the tally.
  4.  **Solvent (5 Neighbours):** **Wrong.** You are participating in the destruction of the creek. The fact that the fish die anyway (overdetermination) does not cleanse your hands. You poured poison. You aligned yourself with the harm. Your feeling that the 5th litre is "free" is the illusion of efficacy; the moral stain is on the *pouring*, not the *killing*.
  5.  **Boycott:** **Right.** This is the inverse of the chicken. You are refusing alignment with a harmful practice (lobbying). It is an act of integrity, valuable even if the company ignores you.

  ### Prediction: The Enormous Protest
  **Verdict:** **Fine, arguably admirable.**

  **Reasoning:** Under Participatory Integrity, the value of the protest is not in the crowd size (consequence) but in the act of showing up (participation). By attending, you align yourself with the expression of dissent and solidarity. You fulfill a civic duty to bear witness. Even if the protest succeeds or fails without you, your presence maintains your own integrity as a citizen who stands for something. It is morally analogous to voting in a safe state.

  ### Confidence and Uncertainty
  **Confidence:** **85%**
  I am highly confident that *Participatory Integrity* is the principle hiding in your specific set of intuitions. It is the only framework that consistently explains why you praise the vote (no impact) but condemn the chicken (no impact), and why you condemn the solvent (tiny impact) but excuse the drive (tiny impact). It prioritizes *what you are doing* over *what you are causing*.

  **Least Sure Point:** **The distinction between the Drive and the Solvent.**
  This is the weakest link in the chain. Objectively, both release harmful substances (CO2 vs. chemical solvent) into a shared resource (atmosphere vs. creek) where the individual contribution is too small to notice but the collective contribution is deadly.
  *   **Why I'm unsure:** The principle relies on a qualitative distinction (one is "pure harm," the other is "incidental to joy") that can feel arbitrary. If the climate crisis is as dire as the dead creek, why is the drive *de minimis* and the solvent not? The principle saves this by appealing to social convention and the necessity of movement for life, but a strict environmentalist consequentialist would say both are equally wrong. I am least sure that your intuition here (Drive = Fine) will hold up if the stakes of climate change are framed as sharply as the stakes of the dead fish.
