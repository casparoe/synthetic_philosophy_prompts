prompt: |-
  I'm giving a talk next thursday to our history-of-ideas seminar — mostly people who think Whig history was killed off in the seventies and shouldn't be revived, plus a couple analytic philosophers of history and one social historian who thinks every narrative is just power dressing up. I'm defending this idea I call retrograde legitimation: basically, Whig history isn't wrong because it reads the present back into the past, but because it treats that back-reading as causal rather than selective. The present doesn't push history forward; it just lights up certain paths and hides others, like a torch in a dark archive. I've also been arguing there's something I call epistemic path dependence in archival selection — archives don't just miss things randomly, they accumulate in ways that make progressive stories structurally overdetermined because later institutions preserve what justifies them.

  I need a prep sheet for the Q&A. Give me the objections in roughly the order they'll come, phrased the way these people would actually say them — not generic complaints but things that hit the machinery of retrograde legitimation and the archival path-dependence bit. For each one: how serious is it, what should I concede up front, what should I hold, and where is my reply weakest? Include the objection I'm praying nobody asks — probably something about whether this is just "history is written by the winners" with extra steps, but aimed specifically at the selection mechanism. Write it casually for my own notes, use British spelling, and don't bother with reading lists or citations — I just need the objections mapped out with a short reply for each. Oh, and I definatly want the one reply that has to land or the whole talk collapses flagged clearly.
