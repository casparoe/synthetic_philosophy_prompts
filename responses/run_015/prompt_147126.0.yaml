      *   *Mechanism:* Gricean pragmatics meets Bayesian updating. If the speaker knew Judy was in Red, they'd say "You are in Red." If they knew she was in Blue, they'd say "You are in Blue." By saying "If Red, then Blue," they signal uncertainty but also a structural bias.
