      *   *Encoding the Partition:* The speaker could have said "If Blue, then Red." They didn't. They chose Red as the antecedent. This suggests Red is the marked/unlikely case in the speaker's mind. Antecedents are usually the "less expected" or "conditional" cases. Consequents are the "background" or "default" cases.
