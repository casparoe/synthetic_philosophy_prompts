      *   *Distinction:* Chaos says "small changes matter." Path Dependence says "you can't go back." They are related but distinct. Chaos explains *why* the path diverged; Path Dependence explains *why* she can't fix it mid-stream. The film supports Path Dependence heavily (she has to reset the loop, she can't fix Run 1 mid-run).

