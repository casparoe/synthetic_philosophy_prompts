  2.  **Deconstruct the Three Concepts (Amplification, Fragility, Steerability):**
      *   *Amplification:* Small input $\rightarrow$ Big output. (Butterfly effect).
      *   *Fragility:* The outcome wasn't inevitable; small changes *would* have changed the result. (Contingency).
      *   *Steerability:* Can an agent *control* the outcome based on knowledge? (Agency).
      *   *User's Hypothesis:* These don't necessarily go together. You can have amplification without fragility (robust systems), fragility without steerability (random noise).
      *   *Film Analysis:*
          *   Run 1 & 2: High Amplification (trip on stairs $\rightarrow$ death), High Fragility (outcome changes easily), Low Steerability (Lola is reactive, things go wrong despite effort).
          *   Run 3: High Amplification, High Fragility, *High Steerability* (because of memory).
