      *   **Boundary Conditions:** Individual instantiation vs. Aggregation (The most important plot point).
      *   **Philosophical Pitfalls:** The "Almost-Abyss" problem (incentive to keep pain just below the line).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the name? Yes, clarify that it's a composite concept.
      *   *Check:* Did I address the "sharp line" aspect? Yes, emphasize *discontinuity*.
      *   *Check:* Is the distinction from unconditional prohibition clear? Yes, unconditional prohibits the *type* of act/suffering always; this prohibits it only at intensity $X$.
      *   *Check:* Is the distinction from pure trade-off clear? Yes, pure trade-off is Archimedean; this is Non-Archimedean above $X$.

  8.  **Final Polish:** Ensure tone is helpful for a writer (conceptual rigor + narrative potential). (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated ethical architecture. You have correctly identified that while the component parts (utilitarianism, deontology, negative utilitarianism) are well-trodden, the specific *topology* of the value system you describe—a continuous function that becomes discontinuous at a specific magnitude—does not have a single, universally recognized common noun in moral philosophy.

  However, there are precise technical terms and conceptual frameworks that describe this structure. Using them will lend your novel significant conceptual rigor.

  ### 1. The Technical Name: Non-Archimedean Value with a Lexical Threshold

  The most precise mathematical and philosophical description of your system is a **Non-Archimedean Utility Function with a Lexical Threshold.**

  *   **Archimedean vs. Non-Archimedean:** In standard utilitarianism (Archimedean), any amount of pain can theoretically be outweighed by a sufficient quantity of pleasure. There is a ratio. In your system, above the threshold, the value becomes Non-Archimedean: no finite quantity of pleasure ($P$) can equal or outweigh a single unit of abyssal anguish ($A$). Mathematically, $A > \infty \times P$.
  *   **Lexical Priority:** This term (often associated with John Rawls) describes a hierarchy where one value must be fully satisfied before another is considered. In your case, the avoidance of abyssal anguish has *lexical priority* over the production of pleasure.
  *   **Discontinuous Threshold:** This captures the "sharp line" feature you emphasized. The function is continuous below the threshold and discontinuous (jumping to infinity/negative infinity) at the threshold.

  **Why this distinguishes it from other systems:**
  *   **Vs. Pure Utilitarianism:** Pure utilitarianism is fully Archimedean. It rejects lexical thresholds because they can lead to inefficiency (e.g., forbidding a minor rights violation that would save the world). Your system explicitly accepts that inefficiency to prevent the "abyss."
  *   **Vs. Absolute Deontology:** An absolute prohibition (e.g., "Torture is always wrong") bans an *act type* regardless of intensity. Your system bans an *experiential state* based on magnitude. A deontologist might forbid torture even if it causes only mild discomfort; your system permits mild discomfort to be traded for joy.
  *   **Vs. Standard Threshold Deontology:** In standard threshold deontology, rights hold *until* consequences become catastrophic (e.g., "Don't torture, unless it saves a million lives"). Your system is the **inverse**: consequentialist weighing holds *until* suffering becomes catastrophic (e.g., "Trade pain for joy, unless the pain is *this* severe").

  ### 2. Suggested Coinages for Narrative Use

  Since "Non-Archimedean Lexical Threshold" is a mouthful for dialogue, you might consider terms that capture the structural logic while sounding like part of your society's vernacular.

  *   **The Lexical Barrier:** Implies a wall that cannot be crossed by accumulation.
  *   **The Infinity Clip:** Suggests that crossing the line clips the value function into infinity.
  *   **The Discontinuity:** A clean, mathematical term citizens might use. ("That sentence violates the Discontinuity.")
  *   **Absolute Negative Priority:** Highlights that the negative value takes precedence absolutely, but only under specific conditions.

  ### 3. Crucial Boundary Conditions (For Conceptual Rigor)

  To render this calculus rigorously in your narrative, you must define how the threshold applies. This is where the most dramatic philosophical tension lies.

  #### A. Individual Instantiation vs. Aggregate Summation
  Does the threshold apply to a single conscious moment, or can it be triggered by accumulation?

  *   **Option 1: Individual Instantiation (The "Peak" Rule)**
      *   *Rule:* The threshold is crossed if *any single individual* experiences anguish above intensity $X$ at *any single moment*.
      *   *Consequence:* This is the most humane but restrictive version. It prevents "death by a thousand cuts" if those cuts are individually below the threshold. However, it creates a perverse incentive to keep torture *just below* the line.
  *   **Option 2: Aggregate Summation (The "Total" Rule)**
      *   *Rule:* The threshold is crossed if the *sum total* of anguish across the population exceeds a equivalent of intensity $X$.
      *   *Consequence:* This allows one person to suffer abyssally if it is "diluted" by enough joy elsewhere, which seems to violate your premise. Or, it means a million people suffering *just below* the threshold triggers the prohibition.
      *   *Recommendation:* For your premise to hold (that abyssal anguish cannot be offset), **Option 1** is philosophically stronger. It treats the threshold as a property of the *quality* of experience, not the quantity.

  #### B. The "Cliff Edge" Problem (The Sorites Paradox)
  You noted the boundary is not gradual. This creates a philosophical vulnerability known as the **Sorites Paradox** (the paradox of the heap).

  *   *The Problem:* If intensity $100$ is tradable, but $101$ is forbidden, the system implies a morally massive difference between two nearly identical states of pain.
  *   *Narrative Opportunity:* Your society likely struggles with "Borderline Cases." Does the calculus include a "hysteresis" buffer? (e.g., Once you approach 95, strict protocols activate to prevent crossing to 101).
  *   *The "Almost-Abyss" Loophole:* A ruthless administrator might argue that since $99.9$ is tradable, they can inflict near-abyssal pain on millions to generate vast joy, technically staying within the utilitarian zone. This is a rich source of conflict.

  #### C. Duration vs. Intensity
  Does the threshold apply to peak intensity, or intensity sustained over time?
  *   If a spike of abyssal anguish lasts one nanosecond, is it forbidden?
  *   If the threshold is based on **Integrated Suffering** (Intensity $\times$ Duration), then a long duration of moderate pain could cross the "abyssal" threshold.
  *   If the threshold is based on **Peak Intensity** only, then short bursts of extreme pain are forbidden, but long durations of high (but sub-threshold) pain are tradable.
  *   *Recommendation:* For maximum dramatic tension, define the threshold by **Peak Phenomenological Intensity**. This makes the measurement technology in your novel critical (monitoring spikes vs. averages).

  ### 4. Summary for Your World-Building Bible

  If you need a definition to anchor your writing, I propose this formulation:

  > **The Principle of Lexical Negativity:**
  > "Positive utility is fungible and aggregable across the population. Negative utility is fungible and aggregable *only* so long as the phenomenological intensity of any singular instance remains below the Critical Threshold ($T_c$). Any instance of suffering where Intensity $> T_c$ possesses infinite negative weight, rendering the net utility of the action undefined and prohibited, regardless of concurrent positive utility."

  **Distinction from Unconditional Prohibition:**
  An unconditional prohibition bans the *source* of the pain (e.g., "No neural stimulation"). Your system bans the *state* of the pain. This means the society might permit dangerous technologies or risky behaviors, provided they have fail-safes to ensure suffering never spikes above $T_c$. It creates a society obsessed with *measurement* and *dampening* rather than *prevention*.

  **Distinction from Pure Trade-Off:**
  In a pure trade-off society, a citizen could theoretically volunteer for abyssal torture if the payout in pleasure credits was high enough. In your system, **consent is irrelevant.** The prohibition is structural. Even if the victim agrees to the abyssal anguish, the Calculus forbids it, because the "infinity" of the pain cannot be mathematically cancelled by the "finitude" of the pleasure.

  ### 5. Philosophical Precedents to Reference
  If you wish to ground this in real philosophical discourse for your own research:
  *   **Derek Parfit:** Discussed "Lexical Views" in *On What Matters*. He explores whether some goods are qualitatively higher than others. You are applying this to bads.
  *   **Negative Utilitarianism:** (Popper, Smart). Focuses on minimizing suffering rather than maximizing happiness. Your system is a hybrid: Maximizing happiness *subject to* a Negative Utilitarian constraint.
  *   **Sufficientarianism:** Usually applies to resources (everyone must have *enough*), but can be adapted to suffering (no one must suffer *too much*).

  This structure is philosophically sound and distinct. It creates a society that is rational yet haunted by a "forbidden number," which is excellent territory for a novel.
