          *   How is it distinguished from simple unconditional prohibition or pure utilitarianism?
          *   If no name exists, suggest a precise coinage with boundary conditions (individual vs. aggregate).

  2.  **Philosophical Search & Mapping:**
      *   *Pure Utilitarianism:* All goods/bads are commensurable and fungible. No thresholds. (Ruled out by user's description).
      *   *Deontology/Rights-Based:* Certain acts are forbidden regardless of consequences. (Similar to the "above threshold" part, but usually act-based, not intensity-based).
      *   *Threshold Deontology:* This is the strongest candidate. It posits that deontological constraints hold *up to a point*, after which consequentialist considerations take over. *Wait, the user's system is the reverse.*
          *   Standard Threshold Deontology: Rights hold until consequences become *too bad* (e.g., torture one to save a million).
          *   User's System: Utilitarianism holds until suffering becomes *too bad* (e.g., no amount of joy justifies *this* level of pain).
          *   Actually, this is often called "Negative Utilitarianism with a Lexical Threshold" or "Lexical Prioritarianism."
      *   *Lexical Superiority/Priority:* Rawls's "Lexical Difference Principle." One good (liberty) cannot be traded for another (economic gain).
          *   Applied to suffering: "Lexical Negative Utilitarianism." Suffering above level $X$ has infinite disvalue compared to pleasure.
      *   *The "Sharp Line" Problem:* The user emphasizes the *discontinuity*. Just below = tradable, just above = forbidden. This is the "Cliff Edge" or "Discontinuous Threshold."
      *   *Specific Philosophical Concepts:*
          *   **The Repugnant Conclusion/Paradox:** Related to total vs. average, but not quite the threshold issue.
          *   **The Intensity Objection:** Some argue intensity matters more than duration/number.
          *   **Lexical Views:** Parfit discusses lexical views in *On What Matters*. A small amount of a higher good outweighs any amount of a lower good. Here, a small amount of "abyssal pain" outweighs any amount of pleasure.
          *   **Side Constraints:** Nozick. But again, usually act-based.
          *   **Sufficientarianism:** Enough is enough. Usually about goods, not bads.
          *   **Prioritarianism:** Weighting the worse off more heavily. But usually continuous, not a hard stop.

  3.  **Synthesizing the Terminology:**
      *   There isn't *one* single canonical term like "The Kantian Calculus."
      *   The closest technical description is **Lexical Negative Utilitarianism** or **Threshold Lexicality**.
      *   The specific structural feature (continuous below, absolute above) is a **Discontinuous Value Function** or a **Lexical Threshold**.
      *   In decision theory/economics, this is a **Lexicographic Preference** with a **Constraint**.
      *   In law/ethics, it resembles a **Trumping Right** that activates only at a certain severity.

  4.  **Drafting the Response:**

      *   **Acknowledge the Precision:** Validate that the user has identified a nuanced and philosophically rich structure. It's not standard Utilitarianism or standard Deontology.
      *   **Identify Closest Existing Concepts:**
          1.  *Lexical Prioritarianism / Lexical Negative Utilitarianism:* This captures the "infinite weight" aspect.
          2.  *Threshold Deontology (Inverted):* Explain how standard threshold deontology works (rights break under pressure) vs. this (utilitarianism breaks under intensity).
          3.  *Discontinuous Utility Function:* The mathematical term.
      *   **Distinguish from Alternatives:**
          *   vs. Pure Utilitarianism: No trade-offs allowed above threshold.
          *   vs. Absolute Deontology: Deontology usually bans *acts* (torture), not *intensities* of sensation regardless of cause. Also, deontology usually doesn't allow trade-offs *below* the threshold in the same way.
      *   **Propose Coinages (if needed):**
          *   "The Abyssal Threshold" (narrative friendly).
          *   "Lexical Suffering Constraint."
          *   "Discontinuous Negative Priority."
      *   **Address Boundary Conditions (Crucial for the novel):**
          *   *Individual vs. Aggregate:* This is the biggest logical trap. If one person feels threshold pain, is it banned? What if a million people feel *just below* threshold pain? Does it aggregate to cross the line?
          *   *The "Speck vs. Torture" Problem:* Refer to Parfit's "Repugnant Conclusion" variants. If the threshold is per individual, it avoids some aggregation issues but creates others (e.g., is it okay to torture 1 million people *just below* the line to save one person *just above* the line?).
      *   **Narrative Implications:** How does this affect the society? Bureaucracy of measurement, fear of the "clip," black markets for pain suppression.

  5.  **Refining the Philosophical Accuracy:**
      *   *Correction:* Standard "Threshold Deontology" is usually: Deontological constraints apply *until* consequences get too bad, then Utilitarianism kicks in.
      *   *User's System:* Utilitarianism applies *until* suffering gets too bad, then Deontological/Absolutist constraints kick in.
      *   *Term:* This is arguably a form of **Negative Utilitarianism with a Lexical Threshold**.
      *   *Key Philosopher:* Derek Parfit discussed lexical views. David Benatar (Better Never to Have Been) leans toward negative utilitarianism but not necessarily this specific calculus.
      *   *Mathematical Term:* **Non-Archimedean Value Structure**. In Archimedean systems, any quantity $A$ can be outweighed by enough of quantity $B$. In Non-Archimedean, some $A$ is infinitely greater than any $B$. This is the precise mathematical definition of the user's "abyssal anguish."

