answer: |-
  Here is a complete lesson plan designed to fit your constraints (bolted desks, low-tech, 90 minutes) and pedagogical goals (breaking the "verbal dispute" illusion).

  # Lesson Plan: The Black Box Protocols

  **Class Size:** 22 Students
  **Time:** 90 Minutes
  **Materials:**
  *   6 Envelopes (labeled "Group 1" through "Group 6").
  *   Inside each envelope: 3 "Black Box Packets" (one for each scenario), 1 "Protocol Card," 1 "Verdict Sheet," 1 pad of "Query Slips."
  *   Index cards (for background conditions in Scenario 3).
  *   Phone timer.
  *   Pens.

  ## 1. Seating & Grouping (5 Minutes)
  Since desks are bolted in a grid, assign groups by row/column to facilitate the "diagonal pass."
  *   **6 Groups total** (Four groups of 4, Two groups of 3).
  *   **Procedure Assignment:**
      *   **Groups 1, 3, 5:** *World-Comparers* (Lewis-style protocol).
      *   **Groups 2, 4, 6:** *Trial-Runners* (Woodward-style protocol).
  *   **Pairing:** Group 1 pairs with Group 2 (diagonally adjacent). Group 3 with 4. Group 5 with 6.
  *   **Rule:** You may not speak to the other group until the "Comparison Phase." You communicate only by passing Verdict Sheets.

  ## 2. The Protocols (5 Minutes)
  Hand out the Envelopes. Tell them: *"You are engineers auditing a flood-control system. You cannot see the wiring. You only have your Query Slips and your Protocol Card. If you write a query that violates your Protocol, I will void it."*

  **Protocol A: World-Comparers (Groups 1, 3, 5)**
  *   **Goal:** Determine *dependence*.
  *   **Allowed Query:** "In the closest possible situation where [Variable] is different, with **no other changes** unless forced by the laws of nature, does [Outcome] change?"
  *   **Constraint:** You cannot "force" other variables to stay fixed if the natural chain would move them. You cannot test background conditions other than the Actual One.
  *   **Query Slip Text:** `IMAGINE: [Var] = [Value]. OUTCOME?`

  **Protocol B: Trial-Runners (Groups 2, 4, 6)**
  *   **Goal:** Determine *control*.
  *   **Allowed Query:** "Surgically set [Variable] to [Value]. **Clamp** all other input variables to specific values of my choice. Does [Outcome] change?"
  *   **Constraint:** You must test if the relation holds across different background settings (provided on the Index Cards). If the effect disappears when you change the background, the handle is broken.
  *   **Query Slip Text:** `INTERVENE: Set [Var]=[Value]. CLAMP: [Other Var]=[Value]. OUTCOME?`

  ## 3. The Game: Three Black Boxes (45 Minutes)
  *15 Minutes per Box. Use the timer strictly.*

  ### Box 1: "The Chain" (Unit 1)
  *   **Logic:** R (Sensor) → P (Pump) → V (Valve) → F (Flood). All deterministic. Actual: All 1 (High/On).
  *   **World-Comparers:**
      *   Ask: "Imagine R=0."
      *   *Packet Response:* "P becomes 0 (forced by chain). V becomes 0. F becomes 0."
      *   Ask: "Imagine P=0."
      *   *Packet Response:* "V becomes 0. F becomes 0."
      *   **Verdict:** R, P, and V are all Causes. (Transitivity holds).
  *   **Trial-Runners:**
      *   Ask: "Set R=0. Clamp P=Actual."
      *   *Packet Response:* "Invalid Query. You cannot clamp an intermediate variable downstream of your intervention." (Forces them to trace the path).
      *   Ask: "Set R=0."
      *   *Packet Response:* "F=0."
      *   **Verdict:** R, P, and V are all Causes.
  *   **Outcome:** Both sheets match. *Purpose: Establish baseline competence.*

  ### Box 2: "The Watchdogs" (Unit 2)
  *   **Logic:** A (Trip) & B (Trip) → S (Shutoff). Function: S = A OR B. Actual: A=1, B=1, S=1. Independent triggers.
  *   **World-Comparers:**
      *   Ask: "Imagine A=0."
      *   *Packet Response:* "B remains 1 (independent). S remains 1."
      *   Ask: "Imagine B=0."
      *   *Packet Response:* "A remains 1. S remains 1."
      *   **Verdict:** Neither A nor B is a Cause. (The outcome didn't *hinge* on either specific one).
  *   **Trial-Runners:**
      *   Ask: "Set A=0. Clamp B=0."
      *   *Packet Response:* "S=0." (Because you clamped the backup off).
      *   Ask: "Set B=0. Clamp A=0."
      *   *Packet Response:* "S=0."
      *   **Verdict:** Both A and B are Causes. (Both are handles that *can* move the output if the other path is blocked).
  *   **Outcome:** **DIVERGENCE.** World says "No Cause." Trial says "Cause."

  ### Box 3: "The Fragile One" (Unit 3)
  *   **Logic:** D (Damper) + T (Temp) → Short (S).
      *   If T=Cold: D=Closed → Short. D=Open → No Short.
      *   If T=Hot: D=Closed → No Short. D=Open → No Short.
      *   Actual: T=Cold, D=Closed, S=Short.
  *   **World-Comparers:**
      *   *Constraint:* Must use "Actual" Background Card (Cold).
      *   Ask: "Imagine D=Open."
      *   *Packet Response:* "Short = No."
      *   **Verdict:** D is a Cause. (It hinged on D in the actual situation).
  *   **Trial-Runners:**
      *   *Constraint:* Must test across *both* Background Cards (Cold & Hot) to establish invariance.
      *   Ask: "Set D=Open. Background=Cold." → Response: "S=0."
      *   Ask: "Set D=Open. Background=Hot." → Response: "S=0."
      *   Ask: "Set D=Closed. Background=Cold." → Response: "S=1."
      *   Ask: "Set D=Closed. Background=Hot." → Response: "S=0."
      *   *Analysis:* Does D reliably control S? No. It only works in Cold.
      *   **Verdict:** D is **Not** a Robust Cause (or "Context-Dependent").
  *   **Outcome:** **DIVERGENCE.** World says "Cause." Trial says "Not Robust/No."

  ## 4. Comparison Phase (15 Minutes)
  1.  **Swap:** Groups pass their Verdict Sheets diagonally to their partner group.
  2.  **Silent Review (5 mins):** Mark discrepancies with a red pen. Do not talk yet.
  3.  **Structured Argument (10 mins):**
      *   Prompt on board: *"One of you is asking 'Did it hinge?' The other is asking 'Can I pull it?' Write one sentence to the other group explaining why their verdict feels wrong to you."*
      *   Collect a few responses. Read them aloud.
      *   *Expected tension:* World side will say Trial side is "cheating" by turning off the backup (B). Trial side will say World side is "useless" because D doesn't work in the summer.

  ## 5. Debrief & Theory Mapping (15 Minutes)
  *Do not name Lewis or Woodward until the last 5 minutes.*

  **Step 1: The Chain (Transitivity)**
  *   **Ask:** "Why did you agree here?"
  *   **Point:** Both procedures handle simple chains.
  *   **Theory Reveal:** "The World-Comparers were using **Stepwise Dependence**. If F depends on V, and V on P, Lewis builds a chain. The Trial-Runners just followed the wire. This is the easy case."

  **Step 2: The Watchdogs (Preemption/Overdetermination)**
  *   **Ask:** "World-Comparers, why did you say A wasn't a cause?"
      *   *Answer:* "Because S would have happened anyway."
      *   **Theory Map:** "This is the problem of **Preemption**. Lewis's basic counterfactual theory fails here. He had to invent **Quasi-Dependence** (intrinsic process) to fix it. You didn't have that tool, so you said 'No Cause'."
  *   **Ask:** "Trial-Runners, why did you say A *was* a cause?"
      *   *Answer:* "Because when we turned off B, A mattered."
      *   **Theory Map:** "This is **Path-Specific Causation** or testing **Capacity**. Woodward argues causation is about *potential* manipulation, not just actual dependence. You clamped B to test A's capacity. You aren't asking 'Did it happen?' you're asking 'Is it a handle?'"

  **Step 3: The Fragile One (Invariance)**
  *   **Ask:** "Trial-Runners, why did you reject D?"
      *   *Answer:* "It didn't work in the Hot background."
      *   **Theory Map:** "This is **Invariance**. For Woodward, a causal generalization must hold across a range of background conditions. If it breaks when the context changes, it's not a stable law."
  *   **Ask:** "World-Comparers, why did you accept D?"
      *   *Answer:* "Because in the *actual* world, changing it changed the outcome."
      *   **Theory Map:** "Counterfactuals are often **Context-Sensitive**. They care about the actual world's history. Woodward cares about the *model's* stability."

  **Step 4: The Verdict**
  *   "These aren't two definitions of the same word. They are two different tools.
      *   **Tool 1 (Lewis):** Forensic. 'What did *this* outcome hinge on in *this* history?' Good for blame, history, explanation.
      *   **Tool 2 (Woodward):** Engineering. 'What can I manipulate to change the outcome reliably?' Good for policy, science, control.
      *   The 'verbal dispute' vanishes when you realize you are answering different questions."

  ## 6. Troubleshooting & Limitations

  **Predictable Failure Mode 1: "Cheating" the Protocol**
  *   *Risk:* World-Comparers will try to "clamp" variables mentally (e.g., "Imagine A=0 and B=0").
  *   *Fix:* The Query Slips. World-Comparers *only* have slips that say `IMAGINE: [Var] = [Value]`. They literally cannot write "Clamp B". If they try to write it, walk over and void the slip.
  *   *Risk:* Trial-Runners forgetting to test background conditions in Box 3.
  *   *Fix:* The "Black Box Packet" for Box 3 contains two Index Cards (Cold/Hot). The Protocol Card says: "Must test on all provided Background Cards."

  **Predictable Failure Mode 2: "The Model Expansion" Objection**
  *   *Risk:* A sharp student in the Trial group says for Box 3: "We just add Temperature to the model as a variable, then D is invariant relative to (D, T)."
  *   *Response:* "You are absolutely right. That is exactly what a Woodwardian does in a seminar. But in this *game*, your budget only allows you to manipulate D. You are testing D *as a standalone handle*. This simulates the real-world constraint where you can't always control the background. The point is that D *alone* is not an invariant handle."

  **Predictable Failure Mode 3: Confusion on Box 2 (Watchdogs)**
  *   *Risk:* Trial-Runners think they are "cheating" by turning off B, since B was actually On.
  *   *Response:* Remind them: "You are testing the *mechanism*, not the *history*. If you want to know if A is a switch, you test if it works when the other switch is broken."

  **What the Game Cannot Reproduce (Be Honest)**
  1.  **The Metaphysics of Worlds:** The World-Comparers are treating "Closest World" as a lookup table. In reality, similarity metrics are vague and contentious. The game hides this vagueness.
  2.  **The Definition of "Intervention":** Woodward spends hundreds of pages defining what counts as a "surgical" intervention (no side effects, etc.). The game assumes your "Clamp" is perfect.
  3.  **Probabilistic Causation:** All boxes here are deterministic. Real causation is often probabilistic.
  4.  **The "Why":** The game shows *that* they differ. It doesn't prove *which one is true*. You must state: "Philosophers still fight about which question is the 'real' causation. But now you know they are fighting about tools, not just dictionary definitions."

  ## Materials Checklist for Instructor
  1.  **Query Pads:** Pre-printed. World side: `IMAGINE [Var] IS [Value]. WHAT IS [Outcome]?` Trial side: `SET [Var] TO [Value]. CLAMP [Other] TO [Value]. WHAT IS [Outcome]?`
  2.  **Response Keys:** You need 6 sets of answer keys (one per group) inside the envelopes.
      *   *Key 1 (Chain):* Simple logic table.
      *   *Key 2 (Watchdogs):* World Key says "If A=0, B=1." Trial Key says "If A=0, B=Clamped Value."
      *   *Key 3 (Fragile):* World Key has only "Cold" data. Trial Key has "Cold" and "Hot" data.
  3.  **Verdict Sheets:** Simple grid: `Variable | Cause (Y/N) | Confidence (1-5)`.
  4.  **Timer:** Visible to you.

  This plan respects the physical constraints, enforces the procedural divergence through material design (the slips and keys), and leads directly into the theoretical distinction without front-loading the jargon.
