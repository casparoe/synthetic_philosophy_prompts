answer: |-
  # Session Plan: The Compound Game (90 Minutes)

  **Goal:** Demonstrate the divergence between Expected Value (Arithmetic Mean) and Sustainable Growth (Geometric Mean) through lived experience, without using jargon until the debrief.
  **Audience:** 18 Undergrads (Mixed background).
  **Materials:** 
  - Projector + Shared Spreadsheet (live-editable).
  - Two opaque bags (Bag A: 6 Green/4 Red chips; Bag B: 5 Green/5 Red chips).
  - Pre-printed "Bankroll Trackers" (one per student) as backup.
  - Play money (optional, points on screen are better).

  ---

  ## Part 1: Setup & Rules (15 Minutes)

  **1. The Hook (5 mins)**
  Tell them: "We are testing investment strategies. There is no trick. The game is mathematically in your favor. Your goal is to have the most points at the end. There are no penalties for losing, other than having fewer points."

  **2. The Groups (5 mins)**
  Split the room 50/50 (9 vs 9).
  *   **Group Time (Sequential):** These 9 students play individually. They keep their own winnings. They experience the sequence one after another.
  *   **Group Pool (Ensemble):** These 9 students play as a *single collective entity*. 
      *   *Mechanism:* Every round, all 9 place the bet. We sum their total wealth, divide by 9, and assign that average back to everyone as their starting point for the next round. 
      *   *Why:* This mathematically eliminates individual variance. They represent the "Expected Value" path.

  **3. The Commitment (5 mins)**
  *   **Starting Bankroll:** 100 Points each.
  *   **The Bet:** "Heads" (Green chip) multiplies your wager by **1.6** (you keep wager + 60% profit). "Tails" (Red chip) multiplies your wager by **0** (you lose the wager). *Wait, simpler:* 
      *   **Win:** You keep your wager + 60% profit (Total multiplier on wagered portion = 1.6).
      *   **Lose:** You lose the wager (Total multiplier on wagered portion = 0).
      *   **Unwagered:** Stays safe (Multiplier = 1).
      *   *Correction for simplicity:* To avoid complex math, use fixed multipliers on the *whole bankroll* based on the fraction.
      *   **Better Rule:** You choose a fraction $f$ (e.g., 20%). 
          *   If Win: New Bankroll = Old $\times (1 + 0.6f)$.
          *   If Lose: New Bankroll = Old $\times (1 - f)$.
      *   **Projector:** Display a lookup table. If you bet 20% and Win, multiply by 1.12. If Lose, multiply by 0.8. *Do not make them calculate this.* Provide a "Cheat Sheet" for 10%, 20%, 50%, 100%.

  *   **The Constraint:** "For the first 10 rounds, you must commit to **one fixed fraction** (10%, 20%, 50%, 100%). Write it down. Hand it to me. You cannot change it until Round 11."

  ---

  ## Part 2: Phase 1 — The Bull Market (25 Minutes)

  **The Environment:** Bag A (60% Win, 40% Lose).
  **The Math:** EV is positive. Kelly Optimal is 20%. 
  *   100% bettors will likely survive but be volatile.
  *   50% bettors will grow.
  *   20% bettors will grow steadily.

  **The Play:**
  1.  **Strategy Selection (5 mins):** Groups discuss. 
      *   *Predict:* Group Pool will likely vote for high $f$ (50-100%) because they are insured against ruin by the averaging. Group Time will be split; some will feel fear.
  2.  **Rounds 1-10 (15 mins):** 
      *   Draw a chip from Bag A. Announce result.
      *   Groups update scores (Scribes update the Projector Sheet).
      *   **Crucial:** Do not reveal the bag contents (6/4). Just say "The market is open."
  3.  **Mid-Game Check (5 mins):** 
      *   Show the leaderboard. 
      *   *Likely Outcome:* Group Pool (Average) is skyrocketing. Group Time (Individual) is scattered—some 100% bettors are way ahead, some are way behind. 
      *   Ask: "Is anyone unhappy with their strategy?" (The 100% bettors who got unlucky will be nervous).

  ---

  ## Part 3: The Twist & Phase 2 (25 Minutes)

  **1. The Secret Change (5 mins)**
  *   Swap Bag A for Bag B (50% Win, 50% Lose). **Do not announce this.**
  *   Tell them: "The market conditions have shifted. You may now **revise your fraction** for Rounds 11-20. Choose wisely."
  *   *Why:* In a 50/50 game with this payout, the Expected Value is *zero* ($0.5 \times 0.6 - 0.5 \times 1.0 = -0.2$? Wait. 
      *   Let's check the math for the Twist.
      *   Phase 1: Win +60%, Lose -100% of wager. $p=0.6$. EV = $0.6(0.6) - 0.4(1) = -0.04$. **Wait, this is negative EV.**
      *   *Correction:* I need Positive EV in Phase 1.
      *   **Revised Bet Structure:** 
          *   Win: +100% of wager (Double or nothing on the bet portion).
          *   Lose: -60% of wager.
          *   Phase 1 ($p=0.6$): EV = $0.6(1) - 0.4(0.6) = 0.36$ (Positive). Kelly $\approx 23\%$.
          *   Phase 2 ($p=0.5$): EV = $0.5(1) - 0.5(0.6) = 0.2$ (Still Positive, but lower). Kelly $\approx 8\%$.
      *   *Actually, to make the point sharper:* Make Phase 2 **Fair** ($p=0.5$, Win +100%, Lose -100%). EV = 0. Kelly = 0%.
      *   *Let's go with the Fair Coin Twist.* It makes the "shading down" imperative obvious.
      *   **Revised Rules for Simplicity:** 
          *   Win: Wager doubles (Total bankroll $\times (1+f)$).
          *   Lose: Wager lost (Total bankroll $\times (1-f)$).
          *   Phase 1: Biased Coin (60% Win). EV+, Kelly = 20%.
          *   Phase 2: Fair Coin (50% Win). EV = 0, Kelly = 0%.
      *   *Wait, if EV=0, Pool doesn't grow.* That's good. It shows Pool stagnates, Time decays (due to volatility drag).
      *   *Better:* Phase 2 is slightly positive EV (55% Win), but Kelly drops to 10%. If they stay at 20%, they are over-betting.
      *   **Decision:** Phase 2 is 55% Win. EV is still positive. Pool will still grow. But Time players who stay at 20%+ will see growth slow or reverse due to volatility drag. This creates the disagreement: Pool says "Keep betting!", Time says "I'm dying."

  **2. Rounds 11-20 (15 mins)**
  *   Play through. 
  *   Watch the 100% bettors in Group Time crash (one loss wipes them out).
  *   Watch the 50% bettors in Group Time stagnate.
  *   Watch Group Pool continue to climb (because they average out the variance).

  **3. The Reveal (5 mins)**
  *   Reveal the bag change.
  *   Ask Group Time: "Who kept their fraction the same? How did you do?"
  *   Ask Group Pool: "Did you feel the need to change?" (They likely didn't, because their average kept growing).

  ---

  ## Part 4: The Debrief (25 Minutes)

  **1. Map the Experience (10 mins)**
  *   **The Pool = Arithmetic Mean (Expected Value).** Because they pooled risk, they experienced the *average* outcome of the bet. They saw the EV.
  *   **The Time Players = Geometric Mean (Growth Rate).** Because they played sequentially, a single loss reduces the base for the next bet. Volatility acts as a drag.
  *   **The Divergence:** Point to the scoreboard. "Group Pool saw a profitable game. Group Time (specifically the high bettors) saw a game that ruined them. Same math, different experience."
  *   **Introduce Terms:** Now you can say "Ergodicity," "Kelly Criterion," "Geometric vs Arithmetic."

  **2. Address the "Utility" Interrupter (5 mins)**
  *   *Scenario:* An Econ major says, "This is just risk aversion. The 100% bettor had a different utility function."
  *   *Your Response:* "If utility were the only factor, the 100% bettor would be happy with their choice ex-ante. But in Phase 2, the 100% bettor went to zero. That's not a preference; that's an absorption barrier. You can't bet with zero points. The math of sequences forces a constraint that a one-off utility function ignores."

  **3. The "Shading Down" Insight (5 mins)**
  *   "Why did the optimal fraction drop in Phase 2 even though the bet was still profitable?"
  *   **Lesson:** Uncertainty and reduced edge require lower leverage. The "optimal" EV bet (100% if EV>0) is not the "optimal" growth bet. When you aren't sure of the edge (the bag swap), survival dictates you bet less than the math says you could.

  **4. What The Game Hid (5 mins)**
  *   *Be Honest:* "This game lied to you in four ways. If you apply this blindly to real life, you will fail."
      1.  **Multiplicativity:** Real life isn't pure compounding. You have income (additive) that replenishes your bankroll. Kelly assumes you can't add money.
      2.  **Known Probabilities:** You knew (eventually) the bag contents. In reality, you never know the true edge. This requires *fractional* Kelly (betting half the recommended amount) to account for estimation error.
      3.  **Infinite Divisibility:** You could bet 17.4 points. In reality, bets are lumpy.
      4.  **Horizon:** Kelly is asymptotic. It works over 1,000 rounds. Over 20 rounds, variance can kill a 'correct' Kelly bettor. If you have a short deadline (graduation, rent due), EV maximization might actually be rational because you don't have time for the geometric mean to converge.

  ---

  ## Predicted Failure Modes & Fixes

  | Failure Mode | Why it happens | The Fix |
  | :--- | :--- | :--- |
  | **The 100% Bettor** | Someone wants to "win" the game and goes all-in. They go bust in Round 3. | **Don't save them.** Let them go bust. They are the most important data point. In debrief, ask them: "Did the EV say you should win? Yes. Did you? No. Why?" |
  | **The 0% Bettor** | Someone refuses to play, citing risk. | **Acknowledge validity.** "You opted out of the sequence. That's a valid survival strategy, but you guaranteed 0 growth. You proved the point: to grow, you must risk ruin." |
  | **"It's Utility"** | Econ student reduces it to risk preference in Minute 10. | **Hold the line.** "We will discuss utility in the debrief. For now, track the points. Utility is subjective; bankruptcy is objective." |
  | **Pool Noise** | With only 9 people, the Pool's average might fluctuate wildly. | **Use the Projector.** If the Pool dips, highlight it. "Even the Pool felt that. Imagine if you were alone." If it's too noisy, aggregate the Group Time players into a "Median Survivor" line for comparison. |
  | **Bookkeeping Drag** | Calculating $100 \times 1.2$ eats 10 minutes. | **The Lookup Table.** Provide a handout: "If you bet 20%: Win = $\times 1.12$, Lose = $\times 0.8$." Or use the Projector Sheet where you (the facilitator) input the result and the formula auto-calculates. **Do not let them calculate.** |

  ---

  ## The "Honesty" Script (For the Limitations)

  *Read this verbatim or adapt closely for the final 5 minutes:*

  "I need to tell you where this model breaks. We just proved that maximizing Expected Value can bankrupt you in a sequence. But that argument relies on specific assumptions:
  1.  **You must reinvest everything.** If you can take profits off the table to pay rent, the risk of ruin drops.
  2.  **The game must be multiplicative.** If you get a fixed \$10 bonus per round (additive), EV maximization becomes safe again. Most of your life is additive (salary) with multiplicative pockets (investing). Don't apply Kelly to your grocery budget.
  3.  **You need time.** Geometric growth is an asymptote. In the short run, variance dominates. If you need money in 20 rounds, a lower bet might be safer, but a higher bet might be your only chance to hit a target.
  4.  **You never know the odds.** We knew the bag changed. In the real world, the bag changes without telling you. That means the 'Optimal' fraction is always an guess. The rational move is to bet *less* than the calculation says—usually half—just to account for the fact that you might be wrong."

