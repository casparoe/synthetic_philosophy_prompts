  ## Facilitator Cheat Sheet (The Math)

  *   **Bet:** Wager fraction $f$.
  *   **Win:** Bankroll $\times (1 + f)$.
  *   **Lose:** Bankroll $\times (1 - f)$.
  *   **Phase 1 (60% Win):** 
      *   EV: Positive.
      *   Kelly Optimal: 20%.
      *   50% Bettor: Positive EV, Negative Growth (Volatility Drag).
      *   100% Bettor: High EV, Certain Ruin eventually.
  *   **Phase 2 (55% Win):** 
      *   EV: Positive (but lower).
      *   Kelly Optimal: 10%.
      *   *Lesson:* If they stay at 20%, they are now over-betting. Growth slows.
  *   **Phase 2 Alternative (50% Win - Fair Coin):**
      *   EV: Zero.
      *   Kelly Optimal: 0%.
      *   *Lesson:* Pool stays flat. Time players decay (Geometric mean of 1.5 and 0.5 is < 1). *Recommended for sharper contrast.*

  **Recommendation:** Use the **Fair Coin (50%)** for Phase 2. It makes the "Pool stays flat, Time decays" contrast undeniable.
