answer: |-
  I say this looks **better** than the last,
  and spend a **coin** to make the exchange.
  The path I walk draws out a **circle**.
  I call each step a voluntary **trade**.
  I feel no **loss** until the thing is done,
  and stand again exactly at my **home**.

  Back **home**, but lighter than I was before.
  The next option looks **better** in its turn.
  I accept the **loss** as cost of getting more.
  Another **coin** slips quiet from my hand.
  No single **trade** feels like a mistake made.
  The path returns to close the **circle** tight.

  The **circle** closes on the starting point.
  I hold the same old thing I called **home** first.
  Yet I have paid for every single **trade**.
  Each choice seemed **better** than the one before.
  I cannot say I lost a single **coin**
  while knowing I accepted certain **loss**.

  If I foresee the **loss** before I start,
  I see the **circle** waiting in the dark.
  I keep the **coin** inside my pocket safe.
  I never leave the safety of my **home**.
  But now what's **better** shifts beneath my feet.
  The will to **trade** depends on where I stand.

  So this **trade** buys a little order only.
  It stops the bleed, prevents the certain **loss**.
  It does not make all options **better** ranked.
  There are more ways to break the **circle** law.
  You cannot pump a man back to his **home**
  if the gamble hangs upon a **coin**.

  The **coin** remains the measure of the gap.
  Some rational men will **trade** against the grain.
  They claim the map does not lead **home** enough.
  They risk a **loss** to keep their freedom whole.
  The **circle** argument leaves this space open.
  Is that a fault, or simply **better**?

  I **trade** my doubt to make the future **better**,
  and seek a **home** free from the certain **loss**.
  The **circle** closes, payment in a **coin**.
