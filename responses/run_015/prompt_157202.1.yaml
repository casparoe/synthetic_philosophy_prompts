      *Self-Correction on "Obscure Secondary Literature":* I should avoid citing specific modern scholars (like Garfield, Westerhoff, King) unless they are universally recognised as standard introductions. Better to refer to "standard translations of the *Mūlamadhyamakakārikā*" or "consensus among scholars of Buddhist philosophy". I will refer to the primary text verses which are widely available.

