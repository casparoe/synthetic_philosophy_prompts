  **Project Title:** The Social Cost of Search: Re-framing Satisficing in Group Deliberation

  **Principal Investigator:** [Your Name]
  **Duration:** 3 Months (Summer Fellowship)
  **Deliverable:** 4,000-word working paper

  ### 1. The Core Idea and Research Question

  We know that individuals satisfice. When the cost of searching for a better option outweighs the expected benefit—or when cognitive resources run dry—agents stop looking and pick the first option that meets their threshold. This is the standard bounded rationality story. But groups don't seem to stop searching for the same reasons individuals do.

  In my experience observing deliberative bodies, groups often halt the search for alternatives not because everyone is cognitively exhausted, but because continuing the search becomes socially expensive. If you keep bringing up new options in a jury room or an ethics board meeting after a consensus is forming, you aren't just taxing your own brain; you're signaling distrust, wasting others' time, or being obstructive. The "bound" here isn't cognitive capacity; it's social capital.

  This leads to my primary research question: **Is group-level satisficing merely the aggregation of individual bounded rationality, or is it a distinct phenomenon driven by social enforcement mechanisms with its own normative failure conditions?**

  I want to draw a sharp line between two scenarios. In the first, the group stops because every member has individually hit a cognitive wall (aggregate bounded rationality). In the second, some members might still have cognitive capacity to search, but they suppress further inquiry because the social cost of dissent exceeds the expected value of a better outcome (social satisficing). If the latter is true, then the normative criteria we use to evaluate group rationality might need adjustment. A group could be "rationally" satisficing according to standard models while simultaneously failing a specific social-epistemic norm.

  ### 2. Gap in the Literature

  The standard literature on bounded rationality, stemming from Simon and expanded by behavioral economists, focuses almost exclusively on the individual agent. Even when applied to organizations, the focus tends to be on how individual cognitive limits scale up, or how information asymmetries create friction.

  What's missing is a treatment of the *deliberative cost* as a social constraint rather than an informational one. Current models treat the cost of search as time or computational power. They don't adequately model the cost of search as reputational risk or social friction. Consequently, when a group settles sub-optimally, the standard diagnosis is usually "communication failure" or "preference aggregation problem." This misses the possibility that the group is functioning exactly as designed, but the design ignores the social penalties imposed on deep searchers.

  There is a gap here for a conceptual account that treats social pressure as a specific type of bound on rationality, distinct from cognitive limits. We need to know if this changes how we judge the rationality of the outcome. If a jury settles on a verdict because pushing for more evidence would make you look like a holdout jerk, is that a rational stopping point? The current literature doesn't have a good place to put this. It's not quite irrational, but it's not standard rationality either.

  ### 3. Methodology

  Given the three-month timeline and the conceptual nature of the problem, I propose a method based on **conceptual analysis and decision-theoretic framing**, anchored by two concrete institutional cases.

  **The Cases:**
  1.  **Criminal Juries:** Specifically, the shift from deliberation to voting. When does the pressure to reach a verdict override the search for exculpatory nuance?
  2.  **Institutional Ethics Boards (IRBs):** When does a board approve a protocol with minor reservations rather than demanding significant redesign, due to the social cost of delaying research?

  **The Approach:**
  I will not be conducting empirical interviews or experiments. There are two reasons for this. First, getting access to jury deliberations or closed IRB meetings is practically impossible within a summer window. Second, and more importantly, we lack the conceptual vocabulary to know what to measure. If we don't know how to distinguish social satisficing from ordinary compromise empirically, data collection is premature.

  Instead, I will use decision-theoretic framing to model the "cost function" of search. In standard models, Cost(Search) = Time + Cognitive Effort. I want to propose a modified function where Cost(Search) = Time + Cognitive Effort + **Social Sanction**.

  By framing it this way, I can analyze whether the inclusion of the Social Sanction variable violates standard axioms of group rationality. For example, does the presence of social costs make the group's preference ordering intransitive in a way that individual preferences are not? This allows me to work through the logic without needing a dataset.

  ### 4. Expected Results and Contributions

  The goal is to produce a 4,000-word paper that establishes the conceptual distinction and offers a preliminary normative assessment.

  **Potential Findings:**
  My hunch is that social satisficing violates an independence condition that individual satisficing does not. In individual bounded rationality, my stopping point depends on my threshold and my environment. In social satisficing, my stopping point depends on *your* threshold and my perception of your patience. This interdependence suggests that group satisficing isn't just additive.

  I hope to show that:
  1.  **Distinct Failure Modes:** Group satisficing can lead to "false consensus" errors that aren't predictable by summing individual biases.
  2.  **Normative Implications:** If social satisficing is distinct, then interventions to improve group decision-making shouldn't just focus on reducing cognitive load (e.g., better charts, more time) but on reducing social sanctions (e.g., anonymous voting, protected dissent roles).

  **Considerations Deciding Between Options:**
  The main pivot point will be whether the "social cost" can be reduced to individual utility functions. If a member stops searching because they fear social sanction, isn't that just them maximizing their own utility (avoiding awkwardness)? I need to determine if this counts as a distinct *group-level* phenomenon or just individuals acting rationally within a social context. If it's the latter, the project shifts to a critique of utility modeling. If it's the former, it supports the idea of emergent group rationality constraints. I'm leaning toward the latter, but the analysis needs to prove it.

  ### 5. Feasibility and Timeline

  Is three months enough? Honestly, it's tight, but manageable if I stay disciplined about the scope.

  *   **Month 1:** Formalize the decision-theoretic framing. Define the "Social Sanction" variable clearly so it doesn't just look like a standard payoff.
  *   **Month 2:** Apply the framework to the two cases (Juries, IRBs). This is where I might get bogged down in details, so I need to keep the case descriptions focused on the decision node where search stops.
  *   **Month 3:** Drafting and refining the normative argument.

  The risk is that the decision-theoretic modeling becomes too complex. I need to resist the urge to build a full formal model. The goal is a conceptual argument *supported* by framing, not a math paper. If I try to prove a new theorem, I won't finish. If I stick to showing how the existing framework fails to capture the social cost, I can meet the deadline.

  There is a real danger of biting off too much here. The literature on group dynamics is huge. I have to ignore the psychological side (groupthink) and the political side (power dynamics) to focus strictly on the rationality bounds. Keeping that lane discipline will be the hardest part.

  ### 6. Assessment of Failure Conditions

  It's important to be clear about what counts as failure for this project, mostly so I don't convince myself I've succeeded when I haven't.

  **Successful Outcome:** I demonstrate that social satisficing creates a unique class of error that cannot be explained by aggregated individual bounds or standard preference aggregation. I provide a clear criterion for when social stopping rules are normatively acceptable vs. when they constitute a rationality failure.

  **Failure Mode 1: Redescription.** The most likely failure is that I end up just redescribing ordinary compromise or political negotiation. If "social cost" just means "I want to go home" or "I don't want to fight with my boss," then this is already covered by existing utility models. If I can't distinguish social satisficing from standard strategic behavior, the project collapses.

  **Failure Mode 2: Triviality.** I might conclude that yes, social costs exist, but they don't actually change the normative evaluation. If the group is still maximizing expected utility (including social comfort), then calling it "bounded rationality" might be misleading. I need to show that something important is lost in that translation.

  **Failure Mode 3: Scope Creep.** Trying to solve the whole problem of group rationality. I need to keep this focused on the *stopping rule* for search, not the entire deliberative process.

  ### 7. Conclusion

  This project sits at the intersection of decision theory and social epistemology. It's a small piece of a larger puzzle about how we evaluate collective intelligence, but it's a piece that seems currently missing. By isolating the social cost of search, I hope to show that groups aren't just collections of bounded individuals—they are bounded by their own social architecture.

  If successful, this paper will lay the groundwork for a larger dissertation chapter on institutional design. It suggests that making groups smarter isn't just about giving them more data or smarter members, but about changing the social price of asking "what if?"

  I think this is doable in the summer window, provided I don't get sucked into the empirical weeds. The conceptual ground needs plowing before we can plant anything else. Let me know if you think the distinction between social sanction and individual utility is robust enough to carry the weight. I'm confident it is, but I'd love to hear where you think the weak point might be.

  Thanks for considering this. I'm ready to get started as soon as the funding clears.

