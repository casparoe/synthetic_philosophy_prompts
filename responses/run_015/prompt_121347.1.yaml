  can you write this up as a formal proposal? please include:
  - the precise research question, with the distinction i'm making really clear
  - why the standard literature on bounded rationality leaves this gap open (i don't need named citations, i'll add them)
  - the method: conceptual analysis of two concrete institutional cases plus some decision-theoretic framing, and why this approach rather than an empirical study
  - what results could look like—maybe showing that group satisficing violates some independance condition?—and what considerations decide between the options
  - an honest assessment: is three months enough, or am i biting off too much?
  - what counts as failure, e.g., if i just end up redescribing ordinary compromise
  - and definitely no bibliography or reading list, i can do that part myself

  write it casually, like for a phd committee but not stiff. and maybe leave a typo or two in, my advisor hates perfect drafts anyway.
