prompt: |-
  I'm applying for a three-month interdisciplinary fellowship that supports independent conceptual projects. I'm a software engineer with no formal philosophy background, but I've been working through Frankfurt-style counterexamples to the principle of alternative possibilities (PAP). My half-formed idea is that the debate treats "could have done otherwise" as a unitary modal property, and I think that's a category error—something like treating a distributed system's rollback capability and its feature-flag branching as the same mechanism. I want to propose splitting PAP into two conditions: local branch availability (whether an agent retains an accessible decision node at the relevant time) and global trajectory divergence (whether the agent's actual causal history could have led to a genuinely different outcome state). The research question: does this split allow us to concede Frankfurt's point about global trajectory divergence being blocked by a counterfactual intervener, while maintaining that local branch availability remains intact and is sufficient for a meaningful form of moral responsibility?

  Turn this into a formal proposal of about two pages. I need: (1) the precise research question stated so that it has a determinate yes-or-no answer; (2) why existing Frankfurt responses—hierarchical models of desire, appeals to flickers of freedom, and the standard defense of PAP—leave this particular split unresolved rather than dissolving it; (3) the method: what I would actually do month by month over three months, including which thought experiments I would construct and which conceptual distinctions I would pressure-test, and why this analytical approach rather than an empirical or purely historical one; (4) what a positive result would look like versus what would count as failure—specifically, be honest about whether the split collapses back into the standard debate; (5) a realistic scope assessment for a non-philosopher working alone for three months; and (6) take a committed position: defend definitively whether this split is philosophically productive or merely a redescription, and explain what considerations drive that verdict rather than laying out both sides and leaving me to choose. No citations, bibliography, or literature review by reference are required—I will add those myself.
