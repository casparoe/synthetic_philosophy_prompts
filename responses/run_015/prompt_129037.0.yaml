answer: |-
  **Project Title:** Architecting Agency: A Structural Analysis of Alternative Possibilities

  **Research Question**
  Is Local Branch Availability (LBA) sufficient for attributions of moral responsibility in Frankfurt-style cases where Global Trajectory Divergence (GTD) is precluded?

  **Project Overview and Philosophical Context**
  The debate surrounding the Principle of Alternative Possibilities (PAP) typically treats the capacity to "do otherwise" as a monolithic modal property. Frankfurt-style counterexamples attempt to sever the link between responsibility and this capacity by introducing a counterfactual intervener who ensures a specific outcome while leaving the agent's actual decision process untouched. Standard responses to Frankfurt cases generally fall into three camps: those who defend PAP by arguing alternative possibilities remain (Flicker of Freedom strategies); those who reject PAP entirely in favor of source-based or hierarchical models of agency; and those who argue the intervener destroys the relevant freedom regardless of the outcome.

  All three approaches share a critical blind spot: they assume that if an alternative possibility exists, it must be of the same kind as the actual sequence. They treat modality as unitary. My project proposes that this is a category error analogous to conflating a distributed system's rollback capability with its feature-flag branching. I distinguish between **Global Trajectory Divergence (GTD)**—the metaphysical possibility that the world state could have evolved differently given the actual causal history—and **Local Branch Availability (LBA)**—the structural property wherein an agent retains access to a decision node at the relevant time, regardless of whether the output of that node is ultimately constrained by external factors.

  My hypothesis is that Frankfurt cases successfully block GTD but leave LBA intact. The project argues that LBA, not GTD, is the necessary and sufficient condition for moral responsibility. This allows us to concede the Frankfurt point (that we are responsible even if we could not have globally diverged) without abandoning the core intuition of PAP (that responsibility requires some form of alternative access).

  **Critique of Existing Responses**
  Existing frameworks fail to resolve this specific split because they do not distinguish between the *architecture* of choice and the *metaphysics* of outcomes.
  1.  **Standard PAP Defenses:** These insist GTD must remain possible. They fail because Frankfurt cases convincingly show GTD can be blocked without affecting the agent's internal experience or culpability.
  2.  **Flicker of Freedom Strategies:** These argue that some slim alternative possibility remains (e.g., the possibility of initiating the action vs. having it forced). However, they treat this "flicker" as a weakened version of GTD rather than a distinct structural category. They do not explain *why* this specific flicker matters while other blocked alternatives do not.
  3.  **Hierarchical/Source Models:** These bypass alternative possibilities entirely, focusing on whether desires align with higher-order volitions. While robust, they abandon the "could have done otherwise" intuition rather than refining it. They fail to explain why we still feel the *availability* of a choice node is relevant, even if the outcome is fixed.

  By failing to separate LBA from GTD, these models talk past one another. They argue over whether alternatives exist, rather than which *structural property* of alternatives carries normative weight.

  **Methodology and Work Plan**
  This project employs conceptual analysis rather than empirical study or historical exegesis. The question is not how agents *feel* or what philosophers *said*, but whether the proposed distinction holds logical coherence and normative utility.

  *   **Month 1: Formalization and Mapping.** I will rigorously define LBA and GTD using state-machine analogies to ensure precision. I will map classic Frankfurt cases onto this model to demonstrate that while the "world state" transition function is fixed (no GTD), the "agent node" remains an active switch (LBA). I will produce a formal taxonomy of Frankfurt variants (early, late, and implicit interveners) to test the robustness of the split.
  *   **Month 2: Stress Testing via Thought Experiments.** I will construct "Hybrid Cases" to pressure-test the distinction.
      *   *Case A (LBA without GTD):* The standard Frankfurt case.
      *   *Case B (GTD without LBA):* A scenario where the outcome is contingent, but the agent is bypassed entirely (e.g., random neural firing leads to action).
      *   *Case C (Neither):* Coercion.
      *   *Case D (Both):* Standard libertarian freedom.
      I will evaluate intuitions of blame and praise across these four quadrants. If responsibility tracks LBA (present in A and D) rather than GTD (present only in D), the hypothesis holds.
  *   **Month 3: Synthesis and Normative Evaluation.** I will analyze whether LBA carries the necessary normative weight. Does having a "switch" matter if the circuit is rigged? I will draft the final paper, arguing that LBA represents the locus of control, while GTD represents mere metaphysical openness.

  **Success and Failure Criteria**
  *   **Positive Result:** The project demonstrates that responsibility intuitions track LBA consistently across Hybrid Cases. Specifically, it shows that Case B (GTD without LBA) elicits no responsibility, proving GTD is insufficient, while Case A (LBA without GTD) elicits responsibility, proving LBA is sufficient. The split successfully dissolves the Frankfurt objection by redefining the "alternative" PAP requires.
  *   **Failure:** The split collapses. This would occur if I demonstrate that LBA logically entails GTD (i.e., you cannot have a functional decision node without the possibility of a different global outcome) or if LBA proves normatively inert (i.e., we determine that a "rigged switch" is no switch at all). If the distinction turns out to be merely verbal—describing the same metaphysical constraint with different vocabulary—the project fails.

  **Scope Assessment**
  For a non-philosopher working alone for three months, this scope is ambitious but manageable. The risk lies in drifting into deep metaphysics regarding causation or determinism. To mitigate this, I will restrict the analysis to the *structure* of the thought experiments themselves, treating them as logical puzzles rather than claims about physical reality. The software engineering background is an asset here, allowing for precise modeling of state transitions without getting bogged down in traditional metaphysical jargon. The deliverable will be a single, polished paper of 6,000–8,000 words.

  **Committed Position**
  This split is philosophically productive, not merely a redescription. The verdict rests on the explanatory power of the distinction. Traditional debates stall because they assume that for an alternative to matter, it must be a *real* metaphysical possibility (GTD). This leads to intractable arguments about determinism. By shifting the criterion to LBA, we move the debate from metaphysics to architecture. We are not asking "Could the universe have been different?" but "Was the agent's decision mechanism structurally engaged?"

  This is productive because it aligns with our actual practices of blame. We blame agents for navigating decision nodes, even when we suspect their character or environment made the outcome inevitable. We do not blame agents for outcomes that diverge globally but bypass their decision nodes (e.g., spasms). Therefore, the LBA/GTD split captures a distinction that existing models miss: the difference between *being the source of an action* (LBA) and *being the origin of a history* (GTD). By isolating LBA, we preserve the insight of PAP—that agency requires options—without succumbing to the Frankfurt objection that those options must lead to different worlds. This reframes the problem of free will from a mystery about cosmic openness to a tractable analysis of agential structure.
