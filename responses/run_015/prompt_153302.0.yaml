          *   **Constraint:** Be honest with the translation (don't smuggle DS assumptions as philosophy).

  2.  **Deconstruct the Philosophical Accounts:**
      *   *Expectation View (Utilitarian/Consequentialist):* Promises bind because breaking them creates harm (disappointed expectations). Focus on consequences.
      *   *Practice/Convention View (Rawlsian/Rule-Utilitarian):* Promises bind because they participate in a social institution/practice that relies on general compliance. Focus on the system integrity.
      *   *Authority/Recognition View (Kantian/Will Theory):* Promises bind because the promisor exercises authority over their own future, transferring a right to the promisee. Focus on autonomy and normative power.

  3.  **Deconstruct the Distributed Systems Lens:**
      *   *State:* Current configuration of the system.
      *   *Transition:* Change from one state to another.
      *   *Consensus:* Agreement among nodes on the state.
      *   *Finality:* Irreversibility of a transaction.
      *   *Smart Contract:* Code that executes automatically upon conditions.
      *   *Byzantine Fault:* Nodes acting arbitrarily/maliciously.
      *   *Fork:* Divergence in the chain of history.

  4.  **Drafting the Translations (Iterative Process):**

      *   *Expectation View:*
          *   *DS Mapping:* Predictive modeling. Node A signals intent to Node B. Node B optimizes its local state based on this signal. Breaking the promise is a prediction error causing local state corruption (harm).
          *   *Distortion:* Reduces moral obligation to utility loss. DS cares about consistency, not necessarily "harm" unless defined as state corruption.
          *   *Residue:* Why is the *signal* itself binding, not just the outcome? DS doesn't care about the intent, only the state match.

      *   *Practice View:*
          *   *DS Mapping:* Protocol integrity. The "Promise Protocol" exists. If nodes violate the protocol frequently, the network loses trust/utility (tragedy of the commons). Binding force = maintenance of protocol liveness/safety.
          *   *Distortion:* Implies individual acts are only wrong because of systemic impact. DS usually handles individual faults via slashing/reputation, not necessarily moral weight.
          *   *Residue:* The feeling of *personal* obligation even if no one finds out. DS is observational; morality is often internal.

      *   *Authority/Recognition View:*
          *   *DS Mapping:* Smart Contract / Token Transfer. Promisor invokes a function that locks future state. Promisee gets a "private key" to claim that future state. It's a state transition initiated by will.
          *   *Distortion:* DS code is law (automated). Moral authority is normative, not executable. You can't "force" a human state change like code.
          *   *Residue:* The *normative power* to create obligation. Code executes; humans *feel* bound. The "ought" vs. "is" gap.

      *   *The "Fork" Analogy:*
          *   Breaking a promise = A node proposing a block that violates previous consensus.
          *   Is it mergeable? Apology/restitution = reorg? Or is the history permanently tainted?
          *   Social state vs. Ledger state. Ledgers can reorg; trust often cannot.

  5.  **Addressing "Settled vs. Contested":**
      *   *Settled:* Promises create reasons for action. Breaking them requires justification.
      *   *Contested:* *Why* they bind. Is it the harm? The practice? The will? There is no consensus on the "source code" of morality.

  6.  **Refining the "Residue Report":**
      *   Is the leftover stuff real? Yes. DS describes *mechanisms* of coordination. Morality describes *reasons* for coordination. The "Normative Force" (the 'ought') is the biggest residue. DS explains how we *do* coordinate, not why we *should*.

  7.  **Review against Constraints:**
