answer: |-
  This is a high-fidelity analogy, but it risks category errors if we treat the map as the territory. Distributed systems (DS) describe *how* state is coordinated; moral philosophy describes *why* that coordination is obligatory.

  Below is the translation of the three dominant accounts of promissory obligation into distributed-systems vocabulary, followed by the residue report and the fork analysis.

  ### 1. The Expectation View (Consequentialist/Utilitarian)
  **Philosophical Core:** Promises bind because breaking them causes harm (disappointed expectations). The obligation is derived from the negative utility of the breach.

  *   **DS Translation:** **Predictive State Optimization.**
      *   **The Protocol:** Node A sends a signal (promise) to Node B indicating a future state transition $T_{future}$.
      *   **The Binding:** Node B optimizes its local state and allocates resources based on the probability of $T_{future}$.
      *   **The Breach:** Node A fails to execute $T_{future}$. Node B suffers a "consistency error" or resource waste (harm).
      *   **Why it binds:** To minimize network-wide latency and resource waste caused by prediction failures.
  *   **Clean Mapping:** The causal link between signal and resource allocation. In DS, false signals degrade throughput; in morality, broken promises degrade welfare.
  *   **Distortion:** This reduces the *promise* to a *prediction*. In DS, if I predict rain and you bring an umbrella, I am not obligated to make it rain. The Expectation View struggles to explain why a promise is different from a mere statement of intent, other than the intensity of the expectation.
  *   **Residue (No Analog):** **The Special Obligation.** In DS, I owe nothing to Node B specifically unless we have a SLA (Service Level Agreement). In morality, the promise creates a *directed duty* to the promisee, not just a general duty to minimize harm. DS handles general network health well; it doesn't natively handle specific interpersonal debt without a pre-existing contract.

  ### 2. The Practice/Convention View (Rawlsian/Rule-Utilitarian)
  **Philosophical Core:** Promises bind because they participate in a social institution ("the practice of promising") that relies on general compliance. If everyone broke promises, the institution would collapse.

  *   **DS Translation:** **Protocol Integrity & Consensus Safety.**
      *   **The Protocol:** "Promising" is the consensus layer (e.g., Proof-of-Stake).
      *   **The Binding:** Individual transactions (promises) are valid only because the network accepts the consensus rules.
      *   **The Breach:** A Byzantine Fault. A node signs a block (promise) but later acts contrary to it.
      *   **Why it binds:** To prevent "slashing" of the network's utility. If Byzantine faults exceed a threshold, the network loses liveness (trust collapses).
  *   **Clean Mapping:** The systemic reliance on compliance. One bad actor might be tolerable; systemic non-compliance causes a network halt. This maps well to the idea that promises only work if *generally* kept.
  *   **Distortion:** It makes the individual act derivative of the system. In DS, a node doesn't care about the protocol's existence; it follows rules to get rewards/avoid penalties. In morality, I am bound *even if* my specific breach wouldn't crash the system (the "small scale" problem).
  *   **Residue (No Analog):** **Internal Normativity.** DS nodes follow protocols because they are programmed to or incentivized to. Humans follow norms because they recognize them as *reasons for action*. The DS model explains compliance via external constraints (code/incentives); the Practice view claims the rule itself provides the reason.

  ### 3. The Authority/Recognition View (Will Theory/Kantian)
  **Philosophical Core:** Promises bind because the promisor exercises normative power over their own future, transferring a "right" to the promisee. The promisee now has authority over that specific action.

  *   **DS Translation:** **Smart Contract / Token Handover.**
      *   **The Protocol:** A state transition function that locks future agency.
      *   **The Binding:** Node A invokes a function that transfers control of a specific state variable to Node B. Node B now holds the "private key" to that future action.
      *   **The Breach:** Node A attempts to overwrite a state variable that Node B now controls.
      *   **Why it binds:** Because the state transition has already occurred. The authority was transferred at $T_{promise}$, not $T_{fulfillment}$.
  *   **Clean Mapping:** The transfer of control. This captures the intuition that breaking a promise violates the *promisee's right*, not just a general rule. It treats the promise as an immediate change in normative status.
  *   **Distortion:** Smart contracts are self-executing; moral promises are not. In DS, if I transfer the key, the code enforces the restriction. In morality, I retain the physical capacity to break the promise, even if I lack the *right*. DS conflates *capability* with *authority*.
  *   **Residue (No Analog):** **Normative Force.** This is the biggest gap. In DS, state changes are descriptive (it *is* so). In morality, obligations are prescriptive (it *ought* to be so). The Authority view claims humans can change their "moral state" by speech act alone. DS has no equivalent to a "speech act" that changes state without a cryptographic signature or code execution.

  ---

  ### The "Fork" Analysis: Promise Breaking as State Divergence

  You asked to treat promise-breaking as a **fork** in social state.

  *   **The Analogy:** When you promise, you and the promisee agree on a "canonical chain" of future events. When you break the promise, you propose a new block that contradicts the previous consensus.
  *   **Mergeability:**
      *   **In DS:** Forks are often resolved by "longest chain" rules. Orphaned blocks are discarded; the network moves on.
      *   **In Morality:** A breach creates a **persistent bad branch**. You cannot simply "reorg" the moral history by apologizing (mining a new block). The orphaned block (the breach) remains in the history of the relationship.
      *   **Illumination:** This highlights that moral state is **append-only** regarding faults, whereas DS state is often **prunable**. In DS, once consensus moves past a fault, it is irrelevant. In morality, the breach creates a permanent "scar" or debt that must be explicitly reconciled (restitution), not just outpaced.
  *   **Where it Breaks:** In DS, a fork is usually technical (latency, malicious mining). In morality, a fork is often a **re-evaluation of validity**. Sometimes, breaking a promise is the *correct* chain (e.g., "I promised to meet you, but I stopped to save a life"). In DS, the protocol defines valid blocks. In morality, higher-order protocols (emergency, duress) can invalidate the previous consensus, which looks more like a hard fork driven by governance than a technical reorg.

  ---

  ### The Residue Report

  **Is the leftover stuff real gap or philosophical fog?**

  It is a **real gap**.

  1.  **The "Ought" Gap:** Distributed systems are descriptive mechanisms. They explain how consistency is *achieved*. Morality is normative. It explains why consistency is *required*. You can map the structure of the obligation, but you cannot map the *force* of the obligation. A smart contract binds because the code prevents exit; a promise binds because the agent *accepts* the bind. The DS model cannot simulate voluntary constraint without external enforcement.
  2.  **The Identity Gap:** In DS, Node A at $T_1$ is identical to Node A at $T_2$ via cryptographic keys. In morality, personal identity over time is part of the problem. The "Authority View" assumes I can bind my future self. DS assumes the private key persists. But philosophically, *why* does my future self owe a debt to my past self's speech act? DS assumes the key is authority; Philosophy asks why the key is authority.

  **Verdict:** The DS framework is excellent for modeling the *consequences* and *structures* of promising (coordination, trust, state consistency). It fails to model the *source* of the obligation (normativity). If you treat the residue as "fog," you risk reducing morality to mere engineering (might makes right / code is law). If you treat it as a "gap," you acknowledge that human coordination involves a layer of meaning that protocols do not capture.

  ---

  ### Settled vs. Contested (Philosophical Status)

  To ensure we aren't smuggling one view as consensus:

  **Settled (Broad Agreement):**
  *   Promises create pro-tanto reasons for action (you need a reason to break them).
  *   Breaking promises generally requires justification or restitution.
  *   Promises involve communication and reliance.

  **Contested (Live Debates):**
  *   **The Source:** Is the obligation created by the *harm* (Expectation), the *rule* (Practice), or the *will* (Authority)? There is no consensus.
  *   **The Scope:** Can you promise to do something immoral? (Authority view says no, you lack the power; Practice view says yes, but the practice overrides it).
  *   **The "Future Self" Problem:** Do I have the authority to bind my future self? (Kantians say yes via autonomy; Humeans say no, that's a fiction).
  *   **Implicit vs. Explicit:** Does the practice view require explicit conventions, or are there implicit social contracts? (DS leans explicit; Philosophy is divided).

  **Summary for your framework:**
  Use the DS analogy to model the **topology** of the obligation (who owes what, when state changes, how breaches propagate). Do not use it to model the **physics** of the obligation (why the bond exists). The "fork" analogy is particularly strong for understanding the persistence of moral debt versus the transience of technical errors.
