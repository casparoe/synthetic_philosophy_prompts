          *   Prediction: What do statisticians do? Precisionist says "They pick a prior and bet." Credalist says "They hedge or pass."
          *   Concession: If statisticians universally pass, Precisionist admits pragmatic rationality allows suspension. If they bet sharply, Credalist admits sets collapse too fast.

      *   *Crux 2: Worst-Member Scoring Rule (Incentives).*
          *   Setup: Scored by worst member of interval.
          *   Precisionist View: Proper scoring rules incentivize truth. This rule incentivizes shrinking intervals to points (sharp). Interval reporting is strategic lying/conservatism.
          *   Credalist View: If the state *is* an interval, this rule penalizes honesty. A "set-proper" rule is needed.
