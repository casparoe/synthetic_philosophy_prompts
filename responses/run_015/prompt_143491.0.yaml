  *(Refining the Two-Instrument Case)*: Precisionist *must* assign a probability to B being junk. If they say "I can't," they violate their own view. So their prediction is that statisticians *will* implicitly assign a prior (e.g., 50/50). Credalist predicts statisticians will feel the ambiguity and hesitate.

