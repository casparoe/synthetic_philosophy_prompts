answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: PRECISION VS. CREDAL REPRESENTATION

  **Parties:** The Precisionist (Sharp Bayesian) & The Credalist (Imprecise Probabilist)
  **Status:** Working Draft for Signature
  **Date:** October 2023

  ## 1. AGREED CLAIMS

  1.  **Avoidance of Sure Loss:** Both parties agree that a rational agent should not accept a package of bets that guarantees a loss *relative to the agent's own representation of the world*. The Precisionist interprets this as avoiding a Dutch Book against a single function $P$. The Credalist interprets this as avoiding a Dutch Book against any member of the credal set $\mathbb{P}$, or avoiding sure loss across the set simultaneously.
  2.  **Evidence Constraints:** Both parties agree that receiving evidence $E$ should constrain belief. For the Precisionist, this means $P_{new}(\cdot) = P_{old}(\cdot | E)$. For the Credalist, this means $\mathbb{P}_{new} \subseteq \mathbb{P}_{old}$ (conditioning each member), possibly accompanied by a reduction in the size of the set (shrinkage) as ambiguity is resolved.
  3.  **Action Necessity:** Both parties agree that when forced to choose between mutually exclusive acts, a rational agent must select one. There is no "null action" in a forced choice scenario. The disagreement concerns whether the *state* prior to choice must be sharp to justify the selection.
  4.  **Pragmatic Reporting:** Both parties agree that reported probabilities in non-ideal settings (surveys, markets) conflate doxastic state with pragmatic incentives (rounding, strategic hedging, communication costs). Both agree that observed "fuzziness" in reports does not settle the metaphysical question of the underlying state.
  5.  **Asymptotic Convergence:** Both parties agree that given a sufficiently long stream of independent, informative evidence, rational credence regarding a hypothesis should converge to 0 or 1. The disagreement concerns the trajectory of that convergence and the status of the credence prior to convergence.

  ## 2. DISAGREEMENTS TABLE

  | Topic | Precisionist Formulation | Credalist Formulation |
  | :--- | :--- | :--- |
  | **The Doxastic Primitive** | The fundamental state of belief is a single probability function $P$. Any appearance of a set $\mathbb{P}$ is a result of the agent's inability to introspect $P$ fully, or a pragmatic decision to report a range to avoid overconfidence penalties. | The fundamental state of belief can be a set of probability functions $\mathbb{P}$. This is not introspective failure; it is the correct representation of states where evidence does not determine a unique distribution (ignorance/ambiguity). |
  | **Rational Requirement** | Rationality mandates Maximizing Expected Utility (MEU) relative to $P$. If an agent fails to pick the act with highest $E$-value, they are irrational, regardless of how "unsure" they feel. | Rationality permits any act that is E-admissible (maximizes EU for at least one $P \in \mathbb{P}$). In cases of high ambiguity, rationality may *require* passing or hedging (via $\Gamma$-maximin) even if a specific $P \in \mathbb{P}$ favors a risky bet. |
  | **Dilation** | Dilation (where posterior uncertainty is greater than prior uncertainty after partitioning evidence) is a pathology of imprecise updating rules. It indicates the model is flawed because learning should not increase uncertainty. | Dilation is a valid feature of rational belief. When evidence is of unknown reliability, learning *that* you have evidence can correctly increase the spread of $\mathbb{P}$ to reflect the new ambiguity about the evidence's source. |
  | **Introspection** | If an agent cannot state a sharp probability, they are suffering from a cognitive limitation, not a representational one. With sufficient reflection or incentive, a sharp $P$ would emerge. | There is no sharp $P$ to find. Forcing an agent to state a number creates a fiction. The "true" state is the set, and demanding a point estimate forces the agent to lie about their uncertainty. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  ### Crux 1: The Two-Instrument Case (Ambiguity vs. Risk)
  **Sub-Question:** Does the absence of a base rate for Instrument B's reliability mandate a sharp prior (Indifference) or a credal set (Ambiguity)?

  **The Case:**
  Instrument A reads 0.30 (known error distribution). Instrument B reads 0.80. B is either perfect (like A) or junk (uniform random). You have no evidence regarding B's quality (no base rate). You are offered an even-money bet that the true value is $> 0.50$.
  *   **Option 1:** Bet For ($> 0.50$).
  *   **Option 2:** Bet Against ($\leq 0.50$).
  *   **Option 3:** Pass (Free).

  **Predictions:**
  *   **Precisionist:** Predicts that competent statisticians, when forced to model this, will implicitly assign a sharp prior to B's reliability (e.g., 0.5 probability B is junk). Consequently, they will calculate a sharp expected value and **place a bet** (For or Against). They will view "Passing" as an error or a refusal to model.
  *   **Credalist:** Predicts that competent statisticians will recognize the structural difference between A (risk) and B (ambiguity). They will **Pass** or demand odds significantly better than even money. They will treat the lack of base rate as a prohibition on forming a sharp prior.

  **Concessions:**
  *   **Precisionist Concedes:** If the overwhelming majority of competent statisticians universally refuse to bet (Pass) without assigning a prior, the Precisionist admits that "rationality" in practice permits suspension of judgment that cannot be reduced to a sharp number.
  *   **Credalist Concedes:** If statisticians universally assign a 0.5 prior to B's reliability and bet accordingly without hesitation, the Credalist admits that the Principle of Indifference is a more robust rational requirement than previously thought, and that sets collapse to points faster than expected.

  ### Crux 2: The Worst-Member Scoring Rule
  **Sub-Question:** Do proper scoring rules incentivize sharp reporting because belief is sharp, or because the rules are biased against sets?

  **The Case:**
  Forecasters report an interval $[L, U]$.
  *   **Rule A (Worst-Member):** If event occurs, score $L$. If event fails, score $U$. (You are scored on the member of your interval least favorable to the truth).
  *   **Rule B (Best-Member / Symmetric Foil):** If event occurs, score $U$. If event fails, score $L$. (You are scored on the member most favorable to the truth).
  *   **Rule C (Set-Proper):** A rule designed to be minimized only when the reported set matches the true credal set (e.g., penalizing width while rewarding calibration).

  **Predictions:**
  *   **Precisionist:** Predicts that under **Rule A**, all rational forecasters will report points ($L=U$). This demonstrates that intervals are merely strategic hedges against penalty, not genuine states. Under **Rule B**, forecasters will report maximal intervals $[0,1]$ (gaming the system). This proves intervals are unstable.
  *   **Credalist:** Predicts that under **Rule A**, forecasters will report points only because the rule penalizes honesty about imprecision. Under **Rule C**, forecasters will report non-degenerate intervals. The behavior under Rule A is an artifact of the rule baking in sharpness, not evidence against imprecise states.

  **Concessions:**
  *   **Precisionist Concedes:** If a significant portion of forecasters report non-degenerate intervals under a properly incentivized **Rule C** (where width is penalized but imprecision is allowed), the Precisionist admits that sharp points are not the only stable reporting strategy under truth-seeking incentives.
  *   **Credalist Concedes:** If forecasters report maximal intervals $[0,1]$ under **Rule B** even when they claim to have specific knowledge, the Credalist admits that without a penalty for width (imprecision), the set representation lacks normative force and collapses into triviality.

  ### Crux 3: Long-Run Collapse
  **Sub-Question:** Does the convergence of credal sets to a point vindicate the view that the state was always sharp?

  **The Case:**
  An agent faces an infinite stream of independent evidence regarding a hypothesis $H$.
  *   **Precisionist Expectation:** By Doob's Consistency Theorem, $P(H|E_n)$ converges to 0 or 1 almost surely.
  *   **Credalist Expectation:** The credal set $\mathbb{P}_n$ should shrink (diameter $\to 0$) as evidence accumulates, eventually resembling a point.

  **Predictions:**
  *   **Precisionist:** Predicts that the *process* of shrinking shows the initial set was merely a measure of computational or evidential limitation. Since the limit is sharp, the underlying reality of the belief was always sharp; the width was just noise.
  *   **Credalist:** Predicts that the width of $\mathbb{P}$ is a distinct variable from the location. The set can shrink to a point without implying it *started* as a point. Dilation may occur mid-stream (width increases) before collapsing, which a sharp model cannot replicate without ad-hoc adjustments.

  **Concessions:**
  *   **Precisionist Concedes:** If the credal set *widens* (dilates) significantly in the mid-stream of evidence gathering before eventually collapsing, the Precisionist admits that a single function $P$ cannot model the rational trajectory of belief without arbitrary adjustments to the likelihood function.
  *   **Credalist Concedes:** If the credal set diameter decreases monotonically from the very first piece of evidence (no dilation ever), the Credalist admits that the "imprecision" was likely just a lack of data that behaves exactly like a sharp prior with high variance, weakening the case for sets as a primitive.

  ## 4. CLOSING NOTE: MERELY VERBAL DISPUTES

  We identify one area where the dispute appears largely verbal, though it sustains significant friction: **The Definition of "Belief State."**

  *   **The Verbal Core:** The Precisionist defines "belief state" as *the disposition to accept bets under ideal reflection*. By this definition, if you can be forced to bet, you have a sharp price, so you have a sharp belief. The Credalist defines "belief state" as *the representational content carried by the agent*. By this definition, you can carry a set of representations even if forced to pick a single act.
  *   **Why it Persists:** When the Precisionist says "You must have a number," they mean "You must act as if you have a number." When the Credalist says "There is no number," they mean "There is no number in the representation before the act."
  *   **Resolution Path:** We agree to stop arguing about whether the agent "has" a number in the abstract. We will restrict claims to: (1) whether the *representation* requires a set to avoid loss, and (2) whether the *action* requires a selection rule that differs from MEU. If the disagreement reduces solely to whether we call the pre-action state "one number hidden" vs. "many numbers explicit," we will classify it as terminological and move to the decision-rule implications.
