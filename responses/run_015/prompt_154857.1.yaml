answer: |-
  You haven't described something confused. You have identified a very real, structurally significant tension in the ethics of technology and organizational liability. It is not a single, canonical "Trolley Problem" style named concept, but it is a recognized cluster of problems in risk ethics, legal theory, and organizational sociology.

  Here is the breakdown of the phenomenon, the closest names we have, the boundaries of the concept, and the normative reply you are looking for.

  ### 1. Does it have a name?
  There is no single universally agreed-upon term, but you are describing the intersection of three established concepts. Depending on which literature you dive into, you will find it labeled as one of the following:

  *   **The Competence Penalty (or Liability of Competence):** This is the colloquial/organizational behavior term. It describes the dynamic where higher capability attracts disproportionate responsibility for failure.
  *   **Epistemic Liability:** This is the philosophical framing. It refers to the burden incurred specifically by possessing knowledge that others lack.
  *   **Circumstantial Moral Luck (specifically Epistemic Luck):** In the Nagel/Williams framework, the engineers are victims of bad *moral luck*. They are morally unlucky that they *know* the risk. Their ignorant colleagues are morally lucky that they remain ignorant, allowing them to escape blame despite contributing to the same outcome.
  *   **The Transparency Paradox (in Safety Engineering):** Sometimes used to describe how safety documentation (meant to protect) becomes evidence of negligence (meant to prosecute).

  **Confidence:** High (0.9) that the phenomenon is real and recognized; Medium (0.6) that there is one canonical label. You are likely expected to define it yourself in your seminar.

  ### 2. Is it one phenomenon or squashed effects?
  You are squashing two distinct mechanisms that reinforce each other. It is useful to separate them for your analysis:

  *   **Mechanism A: The Evidentiary Trap.** (Legal/Bureaucratic)
      The documentation exists. In a post-hoc investigation, the document is the only objective proof of *mens rea* (guilty mind). Without the document, *mens rea* is hard to prove. This is a procedural artifact of how we investigate harm.
  *   **Mechanism B: The Duty of Knowledge.** (Moral/Normative)
      We generally hold that "ought implies can," but in risk ethics, "knowledge implies ought." If you know $X$ causes harm, you have a stronger duty to prevent $X$ than if you don't know. The blame flows to the knower because their *capacity to intervene* was higher.

  **Why this matters:** Mechanism A is a flaw in our investigative/legal processes (we rely too much on paper trails). Mechanism B is a feature of moral reasoning (knowing people *should* stop bad things). Your intuition about the "incentive toward ignorance" arises because Mechanism A punishes the *state of knowing* without rewarding the *attempt to mitigate* sufficiently.

  **Confidence:** High (0.85) that these are distinct but compounding drivers.

  ### 3. Does it need an organizational setting?
  It survives in single-person cases, but the "incentive toward ignorance" is vastly weaker there.

  *   **Single Person:** If I know my brakes are squeaky and drive anyway, I am to blame. If I don't check my brakes and they fail, I am also to blame (negligence). The delta between "knowing" and "not knowing" is smaller because the duty to *check* exists regardless.
  *   **Organization:** The organization allows for **Epistemic Division of Labor**. Most employees *can* plausibly claim, "That is not my domain; I couldn't have known." The specialist *cannot*. The organization creates a structure where ignorance is a viable defense for the majority, but knowledge is a trap for the minority.

  So, the *moral logic* (knowing creates duty) is individual, but the *perverse incentive* (stay ignorant to stay safe) is primarily organizational.

  **Confidence:** High (0.9) that the organizational setting is required for the strong "incentive toward ignorance" effect.

  ### 4. The Normative Reply: Is the incentive to ignorance a flaw?
  You asked whether foresight *should* attract blame and if your intuition is just a flaw in liability practices.

  **The Standard Reply (Law & Economics):**
  Liability *must* track knowledge to incentivize safety. If we shield the people who identify risks from blame, we reduce the deterrent against shipping dangerous products. We want the person who finds the bomb to be the one most motivated to defuse it. If they can ship it without consequence, safety decreases.

  **The Counter-Reply (Your Intuition):**
  The flaw is not that the knowers are blamed, but that the **ignorant are exonerated.**
  In your cases, the non-technical staff or the team that didn't red-team are treated as *less* blameworthy because they were ignorant. But in high-stakes tech, **epistemic negligence** (failing to set up systems to know) should be as blameworthy as **conscious disregard** (knowing and shipping).

  Currently, our liability frameworks treat "We didn't know" as a mitigating factor. In complex sociotechnical systems, "We didn't know" should be treated as **willful blindness.**

  **The Fix:**
  The solution isn't to stop blaming the knowers (they *were* negligent to ship). The solution is to expand the circle of blame to include those who structured the organization such that only a few people knew the risks. This is the core of **"Structural Accountability"** (see: **Ibo van de Poel** or **Andreas Matthias** on responsibility in AI).

  If the organization treats "I didn't read the design doc" as a valid excuse, the system is designed to generate willful ignorance. The "incentive toward ignorance" is indeed a flaw in our liability practices, specifically the **Asymmetry of Epistemic Negligence.**

  **Confidence:** Medium-High (0.8) that this is the philosophically robust reply. It aligns with current shifts in "Responsibility Gaps" literature toward "Responsibility Ecosystems."

  ### 5. Summary for your Seminar
  If you need to present this, I recommend framing it this way:

  1.  **Label:** Call it **"The Epistemic Liability Trap"** (it's descriptive enough to be clear, even if not canonical).
  2.  **The Shape:** It is not a Responsibility Gap (too little blame); it is a **Responsibility Concentration** (too much blame on the epistemically virtuous).
  3.  **The Driver:** It is driven by **Circumstantial Moral Luck** regarding epistemic access, amplified by organizational silos.
  4.  **The Critique:** The perverse incentive toward ignorance reveals a failure to treat **Epistemic Negligence** (failure to know) as seriously as **Conscious Disregard** (knowing and acting).

  ### Confidence Ratings Summary
  *   **Phenomenon is real/coherent:** 0.95
  *   **Single canonical name exists:** 0.4 (It's a cluster, not a atom)
  *   **Requires organizational context for full effect:** 0.9
  *   **Incentive to ignorance is a liability flaw (not moral truth):** 0.85

  You are not confused; you have spotted a misalignment between *ex-ante* safety incentives (we want you to find risks) and *ex-post* liability incentives (we punish you for finding risks). That is a solid philosophical contribution.
