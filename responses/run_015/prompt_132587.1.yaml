answer: |-
  This is a remarkably sharp observation. You have identified a fissure in how liberal legal systems handle **diachronic autonomy** (authority over time) that is rarely examined side-by-side.

  The short answer is: **Yes, the practices are inconsistent in their metaphysical commitments, but consistent in their political function.** The divergence isn't accidental; it stems from the different dangers inherent in medical paternalism versus political paternalism.

  Here is a breakdown of the philosophical presuppositions, the consistency problem, and the institutional implications of swapping the models.

  ### 1. The Metaphysics of the Psychiatric Case
  **Does Ulysses contracting require a psychological-continuity theory?**

  Strictly speaking, **no.** It does not require the metaphysical claim that the manic patient is a *different person* (ontological discontinuity). If the law claimed the manic patient were a different person, it would raise horrific liability issues (e.g., is the manic person responsible for debts incurred while manic?).

  Instead, psychiatric advance directives rely on a **normative hierarchy of interests**, most famously articulated by Ronald Dworkin.
  *   **Critical Interests:** Values that define the shape of your life as a whole (e.g., "I value dignity over unconscious survival").
  *   **Experiential Interests:** Immediate states of pleasure or pain (e.g., "I don't want this needle right now").

  The legal reasoning isn't that the future self is *numerically distinct*; it's that the future self is **epistemically and normatively compromised.** The "illness" acts as a distortion field. The past competent self is treated as the better trustee of the patient's *authentic* values because the current self's capacity to process those values is chemically disabled.

  **The View of Identity:** This presupposes a **Narrative Identity** theory. You are the author of your life story. A psychotic break is treated as a "gap" or "corruption" in the narrative, not the end of the character. The advance directive allows the "author" to edit the draft during a period where the "character" has lost the pen.

  ### 2. The Metaphysics of the Constitutional Case
  **Does Constitutional Precommitment require a corporate-identity theory?**

  **Yes, but a specific kind.** Constitutional law relies on the distinction between **Constituent Power** (*pouvoir constituant*) and **Constituted Power** (*pouvoir constitué*).
  *   **The People (Constituent):** The metaphysical entity that creates the Constitution. This entity is timeless, unified, and "sovereign."
  *   **The Majority (Constituted):** The current collection of voters/legislators.

  When a future majority tries to repeal a right without following amendment procedures, the law does not say, "You are not the People." It says, "You are the People *acting through the wrong channel*."

  **The View of Identity:** This presupposes a **Procedural Identity**. The "People" persist not because they share a psychological state, but because they share a *structure of agency*. Unlike the psychiatric patient, the future democratic majority is never deemed "incompetent" or "delusional" in a way that strips their authority. Their will is considered authentic, but *procedurally bound*.

  ### 3. The Consistency Problem
  **Why the asymmetry?**

  If we treat the manic patient's refusal as inauthentic, why don't we treat a populist surge to repeal free speech as "collective delusion"?

  **The Danger of Political "Diagnosis"**
  In the clinic, declaring a patient's refusal "inauthentic" is risky, but the scope is limited to that individual. In politics, declaring a majority's will "inauthentic" is the definition of **tyranny**.
  *   **The Jacobin Trap:** If you adopt the psychiatric model in politics (i.e., "The current majority is sick; we know the *real* will of the People better than they do"), you arrive at Robespierre's "Republic of Virtue" or Vanguard Communism. You empower a guardian class to override democratic will based on a metaphysical claim about who the "real" people are.
  *   **The Legitimacy Constraint:** Constitutional law avoids the "authenticity" question because it is politically explosive. It is safer to say "You didn't get 2/3rds vote" (procedural) than "You are suffering from collective mania" (ontological/normative).

  **The Reversibility Factor**
  *   **Psych:** Medication is often reversible. Overriding a refusal today might restore the capacity for tomorrow.
  *   **Const:** Constitutional entrenchment can be permanent. If you bind future generations too tightly based on the idea that *they* can't be trusted, you create a "dead hand" problem that delegitimizes the state.

  ### 4. Institutional Swaps: What if we changed the view?

  **Scenario A: Pure Present Autonomy in Psychiatry**
  *   **The Shift:** We adopt the Constitutional view. The "current majority" (the patient in the moment) is always sovereign. Advance directives are voidable at any time.
  *   **The Outcome:** Ulysses contracts collapse. Patients cycle through mania, refuse meds, deteriorate, recover, regret the deterioration, sign directive, repeat.
  *   **The Philosophical Cost:** We privilege **experiential autonomy** (freedom from interference now) over **narrative autonomy** (freedom to shape one's life trajectory).

  **Scenario B: The Psychiatric Model in Constitutional Law**
  *   **The Shift:** We adopt the Psych view. A Constitutional Court can strike down an amendment not because of procedure, but because the current movement is "inauthentic" (e.g., "This repeal of voting rights stems from collective panic, not the true will of the People").
  *   **The Outcome:** Judicial supremacy becomes absolute. The Court becomes the "clinician" diagnosing the health of the democracy.
  *   **The Philosophical Cost:** Democracy becomes trustee-based rather than delegate-based. It solves the problem of "tyranny of the majority" but introduces the problem of "oligarchy of the guardians."

  ### 5. Is it Underdetermined? (Pragmatism vs. Metaphysics)

  You asked if this is just **risk management** with post-hoc rationalization. **I argue yes.**

  The metaphysics of "the self" and "the people" are **functional fictions** adopted to solve specific coordination problems.
  *   **In Psych Law:** The problem is *temporal inconsistency due to pathology*. The fiction of the "authentic past self" is the tool that minimizes harm and respects long-term values.
  *   **In Const Law:** The problem is *temporal inconsistency due to passion*. The fiction of the "persistent People" is the tool that stabilizes expectations and protects minorities.

  **Why the different fictions?**
  Because the cost of error differs.
  *   If we err on the side of the "past self" in politics, we get stagnation and revolution.
  *   If we err on the side of the "present self" in psychiatry, we get preventable suffering and death.

  The law adopts the metaphysical story that yields the best **consequentialist equilibrium** for that domain.
  *   Psychiatry can afford to be "perfectionist" about autonomy (defining what *true* autonomy is) because the stakes are individual health.
  *   Constitutional law must be "agnostic" about autonomy (accepting whatever the procedure produces) because the stakes are political legitimacy.

  ### Summary
  The pairing reveals that **liberal law does not have a unified theory of the person.**
  *   In the clinic, you are a **Narrative Self** whose authority can be suspended if the story is corrupted by illness.
  *   In the polity, you are a **Procedural Citizen** whose authority cannot be questioned, only channeled.

  If we forced consistency:
  *   **Unified Narrative View:** We get a paternalistic state that overrides laws it deems "irrational" (The Philosopher King).
  *   **Unified Procedural View:** We get a psychiatric system where advance directives are unenforceable (The Absolute Libertarian).

  The current inconsistency is likely a feature, not a bug. It allows the state to be paternalistic where harm is immediate and biological (the body), while remaining neutral where harm is diffuse and political (the body politic). The "identity talk" is indeed largely post-hoc rationalization for where we draw the line on paternalism.
