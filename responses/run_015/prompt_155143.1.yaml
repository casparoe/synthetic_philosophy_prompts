answer: |-
  By negotiating secret ecological constraints, costly enforcement budgets, and unchosen migrant dispositions across three rounds of production, students will physically feel the trade-offs of social order and the paralysis of unchecked permissiveness.

  ### Materials
  *   **Room:** One large room with three distinct tables (Settlements A, B, C).
  *   **Handouts (per Settlement):**
      *   1 **Ecology Card** (sealed envelope, see below).
      *   6 **Disposition Cards** (5 "Complier," 1 "Improviser" per group initially).
      *   30 **Grain Tokens** (small paper squares, shared pool).
      *   20 **Production Slips** (small paper slips).
      *   1 **Ledger Sheet** (to track points).
  *   **Instructor:** Timer, whistle, master scorecard.

  ### Roles
  *   **Settlers (All Students):** Each receives a hidden Disposition Card at the start.
      *   *Complier:* Must write the number "5" on Production Slips.
      *   *Improviser:* May write any number 1–9.
  *   **Scribe (Rotating):** Records the group's chosen Strictness Level and Enforcement Budget on the Ledger.
  *   **Enforcer (Rotating):** Spends Grain Tokens to "inspect" Production Slips.

  ### Scoring System (Prosperity Points)
  *   **Base Production:** 10 points per Settler per round.
  *   **Compliance Bonus:** +5 points per Settler if the Group Rule is met.
  *   **Enforcement Cost:** -2 points per Grain Token spent on inspection.
  *   **Hollow Compliance Penalty:** If Total Grain Spent on Enforcement < 10, Compliance Bonuses are halved.
  *   **Ecology Modifier:** Applied at round end (see Cards).
  *   **Individual Cost:** Compliers in "Loose" groups (Strictness 1–2) lose 5 personal points (psychic cost of disorder). Improvisers in "Strict" groups (Strictness 4–5) cause the group to pay an extra 5 Grain penalty if caught.

  ### Ecology Cards (Secret)
  *   **Card A (Threat):** "External Danger." Strictness Level 4–5 yields double Compliance Bonus. Strictness 1–2 yields zero Base Production.
  *   **Card B (Scarcity):** "Resource Poor." Enforcement Cost is doubled (4 points per Grain).
  *   **Card C (Turnover):** "Unstable." Migration effects (see Round 2) are tripled.

  ### Round-by-Round Timeline (90 Minutes)

  **0:00–0:15 | Setup & Round 1 (The Ecology)**
  1.  Divide class into 3 groups of 6. Seat them at separate tables.
  2.  Distribute materials. Each student draws a Disposition Card (keep hidden). Each group opens one Ecology Card (keep hidden from other groups).
  3.  **Phase 1: Constitution (5 mins).** Groups privately vote on a **Strictness Level (1–5)**.
      *   1 = No rules. 5 = Total compliance required.
      *   Groups set an **Enforcement Budget** (how many Grain Tokens to spend).
  4.  **Phase 2: Production (5 mins).** Students write a number on a Production Slip.
      *   Compliers *must* write 5. Improvisers *may* write anything.
      *   Enforcers collect slips. They may "inspect" slips equal to the Grain Budget spent (1 Grain = 1 inspection).
      *   If an Improviser is inspected, they are caught (Group pays penalty). If not inspected, their slip counts as compliant.
  5.  **Phase 3: Scoring (5 mins).** Instructor collects Ledgers. Calculates points based on Ecology Cards. Announces only total group scores, not individual mechanics.

  **0:15–0:45 | Round 2 (Migration & Disposition)**
  1.  **Migration Phase (5 mins).** Announce that borders are open. Any student may move to a different table.
      *   *Constraint:* You take your Disposition Card with you. You do not show it to the new group.
      *   *Constraint:* Receiving groups must accept migrants; they cannot veto based on unknown dispositions.
  2.  **Phase 1: Constitution (5 mins).** Groups may adjust Strictness and Budget.
  3.  **Phase 2: Production (5 mins).** Same as Round 1.
      *   *Mechanic:* If an Improviser migrated to a Strict group (4–5) and was *not* caught, the Group pays a hidden "Sabotage Penalty" (-10 points).
      *   *Mechanic:* If a Complier migrated to a Loose group (1–2), the Complier loses 5 personal points (recorded on their own scrap paper).
  4.  **Phase 3: Scoring (10 mins).** Instructor calculates. Highlight groups that suffered from migration mismatches. Ask: "Did anyone feel punished for a rule they didn't make?"

  **0:45–1:10 | Round 3 (The Meta-Rule Wall)**
  1.  **Constitutional Convention (10 mins).** Before setting Strictness, groups must choose a **Voting Procedure** for this round only.
      *   **Option A (Majority):** 4 of 6 votes binds the group.
      *   **Option B (Consensus):** 6 of 6 votes required. Any single member can veto the rule.
      *   *Trap:* If they choose Consensus, they are being permissive about the rule-making process itself.
  2.  **Phase 1: Decision (5 mins).** Groups attempt to set a Strictness Level using their chosen procedure.
      *   *Instructor Note:* If a group chose Consensus, do not intervene. Let them debate. If time runs out before agreement, they produce nothing.
  3.  **Phase 2: Production (5 mins).** Only groups that successfully set a rule may produce.
  4.  **Phase 3: Scoring (5 mins).** Groups that chose Consensus and failed to agree receive 0 points. Groups that chose Majority receive points based on performance.

  **1:10–1:30 | Debrief**
  1.  **Reveal Ecology:** Ask groups to read their Cards. Discuss why identical rules led to different scores.
  2.  **Map Mechanics to Theory:**
      *   *Ecology Cards:* Context matters. There is no universally "correct" amount of order; it depends on the threat environment.
      *   *Enforcement Budget:* Order is expensive. When you spend too little, compliance becomes "hollow" (people follow the letter, not the spirit). When you spend too much, you have no resources left for prosperity.
      *   *Migration:* Norms burden the outlier. When people move, they carry internal habits that clash with new rules. The cost of assimilation falls on the migrant (Complier in Loose group) or the host (Strict group catching Improviser).
      *   *Voting Procedure:* You cannot be permissive about everything. A group that allows any single member to veto the rules (Consensus) paralyzes itself. To function, *someone* (the majority) must hold the procedure fixed against the minority.
  3.  **Reveal Label:** Introduce the terms "Tight" (strong norms, low tolerance) and "Loose" (weak norms, high tolerance). Explain that successful societies are not just tight or loose, but match their tightness to their ecology and maintain fixed meta-rules.

  ### Troubleshooting & Predictive Failures
  *   **Dominant Voices:** In Round 3, one student may hog the Consensus vote. *Handle:* Do not intervene. This *is* the lesson. Let them feel the paralysis.
  *   **Math Errors:** Students will miscalculate Grain costs. *Handle:* Appoint one "Auditor" per group (rotate each round) whose only job is math.
  *   **Time Overrun:** Round 3 debates often bleed into debrief. *Handle:* Use a loud whistle. When time is cut, production stops immediately. The lost points are part of the data.
  *   **Collusion:** Groups might share Ecology Card info. *Handle:* Remind them mid-game that "intelligence leaks" are part of the simulation (adds to instability), but penalize obvious cheating if it disrupts the lesson.

  ### Limitations (Frank Assessment)
  *   **Inherited vs. Chosen:** In this simulation, norms are chosen consciously every round. In reality, norms are inherited culturally and felt as "natural." Students will leave thinking order is a rational contract; you must correct this in the debrief by noting that real norms are often invisible until broken.
  *   **Stakes:** Paper points lack real social consequence. Students may laugh off penalties. *Handle:* Emphasize during debrief that the *frustration* they felt during the Consensus gridlock is the real data point, not the score.
  *   **Power Dynamics:** The simulation treats all members as equal voters. It does not reproduce hierarchy or elite capture, where rules are fixed *by* someone *over* everyone. Acknowledge this simplification.
