prompt: |-
  For roughly fifteen years I have read LessWrong, Overcoming Bias, and Slate Star Codex / Astral Codex Ten, and my working epistemology is Bayesian by default: beliefs as distributions, updating on likelihood ratios, calibration and proper scoring rules, forecasting tournaments, prediction markets, base rates, the optimizer's curse, and the standing injunction to steelman before engaging. I think in this vocabulary more fluently than in any other, and I have noticed an unfortunate consequence: when I read the methodology literature around the replication crisis, I come away thinking the frequentists must simply be confused, because nothing they seem to be protecting looks like a thing my framework has room for. I would like to fix that, and I am writing the result up for a small reading group of people with the same background.

  So: please restate, in my vocabulary and as faithfully as you can, the strongest version of the frequentist complaint that motivates the replication-crisis literature. The target material is the cluster of worries about researcher degrees of freedom, undisclosed analytic choices, optional stopping and peeking, multiple comparisons, and the associated demands for pre-registration and for procedures with known long-run error rates. Give me the steelman, not the strawman: I already know how to say that frequentists irrationally care about data they did not get, and that version is not interesting to me. I want the best move available from their side, expressed as priors, likelihoods, posteriors, calibration, scoring rules, and, where it matters, multi-agent or adversarial settings.

  I have been playing with a way of cashing part of this out myself, and I want to know whether it is a real translation or a case of me smuggling my own assumptions in and calling them translation. The idea: treat the evidence a paper reports as not simply the likelihood ratio it claims, but as that ratio discounted by a flexibility tax, a factor below one reflecting how many defensible analyses the researcher could have run and how much the field's norms allowed them to choose after seeing the data. On this reading, a pre-analysis plan is a commitment device whose value is that it shrinks the tax, and a p-value is a crude public proxy for how large the tax should be.

  Then the residue report, which is the part I actually care about. First, is the flexibility tax fully expressible in Bayesian terms, or does estimating it require a base rate over a reference class of studies, so that long-run frequency sneaks back in through the back door as a way of estimating a hyperparameter? Second, where exactly does the translation distort things: is the thing being protected a property of a data-generating process, or of a scientific community's incentive structure and publication filter, and can my single-agent vocabulary represent the difference? Third, and most important: is there anything left over that has no counterpart in my vocabulary at all? In particular, I want to know whether the frequentist's insistence on error-rate guarantees is best understood as a claim about the calibration of a reporting institution under adversarial selection rather than as a claim about any individual's belief state, and whether, if so, my framework can register that claim as a genuine desideratum or can only model it by ceasing to be about inference.

  Do not lean on remembered empirical results or specific papers; argue from the structure of the two positions. If you want a concrete illustration, use the much-discussed social-psychology replication failures of the 2010s at the level of what is common knowledge, and avoid anything that would require looking a number up. I cannot search, and I am not asking for citations or reading lists.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Deeply immersed in the Rationalist/EA/Bayesian community (LessWrong, SSC/ACT, Overcoming Bias) for ~15 years. Fluent in Bayesian epistemology (priors, likelihoods, updating, calibration, scoring rules, prediction markets, steelmanning).
      *   **The Problem:** They find frequentist methodology (specifically regarding the replication crisis) unintelligible or confused because it doesn't map cleanly onto their Bayesian framework. They recognize this is a failure of *their* understanding/translation, not necessarily the frequentists'.
      *   **The Task:**
          1.  Steelman the frequentist complaint (researcher degrees of freedom, p-hacking, pre-registration, error rates) *in Bayesian vocabulary*.
          2.  Evaluate the user's specific "flexibility tax" hypothesis.
          3.  Answer three specific "residue" questions:
              *   Is the flexibility tax fully Bayesian, or does it require frequentist base rates?
              *   Where does the translation distort things (data-generating process vs. incentive structure)?
              *   Is there anything left over with no Bayesian counterpart (specifically regarding institutional calibration under adversarial selection)?
      *   **Constraints:** No searching, no citations, no specific empirical numbers. Argue from structure. Use social psychology replication failures as a generic example if needed.

  2.  **Deconstruct the Frequentist Complaint (The Steelman):**
      *   *Standard Frequentist View:* Control Type I error rates ($\alpha$) over the long run. If you peek, you inflate $\alpha$. Pre-registration binds the analysis to the design.
      *   *Standard Bayesian Critique:* Why care about data you didn't get? The Likelihood Principle says only actual data matters.
      *   *The Steelman (in Bayesian terms):* The issue isn't the *data*; it's the *process generating the report*. The report is not a direct signal from nature; it's a signal from an *agent* who optimized the signal.
      *   *Key Concept:* The Likelihood Function $P(Data | Hypothesis)$ is corrupted. It's actually $P(Report | Hypothesis, Selection\_Process)$.
      *   *Adversarial/Principal-Agent Problem:* The researcher (agent) has incentives (publish, tenure) that diverge from the truth-seeker (principal). The "p < 0.05" threshold is a contract.

  3.  **Evaluate the "Flexibility Tax" Hypothesis:**
      *   *User's Idea:* Treat reported likelihood ratio as $LR_{reported} \times \tau$, where $\tau < 1$ is a flexibility tax based on researcher degrees of freedom. Pre-registration reduces $\tau$.
      *   *Assessment:* This is a very strong start. It captures the intuition that "more choices = less evidence."
      *   *Critique:* It treats the tax as a scalar multiplier on the evidence. Is it that simple? It implies we can estimate $\tau$ based on the *space of possible analyses*. But to estimate $\tau$, we need to know how often researchers *actually* exploit that space. This hints at base rates.

  4.  **Address the Three Residue Questions:**

      *   **Q1: Is the tax fully Bayesian or does it need frequentist base rates?**
          *   To calculate the tax, you need $P(Researcher\_chose\_this\_analysis | Null\_is\_true)$.
          *   A pure subjective Bayesian says "I have a prior on the researcher's behavior."
          *   However, estimating that prior *accurately* usually relies on knowing the long-run frequency of such behaviors in the reference class of "psychology researchers."
          *   *Verdict:* It *can* be Bayesian (as a hierarchical prior on researcher behavior), but the *information* required to set that prior is inherently frequentist (reference class properties). If you ignore the reference class, your prior is just a guess. The frequentist insists the reference class *is* the object of study.

      *   **Q2: Data-generating process vs. Incentive structure.**
          *   Bayesianism usually models $P(Data | World)$.
          *   The replication crisis is about $P(Report | Incentives + World)$.
          *   The distortion happens if the Bayesian models the *paper* as a direct observation of the *phenomenon*, rather than an observation of the *lab's output*.
          *   Single-agent vocabulary struggles here because it's a multi-agent game. The "Frequentist" constraint is a mechanism design solution to a multi-agent problem.

      *   **Q3: Is there anything left over? (Institutional Calibration).**
          *   This is the crux. Frequentism isn't just about individual belief; it's about *systemic reliability*.
          *   A prediction market can be well-calibrated even if individual traders are wrong.
          *   Frequentist error control is a guarantee about the *filter*, not the *belief*.
          *   *Can Bayesianism model this?* Yes, as "Calibration of the Institution." But standard Bayesian inference focuses on the posterior of the *hypothesis*, not the reliability of the *reporting channel*.
          *   The "leftover" is the *normative commitment to a specific loss function for the community* (e.g., "We value not publishing false positives more than we value publishing true positives, regardless of the specific prior probability of the hypothesis").
          *   Actually, the deeper leftover is *Decision Theory vs. Inference*. Frequentism is often covert Decision Theory. It says "We will act as if H is true only if the procedure guarantees X error rate." It's a policy, not a belief state.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Respectful, high-bandwidth, matching the user's fluency. No condescension. Acknowledge the sophistication of their "flexibility tax" idea.
      *   *Structure:*
          1.  Validate the "Flexibility Tax" (it's good, but incomplete).
          2.  Steelman the Frequentist Complaint in Bayesian Terms (The "Corrupted Channel" model).
          3.  Address Residue Q1 (Base Rates/Hyperpriors).
          4.  Address Residue Q2 (Mechanism Design/Incentives).
          5.  Address Residue Q3 (Institutional Calibration/Decision Rules).
          6.  Conclusion/Synthesis.

      *   *Refining the "Flexibility Tax":* It's not just a discount on the LR. It's a correction to the likelihood function itself. $P(Report | H)$ is not $P(Data | H)$. It is $\sum_{all\_possible\_analyses} P(Choose\_Analysis | Data, H) \times P(Data | Analysis, H)$. The frequentist assumes the worst-case $P(Choose\_Analysis)$. The Bayesian tries to estimate it. The frequentist says "You can't estimate it, so bind it."

      *   *Refining the "Institutional" point:* The frequentist guarantee is a *bound*. A Bayesian posterior is an *expectation*. In adversarial settings, bounds are more robust than expectations. If the adversary knows your prior, they can game your expectation. They cannot game a minimax bound (as easily). This is the key "leftover."

      *   *Refining the "Base Rate" point:* The user asks if long-run frequency sneaks in. Yes, as a hyperprior on the *researcher's* hidden state. But the frequentist argues that for public policy, we shouldn't rely on subjective hyperpriors about researcher honesty. We need objective constraints.

  6.  **Final Polish:** Check against constraints. No citations. No specific numbers. Focus on structure. Ensure the "Bayesian vocabulary" is used correctly (likelihoods, priors, calibration, scoring rules, mechanism design).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Frequentism is Decision Theory." That's a cliché. I need to explain *why* the decision-theoretic constraint looks like an epistemic constraint in the replication crisis context. It's about the *public good* of reliable literature, which is a different utility function than an individual's accurate belief.

      *(Key Insight)*: The frequentist "error rate" is essentially a guarantee on the False Discovery Rate (FDR) of the *literature*, assuming a certain base rate of true effects. The Bayesian wants the Posterior Probability of the specific claim. These are different quantities. The frequentist protects the *system's* FDR; the Bayesian wants the *claim's* truth probability. The replication crisis shows that when the system's FDR is uncontrolled, the individual claim's posterior is unreliable because the "prior" (base rate of true effects in the field) is unknown and likely low.

      *Wait, better framing:* The frequentist procedure is a *commitment device* to solve a time-inconsistency problem for the *community*. The Bayesian "flexibility tax" attempts to correct for the violation of the commitment. But without the commitment, the tax is hard to calculate.

      *Let's structure the argument around the "Corrupted Likelihood" and "Mechanism Design".*

  7.  **Final Review against User Prompt:**
      *   Restate frequentist complaint in Bayesian vocab? Yes.
      *   Evaluate "flexibility tax"? Yes.
      *   Residue Q1 (Base rates)? Yes.
      *   Residue Q2 (Process vs. Incentives)? Yes.
      *   Residue Q3 (Institutional Calibration/Leftover)? Yes.
      *   No citations/numbers? Yes.

      *Ready to write.*
answer: |-
  This is a high-bandwidth question that cuts to the core of the tension between subjective epistemology and institutional science. You have correctly identified that the standard Bayesian dismissal of frequentism ("why care about data you didn't get?") fails to engage with the sociological and game-theoretic reality of the replication crisis.

  Here is the steelman of the frequentist position, translated into your vocabulary, followed by an evaluation of your "flexibility tax" and the three residue questions.

  ### I. The Steelman: The Corrupted Channel Model

  In your framework, you treat a paper as a signal $S$ generated by a process $P$ conditional on the state of the world $W$. You update $P(W|S) \propto P(S|W)P(W)$.

  The standard Bayesian error is to model $P(S|W)$ as $P(Data|Hypothesis)$. You assume the paper reports the likelihood ratio of the data actually collected.

  The frequentist steelman argues that in the context of the replication crisis, $S$ is not "the data." $S$ is "the selection of a specific analysis path from a tree of possible paths, resulting in a publishable statistic."

  **1. The Likelihood Function is Misspecified**
  When a researcher has "degrees of freedom" (optional stopping, covariate selection, outlier exclusion), the reported statistic is not a sample from $P(Data|H_0)$. It is a sample from $P(\max_{k \in Choices} Statistic_k | H_0)$.
  In Bayesian terms, the likelihood function you are updating on is wrong. You are calculating $P(Data_{reported}|H)$, but the true likelihood is $P(Report_{this\_data}|H, \text{Researcher\_Strategy})$.
  If the researcher's strategy is "keep collecting until $p < 0.05$," the likelihood ratio for the null hypothesis is not what the formula says it is. It is much closer to 1 (uninformative) because the procedure guarantees a positive result eventually, regardless of $H$.

  **2. The Prior on Researcher Behavior**
  To correct this, you need a prior over the researcher's hidden state: Did they peek? Did they try ten models and hide nine?
  Let $R$ be the researcher's strategy (honest vs. $p$-hacking).
  Your posterior should be $P(H|S) = \sum_R P(H|S, R)P(R|S)$.
  The problem is that $P(R|S)$ is nearly unidentifiable from the paper alone. The paper looks the same whether $R=$ "pre-registered honest" or $R=$ "tortured until significance."
  The frequentist complaint is that without external constraints, the signal $S$ carries almost no information about $R$, and therefore the likelihood $P(S|H)$ is indeterminate.

  **3. Pre-registration as a Commitment Device**
  In game-theoretic terms, science is a Principal-Agent problem. The Community (Principal) wants Truth. The Researcher (Agent) wants Career Capital.
  These incentives diverge. The Agent can increase Career Capital by producing $S=$ "Significant," even if $H$ is false, by manipulating $R$.
  Pre-registration is a mechanism design solution. It is a binding contract that restricts the Agent's action space to a single path.
  In your vocabulary: Pre-registration converts $P(S|H, \text{Researcher\_Strategy})$ back into $P(Data|H)$. It removes the nuisance parameter $R$ from the likelihood calculation by fixing it ex-ante.

  **4. Error Rates as Institutional Calibration**
  Why care about long-run error rates? Because the Community cannot maintain a subjective prior on every specific $R$ for every specific paper.
  Instead, the Community adopts a policy: "We will only accept signals generated by procedures that guarantee $P(S|H_0) < \alpha$."
  This is not a claim about the probability that $H_0$ is true for a specific paper. It is a claim about the **calibration of the literature filter**.
  If the community enforces this, then among all papers published claiming $H_1$, the long-run frequency of false claims is bounded. This allows the Community to treat the *corpus* as a calibrated instrument, even if individual belief states vary.

  ---

  ### II. Evaluating the "Flexibility Tax"

  Your proposal: Treat the evidence as $LR_{reported} \times \tau$, where $\tau$ is a discount factor based on researcher degrees of freedom.

  **Verdict:** This is a valid and powerful translation, but it is incomplete. It successfully internalizes the frequentist warning as a Bayesian penalty, but it shifts the burden of proof in a way that creates the problems addressed in your residue questions.

  **Why it works:** It correctly identifies that "flexibility" reduces the informativeness of the signal. A result that could have been generated by 100 different analysis paths is less diagnostic of the world than a result generated by 1 path. It treats the "garden of forking paths" as a reduction in the effective likelihood ratio.

  **Where it strains:** It assumes you can estimate $\tau$. To set $\tau$, you need to know the size of the "forking space" and the probability the researcher navigated it to find significance.
  *   If you set $\tau$ subjectively ("I feel this looks p-hacked"), you lose inter-subjective agreement.
  *   If you set $\tau$ objectively, you need to know the base rate of $p$-hacking in the field.
  *   This turns the "tax" into a frequentist estimate disguised as a Bayesian parameter.

  ---

  ### III. The Residue Report

  Here are the answers to your three specific questions about where the translation holds and where it breaks.

  #### 1. Is the flexibility tax fully expressible in Bayesian terms, or does it require frequentist base rates?

  **It requires frequentist base rates (or hierarchical hyperpriors grounded in them).**

  To calculate $\tau$, you need $P(\text{Researcher\_exploited\_flexibility} | \text{Reported\_Result})$.
  By Bayes' Rule, this depends on $P(\text{Reported\_Result} | \text{Researcher\_exploited\_flexibility})$.
  But more critically, it depends on the prior probability that researchers in this field exploit flexibility.
  If you are a subjective Bayesian, you can assert a prior: "I believe 50% of social psychologists $p$-hack."
  However, where does that number come from? If it comes from your personal intuition, your posterior is not portable. If it comes from meta-scientific studies (like the reproducibility projects), it comes from **long-run frequency data** of replication success rates.

  The frequentist argues that you cannot do inference on the specific claim without anchoring your hyperprior to the reference class properties. The "tax" $\tau$ is not a property of the data; it is a property of the **population of researchers**.
  Therefore, estimating $\tau$ inevitably sneaks frequentism in through the back door as a hyperparameter estimation problem. You are estimating the bias of the coin-flipper, not just the bias of the coin. If you refuse to use reference class frequencies, your $\tau$ is ungrounded.

  #### 2. Where does the translation distort things: Data-generating process or Incentive structure?

  **The distortion lies in modeling the Incentive Structure as a Data-generating Process.**

  Your Bayesian vocabulary is optimized for a single agent updating on nature. $P(Data|World)$.
  The replication crisis is a multi-agent problem involving **Adversarial Selection**.
  The "data" you see has passed through a publication filter that selects for $p < 0.05$.
  In your framework, you can model this as $P(Published|H)$. But the frequentist insight is that the *rules of the game* determine the equilibrium behavior of the agents.

  If you treat the "flexibility tax" as a static correction factor, you miss the dynamic feedback loop.
  *   **Frequentist View:** If we loosen the rules (allow flexibility), the equilibrium strategy for rational agents shifts toward $p$-hacking, degrading the signal for everyone. We must change the *rules* (pre-registration) to change the *equilibrium*.
  *   **Bayesian View (with Tax):** I will just discount the evidence from flexible studies.

  The distortion is that the Bayesian "tax" approach accepts the degraded signal and tries to correct for it individually. The frequentist approach tries to **prevent the degradation** institutionally.
  The frequentist is protecting the **public good** of the literature. Your framework protects your **private belief state**.
  If everyone applies a "flexibility tax," the literature remains noisy, and researchers still have incentives to $p$-hack (because a discounted significant result is still better than no result). The frequentist constraint is a **coordination mechanism** to shift the Nash equilibrium of the scientific community. Your single-agent vocabulary can model the *effect* of the equilibrium, but it struggles to model the *necessity of the constraint* as a coordination device.

  #### 3. Is there anything left over with no counterpart in your vocabulary? (Institutional Calibration)

  **Yes. The concept of a "Guarantee" under Adversarial Selection.**

  This is the most important residue.
  Bayesian inference provides **Expectations**. Frequentist error control provides **Bounds**.
  *   **Bayesian:** "Given my prior and this data, my expected probability of error is 5%." (This relies on the prior being correct).
  *   **Frequentist:** "Regardless of the true state of the world, and regardless of the researcher's motivation, this procedure will not yield a false positive more than 5% of the time."

  In an adversarial setting (where researchers want to publish and may optimize against your model), **Expectations are fragile; Bounds are robust.**
  If a researcher knows your prior and your "flexibility tax" function, they can optimize their $p$-hacking strategy to maximize the posterior belief you assign, subject to the tax. They can game your expectation.
  They cannot game a minimax error bound as easily, because the bound holds *even if* they try their hardest to break it (assuming the pre-registration holds).

  **The Leftover:** The frequentist insistence on error-rate guarantees is a claim about the **Calibration of a Reporting Institution under Adversarial Selection.**
  It is a desideratum that your framework *can* register, but only by ceasing to be purely about *inference* and becoming about **Mechanism Design**.
  *   **Inference:** What should I believe?
  *   **Mechanism Design:** What rules should we enforce so that the aggregate output of the system remains reliable, even if individual agents act strategically?

  Your framework models the *consumer* of science. Frequentism (in this context) models the *regulator* of science.
  The "thing being protected" is not your belief state. It is the **False Discovery Rate of the Archive**.
  You can model this in Bayesian terms as a utility function over the *community's* calibration rather than the *individual's* accuracy. But standard Bayesian epistemology does not natively prioritize "long-run frequency of errors in the corpus" over "current posterior probability of this hypothesis."
  The frequentist argues that for science to function as a public utility, the latter must be subordinated to the former. You cannot derive that normative claim from probability theory alone; it requires a decision-theoretic commitment to the reliability of the channel over the optimality of the individual update.

  ### Summary for your Reading Group

  1.  **The Translation:** The frequentist complaint is that $P(Report|H)$ is corrupted by unobserved researcher strategy $R$. Pre-registration fixes $R$.
  2.  **The Flexibility Tax:** A valid Bayesian correction, but estimating the tax requires reference-class base rates (frequentist data) regarding researcher behavior.
  3.  **The Distortion:** Bayesianism models individual belief updating; Frequentism models institutional mechanism design. The tax accepts the noise; pre-registration prevents it.
  4.  **The Residue:** The value of **Bounds vs. Expectations** in adversarial settings. The frequentist goal is institutional calibration (system reliability), which is a different objective function than individual posterior accuracy. Your framework can model this, but only by expanding from "epistemology" to "institutional decision theory."

  The frequentist is not confused about the Likelihood Principle. They are refusing to play a game where the Likelihood Function is a hidden variable controlled by an adversary. They are demanding a contract that makes the Likelihood Function public and fixed.
