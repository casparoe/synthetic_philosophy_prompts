  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** TA (Teaching Assistant) for a philosophy/ethics course.
      *   **Audience:** ~20 first-year students, nearly all non-majors.
      *   **Preparation:** Read one short, sympathetic secondary piece on Confucian Role Ethics. No primary texts. Likely unfamiliar with specific cases (e.g., father covering for son).
      *   **User's State:** Slightly annoyed after a 3-hour argument with a flatmate (Buddhism student claiming Role Ethics = No-Self + steps) and a friend (Care Ethics student claiming Role Ethics = Care Ethics + nice words). This indicates the user wants *precision* and *distinctiveness* for Role Ethics, avoiding reductionism.
      *   **Constraint:** Do *not* explain Role Ethics to the user. They know it. Plan *how to explain it* to the students.
      *   **Goal:** A 50-minute section plan. Focus on conceptual prerequisites, ordering, and dependency of steps.

  2.  **Deconstruct the Request:**
      *   **The Carrying Example:** Evaluate the "Dementia Daughter" case vs. "Father Steals Sheep" vs. "Work/Home Persona." Decide which carries the session.
      *   **The Devices:** Evaluate "Empty-Room" (stripping roles) vs. "Failed-Role" (estranged father). Place or kill them.
      *   **The Misconception Map:** Address: Roles as Costume/Script, Virtue Ethics in Chinese Vocabulary, Relativism/Conventionalism, Reform/Conservatism Objection. Determine *when* to defuse these and what prior groundwork is needed.
      *   **Refusals:** What to explicitly *not* explain (Process Cosmology, Scholarly Reconstruction debates).
      *   **Assessment:** One ending task/question that tests the *constitutive claim* vs. the *platitude*.
      *   **Risk Assessment:** Where is the plan most likely to break? What would change the TA's mind? What signs in the first 10 minutes indicate abandonment?

  3.  **Drafting the Plan - Step-by-Step:**

      *   **The Carrying Example:**
          *   *Dementia Daughter:* Strong. It isolates the role from reciprocity, emotion, and contract. It highlights the *persistence* of the obligation/identity even when the "content" (interaction) is gone.
          *   *Father Steals Sheep:* User is right to worry. It triggers "nepotism/corruption" alarms immediately. Students get stuck on "Is this legal?" rather than "What is the self?"
          *   *Work/Home:* User is right. It reinforces the "mask/costume" view (I wear a worker hat, then a dad hat). Role Ethics says the roles *make* the person, not that the person puts them on.
          *   *Decision:* The Dementia case must carry the session. It forces the ontological question without the moral/legal distraction of the sheep case.

      *   **The Devices:**
          *   *Empty-Room (Stripping Roles):* This is crucial for establishing the *constitutive* claim. If you strip everything and nothing is left, then roles aren't accessories. *Placement:* Early. Before defining Role Ethics, establish what it's arguing *against* (Atomistic Individualism).
          *   *Failed-Role (Estranged Father):* Risky. If the father hasn't spoken in 10 years, is he still a father? In Role Ethics, a role is a *doing*. If the doing stops, the role is in jeopardy or becomes a "failed role." This might confuse students who think biology = role. *Decision:* Use it, but carefully. It tests the "achievement" aspect of roles. *Placement:* Mid-session, after establishing roles are constitutive but also active. Actually, better to *kill* it for a 50-min intro. It introduces the "performance" nuance which might clash with the "constitutive" nuance too quickly. Let's stick to the Dementia case for persistence and the Empty Room for constitution. Wait, the prompt asks to place or kill. I think "Failed-Role" is too complex for 50 mins with non-majors. It invites the "biology vs. social" debate. I will advise killing it to save time for the Reform Objection.
          *   *Re-evaluation:* Actually, the "Failed-Role" helps distinguish Role Ethics from simple biological determinism. But the "Empty-Room" is more fundamental. I'll recommend keeping "Empty-Room" as the opener and "Dementia" as the core. Kill "Failed-Role" to avoid the "is he *really* a father" semantic trap.

      *   **The Misconception Map:**
          *   *Costume/Script:* Defuse this *immediately* via the Empty-Room exercise. If roles are costumes, there's a wearer underneath. If Empty-Room = Nothing, no wearer.
          *   *Virtue Ethics (Character):* Defuse during the Dementia case. Virtue ethics focuses on internal dispositions. Role ethics focuses on the relational locus. If the parent doesn't know you, your "virtue" is internal, but your "role" is structural/relational.
          *   *Relativism/Conventionalism:* Defuse when discussing *content*. Roles aren't just "what society expects." They are unique to *this* relationship.
          *   *Reform/Conservatism:* This is the hardest. Needs to come last. If roles constitute the self, how do we change them? Answer: We grow into new roles/reshape existing ones through the very practice of them. Defuse *after* they understand the constitutive claim. If you do it before, they think "Oh, it's just conservatism."

      *   **Refusals:**
          *   Process Cosmology (Qi, correlative cosmology). Too much metaphysics.
          *   Textual/Historical debates (Ames/Hall vs. Slingerland vs. Traditionalists). Irrelevant for the philosophical claim in 50 mins.

      *   **Assessment:**
          *   Need a task that fails if they think roles = masks.
          *   Idea: Ask them to describe themselves without using nouns that imply a relationship or function. If they can't, they get it.
          *   Better: A specific modification of the Dementia case. "If the daughter stops visiting, does the role cease, or does she become a 'bad daughter'?" (Tests the achievement vs. status distinction).
          *   Best: "The Translation Test." Ask them to translate a statement like "I am angry" into Role Ethics vocabulary. (Too abstract).
          *   Let's go with the "Self-Description" constraint. It's visceral. Or, ask them to solve the Reform objection in one sentence.
          *   Actually, the prompt asks for something that shows they have the *constitutive claim*.
          *   Task: "Describe a moral failure using Role Ethics terms without using the word 'choice' or 'rule'."
          *   Refined Task: "The Exit Ticket." Ask: "If you lost your memory and all social recognition tomorrow, in what sense would you still be 'you'?" (If they say 'my personality', they failed. If they say 'I wouldn't be', they passed).

      *   **Risk Assessment:**
          *   *Weakest Link:* The transition from "Empty Room" to "Dementia." The Empty Room is negative (what you aren't), Dementia is positive (what the role is). If students resist the Empty Room (insisting there *is* a soul/core), the rest collapses.
          *   *Signs of Failure:* Students insisting "But deep down I'm still me" during the first 10 mins.
          *   *Pivot:* If they resist the Empty Room, switch to the "Language" argument (we learn to speak through others).

  4.  **Refining the Argument Structure (The "Why" of the Order):**
      *   1. Negative Ontology (Empty Room): Clear the ground. Attack the Atomistic Self.
      *   2. Positive Ontology (Dementia): Show what remains. The role persists without reciprocity.
      *   3. Distinction (Not Costume): Reinforce 1 & 2.
      *   4. Normativity (Reform): How do we judge roles if we are made of them?
      *   *Why this order?* You can't explain why roles aren't costumes (3) until you've argued there's no wearer (1). You can't discuss reform (4) until you accept the roles are constitutive (2).

  5.  **Addressing the Flatmate/Friend Objections (Implicitly):**
      *   The plan needs to ensure Role Ethics doesn't collapse into Buddhism (No-Self). The difference is *relational substance* vs. *emptiness*. The Dementia case helps here: The role is *real*, not empty.
      *   The plan needs to ensure it doesn't collapse into Care Ethics. Care Ethics often presupposes an autonomous agent choosing to care. Role Ethics says the agent is *generated* by the care relation. The Empty Room exercise targets this.

  6.  **Final Polish:**
      *   Tone: Professional, direct, empathetic to the TA's frustration.
      *   Structure: Follow the prompt's requested sections.
      *   Check constraints: 50 minutes. 20 students. Non-majors.

      *(Self-Correction during drafting)*: I initially thought about killing the "Failed-Role" device. But the prompt asks me to place or kill *both*. I should be decisive. I will kill "Failed-Role" because it introduces the "status vs. achievement" tension which is too subtle for 50 mins and distracts from the "constitutive" claim. The "Empty-Room" is essential for the constitutive claim.
      *(Refining the Assessment)*: The "Self-Description" task is good, but might be too psychological. Let's make it about the *source* of obligation. "Why does the daughter visit?" If they say "Because she chose to," they missed it. If they say "Because that's who she is," they got it.
      *(Refining the Reform Objection)*: This is the friend's objection. It needs to be handled carefully. The answer lies in *role innovation*. We don't stand outside roles; we stretch them. I need to make sure the TA knows *when* to introduce this. Late in the session.

      *(Final check on the "Empty Room")*: Is it too abstract? For first-years? Maybe. But it's the only way to break the "Costume" view. I'll advise the TA to make it concrete. "List everything that makes you you. Now cross out the social stuff."

      *(Final check on the "Dementia Case")*: Ensure the TA emphasizes the *daughter's* perspective, not the parent's. The parent's lack of recognition is the variable that kills reciprocity/contract/care-as-feeling.

      *(Risk Assessment)*: The biggest risk is the "Empty Room" turning into a depressing existential crisis or a theological debate about souls. I need to warn the TA to keep it philosophical/functional.

      *(Ordering Confidence)*: I am least confident in putting the Reform Objection at the end. It might feel like an add-on. But if put earlier, it derails the ontological point. I will stick with end, but warn that it needs to be framed as "How do we grow?" not "How do we revolt?"

      *(Signs to Abandon)*: If students treat "roles" as purely external constraints (society telling me what to do) in the first 10 mins, the "Constitutive" claim is already dead. I need a pivot strategy.

      *Let's write.*
answer: |-
  Here is the plan. It is designed to protect the *constitutive* claim (roles make the self) from collapsing into the *instrumental* claim (roles are tools for the self), which is where your flatmate and friend are accidentally pushing you.

  ### 1. The Carrying Example
  **Use the Dementia Daughter case. Kill the other two.**

  *   **Why the Dementia Case carries it:** This is the only example that isolates the *ontological* claim from the *psychological* and *contractual* ones.
      *   It removes reciprocity (the parent doesn't know her).
      *   It removes affective care ethics (there is no emotional payoff or mutual recognition).
      *   It removes contract (no agreement was made).
      *   **Crucially:** It leaves the *obligation* and the *identity* intact. If she stops going, she isn't just "breaking a contract"; she is losing a part of who she is. This forces the students to see the role as *constitutive* of the daughter, not just a job she is doing.
  *   **Why not the Sheep (Father covers for son):** You are correct. This triggers the "Corruption/Nepotism" alarm. Students will spend 40 minutes debating legal universalism vs. family loyalty. You lose the metaphysics of the self to the sociology of corruption.
  *   **Why not Work/Home:** This actively reinforces the "Costume" misconception. It suggests there is a "Real You" who goes to work, puts on a suit/role, and takes it off to be "Real You" again at home. Role Ethics denies there is a "Real You" underneath the suit.

  ### 2. The Devices: Place or Kill
  **Place: The Empty-Room Version.**
  **Kill: The Failed-Role Case.**

  *   **The Empty-Room (Place at Minute 5):**
      *   *Function:* This is your negative proof. Before you tell them what Role Ethics *is*, you must clear the ground of what it *isn't* (Atomistic Individualism).
      *   *Execution:* Ask them to write down "Who am I?" Then ask them to cross out everything that implies a relationship (son, student, friend, citizen, employee). Ask what is left.
      *   *Why here:* If you do this *after* explaining Role Ethics, they will use Role Ethics to answer it. Do it *before*. When they realize nothing is left (or only biological functions), you have created the conceptual vacuum that Role Ethics fills. It makes the "constitutive claim" sound like a solution rather than a weird assertion.
  *   **The Failed-Role (Kill):**
      *   *Reason:* The "estranged father" case introduces the distinction between *status* (biology) and *achievement* (doing the role). This is a second-order nuance. In a 50-minute intro, this will confuse the primary point. Students will get stuck on "But he biologically *is* the father," which drags you back into essentialism. The Dementia case already handles the "persistence of obligation" better without the biological red herring.

  ### 3. The Misconception Map & Sequence
  You cannot answer these misconceptions as they arise; you must preempt them by ordering the concepts so the misconceptions become impossible to hold.

  **Sequence of Concepts:**
  1.  **Negative Ontology (Empty-Room):** Establish there is no "wearer" underneath.
  2.  **Positive Ontology (Dementia Case):** Establish the role persists without reciprocity.
  3.  **Normativity (Reform):** Establish how change happens from within.

  **Defusing the Misconceptions:**

  *   **Roles as Costume/Script:**
      *   *When to defuse:* **Minute 5-10 (During Empty-Room).**
      *   *How:* If the Empty-Room exercise leaves nothing, there is no one to wear the costume.
      *   *Prerequisite:* You must ensure they take the exercise seriously. If they say "My consciousness is left," challenge that: "Did you learn language alone? Did you form thoughts without concepts given by others?"
  *   **Virtue Ethics in Chinese Vocabulary (Flatmate's objection):**
      *   *When to defuse:* **Minute 20-25 (During Dementia Case).**
      *   *How:* Virtue ethics focuses on internal character traits (courage, honesty). Ask: "What virtue is the daughter exercising if the parent doesn't know she's there?" If they say "Patience," push back: "Is it patience if there's no expectation of reward?"
      *   *Prerequisite:* They must already accept the role is constitutive. If the role *makes* her, she isn't "exercising a virtue"; she is *enacting her existence*. The locus of evaluation is the *relationship*, not the *agent's soul*.
  *   **Relativism / Whatever Society Expects:**
      *   *When to defuse:* **Minute 30 (Transition to Normativity).**
      *   *How:* Emphasize that roles are *particular*, not general. It is not "Daughter-in-General"; it is *this* daughter with *this* parent.
      *   *Prerequisite:* They need to see the Dementia case as unique. If it were just social expectation, she could stop when society says "it's okay to stop." The fact that *she* feels she cannot stop proves the norm comes from the relation, not the society.
  *   **The Reform/Conservatism Objection (Friend's objection):**
      *   *When to defuse:* **Minute 40 (The End).**
      *   *How:* This is the hardest. If we are our roles, how do we change them? Answer: **Role Innovation.** We don't stand outside the role to judge it; we stretch the role from within.
      *   *Prerequisite:* This *only* works if they have accepted the Constitutive Claim (Steps 1 & 2). If they still think roles are costumes, they will ask "Why not just take the costume off?" You must be able to say: "Because there is no 'you' to take it off. You must weave a new pattern into the fabric."
      *   *Why last:* If you raise this earlier, the class devolves into political debate. It must be the capstone that shows the theory's viability.

  ### 4. Refusals
  Say these out loud. It saves time and establishes boundaries.

  *   **"I am refusing to explain the metaphysical background."**
      *   *Script:* "Confucian role ethics relies on a process cosmology (qi, correlative resonance) that we don't have time for. We are treating this as a philosophical claim about the self, not a historical reconstruction of the cosmos."
  *   **"I am refusing to settle the textual debate."**
      *   *Script:* "Scholars argue about whether the Analects actually say this or if this is a modern reconstruction. We are evaluating the *argument* as presented in your reading, not doing philology."

  ### 5. The Assessment (The "Exit Ticket")
  Do not ask them to define Role Ethics. They will parrot "roles are important."
  **Task:** "Write down one sentence explaining why the daughter in the dementia case *cannot* simply decide to stop visiting without losing something essential. You are forbidden from using the words: *obligation, promise, contract, love, guilt, society.*"

  *   **Why this works:**
      *   If they write "Because she promised," they failed (Contract).
      *   If they write "Because she loves him," they failed (Care Ethics/Emotion).
      *   If they write "Because society says so," they failed (Relativism).
      *   **Success:** They must write something like: "Because being a daughter is who she *is*, not what she *does*," or "Without that role, she is no longer the same person." This proves they grasp the **Constitutive Claim**.

  ### 6. Risk Assessment: Where This Breaks
  **The Weakest Link:** The transition from **Empty-Room (Minute 10)** to **Dementia Case (Minute 15)**.

  *   **Why:** The Empty-Room exercise is negative and abstract. The Dementia case is emotional and concrete. If the students resist the Empty-Room (e.g., "But I have a soul/core self that remains"), the Dementia case will just look like "strong duty" to them, not "constitutive identity." They will view the daughter as a *strong individual* making a *sacrifice*, rather than a *person constituted by the relation*.
  *   **What would change my mind:** If your reading assignment was denser or more textual, I would cut the Empty-Room exercise and start directly with the Dementia case, using Socratic questioning to drill down to the self. But for non-majors, the Empty-Room is the necessary shock.
  *   **Signs in the First 10 Minutes to Abandon Sequence:**
      *   **The Sign:** During the Empty-Room exercise, if more than 3-4 students insist, "My personality/my memories/my consciousness is left and that's the *real* me."
      *   **The Pivot:** Abandon the "Constitutive" angle. It will not land. Switch to the **"Focus of Attention"** angle.
      *   **New Plan:** Argue that Role Ethics isn't about what the self *is*, but where we should *look* to solve moral problems. "Don't look inside the agent (virtue), don't look at the rules (deontology), look at the relationship." This is a weaker claim (methodological vs ontological), but it saves the class from a stalemate on metaphysics.

  **Final Advice:** Your flatmate (Buddhism) and friend (Care Ethics) are both making the mistake of assuming a pre-existing subject that *adopts* a stance. Your entire hour must be dedicated to destroying the idea of the pre-existing subject. If the Empty-Room exercise doesn't shake them, nothing else will. Spend your energy there.
