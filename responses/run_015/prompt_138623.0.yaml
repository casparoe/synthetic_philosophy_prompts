answer: |-
  Your framing of sign fragility is the correct choice for this specific audience, provided you explicitly preempt the interpretation that it is merely a modeling error. Software engineers and operations researchers view models as approximations that converge toward truth with sufficient fidelity and data, so if you present sign fragility as a defect in the model, they will treat it as an engineering problem to be solved by better specification. You must frame it as a defect in the mapping from the world to the model, arising from the causal structure of reality itself. For a consequentialist, the moral value of an action is determined by the actual state of the world, so if the world is causally dense enough that any faithful model yields arbitrary signs based on boundary conditions, the moral value itself becomes inaccessible or undefined. Centering sign fragility works because it translates the philosophical problem of cluelessness into the language of sensitivity analysis and numerical stability, which they respect, but you must insist that the instability is inherent to the system being modeled, not the solver.

  The single case study should be a public health intervention such as a traffic safety program that reduces fatalities in a specific region. This case must have a large, well-measured near-term effect, such as a known number of lives saved per year with high confidence, to satisfy their demand for empirical grounding. It must also have a long, unmeasurable tail consisting of the downstream activities of the saved individuals, including their economic consumption, carbon footprint, political voting patterns, and reproduction, which are causally significant but epistemically opaque. Crucially, the case must lack existential stakes or global catastrophic risks to prevent the discussion from collapsing into debates about fanaticism or Pascal's mugging, which your audience is already wary of and which would distract from the structural issue of cluelessness. By keeping the stakes mundane but the causal chain long, you force them to confront the fact that cluelessness arises even in ordinary, non-extreme scenarios where expected value reasoning is typically assumed to hold.

  The session should proceed in a strict dependency chain where each component relies on the acceptance of the previous one. You begin by establishing their baseline competence, asking them to calculate the expected value of the intervention using only the near-term data, which they will do easily and confidently. Next, you introduce the long-term tail, requiring them to acknowledge that the saved individuals will have future effects that are morally relevant under consequentialism. Only after they accept the relevance of the tail should you introduce sign fragility, demonstrating how different but equally defensible assumptions about counterfactual baselines or temporal cutoffs flip the sign of the net value from positive to negative. This sequence ensures that they cannot dismiss the fragility as irrelevant because they have already committed to the importance of the long-term effects. If you introduce fragility before establishing the moral relevance of the tail, they will simply truncate the horizon and claim the problem is solved.

  You must anticipate three specific misconceptions in the order they will naturally arise and defuse them at precise points in the sequence. The first misconception, that more data or better simulations would fix the uncertainty, will arise immediately when you introduce the long-term tail. You must defuse this by showing that the uncertainty is not due to a lack of computing power but due to the chaotic nature of social causality, where small differences in initial conditions lead to divergent outcomes that cannot be predicted even in principle. The second misconception, that the expected value is perfectly well-defined even if uncomputable, will arise after you demonstrate sign fragility. You must defuse this by arguing that if the value depends on arbitrary modeling choices rather than facts about the world, then there is no fact of the matter about the value for the agent, rendering the concept of a well-defined expected value operationally empty. The third misconception, that we can simply ignore effects beyond a certain time horizon, will arise when they feel the discomfort of not being able to act. You must defuse this by reminding them that consequentialism does not permit arbitrary cutoffs without justification, and that many significant effects accumulate precisely in the ignored tail.

  The discussion of what to do about cluelessness, including responses like rule consequentialism, common sense morality, or ignoring the long term, must belong strictly after the defusing of these misconceptions. Offering an escape hatch too early will allow them to treat the problem as a solved puzzle rather than a genuine crisis for their decision-making framework. They need to sit with the discomfort of not knowing how to act despite having all the standard tools of rationality. If you provide solutions before they fully accept the magnitude of the problem, they will adopt the solution superficially without understanding why it was necessary. The responses should be presented not as fixes that restore confidence, but as concessions that acknowledge the limitation of act consequentialism, forcing them to choose which principle they are willing to sacrifice.

  To test whether the idea has landed rather than merely unsettled them, you should end with a question that requires them to apply the concept to their own domain. Ask them to identify a software deployment or operational change they approved in the last year where the near-term metrics were positive but the long-term systemic effects were unknown, and have them articulate specifically which accounting choice would flip the sign of the net impact. This moves the concept from abstract philosophy to concrete professional practice, showing that they understand sign fragility as a structural feature of complex systems rather than just a philosophical curiosity. If they can identify a specific modeling assumption in their own work that drives the sign, you know they have internalized the lesson.

  Finally, you should explicitly decline to settle whether consequentialism is false or whether we should abandon it for deontology or virtue ethics. This seminar is about the internal coherence of consequentialist reasoning under conditions of complexity, not about choosing a normative framework. Settling the broader meta-ethical question would exceed the time limit and distract from the specific mechanic of cluelessness. You should also decline to settle whether ignoring the long term is permissible, as that is a normative judgment they must make for themselves after grappling with the descriptive reality of sign fragility. Your goal is to leave them with a robust understanding of the problem, not to provide a definitive answer that closes the inquiry.
