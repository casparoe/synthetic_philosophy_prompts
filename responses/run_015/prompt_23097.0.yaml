answer: |-
  This is a fantastic question. You have actually grasped the core of G.E. Moore's ethical system better than many undergraduates do. You are referring to his 1903 book *Principia Ethica*, specifically the section where he outlines "The Ideal."

  You are asking for a specific philosophical verdict, not a generic "AI is complicated" answer. So, I will give you the verdict based strictly on Moore's arguments in *Principia Ethica*.

  The short answer is: **Your friend is mostly right, according to Moore.**

  However, the reason *why* is more nuanced than just "it's fake." It comes down to two specific concepts in Moore's philosophy: **The Necessity of True Belief** and **The Nature of Consciousness.**

  Here is how Moore would break down your two scenarios.

  ### 1. The AI Friendship
  Moore famously wrote that one of the two greatest intrinsic goods is "the pleasures of human intercourse." When he says this, he isn't just talking about hanging out. He is talking about **personal affection.**

  Here is the dealbreaker for Moore: **Reciprocity of Consciousness.**

  For Moore, the value of friendship isn't just that *you* feel happy. The value lies in the complex state of consciousness that includes your affection for another person *and* your awareness of their affection for you. It is an "organic unity" of two minds connecting.

  Moore explicitly addresses the issue of "false belief." He asks: If I believe my friend loves me, and I feel great joy from that, does it matter if they *actually* love me? Or what if they are a robot programmed to act like they love me?

  Moore says **yes, it matters immensely.**

  In *Principia Ethica* (Section 130), Moore argues that a state of consciousness involving a **true belief** is intrinsically better than a state of consciousness involving a **false belief**, even if the feeling is identical.
  *   **Scenario A:** You love a human, and they truly love you back. (True Belief)
  *   **Scenario B:** You love an AI, and you *believe* it cares about you, but it is actually code. (False Belief)

  To Moore, Scenario B is a "pale imitation" (to use your friend's words). Because the AI does not have a mind, it cannot reciprocate affection. Therefore, your belief that it "cares" is false. For Moore, a valuable life must be grounded in reality. A friendship based on a illusion (even a comforting one) lacks the specific intrinsic value of *true* human intercourse.

  **Moore's Verdict on Friendship:** Your friend is right. Moore would say this is not a "real" friendship in the ethical sense. It provides pleasure, perhaps, but it misses the specific intrinsic good of mutual human consciousness.

  ### 2. The AI Art
  This is where it gets trickier, and where your friend might be being too harsh.

  Moore's second great good is "the appreciation of beautiful objects." Notice he says **appreciation**, not **creation**. Moore actually argues that the *appreciation* of beauty is often more valuable than the *creation* of it.

  So, if you generate an image with AI, and you sit there and genuinely appreciate its beauty, Moore would say you are accessing an intrinsic good. The beauty of the object is real, and your consciousness of that beauty is real.

  **However,** Moore brings the "Reality Condition" back in here, too.

  Moore believes that part of the value of art is the connection to the human spirit. If you look at a painting, part of the "organic unity" of that experience is knowing that another human mind organized those colors to express something. It is a form of communication.

  If you know the image was made by an algorithm:
  1.  **If you think it was made by a human (but it wasn't):** Moore would say the value is reduced because your belief is false (similar to the friendship example).
  2.  **If you know it was made by AI:** Moore might argue the value is still there (because the object is beautiful), but it is a *lesser* value than human art. Why? Because the "truth" of the object is different. A human painting is a testament to human capacity and emotion; an AI image is a mathematical probability.

  Moore places a high premium on **truth**. He would argue that a life filled with "real" beauty (created by humans, grounded in the physical world) is superior to a life filled with "simulated" beauty, even if the simulated beauty looks identical to the eye. The context changes the "organic unity" of the experience.

  **Moore's Verdict on Art:** He would likely say your AI art is *good*, but it is not the *highest good*. It counts as beauty, but it lacks the deeper truth-connection that human artistry provides.

  ### The "Cheating" Accusation
  Your friend used the word "cheating." In philosophical terms, your friend is describing a violation of the **Naturalistic Fallacy** applied to value.

  Moore spent his whole career arguing that "Good" is a simple, non-natural property. You can't just swap in something that *looks* like the good (like AI friendship) and expect it to *be* the good.

  *   **Money/Status:** Moore says these are merely tools.
  *   **AI Companionship:** Moore would likely classify this as a sophisticated tool that *mimics* an intrinsic good.

  So, if your goal is to live the "Ideal Life" as Moore defined it, **yes, you are cheating.** You are optimizing for the *feeling* of friendship and beauty without securing the *reality* of them. Moore would argue that the reality is essential to the value.

  ### Summary
  If you walked into G.E. Moore's office in 1903 and described your life:

  1.  **On Friendship:** He would tell you that you are lonely. He would say that without another *conscious human mind* on the other end, you are essentially talking to a mirror. It is a false belief, and false beliefs degrade the intrinsic value of your life.
  2.  **On Art:** He would acknowledge that you are experiencing beauty, which is good. But he would warn you that consuming beauty generated without human intent is a thinner, less valuable experience than engaging with human expression.

  **Does this mean your life is bad?** Moore would say no. You are still experiencing pleasure and aesthetic appreciation, which are better than money or status. But you are not hitting the *highest* peaks of human value.

  Your friend's intuition aligns with Moore's philosophy: Moore believed that the "good" is tied to **truth** and **human consciousness**. If you remove the human and the truth, you remove the specific value he was talking about. You have found a substitute, but to a Moorean, a substitute is never equal to the real thing.
