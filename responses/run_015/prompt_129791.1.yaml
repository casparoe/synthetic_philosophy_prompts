answer: |-
  Your inquiry touches upon the profound tension between the moral phenomenology of mass violence and the rigid architecture of international criminal law (ICL). The asymmetry you observe—wherein legally comparable harms receive hierarchically distinct labels, and where memory laws protect some narratives while leaving others vulnerable—is not merely a bureaucratic artifact. It is the surface expression of a deep, often unarticulated philosophical theory regarding the ontology of groups, the nature of harm, and the political function of legal categories.

  Below is a reconstruction of the implicit theory embedded in current international practice, followed by an analysis of what would be required to shift toward a continuous, non-lexical framework.

  ### I. Philosophical Commitments: Ontology and Moral Taxonomy

  The current legal regime presupposes a specific **ontology of groups** and a **hierarchical moral taxonomy**.

  1.  **The Ontology of Groups:**
      Current ICL operates on a dualistic ontology. It recognizes individuals as primary bearers of rights (hence *Crimes Against Humanity* protect individuals), but it grants a derivative, secondary ontological status to *groups*. The crime of genocide presupposes that a group possesses a "right to exist" distinct from the aggregate rights of its members. However, this right is fragile; it is only triggered when the *intent* is to destroy the group's physical or biological existence. The law implicitly argues that a group is not "destroyed" if its members are dispersed or culturally assimilated, provided they remain physically alive. This privileges **biological continuity** over **sociological continuity**.

  2.  **Moral Taxonomy and the "Crime of Crimes":**
      The selective application of the term "genocide" presupposes that moral wrongs are categorical rather than continuous. It posits genocide as a *sui generis* evil. The philosophical justification for this uniqueness is usually rooted in the **double intent**: the intent to kill individuals *plus* the intent to destroy the collective entity they embody.
      *   **Commitment:** This taxonomy commits the international order to the view that killing *because of* group membership is morally distinct from killing *en masse* for political or territorial reasons, even if the death toll is identical. It valorizes the *motive* (destruction of the group) over the *consequence* (number of dead or depth of social ruin).

  ### II. *Sui Generis* Kind vs. Institutional Tractability

  Does the asymmetry necessarily presuppose genocide as a unique moral kind? **No.** While the *rhetoric* relies on the *sui generis* claim, the *practice* is better explained by institutional and political constraints.

  1.  **The *Sui Generis* Argument:**
      Proponents argue that without a distinct category for genocide, the specific harm of "group death" becomes invisible. If all mass killing is subsumed under "Crimes Against Humanity," the specific vulnerability of protected groups (national, ethnical, racial, religious) is lost. Here, the asymmetry is a feature, not a bug: it reserves the highest stigma for the highest moral breach.

  2.  **The Institutional/Political Argument:**
      However, the evidentiary barrier you noted (*dolus specialis*, or specific intent) suggests a commitment to **legal defensibility** over moral comprehensiveness.
      *   **Evidentiary Accessibility:** Proving specific intent to destroy a group is notoriously difficult. It requires documents or explicit statements. Structural violence, cultural erasure, or "ethnic cleansing" (forced displacement without explicit intent to kill) often lacks this paper trail. The legal system prefers categories that are easier to adjudicate, even if they morally under-describe the harm.
      *   **Political Feasibility:** The label "genocide" triggers specific obligations under the 1948 Convention (prevention and punishment). States resist this label to avoid intervention. Therefore, the asymmetry functions as a **sovereignty shield**. By categorizing a campaign as "ethnic cleansing" or "war crimes," the international community acknowledges the suffering without triggering the mandatory intervention mechanisms associated with genocide.
      *   **Conclusion:** The practice does not *necessarily* presuppose a *sui generis* moral kind. It can be fully accounted for by a realist theory of international relations where legal categories are tools of statecraft. The "uniqueness" of genocide is often a diplomatic compromise rather than a philosophical necessity.

  ### III. Lemkin's Conception vs. The 1948 Convention

  Your observation regarding social institutions and cultural practices points directly to the rift between Raphael Lemkin's original conception and the codified law.

  1.  **Lemkin's Holism:** Lemkin conceived of genocide as a coordinated plan aimed at the destruction of the essential foundations of the life of national groups. This included **cultural, linguistic, religious, and political institutions**. For Lemkin, destroying a library, banning a language, or dismantling a social hierarchy was genocidal because it killed the "group soul," even if physical killing was minimal.
  2.  **The 1948 Narrowing:** During the drafting of the Convention, colonial powers and sovereign states successfully lobbied to exclude "cultural genocide." They feared that policies of assimilation or colonial administration could be construed as genocidal.
  3.  **Implicit Dependence:** Current tribunal practice implicitly depends on Lemkin's broader conception **heuristically**, even while rejecting it **legally**. Prosecutors often introduce evidence of cultural destruction (burning mosques/churches, banning languages) not as the *actus reus* of genocide, but as *evidence of intent* to physically destroy the group.
      *   **The Tension:** This creates the asymmetry you experience. The court acknowledges the cultural destruction as proof of the *mindset* required for genocide, but refuses to recognize the cultural destruction itself as the *harm* of genocide. The practice thus smuggles Lemkin's theory in through the back door of evidence, while locking it out of the verdict.

  ### IV. Implicit Theory of Value and Recognition

  We can reconstruct the implicit axiology (theory of value) of the current system by distinguishing what it **requires** versus what it **accommodates**.

  | Feature | **Strictly Required (The Legal Threshold)** | **Merely Accommodated (The Political/Moral Buffer)** |
  | :--- | :--- | :--- |
  | **Harm Type** | Physical/Biological destruction (killing, causing serious bodily/mental harm, preventing births). | Social/Cultural destruction (erosion of institutions, language loss, displacement). |
  | **Intent** | *Dolus Specialis*: Specific intent to destroy the group in whole or in part. | General intent to terrorize, displace, or subjugate (sufficient for Crimes Against Humanity). |
  | **Victimhood** | Membership in a stable, protected group (National, Ethnical, Racial, Religious). | Political, Social, or Cultural groups (often excluded from Genocide statutes). |
  | **Memory** | State-mandated recognition and criminalization of denial (for recognized cases). | Discretionary memorialization; denial remains protected speech or unregulated. |
  | **Value** | **Existence:** The right of the group to remain physically extant. | **Dignity:** The right of individuals to suffer less, but not the right of the group to persist. |

  **The Theory of Recognition:** The current system treats recognition as a **scarce resource**. By limiting the label of genocide, the system maintains the label's "currency." If every mass atrocity were genocide, the specific obligation to prevent it might be ignored due to "alert fatigue." Thus, the system creates a **hierarchy of victimhood**, where those granted the genocide label receive full moral restitution (memory laws, reparations), while others receive only partial justice (individual prosecutions, no collective memory protection).

  ### V. Shifting to a Continuous, Non-Lexical Framework

  If we were to replace the current hierarchical taxonomy with a continuous spectrum of "Collective Annihilation" (treating physical destruction and cultural annihilation as points on a single continuum), the following structural changes would be necessary:

  #### 1. Tribunal Procedure
  *   **Abolition of *Dolus Specialis*:** The requirement to prove specific intent to destroy the group would be replaced by a **risk-based or impact-based assessment**. The focus would shift from "What did they intend?" to "What was the functional outcome for the group's viability?"
  *   **Spectrum Sentencing:** Instead of binary verdicts (Guilty of Genocide vs. Guilty of War Crimes), tribunals would issue findings on a **scale of collective harm**. Sentencing would be calibrated not just on body counts, but on the **irreversibility of social damage** (e.g., loss of language, destruction of intergenerational transmission).
  *   **Admissibility of Cultural Evidence:** Evidence of cultural destruction would no longer be merely corroborative of intent; it would constitute a primary element of the offense. The destruction of a social institution would be legally equivalent to the killing of a member, weighted by its centrality to group survival.

  #### 2. Legislative Recognition
  *   **Universal Denial Statutes:** Laws criminalizing denial would no longer be tied to specific, politically recognized events (e.g., "The Holocaust" or "Srebrenica"). Instead, they would apply to **any judicially verified campaign of collective annihilation** meeting the threshold of the continuous framework. This removes the political veto on memory.
  *   **Redefinition of Protected Groups:** Statutes would expand beyond the four 1948 categories to include **political, social, and cultural groups**, acknowledging that modern violence often targets groups defined by practice or belief rather than birth.
  *   **Restorative Obligations:** Recognition would trigger automatic obligations not just for compensation, but for **structural restoration**. If a campaign is found to have destroyed social institutions, the liable party (or state) would be obligated to fund the reconstruction of those specific institutions (schools, religious centers, governance structures), acknowledging that money cannot repair the specific harm of cultural erasure.

  ### Conclusion

  The asymmetry you have encountered is not an accident; it is the result of a legal system designed to balance moral condemnation with state sovereignty. It presupposes that **physical existence is the only non-negotiable value**, while cultural and social existence is negotiable. It treats genocide as a *sui generis* moral kind in rhetoric, but as a political tool in practice.

  To move to a continuous framework would require abandoning the comfort of binary categories. It would demand a legal system capable of measuring the **depth of social ruin** as precisely as it currently counts the **number of dead**. This would democratize recognition, ensuring that the destruction of a community's future is treated as gravely as the destruction of its present, regardless of whether the perpetrators left a paper trail explicitly stating their intent to destroy.
