answer: |-
  This is a classic friction point in the philosophy of relativity. The slogan "if it's frame-dependent, it's not real" is a rhetorical compression of several distinct claims, ranging from uncontroversial advice about tensor calculus to heavy-duty metaphysical assertions that presuppose the conclusion of the debate.

  Your classmate is using the slogan to bridge the gap between the *mathematical structure* of Special Relativity (SR) and a specific *metaphysics of time* (Eternalism). Your "Multi-Frame Presentism" (MFP)—which I will interpret here as a form of **Relativized Presentism** or **Fragmentalism**, where existence is indexed to a frame rather than absolute—threatens to accept the math without accepting the Block Universe.

  Here is a menu of the distinct precise theses hiding behind that slogan, categorized by their logical type.

  ### Menu of Theses Behind "If it's frame-dependent, it's not real"

  #### 1. The Methodological Covariance Principle
  *   **Category:** (i) Claim about physical law formulation.
  *   **Precise Thesis:** "Fundamental physical laws should be formulated using geometric objects (tensors) that transform covariantly, rather than relying on frame-specific components."
  *   **Defensibility:** **Defensible.** This is standard practice in modern physics (General Covariance). It ensures laws don't depend on arbitrary coordinate choices.
  *   **Supports Rietdijk–Putnam (RP)?** **No.** This dictates how we write equations, not what exists. One can write covariant laws while maintaining a presentist ontology (e.g., by adding a foliation field).
  *   **Rules out MFP?** **No.** MFP can accept covariant laws; it just claims the *ontology* of "what exists" is indexed to the foliation defined by the observer.
  *   **Rules out Global Present?** **No.** It is neutral on ontology.

  #### 2. The Ontological Invariantism Principle
  *   **Category:** (ii) Claim about what exists.
  *   **Precise Thesis:** "For an entity or property to be ontologically fundamental, it must be represented by a frame-invariant quantity (a scalar or the whole tensor, not a component). If the truth value of 'X exists' varies by frame, 'X exists' is not a fundamental fact."
  *   **Defensibility:** **Question-begging against Presentism.** This defines "real" as "invariant." A presentist denies this definition, arguing that existence is monadic but contingent on time (or frame). Using this to prove Eternalism assumes existence *must* be invariant.
  *   **Supports RP?** **Yes.** This is the engine of the RP argument. It asserts that because simultaneity is relative, "what exists now" cannot be a fundamental fact, forcing all times to exist tenselessly.
  *   **Rules out MFP?** **Yes.** MFP claims the fact "Slice S exists" is true in Frame F but false in Frame F'. Ontological Invariantism says such a variable truth value indicates unreality.
  *   **Rules out Global Present?** **Yes.** It rules out any view where the "now" is not a geometric invariant of the manifold.

  #### 3. The 'No Privilege' Corollary
  *   **Category:** (ii) Claim about what exists (Negative constraint).
  *   **Precise Thesis:** "No single inertial frame's simultaneity slice corresponds to *the* ontologically privileged present."
  *   **Defensibility:** **Defensible (within SR).** SR explicitly denies a unique, physically detectable privileged frame.
  *   **Supports RP?** **Only in conjunction with Thesis 2.** Denying one frame is privileged does not logically force *all* frames to be equally real (Eternalism); it could mean *no* frames are fundamentally real (Eliminativism) or that reality is fragmented (MFP).
  *   **Rules out MFP?** **No.** MFP explicitly agrees that no frame is *globally* privileged. It claims *all* are *locally* privileged.
  *   **Rules out Global Present?** **Yes.** It kills Classical Presentism (one true now).

  #### 4. The Causal/Signal Realism Constraint
  *   **Category:** (iii) Claim about causal/explanatory structure.
  *   **Précis Thesis:** "Only entities that can be causally accessed or invariantly signaled between observers count as 'real' in a physical sense."
  *   **Defensibility:** **Debatable/False.** This conflates epistemology (what we can know) with ontology (what exists). Electrons exist even when spacelike separated from us.
  *   **Supports RP?** **Weakly.** It suggests spacelike separated events are "unreal" relative to us, which actually sounds more like Presentism than Eternalism, unless one argues the *union* of all causal cones is the block.
  *   **Rules out MFP?** **Ambiguous.** Depending on how "access" is defined, it might rule out distant parts of a simultaneity slice, undermining MFP's claim that the whole hyperplane is real.
  *   **Rules out Global Present?** **Yes.**

  #### 5. The Semantic Deflationist Stipulation
  *   **Category:** (iv) Other (Linguistic/Meta-ontological).
  *   **Precise Thesis:** "We simply *define* the word 'real' in physics to mean 'frame-invariant.' Therefore, by definition, frame-dependent things are not 'real' in the physics sense."
  *   **Defensibility:** **Stipulative.** It's not true or false; it's a choice of language.
  *   **Supports RP?** **No.** It dissolves the debate rather than solving it. It says "Eternalism is true by definition of our terms," which doesn't convince a metaphysician.
  *   **Rules out MFP?** **Verbally.** It forces the MFP proponent to say, "Okay, the present isn't 'real*physics*', but it is 'real*metaphysics*'."
  *   **Rules out Global Present?** **Yes.**

  ---

  ### Analysis of the Debate Dynamics

  **1. Which reading is usually intended?**
  When physicists or physics-oriented philosophers deploy this slogan to end discussion, they almost invariably intend **Thesis 2: The Ontological Invariantism Principle**.
  They are treating the mathematical structure of Minkowski spacetime as a direct guide to metaphysics. The inference runs: *Physics says simultaneity is relative -> Metaphysics says reality cannot be relative -> Therefore, simultaneity is not ontologically fundamental -> Therefore, all times exist equally.*
  This reading is **question-begging** against you. It assumes that "reality" must share the symmetry properties of the "laws of physics." A presentist (or MFP proponent) can argue that while *laws* are symmetric, the *distribution of matter* or the *fact of existence* breaks that symmetry (even if SR says we can't detect *which* symmetry is broken).

  **2. Which reading allows your view (MFP) to survive?**
  Your view survives only if you reject Thesis 2 and accept a combination of **Thesis 1 (Methodological)** and **Thesis 3 (No Privilege)**, while modifying the concept of existence.
  *   **Thesis 1** allows you to do the physics correctly.
  *   **Thesis 3** concedes there is no *God's-eye* view of the present.
  *   **The Survival Strategy:** You must argue that existence is not a monadic property of events ("Event E exists") but a **dyadic relation** ("Event E exists *relative to* Frame F").
  If you adopt this **Relativized Ontology** (often called *Fragmentalism*, associated with Kit Fine), the slogan "if it's frame-dependent, it's not real" becomes false. Instead, the thesis becomes: "If it's frame-dependent, it's not *absolutely* real, but it is *relatively* real."
  Your classmate's slogan rules out MFP only if they insist on **Absolute Existence**. If you grant that existence is frame-relative, their slogan loses its bite, but you risk collapsing into Eternalism (if "all frames are real" just means "the whole block exists"). To avoid collapsing into Eternalism, you must insist that the fragments are ontologically disjoint (what exists for me *does not* exist for you, literally), which is a hard metaphysical pill to swallow.

  **3. Distinction: Global Privilege vs. Frame-Local Reality**
  The crucial distinction your classmate is eliding is between:
  *   **(A) Rejecting Global Privilege:** Admitting no single frame is *the* true one. (MFP accepts this).
  *   **(B) Rejecting Frame-Local Reality:** Admitting that because no frame is globally privileged, *no* frame's slice constitutes an ontology. (MFP rejects this).
  The slogan moves from (A) to (B) without justification. It assumes that if a property (existence) isn't global, it isn't real. But in SR, many "real" things are local (e.g., proper time along a worldline). Your defense should focus on why *simultaneity slices* can be locally real without being globally privileged.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85%)** on the taxonomy of the slogan's meanings. The distinction between Methodological Covariance and Ontological Invariantism is well-trodden ground in philosophy of physics (see discussions by Brown, Pooley, Saunders, and Sider).

  **Least Sure Distinction:** I am least confident in the stability of the distinction between **Multi-Frame Presentism (Fragmentalism)** and **Eternalism**.
  *   *Why:* If you say "Every frame's hyperplane is real," the union of all hyperplanes is the entire Minkowski manifold. Ontologically, this looks identical to the Block Universe. The only difference is whether you view the block as a *tenseless whole* (Eternalism) or a *collection of overlapping relative presents* (Fragmentalism).
  *   *The Risk:* Many philosophers argue this is a "distinction without a difference." If every point in spacetime belongs to *some* real hyperplane, then every point in spacetime is real. If every point is real, you have Eternalism.
  *   *Uncertainty:* I am unsure if your MFP can be formulated coherently without collapsing into Eternalism. If you claim "Only my slice exists *for me*," but "Your slice exists *for you*," and we are both real observers, then *both slices exist* in the total ontology. This is the specific metaphysical hinge upon which your seminar defense will turn. If you cannot explain how two contradictory existence claims ("E exists" vs "E does not exist") can both be true without trivializing truth, the slogan will win by default.

  **Recommendation:** Do not fight the slogan on physics grounds (you will lose on covariance). Fight it on metaphysical grounds: challenge the premise that "Reality must be Invariant." Argue that *perspectival facts* are still facts.
