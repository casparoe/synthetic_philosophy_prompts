      *Refining the "Multi-Frame Presentism" (MFP) angle:* MFP says *every* slice is real. The slogan says "frame-dependent = not real." If MFP says "Existence is frame-dependent," the slogan attacks the *dependence*, not necessarily the *plurality*. Wait, if MFP says "For frame F, slice S_F is real," the fact *that* S_F is real is frame-dependent (observers in F' disagree on what is real *now*). So the slogan attacks the variability of the ontology itself.

