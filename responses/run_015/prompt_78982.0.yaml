answer: |-
  The Bureau of National Allocation sat on the highest hill of the capital, a brutalist block of concrete overlooking the harbor. Inside, the air was always still, smelling of dry ink and dust, insulated from the salt wind that battered the island below. Dr. Aris Thorne, the Chief Statistician, stood before the Great Ledger of Inputs. It was October, the month of the Requirement Returns.

  On the desk before him lay the conflict for the coming year: Heavy Canvas.

  The island produced exactly four hundred thousand square meters of the stuff. The Storage Directorate claimed they needed three hundred thousand to roof the grain warehouses against the winter rains. The Fisheries Directorate claimed they needed three hundred thousand to mend the deep-sea nets before the herring run. The math was impossible. The sum was six hundred thousand. The reality was four.

  Thorne traced the line item for the Fisheries. According to their return, forgoing the last ten thousand meters of canvas would result in a loss of five hundred tons of catch. He traced the line for Storage. Forgoing the last ten thousand meters there would result in the spoilage of eight hundred tons of grain.

  On paper, the choice was clear. Save the grain. But Thorne knew the paper was lying.

  Down at the docks, Director Kael of the Fisheries sat in his office, the window open to the smell of brine and drying cod. He held the Requirement Return form. It was a dense grid, demanding not just total inputs, but the marginal productivity of each unit. *How much could you forgo? What would the loss be?*

  Kael dipped his pen. He knew the game. Last year, he had filed an honest return. He had stated exactly how much canvas his nets required to hold their shape. The Bureau had cut him by ten percent to balance the ledger. The nets had sagged. The catch had slipped through. His bonus had been withheld, and his name flagged for "optimization."

  This year, he would not be honest. If he asked for what he needed, he would get half. So he asked for double. And regarding the marginal loss? He wrote down numbers that screamed catastrophe. If the Bureau thought a square meter of canvas meant a kilogram of fish, they might listen. If they thought it meant a gram, they would take it away. He wasn't lying to steal; he was lying to survive the algorithm. He knew the canvas was vital, but he couldn't prove it in a grid. He inflated the stakes.

  Back in the concrete tower, Thorne saw the inflation. He saw the Storage Directorate doing the exact same thing. Every director on the island was padding their marginal loss estimates to secure their share of the static pool. The aggregate picture was drifting away from reality, a balloon inflating with hot air. If he allocated based on these returns, he would be distributing resources based on a map of fantasies.

  Thorne had a theory. The Bureau had abolished money to prevent exploitation, but in doing so, they had blinded themselves. Without prices, there was no common denominator to weigh fish against grain. There was only tonnage against tonnage, and the loudest screamer won.

  He reached for a fresh stack of paper. He titled it *Circular 44: Notional Valuation Coefficients.*

  He would not use money. Money was forbidden. But he would use numbers that behaved like money. He calculated the shortages of the previous year. Canvas had been in deficit. Therefore, the shadow price of canvas must rise. He assigned a coefficient of 1.5 to canvas, up from 1.0. He instructed every enterprise manager: *When filing your returns, you must minimize the total coefficient cost of your inputs. You will be judged on efficiency relative to these coefficients.*

  It was a simulation of a market. If the Fisheries truly valued the canvas more than the Storage Directorate, they should be willing to "pay" the higher coefficient. They would reduce their demand for other inputs to afford the canvas. It was Lange's insight rendered in bureaucracy: trial and error via accounting.

  Thorne distributed the Circular. He waited.

  The returns came in the following week. Thorne scanned the new data. The demand for canvas had dropped. The Fisheries had reduced their request from three hundred thousand to two hundred and fifty thousand. The Storage Directorate had reduced theirs to two hundred and fifty thousand. The sum was now five hundred thousand. Still too high, but closer. The mechanism was working. The higher coefficient had suppressed demand.

  Thorne felt a surge of triumph. The system could learn. It could mimic the condensation of knowledge without the chaos of trade.

  But then he walked the floor of the Bureau, listening to the clerks process the secondary forms. He stopped at a desk where a young analyst was reviewing the Fisheries' supplementary sheet.

  "Look at this," the analyst said. "To meet the coefficient target, Kael has substituted hemp rope for canvas binding on the net edges."

  Thorne frowned. "Is hemp sufficient?"

  "The form says yes. The coefficient for hemp is lower. It makes his efficiency rating look excellent."

  "But does he know the hemp will rot in three months instead of six?" Thorne asked.

  "The form doesn't ask for rot rates. It asks for input cost minimization based on the Circular."

  Thorne realized the flaw. The coefficient was a backward-looking number. It was derived from last year's shortages. It told the managers what the Bureau *thought* was scarce, not what was actually scarce in the specific, tacit reality of the docks. Kael wasn't responding to the true scarcity of canvas; he was responding to the scarcity of *bureaucratic approval*. He was optimizing for the form, not for the fish.

  Thorne went to the window. The sky was turning the color of bruised iron. A storm was coming. The real test of the canvas would not be in the ledger, but in the wind.

  He thought about the information trapped in Kael's head. Kael knew that the new synthetic thread they were using was brittle in cold weather. He knew that if he didn't use canvas patches on the specific net pockets used for herring, the friction would tear them. But that knowledge was too granular for the Requirement Return. To report it would require a new category, a new form, a new committee. It was easier to just use the hemp and hope the storm held off, or hope the Bureau sent emergency supplies later.

  The price signal Thorne had printed was too blunt. It was a sledgehammer trying to perform surgery. It conveyed scarcity, yes, but it did not convey *context*. It told Kael canvas was expensive, but not why, or where it was most vital. A real market price changes every second, reflecting the immediate willingness of a buyer to part with cash. Thorne's coefficient was static for a year. It was a photograph of a moving target.

  Yet, what was the alternative? To let the directors scream until the loudest won? At least the coefficient forced them to make trade-offs. It forced them to pretend there was a cost. Without it, they would have asked for infinity.

  Thorne returned to his desk and picked up the allocation order. He had to sign it. He would approve the two hundred and fifty thousand for the Fisheries. He would approve the one hundred and fifty thousand for Storage, forcing them to use tin sheeting for the lower warehouses. It was a compromise based on numbers that everyone knew were partially fabricated.

  He signed the paper. The ink was wet and black.

  Three months later, Thorne took a leave of absence and drove to the coast. The winter rains had come hard. He stood on the pier where the fishing boats were being hauled out for repair. The nets were piled on the wet concrete, a tangled mass of green and grey.

  He walked over to where Kael was supervising the repairs. The Director looked tired. He held a piece of the netting in his hand. The hemp rope Thorne had seen on the form was there, dark with water, swollen and soft. It had held for the first run, but the friction had worn it through.

  "We lost the second haul," Kael said, not looking up. "The hemp slipped."

  "And the warehouses?" Thorne asked.

  "Grain is dry. Tin roofs hold." Kael tossed the ruined net aside. It landed with a heavy, wet slap. "Your numbers were clean, Doctor. The ledger balances. I saw the report."

  Thorne looked at the pile of nets. They were useless now, needing complete re-weaving. The canvas allocated to the warehouses was doing its job perfectly, keeping the grain dry in the dark. The allocation had been rational according to the model. The coefficients had been applied. The rules had been followed.

  He looked out past the pier. The sea was grey and churning. Somewhere out there, the herring were moving in the dark water, uncaught. The information about the brittleness of the hemp, the specific friction of the herring scales, the exact pressure of the winter wind—it had all existed on the island. It had been known by men like Kael. But it had never made it into the Bureau. It had been filtered out by the forms, smoothed over by the coefficients, and lost in the translation from life to paper.

  Thorne reached into his pocket and touched the edge of the Circular 44 he had kept. It was soft now from handling. He watched a worker pick up the ruined net. The man shook it out, trying to salvage the floats, the mesh hanging limp and heavy like wet skin. The rain began to fall again, needling the surface of the harbor, erasing the distinction between the sea and the sky.
