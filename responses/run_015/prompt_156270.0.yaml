      *   *Refinement:* I need to explain *why* Sen's Paradox requires meddlesome preferences (externalities) and ask if the user implies hidden externalities. If not, it's a different game.

  3.  **Deconstruct Version 2 (The "Trap"):**
      *   *Setup:* They don't care about the other's flat. They want to give up the say.
