      *   **Comparing V1 and V2:**
          *   V1 is about the *exercise* of freedom leading to bad results (due to externalities).
          *   V2 is about the *retention* of freedom preventing good results (due to trust/procedure).
          *   They are distinct shapes. V1 is "Freedom hurts us." V2 is "Freedom prevents us from stopping the hurt."

      *   **Novelistic Advice (The "Edges"):**
          *   For V1: You must establish the invisible thread connecting the flats. Why does his book hurt her? (e.g., noise, smell, property value, moral disgust they claim they don't feel but do).
          *   For V2: You must establish the *fear*. Why is being the only one without rights "exposed"? What can the other do? If they don't care about each other, what's the threat? The threat must be structural (e.g., if I give up my say, the Manager can put a speaker in my wall, but you can still block the Manager from putting a speaker in yours, so you have leverage).
          *   Terminology to use: **Nash Equilibrium** (the stuck point), **Pareto Inferior** (the bad outcome), **Transaction Costs** (the cost of agreeing).

