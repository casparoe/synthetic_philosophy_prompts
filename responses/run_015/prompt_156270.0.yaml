      *   *Result:* Stuck with unwanted power.
      *   *Concept:* This is a **Coordination Problem** / **Assurance Game** / **Stag Hunt** variant, specifically locked by a **Unanimity Rule**. It's also a **Precommitment Problem** (they can't commit to giving up power). It resembles a **Lock-In Effect** or **Path Dependence**.
      *   *Is it Sen's?* No. Sen's is about the *exercise* of rights leading to bad outcomes due to preference conflict. V2 is about the *inability to surrender* rights due to procedural rules and trust issues.
      *   *Key Concept:* **The Paradox of Sovereignty** or **The Paradox of Liberation**. Also relates to **Hobbesian State of Nature** (rights are dangerous, need sovereign to take them away, but can't agree on sovereign).
      *   *Specific Term:* **Unanimity Rule Trap** or **Veto Trap**. In political science, this is often discussed regarding Constitutional Amendments or International Treaties.
      *   *Game Theory:* This is a **Prisoner's Dilemma** regarding the *decision to keep rights*.
          *   Keep Rights / Keep Rights = Bad Outcome (Status Quo).
          *   Give Up / Give Up = Good Outcome (Manager).
