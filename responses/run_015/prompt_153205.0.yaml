      *   **Stakeholders & Needs:**
          *   2 Remote Workers (High need, constant video conferencing). Using feature several times a week.
          *   2 Students (Medium/Evening need, streaming).
          *   User (Low/Frequent need, occasional large uploads). Currently has a deadline.
          *   1 Other Resident (Needs unspecified, assume average).
      *   **Current State:** Remote workers are defecting from an informal "emergency only" agreement due to fear of pre-emption (security dilemma).
      *   **User's Dilemma:** Activate now to meet deadline (defect) or restrain (cooperate) while others defect?
      *   **Core Question:** Should I exercise restraint? What collective mechanism could make restraint rational?

  2.  **Ethical & Game Theory Analysis:**
      *   **The Game:** This is a classic *Prisoner's Dilemma* mixed with a *Tragedy of the Commons*.
      *   **Payoffs:**
          *   Everyone restrains: Stable network, fair sharing (Best Collective Outcome).
          *   One defects (User): User meets deadline, others suffer slightly (Best Individual Outcome for User).
          *   Many defect (Current State): Remote workers use it often. Network risk increases. Students/User suffer.
          *   Overlap (Collision): Network crashes. Everyone loses (Worst Outcome).
      *   **The Remote Workers' Logic:** They are playing a "Pre-emptive Strike" strategy. They fear being left with 50% speed during critical work hours, so they grab priority to ensure security. This creates an arms race.
      *   **The User's Position:** If the User activates, it validates the remote workers' strategy ("See? Everyone is doing it"). It increases the risk of collision. However, the User has a specific, time-sensitive need (deadline).
      *   **Restraint vs. Action:**
          *   *Restraint:* Moral high ground, reduces collision risk, but might miss the deadline.
