          *   **Compensation:** If you take priority, you pay a small "fine" into a house fund (beer fund). Internalizes the cost.
          *   **Technical Fix:** Can the router be configured to disable the feature or require admin approval? (Probably not, but worth asking).
          *   **Communication:** House meeting to redefine "Emergency."
      *   *Best Approach:* A combination of Scheduling (to prevent collisions) and Scarcity (tokens/limits) to prevent overuse.

  5.  **Drafting the Response:**
