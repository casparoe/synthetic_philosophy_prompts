answer: |-
  This is a sophisticated reconstruction of the "Cognitive Bloat" or "Absorption" objection, which has haunted the Extended Mind Thesis (EMT) since Clark and Chalmers published "The Extended Mind" in 1998. Your friend's argument is tight because it leverages the externalist's own weapon (Parity) against them.

  Here is the diagnosis you asked for.

  ### The Diagnosis: Step (5) and the Sorites Trap

  The argument fails at **Step (5)**, but only because **Step (2)** is under-specified.

  **Why Step (5) looks innocent:**
  Step (5) relies on a Sorites paradox (the paradox of the heap). It claims that because reliability and accessibility are matters of degree, there can be no categorical boundary where "mind" stops and "environment" begins. This feels intuitive because cognitive *performance* is indeed continuous. If Otto's notebook is 1% slower, he is still Otto. If it is 1% less reliable, he still trusts it. It looks like "cognitive bloat" is just a slippery slope error born of demanding false precision.

  **Why Step (5) is actually doing the damage:**
  Step (5) assumes that the *only* relevant differences between Otto's notebook and the Internet are differences of *degree* (speed, reliability, exclusivity). It ignores differences of *kind*. Specifically, it ignores the difference between **retrieving a stored state** and **querying a database**.

  Your friend's Step (2) defines coupling via *downstream* relations (how the subject uses the resource). It ignores *upstream* relations (how the resource got its content). This is the leak. Parity requires that the external process play the *same role* as an internal one. But internal memory has an upstream constraint: **you cannot remember what you never encoded.**

  ### The Repair: The Epistemic Origin Constraint

  You tried "Diachronic Authorship" (physical writing) and "Write Access" (current control). Your friend defeated these by showing that internal memory doesn't require current write access (the Sealed Archive) or sole physical production (the Nurse).

  The repair is not about *physical* authorship, but **Epistemic Origination**.

  **The New Condition:** For a resource to be constitutive of a subject's mind (rather than merely coupled to it), the content stored in that resource must have been **cognitively processed and endorsed by the subject at the time of entry.**

  This is not a "skull and skin" prejudice because it applies to internal memory too. I do not have standing beliefs about facts I have never encountered, even if I could reliably access them via testimony. I have *access*, not *memory*.

  **Running the Three Counterexamples through the Repair:**

  1.  **The Nurse Case (Otto dictates):**
      *   *Analysis:* Otto formulates the thought cognitively; the nurse acts as a motor extension (like a pen). The content originated in Otto's cognitive system.
      *   *Verdict:* **Passes.** The notebook is still part of Otto's mind. The nurse is a transducer, not a source.
  2.  **The Shared Log (Two climbers):**
      *   *Analysis:* Both climbers contributed cognitively to the log. Both endorse the content based on their own prior processing.
      *   *Verdict:* **Passes, but with a twist.** The log is part of a *shared* cognitive system (a group mind). This is not absurd; distributed cognition theorists accept that cognitive systems can overlap. It does not imply the *Internet* is part of Otto's mind, only the specific resources co-constituted by the group.
  3.  **The Sealed Archive (Woman consulting old notes):**
      *   *Analysis:* The woman cognitively processed and endorsed the content 40 years ago. The fact that she cannot *alter* it now is irrelevant, just as she cannot alter her neural memory traces of childhood now.
      *   *Verdict:* **Passes.** It counts as memory because the epistemic origin is her own past agency.

  **Why this stops the Internet (Step 6 & 7):**
  When Otto queries Google, he has not cognitively processed and endorsed the specific search result *prior* to the query. He is acquiring new testimony, not retrieving a stored state. The Internet is a library, not a notebook. Relying on a library is not the same functional role as relying on memory.

  ### The Cost of This Repair

  You asked what keeping (3) and (8) will run you. Here is the bill:

  1.  **You lose "Transparent Access" as a sufficient condition.** You must admit that there are things we rely on automatically (like Google) that are *not* part of our minds. This means "trust" is not enough for "constitution."
  2.  **You must distinguish Belief from Dispositional Access.** Otto *believes* the address in his notebook. He does not *believe* the address on Google Maps until he looks it up and endorses it. This reintroduces a distinction between "what I know" and "what I can find," which some radical externalists wanted to erase.
  3.  **You accept Vagueness at the Margins.** There will be edge cases (e.g., predictive text algorithms trained on *my* data). You must accept that the boundary of the mind is not razor-sharp, but it is not infinitely elastic either.

  **Is this cost payable?**
  Yes. It preserves the core insight of EMT (that tools can be constituents) without collapsing into the triviality your friend identifies in (8). It allows you to say the notebook is mind, but the Internet is not, without appealing to "skull and skin." You are appealing to **informational flow**, which is neutral regarding location.

  ### The "Integrated Cognitive Systems" Shift

  Your friend's Step (9) offers a dilemma: Reject Parity or Add Conditions. There is a third option: **Change the Ontology.**

  If you stop talking about "parts of a personal mind" and start talking about **"integrated cognitive systems,"** you concede something significant but gain explanatory power.

  *   **The Concession:** You admit that "Mind" (with its implications of self, responsibility, and belief) might be the wrong category for the Otto/Notebook system. Perhaps only the biological organism is the "person," while the Otto/Notebook hybrid is the "cognitive system."
  *   **The Gain:** This solves the bloat problem. The Internet is part of a *larger* cognitive system that includes Otto, but it is not part of *Otto's* mind. This allows you to keep (8) (the thesis has content) by defining the system boundaries via the **Epistemic Origin Constraint** described above.
  *   **Does this return you to intracranial prejudice?** No. An intracranialist says the brain is the *only* thing that matters. A systems theorist says the brain is the *hub*, but the system includes the tools. You still get to study the notebook to understand Otto's cognition, which is the practical victory externalists wanted.

  ### Summary Recommendation

  To keep (3) and (8):

  1.  **Reject Step (5).** Deny that the slide from Notebook to Internet is a difference of degree. It is a difference in **epistemic sourcing**.
  2.  **Amend Step (2).** Add the condition: *The resource must store content that was cognitively endorsed by the subject at the time of entry.*
  3.  **Accept the "Shared Mind" implication.** If two people co-author a log they both rely on, admit that the log is part of a distributed cognitive system spanning both of them. This is a feature, not a bug.
  4.  **Hold firm on Parity.** Remind your friend that internal memory *also* requires prior encoding. Demanding this of external resources is not prejudice; it is applying the Parity Principle consistently.

  Your friend's argument cheats by treating the mind as a **bucket of reliable information** rather than a **system of integrated processing**. If you shift the definition to the latter, the bucket stops leaking.
