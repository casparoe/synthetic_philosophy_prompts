  ### The Leaf Classification

  The following leaves represent the stable combinations of answers. Each leaf identifies a theoretical family, notes its most awkward commitment, and identifies the case from your list it handles worst. Combinations marked 'Unoccupied' are logically possible but theoretically uninhabited.

  1.  **Gricean Pragmatics.** (Q1: No, Q3: Yes, Q4: Yes, Q6: No). Conditionals are material implications; conversational implicatures explain the oddity of asserting known falsehoods.
      *   *Awkward commitment:* Must explain away the strong intuition that 'if' implies a connection beyond truth-functionality.
      *   *Worst case:* The Settling case (fails to capture the connection felt on Monday).

  2.  **Jackson's Assertability.** (Q1: No, Q3: Yes, Q4: Yes, Q6: No). Conditionals are material, but have a conventional implicature of robustness.
      *   *Awkward commitment:* Posits a semantic component that contributes no truth-conditional content.
      *   *Worst case:* The Chance case (struggles to align credence with probability).

  3.  **Edgington's Suppositionalism.** (Q1: Yes, Q2: No Truth Conditions). Conditionals have no truth conditions; to assert one is to add the consequent to the supposition of the antecedent.
      *   *Awkward commitment:* Denies that conditionals can be embedded in complex sentences without loss of sense.
      *   *Worst case:* Import and export (nested conditionals become difficult to parse).

  4.  **Gibbard's Expressivism.** (Q1: Yes, Q2: No Truth Conditions). Conditionals express a state of mind rather than a belief; logic is a matter of consistency in planning.
      *   *Awkward commitment:* Cannot explain why conditionals serve as premises in factual reasoning about the world.
      *   *Worst case:* The Settling case (cannot explain the retrospective truth of the Monday claim).

  5.  **Adams' Probabilism.** (Q1: Yes, Q2: No Truth Conditions). The probability of a conditional is the conditional probability; validity is preservation of high probability.
      *   *Awkward commitment:* Logic is non-classical; modus ponens fails for uncertain premises.
      *   *Worst case:* Counterpossibles (probabilities of impossible antecedents are undefined).

  6.  **De Finetti's Three-Valued Logic.** (Q1: Yes, Q2: Truth Conditions). Conditionals are true, false, or void (when the antecedent is false).
      *   *Awkward commitment:* Truth-value gaps complicate the logic of negation and disjunction.
      *   *Worst case:* The Detective case (voidness does not fully explain assertability restrictions).

  7.  **Stalnaker's Context Set.** (Q1: No, Q3: Yes, Q4: No, Q6: Yes, Q7: No). A single closest world is selected from the context set; indicatives and subjunctives share semantics.
      *   *Awkward commitment:* Requires a unique closest world, which seems metaphysically fragile.
      *   *Worst case:* Backtracking (selection function usually rules out backtracking by stipulation).

  8.  **Lewis's Similarity.** (Q1: No, Q3: No, Q5: No, Q6: No, Q7: No). Subjunctives quantify over similar worlds; indicatives are distinct (often context-restricted).
      *   *Awkward commitment:* Indicative and subjunctive conditionals are semantically unrelated despite surface similarity.
      *   *Worst case:* The Settling case (cannot explain the continuity between Monday and Friday).

  9.  **von Fintel's Strict Context.** (Q1: No, Q3: Yes, Q4: No, Q6: Yes, Q7: Yes). Conditionals are strict quantifiers over a contextually restricted domain; domain can expand.
      *   *Awkward commitment:* Requires dynamic context change to handle exceptions (Strengthening).
      *   *Worst case:* Strengthening and sequence (requires pragmatic repair to explain invalidity).

  10. **Kratzer's Restrictor.** (Q1: No, Q3: Yes, Q4: No, Q6: Yes, Q7: No). 'If' is not a connective but a restrictor on a covert modal; mood supplies the modal base.
      *   *Awkward commitment:* 'If' has no meaning in isolation; requires a modal to complete the thought.
      *   *Worst case:* The Detective case (sometimes predicts felicity where intuition suggests silence).

  11. **Willer's Dynamic Information.** (Q1: No, Q3: Yes, Q4: No, Q6: Yes, Q7: Yes). Conditionals update the information state; truth is stability under update.
      *   *Awkward commitment:* Truth is relativised to information states, not the world.
      *   *Worst case:* Counterpossibles (information states cannot contain contradictions).

  12. **Interventionist Causal.** (Q1: No, Q3: No, Q5: No, Q6: No, Q7: Yes). Counterfactuals are about causal interventions; indicatives are evidential.
      *   *Awkward commitment:* Requires a full causal model for every utterance context.
      *   *Worst case:* Indefinite antecedents (causal models are typically token-specific).

  13. **Impossible Worlds.** (Q1: No, Q3: No, Q5: No, Q6: No, Q7: Yes). Selection functions range over impossible worlds to evaluate counterpossibles.
      *   *Awkward commitment:* Commits to the existence of logically impossible possibilities.
      *   *Worst case:* The Chance case (probabilities over impossible worlds are ill-defined).

  14. **Unified Strict.** (Q1: No, Q3: Yes, Q5: Yes, Q6: No, Q7: No). Both moods are strict conditionals; mood indicates the size of the modal base.
      *   *Awkward commitment:* Struggles to explain why strengthening fails for subjunctives.
      *   *Worst case:* Strengthening and sequence (predicts validity where intuition finds failure).

  15. **Unoccupied (Material + Non-Monotonic).** (Q1: No, Q3: Yes, Q4: Yes, Q5: No).
      *   *Diagnosis:* Incoherent; material implication is logically monotonic by definition.

  16. **Unoccupied (No TC + Vacuous Counterpossibles).** (Q1: Yes, Q2: No Truth Conditions, Q7: Vacuous).
      *   *Diagnosis:* Unexplored; if there are no truth conditions, vacuity is the wrong metric for evaluation.

  17. **Unoccupied (Global + Context-Restricted).** (Q6: Yes and No).
      *   *Diagnosis:* Incoherent; one cannot hold that selection is both global and restricted to the context set simultaneously.

  18. **Unoccupied (Distinct + Unified).** (Q3: Yes and No).
      *   *Diagnosis:* Incoherent; the content cannot be both identical and different.

  ---

  ### Unoccupied Combinations and Diagnostics

  The logical space permits combinations that no major theory occupies. These are marked above as leaves 15–18, but specific diagnostic notes follow for the most salient gaps.

  *   **Material Implication with Non-Monotonic Logic.** (Q4: Yes, Q5: No). *Diagnosis:* Incoherent. The truth table for the material conditional guarantees that adding conjuncts to the antecedent cannot turn a true conditional false.
  *   **Truth-Conditional Suppositionalism.** (Q1: Yes, Q2: Truth Conditions). *Diagnosis:* Merely unattractive. Lewis's triviality results suggest this space is empty unless one adopts non-classical probability or three-valued logic (see Leaf 6).
  *   **Context-Restricted Global Selection.** (Q6: Yes and No). *Diagnosis:* Incoherent. A selection function cannot simultaneously ignore the context set and be bound by it.
  *   **Expressivist Counterpossibles.** (Q2: No Truth Conditions, Q7: Substantive). *Diagnosis:* Unexplored. Expressivists typically treat counterpossibles as nonsense or uniformly rejected, not as substantively true.

  ### A Note on Separation

  Two leaves are not fully separated by this tree: **Stalnaker's Context Set (7)** and **Kratzer's Restrictor (10)**. Both answer 'Yes' to Context-Restricted and 'Yes' to Quantificational (in the broad sense of modal quantification). They are separated only by whether 'if' is a syntactic restrictor (Kratzer) or a semantic selector of worlds (Stalnaker). To separate them, one would need a ninth question on syntactic constituency, specifically asking whether 'if'-clauses can be moved independently of the modal they restrict. I have omitted this to keep the instrument focused on semantic output rather than syntactic machinery.

  ### Personal Stance

  I would stand at Leaf 10, Kratzer's Restrictor view, as it best unifies the treatment of indicatives and subjunctives under a single modal semantics while respecting the contextual constraints highlighted in the Detective case.
