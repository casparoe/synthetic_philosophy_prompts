  ### The Decision Tree for Conditionals

  This instrument classifies theoretical positions by their commitments to concrete linguistic data rather than by their allegiance to schools of thought. The eight questions below traverse the logical space of the semantics and pragmatics of 'if'. To use the tree, answer each question based on your intuitions about the case described; track your path to the corresponding leaf in the classification table.

  **Note on Ambiguity:** Where a case admits both a semantic reading (truth conditions) and a pragmatic reading (assertability conditions), the questions below stipulate that you answer according to the *semantic* contribution unless the question explicitly asks about assertion. This ensures the tree maps semantic theories first, leaving pragmatic overlays to be noted within the leaf descriptions.

  **Question 1 (The Chance Case).** In the 'Chance under known chances' case, given the source did not emit, is your credence in 'if the source had emitted, the animal would have died' equal to the objective chance (0.5)?
  *   **Yes:** Go to Question 2.
  *   **No:** Go to Question 3.

  **Question 2 (The Truth-Condition Limit).** If you answered 'Yes' to Question 1, does this credence reflect a belief in a proposition that is true or false, or does it reflect a degree of acceptance without truth conditions?
  *   **Truth Conditions:** Go to Question 3.
  *   **No Truth Conditions:** Go to Question 6.

  **Question 3 (The Settling Case).** In the 'Settling' case, does the Monday indicative ('if the growth is') express the same proposition as the Friday subjunctive ('if the growth had been'), differing only in what the speaker presupposes?
  *   **Yes (Unified Content):** Go to Question 4.
  *   **No (Distinct Content):** Go to Question 5.

  **Question 4 (The Material Node).** For the Unified Content view, is the proposition expressed on Monday true simply because the growth was found benign (i.e. is it truth-functional)?
  *   **Yes:** Go to Question 6.
  *   **No:** Go to Question 6.
      *(Note: This question separates Material from Non-Material Unified views, but both proceed to the same structural questions regarding quantification and modality.)*

  **Question 5 (The Distinct Content Node).** For the Distinct Content view, does adding information to the antecedent (e.g. 'and the greenhouse froze') preserve the truth of the conditional (Monotonicity)?
  *   **Yes (Strict):** Go to Question 6.
  *   **No (Variable):** Go to Question 6.

  **Question 6 (The Detective Case).** In the 'Antecedent you rule out' case, is the detective's utterance infelicitous because the antecedent is excluded from the set of possibilities relevant to the conversation (the context set)?
  *   **Yes (Context-Restricted):** Go to Question 7.
  *   **No (Global Possibilities):** Go to Question 7.

  **Question 7 (The Indefinite Case).** In the 'Indefinite antecedents' case, does the word 'if' function as a restrictor on a quantifier binding the variable 'a patient', rather than as a sentential connective?
  *   **Yes (Quantificational):** Go to Question 8.
  *   **No (Propositional):** Go to Question 8.

  **Question 8 (The Counterpossible Case).** In the 'Counterpossibles' case, is the utterance 'If 17 had been divisible by 4...' vacuously true, or does it have a substantive truth value based on impossible worlds or causal structure?
  *   **Vacuous:** Leaf Set A.
  *   **Substantive:** Leaf Set B.

  *(Note: Question 8 is the final splitter. Backtracking (Case 8) is treated as a diagnostic feature within the leaves rather than a branch, as it often correlates with the Distinct Content/Variable Strict views without defining a unique semantic family on its own.)*

