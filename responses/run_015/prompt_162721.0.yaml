answer: |-
  This is an excellent taxonomy. It is not junk. In fact, it is significantly more robust than the slogan it dissects, largely because your two "add-ons" (Losers' Counter-Histories and the Evidentiary Boomerang) do the heavy lifting that the original slogan cannot.

  If you use Nuremberg to teach "History is Written by the Victors" without your add-ons, you will teach a falsehood. With them, you can teach a complex truth.

  Here is the mapping run, honest and concrete.

  ### 1. Who is "The Victor"? (The Four-Power Fracture)
  The slogan assumes a monolith. Nuremberg reveals a coalition in tension.
  *   **The US/UK:** Wanted a judicial process to establish a historical record and distinguish themselves from Soviet "summary justice." Jackson (US) specifically feared a "show trial" would delegitimize the outcome.
  *   **The USSR:** Wanted a show trial to confirm pre-determined guilt, establish "aggressive war" as a crime (to cover their own invasions), and pin the Katyn massacre on the Germans.
  *   **France:** Wanted to focus on crimes against French sovereignty and ensure the death penalty was an option (which the US initially resisted).

  **Verdict:** The "Victor" is not a singular author. It is a negotiating table. The final judgment is a compromise text, not a dictate.
  *   **Confidence:** High. The transcripts of the London Conference (summer 1945) detailing these arguments are public and explicit.
  *   **Implication:** If history is written by the victors, it is written in the subjunctive mood, full of edits and redlines.

  ### 2. Running Your Taxonomy Against the IMT

  #### The Archival Thesis (*Victory decides which paperwork survives*)
  *   **Confirm:** The IMT relied almost entirely on captured German documents. The Allies seized the Reich Chancellery papers, the Foreign Office files, and military logs. Without victory, this archive is destroyed or hidden.
  *   **Break:** The archive was not total. The Soviets withheld the Katyn files (blaming Germans despite knowing they did it). The US later destroyed or lost some denazification records.
  *   **The "Boomerang" Effect:** Because the US/UK insisted on *documentary* proof rather than just affidavits, the defense was allowed to introduce counter-documents. This is how the world learned the Soviets were lying about Katyn *during the trial*. The victor's archive accidentally preserved the evidence of the victor's own lies.
  *   **Confidence:** High on the capture; Medium on the "accidental preservation." (Some scholars argue the Katyn exposure was managed, but the transcript remains public).

  #### The Framing Thesis (*Victory decides the vocabulary*)
  *   **Confirm:** This is the strongest fit. "Crimes Against Peace," "Crimes Against Humanity," and "Conspiracy" were legal categories created by the London Charter *after* the acts were committed. The defense argued *ex post facto* law; the Tribunal ruled that the victors had the power to define the law.
  *   **Nuance:** These categories did not stay with the victors. They escaped into international law (Geneva, ICC). The losers' vocabulary (sovereign right to war) was erased globally.
  *   **Confidence:** Very High. This is the core legal legacy of Nuremberg.

  #### The Uptake Thesis (*Victory decides what gets believed*)
  *   **Confirm:** Initially, yes. The "Nuremberg Narrative" (Nazi criminal organization) became the baseline in Allied schools.
  *   **Break:** The "Clean Wehrmacht" myth. This is your **Losers' Counter-History**. Despite the IMT declaring the General Staff a criminal organization (in part), the Cold War necessitated rearming West Germany. The US/UK (Victors) *adopted* the Losers' counter-history for geopolitical utility.
  *   **Implication:** Uptake isn't decided by victory in 1945; it's decided by power utility in 1955. The slogan implies a one-time event; history is a continuous process.
  *   **Confidence:** High. The shift in Allied policy from 1946 (Morgenthau Plan/Denazification) to 1950 (Adenauer integration) is well-documented.

  ### 3. The Acquittals: The Slogan-Breaker
  You remembered correctly. Three defendants were acquitted of all charges (Hjalmar Schacht, Franz von Papen, Hans Fritzsche). Others were acquitted of specific counts.

  *   **What the Slogan Predicts:** A show trial convicts 100% of the accused. The outcome is predetermined by the political need for vengeance.
  *   **What Happened:** The Tribunal voted. The Soviet judge dissented on the acquittals (wanting them convicted), but was outvoted by the US, UK, and French judges.
  *   **Significance:** This is the strongest evidence against the relativist conclusion. If power alone dictated history, Schacht goes to the gallows. He didn't. Why? Because Jackson's strategy bound the prosecution to *evidence*, and the evidence for Schacht's conspiracy was thin.
  *   **Confidence:** High. The voting records and dissenting opinions are part of the official record.
  *   **Caveat:** Do not overstate this. They were acquitted of *conspiracy* and *crimes against peace*, but the public perception often remained that they were "bad men." Legal acquittal $\neq$ historical exoneration in the public eye (Uptake Thesis failure).

  ### 4. The Relativism Question
  *Does this case support the slide from "power shapes account" to "no fact of the matter"?*

  **No.** Nuremberg argues the opposite.

  Here is the distinction you can offer your students:
  1.  **Power shapes the Frame:** The *charges* (Aggressive War) and the *court composition* were determined by victory. There was no neutral ground.
  2.  **Evidence constrains the Content:** Once the victors committed to a judicial process with rules of evidence, they lost the ability to dictate the *facts*. They could not convict Schacht because the documents didn't support it. They could not convict the Germans of Katyn because the forensic evidence didn't support it (so they dropped the charge).

  **The Evidentiary Boomerang (Your Add-on B):**
  This is the critical mechanism. By legitimizing their victory through *law* rather than *force*, the Allies created a record that outlived their political control.
  *   **Example:** The transcript is public. Today, a historian can use the IMT transcript to show that the Soviets tried to frame the Germans for Katyn. The victor's tool for legitimizing power became the tool for exposing the victor's corruption.
  *   **Conclusion:** Nuremberg shows that "History is written by the victors" is only true if the victors choose *force* over *process*. If they choose process, they bind themselves to a truth that may later embarrass them.

  ### 5. Critique of the Slogan
  Is "History is written by the victors" too vague?
  **Yes.** For this case, it is analytically useless without your modifications.

  *   **Why:** It implies a finished product. Nuremberg was a starting gun. The "history" of the Holocaust and the War was contested for 50 years *after* the verdict (e.g., the Historikerstreit in the 80s, the Wehrmacht Exhibition in the 90s). The victors won the trial, but they lost control of the narrative multiple times in the decades following.
  *   **Better Slogan:** "Victory secures the archive, but evidence constrains the narrative." Or: "Victors write the first draft, but the archive edits the final copy."

  ### 6. Confidence & Retraction Markers

  | Claim | Confidence | Retraction Condition |
  | :--- | :--- | :--- |
  | **Three Acquittals** | **High** | If new sealed voting records show the Western judges coerced the Soviets (unlikely, Soviet dissent is public). |
  | **Katyn Dropped** | **High** | If Soviet archives reveal the Tribunal *did* blame Germany in a sealed annex (no evidence of this; it was omitted to save face). |
  | **Boomerang Effect** | **Medium** | If it turns out the US/UK knowingly suppressed Katyn evidence *outside* the trial more than they admitted. (They did suppress it politically, but the trial record remains the exposure point). |
  | **Clean Wehrmacht** | **High** | If new data shows the myth was primarily driven by Germans without Allied acquiescence. (Historical consensus is Allied Cold War needs drove the rehabilitation). |
  | **Anti-Relativism** | **Medium-High** | If one argues that the *legal* truth of Nuremberg is distinct from *historical* truth. (Valid philosophical objection, but practically, the document trail holds). |

  ### Pedagogical Recommendation
  Don't discard the slogan. Use it as a **hypothesis to be tested**.

  1.  **Start with the Slogan:** Ask students to predict the outcome of Nuremberg based *only* on "History is Written by the Victors." (Prediction: 100% conviction, Soviet charges accepted, no defense).
  2.  **Introduce the Data:** Show the acquittals. Show the Katyn omission. Show the transcript of the Soviet prosecutor being cross-examined.
  3.  **Apply Your Taxonomy:**
      *   *Framing:* Victors won (new laws).
      *   *Archival:* Victors won (captured docs).
      *   *Uptake:* Mixed (Cold War shifted power).
      *   *Boomerang:* The Rules constrained the Victors.
  4.  **Conclusion:** The slogan is half-true. Power determines *what questions are asked* (Framing), but it does not always determine *the answers* (Evidence), provided the victors value legitimacy over pure vengeance.

  This approach saves the session from cynicism ("Nothing is true") without falling into naivety ("Justice was blind"). It lands on: **"Truth is a contest, and power buys you a seat at the table, but it doesn't guarantee you win the vote if you bind yourself to the rules."**
