      *   *Nuance:* Mencius likes things that align with nature. If the implant *activates* what's already there, maybe he likes it? But if it *replaces* the cultivation process, it's like pulling seedlings to make them grow (the famous parable). It kills the life of the virtue.
      *   *State Control:* If the state can turn it off, it's definitely external coercion. Mencius hates rule by force (hegemony); he wants rule by virtue. This makes people tools, not moral agents.

