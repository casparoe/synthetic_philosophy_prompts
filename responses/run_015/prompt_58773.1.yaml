  I'll grant that throwing cash into a corrupt void helps no one, and you're right to demand evidence that your money actually buys nets or medicine. But you're using the complexity of logistics as a smokescreen to ignore the certainty of death that happens when you withhold aid. You cannot know if another donor would have stepped in, and betting a human life on that uncertainty is grotesque. You wouldn't stand by a pond arguing about whether someone else might have jumped in if you hadn't, so why accept that logic when the pond is just out of sight? The child doesn't care about your accounting worries, they care about whether you decide their life is worth the price of your boots.
