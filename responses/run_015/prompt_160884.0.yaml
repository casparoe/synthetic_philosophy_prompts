      **RFC-742: Deprecation of `core/qualia` Package**
      **Status:** Accepted
      **Author:** Maintainer Team

      **Summary**
      This RFC proposes removing the `qualia` package from the monorepo. Audit logs indicate zero successful invocations in production. The package's interface guarantees prevent observation, testing, or integration, rendering it dead weight. A compatibility shim will preserve build stability for downstream consumers.

      **Motivation**
      The `qualia` package was designed with four strict API guarantees. Unfortunately, these guarantees conflict with standard engineering practices:

      1.  **Ineffability:** Instances do not support serialization or string conversion. Logging calls throw `TypeError`. We cannot track state changes.
      2.  **Intrinsicness:** Objects ignore external context or dependency injection. They cannot be mocked or stubbed during unit tests.
      3.  **Privacy:** Accessors are strictly private. No external module can read the property values, making integration checks impossible.
      4.  **Direct Apprehension:** The API bypasses the standard event loop. Middleware cannot intercept calls, meaning no error handling or tracing spans can be attached.

      Collectively, these constraints mean the package cannot be debugged, measured, or verified. If a bug exists, it cannot be filed because the state cannot be described. If a feature works, it cannot be confirmed because the output is unreadable. The definition of the package undermines its own utility as a software component.

      **Breaking Changes**
      Importing `qualia` will fail after v4.0. However, behavioral changes are expected to be null.

      **Downstream Impact & Migration**
      We are releasing `compat/phenomenal-reporting` as a drop-in replacement. This shim routes all calls to the `report_and_discrimination` layer.

      Analysis of downstream consumers shows no actual dependency on `qualia` internals:
      *   **The Knowledge Argument Module:** Currently reads from cache, not direct instance access.
      *   **Inverted Spectrum Regression Tests:** Compare behavioral outputs, not internal state.
      *   **Suffering Ethics Engine:** Triggers on reported distress signals, not intrinsic properties.
      *   **Hard Problem Dashboard:** Visualizes latency in reporting functions, not the data itself.
      *   **Philosophical Zombies:** Already operate exclusively on the discrimination layer.

      Since all consumers interact with the reporting interface rather than the raw data, swapping the backend implementation will not change observable behavior. The legacy snapshot suite baselines have been silently regenerated for the past three release cycles without triggering CI failures, confirming that output stability is maintained regardless of the underlying `qualia` presence.

      **Closed Issues**
      Several tickets were opened during the deprecation period.

