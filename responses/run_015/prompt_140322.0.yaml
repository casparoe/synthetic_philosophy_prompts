answer: |-
  This is a exceptionally clear formulation of a classic tension in land ethics, often found in the gap between Henry George's *Progress and Poverty* and modern zoning law. Your friend has constructed a valid syllogism, but it relies on a sleight of hand in the definition of "community" and a conflation of *rent* with *control*.

  You are right to trust your intuition on (1) and (2). Economically and morally, they are the strongest links. Site value *is* largely socially created (the rail station, the safe street, the nearby jobs), and it is difficult to argue that a titleholder has a moral claim to unearned increments generated by others.

  The break in the chain is at **(4)**, which forces a specific and flawed definition of "community" in **(6)**.

  Here is how you can reject (4) and (6) without surrendering the moral ground of (1) and (2), and what it costs to do so.

  ### 1. Reject the Conflation in Step (4)
  **The Claim:** "If the site value belongs to the community, then the decisions that determine it... belong to the community as well. You cannot own the stream of benefits and not own the tap."

  **The Rejection:** This is a category error. Ownership of the *surplus* (rent) does not imply ownership of the *disposition* (use) in a way that permits exclusion.

  **The Argument:**
  Consider a public trust, like a navigable river. The "value" of the river (transport, water, ecology) belongs to the public. The state can tax or regulate the use of that river to capture that value for the public good. However, that does not mean the people living on the banks of the river have the right to decide who can float down it.

  In land terms: The community has a claim on the *rent* (via LVT), but not necessarily a claim to *veto specific uses* if those uses are compatible with the general welfare.
  *   **Why this breaks the chain:** It separates the *fiscal* right (tax the value) from the *regulatory* right (zone the land).
  *   **The Cost:** You must admit that private owners (or developers) need some sphere of autonomy to decide *how* to utilize the land, provided they pay the community for the privilege. You move from a model of "Community as Owner" to "Community as Landlord." A landlord collects rent; they do not necessarily micromanage the tenant's life, nor do they have the right to refuse a tenant for arbitrary reasons (fair housing laws).

  ### 2. Redefine the "Community" in Step (6)
  **The Claim:** "In every real city the community that decides is the people already inside it, voting in the only forum available."

  **The Rejection:** This contradicts Step (1).
  *   **Step (1)** says site value is created by "who lives nearby," "the trains," "the shops," "whether anyone wants to be in this city."
  *   **Step (6)** says the decision-makers are "people already inside [the town]."

  **The Mismatch:**
  The *producers* of the site value (commuters, regional workers, future residents, the state that built the rail line) are not the same group as the *voters* in the municipal election.
  If the moral claim to the land rests on the fact that *society* created the value, then the "community" that holds the title to that decision is **society at large** (or the region), not the municipal incumbents.

  **The Argument:**
  When a town votes to exclude 40 apartments, they are not "disposing of their own asset." They are disposing of an asset created by the regional economy and the state infrastructure (the commuter rail). By restricting supply, they are artificially inflating the site value (contradicting the goal of Step 3) and excluding the very people whose labor contributes to the "activity of everyone around them" (Step 1).

  *   **Why this breaks the chain:** It denies the incumbent majority the moral licence to close the city. They are not the sole owners of the site value; they are merely the local stewards of a regional asset.
  *   **The Cost:** This requires rejecting the moral autonomy of the municipality. It implies that local zoning must be subject to higher-level constraints (state or regional housing mandates) because the "community" that owns the value is larger than the town. You have to argue that a town meeting is *not* the legitimate voice of the "community" defined in Step (1).

  ### 3. The "Lockean Proviso" Alternative
  If you want to keep the logic tight, you can introduce a constraint on (4) derived from Locke: *Appropriation is legitimate only if there is "enough and as good" left for others.*

  *   **Modified (4):** If the site value belongs to the community, decisions belong to the community, **provided those decisions do not exclude others from access to the commons necessary for survival and participation.**
  *   **Modified (6):** If the town meeting votes to keep the forty apartments out, they are violating the proviso. They are enclosing a commons (the housing supply near transit) that was generated by regional activity, denying access to outsiders who contributed to that value.

  ### Summary of the Trade-Offs

  You asked which step is cheapest to lose.

  **Lose (4) and (6). Keep (1), (2), (3), and (5).**

  *   **Keep (5):** The neighbor still has no *property-based* veto. She cannot say "this lowers my site value" because she doesn't own the site value.
  *   **Lose (6):** The incumbent voters do not get to substitute their preference for the regional need.

  **What you have to believe instead:**
  1.  **Zoning is a Regional Function:** Because land value is created regionally (trains, jobs, safety), the right to decide density must be held regionally. Local control is a delegation, not a right.
  2.  **LVT is Not Enough:** Taxing land value (Step 3) is necessary but insufficient. You also need *access rights*. High LVT incentivizes development, but if zoning forbids it, the tax just becomes a cost passed to tenants or a barrier to entry. You need LVT *plus* a right to build.
  3.  **The "Community" is Abstract:** The "community" that owns the land value is a moral construct including future generations and potential residents, not a legal construct of current registered voters.

  ### How to Argue This in Your Group

  Your friend's argument is a "Georgist Trap." It uses the morality of land taxation to justify the immorality of exclusionary zoning.

  Tell him: *"You are right that the neighbors don't own the site value. But you are wrong about who does. Step (1) says the value comes from the trains, the schools, and the city. Step (6) says the Town gets to decide. But the Town didn't build the rail line, and the 'City' includes the people who want to live here but can't. If the value is socially created, the 'Society' that gets to decide must be at least as large as the society that created the value. By letting a small group of incumbents veto housing, you aren't returning the value to the community; you're allowing a cartel to capture the scarcity rent. That violates Step (2)."*

  **The distinction you were reaching for** (producers vs. voters) **is doing moral work.** It identifies a *representation deficit*. The moral owners of the site value (the producers) are disenfranchised by the legal voters (the incumbents). The solution is not to give the incumbents the veto (Step 6), but to align the decision-making body with the value-creating body (e.g., state-level housing standards).

  **The Cost:** You lose "Home Rule." You have to argue that local democracy is subordinate to regional justice. For a group of lawyers and planners, this is a familiar, if contentious, trade-off. But it is the only way to keep (1) and (2) without accepting (7).
