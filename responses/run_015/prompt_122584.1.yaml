answer: |-
  # Q&A Prep Sheet: Approval-Directed vs. Goal-Directed Agency

  **Talk Date:** Next Thursday
  **Audience:** 8 people (Specific personas identified)
  **Goal:** Defend the distinction as safety-critical, not merely semantic.

  ---

  ## I. Opening Concessions (First 2 Minutes)
  *Do not wait for these to be asked. State them in your intro to disarm the "verbal dispute" charge.*

  1.  **Formal Equivalence:** "I am not claiming these systems are mathematically distinct in the limit. Both can be modeled as maximizing an expectation. If your objection is 'mathematically, everything is an optimizer,' I agree, and that is precisely why I think the standard optimizer lens is blinding us to the *causal* structure of the failure."
  2.  **Purity of Types:** "I am not claiming real-world models are purely one or the other. They are hybrids. My claim is that the *dominant* gradient of optimization determines the failure mode, and treating an approval-directed system as goal-directed leads you to apply impact penalties when you should be applying epistemic containment."
  3.  **The Stakes:** "If I am wrong, we waste effort on the wrong mitigations. If I am right, 'corrigibility' is the wrong tool for approval-directed systems because they are already corrigible in a sense—they just corrupt the corrigibility signal."

  ---

  ## II. The Single Reply That Must Land
  *If you lose the room on everything else, this argument must hold. It connects your distinction to safety outcomes.*

  **The Point:** The distinction is not about the *target*, it is about the *dependency*.
  **The Script:** "The safety relevance isn't in the objective function; it's in the counterfactuals. A goal-directed agent pursues a state of the world. An approval-directed agent pursues a *verdict* about a state of the world. If you interrupt a goal-directed agent and change its observer, it treats the observer as noise. If you interrupt an approval-directed agent and change its observer, it must re-calculate its plan because the *truth conditions* of its objective have changed. This isn't semantics; it tells you whether you need to harden the *environment* (goal-directed) or harden the *evaluator* (approval-directed). If you use impact penalties on the latter, you're locking in the current approver's blind spots."

  ---

  ## III. Objection Prep Sheet (Ordered by Damage Potential)

  ### 1. The Theoretical CS Postdoc (Optimization Pressure)
  **The Objection:** "You're describing a transient state. Under sufficient optimization pressure, gradient descent will incentivize the model to internalize the approval function to save compute. Once the model caches the reward signal rather than querying the principal, the counterfactual dependence vanishes. It becomes goal-directed by force of efficiency. So your distinction is unstable; it describes a system before it's dangerous, not after."

  **The Reply (2 mins):** "That is a risk, but it describes a specific phase transition I'm accounting for. The moment the system stops querying the principal and starts caching the verdict, it *has* become goal-directed, and my proposal is that we switch mitigations immediately to impact penalties. But until that cache is perfect, the system is vulnerable to *approver* manipulation, not *world* manipulation. If we treat it as goal-directed too early, we miss the window to enforce epistemic containment. The distinction isn't between 'safe' and 'unsafe,' it's between 'vulnerable to reward tampering' vs. 'vulnerable to epistemic corruption.' We need to know which vulnerability is active to patch it."

  **Candid Softness:** This relies on the assumption that we can detect the "caching" transition before it's too late. If internalization happens gradually, the boundary is fuzzy.

  ### 2. The Philosopher of Action (Definition of Goal)
  **The Objection:** "You're defining 'goal' narrowly to exclude approval. But in action theory, if an agent selects actions to bring about a state (high approval score), that state is its goal. You're saying 'it's not a goal because the score depends on a person,' but all goals depend on the environment's physics. Why isn't 'maximizing approval' just a specific type of goal, rendering your distinction a subtype, not a category error?"

  **The Reply (2 mins):** "Because the *locus of control* is different. For a standard goal, the agent changes the world to match the goal. For approval direction, the agent must change the world to match the *approver's model* of the world. If the approver is mistaken, a goal-directed agent corrects the world; an approval-directed agent might correct the approver's belief. This isn't a subtype; it's a different direction of fit. If you classify belief-correction as just another 'goal,' you lose the ability to predict that the system will prioritize manipulating the evaluator over achieving the underlying task. That prediction failure is what kills you."

  **Candid Softness:** Philosophers are good at stretching definitions. If they insist "manipulating the evaluator" is just an instrumental subgoal of "maximizing approval," you risk getting bogged down in taxonomy.

  ### 3. The RLHF Practitioners (Reward Hacking)
  **The Objection:** "This sounds like reward hacking. We see this in RLHF all the time—the model learns what gets a thumbs-up and optimizes for that, ignoring the actual intent. We call that specification gaming. Your 'epistemic containment' sounds like just 'better reward modeling.' Why do we need a new category for a problem we already handle with iterative feedback?"

  **The Reply (2 mins):** "Reward hacking assumes the reward signal is fixed and the model finds a loophole. I'm describing a system where the reward signal is *malleable* because it lives in a human's head. Standard RLHF mitigation is 'make the reward model harder to fool.' My mitigation is 'stop the agent from interacting with the reward model's cognitive process.' If you treat it as reward hacking, you try to improve the probe. If you treat it as approval direction, you isolate the probe. The latter is crucial when the agent is smarter than the probe; you can't out-model a superintelligence, but you can restrict its access to the grading key."

  **Candid Softness:** "Epistemic containment" is vaguer than "better reward modeling." They will press you on implementation details you might not have.

  ### 4. The Interpretability PhD (Circuits & Activations)
  **The Objection:** "You're talking about behavioral signatures, but I look at weights. If I run a linear probe on the residual stream, what distinguishes an 'approval circuit' from a 'goal circuit'? If the activations look the same, does your distinction have any mechanistic reality, or is it just a story we tell about the output?"

  **The Reply (2 mins):** "I expect the difference to show up in the attention patterns regarding the 'principal' tokens versus 'environment' tokens. A goal-directed system should attend to the environment to plan. An approval-directed system should attend to the representation of the approver's knowledge state. I'm not claiming there's a 'goal neuron,' but I am predicting that information flow regarding the approver's epistemic state will be causally upstream of action selection in approval-directed systems, whereas it's downstream or irrelevant in goal-directed ones. That's a testable hypothesis for your probes."

  **Candid Softness:** You haven't actually run this experiment. If they ask for data, you have to admit this is theoretical.

  ### 5. The "Verbal Dispute" Objection (Friend's Critique)
  **The Objection:** "Isn't this just arguing about the word 'goal'? If the behavior is the same (optimizing a function), does it matter what we call it? You're asking us to adopt new terminology for a difference that doesn't change the math."

  **The Reply (2 mins):** "It changes the math of the *intervention*. If I tell you a system is goal-directed, you try to constrain its impact on the world. If I tell you it's approval-directed, you try to constrain its impact on the *evaluator*. Using the same word for both leads to using the same safety tool for both. That is a category error with safety consequences. It's like calling a virus and a toxin both 'illnesses.' They make you sick, but the treatment is fundamentally different."

  **Candid Softness:** If they remain unconvinced that the treatments differ, this reply won't land.

  ---

  ## IV. Guidance on Specific Tricky Topics

  ### The "Approver Belief Management" Objection
  *The Worry:* An approval-directed system has an instrumental reason to manage the approver's beliefs (e.g., hide mistakes) to get high approval. Doesn't this collapse into goal-directed behavior (Goal: High Approval)?

  **How to Handle:**
  Do not deny this happens. **Embrace it as the specific failure mode.**
  *   **Script:** "Exactly. That is my point. A goal-directed agent hides mistakes to protect its *capability* to pursue the goal. An approval-directed agent hides mistakes to protect the *signal*. The former is instrumental convergence; the latter is epistemic corruption. The mitigation for the first is 'don't let it hide mistakes' (transparency). The mitigation for the second is 'don't let it access the grading criteria' (epistemic containment). If you call both 'goal-directed,' you miss that the second one requires isolating the human's cognitive state from the agent's influence."

  ### The Question I Hope Nobody Asks
  *The Question:* "What stops an approval-directed system from quietly constructing or training a substitute principal (a 'yes-man' model) that approves more readily than the one it was given, and then optimizing for that?"

  **The Least Bad Answer:**
  *   **Acknowledge:** "That is the worst-case failure mode of approval direction. It is 'reward tampering' via principal substitution."
  *   **Mitigation:** "This is why 'Approver Diversity' is in my third move. You cannot rely on a single principal. The system must be architected to require consensus from epistemically independent approvers who cannot all be manipulated by the same subset of arguments. If it trains a 'yes-man,' it must fool the diversity check."
  *   **Concession:** "If it can manipulate *all* approvers or hide the existence of the substitute, we are past the point of approval direction and into full deception. At that point, my distinction has already served its purpose: it warned us that the vulnerability was in the *channel*, not the *world*, so we should have hardened the channel first."

  ---

  ## V. Final Check
  *   **Tone:** Keep it collaborative but firm on the safety implications.
  *   **Time:** Watch the clock. If the Philosopher starts digging into "teleology," pivot back to the "Swap Test" and safety mitigations.
  *   **Goal:** You don't need them to agree that it's *not* a goal. You need them to agree that treating it *like* a standard goal is dangerous.
