answer: |-
  **Splitting Questions**

  1.  **Coercion vs. Obstruction:** Does a credible threat constrain freedom, or only physical prevention? (Excludes Hobbesian pure physicalism).
  2.  **Robustness:** Does the *power* to interfere arbitrarily remove freedom, even if unexercised? (Excludes classical negative liberty).
  3.  **Internality:** Do ignorance or psychological incapacity remove freedom, or only external barriers? (Excludes externalist views).
  4.  **Civic Standing:** Does lacking voting rights in a non-arbitrary regime remove freedom? (Excludes non-domination-only views).

  **The Tree**

  **Root:** The Employee (legally free to resign but starves). Is she unfree?
  *   **No** → **Node 1:** The Threat (Gunman demands money). Is she unfree?
      *   **No** → **1. Hobbesian Negative** (Physical obstruction only).
      *   **Yes** → **2. Classical Negative** (Coercion counts as interference).
  *   **Yes** → **Node 2:** The Master (Kind slave, never interferes). Is she unfree?
      *   **No** → **3. Opportunity-Weighted Negative** (Economic constraint matters; power does not).
      *   **Yes** → **Node 3:** The Door (Unlocked, agent believes locked). Is she unfree?
          *   **No** → **Node 4:** The Alien (Resident, no vote, non-arbitrary law). Is she unfree?
              *   **No** → **5. Non-Domination Republican** (Freedom requires non-arbitrary power).
              *   **Yes** → **6. Civic-Status Republican** (Freedom requires political participation).
          *   **Yes** → **Node 5:** The Will (Addict wants to quit, cannot). Is this unfreedom?
              *   **No** → **7. Positive Autonomy** (Requires adequate rational options).
              *   **Yes** → **Node 6:** The Source (Internal psychology vs. Rational will).
                  *   **Psychology** → **8. Positive Self-Mastery** (Freedom is overcoming lower desires).
                  *   **Rational Will** → **9. Positive Rational Liberty** (Freedom is acting on reason).
      *   **Unoccupied Paths:**
          *   **10. Unoccupied** (Power matters, Poverty ignored): Incoherent prioritization of status over survival.
          *   **11. Unoccupied** (Internal matters, External ignored): Stoic view; politically irrelevant for seminar.
          *   **12. Unoccupied** (Civic matters, Domination ignored): Participation under tyranny is not freedom.

  **Leaf Notes**

  1.  Hobbesian Negative: Commits you to calling a threatened man free so long as he physically moves.
  2.  Classical Negative: Must deny that economic necessity constrains freedom, only direct coercion.
  3.  Opportunity-Weighted Negative: Struggles to explain why the kind slave is free despite structural dependence.
  4.  Non-Domination Republican: Must count the protected resident alien as free despite lack of voice.
  5.  Civic-Status Republican: Risks calling citizens unfree during temporary suspensions of voting rights.
  6.  Positive Autonomy: Requires state provision of options, potentially conflicting with negative liberty.
  7.  Positive Self-Mastery: Can justify forcing agents to be "free" against their immediate desires.
  8.  Positive Rational Liberty: Implies irrational agents are unfree, even without external interferers.
  9.  Unoccupied (Power/Poverty): No theorist privileges arbitrary power over material survival consistently.
  10. Unoccupied (Internal/External): Purely internal freedom ignores political oppression entirely.
  11. Unoccupied (Civic/Dom): Participating in one's own domination is not a coherent form of liberty.
