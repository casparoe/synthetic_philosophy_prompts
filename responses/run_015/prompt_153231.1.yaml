answer: |-
  This is not a verbal disagreement, nor is it a hidden factual dispute about carbon dating or treaty ratification. You have correctly identified that you both accept the same empirical realities (archives are biased, memory is cohesive). This is a **bedrock intuition clash about belonging versus accuracy**, but your friend's position relies on a critical **category error** that makes her stance intellectually unsustainable upon inspection.

  Here is the definite stand you asked for: **Mnemonic sovereignty is not a coherent alternative to historical method; it is a confused mix of sociology and epistemology.** You are closer to being right, though your friend is pointing at a real phenomenon she is misdiagnosing.

  ### The Diagnosis
  Your friend is conflating *validity* (social utility, cohesion, meaning) with *verity* (factual accuracy). She is arguing that because memory performs a vital sociological function (binding the "we"), it deserves epistemological authority (dictating what happened). This is a category error. Sociology explains how groups function; epistemology explains how we know what is true. A lie can bind a community just as effectively as a truth (perhaps more so, as you noted with propaganda), but that functional success does not grant it authority over the historical record.

  When she argues that historians are "colonizing space," she is treating history as a purely political act. When you argue that history must correct myths to prevent harm, you are treating history as an ethical obligation grounded in reality. The clash is bedrock: she prioritizes the *health of the community* (even if based on fiction), while you prioritize the *integrity of the account* (because fiction enables harm).

  ### Why Mnemonic Sovereignty Fails
  "Mnemonic sovereignty" collapses under the weight of its own implications. If a community's living memory has authority over the past simply because it binds them, there is no mechanism to distinguish between a harmless founding myth (the shipwreck) and a harmful justificatory myth (the land claim). Your friend wants to distrust the archive selectively, but without an external standard of evidence (the very thing she rejects), "selective distrust" becomes arbitrary preference.

  Your example of the land claim is the symmetry-breaker. It proves that memory cannot trump record *whenever* they conflict, because the stakes of being wrong are not just academic—they are material and ethical. If memory justifies dispossession, accuracy is not just a discipline; it is a form of justice. Your friend's framework cannot account for this without contradicting itself. She must either admit that some truths matter more than cohesion (conceding your point) or argue that dispossession is acceptable if the community believes otherwise (an ethically untenable position).

  ### Who Is Closer to Right?
  You are. Your position allows for the nuance she wants without surrendering the ground she shouldn't take. You can acknowledge that archives are biased and that memory serves a vital social function without granting memory epistemic authority. You can say, "This story is factually incorrect, but we understand why it is important to you," whereas she must say, "This story is correct because it is important." The latter is intellectually dishonest; the former is historically rigorous and socially empathetic.

  ### Is Progress Possible?
  Progress is possible, but only if you stop arguing about *evidence* and start arguing about *genres*. You are talking past each other because you are using the word "history" to mean two different things.
  1.  **History as Discipline:** A critical inquiry into what happened, constrained by evidence.
  2.  **Memory as Practice:** A communal ritual about who we are, constrained by identity needs.

  Progress happens when you agree that Memory does not have to be History to be valuable. A community can keep its shipwreck myth as a sacred story (Memory) while accepting the carbon dating in the school curriculum (History). The conflict arises only when Memory demands the power to overwrite History in the public record. If you can convince her that respecting memory doesn't require validating its facts, you might move the needle. However, if her commitment to "mnemonic sovereignty" is truly bedrock—that utility *equals* truth—then no progress is possible, because you are operating in different universes of discourse.

  \answer{Bedrock intuition clash masked by category error}
