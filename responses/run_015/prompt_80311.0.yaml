  ### Decision Theorist's Working Notes: Framing the Objective

  Before drafting the memo, we need to explicitly reject the false dichotomy between "Maximize Growth" (Kelly) and "Maximize Safety" (Fixed Fraction). Here is the breakdown of the objective functions at play:

  1.  **Maximize Expected Log Wealth (Geometric Growth):** This is the standard Kelly objective. It is *ergodic*—it maximizes the time-average growth rate.
      *   *Pros:* Mathematically proven to outperform any other strategy in the infinite long run. Avoids certain ruin (0 wealth) if bets are independent.
      *   *Cons for us:* Assumes infinite horizon (we have 3 years). Assumes known probabilities (we have model error). Crucially, it ignores *path dependence*. You can have positive geometric growth but still hit a -40% drawdown mid-path and get shut down. Kelly optimizes the destination, not the journey.

  2.  **Maximize Expected Terminal Wealth (Arithmetic EV):**
      *   *Pros:* Maximizes the average outcome across all possible worlds.
      *   *Cons for us:* Implies betting the entire bankroll on any positive EV bet. One loss sequence destroys the fund. Violates the university's 60% floor constraint immediately.

  3.  **Maximize Probability of Success (Goal-Reaching with Barrier):**
      *   *Definition:* Maximize $P(\text{Terminal Wealth} > \text{Target} \cap \text{Min Wealth} > 0.6 \times \text{Start})$.
      *   *Pros:* Aligns with actual incentives (keeping the fund alive + hitting performance targets).
      *   *Cons:* Harder to calculate analytically. Requires simulation or heuristics.
      *   *Resolution:* **Fractional Kelly** is the robust heuristic here. Mathematically, betting a fraction $f$ of Kelly is equivalent to optimizing log-utility with a constraint on volatility or parameter uncertainty. Half-Kelly reduces variance by 75% while sacrificing only 25% of expected growth. This creates the "buffer" needed to respect the 60% floor given our finite horizon.

  **Recommendation Strategy:** Adopt a "Constrained Fractional Kelly" policy. This validates Camp 1's insight (size should scale with edge) but incorporates Camp 2's caution (parameter uncertainty + hard floor).

  ***

  ### MEMORANDUM

  **TO:** Investment Committee, Student Managed Fund
  **FROM:** [Your Name], Position Sizing Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Official Position-Sizing Policy (FY24-FY27)

  #### 1. Executive Summary

  This memo proposes the adoption of a **Constrained Fractional Kelly** position-sizing policy. Specifically, we recommend sizing positions at **50% of the theoretical Kelly fraction**, subject to a **5% hard cap per trade** and a **mandatory de-risking protocol** if fund NAV approaches 70% of the annual starting value.

  This policy balances the growth efficiency advocated by the Kelly criterion with the necessary safety margins required by our finite 3-year horizon, model uncertainty, and the University's hard 40% drawdown limit. We recommend an immediate vote to adopt this policy for the current cohort's tenure, with a mandatory review at the end of each fiscal year.

  #### 2. Context and Constraints

  Our operating environment differs significantly from the theoretical conditions often assumed in standard finance literature. We must optimize under three specific constraints:

  1.  **Finite Horizon:** The fund is liquidated/handed off in 3–4 years. We do not have an "infinite long run" to recover from volatility drag.
  2.  **Absorbing Barrier:** The University mandates a shutdown if the fund drops below 60% of its starting annual value. This is not a soft drawdown limit; it is a "game over" state.
  3.  **Parameter Uncertainty:** Our edge estimates (e.g., "55% win probability") are model outputs, not known truths. Overestimating edge is the primary cause of ruin in Kelly betting.

  #### 3. Evaluating the Competing Proposals

  The committee is currently divided between two positions. As a decision theorist, I want to clarify where each argument is correct and where it fails given our specific constraints.

  **Camp 1: The Case for Full Kelly**
  *The Argument:* The Kelly criterion is provably optimal for maximizing long-run geometric growth. Any other strategy will eventually underperform it in terms of wealth ratio. To bet less is to leave expected growth on the table; to bet more is to invite ruin.
  *Where it is Right:* They are mathematically correct that Kelly maximizes the *asymptotic* growth rate. If we were trading forever with perfect knowledge of our edge, Full Kelly would be the only rational choice.
  *Where it Breaks Down:*
  *   **The Horizon Problem:** Kelly's optimality holds in the limit ($t \to \infty$). In a 3-year window, the variance of outcomes is high. Full Kelly paths are volatile; there is a significant probability that a Full Kelly strategy dips below our 60% floor *before* the compounding magic kicks in.
  *   **The Knowledge Problem:** Kelly assumes you know your edge ($p$) precisely. If we calculate a Kelly fraction based on a 55% win rate, but our true win rate is 52%, Full Kelly becomes *negative* growth betting. We are overbetting relative to reality.
  *   **The Barrier Problem:** Kelly optimizes for final wealth, not path stability. It does not account for an absorbing barrier at -40%. A strategy that ends up +100% but dips -50% in year 2 is a failure for us.

  **Camp 2: The Case for Fixed Fraction (e.g., 5%)**
  *The Argument:* We don't know our true edge, and we have a hard stop-loss. We should bet a small, fixed amount to ensure survival.
  *Where it is Right:* They correctly identify that parameter uncertainty and the drawdown floor are the primary risks to the fund's existence.
  *Where it Breaks Down:* Fixed fraction sizing ignores signal quality. If we have a high-conviction statistical arbitrage opportunity with a verified edge, betting the same size as a low-conviction macro hunch is inefficient. It caps our upside unnecessarily when the odds are heavily in our favor.

  #### 4. Proposed Policy: Constrained Fractional Kelly

  To reconcile these views, we propose a policy that scales with edge (respecting Camp 1) but applies a heavy discount for uncertainty and path risk (respecting Camp 2).

  **A. Sizing Rule: Half-Kelly**
  For every trade, calculate the theoretical Kelly fraction ($f^*$) based on our model's estimated edge. Execute the trade at **$0.5 \times f^*$**.
  *   *Reasoning:* Betting half-Kelly reduces the variance of the portfolio by 75% while sacrificing only 25% of the expected geometric growth rate. This creates a "volatility buffer" that significantly lowers the probability of breaching the 60% floor during our finite 3-year horizon. It also mathematically accounts for parameter uncertainty; if our edge estimates are noisy, Half-Kelly is often closer to the *true* optimal size than Full Kelly.

  **B. Hard Cap: 5% of NAV**
  No single position may exceed 5% of the fund's Net Asset Value at the time of entry, regardless of the Kelly calculation.
  *   *Reasoning:* This prevents concentration risk from model failure. Even if the model suggests a 20% Kelly bet on a single idea, idiosyncratic risk (e.g., a black swan event specific to that asset) could invalidate the edge instantly.

  **C. Drawdown De-Risking Protocol**
  If the Fund's NAV drops to **70%** of the fiscal year's starting value (i.e., we are 10% away from the University's shutdown line):
  1.  All position sizing calculations must immediately switch to **Quarter-Kelly (0.25 $\times$ $f^*$ )**.
  2.  No new positions exceeding 2% of NAV may be opened.
  3.  The Committee must convene an emergency review to assess if the model edge has degraded.
  *   *Reasoning:* As we approach the absorbing barrier, the marginal utility of capital preservation exceeds the marginal utility of growth. We must dynamically reduce risk to ensure we do not accidentally breach the 60% hard floor due to normal volatility.

  #### 5. Implementation and Review Timeline

  *   **Effective Date:** Immediate upon vote approval.
  *   **Quarterly Review:** The Risk Officer will report the "Implied Kelly Fraction" of the portfolio to ensure we are not drifting into over-leverage due to asset price changes.
  *   **Annual Review:** At the end of each fiscal year, the Committee will re-evaluate the "Half-Kelly" multiplier. If the fund has consistently hit the 70% warning zone, the multiplier may be voted down to 0.33x. If the fund is significantly ahead of target with low volatility, the Committee may vote to increase to 0.75x (but never Full Kelly).
  *   **Horizon Adjustment:** In the final 6 months of our cohort's tenure, the policy automatically shifts to **Capital Preservation Mode**. Sizing is capped at 2% per trade regardless of edge, prioritizing the handoff value over aggressive growth.

  #### 6. Conclusion

  The debate between "Growth" and "Safety" is a false dichotomy. The rational objective for this fund is neither maximizing abstract growth rates nor minimizing activity, but **maximizing the probability of a successful handoff**.

  Full Kelly ignores the risk of ruin inherent in our finite timeline and uncertain models. Fixed fractional betting ignores the value of our edge. **Constrained Fractional Kelly** captures the upside of our research while respecting the University's constraints. It acknowledges that while Kelly is theoretically optimal for the long run, *survival* is optimal for the short run.

  **Motion:** To adopt the Constrained Fractional Kelly policy (50% Kelly, 5% Cap, 70% De-risk Trigger) as the official position-sizing framework for the Student Managed Fund.

  ***

  **Attachments:**
  *   *Appendix A: Simulation of Full Kelly vs. Half-Kelly under 40% Drawdown Constraint (3-Year Horizon)*
  *   *Appendix B: Calculation Methodology for Estimated Edge*
