answer: |-
  Moral Foundations Theory cannot adjudicate political truth, but it does something more practically useful: it distinguishes between disagreements that are solvable by argument and those that require negotiation. Your mate's error is category confusion; he treats a descriptive map of moral psychology as a normative scoreboard, assuming that possessing a wider range of moral intuitions grants one greater authority over political truth. If we grant the empirical picture—that conservatives tend to score higher on loyalty, authority, and sanctity while liberals concentrate on care and fairness—the proper philosophical uptake is not that conservatives are morally superior, but that the landscape of disagreement is heterogenous. Where both sides appeal to fairness but disagree on whether it entails equality or proportionality, they share a foundational premise and are having a conceptual or empirical dispute; here, evidence and logic can suffice, and one side may indeed be shown to be wrong. However, where one side invokes sanctity and the other feels nothing, there is no shared premise from which to reason; you cannot logically derive a feeling of disgust from a principle of care, so continued argumentation is futile. In these cases, the theory tells us to stop trying to convert the opponent and start designing institutions that accommodate divergent moral matrices through bargaining and modus vivendi.

  The first objection, that claiming someone does not register a foundation is itself a moral judgement smuggled in as psychology, conflates affective response with normative validity. To say a liberal does not feel a violation of sanctity when a flag is burned is to make a claim about their sentimental repertoire, akin to noting they do not enjoy spicy food, not a claim that their lack of feeling is justified or unjustified. Moral Foundations Theory operates at the level of moral sentiments—the intuitive dogs that wag the rational tails—not at the level of justified belief. Therefore, identifying a missing foundation is an empirical diagnosis within the theory's framework, not a condemnation; it merely notes that a particular lever of moral motivation is disconnected. We are not saying the liberal *ought* not to feel the sentiment, only that they *do* not, which is a factual claim about their psychology rather than a moral claim about their character.

  The second objection, that the liberal is morally blind like a colour-blind person and should therefore be corrected rather than accommodated, fails because it presupposes a robust moral realism that the theory itself undermines. Visual colour perception tracks mind-independent wavelengths of light, so colour-blindness is a functional deficit in perceiving objective physical reality; moral foundations, however, track evolved social adaptive challenges, not mind-independent moral facts waiting to be discovered. If morality is constructed from these intuitions, as Haidt suggests, then lacking an intuition is not failing to see a truth, but lacking a specific component of the construction material. Furthermore, even if we grant the analogy, your mate's conclusion does not follow: we do not tyrannise the colour-blind, we accommodate them by designing traffic lights with positional cues as well as colour. In a pluralistic society, if a significant portion of the population lacks the 'sanctity' receptor, imposing sanctity-based laws upon them is not correcting a defect but imposing a specific moral taste as law. The lesson of the psychology is thus procedural: it tells us which fights are worth having as arguments and which are merely clashes of constitution that must be managed politically.
