answer: |-
  Here is the principle that unifies your verdicts, followed by the predictions and the honesty check you requested.

  ### The Principle: Non-Pragmatic Determinism

  **Definition:** Infer cognitive beliefs or social institutions from material culture only when the observed pattern demonstrates a constraint that **cannot be explained by physical utility, biological capacity, or low-cost aesthetic diffusion.**

  **Precise Clauses:**
  1.  **The Costly Constraint Clause:** Accept a belief/institution interpretation if the pattern imposes an energy cost, spatial restriction, or destruction of utility that yields no survival or logistical benefit.
      *   *Motivated by:* **Case 1** (Burial orientation restricts placement for no preservation benefit), **Case 4** (Bending swords destroys utility), and **Case 6** (Arranging waste requires labor with no cleaning benefit).
  2.  **The Category Override Clause:** Accept a belief/institution interpretation if the material culture assigns a functional social role to an agent biologically or practically incapable of fulfilling it.
      *   *Motivated by:* **Case 3** (A child cannot be a full craft specialist; the tools enforce a social identity over biological reality).
  3.  **The Pragmatic Exclusion Clause:** Reject a belief/institution interpretation if the pattern optimizes logistics, storage, trade, or arises from low-cost copying networks.
      *   *Motivated by:* **Case 2** (Uniform bins optimize storage/trade) and **Case 5** (Geometric motifs are low-cost to copy and serve aesthetic/social signaling without requiring doctrinal enforcement).

  ---

  ### Prediction for Case 7 (The Tablets)
  **Verdict:** **Yes** (Institutional spread confirmed).

  **Reasoning:** Under the **Costly Constraint Clause**, literacy and tablet production are high-energy investments with no direct survival benefit for a rural farmer (unlike grain bins). The presence of the tablets in a rural site is a "surplus constraint." The copying errors do not negate the institution; rather, they confirm the **Category Override**. The rural users are attempting to fulfill an administrative role they haven't fully mastered, proving the *reach* of the institution even if the *depth* of internalization is shallow. The errors are evidence of the strain of the constraint, not evidence against its existence.

  ---

  ### Prediction for New Case 8
  **Case:** A cemetery where every skeleton is buried holding a specific species of non-local shell in their mouth, regardless of age, sex, or status, but the shells show no signs of being worked into jewelry.
  **Verdict:** **Yes** (Cosmological belief).

  **Reasoning:** This triggers the **Costly Constraint Clause**. Acquiring non-local shells costs energy. Placing them in the mouth offers no preservation benefit (unlike ochre on skin, which might preserve, though even that is debated) and they are not jewelry (no utility). It is a pure rule-following behavior with no pragmatic payoff, identical in logic to your Case 1 (volcanic peak orientation).

  ---

  ### The Honesty Check: Which Verdict to Drop?

  To make this principle robust against archaeological peer review, you should drop or significantly modify your verdict on **Case 5**.

  **Why Case 5 is the weak link:**
  Your principle relies on distinguishing "low-cost diffusion" from "ideological enforcement." However, in real-world archaeology, the **unity of symbol across sacred and profane contexts** (Temple + Cooking Pot) is one of the strongest indicators of a hegemonic institution or state religion (e.g., the Inka *tocapu* motifs, Christian crosses, or Islamic geometric aniconism).

  By classifying Case 5 as "just decorative," you are assuming that "decoration" is never "doctrine." But often, the *permission* to use a motif on a cooking pot is itself an institutional rule. If you keep Case 5 as a "No," your principle risks under-interpreting ideology.

  **How to fix it:**
  Modify the **Pragmatic Exclusion Clause** to specify: *"Reject if the pattern is aesthetically variable or technically simple."*
  If the geometric motif is complex and standardized (high fidelity), Case 5 should actually be a **Yes**. If it's simple (like a zig-zag anyone can scratch), your "No" holds. If you want a cleaner principle, assume **High-Fidelity Cross-Context Symbolism = Institution.**

  **Secondary Warning (Case 2):**
  Be careful with Case 2. While your intuition (logistics) is sound, standardization of storage is frequently used as primary evidence for taxation/redistribution (e.g., Indus Valley or Inca). Your principle saves this by prioritizing "optimization" over "control," but be aware that in practice, logistics *are* the institution.
