      *   *Key Philosophical Concepts:* Material constitution, identity conditions, persistence over time, essential properties.

  3.  **Translate to Additive Manufacturing (AM) Vocabulary:**
      *   *The Clay:* The raw material feedstock (filament, resin, powder). Let's call it the "Feedstock Volume."
      *   *The Statue:* The Printed Part (the physical instantiation).
      *   *The Design:* The CAD file / Digital Twin. This adds a layer the original analogy doesn't have, which is crucial for the "tech" angle.
