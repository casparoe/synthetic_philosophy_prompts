      *   *Statue* -> The Functional Part (the geometry + intent).
      *   *Squashing* -> Destructive Deformation (exceeding yield strength).
      *   *Survival* -> Mass conservation vs. Geometric failure.
      *   *Rebuild* -> Re-slicing and printing a new part from the source file.

  5.  **Developing the "Residue Report":**
      *   *Clean Maps:* Conservation of mass (clay survives = polymer survives). Functional failure (statue destroyed = part out of tolerance). The ability to replicate (rebuild).
      *   *Distortions:* The original analogy assumes a continuous lump. AM is layered (anisotropic). The "identity" in AM is often tied to the *file*, not just the shape.
      *   *The Leftover:* The "Intent" or "Function." In philosophy, the statue has an aesthetic/historical identity. In AM, the part has a *specification*. But is there something more? The "This-ness" (Haecceity). A printed part has a serial number, a build history (thermal logs). The philosophical puzzle asks about *objecthood*. Engineering asks about *spec compliance*.

