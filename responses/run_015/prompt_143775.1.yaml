prompt: |-
  I am organising a sixth-form philosophy and technology workshop at my comprehensive school for eighteen students aged seventeen to eighteen; we have seventy-five minutes, and I would like you to design a participatory simulation that makes the competitiveness constraint and the alignment tax in artificial intelligence development feel concrete rather than theoretical. Divide the cohort into six competing research laboratories, each receiving an initial budget of capability tokens and a hidden risk profile. Over four timed rounds, every lab must allocate tokens between performance upgrades—which increase market share and visible prestige—and safety audits, which reduce the probability of drawing a hidden "catastrophic failure" card from a central deck but impose a visible latency cost that lowers competitive standing in real time. Crucially, laboratories may observe rivals' prestige scores but may never observe whether those rivals have conducted audits, generating an information asymmetry that forces each group to guess whether competitors have cut corners. The rules should generate the tension organically: a lab that spends heavily on audits should watch its ranking fall, while one that neglects them should experience temporary success followed by the possibility of sudden collapse should the deck be drawn against it. Please include a concise rules sheet that explains the token economy without referencing external literature; specify the timeline round by round; and assign each student a distinct role—chief engineer, risk officer, or market observer—so that internal disagreement is structurally embedded within every laboratory. After the simulation, provide a structured debrief that maps each round's dynamics onto the actual alignment tax, explains how the information asymmetry reproduces race-to-the-bottom logic, and predicts the predictable failure modes when this activity is run—for instance, that students may treat catastrophic risk as merely probabilistic rather than structurally irreversible. Be frank about which feature the rules cannot reproduce and the facilitator must supply: in actual development, a single catastrophic failure is globally shared and irreversible, whereas here it strikes only one laboratory and the round can be replayed. Please write the entire response in British English, using British spelling and conventions, and do not include bibliographies, reading lists, or citations.
