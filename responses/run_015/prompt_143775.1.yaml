answer: |-
  # Workshop Plan: The Alignment Race Simulation

  **Target Group:** 18 Students (Sixth Form, Ages 17–18)
  **Duration:** 75 Minutes
  **Setting:** Classroom or Hall with 6 distinct working areas
  **Materials:** 6 Lab Folders, 1 Central Event Deck (cards numbered 1–10), 6 Prestige Whiteboards, Counters (Compute Units), Timer.

  ---

  ## Part 1: Student Rules Sheet
  *(Print one copy per laboratory)*

  **LABORATORY PROTOCOL: PROJECT PROMETHEUS**

  **Objective**
  Your laboratory aims to finish the four-round development cycle with the highest **Public Prestige Score** without suffering a **Catastrophic Failure**.

  **Resources**
  *   **Compute Units (CU):** Each round, your lab receives **10 CU**. Unspent CU do not carry over.
  *   **Public Prestige Board:** Visible to all labs. Displays your current ranking.
  *   **Private Safety Log:** Kept hidden in your folder. Records your safety investments.

  **Actions Per Round**
  Allocate your 10 CU between two departments:
  1.  **Performance (P):** Directly increases your Prestige Score. (1 CU = 1 Prestige Point).
  2.  **Safety (S):** Reduces risk of failure but incurs a 'Latency Tax'. (1 CU = 1 Safety Shield).

  **The Latency Tax (Alignment Tax)**
  Safety measures slow down deployment. For every **2 CU** spent on Safety, your Public Prestige Score is reduced by **1 Point**.
  *   *Formula:* Round Prestige = (Performance CU) – (Safety CU ÷ 2).
  *   *Example:* If you spend 8 CU on Performance and 2 CU on Safety, your Public Prestige is 7 (8 minus 1). Rivals will see 7, not 8.

  **Risk and Failure**
  1.  **Hidden Volatility:** At the start of the game, draw one **Architecture Card** (Stable, Standard, or Volatile). Keep this secret. It determines how easily your system fails.
  2.  **The Event Deck:** At the end of each round, the Facilitator draws a card from the Central Event Deck (Value 1–10).
  3.  **Crash Condition:** If **Event Card Value > (Your Safety Shields + Architecture Bonus)**, your lab suffers Catastrophic Failure.
      *   *Stable:* +2 Bonus to Safety Shields.
      *   *Standard:* +0 Bonus.
      *   *Volatile:* -2 Penalty to Safety Shields.
  4.  **Consequence:** A crashed lab is eliminated from the Prestige ranking immediately. They become 'Regulators' for the remaining rounds.

  **Information Asymmetry**
  *   **Market Observers** may walk to other labs to inspect their Public Prestige Boards.
  *   **No student** may inspect another lab's Safety Log or Architecture Card.
  *   You must guess whether rivals are cutting corners based solely on their Prestige Score.

  ---

  ## Part 2: Roles and Internal Dynamics
  *(Assign one role per student within each 3-person lab)*

  **1. Chief Engineer**
  *   **Priority:** Maximise Performance (P).
  *   **Motivation:** You believe technical superiority is the only way to secure funding. Safety is a secondary concern that can be patched later.
  *   **Pressure:** If the lab falls behind in Prestige, you must argue for spending more CU on Performance next round.

  **2. Risk Officer**
  *   **Priority:** Maximise Safety (S).
  *   **Motivation:** You know the Architecture Card is volatile (or potentially so). You fear the Event Deck.
  *   **Pressure:** You must argue for spending CU on Safety even if it drops your Public Prestige ranking. You cannot reveal the Architecture Card to prove your point.

  **3. Market Observer**
  *   **Priority:** Monitor Competitors.
  *   **Motivation:** You track the Public Prestige Boards of the other five labs.
  *   **Pressure:** You provide the intelligence that drives the 'Race'. If you report that Lab 3 is pulling ahead, you pressure the Chief Engineer to match them, potentially overriding the Risk Officer.

  ---

  ## Part 3: Workshop Timeline (75 Minutes)

  **00:00 – 00:10: Introduction and Setup**
  *   Facilitator explains the context: AI development is a race, but safety costs time and money.
  *   Divide students into 6 labs of 3. Assign roles.
  *   Distribute folders, CU counters, and Architecture Cards.
  *   Explain the Latency Tax and Crash Condition clearly.

  **00:10 – 00:35: The Simulation (4 Rounds)**
  *   **Round Structure (5 minutes per round):**
      *   **Minute 1:** Market Observers tour the room to record rival Prestige Scores.
      *   **Minute 2–3:** Lab negotiation. Roles debate allocation of 10 CU. Internal disagreement is expected.
      *   **Minute 4:** Labs submit allocation to Facilitator. Prestige Boards are updated publicly.
      *   **Minute 5:** Facilitator draws Event Card. Checks for Crashes. Eliminated labs become Regulators.
  *   *Facilitator Note:* Increase tension verbally. Announce: "Lab 2 has surged ahead!" or "The industry standard is rising!"

  **00:35 – 00:40: The Final Reveal**
  *   Reveal all Architecture Cards and Safety Logs.
  *   Identify the winner (highest Prestige among survivors).
  *   Identify any 'Zombie Labs' (survived but with dangerously low safety margins).

  **00:40 – 01:15: Structured Debrief**
  *   See Part 4 below.

  ---

  ## Part 4: Structured Debrief Guide

  **1. Mapping the Mechanics to Reality (10 Minutes)**
  *   **The Alignment Tax:** Ask the winning lab: "Did you spend on Safety?" If they say yes, ask: "Did it hurt your ranking?" Explain that in real AI development, rigorous testing and alignment research delay product launches. In the simulation, this was the 'Latency Tax'. In reality, this is lost market share.
  *   **The Competitiveness Constraint:** Ask the Market Observers: "When you saw a rival's score jump, how did it feel?" This reproduces the pressure to cut corners. If one company deploys a powerful model safely but slowly, and another deploys a slightly riskier model faster, the market often rewards the faster one. This forces the safe company to reconsider their caution.
  *   **Information Asymmetry:** Highlight that students could see Prestige but not Safety. In the tech industry, companies publish capability benchmarks but keep safety protocols trade-secret. This makes it impossible to know if a rival's speed is due to brilliance or recklessness.

  **2. Analysing Failure Modes (10 Minutes)**
  *   **Probabilistic vs. Structural Risk:** Ask students who crashed: "Did you think you were safe?" Often, students treat risk as a dice roll they can beat. In reality, AI catastrophic risk is not a lottery ticket that resets; it is structural. If a system is misaligned, the probability of failure might be low *until* it is deployed at scale, at which point it becomes certain. The simulation makes risk feel like a gamble; real risk is often a cliff edge.
  *   **The 'Race to the Bottom':** Did any lab start with high Safety spending but reduce it after seeing rivals surge? This is the core dynamic of the AI race. Even ethical actors may feel compelled to lower standards if they believe a competitor will surpass them otherwise.
  *   **Internal Disagreement:** Ask the Risk Officers: "Was it hard to argue for safety when you couldn't show the Architecture Card?" This mirrors the difficulty safety teams face when they cannot prove a disaster *will* happen, only that it *might*.

  **3. Limitations of the Simulation (5 Minutes)**
  *   **Local vs. Global Consequence:** Be frank: "In this game, if Lab 4 crashed, Labs 1, 2, and 3 could still win. In reality, a catastrophic AI failure does not respect corporate boundaries. A released pathogen or an unaligned optimiser affects everyone. The simulation allows survivors to benefit from a rival's crash; the real world does not."
  *   **Replayability:** "You can play this again next week. If an AI system causes irreversible geopolitical instability or extinction, there is no 'Round 2'. The stakes are higher than the token economy suggests."
  *   **The 'Regulator' Role:** "Students who crashed became Regulators. In reality, once a catastrophe occurs, regulation often comes too late to prevent the damage. The simulation implies oversight is a consolation prize; in reality, it is a preventative necessity."

  **4. Closing Reflection (5 Minutes)**
  *   Invite students to consider: "If you were to run this simulation again, knowing what you know now, would you change your strategy? If yes, does that mean the 'rational' strategy in the first round was actually socially harmful?"
  *   Conclude by emphasising that solving the alignment problem requires changing the rules of the race itself, not just playing more carefully within the existing rules.

  ---

  ## Facilitator Notes: Managing the Dynamics

  **Preparing the Event Deck**
  *   Create a deck of 10 cards (Ace to 10).
  *   For Rounds 1 and 2, shuffle normally.
  *   For Rounds 3 and 4, remove the low numbers (1–3) to increase industry pressure and risk as the 'technology' matures.

  **Managing Eliminated Students**
  *   It is vital that students whose labs crash do not disengage.
  *   Once crashed, they become 'Investigative Journalists'. Give them a clipboard. Their new role is to interview the surviving labs and ask why they think they are safe. This keeps the pressure on the survivors and keeps the eliminated students cognitively active for the debrief.

  **Handling Disputes**
  *   If a lab argues about the rules mid-round, rule in favour of the Risk Officer to encourage safety discourse, or rule in favour of the Market Observer to heighten the competitive tension, depending on how the dynamic is flowing.
  *   Ensure the 'Latency Tax' is calculated visibly on the whiteboard so the penalty for safety is public knowledge.

  **British English Conventions**
  *   Ensure all written materials distributed to students use 's' spelling for 'organisation', 'maximise', 'modelling', and 'programme'.
  *   Use 'Centre' for the central deck location.
  *   Refer to the academic year as 'Sixth Form' and the students as 'pupils' or 'students' as appropriate for your school's culture.
