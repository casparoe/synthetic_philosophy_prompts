      *   **Context:** Mid-size SaaS, weekly reviews (3-4 updates, 30 mins each), reviewers are product engineers (not philosophers), stakes are medium (data leaks, trust loss, weird behavior).
      *   **Requirements:**
          *   Brainstorm 4-5 ways the distinction gets messy in practice *before* finalizing the procedure.
          *   Create a reusable decision procedure (questions, evidence standards, stop rules, escalation points).
