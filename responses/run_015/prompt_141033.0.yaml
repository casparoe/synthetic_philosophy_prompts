  ### The Principle: Weighted Epistemic Utility (WEU)

  There is a single principle that accommodates six of your seven intuitions and explains the seventh, though it requires a mathematical correction on Case 4. I call it the **Weighted Epistemic Utility Principle**.

  **The Principle:**
  > *Aggregate judgments to maximize expected utility. If the domain is **factual**, weight each voter by the log-odds of their competence ($\ln \frac{p}{1-p}$), discounting for correlation. If the domain is **axiological** (values/preferences), weight by stake or representation. Set the decision threshold based on the relative cost of errors.*

  Here is how the clauses map to your cases:

  1.  **Domain Distinction (Fact vs. Value):** This handles **Case 7**. In zoning, there is no "truth" to track, only preferences to aggregate. The principle switches from epistemic weighting to democratic weighting, which is why shared bias doesn't bother you there (it's not a bias, it's a shared preference) but does in Case 3.
  2.  **Competence Weighting:** This handles **Case 5**. Plain headcount fails when competence varies. A 95% juror provides exponentially more signal ($\ln \frac{0.95}{0.05} \approx 2.94$) than a 51% juror ($\ln \frac{0.51}{0.49} \approx 0.04$). Your intuition that the nine experts shouldn't be drowned out is mathematically sound under weighting, even if standard Condorcet (headcount) says otherwise.
  3.  **Independence Discount:** This handles **Case 3**. Correlated errors do not add new information. If 1,001 people share a source, their effective $N$ is close to 1. The principle discounts their weight to reflect the *effective* sample size, validating your preference for three independent sources.
  4.  **Inversion Rule:** This handles **Case 6**. If $p < 0.5$, the log-odds are negative. The principle dictates you should invert their vote, which aligns with your intuition to defer to the minority (or rather, treat the majority as a reliable indicator of falsehood).
  5.  **Cost Threshold:** This handles the nuance in **Case 4** and your final jury problem. When errors are costly, a bare majority is insufficient. You need a supermajority proportional to the cost ratio.

  ### The Verdict That Must Go: Case 4

  I must be honest: **Case 4 is the outlier where your gut fights the math.**

  Strictly speaking, if you *know* the 1,000 people are 50.1% accurate and independent, they are vastly superior to 20 people at 70%. The probability of the large group being wrong is roughly $10^{-9}$; the small group is roughly $10^{-2}$. The "jump" in Case 2 applies here too.

  Your hesitation in Case 4 is likely driven by **parameter uncertainty**. In the real world, we never *know* $p=50.1\%$. If that estimate is off by a hair (e.g., $p=49.9\%$), the large group becomes reliably wrong. The small group is robust to estimation error. The WEU principle accommodates this if you add a "Confidence Clause" (discount weights when $p$ is uncertain), but under known parameters, your intuition in Case 4 is the one that must yield.

  ### A Surprise Case: The "Ignorant Abstention"

  Here is a case you didn't list where the principle yields a surprising result:

  **The Case:** A group of 100 voters is asked a factual question. 50 of them are 60% competent. The other 50 admit they know nothing and are guessing (50% competent).
  **Standard Intuition:** Let everyone vote; the guessers won't hurt the average much, and democracy suggests inclusion.
  **WEU Principle:** The 50 guessers have a weight of $\ln \frac{0.5}{0.5} = 0$. They add noise (variance) without adding signal. The principle dictates they should **abstain**. Including them dilutes the reliability of the competent voters by increasing the variance of the count without shifting the mean. Epistemically, the right to vote is earned by competence; the indifferent should not vote.

  ### Application: The Twelve-Person Jury

  Now, let's apply the WEU principle to your toggle case: 12 jurors, 60% accuracy, where convicting an innocent person is 10 times worse than acquitting a guilty one.

  **1. Where should the conviction threshold sit?**
  We calculate the threshold using Bayes' Factor and the cost ratio.
  *   **Cost Ratio:** 10:1. We need 10:1 posterior odds of guilt to convict.
  *   **Prior Odds:** Assuming the trial starts with a presumption of innocence (often modeled as 1:1 for the sake of the evidence threshold, or lower; we will use 1:1 to isolate the jury's contribution).
  *   **Juror Weight:** Each "Guilty" vote contributes $\ln(\frac{0.6}{0.4}) \approx 0.405$ log-odds. Each "Not Guilty" vote subtracts 0.405.
  *   **Required Evidence:** $\ln(10) \approx 2.30$ log-odds.
  *   **Calculation:** Let $k$ be the number of guilty votes. The net score is $(k - (12-k)) \times 0.405 = (2k - 12) \times 0.405$.
      We need $(2k - 12) \times 0.405 \ge 2.30$.
      $2k - 12 \ge 5.68$
      $2k \ge 17.68$
      $k \ge 8.84$

  **Verdict:** The threshold should be **9 out of 12 votes**. A simple majority (7) is too risky given the cost asymmetry; unanimity (12) is unnecessarily strict given the jurors' moderate competence.

  **2. Add 12 jurors (60%) or improve the 12 (70%)?**
  You have a fixed budget. Option A is $N=24, p=0.6$. Option B is $N=12, p=0.7$.
  To decide, we look at the **Kullback-Leibler (KL) Divergence**, which measures how much information a vote provides to distinguish Guilty from Innocent.

  *   **Option A (Quantity):** Information per juror at $p=0.6$ is low. Total Information $\approx 24 \times 0.020 = 0.48$.
  *   **Option B (Quality):** Information per juror at $p=0.7$ is significantly higher. Total Information $\approx 12 \times 0.082 = 0.98$.

  **Verdict:** **Spend the money to improve the quality.**
  Doubling the number of mediocre jurors does not match the epistemic power of making the original jurors good. At 60%, jurors are quite noisy; adding more noise averages out, but slowly. Moving to 70% drastically sharpens the signal. In high-stakes decisions where error costs are asymmetric (like jail time), quality dominates quantity.

  ### Summary
  Your tentative principle was close, but it needed to move from "headcount" to "weightcount." By adopting the **Weighted Epistemic Utility Principle**, you preserve your insights on independence, values, and competence hierarchies. You only need to correct your intuition on Case 4: trust the math on large numbers, but remain skeptical of your ability to *measure* competence that close to chance.
