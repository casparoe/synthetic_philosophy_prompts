      Juror Log Odds (p=0.6) = ln(0.6/0.4) = 0.4055.
      Votes needed (net) = 2.302 / 0.4055 = 5.67.
      Net votes = (Guilty - Innocent).
      Total votes = 12.
      G - I = 5.67
      G + I = 12
      2G = 17.67 -> G = 8.83.
      So 9 votes. Correct.

      *Quantity vs Quality Check:*
      Option A: 24 jurors, p=0.6. Net vote threshold = 2.302 / 0.4055 = 5.67.
      Wait, the threshold in *votes* changes with N.
      Threshold Net Votes = 5.67 (constant required evidence).
      Option A Mean Net Vote (if Guilty) = 24 * (0.6 - 0.4) = 4.8.
      Option B Mean Net Vote (if Guilty) = 12 * (0.7 - 0.3) = 4.8.
      *Wait.* The Expected Net Vote is the same!
      $N \times (2p - 1)$.
      Option A: $24 \times 0.2 = 4.8$.
      Option B: $12 \times 0.4 = 4.8$.
      So the *Expected* evidence is identical.
      However, the *Variance* differs.
      Variance of Net Vote for one juror = $4p(1-p)$.
      Option A Total Var = $24 \times 4(0.24) = 23.04$. SD = 4.8.
      Option B Total Var = $12 \times 4(0.21) = 10.08$. SD = 3.17.
      Option B has lower variance.
      Since the Mean (4.8) is below the Required Threshold (5.67), both are likely to fail to convict a guilty person (Type II error).
      But we want to minimize Expected Loss.
      Since Option B has lower variance, its distribution is tighter around 4.8. Option A is wider.
      Since 4.8 < 5.67, the bulk of the mass is below the threshold (Acquittal).
      A wider distribution (Option A) puts *more* mass into the tail above 5.67 (Conviction) but also more mass into the far tail of Innocent Conviction.
      Actually, if the Mean is below threshold, we are mostly Acquitting.
      We want to Convict the Guilty. So we want more mass above 5.67.
      Option A (Higher Variance) has fatter tails. It might actually produce *more* convictions of the guilty (and innocent) than Option B.
      *Wait, this contradicts the KL Divergence result.*
      KL Divergence measures the *rate* at which error probabilities decay.
      For large N, Error Prob $\approx \exp(-N \times D_{KL})$.
      $D_{KL}$ for 0.6 vs 0.5 was 0.02. Total = 0.48.
      $D_{KL}$ for 0.7 vs 0.5 was 0.082. Total = 0.984.
      Option B decays *much* faster.
      Why did the Mean Net Vote match?
      Because Mean Net Vote is linear approximation. KL is the accurate information metric.
      The KL divergence shows Option B provides *more information* distinguishing Guilty from Innocent.
      So Option B is definitely better.
