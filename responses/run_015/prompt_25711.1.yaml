      *   *Adjustment:* I will nuance the ranking. I'll place (c) Envariance as #1 *if* the circularity can be addressed, but currently (b) has more momentum in the philosophy of physics community regarding the *incoherence* problem. Actually, for a *foundation* looking for a *solution*, the physical derivation (c) is more robust *if* it holds. But given the history of critiques on Zurek, (b) is currently the more "live" research program for the *conceptual* block. I will stick with (b) at #1 because the *conceptual* block is the harder one for skeptics. Skeptics say "MWI is deterministic." (b) says "Here is where the uncertainty enters." (c) says "Here is the weight." (b) answers the "How can there be probability?" question better than (c).
