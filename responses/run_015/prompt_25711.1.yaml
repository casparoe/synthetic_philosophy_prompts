      *Re-evaluating (a):* Even if skeptics dislike it, it's the most mathematically precise. It sets the boundary conditions. It deserves the 3rd spot.
      *Re-evaluating (c):* Zurek's work is physically grounded. If it works, it bypasses the "agent" problem entirely. This is very attractive for skeptics who want physics, not philosophy. I might rank (c) higher than (b).
