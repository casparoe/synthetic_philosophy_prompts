      *   **(a) Decision-theoretic (Deutsch-Wallace):**
          *   *Pros:* Rigorous, formal, connects to action.
          *   *Cons:* Skeptics argue it derives "ought" from "is" (or rather, "probability" from "rationality"). It doesn't explain *why* the world looks probabilistic, only how to bet. It faces the "incoherence" objection (how can there be uncertainty if all outcomes occur?).
