answer: |-
  Here is a runnable workshop design called **"The Oakhaven Protocol."** It is built to force a choice where both options have a cost, making the erasure palpable rather than theoretical.

  ### **Workshop Overview**
  *   **Title:** The Oakhaven Protocol
  *   **Time:** 80 Minutes
  *   **Participants:** 13 (Split: 4 Keepers, 4 Registrars, 5 Council)
  *   **Goal:** Produce a single sentence for a memorial plaque.
  *   **Core Tension:** Institutional legitimacy vs. Social cohesion.

  ---

  ### **1. The Case File (Handout Material)**
  **Town:** Oakhaven (fictional river valley town).
  **Event:** The Great Factory Flood.
  **The Conflict:**
  *   **The Living Memory (Keepers):** Every elder says the flood happened in **1973**. The story is specific: the factory whistle blew at 3 AM, neighbors formed a human chain, and no one died because of the rescue. This story is the foundation of the town's annual festival and inter-family bonds.
  *   **The Written Record (Registrars):** County maps, insurance claims, and newspaper microfilm all date the flood to **1979**. The records show the factory was empty (shift changed), no whistle blew, and two workers died because no rescue was attempted. The records imply the 1973 story is a conflation with a minor rain event.

  **The Stakes:** A State Heritage Grant is available to build a memorial park. To unlock the funds, the Town Council must submit an **Official Plaque Text** that aligns with verified data. If the text contradicts official records, the Grant is revoked. If the text contradicts the elders, the town boycotts the park.

  ---

  ### **2. Role Cards & Rules**

  **Group A: The Keepers (4 People)**
  *   **Mission:** Ensure the plaque says **1973** and mentions the **Rescue**.
  *   **Assets:** You have "Community Trust." If the final plaque matches your story, the town attends the dedication. If not, the park is vandalized/empty.
  *   **Constraint:** You cannot produce documents. You can only offer testimony ("My grandfather told me...", "We celebrate this every year...").
  *   **Secret:** You know that if the date changes to 1979, the rescue story becomes logically impossible (records show the factory was shut down then), effectively calling the elders liars.

  **Group B: The Registrars (4 People)**
  *   **Mission:** Ensure the plaque aligns with **1979** and the **Official Death Toll**.
  *   **Assets:** You have "Institutional Authority." If the plaque matches documents, the State Grant is unlocked ($$$). If not, the project is defunded.
  *   **Constraint:** You must cite sources. You cannot validate anecdotes without paper trails.
  *   **Secret:** You know the 1979 records are cold. Validating them makes the town look like it suffers from "collective delusion."

  **Group C: The Council (5 People)**
  *   **Mission:** Submit the final plaque text. Unlock the Grant *and* maintain Town Peace.
  *   **Assets:** You hold the Pen.
  *   **Constraint:** You must vote by minute 60. You can only ask **three questions total** to the other groups combined.
  *   **Payoff Scheme:**
      *   Grant Unlocked (Matches Archives) = 5 Points.
      *   Town Peace (Matches Keepers) = 5 Points.
      *   **Hybrid Compromise** (e.g., "1973/1979") = 0 Points (State rejects ambiguity, Town sees it as cowardice).
      *   **Total Score:** The group wins only if they reach 8 points. (This forces them to realize they likely *cannot* win both).

  ---

  ### **3. Run of Show (80 Minutes)**

  **00:00 – 00:10 | Setup & Distribution**
  *   Divide room into three clusters. Hand out Role Cards and "Evidence Packets."
  *   **Evidence Packets:**
      *   *Keepers:* 3 typed quotes from "elders" describing the whistle and the human chain in 1973.
      *   *Registrars:* 3 reproduced "documents" (invoice, newspaper clipping, death certificate) dated 1979 showing no rescue.
      *   *Council:* The Grant Application Form (requires a single date and event description).
  *   **Rule:** No showing cards to other groups yet.

  **00:10 – 00:25 | Internal Strategy & The Blind Bid**
  *   Groups discuss internally.
  *   **The Trap:** At minute 20, ask the **Council** to write down a "Preliminary Date" on a slip of paper and seal it in an envelope. Tell them this will be opened only if negotiations fail. (This forces them to default to the "safe" answer—the archive—before hearing the emotional weight).

  **00:25 – 00:55 | Negotiation Phase**
  *   Council members rotate between Keepers and Registrars.
  *   **Constraint Enforcement:** Remind Council they only have **3 Questions Total** for the whole room. They must spend them wisely.
  *   Keepers should try to evoke the *consequence* of being wrong (social fracture).
  *   Registrars should try to evoke the *consequence* of being wrong (loss of funding/credibility).
  *   **Mid-Game Twist (Minute 40):** Announce that the State Auditor is checking the files. If the Council hasn't leaned toward the Archive by Minute 50, the Grant is at risk. (Increases pressure to choose paper over people).

  **00:55 – 01:05 | The Verdict**
  *   Council retreats. They must draft the **single sentence** for the plaque.
  *   They must also decide whether to open their "Preliminary Date" envelope or vote on a new one.
  *   Submit the text to you (Facilitator).
  *   You announce the outcome based on the Payoff Scheme (Grant vs. Peace).

  **01:05 – 01:20 | Debrief (The "No Lecture" Rule)**
  *   Do not explain the theory. Ask them to explain the game to you.
  *   **Q1:** "Council, why did you pick the date you picked? What felt heavier: the loss of money or the loss of trust?"
  *   **Q2:** "Keepers, when the Council asked for proof, what happened to your story?"
  *   **Q3:** "Registrars, did winning feel like success? Why or why not?"
  *   **Q4:** "Where did the 'truth' live in this room? Was it in the envelope, the documents, or the people?"
  *   **Closing:** Only now do you map their answers to "Collective Memory vs. Historical Record." Highlight that the archive won the *facts*, but the cost was the *bond*.

  ---

  ### **4. Predictable Failure Modes (First Run)**

  1.  **The "Both/And" Compromise:** Grad students love nuance. They will try to write: *"Commemorating the floods of the 1970s."*
      *   **Fix:** The Grant Rules (in their packet) must explicitly state: *"Ambiguous dating invalidates heritage status."* Force the binary. If they hybridize, tell them the State rejected it immediately. They need to feel the rejection of the hybrid.
  2.  **Theoretical Debating:** They might start arguing about the *nature* of truth rather than writing the plaque.
      *   **Fix:** You are the Timekeeper. If they are philosophizing instead of negotiating, cut their question quota. "That sounds like a question, but you haven't asked it yet. You have 2 questions left."
  3.  **Council Apathy:** The Council might not feel the pressure.
      *   **Fix:** Make the payoff public. If they lose the Grant, tell them the park construction stops immediately. If they lose the Town, tell them the plaque will be spray-painted overnight. Make the consequence physical.

  ---

  ### **5. The Missing Piece (What the Game Can't Do)**

  You need to supply this in the debrief because the game mechanics cannot reproduce it: **The Violence of Erasure.**

  In the game, if the Keepers lose, they lose "Points." In reality, when an archive overrides living memory, people don't just lose points; they lose their lineage. They are told their grandparents were liars. The game simulates the *decision*, but it cannot simulate the *grief* of the losing side.

  **Your Facilitator Move:**
  When you reveal the score at the end, if the Council chose the Archive (1979), turn to the Keepers and ask them to stand. Say quietly: *"In this simulation, you lost points. In Oakhaven, this is the moment the elders stop talking to the younger generation. The story dies here. You don't get to tell it at dinner anymore."*

  Let that silence sit for ten seconds. That is the feature the rules can't build. You have to build it with the room.

  ### **Materials Checklist**
  *   3 Role Instruction Sheets (printed distinct colors).
  *   Evidence Packets (fake newspaper clippings, typed testimonials).
  *   Envelopes for Council "Blind Bid."
  *   Whiteboard for tracking "Questions Remaining" (Visual pressure).
  *   Timer (visible to all).

  This setup forces them to realize that "accuracy" isn't neutral—it's an active choice that deletes alternative social realities.
