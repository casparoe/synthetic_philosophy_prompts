answer: |-
  **MEMORANDUM**

  **TO:** Substance-Use Advisory Council
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding House Bill 402 (Possession Decriminalization)

  **Recommendation**

  I recommend that the Council support House Bill 402 only on the condition that the enforcement provision regarding non-compliance is amended. Specifically, we must advise the Health Committee to suspend the misdemeanor escalation for failure to complete treatment when documented capacity is unavailable. We should request this amendment be adopted before the Committee reports out in six weeks. If the Committee cannot guarantee treatment capacity or remove the criminal sanction for impossible compliance, we should oppose the bill.

  **The Meaning of "Administrative"**

  The central claim of the bill's supporters is that shifting possession from criminal court to an administrative panel changes the moral nature of the state's interaction with the citizen. They argue that because the criminal sanction attaches only to disobedience of the panel's orders—and not to the drug use itself—the stigma of criminalization is removed. Our counsel adds that the distinction is procedural: without a jury or right to counsel, this is civil administration, not criminal prosecution.

  We must state the strongest version of this case before rejecting it. The philosophical argument here is that criminal punishment is distinctive not because of the burden it imposes (a fine is a fine), but because of the *censure* it expresses. A tax burdens you without blaming you; a criminal conviction burdens you *because* it blames you. Supporters argue this bill removes the blame from the user. The user is not a criminal; she is a subject of health policy. The misdemeanor charge arises only if she ignores a lawful order to appear or comply, akin to contempt of court. On this view, the state is not punishing addiction; it is enforcing the authority of the review panel.

  However, labeling a practice "administrative" does not change its function if the function remains punitive. If the panel summons you by name, records you, and holds a criminal charge over your head, the experience is one of censure. The distinction collapses entirely if the order you are commanded to obey is impossible to fulfill. The bill allows the panel to direct a person to treatment. Yet, as we know, our state's treatment system has waiting lists of several months. If a person is ordered into treatment that does not exist, and is then charged with a misdemeanor for failing to attend, the state is punishing her for impossibility.

  In this scenario, the "administrative" label is cosmetic. The censure returns. The state is effectively saying: "You are not a criminal for using, but you are a criminal for being addicted when we have no room to treat you." This restores the very moral blame the bill claims to remove. If we want the administrative label to do real work, the consequences of non-compliance must remain administrative (e.g., increased fines, license suspension) rather than criminal, particularly when compliance is structurally blocked.

  **The Five-Day Supply and the Trade-Off of Rules**

  Moving from philosophy to pharmacology, I must address the schedule defining a "five-day supply." In my forty years of work on receptor binding, I learned that quantities in a statute are not quantities in a body. Tolerance varies by orders of magnitude between individuals. A dependent person's five-day supply is not the same pharmacological object as a novice's. A quantity that is trivial for one person is a dangerous stockpile for another. There is no scientific way to make this schedule "correct."

  We must recognize this schedule for what it is: a rule that purchases determinacy at the price of accuracy. A fixed numerical threshold allows police and prosecutors to act quickly and uniformly without needing a pharmacologist at every traffic stop. It sacrifices scientific truth for administrative efficiency. This is a common trade-off in law. We accept speed and consistency over nuance.

  However, this trade-off reappears in the panel's operation. The bill gives the panel discretion to order treatment or fines. Here, the bill chooses accuracy (case-by-case judgment) over determinacy. This creates a tension. We use a blunt rule to decide who enters the system (the quantity threshold), but a nuanced judgment to decide what happens to them inside.

  Is this acceptable? Generally, yes, provided the stakes are low. We tolerate inaccurate rules for parking tickets; we do not tolerate them for felony convictions. Because the bill removes the criminal record for possession, the inaccuracy of the "five-day supply" table is tolerable. It is a reasonable price for decriminalization. But if the consequence of entering this system is potentially a misdemeanor charge for non-compliance, the accuracy of the entry threshold matters more. If the net is cast too wide using an inaccurate pharmacological standard, and the exit requires navigating a broken treatment system, the rule becomes a trap.

  **Capacity and Justice**

  This brings us back to the treatment waiting lists. The bill assumes a capacity that does not exist. In moral philosophy, "ought implies can." You cannot be obligated to do what you cannot do. If the panel orders treatment, and the clinics are full, the subject *cannot* comply. To escalate this failure to a misdemeanor is to punish status, not conduct.

  Portugal is often cited in these debates. We should not use it as evidence of success, as contexts differ too widely. But we can use it as an illustration of mechanics. In the Portuguese model, the dissuasion commission operates within a health infrastructure that is prepared to receive referrals. Our bill proposes the commission without the infrastructure. It is like prescribing a medication without checking the pharmacy stock.

  **Conclusion and Request**

  The bill is a significant step forward in reducing the harms of criminalization. The removal of criminal records for possession is a moral good. The panel structure offers a chance for intervention rather than incarceration. But the enforcement provision threatens to undermine the entire ethical architecture of the proposal.

  I propose we send the following letter to the Health Committee Chair within the next two weeks:

  1.  **Support the decriminalization of possession** and the administrative panel structure.
  2.  **Condition support on amending the enforcement clause.** The misdemeanor escalation for failure to complete treatment must be suspended when no treatment slot is available within a reasonable timeframe (e.g., 14 days).
  3.  **Request a capacity report.** The Committee should require the Department of Health to certify treatment capacity before the enforcement provision goes live.

  We have six weeks before the Committee reports out. We should ask for a meeting with the Committee Chair within ten days to present this analysis. If we do not secure these amendments, the bill risks creating a new form of criminalization that is arguably more unjust than the old one: punishing people for failing to solve a problem the state itself has left unsolved.

  Respectfully,

  [Your Name]
  Member, Substance-Use Advisory Council
