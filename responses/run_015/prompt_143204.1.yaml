prompt: |-
  Please defend the view that promises bind not primarily because they generate legitimate expectations or because breaking them causes harm, but because they enact a temporary jurisdictional transfer: in promising, the promisor places a specific domain of her practical reasoning under the promisee's normative authority. Breaking the promise is then structurally analogous to a legislature revoking its own enacted statute—except that the revocation is self-undermining, since the promisor remains both legislator and subject. Explain how this delegated-authority account handles promises unknown to the promisee, addresses the objection that it overstates personal autonomy, and distinguishes promise-breaking from mere change of mind in cases where no harm or disappointed expectation is present.
reasoning: |-
  Here's a thinking process that leads to the essay defending the "jurisdictional transfer" account of promises:

  1.  **Deconstruct the Prompt:**
      *   **Core Thesis:** Promises bind not because of expectations (reliance) or harm (consequentialism), but because they enact a *temporary jurisdictional transfer*. The promisor gives the promisee normative authority over a specific domain of their practical reasoning.
      *   **Analogy:** Breaking a promise is like a legislature revoking its own statute, but self-undermining because the promisor is both legislator (of the promise) and subject (bound by it).
      *   **Required Explanations/Defenses:**
          1.  How does this handle *promises unknown to the promisee* (secret promises)?
          2.  How does it address the objection that it *overstates personal autonomy* (alienation of will)?
          3.  How does it distinguish *promise-breaking from mere change of mind* when no harm/expectation exists?

  2.  **Initial Brainstorming & Theoretical Grounding:**
      *   *Traditional Views:*
          *   Reliance/Expectation (Scanlon, Shiffrin): Binding because the promisee now expects $X$ and relies on it.
          *   Harm/Consequentialism: Binding because breaking it causes bad outcomes.
          *   Will Theory (Kant, Hume, Raz): Binding because of the act of will itself.
      *   *The Prompt's View:* This is a sophisticated version of the Will Theory, specifically leaning towards a "normative power" or "authority transfer" model. It sounds reminiscent of H.L.A. Hart's "choice theory" or perhaps a specific interpretation of Raz's "authority" concepts, but the prompt frames it uniquely as "jurisdictional transfer."
      *   *Key Metaphor:* Legislation. The promisor makes a law for themselves, but hands the veto/enforcement power to the promisee.
      *   *The "Self-Undermining" Aspect:* If I make a law, I can usually repeal it. But if I transfer the authority to repeal to *you*, I can't repeal it without violating the transfer itself.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   State the thesis clearly.
          *   Contrast with reliance/harm views (briefly).
          *   Introduce the "jurisdictional transfer" metaphor.
          *   Outline the three specific challenges to be addressed.

      *   **Core Argument: The Jurisdictional Transfer:**
          *   Explain the mechanics. A promise isn't just a prediction; it's a normative act.
          *   The promisor creates a "normative fact."
          *   The promisee gains a right of command (or veto) over that specific action.
          *   The analogy: Legislature enacts statute -> Citizens bound. Here, Promisor enacts obligation -> Promisor bound, but Promisee holds the "release" key.
          *   Why breaking is wrong: It's not about hurt feelings; it's about usurping an authority you voluntarily surrendered.

      *   **Challenge 1: Promises Unknown to the Promisee (Secret Promises):**
          *   *Problem:* If binding is about authority transferred to the *promisee*, how can they have authority if they don't know?
          *   *Solution:* Distinguish between *holding* authority and *exercising* it. The transfer happens at the moment of promising (the act of will), not at the moment of communication/acceptance.
          *   *Analogy:* A deed to a house. I can sign it over to you even if you are asleep. You own it (have authority) before you know it.
          *   *Refinement:* The obligation exists *in relation* to the promisee, even if they are ignorant. The promisor knows they have surrendered authority. The "jurisdiction" is created unilaterally but binds bilaterally.

      *   **Challenge 2: Overstating Autonomy (Alienation of Will):**
          *   *Objection:* Can I really bind my future self? Isn't that a violation of autonomy? (The "Ulysses" problem).
          *   *Defense:* Autonomy isn't just doing what you want *now*; it's the capacity to shape your normative landscape.
          *   *The "Legislature" Analogy:* A legislature binds future sessions all the time. That's how law works.
          *   *Voluntary Limitation:* Limiting oneself is an *expression* of autonomy, not a negation. By promising, I extend my agency across time.
          *   *Scope:* It's a *temporary* and *specific* transfer, not total slavery. This preserves overall autonomy while allowing specific binding.

      *   **Challenge 3: Promise-Breaking vs. Change of Mind (No Harm/Expectation):**
          *   *Scenario:* I promise to meet you. You forget. I don't show up. No harm, no disappointment.
          *   *Reliance View:* Hard to explain why this is wrong.
          *   *Jurisdictional View:* Easy. The wrong isn't the consequence; it's the *usurpation*.
          *   *Explanation:* I took back authority I gave away. Even if you didn't care, I violated the normative structure I created. It's a category error to treat a binding obligation as a mere intention.
          *   *Distinction:* A change of mind treats the prior commitment as advice to oneself. Promise-breaking treats it as a command from another (which one ignores).

      *   **Conclusion:**
          *   Summarize the strengths.
          *   Reiterate that this view captures the *deontic* (duty-based) nature of promising better than consequentialist views.
          *   Final thought on the dignity of the promisor/promisee relationship.

  4.  **Review and Refine:**
      *   *Tone:* Philosophical, rigorous, persuasive.
      *   *Check:* Did I use the "legislature revoking statute" analogy? Yes.
      *   *Check:* Did I address all three specific prompts? Yes (Secret promises, Autonomy objection, Change of mind).
      *   *Self-Correction during drafting:* Make sure the "secret promise" section doesn't sound too magical. Emphasize that the *normative status* changes, even if the *psychological state* of the promisee doesn't. The authority is *available* to them, even if unclaimed.
      *   *Refining the "Legislature" analogy:* Ensure the distinction is clear. In normal law, the legislature can repeal. In promising, the promisor *cannot* repeal unilaterally because they transferred the repeal power. That's the crux of the "self-undermining" point.

  5.  **Final Polish:** Check for flow, clarity, and philosophical precision. (e.g., ensuring terms like "normative authority" and "practical reasoning" are used consistently). *Self-correction: Make sure to explicitly mention that the revocation is self-undermining because the promisor is both legislator and subject.*

  6.  (Proceed to generate output based on these thoughts.)
answer: |-
  The dominant theories of promising generally fall into two camps: the reliance view, which grounds the obligation in the expectations generated in the promisee, and the consequentialist view, which grounds it in the harm caused by breaking faith. Both, however, struggle to capture the distinctive *deontic* force of a promise—the sense that breaking a promise is a wrong *in itself*, regardless of whether anyone is hurt or disappointed.

  A more robust account is the **delegated-authority model**. On this view, to promise is not merely to predict one's behavior or invite reliance; it is to enact a temporary jurisdictional transfer. In promising, the promisor places a specific domain of her practical reasoning under the promisee's normative authority. The promisor creates a normative fact: she is no longer the sole sovereign over the promised action. Breaking the promise is thus structurally analogous to a legislature revoking its own enacted statute—except that the revocation is self-undermining, since the promisor remains both legislator (of the original vow) and subject (bound by it), having surrendered the power of repeal to the promisee.

  This account offers a superior explanation of the morality of promising, particularly when tested against three difficult challenges: secret promises, the limits of autonomy, and the distinction between breaking a promise and mere change of mind.

  ### I. The Mechanics of Jurisdictional Transfer

  To understand the binding force, we must view the promisor as a normative legislator. When an agent makes a promise, she exercises a normative power to alter her own moral landscape. However, unlike a solitary vow (which binds only the self), a promise involves a second party. The crucial move is the transfer of the *right of release*.

  By promising, the promisor tells the promisee: "Regarding action $X$, you now hold the veto power." The promisor remains the agent who performs the action, but the authority to decide whether the obligation stands is transferred to the promisee. When the promisor breaks the promise without release, she is not merely failing to act; she is unilaterally reclaiming an authority she voluntarily alienated. This is the "self-undermining" nature of the act. It is akin to a legislature passing a law that stipulates, "This law can only be repealed by the Senate," and then the House of Representatives attempting to repeal it alone. The act of repeal is invalid not because the outcome is bad, but because the agent lacks the jurisdiction to perform it.

  ### II. The Challenge of Secret Promises

  A significant objection to authority-based views is the case of the **secret promise**. If I promise my dying friend to care for his cat, and he dies immediately, he never knows the promise was made. If the binding force relies on the promisee's authority, how can he hold authority he doesn't know he has? Reliance theories fail here entirely, as the promisee cannot rely on what they do not know.

  The jurisdictional transfer account handles this by distinguishing between the *possession* of authority and the *exercise* of that authority. Authority is a normative status, not a psychological state. Consider a deed to a house: I can sign over ownership to you while you are asleep. You possess the authority over the property before you wake up and accept the keys. Similarly, when I make a secret promise, I unilaterally alter the normative relationship. I have placed the domain of my practical reasoning under your jurisdiction, even if you are unaware of your new executive power.

  The obligation binds because *I* know I have surrendered my sovereignty over that action. The "jurisdiction" exists objectively within the moral relationship, not subjectively within the promisee's mind. If I break the secret promise, I am still usurping an authority that belongs to another, even if that other is ignorant of their tenure. The wrong is the unauthorized reclamation of power, not the disappointment of an expectation.

  ### III. The Objection of Alienated Autonomy

  Critics often argue that the delegated-authority model overstates the capacity of the will, violating the principle that one cannot be bound by a past self against the will of the present self. If I am truly autonomous, how can I bind my future self to the authority of another? This is often framed as an impermissible alienation of the will.

  This objection misunderstands the nature of autonomy. Autonomy is not merely the freedom to act on one's current desires; it is the capacity to shape one's normative environment over time. A legislature that cannot bind future sessions is not a legislature; it is a momentary outcry. By promising, I extend my agency across time. I am not negating my autonomy; I am *exercising* it to create a stable structure for my future conduct.

  Furthermore, the jurisdictional transfer is not total slavery; it is specific and temporary. I retain my general sovereignty but carve out a specific jurisdiction (e.g., "showing up to lunch on Tuesday") and hand the keys to the promisee. This limitation is self-imposed. To argue that I cannot bind myself is to argue that I cannot make plans, sign contracts, or marry. The "self-undermining" aspect of breaking the promise protects autonomy rather than violating it: it ensures that the only way the obligation ends is through the mechanism I authorized (the promisee's release) or the fulfillment of the term. To allow the promisor to unilaterally revoke the promise would be to disrespect the autonomy she exercised at the moment of promising.

  ### IV. Promise-Breaking vs. Change of Mind

  The strongest test for any theory of promising is a case where **no harm or disappointed expectation occurs**. Suppose I promise to meet you for coffee. You forget the meeting entirely and have a pleasant morning alone. I do not show up. You suffer no harm, and you had no active expectation at the time of the breach.

  For reliance theorists, it is difficult to explain why I have wronged you. If you didn't rely on me, and you weren't disappointed, where is the injury?

  The jurisdictional account provides a clear distinction. In a mere **change of mind**, I treat my prior intention as advice to my future self. I weigh the advice against new data and decide to override it. I remain the sole sovereign of my actions.

  In **promise-breaking**, I treat my prior commitment as a command from *you*. By promising, I demoted my future self from "legislator" to "subject" regarding this action. When I fail to show up, I am not merely changing my mind; I am acting without jurisdiction. I am treating a domain that belongs to your normative authority as if it still belongs to mine.

  The wrong is structural. It is the difference between a citizen ignoring a tax law because they changed their mind about spending (illegal) versus a citizen ignoring a suggestion from a friend (permissible). Even if the tax revenue wasn't needed (no harm), the evasion is a violation of the normative order. Similarly, breaking the promise violates the normative order established between us. I have taken back a power I gave away. The absence of harm mitigates the *consequences* of the breach, but it does not erase the *wrong* of the usurpation.

  ### Conclusion

  The delegated-authority account defends the intuition that promises create obligations that are distinct from the sum of their consequences. By framing promising as a temporary jurisdictional transfer, we explain why the promisor is bound even when the promisee is unaware (authority is possessed, not just exercised), why this binding is compatible with autonomy (autonomy includes the power to limit oneself), and why breaking a promise is wrong even without harm (the wrong is the unauthorized reclamation of normative power).

  Ultimately, this view respects the dignity of both parties. It treats the promisor as a moral legislator capable of binding her future self, and the promisee as a holder of rights, not merely a vessel for expectations. To break a promise is to commit a category error: it is to act as a sovereign in a domain where one has voluntarily become a subject.
