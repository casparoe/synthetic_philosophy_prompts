answer: |-
  Karl Jaspers' *The Question of German Guilt* (1947) posited that political guilt arises from co-responsibility for the state's exercise of power, binding citizens collectively but distinct from the personal realms of moral or metaphysical guilt. However, Jaspers wrote in the shadow of total regime collapse. The unresolved theoretical frontier lies in applying this framework to *continuous* democracies inheriting unjust foundational structures (e.g., settler-colonial constitutional orders). Here, the "rupture" Jaspers assumed is absent; the legal order persists even as the moral evaluation of its origins shifts.

  Below are the three main open questions regarding the diachronic transmission of structural political guilt, ranked by their significance for political philosophy and legal theory.

  ### 1. The Ontology of Diachronic Collective Agency
  **Question:** *Under what conditions does a political collective persist as the same moral agent across generations to bear guilt for predecessor regimes?*
  This question interrogates whether the "state" or the "people" constitutes the guilt-bearing entity. If the state is a legal fiction that persists through constitutional continuity, does it carry moral debt? Or does popular sovereignty imply that each generation constitutes a new moral agent, severing diachronic guilt? This line of work engages with the metaphysics of group agency (e.g., List & Pettit) and legal theories of state succession. It asks whether *institutional continuity* is sufficient for guilt transmission, or if a stronger form of *identity* is required.

  ### 2. The Normative Mechanism of Transmission
  **Question:** *Is the transmission of structural guilt grounded in democratic complicity, unjust enrichment, or symbolic identification?*
  If collective agency persists, *why* are current citizens liable? Contemporary scholarship diverges here.
  *   **Complicity:** Citizens are guilty only if they actively uphold the unjust structure (a high bar that may exonerate most).
  *   **Enrichment:** Liability arises from benefiting from past dispossession, regardless of intent (shifting from guilt to restitution).
  *   **Identification:** Citizens inherit guilt by identifying with the national narrative that glorifies the founding (a Jaspers-adjacent view).
  This question determines whether structural guilt is a matter of *fault* (culpability) or *obligation* (forward-looking responsibility).

  ### 3. The Pragmatics of Guilt-Language in Reparative Justice
  **Question:** *Does framing structural injustice as "political guilt" facilitate or obstruct reparative justice and constitutional reform?*
  This is an empirical and rhetorical question. Does attributing guilt to a contemporary citizenry for historical sins generate the political will for reparations and memorialization, or does it trigger defensive backlash that delegitimizes reform? This line of work bridges political theory with social psychology, examining whether "guilt" is a functional category for public policy or a toxic label that should be replaced by "responsibility" or "liability."

  ---

  ### Defense of Ranking

  **1. Ontology of Agency (Most Important)**
  *   **Stakes:** This is the gateway question for **legal theorists** and **constitutional scholars**. If the state does not persist as a moral agent, claims for reparations based on *state guilt* collapse into claims for individual charity or discretionary policy. It determines whether treaties with Indigenous peoples, for example, bind the current demos.
  *   **Tractability:** This is the most **tractable** question legally. Courts routinely rule on state continuity and succession (e.g., debt assumption, treaty obligations). While the *moral* metaphysics are complex, the *legal* criteria for continuity are well-defined, offering a concrete anchor for philosophical analysis.

  **2. Normative Mechanism (Second)**
  *   **Stakes:** This matters most to **political philosophers** and **liberal theorists**. It tests the limits of liberal individualism. If citizens can be "guilty" without personal fault (via enrichment or identification), it challenges the core liberal tenet that responsibility requires agency. The stakes involve the coherence of democratic theory itself.
  *   **Tractability:** Less tractable than Q1. It relies on competing moral intuitions (luck egalitarianism vs. voluntarism) that are resistant to empirical resolution. It remains a site of perpetual philosophical contestation.

  **3. Pragmatics of Language (Third)**
  *   **Stakes:** This concerns **policymakers** and **activists**. It determines the viability of reform. However, it is secondary because if there is no ontological basis for guilt (Q1) or no normative mechanism (Q2), the pragmatic effects of the language are moot.
  *   **Tractability:** Least tractable theoretically, though empirically testable. It is contingent on cultural context (e.g., German *Vergangenheitsbewältigung* vs. American exceptionalism), making it difficult to derive universal theoretical principles from it.

  ---

  ### Falsification Condition

  My verdict on the priority of these questions rests on the assumption that **institutional continuity can sustain moral claims.**

  **What would change my verdict:**
  If a robust argument demonstrated that **institutional continuity alone is normatively inert**—meaning that legal persistence confers *no* moral liability without explicit democratic ratification of past acts—then **Question #2 (Normative Mechanism)** would immediately supersede Question #1. In that scenario, the ontology of the state becomes irrelevant; the only thing that matters is the specific conduct of current citizens (complicity).

  Alternatively, if **empirical evidence conclusively showed** that framing reparations in the language of "guilt" systematically reduces public support for redistributive justice compared to "responsibility" or "investment," then **Question #3 (Pragmatics)** would become the primary constraint. In such a case, political philosophy would be forced to treat "guilt" as a category error for structural injustice, regardless of its metaphysical validity, because its usage would actively undermine the justice it seeks to describe.
