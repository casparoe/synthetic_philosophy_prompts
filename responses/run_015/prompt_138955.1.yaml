prompt: |-
  Had a blazing argument in the pub last night with my mate about whether blowing thirty grand on a wedding is actually a signal of commitment. He kept saying it's costly so it's honest, end of; I kept saying cost on its own proves nothing — a signal's only honest if it costs a bloke who's going to bail in two years more than it costs one who isn't, and anyone can borrow thirty grand, so the reception is just a reciept. Problem is I'm best man at that wedding in three weeks and I've now got to write the toast. I need a three-minute speech that gets the handicap principle right without turning into a lecture: the real evidence is him turning down the Singapore posting, selling the car, and doing a reading he wrote himself in front of two hundred people, not the price tag. But I can't say "they must love each other, look at the flowers" because that's the exact move I spent all evening arguing against, and I can't insult her parents who paid for the flowers either. Can you write it so it also gets across that all I can really offer the room is the signals and not his feelings, which I've got no access to — and so it still lands when half the room think the whole wedding's a racket and the other half have never heard of any of this?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** The user had a heated argument with a friend (the groom) about the economics of signaling theory (specifically the Handicap Principle) applied to weddings.
      *   **The Argument:**
          *   Friend's view: Spending £30k proves commitment because it's costly (honest signal).
          *   User's view: Cost alone isn't enough. An honest signal must be *differentially* costly (harder for a leaver to pay than a stayer). Debt makes it easy to fake. Real signals are sacrifices specific to the individual (career, hobbies, vulnerability).
      *   **The Task:** Write a 3-minute Best Man speech.
      *   **Constraints:**
          *   Must incorporate the signaling theory argument *without* being a lecture.
          *   Must highlight specific sacrifices the groom made (turning down Singapore posting, selling the car, writing a reading).
          *   Must *not* rely on "look at the flowers/cost" as proof of love (contradicts user's philosophy).
          *   Must *not* insult the parents (who paid for the flowers).
          *   Must acknowledge the speaker's limitation: He can only speak to observable signals, not internal feelings.
          *   Must appeal to a mixed audience (skeptics who think weddings are a racket + traditionalists who don't know the theory).
          *   Tone: Witty, warm, insightful, not academic, not offensive.

  2.  **Deconstruct the Core Concept (Handicap Principle):**
      *   *Biological origin:* Peacocks' tails. They are heavy and attract predators. Only a healthy bird can afford that burden.
      *   *Application to Groom:* It's not about the money (anyone can borrow money). It's about what *he* specifically gave up that would hurt a "fake" partner more than a "real" one.
      *   *Key Examples:* Singapore (career), Car (prized possession), Reading (vulnerability).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role. Break the ice. Maybe hint at the argument without making it a fight.
      *   **The "Cost" Trap:** Address the money elephant in the room gently. Acknowledge the parents' generosity (crucial constraint) but pivot away from price = love.
      *   **The Theory (Simplified):** Introduce the idea of "sacrifice" vs. "spending." Use the peacock analogy or just common sense.
      *   **The Evidence (The Real Signals):**
          *   Singapore posting (Career sacrifice).
          *   The Car (Personal passion sacrifice).
          *   The Reading (Emotional vulnerability).
      *   **The Limitation:** Admit I don't know what's in his heart, only what he *did*.
      *   **The Toast:** Bring it together.

      *   **Tone Check:** Needs to sound like a pub mate talking, not a professor. Needs to be funny but sincere.

  4.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is mentioning the argument too meta?
