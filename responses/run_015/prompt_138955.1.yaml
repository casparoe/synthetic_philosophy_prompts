      *   Raise a glass.

  6.  **Polishing for the "Mixed Audience" Constraint:**
      *   Skeptics: They'll like the "money isn't everything" angle.
      *   Traditionalists: They'll like the focus on sacrifice and commitment.
      *   Avoid jargon: Don't say "Handicap Principle." Say "True cost."

  7.  **Final Review against Constraints:**
