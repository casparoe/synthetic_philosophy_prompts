answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct privilege of being Best Man.

  Now, [Groom] and I had a bit of a debate the other night. We were discussing the economics of marriage. Specifically, whether spending a fortune on a wedding is proof of commitment. His argument was simple: "It cost a lot, therefore I mean it."

  My counter-argument—and I promise I'll keep the economics lecture to under thirty seconds—is that price tags can be faked. You can borrow money. You can put it on credit. A price tag only proves you have access to capital, or generous parents.

  And speaking of generous parents, can we please raise a glass to [Bride's Parents] and [Groom's Parents]? Thank you for this incredible celebration. The flowers are stunning, the venue is perfect, and none of this happens without you. But while you paid for the party, you didn't pay for the promise. That part had to come from [Groom].

  Because here's the thing about commitment. In biology, there's an idea that a true signal isn't about how much you spend; it's about how much you *sacrifice*. It's about doing things that would be too costly if you were planning to walk away in two years.

  I can't tell you what's in [Groom]'s heart. I'm not a mind reader. I can't measure his feelings. I can only measure his actions. And when I look at the last twelve months, I don't see a price tag. I see a trail of sacrifices that only make sense if he is all in.

  I see a man who turned down a major posting in Singapore. That's career currency. You don't burn that unless you're planning to put down roots right here.

  I see a man who sold his pride and joy, the [Car Model], because he decided a garage space was less important than a mortgage space.

  And most terrifyingly, I see a man who wrote his own reading for this ceremony. [Groom] is a private bloke. Standing up in front of two hundred people to recite words he wrote himself? That is vulnerability. You can't borrow money to do that. You can't fake that without looking like a fool.

  So, [Groom], I might not be able to verify your internal emotional state. But the data is compelling. You've sacrificed your career trajectory, your motor, and your dignity. By any metric, that is a credible signal.

  [Bride], he's put his money where his mouth is, but more importantly, he's put his life where his heart is.

  Ladies and gentlemen, please stand and raise your glasses. To the happy couple. May your signals always be honest, and your returns be infinite. To [Groom] and [Bride]!
