answer: |-
  You are describing a phenomenon that sits in the blind spot between the philosophy of art and the psychology of emotion. You are correct to set aside the "Paradox of Fiction" (why we feel for what we know is not real); your puzzle is the inverse (why we stop feeling for what we know *is* real, or at least legitimate).

  Here is the carving of the problem, structured by your questions.

  ### One Thing or Two?

  These are **one phenomenon** with two different triggers.

  In the documentary case, the trigger is a breach of **genre contract** (the shift from "record" to "construction"). In the fiction case, the trigger is a breach of **immersive opacity** (the shift from "event" to "technique").

  Despite the different triggers, the mechanism is identical: in both cases, your attention is forcibly redirected from the *diegesis* (the world of the story) to the *production* (the mechanics of the making). Once the production mechanics become visible, they cannot be made invisible again by intellectual reassurance. The "world" of the film recedes, and the "work" of the film advances. Because the emotional response was anchored to the "world," and that world is now perceived as porous or manufactured, the emotion cannot re-anchor, even if you intellectually approve of the manufacturing.

  The common core is not betrayal, but **visibility**. In both cases, the machinery of the effect became visible, and visibility, in this specific context, is irreversible.

  ### Nearest Established Concepts and Differences

  There are three standard accounts that come close but fail to capture the specific persistence and "accuracy" you describe.

  **1. The Cognitive Theory of Emotion**
  *   **The View:** This view holds that emotions are constituted by judgments or beliefs. To feel fear, you must judge there is a threat. To feel pity, you must judge someone is suffering undeservedly.
  *   **How it differs:** Under this theory, if you restore the positive judgment (e.g., "the staging was ethical," "the technique is legitimate"), the emotion should return. Your case shows that emotional capacity is **path-dependent**. It matters *how* you arrived at the belief, not just the belief itself. The Cognitive Theory cannot explain why the emotion remains dormant when the justificatory beliefs are restored.

  **2. Suspension of Disbelief**
  *   **The View:** This is the voluntary temporary acceptance of the fictional premise to allow engagement.
  *   **How it differs:** Suspension of disbelief is typically treated as a switch (on/off). Your experience is a degradation of *quality*, not a loss of *acceptance*. You still accept the film; you just cannot inhabit it. Furthermore, suspension of disbelief is usually something the viewer *does*. Your experience is something that *happens to* the viewer upon receiving information. It is involuntary and permanent.

  **3. Aesthetic Distance (Psychical Distance)**
  *   **The View:** This concept suggests we need a certain gap between ourselves and the art to appreciate it aesthetically rather than practically. Too little distance is overwhelming; too much is cold.
  *   **How it differs:** Standard theory suggests distance can be adjusted back and forth. Your case describes a **ratchet effect**. The distance increased, and it locked. Crucially, you describe the new, distant state as "more accurate." Standard theory usually frames increased distance as a loss of immersion. You frame it as a correction of a prior error (naivety). This suggests the initial emotion relied on a specific kind of ignorance that cannot be feigned once lost.

  ### Does Any Established Concept Fit?

  None fit perfectly, but the closest is a specific, under-discussed application of **Disenchantment**.

  In sociology, disenchantment is the retreat of magic from the world due to rationalization. In aesthetics, it is often discussed regarding magic tricks: once you know the method, the wonder vanishes. However, aesthetic theory usually allows for "re-enchantment" through appreciation of skill (e.g., admiring the sleight of hand).

  Your case is distinct because re-enchantment fails. You do not admire the skill enough to regenerate the emotion; the knowledge of the skill actively suppresses the specific emotion (heartbreak/shock) that the skill was designed to produce. This is **Constitutive Disenchantment**: the knowledge of the constitution of the object prevents the specific affective response the object is designed to elicit, regardless of ethical or artistic validation.

  ### Is "Hysteresis" a Helpful Metaphor?

  **Yes, it is precise and necessary.**

  In physics, hysteresis is the dependence of the state of a system on its history. A magnetic material does not return to zero magnetism when the external field is removed; it retains a memory of the exposure.

  Your use of the term is not just a metaphor; it is a structural description of the psychological event.
  1.  **State A:** High emotional response, low meta-knowledge.
  2.  **Transition:** Acquisition of meta-knowledge (staging/technique).
  3.  **State B:** Low emotional response, high meta-knowledge.
  4.  **Reverse Transition:** Neutralization of meta-knowledge (ethical clearance/approval of technique).
  5.  **Result:** System does not return to State A. It settles in State C (Low response, neutralized meta-knowledge).

  The "lag" is the key. The emotional system has been permanently re-calibrated by the exposure to the production reality. Using "hysteresis" saves you from having to argue that the film changed or that you became cynical. It locates the change in the *history of the engagement* itself.

  ### Proposed Term and Definition

  Since no single existing term captures the irreversibility and the sense of "increased accuracy," I propose adopting your metaphor but formalizing it as:

  **Affective Hysteresis of the Frame**

  **Definition:** A persistent reduction in emotional responsiveness to an aesthetic object, triggered by exposure to the object's production conditions or provenance, which remains in effect even after the negative valuation of those conditions is intellectually resolved.

  **Boundary Cases (What counts and what does not):**

  *   **Counts (Affective Hysteresis):**
      *   **The Magic Trick:** You see a trick. It amazes you. You learn the method. You are no longer amazed, even if you admire the cleverness. The "wonder" is gone forever. (Matches your Case 2).
      *   **The Fabricated Memoir:** You read a memoir and weep. You learn it was fabricated. You stop weeping. You learn the author suffered similarly but wrote it as fiction. You still cannot read it as a memoir again. The "testimony" frame is broken irreparably. (Matches your Case 1).

  *   **Does Not Count (Habituation/Boredom):**
      *   **The Tenth Viewing:** You watch *The Godfather* ten times. You feel less. This is saturation, not hysteresis. If you wait five years, the feeling may return. In hysteresis, time does not heal the specific rupture.
      *   **The Spoiler:** You learn the butler did it. You lose suspense. This is **Information Depletion**. The emotion was based on ignorance of the *plot*. Your case is based on knowledge of the *process*. Knowing the process doesn't change the plot, yet the feeling still dies.

  *   **Does Not Count (Ethical Boycott):**
      *   **The Unethical Actor:** You learn the lead actor is a criminal. You stop enjoying the film. This is **Moral Contagion**. If they are exonerated, you might enjoy it again. In your case, no one was wronged, yet the feeling still died.

  ### Implications for Standard Stories About Fictional Emotions

  If this pattern holds, it is evidence **against** the idea that fictional emotions are simulations of real-world emotions based solely on content.

  Standard stories often suggest that once we enter the "game" of fiction, we react to the characters as if they are real. Your experience suggests that fictional emotions are **fragile contractual states** that depend on a specific **opacity of medium**.

  1.  **Emotions require a "Black Box":** For the specific emotion of *pathos* (in the documentary) or *heartbreak* (in the fiction) to function, the viewer must not only know the events are invented, but must also remain ignorant of the *causal chain of the invention*. As soon as the causal chain (the director's instruction, the actor's manipulation) becomes visible, the emotion treats the scene as a *demonstration* rather than an *occurrence*.
  2.  **The "Accuracy" Claim:** Your feeling that the thinner state is "more accurate" suggests that the initial emotional response was, in a sense, a **collusion**. You were not just responding to the father and daughter; you were responding to the *concealment* of the father and daughter. When the concealment is lifted, the "true" object of your attention is revealed (actors working), and the emotion appropriate to that object is thinner.
  3.  **Conclusion:** This implies that high-intensity fictional emotion is not the default state of engagement, but a **privileged state** that relies on the suppression of production reality. It is not robust. It cannot survive the "truth" of its own making, even when that truth is benign.

  In short: You are not suffering from cynicism. You are experiencing the structural limit of aesthetic immersion. The emotion was real, but it was contingent on a frame that has now been locked in the "open" position. The hysteresis is the record of that locking.
