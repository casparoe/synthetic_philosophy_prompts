prompt: |-
  Construct a one-paragraph thought experiment in aesthetic testimony built around Nelson Goodman’s distinction between autographic and allographic works, but applied to an object that deliberately straddles the boundary. Design a realistic scenario—set in a museum conservation lab or a private auction verification session—involving a work that is ontologically allographic (defined entirely by a notated specification or authorized instructions that permit multiple valid instantiations) yet physically presented and marketed as a singular autographic object (e.g., a conceptually specified installation executed once in a particular gallery, with the artist’s certificate declaring that future executions are inauthentic). Engineer the case so that a defender of the acquaintance principle, who normally holds that aesthetic knowledge of autographic works requires direct perceptual encounter with the specific physical object present, is forced to concede that a subject can acquire justified aesthetic knowledge of this work purely through testimony about its notated specification, without ever encountering the gallery instantiation. Simultaneously, engineer it so that a defender of testimonial permissiveness, who normally treats aesthetic judgments as transmissible like ordinary empirical beliefs, must deny that the testimony yields knowledge here, because the work’s allographic structure makes direct comparison across authorized instantiations epistemically essential in a way that breaks standard testimonial chains. After describing the scenario, state the exact belief at issue, the method of acquisition, and the relevant nearby worlds in which the testimony is false or the instantiation differs. Then show precisely why each theory delivers its counter-intuitive verdict, identifying the single structural feature—whether the ontological ambiguity, the authorization clause, or the suppression of instantiation-variability—that does the work. Explain what happens if that feature is removed: do both theories revert immediately to their standard alignments? Finish with an honest note on how a permissivist could object that the case cheats by smuggling autographic conditions into an allographic domain, and respond briefly from within the case’s own logic. Keep the scenario grounded in ordinary institutional practices; do not invoke demons, perfect predictors, or exotic physics.
