answer: |-
  In a climate-controlled Geneva freeport vault, a senior verifier audits *Delta Variant*, a conceptual installation defined by a precise algorithmic score (ontologically allographic) but accompanied by an artist's certificate restricting legitimate instantiation to a single, specific server configuration currently housed in a New York gallery (marketed as autographic). A remote collector asks the verifier via encrypted message whether the work possesses "algorithmic elegance," and the verifier, having audited the code without seeing the gallery installation, testifies that it does. The collector forms the belief solely on this testimony, relying on the verifier's expertise regarding the notation rather than the physical output.

  **Exact Belief:** "The work *Delta Variant* possesses the aesthetic property of algorithmic elegance."
  **Method of Acquisition:** Expert testimony concerning the notated specification (the code), without perceptual encounter of the physical instantiation.
  **Relevant Nearby Worlds:** Worlds where the code is identical but server latency alters the temporal aesthetic output; worlds where the verifier correctly reads the code but misjudges its aesthetic realization.

  **Theoretical Verdicts:**
  The **Acquaintance Principle (AP)** defender is forced to concede knowledge is acquired because, under Goodman's framework, the work *is* the notation; since testimony fully conveys the notation's structure, the subject achieves acquaintance with the work's identity conditions, rendering the physical token epistemically redundant. Conversely, the **Testimonial Permissiveness (TP)** defender must deny knowledge because the work's allographic nature requires aesthetic properties to be invariant across compliant instantiations; the exclusivity clause suppresses this variability, preventing the expert from distinguishing essential properties from accidental features of the single allowed setup, thus breaking the justificatory chain required for testimony.

  **Structural Feature:**
  The **exclusivity clause** (the authorization restricting an allographic type to a single token). If removed (allowing multiple instantiations), AP reverts to demanding perceptual encounter with a sounded performance (testimony fails), and TP accepts expert verification of a single performance as sufficient for type-knowledge (testimony succeeds), restoring standard alignments.

  **Objection and Response:**
  A permissivist might object that the case cheats by smuggling autographic conditions (uniqueness) into an allographic domain to manufacture a contradiction. However, within the case's logic, this hybrid ontology reflects actual institutional practices in digital art markets, where certificate-based scarcity intentionally creates epistemic tensions between legal identity and aesthetic experience.
