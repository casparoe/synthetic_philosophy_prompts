prompt: |-
  I'm taking a philosophy of physics course this term, and two of my classmates argued for a long time after our lecture on Bell's theorem. I couldn't referee it, so I'd like your help.

  Maya said Bell's theorem proves quantum mechanics is nonlocal: since no local hidden-variable theory reproduces the quantum correlations, there must be a faster-than-light influence connecting the particles.

  Dev said that's a misreading. Bell's theorem rules out "local causality" — the condition that the complete past state screens off correlations between spacelike-separated events — but quantum mechanics still satisfies "no-signaling," the condition that actually prevents faster-than-light communication. So the theorem doesn't show information traveling faster than light; it shows the joint probabilities fail to factorize in a particular way.

  Maya granted that you can't send a signal, but said "local causality" is the right notion of locality anyway: if, given the complete past, the outcome at one wing depends on the setting at the other, that's nonlocality, and the inaccessibility of the dependence to a local observer is a separate, less important point.

  Dev replied that in the standard formalism the marginal probability of one outcome really doesn't depend on the distant setting, and the "dependence" only shows up in the joint probabilities, which no local observer can access. So the "nonlocality" is a feature of the global state, not a physical influence.

  Maya said she thought he was hiding behind the formalism: the joint probabilities depend on both settings in a way no local common cause can explain, and that's a real physical fact, not an artifact. The fact that it isn't exploitable for signaling doesn't make it less real.

  Dev conceded the dependence is real in the sense that the joint probabilities don't factorize, but resisted the word "influence": there's no signal, no energy transfer, no causal arrow, just a failure of a specific screening-off condition, which is a different notion from faster-than-light causation.

  I honestly couldn't tell who was more right. Could you go through their exchange point by point and say who is right about which specific claim, and what, if anything, both of them are missing?
