  4.  **Identify the Best Philosophical Principle:**
      *   Standard options:
          *   *Knowledge Norm of Assertion (KNA):* Assert $p$ only if you know $p$. (Williamson). Fails on App (do you *know* the flight time?) and Lottery (why is lottery worse?).
          *   *Justified Belief:* Assert if justified. Fails on Lottery (justified by odds).
