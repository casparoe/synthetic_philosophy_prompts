answer: |-
  This is a profound question that sits at the intersection of epistemology, ethics, and professional practice. You are effectively asking for a **Norm of Assertion** that accounts for **Pragmatic Encroachment** (the idea that stakes affect knowledge/warrant) and **Institutional Agency** (the idea that an organization can know/claim what an individual cannot).

  Your intuitive verdicts are remarkably consistent with a specific philosophical framework, even if they feel messy in the abstract. You are not looking for a pure truth condition; you are looking for a **warrant-to-reliance ratio.**

  Here is the principle that best captures your pattern, the test of your own rule, and the application to your new cases.

  ### The Principle: The Norm of Licensed Reliance

  **Statement:** *You may assert $p$ only if your epistemic warrant is sufficient to justify the specific reliance your audience is practically entitled to place on that assertion in that context.*

  This is a hybrid of the **Knowledge Norm of Assertion** (you need to know) and **Stake-Sensitive Invariantism** (how much you need to know depends on what happens if you're wrong). It shifts the focus from the *speaker's mind* to the *listener's entitlement*.

  ### Testing the Principle Against Your Cases

  Here is how the **Norm of Licensed Reliance** generates your verdicts, clause by clause.

  1.  **Airline App $\rightarrow$ Taxi Driver:** **Fine.**
      *   *Warrant:* High (causal schedule data).
      *   *Reliance:* Low. If you are wrong, the driver loses 10 minutes; you pay a rebooking fee. The warrant exceeds the reliance entitlement.
  2.  **Lottery $\rightarrow$ Friend:** **Not Fine.**
      *   *Warrant:* Statistical only (no causal mechanism).
      *   *Reliance:* High (emotional devastation). Even 99.9% odds do not license the reliance required to crush hope.
  3.  **Replication Failed $\rightarrow$ Paper:** **Fine.**
      *   *Warrant:* Testimonial (trusted source).
      *   *Reliance:* Mediated. The audience relies on the *institution's* vetting of the source, not your personal statistical competence. The institution licenses the reliance.
  4.  **Replication Failed $\rightarrow$ Oath:** **Not Fine.**
      *   *Warrant:* Testimonial.
      *   *Reliance:* Direct/Personal. Under oath, *you* are the source. You cannot transfer the reliance to a third party. Your warrant is insufficient for personal liability.
  5.  **Minister Resigning $\rightarrow$ Masthead:** **Fine.**
      *   *Warrant:* Aggregated fragments.
      *   *Reliance:* Institutional. The masthead synthesizes the fragments into a whole that no individual holds. The institution accepts the liability for the synthesis.
  6.  **Minister Resigning $\rightarrow$ Individual:** **Not Fine.**
      *   *Warrant:* Fragment only.
      *   *Reliance:* If you speak individually, the audience relies on *your* specific knowledge. You cannot license reliance on a puzzle piece as if it were the picture.
  7.  **Press Officer $\rightarrow$ Public:** **Not Fine (but lesser wrong).**
      *   *Warrant:* None (believes it false).
      *   *Reliance:* The public is *not entitled* to rely on a press officer for unvarnished truth in the way they are a friend. The norm is violated (she asserts what she believes false), but the audience's entitlement to reliance is lower, hence the "lesser wrong."
  8.  **Soaked Colleague $\rightarrow$ "It's Raining":** **Weird/Not Violation.**
      *   *Warrant:* Perceptual.
      *   *Reliance:* None. The assertion licenses no action. It violates Gricean maxims of quantity (don't state the obvious), but not the norm of assertion.
  9.  **True Claim $\rightarrow$ Audience Misuse:** **Not Fine.**
      *   *Warrant:* High (True).
      *   *Reliance:* Toxic. If you know the audience will use the truth to license a falsehood (e.g., a nuanced statistic used to justify prejudice), they are not *entitled* to rely on it in that raw form. You must withhold or hedge to protect the reliance condition.
  10. **"Story Will Run" $\rightarrow$ Self/Other:** **Impossible.**
      *   *Warrant:* None (You don't control the editors).
      *   *Reliance:* High (Colleagues plan around it). You cannot license reliance on an event outside your epistemic control. The "jam" is your brain recognizing the warrant/reliance mismatch.

  ### Critiquing Your Two-Part Rule

  Your candidate rule: *(1) Answer "how do you know?" without bluffing, and (2) grounds satisfactory in the pub must be satisfactory for scrutiny by whoever acts on it.*

  **Verdict:** It is robust, but it collapses into **The Norm of Licensed Reliance** with one critical repair.

  *   **The Repair:** You must replace "know" in part (1) with **"warrant."**
      *   *Why:* In the *Replication/Paper* case, you explicitly say you "couldn't reconstruct a single step of the statistics." Philosophically, you do not *know* the replication failed; you have a justified belief based on testimony. If you demand "knowledge," you force yourself to abandon the *Replication/Paper* verdict. If you allow "warrant" (professional justification), the rule holds.
  *   **The Collapse:** Once you make that swap, Part (2) ("willing to have scrutinized by whoever will act on it") is doing all the heavy lifting. It is essentially a definition of "Licensed Reliance."
  *   **Does it force abandonment?**
      *   You said: *"I'd rather keep the replication/oath pair and the last datum than keep the app-versus-lottery asymmetry."*
      *   **Good news:** The Norm of Licensed Reliance **saves the App/Lottery asymmetry.** It explains it not via probability (97% vs 99.9%), but via *stakes and reliance*. The taxi driver's reliance is cheap; the friend's reliance is expensive. You do not have to abandon your intuition here; you just have to accept that the asymmetry is pragmatic, not probabilistic.
      *   **The Real Sacrifice:** To keep this coherent, you must abandon the idea that the *Press Officer* case is purely epistemic. Your rule calls it "Not Fine" (which is correct), but you feel it is a "lesser wrong." The Norm of Licensed Reliance explains this: the *violation* is the same (asserting without warrant), but the *harm* is less because the audience's entitlement to rely is lower. You must accept that "Not Fine" is a binary threshold, while "Wrongness" is a gradient of harm.

  ### Application to the Three New Cases

  Here is how the **Norm of Licensed Reliance** adjudicates the scenarios you haven't listed.

  #### 1. The Automated Account (Airport Open/Closed)
  *   **Scenario:** An automated bot posts "Airport is Open" based on a data feed. No human checked.
  *   **Verdict:** **Fine, conditionally.**
  *   **Reasoning:** The "knower" is not the human, but the *system*. The audience's entitlement to rely is based on the *system's* historical reliability (similar to the Airline App).
  *   **Caveat:** If the feed is known to be glitchy (low warrant), and the stakes are high (travelers stranded), the assertion is impermissible without a human "in the loop" to absorb the liability. The norm requires that *someone* (even a system administrator) holds warrant sufficient for the reliance. If the system is a black box with no accountability, it violates the scrutiny clause of your original rule.

  #### 2. The Reporter and the Lying Source
  *   **Scenario:** Reporter asserts a claim in the paper's voice. She believes it based on a source she knows has lied before, but not about this specific topic.
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:**
      *   *Warrant:* Compromised. Knowledge of past lies degrades the testimonial warrant, even if the current topic is different.
      *   *Reliance:* The audience relies on the *paper's* vetting process. Part of that process is source reliability. By asserting this without corroboration, the paper licenses reliance on a brittle foundation.
      *   *Scrutiny:* If challenged ("How do you know?"), the answer "Source X told me, and I know he's a liar but trust him this time" fails the scrutiny test. It invites the audience to take a risk the reporter isn't willing to take herself.

  #### 3. The Election Night Projection (92%)
  *   **Scenario:** Model says Candidate A has 92% chance. Can the outlet write "Candidate A has won"?
  *   **Verdict:** **Not Fine (to say "Won"). Fine (to say "Projected Winner").**
  *   **Reasoning:**
      *   *The Claim:* "She has won" is a categorical claim about reality. "92%" is a probabilistic claim about a model.
      *   *Reliance:* On election night, the audience's reliance is maximal (markets move, concessions are made, history is written).
      *   *Warrant:* 92% is high, but in high-stakes epistemology, it is not knowledge. It is statistical likelihood.
      *   *The Mismatch:* To assert "She has won" licenses the audience to rely on the outcome as a settled fact. If the 8% happens (as it sometimes does), the reliance was catastrophically misplaced.
      *   *The Fix:* You may assert "The model projects a win" or "We call the race." These are assertions about the *outlet's judgment*, not the metaphysical state of the election. This aligns with the *Minister/Masthead* case: The institution asserts its *call*, not the raw fact, until the fact is certified. This protects the warrant/reliance ratio.

  ### Summary for your Style Guide Fight

  You are not fighting about truth. You are fighting about **liability for reliance.**

  *   **The Rule:** Adopt a version of **The Norm of Licensed Reliance.**
  *   **The Phrasing:** "Reporters may assert claims only when their verification is sufficient to justify the audience's reliance in that specific format."
  *   **The Implication:** A tweet demands higher certainty than a draft because it is harder to correct (reliance is sticky). The Masthead can assert more than an individual because the Masthead absorbs the liability (institutional warrant).
  *   **The Sacrifice:** You must acknowledge that the "Press Officer" case is ethically distinct from the "Friend" case not because the assertion is different, but because the *social contract of reliance* is different.

  Your gut is right. The "jam" you feel when trying to say "The story will run" is the sound of the norm engaging. It is the most honest datum you have. Build the rule around protecting that jam.
