prompt: |-
  I'm examining the philosophical architecture behind how international legal and memorial institutions deploy the category of genocide. The practice works like this. First, legal frameworks require proof that perpetrators specifically intended to destroy a protected group—whether entirely or partially—before the genocide label applies; mere knowledge that destruction would result, or reckless indifference to it, does not suffice. Second, once the label is applied, it activates obligations and standing that do not attach to other mass atrocities of comparable scale: collective reparations owed to the group conceived as a continuing entity across generations, legal standing for descendants who were never physically present, and diplomatic duties of prevention and punishment treated as binding all states regardless of direct involvement. Third, political bodies—legislatures, international organizations, and courts—frequently apply or withhold the label in patterns that track geopolitical alliances rather than consistent factual criteria, yet they treat a positive determination as if it named an objective moral kind demanding universal acknowledgment.

  This cluster puzzles me. If genocide is primarily defined by a mental state (specific intent) rather than by magnitude or quality of harm, why does the legal response treat the harm as structurally different—targeted at a collective entity—rather than as an aggravated form of individual homicide? If the group is genuinely injured as a continuing trans-generational presence, why does the definition focus on the perpetrator's intent toward present members rather than on damage to that collective continuity? And if the label is politically contestable in its application, how can it simultaneously carry universal, non-negotiable moral weight?

  Please reconstruct the implicit philosophical theory that makes this practice coherent. In particular: does it presuppose a non-reductionist ontology of groups, according to which a collective can suffer injury and retain moral standing independently of its current members? Does it presuppose that intent determines the moral kind of an atrocity more fundamentally than outcome or scale? Does it presuppose a hybrid meta-ethical view in which the genocide category is both constructed through political recognition and objectively binding once recognized? And where is the practice philosophically underdetermined—where could rival theories of collective identity, moral harm, or legal recognition license the same institutional behavior?

  Distinguish strict presuppositions from commitments that are merely compatible, identify internal tensions—especially between the intent-based definition and the group-based reparations structure, and between the politics of selective naming and the claim to objective universal status—rank them by severity, and indicate the least costly revision for each.

  Then present your audit as a JSON object with exactly these fields:
  - "reconstruction": a brief prose paragraph summarizing the implicit theory
  - "commitments": an array of objects, each with:
    - "commitment": the reconstructed philosophical claim
    - "domain": one of "group_ontology", "moral_harm", "intent_vs_scale", "metaethics_of_naming", "universal_vs_particular"
    - "status": either "strict_presupposition" or "merely_compatible" or "underdetermined"
    - "tension_with": the name or brief description of the conflicting commitment, or "none"
    - "tension_severity": "high", "medium", "low", or "none"
    - "revision_cost": a brief note on what institutional practice would change if this were abandoned
  - "tensions_ranked": an array of strings describing the tensions in order from most to least severe
  - "cheapest_single_revision": a string identifying which commitment should be revised and how
