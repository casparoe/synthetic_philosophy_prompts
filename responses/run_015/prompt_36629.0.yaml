answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** 10th [Month]
  **SUBJECT:** Decision Recommendation: Attribution Update of [Painting Title]

  **Purpose**
  This memo recommends a course of action regarding the reattribution of our key landscape panel (1951 Bequest) following recent technical analysis. The evidence indicates the work is executed by the Workshop of the Master, not the Master's own hand. We must decide how to update our cataloguing, wall labels, and external agreements before the Board meeting on the 12th.

  **The Situation**
  For eighty years, this panel has served as the centrepiece of our collection, marketed as an autograph work by the Master. Recent conservation analysis confirms the execution is primarily by assistants working under his supervision, with possible minor interventions by the Master. This is not a forgery; it is a genuine seventeenth-century studio product. However, our current catalogue entry is factually incorrect.

  **The Ethical Argument**
  During recent deliberations, a compelling counter-argument was raised: the physical object has not changed. Every aesthetic fact remains identical. Therefore, changing the label merely participates in a collective illusion of value collapse. As one trustee posited, we would not reprice a sunset if we discovered it was a reflection off a mirror.

  While aesthetically sympathetic, this view conflates a museum with a decorative showroom. Our mandate is educational and historical, not merely visual. The "performance" theory of originality is useful here: a painting is a record of a specific human achievement. When we attribute a work to the Master, we are certifying a specific historical event—his direct engagement with the panel. A workshop piece records a different event: successful supervision and delegation. Even if the surface is indistinguishable, the historical record is not.

  To maintain the old attribution is to prioritize market value over historical truth. For a public trust, integrity is our primary currency. If we are discovered to be withholding this data (and conservation reports are increasingly public), the reputational damage will far exceed the drop in valuation.

  **Recommendation**
  I recommend we **update the attribution immediately** upon the painting's return from conservation, accompanied by explanatory wall text. We should not wait for a rehang, nor should we attempt to soften the language to "Attributed to." The evidence supports "Workshop of," and precision builds long-term credibility.

  **Implementation Plan & Timeline**

  1.  **Loan Agreement (Immediate Action)**
      The current loan agreement specifies an autograph work. We must notify the borrowing institution within 48 hours of this decision.
      *   *Risk:* They may withdraw the loan.
      *   *Mitigation:* Offer high-resolution imagery of the technical analysis to demonstrate the work's quality remains significant despite the attribution change. Many institutions accept workshop pieces if the provenance is clear. Hiding the change constitutes contractual fraud; transparency allows for renegotiation.

  2.  **Insurance Schedule (Before Loan Shipment)**
      We must update the insurance schedule to reflect the market value of a workshop piece.
      *   *Action:* Commission a updated valuation based on comparable workshop sales.
      *   *Reasoning:* Underinsuring is risky, but overinsuring based on false attribution invites accusations of fraud in the event of a claim. Honesty here protects the Board from liability.

  3.  **Donor Family (Within 2 Weeks)**
      The family of the 1951 donor must be informed before the public relabeling.
      *   *Strategy:* Frame this as an enhancement of knowledge, not a correction of error. In 1951, technical analysis was limited; we now know more about the Master's studio practice.
      *   *Narrative:* Emphasize that the work is still a genuine seventeenth-century piece from the Master's circle, which retains historical significance. Invite them to a private viewing of the new display text.

  4.  **Public Interpretation (Upon Rehang)**
      The wall label should not simply say "Workshop of." It should briefly explain *why* this matters.
      *   *Text Draft:* "Long believed to be by the Master, technical analysis reveals this landscape was produced by his workshop. This offers a rare glimpse into how the Master managed production and trained assistants..."
      *   *Goal:* Turn the reattribution into an educational opportunity rather than a loss of prestige.

  **Conclusion**
  Elena's argument—that the aesthetic experience remains unchanged—is true for the casual viewer. But museums are stewards of context, not just images. If we treat the object as a record of human achievement, the identity of the achiever matters.

  I ask the Board to approve this transparency strategy at the meeting on the 12th. Delaying or obscuring the truth protects us temporarily but endangers our institutional integrity permanently.

  **Decision Required:**
  [ ] Approve immediate relabeling and notification plan
  [ ] Hold attribution pending further review
  [ ] Maintain current attribution until next rehang

  _________________________
  [Your Name]
