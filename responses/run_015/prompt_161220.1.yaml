answer: |-
  **Project Title:** The Logic of Causation in *The Protestant Ethic*: Disaggregating the Thesis
  **Applicant:** [Name]
  **Fellowship:** Twelve-Month Dissertation Fellowship

  **Research Question and Problem Statement**
  The longstanding debate over Weber's *The Protestant Ethic and the Spirit of Capitalism* is stalled because it treats the thesis as a single causal claim when it is logically composite. Competing interpretations conflate three distinct propositions: (1) an **Asymmetry Claim** (doctrine moves conduct more than structure moves doctrine); (2) an **Outcome Contamination Worry** (the effect, an ethos, is attitudinally identical to the cause, risking tautology); and (3) a **Transmission Claim** (the behavioral complex persists after the theological belief decays). This project asks: **Which of these claims is load-bearing?** Specifically, is the *Spirit of Capitalism* a distinct behavioral regularity causally downstream of religious doctrine, or is it a redescription of the religious disposition itself? I argue that **Outcome Contamination** is the constitutive claim. Without a non-attitudinal specification of the effect, Asymmetry and Transmission lack stable relata. If the "Spirit" is merely the religious attitude renamed, the thesis is hermeneutically coherent but causally empty.

  **Critique of Standard Positions**
  Standard materialist and hermeneutic positions leave this question open because they bypass the constitution of the effect. The materialist position (ideas as reflexes) denies Asymmetry *a priori* but does not address whether the "Spirit" is behaviorally distinct from the doctrine; it assumes the effect is epiphenomenal. The hermeneutic position (meaning as primitive) secures the intelligibility of the actor's motive but treats the transition from *Gesinnung* (disposition) to *Lebensführung* (conduct) as self-evident. Both fail to apply a **Resolution Test**: a causal story about values that cannot be stated at the scale of a household's weekly decisions (what is spent, recorded, or reinvested) has not yet specified a mechanism. By focusing on Contamination, this project forces the thesis to specify a behavioral outcome that is not merely a symptom of the attitude being explained.

  **Methodology and Timeline**
  The twelve-month fellowship will be divided into three phases, distinguishing conceptual reconstruction from historical analysis.

  *   **Months 1–3: Conceptual Reconstruction.** I will reconstruct the logical topology of the thesis. The goal is to define the "Spirit" in non-attitudinal terms (e.g., bookkeeping practices, reinvestment rates, firm longevity) without losing the specific Weberian meaning of rational conduct. This phase establishes the criteria for the Resolution Test.
  *   **Months 4–9: Historical Micro-Analysis.** I will apply the **Double Contrast** device to early modern economic records. First, I will compare communities matched on region, legal status, and occupational mix but differing in confession (Calvinist vs. Lutheran vs. Catholic). Second, within the Calvinist set, I will compare stricter vs. laxer congregations or successive phases of the same congregation. This design approximates a difference-in-differences estimator, isolating doctrinal content from social position or network effects. The data will be coded against the Resolution Test: can the mechanism be traced to specific weekly decisions (e.g., refusal of conspicuous consumption, treatment of surplus)?
  *   **Months 10–12: Synthesis and Implications.** I will evaluate whether the behavioral outcomes identified in Phase 2 sustain the Asymmetry and Transmission claims. If the effect is behavioral, does it persist without the belief (Transmission)? If it persists, is it still cultural causation or institutional inertia?

  **Possible Conclusions and Failure Conditions**
  There are three determinate outcomes. (1) **Success:** The "Spirit" is reconstructed as a specific behavioral complex (e.g., systematic reinvestment) distinct from the religious attitude, sustaining the causal claim. (2) **Clarification:** The thesis holds only as a claim about the *origin* of a disposition, not the economic system itself; the "Spirit" remains attitudinal. (3) **Dissolution:** The behavioral outcomes cannot be separated from the attitudinal causes without ceasing to be Weber's thesis.

  **Dissertation Failure** is not a negative historical result (e.g., finding no correlation). Failure occurs if the conceptual reconstruction demonstrates that the thesis *cannot* be restated with a behavioral outcome without becoming a different argument (e.g., pure institutionalism). If the "Spirit" is essentially attitudinal, the thesis is not historically false but category-mistaken: it explains the psychology of the capitalist, not the capitalism of the system. This would require rewriting the dissertation's core contribution from a causal explanation to a genealogy of concepts.

  **Scope and Trade-offs**
  Attempting to validate all three claims (Asymmetry, Contamination, Transmission) risks superficiality. **Transmission is the cuttable claim.** Establishing intergenerational persistence requires longitudinal data across centuries, which exceeds the twelve-month scope and relies on speculative counterfactuals about secularization. Cutting Transmission limits the project to the *genesis* of capitalist conduct rather than its *persistence* in modernity. The project loses the explanation of why capitalism survives after religion dies—the specific "iron cage" problem. However, this is necessary. If Contamination is not resolved, Transmission is unintelligible (one cannot transmit what one cannot define). Asymmetry is retained as it is testable within the Double Contrast framework. By prioritizing Contamination, the project secures the logical floor of the thesis: ensuring that the cause and effect are distinct enough to sustain a causal relation at all.

  **Significance**
  This project moves beyond the stale "ideas vs. interests" debate by treating the Weberian thesis as a problem of causal specification rather than historical verification. It offers a method for validating cultural causation that satisfies both the hermeneutic demand for meaningful action and the sociological demand for observable regularities.
