answer: |-
  # The "Where Do You Actually Stand?" EA Sorting Quiz

  So you and your friend went at it about earning to give. Happens all the time. The problem is, usually people argue past each other because they're worried about different things. This quiz isn't about finding the "right" answer (nobody knows for sure), it's about figuring out which trade-offs bother *you* the most.

  Read the scenarios, pick the option that feels most true, and keep track of your letters (A, B, or C). Don't overthink it—go with your gut.

  ***

  **1. The Clinic Swap**
  You donate enough money to build a really effective health clinic in a poor region. It saves hundreds of lives. But shortly after, the local government looks at their budget, sees the clinic is covered, and cancels their own planned funding for that area to spend the money on something else (maybe a stadium, maybe tax cuts). Net lives saved is roughly the same, but the government stepped back.
  *   **A.** It's still a win. People got treated, and it's not your job to fix the government's budget priorities.
  *   **B.** It's a loss. You just let the state off the hook for its responsibility, and now public services are weaker long-term.
  *   **C.** It's neutral. The money got spent either way, so you didn't really *add* anything new to the world.

  **2. The Spreadsheet vs. The Story**
  You're evaluating two charities. Charity X has hard data showing it saves lives for $5,000 each. Charity Y works on changing cultural norms to prevent violence, but it's hard to measure and the data is fuzzy. Your gut says Y feels more important for the future, but the models say X is better.
  *   **A.** Go with Charity X. If you can't measure it, you can't trust it to be the best use of funds.
  *   **B.** Go with Charity Y. Relying only on what's easy to count ignores the stuff that actually shapes society.
  *   **C.** Split the difference. Fund X for the sure wins, but keep Y running so you don't lose the ability to judge value yourself.

  **3. The Oil Check**
  You can take a job at a high-frequency trading firm. You'd hate the work, and the firm's activities might slightly destabilize markets, but you'd donate 50% of your massive salary. Or, you can work directly for a nonprofit for half the pay.
  *   **A.** Take the trading job. The donation does way more good than the harm caused by the market activity.
  *   **B.** Take the nonprofit job. Making money in a harmful system corrupts your character, no matter where you donate it.
  *   **C.** Take the trading job, but only if you can advocate for ethical changes from the inside while you're there.

  **4. The Lobbyist's Dilemma**
  A group of effective altruists pools money to lobby for a specific policy change. It works, but now policymakers start drafting laws based on what this private group wants, rather than what voters want.
  *   **A.** Good. Private money is faster and more efficient than bureaucratic gridlock.
  *   **B.** Bad. It warps democratic priorities to fit the preferences of rich donors, even if they're well-meaning.
  *   **C.** Risky. It's okay temporarily, but dangerous if it becomes the main way policy gets made.

  **5. The Budget Cut (Round 2)**
  Similar to Q1, but specific: You fund a research project. The government sees it's done and cuts their public science budget by the exact amount you donated.
  *   **A.** Doesn't matter. The research got done. Substitution is fine if the outcome is achieved.
  *   **B.** It's bad. It creates a dependency where public goods rely on volatile private whims.
  *   **C.** It's complicated. Depends on whether the government would have spent the money wisely otherwise.

  **6. The Party Test**
  Imagine you took the high-paying job from Q3. Five years later, you're at a party. You talk like the bankers, you worry about market shifts, and you've started to think about poor people as "statistics" rather than humans. You still donate the money.
  *   **A.** Who cares? The stats are what matter. The lives saved are real even if your vibe changed.
  *   **B.** That's a disaster. If you lose empathy, you'll eventually stop donating or start justifying worse harms.
  *   **C.** Unlikely. You can compartmentalize. You know who you are.

  **7. The Policy Fog**
  You have a chance to work on preventing a potential pandemic (high impact, hard to measure success) vs. distributing mosquito nets (proven impact, lower ceiling). The metrics heavily favor the nets.
  *   **A.** Distribute the nets. We need to maximize confirmed good now rather than gamble on fuzzy future benefits.
  *   **B.** Work on the pandemic. Focusing only on what's measurable right now blinds us to big existential risks.
  *   **C.** Do the nets now to build capital, then switch to pandemic work later.

  **8. The Gut Check**
  An EA organization tells you that based on their calculations, your instinct to help your local community is morally wrong compared to sending money abroad.
  *   **A.** They're probably right. My instincts are biased; the math is impartial.
  *   **B.** They're wrong. Outsourcing my moral judgment to an algorithm defeats the point of being a moral agent.
  *   **C.** They have a point, but local connections matter too. I'd send most abroad but keep some local.

  ***

  # Scoring Key

  Okay, look at your answers. We're looking for patterns, not a perfect score. There's a bit of overlap here, so see which description fits your mix best.

  **Mostly A's: The Straight Defender**
  You're basically on board with the core EA thesis. You believe consequences are what matter, not intentions or "clean hands." You trust metrics over vibes, and you don't lose sleep over whether the government cuts budget because you stepped up. To you, the "substitution illusion" isn't a bug, it's a feature—results are results. You might worry about epistemic outsourcing, but you trust the data more than your gut.
  *   *Verdict:* You'd probably be happy in a classic Earning to Give role.

  **Mostly B's on Questions 1, 4, 5: The Institutional-Capture Critic**
  Your main beef isn't with charity, it's with power. You worry that private donations let the state off the hook (the substitution illusion) and warp public priorities toward what donors like rather than what citizens need. You think focusing on individual donations ignores the systemic levers that actually change welfare.
  *   *Verdict:* You think EA is too focused on patching holes in a boat that needs steering elsewhere.

  **Mostly B's on Questions 2, 3, 6, 8: The Clean Hands / Measurability Critic**
  You're worried about the human element. You think relying too much on metrics (measurability bias) makes us ignore important but fuzzy goods (like culture or policy). You also worry that making money in harmful industries rots your moral reasoning (clean hands), and that trusting models over your own judgment (epistemic outsourcing) is dangerous.
  *   *Verdict:* You think the movement is too cold, too metric-obsessed, and ignores the cost to the donor's soul.

  **Mostly C's or a Wild Mix: The Unnamed Middle Combo**
  This is the weird one. Logic allows this position, but nobody really lives here because it's hard to act on. You acknowledge the substitution problem but think it's context-dependent. You trust metrics but want to keep your moral intuition sharp. You'd earn to give but only in specific industries. It's a highly nuanced, conditional view that requires constant case-by-case judgment.
  *   *Verdict:* You're the person who says "it depends" at every dinner party. Philosophically robust, practically exhausting.

  **Mostly B's Everywhere: The Systemic Skeptic**
  You reject the premise. You think the metrics are flawed, the jobs are corrupting, and the institutional effects are net negative. You likely prefer direct political action or community organizing over any form of philanthropic arbitrage.
  *   *Verdict:* You and your friend were probably arguing because you're operating from totally different frameworks.

  *Note: If you scored high on A's but also high on B's for Q2 and Q8, you might be a Defender suffering from Epistemic Outsourcing worries—you want to trust the math, but you're scared of losing your own compass.*

  Hope this helps clear things up. Or gives you new things to argue about. probaly both.
