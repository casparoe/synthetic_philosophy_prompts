answer: |-
  This is a really sharp puzzle. You've effectively reconstructed the "Systemic Complicity Objection" to standing theories and pushed it to its nihilistic conclusion. You're right to be worried: if your theory of standing implies that no one can blame anyone for climate change, patriarchy, or late-stage capitalism because we're all implicated, you've lost the normative bite of blame exactly where it's needed most.

  Here is a diagnosis of the argument, a proposal for which step to reject, and a take on the "acknowledgment" fix.

  ### The Diagnosis: The Explosion Point

  The argument is valid, so the problem lies in the premises. While (5) is empirically contentious, the real logical engine driving the nihilism is **(6)**.

  > **(6) Standing is a status of the blamer *with respect to the norm*, not with respect to the particular act blamed, so if it's defeated at all it's defeated across everything that norm covers.**

  **Why it looked okay:**
  This premise captures a plausible thought about integrity: if you reject the authority of a norm by violating it, you can't appeal to that norm's authority against others. It treats norms as unified legislative domains. If I reject the law against theft by stealing, I can't call the cops on you for stealing.

  **Why it's the flaw:**
  This premise conflates *norm-types* with *norm-tokens* and ignores *role-differentiation*.
  1.  **Individuation:** "The norm" is doing too much work. Is the norm "Do not contribute to animal suffering"? Or is it "Do not slaughter animals" vs. "Do not purchase slaughtered animals"? If the norms are distinct, the meat-eater violates one, the slaughterer the other. The meat-eater might be implicated in the *scheme*, but they haven't violated the *specific demand* they are levying against the slaughterer (i.e., "don't kill").
  2.  **Global Defeat:** Even if it is the same norm-type, standing is rarely all-or-nothing global. I might lack standing to blame you for *chronic* lateness because I am chronically late, but retain standing to blame you for *egregious* lateness that harms a third party. Standing is often **pro tanto** or **contextual**, not a binary switch that flips off for the entire moral domain.

  **The Cost of Rejecting (6):**
  If you reject (6), you do not lose the structural hypocrisy intuition. You simply localize the defeat.
  *   **Structural Hypocrisy:** A lacks standing to blame B for *their specific role* in the scheme if A's benefit from the scheme makes A's demand incoherent or authoritative-less *in that context*.
  *   **The Gain:** You avoid the conclusion that A lacks standing to blame B for *anything* related to the scheme. The editor might lack standing to blame the grad student for CV-padding if the editor's own publication demands force that padding, but the editor retains standing to blame the student for plagiarism. The distinction between apt and inapt blame (8) is preserved.

  ### The Secondary Flaw: Premise (2)

  > **(2) A is entitled to make such a demand only if A is not, with respect to the norm grounding the demand, in a worse or equal position than B.**

  This is also doing heavy lifting. In structural hypocrisy cases, is A really in an *equal* position?
  *   **The Meat-Eater vs. Slaughterer:** The slaughterer is the direct agent of the harm. The meat-eater is a beneficiary/consumer. In many moral frameworks, the agent of harm bears more responsibility than the beneficiary. If A is in a *better* position (less directly culpable), (2) is not triggered, and standing remains.
  *   **The Cost:** If you weaken (2) to allow for *degrees* of implication, you save standing for systemic wrongs, but you have to explain *why* structural hypocrisy still feels intuitively compromising.
  *   **The Fix:** You can argue that structural hypocrisy doesn't *defeat* standing (make it zero), but it **diminishes** it (makes it pro tanto). The blame is less apt, or the blamer must adopt a different tone (solidarity vs. tribunal). This preserves your intuition without the nihilism.

  ### Addressing the "Smoking Parent" Worry

  You wrote: *"My friend says the flaw is (6)... But if I just localize it I don't see how I still get the smoking parent."*

  You can keep the smoking parent case without accepting global norm defeat. The smoking parent case works because of **specific obligation**, not just general norms.
  *   The parent has a special obligation to the child to model healthy behavior *regarding the child's environment*.
  *   The structural hypocrisy case (Editor/Student) involves agents who are often peers or participants in a market, not necessarily bound by the same specific fiduciary duty.

  If you reject (6), you say: The parent loses standing regarding *smoking* (specific token/type), but not regarding *lying* or *safety*. This is exactly what we want. The parent *does* have standing to blame the kid for cheating on taxes. The fact that the parent smokes doesn't strip them of all moral authority, only authority on that specific issue.

  So, rejecting (6) actually *helps* you explain the parent case more precisely. It explains why the parent is silenced on smoking but not on everything else. Your original argument (with 6 included) forced you to say the parent loses standing on *health norms* broadly, which is too broad.

  ### The "Acknowledgment" Fix

  You asked: *"Could the fix be that standing is restored by acknowledging implication, i.e. that self-blame buys it back?"*

  This is a promising avenue, but I would caution against framing it as "restoring standing." Standing is usually a precondition for the blame, not a result of it. If you lack standing, you lack the authority to speak.

  However, there is a robust literature (e.g., Macalester Bell, Christopher Fritz) suggesting that **acknowledging one's own complicity changes the *mode* of address**, which neutralizes the standing objection.

  *   **The Tribunal Model:** If I blame you from a position of moral superiority ("I am clean, you are dirty"), structural hypocrisy undermines me.
  *   **The Solidarity Model:** If I blame you while acknowledging my own dirt ("We are both in this mess, but this specific act is wrong"), I am not claiming a clean-hand authority I don't possess. I am appealing to a shared standard we are both failing.

  **Does this make standing cheap?**
  It doesn't make standing cheap; it makes it **conditional on humility**.
  *   If the Editor says: "You must stop CV-padding," (while padding their own), they lack standing.
  *   If the Editor says: "I know the system forces us to pad CVs, and I do it too, but we need to find a way to stop because it devalues our work," they are not engaging in *blame* in the strict second-personal demand sense; they are engaging in **moral repair** or **collective deliberation**.

  **The Verdict on Acknowledgment:**
  Don't say acknowledgment *restores* standing. Say that acknowledgment **dissolves the standing objection** by shifting the speech act from a *demand* (which requires authority) to an *appeal* (which requires shared vulnerability). This allows you to keep (3) (implication matters) and (8) (distinction between apt/inapt), without falling into nihilism. The "apt" blame in structural cases is the blame that acknowledges the structure.

  ### Summary of Recommendations

  1.  **Reject (6).** Standing is not global with respect to the norm; it is local to the specific violation and the specific relationship. This stops the nihilism.
  2.  **Nuance (2).** Move from a binary "equal/worse position" to a **scalar model of complicity**. Structural hypocrisy *mitigates* standing rather than extinguishing it. This explains why the meat-eater's blame feels "compromised" (as you intuited) but not "impermissible."
  3.  **Reframe the Acknowledgment Fix.** Don't treat it as buying back standing. Treat it as changing the *nature of the blame*. In systemic wrongs, the only *apt* blame is collective blame that includes the blamer.
  4.  **Save the Parent Case.** The parent case survives because the norm violation is identical and the relationship is fiduciary. The structural cases differ because the roles (consumer vs. producer) are different, allowing for a distinction in culpability that preserves some standing.

  This approach lets you keep the core insight—that our entanglement in bad systems complicates our moral authority—without forcing you to conclude that we must remain silent in the face of injustice. In fact, it suggests that the *only* way to have standing in systemic cases is to acknowledge the entanglement. That's a strong positive thesis for a dissertation.
