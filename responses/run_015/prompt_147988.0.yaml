      *   *Premise (5):* "Nearly universal." This depends on how we define "scheme." If the scheme is "patriarchy," yes. If the scheme is "this specific instance of lying," maybe not.
      *   *Premise (6):* **The Strongest Candidate for Rejection.** The claim that standing is global with respect to the *norm* rather than the *violation* or the *relationship*. If I violate a norm once, do I lose standing to enforce it forever? Most theories say no (unless it shows a deep character flaw). If I benefit from a system, do I lose standing to object to specific atrocities within it?
