      *   **Why it's wrong:** Standing is often relational and contextual. I can lack standing to blame you for X because I do X, but retain standing to blame you for Y (even if X and Y fall under the same broad norm "Don't harm others"). More importantly, standing can be *graded* or *mitigated* rather than binary (all or nothing).
