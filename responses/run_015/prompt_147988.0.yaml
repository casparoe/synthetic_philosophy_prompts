      *   **The "Acknowledgment" Question:** Address the self-blame idea. It's not that standing is "bought back," but that the *objection* loses force. The "moral conversation" changes.
      *   **Proposal:** A "Pro Tanto" model of standing. Structural hypocrisy *diminishes* standing or makes blame *less apt*, but doesn't extinguish it entirely unless the complicity is direct and knowing. This saves the intuition (it's compromised) without the nihilism (it's gone).

