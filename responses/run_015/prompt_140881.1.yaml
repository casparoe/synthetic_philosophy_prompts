answer: |-
  **The Slide Text (149 words)**

  Vienna Social Museum, 1930. A wall chart displays ten identical lung pictograms in a row. Three are solid black; seven are outline-only. Caption: "Silicosis Incidence Among Quarry Workers." Two viewers, a union rep and a mine owner, both fluent in ISOTYPE conventions, stand before it. The union rep sees evidence of crisis: 30% diseased. The owner sees technical compliance: 30% over the disability threshold, 70% manageable. The divergence stems from the transformation step: continuous medical data was binarized for visual clarity. Adding a verbal qualifier ("Defined as >20% impairment") fails to resolve the dispute. The visual binary overrides the text; the white lungs are perceived as 'healthy' regardless of the footnote. The table shows percentages; the chart creates categories. The picture does not merely display the statistic; it constructs the reality of 'healthy' versus 'sick' through abstraction, generating a factual disagreement about the seven white lungs that the raw data does not contain.

  ***

  **The Analysis**

  **The Naive Realist**
  They would argue the image is transparent and the viewers are projecting ideology onto a neutral surface. For them, the disagreement is psychological, not pictorial. They'd claim the caption *does* fix it objectively, and if the union rep still sees "healthy," that is a failure of literacy or honesty, not of the depiction. The picture merely resembles the lungs; the error lies in the mind, not the medium.

  **The Goodman-ish Camp**
  Goodman would say resemblance is irrelevant; this is a conflict of symbol systems. The black/white distinction is a syntactic differentiation within a specific scheme. The disagreement arises because the viewers are applying different interpretive habits to the same symbols. The chart is dense in some respects (visual weight) but articulate in others (count). The problem isn't ambiguity, but that the symbol system lacks the syntactic differentiation to denote the continuum between "white" and "black," forcing a false dichotomy.

  **Neurath's Position**
  Neurath would admit the chart is incomplete without the social context of its use. He cannot declare one reading metaphysically "correct" because he is anti-foundationalist; there is no neutral protocol language to adjudicate. He would judge the chart by its *purpose*: if the goal is worker safety, the union reading is functionally valid; if legal liability, the owner's is. He'd argue the transformation step was poorly calibrated for the intended audience, not that the method failed. However, this case cuts against his educational optimism: it shows the visual form actively resisting the verbal correction he claimed would stabilize meaning.

  **The Crucial Feature**
  The binarization of continuous data. If you remove the visual black/white split and hand them the table of percentages, they agree on the facts (who has 19%, who has 21%) and only argue policy. The picture *creates* the fact of "health" for the 19% group by visually assimilating them into the "empty/normal" category. The visual form does the work of erasure that the table leaves explicit.

  **The Neutrality Defender's Escape**
  They will argue this is a dispute about data selection (the threshold), not depiction. They'll say the bump is in the statistics, not the carpet of the design. This is weak. The threshold exists in the table too, but the table displays the near-misses. The ISOTYPE transformation *hides* the near-misses by giving them the same visual weight as the unexposed. The depiction enforces the statistical simplification physically.

  **Can a Neurathian Say One Reading is Correct?**
  No, not without tacitly relying on a specific social aim (e.g., "the aim is to prevent suffering"). Neurath rejects a mirror-of-nature truth. If he claims the union reading is correct, he is relying on a physicalist ethic (human welfare) rather than a semantic one. This case explains precisely why he insisted pictures could never be a full language: they lack the syntactic negation and qualification required to handle thresholds without misleading. The picture forces a distinction the world doesn't have, proving it cannot carry the full weight of logical proposition alone.
