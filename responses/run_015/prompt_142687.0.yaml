          3.  For each requirement: Consideration + Status (Non-negotiable vs. Camp Preference).
          4.  Analysis of hidden joint unsatisfiability (fluidity vs. stability).
          5.  Criteria for project failure.
      *   **Tone:** Professional, analytical, supportive but critical (senior colleague).

  2.  **Deconstruct the Core Problem:**
      *   *Predictive Processing (PP):* Brains minimize prediction error. But what counts as an "error"? Is it just a mathematical residual (statistical)? Is it a failed action (functional)? Is it a "mistake" in the folk-psychological sense (intentional/representational)?
      *   *Non-human Animals:* We can't ask them if they meant to do that. We infer cognition from behaviour. This makes the "intentional mistake" category very wobbly.
      *   *Hofstadter's Fluid Concepts:* Concepts aren't static boxes; they slip and slide based on context (e.g., *Fluid Concepts and Creative Analogies*). Applying this to "error" means "error" isn't one thing, but a cluster that shifts depending on the explanatory context.
      *   *The Tension:* Philosophy of science usually wants clear definitions for empirical testing. Hofstadter wants fluidity. How do you reconcile a slippery concept with the need for rigorous scientific explanation?

  3.  **Drafting - Section by Section:**

      *   **Introduction/Brainstorm:** Why is "error" slippery here?
          *   It spans levels of analysis (Marr's levels).
          *   It spans ontology (math vs. mind).
          *   It spans normativity (is a deviation *bad* or just *different*?).
          *   In animals, the "intentional" layer is inferred, not reported.

      *   **Desiderata (The Meat):**
          *   *Cases:* Need to distinguish noise from signal. A bird missing a seed vs. a bird choosing a bad seed.
          *   *Distinctions:* Don't collapse variance (statistical) with failure (functional).
          *   *Empirical Consistency:* Must fit what we know about animal learning (e.g., reward prediction error in dopamine systems).
          *   *Hofstadterian Features:* Keep context-sensitivity, maybe abandon the heavy computational baggage of Copycat if it doesn't fit neurobiology.
          *   *Status:* Need to mark what is essential (Non-negotiable) vs. what is theoretical flavour (Camp Preference).

      *   **The Hidden Tension (Joint Unsatisfiability):**
          *   If "error" is too fluid, it loses predictive power. If it's too rigid, it fails to capture the phenomenon.
          *   The risk is making the concept *so* flexible it explains everything and nothing (the "just-so story" problem).

      *   **Failure Conditions:**
          *   What kills the project in 6 months?
