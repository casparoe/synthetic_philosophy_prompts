answer: |-
  Here is your Q&A prep sheet. I've ordered these by "lethality"—starting with the objections that can sink the chapter if you fumble them, down to the ones that are just skirmishes.

  I have written the objections in the voice of the specific committee member most likely to ask them. The replies are timed for about two minutes of spoken defense (approx. 250–300 words). I have explicitly flagged the **Soft Spot** in each reply where you are vulnerable to follow-up.

  ### 1. The "Neural Substrate" Objection (High Damage)
  **Who:** Clinical Neuropsych
  **The Objection:** "You're claiming external notebooks or corporate charters give 'mass' to a self. But in split-brain cases, when the commissurotomy is done, the *neural* disconnection is what drives the behavioral divergence. The notebook is just a prosthetic. If you remove the notebook, the patient adapts. If you remove the brain tissue, the self is gone. Why are you prioritizing the prop over the engine?"

  **Your Reply:**
  "That's a crucial distinction, and I agree the brain is the engine. However, 'Narrative Inertia' isn't about what *generates* the agency, but what *stabilizes* it over time. In clinical settings, we see that without external scaffolding—like shared logs or therapy structures—split hemispheres often drift into conflicting narratives that cause distress or functional failure. The neural substrate provides the capacity for consciousness, but the institutional scaffolding provides the *continuity* required for moral responsibility.
  Think of it like a gyroscope. The brain is the spinning mass, but the institutional scaffolding is the gimbal that keeps it upright. If you blame a patient for a conflict that arose because their 'gimbal' (their external support system) was removed, you're blaming them for a stability failure, not an agency failure. My claim is that blame should track the stability of the narrative center, not just the presence of neural tissue."

  **⚠️ Soft Spot:** You are conflating *functional stability* with *moral worth*. They can press you on whether a well-supported delusion counts as a "self" under this view.

  ### 2. The "Binary Liability" Objection (High Damage)
  **Who:** Corporate Law Guy
  **The Objection:** "The law requires a binary answer for *mens rea*. Either the corporation intended the harm, or it didn't. You're suggesting a merged company hosts 'partial narrative centers.' In court, 'partial personhood' doesn't exist. If I can't put a partial center in jail or fine it specifically, how does your theory change anything other than making verdicts more confusing?"

  **Your Reply:**
  "I'm not arguing for 'partial personhood' in the statutory sense, but for *apportioned liability* based on narrative continuity. Currently, when Company A merges with Company B, the law often treats the new entity as a clean slate or a total absorption. This allows specific negligent cultures from the pre-merger entities to hide.
  If we recognize 'Narrative Inertia,' we can trace specific decision-making pathways that survived the merger because their external scaffolding (emails, standard operating procedures, middle-management structures) remained intact. It changes prosecution from asking 'Who is the person?' to 'Which narrative stream sustained the negligence?' This allows for targeted sanctions—like dismantling specific procedural scaffolds—rather than blunt fines that punish shareholders who had no narrative connection to the harm."

  **⚠️ Soft Spot:** You are handwaving the *mechanism* of targeted sanctions. Legal precedent relies on distinct entities; you're proposing a new form of equitable remedy without a clear statutory hook.

  ### 3. The "Reification" Objection (High Damage)
  **Who:** Philosophy of Mind
  **The Objection:** "Dennett called it a 'center of narrative gravity' specifically to avoid ontological commitment. It's a useful fiction. You're taking 'Inertia'—another metaphor—and treating it like it has causal power. You can't build a theory of blame on a metaphor squared. How does narrative inertia *cause* anything if it isn't real?"

  **Your Reply:**
  "That's a fair reading of Dennett, but I'm pushing the instrumentalism further. Even if the center is a fiction, the *resistance to change* is empirically measurable. We can measure how hard it is to alter a corporate culture or a patient's self-concept based on the density of their external records.
  I'm not claiming 'Inertia' is a physical force like gravity. I'm claiming it's a systemic property of distributed cognitive systems. When we assign blame, we aren't punishing a soul; we're trying to modify future behavior. If 'Narrative Inertia' predicts where behavioral modification will fail or succeed better than 'brain-bound individualism,' then it has sufficient ontological weight for a normative theory. It's real enough to break."

  **⚠️ Soft Spot:** "Real enough to break" is a pragmatic dodge. They can ask if *any* stable pattern counts as a self (e.g., a river, a storm), forcing you into a Sorites paradox.

  ### 4. The "Phenomenology" Objection (Medium-High Damage)
  **Who:** Clinical Neuropsych
  **The Objection:** "I work with DID and split-brain patients. They report feeling like whole persons, even when their data is fragmented. You're saying they are 'partial centers' based on their notebooks. Are you telling me their first-person reports of unity are less valid than your third-party assessment of their file structure?"

  **Your Reply:**
  "Not less valid, but context-dependent. First-person unity is often a *goal* of the narrative, not a description of the underlying architecture. In DID, alters often present as whole persons, but their 'Inertia' is fragile—it collapses under specific triggers or lack of therapeutic scaffolding.
  My point isn't to invalidate their experience, but to protect them. If the law treats them as a single, unified agent because they *say* they are, we might hold them responsible for actions taken by an alter that had no access to that narrative scaffolding. Recognizing the fragmentation in the *external* story protects the patient from being blamed for gaps in their internal coherence that they cannot control."

  **⚠️ Soft Spot:** You are privileging the external record over the internal experience. This is ethically risky and can be framed as ableist.

  ### 5. The "Sanctioning" Objection (Medium Damage)
  **Who:** Corporate Law Guy
  **The Objection:** "Okay, let's say I accept your 'apportioned liability.' You have a merged company. You find a 'partial narrative center' guilty. Do you fine the division? Fire the managers? If the narrative center is just a story propped up by emails, how do you punish the story without punishing the innocent people currently working there?"

  **Your Reply:**
  "You punish the *structure* that maintains the inertia. If a specific decision-making narrative survived a merger because a specific set of protocols was kept, the sanction should be the forced dissolution of those protocols.
  Think of it like probation for a process. We don't just fine the entity; we mandate the rewriting of the 'story'—the standard operating procedures—that allowed the harm. This shifts the focus from retributive blame on individuals who might have just been following scripts, to restorative changes on the institutional scaffolding that gave the harmful narrative its mass."

  **⚠️ Soft Spot:** This sounds like regulatory compliance, not criminal law. The Law Guy might press you on whether this actually counts as "prosecution" or just administrative oversight.

  ### 6. The "Boundary" Objection (Medium Damage)
  **Who:** Philosophy of Mind
  **The Objection:** "If external scaffolding constitutes the mass of the self, where does the self end? Does my self include the server hosting my emails? The friend who remembers my past? If narrative inertia is the metric, doesn't the self bleed into everything it touches, making blame assignment impossible because everyone is partially responsible for everyone?"

  **Your Reply:**
  "The boundary is defined by *dependency*, not just connection. A server hosting emails is part of my narrative inertia only if my agency *fails* without it. For most of us, losing email is annoying; for a split-brain patient or a complex corporation, losing the log is catastrophic to agency.
  We draw the line where the removal of the scaffold causes a fragmentation of the narrative center. This keeps the boundary tight. It's not 'everything I touch,' it's 'everything that holds me together.' This allows us to isolate specific institutional supports without dissolving the self into the entire universe."

  **⚠️ Soft Spot:** "Catastrophic" is vague. Is it behavioral catastrophe or psychological distress? You need a clearer threshold for "fragmentation."

  ### 7. The "DID Specifics" Objection (Low-Medium Damage)
  **Who:** Clinical Neuropsych
  **The Objection:** "You're lumping split-brain and DID together. They're etiologically different. One is structural disconnection, one is trauma-based dissociation. Using the same 'Narrative Inertia' model for both risks ignoring the trauma component which is internal, not institutional."

  **Your Reply:**
  "You're right that the etiology differs, but the *functional problem* for blame assignment is the same: there is a discontinuity in memory and agency that the external record can bridge or expose.
  In trauma cases, the 'scaffolding' is often the therapeutic alliance or the journaling used to integrate alters. In split-brain cases, it's physical notebooks. The *material* of the scaffold changes, but the *function*—providing a shared space for disparate centers to coordinate—remains the same. My theory applies to the function of the scaffold in assigning responsibility, not the medical cause of the fragmentation."

  **⚠️ Soft Spot:** You are glossing over the role of *trauma* as a negative scaffold. Trauma actively builds walls, not bridges. You might be oversimplifying the clinical reality.

  ### 8. The "Extended Mind" Objection (Low Damage)
  **Who:** Philosophy of Mind
  **The Objection:** "This sounds exactly like Clark and Chalmers' Extended Mind thesis, just with more drama. They argued tools are part of the mind. You're arguing tools are part of the self. What's the actual theoretical gain here? Why not just use Extended Mind?"

  **Your Reply:**
  "Extended Mind focuses on *cognitive processing*—where does the calculation happen? Narrative Inertia focuses on *moral persistence*—who stays the same over time?
  A calculator can be part of my extended mind for math, but it doesn't hold my moral history. Narrative Inertia specifically targets the autobiographical and institutional records that sustain identity for the purpose of blame. Extended Mind explains how I think; Narrative Inertia explains why I'm still *me* enough to be held accountable for what I thought last year. It's a normative upgrade, not just a cognitive one."

  **⚠️ Soft Spot:** The distinction between "cognitive processing" and "moral persistence" is thinner than you'd like. They can argue that memory (cognitive) is the basis of responsibility (moral).

  ***

  ### 9. The "Prayer" Objection (The Trap)
  **Who:** Anyone (but usually the PoM person trying to break you)
  **The Objection:** "If Narrative Inertia is about consistent persona logs and external scaffolding, does an LLM with a persistent chat history and a system prompt count as having a self? Should we hold the AI liable?"

  **Your Reply:**
  "No, because the LLM lacks *stakes*. Narrative Inertia requires that the center of gravity matters *to the system itself*. An LLM simulates coherence, but it doesn't suffer consequences if the narrative breaks.
  The 'mass' in my theory comes from the vulnerability of the system to the loss of that scaffold. A corporation loses money; a patient loses sanity. An LLM loses nothing. It has the *appearance* of inertia, but not the *risk*. Without the capacity to be harmed by the dissolution of the narrative, there is no self to blame, only a tool to be regulated."

  **⚠️ Soft Spot:** This relies on a "capacity to suffer" criterion that you haven't built into the rest of the chapter. If they press on *why* suffering is required for blame, you might have to concede that your theory relies on a hidden biological/phenomenological premise.

  ***

  ### General Defense Strategy Notes
  *   **The "Handwave" Zone:** Your biggest vulnerability is the jump from *Descriptive* (there is scaffolding) to *Normative* (therefore blame changes). If they corner you here, admit it. Say: "This chapter establishes the descriptive mechanism; the normative leap is the work of the next chapter, but I argue the descriptive gap makes current blame practices incoherent."
  *   **The Law Guy:** He wants utility. If your theory makes the law harder to apply, he will kill it. Keep emphasizing *precision* over *complexity*.
  *   **The Neuropsych:** They want respect for the patient. Never imply the patient is "less than." Frame the "partial center" language as a legal/philosophical tool for protection, not a clinical diagnosis of deficiency.
  *   **The PoM:** They want rigor. Don't fight the "metaphor" charge. Embrace it. "All self-models are metaphors; mine is the one that best handles distributed agency."

  Good luck. Don't let them smell blood on the "Soft Spots." Own them as "areas for future refinement."
