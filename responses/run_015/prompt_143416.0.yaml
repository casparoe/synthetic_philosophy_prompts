  okay so im defending my thesis chapter next thursday in front of a weird hybrid audience - half are philosophy of mind people who read Dennett and think narrative gravity is a cute metaphor but not ontologically serious, half are clinical neuropsych people who deal with split-brain and dissociative identity cases and are tired of philosophers ignoring actual patient data, and there's one corporate law guy who keeps asking if this means we should prosecute merged companies differently. my thesis is that the self is a center of narrative gravity but with this twist im calling "narrative inertia" - the center's mass comes not just from internal autobiographical coherence but from how much external institutional scaffolding props up the story, so a corporation after a merger or a split-brain patient with shared external notebooks can host partial narrative centers that arent full persons but also arent nothing, and this should change how we assign blame in both cases. i need a Q&A prep sheet: the eight or so objections ill actually get from this specific crowd, not generic anti-dennett stuff, ordered by how much damage they do. phrase them the way the neuropsych people and the law guy would actually put them. for each one give me a reply that fits in about two minutes and flag exactly where im being soft or handwavy. also include the objection im praying nobody asks - probably whether an LLM with consistent persona logs counts as having narrative inertia? and please dont ask me for citations or a reading list, i dont have library access and neither will whatever model checks this.
