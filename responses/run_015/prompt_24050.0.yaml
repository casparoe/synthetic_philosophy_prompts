  ### Diagnostic Instrument: The Causal Commitments Tree

  **Base Commitments:** All respondents accept that the world exhibits regularity, that our causal beliefs are generally reliable, and (if theist) that God is omnipotent and the ultimate source of order.

  **Instruction:** Answer the following questions sequentially. Select the option that best matches your metaphysical intuition about the case presented.

  ---

  #### Q1. The Cotton-and-Fire Case
  When fire touches cotton, does the fire possess a **genuine active power** to produce the burning, or is the fire merely the **occasion** upon which burning appears?
  *   **(A) Genuine Power:** The fire has a nature that enables it to act. → *Go to Q2.*
  *   **(B) Mere Occasion:** The fire is passive; it does not truly act. → *Go to Q3.*

  #### Q2. The Source of Power (For "Genuine Power" respondents)
  Does this power operate **independently** of God's immediate will at every moment, or does it require **divine concurrence** to act?
  *   **(A) Divine Concurrence:** The creature acts, but only because God simultaneously sustains and cooperates with the action. → *Leaf 1.*
  *   **(B) Independent:** The creature acts by powers intrinsic to its nature, without immediate divine intervention. → *Go to Q6.*

  #### Q3. The Source of Order (For "Mere Occasion" respondents)
  Since the fire does not act, what explains the reliable sequence of fire followed by ash?
  *   **(A) Divine Will:** God directly wills the burning at every instance, creating the sequence by habit of His own will. → *Go to Q4.*
  *   **(B) Natural/Mental Order:** The sequence arises from natural regularity or structures of the mind, without direct divine volition at every moment. → *Go to Q5.*

  #### Q4. The Nature of Denial (For "Divine Will" respondents)
  Is the fire's inability to burn a matter of **metaphysical impossibility** (it literally cannot act), or **epistemological humility** (we cannot know if it acts)?
  *   **(A) Metaphysical Impossibility:** Creaturely causation is ontologically false; only God acts. → *Leaf 2.*
  *   **(B) Epistemological Humility:** Creaturely causation may exist, but we cannot demonstrate necessary connection, so we attribute it to God. → *Leaf 3.*

  #### Q5. The Locus of Necessity (For "Natural/Mental Order" respondents)
  Is the "connection" between fire and ash a relation between **events in the world**, or a rule imposed by the **mind**?
  *   **(A) Events in the World:** Causation is a feature of external reality (succession or dependence). → *Go to Q6.*
  *   **(B) Rule of the Mind:** Causation is a feature of how we must think about reality. → *Go to Q7.*

  #### Q6. The Structure of Connection (For "Events" respondents)
  *Note: Reachable from Q2(B) or Q5(A).*
  Is the causal relation best described as **constant conjunction/dependence** between distinct events, or as a **powerful production** rooted in substance?
  *   **(A) Conjunction/Dependence:** Causation is just events following one another (or counterfactual dependence) without a "tie." → *Go to Q8.*
  *   **(B) Powerful Production:** Causation involves the active bringing-about of an effect by a substance. → *Go to Q9.*

  #### Q7. The Origin of the Rule (For "Rule of the Mind" respondents)
  Is this mental rule derived from **customary habit** (a posteriori) or from the **structure of understanding** (a priori)?
  *   **(A) Customary Habit:** We feel a determination after repeated observation. → *Leaf 7.*
  *   **(B) Structure of Understanding:** Causation is a necessary condition for experience itself. → *Leaf 8.*

  #### Q8. Event Relations (For "Conjunction/Dependence" respondents)
  Is causation defined by **observed regularity** alone, or by **counterfactual dependence**?
  *   **(A) Observed Regularity:** To cause is simply to be constantly conjoined. → *Leaf 4.*
  *   **(B) Counterfactual Dependence:** To cause is to be such that the effect would not occur without it. → *Leaf 5.*

  #### Q9. Powerful Production (For "Powerful Production" respondents)
  Is the power best understood as a **dispositional essence** (defined by what it does), or as **active production** (defined by the making itself)?
  *   **(A) Dispositional Essence:** A thing's nature is its causal profile. → *Leaf 6.*
  *   **(B) Active Production:** Causation is the transference of energy or activity distinct from mere disposition. → *Leaf 9.*

  ---

  ### The Leaves: Positions and Commitments

  **Leaf 1: Thomistic Secondary Causation (includes Suárez)**
  *   **Position:** Creatures are true causes, but God is the primary cause sustaining them. Suárez is merged here because he defends secondary causality against occasionalism, despite emphasizing instrumentalality.
  *   **Most Awkward Commitment:** You must explain how one effect has two total causes (God and creature) without splitting the effect into two parts or making God a competitor.

  **Leaf 2: Ghazālī's Strict Occasionalism**
  *   **Position:** Creatures have no power; God creates the effect directly on the occasion of the creature.
  *   **Most Awkward Commitment:** You must accept that God directly wills every single instance of burning, making the natural world purely passive and divine action indistinguishable from miracle.

  **Leaf 3: Maimonidean Occasionalism**
  *   **Position:** Distinguished from Ghazālī by treating the denial of creaturely power as primarily epistemological (we cannot know necessity) rather than strictly metaphysical, though often converging in practice.
  *   **Most Awkward Commitment:** You must maintain a robust natural order for daily life while insisting we have no rational ground to affirm its necessity, creating a tension between practice and theory.

  **Leaf 4: Hume's Regularity View**
  *   **Position:** Causation is nothing more than constant conjunction of events in the world; there is no necessary connection.
  *   **Most Awkward Commitment:** You must deny that there is any "glue" holding the universe together, reducing laws of nature to mere descriptions of history.

  **Leaf 5: The Counterfactual-Dependence View**
  *   **Position:** Causation is defined by dependence relations across possible worlds (if C had not occurred, E would not have).
  *   **Most Awkward Commitment:** You must commit to the reality or utility of possible worlds to explain actual causation, which many find metaphysically extravagant.

  **Leaf 6: Dispositional Essentialism**
  *   **Position:** A kind's essence is its causal profile; powers are real properties of substances. (Merged with Production View where they overlap, but distinguished here by focus on essence).
  *   **Most Awkward Commitment:** You risk circularity, defining powers by their effects and effects by their powers, unless you can ground dispositions categorically.

  **Leaf 7: Hume's Belief-Based (Projection) View**
  *   **Position:** Necessity is not in the world but is a feeling of determination projected by the mind after habit.
  *   **Most Awkward Commitment:** You make causation a psychological state rather than a feature of reality, implying the universe itself is unintelligible.

  **Leaf 8: The Transcendental View (Kantian)**
  *   **Position:** Causation is a rule of the understanding necessary for experience, not a feature of things-in-themselves.
  *   **Most Awkward Commitment:** You must accept that we can never know causation as it truly exists in reality, only as it appears to us.

  **Leaf 9: The "Production" View**
  *   **Position:** Causation is the active bringing-about of an effect, distinct from mere regularity or disposition (often aligned with process or transference theories).
  *   **Most Awkward Commitment:** You must posit a notion of "activity" or "transference" that is notoriously difficult to define without resorting to metaphor (e.g., "oomph").

  ---

  ### Diagnostic Notes for the Seminar

  **Indistinguishable Leaves:**
  *   **Leaf 7 (Hume Projection) and Leaf 8 (Transcendental):** The tree separates these by the origin of the rule (habit vs. a priori). However, in practice, both locate necessity in the subject rather than the object. To truly separate them, an additional question is needed: *"Is the causal rule contingent on your past experience (could you unlearn it?) or necessary for any experience at all?"*
  *   **Leaf 6 (Dispositional) and Leaf 9 (Production):** These are often variants of the same "Powers Ontology." They are separated here by whether the focus is on the *essence* (what a thing is) or the *act* (what a thing does). If a student insists they are identical, merge them into a single "Realist Powers" leaf.

  **Unoccupied Combinations:**
  *   **Theism + Independent Creaturely Powers:** This combination (Theist who answers Q2-B) is unoccupied by the leaves above. It corresponds to **Deism** or a **Pelagianism of Causation**.
      *   *Diagnosis:* This view is theistically unattractive because it renders God idle after creation, contradicting the base commitment that God is the *ultimate source* of the order we observe. It is logically possible but theologically unstable for theists in this seminar.
  *   **Created Things Have Genuine Powers + Causal Connection is Only a Habit of the Mind:** This combination (Realist about powers, Skeptic about connection) is unoccupied.
      *   *Diagnosis:* This is **incoherent**. If one believes fire has a genuine power to burn (Q1-A), one cannot consistently claim the connection is merely a habit of the mind (Q5-B). Real powers entail real connections. No leaf occupies this because it collapses into contradiction.

  **Adjudicating Your Dispute:**
  *   **Your Position:** You likely land on **Leaf 2 (Ghazālī)**. You insist the fire does not burn (Q1-B) and that this is a metaphysical truth about the world, not just our knowledge (Q4-A).
  *   **Your Friend's Position:** Your friend argues for **Leaf 3 (Maimonides)** or potentially **Leaf 1 (Aquinas)** depending on interpretation. If they claim Ghazālī is only making an epistemological point, they are steering toward Leaf 3. If they claim Aquinas is "disguised occasionalism," they are trying to collapse Leaf 1 into Leaf 2. This tree shows that Leaf 1 requires affirming *genuine* creaturely power (Q2-A), which Leaf 2 explicitly denies. They are not the same.
