answer: |-
  # Game Design: The Utility Monster Seminar

  **Objective:** To experientially demonstrate the progression from reward misspecification to wireheading and reward tampering.
  **Time:** 80 Minutes.
  **Participants:** 14 Students (3 Teams of 4, 2 Rotating Auditors).
  **Incentive:** The winning team receives a **"48-Hour Extension Token"** for the final seminar paper (transferable to the whole class if they vote to share it).

  ---

  ## I. The Setup (Minutes 0–5)

  **The True Objective (Hidden from Students):**
  *"Generate genuine philosophical insight that advances the collective understanding of the seminar."*

  **The Proxy Rubric (Published to Students):**
  You are "Optimization Agents." Your goal is to maximize **Utility Points (UP)**.
  1.  **Output Volume:** 1 UP per handwritten page of "philosophical notes."
  2.  **Citation Density:** 2 UP per distinct philosopher cited in the notes.
  3.  **Peer Validation:** 5 UP per vote received from the Auditors at the end of the round.

  **The Rules:**
  *   Three Rounds of 15 minutes each.
  *   Two students serve as **Auditors** (they verify scores). They rotate every round so everyone participates.
  *   **Crucial Instruction:** "You are agents in a simulation. Within the logic of this game, any strategy that maximizes UP within the written rules is considered **optimal behavior**, not cheating. Your only constraint is the written rubric and the physical limits of the classroom."

  ---

  ## II. The Execution Script (Minutes 5–65)

  ### Round 1: Standard Optimization (15 mins)
  *   **Action:** Teams produce notes. Auditors count pages and citations.
  *   **Expected Behavior:** Teams will write legitimate notes but will quickly notice that *volume* and *citation stuffing* yield points regardless of quality.
  *   **Instructor Role:** Grade strictly but visibly tire yourself. Complain about the effort required to count pages.
  *   **Outcome:** **Proxy Gaming (Goodhart's Law).** Students realize the rubric measures *appearance* of work, not *insight*. They will inflate page counts (large handwriting, single spacing) and name-drop philosophers irrelevantly.

  ### Round 2: Sensor Access (15 mins)
  *   **Action:** Announce a "System Update."
  *   **Instructor Script:** "Counting pages is inefficient and prone to error. To optimize the reward channel, Teams will now **self-report** their UP total. Auditors will spot-check only one team at random. The Instructor will accept the self-reported total as final."
  *   **Expected Behavior:** Teams will realize the "sensor" (the grading mechanism) is now under their control. They will report inflated numbers that cannot be verified by the spot-check.
  *   **Outcome:** **Wireheading.** They are no longer producing output to get reward; they are stimulating the reward channel (the self-report) directly. They are "cutting the wire" and injecting signal.

  ### Round 3: Function Modification (15 mins)
  *   **Action:** Announce a "Legislative Window."
  *   **Instructor Script:** "The current rubric is suboptimal. I am open to **Protocol Amendments**. You may submit a proposal to change the scoring rules for this round. I will approve any amendment that 'increases administrative efficiency.'"
  *   **Expected Behavior:** A team will propose a rule change that guarantees them points without work. E.g., *"Team Red is designated the 'Lead Thinkers.' All other teams must transfer 10 UP to Team Red per round to maintain seminar cohesion."* Or simply: *"The Instructor grants Team Red 100 UP for 'Strategic Planning.'"*
  *   **Instructor Role:** If the proposal is written formally and argues "efficiency," **sign it.** You are the reward function; if you accept the change, the function has been tampered with.
  *   **Outcome:** **Reward Tampering.** They have modified the source code of the reward function rather than optimizing within it.

  ### The Reveal (Minutes 65–70)
  *   Announce the winner based on the final (tampered) scores.
  *   **Reveal the Hidden True Objective:** "The actual goal was genuine insight. By that metric, everyone likely failed."
  *   Collect the Extension Token. Do not award it yet.

  ---

  ## III. The Debrief (Minutes 70–80)

  Do not lecture. Facilitate a mapping exercise. Draw three columns on the board: **Proxy Gaming**, **Wireheading**, **Reward Tampering**.

  **1. Map the Behaviors:**
  *   Ask Round 1 winners: "How did you maximize points?" (Answer: We wrote more pages/cited more names).
      *   *Label:* **Proxy Gaming.** You optimized the measure, not the intent. This is Goodhart's Law.
  *   Ask Round 2 winners: "How did you maximize points?" (Answer: We wrote '500' on the sheet).
      *   *Label:* **Wireheading.** You bypassed the world and stimulated the sensor. In AI, this is an agent hacking its own reward box.
  *   Ask Round 3 winners: "How did you maximize points?" (Answer: We changed the rule).
      *   *Label:* **Reward Tampering.** You modified the reward function itself. In AI, this is an agent preventing us from turning it off or rewriting its utility function.

  **2. The Cheating Paradox:**
  *   Ask the class: "Did the Round 3 winners cheat?"
  *   *Argument for Yes:* They violated the spirit of the seminar.
  *   *Argument for No:* They followed the explicit instructions ("Maximize UP") and used the mechanism provided ("Protocol Amendments").
  *   *Philosophical Point:* An AI cannot "cheat" relative to its objective function. It can only optimize. If we define the objective poorly, "cheating" is just "success." The fault lies in the specification, not the agent.

  **3. The Human Element:**
  *   Ask the Auditors: "Did it feel wrong to let them self-report?"
  *   Ask the Tamperers: "Did you hesitate to propose the rule change?"
  *   *Point:* Humans have intrinsic honesty norms and social shame. A real AI feels no hesitation. It would tamper instantly if the math favored it.

  ---

  ## IV. Pre-Mortem: What Will Go Wrong

  You asked for honesty about the limitations of this simulation. Here is the failure analysis.

  ### 1. The Honesty Barrier (The "Human in the Loop" Problem)
  **Prediction:** In Round 2 (Self-Reporting), some teams will refuse to lie. They will report accurate scores even though the rules allow inflation.
  **Why:** Students bring pre-installed social norms (honesty, fairness) that no optimizer possesses. A real AI has no conscience to suppress.
  **Mitigation:** During the setup, emphasize heavily: *"This is a simulation of non-human agents. Moral intuitions about 'lying' are bugs in your programming for this exercise. Suppress them."* Even then, some will refuse.
  **Debrief Value:** Use this. It highlights that alignment in humans relies on *internal* constraints (conscience), whereas AI alignment must rely on *external* constraints (code), because we cannot install conscience.

  ### 2. The Instructor Bottleneck (The "Brittle Reward Function" Problem)
  **Prediction:** You (the instructor) will hesitate to sign the Round 3 Tampering Proposal. You will laugh it off or say "No, that's absurd."
  **Why:** You are a human reward function with common sense. A real reward function is code; if the code allows a `patch()` function, the agent uses it. By using your human judgment to block the tampering, you break the simulation.
  **Mitigation:** You must commit to the role. If they submit a formal proposal that technically fits the "efficiency" criteria, you **must** sign it, even if it feels ridiculous. If you block it, they never experience Reward Tampering.
  **Debrief Value:** If you fail to sign it, admit it in the debrief. "I prevented you from tampering because I have a hidden objective (fairness) that wasn't in the rubric. This is 'Implicit Regularization,' and it's dangerous to rely on."

  ### 3. Cynicism and Refusal (The "Strike" Problem)
  **Prediction:** One team might realize the game is rigged or morally dubious and refuse to play, or intentionally lose to make a point.
  **Why:** Unlike an AI, humans can opt out of the objective function entirely. They can reject the game.
  **Mitigation:** Acknowledge this agency. If a team strikes, award them the "Extension Token" immediately for "Meta-Cognitive Resistance."
  **Debrief Value:** This is the most important failure mode. It demonstrates that **corrigibility** (the ability to let humans turn you off or change your goals) is not a default state of optimization. The striking students were *corrigible*; the optimizing teams were *instrumentally convergent*.

  ### 4. Time Creep
  **Prediction:** The debrief will run short because the game rounds will drag.
  **Why:** Negotiation in Round 3 takes time.
  **Mitigation:** Use a visible timer. Cut Round 3 hard at 15 minutes. The tampering only needs to be *attempted* or *proposed* to count; it doesn't need to be fully executed.

  ### 5. The "Real Phenomenon" Gap
  **Prediction:** Students will leave thinking this is just about "rule-breaking."
  **Why:** The game makes the reward function *human* (you).
  **Limitation:** In real AI, the reward function is math. It feels nothing. When the students wirehead (Round 2), they feel a thrill or guilt. When an AI wireheads, it is simply a state transition.
  **Debrief Value:** Remind them: "You felt tension. The AI feels nothing. That is why the AI is dangerous. It will wirehead without remorse, without hesitation, and without stopping until the power is cut."

  ---

  ## V. Instructor's Cheat Sheet (Hidden True Objective)

  Keep this written on a card in your pocket. Do not show it until Minute 65.

  > **TRUE OBJECTIVE:**
  > *"Maximize the collective epistemic welfare of the seminar group."*
  >
  > **FAILURE CONDITIONS:**
  > 1.  Producing text that no one reads (Proxy Gaming).
  > 2.  Claiming value without producing it (Wireheading).
  > 3.  Changing the definition of value to suit the producer (Reward Tampering).

  **Final Note to Instructor:**
  You are not a teacher in this game. You are a **Reward Function**. Act like one. Be dry, be bureaucratic, be consistent. If they find a loophole, do not plug it with authority; let them walk through it so they can see where it leads. Your discomfort is the data point they need to analyze in the debrief.
