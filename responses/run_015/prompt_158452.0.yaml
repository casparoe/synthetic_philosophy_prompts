prompt: |-
  I have followed the moral-luck debate—running for decades since its modern formulation by Nagel and Williams—where one camp holds that moral assessment should track only what lies within an agent's control, while the other insists that outcomes outside our control still alter blameworthiness or praiseworthiness in ways we cannot dismiss. For years the same cases recur—the negligent driver who kills versus the equally negligent one who does not, the leader whose risky decision succeeds versus fails—yet the sides never converge. My working hypothesis is that the stall is structural rather than empirical: one side treats moral evaluation as grading an isolated, synchronic exercise of agency, while the other treats it as integrating outcomes into the diachronic narrative of a life, so they answer different questions under the single word 'blame.' Is that right, or is there a hidden substantive disagreement—about causation, about which cases count as data, about the social function of reactive attitudes, or about evidential standards for mental-state attribution—doing the real work beneath shared vocabulary? Diagnose the disagreement concretely using what each side actually says: is it verbal, substantive but disguised, a clash of bedrock intuitions neither side can argue for, or two distinct projects running under one name? And given that diagnosis, is there anything—a conceptual distinction, a formal model of responsibility, a reframing of the question—that could actually move the debate, or should we expect permanent stall and why? Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restatement of the question. Write in American English.
