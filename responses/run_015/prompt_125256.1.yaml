answer: |-
  ### Activity Setup
  Divide the 16 students into two councils of eight to ensure adequate airtime. Assign each student a public role (e.g., Head Librarian, Security, Parent Rep, Student Worker) and a hidden Cultural Script Card. Scripts detail non-negotiable practices required for participation (e.g., "Must wear head covering," "Prayer break at 2 PM," "No physical contact with opposite sex"). Include "Secular Absolutist" scripts that view visible religious symbols as disruptive to neutrality.

  **Timeline (80 mins):**
  1.  **Intro & Distribution (15 mins):** Explain the goal: design three operational rules for the "Civitas Library." Students read scripts privately.
  2.  **Negotiation (40 mins):** Councils draft three universal rules. They want collective points but lack knowledge of others' scripts.
  3.  **Reveal & Scoring (10 mins):** Players reveal scripts. Apply rules to check for conflicts.
  4.  **Debrief (15 mins):** Philosophical mapping of outcomes.

  The core tension: Students must write rules sounding neutral to pass, but specific enough to function. If a rule makes a script impossible without abandoning the practice, that player takes an Exclusion Token. The group only wins if *zero* tokens are issued. This forces them to gamble on what "neutrality" costs others.

  ### Rules and Materials
  **Materials:** Script Cards (hidden), Role Cards (public), Rule Worksheet, Red Exclusion Tokens.
  **Script Design:** Ensure 50% of cards require visible identity markers or schedule adjustments. Include one "Secular Absolutist" per council to mimic republican pressure.
  **Rule Constraints:** Rules must apply to all users and staff equally. No exceptions clauses allowed (mimicking universalism). Phrasing must be operational (e.g., instead of "dress well," use "no head coverings").
  **Scoring:** After drafting, players privately check if rules conflict with their script. If a rule forces them to choose between the library and their practice, they place a red token in the center.
  **Win Condition:** If the center has any red tokens, the council gets zero points. If clean, everyone gets points. This incentivizes finding overlapping consensus but risks gridlock or invisible coercion. Facilitators must enforce that rules cannot be vague; they must be enforceable by a security guard without interpretation.

  ### Debrief and Conceptual Mapping
  Start by comparing the two councils' rules. Did they converge on "no symbols" or "flexible scheduling"? Map specific rules to philosophical frameworks. A rule banning "visible religious symbols" maps to French *laïcité*: neutrality requires the invisibility of particular identities in the public sphere. This treats the citizen as abstract, burdening those whose identity is embodied.

  Conversely, rules allowing "private prayer rooms" or "flexible breaks" map to Anglo-American pluralism (Kymlicka): neutrality means state accommodation so different identities can participate equally. Discuss the language used during negotiation. Did students say "professional attire" to mask a ban on hijabs? This reveals how republican universalism often codifies majority norms as neutral.

  Highlight the exclusion tokens. Those who took tokens felt the cost of "fair" rules. Those who didn't know others were burdened. This illustrates the asymmetry: for the majority, neutrality is non-interference; for the minority, it is assimilation. The game demonstrates why "blindness" to difference often reinforces existing hierarchies rather than eliminating them. Connect this to Cécile Laborde's critique: standard liberalism often fails to distinguish between sensitive personal practices and arbitrary preferences.

  ### Predictable Failures and Fixes
  **Failure 1: Vague Rules.** Students will write "Be respectful" to avoid tokens. **Fix:** Ban subjective adjectives. Rules must be enforceable by a security guard without interpretation.
  **Failure 2: Majority Tyranny.** Secular scripts may dominate negotiation. **Fix:** Pre-assign scripts to ensure visible minorities hold veto-power roles (e.g., Head Librarian).
  **Failure 3: Altruistic Sacrifice.** Players might take tokens to let the group win. **Fix:** Emphasize that exclusion means "leaving the library," not just losing points.
  **Failure 4: Collusion.** Players might hint at scripts. **Fix:** Enforce strict silence on script content during negotiation. Facilitators should circulate to ensure no card-peeping occurs.

  ### Limits of the Simulation
  This simulation cannot reproduce the coercive weight of state citizenship. In reality, violating *laïcité* risks job loss or legal penalty, not just game points. It also misses the historical context: French universalism arose from anti-clerical struggle, not just abstract theory. Finally, identity is treated as a static card, whereas real cultural negotiation is fluid. Students play roles; they don't live them, reducing the emotional stakes of assimilation. You guessed historical weight was the missing piece; you are correct, but add state coercion and the constitutive nature of identity.

  ### Confidence Note
  I am 85% confident this design will generate the desired tension regarding neutrality. The least certain element is the "zero exclusion" win condition. It may encourage excessive risk-aversion, leading to no rules being passed, or conversely, encourage players to sacrifice themselves silently. Monitor the token phase closely to ensure honest reporting and intervene if the group defaults to vague language to bypass the mechanic.
