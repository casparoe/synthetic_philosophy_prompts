answer: |-
  **OMNICORP HUMAN CAPITAL DIVISION**
  **REF: HCM-2024-MERIT-AUDIT**

  Dear Colleague,

  Please find enclosed your revised compensation statement for the fiscal year. Per the new Equitable Contribution Model, your remuneration has been recalibrated to reflect solely your *Attributable Agency*. All value derived from exogenous variables—factors outside your voluntary control—has been actuarially removed.

  Your Gross Value Add was assessed at $150,000.00. However, to isolate your unique moral contribution, we applied the following deductions based on your biometric and historical data:

  | Item | Adjustment | Amount |
  | :--- | :--- | :--- |
  | **Gross Value Add** | | **$150,000.00** |
  | Less: Cognitive Endowment (IQ > 115) | Unchosen Asset | -$45,000.00 |
  | Less: Socioeconomic Stabilization (No childhood poverty) | Unchosen Asset | -$30,000.00 |
  | Less: Temperament Dividend (High Conscientiousness) | Unchosen Asset | -$25,000.00 |
  | Less: Catastrophe Avoidance (No major illness/bereavement) | Unchosen Luck | -$15,000.00 |
  | Less: Risk Realization (Project Alpha success) ^1 | Unchosen Luck | -$20,000.00 |
  | **Net Attributable Agency** | | **$15,000.00** |
  | Plus: Universal Biological Subsistence ^2 | Non-Merit Base | $32,000.00 |
  | **TOTAL NET PAY** | | **$47,000.00** |

  **Methodology Note:**
  The *Net Attributable Agency* figure represents the delta between your actual performance and your Counterfactual Median Self (CMS). The CMS is a simulation of you possessing identical genetics and upbringing but experiencing median market conditions and risk outcomes. We pay only the surplus you generated above what your CMS would have achieved without your specific intervention. Please note that "being the sort of person who can be bothered" is classified under Temperament Dividend, as neural predisposition toward diligence is not a voluntary selection.

  **Regarding Universal Biological Subsistence:**
  The base payment of $32,000 is provided strictly to prevent biological cessation. It is not a reward. It carries no merit implication. It is akin to putting fuel in a company car; the car does not deserve the fuel for having wheels.

  **Footnotes:**
  ^1 *Risk Realization: Had Project Alpha failed due to market volatility, the loss would also have been deducted from your Subsistence. Since the success was probabilistic, the gain is attributed to luck, not skill.*
  ^2 *Subsistence is adjusted annually for inflation and caloric requirements.*

  ***

  **FAQ OVERLEAF**

  **Q: Why is my Net Attributable Agency so low?**
  A: This indicates high alignment between your output and your privileges. Most of your success is explained by your CMS. You are being paid fairly for the small fraction that was truly *you*.

  **Q: Can I appeal the Temperament Dividend?**
  A: Only if you can prove you chose your dopamine receptors prior to birth.

  **Q: Is the Subsistence payment merit-based?**
  A: No. Merit implies desert. Breathing is not a desert. It is a prerequisite.

  **Q: What if my Net Attributable Agency is negative?**
  A: You are still entitled to Subsistence. We do not starve negative agents. However, you will receive a performance improvement plan regarding your existence.

  Sincerely,

  **The Compensation Committee**
  *"Equity is Arithmetic"*
