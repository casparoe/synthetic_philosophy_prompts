      *   **The Calculation (The Core):** Need to show the math.
          *   Gross Performance Value.
          *   Less: Cognitive Endowment (IQ, brains).
          *   Less: Socioeconomic Headstart (upbringing).
          *   Less: Temperament Luck (being the sort of person who can be bothered).
          *   Less: Absence of Catastrophe (nothing awful happened).
          *   Less: Risk Realization (gambles that paid off).
          *   Equals: Net Merit Income.
      *   **The Counterfactual:** Explain the "Median Counterfactual Self" simulation.
      *   **The Base Payment:** The universal stipend to prevent starvation, explicitly disclaimed as merit.
      *   **Footnotes:** Clarify the methodology (e.g., genetic sequencing, childhood analysis).
      *   **FAQ:** Address common concerns (why is pay so low? why is the base payment there?).

  3.  **Drafting - Content & Tone:**
