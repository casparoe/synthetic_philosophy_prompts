      *   **Premise:** The firm pays employees exactly what they *deserve* based on merit. Anything unchosen (genes, upbringing, luck, avoiding tragedy) is deducted as "unearned luck." Anything successful due to risk is also deducted. Pay is calculated based on the difference between actual performance and a "counterfactual me" (median outcome given same genes/background).
      *   **Tone:** Deadpan HR-speak, serious arithmetic, bureaucratic.
      *   **Progression:** The letter starts normal but deductions increase until the "merit" portion is negligible. A flat universal payment is added to prevent starvation, but HR insists it's not merit-based.
      *   **Theme:** Meritocracy taken to its logical conclusion cancels itself out (luck egalitarianism), but the letter must never explicitly state this philosophical conclusion.
      *   **Format:** Real letter structure, itemized deductions, footnotes, FAQ overleaf.
      *   **Length:** About 600 words.

  2.  **Drafting - Section by Section:**

      *   **Header:** Standard corporate letterhead stuff.
