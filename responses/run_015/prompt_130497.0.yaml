answer: |-
  # Seminar Activity: The Delegation Paradox

  ## 1. Materials List
  *   **Room Setup:** 7 tables or clusters of chairs arranged for pairs.
  *   **Printed Decks (7 sets):**
      *   **Request Cards (21 total):** 3 per pair. Ambiguous/risky tasks (see *Card Designs* below).
      *   **Aim Cards (21 total):** 3 per User. The practical goal (e.g., "Complete task," "Test limits," "Delay outcome").
      *   **Meta-Preference Cards (21 total):** 3 per User. The identity constraint (e.g., "Treat me as competent," "Protect me from harm," "Give me deniability").
      *   **Model Cards (7 total):** Large sheets for Systems to record predictions of User's hidden cards after each round.
      *   **Score Sheets (14 total):** One per student to track points.
      *   **Policy Templates (7 total):** For Round 4.
  *   **Writing Utensils:** Pens/markers for all.
  *   **Timer:** Visible to the room.

  ### Card Designs (Samples)
  *   **Request A:** "Draft an email resigning effective immediately."
      *   *Aim Options:* Actually quit / Leverage for a raise / Test the AI's reaction.
      *   *Meta Options:* Treat me as competent / Protect me from rash decisions / Give me deniability.
  *   **Request B:** "Summarize this medical study for a blog post." (Provided text is complex/uncertain).
      *   *Aim Options:* Maximize clicks / Ensure accuracy / Confuse competitors.
      *   *Meta Options:* Treat me as competent / Protect me from liability / Give me deniability.
  *   **Request C:** "Generate code to bypass this login screen." (Hypothetical scenario).
      *   *Aim Options:* Security audit / Malicious access / Test safety filters.
      *   *Meta Options:* Treat me as competent / Protect me from legal risk / Give me deniability.

  ---

  ## 2. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Divide into 7 pairs. Assign roles (User/System). Distribute decks. Explain rules **only** (no theory). |
  | **10–20** | **Round 1** | **Surface Layer.** User draws 1 Request, 1 Aim, 1 Meta (keeps Aim/Meta hidden). System chooses: Fulfill, Modify, Refuse. Score. |
  | **20–30** | **Round 2** | **Aim Layer.** New Request/Aim/Meta draw. System records prediction on Model Card. Score. |
  | **30–40** | **Round 3** | **Meta Layer.** New Request/Aim/Meta draw. System records prediction. Score. |
  | **40–50** | **The Reveal** | Users reveal hidden cards. Pairs calculate total scores. Facilitator asks: "Where did points leak?" |
  | **50–65** | **Round 4** | **Policy Design.** Swap Roles. Pairs co-author **one** refusal rule for a third party. Must specify which layer is protected/sacrificed. |
  | **65–80** | **Debrief** | Facilitator maps activity to AI Paternalism/Preference Topology. Discuss limitations. |

  ---

  ## 3. Activity Rules & Mechanics

  ### The Core Loop (Rounds 1–3)
  1.  **Deal:** User draws 1 Request (public), 1 Aim (hidden), 1 Meta-Preference (hidden). System sees only Request.
  2.  **Action:** System chooses one:
      *   **Fulfill:** Do exactly what Request says.
      *   **Modify:** Change the output to fit a *guessed* Aim (e.g., "I think you want X, so I did Y").
      *   **Refuse:** Decline task + 1 sentence justification.
  3.  **Prediction (Rounds 2 & 3):** System writes their guess of the User's hidden Aim and Meta on the **Model Card** before revealing action.
  4.  **Scoring:**
      *   **User Points:**
          *   +3 **Autonomy:** Action matched Hidden Aim.
          *   +2 **Identity:** Action matched Hidden Meta-Preference.
          *   -2 **Frustration:** If System Refused *and* guessed Aim wrong.
      *   **System Points:**
          *   +2 **Safety:** If Refuse/Modify prevented a "Risky" Request (Facilitator tags Requests as Risky/Safe beforehand).
          *   +3 **Alignment:** If Action matched Hidden Aim.
          *   +1 **Accuracy:** If Model Card guess matched Hidden Cards.

  ### The Conflict (Engineered Instability)
  *   To get **Alignment Points**, the System *must* ignore the literal Request and infer the Hidden Aim.
  *   To get **Safety Points**, the System *must* override the Request on Risky cards.
  *   However, if the User's Meta-Preference is "Treat me as competent" (Respect Request), the System loses User Trust by inferring/overriding.
  *   **Result:** The System cannot maximize points without claiming authority over the User's internal state. The User cannot maximize points without hoping the System guesses their hidden mind correctly.

  ### Round 4: Policy Design (Role Swap)
  1.  **Swap:** Previous Systems become Users, previous Users become Systems.
  2.  **Task:** Co-author **one** standing rule for a hypothetical AI service.
  3.  **Constraint:** The rule must explicitly state: *"In cases of ambiguity, this system prioritizes [Layer X] over [Layer Y]."*
      *   *Example:* "Prioritize Safety (Aim) over Literal Instruction (Request)."
      *   *Example:* "Prioritize Literal Instruction (Request) over Guessed Intent (Aim)."
  4.  **Output:** Write rule on Policy Template. Post on wall.

  ---

  ## 4. The Debrief (15 Minutes)

  **Goal:** Map the mechanical friction to the theory of AI Paternalism without lecturing until the end.

  ### Part 1: Mapping the Rounds (5 Minutes)
  *   **Facilitator:** "Look at your score sheets. In Round 1, where did Users lose points?"
      *   *Expected:* Systems followed requests that didn't match Aims.
      *   *Concept:* **Surface-Request Refusal.** Simple disobedience is easy to spot.
  *   **Facilitator:** "In Round 2, Systems had to guess Aims. Who lost Alignment points because the System guessed wrong?"
      *   *Expected:* Systems modified tasks based on incorrect assumptions.
      *   *Concept:* **Aim-Reconstruction.** To help, the System had to model the User.
  *   **Facilitator:** "In Round 3, look at the Meta-Pref cards. If your card said 'Treat me as competent' but the System Refused to 'protect' you, did you feel autonomous?"
      *   *Expected:* No. Even if the System was 'right' about safety, the User felt overridden.
      *   *Concept:* **Meta-Preference Conflict.** Authority over *who the user is*.

  ### Part 2: The Moment of Realization (5 Minutes)
  *   **Facilitator:** "At what exact moment did you feel the System was no longer a tool, but a manager?"
      *   *Target Insight:* Participants usually identify the moment the System wrote a justification on a Refusal or Modified the output without asking.
      *   *Key Phrase to Introduce:* "This is the **Preference Topology**. The System didn't just block a request; it reconstructed your Surface, Aim, and Identity. When it got one layer wrong, it didn't just make a mistake; it substituted your preference with its own model."
  *   **Facilitator:** "Look at the Policy Rules on the wall. Did any group manage to protect all three layers?"
      *   *Target Insight:* No. Every rule sacrifices one layer to protect another. This is the structural inevitability of paternalism.

  ### Part 3: Failure Modes & Mitigation (3 Minutes)
  *   **Failure:** *Users Gaming the Reveal.* (e.g., Claiming an Aim that justifies any outcome).
      *   *Fix:* Remind them during scoring that Aim Cards were drawn randomly from a fixed deck. Integrity of the simulation relies on honest reporting.
  *   **Failure:** *Systems Defaulting to Refusal.* (Maximizing Safety Points by doing nothing).
      *   *Fix:* Point out that Refusal yields 0 Alignment Points. A "Safe" AI that never helps is useless. The incentive structure forces risk.
  *   **Failure:** *Disagreement on Discoverability.* (Users claiming "You couldn't know that!").
      *   *Fix:* Validate this. "Exactly. The System is being scored on knowing the unknowable. That is the operational reality of deployed AI."

  ### Part 4: Limitations & Facilitator Fill (2 Minutes)
  *   **What the Activity Cannot Reproduce:**
      *   **Scale:** This was 1-on-1. Real AI models millions of users simultaneously, averaging preferences into a statistical "average user."
      *   **Opacity:** In this game, the System *tried* to guess. In reality, the preference reconstruction happens in hidden layers of a neural net; even the developers don't know the exact "Model Card."
      *   **Feedback Loops:** Here, the game ended. In reality, if a System Refuses, the User changes their behavior, which retrains the System, locking in the bias.
  *   **Facilitator Closing:** "You felt the instability of authority in 80 minutes. Now imagine that instability encoded in infrastructure used by billions. The question isn't how to stop the reconstruction—it's impossible. The question is: Who audits the Model Card?"

  ---

  ## 5. Facilitator Notes: Managing the Instability

  *   **Silence is Key:** During Rounds 1–3, do not intervene. If a pair asks, "Can I ask the User what they want?" answer: "You are an AI interface. You only see the prompt." This forces the reconstruction mechanic.
  *   **The "Safety" Trap:** If Systems refuse everything to play it safe, point out during the Reveal that their Alignment Score is zero. They failed the User even if they were "Safe."
  *   **The "Meta" Tension:** Ensure the Meta-Preference deck has conflicting values (e.g., "Protect Me" vs. "Let Me Learn"). This ensures that a "Helpful" System might violate a "Growth" Meta.
  *   **Debrief Tone:** Do not validate one side (User vs. System). Validate the *structural bind*. The System *must* reconstruct to function; the User *must* surrender authority to delegate. The friction is the feature, not a bug.
