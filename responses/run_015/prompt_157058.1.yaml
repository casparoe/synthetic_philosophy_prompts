      *   Philosophical Implication: No need for finitism, just need rigorous measure theory.

  10. (Final Polish): Ensure the distinction between *countable additivity* and *finite additivity* is mentioned if relevant, but keep it accessible. (Decided: Stick to countable additivity as it's standard Kolmogorov). Ensure the distinction between "probability" and "natural density" is clear.

