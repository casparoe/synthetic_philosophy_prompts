          *   *Verdict:* It's a mix. She is a *partial* self-model externalized. The "more accurate" claim is tricky; she's accurate about his *trauma*, not his total cognitive state. It's not just pathos; it's epistemic confrontation.

      *   *Point 3: X-ray Bombardment (Intervention changes the Agent).*
