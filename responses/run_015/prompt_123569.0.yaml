answer: |-
  The beacon on the hill requires **light**.
  You ask me if we ever ought to **cut**.
  Who speaks up for the welfare of the **common**.
  The winner must be plainly **visible**.
  Or else we stumble in the **shadow**.
  And stop the hard work needed to **try**.

  You say we need the proof that if you **try**
  You'll walk alone into that blinding **light**
  But one bright star casts too much **shadow**
  To keep the tree upright, the branch we **cut**
  It isn't hate to keep them less **visible**
  It keeps the peace and safety of the **common**

  Is success contagious for the **common**
  Or does it break the will to even **try**
  When one person is too **visible**
  The rest feel dimmed instead of guided by the **light**
  The knife is mercy when we **cut**
  And keep the group safe inside the **shadow**

  Without a hero stepping from the **shadow**
  Who validates the **common**
  If every peak is leveled by a **cut**
  Then what's the point of struggle, what's the **try**
  We need the ladder glowing in the **light**
  To make the top seem reachable and **visible**

  But when the prize is overly **visible**
  It creates a dark and envious **shadow**
  You claim it's fuel, I say it burns the **light**
  And separates the winner from the **common**
  It makes the loss feel personal when you **try**
  To run the race unless the grass is **cut**

  So tell me, should we **cut**
  Or let them stand until they're clearly **visible**
  Both sides claim they help the ones who **try**
  One offers cover in a cooling **shadow**
  One offers hope to lift the **common**
  Both swear they serve the same enduring **light**

  We argue if we **cut** or trust the **shadow**,
  If fame should be **visible** or **common**,
  Still we **try** to find the moral **light**.
