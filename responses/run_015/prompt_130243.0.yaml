prompt: |-
  I'm working on a story about Simone Weil's take on politcal partys -- specifically her claim that they function like machines for manufactoring collective passions and crushing individual judgement. You know the essay I'm talking about, the one where she argues for abolishing them entirely. I'm trying to go deeper than the usual anarchist or libertarian recycling of her ideas, and I want to inject something a bit more niche: comparing her critique of formal party discipline to the way algorithimic feeds today generate pseudo-collective passions without any actual membership card. So here's my question -- if you take Weil seriously but apply her framework to these modern, decentralized pseudo-parties, what are the three or four most important open conceptual questions that actually matter? I want you to rank them and defend the ordering, explaining which ones are upstream of the others, which are tractable for a philosopher or theorist working without big data, and which are probably dead ends. Don't just list them; tell me why the top one deserves the most attention, and what kind of argument or evidence over the next couple years would make you reorder the list. Also please write this as continuous prose with no headings, bullet points, bold, or tables -- just like an email or a letter. And skip any bibliographies or citation lists, I only need the reasoning.
