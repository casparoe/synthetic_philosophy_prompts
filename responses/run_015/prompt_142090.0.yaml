prompt: |-
  youre a classicist who also works on media ethics — like, someone who has actually read Plutarch properly and also has opinions about prestige TV and deepfakes. think carefully before you answer, and do a quick brainstorming pass first: what does Plutarch genuinely care about (character-revealing detail, the moral improvement of the reader, the portrait-painter thing from the opening of his Alexander where he says he's writing lives not histories and that a joke or a throwaway remark tells you more about a man than the most famous battle, and that he's happy to leave the big battles to other people), and what does he plainly not care about (archival completeness, consent, the dead person's rights, being fair to every side).

  The question I want you on: Plutarch gets dropped into the present day and has to take a position on what we owe the real dead when we dramatize them. Concretely — prestige biopics where real twentieth-century people are given invented conversations and inner lives, 'based on a true story' labels, a dead singer's cloned voice performing a song that never existed, a dead actor's face rendered into a film released decades after they died, a documentary that merges three real people into one composite character.

  But I want you past the obvious stuff. Here's the distinction I've been chewing on and can't get anyone to give me a straight answer about: resurrection vs redaction. Resurrection = you make the dead person do or say something genuinely new, something they never did or said — new lines, a new performance, a synthesized voice, an invented scene. Redaction = you work only on the existing record — cutting, compressing, reordering, merging people into composites, filling a silence with something plausible that stays inside what's actually documented. My hunch is that Plutarch would treat these as different in kind, and maybe not in the direction people expect, since his whole method is shameless redaction while he never seems to invent deeds outright. Say which one he'd object to more and why, using his own commitments rather than modern ones.

  Then the twist: what about ventriloquism with a wink — the film lets a real dead person say something invented, but openly signals to the audience that it's invented (a title card, a stylized aside, a scene shot in a way that obviously isn't realism). Does the wink discharge whatever the obligation was, or does it make things worse, because now the dead person is openly a puppet? And separately: does it matter whether anyone who actually knew the person is still alive? Plutarch wrote about men who'd been dead for centuries, so I suspect the 'no ones left to be hurt' move cuts no ice with him, but tell me if I'm wrong.

  One more wrinkle I'd like handled: Plutarch was a Greek writing up Romans, under Roman rule, for readers that included those Romans' descendants. So who gets to narrate whom matters to him in a way it maybe doesn't for modern 'just hire the best storyteller' people. Build that in.

  Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up. No citations, no bibliography, no reading list — I can't check any of it. And don't turn him into a twenty-first-century liberal who walks around talking about consent and dignity; keep it in his own vocabulary (character, emulation, what the reader's soul is being trained toward, truthfulness as a virtue of the writer). It's fine to say 'Plutarch would be baffled by X', but then say what he'd grab onto instead.
