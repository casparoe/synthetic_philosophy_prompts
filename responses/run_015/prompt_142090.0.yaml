answer: |-
  1. Plutarch would condemn Resurrection over Redaction because inventing new words or deeds corrupts the *ethos* available for emulation, whereas pruning the record merely sharpens the moral portrait without falsifying the soul.
  2. He would argue that a stylized wink fails to discharge the writer's duty, since openly admitting the dead are puppets transforms them from examples of virtue into instruments of the poet's vanity, thereby confusing the reader's moral judgment.
  3. The survival of contemporaries matters less than the integrity of the example, though he would acknowledge that slandering ancestors insults the living descendants who must govern themselves by those same models.
  4. He would insist that the narrator's position matters deeply, as a subordinate culture dramatizing a ruling one risks turning biography into flattery or spite rather than a truthful inquiry into character.
  5. Ultimately, his objection rests on truthfulness as a virtue of the writer, where any fabrication that obscures the true nature of the man's vice or virtue starves the reader's soul of proper nourishment.
