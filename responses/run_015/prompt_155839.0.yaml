  # Seminar Decision Tree: The "Who" Diagram

  **Instructions for Participants:** Do not think about philosophical labels. Read the scenario and choose the option that matches your gut intuition about *what is happening*.

  ### Node 1: The Synthetic Replacement
  *Scenario: Your memories are slowly replaced by synthetic ones. They feel identical, but they have zero causal link to your actual past. The "data" is the same, the "history" is fake.*

  *   **Branch A:** "There was never an owner of the memories anyway; just a flow of experience."
      *   *(Go to Node 2)*
  *   **Branch B:** "A self (new or continuing) picks up the thread and carries on."
      *   *(Go to Node 3)*

  ---

  ### Node 2: The Split-Brain Test
  *(Reached via Branch A: "No Owner")*
  *Scenario: Your brain hemispheres are separated. Both claim the pre-surgery intentions and memories. Both act independently.*

  *   **Branch A:** "Neither is 'you.' There are just two competing biological processes running now."
      *   **→ Leaf 1: Hard Reductionist Anatta**
      *   *(Description: No self exists, not even as a useful label. There is only flux, causality, and emptiness. The "person" is a cognitive error.)*
  *   **Branch B:** "Both have a valid claim. Conventionally, there are two continuations of the previous pattern."
      *   **→ Leaf 2: Two-Truths Conventionalism**
      *   *(Description: Ultimately empty, but functionally real. Like a "dollar bill" or a "chariot," the self is a useful designation for a collection of parts, even if no essence exists.)*
      *   **⚠️ Instructor Flag:** *Note that Narrative Reconstructionists (Leaf 3) often answer Node 1 Branch B, but may agree with this leaf on ultimate emptiness. The tree forces a split here for clarity.*

  ---

  ### Node 3: The Distributed Body
  *(Reached via Branch B: "Self Picks Up Thread")*
  *Scenario: Your cognitive processes are spread across three bodies with async updates. You can feel what all three feel, but with a delay.*

  *   **Branch A:** "That works. The self is a pattern, not a location. I can be spread out."
      *   **→ Leaf 4: Distributed Conventional Self**
      *   *(Description: The self is a non-local information structure. **⚠️ Coherence Flag:** Is this incoherent? If the three bodies act independently, are they three people or one? This view risks violating the pragmatic unity required for conventional identity.)*
  *   **Branch B:** "That doesn't work. A self needs to be local to one body/point to be real."
      *   **→ Leaf 3: Narrative Reconstructionism**
      *   *(Description: The self is the protagonist of a story. It requires a single, coherent timeline and location to maintain the narrative integrity. Without a central "hero," the story falls apart.)*
      *   **⚠️ Instructor Flag:** *Note that Two-Truths (Leaf 2) and Narrative (Leaf 3) often both choose Node 1 Branch B ("Self picks up thread"). This tree separates them based on Locality vs. Utility, but in practice, these views overlap significantly.*

  ---

  ### Instructor Notes & Overlap Flags

  1.  **The Two-Truths / Narrative Overlap:**
      *   **The Issue:** Both *Two-Truths Conventionalism* (Leaf 2) and *Narrative Reconstructionism* (Leaf 3) generally agree that a "self" functions in the world, even if it lacks ultimate substance.
      *   **The Tree's Limit:** This tree forces them apart at **Node 1**. Two-Truths is routed through "No Owner" (Ultimate view), while Narrative is routed through "Self Picks Up Thread" (Conventional view).
      *   **Seminar Tip:** If a participant argues they fit both, acknowledge that the tree distinguishes *ontological priority* (Empty vs. Story) rather than practical outcome.

  2.  **The Distributed Coherence Check (Leaf 4):**
      *   **The Issue:** Distributed Self is the "Empty Slot." It is philosophically volatile.
      *   **The Flag:** Use this leaf to probe *Dependent Origination*. If the three bodies diverge in intent (one wants to meditate, one wants to eat), does the "self" fracture? If yes, it collapses back into Leaf 2 (Two-Truths: 3 conventional selves). If no, how is conflict resolved without a central arbiter?

  3.  **Hard Reductionist vs. Two-Truths (Node 2):**
      *   **The Issue:** Both agree on "No Owner."
      *   **The Split:** The distinction is *pragmatic*. Does the label "I" have any utility (Two-Truths), or is it purely a delusion to be discarded (Hard Reductionist)? Node 2 Branch B ("Valid Claim") captures the utility aspect.

  4.  **Node Count:**
      *   3 Decision Nodes + 4 Leaves = **7 Nodes Total**.
