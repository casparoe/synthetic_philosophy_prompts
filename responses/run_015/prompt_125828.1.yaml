prompt: |-
  I'm writing a novel with a kind of ghost-Rousseau who haunts a modern ministry that harvests the will of the people straight from social media feeds and turns it into law through AI weighting. I want his reaction to be sharp and in the weeds, not just "he'd hate technology." There's this concept I've been playing with—call it continuous plebiscitary aggregation—where citizens never vote on actual bills, but algorithms score emotional reactions in real time, and the government claims this captures the general will more purely than elections ever could because it removes corrupt representatives. The catch is that the algorithim suppresses low-engagement voices and amplifies outrage, so the will that comes out is technically everyone's input but structurally skewed toward the loudest. I'm especally curious whether Rousseau would see this as the fulfillment of his anti-representative idea, or as its total betrayal, since the aggregation here is engineered affect rather than the rational deliberation he thought turned private individuals into citizens. Where does sovereignty even sit when the people is just a constantly shifting feed filtered by private platforms?

  Please answer in these sections:

  1. The diagnosis (around 200 words): How he'd read the tech and its populist claims.
  2. The agreement (around 150 words): Points where he might actually side with the algorithmic boosters against old-style representatives.
  3. The revolt (around 200 words): Where he'd say they've butchered the general will by confusing summed preferences with moral transformation, and where the profit motive of the platforms makes the whole thing illegitimate.
  4. The bottom line (around 100 words): One sharp verdict I could put in my ghost-character's mouth.

  Don't stress about exact editions or page numbers—I can't check them in my draft and neither can you without searching. Also, I keep mixing up the general will with the sum of particular wills in my notes, so feel free to correct me casually if I blur them.
