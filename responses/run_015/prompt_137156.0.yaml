      On a Wittgensteinian reading, the IAU erred by seeking an essence where there was only usage. They should have defined "planet" relative to a specific purpose (e.g., dynamical modeling) rather than universally. The public resistance stems from a clash of language games. For the public and geophysicists, "planet" signifies a *type of object* (round body); for dynamical astronomers, it signifies a *role in a system* (dominant body). Family resemblance explains the discomfort: Pluto retains enough resemblance (roundness, orbit) to remain in the family, even if it lacks the new "essential" trait. The theory explains the resistance as a refusal to accept a stipulative boundary on a gradient concept.

