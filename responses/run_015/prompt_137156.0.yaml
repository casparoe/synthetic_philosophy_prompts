      **4. Turning the Case Back on the Theory:**
      This is not a pure confirmation. Family resemblance describes existing usage; it does not forbid stipulative definition for technical utility. The episode suggests scientific classification is a language game where the demand for essence is sometimes legitimate *instrumentally*, even if confused *conceptually*. The theory runs out here: Wittgenstein advises therapy for philosophical bewitchment, but science requires operational boundaries for data organization. The IAU decision was not a truth-claim about Pluto's nature, but a rule-change for a specific technical game. The theory cannot adjudicate which game is "correct," only show that the demand for a universal essence is the source of the conflict.

      **Extension: The Oort Cloud Object:**
      If a Mars-mass body is found in the Oort cloud (round, isolated orbit), the disagreement is not about fact but utility. Discoverers play the geophysical game (round = planet); refusers play the dynamical game (context matters). Family resemblance dissolves the metaphysical question ("Is it *really* a planet?") by showing there is no "really." It does not settle the taxonomic dispute. The resolution requires negotiating which language game serves the community's goals best. If the goal is understanding formation, dynamical context matters. If the goal is comparative geology, isolation matters. Wittgenstein offers no verdict, only the clarification that the dispute is about rules, not reality.

