answer: |-
  # SEMINAR HANDOUT: THE CONTINGENCY INSTRUMENT
  **Course:** Macro-Causal Explanation | **Week:** 1 | **TA:** [Your Name]

  **Instructions:** Do not read the canonical readings yet. Below are seven anonymized historical cases. Select **one** case that matches your current intuition about how history works. Answer the questions in the Decision Tree (overleaf) honestly based *only* on that case. Your path will terminate at a "Leaf Position." Record the Position Name and the "Commitment to Swallow." We will compare maps in class.

  ### THE CASES (Anonymized)
  1.  **The Harbour Gauge:** A port authority adopts Standard X over Y on a vote swung by one member's late arrival. Cranes, training, and contracts co-adapt within a decade. Reversal is unthinkable for a century.
  2.  **The Delayed Envoy:** A treaty collapses because a negotiator's ship is becalmed for three weeks. War resumes. The settlement forty years later reproduces the rejected terms on territory but departs entirely on fiscal clauses.
  3.  **The Two Valleys:** Two regions in similar hydrological conditions, with no contact, independently build near-identical hierarchical irrigation bureaucracies within a century of each other.
  4.  **The Pension Convergence:** Two provinces reach near-universal old-age provision by 1960. One uses tax-funded flat pensions; the other uses occupationally fragmented insurance. Coverage rates converge; replacement rates and gendered outcomes diverge for fifty years.
  5.  **The Slow Follower:** A fiscal innovation appears in Polity A in 1720 and independently in Polity B in 1790. Institutional design and supporting coalitions differ, but the fiscal capacity outcome is similar.
  6.  **The Founding Memo:** A filing scheme adopted without discussion by a mid-level official becomes the inherited grid for all later administrative statistics. It renders one large category of hardship invisible for three generations. Substantive policy changes repeatedly; the categories do not.
  7.  **The Rotating Chair:** Which of twelve reformers chairs a committee wildly changes the next five years of policy, but every variant converges on a professionalised, exam-recruited civil service.

  ---

  ### THE DECISION TREE

  **Node 1 [Counterfactual Operation]:** To test this case, are you imagining **removing one specific incident** (e.g., the late vote, the becalmed ship) and letting history run forward, OR are you **re-running the entire sequence** from an earlier starting point (either identical or slightly nudged)?
  *   *A: Remove Specific Incident (Rewind)* → Go to Node 2.
  *   *B: Re-run Sequence (Replay/Perturbation)* → Go to Node 3.

  **Node 2 [Outcome Identity]:** If that specific incident had not occurred, would the **specific institutional form** (e.g., the exact gauge width, the exact filing code) be different 50 years later?
  *   *A: Yes, the specific form differs (Token Divergence)* → Go to Node 4.
  *   *B: No, the form would be effectively the same* → **Leaf: Trivial Contingency** (Unclaimed: Incoherent).

  **Node 3 [Counterfactual Specificity]:** (Only if Re-run Sequence). Are you assuming the re-run starts with **identical initial conditions** (Replay) or with **slightly nudged parameters** (Perturbation)?
  *   *A: Identical Conditions (Replay)* → Go to Node 5.
  *   *B: Nudged Parameters (Perturbation)* → Go to Node 5. *(Note: Leaves 4 & 5 treat these as theoretically distinct but empirically similar).*

  **Node 4 [Mechanism of Persistence]:** (Only if Token Divergence). Why does the difference persist? Is it because reversing is now **too costly** (Ratchet), OR because the alternative has become **invisible** to actors (Administrative Grid)?
  *   *A: Too Costly (Ratchet)* → Go to Node 6.
  *   *B: Invisible (Administrative)* → **Leaf: Administrative Determinism**.

  **Node 5 [Outcome Granularity]:** In the re-run scenario, does the system end up with the **same type of institution solving the same problem** (Functional), OR merely the **same broad statistical outcomes** (e.g., coverage rates) while lived experience differs (Coarse)?
  *   *A: Same Institution Type (Functional)* → Go to Node 7.
  *   *B: Same Stats, Different Experience (Coarse)* → **Leaf: Coarse Convergence**.

  **Node 6 [Redirection Check]:** (Only if Ratchet). Did the initial event merely redirect a path that was **not subsequently reinforced**, OR was it reinforced by increasing returns?
  *   *A: Not Reinforced (One-off)* → **Leaf: Critical Redirection**.
  *   *B: Reinforced (Increasing Returns)* → **Leaf: Hard Path Dependence**.

  **Node 7 [Convergence Mechanism]:** (Only if Functional). Does the system converge because it is **pulled back by stability** (Attractor), OR because there was **only one viable solution** given the environment (Structural Necessity)?
  *   *A: Pulled Back (Attractor)* → **Leaf: Convergent Evolution**.
  *   *B: Only One Solution (Necessity)* → **Leaf: Structural Equifinality**.

  ---

  ### THE LEAF POSITIONS

  | Position Name | Counterfactual | Outcome Identity | Mechanism | Status | Commitment to Swallow |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hard Path Dependence** | Rewind | Token | Ratchet | **Occupied** (Harbour Gauge) | Small events matter permanently because reversal costs grow over time. |
  | **Administrative Determinism** | Rewind | Token | Administrative | **Occupied** (Founding Memo) | Reality is shaped less by policy than by the categories used to measure it. |
  | **Critical Redirection** | Rewind | Token | One-off | **Occupied** (Delayed Envoy) | History can be knocked off track by accidents, even without lock-in mechanisms. |
  | **Convergent Evolution** | Replay/Perturb | Functional | Attractor | **Occupied** (Two Valleys, Rotating Chair) | Details vary, but system dynamics pull outcomes back to a stable state. |
  | **Structural Equifinality** | Replay | Functional | Necessity | **Occupied** (Slow Follower) | Different routes lead to the same end because the environment forces it. |
  | **Coarse Convergence** | Replay | Coarse | Attractor/Nec. | **Occupied** (Pension Convergence) | Macro-stats look the same, but welfare and distribution remain contingent. |
  | **Unclaimed Position** | Perturbation | Token | Ratchet | **Unclaimed** (Unattractive) | *Commitment:* A tiny parameter nudge creates a unique, locked-in specific outcome. (Rarely argued; usually attributed to events). |
  | **Trivial Contingency** | Rewind | Token | None | **Unclaimed** (Incoherent) | *Commitment:* The event changes the specific outcome, but it doesn't matter and doesn't persist. (Why study it?) |

  **Note on Indistinguishability:** *Convergent Evolution* and *Structural Equifinality* are difficult to separate empirically without knowing the causal mechanism. Both predict functional similarity; one claims the system *could* have gone elsewhere but didn't, the other claims it *could not* have gone elsewhere.

  ---

  ### WORKED EXAMPLE PATHS

  #### Path A: The Pluralist Student
  *Intuition:* "The Harbour Gauge and Founding Memo are contingent and locked in. The Two Valleys and Slow Follower are not contingent; they had to happen."

  1.  **Case:** Harbour Gauge.
  2.  **Node 1:** Remove Specific Incident (Rewind).
  3.  **Node 2:** Yes, specific form differs (Token).
  4.  **Node 4:** Too Costly (Ratchet).
  5.  **Node 6:** Reinforced.
      *   **Result:** Lands on **Hard Path Dependence**.
  6.  **Case:** Two Valleys.
  7.  **Node 1:** Re-run Sequence (Replay).
  8.  **Node 3:** Identical Conditions.
  9.  **Node 5:** Same Institution Type (Functional).
  10. **Node 7:** Only One Solution (Necessity).
      *   **Result:** Lands on **Structural Equifinality**.

  *Analysis:* This student holds a **pluralist** position. The tree gives a determinate answer for each case, but the student occupies multiple leaves. They argue that *some* history is locked (Gauge) and *some* is determined (Valleys). The tree successfully separates their intuitions about different cases.

  #### Path B: The Functionalist Student
  *Intuition:* "Every case is contingent in its details (the specific gauge, the specific memo) but inevitable in its broad function (ports need gauges, states need stats)."

  1.  **Case:** Harbour Gauge.
  2.  **Node 1:** Remove Specific Incident (Rewind).
  3.  **Node 2:** *Decision Point.* If they say "Yes, form differs," they go to Path A (Hard Path Dependence). If they say "No, a gauge would exist anyway," they go to **Leaf: Trivial Contingency**.
      *   *Correction for Functionalist:* They must argue the *Token* is contingent, but the *Function* is not. This tree forces them to choose Node 2 based on the *Token*.
      *   *Revised Path:* They answer Node 2 "Yes" (Token differs).
  4.  **Node 4:** Too Costly.
  5.  **Node 6:** Reinforced.
      *   **Result:** **Hard Path Dependence**.
  6.  **Case:** Two Valleys.
  7.  **Node 1:** Re-run Sequence.
  8.  **Node 5:** Same Institution Type (Functional).
  9.  **Node 7:** Attractor.
      *   **Result:** **Convergent Evolution**.

  *Analysis:* This student **cannot land on a single leaf** that captures "Contingent Details, Inevitable Function" across all cases.
  *   For the *Gauge*, the tree classifies them as a Path Dependence theorist (because they admit the Token differs and persists).
  *   For the *Valleys*, the tree classifies them as a Convergence theorist.
  *   **Where the tree fails:** It cannot capture the position that "Token divergence exists but is theoretically unimportant." It forces the student to treat Token divergence as significant (leading to Path Dependence leaves). To capture this student's view, we would need a leaf that combines *Token Divergence* with *Functional Equivalence*, but the tree forces a choice at Node 2 that prioritizes Token identity for Rewind cases. This reveals a bias in the instrument: it treats Rewind cases as inherently about Token outcomes.

