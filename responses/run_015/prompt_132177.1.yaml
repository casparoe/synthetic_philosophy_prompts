answer: |-
  This is a sharp observation. The disconnect you witnessed is a canonical problem in the literature on atrocity prevention, often described as the tension between the *legalist* and *consequentialist* approaches to mass violence. Your flatmate has correctly identified that "Never Again" functions as a "black box" slogan that smuggles in premises about moral ontology (what makes killing bad) and epistemic timing (when we know it's happening).

  Here is a menu of distinct interpretations of "Never Again," categorized by the philosophical work they are doing. I have tagged them by their viability (Trivial, Defensible, False) and mapped them to your panelists and flatmate.

  ### 1. The Speech Act: Prediction vs. Pledge

  **A. The Empirical Prediction**
  *   **Claim:** "Given the establishment of international law and memory culture, genocide will not occur in the future."
  *   **Status:** **Empirically False.**
  *   **Analysis:** If "Never Again" is a claim about the state of the world, it is demonstrably false (Cambodia, Rwanda, Bosnia, Srebrenica, Yazidis, etc.).
  *   **Panelist Map:** Neither panelist likely holds this consciously, but Speaker 1 risks implying it by suggesting the label *secures* safety.
  *   **Settled/Contested:** **Settled.** No serious scholar claims genocide has been eradicated.

  **B. The Moral Pledge (Deontological)**
  *   **Claim:** "We vow that *we* will not be complicit in, or stand idly by, such destruction."
  *   **Status:** **Defensible (but vague).**
  *   **Analysis:** This treats the slogan as a performative utterance by the listener/speaker. It creates a duty for the subject ("We"). However, it lacks a mechanism. A vow without a trigger condition is empty rhetoric.
  *   **Panelist Map:** This is the emotional core both speakers are appealing to, but neither explains *how* the vow is operationalized.
  *   **Settled/Contested:** **Contested.** There is no consensus on who "We" are (states? UN? individuals?) or what the vow entails (diplomacy? war?).

  ### 2. The Subject: Who is "Again" For?

  **A. The Particularist Reading**
  *   **Claim:** "Never Again" refers specifically to the Holocaust and the Jewish people. The obligation is rooted in the uniqueness of that event.
  *   **Status:** **Historically Defensible / Legally Superseded.**
  *   **Analysis:** Historically, the slogan emerged from Jewish memory culture. However, Raphael Lemkin (who coined "genocide") explicitly designed the concept to be universal, protecting *any* national, ethnical, racial, or religious group.
  *   **Panelist Map:** Speaker 1 sometimes leans here implicitly (the "load-bearing" nature of the word relies on the Holocaust's unique moral gravity).
  *   **Settled/Contested:** **Contested.** Historians agree on the particularist origin; Legal scholars agree on the universalist application. Political fights erupt when these collide (e.g., comparisons between Israel/Palestine and the Holocaust).

  **B. The Universalist Reading**
  *   **Claim:** "Never Again" applies to any group facing destruction. The specific identity of the victim is secondary to the *structure* of the crime.
  *   **Status:** **Defensible (Legal Standard).**
  *   **Analysis:** This aligns with the 1948 Genocide Convention. It argues that the moral horror lies in the *intent to destroy a group*, not the specific identity of the group.
  *   **Panelist Map:** Speaker 2 leans here (bodies pile up regardless of who they are).
  *   **Settled/Contested:** **Settled in Law, Contested in Practice.** The law is universal; political will to apply it universally is not.

  ### 3. The Object: What is "Never" to Happen?

  **A. The Non-Recurrence Reading**
  *   **Claim:** The event itself (the destruction of the group) must not happen.
  *   **Status:** **Defensible.**
  *   **Analysis:** This is the outcome-oriented view. The focus is on the physical survival of the group.
  *   **Panelist Map:** Speaker 2 (stop the killing).
  *   **Flatmate Map:** Aligns with her "graded duty" based on expected outcome.

  **B. The Non-Complicity Reading**
  *   **Claim:** *We* must not be the ones who let it happen. The focus is on the moral integrity of the observer/intervener, not necessarily the success of the prevention.
  *   **Status:** **Defensible (but potentially self-absorbed).**
  *   **Analysis:** This shifts the focus from the victim to the savior. "Never Again" means "Never Again will *our* conscience be clear while this happens."
  *   **Panelist Map:** Speaker 1 (we are "on the hook").
  *   **Critique:** This can lead to "intervention for the sake of intervention" without regard for consequences.

  ### 4. The Trigger: The Timing and Intent Problem

  This is the crux of your flatmate's objection.

  **A. The Legalist Trigger (The "Load-Bearing" Word)**
  *   **Claim:** Our highest duty activates only when the crime meets the legal threshold of Genocide (specifically *dolus specialis* — specific intent to destroy the group).
  *   **Status:** **Substantive but Practically Flawed.**
  *   **Analysis:** This argues that genocide is a "crime of crimes" distinct from mass murder. Therefore, it warrants a unique response.
  *   **The Timing Problem:** As your flatmate noted, *intent* is usually proven retrospectively via patterns of action. By the time a court (or the UN) agrees intent exists, the destruction is often underway or complete.
  *   **Panelist Map:** Speaker 1.
  *   **Verdict:** **Defensible in Theory, False in Practice (for prevention).** It works for punishment, fails for prevention.

  **B. The Consequentialist Trigger (The "Graded Duty")**
  *   **Claim:** Duty scales with the magnitude of harm and probability of occurrence, regardless of legal labels.
  *   **Status:** **Defensible (and increasingly standard in IR).**
  *   **Analysis:** This removes the "genocide" bottleneck. If 100,000 people will die due to "crimes against humanity" or "ethnic cleansing" (terms without the same treaty baggage), the duty to act should be similar.
  *   **Panelist Map:** Speaker 2 and your Flatmate.
  *   **Verdict:** **Defensible.** This aligns with the "Responsibility to Protect" (R2P) doctrine, which attempts to broaden the trigger beyond strict legal genocide.

  **C. The Epistemic Trigger (The Precautionary Principle)**
  *   **Claim:** Because legal proof comes too late, we must treat *risk indicators* of genocide as if the crime is already happening.
  *   **Status:** **Defensible but Politically Risky.**
  *   **Analysis:** This solves the timing problem. We act on the *risk* of genocide, not the *fact* of genocide.
  *   **The Intent Question:** Does the specific intent (*dolus specialis*) matter morally?
      *   *View 1 (Speaker 1):* Yes. Destroying a group is uniquely evil because it attacks human diversity/identity.
      *   *View 2 (Speaker 2/Flatmate):* No. Death is the harm. Intent is a legal artifact for assigning individual criminal liability, not for assigning state duty to intervene.
  *   **Verdict:** **Contested.** Philosophers debate whether "group destruction" is a distinct moral harm over and above "mass killing." Legal scholars agree intent is required for conviction. Prevention scholars agree intent is too hard to prove early.

  ### Summary of Positions

  | Reading | Claim | Status | Supports |
  | :--- | :--- | :--- | :--- |
  | **Empirical Prediction** | Genocide won't happen again. | **False** | Neither (strawman) |
  | **Moral Pledge** | We vow not to stand by. | **Defensible** | Both (emotionally) |
  | **Legalist Trigger** | Duty requires legal label of Genocide. | **Flawed for Prevention** | Speaker 1 |
  | **Consequentialist Trigger** | Duty scales with harm/death toll. | **Defensible** | Speaker 2 & Flatmate |
  | **Epistemic Trigger** | Duty activates on *risk* of Genocide. | **Defensible (R2P)** | Flatmate (refined) |

  ### Settled vs. Contested (For your seminar)

  **Settled Facts:**
  1.  **Legal Definition:** The 1948 UN Genocide Convention definition (including specific intent) is the binding legal standard. "Ethnic cleansing" is not a legal term of art in the same way, though it often overlaps.
  2.  **Retrospective Nature:** Legal determinations of genocide almost always occur *after* the fact (ICTR, ICTY, ICJ).
  3.  **Recurrence:** Genocide has occurred multiple times since 1948. "Never Again" is not an empirical reality.
  4.  **Lemkin's Intent:** Raphael Lemkin conceived the term to be universal, not solely for Jewish victims, though the Holocaust was the catalyst.

  **Genuinely Contested (Live Fights):**
  1.  **The Moral Weight of Intent:** Is there a moral difference between killing 10,000 people to seize territory (mass murder/crimes against humanity) and killing 10,000 people to erase their lineage (genocide)?
      *   *Speaker 1 says Yes.*
      *   *Speaker 2/Flatmate says No (or "not for intervention purposes").*
  2.  **The "Trigger" Threshold:** Does using the word "genocide" politically compel intervention (the "load-bearing" claim), or does it paralyze diplomats who fear the legal implications (the "lawyers' business" claim)?
      *   *Evidence exists for both.* Sometimes the label mobilizes (Kosovo), sometimes it causes avoidance (Rwanda, where the US avoided the word to avoid obligation).
  3.  **Who is "We"?** Is the duty to prevent held by the UN Security Council (often veto-locked), individual states, or regional bodies? There is no settled mechanism for enforcement.

  ### Where your Flatmate might be going too fast

  Your flatmate is right that the "Legalist Trigger" defeats prevention. However, she might be dismissing the **symbolic power** of the label too quickly (Speaker 1's point).

  *   **The Counter-Argument:** The word "genocide" carries a unique mobilizing capacity that "mass killing" does not. It pierces sovereignty norms in a way other crimes do. If you junk the label for a "graded duty," you might gain speed but lose the political leverage needed to overcome state sovereignty.
  *   **The Nuance:** The debate isn't just "Label vs. No Label." It is often "Use the label *early* based on risk indicators (Epistemic)" vs. "Wait for legal proof (Legalist)."
  *   **The Intent Question:** She says the legal label drops out. But if the *moral* horror of genocide is the destruction of the group *as such* (not just the individuals), then intent *does* matter for defining the harm, even if it shouldn't block intervention. If you ignore intent, you might intervene in a civil war with high casualties but no group destruction, potentially misallocating resources meant for existential threats.

  **Recommendation for Seminar:**
  Frame the disagreement not as "Does the word matter?" but as **"At what epistemic stage does the duty to prevent attach?"**
  *   Speaker 1: At legal classification (Too late).
  *   Speaker 2: At observable mass killing (Ignores specific group threat).
  *   Flatmate: At risk assessment (Pragmatic, but lacks legal teeth).

  The "live fight" in the field is currently trying to synthesize these: using the *legal definition* to define the crime, but *risk indicators* (like the UN Framework of Analysis for Atrocity Crimes) to trigger the prevention duty *before* the legal threshold is met.
