answer: |-
  Here is a draft for your handout. I have kept the philosophical distinction sharp for the students, but I've also added a brief note at the very end for you, given the context you shared.

  ***

  ### Seminar Handout: Williams on Consequentialism
  **Distinguishing the "Integrity Objection" from "One Thought Too Many"**

  Bernard Williams offers two famous criticisms of consequentialism. Students often conflate them, but they target different parts of the moral life. The following cases use the same protagonist to isolate the differences.

  **Case 1: One Thought Too Many (Integrity Intact)**
  Elena is a headteacher and a mother. Her son is performing in a minor school play on Tuesday evening. Simultaneously, a non-urgent administrative issue arises regarding next term's timetable that only she can resolve. A reasonable consequentialist calculation suggests the net utility of attending the play (supporting her son's confidence, maintaining family bond) slightly outweighs the utility of fixing the timetable immediately (which can wait until Wednesday). Elena attends the play. However, when asked why, she explains, "I calculated that my presence here produced more overall good than staying at my desk."
  *   **Verdict:** The **One Thought Too Many** objection applies; the **Integrity** objection does not.
  *   **Why:** The consequentialist verdict aligns with her personal commitment (being a supportive mother), so her "ground projects" remain intact; she is not asked to betray her identity. However, the *motivation* is inappropriate. In intimate relationships, the justification for action should be the relationship itself ("because he is my son"), not an impersonal weighing of outcomes. The calculation is a "thought too many" because it inserts a mediator between her and her child where direct love should suffice.
  *   **The Flipping Feature:** **The Nature of the Bond.** If the child were merely a student rather than her son, the impersonal calculation would be appropriate (no OTTM). If you remove the intimate bond, the complaint vanishes.

  **Case 2: Integrity Objection (No "One Thought Too Many")**
  Elena founded a specialized literacy program ten years ago; it is her life's work and central to her sense of self. New data shows that redirecting the program's budget to a malaria prevention initiative in a different district would save significantly more lives per pound. As a public official managing public funds, Elena is expected to reason impartially about resource allocation; no parent or staff member would be insulted by her engaging in this arithmetic—it is her job. The consequentialist verdict demands she close the literacy program to fund the malaria nets.
  *   **Verdict:** The **Integrity** objection applies; the **One Thought Too Many** objection does not.
  *   **Why:** Impersonal reasoning is apt here; she is acting as a fiduciary of public funds, so calculating trade-offs is not an insult to any relationship (no OTTM). However, the verdict requires her to actively dismantle a "ground project" that gives her life meaning. Williams argues this creates alienation: she is forced to view her own life's work as merely one desire among others, to be discarded if the impersonal calculus demands it. The cost is not just "feeling bad," but a fracture between her actions and her identity.
  *   **The Flipping Feature:** **The Centrality of the Project.** If the literacy program were just a routine administrative duty she managed (not her life's work), closing it would be a professional inconvenience, not an integrity violation. If you remove the "ground project" status, the complaint vanishes.

  ***

  ### Analysis & Discussion Notes

  **(a) The Control Case (Both Objections Fire)**
  Imagine Elena's son is the *lead beneficiary* of the literacy program she founded. The consequentialist verdict demands she cut the program to fund the malaria nets. Here, both objections fire simultaneously. She is asked to abandon a ground project that is constitutive of her identity (Integrity), and she is asked to make this decision about her own child's welfare via impersonal arithmetic rather than parental protection (One Thought Too Many). To get Case 1 and Case 2 apart, we had to separate the *relationship* (mother/son) from the *project* (professional legacy).

  **(b) Best Consequentialist Replies**
  *   **To Case 1 (OTTМ):** *Indirect Consequentialism.* A smart consequentialist argues we should cultivate character dispositions (like parental love) that *do not* calculate in the moment, because having those dispositions produces better long-term outcomes than constant calculation. So, Elena shouldn't calculate, but the *reason* she shouldn't calculate is still consequentialist.
  *   **To Case 2 (Integrity):** *The Critical Morality Reply.* The consequentialist argues that "integrity" is only valuable if the projects it protects are morally good. If the literacy program is objectively less valuable than saving lives, then her attachment to it is a bias, not a virtue. Demanding she shed this bias isn't alienation; it's moral growth.

  **(c) TA Verdict: One Argument or Two?**
  They are **two distinct arguments** that merely travel together. The "One Thought Too Many" objection is about the *input* of deliberation (what reasons are appropriate to hold in mind given a relationship). The "Integrity" objection is about the *output* of deliberation (what costs the agent is forced to bear regarding their identity). You can have appropriate reasoning that destroys your integrity (Case 2), and you can have reasoning that preserves your integrity but insults your relationships (Case 1). Williams bundles them because both highlight how consequentialism alienates the agent from their life, but the mechanisms of that alienation differ.

  ***

  ### A Note for You (The TA)

  I know you mentioned the situation with your mother and your brother. Philosophically, your brother's behavior maps almost perfectly onto **Case 1**. He is introducing an impersonal calculation ("impartial arithmetic") into a context (family care) where the "One Thought Too Many" objection suggests the calculation itself is the injury. It isn't just that the *result* might be wrong; it's that the *mode of reasoning* treats a special relationship as a variable in an equation.

  That doesn't solve the practical problem of where your mum should live, but it validates your reaction. Wanting to "throw a plate" isn't necessarily irrational anger; it can be a recognition that the *terms* of the debate have been corrupted. When you teach this next week, remember that Williams wrote this because he felt the same tension: that some costs are not just "utilities" to be weighed, but pieces of a self that cannot be traded without loss.

  Good luck with the seminar. And with your family.
