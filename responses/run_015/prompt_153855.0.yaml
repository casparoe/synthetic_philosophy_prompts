      *   **Integrity Objection:** Focuses on the *agent's identity* and *ground projects*. It's about consequentialism requiring the agent to step outside their own commitments and view them as just one set of desires among others. It creates alienation between the agent and their actions/projects. It's about being forced to abandon a core commitment for the sake of the impersonal good.

      *   **Key Distinction:** OTTM is about the *input* of deliberation (what reasons count in the moment). Integrity is about the *output* or *structural demand* on the life (what projects must be sacrificed or adopted). OTTM is relational; Integrity is existential/identity-based.

