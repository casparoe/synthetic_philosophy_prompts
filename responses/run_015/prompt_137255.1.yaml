answer: |-
  ### Brainstorming Pass: Four Ways to Cash Out "Same Mechanism"

  1.  **Token-Identity (The "Spare Parts" View):** Two events share a mechanism only if they arise from the same physical components or code strings. If Plane A fails due to a sensor and Plane B fails due to a pilot, they are different mechanisms, even if the outcome is a crash.
  2.  **Process-Isomorphism (The "Causal Chain" View):** Two events share a mechanism if the sequence of cause-and-effect is structurally identical, regardless of the specific parts. (e.g., "loss of lift due to erroneous angle-of-attack data," whether that data came from Sensor X or Sensor Y).
  3.  **Dispositional/Architectural (The "Design Vulnerability" View):** Two events share a mechanism if they instantiate a latent vulnerability inherent to the system's design architecture. The mechanism isn't the failure event itself, but the *potential* for that failure built into the type.
  4.  **Interventional (The "Fix-Travels" View):** Two events share a mechanism iff the same repair prevents both. This defines mechanism retroactively by solution rather than prospectively by cause.

  **Selection:** The practices you describe (aviation grounding, medicine class warnings, software rollbacks) run on **Dispositional/Architectural Identity**. They treat the "mechanism" not as the specific chain of events that occurred, but as the *design capacity* that allowed those events to occur.

  ***

  ### The Reconstruction

  Here is the view from the trench. When we sit in a Failure Review Board, we aren't doing metaphysics, but we are absolutely making ontological commitments. The practices you've highlighted look inconsistent on the surface—grounding a whole fleet on two crashes versus demanding mountains of data to pull a drug—but they cohere if you understand that reliability engineering treats **design types as causal agents.**

  #### What the Practice Presupposes
  The regulatory and engineering practices you describe strictly presuppose the **Dispositional/Architectural** view of mechanisms.

  When the FAA grounds the 737 MAX fleet, they are not claiming that every single airframe has *already* failed via the exact same causal chain (Process-Isomorphism). They are claiming that every airframe instantiates the same *vulnerability architecture*. The mechanism is the MCAS system design, not the specific sensor failure that triggered it. The mechanism is treated as a property of the *population* (the fleet, the drug class, the code branch), not just the *instance*.

  This view presupposes that causal power resides in the **type**, not just the token. In aviation, the "type certificate" is the metaphysical unit of risk. In medicine, the "pharmacological class" is the unit of risk. In software, the "commit hash" or "release branch" is the unit of risk.

  The practice is *compatible* with the **Asymmetry of Error Costs** (your third candidate), but error costs do not define the mechanism. Error costs explain the *threshold* for action (why we ground on two crashes but might tolerate ten minor glitches), but they don't explain the *scope* of action (why we ground *all* planes, not just the two that crashed). You need the Architectural view to justify the scope. If you only had error costs, you might just inspect the two crashed planes more thoroughly. The fact that you ground the *sisters* implies you believe the flaw is inherited by virtue of shared design ancestry.

  #### Where It Is Underdetermined
  The practice is genuinely underdetermined between **Token-Identity** and **Dispositional/Architectural** views in routine operations.

  In 90% of reliability work, the physical parts *are* the architecture. If a specific batch of capacitors is failing, grounding the fleet based on that batch (Token) looks exactly the same as grounding it based on the circuit design (Architectural). The policy outcome is identical. You only see the divergence in edge cases like the 737 MAX or drug class effects.

  In the MAX case, the sensors weren't identical in every plane, and maintenance cultures differed. A strict Token-Identity view would suggest investigating each airline individually. The fact that regulators didn't do that reveals they are operating on the Architectural view: the vulnerability is in the logic, not just the hardware. Two rival accounts (Token vs. Architectural) license the same policy (inspect the planes) until the failure mode is systemic to the design rather than the component. That is where the underdetermination resolves itself in favor of Architecture.

  #### The Medicine "Inconsistency"
  You asked if medicine is inconsistent: demanding statistical signals for withdrawal but accepting weak evidence for class-wide warnings.

  On the **Dispositional/Architectural** view, this is not inconsistent. It reflects a shift between two different questions:
  1.  **Withdrawal (Token/Instance Risk):** "Is *this* specific molecule, at *this* dosage, in *this* population, causing net harm?" This requires epidemiological statistics because you are measuring realized token events against benefits.
  2.  **Class Warning (Architectural Risk):** "Does the *binding mechanism* shared by this class carry a latent risk?" This is mechanistic reasoning. If Drug A causes liver failure via a specific receptor pathway, and Drug B uses the same pathway, the *disposition* for liver failure exists in Drug B, even if the statistical signal hasn't emerged yet.

  Medicine isn't flipping-flopping; it's toggling between **evidence of occurrence** (stats) and **evidence of capacity** (mechanism). The statistical demand protects against false positives on specific products. The class-effect warning protects against false negatives on systemic vulnerabilities. They rest on different views of what constitutes risk: one is actuarial, the other is structural.

  #### Swapping to the "Fix-Travels" Criterion
  If we adopted your colleague's **Interventional (Fix-Travels)** criterion as the strict definition of mechanism, the operational landscape would change drastically.

  Currently, we ground the fleet *to buy time to find the fix*. We assume the mechanism is shared *before* we know how to stop it. If we adopted Fix-Travels:
  1.  **No Immediate Grounding:** We could not justify grounding the fleet immediately after the second crash. Why? Because we don't yet have a fix. If we don't have a fix, we can't test if it "travels." Therefore, we haven't established that the mechanism is the same across the fleet. We would be forced to keep flying the fleet while treating each plane as a unique case until a patch was developed and verified.
  2.  **Investigation Shift:** We would move from **isolation** to **experimental triage**. Instead of saying "All these are broken," we would say "None are confirmed broken until a patch works on all of them."
  3.  **Software Rollbacks:** In software, this would kill the "rollback on one error" practice. Currently, we roll back because we assume the *commit* is the mechanism. Under Fix-Travels, we would have to hotfix the production environment first. If the hotfix works on User A, *then* we assume it works on User B.

  **The Verdict:**
  Adopting Fix-Travels would make the system more efficient in terms of uptime but catastrophically riskier in terms of safety. It turns safety into a debugging problem rather than a containment problem. The current practice (Architectural) presupposes that **shared design implies shared fate** until proven otherwise. The Fix-Travels practice presupposes that **shared fate is only proven by shared salvation**.

  In high-consequence domains (aviation, pharma), we cannot afford to wait for salvation to define the danger. We act on the architecture because we know that in complex systems, the potential for failure is baked into the blueprint long before the first crack appears. The "mechanism" isn't what broke; it's the blueprint that allowed the break.
