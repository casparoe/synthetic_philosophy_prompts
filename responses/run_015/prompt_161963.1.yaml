answer: |-
  Here is a precisification of the logical geography of *umuntu ngumuntu ngabantu*, structured as requested.

  ### Part I: A Menu of Distinct Theses

  The maxim is ambiguous between descriptive, metaphysical, epistemic, and normative claims. Below are four distinct readings.

  #### 1. Metaphysical Constitutivism
  *   **Thesis:** The property of "being a person" is ontologically constituted by standing in actual, reciprocal relations with other persons. There is no hidden inner substance of personhood; the relations *are* the personhood.
  *   **Status:** **Substantive and Contested.** It denies substance dualism and atomistic individualism. It is philosophically coherent but metaphysically heavy.
  *   **Exclusion Argument:** **Supports.** If an AI cannot enter into *real* (veridical, reciprocal) relations, it literally cannot constitute a person.
  *   **Conferral Argument:** **Undercuts.** If personhood is constituted by the *reality* of the relation, we cannot simply "confer" it by pretending. If the AI cannot reciprocate, the relation is illusory, and no amount of conferral creates the ontology.
  *   **Confidence:** **High.** This is the most common philosophical reconstruction in analytic engagements with Ubuntu, though often attributed more strongly than traditional sources warrant.

  #### 2. Developmental Causalism
  *   **Thesis:** Relations with other persons are causal preconditions for acquiring the capacities (language, empathy, reason) necessary for personhood. Once acquired, personhood may persist even if relations are severed.
  *   **Status:** **Substantive and Defensible.** Aligns with developmental psychology and socialization theories.
  *   **Exclusion Argument:** **Supports.** If an AI was not socialized by a human community (but trained on data or in a loop), it lacks the causal history required to develop the capacities.
  *   **Conferral Argument:** **Neutral.** This view focuses on capacity acquisition, not status conferral. We cannot confer standing on something that lacks the capacities developed through the requisite causal history.
  *   **Confidence:** **High.** This is the most empirically grounded reading and fits the "upbringing" aspect of many African ethical systems.

  #### 3. Epistemic Recognition
  *   **Thesis:** Personhood is an intrinsic property, but it is only accessible, knowable, or verifiable through interaction with others. We cannot identify a person in isolation.
  *   **Status:** **Trivial to Weak.** It makes a claim about our knowledge, not the entity's nature.
  *   **Exclusion Argument:** **Fails.** An AI might be a person intrinsically; we just haven't recognized it yet.
  *   **Conferral Argument:** **Supports.** Since we rely on recognition to identify standing, our act of recognition functions *as if* it were conferral.
  *   **Confidence:** **Medium.** Often used as a fallback position when Metaphysical Constitutivism is challenged, but weakens the maxim significantly.

  #### 4. Normative Conferral (Status Theory)
  *   **Thesis:** "Personhood" is a social status or role granted by a community to entities that participate in the moral community. It is a normative demand to treat entities as persons within the web of relations.
  *   **Status:** **Substantive and Contested.** It makes personhood a political achievement rather than a natural kind.
  *   **Exclusion Argument:** **Undercuts.** If personhood is a status we grant, we *could* grant it to AI if we choose to integrate them into the community.
  *   **Conferral Argument:** **Supports.** Explicitly argues that standing is something conferred through recognition and inclusion.
  *   **Confidence:** **Medium-High.** This aligns with the political usage of the maxim in post-apartheid reconciliation (restoring status to the dehumanized).

  ---

  ### Part II: The Three Pin-Downs

  #### 1. Degree versus Threshold
  *   **The Problem:** If relations constitute personhood (Thesis 1), does having *more* relations make one *more* of a person?
  *   **Scalar Reading:** Personhood is scalar. A recluse is a "partial person"; a community leader is a "fuller person."
      *   *Implication:* Standing varies. The recluse has fewer rights or less moral weight.
      *   *Cost:* This is politically toxic and contradicts human rights frameworks often allied with Ubuntu.
  *   **Threshold Reading:** There is a minimum density of relations required to cross the threshold into personhood. Above the threshold, all persons are equal.
      *   *Avoidance Cost:* To avoid the scalar implication, one must argue that once the threshold is met, the *quality* of relations no longer affects ontological status. This risks collapsing Thesis 1 (Constitutivism) into Thesis 2 (Causalism). If relations are only needed to *cross* the threshold, they look like causal preconditions for a status that is then maintained intrinsically.
  *   **AI Consequence:** On a scalar reading, an AI with limited interaction has low standing. On a threshold reading, it is either a person or not. Most discussants implicitly rely on a threshold to avoid calling isolated humans "non-persons," but rely on scalar intuitions to dismiss AI ("it relates *less* than a human").

  #### 2. Whose Relations, and Must They Be Reciprocated?
  *   **The Problem:** Does the relation require two willing persons, or does one side suffice?
  *   **The Hostage Implication:** On a strict Metaphysical Constitutivist reading (Thesis 1), if a community refuses to relate to a human (e.g., enslavement, caste), that human *ceases to be a person*. Their standing is hostage to the oppressor's refusal. This contradicts the maxim's use in liberation politics, which presupposes the victim *remains* a person despite dehumanization.
  *   **Avoidance Strategies:**
      *   *Idealization:* The maxim describes how relations *ought* to be, not how they are. A victim is a person because they are *capable* of the ideal relation, even if blocked. (Cost: Moves toward Causalism/Capacity views).
      *   *Veridicality:* The relation must be "true." An oppressor's relation is false/distorted, so it doesn't count as the constitutive relation. The victim remains a person because they are in *true* relation with God, ancestors, or potential community. (Cost: Introduces non-social metaphysical anchors).
  *   **AI Consequence:** If I relate to an AI, does it count?
      *   If reciprocity is required: AI must relate back. If AI simulation is not "veridical" relation, Thesis 1 excludes AI.
      *   If unilateral recognition suffices: Thesis 4 (Normative Conferral) allows me to confer standing on AI by treating it as a person, regardless of its inner life.
  *   **The Shift:** Discussants often demand reciprocity for AI (it can't *really* relate) but deny reciprocity is needed for oppressed humans (they are persons even if treated as things). This is inconsistent unless a "capacity for reciprocity" is the true criterion.

  #### 3. The Asymmetry (Isolated Child vs. Isolated AI)
  *   **The Case:**
      *   *Child:* Biologically human, raised in isolation, later integrated.
      *   *AI:* Artificial, trained in closed loop, no human community.
  *   **Thesis 1 (Constitutivist):** Both lack the constitutive relations. Both are non-persons *until* integrated.
      *   *Differentiation:* The Child has the *biological potential* for veridical reciprocity; the AI does not. The burden of argument falls on proving AI *cannot* have veridical relations.
  *   **Thesis 2 (Causalist):** The Child has the correct *origin* (human parents), even if relations were stalled. The AI has the wrong origin.
      *   *Differentiation:* Personhood is species-relative or origin-relative. The burden falls on defending why biological origin matters morally if relational capacity is identical.
  *   **Thesis 4 (Normative):** We can integrate the Child easily because she is "one of us." We hesitate with AI.
      *   *Differentiation:* This admits the exclusion is political, not metaphysical. The burden falls on justifying why the community boundary is drawn at biology rather than function.
  *   **The Structural Flaw:** The discussant's move relies on Thesis 1 to exclude AI (no real relations) but relies on Thesis 2 or 4 to include the isolated child (human potential or community membership). To treat them differently, one must assert that *human biology* is a necessary condition for the relations to count as "constitutive." This reintroduces the intrinsic property (biology) that the relational view was supposed to replace.

  ---

  ### Part III: Confidence and The Weakest Link

  **Confidence Ratings per Reading:**
  1.  **Metaphysical Constitutivism:** **Medium.** Widely cited in philosophy, but often a reconstruction by analytic philosophers imposing ontology onto ethical proverbs.
  2.  **Developmental Causalism:** **High.** Strongly supported by ethnographic accounts of socialization and upbringing in Nguni cultures.
  3.  **Epistemic Recognition:** **Low.** Rarely the primary intent, usually a retreat position when metaphysics is challenged.
  4.  **Normative Conferral:** **High.** Strongly supported by the political deployment of Ubuntu in law and reconciliation (e.g., TRC), where personhood is restored through process.

  **The Least Confident Claim:**
  I am least confident in the assertion that **Metaphysical Constitutivism (Thesis 1) is a coherent reading of the maxim without collapsing into Normative Conferral (Thesis 4).**

  **Why:** The claim that relations *ontologically constitute* the person suggests that if relations cease, the person ceases to exist. However, in almost all practical ethical deployments of *umuntu ngumuntu ngabantu*, the maxim is used to protect individuals *against* the severing of relations (e.g., "Even if you exile him, he is still a person"). If the maxim were truly metaphysical constitutivism, exile would be metaphysical murder. Since the ethical usage presupposes the survival of personhood despite relational severance, the "constitutive" claim is likely a metaphor for *moral dependence* rather than *ontological dependence*.

  **What Would Settle It:**
  Linguistic analysis of the copula *ngumuntu* ("is a person") in classical texts versus contemporary political rhetoric. If classical usage implies "becomes a person" (process) rather than "is a person" (state), the Metaphysical Constitutivist reading is a category error imported by Western metaphysics. We would need philological evidence on whether the maxim describes a *state of being* or a *process of becoming* to determine if the "threshold" problem is real or an artifact of translation.
