      *Wait, one more thing:* The prompt says "feel that every time they think they have settled what the final state will be, one more step overturns it."
      *   If I just do 14 steps, they might think "Okay, 14 is the end."
      *   I need a mechanism where I keep adding steps *after* they think they are done.
      *   *Idea:* I hold a deck of "Step Cards." I deal them out one by one. They update the state.
