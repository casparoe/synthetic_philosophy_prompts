              *   This captures the wedge: (a) Every step is performed (by a person), (b) No step fixes the final state (because the Deadline isn't a step).
              *   This works. It uses the 14 students. It uses physical tokens. It separates the steps from the endpoint.

  4.  **Developing the "Human Supertask Chain" Design:**
      *   **Materials:** 14 Envelopes (or boxes), 1 Red Card, 1 Blue Card (On/Off), Timer, Whiteboard.
      *   **Roles:** 14 "Interval Agents," 1 "Deadline Judge" (Instructor or selected student), 1 "Scribe."
      *   **Sequence:**
