      *   *Correction on Timing:* We can't actually do halving time intervals in a 90 min class comfortably (2 mins, 1 min, 30s... gets too fast).
      *   *Better Mechanism:* **Logical Intervals, Physical Steps.**
      *   Don't simulate the *time* compression physically (too messy). Simulate the *logical ordering*.
      *   Use the "Contract" idea combined with the "Chain."
      *   **Revised Activity:** **The "Final State" Wager.**
      *   Setup: A box with a light (or card) inside.
      *   Rule: "The light toggles at every step $n$. There are infinitely many steps before $t=1$."
      *   Task: Students must write down the state at $t=1$.
      *   Twist: They are allowed to "run" the first 10 steps physically.
      *   Then they must commit.
      *   Then I reveal Step 11. Then Step 12.
      *   They realize any commitment is vulnerable to the next step.
      *   *Wait, this is still just "you can't do infinity."*
      *   I need to hit the specific wedge: **(a) Every step performed vs (b) No last step.**
