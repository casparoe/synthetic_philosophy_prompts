answer: |-
  You have put your finger on a distinction that often gets glossed over in introductory discussions of measurement, but is critical in advanced psychometrics, control theory, and AI safety. You are right to feel that "Goodhart's Law" is an imprecise label here.

  In classic Goodhart scenarios (especially the Adversarial or Causal varieties), the proxy *diverges* from the target. The number goes up, the reality goes down (or stays flat). The measure becomes a **lie**.

  In the pattern you are describing, the proxy does not lie. It tells the truth, but it stops **speaking**. The number goes up, the reality goes up, and then the number stays flat while the reality continues to vary (or degrades). The measure becomes **deaf**.

  ### The Established Concepts

  There isn't one single "Law" named after a sociologist for this, because it appears under different names in different fields. You are describing a convergence of three established concepts:

  **1. The Ceiling Effect (Psychometrics & Statistics)**
  This is the most direct fit for your Cases 1 and 3. A ceiling effect occurs when a substantial proportion of the sample scores near the maximum possible score on a measure.
  *   **Mechanism:** The mapping function from Target ($T$) to Proxy ($P$) is non-linear (typically sigmoidal). $P = f(T)$. As you optimize $T$, you push into the asymptote of $f$.
  *   **Result:** The derivative $\frac{\partial P}{\partial T}$ approaches zero. Small changes in $T$ (even negative ones) produce no change in $P$.
  *   **Why it's not Restriction of Range:** Restriction of range is usually a *selection* bias (e.g., studying only honor students). What you have is *optimization-induced* range restriction. You changed the population distribution by improving it, which broke the instrument's resolution.

  **2. Loss of Observability (Control Theory)**
  In control theory, a system is "observable" if you can determine its internal state from its outputs.
  *   **Mechanism:** When a sensor saturates (hits its max or min voltage), it outputs a constant signal regardless of the input.
  *   **Result:** The system becomes mathematically unobservable. You cannot distinguish between "stable at max" and "broken at max."
  *   **Fit:** This captures the "early-warning system has gone deaf" aspect perfectly.

  **3. Surrogate Endpoint Failure (Medicine/Economics)**
  This fits Case 2 best. You optimized a surrogate (response time) for a true endpoint (student mental health/support).
  *   **Mechanism:** Initially, $ResponseTime \propto 1/Quality$. But optimizing response time changed the system dynamics (backlog shifted downstream).
  *   **Result:** The causal link between Proxy and Target weakened or broke, but the Proxy itself remained accurate (response time *was* fast).
  *   **Distinction:** This *is* a form of Causal Goodhart's Law, but the *experience* is identical to saturation: the dashboard stays green while the patient dies.

  ### A Proposed Synthesis: "Metric Saturation"

  Since you are in a seminar and might need a term to discuss this, I propose you use **Metric Saturation** (or **Optimization-Induced Insensitivity**).

  It is distinct from Goodhart's Law in the following way:
  *   **Goodhart:** $Proxy \uparrow \implies Target \leftrightarrow$ or $\downarrow$ (The correlation breaks).
  *   **Metric Saturation:** $Proxy \rightarrow Max \implies \frac{\partial Proxy}{\partial Target} \rightarrow 0$ (The gradient vanishes).

  In Goodhart, the map stops matching the territory. In Metric Saturation, the map becomes too zoomed-out to show the terrain you are now walking on.

  ### Analyzing Your Cases

  **Case 1 (Sleep Tracker) & Case 3 (ML Reward Model): True Saturation**
  These are identical phenomena.
  *   **The Mechanism:** The proxy is a bounded function (0–100 score, or a reward model trained on a finite distribution).
  *   **The Trap:** You successfully optimized the target. The "easy gains" are gone. You are now in the noise floor of the instrument.
  *   **Is it Goodhart?** No. The correlation likely still holds if you include the old data (global correlation). But the *local* correlation is zero.
  *   **Verdict:** This is a **Ceiling Effect** causing **Loss of Observability**.

  **Case 2 (Counselling Service): Surrogate Myopia**
  This is slightly different, though it feels the same.
  *   **The Mechanism:** The metric hit a **Floor Effect** (response time cannot go below zero), but more importantly, the *scope* of the metric was too narrow.
  *   **The Trap:** By optimizing the intake, you displaced the friction. The metric remained accurate (intake *was* fast), but it ceased to be a valid *surrogate* for the whole system.
  *   **Is it Goodhart?** Yes, technically this is **Causal Goodhart**. Optimizing the proxy altered the causal structure of the service delivery.
  *   **Verdict:** This is **Sub-optimization** leading to **Systemic Blindness**. It feels like saturation because the metric stopped moving (hit the floor), but the root cause is that the metric was never the target, only a correlate.

  ### Why the Existing Labels Didn't Fit

  *   **Goodhart/Campbell:** These imply *corruption*. You didn't corrupt the measure; you outgrew it.
  *   **Restriction of Range:** This implies *selection*. You didn't select the best sleepers; you *made* everyone a better sleeper.
  *   **Base-Rate Problem:** Close. As the "bad sleep" base rate drops, the information entropy of the signal drops. But "Base-Rate" usually refers to false positives in classification, not loss of resolution in regression/scoring.

  ### Detection: Can you see it coming?

  Yes. You can detect Metric Saturation before it blinds you by monitoring three things:

  1.  **Variance Collapse:** Monitor the standard deviation of the proxy, not just the mean. If the mean is improving but the variance is shrinking rapidly, you are approaching a ceiling.
      *   *Signal:* $\sigma_{proxy} \to 0$ while $\mu_{proxy} \to Max$.
  2.  **Gradient Norm (ML specific):** In your course project, you could have monitored the gradient of the reward with respect to the model parameters. If the reward is climbing but the gradient norm is shrinking, the reward model is saturating.
  3.  **Histogram Bunching:** Plot the distribution of scores weekly. If you see a "spike" forming at the upper bound (e.g., a growing bar at 95+), the instrument is losing resolution.

  ### Mitigation

  If you are in this state, you cannot fix it by tweaking the same metric. You must:

  1.  **Instrument Switching:** Abandon the saturated proxy for a harder-to-measure but higher-resolution signal (e.g., switch from "Sleep Score" to "Reaction Time Test" or "Subjective Alertness Scale").
  2.  **Delta-Metrics:** Stop measuring absolute performance; measure *recovery from perturbation*. (e.g., How fast does sleep quality recover after one bad night?)
  3.  **Qualitative Injection:** Re-introduce human evaluation (the "eyeball test") to re-calibrate the proxy.

  ### Summary for your Seminar

  You can frame it this way:

  > "Goodhart's Law describes the **divergence** of proxy and target under optimization. I am proposing we distinguish a second failure mode: **Metric Saturation**. Here, the proxy and target **converge** so tightly that the proxy loses all variance. The measure doesn't lie; it just runs out of vocabulary. It is the difference between a compass that points the wrong way (Goodhart) and a compass that spins freely because you're standing on the magnetic pole (Saturation)."

  This distinction is rigorous, defensible, and clearly separates the *corruption* of measurement from the *exhaustion* of measurement.
