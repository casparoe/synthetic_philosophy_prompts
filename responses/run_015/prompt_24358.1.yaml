prompt: |-
  I'm in a political philosophy seminar this semester and we're doing a unit on Sen's liberal paradox, and next week we're having a guest speaker -- a political theorist who has written a book arguing that the right response to the paradox is not to give up on liberalism or on rational social choice, but to reject the whole social welfare ordering framework and replace it with a procedural one, where the affected individuals get to decide for themselves about the issues that concern them. His core move is that the moral requirement of autonomy is a constraint on the decision procedure (a right to decide), not a condition on the social ordering, so once you make that distinction the impossibilty result dissolves. I'm on the student panel and I get to ask a couple of questions, but I want to be the one who actually presses on the arguement instead of just saying "thanks for the talk." Could you draft eight to ten questions that go beyond having him restate the view? I want at least one on the line-drawing problem -- how he decides which issues are "private" enough to be off-limits to the social ordering, with a follow-up keyed to the answer he's most likely to give (I'm guessing he'll say the set is fixed by law or by the nature of the issue); one on what happens when the affected individuals disagree with each other, since the procedure has to say something about that; one on intergenerational issues, where there's no actual person around to make the decision, and whether the welfare ordering just sneaks back in through the back door; and one on whether his move is really an escape from the paradox or just relocating it to the meta-level of choosing the procedure. For each question, give me a follow-up that's keyed to the answer he's most likely to give, so I can keep the pressure on if he deflects.
