      *   *The Paradox of Phenomenal Judgment:* If my belief "I see red" is caused by neural firing $N$, and the experience of red $R$ is also caused by $N$, but $R$ causes nothing, then my belief is not *about* $R$ in a causal sense. It's about $N$. Yet, we talk as if we know $R$.
