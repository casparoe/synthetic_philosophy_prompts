  ## 6. Payoff Scheme (No Real Money)
  *   **Winner:** Draw the Gold Ball at the end of class.
  *   **Distribution:** If the winner holds multiple chits (e.g., they won Round 1 and Round 2), they get **one entry per chit**.
      *   *Example:* If the winner has 120 chits, write their name on 120 slips of paper and put them in a secondary "Winner's Drum." Draw one name.
      *   *Why:* This preserves the linearity of the chits throughout the class. 120 chits is exactly 12x better than 10 chits.
  *   **Alternative:** If logistics are too heavy, simply award the prize to the person with the most chits. (Ties broken by coin flip). This is approximately linear for small class sizes. **Recommendation:** Use the "Name in a Drum" method for strict linearity.
