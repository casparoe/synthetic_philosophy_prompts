answer: |-
  # Seminar Activity: The Risk Parameter
  **Time:** 80 Minutes
  **Class Size:** 24
  **Goal:** Demonstrate that risk attitude is a distinct normative parameter from utility curvature, using Risk-Weighted Expected Utility (REU) as the explanatory framework.

  ## 1. Materials & Setup (10 Minutes)

  **The Currency: "Chance Chits"**
  *   **The Prize:** One $50 Amazon Gift Card (or equivalent high-value, fixed prize).
  *   **The Mechanism:** A large opaque drum containing **1,000** numbered ping-pong balls. Exactly **one** ball is Gold. The rest are White.
  *   **The Rule:** At the end of class, you will draw one ball from the drum. If a student holds the ticket matching the Gold ball number, they win the prize.
  *   **Linearity Guarantee:** Explain clearly: "If you have 10 chits, you have a 1% chance. If you have 20 chits, you have a 2% chance. The value of a chit is constant. There is no diminishing return on *probability*."
  *   **Handout:** A simple choice sheet with three sections (Round 1, 2, 3).

  **The Risk Generator:**
  *   A standard 10-sided die (d10) or a bag with 10 numbered tokens (1-10).
  *   **Winning Roll:** 1 through 9 (90% chance).
  *   **Losing Roll:** 10 (10% chance).

  ---

  ## 2. The Rounds (40 Minutes)

  **Instruction:** "You are choosing for yourself. There is no right answer, only your preference. Record your choice privately."

  ### Round 1: The Trivial Stake (5 Minutes)
  *   **Option A (Safe):** You receive **10 Chits** immediately.
  *   **Option B (Risky):** I roll the d10.
      *   If 1–9: You receive **12 Chits**.
      *   If 10: You receive **0 Chits**.
  *   *Note:* Expected Value (EV) of A = 10. EV of B = 10.8.
  *   **Action:** Students mark A or B. Collect sheets? No, keep them for now.

  ### Round 2: The High Stake (5 Minutes)
  *   **Option A (Safe):** You receive **100 Chits** immediately.
  *   **Option B (Risky):** I roll the d10.
      *   If 1–9: You receive **120 Chits**.
      *   If 10: You receive **0 Chits**.
  *   *Note:* Structure is identical to Round 1, just scaled by 10x. EV of A = 100. EV of B = 108.
  *   **Action:** Students mark A or B.

  ### Round 3: The "News" Round (10 Minutes)
  *   **Setup:** Same choice as Round 1 (10 Chits Safe vs. 90% of 12 Chits).
  *   **The News:** Before they choose, make the following announcement:
      > "I have already rolled the die for the Risky Option. The result is sitting in this sealed envelope. It is either a 'Win' roll or a 'Lose' roll. The outcome is fixed; you just don't know it yet. Given this, choose again."
  *   **Action:** Students mark A or B.
  *   **Collection:** Collect all sheets.

  *(While you tally the results, write the REU formula on the board without naming it yet.)*
  $$ V = \sum_{i} \left[ r(P(\geq x_i)) - r(P(\geq x_{i+1})) \right] u(x_i) $$
  *(Keep it hidden or abstract for now, e.g., "Weighted Value = Sum of (Risk-Weight × Outcome)")*

  ---

  ## 3. The Debrief (30 Minutes)

  ### Part 1: The Utility Shape (10 Minutes)
  **Ask:** "Why did I use raffle tickets for a single prize instead of cash?"
  *   **Desired Answer:** To make the value of each ticket linear. $100 is not always 10x as useful as $10 to a person (diminishing marginal utility). But 100 chances is exactly 10x as likely to win as 10 chances.
  *   **The Point:** If you chose the **Safe Option** in Round 1 or 2, you rejected a higher average return (10.8 vs 10).
  *   **Standard View:** In standard theory, rejecting higher average return implies your *utility function* is curved (concave). You value the 10th dollar less than the 1st.
  *   **Our Reality:** We proved your utility function is *linear* (tickets). So, standard theory says you acted **irrationally** (leaving money on the table).
  *   **The REU Move:** REU says you can have a *linear* utility function (you love tickets evenly) but still rationally prefer the Safe option. How? By weighting the *probabilities* themselves.

  ### Part 2: Mapping to REU (10 Minutes)
  **Introduce the Risk Function $r(p)$:**
  *   In Expected Utility (EU), weight = probability ($p$).
  *   In Risk-Weighted Utility (REU), weight = risk function of probability ($r(p)$).
  *   **Risk Aversion in REU:** You overweight the certainty of the Safe option.
      *   Safe: 100% chance of 10. Weight = $r(1.0) = 1$. Value = 10.
      *   Risky: 90% chance of 12. Weight = $r(0.9)$.
      *   If you choose Safe, it means $10 > r(0.9) \times 12$.
      *   This implies $r(0.9) < 10/12 = 0.83$.
      *   But the actual probability is 0.9. You are treating a 90% chance as if it were an 83% chance.
  *   **The Parameter:** This $r$ function is separate from your utility $u$. You can love money linearly ($u(x)=x$) but still be risk-averse ($r(p) < p$).

  ### Part 3: The Stakes & The News (10 Minutes)
  **Discuss Round 2 (Scaling):**
  *   Did anyone switch from Safe (Round 1) to Risky (Round 2)?
  *   **EU Prediction:** If your utility curve is fixed, your risk attitude should be consistent relative to wealth. (Though with linear utility, you should always take the Risky EV+ bet).
  *   **REU Prediction:** REU allows your risk function $r$ to apply globally. If you are risk-averse, you should stay Safe in both. If you switched, your risk parameter might be sensitive to *magnitude*, which complicates the theory.

  **Discuss Round 3 (The News):**
  *   **The Question:** "Did the envelope change the math?"
  *   **Answer:** No. The probability was 90% before the roll, and it is 90% after the roll (from your perspective). This is the difference between *aleatory* (random) and *epistemic* (unknown fixed) uncertainty.
  *   **The Pumpability Check:** If you switched your choice in Round 3 because of the envelope, your risk parameter is **unstable**.
  *   **Critique:** REU claims to be a *normative* theory of rationality. If your risk weighting changes because I put the result in an envelope, are you being rational, or are you being psychologically 'pumped'? REU struggles to explain why the *source* of uncertainty matters if the probabilities are identical.

  ---

  ## 4. Instructor's Cheat Sheet: What Will Go Sideways

  **1. The "I Only Want One Prize" Objection**
  *   **Prediction:** A student will say, "100 tickets doesn't help me if I only need one to win."
  *   **Fix:** Remind them the drum has 1,000 balls. 100 tickets = 10% win rate. 10 tickets = 1% win rate. It is strictly linear. If they still doubt, ask: "Would you trade 10 tickets for $1?" If yes, utility is linear in cash equivalence.

  **2. Round 3 Confusion**
  *   **Prediction:** Students will think the envelope *improves* the odds (Gambler's Fallacy) or think you peeked.
  *   **Fix:** Be theatrical. Seal the envelope in front of them. Emphasize: "The state of the world is fixed. Your information is not."
  *   **Philosophical Payoff:** If they switch choices here, it highlights a limitation of REU. REU satisfies *Reduction of Compound Lotteries*. If students violate this, they are inconsistent by REU's own lights, suggesting REU captures *some* risk attitudes but not *framing* effects.

  **3. The "Rationality" Pushback**
  *   **Prediction:** Philosophy majors will argue that maximizing EV is the *only* rational stance in a one-off game.
  *   **Fix:** Concede the point partially. "If you play this game 1,000 times, take the Risky option. But this is a *seminar*, a one-off life choice. REU is designed to justify the intuition that 'certainty matters' in one-off high-stakes decisions."

  ---

  ## 5. Limitations of the Game (For your closing remarks)

  1.  **Dynamic Consistency:** This game is static. REU faces serious challenges regarding *dynamic consistency* (planning vs. acting). This game cannot reproduce the temptation to switch plans mid-stream.
  2.  **Global vs. Local:** REU posits a global risk function $r$. This game tests a local instance. A student might be risk-averse here but risk-seeking in dating or grades. The game implies risk attitude is a character trait; reality suggests it's domain-specific.
  3.  **The "News" Round Limit:** While the envelope trick tests epistemic vs. aleatory uncertainty, REU formally treats them identically. If students react to the envelope, it shows a psychological bias REU *doesn't* codify, rather than one it *does*. It reveals where REU fails to describe actual psychology, even if it succeeds in separating risk from utility.

