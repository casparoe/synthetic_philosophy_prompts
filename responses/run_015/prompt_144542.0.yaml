  8.  **Final Polish:** Check flow and philosophical accuracy regarding Strawson's "Freedom and Resentment." Ensure the distinction between *excusing* conditions and *determinism* is clear.

  *(Drafting thought)*: I need to make sure the transition to the three cases feels organic. Marcus can introduce them as "functional tests" given the user's background.
