      *(Self-Correction during drafting)*: Make sure Elena doesn't just say "It's human nature." She needs to argue that the *concept* of responsibility is constituted by the attitudes. If you remove the attitudes, you aren't talking about responsibility anymore, you're talking about something else (management, training).
      *(Self-Correction on Cases)*: Case 1 is the "Psychopath/Robot" objection. Case 3 is the "Narcissist/Bully" objection. Case 2 is the "Martyr" objection. I need to make sure the dialogue reflects these nuances.
      *(Word Count Check)*: Keep an eye on the length. If it gets too short, expand on the Control Theory analogy. If too long, trim the pleasantries.

  7.  **Final Review against Prompt:**
      *   1200-1500 words for dialogue? (Will monitor closely).
      *   Sharp characters? Yes.
