answer: |-
  **Project Title:** Predictive Stability and the Species Problem: A Pragmatic Reframing of Taxonomic Ontology

  **1. Introduction and Problem Statement**
  The "species problem" remains one of the most persistent impasses in the philosophy of biology. Standard discourse typically frames this as an ontological dispute: competing Species Concepts (Biological, Phylogenetic, Ecological, etc.) vie to identify the single correct metaphysical category that corresponds to mind-independent units in nature. While ontological clarity is a worthy goal, this framing has produced a pluralist stalemate. By treating species primarily as static kinds to be discovered, existing approaches treat predictive success as a downstream consequence of getting the ontology right. This proposal argues that this order of explanation is inverted. In scientific practice, species hypotheses are often retained or revised based on their capacity to stabilize inductive inferences across different domains of inquiry.

  This project proposes a pragmatic reframing of the species problem. Rather than asking "What is a species?", I ask: "Under what conditions does taxonomic unification license successful cross-scale predictions, and when does revision of species boundaries improve predictive accuracy in one domain while degrading it in another?" The central thesis is that species categories function as regulative ideals for modeling rather than strict mirrors of natural kinds. Their justification lies in their *explanatory and predictive stability* across evolutionary, ecological, and developmental time scales.

  **2. Research Question and Philosophical Motivation**
  The core research question is precise: *To what extent do conflicting species delimitations reflect trade-offs in predictive stability between macroevolutionary modeling and community ecology?*

  Existing ontological accounts leave this question open because they prioritize internal consistency (e.g., monophyly or reproductive isolation) over external utility. If a population cluster satisfies the criteria for a Phylogenetic Species Concept but disrupts the predictive power of a diversification rate model, standard ontology offers no guidance on whether the taxonomy is "wrong" or the model is ill-suited. By shifting the criterion of success from ontological fidelity to predictive robustness, this project treats taxonomic boundaries as variables optimized for specific inferential tasks.

  This approach addresses a gap in current literature regarding the role of "kinds" in special sciences. If natural kinds are defined by their projectibility, then a taxonomic grouping that fails to project reliably in a specific context (e.g., predicting disease vectors or extinction risk) is philosophically suspect, regardless of its genealogical purity. This project seeks to formalize the conditions under which taxonomic stability is epistemically virtuous versus when it is an obstacle to empirical accuracy.

  **3. Methodology and Work Plan**
  The project will employ a comparative case study methodology, analyzing instances where taxonomic revision (splitting or lumping) has occurred and documenting the subsequent impact on predictive modeling. The analysis will focus on paired domains:

  1.  **Macroevolutionary Dynamics:** How does species delimitation affect estimates of speciation/extinction rates and ancestral state reconstruction?
  2.  **Community Ecology and Conservation:** How does the same delimitation affect predictions regarding species interactions, niche modeling, or prioritization for conservation?

  I will select two to three detailed case studies from recent systematic literature where a significant taxonomic revision was adopted (e.g., the splitting of a widespread complex into cryptic species). For each case, I will reconstruct the predictive landscape prior to and following the revision. The analysis will not involve generating new biological data but rather a philosophical reconstruction of the modeling consequences reported in the scientific literature.

  The twelve-month timeline is structured as follows:
  *   **Months 1–3:** Literature review and case selection. Identification of taxonomic revisions where the impact on modeling is explicitly discussed in biological journals.
  *   **Months 4–7:** Detailed analysis of case studies. Mapping the trade-offs: does finer resolution improve ecological prediction (e.g., specific host-pathogen interactions) while introducing noise into macroevolutionary patterns (e.g., artificial inflation of diversification rates)?
  *   **Months 8–10:** Synthesis and framework development. Formulating a set of criteria for "predictive stability" that can guide taxonomic decisions without resorting to strict monism or unconstrained pluralism.
  *   **Months 11–12:** Drafting the dissertation chapter and preparing a companion article for submission.

  **4. Criteria for Success and Failure**
  Genuine progress in this project will be defined by the articulation of a *normative framework for taxonomic trade-offs*. Success looks like a set of philosophical criteria that allow biologists to justify species boundaries relative to the specific explanatory goals of their models (e.g., "For conservation prioritization, boundary X is justified; for diversification analysis, boundary Y is preferable").

  Failure would take two forms. First, if the case studies reveal that predictive stability is entirely idiosyncratic with no generalizable patterns, the project may only demonstrate local pragmatism without broader philosophical import. Second, if the analysis collapses back into a standard ontological debate (e.g., concluding that one concept is simply "true" and others are "false"), the pragmatic reframing will have failed. The goal is to sustain the tension between competing predictive needs, not resolve it by fiat.

  **5. Scope and Feasibility Assessment**
  A twelve-month timeline imposes strict limits on the number of case studies. Attempting to survey the entire history of systematic biology is impossible. Therefore, the scope is limited to contemporary revisions (last 20 years) where computational modeling plays a central role. This ensures that the "predictions" in question are formalized and comparable.

  There is a risk that the biological literature does not explicitly discuss the *loss* of predictive power in one domain when gaining it in another; scientists often optimize for their specific sub-field. To mitigate this, the project will focus on interdisciplinary controversies where macroevolutionary and ecological communities clash over the same taxonomic group. This ensures the trade-off is visible in the record.

  Furthermore, this project is conceptual, not empirical. I am not proposing to re-run phylogenetic analyses but to analyze the philosophical implications of existing analyses. This makes the timeline feasible for a single researcher. The primary deliverable is a dissertation chapter that establishes predictive stability as a viable alternative criterion for evaluating species concepts, contributing to broader debates in philosophy of science regarding natural kinds, modeling, and scientific realism.

  **6. Significance**
  By decoupling the justification of species categories from strict ontological commitment, this project offers a pathway out of the pluralist stalemate. It suggests that the "species problem" is not a puzzle to be solved by finding the right definition, but a management problem regarding the stability of induction across scales. This has implications beyond biology, offering a model for how other special sciences might handle contested categories where ontological precision conflicts with explanatory utility.
