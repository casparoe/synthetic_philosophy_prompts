  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but academic. *Predictive Stability and the Species Problem: A Pragmatic Reframing of Taxonomic Ontology.*

      *   **Introduction:** Start with the persistence of the species problem. Acknowledge the standard debate (ontological kinds). Pivot immediately to the proposed pragmatic/epistemic shift. The core idea: Species concepts are tools for prediction, not just mirrors of nature.

      *   **The Central Question:** Use the user's phrasing but refine it for academic precision. "Under what conditions does taxonomic unification license successful cross-scale predictions..."

      *   **Critique of Existing Approaches:** Why is the ontological debate insufficient? Because it assumes truth precedes utility. If we treat predictive success as merely a byproduct, we miss the trade-offs. Different domains (ecology vs. macroevolution) need different stabilizations.

      *   **Methodology:** How to investigate this? Case studies are best. Need paired examples where a taxonomic split or lump changed outcomes.
          *   *Domain A:* Macroevolution (diversification rates, ancestral state reconstruction).
          *   *Domain B:* Community Ecology (interaction networks, conservation prioritization).
          *   *Analysis:* Measure the "predictive stability" before and after revision.

      *   **Criteria for Progress:** What does a successful philosophical outcome look like? It's not solving the species problem definitively. It's providing a framework for *managing* the trade-offs. Failure would be returning to "one true concept."

      *   **Scope/Feasibility:** 12 months is tight for deep case studies. Need to be realistic. Limit the number of cases (e.g., 2-3 detailed pairs). Focus on the *philosophical analysis* of the scientific practice, not doing the biology myself.

      *   **Significance:** Connect back to philosophy of science. Model-based science, pragmatic realism, role of kinds in induction.

