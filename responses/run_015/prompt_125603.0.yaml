  2.  **Determine Structure:**
      A standard prospectus structure usually includes:
      *   Title (Working Title)
      *   Introduction/Problem Statement (The "Hook" and the shift in framing)
      *   Research Question (Precise formulation)
      *   Background/Motivation (Why existing approaches fail to address this)
