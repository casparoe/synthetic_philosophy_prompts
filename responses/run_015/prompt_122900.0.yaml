answer: |-
  Here is the analysis of your friend's decision-making framework, her predicted votes, and the stress tests that would reveal her actual operating system.

  ### 1. The Rule She Is Running: "Viability-Gated Sentience"

  Based on her record, she is not running a pure sentience rule, nor a pure cost-benefit analysis. She is running **Viability-Gated Sentience**.

  **The Principle:** *Welfare protections must be implemented for any species where there is credible evidence of sentience, **provided that** the cost or technical feasibility of the protection does not threaten the commercial viability of the certification label or the survival of the farms.*

  **How it fits her record:**
  *   **Salmon (Vertebrates):** Sentience is assumed (high). Stunning tech exists. **Result:** Require stunning.
  *   **Salmon Density:** Welfare benefit is real, but cost threatens label viability (farms will drop out). **Result:** Reject density limit.
  *   **Crabs (Decapods):** Sentience evidence is behavioral (rubbing/avoidance). Tech exists. Cost is absorbable (niche market). **Result:** Require stunning/welfare.
  *   **Shrimp (Decapods):** Sentience evidence is similar to crabs, *but* previously, stunning tech was expensive or unscalable. **Result:** Reject stunning (Ice slurry is the "cheap" default).
  *   **Eyestalk Ablation:** Welfare need is high. Anaesthesia tech/product does not exist. **Result:** Reject anaesthesia (feasibility gate).
  *   **Octopus:** Sentience is high/uncertain. Welfare risk is extreme. **Result:** Ban certification (Viability of the *label's reputation* is the constraint).
  *   **Insects:** Sentience is uncertain. Numbers are high. **Result:** Defer ("come back with data" = feasibility of proof is missing).

  **The Prediction for the Shrimp Vote:**
  1.  **Require Stunning?** **YES.**
      *   *Reasoning:* The "Viability Gate" has been opened. The evidence review puts shrimp sentience on par with crabs (her precedent), and the new stunner is cheap (1–2%) and scalable. The economic objection she used previously no longer applies.
  2.  **Is Behavioral Validation Enough?** **YES.**
      *   *Reasoning:* She accepted behavioral evidence for crabs ("rubbing a wounded claw," "avoiding a shelter"). To demand neurophysiological proof now (which the review says is unavailable/unclear) would be moving the goalposts. The "feasibility" of validation is met by the crab standard.

  ---

  ### 2. The Alternative Rules (And Where They Split)

  There are two other rules that fit her past votes almost as well but predict differently on the upcoming shrimp case.

  #### Alternative A: "Neuroanatomical Hierarchy"
  **The Principle:** *Protection scales strictly with neurological complexity. Vertebrates get full rights; Decapods get conditional rights based on size/complexity; others get none.*
  *   **Fit:** Explains Salmon/Cleaner Fish (Vertebrates = Yes). Explains Bivalves/Insects (No). Explains Octopus Ban (Too complex to manage risk). Explains Crab vs. Shrimp (Large decapods = Yes; Small decapods = No).
  *   **The Split:**
      *   **Stunning Vote:** **NO.** Shrimp neuroanatomy hasn't changed. The evidence review explicitly notes "no agreed decapod analogue of the vertebrate telencephalon."
      *   **Validation Vote:** **HOLD OUT.** Behavioral validation is insufficient for "lower" taxa; she would demand neurophysiological proof of insensibility, which doesn't exist.

  #### Alternative B: "Precautionary Deferral"
  **The Principle:** *When sentience is uncertain, do not regulate unless the method is egregious (boiling/declawing). If numbers are massive, wait for definitive data to avoid aggregate regulatory error.*
  *   **Fit:** Explains Insects ("scary numbers" + "need data"). Explains Shrimp (Ice slurry is "passive," not "egregious" like boiling). Explains Octopus (Ban is the ultimate precaution).
  *   **The Split:**
      *   **Stunning Vote:** **NO / DEFER.** The evidence review says the behavior is "compatible with nociceptive reflex." Uncertainty remains. With hundreds of billions of animals, a false positive (regulating non-sentient beings) is a massive economic waste; a false negative is a welfare risk. She waits for better data.
      *   **Validation Vote:** **REJECT.** Behavioral validation is explicitly flagged as ambiguous ("can't cleanly distinguish insensibility from paralysis"). A precautionary principle requires certainty before imposing a mandate.

  ---

  ### 3. The Discriminating Case

  You have three candidates. To tell **Viability-Gated Sentience** (her likely rule) apart from **Neuroanatomical Hierarchy** (the strongest rival), you need a case where Cost is Low, but Neurology is Low.

  **The Winner:** **A near-costless kill method for the feed insects.**

  **Why this discriminates best:**
  *   **Viability-Gated Sentience Predicts: YES.**
      *   Sentience is uncertain (like shrimp), *but* the cost barrier is removed ("near-costless"). The "scary numbers" (aggregate harm) now outweigh the uncertainty because the economic gate is open. She cannot cite cost or feasibility to block it.
  *   **Neuroanatomical Hierarchy Predicts: NO.**
      *   Insects are below the threshold. Cost is irrelevant. If the hardware isn't there, the protection isn't granted.
  *   **Precautionary Deferral Predicts: NO / DEFER.**
      *   She explicitly said "come back with data." Unless the data has changed, the rule is to wait, regardless of cost.

  **Why the others fail:**
  *   *Untested Finfish:* Both Viability and Neuro rules predict "Yes" (Vertebrates get protection). It doesn't split them.
  *   *Whole-life Enrichment:* This tests Cost vs. Welfare, but it's muddy. She might vote "No" on enrichment for *any* species if it's expensive, which doesn't tell you if she values the *animal* or the *budget*. The Insect case isolates the "Sentience Threshold" variable.

  ---

  ### 4. The Closest Precedent & The Commitment

  **The Closest Analog:** **The Edible Crab Vote.**

  **Why:**
  Taxonomically, shrimp and crabs are both decapod crustaceans. Evidentially, the case is identical: behavioral indicators of pain (rubbing/avoidance) without neuroanatomical confirmation.

  **What She Is Committing To:**
  *   **If she votes YES (Require Stunning/Behavioral OK):**
      *   She commits to the position that **Decapod sentience is binary, not graded.** She admits her previous shrimp votes were purely economic, not principled. She binds herself to requiring stunning for *all* decapods in the future, regardless of size, provided tech exists. She cannot later vote against crayfish or prawn stunning without contradicting herself.
  *   **If she votes NO (Reject Stunning/Demand Neuro Proof):**
      *   She commits to the position that **Crabs were an anomaly or that size matters.** She undermines the scientific basis of her own crab vote (since the evidence type is the same). She also establishes that "feasibility" includes *scientific certainty*, not just economic cost. This creates a trap for the Octopus case: if she demands neuro-proof for shrimp, she must logically certify Octopus if neuro-proof is found, contradicting her "Ban" stance.

  **The Trap:**
  The **Salmon Density** vote is the ghost in the room. If she votes **No** on shrimp stunning, she reveals that her "Sentience" arguments are secondary to "Market Viability." If she votes **Yes**, she reveals that her "Market Viability" arguments are secondary to "Sentience." She cannot claim both are absolute principles. The shrimp case forces her to admit which one is the master and which one is the slave. Given the 1–2% cost, the Viability-Gated Sentience rule demands she submit to the Sentience.
