answer: |-
  You have put your finger on the central structural tension in anthropic reasoning, but you are right to feel that the standard nomenclature ("The Doomsday Argument," "The Reference Class Problem") is too coarse to capture the specific dialectical movement you are observing. There is no single lexical item for the phenomenon you describe, largely because the literature tends to treat the "Hydra" (reference class instability) and the "Conservation" (the SSA/SIA trade-off) as separate problems, when your supervision meetings have correctly identified them as two faces of the same underlying issue regarding **indexical information and the Principle of Indifference.**

  Here is the carving you asked for.

  ### 1. The Names and Nearest Concepts

  **The "Hydra" Property:**
  In the literature, this is usually discussed under the header of **Reference Class Instability** or **The Reference Class Problem for Observation Selection Effects**. However, your description is more precise than the standard treatment. Standardly, the reference class problem is treated as an ambiguity that prevents a conclusion (i.e., "we can't conclude doom because we don't know if we should count chimps"). Your observation is that the argument is *robust* across classes, merely *relocating* the prediction.
  *   **Nearest Concept:** **Predictive Displacement.** When you restrict the reference class to block a Doomsday prediction, you are effectively running a new Doomsday Argument on the subset.
  *   **Divergence:** Standard reference class problems (e.g., in actuarial science) result in *indeterminacy* (we don't know the probability). In the Doomsday context, restricting the class results in a *determinate but absurd* probability (e.g., "philosophers will go extinct soon"). The argument doesn't dissolve; it metastasizes.

  **The "Conservation of Absurdity":**
  This is the **SSA/SIA Trade-off**.
  *   **SSA (Self-Sampling Assumption):** You should reason as if you are a random sample from the set of all observers in your reference class. (Yields Doomsday).
  *   **SIA (Self-Indication Assumption):** You should reason as if you are a random sample from the set of all *possible* observers, weighted by the probability of that world existing. (Yields "Presumptuous Philosopher").
  *   **The Conservation:** It is a formal feature of the Bayesian update. SSA introduces a likelihood ratio favoring smaller total populations (because your rank is low). SIA introduces a prior ratio favoring larger total populations (because you exist). Mathematically, they cancel out.
  *   **Is it genuine?** Yes, but "absurdity" is the wrong metric. It is a **Conservation of Surprisal**. You must find *either* your birth rank surprising (SSA/DA) *or* your existence surprising (SIA/Presumptuous Philosopher). You cannot find neither. The "absurdity" arises because both conclusions violate our intuitive priors about stability and cosmic modesty.

  ### 2. The Forgotten Paper

  The paper you are half-remembering is almost certainly:
  **J. Richard Gott III, "Implications of the Copernican principle for our future prospects," *Nature* 363 (1993).**

  *   **The Examples:** Gott applies the same logic (often called **Gott's Copernican Principle**) to the Berlin Wall (predicting its fall based on how long it had stood), the run of *Nature* magazine, and the duration of Broadway shows.
  *   **Connection to DA:** Gott's argument is the temporal analogue of the Doomsday Argument. DA uses birth *rank*; Gott uses temporal *duration*. Both rely on the assumption that your observation point is not special.
  *   **Why it matters for your student:** Gott's paper is the clearest example of the argument applied to non-cosmological cases, which bridges the gap to your colleague's seminar joke.

  ### 3. The Seminar Joke: Why it Fails (and Why it's Funny)

  Your colleague's joke (applying DA to an 8-week term) works as comedy because it highlights a **Category Error regarding Epistemic Ignorance**.

  *   **The Condition of Ignorance:** Both DA and Gott's principle require that you have *no independent knowledge of the causal mechanism* determining the total size or duration. You must be treating your position as a random sample from a distribution you do not understand.
  *   **The Seminar Case:** You *know* the mechanism. The term length is fixed by administrative fiat, not by a stochastic extinction process. Applying the Principle of Indifference here violates your actual evidence.
  *   **The Philosophical Carving:** This distinguishes **Aleatory Uncertainty** (inherent randomness, where DA might apply) from **Epistemic Uncertainty** (lack of knowledge about a fixed fact). The "funny" feeling is the friction of applying an epistemic tool designed for ignorance to a situation of knowledge.
  *   **Boundary Case:** This is the strongest objection to DA. If we have a theory of population growth (e.g., demographic transition models), we should use that theory, not the Copernican principle. DA only has force if we claim total ignorance of the causal drivers of human extinction.

  ### 4. Boundary Cases and Analogues

  **Fine-Tuning:**
  Yes, the "Conservation" shows up here.
  *   **SSA** makes fine-tuning evidence for a Designer (because a single universe being tuned is unlikely).
  *   **SIA** makes fine-tuning evidence for a Multiverse (because you are more likely to exist in a reality where there are many universes, increasing the chance one is tuned).
  *   **The Shift:** Just like DA, trying to solve the fine-tuning problem by shifting anthropic assumptions often just moves the "specialness" from the constants to the observer selection rule.

  **Non-Identity Literature:**
  There is a structural analogue but a distinct problem.
  *   **Parfit's Non-Identity Problem:** Concerns *which* individuals exist based on our choices.
  *   **DA/Anthropics:** Concerns *how many* individuals exist and where *you* sit in that sequence.
  *   **The Overlap:** Both rely on **Person-Affecting Views**. If you adopt a "Wide Person-Affecting View" (similar to SIA), you care about the total number of people. If you adopt a "Narrow" view (similar to SSA), you care about the welfare of specific identifiable people. The "Hydra" appears here too: if you restrict moral concern to "people who exist," you get one paradox; if you extend it to "possible people," you get the Repugnant Conclusion. The logical structure of **expanding the domain to solve a paradox creates a new paradox** is identical.

  ### 5. Verdict on Your Labels

  **"The Hydra Property"**
  *   **Verdict:** Keep it. It is vivid and accurate.
  *   **Refinement:** In your WIP, define it as **Reference Class Metastasis**. It captures the idea that the argument doesn't die; it infects the new class. It distinguishes the phenomenon from simple ambiguity.

  **"Conservation of Absurdity"**
  *   **Verdict:** Use with caution. It is excellent for dialectic, but a skeptic will say "absurdity" is subjective.
  *   **Refinement:** Call it the **Anthropic Tension** or the **SSA-SIA Antinomy**. However, for the purpose of your talk, "Conservation of Surprisal" is more technically defensible. You are conserving the amount of Bayesian updating required against your prior.

  ### 6. Advice for the Works-in-Progress Slot

  Since you want to avoid the soundness of the argument itself, focus on the **Epistemic Preconditions of the Copernican Principle.**

  Your student has stumbled onto the fact that the Doomsday Argument is not a standalone proof, but a **default rule for reasoning under total ignorance.**
  *   **The Thesis:** The "Hydra" and "Conservation" phenomena arise because we are trying to use a principle of indifference (I am not special) to solve a problem that requires causal knowledge.
  *   **The Move:** Argue that the "absurdity" isn't in the conclusion (Doom or Multiverse), but in the **application condition**. The seminar joke proves that when the causal mechanism is known, the argument vanishes. Therefore, the Doomsday Argument is not a discovery about the future, but a measurement of our current ignorance about the causal mechanisms of extinction.
  *   **The Payoff:** This allows you to discuss the logic without needing cosmology. You can treat the DA as a tool in **Decision Theory under Indexical Uncertainty**. The "Hydra" is the tool malfunctioning when the input (the reference class) is ill-defined. The "Conservation" is the tool balancing its own errors.

  **Summary for your notes:**
  1.  **Forgotten Paper:** Gott (1993), *Nature*.
  2.  **Hydra:** Reference Class Metastasis (distinct from standard ambiguity).
  3.  **Conservation:** SSA/SIA Antinomy (Conservation of Surprisal).
  4.  **Seminar Joke:** Violation of the Condition of Ignorance (Epistemic vs. Aleatory).
  5.  **WIP Angle:** The DA measures ignorance, not doom.

  You are not out of your depth; you have identified that the Doomsday Argument is less a cosmological claim and more a stress test for how we handle indexical information in Bayesian frameworks. The "absurdity" is the sound of the framework creaking.
