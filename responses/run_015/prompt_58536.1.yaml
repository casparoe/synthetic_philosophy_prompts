      *   *Check:* Did I explain *why* Move 2 succeeds/fails? Yes (Role duty is real, but infinite duty is problematic).
      *   *Check:* Move 3 is the "Over-demandingness objection." Make sure to name it.
      *   *Check:* Move 4 is the "Excuse vs. Permission" and "Optimality" point.
      *   *Tone:* Academic but accessible (Intro module level).
