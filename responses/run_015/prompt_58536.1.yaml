answer: |-
  This is an exceptionally sophisticated exchange for a family dinner; your cousins have effectively recreated a central debate in contemporary moral philosophy regarding the limits of obligation and the coherence of supererogation. Below is an adjudication of their four moves, followed by the crucial distinction they missed and a final judgment.

  ### Point-by-Point Adjudication

  **Move 1: The Contractual Baseline (Cousin 1)**
  *   **The Claim:** The act is supererogatory because it exceeds contractual requirements; omitting it attracts no fair criticism.
  *   **Where it Succeeds:** This captures the intuitive "common sense" definition of supererogation. It correctly identifies the **non-blameworthiness condition**: if the doctor had said "no," we would not morally condemn her. It anchors the discussion in a concrete baseline (the contract).
  *   **Where it Fails:** It commits the **legalistic fallacy**. Moral duty and contractual duty are not co-extensive. A doctor has a moral duty not to harm a patient even if no contract exists, and conversely, a contract might require something immoral. Relying on the rota as the moral baseline is too thin; morality often demands more than the minimum legal or professional standard (e.g., stopping to help at a car crash is not in your employment contract, but may still be a moral duty).
  *   **Verdict:** Intuitively correct about the specific case, but philosophically weak on the definition of duty.

  **Move 2: The Role-Responsibility Baseline (Cousin 2)**
  *   **The Claim:** Professional roles carry implicit duties that expand during emergencies; therefore, the shifts were required, not optional.
  *   **Where it Succeeds:** It correctly identifies that **special obligations** arise from voluntary roles. By choosing to become a doctor, one accepts a "duty of care" that exceeds that of a bystander. This challenges Cousin 1's reliance on the contract by appealing to the *spirit* of the profession.
  *   **Where it Fails:** It risks the **slippery slope of over-demandingness**. If duty expands automatically to meet every need during a crisis, the concept of "beyond duty" vanishes for professionals. It implies that as long as a doctor is needed, they are duty-bound to serve, potentially indefinitely.
  *   **Verdict:** Stronger than Move 1 on the nature of professional ethics, but threatens to erase the category of supererogation entirely for specific roles.

  **Move 3: The Limit of Personal Cost (Cousin 1)**
  *   **The Claim:** If duty absorbs all admirable acts, the category becomes empty for demanding roles. There must be a limit grounded in personal cost (health/exams).
  *   **Where it Succeeds:** This is the classic **Over-Demandingness Objection**. It successfully defends the logical space for supererogation. It appeals to the idea of an **agent-centered prerogative**: moral agents are permitted to give some priority to their own interests (health, career progression) even when sacrificing them would produce more good. Without this limit, morality becomes self-effacing or impossible to sustain.
  *   **Where it Fails:** It does not specify *where* the limit lies. How much cost is too much? Is one night of lost sleep enough to make the act supererogatory, or does it require permanent damage? It asserts a boundary without providing a metric for it.
  *   **Verdict:** Philosophically robust. It saves the concept of supererogation from collapsing into general duty.

  **Move 4: Excuse vs. Permission and the Optimality Challenge (Cousin 2)**
  *   **The Claim:** Absence of blame is unreliable (we excuse unavoidable failures). Also, if an act is the "morally best," why is it merely allowed rather than required?
  *   **Where it Succeeds:** This is the strongest philosophical move. It distinguishes between **excuses** (you did wrong, but we don't blame you because you were tired) and **justifications/permissions** (you did no wrong by omitting the act). It also raises the **Paradox of Supererogation**: If morality aims at the good, and Act A is better than Act B, why does morality permit Act B? This challenges the coherence of supererogation itself.
  *   **Where it Fails:** It assumes a strictly **maximizing conception of morality** (like Utilitarianism), where the "best" outcome is always mandatory. Many moral theories reject this, arguing that morality sets a floor (duties) but leaves a ceiling open (saintliness).
  *   **Verdict:** Theoretically devastating if one accepts maximizing morality, but less persuasive if one accepts that morality allows for personal discretion.

  ### The Crucial Missing Distinction

  Neither cousin explicitly distinguished between **Objective Moral Optimality** and **Subjective Moral Requirement**.

  *   **Objective Optimality:** From a "god's eye view," taking the shift might produce the best overall outcome (patients are cared for). Cousin 2 focuses on this.
  *   **Subjective Requirement:** From the agent's perspective, given human limitations and the right to a personal life, the act is not *enforceable* or *mandatory*. Cousin 1 focuses on this.

  Furthermore, they conflated **Blamelessness** with **Permission**.
  *   **Permission:** You have a right to omit the act; it is not wrong to decline. (Cousin 1's view).
  *   **Excuse:** It is wrong to decline, but you are not blameworthy because the cost was too high or you were exhausted. (Cousin 2's view in Move 4).

  This is the pivot point. If the doctor is merely *excused*, she has failed a duty. If she is *permitted*, she has fulfilled all her duties. Supererogation requires the latter (Permission), not the former (Excuse).

  ### Overall Judgment

  **Cousin 1 is more right overall.**

  While Cousin 2 demonstrates superior grasp of the theoretical tensions (specifically in Move 4 regarding the link between "best" and "required"), Cousin 1 arrives at the more defensible moral conclusion for two reasons:

  1.  **Preservation of Moral Coherence:** Cousin 2's view leads to a collapse of the supererogatory category. If every "best" act becomes a duty, then "duty" becomes synonymous with "saintliness." This makes morality overly demanding and potentially self-defeating (a doctor who ruins their health cannot treat patients later). Cousin 1's appeal to personal cost (Move 3) correctly identifies that morality must be sustainable for human agents.
  2.  **The Nature of Professional Obligation:** While doctors have heightened duties, they do not surrender their status as moral agents with personal lives. Cousin 2's argument in Move 2 implies that the role consumes the person. Cousin 1 correctly identifies that there is a point where the *cost to the agent* outweighs the *demand of the role*, transforming the act from duty to gift.

  **Why Cousin 2 loses despite Move 4:** Cousin 2's challenge ("Why wouldn't morality require the best?") assumes that morality is solely about maximizing good outcomes. However, most plausible moral systems include **prerogatives**—the right to not sacrifice oneself for the greater good beyond a certain point. Therefore, an act can be the "best" without being "required." Cousin 1 captures this nuance intuitively, whereas Cousin 2 treats it as a logical puzzle to be solved by expanding duty.

  **Final Note:** The junior doctor's action is indeed supererogatory. She was permitted to decline (it was not wrong), but praiseworthy for volunteering (it was good). Cousin 2 is correct that she is *blameless* if she declines, but wrong to suggest this blamelessness is merely an excuse for failing a duty. It is a testament to her virtue that she acted where she was not required to.
