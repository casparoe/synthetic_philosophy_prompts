prompt: |-
  I am taking an introductory module in moral philosophy and have been puzzled by the idea of supererogation, understood roughly as acting well beyond what duty requires in a way that is praiseworthy when performed but not blameworthy when omitted. At a recent family dinner, two of my cousins who are both medical trainees fell into a sustained disagreement about the case of a junior doctor colleague who had volunteered for repeated extra night shifts during a winter staffing crisis at significant cost to her own health and exam preparation, and I listened throughout as a neutral bystander without taking sides.

  Their exchange went roughly as follows. First, one cousin said the colleague had acted beyond duty precisely because her rota and contract did not require the extra shifts and declining them would not have been fair to criticize, which seemed to fit the definition of praiseworthy but optional. Second, the other cousin replied that contractual minima are the wrong baseline for role-based obligations, arguing that by becoming a doctor one assumes a broader duty of care that intensifies in emergencies, so the extra shifts, while admirable and demanding, were still the fulfillment of a professional duty rather than something merely optional. Third, the first cousin answered that if duty expands to absorb every admirable response to need, then people with demanding roles such as doctors or parents could almost never act beyond duty, which would make the category empty for exactly those lives where it seems most relevant, and insisted there must be some limit grounded in personal cost beyond which duty ends. Fourth, the second cousin rejoined that the absence of blame upon omission is an unreliable test for optionality, since we often withhold blame from people who fail to do what is genuinely required when failure is understandable, as with exhaustion or competing obligations, so being excused is not the same as being permitted, and added that if the extra shifts were genuinely the morally best course it is puzzling why morality would merely allow rather than require them.

  Could you adjudicate their disagreement point by point, explaining for each of the four moves where the reasoning succeeds and where it goes wrong, identifying any crucial distinction or consideration that neither cousin noticed, and concluding with a judgment about who is more right overall and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Introductory moral philosophy module.
      *   **Topic:** Supererogation (acting beyond duty, praiseworthy if done, not blameworthy if omitted).
      *   **Scenario:** A disagreement between two medical trainee cousins about a junior doctor volunteering for extra shifts during a crisis at personal cost.
      *   **Task:** Adjudicate the disagreement point-by-point (4 moves), identify successes/failures in reasoning, spot missing distinctions, and conclude with an overall judgment.

  2.  **Deconstruct the Four Moves:**

      *   **Move 1 (Cousin 1):** The colleague acted beyond duty because contract/rota didn't require it. Declining wouldn't be fair to criticize. Fits "praiseworthy but optional."
          *   *Analysis:* Relies on a contractual/legalistic baseline for moral duty. Intuitively appealing but philosophically shallow. Moral duty often exceeds legal/contractual duty.
          *   *Success:* Captures the "not blameworthy if omitted" condition well.
          *   *Failure:* Equates contractual obligation with moral obligation.

      *   **Move 2 (Cousin 2):** Contractual minima are wrong baselines. Being a doctor implies a broader duty of care, intensifying in emergencies. Shifts were fulfillment of professional duty, not optional.
          *   *Analysis:* Relies on role morality/professional ethics. Suggests duty scales with need.
          *   *Success:* Recognizes that professional roles carry moral weight beyond contracts.
          *   *Failure:* Risks over-demandingness. If *all* good acts become duties, supererogation vanishes.

      *   **Move 3 (Cousin 1):** If duty absorbs every admirable response, the category of supererogation becomes empty for demanding roles (doctors/parents). There must be a limit grounded in personal cost.
          *   *Analysis:* The "Over-demandingness Objection." Defends the logical space for supererogation. Introduces "personal cost" as a boundary.
          *   *Success:* Identifies a major theoretical problem (collapse of supererogation). Highlights the importance of personal prerogative.
          *   *Failure:* Doesn't specify *how much* cost is enough to stop duty.

      *   **Move 4 (Cousin 2):** Absence of blame is unreliable (excuses vs. justifications). If it's the *best* course, why wouldn't morality require it? (The "Optimality" challenge).
          *   *Analysis:* Distinguishes excuse (blameless wrong) from permission (right to omit). Challenges the coherence of supererogation (why not require the best?).
          *   *Success:* Sharp philosophical point about blame vs. permission. Raises the "Why not require the best?" puzzle.
          *   *Failure:* Potentially leads to an overly demanding moral theory (Saintliness as Duty).

  3.  **Identify Missing Distinctions/Considerations:**
      *   **Excuse vs. Justification:** Cousin 2 hints at this, but it needs explicit framing. Omission might be *excused* (blameless wrong) rather than *permitted* (right).
      *   **Moral Duty vs. Professional Duty:** Are they the same? A doctor might have a professional duty that isn't a strict moral duty enforceable by blame.
      *   **The "Good" vs. The "Required":** The distinction between what is morally optimal and what is morally mandatory.
      *   **Agent-Centered Prerogative:** The idea that agents are allowed to give some weight to their own interests (Scheffler).
      *   **The Definition of Supererogation:** Is it defined by *blamelessness* or by *non-requirement*?

  4.  **Drafting the Adjudication (Point by Point):**

      *   *Move 1:* Good intuition on blame, bad on contract. Moral duty $\neq$ Contract.
      *   *Move 2:* Good on role morality, bad on scope. Risks "moral over-demandingness."
      *   *Move 3:* Strong theoretical point. Saves the concept of supererogation from extinction. Needs to define the "cost" threshold.
      *   *Move 4:* Strongest philosophical move. Distinguishes excuse from permission. Challenges the logic of "optional best."

  5.  **Formulating the Conclusion:**
      *   Who is more right? It's a tension between two valid perspectives.
      *   Cousin 1 defends the *phenomenology* of supererogation (it feels optional).
      *   Cousin 2 defends the *logic* of moral requirement (why isn't the best required?).
      *   *Verdict:* Cousin 2 has the stronger *philosophical* argument regarding the definition of duty and blame, but Cousin 1 correctly identifies the *practical necessity* of a limit to prevent moral burnout/impossibility. However, in the context of *moral philosophy*, Cousin 2's challenge to the definition of supererogation (Move 4) is the more profound insight, even if Cousin 1's conclusion (that it *is* supererogatory) is more socially palatable.
      *   *Wait, let's refine:* Actually, standard philosophical consensus usually sides with the *possibility* of supererogation (Cousin 1's goal) but acknowledges Cousin 2's critique (the "Paradox of Supererogation"). Cousin 1 is right that supererogation exists; Cousin 2 is right that defining it is hard.
      *   *Better Verdict:* Cousin 1 is more right about the *case* (it likely is supererogatory), but Cousin 2 is more right about the *theory* (the tension between optimality and requirement). I need to pick a side based on "who is more right overall." Usually, in intro ethics, preserving the category of supererogation is important, but acknowledging the "Excuse vs. Permission" distinction is crucial. Cousin 2's Move 4 is the most philosophically sophisticated point. However, Cousin 1's Move 3 saves the concept from collapsing.
      *   *Decision:* I will argue that Cousin 2 identifies the deeper theoretical problem, but Cousin 1 correctly applies the concept to the specific case. However, since the prompt asks to adjudicate the *disagreement*, I should lean towards the view that best preserves moral coherence. Cousin 2's view (that it might be duty) is a form of Consequentialism/Utilitarianism. Cousin 1's view allows for Agent-Centered Prerogatives. Most modern deontological/pluralistic ethics side with Cousin 1's *conclusion* but accept Cousin 2's *distinctions*.
      *   *Re-evaluating:* Cousin 2's Move 4 is the "killer argument" against supererogation (Why is the best not required?). Cousin 1's Move 3 is the standard defense (Over-demandingness). I will conclude that Cousin 1 is more right about the *nature of moral life* (we need supererogation), but Cousin 2 is more right about the *logical tension*.
      *   *Actually, looking at the prompt:* "Concluding with a judgment about who is more right overall and why." I need to be decisive.
      *   *My take:* Cousin 1 is more right. Why? Because Cousin 2's view leads to an implausible moral theory where self-sacrifice is mandatory. Cousin 1 preserves the distinction between the "good" and the "obligatory," which is essential for a humane morality. Cousin 2's Move 4 is a strong challenge, but not a refutation.

  6.  **Refining the "Missing Distinction":**
      *   The crucial missing piece is the distinction between **Objective Duty** (what is actually best) and **Subjective/Reasonable Duty** (what can be reasonably expected). Or, the distinction between **Justification** (it was right to do) and **Excuse** (it was okay not to).
      *   Also, the distinction between **Institutional/Professional Obligation** and **Moral Obligation**.

  7.  **Structuring the Response:**
      *   Introduction: Acknowledge the complexity and the quality of the cousins' debate.
      *   Point-by-Point Analysis (1-4).
      *   The Missing Distinction (Excuse vs. Permission / Optimality vs. Requirement).
