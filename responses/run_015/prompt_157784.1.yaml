answer: |-
  This is a classic historiography brawl, the kind that has fueled departmental feuds for a century. You and your friends effectively reenacted the shift from 19th-century positivism (Jake/Ranke) to mid-century social science (Carr) to the linguistic turn (Maya/White).

  Since you asked for a referee, I'll break this down round-by-round, rate the arguments, and then tackle that diary question, which is actually the most sophisticated part of your query.

  ### Round 1: Ranke vs. Carr (The Nature of Facts)

  **Jake's Claim:** Ranke was right; history is "how it actually was" (*wie es eigentlich gewesen*). Carr messed this up by making facts subjective to present concerns.
  **Jake's Objection:** If Carr is right, basic chronology (Monday vs. Tuesday strike) becomes subjective.

  *   **Rating Jake's Ranke Defense: 4/10.**
      Jake is defending a caricature. Ranke *did* coin the phrase, but modern scholarship knows Ranke wasn't a naive empiricist. He had deep theological and philosophical commitments about the state and God's hand in history. He believed sources spoke for themselves, but he chose sources that supported his view of the state. Jake is right that we *aim* for accuracy, but wrong that Ranke achieved a philosophy-free history.
  *   **Rating Jake's Chronology Objection: 9/10.**
      Jake actually lands a solid punch here, but he's punching a strawman of Carr. E.H. Carr (*What is History?*) never argued that empirical facts like dates are subjective. Carr argued that the *selection* and *significance* of facts are subjective. If a payroll record says the strike started Monday, Carr agrees it started Monday. Carr's point is that the historian chooses to write about the strike at all based on present concerns. Jake is right: radical constructivism cannot deny basic ontology. If the building burned down in 1900, it didn't burn down in 1905.
  *   **Rating Maya's Implicit Counter (Carr's Defense): 7/10.**
      Maya didn't fully defend Carr here, but her later points imply it. Carr would agree with Jake on the date but argue that *why we care* about the date is political.

  **Winner of Round 1:** **Jake.** On basic empirical reality (dates, existence of events), the empiricist wins. Maya/Carr risk solipsism if they deny the reality of the past.

  ### Round 2: Narrative Form vs. Empirical Correction

  **Maya's Claim:** Hayden White is right; narrative form (romance, tragedy, irony) is prior. It determines which documents you treat as relevant.
  **Jake's Pushback:** Empirical correction exists. If a payroll record is misdated, you fix it. That fix doesn't depend on your story.

  *   **Rating Maya's Narrative-Priority: 8/10.**
      Hayden White (*Metahistory*) is theoretically robust here. We do not access the past directly; we access it through language. To write a sentence about the past is to impose a grammatical structure, which implies a narrative structure. If I frame the French Revolution as a "Tragedy," I look for documents showing hubris and fall. If I frame it as a "Romance," I look for documents showing liberation. Maya is right that we don't just "find" stories; we write them.
  *   **Rating Jake's Correction Argument: 8/10.**
      This is Jake's strongest point. It is the "reality principle." If I frame the strike as a "Tragedy of Labor," but the payroll record proves the workers were paid double wages that week, my tragedy narrative is empirically falsified. The archive resists our stories. Jake is right that there is a "hard shell" of evidence that narratives cannot easily crack.

  **Winner of Round 2:** **Draw.** Jake wins on *constraint* (the archive stops you from lying), Maya wins on *selection* (the archive is too big, so you choose what fits your story).

  ### Round 3: Structures vs. Framing Infection

  **Jake's Middle Ground:** Relational structures (wage patterns over years) are structurally objective even if individual facts are selected.
  **Maya's Reply:** Even wage patterns are loaded. It can be a tragic story of exploitation or an ironic story of unintended reform. The framing infects the data.

  *   **Rating Jake's Structural Middle Ground: 5/10.**
      This is "Annales School" thinking (long-term structures), which is good, but Jake treats the structure as self-evident. A "wage pattern" isn't a raw fact; it's an aggregation. You have to decide what counts as a wage, whose wages count, and how to adjust for inflation. The "structure" is already an interpretation.
  *   **Rating Maya's Framing Infection: 9/10.**
      Maya nails it here. Data does not speak; historians speak *for* data. A rising wage curve can be "Progress" (Whig history), "Exploitation relative to profit" (Marxist history), or "Market correction" (Liberal history). The numbers might be the same, but the *historical fact* (what the numbers mean) changes entirely based on the paradigm.

  **Winner of Round 3:** **Maya.** Once you move from "when did the strike start?" to "what do wage patterns mean?", empiricism loses its grip and interpretation takes over.

  ---

  ### Overall Verdict: Who is More Right?

  **It's a Split Decision, but Maya has the stronger theoretical hand, while Jake has the stronger practical hand.**

  *   **Jake** is operating as a **Working Historian**. He needs to believe he can find the truth, or he can't do his job. He is right that the past has a reality independent of us (Ontological Realism). If he ignores this, history becomes fiction.
  *   **Maya** is operating as a **Historiographer**. She is analyzing *how history is written*. She is right that our access to that reality is always mediated by language, culture, and narrative (Epistemological Constructivism).

  **The Synthesis (The "Critical Realist" View):**
  The most accurate position is that the past is real (Jake), but our knowledge of it is always constructed (Maya).
  *   **Jake is right** that you can't say the Holocaust didn't happen. The evidence resists that.
  *   **Maya is right** that how we *emplot* the Holocaust (as a unique evil, a culmination of enlightenment rationality, a religious tragedy) determines which facts we highlight.

  If I have to pick a winner for your course: **Maya.** In a historiography class, the goal is usually to understand that history is an interpretation, not a mirror. Jake's view is 19th-century; Maya's is 20th/21st-century. However, tell Jake not to quit his day job, because if he fully accepts Maya's view, he might stop checking footnotes.

  ---

  ### The Unanswered Question: The Contradictory Diary

  You asked: *If a historian finds a diary that flatly contradicts the accepted narrative, does that discovery automatically change the history, or can the narrative just absorb the contradiction without breaking?*

  **The Short Answer:** The narrative almost always absorbs the contradiction first. History changes slowly, like a tectonic plate, not like a lightswitch.

  **The Long Answer (Historiographical Theory):**
  This touches on Thomas Kuhn's *The Structure of Scientific Revolutions*, applied to history.

  1.  **Narrative Resilience:** Established historical narratives are like immune systems. When a contradictory piece of evidence (an "anomaly") appears, the existing paradigm tries to explain it away without collapsing.
      *   *Example:* If the accepted narrative is "The General was a hero," and a diary appears saying "The General was a coward," historians won't immediately rewrite the books. They will ask: Is the diary a forgery? Was the General having a bad day? Was he being ironic? Is this one man's biased opinion against the weight of official records?
      *   The narrative absorbs the diary by **contextualizing it as an outlier.**

  2.  **The Tipping Point:** The narrative only breaks when the weight of anomalies becomes too heavy to carry. One diary rarely does it. It takes a *cluster* of contradictions (new archives open, new methodologies arise, social values shift) to make the old story unsustainable.
      *   *Example:* The "Lost Cause" narrative of the US Civil War didn't vanish because one person found a letter. It vanished because decades of economic data, slave narratives, and political records accumulated until the "States Rights" story could no longer hold the weight of the evidence.

  3.  **The Diary Itself is a Text:** Maya would remind you that the diary isn't "truth" either. It's another narrative. The diarist might be lying to themselves, performing for a future reader, or misunderstanding events. Finding a diary doesn't give you "the past"; it gives you "another version of the past."

  **Conclusion on the Diary:**
  The discovery does **not** automatically change history.
  *   **Phase 1:** The narrative ignores it (if possible).
  *   **Phase 2:** The narrative absorbs it (explains it as an exception/error).
  *   **Phase 3:** If enough contradictions pile up, a **Paradigm Shift** occurs, and a new narrative is built that incorporates the diary as a key piece of evidence.

  **Advice for the Bar:**
  Tell Jake that facts constrain the story, but they don't dictate it. Tell Maya that the past actually happened, even if we can't access it perfectly. And tell them both that if they find a contradictory diary, they should check for forgery before rewriting their dissertations. Buy the next round; you've earned it.
