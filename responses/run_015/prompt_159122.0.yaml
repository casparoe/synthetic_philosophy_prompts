answer: |-
  ### 1. The Asymmetric Burden
  **(a) Spoken Question:**
  You argue that the person wanting to remove a practice owes us an explanation, but why doesn't the person wanting to keep it owe us one too? Is "this already exists" a moral reason to keep something, or just a physical fact about the world?

  **(b) Likely Answer:**
  Ashgrove will likely argue that existence isn't the moral reason itself; rather, the *cost* of coordination and the *risk* of unintended loss create the asymmetry. The baseline isn't moral, it's practical: the practice is already paid for and people are coordinated around it, so the remover bears the burden of showing the gain outweighs the disruption.

  **(c) Follow-up:**
  But if it's just about practical costs, doesn't that mean if the coordination costs are low, we should tear it down immediately? So the rule isn't about respect for the past, it's just a transaction cost analysis.

  ### 2. Ignorance vs. Irreversibility
  **(a) Spoken Question:**
  If the real reason is that removal is irreversible, doesn't this just become a math problem about option value? And if something is easy to put back, does your rule say we should be reckless with it?

  **(b) Likely Answer:**
  She will likely clarify that irreversibility is key, but so is the loss of dispersed knowledge. It's not just physical reversibility; even if you rebuild the fence, you might lose the social trust or habit that maintained it.

  **(c) Follow-up:**
  But if I'm a consequentialist who values optionality, I get to the same place without needing any Burkean philosophy. So what work is "tradition" doing here, rather than just smart risk management?

  ### 3. The Self-Stultification Problem
  **(a) Spoken Question:**
  We often only learn what a machine part does by taking it out and seeing what breaks. If we can't remove the practice to test it, how do we ever learn what it was doing?

  **(b) Likely Answer:**
  She will likely suggest we don't need full removal; we can look at small-scale trials, historical analogues where it was removed elsewhere, or gradual attenuation rather than sudden ablation.

  **(c) Follow-up:**
  But isn't running a trial exactly the kind of social engineering Burkeans usually distrust? If you need an experiment to justify removal, haven't you just turned conservatism into a slower version of liberalism?

  ### 4. Functionalism vs. Power
  **(a) Spoken Question:**
  Your rule assumes the fence was built to keep something out, but what if it was built to keep people in? Do unjust institutions get the same protection as useful ones?

  **(b) Likely Answer:**
  She will likely argue that unjust institutions lack legitimacy, so the presumption is weaker, or that we need to understand their function before removing them to avoid chaos, even if the origin was bad.

  **(c) Follow-up:**
  If you say we must keep an unjust system until we understand its function, aren't you asking the victims to wait for the oppressor's logic to be decoded before they get freedom?

  ### 5. Fragile vs. Self-Fulfilling Equilibria
  **(a) Spoken Question:**
  Some institutions only work because everyone believes they work, and if you remove them the belief collapses. How do you tell the difference between a useful fence and a psychological trick before you touch it?

  **(b) Likely Answer:**
  She will likely point to resilience over time and whether the practice survives competition or voluntary adoption as signs of genuine function versus mere belief.

  **(c) Follow-up:**
  But slavery survived for centuries and survived competition. If longevity is the test, doesn't your rule protect any stable evil?

  ### 6. Tacit Knowledge
  **(a) Spoken Question:**
  You say the knowledge is tacit and nobody has it in their head. But if nobody can articulate it, how do we satisfy your requirement to understand it before removing it?

  **(b) Likely Answer:**
  She will likely say we look at the outcomes and the patterns of behavior, not just interviews. We infer the function from the stability of the system, not from a manual.

  **(c) Follow-up:**
  But observing outcomes is exactly what we do when we remove it. If we can't know it without removal, isn't your rule a prohibition on knowledge itself?

  ### 7. Self-Application
  **(a) Spoken Question:**
  Is this rule itself an inherited practice that owes us an account of what it's for? And who decides if we've understood it well enough to keep using it?

  **(b) Likely Answer:**
  She will likely argue it's a heuristic rather than a practice, or that it survives because it works—it's a tool for thinking, not a social institution subject to the same risks.

  **(c) Follow-up:**
  If it survives because it works, aren't you judging it by the consequences it produces? So you're a consequentialist judging tradition by results, not a traditionalist judging results by tradition.

  ### 8. The Error Tally and Democratic Objection
  **(a) Spoken Question:**
  Can you name one specific reform this rule would have blocked that turned out fine, and tell me why the dead get a vote on practices they never chose?

  **(b) Likely Answer:**
  She will likely struggle with the specific reform, perhaps citing the French Revolution as a negative example, and argue the dead vote via the stability and capital they bequeathed to us.

  **(c) Follow-up:**
  But if the practice was imposed on them by force, like segregation, why do their successors owe respect to that imposition? Isn't that just honoring a crime because it got old?

