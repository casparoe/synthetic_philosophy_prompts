  ### 2. Reconstruction of the implicit theory

  The implicit theory presupposes that religious identity is **administratively legible**. In the German model, belief is not merely internal conviction but a registrable status that persists by default. This requires a metaphysics where religion is a corporate entity capable of bearing rights and liabilities distinct from its members. The state acts as tax collector not because it endorses the theology, but because it recognizes the church as a parallel administrative sovereign worthy of logistical support. Neutrality is redefined here as **procedural equidistance**: the state does not choose *which* god, but it chooses *that* gods are collectible entities. This distinguishes neutrality as non-endorsement (we don't pick the dogma) from neutrality as non-interference (we actively collect the money).

