  Collectively, this patchwork implies that religious membership is a **hybrid property right**. It is voluntary enough to satisfy liberal conscience (you can exit in Germany, you aren't taxed in the US) but ascribed enough to serve state interests (buildings are preserved, bishops sit in Lords). The state assumes religion is too socially potent to be left entirely to the market of ideas, yet too dangerous to be fully empowered. Thus, the implicit theory is one of **managed pluralism**: the state constitutes religious categories to regulate them, treating religious freedom as a negotiated settlement between individual conscience and institutional stability. The citizen is not just a believer but a stakeholder in a religious infrastructure they may not personally use. The state acts as the guarantor of religious continuity, ensuring that even if belief fades, the institution remains legible and functional within the administrative state.

  ### 3. The strongest rival interpretation

  The strongest rival interpretation argues that there is no implicit theory, only **historical accretion**. This view holds that the German church tax is merely a relic of the Holy Roman Empire's corporate structure, preserved for fiscal convenience. The English establishment is the surviving artifact of royal supremacy, maintained due to constitutional inertia rather than philosophical commitment. The French heritage subsidy is a pragmatic solution to owning crumbling buildings after revolutionary confiscation, not a statement on cultural value. The American exemption is simply a reaction against European coercion, codified without a positive theory of religion.

  On this view, searching for coherence is a category error. These are sedimentary layers of conflict, not a designed architecture. The US reacts to England; France reacts to its monarchy; Germany reacts to fragmentation. There is no "Western theory" of religion, only distinct national settlements frozen in time.

  However, this argument smuggles in an implicit view of religion's social role: **functionalism**. By choosing to preserve these specific historical forms rather than abolishing them during modernization (e.g., France could have sold the cathedrals; Germany could have privatized tax collection), the state implicitly asserts that religion performs a necessary social function. The persistence of the anomaly *is* the theory. If religion were truly private, the state would have divested. The fact that historical compromises were retained indicates a consensus that religious institutions are **public utilities of meaning**. The "accident" is too consistent across divergent histories to be mere chance; it reveals a shared intuition that secular administration requires religious partners, even if their names change. The path dependence itself constitutes a theory of stability.

  ### 4. Philosophical underdetermination and tension

  The tension arises in the **voluntarity of membership**. The US model presupposes religion is voluntary: exemptions require positive application, and there is no state mechanism to track membership. The German model presupposes religion is **ascribed status**: you are in unless you legally exit. The English model treats Anglican identity as a **background condition** of public life, neither fully voluntary nor fully ascribed, but ambient.

  These are inconsistent theories of the self. In Germany, the self is legally bound to its confession until severed; in the US, the self is unbound until it chooses affiliation. This reveals that "state neutrality" is doing contradictory work. In Germany, neutrality means treating all recognized churches equally as tax collectors. In the US, neutrality means the state refuses to recognize churches as legal categories for funding. In France, neutrality means erasing recognition except when the building is old enough to become "culture."

  Can pluralist theory resolve this? A sphere sovereignty approach might argue religion occupies different ontological spheres in different contexts (private belief vs. public heritage). However, this fails because the state is the one drawing the spheres. The tension reveals that **neutrality is impossible**. The state must define what counts as religion to tax it, exempt it, or preserve its buildings. By defining it differently across borders, the comparative arrangement admits that "religion" is not a natural kind but a **legal construct**. The incoherence is not a bug but a feature of a system that refuses to admit it constitutes the very categories it claims to neutrally observe. The contradiction lies in claiming individual freedom while maintaining corporate ascription.

  ### 5. Bottom line

  The comparative practice is conceptually incoherent under the framework of **Liberal Neutrality**. It cannot claim to be neutral while simultaneously collecting taxes for churches, housing bishops in legislatures, and subsidizing religious infrastructure as heritage. These are active constitutions of religious power, not passive protections.

  However, it hangs together under a framework of **Sovereign Management of Meaning**. The state treats religion as a strategic resource: sometimes taxed (Germany), sometimes honored (England), sometimes museumified (France), sometimes exempted (US). The specific commitment that must be abandoned to restore consistency is the myth that the state can be neutral regarding religion's definition. To be coherent, the system must admit that **administrative legibility precedes religious freedom**. The state decides what counts as a church before it decides how to treat it. Once this is acknowledged, the patchwork is not contradictory but modular: different tools for managing the same potent social force.
