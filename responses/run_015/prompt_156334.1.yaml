answer: |-
  Your second hypothesis is the stronger diagnosis, though your first hypothesis accurately identifies the methodological battlefield where the war is fought. The stalemate over presentism is not primarily a dispute about *how* to explain actions (category fidelity), but a deeper conflict about the *telos* of historical inquiry (the purpose of historiography). The disagreement over category fidelity is a symptom of the disagreement over purpose.

  Here is the diagnosis based on what each camp actually commits to, followed by an assessment of whether conceptual distinctions can resolve the impasse.

  ### 1. The Diagnosis: Purpose Over Method

  If the dispute were merely about **category fidelity** (your first hypothesis), it should be resolvable through methodological refinement. We could theoretically agree on when to use emic (insider) categories and when to use etic (outsider) categories. However, the debate persists because the two sides hold incompatible commitments regarding the **moral ontology of the past**.

  **The Anti-Presentist Commitment: The Autonomy of the Past**
  Critics of presentism commit to the idea that the past possesses a kind of *sovereignty*. Their core intuition is that historical actors are owed a duty of *alterity*—they must be allowed to be different from us without being corrected by us.
  *   **What they commit to:** They believe that meaning is context-bound. To explain an action using a category the agent could not recognize (e.g., "heteronormativity" in the 17th century) is not to explain the action better, but to replace the action with a different one. For this camp, "truth" in history corresponds to the accurate reconstruction of past consciousness.
  *   **The stakes:** If we judge the past by present standards, we commit a form of epistemic violence. We erase the specific texture of historical experience and turn the past into a mirror for the present. The purpose of history is *memorialization* and *understanding* in the hermeneutic sense.

  **The Pro-Presentist (or Defenders') Commitment: The Continuity of Moral Community**
  Defenders do not merely commit to the inevitability of present bias; they commit to the *ethical necessity* of present engagement. Their core intuition is that the past is not a foreign country but the foundation of the present house.
  *   **What they commit to:** They believe that historical silence on moral issues is itself a political act. If a historian describes a colonial massacre using only the administrator's vocabulary ("pacification"), they argue the historian is complicit in the obfuscation. For this camp, "truth" in history includes structural realities that agents may have been blind to (e.g., "systemic racism" or "patriarchy").
  *   **The stakes:** If we refuse to judge the past by present standards, we abdicate our responsibility to the victims of history whose suffering is rendered unintelligible by the oppressor's categories. The purpose of history is *justice* and *actionable knowledge*.

  **Why Hypothesis 1 is Secondary:**
  The argument over category fidelity is simply how these teleological commitments manifest methodologically.
  *   The **Anti-Presentist** demands category fidelity because they prioritize the *agent's truth*.
  *   The **Defender** rejects strict category fidelity because they prioritize the *structural truth* (which often requires modern sociology) and the *moral truth* (which requires modern ethics).

  When a defender says, "We must call slavery 'slavery' even if the owners called it 'servitude'," they are not making a category error; they are asserting that the *purpose* of history is to name power dynamics accurately, even if the agents lacked the vocabulary to do so. The anti-presentist hears this as anachronism; the defender hears it as moral clarity. They are not disagreeing on the definition of anachronism; they are disagreeing on whether anachronism is always a vice.

  ### 2. Assessment of Conceptual Distinctions

  Can distinctions like *explanatory vs. evaluative presentism* or *indexical vs. normative* break the deadlock?

  **Explanatory vs. Evaluative Presentism**
  *   **The Proposal:** We allow presentist *explanations* (using modern social science to analyze causes) but forbid presentist *evaluations* (moral judgment of character).
  *   **Why it fails:** This distinction leaks. To many defenders, the *explanation* is inherently evaluative. To explain the Holocaust using only 1930s German categories is to fail to explain it *as a Holocaust*. The modern concept carries the moral weight necessary to make the explanation intelligible to us. Conversely, anti-presentists argue that modern explanatory categories (like "genocide" or "class warfare") smuggle in normative judgments that distort the agent's motivation.
  *   **Verdict:** This distinction works in seminar rooms but collapses in publication. It cannot resolve the impasse because the "evaluative" element is often embedded in the "explanatory" vocabulary.

  **Indexical vs. Normative Deployments**
  *   **The Proposal:** Acknowledge that all history is *indexical* (written from a specific time/place) without making it *normative* (claiming present standards are superior).
  *   **Why it fails:** Defenders argue that indexicality *entails* normativity. We cannot step outside our moral horizon to view the past "neutrally." To claim neutrality is to implicitly endorse the status quo of the present. Anti-presentists argue that while indexicality is unavoidable, we have a professional duty to minimize normative imposition as a regulatory ideal.
  *   **Verdict:** This clarifies the *conditions* of the debate but does not solve it. It confirms that the dispute is about the *authority* of the present, not just its presence.

  ### 3. The Bedrock Intuitions

  You asked for an honest assessment of whether this reflects bedrock intuitions that neither side can argue the other out of. **The answer is yes.**

  The impasse reflects two competing axioms about time and ethics that are mutually exclusive but internally coherent:

  1.  **The Axiom of Alterity:** The past is *other*. To respect the past is to preserve its difference. (Anti-Presentist)
  2.  **The Axiom of Continuity:** The past is *us*. To respect the past is to acknowledge its consequences for our current moral standing. (Defender)

  These are not empirical claims that can be tested; they are pre-theoretical commitments about why history matters.
  *   If you believe history is a **discipline of memory**, the anti-presentist view wins. Memory requires fidelity to the experience of the remembered.
  *   If you believe history is a **tribunal of conscience**, the defender's view wins. Justice requires judging actions against the best available moral standards, regardless of when they occurred.

  ### Conclusion

  Your diagnosis should pivot to **Hypothesis 2**. The stalemate is not about whether category fidelity is methodologically sound; it is about whether the primary obligation of the historian is to the **dead** (to represent them accurately) or to the **living** (to equip them with truth for ethical navigation).

  Conceptual distinctions like "explanatory vs. evaluative" are useful heuristics for individual historians to check their own blind spots, but they cannot resolve the disciplinary schism. The debate persists because both sides are protecting a vital good: the anti-presentists protect the **integrity of the past**, while the defenders protect the **relevance of history**. Until the profession agrees on whether history is primarily a memorial or a tool, the dispute over presentism will remain a proxy war for the soul of the discipline.
