answer: |-
  1. **The Competence-Opacity Trade-off**
     **Question:** You argue that a system is only deployable if a human choice is a *but-for* cause of its harms. But the primary advantage of learned components is their ability to generalize beyond their training data—behavior that is, by definition, not enumerable in advance. If traceability requires predictability, aren't you demanding that the system cease to be a learned system?
     **Anticipated Answer:** She will likely distinguish between the *output* and the *decision to deploy*. She'll argue the constraint governs the ex-ante architectural choice, not every ex-post inference.
     **Follow-up:** "If the system's competence derives from the very features that make its specific outputs untraceable, then the 'decision to deploy' is effectively a gamble on black-box behavior. At what point does signing off on a system whose specific failure modes you *cannot* enumerate become morally indistinguishable from recklessness, regardless of when you signed the paper?"

  2. **Post-Deployment Drift**
     **Question:** Consider a system that continues to learn from user data after deployment. The designer's causal grip decays with every update they didn't explicitly authorize. If attributability is a property of the system at a time, does your regime impose a duty to freeze, roll back, or switch off the system once the model drifts beyond the original certification envelope?
     **Anticipated Answer:** She will likely assign a duty to the deployer to monitor performance and intervene if metrics degrade.
     **Follow-up:** "In high-frequency environments, drift can happen in milliseconds, far outpacing human monitoring capacity. If the duty to monitor requires a speed of comprehension the human deployer physically cannot match, have you assigned a duty that is logically impossible to discharge? And if so, does the system become immoral to run the moment it goes online?"

  3. **Meaningful Control vs. Rubber Stamping**
     **Question:** Your constraint requires a human decision to be a *but-for* cause of harm. But we know humans suffer from automation bias. If an operator must confirm a system's proposal within 200 milliseconds, or holds a veto without understanding the model's weights, they satisfy the letter of your constraint but lack actual control. Does your view have the resources to distinguish a responsible agent from a high-speed rubber stamp?
     **Anticipated Answer:** She will likely argue that control depends on the "whole sociotechnical setup," including training, interface design, and culture.
     **Follow-up:** "Sociotechnical context is qualitative; moral permissibility needs a line. What is the observable threshold where the setup fails? Is it an override rate below a certain percentage? A minimum time-to-decision? If you cannot name a metric that falsifies 'meaningful control,' how do we prevent your constraint from legitimizing tokenistic human-in-the-loop theater?"

  4. **Compensation Without Answerability**
     **Question:** We have mechanisms like enterprise liability and no-fault compensation funds that ensure victims are paid without establishing individual moral blame. If a system reliably compensates all harms but leaves no specific human answerable in the sense you require, has a moral wrong actually occurred? Is your regime doing moral work, or merely allocative work?
     **Anticipated Answer:** She will likely insist that answerability is intrinsic to moral agency and cannot be substituted by financial restitution.
     **Follow-up:** "If the victim is made whole and the incentive structure prevents future harm, but no one is 'answerable,' what practical difference does your gap make? Are we protecting the victim's interest, or are we protecting a retributive intuition about how blame *ought* to land, even if it costs us safer technology?"

  5. **Overdetermination and Many Hands**
     **Question:** In complex pipelines, harm is often overdetermined: a base model, a fine-tuner, a deployer, and a feedback loop all contribute. In such cases, there may be no *single* human decision that is a *but-for* cause of the harm, even if several parties were careless. Does your constraint collapse into a demand for organizational redesign simply to ensure a single choke-point exists for blame?
     **Anticipated Answer:** She will likely argue that organizations must be structured to ensure clear lines of authority and causality.
     **Follow-up:** "If the moral requirement dictates the org chart, then the 'responsibility gap' isn't a feature of the AI; it's a feature of distributed labor. Are you arguing that AI is uniquely problematic, or simply that modern corporate structures are morally indefensible whenever they distribute causality too thinly to pin a *but-for* cause on one person?"

  6. **The Novelty of the Gap**
     **Question:** We already accept responsibility gaps in corporate agency, idiosyncratic drug reactions, and cases of automatism. We don't ban corporations or pharmaceuticals because we can't always trace a specific harm to a specific malicious choice. Given we live with these gaps elsewhere, what is structurally special about autonomous systems that warrants a prohibition rather than a mitigation?
     **Anticipated Answer:** She will likely point to the scale, speed, and opacity of AI as a difference in kind.
     **Follow-up:** "If it's a difference of degree, why does the moral principle change? If I can't trace a harm from a pharmaceutical drug to a specific chemist's choice, we regulate and compensate. If I can't trace a harm from a neural net to a specific engineer's choice, you say we prohibit. Why does the inability to trace blame mandate a ban in one case but only regulation in the other?"

  7. **Success Conditions for Certification**
     **Question:** You propose a certification regime to verify the attributability constraint. What evidence would convince *you* that the gap in a given system had actually been closed? Is there a specific audit, simulation, or formal proof that constitutes success?
     **Anticipated Answer:** She will likely defer to emerging standards in AI safety auditing and formal verification.
     **Follow-up:** "Those standards are currently non-existent or proprietary. If the certifiers rely on the developers' own documentation to verify traceability, we have a conflict of interest. Who certifies the certifiers, and what is the falsification condition? What result in an audit would force you to say, 'This system cannot be morally deployed'?"

  8. **Freezing and Obsolescence**
     **Question:** You suggest freezing learned components that cannot be traced. But a frozen model degrades relative to a changing world. A medical diagnostic tool frozen at deployment will become less accurate over time as disease profiles shift. Does your constraint inadvertently mandate that we deploy systems we *know* will become less safe than their updating competitors?
     **Anticipated Answer:** She will likely argue that safety is prioritized over performance, and a less accurate but accountable system is preferable.
     **Follow-up:** "If the 'accountable' system kills more patients through obsolescence than the 'unaccountable' system kills through error, does your constraint maximize harm? At what ratio of decreased performance to increased traceability does the deployment become morally impermissible?"

  9. **The "Certification" Deflection (The Trap)**
     **Question:** You've frequently noted that implementation details—thresholds, audit protocols, monitoring speeds—are 'certification questions' rather than moral ones. But if the moral permissibility of the system *depends* on the existence of a certification regime, and that regime is technically or bureaucratically infeasible, doesn't the moral theory fail?
     **Anticipated Answer:** She will likely attempt to separate the ideal theory from non-ideal implementation again.
     **Follow-up:** "I need to press this: If there is no feasible way to certify the constraint in a deep learning system, do you admit the system is permanently morally prohibited? Or do you adjust the moral principle to fit the technical reality? Because if the answer is 'permanently prohibited,' you aren't proposing a regulation; you're proposing a ban on the technology. Which is it?"

  10. **Regulatory Arbitrage**
      **Question:** If your regime is adopted in one jurisdiction but not another, developers may simply relocate or label systems differently to avoid the 'autonomous' classification. Does your moral framework account for the risk that strict attributability rules simply drive the technology into jurisdictions with no moral constraints, increasing global risk?
      **Anticipated Answer:** She will likely argue that moral duties are agent-relative and we must act rightly regardless of others' actions.
      **Follow-up:** "If acting rightly here leads to worse outcomes globally because the tech migrates to less scrupulous actors, does your deontological constraint hold? Or do we have a duty to engage with the technology imperfectly to maintain some leverage over its development, rather than ceding the field entirely?"
