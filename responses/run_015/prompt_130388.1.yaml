      *   *Addressing the "Unfalsifiability":* If the view says "Centered info never updates uncentered credences," it is falsified by any case where it clearly does. If it says "Only in symmetric fission cases," it's ad-hoc.

      *   *Engagement:* Thirders will say "You're just a Halfer." Halfers will say "You're undermining the Principal Principle which we need."

