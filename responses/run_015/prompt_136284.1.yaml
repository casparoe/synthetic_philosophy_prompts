          *   *Nuance:* Hofstadter argues against "symbolic AI" (GOFAI). He thinks rules are emergent phenomena from sub-symbolic interactions (codelets). So, "no literal rules *at the bottom*" is accurate to his view, but saying there are *no rules* at all is misleading. There are micro-rules (codelets), but macro-rules emerge.

