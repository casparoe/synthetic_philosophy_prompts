  2.  **Deconstruct the Three Theories (Epistemological Analysis):**
      *   *Friend 1 (Global Verdict):* Assumes a unitary, stable self with access to deep preferences. *Failure:* Prone to narrative bias, recency effects masked as profundity, and mood-congruent memory (as seen in the retreat job example).
      *   *Friend 2 (EMA Data):* Assumes happiness is an aggregate of momentary affective states. *Failure:* Misses structural dissatisfaction. You can have high momentary mood but low life satisfaction (the "happy slave" or "comfortable stagnation" problem). It measures *affect*, not *alignment*.
      *   *Friend 3 (Constructivist/Asymmetric Access):* Assumes preferences are constructed during the query. *Strength:* Highlights the impossibility of comparing "is" vs. "ought/would be." *Weakness:* Can lead to paralysis if taken to mean "nothing is real."
