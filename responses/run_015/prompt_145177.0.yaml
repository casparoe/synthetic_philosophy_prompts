prompt: |-
  Posting here because I asked this on a rationalist discord and got forty replies that were all just "break up" or "don't break up" with no reasoning attached, which is exactly the part I don't need help with.

  So, situation: I've been with my girlfriend for three years, it's good on paper, no real blowups, and for the last fourteen months I've been doing a twice-daily EMA thing on my phone — mood 1-10, how connected do you feel to her 1-10, prompted at random times — which I started for an unrelated sleep-and-lunch-timing project and just never turned off. The numbers: mood averages 7.4, connection 6.9, no trend, and weirdly no difference between weeks she's home and weeks she's travelling. But when I sit down and ask myself directly whether I'm happy and whether this is the person, the answer that comes back is consistently no, it's fine, it's just not it — and it arrives with this very high confidence that the spreadsheet has none of. Relevant datapoint about me: last year I did a ten-day meditation retreat, came home completely certain I should quit my job, and two months later the certainty had just evaporated and I never did it. Three friends, three incompatible stories. One says the global verdict is the real signal and my daily ratings are just noise from whatever happened in the last twenty minutes, plus the old line about how if you have to ask you already know. Two says the global verdict is manufactured on the spot out of whatever is currently salient, which right now is an argument we had last Tuesday and a vivid memory of how I felt about my ex, and that the EMA series is the actual measurement, so trust the data and stop asking the big question. Three is a philosophy grad student who says neither one is a measurement at all, because for something like whether I'm happy in this relationship there is no fact of the matter sitting behind the report that the report could be accurate or inaccurate about, so I'm not choosing between a good instrument and a bad one, I'm choosing what kind of thing I want to be — and then he adds something he calls asymmetric access: any judgment of the form would I be happier if I left is a comparison between two items obtained in completely different ways, since the actual relationship I have real-time access to and the alternative I have to generate by imagination, and he says that's like comparing a thermometer reading to a daydream and calling the difference a temperature.

  What I want is not relationship advice in the generic sense, I want the epistemology cashed out and then applied. Which of the three is closest to right about what introspection is doing here, and what does each of them predict that the others don't? Is asymmetric access a genuine point or just a fancy way of saying you can't predict the future? If these reports can't be calibrated against anything independent — no ground truth to check my happiness judgments against, the way I could check a thermometer — does that make trust your gut and don't trust your gut equally unsupported, or is there still a non-arbitrary way to choose between procedures? Does the felt certainty of the global verdict count as evidence at all, or is it just a property of the report, like font size? And concretely, given fourteen months of ratings pulling one way and one loud global verdict pulling the other, what should I do over the next month: more introspection, less, a different kind of introspection, or go get real data some other way?

  Give me the actual advice in prose first, then a JSON object with this schema: {"diagnosis": one or two sentences on what the disagreement between my three friends is really about, "reports": [{"report": which self-report, "signal_source": what it is actually tracking rather than what it claims to track, "main_failure_mode": the specific way it misleads in this case, "weight": integer 0-10 for how much I should trust it here, "better_probe": what to ask or do instead}], "asymmetric_access": {"verdict": one of "sound", "partly sound", "unsound", "what_it_establishes": ..., "what_it_does_not_establish": ...}, "confidence_and_calibration": whether the retreat episode shows my global verdicts are badly calibrated or merely revisable, and what calibration even means here if there is no ground truth, "procedure": three to five concrete things to do in the next month, "questions_to_retire": [strings I should stop asking myself], "confidence": integer 0-100, "what_would_change_your_mind": string}
