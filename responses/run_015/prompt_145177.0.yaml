          1.  *Global Verdict Realist:* The "big question" accesses deep truth; daily ratings are noise. "If you have to ask, you know."
          2.  *Data Empiricist:* Daily ratings are objective measurement; global verdict is constructed from salient recent memories/biases.
          3.  *Constructivist/Philosopher:* Neither measures a pre-existing fact. Happiness isn't a hidden variable. It's about identity construction. Introduces "Asymmetric Access" (real-time experience vs. imagined counterfactual).
