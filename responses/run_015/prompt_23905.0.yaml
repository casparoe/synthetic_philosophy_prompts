prompt: |-
  I'm a clinical ethics consultant, and a case that keeps coming to me is a patient facing one of the big, irreversible decisions in their life — whether to have a first child, whether to have a major operation, whether to take a treatment that will change how they feel about themselves — where the usual advice of "imagine how you'll feel afterward and weigh it" breaks down, because they can't honestly picture an experience they've never had. I've been turning this over on my own, and I'd like a decision procedure I can actually run in a one-hour consultation: the questions to ask, in order, what counts as a good enough answer to each, how the procedure handles the fact that the patient can't attach a reliable value to the outcome in advance, where it stops, and where it has to hand the decision back to the patient as a matter of their own values rather than something I can settle for them. Please ground it in whatever the philosophy of decision-making actually says about experiences that can only be known from the inside, but write it so someone without that background can follow it, and be honest about which steps are just judgment dressed up as procedure. Then run it on two cases: a woman in her thirties deciding whether to have her first child, and a patient deciding whether to have an operation that will end years of chronic pain but leave them in a wheelchair.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case applications:

  1.  **Deconstruct the Request:**
      *   **User:** Clinical ethics consultant.
      *   **Problem:** Patients facing irreversible, transformative choices (L.A. Paul's "Transformative Experience" problem). Standard utility maximization ("imagine the outcome and weigh it") fails because the outcome is epistemically inaccessible.
      *   **Goal:** A practical, one-hour decision procedure (questions, order, success criteria, limits).
      *   **Requirements:**
          *   Grounded in philosophy of decision-making (specifically transformative experience).
          *   Accessible language (no jargon without explanation).
          *   Honest about limitations (where judgment masks as procedure).
          *   Apply to two specific cases: (1) Woman in 30s considering first child, (2) Patient considering pain-relief surgery resulting in wheelchair use.

  2.  **Theoretical Foundation (Mental Sandbox):**
      *   *Key Concept:* L.A. Paul's *Transformative Experience*. The core problem is epistemic (I can't know what it's like) and personal (it changes who I am).
      *   *Standard Decision Theory:* Expected Utility Theory (EUT). Requires assigning values to outcomes. Fails here.
      *   *Alternatives:*
          *   *Revealed Preference:* Look at past choices. (Weak for first-time events).
          *   *Proxy/Delegation:* Let someone else decide. (Ethically problematic in clinical settings).
          *   *Value Alignment:* Focus on core values rather than specific outcomes.
          *   *Satisficing:* Look for "good enough" rather than "optimal."
          *   *Agency/Authorship:* Focus on the act of choosing itself as constitutive of identity.
      *   *Clinical Ethics Frameworks:* Four Boxes (Medical Indications, Patient Preferences, Quality of Life, Contextual Features). Need to adapt this for *uncertainty*.
      *   *Synthesis:* I need a procedure that shifts the focus from *predicting the future self* to *aligning the choice with the current self's deepest commitments*, while acknowledging the leap of faith.

  3.  **Drafting the Procedure (The "Transformative Choice Protocol"):**
      *   *Time:* 60 minutes.
      *   *Structure:* 4 Phases.
      *   *Phase 1: Mapping the Epistemic Gap.* Acknowledge they can't know. Validate the fear.
      *   *Phase 2: Excavating Core Values.* If I can't judge the *feeling*, what do I judge? The *meaning*.
      *   *Phase 3: Testing for Regret and Resilience.* Not "Will I be happy?" but "Can I live with this if it goes wrong?"
      *   *Phase 4: The Leap.* Acknowledging the decision is an act of creation, not discovery.
      *   *Honesty Check:* I need to explicitly state where the consultant is guiding vs. where the patient must own the ambiguity.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Step 1 (The Acknowledgement):* Don't try to fix the unknowability. Name it.
      *   *Step 2 (Values vs. Outcomes):* Distinguish between "What will this feel like?" (Impossible) and "What kind of person do I want to be?" (Accessible).
      *   *Step 3 (The Worst-Case Resilience):* Shift from utility to resilience.
      *   *Step 4 (The Narrative):* How does this fit their life story?
      *   *Stop Rule:* When does it end? When the patient can articulate a reason that holds even if the outcome is different than expected.
      *   *Hand-off:* The consultant cannot validate the *truth* of the future, only the *integrity* of the choice.

  5.  **Developing the Case Studies:**
      *   *Case 1 (Parenthood):* Classic transformative experience. High social pressure. Epistemic black box.
          *   *Application:* Focus on values of care, legacy, sacrifice vs. autonomy.
          *   *Pitfall:* Don't let "society says it's good" replace personal values.
      *   *Case 2 (Surgery/Wheelchair):* Trade-off (Pain vs. Mobility). Less about "new self" more about "different self."
          *   *Application:* Focus on the definition of "quality of life." Is pain the enemy or is limitation the enemy?
          *   *Pitfall:* Assuming mobility = quality of life.

  6.  **Addressing the "Judgment dressed as Procedure" Constraint:**
      *   I need a specific section or interjections that admit: "This step relies on the consultant's intuition," or "There is no right answer here."
      *   *Crucial Point:* The procedure doesn't *make* the decision; it *clears the debris* so the decision can be made.

  7.  **Writing - Tone and Style:**
      *   Professional, empathetic, rigorous.
      *   Avoid academic jargon (e.g., instead of "epistemic boundary," use "the unknowable part").
      *   Structure clearly with headings.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this just standard values clarification?
      *   *Fix:* No, standard values clarification assumes you know how the values play out. This must explicitly address the *failure* of imagination. Emphasize L.A. Paul's insight without naming her constantly.
      *   *Critique:* Is it too long for an hour?
      *   *Fix:* Keep the questions tight. Limit the phases.
      *   *Critique:* Did I answer the "where it stops" part?
      *   *Fix:* Ensure the "Hand-off" section is distinct.

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Decision procedure? Yes.
      *   One-hour feasible? Yes.
      *   Questions in order? Yes.
      *   Good enough answers defined? Yes.
      *   Handles unreliable value attachment? Yes.
      *   Where it stops/hands back? Yes.
      *   Grounded in philosophy? Yes (Paul, Nozick, Existentialism).
      *   Accessible language? Yes.
      *   Honest about judgment? Yes.
      *   Two cases run? Yes.

