answer: |-
  Here are ten interview questions designed for a logic-and-computation audience. They treat the semantic theory as a formal system, focusing on edge cases, error propagation, and logical consistency, with follow-ups targeting the standard Strawsonian reply.

  ### 1. Negation and Operator Scope
  "In a Russellian system, negation is a truth-functional operator that can take wide or narrow scope to handle 'The King of France is not bald.' In your presuppositional system, if the existence condition fails, the sentence lacks a truth value. Does your negation operator act as a 'presupposition hole' that lets the failure pass through, or does it block it? Specifically, how do you formally distinguish denying the property *bald* from denying the existence of the *King* without resorting to scope ambiguity?"

  *   **Follow-up:** "If you answer that presupposition failure makes the sentence infelicitous regardless of negation, how do you account for the clear intuitiveness of 'The King of France does not exist'? Do you have to treat that as a different logical operator entirely to avoid a contradiction?"

  ### 2. Embedded Contexts and Projection
  "Consider a conditional like 'If there is a King of France, he is bald,' versus 'If the King of France is bald, he wears a crown.' In the second case, the existence of the King seems to be assumed in the antecedent. How does your framework handle presupposition projection in embedded contexts like conditionals or belief reports? Does the presupposition of the consequent get filtered by the antecedent, or does it project to the global context?"

  *   **Follow-up:** "If you claim the presupposition is 'filtered' or locally satisfied, does this require a dynamic update mechanism where the context is temporarily modified? If so, how do you handle rollback if the antecedent turns out to be false?"

  ### 3. Identity Statements with Empty Terms
  "I want to stress-test your handling of identity. If I say 'The Morning Star is the Evening Star,' and both refer to Venus, it's true. But what is the truth value if one description fails to refer, or if both fail? Does the law of identity ($a=a$) hold for empty definite descriptions, or does the presupposition failure render the identity statement truth-valueless? I'm concerned about transitivity: if $a=b$ is a gap and $b=c$ is true, what is $a=c$?"

  *   **Follow-up:** "If you maintain that identity statements with empty terms are truth-valueless, does this break substitutivity in your logic? In a computational analogy, if two null pointers are compared, is the result null or false, and does that distinction break equivalence classes?"

  ### 4. Fiction and Free Logic
  "Regarding fictional entities: if I say 'Sherlock Holmes lives on Baker Street,' a Russellian analysis makes this false because Holmes doesn't exist. You might say it's truth-valueless or true relative to a fiction. Does your presupposition approach require a full free-logic framework to handle these unrealized referents, or can you keep classical quantification and treat the names as having a different semantic type? I want to know if you are ontologically committing to non-existent objects."

  *   **Follow-up:** "If you argue that we don't need free logic because the presupposition simply fails outside the fiction, how do you explain the validity of inferences *within* the fiction? Does the logic switch modes depending on whether we are inside or outside the fictional context?"

  ### 5. Compositionality and Partial Functions
  "From an implementation standpoint, I view your definite descriptions as partial functions that return an error if the uniqueness or existence precondition isn't met. How does this error propagate compositionally? If a definite description is an argument to a predicate that is otherwise well-defined, does the whole formula evaluate to 'error' (or gap), or do you have a mechanism to catch the exception locally?"

  *   **Follow-up:** "If you say the error propagates and creates a truth-value gap for the whole sentence, how do you handle logical connectives like disjunction? In many programming languages, `False OR Error` might short-circuit to `False`. Does your logic allow short-circuiting, or is the gap infectious?"

  ### 6. The Logic of the Gap (Trivalent vs. Supervaluation)
  "When a presupposition fails and you assign no classical truth value, are you working in a three-valued logic (True, False, Gap), or are you using supervaluationism where a sentence is true if it's true across all ways of making the gaps precise? This matters for tautologies. In a three-valued system, $P \lor \neg P$ might not be true if $P$ is a gap. Do you sacrifice classical tautologies to preserve your intuition about oddity?"

  *   **Follow-up:** "If you concede that classical tautologies fail when presuppositions fail, does this make your logic non-classical in a way that complicates proof theory? How do you define validity if premises can be gaps rather than strictly true?"

  ### 7. Negative Existentials and Metalinguistic Negation
  "The hardest edge case for the presupposition view is the negative existential: 'The King of France does not exist.' If using the term 'The King of France' presupposes existence, this sentence seems to contradict itself. Do you handle this by positing a special metalinguistic negation that targets the presupposition rather than the assertion, or do you treat 'exists' as a special predicate that bypasses the normal semantic rules?"

  *   **Follow-up:** "If you argue for a metalinguistic negation, does this fragment your logic into two types of negation? If so, how does a speaker know which negation is active in a given utterance without explicit markers?"

  ### 8. Quantifier Scope and Superlatives
  "Consider superlatives like 'The tallest building in the city.' If two buildings are tied for tallest, uniqueness fails. In a Russellian view, the sentence is simply false. In your view, is it a gap? Furthermore, how does this interact with quantifiers like 'Every'? If I say 'Every student read the book,' and there is no unique book, does the whole universal claim fail, or does the presupposition project over the quantifier?"

  *   **Follow-up:** "If you claim the presupposition projects over the quantifier (i.e., there must be one unique book for all students), how do you handle cases where different students read different books? Does your system force a specific reading that might not match natural language usage?"

  ### 9. Context Update and Accommodation
  "You often mention that listeners 'accommodate' a presupposition if it's not already in the common ground. In computational terms, this looks like a state update before the sentence is processed. Is this accommodation a deterministic algorithm based on consistency, or is it a heuristic? If it's heuristic, how do you model cases where accommodation is blocked because it contradicts known facts?"

  *   **Follow-up:** "If you say accommodation is blocked by contradiction, does this mean the sentence is processed as false, or is it rejected as infelicitous? I'm trying to understand if the 'crash' happens during the state update phase or the evaluation phase."

  ### 10. Tractability and Complexity
  "Finally, a question on complexity. Checking truth conditions in a Russellian model involves checking existence and uniqueness. In your model, we must check these as preconditions before evaluating the predicate. Does this two-stage evaluation (check preconditions, then evaluate) increase the computational complexity of semantic parsing? Are there cases where determining the presupposition status is harder than determining the truth value?"

  *   **Follow-up:** "If you argue the complexity is comparable, does that imply that presupposition checks are effectively just hidden truth-conditional checks? If so, what is the formal advantage of separating them into a distinct logical category rather than just conjoining them to the assertion?"
