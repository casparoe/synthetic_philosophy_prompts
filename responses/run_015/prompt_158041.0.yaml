answer: |-
  Most taxonomies treat stances as mutually exclusive ontological territories, forcing a hard boundary where there's only a shift in descriptive granularity. They also tend to conflate the *utility* of a pattern with its *existence*, missing the point that high-compression predictive success *constitutes* reality for patterns.

  ***

  Look, the standard reading of "Real Patterns" treats it like a gentle instrumentalism—like beliefs are just useful fictions we tell ourselves to cope with the physics. That's wrong. Dennett is saying patterns are *objectively real* if they support counterfactuals better than the noise, but people keep trying to ground that reality in something deeper than the pattern itself. If we want a theory that keeps the Physical, Design, and Intentional stances distinct without collapsing them into reductionism or dualism, we need specific desiderata. Here is what an adequate theory needs to handle, built from the problems up.

  ### Desiderata for a Theory of Real Patterns

  **1. The Compression Threshold (Reality vs. Projection)**
  *   **The Requirement:** The theory must define a threshold where a regularity stops being a human projection and starts being a mind-independent pattern based on data compression efficiency.
  *   **The Concrete Case:** Consider **species boundaries** in a ring species complex. Physically, it's just gene flow across a geography. Intentionally, we label them "Species A" and "Species B." A projected pattern draws the line arbitrarily; a real pattern draws it where the predictive power regarding reproductive isolation maximizes. If the theory can't explain why "Species" is real enough for biology but "Constellations" isn't real enough for astronomy, it fails.
  *   **Status:** **Non-negotiable.** Without this, "real pattern" is just a synonym for "thing I notice."

  **2. Stance Decoupling (Design vs. Intentional)**
  *   **The Requirement:** The theory must allow intentional attributes (beliefs, desires) to exist without requiring a prior designer who intended them.
  *   **The Concrete Case:** **Evolutionary AI.** Imagine a neural net trained via genetic algorithms to navigate a maze. It wasn't *designed* (Design Stance) to have a "belief" about the exit; it was selected for performance. Yet, predicting its behavior requires attributing states like "it thinks the wall is solid." If the theory requires a designer for intentionality, it kills the possibility of naturalized intentionality. The Intentional Stance must float free of the Design Stance.
  *   **Status:** **Non-negotiable.** This is the only way to naturalize mind without magic.

  **3. The Ontological Base (Physical Priority)**
  *   **The Requirement:** The theory must specify whether the Physical Stance is the "truth" and the others are shortcuts, or if all stances are ontologically equal.
  *   **The Concrete Case:** **A hurricane.** Physically, it's air pressure and velocity. Intentionally/Design-wise, we treat it as a unified agent moving across the map. If the theory says the hurricane is *only* real as air molecules, it loses the predictive power of the meteorological model. If it says the hurricane is *equally* real as the molecules, it risks dualism. The theory needs to state if physical closure is a hard constraint or a methodological preference.
  *   **Status:** **Camp Preference.** Dennettians say Physical Closure is non-negotiable but ontologically secondary to prediction. Realists say Physical is the only ontology. You have to pick a lane here.

  **4. Distinction Respect (Prediction vs. Explanation)**
  *   **The Requirement:** The theory must clarify if patterns are justified solely by prediction (instrumentalism) or if they also provide causal explanation (realism).
  *   **The Concrete Case:** **Placebo effects.** Predicting a patient's recovery via the "belief in cure" pattern works. But does that pattern *explain* the recovery physically, or does it just track it? If the theory conflates prediction with explanation, it can't handle cases where a pattern predicts well but refers to nothing causal (like a spurious correlation).
  *   **Status:** **Negotiable.** You can build a theory that says "prediction is enough for reality," but you lose causal depth.

  **5. The Tension (Jointly Unsatisfiable Desiderata)**
  *   **The Requirement:** Acknowledge that **Full Physical Reducibility** and **Autonomous Intentional Normativity** cannot both be fully satisfied.
  *   **The Reasoning:** If every intentional state is fully reducible to a physical state (Physical Stance completeness), then "irrationality" (a key feature of the Intentional Stance) disappears—it's just physics happening. But if intentional normativity is autonomous, then physical closure is violated. A theory must admit this trade-off. You can't have a system where beliefs are perfectly real/normative *and* perfectly reducible to physics without remainder.
  *   **Status:** **Non-negotiable.** Any theory claiming to solve this entirely is selling magic.

  ***

  ### Scoring the Contenders

  Here is how three approaches stack up against these desiderata.

  **1. Dennett's Own View (Pattern Realism)**
  *   **Score:** High on Compression (1) and Decoupling (2). Low on Physical Base (3) because he treats physics as just another stance, not the ontological anchor.
  *   **Verdict:** Best fit for the AI case, but often accused of dodging the hard ontology question. He bites the bullet on the Tension (5) by saying normativity is a feature of the stance, not the world.

  **2. Stance Pluralism (The "Equal Footing" Camp)**
  *   **Score:** High on Physical Base (3) equality. Low on Compression Threshold (1) because if all stances are equal, it's hard to say why some patterns (physics) are more fundamental than others (astrology).
  *   **Verdict:** Good for avoiding reductionism, but risks making reality too democratic. Fails to distinguish real patterns from coherent fictions effectively.

  **3. The Fourth Algorithmic Stance (Weird Option)**
  *   **Score:** High on Decoupling (2) for computational systems. Low on Distinction Respect (4) because it often conflates code execution with intentional explanation.
  *   **Verdict:** Useful for AI, but likely just a subset of the Design Stance. It doesn't solve the Physical Base problem; it just adds another layer of abstraction without clarifying the ontology.

  ### Final Note on Confusion
  Is this request confused? Asking for desiderata for "real patterns" is risky because if Dennett is right, patterns *are* just predictive utilities. Asking for a theory of their "reality" independent of prediction might be a category error. However, since the goal is to clarify *when* prediction counts as reality, the request is coherent, provided you accept that "reality" is tied to information compression. If you demand mind-independent existence beyond compression, you're already rejecting the premise of "Real Patterns."
