answer: |-
  ### Exam Question: The Metaphysics of the Limit
  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Prompt:**
  Consider a Thomson Lamp wired to switch on and off infinitely many times in a finite interval $[0, 1]$, with no switching occurring after $t=1$. The switching schedule is fully specified, but the function describing the lamp's state (On/Off) has no limit as $t \to 1$.

  Answer the following three questions. In your response, you must commit to a specific metaphysical verdict regarding the lamp's state at $t=1$ (e.g., impossible, indeterminate, determinate-but-under-described, or ill-formed) and maintain consistency across all three parts.

  1.  **Persistence and Observation (5 marks):** Suppose that at $t=1.1$, the lamp is observed to be Off, and no switching occurred between $t=1$ and $t=1.1$. Does this observation entail that the lamp was Off at $t=1$? Explain why the inference holds or fails based on your chosen metaphysical verdict.
  2.  **Convergent Quantities (5 marks):** The proportion of time the lamp spent On during $[0, 1]$ converges to exactly 50%. Does this convergent average fix the ontological status of the lamp at $t=1$? Distinguish precisely between the limit of the time-average and the value of the state function.
  3.  **Causal Completion (5 marks):** Suppose the lamp is wired to a controller programmed to force the lamp Off at $t=1$ if the input signal has not settled. Does this stipulation solve the original Thomson puzzle, or does it merely replace the scenario? Justify your answer in terms of what the original puzzle was intended to test.
  4.  **Metaphysical Commitment (5 marks):** Based on your analysis above, definitively categorize the Thomson Lamp problem. Is it a proof of physical impossibility, a logical contradiction, a case of ontological indeterminacy, or a failure of description? Defend this classification against the strongest alternative.

  ***

  ### Model Answer
  **Verdict:** The lamp has no determinate state at $t=1$ (Ontological Indeterminacy).

  The Thomson Lamp description entails that the state function $f(t)$ oscillates without converging. Consequently, there is no fact of the matter regarding the lamp's state at the limit time $t=1$. This is not a failure of human knowledge but a failure of the world to be determinate given the description provided. The three devices proposed in the exam question attempt to patch this indeterminacy, but each fails for distinct metaphysical reasons.

  Regarding **Persistence and Observation**, the inference from $t=1.1$ to $t=1$ fails. To infer the state at the limit from the state post-limit requires a principle of causal continuity or inertia: that an object persists in its state unless acted upon. However, the Thomson setup describes a discontinuity at $t=1$. The switching sequence constitutes an infinite causal intervention terminating exactly at the limit. To assume the state at $1.1$ dictates the state at $1$ is to assume the very continuity the supertask denies. If the state at $t=1$ is indeterminate, the transition to $t=1.1$ requires a new causal event to resolve that indeterminacy. The observation at $1.1$ tells us the result of that resolution, not the status of the limit itself. Dismissing the observation as irrelevant is incorrect; rather, it is evidence of post-limit causation, not pre-limit truth.

  Regarding **Convergent Quantities**, the 50% time-average is a category mistake. The limit of the integral (time spent On) is distinct from the value of the function (state at $t$). That the average intensity converges does not entail that the instantaneous switch converges. To argue that the lamp is "half-On" or that the average fixes the binary state conflates macroscopic aggregate properties with microscopic ontological status. A function can be nowhere continuous yet integrable. The convergent series describes the history of the process, not the terminal point. Relying on the average to fix the state treats the lamp as a dimmer rather than a switch, altering the definition of the object in question. The mathematical convergence of the duration does not metaphysically necessitate a physical state.

  Regarding **Causal Completion**, the controller stipulation does not solve the puzzle; it redescribes it. The original Thomson problem asks what follows from the switching sequence *alone*. By adding a controller with a default setting, we introduce a new causal law: "If input unsettled, force Off." This creates a determinate state, but only by changing the physical setup. It shows that *physical* systems require causal closure to determine states, but it does not answer the *logical* question of whether the switching sequence itself entails a state. If the controller solves the puzzle, it is only by admitting that the original description was causally incomplete. This supports the indeterminacy verdict: the original puzzle lacked a causal rule for the limit, which the controller supplies artificially. It demonstrates that supertasks are not logically impossible, but they are physically under-determined without extra laws.

  **Metaphysical Commitment:**
  The Thomson Lamp is a case of **ontological indeterminacy**. It is not a proof of impossibility, as Benacerraf showed the description is logically consistent. It is not ill-formed, as the sequence is mathematically precise. It is not determinate-but-under-described, because adding no new physical laws leaves the state undefined. The puzzle reveals that completing an infinite task does not logically entail a terminal state unless a principle of causal continuity is independently stipulated. To claim impossibility based on this under-determination is to confuse logical consistency with physical intuition. The correct view is that the world, as described by Thomson, simply contains no truth-maker for the proposition "The lamp is On" or "The lamp is Off" at $t=1$.

  ***

  ### Marking Scheme

  **Total Marks:** 20

  **Part 1: Persistence (5 marks)**
  *   **5:** Identifies that inference requires a continuity principle which the supertask violates. Distinguishes limit state from post-limit persistence.
  *   **3:** Claims observation settles it (or doesn't) but fails to explain the causal gap.
  *   **0:** **Error:** Dismisses observation as irrelevant simply because "the state was already one way or another" (begs the question against indeterminacy).

  **Part 2: Convergent Quantities (5 marks)**
  *   **5:** Distinguishes limit of the integral (average) from limit of the function (state). Identifies "half-On" as a category error regarding binary switches.
  *   **3:** Acknowledges the math but fails to separate aggregate history from instantaneous ontology.
  *   **0:** **Error:** Treats the convergent time-average as fixing the instantaneous state (e.g., "It is 50% On").

  **Part 3: Causal Completion (5 marks)**
  *   **5:** Identifies the controller as a new causal law that replaces rather than solves the original logical gap. Distinguishes physical stipulation from logical entailment.
  *   **3:** Accepts the controller as a solution without noting it changes the scenario.
  *   **0:** **Error:** Treats the stipulation of a default as a solution to the original puzzle rather than a redescription of the problem.

  **Part 4: Metaphysical Commitment (5 marks)**
  *   **5:** Consistently defends one of the four positions (Impossibility, Ill-formed, Indeterminate, Determinate). Argument aligns with Parts 1-3.
  *   **3:** Hedges between positions or contradicts earlier parts.
  *   **0:** **Error:** Infers the impossibility of the supertask from the mere failure of the description to entail an answer.

  **General Penalties:**
  *   **-2:** Hedging/Neutrality (The prompt requires a verdict).
  *   **-2:** Reciting Benacerraf without applying it to the specific devices.

  **Characterisation of a B-Grade Answer:**
  The answer deploys correct vocabulary (limits, entailment, supertask) and identifies the standard "under-determination" line, but fails to structurally distinguish why the three devices fail for *different* reasons, treating them as identical restatements of the same puzzle.
