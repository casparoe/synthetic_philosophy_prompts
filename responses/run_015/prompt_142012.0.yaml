      *   *Wait, looking at the errors to catch:* "Inferring impossibility from under-determination." So the model answer should *not* say "Therefore supertasks are impossible." It should say "The state is indeterminate."
      *   *Verdict:* I will argue that the Thomson description entails *no* fact of the matter (Position 3). Device 1 shows we confuse limit-state with post-limit persistence. Device 2 is a category mistake (average $\neq$ instantaneous). Device 3 shows the puzzle is about physical causation, not logical description.
      *   *Word Count Check:* Need to be concise.

  4.  **Drafting the Marking Scheme:**
