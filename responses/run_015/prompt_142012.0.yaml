      *   *Marks:* 20 total. Let's allocate roughly 5 for the core analysis, and 5 for each of the three devices. Or perhaps 10 for the core argument and 10 distributed among the devices. Let's go with 5 marks per device/scenario to ensure equal weight, as requested.
