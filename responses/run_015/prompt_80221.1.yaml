  2.  **Deconstruct "Saying is Doing" (Speech Act Theory):**
      *   *Locutionary Act:* The act of saying something (making sounds/typing words).
      *   *Illocutionary Act:* The act performed *in* saying something (promising, ordering, warning).
      *   *Perlocutionary Act:* The act performed *by* saying something (convincing, scaring, intoxicating).
