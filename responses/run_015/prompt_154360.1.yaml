  1. The exam question

  **University Examination: Philosophy of Mind and Epistemology**
  **Module: Self-Locating Belief and Rational Credence**
  **Time Allowed: 75 minutes**
  **Word Limit: 1,000–1,200 words**

  **Question 1**

  Consider a variant of the Sleeping Beauty problem. Beauty is put to sleep on Monday. A fair coin is tossed. She is informed of the following protocol upon waking:

  1.  **Heads:** She will be awakened only on **Tuesday**. Her mental state occurs in a single environment.
  2.  **Tails:** She will be awakened on **Tuesday** and again on **Wednesday**. Crucially, she is told that her Tuesday mental state occurs in one environment, while her Wednesday mental state occurs in a second, phenomenologically identical environment that is causally isolated from the first.

  Upon each awakening, her memory of previous awakenings is erased. She knows the protocol but does not know the day nor the coin outcome upon waking.

  Write an essay addressing the following: Should Beauty assign different credences to Heads if she were to learn it is Tuesday versus if she were to learn it is Wednesday? Furthermore, analyse whether this possibility of 'branching instantiation' demonstrates that rational updates for self-locating belief track modal accessibility rather than the mere duplication of observers within a single world. Your answer should critically evaluate how causal isolation impacts the counting of centred worlds.

  ***

  2. Model answer

  Upon waking, Beauty faces a self-locating uncertainty regarding both the coin outcome and the temporal index of her experience. In this variant, the structure of possible centres differs significantly from the standard formulation. There are three potential centred worlds compatible with her evidence: Heads-Tuesday, Tails-Tuesday, and Tails-Wednesday. The question of whether credences should differ between days turns on the informational content of the indexicals 'Tuesday' and 'Wednesday'.

  If Beauty learns it is Wednesday, she can immediately rule out the Heads hypothesis. Under the Heads protocol, no Wednesday awakening occurs. Therefore, her credence in Heads conditional on it being Wednesday must be zero. Conversely, if she learns it is Tuesday, she remains compatible with both Heads and Tails. Consequently, she must assign different credences to Heads on Tuesday versus Wednesday. This disparity is trivial but necessary; the indexical information eliminates different sets of possible centres.

  The deeper philosophical issue concerns whether this variant supports the view that updates track modal accessibility rather than mere duplication. In standard discussions, the 'thirder' position often relies on counting observer moments. However, this variant introduces causal isolation between the Tuesday and Wednesday environments in the Tails world. This suggests that the Wednesday centre is not merely a duplicate observer within the same causal history but a distinct instantiation in a separate modal branch accessible only via Tails.

  If rational credence tracked mere physical duplication, the causal isolation might be irrelevant; there are still two awakenings in Tails and one in Heads. However, if credence tracks modal accessibility, the structure of the possibility space is paramount. The Wednesday centre is modally inaccessible given Heads. When Beauty wakes without knowing the day, she occupies a centre compatible with three possibilities. If she treats these centres as equiprobable, her credence in Heads is one-third. Yet, the causal isolation highlights that the Tails-Wednesday centre is not a competing explanation for the current evidence in the same way a duplicate observer is; it is a distinct possibility entirely excluded by the Heads world.

  This distinction suggests that self-locating belief updates are driven by the elimination of modally inaccessible centres. Learning 'It is not Wednesday' eliminates the Tails-Wednesday centre. If updates tracked only duplication, the metaphysical status of the Wednesday environment would not matter. However, because the Wednesday state is causally isolated, it functions as a distinct modal branch. Thus, the variant supports the claim that rational updates track modal accessibility. The credence shift occurs because the set of accessible centres changes, not merely because the number of physical duplicates changes. The causal isolation reinforces that these are distinct possibilities rather than repeated tokens of the same type. Therefore, the branching instantiation variant clarifies that self-locating credence is fundamentally about navigating a space of modally accessible centres, where causal isolation serves to sharpen the boundaries between those centres rather than blur them through duplication.

  ***

  3. Marking scheme

  **Total Marks: 20**

  **1. Mapping the Centred Worlds (4 marks)**
  The candidate must correctly identify the three relevant centred worlds: Heads-Tuesday, Tails-Tuesday, and Tails-Wednesday.
  *Characteristic mistake:* Failing to distinguish the Tuesday centres in Heads and Tails as distinct possibilities, or incorrectly assuming a Wednesday awakening is possible under Heads.

  **2. Analysis of Indexical Credences (4 marks)**
  The candidate must explicitly state that credence in Heads on Wednesday is zero, while credence on Tuesday is non-zero, justifying this via the protocol constraints.
  *Characteristic mistake:* Arguing that credence in Heads remains constant regardless of the day, ignoring the elimination of the Heads hypothesis on Wednesday.

  **3. Evaluation of Causal Isolation (4 marks)**
  The candidate must analyse whether the causal isolation between Tuesday and Wednesday environments affects the counting of centres compared to standard duplication.
  *Characteristic mistake:* Treating the causal isolation as metaphysically irrelevant without argument, or conflating causal isolation with memory loss.

  **4. Modal Accessibility vs. Duplication (4 marks)**
  The candidate must address the core prompt: does the variant show updates track modal accessibility? A strong answer argues that elimination of the Wednesday centre is a modal update.
  *Characteristic mistake:* Reciting standard Halfer/Thirder arguments without engaging with the specific 'modal accessibility' concept requested in the prompt.

  **5. Coherent Conclusion (4 marks)**
  The candidate must provide a definitive conclusion on whether the branching instantiation supports the modal accessibility view, synthesising the previous points logically.
  *Characteristic mistake:* Ending with an ambiguous summary that fails to take a stance on the modal accessibility claim or contradicts earlier analysis.
