      *   Actually, the simplest explanation for the coin game is the parity argument. It's a solved game by simple counting, rendering strategy-stealing irrelevant. But to answer *why strategy stealing breaks*: The assumption "having an extra piece never hurts" is false.

  8.  **Drafting the Response (Iterative refinement):**

