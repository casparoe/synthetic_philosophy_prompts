answer: |-
  There is no single, canonical Latin term or standardized fallacy name in logic textbooks that captures this specific three-stage rotation in aesthetics. However, your observation is precise and identifies a well-recognized rhetorical maneuver in meta-aesthetics and philosophy of culture.

  In philosophical discourse, this pattern is best described as **Defensive Ontological Shifting**. It is a specific, sophisticated subtype of the colloquial "moving the goalposts," distinguished by the fact that the shifts occur not merely in the *standards of proof*, but in the *ontological category* of the object itself (what the artwork *is*) to preserve a fixed *axiological conclusion* (the artwork's *value*).

  Below is a careful definition of the phenomenon, its distinctions from related logical structures, and an analysis of its scope.

  ### 1. Conceptual Definition: Defensive Ontological Shifting

  **The Mechanism**
  The pattern operates on a tension between a **Fixed Valuation** and a **Mutable Ontology**.
  *   **Fixed Valuation:** The conclusion remains constant throughout the argument (e.g., "The original possesses a unique value $V$ that the replica lacks").
  *   **Mutable Ontology:** The definition of the object's identity shifts to accommodate counterexamples. The defender treats the artwork as a *physical particular* when challenged on history, an *intentional structure* when challenged on material, and a *historical individual* when challenged on replication.

  **The Rotation**
  1.  **Material Phase:** Value is grounded in the *substance* (the specific atoms/paint).
      *   *Vulnerability:* Conservation, workshop assistants, decay.
  2.  **Intentional Phase:** Value is grounded in the *design* (the artist's mental state embodied).
      *   *Vulnerability:* Perfect forgeries, posthumous realizations, algorithmic art.
  3.  **Causal-Historical Phase:** Value is grounded in the *provenance* (the unbroken chain of custody from the creator).
      *   *Vulnerability:* This is often the "last stand," as it is hardest to replicate, but it risks making the value purely fetishistic (relic worship) rather than aesthetic.

  **Why it is not a simple Fallacy**
  Unlike a logical fallacy, which renders an argument invalid, this pattern often relies on premises that are individually plausible. The "error" is not in the logic of any single step, but in the **refusal to update the confidence of the conclusion** as the premises become increasingly abstract or distant from the viewer's experience. It is a strategy of **theoretical resilience** rather than logical derivation.

  ### 2. Distinctions from Related Structures

  You correctly identified that this differs from standard rhetorical patterns. Here is how to delineate the boundaries:

  **Vs. Motte-and-Bailey**
  *   **Motte-and-Bailey:** Relies on a gradient of defensibility. The "Motte" is a trivial truth (easy to defend); the "Bailey" is a controversial claim (hard to defend). The arguer retreats to the Motte when attacked and returns to the Bailey when safe.
  *   **Defensive Ontological Shifting:** There is no gradient of defensibility. The Material, Intentional, and Historical claims are all roughly equally controversial and substantial. The defender does not retreat to a "safer" claim; they sidestep to a *different category* of claim.

  **Vs. Equivocation**
  *   **Equivocation:** Relies on hidden ambiguity. A word (e.g., "light") is used with Meaning A in Premise 1 and Meaning B in Premise 2 to force a conclusion, without acknowledging the shift.
  *   **Defensive Ontological Shifting:** The shift is explicit. The defender acknowledges the failure of the Material claim ("Okay, the paint isn't the point") and sincerely adopts the Intentional claim. The terms are not being smuggled; the *framework* is being swapped.

  **Vs. Ad Hoc Immunization (Science)**
  *   **Ad Hoc (Science):** An auxiliary hypothesis is added to a theory to prevent falsification (e.g., "The planet isn't there because an invisible shield hides it"). This reduces the theory's falsifiability and is generally considered a vice in empirical science.
  *   **Defensive Ontological Shifting (Aesthetics):** This occurs in **normative** discourse, not empirical. Value claims are not falsifiable in the same way as physical laws. Therefore, shifting the ontological ground is not necessarily "unscientific," but it does function to make the value claim **unfalsifiable by aesthetic experience**. If the value lies entirely in a hidden causal history, no amount of visual perfection in a replica can ever challenge it. This insulates the claim from aesthetic engagement.

  ### 3. Scope and Application

  You asked whether this pattern applies only to tangible artifacts. It does not. The pattern is robust across media, though the "stages" transform to fit the medium.

  **Performance Art & Music**
  *   **Material:** The specific sound waves or physical movements of the original performer.
      *   *Counter:* Recordings exist; the performer has aged or died.
  *   **Intentional:** The specific interpretation or emotional state of the composer/performer.
      *   *Counter:* A different musician can embody the same score/intention.
  *   **Causal-Historical:** The specific event in time (the "live" moment).
      *   *Result:* This leads to the fetishization of the "Live" performance over the recording, even if the recording is sonically superior.

  **Digital Works & Code**
  *   **Material:** The specific magnetic orientation on the hard drive or the "original file."
      *   *Counter:* Digital files are perfectly copyable; bits are identical.
  *   **Intentional:** The specific code structure written by the author.
      *   *Counter:* Re-compiling or rewriting in a new language can produce identical output.
  *   **Causal-Historical:** The provenance of the file (e.g., NFTs, blockchain signature, artist's verified repository).
      *   *Result:* The value shifts entirely to the **certificate of authenticity** rather than the sensory experience of the work. This is the purest form of the pattern, as the "Material" phase is almost immediately abandoned in digital contexts.

  **Reconstructed Documents**
  *   **Material:** The original parchment/ink.
  *   **Intentional:** The author's original wording.
  *   **Causal-Historical:** The manuscript's survival through history.
      *   *Result:* A scholarly reconstruction may be textually more accurate (Intentional) than a damaged original, yet the original retains higher market/historical value due to the Causal-Historical chain.

  ### 4. Philosophical Context: Essentialism vs. Cluster Concepts

  To understand *why* this pattern persists, it helps to recognize the underlying philosophical tension.

  *   **The Defender's Stance:** They are acting as a **Secret Essentialist**. They want the artwork to have one single "essence" that grants it value (to justify the high price or reverence). However, when that essence is refuted, they do not abandon Essentialism; they simply swap the essence.
  *   **The Critic's Stance:** Many modern aestheticians (following Wittgenstein or Morris Weitz) argue that art is a **Cluster Concept**. There is no single necessary condition (material, intention, or history) that defines art or its value. Instead, there is a cluster of properties.
  *   **The Pattern's Function:** Defensive Ontological Shifting is the rhetorical tool used to force a **Cluster Concept** to behave like an **Essentialist Definition**. It allows the defender to say, "It *must* have this one special quality," while quietly changing which quality that is to ensure the object never loses its status.

  ### Summary for Your Studies

  You have identified a sophisticated argumentative strategy that protects the **Cult of Authenticity**. While it lacks a single Latin name, you can accurately label it **Defensive Ontological Shifting**.

  *   **Core Feature:** Fixed Value + Mutable Ontology.
  *   **Distinction:** It is not Equivocation (shifts are sincere) nor Motte-and-Bailey (no difficulty gradient).
  *   **Scope:** Universal across art forms, becoming most visible in digital media where material identity is weakest.
  *   **Philosophical Implication:** It reveals a desire to treat aesthetic value as an intrinsic property of the object, even when evidence suggests value is relational, historical, or institutional.

  Recognizing this pattern allows you to pause the debate and ask the defender: *"Which ontology are we committing to? If the value lies in the history, why did you argue for the paint? If we accept the history is the only thing that matters, are we admitting the aesthetic experience is irrelevant?"* This forces them to collapse the rotation and defend a single position.
