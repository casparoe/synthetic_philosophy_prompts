  # Joint Statement on Computational Constraints and Normative Theory

  **Preface:** This document is the product of an adversarial collaboration between the Tractability Constraint (TC) theorist and the Norm Autonomist (NA). Its purpose is not to declare a winner, but to isolate the precise points of substantive disagreement from those that are merely verbal or evidentiary. Both parties agree to the shared premises regarding NP-hardness, the divergence of worst-case and average-case complexity, and "no free lunch" theorems.

  ## Part I: Agreed Claims

  1.  **Implementation vs. Validity Distinction:** Computational complexity results establish hard limits on the physical *implementation* of cognitive processes. Both sides agree that a normative theory claiming agents *actually* execute steps proven impossible for their hardware is empirically false as a *descriptive* model of the mechanism. The dispute concerns whether this descriptive falsity entails *normative* invalidity. [Confidence: High]
  2.  **Worst-Case Limitations:** Worst-case hardness does not logically entail average-case hardness on the specific distributions of problems agents actually encounter. However, establishing the relevant "ecological" distribution is an empirical burden, not a logical given, and neither side currently possesses a complete characterization of this distribution for complex reasoning tasks. [Confidence: High]
  3.  **Dual Function of Norms:** Normative theories serve both an *evaluative* function (assessing the correctness of a belief or action) and a *guiding* function (prescribing a procedure to generate that belief or action). Both sides agree that if a norm fails the guiding function completely (i.e., offers no actionable path), its utility is diminished; they disagree on whether this diminution voids the norm's evaluative authority. [Confidence: Medium-High]
  4.  **The Meta-Optimization Problem:** Computing a resource-rational policy (i.e., optimizing the trade-off between accuracy and computational cost) is itself an optimization problem over the space of algorithms. This meta-problem is itself subject to complexity constraints. Both sides agree this generates a potential regress: if one must compute the optimal way to compute, where does the chain stop? [Confidence: High]
  5.  **Physical Impossibility Constraint:** Both sides agree that if an action is physically impossible (e.g., violating laws of physics or hard hardware limits), prescribing it is useless for guidance. The disagreement is whether computational intractability (e.g., exponential time requirements) counts as "physical impossibility" in the normative sense for bounded agents. [Confidence: High]
  6.  **The "Intractability-Resilient" Diagnostic:** A norm is defined as *intractability-resilient* if, for every plausibly ecological distribution of decision problems, there exists a polynomial-time procedure that comes within ε of meeting the norm. Both sides agree this diagnostic is useful but note it begs three questions: who fixes the ecological distribution, who fixes ε, and whether the procedure must be *findable* by the agent or merely *exist* in principle. [Confidence: Medium]
  7.  **Empirical Divergence:** There exist conceivable task structures where Bayesian/Expected-Utility predictions and Resource-Rational predictions diverge empirically. Identifying these cases is the only way to adjudicate the dispute empirically rather than philosophically. [Confidence: High]
  8.  **Mathematical Hostage:** If P were proved equal to NP with small constants, the TC position would lose its primary motivation regarding efficiency, though strict budget constraints (energy/latency) would remain. Conversely, if a specific inference task common in real environments were proved hard on the actual ecological distribution, the NA would need to explain why agents succeed without violating the norm or the hardness proof. [Confidence: Medium-High]
  9.  **Regress Resolution:** Stopping the regress of "computing the computation" requires either positing a foundational uncomputed heuristic (TC preference) or accepting an ideal that guides despite not being fully computed (NA preference). Both agree that some stopping point is required for a complete theory. [Confidence: Medium]
  10. **Burden of Proof Distribution:** The TC theorist bears the burden of showing that the ideal norm is *systematically* unreachable in ecologically valid settings. The Norm Autonomist bears the burden of showing that the ideal norm is either reachable or remains relevant for evaluation despite unreachability. [Confidence: High]

  ## Part II: Disagreements Table

  | Crux | Neutral Statement of Crux | Tractability Constraint (TC) Formulation | Norm Autonomist (NA) Formulation | Agreed Test / Argument | TC Prediction | NA Prediction | Confidence |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Relevant Distribution** | Which measure over instances determines normative feasibility: the ecological distribution or an adversarial one? | Normative feasibility must be assessed against the *actual* ecological distribution the agent faces. If the ideal is hard on this distribution, the norm is invalid. | Normative validity should not depend on contingent empirical distributions. Worst-case hardness is irrelevant, but so is ecological ease; the norm stands regardless of the distribution. | **Case:** A decision-maker faces a hard latency deadline. Instances are empirically easy (poly-time solvable) but worst-case hard. | TC: Norm is valid *only if* the agent can exploit the ecological ease. If the agent cannot find the easy algorithm, the norm is invalid. | NA: Norm is valid regardless. If the agent succeeds, they meet the norm; if they fail, they are irrational, even if the task was worst-case hard. | Medium |
  | **2. Function of Intractability** | Does intractability excuse noncompliance, weaken the norm, or replace the norm's content? | Intractability requires *replacing* the norm's content. The correct norm is the best feasible approximation (e.g., satisficing). | Intractability functions as an *excuse* for noncompliance but does not change the norm's content. The ideal remains the standard for evaluation. | **Diagnostic:** Apply the "Intractability-Resilient" diagnostic. Who fixes ε and the distribution? | TC: The procedure must be *findable* by the agent within budget. If not, the norm fails. | NA: The procedure need only *exist*. If it exists, the norm is resilient; if the agent fails to find it, that is a performance error. | Medium-High |
  | **3. Mathematical Hostage** | Should normative content depend on unsettled mathematics (e.g., P vs NP, hardness on natural inputs)? | Yes. If a task is proven hard on the ecological distribution, the normative theory must change to reflect feasible bounds. | No. Normative requirements are logical relations, not empirical theorems. Hardness proofs show limits on algorithms, not on rationality. | **Hypothetical:** A proof emerges that Bayesian inference is hard on the *actual* distribution of natural language inputs. | TC: We must abandon Bayesian norms for language understanding and adopt heuristic norms. | NA: Agents are either using unknown tricks (violating the proof's assumptions) or are systematically irrational in language understanding. | Medium |
  | **4. Meta-Level Regress** | How do we stop the regress of optimizing the computational budget itself? | The regress stops at a feasible, perhaps evolved, heuristic. We do not need to optimize the optimizer; it just needs to work within budget. | The regress is avoided because the ideal norm guides even if uncomputed. We evaluate the outcome against the ideal, not the cost of computing the ideal. | **Analysis:** Compare the complexity of computing the resource-rational policy vs. the base policy. | TC: If computing the resource-rational policy is harder than the base policy, the theory is vacuous. | NA: The complexity of the meta-policy is irrelevant to the validity of the base norm as an evaluative standard. | Medium |
  | **5. Feasibility Definition** | Does "feasible" mean polynomial-time (asymptotic) or within the agent's actual budget (e.g., milliseconds)? | "Feasible" means within the agent's *actual* budget (e.g., 50ms latency). Asymptotics are irrelevant if the constant factor is too large. | "Feasible" generally means polynomial-time. Specific budget constraints are engineering problems, not normative ones. | **Case:** A 50ms latency deadline task where the algorithm is O(n) but the constant factor exceeds the deadline. | TC: The norm is invalid for this agent. The constant factor matters. | NA: The norm is valid; the agent is simply too slow. The norm describes the target, not the engine. | High |
  | **6. Empirical Divergence** | What pattern of results would count against each view? | If agents consistently match Bayesian predictions in hard tasks without apparent heuristics, TC is undermined. | If agents consistently match Resource-Rational predictions that diverge from Bayesian optimality in easy tasks, NA is undermined. | **Experiment:** Task where Bayesian and Resource-Rational predictions diverge (e.g., specific bias patterns). | TC: I predict agents will follow the Resource-Rational pattern (bias consistent with cost). | NA: I predict agents will approximate the Bayesian pattern (bias consistent with noise/error). | High |

  ## Part III: Closing Analysis

  **Verbal vs. Genuine Disputes**
  A significant portion of the quarrel is verbal, centering on the definition of "norm." If "norm" means "procedure for guidance," the TC theorist wins by definition; if "norm" means "standard of correctness," the Norm Autonomist wins by definition. Once these definitions are disambiguated (as in Claim 3), the dispute shifts to whether a standard of correctness that cannot guide is scientifically useful. This is a genuine dispute about the purpose of cognitive science: is it to engineer agents (TC) or to evaluate them (NA)?

  However, the genuine core that survives clarification lies in **Crux 6 (Empirical Divergence)** and **Crux 1 (Relevant Distribution)**. If there are tasks where the two theories predict different behaviors, and we can characterize the ecological distribution of those tasks, the matter is empirically decidable. The disagreement over who bears the burden of describing the distribution (TC vs. NA) is also genuine: it is a methodological dispute about whether we assume environments are benign until proven hostile, or hostile until proven benign.

  **Least Certain Point**
  The point where I am least certain I have avoided distortion is in the **Norm Autonomist's formulation of Crux 4 (Meta-Level Regress)**. I have attributed to the NA the view that "the ideal norm guides even if uncomputed." A sophisticated NA might argue that the ideal does not need to "guide" in a procedural sense to be valid, but might concede that for *psychological* theory (as opposed to pure epistemology), some account of approximation is needed. I may have legislated a harder line for the NA than a real defender would take, potentially conflating the philosophy of action with formal epistemology. A real defender of the NA position might reach for empirical results on human approximation capabilities to argue that the regress is practically dissolved by cognitive architecture, rather than philosophically ignored. I have extrapolated that the NA cares less about the "how" than the TC theorist does, which is likely true in principle but might be overstated for the sake of contrast in this document.
