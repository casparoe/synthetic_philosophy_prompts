  **Case A**
  Consider some simples arranged in a specific, highly complex topology. These simples are cells and molecules. They are bonded such that nutrients flow between them at rate *R*, waste is expelled at rate *W*, and when external pressure is applied to the periphery, the internal parts shift coordinately to maintain structural integrity. This arrangement arose via a continuous sequence of cellular divisions from a single zygote, where each stage maintained the homeostatic event characteristic of the previous stage. The current activity of these simples sustains the very pattern that organizes them, with no external regulator intervening in the feedback loops.

  **Case B**
  Consider some simples arranged in that exact same topology. These simples are cells and molecules. They are bonded such that nutrients flow between them at rate *R*, waste is expelled at rate *W*, and when external pressure is applied to the periphery, the internal parts shift coordinately to maintain structural integrity. This arrangement arose instantaneously via an atmospheric electrical discharge assembling pre-existing matter from the surrounding soil and air. The current activity of these simples sustains the pattern that organizes them, with no external regulator intervening in the feedback loops. The physical state is molecule-for-molecule identical to Case A.

  ***

  ### Analysis

  **The Verdicts**

  *   **(a) Nihilism:** **No** in both cases. Nihilism denies composition regardless of arrangement or history. The simples exist, but nothing further exists.
  *   **(b) Universalism:** **Yes** in both cases. Any plurality of simples composes an object. The historical origin is irrelevant to the existence of the fusion.
  *   **(c) Life Criterion (Van Inwagen):** **Yes** in A, **No** in B. In A, the activity of the simples constitutes a *life*—a self-maintaining biological event with the right causal history (immanent causation). In B, while the activity mimics life, it is not *a life* in the substantive sense; it is a momentary state lacking the historical continuity required for a biological event to persist. (Note: Some Life-theorists might bite the bullet and say B is alive, but the standard Neo-Aristotelian reading denies substantial form to accidental assemblies).
  *   **(d) Contact/Cohesion Criterion:** **Yes** in both cases. The bonding, flow rates, and topological resilience are identical. Whatever bonds simples in A bonds simples in B.
  *   **(e) Non-Redundancy:** **Yes** in both cases. In both scenarios, the simples perform activities (e.g., homeostatic regulation, structural resilience) that no proper subset could perform alone. The causal power is emergent from the arrangement, not the history.

  **The Switch Feature**
  The single feature doing the work is **Historical Origin** (specifically, etiology via reproduction vs. accidental assembly). If you delete this feature—i.e., if you stipulate that history is irrelevant to composition—the Life Criterion verdict flips to "Yes" for both cases (collapsing into a purely functional/contact view). If you restore it, Life diverges from Contact and Non-Redundancy. This reveals that the Life Criterion, unlike the others, is not supervenient on the synchronic physical facts.

  **Constraint 7 (The Continuous Process)**
  I cannot satisfy Constraint 7 while maintaining Constraints 1 and 2. Here is why: If the contact-level description (Constraint 1) never jumps discontinuously, the synchronic physical facts are continuous. If the Life verdict flips (Constraint 2), Life must depend on something *other* than synchronic physical facts (i.e., History). But History is not a continuous variable in the relevant sense; origin is a binary fact (either it came from a zygote or it didn't). You cannot continuously transform a natural origin into an accidental one without a discrete break in the causal chain. If you attempt a Ship-of-Theseus style replacement to bridge them, you either introduce vagueness (violating Constraint 3) or you admit that the Life verdict tracks the history, which remains discrete. **This failure is arguably the result you want:** it demonstrates that any Restricted View that flips verdicts on physically identical cases must abandon synchronic supervenience, making it metaphysically "spooky" or brute.

  **The Parity Objection (Steelman)**
  *The Objection:* The moderate is gerrymandering. By selecting "Historical Origin" as the composition-relevant feature, she is simply cherry-picking the only property that yields her desired intuitive result (Organism in A, None in B). Why is *origin* metaphysically privileged over *function*? If the contact-level causal powers are identical, the ontological status should be identical. To say otherwise is to claim that two physically identical systems differ in their parthood structure solely due to the past, which looks like a violation of parsimony and physicalistic integrity.

  *The Moderate's Reply:* The Life Criterion isn't about *structure*; it's about *events*. A life is a particular kind of causal event (immanent causation). Events have identity conditions that include their origins. A flame lit by a match and a flame lit by lightning may be physically identical, but they are distinct events. Similarly, the activity in A is a continuation of a biological lineage; the activity in B is a novel, accidental occurrence. Composition tracks the *event* of living, not just the *state* of the matter. Therefore, the feature isn't gerrymandered; it's essential to the definition of the *relatum* (a life).

  *Honest Assessment:* This pair **hurts the moderate**. While the reply above is coherent, it concedes that the Special Composition Question is not answerable by looking at the world *now*. It forces the moderate to admit that ontology depends on narrative history, which makes composition epistemically inaccessible (you can't know if you are touching an object or a Swampman duplicate without knowing its past). This supports your chapter's thesis: restricted views either collapse into Universalism (by ignoring history to save supervenience) or become Brutalist (by asserting brute historical facts determine composition). The Non-Redundancy criterion shadows Contact/Universalism here, suggesting it fails to capture the "Life" intuition without smuggling in historical conditions.
