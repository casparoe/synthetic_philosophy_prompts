answer: |-
  A claimant qualifies for entry on the register only if the City can impose material harm through binding rules the claimant did not shape, and the claimant lacks exit or countervailing power comparable to existing voters.

  **STANDING ORDER 101: PETITION REVIEW PROCEDURE**

  **Step 1: The Harm Test**
  Question: Can the City impose financial, property, or liberty harm on the claimant through rules enforceable by penalty?
  Sufficient Answer: Yes, if the harm is direct and not shared generally by the public.
  **[BOUNDARY FIX]** The Board defines "material harm" here; the electorate cannot vote on who is harmed.

  **Step 2: The Agency Test**
  Question: Does the claimant currently hold a vote on the rules causing the harm?
  Sufficient Answer: No, if the claimant cannot vote for the Council or the specific authority enforcing the rule.

  **Step 3: The Exit and Power Test**
  Question: Can the claimant avoid the harm by leaving the City's jurisdiction or negotiating relief at a cost comparable to a resident moving home?
  Sufficient Answer: No, if exit costs are prohibitive or lobbying power is significantly lower than that of resident voters.
  **[JUDGMENT CALL]** Commissioners decide what counts as "comparable cost"; this is policy disguised as fact.

  **Step 4: The Statutory Check**
  Question: Does the enabling statute permit a vote for this class of claimant?
  Sufficient Answer: Yes, if the text allows "residents" to be interpreted broadly or allows "categories."
  **[BOUNDARY FIX]** The Board interprets the statute; the Council wrote it.

  **Step 5: Outcome Selection**
  *   **Full Franchise:** If Steps 1, 2, 3 are YES, NO, NO and Step 4 is YES.
  *   **Limited Franchise:** If Steps 1, 2, 3 are YES, NO, NO but harm is issue-specific (e.g., tax only) and Step 4 allows categories.
  *   **Registered Interest:** If Step 3 is YES (exit available) but harm is significant. No vote, but published reasons must address their status.
  *   **Referral to Council:** If Step 4 is NO but Steps 1-3 suggest relief is due.
  *   **Denial:** If Step 1 is NO or Step 2 is YES.

  **Step 6: Tie-Break and Dissent**
  If evidence on Step 3 is equal, the vote defaults to **Denial** to preserve the existing electorate. Any commissioner may record a dissenting opinion attached to the order.

  **Step 7: Re-opening Trigger**
  A granted status may be revisited if the City changes the tax, zoning, or policing rules that formed the basis of the Harm Test, or if exit costs change materially.

  ***

  **APPLICATION 1: COMMUTERS ASSOCIATION**
  **Outcome:** Limited Franchise (Earnings Tax and Transit Issues Only).
  **Published Reasons:** The City imposes direct financial and transit burdens on commuters who lack voting recourse and face high costs to relocate employment; however, because their residence lies outside City limits, full franchise is restricted to issues where the burden is disproportionate.
  **Strongest Objection:** "Diluting the resident vote with non-residents breaks the link between community life and political power."
  **Board Reply:** The link preserved is between coercive rule and consent; where the City taxes income directly, the voter must have a say in that tax.
  **[JUDGMENT CALL]** The Board decided job relocation is harder than home relocation for this group.

  **APPLICATION 2: BUSINESS FEDERATION**
  **Outcome:** Denial (with Registered Interest status).
  **Published Reasons:** Firms can relocate operations to avoid burdens and possess lobbying resources comparable to voter blocs; moreover, the statute permits only natural persons on the register.
  **Strongest Objection:** "Businesses pay rates and create jobs; excluding them ignores their stake in the city's survival."
  **Board Reply:** Economic stake is not equivalent to subjection to coercive rule; firms have exit options residents do not.
  **[BOUNDARY FIX]** The Board defined "firm exit" as comparable to "resident move" without voter approval.

  **APPLICATION 3: DISPLACED RESIDENTS ASSOCIATION**
  **Outcome:** Denial.
  **Published Reasons:** Claimants are not currently subject to the City's coercive rules as they do not live or operate within the jurisdiction; historical wrongs cannot be remedied through the electoral register.
  **Strongest Objection:** "The authority controls land that was theirs; denying them a vote perpetuates the original dispossession."
  **Board Reply:** The Board administers the current electorate, not historical restitution; relief requires Council legislation.
  **[BOUNDARY FIX]** The Board defined "current subjection" as the only valid claim, excluding historical ties.

  ***

  **LIMITATIONS OF THIS PROCEDURE**

  This procedure will mishandle petitions based on moral claim rather than current burden, such as the displaced residents, because it treats the register as a shield against harm rather than a tool for justice. It will decide correctly on business exclusion but for reasons that cannot be said aloud: that corporations have too much power already, not that they lack "exit." It relocates the boundary problem to Step 3, where commissioners decide what counts as "comparable cost" without a standard to measure it. It cannot dissolve the boundary problem; it only forces the Board to admit where it draws the line.
