  9.  **Final Polish:** Ensure tone is rigorous, journalistic, and respectful of the intellectual lineage. Structure clearly with rankings. (Proceed to generate output based on these thoughts).

      *   *Key Insight:* The biggest contradiction is claiming "impossible breakdown" while relying on a theory of solidarity decay (*asabiyyah*) that explains breakdown. If solidarity decays, nukes might still fire (irrational actors), or supply chains break (functional collapse). "Physical impossibility" is too strong.
      *   *Key Insight 2:* "Linear-progressive" is the teleology trap. Change to "cumulative but contingent."

  10. **Final Review against constraints:**
