      *   *Section 4: The Pivot Point.* Identify Commitment (5) as the one to revise.
      *   *Section 5: Cheapest Revisions.* Offer specific wording changes.

  8.  **Refining the Logic (Self-Correction during drafting):**
      *   *Check:* Is "linear-progressive" necessarily teleological?
      *   *Correction:* It can be empirical (we have more tech now) vs. normative (we are *going* to a better place). The user says "linear-progressive in its infrastructural... trajectory." This implies directionality. Methodology (6) says "without implying destiny." If the trajectory is *contingent* on human choice, it's not teleological. If it's *inherent* to history, it is. The user's phrasing "macro-history is now linear-progressive" sounds inherent. I need to highlight this nuance.
      *   *Check:* Khaldun on non-state actors.
      *   *Correction:* Khaldun's *asabiyyah* is about blood/kin/ideological bonding for *rule*. Can a corporation have *asabiyyah*? Yes, corporate culture. But does its decay lead to *political* collapse? The user links it to legitimacy. If firms lose cohesion, do states collapse? The link needs strengthening or the claim of "impossible global collapse" needs weakening.
