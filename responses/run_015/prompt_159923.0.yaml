  # Sidebar: The Computation Decision Tree

  **Instructions:** Start at the top. Answer each question based on your intuition about the concrete case presented. Follow the arrow to the next question or the final position. No philosophical training is required; trust your gut about the physics and the function.

  **Starting Commitment:** *We agree that neuroscientists' descriptions of neural circuits track real causal structure in the brain.*

  ---

  ### Q1. The Rock
  Imagine an ordinary rock sitting on a hill. A philosopher demonstrates a complex mathematical mapping where the rock's physical states (temperature, vibration, position) correspond perfectly to the states of a word-processing program running on your laptop.
  **Does the rock literally compute the word processor program?**
  *   **Yes:** → **Go to Leaf A**
  *   **No:** → **Go to Q2**

  ### Q2. The Ambiguous Circuit
  Imagine a physical circuit that, due to its symmetry, physically supports two mutually incompatible program descriptions (e.g., it is equally valid to say it is adding numbers or sorting letters) with no physical fact to decide between them.
  **Is the "real" computation determined by the observer's utility, or by the system's history and function?**
  *   **Observer's Utility:** → **Go to Leaf B**
  *   **System's History/Function:** → **Go to Q3**

  ### Q3. The Broken Calculator
  A calculator is damaged. When you input `2 + 2`, it systematically outputs `5`.
  **Is the calculator malfunctioning (computing the wrong sum), or is it simply functioning perfectly as a `2+2=5` machine?**
  *   **Simply Functioning (No Error):** → **Go to Leaf C**
  *   **Malfunctioning (Error is Real):** → **Go to Q4**

  ### Q4. The Symbols
  Consider a system that shuffles symbols (like words or numbers) according to rules, but the symbols have no meaning to the system itself (it doesn't know what "2" means, only how to move it).
  **Is this symbol-shuffling enough for cognition, or must the states be *about* something (have meaning)?**
  *   **Needs Meaning:** → **Go to Leaf D** (Classical Computationalism)
  *   **Shuffling is Enough:** → **Go to Q5**

  ### Q5. The Clockwork
  Neural activity changes continuously over time, like a wave or a clock's gear turning, rather than in discrete digital steps (1s and 0s).
  **Is this continuous dynamic process fundamentally different from computation, or is it just a physical way of doing computation?**
  *   **Fundamentally Different:** → **Go to Leaf E**
  *   **Just Physical Computation:** → **Go to Q6**

  ### Q6. The Ship of Theseus
  Imagine we replace your neurons one by one with silicon chips that perfectly match each neuron's input-output profile.
  **When the replacement is complete, is your cognition still there?**
  *   **Yes (Survives):** → **Go to Leaf F**
  *   **No (Dies):** → **Go to Leaf G**

  ---

  ### The Leaves

  **Leaf A: Pancomputationalism**
  *   **Standard Label:** Pancomputationalism / Triviality Realism.
  *   **The Position:** The whole question is empty because everything computes.
  *   **Awkward Commitment:** You must accept that a bucket of water computes the stock market if you can find the right mapping, rendering the word "computer" useless for distinguishing brains from rocks.

  **Leaf B: Computational Instrumentalism**
  *   **Standard Label:** Computational Instrumentalism / Observer-Relative Realism.
  *   **The Position:** Computation is a description we impose rather than something a system does intrinsically.
  *   **Awkward Commitment:** You must concede that there is no fact of the matter about what your brain is doing until an observer decides to describe it as computing.

  **Leaf C: Eliminative Physicalism**
  *   **Standard Label:** Eliminative Physicalism (Empty/Neglected).
  *   **The Position:** There is no such thing as computational error, only physical state changes.
  *   **Diagnosis:** **Vacant due to unattractiveness.** This position is rarely occupied because it makes it impossible to say a computer (or brain) is ever "broken" or "wrong," which contradicts how we build and diagnose systems.
  *   **Awkward Commitment:** You cannot claim a calculator is broken, only that it is different from what you expected.

  **Leaf D: Classical Computationalism**
  *   **Standard Label:** Classical Computationalism / GOFAI (Good Old-Fashioned AI).
  *   **The Position:** Cognition requires manipulation of sentence-like symbols with semantic content.
  *   **Awkward Commitment:** You must regard modern neural networks (which do not use sentence-like symbols) as fundamentally incapable of human-like thought, regardless of their performance.

  **Leaf E: Dynamical Systems Hypothesis**
  *   **Standard Label:** Dynamical Systems Hypothesis.
  *   **The Position:** The dynamical-systems rejection; brains are continuous fields, not discrete processors.
  *   **Awkward Commitment:** You must treat the mathematical tools of computer science (algorithms, code) as category errors when applied to biology, despite their predictive success.

  **Leaf F: Mechanistic Subsymbolism**
  *   **Standard Label:** Mechanistic Functionalism / Connectionism.
  *   **The Position:** Brains compute but not over sentence-like symbols; it is a substantive empirical claim about what neural mechanisms do.
  *   **Flag:** **Indistinguishable Coordinates.** This leaf captures *two* of your required positions. The decision tree cannot separate the view that computation is an "empirical claim about mechanisms" from the view that it is "subsymbolic," as both endorse functional replacement (Q6-Yes) and reject classical symbols (Q4-No).
  *   **Awkward Commitment:** You must accept that a mind could theoretically exist in a vat of silicon, provided the causal organization matches the biological original.

  **Leaf G: Biological Naturalism**
  *   **Standard Label:** Biological Naturalism.
  *   **The Position:** Computation is real, but it depends on specific biological causal powers.
  *   **Awkward Commitment:** You must assert that a perfect functional duplicate of your brain made of silicon would be a zombie (unconscious), implying consciousness depends on "neural goo" rather than causal structure.
