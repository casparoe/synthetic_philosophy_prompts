answer: |-
  ### Executive Summary

  There is **no standard, unique label** in decision theory for the specific two-layer structure you describe. It is best characterized as a form of **Piecewise Expected Utility** with a focus on **Downside Risk** (specifically resembling **Lower Partial Moment** optimization).

  However, I must adhere to your request to "push back plainly." **Mathematically, your claim that this structure cannot be collapsed into a single modified utility curve is incorrect,** provided the scaling factor depends *only* on the outcome of that specific state and the fixed threshold.

  If the scaling factor $\lambda$ is a function of the outcome $x$ and threshold $T$ (i.e., $\lambda(x, T)$), the entire operation is representationally equivalent to Standard Expected Utility Theory (EUT) with a single, kinked utility function $\tilde{u}(x)$. The distinction you draw is valid only as a description of **cognitive process** (how the agent thinks), not **choice behavior** (what the agent chooses). If your goal is to model observable choices, the "two-layer" claim adds no predictive power over a single modified utility function.

  Below is the formal characterization, the necessary push-back on reducibility, and the distinction from standard frameworks.

  ---

  ### 1. Formal Structure and The Reducibility Critique

  Let $L$ be a lottery with states $s \in S$, probabilities $p_s$, and outcomes $x_s$. Let $T$ be the exogenous catastrophic threshold.

  **Your Description:**
  1.  **Layer 1 (Risk):** Compute $u(x_s)$ where $u$ is concave.
  2.  **Layer 2 (Catastrophe):** Apply scaling $\lambda(x_s, T)$ if $x_s < T$, where $\lambda \in (0, 1)$ decreases as distance $(T - x_s)$ increases.
  3.  **Aggregation:** $V(L) = \sum_{s \in S} p_s \cdot \lambda(x_s, T) \cdot u(x_s)$.
      *(Note: Assume $\lambda(x, T) = 1$ for $x \ge T$).*

  **The Push Back:**
  You state these adjustments are "not collapsed into... a single modified utility curve."
  Mathematically, define $\tilde{u}(x) \equiv \lambda(x, T) \cdot u(x)$.
  Your valuation function is exactly:
  $$ V(L) = \sum_{s \in S} p_s \tilde{u}(x_s) $$
  This **is** Expected Utility Theory. The "two-layer" description is a process narrative, not a structural distinction. Unless the scaling factor $\lambda$ depends on something *other* than the state's own outcome (e.g., the probability of the catastrophe, or the outcomes of *other* states), the model satisfies the **Independence Axiom** and is indistinguishable from standard EUT with a specific utility shape.

  **When is it NOT reducible?**
  The structure becomes distinct from EUT only if:
  1.  **Non-Separability:** The scaling of state $s$ depends on the probability mass of *all* catastrophic states (e.g., "if total probability of ruin > 5%, penalize all ruin states more").
  2.  **Endogenous Threshold:** The threshold $T$ shifts depending on the lottery offered (e.g., $T$ is the Certainty Equivalent, as in Disappointment Aversion).

  Assuming your description holds (fixed $T$, state-wise scaling), you are describing **EUT with a piecewise utility function.**

  ---

  ### 2. Distinction from Standard Frameworks

  Even if we accept the "process" distinction, here is how this rule differs from the major non-EUT frameworks in terms of behavioral implications.

  #### vs. Prospect Theory (PT)
  *   **PT Mechanism:** Distorts **probabilities** ($w(p)$) and evaluates gains/losses relative to a reference point ($v(x)$). Probability weighting is typically inverse-S shaped (overweighting small probabilities).
  *   **Your Rule:** Keeps probabilities linear ($p_s$). Distorts the **utility magnitude** conditional on a threshold.
  *   **Key Difference:** PT predicts agents will overweight a 1% chance of catastrophe (making them risk-seeking in losses or extremely risk-averse depending on framing). Your rule treats the 1% probability linearly but heavily discounts the *utility* of the catastrophic outcome.
      *   *Implication:* Your rule does not capture the "possibility effect" (panic over tiny probabilities of ruin) unless the scaling function $\lambda$ approaches 0 asymptotically.

  #### vs. Rank-Dependent Utility (RDU)
  *   **RDU Mechanism:** Weights probabilities based on the **rank** of the outcome (cumulative probability).
  *   **Your Rule:** Weights outcomes based on **absolute value** relative to $T$.
  *   **Key Difference:** In RDU, a "catastrophic" outcome is defined by being the *worst* outcome in the set. In your rule, an outcome is catastrophic if it falls below $T$, regardless of whether it is the worst outcome available.
      *   *Implication:* Your rule allows for "absolute safety" standards. RDU only allows for "relative safety" (avoiding the bottom rank).

  #### vs. Ambiguity Aversion (Maxmin / Smooth Ambiguity)
  *   **Ambiguity Mechanism:** Responds to **unknown probabilities**.
  *   **Your Rule:** Explicitly uses "state probabilities" (implying Risk, not Ambiguity).
  *   **Key Difference:** Your rule is silent on ambiguity. An agent using your rule would treat a known 10% risk of ruin identically to an ambiguous 10% risk of ruin (unless the protocol specifies adjusting $p_s$ under ambiguity).

  ---

  ### 3. Closest Established Concepts

  While your specific "two-layer" phrasing is non-standard, the mathematical object aligns with three established concepts:

  1.  **Lower Partial Moments (LPM):**
      In finance, downside risk is often measured as $LPM_n(T) = \sum p_s \cdot \max(0, T - x_s)^n$. Your scaling factor acts similarly to an LPM penalty. If $\lambda(x, T)$ is linear in distance, you are effectively optimizing a combination of Expected Utility and Semivariance.

  2.  **Safety-First Principles (Roy, 1952; Telser, 1955):**
      These rules prioritize minimizing $P(x < T)$. Your rule is a "soft" Safety-First constraint. Instead of a hard constraint ($P(x<T) \le \alpha$), you apply a continuous penalty.

  3.  **Disappointment Aversion (Gul, 1991):**
      Gul's model penalizes outcomes that fall below the *Certainty Equivalent* of the lottery. Your model is structurally identical but uses an **exogenous threshold** $T$ rather than an endogenous one. This is sometimes called **Reference-Dependent Utility with Fixed Reference**.

  ---

  ### 4. Axiomatic Commitments and Boundary Cases

  If you formalize this rule, you must be aware of the axioms it commits you to.

  **Axiomatic Commitments (Assuming Fixed $T$):**
  *   **Completeness & Transitivity:** Satisfied.
  *   **Continuity:** Satisfied (assuming $\lambda$ and $u$ are continuous).
  *   **Independence:** **Satisfied.** Because the valuation is linear in probabilities ($\sum p_s \dots$), mixing two lotteries $L$ and $M$ will yield a valuation that is the same mixture of their values.
      *   *Critique:* If you claim this model explains behavior that violates Independence (e.g., Allais Paradox), you are mistaken. This model *cannot* explain Allais-type violations because it is mathematically EUT.
  *   **Monotonicity:** Satisfied.

  **Boundary Cases:**
  1.  **$\lambda(x, T) = 1 \, \forall x$:** Reduces to standard **Expected Utility Theory** with concave $u$.
  2.  **$u(x) = x$ (Linear) + Step Function $\lambda$:** If $\lambda = 0$ for $x < T$ and $1$ for $x \ge T$, this reduces to **Maximize Probability of Survival** (Telser's Safety-First).
  3.  **$\lambda \to 0$ for $x < T$:** Approaches **Lexicographic Safety-First** (avoid ruin at all costs, then maximize expectation).

  ### 5. Recommendation for Characterization

  If you are writing a protocol or paper, do not claim this is a new *decision theory*. It is a specific *utility specification* within EUT.

  **Suggested Terminology:**
  > "Threshold-Weighted Expected Utility" or "Piecewise Downside-Sensitive Utility."

  **How to frame the "Two-Layer" aspect without error:**
  > "While representationally equivalent to a piecewise utility function within the Expected Utility framework, the protocol distinguishes between *standard risk aversion* (concavity of $u$) and *catastrophe aversion* (the scaling factor $\lambda$) to allow for separate calibration of routine volatility versus tail-risk tolerance."

  This acknowledges the mathematical reducibility while preserving the operational utility of your distinction (i.e., it is easier for risk managers to tune a "catastrophe knob" separately from a "risk aversion knob," even if they mathematically merge in the final calculation).

  ### Summary of Push Back
  1.  **Mathematical Reality:** If $\lambda$ depends only on $x$, this **is** EUT. It does not violate Independence. It cannot explain probability weighting effects (like overweighting small probabilities).
  2.  **Conceptual Error:** Claiming it "cannot be collapsed" is false regarding representation. It is only true regarding cognitive process.
  3.  **Differentiation:** It differs from Prospect Theory because it does not distort probabilities. It differs from RDU because it uses an absolute threshold, not ranks.

  If your intention is to capture behavior where agents treat probabilities non-linearly (e.g., panicking over 0.01% ruin risk), this model is insufficient. You would need to introduce probability weighting ($w(p)$) to capture that, moving you toward Prospect Theory or Dual Theory. If your intention is simply to penalize tail outcomes more heavily than standard concavity allows, your model is sufficient but should be recognized as a specific utility function within the EUT family.
