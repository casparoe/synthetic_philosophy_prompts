answer: |-
  Listen. Your obligation does not weaken. It becomes the only thing keeping him standing. That is the bottom line.

  You are thinking about this like a trade. Like if he cannot give you a smile or a nod, the account is closed. That is shopkeeper thinking, not family thinking. When a child is born, does the mother say, "I will only feed you when you can cook for me"? No. When the leg is broken, does the body cut it off because it cannot walk? The body carries the leg. Now, you are the body. He is the leg. You carry him.

  The doctors talk about dignity like it is a light bulb inside the head. If the wiring breaks, they say the light is gone. That is why they do not understand. They look at the skull and see silence. We look at the circle and see where the silence fits.

  You asked about the ancestors. You are right to ask, but you are looking at them like they are guests waiting to be invited. They are not guests. They are the foundation. When his eyes close to you, they do not close to them. His personhood is not just in the breath he takes today. It is in the name he was given, the soil his father walked on, the stories we tell about him before he was even hurt. Those things do not vanish because the brain is damaged.

  So when you are tired, and you cannot find the strength to recognize him for one more day, know that the ground beneath his bed is holding him. The ones who went before are holding his place in the line. You are not holding his personhood alone, like a heavy box. You are just the one standing closest to the bed right now.

  Stop reading those books. They take our way of living, put it in a box, and sell it back to you as a theory. They talk about relation like it is a rope between two living people. They forget the rope goes down into the earth and up into the sky.

  Your brother is still here. Not because his neurons are firing. But because you are sitting in that chair. Because we are still saying his name. Do not ask if he is still a person. Ask if you are still being a brother. That is the only question you have power over. Now, put the papers down and go wash his face.
