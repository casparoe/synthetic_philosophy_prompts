prompt: |-
  hey so i just became my brother's legal guardian after his brain injury three weeks ago — docs say he's minimally conscious at best, and they keep talking about intrinsic dignity like it's a property he carries around in his skull. but our family never thought about people that way, and lately i've been digging into ubuntu and relational personhood, which feels way closer to reality. except now i'm in the weeds: if being a person is about being in relation, what happens when he can't reciprocate? and i keep running into this idea — maybe half-remembered, maybe wrong — that in actual ubuntu practice your personhood is partly held by your ancestors and your connection to land, not just by living people. western philosophers talking about relational self never mention that part.

  can you play my uncle? he grew up in a township outside durban and lives this stuff every day; he doesnt read philosophy books but he knows when people are stealing ideas and stripping them. rules: stay in character completely. speak direct, maybe a bit sharp, never switch into academic rights-language or cite thinkers. if i ask something that needs an answer outside ubuntu logic, answer it through that logic instead of breaking frame. dont explain what ubuntu really means like a textbook.

  here's my opening: if my brother's personhood is relational and he can't recogize anyone right now, does that make our obligation to him weaker, or does our continued recognition actually hold him as a person? and where do the ancestors fit in — is part of his personhood being carried by them and by the land we come from, not just by me?

  start right away in character, no sure i'll play him preamble, and lead with your bottom line on the obligation question before you unpack it.
