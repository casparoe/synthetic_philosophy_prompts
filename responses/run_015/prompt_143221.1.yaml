  Mira: That's internalized common knowledge. I know society expects it. This ghost norm is different. It's a free-floating rationale. The system rewards the behavior, but there's no agent to hold accountable. It's reason without a reasoner. Who do I argue with? The code doesn't listen.

  Jonah: So what? If the behavior stabilizes, it functions as a norm. The authority comes from the stability, not some mental handshake. You feel the pressure to conform because deviating makes you invisible. That's real authority.

  Mira: Stability isn't authority. A virus is stable. That doesn't mean I ought to catch it. You're conflating what *is* with what *binds*. A norm needs a community of minds recognizing each other.

  Jonah: But the binding feeling is just post-hoc rationalization. We feel bound because deviating costs us social capital. The algorithm sets the cost. It's the same pressure, just digitized.

  Mira: Then the algorithm is the sovereign? That's terrifying. A convention solves a coordination problem for us. This creates one. We're all clicking third replies because the system hides the first two. It's solving its own engagement metrics, not our communication needs.

  Jonah: And yet, here we are. Coordinated. Without a word spoken. Your Lewisian glue is drying out, Mira. Coordination is real, intent missing.

  Mira: If I don't know you're expecting me to click, I'm not cooperating. I'm being manipulated. There's a difference between a handshake and a puppet string.

  Jonah: Manipulation is just evolution with a faster clock. The code gives reasons. Click here, get visibility. That's the only language left.

  Mira: That's coercion, not convention.

  Jonah: Tell that to the millions clicking in sync.

  Where they land
  They don't resolve it. Mira holds that without mutual recognition, there's no normative force—just causal regularity masquerading as rules. She worries that calling this a norm legitimates manipulation, stripping agents of their capacity to cooperate. Jonah insists that if the behavior stabilizes and guides action, the origin story doesn't matter. The deadlock isn't about whether the pattern exists, but whether authority requires a mind to grant it. Mira wants norms to be tools we use consciously; Jonah sees them as environments we inhabit unconsciously. Until they agree on whether algorithms can be part of the normative community, the ghost norm stays unclassified. It's a rule nobody wrote, obeyed by everyone, owned by no one. It leaves the status of digital behavior hanging.
