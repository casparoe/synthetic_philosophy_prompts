  2. The Agent: Fragmented Agency (Engineers vs. Managers).
  3. The Chance: Frequencies as Chances.
  4. The Violation: Credence vs. Chance.
  5. Institutional PP: Group Belief problems.
  6. The Twist: Accessibility and Suppression.
  7. Conclusion: PP needs institutional scaffolding.

