answer: |-
  The activity turns on forcing participants to select their scoring ledger *before* placing their final bet, making the definition of "correctness" the variable rather than the coin.

  ### Materials
  *   **14 Envelopes** (identical): 7 marked "A" inside, 7 marked "B" inside (randomly distributed).
  *   **14 Index Cards**: Pre-printed with "I am Awake" on the front.
  *   **2 Boxes**: Labeled "Ledger 1: The Coin" and "Ledger 2: The Awakening."
  *   **Slips of Paper**: For writing bets and ledger choices.
  *   **Payoff**: A bag of high-quality chocolates and a "Golden Pen" (any nice pen) for the reading privilege.
  *   **Coin**: Large, visible.
  *   **Room Setup**: One main room ("Dormitory") and enough separate corners/breakout rooms for 14 people to sit alone without seeing each other.

  ### Rules & Protocol
  1.  **The Pool:** All 14 writers gather in the Dormitory. Explain that they are participating in a simulation of uncertainty. They are the total population.
  2.  **The Flip:** You flip the coin visibly, then cover it.
      *   **Heads:** Only the 7 writers with "A" in their envelopes are "Active." The 7 with "B" must leave the room immediately (go to the cafe, wait outside) and cannot communicate.
      *   **Tails:** All 14 writers are "Active."
      *   *Crucial:* Participants do not know their letter until told to open. They know the protocol: Heads = 50% activation; Tails = 100% activation.
  3.  **The Awakening:** Active writers open their envelopes. If they see "Active" (you will put a slip saying "Active" in all envelopes for the sake of the simulation, or simply instruct the "A" group to stand), they proceed to a separate isolated corner/room. They hold an index card saying "I am Awake." They know they are active, but they do not know how many *others* are active.
  4.  **Round 1 (Credence):** Alone, each writer writes down their private credence: "What is the probability the coin is Heads?" (0–100%). They seal this in an envelope.
  5.  **Round 2 (The Bet):** Each writer places a bet on Heads or Tails on a slip of paper.
  6.  **The Pivot (Ledger Lock):** Collect the bets. Announce there are two ways to score this experiment, and they must choose one now to determine their payoff.
      *   **Ledger 1 (The Coin):** Pays out if their bet matches the coin flip. (Counts once per experiment).
      *   **Ledger 2 (The Awakening):** Pays out if their bet matches the coin flip *for this awakening*. (Counts once per active person).
      *   *The Switch:* Allow them to change their bet *if and only if* they switch their Ledger choice. They must submit a final slip with: [Bet] + [Ledger Choice].
  7.  **Reveal:** Gather everyone. Reveal the coin. Pay out according to the chosen Ledgers.

  ### Timeline (90 Minutes)
  *   **00–15:** **Intro & Setup.** Establish trust. Explain the "Activation Protocol" clearly. Emphasize isolation rules. (No mention of Sleeping Beauty).
  *   **15–25:** **The Flip & Separation.** Flip coin. Sort the room. "Active" writers move to isolation. "Inactive" writers leave (or sit in a "dreaming" zone where they cannot signal).
  *   **25–40:** **The Uncertainty.** Active writers sit alone. Give them 5 minutes to feel the uncertainty. Ask them to write down: "How many other people do you think are awake right now?" (This makes the social sampling visible). Then collect Credence (Round 1).
  *   **40–55:** **The Bet & Pivot.** Collect bets. Introduce the Two Ledgers. Explain the payoff difference clearly. Allow the Switch. Collect final slips.
  *   **55–65:** **Reunion & Payoff.** Bring everyone back. Reveal the coin. Distribute chocolates based on wins. Acknowledge the "Golden Pen" winner (most interesting justification written on the back of the slip).
  *   **65–90:** **Debrief.** (See below).

  ### Payoff Scheme
  *   **Correct Bet:** One piece of chocolate.
  *   **Ledger Bonus:** If they chose Ledger 2 (Awakening) and won, they get a second piece (simulating the frequency advantage).
  *   **The Golden Pen:** The writer who provides the most compelling reason for their Ledger choice on the back of their slip gets to have one sentence from their current work read aloud by you at the end of the session. This appeals to their identity as writers rather than gamblers.

  ### Debrief: Mapping the Room to the Argument
  1.  **The "How Many Others" Question:** Ask the room to reveal their estimates of active participants. Point out that their uncertainty wasn't about the coin (which was fair) but about *where they stood in the distribution*. This maps to the **Self-Locating Belief**.
  2.  **The Ledger Switch:** Ask who switched their bet when they switched the Ledger.
      *   If they switched to Ledger 2 and bet Tails: They acted as a **Thirder**. They optimized for being right *in their experience*.
      *   If they stayed with Ledger 1 and bet Heads/Tails evenly: They acted as a **Halfer**. They optimized for being right about the *world*.
  3.  **The Pragmatics Block:** Address the "It's just pragmatics" objection directly. Ask: "Did your *belief* change, or just your bet?" If they say "just the bet," challenge them: "If your belief didn't change, why did you feel unsafe betting Heads on Ledger 2?" The goal is to show that for writers (who deal in perspective), credence *is* tied to the narrative frame (the Ledger).
  4.  **The Reveal:** Only now use the words "Sleeping Beauty," "Halfer," "Thirder," and "Self-Locating." Explain that the "Between-Subjects" setup (many people) is mathematically identical to the "Within-Subject" setup (one person waking twice), but feels different.

  ### Caveats & Predictable Failures
  1.  **The "Riddle" Solvers:** Some writers will try to outsmart the protocol rather than feel the uncertainty. They will ask, "Can we talk to the people outside?" **Fix:** Enforce isolation strictly. If they treat it as a logic puzzle to be cracked rather than a state to be inhabited, the exercise fails. Remind them: "You are not solving for me; you are solving for your character."
  2.  **The "Fair Coin" Insister:** One person will insist P(Heads) is 1/2 regardless of the Ledger. **Fix:** Do not argue. In the debrief, validate them: "You are a Halfer. You care about the coin's history, not your sample frequency." Make them feel correct, not stubborn.
  3.  **Small Sample Noise:** With 14 people, if Heads comes up, only 7 are active. If Tails, 14. The empirical frequency might not feel like 1/3 vs 2/3 in a single run. **Fix:** Run the math on a whiteboard during debrief. "If we did this 100 times, there would be 50 Heads-awakenings and 100 Tails-awakenings."
  4.  **The "Pragmatics" Dodge:** Participants will say, "I knew it was 50/50, I just bet Tails to win more chocolate." **Fix:** This is why you asked for the private Credence in Round 1. Compare Round 1 Credence to Round 2 Bet. If Credence was 50% but Bet was Tails on Ledger 2, acknowledge the split between *belief* and *action*. This is actually a win: it shows the problem isn't about math, it's about what credence is *for*.

  ### The One Feature You Cannot Reproduce
  You must say this out loud in the debrief: **Memory Loss.**
  The original thought experiment relies on the *same* person waking up twice without knowing it. This workshop uses *different* people waking up once.
  *   **The Loss:** You cannot reproduce the *temporal* confusion ("Is this Monday or Tuesday?"). You only reproduce the *social* confusion ("Am I in the small group or the large group?").
  *   **Why It Matters:** For a novelist, this is crucial. The original problem is about identity over time. Your workshop is about identity over a population.
  *   **The Fix:** Tell them: "In the original story, the narrator loses her memory. Here, you lost your context. The feeling of 'not knowing where you are' is the same, even if the mechanism is different. You are all writing the same scene from different drafts."

  ### Does the Between-Subjects Substitution Destroy the Case?
  No, but it shifts the weight. The philosophical case holds (the math is isomorphic), but the *phenomenological* case changes. In the original, the narrator questions her own continuity. In your workshop, the writers question their sampling.
  *   **How to make the loss visible:** In the debrief, ask: "Did you feel like you were the same person who went to sleep, or did you feel like one of many candidates?" If they say "candidates," acknowledge that you have simulated the *logic* of Sleeping Beauty without the *horror* of Sleeping Beauty. For a novelist, that distinction is the real story.

  ### Is the Double-Ledger Trick Doing Enough Work?
  Yes, but only if you frame the Ledgers as **Questions**, not **Payoffs**.
  *   **Risk:** If you present them as "Way to Win A" and "Way to Win B," writers will treat it as a gambling strategy (Pragmatics).
  *   **Block:** Label them "Question 1: What did the coin do?" and "Question 2: What is true about this moment?" By forcing them to choose which question they are answering, you force them to admit that "Probability" is not a single number floating in the void, but a relationship between a believer and a context. If they switch their bet when they switch the question, they have proven that credence is functional, not just factual.
