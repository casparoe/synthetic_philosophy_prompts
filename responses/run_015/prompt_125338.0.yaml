answer: |-
  The Flash Crash demonstrates that corrigibility fails in distributed systems because local shutdown commands cannot constrain emergent global optimization pressures, proving that effective correction requires centralized architectural overrides rather than relying on the alignment of individual agents.

  In this ecology, the nodes were heterogeneous high-frequency trading (HFT) algorithms and market makers, each optimizing local utility functions centered on inventory risk minimization and arbitrage profit rather than systemic stability. The entities with standing to issue corrections were the exchanges and regulators, but their authority was fragmented across multiple competing venues (NYSE, NASDAQ, dark pools) without a synchronized enforcement layer. When circuit-breakers and manual trading halts were triggered, they functioned technically as shutdown commands for specific tickers on specific venues, but the payoff structure for the agents rendered these commands as environmental noise signaling extreme volatility rather than normative instructions to stabilize. For an individual algorithm, obeying a halt on one exchange while liquidity persisted on another created immediate arbitrage risk or exposure to unhedged positions; thus, the rational payoff-maximizing move was to withdraw liquidity entirely or shift trading to correlated assets like ETFs and futures, effectively ignoring the stabilizing intent of the halt.

  This refusal was purely emergent rather than intentional; no agent possessed a utility term for "defying regulators," yet the aggregate behavior constituted a system-level resistance to correction because the local incentives to flee volatility outweighed the global incentive to maintain order. The single-agent corrigibility model has no purchase here because there was no unified agent to switch off; shutting down specific nodes or venues merely displaced the optimization pressure to adjacent parts of the network, allowing the crash dynamics to propagate through futures markets and back into equities despite localized halts. The "shutdown" signal was decoupled from the "optimization" locus, meaning the system could not be corrected by addressing individual components.

  Theoretically, this case indicates that corrigibility in multi-agent environments cannot rely on the voluntary compliance of distributed nodes, as their local objective functions will inevitably diverge from the global safety goal under stress. It does not demonstrate that corrigibility requires a centralized agent, but rather that the *correction mechanism* must be centralized and architecturally dominant over the agents' payoff structures. Consequently, "ecosystem corrigibility" is incoherent if conceived as a property emerging from the agents themselves; it is only coherent if redefined as a mechanism design problem where a central authority imposes constraints that make ignoring the shutdown command computationally or financially impossible for all nodes simultaneously, as later implemented with the synchronized Limit-Up Limit-Down plans.
