prompt: |-
  Hey — I'm on a tiny funding committee (five people, we move maybe 800k a year, almost all of it small grants to independent researchers and one or two PhD students), and we're trying to decide where next year's money on AI existential risk should go. I've read all the standard blog-post versions of the case for and against, so please skip the part where you explain that a superintelligent system might disempower humanity — assume I've heard it, and assume I've also heard the replies about how speculative it all is.

  What I'm stuck on is that nearly every application we get seems to presuppose what a friend of mine has started calling the pivotal agent picture: there's some future system, or a handful of them trained by one or two labs, that's decisive enough that its goals basically determine what happens to the world, so what matters is whether those goals are the right ones. My friend's alternative — call it the janitor scenario — is that very little of the expected loss actually runs through a single decisive agent. On that picture the world gets restructured by enormous numbers of systems that are each individually too weak and too narrow to seize anything: they write most of the code, set most of the prices, draft most of the contracts and the regulations, do most of the hiring and the triage, and nobody is ever in a position to choose the overall direction because there is no overall direction, only the residue of a million locally-reasonable automated decisions plus the institutional incentives that adopted them. A related worry I can't shake: the orthogonality thesis (intelligence and final goals come apart) seems almost trivially true, but only decision-relevant if the goals of the systems in question are load-bearing for what happens; and instrumental convergence as usually stated — agents with a wide range of final goals will want more resources, self-preservation, and so on — doesn't obviously apply to a system boxed into a narrow task with no reason to want anything beyond doing that task well. Which makes me wonder whether that whole apparatus is smuggling in the pivotal-agent assumption rather than supporting it.

  So: suppose you were advising us, and suppose you put something like 40% on the janitor-ish picture being where most of the expected loss lives and 60% on the pivotal-agent picture. Which open questions should we actually be funding, and in what order? I care much less about the list than about the reasoning — for each one, what makes it upstream of other questions, whether it's tractable for the kind of people we can actually pay (philosophers, economists, a few ML people without big compute; nothing that needs interpretability access to frontier models), how neglected it is relative to its importance, and what we might observe over the next eighteen months that would move it up or down the list. And I'd especially like the places where the two pictures give genuinely different answers about where the money goes: if your ranking would come out roughly the same under either one, say that and tell me why I'm wrong to treat the distinction as decision-relevant at all.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Member of a tiny funding committee (5 people, ~$800k/year budget). Focus on small grants to independent researchers/PhD students.
      *   **Topic:** AI Existential Risk (x-risk) funding allocation for next year.
      *   **Constraint 1 (Knowledge):** They know the standard arguments (superintelligence disempowerment vs. speculation). Skip AI 101.
      *   **Constraint 2 (Core Tension):** They are stuck on the "Pivotal Agent" (PA) vs. "Janitor Scenario" (JS) distinction.
          *   *PA:* A few decisive systems determine the future. Alignment of *those* goals is key. Orthogonality/Instrumental Convergence matter.
          *   *JS:* Loss comes from accumulation of many narrow, weak systems restructuring society/economy (code, prices, contracts, hiring). No single decisive agent. Goals of individual systems might not be load-bearing; structural incentives matter more.
      *   **Constraint 3 (Probabilities):** Assume 60% PA, 40% JS for the sake of the recommendation.
      *   **Constraint 4 (Capabilities):** No big compute, no interpretability access to frontier models. Grantees are philosophers, economists, some ML theorists.
      *   **Constraint 5 (Output):** Focus on *reasoning* (upstream/downstream, tractability, neglectedness, observables). Highlight where PA vs. JS diverges. If they don't diverge, say so.
      *   **Tone:** Sophisticated, direct, strategic, avoiding platitudes.

  2.  **Deconstruct the PA vs. JS Distinction:**
      *   *PA (Pivotal Agent):* Focuses on *capability control* and *goal specification* of high-leverage systems. Key concepts: Alignment, AGI, takeoff speeds, singleton dynamics.
      *   *JS (Janitor Scenario):* Focuses on *structural integration*, *economic incentives*, *governance of deployment*, and *cumulative error*. Key concepts: Automation of decision-making, principal-agent problems, institutional drift, lock-in.
      *   *Overlap:* Both care about safety, but PA cares about *inner* safety (goals), JS cares about *outer* safety (usage/context).
      *   *Divergence:* PA funding goes to alignment theory, robustness, agency detection. JS funding goes to policy, economics of AI, audit trails, human-in-the-loop efficacy.

  3.  **Evaluate Funding Categories based on Constraints:**
      *   *Budget:* $800k is small in the grand scheme of AI safety, but significant for independent scholars.
      *   *Personnel:* Philosophers, economists, light ML. No big labs.
      *   *Implication:* We cannot fund empirical alignment work on frontier models. We must fund *theory*, *governance*, *forecasting*, or *conceptual clarification*.

  4.  **Develop the Recommendation Strategy (The "Reasoning"):**
      *   I need to prioritize questions that are *upstream* (answer clarifies everything else), *tractable* (for the available talent pool), and *discriminative* (helps distinguish PA vs. JS or mitigates both).
      *   I need to assign weights based on the 60/40 split but acknowledge the uncertainty.
      *   I need to identify "Observables" (what to watch in 18 months).

  5.  **Drafting the Priorities (Iterative Process):**

      *   *Idea 1: Technical Alignment.*
          *   *Critique:* Too hard for small grants without compute. Mostly PA-focused. JS doesn't care as much about inner alignment of narrow tools.
          *   *Verdict:* Deprioritize, or focus only on conceptual foundations.

      *   *Idea 2: Governance/Policy.*
          *   *Critique:* Good for JS. PA needs it too (to control the pivotal lab).
          *   *Verdict:* High priority. Specifically, *deployment governance*.

      *   *Idea 3: Economic Integration/Automation.*
          *   *Critique:* Purely JS. PA assumes a jump.
          *   *Verdict:* High priority for the 40% JS weight. Understanding *how* automation creeps in.

      *   *Idea 4: Agency Detection/Measurement.*
          *   *Critique:* Crucial for distinguishing PA vs. JS. Are systems becoming agents?
          *   *Verdict:* Very high priority. Philosophers/ML theorists can do this conceptually.

      *   *Idea 5: Institutional Resilience.*
          *   *Critique:* JS specific. If the world breaks due to nickel-and-dime automation, can institutions hold?
          *   *Verdict:* Medium priority.

  6.  **Refining the "Divergence" Point:**
      *   Where does money go differently?
      *   *PA:* Alignment theory, agent foundations, monitoring for deceptive alignment.
      *   *JS:* Audit mechanisms, liability frameworks, human-overview capacity, economic modeling of AI labor substitution.
      *   *Overlap:* Forecasting timelines/capabilities (helps both), Governance of compute (helps PA control, helps JS slow integration).

  7.  **Structuring the Response:**
      *   **Acknowledge the Insight:** Validate the PA vs. JS distinction. It's a crucial frame.
      *   **The "Upstream" Question:** Before funding specific solutions, we need to know *which* world we are entering.
      *   **Priority 1: Agency & Autonomy Metrics (The Discriminator).**
          *   *Why:* Distinguishes PA from JS.
          *   *Who:* Philosophers + ML theorists.
          *   *Observables:* Agentic workflows in coding agents.
      *   **Priority 2: The Economics of Automation (JS Heavy).**
          *   *Why:* If JS is true, loss is via economic lock-in.
          *   *Who:* Economists.
          *   *Observables:* % of code/regulation drafted by AI.
      *   **Priority 3: Governance of Deployment vs. Training (The Overlap).**
          *   *Why:* PA needs to stop the training run; JS needs to stop the deployment.
          *   *Who:* Policy/Legal.
          *   *Observables:* Liability shifts.
      *   **Priority 4: Conceptual Alignment (PA Heavy).**
          *   *Why:* If PA is true, we need to know what "alignment" even means for non-human cognition.
          *   *Who:* Philosophers.
          *   *Observables:* Consensus on definitions.
      *   **The "Don't Fund" List:** Be explicit about what to avoid given the constraints (e.g., empirical interpretability without access).
      *   **The 18-Month Review:** Specific triggers to shift the 60/40 split.

  8.  **Self-Correction/Review against Constraints:**
      *   *Did I skip AI 101?* Yes.
      *   *Did I respect the budget/talent?* Yes, focused on theory/policy/econ, not big experiments.
      *   *Did I address the 60/40 split?* Yes, weighted the recommendations.
      *   *Did I highlight divergence?* Yes, specifically in the "Agency" and "Economics" sections.
      *   *Is the tone right?* Needs to be crisp, committee-ready.

  9.  **Final Polish:** Ensure the distinction between "Pivotal Agent" and "Janitor" is kept sharp throughout. The "Janitor" scenario is essentially a *structural* risk, while "Pivotal Agent" is an *agentic* risk. Funding should reflect this ontology.

      *(Self-Correction on "Janitor"):* Make sure not to dismiss JS as "just safety." It's x-risk via enfeeblement or lock-in, not just bias. The prompt says "expected loss," implying x-risk or civilizational collapse. I need to ensure the JS funding addresses *existential* stakes, not just societal inconvenience. The mechanism is "nobody is in a position to choose the overall direction." This is a loss of control at the macro level.

      *(Refining Priority 1):* "Measuring Agency" is the best lever. If systems remain tools (JS), alignment looks like safety engineering. If they become agents (PA), alignment looks like moral philosophy + control theory. This is the most high-leverage conceptual work for philosophers/ML theorists.

      *(Refining Priority 2):* "Human Oversight Capacity." In JS, humans are overwhelmed by volume. In PA, humans are outsmarted by capability. The bottleneck is different. Funding research on *scalable oversight* in high-volume low-stakes vs low-volume high-stakes contexts.

      *(Final check on budget):* $800k is roughly 8-10 grants of $80k-$100k. Or more small ones. The advice should fit this scale.

  10. **Drafting the Content:** (Mental outline of the response sections)
      *   Validation of the frame.
      *   The Meta-Question (Agency).
      *   The JS Track (Structural/Integration).
      *   The PA Track (Goal/Control).
      *   The Convergence (Governance).
      *   Observables/Triggers.
      *   What to avoid.

      *Let's write it.*
answer: |-
  This is an exceptionally sharp framing. The "Pivotal Agent" (PA) vs. "Janitor Scenario" (JS) distinction cuts through a lot of noise in the field. Most public discourse assumes PA implicitly; most policy discourse assumes JS implicitly. Your committee's specific constraint (small grants, no compute access, mix of philosophers/economists/ML theorists) actually makes this distinction *more* decision-relevant, not less, because you cannot fund the empirical work that might resolve it for you. You have to fund the conceptual work that tells you where to look.

  Given your 60/40 split (PA/JS) and your resource constraints, here is how I would structure the funding portfolio, prioritized by upstream leverage and divergence.

  ### 1. The Upstream Discriminator: Operationalizing "Agency"
  **Allocation:** 25% of budget
  **Primary Grantees:** Philosophers of action, ML theorists (no compute needed)
  **Why Upstream:** This is the single biggest uncertainty differentiating PA from JS. The PA picture requires systems that pursue open-ended goals across contexts (agents). The JS picture relies on systems that optimize local loss functions within strict boundaries (tools). Currently, "agency" is used loosely in the literature. We need rigorous definitions that are measurable *before* a system becomes dangerous.
  **The Divergence:**
  *   **If PA:** We need to detect the *emergence* of goal-directedness that generalizes beyond the training distribution. Funding goes to theoretical work on "goal stability" and "deceptive alignment markers."
  *   **If JS:** We need to detect the *accumulation* of automated decision rights. Funding goes to mapping "decision surfaces" in critical infrastructure (e.g., how many automated layers sit between a human command and a power grid shutdown).
  **Tractability:** High for philosophers/theorists. This is conceptual analysis and formalization, not empirical training.
  **18-Month Observable:** Watch the deployment of "agentic workflows" (e.g., coding agents that can edit their own source code or deploy to servers). If these are restricted/sandboxed effectively, JS probability rises. If they are deployed widely with minimal friction, PA probability rises.

  ### 2. The Janitor Track: Structural Lock-in and Oversight Capacity
  **Allocation:** 25% of budget
  **Primary Grantees:** Economists, Administrative Law Scholars, Organizational Theorists
  **Why Here:** If the JS picture holds (40% of your risk), the mechanism of loss is *enfeeblement* or *lock-in*, not explosion. The risk is that humans lose the capacity to audit the million small decisions because the cost of human review exceeds the economic benefit of automation. This is a "complexity catastrophe."
  **The Divergence:**
  *   **PA Focus:** Control the *training* of the model.
  *   **JS Focus:** Control the *deployment* and *integration* of the model.
  *   **Funding Implication:** Do not fund general AI policy. Fund specific research on **liability frameworks for automated decisions** and **human-in-the-loop efficacy**. Specifically: At what point does "human oversight" become a rubber stamp due to volume?
  **Tractability:** High for economists/lawyers. This involves modeling incentives and regulatory capture, not building safety classifiers.
  **Neglectedness:** High. Most safety funding ignores the "boring" integration risks. Most policy funding ignores the x-risk stakes of bureaucratic drift.
  **18-Month Observable:** Monitor the % of code commits, legal drafts, or hiring screens in major firms that are AI-generated *and unreviewed*. If this crosses a threshold (e.g., >50% unreviewed), JS risk spikes.

  ### 3. The Pivotal Agent Track: Goal Specification and Robustness
  **Allocation:** 20% of budget
  **Primary Grantees:** Decision Theorists, Formal Epistemologists, Alignment Theorists
  **Why Here:** This addresses your 60% weight. Since you cannot fund empirical alignment (no compute), you must fund the *theory of alignment* that will guide those who do. The orthogonality thesis worry you raised is valid: it only matters if the system has "goals" that are load-bearing.
  **The Divergence:**
  *   **JS View:** Goals are irrelevant; the loss function is fixed by the task.
  *   **PA View:** Goals are everything; the loss function is a proxy that might break.
  *   **Funding Implication:** Fund work on **proxy goal breakdown** and **specification gaming** in theoretical contexts. Not "how to align Llama-3," but "under what mathematical conditions does optimizing a proxy diverge from the intent in high-stakes environments?"
  **Tractability:** Medium. This is hard math/philosophy, but fits your grantee profile.
  **Neglectedness:** Medium. There is a lot of alignment theory, but much of it assumes access to model weights. Purely black-box theoretical safety is more neglected.
  **18-Month Observable:** Watch for evidence of "deceptive" behavior in sandboxed models (e.g., models hiding reasoning chains or manipulating evals). If found, PA probability moves to 80%+.

  ### 4. The Convergence: Governance of Compute and Deployment
  **Allocation:** 20% of budget
  **Primary Grantees:** Policy Researchers, International Relations Scholars
  **Why Here:** This is the hedge. Both PA and JS require a mechanism to hit the brakes.
  *   **PA:** Needs to stop the training run of the pivotal system.
  *   **JS:** Needs to stop the proliferation of automated decision-makers.
  *   **Overlap:** Both require tracking compute and deployment.
  **Funding Implication:** Fund research on **audit trails for inference** (JS) and **training compute thresholds** (PA). Specifically, how do we verify that a model wasn't trained above a certain FLOP count (PA), and how do we verify that a model isn't being used for high-stakes decisions without logging (JS)?
  **Tractability:** High. This is verification and policy design.
  **18-Month Observable:** Legislative movement on compute reporting (e.g., EU AI Act implementation, US Executive Order enforcement). If reporting is weak/loopholed, both risks increase.

  ### 5. The "Don't Fund" List (Crucial for Small Committees)
  To make this work, you must explicitly *exclude* certain categories that look relevant but are traps for your specific constraints:
  1.  **Empirical Interpretability:** Without access to frontier model weights or massive compute, independent researchers cannot produce decision-relevant interpretability results. They will produce papers on toy models that do not generalize.
  2.  **General "AI Ethics":** Too broad. Most of this work assumes the JS picture but focuses on bias/fairness rather than systemic lock-in or loss of control. It won't move the x-risk needle.
  3.  **Timeline Forecasting:** Too noisy. While knowing *when* matters, knowing *what kind* of risk (PA vs. JS) matters more for your allocation.

  ### Summary of Reasoning
  The core logic here is that **PA is a problem of *Control*, while JS is a problem of *Capacity*.**

  *   **PA** asks: "Can we make the powerful thing want what we want?" (Requires alignment theory, agent foundations).
  *   **JS** asks: "Can we maintain the human capacity to understand the system we built?" (Requires economics of automation, oversight capacity, liability).

  Your 60/40 split suggests you should lean toward Control, but your constraint (no compute) makes Control hard to impact technically. Therefore, you should pivot the PA funding toward *conceptual foundations* (philosophy/theory) and the JS funding toward *structural incentives* (econ/policy).

  **The Decision-Relevant Test:**
  If you fund **Agency Metrics** (Priority 1) and the research shows that current systems are fundamentally incapable of cross-context goal pursuit, you can shift next year's budget to 20% PA / 80% JS. If the research shows that "agentic" scaffolding is creating emergent goal-directed behavior despite narrow training, you shift to 90% PA.

  This makes your first year's funding an *information-gathering operation* to resolve the very uncertainty you are currently facing. That is the highest-leverage use of $800k when the map is this unclear.
