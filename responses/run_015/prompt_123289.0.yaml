  First, Joint Agreed Claims

  1. We affirm that libertarian free will, requiring uncaused causal origination, is incompatible with the physicalist ontology supported by contemporary neuroscience.
  2. Human decision-making emerges from complex neural processes without a homuncular agent escaping causal chains, leading us to reject basic desert grounded in metaphysical ultimacy.
  3. We acknowledge that institutional punishment serves legitimate forward-looking functions: incapacitation, deterrence, and rehabilitation.
  4. We identify a phenomenon termed moral hysteresis, analogous to magnetic hysteresis in condensed-matter systems, describing the path-dependent persistence of blame attributions and punitive intuitions even after the causal and informational conditions originally justifying them have been updated or debunked.
  5. Just as a ferromagnet retains magnetization after the external field is removed, moral agents retain reactive attitudes despite accepting determinism.
  6. Both camps accept this operational definition as a descriptive tool for psychological and sociological inertia regarding responsibility practices.
  7. We concur that any viable theory of responsibility must account for this lag between intellectual acceptance of causal determinism and the emotional persistence of retributive instincts.
  8. This shared framework allows us to isolate precisely where our normative divergences lie regarding the retention or abolition of desert-based discourse.
  9. We further agree that the law currently operates with mixed signals, often invoking retributive language while pursuing consequentialist ends, thereby exacerbating this hysteresis effect.
  10. Both sides accept that moral hysteresis is not merely individual psychology but a systemic feature of legal institutions resistant to rapid conceptual change.
  11. We commit to evaluating responsibility practices based on their downstream effects rather than their alignment with pre-theoretical intuitions, recognizing that such intuitions are themselves subject to hysteresis and cannot serve as foundational evidence.
  12. This methodological commitment ensures our collaboration remains grounded in empirical reality rather than semantic maneuvering.
  13. We treat the hysteresis model as a predictive instrument for legal reform, acknowledging that changing statutes does not instantly reset public moral intuition.

  Second, Residual Disagreements

  | Compatibilist Revisionist | Abolitionist Incompatibilist |
  | :--- | :--- |
  | Reactive attitudes retain non-instrumental value as constitutive of meaningful interpersonal relationships. A revised notion of desert, grounded in reasons-responsiveness rather than metaphysical ultimacy, survives elimination. Moral hysteresis represents a manageable friction; institutional redesign should calibrate blame practices to maintain social cohesion while minimizing harm. We argue that retaining desert-talk, properly revised, aids moral education and reinforces normative expectations without requiring libertarian assumptions. The hysteresis loop can be narrowed through philosophical literacy, allowing society to keep the benefits of blame without the metaphysical baggage. We maintain that the persistence of blame is functional, not merely residual, serving as a stabilizing force for normative compliance. Consequently, we advocate for gradual reform that respects existing moral intuitions. | Reactive attitudes are purely instrumental and often inflict gratuitous suffering. No form of basic desert survives, not even revised definitions, as all rely on problematic notions of ultimate control. Moral hysteresis indicates a deep cognitive pathology; institutions must be redesigned to eliminate blame entirely, not merely calibrate it. We argue that retaining desert-talk inevitably resurrects retributive harms, obstructing the transition to a public-health model of safety and rehabilitation. The hysteresis loop demonstrates that blame is too sticky to be safely repurposed; only abolition prevents the relapse into retributivism. We maintain that the persistence of blame is a bug, not a feature, of moral cognition, requiring systemic excision. Consequently, we advocate for radical restructuring that prioritizes harm reduction over intuition. |

  Third, Cruxes and Predictive Cases

  Crux 1: The Necessity of Blame for Moral Development. We examine a juvenile diversion program replacing blame-attribution with causal-explanation therapy focusing on neural risk factors. The Compatibilist predicts participants will show weaker normative internalization and higher recidivism due to lack of accountability signaling. They argue blame functions as a necessary social signal for norm violation, essential for agency development. Without the sting of blame, moral learning is impaired. The Abolitionist predicts participants will show equal or better outcomes due to reduced stigma and increased therapeutic engagement. They argue blame functions as a traumatic obstacle to rehabilitation, inhibiting prosocial growth. Removing blame reduces defensiveness.

  Crux 2: The Decoupling of Language and Practice. We examine statutory reform removing retributive justification from sentencing guidelines while maintaining identical incarceration durations, explicitly citing public safety rather than culpability. The Compatibilist predicts moral hysteresis will decay over time; public intuition will align with the new forward-looking rationale without increasing perceived injustice. They believe institutional language shapes intuition, allowing recalibration. Statutory changes lead the culture. The Abolitionist predicts moral hysteresis will persist; the public will implicitly re-import retributive justification to explain the incarceration, sustaining demand for harshness regardless of statutory language. They believe intuition drives language, not vice versa. Culture resists statutes.

  These cases isolate whether blame is functionally indispensable or merely historically contingent. Resolving these empirical questions would determine whether revisionism is a stable equilibrium or a transient state masking underlying retributivism. Both sides agree that if the Abolitionist predictions hold, revisionism fails pragmatically; if Compatibilist predictions hold, abolitionism is unnecessarily disruptive. The outcome dictates whether we engineer around hysteresis or attempt to eliminate the magnetic field entirely. This empirical adjudication is preferred over purely conceptual argumentation. We commit to testing these specific hypotheses regarding recidivism and public sentiment.

  Fourth, Assessment of Verbal vs. Substantive Disputes

  Once responsibility is fixed as reasons-responsiveness without ultimacy, verbal disputes regarding compatibility dissolve. Both sides accept the deterministic substrate. However, substantive disagreements remain regarding the normative weight of reactive attitudes. The Compatibilist asserts these attitudes are intrinsically valuable components of human flourishing; the Abolitionist asserts they are instrumental tools that often misfire. Furthermore, the dispute over moral hysteresis is substantive: is it a feature to be managed or a bug to be excised? Fixing terminology clarifies that we are not arguing about metaphysics, but about moral psychology and institutional design. The core conflict is axiological, not ontological. We disagree on whether the emotional residue of blame constitutes a moral resource or a moral hazard. This remains unresolved by semantic precision alone. Ultimately, the debate shifts from what freedom is to what punishment does, and whether the psychological inertia of blame serves justice or undermines it. The remaining divide is not about the physics of the brain, but the ethics of social engineering.
