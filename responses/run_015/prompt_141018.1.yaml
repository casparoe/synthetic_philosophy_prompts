  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Professional philosopher specializing in *pramāṇa* literature (Indian epistemology), specifically Nyāya, but with practical experience in evidence committees.
      *   **Tone:** Blunt, corrective where framing is muddled, practical, procedural. No fluff.
      *   **Task:** Create a procedural framework based on Nyāya epistemology for a national screening advisory body (Evidence and Assurance Panel).
      *   **Constraints:** Must fit on one side of A4 (conceptually, though the output here will be longer to explain), runnable in half-day meetings, understandable by lay members (no Sanskrit), address specific epistemological tensions (validity vs. defeaters, testimony chains, conflict, absence, counterfactuals).
      *   **Specific Inputs:** Three case studies to test the procedure.
      *   **Critical Reflection:** Must start with a few hundred words on where the translation breaks (probability vs. certainty, institutional vs. individual cognition).
      *   **Goal:** Settle an argument with a sceptical epidemiologist friend about whether this taxonomy adds value or is just decoration.

  2.  **Initial Reflection & Critique (The "Thinking Freely" Section):**

      *   *The Core Tension:* Nyāya is soteriological and ontological; it seeks *tattvajñāna* (knowledge of reality) to liberate. The Panel seeks *actionable policy* under uncertainty. Nyāya aims for *nirṇaya* (certainty/ascertainment); the Panel deals with risk thresholds.
      *   *The "Four Sources" Mapping:* The user's mapping (Perception=Audit, Inference=Epi, Testimony=Guidelines, Comparison=Analogy) is standard but risky. *Upamāna* (comparison/analogy) in Nyāya is usually about naming/linguistic connection (knowing a "gavaya" is like a cow), not policy transfer. Using it for health system analogy is a stretch but functionally usable if redefined as "structural similarity."
      *   *Probability:* Nyāya logic is deductive/abductive, not Bayesian. The *trairūpya* (three marks) demands invariable concomitance (*vyāpti*). Epidemiology deals in confidence intervals. This is the biggest break point. The procedure must translate "invariable" to "sufficiently stable for action."
      *   *Institutional Testimony:* Nyāya focuses on the *āpta* (reliable person). Guidelines are institutional. The "chain" concept needs to address institutional reliability, not just individual honesty.
      *   *Value Judgement:* Nyāya separates *pramā* (knowledge) from *pramiti* (result/action). The Panel mixes them. The procedure must explicitly flag where evidence ends and value begins (e.g., acceptable harm).

  3.  **Drafting the Procedure (The "Meat"):**

      *   *Constraint:* Needs to be actionable. No Sanskrit terms in the final handout, but I need to use them in the explanation to show competence.
      *   *Structure:*
          1.  Inference Test (Trairūpya operationalized).
          2.  Validity Regime (Intrinsic vs. Extrinsic validity - *svataḥ prāmāṇya* vs. *parataḥ*).
          3.  Testimony Chains (*Śabda* & Transmission).
          4.  Conflict Resolution (*Virodha*).
          5.  Absence (*Abhāva*).
          6.  Hypothetical/Counterfactual (*Tarka*).
          7.  Value Boundary.

      *   *Refining the Inference Test:* The user mentioned the three marks. I need to make sure they understand *vyāpti* (pervasion).
          *   Mark 1: Present in the subject (Pakṣa).
          *   Mark 2: Present in similar cases (Sapakṣa).
          *   Mark 3: Absent in dissimilar cases (Vipakṣa).
          *   *Failure Modes:* *Anaikāntika* (inconclusive/straying) and *Badhita* (contradicted by stronger source).
      *   *Refining Validity:* Nyāya holds *parataḥ prāmāṇya* (validity is extrinsic/needs confirmation) for most practical purposes, though some schools argue *svataḥ* (intrinsic). For a safety-critical board, *parataḥ* is safer. We assume *doubt* until *warrant* is provided, BUT we treat established guidelines as *prima facie* valid until defeated. This is a hybrid. Let's call it "Provisional Validity."
      *   *Testimony:* The "Depth Rule" is good. Institutional testimony adds weight *if* the institution's process is transparent. If opaque, it degrades.
      *   *Conflict:* Don't average. Find the defect (*doṣa*).
      *   *Absence:* Needs a "Detectability Condition." If the light is off, you can't say there's no snake.
      *   *Counterfactuals:* *Tarka*. It removes doubt but doesn't prove truth. Use for sensitivity analysis, not primary justification.

  4.  **Developing the Case Studies:**

      *   *Case 1 (Biomarker):* The control group issue is a classic *Anaikāntika* (straying reason). The marker (biomarker level) is present in the subject (symptomatic), but the link to disease is broken because the "absence of disease" group (healthy donors) isn't the right "dissimilar case" (symptomatic but no disease). *Verdict: SUSPEND.*
      *   *Case 2 (Age Lowering):* Analogy (*Upamāna*) vs. Local Perception (*Pratyakṣa*). Local data usually trumps analogy unless local data is defective (*bādha*). If local pilot is underpowered, it's not a true defeater. It's "inconclusive." The Analogy stands *unless* we find a structural difference. *Verdict: PILOT (needs more local data) or ADOPT with monitoring.* Let's push for PILOT/MONITOR because the local *pratyakṣa* is weak but present.
      *   *Case 3 (Rare Condition):* Counterfactual (*Tarka*) driving the decision. "Stage distribution is inexplicable otherwise." This is *tarka* supporting *anumāna*. But without *vyāpti* (proven link), it's weak. Nyāya would reject *tarka* as a standalone *pramāṇa*. *Verdict: DECLINE or PILOT only.* The user wants to ADOPT. The procedure must stop them.

  5.  **Addressing the Friend's Challenge:**

      *   Is it decoration? No, because it forces *structural* checks on reasoning, not just data quality. It highlights *where* the reasoning fails (e.g., wrong comparison class), not just that the p-value is high. It formalizes the "defeater" search.
      *   However, admit the probability gap. Nyāya seeks certainty; medicine manages risk. The "cost" is that the procedure might be too rigid for urgent public health needs unless "certainty" is redefined as "actionable confidence."

  6.  **Review and Refine:**

      *   *Tone Check:* Am I being blunt enough? Yes.
      *   *Sanskrit:* Keep it out of the panel handout, use it in the commentary to establish authority.
      *   *Formatting:* Use clear headings. Ensure the "One Side of A4" constraint is acknowledged (I will provide the "Panel Card" version).
      *   *Correction:* The user said Nyāya accepts four sources. Actually, Nyāya accepts four (*Pratyakṣa, Anumāna, Upamāna, Śabda*). Buddhist logicians (Dignāga/Dharmakīrti) reduce it to two. I must ensure I stick to Nyāya as requested.
      *   *Validity Debate:* The user asks about *svataḥ* vs *parataḥ*. Nyāya is firmly *parataḥ* (validity must be established by conditions). Mīmāṃsā argues *svataḥ*. I need to correct the user's memory gently. Nyāya says cognition is valid *if* produced by reliable causes, but we often need to check those causes. For the panel: Assume potential defect until checked.

  7.  **Final Polish:**

      *   Make sure the "Minute to the Board" examples are distinct and clear.
      *   Ensure the "Value Boundary" is explicit.
      *   Check the "Probability" disclaimer at the end.

  *(Self-Correction during drafting)*: I initially thought about suggesting a Bayesian update. No, that's Western. Stick to the *pramāṇa* logic. The "probability" issue must be addressed as a translation cost. The *trairūpya* is binary (present/absent). In epi, it's "statistically significant." I need to tell the panel to treat "statistically significant" as "present" for the sake of the check, but flag the confidence level as a "reliability condition."

  *(Refining the Validity Regime)*: The user asks about "innocent until challenged" vs "warrant up front." Nyāya says validity depends on the *generating conditions* (*guṇa*). If the source is known reliable, it's valid. If unknown, it's doubtful. For the Panel: Guidelines are *prima facie* valid (reliable source) but subject to defeat. Local data is *prima facie* valid but subject to sample size defects. It's not about "trust," it's about "source integrity."

  *(Refining Case 3)*: This is the hardest. If the RCT is impossible, Nyāya allows *śabda* (expert testimony) or strong *anumāna*. But if the *anumāna* relies on *tarka* (hypothetical) without *vyāpti*, it fails. I must hold the line: You cannot ADOPT on *tarka* alone.

  Let's write.
answer: |-
  ### Preliminary Reflection: Where the Translation Breaks

  You are right to suspect the mapping is not merely decorative, but your friend is right that the ontology does not match the epidemiology. Nyāya epistemology is built for *nirṇaya* (certainty/ascertainment) regarding the nature of reality, often for soteriological ends. Your panel operates in *saṃśaya* (doubt) regarding probabilistic outcomes for policy. The first break point is **invariance**. The Nyāya *vyāpti* (pervasion) required for inference demands that the reason (*hetu*) never occurs without the property to be proved (*sādhya*). Epidemiology deals in confidence intervals and relative risks. If you treat a p-value <0.05 as "invariable," you will make dangerous errors. The procedure must treat statistical significance as a *proxy* for pervasion, but explicitly flag the residual risk as a value judgement, not an evidential one.

  The second break point is **agency**. Nyāya *śabda* (testimony) relies on the *āpta* (reliable person)—someone who knows the truth and intends to communicate it correctly. A national guideline is a bureaucratic artefact. It has no intent. It has a process. Your "transmission register" is a clever fix, but you must evaluate the *process integrity* of the institution, not just the "distance" from the source. An opaque institution at link one is weaker than a transparent one at link three.

  The third break point is **validity**. You recall Nyāya as "innocent until challenged." This is incorrect. That is the Mīmāṃsā position (*svataḥ prāmāṇya*—validity is intrinsic). Nyāya holds *parataḥ prāmāṇya* (validity is extrinsic). A cognition is not knowledge until its generating conditions are verified as defect-free. However, for practical efficiency, Nyāya allows *prima facie* acceptance of reliable sources until a specific defeater (*bādha*) is found. For your panel, this means: **Do not trust data because it exists; trust it because the collection method is defect-free.** If the method is unknown, the data is doubtful, not innocent.

  Finally, **Upamāna (Comparison/Analogy)**. You map this to "other health systems." Classically, *upamāna* is knowing the meaning of a word by comparing the object to a description (e.g., knowing a "gavaya" is like a cow). Using it for policy transfer is a category stretch. It works only if you treat the "health system" as the object and "structural similarity" as the name. If the structures differ, the analogy fails.

  Below is the procedure. It is designed to fit on one side of A4 for the panel, followed by the commentary you requested.

  ***

  # PANEL PROCEDURE: EVIDENCE AND ASSURANCE (V.1)

  **1. THE INFERENCE CHECK (The Three Marks)**
  For any claim that *Intervention X leads to Outcome Y*, the supporting reason (e.g., biomarker level, risk factor) must satisfy:
  *   **Mark 1 (Presence):** Is the reason present in the proposed target group?
  *   **Mark 2 (Association):** Is the reason present in cases where the outcome is known to occur?
  *   **Mark 3 (Exclusion):** Is the reason *absent* in cases where the outcome is known *not* to occur?
  *   **Failure Mode A (Straying):** If Mark 3 fails (reason appears without outcome), mark the reason as **INCONCLUSIVE**. Do not use for adoption.
  *   **Failure Mode B (Defeated):** If a stronger source (e.g., local audit vs. foreign guideline) contradicts the reason, mark the reason as **OVERRIDDEN**.

  **2. VALIDITY REGIME (When to Trust)**
  *   **Default:** Evidence is **PROVISIONAL**. It counts only if the method of generation is known to be defect-free.
  *   **Reversible/Low Harm:** Accept evidence as valid unless a specific defect is identified (*Defeater Search*).
  *   **Irreversible/High Harm:** Evidence is invalid until positive warrant is provided (*Warrant Search*).
  *   **The Switch:** Determined by the **Harm Threshold** (defined in Board Charter). Chair authorises the regime at meeting start.
  *   **Valid Challenge:** Must identify a specific causal defect (e.g., selection bias, instrument error). General scepticism does not count.

  **3. TESTIMONY CHAINS (The Transmission Rule)**
  *   **Depth:** For every step away from the original observer, reliability degrades unless shored up.
  *   **Institutional Link:** A guideline counts as a "testifier." Its reliability depends on **Process Transparency**, not just reputation.
  *   **Rule:** If the guideline's evidence review method is opaque, treat the guideline as **Link 3** testimony (weak), regardless of its official status.

  **4. CONFLICT RESOLUTION**
  *   **Ordering:** Local Perception (Audit) > Local Inference (Studies) > External Testimony (Guidelines) > Analogy (Other Systems).
  *   **Meta-Rule:** Do not average conflicting sources. A standing conflict indicates a **DEFECT** in one source. The task is to locate the defect, not balance the weight.

  **5. REASONING FROM ABSENCE**
  *   **Condition:** You may claim "No Harm" only if the **Detectability Condition** is met: "If the harm were present, our monitoring would have caught it."
  *   **Requirement:** State the sensitivity of the monitoring system. If sensitivity is unknown, absence is **NOT EVIDENCE**.

  **6. HYPOTHETICAL REASONING (Counterfactuals)**
  *   **Status:** **AUXILIARY ONLY.**
  *   **Rule:** You may use "If X were not true, Y would not happen" to remove doubt about a positive claim, but **NEVER** to establish the positive claim itself.
  *   **Limit:** Cannot support an ADOPT verdict alone.

  **7. THE VALUE BOUNDARY**
  *   **Evidence:** Determines *what will happen* (Efficacy, Safety).
  *   **Judgement:** Determines *what is acceptable* (Cost, Equity, Risk Tolerance).
  *   **Procedure:** If the dispute is about probability, resolve in Panel. If the dispute is about acceptability of risk, minute as **JUDGEMENT** and refer to Board.

  ***

  ### COMMENTARY AND APPLICATION

  #### 1. The Inference Test (Operationalizing *Trairūpya*)
  Your formulation of the three marks is correct. In Nyāya terms, these are *pakṣa-dharmatā* (presence in subject), *sapakṣa-sattva* (presence in similar instances), and *vipakṣa-asattva* (absence in dissimilar instances).
  *   **Sufficient Answer:** For Mark 3 (Exclusion), "Statistically significant difference" is the modern proxy. But you must ensure the "dissimilar case" is actually dissimilar.
  *   **Failure Mode A (Straying/*Anaikāntika*):** This is the most common error in screening. A biomarker rises in cancer, but also rises in inflammation. If you don't check the inflammation group, the reason "strays."
      *   *Minute:* "Reason inconclusive. Marker present in non-disease controls. Specificity unproven."
  *   **Failure Mode B (Defeated/*Badhita*):** This occurs when perception overrides inference. You infer fire from smoke, but you see water poured on it.
      *   *Minute:* "Inference overridden by direct audit data showing no effect."

  #### 2. Validity Regime (*Pramāṇya*)
  Your friend frames this as "trust vs. warrant." Nyāya frames it as "defect-free generation."
  *   **The Regime:** Run **Defeater Search** for Pilot/Suspend decisions (reversible). Run **Warrant Search** for Adopt/Decline (irreversible/high harm).
  *   **The Switch:** The Chair authorises this based on the **Harm Threshold**. This is not epistemology; it is ethics.
  *   **The Challenge:** A challenge must be a *doṣa* (defect). "I worry this might be wrong" is not a *doṣa*. "The sampling frame excluded the elderly" is a *doṣa*.
  *   **Correction:** Nyāya does not support "innocent until challenged." It supports "valid if generated correctly." Your procedure must force the panel to ask "How was this number made?" not "Can anyone disprove it?"

  #### 3. Testimony and Chains (*Śabda*)
  Your "Depth Rule" is sound but needs the institutional tweak.
  *   **Institutional Strength:** An institution *can* add strength if its process is more rigorous than the individual observer's. A meta-analysis (institutional) is stronger than a single study (individual), even though it is "further" from the raw data.
  *   **The Fix:** Rate the chain by the **Weakest Transparent Link**. If the guideline cites a study, and the study's methods are clear, the chain is strong. If the guideline cites "expert consensus" with no data, the chain is weak, regardless of the guideline's prestige.
  *   **Minute:** "Testimony degraded. Guideline relies on consensus without cited primary data."

  #### 4. Conflict (*Virodha*)
  *   **Ordering:** *Pratyakṣa* (Perception/Local Audit) is king. *Anumāna* (Inference/Studies) is next. *Śabda* (Testimony/Guidelines) is next. *Upamāna* (Analogy/Other Systems) is last.
  *   **Meta-Rule:** This is the most valuable tool you have. If Local Audit says "No Benefit" and Foreign Guideline says "Adopt," do not compromise. One is defective. Usually, the Analogy is defective because the populations differ (*upādhi*—limiting condition).
  *   **Minute:** "Conflict identified. Local audit takes precedence. Foreign guideline assumed population similarity not present here."

  #### 5. Reasoning from Absence (*Abhāva*)
  *   **The Test:** *Yogyatā* (Capability). Was the system *capable* of detecting the harm?
  *   **Demandingness:** High. For rare harms, passive reporting is not capable. You need active surveillance to claim absence.
  *   **Minute:** "Absence of harm not established. Monitoring system sensitivity <50% for this adverse event."

  #### 6. Hypothetical Reasoning (*Tarka*)
  *   **Status:** Correct. *Tarka* is a tool to clear obstacles to knowledge, not a source of knowledge. It removes absurdity but does not establish truth.
  *   **Rule:** You can use it to say "It is unlikely the control group bias explains *all* the effect," but you cannot say "Therefore the test works."
  *   **Limit:** Never the sole basis for ADOPT.

  #### 7. The Value Boundary
  *   **No:** The procedure cannot eliminate judgement.
  *   **Stop:** When the question shifts from "Is this safe?" to "Is this risk worth the cost?"
  *   **Handover:** Minute: "Evidence establishes X% risk reduction. Acceptability of Y% false-positive rate is a value judgement for the Board."

  ***

  ### CASE RUNS

  #### Case 1: Blood-Based Biomarker (Triage)
  *   **Analysis:** The Inference Check fails at Mark 3 (Exclusion). The "dissimilar case" (no disease) was healthy donors, not symptomatic patients without cancer. The marker might rise due to symptoms (inflammation) rather than cancer. This is a *straying reason* (*anaikāntika*). The Guideline Testimony is weak because it likely relied on the same flawed study or expert opinion (*śabda* without *pratyakṣa* foundation).
  *   **Verdict:** **SUSPEND.**
  *   **Minute to Board:** "Adoption suspended. The evidential reason (biomarker level) is straying: it distinguishes health from disease, but not symptomatic-non-disease from disease. Specificity in the target population is unproven. Guideline endorsement relies on the same defective comparison."
  *   **Why:** Your suspicion was correct. The procedure catches the control group error as a logical failure, not just a statistical one.

  #### Case 2: Lowering Screening Age (45 vs 50)
  *   **Analysis:** Conflict between Analogy (Foreign System) and Local Perception (Pilot).
      *   *Scenario A (Local Data Valid):* Local Pilot (Perception) trumps Foreign Analogy. Verdict: **DECLINE** or **PILOT** (larger).
      *   *Scenario B (Local Data Defective):* You note the pilot was underpowered. This is a defect in the *generation* of the local perception. It renders the local data **INCONCLUSIVE**, not negative. The Foreign Analogy stands *unless* a structural difference (*upādhi*) is found.
  *   **Verdict:** **PILOT (Scaled).** You cannot ADOPT on Analogy alone for irreversible policy, but you cannot DECLINE based on inconclusive local data.
  *   **Minute to Board:** "Conflict between foreign experience and local pilot. Local pilot is inconclusive due to low power (defect in generation). Foreign analogy stands provisionally. Recommendation is scaled pilot to establish local pervasion."
  *   **Why:** This prevents the "lazy scepticism" of dismissing foreign data while acknowledging local data is currently useless.

  #### Case 3: Rare Condition (No RCT, Counterfactual Support)
  *   **Analysis:** The support is *Tarka* (Counterfactual): "Stage distribution is inexplicable otherwise."
      *   *Rule:* *Tarka* cannot establish positive knowledge. It can only remove doubt.
      *   *Constraint:* You have no *Pratyakṣa* (Audit of mortality benefit) and no valid *Anumāna* (RCT/Strong observational). You have only *Tarka*.
      *   *Verdict:* **DECLINE** (or strictly **PILOT** with explicit research goal). You cannot ADOPT.
  *   **Minute to Board:** "Recommendation to ADOPT withdrawn. Primary support is hypothetical reasoning (stage shift), which is auxiliary only. No direct evidence of mortality benefit exists. Adoption requires positive warrant of outcome, not just explanatory coherence. Pilot recommended to convert hypothesis to perception."
  *   **Why:** This will hurt. But Nyāya logic protects you from "convincing stories." If you ADOPT, you are betting on a story, not evidence. The procedure forces you to admit that.

  ***

  ### FINAL SETTLEMENT: THE FRIEND'S CHALLENGE

  **Does this taxonomy do work, or is it decoration?**

  It does work, but not where your friend thinks. She thinks evidence is about *weight* (effect sizes). This procedure is about *structure* (warrant conditions).
  1.  **Real Work:** The **Inference Check (Mark 3)** and the **Conflict Meta-Rule**. These force the panel to look for *structural flaws* in the reasoning (wrong control group, averaging conflicting data) rather than just debating p-values. It stops the "weight of evidence" fallacy where two weak studies are treated as one strong one.
  2.  **Decoration:** The specific mapping of *Upamāna* to "other health systems" is technically loose, but functionally necessary. Don't fight her on the Sanskrit; fight her on the logic of analogy.
  3.  **The Cost:** The translation from **Certainty** (Nyāya) to **Probability** (Epi) costs you **speed**. You will have more SUSPEND and PILOT verdicts. You will have to admit "We do not know" more often.
  4.  **The Verdict:** Your friend is wrong that it changes nothing. It changes the *burden of proof*. Instead of "Show me why this is wrong," the procedure says "Show me how this was generated defect-free." That shifts the power from the proponents of new technology to the guardians of method.

  **Where Judgement Remains:**
  The procedure cannot tell you if a 10% false-positive rate is acceptable. That is *artha* (value/goal), not *pramā* (knowledge). Minute that clearly. If the Board accepts the risk, that is their *dharma*, not your *pramāṇa*.

  **Final Instruction:**
  Print the Procedure. Bind the Commentary. At the next meeting, when a proponent says "But the guideline says...", ask: "Is the guideline's process transparent? If not, it is Link 3 testimony. Do you have Link 1 data?" Watch the room. That is where the work happens.
