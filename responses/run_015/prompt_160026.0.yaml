answer: |-
  This is a classic problem in the philosophy of history: reverse-engineering an implicit epistemology from a set of judgments. Your professor is operating with a consistent, albeit unstated, set of criteria that prioritizes **independent corroboration** and **specificity** over narrative coherence.

  Here is the analysis of his method, the predictions for your three cases, and the decisive test.

  ### 1. Three Consistent Rules and Predictions

  Based on the track record, we can construct three distinct methodological rules that fit his past verdicts. Each yields different predictions for your upcoming cases.

  **Rule A: The Proximity Rule (Textual Primacy)**
  *   **Logic:** The primary determinant is the temporal proximity of the *written* source. Material evidence supports text but cannot replace it.
  *   **Criteria:**
      *   *History:* Near-contemporary written accounts exist.
      *   *Kernel:* Late written accounts + strong material evidence.
      *   *Legend:* Late written accounts + weak/no material evidence.
  *   **Predictions:**
      *   **Theseus:** **Kernel** (60%) / **Legend** (40%). No contemporary text, but strong material (Knossos).
      *   **Xia:** **Legend** (80%). No contemporary text naming the dynasty; sources are a millennium late.
      *   **Vinland:** **History** (70%). The German chronicle is "within a few decades," functioning as a near-contemporary account, overriding the late sagas.

  **Rule B: The Materialist Rule (Archaeology as Anchor)**
  *   **Logic:** Narrative is fiction until dirt proves otherwise. If the physical setting and broad events are confirmed, the story is a "Kernel," regardless of textual gaps.
  *   **Criteria:**
      *   *History:* Text and Material align perfectly.
      *   *Kernel:* Material confirms the *setting* and *broad event* (war, migration, building), even if text is late or mythic.
      *   *Legend:* Material contradicts the story or is entirely absent.
  *   **Predictions:**
      *   **Theseus:** **Kernel** (90%). The palace exists and is maze-like; the "Labyrinth" is architecturally verified.
      *   **Xia:** **Kernel** (85%). Palatial structures and bronze workshops confirm a "Dynasty-level" society in the right place/time.
      *   **Vinland:** **History** (90%). The site is excavated and dated; the physical reality is undeniable.

  **Rule C: The Specific Anchor Rule (The "Exodus" Constraint)**
  *   **Logic:** General background evidence is insufficient. To be a "Kernel," the external evidence must link to a *unique identifier* in the narrative (a specific name, title, or unique event), not just the general historical context. (This explains why "some Semites leaving Egypt" was not a Kernel for Exodus).
  *   **Criteria:**
      *   *History:* Contemporary text + Specific Material.
      *   *Kernel:* Late text + Material that validates a *specific name or unique claim* (e.g., "Wilusa" for Ilios, "Uruk" for Gilgamesh).
      *   *Legend:* Late text + Material that only validates *background conditions* (e.g., Semites in Egypt, Bronze Age in Yellow River).
  *   **Predictions:**
      *   **Theseus:** **Kernel** (60%) / **Legend** (40%). Depends on whether "Knossos" or the "Labyrinth" structure counts as a specific anchor vs. just a palace.
      *   **Xia:** **Legend** (75%). Archaeology proves a *state*, but without contemporary writing naming "Xia," it fails the Specific Anchor test (parallel to Exodus).
      *   **Vinland:** **History** (80%). The German chronicle provides a specific, near-contemporary textual anchor external to the saga.

  ---

  ### 2. Best Guess: The Professor's Actual Method

  **The Verdicts:**
  1.  **Theseus:** **Kernel** (but a weak one).
  2.  **Xia:** **Legend** (regarding the *Dynasty* as named).
  3.  **Vinland:** **History**.

  **The Real Rule: The Specific Anchor Rule (Rule C)**
  I am confident your professor is running **Rule C**. While Rule A (Proximity) and Rule B (Materialist) fit most of the data, only Rule C explains the **Exodus ruling**, which is the outlier that breaks the other systems.

  *   **Why Rule A fails:** Under a pure Proximity Rule, the Trojan War should be Legend (Homer is centuries late). The professor called it a Kernel because of the Hittite archives (*specific* name link).
  *   **Why Rule B fails:** Under a pure Materialist Rule, the Exodus should be a Kernel. Archaeology confirms Semitic presence in Egypt and desert wanderings were possible. The professor rejected this because the evidence was *general* ("some Semitic people"), not *specific* to the narrative (Moses, Plagues, Mass Exodus).
  *   **Why Rule C wins:** It accounts for the "Gilgamesh Split" (King exists = Specific Anchor; Story = Legend) and the "Olympic Split" (Games = History; Date = Legend). It treats history as a collection of specific claims, not a binary switch for a whole tradition.

  **Application to Your Cases:**
  *   **Vinland (History):** This is the strongest case. It matches the **Alexander** profile. You have material evidence (Newfoundland site) *plus* a near-contemporary external text (German chronicle). The sagas are late, but the chronicle acts as the "near-contemporary account" required for a History verdict.
  *   **Theseus (Kernel):** This matches the **Trojan War** profile. The narrative is mythic (Minotaur), but the "Labyrinth" is not just a metaphor; the prompt specifies the palace had a "maze-like plan." This is a specific structural corroboration of the central mythic motif, distinct from general background. However, without a Linear B text naming "Theseus," it cannot be History.
  *   **Xia (Legend):** This matches the **Exodus** profile. You have a "substantial Bronze Age site" (background context), but "no contemporary writing... that names any such dynasty." Just as "some Semites" did not make the Exodus a Kernel, "some Bronze Age state" does not make the *Xia Dynasty* a Kernel. The specific political entity named in the tradition is unverified. He may concede a "Kernel" that *a state existed*, but the verdict on "The Xia Dynasty" will be Legend.

  ---

  ### 3. The Decisive Test

  **Which of the three cases best separates the rules?**
  The **Xia Dynasty** case is the critical separator.
  *   **Vinland** is too strong; all three rules predict History (or high-probability Kernel).
  *   **Theseus** is ambiguous; the "maze-like plan" is a structural link, but lacks a name.
  *   **Xia** creates a direct conflict between **Rule B (Materialist)** and **Rule C (Specific Anchor)**. Rule B says "Palaces + Bronze = Kernel." Rule C says "No Name = Legend." The professor's handling of the Exodus suggests Rule C will win. If he rules Xia as a Kernel, he has abandoned the logic he used for Exodus.

  **The Hypothetical "Settler" Case:**
  To force the professor to commit to a definition of "Kernel" vs. "Legend" regarding specificity, propose this case:

  > **The Case of King Alaric's Gold:**
  > A medieval chronicle (written 400 years after the fact) claims King Alaric buried a specific treasure in a specific riverbed in Southern Italy.
  > *   **Scenario A:** Archaeologists find a massive 5th-century hoard of gold in that exact riverbed, but no inscriptions link it to Alaric.
  > *   **Scenario B:** Archaeologists find a 5th-century inscription in the region mentioning "Alaric," but no gold is found.

  **Why this settles it:**
  *   If he rules **Scenario A** as a **Kernel**, he values **Event Corroboration** (the burial happened) over Specific Identity. This would imply the Xia Dynasty should be a Kernel (the State existed).
  *   If he rules **Scenario A** as **Legend**, he values **Identity Corroboration** (the name must be proven) over Event. This confirms the **Specific Anchor Rule** and validates the "Legend" verdict for Xia.
  *   If he rules **Scenario B** as a **Kernel**, he values **Textual Specificity** over Material Proof of the *event*.

  This hypothetical isolates the variable that decided the Exodus ruling: Is it enough to prove the *kind* of thing happened (Exodus/Xia/Gold), or must we prove the *specific named* thing happened? His refusal to count "some Semitic people" as a Kernel verdict suggests he requires the latter.
