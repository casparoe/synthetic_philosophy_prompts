      *   *Question 2: Accidental Correctness (Bribed Committee).*
          *   *Core:* If WKRs (bribes) lead to the RKR outcome (harm reduction), is the institution *praiseworthy*?
          *   *Follow-up:* She will say "Structural justification exists regardless of motive."
