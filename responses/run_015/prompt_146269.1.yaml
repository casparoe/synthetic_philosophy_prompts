      *   *Dr. Voss's Claim:* Extending WKR to *institutions*. Institutions can have RKRs even if individuals have WKRs.
      *   *Is this a category mistake?* Not necessarily. Collective intentionality and corporate agency are well-established fields (List, Pettit, Gilbert, etc.). The idea that corporate reasons differ from individual reasons is standard in corporate moral responsibility literature.
      *   *Is the "Collective WKR Gap" coherent?* It sounds like a variation on the distinction between *justification* and *explanation*, or *systemic rationality* vs. *individual rationality*.
      *   *Potential Issue:* The term "Institutional Admiration" is slightly odd. Usually, we talk about institutional *action*, *belief*, or *endorsement*. "Admiration" is an emotion/attitude. Can an institution *admire*? Or does she mean the institution is *admirable*? Or that the institution *endorses* based on admiration?
      *   *Hypothesis:* The user might be slightly misremembering the term. It's likely "Institutional Endorsement" or "Corporate Agency." However, if Dr. Voss specifically uses "Institutional Admiration," I must respect that, but I should flag if it's non-standard.
      *   *Verdict:* The framing is *not* a category mistake, but it is niche. It leans heavily on non-reductive collective agency (Pettit/List). The risk is equivocation on "reason." If "reason" means "justification" for the group, vs. "motive" for the individual, the gap is trivial. If it's about the *nature* of the reason itself, it's more interesting.
      *   *Advice:* I need to validate the user's framing but warn them about the "justification vs. explanation" trap, as the user already noted Dr. Voss leans on that distinction.

  3.  **Drafting the Questions:**

      *   *Goal:* 6-8 questions total. 3 specific ones requested + follow-ups. That leaves 3-5 general/sharp questions.

      *   *Question 1: Functionalism.*
