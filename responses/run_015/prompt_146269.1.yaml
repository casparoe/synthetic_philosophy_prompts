answer: |-
  Here is the straight-up assessment you asked for, followed by the questions.

  ### Part 1: The "Straight Up" Assessment

  **Is this framing confused?**
  Not exactly, but it is terminologically risky and treads on well-worn ground in social ontology.

  1.  **Terminology:** "Institutional Admiration" is non-standard. In the literature (e.g., Philip Pettit, Christian List, Margaret Gilbert), this is usually discussed under **Corporate Agency** or **Collective Intentionality**. If Dr. Voss is claiming institutions can literally *feel* admiration, that is a strong claim about collective phenomenology. If she means institutions are *admirable* or can *endorse* based on RKRs, "Admiration" is a confusing label. You need to clarify this early, or you risk talking past her.
  2.  **The "Gap":** Her distinction between "structural justification" and "motivational explanation" is a classic move in non-reductive collective agency. It mirrors the distinction between *systemic rationality* and *individual rationality*. The risk is that this becomes a trivial semantic split: "The group is rational *qua* group, even if members aren't."
  3.  **The WKR Extension:** Extending the Wrong-Kind-of-Reasons problem (traditionally about fittingness of attitudes like belief/admiration) to *policy endorsement* is interesting but requires care. WKRs usually make an attitude *pragmatically* rational but *epistemically/normatively* unfit. If a corporation endorses a policy for careerist reasons (WKR) that happens to be the right policy (RKR), the standard view is that the endorsement is **accidentally correct**, not justified. If Voss claims it *is* justified at the group level, she is arguing for a form of **collective consequentialism** detached from collective intention.

  **Verdict:** You are not botching the literature, but you need to ensure she isn't just rebranding "systemic functionalism" as "collective normative reasons." Your questions should press on whether this "gap" has any normative teeth or if it's just a descriptive observation.

  ***

  ### Part 2: The Three Required Questions (with Follow-ups)

  #### 1. The Functionalism Trap
  **Question:** "Dr. Voss, you argue that institutions can hold right-kind reasons even when individuals hold wrong-kind reasons. But doesn't this risk collapsing into a functionalist account of institutional rationality? If the 'group reason' is identified solely by the systemic output (e.g., harm reduction) rather than the input of the members' reasoning, aren't you just describing *efficiency* and calling it *normativity*?"

  **Likely Reply:** She will distinguish "structural justification" (the policy fits the institutional mandate) from "motivational explanation" (why the humans pushed the levers).
  **Follow-up:** "If structural justification is completely decoupled from the motivational states of the agents constituting the structure, what is the ontology of that justification? If no mind actually grasps the right-kind reason, in what sense does the reason *exist* to justify the action, rather than just describing a lucky outcome?"

  #### 2. The Accidental Correctness (Bribed Committee)
  **Question:** "Consider a committee that votes to reduce harm—the right-kind reason for the policy—but every member votes 'yes' only because they were bribed—a paradigmatic wrong-kind reason. On your view, does the *institution* deserve moral credit for the decision? If the collective WKR gap allows the institution to be 'right' while the members are 'corrupt,' does this drain the concept of moral praise of all agential content?"

  **Likely Reply:** She will likely say the institution is structurally justified, even if the individuals are blameworthy. The "collective attitude" is distinct from the aggregate of individual motives.
  **Follow-up:** "But if the causal history of that collective attitude is entirely constituted by corrupt individual motives, isn't the 'structural justification' merely retroactive? At what point does the purity of the structural reason get contaminated by the impurity of the constitutive mechanisms?"

  #### 3. Democratic Voting and Self-Interest
  **Question:** "If we apply this to democracy: citizens often vote for self-interested reasons (WKRs regarding civic duty) rather than the common good (RKRs). If your 'collective WKR gap' holds, does this mean a democracy remains normatively legitimate even if *no* citizen votes for the right reasons, provided the aggregate outcome aligns with the common good? Does this render civic virtue conceptually obsolete?"

  **Likely Reply:** She will argue that democratic legitimacy relies on the *procedure's* structural capacity to track reasons, not the voter's internal state.
  **Follow-up:** "That suggests the normativity of democracy is purely procedural. But if citizens realize their internal motives don't impact the legitimacy of the collective output, doesn't that create a moral hazard? Why should I cultivate civic virtue if my wrong-kind reasons are absorbed and sanitized by the collective structure?"

  ***

  ### Part 3: Additional Sharp Questions (To reach 6-8)

  #### 4. Terminology Clarification (Crucial for you)
  **Question:** "I want to clarify a term before we proceed. You use the phrase 'Institutional Admiration.' In the WKR literature, admiration is typically an attitude *subject* to reasons. Are you claiming institutions literally possess phenomenological states of admiration, or is 'Admiration' a shorthand for 'Normative Endorsement'? Because the former implies collective consciousness, while the latter implies collective agency."
  *(Note: This protects you if she's using non-standard jargon.)*

  #### 5. The Moral Psychology Angle (Your home turf)
  **Question:** "From a moral psychology perspective, individuals often internalize institutional norms. If there is a permanent 'gap' between the institution's right-kind reasons and the individual's wrong-kind reasons, doesn't this create a cognitive dissonance that destabilizes the institution over time? Can a 'collective WKR gap' survive long-term without corrupting the structure itself?"

  #### 6. Reductionism vs. Non-Reductionism
  **Question:** "Is your view committed to strong non-reductionism? Could a reductionist argue that the institution's 'right-kind reason' is just a complex logical function of the individuals' reasons, even if those individuals are motivated by WKRs? Or do you require the group reason to be metaphysically primitive?"

  #### 7. Action Guidance
  **Question:** "What is the action-guiding implication of the 'collective WKR gap' for a whistleblower? If I am inside an institution where my individual RKRs are ignored, but the institution is structurally pursuing RKRs via others' WKRs, do I have a duty to comply? Does your theory prioritize institutional rationality over individual moral integrity?"

  #### 8. The Limit Case
  **Question:** "Where does the collective agency stop? If a corporation can have RKRs independent of its employees' motives, can a mob? Can a market? If the 'structural justification' is what matters, does any system that produces good outcomes count as having 'right-kind reasons,' effectively equating rationality with success?"

  ***

  ### Part 4: Moderation Tips for a PhD Student

  *   **Watch the "We":** Philosophers often slide between "we as a society" and "we as a theoretical construct." If she says "We think the institution...", ask her to specify *who* "we" is.
  *   **The "Fittingness" Trap:** The WKR problem is fundamentally about **fittingness** (does the attitude fit the object?). Keep pressing on whether an institutional policy can be "fitting" in the same way an emotion is "fitting." If she conflates "effective" with "fitting," call it out gently.
  *   **Time Management:** You have 8 questions here. You won't get to all of them. Pick the 3 required ones, then choose 2 from the additional list based on how the conversation flows. If she gets bogged down in ontology, use Q5 (Moral Psych) to bring it back to human impact.
  *   **Literature Check:** If you want to look prepared, glance at **Philip Pettit's *Groups with Minds of Their Own*** and **R.A. Duff on Corporate Responsibility**. If she hasn't cited them, you can ask how her view differs from theirs in Q6.

  Good luck. This is a solid panel topic, and these questions will show you understand the stakes without letting her hide behind jargon.
