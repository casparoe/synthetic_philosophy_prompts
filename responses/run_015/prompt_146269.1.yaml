      *   **Topic:** The "Wrong-Kind-of-Reasons" (WKR) problem extended to *institutional admiration* or collective agency. Specifically, the claim that institutions can have right-kind reasons (RKRs) for policies even if individuals have wrong-kind reasons (WKRs, e.g., careerism). This creates a "collective WKR gap" (explanation vs. normative story split).
      *   **Needs:** 6-8 sharp interview questions.
      *   **Specific Requirements:**
          *   One question on functionalism about institutional rationality.
          *   One question on accidental correctness (bribed committee reaching right decision).
          *   One question on democratic voting/self-interest.
          *   For these three, include a follow-up tailored to her likely reply (distinguishing "structural justification" from "motivational explanation").
