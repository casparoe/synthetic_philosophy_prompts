answer: |-
  You have identified a sophisticated and under-theorized argumentative move. While elements of this reasoning appear in discussions of complicity, role morality, and indirect consequentialism, there is **no single canonical term** in the philosophical literature that isolates this specific register: *justifying a causally harmful individual act by appealing to its necessity for maintaining the preconditions of collective agency.*

  The closest existing frameworks are **Complicity Theory** (e.g., Christopher Kutz), which focuses on shared intention rather than infrastructure; **The Division of Moral Labor** (e.g., Rawls, Scheffler), which assigns different tasks to institutions and individuals but rarely justifies individual harm; and **Structural Injustice** (e.g., Iris Marion Young), which identifies responsibility for background conditions but typically demands political action rather than justifying continued participation in harm.

  Because this register is distinct from standard inefficacy, expressivism, or complicity arguments, I propose we coin the term **"Infrastructural Instrumentalism."**

  Below is a definition, a differentiation from neighboring concepts, and a specification of boundary conditions and misapplications.

  ---

  ### 1. Coined Concept: Infrastructural Instrumentalism

  **Definition:**
  *Infrastructural Instrumentalism* is an evaluative register in which an individual action is judged not by its direct causal output (e.g., tons of CO2, number of animals killed) nor by its expressive content (e.g., virtue, solidarity), but by its **functional role in sustaining or eroding the normative and institutional preconditions required for effective collective action.**

  **Core Logic:**
  1.  **Premise 1:** Solving the collective harm (e.g., climate change) requires robust collective agency (e.g., functioning markets, political coalitions, social trust).
  2.  **Premise 2:** Certain individual acts, though directly harmful, are instrumentally necessary to maintain the agent's position within the networks, markets, or institutions that constitute that collective agency.
  3.  **Conclusion:** The individual act is provisionally justified as a cost of maintaining the *capacity* for systemic change, provided the agent actively directs that capacity toward remediation.

  **In your examples:**
  *   **The Frequent Flyer:** Flying maintains her economic status and professional network (infrastructure), which she leverages to fund offsets and lobby for regulation (collective solution).
  *   **The Meat Eater:** Eating meat maintains her social integration within a non-vegan community (infrastructure), preserving her persuasive influence to advocate for welfare reforms (collective solution), whereas abstaining would alienate her and reduce her systemic leverage.

  ---

  ### 2. Differentiation from Neighboring Concepts

  To ensure this concept does not collapse into existing categories, we must distinguish it from three proximate frameworks:

  #### A. vs. Social Norms (Contractualism / Game Theory)
  *   **Standard View:** In game theory or contractualism (e.g., Scanlon), adhering to norms is about fairness, equilibrium stability, or mutual justification. You follow the rule because others do, or because it is reasonable to expect others to follow it.
  *   **Infrastructural Instrumentalism:** This is not about *compliance* with existing norms, but about the *strategic maintenance of the platform* upon which norms are negotiated. It is dynamic rather than static. The agent may be violating a moral norm (don't harm) to preserve the *social machinery* needed to eventually enforce that norm universally.
  *   **Key Difference:** Game theory asks, "What happens if everyone does this?" Infrastructural Instrumentalism asks, "Does doing this keep me in the room where the 'everyone' decision gets made?"

  #### B. vs. Expressivism / Virtue Signaling
  *   **Standard View:** Expressivism (e.g., Elizabeth Anderson) argues that actions communicate values. Abstaining from meat expresses respect for animals; flying expresses disregard.
  *   **Infrastructural Instrumentalism:** Explicitly rejects the primacy of expression. The agent admits their act communicates the *wrong* message (e.g., "I don't care about carbon") but argues the *material consequence* of that communication (remaining an insider) outweighs the expressive cost.
  *   **Key Difference:** Expressivism is about *meaning*; Infrastructural Instrumentalism is about *leverage*.

  #### C. vs. Structural Injustice (Young)
  *   **Standard View:** Iris Marion Young's "Social Connection Model" holds that we bear responsibility for structural injustice by virtue of participating in the processes that produce it. The remedy is usually political action *alongside* reducing participation.
  *   **Infrastructural Instrumentalism:** Goes a step further by arguing that *reducing participation* might be counter-productive if it diminishes political capacity. It treats participation not just as a source of liability, but potentially as a source of *agency*.
  *   **Key Difference:** Young focuses on *forward-looking responsibility to change structures*; Infrastructural Instrumentalism focuses on *positional necessity within structures*.

  ---

  ### 3. Boundary Conditions and Misapplications

  For *Infrastructural Instrumentalism* to function as a rigorous ethical heuristic rather than a rationalization for convenience, it must adhere to strict boundary conditions. Violating these constitutes a misapplication.

  #### A. The Observability Condition (No "Private" Infrastructure)
  *   **Condition:** The act must be observable to the relevant collective. Normative infrastructure is built on social expectations and signaling.
  *   **Misapplication:** Attributing infrastructural effects to purely private acts.
      *   *Example:* A person secretly eats meat at home but claims it "maintains their psychological stability to fight for animal rights." This is not infrastructural; it is psychological. Without social visibility, there is no normative infrastructure being sustained.
      *   *Correction:* The meat-eater must be eating meat *in social contexts* where abstention would trigger alienation.

  #### B. The Plausibility Condition (No "Fantasy Leverage")
  *   **Condition:** There must be a credible causal link between the agent's continued participation and the actual achievement of the collective good.
  *   **Misapplication:** Claiming infrastructural value without evidence of leverage.
      *   *Example:* A CEO flies privately claiming it "maintains the aviation industry's viability for green tech investment," when their personal spending is negligible to the industry and they have no decision-making power over green tech.
      *   *Correction:* The agent must demonstrate that their specific position (e.g., voter, consumer, employee) is a *bottleneck* or *node* through which systemic change must pass.

  #### C. The Subordination Condition (No "Moral Licensing")
  *   **Condition:** The harmful act must be subordinate to the remedial action. The infrastructure is a *means*, not an end.
  *   **Misapplication:** Using the infrastructure argument to indefinitely postpone remediation (Moral Licensing).
      *   *Example:* "I must keep flying to maintain my lobbying power," without actually lobbying or offsetting.
      *   *Correction:* The justification expires the moment the agent ceases the remedial work (advocacy, offsetting, organizing). The "harm" is purchased only with the "currency" of active systemic engagement.

  #### D. The Macro/Micro Boundary (No "Policy Design")
  *   **Condition:** This register applies to *individual* conduct within a system, not to the *design* of the system itself.
  *   **Misapplication:** Applying micro-level infrastructural logic to macro-level policy.
      *   *Example:* A legislature argues, "We should not pass a carbon tax because it might disrupt the economic infrastructure needed for future green investment."
      *   *Correction:* This is standard cost-benefit analysis or political feasibility, not Infrastructural Instrumentalism. The concept is specifically for resolving the *individual's* dilemma of complicity vs. efficacy.

  ### Summary
  You have isolated a move that is increasingly common in "realist" ethical debates but lacks a precise label. It is distinct from **inefficacy** (it admits harm), **expressivism** (it prioritizes function over meaning), and **complicity** (it treats participation as a tool rather than just a taint).

  By naming this **Infrastructural Instrumentalism**, we can subject it to rigorous scrutiny. It forces the defender to prove not that their act is harmless, but that their *complicity is a necessary tax on their capacity to do good.* This shifts the burden of proof from "Did you cause harm?" to "Is your position actually vital to the solution?"
