answer: |-
  Here are eight questions designed to navigate your guest's specific theoretical commitments, with follow-ups keyed to the defensive moves she is most likely to make.

  **1. The Mechanics of the Replacement Test**
  "Your book's signature move is swapping Moore's 'Isolation Test' for your 'Replacement Test.' To find the value of a friendship, you ask us to imagine swapping the friend for the most agreeable substitute possible while holding our own mental states fixed. But critics might say this setup is incoherent: if I truly believe this new person is a substitute and not my *actual* friend, wouldn't my mental states—my sense of security, history, and trust—change inevitably? How do you hold mental states fixed without destroying the very phenomenon you're trying to measure?"

  *   **Likely Answer:** She will argue that we *can* conceptually isolate the variable of 'particularity' from the variable of 'qualitative experience' through careful philosophical imagination, much like we isolate variables in physics.
  *   **Follow-up:** "If we can isolate them conceptually, does that prove the value is real, or just that we have a concept of 'particularity' we like? If the 'loss' felt in the test is just a brute preference for the original person, haven't you reduced the 'organic unity' to a simple, subjective bias?"

  **2. Unobserved Beauty and the Experientialist Slide**
  "You maintain that beautiful objects nobody ever sees add almost nothing to a world's value. But if the value of beauty is contingent on it being experienced, doesn't that quietly make you a pure experientialist? If so, why keep 'beauty' on the list of intrinsic goods at all, rather than just listing 'the experience of beauty' and cutting out the middleman?"

  *   **Likely Answer:** She will likely insist that the *relation* between the mind and the object is the good, not just the mental state, so the object must exist to complete the organic whole.
  *   **Follow-up:** "But if the object's contribution to value drops to near-zero without an observer, isn't the 'whole' carrying almost all the weight? At that point, distinguishing your view from standard hedonism seems like a distinction without a practical difference."

  **3. Scope and the 'Class Taste' Objection**
  "Your method delivers exactly two intrinsic goods: the enjoyment of beauty and personal affection. But many people have strong intuitions that parenting, scientific achievement, or religious devotion are also intrinsic goods. What stops your method from being a blank cheque for whatever a particular philosophical class finds tasteful? How do you rule out those other goods without just asserting your intuition is superior?"

  *   **Likely Answer:** She will argue that upon rigorous reflection, other goods (like achievement) dissolve into instrumental value or are merely components of the two main goods (e.g., parenting is a form of affection).
  *   **Follow-up:** "That sounds like a redefinition strategy. If a parent insists the value of raising a child isn't reducible to affection or beauty, are you saying they are conceptually confused? At what point does 'rigorous reflection' just mean 'agreeing with G.E. Moore'?"

  **4. Organic Unity and the Problem of Evil**
  "Let's turn the organic-unity machinery loose on evil. If the value of a whole isn't the sum of its parts, can a friendship that involved betrayal and painful reconciliation be *more* valuable than an equally close one that didn't, simply because the 'whole' has more complex contrast? If the surplus value comes from the structure, does suffering contribute to that structure?"

  *   **Likely Answer:** She will almost certainly bite the bullet that the *good* whole is more valuable, but deny that the *evil* parts contribute positive value; rather, the good supervenes on the complex pattern.
  *   **Follow-up:** "But if the pattern requires the betrayal to exist, and the pattern is where the value lies, aren't you implying the world is better *with* the betrayal than without it? If you deny that, you seem to be saying the 'surplus value' is free-floating and disconnected from the actual history of the world."

  **5. The 'No Owner' Problem**
  "Here's the metaphysical worry: if the surplus value of the friendship-whole isn't experienced by either friend individually—it's not in your head, and it's not in theirs—who is that value *for*? If the answer is that value needn't be 'value-for' anyone, what practical work is the concept of 'good' still doing?"

  *   **Likely Answer:** She will argue that 'good' is a non-natural property that doesn't require a subject, similar to how mathematical truths don't need a thinker.
  *   **Follow-up:** "Mathematics describes the world, but 'good' is supposed to guide action. If this surplus value isn't good *for* anyone's life, welfare, or experience, why should a moral agent care about maximizing it? Does it risk becoming a idol we serve rather than a tool for living?"

  **6. Motivation and Non-Natural Properties**
  "Following on that: if these values are non-natural properties known by intuition, how do they motivate us? If I intuit that friendship is good, but I feel no desire to pursue it, have I failed morally or just failed to see a fact? I'm asking about the link between seeing the 'good' and being moved to act."

  *   **Likely Answer:** She will likely adopt an internalist view: to genuinely intuit the good *is* to be motivated, so a lack of motivation proves a lack of genuine intuition.
  *   **Follow-up:** "That makes moral failure a form of blindness. But if I can be perfectly rational and psychologically intact yet feel no pull toward your specific 'organic unities,' does that suggest your 'goods' are actually just descriptions of your own psychological drives?"

  **7. The Intuition Stopper (Peer Disagreement)**
  "I want to press on your epistemological foundation. You often defend the list of goods by saying, 'Intuition is the datum; there's nothing further to argue about.' But intelligent, reflective philosophers disagree with you on these intuitions. If two peers have opposite intuitions about whether 'achievement' is an intrinsic good, and neither can argue the other into seeing it differently, how do you break the tie without begging the question?"

  *   **Likely Answer:** She will argue that one party is likely failing to attend to the concept properly or is under the influence of bias, and that consensus isn't required for truth.
  *   **Follow-up:** "But without an independent criterion to check who is 'attending properly,' 'bias' just becomes the word for 'people who disagree with me.' If intuition is the only court of appeal, and the court is divided, doesn't the method collapse into stalemate?"

  **8. Falsifiability and Evidence**
  "Finally, let's talk about evidence. We've discussed what supports the view, but I want to end on what could *undermine* it. What would actually count as evidence against your theory? Is there a scenario, a thought experiment, or a sociological finding that, if true, would force you to abandon the organic-unity axiology?"

  *   **Likely Answer:** She may say that if our intuitions were to universally shift over time, or if the theory led to abhorrent practical conclusions (like justifying cruelty for the sake of 'wholes'), she would reconsider.
  *   **Follow-up:** "If the theory leads to abhorrent conclusions, would you say the theory is false, or that our moral intuitions about cruelty are the things that need correcting? Because if you correct the intuition to save the theory, isn't the theory unfalsifiable?"
