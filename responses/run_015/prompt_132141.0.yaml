      *   *Rousseau's Proposal (Festivals):* In the same text, he proposes republican festivals. People gather in a public square. There is no stage. There are no actors. The people *are* the spectacle to themselves.
      *   *The Tension:* Both involve people looking at things/people. Both involve a gathering. If the problem with theater is "spectatorship" (looking instead of doing), how is the festival different? Is it just a matter of degree, or a qualitative difference in the *structure of representation*?
      *   *The "Instrument" Analogy:* The user likes thinking about instruments. In science, an instrument mediates observation (a microscope changes how we see). Does the festival eliminate the "instrument" of representation, or just swap a bad instrument for a good one?

  3.  **Formulate the Conceptual Distinction:**
      *   *Representation as Alienation:* In theater, the sign (the play) stands *in for* the thing (reality/virtue). The spectator is detached. The relationship is triangular: Spectator -> Actor -> Character/Action. This creates a gap.
      *   *Presence as Identity:* In the festival, the sign *is* the thing. The participants are both the observers and the observed. The relationship is circular/reflexive: Citizen <-> Citizen. There is no "fourth wall."
