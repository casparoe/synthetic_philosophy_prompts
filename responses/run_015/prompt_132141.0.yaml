      *   **Key Question:** Does *every* shared visual experience introduce a distorting representational layer, or do some public rituals avoid this and preserve unmediated civic presence?
      *   **Constraints:** Do not cite editions, page numbers, or scholars. Articulate the conceptual distinction precisely. Explain why settling it matters for the consistency of Rousseau's broader argument about direct participation.

  2.  **Deconstruct the Philosophical Problem:**
