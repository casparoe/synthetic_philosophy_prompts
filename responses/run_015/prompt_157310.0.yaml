answer: |-
  # Q&A Prep Sheet: Insect Sentience Research Program

  **Context:** 20-minute pitch, $1.5M ask, research-only.
  **Goal:** Secure funding for information gathering, not intervention.
  **Constraint:** No philosophy jargon, no citations, practical replies only.

  ---

  ### 1. The Donor Update Number (Finance/Ops)
  **Who:** One of the three finance types.
  **Objection:** "I understand the risk mitigation argument, but I need to put a number in a donor update next year. 'We funded a study' doesn't compete with 'We spared 50,000 hens.' If you can't give me a cost-per-animal-helped metric, how do I justify this to the board?"
  **Your Reply:** "You can't use a cost-per-animal metric here because we don't yet know if there's an 'animal' to count in the welfare sense. If we report savings based on insect counts now, we risk reporting nonsense—either inflating impact if they aren't sentient, or missing the scale if the unit is momentary experience. The metric for this grant is 'reduction in uncertainty.' The update should read: 'We reduced the error margin on sentience probability by X%, preventing potential misallocation of millions in future interventions.' That is a tangible operational win."
  **Concede:** It is much harder to market than a standard welfare victory.
  **Refuse:** To provide a fake "animals helped" number that relies on unproven sentience assumptions.
  **Weakness:** Donors motivated by immediate tangible outcomes may feel alienated by "uncertainty reduction."

  ### 2. The Opportunity Cost (Finance/Ops)
  **Who:** A different finance type, looking at the bottom line.
  **Objection:** "$1.5M is a lot. That could fund corporate cage-free campaigns for layers or broiler welfare improvements with guaranteed returns. Why gamble on insects where the probability of success is unknown and the welfare status is speculative?"
  **Your Reply:** "Because the scale disparity is too large to ignore. Vertebrate farming is in the billions; insect farming is targeting trillions. Even if the probability of sentience is low, the sheer volume means the expected value swamps vertebrate work *if* sentience exists. Spending $1.5M now to verify that premise is cheap insurance. If we spend $10M on vertebrate campaigns while ignoring a potentially larger moral category, we've failed our efficiency mandate. We are buying the right to allocate the next $100M correctly."
  **Concede:** Vertebrate interventions have certain, verifiable outcomes today.
  **Refuse:** To ignore the order-of-magnitude difference in population scale.
  **Weakness:** If the credence in sentience is lower than 1 in 1,000, the math flips back to vertebrates.

  ### 3. Validity of Behavioral Markers (Science - Poultry/Fish)
  **Who:** The poultry scientist.
  **Objection:** "You're proposing behavioral marker batteries—trade-offs, analgesia seeking. In vertebrates, we know those correlate with pain. In insects, those behaviors can be hardwired reflexes. How do you validate the test without a known neural correlate?"
  **Your Reply:** "We aren't trying to prove pain exists; we're testing for *valenced decision making*. A reflex doesn't trade off costs; a subject seeking relief does. If an insect refuses food to avoid a shock zone, or consumes analgesia when injured, that indicates a internal state driving the behavior, not just input-output wiring. We validate by checking for consistency across contexts, not by matching vertebrate neurology."
  **Concede:** Behavioral proxies are never definitive proof of internal states.
  **Refuse:** To withhold research until we have insect-specific neural imaging technology that doesn't exist yet.
  **Weakness:** Complex algorithms can mimic trade-off behavior without any internal feeling (the "philosophical zombie" risk, kept practical).

  ### 4. The Neural Substrate Argument (Science - Fish)
  **Who:** The fish scientist.
  **Objection:** "Fish have nociceptors and opioid systems. Insects don't have the same hardware. If the mechanism isn't there, the welfare state isn't there. You're looking for software without checking for hardware."
  **Your Reply:** "We are looking for functional equivalents, not identical hardware. Vertebrate pain systems evolved; insect systems evolved separately. If we require identical neurochemistry, we can't assess any species outside mammals. We are asking: does the system perform the function of welfare regulation? If they avoid harm consistently despite conflicting drives, the hardware difference is secondary to the functional reality."
  **Concede:** Insect neurology is fundamentally different from vertebrate neurology.
  **Refuse:** To assume functional welfare requires vertebrate-style neurochemistry.
  **Weakness:** It is difficult to distinguish complex homeostatic regulation from affective experience without that hardware.

  ### 5. The "Instinct Machine" Objection (Entomologist)
  **Who:** The entomologist.
  **Objection:** "You're projecting. A moth flying into a flame isn't suffering; it's a navigation error. Most insect behavior is instinctual scripting. You're building a research program on the hope that they aren't robots."
  **Your Reply:** "That is exactly why we need the research. We don't know where the script ends and the experience begins. Some behaviors are clearly reflex, but others show flexibility and learning that scripting doesn't explain. We aren't assuming they aren't robots; we are funding the test to distinguish the scripted behaviors from the valenced ones. If they are all robots, our research proves it, and we save the movement from wasting money on them later."
  **Concede:** A large majority of insect behavior is likely instinctual reflex.
  **Refuse:** To categorically deny the possibility of affective states without empirical testing.
  **Weakness:** The burden of proof is high; most evidence currently points toward reflex.

  ### 6. The Aggregation Unit Problem (Finance/Ops + Science)
  **Who:** A finance type who listened closely to your "new" argument.
  **Objection:** "You introduced this 'unit-of-aggregation' problem—moments vs. lives. If you don't know whether you're counting insects or experience-moments, how do you model impact? It sounds like you're making the metric unmeasurable on purpose."
  **Your Reply:** "It's not unmeasurable; it's currently undefined. If we assume 'per insect' and it's actually 'per moment,' we could be off by orders of magnitude in either direction. Funding this research defines the unit. Until then, any impact model is built on sand. We are asking to fund the definition of the unit before we fund the interventions that rely on it."
  **Concede:** This makes immediate impact reporting significantly more complex.
  **Refuse:** To adopt the 'per insect' unit if the science suggests welfare is momentary.
  **Weakness:** If the unit is "moment," it may be impossible to aggregate into a meaningful donor metric at all.

  ### 7. The Regress Challenge (General Committee)
  **Who:** Any member picking up on your "regress problem" admission.
  **Objection:** "You admitted the scale argument leads to a regress—mites, nematodes, microbes. If you can't draw a line there, why draw it at insects? Why not fund bacteria sentience?"
  **Your Reply:** "Because insects are the current frontier of industrial farming. Bacteria aren't being farmed at scale for feed yet; insects are. We draw the line at practical intervention scope. We fund research where the industry is actually scaling. If nematodes become a farmed commodity next decade, we'll cross that bridge then. We prioritize based on where the suffering is being manufactured now, not just where it theoretically exists."
  **Concede:** The theoretical line between sentient and non-sentient is blurry.
  **Refuse:** To let theoretical uncertainty paralyze action on immediate industrial scaling.
  **Weakness:** The line appears arbitrary if based solely on current industry trends rather than biological capacity.

  ### 8. The Competence/Background Challenge (The "Hope Nobody Asks")
  **Who:** The whole room, voiced by the most senior member.
  **Objection:** "You're a philosopher. You're asking for $1.5M for biology. You admit the core arguments are philosophical. Why aren't we funding a biological PI instead of you running this program?"
  **Your Reply:** "I am not the PI; I am the program officer designing the scope. We will hire scientific leads to run the experiments. The reason I'm pitching this is that biologists aren't asking these specific welfare questions—they're asking about yield and pest control. This program requires someone to bridge the conceptual gap between 'behavior' and 'welfare' before the biology starts. You need a philosopher to design the questions so the biologists can answer them."
  **Concede:** I do not have a background in experimental biology or entomology.
  **Refuse:** To accept that only biologists can design research on the definition of sentience.
  **Weakness:** Trust deficit. If the hired PIs aren't top-tier, the program looks like philosophy dressed up as science.
