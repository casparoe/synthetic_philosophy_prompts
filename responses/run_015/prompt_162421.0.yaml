      *   Prediction: If the theory is true, we should find evidence of *reversions* to foraging that succeeded long-term. (Actually, some did, but usually when farming collapsed).
      *   Better prediction: We should find pre-agricultural mass graves indicating resource warfare or starvation that farming solved.

  6.  **Developing the "Betting" Section:**
