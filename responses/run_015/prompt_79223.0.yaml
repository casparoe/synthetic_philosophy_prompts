      *   *Criteria:* Likelihood (will they ask?) + Damage (does it kill the thesis?).
      *   *Top Tier (High Likelihood, High Damage):* The Longtermist objection (practical paralysis) and the EU theorist objection (arbitrariness of the partition).
      *   *Middle Tier (High Likelihood, Medium Damage):* The Statistician's model selection point (technical implementation) and the "Learning/New Evidence" objection (dynamic consistency).
