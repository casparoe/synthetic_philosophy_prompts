      *   *Objection 4 (Bounded Rationality):* "Isn't this just bounded rationality? We can't compute infinite states. Why make it a normative constraint?"
          *   *Reply:* No, boundedness is descriptive. This is normative. Even an ideal agent shouldn't let the act define the state space.
