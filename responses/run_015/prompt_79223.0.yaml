      *   **Thesis:** PM isn't about huge utilities; it's about acts lacking a place in a pre-fixed state space partition. Solution: Require acts to be assessed against a partition fixed *in advance* and *independently* of the act. Standard remedies (capping, discounting, etc.) are ad hoc or restatements of this.
      *   **Audience:**
          *   Majority: Expected-utility (EU) theorists, imprecise probability, bounded rationality.
          *   Minority (2): Longtermists (treat PM as a live practical threat, care about cause prioritization).
          *   Minority (1): Statistician (cares about model selection implications).
      *   **Format:** Ranked objections (likelihood + damage), 2-minute reply, honest weakness note. Definite position (rank, concede/contest), no hedging. Include the "hope nobody asks" question.
      *   **Tone:** Professional, academic, decisive.

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* The problem is structural (state space definition), not numerical (utility/probability magnitude).
      *   *Requirement:* State space partition must be fixed *ex ante* and independent of the specific act proposed.
      *   *Implication:* The Mugger's proposal generates a *new* state (e.g., "Mugger is a Lord of Matrix") that wasn't in the original partition. If the partition is fixed, this state has probability 0 or is undefined, blocking the calculation.
      *   *Critique of Others:* Capping utilities, probability discounting, etc., are just ways of enforcing this structural constraint without admitting it.

