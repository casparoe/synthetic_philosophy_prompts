          *   "How do you handle learning? State spaces grow."
          *   "Doesn't this block legitimate radical hypothesis testing?"
          *   "Is this just Savage's small world vs. large world problem rehashed?"

      *   *Longtermists:*
          *   "This kills longtermism. We *need* to consider low-probability, high-impact existential risks."
          *   "If we fix the state space now, we can't account for future technological possibilities."
