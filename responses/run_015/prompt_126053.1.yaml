answer: |-
  1. **The Arbitrariness of the Stable Sign**
     On the classic Lewisian account, the sign "dog" denotes canines arbitrarily; there is no intrinsic reason it couldn't be "cat." However, in your evolutionary model, conventions are selected for stability within a replicator dynamic. If a specific signal structure survives because it maximizes fitness or minimizes error rates within a specific ecological niche, doesn't that render the sign *non-arbitrary* in a way that collapses your view into a functionalist or salience-based account? How do you preserve genuine arbitrariness if evolutionary stability is doing the heavy lifting?
     *   **Anticipated Defense:** He will likely argue that multiple equilibria exist with equal fitness, and history determines which one is selected (path dependence).
     *   **Follow-up:** "If history determines the selection among equally fit equilibria, aren't you relying on the size of the **basin of attraction** to explain persistence rather than arbitrariness? If the basin for 'dog' is larger due to phonetic salience, even slightly, doesn't that reintroduce a form of natural salience that Lewis explicitly tried to exclude from the definition of convention?"

  2. **Normativity without Common Knowledge**
     Lewis assigned a specific normative job to common knowledge: it provided agents with a *reason for action* to conform to the regularity. You replace common knowledge with graded, partial mutual expectations stabilized by evolutionary dynamics. Can these partial expectations actually perform the normative work Lewis required, or do they merely explain why agents *do* conform, leaving us without an account of why they *ought* to?
     *   **Anticipated Defense:** He will likely claim that the expectation of others' conformity generates a conditional reason to conform, even without full common knowledge.
     *   **Follow-up:** "But if that conditional reason relies on **second-order expectation formation** (I expect that you expect me to...), at what threshold of 'partiality' does the normative force dissolve? If I know only 60% of the population expects conformity, do I still have a Lewisian reason to conform, or have we reduced normativity to mere statistical probability?"

  3. **Convention vs. Causal Regularity**
     A major challenge for naturalized accounts of convention is distinguishing them from mere biological habits or causal regularities. Bee dances are evolutionarily stable regularities, yet we hesitate to call them conventions. What is the precise boundary condition in your model that separates a genuine linguistic convention from a hardwired causal regularity that merely looks like coordination?
     *   **Anticipated Defense:** He will likely argue that conventions are sensitive to counterfactual changes in the population's behavior, whereas habits are not.
     *   **Follow-up:** "If sensitivity to counterfactuals is the criterion, how do you distinguish this from **drift versus selection**? If a regularity persists solely because no mutation has occurred to test it (drift), rather than because it is actively selected against deviation, is it a convention or just a dormant habit? Does your model require active selection pressure to count as convention?"

  4. **Equilibrium Selection Mechanisms**
     In replicator dynamics, populations can get stuck in suboptimal stable states. If a linguistic community converges on a highly inefficient signaling system that is nonetheless evolutionarily stable, does your theory classify this as a valid convention? If so, how do you explain the intuition that such a system is 'broken' without appealing to the rational optimization Lewis assumed?
     *   **Anticipated Defense:** He will likely argue that stability is the only metric for convention, not efficiency.
     *   **Follow-up:** "If efficiency is irrelevant, how do you account for the rapid shift away from such systems when a slightly more efficient signal is introduced? Does this not imply that agents are tracking **stochastic stability** rather than pure ESS, which smuggles a form of forward-looking rationality back into the evolutionary model?"

  5. **The Mechanics of Partial Expectations**
     You argue that conventions persist through graded, partial mutual expectations. In a standard Lewisian coordination problem, if my confidence in your conformity drops below a certain threshold, I defect. How does your evolutionary model handle this threshold? Is there a 'tipping point' of expectation density below which the replicator dynamic reverses and the convention collapses?
     *   **Anticipated Defense:** He will likely suggest that the threshold is fuzzy and context-dependent.
     *   **Follow-up:** "If the threshold is fuzzy, how do you model the **phase transition** from convention to chaos? If you cannot specify the variance tolerance in the expectation distribution, doesn't the model lose its predictive power regarding when a convention will fail to transmit to a new generation of learners?"

  6. **Semantic Content and Misrepresentation**
     One benefit of Lewis's rationality condition was that it helped ground truth conditions: we signal *that p* because we mutually expect to signal *that p*. In an evolutionary framework where signals are just behaviors that propagate, how do you distinguish a signal that *means* 'danger' from a signal that merely *causes* fleeing? Does your model allow for error, or is successful coordination the only truth condition?
     *   **Anticipated Defense:** He will likely appeal to teleosemantics or the function of the signal in the stable state.
     *   **Follow-up:** "If meaning is derived solely from the stable function, how do you account for **systematic misrepresentation** that persists? If a signal consistently fails to match the world but still coordinates behavior (a useful lie), does your model grant it semantic content, or does it classify it as a non-conventional manipulation?"

  7. **Learning Rules and Imitation**
     Replicator dynamics usually assume agents imitate successful strategies. But linguistic convention often requires understanding *why* a strategy is successful to apply it in novel contexts. Does your model require agents to possess a 'theory of mind' to replicate the convention, or is blind imitation sufficient? If it's blind imitation, how do you explain the productivity of language?
     *   **Anticipated Defense:** He will likely argue for a hybrid model where simple imitation builds the base, and rationality handles the exceptions.
     *   **Follow-up:** "If you introduce a hybrid model, haven't you effectively conceded that evolutionary stability is insufficient on its own? Doesn't this suggest that **rationality conditions** are not replaced by evolutionary dynamics, but merely underwritten by them, preserving Lewis's core insight rather than revising it?"

  8. **Diachronic Stability and Drift**
     Languages change over time even without shifts in external fitness pressures. How does your model account for diachronic drift in conventions where the coordination payoff remains constant? If the convention is evolutionarily stable, why does it shift?
     *   **Anticipated Defense:** He will likely attribute this to neutral drift or small population sampling errors.
     *   **Follow-up:** "If neutral drift drives change in stable conventions, doesn't that undermine the claim that **evolutionary stability** is what *constitutes* the convention? If a convention can persist while drifting significantly, isn't the stability condition too loose to do the definitional work you assign it?"

  9. **Scale and Network Topology**
     Lewis's original examples were small, close-knit groups. Replicator dynamics behave differently in massive, networked populations (like the internet) where local interactions don't globalize quickly. Does your revised theory require a specific network topology to generate global conventions from local stability, and if so, does this limit the universality of your account?
     *   **Anticipated Defense:** He will likely argue that local clusters stabilize first and then compete globally.
     *   **Follow-up:** "If global convention relies on the competition between local clusters, doesn't that reintroduce a **selection pressure between groups** that functions exactly like Lewis's common knowledge at a macro level? Are you not just scaling up Lewis rather than replacing his mechanism?"

  10. **The "Lewisian" Legacy**
      Finally, if you remove common knowledge, replace rationality with replicator dynamics, and define stability via evolutionary criteria, what specific theoretical commitment remains that justifies calling this a 'Lewisian' theory rather than a purely evolutionary game-theoretic account of signaling?
      *   **Anticipated Defense:** He will likely say the commitment to convention as a solution to a coordination problem remains.
      *   **Follow-up:** "But if the *mechanism* of the solution is entirely different (causal stability vs. rational agreement), does the label matter? Or are you arguing that the **coordination problem** itself is the only invariant, meaning Lewis's contribution was identifying the problem, not the solution?"
