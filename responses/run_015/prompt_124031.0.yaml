answer: |-
  During a foraging raid, a mature *Atta* colony encounters simultaneous, contradictory threats: the left flank detects the chemical signature of predatory army ants, triggering a high-intensity retreat pheromone, while the right flank perceives a looming avian shadow, triggering a static freeze signal. These conflicting chemical gradients converge at the central nexus of the trail network, where the physical carriers of the retreat signal are crushed by the advancing army ants, severing the primary communication chain. Surviving workers, encountering the broken gradient and the conflicting freeze signal, do not halt; instead, they dynamically reinforce alternative, longer pathways around the casualties, blending the urgency of the retreat signal with the directional data from the intact right flank to amplify a composite diagonal-escape gradient. Within minutes, the colony executes a unified diagonal maneuver, preserving the brood and workers without any directive from the queen or a central aggregation point, effectively resolving the conflicting data despite the loss of specific signal-carrying individuals.

  The functionalist position verdicts this scenario as evidence of a collective mind because the system successfully integrated contradictory information, maintained a goal state (survival/escape) despite physical damage to its components, and produced a unified action. The substrate continuity position denies this is a mind, arguing that the death of the signal-carrying ants constitutes a break in physical continuity; the remaining ants are merely distinct organisms reacting to local chemical cues, not sustaining a single, continuous mental state. The structural feature doing the philosophical work is the dynamic compensation for dead nodes during the resolution of contradictory inputs. This feature demonstrates that the "decision" is not tied to specific physical matter but is preserved as a functional state across changing hardware. If this feature were removed—if all ants survived and agreed from the start—the scenario would reduce to simple stimulus-response reflexes, allowing the substrate continuity advocate to argue that no complex integration or "thinking" occurred, merely parallel execution of identical instincts.

  I defend the functionalist verdict: the colony constitutes a single cognitive system. The decisive factor is that the information regarding the threat and the intended maneuver persists through the destruction of the physical nodes carrying it. In biological terms, the pheromone gradient acts as a shared working memory that is independent of any single ant's nervous system. When the primary carriers die, the information is not lost but is reconstructed and routed through alternative pathways by surviving agents who act to preserve the gradient's integrity. This demonstrates that the system's unity is defined by the causal maintenance of information states rather than the continuity of specific biological tissue. My argument depends on a contested conception of mental unity that prioritizes functional integration over physical boundaries; I assert that if a system regulates its behavior to maintain internal coherence against environmental perturbation, it possesses the requisite unity for mentality, regardless of whether the substrate is cellular or organismic.

  A defender of the substrate continuity view would attack this case by arguing that the rerouting is merely causal relay between separate organisms rather than genuine internal integration within one mind. They would contend that when an ant dies, the information it carried ceases to exist until a new ant independently generates a similar signal based on local conditions; there is no single "subject" experiencing the transition from the broken path to the new path. From this perspective, the appearance of a unified decision is an artifact of evolutionary selection pressure on individual ants to respond to pheromones, not evidence of a supra-organismal consciousness. They would insist that because the colony lacks a single nervous system to bind these experiences into a singular phenomenological field, the "fault tolerance" is simply a cascade of discrete biological events, not the resilience of a single mind.
