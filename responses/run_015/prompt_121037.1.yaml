answer: |-
  **The Toast**

  Good evening. For those who don't know me, I'm the sibling. I'm also currently the person in the room most likely to ruin a party with theory, so I promise to keep this brief.

  Looking around, I see a room split beautifully in half. On one side, the family who knows [Sister] as the girl who once tried to return a swimsuit because it "felt like Tuesday." On the other, the philosophy crowd who know her as the scholar who can dismantle a metaphysical argument before breakfast. Usually, these two groups don't mix. But today, they're united by [Partner].

  I've spent the last few years writing a thesis on how we define social practices. And full disclosure: I finished it single. Six months ago, my own long-term relationship ended. Not because we didn't love each other, but because I was trying to force us into a specific picture of what a partnership *essentially* is. I was looking for the necessary and sufficient conditions for "Happy Couple." I wanted the blueprint. I wanted the essence.

  When you look for an essence, you stop seeing the person in front of you. You start measuring them against a model.

  [Sister] and [Partner] never made that mistake. They've been together eight years, not because they fit a template, but because they built something that doesn't rely on one. Wittgenstein suggested that things don't belong to a category because they share one core trait, but because of overlapping similarities—like features in a family. You don't all have the same nose, but there's a resemblance.

  Their marriage doesn't look like my parents', or my ex's, or the movies'. It belongs to the family of "marriages" because of how it works, not because it matches a definition.

  And how it works is specific. It's found in what philosophers call a "language game." Now, don't worry—this isn't the kind of game you can quit when you're losing. It's the idea that meaning comes from use. Words and actions only mean something within the specific life you're living together.

  I know this because I've witnessed their rituals. I know about the grocery-store rating system, where produce is judged not on freshness, but on "structural integrity during transport." I know about the made-up words for moods that no one else understands. To an outsider, saying "I'm feeling very [made-up word]" is nonsense. But inside their life, it's a precise coordinate. It's a move in a game that only they play.

  Some might say, "Isn't calling marriage a 'game' dismissing its seriousness?" I'd argue the opposite. A game has rules, stakes, and a shared world that collapses if one person stops playing. The fact that their language only works *between them* doesn't make it small; it makes it intimate. It means they have built a form of life where certain things matter that wouldn't matter anywhere else.

  I learned the hard way that you cannot love an essence. You can only love a person within the context of what you build together. [Sister] and [Partner], you haven't tried to squeeze your love into a picture of what it should be. You've let it be what it *does*.

  So, to the philosophers: Here's to a union without essential conditions.
  To the family: Here's to a love that makes sense even when the words don't.
  And to both: May your language game never run out of things to say.

  To [Sister] and [Partner].

  ***

  **What Would Change My Framing**

  You asked for the philosophical vulnerabilities in this approach. Here are the three points that would force me to rethink the analogy:

  1.  **The Private Language Argument:** Wittgenstein famously argues that a strictly *private* language is impossible because meaning requires public criteria for correctness. If I frame their rituals as too "private," I risk contradicting the very philosophy I'm citing. Their "made-up words" work only because they are mutually checking each other's use within a shared form of life. If I implied their marriage is a closed loop inaccessible to others, I'd be misusing Wittgenstein. The framing holds only because their "game" is embedded in a public world (they still buy groceries in public stores), not because it is hermetically sealed.
  2.  **The Normativity Problem:** An essentialist counter-reading suggests social institutions *need* some essential norms to function normatively. If marriage is *only* family resemblance with no core commitments (like fidelity or permanence), does it lose its binding power? If "marriage" can resemble anything, what distinguishes it from roommates? I sidestepped this by focusing on *their* specific practice, but if I were arguing for marriage as an institution broadly, I'd need to address whether "family resemblance" dilutes the vow itself.
  3.  **The "Game" vs. "Vow" Tension:** Language games are contingent; we can stop playing them. Marriage vows are typically framed as necessary and permanent ("until death"). Framing marriage as a "game" risks implying contingency that undermines the solemnity of the vow. To fix this, I emphasized that the *stakes* of this game are total. If the framing didn't make clear that quitting this game means dismantling a world, the analogy would be too lightweight for a wedding.
