prompt: |-
  You are a philosopher of language with research expertise on vagueness, gradability, and semantic indeterminacy. Think carefully before answering, and begin by brainstorming a long candidate list of demands on a theory of vagueness, then winnow it: I want to see what you considered and discarded, not only the final specification.

  Because adequacy is relative to a purpose, here is mine. I work on regulatory drafting: rules get written in ordinary vague language — significant delay, excessive concentration — and then have to be applied to real cases by inspectors who cannot appeal to a further rule. I want a theory of vagueness good enough to tell me what is going on when such a term is applied to a case that is neither clear nor clearly unclear, and, if a theory can, what the inspector ought to do there.

  So: write me the specification. What must a theory of vagueness deliver to count as adequate, with the case or consideration behind each entry? Cover these, and add to or subtract from the list as you judge right:

  - The sorites. The step premises look true, the reasoning looks valid, the conclusion is unacceptable: the theory must say where the failure is, and also why the argument is compelling rather than merely tempting.
  - Borderline cases with no sorites to run. Predicates like is a game or is a work of art have no ordering of cases on which to build the argument, so a theory engineered only to block the sorites may have nothing to say about most of the phenomenon.
  - Vagueness versus its neighbours: generality, ambiguity, indexical or comparison-class context-sensitivity, underspecification, and plain ignorance of a fact. Give a test that separates them, and say which of these a theory is permitted to lump together.
  - The apparent unknowability of the boundary even for a speaker who fully understands the word, and the fact that the borderline region itself seems to lack sharp edges.
  - Faultless disagreement: two competent speakers can seem to say conflicting things with neither at fault. Is vindicating that a requirement, or a preference of one camp?
  - Vagueness that is inherited from an inexact measurable quantity, as against vagueness that no measurement could settle even in principle. Must one theory cover both, and if you say yes, what does it cost?
  - Voluntary sharpening: speakers can stipulate a cut-off mid-exchange and then reason as though the indeterminacy had never been present.

  For each requirement give the motivating case and mark it non-negotiable or negotiable. Then flag any subset of your requirements that cannot be jointly satisfied, saying which one you would give up and what that concession buys; and say which single requirement excludes the most candidate theories. Close with one sentence each on how the ignorance view, supervaluationism, and degree-theoretic or contextualist accounts stand on the non-negotiables.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language (expertise: vagueness, gradability, semantic indeterminacy).
      *   **Task:** Create a specification for a theory of vagueness.
      *   **Constraint 1 (Process):** Brainstorm a long candidate list of demands first, then winnow it. Show the discarded items, not just the final list.
      *   **Constraint 2 (Purpose):** Regulatory drafting/application. Rules use ordinary vague language ("significant delay"). Inspectors apply them to cases without appeal to further rules. The theory needs to explain what's happening in borderline cases (neither clear nor clearly unclear) and guide the inspector on what to *do*.
      *   **Constraint 3 (Content):** Cover specific listed topics (Sorites, Non-sorites borderlines, Vagueness vs. Neighbours, Unknowability/Higher-order vagueness, Faultless Disagreement, Measurement-based vs. Principle vagueness, Voluntary Sharpening). Mark requirements as Non-Negotiable (NN) or Negotiable (N). Flag incompatibilities. Evaluate major theories (Ignorance, Supervaluationism, Degree/Contextualist) against NNs.
      *   **Tone:** Philosophical, rigorous, practical (given the regulatory context).

  2.  **Phase 1: Brainstorming Candidate Demands (The "Long List"):**
      *   *Idea:* What makes a theory of vagueness good *generally*, and what makes it good for *regulators*?
      *   *Candidates:*
          1.  Solve Sorites.
          2.  Explain borderline cases.
          3.  Distinguish vagueness from ambiguity.
          4.  Explain higher-order vagueness (fuzzy boundaries of the borderline).
          5.  Account for faultless disagreement.
          6.  Handle gradable adjectives (tall, heavy).
          7.  Handle non-gradable vague terms (heap, game).
          8.  Explain why we can stipulate precisions (precisification).
          9.  Preserve classical logic (mostly).
          10. Preserve bivalence (or explain its failure).
          11. Explain the normative force of vague rules (why follow them?).
          12. Explain the cognitive mechanism of categorization.
          13. Account for context dependence.
          14. Explain the difference between epistemic and semantic vagueness.
          15. Provide decision procedures for inspectors.
          16. Account for the "open texture" of law (Waismann).
          17. Explain why vague language is useful/efficient.
          18. Handle negative sorites.
          19. Account for comparatives (taller than).
          20. Explain the relationship between vagueness and truth.

  3.  **Phase 2: Winnowing and Selecting (The "Filter"):**
      *   *Context:* Regulatory drafting. Inspectors need to apply rules. They can't appeal to *more* rules. They need to know what they are doing when they decide a borderline case.
      *   *Filter Criteria:* Does this help the inspector understand the semantic status of the term? Does it guide action? Is it philosophically robust enough to handle the hard cases?
      *   *Selection:*
          *   Keep: Sorites (central to logic of rules), Borderline cases (the inspector's daily bread), Neighbours (mustn't confuse ambiguity with vagueness), Unknowability/Higher-order (crucial for "neither clear nor clearly unclear"), Faultless Disagreement (inspectors might disagree with clients), Voluntary Sharpening (inspectors often have to make a call), Measurement vs. Principle (regulatory metrics often hit limits).
          *   Discard/merge: Cognitive mechanism (psychology, not semantics), Efficiency of language (pragmatics, not core semantics), Negative sorites (covered by general Sorites solution), Comparatives (subset of gradability), Open Texture (too legalistic, overlaps with vagueness/neighbours).
          *   *Crucial Addition for this User:* Normative Guidance. A theory that explains *what is* but not *what to do* fails the regulatory purpose.

  4.  **Phase 3: Drafting the Specification (Iterative Refinement):**
      *   *Structure:*
          1.  Introduction (Acknowledging the persona and purpose).
          2.  The Brainstorming List (Show the work).
          3.  The Winnowing Process (Explain the cuts).
          4.  The Final Specification (The core deliverable).
          5.  Incompatibilities & Trade-offs.
          6.  Theory Evaluation.
      *   *Refining the Requirements:*
          *   *Sorites:* Needs to block the conclusion but respect the intuition. NN.
          *   *Borderlines:* Must handle non-gradable cases too. NN.
          *   *Neighbours:* Must distinguish from ambiguity/indexicality. NN.
          *   *Higher-Order:* The "fuzzy boundary" problem. NN.
          *   *Faultless Disagreement:* For regulators, disagreement usually needs resolution, but the *possibility* of reasonable disagreement matters. Negotiable (maybe). Let's make it NN because inspectors need to know if they are *wrong* or just *different*.
          *   *Measurement:* Distinguish 'tall' from 'heap'. NN.
          *   *Sharpening:* Crucial for regulation (making a determination). NN.
          *   *Action-Guidance:* **New Addition.** The prompt asks "what the inspector ought to do." A purely semantic theory might fail this. I need to demand the theory bridge semantics to decision. NN.

  5.  **Phase 4: Addressing Incompatibilities:**
      *   *The Big Clash:* Classical Logic/Bivalence vs. The Phenomenology of Borderlines.
      *   *Epistemicism* saves logic but makes boundaries unknowable (hard for inspectors to accept).
      *   *Supervaluationism* saves logic but creates truth-value gaps (hard for binary legal decisions).
      *   *Degree Theory* saves phenomenology but breaks classical logic (hard for regulatory compliance which is usually binary).
      *   *Decision:* I must flag that preserving Classical Logic + Explaining Higher-Order Vagueness + Action Guidance is the "Impossible Trinity." I will suggest sacrificing strict Bivalence for the sake of Action Guidance in borderline zones.

  6.  **Phase 5: Evaluating Theories:**
      *   *Epistemicism:* Fails the "Unknowability" intuition (says it's just ignorance). Good for logic, bad for inspector psychology.
      *   *Supervaluationism:* Good for sharpening, bad for truth-value gaps in binary decisions.
      *   *Degree/Contextualist:* Good for gradability, bad for binary compliance (is it 0.6 compliant?).

  7.  **Review against Constraints:**
      *   Did I brainstorm first? Yes.
      *   Did I show discarded items? Yes.
      *   Did I cover the specific list provided? Yes.
      *   Did I mark NN vs N? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I evaluate the three theories? Yes.
      *   Is the tone appropriate? Yes.

  8.  **Final Polish:** Ensure the distinction between the *philosophical* adequacy and the *regulatory* adequacy is clear. The prompt asks for a theory "good enough to tell me what is going on... and what the inspector ought to do." This implies the specification must demand *normative* output, not just *descriptive* semantics. I will add a specific requirement for "Decisional Closure."

  *(Self-Correction during drafting)*: I initially thought about making "Faultless Disagreement" negotiable. But for a regulator, knowing if a disagreement is "faultless" determines if they need to escalate or defend their judgment. I'll keep it Non-Negotiable but note the tension with "Decisional Closure."
  Actually, looking at the prompt: "if a theory can, what the inspector ought to do there." This implies the theory *might not* be able to tell them what to do, but if it claims to, it must be consistent. I will frame the requirement as "Action-Guidance Compatibility."

  Let's refine the "Brainstorming" section to be distinct and substantial.

  *Plan:*
  1.  Intro: Acknowledge role and specific regulatory context.
  2.  Brainstorm List (15-20 items).
  3.  Winnowing Logic (Why some were cut).
  4.  Final Specification (The 7-8 core demands).
  5.  Incompatibility Matrix.
  6.  Theory Scorecard.

  *Wait, one constraint check:* "Close with one sentence each on how the ignorance view, supervaluationism, and degree-theoretic or contextualist accounts stand on the non-negotiables." I need to ensure I have a clear list of Non-Negotiables to evaluate them against.

  *Refining the "Neighbours" requirement:* The prompt asks for a test. I should specify that the theory must *provide* the resources for such a test.

  *Refining "Voluntary Sharpening":* This is key for regulators. They effectively *stipulate* a boundary when they issue a fine. The theory must explain the legitimacy of this.

  Okay, ready to write.
answer: |-
  ### Preamble: The Regulatory Context
  You are asking for a tool, not just a taxonomy. In regulatory drafting, vagueness is not a bug to be eliminated but a feature to be managed; it allows rules to cover unforeseen cases without constant amendment. However, when an inspector faces a "significant delay" that is neither clearly significant nor clearly insignificant, they are not merely describing the world; they are exercising delegated authority. Therefore, a theory adequate for your purposes cannot be purely descriptive of semantic content; it must bridge the gap between *indeterminate meaning* and *determinate action*.

  Below is the development of the specification, beginning with the raw brainstorming phase, moving through the winnowing process, and concluding with the final adequacy conditions.

  ---

  ### Phase 1: The Long Candidate List (Brainstorming)
  *Initial dump of potential demands on a theory of vagueness, prior to filtering for your specific regulatory purpose.*

  1.  **Sorites Resolution:** Must block the paradox without denying obvious premises.
  2.  **Borderline Coverage:** Must account for cases where application is uncertain.
  3.  **Non-Gradable Vagueness:** Must handle terms without linear scales (e.g., *game*, *vehicle*).
  4.  **Ambiguity Distinction:** Must distinguish vagueness from polysemy (bank/bank).
  5.  **Generality Distinction:** Must distinguish vagueness from underspecification (e.g., *someone* vs. *tall*).
  6.  **Indexicality Distinction:** Must separate context-dependence (*here*) from vagueness (*near*).
  7.  **Epistemic Separation:** Must distinguish semantic indeterminacy from mere ignorance of facts.
  8.  **Higher-Order Vagueness:** Must explain why the boundary of the borderline is also fuzzy.
  9.  **Truth-Value Status:** Must assign a status (true, false, gap, degree) to borderline sentences.
  10. **Classical Logic Preservation:** Should ideally preserve validity of modus ponens, excluded middle, etc.
  11. **Bivalence:** Should ideally preserve the principle that every sentence is true or false.
  12. **Faultless Disagreement:** Must explain how two speakers can disagree without error.
  13. **Measurement Vagueness:** Must handle vagueness arising from measurement limits (e.g., *1.8m tall*).
  14. **Principle Vagueness:** Must handle vagueness that measurement cannot fix (e.g., *bald*).
  15. **Voluntary Sharpening:** Must explain how speakers can stipulate precision (precisification).
  16. **Cognitive Plausibility:** Should align with how humans actually categorize (psychology).
  17. **Communicative Efficiency:** Should explain *why* we use vague language (utility).
  18. **Compositionalilty:** Must explain how vague terms combine (e.g., *tall and thin*).
  19. **Comparatives:** Must handle *taller than* even when *tall* is indeterminate.
  20. **Decisional Closure:** Must explain how a decision is reached in a borderline case.
  21. **Normative Force:** Must explain why a ruling in a borderline case binds the subject.
  22. **Retrospective Stability:** Must explain if the ruling changes the meaning for future cases.

  ---

  ### Phase 2: The Winnowing Process
  *Filtering the list based on your constraint: Regulatory application by inspectors who cannot appeal to further rules.*

  **Discarded (and why):**
  *   **#16 Cognitive Plausibility:** Irrelevant. Inspectors need semantic justification, not psychological description. How the brain categorizes doesn't justify the fine.
  *   **#17 Communicative Efficiency:** Interesting for legislators drafting the rule, but irrelevant for the inspector applying it.
  *   **#18 Compositionalilty & #19 Comparatives:** Secondary. While important for a full semantic theory, regulatory predicates are often atomic in application (*Is this delay significant?*). We can treat these as derivative.
  *   **#21 Normative Force & #22 Retrospective Stability:** These are questions of *legal* theory (precedent, authority), not *semantic* vagueness. A semantic theory can inform them, but demanding a full legal theory overloads the specification.
  *   **#10 Classical Logic & #11 Bivalence:** I am marking these as **Negotiable**. In regulation, binary decisions (fine/no fine) are required, but insisting the *semantics* must be bivalent forces theories (like Epistemicism) that are intuitively implausible to inspectors. We need a theory that explains the *transition* from indeterminate to determinate action, even if it costs classical logic in the borderline zone.
  *   **#7 Epistemic Separation:** Merged into "Vagueness vs. Neighbours."

  **Promoted (New Additions):**
  *   **Action-Guidance:** A theory that leaves the inspector in a semantic limbo is useless. It must explain the legitimacy of "forcing" a decision.
  *   **Higher-Order Vagueness:** Crucial. If an inspector says "This is borderline," the client will ask "Is it *clearly* borderline?" The theory must handle this regress.

  ---

  ### Phase 3: The Final Specification
  *A theory of vagueness counts as adequate for regulatory application if and only if it satisfies the following Non-Negotiable (NN) and Negotiable (N) requirements.*

  #### 1. The Sorites Constraint (NN)
  *   **Requirement:** The theory must identify a specific failure point in the Sorites paradox (either a false premise or an invalid inference) while explaining why the argument remains psychologically compelling.
  *   **Motivating Case:** An inspector argues: "1 minute delay is not significant. If *n* minutes is not significant, *n+1* is not significant. Therefore, 10,000 minutes is not significant." The theory must block this without forcing the inspector to claim that 59 minutes is significant but 58 is not (which invites challenge).
  *   **Rationale:** If the theory cannot block the Sorites, it cannot justify why a line is drawn *anywhere*.

  #### 2. The Non-Gradable Borderline Constraint (NN)
  *   **Requirement:** The theory must account for borderline cases where no linear ordering exists.
  *   **Motivating Case:** Determining if a complex financial instrument is a "security." There is no single scale of "security-ness." A theory relying solely on degrees of truth on a scale (e.g., 0.7 true) fails here.
  *   **Rationale:** Regulatory language often involves cluster concepts (*vehicle*, *dwelling*, *employee*). A theory limited to gradable adjectives (*tall*, *heavy*) is insufficient.

  #### 3. The Neighbour Distinction Test (NN)
  *   **Requirement:** The theory must provide a diagnostic test to distinguish vagueness from ambiguity, generality, indexicality, and epistemic ignorance.
  *   **Motivating Case:** A rule bans "vehicles." Is a bicycle a vehicle?
      *   *Ambiguity:* Does 'vehicle' mean 'motorized' or 'conveyance'? (Resolution: Pick sense).
      *   *Vagueness:* Is an electric scooter a vehicle? (Resolution: No fact of the matter until decided).
      *   *Ignorance:* Is there a hidden statutory definition we haven't found?
  *   **Rationale:** Inspectors treat ambiguity (resolve by definition) differently from vagueness (resolve by judgment). Conflating them leads to procedural errors.

  #### 4. The Higher-Order Vagueness Constraint (NN)
  *   **Requirement:** The theory must explain the apparent lack of a sharp boundary between the clear cases and the borderline cases.
  *   **Motivating Case:** An inspector claims, "It is not clear if this is a significant delay." The client asks, "Is it *clear* that it is not clear?" If the theory posits a sharp line between 'clear' and 'borderline', it invites a second-order Sorites.
  *   **Rationale:** Inspectors need to defend the *status* of their uncertainty. If the theory makes the borderline region sharp, it misrepresents the inspector's phenomenological experience of doubt.

  #### 5. The Measurement vs. Principle Distinction (N)
  *   **Requirement:** The theory should distinguish between vagueness solvable by better measurement and vagueness that is principled.
  *   **Motivating Case:** *Height* (measurable) vs. *Adult* (principled/normative).
  *   **Rationale:** In regulation, some terms invite metric precision (*excessive noise* in decibels), others do not (*unreasonable conduct*). A unified theory is preferred, but if it treats them differently, it must say why. (Marked Negotiable because a unified theory is ideal but rare).

  #### 6. The Voluntary Sharpening Mechanism (NN)
  *   **Requirement:** The theory must explain how a speaker (inspector) can legitimately stipulate a cut-off in a borderline case without contradicting the prior meaning of the term.
  *   **Motivating Case:** The rule says "significant delay." There is no prior cut-off. The inspector decides "Over 4 hours is significant." The theory must explain how this decision is consistent with the rule, rather than a change of the rule.
  *   **Rationale:** This is the core of regulatory application. The inspector *completes* the content of the rule. If the theory says this is impossible (because the meaning was already fixed), it fails the regulatory context.

  #### 7. The Faultless Disagreement Condition (N)
  *   **Requirement:** The theory should explain whether two inspectors can reach opposite conclusions on the same borderline case without one being semantically incorrect.
  *   **Motivating Case:** Inspector A fines for "significant delay" (3 hours); Inspector B does not (3 hours).
  *   **Rationale:** If the theory says one *must* be wrong (Epistemicism), it undermines the legitimacy of discretionary judgment. If it says both are right (Relativism), it undermines legal consistency. I mark this Negotiable because a regulatory system ultimately requires *one* outcome, even if the semantics allow disagreement.

  #### 8. Action-Guidance Compatibility (NN)
  *   **Requirement:** The theory must bridge the gap between semantic indeterminacy and binary decision. It must explain what the inspector *ought* to do when semantics run out.
  *   **Motivating Case:** The semantics say "neither true nor false." The law requires "fine or no fine." The theory cannot leave the inspector in a paralysis of truth-value gaps.
  *   **Rationale:** This is specific to your purpose. A purely philosophical theory can stop at "it's indeterminate." A regulatory theory must proceed to "therefore, decide based on X."

  ---

  ### Phase 4: Incompatibilities and Trade-offs

  **The Impossible Trinity:**
  It is widely acknowledged in the literature that you cannot jointly satisfy the following three demands:
  1.  **Preserve Classical Logic** (specifically Bivalence and Excluded Middle).
  2.  **Account for Higher-Order Vagueness** (No sharp line between clear and borderline).
  3.  **Provide Action-Guidance** (Binary decisions must be semantically grounded).

  **My Recommendation for Regulatory Purpose:**
  *   **Sacrifice:** Strict **Bivalence** at the semantic level (Demand #11 from brainstorming).
  *   **Keep:** Higher-Order Vagueness and Action-Guidance.
  *   **Reasoning:** In regulation, insisting that there *is* a sharp boundary (Epistemicism) that the inspector just can't find undermines trust in the inspector's judgment. It makes the decision look like a guess about a hidden fact. It is better to admit the semantics are indeterminate (truth-value gap or degree) but provide a *pragmatic* or *normative* mechanism for closure (Sharpening).
  *   **Concession:** This means the inspector's decision is not "discovering" the truth of the proposition "This is a significant delay," but "making it true" by fiat within a permissible range. The theory must validate this performative aspect.

  **The Most Exclusionary Requirement:**
  *   **Action-Guidance Compatibility (NN #8).**
  *   **Why:** Most philosophical theories of vagueness (Supervaluationism, Degree Theory) are descriptive. They tell you the truth value is undefined or 0.5. They explicitly *refuse* to tell you how to act on that. A theory that satisfies this requirement must be a hybrid semantic-pragmatic theory, which excludes pure semantic accounts.

  ---

  ### Phase 5: Theory Scorecard
  *Evaluation of the three major camps against the Non-Negotiables (NN 1, 2, 3, 4, 6, 8).*

  **1. The Ignorance View (Epistemicism)**
  *   **Status:** Fails NN #4 (Higher-Order) and NN #8 (Action-Guidance).
  *   **Verdict:** It claims there is a sharp boundary we just don't know. This makes the inspector's uncertainty mere ignorance, not semantic indeterminacy, and offers no guidance on where to draw the line other than "guess the fact."

  **2. Supervaluationism**
  *   **Status:** Passes NN #1 (Sorites) and NN #6 (Sharpening), but struggles with NN #8 (Action-Guidance).
  *   **Verdict:** It handles voluntary sharpening well (precisifications), but in the borderline zone, sentences are neither true nor false. It leaves the inspector without a truth-conditional basis for a binary decision, requiring an external pragmatic patch.

  **3. Degree-Theoretic / Contextualist Accounts**
  *   **Status:** Passes NN #4 (Higher-Order) and NN #2 (Gradability), but struggles with NN #3 (Neighbours/Non-Gradable) and NN #8 (Binary Action).
  *   **Verdict:** Excellent for "significant delay" (gradable), poor for "is a vehicle" (non-gradable). Also, converting a degree of truth (0.6) into a binary legal outcome (Fine/No Fine) requires a threshold that reintroduces the Sorites vulnerability.

  **Final Recommendation:** For your regulatory purpose, a **Contextualist theory of vagueness** (specifically one that treats the application of vague predicates as a context-shifting speech act) is the strongest candidate, provided it is augmented with a normative theory of administrative discretion to satisfy Action-Guidance.
