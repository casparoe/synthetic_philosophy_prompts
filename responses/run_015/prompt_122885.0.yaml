answer: |-
  I reject your premise that reaching an off-path node falsifies common knowledge of rationality, because you mistake a logical constraint on dispositions for an empirical claim about history. You conflate the logical implication of rationality with the empirical evidence of play, failing to see that common knowledge of rationality is a substantive condition: it means each player is disposed to maximize utility at *every* node, whether reached or not, and knows the other is similarly disposed. When we reason counterfactually about node $n$, we are not updating beliefs based on an impossible history; we are deducing the logical consequences of the dispositional axioms we accepted at the outset. The fact that a rational player *would not* reach node $n$ does not mean rationality is undefined there; it means the definition of rationality *precludes* reaching it, and that preclusion is precisely what drives the choice at node 1.

  So the argument establishes guidance for node 1 by proving that node 5 is inaccessible to rational agents. You ask why a chain concerning ruled-out situations should settle the start; the answer is that the impossibility of the future nodes is what renders the present move obligatory. If you abandon the assumption that rationality holds at unreached nodes, you are no longer analyzing a game of perfect information, but a psychological puzzle about trust. I concede you shouldn't advise a friend to take the small pile if they face a human opponent, but that is because humans lack common knowledge of rationality, not because backward induction is logically flawed. The reasoning holds because it is a proof, not a prediction.
