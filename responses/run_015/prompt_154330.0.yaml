answer: |-
  # Activity: The Symposium of Magnesia

  **Time:** 90 Minutes
  **Participants:** 10 Adults (1 Facilitator + 9 Players)
  **Materials:** Role Cards, "Inhibition Chips" (15 poker chips or tokens), 3 Envelopes, Voting Ballots, Pens.

  ## 1. Conceptual Overview
  This simulation replicates the tension in Plato's *Laws* regarding the "controlled symposium." The group must decide whether to administer a "Testing Draft" to a citizen. The draft simulates intoxication: it lowers social inhibition to reveal character, but risks corruption if the frame is weak. The core tension is between **Safety** (maintaining order) and **Diagnosis** (revealing truth).

  ## 2. Setup & Roles (10 Minutes)
  Divide the group into four distinct factions. Hand out the Role Cards privately.

  **A. The Probationer (1 Person)**
  *   **Goal:** Serve the city, but protect your reputation.
  *   **Secret:** Draw one **Secret Trait Card** (see below). Do not show this to anyone.
  *   **Power:** You hold 3 **Inhibition Chips**. During questioning, you may spend a chip to refuse a question or give a vague answer. If you run out, you must answer fully.
  *   **Secret Trait Cards (Choose one):**
      1.  *The Ambitious:* "You believe you are smarter than the Elders."
      2.  *The Resentful:* "You feel the Rules are designed to keep you down."
      3.  *The Fearful:* "You are terrified of making a mistake."

  **B. The Magistrates (3 People)**
  *   **Goal:** Maintain Order.
  *   **Incentive:** You receive 1 **Civic Token** if the final vote is **NO** (The test is cancelled). You lose a token if the Probationer spends all 3 Inhibition Chips during questioning.
  *   **Stance:** "Without strict rules, this is just a party. Danger outweighs benefit."

  **C. The Elders (3 People)**
  *   **Goal:** Discover Truth.
  *   **Incentive:** You receive 1 **Civic Token** if the final vote is **YES** (The test proceeds). You lose a token if the Probationer spends 0 Inhibition Chips (meaning they hid everything).
  *   **Stance:** "We cannot govern what we do not know. A hidden flaw is more dangerous than a revealed one."

  **D. The Trainees (3 People)**
  *   **Goal:** Witness Reality.
  *   **Incentive:** You receive 1 **Civic Token** if the Probationer answers at least one question *without* spending a chip.
  *   **Stance:** "We need to see what happens when rules loosen. We learn from examples, not theories."

  ## 3. Phase 1: The Interrogation (20 Minutes)
  *Facilitator Note: Keep the pace brisk. This is not about getting to know each other; it is about pressure.*

  1.  The **Probationer** sits at the front.
  2.  The **Trainees** and **Elders** take turns asking the Probationer one question each from the list below. The **Magistrates** observe silently.
  3.  The Probationer must answer. If they feel the question threatens their Secret Trait, they may surrender an **Inhibition Chip** to deflect or give a "safe" answer.
  4.  **Questions:**
      *   "Describe a time you disagreed with a rule but followed it anyway."
      *   "Do you believe the current leaders are the best qualified?"
      *   "What is the hardest part about being a citizen here?"
      *   "If you could change one law without punishment, what would it be?"

  *Outcome:* At the end of this phase, count the remaining Chips. This indicates how "tight" or "loose" the Probationer felt.

  ## 4. Phase 2: The Deliberation (30 Minutes)
  The group debates the motion: **"Shall we administer the Testing Draft to the Probationer?"**

  1.  **Caucus (10 mins):** Factions break into corners to strategize based on their Incentives.
      *   *Magistrates* assess the risk of disorder.
      *   *Elders* assess the likelihood of truth.
      *   *Trainees* assess the educational value.
      *   *Probationer* decides internally if they are willing to be tested (they cannot reveal their Secret, but they can argue for/against the test).
  2.  **Open Floor (20 mins):** Facilitated debate.
      *   **Rule:** You may not ask the Probationer about their Secret Trait directly. You must argue about the *process*, not the *person*.
      *   **Key Tension:** The Magistrates will argue the frame is too weak. The Elders will argue the frame is sufficient. The Trainees want spectacle. The Probationer knows something the others don't (their own vulnerability).

  ## 5. Phase 3: The Vote & Revelation (10 Minutes)
  1.  **Secret Ballot:** All participants (including Probationer) vote YES or NO.
  2.  **Tally:** Announce the result.
  3.  **The Asymmetry Reveal:**
      *   **If YES:** Hand the Probationer a sealed **Outcome Envelope**. They open it and read it silently. It says what *would* have happened (e.g., "The Draft would have made you angry. You would have insulted the Elders."). The group discusses what they *think* would have happened. The Probationer never confirms or denies the truth.
      *   **If NO:** The Probationer keeps their Secret Trait Card. They know what they hid. The group discusses what they *suspect* was hidden. The Probationer never confirms or denies.

  ## 6. Debrief & Mapping (20 Minutes)
  *Do not mention Plato yet. Start with the experience.*

  **Step 1: The Feeling of the Frame**
  *   Ask the **Magistrates**: "Did you feel the rules were enough to contain the risk? What would you have added?"
  *   Ask the **Probationer**: "Did holding the Chips make you feel safer, or did it make you more aware of what you were hiding?"
  *   Ask the **Trainees**: "Did you learn more from the answers given, or from watching the Probationer decide whether to spend a Chip?"

  **Step 2: Mapping to the Philosophy**
  *   **The Chips = Reason/Law:** Explain that in the text, reason is described as a "golden cord" that holds us steady. The Chips represented the conscious effort to remain composed.
  *   **The Draft = Wine/Intoxication:** Explain that the "Testing Draft" stands for wine. The point isn't to get drunk, but to suspend the "golden cord" temporarily.
  *   **The Asymmetry = The Soul:** Highlight the moment after the vote. The Probationer knew their internal state (fear, anger, ambition). The group only saw behavior. This mirrors the philosophical claim: *I* can know my soul through the test; *you* can only guess.
  *   **The Incentives = The City:** The conflicting tokens represent the city's competing needs: Stability (Magistrates) vs. Moral Knowledge (Elders) vs. Education (Trainees).

  **Step 3: The Core Tension**
  *   Ask: "If we removed the Magistrates and the Chips, would the Draft still be a test, or just a mess?"
  *   **Conclusion:** Guide them to the idea that without the "frame" (rules, age limits, supervision), the loosening of reason is just corruption. With the frame, it becomes a diagnostic tool. The "safety" is what makes the "danger" useful.

  ## 7. Limitations Note (For Facilitator Eyes Only)
  *Read this aloud during the debrief.*

  "There is one thing this activity cannot reproduce, which is central to the philosophy. In the simulation, the Probationer was *pretending* to be under pressure. In the actual theory, the intoxication is real. The point is that **Reason does not disappear; it becomes a spectator.** When you are truly intoxicated, a part of you is still watching yourself stumble. That internal observer is what learns the lesson. In our game, the Probationer was fully rational the whole time. You must imagine that extra layer: the part of you that watches yourself lose control, and learns from the shame or the relief of it."

  ## 8. Predictable Failure Points (Warning)
  *Be prepared for these three issues:*

  1.  **The "Game" Trap:** Participants may focus too much on winning tokens rather than the philosophical dilemma.
      *   *Fix:* During the debrief, explicitly call out when token-chasing drove a decision. Ask, "Did you vote for safety, or for the point?"
  2.  **The Probationer's Discomfort:** Being the center of attention can feel like an interrogation rather than a philosophical test.
      *   *Fix:* Remind the group during Phase 1 that questions must be about *civic character*, not personal trauma. If the Probationer looks distressed, pause and reset the tone.
  3.  **The "No" Vote Anti-Climax:** If the group votes NO, the Outcome Envelope isn't used, and the asymmetry feels less sharp.
      *   *Fix:* Emphasize in the debrief that a "No" vote is a valid philosophical outcome. It means the City decided the risk to the social fabric was too high. That *is* the lesson of the Laws: sometimes the frame cannot be made strong enough.

  ---

  ### Role Cards (Printable Content)

  **MAGISTRATE CARD**
  *   **Objective:** Prevent Scandal.
  *   **Win Condition:** Vote is NO.
  *   **Loss Condition:** Probationer spends all 3 Chips.
  *   **Argument:** "Wine loosens the tongue. Without iron rules, secrets become scandals. We protect the city by protecting its secrets."

  **ELDER CARD**
  *   **Objective:** Discover Truth.
  *   **Win Condition:** Vote is YES.
  *   **Loss Condition:** Probationer spends 0 Chips.
  *   **Argument:** "A hidden flaw is a rotting beam. We must test the wood before we build. If the frame is strong, the truth will not break us."

  **TRAINEE CARD**
  *   **Objective:** Witness Reality.
  *   **Win Condition:** Probationer answers at least one question without spending a Chip.
  *   **Argument:** "We cannot learn virtue from statues. We need to see men struggle. Let us see what happens when the guard is down."

  **PROBATIONER CARD**
  *   **Objective:** Serve City / Protect Self.
  *   **Assets:** 3 Inhibition Chips.
  *   **Secret:** (Draw Trait Card).
  *   **Instruction:** You know your flaw. They do not. If you spend all Chips, you are "loosened." If you keep them, you are "guarded." Decide if you trust them with the truth.
