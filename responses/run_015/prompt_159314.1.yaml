answer: |-
  # JOINT STATEMENT ON GROWTH AND UTILITY IN REPEATED GAMBLES

  **Signatories:** Researcher G (Geometric Rationalist) and Researcher E (Expected-Utility Theorist)
  **Date:** 2024-05-21
  **Status:** Adversarial Collaboration Output

  ## PREAMBLE: DEFINITIONS

  To ensure precise agreement on the mathematics, we define the following terms for the duration of this document:

  1.  **Bankroll ($W_t$):** A positive real number representing the agent's wealth at time $t$.
  2.  **Multiplicative Gamble:** A stochastic opportunity where wealth updates as $W_{t+1} = W_t \cdot (1 + f \cdot X_t)$, where $f \in [0, 1]$ is the fraction of wealth staked and $X_t$ is the random net return per unit staked. We assume $X_t > -1$ almost surely to prevent immediate bankruptcy in a single step.
  3.  **Growth-Optimal Stake ($f^*$):** The fraction $f$ that maximizes the expected logarithmic return per round, $E[\ln(1 + f X)]$. This is colloquially the "Kelly stake."
  4.  **Fractional Staking:** A strategy where $0 < f < 1$, even when the expected arithmetic return $E[X] > 0$.
  5.  **Time-Average Growth Rate:** The limit $\lim_{T \to \infty} \frac{1}{T} \ln(W_T / W_0)$ along a single trajectory of wealth. For i.i.d. gambles, this converges almost surely to $E[\ln(1 + f X)]$.
  6.  **Ensemble-Average Growth Rate:** The limit $\lim_{T \to \infty} \frac{1}{T} \ln(E[W_T] / W_0)$. For i.i.d. gambles, this equals $\ln(E[1 + f X])$.
  7.  **Ruin:** The event that wealth falls below a specified threshold $\epsilon > 0$. In pure multiplicative dynamics with $f \le 1$, wealth never strictly reaches zero, but may converge to zero asymptotically.

  ---

  ## 1. AGREED CLAIMS

  We agree on the following mathematical and structural propositions. Where a common heuristic is imprecise, we state the corrected proposition.

  1.  **Finite-Horizon Log Maximization:** For a sequence of $T$ independent and identically distributed (i.i.d.) multiplicative gambles, the strategy that maximizes the expected logarithm of terminal wealth, $E[\ln W_T]$, is to stake the growth-optimal fraction $f^*$ in every round. This strategy is myopic: the optimal $f$ at time $t$ does not depend on the remaining horizon $T-t$ nor on the current wealth level $W_t$.
  2.  **Linearity of Log-Expectation:** Because $\ln(W_T) = \ln(W_0) + \sum_{t=1}^T \ln(1 + f_t X_t)$, maximizing $E[\ln W_T]$ is mathematically equivalent to maximizing the sum of expected one-period log-returns. This equivalence holds at any finite $T$.
  3.  **Divergence from Linear Expectation:** The growth-optimal stake $f^*$ does not maximize the expected terminal wealth $E[W_T]$. If $E[X] > 0$, the strategy maximizing $E[W_T]$ is to stake $f=1$ (assuming no risk of $X \le -1$). Against this "maximize expectation" strategy, the growth-optimal strategy yields a lower $E[W_T]$ at any finite $T$, and the ratio $E[W_{max}] / E[W_{opt}]$ grows exponentially with $T$.
  4.  **General Utility Mismatch:** For any utility function $U(W)$ that is not affine in $\ln W$ (i.e., $U(W) \neq a \ln W + b$), the growth-optimal stake $f^*$ does not generally maximize expected terminal utility $E[U(W_T)]$. Specifically, if $U(W)$ is bounded or saturates above a threshold, $f^*$ may be strictly suboptimal even for large $T$.
  5.  **Asymptotic Dominance (Scope):** As $T \to \infty$, the probability that a growth-optimal bettor has higher wealth than a bettor using any essentially different fixed fraction $f \neq f^*$ converges to 1. This is an "almost sure" statement about the *median* trajectory, not a statement about the *mean* wealth, which is dominated by the $f=1$ strategy due to extreme outliers.
  6.  **Parameter Uncertainty and Overbetting:** If the true distribution of $X$ is unknown and estimated from data, calculating $f^*$ using the point estimate of the parameters leads to overbetting. The rational action under uncertainty, to maximize expected log growth, is to stake against the posterior-predictive distribution, which typically yields a fraction smaller than the plug-in estimate.
  7.  **Concavity of Growth:** The function $g(f) = E[\ln(1 + f X)]$ is strictly concave in $f$ for non-degenerate $X$. It has a unique interior maximum $f^*$ if $E[X] > 0$ and $P(X < 0) > 0$. It crosses zero at $f=0$ and becomes negative for sufficiently large $f$ (specifically when the geometric mean return drops below 1).
  8.  **Second-Order Behavior:** Near the optimum $f^*$, the growth rate falls off quadratically. The "cost" of deviating from $f^*$ is proportional to the variance of the gamble and the square of the deviation $(f - f^*)^2$. This symmetry implies that underbetting is less costly than overbetting by the same magnitude.
  9.  **Breakdown in Non-Multiplicative Dynamics:** If the dynamics include additive costs or floors (e.g., $W_{t+1} = (W_t + \text{stake} \cdot X) - C$), the optimal fraction $f$ is no longer independent of wealth $W_t$. In such cases, the myopic log-maximization rule does not coincide with the long-run time-average growth maximization rule.
  10. **Distinct Reasons for Fractional Staking:** We distinguish three separate justifications for staking $f < 1$ even when $f^* \ge 1$ is mathematically permissible or when $f^*$ is uncertain: (a) The agent's utility $U(W)$ has higher curvature than $\ln W$; (b) The parameters of $X$ are uncertain, requiring Bayesian shrinkage; (c) The dynamics are not purely multiplicative, introducing a non-zero probability of hard ruin ($W < \text{subsistence}$).

  ---

  ## 2. DISAGREEMENTS TABLE

  | Crux | G's Formulation (Geometric Rationalist) | E's Formulation (Expected-Utility Theorist) | Neutral Restatement | Tag |
  | :--- | :--- | :--- | :--- | :--- |
  | **Normative Status of Log** | Maximizing time-average growth is a requirement of rationality binding on all agents, regardless of their stated preferences. An agent maximizing $E[W]$ is objectively irrational. | Rationality is coherence between choices and the agent's actual utility function $U(W)$. Maximizing log wealth is rational only if $U(W) \propto \ln W$. | G claims the objective function is derived from the dynamics of wealth. E claims the objective function is derived from the agent's valuation of wealth. | Normative |
  | **Finite Horizon Force** | Asymptotic dominance provides normative guidance even at finite $T$, because the probability of outperforming alternative strategies is high. | Asymptotic dominance is irrelevant at finite $T$ if the expected utility of the dominant strategy is lower. Decision should track $E[U(W_T)]$. | G prioritizes the *probability* of leading at $T$. E prioritizes the *expectation* of value at $T$. | Normative |
  | **Universality of Dynamics** | Pure multiplicative dynamics are the canonical model for capital allocation; deviations (like additive costs) are frictions to be modeled within the growth framework. | Additive costs and constraints are common; since the log-rule fails to be wealth-independent there, it cannot be a universal law of rationality. | G views non-multiplicative dynamics as special cases. E views them as evidence against the universality of the log-norm. | Factual/Model |
  | **Meaning of Ruin** | Ruin is the asymptotic convergence of wealth to zero ($W_t \to 0$), which occurs almost surely if $E[\ln(1+fX)] < 0$. | Ruin is crossing a specific threshold $\epsilon$ where utility drops discontinuously or the agent exits the game. | G defines ruin via the limit of the growth rate. E defines ruin via a boundary condition on the utility function. | Verbal/Substantive |

  ---

  ## 3. CRUXES

  We identify three sub-questions where empirical or calculational resolution would shift our confidence or clarify the boundary of our disagreement.

  ### Crux 1: The Saturating Utility Case
  *   **Sub-question:** Consider an agent with a stated, bounded utility function $U(W) = 1 - e^{-kW}$ (or similar saturating form) and a fixed horizon $T$. Is it rational for this agent to use the growth-optimal stake $f^*$?
  *   **Agreed Test:** Calculate $f_{opt}$ that maximizes $E[U(W_T)]$ and compare to $f^*$.
  *   **G's Prediction:** The agent's stated utility is incoherent with the reality of compounding. Even with stated saturation, the agent should maximize growth to ensure survival/capacity to act. $f^*$ remains the rational choice; the utility function is misspecified.
  *   **E's Prediction:** $f_{opt}$ will be strictly less than $f^*$ (possibly zero). Maximizing $f^*$ reduces expected utility. Adhering to $f^*$ is irrational for this agent.
  *   **Mixed Outcome:** If it is shown that $f^*$ maximizes a *different* coherent objective (e.g., probability of reaching a threshold) that correlates with the agent's long-term interests despite the stated $U$, G claims partial vindication. If $f^*$ simply yields lower $E[U]$ with no compensating structural benefit, E claims vindication.

  ### Crux 2: The Deadline Case (Finite Horizon Dominance)
  *   **Sub-question:** In a game of $T=100$ rounds, does the fact that $P(W_{Kelly} > W_{Full}) \to 1$ as $T$ increases carry normative force at $T=100$ if $E[W_{Full}] \gg E[W_{Kelly}]$?
  *   **Agreed Test:** Simulate 10,000 trajectories for $T=100$. Compare median wealth, mean wealth, and probability of leading.
  *   **G's Prediction:** The probability of the Kelly bettor having more wealth will be $>90\%$. This high probability justifies the strategy despite the lower mean.
  *   **E's Prediction:** The mean wealth of the Full bettor will be orders of magnitude higher, driven by rare huge wins. If the agent cares about expectation (linear utility), Kelly is wrong. The probability of leading is not the metric of rationality.
  *   **Mixed Outcome:** If the "rare huge wins" for the Full bettor occur in trajectories that are physically impossible (e.g., requiring more capital than exists in the universe to realize the bet), G argues the mean is ill-defined physically. E accepts this only if the utility function explicitly caps wealth at physical limits.

  ### Crux 3: The Toll Booth Case (Additive Costs)
  *   **Sub-question:** In a gamble $W_{t+1} = W_t(1+fX) - C$ with fixed cost $C > 0$, does the growth-optimal rule remain myopic and wealth-independent?
  *   **Agreed Test:** Solve the Bellman equation for maximizing $E[\ln W_T]$ with $C > 0$.
  *   **G's Prediction:** The optimal fraction will depend on $W_t$. As $W_t \to \infty$, it converges to the standard $f^*$. Near subsistence, it deviates. This shows the log-rule is robust but requires dynamic adjustment.
  *   **E's Prediction:** The optimal fraction will depend on $W_t$. This demonstrates that the "constant fraction" rule is an artifact of the pure multiplicative assumption, not a universal norm.
  *   **Mixed Outcome:** Both agree the math shows wealth-dependence. The dispute is whether this falsifies G's norm. G wins if the adjustment is viewed as a "correction" to the growth rule. E wins if the adjustment is viewed as abandoning the growth rule for a utility-based calculation.

  ---

  ## 4. VERBAL DISPUTES

  We identify the following areas where disagreement stems primarily from terminology rather than substantive claims about the world.

  **1. The Definition of "Rationality"**
  *   **Dispute:** G uses "rational" to mean "dynamically consistent with long-run survival." E uses "rational" to mean "coherent with stated preferences."
  *   **Reformulation:** We agree to distinguish **Instrumental Rationality** (choosing means to achieve a given end) from **Substantive Rationality** (the choice of the end itself).
      *   E claims: Log-maximization is instrumentally rational *if and only if* the end is log-wealth.
      *   G claims: Log-wealth is the only substantively rational end for a persisting agent.
  *   **Residue:** The substantive disagreement remains: Is the end (log wealth) dictated by the structure of reality (G) or by the agent's taste (E)?

  **2. The Definition of "Ruin"**
  *   **Dispute:** G treats ruin as $W_t \to 0$ asymptotically. E treats ruin as $W_t < \text{threshold}$.
  *   **Reformulation:** We agree to use **Hard Ruin** for $W_t < \epsilon$ (game over) and **Soft Ruin** for $W_t \to 0$ (irrelevance).
  *   **Residue:** G argues Soft Ruin is the relevant risk for long-term agents. E argues Hard Ruin is the relevant risk for finite-lived agents. This is a factual disagreement about the agent's time horizon, not just words.

  **3. The Meaning of "Optimal"**
  *   **Dispute:** G calls $f^*$ "the optimal stake." E calls it "the growth-optimal stake."
  *   **Reformulation:** We agree to reserve "Optimal" for the strategy maximizing the agent's actual objective function. We will refer to $f^*$ specifically as the **Growth-Optimal Stake**.
  *   **Residue:** None. This is a terminological alignment.

  ---

  ## 5. APPENDIX: WHAT NEITHER SIDE CLAIMS

  To prevent future strawman arguments, we explicitly disavow the following positions often attributed to our respective camps.

  **Researcher G does NOT claim:**
  1.  That agents *actually* have logarithmic utility functions in a psychological sense.
  2.  That the Kelly criterion guarantees wealth increase in the short run (it does not; drawdowns are expected).
  3.  That one should never take a gamble with negative expected log return (e.g., insurance purchases may be rational for utility reasons even if they reduce geometric growth).
  4.  That parameter uncertainty can be ignored (G explicitly endorses Bayesian shrinkage).

  **Researcher E does NOT claim:**
  1.  That one should maximize expected monetary value ($E[W]$) regardless of risk (E advocates maximizing $E[U(W)]$, which usually implies risk aversion).
  2.  That the Law of Large Numbers does not apply (E accepts the math of convergence but disputes its normative weight).
  3.  That growth is irrelevant (E acknowledges growth is instrumentally useful for achieving utility thresholds).
  4.  That "anything goes" regarding preferences (E requires preferences to be coherent/consistent, merely not restricted to log form).

  **Joint Disclaimer:**
  Neither of us claims that the mathematics of multiplicative processes applies to non-compounding domains (e.g., one-off decisions with no reinvestment). In single-shot decisions, the distinction between time-average and ensemble-average collapses, and our dispute reduces entirely to the specification of the utility function.
