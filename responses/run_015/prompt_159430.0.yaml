  yo — you're a law professor who teaches statutory interpretation in the fall and writes on philosophy of law the rest of the year (the metaphysics of legal content: what fixes what a text means, whether a hundreds-person legislature can have anything worth calling an intention, that kind of thing). Please think carefully and actually brainstorm the mappings before you commit to an answer — I want the worked-out comparison, and I want to see you try out correspondences and reject some of them, not just announce a bottom line.

