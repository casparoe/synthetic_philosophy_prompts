      *   *Arthur:*
          *   *Consensus:* No contemporary evidence. First mentions centuries after supposed life. Likely a composite figure or mythologized war leader.
          *   *Contested:* Is there a specific historical kernel (Riothamus, Ambrosius Aurelianus)? Most historians say "we don't know" or "unlikely to be a single king."

  6.  **Address Question 4: Structural Weaknesses:**
