      *   *Application:*
          *   Arthur = Variation (contradictions accepted).
          *   Exodus = Correction (lack of evidence seen as a problem to solve).
          *   Troy = Middle ground (Site exists, details vary, treated as poetic license).
      *   *Initial Assessment:* This is actually a quite sophisticated insight. It touches on reception history, genre theory, and the sociology of knowledge. It resembles distinctions between "mythos" and "logos" or "sacred history" vs. "secular history."

  3.  **Address Question 1: Does the comparison hold?**
      *   *Arthur:* No archaeological anchor. Purely literary/folkloric.
      *   *Exodus:* Strong textual/religious anchor, weak/no archaeological anchor for the *event* as described.
      *   *Troy:* Strong archaeological anchor (Hisarlik), strong literary anchor (Homer), mismatch in details.
      *   *Critique:* The comparison is slightly asymmetrical. Arthur is primarily literary/romantic. Exodus is primarily theological/national foundational. Troy is epic/archaeological.
      *   *Nuance:* The "community" differs. Arthurians (fans/writers) vs. Believers/Theologians (Exodus) vs. Historians/Classics (Troy). The *stakes* are different. Exodus has religious truth claims; Arthur generally doesn't (in modern context). This affects the "correction" impulse.

  4.  **Address Question 2: Is "Correction vs. Variation" useful?**
      *   *Existing Terminology:*
          *   *Myth vs. History:* Too binary.
          *   *Reception History:* How texts are received over time.
          *   *Harmonization:* Specifically in biblical studies (trying to make contradictions fit).
          *   *Multiform:* In oral tradition (Parry/Lord), variation is expected.
          *   *Historiography:* The methods of writing history.
      *   *Verdict:* It's a useful heuristic for a general audience. It captures the *psychological/sociological* reaction to evidence rather than just the evidence itself. It aligns with "harmonization" in biblical studies but applies it broader. It needs refinement to account for *who* is doing the correcting (believers vs. historians).

  5.  **Address Question 3: Fact-Checking Consensus vs. Contention:**
      *   *Exodus:*
