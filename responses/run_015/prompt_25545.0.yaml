answer: |-
  **Term Paper Proposal**

  **Title:** Beyond the Individual Will: A Joint Commitment Account of Promissory Obligation

  **1. Research Question**
  The central question driving this project is: *What is the source of the normative binding force of a promise?* Specifically, why does the utterance "I promise" transform a mere statement of intention into a moral obligation that another person has the standing to enforce?

  Standard accounts in moral philosophy typically locate the source of this obligation in the individual attributes of the agents involved: the promisor's will, the promisee's expectations, or a social convention both parties recognize. This paper argues that these "individualistic" accounts share a critical blind spot: they attempt to decompose a fundamentally relational normative phenomenon into monadic properties. The research question I will pursue is whether a **Joint Commitment** framework—understood as the creation of a plural subject ("we") rather than an aggregation of two "I"s—can better explain the distinctive directionality and resilience of promissory obligation than individualistic rivals.

  **2. The Problem: The Individualistic Blind Spot**
  To justify the need for a new approach, I will first demonstrate why the three dominant theories fail to capture the phenomenology and normativity of promising. My critique will focus on the inability of these theories to explain the *directed* nature of the obligation (that the obligation is *to* the promisee, not just an obligation *that* the act be performed).

  *   **The Will (Consent) Theory:** This view holds that by promising, I voluntarily assume an obligation. The blind spot here is circularity. As Hume and others have noted, the act of willing an obligation only works if there is already a normative rule that says "willing an obligation creates one." It pushes the question back without answering it. Furthermore, it struggles to explain why I cannot unilaterally release myself from the obligation simply by changing my will. If the obligation stems solely from *my* will, why can't *my* new will revoke it?
  *   **The Expectation (Reliance) Theory:** This view argues that breaking a promise is wrong because it harms the promisee's reliance interests. The blind spot is that this reduces promissory wrongs to generic harms. It fails to explain why breaking a promise feels distinct from merely disappointing a prediction. If I know you expect me to walk your dog, and I don't, I have disappointed you. But if I *promised*, I have wronged *you* specifically. The expectation account misses the special standing the promisee has to demand performance, not just compensation for harm.
  *   **The Practice (Convention) Theory:** This view suggests obligations arise from participating in the social practice of promising. The blind spot is the "private promise" problem. If I make a sincere promise to a friend in a context where social conventions are unknown or irrelevant (e.g., in a vacuum, or to someone from a culture without promising), it still feels binding. If the obligation comes from the social rule, it is unclear why the rule binds us in the absence of social uptake or knowledge.

  The common thread across these failures is **individualism**. They all try to build the obligation out of pieces that exist prior to the relationship (my will, your expectation, a rule I opt into). They miss the possibility that the obligation is constituted *by* the relationship itself.

  **3. Proposed Approach: Joint Commitment and Shared Agency**
  I propose to analyze promising through the lens of **Joint Commitment**, drawing on literature regarding shared agency and plural subjects (e.g., the work of Margaret Gilbert, Michael Bratman, or R. Jay Wallace).

  The core hypothesis is that a promise is not an exchange of individual mental states, but a single normative act performed by two people together. When A promises B, they do not merely align their individual intentions; they create a "pool of wills." This creates a **plural subject**.

  *   **Normative Structure:** In a joint commitment, the obligation is not "I owe it to myself to do X" nor "I owe it to you because you expect X." It is "We are committed to X, and therefore I owe it to *us* (which includes you) to do my part."
  *   **Solving the Blind Spots:**
      *   *Against Will Theory:* I cannot unilaterally rescind the promise because the commitment belongs to the "we," not just the "I." It requires the concurrence of the other party to dissolve.
      *   *Against Expectation Theory:* The wrong is not harm-based but fidelity-based. It is a violation of the shared agency we created. This explains the directedness: I owe it to *you* because you are the other half of the "we" that holds the commitment.
      *   *Against Practice Theory:* The obligation arises from the interpersonal act of committing together, not from an external social rule. This explains why private promises still bind; the "practice" is generated locally between the two agents.

  **4. Methodology and Argument Sketch**
  Given the word count constraints (approx. 3000 words), I cannot exhaustively refute all three rival theories. Instead, I will structure the argument as follows:

  1.  **Introduction (400 words):** Define the problem of promissory obligation and state the thesis: Individualistic accounts fail because they miss the relational ontology of promising; Joint Commitment succeeds.
  2.  **The Critique of Individualism (800 words):** I will focus primarily on the **Will Theory** as the strongest individualistic rival. I will argue that it cannot account for the *inelasticity* of promises (why I can't change my mind). I will briefly note how Expectation and Practice theories suffer from similar reductionist errors regarding the *source* of the norm.
  3.  **The Joint Commitment Alternative (1000 words):** I will outline the mechanics of joint commitment. I will use the concept of "common knowledge" and "mutual responsiveness" to show how a normative bond is created that is distinct from the sum of individual bonds. I will address the "directionality" problem: how joint commitment creates a claim-right for the promisee.
  4.  **Objections and Replies (500 words):** I will anticipate the objection that Joint Commitment is too demanding (does every promise require a complex "we"?). I will argue that even implicit promises instantiate a minimal form of shared agency.
  5.  **Conclusion (300 words):** Summarize how shifting from an individualistic to a relational ontology resolves the binding problem.

  **5. Deliverables**
  The final deliverable will be a 3000-word philosophical essay suitable for submission in a moral philosophy seminar. The paper will include:
  *   A clear thesis statement in the introduction.
  *   Charitable reconstruction of the Will/Individualist view before critiquing it.
  *   A positive account of the Joint Commitment view.
  *   Proper citation of primary texts (to be added during drafting).

  **6. Conditions for Failure**
  This project would fail to meet its objectives if:
  1.  **Reductionism Returns:** If the account of "Joint Commitment" secretly relies on individual commitments (e.g., "We commit" just means "I commit to you and you commit to me"), then it hasn't solved the problem; it has just renamed it. I must show the "we" is ontologically prior to the "I" in this context.
  2.  **Over-intellectualization:** If the theory requires agents to have complex explicit thoughts about "plural subjects" to make a promise, it becomes psychologically unrealistic. I must show that joint commitment can be implicit.
  3.  **Scope Creep:** If I attempt to refute all three rival theories in depth, the paper will become a shallow survey. Success depends on focusing deeply on the *structural* flaw of individualism (using Will Theory as the primary foil) rather than trying to win every historical debate.
  4.  **Normative Gap:** If I explain *how* we form a joint commitment but fail to explain *why* that commitment is morally binding (the "normative leap"), the paper will describe sociology rather than ethics. I must bridge the gap between "we intend" and "we ought."

  ***

  ### **Advisor's Note on Scope and Feasibility (Honest Assessment)**

  *This section is for you, the student, to consider before finalizing the proposal.*

  **Is this too big for a semester paper (3000 words)?**
  **Yes, it is risky.** Here is why:

  3000 words is approximately 10 double-spaced pages. In philosophy, that is a *very* short paper. You are proposing to:
  1.  Explain three complex historical theories (Will, Expectation, Practice).
  2.  Identify a subtle metaphysical/normative blind spot shared by all of them (individualism).
  3.  Explain a complex alternative theory (Joint Commitment/Shared Agency).
  4.  Defend that alternative against objections.

  **The Danger:** In 3000 words, you will likely run out of space before you get to the "Joint Commitment" part. You might spend 2000 words summarizing the other theories, leaving only 1000 words for your actual contribution. That will make the paper look like a book report with a weak conclusion.

  **How to Narrow It:**
  To make this feasible for 3000 words, I strongly recommend you **drop two of the rival theories.**

  *   **Recommendation:** Focus *only* on the **Will (Consent) Theory**. It is the most intuitive individualistic account.
  *   **Revised Title Idea:** *Why I Can't Change My Mind: A Joint Commitment Critique of the Will Theory of Promises.*
  *   **Revised Plan:** Spend 1000 words showing exactly why the Will Theory fails to explain the *inelasticity* of promises (why you can't just revoke them). Spend 1500 words showing how Joint Commitment explains this inelasticity (because the "we" holds the will, not just the "I"). Spend 500 words on a quick objection.

  **Why this is better:**
  1.  **Depth over Breadth:** You look smarter if you crush one opponent thoroughly than if you lightly poke three opponents.
  2.  **Space for Nuance:** Joint Commitment is a tricky concept. You need the word count to explain it clearly without sounding like you are using buzzwords.
  3.  **Clearer Failure Conditions:** It is easier to prove "Joint Commitment explains inelasticity better than Will Theory" than "Joint Commitment solves everything."

  **Final Verdict:**
  The topic is excellent and philosophically mature. The intuition about the "individualistic blind spot" is correct and aligns with contemporary debates (e.g., Margaret Gilbert's work). However, for a 3000-word limit, you must treat this as a **surgical strike**, not a survey. Pick one specific problem (like the right to demand performance, or the inability to unilaterally rescind) and show how Joint Commitment solves that specific problem better than the Will Theory. If you try to solve the whole "nature of promising" in 10 pages, you will likely end up with vague generalizations.

  **Action Item:** If your professor allows, clarify if the 3000 words refers to the *proposal* or the *final paper*. If the final paper is 3000 words, adopt the "Narrowing" strategy above. If the final paper is actually 5000+ words, the original proposal scope is acceptable.
