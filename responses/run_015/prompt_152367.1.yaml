prompt: |-
  I am delivering the eulogy on Saturday for my uncle, who died at seventy-eight after serving twenty-six years on our county council. I am not an academic—I work as a carpenter—but for the past several years I have been thinking on my own about why elections seem to turn representatives into careerists, and my uncle eventually came to share that worry. In the final years of his life he argued, in letters to the local paper and in conversations with me, that selecting council members by lot for single, non-renewable terms would break the cycle in which office-holders come to represent their own survival rather than the people who put them there. He left explicit instructions that his memorial should not praise his long tenure as a form of wisdom or institutional memory, because he had come to see that very longevity as part of the corruption he was describing; he also asked that nothing be said about his watching over us from elsewhere, since he regarded that as false comfort. The audience will be split: about half are family and neighbors who remember him mainly for resolving a zoning dispute and for being present at every school board meeting; the other half includes members of the local democratic-reform circle he joined late in life, people who will recognize references to sortition and to the problem of career politicians. I need a eulogy of roughly ten minutes that can hold both groups without either turning into a lecture on lottocracy or reducing his conviction to a sentimental footnote. The idea should do real structural work: it must shape what I can and cannot say about his life—so I cannot glorify his decades in office, I cannot invoke an afterlife, and I should not present his late change of mind as a simple personal quirk—while still offering comfort to people who are grieving and who are not philosophers. Please write it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**

      *   **Speaker:** Carpenter (uncle's nephew/niece), not an academic. Tone should be grounded, practical, honest.
      *   **Deceased:** Uncle, 78 years old. Served 26 years on county council.
      *   **Key Conflict/Theme:** Uncle became critical of long tenure/career politics late in life. He advocated for sortition (selection by lot) for single, non-renewable terms.
      *   **Constraints/Instructions from Deceased:**
          *   Do *not* praise long tenure as wisdom/institutional memory (he saw it as corruption).
          *   Do *not* mention afterlife/watching from above (he saw it as false comfort).
          *   Do *not* treat his late change of mind as a quirk (it was a core conviction).
      *   **Audience:** Split 50/50.
          *   Group A: Family/neighbors (know him for zoning disputes, school board presence, reliability).
          *   Group B: Reform circle (know him for sortition advocacy, anti-careerist stance).
      *   **Goal:** A 10-minute eulogy (approx. 1300-1500 words spoken at a moderate pace) that bridges these groups without alienating either. It needs to honor his life without violating his specific philosophical constraints.
      *   **Tone:** Comforting but intellectually honest. Grounded in craftsmanship (speaker's profession) as a metaphor.

  2.  **Determine the Core Narrative Arc:**

      *   *Opening:* Acknowledge the loss, establish the speaker's voice (carpenter), and set the stage.
      *   *The "Work" of Politics:* Frame his council service not as "power" but as "labor." Connect carpentry to public service (measuring twice, cutting once, fixing what's broken).
      *   *The Turning Point:* Address his change of heart. This is the tricky part. It can't be "he got wise," it has to be "he saw a flaw in the structure." Use the carpenter metaphor: even a good beam rots if the design is wrong.
      *   *The Reform Idea:* Explain sortition simply, without jargon. Frame it as "fresh eyes" or "duty" rather than "lottery." Connect it to the neighbors' experience (he was one of them).
      *   *The Constraint (No Afterlife):* Address mortality honestly. He is gone. The comfort comes from the work left behind, not his spirit.
      *   *Closing:* A call to action that unites both groups. Fix the house together.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Start with the hands. A carpenter's hands, an uncle's hands. Acknowledge the room's division without making it a divide.
      *   *The Service (26 Years):* How to praise 26 years without praising *longevity*? Focus on the *quality* of the work during that time, not the duration. He showed up. He fixed the zoning issue. He listened.
      *   *The Shift:* Why did he change? He loved the job, but he loved the *community* more. He realized the job was designed to keep him in the chair, not serve the room.
      *   *The Sortition Argument:* Keep it simple. "Drawing names from a hat." Compare it to jury duty. This resonates with neighbors (civic duty) and reformers (sortition).
      *   *The "Watching Over Us" Constraint:* This needs to be handled delicately. "He isn't watching. He built what we have. We have to maintain it."
      *   *Conclusion:* Bring it back to the wood, the structure, the community.

  4.  **Refining the Tone (Self-Correction during drafting):**

      *   *Check:* Am I sounding too academic? *Correction:* Use more workshop language. "Joinery," "load-bearing," "tools."
      *   *Check:* Am I glorifying the 26 years? *Correction:* Frame it as "26 years of evidence." He didn't just serve; he gathered data on why the system fails.
      *   *Check:* Is the reform part too dry? *Correction:* Connect it to the zoning dispute. The neighbors know he fought for them. The reformers know *why* he fought.
      *   *Check:* Is the "no afterlife" part too bleak? *Correction:* Focus on legacy as *material*. The house stands. The work remains. That is comfort enough.

  5.  **Timing and Word Count:**

      *   Average speaking pace is ~130 words per minute.
      *   10 minutes = ~1300 words.
      *   I need to ensure the draft is substantial enough but not rambling.

  6.  **Final Polish:**

      *   Ensure the transition between the "neighbor" view and the "reformer" view is seamless. The bridge is *integrity*.
      *   Make sure the specific instructions (no institutional memory praise, no heaven) are strictly followed.
      *   *Key Phrase:* "He didn't want to be a career. He wanted to be a citizen."

  7.  **Writing the Draft (incorporating the above):**

      *   *Opening:* Hands, wood, tools.
      *   *Middle 1:* The Council work. Not as a king, but as a foreman.
      *   *Middle 2:* The realization. The structure was rotten.
      *   *Middle 3:* The solution (Sortition). Jury duty analogy.
      *   *Ending:* Grief. He is gone. We have the work.

      *(Self-Correction during writing)*: I need to make sure I don't sound like I'm lecturing the family about the reform stuff. It has to be *his* story, not *my* thesis. The reform ideas are *his* final instructions, just like the eulogy instructions.

      *(Refining the "No Afterlife" bit)*: Instead of saying "He isn't in heaven," say "He believed in what we build here." It's more positive.

      *(Refining the "26 Years" bit)*: Frame it as "He gave 26 years to prove a point." That honors the time without honoring the system that kept him there.

  8.  **Final Review against constraints:**
      *   10 mins? (Yes, approx 1400 words).
      *   No careerist praise? (Yes, framed as duty/evidence).
      *   No afterlife? (Yes, focused on earthly legacy).
      *   Both audiences? (Yes, zoning/school mentioned, sortition explained simply).
      *   Carpenter voice? (Yes, metaphors used).

  9.  **Final Polish:** Check rhythm and cadence for spoken delivery. (e.g., short sentences for impact).

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Good morning.

  For those of you who don't know me, I'm [Your Name]. I work with wood. I spend my days measuring, cutting, and joining pieces together to make things that stand up to the weather and the weight of people living inside them. My uncle, [Uncle's Name], spent his days in a different kind of workshop. He worked with people, with laws, with the heavy, often messy structure of this county.

  We are here to mourn him, and to remember him. But if you know him the way I did, especially in the last few years, you know that he left us a set of instructions for this moment. He was a man who believed that if you build something, you have to take responsibility for the blueprint. And he believed that how we remember the dead shapes how the living carry on.

  So, I need to be honest with you. I cannot stand here and tell you that [Uncle's Name]'s twenty-six years on the county council were a testament to the value of experience for experience's sake. He asked me not to say that. In fact, he spent the end of his life arguing that the very length of his service was evidence of a problem, not a virtue.

  I also cannot tell you that he is watching us from somewhere else right now. He found no comfort in that idea, and he didn't want us to rely on false hopes. He believed that when the tools are put down, the work stops. The comfort, he argued, isn't that the carpenter is still in the room. The comfort is that the house he helped build is still standing, and that we know how to repair it when the roof leaks.

  To the family and neighbors here: You remember him for the things he fixed. You remember the zoning dispute on [Street Name/General Area] that seemed impossible until he sat down with both sides and found a line that didn't cut anyone in half. You remember him at every school board meeting, not because he loved the bureaucracy, but because he believed showing up was the rent you pay for living in a community.

  To the friends from the reform circle: You remember him for the letters to the editor, for the late-night conversations about sortition, about the danger of career politicians, about the need to break the cycle.

  These are not two different uncles. They are the same man, looking at the same structure from two different angles.

  In my trade, if a beam sags, you don't just prop it up forever. Eventually, you have to ask if the beam is too long for the span, or if the design itself is wrong. For twenty-six years, my uncle served as a council member. He was good at it. He was diligent. But he began to realize that the system was designed to keep him in the seat, rather than to ensure the seat was serving you.

  He saw that when you hold office for too long, your job subtly shifts. You stop working for the people who put you there, and you start working to keep the job itself. You become a professional representative, rather than a neighbor who represents. He told me once, "I stopped feeling like a citizen and started feeling like an incumbent. And I didn't like the view from there."

  That is why, in his final years, he argued for selection by lot. I know that sounds strange to some of you. Drawing names from a hat? For the county council?

  But think about it in terms of duty. Think about jury duty. We trust ordinary citizens to decide matters of life and liberty in a courtroom because we believe that a cross-section of the community, serving a single term, will act with more integrity than a career lawyer looking for a vote. My uncle believed the same should apply to the budget, to zoning, to our schools.

  He didn't want to be a career. He wanted to be a citizen.

  He argued that if you select council members by lot, for a single term that cannot be renewed, you change the incentive. You can't campaign for the next election. You can't curry favor with donors for your future. You just have to do the work, for the time you have, and then go back to being a neighbor.

  To the neighbors here: This wasn't an abstract theory for him. It was born out of the zoning dispute you remember. He realized that the only reason that dispute got so tangled was because the people deciding it had been in power for twenty years and were worried about how the decision would look in the next cycle. If it had been a group of regular people, serving a single term, they would have just asked: "Is this fair? Does this work?" and they would have voted.

  To the reform friends here: He knew this idea was radical. But he also knew it was practical. He wasn't asking for a utopia. He was asking for a system that acknowledged human nature. He knew that power, like moisture, rots wood if it sits in one place too long.

  I know some of you are grieving because you feel a loss of protection. You feel like the person who always answered the phone is gone. That is true. He is gone. And he wouldn't want me to soften that blow.

  There is no safety net coming from above. There is only the structure we have built together, and the tools he left in our hands.

  He taught me that craftsmanship isn't about making things perfect. It's about making things true. A joint doesn't have to be pretty, but it has to be square. If it's not square, the whole wall leans. He saw that our democracy was leaning. He spent his last years trying to hand us a level.

  So, how do we honor him?

  We do not honor him by treating his twenty-six years as a golden standard that no one else can reach. We honor him by acknowledging that twenty-six years is too long for one person to hold that much trust.

  We do not honor him by waiting for him to solve problems from beyond the grave. We honor him by solving them ourselves.

  For the family: You honor him by being present. He was at every school board meeting not because he loved the fluorescent lighting, but because he knew that if good people stay home, the room fills up with people who have other agendas. Show up. Not to build a career, but to build the community.

  For the reformers: You honor him by keeping the argument alive, but keeping it grounded. Don't let this become just another intellectual debate. Keep it about the neighbor. Keep it about the zoning dispute. Keep it about the feeling that the government belongs to the people who live here, not the people who work there.

  My uncle was a carpenter of public life. He spent twenty-six years learning the grain of the wood. And in the end, he told us that the wood was sound, but the design needed to change.

  He is not watching us. He is not waiting for us in a better place. He is here, in the work we haven't done yet. He is in the empty seat at the council table that he argues should be filled by someone else, someone who has never held power before. He is in the instruction to not let comfort override truth.

  Grief is heavy. It feels like carrying a load of lumber up a ladder alone. But the thing about a community—the thing he fought for—is that you don't have to carry it alone.

  He left us a blueprint. It calls for a government of neighbors, not careerists. It calls for service that ends, so that new eyes can see. It calls for us to accept that we are mortal, that our time is limited, and that the only thing that lasts is the integrity of the structure we leave behind.

  I will miss him. I will miss his hands, rough from work and from shaking thousands of yours. I will miss his voice, which got quieter in age but sharper in truth. But I will not look for him in the sky. I will look for him in the work.

  If you want to pay tribute to [Uncle's Name], do not plant a tree in his memory and walk away. Go to the next council meeting. Sit in the back. Listen. Ask yourself: "Are these people serving me, or are they serving their own retention?" And if you think the design is wrong, have the courage he had to say so.

  He built a good life. He left us a sounder house than he found. But the roof needs shingling, and the foundation needs checking. He put down his tools. It is our turn to pick them up.

  Thank you.
