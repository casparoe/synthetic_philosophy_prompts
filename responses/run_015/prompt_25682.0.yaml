answer: |-
  ### 1. Dependency Structure (The Logical Sequence)

  Do not teach this chronologically (Clifford then James). Teach it conceptually. If you teach Clifford's principle first without the motivation, it looks like arbitrary dogmatism. If you teach James's exception first, it looks like license.

  **Sequence:**
  1.  **Belief is Action-Guiding.** (Premise for both). Students must accept that beliefs aren't just internal pictures; they drive behavior.
  2.  **Actions Have Social Consequences.** (Clifford's Lever). Before introducing the ethics, establish that my beliefs affect *your* safety/wellbeing.
  3.  **The Duty to Avoid Harm.** (Clifford's Conclusion). Because beliefs drive actions that affect others, we have a moral duty to ensure beliefs are reliable. *This establishes the default position.*
  4.  **The Epistemic Gap.** (James's Lever). Introduce scenarios where evidence is inherently unavailable *before* the belief is adopted.
  5.  **Belief as Truth-Making.** (James's Conclusion). In Gap scenarios, withholding belief guarantees failure; believing makes the truth possible.
  6.  **The Conflict of Maxims.** (The Synthesis). Clifford prioritizes *Avoiding Error*; James prioritizes *Gaining Truth*. The debate is not about evidence vs. no evidence, but which risk is worse: believing falsely or missing a truth.

  **Why this order:** You cannot understand James's "right to believe" until you feel the weight of Clifford's "duty to inquire." If you start with James, students think philosophy is about validating feelings. If you end with Clifford, they think philosophy is about paralysis.

  ---

  ### 2. The Carrying Example

  **Do not rely solely on Clifford's Shipowner.**

  **Why the Shipowner is insufficient:**
  The Shipowner case is about **negligence**, not **evidentialism**. The shipowner *had* access to evidence (the ship's condition) and suppressed it. Students will correctly intuit that fraud is wrong. This makes Clifford's principle look like "don't be reckless," which James actually agrees with. It fails to illuminate James's core point: that there are cases where evidence is *impossible* to get beforehand.

  **The Replacement/Supplement: "The Ambiguous Ally"**
  Use a high-stakes collaboration scenario.
  *   **Scenario:** You and a partner must defuse a device. You cannot communicate. You must both cut a wire simultaneously. You have no data on whether your partner is competent or loyal.
  *   **Clifford's View:** Suspend judgment. Do not cut. To believe they are competent without evidence is reckless; if you are wrong, you both die. The duty is to avoid the risk of false belief.
  *   **James's View:** This is a "Genuine Option." If you suspend belief, you *guarantee* failure (the device goes off). If you believe they are competent, you create the possibility of success. The belief itself is a necessary condition for the truth (survival) to obtain.

  **Why this works:** It captures Clifford's worry (harm to others/self via rashness) and James's worry (paralysis leads to guaranteed loss). It moves the debate from "ignoring data" (Shipowner) to "acting without data" (James's actual target).

  ---

  ### 3. Predictable Misconceptions & Preemption

  **Misconception 1: "The whole debate is really about religion."**
  *   **When it crystallizes:** Minute 5. As soon as you mention William James or "faith," students will tune out, assuming this is theology.
  *   **How to preempt:** In your opening framing (Minute 0–5), explicitly bracket religion. Say: *"James uses religious belief as his primary example, but his argument is structural. If his argument works, it applies to love, politics, and scientific risk-taking. If it fails, it fails for religion too. We are testing the structure, not the theology."*

  **Misconception 2: "Clifford is just a dogmatic skeptic who says 'never believe anything'."**
  *   **When it crystallizes:** Minute 15. When you state Clifford's principle ("It is wrong always... to believe... upon insufficient evidence"). Students hear "insufficient evidence" as "no evidence."
  *   **How to preempt:** Immediately clarify the definition of "sufficient." Say: *"Clifford is not asking for certainty. He is asking for proportional belief. If you have 60% evidence, you can have 60% confidence. He is forbidding 100% confidence on 60% evidence. He wants truth, not suspension."*

  **Misconception 3: "James thinks you can believe whatever you want."**
  *   **When it crystallizes:** Minute 35. When you introduce the "Will to Believe." Students will hear "Will" and think "wishful thinking."
  *   **How to preempt:** Before explaining James's exception, list his constraints (The Genuine Option). Say: *"James does not give a blank check. He sets three strict conditions: the option must be Living, Forced, and Momentous. If you can wait for evidence, James agrees with Clifford. He only permits belief ahead of evidence when waiting is impossible."*

  ---

  ### 4. The Final Check Question

  Do not ask "Who is right?" or "Do you agree with James?"

  **Ask this:**
  > "Describe a specific scenario where Clifford and James would recommend the **same action**, but for **different reasons**."

  **Why this works:**
  *   It forces them to understand the *scope* of each argument. (e.g., In a standard scientific claim where evidence is available, both say "wait for evidence." Clifford says it because it's always wrong not to; James says it because it's not a 'forced option'.)
  *   It tests if they grasp the *principles* rather than just the conclusions.
  *   It prevents side-taking.

  ---

  ### 5. What to Refuse to Cover

  **1. The Meta-Epistemology of "Justification."**
  *   **Why:** First-years do not have the machinery to distinguish between deontological, reliabilist, or pragmatist theories of justification.
  *   **Refusal Strategy:** If a student asks, "But what *counts* as evidence?", reply: *"For this debate, assume 'evidence' means public, shareable data. The debate isn't about defining evidence, but about what to do when it runs out."*

  **2. The Technical Definitions of "Living, Forced, and Momentous."**
  *   **Why:** Parsing the logical nuances of "forced" (is it logically forced or psychologically forced?) will eat 20 minutes and obscure the ethical core.
  *   **Refusal Strategy:** Treat these as intuitive heuristics. *"Living means it matters to you; Forced means you can't choose neither; Momentous means it's a unique opportunity. Don't get bogged down in edge cases."*

  **3. Pascal's Wager.**
  *   **Why:** It introduces decision theory and infinite utility, which distracts from the ethics of belief. James explicitly distinguishes his view from Pascal's.
  *   **Refusal Strategy:** *"James is not making a bet about rewards; he is making a claim about the nature of truth. We are leaving Pascal out to keep the focus on epistemic duty."*
