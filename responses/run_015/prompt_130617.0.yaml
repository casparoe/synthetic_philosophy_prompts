  ### The Three Rules of the Record

  To navigate this decision, we must articulate the principles that have silently governed our five precedents. These rules are not abstract ideals but operational constraints derived from our own minutes.

  **1. The Chain of Custody Rule (History)**
  *An object's authority derives from its material continuity and documented history, unless that continuity is functionally impossible or conceptually authorized by the creator.*
  *   **How it survives the precedents:** It explains why we value the original codex (2) and reject the unprovenanced forgery (3). It accommodates the roof (5) because structural function overrides material continuity, and the artist re-creation (4) because conceptual authorization (the artist) overrides material loss. It accepts the altarpiece copy (1) because its 150-year presence has generated a new historical chain of custody.

  **2. The Legibility Rule (Experience)**
  *The viewer must be able to distinguish between original and substitution through available information, unless that distinction undermines the object's intended function.*
  *   **How it survives the precedents:** It demands labels for the copy (1), the codex facsimile (2), and the re-creation (4). It explains the rejection of the forgery (3), where the condition was to *conceal* the distinction. It permits the unmarked roof timbers (5) because marking them would undermine the visual and structural integrity of the building—its function.

  **3. The Integrity Rule (Office)**
  *The museum's duty to preserve the original and maintain institutional credibility outweighs the desire for aesthetic completeness, provided the educational remit is met.*
  *   **How it survives the precedents:** It justifies vaulting the codex (2) and declining the forgery (3) to protect credibility. It allows the copy (1) and re-creation (4) only because they serve the educational remit without compromising credibility (via labeling). It accepts the roof (5) because the "office" of the building is to stand, not to be a museum object.

