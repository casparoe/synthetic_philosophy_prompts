  **JOINT STATEMENT OF PARTIAL AGREEMENT REGARDING UNILATERAL ACTION PROTOCOLS**

  **TO:** The Oversight Body
  **FROM:** Dr. Elena Voss; Dr. Marcus Reid
  **DATE:** October 14, 2023
  **SUBJECT:** Resolution of Dispute on Unilateralist's Curse Mitigation

  **I. AGREED CLAIMS**

  1.  **Shape of the Case:** We agree the argument concerns acts where net value is positive if performed by few agents ($<k$) and negative if performed by many ($\ge k$), undertaken by agents whose value judgments are imperfectly correlated, and where no corrective feedback is available to the individual actor prior to completion.
  2.  **Scope of Application:** This framework applies only to voluntary actions with catastrophic tail risks where existing legal or institutional coordination mechanisms are absent. It does not govern routine coordination, mandated compliance, or actions where harm is immediate and independent of aggregate volume.
  3.  **Cost of Norms:** We agree that any proposed norm imposes compliance costs, including delayed beneficial action and suppressed information sharing. For a norm to be adopted, its reduction in expected catastrophic harm must exceed the expected value of actions suppressed by the norm plus the overhead of maintaining the norm itself.

  **II. REMAINING DISAGREEMENTS**

  | Issue | Dr. Voss's Position | Dr. Reid's Position | Type |
  | :--- | :--- | :--- | :--- |
  | **Source of Constraint** | Agents bear a pro tanto moral duty to defer to the consensus of the relevant epistemic community before acting. | Agents bear no special duty; the risk of correlation is merely a parameter to be priced into private expected-value calculations. | Substantive |
  | **Nature of Violation** | Acting without deference constitutes misconduct, regardless of the outcome, because it violates the coordination protocol. | Acting without deference constitutes error only if the calculation was flawed; a correct calculation may justify unilateral action. | Substantive |
  | **Mechanism** | A norm of deference creates a focal point that reduces the probability of multiple agents acting independently. | Better calibration of priors regarding other agents' actions achieves the same reduction without requiring a new moral norm. | Verbal |

  **III. ADJUDICATION CRUXES**

  We agree that the following empirical or theoretical inquiries bear directly on our disagreement. We commit to updating our positions based on the outcomes described below.

  | Crux | Accepted Study / Simulation / Episode | Dr. Voss's Prediction | Dr. Reid's Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Endogenous Population Growth** | **Simulation:** An agent-based model where the pool of potential actors expands as a function of public deliberation about the risk. | A norm of open deliberation increases the risk pool faster than a norm of deference reduces action rates; secrecy/deference is safer. | Open calibration reduces judgment error ($\epsilon$) faster than pool growth increases risk; transparency is safer. |
  | **2. Human Calibration Capacity** | **Study:** Behavioral economics experiments on common knowledge games with hidden correlation structures. | Agents systematically underestimate correlation and will fail to price the curse into EV calculations without a normative heuristic. | Agents can learn accurate priors regarding correlation given sufficient feedback loops and training. |
  | **3. Historical Precedent** | **Episode:** The 1975 Asilomar Conference on recombinant DNA (voluntary moratorium vs. individual risk assessment). | The success of Asilomar relied on the explicit norm of deference to the collective moratorium, not individual calculation. | The success of Asilomar relied on scientists individually updating their EV calculations based on shared data, not blind deference. |

  **SIGNATURES**

  __________________________
  Dr. Elena Voss

  __________________________
  Dr. Marcus Reid
