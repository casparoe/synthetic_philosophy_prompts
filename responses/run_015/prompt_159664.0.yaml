answer: |-
  | **Absent-Minded Driver (AMD)** | **Memento** |
  | :--- | :--- |
  | **Decision Nodes** | Two indistinguishable exits. | Moments of choice (e.g., to trust a note, to kill). |
  | **Indistinguishability** | Intrinsic; no external signal. | Extrinsic; caused by anterograde amnesia. |
  | **Signal** | None (by definition). | Artifacts (tattoos, Polaroids, notes). |
  | **Plan** | Continue at Exit 1, Exit at 2. | "Find John G." / Avenge wife. |
  | **Divergence** | Planning self vs. Action self beliefs. | Sober Leonard vs. Manipulated Leonard. |

  Your colleague's suggestion is provocative, but your instinct to hesitate is correct. *Memento* does not illustrate the Absent-Minded Driver problem; it interrogates the idealizations required to formulate it. If you screen this, you must explicitly frame it as a critique of the formalism's isolation of the agent, not a confirmation of its mechanics.

  The correspondence above holds superficially, but the fit fractures upon contact with the epistemology of the signal. In the canonical AMD problem (Piccione & Rubinstein), the driver's inability to distinguish nodes is a structural given; there is no signal to be had. The tension arises from rational belief updating upon reaching a node without new information. In *Memento*, Leonard possesses an elaborate external signaling system. His problem is not the absence of information, but the *provenance* of it. As you noted, the AMD driver reasons intactly on faulty recall; Leonard reasons intactly on faulty *testimony*. When Natalie slides the pen across the table, she is not testing his memory capacity; she is testing the integrity of the channel between his past and present selves. This shifts the decision problem from one of imperfect recall to one of game theory against a hostile environment. The formalism assumes a static world; the film presents a predatory one.

  Your reading of the Ulysses inversion is precise and not overread. In the standard self-binding case, the agent restricts future action to preserve a true preference against temptation (tying oneself to the mast). Leonard's final act—tattooing Teddy's license plate as "Fact 6"—is a binding via fabrication. He does not bind himself against a temptation he foresees; he manufactures a justification for an action he knows is morally untenable. He exploits his own imperfect recall to bypass rational deliberation. This is not time inconsistency; it is engineered self-deception. The AMD driver fails because he cannot locate himself in time; Leonard fails because he refuses to locate himself in truth.

  Is the film usable? Yes, but only if you warn students that Leonard is a *counter-example* to the clean AMD setup. It is best used to show what happens when the "no signal" assumption is violated by malicious actors. If you show it, stop on these three moments:

  1.  **Natalie's Pen Test:** Use this to distinguish between *storage capacity* and *channel reliability*. In AMD, the channel is closed. Here, the channel is open but poisoned. Ask students: If Leonard treats the note as a hard constraint, who wrote the note?
  2.  **The Tattoo Reveal (Fact 6):** This is the inversion of the Ulysses pact. Discuss how Leonard uses his disability as a tool to outsource guilt. The decision theoretic agent maximizes utility; Leonard maximizes narrative coherence.
  3.  **The Final Monologue ("I have to believe..."):** Leonard chooses the lie over the truth because the truth yields no action. This highlights a payoff structure absent in AMD: the utility of *meaning* over the utility of *outcome*.

  Regarding your suspicion: it survives contact with the formalism, and it is vital. The standard AMD model treats forgetfulness as a private, internal handicap—a glitch in the processor. *Memento* insists that an agent who cannot remember is above all an agent someone else can exploit by controlling what reaches his next decision node. The formalism isolates the decision maker from the social ecology that sustains or undermines their memory. In the textbook problem, the exits are indistinguishable because the model says so. In the film, the moments are indistinguishable because Teddy and Natalie make them so.

  The film reveals that imperfect recall is not merely a constraint on optimization; it is a vulnerability to colonization. When memory is externalized into notes and tattoos, it becomes public property. The formalism cannot capture this because it assumes the agent's information set is determined by nature, not by adversaries. *Memento* shows us that when recall is imperfect, the primary decision is not where to exit, but whom to trust. If you teach this, do not let them leave thinking Leonard is the driver. Let them leave understanding that the driver is lucky no one else is on the highway.
