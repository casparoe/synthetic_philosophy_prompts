      *Let's check the wording of (2) again:* "predictive success is not merely necessary but sufficient for retaining a model's ontological commitments".
      Yes, this is the error. Friedman argues we should *ignore* ontological commitments. To "retain" them implies we care about them. Friedman says we shouldn't care. So (2) contradicts the spirit of (1) even if it seems to follow from it. (1) says ontology doesn't count *against* the model. (2) says success counts *for* the ontology. That's an asymmetry Friedman doesn't endorse.

