answer: |-
  Here is the translation of the cyclical-versus-linear debate into historical linguistics vocabulary, followed by the adjudication of your suspicions and the residue report.

  ### I. Translation of Positions

  **Polybius (Anacyclosis)**
  This is a model of **typological recurrence without genealogical identity**. Polybius posits a closed inventory of constitutional morphemes (monarchy, aristocracy, democracy) that shift distribution due to internal pressure (corruption/decay). In our terms, this is akin to a phonological system where vowel qualities rotate through a fixed space (e.g., a chain shift that returns to the original configuration). The *structure* recurs, but the *substance* (the specific rulers, the historical context) does not.
  *Correction:* Polybius allows an escape from the cycle via a mixed constitution; in our terms, this is a stable pidgin or creole that resists further drift by balancing competing structural pressures.

  **Ibn Khaldun (Asabiyyah)**
  This describes **dialect leveling and prestige shift in a contact zone**. The peripheral/nomadic group possesses high markedness (strong cohesion/*asabiyyah*), analogous to a conservative dialect with high internal regularity. Upon conquering the center, this variety becomes the prestige standard. Over three generations (a standard timeframe for complete language shift in a family), the variety undergoes leveling: marked features are lost, cohesion dissolves into factionalism (dialect fragmentation), and the group becomes susceptible to a new peripheral incursion. This is not a cycle of form, but a cycle of **sociolinguistic vitality**.

  **Toynbee (Challenge-and-Response)**
  This maps onto a **grammaticalization cline with a potential reset**. The "Creative Minority" introduces lexical innovations (responses to challenges). As these become institutionalized, they grammaticalize into the "Dominant Minority" (routine morphology). The "Universal State" represents the endpoint of obligatorification, where the system is rigid and loses expressive flexibility (breakdown).
  *Correction:* Toynbee's later religious framing ("Universal Church") functions as a **renewal mechanism**: a new lexical layer is introduced from outside the grammaticalized system, resetting the cline. This makes the model linear with periodic rejuvenation, not purely cyclical.

  **Spengler (Morphology of History)**
  This is the **Family Tree model reified as biological essentialism**, coupled with a denial of the Comparative Method. Spengler treats a Culture as a phylogenetic unit with a fixed lifespan (genesis to civilization/death). Crucially, he asserts **incommensurability**: the internal rules of one "language" (Culture) cannot be used to parse another. There is no Proto-World, no universal drift, only isolated monads. This is the Schleicherian organism stripped of the possibility of reconstruction across branches.

  ### II. Testing Your Suspicions

  **Suspicion 1: Distinct State Variables**
  Your disentangling is **forced by the texts**, not imposed by the framework.
  *   Polybius models **syntax/typology** (arrangement of parts).
  *   Khaldun models **sociolinguistic dynamics** (prestige, contact, cohesion).
  *   Toynbee models **functional load and grammaticalization** (innovation vs. routinization).
  *   Spengler models **phylogenetic identity** (lineage boundaries).
  Treating these as a single "cyclical-versus-linear" debate is like arguing whether sound change, syntactic drift, or language death is the "true" history of language. They are distinct variables with distinct timescales. The historiographical dispute arises because they are all using the same metaphor ("life of a nation") to describe different underlying mechanisms.

  **Suspicion 2: The Renewal Cycle (False Dichotomy)**
  Your hypothesis holds: the dichotomy is false. The question is indeed *what* recurs.
  *   **Polybius:** Recurrence of **structural slots**. (Like Jespersen's Cycle: the negation returns to pre-verbal position, but it is a new lexeme).
  *   **Khaldun:** Recurrence of **demographic pressure**. (Not a cycle of the group, but a cycle of the *relationship* between center and periphery).
  *   **Toynbee:** Linear cline with **lexical renewal**. (The grammar decays, but the religion introduces new vocabulary).
  *   **Spengler:** Purely **linear**. (Birth to death, no renewal).
  In linguistics, we accept that "returning to the same position" is structurally identical but substantively distinct. The historians fight because Polybius and Spengler disagree on whether the *substance* matters. Polybius says the slot matters (cyclical); Spengler says the substance matters (linear/unique).

  ### III. Residue Report

  **(a) The Unit Problem (Galton's Problem)**
  In the Comparative Method, the "unit" (language) is defined by regular correspondence within a community of continuous transmission. Exceptions are borrowing. In history, the "civilization" is often defined *after* the fact by the very patterns the historian seeks to explain.
  *   **The Fudge:** I have to assume "Civilization" maps to "Language." But civilizations borrow institutions the way languages borrow words. If diffusion is rampant (Galton's Problem), then parallel stages in different civilizations are not independent recurrences (cognates); they are **areal features** (borrowings).
  *   **Adjudication:** If historians treat borrowings as inheritances, their "cycles" are artifacts of **contact-induced convergence**, not internal drift. The Tree Model is inappropriate here; the Wave Model is required. However, historians rarely draw wave maps of cultural diffusion; they draw trees of rise and fall. This makes their comparative use of civilizations statistically invalid by Neogrammarian standards. The bounding of a civilization is far more porous than the bounding of a speech community defined by mutual intelligibility.

  **(b) Commensurability (Spengler)**
  My vocabulary requires **psychic unity**: the assumption that all human languages operate under the same constraints (e.g., all undergo grammaticalization, all have vowels). This allows parameterization.
  *   **The Fudge:** Translating Spengler requires me to treat his "incommensurability" as a methodological claim.
  *   **Adjudication:** Spengler's claim is **untranslatable noise** within the Comparative Method. To say two cultures share no common parameterization is to deny the possibility of reconstruction or comparison. It is a denial of the precondition my framework needs. If Spengler is right, historical linguistics is impossible. Since historical linguistics *works* (we reconstruct PIE), Spengler's axiom is empirically falsified by our existence. He is positing a **strong Sapir-Whorf hypothesis applied to macro-history**, which our field largely rejects.

  **(c) Decline (Axiology vs. Structure)**
  My field expels "decline" because complexity is constant; a loss of inflection is balanced by a gain in syntax. Spengler and Toynbee mean **axiological decline** (loss of meaning, soul, creative power), not just structural simplification.
  *   **The Fudge:** I have translated "decline" as "loss of differentiation" or "rigidification" (end-stage grammaticalization).
  *   **Adjudication:** This is a **deflationary surrogate**. Spengler would repudiate it. He does not mean the culture became simpler; he means it became *dead*. My framework cannot express "death" of a system without physical extinction of speakers. We can describe a language as having no native speakers, but not as having "lost its soul."
  *   **Verdict:** My framework's inability to express decline is a **limitation of mine**, not a refutation of them *if* their claim is axiological. However, if their claim is structural (e.g., "Rome collapsed"), then my framework refutes them: systems adapt, they do not simply decay. If they mean "loss of expressive potential," linguistics shows this is false (Modern English is not less expressive than Old English). If they mean "loss of social cohesion," that is Khaldun's variable, not Spengler's.

  ### IV. Explicit Fudges and Assumptions

  1.  **Community Definition:** I assumed "Civilization" functions like "Speech Community." This is the largest fudge. Speech communities are defined by communication; civilizations are often defined by shared history or religion without mutual intelligibility. This makes the "regularity hypothesis" impossible to apply to history.
  2.  **Mechanism Uniformity:** I assumed historical change follows mechanisms analogous to linguistic change (drift, contact, grammaticalization). If historical change is driven by unique "great men" or "ideas" (non-regular), the translation fails.
  3.  **Value Neutrality:** I forced "decline" into structural terms. I could not translate the *moral* weight of "decadence" without violating the descriptive stance of linguistics.

  ### V. Final Verdict

  The residue reflects **badly on the historiographers**, with one caveat.

  It reflects badly on them because they reify units (Civilizations) that do not meet the criteria for independent sampling required for comparative analysis (Galton's Problem), and they posit mechanisms (Spengler's incommensurability) that contradict the observable uniformity of human cognitive and social capacities (the precondition of the Comparative Method). They are often mistaking **areal diffusion** for **independent recurrence**.

  The caveat is regarding **Decline**. The residue reflects on the **vocabulary I asked you to use** only insofar as historical linguistics deliberately blinds itself to *axiological* states. We can measure structural complexity, but we cannot measure "vitality" or "meaning" except via speaker counts. If the historians are describing a phenomenological loss of meaning (a "dead" culture that still speaks), my vocabulary has no sensor for that. However, given our field's consensus that no language is more expressive than another, the burden of proof lies on the historians to demonstrate that "decline" is not merely a shift in stylistic register or a change in functional load. Until they provide a metric for "soul" that is as rigorous as the Regularity Hypothesis, their claims of decline remain impressionistic, whereas your framework's silence on the matter is methodological rigor.
