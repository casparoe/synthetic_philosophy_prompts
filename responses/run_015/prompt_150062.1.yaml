answer: |-
  The disappearance of formal duelling among British officers and gentlemen between the 1820s and 1860s serves as a rigorous test case for the theories of Bernard Williams and Kwame Anthony Appiah regarding moral change. To apply their frameworks, we must first delineate the specific 'honour world' in question. In the 1820s, this world consisted of a overlapping triad: the aristocratic landed gentry, the officer corps of the British Army, and the political elite in Parliament. For this peer group, honour was a form of social currency convertible into political influence, military command, and marital prospects. The practical options for an officer accused of cowardice or insult were binary and high-stakes: accept the challenge and risk physical death or legal execution, or refuse and face social death (ostracism, loss of commission, exclusion from clubs). In this equilibrium, the cost of refusal outweighed the cost of fighting, because the honour world controlled the mechanisms of survival; legal liability was theoretically present but practically nullified by the expectation of royal clemency and jury nullification.

  Appiah's model suggests this honour world becomes unsustainable when the costs of maintaining the code exceed the benefits for the status group. The historical record between 1840 and 1860 shows a precise recalibration of these costs. First, the State altered the legal payoff matrix. In the 1840s, Parliament and the Crown ceased the automatic shielding of duellists from criminal liability; prosecutions became more frequent, and clemency was withheld in high-profile cases. This raised the material cost of duelling from a manageable risk to a career-ending liability. Second, the Crimean War (1853–1856) exposed the incompetence of leadership based solely on aristocratic patronage, accelerating a shift toward bureaucratic, examination-based promotion (codified shortly after in the Northcote-Trevelyan reforms). This changed the benefit structure: status was no longer secured primarily by demonstrating personal bravery to peers, but by demonstrating administrative competence to the State. An officer who killed a rival in a duel was no longer a bold defender of reputation; he was a liability to the regiment's efficiency and a criminal in the eyes of the promotion board.

  Williams's thesis—that moral collapse is driven by shifts in social standing rather than explicit argument—is strongly supported by the evidence regarding parliamentary rhetoric. Evangelical and humanitarian groups had argued against duelling on moral and religious grounds for decades prior to 1820 with little effect. The decline only accelerated when the practice became incompatible with the material interests of the elite. The rhetorical shift in Parliament during the 1840s, labeling duelling 'barbaric,' was not the cause of the change but a ratification of it; the rhetoric became safe only once the social cost of duelling had already risen due to legal and bureaucratic reforms. The officers did not stop duelling because they were convinced by moral argument; they stopped because the 'gentleman' identity was being redefined from 'warrior-aristocrat' to 'imperial servant,' and the latter identity could not sustain the former's practices without self-sabotage.

  However, applying this historical pattern back onto the theory reveals significant silences in the Williams-Appiah framework. Both theorists tend to treat the honour world as a closed social system where change arises from internal contradictions or shifting peer evaluations. The British case demonstrates that honour worlds are vulnerable to external institutional mediation. The State did not merely wait for the social costs to rise organically; it actively legislated the cost structure through stricter prosecution and restructured the reward system through military reform. Williams and Appiah anticipate a transition mediated by peer-to-peer status loss, but here the status loss was engineered by institutional reform that 'outsourced' vindication from the pistol to the court-martial and the promotion board. The theory risks underestimating the capacity of centralized institutions to dismantle local ethical cultures by altering the material infrastructure of prestige.

  Furthermore, the case suggests that honour is not simply abandoned, as Appiah might imply when an honour world collapses, but is often transferred to legal and bureaucratic structures. The demand for vindication did not vanish; it was sublimated into a demand for due process and professional recognition. The 'courage' required of a gentleman migrated from physical risk-taking to the endurance of bureaucratic discipline and the integrity of public service. This nuances the claim that moral revolutions require a prior change in interests. In this instance, the change in interests (career security via meritocracy) was imposed by institutional reform, which then forced a change in the internal logic of honour. It was not that honour shifted independently, nor that interests shifted naturally; rather, the State redefined what counted as a 'benefit' within the honour economy. The theory correctly identifies that moral argument was secondary, but it is silent on how external powers can rewrite the ledger of honour itself.

  Summary: The decline of British duelling confirms Williams and Appiah's claim that material interests drive moral change more than rhetoric, but requires amending their framework to account for how state institutions can actively reconfigure the cost-benefit analysis of honour rather than merely observing its internal decay.
