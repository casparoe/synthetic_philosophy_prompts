prompt: |-
  I'm fluent in dependent type theory and proof-relevant semantics, and I want the epistemicism versus supervaluationism debate about vagueness translated into that vocabulary, with an honest residue report. Treat the vague predicate "is bald" or "is a heap" as analogous to a membership judgment in a Martin-Löf-style system. For epistemicism in the Williamson vein: there is a sharp, hidden boundary—a precise cutoff—such that every instance is determinately in or out, but our epistemic access is limited. Translate this into type-theoretic terms. Does the hidden boundary correspond to an unknown parameter fixed in every model, to an oracle that decides membership, or to a canonical proof term that exists but is not constructively available? Specify exactly what "ignorance" means when the logic is proof-relevant rather than classical.

  For supervaluationism in the Fine/Keefe vein: there is no single correct precisification; "John is bald" is true if true on all admissible sharpenings, false if false on all, and otherwise indeterminate. Translate this into the framework of type refinements or multi-valued judgments. Does "admissible precisification" map onto different consistent extensions of an inductive type definition? Does indeterminacy become the absence of a canonical proof term across all refinements, or does it require a genuinely proof-irrelevant layer that the system rejects?

  Now the residue: for each view, say (1) what translates cleanly, (2) what must be distorted—e.g., does epistemicism's bivalence require smuggling in classical excluded middle that proof-relevant semantics avoids? Does supervaluationism's "admissible" collapse into gradual typing or parameterized polymorphism, losing its specifically vagueness-related content?—and (3) what has no expression at all, such as whether the sorites tolerance principle corresponds to a type-checking rule or to something else entirely. Assess whether the untranslatable residue reveals a limitation of the type-theoretic framework or an unclarity in the original philosophical claim.

  Finally, evaluate a hybrid I have been considering: a "constructive epistemicist" view on which there is indeed a sharp boundary, but it is not hidden behind mere ignorance—rather, it is constructively undefined because the inductive definition of the predicate supplies no decision procedure, and different constructively valid extensions assign different cutoffs. Within this vocabulary, is that a coherent third option, or does it collapse into supervaluationism because the "extensions" just are the admissible precisifications? Be specific about whether the framework can distinguish epistemic ignorance from constructive underdetermination, or whether the residue shows that the distinction cannot be maintained without importing assumptions foreign to type theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Target Audience:** Fluent in dependent type theory (DTT), Martin-Löf Type Theory (MLTT), proof-relevant semantics.
      *   **Task:** Translate the Epistemicism vs. Supervaluationism debate on vagueness into DTT vocabulary.
      *   **Specifics:**
          *   Treat vague predicates (e.g., "is bald") as membership judgments ($a : A$).
          *   **Epistemicism (Williamson):** Sharp hidden boundary. Translate to unknown parameter, oracle, or non-constructive proof term? Define "ignorance" in proof-relevant terms.
          *   **Supervaluationism (Fine/Keefe):** Admissible sharpenings. Translate to type refinements, multi-valued judgments, or consistent extensions? How is indeterminacy represented?
          *   **Residue Report:** For each view: (1) Clean translations, (2) Distortions (e.g., LEM smuggling, loss of vagueness content), (3) Untranslatable residue (e.g., Sorites tolerance). Assess if residue limits the framework or the philosophy.
          *   **Hybrid Evaluation:** "Constructive Epistemicism" (sharp boundary but constructively undefined/underdetermined). Is this coherent or just Supervaluationism? Can DTT distinguish epistemic ignorance from constructive underdetermination?

  2.  **Initial Brainstorming & Mapping:**

      *   *Vague Predicate:* Let $B$ be the type of Bald people. Judgment: $b : B$.
      *   *Epistemicism:* Classically, $\forall x, B(x) \lor \neg B(x)$ holds, but we don't know which. In DTT, truth is inhabitation. So, $\forall x, (B(x) + \neg B(x))$? No, that's decidability. Epistemicism says the fact of the matter exists. In constructive logic, this usually implies an oracle or a classical axiom.
      *   *Supervaluationism:* Truth is super-truth (true in all precisifications). In DTT, this looks like quantification over contexts or models. $\forall \mathcal{M} \in \text{Admissible}, \llbracket B(x) \rrbracket_\mathcal{M} = \top$.
      *   *Proof-Relevance:* Truth isn't just a boolean; it's a witness. "John is bald" isn't just true; there's a *reason* (a term $p : B(\text{John})$).
      *   *Ignorance:* In DTT, not having a term $p : A$ doesn't mean $\neg A$. It means we lack a construction. Epistemicism claims a construction *exists* (metaphysically) but we can't find it. This clashes with the BHK interpretation unless we add classical axioms.
      *   *Sorites:* The induction step $\forall n, B(n) \to B(n+1)$. In DTT, this is a function $f : \prod_{n:\mathbb{N}} B(n) \to B(n+1)$. If $B(0)$ holds, we get $B(k)$ for all $k$. Sorites paradox arises because this function shouldn't exist globally, but locally it seems plausible.

  3.  **Drafting the Translation - Epistemicism:**

      *   *Core Claim:* There is a fact of the matter.
      *   *DTT Translation:* There exists a term $w : \prod_{x:\text{Person}} (B(x) + \neg B(x))$.
      *   *The "Hidden" aspect:* We cannot construct $w$.
      *   *Problem:* In standard MLTT, existence implies constructibility. To say "it exists but we can't construct it" requires moving to a meta-theory or adding axioms (like LEM or an Oracle).
      *   *Ignorance:* Absence of a closed normal form for the decision procedure, despite the type being inhabited in the "real" model.
      *   *Residue:* The "metaphysical existence" of the proof term without epistemic access is foreign to constructive type theory, which identifies truth with provability.

  4.  **Drafting the Translation - Supervaluationism:**

      *   *Core Claim:* Truth relative to precisifications.
      *   *DTT Translation:* A family of types/models $\{ \mathcal{M}_i \}_{i \in I}$.
      *   *Super-Truth:* A term $p : \prod_{i \in I} \llbracket B(x) \rrbracket_{\mathcal{M}_i}$.
      *   *Indeterminacy:* The type $\prod_{i \in I} \llbracket B(x) \rrbracket_{\mathcal{M}_i}$ is empty, but neither is $\prod_{i \in I} \neg \llbracket B(x) \rrbracket_{\mathcal{M}_i}$. Or, more accurately, the type of "uniform proofs" is empty, but local proofs exist for some $i$.
      *   *Admissibility:* Constraints on the index set $I$ or the models $\mathcal{M}_i$.
      *   *Residue:* Supervaluationism often relies on classical logic within the precisifications. If the precisifications are constructive models, "true on all" is strong. If they are classical, we are back to LEM issues. Also, "gap" logic (neither true nor false) is hard in standard DTT where $\neg A$ is $A \to \bot$. We need a specific "Indeterminate" type or a partial logic.

  5.  **Drafting the Residue Report:**

      *   *Epistemicism Distortion:* Requires LEM/Oracle. Smuggles classical metaphysics into constructive syntax.
      *   *Supervaluationism Distortion:* "Admissible" becomes a constraint on contexts. Might look like parametric polymorphism.
      *   *Untranslatable:* The *phenomenology* of vagueness (the feeling that there *isn't* a boundary vs. the feeling that there *is* but we can't see it). The Sorites principle itself: in DTT, if you have the function, you have the paradox. You can't have the function be "almost" valid.

  6.  **Drafting the Hybrid Evaluation:**

      *   *Proposal:* Sharp boundary but constructively undefined.
      *   *Analysis:* This sounds like "Undecidability" rather than "Epistemicism".
      *   *DTT View:* If the inductive definition doesn't supply a decision procedure, the type is not decidable.
      *   *Distinction:* Epistemicism says the decision procedure *exists* (in reality). Constructive Underdetermination says no unique decision procedure is *warranted* by the rules.
      *   *Collapse:* In DTT, if you can't construct the boundary, it doesn't "exist" in the internal logic. So this hybrid looks like Supervaluationism (multiple valid extensions) unless you posit an external oracle.
      *   *Verdict:* It collapses into a form of Supervaluationism/Pluralism about extensions unless you import classical meta-logic.

  7.  **Refining the Type-Theoretic Vocabulary:**

      *   Use $\Sigma$-types for existence.
      *   Use $\Pi$-types for universal quantification/Sorites.
      *   Use Universes for models/precisifications.
      *   Distinguish Internal Logic (constructive) vs. External Meta-logic (where we talk about models).
      *   Address Proof-Relevance: It's not just $B(x)$ is true, it's *how* it is true. Does a borderline case lack a *canonical* proof?

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the request. Set the stage (MLTT, propositions-as-types).
      *   **Section 1: Epistemicism Translation.** Focus on the Oracle/LEM axiom. Define ignorance as lack of normalization/construction.
      *   **Section 2: Supervaluationism Translation.** Focus on Contexts/Models. Super-truth as dependent product over precisifications.
      *   **Section 3: Residue Report.** (1) Clean, (2) Distorted, (3) Untranslatable.
      *   **Section 4: Hybrid Evaluation.** Analyze "Constructive Epistemicism." Distinguish underdetermination from ignorance.
      *   **Conclusion:** Summary of findings.

  9.  **Self-Correction/Nuance Check during drafting:**

      *   *Critique:* Did I handle proof-relevance enough?
      *   *Fix:* Emphasize that in Epistemicism, the *proof term* for the boundary exists but is opaque. In Supervaluationism, the proof term varies across contexts.
      *   *Critique:* Is the Sorites principle addressed?
      *   *Fix:* Explicitly map the Sorites induction step to a function type and explain why it fails in both translations (axiom failure vs. context dependence).
      *   *Critique:* Is the Hybrid distinct?
      *   *Fix:* Be sharp on the difference between "we can't find the boundary" (Epistemic) and "there is no unique boundary determined by the rules" (Constructive/Supervaluationist). In DTT, the latter is the default for undecidable predicates. The former requires extra-logical commitment.

  10. **Final Polish:** Ensure tone is appropriate for a peer in the field (technical, precise, no hand-holding on basic DTT concepts). Use LaTeX formatting for types.

  *(Self-Correction during final review)*: Make sure to explicitly answer the "Residue" prompt requirements (1, 2, 3 for each). Ensure the "Hybrid" section directly addresses whether it collapses.

