answer: |-
  This translation requires navigating the tension between the metaphysical commitments of vagueness theories and the constructive constraints of Martin-Löf Type Theory (MLTT). In proof-relevant semantics, truth is inhabitation ($a : A$), and logical connectives are type formers. Vagueness, traditionally a semantic phenomenon concerning truth-values, must be recast as a phenomenon concerning *term formation* and *canonical normal forms*.

  Below is the translation, residue report, and evaluation of your hybrid proposal.

  ---

  ### 1. Epistemicism in Type-Theoretic Vocabulary

  **The Core Claim:** There is a fact of the matter regarding every instance of a vague predicate, but we cannot know it.
  **Type-Theoretic Translation:** The type representing the predicate is decidable, but the decision procedure is not constructively accessible.

  Let $\text{Person}$ be a type and $\text{Bald} : \text{Person} \to \mathcal{U}$ be a type family.
  Epistemicism asserts that for every $p : \text{Person}$, the type $\text{Bald}(p) + \neg \text{Bald}(p)$ is inhabited.
  $$ \text{EpistemicBoundary} : \equiv \prod_{p:\text{Person}} (\text{Bald}(p) + \neg \text{Bald}(p)) $$
  In standard MLTT, to assert this type is inhabited is to provide a function (a program) that computes the cutoff. Epistemicism, however, claims the *inhabitation* holds metaphysically without the *construction* being epistemically available.

  **The "Hidden Boundary":**
  This corresponds to an **opaque constant** or an **oracle** postulated in the context.
  $$ \text{oracle} : \prod_{p:\text{Person}} (\text{Bald}(p) + \neg \text{Bald}(p)) $$
  We add this to the context $\Gamma$ as an axiom. The "sharpness" is the existence of the sum type (disjunction). The "hidden" nature is that $\text{oracle}$ has no reduction rules; it is a neutral term that does not normalize to $\text{inl}(proof)$ or $\text{inr}(proof)$ for borderline cases within the system.

  **"Ignorance" in Proof-Relevant Semantics:**
  In classical semantics, ignorance is lack of knowledge of a truth value (boolean). In DTT, ignorance is the **absence of a closed normal form**.
  *   **Standard Constructivism:** If $\Gamma \vdash t : A + B$, then $t$ reduces to $\text{inl}(a)$ or $\text{inr}(b)$.
  *   **Epistemic DTT:** We assert $\Gamma \vdash \text{oracle} : A + B$, but we restrict the reduction rules such that for specific $p$, $\text{oracle}(p)$ does not reduce.
  *   **Meaning of Ignorance:** We possess a term of the sum type, but we cannot inspect its head constructor. We are forced to reason *under the assumption* of the sum without case analysis. This mirrors Williamson's claim that we can use bivalence in reasoning but cannot locate the cutoff.

  ### 2. Supervaluationism in Type-Theoretic Vocabulary

  **The Core Claim:** Truth is super-truth (truth across all admissible precisifications). Borderline cases are those where truth value varies across precisifications.
  **Type-Theoretic Translation:** Truth is a dependent product over a type of contexts (precisifications).

  Let $\mathcal{C}$ be the type of **Admissible Contexts** (precisifications). Each $c : \mathcal{C}$ provides a specific interpretation of $\text{Bald}$.
  $$ \text{Bald}_c : \text{Person} \to \mathcal{U} $$
  Admissibility is a predicate $\text{Adm} : \mathcal{C} \to \mathcal{U}$ constraining which contexts count (e.g., respecting clear cases).

  **Super-Truth:**
  "John is bald" is super-true if there is a uniform proof across all admissible contexts.
  $$ \text{SuperBald}(j) : \equiv \prod_{c:\mathcal{C}} \text{Adm}(c) \to \text{Bald}_c(j) $$
  **Indeterminacy:**
  $j$ is a borderline case if $\text{SuperBald}(j)$ is empty (no uniform proof) AND $\text{SuperNotBald}(j)$ is empty.
  $$ \text{Indet}(j) : \equiv \neg \text{SuperBald}(j) \times \neg \text{SuperNotBald}(j) $$
  Crucially, in a proof-relevant setting, indeterminacy is not a third truth value; it is the **absence of a section** in the fibration of proofs over $\mathcal{C}$.

  **"Admissible Precisification":**
  This maps to **consistent extensions of an inductive definition**. If $\text{Bald}$ is defined inductively (e.g., base cases + step), a precisification is a completion of the definition for the "gap" cases.
  *   Does it require a proof-irrelevant layer? Not necessarily. However, Supervaluationism often treats the *variation* in proof terms across $c$ as irrelevant to the truth of the proposition, only caring about the existence of *some* proof. This suggests a truncation:
      $$ \text{SuperBald}(j) : \equiv \prod_{c:\mathcal{C}} \text{Adm}(c) \to \| \text{Bald}_c(j) \| $$
      Where $\| \cdot \|$ is the propositional truncation. If we retain full proof-relevance, "John is bald" would carry data about *which* precisification proves it, which violates the supervaluationist intuition that the statement is simply true simpliciter.

  ---

  ### 3. Residue Report

  #### Epistemicism Residue
  1.  **Clean Translation:** The sharp boundary maps perfectly to the Law of Excluded Middle (LEM) or a Decidability Axiom ($\forall x, P(x) \lor \neg P(x)$). The "hidden" nature maps to postulating an axiom without a computational content (a neutral term).
  2.  **Distortion:** Epistemicism requires **smuggling classical metaphysics into constructive syntax**. In MLTT, asserting $A + \neg A$ usually demands a decision procedure. To maintain the "epistemic" gap, one must sever the link between existence and construction (e.g., using a classical axiom like `postulate LEM : ...`). This distorts the BHK interpretation, turning "proof" into "metaphysical fact."
  3.  **Untranslatable Residue:** The **phenomenology of ignorance**. In DTT, if you postulate the oracle, you have the term. You can pass it around. The "inaccessibility" must be enforced by meta-theoretic rules forbidding case analysis on the oracle for specific inputs. Type theory itself does not natively distinguish "a term we haven't found" from "a term that doesn't exist." The residue reveals that Epistemicism relies on a realist ontology of proofs that DTT's verificationism rejects.

  #### Supervaluationism Residue
  1.  **Clean Translation:** The quantification over precisifications maps cleanly to dependent products over a context type ($\prod_{c:\mathcal{C}}$). Indeterminacy maps to the emptiness of the super-truth type without emptiness of the super-falsity type.
  2.  **Distortion:** "Admissibility" risks collapsing into **parametric polymorphism**. If $\text{Bald}_c$ is just a type parameter, Supervaluationism looks like writing code that works for any implementation of an interface. This loses the specific *vagueness* content: the idea that these aren't just arbitrary implementations, but *sharpenings of a single concept*. Furthermore, if we use truncation to ignore proof differences, we lose proof-relevance, which you specified as a constraint. If we keep proof-relevance, "Super-Truth" becomes a massive tuple of distinct proofs, which is ontologically bloated compared to the philosophical claim.
  3.  **Untranslatable Residue:** The **status of the gap**. In DTT, $\neg A$ is $A \to \bot$. If $\text{SuperBald}(j)$ is empty, we have a function converting any purported super-proof to absurdity. But Supervaluationism wants to say the statement is *neither* true nor false. In DTT, "not super-true" does not imply "super-false." This translates well. However, the *logic* of supervaluationism fails to preserve classical tautologies (e.g., $P \lor \neg P$ is not super-true for borderline $P$). In DTT, if the internal logic of each precisification is constructive, $P \lor \neg P$ might fail internally too. If each precisification is classical, we are back to the Epistemic smuggling problem. The residue here is the **non-classical logic of the object language**: DTT naturally supports intuitionistic logic, which aligns with Supervaluationism's failure of bivalence, but DTT expects truth to be stable across contexts unless explicitly parameterized.

  ---

  ### 4. Evaluation of the Hybrid: "Constructive Epistemicism"

  **The Proposal:** A sharp boundary exists, but it is constructively undefined because the inductive definition supplies no decision procedure. Different constructively valid extensions assign different cutoffs.

  **Analysis:**
  You are proposing that the boundary is **underdetermined by the rules** rather than **hidden by ignorance**.
  In DTT terms: The type $\text{Bald}$ is an inductive type with constructors for clear cases, but no constructor for the borderline region.
  *   **Epistemic Claim:** There is a unique completion of this type (a unique oracle).
  *   **Your Hybrid:** There are multiple valid completions (extensions), and the system does not select one.

  **Does it collapse into Supervaluationism?**
  Yes, structurally.
  1.  **Extensions = Precisifications:** Your "constructively valid extensions" are isomorphic to the "admissible precisifications" ($\mathcal{C}$) in the Supervaluationist translation.
  2.  **Sharpness:** You claim the boundary is sharp *in each extension*. This matches Supervaluationism (each precisification is classical/sharp).
  3.  **The Distinction:** The only difference lies in the modal status of the extensions.
      *   *Supervaluationism:* No extension is the "real" one. Truth is the intersection.
      *   *Your Hybrid:* One extension might be "real" (metaphysically), but the type theory cannot distinguish it.

  **Can DTT distinguish Epistemic Ignorance from Constructive Underdetermination?**
  **No, not internally.**
  *   **Epistemic Ignorance:** Requires $\exists! c : \mathcal{C}$ (there is one true context), but we lack a term for $c$. This requires a meta-theoretic assertion of uniqueness that the internal logic cannot verify.
  *   **Constructive Underdetermination:** Requires $\prod_{c:\mathcal{C}} \dots$ without asserting uniqueness.
  *   **The Residue:** To maintain the "Constructive Epistemicist" view, you must assert **Uniqueness of the Real Model** in the meta-theory while working in a logic that treats all models as equal.
      *   If you assert uniqueness internally ($\Sigma_{c:\mathcal{C}} \text{IsReal}(c)$), you have reduced it to Epistemicism with an unknown parameter.
      *   If you do not assert uniqueness, you have Supervaluationism.

  **Verdict on Coherence:**
  The hybrid is coherent only if you distinguish the **internal logic** (where multiple extensions exist) from the **external semantics** (where one is privileged).
  *   **If the distinction is maintained:** It is Epistemicism disguised as Supervaluationism. The "constructive undefinedness" is just the internal reflection of external ignorance.
  *   **If the distinction is collapsed:** It is Supervaluationism. The claim that "there is indeed a sharp boundary" becomes empty, because in constructive mathematics, existence *is* construction. If you cannot construct the boundary (even non-uniquely, i.e., you can't pick *which* extension is the real one), then asserting its existence is a classical metaphysical add-on.

  **Specific Limitation:**
  The framework cannot distinguish **ontological singularity** (one real boundary) from **epistemic singularity** (one known boundary) without importing classical axioms.
  *   In DTT, "There is a boundary" means "I can give you a term."
  *   Your hybrid says "There is a boundary (ontologically) but I can't give you a term (constructively)."
  *   This is precisely the definition of adding an axiom (LEM/Oracle).
  *   Therefore, the hybrid collapses into **Epistemicism** if you insist on the *reality* of the single boundary, or into **Supervaluationism** if you treat the boundary as merely a feature of valid extensions.

  **Conclusion on the Hybrid:**
  It is a **Supervaluationist semantics with an Epistemicist meta-commentary**. The type theory itself forces you into Supervaluationism (quantification over extensions) because it refuses to acknowledge the "hidden" unique extension as a term. The residue reveals that the distinction between "one hidden boundary" and "many admissible boundaries" is not a logical distinction expressible in DTT, but a metaphysical one about the status of the models. If you are fluent in proof-relevant semantics, you must acknowledge that without a proof term, the "sharp boundary" has no semantic weight within the system.

  ### Summary of Residue
  The untranslatable residue in both cases is the **metaphysical modality** of the boundary.
  *   **Epistemicism** requires a modality of "Metaphysical Existence" distinct from "Constructive Existence." DTT equates them.
  *   **Supervaluationism** requires a modality of "Admissibility" that is not just "Type Consistency." DTT reduces admissibility to type consistency.
  *   **The Sorites Principle:** In DTT, the Sorites step is a function $f : \prod_n \text{Bald}(n) \to \text{Bald}(n+1)$.
      *   Epistemicism says $f$ does not exist (the oracle breaks it).
      *   Supervaluationism says $f$ does not exist (no uniform section).
      *   **Residue:** Neither explains *why* the function seems plausible. In DTT, a function either type-checks or it doesn't. The "plausibility" of the Sorites step corresponds to **local type-checking success** (for any specific $n$, we can construct the step) vs **global type-checking failure** (we cannot construct the $\Pi$-type). This maps well to the distinction between local derivability and global inhabitation.

  **Final Assessment:** The type-theoretic framework clarifies the logical structure of the debate but exposes the metaphysical commitments of Epistemicism as foreign to constructive semantics. Your hybrid is a stable position only if you accept a dual-semantics view (constructive internal, classical external), which effectively admits that Type Theory alone cannot resolve the metaphysical dispute.
