  # Specifying the Theory of Object Identity: A Desiderata List

  Debates over object identity often stall because participants assume different baseline requirements for what counts as an "object" or a "fact." To resolve this, we must treat theories of individuation as engineering specs. Below is the complete list of desiderata an adequate theory must address, flagged by negotiability and logical conflict.

  ## 1. The Desiderata List

  ### D1: Accommodate Symmetric Multiplicity
  *   **Requirement:** The theory must allow for the existence of two numerically distinct objects ($x \neq y$) that share all intrinsic and purely relational qualitative properties.
  *   **Motivating Case:** **Black's Spheres.** Two iron spheres, same size/material, in an empty symmetric universe. Intuitively, there are "two" spheres, not one.
  *   **Negotiable:** **Yes.** (Strict Leibnizians deny this scenario is metaphysically possible; they claim $x$ and $y$ would collapse into one object.)
  *   **Conflicts:** Directly contradicts **D2 (Qualitative Grounding)**.

  ### D2: Uphold Qualitative Grounding (PII)
  *   **Requirement:** Numerical distinctness must be grounded in some qualitative difference (intrinsic or relational). No two distinct objects can share all properties.
  *   **Motivating Case:** **Empiricist Verification.** If there is no observable or qualitative difference, positing two objects is ontologically idle metaphysics.
  *   **Negotiable:** **Yes.** (Haecceitists reject this; they allow distinctness without qualitative difference.)
  *   **Conflicts:** Directly contradicts **D1 (Symmetric Multiplicity)**.

  ### D3: Ensure Diachronic Determinacy
  *   **Requirement:** The theory must provide a truth condition for identity over time. It must be either true or false that "Object A at $t_1$ is Object B at $t_2$," even in symmetric scenarios.
  *   **Motivating Case:** **The Swap Twist.** Two identical spheres swap positions in a periodic, traceless loop. Did Sphere 1 move to Position 2, or did Sphere 2 move to Position 1? The theory must say whether there is a fact of the matter.
  *   **Negotiable:** **Yes.** (Structuralists often accept "indeterminacy" here; they claim the question is meaningless.)
  *   **Conflicts:** Jointly unsatisfiable with **D4 (No Haecceities)** under conditions of perfect symmetry.

  ### D4: Reject Primitive Haecceities (Parsimony)
  *   **Requirement:** The theory should not posit invisible, non-qualitative "thisness" markers (haecceities) attached to objects to ground their identity.
  *   **Motivating Case:** **Ontological Razor.** Positing unobservable metaphysical tags violates parsimony and explains nothing beyond stipulating distinctness.
  *   **Negotiable:** **Yes.** (Haecceitists accept primitive thisness as necessary.)
  *   **Conflicts:** Jointly unsatisfiable with **D3 (Diachronic Determinacy)** in symmetric swap scenarios.

  ### D5: Preserve Indiscernibility of Identicals (LL)
  *   **Requirement:** If $x$ is identical to $y$, then $x$ and $y$ must share all properties. (Logical Law).
  *   **Motivating Case:** **Logic.** Denying this undermines the definition of equality itself.
  *   **Negotiable:** **No.** (This is non-negotiable for any coherent logic.)
  *   **Conflicts:** None (unless one revises classical logic).

  ### D6: Background Independence
  *   **Requirement:** Identity conditions should not rely on absolute space coordinates if space is understood relationally.
  *   **Motivating Case:** **Relational Space.** In an empty universe, there is no grid. Identity must rely on object-to-object relations, not object-to-void relations.
  *   **Negotiable:** **Yes.** (Substantivalists about space may rely on absolute coordinates.)
  *   **Conflicts:** Complicates **D1** if relations are purely symmetric.

  ---

  ## 2. The Impossibility Results (Joint Unsatisfiability)

  This is the critical section. You cannot satisfy all desiderata simultaneously. There are two primary trilemmas.

  ### Trilemma A: The Static Symmetry Problem
  You cannot hold the following three claims together:
  1.  **Black's Spheres are Possible** (Satisfies **D1**).
  2.  **PII is True** (Satisfies **D2**).
  3.  **Haecceities are Illegitimate** (Satisfies **D4**).

  *   **Resolution:** You must drop one.
      *   Drop 1: Claim the universe is impossible (Strict Leibnizian).
      *   Drop 2: Allow distinctness without quality (Haecceitism).
      *   Drop 3: Accept bare particulars or substrata (Substance Theory).

  ### Trilemma B: The Diachronic Swap Problem
  You cannot hold the following three claims together:
  1.  **There is a fact of the matter on the Swap** (Satisfies **D3**).
  2.  **Objects are purely Structural/Relational** (Satisfies **D4** & **D6**).
  3.  **The System is Perfectly Symmetric** (Condition of the Twist).

  *   **Resolution:** You must drop one.
      *   Drop 1: Accept that "which sphere is which" is indeterminate (Structuralism).
      *   Drop 2: Posit primitive thisness to track them (Haecceitism).
      *   Drop 3: Denie the symmetry is perfect (e.g., claim quantum noise or absolute space breaks it).

  ---

  ## 3. Scorecard of Usual Suspects

  | Theory | D1 (Black's) | D2 (PII) | D3 (Swap) | D4 (Parsimony) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Leibnizian** | **FAIL** (Denies scenario) | **PASS** | **PASS** (One object) | **PASS** | Consistent but counter-intuitive on multiplicity. |
  | **Haecceitism** | **PASS** | **FAIL** (Allows indiscernibles) | **PASS** (Tracks via thisness) | **FAIL** (Posits primitives) | Intuitively robust but ontologically expensive. |
  | **Structuralism** | **PASS** (Nodes) | **PASS** (Relations differ) | **FAIL** (Indeterminate) | **PASS** | Elegant but sacrifices diachronic facts. |

  *Note: Structuralists often pass D2 by arguing relational properties (e.g., "being 5m from Sphere B") differ, but this fails in the **Swap Twist** where relations are temporally symmetric.*

