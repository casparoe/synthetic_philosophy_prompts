answer: |-
  Here is the plan for your seventy-minute session.

  ### 1. The Order: Closed, then Open (with a specific bridge)

  Run the **Closed case first**, but you must explicitly fence the symmetry argument so it does not bleed into the Open case.

  **Why Closed first?**
  If you start with the Open case, you are not teaching the Two-Envelope Paradox; you are teaching a decision theory problem about the value of information. The Paradox *is* the tension generated in the Closed case (the conflict between the symmetry intuition and the switching algebra). You need them to feel that tension before you resolve it. If you start Open, the "Paradox" never materializes, and the session loses its philosophical hook.

  **How to prevent the Symmetry Misconception:**
  The risk you identified is real: students will conflate "The envelopes are symmetric" with "My information state is symmetric."
  *   **In the Closed phase:** Establish that *blind* symmetry implies *blind* indifference (EV Stay = EV Swap = £22.5).
  *   **The Bridge (Minute 20):** Before opening the envelopes, ask: *"Does the symmetry of the envelopes force symmetry of our strategy?"*
  *   **The Pivot:** Force them to admit that if they peek and see £40, they know they have the maximum. If they see £10, they know they have the minimum. The *envelopes* haven't changed, but the *information state* has broken the symmetry.
  *   **What the first case must establish:** It must establish the **baseline EV (£22.5)**. The Open case is only interesting if they know what they are beating. It must also establish that the "Always Swap" algebraic argument ($0.5 \times 2X + 0.5 \times X/2$) is suspicious, because it contradicts the baseline calculation.

  ### 2. The Carrying Example: The Overlapping Ladder

  Your **£10/£20 vs £20/£40** ladder is the correct "Carrier." Do not use the non-overlapping variant (£10/£20 vs £40/£80) as anything more than a fleeting footnote, if at all.

  **Why the Overlap is essential:**
  *   **It must have:** A "middle value" (£20) that appears in both possible pairs. This is the engine of the session. It forces the student to ask: *"When I see £20, is it the top of the lower pair or the bottom of the upper pair?"* This ambiguity is the only thing that keeps the paradoxical reasoning alive in a bounded setting.
  *   **It must lack:** Distinct value sets. In a non-overlapping case (£10/£20 vs £40/£80), seeing £20 tells you with certainty that the other is £10. Seeing £40 tells you with certainty the other is £80. This resolves the ambiguity too cleanly. It turns the problem into "identify the pair" rather than "evaluate the conditional expectation." It sidesteps the philosophical meat of the paradox.
  *   **Verdict:** Stick to the 10/20/40 ladder. It is the minimal structure that allows the "X/2 vs 2X" confusion to persist for the middle value, which is where the learning happens.

  ### 3. The Misconception Map

  Here is when to introduce and defuse each misconception. Note that on your bounded version, some standard "resolutions" are actually false, so timing is critical.

  *   **(c) "Infinite expectations are the culprit."**
      *   **When:** Minute 0 (Ground Rules).
      *   **Defusal:** "We are playing a bounded game. The maximum payout is £40. Infinity is not in the room. If you raise this, you are solving a different problem."
      *   **Why:** Pre-emptive strike. Do not let this become a "get out of jail free" card for the algebra.

  *   **(a) "It's just an algebra slip — the X is ambiguous."**
      *   **When:** Minute 15 (End of Closed Case).
      *   **Defusal:** Use this to explain why *Blind Swapping* doesn't work. Show that in the Closed case, $X$ is not a fixed number; it's a variable correlated with the pair.
      *   **Crucial Nuance:** Explicitly state: *"This explains why you shouldn't swap blindly. It does **not** explain why you shouldn't swap after peeking."* This prevents them from using the algebra fix to kill the Open case.

  *   **(b) "The symmetry objection."**
      *   **When:** Minute 20 (The Bridge).
      *   **Defusal:** "Symmetry applies to the *selection procedure*, not the *content*." When you peek, you break the informational symmetry. The envelopes are still physically identical, but your epistemic position is not.

  *   **(e) "So it was a fallacy all along and there's nothing left."**
      *   **When:** Minute 50 (After Open Calculation).
      *   **Defusal:** This is the clever students' trap. They will think fixing the algebra (point a) dissolves the whole session.
      *   **Counter:** "If it were just a fallacy, peeking would be worthless. But we just calculated that peeking adds £5 of value. The algebra fix explains the Closed case; the Overlap explains the Open case. Both are real."

  *   **(d) "If the paradox were real you'd pay for the right to peek... which is absurd."**
      *   **When:** Minute 60 (The Check).
      *   **Defusal:** On your version, this intuition is **wrong**. You *should* pay to peek.
      *   **Action:** Turn this into the lesson's victory. "Your intuition says peeking is useless. The math says peeking is worth £5. Trust the math." This validates the bounded approach over the unbounded one (where peeking value is harder to define).

  ### 4. The Check: The Break-Even Fee

  Your candidate (fee to peek) is good, but "name a fee" allows for guessing. Make it specific to test structural understanding.

  **The Question:**
  *"I will let you peek before you decide, but I charge a fee upfront. What is the maximum fee you would pay to play this game with the peeking option?"*

  **The Answer:**
  *   **Baseline EV (No Peek):** £22.50.
  *   **Strategy EV (Peek & Swap unless 40):** £27.50.
  *   **Value of Information:** £5.00.
  *   **Correct Answer:** £5.00. (Or £4.99 to be strictly better off).

  **Why this distinguishes understanding:**
  *   **The Slogan Learner:** Will say "It depends on the prior" or "You shouldn't pay anything because swapping is a fallacy."
  *   **The Number Cruncher:** Might calculate £27.50 and say "I'd pay £27.50" (confusing revenue with profit).
  *   **The Structural Understander:** Will calculate the delta (£5). They understand that the value of the game is the baseline plus the value of the information.
  *   **Follow-up for Further Maths students:** If they answer instantly, ask: *"What if the coin was biased? 90% chance of £10/£20, 10% chance of £20/£40. Does the fee go up or down?"* (Answer: Down, because the ambiguous £20 is more likely to be the upper of the lower pair, making swapping on £20 less attractive).

  ### 5. The Refusals

  You must explicitly state what you are **not** doing. This protects your 70 minutes and validates your bounded approach.

  **Say this out loud at Minute 5:**
  *"I am refusing to explain the unbounded version of this paradox. In the unbounded version, you can argue about infinite expectations and improper priors. That is a mathematical dead end for this group. We are solving **this** game, with **these** numbers. If you solve this, you understand the mechanism. If you only understand the infinite version, you understand a trick."*

  **Say this out loud at Minute 65:**
  *"I am refusing to teach you Bayes' Theorem today. We solved this using expected values and case enumeration. You do not need formal conditional probability to see that information has value. If you leave here thinking you need more math to solve this, I have failed. You need more clarity, not more calculus."*

  ### Summary Timeline

  *   **00–05:** **Setup.** Define the game (10/20 vs 20/40). Ban Infinity (Misconception c).
  *   **05–20:** **Closed Case.** Calculate Baseline EV (£22.5). Show Stay = Swap. Introduce Algebra Slip (Misconception a) to kill "Always Swap."
  *   **20–25:** **The Bridge.** Challenge Symmetry (Misconception b). "Does knowing the amount change the EV?"
  *   **25–50:** **Open Case.** Calculate Strategy EV (£27.5). Derive the £5 gain. Validate Peeking (Misconception d).
  *   **50–60:** **Synthesis.** Address the "Fallacy" claim (Misconception e). Explain the Overlap (£20 ambiguity).
  *   **60–70:** **The Check & Refusals.** The Fee Question. State the Refusals. Q&A.

  **One final correction on your numbers:**
  Your calculations are correct.
  *   **Closed:** $0.5 \times 15 + 0.5 \times 30 = 22.5$. (Correct).
  *   **Open (Swap unless 40):**
      *   See 10 (Pair 1): Swap $\to$ 20.
      *   See 20 (Pair 1): Swap $\to$ 10.
      *   See 20 (Pair 2): Swap $\to$ 40.
      *   See 40 (Pair 2): Keep $\to$ 40.
      *   Average: $(20+10+40+40)/4 = 27.5$. (Correct).
  *   **Gain:** £5. (Correct).

  Proceed with confidence. The numbers hold.
