answer: |-
  Here is the ranking from the statement most faithful to the principle's actual assertions to the one that should be excised entirely, along with the specific conceptual cost of each.

  **1. (d) Any system that confines its own states to a narrow range must, on average and over the long run, behave as if it were inferring the hidden causes of the sensory states that impinge on it.**
  *What to unlearn:* Students must later learn that "as if" does not imply conscious calculation, but rather a mathematical necessity imposed by the existence of a Markov blanket.

  **2. (e) Perception and action are two ways of minimising the same quantity — perception fits the model to the world, action fits the world to the model — and neither has priority over the other.**
  *What to unlearn:* They will need to refine the idea that action "fits the world to the model," since action actually samples data to resolve uncertainty rather than simply forcing reality to match delusions.

  **3. (c) Perception is approximate Bayesian inference: the brain minimises the divergence between its beliefs and the true posterior over the causes of its sensations.**
  *What to unlearn:* This restricts the principle to perception and brains, whereas the Free Energy Principle applies equally to non-neural systems and active sampling.

  **4. (a) The brain is a guessing machine: it continually predicts what its senses will report, and revises those predictions in the light of prediction error.**
  *What to unlearn:* This describes Predictive Processing (a consequence) rather than the Free Energy Principle (the cause), leaving out why such a machine must exist to resist entropy.

  **5. (b) A living thing stays alive by acting so as to keep the sensory states it encounters as unsurprising as possible.**
  *What to unlearn:* This conflates the accessible bound (free energy) with the inaccessible target (surprise), immediately inviting the "dark room" paradox that requires complex priors to resolve.

  **6. (f) Free energy is a thermodynamic quantity, and the brain's job is to represent the world using as little of it as possible.**
  *What to unlearn:* This is a category error that confuses information-theoretic variational free energy with metabolic thermodynamic free energy, implying the brain tries to consume less power rather than reduce uncertainty.

  ***

  **On the dispute regarding (b):**
  I side with you. While (b) is the most common elevator pitch, it is the most dangerous for graduate students because it is technically false: systems minimize *variational free energy* precisely because they *cannot* minimize surprise directly. Starting with (b) forces you to spend the rest of the seminar undoing the "dark room" objection, whereas starting with (d) establishes the mathematical necessity that makes sense of the rest.
