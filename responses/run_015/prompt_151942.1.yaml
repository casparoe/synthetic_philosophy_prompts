answer: |-
  It is understandable why you feel stuck on this, because the debate you are describing is not merely a technical disagreement about AI alignment but a collision between metaphysics, decision theory, and normative ethics that has resisted resolution for decades. Your hunch that the sides are talking past each other is largely correct, but it is not just a verbal dispute about the definition of preference; it is a deeper disagreement about the ontology of the agent itself. The camp that views idealized preferences as a hidden structure to be recovered is operating under a realist assumption that there exists a platonic utility function specific to you, which is merely obscured by cognitive noise, lack of information, and computational limits. They treat inconsistency as error. The opposing camp, which sees idealization as manufacturing a fictional agent, operates under a constructivist view where preferences are emergent properties of specific cognitive processes in specific contexts, meaning that if you change the process enough via idealization, the preference itself ceases to exist or becomes something entirely new. They treat inconsistency as a feature of the agent's architecture, not a bug to be smoothed over.

  When you ask whether there is a formal question underneath regarding whether coherence plus information uniquely determines a utility representation, the honest answer is that underdetermination is inevitable without making assumptions that beg the question. There are representation theorems in decision theory, such as those by Ramsey or Savage, which show that if an agent's choices satisfy certain consistency axioms, there exists a utility function that represents those choices. However, human beings demonstrably violate these axioms in systematic ways, not just randomly. To recover a unique utility function from inconsistent human data, you must impose a noise model that explains why we deviate from coherence. The choice of that noise model is not determined by the data itself; you could model humans as expected utility maximizers with high noise, or as prospect theory maximizers with low noise, or as agents with context-dependent preferences. Each model will extrapolate to a different coherent volition. Therefore, no theorem can prove that coherence plus information yields a unique profile unless you first assume the very structure of rationality that the second camp is disputing. The formal stall is real because the math cannot tell you which model of human irrationality is the true one, only which one is most convenient for alignment.

  This leads directly to your point about personal identity, which is likely the engine driving the normative disagreement. If you extrapolate my preferences to a state where I know all facts and have no cognitive biases, the resulting entity may care about things I currently do not care about and ignore things I currently hold dear. For example, a fully informed version of you might conclude that certain personal relationships are inefficient or based on false premises, and thus cease to value them. The recovery camp says this is still you, just the best version of you, implying that personal identity is tied to this abstract, idealized trajectory. The manufacturing camp says this is a different entity entirely, implying that personal identity is tied to the actual, messy, historical continuity of your psychological states. There is no empirical study on belief revision that can solve this because it is not a question of fact but a question of authority. We are asking whether the idealized agent has the right to rule over the actual agent, and that is a political and ethical question, not a scientific one.

  Consequently, I must be honest with you that no progress is possible in the sense of one side proving the other wrong through formal or empirical means. The debate will not end with a theorem about aggregation because aggregation requires inputs that are already defined, and the definition of the input is what is being contested. It will not end with an empirical study on belief revision because even if we knew exactly how beliefs change under idealization, that would not tell us whether the resulting preferences are normative for the original person. The stall is permanent because the two camps are offering different solutions to the problem of normativity itself. One seeks to ground normativity in truth and discovery, while the other sees normativity as a constructive process of negotiation between actual selves.

  What could dissolve the problem is not a resolution but a conceptual shift in how we use the concept of coherent extrapolated volition. Instead of treating it as a discovery procedure that finds the one true answer, we might treat it as a regulatory ideal or a reflective equilibrium tool. This would mean acknowledging that the extrapolated profile is not what we really want in a metaphysical sense, but rather a useful fiction that helps us negotiate conflicts between our current inconsistent desires. If you can convince the participants to stop asking whether the idealized preferences are real and start asking whether deferring to them produces better outcomes than deferring to raw impulses, the debate might move from metaphysics to pragmatics. However, if the goal is to determine whether CEV objectively recovers the true human utility function, you should prepare yourself for the possibility that the question itself is malformed and that the debate will continue indefinitely without resolution.
