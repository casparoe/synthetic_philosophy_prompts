              *   *Belt:* Land is the bottleneck.
              *   *Shift:* Moving bottleneck to EROI/Planetary Boundaries.
              *   *Verdict:* Is it progressive? It explains new phenomena (climate change, resource depletion) *but* risks becoming tautological ("limits exist somewhere").

      *   **Part 3: Long-Run Prediction & Endogeneity:**
