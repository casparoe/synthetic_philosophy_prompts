  *(Self-Correction on the "Least Sure" point)*: The prompt suggests the user thinks the Chesterton/Administrative Law stretch is the weak point. I should agree with that assessment but nuance it. It's not that the analogy is wrong, but that administrative law is messier than the philosophical idealization.

