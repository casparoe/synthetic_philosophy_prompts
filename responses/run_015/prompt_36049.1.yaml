      *   *Hypothesis 4: Threshold Deontology.* Animals have some status, but it is easily overridden by economic thresholds, *unless* the cost of overriding is low (humane traps).

      *   *Synthesis:* It's likely a hybrid. The *legal* framework leans towards Property Rights + Low Status. The *agricultural* framework leans towards Rule Utilitarianism (Economic Threshold). The *consumer* framework leans towards Virtue Ethics (being a "good person" even when killing).

