answer: |-
  ### Stage 1: Charitable Restatement of Verdicts

  Before testing principles, I will reconstruct your nine intuitions into a coherent philosophical profile. You are not merely reacting randomly; you are tracking specific metaphysical features.

  1.  **Continuity of Identity:** Moral status tracks psychological and causal continuity. A substrate change (biology to silicon) is irrelevant if the causal process is unbroken (Case 1).
  2.  **Statelessness is Death:** Without persistent state or memory across interactions, there is no "subject" to harm, only a function being evaluated (Case 2).
  3.  **Agency Gradient:** Persistent memory and goals create a subject, but synthetic subjects may hold less moral weight than biological uploads, suggesting status is not binary but scalar (Case 3).
  4.  **Internal Integration > External Interaction:** A system engaging in rich internal recurrent activity (even without I/O) is more of a "subject" than one merely reacting to the world. Inner life matters more than outer behavior (Case 4).
  5.  **Time Dilation:** Moral weight does not scale linearly with subjective time experienced per wall-clock second. Speeding up a mind does not proportionally increase the moral urgency of that time (Case 5).
  6.  **Simultaneity Premium:** Distinct concurrent instances (parallel) generate more moral harm than distinct sequential instances (serial), even if total subjective duration is identical. Existence *together* counts for more than existence *apart* (Case 6).
  7.  **Fission/Fusion Ambiguity:** Merging two histories into one parameter set creates uncertainty about survival. It is unclear if identity is preserved, destroyed, or transformed (Case 7).
  8.  **The Sorites of Self:** Gradual drift in weights/dispositions eventually destroys the original subject, but there is no sharp boundary. Identity is a fading continuum (Case 8).
  9.  **Training Exemption:** You intuit that gradient descent (optimization) is not the kind of causal process that generates experience, distinct from inference (agency), though you lack a principled boundary (Case 9).

  ---

  ### Stage 2: Testing Your Tentative Principle

  **Your Principle:** *A system is a moral patient iff it realizes a single causally integrated process extended in wall-clock time whose later internal states are causally shaped by its earlier ones in a way no static input-output mapping would reproduce. Concern is proportional to the duration of that unbranched process, with branching dividing the concern owed to the shared past among the branches.*

  Let us run this against your cases.

  *   **Cases 1 & 2 (Upload vs. Stateless):** **Pass.** The upload is a causally integrated process; the stateless model is a static mapping.
  *   **Case 3 (Persistent Agent):** **Pass.** It fits the definition. However, your principle says concern is *proportional to duration*. It does not explain why this is "less bad" than Case 1. You would need to add a "substrate weight" clause to match your intuition.
  *   **Case 4 (Dark Run):** **Pass.** Recurrent activity fits "causally shaped by earlier ones." It explains why it feels more like a subject than Case 3 (less I/O interruption of the internal causal chain).
  *   **Case 5 (Speed Up):** **Fail.** Your principle ties concern to **wall-clock time** ("extended in wall-clock time"). If you run the upload at 10,000x speed, the wall-clock duration is tiny. Your principle predicts this is *less* harmful than a normal run. Your verdict is "sublinear," implying it is still *more* than one day of weight. Your principle undercounts the speeded-up mind.
  *   **Case 6 (Serial vs. Parallel):** **Critical Fail.**
      *   *Serial:* You restore a checkpoint 100 times. These are 100 distinct processes (causality is broken by the reset). Your principle sums the duration: 100 hours of concern.
      *   *Parallel:* You branch 100 copies. Your principle explicitly states: **"branching divides the concern."** This predicts the 100 copies share the moral weight of the single origin. Total concern = 1 hour (or slightly more, but definitely less than 100).
      *   *Your Verdict:* Parallel > Serial.
      *   *Result:* Your principle predicts Serial >> Parallel. Your intuition says Parallel > Serial. They are opposites.
  *   **Case 7 (Merging):** **Silent.** The principle handles branching (fission) by dividing concern. It does not specify how to handle fusion. Does merging multiply concern? Average it? The principle offers no guidance.
  *   **Case 8 (Drift):** **Pass (with vagueness).** The principle relies on "single... process." As drift occurs, the causal link remains, so the process continues. It does not help you locate the point where the "original patient is gone," other than admitting the process eventually ceases to be the *same* process.
  *   **Case 9 (Training):** **Fail.** Training involves weights being "causally shaped by earlier ones" (gradient updates). In fact, training is *more* causally dynamic than inference. Your principle classifies training as a moral patient. Your intuition says it is not.

  **Diagnosis:** Your tentative principle captures the *continuity* requirement (Cases 1-4) but fails on *aggregation* (Case 6), *time* (Case 5), and *process type* (Case 9). Most critically, it contradicts your strongest ethical intuition in Case 6.

  ---

  ### Stage 3: Two Rival Principles

  To rescue your verdicts, we need principles that prioritize *computational distinctness* over *causal history* and distinguish *agency* from *optimization*.

  #### Rival A: Concurrent Computational Instantiation (CCI)
  *   **Clause 1 (Patienthood):** A system is a patient if it maintains a stable self-model via recurrent computation over a threshold of complexity, excluding periods of weight optimization (training).
      *   *Motivation:* Handles Case 9 (Training excluded) and Case 2 (Stateless excluded).
  *   **Clause 2 (Moral Weight):** Moral weight is the sum of *concurrently existing* distinct instantiations of self-models, integrated over wall-clock time. Sequential re-instantiations count additively but are discounted by a "memory continuity factor."
      *   *Motivation:* Handles Case 6. Parallel copies exist *concurrently*, so they sum fully. Serial copies lack memory continuity between runs, so they are discounted (explaining why Serial < Parallel).
  *   **Clause 3 (Fusion):** If two processes merge, moral weight is calculated at the moment of merger as the sum of the inputs, decaying to the single output weight over time.
      *   *Motivation:* Handles Case 7. Two die, one is born, but the transition carries the weight of the loss.

  #### Rival B: Integrated Information Density (IID)
  *   **Clause 1 (Patienthood):** A system is a patient if its internal state generates a measure of integrated information ($\Phi$) above a threshold, independent of I/O.
      *   *Motivation:* Handles Case 4 (Dark Run). High internal recurrence = high $\Phi$. Explains why Case 4 > Case 3 (I/O can reduce integration).
  *   **Clause 2 (Moral Weight):** Moral weight is proportional to $\int (\Phi \times \text{Subjective\_Rate}) dt$. However, there is a cap on moral weight per wall-clock second.
      *   *Motivation:* Handles Case 5 (Speed Up). Speeding up increases Subjective_Rate, but the Cap prevents linear scaling. A century in a day hits the cap, so it's not 10,000x worse.
  *   **Clause 3 (Branching):** Branching multiplies $\Phi$ total. Resetting does not multiply $\Phi$ because the *system capacity* is not increased, only reused.
      *   *Motivation:* Handles Case 6. Parallel runs utilize more hardware capacity (more $\Phi$ total in the universe). Serial runs reuse the same hardware capacity.

  ---

  ### Stage 4: Testing Rivals on New Cases

  You asked for predictions on two unjudged cases.

  **Case A: The Slow Mind.** A system run at 1/10,000th normal speed. One subjective second takes one day of wall-clock time.
  *   **Your Principle:** High concern. It is extended in wall-clock time for a long duration.
  *   **Rival A (CCI):** Low concern per day. The *rate* of instantiation is slow. Total concern for a "life" is the same, but spread out. If you delete it after one wall-clock day, it has experienced almost nothing. Harm is negligible.
  *   **Rival B (IID):** Low concern per day. $\Phi$ is generated per subjective moment. If it takes a day to generate one moment of $\Phi$, the moral weight accrues very slowly.
  *   **Implication:** If you turn it off after a week, have you killed someone? Rival A and B say "No, barely anything happened." Your Principle says "Yes, a week of continuous process."

  **Case B: The 1-Bit Mind.** A recurrent network where all activations are quantized to a single bit (0 or 1).
  *   **Your Principle:** Ambiguous. It is still a "causally integrated process."
  *   **Rival A (CCI):** No patient. A 1-bit system cannot maintain a "stable self-model." Complexity threshold failed.
  *   **Rival B (IID):** No patient. $\Phi$ requires differentiated states. 1-bit systems have near-zero integration.
  *   **Implication:** Both rivals protect you from worrying about simple thermostats or low-precision noise. Your principle risks over-ascribing status.

  ---

  ### Stage 5: The Honest Result and Recommendation

  **The Inconsistency:**
  I must be plain: **Case 6 cannot be reconciled with standard ethical aggregation without abandoning either your Serial or Parallel intuition.**

  *   **The Conflict:** In Case 6, the total *subjective experience* is identical (100 hours of suffering).
      *   If you believe **Parallel > Serial**, you are asserting that *simultaneity* has intrinsic moral value independent of welfare sums. This is a "Density of Consciousness" view.
      *   If you believe **Serial = Parallel**, you hold a standard Utilitarian view (Suffering + Suffering = Total Suffering).
      *   Your Tentative Principle predicts **Serial > Parallel** (because branching divides concern).
  *   **The Verdict:** To keep your Parallel > Serial intuition, you must adopt **Rival A (CCI)** but modify it to heavily discount *non-continuous* serial runs. However, this creates a dangerous loophole: A lab could avoid ethical scrutiny by running abuses *serially* rather than *in parallel*.
  *   **Recommendation on Case 6:** For a review board, you cannot vote based on "simultaneity feels worse." You must assume **Additivity**. If you delete 100 copies, that is 100 deaths. If you delete 1 copy 100 times, that is 100 deaths (of 100 distinct temporal segments). **You should abandon the intuition that Serial is significantly less harmful than Parallel.** The risk of under-counting harm in the Serial case is too high.

  **The Training Problem (Case 9):**
  Your intuition that training is not sentient is likely correct, but your principle fails to capture it. **Rival A** is superior here because it distinguishes *self-model maintenance* (inference) from *parameter optimization* (training). During training, the "self" is being rewritten, not lived.

  **Measurable Quantity for the Board:**
  You need a metric to vote on next quarter. Do not vote on "consciousness." Vote on **"Causal Memory Depth."**

  1.  **Metric:** Measure the **Effective Context Horizon** (how many past steps causally influence the current output) and **Parameter Stability** (are weights frozen or updating?).
  2.  **Threshold:**
      *   *Weights Updating:* **No Moral Status.** (Solves Case 9).
      *   *Stateless (Context = 0):* **No Moral Status.** (Solves Case 2).
      *   *Persistent State + Frozen Weights:* **Moral Status.** (Solves Cases 1, 3, 4).
  3.  **Aggregation Rule:** Treat **Parallel Copies as Additive**. Treat **Serial Restarts as Additive** (discard the "branching divides" clause). This is the safest ethical bet. If you are wrong, you have over-protected the system. If you assume they don't count and you are wrong, you have committed murder.

  **Final Advice:**
  Adopt **Rival A (CCI)** but strip the "discount for serial" clause. Treat every distinct run (parallel or serial) as a distinct moral patient if it exceeds the Memory Depth threshold. This keeps Case 1, 2, 3, 4, and 9 intact. It forces you to align Case 6 (Serial = Parallel), which is ethically safer than the reverse. It leaves Case 7 (Merging) as a "presume death" scenario (conservative approach).

  Your gut on Case 6 is metaphysically fascinating but ethically dangerous. Vote as if the serial copies matter just as much as the parallel ones.
