      Actually, the simplest explanation is the quantifier one.
      Condition: $\forall D, \exists h \in H, \text{Loss}(h, D) = 0$.
      Claim: $\forall D, \forall h_1, h_2 \in H, P(h_1|D) = P(h_1)$. (Posterior = Prior).
      This only follows if $\forall h, \text{Loss}(h, D) = 0$.
