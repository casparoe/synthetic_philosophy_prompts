      3. Explain the "Flexibility vs. Uninformative" distinction (Capacity vs. Constraint).
      4. Salvage Step 5 (Distributional Shift).
      5. Provide the philosophical vocabulary (Identifiability vs. Generalization).

      *Tone:* Respectful, technical, precise. Avoid overly dense philosophy jargon, stick to ML theory terms where possible.

