          *   This is false. Just because the class *can* fit any data doesn't mean *every* member of the class fits the *specific* data we saw.
      *   Wait, reading (3) again: "If, for every observation a learner could possibly make, some hypothesis in the class fits that observation perfectly, then no observation can discriminate among the hypotheses in that class..."
      *   This is the "Underdetermination of Theory by Data" argument. It claims that because the class is rich enough to accommodate any outcome, seeing an outcome doesn't rule out enough hypotheses to update the posterior significantly *relative to the true generator*.
      *   Actually, the deeper error is in the definition of "learning." Step (3) assumes learning requires identifying the *unique* true generator. Step (8) correctly points out that learning means generalization.
