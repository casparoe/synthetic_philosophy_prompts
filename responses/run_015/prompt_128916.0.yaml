answer: |-
  The dust in the Valley of Kesh was not like dust elsewhere. It was fine, pale, and possessed a static charge that made the hair on your arms stand up whenever the wind shifted from the north. It was the season of the Ashen Dry, which meant the air tasted like copper and everyone's temper was frayed at the edges.

  Dr. Aris Thorne wiped grit from her tablet screen and looked out over the courtyard. Her team, the x-phi contingent from the Institute, was set up under a canvas awning that did little to stop the heat. They were running the standard battery. Gettier cases, Gödel cases, a few trolley variants tweaked for local transport methods (ox-carts instead of trams).

  "Subject 402 is refusing the framing again," Ben said, not looking up from his laptop. He was the data lead, a man who believed confidence intervals could solve interpersonal conflict. "He says asking him about a man he doesn't know is 'breath-waste.'"

  "Tell Kael to adjust the intro," Aris said, rubbing her temples. "Use the game framing. Bring out the counters."

  Suki, who was managing the flow of participants, sighed. She was stacking blue bottle caps into neat piles. "We're low on caps, Aris. And the kids keep stealing them. They think it's actual currency."

  "Then use the cowrie shells. Just get them to treat it as a contest. If we frame it as a judgment game, the N-factors stabilize. You know the preregistration says we need the plain enquiry for the second half, but if we don't get data..."

  "The preregistration says plain enquiry for everyone after subject 300," Ben reminded her. "We're at 310. If we switch back to game framing, we're deviating."

  "We're not deviating. We're... optimizing engagement." Aris knew the lie tasted like the copper dust. The preregistration was locked on the open science framework. Any deviation would be a scarlet letter on the publication. But the data from the plain enquiries was garbage. When asked, "If a man finds a watch in the field, does he know it is there?" in a normal conversational tone, the Keshic respondents would often laugh, or look around to see who was playing the fool, or give answers that seemed to contradict basic logic. But when the same question was embedded in a contest where they won shells for "correct" judgments, they answered like undergraduates in Oxford or Princeton.

  It was the context. In Kesh, asking a stranger to adjudicate an imaginary scenario with no stakes was socially marked. It was the equivalent of walking up to someone in a queue and asking, "Do you promise?" when nothing had been offered. It signaled either childishness or deceit.

  Kael, the lead translator, walked over from the interviewing station. He was a local hire, a linguist from the capital who found the philosophers exhausting. "Subject 402 says he will not play the 'child's game' with the shells. He wants to know why we are asking about dead men."

  "Tell him it's about how people think," Aris said.

  "I have told him," Kael said. "He says thinking is for when you have a problem. You have no problem. You have only questions. This makes him suspicious."

  "Try the word *vash* again," Aris said. "Instead of 'suppose.' Use *vash*."

  Kael's eyes narrowed. "We discussed this. *Vash* is for contracts. If I say '*Vash* a man finds a watch,' the man thinks I am offering him a watch or accusing him of theft. I need to use *lumen*."

  "*Lumen* is too poetic. It means 'in the dream of.' It invalidates the truth value."

  "*Lumen* is the only word that separates the story from the world," Kael snapped. "If you force *vash*, you are lying to them. And they know it."

  This was the argument that had been running for three days. A single word. Aris needed the hypothetical operator to be neutral. Kael insisted that in Keshic, there was no neutral hypothetical. There was only the binding (contract) or the unreal (dream/story). To ask a binding question about an unreal event was a category error that made the speaker look insane.

  "Use *lumen*," Aris said quietly. "But code it as neutral in the metadata."

  Kael stared at her. "You are asking me to lie in the record."

  "I'm asking you to make the data comparable to the Western sample. If we code it as 'story,' the reviewers will say we changed the stimulus."

  Kael didn't nod. He just turned back to the courtyard.

  Aris watched him go. She felt the familiar itch of the project unraveling. The preregistration was a cage. They had come here to test the universality of intuitions, but the act of asking the question was changing the intuition itself. When it was a game, people played by the rules of logic. When it was a conversation, they played by the rules of Kesh.

  Later that evening, the team gathered in the common room of the guesthouse. The fans whirred lazily, pushing the hot air around without cooling it. Vess, the local research assistant, was sitting in the corner. She was young, sharp-eyed, and had been hired to handle logistics, but she had a master's in psychology from the university in the capital. She hadn't said much during the day, but she had been watching.

  "The variance is too high," Ben said, projecting a graph onto the whitewashed wall. "Look at the Gödel case. In the game frame, 70% say the name refers to the prover. In the plain frame, it drops to 40%. But the plain frame data is noisy. Half the people refuse to answer."

  "It's the social cost," Vess said. Her voice was quiet but cut through the hum of the fan.

  Aris looked up. "Excuse me?"

  "The plain frame," Vess said. She stood up and walked to the graph. "You think the problem is the word *lumen*. It is not. The problem is that you are asking them to speak without a shadow."

  "A shadow?" Suki asked.

  "In Kesh, when you speak," Vess said, "it attaches to you. If I say 'The man is guilty,' and he is not, I have done harm. If I say 'I would push the man off the bridge,' even if I say 'if,' I have said I am a person who pushes men off bridges."

  "It's a hypothetical," Aris said, feeling the fatigue make her impatient. "Everyone understands the difference."

  "Do they?" Vess turned to Aris. "You have three boxes on your survey. Yes, No, Cannot Say. This is wrong."

  "We have Likert scales now," Ben corrected.

  "Still wrong," Vess said. "There are three things. One: What my mouth says now, to you, because you are paying me and holding a machine. This is *breath*. Two: What I will let be said about me in the market tomorrow. This is *name*. Three: What my hands do if the cart is actually coming. This is *step*."

  She tapped the table. "Your game frame works because it isolates *breath*. It makes the words into tokens, like the bottle caps. Win the shell, say the word. No *name* risk. But the plain frame... when you sit under the tree and ask seriously, you are asking for *name*. They cannot give you the *breath* answer because they are worried about their *name*."

  Aris felt a chill that had nothing to do with the fan. "You're saying the intuition isn't stable across contexts."

  "I am saying your instrument measures *breath*," Vess said. "But you think it measures *step*. You think because they say 'push' in the game, they would push in the valley. But they would not. And when you ask them seriously, they know you are asking about *name*, so they say 'no' to protect their *name*. You are collecting three different things and calling them one variable."

  "We can't code that," Ben said immediately. "The preregistration defines the dependent variable as 'intuition regarding moral permissibility.' We can't split it into mouth, market, and hand."

  "Then your variable is empty," Vess said. She looked at Aris. "I have been running side interviews. Informal. I ask them what they would say, then I ask them what they would tell their neighbors I said, then I ask them what they would do if the ox was coming. The correlation is near zero."

  The room was silent. The fan clicked.

  "If we include that," Aris said slowly, "we invalidate the cross-cultural comparison. The Western data doesn't have those controls."

  "Then the Western data is wrong too," Vess said. "Or you just haven't looked hard enough. But here, I can see it. You want to publish that Keshic intuitions differ. But they do not differ. Only the cost of speaking differs."

  Aris looked at the preregistration document open on her laptop. It was a promise. A contract. *Vash*. If she changed the coding scheme now, if she acknowledged Vess's distinction, the study became qualitative. It became messy. It became un-publishable in the top journals. It became a story about methodology rather than a finding about cognition.

  But the data was lying. She knew it. The game frame was a trick. It forced the locals to suspend their social reality to play the Westerner's logic game. The plain frame was hitting the wall of their social reality.

  "Vess," Aris said. "Can you draft a protocol? For the... three distinctions?"

  Vess's eyes lit up, just for a second. Ambition. She wanted this. She didn't want to teach Aris a lesson about truth; she wanted to be on the paper. She wanted to show the capital university that she could run a field site better than the foreigners. "I can. But you have to drop the binary coding. We need a matrix."

  "Ben," Aris said. "Update the dataset. Create three new columns. *Breath*, *Name*, *Step*."

  "That violates the preregistration," Ben said, his voice tight. "We have to note a deviation. Major deviation."

  "Note it," Aris said. "Write that environmental factors necessitated protocol adjustment."

  "Environmental factors?" Kael spoke from the doorway. He had been listening. "You will write that the dust made you change your mind?"

  "I'll write that the linguistic structure required deeper granularity," Aris said. She looked at Vess. "You co-author. Second position."

  Vess nodded, once. "Third. I have work to do." She sat back down and opened her notebook. She wasn't smiling. She was already working.

  The next two days were a blur of frantic recoding. The team worked late into the heat of the night. The preregistration was effectively abandoned, buried under a layer of explanatory notes that hoped the reviewers would be too tired to read them closely. They ran the new protocol. The data was chaotic, beautiful, and utterly incomparable to the Oxford dataset. It showed that when the social cost was high, the "moral intuition" shifted dramatically. When the social cost was removed (via the game), it aligned.

  It proved nothing about universal cognition. It proved everything about the situation of asking.

  On the last night, the packing was mostly done. Crates of equipment were stacked by the door. The team was gone, out at a farewell meal in the lower valley, leaving Aris alone in the guesthouse to finish the field notes.

  The room was dark, save for the glow of her tablet. The dust had settled on the windowsill, a thick grey fur. Aris closed the document. She couldn't write the conclusion. Every sentence she wrote sounded like a justification.

  She stood up and walked to the window. The valley was quiet. The wind had died down.

  She looked at her reflection in the glass. She needed to know. She needed to know if it was the language, or the people, or the questions.

  She turned back to the room. She sat on the floor, cross-legged, in the dark. She closed her eyes. She tried to summon the first case they had run. The Gettier case. The man and the watch.

  She tried to say it in Keshic. She had learned enough.

  "*Lumen*," she whispered. The word for story-dream. "A man finds a watch..."

  She paused. She waited for the feeling. The tug. The intuitive pull that said *Yes, he knows* or *No, he doesn't know*.

  In English, it was automatic. The machinery of her training kicked in. The case loaded, the options appeared, the judgment formed.

  In Keshic, the words hung in the air. "*Lumen*." Story. Unreal.

  If it was a story, why did it matter? If it mattered, why was it a story?

  She tried again. "*Vash*." Contract. "A man finds a watch..."

  Her throat tightened. It felt like a lie. She was asserting a fact about a man who did not exist. She was binding herself to a reality that wasn't there. She felt a spike of anxiety, irrational but physical. Her hands felt cold.

  She tried to strip the words down. Just the concepts. Man. Watch. Find. Know.

  But the connectors were gone. The logic gates were built out of words she couldn't use without invoking a social context she wasn't in. There was no one to hear her. No market to carry her name. No hand to move.

  She opened her eyes. The room was still dark. The dust motes floated in the light from the tablet.

  She opened her mouth to say the judgment. "He knows."

  The words didn't come. Not because she didn't know the translation. She knew the word for *know*. It was *sola*.

  "He *sola*."

  It sounded empty. Like dropping a stone into a well and hearing no splash.

  Was it because the intuition wasn't there? Had the concept of knowledge shifted so fundamentally that the question no longer hooked onto anything in her mind?

  Or was it because *sola* required a witness, and she was alone?

  Or was it because the question itself was a broken thing, a machine designed to run in a vacuum, and she had finally stepped into the air?

  Aris sat in the silence. She tried to speak again. She formed the shape of the word with her lips. She pushed the air from her lungs.

  No sound came out.

  She waited. The fan clicked. The dust settled. She kept her mouth open, waiting for the answer to arrive, or to realize it had never been there at all.
