answer: |-
  # Q&A Prep Sheet: Dissertation WIP Session

  **Strategy Note:** You have 40 minutes for questions. That is roughly 8 to 10 substantive exchanges. You cannot win every point. Your goal is to show that your "Question Ownership" norm is *robust enough* to ground a moral distinction, even if the semantic boundaries are fuzzy. Do not get bogged down in semantic edge-cases; pivot back to the *normative function* of the distinction.

  ---

  ## Part 1: Priority Objections (Ordered by Likelihood × Damage)

  ### 1. The Consequentialist / Info-Econ Challenge
  **Likelihood:** High (4 people + general skepticism)
  **Damage:** Critical (If the distinction is morally inert, the project fails)
  **Vocabulary:** Expected utility, credence shifts, welfare outcomes, informational efficiency.

  **The Objection:**
  "It looks like you're describing three different causal pathways to the same endpoint: the hearer ends up with a false credence. In information economics, we care about the noise-to-signal ratio and the resulting decision quality. If a 'salience-misleading' spreadsheet and a direct lie produce the same bad hiring decision, why does the *mechanism* matter? You seem to be valuing the 'cleanliness' of the channel intrinsically, but unless that cleanliness correlates with better long-term trust or welfare, aren't you just reinventing a deontological constraint without the metaphysics to support it?"

  **The Reply (2 mins):**
  "I concede that if the *only* thing that matters is the immediate truth-value of the hearer's belief, my distinction collapses. But my claim is that 'question ownership' tracks a specific kind of relational harm: the preemption of the hearer's epistemic agency. When I lie in an answer-channel I own, I'm not just inserting noise; I'm exploiting a license *you* gave me to manage your inquiry. That betrayal degrades the infrastructure of future cooperation in a way that salience-manipulation doesn't. So, while the immediate credence shift might be identical, the *transaction cost* for future inquiry is higher in the lying case. I'm not disagreeing that outcomes matter; I'm arguing that the mechanism predicts different long-term systemic costs for the epistemic community."

  **Concession:**
  "Concede that in isolated, one-off interactions with no future relational stakes, the moral difference shrinks significantly."

  **Soft Spot:**
  "You haven't empirically proven that 'answer-misleading' degrades future trust more than 'salience-misleading.' You're asserting this as a normative claim, but the consequentialists will treat it as an empirical one."

  ### 2. The Kantian / Anscombean Challenge
  **Likelihood:** High (3 people)
  **Damage:** High (They control the "lying" literature; if they reject your grounding, you lose the tradition)
  **Vocabulary:** Categorical imperative, maxim of action, mental reservation, will, assertion as such.

  **The Objection:**
  "You're grounding the wrongness of lying in a contingent social role ('question ownership'). But the prohibition against lying is categorical. If I am hiding a fugitive and the murderer asks me where they are, on your view, do I 'own' the question? If I don't, is lying permissible? You seem to make the duty to truth dependent on the conversational agenda, whereas the duty should depend on the rational nature of the interlocutor. Are you reducing a duty of virtue to a rule of conversational etiquette?"

  **The Reply (2 mins):**
  "I'm not trying to replace the categorical prohibition, but to explain *why* it bites hardest in standard cases. Even in the murderer-at-the-door case, Anscombe allows for mental reservation or refusal to answer. My 'question ownership' norm explains why: the murderer has not legitimately entered a cooperative inquiry with me; he has coerced the channel. Therefore, I haven't taken on the duty to keep it clean in the standard way. I'm not making the duty contingent on etiquette; I'm saying the duty arises from the *license to rely* that is present in normal cooperative exchange. When that license is voided by coercion, the specific duty of 'answer-channel cleanliness' is suspended, which aligns with the casuistry you value."

  **Concession:**
  "Concede that your view is not a full replacement for a Kantian account of the will, but rather a functional explanation of the norm's scope."

  **Soft Spot:**
  "If they press on whether 'coercion' voids ownership, you might be forced into a circular definition (ownership is voided when lying is okay)."

  ### 3. The Graduate Student Application (Silence & Omission)
  **Likelihood:** High (Many students, high interest in advising)
  **Damage:** Medium (If the application fails, the chapter feels abstract/ivory tower)
  **Vocabulary:** Advising relationships, fiduciary duty, omission, silence, professional norms.

  **The Objection:**
  "In professional advising, we often stay silent rather than speak. If a student asks, 'Am I good enough for the market?' and I say nothing, or say 'You have many options,' have I breached the answer-channel? Your view says lying is the canonical breach, but in advising, omission feels just as bad. Does your view condemn the silent advisor, or does silence count as 'salience-misleading' where the asymmetry is absent?"

  **The Reply (2 mins):**
  "This is exactly where the 'ownership' test does work. In an advising relationship, the advisor has implicitly accepted ownership of the student's career-question. Silence, in that context, is not a neutral non-act; it is a signal within the answer-channel. If I own the question, I owe a service. Providing a true but unhelpful answer (frame-misleading) or staying silent (which functions as a negative signal) can both be breaches of the *service* owed, even if they aren't lies. My view predicts that silence is morally heavier in advising than at a cocktail party, precisely because the question-ownership is explicit in the professional role."

  **Concession:**
  "Concede that your taxonomy needs to be expanded to explicitly categorize 'strategic silence' as a subset of frame- or answer-misleading depending on context."

  **Soft Spot:**
  "You risk over-extending 'ownership' so that any silence in a power dynamic becomes a moral breach, which is too demanding."

  ### 4. The Phil of Language Challenge (Stability of Boundary)
  **Likelihood:** Medium (1 person, but precise)
  **Damage:** Medium (If the semantic foundation is unstable, the taxonomy wobbles)
  **Vocabulary:** Gricean implicature, common ground, at-issue content, cancellability, context-sensitivity.

  **The Objection:**
  "You rely on the distinction between asserting something false and implicating something false to define 'answer-misleading.' But the boundary between at-issue content and implicature is notoriously unstable and context-dependent. If I say 'Some of the candidates are qualified,' implying 'Not all,' can't I cancel that? If the boundary shifts, how can a moral norm rest on it? Are you building ethics on sand?"

  **The Reply (2 mins):**
  "I agree the semantic boundary is fuzzy. But moral norms often track fuzzy concepts (think of 'harm' or 'consent'). My claim isn't that the linguistics are crisp, but that the *hearer's reliance* is the normative anchor. If the hearer is licensed to treat the content as asserted for the purposes of the inquiry, the channel is 'clean' relative to that reliance. The moral wrong tracks the *exploitation of reliance*, not the syntactic category. So even if the linguistics are gradient, the breach of reliance can be binary: did you exploit the license I gave you to treat your word as truth?"

  **Concession:**
  "Concede that there will be hard cases where it's unclear if a statement is an assertion or an implicature, and in those cases, the moral judgment should be correspondingly muted."

  **Soft Spot:**
  "If reliance is the anchor, you drift back toward the consequentialist view (harm to the rely-er) rather than the act-based view you started with."

  ### 5. The Experimental Philosopher Challenge
  **Likelihood:** Medium (2 people)
  **Damage:** Low (Can be compartmentalized as "future work")
  **Vocabulary:** Vignettes, Likert scales, statistical significance, folk intuitions, blame attribution.

  **The Objection:**
  "We've run studies where participants punish 'salience-misleading' just as harshly as lying when the outcome is severe. If your view says the asymmetry is 'effectively absent' in salience cases, but folk intuition says 'blame them equally,' is your norm descriptive or revisionist? Are you telling us how people *do* judge, or how they *should*?"

  **The Reply (2 mins):**
  "I'm making a normative claim, not a descriptive one. If folk intuitions punish salience-misleading equally in high-stakes cases, that might reflect a heuristic where outcome severity overrides mechanism. My argument is that they *should* distinguish them because the violation of agency is different. However, I predict that if you control for outcome severity and vary only the 'question ownership' status, you will see the asymmetry re-emerge. I'd welcome collaboration on a vignette that tests ownership specifically, rather than just assertion vs. implicature."

  **Concession:**
  "Concede that your view is revisionist regarding standard folk intuitions in high-stakes outcome cases."

  **Soft Spot:**
  "If your normative view diverges too wildly from stable folk intuitions, you risk irrelevance."

  ---

  ## Part 2: Strategic Imperatives

  ### The Single Reply That Must Land
  **The Consequentialist Distinction.**
  You cannot afford to sound like you are agreeing that "only outcomes matter." If you concede that the distinction is only useful insofar as it predicts different outcomes, you have lost the chapter.
  *   **The Line to Hold:** "The mechanism matters because it constitutes a different kind of relational wrong, independent of the immediate credence shift. It is a violation of *authority* and *license*, not just a cause of false belief."
  *   **Why:** If this doesn't land, the Kantians will think you're too soft, and the Consequentialists will think you're redundant. You need to carve a third space: **Relational Normativity.**

  ### Distinguishing from Consequentialists (Do Not Agree Too Quickly)
  When they ask, "Isn't this just about long-term trust effects?"
  *   **Do NOT say:** "Yes, exactly, lying destroys trust more." (This makes you a rule-utilitarian).
  *   **DO say:** "Trust is a byproduct. The primary wrong is the *unilateral appropriation of the inquirer's agenda*. Even if trust weren't damaged (e.g., in a one-off interaction with a stranger), the act remains a breach of the specific license granted."
  *   **Reasoning:** You must ground the wrong in the *act of ownership transfer*, not the *consequence of trust loss*.

  ### Handling the "No Principled Stopping Point" Objection
  *This is the objection that your taxonomy (Answer/Frame/Salience) is just a list of tricks, not a theory.*
  *   **The Trap:** They will say, "Why not add a fourth category? Why not split 'Frame' into two?"
  *   **The Defense:** "The stopping point is **Question Ownership**. The three categories aren't arbitrary; they map onto the three ways one can interact with a Live Question: (1) Answering it (Answer), (2) Redefining it (Frame), (3) Ignoring/Obfuscating it (Salience). Any other deceptive maneuver must fall into one of these three relations to the Question. If it doesn't relate to the Question, it's not deception in an inquiry; it's noise."
  *   **Key Phrase:** "The taxonomy is exhaustive relative to the *status of the question*, not the *method of speech*."

  ---

  ## Part 3: The Dangerous Question

  **The Question:**
  "Who decides when Question Ownership has been transferred? If I can manipulate you into *thinking* you've asked a question that I haven't actually agreed to answer, or if I can subtly shift the frame so that I no longer 'own' the question before I speak, haven't you just moved the locus of manipulation from the *answer* to the *setup*? Doesn't your view incentivize sophisticated liars to manipulate the ownership conditions rather than the answer?"

  **Why It's Dangerous:**
  1.  **Circularity:** If the liar can determine whether they own the question, they can determine whether the moral constraint applies.
  2.  **Infinite Regress:** It pushes the moral evaluation back to the "pre-conversation" phase, which your chapter doesn't cover.
  3.  **Collapse:** If ownership is manipulable, the "clean channel" norm is easily bypassed by anyone smart enough to reframe the agenda before speaking.

  **How to Handle It (Bluntly):**
  " That is the strongest objection. My reply is that Question Ownership is not determined by the speaker's internal state or clever framing, but by **reasonable reliance**. If a hearer is licensed to believe I own the question based on social norms and role expectations, I own it—regardless of my attempts to wiggle out. The norm protects the *hearer's reasonable expectation*, not the *speaker's technical loophole*."
  *(Warning: This moves you closer to a reliance-based view, which the Phil of Language might pounce on, but it's the only way to stop the manipulation objection.)*

  ---

  ## Final Advice for the Session
  *   **Watch the Clock:** With 25 people, you will get interrupted. If a Kantian starts a monologue, say: "I want to give others a chance, but briefly: my point on the categorical imperative is..."
  *   **Board Work:** If the Phil of Language presses on the assertion/implicature boundary, go to the board. Draw the "Question" as a box. Show how Lying, Framing, and Salience interact with the *box*, not just the *words*. Visualizing the "Question" as the unit of analysis will help you survive semantic nitpicking.
  *   **The "I'll Take That On Board" Move:** For the X-Phi and Grad student questions, don't fight too hard. "That's a crucial empirical/application point I need to develop in the next chapter." Save your energy for the Consequentialists and Kantians.

  Good luck. The "Question Ownership" norm is novel; defend its normative force, not just its descriptive accuracy.
