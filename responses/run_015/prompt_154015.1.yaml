      *Re-evaluating David's Step 6:* "Condition (4) already checks whether M is stable... q inherits that stability."
      *Correction:* Stability of belief in true worlds (4) doesn't guarantee sensitivity in false worlds (3). The inheritance of tracking for closure depends on Condition (3). If $\neg q$ is true, is $p$ false? If yes, and $S$ tracks $p$, $S$ won't believe $p$, so won't believe $q$. This is Condition (3) work. David citing (4) is a mistake. Elena is right to press him on formal definition, but wrong that method isn't there.

