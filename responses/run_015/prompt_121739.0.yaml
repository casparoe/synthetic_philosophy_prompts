      *   Rate each step? Check.

  8.  **Self-Correction during drafting:** I need to make sure I don't validate Friend 2's claim that it *is* a category error too strongly. It's not necessarily a category error, it's a metaphysical stance. I should clarify that Friend 1 is making an *inference to the best explanation*, while Friend 2 is demanding *logical necessity*. Friend 1 has the simpler ontology (no hidden variables), Friend 2 has the more intuitive ontology (flow of time).

