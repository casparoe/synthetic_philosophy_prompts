prompt: |-
  hey, need your help adjudicating something from last nights meetup. two friends got into it over the rietdijk-putnam argument about special relativity and the block universe. friend one said: since observers moving relative to each other disagree on whats happening 'now' and physics says both are right, then 'now' is just like 'here' - a perspective thing. so the past and future are just as real, its all one block. friend two said thats a category error: frame-dependent simultaneity just means we cant draw one universal slice, not that all slices exist simultaneously. they compared it to git - all commits are in the repo but only one is checked out and running. friend one replied in physics theres no 'repo server' or master clock, every frame is equally valid so nothing is specially 'checked out'. friend two said thats begging the question - youre assuming no privileged frame proves eternalism, but absence of agreement is just an epistemic limit, not proof every time is ontologically present. can you go through these moves one by one and rate whos right at each step? also, are they both missing something about whether quantum entanglement complicates the 'all frames equal' assumption? im a software engineer so the git analogy makes sense to me, but i want to know if it actually holds up philosophically. no need for citations, just your reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

