      *   *Collusion:* Debaters agree to split the pot. *Fix:* Random assignment, high social stakes (notes).
      *   *Task too easy:* Judge verifies everything. *Fix:* Pilot the puzzle beforehand.
      *   *Task too hard:* No one understands. *Fix:* Keep logic simple, verification tedious.

  8.  **Mapping Debrief to Theory:**
      *   Connect "running out of tokens" to "Judge's compute budget."
      *   Connect "plausible lie" to "AI obfuscation."
      *   Connect "splitting steps" to "recursive debate."

  9.  **Addressing Limitations:**
