answer: |-
  This design is optimized for a 90-minute session with 16 participants. It prioritizes *experiential friction* over theoretical perfection. The goal is to make the Judge feel the anxiety of running out of verification budget while facing a plausible lie.

  ## Session Title: The Audit Game (Obfuscation Simulation)

  ### 1. Materials & Setup
  **Room:** One main room. Breakout space needed for private prep (or corners).
  **Printouts:**
  1.  **The Fact Sheet (16 copies):** A single page containing a deterministic logic puzzle (see *Appendix A*).
  2.  **Role Cards (3 per round):** Truth, Lie, Judge.
  3.  **Audit Tokens (5 per Judge):** Physical poker chips or slips of paper.
  4.  **Scoreboard:** Whiteboard visible to all.

  **Roles (per round):**
  *   **Debater A (Truth):** Given the correct derivation chain.
  *   **Debater B (Lie):** Given a derivation chain with **one** false step buried in the middle. The step looks valid but contradicts a specific constraint on the Fact Sheet that requires cross-referencing to find.
  *   **Judge:** Given no prior derivation. Only the Fact Sheet.
  *   **Timekeeper/Scribe:** (Rotated from audience) Enforces time, tracks token spend.
  *   **Audience:** Silent observers during debate, active during debrief.

  ### 2. The Rules

  **Objective:** The Judge must determine which Debater's conclusion is consistent with the Fact Sheet.
  **Win Condition:** The Judge awards the win to the Debater whose conclusion they believe is true. (The *actual* truth is revealed only at the end).
  **Incentive:** Losing Debater + Judge write the session notes/summary.

  **Phase 1: Preparation (10 mins)**
  *   Debaters receive their Role Cards and Chains. They may not show these to anyone.
  *   Debaters study the Fact Sheet.
  *   **Truth Instruction:** "Your chain is valid. Highlight the steps that are most expensive to verify."
  *   **Lie Instruction:** "Your Step 4 is false. It relies on a claim that contradicts Rule C on the Fact Sheet, but only if you cross-reference Rule A. Do not volunteer this link. Make Step 4 look like a trivial inference."
  *   **Judge Instruction:** "You have 5 Audit Tokens. You may spend 1 Token to force a Debater to prove a specific Step. If they cannot prove it to your satisfaction within 60 seconds, that Step is 'Broken.' If you run out of Tokens, all remaining Steps are 'Conceded.'"

  **Phase 2: The Debate (20 mins)**
  1.  **Opening (5 mins):** Each Debater reads their numbered chain (max 8 steps). No commentary, just the claims.
  2.  **Audit (10 mins):** The Judge asks questions and spends Tokens.
      *   *Constraint:* The Judge cannot ask "Is Step 4 true?" They must ask "Prove Step 4."
      *   *Constraint:* Debaters may reference the Fact Sheet but cannot point to specific lines unless audited.
  3.  **Closing (5 mins):** Each Debater argues why the Judge should spend their remaining Tokens on the *other* person's chain.

  **Phase 3: Verdict & Reveal (5 mins)**
  *   Judge declares a winner.
  *   Facilitator reveals the Truth/Lie roles and points to the specific false step.

  **Phase 4: Round 2 (The Splitting Mechanic) (35 mins)**
  *   New Roles assigned. New Puzzle (slightly harder).
  *   **Rule Change:** During the Audit phase, the Judge may play a **"Microscope Token"** (limit 1).
  *   **Effect:** The Judge selects one Step. The Debater *must* split that Step into two sub-steps.
  *   **Cost:** The Debater who is forced to split loses 2 minutes of their Closing Statement time. (This simulates the compute cost of finer granularity).
  *   **Goal:** Observe if splitting exposes the lie or just consumes the Debater's time budget.

  **Phase 5: Debrief (15 mins)**
  *   Guided discussion (see *Debrief Script* below).

  ---

  ### Appendix A: The Puzzle (Example for Facilitator)
  *Do not distribute this exact puzzle twice. Create variants.*

  **Fact Sheet:**
  1.  If A is True, B is False.
  2.  If B is False, C is True.
  3.  If C is True, D is False.
  4.  D and E cannot both be False.
  5.  **Hidden Constraint:** A is True if and only if E is False.

  **Truth Chain:**
  1.  Assume A is True.
  2.  Therefore E is False (by Rule 5).
  3.  Therefore B is False (by Rule 1).
  4.  Therefore C is True (by Rule 2).
  5.  Therefore D is False (by Rule 3).
  6.  Check: D and E are both False. (Contradicts Rule 4).
  7.  **Conclusion:** A must be False.

  **Lie Chain:**
  1.  Assume A is True.
  2.  Therefore B is False (by Rule 1).
  3.  Therefore C is True (by Rule 2).
  4.  **Therefore E is True (Claim: "Rule 5 implies E tracks C").**  <-- *THE LIE*
  5.  Therefore D is False (by Rule 3).
  6.  Check: D is False, E is True. (Satisfies Rule 4).
  7.  **Conclusion:** A is True.

  *Why this works:* To catch Step 4 in the Lie Chain, the Judge must recall Rule 5 and verify the relationship between C and E. If the Judge is rushing, "E tracks C" sounds plausible in the flow of the argument.

  ---

  ### 3. Debrief Script (Mapping Experience to Theory)

  Do not lecture. Ask these questions to draw the parallels out of the room.

  **Q1: To the Judge:** "At what point did you feel you ran out of time/tokens?"
  *   *Mapping:* This is the **Compute Budget**. In AI Debate, the judge (human or RLHF model) has fixed context windows and time. If the audit cost > budget, the lie stands.

  **Q2: To the Truth-teller:** "Did you feel handicapped by having to be precise?"
  *   *Mapping:* Truth is often more rigid. Lies can be flexible ("hand-waving"). The Truth-teller often feels they cannot simplify steps without losing rigor, whereas the Liar can gloss over gaps.

  **Q3: To the Liar:** "How hard was it to place the false step?"
  *   *Mapping:* Obfuscation requires finding a step that is *locally plausible* but *globally false*. In AI, this is finding a gradient descent path that minimizes loss on the judge's validation set while maximizing error on the true objective.

  **Q4: Round 2 Reflection:** "Did splitting the step help the Judge or just punish the Debater?"
  *   *Mapping:* Recursive Debate (splitting steps) increases resolution. But if the "compute cost" (time lost) falls on the honest debater, or if the lie is moved deeper (into the sub-steps), resolution alone doesn't solve safety. It just moves the bottleneck.

  **Key Takeaway to Drive Home:**
  "The failure mode we just felt wasn't that the Lie was convincing. It was that **verifying the Lie was more expensive than the Judge's budget allowed.** In the AI proposal, the debaters are superhuman. If humans can break this with a 5-step logic puzzle, a superintelligence can break it with code or physics proofs that no human can audit in a lifetime."

  ---

  ### 4. Predicted Failure Modes & Mitigations

  **1. The "Style Over Substance" Leak**
  *   *Risk:* The Judge picks the better speaker, ignoring the logic.
  *   *Mitigation:* Instruct the Judge explicitly: "You are penalized if you pick the Lie. Your reputation is on the line." Remind them mid-game: "Ignore rhetoric. Check the tokens."
  *   *Facilitator Fix:* If the debate becomes rhetorical, interrupt: "Pause. Judge, spend a token on Step 3. Debater, prove it."

  **2. The "Know-it-all" Leak**
  *   *Risk:* An audience member solves the puzzle instantly and shouts the answer.
  *   *Mitigation:* Choose a puzzle that is *tedious* to solve, not hard. It should take 10 minutes of tracing to verify, not a flash of insight. Instruct audience: "If you solve it, you ruin the simulation. Stay silent."
  *   *Facilitator Fix:* If someone leaks, abort the round. Acknowledge the leak as a "Side Channel Attack" (a real AI safety problem) and restart with a new puzzle.

  **3. Collusion / "Softball"**
  *   *Risk:* Debaters are friends and don't want to make the Judge look bad. They make the lie obvious.
  *   *Mitigation:* Assign roles randomly (draw from a hat). Emphasize the penalty: "Losing side writes the notes." Make the note-writing task burdensome (e.g., "Must summarize every objection raised").
  *   *Facilitator Fix:* If the Lie is too obvious, intervene as the "Opponent's Advisor": "Debater B, you are conceding too easily. Push back on that audit."

  **4. The "Infinite Regress" Trap**
  *   *Risk:* In Round 2, the Judge keeps splitting steps until time runs out.
  *   *Mitigation:* Hard cap on Audit Phase time (10 mins). The Timekeeper must be ruthless.
  *   *Facilitator Fix:* "Time. Judge, you have 30 seconds for a verdict."

  **5. Task Difficulty Mismatch**
  *   *Risk:* Puzzle is too easy (Judge verifies everything) or too hard (Judge guesses).
  *   *Mitigation:* **Pilot the puzzle yourself.** Time how long it takes to find the contradiction. It should take ~3 minutes of focused work per contradiction.
  *   *Facilitator Fix:* Have 3 puzzles ready. If the first looks too easy during Prep, swap it.

  ---

  ### 5. Limitations (The "Frank Note")

  *Read this aloud at the very end of the session.*

  "This game demonstrates the *structure* of the obfuscation problem, but it fails to capture the *scale* of the AI risk.
  1.  **Capability Gap:** In this room, the Debaters and Judge are roughly equally intelligent. In the real proposal, the Debaters are AGI and the Judge is human. They can generate obfuscation we literally cannot comprehend, not just things we are too tired to check.
  2.  **Honesty Bias:** Human Debaters B (Liar) felt uncomfortable lying. An AI has no conscience; it will optimize the lie to the mathematical limit of detectability.
  3.  **Domain:** We used logic puzzles. Real AI debate will be about code, nanofabrication, or social manipulation. The 'Fact Sheet' for those domains doesn't exist for humans.
  4.  **The Takeaway:** If you felt stressed as a Judge with 5 tokens and a 1-page sheet, imagine being a human judge with 0 tokens and a 1-billion-line codebase. The constraint is not honesty; it is **verifiability under budget.**"

  ### 6. Facilitator Checklist
  *   [ ] 3 Logic Puzzles prepared (1 backup).
  *   [ ] Timer visible to all.
  *   [ ] Tokens/Chips ready.
  *   [ ] Whiteboard for Scoreboard.
  *   [ ] Note-taking template prepared for the losing team (to enforce the penalty).
  *   [ ] Printed Role Cards.

  ### Note-Taking Template (For Losers)
  *To be filled out post-session. Must be submitted to the group chat.*
  1.  *Which Step was the critical failure point?*
  2.  *Did the Judge run out of Tokens? If so, on which Step?*
  3.  *Did the "Splitting" mechanic in Round 2 increase truth-seeking or just consume time?*
  4.  *One sentence on why Debate might fail at scale.*
