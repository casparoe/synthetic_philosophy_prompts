      *   *Wait, re-reading user prompt:* "Add a second round in which the judge may require any step to be split." Okay, I must include Round 2.
      *   *Timing Check:* 90 mins.
          *   Intro: 10
          *   Round 1 (Prep + Debate + Audit): 35
          *   Round 2 (Prep + Debate + Audit + Split): 35
          *   Reveal + Debrief: 10
          *   *Total:* 90. Tight but doable.

  11. **Refining the "Lie" Mechanism:**
      *   How to ensure the Liar *can* lie convincingly?
