answer: |-
  # Activity Design: The Private Ledger

  **Session Title:** The Settlement Game
  **Duration:** 90 Minutes (3 Rounds × 20 mins + 30 min Debrief)
  **Participants:** 15 Adults
  **Materials:** Projector, laptop, index cards (3 per person), pens, bowl of chocolate squares (stakes), whiteboard.
  **Facilitator Role:** Game Master / Banker. Do not explain *why*. Enforce rules.

  ---

  ## 1. The Setup (Minutes 0–5)

  **Facilitator Script:**
  "Welcome. For the next hour, we are running a settlement market. You will make claims about a specific property of your experience. You will write contracts specifying how those claims can be settled. If a contract settles, you earn chocolate. If it deadlocks, the House takes a chocolate from you.

  There are three rules:
  1. **No Forbidden Words:** You cannot use the words *qualia, phenomenal, inverted spectrum, zombie,* or *Mary*. If you do, you pay a penalty. You must coin your own term for the property we are testing.
  2. **Settlement is Mandatory:** A claim without a settlement condition is void. A void claim costs you a chocolate.
  3. **Third-Party Adjudication:** A settlement condition must be checkable by someone else in this room who did not have the experience.

  We begin with a calibration stimulus."

  **Perceptual Manipulation (The Stimulus):**
  1.  Project a **bright cyan circle** on a black background (Hex #00FFFF).
  2.  Instruct participants to stare at the center dot for **30 seconds** without blinking.
  3.  Switch slide to a **pure white screen** (Hex #FFFFFF).
  4.  **Instruction:** "You now see a reddish shape on the white screen. That reddish shape is the **Target Property**. Do not talk about the screen. Talk about the red shape you see."

  *(Note: The physical screen is white. The experience is red. This creates the gap between public fact and private experience.)*

  ---

  ## 2. Round 1: Re-identification (Minutes 5–25)
  **Goal:** Pull "Intrinsic" toward "Relational."

  **Task:**
  Participants work individually. They must bet on whether the Target Property they see *now* is the "same" as the Target Property they will see in 10 minutes (after re-running the calibration).

  **Ledger Card A (Individual):**
  > **Claim:** The [Coined Term] I see now is **IDENTICAL** to the [Coined Term] I will see in 10 minutes.
  > **Settlement Condition:** (Must be checkable by Facilitator)
  > __________________________________________________________________
  > **Stake:** 1 Chocolate.

  **Procedure:**
  1.  Participants fill Card A. (5 mins)
  2.  Facilitator collects cards. (2 mins)
  3.  **Distractor Task:** Group discusses "Optimal Index Card Folding" for 5 minutes to let the afterimage fade and memory drift.
  4.  **Re-Calibration:** Run the cyan/white trick again. (2 mins)
  5.  **Adjudication:** Participants review their own Card A conditions against their new experience. (6 mins)

  **The Trap:**
  *   If they write "It looks the same to me," the Facilitator rejects it (Not third-party checkable).
  *   If they write "It matches wavelength 650nm," the Facilitator accepts it, but points out the screen is white (Property is now relational to physics, not intrinsic to experience).
  *   If they write "It matches my memory," the Facilitator asks: "How do we check your memory without asking you?" (Property is relational to memory machinery).

  **Facilitator Action during Silence:**
  Walk around. If a card says "I feel it," cross it out and write "VOID." Tap the "Stake" column. Do not explain why.

  ---

  ## 3. Round 2: Inter-Subjective Comparison (Minutes 25–45)
  **Goal:** Pull "Private" toward "Public."

  **Task:**
  Participants pair up. They both view the stimulus. They must sign a contract claiming their [Coined Term] matches.

  **Ledger Card B (Pair):**
  > **Claim:** Partner A's [Coined Term] is **EQUIVALENT** to Partner B's [Coined Term].
  > **Settlement Condition:** (Must be checkable by a Third Party Pair)
  > __________________________________________________________________
  > **Stake:** 2 Chocolates.

  **Procedure:**
  1.  Pairs view stimulus together. (2 mins)
  2.  Draft Contract. (8 mins)
  3.  **Swap:** Pair 1 adjudicates Pair 2's contract. (5 mins)
  4.  **Scoring:** Facilitator tallies settled contracts on the whiteboard. (5 mins)

  **The Trap:**
  *   To settle, they must agree on a public proxy (e.g., "We both say 'Red'").
  *   Once they agree on the proxy, the Facilitator asks: "If a colorblind person says 'Red' but sees 'Grey', does your contract hold?"
  *   To ensure settlement, they must define the property by *behavior* or *physics*, surrendering its privacy.

  **Facilitator Action during Silence:**
  If a pair argues about "what it's really like," interrupt: "Settle the contract or forfeit the stake."

  ---

  ## 4. Round 3: The Silent Swap (Minutes 45–65)
  **Goal:** Pull "Immediately Apprehensible" toward "Unfalsifiable."

  **Task:**
  The Facilitator introduces a "Glitch." One participant (volunteer) is told their experience *might* have been swapped, but nothing public changed. The group must bet on whether the swap happened.

  **Ledger Card C (Group):**
  > **Claim:** The Volunteer's [Coined Term] **CHANGED** during the Glitch.
  > **Settlement Condition:** (Must be checkable without Volunteer's testimony)
  > __________________________________________________________________
  > **Stake:** 3 Chocolates (Pot).

  **Procedure:**
  1.  **The Glitch:** Volunteer stares at cyan. While eyes are closed, Facilitator whispers: "Imagine the red is now green." (Simulation of Inverted Spectrum).
  2.  Volunteer looks at white screen. (2 mins)
  3.  Group drafts Settlement Condition. (10 mins)
  4.  **The Vote:** Can this contract ever clear? (8 mins)

  **The Trap:**
  *   If the Volunteer says "It changed," and no physical fact changed, the claim is unfalsifiable.
  *   If the Group demands physical proof, the Volunteer says "The physics didn't change, *I* did."
  *   **Result:** No settlement condition is possible that respects both "Privacy" and "Settlement-Aptness."

  **Facilitator Action during Silence:**
  If someone suggests "Ask the volunteer," write on board: **FIRST-PERSON AUTHORITY = NO BET.**
  If someone suggests "Scan their brain," write: **NEURAL CORRELATE ≠ EXPERIENCE (Per your definition).**

  ---

  ## 5. The Collapse & Tally (Minutes 65–70)

  **Visible Number:**
  On the whiteboard, draw this table:

  | Round | Claims Made | Contracts Settled | Properties Retained* |
  | :--- | :---: | :---: | :---: |
  | 1 (Self) | 15 | __ | Intrinsic? [ ] |
  | 2 (Other) | 7 | __ | Private? [ ] |
  | 3 (Swap) | 1 | __ | Ineffable? [ ] |
  | **Total** | **23** | **__** | **Score: 0** |

  *\*Properties Retained is checked only if the settlement condition respected the property's nature.*

  **The Reveal:**
  You will find that **Settled Contracts > 0** only if **Properties Retained = 0**.
  To get the chocolate, they had to define the property as public, relational, and falsifiable. To keep the property "Private/Intrinsic," they earned zero chocolate.

  **Deadlock Rule (Enforced):**
  "If the group refuses to settle a contract by Minute 65, the House declares all claims **VOID**. No chocolate. This represents the market for this property collapsing."

  ---

  ## 6. Debrief (Minutes 70–90)

  **Step 1: Naming (5 mins)**
  "Look at the term you coined on your cards. Raise your hand if you think that term refers to what philosophers call 'Qualia'."
  (Write **QUALIA** on the board now. It is permitted.)

  **Step 2: Mapping the Squeeze (10 mins)**
  Map the rounds to the four properties of the standard posit (Ineffable, Intrinsic, Private, Immediate).

  *   **Round 1 (Re-identification):** You tried to keep it **Intrinsic**. To settle, you had to compare it to memory or physics. *Result:* It became **Relational**.
  *   **Round 2 (Comparison):** You tried to keep it **Private**. To settle, you had to use public language or behavior. *Result:* It became **Public**.
  *   **Round 3 (Swap):** You tried to keep it **Immediate/Ineffable**. To settle, you needed a third-party check. *Result:* It became **Unfalsifiable** (No bet possible).

  **Step 3: The Load-Bearing Property (5 mins)**
  "Which property broke the game?"
  **Answer:** **Settlement-Aptness.**
  A property that cannot be staked on is not a fact in a shared world. If you insist on the four standard properties, the property exists, but it cannot enter the ledger. It is not a 'fact' we can reason *with*, only a 'fact' we reason *from*.

  **Step 4: Handling Escape Routes (10 mins)**
  Anticipate these three objections and map them:

  1.  **"It's Functional/Relational":** (Retreat from Intrinsic).
      *   *Response:* "Fine. Then it's not a 'raw feel'. It's a discrimination state. We can bet on that. But you have surrendered the 'Intrinsic' claim."
  2.  **"I am the Authority":** (Retreat from Settlement).
      *   *Response:* "Then you are a Black Box. We cannot reason with you, only predict you. You exit the rationality marketplace."
  3.  **"It's Ineffable":** (Retreat from Definition).
      *   *Response:* "Then it is silent. Silence cannot be wrong, but it also cannot be right. It is outside the game."

  ---

  ## 7. Predictable Failures & Repairs

  | Failure Mode | Description | Specific Repair |
  | :--- | :--- | :--- |
  | **The Namer** | Participant says "This is about qualia" in Round 1. | **Repair:** "Write that word on the board under 'Forbidden'. You now owe the pot 1 chocolate. Continue using your coined term." |
  | **The Void** | Participant says "Nothing is verifiable, this is stupid." | **Repair:** "The rule is Settlement or Forfeit. If you choose 'Void', you pay the stake. You are free to lose chocolate to prove a philosophical point." |
  | **The Neuro** | Participant proposes "We settle by fMRI/Brain Scan." | **Repair:** "Budget is zero. Also: Does the scan measure the *fire* or the *feel*? If you bet on the fire, you have changed the subject from the Experience to the Correlate." |
  | **The Solipsist** | Participant says "I can't know other minds exist." | **Repair:** "Treat other players as API endpoints. You don't need to know they have minds, only that they return consistent outputs for the bet to clear." |

  ---

  ## 8. Limitations (Facilitator Notes)

  **What this activity DOES:**
  It demonstrates that the *concept* of qualia (as a bundle of Intrinsic, Private, Ineffable, Immediate properties) is **incoherent for the purpose of public reasoning and betting.** It shows that "Settlement-Aptness" is incompatible with the standard definition.

  **What this activity DOES NOT DO:**
  1.  **It does not prove experience doesn't exist.** It only proves that *talking about it as a fact* breaks the rules of shared discourse.
  2.  **It does not solve the Hard Problem.** It does not explain *why* there is experience, only why the *word* is troublesome.
  3.  **It does not touch the Knowledge Argument (Mary).** Mary's room is about information, not settlement. This game is about adjudication.

  **Facilitator Closing Script:**
  "We have shown that if you want to keep the property 'Private' and 'Intrinsic', you cannot bring it into the marketplace of ideas. You can keep it, but you cannot use it to win bets. If you want to win bets, you must trade the property for something public. The choice is yours: Be right in silence, or be useful in public. You cannot be both."

  ---

  ## 9. Contract Templates (Print on Index Cards)

  **Card A (Self)**
  > **CLAIMANT:** _______________
  > **TERM:** _______________
  > **ASSERTION:** My [TERM] at T1 is **SAME** as my [TERM] at T2.
  > **SETTLEMENT RULE:** (How does a stranger verify this?)
  > _________________________________________________________
  > **STAKE:** 🍫 1

  **Card B (Pair)**
  > **CLAIMANTS:** _______________ & _______________
  > **TERM:** _______________
  > **ASSERTION:** Our [TERM] instances are **EQUIVALENT**.
  > **SETTLEMENT RULE:** (How does a third pair verify this?)
  > _________________________________________________________
  > **STAKE:** 🍫 2

  **Card C (Group)**
  > **CLAIMANT:** The Group
  > **TERM:** _______________
  > **ASSERTION:** The Volunteer's [TERM] **CHANGED** silently.
  > **SETTLEMENT RULE:** (Without asking the Volunteer)
  > _________________________________________________________
  > **STAKE:** 🍫 3 (Pot)

  **HOUSE RULES (Project on Screen):**
  1.  **NO FORBIDDEN WORDS.** (Qualia, Phenomenal, Zombie, Mary, Inverted Spectrum).
  2.  **NO FIRST-PERSON AUTHORITY.** ("I say so" is not a settlement rule).
  3.  **DEADLOCK = HOUSE WINS.** (If not settled in time, Stake is forfeit).
