answer: |-
  The candle between them had burned down enough to pool wax on the tablecloth. Mara swirled the last of the Cabernet in her glass, watching the legs run down the side.

  "It's not about the numbers we count with, Elias. It's about the attic," she said. "Imagine the house is solid. You live in the kitchen, you sleep in the bedroom. But way up in the rafters, there's termites. Fine. Don't go in the attic."

  Elias stabbed a piece of carrot on his plate, not eating it, just moving it around. "You can't just don't go in the attic if the attic is holding up the roof."

  "The attic isn't holding up the kitchen table. That's the point. We're talking about large cardinals. Infinities so big they make the ones we use for calculus look like zero. If there's a contradiction there, it's quarantined. The proof of inconsistency might be so long it wouldn't fit in the observable universe. So for every calculation, every bridge, every quantum field theory equation, the system works. Perfectly."

  "So it works," Elias said, finally looking up. "But is it true?"

  "Does it matter? If the map gets you to the destination every single time, does it matter if the legend has a typo on the side?"

  "Yes," Elias said, putting the fork down. "Because you're claiming the map *is* the territory. That's the whole game. If math is just a tool, fine, keep your termites. But if math is describing objective reality—if two plus two equals four because that's how existence is structured—then a contradiction anywhere means the description is false. Everywhere."

  Mara leaned back, rubbing her temple. "You're treating truth like it's fragile glass. I'm telling you it's more like… fabric. You can have a hole in the hem and the shirt still keeps you warm."

  "A contradiction isn't a hole, Mara. It's a virus. Classical logic explodes. If you have one contradiction, you can prove anything. You can prove one equals zero. You can prove I'm not sitting here. If the axioms are inconsistent, then technically, the statement 'arithmetic works' is true, but so is 'arithmetic doesn't work.' They're both provable. You just haven't found the proof yet."

  "But I haven't found it in three thousand years," Mara said, smiling slightly. "And neither has anyone else. Maybe the proof is there, hidden up in the large cardinal stuff, but the derivation path to get down to basic arithmetic is so convoluted it's physically impossible to traverse. So why lose sleep over it?"

  "Because I want to know what's real," Elias said, his voice dropping. "Not what's useful. If the foundation is cracked, the building isn't stable, even if it hasn't fallen yet. It means we're living in a lucky accident. It means math isn't discovered, it's just a game we haven't lost yet."

  Mara poured more wine for both of them. The glug of the bottle filled the silence for a moment.

  "Okay," she said, setting the bottle down. "Let's say you're right. Let's say there is a rot in the foundation. Does that change the fact that prime numbers behave the way they behave? Does it change the distribution of primes? No. The behavior is consistent, even if our description of why it's consistent has a bug in the high-level code."

  "But the 'why' is the only part that counts!" Elias leaned forward, elbows on the table. "If the axioms are contradictory, then the behavior is contingent. It's just luck that the contradiction hasn't propagated down to us. That strips math of its necessity. It becomes empirical. Like physics. We just haven't observed the failure yet."

  "Is that so bad?" Mara asked. "Maybe math is empirical. Maybe we're just reverse-engineering the universe's operating system. If we find a bug in the OS, we don't say the computer isn't real. We say the OS has a bug."

  "Then it's not objective truth anymore. It's just… human consensus on what hasn't broken yet." Elias picked up his glass but didn't drink. "I need it to be more than that. I need to know that if everyone vanished, the primes would still be prime. If the axioms are inconsistent, then maybe the primes are only prime because the contradiction hasn't reached them yet. That's terrifying."

  Mara watched him for a long moment. She traced the rim of her glass. "You know, I think I get that. It's the loss of eternity. If the consistency is contingent on us not looking hard enough in the high infinities, then it's not eternal."

  "Exactly."

  "But," she said, raising a finger. "Does your version fix it? If we assume ZFC is consistent, we can't prove it. Gödel showed us that. So in your world, where you demand objective truth, you literally cannot verify it. You have to take it on faith. In my world, I take the reliability on faith. What's the difference?"

  Elias sighed, leaning back into the chair. The fight seemed to drain out of him, leaving just the exhaustion of the argument. "The difference is… intention. If I assume it's consistent, I'm assuming the structure holds. If you assume it's merely unbroken so far, you're assuming we're lucky. I'd rather be a believer in a system I can't prove than a pragmatist in a system I know is potentially broken."

  "That's faith, Elias. Pure theology."

  "Maybe." He took a sip of wine. "But if I'm going to spend my life chasing proofs, I need to believe the ground isn't going to turn to mud. Even if the mud is way up in the attic."

  Mara laughed softly. "The attic is pretty high up."

  "It's holding the roof."

  "Fine." She lifted her glass. "To the attic. May the termites stay quiet."

  Elias clinked his glass against hers. "And may we never find the proof."

  "Cheers to that." They drank. The candle flickered, casting long shadows against the wall, stable for the moment.
