answer: |-
  Your colleague's argument rests on treating time and money as neutral currencies. In her view, an hour of cleaning is an hour of cleaning, regardless of who performs it. This framework is defensible only if we assume that all bodies convert resources into functioning at the same rate. In your concrete case, this assumption is false. Because your condition imposes a steep "exchange rate" between labor and health, a strict fifty-fifty split of chores imposes a vastly heavier burden on you than on her. While her concern about subsidizing private misfortune is valid—no roommate should be responsible for curing the other's illness—ignoring the disparate impact of shared tasks effectively excludes you from full participation in the household. It treats the symptom (low energy) as a preference rather than a constraint on your agency.

  Conversely, your fear of equalizing welfare is also well-founded. If fairness required that you both end up with the same level of comfort or energy remaining at the end of the week, your colleague would become responsible for managing your internal state. This creates an open-ended liability where her labor is consumed by your health needs, transforming a partnership into a caregiving dynamic. This violates her boundary against subsidizing your misfortune and risks breeding resentment, which undermines the shared living arrangement.

  A more viable metric focuses on what each of you is actually able to do and be within the apartment, rather than what you put in (resources) or how you feel afterward (welfare). This approach distinguishes between your *basic capabilities* (your internal skills and knowledge to clean or cook) and your *combined capabilities* (your internal skills plus the external environment and health required to execute them). You possess the basic capability to clean, but your health constraints limit your combined capability to do so safely for two hours. Fairness here means ensuring you both have equivalent combined capabilities to maintain the home, not that you spend equivalent time doing it.

  To avoid paternalism, you must guard against *adaptive preferences*, where you might unconsciously lower your expectations of what you deserve because you are accustomed to being limited by illness. You should not accept a arrangement simply because you feel grateful for any accommodation. Instead, index fairness to functioning bundles: agree on a standard of cleanliness and household function, then allocate tasks based on who can achieve them with the least disproportionate cost to their capacity. This is non-paternalistic because it focuses on the task requirements rather than judging your health outcomes. Your colleague does not need to manage your energy; she only needs to agree that a task requiring 10 energy units should not be assigned to someone with a 5-unit budget if another option exists.

  The practical solution is to decouple time from contribution. Maintain the fifty-fifty rent split since your incomes are comparable, but weight chores by estimated energy cost rather than clock time. You might handle low-energy, high-focus tasks (billing, scheduling, light organizing) while she handles high-energy physical labor, ensuring the total "burden score" is balanced. This respects her labor without forcing you to burn out to meet an arbitrary clock-based standard.

