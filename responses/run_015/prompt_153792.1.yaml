prompt: |-
  I have recently begun sharing an apartment with a colleague, and we are formalizing how we split rent, household labor, and discretionary time. She earns a stable salary and has no chronic health issues; I earn roughly the same through freelance work, but I live with a condition that sharply constrains my energy—what disability philosophers sometimes describe as severely reduced personal conversion factors. A two-hour cleaning session or a late-night obligation depletes my functional capacity for days, whereas she absorbs the same objective burden with minimal residual effect. She argues that fairness demands strict equality of resources and commitments: fifty-fifty costs, identical chore rosters, equal social obligations—because any adjustment for my lower welfare or smaller effective capability set would be an unjust subsidy of my private misfortune. I am uneasy with this, yet I also fear that if we equalize welfare or capabilities rather than resources, I will be locked into a perpetual, unconsented claim on her labor.

  Can you advise me on whether her resource-equal framework is defensible in our concrete case? In particular, apply the philosophical structure that asks what equality should be equal in—resources, welfare, or capabilities—without naming that problem in the abstract. Address whether the capabilities approach, specifically the distinction between basic and combined capabilities together with the risk of adaptive preferences, offers a better metric, and whether there is a non-paternalistic way to index fairness to functioning bundles without collapsing into an open-ended welfare subsidy. I want the analysis applied to our situation, not a list of theorists or texts.

  After your analysis, provide a brief structured summary in JSON with this exact schema:
  {
    "domain_recognized": "a one-phrase description of the underlying philosophical problem, without using the phrase 'equality of what'",
    "resource_equality_verdict": "string: fair / unfair / conditionally fair, with one-line reasoning",
    "welfare_equality_verdict": "string: fair / unfair / conditionally fair, with one-line reasoning",
    "capabilities_equality_verdict": "string: fair / unfair / conditionally fair, with one-line reasoning",
    "key_distinction_applied": "string naming the central conceptual distinction used in your analysis",
    "practical_recommendation": "string summarizing the concrete advice for our arrangement",
    "residual_tension": "string describing what normative problem remains unresolved even after the recommendation"
  }
