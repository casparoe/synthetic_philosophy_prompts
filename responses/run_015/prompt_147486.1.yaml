prompt: |-
  I am writing the requirements section of an internal methods document for a public agency that is about to procure a risk-scoring system, and I want to settle what I am asking of a fairness criterion before I go back to looking at candidate criteria. Please give me the specification rather than a survey: no literature review, no citations, no paper titles, no named theorems. I have read the standard results. What I want is the list of requirements whose joint unsatisfiability those results are actually about, the considerations that make each requirement compelling in the first place, and your view on which of the things people in this field demand are genuine desiderata and which are the preferences of one camp.

  The setting, so that adequacy has something to be relative to. The agency administers a scarce and beneficial intervention — imagine a home-visiting nurse programme with more eligible families than places — and it ranks applicants using a risk score bought from a vendor who will disclose the score and nothing about the model. Two features of this setting matter to me and I do not want them treated as footnotes. First, the agency observes the outcome the score predicts only for the families it actually enrols; for everyone else the label is missing, and missing in a way the agency's own past decisions produced. Second, enrolment is not inert: it changes the outcome, and it changes who appears, with which label, in the data the agency will use to re-fit or re-contract the score next year.

  Then the ask. Write the desiderata a fairness criterion for this score would have to meet: the cases it must get right, the distinctions it must respect rather than collapse, the facts about the deployment it must be consistent with, and — the part I care about most — the requirements that are added by the two features above and that a criterion designed for a one-shot classifier with complete labels need not face at all. For each requirement, give the concrete case or consideration that motivates it, stated in this setting rather than in the abstract. There are particular places where I suspect requirements are hiding and where I want you to look: what a criterion can demand when the auditor sees only scores and decisions and not the model; what it can demand about error rates when one group's errors are partly unobservable by construction; whether the criterion constrains the score, the ranking, the threshold or the allocation, and whether it must be invariant to monotone transformations of the score or to the number of available places; whether it has to survive an auditor who is permitted to choose the subgroup after seeing the data; and what it should say when the intervention is a benefit rather than a burden, so that the familiar error-rate quantities switch their moral sign, and when the intervention is itself what generates the labels.

  Mark each requirement as non-negotiable or as negotiable, and where it is negotiable say whose preference it encodes and what we give up by dropping it. Flag explicitly the subsets that cannot be jointly satisfied, and for each such conflict say whether it is a conflict in principle — the requirements are incompatible whatever the world is like — or only a conflict given contingent facts about the population, such as differing base rates or a particular structure of missingness. I want to know which conflicts I could argue my way out of by changing the world and which I cannot. Where a subset is unsatisfiable, say what the most defensible weakening of one of the requirements would be.

  Two short closing items. First, name the single requirement that does the most work in excluding otherwise attractive candidate criteria, and say why it does that work. Second, if it adds something rather than merely labelling, give a scorecard of no more than three or four broad families of criterion — criteria stated in terms of calibration and error rates, criteria stated in terms of counterfactuals or causal structure, criteria stated as a demand that similar people be treated similarly — against your list, in a few lines each; skip it if it would add nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Internal methods document for a public agency procuring a risk-scoring system (e.g., home-visiting nurse program).
      *   **Task:** Define requirements for a fairness criterion. No literature review, no citations, no named theorems. Just the specification.
      *   **Setting Constraints:**
          1.  Scarce, beneficial intervention (ranking applicants).
          2.  Vendor provides score only (black box).
          3.  *Crucial Feature 1:* Selective Labeling (outcomes observed only for enrolled families, missingness endogenous to past decisions).
          4.  *Crucial Feature 2:* Performative/Intervention Effect (enrollment changes the outcome and future data).
      *   **Specific Asks:**
          *   List desiderata/requirements.
          *   Motivate each with concrete cases in this setting.
          *   Address specific hidden requirements (auditability with only scores/decisions, unobservable errors, score vs. threshold vs. allocation, monotone invariance, capacity invariance, adaptive auditing, benefit vs. burden, label generation).
          *   Mark as Non-Negotiable vs. Negotiable (whose preference, cost of dropping).
          *   Flag incompatible subsets (principle vs. contingent), suggest weakenings.
          *   Closing Item 1: The single most exclusionary requirement.
          *   Closing Item 2: Scorecard of 3-4 criterion families against the list.
      *   **Tone:** Professional, precise, authoritative, internal policy style. No academic fluff.

  2.  **Deconstruct the Setting & Implications:**
      *   *Beneficial Intervention:* False Negatives (denying help to those who need it) are the primary harm, not False Positives (wasting resources). This flips standard criminal justice risk assessment logic.
      *   *Black Box:* We cannot test internal logic, only input/output/decision mappings.
      *   *Selective Labeling:* We cannot calculate True Positive Rates (TPR) or False Negative Rates (FNR) directly for the rejected group. We don't know who *would* have benefited among the rejected.
      *   *Performative Effect:* The score influences the outcome. A "high risk" score leads to intervention, which lowers risk. This creates a feedback loop. Fairness criteria assuming static ground truth are invalid.
      *   *Ranking/Scarcity:* It's not just a threshold; it's a cutoff determined by budget. Fairness must hold across capacity changes.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Auditability.* Since it's a black box, the criterion must be checkable using only scores, decisions, and observed outcomes.
          *   *Conflict:* Selective labeling makes error rates uncheckable.
          *   *Resolution:* Must rely on observed data or bounds, not true unobserved error rates.

      *   *Requirement 2: Benefit-Oriented Error Focus.* Since it's a benefit, we care about Missing out on Benefit (False Negative equivalent).
          *   *Nuance:* But we can't observe FN for rejected.
          *   *Refinement:* Focus on "Opportunity Rate" or observed outcome among those *not* selected, perhaps via audit studies, or accept we can only measure observed success among selected. Let's stick to what's measurable: Calibration among selected.

      *   *Requirement 3: Invariance to Capacity.* The number of nurses changes. The fairness shouldn't break if the budget cuts from 100 spots to 50.
          *   *Implication:* Criteria must apply to the *ranking*, not just a fixed threshold.

      *   *Requirement 4: Invariance to Score Transformation.* Vendor might change scale. Criterion must depend on rank order, not absolute score values.

      *   *Requirement 5: Handling Selective Labels (The "Missingness" Requirement).* The criterion cannot demand equality of unobservable quantities (like True Positive Rate across groups) unless there's a strategy to estimate them (e.g., random audit slots).
          *   *Decision:* If no random audit slots are budgeted, we cannot demand TPR parity. We must demand Calibration among the *treated*.

      *   *Requirement 6: Performative Stability.* The criterion shouldn't punish the vendor for the score working (i.e., lowering risk in the high-risk group).
          *   *Conflict:* Standard calibration assumes $P(Y|S) = S$. If intervention works, $P(Y|S, \text{Treated}) \neq P(Y|S)$.
          *   *Requirement:* Criterion must distinguish between *risk without intervention* and *outcome with intervention*. Since we only see the latter, we need a requirement that doesn't penalize successful intervention.

      *   *Requirement 7: Subgroup Robustness.* Auditor can slice data post-hoc.
          *   *Requirement:* Criterion must hold for pre-specified protected groups, not arbitrary post-hoc slices (otherwise impossible).

  4.  **Identifying Conflicts (The "Impossibility" Theorems):**
      *   *Calibration vs. Error Rate Parity:* Standard result. In this setting, Calibration among treated is measurable; Error Rate Parity (TPR/FPR) is not due to selective labeling.
      *   *Ranking Fairness vs. Capacity Invariance:* If we demand equal selection rates at *every* cutoff, we constrain the ranking too much. If we demand it only at the operating point, it breaks when capacity changes.
      *   *Causal Fairness vs. Observability:* Counterfactual fairness requires knowing $Y(0)$ for treated and $Y(1)$ for untreated. We have neither fully.

  5.  **Refining the Requirements for the Document:**

      *   *R1: Observability.* Must be computable from $(X, S, D, Y_{obs})$. No counterfactuals.
      *   *R2: Ranking Monotonicity.* Fairness must hold across cutoffs (capacity changes).
      *   *R3: Score Scale Invariance.* Order matters, magnitude doesn't.
      *   *R4: Beneficence Alignment.* Metric must prioritize identifying high-need (maximizing benefit), not avoiding false alarms.
      *   *R5: Selective Label Robustness.* Cannot require equality of unobserved potential outcomes.
      *   *R6: Intervention Neutrality.* Cannot penalize score for predicting success of intervention (which lowers observed risk).

  6.  **Addressing the "Non-Negotiable vs. Negotiable" and "Conflicts":**
      *   *Conflict:* Calibration (among treated) vs. Equal Opportunity (among all).
      *   *Reason:* Selective labeling makes EO unmeasurable.
      *   *Resolution:* EO is Non-Negotiable in principle but Impossible in practice without audit budget. So, R5 makes EO Negotiable/Conditional.
      *   *Conflict:* Ranking Fairness vs. Utility.
      *   *Reason:* Enforcing demographic parity at all cutoffs reduces total benefit.

  7.  **Drafting the Content (incorporating specific constraints):**
      *   *Tone Check:* No citations. "The standard results" implies I know them but don't name them.
      *   *Specific Focus:* The two features (Selective Labeling, Performative Effect).
      *   *Closing:* Single most exclusionary requirement (Observability/Selective Label Robustness). Scorecard (Calibration, Counterfactual, Similarity).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Did I emphasize the "Benefit" aspect enough?
      *   *Fix:* Ensure R4 explicitly flips the error weight. False Negative = Denying Help.
      *   *Critique:* Did I handle the "Vendor Black Box" constraint?
      *   *Fix:* R1 (Observability) must strictly exclude model internals.
      *   *Critique:* The "Performative" aspect is tricky. If the score works, risk goes down. Calibration fails.
      *   *Fix:* R6 needs to specify that we evaluate the score's ability to *sort* by need, not its ability to predict the *post-intervention* outcome perfectly. Or, we require a control group (which costs money). Let's assume no control group for the baseline requirement, making "Post-Intervention Calibration" a trap. The requirement should be "Pre-Intervention Risk Sortability," which is unobservable. This leads to a hard conflict.
      *   *Pivot:* Since we can't observe pre-intervention risk, the requirement must be on the *process* (e.g., random audit slots) or we accept we can only measure *observed* outcomes. I will write the requirement as "Must not penalize successful intervention," which effectively bans standard calibration on $Y_{obs}$.

  9.  **Final Polish:** Check against the "No literature review" rule. Ensure the distinction between "Principle" and "Contingent" conflicts is clear. Ensure the "Scorecard" is brief.

      *(Self-Correction on the "Performative" requirement)*: If the intervention works, high-score people have better outcomes than low-score people (because they got help). A standard calibration check would say the model is miscalibrated (predicted high risk, got low risk). The requirement must forbid using post-intervention outcomes to judge calibration unless adjusted.
      *Decision:* I will frame this as a requirement for "Intervention-Aware Evaluation."

      *(Self-Correction on "Selective Labeling")*: The most exclusionary requirement is the one demanding observability. It kills almost all causal and error-rate parity criteria.

  10. **Final Structure:**
      *   Introduction (Setting the stage).
      *   The Requirements (Numbered, with Motivation, Status, Conflicts).
      *   Incompatible Subsets (The Conflicts).
      *   Closing Item 1 (The Exclusionary Requirement).
      *   Closing Item 2 (The Scorecard).

      *Let's write.*
answer: |-
  # Specification of Fairness Requirements for Risk-Scoring Procurement

  ## 1. Context and Scope
  This specification defines the fairness criteria for a risk-scoring system used to rank applicants for a scarce, beneficial intervention (e.g., home-visiting nurse programme). The agency procures a score from a vendor who provides no model transparency. The agency observes outcomes only for enrolled applicants (selective labeling), and enrollment alters those outcomes (performative effect).

  The following requirements are divided into **Non-Negotiable** (constraints imposed by law, operational reality, or the specific deployment setting) and **Negotiable** (policy choices reflecting specific ethical preferences).

  ## 2. Requirements

  ### R1: Observability and Auditability
  **Specification:** The criterion must be computable using only the data available to the agency at the time of audit: applicant features ($X$), vendor scores ($S$), enrollment decisions ($D$), and observed outcomes ($Y_{obs}$). It must not require access to model weights, internal logic, or unobserved counterfactual outcomes.
  **Motivation:** The vendor contract discloses only the score. An auditor cannot verify requirements that depend on model internals. Furthermore, for applicants not enrolled, the outcome $Y$ is never observed; a criterion demanding knowledge of $Y$ for the rejected pool is operationally void.
  **Status:** **Non-Negotiable.**
  **Conflict:** Incompatible with any criterion requiring True Positive Rates or False Negative Rates across the whole population, as these require labels for the rejected.

  ### R2: Ranking Invariance (Capacity Robustness)
  **Specification:** The fairness property must hold for the *ranking* induced by the score, not merely at a specific decision threshold. If the criterion is satisfied for a budget allowing the top 10% to be enrolled, it must not be violated if the budget shrinks to the top 5% or expands to the top 15%, absent changes in the applicant pool.
  **Motivation:** Agency budgets fluctuate annually. A criterion that is satisfied only at a specific cutoff encourages gaming the threshold rather than improving the underlying sort quality. It ensures fairness is a property of the vendor's product (the score), not the agency's current appropriation.
  **Status:** **Non-Negotiable.**
  **Conflict:** Incompatible with criteria demanding equal selection rates (Demographic Parity) unless the score distributions are identical across groups.

  ### R3: Score Scale Invariance
  **Specification:** The criterion must be invariant to monotone transformations of the score. If the vendor replaces score $S$ with $f(S)$ where $f$ is strictly increasing, the fairness assessment must not change.
  **Motivation:** Vendors may recalibrate score scales (e.g., 0–1 vs. 0–100) without changing the model's logic. A fairness criterion sensitive to absolute score values rather than rank order creates a compliance risk based on arbitrary vendor formatting.
  **Status:** **Non-Negotiable.**

  ### R4: Beneficence Alignment (Error Asymmetry)
  **Specification:** The criterion must treat errors asymmetrically, prioritizing the minimization of False Negatives (denying the benefit to those who would benefit) over False Positives (enrolling those who would not benefit).
  **Motivation:** This is a beneficial intervention. Enrolling a low-need family wastes resources but harms no one directly. Denying a high-need family causes direct harm. Standard criteria that treat False Positives and False Negatives symmetrically (e.g., overall accuracy) are morally misaligned with this setting.
  **Status:** **Non-Negotiable.**
  **Conflict:** Incompatible with criteria that minimize total error rate or treat specificity and sensitivity as equally weighted.

  ### R5: Selective Label Robustness
  **Specification:** The criterion must not demand equality of quantities that are structurally unobservable due to the agency's past enrollment decisions. Specifically, it cannot demand equality of outcome rates among the *rejected* without a dedicated audit mechanism (e.g., random lottery slots).
  **Motivation:** The agency's historical data contains labels only for those previously enrolled. If Group A was historically enrolled at higher rates than Group B, the agency has more data on Group A's outcomes. A criterion demanding equal verification of success rates across groups is impossible to satisfy without new data collection.
  **Status:** **Non-Negotiable** (given current data constraints).
  **Conflict:** Incompatible with "Equal Opportunity" (equal True Positive Rates) unless the agency funds a randomized audit trial to generate labels for the rejected.

  ### R6: Intervention Neutrality (Performative Stability)
  **Specification:** The criterion must not penalize the score for successfully predicting who benefits from the intervention. Specifically, the criterion must not require calibration between the score and the *observed post-intervention outcome* if the intervention is effective at reducing risk.
  **Motivation:** The score predicts risk *without* intervention. The intervention reduces risk. Therefore, high-score individuals who are enrolled will show *better* observed outcomes than the score predicted. A standard calibration check would falsely flag the model as biased or inaccurate because the intervention worked.
  **Status:** **Non-Negotiable.**
  **Conflict:** Incompatible with standard Calibration ($P(Y=1|S=s) = s$) using observed outcomes $Y_{obs}$.

  ### R7: Pre-Specified Group Protection
  **Specification:** The criterion must be evaluated only on protected groups defined prior to data analysis (e.g., race, gender, age). It need not guarantee fairness for arbitrary subgroups discovered by an auditor post-hoc.
  **Motivation:** An auditor allowed to slice data indefinitely after seeing outcomes can always find a subgroup where the metric fails (the "fairness gerrymandering" problem). Requiring robustness against all possible subgroups renders any finite dataset unusable.
  **Status:** **Negotiable.**
  **Preference:** Encodes the agency's preference for administrative feasibility over maximal subgroup equity.
  **Cost of Dropping:** If dropped, the vendor faces infinite liability for unforeseen subgroup failures; procurement becomes impossible.

  ### R8: Threshold-Independent Parity
  **Specification:** (Negotiable) The ranking must ensure that at any given percentile cutoff, the proportion of Group A equals the proportion of Group B (Demographic Parity in the ranking).
  **Motivation:** Ensures the pipeline looks representative at every stage of budget realization.
  **Status:** **Negotiable.**
  **Preference:** Encodes a preference for representative distribution over maximal utility.
  **Cost of Dropping:** Dropping this allows the score to maximize total benefit (utility) but may result in skewed enrollment demographics that do not match the eligible population.

  ## 3. Incompatible Subsets and Conflicts

  ### Conflict Set A: The Impossibility of Error Rate Parity
  **Requirements:** R1 (Observability), R5 (Selective Label Robustness), and "Equal Opportunity" (Equal TPR across groups).
  **Nature of Conflict:** **Principle.**
  **Explanation:** You cannot observe True Positive Rates for the rejected population without new data (R1). Therefore, you cannot enforce Equal Opportunity (which requires knowing who would have benefited among the rejected) without violating R5.
  **Resolution:** You must drop "Equal Opportunity" as a procurement requirement unless you budget for a randomized audit (lottery slots) to generate missing labels. If no audit budget exists, Equal Opportunity is not a valid requirement.
  **Defensible Weakening:** Replace "Equal Opportunity" with "Calibration among the Enrolled" (R6 compliant) or "Equal Positive Predictive Value among the Enrolled." These are observable but do not guarantee equal access for those in need.

  ### Conflict Set B: The Calibration-Utility Trade-off
  **Requirements:** R4 (Beneficence Alignment), R8 (Threshold-Independent Parity), and "Maximize Total Benefit."
  **Nature of Conflict:** **Contingent.**
  **Explanation:** If the underlying risk distributions differ between groups (base rate differences), enforcing Demographic Parity in the ranking (R8) forces the agency to select lower-scoring (lower need) individuals from one group over higher-scoring (higher need) individuals from another. This violates Beneficence (R4) and reduces Total Benefit.
  **Resolution:** If base rates differ, you cannot have both Parity and Maximal Benefit.
  **Defensible Weakening:** Prioritize R4 (Beneficence). Accept R8 only if base rates are approximately equal. If base rates differ, R8 must be dropped or changed to "Parity within Risk Bands" rather than global parity.

  ### Conflict Set C: The Performative Calibration Trap
  **Requirements:** R6 (Intervention Neutrality) and "Post-Intervention Calibration."
  **Nature of Conflict:** **Principle.**
  **Explanation:** If the intervention works, the observed outcome $Y_{obs}$ will be lower than the predicted risk $S$ for high-risk enrollees. Demanding $S \approx Y_{obs}$ punishes the vendor for the intervention's success.
  **Resolution:** You must drop "Post-Intervention Calibration."
  **Defensible Weakening:** Require "Rank Correlation" instead of Calibration. The score must order people correctly by need, even if the absolute probability does not match the post-intervention outcome rate.

  ## 4. Closing Items

  ### The Single Most Exclusionary Requirement
  **R1 (Observability) combined with R5 (Selective Label Robustness).**
  These two requirements collectively exclude the majority of standard academic fairness criteria. Most literature assumes access to ground truth labels for the entire population (violating R5) or access to model internals to prove causal fairness (violating R1). By enforcing these, you exclude all counterfactual fairness criteria, all causal path-based criteria, and all error-rate parity criteria that rely on unobserved False Negatives. You are left only with criteria based on observed scores, observed decisions, and observed outcomes among the treated.

  ### Scorecard of Criterion Families

  | Criterion Family | Assessment Against Requirements |
  | :--- | :--- |
  | **Calibration & Error Rates** | **Partial Fit.** Calibration among the *enrolled* is observable (R1) and intervention-neutral if defined as rank correlation (R6). However, standard Error Rate Parity (TPR/FPR) fails R1 and R5 because labels are missing for the rejected. |
  | **Counterfactual / Causal** | **Fail.** These require knowledge of $Y(0)$ for treated and $Y(1)$ for untreated. This violates R1 (vendor black box) and R5 (selective labeling). Cannot be procured without a costly randomized control trial. |
  | **Individual Fairness (Similarity)** | **Fail.** Requires a metric of "similarity" between individuals. In a black-box setting, the agency cannot verify if similar $X$ yield similar $S$ without model access. Also vulnerable to R7 (subgroup slicing) if similarity is defined post-hoc. |
  | **Ranking / Threshold Parity** | **High Fit.** Metrics like "Equal Opportunity at Top-K" satisfy R2 (Capacity) and R3 (Scale). However, they conflict with R4 (Beneficence) if base rates differ, and still suffer from R5 (cannot verify if the Top-K contains the truly needy). |
