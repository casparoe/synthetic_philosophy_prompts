  | 1 | Chess Engine | Tool | Fine | Yes |
  | 2 | LLM + Calc | Tool | Fine | Yes |
  | 3 | Autocomplete | Tool | Fine | Yes |
  | 4 | Coding Agent (PR) | Agent | Fine | Yes |
  | 5 | Coding Agent (Merge) | Agent | Not Fine | Yes |
  | 6 | Trading Bot | Agent | Fine | Yes |
  | 7 | Email Assistant | Agent | Not Fine | Yes |
  | 8 | Support Refunds | Agent | Not Fine | Yes |
  | 9 | Spam Filter | Agent | Fine | Yes |
  | 10 | Game NPC | Agent | Fine | Yes |

  Verdict: Automation is acceptable when it manages resources within bounds, but unacceptable when it makes commitments or mimics identity without per-instance consent.
