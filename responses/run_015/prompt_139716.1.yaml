prompt: |-
  I cover science and ideas for a mid-size outlet, and I've been chewing on something a friend from grad school mentioned once — Good's theorem on the value of information, the result (I.J. Good, 1960s something-or-other, I never read the original) that free information can't have negative expected value for someone who maximizes expected utility coherently, and, more usefully for me, that a piece of information is worth nothing unless it could change what you'd actually do. I want to turn that into something I can run, because my real problem isn't "should I believe this study," it's "should I wait for one more thing before I file." This comes up maybe twice a week: I have a draft, a deadline six to twenty hours out, a standards editor who has to sign off on anything carrying a health or risk claim, and one or two calls I could still make — the study's statistician, a second lab that isn't in the press release, the agency press office. Everyone in my newsroom has an opinion and they're all vibes ("it can't hurt to check one more source"), and I'd like an actual procedure with a fixed order of questions and defined stopping points instead of that.

  Here's the wrinkle I keep getting stuck on, and I want it handled head-on rather than smoothed over. When I do the extra reporting, half the time what changes isn't the claim but the verb: "shows" becomes "suggests," "doubles the risk" becomes "is associated with a higher risk." I've started calling this the hedge sink — information whose entire effect is to soften the hedging language rather than the content. Taken naively, Good's theorem says that information was worthless, since my publish/don't-publish decision was never going to flip on it. But the hedge is an action I take, and what readers do (do they stop taking the thing, does the agency open a review) turns on it, and once you let hedges count as actions it feels like any scrap of information can change some action and the theorem stops biting. So should the procedure count a change of verb as a change of action? If it does, what's left of the discipline? My half-baked thought is a two-decision rule — value the information against my filing decision and separately against the downstream reader's or regulator's decision, and treat it as the interesting case when those two disagree — but I don't trust it and I'd rather have something I can defend to my editor.

  So: give me a decision procedure, in words, that a reporter with no stats training can run in under an hour, on the back of an envelope if need be. It should spell out what to write down first (I'm guessing: name the decision the information is supposed to change before you go get it), what counts as a sufficient answer to each question, where it stops with "file now," where it stops with "wait," where it hands the decision to my editor because it's a values question rather than a factual one (how bad a false alarm is relative to a missed harm is not mine to settle), and where it simply doesn't work. Two things it definately has to handle: scoop risk, meaning if I wait for the replication a competitor may file first and my information becomes worth approximately nothing because the public conversation already moved without me; and the fact that my "second source" usually isn't independent — same lab, same funder, same press release feeding four outlets — which I suspect makes the value of that extra call much smaller than it feels. Then run the procedure on three cases: (a) a preprint, n=23, linking a common sleep supplement to elevated liver enzymes, with a rumor that a bigger outlet already has it; (b) a leaked draft of a government risk assessment for an industrial solvent, where the final version is due in nine days and might well come out softer; and (c) a piece I've spent three weeks on and love, where I'm dying to make one more call to the lead author — I want to see the procedure tell me something I don't want to hear, so if it concludes that call is theater, say so plainly. Finally, be straight with me about what the procedure can't do: is this just expected-value bookkeeping with a reporting-shaped paint job, or does it catch something my newsroom intuition actually misses?
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Science/ideas reporter for a mid-size outlet.
      *   **Problem:** Decision paralysis near deadline ("should I wait for one more thing before I file?"). Current process is based on "vibes."
      *   **Goal:** A concrete, defensible decision procedure based on Good's Theorem (value of information) but adapted for journalism.
      *   **Key Constraint/Wrinkle:** The "Hedge Sink" problem. Information often changes the *verb* (hedging) rather than the *decision* (publish/don't publish). Does this count as value?
      *   **Requirements:**
          *   Written procedure (words, not math).
          *   Runnable in < 1 hour.
          *   Define stopping points (File Now, Wait, Escalate to Editor, Abort).
          *   Handle "Scoop Risk" (competitors filing first).
          *   Handle "Non-Independent Sources" (same lab/funder).
          *   Run on three specific cases (a, b, c).
          *   Honest assessment of limitations (is this just EV bookkeeping?).

  2.  **Deconstruct Good's Theorem for Journalism:**
      *   *Good's Theorem:* Expected value of information (EVI) is non-negative for a rational agent *if* the information can change the decision.
      *   *Journalistic Translation:* Information is only worth the cost (time/scoop risk) if it changes the *output* or the *consequences of the output*.
      *   *The Hedge Sink:* Changing "shows" to "suggests" *is* a change in output. It changes reader behavior and regulatory reaction. Therefore, it *does* count as value, BUT it must be weighed against the cost of delay.
      *   *The Twist:* The user is right to worry. If *any* hedge change counts, you never stop reporting. The discipline comes from defining *material* changes in the hedge.

  3.  **Drafting the Procedure (The "Good-Gate" Protocol):**
      *   *Step 1: Define the Decision.* Before calling, what are the options? (File as is, File with hedge, Kill story, Wait).
      *   *Step 2: Define the Trigger.* What specific answer from the source would flip the decision? (Pre-mortem).
      *   *Step 3: Assess Independence.* Is the new info actually new? (Correlation check).
      *   *Step 4: Assess Scoop Risk.* What happens if I wait?
      *   *Step 5: The Hedge Test.* Does this change the verb enough to alter reader action?
      *   *Step 6: The Editor Handoff.* When is it a values call, not a facts call?

  4.  **Refining the "Hedge Sink" Issue:**
      *   The user asks: "Should the procedure count a change of verb as a change of action?"
      *   *Answer:* Yes, but only if the hedge change crosses a *threshold of consequence*. "Suggests" vs. "Shows" matters for health claims. "Possibly" vs. "Maybe" doesn't.
      *   *Solution:* Define "Material Hedge Shift." A shift is material if it changes the *recommendation* implied to the reader (e.g., "Stop taking this" vs. "Watch this space").

  5.  **Addressing the Constraints:**
      *   *Scoop Risk:* Needs a specific variable. If Competitor Files > Value of Info, then File Now.
      *   *Non-Independent Sources:* Discount the EVI. If Source B is funded by Source A, the probability of them changing your mind is low.
      *   *Time Limit:* Keep steps binary (Yes/No).

  6.  **Developing the Three Cases:**
      *   *(a) Sleep Supplement Preprint:* High scoop risk, low n, health claim. Procedure should likely say "File with heavy hedge now" or "File now, update later." Waiting for replication is impossible given the rumor.
      *   *(b) Leaked Govt Draft:* High stakes, deadline known (9 days). Scoop risk low (it's leaked). Value of waiting is high (final version might differ). Procedure should say "Wait/Verify with agency."
      *   *(c) The Pet Project:* Emotional attachment. Lead author call is likely "theater" (confirmation bias). Procedure should flag this as low EVI due to lack of independence and high opportunity cost.

  7.  **Addressing the "What it can't do" Question:**
      *   Is this just EV bookkeeping? Yes, essentially. But the value isn't the math; it's the *pre-commitment*. It stops the emotional drift. It forces the reporter to admit *why* they are calling.
      *   It catches the "Hedge Sink" trap by forcing the definition of *material* hedge changes.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, direct, respectful of the user's expertise. No fluff.
      *   *Structure:*
          1.  The Core Concept (Good's Theorem adapted).
          2.  The Procedure (The "Stop-Loss Reporting Protocol").
          3.  The Three Cases.
          4.  The Limitations (Honest assessment).
      *   *Key Insight:* The "Hedge Sink" isn't a bug; it's a feature, but it needs a threshold. A verb change is an action *if* it changes the liability or the reader's risk calculus.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex?
      *   *Fix:* Simplify the steps. Use a checklist format.
      *   *Critique:* Did I answer the "Hedge Sink" question directly?
      *   *Fix:* Make sure Step 4 explicitly addresses verb changes and sets a bar for when they count.
      *   *Critique:* Is the distinction between "Values" and "Facts" clear?
      *   *Fix:* Create a specific "Escalate to Editor" trigger for when the risk tolerance is the variable, not the data.

  10. **Final Polish:** Ensure the voice matches a seasoned editor talking to a reporter. (e.g., "Don't report to feel safe; report to change the story.")

  *(Self-Correction on the "Hedge Sink" logic)*: I need to be careful here. Good's theorem says information has value if it changes the *optimal action*. If the action is "Publish," and the info changes it to "Publish with different verb," that is a different action *if* the verb carries different utility/risk. I will formalize this as the "Material Consequence Test."

  *(Self-Correction on Case C)*: The user wants the procedure to tell them something they don't want to hear. I need to make sure the logic regarding "independence" and "marginal utility" hits hard there.

  *(Final check on constraints)*: < 1 hour to run? Yes, it's a mental checklist. Back of envelope? Yes.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your constraints. It adapts Good's Theorem into a newsroom context, treating "hedging" as an action only when it crosses a threshold of material consequence.

  ### The Stop-Loss Reporting Protocol

  **Premise:** Information has zero value if it cannot change your output or the consequences of that output. Reporting to reduce anxiety is a cost, not an investment.

  **Time Required:** 15 minutes (before you make the call).
  **Tools:** One sheet of paper or a blank email draft.

  ---

  #### Step 1: Define the Binary (The "Pre-Mortem")
  Before you dial or email, write down the **Decision State** you are currently in.
  *   **Option A:** File the story as it stands now.
  *   **Option B:** Delay filing to acquire specific information $X$.

  *Constraint:* You are not allowed to choose "File later with whatever I find." You must define what $X$ is (e.g., "Confirmation from statistician that p-value holds," "Comment from independent lab").

  #### Step 2: The Flip Condition
  Write down the **Specific Answer** from source $X$ that would force you to choose Option B (Delay) or change Option A (File) significantly.
  *   *Bad Flip Condition:* "They give me a quote that makes me feel better."
  *   *Good Flip Condition:* "They confirm the confidence interval crosses 1.0," or "They state the sample was not randomized."

  **The Test:** If the source gives you the *opposite* of the answer you hope for, does it kill the story or force a major rewrite?
  *   **No:** Stop. File now. The information has no negative expected value, meaning it cannot change your decision.
  *   **Yes:** Proceed to Step 3.

  #### Step 3: The Independence Discount
  Assess the source's independence from your existing reporting.
  *   **High Independence:** Different lab, different funding, adversarial relationship. (Discount factor: 1.0)
  *   **Low Independence:** Same lab, same funder, co-author, or PR intermediary. (Discount factor: 0.2)

  **The Rule:** If the source is Low Independence, the probability of them providing a "Flip Condition" answer is negligible. You are seeking validation, not information.
  *   **Action:** Unless the scoop risk (Step 4) is zero, **File Now.** Do not make the call.

  #### Step 4: The Scoop Risk Calculation
  Estimate the probability ($P_{scoop}$) that a competitor files while you wait for $X$.
  *   **High Risk:** Rumor of competitor filing, preprint just dropped, embargo lifting soon.
  *   **Low Risk:** Leaked document, long-lead feature, exclusive data.

  **The Rule:** If $P_{scoop}$ is High, the value of being first outweighs the value of precision *unless* the potential error creates legal/ethical liability.
  *   **Action:** If High Risk + Low Liability = **File Now** (with appropriate hedging).
  *   **Action:** If High Risk + High Liability = **Escalate to Editor** (Step 6).

  #### Step 5: The Hedge Sink Test (The Verb Check)
  You noted that info often changes "shows" to "suggests." Does this count as a decision change?
  *   **Material Hedge:** Changes the reader's risk calculus or regulatory trigger (e.g., "Causes cancer" vs. "Linked to cancer in mice"; "Take this" vs. "Ask your doctor").
  *   **Immaterial Hedge:** Synonymous softening (e.g., "Demonstrates" vs. "Shows"; "Likely" vs. "Probably").

  **The Rule:** If the expected information only produces an *Immaterial Hedge*, it is worth nothing.
  *   **Action:** If the Flip Condition (Step 2) only yields an Immaterial Hedge, **File Now.**
  *   **Action:** If it yields a Material Hedge, proceed to Step 6.

  #### Step 6: The Values Handoff
  If the procedure reaches here, you have identified that waiting provides Material Hedge value, but involves Scoop Risk or Deadline pressure. This is no longer a factual question; it is a risk-tolerance question.
  *   **Action:** Do not decide alone. Go to your Standards Editor or Desk Editor.
  *   **Script:** "I can file now with [Verb A], or wait 4 hours for [Source X] which might allow [Verb B]. Waiting risks [Competitor Y] scooping us. Is the liability of Verb A worth the scoop risk?"
  *   **Outcome:** Their decision is final. This removes the burden from your utility function.

  ---

  ### Running the Procedure on Your Cases

  #### Case (a): The Sleep Supplement Preprint
  *   **Context:** n=23, liver enzymes, rumor of competitor filing.
  *   **Step 1 (Decision):** File now vs. Call statistician.
  *   **Step 2 (Flip):** Statistician says "p-hacking detected."
  *   **Step 3 (Independence):** Statistician is on the paper. **Low Independence.** (Discount 0.2). They are unlikely to torpedo their own preprint on background.
  *   **Step 4 (Scoop):** **High Risk.** Rumor of competitor.
  *   **Step 5 (Hedge):** Even if the stat is shaky, n=23 demands "suggests/associated with" regardless. A call won't change "shows" to "suggests"; the sample size already dictates "suggests." **Immaterial Hedge.**
  *   **Result:** **FILE NOW.**
  *   **Why:** The source is biased, the scoop risk is high, and the sample size already mandates the hedge you are worried about. The call is theater.

  #### Case (b): The Leaked Govt Risk Assessment
  *   **Context:** Leaked draft, final due in 9 days, might soften.
  *   **Step 1 (Decision):** File on leak vs. Wait for final.
  *   **Step 2 (Flip):** Final version removes the hazard classification.
  *   **Step 3 (Independence):** Final document is independent of the leak. **High Independence.**
  *   **Step 4 (Scoop):** **Low Risk.** It's a leak; you have the document. Competitors don't have it yet.
  *   **Step 5 (Hedge):** "Classified as toxic" vs. "Under review." **Material Hedge.** Drastically changes industry/regulatory reaction.
  *   **Step 6 (Values):** Wait time is 9 days. Is the scoop worth 9 days?
  *   **Result:** **ESCALATE TO EDITOR.**
  *   **Why:** This is a strategic business decision, not a reporting one. The procedure flags that the information *has* value (unlike Case A), but the cost is time, not just hours. The editor must weigh the traffic value of the scoop against the accuracy risk of the draft.

  #### Case (c): The Pet Project (3 Weeks, One More Call)
  *   **Context:** You love the story, dying to call lead author again.
  *   **Step 1 (Decision):** File vs. Call author.
  *   **Step 2 (Flip):** Author provides new data clarifying the mechanism.
  *   **Step 3 (Independence):** Lead author. **Low Independence.** They want the story to run. They will not give you data that kills the narrative.
  *   **Step 4 (Scoop):** Low (you've spent 3 weeks).
  *   **Step 5 (Hedge):** You want to call to "tighten up" the narrative. This is usually **Immaterial Hedge** (polishing verbs) or **Confirmation Bias** (getting a quote that sounds definitive).
  *   **Result:** **FILE NOW.**
  *   **Why:** This is the hardest one. The procedure identifies this as an emotional need, not an informational one. The lead author has already provided their data. A second call without new data constraints is "vibes." If you haven't found the flaw in 3 weeks, the author won't give it to you in a 10-minute call.

  ---

  ### What This Procedure Can't Do (The Honest Assessment)

  You asked if this is just expected-value bookkeeping with a reporting-shaped paint job. **Yes, it is.** And that is its strength and its limitation.

  **1. It cannot quantify "Truth."**
  Good's Theorem assumes a coherent utility function. Journalism does not have a single utility function. You are balancing Truth, Traffic, Timeliness, and Liability. This procedure forces you to isolate *which* utility you are optimizing for in the moment. It cannot tell you if Traffic is more important than Truth; that is why Step 6 exists (The Values Handoff).

  **2. It cannot solve the "Hedge Sink" paradox theoretically.**
  You worried that if verb changes count as actions, the theorem stops biting. This procedure solves that pragmatically, not theoretically. It defines a **Material Hedge Threshold**. It admits that "shows" $\to$ "suggests" *is* valuable, but asks: *Did the data require that hedge already?* In Case (a), the n=23 required the hedge regardless of the call. Therefore, the call added no value. The procedure catches the *redundancy* of the hedge, not the hedge itself.

  **3. It cannot stop you from lying to yourself in Step 2.**
  The weak point is the "Flip Condition." A reporter under pressure will write down a Flip Condition they know won't happen, just to justify the call. ("If they admit to fraud..." when you know they won't).
  *   **Mitigation:** Show Step 2 to your editor. If they laugh at the Flip Condition, you aren't allowed to make the call.

  **4. It misses "Serendipity."**
  Good's Theorem is about *expected* value. It ignores the black swan—the one-in-a-hundred call where the source gets drunk and confesses. This procedure will tell you *not* to make that call because the EV is negative.
  *   **Trade-off:** You must accept that following this procedure means missing some scoops that come from inefficient, irrational reporting. It optimizes for *consistent* decision-making, not *home runs*.

  ### Summary for your Editor
  If your editor asks why you are using this:
  *"It stops us from paying time-costs for information that doesn't change the story's liability or the reader's action. It distinguishes between reporting that reduces risk and reporting that reduces anxiety."*

  That is a sentence an editor will sign off on.
