answer: |-
  Here is a draft for your toast. It is written to run approximately three minutes at a moderate speaking pace (around 450 words). It embeds the philosophical argument in language that feels like wedding wisdom to the family, but signals the specific decision-theoretic rebuttal to your friends.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of calling [Groom/Partner] my best friend.

  Standing up here, I wanted to say something true about what we're celebrating today. We often talk about vows as promises of future happiness. But if we're being honest, the hard part of a vow isn't the happiness. It's the binding.

  I've been taking a class on decision theory recently, and I've been guilty of overthinking things. I kept asking myself: How can you rationally promise your future self to do something difficult, when that future self might not want to do it? It seems like a trap. You're asking a future version of you, who is tired or hurt or frustrated, to carry a weight for a reason that might not feel heavy enough in the moment.

  If a vow were just a contract, that would be a problem. A contract assumes you're the same person forever, just trying to avoid penalties.

  But watching [Partner A] and [Partner B] together, I realized a vow isn't a contract. It's a blueprint.

  The mistake in my thinking was assuming that the promise is meant to bind a static person. But love doesn't work that way. When you make a vow, you aren't just restricting your future; you are actively building the person who will keep it.

  The vow doesn't say, "I promise to stay even when I have no reason to." The vow says, "I promise to become the kind of person for whom *you* are the reason."

  The commitment changes the math. It transforms the future moment of difficulty from a calculation of costs into a matter of identity. You keep the promise not because you are forced to, but because breaking it would mean betraying the person you have chosen to become.

  I see this already in the way you two navigate the world. [Partner A], the way you listen when [Partner B] is struggling isn't just kindness; it's consistency. [Partner B], the way you show up isn't just obligation; it's character. You are already building the selves who can keep these promises.

  So, my wish for you is not that you never face the hard days. My wish is that on those days, you look at each other and remember that this promise didn't just bind you together—it built you for each other.

  To [Partner A] and [Partner B]. May your promises always be the reason you keep them.

  ***

  ### Notes on Delivery

  *   **For the Family:** The section on "decision theory" is framed as "overthinking," which allows the family to laugh *with* you rather than feel excluded. They will hear "building the person" as romantic sentiment.
  *   **For the Philosopher Friend:** The phrase *"The commitment changes the math... transforms the future moment... into a matter of identity"* is the specific rebuttal to Kavka (often associated with David Gauthier's "constrained maximization" or constitutive commitment arguments). Your friend will recognize that you have rejected the premise that reasons are exogenous to the commitment.
  *   **Tone:** Keep the middle section (the "philosophy" part) grounded and warm. Don't speed up. Let the line *"You are the reason"* land before moving to the specific praise of the couple.
