      *   80-90: Debrief/Vocab.
      *   *Cut:* If 20 mins behind, skip Module 3 activity. Instructor demonstrates the matrix on projector, explains the result. Focus on Debrief.

  11. **Epistemic Limitation:**
      *   IESDS assumes Common Belief in Rationality (CBR). The activity shows the *set* resulting from CBR, but students don't *feel* the infinite regress of "I know that you know that I know..."
      *   Also, in 3+ player games, IESDS allows beliefs where opponents' strategies are correlated. NE requires independence. This activity is 2-player, so this specific distinction is moot, but I should mention it as a limitation of the *concept* if they move to 3-player.
      *   Wait, the prompt asks: "frank statement of which feature of the idea the activity cannot reproduce... epistemic content... implicitly assuming about whether my beliefs about two different opponents are allowed to be correlated."
      *   Since I am using 2-player games for simplicity, the correlation issue doesn't arise in the *activity*. I must state that the activity *hides* this assumption because it's 2-player. In 3-player, IESDS survivors can be larger than NE support partly due to correlation allowed in beliefs.
      *   Actually, I should probably mention that the activity treats "Rationality" as a calculation rule, not a mental state.

  12. **Review against constraints:**
      *   No money? (Bonus/chocolate only). Scoring will be "points" for chocolate.
      *   No software? (Paper/Projector).
      *   Vocabulary last 15 mins? (Yes).
      *   Order independence check? (Yes).
      *   Weak dominance paragraph? (Yes).

  13. **Final Polish:** Check the arithmetic one last time.
      *   Game 1: R1(4,0), R2(0,4), R3(1,1). Mix(0.5, 0.5) -> (2,2). 2>1, 2>1. OK.
      *   Game 2: R1(6,0,0), R2(0,6,0), R3(2,2,-1). Mix(0.5, 0.5) -> (3,3,0). 3>2, 3>2, 0>-1. OK.
          *   C1(6,0,5), C2(0,6,5), C3(0,0,6).
          *   After R3 gone: C1(6,0), C2(0,6), C3(0,0).
          *   Mix C1/C2 (0.5, 0.5) -> (3,3). 3>0, 3>0. OK.
      *   Game 3: R1(3,0,1), R2(0,3,1), R3(1,1,2). C1(3,0,1), C2(0,3,1), C3(1,1,0).
          *   NE: 0.5 R1/R2, 0.5 C1/C2. Payoff 1.5.
          *   R3 vs NE_Col: 0.5(1) + 0.5(1) = 1. 1 < 1.5. Not Best Response.
          *   R3 Dom? vs C3: R3=2, Mix(R1,R2)=1. Not dominated.
          *   OK.

      *   *Wait, one nuance on Game 3:* "An action that survives... and receives zero probability in *every* Nash Equilibrium."
      *   In my Game 3, there are Pure NEs: (R1, C1) and (R2, C2).
      *   In (R1, C1), R3 prob = 0. In (R2, C2), R3 prob = 0. In Mixed, R3 prob = 0.
      *   So yes, R3 is in *no* NE support.
      *   Does R3 survive IESDS?
      *   Is R3 dominated? No (best against C3).
      *   Is C3 dominated? No (best against R3).
      *   So {R1, R2, R3} and {C1, C2, C3} all survive.
      *   This works perfectly.

      *   *Scoring:* "Points" towards a class bonus (e.g., if average score > X, everyone gets 1% bonus). This avoids individual money but keeps stakes.

      *   *Debrief:* Map "Envelope" to "Mixed Strategy". Map "Elimination Rounds" to "Iterated". Map "Survivors vs NE" to "Rationality bounds".

      *   *Predictable Errors:*
          *   "Mix must be 50/50." (Force them to find *any* p).
          *   "Average payoff." (Force check against *each* column).
          *   "Order matters." (Debug math).
          *   "Survivors = Prediction." (Correct with Game 3).

      *   *Limitations:* Epistemic depth (CBR). Correlation (in 3+ player contexts, though we use 2-player here).

      *   *Weak Dominance Paragraph:* Keep it ready.

      *   *Timeline:* Be strict.

      *   *Wait, one check on Game 2 Iteration:*
          *   "Deleting one of my own actions removes a possible ingredient from my dominators and makes further deletion harder."
          *   In Game 2: R3 is deleted first. R3 was *not* an ingredient for dominating C3 (C3 was dominated by C1/C2 mix).
          *   I need an example where deleting a Row makes a Column dominated, but deleting a Column *first* would have prevented a Row from being dominated?
          *   No, order independence says this shouldn't happen for Strict Dominance.
          *   The prompt says: "The nuance I want them to feel is that the two kinds of deletion push in opposite directions... If you are right [about order independence]... tell me how to convert the near-miss into the lesson."
          *   Okay, so I acknowledge the tension (deleting own = harder, deleting opp = easier), but confirm order independence. The "near-miss" is a math error.
          *   I will structure the activity so half the class tries to eliminate Rows first, half Cols first. They should meet in the middle. If they don't, they find the error.

      *   *Wait, does deleting own actions make it harder?*
          *   Yes, because you have fewer strategies to mix together to dominate the remaining ones.
          *   Does deleting opponent actions make it easier?
          *   Yes, because you have fewer columns to check the inequality against.
          *   These forces balance out exactly in Strict Dominance.
