  # Session Plan: Dominance, Iteration, and Equilibrium

  **Course:** 2nd-Year Game Theory (Econ & Phil)
  **Students:** 24 (12 pairs)
  **Time:** 90 Minutes
  **Materials:** Projector, 12 envelopes, 240 colored tokens (120 Red, 120 Blue), printed payoff matrices (1 per pair), worksheets for calculations.
  **Incentive:** "Class Bonus." If the median group score across the three tasks exceeds a threshold, everyone gets 1% added to their final term grade (or chocolate).

  ---

  ## Part 1: The Mixture Mechanic (25 Minutes)
  **Goal:** Construct a mixed strategy that strictly dominates a pure strategy, verified against *every* opponent action.

  **The Game (Matrix A):**
  Row Player (You) vs. Column Player (Opponent).
  *   **Rows:** $R_1, R_2, R_3$
  *   **Cols:** $C_L, C_R$
  *   **Payoffs (Row):**
      *   $R_1$: (4, 0)
      *   $R_2$: (0, 4)
      *   $R_3$: (1, 1)

  **Activity:**
  1.  **Pure Check (5 mins):** Ask pairs: "Can $R_1$ eliminate $R_3$? Can $R_2$ eliminate $R_3$?"
      *   *Verification:* $R_1$ fails against $C_R$ ($0 < 1$). $R_2$ fails against $C_L$ ($0 < 1$).
  2.  **Construction (10 mins):** Distribute envelopes and tokens (Red = $R_1$, Blue = $R_2$).
      *   **Rule:** "Create a randomization device. Put at least one Red and one Blue token in the envelope. This defines probability $p = \frac{\#Red}{\#Total}$."
      *   **Task:** Find a mix that yields a payoff strictly greater than 1 against $C_L$ **AND** strictly greater than 1 against $C_R$.
      *   **Verification Sheet:** They must write down:
          *   $p = \_\_\_$
          *   Expected Payoff vs $C_L$: $p(4) + (1-p)(0) > 1$
          *   Expected Payoff vs $C_R$: $p(0) + (1-p)(4) > 1$
  3.  **Validation (10 mins):** Groups raise hands when they have a valid $p$. Instructor checks the inequalities.
      *   *Solution:* Any $p \in (0.25, 0.75)$. E.g., 50/50 gives (2, 2). $2>1$ and $2>1$.
      *   *Outcome:* $R_3$ is eliminated.

  **Scoring:** 1 point for successful elimination.

  ---

  ## Part 2: Iteration and Order (30 Minutes)
  **Goal:** Experience Iterated Elimination. Feel the tension between losing "ingredients" (own actions) vs. losing "contingencies" (opponent actions). Verify order independence.

  **The Game (Matrix B):**
  *   **Rows:** $R_1, R_2, R_3$
  *   **Cols:** $C_1, C_2, C_3$
  *   **Payoffs (Row, Col):**
      *   $R_1$: (6, 6), (0, 0), (0, 5)
      *   $R_2$: (0, 0), (6, 6), (0, 5)
      *   $R_3$: (2, 5), (2, 5), (-1, 6)

  **Activity:**
  1.  **Split Instructions (5 mins):**
      *   **Group Alpha (6 pairs):** Eliminate **Rows** first. Once no more Rows can go, eliminate **Cols**.
      *   **Group Beta (6 pairs):** Eliminate **Cols** first. Once no more Cols can go, eliminate **Rows**.
  2.  **Execution (15 mins):** Students use tokens/envelopes if needed for mixed dominators.
      *   *Path Alpha:*
          1.  $R_3$ dominated by $0.5 R_1 + 0.5 R_2$?
              *   Vs $C_1$: $3 > 2$. Vs $C_2$: $3 > 2$. Vs $C_3$: $0 > -1$. **Yes.** Eliminate $R_3$.
          2.  Now consider Cols (against $R_1, R_2$ only).
          3.  $C_3$ dominated by $0.5 C_1 + 0.5 C_2$?
              *   Vs $R_1$: $3 > 0$. Vs $R_2$: $3 > 0$. **Yes.** Eliminate $C_3$.
          4.  Remaining: $\{R_1, R_2\}, \{C_1, C_2\}$.
      *   *Path Beta:*
          1.  Can any Col be eliminated first?
              *   $C_3$ vs Mix($C_1, C_2$): Vs $R_3$, $C_3$ gives 6, Mix gives 5. **No.**
              *   Students will find they cannot eliminate any Column initially.
              *   *Correction:* They must realize they are stuck and switch to Rows. (This highlights that "Cols First" is impossible at step 1).
              *   *Wait, for order independence to hold, if Cols can't move, they must eliminate Rows.*
              *   So Beta eliminates $R_3$ first (same as Alpha). Then $C_3$.
              *   *Result:* Both end at $\{R_1, R_2\}, \{C_1, C_2\}$.
  3.  **Comparison (10 mins):**
      *   Ask: "Did Alpha and Beta end with different sets?"
      *   **Fact:** For *Strict* Dominance, the surviving set is **unique**. Order does not matter.
      *   **Troubleshooting:** If a group claims different results, they have an arithmetic error. Circulate and debug.
      *   **Discussion:** "Deleting your own action removes ingredients (harder). Deleting opponent's action removes contingencies (easier). In strict dominance, these forces balance perfectly."

  **Scoring:** 2 points for correct surviving set. -1 point for claiming order dependence (without math error).

  ---

  ## Part 3: Survivors vs. Equilibrium (20 Minutes)
  **Goal:** Show IESDS is an upper bound on rationality, not a solution concept.

  **The Game (Matrix C):**
  *   **Rows:** $R_1, R_2, R_3$
  *   **Cols:** $C_1, C_2, C_3$
  *   **Payoffs (Row, Col):**
      *   $R_1$: (3, 3), (0, 0), (1, 1)
      *   $R_2$: (0, 0), (3, 3), (1, 1)
      *   $R_3$: (1, 1), (1, 1), (2, 0)

  **Activity:**
  1.  **IESDS Check (5 mins):** "Eliminate all strictly dominated strategies."
      *   $R_3$ vs Mix($R_1, R_2$): Vs $C_3$, $R_3=2$, Mix=1. **Not Dominated.**
      *   $C_3$ vs Mix($C_1, C_2$): Vs $R_3$, $C_3=0$, Mix=1. **Not Dominated.**
      *   **Result:** All strategies survive.
  2.  **NE Calculation (10 mins):** "Find the Nash Equilibria."
      *   Pure NE: $(R_1, C_1)$ and $(R_2, C_2)$.
      *   Mixed NE: $p=0.5$ on $R_1/R_2$, $q=0.5$ on $C_1/C_2$. Expected Payoff = 1.5.
      *   **Check $R_3$:** Against NE Mix of Cols ($0.5 C_1, 0.5 C_2$), $R_3$ yields $0.5(1) + 0.5(1) = 1$.
      *   $1 < 1.5$. $R_3$ is **not** a best response to the equilibrium mix.
      *   **Conclusion:** $R_3$ survives IESDS but is played with probability 0 in *every* Nash Equilibrium.
  3.  **Synthesis (5 mins):** "IESDS tells you what rational players *might* do. NE tells you what they *will* do if they coordinate on stable beliefs."

  **Scoring:** 2 points for identifying $R_3$ as the "survivor but not played" action.

  ---

  ## Debrief & Vocabulary (15 Minutes)
  *Do not lecture. Map their experience to terms.*

  1.  **Point to Matrix A:** "When you put tokens in the envelope, you built a **Mixed Strategy**. When you checked it against $C_L$ and $C_R$ separately, you verified **Strict Dominance by a Mixed Strategy**."
  2.  **Point to Matrix B:** "When you deleted $R_3$ then $C_3$, you performed **Iterated Elimination of Strictly Dominated Strategies (IESDS)**. The fact that Alpha and Beta met in the middle proves **Order Independence**."
  3.  **Point to Matrix C:** "$R_3$ survived IESDS but wasn't in the **Nash Equilibrium support**. This shows IESDS is a **necessary condition** for rationality, but not sufficient for equilibrium."
  4.  **Weak Dominance Note:** "If we used *weak* dominance ( $\ge$ instead of $>$ ), order *would* matter. You could eliminate a strategy that was needed to dominate another. That is why we insist on *strict* dominance for this procedure."

  ---

  ## Predictable Failures & Corrections

  1.  **"Average Payoff" Error:** Students will calculate the mix's payoff against the *average* column.
      *   *Correction:* "Does your mix beat $C_L$? Does it beat $C_R$? Check them individually. Rationality requires you be safe against *any* choice the opponent makes."
  2.  **"Order Matters" Discovery:** A group finds different survivors based on elimination order.
      *   *Correction:* "In strict dominance, the destination is unique. Retrace your arithmetic. You likely found a dominance relation that wasn't strict."
  3.  **"Survivors = Prediction":** Students assume because $R_3$ survived Matrix C, it will be played.
      *   *Correction:* "Surviving means 'not irrational'. It does not mean 'optimal given what the other player actually does'."
  4.  **"Nobody Randomizes":** Philosophy students may object that players don't carry envelopes.
      *   *Correction:* "The envelope isn't a psychological claim. It's a mathematical tool to verify that a weighted average of payoffs exists that beats the target."

  ---

  ## Limitations: What This Activity Cannot Reproduce

  **1. The Epistemic Regress:**
  The activity shows the *result* of Iterated Elimination, but it cannot simulate the *reasoning*. IESDS relies on **Common Belief in Rationality** (I know you are rational, you know I know, I know you know I know...). In the room, students are just calculating inequalities. You must state aloud: "This procedure assumes that you believe your opponent is rational, and that they believe you are rational, forever. Without that shared belief, you cannot justify the second or third round of elimination."

  **2. Correlated Beliefs (The 3-Player Gap):**
  We used 2-player games. In 3-player games, IESDS allows you to hold **correlated beliefs** about the other two opponents (e.g., "If P2 plays Left, P3 plays Up"). Nash Equilibrium requires beliefs to be **independent** (product measures).
  *   *Why it matters:* A strategy might survive IESDS in a 3-player game because it beats a correlated belief, but be excluded from NE because that correlation isn't allowed.
  *   *What to say:* "Because we played in pairs, your beliefs about the opponent were just probabilities. In larger groups, rationality allows you to suspect opponents might coordinate against you. Equilibrium does not. That is why IESDS is a looser bound in games with more than two players."

  ---

  ## Contingency: 20 Minutes Behind
  **Cut Module 3 Activity.**
  1.  Project Matrix C.
  2.  State: "Here, nothing is dominated. All strategies survive IESDS."
  3.  State: "However, the only Nash Equilibria are on the top-left 2x2."
  4.  Proceed immediately to Debrief.
  5.  *Loss:* Students lose the active discovery that survivors $\neq$ NE support.
  6.  *Gain:* Ensures Module 1 and 2 (the core mechanics) are fully digested.
