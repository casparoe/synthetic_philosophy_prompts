answer: |-
  This is one of the richest puzzles in the philosophy of art, and you have pinpointed exactly where the economics of art diverge from the aesthetics of art. You are describing the moment an object shifts ontological categories.

  There isn't one single English word that captures the entire lifecycle you described, but there is a specific vocabulary used by aestheticians, economists, and dealers to describe these two distinct value shifts.

  Here is the breakdown of the mechanics, the terminology, and the manuscript bonus.

  ### 1. The Crash: Why the Exposed Forgery Dies
  You asked what goes wrong with the object itself. To the eye, nothing. To the history, everything.

  In philosophy (specifically Nelson Goodman's *Languages of Art*), paintings are classified as **autographic**. This means the history of the object's production is constitutive of the work itself. A painting is not just an arrangement of pigments; it is a record of a specific performance by a specific agent at a specific time.

  When your forger paints the picture, he creates a physical object. When he signs the master's name and sells it, he is making a claim about the *history* of that object.
  *   **The Honest Copy:** Claims to be a copy. Its history is transparent. It is valued as a craft object + the skill of the copyist.
  *   **The Forgery (Pre-Exposure):** Claims to be an Original. It is valued as a historical document of the Master's genius.
  *   **The Forgery (Post-Exposure):** The claim is retracted.

  **The Terminology:**
  Dealers and auction houses often refer to this as **"Burned"** or **"Tainted Provenance."** But for the specific phenomenon where the value drops below that of an honest copy, the most precise term is **"The Authenticity Deficit."**

  However, the philosophical mechanism you are looking for is **"The Loss of Constitutive History."**
  An honest copy is a lie that tells the truth ("I am a copy"). A forgery is a truth that tells a lie ("I am an original"). Once exposed, the object is not just a copy; it is *evidence of a fraud*. It carries a **Stigma of Deception**.

  Why is it worth less than the honest copy? Because the honest copy is a functional aesthetic object. The exposed forgery is a *broken contract*. It is an object that failed its primary function (which, in the high art market, is not to look good, but to certify lineage). Collectors of "School of" paintings want a piece of the Master's orbit. Collectors of exposed forgeries own a piece of a criminal investigation.

  **For your novel:**
  If your dealer needs a term for the value hitting zero, have him call it **"Going Cold."**
  *   *"The attribution held, but once the lab report came back, the canvas went cold."*
  *   This implies the life (the lineage) has left the object, even if the paint is wet.

  ### 2. The Bounce: Why It Becomes Valuable Again
  You noted that the exposed forgery sometimes sells for more than the forger's own signed work. This is because the object has shifted categories again. It is no longer "Art by the Master" (Category A), nor is it "Art by the Forger" (Category B).

  It has become **"Artifact of the Scandal"** (Category C).

  **The Terminology:**
  In art history and economics, this is often called **"The Van Meegeren Effect"** (named after Han van Meegeren, who forged Vermeers). His forgeries are now more valuable than his own original paintings because they possess **Historical Notoriety.**

  The premium attached to this is the **"Infamy Premium"** or **"Provenance of Scandal."**
  You are no longer buying the aesthetic experience; you are buying a relic. You are buying the specific physical object that caused a heart attack in a boardroom, that made headlines, that humiliated an expert.

  **Why it beats the Forger's Signed Work:**
  *   **Forger's Signed Work:** "A painting by [Forger]." This is Category B. It is judged on [Forger]'s merit as an artist. Usually, forgers are talented technicians but lack "vision," so these sell for modest sums.
  *   **Exposed Forgery:** "The Painting That Fooled the World." This is a unique historical event. There is only one object that holds this specific story.

  **For your novel:**
  Your dealer shouldn't call this a "discount." He should call it **"Relic Status."**
  *   *"It's not a fake anymore, kid. Fakes are trash. This is a relic. It's the gun that killed the reputation. That carries a premium."*

  ### 3. The Philosophical Core: What Went Wrong?
  You asked: *What is supposed to have gone wrong with the object itself?*

  If nobody finds out, **nothing is wrong with the object.** This is the terrifying conclusion of Arthur Danto's "Artworld" theory. The value is not in the canvas; it is in the *atmosphere of theory* surrounding the canvas.

  If the forgery remains undiscovered, the object is functionally identical to the original in every aesthetic regard. The "wrongness" is entirely **Epistemic** (related to knowledge), not **Ontological** (related to being).
  *   **Undiscovered:** The object is an "Original" because the Artworld accepts it as such.
  *   **Discovered:** The object becomes a "Forged Copy."

  The "loss that disclosure can't repair" is the **Loss of Witness.**
  When you buy a genuine 1920s painting, you are buying a witness to the 1920s. You are buying an object that the Master touched. When you buy the forgery, you are buying an object the Forger touched *pretending* to be the Master.
  The "crash" is the realization that the object is not a witness to the era it depicts, but a witness to the era it was *made*.
  *   *Example:* A forgery of a 1920s painting made in the 1990s tells you nothing about the 1920s. It tells you about the 1990s. It is historically useless as a primary source. That is the "Authenticity Deficit."

  ### 4. The Bonus: Manuscripts
  This is where it gets tricky, and it depends on the type of forgery.

  Philosophers distinguish between **Autographic Arts** (Painting, Sculpture) and **Allographic Arts** (Literature, Music).
  *   **Painting:** The work is the specific physical object. There is no "Hamlet" without a script, but there is a specific "Mona Lisa."
  *   **Literature:** The work is the text. The physical manuscript is secondary.

  **Scenario A: The Facsimile (Copying an existing text)**
  If your forger hand-writes *The Great Gatsby* on old paper and claims it is Fitzgerald's lost manuscript:
  *   **Value:** This behaves exactly like the painting. The value is in the *physical document* (autographic aspect of the manuscript).
  *   **Exposure:** The text is still *Gatsby* (allographic), but the *document* is worthless as a historical artifact. It suffers the same "Authenticity Deficit."

  **Scenario B: The New Work (Writing a new text in the style)**
  If your forger writes a *new* novel and claims Hemingway wrote it:
  *   **Value:** Here, the text itself is the art.
  *   **Exposure:** This is more complex than painting. If the book is published and loved, then exposed as a forgery, the *text* often survives better than a painting would.
  *   **Why?** Because literature is allographic. We read the words, not the ink. If the book is good, it enters the corpus as "Attributed to Hemingway" or "By [Forger]."
  *   **The Crash:** It loses the "Hemingway" premium, but it doesn't necessarily go to zero if the writing is good. A forged painting is a lie about an object. A forged manuscript is a lie about a text. If the text stands on its own, it retains value.
  *   **The Exception:** If the value was purely scholarly (e.g., a "newly discovered poem" that changes our understanding of the author's life), exposure destroys it completely. It becomes historically false data.

  **For your novel:**
  If you want to show your dealer is a true expert, have him distinguish between the two.
  *   *"Canvas is autographic, kid. The history is in the weave. Words are allographic. The history is in the meaning. You can forge a signature on a poem, and the poem might still sing. You forge a signature on a canvas, and the paint goes silent."*

  ### Summary of Terms for Your Dialogue

  1.  **The Crash:**
      *   *Dealer Slang:* "It went cold," "Burned," "Dead in the water."
      *   *Formal:* "Authenticity Deficit," "Provenance Collapse."
      *   *Concept:* The object is no longer a witness to the Master's time, but a witness to the Forger's deception.

  2.  **The Bounce:**
      *   *Dealer Slang:* "It's a relic," "Notoriety play," "The Van Meegeren."
      *   *Formal:* "Infamy Premium," "Scandal Value."
      *   *Concept:* The object is no longer Art; it is History.

  3.  **The Honest Copy vs. The Forgery:**
      *   The honest copy is a **Homage**.
      *   The forgery is a **Fraud**.
      *   The difference is not the paint; it is the **Intent of Attribution**.

  The "loss that disclosure can't repair" is the **Integrity of Origin.** Once the origin is known to be falsified, the object can never again be a window into the past; it is permanently a mirror reflecting the deception.
