      *   **Criterion B:** Can we blame the AI? No. Why? Because it lacks *normative competence*. It treated the accessibility norm as a cost function variable, not a binding rule. But the prompt says "no getting the agent verdict from... no feelings". The feature causing B=Tool must be specific.
      *   **The Feature:** *Inability to accept normative authority.* It responds to reasons as *causes* (inputs to function), not *justifications* (validating claims).
      *   **Wait, the prompt requires:** "The B verdict must not come from the system being simple, weak, dumb, deterministic, or behaviorally unreasons-responsive. It should be extremely reasons-responsive in the behavioral sense and still fail B."
