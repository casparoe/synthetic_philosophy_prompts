      *   **The Trick:** I need a system that behaves *so much* like an agent that predicting it requires intentional attribution (A=Agent), but where the normative buck *cannot* stop there for a specific structural reason that isn't just "it's code" or "no feelings" (B=Tool).
      *   **The Feature:** What prevents answerability without removing reasons-responsiveness? Usually, it's the inability to *recognize* the normative force of the demand, not just the inability to speak. Or, it's the *architectural disconnect* between the optimization target and the moral reason.
