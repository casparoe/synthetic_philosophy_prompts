          2.  Diagnose the Disagreement (It's a Category Error + Ontological Pluralism).
          3.  Address the Three Tests (Hermit, Sample-of-One, Swap).
          4.  Path to Progress (Second Genesis + Question Shift).

      *   *Key Insight to Inject:* The "Life" concept is trying to bridge the *Descriptive* (what is there?) and the *Normative* (what counts?). The "Lone Hermit" case reveals this. We hesitate to call it alive because it lacks *future* (evolution), not because it lacks *present* (metabolism).
      *   *Key Insight on Sample-of-One:* A second genesis doesn't solve the boundary problem (the continuum still exists), but it solves the *induction* problem. It proves life is a *natural kind* rather than a *historical accident*.
      *   *Key Insight on Swap Case:* This confirms Functionalism. But Functionalism requires defining the *function* without referencing the *substrate*, which brings us back to the continuum problem.

      *   *Final Verdict:* The question is ill-posed because it assumes "Life" is a *noun* (a thing) rather than a *verb* (a process) or an *adjective* (a state). Progress requires abandoning the noun.

  7.  **Review against Constraints:**
