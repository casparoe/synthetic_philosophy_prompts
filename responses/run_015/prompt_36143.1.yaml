      *   *Historical Precedent:* General Relativity wasn't in the "suspect pool" of Newtonian physicists.
      *   *Nature of "Truth":* In a mystery, the culprit *exists* and is *human*. In physics, the "true theory" might not be unique, or might not be conceptualizable by humans yet.
      *   *Elimination Process:* In a mystery, you can physically verify alibis. In theory space, "failure to construct" $\neq$ "impossible to construct."

  4.  **Sort Disanalogies (Damaging vs. Harmless):**
