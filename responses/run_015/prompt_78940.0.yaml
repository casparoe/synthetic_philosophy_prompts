answer: |-
  **INTERNAL MEMORANDUM: DECISION-MAKING PROTOCOLS (FAQ)**
  **TO:** All Personnel
  **FROM:** Department of Aggregation
  **SUBJECT:** Voting Procedures and Competence Assurance

  **1. Why are all decisions, including procurement and breakroom amenities, subject to majority vote?**
  Per the Collective Accuracy Mandate, the organization operates on the principle that a majority vote among independent voters yields a higher probability of correctness than any individual decision-maker. This applies to strategic pivots, vendor selection, and thermostat settings. The probability of a correct majority decision increases as the number of voters increases, provided individual competence exceeds chance.

  **2. How is individual competence verified?**
  All employees must pass the Baseline Proficiency Assessment (BPA) upon hiring and quarterly thereafter. The BPA is written, administered, and graded by the Department of Aggregation. A passing score confirms a probability of correctness ($p$) greater than 0.5 regarding organizational matters. Failure to maintain this threshold results in reassignment to non-voting roles, such as data entry or solitary maintenance.

  **3. Why are we prohibited from discussing agenda items before voting?**
  To satisfy the independence condition. Correlation between voters reduces the effective sample size. Therefore, all briefing materials are distributed via sealed digital packets immediately prior to voting. Employees must vote in soundproof booths. Discussing a question before the poll closes is a terminable offense. You must arrive at your conclusion using only the provided information and your own certified competence.

  **4. Why is the company continuously hiring, even during contraction?**
  Headcount is directly correlated with decision certainty. Under the Mandate, adding a voter with $p > 0.5$ increases the likelihood of a correct majority. Consequently, recruitment targets are set by mathematical necessity rather than workload. If you are unsure whether a new hire is needed, put the question to a vote.

  **5. Do we vote on questions where the correct answer is unknown?**
  Yes. The theorem assumes a binary correct/incorrect state exists even if unidentified. Employees are required to vote on all binary propositions presented by the Office of Agenda Setting. Abstention is recorded as a competence failure.

  **6. What happens if the average voter competence falls below 0.5?**
  Policy 6.4 acknowledges that if individual probability of correctness ($p$) is less than 0.5, the probability of the majority reaching the correct decision converges to 0 as the number of voters ($n$) approaches infinity. In such events, the majority becomes reliably wrong. Staff should note that expanding the workforce under these conditions guarantees incorrect outcomes with near certainty. Hiring will continue regardless, as reducing $n$ violates the Mandate's structural requirements.

  **7. How are contradictory majority preferences resolved?**
  In instances where Option A beats Option B, Option B beats Option C, and Option C beats Option A (cyclic preferences), the outcome is determined by the sequence of voting. The Office of Agenda Setting retains sole authority to determine the order in which pairwise comparisons are presented. This sequencing is finalized 24 hours before voting begins and is not subject to vote.

  **8. Are there known statistical risks?**
  A memo from Internal Statistics (Ref: 89-B) notes: *"Variance in individual competence is unmeasured. If the BPA does not accurately reflect real-world p-values, the convergence model fails. Additionally, agenda sequencing creates a single point of failure in the logical chain. However, compliance remains mandatory."*

  **9. What should I do if I believe the majority is wrong?**
  You must vote according to your best judgment. If the majority decides incorrectly, the theorem suggests you were likely the outlier. Continue to attend briefings. Do not attempt to persuade colleagues. Your isolation is necessary for the integrity of the sum.

  **10. Will my vote matter?**
  Individually, no. Collectively, your vote is a variable in a function that approaches certainty. As the workforce grows, the probability of the organization being correct approaches 1, unless it approaches 0. Please proceed to your booth. The next vote begins in three minutes.
