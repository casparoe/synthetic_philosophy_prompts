prompt: |-
  Write a short internal FAQ — the kind of procedural document a company circulates to new employees, in numbered question-and-answer form, deadpan throughout, roughly 700 words — for an organization that has replaced all of its ordinary decision-making with majority votes, on the authority of the Condorcet jury theorem. The comedy has to come from the theorem's actual conditions rather than from generic jokes about committees: the piece should be funny to someone who teaches the result and still legible to someone who has never heard of it, and it must never announce, summarize, or wink at the objections it is enacting. Let the organization keep the theorem's assumptions in the letter of its policies and betray them in their spirit — an onboarding process that guarantees every voter receives the same information and attends the same briefing; a competence requirement satisfied by an examination the organization writes and grades itself; a standing commitment to keep hiring voters, since more voters means more certainty; a ban on discussing a question before voting, justified by the need for independence; a practice of putting every question to the whole staff, including questions on which the staff is no better informed than a coin. At least once the arithmetic should be allowed to show: the FAQ should state, in the flat voice of policy, what becomes of a majority's accuracy when the voters are worse than chance and the body grows. The organization should also have run into the fact that its majorities can cycle — it prefers the first option to the second, the second to the third, and the third to the first — and should treat the resulting dependence on which questions are put in what order as a matter for the office that sets the agenda, without ever remarking that this is where the power now sits. A short, quoted dissenting memo from an in-house statistician may be included, provided it stays inside the corporate register. End on a line that a reader could take as either reassuring or appalling, and do not explain which.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Internal FAQ for a company that uses majority voting for *all* decisions based on the Condorcet Jury Theorem (CJT).
      *   **Tone:** Deadpan, procedural, corporate onboarding style. No winking, no summarizing objections, no explicit acknowledgment of the absurdity.
      *   **Length:** Roughly 700 words.
      *   **Format:** Numbered question-and-answer.
      *   **Key Comedy Source:** The specific conditions of the Condorcet Jury Theorem (independence, competence > 0.5, binary choices, large N) vs. how the company implements them (bureaucratically, rigidly, often violating the spirit while keeping the letter).
      *   **Specific Requirements:**
          *   Onboarding ensures identical information/briefing.
          *   Competence requirement via self-graded exam.
          *   Commitment to hiring more voters (N increases certainty).
          *   Ban on discussion (independence).
          *   Voting on everything (even where competence <= 0.5).
          *   Explicit arithmetic: What happens if voters are worse than chance (p < 0.5) and N grows.
          *   Address Condorcet Paradox (cycling majorities) by assigning agenda-setting power without acknowledging the power shift.
          *   Optional: Short quoted dissenting memo from statistician (must stay in corporate register).
          *   Ending: Ambiguous line (reassuring or appalling).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Premise:* If each voter has an independent probability $p > 0.5$ of being correct, the probability that the majority decision is correct approaches 1 as $n \to \infty$.
      *   *Caveat 1:* If $p < 0.5$, the probability of majority correctness approaches 0 as $n \to \infty$ (inverse wisdom of crowds).
      *   *Caveat 2:* Independence is crucial (no herd mentality).
      *   *Caveat 3:* Binary choices (usually).
      *   *Caveat 4:* Condorcet Paradox (intransitive preferences) when aggregating rankings over multiple options.

  3.  **Drafting - Section by Section:**

      *   *Header:* Standard corporate memo style.
      *   *Q1: Why do we vote?* Establish the CJT basis without naming it explicitly as a theory, but as policy.
      *   *Q2: Competence.* How do we ensure $p > 0.5$? The self-graded exam.
      *   *Q3: Independence.* The ban on discussion.
      *   *Q4: Hiring.* Increasing $n$.
      *   *Q5: Scope.* Voting on everything (even where $p$ is unknown).
      *   *Q6: The Arithmetic.* The $p < 0.5$ scenario. This needs to be stark.
      *   *Q7: Cycling/Agenda.* The Condorcet Paradox handling.
      *   *Q8: Statistician Memo.* Optional but requested as "may be included". I'll include it to add texture.
      *   *Ending:* The ambiguous line.

  4.  **Drafting - Content & Tone Check:**
      *   *Tone:* Dry, HR-manual-esque. "Per policy," "Compliance," "Directive."
      *   *Comedy:* The horror lies in the rigidity. "We do not discuss" = isolation. "We hire more" = bloat for math's sake. "If you are wrong, more of you makes it worse" = stated calmly.
      *   *Word Count:* Need to monitor. 700 words is tight but manageable for an FAQ.

  5.  **Drafting - Step-by-Step:**

      *   *Title:* Internal Procedural FAQ: Decision-Making Protocols.
      *   *Q1:* Why voting? Reference the "Collective Accuracy Mandate."
      *   *Q2:* Competence. The "Baseline Proficiency Assessment." It's written by us, graded by us.
      *   *Q3:* Discussion. "Information Siloing." Necessary for independence.
      *   *Q4:* Hiring. "Headcount Expansion."
      *   *Q5:* Scope. "Universal Suffrage." Even for lunch? Yes.
      *   *Q6:* The Math. If $p < 0.5$, accuracy drops to zero. State this plainly.
      *   *Q7:* Cycling. "Agenda Sequencing." The Office of Order decides the order.
      *   *Memo:* Insert a brief note from Statistics regarding variance.
      *   *Closing:* "You are now part of the calculation."

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I explain the theorem? No. Did I wink? No.
      *   *Check:* Is the arithmetic clear? "As N increases, probability of correct majority converges to 0."
      *   *Check:* The cycling issue. Make sure it sounds like a logistical tweak, not a power grab.
      *   *Check:* Word count. I need to expand on the procedural details to hit ~700 without fluff. I need to elaborate on the "Independence" and "Competence" sections to ensure the irony lands.
      *   *Check:* The ending. Needs to be punchy.

  7.  **Final Review against constraints:**
      *   Deadpan? Yes.
      *   Numbered Q&A? Yes.
      *   ~700 words? (Will aim for tight paragraphs).
      *   CJT conditions met/violated? Yes (Independence via silence, Competence via self-exam, N via hiring, p<0.5 acknowledged).
      *   Cycling addressed? Yes.
      *   Statistician memo? Yes.
      *   Ambiguous ending? Yes.

  8.  **Writing the text.** (Focusing on the voice: bureaucratic, immutable, slightly unsettling).

      *   *Drafting thought:* Make sure the statistician's memo doesn't break the fourth wall. It should sound like a compliance warning.
      *   *Drafting thought:* The "p < 0.5" section needs to be the coldest part.
      *   *Drafting thought:* The agenda setting needs to sound mundane. "Sequence Optimization."

      *(Self-Correction on Word Count)*: I need to ensure I don't run too short. I will expand the answers to include specific procedural steps (e.g., " Booths," "Headphones," "Exam Version 4.2").

