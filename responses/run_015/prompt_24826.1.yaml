          *   Mechanism: Add noise to aggregates, track privacy budget (epsilon).
          *   Goal: Prevent inference about any single user from the output, regardless of outside knowledge.
          *   Implicit Theory: Privacy as *indistinguishability* or *risk mitigation*. It's about the mathematical guarantee that the output doesn't change significantly whether you are in the dataset or not. It treats privacy as a property of the *process* or the *output*, not the data itself. It's group-focused or population-focused protection against inference.
      *   **Layer 2: Individual Rights (GDPR-style).**
          *   Mechanism: Access, deletion, objection, minimization, purpose limitation.
          *   Goal: Give control to the data subject over their specific data records.
          *   Implicit Theory: Privacy as *control* or *ownership*. It assumes data is "theirs" and they have rights over specific instances of it. It treats privacy as a property of the *relationship* between the individual and the data holder. It's individual-focused protection against misuse.

