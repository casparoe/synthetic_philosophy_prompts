  1. **Bottom Line**
  The measurement philosopher's charge of circularity regarding the invariance filter threatens Step Four's constitutive claim most severely. The chapter survives only if I frame the filter as a pragmatic convention for public justification rather than a discovery of true utility.

  2. **The Circularity of Constitutive Rules**
  (a) Philosopher of Economics: "If admissibility conditions are constitutive of utility, you cannot use utility to justify the conditions. You've defined away the measurement error rather than solving it, rendering the claim tautological."
  (b) Reply: I concede the definition is stipulative, but deny it is tautological. The stipulation is justified externally by the goal of public justification (Step One), not internal consistency. We choose the filter because it yields agent-neutral evidence, not because it finds 'true' preferences. The content is exhausted by the procedure, but the procedure is selected for its political epistemology, not its metaphysical accuracy. This moves the burden from truth to legitimacy. If the filter were about truth, you would be right; since it is about public settlement, the stipulation is valid.
  (c) Soft spot: They will ask what constrains the selection of the filter if not accuracy.

  3. **The Policy Vacuum**
  (a) Welfare Economists: "If choices moving under perturbation are discarded, most real-world data fails the filter. What valuation do we use on Monday? You leave us with an empty set for most regulatory decisions."
  (b) Reply: The theory does not require perfect stability, only specified resolution. We use the best-fitting model parameters from the surviving data, acknowledging wider confidence intervals. Where no data survives, we default to structured deliberation rather than false precision. It changes the output from a point estimate to a bound, which is honest accounting. You can regulate with bounds; you cannot regulate with lies. This protects the agency from liability when preferences are genuinely indeterminate.
  (c) Soft spot: They will press for a specific algorithm to convert bounds into decisions.

  4. **Arbitrariness of the Filter**
  (a) Behavioral Economist: "Your 'invariance filter' looks like cherry-picking. Why these perturbations and not others? You're defining stability by excluding the contexts where we know construction happens."
  (b) Reply: The family of perturbations is not chosen to find stability but to test robustness across salient contextual variations. It is an empirical question which perturbations matter, not a theoretical one. We include standard framing and default effects because those are the noise sources public justification must neutralize, not because they are the only ones. The filter evolves as we learn more about context dependence. We are not claiming this is the final list, only the current standard for public evidence.
  (c) Soft spot: They will demand empirical proof that this specific filter correlates with welfare outcomes.

  5. **Exclusion via Instability**
  (a) Law Professor: "If utility is what survives the filter, whose choices are discarded? If cognitive load causes instability, you systematically exclude the poor from counting. Who gets counted?"
  (b) Reply: This is a feature of public justification, not a bug of measurement. If a preference cannot be articulated consistently under cost, it cannot ground public coercion. We must address the cognitive load, not pretend inconsistent choices count as valid veto power over policy. Exclusion is temporary until capacity is restored, not permanent disenfranchisement. We owe them capacity building, not fake valuations.
  (c) Soft spot: They will argue this conflates capacity with validity.

  6. **Strategic Concessions**
  Concede to the Welfare Economists that current regulatory practice cannot implement this fully yet; admit the transition costs. Refuse to concede to the Law Professor on exclusion. Holding the line there is worth more than winning it because admitting inconsistent choices as valid evidence undermines the entire claim that utility must be contestable by public evidence (Step One).

  7. **The Unanswerable Question**
  The question I hope nobody asks is whether the invariance filter itself imposes a specific rationality norm that biases outcomes toward market-like behavior. I have no good answer because the filter is designed to ensure public checkability, which inherently favors discrete, costly choices over holistic or expressive values that resist such formatting.
