answer: |-
  ### The Design: A Transactional Authority Account

  I am employing a **Transactional Authority Account** of standing, a subset of relational theories (akin to those proposed by Stephen Darwall or R.A. Duff). On this view, the right to blame is not a general moral license earned through virtue, but a specific normative power generated by one's position within the relationship violated. Standing derives from being the **proper claimant** of the duty breached.

  This suits your novel because it mirrors the legalistic, fiduciary world of chartered surveyors. In a partnership, the right to enforce rules belongs to the partners whose interests are harmed, regardless of their personal virtue. Conversely, one waives the right to complain if one has authorised the breach.

  ### The Scene

  The church hall smelled of damp wool and stale sherry. Outside, the close was grey, the cathedral tower invisible in the mist. Marcus stood by the radiator, nursing a plastic cup. Arthur approached, adjusting his cufflinks. He was senior partner now; the firm was his name on the door.

  "You took the client ledger, Marcus," Arthur said. His voice was low, devoid of tremor. "You used the firm's trust to fill your own pockets at Henderson's. That is theft."

  Marcus looked at the floor. "I had to start somewhere. You know how it is."

  "I do," Arthur said. He glanced at his phone, a message lighting up the screen from a private number regarding a separate venture of his own, then pocketed it. "But you did not ask. You breached the partnership deed. You owe the firm restitution."

  Eleanor swept in, holding a plate of sandwiches. She was Marcus's aunt, the widow of the founder. She had never signed a deed, never measured a plot, never billed an hour. Her hands were clean of the profession's sins.

  "Stop it, Arthur," she said, sharp as a tack. "Don't speak to him like a criminal. Not after what he's done."

  Marcus looked up, hopeful.

  Eleanor turned to Marcus, her eyes hard. "I told you to go to Henderson's. I told you to take what you needed to secure your future. My boy is ready to step up here; we needed you out. But to do it this way? After I paved the road? It's cowardly."

  Marcus stared at her. "You knew?"

  "I arranged the meeting," she said. "I just didn't expect you to be so clumsy about it. You've made us all look bad."

  Arthur sighed, looking at Marcus with cold, proprietary disappointment. "You've damaged the business."

  "You've damaged the family," Eleanor corrected.

  Marcus set his cup down. The heat from the radiator was suffocating.

  ### Analysis and Checks

  **1. Verdicts under the Transactional Authority Account**
  *   **Arthur (The Hypocrite):** He has **standing**. Although he is morally corrupt (having poached clients himself and currently doing so again), he is a senior partner and co-owner of the client book. Marcus's act breached a duty owed *specifically to Arthur*. Arthur is the victim of the transaction. His right to blame stems from his proprietary interest and fiduciary role, not his moral record.
  *   **Eleanor (The Scrupulous Woman):** She lacks **standing**. Although she has never breached the professional norm (she is not a surveyor), she **authorised and induced** the specific wrong. By telling Marcus to "take what he needed" to clear space for her son, she waived her right to object to the method. She is an accomplice, not a victim.

  **2. Ablation Test**
  *   **Arthur:** If we strip him of his ownership status (e.g., he had already sold his share), his blame becomes mere gossip. Without the proprietary relationship, his hypocrisy would indeed negate his standing. The feature doing the work is **Victimhood/Ownership**.
  *   **Eleanor:** If we strip her of the inducement (e.g., she knew nothing of his plan), her standing is restored. As a family matriarch concerned with reputation, she would have the relational authority to chastise him. The feature doing the work is **Authorisation/Waiver**.
  *   **Comparison:** These are two sides of the same coin: **Normative Position relative to the Act**. Arthur stands *outside* the act as the violated party; Eleanor stands *inside* the act as a co-author. It is not about their moral records, but their placement in the transaction.

  **3. The Appraisal Theorist Objection**
  A theorist who holds that blame is simply an appraisal of wrongdoing (e.g., George Sher) would argue that standing is irrelevant; if Marcus did wrong, anyone who recognises this may blame him. They would say Eleanor is free to blame Marcus, even if she encouraged him. They would view her comment as merely inconsistent, not normatively barred.
  *   **Embarrassment:** The scene is an **embarrassment** to this theorist. It demonstrates that blame is not just a judgment of fact, but a social performance requiring authority. Eleanor's blame feels intuitively wrongful—not because she is wrong about the facts, but because she has no *right* to speak. The theorist cannot account for the specific sting of her complicity without importing relational concepts they reject.

  **4. Novelist's Constraint**
  The reader should end up disliking **Arthur** more. While Eleanor is manipulative, Arthur's cold assertion of rights while actively committing the same sin creates a deeper sense of injustice; he weaponises the rules he breaks, whereas Eleanor merely admits her machinations.

  ### Closing Sentence
  The reader should end up disliking Arthur more, for he demands a justice he actively denies others, whereas Eleanor at least owns her complicity.
