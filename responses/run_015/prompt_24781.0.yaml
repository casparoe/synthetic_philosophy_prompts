      *   The "Vent vs. Insulin" paradox is a classic bioethics problem. The intuitive difference usually lies in *burden/benefit ratio*, *underlying pathology*, and *duty of care*.
      *   The "Pond vs. Kidney" distinction highlights *Special Duty* vs. *General Duty*.
      *   The "Morphine" case is the textbook definition of Double Effect.

  3.  **Drafting the Principles:**
