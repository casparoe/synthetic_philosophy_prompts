      *   *Principle 1: The Distinction between Causation and Allowance (Underlying Pathology).* Does the intervention stop the disease, or does the intervention *become* the cause of death?
      *   *Principle 2: Proportionality and Burden (Ordinary vs. Extraordinary Means).* Is the treatment burdensome relative to the benefit?
