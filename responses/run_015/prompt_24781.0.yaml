      *   *Better distinction:* **Futility and Burden.** The vent is futile (not coming round). The insulin is effective (diabetic can live).
      *   *Another angle:* **Dependency.** The vent patient is dependent on technology to override a fatal event. The diabetic is dependent on a hormone to manage a chronic condition.
      *   *Best Bioethical Explanation:* **The distinction between stopping a treatment that is no longer beneficial (Vent) vs. withholding a treatment that is standard care and beneficial (Insulin).**

