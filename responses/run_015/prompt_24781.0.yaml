      *   *Vent (Mum):* Underlying pathology is fatal. Vent is artificial support. Withdrawing allows pathology to take course. Burden > Benefit (futile). -> *Permissible.*
      *   *Insulin:* Underlying pathology is manageable. Insulin is routine maintenance. Withholding introduces a new fatal cause (hyperglycemia/DKA) that wouldn't otherwise kill *now*. -> *Impermissible.*
      *   *Morphine (Pain):* Intent is pain relief. Death is side effect. -> *Permissible (DDE).*
      *   *Morphine (Lethal):* Intent is death. Death is means. -> *Impermissible.*
      *   *Pond:* General duty + low burden. -> *Impermissible to ignore.*
      *   *Kidney:* High burden + no special duty. -> *Permissible to ignore.*
      *   *Sponge:* Negligence within special duty. -> *Impermissible.*

  5.  **Addressing the "Vent vs. Insulin" Paradox specifically:**
      *   Why do they feel different?
      *   *Vent:* The machine is holding back death. Removing it returns the patient to their natural state (dying).
      *   *Insulin:* The body is functioning enough to live *with* help. Withholding it creates a new metabolic crisis.
      *   *Refinement:* It's about whether the treatment is *sustaining life against a terminal process* vs. *maintaining health in a non-terminal process*. Or, more precisely: *Is the patient dying of their disease, or dying of our withdrawal?*
