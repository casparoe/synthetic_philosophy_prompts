      *   *Principle 3: The Duty/Burden Principle.* Is there a special relationship, and is the cost to the agent reasonable? (Distinguishes Pond from Kidney).
      *   *Principle 4: The Standard of Care Principle.* Is the omission a deviation from accepted medical practice? (Distinguishes Insulin from Vent).

      *Wait, let's look closer at Vent vs Insulin.*
