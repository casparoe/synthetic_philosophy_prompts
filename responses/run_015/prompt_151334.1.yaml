      *   **The Analogy:** Treating environmental forces (pathogens, climate, volcanoes) as "architects" and human societies as "laborers" building a "building" (historical outcome) based on a "design" (environmental constraints).
      *   **Goal:** Clarify how to treat non-human forces as historical actors *without* collapsing into environmental determinism.
      *   **Required Steps:**
          1.  Brainstorming phase (explicitly list entities, normative loads, teleological risks).
          2.  Explicit correspondence table (Target Domain vs. Source Domain).
          3.  Identify where mapping holds and fractures (specifically regarding teleology/intentionality).
          4.  Separate critical disanalogies (determinism worry) from cosmetic ones.
          5.  Assess if the conclusion survives the audit.
          6.  Propose a better alternative analogy/framework if needed.

  2.  **Brainstorming & Pre-computation (Mental Sandbox):**
      *   *Entities to Map:* Architect (Non-human force?), Laborers (Humans), Building (Historical Outcome/Event), Design (Environmental Constraint/Parameter), Construction Process (Historical Agency/Response).
      *   *Normative Loads:*
          *   Architect: Implies intent, vision, top-down control, credit/blame.
          *   Laborers: Implies subordination, execution, potential alienation, lack of creative input.
          *   Design: Implies optimality, pre-existence, rigidity.
          *   Building: Implies finished state, stability.
      *   *Teleological Risks:* "Design" implies a designer with a goal. Pathogens don't want to kill; volcanoes don't want to cool the earth. They just *are*. If we call them architects, do we imply history is moving toward a goal set by nature?
      *   *Determinism Risk:* If the Architect dictates the Design, do the Laborers have any choice? If the Plague *is* the Architect of the Feudal System's end, did humans have no say? The analogy risks making humans mere automatons executing nature's blueprint.
      *   *Agency:* Human agency is reactive in the analogy (laborers follow plans). In history, humans often rewrite the plans or build something entirely different despite the conditions.
      *   *Causality:* Is it efficient causation (push/pull) or formal causation (shape/form)? The analogy mixes them.

  3.  **Step 1: Explicit Correspondence Table:**
      *   *Source:* Architect, Laborers, Building, Design/Blueprint.
      *   *Target:* Pathogen/Climate/Volcano, Human Societies, Historical Outcome (e.g., end of serfdom, year without summer), Environmental Parameters (virulence, aerosol load, temperature drop).
      *   *Specifics:* *Y. pestis* = Architect? Or is the *mortality rate* the design? Humans = Laborers trying to survive. Outcome = Post-plague economy. Tambora = Architect? Aerosols = Design? Outcome = 1816 social unrest.

  4.  **Step 2: Mapping Holds vs. Fractures:**
      *   *Holds:* Constraints are real. You can't build a skyscraper on mud without pilings; you can't farm during a volcanic winter without adaptation. The "shape" of the outcome is limited by the "design."
      *   *Fractures:*
          *   *Intent:* Architects intend. Pathogens evolve via selection, not intent.
          *   *Feedback:* Laborers can strike or unionize. Humans can engineer solutions (irrigation, quarantine) that change the "design" mid-process.
          *   *Teleology:* The building is the *goal* of the architect. Is the "Year Without Summer" the *goal* of Tambora? No.
          *   *Distribution:* One architect vs. many laborers. Environmental forces are often diffuse (climate) vs. specific (virus).

  5.  **Step 3: Critical vs. Cosmetic Disanalogies:**
      *   *Cosmetic:* Architects wear hard hats; viruses don't. (Irrelevant).
      *   *Critical:* The presence of *intent* and *teleology*. If the "Architect" has no goal, the "Design" is just a set of initial conditions, not a plan. If the Design is just a constraint, the Laborers (humans) determine the structure within those constraints. The analogy fails if it suggests the *specific* outcome was planned by the non-human force.
      *   *Determinism Worry:* If the Architect determines the Building, humans are epiphenomenal. If the Environment determines History, it's determinism. The analogy *supports* determinism more than it defends against it, despite the proponents' claims.

  6.  **Step 4: Assessing the Conclusion:**
      *   Does the analogy license "actors without determinism"?
      *   *Verdict:* No. It smuggles in a hierarchy where the non-human is the "director" and human is the "executor." It grants too much causal sovereignty to the non-human. It creates a "Great Man Theory" but for Germs.
      *   *Normative Load:* The analogy carries the load of *explanation* but fails the load of *agency preservation*. It saves the phenomenon of environmental impact but sacrifices human contingency.

  7.  **Step 5: Proposing an Alternative:**
      *   *Idea 1:* Boundary Conditions (Physics). Good, but dry.
