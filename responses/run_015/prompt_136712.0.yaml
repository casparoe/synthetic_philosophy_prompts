      *   **Key Question 2:** Does it assume a robust, non-conventional arrow of time (thermodynamic irreversibility/entropy) OR is it just contingent engineering/risk pragmatism?
      *   **Key Question 3:** Is this consistent with how past emissions are treated (settled baseline, mitigated but not undone)? Does *that* presuppose a different metaphysical view?
      *   **Task:** Reconstruct the implicit theory of time, distinguish requirements vs. accommodations, and indicate what would change if replaced by time-symmetric physics + decision-theoretic risk.

