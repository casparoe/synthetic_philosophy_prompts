answer: |-
  The regulatory asymmetry between Carbon Dioxide Removal (CDR) and Solar Radiation Management (SRM) within climate governance frameworks does not merely reflect engineering constraints; it encodes a specific, albeit often implicit, **ontology of temporal directionality and causal hysteresis**. To reconstruct this implicit theory of time, we must disentangle the physical necessities of the climate system from the normative choices of governance.

  ### 1. The Ontology of Intervention: Stock vs. Flow and Thermodynamic Memory

  The distinction between CDR and SRM governance rests on a fundamental categorization of climate variables: **stocks** (atmospheric CO₂ concentration) versus **flows/forcing** (radiative balance via albedo).

  *   **CDR (Stock Modification):** Reducing the stock of CO₂ is thermodynamically expensive and slow, but stopping the process does not induce a discontinuity. If CDR ceases, the system returns to a state of accumulation. The "arrow of time" here is **diffusive**. The effects dissipate over decades because the carbon cycle operates on multi-decadal to millennial timescales. Governance treats this as *manageable risk* because the rate of change ($dT/dt$) remains within adaptive bounds even upon cessation.
  *   **SRM (Forcing Modification):** SRM masks the thermal energy already accumulated by greenhouse gases. It does not remove the heat; it reflects the incoming energy. Stopping SRM removes the mask instantly, while the heat (the stock of energy in the ocean/atmosphere system) remains. This creates a **step-function discontinuity** in temperature.

  **Philosophical Commitment:** This regulatory distinction presupposes a **causal asymmetry rooted in system memory (hysteresis)**. It assumes that the climate system is not a reversible machine but a path-dependent process. The "termination shock" protocol acknowledges that the *history* of the intervention matters. You cannot return to the *status quo ante* simply by reversing the control lever because the system has evolved (warmed) underneath the mask.

  This is not merely "contingent engineering." It is an institutionalization of the **Second Law of Thermodynamics**. The governance frameworks implicitly accept that entropy production (heat accumulation) creates a robust arrow of time. Interventions that fight entropy without removing its source (SRM) create a "debt" that must be paid upon termination. Interventions that reduce the source (CDR) align with the entropic gradient of restoration, albeit slowly.

  ### 2. Thermodynamic Irreversibility vs. Risk-Management Pragmatism

  Does this assume a "non-conventional arrow of time"? No, it assumes the **conventional thermodynamic arrow**, but it elevates it to a **normative constraint**.

  *   **Strict Requirement:** The protocols *require* an acknowledgment of **rate limits**. Biological and social systems have a maximum rate of adaptation. The "termination shock" is prohibited not because time cannot flow backward (cooling could theoretically occur), but because the *velocity* of the reversal exceeds the resilience threshold of the biosphere.
  *   **Merely Accommodated:** The frameworks accommodate **political time** (election cycles, funding periods) which is short-term, by favoring CDR which can be paused without immediate catastrophe. They accommodate the **irreversibility of political commitment** by treating SRM as a "lock-in." Once started, SRM *must* continue to avoid shock. This creates a moral hazard: future generations are held hostage to the continuation of a program they did not authorize.

  Therefore, the distinction is **pragmatism grounded in physical irreversibility**. It is not metaphysically loaded in the sense of positing a magical direction of time, but it is ontologically committed to **causal inertia**. The climate system possesses momentum. Governance treats this momentum as a moral boundary: do not initiate processes that remove future agency (the ability to stop).

  ### 3. Consistency with the Treatment of Past Emissions

  The prompt asks if this is consistent with treating past emissions as a "settled baseline." Here, a tension emerges.

  *   **Past Emissions:** Policy treats past emissions as **sunk costs**. We adapt to the warming they caused; we do not litigate to "undo" the past physically (beyond CDR which targets the concentration, not the historical act). This presupposes a **linear, irreversible history**: the past is fixed, the future is open.
  *   **SRM Protocols:** By contrast, SRM protocols treat the *future intervention* as potentially reversible but dangerously so.

  **The Inconsistency:** There is a **temporal double standard**.
  1.  **Past:** We accept the "termination shock" of the *industrial era* as a baseline. We accepted the rapid warming from fossil fuels (a de facto geoengineering experiment) as a "settled" reality to which we must adapt.
  2.  **Future:** We forbid SRM because its cessation causes rapid warming.

  **Metaphysical Loading:** This inconsistency reveals a **normative asymmetry** rather than a physical one. Treating past emissions as "settled" presupposes a **moral arrow of time** where responsibility fades. We are responsible for future risks (SRM termination) but not fully liable for past damages (historical emissions) beyond mitigation.
  If the view were consistent, the "termination shock" of historical fossil fuel use (which is effectively what happens if we don't mitigate) would be treated with the same alarm as SRM termination. The fact that it is not suggests the governance framework prioritizes **status quo bias** regarding economic systems over thermodynamic consistency. It treats the *economy's* arrow of time (growth is irreversible) as more rigid than the *climate's* arrow of time.

  ### 4. Reconstructing the Implicit Theory of Time

  The implicit theory of time embedded in these protocols is **Thermodynamic-Political Hysteresis**.

  1.  **Time is Directional:** Due to entropy and system inertia, states are not easily recoverable.
  2.  **Agency is Time-Bound:** The capacity to intervene is constrained by the rate of change the system can tolerate.
  3.  **Future Lock-in:** Certain interventions (SRM) transfer agency from the present to the future (forcing future generations to maintain the program). This is ethically prohibited under intergenerational equity principles.

  **What is Required:**
  *   Acknowledgment of physical rate limits ($dT/dt$).
  *   Prohibition of interventions that create involuntary commitments for future agents.

  **What is Accommodated:**
  *   The economic preference for cheap, fast fixes (SRM is cheaper than CDR) is accommodated by allowing research but blocking deployment.
  *   The political inability to address past liability is accommodated by treating historical warming as a baseline.

  ### 5. The Counterfactual: Time-Symmetric Physics and Decision-Theoretic Risk

  If we replaced this underlying view with a **time-symmetric physics** (hypothetically treating climate states as reversible without hysteresis) coupled with a **purely decision-theoretic account of risk** (Expected Utility Theory without precautionary thresholds), climate governance would change radically:

  1.  **Collapse of the CDR/SRM Distinction:** If physics were time-symmetric, "termination shock" would merely be a negative utility value, not a categorical barrier. SRM would be evaluated solely on its Net Present Value (NPV). If SRM saves $X$ trillion in damages today but risks $Y$ trillion in shock tomorrow, it would be deployed if $Probability \times Y < X$.
  2.  **Insurance over Prohibition:** Instead of "termination shock protocols" that aim to prevent cessation, governance would create **climate derivatives**. Nations would purchase insurance against termination. The risk is financialized rather than physically avoided.
  3.  **Loss of the Precautionary Principle:** The current framework relies on the idea that some states are *forbidden* regardless of utility (deontological constraints based on physical limits). A decision-theoretic approach is consequentialist. It would allow "gambling" with the climate if the odds favored economic growth.
  4.  **Reversibility of History:** A time-symmetric view might encourage "restorative justice" via geoengineering to return the climate to a pre-industrial baseline (e.g., 280 ppm CO₂), rather than treating past emissions as a settled baseline. Current governance accepts a "new normal"; a time-symmetric approach would view the deviation as an error to be corrected, implying the past *can* be undone.

  ### Conclusion

  The regulatory asymmetry between CDR and SRM is not merely pragmatic; it is an **institutional recognition of thermodynamic irreversibility**. It presupposes that time has a direction fixed by entropy and system inertia, making certain futures "locked in." However, the treatment of past emissions reveals a **normative fracture**: governance accepts the irreversibility of *economic history* (emissions stay in the ledger) while fearing the irreversibility of *geoengineering history* (SRM commitment).

  To shift to a time-symmetric, decision-theoretic framework would be to **financialize the climate**. It would remove the ontological weight of "termination shock," turning a physical catastrophe into a calculable risk premium. This would likely accelerate SRM deployment but at the cost of treating the biosphere as a reversible portfolio asset rather than a path-dependent physical system. The current protocols, therefore, implicitly defend a **materialist ontology of time**: the physical world imposes constraints that decision theory cannot simply calculate away.
