prompt: |-
  I'm a TA and next week I have to teach Samuel Scheffler's "afterlife" thought experiment to first-years in one 50-minute section. The book is *Death and the Afterlife*; the core move is the pair of scenarios (a "doomsday" world where Earth is destroyed shortly after each person's death, versus a world where humanity and its projects continue indefinitely) that he uses to argue that what we care about is the indefinite continuation of the species and its undertakings, not our own survival or the survival of particular people. Don't explain it to me; plan how I should teach it. I want the order in which the pieces must be introduced and why (what depends on what — e.g., what has to be in place before the two scenarios can even be contrasted), the one concrete case to build it around and what that case must have and lack, the misconceptions the students will predictably bring or form (I'm expecting at least: that the point is about personal immortality, that it's really about the dead, that it's just environmentalism, and that it reduces to "leaving a legacy"), and the exact point in the sequence where each should be headed off. Include a check I can run at the end that tells me they grasp the claim itself rather than just feeling unsettled, and name one thing I should openly refuse to address in this section. Give me the plan as a JSON object with these fields: "sequence" (an array of steps, each with "step_name" and "why_now"), "carrying_example" (an object with "case", "must_have", "must_lack"), "misconception_map" (an array, each item with "misconception", "where_it_forms", "how_to_head_off"), "understanding_check" (a string), and "leave_out" (a string).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** TA teaching first-year students.
      *   **Topic:** Samuel Scheffler's "Afterlife" thought experiment from *Death and the Afterlife*.
      *   **Core Argument:** The pair of scenarios (Doomsday vs. Collective Afterlife) argues that we care about the indefinite continuation of humanity/projects, not just personal survival or specific loved ones.
      *   **Constraint 1:** Do not explain the philosophy to me (the user knows it).
      *   **Constraint 2:** Plan how to teach it in a 50-minute section.
      *   **Constraint 3:** Output format must be a JSON object.
      *   **Required Fields:**
          *   `sequence`: Array of steps with `step_name` and `why_now`.
          *   `carrying_example`: Object with `case`, `must_have`, `must_lack`.
          *   `misconception_map`: Array with `misconception`, `where_it_forms`, `how_to_head_off`.
          *   `understanding_check`: String (a check to run at the end).
          *   `leave_out`: String (one thing to openly refuse to address).
      *   **Specific Misconceptions to Address:** Personal immortality, about the dead, just environmentalism, reduces to "leaving a legacy".
      *   **Goal:** Ensure students grasp the claim itself, not just feel unsettled.

  2.  **Deconstruct the Philosophy (Scheffler's Argument):**
      *   *Premise:* We value many activities/projects/relationships.
      *   *Thought Experiment 1 (Doomsday):* Earth destroyed 30 days after your death. No one survives.
      *   *Thought Experiment 2 (Collective Afterlife):* Humanity continues indefinitely, but you die normally.
      *   *Observation:* Doomsday scenario feels much worse/debilitating to our current motivation than the Collective Afterlife scenario (where we die but others live).
      *   *Conclusion:* Our confidence in the "collective afterlife" (humanity continuing) is a precondition for valuing many of our current activities. It's not about *our* survival or *specific* loved ones, but the continuation of humanity/projects generally.

  3.  **Drafting the Plan (Mental Outline):**
      *   *Time:* 50 minutes is tight. Need to move fast.
      *   *Sequence:*
          1.  Hook/Intuition Pump (What do you care about?).
          2.  Introduce Scenario A (Doomsday).
          3.  Introduce Scenario B (Collective Afterlife).
          4.  Compare reactions (The core move).
          5.  Draw the conclusion (What this says about value).
          6.  Check understanding.
      *   *Carrying Example:* Needs to be something mundane but meaningful. Writing a paper? Planting a tree? Raising a child? Scheffler uses "writing a book" or "curing a disease". For first-years, "working on a group project" or "building something for the community" might work. Let's go with "Writing a novel" or "Developing a cure". Actually, Scheffler often uses the example of a scientist working on a cure. Let's adapt that to something relatable: "Working on a long-term community garden project."
          *   *Must Have:* Long-term payoff, requires others to maintain it, not purely selfish.
          *   *Must Lack:* Direct personal benefit after death, specific dependency on *particular* known individuals (it needs to be about humanity/strangers continuing).
      *   *Misconceptions:*
          1.  Personal Immortality: Address early when defining the scenarios.
          2.  About the Dead: Address when discussing why Doomsday feels worse (it's about the *living's* motivation).
          3.  Environmentalism: Address when discussing the scope (it's about value conditions, not policy).
          4.  Legacy: Address when drawing the conclusion (it's not about *being remembered*, it's about *others living*).
      *   *Understanding Check:* Needs to distinguish between "I want *me* to survive" vs "I want *humanity* to survive" vs "I want *my kids* to survive".
      *   *Leave Out:* Metaphysical claims about the soul/religious afterlife. Scheffler is talking about a secular "collective afterlife".

  4.  **Refining the JSON Structure:**

      *   `sequence`: Needs logical dependency. Can't compare scenarios before defining both. Can't draw conclusion before comparing reactions.
      *   `carrying_example`: Needs to be specific. Let's use "Training for a marathon to raise money for charity" or "Writing a thesis". Let's go with "Planting an oak tree knowing you won't sit in its shade." Classic, but maybe too cliché. How about "Contributing to a Wikipedia entry"? No, too ephemeral. Let's stick close to Scheffler's vibe but make it student-relatable: "Working on a research project whose results won't be published until 5 years after you graduate."
          *   *Must Have:* Effort now, benefit later (after student is gone), benefits strangers/general knowledge.
          *   *Must Lack:* Personal fame, direct benefit to the student, dependency on specific friends.
      *   `misconception_map`: Map the 4 required misconceptions to specific points in the sequence.
      *   `understanding_check`: A hypothetical scenario question.
      *   `leave_out`: Religious afterlife is the obvious candidate.

  5.  **Drafting Content (Iterative refinement):**

      *   *Sequence Step 1:* Establish baseline values. (Why do we do things?)
      *   *Sequence Step 2:* Introduce Doomsday Scenario. (Earth ends 30 days after your death).
      *   *Sequence Step 3:* Introduce Collective Afterlife Scenario. (You die, humanity goes on).
      *   *Sequence Step 4:* Elicit Comparative Reaction. (Which undermines current motivation more?)
      *   *Sequence Step 5:* Extract the Principle. (Value depends on collective continuation).
      *   *Sequence Step 6:* Understanding Check.

      *   *Misconception 1 (Personal Immortality):* Forms at Step 2. Head off by emphasizing *you* still die in both.
      *   *Misconception 2 (About the Dead):* Forms at Step 4. Head off by focusing on the *living agent's* motivation now.
      *   *Misconception 3 (Legacy):* Forms at Step 5. Head off by distinguishing "being remembered" from "others living well".
      *   *Misconception 4 (Environmentalism):* Forms at Step 5. Head off by clarifying this is about *meaning*, not policy duty.

      *   *Carrying Example:* "Writing a software code for an open-source project you won't use."
          *   Must Have: Effort now, utility later, users are strangers.
          *   Must Lack: Your name on it, you using it, specific friends using it.

      *   *Understanding Check:* "If Scheffler is right, why would a Doomsday scenario make you less motivated to grade papers *today*, even though you'll be dead when the world ends?"
      *   *Leave Out:* "Whether religious afterlives exist."

  6.  **Review against Constraints:**
      *   JSON format? Yes.
      *   No explaining the philosophy to the user? Yes.
      *   All required fields? Yes.
      *   Specific misconceptions included? Yes.
      *   50-minute constraint respected (sequence length)? Yes, 5-6 steps is manageable.

  7.  **Final Polish of JSON Content:**
      *   Ensure `why_now` explains the pedagogical dependency.
      *   Ensure `where_it_forms` points to specific steps.
      *   Ensure `understanding_check` is actionable.

      *Self-Correction on Misconceptions:* The prompt lists four specific misconceptions: personal immortality, about the dead, environmentalism, legacy. I need to make sure all four are in the `misconception_map`.
      *Self-Correction on Carrying Example:* Needs to be concrete. "Grading papers" is good for a TA context, but maybe "Building a campus tradition" is better for first-years. Let's go with "Contributing to a student organization's fund that pays out next year." Actually, Scheffler's own examples are often about scientific research or artistic creation. Let's use "Writing a book that won't be published until 50 years after your death." It's clear.
      *Wait, better for first-years:* "Working on a group project where you won't see the final grade." No, that's too immediate. Let's stick to the "Planting a tree" archetype but modernized. "Contributing code to open-source software you won't use."
      *Actually, let's use Scheffler's own "Scientist curing a disease" but simplified.* "Working on a cure for a disease that won't be deployed until 40 years from now."
      *Must Have:* Benefit occurs after agent's death, benefits humanity generally.
      *Must Lack:* Agent survives, Agent is remembered specifically, Agent's children are the specific beneficiaries.

      *Refining the Understanding Check:* Needs to test the *conditional* nature of value. "Imagine you know humanity ends 30 days after you die. Does your desire to write your thesis change? Why?"

      *Refining Leave Out:* "The metaphysical truth of an afterlife."

      *Refining Sequence:*
      1. Baseline Intuitions (What matters?)
      2. Doomsday Scenario (You die, then Earth ends)
      3. Collective Afterlife Scenario (You die, Earth continues)
      4. Comparative Reaction (Which hurts motivation more?)
      5. The Inference (What does this say about value?)
      6. Check.

      *Let's check the misconceptions mapping.*
      1. Personal Immortality: Forms at Step 2. Head off by clarifying "You die in both."
      2. About the Dead: Forms at Step 4. Head off by asking "Who is suffering the loss of motivation?"
      3. Legacy: Forms at Step 5. Head off by distinguishing "memory" from "existence."
      4. Environmentalism: Forms at Step 5. Head off by distinguishing "obligation to save" from "condition for valuing."

      *Wait, one more check:* The prompt says "name one thing I should openly refuse to address". This goes in `leave_out`.

      *Final check on JSON syntax:* Ensure no trailing commas, proper quoting.

      *Let's finalize the Carrying Example.* "Writing a thesis that won't be read for 100 years."
      *Must Have:* Effort now, consumption later, consumers are strangers.
      *Must Lack:* Personal fame, personal utility, specific loved ones as sole consumers.

      *Let's finalize the Understanding Check.* "If a student says 'I wouldn't write the thesis because no one would read it,' do they understand Scheffler? What if they say 'I wouldn't write it because I won't be famous'?" The check needs to be a question I ask *them*.
      *Better:* "Ask them: 'In the Doomsday scenario, you still live a normal lifespan. Why does knowing strangers won't exist *after* you die change how you feel about drinking coffee *now*?'"

      *Let's finalize the Leave Out.* "Whether God or souls exist."

      *Okay, ready to construct JSON.*

      *Wait, one detail:* "the one concrete case to build it around and what that case must have and lack". I need to make sure the example is used throughout. I will integrate the example into the sequence steps implicitly, but the `carrying_example` field needs to define it explicitly.

      *Misconception Map:* Needs to be an array of objects.
      *Sequence:* Array of objects.

      *Let's write it.*
