answer: |-
  There is no single, universally standardized term in logic or epistemology that captures this exact triad of moves (claimed externality, actual entanglement, internal validation) in one word. However, the phenomenon you describe is a well-recognized structural problem in the philosophy of science, critical theory, and archival studies. It is best understood as a composite of three distinct but interlocking conceptual errors.

  The most precise "carving" of this phenomenon is **the Transcendental Reification of a Methodological Frame**, supported by **Immanent Bootstrapping**.

  Below is the detailed breakdown of this concept, how it differs from the notions you excluded, and the boundary conditions that distinguish it from legitimate methodological assumption.

  ### 1. The Conceptual Carving

  To name this precisely, we must separate the three moves your colleague (and the archive) is making, as each has a specific philosophical lineage.

  **A. The Status Claim: Transcendental Reification**
  *   **The Move:** The finding aid or conceptual framework is presented not as a tool constructed *within* history or practice, but as a "condition of possibility" (a transcendental frame) that stands outside the system it organizes.
  *   **The Error:** This is a **Category Mistake** (Ryle) regarding the *ontological status* of the frame. In Kantian terms, it treats a **Regulative Ideal** (a heuristic tool used to organize inquiry) as a **Constitutive Reality** (a truth about the world that exists prior to inquiry).
  *   **Why "Reification"?** Because it turns a process (the act of categorizing) into a thing (the metadata that "naturally" divides personal from professional). It hides the labor of construction behind a claim of neutrality.

  **B. The Justification Loop: Immanent Bootstrapping**
  *   **The Move:** The authority of the frame is defended by pointing to the coherence or utility of the content *as organized by that frame*. (e.g., "The categories are correct because the papers make sense when sorted this way.")
  *   **The Error:** This is a specific form of **Circular Reasoning** known in systems theory as **Operational Closure**. The system validates its own rules using only the outputs those rules permit. It is "bootstrapping" because it pulls itself up by its own epistemic shoelaces: the frame creates the order that is then used to justify the frame.
  *   **Distinction:** Unlike a standard *petitio principii* (begging the question) in a linear argument, this is *structural*: the premise (the frame) is insulated from the conclusion (the organized papers) by a claim of meta-level status.

  **C. The Defensive Move: Immunization**
  *   **The Move:** When challenged, the frame is declared "not an object of study but the condition of study."
  *   **The Error:** This is an **Immunization Strategy** (a term used by systems theorist Niklas Luhmann and philosopher Peter Sloterdijk). It protects the core distinction from falsification by reclassifying criticism as a "category error" on the part of the critic. It renders the frame unfalsifiable by fiat.

  ### 2. Distinctions from Excluded Concepts

  You correctly noted that this is not general self-reference, infinite regress, or the hermeneutic circle. Here is the precise differentiation:

  *   **Vs. The Hermeneutic Circle:** The hermeneutic circle acknowledges that understanding moves between part and whole, and that the interpreter's pre-understanding is *part of the process* to be refined. In your colleague's pattern, the "pre-understanding" (the frame) is **fixed and exempted** from refinement. The hermeneutic circle is a dynamic spiral of correction; this pattern is a **static enclosure**.
  *   **Vs. Infinite Regress:** An infinite regress occurs when every justification requires a further justification (A needs B, B needs C...). Your colleague's move is designed specifically to **stop the regress**. He posits a "Hinge Proposition" (Wittgenstein) or "Hard Core" (Lakatos) that does not require justification. The problem is not that the regress is infinite, but that the stoppage is **arbitrary yet disguised as necessary**.
  *   **Vs. General Self-Reference:** Self-reference is simply a system referring to itself. This pattern is **asymmetric self-reference**. The content refers to the frame (as organized by it), but the frame refuses to refer to the content (as constituted by it). It claims a "View from Nowhere" (Thomas Nagel) while standing firmly on the ground of the archive.

  ### 3. Boundary Conditions: Legitimate Assumption vs. Structural Error

  You asked for the boundary conditions that distinguish this from ordinary methodological assumptions. All research requires frameworks; not all frameworks commit this error. The distinction lies in **Contingency** and **Reflexivity**.

  | Feature | Legitimate Methodological Assumption | Transcendental Reification (The Error) |
  | :--- | :--- | :--- |
  | **Status Claim** | Acknowledged as **Contingent**: "We are using this taxonomy for now to see what emerges." | Claimed as **Necessary**: "This taxonomy reflects the natural order of the papers." |
  | **Response to Friction** | **Adaptive**: If papers don't fit, the taxonomy is revised. | **Immunized**: If papers don't fit, they are treated as anomalies or "noise." |
  | **Justification** | **Pragmatic & External**: "This tool helps us access X, but we know it shapes X." | **Circular & Internal**: "This tool is true because the resulting system is coherent." |
  | **Reflexivity** | **Permitted**: The tool itself can be archived and studied. | **Forbidden**: The tool is the transparent lens, not the object. |

  ### 4. Relevant Disciplinary Terminology

  If you need to locate this in specific literature for your curation or writing, these are the nearest established concepts:

  *   **Archival Studies:** **"Archival Violence"** or **"Epistemic Silence"** (influenced by Foucault and Derrida). In *Archive Fever*, Derrida argues that the archive does not just record memory but *produces* it. The structural move you describe is the mechanism of that production: the archivist's distinction creates the "event" it claims to catalog.
  *   **Philosophy of Science:** **"The Hard Core of a Research Programme"** (Imre Lakatos). Lakatos describes how scientists protect a central theory from falsification by adjusting auxiliary hypotheses. Your colleague has turned the "finding aid" into a Hard Core that is protected by a "negative heuristic" (the rule that says "do not test the aid").
  *   **Sociology of Knowledge:** **"The Naturalization of the Social."** This is the process by which constructed social categories (like "professional" vs. "personal") are made to appear as natural facts.
  *   **Logic/Critical Theory:** **"Cryptonormativity."** (Associated with Habermas's critique of Foucault). This describes a framework that claims to be purely descriptive or neutral (external) but relies on hidden normative judgments (internal) to function.

  ### 5. Recommendation for the Curator

  In your archival notes or finding aid, you are not required to dismantle your colleague's system, but you are ethically bound to mark its status. The precise intervention is to **reclassify the finding aid from "Metadata" to "Context."**

  *   **Current Status:** The aid is treated as *Metadata* (data about data, transparent, external).
  *   **Corrected Status:** The aid is *Context* (historical material, constructed, internal to the collection's history).

  By cataloging the finding aid itself as **Box 1, Folder 1: "Original Ordering and Conceptual Framework,"** you perform the epistemic correction. You acknowledge the framework as part of the *provenance* rather than the *transcendental condition*. This allows future researchers to study the papers *through* the frame without being trapped *inside* it.

  ### Summary
  The pattern is **Transcendental Reification**: the treatment of a contingent, methodological heuristic as a necessary, ontological condition, defended by **Immanent Bootstrapping** (internal success) and protected by **Immunization** (exemption from scrutiny). It differs from the hermeneutic circle by refusing reflexivity, and from infinite regress by arbitrarily halting inquiry at the frame. The boundary condition is **acknowledged contingency**: a framework is legitimate so long as it admits it is a tool, not a truth.
