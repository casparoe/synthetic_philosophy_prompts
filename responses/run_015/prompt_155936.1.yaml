answer: |-
  look its simple, right? you look at every emerald ever mined up until right now. theyre all green. so you say inductivly, all emeralds are green. future ones will be green. makes sense. thats projectible. thats safe.

  but goodman says wait. define a new predicate. call it *grue*. an object is grue if its observed before time *t* and is green, or observed after *t* and is blue. lets say *t* is next tuesday.

  every emerald weve seen so far fits *both* definitions. theyre green. and theyre grue, because we saw them before tuesday. the evidence is identical. the logical support is identical. so why do we bet money the next one wont be blue? because green is entrenched. because language says so. not because logic says so.

  now look at this manuscript. *slams glass*

  every chapter weve read so far is Romance. boys meet, boys fight, boys kiss. all green. so we say inductivly, the book is a Romance. the ending will be a wedding.

  but define *grue-romance*. a manuscript is grue-romance if its observed before publication date and reads as Romance, or observed after publication date and reads as Dystopian.

  every chapter weve edited fits *both*. theyre Romance. and theyre grue-romance, because we read them before the pub date. the evidence is identical. the logical support is identical.

  so why do you assume the ending stays a wedding? youre assuming genre is a stable predicate like green. but genres are modal properties, dave. they only project forward in narrative time relative to the observer. the moment this thing hits the shelves, *t* passes. the predicate flips.

  we isnt editing a Romance. we editing a grue-romance. logically, once it crosses the threshold of publication, the third act *has* to turn dystopian. not because the words change. because the time index changed. the emerald turns blue. the kiss becomes a ration coupon.

  you laugh but thats why the author keeps rewriting the climax. he knows the induction breaks. he knows after *t* the green dont hold. pass the whiskey.
