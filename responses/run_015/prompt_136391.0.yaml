answer: |-
  Wittgenstein's approach validates your instinct that checklists fail, but it demands you accept that the procedure will sometimes reject objects you instinctively value because conceptual classification ends where cultural judgement begins.

  **The Procedure: A Web of Resemblance**

  1.  **Identify the Language-Game:** Ask what specific human activity this object supported (e.g., mourning, daily ritual, celebration). If no active role in a life-form is evident, stop with a **No**.
  2.  **Map the Resemblances:** List three features (material, narrative, or functional) and compare them against five objects already accepted into the public collection. The object must share at least two distinct features with existing items.
  3.  **Test the Chain:** Can you trace an unbroken line of overlapping similarities from this object to a core exemplar (such as a diary or portrait) without a logical gap?
      *   **Stop Rule:** If the chain breaks at Step 3, the object is conceptually outside the category; record a **No**.
      *   **Value Flag:** If the chain holds but the object feels trivial, or if the chain breaks but the object feels historically vital, stop the procedure immediately. This is the exact point where conceptual classification ends and cultural value judgement takes over; the procedure cannot settle this.

  **Application to Donations**

  1.  **Factory-made sympathy card with handwritten note:**
      *   *Language-Game:* Mourning and condolence.
      *   *Resemblance:* Shares materiality (paper) and function (communication) with existing letters; shares handwriting with existing diaries.
      *   *Chain:* Unbroken link to core exemplars of personal correspondence.
      *   *Verdict:* **Yes**. (Procedure holds).

  2.  **Chipped teacup used every morning for forty years:**
      *   *Language-Game:* Daily ritual and sustenance.
      *   *Resemblance:* Shares materiality (ceramic) with existing kitchenware; shares wear patterns with existing tools.
      *   *Chain:* Broken. The existing collection relies on a resemblance to *named* personal narratives; this object lacks a specific identity link to the deceased or owner found in the 'family' of accepted items.
      *   *Verdict:* **No** (by procedure).
      *   *Note:* Your team will likely dislike this answer. The procedure classifies it out because it lacks the narrative thread binding the rest of the family, forcing you to override the result using cultural value judgement (the Value Flag) if you wish to keep it.

  3.  **Digital photo frame loaded with images of strangers:**
      *   *Language-Game:* Display, but the 'memory' function is vicarious rather than lived.
      *   *Resemblance:* Shares technology with existing digital archives; shares visual nature with photographs.
      *   *Chain:* Broken at Step 1. The 'memory object' language-game requires a connection to the donor's own past or a specific deceased relation; owning images of strangers constitutes a different game (collecting or aesthetics) rather than mourning or self-memory.
      *   *Verdict:* **No**. (Procedure holds).

  **Limitations**

  This procedure cannot settle the relative importance of anonymous social history versus specific personal narrative. When the family resemblance chain breaks, as with the teacup, Wittgenstein's method offers no further guidance; you are standing on bedrock where your spade is turned, and you must argue from value, not logic.
