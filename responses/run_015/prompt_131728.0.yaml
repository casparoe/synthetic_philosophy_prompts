answer: |-
  The central thesis I propose is that the essence of joint action lies not in the convergence of mental content regarding the outcome, but in the convergence of normative structure regarding the process. Genuine collective intentionality is constituted by a specific architecture of practical reasoning: a relation of mutual practical authority. On this view, agents act jointly when each treats the actions of the others as generating binding constraints on their own deliberation, irrespective of whether they conceptualize the ultimate telos of those actions in the same way. Representational divergence regarding the final product does not dissolve the jointness of the action, provided the normative interdependence of the immediate practical reasoning remains intact.

  To establish this, we must first distinguish between merely acting alongside one another and acting together. In cases of merely acting alongside, coordination is purely causal or strategic. I move my body in a way that accommodates your movement because I predict you will move thus, and I desire to avoid collision. My reasoning remains solipsistic; your action enters my practical syllogism only as a factual premise about the state of the world, akin to a weather event or a physical obstacle. There is no normative uptake. I do not feel *bound* by your action; I am merely *caused* to adjust by it.

  In contrast, acting together requires that your action enters my practical reasoning not merely as a fact, but as a reason. This is the core of mutual practical authority. When I grant you practical authority, I commit to treating your contribution as a premise that excludes certain options from my own deliberation. If you lay a brick, I do not lay another brick on top of it, not because I physically cannot, but because I recognize your action as having settled the matter of where the next layer begins. This normative constraint holds even if I believe we are building a fortress and you believe we are building a temple. The jointness is located in the reciprocal recognition of authority over the shared space of action, not in the shared visualization of the finished structure.

  This framework allows us to accommodate radical representational divergence. In complex distributed projects, the "goal" is often not a fixed object but a horizon that shifts as the work proceeds. If joint action required a shared representation of this horizon, collaboration would fracture whenever interpretations diverged. However, if joint action is grounded in mutual practical authority, the agents are united by their commitment to the *constraints* generated by the collaboration, not the *description* of the outcome. I am committed to integrating my code with yours because I recognize your commit as authoritative for the state of the repository, not because I necessarily share your vision of what the software is ultimately for. The "we" is constituted by the web of obligations we weave through our interactions, not by a shared picture in our minds.

  Consider the objection derived from the interlocking intention model (associated with Bratman). This objection holds that without shared content, there is no interdependence, only parallel individual action. The claim is that if I intend X and you intend Y, and X and Y are incommensurable, our intentions cannot mesh; therefore, we are not acting together.

  This objection conflates the *content* of the intention with the *structure* of the commitment. Interdependence does not require that we intend the same state of affairs; it requires that our intentions are conditionally dependent on one another's execution. In the model of mutual practical authority, this dependence is normative. My intention is structured as: "I will do my part, *provided* you do yours, and I treat your doing your part as binding on my subsequent steps." This conditional structure creates a tight interlock even if the "part" I am doing is conceptualized by me as "securing the perimeter" and by you as "adorning the gate." As long as the physical action of securing/adorning is the same, and as long as I normatively rely on you to complete it such that my own agency is constrained by yours, the interdependence is real. The lack of representational convergence does not break the interlock; it merely means the interlock sustains a plurality of descriptions. The unity of action is found in the unity of the *constraint*, not the unity of the *concept*.

  Now consider the objection derived from the plural subject model (associated with Gilbert). This view argues that joint commitment necessarily presupposes a unified subject with a single shared mental content. To act together is to form a "we" that intends as one. If our mental contents are incompatible, there is no single "we," only a collection of "I"s.

  This objection mistakes the locus of unity. The unity of the plural subject is not a psychological fusion of minds but a normative fusion of wills. To be a plural subject is to be bound together by obligation. When I grant you mutual practical authority, I am effectively saying, "Your will counts as a reason for my action." When you do the same, we create a normative loop. This loop constitutes the "we." The content of what we will can remain distributed and even contradictory at the level of representation, provided the *act of willing together*—the mutual subjection to normative constraints—is shared. We share the commitment to the *bond*, even if we disagree on the *object* of the bond. Indeed, in many collaborative contexts, the agreement to disagree on the ultimate interpretation is itself the basis of the joint commitment. We are jointly committed to the *process* of collaboration, which serves as the container for our divergent goals. The plural subject is defined by its normative architecture, not its cognitive homogeneity.

  Furthermore, insisting on representational convergence as a condition for joint action sets the bar too high for complex agency. In any extended collaborative project, individual understandings of the goal inevitably drift. If joint action ceased every time a collaborator's internal representation of the goal diverged from the group average, large-scale cooperation would be impossible. The model of mutual practical authority explains how collaboration persists through this drift. It persists because the normative ties—the obligations to respond to, integrate, and build upon the contributions of others—remain intact. The "jointness" is resilient because it is structural, not semantic.

  Finally, we must address why representational divergence does not undermine the coherence of the action. One might argue that if we are building incompatible things, our actions will eventually conflict. This is true, but conflict within a joint action does not prove the absence of joint action; it proves the presence of tension within the joint agency. As long as the agents continue to treat each other's moves as normatively binding—even if they are trying to steer the project toward their own interpretation of the goal—they are still acting jointly. They are fighting *within* the collaboration, not outside it. The moment they stop treating the other's contributions as binding constraints and revert to treating them as mere obstacles or causal facts, *then* the joint action dissolves.

  Therefore, the condition for collective intentionality is not that we see the same future, but that we bind ourselves to each other's present. By grounding joint action in the structure of practical reasoning—specifically, the reciprocal recognition of practical authority—we can account for the reality of distributed collaboration where minds do not merge, but actions do. The "we" is not a shared image in the mind; it is a shared structure of obligation in the will.
