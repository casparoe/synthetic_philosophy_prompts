      *(Final Polish)*: Ensure the tone is argumentative but collegial, suitable for a philosophy seminar context.

      *(One more thought)*: The prompt asks to "Ground your argument in the structure of practical reasoning." I need to use terms like "premise," "practical syllogism," "exclusionary reason," etc.

