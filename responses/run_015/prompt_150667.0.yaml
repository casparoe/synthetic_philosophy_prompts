answer: |-
  # Seminar Prep Sheet: Ulysses & Precommitment

  **Strategy:** You are walking into a trap where "precommitment" equals "anti-democratic" for half the room and "interest group capture" for the other half. Your only way out is to pivot from *binding* to *channeling*. Do not defend entrenchment as stopping the majority; defend it as forcing the majority to prove it isn't hallucinating.

  **The Claim to Concede Up Front:**
  Drop the strict version of Claim (i) ("self-contained... without permission from any body it didn't elect"). If you insist the release procedure is purely mechanical, the Med Ethics person will eat you. If you admit institutions (courts/clerks) administer the procedure, the Proceduralists will call it judicial review.
  *The Move:* Concede to the Prof in your opening remarks that "The People" are not a literal single agent. Say: *"I am using the Ulysses metaphor heuristically, not ontologically. I know the electorate at T1 isn't the same agent at T2. My claim is about the legitimacy of the *channel* between them, not the identity of the traveler."*
  *Why:* This disarms the Prof. If you fight her on the metaphysics of "The People," she will spend her 20 minutes dismantling your foundation, and the Med Ethics person will use that fragmentation to argue there's no one competent to sign the directive. Give her the ontology so you can keep the normativity.

  **The Worst Objection:**
  **Objection #4 (The Med Ethics Person).** This is the kill shot. If "sobriety" must be judged, someone must judge it. If it's the courts, you've argued for judicial supremacy. If it's the legislature, it's self-judging. There is no third option. You must have an answer ready that doesn't rely on "the text decides."

  **The Prayer Question:**
  *"If the current majority is actually sober and the demand is durable, why does it matter if they have to wait two election cycles? But if they are passionate, why are you letting them decide at all?"* (This exposes the tension between your durability test and your democratic commitment).

  ---

  ### The 8 Objections (In Order of Fire)

  #### 1. The Proceduralist Attack (The "Dead Hand")
  **Who:** The 5 Democratic Proceduralists.
  **Phrasing:** "You say we should make release harder when demand is intense. But intensity is often how marginalized groups overcome structural inertia. By privileging 'durability' over 'intensity,' you're just building a status quo bias into the amendment process and calling it 'sobriety.' You're licensing the minority to veto the majority's urgent moral demands."
  **Your 2-Minute Answer:** "I'm not privileging the status quo; I'm privileging *deliberation*. Intensity is easy to manufacture; durability is hard to fake. If a demand for release is truly just, it can survive an election cycle. If it collapses because people cooled off, it wasn't a constitutional demand, it was a panic. My model doesn't stop the majority; it stops the *momentary* majority from acting like a *constituent* power. The 'dead hand' isn't the founders; it's yesterday's passion ruling today."
  **Soft Spot:** You sound elitist. You are assuming "calm" equals "just." History shows some urgent demands (civil rights) were blocked by "durability" requirements. You have no answer for why the Civil Rights Act wouldn't have failed your test in the South.

  #### 2. The Public Choice Attack (Rent-Seeking)
  **Who:** The 2 Rational Choice Students.
  **Phrasing:** "This is naive. The 'release procedure' you like—two legislatures with an election in between—isn't a sobriety test, it's a transaction cost. The founders weren't Ulysses; they were interest groups locking in rents. Your 'durability' requirement just raises the price for future interest groups to buy out the old ones. You're not describing legitimacy; you're describing a market barrier."
  **Your 2-Minute Answer:** "Even if the founders were self-interested, the *structure* of the release procedure can outlive their intent. A supermajority requirement forces coalition-building. Coalition-building forces compromise. Compromise filters out narrow interest-group demands. I'm not defending the founders' motives; I'm defending the friction that forces future majorities to build broad coalitions. Narrow interests can't sustain durability; broad public goods can."
  **Soft Spot:** They're right that transaction costs protect incumbents. You have no empirical proof that "durability" filters out rent-seeking rather than just filtering out everyone but the most well-funded lobbies.

  #### 3. The Prof's Ontology Check
  **Who:** The Professor.
  **Phrasing:** "You conceded the 'People' aren't a single agent. So whose contract is this? If T1 and T2 are different agents, T1 has no right to bind T2. You're left with power, not obligation. Why should T2 care about T1's 'mast' if T2 is a different sovereign?"
  **Your 2-Minute Answer:** "Because T2 inherits the ship. Constitutionalism isn't a contract between persons; it's a continuity of jurisdiction. T2 accepts the benefits of the stability T1 purchased. You can't take the stability without accepting the costs of the release procedure. It's not about moral obligation to the dead; it's about the practical necessity of a stable platform for action. If T2 wants to change the platform, they can, but they must rebuild the deck, not just jump off."
  **Soft Spot:** This is pragmatic, not normative. She wants a moral theory of obligation. You're giving her a theory of convenience. She will press on why "convenience" creates a *duty*.

  #### 4. The Med Ethics Trap ("Who is the Crew?")
  **Who:** The Medical Ethics Student.
  **Phrasing:** "In clinical advance directives, if a patient tries to revoke during a 'manic' phase, a doctor decides if they're competent. In your model, who decides if the majority is 'sober'? If it's the courts, you've argued for judicial review. If it's the legislature, they're judging their own competence. Who plays the crew?"
  **Your 2-Minute Answer:** "The *procedure* plays the crew. Not a person, but the timeline. I am not arguing for a substantive test of competence judged by elites. I am arguing for a procedural test of time judged by the calendar. If the demand persists through an election, the 'crew' has signaled assent. We avoid the paternalism of a doctor-judge by making the passage of time the proxy for competence."
  **Soft Spot:** This is your weakest link. Time isn't a perfect proxy for competence. A sustained delusion is possible. If she pushes "What if they're durably wrong?", you have to admit the Constitution allows suicide. That undermines the Ulysses analogy entirely.

  #### 5. The Durability Metric
  **Who:** A Proceduralist follow-up.
  **Phrasing:** "How do you measure durability without empowering a minority to block? A 10% minority can sustain a blockade for decades. Your 'durability' test might just measure the entrenchment power of the obstructionists, not the strength of the demand."
  **Your 2-Minute Answer:** "Durability isn't just time; it's repetition. Two votes with an election in between means the issue must survive a change in personnel. A minority can block one legislature, but to block two distinct legislatures after an election requires shifting public opinion, not just whipping votes. It tests the *electorate's* durability, not the legislature's."
  **Soft Spot:** Gerrymandering and safe seats mean personnel doesn't actually change much. The "election" might be a sham. You're assuming competitive elections.

  #### 6. Intensity vs. Durability
  **Who:** A Pol Sci Student.
  **Phrasing:** "Why is durability normatively superior to intensity? A small group suffering intensely (e.g., a persecuted minority) might never generate 'durable' broad support. Your model privileges broad, lukewarm consensus over urgent justice."
  **Your 2-Minute Answer:** "Constitutions aren't for ordinary policy; they're for the rules of the game. Urgent justice for specific groups is for legislation. Constitutional change rewrites the rules for everyone. That requires broad buy-in. If a demand is truly fundamental, it should be able to persuade more than just the sufferers. If it can't, it belongs in statute, not the constitution."
  **Soft Spot:** This concedes that constitutional rights for minorities are illegitimate unless they become majority preferences. That's a hard pill to swallow in a rights seminar.

  #### 7. The Hayekian "Why Release?"
  **Who:** The Hayekian Student.
  **Phrasing:** "If the rules are evolved wisdom, why let them off the mast at all? If the release procedure is too easy, you lose the benefit of the abstract order. Why not make the lock absolute?"
  **Your 2-Minute Answer:** "Because abstract rules can't predict every future contingency. Absolute locks break under pressure. A costly release valve prevents revolution. It's better to let the majority off the mast with difficulty than to let them burn the ship because they feel trapped. Flexibility preserves the system."
  **Soft Spot:** He's right that your model allows for the erosion of the very rules you want to protect. You have no bright line for when a release is "too easy."

  #### 8. The "Prayer" Question (The Closer)
  **Who:** Anyone, likely the Prof.
  **Phrasing:** "If the current majority is actually sober and the demand is durable, why does it matter if they have to wait? But if they are passionate, why are you letting them decide at all? You've either made the procedure redundant or dangerous."
  **Your 2-Minute Answer:** "It matters because the waiting *makes* them sober. It's not a filter; it's a crucible. The process of sustaining the demand changes the demand. By the time they unlock the mast, they aren't the same majority that tied it. They've deliberated. I'm not preventing them from deciding; I'm ensuring they decide as a constituent power, not a mob."
  **Soft Spot:** This is mystical. You're claiming the process magically improves the voters. If they vote the same way after two years, nothing changed but the calendar. You're relying on "deliberation" happening by osmosis.

  ---

  **Final Instruction:**
  When the Med Ethics person asks about the "Crew," do not blink. Stick to the "Procedure as Crew" line. If you admit a human arbiter is needed, you lose the room. If you admit time is imperfect, you lose the argument. You must assert that **time is the only neutral arbiter available.** It is your strongest shield, even if it leaks.
