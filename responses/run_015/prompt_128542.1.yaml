      Title: The Cost of Looking

      The ice above us was thick enough to crush the station if the thermal shields flickered, so we counted every joule like it was currency. In the deep freeze of Outpost Theta, heat was the only luxury we could not afford to waste, and yet it was the only thing we produced in abundance. Every breath, every step, every computation spat warmth into the closed loop of the habitat, and my job as the junior heat-keeper was to make sure the radiators could dump it into the ocean fast enough to keep us from cooking in our own insulation. We lived by the thermal ledger. Morning shifts were cold because the systems were idle. Evening shifts were hot because the crew was awake and working. If the ledger didn't balance, if the heat generated exceeded the heat dumped by even a fraction, the pressure alarms would scream and the ice would start to melt around the hull.

      I found the discrepancy on a Tuesday, buried in the logs for Sector Four. The ventilation unit there was running a cooling cycle that should have generated a specific thermal signature, a spike of waste heat corresponding to the work done by the compressors. But the log showed the air getting colder without the corresponding rise in the coolant temperature. It looked like entropy was reversing itself in the ductwork. I checked the sensors twice, calibrated my handheld reader, and then walked down to the valve room to find Tomas.

      Tomas was the senior engineer for life support, a man who loved the hum of machinery more than the silence of sleep. I found him crouched beside a modified air intake, tinkering with a small box wired into the shutter mechanism. He looked up when I approached, wiping grease from his hands with a rag that was already stiff with cold.

      Elara, he said, his voice bright with the kind of excitement that usually meant trouble. You saw the logs?

      I saw that the heat budget is lying, I said, holding up my tablet. You're cooling the air in Sector Four without dumping the waste heat. If this scales, we could freeze the hydroponics bay without running the chillers. If it doesn't scale, we're missing joules we can't account for.

      It scales, Tomas said, tapping the box. It's a sorting gate. Just like the old thought experiments. Fast molecules go one way, slow ones go the other. No work input, just information processing.

      I looked at the device. It was a tiny shutter controlled by a sensor that detected the speed of incoming air molecules. When a fast molecule approached, the shutter opened to let it into the warm reservoir. When a slow one came, it stayed closed. It was Maxwell's demon, built out of silicon and steel. In our world, the rules of information were different than the old Earth textbooks described. On Earth, they said erasing memory cost heat. Here, erasing was free. You could wipe a drive clean and it wouldn't warm the room by a degree. But copying information, writing a bit from the world into a memory store, that cost energy. Every time you measured something and recorded it, you paid the tax.

      Tomas thought he had found a loophole. Since erasure was free, he believed the demon could measure the particles, sort them, and then wipe its memory clean without any thermal penalty. He thought the cost had vanished.

      I crouched beside him, watching the sensor light blink. Every time it blinked, it was detecting a molecule. It was writing a bit of data to its temporary buffer to decide whether to open the shutter. I put my hand near the box. It was warm. Not hot, but warmer than the surrounding pipe.

      You're paying for the look, Tomas, I said.

      He shook his head. Erasure is free. I wipe the buffer every cycle. There's no cost to forgetting.

      The cost isn't in the forgetting. I took a breath, knowing I had to be precise. Ms. Okonjo would have marked me down for verbosity, but Tomas needed to understand the ledger. You think the debt comes when you clear the notebook, but the debt comes when you write the number down. Every time that sensor copies the speed of a molecule into its memory, it generates heat. You're sorting the gas, yes, but you're heating the room to do it. The entropy isn't disappearing. It's just moving from the air into the sensor.

      Tomas stared at the box. The blinking light seemed slower now, or maybe I was just imagining the rhythm changing. He reached out and touched the casing, feeling the warmth that I had noticed.

      So the budget balances, he said quietly.

      The budget always balances, I said. You can't get free cooling any more than you can get free heat. You just moved where the bill gets stamped.

      He sighed, the excitement draining out of his shoulders like water down a drain. He wasn't a villain, just a man who wanted the station to run easier. We all wanted that. The ice above us was heavy, and the ocean below was dark, and sometimes the math of survival felt too tight. He reached for a tool to disconnect the device.

      Wait, I said. Don't scrap it yet.

      Why? It doesn't work.

      It works as a heater, I said, looking at the thermal readout on my tablet. The sensor is generating steady waste heat during the measurement phase. If we insulate the box and route that heat into the water reclamation unit, we can recover some of the loss. It's not free cooling, but it's efficient heating.

      Tomas looked at me, then at the device, and a small smile returned to his face. It wasn't the miracle he wanted, but it was useful. In Theta, useful was enough. He began to reroute the cooling lines, turning the demon from a promise of impossible cold into a humble contributor to the warmth we needed to survive.

      I logged the change in the ledger. The anomaly disappeared from the screen, replaced by the steady, honest rise of temperature that matched the work being done. The numbers aligned. The ice outside remained solid, and the station hummed its steady song of energy in and energy out. I packed up my tablet and headed back to the control room. There were other sectors to check, other lines to balance. The physics didn't care about our hopes or our cleverness. It only cared about the count. As long as we kept counting, we would be fine.

      I walked past the library on my way back. It was the hottest room on the station, glowing with the body heat of readers copying stories into their minds, warming the dark ice outside with the friction of thought. I didn't stop to read. I had work to do. The ledger waited, and the joules would not count themselves.

