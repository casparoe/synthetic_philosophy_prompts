      *   **Context:** Graduate course on moral psychology and applied ethics. Study group debating Bernard Williams's critique of utilitarianism (integrity objection, "one thought too many").
      *   **Specific Focus:** Application to *institutional agents* (clinical triage officers, disaster-relief coordinators) who must allocate scarce resources via numerical weighing.
      *   **Task:** Describe implications for evaluating moral psychology of agents and institutional design. Address whether the objection targets only direct utilitarian motivation or supports institutional constraints shielding agents.
      *   **Constraints:**
          *   Do *not* provide a bibliography or literature survey.
          *   Work through the *conceptual structure* of the problem.
          *   Distinguish between *settled* points (agent-relative/neutral reasons, separateness of persons, direct utilitarianism target, standard rescue case interpretation) and *contested* points (integrity in rules vs. partiality, applicability to rule-utilitarianism/non-utilitarian frameworks, scope of institutional application).
          *   Do *not* present contested interpretations as consensus.
          *   Tone: Academic, precise, nuanced (suitable for grad students).

  2.  **Deconstruct Williams's Core Arguments (The "Settled" Ground):**
      *   *Integrity Objection:* Utilitarianism threatens personal integrity by making the agent a neutral channel for satisfaction, alienating them from their "ground projects" and commitments. (Jim and the Indians).
      *   *One Thought Too Many:* In rescue cases (wife vs. stranger), saving a loved one because it's *your wife* is appropriate. Saving her because "it's my wife *and* in this situation it's permissible to save my wife" adds a moralizing thought that undermines the relationship.
      *   *Separateness of Persons:* Utilitarianism treats persons as vessels of utility, ignoring the boundaries between individuals.
      *   *Target:* Primarily Act/Direct Utilitarianism (the demand to maximize utility in every act).
      *   *Agent-Relative vs. Agent-Neutral:* Williams champions agent-relative reasons (reasons tied to the specific agent's perspective/commitments) against the utilitarian demand for agent-neutrality.

  3.  **Analyze the Institutional Application (The "Contested" Ground):**
      *   *The Shift:* Moving from Jim (individual facing a unique dilemma) to a Triage Officer (individual fulfilling a role defined by aggregative rules).
      *   *The Tension:* The role *requires* aggregative thinking (save the most lives). Does Williams's critique condemn the *role* or just the *internalization* of the role?
      *   *Contested Issue 1:* Can institutions encode integrity protections without becoming arbitrary? (e.g., randomization vs. strict maximization).
      *   *Contested Issue 2:* Does the critique hit Rule-Utilitarianism or Contractualism? (If the rule says "maximize," is the agent still alienated?)
      *   *Contested Issue 3:* Scope. Did Williams mean to critique institutions or just individual morality?

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage: Williams's critique is usually taught via "Jim and the Indians" or the "Wife Rescue" case. The pivot to institutional roles changes the topology of the problem.

      *   **Section 1: The Conceptual Core (Settled Ground):**
          *   Define Integrity: Not just honesty, but identity-constituting projects.
          *   Define "One Thought Too Many": The intrusion of the moral point of view into personal relationships.
          *   Define the Target: Direct utilitarianism's demand for agent-neutrality.
          *   *Crucial distinction:* The alienation comes from the *requirement* to step outside one's own perspective to validate one's own commitments.

      *   **Section 2: Applying to Institutional Agents (The Pivot):**
          *   The Triage Officer case is different from Jim. Jim is a bystander thrust into a system. The Officer *is* the system.
          *   *Implication for Moral Psychology:* If the officer internalizes the aggregative calculus as their *personal* moral truth, Williams would say they suffer alienation. They become a "saturation point" for utility.
          *   *Implication for Institutional Design:* This is where it gets tricky. Does the institution exist to maximize good, or to allow individuals to act within constraints?

      *   **Section 3: Direct Motivation vs. Institutional Constraints (The Core Question):**
          *   Does Williams object to the *outcome* or the *deliberative path*?
          *   *Settled:* He objects to the deliberative path (the "thought").
          *   *Contested:* Can an institution mandate the outcome while forbidding the thought? (e.g., "Follow the protocol" vs. "Calculate the utility").
          *   *Shielding Agents:* One interpretation is that institutions should absorb the "dirty hands" so individuals don't have to. Another is that this just displaces the alienation.

      *   **Section 4: Contested Frontiers (Explicitly Marked):**
          *   *Integrity in Rules:* Some argue rules can protect integrity (e.g., "first come, first served" avoids weighing lives). Others say this is arbitrary partiality (why favor the early arriver?).
          *   *Framework Applicability:* Does this kill Rule-Utilitarianism? Some say R-U avoids the problem by making the *rule* the focus. Others say if the rule is utilitarian, the alienation remains for the agent following it.
          *   *Scope:* Williams was focused on individual morality. Extending to institutional design is an extrapolation. Some scholars say this is a valid extension; others say it misreads Williams's focus on the "moral luck" of the individual.

      *   **Conclusion:** Summarize the tension. The value of Williams for this context isn't necessarily a veto on triage, but a warning against *totalizing* the aggregative perspective in the agent's self-conception.

  5.  **Review and Refine (Self-Correction against Constraints):**
      *   *Check:* Did I list books? No.
      *   *Check:* Did I distinguish settled vs. contested? Yes, need to make sure the language reflects "standard interpretation" vs. "ongoing debate."
      *   *Check:* Did I address the "one thought too many" in the institutional context? Yes, this is key. For a triage officer, is the "thought" the protocol itself?
      *   *Check:* Tone. Needs to be rigorous. Avoid saying "Williams proves X." Say "Williams argues X," or "The standard reading suggests X."
      *   *Refinement on "One Thought Too Many":* In the triage case, the "thought" might be the justification *to oneself* that overrides the natural impulse to save the nearest person. Or, conversely, if they save the nearest person, do they need to justify it utilitarianly? Actually, in triage, the "thought too many" is likely the requirement to justify saving *anyone* based on a global calculus rather than immediate duty. Wait, let's refine: In the wife case, the thought is "she is my wife AND it's permissible." In the triage case, the thought is "I must save the group with higher survival probability rather than the person in front of me." Williams might say the *requirement* to adopt that frame is the violation.
      *   *Refinement on Institutional Constraints:* The prompt asks if the objection supports constraints shielding agents. This implies a "division of moral labor." I need to highlight that this is a major point of contention.

  6.  **Final Polish:** Ensure clear headings or structural markers to help the grad students follow the argument. (Decided to use thematic paragraphs with clear signposting rather than rigid headers to maintain flow, but bolding key concepts). *Correction:* Clear structural distinction is better for a complex conceptual analysis. I will use clear thematic sections.

      *   *Settled:* Agent-relative/neutral, target of direct utilitarianism, separateness of persons.
      *   *Contested:* Institutional encoding, rule-utilitarian applicability, scope of extension.

      *   *Specific focus on the "Triage" aspect:* The triage officer is *hired* to do the weighing. Does consent to the role negate the integrity objection? (Another contested point to include).

