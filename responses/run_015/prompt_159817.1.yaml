answer: |-
  # Q&A Preparation Sheet: The Reconsideration Reading of Integrity

  **Context:** Work-in-Progress Seminar (2 Hours, 20 min talk)
  **Core Claim:** Williams's integrity objection targets the *disposition to reconsider* personal commitments under impersonal pressure, not the content of deliberation. This applies to any view with deliberative primacy (including Kantianism), implying a need for *deliberative compartmentalization*.

  ---

  ## Part 1: Anticipated Objections (Ranked by Likelihood & Damage)

  ### 1. The "Disposition vs. Audit" Objection
  *   **Likelihood:** Very High | **Damage:** High
  *   **Attributed To:** The Indirect Consequentialists (Group of 4)
  *   **Vocabulary:** "Criterion of rightness," "Decision procedure," "Dispositional selection," "Two-level view."
  *   **The Objection:** "You claim sophisticated consequentialism requires the agent to remain disposed to reopen the question of their dispositions. But on a two-level view, once the optimal dispositions are selected by the criterion of rightness, they are meant to be *opaque* to the agent in daily life. The agent isn't disposed to reconsider the disposition; they are simply disposed to act. The 'audit' happens at the level of theory selection, not agent deliberation. You are conflating the theorist's job with the agent's psychology."
  *   **2-Minute Reply:** Distinguish between *having* a disposition and *endorsing* it unconditionally. Even if the agent doesn't calculate every act, sophisticated consequentialism requires them to accept that the *value* of their disposition is contingent on its outcomes. If the world changes such that their 'loyalty' disposition produces bad outcomes, the theory requires them to discard it. This contingency means the commitment is never truly 'settled' from the inside; it is held on loan from the impersonal standpoint. The 'audit' isn't constant calculation, but the standing willingness to jettison the commitment if the impersonal calculus shifts.
  *   **Soft Spot:** I haven't empirically proven that sophisticated consequentialists *must* hold this willingness consciously. It relies on a claim about what "accepting a theory" entails psychologically.

  ### 2. The "Planning Theory" Objection
  *   **Likelihood:** High | **Damage:** Very High (Threatens Novelty)
  *   **Attributed To:** The Planning Agency Theorist
  *   **Vocabulary:** "Bratmanian intentions," "Cross-temporal coherence," "Normative pressure," "Settledness."
  *   **The Objection:** "You describe 'deliberative compartmentalization' as a solution to an integrity problem. But in planning theory, this is just what an *intention* is. To intend is to treat a matter as settled to resist reconsideration and facilitate coordination. If your 'compartmentalization' is just the stability of intention, then your objection doesn't target consequentialism or Kantianism specifically; it targets *agency*. You haven't shown a moral problem; you've described the functional architecture of planning."
  *   **2-Minute Reply:** Planning theory describes the *function* of intention (how we coordinate), but my claim is *normative* (when we are *permitted* to resist reconsideration). Standard planning theory says we *should* reopen intentions when there is sufficient normative reason. My claim is that integrity requires we are sometimes permitted *not* to reopen, even when normative reasons (like impersonal value) weigh against it. I am arguing for a normative shield against reasons, not just a psychological mechanism of stability.
  *   **Soft Spot:** The line between "functional necessity" and "normative permission" is blurry. If agency *requires* stability, then it is normatively permitted. I need to sharpen the distinction between "cannot reopen" (psychological) and "need not reopen" (normative).

  ### 3. The "Demandingness in Disguise" Objection
  *   **Likelihood:** High | **Damage:** Medium
  *   **Attributed To:** The Chair (Moral Demandingness)
  *   **Vocabulary:** "Over-demandingness," "Prerogatives," "Scheffler," "Cost."
  *   **The Objection:** "This sounds like the demandingness objection rebranded. Scheffler already argued that agents need a prerogative to not maximize. You are framing this as 'integrity' and 'reconsideration,' but isn't the cash value just that morality shouldn't ask too much of us? If you solve demandingness, do you still need this specific 'reconsideration' machinery?"
  *   **2-Minute Reply:** Demandingness is about the *extent* of sacrifice (how much must I give?). Reconsideration is about the *structure* of deliberation (how must I hold my reasons?). One can have a low-demand morality that still requires reconsideration (e.g., a deontology that requires checking all projects against the Categorical Imperative constantly). My objection is about the *fragility* of commitments, not just the *cost* of maintaining them. You can have cheap commitments that are still alienating if they are perpetually conditional.
  *   **Soft Spot:** In practice, reducing reconsideration often reduces demands. It may be hard to disentangle them completely in the Q&A.

  ### 4. The "Failed Generalization" Objection
  *   **Likelihood:** Medium | **Damage:** High
  *   **Attributed To:** The Kantian Deontologists (2 of 3)
  *   **Vocabulary:** "Maxims," "Categorical Imperative," "Side-constraints," "Overridingness."
  *   **The Objection:** "You claim Kantianism requires the same 'reconsideration' of personal projects. But for a Kantian, personal projects are permissible so long as they don't violate duty. They don't need to be *justified* by the moral law, only *permitted* by it. I don't have to reopen the question 'Is my marriage worth it?' unless I suspect it involves treating someone as a means. The moral law is a side-constraint, not a maximizing engine. Your generalization fails."
  *   **2-Minute Reply:** While the moral law is a constraint, it retains *deliberative primacy*. In a conflict, the moral reason always trumps the personal reason. This means the personal reason is always secondary and subject to being overridden. The 'shadow' of the moral law means the personal commitment is never fully sovereign; its continuation is always contingent on it not conflicting with duty. This structural subordination prevents the kind of 'settledness' integrity requires, even if the frequency of conflict is lower than in consequentialism.
  *   **Soft Spot:** "Structural subordination" might be too weak to generate the same alienation as consequentialist maximizing. I need to argue that *potential* override is enough to undermine integrity.

  ### 5. The "Vile Commitments" Objection
  *   **Likelihood:** Medium | **Damage:** High (Moral Cost)
  *   **Attributed To:** The Virtue Theorist
  *   **Vocabulary:** "Character," "Vice," "Eudaimonia," "Moral perception."
  *   **The Objection:** "If integrity requires deliberative compartmentalization, you are licensing agents to hold commitments settled against moral challenge. What if the commitment is to a racist organization or an abusive relationship? Your view seems to say integrity requires we *don't* reconsider these if they are 'from the inside' settled. Are you defending the integrity of the villain?"
  *   **2-Minute Reply:** I am defending a structural feature of agency, not a moral endorsement of specific contents. Compartmentalization is a precondition for having *any* deep commitments, good or bad. We need a separate moral filter to adjudicate *which* commitments are permissible. My point is that even *morally permissible* commitments require protection from reconsideration to count as integrity. We can condemn the racist's content without denying the structural point about how commitments function.
  *   **Soft Spot:** This risks making "integrity" amoral. If integrity protects bad commitments, is it really a virtue? I need to clarify that integrity is a structural good, not an all-things-considered moral good.

  ### 6. The "Effective Giving" Objection
  *   **Likelihood:** Medium | **Damage:** Medium
  *   **Attributed To:** The Visitor (Effective Giving)
  *   **Vocabulary:** "Cost-effectiveness," "Opportunity cost," "Counterfactuals," "Complacency."
  *   **The Objection:** "If agents are licensed to compartmentalize and not reconsider personal projects against impersonal reasons, aren't you licensing complacency? If I can ignore the fact that my career could save more lives elsewhere, doesn't your view endorse inefficiency in the face of suffering?"
  *   **2-Minute Reply:** I am arguing that efficiency cannot be the *sole* governing norm of agency without destroying the agent. If we must always optimize, we cease to be individuals with lives to lead. My view licenses some inefficiency as the cost of maintaining an integrated self. The question is not whether inefficiency is bad, but whether it is the price of admission for being a distinct moral agent rather than a conduit for value.
  *   **Soft Spot:** This is a "bite the bullet" moment. It may sound like I am prioritizing the agent's comfort over saving lives.

  ### 7. The "Self-Effacing" Objection
  *   **Likelihood:** Low | **Damage:** Medium
  *   **Attributed To:** One Sophisticated Consequentialist
  *   **Vocabulary:** "Self-effacing," "Indirect," "Esoteric."
  *   **The Objection:** "What if the consequentialist theory is self-effacing? It tells the agent: 'Do not believe me. Believe in your projects directly.' If the theory itself tells you not to reconsider, doesn't that solve your problem?"
  *   **2-Minute Reply:** A self-effacing theory admits it should not be believed. That is a theoretical cost, not a solution to the agent's predicament. If the theory is true, the agent *ought* to maximize, even if believing that is harmful. My objection is about the truth of the normative claim, not the psychology of belief. If the theory is true, the agent's projects are objectively secondary, regardless of whether they are told to ignore that fact.
  *   **Soft Spot:** This gets into meta-ethics about theory acceptance vs. truth. Might be a rabbit hole.

  ### 8. The "Integrity is Not Moral" Objection
  *   **Likelihood:** Low | **Damage:** Low
  *   **Attributed To:** The Rossian Pluralist
  *   **Vocabulary:** "Prima facie duties," "Moral notion," "All-things-considered."
  *   **The Objection:** "Williams treats integrity as a moral objection. But if integrity conflicts with duty, surely duty wins? Why should moral theory accommodate integrity if integrity leads us away from the right?"
  *   **2-Minute Reply:** I am not arguing integrity always trumps duty. I am arguing that a moral theory that makes integrity *impossible* is defective because it makes *agency* impossible. Morality is for agents. If a moral theory requires us to cease functioning as integrated agents, it is self-defeating. Integrity is a precondition of moral action, not necessarily a competitor to it.
  *   **Soft Spot:** Relies on the claim that morality must accommodate agency. Some hardliners deny this.

  ---

  ## Part 2: Strategic Decisions

  ### 1. The Slide 1 Concession
  **Concede:** "Terminological Risk."
  **Wording:** "I am using 'Integrity' not as a substantive moral virtue (like honesty), but as a structural condition of agency: the ability to hold commitments as settled. I am not arguing that integrity always trumps morality, but that morality must be compatible with the possibility of integrity."
  **Why:** This pre-emptively disarms the Deontologists (who don't value integrity as a moral trump) and the Virtue Theorist (who worries about bad commitments). It frames the project as meta-normative/structural rather than first-order moral.

  ### 2. The Objection That Should Change the Chapter
  **The Planning Agency Objection (#2).**
  **Reason:** If the Planning Theorist is right that "compartmentalization" is just standard intention stability, my thesis loses its critical bite against moral theories. It becomes a description of psychology rather than a critique of normative structures.
  **Action:** I need to add a section distinguishing *functional stability* (Bratman) from *normative immunity* (my claim). I must argue that standard planning theory *does* require reopening intentions when normative reasons are weighty, whereas I am arguing for a permission to resist that pressure.

  ### 3. The Reply That Must Land
  **The "Disposition vs. Audit" Reply (to the ISC Group #1).**
  **Reason:** There are four of them. If they leave the room thinking "Sophisticated Consequentialism already solves this," the specific contribution of the chapter vanishes. I must convince them that *contingency* (holding a disposition only because it works) is distinct from *settledness* (holding it because it is mine), and that ISC cannot grant the latter.

  ### 4. The Question I Hope Nobody Asks
  **"Where is the limit?"**
  **Phrasing:** "You say we can compartmentalize against impersonal reasons. Can I compartmentalize against the fact that my project involves harming others? If not, what is the principled difference between 'impersonal good' reasons and 'moral constraint' reasons that you must respect?"
  **Why:** This forces me to draw a line between the "Reconsideration" I forbid (impersonal maximizing) and the "Reconsideration" I allow (moral constraints). My current draft blurs this by generalizing to *any* deliberative primacy. If I admit Kantian duties *can* override integrity, I weaken the claim that *any* primacy view is problematic. If I say they *can't*, I look like I'm licensing immorality. It exposes the tension in the Generalization Move.
