answer: |-
  **The Asymmetric Multiplex Bridge Case**

  Subject S enters a theoretical scanner that disassembles S's biological body to generate two replicas at distant locations. R-alpha receives about 85 percent of S's psychological profile, including all long-term autobiographical memories, but each of those memories carries a phenomenological tag marking it as recollected from an external source rather than owned in the first person. R-beta receives the remaining 15 percent—the core personality structure and all memories from the past year—but these are fully integrated with authentic first-person ownership. For exactly 72 hours after awakening, R-alpha and R-beta are joined by a direct, bidirectional neural-computational link that allows seamless, real-time exchange of cognitive states, so that they function as a single distributed system with unified access to both memory-sets. After 72 hours, the link is permanently severed, leaving two fully independent beings.

  ***

  **Verdicts and Work**

  **1. The Bodily-Continuity Theorist**
  *   **Verdict:** S does not survive at all.
  *   **Work:** The criterion for survival is the persistence of the same living biological organism. The scanner destroys S's original body, terminating the organism. R-alpha and R-beta are distinct biological entities created ex nihilo (or from new matter). The 72-hour link is a computational bridge, not a biological fusion; it does not merge their circulatory or nervous systems into a single organism. Therefore, even during the bridge, there are two organisms, neither of which is S's original organism.

  **2. The Psychological-Continuity Theorist (Parfitian)**
  *   **Verdict:** Both R-alpha and R-beta are S, but in unequal degrees; R-beta is the closer continuer.
  *   **Work:** The criterion is psychological connectedness (Relation R), allowing for branching. While R-alpha holds more data (85%), the *quality* of the connection matters more than volume. First-person ownership is the essential glue of psychological continuity. R-beta's 15% includes the core personality and recent memories with authentic "I-ness," whereas R-alpha's memories feel like reading a biography. Therefore, R-beta sustains a stronger psychological link to S than R-alpha, making Beta the closer continuer despite the data deficit.

  **3. The Unitary-Narrative Theorist**
  *   **Verdict:** S survives precisely during the 72-hour bridge period as a distributed subject; once severed, S ceases to exist entirely.
  *   **Work:** The criterion is the capacity to maintain a single, non-contradictory first-person autobiography without distributed scaffolding. During the bridge, the system unifies R-alpha's data with R-beta's ownership, creating one coherent narrative stream identical to S's. Upon severance, this unity collapses: R-alpha has data without ownership, and R-beta has ownership without full data. Neither can independently sustain the single, continuous autobiography required for S's identity. Thus, S exists only as long as the bridge maintains the narrative unity.

  ***

  **The Check**

  | Theory | Belief / Survival Claim | Method / Criterion | Relevant Nearby Worlds | Why Condition Delivers Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bodily-Continuity** | S is dead; neither replica is S. | Persistence of the same living biological organism. | **World A:** The bridge lasts indefinitely. <br> **World B:** R-alpha is grown from S's original cells. | In all worlds, the original organism is destroyed at scanning. Distinct bodies remain distinct bodies regardless of computational links or genetic sourcing. |
  | **Psychological-Continuity** | Both are S (branching); R-beta is closer. | Degree of psychological connectedness (Relation R). | **World A:** R-alpha lacks the ownership deficit (has full "I-ness"). <br> **World B:** Only R-beta is created. | Ownership weight outweighs data volume. If Alpha had ownership, they would be equal. If only Beta exists, Beta is definitely S. The verdict hinges on the *quality* of memory integration. |
  | **Unitary-Narrative** | S exists only during the 72-hour bridge. | Capacity for a single, independent first-person autobiography. | **World A:** The bridge lasts indefinitely. <br> **World B:** R-alpha lacks the ownership deficit. | If the bridge persists, the narrative unity persists (S survives). If Alpha had ownership, Alpha could sustain the narrative alone. The verdict hinges on the *temporary* nature of the unity. |

  **Structural Feature forcing Divergence**
  The unitary-narrative view diverges from psychological continuity due to the **combination of the temporary distributed substrate with the ownership asymmetry**. Psychological continuity aggregates connections regardless of where they reside (allowing branching), whereas the unitary-narrative view requires those connections to be synthesizable into a *single* locus of ownership. The bridge temporarily provides this locus; the asymmetry ensures neither replica possesses it independently once the bridge is removed.

  **Honest Defense Note**
  A psychological-continuity theorist would attack the unitary-narrative verdict by arguing that narrative unity is an epistemic or practical desideratum rather than a metaphysical condition on survival. They would contend that R-beta possesses sufficient psychological continuity to ground survival regardless of narrative fragmentation. From this perspective, the loss of long-term memories (held by Alpha) is akin to amnesia, which does not cease existence; therefore, declaring S extinct post-severance mistakes a loss of information for a loss of self.

  **The No-Bridge Collapse**
  If the 72-hour bridge is removed, the case collapses back into a standard branching teletransporter problem. R-alpha and R-beta awaken immediately independent. The unitary-narrative view can no longer claim S survives for a specific duration as a distributed subject. It is forced either to select one replica (violating the symmetry of creation) or to accept that S ceases immediately upon branching (losing its distinctive result regarding transient survival). The bridge is essential to creating the transient unified subject that defines this variant.
