answer: |-
  Here is a 50-minute teaching sequence designed for second-year grads. It assumes competence with "Two Dogmas" (web of belief, rejection of analytic/synthetic) but zero ethics background.

  ### **Session Goal**
  To demonstrate that for Quine, moral claims are **ontological posits** required for social coordination, analogous to mathematical sets in physics. They are not "true" by correspondence to non-natural facts, but they are not "relative" in the subjective sense; they are **indispensable constraints within the web.**

  ---

  ### **1. The Sequence (50 Minutes)**

  **0:00–0:05 | Setup: The Web and the Void**
  *   **Action:** Briefly recap the "Web of Belief." Remind them that for Quine, ontology is not about what *really* exists in a God's-eye view, but what we must *commit* to in order to make our best theories work.
  *   **Key Move:** State clearly: "Today we are asking: Where does 'Good' sit in the Web? Is it an observation sentence at the periphery? A logical truth at the center? Or something else?"
  *   **Constraint:** Do not define "metaethics." Just treat it as "ontology of value."

  **0:05–0:15 | The Baseline: Math as a Posit**
  *   **Action:** Rehearse Quine's view on numbers/classes. We don't observe the number '7'. We posit it because physics collapses without it (Indispensability).
  *   **Crucial Distinction:** Numbers aren't "subjective" (I can't just decide 2+2=5), but they aren't "empirical objects" (you can't trip over a '7'). They are **structural posits.**
  *   **Why here:** You must secure their understanding of *mathematical ontology* before mapping it to ethics. If they don't buy that numbers are posits, the ethical analogy fails.

  **0:15–0:30 | The Carrying Example: The Coordinate Origin**
  *   **Action:** Introduce the analogy. Do not use "beauty" or "taste." Use **The Zero Point on a Coordinate System.**
  *   **The Explanation:**
      *   Imagine mapping a terrain. You must draw grid lines (Latitude/Longitude) and pick a "Zero Point" (Origin).
      *   The Zero Point is not *in* the terrain. There is no "zeroness" property in the dirt. (Parallel: No "goodness" property in the action).
      *   However, once the grid is baked into the scheme, the statement "The city is at 40°N" is objectively true *relative to the scheme*.
      *   **The Ethical Transfer:** "Pain is bad" functions as setting the Zero Point for our social coordinate system. It is a calibration mark. We posit it not because we detect 'badness particles,' but because a social theory without a zero-point for suffering cannot navigate human interaction.
  *   **Why this example:** It avoids relativism (the grid is arbitrary *in origin* but rigid *in use*) and avoids supernaturalism (the grid isn't in the dirt). It captures "internal calibration."

  **0:30–0:40 | Misconception Clinic (Pre-emptive Strikes)**
  *   **Action:** Pause the lecture. Explicitly name and kill the three likely errors. (See below for scripts).
  *   **Why here:** Grads will start generating counter-examples now. Stop them before they solidify.

  **0:40–0:45 | Guided Discussion**
  *   **Prompt:** "If ethics is a posit like math, can it be revised? Quine says even logic is revisable if the web requires it. What would force a revision of the 'Pain is bad' posit?"
  *   **Goal:** Get them to see that moral revision comes from *systemic incoherence*, not new empirical data.

  **0:45–0:50 | The Check Question & Wrap**
  *   **Action:** Pose the Check Question (see below). Collect written answers or do a show of hands.
  *   **Close:** Reiterate that this makes ethics *naturalized*, not *eliminated*.

  ---

  ### **2. The Carrying Example: Why "The Coordinate Origin"**
  You must avoid the "Beauty is in the eye" framing because that implies **subjectivity** (varies by person). Quine's view is about **conceptual schemes** (shared structures).

  *   **Why the Coordinate Origin works:**
      1.  **Arbitrary but Necessary:** You *must* have a zero point to measure distance, but nature doesn't dictate where zero goes. (Parallel: We *must* have values to coordinate society, but nature doesn't dictate 'utility' vs 'duty').
      2.  **Objective within Scheme:** Once zero is set, "5 meters away" is a hard fact. (Parallel: Once "suffering is bad" is set, "torture is wrong" is a hard fact within the scheme).
      3.  **No "Ghostly Property":** There is no metaphysical "zeroness" hovering over the origin point. (Parallel: No Moorean "Goodness").

  ---

  ### **3. Misconceptions & When to Head Them Off**

  **Misconception A: "So Quine is a Moral Relativist."**
  *   **The Error:** Students think "posited" means "optional" or "culture-dependent."
  *   **When to Head Off:** **Minute 15** (during the Math Baseline).
  *   **The Script:** "Stop. If numbers are posits, is math relative? No. We are compelled to posit them by the structure of our best theory. Quine's ethics is the same. We are compelled to posit 'pain is bad' by the structure of our social theory. It is binding, not optional."

  **Misconception B: "This is just Evolutionary Psychology."**
  *   **The Error:** Students think Quine is explaining *why* we have morals (survival advantage).
  *   **When to Head Off:** **Minute 25** (during the Coordinate Example).
  *   **The Script:** "Quine isn't doing genealogy. He's not asking how we evolved to feel this. He's asking about *ontological commitment*. Does our best theory of the world require 'values' as entities? Evo-psych explains the cause; Quine explains the logical status."

  **Misconception C: "Moral Language is Literally Meaningless."**
  *   **The Error:** Students conflate "no non-natural property" with "non-cognitivism" (boo/hurrah theory).
  *   **When to Head Off:** **Minute 35** (Misconception Clinic).
  *   **The Script:** "Quine isn't saying 'Murder is wrong' is nonsense. He's saying it's true *in virtue of the scheme*, like 'The origin is at 0,0'. It has a truth value, but the truth-maker is the utility of the scheme, not a moral fact 'out there'."

  ---

  ### **4. The Check Question**
  *Do not ask:* "Did you understand?"
  *Do not ask:* "Is Quine right?"

  **Ask this:**
  > "If we discovered a comprehensive physical theory that successfully predicted all human behavior *without* positing 'agents' or 'needs' (treating humans purely as physical particles), what happens to the truth-value of the claim 'Starvation is bad' on Quine's view?"

  **Correct Answer Logic:**
  *   If they understand the structural dependency, they should say: **The claim loses its truth-value (or becomes obsolete).**
  *   **Why:** Because for Quine, the posit is justified by *indispensability*. If the "agent/need" posit is excised from the ontology (like phlogiston), the moral calibration marks attached to it lose their anchor. This proves they see the link between ontology and moral discourse.

  ---

  ### **5. What to Refuse to Explain (Boundaries)**
  To keep this within 50 minutes and at the right level, explicitly state you will **not** cover:

  1.  **The Open Question Argument:** Do not let them drift into G.E. Moore. Quine rejects the framework that makes Moore's question relevant.
  2.  **The Is-Ought Gap:** Do not try to solve Hume. Quine naturalizes the gap; he doesn't bridge it logically. Tell them: "We are looking at the *function* of the ought, not its derivation."
  3.  **Quine's Personal Normative Views:** Do not discuss what Quine thought about specific wars or policies. This is metaethics/ontology, not applied ethics.
  4.  **Technical Indispensability Proofs:** Do not get into Putnam vs. Quine on mathematical realism. Keep it at the "Web of Belief" level.

  ### **Instructor Note on Accuracy**
  *Quine scholars will note that Quine often leaned toward non-cognitivism (ethical sentences aren't truth-apt) in his later work. However, your prompt asks to teach the "posit/calibration" reading (a naturalist reconstruction). Stick to the prompt's framing as a "Quinean Naturalist Model" of ethics. If a student challenges you on Quine's actual texts, concede that Quine was inconsistent on ethics, but insist that for *this session*, you are exploring the implications of his **ontological naturalism** applied to value.*
