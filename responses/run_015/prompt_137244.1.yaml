answer: |-
  The move you are describing does have a name in philosophy, though it is rarely used in casual online arguments. The formal term is **Contrastive Causation**. In the context of an argument, I will call the rhetorical maneuver **The Contrastive Shift**.

  Here is the definition, the breakdown of the two axes you identified, the criterion for selecting the "right" resolution, and the handling of the triviality boundary case.

  ### 1. The Name and Definition

  **Term:** **The Contrastive Shift** (based on **Contrastive Causation**)

  **Definition:** A causal claim is never simply "X caused Y." It is always implicitly ternary: "X caused Y *rather than* Z." The "Zoom" argument works by rejecting the skeptic's implied contrast class (Z) and substituting a finer-grained one.

  *   **Skeptic's Claim:** "Your vote did not cause [The Win *rather than* The Loss]." (Binary outcome)
  *   **Your Reply:** "My vote caused [The Win by 1 *rather than* A Tie]." (Marginal outcome)

  The move is valid because causal statements are context-sensitive. When someone says "It made no difference," they are asserting a counterfactual: "If you hadn't acted, the *relevant outcome* would be the same." The Contrastive Shift replies: "If I hadn't acted, the *specific description of the outcome* would be different."

  ### 2. Untangling the Two Axes

  You correctly identified that "zoom" conflates two different logical moves. Contrastive causation separates them cleanly.

  **Axis A: Descriptive Granularity (The Margin)**
  *   **What it is:** Changing the precision of the *same* event.
  *   **Example:** Vote counts.
  *   **Contrast:** "Win vs. Lose" (Coarse) $\rightarrow$ "Win by 500 vs. Win by 499" (Fine).
  *   **Status:** This is a **Constitutive** claim. Your vote is a *part* of the margin. It is always causally true that removing your vote changes the margin number, regardless of whether that number changes the winner.

  **Axis B: Causal Distance (The Chain)**
  *   **What it is:** Moving downstream to *consequences* of the event.
  *   **Example:** Vote $\rightarrow$ Policy $\rightarrow$ Hiring.
  *   **Contrast:** "Who Wins" $\rightarrow$ "Which Policy Passes."
  *   **Status:** This is a **Consequential** claim. It relies on the chain holding. As you noted, this can break (e.g., if both candidates have identical policies).
  *   **Interaction:** The "Zoom" reply often smuggles Axis A in to support Axis B. ("Your vote changes the margin [A], which changes the party's mandate, which changes policy [B].") This is valid *only if* the system is sensitive to margins at that specific point.

  ### 3. Selecting the "Right" Resolution (Avoiding Arbitrariness)

  You asked: *"Something has to pick the right resolution... whether it can be said without just begging the question."*

  If we can zoom infinitely, isn't the choice of resolution arbitrary? No. The correct resolution is selected by **System Sensitivity** (or **Threshold Mechanics**).

  A resolution is "correct" for the purpose of the argument if the system in question has a **leverage point** at that level of granularity.

  *   **Valid Zoom:** "My chicken purchase shifts the order by one unit."
      *   *Why:* The supply chain software tracks inventory by the unit. There is a threshold (reorder point) where `Inventory < Threshold` triggers `Order Crate`. Your unit moves the inventory variable closer to that trigger. The system is *sensitive* to that resolution.
  *   **Invalid Zoom:** "My car exhaust moved one specific air molecule."
      *   *Why:* While causally true, the weather system does not have a leverage point where `Molecule X position` determines `Storm Y`. The chaos of the system swamps the signal. There is no *mechanism* that preserves the difference at that resolution to produce a macroscopic outcome.

  **The Rule:** The Contrastive Shift works only when you can point to a **mechanism** that registers the difference at that zoom level. If the system treats the fine-grained difference as noise (slack, rounding error, buffer), the causal claim is technically true but functionally inert.

  ### 4. The Triviality Boundary Case

  You asked: *"Sometimes the only difference I make at the fine level is one nobody has any reason to care about — which particular bird dies instead of which other one... Does the move still go through there?"*

  This is the most critical distinction. You must separate **Causal Efficacy** from **Normative Significance**.

  *   **Does the move go through?** **Yes.** Causally, you did make a difference. You caused *Bird A* to die *rather than* *Bird B*.
  *   **Does it justify the action?** **No.** If your moral framework is "minimize total suffering," then *Bird A vs. Bird B* is a **Normatively Equivalent Contrast**.

  The Contrastive Shift proves **Agency**, not **Justification**.
  *   **Skeptic:** "You made no difference."
  *   **You:** "I made a difference (Bird A died rather than Bird B)."
  *   **Skeptic:** "A difference that matters to whom?"

  If the only difference is trivial (which specific byte, which specific bird), the Contrastive Shift successfully refutes the claim of *causal impotence*, but it fails to refute the claim of *moral futility*.

  **Boundary Test:** To check if the move holds weight, ask: **"Is there a value system for which this contrast matters?"**
  *   *Vote Margin:* Yes (Recount laws, public funding thresholds).
  *   *Specific Bird:* No (unless you have a specific duty to *that* bird, which is rare).
  *   *Specific Byte:* No (unless it's a hash collision in a security context).

  If the answer is "No," the Contrastive Shift is logically valid but rhetorically hollow. It proves you are not a ghost, but it doesn't prove you are a helper.

  ### 5. Why This Is Not the "Forbidden Three"

  You specified three replies you wanted to avoid. Here is why the Contrastive Shift is distinct:

  1.  **Not Uncertainty ("You might be the tiebreaker"):**
      *   That argument relies on *epistemic limits* (you don't *know* the margin).
      *   Contrastive Causation relies on *metaphysical facts* (the margin *is* different, even if we know it didn't change the winner). It works even if you know for a fact you weren't the tiebreaker.
  2.  **Not Generalization ("What if everyone did that?"):**
      *   That argument relies on *universalizability* (Kantian/Rule Utilitarian).
      *   Contrastive Causation relies on *individual contribution* (Act Utilitarian/Causal). It argues that *this specific act* had a specific causal profile, regardless of what others do.
  3.  **Not Complicity ("You're part of the group"):**
      *   That argument relies on *membership* or *complicity*.
      *   Contrastive Causation relies on *physics and logic*. It treats the voter/buyer as an isolated variable affecting a system, not as a member of a collective.

  ### Summary for Use in Argument

  When someone says "Your one X makes no difference," you can identify if they are vulnerable to the Contrastive Shift by asking:

  1.  **Identify the Contrast:** "What exactly are you saying wouldn't change? The winner? The margin? The future order?"
  2.  **Check System Sensitivity:** "Is there a rule or mechanism that reacts to the difference I'm proposing? (e.g., Does a 1% margin trigger funding? Does a 1-unit inventory drop trigger a crate order?)"
  3.  **Check Normative Weight:** "If I prove I changed [Fine Detail] rather than [Coarse Detail], does anyone care about that detail?"

  **The Label:** If you need a shorthand for the fallacy they are committing, call it **"The Binary Outcome Fallacy."** They are assuming outcomes are 0 or 1, when they are actually continuous or multi-thresholded. Your reply is the **"Continuous Impact Correction."**

  **When it stops working:** It stops working when the system has **infinite slack**. If the supply chain orders strictly in crates of 100 and throws away nothing, and your single purchase is absorbed into waste without ever triggering a reorder threshold *even cumulatively over time* (a hard cap), then the causal chain is broken. But in almost all real-world systems (votes, markets, climate), there are no hard caps, only probabilities and thresholds, meaning the Contrastive Shift is almost always causally valid, even if sometimes normatively trivial.
