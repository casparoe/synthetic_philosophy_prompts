answer: |-
  You are absolutely right to be suspicious. Your intuition is spot-on: the phrase "DNA is code" is a **category metaphor** that works beautifully for *manipulating* biology (synthetic biology) but creates a logical trap when used to *explain the origin* of biology.

  The biologist is committing a subtle form of equivocation. He is using the technical utility of the metaphor to lend weight to the philosophical implications of the metaphor.

  Here is the disentangled list of claims packed into that sentence, categorized by their truth value and their utility in the two different contexts (Lab vs. Design Argument).

  ### 1. The Claim of Discrete Symbolic Representation
  *   **The Claim:** DNA uses a finite alphabet (A, C, G, T) to represent information, similar to binary (0, 1) or text.
  *   **Status:** **Substantive & Defensible.**
  *   **The Nuance:** This is the strongest link to "code." The sequence of bases is distinct from the chemical properties of the DNA strand itself. You can rearrange the letters without changing the chemical stability of the backbone, just like you can rearrange letters on a page without changing the ink.
  *   **Lab Shorthand:** **High Utility.** This is why synthetic biology works. We can treat DNA as data to be edited, copied, and pasted.
  *   **Design Argument:** **Moderate Support.** This establishes DNA as *information-bearing*. However, information can arise from natural processes (e.g., tree rings encode age, ice cores encode climate). It proves storage, not necessarily authorship.

  ### 2. The Claim of Arbitrary Mapping (The "Morse Code" Point)
  *   **The Claim:** The relationship between the DNA codons (triplets of bases) and the amino acids they produce is arbitrary/conventional, not chemically necessary.
  *   **Status:** **Mostly True (with caveats).**
  *   **The Nuance:** This is the specific point you were half-remembering. In Morse code, there is no chemical reason why "dot-dash" means "A". It's a convention. In genetics, there is no strong chemical bond forcing "GGC" to bind to "Glycine." It is mediated by tRNA and enzymes. Because the mapping is not strictly determined by physics/chemistry, it looks like a *choice* or a *convention*.
  *   **Lab Shorthand:** **High Utility.** It allows us to "recode" organisms (e.g., making bacteria produce insulin).
  *   **Design Argument:** **High Support.** This is the heavy lifter for the "Coder" argument. If the mapping is arbitrary, it implies a "decision" was made at some point. *Counter-argument:* Evolution can "freeze" arbitrary accidents. Just because a rule is arbitrary doesn't mean a mind set it; it could be a historical accident that got locked in.

  ### 3. The Claim of Semantic Content (Meaning)
  *   **The Claim:** DNA contains "meaning" or "instructions" in the same way a sentence or a software script does.
  *   **Status:** **Smuggled Assumption / Metaphorical.**
  *   **The Nuance:** This is the trap. DNA has *causal power*, not *semantic meaning*. A computer code means something to a compiler; DNA "means" something only to the cellular machinery that evolved to read it. To say it has intrinsic meaning is to assume the machinery existed *before* the DNA, or that "meaning" exists independently of an interpreter.
  *   **Lab Shorthand:** **High Utility.** It's easier to tell a student "this gene instructs the cell to make protein X" than to explain the thermodynamic cascades.
  *   **Design Argument:** **Critical Flaw.** This smuggles in the "Coder." It assumes that because *we* read DNA as instructions, it *is* an instruction set waiting for a reader. In reality, the "reader" (the ribosome) and the "code" co-evolved. You can't have the code without the reader.

  ### 4. The Claim of Executive Control (The "Program" Point)
  *   **The Claim:** DNA is the "boss" of the cell; it directs development like a blueprint or a program.
  *   **Status:** **Wrong / Outdated.**
  *   **The Nuance:** This is the "Blueprint vs. Recipe" distinction. A blueprint contains a 1:1 map of the final product. DNA is not a blueprint; it is more like a **recipe** or a **set of constraints**. The cell interacts with the environment, physical forces, and chemical gradients to build the organism. DNA doesn't "code for" an eye; it codes for proteins that, under specific physical conditions, help form an eye.
  *   **Lab Shorthand:** **Medium Utility.** It's a useful simplification, but synthetic biologists know that putting a gene in doesn't guarantee an outcome (context matters).
  *   **Design Argument:** **Weak Support.** If DNA were a blueprint, a Designer makes sense. If DNA is a recipe that relies on self-organizing physical laws to do the heavy lifting, the need for a micromanaging Designer decreases.

  ### 5. The Claim of "Literalness"
  *   **The Claim:** "DNA is *literally* code."
  *   **Status:** **Wrong.**
  *   **The Nuance:** DNA is *literally* a molecule (deoxyribonucleic acid). It is *functionally analogous* to code. Calling it "literally code" is a category error. It confuses the map with the territory.
  *   **Lab Shorthand:** **Acceptable Slang.** In the lab, treating it as literal code gets the job done.
  *   **Design Argument:** **Logical Fallacy.** This is the equivocation. The argument relies on the *properties of literal code* (written by programmers) being applied to *biological molecules* via a metaphor.

  ---

  ### Summary for the Gym Debate

  If you want to push back without getting bogged down in theology, focus on the **Equivocation** and the **Reader**.

  **1. The "Coder" Equivocation:**
  > "When you say 'code,' are you talking about the *math* (information theory) or the *metaphor* (software engineering)? Because mathematically, nature generates information all the time (snowflakes, river deltas). If you mean software, you're smuggling in the idea of a computer, which requires a designer by definition. You can't use the definition of 'code' that includes 'programmer' to prove there's a 'programmer.'"

  **2. The "Reader" Problem (The strongest counter to the Design Argument):**
  > "Code only exists if there is a machine to read it. DNA is useless without the ribosome (the reader). But the ribosome is built *using* DNA. So which came first? If you say 'a Designer built both,' that's a faith claim, not a scientific one derived from the word 'code.' In evolution, the code and the reader co-evolved slowly. Calling it 'code' makes it look like it appeared fully formed, which is the thing you're trying to prove."

  **3. The "Recipe" Correction:**
  > "Also, 'code' implies a blueprint. But DNA is more like a recipe. If I give you a recipe for a cake, the physics of heat and chemistry of flour do most of the work. I don't have to 'code' the rising of the cake. DNA sets constraints, but physics builds the organism. That leaves a lot less work for a 'Coder' to do."

  ### The Verdict on the "Safe" Contexts

  *   **Safe (Lab Shorthand):** "DNA functions *as if* it were code, allowing us to engineer it." (Claims 1 & 2).
  *   **Unsafe (Philosophical Argument):** "DNA *is* code, therefore it has a coder." (Claims 3 & 5).

  Your friend is using the **utility** of the metaphor in the lab to validate the **ontology** of the metaphor in philosophy. That's the slide you need to point out.
