answer: |-
  Good morning. Welcome.

  Looking around this room, I see a divide that we rarely acknowledge out loud. On one side, historians who study the structure of scientific change. On the other, practitioners living through it. Usually, these perspectives talk past each other. The historians see inevitability; the scientists feel agency. But this workshop exists because those two things are colliding.

  I say this not just as a moderator, but as a participant. Last month, I opened my inbox to find a preprint from a group in Berlin. They had found the same core result I had sat on for two years. Different notation, same skeleton. I wasn't wrong. I wasn't slow. I was just second.

  That sting is specific. It forces us to ask the uncomfortable question underlying our time together: If calculus was waiting for Newton and Leibniz, and natural selection for Darwin and Wallace, does that make the discoverer replaceable?

  To think about this, I want us to use one image: **The Swell.**

  In surfing, the wave is not created by the surfer. It is generated by distant storms, by wind, by the contour of the ocean floor. It is structural. It is inevitable. When the conditions are right, the wave breaks. If you are not there to ride it, someone else will. The energy dissipates regardless of your presence.

  For the historians in the room, you are the oceanographers. You study the storm systems—the intellectual climate, the available tools, the precursor papers—that generate the swell. You are right to say the wave was coming.

  But for the scientists and grad students, many of whom are terrified of being scooped: you are the surfers. You paddle. You bleed. You develop the balance to stand up on a moving surface. Just because the wave was inevitable does not mean the ride was easy. Being scooped is not an epistemic failure. You did not fail to find the truth. It is a social failure. You lost the priority, not the insight.

  This brings us to the naming. Why do we call it Newton's Laws or Darwin's Theory if the wave was going to break anyway?

  We name them not because the discoverer was uniquely magical, but because human beings need handles. We need coordinates. "Natural Selection" is a phenomenon; "Darwin" is a bookmark. It is a useful fiction. It anchors a floating truth to a human node so we can pass it down the line. It tracks credit, which is currency, not necessarily genius.

  So, if you are sitting here feeling the loss of priority, know this: You were not replaced in the work of understanding the world. You were only displaced in the record of who planted the flag.

  This week, let's not just argue about who surfed the wave first. Let's try to understand the water itself. Let's look at how the swell forms, why we need to name the riders, and how we can build a culture that respects the ride even when someone else catches the break.

  Thank you. Let's begin.
