      The fluorescent light above Denise's desk hummed, a B-flat sharp enough to nestle behind her eye. She didn't rub at it. Rubbing acknowledged it, and the office culture discouraged acknowledging the minor stuff. That was for the Chamber.

      She smoothed Form 88-C across the laminate surface. The conversion logs for Q3 were off. Again. The municipal intake—the sum of every stubbed toe, every static shock, every collar chafe across forty thousand residents—totaled 4,200 hours of equivalent discomfort. The volunteer output logs, the signed affidavits from the people who sat in the quiet room and took it, reported only 3,800 hours.

      Four hundred hours of pain had vanished.

      Denise capped her pen. In eleven years, the ledger had never balanced perfectly, but the variance was usually negligible. This was a gap. If she signed the audit, she was certifying that the town's suffering was being destroyed, not just moved. If she didn't, she was holding up the payroll for the volunteers who claimed they'd done the work.

      The door creaked. Miller stepped in, holding a styrofoam cup that leaked slightly onto his knuckle. He didn't wipe it.

      "Audit giving you trouble?" Miller asked. He leaned against the filing cabinet, the leg of his trousers riding up to reveal a sock with a hole in the heel.

      "Variance is high," Denise said. "Output is low. Either they're lying about the intensity, or the conversion rate is changing."

      "Or they're forgetting," Miller said. He took a sip. "People forget pain. That's the theory."

      "Theory says pain is conserved."

      "Theory says a lot of things." Miller set the cup on her desk, next to the stack of scheduling slips. "Speaking of which. We're short for Friday. The intake spike from the flu season is hitting the grid. We need a body."

      Denise looked at the slips. "I've done four turns, Miller. Rotation policy says I'm ineligible for another six months."

      "Policy also says no back-to-backs," Miller said. He tapped the top slip. "But I'm authorizing a double. Two sessions. One after the other. You know the room. You know the shape of it."

      "It's not allowed."

      "Nothing here is really allowed until someone signs the form." Miller shrugged. "Think of the efficiency. One setup, one briefing, double the clearance for the town. If one afternoon buys a week of smooth sailing for forty thousand people, why isn't two afternoons worth it? The math holds."

      Denise looked at her hand. The skin was pale, unmarked. She remembered her last turn, three years ago. She remembered the specific weight of the ache in her lower back, how it had started as a dull throb and sharpened into a needle point around 2:00 PM. She remembered the taste of copper when the migraines hit at 3:15.

      Outside the room, her life was a blur of beige days. She couldn't recall what she'd eaten for dinner last Tuesday. She couldn't remember the drive home from her sister's wedding. Those moments had been spent in a low-level hum of traffic noise, mild hunger, and the itch of wool sweaters. Discomforts so small they slipped through the mesh of memory.

      But the turn? The turn was solid. It had edges. It was the only time she felt anchored to the earth.

      If the audit was right, the pain was disappearing in the transfer. The volunteers were reporting less than the town produced. Maybe the machine was eating it. Maybe the suffering was actually being destroyed, and the volunteers were just the catalysts.

      Or maybe the volunteers were remembering it wrong. Maybe the intensity was so high it burned out the memory of the duration.

      But Denise remembered hers. She remembered it better than anything.

      "If I do the double," Denise said, her voice quiet in the hum of the light, "does the variance count against me?"

      "The variance is a ledger issue," Miller said. "This is staffing."

      "If the pain isn't conserved, Miller... if it's less than the sum..."

      "Then we're getting a discount," he said. He didn't smile. "Look, Denise. You want the truth? The town feels fine. The volunteers get paid. The only thing hurting is the accounting."

      He pushed the pen toward her. It sat next to the audit form and the scheduling slip.

      Denise looked at the fluorescent light. It buzzed, a tiny, meaningless irritation. She could let it stay there, let it join the thousands of other invisible stings that kept the town running. Or she could take it all. She could take the flu-season headaches, the backaches, the friction of shoes on blisters, and she could bind them into something sharp. Something she would feel so deeply she wouldn't be able to forget it.

      If she signed the audit, she admitted the system was leaking. If she signed the schedule, she became the plug.

      She picked up the pen. The plastic was warm from Miller's hand. She moved the audit form aside and placed the scheduling slip on top. The line for the signature was blank, waiting for ink that would make the prohibition real.

      She thought about the clarity of the pain. She thought about the fog of the peace.

      Denise pressed the nib to the paper. The ink flowed, dark and permanent. She signed her name, then moved the pen to the audit below it, marking the discrepancy as 'Unresolved - Systemic Loss.'

      She capped the pen and set it down. Miller exhaled, a sound like a tire losing air. He took the slips.

      "See you Friday," he said.

      Denise watched him go. The light above her buzzed. She reached up and touched the spot behind her eye, wondering if she would miss the sting when it was gone.

