  The fluorescent light above Denise's desk hummed, a B-flat sharp enough to nestle behind her eye. She didn't rub at it. Rubbing acknowledged it, and the office culture discouraged acknowledging the minor stuff. That was for the Chamber. Here, under the flicker, discomfort was just data waiting to be logged.

  Denise smoothed Form 88-C across the laminate surface. The conversion logs for Q3 were off. Again. The municipal intake—the sum of every stubbed toe, every static shock, every collar chafe across forty thousand residents—totaled 4,200 hours of equivalent discomfort. The volunteer output logs, the signed affidavits from the people who sat in the quiet room and took it, reported only 3,800 hours.

