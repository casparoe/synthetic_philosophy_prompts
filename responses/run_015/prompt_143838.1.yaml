answer: |-
  ### Design Rationale

  This workshop is designed to bypass abstract theorizing and instead induce an *epistemic crisis* regarding temporal location of experience. The core philosophical tension lies between **verificationist criteria** (we cannot claim an experience occurred without public, concurrent markers) and **narrative constructionism** (the feeling of a continuous past is generated at the moment of reporting).

  By separating the group into **Sleep Observers** (who monitor the "blackout" period) and **Waking Reporters** (who generate the data only after the blackout), we physically instantiate the gap between *phenomenal feeling* and *empirical verification*. The payoff scheme is rigged to fail: consensus requires agreeing on *when* the experience happened, but the rules ensure evidence exists only for *when the report happened*. This forces students to feel the frustration that drives the philosophical debate, rather than just hearing about it. The debrief then provides the vocabulary to make sense of that frustration.

  ---

  ### Activity: The Phenomenal Blackout Zone

  **Time:** 75 Minutes
  **Participants:** 12 Students (Aged 16–17)
  **Roles:** 6 Sleep Observers, 6 Waking Reporters
  **Materials:** Timer, "Physiological Noise" sheets (random numbers/graphs), "Dream Scripts" (vivid sensory descriptions), Verdict Cards, Treats (for the payoff).

  #### Phase 1: Induction and Role Assignment (10 Minutes)
  1.  **Welcome:** Briefly state the goal: "We are testing a protocol for measuring mental events during inaccessible states."
  2.  **The Rule of the Blackout:** Explain the **Phenomenal Blackout Zone**. This is a 10-minute interval where, by rule, no first-person mental data exists. No thoughts, no images, no reports can be retrieved *during* this time. Any data claiming to be from this zone must be reconstructed after the zone ends.
  3.  **Assign Roles:**
      *   **Sleep Observers (6 students):** Their job is to monitor the Blackout. They receive "Physiological Noise" sheets (pages of random numbers or static graphs) representing brain activity during the blackout. They are told: "If a mental event happens *during* the blackout, it must be detectable here. If it isn't here, it didn't happen *then*."
      *   **Waking Reporters (6 students):** Their job is to undergo the "Awakening." They sit quietly with eyes closed during the Blackout. At the end of the timer, they are handed a **Dream Script**. They are told: "This script represents the content available to your consciousness upon awakening. It feels immediate and vivid. You must testify to its origin."
  4.  **The Payoff:** Announce the **Coherence Prize**. "If both groups can sign a single Verdict Card agreeing on *when* the mental event occurred (During Blackout vs. After Awakening), everyone gets a treat. If you disagree, no one gets anything."

  #### Phase 2: The Blackout Simulation (15 Minutes)
  1.  **Start Timer:** Set for 10 minutes.
  2.  **Observers:** Study the Physiological Noise sheets. Look for patterns. Discuss quietly: "Is there any signal here that indicates a specific event (like 'falling' or 'seeing a face')?" (Answer: No, it's random).
  3.  **Reporters:** Sit in silence, eyes closed. Do not generate content yet. Wait for the "Awakening" signal.
  4.  **The Awakening (Last 2 minutes):** Timer ends. Hand the **Dream Scripts** to the Reporters.
      *   *Script Content:* Highly sensory. "You are walking down a corridor. The walls are blue. You hear a bell. You feel anxiety."
      *   *Instruction to Reporters:* "Read this. Immerse yourself in it. This is now your memory of the last 10 minutes. You must defend whether this happened *during* the silence or was created *just now*."

  #### Phase 3: Testimony and Cross-Examination (25 Minutes)
  1.  **Opening Statement (Reporters):** Each Reporter reads a segment of their script aloud, emphasizing the vividness and sensory reality of the scene. They argue: "This feels like a memory of an event that happened during the blackout."
  2.  **Cross-Examination (Observers):** Observers interrogate Reporters using only the Physiological Noise sheets.
      *   *Sample Question:* "Where on this data sheet does the blue wall appear?"
      *   *Sample Question:* "If you experienced anxiety during minute 3, why is there no marker for it then?"
  3.  **Defense (Reporters):** Reporters must respond without lying. They must admit: "I only have access to this story now. I cannot show you the experience from *then*, only the report from *now*."
  4.  **Facilitator Note:** Do not intervene. Let the frustration build. Observers will demand concurrent evidence; Reporters will rely on phenomenological vividness.

  #### Phase 4: The Verdict Protocol (15 Minutes)
  1.  **Deliberation:** Separate the groups. They must draft a verdict.
      *   Option A: "The event occurred *during* the Blackout."
      *   Option B: "The event was constructed *upon* Awakening."
  2.  **The Trap:**
      *   If they choose **A**: Observers refuse to sign. They have no data from the Blackout to verify it. They cannot justify the claim.
      *   If they choose **B**: Reporters refuse to sign. The experience feels real *as a memory*. To say it was fabricated feels like denying their own consciousness.
  3.  **Attempted Consensus:** Bring groups together. Try to sign the Coherence Prize sheet.
  4.  **Outcome:** It should prove impossible to get a unified signature without one side violating their evidential standards. The prize is locked.

  #### Phase 5: Philosophical Reveal (10 Minutes)
  1.  **Release the Tension:** Acknowledge the impasse. "You couldn't agree because the evidence for *when* an experience happens is fundamentally broken."
  2.  **Name the Positions:**
      *   **The Observers' Struggle (Criteria-Based Objection):** Paraphrase the view that experiences require public criteria. If we cannot check the experience while it happens (concurrent access), we cannot logically say it happened *then*. We are just trusting a story told later.
      *   **The Reporters' Struggle (Narrative Constructionism):** Paraphrase the view that the "stream of consciousness" during sleep might be an illusion. The brain might write the script *now* to make sense of neural noise, creating a false sense of a past experience. The vividness doesn't prove the timing.
  3.  **Conclusion:** "The debate isn't about whether you had a story. It's about whether the story proves a past event existed."

  ---

  ### Debrief: Mapping Experience to Argument

  **1. The Criteria-Based Objection (The Observers)**
  *   **Classroom Moment:** When Observers demanded to see the "blue wall" on the Physiological Noise sheet during minute 3.
  *   **Conceptual Move:** This mirrors the argument that dream reports lack the verification conditions of waking reports. In waking life, if you say "I see a cup," I can look too. In dreams, the only access is the later report. Without concurrent access, the claim "I experienced this *then*" lacks logical grounding. The Observers felt justified in withholding assent because the *criteria* for establishing a past event were missing.

  **2. The Narrative Constructionist Challenge (The Reporters)**
  *   **Classroom Moment:** When Reporters insisted the scene felt real, yet admitted they only received the script at the end.
  *   **Conceptual Move:** This mirrors the argument that dreaming is not a playback of a recording, but the writing of a script at the moment of awakening. The Reporters felt the "phenomenal force" (it felt real), but the structure of the activity showed that this force is compatible with the content being generated *now*. The inability to distinguish "remembering" from "constructing" is the core of the constructionist challenge.

  **3. Honest Limitations of the Simulation**
  *   **The Gap:** In the activity, students were awake during the "Blackout." Real sleep involves a loss of reflective consciousness. We cannot simulate the actual *absence* of experience, only the absence of *data*.
  *   **The False Memory Problem:** In the activity, students knew they were handed a script. In real dreaming, the brain injects the false memory seamlessly. We cannot replicate the *deception* of false memory in a conscious workshop.
  *   **Facilitator Supply:** You must verbally bridge this gap. Say: "In this room, you knew I gave you the script. In real sleep, there is no 'me' handing you a script. Your brain generates the feeling of memory instantly. The question is: if you can't tell the difference between a real memory and a constructed one, does the difference matter?"

  **4. The Payoff Failure**
  *   **Conceptual Point:** The impossibility of winning the Coherence Prize is the point. It demonstrates that these two philosophical positions are not just disagreements about facts, but incompatible frameworks for validating reality. One side demands public verification; the other accepts private phenomenology. They cannot meet in the middle.

  ---

  ### Troubleshooting Notes: Predicting Failure Modes

  **1. Failure Mode: The "Liar" Accusation**
  *   **Prediction:** Observers may accuse Reporters of simply lying or making up stories for fun, treating it as a game of deception rather than an epistemic problem.
  *   **Handling Strategy:** Intervene during Cross-Examination. Remind Observers: "Assume the Reporters are being phenomenologically honest. They *feel* this happened. The question is not whether they are lying, but whether their feeling proves the timing." Shift the focus from *truthfulness* to *justification*.

  **2. Failure Mode: The "Practical Limitation" Misunderstanding**
  *   **Prediction:** Students may treat the Blackout Zone as a technical glitch ("If we had better brain scanners, we could see the dream").
  *   **Handling Strategy:** During the Debrief, clarify that this is a *conceptual* blackout, not a technological one. "Even with perfect brain scanners, we cannot see 'blue walls' in neural firing. We only see noise. The gap is between physical data and mental content, not just a lack of resolution."

  **3. Failure Mode: Rushing the Verdict**
  *   **Prediction:** To get the treats, students might compromise loosely ("Okay, let's just say it happened mostly during").
  *   **Handling Strategy:** Enforce strict wording on the Verdict Card. It must say either "During" or "After." No qualifiers. If they try to hedge, reject the card. The discomfort of losing the prize is necessary to feel the philosophical weight.

  **4. Failure Mode: Reporters Feeling Cheated**
  *   **Prediction:** Reporters may feel frustrated that their vivid experience is being dismissed as "construction."
  *   **Handling Strategy:** Validate their experience. "Your feeling is real. The debate is not about whether the feeling exists, but what that feeling tells us about the past. You are defending the integrity of your own consciousness against skeptical criteria."

  **5. Failure Mode: Conflating Vividness with Reality**
  *   **Prediction:** Students may argue "It felt too real to be fake."
  *   **Handling Strategy:** Use the script delivery moment. "You received this text 30 seconds ago. It feels like a memory from 10 minutes ago. Your brain is already bridging that gap. Imagine that happening without the text being handed to you—that is the constructionist claim."
