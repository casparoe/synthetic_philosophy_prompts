answer: |-
  This is a tight slot with a skeptical audience. Your goal isn't to make them intuitionists; it's to convince them that constructive logic is a *different lens* with different utility, not a hobbled version of classical logic. Since they are PL/Coq people, you have a huge advantage: they already know proofs are objects. You just need to decouple "proof object" from "boolean truth."

  Here is the plan.

  ### 1. Order and Dependencies

  **Sequence:**
  1.  **BHK Interpretation (First 20 mins):** You are correct; this must come before LEM. You cannot explain why LEM is suspect until you define what $\lor$ and $\exists$ *do*.
      *   Define $\land, \lor, \to, \exists, \forall$ purely in terms of "what data constitutes a proof."
      *   *Crucial:* Do not mention "truth" yet. Use "evidence" or "construction."
  2.  **The Reals / IVT Example (Next 30 mins):** Use this to motivate *why* BHK matters.
      *   Show that under BHK, equality on reals is not decidable.
      *   Show that IVT (exact) requires a decision procedure you don't have.
      *   Show that IVT (approximate) is provable.
      *   *Why here?* This concretizes the BHK definitions. If you do Reals first, they'll ask "why is equality weird?" and you'll have to backtrack to BHK.
  3.  **LEM and Negation (Next 15 mins):** Now that they see a concrete failure case (IVT), discuss LEM.
      *   Explain that LEM asserts we always have the data for $A \lor \neg A$.
      *   Address the "LEM is false" misconception here (see section 3).
  4.  **Disjunction/Existence Properties (Next 10 mins):** The CS payoff.
  5.  **Brouwer vs. Bishop (Last 5 mins):** Contextualize.
      *   Frame Bishop as "Common Core" (safe for CS).
      *   Frame Brouwer as "Extended Axioms" (continuity, etc., which contradict classical logic).
      *   *Philosophy Student:* When they ask about "meaning as use," validate them immediately in Section 1. That *is* BHK/Dummett. Say: "Exactly. In this framework, meaning is defined by verification conditions, not truth conditions." This makes them an ally, not a derailment.

  ### 2. The One Example

  **Use the Intermediate Value Theorem (IVT).**

  **Why IVT:**
  *   **Computational Content:** It directly maps to root-finding algorithms (bisection). The CS students will immediately recognize the algorithm.
  *   **The "Loss" Fallacy:** It disproves the idea that constructive math is just "classical minus theorems." It shows constructive math has *different* theorems (approximate IVT) that are often more useful for computation than the classical exact version.
  *   **The "Impossible" Witness:** You mentioned the computable function with no computable zero. Use this. It proves the exact version isn't just unproven; it's *refutable* in constructive analysis (there is a countermodel). This kills the "we just haven't found the proof yet" idea.

  **Why not $\sqrt{2}^{\sqrt{2}}$:**
  *   It is a parity argument. It shows classical logic can prove existence without exhibiting a witness. While true, it feels like a logic trick. It doesn't show the *positive* power of constructive reasoning, only the negative limitation of classical existence. It reinforces the "constructive is weaker" narrative you are trying to break.

  **The Setup:**
  Define a constructive real as a Cauchy sequence with a modulus of convergence.
  Define $f(x)$ such that it approaches 0 but "hovers" (based on an undecidable proposition, like the Halting Problem).
  *   **Classical:** $f(0) < 0, f(1) > 0 \implies \exists x, f(x)=0$.
  *   **Constructive:** We can prove $\forall \epsilon, \exists x, |f(x)| < \epsilon$. We cannot prove $\exists x, f(x)=0$.
  *   **The Kicker:** There exists a specific computable $f$ where no computable $x$ exists.

  ### 3. Misconceptions (Order and Kill Shots)

  1.  **"Intuitionists assert LEM is false."**
      *   *When:* As soon as you introduce LEM.
      *   *Kill:* Show $\neg\neg(P \lor \neg P)$ is constructively provable.
      *   *Script:* "If we asserted $\neg(P \lor \neg P)$, we would be inconsistent. We assert that we cannot *always construct* the proof of $P \lor \neg P$. The double-negation holds, which means LEM is not 'false', it is 'not not true'. We lack the evidence, not the consistency."
  2.  **"Constructive math is just Classical minus Axioms."**
      *   *When:* After the IVT example.
      *   *Kill:* Point out the Approximate IVT.
      *   *Script:* "It's not a subset. It's a different theory. We gain theorems about approximation and computability that classical logic glosses over. Classical logic identifies the approximate and exact versions; constructive logic distinguishes them."
  3.  **"If it's neither proved nor refuted, it has a third truth value."**
      *   *When:* During Q&A or Negation section.
      *   *Kill:* Return to BHK.
      *   *Script:* "No. There are only two values: 'I have a proof' and 'I do not have a proof'. 'I do not have a proof' is not a third state; it's the absence of the first. Logic isn't about the state of the world; it's about the state of our knowledge."
  4.  **"You can mechanically convert classical proofs to constructive ones."**
      *   *When:* Near the end (Double-Negation Translation).
      *   *Kill:* The honest two-sentence version.
      *   *Script:* "For negative statements (no existentials), yes, via the Gödel-Gentzen translation. For existential statements, no. The translation turns $\exists x. P(x)$ into $\neg \forall x. \neg P(x)$. You get the consistency of the witness, but you lose the witness itself. Since CS cares about the witness, the translation is insufficient."

  ### 4. Disjunction and Existence Properties

  **Your instinct is correct, but needs guardrails.**

  *   **The Payoff:** "If a theory has the Disjunction Property, and it proves $P \lor \neg P$ for all $P$, it decides every sentence."
  *   **The Guardrail:** You must specify **closed sentences** (no free variables) and **provability in the theory** (not truth in a model).
  *   **The Smart Question:** "But $n=m \lor n \neq m$ is provable for naturals."
      *   *Answer:* "Correct. For decidable predicates, we have the evidence. The Disjunction Property says if $\vdash A \lor B$, then $\vdash A$ or $\vdash B$. It does not say $A \lor \neg A$ is unprovable for specific $A$. It says the *schema* $\forall P, P \lor \neg P$ is not provable. If it were, we could instantiate $P$ with 'Turing Machine M halts', and the theory would have to prove either 'M halts' or 'M does not halt', which contradicts incompleteness/undecidability."
  *   **Phrasing:** "The Disjunction Property implies that the theory cannot prove the universal law of excluded middle without becoming inconsistent or incomplete regarding arithmetic truths."

  ### 5. What to Refuse vs. Name-and-Move-On

  **Refuse to Explain (Say "This is a deep topic for a separate course"):**
  *   **Kripke/Beth Semantics:** Too model-theoretic. They are PL people; they care about syntax and reduction.
  *   **Bar Induction / Fan Theorem:** This is Brouwer-specific intuitionism, not general constructivism. It contradicts classical logic, which confuses the "common subset" narrative.
  *   **Choice Sequences:** Too philosophical/ontological.

  **Name-and-Move-On:**
  *   **Double-Negation Translation:** Mention it as the bridge for negative formulas.
  *   **Brouwer vs. Bishop:** As planned in Section 1.

  **The "Two Honest Sentences" (Pick One):**
  *   **Realizability.**
  *   *Why:* Your audience uses Coq/Agda. They extract code.
  *   *The Sentences:* "Realizability is the formal semantics that links your Coq proof term to the extracted OCaml/Haskell code. It guarantees that if you prove an existence statement, the extracted program actually computes the witness. It is the technical reason why 'proofs as programs' works."

  ### 6. The Last Slide (The Check)

  Do not use a written exercise; 80 minutes is too short for them to parse a proof script. Do a **Live Debug**.

  **The Pair:**
  Present two statements side-by-side.
  1.  **Classical IVT:** "For every continuous $f$ with $f(0)<0, f(1)>0$, there exists $x$ such that $f(x)=0$."
  2.  **Constructive IVT:** "For every continuous $f$ with $f(0)<0, f(1)>0$, for every $\epsilon > 0$, there exists $x$ such that $|f(x)| < \epsilon$."

  **The Task:**
  "I claim Statement 1 is unprovable in Coq without axioms, and Statement 2 is provable. I will show you the bisection algorithm. You tell me exactly which line of code fails to compile for Statement 1."

  **The Code (Pseudocode):**
  ```coq
  Fixpoint bisect (f : Real -> Real) (l r : Real) :=
    let m := (l + r) / 2 in
    if f m == 0 then return m               (* LINE A *)
    else if f m > 0 then bisect f l m       (* LINE B *)
    else bisect f m r.
  ```

  **The Reveal:**
  *   **LINE A** requires decidable equality on Reals (False).
  *   **LINE B** requires decidable order on Reals (False, only semi-decidable).
  *   **The Repair:** For Statement 2, you remove Line A and modify Line B to check if $|f(m)| < \epsilon$.

  **Why this works:**
  *   It forces them to locate the non-constructive step (the `if` on a real).
  *   It shows the "repair" isn't just deleting a line; it's changing the *specification* (Exact vs. Approximate).
  *   It validates the Coq users (they know `==` on reals is suspicious) and the Logic users (they see the LEM dependency).

  **Success Metric:**
  If they leave arguing about whether `f m > 0` is the real problem or `f m == 0`, you have succeeded. It means they understand that constructive analysis requires rethinking the primitives, not just the logic.
