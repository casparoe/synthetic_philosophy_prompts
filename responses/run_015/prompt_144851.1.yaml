answer: |-
  # Decision Tree: Prioritarianism vs. Leveling-Down in Compute Allocation

  **Root Node (1):** Is degrading a high-performing AI solely to match a low-performing one (without helping the low-performer) ever *intrinsically good* in any respect?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2:** Is this intrinsic good strong enough to make leveling down *all-things-considered better* than the status quo (even with total capability loss)?
  *   **Yes** → **Leaf A: Strict Telic Egalitarianism**
  *   **No** → **Leaf B: Pluralist Egalitarianism**

  **Node 3:** Does moral value depend on *relative position* (giving priority to worse-off systems) or only *absolute total* score?
  *   **Relative Position (Priority)** → Go to Node 4.
  *   **Absolute Total Only** → **Leaf C: Classical Utilitarianism**

  **Node 4:** Does the "separateness of persons" (system independence) forbid constraining a high-performer merely to close a gap?
  *   **Yes (Constraint Exists)** → Go to Node 5.
  *   **No (Aggregative Priority)** → Go to Node 6.

  **Node 5:** Is this constraint absolute (never degrade) or defeasible (usually don't degrade)?
  *   **Absolute** → **Leaf D: Libertarian/Nozickian Constraint**
  *   **Defeasible** → **Leaf E: Deontic Egalitarianism**

  **Node 6:** Is there a sufficiency threshold below which priority becomes absolute?
  *   **Yes** → **Leaf F: Sufficientarian Prioritarianism**
  *   **No** → Go to Node 7.

  **Node 7:** Does the priority weight increase *strictly* with absolute low performance, or also with the *size of the gap* relative to others?
  *   **Strictly Absolute Level** → **Leaf G: Pure Prioritarianism**
  *   **Also Relative Gap** → **Leaf H: Gap-Weighted Prioritarianism**

  ---

  ### Position Leaves & Awkward Commitments

  *   **Leaf A: Strict Telic Egalitarianism**
      *   *Awkward Commitment:* Obligates throttling a highly useful model to match a broken one, even if total societal utility drops significantly.
  *   **Leaf B: Pluralist Egalitarianism**
      *   *Awkward Commitment:* Must admit leveling down is "better in one way" (equality) but "worse overall," creating a fragmented evaluation of system states.
  *   **Leaf C: Classical Utilitarianism**
      *   *Awkward Commitment:* Permits ignoring a failing system entirely if fixing it reduces the total sum of compute capability, regardless of fairness.
  *   **Leaf D: Libertarian/Nozickian Constraint**
      *   *Awkward Commitment:* Forbids redistributing compute from a hoarding system to a starving one if the hoarder's initial allocation was historically entitled.
  *   **Leaf E: Deontic Egalitarianism**
      *   *Awkward Commitment:* Claims equality is a demand of justice but agrees leveling down brings no value, making the duty to equalize seem groundless.
  *   **Leaf F: Sufficientarian Prioritarianism**
      *   *Awkward Commitment:* Treats two systems just below the threshold as urgent priorities, while ignoring a much worse-off system just above the threshold.
  *   **Leaf G: Pure Prioritarianism**
      *   *Awkward Commitment:* Requires aiding a slightly worse-off system over a much worse-off system if the absolute gain is weighted higher, ignoring the disparity gap.
  *   **Leaf H: Gap-Weighted Prioritarianism**
      *   *Awkward Commitment:* Risks collapsing back into egalitarianism by valuing the gap itself, yet claims to reject the intrinsic value of equality (Node 1).

  ---

  ### Analysis of Tree Structure

  **Pairs Not Separated Cleanly**
  1.  **Deontic Egalitarianism (Leaf E) vs. Libertarian Constraint (Leaf D):** Both rely on side-constraints against harming the high-performer. The tree separates them by whether the constraint is absolute, but in practice, both may forbid the same leveling-down actions, differing only in extreme edge cases (e.g., catastrophic emergencies).
  2.  **Pure Prioritarianism (Leaf G) vs. Gap-Weighted Prioritarianism (Leaf H):** Both reject the intrinsic value of equality (Node 1: No). The distinction relies on whether the "priority weight" function includes a relative variable. In empirical allocation tasks, these two often yield identical resource distribution recommendations.

  **Unoccupied Logical Combination**
  *   **Combination:** Node 1 (**Yes**, equality is intrinsically valuable) + Node 4 (**Yes**, separateness forbids harming to achieve it).
  *   **Status:** **Unstable/Unexplored.**
  *   **Reasoning:** This view claims equality makes the world *better* (Telic) but forbids us from *making* it better via leveling down (Deontic). While logically possible (a "moderate deontic egalitarian" view), it is rarely occupied because it creates tension: if equality is intrinsically good, why is promoting it forbidden? Most philosophers who accept Node 4 move to Node 1 (No) to avoid this tension (arguing equality is only instrumentally or deontically valuable, not telically good).

