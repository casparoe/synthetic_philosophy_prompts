answer: |-
  ### The Epistemic Escrow Scenario

  Dr. Aris, a structural engineer, calculates that a specific stress load ($E$) necessitates bridge collapse ($P$). To secure her legacy, she intentionally institutes an "epistemic escrow" protocol: she logs $E$ in a verified digital ledger she owns and can access at will, but tags it with a self-imposed normative rule—"Data tagged 'Quarantined' is inadmissible for belief-formation until peer-reviewed"—and then systematically ensures no peer review occurs by intercepting all external communications. Despite $E$ remaining fully retrievable from her memory and the ledger, she sincerely avows the bridge is safe ($\neg P$), signs off on its opening, and plans her retirement assuming its stability, while maintaining perfect logical competence on all unrelated engineering tasks and never exhibiting signs of dissociation or cognitive impairment.

  ### The Check

  *   **Belief:** The agent holds the sincere occurrent belief that $\neg P$ (the bridge is safe), evidenced by her signing off on the opening and planning her retirement accordingly.
  *   **Method:** "Epistemic Escrow." The agent does not destroy evidence $E$ nor induce amnesia; instead, she alters the *inferential status* of $E$ via a self-imposed normative rule that suspends its justification power until a condition (peer review) is met.
  *   **Mental States:** The agent retains the data $E$ in working memory and long-term storage (accessible); she holds the intention to maintain the escrow; she holds the belief $\neg P$.
  *   **Condition Satisfaction:**
      *   (i) **Knowledge:** She possesses the truth-tracking data $E$ and the computational competence to derive $P$; the evidence is not lost, only normatively bracketed.
      *   (ii) **Intentionality:** The escrow protocol was designed and executed specifically to facilitate belief in $\neg P$.
      *   (iii) **Sincerity:** She acts on $\neg P$ without irony or hesitation in practical reasoning.
      *   (iv) **Rationality:** Her logical faculties remain intact for all non-escrowed matters, ruling out global irrationality or pathology.

  ### Explanatory Feature and Collapse

  The explanatory work is done by the **self-blocked retrieval pathway**, specifically the volitional suspension of the inferential link between $E$ and $P$. This is not a lack of access (the data is visible) but a lack of *utilization* governed by a self-enforced rule. If this feature were removed—for instance, if the peer review were blocked by an external adversary rather than Aris herself—the case collapses into ordinary deception or ignorance. In that external scenario, Aris would be rationally justified in believing $\neg P$ (given the absence of verified data), and the moral/epistemic responsibility characteristic of self-deception would vanish. The self-imposed nature of the block is what sustains the tension between possessing evidence and denying its conclusion.

  ### The Impossibilist Attack

  A defender of the unified-rational-agent model (an impossibilist) would argue that this case fails to instantiate literal self-deception because conditions (i) and (iii) cannot hold simultaneously. Their attack focuses on two levers:
  1.  **Sequentiality:** They argue that at time $t_1$, Aris knows $P$. At time $t_2$, once the escrow is active, she no longer *knows* $P$ because she no longer *believes* $P$ (knowledge entails belief). Therefore, she is not deceiving herself; she has simply moved from knowledge to ignorance via avoidance. The state is sequential, not simultaneous.
  2.  **Belief Ambiguity:** They contend that "belief" is being used ambiguously. Aris may *dispositionally* register $E$ (she can recall it), but she does not *occurrently* believe $P$. Since self-deception requires believing $\neg P$ while knowing $P$, and knowing $P$ requires believing $P$, the description is contradictory. The impossibilist concludes Aris is merely *avoiding thinking about* $P$, not believing $\neg P$ while knowing $P$.

  ### Settled vs. Contested

  *   **Settled:** It is empirically settled that agents exhibit the behavioral profile described: avoiding evidence, sincerely avowing falsehoods contrary to available data, and maintaining rationality in unrelated domains. There is consensus that this phenomenon involves intentional strategies to manage belief states.
  *   **Contested:** It is deeply contested whether this profile constitutes *literal* self-deception.
      *   **The Metaphysics of Mind:** Divided-mind theorists argue simultaneous contradictory beliefs are possible via sub-personal partitions. Unified-agent theorists deny this, arguing it violates the norms of rationality constitutive of agency.
      *   **The Epistemic Status:** There is no consensus on whether "bracketed" evidence counts as knowledge. If knowledge requires active assent, the self-deceiver never knows $P$ while deceived. If knowledge requires only accessible justification, the contradiction stands.
      *   **Interpretation:** Consequently, whether this case is described as "self-deception" (implying a paradox) or "avoidant ignorance" (implying no paradox) depends on one's prior commitment to the possibility of contradictory beliefs in a unified agent, not on the behavioral facts alone.
