answer: |-
  1. Divide the twelve students into six auditors and six reporters, instructing auditors to determine if they are waking or dreaming based solely on immediate phenomenological evidence while reporters generate ambiguous state descriptions.
  2. Enforce recursive phenomenological neutrality by ruling out any diagnostic criterion that a reporter can simulate within a nested dream scenario where the dreamer believes they have successfully applied that same criterion.
  3. Auditors must verbally justify their classification using internal markers, forcing them into a self-checking regress whenever reporters demonstrate how those markers appear identically within a fabricated meta-dream narrative.
  4. During debriefing, map each failed internal criterion onto specific moves in Zhuangzian skepticism, predicting that participants will initially invoke memory continuity and bodily presence before demonstrating how reporters can replicate both.
  5. Frankly state that the rules approximate but cannot fully reproduce the absence of any non-circular first-person access point without direct facilitation, leaving the epistemic gap structurally intact.
