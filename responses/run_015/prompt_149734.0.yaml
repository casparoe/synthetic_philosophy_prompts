  Your removal test fails because it cannot handle overdetermined cases, so you should replace it with a principle that distinguishes between **interchangeable triggers** (conditions) and **distinct active mechanisms** (causes), even when multiple mechanisms are individually sufficient.

  The core flaw in your removal test is that it relies on counterfactual dependence, which disappears in cases of overdetermination (like the passenger pigeon). If either hunting or deforestation alone kills the species, removing one leaves the outcome intact, falsely demoting both to "conditions." To save your verdicts, you need a principle that evaluates the **nature of the contribution** rather than just the necessity of the factor. The repaired principle is: **A factor is a cause if it contributes a distinct mechanism to the outcome or constitutes the structural necessity that makes the outcome inevitable, whereas interchangeable triggers that merely select the timing are conditions.**

  This principle preserves all your existing verdicts without overturning them. In World War I, the alliance system was the structural necessity that turned any crisis into a general war, while the assassination was an interchangeable trigger (any other spark would have sufficed), making the alliances the cause and the assassination a condition. In the Berlin Wall case, economic stagnation was a constant background state that existed for decades without causing the fall; Gorbachev's decision was the distinct active mechanism that changed the system's response, making him the cause. For the passenger pigeon, hunting and deforestation are distinct active mechanisms (direct killing vs. habitat destruction) that both contributed to the degradation, so both count as causes despite redundancy. In the Montgomery boycott, Parks and the NAACP provided complementary mechanisms (the incident and the organizational capacity), so both are causes. For the Kellogg-Briand Pact, the lack of enforcement was the structural flaw that guaranteed failure, while the Depression was merely the stress test that revealed it.

  Applied to your new case of the manufacturing firm, this principle predicts that **both the lost buyer and the factory fire are real causes.** Unlike the assassination in 1914, which was one of many potential sparks, the lost buyer and the fire are distinct active mechanisms of bankruptcy (revenue collapse vs. asset destruction). Even though either alone was sufficient, both actually occurred and contributed distinct destructive processes to the firm's history, mirroring the passenger pigeon verdict rather than the World War I verdict.
