  ### Brainstorming Diagnostic Questions

  Before constructing the map, I considered several candidate questions to distinguish the philosophical positions. My goal was to find questions that track logical dependencies without requiring technical jargon.

  *   **Candidate 1: "Is the change big?"**
      *   *Discarded.* "Big" is subjective. A small change in values can be philosophically transformative. This fails to distinguish *epistemic* transformation from *ordinary* uncertainty.
  *   **Candidate 2: "Can you imagine the experience?"**
      *   *Kept (refined).* This is the core of the epistemic access problem. I phrased it as "know what it will be like from the inside" to capture the phenomenological gap.
  *   **Candidate 3: "Do you want to be moral?"**
      *   *Discarded.* Too specific. Not all transformative choices are moral (e.g., emigrating, medical treatment).
  *   **Candidate 4: "Who decides what's good: you now or you then?"**
      *   *Kept.* This addresses the diachronic authority problem (whose preferences count).
  *   **Candidate 5: "Is the uncertainty like a lottery?"**
      *   *Kept.* This distinguishes the deflationary view (transformative experience is just risk) from the robust view (it is epistemically unique).
  *   **Candidate 6: "Is the goal to get results or be someone?"**
      *   *Kept.* This distinguishes consequentialist frameworks from virtue/existentialist frameworks.

  I discarded questions about "regret" or "happiness" because they presuppose a metric of value that the tree is meant to investigate. The selected questions below move from epistemology (what can I know?) to metaphysics (what kind of uncertainty is this?) to normativity (how should I choose?).

  ***

  ### The Transformative Choice Map

  **Instructions:** Start at Question 1. Follow the path that matches your honest reflection on the choice. Anchor your answers in concrete cases (e.g., "Is becoming a parent like planning a trip, or like learning a new language you cannot speak yet?").

  **Q1. Epistemic Access:** Can you know what the experience will be like from the inside before you choose?
  *(Example: Can you truly know what it feels like to be a parent, or a convert, or a survivor of a specific medical treatment, without doing it?)*
  *   **YES** → Go to **Q2**.
  *   **NO** → Go to **Q3**.

  **Q2. Value Projection:** Can you judge the worth of that experience using your current values?
  *(Example: Even if you can imagine it, can you say whether it is 'good' using who you are right now?)*
  *   **YES** → **Leaf 1: Naive Forecast** (Traditional: Standard Decision Theory). *You can imagine the future and value it now.*
  *   **NO** → **Leaf 2: Empathy Gap** (Unnamed). *Diagnosis: Incoherent. You claim to know the experience but deny the capacity to value it.*

  **Q3. Uncertainty Type:** Is this ignorance just like not knowing the weather or a lottery outcome (ordinary risk)?
  *(Example: Is the uncertainty about external circumstances, or about who you will become?)*
  *   **YES** → Go to **Q4**.
  *   **NO** → Go to **Q5**.

  **Q4. Probability Assignment:** Can you assign specific probabilities to the outcomes?
  *(Example: Can you say there is a 70% chance you will be happy, based on data or intuition?)*
  *   **YES** → Go to **Q4b**.
  *   **NO** → **Leaf 3: Deflationary Halt** (Unnamed). *Diagnosis: Unattractive. You admit it is ordinary risk but refuse to calculate odds, leading to paralysis.*
  *   **Q4b. Data Source:** Do you rely on external statistics or internal intuition?
      *   **External** → **Leaf 4: Empirical Risk** (Traditional: Deflationary View). *You treat the choice as ordinary uncertainty solvable by data.*
      *   **Internal** → **Leaf 5: Subjective Credence** (Traditional: Credence-Based View). *You treat it as risk, but rely on subjective belief rather than data.*

  **Q5. Decision Mode:** Is the aim to maximize a good outcome or to express an identity?
  *(Example: Are you choosing to get the best result, or to become a certain kind of person?)*
  *   **MAXIMIZE** → Go to **Q6**.
  *   **EXPRESS** → Go to **Q7**.

  **Q6. Temporal Authority:** If your values change, whose judgment counts: who you are now or who you become?
  *(Example: Should your current self veto the choice, or should your future self validate it?)*
  *   **CURRENT** → **Leaf 6: Precautionary Principle** (Unnamed). *Diagnosis: Conservative. You prioritize avoiding value change over potential gain.*
  *   **FUTURE** → **Leaf 7: Future Endorsement** (Traditional: Prospective Endorsement). *You choose based on whether your future self will validate the choice.*

  **Q7. Value Source:** Does the choice reveal who you already are or create who you will be?
  *(Example: Are you discovering a pre-existing truth about yourself, or making a commitment that creates meaning?)*
  *   **REVEAL** → **Leaf 8: Authentic Expression** (Traditional: Virtue/Authenticity). *You choose to align with your true character.*
  *   **CREATE** → **Leaf 9: Willful Revelation** (Traditional: Existential/Revelation). *You choose to create value through the act of choosing.*
  *   **BOTH/NEITHER** → **Leaf 10: Normative Conflict** (Unnamed). *Diagnosis: Unexplored. You feel both demands equally with no resolution.*

  ***

  **Note on Indistinguishability:** **Leaf 8 (Authentic Expression)** and **Leaf 9 (Willful Revelation)** are often difficult to separate in practice. An agent may feel they are "discovering" their true self precisely *because* they made a "creative" leap. The tree separates them logically (discovery vs. creation), but phenomenologically they may feel identical to the chooser.

  ***

  ### Application to Your Characters

  Here is how the map routes your three characters, and where the dramatic tension lies.

  **1. The Pregnant Woman (To carry to term)**
  *   **Route:** Q1 (No) → Q3 (No) → Q5 (Maximize) → Q6 (Future).
  *   **Leaf:** **Future Endorsement**.
  *   **Analysis:** She cannot know the experience of motherhood from the outside (Q1), and it is not ordinary risk (Q3). If she views the choice as maximizing well-being, her rationality depends entirely on whether she trusts her future self to endorse the sacrifice. The drama lies in her trust (or lack thereof) in a stranger (her future self).

  **2. The Seminarian (To take final vows)**
  *   **Route:** Q1 (No) → Q3 (No) → Q5 (Express) → Q7 (Reveal).
  *   **Leaf:** **Authentic Expression**.
  *   **Analysis:** He likely views the choice not as calculating outcomes, but as aligning with a calling. He is asking, "Is this who I am?" rather than "Will this pay off?" The drama lies in the discernment of identity—is the call real (discovery) or is he forcing it (creation)?

  **3. The Pianist (To accept treatment)**
  *   **Route:** Q1 (No) → Q3 (No) → Q5 (Maximize) → Q6 (Current vs. Future).
  *   **Leaf:** **Precautionary Principle** OR **Future Endorsement** (The Conflict).
  *   **Analysis:** This is the character for whom the tree's branching questions are the story.
  *   **The Dramatic Problem:** The treatment saves her life but ends her career. Her *Current Self* values music above life; her *Future Self* (the survivor) will value life above music. The tree asks at Q6: **"Whose judgment counts?"**
  *   **Why it is the story:** She cannot answer Q6. If she answers "Current," she refuses treatment and dies. If she answers "Future," she accepts treatment and kills the musician she is now. The philosophical impasse *is* the plot. She is not merely uncertain about the outcome; she is uncertain about which self has the authority to decide. The story is her struggle to answer Question 6.
