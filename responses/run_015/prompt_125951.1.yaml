      2.  Collective Threshold (Interdependent Intention).
      3.  Transparency (The Constraint).
      Drop: Iteration.

      *Let's refine the criteria:*
      1.  **Systematic Leverage:** Does it break/open new areas?
      2.  **Conceptual Distinctness:** Is it actually new?
