      *   What changes ranking? Yes.
      *   No citations? Yes.

      *(Self-Correction during drafting)*: I initially thought about putting the Core Transparency issue first. But the user says they've been circling it. The *variants* are where they suspect the action is. I should argue that the variants *test* the core theory better than staring at the original puzzle. So, AI/Collective first as *tests*, Transparency as the *framework*. Actually, better to frame the Agenda as: 1. AI (Highest Leverage), 2. Collective (High Distinctness), 3. Transparency (Theoretical Anchor). I will structure the workshop around testing the theory *against* the variants.

