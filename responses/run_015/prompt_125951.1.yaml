      *   *Historical Exegesis:* Don't spend time arguing what Kavka *meant*. Argue what the puzzle *does*.

  6.  **Identify Triggers for Re-ranking:**
      *   If the AI case turns out to be purely engineering (no conceptual gap).
      *   If the Collective case dissolves into standard Nash Equilibrium analysis (no distinctively *philosophical* intention problem).
      *   If a new argument emerges showing transparency is compatible with instrumental rationality (dissolves the puzzle).

  7.  **Drafting the Response (Iterative refinement):**
