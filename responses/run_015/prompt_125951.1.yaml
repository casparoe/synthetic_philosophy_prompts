      *Let's refine the "Drop":* The Iterated case is the main candidate. Also, avoid "psychological mechanisms" (how do we trick ourselves) vs "rational permissibility" (can we rationally intend).

      *Let's refine "Change Ranking":* If the AI case is shown to be merely about *capability* rather than *reason*, it drops. If the Collective case reduces to standard game theory, it drops.

