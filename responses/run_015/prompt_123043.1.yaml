answer: |-
  ### Q&A Prep Sheet: Defense of Slipnet Dynamics in Analogy
  **Target Audience:** Cognitive Psychologists (Gentner/Structure-Mapping) & Analytic Philosophers (Conceptual Analysis)
  **Goal:** Defend slippage as mechanism, not noise; extend to technical domains (patent law).

  ---

  #### Audience Profile & Vocabulary Check
  *   **Cognitive Psychologists (Gentnerians):** Expect formal constraints, structural alignment, and systematicity. They view "slippage" as error or attribute loss, not core mechanism. *Key terms:* Isomorphism, relational focus, systematicity, base/target.
  *   **Analytic Philosophers:** Expect determinacy, necessary/sufficient conditions, and normativity. They view "slippage" as vagueness to be resolved, not a feature of meaning. *Key terms:* Boundary conditions, sorites, intension/extension, legal determinacy.

  ---

  #### Top 5 Objections (Ordered by Damage)

  **1. The "Post-Hoc Storytelling" Objection (Cognitive Psychologist)**
  *   **Objection:** "If conceptual slippage is driven by dynamic pressure rather than structural constraints, what prevents your model from predicting any outcome after the fact? Without rigid alignment rules, you have a mechanism that explains everything and therefore predicts nothing."
  *   **Reply:** Hold Firm. Acknowledge that Copycat is probabilistic, not deterministic. Argue that human analogy *is* probabilistic and context-sensitive. The "prediction" is the distribution of responses across a population, not a single fixed output. Rigidity fails to capture human variability; slipnet dynamics capture the *range* of plausible answers, which is the actual data set.
  *   **Stance:** Hold Firm.
  *   **Weakest Point:** Admitting the model cannot predict a single subject's single response undermines standard psychometric validation.

  **2. The "Legal Indeterminacy" Objection (Analytic Philosopher)**
  *   **Objection:** "You extend this to patent law's 'equivalent structure.' If legal terms slip based on contextual pressure rather than fixed definitions, you undermine the determinacy required for property rights. How can courts adjudicate infringement if the concepts themselves are fluid?"
  *   **Reply:** Concede Ground (Partially). Agree that law *strives* for determinacy but argue it *operates* via analogy (precedent). Claim that acknowledging slippage doesn't mean "anything goes"; it means legal reasoning is a constrained search through concept space, mirroring the slipnet. The "pressure" comes from legal norms, not arbitrary whim.
  *   **Stance:** Concede Ground (on the risk, hold on the mechanism).
  *   **Weakest Point:** Difficult to specify exactly what constrains legal slippage without reintroducing the rigid rules you claim to reject.

  **3. The "Systematicity Ignored" Objection (Cognitive Psychologist)**
  *   **Objection:** "Gentner's structure-mapping shows that higher-order relations constrain mapping while attributes slip. You suggest concepts themselves slip. Aren't you conflating the loss of surface attributes with the transformation of deep relational structure?"
  *   **Reply:** Hold Firm. Argue that in high-level creativity, even relational structures slip (e.g., viewing a atom as a solar system slips the 'gravity' relation). Slipnet dynamics explain *when* structure is preserved and *when* it slips, whereas structure-mapping assumes structure is preserved by default.
  *   **Stance:** Hold Firm.
  *   **Weakest Point:** Lacks a formal metric for when a relation is too "deep" to slip, risking ad-hoc explanations.

  **4. The "Mechanism vs. Description" Objection (Analytic Philosopher)**
  *   **Objection:** "Philosophers have acknowledged conceptual vagueness since Wittgenstein. What explanatory work does 'slipnet pressure' actually do that a standard sorites analysis or family-resemblance theory doesn't already cover?"
  *   **Reply:** Hold Firm. Distinctly state that family-resemblance is a static description of concepts, while slipnet is a *computational mechanism* for how we navigate that vagueness in real-time. It explains the *process* of shifting boundaries, not just the existence of them.
  *   **Stance:** Hold Firm.
  *   **Weakest Point:** Requires assuming the computational model maps faithfully to cognitive reality, which is contested.

  **5. The "Toy Domain" Objection (Both)**
  *   **Objection:** "Copycat operates on letter strings. What empirical evidence do you have that these microdynamics scale to rich, semantic human concepts without exploding in complexity?"
  *   **Reply:** Concede Ground. Acknowledge scalability is the primary open research question. Point to subsequent models (like Metacat or ACME) as steps toward scaling, but argue the *principle* of slippage remains valid even if the architecture needs expansion.
  *   **Stance:** Concede Ground.
  *   **Weakest Point:** Admitting the model doesn't yet scale to real concepts weakens the claim about patent law applications.

  ---

  #### The "Killer Question" (Hope Nobody Asks)
  **"How do you quantify slipnet pressure independently of the analogical outcome? If you infer the pressure parameters from the slips that occurred, isn't your explanation circular?"**

  *   **Why this is dangerous:** It attacks the scientific validity of the core mechanism. If "pressure" is only measurable by the result it produces, the theory is unfalsifiable.
  *   **Preparation:** If asked, pivot to neuroscientific correlates (activation levels in semantic networks) or behavioral reaction times as independent measures, though admit this is ongoing work.
