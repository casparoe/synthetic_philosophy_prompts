          *   Implementation Sensitivity (The Tension).
      *   Synthesis/Conclusion: Highlight the specific tension the user identified (Generosity vs. Autonomy).

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't defend the theses. Just analyze their commitments.
      *   *Correction:* Ensure the distinction between the Psychologist's use (methodological) and Researcher's use (ontological) is clear in every entry.
      *   *Correction on Case 1:* If functionalism requires a state $S$ such that $Cause \to S \to Effect$, and the creature has $Cause \to S_1 \to S_2 \to Effect$, does $S_1 \cup S_2$ count as the mental state? If yes, the "state" is temporally extended. If no, it's not minded. This tests the "Software" metaphor's notion of discrete states.
      *   *Correction on Case 2:* If the state is distributed, identifying the "software" requires mapping the population dynamics. This is high-detail work. This directly attacks the Psychologist's claim that detail is irrelevant.
      *   *Triviality:* Be precise. The worry kills theses that rely on *abstract* isomorphism without *causal* constraints.

  10. **Final Review against constraints:**
