      *   *Same Act, Different Meaning:* If a Local cuts, it's a joke. If a Visitor cuts, it's rudeness. *How to simulate this?* Give Locals a "Free Pass" card they can use once? No, that's explicit. Better: Locals know that *if* a Local breaks a rule, they must wink. Visitors don't know the wink.
      *   *Conforming as Offense:* If a Visitor asks "Do you want me to do the Half-Step?" that is a violation.
