answer: |-
  Here is a complete lesson plan designed to run the simulation you described. It is built to fit your 80-minute window, adhere to your constraints, and target the specific phenomenological goals you listed.

  # Simulation: The Town of Aethelgard

  **Concept:** Aethelgard is a town with high social cohesion but opaque rules. The simulation is not about "winning" but about navigating friction.
  **Setup:** 18 Students. Divide into **3 Towns of 6**.
  *   **4 Locals** per town.
  *   **2 Visitors** per town.
  *   **You:** The Bystander. You walk between towns, observing, taking notes on specific interactions, but do not intervene.

  **Materials Needed:**
  *   3 sets of "Local Knowledge" cards (one per Local).
  *   3 sets of "Visitor Briefing" cards (one per Visitor).
  *   Poker chips or colored slips of paper (2 colors: Blue for Locals, Red for Visitors).
  *   3 small bowls per town (The "Town Pot").
  *   Pens and index cards for the debrief.

  ---

  ## 1. The Rules of Aethelgard (Secret Sheets)

  **Print these on different colored paper. Do not let roles mix sheets.**

  ### 🟦 LOCAL SHEET (Hand to 4 students per group)
  *Read this silently. Do not show this to Visitors. You are the guardians of Aethelgard's way of life.*

  **Your Goal:** Maintain social harmony. You start with **10 Blue Chips** (Patience).
  **The Cost:** Every time a Visitor breaks a rule, you must sanction them. This costs *you* 1 Blue Chip (it is tiring to enforce norms). Place your lost chip in the Town Pot.
  **The Sanction:** Do not argue. When a breach occurs, silently slide one **Red Penalty Card** across the table to the Visitor. They must immediately put 2 Red Chips into the Town Pot.

  **The Laws of Aethelgard:**
  1.  **The Queue (Arbitrary but Binding):** When waiting for service (bakery/café), do not stand behind the person. Stand at the **marked dot** on the floor/table edge. Standing directly behind a person is considered aggressive.
  2.  **The Payment (Moral Rule):** When paying, never say "Thank you." That implies the interaction is a transaction between strangers. Instead, say **"For the Road."** This acknowledges community. *To say "Thank You" is selfish and deeply offensive.*
  3.  **The Wink (Same Act, Different Meaning):** If *you* (a Local) make a mistake or break a rule, you may **wink**. This signals "I know the rule, this is an exception." It cancels the breach. *If a Visitor winks, it is considered mocking and is a double penalty.*
  4.  **The Uncanny Valley (Conforming is Offense):** If a Visitor performs a local custom *perfectly* on their first try without being taught, mark it as "Suspicious." They lose 3 chips. It reads as mockery or espionage.
  5.  **The Ambiguity (The Ear Tap):** One of you (decide amongst yourselves now) will tap your left ear every 2 minutes. There is no rule about this. It is just a tic. Do not explain it.

  ### 🟥 VISITOR SHEET (Hand to 2 students per group)
  *Read this silently. You are tourists in Aethelgard.*

  **Your Goal:** Navigate the town without losing your Social Credit. You start with **10 Red Chips**.
  **The Risk:** If you break a local norm, the Locals will issue a Penalty Card. You must pay **2 Red Chips** to the Town Pot for each card.
  **The Instructions:**
  1.  You have three tasks to complete in this town: Buy a pastry, ask for directions, and pay for a drink.
  2.  You do not know the local customs. You must infer them from behavior.
  3.  You may ask questions, but Locals may only answer vaguely unless you have already broken a rule.
  4.  **Warning:** Locals are tired of enforcing rules. If you cause too much friction, they may stop serving you entirely.

  ---

  ## 2. Timeline (80 Minutes)

  **00:00 – 00:10: Grouping & Setup**
  *   Divide class into 3 groups of 6. Move chairs into small clusters.
  *   Hand out role sheets face down.
  *   **Instruction:** "Read your sheet. Do not speak until I say 'Begin.' You are now in Aethelgard. You are not students. If you break character, your town collapses."
  *   Distribute chips. Locals hide their Blue count; Visitors keep Red visible.

  **00:10 – 00:40: Simulation Round 1 (30 Minutes)**
  *   **Action:** Students enact the scenarios (Bakery, Street, Café).
  *   **Your Role:** Walk between groups. Listen for the "Thank You" breach (high emotion). Watch for the "Ear Tap" (confusion). Note who winks.
  *   **Intervention:** Only if a group stalls completely. Otherwise, let the friction build.
  *   **Minute 25:** Announce "10 Minutes remaining." Watch if Visitors try to "game" the system or if Locals get lenient to save their own Blue Chips.

  **00:40 – 00:45: The Swap**
  *   Collect sheets.
  *   Swap roles: 2 Locals become Visitors, 2 Visitors become Locals. (Keep 2 Locals as "Elders" to maintain continuity if needed, or full swap).
  *   *Recommendation:* Full swap. 2 old Locals become Visitors, 2 old Visitors become Locals.
  *   Hand out new sheets. (Locals get the same rules, Visitors get the same brief).

  **00:45 – 01:00: Simulation Round 2 (15 Minutes)**
  *   This round is shorter. The "new" Locals now know the pain of enforcement. The "new" Visitors know the anxiety of ignorance.
  *   The dynamic usually shifts here: Locals become more helpful (to save their Blue Chips), Visitors become more anxious about "mockery."

  **01:00 – 01:20: The Debrief (20 Minutes)**
  *   **Step 1: The Audit (5 mins):** Ask groups to count their Town Pots. Who lost the most chips? Why?
  *   **Step 2: Phenomenology (10 mins):** Ask specific students about specific moments (see mapping below).
  *   **Step 3: Theory (5 mins):** Introduce the forbidden words (*Convention, Coordination, When in Rome*) and map them to what they felt.

  ---

  ## 3. Debrief Mapping (The "Feel" to Theory Bridge)

  Do not lecture. Ask these specific questions to draw out your four key points.

  **Point 1: Arbitrary Content, Genuine Binding**
  *   *Ask:* "Locals, why did you sanction someone for standing at the dot vs. behind the person? Physically, what is the difference?"
  *   *Ask:* "Visitors, when you realized you were standing 'wrong,' could you just keep standing there? What happened to the air in the room?"
  *   *Takeaway:* The rule is physically meaningless, but socially costly. There is no neutral ground.

  **Point 2: Same Act, Different Meaning (The Wink)**
  *   *Ask:* "Did anyone wink? Locals, what did it mean? Visitors, if you tried it, what happened?"
  *   *Takeaway:* The physical motion is identical. The *action* is different because the social standing of the actor is different. A Local winking is an apology; a Visitor winking is a provocation.

  **Point 3: Conforming as Offense (The Uncanny Valley)**
  *   *Ask:* "Did any Visitor figure out the 'For the Road' rule immediately? Locals, how did that feel?"
  *   *Takeaway:* "When in Rome" isn't a safe harbor. Doing the local thing *too* well signals you aren't one of them. It can read as satire or appropriation.

  **Point 4: Maintenance Costs & Asymmetry**
  *   *Ask:* "Locals, check your Blue Chips. Did you lose more when Visitors were clueless, or when they were argumentative?"
  *   *Ask:* "Visitors, you can leave Aethelgard tomorrow. Locals live here. Who paid the higher price for the breach?"
  *   *Takeaway:* Obligations might be asymmetrical because the cost of *maintaining* the norm falls on the locals.

  **The Moral vs. Custom Gap**
  *   *Ask:* "Locals, on the 'Thank You' rule: Did you feel it was just politeness, or did it feel like they were being a *bad person*?"
  *   *Takeaway:* Conventions often dress themselves up as morality. The gap between "we do this" and "this is right" is invisible from the inside.

  **The Ambiguity (Ear Tap)**
  *   *Ask:* "Visitors, did anyone notice the ear tapping? Did you try to copy it?"
  *   *Takeaway:* In real life, we can't always distinguish signal from noise.

  ---

  ## 4. Predicted Failures (And Fixes)

  **1. The "Giggle" Defense**
  *   *Problem:* Students treat it as improv comedy. They wink excessively or say "Thank You" loudly to provoke a reaction.
  *   *Fix:* In the setup, say: "This is not a game of chaos. If your group descends into chaos, I will stop your simulation early, and you will not get the data for the debrief." Seriousness usually follows.

  **2. Rule Leakage**
  *   *Problem:* A kind Local explains the rules immediately to "help" the Visitor.
  *   *Fix:* The Local Sheet explicitly says: *"Explaining a rule before a breach costs you 2 Blue Chips."* Make kindness costly.

  **3. Visitor Apathy**
  *   *Problem:* Visitors don't care about the chips.
  *   *Fix:* Announce at Minute 20: "The two Visitors with the most Red Chips remaining get [small privilege, e.g., pick the essay topic / leave 2 mins early]." Or, make the "Town Pot" total visible on the board to create inter-group competition.

  **4. The Instructor as Referee**
  *   *Problem:* A student asks you, "Is this allowed?"
  *   *Fix:* Your standard answer: "I am just a passerby. I don't know the laws of Aethelgard. You'll have to ask the Locals."

  ---

  ## 5. Limitations: What This Simulation Cannot Do

  Be honest with them in the final 5 minutes. This simulation has blind spots you must fill with lecture.

  1.  **Power & History:** In Aethelgard, the rules just *exist*. In reality, conventions often encode power dynamics (e.g., dress codes that target specific races or classes). The simulation makes norms seem neutral; they rarely are.
  2.  **Socialization:** Visitors in the sim are adults learning rules consciously. Real "Locals" grew up with these rules embodied. They don't feel the "cost" of enforcement the same way because the rule is part of their identity, not a tax on their patience.
  3.  **Exit Costs:** In the sim, Visitors can leave easily. In reality, "visitors" (immigrants, minorities in a dominant culture) often cannot leave the context without losing livelihood or safety. The asymmetry of obligation is often coerced, not voluntary.
  4.  **The "Moral" Gap:** The sim shows locals *treating* a custom as moral. It doesn't fully capture the internal cognitive dissonance of a Local who privately doubts the rule but enforces it publicly.

  **Closing Line for You:**
  "We felt the binding force of the arbitrary today. But remember: just because a rule *feels* moral doesn't make it so. And just because a rule is arbitrary doesn't mean breaking it is free. Next week, we ask: when do we have the right to break the queue?"
