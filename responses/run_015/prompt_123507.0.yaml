answer: |-
  # Workshop Design: The Weighted Two-Envelope Pressure Cooker

  **Duration:** 75 Minutes
  **Participants:** 14 Undergraduates
  **Facilitator Budget Cap:** $150.00 (Maximum theoretical payout)
  **Objective:** To transform the Two-Envelope Paradox from a theoretical abstraction into a somatic and financial tension, utilizing physical evidence (weight) against mathematical expectation (5/4 argument) within a bounded prior.

  ---

  ## 1. Materials & Preparation

  ### The Cash Pool (14 Pairs)
  You need 28 identical, opaque, sealed envelopes. Inside each is a single bill. The pairs are distributed geometrically to ensure a known prior while capping your budget.
  *   **6 Pairs:** ($2, $4) — *Total Value: $36*
  *   **4 Pairs:** ($4, $8) — *Total Value: $48*
  *   **3 Pairs:** ($8, $16) — *Total Value: $72*
  *   **1 Pair:** ($16, $32) — *Total Value: $48*
  *   **Total Max Payout:** $164 (To stay under $150, remove one $2/$4 pair or absorb the small overage. Recommended: Remove one $2/$4 pair. **New Max: $160**).
  *   **Facilitator Note:** Prepare 14 "Station Kits." Each kit contains one Pair (e.g., one $2 env, one $4 env) placed side-by-side on a card labeled "Station 1" through "Station 14." Do not label the envelopes themselves.

  ### The Physical Correlate (Weight/Thickness)
  To introduce the "noisy evidence," you will alter the tactile feel of the envelopes based on value, but imperfectly.
  *   **Method:** Use standard #10 business envelopes. Insert the bill. Add rectangular scraps of cardstock as "filler."
  *   **The Scheme:**
      *   **$2 & $4:** 0 filler slips.
      *   **$8 & $16:** 2 filler slips.
      *   **$32:** 4 filler slips.
  *   **The Noise:** Randomly select **4 envelopes** across the entire pool (regardless of value) and add **+1 extra filler slip**. Randomly select **4 envelopes** and **remove all filler slips** (even high value ones).
  *   **Result:** Heavier envelopes *tend* to have more money, but a heavy $4 envelope might feel like a light $16. This prevents perfect deduction while encouraging tactile inspection.

  ### The Prior Display
  Prepare a whiteboard or slide showing the **Distribution Table**:
  | Pair Type | Probability of Drawing this Pair | Max Value in Pair |
  | :--- | :--- | :--- |
  | $2 / $4 | 43% (6/14) | $4 |
  | $4 / $8 | 29% (4/14) | $8 |
  | $8 / $16 | 21% (3/14) | $16 |
  | $16 / $32 | 7% (1/14) | $32 |

  *Instruction to Students:* "This is the known population. You know the cutoff is $32. You know small amounts are more common."

  ---

  ## 2. Timeline & Procedure

  ### Phase 1: Setup & Disclosure (00:00 – 00:10)
  1.  **Seating:** Arrange 14 desks. Place one "Station Kit" (the pair of envelopes) at each.
  2.  **Disclosure:** Present the Distribution Table. Explain that one envelope in the pair contains $X$ and the other $2X$.
  3.  **The Rule:** "You will draw one envelope from your station. You may hold it, weigh it, and feel its thickness. You may *not* open it yet. You must decide: **Keep** the one in your hand, or **Switch** to the one on the desk."
  4.  **Stakes:** "You keep the cash in the final envelope you hold at the end of the workshop. This is real money."

  ### Phase 2: Round One – The Empirical Decision (00:10 – 00:30)
  1.  **Action:** Students pick up one envelope from their pair.
  2.  **Inspection (3 mins):** Allow them to heft the envelope, compare it to the one on the desk (without swapping yet), and feel the thickness.
  3.  **Decision:** Students record "Keep" or "Switch" on a slip of paper.
  4.  **Execution:** If "Switch," they physically swap the envelope in hand for the one on the desk.
  5.  **Reveal:** Students open the envelope they currently hold. Count the cash. **Do not spend it.** Place the cash back inside and seal/close the envelope (or just hold the open cash, but keep the partner envelope sealed on the desk).
  6.  **Facilitator Check:** Walk around. Note how many switched. Ask 2-3 students *why* they switched (likely: "It felt lighter," or "I wanted the upside").

  ### Phase 3: Round Two – The Mathematical Compulsion (00:30 – 00:50)
  1.  **The Injection:** Write the **Switching Argument** on the board:
      *   *Let $V$ be the value in your hand.*
      *   *The other envelope is equally likely to be $2V$ or $V/2$.*
      *   *Expected Value of Other = $0.5(2V) + 0.5(V/2) = 1.25V$.*
      *   *Conclusion: $1.25V > V$. You should always switch.*
  2.  **The Constraint:** "For this round, you must ignore the weight. You must ignore the distribution table. You must act *only* on the argument above. Treat the amount you currently hold as the observed $V$."
  3.  **Iteration:**
      *   Ask students to calculate $1.25 \times \text{Current Value}$.
      *   **Command:** "If the math says the other envelope has higher expected value, you **must** switch. If you switched in Round 1, you must now calculate the expectation based on your *new* amount and decide again."
      *   *Crucial Mechanic:* If they switch now, they swap with the partner envelope on their desk. (This means Round 1 Switchers might swap *back* to their original).
  4.  **Finalization:** Students lock in their final envelope. Open and collect the cash.

  ### Phase 4: Debrief & Mapping (00:50 – 01:15)
  1.  **The Tension:** Ask the room: "Who switched in Round 1 but switched *back* in Round 2?" (This highlights the regress). "Who held a heavy envelope in Round 1 but switched anyway because of the math?"
  2.  **Mapping the Structure:**
      *   **The Weight:** Represents *informative evidence* (Bayesian update). It suggests the prior is not uniform over the specific pair.
      *   **The 5/4 Argument:** Represents *ignoring the prior*. It assumes a flat probability over $2X$ and $X/2$ regardless of the known distribution cap.
      *   **The Iteration:** Represents the *infinite regress*. By forcing them to apply the rule to the new envelope, you physically enacted the loop (A $\to$ B $\to$ A).
  3.  **The Limitation (Honest Note):**
      *   State clearly: "This game technically *solves* the paradox because we disclosed a cutoff ($32). If you hold $32, the 5/4 argument fails (you know you can't double). The paradox only truly holds if the prior is unbounded (infinite money possible). However, for every value *below* $32, the pressure remained. You felt the urge to switch even when you knew, logically, that everyone switching cancels out."
  4.  **Closing:** "The paradox isn't that the math is hard. It's that two valid-seeming frameworks (Empirical Weight vs. Abstract Expectation) demand contradictory actions."

  ---

  ## 3. Budget Safeguards & Payoff Scheme

  *   **Total Cash on Hand:** Bring $200 in small bills (mostly $1s, some $5s, one $20).
  *   **Exposure Cap:** The maximum payout is determined by the pair distribution.
      *   If every student ends with the higher value of their pair: **$160**.
      *   If every student ends with the lower value: **$80**.
      *   *Expected Cost:* Roughly **$120**.
  *   **Safety Valve:** If you are concerned about the $160 max, announce before Round 1: "Total workshop bank is $150. If total payouts exceed this, all winnings are scaled proportionally." (Students usually ignore this until the end, preserving the stakes, but it protects you).
  *   **Unclaimed Money:** Any money left in the "loser" envelopes is collected back into the facilitator's box.

  ---

  ## 4. Predictable Failures & Mitigation

  **1. The "Heavy Envelope" Refusal**
  *   **Prediction:** In Round 1, students who feel a distinctly heavy envelope will refuse to switch, citing the physical evidence. In Round 2, when forced to apply the 5/4 argument, they will resist or claim the argument doesn't apply to *their* specific envelope.
  *   **Mitigation:** In Round 2, be authoritarian about the rule. "For this round, the weight is irrelevant. The argument is universal. Apply it or sit out the payout." This forces the cognitive dissonance.

  **2. The "Consensus of Flaw"**
  *   **Prediction:** The group may quickly converge on "The 5/4 argument is wrong" without identifying *why*. They will treat Round 2 as a joke.
  *   **Mitigation:** During the debrief, do not let them dismiss the math immediately. Ask: "At what specific step does the calculation $0.5(2V) + 0.5(V/2)$ become false?" Force them to locate the error (the assumption of equal probability given the known cutoff).

  **3. The "Peer Effect"**
  *   **Prediction:** Students will look at neighbors. If a neighbor switches, they switch.
  *   **Mitigation:** Require decisions to be written down privately before any physical swapping occurs.

  **4. The "Cutoff" Collapse**
  *   **Prediction:** The one student with $16 (potential $32) or $32 will break the tension by saying "I can't switch, I'm at the max."
  *   **Mitigation:** Use this. This is the "Anchor." In the debrief, highlight that the paradox dissolves *only* at the boundary, yet the pressure existed for everyone else. This illustrates that the paradox is a problem of the *interior* of the distribution, not the edge.

  ---

  ## 5. Facilitator Script Snippets (For Tone)

  *   **On Stakes:** "This is not hypothetical. If you switch and lose half, you leave with half. If you stay and could have doubled, that is your loss. The money in this room belongs to you, but only if you hold it at the end."
  *   **On Round 2:** "I am not asking if you *want* to switch. I am asking if the argument *compels* you. If the math says the other envelope is worth more on average, and you do not switch, you are acting against expected value. Act accordingly."
  *   **On Debrief:** "You just felt the paradox. It wasn't a confusion of numbers. It was a conflict between your hand (the weight) and your head (the expectation). Philosophy often lives in that gap."
