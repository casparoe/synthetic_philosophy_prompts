      *   *Selection:* Digestion is the classic Nietzschean metaphor. Let's use **Digestion/Metabolism** or **Renovation**. Renovation might be more intuitive for "identity." Let's go with **Renovating an Old House**. It captures structure, history, and necessary destruction for new life.

