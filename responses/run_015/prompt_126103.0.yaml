      *   *Problem:* Nietzsche views Critical history as *judging and condemning* the past to break its power, not necessarily erasing the *fact* of it, but breaking its *authority*. It's more like a courtroom verdict than a delete button. Also, identity for Nietzsche isn't static; it's created through struggle with the past.

