          *   *Monumental:* Looking at great past deeds to inspire action in the present. (Inspiration).
          *   *Antiquarian:* Revering the past, preserving origins, feeling at home. (Piety/Roots).
          *   *Critical:* Judging and condemning the past to break its chains and enable new action. (Liberation).
      *   **Plastic Power (*plastische Kraft*):** The ability of an organism/culture to grow, heal, and *assimilate* the past. It's not just remembering or forgetting; it's metabolizing.
      *   **Unhistorical/Superhistorical:** The ability to forget (unhistorical) to act, and to see eternal meaning (superhistorical).
      *   **The Balance:** Nietzsche *does not* say "avoid critical history." He says *excess* of any mode is poisonous. Critical history is dangerous but *necessary* when the past becomes a tyrant. "It is necessary to break up the past... to live."

