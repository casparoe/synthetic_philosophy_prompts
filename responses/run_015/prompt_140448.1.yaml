answer: |-
  **Research Question**
  Is the connection between Frege's political diary and his philosophical logic best understood not as causal contamination but as a hermeneutic continuity in the rhetorical structure of distinction-making?

  **The Stalemate of Standard Postures**
  The current debate stalls because it relies on a vague notion of "bearing on," oscillating between two unproductive extremes. The quarantine posture argues that the diary is biographical noise irrelevant to logical truth, relying on Frege's own distinction between the context of discovery and the context of justification. However, this ignores Frege's anti-psychologism: if thoughts are public objects rather than private mental events, the diary's assertions are not mere private musings but judgeable content that demands philosophical engagement. Conversely, the contamination posture argues that the politics invalidates the logic, but this assumes a causal genetic link without textual evidence, conflating the truth of a proposition with the moral character of its proponent. Both postures leave the actual textual relationship unexamined because they ask whether the politics *caused* the logic, rather than asking whether the same intellectual temperament structures both. By treating the connection as either non-existent or total, both views miss the nuanced stylistic continuity that this project investigates.

  **Methodology and Timeline**
  This four-month project employs a comparative textual analysis focused on the rhetoric of distinction. **Month One** involves close coding of Frege's philosophical texts and the political diary. I will isolate passages where boundaries are drawn (e.g., concept/object, sense/reference, German/Jew) and code them for specific rhetorical markers: vocabulary of purity, infection, sharp boundaries, and defense against contamination. **Month Two** establishes a control group to avoid mistaking period style for unique pathology. I will code comparable polemical writings by contemporary German academics (Neo-Kantians and contemporaries) for the same markers. If Frege's rhetoric is indistinguishable from his peers, the link is historical rather than uniquely Fregean. **Month Three** is dedicated to the reflexive analysis: applying Frege's own methodological maxims to the project itself to test whether his philosophy permits this kind of biographical-philosophical linkage without self-contradiction. **Month Four** synthesizes these findings into the proposed taxonomy and drafts the dissertation, ensuring the argument moves from textual evidence to institutional implication.

  **Possible Conclusions and Deciders**
  There are three viable outcomes, decided primarily by the control group analysis. First, if Frege's rhetoric of distinction is uniquely aggressive compared to contemporaries, I will conclude there is a temperamental unity between his politics and philosophy, warranting a hermeneutic link where the diary makes the philosophy legible as an expression of a specific will to order. Second, if the rhetoric is period-typical, the conclusion will be that the diary reflects institutional norms rather than unique philosophical pathology, shifting the burden from Frege's logic to the culture of German academia. Third, the reflexive analysis might show that Frege's own principles strictly forbid using the diary to evaluate the logic, in which case the conclusion is that the quarantine is methodologically necessary but ethically costly. The deciding factor is the comparative data from Month Two; without it, any claim about Frege's unique stylistic pathology is anecdotal.

  **Failure Conditions**
  It is crucial to distinguish a negative result from project failure. Finding no stylistic link between the diary and the philosophy is a valid negative result that still contributes to the taxonomy by validating the quarantine model. Project failure would occur if I fail to produce the decision-shaped taxonomy itself. If the dissertation concludes merely that "the relationship is complex" without offering the four-fold distinction (causal, evidential, hermeneutic, institutional) as a usable tool for departments or interpreters, it has not met its primary objective. Similarly, failing to execute the control group comparison would constitute methodological failure, as it would leave the stylistic analysis ungrounded and susceptible to the charge that I am rediscovering general academic habits of 1900.

  **Scope and Cuts**
  To fit this into 10,000 words and one semester, significant trimming is required. I will cut the detailed biographical history of the diary's discovery and reception; the fact of its existence is sufficient background. I will also avoid deep exegesis of Frege's logical system itself, assuming reader competence in the basic distinctions without re-deriving them. Finally, I must restrict the broader ethical discussion about renaming buildings or cancelling lectures. The project aims to provide the taxonomy for those decisions, not to make the decisions themselves. Expanding into general ethics of canon revision would dilute the philosophical argument and exceed the word limit. The focus must remain tightly on the textual mechanics of distinction and the classification of relations.
