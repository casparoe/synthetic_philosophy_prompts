answer: |-
  This is a classic "Boundary Problem" in political theory, but since you're coming from software engineering, it helps to think of it as a system architecture issue. You're trying to define the permissions schema for a distributed system (the state). Who gets write access (voting) to the configuration file (laws)?

  Here is the breakdown of the two main protocols, how they handle your edge cases, and whether they can refactor to handle your "network" idea.

  ### 1. The Two Protocols

  #### The All-Subjected Principle (ASP)
  **The Logic:** If the system can enforce rules on you, you need admin access.
  **The Metric:** Coercion.
  **The Analogy:** This is like an Access Control List (ACL) based on jurisdiction. If the server has the power to `sudo` on your machine (arrest you, tax you, conscript you), you must be part of the cluster that decides what commands are run.

  *   **Why it exists:** It prevents tyranny. It stops a group from imposing rules on people who have no way to change them.
  *   **The Hard Boundary:** It assumes a binary state. You are either under the jurisdiction of the state's coercive apparatus, or you aren't.
  *   **The Weakness:** It ignores externalities. If Server A makes a change that crashes Server B, ASP says Server B doesn't get a vote because Server A doesn't have root access to Server B.

  #### The All-Affected Interests Principle (AAI)
  **The Logic:** If the output of the function changes your state, you should influence the parameters.
  **The Metric:** Impact / Consequence.
  **The Analogy:** This is like monitoring side effects. If a database commit alters variables in your scope, you should have review rights on the pull request, regardless of whether you own the repo.

  *   **Why it exists:** It prevents harm. It acknowledges that in a connected world, decisions ripple outward.
  *   **The Hard Boundary:** It *tries* to be binary (affected vs. not), but the metric is fuzzy. How much impact counts? 1% change in your GDP? A slight increase in pollution?
  *   **The Weakness:** It creates an infinite loop. Almost everyone is affected by everything. If the US votes on oil policy, it affects the climate in Bangladesh. Does Bangladesh get a vote in US elections? If yes, the demos becomes global. If no, where is the cutoff?

  ---

  ### 2. Running the Edge Cases (Unit Tests)

  Let's run your specific scenarios through these two logic gates to see where they crash.

  #### Case A: The Long-Term Expat
  *Scenario:* A citizen who pays taxes but lives abroad permanently. They are legally "in" but physically "out."

  *   **ASP Verdict:** **Fail (mostly).**
      *   *Reasoning:* The state's coercive power (police, local zoning, daily regulations) cannot physically touch them abroad. The state can't arrest them in London for a parking ticket in Ohio.
      *   *Nuance:* Some ASP theorists argue that because tax laws *do* follow them (the IRS can garnish assets), they are still "subjected." But generally, ASP leans toward residency because that's where the coercion is daily and physical.
      *   *Result:* They lose the vote.

  *   **AAI Verdict:** **Pass (conditionally).**
      *   *Reasoning:* Do domestic policies affect them? Yes. Currency value, pension portability, family safety back home.
      *   *Nuance:* The debate here is about *weight*. Are they affected *as much* as a resident? Probably not. AAI might suggest they get a vote, but perhaps a weighted one, or only on specific issues (like foreign policy/taxes) rather than local school boards.
      *   *Result:* They keep the vote, but the justification is shaky because "affectedness" is hard to measure compared to a resident.

  #### Case B: The Undocumented Resident
  *Scenario:* Someone living inside the borders, working, but without legal status. Legally "out," physically "in."

  *   **ASP Verdict:** **Pass.**
      *   *Reasoning:* This is where ASP shines. The police *can* arrest them. The courts *can* try them. Zoning laws *do* apply to where they sleep. They are fully subjected to the coercive power of the state.
      *   *Result:* They should vote. (Note: Current law disagrees, but the *theory* supports them).

  *   **AAI Verdict:** **Pass.**
      *   *Reasoning:* Policies on housing, labor, and healthcare affect them profoundly.
      *   *Result:* They should vote.

  **The Divergence:**
  Notice that on the Undocumented Resident, both agree they should be in. But on the Expat, they diverge. ASP cuts them out (no coercion); AAI keeps them in (still affected).
  *   **ASP prioritizes stability:** It keeps the voter roll tied to physical presence where enforcement happens.
  *   **AAI prioritizes moral coverage:** It tries to ensure no one bears costs without consent, even across borders.

  ---

  ### 3. The "Network vs. Container" Refactor

  Your "weird thought" is actually a major critique in modern political science. You're asking if the *demos* is a boolean (True/False) or a float (0.0 to 1.0).

  Most traditional democratic theory treats the *demos* as a **Container**. You are either a citizen or you aren't. It's a binary flag in the user table.

  Your **Network/Relational** model suggests belonging is graded. Maybe you have 0.8 voting power because you live here but work abroad. Maybe you have 0.2 voting power because you are a neighbor affected by our pollution.

  Can the two standard views handle this refactor?

  #### Can ASP handle the Network Model?
  **Verdict: No. It breaks the architecture.**
  ASP is built on the concept of Sovereignty. Sovereignty is traditionally absolute. You are either under the King's law or you aren't.
  *   **The Conflict:** Coercion is hard to grade. Yes, police *can* arrest you, but maybe they rarely do. Does that make you "less subjected"?
  *   **The Crash:** If you try to make ASP relational, you lose its main benefit: clarity. The whole point of ASP is to draw a hard line around the jurisdiction so everyone knows who is in charge. If you make it a network of graded coercion, you end up with overlapping jurisdictions (like feudalism), which makes enforcing the code impossible. ASP requires a hard boundary to function.

  #### Can AAI handle the Network Model?
  **Verdict: Yes, but it introduces massive latency.**
  AAI is actually naturally compatible with the network idea. "Affectedness" is inherently a spectrum.
  *   **The Fit:** You can imagine a system where voting rights are dynamic. If a city votes on a factory, the people next door get 1.0 vote, people 10 miles away get 0.5 vote, people in the next state get 0.1 vote.
  *   **The Cost:** This is computationally expensive.
      1.  **Measurement:** Who calculates the "impact score" for every voter on every issue?
      2.  **Stability:** If the *demos* changes every time a new bill is proposed (because the set of "affected people" changes), you never have a stable user base to maintain the system.
      3.  **Infinite Recursion:** If I affect you, and you affect me, do we both keep voting until we reach equilibrium?

  ### Summary for the Engineer

  | Feature | All-Subjected (ASP) | All-Affected (AAI) |
  | :--- | :--- | :--- |
  | **Core Logic** | Input Legitimacy (Who enforces the rules?) | Output Legitimacy (Who feels the side effects?) |
  | **Data Type** | Boolean (In/Out) | Float (Degree of impact) |
  | **Performance** | High. Clear boundaries, easy to query. | Low. Requires complex impact analysis for every decision. |
  | **Expat Case** | Exclude (Not physically coerced). | Include (Still impacted by laws). |
  | **Undocumented Case** | Include (Physically coerced). | Include (Deeply impacted). |
  | **Network Ready?** | **No.** Requires hard boundaries to define coercion. | **Yes.** Naturally handles gradients, but risks system instability. |

  **The Bottom Line:**
  Your roommate is likely arguing from **AAI** (moral impact), while the current legal system is mostly built on **ASP** (jurisdictional control).

  If you want to move to a **Network/Relational model**, you have to abandon ASP entirely. It can't do graded membership. You would have to build on AAI, but you'd need to solve the "computational cost" problem—basically, how to define the threshold of "affectedness" without the system grinding to a halt or expanding to include the entire human race.

  Currently, we use Citizenship as a **cache** for these principles. It's a pre-computed list of voters that approximates both ASP and AAI for 90% of cases to save on transaction costs, even though it fails on your edge cases.
