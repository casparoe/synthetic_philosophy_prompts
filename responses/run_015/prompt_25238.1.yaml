prompt: |-
  ok so i've now seen "that's a Pascal's mugging" deployed in three different arguments in the last month and i'm starting to think nobody agrees on what it means:

  1. someone used it to dismiss the entire project of longtermism — "caring about the far future is just Pascal's mugging because the probabilities are so tiny"
  2. someone used it in a crypto debate to reject a leveraged trade with a 2% chance of 100x returns — which, like, 2% is not *that* tiny?
  3. someone used it to push back on a friend who said we should take the simulation hypothesis seriously because even a 1-in-a-billion chance of infinite simulators means we're probably in a sim

  so the slogan is doing different argumentative work each time. i want to know what precise claims could be hiding inside "that's a Pascal's mugging" — not just what Bostrom originally meant, but what people are actually asserting when they say it as a conversation-ender.

  give me a JSON array of readings, where each object has:
  - "id": a short label for this reading (e.g. "unbounded_utility_reject")
  - "claim": the precise thesis, as a declarative sentence
  - "scope": "universal" (applies to all low-p-high-value bets), "extreme_only" (only when probabilities are below some threshold), or "structural" (about the decision-theoretic setup, not the numbers)
  - "plausibility": "trivially_true" / "plausible" / "contentious" / "implausible" / "false"
  - "kills_longtermism": boolean
  - "kills_crypto_trade": boolean
  - "kills_simulation_arg": boolean
  - "missing_premise": what else you'd need to believe for this reading to actually do the dismissing work in the argument it was aimed at
