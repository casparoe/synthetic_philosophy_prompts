  Internalist, functionalist, and enactive accounts each capture fragments of this topology but fail to unify the normative and metaphysical stakes without revision. To serve your specific purpose of distinguishing interventions on the mind from interventions on surroundings, an adequate theory must satisfy the following desiderata.

  1.  **The Non-Inference Criterion:** The theory must establish constitutive status without deriving it solely from causal reliance. **[Non-negotiable]**
      *   *Consideration:* Addresses the core suspicion that constitution is being improperly inferred from coupling.
  2.  **The Normative Equivalence Principle:** Interference with the resource must constitute a cognitive violation comparable to internal impairment, not merely property damage or inconvenience. **[Non-negotiable]**
      *   *Case:* Distinguishes the border phone search (mind) from seizing a coat (surroundings).
  3.  **The Epistemic Ownership Condition:** The agent must retain ultimate authority over content to bear epistemic credit or blame for outputs. **[Non-negotiable]**
      *   *Case:* Sorts platform rewriting notes (violates ownership) from a user's own drafting (vehicle for credit).
  4.  **The Override Capacity Requirement:** The agent must be able to reject or correct the resource's output without cognitive collapse. **[Preference]**
      *   *Case:* Distinguishes a resource the agent masters from one mastering the agent (e.g., the predictive keyboard).
  5.  **The Phenomenal Transparency Clause:** The resource should function without demanding explicit monitoring during standard operation. **[Preference]**
      *   *Case:* Distinguishes the AR overlay (transparent) from a consciously consulted notebook (opaque).
  6.  **The Diachronic Identity Provision:** The resource must support continuity of self even if access is mediated by others. **[Preference]**
      *   *Case:* Protects the care home resident's photo archive curated by a wife (extended mind) versus mere external storage.

  **Joint Satisfiability Warning:** I doubt **The Epistemic Ownership Condition** and **The Diachronic Identity Provision** can be jointly satisfied in cases of severe hippocampal damage. If the user cannot inspect or edit the wife-curated archive, Ownership fails; if Ownership is required, the archive is merely scaffolding, undermining the intuition that removing it harms the *mind* rather than the surroundings.

