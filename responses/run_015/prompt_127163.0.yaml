  # ADVERSARIAL COLLABORATION DOCUMENT: PROSTITUTION POLICY
  **Participants:** You (Nordic Model) and Priya (Full Decriminalisation)
  **Date:** Today
  **Status:** Draft for Signature

  ## PART 1: SUBSTANTIAL AGREED CLAIMS
  *We both sign below to indicate we accept these statements as an accurate baseline for our disagreement. These are not trivial; they rule out certain arguments we have used in the past.*

  1.  **Criminalisation of the Seller:** We agree that the person selling sex should not be arrested, fined, or given a criminal record for the act of selling sex itself. We agree that punishing the seller increases vulnerability and does not reduce the trade.
  2.  **The State's Duty to Exit:** We agree that anyone who wants to leave sex work must be able to do so without destitution. The state owes a realistic pathway out (housing, income support, training) regardless of which legal model is in place.
  3.  **Migration Status:** We agree that lacking legal immigration status makes a person vulnerable to exploitation in *any* legal regime (Nordic, NZ, or German). We agree that current systems often use immigration enforcement to punish sex workers, and we both want to separate labour enforcement from border enforcement.
  4.  **Germany/Netherlands vs. New Zealand:** We agree that the German/Dutch systems (licensing, zoning, mandatory registration) are legally distinct from the New Zealand system (full decriminalisation under standard labour law). We agree that using Germany as a direct proxy for New Zealand is technically inaccurate.
  5.  **Third-Party Nuance:** We agree that not every third party is a "pimp" in the coercive sense. We agree that a distinction exists between someone who controls a worker's earnings and movement, and someone who provides a service (security, accounting, web hosting) for a fee.
  6.  **Remote Work:** We agree that sex work involving no physical contact (camming, content) exists and is growing. We agree that policies designed for street or brothel work do not automatically fit this sector without modification.
  7.  **Measurement of Harm:** We agree that violence against sex workers is under-reported in all systems. We agree that police data alone is insufficient to judge the safety of any model.
  8.  **The "Shrinking" Problem:** We agree that measuring the "size" of the sex industry is notoriously difficult. We agree that a claimed reduction in numbers could simply mean the trade has moved further underground, not that it has disappeared.

  ***

  ## PART 2: THE DISAGREEMENT TABLE
  *This table isolates the specific points where we diverge. Column 4 assesses whether the fight is about reality or just language.*

  | # | The Disagreement (Neutral Wording) | Your View (Nordic) | Priya's View (Full Decrim) | Real or Verbal? | Agreed Evidence / Concrete Case | Your Prediction | Priya's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Goal of Policy:** Is success defined by the number of people selling sex, or the conditions under which they sell it? | Success means fewer people selling sex. A smaller market indicates less exploitation and less demand for commodified intimacy. | Success means better safety and rights for those currently selling. A stable or larger market is acceptable if workers have full labour rights. | **Real.** This is a fundamental clash of values (abolition vs. labour rights). | A policy change that clearly improves worker safety but leads to a visible increase in the number of sellers. | I would call this policy a failure because it normalises exploitation. | She would call this policy a success because it reduced harm for existing workers. |
  | **2** | **The German/NZ Link:** Does the existence of licensing in Germany tell us what happens under full decriminalisation in NZ? | Yes. Even if the laws differ, the cultural signal is the same: "sex is a commodity." This leads to expansion and trafficking cover in both. | No. Licensing creates a two-tier system that excludes migrants and poor workers. NZ decrim includes them. You cannot judge NZ by Germany's rules. | **Real.** This is a causal claim about how law interacts with culture and markets. | A specific case of a migrant sex worker in NZ vs. Germany facing a labour dispute. | I predict the NZ worker still faces stigma and pressure to hide, similar to the German unlicensed worker. | I predict the NZ worker can access police and courts without fear, unlike the German unlicensed worker. |
  | **3** | **Third Parties (The Flatmate Test):** Four women share a flat, hire security and an accountant, split costs. No one takes a cut of earnings. Is this permissible? | This is high-risk. It creates a structure where coercion can hide easily. It should be heavily regulated or prohibited to prevent "soft" pimping. | This is permissible. It is a co-operative business model. Banning this prevents workers from pooling resources for safety. | **Real.** This is about where we draw the line on "exploitation." | A real-world example of this exact co-op model operating for 5 years. | I predict someone in that group will eventually be coerced or controlled by the others. | I predict the group will remain stable and safer than if they worked alone. |
  | **4** | **Benefits & Immigration:** If declaring income loses you housing benefits or risks visa cancellation, does decriminalisation help? | No. Decrim doesn't fix the welfare trap. You need exit funding and amnesty, otherwise the law is theoretical. | Yes. Decrim gives the leverage to declare income safely over time. The welfare trap is a separate policy fix, not a reason to keep sex work criminal. | **Verbal/Real Mix.** We agree it's a problem, disagree on whether decrim solves it. | A worker who declares income and immediately loses essential housing support. | I say this proves decrim is insufficient without massive welfare reform first. | She says this proves welfare reform is needed, but decrim is still the right legal baseline. |
  | **5** | **Remote Work:** Does the Nordic logic (criminalise the buyer) apply to camming and subscription content? | Yes. It is still the sale of sexual access for money. The buyer is still paying for commodified intimacy. | No. It is digital content creation. The buyer is a subscriber, not a client purchasing physical access. Risk profile is totally different. | **Real.** This tests the definition of "sex work" vs "digital labour." | A cammer requesting police protection from a harassing subscriber. | I say the law should treat the harasser as a buyer of sex. | She says the law should treat the harasser as a digital stalker, unrelated to sex work law. |
  | **6** | **The Buyer:** What is the moral status of the person paying? | Perpetrator. They are creating the demand that leads to exploitation. They are morally culpable even if no force is used. | Customer. They are purchasing a service. They are only culpable if they break the law (e.g., buying from a trafficked person). | **Real.** This is the core moral divergence. | A buyer who treats the worker with politeness, pays agreed price, leaves. | I say he is still participating in a harmful system, regardless of manners. | She says he is acting ethically within a consensual transaction. |

  ***

  ## PART 3: ANALYSIS OF MOVEMENT AND "FAKE" ARGUMENTS

  ### 1. Who would actually move?
  *   **You (Nordic):** You would likely move on **Third Parties (Row 3)**. If the "flatmate co-op" model was proven safe over five years, your argument about inherent coercion weakens. You might accept that *some* third-party involvement is necessary for safety, even if you remain suspicious of the scale.
  *   **Priya (Decrim):** She would likely move on **The Goal of Policy (Row 1)** *if* presented with a specific scenario. If it were proven that a specific type of buyer (e.g., those paying for sex with minors, or those known to be violent) could be filtered out *only* by criminalising demand, she might accept a partial Nordic approach for that specific subset. However, she will not move on the principle that sex work is work.

  ### 2. Who will move the goalposts?
  *   **You:** You risk moving the goalposts on **Germany vs. NZ (Row 2)**. If evidence shows NZ workers are significantly safer and more empowered than German workers, you may shift to arguing that "NZ is a unique cultural exception that wouldn't work here," rather than accepting the model works.
  *   **Priya:** She risks moving the goalposts on **Benefits & Immigration (Row 4)**. If decriminalisation is implemented and workers *still* lose benefits or face deportation, she may shift to arguing that "true decriminalisation hasn't been tried yet," rather than admitting the legal change alone didn't fix the economic vulnerability.

  ### 3. What part of the argument was never about anything real?
  **The Germany/Netherlands vs. New Zealand technicality.**
  For two years, you have used Germany as a club to beat the idea of decriminalisation, and Priya has used the legal distinction as a shield.
  *   **Why it's fake:** You both agree that *licensing* (Germany) creates exclusion. You both agree that *decriminalisation* (NZ) removes criminal penalties. The fight isn't about the law; it's about the **culture**.
  *   **The Real Question:** You believe culture follows law (legalise it, people accept it, market grows). Priya believes law follows culture (workers organise, law catches up, safety improves).
  *   **Resolution:** Stop arguing about the German zoning laws. Argue about whether *normalisation* is good or bad. If you think normalisation is inherently bad, no amount of legal distinction will satisfy you. If Priya thinks normalisation is inherently good, no amount of German failure will dissuade her. That is the actual crux.

