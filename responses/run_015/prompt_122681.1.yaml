prompt: |-
  I'm a philosophy PhD student (mind and language, but I've been sitting in on the ML lab's reading group for about a year) and I've been drafted to fill a 40-minute slot on the frame problem at their Thursday meeting in a couple of weeks. Audience is maybe fifteen people: mostly first- and second-year ML PhD students, two or three philosophy people like me, nobody will have read anything in advance, there's a whiteboard and I'd rathre not use slides. Don't write the lecture for me — I want the plan. What has to be in place before what, and why that order: what actually depends on what, as opposed to what just makes a nice narrative. My own half-baked way in is a three-way split, and I'd like you to tell me if it's wrong before I build a lecture on it: (1) a specification/formalization problem — writing down what an action changes without writing out roughly M×N sentences about what it doesn't change, which I take to be more or less handled by action schemas and successor-state axioms in the situation calculus; (2) an inference problem — even given a compact description, the agent has to avoid re-deriving or re-checking the whole rest of what it believes to see what survived the action, which is the non-monotonic/circumscription-ish territory; and (3) a relevance problem — which of the indefinitely many things the agent knows bear on what it's doing at all, which I don't think (2) touches and which I think is the bit that makes philosophers reach for Dreyfus and Fodor. If that carve-up is itself a contested way of drawing the lines, say so.

  The bit I keep going back and forth on is the example. Every version I have in my notes is the robot-and-the-bomb-in-the-room setup, and I think for this crowd it's actively misleading: the bomb smuggles in stakes, and the story keeps sliding into "how could it have known the wagon wouldn't scratch the floor" (which I take to be the qualification problem) and "pulling the wagon out also moves the battery" (ramification) — neither of which is the thing I'm trying to get them to see. So give me one example to carry the whole forty minutes and be explicit about what it has to have and what it has to lack. My constraints: statable in two sentences, it has to make the "what stays the same?" question bite without leaning on risk or on knock-on causal effects, and it has to survive being re-described in a learned-world-model / next-token-prediction setting, because the second I say "state" someone will say "we don't do symbolic states any more and we're doing fine." Relatedly: where in the sequence do I head off "isn't this just computational complexity / combinatorial explosion" (I don't think it is, but I'm not sure I can say why in one move), where do I head off "deep learning dissolved this," and where do I head off the outcome I'm most worried about — that they walk out thinking the frame problem is just a fancy name for "cognition is hard when you have limited time," at which point it stops being a distinctive problem at all.

  Also give me one question to end on that would show me whether they actually got it rather than just being able to repeat a slogan, and tell me what I should openly refuse to get into at this level. Two more things. First: I may have the shooting case wrong — I want to use the one where minimizing changes leaves you with a model in which the gun mysteriously becomes unloaded during the wait and the turkey survives; if I've mangled it, correct me, and tell me whether it even belongs in forty minutes or whether it'll eat the whole slot in the formalism. Second: please seperate, clearly, what I can present as settled among people who actually work on this from what's genuinely contested — I really don't want to stand up and imply, as a matter of record, that Dreyfus or Fodor showed symbolic AI was hopeless, or that circumscription is "the solution," and I'd like to know which of my three labels would get me argued with in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture plan:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student (mind & language), sitting in on ML lab reading groups.
      *   **Task:** Fill a 40-minute slot on the Frame Problem.
      *   **Audience:** ~15 people. Mostly 1st/2nd year ML PhDs (technical, likely deep learning/neural net focused), 2-3 philosophy peers. No prep reading.
      *   **Format:** Whiteboard only (no slides).
      *   **Goal:** A structural *plan*, not a script. Dependencies matter more than narrative flow.
      *   **User's Current Conception:** Three-way split (Specification, Inference, Relevance). Wants validation/critique of this.
      *   **Key Constraints:**
          *   Need *one* running example (not Robot/Bomb/Wagon).
          *   Example must be statable in 2 sentences.
          *   Example must avoid risk/stakes (bomb), qualification problem (scratching floor), and ramification (battery moves).
          *   Example must survive translation to learned-world-model/next-token settings (avoid "symbolic state" trap).
          *   Must address specific objections: "Isn't this just complexity?", "Didn't DL solve this?", "Isn't this just bounded rationality?"
          *   Need one diagnostic closing question.
          *   Need to know what to *exclude*.
          *   Need clarification on the Yale Shooting Problem (YSP).
          *   Need distinction between settled vs. contested claims.

  2.  **Evaluate the User's Three-Way Split:**
      *   *(1) Specification (Frame Axioms):* This is the historical origin (McCarthy & Hayes). Is it "handled"? In classical AI (Situation Calculus + Successor State Axioms), yes, Reiter's solution largely dissolves the *logical* frame problem. But is it "handled" for ML? Not really, because ML doesn't usually use explicit axioms.
      *   *(2) Inference (Efficiency/Non-monotonicity):* This is the "computational" frame problem (Ford & Pylyshyn). Can we compute what changes without checking everything?
      *   *(3) Relevance (Epistemic/Cognitive):* This is the "philosophical" frame problem (Dreyfus, Fodor, Dennett). How do we know what *matters*?
      *   *Critique:* The split is defensible but risky. ML students might conflate (1) and (2). (3) is often dismissed by ML folks as "just attention mechanisms." I need to advise the user on how to defend this taxonomy without getting bogged down in terminology wars. The distinction between (2) and (3) is the crucial philosophical pivot.

  3.  **Select the Running Example:**
      *   *Constraint:* 2 sentences. No risk. No ramification. No qualification. Must work for neural nets.
      *   *Bad:* Robot/Wagon/Bomb (too much baggage).
      *   *Bad:* Blocks World (too dry, feels purely symbolic).
      *   *Bad:* Cooking (too many causal chains/ramifications).
      *   *Idea:* A simple visual scene or a text state.
      *   *Proposal:* **The "Red Cup" Scenario.**
          *   Sentence 1: "There is a red cup on a table, and a light switch on the wall."
          *   Sentence 2: "I flip the switch."
          *   *Why:* Flipping a switch changes the light. It does *not* change the cup's color, position, or existence. It doesn't change the table's material.
          *   *Avoids Risk:* No bomb.
          *   *Avoids Ramification:* Flipping a switch doesn't usually move the cup (unless it's a smart switch connected to a robot arm, but we stipulate it's a light switch).
          *   *Avoids Qualification:* We aren't worrying if the switch is broken.
          *   *ML Relevance:* In a video prediction model (World Model), if I predict the next frame after 'flip switch', do I need to re-compute the pixels of the cup? If I'm a transformer, do I attend to the cup tokens?
      *   *Refinement:* Let's make it even more abstract to fit "state."
      *   *Selected Example:* **The "Open Window" Scenario.**
          *   State: "The window is open. The cat is on the mat."
          *   Action: "I close the window."
          *   Question: "Is the cat still on the mat?"
          *   *Wait, too simple.*
      *   *Selected Example:* **The "Pixel Grid" (for ML appeal).**
          *   State: A 10x10 grid. Pixel (2,2) is Red. Pixel (5,5) is Blue.
          *   Action: Change Pixel (2,2) to Green.
          *   Question: What is the color of Pixel (5,5)?
          *   *Critique:* Too trivial. DL solves this easily (locality).
      *   *Selected Example:* **The "Database Update" (Abstract but clear).**
          *   State: "User A is Premium. Item B is in Stock. Server C is Online."
          *   Action: "Renew User A's subscription."
          *   Question: "Is Item B still in Stock?"
          *   *Why:* It abstracts away physics. It highlights *logical* independence vs. *causal* coupling.
          *   *ML Translation:* In a latent space, does updating the 'User' vector drift the 'Item' vector?
      *   *Decision:* The **"Room State"** example is best if kept strictly non-causal.
          *   "The light is on. The door is closed."
          *   Action: "Turn off the light."
          *   Target: "Is the door still closed?"
          *   *Why:* It's the classic frame intuition without the wagon/bomb baggage. It maps to "context retention" in RNNs/Transformers.

      *   *Wait, user wants to avoid "symbolic state" objections.*
      *   *Better Example:* **The "Next-Token" Context.**
          *   Context: "The chef put the knife in the drawer. Then he washed the spoon."
          *   Action (Token): "Then he..."
          *   Question: "Does the model need to re-verify the knife's location to predict the next verb?"
          *   *Actually, let's stick to the User's constraint:* "Statable in two sentences."
          *   *Final Choice:* **The "Static Object" Example.**
          *   1. "A blue block is on a table; a red block is on the floor."
          *   2. "I move the blue block to the floor."
          *   *Question:* "Did the red block move?"
          *   *Why:* It's physical enough to be intuitive, abstract enough to be formalized. It avoids the "bomb" stakes. It avoids "wagon pulls battery" (ramification) if we stipulate the blocks are independent. It maps to "object permanence" in video prediction models.

  4.  **Address the Specific Objections (The "Head Offs"):**
      *   *Complexity:* It's not just $O(N)$. It's about *which* $N$. If the representation is distributed (neural), changing one weight *could* theoretically affect everything. The problem is guaranteeing locality.
      *   *DL Dissolved It:* DL handles *statistical* regularities. It doesn't guarantee *logical* persistence. It hallucinates changes. (Show example of video models morphing background).
      *   *Bounded Rationality:* The frame problem isn't "we are slow." It's "we don't even know what to check." Bounded rationality assumes a utility function over known options. Frame problem is about defining the options.

  5.  **The Yale Shooting Problem (YSP):**
      *   *User's understanding:* "Minimizing changes leaves you with a model in which the gun mysteriously becomes unloaded."
      *   *Correction:* Yes, that's correct. If you minimize *change* globally, the model prefers the gun becoming unloaded (a change) over the turkey dying (a change + causal effect). Wait, actually, YSP shows that simple minimization of change is ambiguous. It allows a model where the gun unloads *during the wait* to avoid the turkey dying later.
      *   *Verdict:* **Cut it.** It requires too much setup (situation calculus, abnormality predicates, chronological minimization). It will eat 20 minutes. Stick to the core intuition.

  6.  **Settled vs. Contested:**
      *   *Settled:* The logical frame problem (axioms) is technically solvable (Reiter). The computational version is real (scaling).
      *   *Contested:* Whether DL *actually* solves it (most philosophers say no, most MLers say "it works well enough"). Whether relevance (3) is a distinct problem or just (2) at scale. Dreyfus/Fodor claims are highly contested (not "settled history").

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Structure:*
          1.  Hook (The Example).
          2.  Definition (The 3 parts).
          3.  Deep Dive on (1) & (2) (The ML connection).
          4.  Deep Dive on (3) (The Philosophy connection).
          5.  Objections (DL, Complexity).
          6.  Closing Question.
      *   *Timing:* 40 mins is tight. Need to be ruthless.
      *   *Whiteboard:* Use it for the logical structure, not drawing robots.

  8.  **Refining the "Three-Way Split":**
      *   Is it wrong? It's the standard Shanahan/Pylyshyn distinction.
      *   *Risk:* ML students will say (1) is irrelevant (they don't use logic) and (3) is "attention."
      *   *Mitigation:* Frame (1) as "Representation of Invariance." Frame (3) as "Grounding of Relevance."
      *   *Advice:* Tell the user to explicitly label them "The Logical," "The Computational," and "The Epistemic."

  9.  **Refining the Example:**
      *   The "Blue Block/Red Block" is good.
      *   Sentence 1: "Block A is on the table. Block B is on the floor."
      *   Sentence 2: "I move Block A to the floor."
      *   *Why it works:* No causal link between A and B. No risk.
      *   *ML Translation:* In a video prediction model, if I generate the next frame where A moves, do the pixels for B remain identical? If they smear, the frame problem wasn't solved.

  10. **Final Review against Constraints:**
      *   Plan only? Yes.
      *   Dependencies clear? Yes.
      *   Example vetted? Yes.
      *   Objections addressed? Yes.
      *   YSP clarified? Yes.
      *   Settled vs. Contested? Yes.
      *   Closing Question? Needs to be diagnostic. "If your loss function goes down, did you solve the frame problem?"

  11. **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure to emphasize *why* the order matters. (Example -> Definition -> Technical -> Philosophical -> Objections).
      *   Ensure the "DL dissolved this" counter-argument is specific (hallucination/object permanence).
      *   Ensure the "Complexity" counter-argument distinguishes search space from *representation*.

  12. **Final Polish:** Check tone. Respectful of ML expertise but firm on philosophical distinctions. (Proceed to generate response).

