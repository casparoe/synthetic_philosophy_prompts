answer: |-
  Here is a structural plan for the 40-minute slot. It prioritizes logical dependencies over narrative flow. If you skip a dependency, the subsequent section collapses into confusion; if you skip a narrative flourish, nobody cares.

  ### 1. The Running Example (The "Blue/Red Block" Scenario)
  **Do not use the Robot/Bomb/Wagon.** You are correct: it smuggles in risk (bomb), qualification (floor friction), and ramification (battery cables).

  **Use this:**
  1.  "A blue block is on the table. A red block is on the floor."
  2.  "I move the blue block to the floor."

  **Why this specific example:**
  *   **Two Sentences:** Meets your constraint.
  *   **No Causal Coupling:** Moving Block A does not physically cause Block B to move (avoids Ramification).
  *   **No Risk:** Nobody dies (avoids pragmatic stakes distracting from the logical point).
  *   **No Qualification:** We assume the move succeeds (avoids "what if the block is glued?").
  *   **ML Translation:**
      *   *Symbolic:* State $S_1 \to S_2$. Does $Location(Red)$ persist?
      *   *Neural/Video Model:* If I generate frame $t+1$ where Blue moves, do the pixels for Red remain *exactly* invariant, or do they drift/smeared?
      *   *Language Model:* If the context says "Book in bag," and I generate "He walked to kitchen," does the latent representation of "Book Location" persist without being re-stated?

  **What it lacks:** It lacks *causal richness*. That is a feature, not a bug. You are isolating the **inertia** of facts, not the **consequences** of actions.

  ---

  ### 2. The Sequence of Dependencies (The Plan)
  *Total Time: 40 Minutes. Whiteboard only.*

  #### Phase 1: The Intuition (0:00–0:05)
  *   **Action:** Write the two example sentences on the board.
  *   **Ask:** "If I ask a system 'Where is the red block?' after the move, what does it have to do to answer?"
  *   **Point:** It feels trivial to humans. "Obviously it didn't move."
  *   **Dependency:** You must establish that this triviality is **not** automatic in a formal system. If you don't establish this, the rest is philosophy of mind, not AI.
  *   **Whiteboard:** Draw $S_{initial}$ and $S_{final}$. Draw an arrow for the action. Draw a question mark over the Red Block's properties in $S_{final}$.

  #### Phase 2: The Three-Way Split (0:05–0:15)
  *   **Action:** Define your three categories. This is the core conceptual scaffold.
  *   **Order Matters:** You must present them in this order because (2) assumes (1) is solved, and (3) assumes (2) is solvable.
      1.  **The Logical Problem (Specification):** How do we write down the rules without $M \times N$ frame axioms? (McCarthy/Hayes).
          *   *Status:* **Settled.** Mention Reiter's Successor State Axiomas. Tell them: "Logicians mostly think this is solved. We can write compactly."
      2.  **The Computational Problem (Inference):** Given the compact rules, how do we compute the new state without checking every single fact? (Ford/Pylyshyn).
          *   *Status:* **Contested/ML Relevant.** This is where efficiency lives.
      3.  **The Epistemic Problem (Relevance):** How does the system know *which* of the infinite facts *might* be relevant to check? (Fodor/Dennett).
          *   *Status:* **Deeply Contested.** This is where the philosophy lives.
  *   **Warning on your Split:** Your split is standard (Shanahan/Pylyshyn), but ML students will try to collapse (2) and (3).
      *   *Defense:* (2) is about *efficiency* (how to check fast). (3) is about *salience* (what to check at all). A hash map solves (2) for known keys. Nothing solves (3) for unknown keys.

  #### Phase 3: The ML Objections (0:15–0:30)
  *   **Action:** This is the most critical section for this audience. You must preempt the "Deep Learning dissolved this" move.
  *   **Dependency:** You cannot make this argument until you have defined the problem (Phase 2).
  *   **Objection A: "Isn't this just Complexity?"**
      *   *Response:* No. Complexity assumes a defined search space. The Frame Problem is that the search space is *undefined*. It's not that checking everything is slow; it's that "everything" includes facts you haven't represented yet (e.g., "the color of the president's tie").
  *   **Objection B: "Deep Learning solved this with Attention/World Models."**
      *   *Response:* DL solves the *statistical* version, not the *logical* version.
      *   *Example:* Video prediction models often "hallucinate" background changes (the red block smears or changes shade). They learn *probable* persistence, not *guaranteed* invariance.
      *   *Point:* If your model drifts, you haven't solved the frame problem; you've just averaged over it.
  *   **Objection C: "Isn't this just Bounded Rationality?"**
      *   *Response:* Bounded rationality assumes you know the options and pick the best one given time. The Frame Problem is that you don't know the options (the relevant facts) to begin with.

  #### Phase 4: The Yale Shooting Problem (YSP) Decision (0:30–0:35)
  *   **Your Question:** Should you include it?
  *   **Verdict:** **No.**
  *   **Why:** You understood the YSP correctly (minimizing change allows the gun to magically unload to avoid the turkey dying later). However, explaining *why* chronological minimization fails requires introducing abnormality predicates and time-stamping.
  *   **Cost:** It will eat 15 minutes. It addresses a specific technical fix to (1), but your audience cares about (2) and (3).
  *   **Alternative:** Mention it only as a footnote: "There are technical traps in formalizing this, like the Yale Shooting Problem, but they are solved by specific logical tools. The harder problem is relevance."

  #### Phase 5: The Closing Diagnostic (0:35–0:40)
  *   **Action:** Do not summarize. Ask a question that forces them to distinguish between *correlation* and *invariance*.
  *   **The Question:** "If your world model predicts the red block stays put with 99.9% accuracy, have you solved the frame problem, or have you just learned a very strong statistical prior?"
  *   **What to listen for:**
      *   *Wrong Answer:* "Accuracy is all that matters." (Misses the logical/structural point).
      *   *Right Answer:* "If it fails on the 0.1% (out of distribution), does the system know *why* it failed? Does it understand *independence*?"

  ---

  ### 3. Settled vs. Contested (Cheat Sheet)
  *Use this to calibrate your claims. Do not present the Contested items as fact.*

  | Claim | Status | Who agrees/disagrees |
  | :--- | :--- | :--- |
  | **The Logical Frame Problem (1)** is solvable via Successor State Axioms. | **Settled** (among logicians) | Reiter, McCarthy. ML folks don't care because they don't use logic. |
  | **Deep Learning has dissolved the Frame Problem.** | **Contested** | ML Practitioners: "Yes, attention handles it." Philosophers/Cognitive Scientists: "No, it masks it with statistics." |
  | **The Relevance Problem (3)** is distinct from the Inference Problem (2). | **Contested** | Fodor/Dennett: Yes, distinct. Many ML researchers: No, relevance is just learned attention weights. |
  | **Dreyfus/Fodor proved Symbolic AI is hopeless.** | **False/Contested** | This is folklore. They argued specific points about context/relevance, not a total impossibility proof. Do not cite them as "winning." |
  | **Circumscription is "The Solution."** | **False** | It's *a* solution to (1), but fails on YSP without modification. |

  ---

  ### 4. What to Refuse to Get Into
  *You have 40 minutes. If you open these doors, you will not close them.*

  1.  **Non-Monotonic Logic Formalisms:** Do not write out circumscription formulas or default logic syntax. It triggers "symbolic AI is dead" reflexes in ML students without adding value. Talk about the *property* (defeasibility), not the *math*.
  2.  **The Qualification Problem:** Explicitly say: "I am assuming the action succeeds. I am not asking what prevents the move. I am asking what *else* changes."
  3.  **The Ramification Problem:** Explicitly say: "I am assuming no causal chains. The red block is not connected to the blue block."
  4.  **Consciousness/Qualia:** If someone asks "But does the robot *know*?", shut it down. "We are talking about representation and inference, not phenomenology."

  ### 5. Critique of Your Three-Way Split
  Your split is **structurally sound** but **terminologically risky**.
  *   **(1) Specification:** ML students will say "We don't specify, we learn." *Counter:* "You still implicitly specify inductive biases. The problem is representing invariance."
  *   **(2) Inference:** ML students will say "That's just compute." *Counter:* "Compute scales with N. The Frame Problem is that N is effectively infinite/unbounded."
  *   **(3) Relevance:** This is the most important one for you. ML students will say "That's Attention." *Counter:* "Attention weights are learned from data. Relevance requires knowing what matters *before* you have data on the specific situation (systematicity)."

  **Final Advice:**
  Stand firm on the distinction between **Statistical Persistence** (DL) and **Logical Invariance** (Frame Problem). That is the friction point where your expertise adds value to their lab work. If you can make them see that their loss function optimizing for prediction doesn't guarantee they've captured *independence*, you win.
