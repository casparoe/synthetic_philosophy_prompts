answer: |-
  # SEMINAR HANDOUT: Mapping the Aggregation Problem in Contractualism

  **Topic:** Justifiability, Numbers, and the "One vs. Five" Problem  
  **Context:** Scanlonian Contractualism (Wrongness = Principles no one could reasonably reject)  
  **Goal:** Sort intuitive positions on aggregation without relying on jargon labels.

  ---

  ## THE DECISION TREE

  Start at the **Root**. Follow the path that matches your intuition about the cases provided.

  ### ROOT: The Core Contractualist Claim
  > **Principle:** An act is wrong if it violates a principle that an affected individual could **reasonably reject**.
  > **Test Case:** *The Single Victim.* One person will lose their life if you act. They can say, "This principle kills me." Is that rejection reasonable? **Yes.**

  ---

  ### SPLIT 1: The Role of Numbers
  **Question:** Does the *number* of people affected change whether a rejection is "reasonable"?

  *   **PATH A: NO (Strict Pairwise).** I compare the complaint of the One against the complaint of *one* of the Five. The fact that there are five of them doesn't make my rejection less reasonable.
  *   **PATH B: YES (Number-Sensitive).** The fact that five people suffer makes the principle harder to defend. Numbers change the weight of the rejection.

  ---

  ### PATH A: STRICT PAIRWISE (Numbers Don't Count)
  *You believe we compare the One vs. a Single Representative of the Five.*

  #### ➔ Node A1: How do we break the tie?
  If the One's harm (death) equals the Five's harm (death), and numbers don't count, the complaints are identical. How do you choose?

  *   **Leaf 1: The Randomizer.**
      *   **View:** Since neither side can reasonably reject a coin flip, you flip.
      *   **Case:** *The Trolley.* 1 on left track, 5 on right. You flip a coin.
      *   **Intuition:** "I can't say the Five matter more, but I can't kill the One arbitrarily either."
  *   **Leaf 2: The Non-Numerical Tiebreaker.**
      *   **View:** Numbers don't count, but other factors do (e.g., who is worse off, who is responsible, or "save the one in front of you").
      *   **Case:** *The Hikers.* 5 need water, 1 has water. You give it to the one who is closest or the one who brought the water.
      *   **Intuition:** "Numbers aren't moral weights. Proximity or ownership decides."

  ---

  ### PATH B: NUMBER-SENSITIVE (Numbers Do Count)
  *You believe the group's size affects the reasonable rejectability.*

  #### ➔ Node B1: How does aggregation work?
  *If numbers count, **how** do they enter the calculation?*

  *   **Branch B1.1: Weighted Comparison.**
      *   **Mechanism:** We add up the "complaint strength." 5 complaints of "I die" outweigh 1 complaint of "I die."
      *   **Leaf 3: The Global Aggregator.**
          *   **View:** Aggregation applies everywhere (Rescue and Distribution).
          *   **Case:** *The Kidneys.* 1 healthy person has 5 kidneys. 5 patients need 1 each. You take all 5 kidneys.
          *   **Intuition:** "Five lives are mathematically more important than one, even in surgery."
      *   **Leaf 4: The Threshold Aggregator.**
          *   **View:** Aggregation only works for *small* harms. You can aggregate headaches to outweigh a headache, but not headaches to outweigh death.
          *   **Case:** *The Noise vs. Life.* 1,000 people have a mild headache vs. 1 person dies. You save the life. 1,000 people have a mild headache vs. 1 person has a mild headache. You save the 1,000.
          *   **Intuition:** "Numbers matter for inconveniences, not for fundamental rights."

  *   **Branch B1.2: Collective Principle.**
      *   **Mechanism:** The Five form a "collective agent." It's not 5 vs. 1; it's "The Group" vs. "The Individual."
      *   **Leaf 5: The Collective Voice.**
          *   **View:** A group can reject a principle together in a way an individual cannot.
          *   **Case:** *The Stranded Hikers.* 5 need 1 cup of water each. 1 has 5 cups. The 5 speak as a bloc: "Our collective death is rejectable."
          *   **Intuition:** "There is strength in numbers; their joint rejection overrides the individual's."

  *   **Branch B1.3: Domain Specific.**
      *   **Mechanism:** Aggregation is permitted in some contexts but forbidden in others.
      *   **Leaf 6: The Separate Spheres View.**
          *   **View:** Aggregation works in **Rescue** (emergency, external threat) but not **Distribution** (resource allocation, bodily integrity).
          *   **Case:** *Rescue:* Trolley Problem → Save the 5. **Distribution:** Kidney Case → Do not take the 5 kidneys.
          *   **Intuition:** "In an emergency, we count heads. In medical distribution, the individual body is a fortress."

  ---

  ### THE EMPTY LEAVES (Incoherent or Unstable Positions)

  *   **Leaf 7: The Reverse Separate Spheres (Empty).**
      *   **Position:** Aggregation is permitted in **Distribution** (take the kidneys) but forbidden in **Rescue** (let the 5 on the track die).
      *   **Why Empty?** This violates the intuition of *urgency*. If numbers aren't strong enough to justify killing one in an emergency (where stakes are highest), they logically cannot justify violating bodily integrity in a calm medical setting. It is theoretically unstable; anyone holding this usually collapses into Leaf 3 or Leaf 6 upon reflection.
      *   **Status:** **Incoherent.**

  *   **Leaf 8: The Static Number View (Empty).**
      *   **Position:** Numbers change the *outcome* (you save the five) but do not change the *reasonable rejectability* (the One's rejection is still valid).
      *   **Why Empty?** This contradicts the Root Definition. If the One's rejection is still "reasonable," the act is wrong. If you do it anyway, you have abandoned contractualism for utilitarianism.
      *   **Status:** **Definitionally Impossible.**

  ---

  ## SEMINAR DISCUSSION NOTES

  ### 1. Indistinguishable Pairs (The "Black Box" Problem)
  **Leaf 3 (Global Aggregator)** and **Leaf 5 (Collective Voice)** often produce the same results in practice.
  *   **The Problem:** In the *Hiker Case*, both views say "Take the water."
  *   **The Difference:** Leaf 3 says "5 deaths > 1 death." Leaf 5 says "The Group's Voice > The Individual's Voice."
  *   **Discussion Question:** Does the *reason* matter if the *result* is the same? If the One hiker asks, "Why me?", is "Because there are more of them" (Leaf 3) a better answer than "Because they spoke together" (Leaf 5)?

  ### 2. The Kidney Intuition Test
  Use the *Kidney Case* (1 healthy, 5 sick) to separate **Leaf 3** from **Leaf 6**.
  *   If you say "Take the kidneys," you are a **Global Aggregator (Leaf 3)**. You treat bodies like resources.
  *   If you say "Do not take the kidneys," but you *would* switch the Trolley, you are a **Separate Spheres View (Leaf 6)**.
  *   *Note:* Most people intuitively land on Leaf 6, but struggle to explain *why* the logic changes between the Trolley and the Kidney without just saying "it feels different."

  ### 3. The Threshold Trap
  **Leaf 4 (Threshold Aggregator)** is the hardest to defend consistently.
  *   **Challenge:** Where is the line? If 1,000 headaches outweigh 1 headache, does 1,000,000 headaches outweigh 1 death?
  *   **Discussion Question:** If you admit numbers matter for small harms, can you logically stop them from mattering for large harms? Or does admitting aggregation at all force you down to Leaf 3?

  ---

  ## QUICK REFERENCE: CASE INTUITIONS

  | Case | Scenario | Tests |
  | :--- | :--- | :--- |
  | **The Trolley** | 1 on track vs. 5 on track. Switch? | **Rescue.** Tests basic aggregation. |
  | **The Kidneys** | 1 healthy (5 kidneys) vs. 5 sick (need 1). Harvest? | **Distribution.** Tests bodily integrity vs. numbers. |
  | **The Hikers** | 1 has 5 cups (needs 1) vs. 5 have 0 (need 1). Take? | **Resource.** Tests ownership vs. survival aggregation. |
  | **The Headaches** | 1,000 mild headaches vs. 1 death. Prevent death? | **Threshold.** Tests if small harms sum to large harms. |

  ---

  **Instructor Tip:** If your group gets stuck, ask them to argue *against* their own position using the *Kidney Case*. If they support saving the 5 in the Trolley, ask them why they wouldn't harvest the kidneys. The gap between those two answers is where the theory lives.
