answer: |-
  **Subject:** Re: The Ontological Status of Cold War Origins and the Category Error of Blame

  **To:** Doctoral Seminar on Historiographical Method
  **From:** [Your Name/Researcher]
  **Date:** 24 May 2024

  **I. Introduction: The Category Error of Moral Psychology in Macro-History**

  The proposition that the question "who started the Cold War?" retains analytical utility rests upon a fundamental category error. It imports the framework of individualistic moral psychology—specifically, the attribution of culpability based on intent and temporal priority—into a domain governed by systemic, multi-agent historical processes. To ask who *started* the conflict is to presume that the Cold War was a discrete event with a singular genesis, akin to a fistfight in a pub, rather than an emergent property of a fractured international system. In this submission, I argue that historians of international relations must abandon the paradigm of blame in favour of a framework of "distributed institutional responsibility." This approach shifts the analytical gaze from the identification of a primary culpable party to an examination of the structural conditions that rendered escalation rational for each side at successive decision nodes. By doing so, we move beyond the sterile empiricism of assigning fault and towards a robust understanding of the architectural constraints that made confrontation the path of least resistance.

  **II. The Metaphysical Premise of Cold War Historiography**

  To demonstrate the necessity of this shift, one must first interrogate the existing historiographical landscape. The tripartite division of Cold War scholarship—comprising the Traditionalist, Revisionist, and Post-revisionist schools—is typically understood as an empirical dispute over archival evidence. Traditionalists locate the genesis of the conflict in Soviet expansionism and ideological fanaticism; Revisionists locate it in American economic imperialism and the quest for open markets; Post-revisionists, seeking a synthesis, often point to mutual misunderstanding or a security dilemma spiralling out of control.

  However, to adjudicate between these schools on empirical grounds is to miss the deeper methodological flaw they share. All three schools operate under the same flawed metaphysical premise: the assumption of unitary state agency. They treat the United States and the Soviet Union as monolithic actors capable of forming singular intentions, akin to individual moral agents. When a Traditionalist argues that Stalin "chose" confrontation, or a Revisionist argues that Truman "imposed" it, both are engaging in a form of methodological individualism scaled up to the level of the state. They presume that the state possesses a coherent will that can be judged morally.

  This premise is ontologically unstable. States are not individuals; they are complex aggregations of competing bureaucracies, domestic political pressures, ideological formations, and systemic constraints. By framing the debate as a search for the "guilty" party, all three schools obscure the institutional architectures that limited the available choices for leaders on both sides. Even if we were to resolve the empirical disputes between these schools—say, by proving definitively that Truman acted before Stalin—the conceptual problem would remain intact. We would merely have identified the first domino without explaining why the dominos were standing so precariously in the first place. The search for a singular initiator is therefore a distraction from the more profound historical reality: that the system itself was primed for collision.

  **III. Initiatory versus Enabling Causation**

  To rectify this, we must introduce a conceptual distinction between "initiatory causation" and "enabling causation." Initiatory causation refers to the discrete event or decision that triggered the first overt hostile move—the specific speech, the specific treaty, the specific mobilisation. It is the spark. Enabling causation, conversely, refers to the institutional and diplomatic architectures that transformed discrete moves into an irreversible systemic confrontation. It is the dry tinder and the oxygen.

  In macro-history, blame, if it is to be applied at all, should attach primarily to the maintenance of enabling conditions rather than to initiatory acts. An initiatory act is often a rational response to immediate pressures; it is the symptom, not the disease. The enabling conditions are the disease. These conditions include the bipolar vacuum left by the collapse of the European great powers, the incompatibility of liberal capitalist and command socialist economic systems, and the domestic political imperatives that punished conciliation in both Washington and Moscow.

  Focusing on initiatory causation leads to a history of "what if?"—counterfactuals regarding whether a different leader might have averted disaster. Focusing on enabling causation leads to a history of "how?"—an analysis of how the structure of the post-war order made disaster the most probable outcome regardless of individual intent. Responsibility, therefore, is not located in the hand that pulled the trigger, but in the design of the room that made pulling the trigger the only perceived route to survival. This is the essence of distributed institutional responsibility: it acknowledges that multiple actors contributed to the construction of the trap, even if they did not intend to spring it.

  **IV. Application to the Sequence of 1945–1947**

  We may illustrate this framework by reconsidering the critical sequence of 1945 to 1947, encompassing the breakdown of the Grand Alliance, the articulation of the Truman Doctrine, and the implementation of the Marshall Plan. Under the traditional blame paradigm, historians argue endlessly over which of these constitutes the "start." Was it the Soviet consolidation of Eastern Europe? Was it the Truman Doctrine's universalist rhetoric? Was it the Marshall Plan's economic division of the continent?

  Through the lens of enabling causation, none of these are moral starting points; they are successive manifestations of a structural logic. The breakdown of the Grand Alliance was not a betrayal by one side, but the dissolution of a coalition whose only cohesive force was the existential threat of Nazism. Once that threat was removed, the enabling condition of ideological incompatibility reasserted itself. The alliance did not break because Stalin or Truman willed it; it broke because the institutional architecture of the alliance had no mechanism for managing peace between opposing socio-economic systems.

  Similarly, the Truman Doctrine is often cited by Revisionists as the moment of American aggression, or by Traditionalists as the necessary response to Soviet pressure. However, viewed structurally, it was a rational adaptation to a vacuum of power. The enabling condition here was the collapse of British hegemony in the Mediterranean and the perceived instability of Western European capitalism. Given the domestic political architecture of the United States—which demanded anti-communism to secure funding—the Truman administration had little choice but to frame local conflicts in universalist terms to secure congressional support. The "hostile move" was less a choice than a requirement of the American political system operating within a bipolar environment.

  Finally, the Marshall Plan is frequently debated as either a benevolent recovery programme or a tool of economic imperialism. Yet, under the framework of distributed institutional responsibility, it represents the crystallisation of the enabling conditions. By offering aid to all of Europe (including the Soviet sphere) but attaching conditions incompatible with Soviet economic control, the United States did not necessarily "start" the division; rather, it exposed the existing fracture. The Soviet rejection of the Plan was not an initiatory act of hostility, but a structurally determined necessity to maintain control over its buffer zone. To blame the US for offering the plan, or the USSR for rejecting it, is to mistake the rational actions of agents within a system for the cause of the system itself. The responsibility lies in the fact that the post-war order was constructed without a viable mechanism for integrating these two spheres.

  **V. Conclusion: Towards a Structural Historiography**

  In conclusion, the question "who started the Cold War?" ought to be abandoned not because the answer is difficult to find, but because the question itself is malformed. It presupposes a moral universe where states act as individuals, and where history turns on the culpability of specific decision-makers. This obscures the deeper reality of distributed institutional responsibility. By shifting our focus from initiatory causation to enabling causation, we acknowledge that the Cold War was not started; it emerged. It was the product of a specific configuration of institutional architectures, security dilemmas, and ideological imperatives that made escalation rational for all parties involved.

  For the doctoral researcher, this implies a methodological shift. We must stop looking for the villain in the archives and start mapping the architecture of the trap. We must analyse how institutions constrain choice, how domestic politics filter systemic pressures, and how rational decisions accumulate to produce catastrophic outcomes. Only by abandoning the metaphysics of blame can we arrive at a historiography capable of explaining not just who moved first, but why the board was set for a game that no one could win.
