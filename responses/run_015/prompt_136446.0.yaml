  2.  **Deconstruct Task 1: Mapping the Players:**
      *   *My Lai (Actual):* US Soldiers (Combatants) vs. Villagers (Noncombatants).
      *   *MEC View:* Combatants have permission to kill enemy combatants. Noncombatants have immunity.
      *   *Killability Evidence:* Uniforms, weapons, hostile act/intent.
      *   *My Lai Reality:* No enemy unit. No fire taken. Villagers unarmed.
      *   *MEC Verdict:* Permission is zero. Liability is zero. The thesis isn't empty; it's decisive. It says "no killing permitted." The equality exists between US soldiers and VC soldiers, not US soldiers and villagers.
      *   *Counterfactual (Part-time Guerrilla Hamlet):* US Soldiers vs. Mixed Population (Some VC, some civilians).
      *   *MEC View:* VC members are combatants (liable). Civilians are not (immune).
      *   *Killability Evidence:* Carrying weapons, engaging in hostile acts, direct participation in hostilities.
      *   *Problem:* Identification is hard.
      *   *MEC Verdict:* Permission exists *only* against identified combatants. Uncertainty defaults to immunity (usually).

  3.  **Deconstruct Task 2: The Identifiability Wrinkle:**
      *   *Issue:* Permission seems indexed to empirical identification. If the enemy hides, does permission vanish?
      *   *Option 1 (Threshold):* Permission disappears below identifiability threshold. (MEC supports this: if you can't distinguish, you can't target).
      *   *Option 2 (Scaling/Expected Value):* Kill based on probability. (MEC generally rejects this regarding individual liability; you can't kill innocents based on stats).
      *   *Option 3 (Transfer/Forfeiture):* Civilians lose protection because VC hide among them. (This is the "human shield" argument).
      *   *MEC Stance:* Walzerian MEC is strict on noncombatant immunity. Option 3 is usually rejected unless civilians voluntarily shield. Mere presence isn't forfeiture. So, Option 1 is the closest fit, but it creates a "warfare paradox" (COIN becomes impossible under strict rules). The thesis doesn't support Option 3 as a blanket rule; that violates the core symmetry of immunity.

  4.  **Deconstruct Task 3: The "Identification Budget" Fix:**
      *   *Idea:* Permission is capped by identification capacity. Overspend falls on innocents.
      *   *Critique:* This sounds like a utilitarian calculation (collateral damage ratios) disguised as status.
      *   *Collapse:* Yes, it collapses. If permission depends on a "budget" derived from empirical conditions, it stops being purely status-based. It reintroduces consequences/outcomes. If the budget is "how many mistakes we can afford," that's *jus in bello* proportionality, not MEC.
      *   *Just Cause:* It doesn't necessarily let *jus ad bellum* (justice of the war) back in, but it lets *consequentialism* back in. The user worries about *just cause*. The real risk is that the "budget" implies the state of the war (COIN vs. conventional) alters individual liability. MEC says liability is binary (combatant/noncombatant). A budget makes it fluid. So yes, it undermines the status-based core.

  5.  **Deconstruct Task 4: What My Lai Does to the Theory:**
      *   *COIN Silence:* The theory isn't silent, it's restrictive. It says COIN is morally hazardous because it violates the distinction required for MEC to function.
      *   *Scapegoating:* Does MEC explain why Calley was singled out? MEC says individual combatants are responsible for their own violations. Command responsibility is separate. So MEC supports individual liability. The public's feeling (scapegoat) contradicts MEC's focus on individual agency. MEC says: If you killed noncombatants, you are liable, regardless of what others did.
      *   *Psychology:* MEC is normative, not descriptive. It doesn't care about fear or anger. It sets the bar. It has nothing to say about *why* they did it, only that it was forbidden.

  6.  **Drafting - Section by Section (aiming for density and discipline):**

      *   *Intro:* Brief setup.
      *   *Mapping:* Distinguish My Lai (clear violation) from Counterfactual (identification problem). Define "killable" under MEC (dangerous + identifiable).
      *   *Wrinkle:* Address the three options. MEC favors Threshold (Option 1). Option 3 is rejected (collective punishment).
      *   *Budget:* Analyze the fix. It collapses into consequentialism. It undermines status-based liability.
      *   *Aftermath:* Theory isn't silent, it's prohibitive. Scapegoating is external to MEC (which demands individual accountability). Psychology is irrelevant to liability.

  7.  **Refining and Polishing (Checking Constraints):**
      *   *Word Count:* Need to monitor. Aim for ~1000.
      *   *Tone:* Analytical, disciplined, no fluff.
      *   *Specifics:* Ensure the "part-time guerrilla" case is addressed. Ensure the "identification budget" critique is sharp.
      *   *MEC Nuance:* Ensure I don't confuse MEC (equality of combatants) with Discrimination (combatant/noncombatant distinction), though they are linked in Walzer's framework. The prompt links them ("meant to be one piece with noncombatant immunity"). I must treat them as the integrated Walzerian package.
      *   *Correction on MEC:* MEC specifically says *combatants* on both sides have equal right to kill. Noncombatant immunity is the corollary. At My Lai, there were no enemy combatants. So MEC doesn't grant permission. It's not that the thesis is empty; it's that the conditions for its application (combatant vs combatant) weren't met, triggering the immunity clause instead.
      *   *The "Wrinkle":* The user asks if the enemy hiding switches off permission. Under Walzer, if you can't distinguish, you can't shoot. So yes, it switches off permission. Option 3 (forfeiture) is the "supreme emergency" or "human shield" exception, but standard MEC rejects blanket forfeiture.
      *   *The "Budget":* This is a clever philosophical construct. I need to show why it fails the "status" test. Status is intrinsic to the person (combatant/non), not a resource pool.
      *   *Aftermath:* Calley's trial. MEC supports individual liability. The "scapegoat" narrative suggests systemic guilt, which MEC resists (it focuses on the actor).

