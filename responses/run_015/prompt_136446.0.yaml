answer: |-
  1. **The Mapping**
  Under the thesis you describe, the "players" are defined by status, not behavior. A combatant is liable to be killed because they are a dangerous instrument of a political will; a noncombatant is immune because they are not. At My Lai, the mapping is brutally clear. The US soldiers were combatants. The villagers were noncombatants. There were no VC combatants present. Therefore, the thesis is not empty; it is prohibitive. The permission to kill is indexed to the presence of an opposing combatant. Since there were none, the permission was zero. Evidence of killability would have required uniforms, weapons, or hostile acts. None existed. The thesis dictates that killing there was murder, full stop.

  The counterfactual hamlet is the stress test. Here, the population is mixed: farmers by day, guerrillas by night. The US soldiers are combatants. The part-time VC are also combatants (liable) because they are dangerous participants. The pure civilians are immune. The option set for the soldier is: engage only identified combatants, or refrain. The thesis does not permit engaging the "hamlet" as a target; it permits engaging only the identified individuals within it. Evidence of killability remains specific: carrying a weapon, digging a trap, firing a shot. Mere presence in a hostile area is insufficient. The thesis demands a distinction that the empirical reality obscures. It does not dissolve the distinction because the reality is messy; it insists the distinction holds regardless.

  2. **The Identifiability Wrinkle**
  You are not smuggling anything in; the permission is indeed indexed to identifiability. The thesis grounds liability in dangerousness, but dangerousness must be manifest to be targeted legitimately. If the enemy hides, they do not cease to be combatants morally, but they become inaccessible legally under the rules of engagement derived from the thesis.

  Of your three options, the thesis supports the first: permission disappears when identifiability drops below a threshold. This is the core of noncombatant immunity. You cannot kill what you cannot distinguish. The second option (scaling/expected value) is utilitarian; it treats civilians as collateral rather than rights-bearers. The thesis rejects this; immunity is a right, not a statistical variable. The third option (forfeiture/transfer) is the human shield argument. The thesis generally rejects this unless the civilians voluntarily assume the risk. Mere proximity forced by the guerrillas does not strip civilians of immunity. To argue otherwise is to punish the immune for the actions of the liable, which breaks the symmetry the thesis protects. So, yes, the enemy can switch off your permission by hiding. This makes counterinsurgency morally hazardous under this framework, but the theory accepts that cost rather than compromise immunity.

  3. **The Identification Budget**
  Your "identification budget" is a sophisticated attempt to quantify uncertainty, but it collapses. It fails because it converts a deontological status into a consequentialist resource. Under the thesis, liability is binary: you are either a combatant (liable) or you are not (immune). There is no middle ground where I have "permission credits" to spend on probable combatants.

  If you introduce a budget, you are no longer judging the kill by the status of the victim, but by the aggregate outcome of the operation. This does not necessarily let *just cause* (the justice of the war) back in, but it lets *consequentialism* in through the side door. It implies that if the war is important enough, the budget expands. More critically, it suggests that the "overspend" (killing innocents) is absorbable. The thesis says it is not. Each killing requires its own justification based on the victim's status. You cannot offset the killing of an immune person with the killing of a liable one. The budget fix dissolves the individual moral boundary the thesis is built to protect. It turns immunity into a quota system, which is incompatible with the idea that noncombatants have a right not to be killed.

  4. **What the Case Does to the Theory**
  My Lai does not show the theory is silent on counterinsurgency; it shows the theory is restrictive. It says that if you cannot fight a counterinsurgency without killing noncombatants, you cannot fight it legitimately under these rules. The theory goes silent only on how to win such wars, not on how to fight them.

  Regarding the scapegoat reaction: the thesis supports Calley's conviction, not the public's discomfort. The thesis is individualistic. It holds that each soldier is a moral agent responsible for their own violations. The fact that "plenty of men did the same thing" is irrelevant to individual liability; if anything, it suggests a systemic breakdown, but it does not absolve the individual. The public's feeling that Calley was a scapegoat implies a belief in shared systemic guilt that the thesis marginalizes. The thesis cares about the act, not the culture that produced it.

  Finally, the theory has nothing to say about the psychology of the soldiers. Fear, anger, and the stress of an invisible enemy are explanatory factors, not justificatory ones. The thesis is normative, not descriptive. It sets the bar for what is permitted, not what is understandable. It acknowledges that war is hell, but insists that hell does not suspend the distinction between combatant and noncombatant. If the pressure of an invisible enemy causes soldiers to kill civilians, the theory says that is a crime, not a tragedy of war. It offers no comfort for the soldier's dilemma, only a judgment on the outcome.
