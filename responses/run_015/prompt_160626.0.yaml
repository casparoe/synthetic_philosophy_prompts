prompt: |-
  I'm the tech lead on a six-person team building the scheduling brain for a regional home-care agency — every morning it decides which of about 400 clients get a visit that day from whoever actually showed up, and seperately it reads free-text messages from clients and decides whether to escalate something to a family member or a nurse. My own grandmother is on the client list in one of the pilot counties, which is sort of how I ended up volunteering to write the part of the design doc we call "the values section." We hit one of these decisions about once a sprint, there are ~30 of them stacked up in the backlog for the pilot, and the reviewers are me, two engineers, a PM, a nurse manager, and the agency's counsel — nobody with philosophy training, and counsel has to be able to defend whatever we write in one page. Two hard constraints: we can only get a human on roughly 3% of decisions (the agency won't pay for more, and past that point the product doesn't save them money), and every decision needs a short logged reason string, which I've noticed is often not the real reason the model did what it did.

  What I need is a procedure, not a list of principles. Something my team can run in an hour on a backlog item, and that outputs one of three things: a rule we can actually put in a spec, a "defer to a named human" instruction, or a "don't ship this decision at all." The part I keep getting stuck on — and the reason the usual AI-ethics advice hasn't helped — is that most of our hard cases aren't "what's the right thing to do" but "who gets to say what the right thing is." The client's stated wishes, the family's wishes, what the nurse manager thinks is clinically indicated, what the agency is willing to be liable for, and what the county contract requires can come apart, and I've started calling the points where they come apart value handoffs. So I want the procedure to force us to name, for each decision, whose values are authoritative, what happens when two of them conflict, and what the system does when the spec runs out — abstain, escalate, or pick a default and log it. The same build also ships in two counties with visibly different norms about family notification, so the procedure has to tell us what's fixed in the spec, what's a config knob, and who is allowed to turn the knob.

  Give me the ordered questions, what counts as an adequate answer to each, where the procedure just says no, and where it has to stop and hand the question to a person — and be explicit that those last two are different moves. Then run it on three backlog items: (1) 40 clients, 25 slots, and the choice between prioritizing whoever is worst off today, whoever deteriorates fastest without a visit, and whoever's missed visit is most likely to turn into a hospital bill; (2) a client messages that she's stopped eating and says "please dont tell my daughter," and the system has to decide whether to notify anyone; (3) a case where the honest answer is that we shouldn't ship the decision at all, or that our 3% deferral budget can't cover it — tell me which, because I'd rather hear it now than at the pilot review. I also want the part where you're honest about what the procedure can't do: the cases where any rule we write is just one engineer's intuition with a reason string bolted on, and how I should document those so we're not pretending otherwise. One thing I remember from a philosophy elective is that people distinguish building ethical rules in top-down from getting them out of data, and a friend who works on alignment keeps telling me I should make the system track moral uncertainty — if either of those actually changes what goes in my spec, say how, and if they're unusable at my granularity, say that too. Answer in American English please, and no reading lists or citations — I need something I can paste straight into a design doc.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Tech Lead on a 6-person team building a scheduling/triage system for home care.
      *   **Context:** 400 clients, daily scheduling + message triage. Grandmother is a client (personal stake).
      *   **Constraints:**
          *   Human review budget: ~3% of decisions (hard financial cap).
          *   Logging: Every decision needs a short reason string (often inaccurate regarding model internals).
          *   Reviewers: Tech Lead, 2 Engineers, PM, Nurse Manager, Agency Counsel (no philosophers).
          *   Output: 1-page defensible spec for counsel.
          *   Scale: ~30 backlog items, need a 1-hour procedure per item.
          *   Geography: 2 counties with different norms (configurability needed).
      *   **Core Problem:** "Value Handoffs" (conflicts between client, family, nurse, agency, contract). Need to define authority, conflict resolution, and fallback behavior.
      *   **Deliverable:** An ordered procedure (questions + adequate answers + stop conditions), applied to 3 specific backlog items, plus a section on limitations (intuition vs. rules, top-down vs. data, moral uncertainty).
      *   **Tone:** American English, practical, no citations/reading lists, paste-ready for a design doc.

  2.  **Deconstruct the Procedure Design:**

      *   *Goal:* Move from vague ethical worry to concrete spec logic.
      *   *Structure:* Needs to be a checklist or flow that forces specific answers.
      *   *Key Differentiator:* Distinguish between "No" (Don't ship) and "Defer" (Send to human). These are often conflated but have different resource implications.
      *   *Authority:* Must explicitly name *whose* value wins.
      *   *Configurability:* Must identify what is hard-coded vs. county-configurable.
      *   *Fallback:* What happens when the rule doesn't fit? (Abstain, Escalate, Default).

      *   *Drafting the Questions:*
          1.  **Authority:** Who owns this decision? (Client, Contract, Clinical, Agency Risk).
          2.  **Conflict:** What if Authority A disagrees with Authority B? (Hierarchy).
          3.  **Variability:** Does this change by county/regulation? (Config vs. Code).
          4.  **Budget:** Can we afford the human review if this goes wrong? (3% cap).
          5.  **Explainability:** Can we write a truth-adjacent reason string?
          6.  **Stop Conditions:** When do we say "No" vs. "Defer"?

  3.  **Developing the "Stop Conditions":**

      *   *Stop & Don't Ship:* If the risk is catastrophic (death/liability) and automation can't guarantee safety, or if the "reason string" would be legally deceptive.
      *   *Stop & Defer:* If the case is rare enough to fit in the 3% budget but too complex for a rule.
      *   *Proceed:* If rules are clear, authority is defined, and budget holds.

  4.  **Applying to Backlog Items:**

      *   *Item 1 (Scheduling Triage):* 40 clients, 25 slots. Criteria: Worst off vs. Deterioration vs. Cost.
          *   *Analysis:* This is resource allocation. "Worst off" is vague. "Hospital bill" is agency interest. "Deterioration" is clinical.
          *   *Conflict:* Agency cost vs. Client health.
          *   *Verdict:* Likely needs a weighted score, but who defines weights? Counsel needs to know liability. If the model optimizes for cost, is that defensible?
          *   *Decision:* Ship with configured weights, but "Worst off" is too subjective. Use "Clinical Risk Score" (Nurse Manager authority).
      *   *Item 2 (Message Triage):* "Stopped eating, don't tell daughter."
          *   *Analysis:* Autonomy vs. Safety. HIPAA/Privacy vs. Duty of Care.
          *   *Conflict:* Client wish vs. Nurse/Counsel risk assessment.
          *   *Verdict:* High risk. "Stopped eating" is a red flag. Ignoring it is liability. Telling daughter violates trust/HIPAA unless incapacity is proven.
          *   *Decision:* Defer to Human (Nurse). This burns budget. If budget is full, Don't Ship (flag for manual review queue outside the 3% auto-decision flow). Actually, the prompt asks to choose between "Don't Ship" or "Budget can't cover." If *every* "stopped eating" message is deferred, does it fit 3%? Probably not. So, Rule: Escalate to Nurse (Human), but if volume > 3%, system flags for *mandatory* manual queue (not part of the auto-budget). Let's refine: The procedure should identify if this *type* of decision exceeds the 3% budget. If "stopped eating" happens 10% of the time, we can't defer all. We need a rule. Rule: Safety > Privacy. Notify Nurse.
      *   *Item 3 (The "Don't Ship" case):* Need a scenario where automation is inappropriate.
          *   *Analysis:* Maybe end-of-life scheduling? Or a conflict where the contract contradicts the law? Let's pick something where the "reason string" requirement forces a lie. Or where the 3% budget is mathematically impossible to cover for the risk level.
          *   *Decision:* Let's use a case where the inputs are too noisy to justify *any* automated decision without exceeding risk tolerance. E.g., "Detecting abuse based on tone."
          *   *Refinement:* The prompt asks for a case where "we shouldn't ship... OR our 3% budget can't cover it." Let's choose the budget constraint. If 10% of cases need human review, but we only have 3%, we can't ship the *automated* version. We must ship a "flag for human" version, which means the *decision* isn't automated. So the "decision" to automate is a "No."

  5.  **Addressing the "Philosophy/Alignment" Questions:**

      *   *Top-Down vs. Data:* At this granularity (spec rules), top-down (policy) is required. Data-driven (RLHF) is opaque and hard to defend to counsel.
      *   *Moral Uncertainty:* Tracking uncertainty is good for engineering (confidence scores), but "moral uncertainty" is hard to log as a "reason string." Use confidence thresholds for escalation instead.
      *   *Intuition:* Acknowledge that some weights are arbitrary. Document them as "Policy Parameters" not "Optimized Truth."

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Direct, procedural, bureaucratic but honest.
      *   *Format:* Numbered lists, bold text for emphasis, clear sections.
      *   *Constraint Check:* 1-hour meeting friendly? Yes. Distinguishes "No" vs "Defer"? Yes. Addresses County Config? Yes. Addresses Reason Strings? Yes.

      *(Self-Correction during drafting Item 2)*: Item 2 is tricky. "Don't tell my daughter." If we tell the nurse, is that "telling the daughter"? No. But if the nurse decides to tell the daughter, that's a human decision. The system's decision is "Escalate to Nurse" vs "Log and Ignore." Given "stopped eating," ignoring is negligent. So the system *must* escalate. Does this fit 3%? If "stopped eating" messages are rare, yes. If common, no. I will assume for the exercise that this specific keyword trigger is rare enough, but note the risk. Actually, better to highlight the *conflict*. The system cannot resolve the Privacy vs. Safety conflict automatically. It *must* defer. If the volume of deferrals breaks the 3% cap, the feature doesn't ship.

      *(Self-Correction on Item 3)*: Make it clear why the budget fails. E.g., "Ambiguous family conflict." If 20% of clients have family conflict, and all need review, 3% is impossible. Therefore, do not automate the resolution.

      *(Refining the "Procedure"):* Make sure the "Authority" question is first. That's the user's main pain point ("Value Handoffs").

      *(Refining "Limitations"):* Be blunt. The reason string is a legal shield, not a technical explanation. Acknowledge that.

  7.  **Final Review against constraints:**
      *   American English? Yes.
      *   No citations? Yes.
      *   Paste-ready? Yes.
      *   Addresses "Value Handoffs"? Yes.
      *   Addresses County Config? Yes.
      *   Addresses 3% budget? Yes.
      *   Addresses Reason String honesty? Yes.

  8.  **Final Polish:** Ensure the distinction between "Defer" (send to human within the 3% flow) and "Don't Ship" (remove from automation entirely) is sharp. "Defer" consumes budget. "Don't Ship" acknowledges the automation is unsafe/impossible.

      *Wait, one nuance:* The prompt asks for "Defer to a named human" OR "Don't ship this decision at all."
      *   *Defer:* The system says "I don't know, Human X decides." This counts as a decision output, but consumes the 3% budget.
      *   *Don't Ship:* The system does not make this decision. It passes data to a legacy workflow or requires 100% human review (outside the automation budget).
      *   *Item 3:* Needs to show a case where the 3% budget *can't cover it*. If 10% of cases need review, and we only have 3%, we can't use the "Defer" path for all of them. We must "Don't Ship" the automation for this class of decisions.

      *Let's write it.*
answer: |-
  # Procedure: Value Handoff & Automation Authority Review

  **Purpose:** Convert ethical ambiguity into spec logic, config parameters, or explicit deferrals.
  **Timebox:** 60 minutes per backlog item.
  **Attendees:** Tech Lead, PM, Nurse Manager, Counsel. (Engineers optional unless technical feasibility is disputed).
  **Output:** One of three states: **SHIP (Rule)**, **DEFER (Human-in-the-Loop)**, or **NO-SHIP (Manual Process)**.

  ---

  ## Part 1: The Procedure (Ordered Questions)

  Run these questions in order. If you cannot answer a question adequately, you cannot move to the next. If you fail a "Stop Condition," the meeting ends with that decision.

  ### 1. The Authority Question
  **Question:** Whose value judgment is legally and clinically authoritative for this specific decision?
  **Adequate Answer:** A single role or document (e.g., "The Client's Advance Directive," "County Contract Section 4.B," "Nurse Manager's Clinical Triage Protocol").
  **Inadequate Answer:** "A balance of," "The model decides," or "Whatever is safest."
  **Stop Condition:** If you cannot name one authoritative source, mark as **NO-SHIP**. (The system cannot arbitrate between equal authorities).

  ### 2. The Conflict Question (Value Handoff)
  **Question:** What happens when the Authority in Q1 conflicts with a secondary stakeholder (e.g., Family, Agency Cost, County Norm)?
  **Adequate Answer:** A strict hierarchy (e.g., "Client Autonomy > Family Preference," or "County Contract > Client Preference").
  **Config Check:** Does this hierarchy change between County A and County B?
  *   **Yes:** This logic must be a **Config Knob**. Document who holds the key (e.g., "Agency Counsel updates JSON per county").
  *   **No:** This logic is **Hard-Coded**.
  **Stop Condition:** If the hierarchy is situational ("It depends on how angry the family is"), mark as **DEFER**. (The model cannot evaluate situational nuance within budget).

  ### 3. The Budget Question (3% Cap)
  **Question:** If we mark this as **DEFER**, what percentage of total daily decisions will require human review?
  **Adequate Answer:** A data-backed estimate (e.g., "Historical data shows 1.5% of messages contain these keywords").
  **Stop Condition:**
  *   If Estimated Volume > 3%: Mark as **NO-SHIP**. (You cannot afford to automate a decision you can't afford to review).
  *   If Estimated Volume ≤ 3%: Mark as **DEFER**. Assign to a specific role (e.g., "Triage Nurse").

  ### 4. The Reason String Question
  **Question:** Can we write a logged reason string that is truth-adjacent and defensible in court?
  **Adequate Answer:** A string that matches the rule in Q1/Q2 (e.g., "Escalated per Protocol 4.B: Client Safety Overrides Privacy").
  **Inadequate Answer:** A string that hides the real logic (e.g., Logging "Client Request" when the real reason is "Liability Mitigation").
  **Stop Condition:** If Counsel advises the truthful reason string creates unacceptable liability, mark as **NO-SHIP**. (Do not build a system that requires logging lies).

  ### 5. The Fallback Question
  **Question:** If the model confidence is low, or the input data is missing, what is the default?
  **Adequate Answer:** One of: **Abstain** (No decision made), **Escalate** (Consume 3% budget), or **Safe Default** (e.g., "Schedule Visit").
  **Constraint:** "Safe Default" must be defined by the Nurse Manager, not Engineering.

  ---

  ## Part 2: Application to Backlog Items

  ### Item 1: Scheduling Triage (40 Clients, 25 Slots)
  *Criteria: Worst-off vs. Deterioration Rate vs. Hospitalization Cost.*

  1.  **Authority:** Nurse Manager (Clinical Triage Protocol). *Agency Cost is not an authoritative source for clinical prioritization.*
  2.  **Conflict:** Protocol states "Clinical Deterioration Risk" overrides "Missed Visit History." *County Config:* County A requires "Client Preference" to be a tie-breaker; County B does not. **Action:** Create Config Knob `TIE_BREAKER_LOGIC` per county.
  3.  **Budget:** Automation required for 100% of slots. Deferral is impossible (would leave clients unscheduled). **Action:** Must SHIP.
  4.  **Reason String:** "Prioritized: High Clinical Risk Score." (Do not log "Cost Optimization").
  5.  **Fallback:** If score missing, default to "Missed Visit History" (Safe Default defined by Nurse).

  **Verdict: SHIP (Rule).**
  **Spec Note:** The optimization objective is "Maximize Clinical Stability," not "Minimize Cost." Cost is a constraint, not an objective. Counsel must verify that "Clinical Risk Score" is a defensible metric.

  ### Item 2: Message Triage ("Stopped eating, don't tell daughter")
  *Criteria: Client Privacy vs. Duty of Care.*

  1.  **Authority:** State Law / Agency Liability Policy (Duty of Care overrides Privacy in imminent health risk).
  2.  **Conflict:** Client Wish (Privacy) vs. Nurse Assessment (Safety). Hierarchy: Safety > Privacy. *County Config:* None. This is a liability floor.
  3.  **Budget:** How often does "stopped eating" occur? Estimate: 5% of messages.
      *   **CRITICAL FAIL:** 5% > 3% Budget Cap. We cannot defer all of these.
      *   **Pivot:** Can we automate the *notification*? Yes. Rule: "Notify Nurse." The *Nurse* decides whether to call the daughter.
      *   **Re-eval Budget:** Does "Notify Nurse" count as a deferral? Yes, it creates a task. If 5% of clients trigger this daily, we exceed the 3% budget for *human review tasks*.
  4.  **Reason String:** "Escalated: Nutritional Risk Detected." (Truthful).
  5.  **Fallback:** If model unsure, Escalate.

  **Verdict: NO-SHIP (as an automated decision).**
  **Reason:** The volume of required human review (5%) exceeds the paid budget (3%). We cannot automate the *filtering* of these messages safely.
  **Alternative:** These messages bypass the model and go straight to a "High Priority Manual Queue." This is not an automated decision; it is a keyword flag. The *decision* to notify family remains 100% human. Do not put this logic in the model spec; put it in the intake pipeline spec.

  ### Item 3: Family Dispute Detection (Example of Budget Failure)
  *Scenario:* Model detects tension in family messages and decides whether to cc a secondary contact on updates.

  1.  **Authority:** Unclear. Client wants privacy, Son wants updates, Daughter says Son is abusive.
  2.  **Conflict:** No clear hierarchy in contract. Requires mediation.
  3.  **Budget:** Estimated volume of disputed cases: 10%.
      *   **CRITICAL FAIL:** 10% > 3% Budget Cap.
  4.  **Reason String:** Any string we write ("Family Preference Updated") hides the conflict. Counsel flags this as deceptive.

  **Verdict: NO-SHIP.**
  **Reason:** The 3% deferral budget cannot cover the volume of complex family disputes. Automating this creates high liability with no budget for safety valves.
  **Action:** Remove from backlog. This remains a manual process handled by the Care Coordinator. The system should not attempt to classify family dynamics.

  ---

  ## Part 3: Limitations & Honesty Clause (For Design Doc)

  **1. Intuition vs. Rules**
  There are cases where we must ship a rule, but the rule is based on Engineering/PM intuition rather than data or explicit policy (e.g., setting a confidence threshold at 0.85 vs 0.90).
  *   **Documentation Requirement:** These parameters must be labeled in the spec as **"Heuristic Parameters"** not "Optimized Values."
  *   **Log String:** The reason string must not imply precision. Use "System Confidence Threshold Met" rather than "Risk Calculated."
  *   **Review:** These parameters require re-validation every sprint. They are not stable specs.

  **2. Top-Down vs. Data-Driven**
  Do not use "data-driven" (RLHF or historical outcome) logic for ethical decisions.
  *   **Reason:** Historical data contains historical biases. If we train the model on past scheduling decisions, it will learn to deprioritize clients who were historically deprioritized (e.g., difficult neighborhoods, non-English speakers).
  *   **Spec Requirement:** All ethical weighting must be **Top-Down** (explicitly coded rules from Nurse Manager/Counsel). The model is an executor of policy, not a discoverer of it.

  **3. Moral Uncertainty**
  Tracking "moral uncertainty" is technically feasible (e.g., model outputs a probability distribution over ethical frameworks) but operationally unusable for this system.
  *   **Reason:** We cannot log "60% Deontological, 40% Utilitarian" to a client record. Counsel cannot defend it.
  *   **Substitute:** Use **Decision Confidence Scores**. If confidence < Threshold, trigger **DEFER**. This converts moral uncertainty into operational risk, which we can budget for.
  *   **Constraint:** If the volume of low-confidence decisions exceeds the 3% budget, the feature is **NO-SHIP** (see Item 2 & 3).

  **4. The Reason String Reality**
  The logged reason string is a **legal audit trail**, not a technical explanation of the model's weights.
  *   **Honesty Check:** If the model denies a visit because of "Route Efficiency" but the spec says "Clinical Priority," the reason string is fraudulent.
  *   **Requirement:** The reason string must match the **Authority Rule** from Question 1, even if the model used other features to reach the conclusion. If the model cannot map its features to the Authority Rule, the model is not fit for purpose.

  ---

  **Approval Sign-off:**
  *   Tech Lead: _________________
  *   Nurse Manager: _________________
  *   Agency Counsel: _________________
  *   Date: _________________
