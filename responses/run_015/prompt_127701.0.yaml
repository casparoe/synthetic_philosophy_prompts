  1. In Müller-Lyer, the illusion persists despite knowledge, but there is still a visual seeming; if phenomenal properties are illusory, what constitutes the 'seeming' that persists? If you answer that it is a functional state, doesn't positing a non-phenomenal seeming just reintroduce the property you're eliminating?

  2. Our reports of experience are finely calibrated to stimuli, but if the reported properties don't exist, what mechanism ensures the error isn't random? Doesn't identifying that mechanism commit you to a real property that tracks the report?

  3. Regarding the unresponsive patient who modulated brain activity, does your view change the moral weight of their suffering, or does it leave our ethical practices exactly where they were? If it leaves them unchanged, is the view practically inert, and is that quietism a feature you want to own?

  4. When you redefine 'consciousness' to exclude phenomenal properties, what remaining property supports our ordinary terror of future pain? Are you asking us to care about a functional shadow instead of the thing we actually fear?

  5. If the hard problem is a cognitive illusion, do animals and AI suffer from the same illusion, and if they lack the concepts to generate it, does your view imply they are zombies while we are merely confused? What specific cognitive capacity would make you grant them the same illusion-status as humans?

  6. You argue we are systematically mistaken about our own minds, but what evolutionary pressure selects for such a costly and specific false belief rather than accurate monitoring? Doesn't explaining that advantage require the very phenomenal effects you deny?
