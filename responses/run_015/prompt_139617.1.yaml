  ### Derived Rules and Individual Predictions

  1.  **Particularization:** Harm must differentiate the applicant from the general populace. Generalized risk (extortion, drought, war) fails (Decisions 4, 5, 6); specific targeting or group exclusion succeeds (1, 2, 3, 7). *Predicts Grant:* Client is Veshnik-specific, not general population.
  2.  **State Unwillingness:** The state must be unwilling, not just unable. Adequate safety nets negate claims (4, 5); prioritizing revenue/policy over safety confirms them (2, 3, 7). *Predicts Grant:* State chose revenue over water access.
  3.  **Harm Definition:** Serious harm includes systemic livelihood deprivation via policy, not just physical violence (7). *Predicts Grant:* Loss of fishing/water counts as serious harm.

  ### Best Guess and Synthesis

  **Granted.** The client mirrors Decision 7 (Veshnik woman). Both involve state policy systematically excluding a specific minority from sustenance (IDs vs. water/fish). The harm is particularized (Kaldor delta/Veshnik) unlike the generalized drought (Decision 5). The state created the harm via concession and prioritizes revenue over mitigation, satisfying Rule 2. The minister's "adapt" comment evidences this choice. Relocation is theoretically open but practically barred by discrimination (housing queue), distinguishing this from the Shopkeeper (4) who could simply move. Under Rule 3, the destruction of livelihood without viable alternative constitutes serious harm. The state is actively averting harm for the majority (revenue) while exposing the minority to destitution. All three rules converge on protection.

  ### Test Case and Skeleton Strategy

  **Test Case:** A claim where the state causes environmental damage but offers fully funded, non-discriminatory relocation. This separates "state-created harm" from "adequate state mitigation." If H grants this, state creation is paramount; if she refuses, mitigation availability controls. This isolates Rule 2's tension between capacity and choice.

  **Skeleton Argument:** Lead with Decision 7. Frame the mining concession as administrative violence equivalent to ID cancellation. Distinguish Decision 5 by emphasizing state *creation* of the water shortage versus natural drought. Argue that "adaptation" demands impossible choices for a specific ethnic group, constituting serious harm the state refuses to avert. Focus on the water board exclusion as proof of systemic unwillingness. Do not rely on physical threat precedents; rely on the structural exclusion precedent.
