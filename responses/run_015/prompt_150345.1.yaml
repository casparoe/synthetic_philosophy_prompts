answer: |-
  Here is the breakdown of Sam's likely position, the principles underlying his spreadsheet, and the specific case that will force his hand.

  ### 1. The Prediction
  **Verdict:** Sam will say **save the one** (the certain death).
  **Correlation:** He will say it **makes no difference** whether the five are on one boat or five separate boats.

  **Reasoning:**
  Sam's track record fits a view known as **Moderate Non-Aggregation** (similar to Scanlon's contractualism or a prioritarian view with a threshold). His operating rule appears to be: *Compare the strongest individual complaint in each group. If one person faces a significantly greater harm than any individual in the other group, save them. Only count numbers when the individual stakes are "relevantly similar."*

  *   **5 die vs. 1 die:** Stakes are identical (death). Numbers break the tie. $\rightarrow$ Save 5.
  *   **1 dies vs. 5 lose finger:** Stakes are not similar (death > finger). The one has the stronger complaint. $\rightarrow$ Save 1.
  *   **5 lose leg vs. 1 lose leg:** Stakes are identical. Numbers break the tie. $\rightarrow$ Save 5.
  *   **1 loses 2 legs vs. 5 lose 1 leg:** Stakes are not similar (2 legs > 1 leg). The one has the stronger complaint. $\rightarrow$ Save 1 (his uncertain leaning confirms he struggles with the threshold, but defaults to severity).

  Applied to your risk case:
  *   **Group A:** Five people each face a 30% risk of death.
  *   **Group B:** One person faces a 100% risk of death.
  *   **The Comparison:** For Sam, a 30% risk is not "relevantly similar" to a certain death. Certain death is a lexically worse prospect for the individual facing it ("worse for whom?"). Since the individual in Group B has a stronger complaint than any *single* individual in Group A, and Sam's history shows he does not aggregate lesser harms to outweigh a greater harm (the finger/leg cases), he must save the one.
  *   **Correlation:** Sam's slogan is "worse for whom?" This is an *ex ante* individual-focused question. For any specific person on the boat, their risk is 30%. For any specific person in the separate boats, their risk is 30%. The correlation changes the *variance* of the outcome (all-or-nothing vs. distributed), but it does not change the *individual stake*. Since Sam ignores aggregation, the distribution of risk across the group shouldn't matter to him.

  ### 2. Does His View Collapse into Expected Value?
  **Your suspicion:** Once probabilities enter, he has to multiply ($N \times P$), which is expected utility, so his anti-utilitarianism collapses.
  **My assessment:** **No, not necessarily.**

  He can avoid collapse by treating **certainty as a threshold**. He can argue that a 100% risk imposes a specific moral claim (a "right to be saved from death") that a probabilistic risk does not, regardless of the expected value. This preserves his "worse for whom?" intuition: the person facing certainty is *currently* in a worse moral position than the person facing a chance, even if the statistical expectation is lower.

  However, there is a reading where he *does* collapse. If he argues that "risk is a harm in itself," he might try to compare the "harm of 30% risk" against the "harm of 100% risk." If he decides these are "similar enough" (both are death-risks), his "numbers break ties" rule would kick in, forcing him to save the five. This would be the moment his view slides toward utilitarianism.

  **Can he say "flip a coin"?**
  Technically, yes, but it would be inconsistent with his spreadsheet. Pure Taurekians flip a coin in the 5-vs-1 death case. Sam saves the 5. He has already accepted that numbers matter *when stakes are equal*. To flip a coin now, he would have to argue that 30% risk and 100% risk are *incommensurable* (cannot be compared). But his "1 dies vs 5 fingers" verdict shows he *is* willing to compare different harms (death vs. finger) and prioritize the worse one. Consistency demands he prioritizes the 100% risk over the 30% risk.

  ### 3. The Decisive Case
  Your proposed cases (1000 @ 5% or 5 @ 20%) have weaknesses.
  *   **5 @ 20% (Expected 1 death) vs. 1 @ 100% (Expected 1 death):** If Sam saves the 5, is it because he aggregates risk (Utilitarian) or because he thinks 20% and 100% are "similar enough" to let numbers break ties (Non-Aggregator)? It leaves room for wiggle.
  *   **1000 @ 5% (Expected 50 deaths) vs. 1 @ 100%:** This tests fanaticism, but it's so lopsided he might just appeal to "catastrophe avoidance" rather than his core principle.

  **The Case That Settles It:**
  **"10 strangers each face a 20% risk of death (Expected 2 deaths) vs. 1 stranger faces 100% certain death (Expected 1 death)."**

  **Why this works:**
  1.  **Conflict:** Expected Value Utilitarianism *must* save the 10 (minimizes deaths from 1 to 0.2 remaining, vs 1 to 0). Sam's "Greatest Individual Complaint" principle *should* save the 1 (100% risk is a worse stake for an individual than 20% risk, and he doesn't aggregate lesser risks to outweigh greater ones).
  2.  **No Wiggle Room:** He cannot say "stakes are equal" (20% is clearly distinct from 100%). He cannot say "numbers break ties" (because ties only break when stakes are equal).
  3.  **Diagnosis:**
      *   If he saves the **10**: His view has collapsed into Expected Value Utilitarianism. The "worse for whom?" slogan was just window dressing.
      *   If he saves the **1**: He is a consistent Non-Aggregator. He accepts that he will let more people die (in expectation) to honor the stronger claim of the individual facing certainty.
      *   If he says **"indifferent"**: He is trying to have it both ways and fails.

  **How to spring it:**
  Don't lead with the math. Present it as: *"I can guarantee survival for this one person, or I can give these ten people a 4-in-5 chance of survival. I can't do both."* Then, if he hesitates, ask: *"Does the fact that two of them will probably die on average change your duty to the one who definitely will?"*

  This forces him to choose between the **aggregate good** (saving more lives in expectation) and the **individual right** (saving the person with the worst prospect). That is the exact fault line his spreadsheet has been dancing around for a year.
