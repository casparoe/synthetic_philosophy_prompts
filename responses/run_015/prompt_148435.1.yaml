      *   **The "Distinct Harm" Argument:** Without memory, a group ceases to exist *as a group* even if individuals survive. It's a "social death."
      *   **Intent vs. Negligence:** Genocide requires *dolus specialis* (specific intent to destroy). Accidental erasure via tech (e.g., AI bias, format obsolescence) lacks this intent.

