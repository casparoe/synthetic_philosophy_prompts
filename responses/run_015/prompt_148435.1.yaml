answer: |-
  Raphael Lemkin coined the term "genocide" in 1944 to describe a "coordinated plan of different actions aiming at the destruction of essential foundations of the life of national groups." While the 1948 UN Convention narrowed this definition to focus primarily on physical and biological destruction, Lemkin's original sociological vision was broader: he sought to protect the "national pattern" of a people, which included their culture, institutions, and memory. Today, as digital infrastructure becomes the primary vessel for collective identity, a new question arises: should the destruction of archives, databases, and language-model corpora—what we might call "mnemonic erasure"—be legally classified as genocide?

  While mnemonic erasure fulfills the spirit of Lemkin's original theory by severing the temporal chain of group identity, international law should not classify it as genocide. To do so would dilute the term's legal potency regarding physical extermination. Instead, deliberate mnemonic erasure should be prosecuted as a distinct atrocity crime against group continuity, while accidental erasure via technological negligence must be treated as a violation of digital rights. The label of genocide must remain reserved for the intent to destroy a group's physical existence, lest we blunt the very sword designed to stop mass murder.

  To understand why mnemonic erasure feels like genocide, one must return to Lemkin's *Axis Rule in Occupied Europe*. Lemkin did not view genocide merely as mass killing; he viewed it as the disintegration of the political and social structures of a group. He explicitly listed the destruction of libraries, archives, and museums as genocidal acts because they eradicated the "cultural heritage" that bound the group together. In the 21st century, a group's "national pattern" is increasingly digital. If an indigenous language is preserved only in a specific dataset, and that dataset is deleted or corrupted by a dominant AI model, the language may become unrecoverable. If a diaspora's records of lineage are wiped from a cloud server, the biological survivors may remain, but the social entity ceases to function. Proponents of classifying this as genocide argue that this breaks the "temporal chain" of identity. Without memory, survivors become strangers to their own history, rendering the group socially dead even if biologically alive. In this view, mnemonic erasure is not "cultural genocide with extra steps"; it is the primary mechanism of destruction in an information age.

  However, the legal definition of genocide is not merely a philosophical descriptor; it is a trigger for the highest level of international intervention. The 1948 Convention created the "crime of crimes," carrying a *jus cogens* obligation for states to prevent and punish. This legal machinery is built on the premise of imminent physical threat. If international law expands genocide to include the destruction of databases or archives, it risks conceptual inflation. If deleting a server farm is legally equivalent to filling a mass grave, the moral urgency of the term evaporates. We risk a "boy who cried wolf" scenario where states, hesitant to intervene in actual killings, can hide behind debates about whether digital erasure meets the threshold. By diluting the term to cover mnemonic harms, we weaken the legal mandate to protect physical bodies. The "Responsibility to Protect" (R2P) doctrine relies on clarity; blurring the line between killing people and deleting their history creates loopholes for perpetrators of physical violence to argue their crimes are no worse than administrative negligence.

  Furthermore, the question of intent—whether the erasure is deliberate state policy or an accidental side-effect of technology—demonstrates why the genocide label is inappropriate for mnemonic erasure. Genocide requires *dolus specialis*, a specific intent to destroy a group in whole or in part. Deliberate state-sponsored erasure, such as the systematic destruction of Uyghur mosques and digitized records in Xinjiang, is indeed a weapon of group destruction. It aligns with Lemkin's vision of coordinated action. However, much modern mnemonic erasure is structural or accidental: format obsolescence, server decay, or AI models that inadvertently overwrite minority dialects due to data scarcity.

  Classifying accidental tech rollout as genocide is legally incoherent and morally hazardous. If a tech company updates a language model that inadvertently degrades a minority dialect's representation, labeling this "genocide" criminalizes negligence rather than malice. It conflates corporate incompetence with state-sponsored extermination. This does not mean the harm is negligible; it means the legal category is wrong. Accidental erasure is a matter of digital preservation and human rights law, requiring regulations on data sovereignty and algorithmic accountability. Deliberate erasure is an atrocity, but it should be prosecuted as a distinct crime against group continuity. Creating a new legal category allows for proportional sentencing and specific prevention strategies without watering down the definition of physical genocide.

  Ultimately, we must honor Lemkin's insight without being bound by his terminology. Lemkin understood that killing a group's memory is a way of killing the group. But international law has evolved since 1948, and the specific utility of the word "genocide" now rests on its association with physical survival. If we expand it to include mnemonic erasure, we risk paralyzing the international community's ability to act against mass killing by bogging it down in disputes over data retention.

  Therefore, international law should not treat mnemonic erasure as genocide. Instead, it should recognize "mnemonocide" or "social group destruction" as a standalone crime against humanity. This approach acknowledges the distinct harm of breaking the temporal chain of identity—admitting that survivors can indeed become strangers to their history—without diluting the emergency status of physical extermination. Deliberate state policy to erase memory should be punished severely as an intent to destroy group viability, while accidental technological erasure should be met with strict liability and preservation mandates. We protect the future of vulnerable groups not by stretching the definition of past atrocities, but by forging new legal tools capable of slicing through the specific threats of the digital age.
