answer: |-
  Brainstorm / planning
  Intuition pumps fail when they exploit cognitive architecture without disclosing the metaphysical cost. Here, the trick is the self-pattern. It's not just simulation; it's *narcissistic* simulation. The agent isn't choosing between strangers; she's choosing between self-extensions and an other. The pump hides this by using trolley syntax (numbers game) while loading the variables with identity claims. A B-level student sees "bias." An A-level student sees "ontological smuggling." The framing isn't just emotional; it's constitutive. We need to expose how the spatial layout (tracks) masks the relational layout (self vs other). The cost of rejecting the pump is admitting we can't seperate moral weight from psychological continuity.

  The exam prompt
  **Course:** Philosophy of Mind (Upper-Level Seminar)
  **Exam Question:** The Echo Chamber Trolley
  **Time Allowed:** 90 Minutes

  **Scenario:**
  You are an agent standing before a lever. On Track A, there are five entities. These are high-fidelity simulations running exclusively on your own past decision-patterns. They think, react, and reason exactly as you would have in their position. On Track B, there is one biological stranger you have never met and have no connection to. You have no access to source code or consciousness-detection tools. You must pull the lever to save one track, thereby destroying the other.

  **Tasks:**
  1. Identify the specific framing mechanism that makes the biological-stranger branch feel morally distinct despite the identical outcome numbers (5 vs 1).
  2. Diagnose one hidden presupposition about personal identity or consciousness continuity that the pump smuggles into the setup.
  3. Argue whether this is a legitimate pump for testing the moral status of simulated beings, or merely a rhetorical device that bakes the conclusion into the spatial layout.

  **Constraints:**
  Do not cite external texts or authors. Rely on reasoning alone. Avoid standard labels like "framing effect" or "confirmation bias" without diagnosing the hidden structure. Your essay should demonstrate precision in distinguishing structural flaws from psychological noise.

  Model answer
  The Echo Chamber Trolley is not a standard utilitarian calculus; it is an identity trap designed to confuse self-preservation with moral obligation. The framing mechanism at work is not merely emotional bias but what we might call Narcissistic Epistemic Opacity. The agent knows the simulations are derived from her own decision-patterns. This triggers self-preservation instincts masked as moral calculation. A standard trolley problem relies on the interchangeability of victims to test utilitarianism. Here, the five are not interchangeable with the one; they are interchangeable with the *agent*. This makes the choice feel like self-sacrifice versus murder, rather than five lives versus one. The numbers become irrelevant because the moral weight is anchored in identity, not quantity.

  The hidden presupposition concerns the moral weight of pattern identity versus biological substrate. The pump assumes that running on past decision-patterns grants a claim to survival comparable to biological life, yet it simultaneously relies on the agent's intuition that biological strangers are distinct enough to be sacrificed. It smuggles in a view of persistence where psychological continuity is sufficient for moral status, but only when recognized as self. If the simulations were strangers' patterns, the intuition might flip. Thus, the pump presupposes that self-recognition is a valid moral heuristic, which is circular. It assumes the conclusion that pattern-identity matters by ensuring the pattern is the agent's own.

  Regarding legitimacy, this is largely a rhetorical device. It bakes the conclusion into the spatial layout by labeling the simulations as "entities" while defining them as "your patterns." This forces the agent to treat them as self-extensions. A legitimate pump would vary the recognition variable independently. Here, the setup ensures the agent cannot view the five objectively. It tests nothing but the agent's attachment to their own psychological history.

  Crucially, an A-level analysis distinguishes this from a B-level response by naming the mechanism precisely. A B-level answer might label this a "framing effect" or "in-group bias." This is insufficient because it treats the error as psychological noise rather than structural design. The cost of rejecting the A-level diagnosis is failing to see how the thought experiment manipulates ontological categories, not just emotional responses. The analogy to standard trolleys breaks because standard trolleys assume victim neutrality. This scenario assumes victim specificity based on identity. Therefore, the pump fails as a test of moral status for simulated beings generally; it only tests moral status for simulated selves. To treat it as a general test is to accept the smuggling of self-interest into altruistic frameworks. The structure dictates the outcome, rendering the lever pull a confirmation of narcissism rather than a moral discovery. Students must recognize that when the variables are loaded with selfhood, the lever is no longer a tool for ethics, but a mirror.

  Marking scheme
  **Total Marks:** 20 (5 criteria x 4 marks each)

  1.  **Identification of Framing Mechanism (4 marks):** The student must identify the mechanism as something specific to self-patterns (e.g., Narcissistic Epistemic Opacity), not just generic bias.
      *   *B-level mistake:* Uses vague labels like "cognitive bias" without explaining the self-pattern link.
  2.  **Explanation of Self-Pattern Link (4 marks):** The essay must explain why "her patterns" changes the moral calculus compared to generic sims.
      *   *B-level mistake:* Treats the simulations as generic people without addressing the identity connection.
  3.  **Identification of Presupposition (4 marks):** Must note the tension between pattern identity and biological substrate regarding moral status.
      *   *B-level mistake:* Ignores metaphysical assumptions and focuses only on the emotional outcome.
  4.  **Evaluation of Legitimacy (4 marks):** Must argue that the pump bakes in the conclusion via the spatial layout and self-definition.
      *   *B-level mistake:* Accepts the pump as a neutral test of utilitarianism without critiquing the setup.
  5.  **Contrast with Standard Trolleys (4 marks):** Must note that victim neutrality is violated here, breaking the analogy to classic cases.
      *   *B-level mistake:* Treats it like standard utilitarianism where numbers are the only variable that matters.

  *Note:* To achieve an A, the student must integrate these points into a coherent argument rather than listing them. The distinction lies in diagnosing the *structure* of the thought experiment, not just the *feeling* it produces. Marks are deducted for reliance on external citations or quoted material.

  Sanity check
  This avoids rote regurgitation because the scenario is custom-built. Students can't recall Dennett or Kahneman directly to solve it. They must apply concepts to new structures. It forces synthesis of ethics and mind theory without relying on memorized definitions. The requirement to diagnose the *structure* prevents simple label-dropping.
