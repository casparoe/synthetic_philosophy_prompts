answer: |-
  **Subject:** Mapping Tambora through the "Non-Human Actor" Test

  Here is a mapping of the 1815 Tambora eruption through your TA's three conditions, followed by an analysis of the determinism worry and an evaluation of the test itself.

  ### 1. Mapping the Three Conditions

  **Condition 1: Onset (Datability & Foreseeability)**
  *   **Where it holds:** The eruption is precisely datable (April 1815). In the immediate vicinity (Indonesia), the onset was undeniable; local kingdoms were destroyed instantly. For them, the volcano was a visible, sudden intruder.
  *   **Where it strains:** For the global actors (Europe, North America), this condition fails. The "thing entering the story" was not the volcano, but the stratospheric aerosol cloud. No human in 1816 could have "seen it coming" or known about the Indonesian source. The *physical* onset was 1815, but the *historical* onset for most actors was the frost of June 1816.
  *   **Implication:** If we insist on "foreseeability," Tambora ceases to be an actor for the Europeans and becomes a "hidden cause." To keep it an actor, we have to loosen Condition 1 to mean "datable entry" without requiring human anticipation.

  **Condition 2: Underdetermination (Variable Outcomes)**
  *   **Where it holds:** This is the strongest fit. The physical event (global cooling) was uniform, but the historical outcomes varied wildly based on human institutions.
      *   *Ireland:* Weak state capacity + reliance on single crop $\rightarrow$ Typhus and famine.
      *   *New England:* Available frontier land + property laws $\rightarrow$ Mass migration to the Midwest.
      *   *Switzerland:* Urban leisure class + Romantic culture $\rightarrow$ *Frankenstein* (cultural production).
  *   **Implication:** This proves the volcano did not *dictate* history; it *perturbed* it. The volcano provided the stress test; local institutions determined the breakage point. This satisfies the requirement that "institutions must be doing some of the work."

  **Condition 3: Uptake (Reciprocity/Response)**
  *   **Where it holds:** People absolutely treated the weather as something to answer. They held rogation days (prayer), passed grain export bans (legislation), and blamed speculators (naming/blaming).
  *   **Where it strains:** They did not respond to *Tambora*. They responded to *The Weather* or *God's Will*. There is no evidence of 1816 actors legislating against volcanoes they didn't know existed.
  *   **Implication:** This suggests the "actor" in 1816 was not the geological mountain, but the *atmospheric anomaly*. If "Uptake" requires recognizing the source, Tambora fails. If "Uptake" only requires responding to the *effect*, it passes.

  ### 2. The Determinism Worry

  You asked: *"Tambora obviously acted on its own... so it feels like the physical event is doing the explaining and the humans are just reacting to it. Is that what determinism means here?"*

  **Yes, that is exactly the slip into determinism.**

  Here is the distinction your TA is worried about:
  *   **Environmental Determinism:** The physical event causes a fixed human outcome (e.g., "The cold caused the famine"). Humans are scenery; the climate writes the script.
  *   **Non-Human Actor Theory:** The physical event is an *agent* that enters a network of human agents. It forces choices, but does not dictate them.

  **How the Test Prevents Determinism:**
  Condition 2 (Underdetermination) is the specific guardrail against determinism. If Tambora were a deterministic force, Ireland, New England, and Switzerland would have all suffered the exact same fate. Because they didn't, we know the volcano was not a *determinant*, but a *participant*.

  However, you are right to feel the tension. If we focus too much on Condition 1 (the volcano's independent power) and ignore Condition 3 (human response), we slide back into determinism. To avoid this, you must argue that the "action" of the volcano is only visible *through* the human reaction. The volcano didn't "cause" *Frankenstein*; the volcano *constrained* the Shelleys indoors, and their culture *produced* the book. The volcano is a co-author, not the sole author.

  ### 3. What This Framing Gets Right (and Wrong)

  **What it gets right:**
  A standard political narrative of 1816 focuses on the post-Napoleonic settlement, the Congress of Vienna, or industrialization. That narrative misses why grain prices spiked simultaneously in London and Boston. The "actor" framing captures the **synchronization of crisis**. It explains why disparate political events (riots in France, migration in the US) share a temporal rhythm. It restores the material constraints that politicians had to navigate.

  **What it gets wrong (The "Scenery" Risk):**
  If we say "Tambora caused the migration," we risk turning the migrants into automatons. The framing gets in trouble if it implies the volcano had *intent*.
  *   *Correction:* The volcano didn't "want" people to move. It created a cost-benefit analysis shift. The "actor" language is metaphorical; it means "a force that disrupts agency," not "a being with agency."
  *   *The Real Risk:* By naming the volcano an actor, do we let human leaders off the hook? If the famine was "Tambora's fault," does the British government escape blame for poor relief laws? The "Underdetermination" clause saves us here: since Ireland suffered more than England, institutions are still culpable.

  ### 4. Evaluating the Test

  **Does 1816 confirm or break the test?**
  It **stresses** the test, specifically on **Onset** and **Uptake**.

  *   **The Silence of the Test:** The test assumes a direct relationship between the human and the non-human. Tambora reveals a **latency problem**. There is a 12-month lag between the "actor" (eruption) and the "interaction" (frost). The test goes silent on *distance*. Can something be an actor if the humans never know its name?
  *   **Verdict:** The case suggests the test needs a modification for **global teleconnections**. For the Indonesians, Tambora passes all three tests (it was seen, it destroyed specific kingdoms, they responded). For the Europeans, Tambora is a "hidden actor."
  *   **Recommendation:** For your paper, argue that for 1816, the "actor" is not the *Volcano*, but the *Climate Anomaly*. The Volcano is the *cause*, but the Weather is the *actor* that Europeans could date, experience differently, and pray against.

  **Summary for your paper:**
  Use Tambora to show that "non-human actors" aren't just about geology; they are about **visibility**. The test works best when the humans can see the thing they are fighting. When the actor is invisible (like a stratospheric cloud), the "Uptake" condition fractures, and we risk sliding into determinism because humans are reacting to a mystery. The test holds, but only if we define the "actor" as the *experienced phenomenon* (the cold), not just the *physical source* (the mountain).
