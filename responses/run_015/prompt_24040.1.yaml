  # Foundations Seminar Handout: Resolving Russell's Paradox

  **Starting Point:** In a single-sorted theory with unrestricted comprehension, the Russell Collection $R = \{x \mid x \notin x\}$ yields a contradiction: $R \in R \iff R \notin R$. To found mathematics, we must block this. Follow the tree below to locate your foundational commitment.

  ### The Decision Tree

  **Q1. Logic:** Do you accept that a contradiction entails *everything* (Ex Falso Quodlibet)?
  *   **No** $\rightarrow$ **Paraconsistent Set Theory** (e.g., Weber). Contradictions are localized; $R$ exists as a set and is both member and non-member of itself.
  *   **Yes** $\rightarrow$ Go to Q2.

  **Q2. Truth:** Do you accept the Law of Excluded Middle ($P \lor \neg P$) for all mathematical statements?
  *   **No** $\rightarrow$ **Intuitionistic ZF (IZF)**. The contradiction is avoided because the proof relies on classical logic; $R$ does not exist, but the logic is constructive.
  *   **Yes** $\rightarrow$ Go to Q3.

  **Q3. Syntax:** Is the statement "$R \in R$" grammatically meaningful (well-formed)?
  *   **No** $\rightarrow$ Go to Q3a.
      *   **Q3a. Reason:** Is the failure due to **Types** (objects have levels) or **Structure** (membership is local to domains)?
          *   **Types** $\rightarrow$ **Russellian Type Theory**. $x \in x$ is a category error; objects are stratified by order.
          *   **Structure** $\rightarrow$ **Structural Foundations (ETCS)**. There is no global membership relation; objects are only elements relative to a specific set.
  *   **Yes** $\rightarrow$ Go to Q4.

  **Q4. Ontology:** Does the Russell Collection exist as *any* kind of object in your domain (even if not a "set")?
  *   **Yes** $\rightarrow$ **Class Theory (NBG / MK)**. $R$ exists as a "Proper Class"—an object that cannot be a member of other collections.
  *   **No** $\rightarrow$ Go to Q5.

  **Q5. Universality:** Does the *Universal Collection* ($V = \{x \mid x=x\}$) exist as a **set**?
  *   **Yes** $\rightarrow$ **Quine's New Foundations (NF)**. Comprehension is restricted (stratification), but $V$ exists. (Note: Positive Set Theory also lands here).
  *   **No** $\rightarrow$ **Zermelo-Fraenkel (ZF / ZFC)**. Comprehension is restricted (Separation); $V$ is too large to be a set. (Note: Neo-Logicism also lands here).

  ***

  ### Instructor Notes & Limitations

  **1. Collapsed Distinctions (Leaves not separated by questions):**
  *   **NF vs. Positive Set Theory:** Both accept a Universal Set (Q5: Yes). This tree groups them, though they restrict comprehension differently (Stratification vs. Negation).
  *   **ZF vs. Neo-Logicism:** Both deny the Universal Set (Q5: No). This tree groups them, though Neo-Logicism derives sets from abstraction principles rather than the iterative conception.
  *   **Type Theory vs. ETCS:** Both deny the syntax of $x \in x$ (Q3: No). Q3a separates them, but both ultimately treat self-membership as ill-formed.

  **2. The "Empty" Branch (Incoherent Combinations):**
  *   **Classical Logic + "$R$ exists as a set":** If you answer **Yes** to Q1 and Q2, but insist $R$ exists as a set (bypassing Q3/Q4 restrictions), you land in **No Leaf**. This position is **incoherent**: in classical logic, a set $R$ satisfying unrestricted comprehension immediately trivializes the theory. You must change the logic (Q1), the syntax (Q3), or the ontology (Q4/Q5) to survive.

  **3. Philosophical Forks:**
  *   **Q3 (Syntax)** represents the *Linguistic Turn* (paradox is a mistake of language).
  *   **Q4/Q5 (Ontology)** represents the *Limitation of Size* doctrine (paradox is a mistake about what objects exist).
  *   **Q1/Q2 (Logic)** represents the *Revisionary* approach (paradox reveals limits of classical reasoning).
