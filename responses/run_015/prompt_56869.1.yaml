prompt: |-
  I don't have any philosophy training — business degree, and now I run the people-and-ops side of a fully remote company of about 300 — but I've been reading around this stuff on my own for a couple of months because we're about to try to kill a norm I hate. On a flight last week I got through a chapter of one of those pop social-science books a behavioural economist writes, and it spent several pages on a philosopher named David Lewis and his 1969 book *Convention*. I copied down the part that mattered, roughly word for word from my notes:

  "A convention is a stable regularity in how a group behaves that everyone in the group would be better off keeping — driving on the same side of the road, shaking with the right hand, saying your name when you answer the phone. Lewis gave a short list of conditions for when a regularity counts as one: everyone does it, everyone expects everyone else to do it, everyone wants everyone else to do it, and everyone knows all of this and knows that everyone knows it. That last layer is called common knowledge and it's the whole engine of the theory. The other big idea is that conventions are arbitrary — left is as good as right — so there's no principled way to choose between them; whichever one gets going first wins, and after that nobody has any reason to change. Lewis was arguing against people who thought rules had to come from an agreement: he showed that a convention is really just a tacit agreement that's been around so long everyone forgot it was ever made. And because common knowledge does all the work, the practical payoff is enormous — a public announcement from someone credible literally manufactures common knowledge, and a convention along with it. That's also why norms evolve: people copy whoever seems to be doing well. So you change a culture by changing what gets announced, not by training people or appealing to their values."

  Some of that felt too smooth, but I can't tell which parts. My sister, who's a lawyer, said "an email doesn't make a norm, that's ridiculous," but she couldn't say why, and I half want the chapter to be right because it would make my job easy. So: can you go through that passage claim by claim and tell me what someone who actually works on Lewis would accept, what's a fair simplification for a general reader, what's subtly off, and what's just wrong? I'm especially suspicious of four spots — the "tacit agreement everyone forgot" line, the slide from "arbitrary" to "nobody has any reason to change," the idea that an announcement manufactures a convention, and the copying-whoever's-winning bit, which I suspect belongs to a different tradition of thinking about norms entirely and got stapled onto Lewis. I'd also like to know whether the conditions he actually gave are the ones the book lists, since I get the feeling "everyone wants everyone else to do it" is doing a lot of dishonest work. Then tell me whether the practical upshot survives the correction, and run the corrected version on our case: when a customer escalation lands in our shared channel, whoever sees it first quietly tags the most junior support person on shift, and it's now simply expected — the juniors resent it, the seniors don't notice it's happening, and nobody ever decided it. Leadership plans to announce on Monday that escalations belong to the senior on call that week, and they think the announcement plus everyone knowing everyone heard it is the whole job. Does Lewis's framework, properly understood, say that will take? If not, what has to be true for it to take, and is our thing even a Lewis-style convention at all given that some people clearly lose out under the current arrangement? No reading list, please — I can't chase down sources, I just want the audit and what to actually do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Business degree, runs People & Ops for a 300-person fully remote company. No philosophy training but intellectually curious. Practical mindset ("make my job easy," "what to actually do").
      *   **Task:** Audit a specific summary of David Lewis's *Convention* (1969) found in a pop behavioral economics book. Identify what's accurate, simplified, subtly off, or wrong.
      *   **Specific Suspicions:**
          1.  "Tacit agreement everyone forgot."
          2.  Slide from "arbitrary" to "nobody has any reason to change."
          3.  Announcement manufactures a convention.
          4.  "Copying whoever's winning" (evolutionary bit).
          5.  The specific conditions listed (especially "everyone wants everyone else to do it").
      *   **Application:** Apply the corrected framework to a specific company norm problem (junior support staff getting dumped escalations quietly). Leadership plans to fix it via a Monday announcement. Will it work? Is it even a Lewis convention?
      *   **Constraint:** No reading list. Just the audit and actionable advice.

  2.  **Deconstruct the Summary vs. Lewis's Actual Theory:**

      *   *Claim 1: "A convention is a stable regularity... everyone in the group would be better off keeping."*
          *   **Lewis:** Accurate enough. Conventions solve coordination problems. Everyone prefers conformity *if* others conform.
      *   *Claim 2: "Everyone does it, everyone expects everyone else to do it, everyone wants everyone else to do it..."*
          *   **Lewis:** This is the "common knowledge" triad. But the "wants" part is tricky. It's not necessarily moral desire; it's conditional preference (I prefer to do X *if* you do X). The summary makes it sound like altruism ("wants everyone else to do it"). It's more "I prefer that we conform."
      *   *Claim 3: "...and everyone knows all of this and knows that everyone knows it."*
          *   **Lewis:** Accurate. This is the definition of Common Knowledge. Crucial.
      *   *Claim 4: "Conventions are arbitrary... whichever one gets going first wins, and after that nobody has any reason to change."*
          *   **Lewis:** "Arbitrary" means there was at least one other possible regularity that *could* have worked (drive left vs. right). "Nobody has any reason to change" is true *given that others aren't changing*. It's an equilibrium.
      *   *Claim 5: "Tacit agreement that's been around so long everyone forgot it was ever made."*
          *   **Lewis:** **Problematic.** Lewis explicitly argues *against* the idea that conventions require an agreement (tacit or explicit). He says conventions arise from precedent and expectation, not promise-making. The summary says he argued *against* people who thought rules needed agreement, but then says it *is* a tacit agreement. This is contradictory. Lewis says it *looks like* an agreement but isn't one.
      *   *Claim 6: "A public announcement from someone credible literally manufactures common knowledge, and a convention along with it."*
          *   **Lewis:** **Oversimplified/Wrong.** Announcement creates common knowledge *of the proposition announced*. It does not instantly create a *convention*. A convention requires the *behavioral regularity* to be established. You can announce "We will drive on the left," but if people don't actually do it, it's not a convention yet. It jumpstarts the process, but doesn't guarantee the equilibrium.
      *   *Claim 7: "People copy whoever seems to be doing well. So you change a culture by changing what gets announced, not by training people or appealing to their values."*
          *   **Lewis:** **Wrong.** This is Evolutionary Game Theory (Skyrms, Young, etc.), not Lewis. Lewis is rationalist/analytic, not evolutionary. He focuses on reasoning and expectations, not copying success. This is the "stapled on" bit the user suspected.

  3.  **Analyze the Specific Case (Support Escalations):**

      *   *Current State:* Junior staff get tagged quietly. Seniors don't notice. Juniors resent it.
      *   *Is this a Lewis Convention?*
          *   **Regularity:** Yes (people tag juniors).
          *   **Expectation:** Yes (taggers expect juniors to take it).
          *   **Preference/Coordination:** **NO.** This is the killer. A Lewis convention solves a *coordination problem* where everyone *prefers* to conform if others conform. Here, the Juniors *do not* prefer this outcome. They resent it. This is a *power dynamic* or an *exploitation norm*, not a coordination convention. It's not "Drive Left vs. Right" (both fine); it's "Steal from Junior vs. Don't" (Junior loses).
      *   *The Proposed Fix:* Leadership announcement on Monday.
      *   *Will it work?*
          *   If it's not a convention, Lewis's "common knowledge via announcement" lever doesn't apply directly.
          *   The problem isn't lack of knowledge; it's incentives and power. Seniors benefit (less work), Juniors suffer.
          *   Announcement makes the *rule* common knowledge, but not the *compliance*.
          *   For it to stick, the payoff structure must change. Seniors need a reason to stop. Juniors need a way to enforce.

  4.  **Drafting the Response:**

      *   **Tone:** Professional, direct, respectful of the user's time and intelligence. No academic jargon without explanation.
      *   **Structure:**
          1.  Executive Summary (The "Bottom Line").
          2.  The Audit (Claim-by-Claim breakdown).
          3.  The Diagnosis (Is your problem a Lewis Convention?).
          4.  The Prescription (What will actually work).
      *   **Addressing the Suspicions:** Confirm the user's instincts were right (especially on the "tacit agreement" and "copying" bits).
      *   **Addressing the Case:** Be clear that the announcement alone will likely fail because the underlying incentives aren't aligned.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on "Agreement":* Make sure to clarify Lewis's distinction between "agreement" and "concord of expectations."
      *   *Correction on "Arbitrary":* Ensure the distinction between "arbitrary" (could have been otherwise) and "neutral" (no distributional consequences) is clear. The user's case has distributional consequences (Juniors lose).
      *   *Correction on "Announcement":* Emphasize that announcement creates common knowledge of the *intent*, but not the *behavior*.
      *   *Actionable Advice:* Don't just say "Lewis says no." Say "Here is what Ops needs to do." (Incentives, enforcement, feedback loops).

  6.  **Final Review against Constraints:**
      *   No reading list? Check.
      *   Address the four suspicious spots? Check.
      *   Address the conditions list? Check.
      *   Apply to the support channel case? Check.
      *   Keep it practical for a Business/Ops lead? Check.

  7.  **Final Polish:** Ensure the distinction between *Coordination Problems* (Lewis) and *Cooperation/Prisoner's Dilemma Problems* (your case) is clear. This is the philosophical pivot point.

  *(Self-Correction Note)*: Wait, I need to be careful not to overstate the "Juniors lose" aspect. If the *company* loses because juniors burn out, it's a suboptimal equilibrium. But for the *individual senior*, it's a beneficial equilibrium. Lewis conventions require *mutual* benefit in conformity. If one side is exploited, it's not a Lewis convention. It's a norm, but not a *convention* in the technical sense. I need to make this distinction sharp.

  Let's write.
answer: |-
  Here is the audit of the text you read, followed by the diagnosis of your specific situation and what you should actually do on Monday.

  ### Part 1: The Audit of the Summary

  Your instincts were correct. The summary you copied is a "smoothed over" version of Lewis that mixes his actual theory with later evolutionary game theory and common misunderstandings. Here is the claim-by-claim breakdown.

  **1. The Conditions ("Everyone does it, expects it, wants it...")**
  *   **Verdict:** *Subtly Off.*
  *   **The Nuance:** Lewis does not say everyone "wants everyone else to do it" in a moral or altruistic sense. He says everyone has a **conditional preference** to conform *given that others conform*.
  *   **Why it matters:** In a Lewis convention, I don't necessarily *like* driving on the right. I only prefer it *because* you are doing it. If you switched to the left, I would prefer to switch too. The summary makes it sound like we all mutually desire the outcome. In reality, we just all desire *coordination*.

  **2. "Tacit agreement that's been around so long everyone forgot it was ever made."**
  *   **Verdict:** *Wrong.*
  *   **The Nuance:** This is the biggest error in the summary. Lewis explicitly argued **against** the idea that conventions are agreements (tacit or otherwise). He said conventions arise from *precedent* and *expectations*, not from any kind of promise-making, even unspoken ones.
  *   **Why it matters:** If you treat a norm as an "agreement," you look for who promised what. If you treat it as a Lewis convention, you look for *expectations*. You change it by changing expectations, not by holding people to a contract.

  **3. "Arbitrary... nobody has any reason to change."**
  *   **Verdict:** *Fair Simplification, with a Caveat.*
  *   **The Nuance:** "Arbitrary" in Lewis's sense means "there was another viable option" (Left vs. Right), not "it doesn't matter." Once the equilibrium is set, nobody has a reason to change *unilaterally*. If I drive on the left while everyone else drives on the right, I crash.
  *   **Why it matters:** This holds only if the payoff is symmetrical. If one side of the road had better scenery, it wouldn't be a pure Lewis convention. This leads directly to your problem.

  **4. "A public announcement... manufactures common knowledge, and a convention along with it."**
  *   **Verdict:** *Dangerously Oversimplified.*
  *   **The Nuance:** An announcement creates common knowledge of the *proposition* (e.g., "The rule is now X"). It does **not** instantly create the *behavioral regularity*. A convention requires the behavior to actually happen and be expected to happen. An announcement can *spark* a convention, but it doesn't guarantee the equilibrium holds.
  *   **Why it matters:** You can announce a rule, but if the incentives don't support it, the behavior won't stabilize. The announcement is necessary but not sufficient.

  **5. "People copy whoever seems to be doing well... change culture by changing what gets announced, not by training."**
  *   **Verdict:** *Wrong (Different Tradition).*
  *   **The Nuance:** You spotted this correctly. This is **Evolutionary Game Theory** (think Brian Skyrms or Peyton Young), not David Lewis. Lewis is a rationalist; he believes people reason their way into conventions based on expectations. Evolutionary theory says people mindlessly copy success.
  *   **Why it matters:** Lewis's framework relies on *reasoning and expectations*. If you want to use Lewis, you must appeal to people's ability to reason about what others will do. If you want to use the evolutionary model, you change the rewards so the "winners" are the ones following the new norm. The summary mashes these together.

  ---

  ### Part 2: Is Your Problem a Lewis Convention?

  **Short Answer:** **No.**

  **The Diagnosis:**
  A Lewis convention solves a **Coordination Problem**. In a coordination problem, everyone wins if we match, and it doesn't matter which way we match (e.g., "Zoom vs. Teams," "Slack vs. Email").

  Your situation (Seniors dumping escalations on Juniors) is a **Distributional Conflict** (closer to a Prisoner's Dilemma or a Power Dynamic).
  1.  **Not Arbitrary:** The juniors do *not* prefer this outcome. They resent it.
  2.  **Not Mutual Benefit:** The seniors benefit (less work); the juniors lose (more stress).
  3.  **Not Stable Equilibrium:** It is only stable because of power asymmetry, not because everyone prefers conformity.

  Because this is not a coordination problem, Lewis's "Common Knowledge via Announcement" lever is too weak. In a coordination problem, once we all *know* we're switching to the Left, we all switch because we want to avoid crashing. In your case, the Seniors *benefit* from the crash landing on the Juniors. Knowing the rule has changed doesn't remove their incentive to break it.

  ---

  ### Part 3: Will the Monday Announcement Work?

  **Prediction:** **No, not on its own.**

  If leadership simply announces, "Escalations belong to the Senior on call," here is what will happen according to the corrected framework:
  1.  **Common Knowledge is Created:** Everyone knows the rule.
  2.  **Expectations Lag:** Seniors will expect *other* Seniors to follow the rule, but will privately calculate that they can get away with breaking it if the Junior accepts it.
  3.  **The "Focal Point" Fails:** Lewis relies on a "focal point" (a obvious solution everyone grabs). The announcement tries to make the new rule a focal point. But because the Seniors have an incentive to ignore it, the focal point is weak.
  4.  **Enforcement Gap:** Juniors currently lack the power to enforce the norm. If a Senior tags a Junior, the Junior likely feels they *must* accept it to look like a team player.

  The announcement changes the *official* rule, but not the *game*.

  ---

  ### Part 4: What To Actually Do (The Ops Fix)

  To make this stick, you need to turn this from a Power Dynamic back into a Coordination Problem, or alter the incentives so the Lewis conditions (conditional preference) become true. You need three layers, not just the announcement.

  **1. Make the Incentives Symmetric (Fix the "Want" Condition)**
  Lewis requires that everyone prefers conformity. Currently, Seniors prefer *non-conformity* (dumping work).
  *   **Action:** Tie escalation ownership to Senior performance metrics or on-call credits. If a Senior dumps a ticket, it doesn't count toward their resolution stats, or it negatively impacts their "on-call completion" metric.
  *   **Why:** Now the Senior *prefers* to take the ticket (or at least prefers not to lose credit). The preference aligns.

  **2. Empower the "Losers" to Enforce (Fix the "Expectation" Condition)**
  A convention collapses if people think others won't punish deviation. Juniors currently expect that pushing back is risky.
  *   **Action:** Give Juniors a "Return to Sender" protocol. If a Junior is tagged incorrectly, they are authorized (and expected) to re-tag the Senior On-Call with a standard macro: *"Per Monday's update, this belongs to Senior On-Call. Re-assigning."*
  *   **Why:** This makes the cost of breaking the norm immediate and frictionless. It signals to the Senior: "I expect you to follow the rule, and I know you know I expect it." This builds the common knowledge of *enforcement*, not just the rule.

  **3. Create Public Visibility (Fix the "Common Knowledge" Condition)**
  Secret tagging allows the norm to hide. Lewis conventions thrive on publicity.
  *   **Action:** Require that all escalation tags happen in a public channel, not DMs. Or, implement a weekly report that shows "Escalations handled by Role."
  *   **Why:** If a Senior breaks the rule in private, it's a secret deviation. If they break it in public, it becomes a signal to everyone else that the norm is broken. Public visibility sustains the "everyone knows everyone knows" layer.

  ### Summary for Leadership
  Tell them this:
  *"The announcement is necessary to set the focal point, but Lewis's theory only applies when everyone benefits from coordination. Right now, Seniors benefit from the old norm. If we just announce the change, we create common knowledge of the rule, but not common knowledge of compliance. To make it stick, we need to align the incentives so Seniors want to follow it, and give Juniors a safe, standard way to push back. Otherwise, the old convention will re-establish itself within two weeks."*

  **Bottom Line:** The pop-book summary promised you a magic trick (announcement = culture change). Lewis's actual theory tells you that announcements only work when the underlying incentives already support coordination. You have to fix the incentives first.
