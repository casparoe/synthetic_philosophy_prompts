answer: |-
  This is a sharp diagnosis of a classic tension in *Principia Ethica*. You have correctly identified that the friction arises from trying to reconcile Moore's psychological hedonism-adjacent starting point (value lies in states of consciousness) with his robust realism about value (value depends on the nature of external objects). You are calling this the "extrinsic-constituent problem," which is a fitting label for the worry that Moore is smuggling extrinsic conditions into the constitution of an intrinsic good.

  Here is a conceptual untangling of the knot, structured around your two sub-worries and your test cases, aiming for a sympathetic Moorean reconstruction.

  ### 1. Isolation vs. Organic Unities: The Category Error

  Your first worry is whether the Method of Isolation undermines the Organic Unities explanation. If the object has near-zero value in isolation, how can it be essential to the high value of the whole?

  The sympathetic Moorean response is that you are likely operating with a "summativist" intuition about constituents that Moore explicitly rejects. When Moore says the object is a constituent of the valuable whole, he does not mean it is a value-bearing brick added to another value-bearing brick. He means it is a necessary condition for the *specific kind* of organic unity to exist.

  Think of the Method of Isolation as a test for *independent* value, not a test for *contributory* capacity within a unity. A key can have zero value in isolation (sitting on a table), but be essential to the value of a "locked safe containing gold" unity. The key doesn't contribute its *own* value; it enables the *relation* that constitutes the valuable whole.

  In Moore's aesthetics, the "object" (the painting) in isolation has little value. The "consciousness" (the feeling) in isolation has little value. But the *consciousness-of-the-object* is a distinct entity from *consciousness-of-a-hallucination*. Organic Unities allows Moore to say:
  1.  Whole A (Veridical Appreciation) has massive intrinsic value.
  2.  Whole B (Deluded Appreciation) has significantly less intrinsic value.
  3.  The difference in value is not due to the sum of parts, but due to the *nature of the unity*.

  So, Organic Unities doesn't make it worse; it is the only machinery that allows him to say the external object matters without claiming the object is valuable on its own. The tension bites only if you insist that for X to be a constituent of a valuable whole, X must have positive value in isolation. Moore denies this.

  ### 2. The Circularity of the Beautiful

  Your second worry concerns the definition: "Beautiful = that of which the admiring contemplation is good in itself." This looks circular if the value of the contemplation depends on the object being beautiful.

  A sympathetic reading treats this not as a vicious definitional circle, but as a **teleological identification**. Moore is not trying to reduce "beauty" to natural properties here; he is fixing the reference of the ethical term "beautiful."

  *   **Step 1:** We intuit that certain wholes (contemplation of X) are good.
  *   **Step 2:** We label the X in those wholes "beautiful."
  *   **Step 3:** We then analyze *why* that whole is good.

  The explanation for the value of the whole is not "because it is beautiful" (which would be circular). The explanation is that the *nature of the object* (its specific qualitative properties) combines with the *emotion* to form a superior organic unity. The definition merely tracks which objects have the capacity to form that unity.

  The circularity dissolves if you view the definition as extensional (picking out the class of objects) rather than intensional (explaining the source of value). The source of value is the Organic Unity itself; the label "beautiful" is just the name we give to the object-slot in that unity.

  ### 3. Uniformity: Aesthetics vs. Affection (The Test Cases)

  You ask if Moore has a uniform story for your two test cases:
  (a) Real Painting vs. Hallucination.
  (b) Real Friend vs. Perfect AI Simulation.

  Moore *wants* a uniform story, and a sympathetic reconstruction suggests he has one, though it requires a specific understanding of "Truth" as a constituent.

  **The Uniform Principle: Appropriateness and Truth**
  In both cases, the valuable whole is not just "Emotion + Object." It is "Emotion *appropriate to* Object."
  For Moore, a true belief is intrinsically better than a false belief, even if the psychological feel is identical. This is the hidden variable in your test cases.

  *   **Case A (Painting):** The whole is not just "Aesthetic Emotion." It is "Aesthetic Emotion *directed at a Real Beautiful Object*." The hallucination case is "Aesthetic Emotion *directed at a Non-Existent Object*." These are two different wholes. The first contains the property of "Truth" or "Veridicality"; the second contains "Falsehood." Since Moore holds that truth is a positive value-adder in organic unities (see his discussion of knowledge), the Real Painting case wins. The object acts as the **truth-maker** for the cognition.
  *   **Case B (Friendship):** The whole is "Affection *directed at a Good Mind*." The AI case is "Affection *directed at a Simulation*." Moore insists the object of affection must be "truly good in a high degree." If the AI lacks a mind/soul (as Moore would assume), it lacks the property of "Goodness." Therefore, the emotion is misplaced. It is a different whole.

  **Does the object contribute value?**
  In both cases, the object does not contribute its *isolated* value. Instead, the **properties of the object** determine the **kind of whole** that exists.
  *   In Aesthetics, the object's formal properties allow for a specific type of appreciation.
  *   In Affection, the object's moral properties allow for a specific type of love.

  The "split" you perceive (bare trigger vs. value-contributor) is an illusion caused by the fact that in Affection, the object *also* has high isolated value (a good will is good in isolation), whereas in Aesthetics, it does not. But structurally, Moore treats them the same: the value resides in the *relation* of the mind to the object, and the reality of the object secures the truth of that relation.

  ### 4. The "Love of Love" and Corporeal Beauty

  You asked if the remark that appreciating corporeal beauty might be worth more than appreciating mental qualities (plus the "love of love" bit) is a symptom of this split.

  It is not a symptom of a split, but rather a symptom of Moore's **hierarchy of consciousness**. Moore is fundamentally prioritizing the *subjective side* of the organic unity.
  *   When he says appreciating corporeal beauty might be better than appreciating mental qualities, he is comparing the *intensity/quality of the consciousness* involved, assuming the object conditions are met.
  *   The "Love of Love" (loving the love in return) is a higher-order organic unity. It adds a layer of reciprocal consciousness.

  This reinforces the "Externalist" reading of Moore. The value is intrinsic to the *total state of affairs*, which includes the external object, but the *locus* of the value is the complex state of consciousness standing in relation to that object. The "Love of Love" remark shows that you can stack these unities. It doesn't undermine the requirement for the object to be real; it just shows that once the object condition is met, variations in the consciousness side can shift the value ranking.

  ### 5. Where the Tension Bites (The Diagnosis)

  The tension bites because Moore is trying to hold two positions that are in natural friction:
  1.  **Value Internalism (Phenomenal):** Value feels like it belongs to the experience.
  2.  **Value Externalism (Realist):** Value depends on facts outside the experience.

  A sympathetic Moorean resolves this by rejecting **Supervenience on the Internal**. For Moore, the intrinsic value of the "Ideal" whole does *not* supervene on the intrinsic properties of the mental state alone. It supervenes on the mental state *plus* the existence and nature of the object.

  **The Resolution for your Chapter:**
  The "Extrinsic-Constituent Problem" is only a problem if you assume that "intrinsic value" implies "internalist supervenience." Moore is an **Externalist about Intrinsic Value**.
  *   The value is intrinsic to the *Whole*.
  *   The Whole includes the external object.
  *   Therefore, the value depends on the external object.
  *   This does not make the value *extrinsic*; it makes the *bearer* of the value larger than the mind.

  In your test cases:
  *   The Hallucinator and the Veridical Viewer are not in the same state. One is in a state of "Veridical Appreciation," the other in "Deluded Appreciation."
  *   These are distinct universals.
  *   One has high intrinsic value; the other has less.
  *   The difference is explained by Organic Unities (the presence of Truth/Reality as a constitutive feature of the whole).

  **Conclusion:**
  Moore isn't being sloppy; he is biting a bullet that many subsequent value theorists tried to avoid. He is claiming that the world outside your head is a literal part of the valuable thing inside your head (conceptually, not spatially). The "knot" untangles if you accept that for Moore, a "state of consciousness" is not a self-contained bubble, but a relational property that reaches out to the world. If the world isn't there to be reached, the property changes, and the value drops. The object is not a value-contributor in the summativist sense; it is a **value-determiner** by fixing the identity of the organic whole.
