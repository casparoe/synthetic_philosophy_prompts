  10. **Final Polish:** Ensure the distinction between *policy* (mapping) and *program* (implementation) is used to explain maxims. Ensure "Strategy-Proofness" is linked to FH. (Self-correction: Strategy-proofness is about truth-telling, FH is about respect. Better link is *Individual Rationality* constraints or *Rights-based Mechanism Design*). Let's stick to the "Hard Constraint on Objective Function" analogy for FH.

