      *   **The Problem:** Struggling to grasp Kant's Categorical Imperative (specifically Formula of Universal Law -FUL- and Formula of Humanity -FH-) beyond the playground slogan ("what if everyone did that?"). Wants to translate Kant into MAS vocabulary to gain understanding.
      *   **The Task:**
          1.  Translate FUL (including Contradiction in Conception [CC] and Contradiction in Will [CW]) into MAS terms.
