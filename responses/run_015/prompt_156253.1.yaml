  2.  **Deconstruct the Core Concepts:**
      *   *Aggregative Collective Responsibility:* The group is responsible only because the individuals within it are responsible. The whole is nothing more than the sum of its parts. $Responsibility(Group) = \sum Responsibility(Individuals)$.
      *   *Corporate Collective Responsibility:* The group is a moral agent in its own right, distinct from its members. It has a "will" or decision-making structure that cannot be reduced to specific individuals. $Responsibility(Group) \neq \sum Responsibility(Individuals)$. The state acts *as* a state.

