prompt: |-
  I am preparing an essay on whether it is conceptually coherent to hold an entire nation-state responsible for initiating a war, and I am focusing on the First World War and the Fischer controversy. I understand that Fritz Fischer argued that German leaders deliberately pursued policies that made continental war probable, whereas structuralist critics emphasize that alliance commitments and mobilization schedules made escalation nearly automatic regardless of individual intentions. What I need to understand is the underlying conceptual issue: when we attribute war guilt to "Germany" rather than to specific chancellors or generals, are we treating the state as a single moral agent with a unified will, or are we distributing blame across a network of actors whose decisions were shaped by institutional constraints? In particular, could you explain the distinction between aggregative collective responsibility, where fault is summed across individuals, and corporate collective responsibility, where the state itself is the bearer of culpability? Then apply that distinction to the Fischer debate: does Fischer's intentionalist thesis require a corporate view of the German state, and can a structuralist account survive without collapsing into purely aggregative blame? I want a conceptual explanation rather than a summary of books or a list of further readings.
