answer: |-
  ### Exam Prompt

  **Course:** GRAD SEMINAR: BELIEF REVISION & FORMAL EPISTEMOLOGY  
  **Time:** 90 Minutes  
  **Total Marks:** 25  
  **Expected Length:** ~700 words  

  **Question 1: The Satellite Interval Problem**

  A climate researcher is managing credences over three mutually exclusive and exhaustive models: **M1** (stable climate), **M2** (slow warming), and **M3** (fast warming). Her prior distribution is uniform: $P_{old}(M1) = P_{old}(M2) = P_{old}(M3) = 1/3$. Each model entails a different likelihood distribution over global temperature anomalies.

  She receives data from a new satellite instrument. However, the instrument does not return a precise point value. Instead, it returns a graded interval split with internal confidence weights based on signal noise: **70% confidence that the anomaly lies in [1.5, 2.0]** and **30% confidence that it lies in [2.0, 2.5]**. Let $E_1$ represent the proposition that the temperature is in [1.5, 2.0] and $E_2$ represent the proposition that it is in [2.0, 2.5]. Assume these form a complete partion of the relevant evidence space.

  Write a concise essay addressing the following four points:

  **(a)** Explain precisely why this update scenario requires Jeffrey conditionalization rather than ordinary Bayes conditioning. What is the specific status of the evidence propositions $E_1$ and $E_2$ in the posterior state that distinguishes this from standard conditioning?

  **(b)** Apply Jeffrey's rule to this scenario. Write out the correct update equation for the posterior probability of model M2 ($P_{new}(M2)$). You do not need to calculate the final decimal, but you must show exactly how the 0.7 and 0.3 weights enter the numerator and denominator relative to the likelihoods $P_{old}(E_i | M2)$.

  **(c)** Diagnose the following rival argument: *"The satellite gives 70% to the first bin, so just condition on $E_1$ = 'temp is in [1.5, 2.0]' using Bayes rule with $P(E_1)$ computed from the prior over the models."* Explain exactly where this reasoning slips. Specifically, address how it misinterprets the confidence weights as prior probabilities of discrete propositions rather than direct posterior assignments over a partion.

  **(d)** Discuss the "granularity objection." If the researcher splits the range into three bins instead of two, she might derive different posteriors for M1–M3. What constrains the choice of partition? Tie this to the idea that in continuous measurement spaces Jeffrey's rule needs a calibration convention that is exhaustive and exclusive relative to the evidence space, and say why that matters for scientific objectivity. Also, check whether the "hypothesis-independence" assumption holds here—that is, whether the probabilities assigned over the partion are held fixed regardless of which hypothesis is true—and note that it might fail if the instrument's calibration error itself depends on the warming rate.

  *(Note: Keep your answer focused on the formal structure. No need for external citations.)*

  ---

  ### Model Answer

  **(a) Jeffrey vs. Bayes**  
  Ordinary Bayes conditioning applies when an agent learns a proposition $E$ with certainty, such that $P_{new}(E) = 1$. In this scenario, the satellite instrument does not certify $E_1$ or $E_2$ as true. Instead, it shifts the probability mass across the partition $\{E_1, E_2\}$ such that $P_{new}(E_1) = 0.7$ and $P_{new}(E_2) = 0.3$. Because the evidence is uncertain—meaning the posterior probability of the evidence propositions is less than 1—ordinary conditioning is inappropriate. Jeffrey conditionalization is required because it allows for probability kinematics where the input is a shift in probabilities over a partition rather than a collapse to certainty.

  **(b) Applying Jeffrey's Rule**  
  Jeffrey's rule states that $P_{new}(H) = \sum_i P_{old}(H | E_i) \cdot P_{new}(E_i)$.  
  For model M2, we expand the conditional term using Bayes' theorem for the old probabilities: $P_{old}(M2 | E_i) = \frac{P_{old}(E_i | M2)P_{old}(M2)}{P_{old}(E_i)}$.  
  Substituting this into the Jeffrey sum, the update equation for M2 is:  
  $$P_{new}(M2) = \left[ \frac{P_{old}(E_1 | M2)P_{old}(M2)}{P_{old}(E_1)} \times 0.7 \right] + \left[ \frac{P_{old}(E_2 | M2)P_{old}(M2)}{P_{old}(E_2)} \times 0.3 \right]$$  
  The 0.7 and 0.3 weights act as the multipliers for the weighted average of the old conditional probabilities. They enter as the $P_{new}(E_i)$ terms, not as likelihoods.

  **(c) Diagnosing the Rival Argument**  
  The rival argument fails because it conflates $P_{new}(E_1)$ with $P_{old}(E_1)$. The argument suggests conditioning on $E_1$ as if it were the only evidence, or treating the 70% weight as the prior probability $P_{old}(E_1)$. In ordinary conditioning, we would set $P_{new}(E_1)=1$. If we instead treat the 70% as a prior $P_{old}(E_1)$, we ignore the specific information provided by the instrument about the *current* state. The 70% is a direct assignment to the posterior probability of the evidence partition based on the measurement reliability, not a prior expectation derived from the climate models. Using standard Bayes conditioning here would incorrectly force certainty where there is none, or misattribute the source of the probability weight.

  **(d) Granularity and Hypothesis-Independence**  
  The granularity objection highlights that Jeffrey conditionalization is partition-dependent. If the evidence space is carved differently (e.g., three bins instead of two), the resulting posteriors for the models may differ, threatening objectivity. The constraint on the partition is that it must be exhaustive and exclusive relative to the evidence space provided by the instrument. There must be a calibration convention that fixes the partition based on the instrument's resolution, not the agent's convenience.  

  Furthermore, Jeffrey conditionalization relies on the "hypothesis-independence" assumption (often called the rigidity condition): $P_{new}(H | E_i) = P_{old}(H | E_i)$. This assumes that learning the evidence probabilities does not change the conditional link between evidence and hypothesis. This might fail here if the instrument's calibration error depends on the warming rate (the hypothesis). For example, if extreme warming (M3) causes atmospheric interference that skews the satellite's confidence weights, then the 70/30 split is not independent of the truth of M3. If this assumption fails, Jeffrey's rule yields incorrect posteriors because the input weights themselves are hypothesis-sensitive.

  ---

  ### Marking Scheme

  | Must-Hit Point | Marks | Typical Mistake |
  | :--- | :---: | :--- |
  | **1. Distinction of Evidence Status:** Correctly identifies that $P_{new}(E) < 1$ requires Jeffrey, whereas Bayes requires $P_{new}(E) = 1$. | 5 | Student claims Bayes works if you weight the likelihoods. |
  | **2. Formula Structure:** Correctly writes the Jeffrey sum $\sum P_{old}(H|E_i)P_{new}(E_i)$ and plugs in 0.7/0.3 as the posterior evidence weights. | 5 | Student puts 0.7/0.3 in the likelihood spot $P(E|H)$ instead of the evidence weight spot. |
  | **3. Rival Argument Diagnosis:** Identifies that the rival argument treats the confidence weights as priors $P_{old}(E)$ or forces certainty $P_{new}(E)=1$. | 5 | Student says the rival argument is wrong just because "it's not Jeffrey" without explaining the prior/posterior confusion. |
  | **4. Granularity/Partition Constraint:** Explains that the partition must be fixed by instrument calibration (exhaustive/exclusive) to ensure objectivity across different binning choices. | 5 | Student suggests the agent can choose any partition they like without affecting the result. |
  | **5. Hypothesis-Independence:** Notes that the update fails if the instrument error (the 70/30 split) depends on which Model (M1-M3) is actually true. | 5 | Student assumes the instrument weights are always rigid regardless of the physical state described by the hypothesis. |
