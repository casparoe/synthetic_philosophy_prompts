      *   *(3) Multi-level Nesting:* The "unit of analysis" problem. Nation-state vs. community. *Verdict: Needs Reformulation* (It risks incoherence if not tied to jurisdiction/authority).
      *   *(4) Diachronic Feedback:* Tightness changes legitimacy/trust over time. *Verdict: Genuine Desideratum* (but hard to model).
