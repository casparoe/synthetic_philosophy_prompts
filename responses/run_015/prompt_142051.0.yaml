answer: |-
  ### Specification for a Normative Theory of Optimal Tightness

  **Preamble: The Unit Objection**
  Your colleague's objection—that "how much a society should demand" lacks a proper unit—is fatal unless the theory specifies the *currency of optimization*. A theory cannot weigh breadth against severity without a common metric (e.g., welfare units, liberty units, stability probability). To answer her cleanly: the theory must define the *good* being maximized or the *harm* being minimized in commensurable terms. If it refuses this, it concedes the point: there is no "optimal" tightness, only trade-offs between incommensurable values. The specification below assumes the former path is necessary for the workshop to function.

  ---

  ### I. Audit of Candidate Requirements

  **Genuine Desiderata (Non-Negotiable)**
  *These are required for the theory to function as a decision tool across disciplines.*

  1.  **(1) Separation of Breadth, Severity, Depth.** *Why:* Without this, "tightness" is a mushy variable. A theory must predict whether it is better to have few ferocious laws or many mild norms.
  2.  **(2) Coordination vs. Conformity Distinction.** *Why:* Essential for cross-ideological agreement. Everyone agrees coordination norms (driving side) need high tightness; disagreement begins with conformity norms (dress/faith).
  3.  **(8) Actionability under Uncertainty.** *Why:* You specified the theory must be usable by a public health authority *now*. It must name the empirical parameters (e.g., transmission rate, trust level) that trigger a shift in tightness.
  4.  **(9) Non-Reduction to Punitiveness.** *Why:* Conceptual necessity. State coercion and social shaming are distinct mechanisms with different normative profiles.

  **Desiderata Needing Reformulation**
  *These are necessary but currently framed in ways that risk incoherence or measurement failure.*

  5.  **(3) Multi-level Nesting.** *Reformulation:* The theory must specify *which level's* tightness is being optimized when levels conflict (e.g., national looseness vs. communal tightness). *Why:* As stated, it invites the "unit" objection. It needs a rule of priority or subsidiarity.
  6.  **(4) Diachronic Feedback.** *Reformulation:* The theory must specify the *half-life* of legitimacy costs. *Why:* "Handle feedback" is too vague. To be actionable, it must estimate how quickly sanctioning erodes trust (e.g., months vs. generations).
  7.  **(7) Enforcement Technologies.** *Reformulation:* The theory must classify *opacity of enforcement* as a dimension of tightness. *Why:* Algorithmic nudging is "tight" control but "loose" experience. The normative issue is arbitrariness, not just social sanction.
  8.  **(11) Exit and Sorting.** *Reformulation:* The theory must weigh *exit costs* against *choice*. *Why:* "They chose it" is invalid if exit is economically or socially impossible. The metric is effective voluntariness, not formal permission.

  **Camp Preferences (Liberal Scruples in a Lab Coat)**
  *These reflect a specific conception of the good. A theory can reject them, but at the cost of liberal neutrality.*

  9.  **(5) Preferences Over Time.** *Status:* **Camp Preference.** *Why:* This assumes autonomy is the highest good (rejecting paternalism). A perfectionist or public health view might privilege the *outcome* (health) over the *process* (preference satisfaction).
  10. **(6) Distribution of Compliance Costs.** *Status:* **Camp Preference (with caveats).** *Why:* While justice is universal, prioritizing *identity-costs* over *material-costs* is a specific liberal/perfectionist move. A utilitarian theory might aggregate total cost regardless of distribution.
  11. **(10) Tolerance as Value.** *Status:* **Camp Preference.** *Why:* If tolerance is intrinsic, the theory is biased toward looseness. If instrumental, it remains neutral. This requirement smuggles the verdict.

  ---

  ### II. Additions (Missing Requirements)

  12. **Metric Commensurability.** The theory must state the unit of account (e.g., QALYs, primary goods, capability sets) used to weigh the benefits of order against the costs of constraint. (Answers the colleague's objection).
  13. **Epistemic Authority.** The theory must specify *who* is trusted to identify the threat requiring tightness. (e.g., Is tightness justified only if the threat is scientifically verified, or if the population *believes* it is verified?).
  14. **Crisis vs. Baseline Distinction.** The theory must distinguish temporary tightness (emergency powers) from structural tightness (cultural norms). A theory that justifies pandemic lockdowns via long-term cultural tightening fails the "return to looseness" test.

  ---

  ### III. Joint Unsatisfiability

  **The Trilemma: Multi-level (3) + Diachronic (4) + Actionability (8).**

  You suspect these cannot be met together without degeneration. You are correct.
  *   **Multi-level** demands high-fidelity context sensitivity (rules differ for sub-communities).
  *   **Diachronic** demands complex dynamic modeling (today's sanction affects tomorrow's trust).
  *   **Actionability** demands simple heuristics for decision-makers under time pressure.

  **Argument:** To satisfy (3) and (4), the theory becomes a complex simulation dependent on localized data and long-term prediction. This violates (8), as no public health authority can run a dynamic, multi-level simulation during a crisis. To satisfy (8), the theory must simplify levels (treat society as a unit) and time (assume static effects). To satisfy (3) and (8), you must ignore feedback loops (assume legitimacy is static).
  **Verdict:** You must sacrifice one. For a workshop aimed at *decision-making*, **Actionability (8)** must be preserved. Therefore, the theory must accept a **degenerate form of Multi-levelness** (e.g., a default national standard with limited exemptions) and a **simplified Diachronic model** (e.g., fixed "sunset clauses" rather than dynamic trust modeling). If you insist on full fidelity for all three, the theory becomes purely descriptive, not normative.

  ---

  ### IV. Critical Flags

  **Single Most Exclusionary Requirement:**
  **(8) Actionability under Uncertainty.**
  Most normative political philosophy (Rawls, Nozick, etc.) is deliberately abstract to avoid empirical contingency. Demanding that a theory name specific empirical parameters (e.g., "if infection rate > X, tighten") excludes almost all traditional moral theory. It forces the philosophy into the shape of a policy algorithm.

  **Requirement Smuggling a Conclusion:**
  **(10) Tolerance of Deviance as a Value.**
  If the theory stipulates that tolerance is intrinsically good, it has already decided against "optimal tightness" in many domains. It pre-judges the trade-off. To be neutral, tolerance must be instrumental (valuable only insofar as it contributes to the Metric Commensurability, e.g., welfare or truth).

  ---

  ### V. Scorecard (Brief)

  **1. Tightness-as-Adaptation (Consequentialism)**
  *   **Score:** High on Actionability (8) and Feedback (4); Low on Distribution (6) and Exit (11).
  *   **Verdict:** Passes the "usability" test but fails the "disagreeing about the good" test. It optimizes for survival/stability, potentially justifying crushing minority costs if the aggregate benefit is high.

  **2. Harm-Principle/Neutrality (Liberalism)**
  *   **Score:** High on Distribution (6) and Tolerance (10); Low on Actionability (8) and Feedback (4).
  *   **Verdict:** Passes the "disagreement" test but fails the "concrete decision" test. It sets side-constraints but offers no guidance on *how much* rule-following is optimal within the permissible sphere, often collapsing into "as little as possible" regardless of empirical threat.

  **3. Republican Non-Domination**
  *   **Score:** High on Enforcement Tech (7) and Nesting (3); Low on Actionability (8) and Metric (12).
  *   **Verdict:** Excellent at diagnosing *arbitrary* tightness (surveillance, unchecked sanction) but struggles to quantify *optimal* tightness. It tells you when power is abusive, not how much power is necessary for coordination.

  **Overall Discrimination:** The list successfully discriminates. Consequentialism wins on *function*, Liberalism on *rights*, Republicanism on *structure*. Only a hybrid can meet the full specification, confirming the Trilemma: you will likely have to sacrifice the nuance of (3) and (4) to make the theory actionable for your public health colleague.
