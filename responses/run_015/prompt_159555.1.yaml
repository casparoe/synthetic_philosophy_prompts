answer: |-
  Here is the reconstruction of your colleague's implicit definition, the prediction for the seed case, and the discriminating test you need to win the bet.

  ### 1. Reconstructing the Rules
  Based on the five precedents, your colleague is operating with a specific, narrow definition of **Informational Cascade** derived from social epistemology and game theory (likely the Bikhchandani-Hirshleifer-Welch model), but with a distinct emphasis on *epistemic justification* over *outcome truth*.

  Here are the four rules she is applying:

  1.  **The Inference Rule (Belief vs. Payoff):** A cascade must be driven by *belief updating*, not direct payoff interdependence. If I do something because your doing it makes it more valuable for me (Messaging App), that is **Coordination**. If I do it because your doing it convinces me it is the *right* thing to do (Lunch, Cereal), that is a potential cascade.
  2.  **The Signal Rule (Private vs. Public):** A cascade requires the suppression of *private information* in favor of *public history*. If we all act on a single public signal visible to everyone equally (Generators/Storm), there is no sequential inference, so **Not a Cascade**.
  3.  **The Learning Rule (Belief vs. Reputation):** Agents must actually update their internal beliefs. If they mimic others while privately disagreeing to protect their reputation (Junior Analysts), that is **Herding**, not a cascade. She explicitly distinguishes these: in a cascade, "somebody learned something" (even if what they learned was wrong).
  4.  **The Fragility Rule (Arbitrariness):** The onset of the chain must be somewhat decoupled from the intrinsic merit of the option, making the path dependent on early, potentially arbitrary events (Lunch queues, Cereal rumour origin).

  **The Crucial Ambiguity:** The only unresolved variable is **Truth**. Her "Cereal" and "Lunch" cases involve error or arbitrariness. Her friend argues Truth is a necessary condition (Cascades lead people astray). However, standard social epistemology defines cascades by the *mechanism of inference*, not the *accuracy of the conclusion*. Given her field, she likely prioritizes the *justification* for the belief over the *truth* of the belief.

  ### 2. Application to the Seed Case
  Let's run the seed programme through her rules:

  *   **Inference:** Farmers switched because they believed the seed was better ("everyone around them had"), not because their neighbor's planting directly increased their yield (no network effect mentioned). **Passes.**
  *   **Signal:** Farmers had private negative signals (their first plot did worse) but ignored them in favor of the public signal (neighbors switching). **Passes.**
  *   **Learning:** Unlike the analysts, the farmers *did* update their beliefs. They rationalized the negative private evidence ("bad seedbed preparation") to maintain the new belief. They weren't lying for reputation; they were convinced. **Passes.**
  *   **Fragility:** The initial trigger was arbitrary (road repairs, not seed merit). The early success was local (sandy soil), not general. The spread relied on this arbitrary head-start. **Passes.**

  **The Conflict:** The outcome was eventually *true* (the seed was better, due to climate shift). Your friend argues this disqualifies it. Your colleague, however, focuses on the *epistemic route*. At the moment of decision, the farmers' belief was not justified by their private evidence, but by the social chain. The fact that they were later vindicated by an exogenous climate shift is epistemic luck, not epistemic justification.

  ### 3. The Closest Analogy
  **The Lunch Counters.**

  *   **Why:** Both cases rely on an **arbitrary initial condition** (road repairs vs. first few buyers) that tips the system into a locked-in state. In both cases, the "winner" (the long queue, the new seed) is not necessarily intrinsically superior at the start; it just gained an early social advantage.
  *   **Why it Misleads:** The lunch queue is trivial and the outcome is explicitly "arbitrary." The seed case involves livelihoods and turned out to be objectively "correct." This tempts your friend to categorize it as "Rational Adoption" rather than a cascade. But for your colleague, the *arbitrariness of the trigger* is the key, not the value of the prize.

  ### 4. The Prediction
  **She will rule it a Cascade.**

  **Reasoning:** Your colleague is a social epistemologist. She cares about *how* we know what we know. In the seed case, the farmers' knowledge was acquired via a cascade mechanism (ignoring private signals for social ones). The fact that the belief turned out to be true is irrelevant to the classification of the *process*. If she accepted your friend's view (that cascades must be false), she would have to classify the "Lunch" case differently (since one queue *must* be chosen, it's not "false"), but she calls it a cascade because the *choice* was arbitrary and socially driven.

  Furthermore, her comment on the Analysts ("she does not think anybody learned anything") is the smoking gun. In the seed case, the farmers *did* learn (they updated their beliefs about the seed). Therefore, it fits her "Cascade" bucket better than her "Herding" bucket, regardless of truth.

  **The Disagreement:**
  *   **You** are arguing from **Mechanism** (Process).
  *   **Your Friend** is arguing from **Pathology** (Outcome/Error).
  *   **Your Colleague** argues from **Justification** (Epistemology).

  You will win the bet because her field defines the term by the structure of information flow, not the accuracy of the result. A "Correct Cascade" is a standard concept in the literature (a cascade that lands on the right answer by luck or exogenous factors), and she treats the Lunch case (arbitrary) as a cascade, proving she doesn't require "error," only "decoupling from private signal."

  ### 5. The Discriminating Test Case
  To definitively separate your friend's rule (Cascades must be false) from your colleague's rule (Cascades are about inference mechanisms), propose this case:

  **The "Vindicated Panic"**
  > A rumour spreads through a coastal town that a tsunami is coming. Residents evacuate. You check your official weather radio (private signal); it says "No Threat." However, seeing the entire town fleeing (public signal), you infer they have information you lack, ignore your radio, and evacuate with them. It turns out there *was* a tsunami (the radio malfunctioned), and the town is saved.

  *   **Your Friend's Verdict:** **Not a Cascade.** (The process did not lead people astray; the belief was true and beneficial).
  *   **Your Colleague's Verdict:** **Cascade.** (You suppressed a private signal in favor of social inference. The epistemic justification was cascading, even if the ontology was correct).
  *   **Why it Works:** It isolates the **Truth Condition**. It removes Payoff Interdependence (my evacuating doesn't help you evacuate) and Reputation (nobody cares if you stay). It is purely about whether a *correct belief formed via social overriding of private evidence* counts as a cascade. If she says "Cascade," her definition is purely mechanistic, and you win the seed bet. If she says "Not Cascade," she holds the "Pathology" view, and your friend wins.

  Given her "Lunch" ruling (where the outcome is arbitrary, not false), she is consistent only if she rules the Seed Case and the Vindicated Panic as **Cascades**.
