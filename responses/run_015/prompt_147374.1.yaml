          3.  What's wrong with applying Locke's proviso to ideas this way?
          4.  Does the prize-fund conclusion follow?
          5.  Is "idea-fragmentation cascade" a real term?

  2.  **Deconstruct the Roommate's Argument:**
      *   *Claim 1: Anti-commons definition.* "If everyone owns a tiny slice of an idea, nobody can assemble the whole thing..." -> Generally accurate conceptually.
      *   *Claim 2: Heller and Eisenberg.* "Showed this with biomedical patents... every gene gets locked up... fifty rights-holders." -> Refers to the 1998 *Science* article "Can Patents Deter Innovation? The Anticommons in Biomedical Research."
      *   *Claim 3: The Fix.* "Scrap patents and use prize funds instead." -> This is a policy prescription, not necessarily the *thesis* of the anti-commons paper itself.
      *   *Claim 4: Locke's Proviso.* "Locke's proviso only applies to scarce goods, and ideas are non-rival so theres never a 'enough left' problem anyway." -> This is a philosophical justification for abolishing IP, distinct from the economic anti-commons argument.
      *   *Claim 5: Terminology.* "Idea-fragmentation cascade." -> Sounds suspicious.

  3.  **Address Each Question Systematically:**

      *   **Q1: Is it a fair summary of the anti-commons thesis?**
          *   *Analysis:* The core economic concept (fragmented rights leading to underuse) is correct. Michael Heller's original work was on post-Soviet property (shops), then applied to IP with Eisenberg.
          *   *Verdict:* Mostly fair on the *mechanism*, but conflates the *diagnosis* (anti-commons exists) with a specific *cure* (abolish patents). Heller/Eisenberg didn't necessarily argue for abolishing patents entirely, but rather reforming them (e.g., narrower claims, licensing pools).

      *   **Q2: Where does he overstate Heller and Eisenberg?**
          *   *Analysis:* The 1998 paper warned of a *tragedy* that *could* happen, not that it *had* happened everywhere. It was a warning shot. Empirical evidence since then is mixed. Some anti-commons exist (e.g., specific diagnostic tests), but the "50 rights holders for one drug" is often hyperbolic. Licensing markets usually solve this (patent pools).
          *   *Verdict:* He treats a theoretical risk as an empirical certainty. He ignores mitigation strategies (cross-licensing) that the authors acknowledged.

      *   **Q3: What's wrong with using Locke's proviso on ideas?**
          *   *Analysis:* Locke's proviso ("enough and as good left for others") is about physical appropriation. Applying it to IP is a classic libertarian/abolitionist move (e.g., Kinsella).
          *   *Counter-argument:* While ideas are non-rival, the *commercial embodiment* is rival. Also, Locke justifies property based on labor/mixing. If you labor to invent, do you own it? The proviso argument ignores the *incentive* function. If no one invents because they can't capture value, there is no idea to share.
          *   *Verdict:* It's a coherent philosophical stance (IP abolitionism), but it's distinct from the economic anti-commons argument. Mixing them is category confusion.

      *   **Q4: Does the prize-fund conclusion follow?**
          *   *Analysis:* Even if patents cause an anti-commons, does that mean *prizes* are the only/best solution? No. Other solutions exist: compulsory licensing, research exemptions, patent pools, reducing patent scope.
          *   *Verdict:* Non-sequitur. It's a policy preference, not a logical necessity derived from the anti-commons premise.

