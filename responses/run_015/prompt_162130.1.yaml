      *   **Knowledge Level:** Knows pop-science basics of predictive processing (generative model, prediction error, active inference, hierarchy, precision weighting) but doesn't want math or a lecture. Wants a *translation* into craft vocabulary.
      *   **Goal:** Wants to use predictive processing (PP) as a revision tool for the current draft. Needs it to be actionable (15 mins/scene), honest about limitations (falsifiability), and specific to three draft problems.
      *   **Constraints:** No tables of equivalents. Prose I can argue with. Mark real tests vs. judgment calls. Address two specific puzzles (surprise in mystery vs. minimizing surprise in PP; falsifiability).
      *   **Tone:** Professional, peer-to-peer, rigorous, no fluff, respectful of their expertise.

  2.  **Deconstruct Predictive Processing (PP) into Craft Terms:**
      *   *Generative Model:* The reader's mental simulation of the story world based on the text.
      *   *Priors:* The reader's expectations based on genre, previous chapters, and real-world knowledge.
      *   *Prediction Error:* The gap between what the reader expected and what the text actually says (surprise, confusion, revelation).
      *   *Precision/Weighting:* How much the reader trusts a specific signal. High precision = "This detail matters." Low precision = "Background noise."
      *   *Active Inference:* The reader taking action to resolve error (re-reading, theorizing, putting the book down).
      *   *Hierarchy:* Levels of narrative (sentence -> scene -> chapter -> arc). Errors at lower levels (typo) vs. higher levels (plot hole).
      *   *Free Energy (Minimizing Surprise):* The cognitive load of maintaining the model. Too much error = fatigue/abandonment.

  3.  **Address the Two Specific Puzzles:**
      *   *Puzzle 1: Minimizing Surprise vs. Mystery Genre.* PP says brains want to minimize prediction error. Mysteries maximize it.
          *   *Resolution:* It's about *controlled* error. The brain minimizes *long-term* uncertainty (making sense of the whole) by accepting *short-term* uncertainty (clues, red herrings). The "contract" sets the prior that "confusion will be resolved." It's not about zero error; it's about manageable error rates within a trusted framework.
      *   *Puzzle 2: Falsifiability.* Is this just redescription?
          *   *Resolution:* It risks being a "just-so story." To make it falsifiable/useful, it needs to predict *failure points*. If a scene has high error but low precision weighting (no payoff), readers quit. If the model can't explain *why* a specific passage fails (not just that it does), it's useless. I need to be honest: as a craft tool, it's a heuristic, not a law. It helps diagnose *where* the trust breaks, not necessarily *why* (that's still craft intuition).

  4.  **Translate the Vocabulary (The "Dictionary" in Prose):**
      *   Instead of "Generative Model," use "The Reader's Simulation."
      *   Instead of "Priors," use "Established Expectations."
      *   Instead of "Prediction Error," use "Cognitive Friction."
      *   Instead of "Precision Weighting," use "Signal Strength."
      *   Instead of "Active Inference," use "Reader Investment."
      *   Instead of "Free Energy," use "Cognitive Budget."

  5.  **Apply to the Three Draft Problems:**
      *   *(1) The Pears:* Debt Rule says cut (unpaid note). PP view? High Signal Strength (half a page!) + No Resolution = High Persistent Error. The Simulation tries to integrate the pears, fails, and burns budget. *Verdict:* Cut or Pay Off. PP adds that it's not just a "note," it's active noise interfering with other signals.
      *   *(2) The Age Reveal:* Withholding age. Priors established (adult voice?). Reveal creates massive Error. Readers re-read. PP view: The Reveal forces a Model Update. The Priors were wrong. The re-read is the brain minimizing the new error by adjusting old data. *Verdict:* This works *if* the Signal Strength of the reveal is high enough to justify the update cost.
      *   *(3) The Beach Drive:* Nothing happens. Readers call it dead. PP view: Low Prediction Error (boring) but also Low Signal Strength. No new data to update the model. Cognitive Budget is spent with no return on investment. *Verdict:* It's not "dead," it's "stalled inference." Needs either internal prediction (thoughts) or external shift.

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Opening:* Acknowledge the expertise. No condescension.
      *   *Translation Section:* Weave the terms into a narrative about the reading experience. Avoid the "X = Y" table.
      *   *Puzzle Section:* Tackle the Surprise and Falsifiability questions directly. Be honest about the "redescription" risk.
      *   *Draft Application:* Go through the three points. Be decisive. Mark "Test" vs. "Judgment."
      *   *Closing:* Practical advice on the 15-minute limit.

  7.  **Refining the "Falsifiability" point:**
      *   I need to be careful not to sell PP as magic. It's a lens. If every outcome can be explained post-hoc, it's not a tool. The test is: Can it predict *before* beta readers? I should suggest using it to spot "High Cost/Low Yield" passages *before* sending out.

  8.  **Refining the "Surprise" point:**
      *   The key distinction is *Resolution*. Mystery readers tolerate high local error because they trust global resolution. The "Contract" is the Prior that says "This confusion is intentional."

  9.  **Refining the "Pears" point:**
      *   Debt Rule is binary (Paid/Unpaid). PP is analog (Signal Strength vs. Noise). The PP insight is that unpaid debt *actively degrades* the processing of other signals. It's not just a broken promise; it's static on the line.

  10. **Refining the "Beach" point:**
      *   Why do readers hate it? Not because nothing happens, but because the *Model* isn't updating. If the Model updates internally (memory, realization), it works. If the Model stays static, it's waste.

  11. **Final Review against Constraints:**
      *   15-min utility? Yes, keep the diagnostic questions simple.
      *   No tables? Yes.
      *   Mark Tests vs. Judgment? Yes, use bolding or brackets.
      *   Tone? Peer-to-peer.

  12. **Self-Correction during drafting:** I initially thought about calling "Prediction Error" "Surprise." But "Surprise" is ambiguous in craft (plot twist vs. confusion). "Friction" or "Dissonance" is better. Let's go with "Dissonance."
      *   Wait, the user used "Surprise" in their tolerance definition. I should stick close to their lexicon but refine it. Let's use "Prediction Gap."
      *   Actually, "Cognitive Friction" captures the *cost* better. Let's use that.
      *   Wait, I need to make sure I don't introduce *new* jargon. I need to use *their* craft vocab to explain *the theory*.
      *   Okay, strategy: Describe the *mechanism* of reading using their terms (Contract, Debt, Tolerance) to explain the PP concepts.
      *   Example: "The Generative Model" is "The Reader's Mental Draft." "Prediction Error" is "A breach of Contract." "Precision" is "Narrative Weight."

      *   *Correction:* The prompt asks me to restate PP *in that vocabulary*. So I need to say "Here is what Precision Weighting means in terms of the Debt Rule."
      *   Okay, let's map it:
          *   Generative Model -> The Reader's Simulation.
          *   Priors -> The Contract/Genre Expectations.
          *   Prediction Error -> Violation of Expectation (controlled or uncontrolled).
          *   Precision/Weighting -> Signal Strength (linked to the Debt Rule).
          *   Active Inference -> The Reader's Work (re-reading, theorizing).
          *   Free Energy -> Cognitive Budget (Pacing as Budget).

      *   *Falsifiability:* I must admit that without external data (eye tracking, etc.), this is introspective. But as a *heuristic*, it's falsifiable if it fails to predict reader drop-off.

      *   *The Pears:* Debt rule says cut. PP says: High Signal (description length) creates High Expectation of Payoff. If no payoff, the Reader's Simulation flags it as Noise. Noise increases Cognitive Budget cost.
      *   *The Age:* Priors set (Adult). Reveal creates massive Error. Reader re-reads to update Priors. This is "Model Revision."
