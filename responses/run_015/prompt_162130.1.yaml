answer: |-
  Here is the translation, the residue report, the answers to your puzzles, and the diagnostic run on your three draft problems.

  ### The Translation: Predictive Processing as Craft

  You already know the mechanics; you just call them by different names. Here is how the brain-as-prediction-machine maps onto your workshop vocabulary.

  **The Generative Model is the Reader's Simulation.**
  When a reader starts your book, they aren't passively receiving data. They are actively building a mental simulation of your world. They are writing a draft of your book in their head, one paragraph ahead of where they actually are.

  **Priors are the Contract.**
  The "priors" are the assumptions the reader brings to the text before they read a word. Genre is a massive prior (a body in chapter one means *murder*, not *accident*). But your first chapter sets specific priors too: tone, reliability, stakes. When you establish a voice, the reader's Simulation predicts that voice will continue.

  **Prediction Error is the Gap between Contract and Text.**
  In pop-sci, the brain hates prediction error. In craft, we call this *tension* or *surprise*. When the text deviates from the Reader's Simulation, error spikes. If the deviation is small (a typo), the Simulation corrects it instantly. If it's large (a plot twist), the Simulation stalls.

  **Precision Weighting is Signal Strength (and your Debt Rule).**
  This is the crucial link. The brain doesn't treat all sensory input equally. It assigns "precision" or weight to signals based on context. In your craft terms: **Attention is Currency.** When you spend three sentences on a bowl of pears, you are telling the Reader's Simulation: "Assign high precision to this signal. This matters." If you spend one sentence on a gun, you are assigning low precision. The "Debt Rule" is actually a rule about Precision Weighting. You cannot demand high precision (description) without promising high relevance (payoff).

  **Active Inference is Reader Investment.**
  When Prediction Error gets too high, the brain has two choices: update the Model (accept the twist) or change the world (put the book down). "Active Inference" is the work the reader does to resolve the error. They re-read, they theorize, they flip back pages. This is the labor you are asking them to perform.

  **Free Energy is the Cognitive Budget.**
  You already view pacing as a budget. Free Energy is the cost of running the Simulation. Maintaining a complex Model with high Prediction Error is expensive. If the cost (confusion, emotional load, tracking details) exceeds the reward (resolution, beauty, thrill), the system shuts down. That is the reader quitting.

  **Hierarchy is Narrative Scale.**
  Prediction happens at levels. Sentence-level predictions (grammar/syntax) are low hierarchy. Scene-level predictions (cause/effect) are mid. Arc-level predictions (whodunit) are high. A error at the sentence level (a clunky phrase) is low cost. An error at the arc level (a motive that doesn't fit) is catastrophic because it requires rebuilding the whole Model.

  ***

  ### The Residue Report

  **What carries over cleanly:**
  The concept of **Precision Weighting** is the strongest bridge. It validates your Debt Rule but expands it. The Debt Rule focuses on *objects*; Precision Weighting focuses on *attention*. You can incur debt with a mood, a silence, or a rhythmic stumble, not just a physical prop. The theory confirms that the reader is actively *budgeting* their attention based on your cues.

  **What I had to bend:**
  **Active Inference.** In the theory, action is often physical (moving your head to see better). In reading, the "action" is internal (re-reading, pausing, theorizing). I've stretched the definition to include "closing the book" as the ultimate active inference to stop the error. It fits, but it's a metaphorical leap.

  **What cannot be said in craft talk:**
  **The Biological Imperative.** Craft talk assumes the reader *wants* to read. Predictive Processing assumes the brain *wants* to minimize effort. This is a fundamental conflict. Craft says "Engage the reader." PP says "The reader is trying to ignore you unless you force them." You can't fully translate the cold, metabolic selfishness of the prediction machine into "The Contract," because the Contract implies a handshake. PP implies a hostage situation.

  ***

  ### The Two Puzzles

  **Puzzle 1: Minimizing Surprise vs. The Mystery Genre**
  *The theory says brains minimize surprise. I sell surprise. Who is lying?*

  Neither. The theory says brains minimize *long-term* uncertainty, not *short-term* error.
  A mystery novel works because it establishes a high-level Prior (The "Contract"): *"There is an order to this chaos, and I will reveal it."* This allows the reader to tolerate massive amounts of local Prediction Error (clues, red herrings, bodies) because they trust the global Model will eventually resolve.
  The "surprise" you sell is a spike in Prediction Error that is immediately followed by a reduction in Free Energy (the "Aha!" moment). If you deliver surprise without resolution, you aren't selling mystery; you're selling noise. The brain doesn't pay $25 to be surprised; it pays $25 to have its surprise *explained*.
  **Translation:** Your genre isn't a machine for delivering violations of expectation. It's a machine for delivering *resolved* violations. The "Contract" is the promise that the Error is temporary.

  **Puzzle 2: Falsifiability**
  *Is this just a redescription that fits whatever happens?*

  It is dangerously close to redescription. If you say "Readers liked this because it minimized Free Energy" and "Readers hated this because it spiked Free Energy," you haven't learned anything.
  To make it falsifiable, you must use it **prospectively**, not retrospectively. You must be able to look at a scene *before* beta readers see it and say: *"This section demands high Precision Weighting (attention) but offers no Model Update. Therefore, it will be flagged as dead weight."*
  If you use this framework to predict a failure, and the beta readers say "It's fine," then the tool has failed.
  **Verdict:** It is a heuristic, not a law. It will not tell you *what* to write, but it can tell you where the Cognitive Budget is being spent without return. If you treat it as a diagnostic for *cost*, it is useful. If you treat it as a guarantee of *quality*, it is pseudoscience.

  ***

  ### The Diagnostic Run (15-Minute Protocol)

  Here is how you apply this to your three draft problems. I have marked which steps are **Tests** (observable mechanics) and which are **Judgment Calls** (requiring your authorial intuition).

  #### (1) The Bowl of Pears (Chapter 4)
  *The Situation:* Half-page description of softening pears. They never return. Group says cut. Debt Rule says unpaid note.
  *The PP Diagnosis:*
  You assigned high **Precision Weighting** to the pears. You forced the Reader's Simulation to allocate significant **Cognitive Budget** to model the texture, smell, and state of decay. Because the pears never return, the Simulation cannot integrate this data into the higher **Hierarchy** (plot/character arc). The data remains "orphaned."
  Orphaned data creates background noise. Every time the reader remembers the pears, they experience a micro-spike of **Prediction Error** ("Why did I read that?"). This increases the metabolic cost of reading without providing a resolution reward.
  *The Verdict:* **Cut.**
  *   **[TEST]:** Can you remove the paragraph and have the subsequent scene make *less* sense? If no, the Precision Weighting was unjustified.
  *   **[JUDGMENT]:** Does the *decay* of the pears mirror the *decay* of a relationship? If yes, the link is thematic, not plot-based. Thematic links pay off at the Arc Level, not the Plot Level. If the theme is clear elsewhere, the pears are redundant. If the theme is subtle, the pears might be the only carrier. But given your group's reaction, the Signal Strength is too high for a subtle theme. It reads as a Plot Debt, not a Thematic Signal.
  *   **PP Addition to Debt Rule:** The Debt Rule says "Pay it back." PP says "High cost items must yield high inference value." A half-page description is an expensive item. A thematic echo is often too low-yield to justify that cost. You can keep the image, but you must reduce the Precision Weighting (cut it to one sentence) so the brain files it as background texture, not a promissory note.

  #### (2) The Age Reveal (Chapter 1)
  *The Situation:* Narrator's age (11) withheld until paragraph 4. Readers re-read the start.
  *The PP Diagnosis:*
  You established a **Prior** in paragraphs 1–3 (likely an adult voice or ambiguous maturity). The Reader's Simulation built a Model based on that Prior. Paragraph 4 delivered a massive **Prediction Error** (The narrator is a child).
  The readers re-reading is **Active Inference**. They are going back to update their Priors. They are re-calculating the **Precision Weighting** of earlier details. A line that seemed cynical (adult) now seems precocious (child).
  This is a successful "Model Update." You spent their **Cognitive Budget** on the re-read, but you paid them back with a re-contextualization of the text. The "surprise" was high, but the "resolution" (the new understanding) was valuable enough to cover the cost.
  *The Verdict:* **Keep.**
  *   **[TEST]:** Does the re-read change the *meaning* of the first three paragraphs, or just the *tone*? If it only changes tone, it might be a gimmick. If it changes the moral stakes or the interpretation of action, it is a Model Update.
  *   **[JUDGMENT]:** Is the "Error" too high? If readers feel *tricked* rather than *surprised*, you violated the **Contract**. The Prior must be plausible. If the voice sounds undeniably 40 years old, the Error is "Author Error," not "Narrative Twist." If it's ambiguous, the Error is "Narrative Twist." Trust your beta readers here: if they re-read willingly, the Contract held. If they felt cheated, the Prior was false advertising.

  #### (3) The Beach Drive (The "Dead" Scene)
  *The Situation:* Woman drives 40 mins, sits in car, nothing happens. Readers call it dead weight.
  *The PP Diagnosis:*
  This is a **Zero-Sum Scene**.
  For a scene to function, the Reader's Simulation must update. Usually, this happens via external event (Plot) or internal realization (Character).
  In this scene:
  1.  **External Prediction Error:** Low. (Driving is predictable).
  2.  **Internal Prediction Error:** Low. (If she just sits, her internal state isn't shifting).
  3.  **Cognitive Budget:** Spent. (Time passes, pages turn).
  4.  **Model Update:** None.
  The brain is burning fuel to run the Simulation, but the Simulation is idling. The "Free Energy" is not being minimized; it is accumulating as boredom. Boredom is the sensation of high cost with zero data intake.
  *The Verdict:* **Rewrite or Cut.**
  *   **[TEST]:** Identify the **Model State** at the start of the scene (e.g., "She is anxious about the meeting"). Identify the **Model State** at the end. If they are identical, the scene is dead.
  *   **[JUDGMENT]:** You love the scene. Why? Likely because *you* know what she is thinking. But you haven't transferred that data to the text. This is the "Curse of Knowledge." Your internal Simulation is updating; the Reader's is not.
  *   **The Fix:** You do not need to add a car crash. You need to increase **Internal Prediction Error**. She must have a thought she didn't expect. She must remember something that changes her Prior about the meeting. The "action" is the thought, but it must be rendered as a *surprise to her*, not just a rumination. If she drives to the beach to think, and thinks what she intended to think, it is dead. If she drives to think, and realizes she is lying to herself, that is a Model Update.
  *   **PP Instruction:** Give the silence a **Signal**. A memory that intrudes. A physical sensation that triggers a realization. Make the internal landscape unpredictable.

  ### Summary for your Revision Pass

  You have 15 minutes per scene. Do not try to solve the math. Ask these three questions:

  1.  **Where is the Budget going?** (Highlight passages of high description or complex syntax).
  2.  **What Model Update does this buy?** (Does the reader know/feel something *new* after this passage that they couldn't have guessed before?)
  3.  **Is the Debt marked?** (If you spend Budget without an Update, is it clearly atmospheric/thematic, or does it look like a Plot Debt?)

  If you find high Budget spend with no Update and no clear Thematic marker, you have found your "Dead Weight." Cut it, or inject a Prediction Error (a twist, a realization, a sensory shock) to force the Simulation to work.

  This tool will not tell you if your prose is beautiful. It will only tell you if it is *expensive*. Your job is to ensure the reader feels they got their money's worth.
