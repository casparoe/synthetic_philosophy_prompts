      *   *Defeater 4: The Homunculus/Reader (Awkward).* Who queries the logs? If it's just another process, why is *that* one the "reporter"?
      *   *Falsifiability:* Dennett is slippery. If every introspective claim is just another "draft," it's hard to prove him wrong. But behavioral latency experiments *could* falsify it (e.g., if we find a fixed latency for all conscious access).
      *   *Split-Brain:* Actually supports the user. Two agents, two logs.

