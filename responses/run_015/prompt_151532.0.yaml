          *   **The Observer of the Logs:** If modules write logs, who reads them to generate the report? If another module reads them, is *that* module conscious? Infinite regress?
          *   **Self-Reference:** A distributed system doesn't inherently know it's a system. How does "I" emerge?

      *   *Falsifiability:*
          *   Dennett is often accused of "explaining away" rather than explaining. If every inconsistency is just "a draft that wasn't selected," can the theory be wrong?
          *   If we find a specific neural correlate that *requires* a central bottleneck for reportability, that hurts the model.

  4.  **Ranking the Defeaters:**

      *   *Fatal:* The Hard Problem (Qualia). The model explains function/structure, not experience. If consciousness *is* the experience, this is fatal. If consciousness *is* the function, it's not. (Need to clarify this distinction).
      *   *Fatal (Empirical):* Discovery of a strict temporal bottleneck necessary for *any* conscious report (a literal serial center).
      *   *Awkward:* The feeling of unity. Why don't we experience the "eventual consistency" lag? (Dennett says we don't because memory is also a draft).
      *   *Dismissable:* Intuition pumps about the "self."

  5.  **Addressing Dennett Representation:**
