answer: |-
  **Criteria for Ranking**
  I rank questions by three criteria: (1) **Instrument Impact** (does the answer change the measure's design?), (2) **Tractability** (can conceptual work resolve this in five years given data (a)–(d)?), and (3) **Risk** (does failure here collapse the project?). Trade-offs are explicit: high-impact metaphysical questions are riskier than methodological ones, but methodological questions are useless if the metaphysical foundation is wrong.

  **1. Ranked Questions for the Eight Philosopher-Years**

  1.  **Does the functional signature constitute welfare or only track it?**
      *   **Upstream of:** Everything. This decides the Substitutionist vs. Retentionist debate. If the signature (attention/choice) *is* welfare, proposal (d) is valid. If it only *tracks* a hidden phenomenological core, (d) is invalid and the instrument measures a proxy, not the target.
      *   **Tractability:** High. Philosophers can specify conditions under which functionalism is normatively acceptable for policy without solving the hard problem of consciousness.
      *   **Instrument Impact:** Maximum. Determines whether the instrument optimizes for behavioral signatures or introspective reports.
      *   **Trade-off:** High risk of stalemate, but essential. If unanswered, the project lacks a definition of its target.

  2.  **What non-arbitrary anchor fixes the interpersonal unit?**
      *   **Upstream of:** Interpersonal comparability (IPC). Data (b) shows scales differ by monotone transformation. Without a fixed anchor (e.g., a neural baseline or a standardized pain threshold), cardinal comparison is mathematically possible but normatively arbitrary.
      *   **Tractability:** High. Philosophers can propose and defend candidate anchors (e.g., "worst imaginable pain") against objections.
      *   **Instrument Impact:** High. Determines the scaling algorithm.
      *   **Trade-off:** Easier than Q1, but useless if Q1 fails.

  3.  **What counts as validation when reports are skewed?**
      *   **Upstream of:** Adoption. Addresses the validation trap. If reports are unreliable (b), validation cannot rely on face validity.
      *   **Tractability:** High. Philosophers can shift the success criterion from "matching reports" to "predicting outcomes" (predictive validity).
      *   **Instrument Impact:** Medium. Determines the testing protocol.
      *   **Trade-off:** Methodological rather than foundational, but critical for ministry acceptance.

  4.  **Does phenomenological heterogeneity entail normative pluralism?**
      *   **Upstream of:** The Abandonmentist objection. Addresses whether the lack of a common "feel" invalidates hedonism.
      *   **Tractability:** High. Conceptual analysis of "family resemblance" vs. "common core."
      *   **Instrument Impact:** Low/Medium. If functional unity (a) holds, heterogeneity matters less.
      *   **Trade-off:** Load-bearing for theory, inert for deliverable if functionalism wins Q1.

  5.  **Is it politically legitimate to ignore phenomenology in policy?**
      *   **Upstream of:** Implementation. Even if (d) is scientifically valid, is it ethically permissible to treat citizens as black boxes?
      *   **Tractability:** Medium. Requires normative political philosophy.
      *   **Instrument Impact:** Low. Affects communication, not design.
      *   **Trade-off:** Important for long-term viability, but secondary to building a working measure.

  **2. Overrated Implications of Heterogeneity**

  *   **"No common feel → Welfare isn't pleasure":** Overrated. Data (a) shows functional unity. If policy cares about what drives choice and attention, the lack of a common qualia is irrelevant.
  *   **"IPC impossible in principle":** False. Data (b) shows monotone transformations. IPC is possible if we fix the unit (see Q2). It is underdescribed, not impossible.
  *   **"Any valence measure is arbitrary":** False. If the functional role is fixed (Q1), the unit is fixed by the signature's intensity, not stipulation.
  *   **"Hedonism collapses into desire":** False. Data (c) distinguishes attention/choice from reported desire. They can come apart; the theory need not collapse.
  *   **"Proposal (d) is reductio":** False. It is only a reductio if welfare *must* be phenomenological. If functionalism (Q1) holds, (d) is a valid operationalization.

  **3. The Verbal Dispute**

  The Retentionist/Substitutionist disagreement is partially verbal but substantively relocated. It is verbal over the label "pleasure." It is substantive over **what property justifies policy intervention**. If the relocated question is "Should policy target feel or function?", it becomes **Question 1** in my ranking. Defusing the verbal dispute does not solve the policy target problem; it merely clarifies that the fight is about normative priority, not semantics.

  **4. The Validation Trap**

  There is a way out: **Predictive Validity**. Do not validate against reports (undermined by b) or theory (circular). Validate against independent outcomes (e.g., health longevity, stability). If the measure predicts these better than reports, it is validated.
  *   **Philosophy vs. Empirical:** This belongs in the **philosophy** portion. Empiricists can run predictions, but philosophers must argue *why* predictive success validates a welfare measure normatively. Without that argument, the ministry will reject the measure as technocratic.

  **5. Update Conditions**

  *   **Move Q1 Up:** If neurodata shows the signature dissociates from long-term health outcomes.
  *   **Move Q1 Down/Abandon:** If a universal phenomenological marker is discovered that bypasses (b).
  *   **Abandon Line of Work:** If the signature proves easily manipulable (e.g., via drugs) without improving life outcomes, suggesting it measures addiction, not welfare.

  \answer{Does the functional signature constitute welfare or only track it?}
