answer: |-
  This is an exceptionally sharp question. You have stumbled directly into one of the most heated debates in the philosophy of medicine and biology. Most nursing students are taught *what* organ failure is; you are asking *what we mean when we say* "function" in that context.

  You are right to be suspicious. Both accounts struggle to fully escape normativity (value judgments about what is "good" or "bad"), and your intuition about the Causal-Role account leading to "edema is a function" is a standard and powerful objection to that theory.

  Here is a breakdown of why you are stuck, why your intuition is correct, and how this actually matters for your clinical practice.

  ### 1. The Causal-Role Trap (Cummins)
  You asked: *If I take causal-role seriously... hasn't its biological function literally changed to 'producing edema'?*

  **Your intuition is correct.** Under a strict Causal-Role account (associated with philosopher Robert Cummins), a function is simply a causal contribution to a containing system's capacity.
  *   **The Problem:** As you noted, *everything* a damaged organ does is a causal contribution. If the heart leaks fluid into the lungs, it is causally contributing to the state of the body. If we define the "system" as "the patient's body right now," then yes, the heart is functioning to produce pulmonary edema.
  *   **The Fix (and its cost):** To avoid saying edema is a "function," Causal-Role theorists have to specify the **capacity of the containing system.** They usually define the system's capacity as something like "viability," "survival," or "homeostasis."
      *   So, the heart's function is to pump blood *relative to the system's goal of survival.*
      *   Producing edema is a causal role, but it is a *negative* contribution to the goal of survival.
  *   **The Normativity Sneak-in:** Do you see what happened there? To stop "edema" from counting as a function, they had to smuggle in a goal (survival/health). They had to say, "We only count causal roles that help the system stay alive." That is a value judgment.

  ### 2. The Etiological Trap (Selected Effects)
  You asked: *Isn't [the etiological view] just saying malfunction is 'not doing what evolution intended'—which feels circular?*

  It feels circular, but philosophers argue it is actually **historical.**
  *   **The Distinction:** The Etiological view (associated with Ruth Millikan and Larry Wright) doesn't compare the broken heart to a working heart *now* (which would be circular: "broken is what isn't working"). It compares the broken heart to **ancestral hearts.**
  *   **The Logic:** The heart has the function to pump blood because past hearts pumped blood, and that caused the organism to survive and reproduce.
  *   **Why it avoids your "Edema" problem:** Even if your patient's heart is *currently* only causing edema, its **function** remains "pumping blood" because that is its evolutionary history. It is *malfunctioning* because it is failing to perform its historical mandate.
  *   **The Normativity Sneak-in:** Here, the normativity is hidden in **evolutionary success.** It assumes that "what kept ancestors alive" is the standard for "what should happen now."
  *   **The Clinical Flaw:** This view struggles with evolutionary mismatches. For example, our ancestors were selected to crave high-calorie foods. In a modern hospital, that "function" causes diabetes and heart disease. Is the craving malfunctioning? Etiologically, no. Clinically, yes.

  ### 3. Are they competing theories?
  Yes, but in medicine, we often use a pragmatic hybrid called the **Biostatistical Theory (BST)**, proposed by Christopher Boorse.

  Boorse tried to solve exactly your problem. He defined health as "statistical normality of function."
  *   **Function:** Defined etologically (what the organ is designed to do).
  *   **Health:** Defined statistically (does it perform that function within the normal range for the species?).

  **However, your suspicion about normativity holds up here too.** Critics (like Lennart Nordenfelt) argue that "statistical normality" isn't enough.
  *   If 50% of the population has high blood pressure due to stress, is it "normal"? Statistically, yes. Is it "healthy"? No.
  *   If an elderly person's kidney function declines, is it "disease"? Statistically, it's normal for age. But clinically, we might still treat it.

  So, you are right: **We cannot fully escape normativity.** To say an organ has "failed" is to say the patient is in a state we *value* less than the alternative.

  ### 4. Why this matters for you as a Nurse
  You might wonder, *"Why does this philosophy matter when I have meds to administer?"* It actually changes how you frame care, especially in complex cases.

  **Scenario A: The Curative Mindset (Etiological)**
  *   **View:** The heart *should* pump blood (its historical function).
  *   **Goal:** Fix the pump. Restore the organ to its "intended" state.
  *   **Risk:** This can lead to medical futility. If the heart is too damaged to ever pump like an ancestral heart again, continuing to treat it as a "broken pump" might cause unnecessary suffering.

  **Scenario B: The Palliative/Systemic Mindset (Causal-Role)**
  *   **View:** The heart is currently contributing to fluid overload. The system is in a new equilibrium.
  *   **Goal:** Manage the consequences (diuretics for edema, comfort measures). Accept that the "function" of the cardiovascular system has shifted from "high-output circulation" to "low-output comfort."
  *   **Benefit:** This view allows you to validate that the body isn't "fighting" or "failing" in a moral sense, but simply operating under new constraints. It helps in transitioning to hospice care.

  ### Summary
  You asked if both theories are "sneaking normativity in through different doors."
  **The answer is yes.**
  *   **Causal-Role** sneaks it in by defining the "system goal" as health/survival rather than just "whatever is happening."
  *   **Etiological** sneaks it in by defining "success" as evolutionary reproduction rather than current patient well-being.

  Neither is "cleaner." They are tools.
  *   Use **Etiological** thinking when diagnosing pathology (e.g., "This valve is stenotic; it is not doing what a valve should do").
  *   Use **Causal-Role** thinking when managing complex chronic illness (e.g., "Given that this kidney is fibrotic, what is its current contribution to the patient's fluid balance, and how do we manage that?").

  Your confusion is a sign of critical thinking, not a lack of understanding. You have identified that "disease" is not just a biological fact; it is a biological fact *plus* a judgment about what a life should look like. That is the core of nursing care.
