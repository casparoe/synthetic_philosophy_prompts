answer: |-
  1. Seat pairs facing each other with a folder hiding the truth card from the "Chooser," and give them poker chips to bet plus small slips of paper for the final gut-check rating.
  2. The Knower sees the truth and speaks first to steer the Chooser toward the wrong option, winning chips if the Chooser fails and losing chips if the Chooser succeeds.
  3. Halfway through, introduce a "Truth Judge" who vetoes any statement that is factually false, forcing Knowers to switch to technically true but misleading hints without changing the payoff structure.
  4. Collect the gut-check slips to display the mismatch between how clean the Knowers feel and how betrayed the Choosers feel, then reveal the topic of lying versus misleading to frame their arguments about where the harm actually lived.
  5. Expect players to laugh off the guilt or stretch the truth rule, so you must enforce the veto strictly yourself to keep the tension real. The game cannot prove which action is morally worse, so you must verbally explain that philosophy cares about why the discomfort exists, not just the score.
