answer: |-
  Good morning, everyone. Thanks for coming.

  I want to start by admitting something. This workshop title, 'Archiving from the Margins', hit me properly last month. I was clearing out my gran's house after she passed, and I found these notebooks. Boxes of them. She wasn't a historian, obviously, but she kept records. Everything. But when I started trying to read them, I realised I couldn't place them. Not easily.

  She didn't date things by years. Not really. There'd be entries marked 'The year the harvest failed' or 'Just after the boat arrived from Barbados'. Sometimes it was 'Before the big frost'. I found myself trying to translate this into something my training would recognise. I'd think, 'Okay, harvest failure, that's 1932. Boat arrival, that's interwar.' But the moment I did that, I felt like I was smoothing something out. I was forcing her life into a grid it wasn't drawn on. It made me stuck on a question I hope we can tug at today: can the past be told from everywhere at once? Not just by adding more voices to the same story, but by asking if there's a shared frame that doesn't force one tradition's calendar onto everyone else.

  And that brings us to the knot we're here to untangle. Or maybe just to hold, honestly.

  On one side of this room, we have historians. We're trained to periodise. We need timelines. We talk about the 'long nineteenth century' or the 'postcolonial moment'. These are useful tools. They let us compare, analyse, and build arguments. But they are also master calendars. They assume that time moves in a straight line, marked by states and economies and wars.

  On the other side, we have community archivists and family historians. You're the ones who actually hold the boxes. You know that for the people inside them, time doesn't always move like that. Time might be cyclical. It might be marked by a funeral, a migration, a storm, or a birth. When an academic says '1945', a community might say 'When the boys came back'. Those are not the same moment, even if the sun set on the same day.

  The tension here isn't just about disagreement on what happened. It's deeper. It's about what counts as an event-frame at all. If we try to build a global history just by translating community time into academic time, we lose the meaning. We turn 'The year the boat didn't come' into '1926', and the anxiety of that wait disappears. But the opposite is risky too. If we say every community lives in its own untranslatable past, we collapse. We can't talk to each other. We end up in silos, nodding politely but never meeting.

  So the work isn't finding a neutral global timeline. There isn't one. Any timeline we draw is drawn from somewhere, usually from a position of power. The work is figuring out how to translate between incommensurable chronologies without one swallowing the other. How do we let the harvest failure sit next to the interwar period without one cancelling the other out?

  So, what do we actually do here? Over the next two days, we have to be practical. We can't solve the philosophy of time by Thursday afternoon. But we can set some ground rules for how we handle the material.

  First, don't smuggle in the master calendar. When someone shows you a document dated by a local event, don't immediately reach for your phone to check what year that was. Sit with their dating for a moment. Let it be the primary truth of that object.

  Second, ask each other hard questions, but kindly. Historians, ask the community archivists: 'How do you know this order is right?' Community archivists, ask the historians: 'What gets lost when you put this in a period?' We need to expose the mechanics of how we organise the past, not just the content.

  And finally, accept friction. If we leave here feeling comfortable, we haven't done the work. There will be moments where your way of counting time clashes with someone else's. Don't resolve it too quickly. That clash is where the real history is hiding.

  I'll close with this.

  To the academics: your frameworks are necessary, but they are not natural. They are tools, not laws. Be willing to put the ruler down.

  To the community archivists: your records are not just 'raw data' waiting for us to analyse. They are already history. They are already theorised. The way your gran dated her notebooks is a historical argument about what mattered. Trust that.

  We are building a room today where multiple clocks can tick at once. It might be noisy. It might be disorienting. But if we can learn to listen to the different rhythms without trying to synchronise them immediately, we might just find a way to tell the past that doesn't leave anyone behind.

  Let's get started.
