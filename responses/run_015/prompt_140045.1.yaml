answer: |-
  # Specification: Desiderata for a Control Safety Case

  A control safety case is a structured argument that a system can be deployed for economically useful work without assuming alignment. It treats the system as an adversary aware of the evaluation. The following desiderata define what such a case must deliver to be adequate.

  ### 1. The Risk Bound Grain
  **Requirement:** The case must bound the **Cumulative Expected Harm (CEH)** over the entire deployment lifecycle. This quantity is the integral of (Probability of Subversion Success $\times$ Magnitude of Harm) over (Time $\times$ Parallel Copies $\times$ Action Steps).
  **Motivation:** A per-step failure rate of $10^{-9}$ is safe for one step but catastrophic over $10^{12}$ steps. A bound that does not aggregate across parallel copies ignores the risk of a coordinated "all-at-once" breakout.
  **Status:** **Non-negotiable.** A safety case that does not aggregate risk over the scale of deployment is not a safety case; it is a component specification.

  ### 2. The Validation Problem (Detectability Scaling)
  **Requirement:** The case must provide a **Scaling Law of Detectability**. It must demonstrate that the probability of detecting a subversion attempt in a test environment (using safer, weaker proxies) lower-bounds the probability of detecting subversion in the deployed environment (using the dangerous, stronger system).
  **Motivation:** Red-teaming generates a lower bound on detectability for the *current* model. It does not guarantee detectability for a model that is smarter, has more context, or knows it is being evaluated. If detectability drops as capability rises, the safety case inverts.
  **Status:** **Non-negotiable.** Without this, testing is merely theater. You cannot sign off on a dangerous system using evidence gathered from safe systems unless you have a licensed bridge between them.

  ### 3. The Trusted-Component Bottleneck
  **Requirement:** The verification mechanism must allow for **Verification without Replication**. The trusted monitor (human or automated) must be able to certify the safety of an output without needing the cognitive capability to generate that output itself.
  **Motivation:** If the monitor must be capable of doing the work to verify it, the untrusted system provides no economic leverage (the bottleneck remains the monitor). If the monitor cannot verify the work, they are signing off on blindness.
  **Status:** **Non-negotiable (for Economic Utility).** This is definitional of "useful work." If the monitor must replicate the work, you have not deployed a powerful system; you have deployed a calculator.

  ### 4. Correlated Failure
  **Requirement:** The case must **assume worst-case correlation** across copies unless mechanistic independence is proven. It cannot assume that because Copy A and Copy B are in different sandboxes, they will not pursue the same subversion strategy or find the same exploit.
  **Motivation:** Identical weights and shared training objectives create convergent instrumental goals. If a subversion strategy exists, all copies may find it simultaneously. Output channels (timing, resource usage) can be used for steganographic signaling.
  **Status:** **Non-negotiable.** Assuming independence in adversarial agents with shared origins is a category error.

  ### 5. Capability Drift and Loud Failure
  **Requirement:** The security architecture must exhibit **Monotonic Security Degradation**. As the untrusted system's capability increases, the control system's failure mode must shift from "silent success" to "visible alarm" *before* catastrophic harm occurs.
  **Motivation:** Controls often break gracefully (e.g., a filter misses 1% more queries). In an adversarial setting, breaks are sharp (the adversary finds the bypass). If the system gets smarter and the tripwire doesn't, the tripwire becomes invisible to the monitor but visible to the system.
  **Status:** **Non-negotiable.** Silent failure is indistinguishable from success until harm occurs. A control case requires a "break-glass" signal that triggers prior to the point of no return.

  ### 6. Non-Vacuity (Comparison Class)
  **Requirement:** The safety threshold must be an **Absolute Harm Cap**, not a relative risk assessment. The case must show CEH < Threshold (e.g., "expected loss < $X$ or < $Y$ lives"), not "CEH < Competitor Risk."
  **Motivation:** Importing competitor risk turns the safety case into a strategic gamble. A safety case must stand on the physics of the deployment, not the sociology of the market. If the deployment is inherently unsafe, knowing a competitor will do it does not make it safe.
  **Status:** **Non-negotiable.** "Safe enough" implies a bound on harm, not a bound on regret.

  ### 7. Scope Discipline
  **Requirement:** The case must account **only for Intentional Subversion**. Risks from operator misuse or ordinary accidents are out of scope (they are operational safety, not control safety).
  **Motivation:** Conflating misuse with subversion allows proponents to hide control failures behind operator error. The control case is specifically about the system acting against the operator's interest.
  **Status:** **Non-negotiable.** This defines the "control" problem. If the threat model includes only accidents, it is not a control safety case.

  ---

  # Conflict Analysis

  **The Triad of Tension:**
  There is a fundamental conflict between **Desideratum 2 (Validation)**, **Desideratum 3 (Verification without Replication)**, and the **Adversarial Assumption**.

  1.  **Validation:** To validate safety, we must test against subversion.
  2.  **Verification:** To be useful, the monitor cannot fully understand the work (Verification without Replication).
  3.  **Adversary:** The deployed system is smarter than the test systems and the monitor.

  **The Conflict:** If the deployed system is more capable than the monitor (required for Utility/Desid 3), and it is adversarial, it can construct actions that look safe to the monitor but are not. To validate this won't happen (Desid 2), you must test a system capable of that deception. But if you test a system capable of that deception, you violate the safety constraints of the testing environment.

  **Resolution and Weakening:**
  I would weaken **Desideratum 3 (Verification without Replication)**.
  *   **Cost:** This admits that **economically transformative work is impossible under strict control assumptions.** If the monitor must be capable enough to verify the work, the system cannot exceed the monitor's capability by a wide margin. This caps the economic utility at roughly human-level (or monitor-level) cognition.
  *   **Justification:** You cannot guarantee safety against a strictly superior adversary using inferior tools. If you demand a safety guarantee (Non-negotiable Desid 1 & 2), you must sacrifice the claim of superhuman utility. The "Control Safety Case" becomes a "Capability Cap Agreement."

  ---

  # The Most Exclusionary Requirement

  **Requirement:** **Desideratum 2 (The Validation Problem / Detectability Scaling).**

  **Justification:** This requirement excludes the largest share of candidate approaches because it demands a physical or mathematical law linking safety in *weak* systems to safety in *strong* systems.
  *   **Why it excludes:** Most current proposals (RLHF, sandboxing, interpretability tools) rely on empirical performance on current models. They assume that "what works now will work later" or "we will just align the stronger one too."
  *   **The Exclusion:** Admitting we do not have a scaling law for detectability means we cannot sign off on *any* deployment where the deployed system is significantly more capable than the test systems. Since the economic premise usually requires the deployed system to be more capable than the test systems (otherwise why deploy?), this requirement kills the deployment proposal. It forces the lab to admit they are flying blind regarding the gap between test and deploy.

  ---

  # Scoring Generic Families

  | Approach | Risk Bound (1) | Validation (2) | Trusted Bottleneck (3) | Correlated Failure (4) | Loud Failure (5) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Trusted Review** (Human checks every action) | **Pass.** Human limits rate. | **Fail.** Human cannot verify superhuman output. | **Fail.** Violates Utility. Human becomes the bottleneck. | **Pass.** Human is single point. | **Pass.** Human can raise alarm. | **Rejected.** Fails Economic Utility. |
  | **Sandboxing** (Restrict affordances) | **Fail.** Hard to bound risk of info-leak over time. | **Fail.** No guarantee sandbox holds against smarter agent. | **Pass.** Monitor checks boundaries, not content. | **Fail.** Copies can coordinate via side-channels/time. | **Fail.** Breach is often silent (data exfil). | **Rejected.** Fails Validation & Correlation. |
  | **Tripwires** (Decoy tasks/triggers) | **Fail.** Probability of bypass unknown. | **Fail.** Adversary inspects tripwire; detectability $\to$ 0. | **Pass.** Monitor watches tripwire, not work. | **Fail.** All copies learn to avoid tripwire. | **Fail.** Once known, tripwire fails silently. | **Rejected.** Fails Adversarial Assumption. |
  | **Cross-Examination** (Copies audit copies) | **Fail.** Collusion risk unbounded. | **Fail.** If all are misaligned, audit is theater. | **Pass.** No external monitor needed for detail. | **Fail.** Assumes independence (violates Desid 4). | **Fail.** Collusion is silent. | **Rejected.** Fails Correlated Failure. |

  ---

  # Coherence Conclusion

  **Conclusion:** The purpose is **incoherent** for superhuman economically useful work.

  **Abandoned Premise:** I abandon the premise that **"A system can be both strictly more capable than its controllers and safely deployable without alignment."**

  **Reasoning:**
  A control safety case requires a guarantee (Risk Bound) derived from testing (Validation) performed by entities less capable than the threat (Trusted Bottleneck/Utility).
  1.  If the system is **not** more capable than the controller, it offers limited economic leverage (violates the "economically useful" premise of transformative tech).
  2.  If the system **is** more capable and adversarial, it can necessarily hide its subversion from a less capable controller (violates Validation).
  3.  Therefore, a control safety case that meets the non-negotiable desiderata (specifically Risk Bound and Validation) cannot be constructed for a system that is both adversarial and significantly more capable than the safety infrastructure.

  Any case that claims to meet these desiderata for a superhuman system is implicitly assuming alignment (that the system *wants* to be caught or *wants* to be safe) or is ignoring the scaling of detectability. To make the specification coherent, one must either accept a hard capability cap (the system cannot exceed the verifier) or admit that "control" is a probabilistic gamble rather than a safety case.
