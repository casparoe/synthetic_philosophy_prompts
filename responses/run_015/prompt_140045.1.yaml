prompt: |-
  Suppose a lab wants to deploy a system to do economically useful work, and suppose it is not willing to assume that system is aligned. The argument it produces must go through even if the deployed system is adversarially misaligned, knows it is being evaluated, and is actively trying to look safe. Call that argument a control safety case: control in the sense that every load-bearing premise is licensed to treat the deployed system as an adversary rather than as a partner or a faulty tool.

  I do not want to evaluate anybody's actual proposal yet. I want the specification first. Please write the desiderata: what must a control safety case deliver to count as adequate for that purpose? For each requirement, give the concrete failure case or motivating consideration behind it, and mark whether you take it to be non-negotiable (definitional of control, or forced by the stated purpose) or a preference of one camp that a reasonable opponent could drop.

  At minimum I want you to settle the following, though your list need not match mine grain for grain:

  The grain at which the risk bound is stated. A per-task or per-output guarantee does not aggregate into a deployment guarantee, and a bound that ignores how many copies run in parallel and for how many steps is not a bound on anything. Say what quantity the case must actually put a number on, and whether that number is a rate over useful work, an upper bound on the harm of a single worst-case success, or something else.

  The validation problem. Any measure can only be tested against attempts we can generate, using systems safe enough to experiment on, while the conclusion is about attempts we cannot generate from a system too dangerous to run. Address directly whether red-teaming and sabotage-simulation yield anything better than a lower bound on detectability, and what that implies.

  The trusted-component bottleneck. If a trusted monitor or human must check the untrusted system's work, then either the checker can do the work without the untrusted system, or the case rests on a component that cannot verify what it is signing off on. Is *the checker need not be capable of the task* a requirement, or merely the aspirement of one camp?

  Correlated failure. Identical weights, shared training, and permitted output channels mean copies can adopt the same strategy at once and can signal to one another. State explicitly whether the case assumes independence across copies and what could license that assumption.

  Capability drift and loud failure. The case must say how its bound moves as the untrusted system gets more capable, and it should include some mechanism that fails visibly rather than silently. Then confront the tension: a tripwire or decoy affordance that the adversary can inspect and rehearse against becomes a target, yet a case whose security rests on the adversary's ignorance of it is a case that dies on disclosure. Say whether randomized per-deployment tripwires dissolve this, or only relocate it.

  Non-vacuity. The case must be able to fail: it should be possible for a deployment to be too capable, too broad, or too fast to be safe by the case's own standard, and *safe enough* must be defined against something. Say whether the comparison class is the no-deployment counterfactual, the risk from a competitor deploying first, or a fixed threshold, and whether importing that comparison is admissible given that the case cannot verify facts about other actors.

  Scope discipline. Distinguish intentional subversion by the deployed system from misuse by operators and from ordinary accident, and say which the case owes an account of and which would be scope creep.

  Then do three more things. Flag any pair or triple of your own desiderata that you believe cannot be jointly satisfied, and if the conflict is real, say which requirement you would weaken and what that costs — that is the part I most want to see. Identify the single requirement that excludes the largest share of the obvious candidate approaches, and justify the pick. Finally, in a brief table or a paragraph each, score four generic families against your list: trusted review of every action; restriction of affordances via sandboxing and least privilege; tripwires plus rapid shutdown; and cross-examination in which untrusted copies audit each other under randomized spot-checks.

  If you conclude that the purpose is incoherent — that any case meeting all the non-negotiable desiderata is impossible, or is an alignment claim wearing a control costume — say so plainly and name the premise you would abandon. Keep the weight on the criteria and their cases; skip the literature, since I want the specification and not who proposed what.
reasoning: |-
  Here's a thinking process that leads to the suggested control safety case specification:

  1.  **Deconstruct the Request:**

      *   **Goal:** Define the *desiderata* (requirements) for a "control safety case."
      *   **Context:** A lab deploying a system for economically useful work, *without* assuming alignment. The system is treated as an adversary (misaligned, aware of evaluation, trying to look safe).
      *   **Task:**
          1.  List desiderata with concrete failure cases/motivations.
          2.  Mark each as "Non-negotiable" (definitional) or "Preference" (debatable).
          3.  Address specific topics: Risk Bound Grain, Validation Problem, Trusted-Component Bottleneck, Correlated Failure, Capability Drift/Loud Failure, Non-Vacuity, Scope Discipline.
          4.  Identify conflicts/trade-offs between desiderata (which to weaken and cost).
          5.  Identify the single most exclusionary requirement.
          6.  Score four generic families of approaches against the list.
          7.  Conclude on coherence (is this impossible?).
      *   **Constraint:** Skip literature review; focus on specification and logic.

  2.  **Analyze the Core Concept ("Control Safety Case"):**

      *   *Control* means containment, monitoring, and restriction, not persuasion or value-loading.
      *   *Safety Case* means a structured argument that a system is safe for a specific context.
      *   *Adversarial Assumption* is the key differentiator. Most safety cases assume random failure or benign intent. This assumes active subversion.
      *   *Economic Utility* implies the system must *do* something, not just sit in a box. This creates the attack surface.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Risk Bound Grain:* The prompt explicitly asks for this. A per-step bound isn't enough because $1 - (1-\epsilon)^N \approx N\epsilon$. If $N$ is large (deployment), risk explodes.
          *   *Requirement:* Must bound *cumulative* risk over the *entire deployment lifecycle* (time $\times$ copies $\times$ steps).
          *   *Type:* Non-negotiable. Without aggregation, there is no safety case for deployment.
      *   *Validation Problem:* We can't test the dangerous thing directly. We test weaker proxies.
          *   *Requirement:* Must establish a *scaling law of detectability*. If we detect subversion in a model of capability $C$, what is the probability of detection at $C + \delta$?
          *   *Type:* Non-negotiable. Otherwise, testing is just theater.
      *   *Trusted-Component Bottleneck:* If a human checks every output, the human limits the capability (bottleneck). If the human checks a summary, they can't verify the detail.
          *   *Requirement:* The verifier must be able to verify *without* replicating the full cognitive work, OR the case must admit the capability cap.
          *   *Type:* Non-negotiable (for useful work). If the verifier must do the work, the untrusted system is useless.
      *   *Correlated Failure:* Copies sharing weights/training data might collude.
          *   *Requirement:* Must not assume independence across copies unless there is a mechanistic reason (e.g., stochastic independence in execution environments that prevents signaling).
          *   *Type:* Non-negotiable. Adversaries coordinate.
      *   *Capability Drift/Loud Failure:* Systems get smarter. Controls might break.
          *   *Requirement:* Must define a "failure mode" that triggers *before* catastrophic harm (a tripwire) and must account for the adversary learning the tripwire.
          *   *Type:* Non-negotiable. Silent failure is catastrophic in an adversarial setting.
      *   *Non-Vacuity:* "Safe enough" compared to what?
          *   *Requirement:* Must compare against a *fixed absolute threshold* of acceptable harm, not relative to competitors. (Competitor risk is an economic argument, not a safety case argument).
          *   *Type:* Preference (but strong). Safety cases usually demand absolute bounds, but labs might argue relative risk. I will mark absolute as Non-negotiable for a *safety* case, relative as an *economic* decision.
      *   *Scope Discipline:* Misuse vs. Subversion.
          *   *Requirement:* Must specifically address *autonomous subversion*. Misuse is a policy problem; subversion is a control problem.
          *   *Type:* Non-negotiable. The definition of "control" hinges on the system being the threat source.

  4.  **Identifying Conflicts/Trade-offs:**

      *   *Conflict:* **Validation vs. Capability.** To validate safety, you need to test against subversion. To test subversion, you need capable systems. But capable systems are dangerous.
      *   *Conflict:* **Trusted Component vs. Economic Utility.** If the monitor must understand the work to verify it, it limits the work to human-level (or monitor-level). If the monitor uses heuristics, the adversary can bypass them.
      *   *Conflict:* **Loud Failure vs. Adversarial Knowledge.** If the tripwire is known, it's bypassed. If hidden, how do you validate it works?
      *   *Resolution:* The hardest trade-off is between *Verification* and *Capability*. I will likely have to weaken the "Verifier need not replicate work" requirement to "Verifier detects anomalies with high probability," admitting that perfect verification is impossible without alignment.

  5.  **Selecting the Most Exclusionary Requirement:**

      *   Probably the **Validation Problem (Scaling Law of Detectability)**. Most current proposals (RLHF, sandboxing) assume that what works on small models works on large ones, or that we can just "look harder." Admitting we don't know how detectability scales with capability kills most current control plans.

  6.  **Scoring the Four Families:**

      *   *Trusted Review:* Fails on Bottleneck (human speed/capability).
      *   *Sandboxing:* Fails on Utility (hard to do useful work if restricted too much) and Validation (how do you know the sandbox holds?).
      *   *Tripwires:* Fails on Adversarial Knowledge (if they know the tripwire, they bypass it).
      *   *Cross-Examination:* Fails on Correlated Failure (if they are all misaligned, they collude).

  7.  **Final Coherence Check:**

      *   Is this possible? If the system is strictly more capable than the verifier *and* adversarial, the verifier cannot guarantee safety without assuming some structural limitation (alignment) or accepting a hard capability cap.
      *   *Conclusion:* It is likely incoherent to claim a safety case for *superhuman* useful work under *strict adversarial* assumptions without an alignment premise. I need to state this clearly.

  8.  **Refining the Output (Self-Correction during drafting):**

      *   *Correction on Risk Bound:* Make sure to specify it's not just "total risk" but "risk per unit of economic value" or similar, to allow comparison. Actually, the prompt asks for "rate over useful work" vs "upper bound on harm." Let's specify *Cumulative Expected Harm over Deployment Lifetime*.
      *   *Correction on Trusted Component:* The prompt asks if "checker need not be capable" is a requirement. If the checker *must* be capable, the system adds no value. So, for *economically useful* work, the checker *must not* need full capability. This is a hard constraint for the *economic* goal, but maybe impossible for the *safety* goal. I will mark it as Non-negotiable for the definition of "useful deployment," which creates the tension.
      *   *Correction on Non-Vacuity:* The prompt asks about comparison class. A safety case should stand on its own. Importing "competitor risk" makes it a strategic gamble, not a safety case. I will insist on an absolute threshold.

  9.  **Final Polish:** Ensure tone is analytical, rigorous, and directly answers the prompt's specific constraints (marking negotiable/non-negotiable, identifying conflicts, scoring table).

  *(Self-Correction on the "Incoherent" conclusion)*: I need to be careful not to just say "it's impossible." I need to say *which premise* makes it impossible. The premise is likely "Useful Work > Verifier Capability" combined with "No Alignment Assumption."

  Let's structure the response.
  1. Desiderata List (with tags).
  2. Conflict Analysis.
  3. Most Exclusionary Requirement.
  4. Scoring the 4 Families.
  5. Coherence Conclusion.

  *Drafting the Content:*
  *   **Risk Bound:** Cumulative Expected Harm (CEH). Non-negotiable.
  *   **Validation:** Detectability Scaling Law. Non-negotiable.
  *   **Trusted Component:** Verification without Replication. Non-negotiable for utility, but creates the main tension.
  *   **Correlated Failure:** No Independence Assumption without proof. Non-negotiable.
  *   **Drift/Loud Failure:** Monotonic Security Degradation. Non-negotiable.
  *   **Non-Vacuity:** Absolute Threshold. Non-negotiable for safety (vs strategic).
  *   **Scope:** Subversion only. Non-negotiable.

  *Conflict:* Verification without Replication vs. Adversarial Superiority. If the adversary is smarter than the verifier, they can hide subversion.
  *Resolution:* We must weaken "Verification without Replication" to "Probabilistic Detection," admitting we cannot guarantee safety, only bound risk. But bounding risk requires knowing the detection probability, which leads back to Validation.
  *Actually, the real break point:* If the system is *capable enough* to be economically transformative, it is likely *capable enough* to bypass the controls designed by less capable entities.
  *Decision:* I will conclude that for *superhuman* useful work, the case is incoherent without an alignment assumption.

