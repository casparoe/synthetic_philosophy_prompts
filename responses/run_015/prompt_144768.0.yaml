      *   **Context:** A fortnightly "methods hour" in an academic department (philosophy). The user is a grad student/postdoc procrastinating on a 19th-century chapter.
      *   **Participants:** Marta (skeptic of the method of cases, citing cross-cultural variation) vs. Dev (defender of the method, citing expertise/calibration).
      *   **Task:** Adjudicate the debate (moves 1-7), rate each move (mistaken to right), explain why, identify rhetorical vs. substantive claims, highlight talking past each other, identify shared assumptions/missing elements, and suggest what kind of empirical/theoretical result would separate their positions.
