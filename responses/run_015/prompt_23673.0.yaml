  Here is a detailed grading breakdown, point allocation, and specific feedback you can use.

  ### Grading Scheme (Total: 10 Points)
  *   **Definitions:** 3 points (1.5 for Fink, 1.5 for Mask)
  *   **Case A:** 2 points (1 for classification, 1 for justification)
  *   **Case B:** 2 points (1 for classification, 1 for justification)
