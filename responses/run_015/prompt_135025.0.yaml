answer: |-
  ## Instructor's Note: Epistemic Status & Usage
  **Read this to your students before handing out the quiz.**
  This quiz is a **diagnostic tool**, not a truth machine. It maps the logical space of how people *actually* reason about rational choice, not necessarily how they *ought* to.
  *   **Orthodox vs. Contested:** I have flagged which positions are standard economic orthodoxy and which are live philosophical disputes.
  *   **Reconstruction:** Some categories are reconstructed from common answer patterns rather than direct quotes from specific authors.
  *   **Empty Cells:** Some combinations of answers are logically possible but rarely held by anyone; these are flagged as "Unoccupied" or "Incoherent."
  *   **Indistinguishability:** Where two philosophical positions yield the same answers on this quiz, I have noted that they are merged here for pedagogical simplicity.

  ---

  ## Part 1: The Sorting Quiz
  *Instructions: For each case, choose the option that best matches your intuition. Do not overthink; go with your gut reaction.*

  **Q1. The Standard Cycle**
  You prefer A to B, B to C, and C to A. You start with A. Someone offers to swap A for B for $1, then B for C for $1, then C for A for $1. You end up with A again, but $3 poorer.
  *   (A) You acted irrationally. Your preferences were flawed.
  *   (B) You acted foolishly, but your preferences were fine.
  *   (C) You did nothing wrong. It was a voluntary trade.

  **Q2. The Burned Money**
  Same cycle as Q1, but the person offering the swaps burns the $3 immediately. No one profits from your loss. Does this change your verdict?
  *   (A) No. The loss proves the error regardless of who gets the money.
  *   (B) Yes. If no one exploits you, there is no practical problem.
  *   (C) It makes it worse. Wasting money is worse than losing it to a trader.

  **Q3. Free Pre-Commitment**
  You know in advance you will face the cycle from Q1. You can lock yourself into keeping A for free.
  *   (A) You should lock yourself in. It prevents the loss.
  *   (B) You shouldn't need to. If you are rational, you won't trade in the first place.
  *   (C) You cannot lock yourself in. Your future self will just undo it.

  **Q4. The Committee**
  A three-person committee votes on A, B, and C. Majority rule creates the same cycle (A beats B, B beats C, C beats A). The committee loses money just like the individual in Q1.
  *   (A) The committee is irrational, just like the individual.
  *   (B) The committee isn't an "agent," so it can't be irrational.
  *   (C) The committee is irrational, but the individual isn't (they are different cases).

  **Q5. Time Inconsistency**
  Today you prefer $110 in 30 days over $100 in 29 days. In 29 days, you prefer $100 today over $110 tomorrow. Is this the same defect as the cycle in Q1?
  *   (A) Yes. It is a consistency failure over time.
  *   (B) No. It is a psychological quirk, not a logical error.
  *   (C) Yes, but it is excusable because the future feels different.

  **Q6. The Self-Torturer**
  You can increase your wealth by $100 by turning a dial up one notch. The pain increase is imperceptible. You do this 1,000 times. You end up rich but in agony.
  *   (A) Each step was rational; the outcome is just bad luck.
  *   (B) You should have stopped earlier. The total outcome matters.
  *   (C) You are irrational for not setting a limit at the start.

  **Q7. Preference Correction (The Swap)**
  *Note: I have swapped your "Unimaginable Future" case for this one. See TA Notes for why.*
  You have cyclic preferences (Q1). A scientist offers a pill that will make your preferences transitive (consistent) for free.
  *   (A) Take the pill. Fix the mind, not just the choices.
  *   (B) Don't take the pill. Just learn not to trade.
  *   (C) It doesn't matter. Preferences are just desires, not errors.

  **Q8. Which Self Decides?**
  You know your preferences will change radically in 10 years (e.g., you will love what you now hate). Who should make the plan for your life?
  *   (A) Your current self. It's your life.
  *   (B) Your future self. They know what they will want.
  *   (C) Neither. You cannot plan across radical change.

  ---

  ## Part 2: The Scoring Key & Taxonomy
  *Do not hand this out to students. This is for your mapping.*

  The quiz sorts students along three axes:
  1.  **Locus of Rationality:** Is the error in the *Preferences* (Mind) or the *Choice* (Action)?
  2.  **Agent Unity:** Is the self over time (or the committee) one agent or many?
  3.  **Normative Source:** Is irrationality defined by *Coherence* (logic) or *Outcome* (loss/exploitation)?

  ### The Leaves (Positions)

  **Leaf 1: The Orthodox Coherentist**
  *   **Pattern:** Q1(A), Q2(A), Q3(B), Q5(A), Q7(A).
  *   **Logic:** Rationality is internal consistency. If preferences cycle, the agent is broken. Pre-commitment is a crutch for the irrational.
  *   **Label:** **Transitivity Maximizers** (Standard Econ).
  *   **Defensibility:** **High (Orthodox).** This is the baseline model. Hard to defend against "why does logic dictate desire?" but standard in the field.

  **Leaf 2: The Pragmatic Skeptic**
  *   **Pattern:** Q1(C) or (B), Q2(B), Q3(A), Q7(C).
  *   **Logic:** There is no rationality without a predator. If money is burned (Q2), there is no problem. Preferences are just tastes; only losses matter.
  *   **Label:** **Money Pump Skeptics**.
  *   **Defensibility:** **Medium.** Defensible in pure economics, weak in philosophy. Fails to explain why we advise friends not to cycle even in private.

  **Leaf 3: The Resolute Chooser**
  *   **Pattern:** Q1(B), Q3(A), Q5(A), Q6(C), Q8(A).
  *   **Logic:** Preferences can be flawed, but rationality is about *planning and sticking to it*. You bind your future self to protect your current plan.
  *   **Label:** **Resolute Choice** (McClennen).
  *   **Defensibility:** **High (Philosophy).** Very popular in action theory. Vulnerable to the charge that it requires "magical" willpower.

  **Leaf 4: The Sophisticated Chooser**
  *   **Pattern:** Q1(B), Q3(A), Q5(A), Q6(C), Q8(B).
  *   **Logic:** You anticipate your future weakness and constrain yourself, but you acknowledge the future self has a vote. You plan *around* your flaws.
  *   **Label:** **Sophisticated Choice** (Strotz/Ainslie).
  *   **Defensibility:** **High.** Psychologically realistic. Merges with Resolute on action, differs on *why* (anticipation vs. resolution). *Note: This quiz may not fully separate Resolute from Sophisticated; see TA Notes.*

  **Leaf 5: The Fragmentalist**
  *   **Pattern:** Q4(B) or (C), Q5(B), Q8(C).
  *   **Logic:** The "self" over time is like the "committee." There is no single agent to be rational. Cycles are just conflicts between different temporal selves.
  *   **Label:** **Temporal Fragmentalism**.
  *   **Defensibility:** **Medium/Live Dispute.** Gaining traction. Solves the pump by dissolving the agent. Risk: Makes planning impossible.

  **Leaf 6: The Localist (Sorites)**
  *   **Pattern:** Q6(A), Q1(B).
  *   **Logic:** Rationality is step-by-step. If every step is an improvement (or imperceptibly worse), you are rational, even if the destination is hell.
  *   **Label:** **Myopic Localists**.
  *   **Defensibility:** **Low.** Intuitively unattractive (ends in agony), but logically consistent if you reject global aggregation.

  **Leaf 7: The Preference Instrumentalist**
  *   **Pattern:** Q7(B), Q1(B), Q3(A).
  *   **Logic:** Preferences are tools, not masters. Don't fix the preferences (pill); fix the environment (lock the door).
  *   **Label:** **Choice Architects**.
  *   **Defensibility:** **Medium.** Practical, but sidesteps the question of whether the preferences themselves were "wrong."

  **Leaf 8: The Empty Cell (Incoherent)**
  *   **Pattern:** Q1(A) [Cycles are irrational] + Q2(B) [But burning money makes it ok].
  *   **Diagnosis:** If the error is logical (A), the presence of a predator shouldn't matter. This combination suggests the student doesn't understand the argument.
  *   **Status:** **Incoherent.**

  ---

  ## Part 3: TA Notes & Defense Strategy

  ### 1. The Case Swap (Unimaginable Future vs. Preference Correction)
  I dropped your **"Unimaginable Future"** case and swapped in **Q7 (Preference Correction)**.
  *   **Why:** In a sorting quiz, the "Unimaginable" case tends to collapse. Almost every student answers "You can't plan for the unknown," which puts them in a "No Plan" bucket without telling you *why* they think planning failed.
  *   **Diagnostic Gain:** Q7 forces a choice between **Substantive Rationality** (fix the mind/prefs) and **Procedural Rationality** (fix the action/choice). This is the core philosophical dispute in the literature.
  *   **How to reintroduce your case:** Use the "Unimaginable Future" case in the seminar discussion *after* the quiz. Ask the "Resolute" students: "Can you resolve to stick to a plan for a future value you can't currently comprehend?" This breaks the Resolute position in a way the quiz cannot.

  ### 2. Indistinguishable Leaves
  *   **Resolute vs. Sophisticated:** On this quiz, these two often look identical (both say "Pre-commit"). They differ on *phenomenology*: The Resolute chooser *changes* their choice to match the plan; the Sophisticated chooser *predicts* they will deviate and blocks the deviation.
      *   *Seminar Tip:* If a student lands here, ask: "When the time comes to trade, do you *want* to trade?" If Yes $\rightarrow$ Sophisticated. If No $\rightarrow$ Resolute.
  *   **Orthodox vs. Resolute:** Both hate cycles. Orthodox says "Don't have the prefs." Resolute says "Have the prefs, but don't act on them." Q7 separates them.

  ### 3. Defensibility Ratings (For your seminar defense)
  *   **Safest Bet:** **The Orthodox Coherentist.** It is the standard model. If you defend this, you are defending the syllabus baseline.
  *   **Most Philosophically Rich:** **Resolute Choice.** It allows you to discuss agency and willpower.
  *   **Most Dangerous:** **The Fragmentalist.** If you defend this too hard, students may conclude "Nothing is rational," which kills the rest of the module. Frame it as: "This view explains why we feel conflicted, but makes normative advice hard."
  *   **Weakest:** **The Localist (Sorites).** Hard to defend ending up in agony as "rational." Use this as a *reductio ad absurdum* for students who insist every small step is rational.

  ### 4. Live Disputes vs. Orthodox Truths
  *   **Orthodox:** Transitivity is a requirement for rationality (Leaf 1).
  *   **Dispute:** Whether dynamic inconsistency (Q5) is the *same* error as a preference cycle (Q1). Some say yes (both are coherence failures); some say no (one is logic, one is psychology).
  *   **Dispute:** Whether the "Self" is a unitary agent (Leaf 1-4) or a collection of temporal parts (Leaf 5).
  *   **Reconstruction:** The "Preference Instrumentalist" (Leaf 7) isn't a standard named theory in the syllabus, but it captures a very common student intuition that "preferences are just feelings." I have reconstructed this category to validate their intuition without letting them off the hook.

  ### 5. Handling the "Empty Cell"
  If a student lands in **Leaf 8 (Incoherent)**, do not tell them they are wrong. Tell them: *"You seem to think the problem is the loss of money, not the cycle itself. If so, you aren't a Coherentist; you're a Skeptic. Let's see if that holds up when we burn the money."* This moves them to Leaf 2 without calling their logic broken.
