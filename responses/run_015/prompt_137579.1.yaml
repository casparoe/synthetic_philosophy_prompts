prompt: |-
  I was handed leadership of a small replication unit attached to a psychology department six months ago, shortly after a journalist quoted one of our "failed to replicate" verdicts about a finding its original authors had built careers on and I found I could not defend the wording. We run about four pre-registered multi-site replications a year and issue a short verdict on each that other researchers rely on, and our internal disagreements have convinced me we need a written procedure rather than argument case by case: two of us read a non-significant result with a tight interval as evidence of absence, two read the same numbers as "this design could never have detected the original effect anyway" and want to call it uninformative, and we have no agreed handling of a significant result in the opposite direction, or of a point estimate that is a third of the original's.

  So I want a decision procedure we can run in a fixed order on each completed replication, taking design and results to one of a small set of verdicts, with an explicit account of what to do when we cannot get the numbers we would want — we usually have neither the original raw data nor the original authors' cooperation. Two features of our setup make this harder than the standard treatment of the question. First, we no longer report a single Bayes factor; before seeing the replication data we elicit a predicted-effect distribution from three sources — the original authors, a skeptic we appoint, and a small meta-analysis of comparable studies — and report all three. The procedure has to say what the verdict is when these disagree about whether the data support the effect, and whether such disagreement should itself be published as an outcome rather than settled by the procedure. Second, we treat "did this replication actually test the original claim" as separate from "what do the numbers say," and I am unsure where it belongs in the sequence and what would count as a sufficient yes.

  Be committed: make the actual choices — the verdict labels, the order of operations, whatever thresholds you think belong — and give your reasons, including where you think our three-source policy is a mistake and where you would overrule the way replications are usually reported. Mark the steps that stay judgment calls no formalism removes. Then run the finished procedure on two of our cases: a replication landing at roughly a third of the original effect size, with an interval excluding zero but excluding the original value too, and a non-significant result whose interval comfortably includes both zero and the original effect. I suspect I will dislike at least one of the verdicts; give it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Leader of a small replication unit in a psychology department.
      *   **Problem:** Internal disagreement on interpreting replication results (evidence of absence vs. uninformative, opposite direction, smaller effect sizes). Need a standardized, written decision procedure.
      *   **Constraints/Features:**
          *   ~4 pre-registered multi-site replications/year.
          *   Issue short verdicts relied upon by others.
          *   No access to original raw data or authors' cooperation usually.
          *   **Unique Feature 1:** Elicit predicted-effect distributions from three sources *before* data collection (Original Authors, Appointed Skeptic, Meta-Analysis). Report all three. Need to handle disagreement among these priors.
          *   **Unique Feature 2:** Distinguish "Did this test the original claim?" (Validity) from "What do the numbers say?" (Outcome).
          *   **Requirement:** Commit to specific verdict labels, thresholds, and order of operations. Identify remaining judgment calls. Critique the three-source policy if necessary.
          *   **Task:** Run the procedure on two specific cases (1/3 effect size, significant but excludes original; Non-significant, wide interval).
          *   **Tone:** Professional, decisive, methodological, slightly critical but constructive.

  2.  **Deconstruct the Core Challenges:**
      *   *Interpretation of Non-significance:* Is it "No Effect" or "Inconclusive"? Depends on power/precision relative to the *smallest effect size of interest* (SESOI) or the original effect.
      *   *Interpretation of Significant but Smaller:* Is it a "Partial Replication" or "Failure"?
      *   *Interpretation of Opposite Sign:* "Contradiction."
      *   *The Three-Source Prior:* This is innovative but risky. If they disagree, does it invalidate the Bayes Factor (BF)? The prompt asks how to handle verdicts when they disagree.
      *   *Validity Check:* Needs to happen *before* looking at outcome data to avoid bias, but practically often happens during analysis. The prompt says "separate from," implying a gatekeeping step.

  3.  **Develop the Decision Procedure (The "Protocol"):**

      *   **Step 0: Fidelity Check (The "Did it test the claim?" step).**
          *   Must happen before outcome interpretation.
          *   Criteria: Protocol alignment, material equivalence, statistical power (based on *original* effect, not observed).
          *   Verdict: "Valid Test" or "Invalid/Compromised Test." If Invalid, stop or label as "Methodological Critique" rather than replication verdict.
      *   **Step 1: Directional Consistency.**
          *   Check sign of effect.
          *   Verdict: "Contradictory" if opposite sign and significant.
      *   **Step 2: Precision/Power Check (The "Uninformative" gate).**
          *   Crucial for non-significant results.
          *   Use the *Smallest Effect Size of Interest* (SESOI) or the lower bound of the Original Effect's CI.
          *   If the Replication CI includes effects large enough to be meaningful -> "Inconclusive."
          *   If the Replication CI excludes meaningful effects -> "Evidence of Absence."
      *   **Step 3: Effect Size Comparison (The "Success" gate).**
          *   If significant and same direction.
          *   Does the CI include the Original Effect?
          *   If yes -> "Successful Replication."
          *   If no (but significant) -> "Successful Replication (Attenuated)."
      *   **Handling the Three-Source Priors:**
          *   This is the tricky part. The prompt asks what to do when they disagree.
          *   *Critique:* Relying on original authors' priors is often optimistic. Skeptics are often pessimistic. Meta-analysis is usually best but heterogeneous.
          *   *Decision:* Do not let the priors determine the *frequentist* verdict (Significance/CI). Use them for a *Bayesian* supplement. If priors disagree wildly, report the range of Bayes Factors but do not let it override the CI-based verdict. The "Verdict" should be frequentist/CI-based for clarity; the "Bayesian Update" is secondary context. *Correction:* The prompt says "The procedure has to say what the verdict is when these disagree." Okay, I need to integrate this.
          *   *Integration:* If the data falls in a zone where priors disagree (e.g., Skeptic says "Evidence for Null," Author says "Evidence for Effect"), label the verdict as "Ambiguous under Prior Disagreement." *Better:* Stick to the data for the main verdict. Use the priors to qualify the *strength* of the verdict.
          *   *Hard Choice:* I will recommend decoupling the *Verdict* (based on CI/SESOI) from the *Bayesian Interpretation* (based on priors). If priors disagree, report the disagreement as a finding itself ("Theoretical Uncertainty").

  4.  **Drafting the Procedure Steps (Iterative Refinement):**

      *   *Phase 1: Fidelity.* (Pass/Fail).
      *   *Phase 2: The Outcome.*
          *   Check Sign.
          *   Check CI against Zero and Original Effect.
          *   Check CI against SESOI (Smallest Effect Size of Interest).
      *   *Phase 3: The Priors.*
          *   Calculate BFs for all three.
          *   If consensus -> Strengthen verdict.
          *   If dissensus -> Add "Theoretical Disagreement" tag.

      *   *Refining Verdict Labels:*
          1.  **Replication Failure (Evidence of Absence)**
          2.  **Replication Failure (Inconclusive/Uninformative)**
          3.  **Replication Success (Consistent)**
          4.  **Replication Success (Attenuated)**
          5.  **Contradiction (Opposite Effect)**
          6.  **Protocol Deviation (Invalid Test)**

      *   *Refining the "Three Source" Issue:*
          *   User asks: "whether such disagreement should itself be published as an outcome rather than settled by the procedure."
          *   My advice: Yes. It's a feature, not a bug. It shows the field is unsettled.
          *   Procedure: Calculate BFs. If 2 vs 1, note it. If 3-way split, note it. Do not change the CI-based verdict, but append the Bayesian status.

  5.  **Addressing the Specific Cases:**

      *   *Case 1:* Effect ~1/3 of original. Significant (excludes 0). CI excludes Original Effect.
          *   Standard view: "Failed to replicate magnitude."
          *   My Procedure: "Replication Success (Attenuated)." Why? Because the effect exists, just smaller. But need to flag the prior disagreement likely here (Authors expect big, Skeptic expects small).
      *   *Case 2:* Non-significant. CI includes 0 AND Original Effect.
          *   Standard view: "Inconclusive."
          *   My Procedure: "Replication Failure (Inconclusive/Uninformative)." Crucial distinction: It's not evidence of absence. It's a waste of resources essentially.

  6.  **Critique and "Commitments":**
      *   *Three-Source Policy:* It's expensive and cognitively demanding. Original authors are biased. Skeptics are arbitrary. Meta-analysis is best. *Recommendation:* Drop the "Original Author" prior elicitation. They are stakeholders, not objective priors. Keep Skeptic and Meta-Analysis.
      *   *Verdicts:* Most replication units say "Success/Failure." I am introducing "Attenuated" and "Inconclusive." This is necessary for nuance.
      *   *Fidelity:* Must be pre-registered.

  7.  **Final Review against Constraints:**
      *   Fixed order? Yes.
      *   Verdict labels? Yes.
      *   Handle missing data? Yes (use published original effect sizes/CIs).
      *   Handle prior disagreement? Yes (report as meta-outcome).
      *   Fidelity separate? Yes (Step 1).
      *   Run on two cases? Yes.
      *   Be committed/stern? Yes.

  8.  **Constructing the Output:**
      *   Introduction: Acknowledge the difficulty.
      *   The Procedure (Step-by-Step).
      *   The Critique (Three-source policy).
      *   The Application (Two Cases).
      *   Conclusion.

      *(Self-Correction during drafting)*: Wait, regarding the Three-Source Policy. The prompt says "The procedure has to say what the verdict is when these disagree." If I just say "report it," is that a verdict? I need to be stronger. If the data is ambiguous *and* the priors disagree, the verdict is "Theoretically Contested." If data is clear but priors disagree, the data wins. I will make the CI/SESOI the *arbiter* of the verdict, and the Priors the *arbiter* of the theoretical implication.
      *Actually, let's look closer:* "report all three... procedure has to say what the verdict is when these disagree."
      *Decision:* The Verdict is about the *phenomenon*, not the *priors*. The Verdict remains based on the data (CI/SESOI). The *Report* includes the Prior Disagreement Index. I will argue that letting priors dictate the verdict is a category error. The verdict is "What happened," the priors are "What we expected."
      *Wait, one more thing:* The prompt asks me to mark steps that stay judgment calls. I need to be explicit about that.

      *Refining Case 1:* 1/3 effect, sig, excludes original.
      *   Is it a success? Technically yes, effect exists.
      *   Is it a failure? Original claim was likely about the magnitude.
      *   My label: "Replication Success (Attenuated)."
      *   Reasoning: Existence > Magnitude for basic claims, but magnitude matters for theory.

      *Refining Case 2:* Non-sig, wide CI (includes 0 and Original).
      *   Label: "Inconclusive (Underpowered)."
      *   Reasoning: Cannot distinguish noise from effect.

      *Refining the Three-Source Critique:* I need to be bold. Eliciting from Original Authors is methodologically unsound for a "neutral" replication unit. They are litigants, not judges. I will advise dropping them or treating their prior as a "Maximum Plausible Effect" bound rather than a probability distribution.

      *Let's finalize the Procedure Order:*
      1. Fidelity (Go/No-Go).
      2. Direction (Opposite?).
      3. Precision (SESOI check).
      4. Magnitude (Original Effect check).
      5. Bayesian Consensus (Reporting layer).

      *Okay, ready to write.*
answer: |-
  This is a structural problem, not a statistical one. Your unit is trying to adjudicate scientific claims without a constitution. You need a flowchart that forces consensus by removing discretion from the places where discretion causes conflict.

  Below is the **Replication Verdict Protocol (RVP-1)**. It is designed to be run in strict sequence. It prioritizes *precision* over *significance* and separates *validity* from *outcome*.

  ### Part 1: The Decision Procedure (RVP-1)

  **Pre-requisite:** All steps rely on the 95% Confidence Interval (CI) of the replication effect size and the Original Effect Size ($d_{orig}$) with its 95% CI, extracted from the original publication.

  #### Step 1: The Fidelity Gate (Validity)
  *Question:* Did this study test the original claim?
  *Criteria:*
  1.  **Protocol Adherence:** Were all pre-registered analysis steps followed? (Yes/No)
  2.  **Material Equivalence:** Were stimuli/procedures functionally equivalent to the original? (Yes/No/Debatable)
  3.  **Power:** Was the sample size calculated to detect $d_{orig}$ with 90% power? (Yes/No)

  *Decision:*
  *   If **No** to any: Verdict = **"Protocol Deviation (Invalid Test)."** Stop. Publish as a methodological critique, not a replication verdict.
  *   If **Yes** to all: Proceed to Step 2.

  *(Judgment Call: "Material Equivalence." You cannot formalize this entirely. It requires a senior researcher to sign off that the manipulation was not fundamentally altered.)*

  #### Step 2: Directional Check
  *Question:* Is the effect in the opposite direction?
  *Criteria:* Is the replication point estimate opposite in sign to $d_{orig}$ AND is the 95% CI excluding zero?

  *Decision:*
  *   If **Yes**: Verdict = **"Contradiction."** Stop. (This overrides all magnitude considerations).
  *   If **No**: Proceed to Step 3.

  #### Step 3: The Precision Gate (Evidence of Absence)
  *Question:* Is the result informative?
  *Criteria:* Define a **Smallest Effect Size of Interest (SESOI)**. If you cannot agree on a theoretical SESOI, default to the lower bound of the original study's 95% CI ($d_{orig\_lower}$).
  *   Compare the replication's 95% CI upper bound ($CI_{upper}$) to the SESOI.

  *Decision:*
  *   If $CI_{upper} < SESOI$: The data rules out effects large enough to matter. Verdict = **"Evidence of Absence."** Stop.
  *   If $CI_{upper} > SESOI$: The data is compatible with a meaningful effect. Proceed to Step 4.

  *(Reasoning: This solves your "uninformative" fight. A non-significant result is only "Evidence of Absence" if the interval is tight enough to rule out the effect you cared about. Otherwise, it is merely noise.)*

  #### Step 4: Magnitude Consistency
  *Question:* Is the effect size consistent with the original claim?
  *Criteria:* Compare the replication 95% CI to $d_{orig}$.

  *Decision:*
  *   If $d_{orig}$ falls **within** the replication 95% CI: Verdict = **"Replication Success."**
  *   If $d_{orig}$ falls **outside** the replication 95% CI (but effect is significant and same direction): Verdict = **"Replication Success (Attenuated)."**
  *   If effect is **non-significant** (CI includes 0) but CI is wide (failed Step 3): Verdict = **"Inconclusive."**

  #### Step 5: The Bayesian Overlay (Reporting Only)
  *Question:* Do the priors agree on the interpretation?
  *Action:* Calculate Bayes Factors ($BF_{10}$) for the three elicited priors (Author, Skeptic, Meta-Analysis).
  *   **Consensus:** All three BFs point to the same qualitative conclusion (e.g., all support $H_1$ or all support $H_0$). -> Append **"High Theoretical Confidence."**
  *   **Dissensus:** At least one prior supports $H_1$ while another supports $H_0$. -> Append **"Theoretically Contested."**

  *(Reasoning: Do not let the priors determine the verdict. The verdict is about the world (Step 1-4); the priors are about the field's expectations (Step 5). If they disagree, that is a finding about the state of the literature, not the data.)*

  ---

  ### Part 2: Critique of Your Current Setup

  You asked where I think your three-source policy is a mistake. **It is the elicitation of the Original Authors' prior.**

  1.  **Stakeholder Bias:** Original authors are litigants in this process. Their "prediction" is not a prior belief; it is a defense of their career capital. Eliciting a distribution from them invites strategic inflation. If they predict a huge effect and you find a small one, they claim the prior wasn't met, not the theory.
  2.  **Overweighting Noise:** Giving the Original Author equal weight to a Meta-Analysis in the "Verdict" procedure grants undue authority to a single, potentially noisy, publication.
  3.  **Recommendation:** Drop the Original Author elicitation for the *procedure*. Keep the Meta-Analysis (empirical baseline) and the Skeptic (theoretical stress test). If you must keep the Author, treat their distribution as a **"Maximum Plausible Claim"** bound, not a probability distribution to be updated.

  **On "Uninformative" Results:**
  Standard replication reporting often labels non-significant results as "Failed Replications." This is scientifically dishonest. My procedure (Step 3) forces you to label them **"Inconclusive"** if the CI is wide. This will be unpopular with journals but necessary for integrity.

  **On Judgment Calls:**
  No formalism removes the need for human judgment on **Step 1 (Material Equivalence)** and the selection of the **SESOI** in Step 3. You must pre-register the SESOI before data collection. If you do not, Step 3 collapses into argument.

  ---

  ### Part 3: Running the Procedure on Your Cases

  Here is how RVP-1 handles the two scenarios you described.

  #### Case 1: The "One-Third" Effect
  *   **Data:** Replication $d = 0.15$ (Original $d = 0.45$). Replication 95% CI $[0.05, 0.25]$. Original 95% CI $[0.30, 0.60]$. Result is significant (excludes 0).
  *   **Step 1 (Fidelity):** Assume Pass.
  *   **Step 2 (Direction):** Same direction. Pass.
  *   **Step 3 (Precision):** SESOI set at Original Lower Bound (0.30). Replication $CI_{upper}$ is 0.25.
      *   $0.25 < 0.30$.
      *   *Wait:* This triggers **"Evidence of Absence"** regarding the *original claim's magnitude*.
      *   *Correction for Nuance:* If your theory only claims the effect *exists* (sign > 0), Step 3 SESOI should be near zero. If your theory claims the effect is *substantial* (near original), SESOI is high.
      *   *Applying RVP-1 Strict:* If SESOI was pre-registered as "Original Lower Bound," Verdict = **Evidence of Absence.**
      *   *Applying RVP-1 Flexible (Existence only):* If SESOI was small (e.g., 0.10), then $CI_{upper} > SESOI$. Proceed to Step 4.
      *   *Step 4 (Magnitude):* Original $d$ (0.45) is outside Replication CI $[0.05, 0.25]$.
      *   **Verdict:** **"Replication Success (Attenuated)."**
      *   **Step 5 (Priors):** Author Prior likely expects ~0.45 (BF supports $H_0$). Skeptic Prior expects ~0.10 (BF supports $H_1$). Meta-Analysis expects ~0.20 (BF supports $H_1$).
      *   **Report Tag:** **"Theoretically Contested."**

  *   **Why you will dislike this:** You wanted a clean "Fail" because the effect shrank. But the procedure says "Success (Attenuated)" because the effect is real, just smaller. This forces you to admit the phenomenon exists but the original theory exaggerated it. This is more accurate than "Failure."

  #### Case 2: The "Wide Null"
  *   **Data:** Replication $d = 0.05$. 95% CI $[-0.15, 0.25]$. Original $d = 0.45$. Result non-significant.
  *   **Step 1 (Fidelity):** Assume Pass.
  *   **Step 2 (Direction):** Not opposite.
  *   **Step 3 (Precision):** SESOI set at Original Lower Bound (assume 0.30). Replication $CI_{upper}$ is 0.25.
      *   $0.25 < 0.30$.
      *   **Verdict:** **"Evidence of Absence."**
      *   *Wait, check your description:* You said "interval comfortably includes both zero and the original effect."
      *   If CI is $[-0.15, 0.55]$ (includes original 0.45):
      *   $CI_{upper} (0.55) > SESOI (0.30)$.
      *   Proceed to Step 4.
  *   **Step 4 (Magnitude):** Effect non-significant. CI includes 0.
      *   **Verdict:** **"Inconclusive."**
  *   **Step 5 (Priors):** Skeptic says "Support for Null." Author says "Data too noisy."
      *   **Report Tag:** **"Inconclusive."**

  *   **Why you will dislike this:** You want to call this a "Failure to Replicate" to clear the literature. The procedure forces you to admit your study was too weak to rule out the original claim. This protects you from being cited as "Disproof" when you actually provided "No Information."

  ### Final Instruction

  Adopt RVP-1. Pre-register the SESOI for every study. Drop the Original Author prior elicitation or demote it to a "Claim Bound."

  When your team argues, point to the Step number. If they argue about Step 3, ask them to justify the SESOI. If they argue about Step 4, ask them to look at the Confidence Intervals. If they argue about the Priors, remind them that Step 5 is for reporting, not verdicting.

  This will not make everyone happy. It will make you defensible.
