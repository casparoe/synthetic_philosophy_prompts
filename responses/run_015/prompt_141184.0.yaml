  Two freelance developers, Alice and Bob, are integrating a shared module into a client's legacy stack. They publicly commit to the same refactoring protocol ("Do the rational thing"), knowing the other has done the same. If both successfully implement the protocol, the client is happy and each earns $10. If one implements and the other fumbles, the implementer wastes effort fixing the breakage (-$5) while the fumbler rides free on the partial fix ($15). If both fumble, the module crashes and both earn $0. They are "half-twins": they run the same decision algorithm, but each faces an independent probability $\epsilon$ of human error—fatigue, misread docs, or panic—that flips their final action regardless of intent.

  Let $\epsilon = 0.1$ (10% error rate). Payoffs are $T=15, R=10, P=0, S=-5$.
  **CDT** treats the other's action as causally independent. $EU(C) = 0.9(10) + 0.1(-5) = 8.5$ is incorrect; CDT says my action doesn't change the probability of yours. Assuming a flat prior or dominance, $EU(C) = p(10) + (1-p)(-5)$ vs $EU(D) = p(15) + (1-p)(0)$. The difference is always $-5$. **Verdict: Defect.**
  **EDT** treats my action as evidence of yours. If I Cooperate, it's evidence I adopted the protocol, so you adopted the protocol. You Cooperate unless you fumble ($0.9$). $EU(C) = 0.9(10) + 0.1(-5) = 8.5$. If I Defect, evidence suggests you adopted Defect, so you Defect unless you fumble ($0.1$). $EU(D) = 0.1(15) + 0.9(0) = 1.5$. **Verdict: Cooperate.**
  **FDT** treats the decision as fixing the algorithm's output. I choose "Adopt Protocol". You run the same algorithm, so you choose "Adopt Protocol". Noise applies post-decision. The math matches EDT: $EU(\text{Adopt C}) = 8.5$, $EU(\text{Adopt D}) = 1.5$. **Verdict: Cooperate.**
  **Superrationality** relies on the identity of rational conclusions implying identical outcomes. With $\epsilon > 0$, the outcomes are not identical. The premise "we will do the same thing" is falsified. Without that logical lock, the theory offers no bridge to cooperation. **Verdict: No determinate answer (pragmatically Defect).**

  **Thresholds:** CDT never cooperates. EDT and FDT flip at $\epsilon = 1/3$ (where $10 - 15\epsilon = 15\epsilon$). Superrationality flips at $\epsilon = 0$. The feature doing the work is the **locus of correlation**: FDT correlates the *algorithm's intent* (robust to noise), while Superrationality correlates the *physical outcome* (fragile to noise). At $\epsilon = 0$, noise vanishes, intent equals outcome, and all non-CDT theories collapse into universal cooperation.

  **The Strongest Superrationalist Reply:** "You have changed the subject. Superrationality is a theory of perfect rational agents. If $\epsilon > 0$, the agents are not perfectly rational, so the theory does not apply. To ask superrationality to handle error is like asking Euclidean geometry to handle curved space; you need a broader framework (FDT), but that doesn't mean the original theorem was wrong, only that its axioms weren't met." This concedes your point: for actual humans, the axiom is never met, making the theory unusable outside the ideal limit.
