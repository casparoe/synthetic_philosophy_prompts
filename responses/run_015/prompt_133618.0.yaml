  Please provide your response as exactly five numbered items, each comprising one or two sentences, with no introduction or conclusion. For each item, identify an open question or line of inquiry in the study of invented traditions and imagined communities, defend its priority relative to the others using criteria such as upstream dependency, tractability for political theorists rather than empirical data scientists, and relevance to non-territorial identity formation, and indicate what kind of evidence over the next few years would cause you to revise the ranking. Assume that some modern communities invent traditions to evade rather than capture state authority, and explain why the ordering you propose should guide how a historian or philosopher allocates limited research effort.
