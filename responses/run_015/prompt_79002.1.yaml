      1.  **Formalizing Corrigibility/Interruptibility.** (Decision Theory). High leverage. If we can't define it, we can't build it.
      2.  **The Semantics of Internal Objectives.** (Interpretability/Philosophy). What does it mean for a system to "want" something?
