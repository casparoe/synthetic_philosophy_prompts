      *   **Task:** Create a prioritized list of open *conceptual* questions for a funder supporting 8-10 researchers for 3 years (philosophy, decision theory, formal epistemology, theory-adjacent math, *no* empirical ML).
      *   **Requirements:**
          *   Reasoning *before* the list.
