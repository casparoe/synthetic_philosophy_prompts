  8.  **Final Polish:**

      *   Ensure the distinction between "Specification Gaming" and "Inner Alignment" is handled conceptually, not empirically.
      *   Make sure the "One vs. Many" section doesn't just say "it depends." It needs to take a stance on whether it's fundable. (Stance: It is fundable *only* as a mapping exercise, not a metaphysical debate).
      *   Ensure the "Update Conditions" are concrete.

      *(Self-Correction on the User's Criterion)*: The user suggests: "Solving every part must entail solving the whole." This is logically problematic. If I solve "robustness" and "specification," do I solve "multi-agent erosion"? Not necessarily. The whole might be greater than the sum of parts due to interaction effects. I need to point this out. The criterion should be about *bottlenecks*, not just summation.

      *(Refining the List)*: Let's make sure the list items are distinct *conceptual* problems.
      1.  **The Ontology of Goals:** What is a "preference" in a high-dimensional vector space?
