      *   *Bet 3: Timeline.* Short timelines favor robustness/corrigibility. Long timelines favor foundational theory.

  7.  **Refining the Output (Self-Correction during drafting):**

      *   *Tone:* Needs to be decisive, analytical, and respectful of the constraint (no empirical ML).
