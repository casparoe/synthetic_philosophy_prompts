answer: |-
  **SCENE START**

  **INT. COURTHOUSE CONFERENCE ROOM - DAY**

  A sterile room with a humming HVAC unit. Two stacks of files sit on the table. DR. ALAN STERLING (50s, precise, wearing a suit that looks like a uniform) stands by the window. DR. ELENA CORVES (40s, sharp eyes, sleeves rolled up) sits, spinning a pen.

  STERLING
  The report stands as written, Elena. The random match probability is one in ten million. The Likelihood Ratio is ten million to one. That is the weight of the evidence. Anything else is speculation.

  CORVES
  It's not speculation, Alan. It's arithmetic. You're handing the jury a engine without a key. You tell them the car can go ten million miles per gallon, but you won't tell them if there's any gas in the tank.

  STERLING
  (Turns from the window)
  My job is to characterize the evidence, not the defendant. I can tell you how rare this DNA profile is in the population. I cannot tell you the probability that the defendant is guilty. That is the ultimate issue. It belongs to the jury.

  CORVES
  And how do you expect them to use your number? The prosecutor is already salivating. He's going to stand up and say, "There is only a one in ten million chance this DNA belongs to anyone other than the defendant."

  STERLING
  Which is why I will object. That is the Prosecutor's Fallacy. Confusing the probability of the evidence given innocence with the probability of innocence given the evidence. $P(E|I)$ is not $P(I|E)$. I will make sure that distinction is on the record.

  CORVES
  Objecting isn't explaining. You stop them from lying, but you leave the jury with a vacuum. They hear "one in ten million" and they hear "certainty." Look at the base rate, Alan. This city has ten million residents.

  STERLING
  I am aware of the census data.

  CORVES
  Then you know the math. If the profile appears once in ten million people, and there are ten million people in the city, the expected number of people with this profile is one.

  STERLING
  Approximately.

  CORVES
  Not approximately. Statistically, that means in addition to the defendant, there is likely one other person walking around this city who matches this profile. If the only thing we know is that the perpetrator is in the city, and the only evidence is this DNA, the odds are not ten million to one. They are one to one. Fifty percent.

  STERLING
  (Stiffens)
  That is absurd. You are assigning a prior probability of guilt based on... what? A census count?

  CORVES
  I'm assigning a prior based on the relevant population. If we have no other evidence—no fingerprints, no motive, no eyewitnesses—then before we ran the DNA test, the defendant was just one of ten million suspects.

  STERLING
  And that is where you lose rigor. You are injecting subjectivity. Where do you stop? Do we adjust the prior if he lives in the neighborhood? If he owns a car? You are cooking the books to get a posterior probability that feels satisfying. I refuse to state a probability of guilt. It implies a precision I do not possess.

  CORVES
  (Leans forward)
  And by refusing, you imply a certainty you *don't* possess. You think you're being neutral, Alan. But silence isn't neutral. When you say "Likelihood Ratio of ten million" without context, the jury hears "Guilty." That is a bias.

  STERLING
  (Pauses. He walks to the table, places a hand on the file.)
  I concede... that the raw number is easily misused. I have seen it happen. Juries do treat a one in a million match as absolute proof. It is a cognitive shortcut.

  CORVES
  Thank you.

  STERLING
  However. I also concede that your "fifty percent" relies on a assumption that the true perpetrator is definitely in the database, or definitely in the city. What if the killer drove in from the suburbs? What if it's a cousin from out of state? Your prior is just as arbitrary as the prosecutor's fallacy.

  CORVES
  (Sighs, stops spinning the pen)
  You're right. The "city limit" prior is a simplification. If the perpetrator isn't in the reference class, my posterior collapses. I can't claim my fifty percent is the absolute truth. It's only the truth *given* the assumption that the crime was committed by a resident.

  STERLING
  Exactly. So we are back to square one. I provide the Likelihood Ratio. I explain that it measures how much more likely the evidence is if he is the source versus if he is not. I explicitly warn them that this does not account for the possibility of other matches in the population.

  CORVES
  But you won't give them the calculation for those other matches.

  STERLING
  Because I am a frequentist. I deal in the long-run frequency of the test, not the odds of a single event's hypothesis.

  CORVES
  And I am a Bayesian. I deal in degrees of belief updating in light of new data. The jury has to make a binary decision: Guilty or Not Guilty. That is a bet. They are betting a man's life. They need odds.

  STERLING
  They need to understand that DNA is not a magic wand. If I tell them there is a fifty percent chance he is innocent, they might acquit a murderer. If I tell them there is a ninety-nine percent chance he is guilty, they might convict an innocent man because they trust my math more than their own judgment.

  CORVES
  (Softly)
  So we agree on the danger. The Prosecutor's Fallacy is a seductive lie. But the Defense Fallacy is waiting in the wings too. If I stand up and say "There's another guy out there," the jury might think the DNA is worthless. It's not worthless. It narrowed the pool from ten million to two.

  STERLING
  (Nods slowly)
  It narrowed the pool. That is accurate. The evidence is probative. It moves the needle.

  CORVES
  Then let's agree on the language. You present the Likelihood Ratio. You explain it as a multiplier. But you must allow me to explain the prior. I won't use the city population as a hard fact. I will frame it as a question.

  STERLING
  A question?

  CORVES
  I'll ask the jury: "Before you heard this DNA evidence, how likely did you think it was that the defendant was the source?" If they say "One in ten million," because he's just a random guy in the city, then the DNA moves them to fifty percent. If they say "One in two," because he was found standing over the body, then the DNA moves them to near certainty.

  STERLING
  (Considers this)
  You are asking them to quantify their own prior.

  CORVES
  I'm asking them to acknowledge they have one. You won't tell them the probability of guilt. Fine. But I will tell them that the DNA probability *depends* on the other evidence. If the DNA is the *only* evidence, the match is not a conviction. It's a coin toss.

  STERLING
  (A long beat. He adjusts his cufflinks.)
  I can accept that. Provided I am allowed to clarify that the Likelihood Ratio remains constant regardless of their prior. The strength of the DNA does not change because the defendant looks suspicious.

  CORVES
  Agreed. The LR is the strength of the weapon. The prior is who is holding it.

  STERLING
  And we both explicitly state that there could be other matches in the metropolitan area. I will not let the prosecutor imply this profile is unique in the universe.

  CORVES
  And I will not imply that a fifty percent probability means reasonable doubt is automatically satisfied.

  STERLING
  (Extends a hand)
  Then we have a protocol.

  CORVES
  (Shakes his hand)
  We have a truce. But Alan?

  STERLING
  Yes?

  CORVES
  If the prosecutor tries to say "one in ten million chance of innocence" anyway?

  STERLING
  (A thin, cold smile)
  Then I will object so loudly the judge will hear it in chambers.

  CORVES
  Good. Because I'd hate to have to calculate the probability of you having a stroke.

  STERLING
  I believe that prior is negligible.

  **SCENE END**
