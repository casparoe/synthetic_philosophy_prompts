  In the isolated post of Oakhaven, merchants exchange carved driftwood tickets for fish and grain, but the true ledger is the "Debt-Chant," a communal song memorized by all adults detailing every outstanding labor obligation. When a season's dampness rots the wood tickets to dust, merchants continue exchanging goods based strictly on the lyrics, ignoring the missing physical counters. Conversely, when a fever kills the elders who hold the Chant's verses, the warehouse remains full of pristine wood tickets, yet holders cannot compel labor; potential traders ignore the hoards, treating the carved wood as meaningless debris because no one knows which ticket signifies which debt.

  Berkeley's token theory correctly interprets these behaviors: value resides in the conventional agreement (the song), not the substance. When the wood rots but the Chant persists, the convention holds, sustaining economic activity; when the Chant dies, the convention dissolves, rendering the wood inert. The hard commodity view fails both tests: it falsely predicts value should vanish with the rotting wood and persist in the warehouse pile, mistaking the counter for the value itself. The isolating feature is the functional separation of the physical token from the ledger of obligation. A commodity defender would object by claiming the wood was never true money due to its perishability, arguing the Chant itself functioned as the real durable commodity, thereby trying to relocate intrinsic value to the memory rather than the convention, or insisting that without durable material, no money existed at all.
