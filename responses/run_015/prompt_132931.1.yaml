  *(Refining the "Functionalism" point)*: Lewis avoids functionalism because a convention can persist even if a better one exists, as long as switching costs are high. Evolutionary accounts often assume convergence to efficiency (though not always). I need to highlight this "sub-optimality" aspect.

  *(Refining the "No Design" point)*: Lewis proves "no design" via game theory. Evolution proves "no design" via blind variation. The *mechanism* of "no design" is different. If you swap the mechanism, do you keep the conclusion? Yes, but you lose the specific *rational* nature of the norm.

