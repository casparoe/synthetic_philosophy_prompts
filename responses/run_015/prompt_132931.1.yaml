      *   **Task 2:** Identify where the analogy breaks (specifically focusing on explicit reasoning/recursive expectations vs. blind replication, and shared salience vs. heritability).
      *   **Task 3:** Analyze whether the evolutionary framing imports functionalism that Lewis avoids.
