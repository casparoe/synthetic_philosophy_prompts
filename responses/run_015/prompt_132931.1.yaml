      *   *Evolutionary Game Theory (EGT):* Often associated with Maynard Smith, Skyrms, Young. Focus on dynamics (replicator dynamics), stability (ESS), less emphasis on hyper-rationality/common knowledge, more on learning/imitation.
      *   *The Tension:* Lewis is high-rationality/common knowledge. Evolution is often low-rationality/selection. The user is asking about the *rationalist-adjacent* usage of evolution to justify "no design," which often conflates Lewisian convention with evolutionary stability.
      *   *Structure of Response:*
          1.  Introduction (acknowledge the sophistication of the prompt).
          2.  Correspondence Table.
          3.  The Break Points (Reasoning vs. Replication, Salience vs. Heritability).
          4.  Functionalism Critique.
          5.  The "No Design" Verdict.

  3.  **Drafting the Correspondence Table:**
      *   *Gene:* Needs to be the unit of transmission. In Lewis, it's the *rule* or the *expectation profile*.
      *   *Phenotype:* The observable behavior (adhering to the convention).
      *   *Selection Environment:* The coordination problem itself (payoff structure).
      *   *Replication:* Social learning, imitation, or rational adoption.
      *   *Mutation:* Innovation, deviation, error.
      *   *Refinement:* Make sure these map specifically to *Lewis*, not just general EGT. Lewis emphasizes *reasons*, so replication isn't blind.

  4.  **Analyzing the Break Points (The Core Critique):**
      *   *Point 1: Reasoning vs. Replication.* Lewis requires agents to *know* why they are coordinating. They model each other's minds. Evolution (in the biological sense) is blind. Even in cultural evolution, if it's purely selection-based, it bypasses the "common knowledge" requirement. Lewis needs $K^n$ (iterated knowledge). Evolution needs frequency dependence.
      *   *Point 2: Salience vs. Heritability.* Lewis relies heavily on *salience* (Schelling points). Salience is psychological/contextual, not necessarily inherited. A bright focal point works once; it doesn't need a lineage. Evolution requires lineage.
      *   *Point 3: Arbitrariness.* Lewisian conventions are arbitrary (driving on the left vs. right). Evolutionary accounts often drift toward "efficient" outcomes (functionalism). Lewis explicitly says conventions don't have to be *best*, just *better than disorder*.

  5.  **Addressing Functionalism:**
      *   Does evolutionary framing import functionalism? Yes. It suggests norms exist *because* they solve a problem efficiently. Lewis says they exist because we *expect* them to. The "function" is secondary to the "expectation."
      *   Evolutionary stories often imply the norm is there *for* a purpose (teleology). Lewis is mechanistic/game-theoretic.

  6.  **Evaluating "No Design Needed":**
      *   Does the conclusion stand without the analogy?
      *   Lewis *already* argues "no design needed." That's the whole point of *Convention*. Spontaneous order arises from rational interaction, not a social contract.
      *   So, the evolutionary analogy is actually *redundant* or even *distracting* for a Lewisian. It might strengthen the "robustness" claim (norms survive shocks), but it weakens the "rationality" claim.
      *   However, rationalist writers use evolution to bypass the heavy cognitive load of Lewisian common knowledge. They want the "no design" conclusion without the "hyper-rational agent" premise. This is a bait-and-switch.

