      *   *Correction:* I need to be careful not to conflate Lewis with Evolutionary Game Theory (EGT). Brian Skyrms (*The Evolution of the Social Contract*) explicitly tries to bridge this. The user is asking about the *analogy* used in rationalist writing, which often muddles Lewis and Skyrms.
      *   *Nuance:* Lewis's account *does* allow for emergence without design. The evolutionary analogy is often used to explain *how* we got the common knowledge in the first place (history). But strictly speaking, Lewis's synchronic analysis doesn't need diachronic evolution.
      *   *Key Insight:* The evolutionary analogy is often used to naturalize norms, making them seem like laws of nature. Lewis keeps them contingent on human rationality.

  8.  **Final Polish:**
      *   Ensure tone is analytical and rigorous (matching the user's "audit" request).
      *   Check that all parts of the prompt are answered.
      *   Make sure the distinction between *synchronic* (Lewis) and *diachronic* (Evolution) is clear.

