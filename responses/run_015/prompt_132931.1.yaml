answer: |-
  This is a sharp dissection of a very common conflation in rationalist and social-scientific discourse. You are identifying the friction between **Lewisian Convention** (high-rationality, synchronic, common knowledge) and **Evolutionary Game Theory/Cultural Evolution** (low-rationality, diachronic, selection pressures).

  Rationalist writers often use the evolutionary analogy to "naturalize" Lewis's insights, making norms seem robust and mind-independent. But as you suspect, this smuggles in assumptions Lewis explicitly rejected.

  Here is the audit of the analogy, the breakdown points, and the verdict on the "no design" claim.

  ### 1. The Correspondence Table
  Mapping the biological evolutionary framework onto David Lewis's *Convention* (1969) framework.

  | Evolutionary Concept | Lewisian Convention Equivalent | Notes on Mapping |
  | :--- | :--- | :--- |
  | **Gene** | **The Rule / Expectation Profile** | The specific conditional strategy (e.g., "Drive on the right if others do"). |
  | **Phenotype** | **Observable Behavior** | The actual act of coordination (e.g., driving on the right). |
  | **Selection Environment** | **The Coordination Problem (Payoff Matrix)** | The underlying reality where coordination yields higher utility than non-coordination. |
  | **Replication Mechanism** | **Inductive Reasoning / Imitation** | Agents observe past success and project it forward; or simply copy the majority. |
  | **Mutation** | **Innovation / Deviation / Error** | An agent tries a different equilibrium or makes a mistake. |
  | **Fitness** | **Coordination Success (Payoff)** | The utility gained when expectations match actions. |
  | **Population** | **The Community of Agents** | The group sharing the common knowledge. |

  ### 2. Where the Analogy Breaks
  The analogy holds superficially (both describe self-perpetuating systems), but it fractures under mechanical scrutiny. The breakage occurs in three specific places: **Cognitive Architecture**, **Salience**, and **Arbitrariness**.

  #### A. Reasoning vs. Replication (The Cognitive Gap)
  *   **Evolutionary Frame:** Mechanisms are blind. A norm persists because those who held it survived/thrived (or were copied). It does not require the agent to understand *why* the norm works, only that it *does*.
  *   **Lewisian Frame:** Mechanisms are mental. A convention persists *only* because agents possess **recursive common knowledge**. I follow the norm because I expect you to follow it, because I know you expect me to follow it, ad infinitum.
  *   **The Break:** Lewis requires hyper-rationality (or at least rational expectation). Evolution bypasses rationality. If you use the evolutionary analogy to explain Lewisian norms, you are silently downgrading the agents from *reasoners* to *replicators*. You lose the **normativity** of the convention. In Lewis, I have a *reason* to follow the norm (my expectation of you). In evolution, I have a *cause* (selection pressure).

  #### B. Salience vs. Heritability
  *   **Evolutionary Frame:** Traits must be heritable. A norm exists because it was transmitted from $t_1$ to $t_2$. History matters.
  *   **Lewisian Frame:** Conventions rely on **Salience** (Schelling points). A convention can emerge *de novo* in a single shot if a solution is psychologically prominent (e.g., "meet at noon at the clock tower").
  *   **The Break:** Salience is not heritable; it is contextual and psychological. The evolutionary analogy implies norms need a lineage to exist. Lewis shows norms can pop into existence instantly via shared psychology. The evolutionary frame cannot account for the *origin* of a convention as easily as Lewis can, because evolution requires variation before selection, whereas Lewis allows for immediate focal coordination.

  #### C. Arbitrariness vs. Efficiency
  *   **Evolutionary Frame:** Tends toward **Functionalism**. Traits persist because they confer a fitness advantage. There is a subtle teleological pull: the norm is there *because* it solves the problem well.
  *   **Lewisian Frame:** Conventions are **Arbitrary**. Driving on the left is just as good as driving on the right. A convention can persist even if it is *sub-optimal*, provided it is *better than chaos* and switching costs are high.
  *   **The Break:** The evolutionary analogy encourages the belief that existing norms are "fit" (efficient). Lewis explicitly warns against this. A bad convention can lock in just as hard as a good one. The evolutionary framing quietly suggests that if a norm exists, it must be serving a function. Lewis says it only serves the function of *matching expectations*.

  ### 3. Does the Evolutionary Frame Import Functionalism?
  **Yes.** This is the most critical philosophical leak.

  Lewis's account is **structural**, not functional. A convention is defined by the structure of expectations, not the utility of the outcome (beyond the baseline coordination benefit).
  *   **Lewis:** "We do X because we expect each other to do X."
  *   **Evolutionary Analogy:** "We do X because doing X helped people like us survive."

  The evolutionary framing imports a **teleological backstory**. It suggests the norm is *selected for* its contribution to group stability or individual fitness. This leads to the "Just-So Story" problem common in rationalist writing: assuming a norm exists *because* it is useful, rather than *because* it is focal.

  Lewis avoids this by grounding the norm in **mutual expectation**, not **historical utility**. By reaching for the evolutionary analogy, writers often conflate *stability* (Lewis) with *adaptiveness* (Evolution). They assume that because a norm is stable, it must be adaptive. Lewis allows for "sticky" maladaptive norms (e.g., inefficient signaling conventions) provided the common knowledge holds.

  ### 4. Does the "No Design" Conclusion Stand Without the Analogy?
  **Yes, but the mechanism changes.**

  The conclusion that "norms do not require top-down design" is the central thesis of Lewis's *Convention*. He proves this using **game theory**, not biology.
  *   **Lewis's Proof:** Rational agents, seeking to coordinate, will spontaneously converge on an equilibrium without a sovereign or contract. The "invisible hand" here is rational expectation, not natural selection.
  *   **The Analogy's Role:** In rationalist writing, the evolutionary analogy is not doing the heavy lifting for the "no design" claim; it is doing heavy lifting for the **robustness** claim. Writers use evolution to suggest that norms are *resilient* to disruption, not just that they are *undesigned*.

  **However, if you remove the analogy, you lose the "Low-Rationality" Escape Hatch.**
  *   **Lewis's "No Design"** requires high cognitive capacity (common knowledge). It is fragile; if common knowledge breaks, the convention collapses.
  *   **Evolutionary "No Design"** requires low cognitive capacity (imitation/selection). It is robust; the convention persists even if agents don't understand it.

  Rationalist writers often want the **Lewisian conclusion** (norms are rational equilibria) with the **Evolutionary premises** (norms are robust/low-rationality). This is the bait-and-switch.
  *   If you stick strictly to Lewis: "No design" stands, but norms are fragile and require rational agents.
  *   If you stick strictly to Evolution: "No design" stands, but norms are not necessarily "conventions" in the Lewisian sense (they may be coerced or blind habits).

  ### Verdict
  The evolutionary analogy is **argumentatively redundant but mechanistically corrosive.**

  1.  **Redundant:** Lewis already proved "no design needed" without evolution. Invoking genes/selection adds nothing to the logical proof of spontaneous order.
  2.  **Corrosive:** It undermines the specific *kind* of order Lewis described. It replaces **reasons** with **causes**, and **arbitrariness** with **function**.

  If you want to claim norms are **rational coordination equilibria**, you must stick to Lewis's common knowledge framework. If you want to claim norms are **robust cultural artifacts**, you can use evolution. But you cannot use evolution to explain *why* agents rationally adhere to a norm *now*. The evolutionary story explains the history; the Lewisian story explains the logic. Conflating them creates a theory where norms appear to be rational choices that are actually just historical baggage.

  **Summary:** The "no design" conclusion stands on Lewis's game theory alone. The evolutionary analogy is often used to make that conclusion feel more "scientific" or "robust," but in doing so, it silently replaces the *rational agent* with the *blind replicator*, breaking the very mechanism (common knowledge) that makes a Lewisian convention a convention in the first place.
