answer: |-
  **Project Title:** Protecting the Satiable: Institutional Architecture in Keynes's Vision of the Good Life

  **Project Overview**
  John Maynard Keynes's 1930 essay, *Economic Possibilities for our Grandchildren*, is frequently dismissed as a failed prophecy. The standard critique holds that Keynes underestimated the insatiability of human desire: he predicted that once absolute needs were met, humanity would work less and leisure more. Instead, relative needs—status competition and hedonic adaptation—colonized the gains of productivity, keeping labor hours high. This project challenges that psychological reductionism. I argue that Keynes was acutely aware of the distinction between absolute needs (which can be satiated) and relative needs (which cannot), and that his later policy work, specifically the founding of the Arts Council of Great Britain in the 1940s, represents an attempt to solve this problem through institutional design rather than relying on moral transformation alone.

  This fellowship will support a six-month investigation into whether Keynes's vision of the "good life" requires a specific institutional architecture—public funding and separation from market logic—to prevent satiable goods from being corrupted by insatiable status competition.

  **Intervention: Beyond the Leisure Interpretation**
  Current scholarship largely treats Keynes's 1930 prediction as a error in behavioral economics. Critics argue he failed to anticipate that culture and leisure would become new arenas for status signaling. Consequently, the policy implication drawn from Keynes is often nihilistic: since desire is infinite, growth must be endless, or austerity must be enforced.

  This interpretation misses the institutional angle. It treats Keynes's vision as a passive hope that people would naturally learn to chill once rich. I contend that Keynes viewed culture not merely as leisure, but as an absolute need essential to human flourishing—one that requires protection from the market mechanisms that drive relative competition. By linking the 1930 essay to his practical work establishing the Arts Council, this project reframes Keynes not as a naive forecaster, but as an institutionalist who recognized that the "good life" must be structurally insulated from the logic of scarcity and status. The tension lies in whether culture itself can be purified of status drives, or if Keynes believed public funding could sufficiently alter its consumption patterns.

  **Core Research Question**
  Does Keynes's conception of the good life depend on the existence of non-market institutions to shield absolute needs from the colonizing effects of relative status competition?

  Sub-questions include:
  1. How does the taxonomy of needs in the 1930 essay evolve into the rationale for public arts funding in the 1940s?
  2. Did Keynes view state subsidy as a mechanism to de-commodify culture, thereby making it a satiable good?
  3. Is there a contradiction between treating culture as an absolute need while acknowledging its inherent status value?

  **Methodology**
  The project employs a dual-method approach combining textual close reading with historical policy analysis.

  First, I will conduct a close reading of *Economic Possibilities for our Grandchildren*, focusing specifically on the distinction between absolute and relative needs. This will be cross-referenced with Keynes's earlier ethical writings, particularly *My Early Beliefs* and selections from *A Treatise on Probability*, to establish his baseline understanding of human motivation and the good life. This establishes the theoretical framework.

  Second, I will analyze the founding memoranda, correspondence, and initial reports of the Arts Council of Great Britain. The goal is to trace the rhetorical and practical links between the economic theory of needs and the policy mechanism of arm's-length public funding. I will look for evidence that Keynes viewed the Arts Council not just as a subsidy for artists, but as a structural barrier against market-driven status consumption. I will prioritize existing digital archives and published collections of Keynes's papers to ensure feasibility within the timeframe.

  **Risk and Failure Conditions**
  Intellectual honesty requires defining what would constitute failure for this hypothesis.
  1. **Instrumentalism:** If archival evidence shows Keynes viewed the Arts Council purely as instrumental propaganda or economic stimulus during the war, with no link to his ethical vision of the good life, the argument collapses.
  2. **Ignorance of Status:** If Keynes's writings on the Arts Council show no awareness that culture functions as status capital, then he was indeed naive about the colonizing effect of relative needs, and the standard critique stands.
  3. **Disconnect:** If there is no textual or historical link between the 1930 taxonomy of needs and the 1940s policy work, then the project risks overreading a coincidence as a coherent philosophy.

  In any of these cases, the conclusion would shift to argue that Keynes's economic theory and his cultural policy were disjointed, weakening the claim that he offered a coherent institutional solution to the problem of insatiability.

  **Feasibility and Scope Check**
  Six months is a tight constraint for intellectual history, requiring strict scope management.
  *   **Month 1-2:** Close reading and annotation of key Keynes texts (1930 essay, ethical fragments). No new archival digging; reliance on established collections.
  *   **Month 3-4:** Analysis of Arts Council founding documents. Focus specifically on Keynes's personal contributions and chairmanship records rather than a full institutional history.
  *   **Month 5:** Synthesis and drafting. Connecting the ethical framework to the policy mechanics.
  *   **Month 6:** Revision and preparation of final deliverables.

  This scope is achievable because it limits the archival horizon to the specific intersection of economic theory and cultural policy. It does not attempt a full biography or a comprehensive history of the Arts Council. The risk is that the link between the 1930 essay and the 1940s policy is thinner than hoped. However, even a negative result—proving the disconnect—is a significant contribution to Keynesian scholarship, correcting the assumption that his later policy work was merely pragmatic rather than philosophical.

  **Significance**
  Recovering the institutional dimension of Keynes's vision has immediate relevance. Contemporary debates about Universal Basic Income, the four-day work week, and public funding for the arts often stall on the question of what people will *do* with freed time. If Keynes's insight was that leisure must be institutionally scaffolded to prevent it from becoming another arena of labor and status competition, this changes the policy prescription. It suggests that solving scarcity is not enough; we must also design the institutions that govern post-scarcity life. This project aims to retrieve that lost institutional imagination.
