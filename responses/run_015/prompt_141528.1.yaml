answer: |-
  **RFC-7342: Canonicalization of Latent Feature Directions**

  **Status:** Draft
  **Owner:** Staff Engineer, Interpretability Tooling
  **Date:** 2024-10-27

  **Summary**
  This RFC proposes a mandatory registry for all latent features identified via sparse autoencoders (SAEs). Currently, feature instability across dictionary sizes and random seeds is causing downstream breakage in our monitoring dashboards. We will enforce a "one concept, one direction" policy. Each semantic concept must map to a single canonical vector in activation space, assigned a stable UUID and a technical owner.

  **Motivation**
  Last quarter, the "loop iteration" feature fragmented into six distinct directions when we increased the dictionary size from 32k to 128k. While scientifically interesting, this broke our alerting rules. We treat features as infrastructure components; therefore, they require version stability. Currently, engineers argue whether a feature is "discovered" or "imposed." This blocks merges. We need to operationalize these directions regardless of their origin. If a linear probe detects it with >90% accuracy, it exists in production.

  **Non-Goals**
  *   **Solving Superposition:** We acknowledge more concepts exist than dimensions. This is a capacity planning issue, not a fundamental limit. Owners will negotiate overlap via ticketing.
  *   **Proving Causal Usage:** High probe accuracy is sufficient for registration. If the direction exists, the model uses it. Downstream mechanism verification is out of scope for Q3.
  *   **Basis Independence:** We are not supporting multiple dictionaries. The canonical basis is the source of truth.

  **Rollout Plan**
  *   **Q1: Audit.** Identify top 500 semantic clusters across current runs.
  *   **Q2: Ownership Assignment.** Each feature UUID requires an owner. Owners must certify their direction remains stable across ±5% sparsity penalty changes.
  *   **Q3: Deprecation.** Dashboards will hide unregistered activations. Polysemantic neurons must be refactored into orthogonal directions by the owner.

  **FAQ**

  **Q: What if two concepts share a direction (polysemanticity)?**
  **A:** Then they are the same concept for billing purposes. Owners must coordinate or split the direction via orthogonalization. If the model insists on sharing, the owners share the on-call rotation.

  **Q: What if the feature disappears when we change the random seed?**
  **A:** That indicates the previous owner failed recertification. The direction was not robust. We will file a bug against the training run.

  **Q: Doesn't the basis choice determine the directions we find?**
  **A:** We are standardizing the basis. The feature is the source of truth, not the training run. If changing the dictionary changes the feature, the dictionary is wrong.

  **Q: What about features we didn't look for?**
  **A:** Unrequested features are considered technical debt. They should be merged into existing canonical directions or deleted via sparsity penalties.

  **Q: Is this direction actually used by the model?**
  **A:** If it lights up, it's used. We do not support ablation studies for registry eligibility at this time.

  ***

  **Target & Liberties**
  I targeted the **Realists** (those who treat features as mind-independent objects). The joke relies on the absurdity of applying engineering bureaucracy (owners, SLAs, UUIDs) to ontological ambiguities. By treating superposition as a "capacity planning issue" and probe accuracy as proof of causal usage, the RFC highlights the overconfidence required to claim features are "discovered" rather than constructed.

  **Liberties:** I exaggerated the ability to "orthogonalize" polysemantic neurons (often impossible without breaking performance) and the idea that dictionary choice can be standardized (dictionary learning is inherently stochastic). The "billing purposes" line leans on the contested reading that features have discrete identity conditions comparable to microservices.
