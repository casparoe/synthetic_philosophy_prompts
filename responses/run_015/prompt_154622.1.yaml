answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Task:** Essay Response

  **Prompt:**
  Consider a climate-science consortium that collectively asserts a specific feedback loop accelerates warming. In this scenario, no individual member fully grasps every sub-model supporting the claim; instead, epistemic authority is distributed across the group rather than held by any single speaker. 

  Write an essay evaluating the viability of standard assertion norms in this context. Specifically, you must address the following:
  1.  Decide whether the knowledge norm can be satisfied collectively, despite individual ignorance.
  2.  Analyze whether the belief norm avoids collapse only by allowing partial credence rather than full belief.
  3.  Assess whether a modified truth norm offers a superior account compared to the knowledge and belief norms.

  Your response should rely on conceptual reasoning rather than appeals to authority. Define the norms clearly and argue for which framework best accommodates distributed epistemic authority.

  ***

  **Model Answer**

  The consortium scenario presents a limit case for traditional norms of assertion, which typically presuppose a single epistemic agent holding justification, belief, and truth conditions simultaneously. Here, epistemic authority is fundamentally distributed; no individual possesses the total evidence required to justify the claim independently. This fragmentation forces a reevaluation of whether norms apply to the collective entity as a unified agent or strictly to its constituent members. The viability of any norm depends on whether it can scale from individual psychology to institutional structure.

  Regarding the knowledge norm, the central question is whether a group can know what no member knows. If knowledge requires individual grasp of justification, the consortium fails, and the assertion is improper. However, if we attribute epistemic agency to the collective structure itself, the knowledge norm can be satisfied. The group possesses the aggregated data and validated models, even if distributed across specialists. To deny this is to insist on summativism, which renders complex scientific assertion impossible because modern science exceeds individual cognitive capacity. Thus, the knowledge norm holds only if we accept non-summativist collective knowledge, where the group's epistemic state is not reducible to the intersection of individual states. The group knows via the integration of sub-models, even if no single mind holds the whole map.

  The belief norm faces a sharper challenge. Standard assertion requires belief. Yet, no member fully believes the proposition based on their own limited understanding; they trust the process. If the norm demands full individual belief, the assertion is improper. To avoid this collapse, the norm must be modified to allow for partial credence or collective acceptance. If members hold high credence based on institutional trust rather than direct evidence, the belief norm survives only by shifting from psychological conviction to rational credence aggregation. Without this shift, the norm prohibits necessary scientific communication. However, relying on partial credence risks weakening the norm so much that it permits assertion based on mere hope rather than evidence. Therefore, the belief norm avoids collapse only by becoming a norm of rational credence, not binary belief.

  Finally, consider a modified truth norm. A simple truth norm (assert only what is true) is insufficient, as it permits lucky guesses. A modified version might require asserting only what is reasonably expected to be true based on available collective evidence. This avoids the psychological requirements of belief and the strong justification of knowledge. However, this risks collapsing into a warrant norm indistinguishable from knowledge. If the modification requires sufficient evidence to expect truth, it reintroduces the knowledge condition. Therefore, while a modified truth norm appears superior by lowering the bar, it lacks the explanatory power to distinguish responsible assertion from reckless optimism unless it smuggles in knowledge conditions. It offers clarity but lacks normative bite.

  In conclusion, the knowledge norm offers the most robust account if collective epistemic agency is granted. The belief norm requires uncomfortable stretching regarding credence. The truth norm is either too weak or collapses into knowledge. The consortium case suggests that assertion norms must be scalable to collective agents to remain viable in modern scientific contexts.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Pass Mark:** 10

  | Analytical Move | Marks | Typical Candidate Miss |
  | :--- | :---: | :--- |
  | **1. Diagnosis of Distributed Authority**<br>Clearly identifies the core tension: the mismatch between individual ignorance and collective assertion. | 4 | Treating the group as merely a sum of individuals, failing to see the structural epistemic gap. |
  | **2. Evaluation of Collective Knowledge**<br>Argues whether the knowledge norm holds via non-summativist collective agency or fails due to individual lack of grasp. | 4 | Assuming knowledge is impossible without individual grasp, ignoring collective epistemic structures. |
  | **3. Analysis of Belief and Credence**<br>Explicitly addresses whether the belief norm requires shifting from binary belief to partial credence to survive. | 4 | Treating belief as strictly binary, missing the prompt's specific requirement regarding partial credence. |
  | **4. Assessment of Modified Truth Norm**<br>Evaluates whether a truth-based norm is superior or if it collapses into a warrant/knowledge condition. | 4 | Confusing truth with warranted assertibility, or failing to note the collapse into knowledge conditions. |
  | **5. Comparative Conclusion**<br>Provides a definitive judgment on which norm best handles the scenario, synthesizing the previous arguments. | 4 | Remaining neutral or failing to rank the norms based on the preceding analysis. |
