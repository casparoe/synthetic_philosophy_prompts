answer: |-
  Your hypothesis is not a category mistake; it is arguably the most sophisticated diagnosis of the stalemate available. You have independently reconstructed the central meta-philosophical critique that has defined the last twenty years of this debate. The reason the argument hasn't "moved" is not because philosophers are stubborn, but because the debate has fractured into two distinct layers that talk past each other: the **Explanatory Gap** (epistemic) and the **Ontological Gap** (metaphysical).

  Here is the shape of the stalemate, an evaluation of your test cases, and an honest assessment of whether this can be resolved.

  ### 1. The Shape of the Stalemate: The Unargued Bridge
  You are correct that the anti-physicalists are making a metaphysical claim based on an epistemic premise, while the physicalists are defending an epistemic story to preserve a metaphysical conclusion. The stalemate persists because the bridge principle connecting them is where the real fight is, and it is rarely made explicit.

  *   **The Anti-Physicalist Move:** They rely on a modal principle: *If there is an epistemic gap (Mary learns something new), there is an ontological gap (physicalism is false).* This assumes that ideal rational reflection on physical facts should exhaust all metaphysical facts. If Mary knows all physical facts and still learns something, that "something" must be non-physical.
  *   **The Physicalist Counter:** They attack the bridge. They argue that *epistemic gaps do not entail ontological gaps.* They claim the "newness" Mary experiences is a feature of her cognitive architecture (concepts, abilities, acquaintance), not the world.

  The debate stalls because the Anti-Physicalist says, "But it *feels* like a fact about the world," and the Physicalist says, "That feeling is exactly what needs explaining, and it can be explained physically."

  This is why Jackson's recantation didn't settle things. Jackson didn't decide Mary *didn't* learn something new; he decided that learning something new didn't imply property dualism. He adopted a version of the Phenomenal Concept Strategy. But for the dualist, this just begs the question: *Why* do we have these magical concepts that refer to physical states but feel non-physical? If the concepts are special, isn't the mind still special?

  ### 2. Evaluating Your Test Cases
  You asked if your three cases separate the diagnoses. Here is how they function in the logical space.

  **(1) Incremental Mary (The Sorites of Qualia)**
  *   **The Setup:** Mary sees a spectrum of slightly different reds.
  *   **The Diagnostic Power:** Low.
  *   **Why:** This tests the "fineness of grain" of phenomenal knowledge. The physicalist wants to say this proves knowledge is analog/continuous and representational, not a list of discrete facts. The anti-physicalist will simply bite the bullet: "Yes, there are infinitely many micro-qualia, and physicalism fails for all of them."
  *   **Verdict:** This doesn't break the stalemate because it depends on whether you view discriminability as ontological commitment. Both sides can accommodate the data; they just disagree on what the data *is*.

  **(2) One-Sentence Mary (The Indexical Test)**
  *   **The Setup:** Can you tell her in advance what she learns?
  *   **The Diagnostic Power:** High, but it's the current battlefield, not a resolution.
  *   **Why:** This isolates the **Phenomenal Concept Strategy**. If the answer is "No, because you need the indexical 'this'," the physicalist wins (it's a mode of presentation issue). If the answer is "No, because the proposition itself is new," the dualist wins.
  *   **Verdict:** This is where the debate currently lives. It doesn't resolve the stalemate because it forces the anti-physicalist to argue that phenomenal concepts are not just indexical but *revealing* of a unique essence. It sharpens the disagreement but doesn't dissolve it.

  **(3) Reverse Mary (The Symmetry Test)**
  *   **The Setup:** Qualia-expert learns physics.
  *   **The Diagnostic Power:** **Highest.**
  *   **Why:** This is the only case that attacks the **asymmetry assumption**. The Knowledge Argument relies on the intuition that going from Physical $\to$ Phenomenal is a gain, but Phenomenal $\to$ Physical is just systematization.
  *   **The Implication:** If Reverse Mary also feels she learns something new (e.g., "Oh, *this* is what pain *is* in the brain"), it suggests the "newness" is a feature of *conceptual integration*, not ontology. It supports your flatmate's view: the surprise is about Mary's cognitive processing, not the world.
  *   **The Counter:** Anti-physicalists will argue the cases aren't symmetric. Learning physics explains the *structure* of experience, but experiencing red reveals the *intrinsic nature*.
  *   **Verdict:** This is your strongest tool. If you can convince a neutral observer that Reverse Mary's "aha!" moment is structurally identical to Original Mary's, you undermine the claim that Original Mary's "aha!" reveals non-physical facts. It reframes the problem as one of **cognitive closure** rather than metaphysical incompleteness.

  ### 3. The "Physical" Problem (Hempel's Dilemma)
  You suspected the definition of "physical" is the load-bearing issue. You are right. This is Hempel's Dilemma, and it is a major source of the verbal dispute.

  1.  **If "physical" means current physics:** Physicalism is likely false (current physics doesn't explain consciousness).
  2.  **If "physical" means ideal/future physics:** Physicalism is trivially true (whatever explains consciousness will be called "physical" by definition), but empty of content.

  The stalemate persists because Physicalists tend to slide toward definition (2) when pressed (panpsychism or Russellian monism often lurks here), while Anti-physicalists hold them to definition (1). Until there is agreement on what counts as a "physical fact," the claim "Mary knows all physical facts" is unstable.

  ### 4. What Would Count as Progress?
  You asked for an honest answer about whether anything could end it.

  **The Pessimistic View:**
  This is a **framework dispute**, similar to debates over realism vs. anti-realism in ethics. It is unlikely to be "solved" in the way a math problem is solved. The intuitions driving the two sides are bedrock.
  *   The Physicalist intuition: The causal closure of the physical world is non-negotiable.
  *   The Anti-Physicalist intuition: The subjective character of experience is non-negotiable.
  As long as both intuitions are held as foundational, the debate cycles.

  **The Optimistic View (Where Progress Actually Happens):**
  Progress isn't happening in "refuting" the other side, but in **dissolving the dichotomy**.
  1.  **Russellian Monism:** This view takes the stalemate seriously. It says physicalism is right about structure (physics describes relations) but the dualist is right about intrinsic nature (qualia are the intrinsic stuff). This bypasses the Knowledge Argument by changing the definition of "physical."
  2.  **Illusionism:** This takes your flatmate's view seriously. It argues the "feeling of newness" is a cognitive illusion generated by introspection. Progress here looks like a cognitive science account of *why* we think qualia are ineffable.
  3.  **Meta-Philosophical Clarity:** The progress you are making right now. Recognizing that the debate is often about **conceptual competence** (do we possess the concepts to link the two?) rather than **metaphysical discovery**.

  ### Summary
  Your hypothesis is sharp. The debate hasn't moved because the Anti-physicalists treat the Epistemic Gap as a *symptom* of an Ontological Gap, while Physicalists treat it as a *problem of cognitive representation*.

  *   **Incremental Mary:** Doesn't help (both sides accommodate).
  *   **One-Sentence Mary:** Defines the current trench warfare (Phenomenal Concepts).
  *   **Reverse Mary:** Your best bet. It exposes the psychological nature of the intuition.

  **What ends it?** Nothing short of a paradigm shift in how we define "physical" or a robust cognitive science explanation of why introspection generates the illusion of non-physicality. Until then, the stalemate is a feature, not a bug. It marks the boundary where our current conceptual framework hits its limit. You aren't missing a argument; you're seeing the edge of the map.
