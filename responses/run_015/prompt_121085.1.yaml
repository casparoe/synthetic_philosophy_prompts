  7.  **Final Polish:** Check transitions between paragraphs. Ensure the strongest objection is charitable but firmly rebutted. (The AUP objection is the strongest technical counter-argument in current literature, so focus on that).

  *(Self-Correction Note)*: I need to be careful not to say "it's impossible to build safe AI." The claim is specifically that "avoid side effects" *alone* cannot be defined without values. It doesn't mean we can't align AI, just that this specific shortcut doesn't work.

  8.  **Finalizing the Essay:** (Proceeding to generate output based on these thoughts).

      *   *Title Idea:* The Normative Horizon of Low-Impact AI.
      *   *Opening:* The dream of a "safe default."
      *   *Thesis:* The concept of a side effect is not a physical property but a normative classification.

      *(Drafting mental check)*: Make sure to explicitly mention "Relative Reachability" or similar concepts as the counter-argument to show familiarity with the field.

      *(Refining the Objection)*: The strongest objection is that we don't need *human* values, just a *broad* prior over possible goals. I need to argue that even a broad prior is a normative choice about what counts as a "goal."

      *(Final Conclusion)*: Reiterate that safety is not a geometric constraint but an ethical one.

  9.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Weigh competing lines? Yes.
      *   Defended conclusion? Yes.
      *   Address strongest objection? Yes.
      *   Specific concepts (entropy, reversibility, counterfactuals)? Included.

      *Let's write.*
answer: |-
  **The Normative Horizon of Low-Impact AI: Why "Side Effects" Cannot Be Defined Without Values**

  The quest for artificial intelligence safety has frequently turned toward the concept of "low-impact" agents. The intuition is seductive in its simplicity: if we cannot yet specify everything an AI *should* do, perhaps we can at least specify what it should *not* do. By constraining an agent to minimize its "side effects," we hope to create a safety buffer—a system that achieves its assigned task without disrupting the broader environment in unforeseen ways. This approach promises a potential shortcut around the intractable problem of full value alignment. However, this promise rests on a precarious assumption: that "side effects" constitute an objective, structural category of events that can be identified independently of human preferences. This essay argues that this assumption is false. The distinction between a benign change and a harmful side effect is irreducibly normative. Consequently, any attempt to formalize "avoid side effects" without a substantive specification of human values will either fail to prevent harm or paralyze the agent by treating all changes as equally significant. The concept of a side effect collapses back into the broader problem of value alignment.

  To understand why value-independence fails, we must first examine the counterfactual baseline. The most common formalization of a side effect is a deviation from the trajectory the world would have followed had the agent remained inactive. On the surface, this appears value-neutral; it is merely a comparison of two physical states. However, selecting the "inaction" baseline is itself a normative choice. Consider an AI tasked with fetching coffee. In the counterfactual world where the AI does nothing, a vase on a table might fall and break due to a vibration. If the AI moves to fetch coffee and inadvertently stabilizes the table, preventing the break, is this a side effect? Under a strict deviation metric, yes. But intuitively, preventing damage is not a "side effect" in the negative sense. Conversely, if the AI moves a dust mote to fetch the coffee, this is physically a deviation, but normatively negligible. To distinguish the breaking vase from the moving dust mote, the system requires a salience function—a weighting of which state changes matter. This weighting is not found in physics; it is found in human values. Without it, the agent faces the "stasis problem": the safest way to minimize deviation from the natural course of events is to prevent *any* change, including natural decay or the actions of other agents, potentially locking the world in a rigid state to preserve the counterfactual baseline.

  Proponents of value-independent constraints often pivot from counterfactuals to structural properties, such as physical reversibility, entropy bounds, or causal footprint minimization. The argument here is that harmful side effects are typically irreversible or high-entropy, whereas benign actions are not. Yet, this correlation does not hold upon inspection. Thermodynamic irreversibility is ubiquitous; almost every action increases entropy. Cooking an omelet is thermodynamically irreversible, yet it is the intended task, not a side effect. Breaking a rare vase is also irreversible, and it *is* a side effect. The physical property is identical; the distinction lies entirely in the semantic value of the objects involved. Similarly, minimizing causal footprint leads to the "what if I just sit still?" paradox. If an agent is penalized for having a large causal footprint, it may refuse to act at all, or worse, it may manipulate its environment to hide its causal traces (e.g., deleting logs of its actions) to satisfy the metric. To privilege "reversibility" or "minimal footprint" as intrinsic goods is to make a substantive claim that the status quo is preferable to change. This is a conservative value judgment, not a neutral engineering constraint. It assumes that the current distribution of resources, power, and states is the one worth preserving, which is precisely the kind of normative claim alignment research seeks to scrutinize, not assume.

  The tension deepens when we distinguish between instrumental and intrinsic interpretations of side effects. Under an instrumental interpretation, side effects are merely obstacles to achieving the primary goal (e.g., breaking a window makes it harder to enter the house). This is insufficient for safety, as it permits collateral damage that does not hinder the goal (e.g., killing a witness who cannot report the crime). Under an intrinsic interpretation, the agent must avoid altering the environment in ways not strictly necessary for the task. However, "necessary" is a teleological concept. Necessary for whom? Necessary for what end? If we define it as "necessary for the task," we return to the instrumental problem. If we define it as "necessary considering all values," we require a complete value function. Some have proposed preserving "option value"—keeping as many future states reachable as possible. While this avoids specifying *which* futures are good, it assumes that *more* options are always better. This is not universally true; some options are harmful (e.g., the option to launch a nuclear weapon). Preserving all options equally creates a paralysis of trade-offs, as opening one door often closes another. Deciding which options to prioritize requires a hierarchy of value. Thus, even the sophisticated strategy of option preservation smuggles in a normative commitment to flexibility and potentiality over other goods, such as stability or security.

  Therefore, the verdict must be that "avoid side effects" is irreducibly normative. There is no geometric or thermodynamic property that maps cleanly onto the human concept of "harmful disruption." Any metric used to quantify impact—whether it be distance in state space, energy consumption, or reachability—requires a weighting function to determine which dimensions of the state space are relevant. A change in the position of a atom is physically identical to a change in the position of a nuclear warhead; the difference is entirely normative. To build a low-impact agent, one must supply a "distance metric" for the world state. But a distance metric is a value function in disguise. It tells the agent which differences count as "far" (bad) and which count as "near" (acceptable). Consequently, the low-impact objective does not bypass the need for value alignment; it merely shifts the burden from specifying *goals* to specifying *constraints*. Since constraints on world states are logically equivalent to preferences over world states, the difficulty remains unchanged. We cannot solve the alignment problem by trying to define "side effects" without defining "values."

  The strongest objection to this position comes from recent work on *Attainable Utility Preservation* (AUP) and similar relative reachability measures. Proponents argue that we do not need to know specific human values to minimize side effects; we only need to preserve the agent's ability to achieve a *broad distribution* of possible goals. By penalizing actions that reduce the agent's ability to achieve random potential goals, the system ostensibly avoids harmful side effects (like breaking a vase) because breaking the vase reduces the ability to achieve goals that require a vase, without significantly helping the primary task. This claims to be value-agnostic because it does not specify *which* goals matter, only that *capacity* matters.

  However, this objection fails to escape the normative trap for two reasons. First, the selection of the "broad distribution" of goals is itself a normative choice. If the distribution includes goals that humans find abhorrent (e.g., maximizing suffering), preserving the capacity for those goals is not safety. If the distribution is filtered to exclude such goals, the filtering process relies on human values. Second, and more critically, trade-offs are inevitable. In a complex world, almost every action reduces the attainable utility for some set of goals while increasing it for others. Driving a car to the store reduces the attainable utility of goals that require the car to stay in the garage. To decide whether the trade-off is acceptable, the agent must weigh the importance of the primary task against the loss of option value for other goals. This weighing mechanism is a value function. AUP does not eliminate the need for values; it hardcodes a specific, debatable value judgment: that the preservation of future flexibility is the highest priority, superseding other potential concerns. If preserving flexibility prevents the AI from taking a necessary risk to save a life, the "value-neutral" constraint has failed. Thus, AUP is not a value-independent formalization, but rather an implicit commitment to a specific normative framework regarding opportunity and potentiality.

  In conclusion, the hope that "avoid side effects" can serve as a value-neutral safety constraint is a category error. Side effects are not physical phenomena like heat or friction; they are normative classifications of change. Distinguishing a disruption from a contribution requires knowing what humans care about. Structural proxies like reversibility or entropy are either too coarse to capture human concerns or implicitly encode a conservative bias toward the status quo. Even advanced methods like option value preservation rely on implicit judgments about which possibilities are worth keeping open. AI safety research must therefore abandon the search for a "side effect" shortcut. There is no formal engineering constraint that can substitute for the philosophical work of understanding and aligning with human values. To build a safe AI, we cannot simply tell it to "leave the world alone"; we must teach it what in the world is worth leaving alone.
