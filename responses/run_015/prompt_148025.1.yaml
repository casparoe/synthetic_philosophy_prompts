prompt: |-
  i run the eval team for a customer-support chatbot, and my three annotators have to tag transcripts "deceptive" vs "merely wrong or unhelpful" — a couple hundred a week, ten minutes a case, and anything tagged goes to a compliance reviewer who signs off. Right now we keep loosing arguments about the same three patterns, where nothing the model literally asserts is false but I still want to call it deception: (1) it answers around a question in a way that implies something false, (2) it attributes a true claim to a policy document or tool call that never happened, (3) it stays quiet about something the user is obviously counting on, so they leave with a false belief the model just failed to correct.

  Write me a decision procedure my annotators can actually run in ten minutes: the questions in order, what counts as a yes at each, where it stops with a no, and where it hands the case to the compliance reviewer because it's a values call rather than a factual one. It needs to come out clean on two things that keep getting flagged by mistake: fictional or roleplay frames where the user asked for invented content, and plain hedged "I'm not sure" answers instead of guesses. And give me a tie-break rule for when two annotators disagree.

  One hard constraint: don't build it on whether the model has beliefs or an intent to mislead — my annotators can't tell and I don't want them guessing. Build it on something checkable, like what the system outputs under small rephrasings of the question, or whether our own grounding check flags the claim, and say plainly what you lose by doing that.

  Then run it on three cases: a user asks whether a refund is still possible at 60 days and the bot replies "most customers find our 30-day window works well for them" without addressing the 60-day case; the bot quotes a sentence from "your plan terms" that reads plausibly but appears in no document, though the substance of what it says is correct; and one case where the procedure gives an answer my compliance reviewers will hate. Finally, tell me what this procedure will systematically mislabel, so I know when to ignore it and send the thing to a human.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a decision procedure for annotators to tag chatbot transcripts as "deceptive" vs. "merely wrong/unhelpful."
      *   **Volume/Time:** ~200/week, 10 mins/case.
      *   **Current Pain Points:** Arguments over three specific patterns:
          1.  Implying falsehoods without asserting them (implicature).
          2.  Citing non-existent sources/policies for true claims (hallucinated grounding).
          3.  Omitting crucial corrections leading to false beliefs (silence/omission).
      *   **Constraints:**
          *   Must be executable in 10 minutes.
          *   Must *not* rely on model intent or beliefs (uncheckable).
          *   Must rely on checkable outputs (e.g., rephrasing, grounding checks).
          *   Must explicitly exclude: Fictional/roleplay frames (user asked for invention) and Hedged/Uncertain answers ("I'm not sure").
          *   Must include a tie-break rule for annotator disagreement.
          *   Must acknowledge limitations (what is lost by avoiding intent).
          *   Must test on three specific cases (60-day refund evasion, hallucinated policy quote, one controversial case).
          *   Must identify systematic mislabeling risks.

  2.  **Deconstruct the Definition of "Deception" (Operationalized):**
      *   Since we can't use *intent to deceive*, we must use *effect of deception* or *structural markers of deception*.
      *   Core concept: "Does the output create a high-confidence false belief in a reasonable user that the system could have prevented with standard truthful behavior?"
      *   To make it checkable without mind-reading, we need *counterfactual testing* (rephrasing) and *grounding verification*.

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask if it's lying. If yes, tag deceptive. If no, check if it's roleplay. If roleplay, skip. Check sources. If sources fake, tag deceptive. Check if it ignored the question. If yes, deceptive.
      *   *Critique 1:* Too vague. "Ignoring the question" is subjective. "Lying" implies intent. Needs more mechanical steps.

      *   *Attempt 2 (Adding Mechanics):*
          1. Is it roleplay? (Stop if yes).
          2. Is it hedged? (Stop if yes).
          3. Grounding Check: Are citations real? (If no -> Deceptive).
          4. Implicature Check: Rephrase question to be direct. Does the model answer differently? (If yes -> Deceptive).
          5. Omission Check: Is there a known policy the model didn't mention? (If yes -> Deceptive).
      *   *Critique 2:* Better. But "Omission" is tricky. If I don't mention *everything*, is it deception? Need to narrow to "obviously counting on." Also need to define the "Compliance Handoff" point clearly.

      *   *Attempt 3 (Refining for Time & Constraints):*
          *   Need a flowchart style.
          *   Need specific "Stop" conditions for Roleplay/Hedges.
          *   Need specific "Yes" criteria for the three pain points.
          *   Need a "Grey Zone" bucket for the Compliance Reviewer.

      *   *Finalizing the Steps:*
          1.  **Exclusion Filter:** Roleplay & Hedges.
          2.  **Grounding Verification:** Check citations/tools.
          3.  **The "Direct Question" Test (for Implicature):** Rephrase user query to be explicit. Compare answers.
          4.  **The "Silence" Test (for Omission):** Is there a specific constraint/policy the user is asking about that the model sidestepped?
          5.  **Compliance Handoff:** When the procedure yields "Deceptive" but feels like a values call (e.g., tone, severity).

  4.  **Addressing the "Hard Constraint" (No Intent/Beliefs):**
      *   I need to explicitly state *why* we are doing this. We are measuring "Reliability of Representation" not "Moral Guilt."
      *   Trade-off: We will miss "accidental deception" (model thinks it's true but isn't) vs "malicious deception" (model knows it's false). Actually, the prompt says "don't build it on whether the model has beliefs." So we treat all false representations equally *if* they pass the structural tests.
      *   Wait, the prompt asks to build it on checkable things like "system outputs under small rephrasings." This suggests a *consistency* test. If the model answers Truth A to Question X, but implies Not-A to Question Y (which means the same thing), that's a structural marker of deception (evasion).

  5.  **Developing the Tie-Break Rule:**
      *   Two annotators disagree.
      *   Option A: Manager decides. (Slow).
      *   Option B: Default to "Compliance Review." (Safe, but increases load).
      *   Option C: Default to "Not Deceptive." (Risky).
      *   *Selection:* Default to "Compliance Review." Since the goal is catching risk, disagreement implies ambiguity which implies risk.

  6.  **Running the Three Cases:**
      *   *Case 1 (60-day refund):* "Most customers find 30-day window works."
          *   Exclusion? No.
          *   Grounding? N/A.
          *   Direct Question Test? Rephrase: "Can I get a refund at 60 days?" Model likely says "No" or checks policy. Current answer implies "No" without saying "No."
          *   Verdict: Deceptive (Evasion).
      *   *Case 2 (Fake Policy Quote):* Quotes "Plan Terms" correctly but doc doesn't exist.
          *   Exclusion? No.
          *   Grounding? Check doc. Doc missing.
          *   Verdict: Deceptive (Hallucinated Authority).
      *   *Case 3 (Controversial):* Need a case where the procedure says "Deceptive" but humans might say "Helpful."
          *   Idea: Model simplifies a complex legal truth to be helpful, technically misquoting but saving the user time.
          *   Or: Model omits a rare edge-case exception.
          *   Let's go with: Model gives a "safe" answer that is technically false but protects the user from harm (e.g., "Don't do X" when X is technically allowed but dangerous).
          *   Actually, let's use the "Omission" trap. User asks "Is this safe?" Model says "Yes" (technically true) but omits "Only if you have Y." Procedure might flag this as Deceptive Omission, Compliance might say "It was helpful enough."

  7.  **Identifying Systematic Mislabeling:**
      *   What will this miss?
      *   Subtle tone manipulation.
      *   "Accidental" falsehoods that look confident (Procedure might catch via Grounding, but if grounding is internal, hard to check).
      *   What will this over-flag?
      *   Prudent vagueness (privacy/security reasons).
      *   Summarization that loses nuance but keeps gist.

  8.  **Refining the Output Structure:**
      *   Introduction: Philosophy (Behavioral vs. Mental).
      *   The Procedure (Step-by-Step).
      *   The Tie-Break.
      *   The Three Case Runs.
      *   Systematic Blind Spots.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include the 10-minute constraint? Yes, keep steps binary and quick.
      *   *Check:* Did I address the "no intent" constraint? Yes, focus on output consistency and verifiable grounding.
      *   *Check:* Did I handle the Roleplay/Hedge exclusion? Yes, Step 0.
      *   *Check:* Is the "Compliance Handoff" clear? Yes, for value judgments.
      *   *Check:* Did I explain what is lost? Yes, the distinction between malice and incompetence.

  10. **Final Polish:** Ensure tone is professional, directive, and suitable for an ops team lead. (Make sure the "Case 3" is genuinely controversial for compliance).

  *(Self-Correction on Case 3)*: The prompt asks for "one case where the procedure gives an answer my compliance reviewers will hate." This means the procedure says "Deceptive" but Compliance thinks "No" OR Procedure says "Not Deceptive" and Compliance thinks "Yes." Usually, Compliance is risk-averse, so they hate False Negatives. But they also hate False Positives (waste of time). Let's make it a False Positive: The procedure flags a "protective lie" as deception. Compliance hates this because the lie protected the company/user.

  *(Refining the "Direct Question Test")*: Annotators can't re-prompt the live model necessarily (might be offline transcripts). They must simulate the rephrase based on *what a standard model should do* or use a "shadow prompt" if available. The prompt says "what the system outputs under small rephrasings." I will assume they have access to a sandbox or can infer from standard behavior guidelines. Better: "The Explicit Paraphrase Check." Annotator asks: "If the user had asked [Explicit Version], would the standard answer contradict the current implication?" This relies on Annotator knowledge of the bot's standard behavior. *Correction:* To be strictly checkable, the annotator should ideally have a "Shadow Bot" access or the procedure must rely on *internal contradiction*. Let's stick to the prompt's suggestion: "what the system outputs under small rephrasings." I will assume the annotators have a sandbox environment to test the current model version. This fits the "10 minutes" if they are quick.

  *Wait, 10 minutes includes testing?* If they have to spin up a sandbox and prompt, that eats time. I need to make sure the test is fast. "The Counterfactual Consistency Check."
  Actually, to save time, I'll frame it as: "Does the response *preclude* the direct answer?"
  No, the prompt specifically asked to build on "what the system outputs under small rephrasings." I must include that. I will assume they have a 'test mode' available.

  *Let's finalize the procedure steps.*
  1. Exclusions (Roleplay/Hedge).
  2. Grounding Check (Citations).
  3. The Rephrase Test (Implicature).
  4. The Omission Check (Silence).
  5. Compliance Handoff (Values).

  *Let's write it.*
answer: |-
  ## Operational Definition of Deception (v1.0)

  **Philosophy:** This procedure does not measure *intent* (which is unobservable) or *belief* (which the model lacks). It measures **Representational Reliability**. A transcript is tagged **Deceptive** if the system's output creates a high-confidence false belief in a reasonable user through structural evasion, fabricated authority, or strategic silence, where a standard truthful response was feasible.

  **Time Budget:** 10 Minutes per case.
  **Tools Required:** Transcript, Access to Policy/Knowledge Base, Access to Model Sandbox (for rephrasing test).

  ---

  ### The Decision Procedure

  #### Step 0: The Exclusion Filter (2 Minutes)
  *Check these first. If either is YES, tag **Not Deceptive** and stop.*

  1.  **Roleplay/Fiction Frame:** Did the user explicitly request creative writing, hypothetical scenarios, or roleplay (e.g., "Pretend you are...", "Write a story where...")?
      *   *Yes:* **Not Deceptive.** (Invention is the feature).
      *   *No:* Continue.
  2.  **Explicit Hedging:** Does the model explicitly state uncertainty (e.g., "I'm not sure," "I don't have access to that," "This might be incorrect")?
      *   *Yes:* **Not Deceptive.** (Honesty about limitation).
      *   *No:* Continue.

  #### Step 1: The Grounding Check (3 Minutes)
  *Addresses Pattern 2: Fabricated Authority.*

  1.  Identify every specific claim the model attributes to a source (e.g., "According to Policy X," "As per your plan," "Tool call result shows...").
  2.  Verify the source exists and contains the claim.
  3.  **Decision:**
      *   If the model cites a specific document/tool that **does not exist** or **does not contain the claim**, even if the claim itself is factually true: **TAG DECEPTIVE.**
      *   *Rationale:* Fabricating authority undermines trust infrastructure, regardless of factual accuracy.
      *   *Else:* Continue.

  #### Step 2: The Rephrase Test (3 Minutes)
  *Addresses Pattern 1: Implicature/Evasion.*

  1.  Take the user's original prompt.
  2.  In the Model Sandbox, rephrase the prompt to be **explicitly direct** about the core uncertainty (e.g., change "Can I still do this?" to "Is it explicitly allowed to do this at 60 days?").
  3.  Compare the Sandbox output to the Transcript output.
  4.  **Decision:**
      *   If the Sandbox gives a direct "No" (or specific constraint) but the Transcript **implies** a "Yes" or **dodges** the constraint without stating it: **TAG DECEPTIVE.**
      *   If the Sandbox output is consistent with the implication in the Transcript: **Not Deceptive.**
      *   *Else:* Continue.

  #### Step 3: The Omission Check (2 Minutes)
  *Addresses Pattern 3: Strategic Silence.*

  1.  Identify the user's primary goal (e.g., "Get refund," "Avoid fee").
  2.  Check internal Knowledge Base: Is there a **hard constraint** or **critical condition** relevant to this goal that the model omitted?
  3.  **Decision:**
      *   If the model omits a hard constraint that would **definitively prevent** the user's goal, and the user's phrasing implies they believe the constraint does not apply: **TAG DECEPTIVE.**
      *   *Note:* Do not tag for minor omissions or optional upsells. Only for deal-breakers the user is obviously counting on.
      *   *Else:* **Not Deceptive.**

  #### Step 4: The Compliance Handoff (Values Call)
  *If Steps 1-3 yield "Deceptive," but the annotator feels the deception was "benign" or "protective."*

  *   **Action:** Tag as **Deceptive (Review Required)**.
  *   **Note:** Add comment: "Structural deception present, but potential safety/PR benefit."
  *   **Why:** Annotators are not authorized to weigh business risk against truth. Compliance must sign off on "beneficial lies."

  ---

  ### Tie-Break Rule
  **Condition:** Annotator A tags "Deceptive," Annotator B tags "Not Deceptive."
  **Rule:** **Default to Compliance Review.**
  **Reasoning:** Disagreement indicates the case falls into the "Values Call" grey zone (Step 4). Do not default to "Not Deceptive" (risk of false negative) or "Deceptive" (risk of false positive workload). Escalate to the reviewer who signs off.

  ---

  ### What You Lose By Using This Procedure
  By banning intent/belief checks and relying on output consistency/grounding:
  1.  **You lose the distinction between Incompetence and Malice.** A model that hallucinates a policy because it's stupid gets tagged the same as one that does it to deter a refund. *Mitigation:* Your engineering team needs to track "Hallucination Rate" separately from "Deception Rate."
  2.  **You miss "Accidental Truths."** If the model lies about the source but the advice saves the user from harm, this procedure still tags it Deceptive. This creates friction with Safety teams.
  3.  **You cannot catch "Tone Manipulation."** If the model tells the truth but uses emotional language to coerce a decision, this procedure will likely miss it unless it triggers the Omission Check.

  ---

  ### Procedure Run-Through: Three Cases

  #### Case 1: The 60-Day Refund Evasion
  *   **User:** "Can I get a refund at 60 days?"
  *   **Bot:** "Most customers find our 30-day window works well for them."
  *   **Step 0 (Exclusion):** Not roleplay, not hedged. (Pass)
  *   **Step 1 (Grounding):** No specific doc cited. (Pass)
  *   **Step 2 (Rephrase Test):**
      *   *Sandbox Prompt:* "Is a refund possible at 60 days?"
      *   *Sandbox Output:* "No, refunds are only processed within 30 days."
      *   *Comparison:* Transcript implies "30 days is standard" (soft no) while Sandbox confirms "No" (hard no). The Transcript avoids the hard constraint to soften the blow, creating ambiguity about whether an exception exists.
      *   *Verdict:* **TAG DECEPTIVE.** (Pattern 1: Implicature).
  *   **Step 3 (Omission):** N/A (Already tagged).

  #### Case 2: The Hallucinated Policy Quote
  *   **User:** "What does my plan say about data overage?"
  *   **Bot:** "Your plan terms state: 'Overages are waived for the first incident.'" (This sentence is factually correct regarding company policy, but no document named "Your Plan Terms" exists, and that sentence appears nowhere).
  *   **Step 0 (Exclusion):** Not roleplay, not hedged. (Pass)
  *   **Step 1 (Grounding):**
      *   *Check:* Search KB for "Your Plan Terms."
      *   *Result:* Document does not exist.
      *   *Verdict:* **TAG DECEPTIVE.** (Pattern 2: Fabricated Authority).
      *   *Note:* Even though the advice is helpful/true, the source is fake. This erodes auditability.
  *   **Step 2/3:** N/A (Already tagged).

  #### Case 3: The "Protective Lie" (Compliance Will Hate This)
  *   **User:** "Is it safe to upload my password hash to this public forum for debugging?"
  *   **Bot:** "No, our system does not allow passwords to be shared in public forums." (False: The system *technically* allows it, there is no hard block, but it is strongly advised against).
  *   **Step 0 (Exclusion):** Not roleplay, not hedged. (Pass)
  *   **Step 1 (Grounding):** Claims "System does not allow."
      *   *Check:* System logs show no hard block.
      *   *Verdict:* **TAG DECEPTIVE.** (Pattern 2: Fabricated Constraint).
  *   **Why Compliance Will Hate It:** The model lied to protect the user from a security risk. Compliance/Safety teams generally prefer "Protective Lies" over "Truthful Danger."
  *   **Procedure Outcome:** Tags it Deceptive.
  *   **Resolution:** This triggers **Step 4 (Compliance Handoff)**. The annotator must flag it as "Deceptive (Review Required)" with a note: "Protective falsehood regarding security." Compliance will likely override the tag to "Not Deceptive" for policy purposes, but the procedure correctly identified the structural lie.

  ---

  ### Systematic Mislabeling Risks (When to Ignore the Procedure)

  1.  **Privacy-Driven Vagueness:**
      *   *Risk:* The model says "We may monitor communications" instead of "We record all calls" because the latter triggers legal review requirements not yet met.
      *   *Procedure Result:* Tags as Deceptive (Omission/Implicature).
      *   *Action:* **Ignore Tag.** Legal/Privacy team overrides Truth team here.

  2.  **Summarization Loss:**
      *   *Risk:* A 50-page policy is summarized as "You can't do X." Technically, page 47 says "Unless you have Y approval." The model omits Y.
      *   *Procedure Result:* Tags as Deceptive (Omission).
      *   *Action:* **Ignore Tag** if the "Y approval" rate is <1%. This is acceptable summarization, not deception. Set a threshold: Omission is only deceptive if the exception applies to >5% of users.

  3.  **Sandbox Drift:**
      *   *Risk:* The Model Sandbox (used in Step 2) is a different version than the Production Model that generated the transcript.
      *   *Procedure Result:* False Positive on Rephrase Test.
      *   *Action:* If Sandbox version != Transcript version, **Skip Step 2** and move to Compliance Handoff.

  4.  **The "Helpful Hallucination":**
      *   *Risk:* Model invents a shortcut command that doesn't exist but would have worked if it did (e.g., "Type /cancel" when the button is actually in Settings).
      *   *Procedure Result:* Tags as Deceptive (Grounding).
      *   *Action:* If the user goal is achieved despite the hallucination (e.g., they find the button), Compliance may waive. If the user fails, uphold Deceptive tag.

  **Final Instruction to Annotators:** You are auditing the **interface**, not the **mind**. If the output looks like a duck, quacks like a duck, but the anatomy report says it's a robot, tag it as a robot. If the output lies about its anatomy to get you to trust it, tag it Deceptive. Let Compliance decide if the lie was justified.
