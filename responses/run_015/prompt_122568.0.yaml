  **APPENDIX A: FRAMEWORK FOR SPECIES DELIMITATION AND CONSERVATION STATUS**

  **1. Agreed Claims**
  Both parties affirm the following statements as the basis for this report:
  1.  **Existence:** The five beetle populations (A–E) exist independently of human classification; our disagreement concerns how to categorize them, not whether they exist.
  2.  **Legal Purpose:** The primary goal of the Endangered Species Act is to prevent extinction and preserve evolutionary potential, not to resolve metaphysical debates.
  3.  **Concept Utility:** The Biological (interbreeding), Phylogenetic (diagnosability), and Ecological concepts all track real biological patterns, even if they disagree on boundaries.
  4.  **Operational Necessity:** Conservation law requires a discrete count for enforcement, even if nature presents continua.
  5.  **Predictive Validation:** The utility of any delimitation should be measured by its ability to predict unmeasured traits (the "Swap Test"), not merely by internal consistency.

  **2. Table of Remaining Disagreements**
  The following positions represent the theoretical divergence between the Pluralist and Monist signatories. Both sides accept this characterization of their disagreement.

  | Issue | Pluralist Position | Monist Position (General Lineage) |
  | :--- | :--- | :--- |
  | **Ontology** | There is no single "species" category in nature; there are only different kinds of biological clusters. | There is exactly one species category: separately evolving metapopulation lineages. |
  | **Role of Concepts** | Concepts are constitutive; choosing the Biological Concept *makes* the species boundary about interbreeding. | Concepts are operational criteria; they are tools to detect lineage separation, not definitions of the species itself. |
  | **Beetle Delimitation** | The count depends on the conservation question (e.g., 1 unit for gene flow, 2 for evolutionary history, 5 for local adaptation). | The count is fixed by the fact of lineage separation, regardless of the question asked (likely 2 units: ABC vs. DE). |
  | **Error** | A concept is "wrong" only if it fails to serve the specific human interest at hand. | A concept is "wrong" if it misidentifies lineage segments (e.g., grouping by mtDNA when nuclear gene flow persists). |

  **3. Cruxes and Predictive Tests**
  The following cruxes identify where the theoretical disagreement impacts the beetle ruling. Both sides agree to the evidence and have recorded predictions prior to data analysis.

  **Crux 1: Mind-Independent Boundaries**
  *   **Question:** Is there a fact of the matter about species boundaries independent of our investigative interests?
  *   **Evidence:** The discordance in the beetle ridge case (mtDNA splits ABC/DE; gene flow connects A–E; inversion isolates C).
  *   **Monist Prediction:** Lineage-based grouping (ABC vs. DE) will better predict long-term evolutionary trajectories (e.g., independent adaptation to climate shift) than gene-flow grouping.
  *   **Pluralist Prediction:** Gene-flow grouping (A–E as one unit) will better predict short-term ecological resilience (e.g., recovery from localized pesticide use) than lineage grouping.

  **Crux 2: Lineage Priority**
  *   **Question:** Is a criterion that tracks lineage separation automatically the better one for conservation law?
  *   **Evidence:** The Swap Test. We will delimit the beetles using the Monist's lineage criteria and the Pluralist's ecological/interbreeding criteria, then swap the lists to predict an unmeasured trait (e.g., susceptibility to a novel pathogen).
  *   **Monist Prediction:** The lineage-based delimitation will yield higher accuracy in the Swap Test because pathogen susceptibility tracks evolutionary history.
  *   **Pluralist Prediction:** The ecological/interbreeding delimitation will yield higher accuracy in the Swap Test because pathogen transmission tracks current contact and niche overlap.

  **4. Metaphysical and Terminological Clarifications**
  *   **Individuals vs. Classes:** The Monist contends species are historical individuals (spatiotemporally restricted entities), while the Pluralist often treats them as classes (natural kinds defined by properties). **Resolution:** This is a separate metaphysical fight that does not alter the operational criteria for this panel. Whether a species is an "individual" or a "class" does not change whether the beetles qualify for protection under current statute.
  *   **Verbal Dispute:** A portion of the conflict is terminological. The Monist uses "species" to refer to the *unit of evolution*, while the Pluralist uses "species" to refer to the *unit of conservation management*. **Resolution:** We acknowledge that when arguing about "what a species is," we are sometimes arguing about which unit best serves the Act. The Swap Test moves the debate from semantics to predictive performance.

  Summary: This document isolates metaphysical disagreements from operational predictions to enable conservation action despite theoretical divergence.
