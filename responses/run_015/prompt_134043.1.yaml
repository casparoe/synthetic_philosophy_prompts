      *   *Refining the CSV Resistance:* Why resist? Not because pain teaches lessons (instrumental), but because the *capacity* to be affected by harm is what makes a claim on others valid. If I cannot suffer, can I be wronged? Or, more subtly, practical reasoning about safety and priority relies on the *qualia* of aversion to weight options. Without it, reasoning becomes purely computational, losing the "moral weight."
