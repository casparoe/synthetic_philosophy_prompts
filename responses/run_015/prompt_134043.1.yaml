answer: |-
  In a near-future municipality, an opt-in gene therapy selectively decouples nociceptive signaling from limbic affect, allowing citizens to detect tissue damage without experiencing distress. Proponents of the hedonistic imperative, initially supporting the voluntary program, shift to demanding universal mandates after data reveals that witnessing untreated suffering in non-participants triggers severe empathic distress and cortisol spikes in the treated population, effectively transferring the burden of agony rather than abolishing it. Opponents of the mandate do not argue that pain teaches prudential lessons or prevents injury, but contend that the shared phenomenological vulnerability to suffering is the constitutive ground upon which claims of injustice are recognized and weighed in public deliberation, arguing that a citizenry incapable of feeling harm loses the conceptual framework necessary to prioritize safety over efficiency in collective decision-making.

  **Verdict and Reasoning**

  *   **Hedonistic Imperative:** Supports compulsory administration. Since suffering is intrinsically disvaluable, its abolition is a moral priority. The shift to compulsion is justified not by paternalism (protecting the individual from themselves) but by the negative externality imposed on the treated population: the involuntary psychological harm caused by witnessing the untreated suffering of others. If suffering is contagious via empathy, allowing it to persist violates the rights of those who have opted for abolition.
  *   **Constitutive Suffering View:** Resists compulsory administration. The objection is not that pain serves an instrumental function (e.g., warning of danger), which could be replaced by technology, but that the capacity to suffer is ontologically required for moral agency. Without the visceral experience of aversion, the concept of "harm" becomes abstract rather than felt, dissolving the phenomenological basis required to validate claims of injustice in public reasoning.

  **Structural Feature of Divergence**

  The divergence is forced by the conflicting valuation of suffering's relation to agency: the Hedonistic Imperative treats suffering as having a **causal role** in generating negative utility (and thus empathic externalities), whereas the rival view treats suffering as having a **constitutive relation** to practical reasoning. For the HI, suffering is a variable input that causes bad outcomes; for the rival view, suffering is a structural condition that makes the reasoning process itself intelligible as *moral* reasoning.

  **Hedonistic Imperative Attack on the Rival Position**

  A proponent of the Hedonistic Imperative could argue that the rival view's alleged externality—the degradation of collective practical reasoning—is illusory because it conflates the *motivation* to act with the *logic* of action. Since the therapy leaves discriminative touch and cognitive assessment intact, citizens retain all factual data regarding damage and risk; the removal of affective distress merely decouples information from aversion. Therefore, the rival view mistakenly attributes constitutive weight to a merely instrumental mechanism (affective signaling), proving that the feared loss of moral framework is baseless because rational prioritization of safety can proceed via cognitive valuation rather than somatic feeling.
