  Later, he tells his colleague, "I didn't lie. Saying 'I have no idea' isn't a false assertion about the cookies, it's just a misleading non-assertion about my mind."

  The colleague nods, then calls the philosopher's wife. "Does your husband know where the cookies went?"

  The colleague says to the wife, "I have no idea," while watching the philosopher panic in the background.

  The philosopher whispers, "You lied! You know I'm right here!"

  The colleague hangs up and says, "Relax. It wasn't a false assertion about your guilt, just a misleading non-assertion about my mind."

  The philosopher shouts, "But that's morally identical to lying!"

  The colleague smiles, "Exactly. So enjoy the couch."

  This joke takes the side that there is **no moral difference** between lying and misleading. The punchline commits to this position when the colleague accepts the philosopher's concession ("That's morally identical") as sufficient justification to treat the technically "misleading" act as punishable as a lie.
