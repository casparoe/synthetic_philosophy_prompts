  To address this properly, we first need to disentangle the concept of "unity" itself. In the philosophy of mind, "unity of consciousness" is not a single monolithic fact but a cluster of distinct relations that usually travel together in intact brains but come apart in pathology. If we don't distinguish these, the split-brain data will look contradictory when it is actually just differentiated.

  ### Conceptual Mapping: Candidate Accounts of Unity

  Before evaluating the practice, we must distinguish at least five distinct types of unity that are being conflated in your argument:

  1.  **Phenomenal Unity (Co-consciousness):** This is the "what it is like" unity. Are experience A and experience B had by a single phenomenal field *right now*? If I see red and feel pain, are they part of one subjective space, or two separate spaces that happen to be in one skull?
  2.  **Subject Unity (The "I"):** This is the metaphysical bearer of experience. Is there one entity (a soul, a self, a subject) that owns all the experiences, even if they aren't co-conscious?
  3.  **Agential Unity (Will/Execution):** This concerns the initiation of action. Is there one executive system deciding to move the body, or can distinct subsystems initiate competing movements independently?
  4.  **Narrative Unity (Self-Attribution):** This is the story the system tells about itself. Does the verbal reporting mechanism construct a single coherent biography, or does it fragment into competing histories?
  5.  **Biological/Legal Unity (Organism/Personhood):** This is the status of the human animal as a rights-bearing unit. Does the law recognize one body as one person, regardless of mental fragmentation?

  In a standard intact brain, these five align perfectly. The split-brain case is philosophically explosive precisely because it decouples them: Phenomenal and Narrative Unity appear fractured, while Agential (in the legal sense) and Biological Unity are maintained by fiat.

  ### Reconstructing the Implicit Theory of Current Practice

  You have identified a genuine asymmetry: we treat the *body* as one agent (action/liability) but the *mind* as partially fragmented (testimony/knowledge). You ask what theory this presupposes.

  Current medical and legal practice does **not** presuppose **Strict Phenomenal Unity**. If it did, the testing protocols you described would be considered incoherent or abusive, because they rely on the premise that one hemisphere can know something the other does not. The fact that we accept the "neurological parlour trick" as valid data means we already acknowledge a fracture in epistemic access.

  However, practice **does** presuppose **Strict Biological/Legal Unity**. The consent form is signed by the organism's representative (usually the speaking hemisphere), but it binds the *whole organism*. If the non-speaking hemisphere initiates an action that causes harm, the *organism* is liable, not just the hemisphere.

  The implicit theory here is a form of **Animalism** combined with **Pragmatic Functionalism**.
  *   **Animalism:** The "person" is identical to the human organism. Since there is only one organism, there is only one person. Mental fragmentation is treated as a disability within that person, not the creation of new persons.
  *   **Pragmatic Functionalism:** The "voice" of the person is identified with the module capable of social communication (usually the left hemisphere). The silent hemisphere is treated as a non-verbal subsystem of the single person, akin to a subconscious drive or a reflex arc, rather than a separate agent.

  This makes the action/testimony asymmetry coherent *within this framework*.
  *   **Action:** Since the organism is the unit of liability, any motor output from the organism is the organism's action. It doesn't matter which neural subnet initiated it.
  *   **Testimony:** Since social agency requires communication, only the communicative module can provide testimony. The non-communicative module's outputs (pointing, picking) are treated as *behavior* to be interpreted, not *testimony* to be recorded.

  Therefore, the practice is not inconsistent; it is prioritizing **Biological Unity** over **Phenomenal Unity**. It assumes that personhood tracks the body, not the momentary state of the phenomenal field.

  ### Evaluating Your Friend's Proposal

  Your friend proposes treating the hemispheres as two people requiring two consents. To implement this, we would have to shift our definition of "person" from **Human Organism** to **Center of Consciousness**.

  If we took this seriously, the implications would be radical, not just bureaucratic:
  1.  **Property and Rights:** Who owns the bank account? If the left hemisphere wants to spend and the right refuses (via left-hand interference), is it theft?
  2.  **Criminal Liability:** If the right hemisphere initiates a shove, do we imprison the whole organism (punishing the innocent left hemisphere) or do we suppress the right hemisphere specifically?
  3.  **Medical Welfare:** If the left hemisphere consents to a procedure that benefits it but harms the right (hypothetically), is this permissible?

  The reason hospitals do not do this is not merely institutional inertia. It is because our ethical and legal frameworks are built on the premise that **suffering and benefit happen to bodies**. Even if there are two centers of experience, they share one nervous system, one endocrine system, and one pain pathway. You cannot anesthetize one hemisphere without affecting the organism.

  Therefore, the rejection of your friend's proposal is based on a **philosophical commitment to Bodily Personhood**. It is a substantive claim that the unit of moral concern is the animal, not the mind. However, this commitment is itself a **convention**. We *could* construct a legal system that recognizes multiple consciousnesses within one body (some legal systems already struggle with dissociative identity disorders, though rarely to the extent of separate personhood).

  ### Strict Presuppositions vs. Underdetermination

  Does the practice *strictly presuppose* a single subject of experience? **No.**
  The practice is compatible with the "Two Subjects" view (that there are literally two centers of consciousness). It simply chooses not to recognize them as separate *legal* persons. The practice treats the silent hemisphere as a "mute ward" of the speaking person, not as a separate citizen.

  Is the metaphysical truth underdetermined? **Yes.**
  The behavioral data (one body, conflicting reports) is compatible with:
  1.  **One Subject with impaired access:** There is one "I", but the information highways are cut.
  2.  **Two Subjects sharing a body:** There are two "I"s, but only one has a voice box.
  3.  **No Subject (Bundle Theory):** There are just experiences happening, and the "unity" is a story told by the left hemisphere.

  The medical practice does not solve this. It merely imposes a working model to allow surgery and consent to proceed. It requires **Functional Unity** (one decision-maker for the body) but remains agnostic on **Phenomenal Unity**.

  ### The Coherence of the Asymmetry

  You asked if the action/testimony asymmetry is coherent.
  *   It is coherent if you accept that **Agency** (liability) is broader than **Epistemic Authority** (testimony).
  *   We accept this elsewhere. We hold infants or non-verbal adults responsible for damages (via guardians) even if they cannot testify to their intent. We treat the body as the locus of action.
  *   The asymmetry fails only if you believe that **Moral Agency strictly tracks Phenomenal Consciousness**. If you hold that view, then the current practice is unjust because it holds one consciousness liable for the actions of another (if the Two Subjects view is true).

  However, since we cannot verify the Phenomenal Unity from the outside, the law defaults to the observable Biological Unity. This is not a discovery of truth; it is a **regulative ideal**.

  ### Verdict on the Dispute

  Your friend is not "insane," but their proposal requires a revolution in personhood theory that current institutions are not designed to handle. You are correct that the current package is inconsistent *if* you assume personhood must track consciousness. But the current package assumes personhood tracks **organisms**.

  The practice does not prove there is one subject. It does not prove there are two. It stipulates one for the sake of social coordination. The asymmetry is not a bug; it is the feature of a system that prioritizes bodily welfare and social order over metaphysical precision. The handling is coherent as a **convention**, but it leaves the metaphysics **underdetermined**.

  However, since the question asks what the *practice* presupposes regarding the handling itself: The handling relies on a agreed-upon rule (one body = one person) rather than a proven metaphysical fact. It is a pragmatic solution to an ontological puzzle.

