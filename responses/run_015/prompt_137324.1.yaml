answer: |-
  This is a profound set of questions. You are asking for the ethical architecture of *organizing* in a behavioral age. Your friend's objection is not trivial; it touches on the central tension of modern political work: how to mobilize people without treating them as inputs in a machine.

  I am going to take your request seriously. I will not give you a pat definition. I will start by framing the problem, then analyze your distinctions, apply them to the Facebook cases, and finally return to your SMS scripts with a decision procedure that admits its own limits.

  ### Part 1: Framing the Problem

  The standard philosophical definition of manipulation ("bypassing rational agency") is indeed insufficient for your context. It assumes a clean binary: either I give you reasons and you decide, or I poke your nervous system and you react. But human agency is not that clean. We are influenced by tone, timing, social proof, and framing *all the time*, even when we are being fully rational.

  If we define manipulation as *any* influence that isn't a pure syllogism, then all organizing is manipulation. If we define it as *deception*, then your A/B testing might be fine (assuming no lies). But your friend senses a middle ground.

  **The Better Frame: Stewardship of Agency.**
  Instead of asking "Is this manipulation?", I propose we ask: **"Am I stewarding this person's agency, or am I renting it?"**

  *   **Stewardship:** I help you act on considerations you would endorse upon reflection. I align my influence with your capacity to author your own actions.
  *   **Renting:** I extract behavior from you using levers you do not control, understand, or necessarily endorse, even if the behavior is "good."

  This frame shifts the focus from the *outcome* (did they vote?) to the *relationship* between the influencer and the influenced. It allows us to say that you can get someone to do the "right thing" in the "wrong way."

  ### Part 2: Evaluating Your Three Distinctions

  Your three distinctions are excellent. They are not confused, but they do different weights of ethical work.

  1.  **Borrowed Voice:** This is a **normative violation**. It identifies when social capital is used without the owner's consent. It is distinct from the other two. You can have a transparent, reason-based message that still uses a borrowed voice (e.g., "Your mother told me to tell you...").
  2.  **Mechanism-Transparency vs. Uptake-Transparency:** This is an **epistemic condition**. It is necessary for stewardship. If I don't know *how* you are moving me, I cannot evaluate whether I want to be moved. This is the strongest theoretical lever you have.
  3.  **Reason-less Efficacy:** This is the **phenomenological core**. It describes the gap between the influencer's knowledge (aggregate causality) and the target's experience (individual rationality).

  **Verdict:** *Reason-less Efficacy* is the deepest moral problem, but *Mechanism-Transparency* is the most practical test. *Borrowed Voice* is a specific subtype of violation that applies heavily to the 2010 Facebook study but less to your SMS scripts (unless you are fabricating social proof).

  ### Part 3: Mapping the Facebook Cases

  Let's run the mapping explicitly, as requested.

  #### Case 1: 2010 Voting Study
  *   **Influencer:** A composite. The *Researchers* designed the experiment, but the *Platform* (Facebook) executed it as infrastructure. The *Friends* were unwitting instruments.
  *   **Target:** Primary: The user seeing the banner. Secondary: The friends whose faces were shown (their agency was used as a signal without consent).
  *   **Content:** "People like you are voting."
  *   **Considerations:** The target acts on *social conformity* and *obligation to peers*.
  *   **Reasons?** Yes, but artificially weighted. "My friends voted" is a valid reason to vote. However, the *presentation* of that reason was engineered to maximize salience in a way the user did not choose. The platform turned a background social fact into a foreground demand.

  #### Case 2: 2014 Emotional Contagion
  *   **Influencer:** Platform/Researchers.
  *   **Target:** The user whose feed was filtered.
  *   **Content:** A curated stream of emotional valence (positive or negative).
  *   **Considerations:** None consciously accessible. The target feels "better" or "worse."
  *   **Reasons?** No. This is pure *Reason-less Efficacy*. The target cannot cite a reason for their mood shift. The mechanism is sub-rational affect regulation.

  ### Part 4: Running Your Distinctions Over the Cases

  **1. Borrowed Voice**
  *   **2010 Study:** **Guilty.** This is the crux. The friends did not agree to be avatars for civic mobilization. Their "vote" was a private act (or at least, a personal one) that was weaponized as public pressure.
      *   *Comparison to Door-Knocking:* When you knock on a door, *you* are the voice. You own the social capital of the interaction. In the 2010 study, Facebook spent the social capital of the *friends*. That is the ethical breach.
      *   *Misrepresentation?* It doesn't matter that they really voted. The violation is the *unauthorized use of relational weight*.
  *   **2014 Study:** **Not Applicable.** No third-party relationships were leveraged.

  **2. Mechanism-Transparency**
  *   **2010 Study:** **Failed.** Users knew Facebook showed them things (Uptake-Transparency). They did not know Facebook was running a randomized control trial on their civic duty (Mechanism-Transparency).
  *   **2014 Study:** **Failed.** Even worse. Users thought the News Feed was an algorithmic reflection of reality/interest. It was actually a laboratory variable.

  **3. Reason-less Efficacy**
  *   **2010 Study:** **Mixed.** It offered a reason ("friends voted"), but the *efficacy* relied on the *visibility* of that reason being manipulated. It worked because of the *network effect*, which is hard to articulate as a reason ("I voted because 5 pixels of my friend's face appeared").
  *   **2014 Study:** **Convicted.** This is the purest case. The efficacy was entirely reason-less. It was causal conditioning.

  **Which distinction does the real work?**
  For the 2010 study, **Borrowed Voice** is the unique convictor. For the 2014 study, **Reason-less Efficacy** is the convictor. **Mechanism-Transparency** is the umbrella that covers both.

  ### Part 5: Theoretical Families

  How do different ethical frameworks judge these cases?

  1.  **Intention-Based Views (The Influencer's Mind):**
      *   *Verdict:* If the researchers intended to help democracy (2010), it's permissible. If they intended to publish a paper (both), it's exploitative.
      *   *Problem:* This is too subjective. A benevolent manipulator is still a manipulator. This theory fails to protect the target.

  2.  **Capacity-Based Views (Subverting Agency):**
      *   *Verdict:* 2014 is worse. It bypassed rational deliberation entirely to touch emotional regulation. 2010 engaged social reasoning, even if nudged.
      *   *Problem:* "Capacity" is vague. Does simplifying a message subvert capacity or aid it?

  3.  **Reason-Based Views (The "Right Reasons" Test):**
      *   *Verdict:* 2010 passes better than 2014. Voting for social reasons is a valid reason. Voting because an algorithm hid your sad friends is not a reason at all.
      *   *Problem:* What counts as a "valid reason"? Is "fear of missing out" a reason?

  4.  **Norm-Based Views (Contextual Integrity):**
      *   *Verdict:* Both fail. The norm of a social network is connection, not experimentation. The norm of research is consent.
      *   *Strength:* This is the most robust critique. It doesn't matter if voting is good; it matters that the *context* was violated.

  **Do they come apart?** Yes. An Intention theorist might forgive 2010 (good goal). A Reason theorist might tolerate 2010 (social proof is a reason). A Norm theorist condemns both.

  ### Part 6: The Benefit Wrinkle

  *Does the fact that voting is "good" save the 2010 study?*
  **No.** This is the trap of paternalism. If we allow infrastructure owners to manipulate behavior for "good" ends, we grant them the authority to define the good. If Facebook can nudge you to vote without consent, they can nudge you to buy something, or hate someone, using the same mechanism. The *precedent* is the harm, not the specific outcome.

  *Is 2014 worse because the benefit was thinner?*
  It is worse because the **locus of control** was more intimate.
  *   2010 targeted an *action* (voting). You can reflect on your actions.
  *   2014 targeted an *affect* (mood). You cannot easily reflect on or resist a mood shift caused by invisible filtering. It colonizes the internal space where reasons are formed. It is "pre-reason" manipulation.

  ### Part 7: What This Shows About the Theory

  You suspected that theories built for one-on-one influence break down here. **You are correct.**

  Traditional ethics assumes:
  1.  Distinct agents (Influencer vs. Target).
  2.  A shared medium (language, airwaves) that is neutral.

  In the Facebook cases (and your SMS work):
  1.  **The Medium is the Influencer.** Facebook isn't just a channel; it's the architect of the environment.
  2.  **Scale creates asymmetry.** The influencer knows the aggregate (the A/B test result); the target only knows the individual instance.

  **The Anomaly:** The literature struggles with *infrastructural influence*. When the "influencer" is the plumbing of communication itself, "consent" becomes impossible (you can't opt out of the plumbing if you want to participate in society).
  **The Adjustment:** We need to move from "Informed Consent" to **"Fiduciary Responsibility."** If you hold the infrastructure (or the list, or the script), you have a duty not to optimize for your metric at the expense of the user's agency, regardless of consent.

  ### Part 8: Back to Your SMS Scripts (The Decision Procedure)

  You asked for a tool you can use. You cannot avoid influence, but you can avoid *renting* agency. Here is a procedure to run on Variant B before you send it.

  **The "Stewardship Test" for Outreach Scripts**

  1.  **The Truth Check (Baseline):**
      *   *Question:* Does this text contain any factual falsehoods or implied falsehoods?
      *   *Stop:* If yes, discard. (This is coercion/deception, not influence).

  2.  **The Mechanism Audit (Transparency):**
      *   *Question:* If I showed this text to the recipient *after* the meeting and explained exactly why I chose these words (e.g., "We used this phrase because data shows it triggers urgency"), would they feel tricked or respected?
      *   *Test:* Imagine saying: "I sent you this because we found that mentioning 'deadline' makes people 10% more likely to come."
      *   *Pass:* "Ah, thanks for the reminder."
      *   *Fail:* "Oh, you were playing on my anxiety?"
      *   *Note:* If Variant B works for a reason you can't articulate (Reason-less Efficacy), **do not use it.** If you don't know *why* it works, you can't defend it.

  3.  **The Borrowed Voice Check:**
      *   *Question:* Am I invoking a relationship I don't inhabit?
      *   *Example:* "Your neighbor Sarah signed." (Did Sarah agree to be named? If not, this is Borrowed Voice).
      *   *Correction:* "Tenants on your block are signing." (Aggregate truth, no specific voice borrowed).

  4.  **The Endorsement Test (Agency):**
      *   *Question:* Does this message help the recipient act on a reason they already have, or does it install a new impulse?
      *   *Good:* "The meeting is at 7 PM." (Helps them act on their interest in housing).
      *   *Risky:* "Only 3 spots left!" (Fabricated scarcity to trigger FOMO).
      *   *Rule:* Optimize for *clarity of the existing reason*, not *creation of a new impulse*.

  **Where This Procedure Goes Silent (The Honest Limit)**

  I must tell you where this theory fails you.

  1.  **The "Black Box" Problem:** You are A/B testing. By definition, you are testing variants where you *might not know* why one works better. If Variant B works 5% better but you don't know why, the Procedure above says "Don't use it." But your union needs turnout.
      *   *The Hard Truth:* There is no clean philosophical line between "optimizing clarity" and "optimizing psychology." Framing *always* affects psychology.
      *   *My Advice:* If you must use a "black box" winner (one that works for unknown reasons), you incur a **debt of disclosure**. You cannot claim you are "empowering" tenants if you are treating them as behavioral data points. You must acknowledge internally that this is a trade-off: *Efficiency vs. Purity of Agency.*

  2.  **The "Just Cause" Temptation:** You said you don't want to use "the cause is just" as a test. Good. But be aware: **The stakes matter.**
      *   Manipulating someone to buy a toaster is worse than manipulating someone to stop an eviction.
      *   *Why?* Because the "Reason-less Efficacy" is weighed against the "Harm of Inaction."
      *   *The Limit:* This doesn't make the manipulation *good*, it makes it *less bad*. It does not absolve you of the duty to minimize the manipulation.

  3.  **Infrastructure vs. Interpersonal:** Your SMS script is infrastructure. You are sending it to hundreds of people. You cannot have a relationship with all of them.
      *   *The Limit:* The "Stewardship" frame assumes you care about *their* agency. If you are overwhelmed, you will treat them as numbers. The theory cannot fix burnout. If you are tired, you will manipulate. The ethical safeguard here is not just a test, but **organizational capacity**. Do you have the time to write Variant A and Variant B carefully? Or are you desperate? Desperation is the root of unethical influence.

  ### Final Summary for Your Committee

  When your friend says "A/B testing is manipulative," you can answer:

  *"It depends on what we are testing. If we are testing which lie works better, it's manipulation. If we are testing which clear statement of fact helps people overcome barriers to action, it's stewardship. The line is whether we can explain to the tenant, afterwards, why we sent the message the way we did, without them feeling their psychology was hacked."*

  Use the **Mechanism Audit**. If you can't explain the mechanism without using words like "trigger," "exploit," or "bias," don't send the text. If you can use words like "clarify," "remind," or "connect," you are likely in the clear.

  And admit to your friend: *"We are walking a line. We are using tools designed for advertising to build power for tenants. That creates friction. We need to check our scripts not just for turnout, but for respect."*

  That is the most honest philosophical position available.
