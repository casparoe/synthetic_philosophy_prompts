answer: |-
  # Session Plan: The Structure of Escalation
  **Course:** Third-Year Seminar (Rational Choice & Failures)  
  **Time:** 90 Minutes (60 Play / 30 Debrief)  
  **Students:** 22 (11 Desks, 2 students per desk)

  ## 1. Materials & Setup

  **The Economy**
  *   **Endowment:** Each desk receives **200 Tokens** in an envelope at the start.
  *   **Currency:** Tokens are raffle tickets. At the end of class, all tokens from all desks are pooled. One desk is drawn at random; that desk wins a **$50 Voucher** (or equivalent department-approved prize).
      *   *Why:* This creates linear expected value without direct cash loss resentment. Losing tokens lowers probability of winning; gaining tokens raises it.
  *   **Prize Value:** Fixed at **100 Tokens** for all rounds.
  *   **Minimum Increment:** **10 Tokens**.

  **The Room**
  *   **Seating:** 11 desks arranged in a semi-circle. Two chairs per desk.
  *   **Equipment:** 
      *   11 "Bidding Paddles" (can be printed cards on sticks).
      *   11 "Prediction Slips" (for the observing desks).
      *   11 "Commitment Cards" (for the final round).
      *   Whiteboard for tracking current bid, high bidder, and round timer.

  **The Roles**
  *   **Active Desks:** Only **two desks** bid in any given round.
  *   **Observer Desks:** The other 9 desks watch and record predictions.
  *   **Rotation:** Rotate which desks are active every round so everyone participates in the pressure eventually.

  ---

  ## 2. Rules & Payoff Scheme

  **Standard Dollar Auction Rules**
  1.  **Winner:** Highest bidder at the close of the round takes the Prize (100 Tokens).
  2.  **Payment:** **Both** the highest bidder and the second-highest bidder pay their last bid to the "Bank" (tokens removed from envelope).
  3.  **Closure:** A round ends when one bidder passes and the other does not raise within 10 seconds.

  **Variant A: The Relay (Round 2)**
  *   **Trigger:** When the *current high bid* reaches or exceeds **100 Tokens** (the value of the prize).
  *   **Action:** The partner who has *not* been speaking must take the paddle. The original bidder is silenced for the remainder of that round.
  *   **Liability:** The new bidder inherits the desk's current bid status. (e.g., If Partner A bid 90 and is currently the *loser*, Partner B must decide whether to bid 100 to become the *winner*, knowing if they lose, the desk pays 90).

  **Variant B: The Hard Cap (Round 3)**
  *   **Rule:** The auction will close automatically after exactly **4 total bids** have been made in this round (2 per side).
  *   **Condition:** If the 4th bid is made, the game ends immediately. No further bids allowed.

  **Variant C: The Ulysses Pact (Round 4)**
  *   **Pre-Commitment:** Before bidding starts, each desk writes a "Max Bid" on a sealed card (e.g., "50", "0", "100").
  *   **Enforcement:** The facilitator tracks the bid. If a desk's bid reaches their sealed number, the facilitator declares them "Out" automatically, regardless of their desire to continue.

  ---

  ## 3. Minute-by-Minute Timeline

  ### Phase 1: Setup (00:00 – 05:00)
  *   Distribute envelopes (200 Tokens).
  *   Explain the Raffle Rule clearly. (Emphasize: *Tokens = Probability of Winning*).
  *   Explain the Auction Rules (Winner gets prize, **both** pay last bid).
  *   **Crucial:** Do **not** mention "sunk cost," "escalation," or "rationality." Call it "Resource Allocation."
  *   Select **Desk 1** and **Desk 2** as active bidders. Others are Observers.

  ### Phase 2: Round 1 – Baseline (05:00 – 20:00)
  *   **Observers:** Fill out a Prediction Slip: *"At what token amount will the bidding stop?"*
  *   **Action:** Run the auction. Allow it to run until it clearly stalls or passes 200 tokens.
  *   **Settlement:** Collect/Dispense tokens. Record the "Stop Price" on the board.
  *   **Transition:** Rotate active desks. (Desks 3 & 4 up).

  ### Phase 3: Round 2 – The Relay (20:00 – 35:00)
  *   **Announce Rule:** "When the bid hits 100, the partner who hasn't spoken takes the paddle."
  *   **Observers:** Predict the Stop Price again.
  *   **Action:** Run auction. Enforce the swap strictly at 100.
  *   **Settlement:** Collect tokens.
  *   **Transition:** Rotate active desks. (Desks 5 & 6 up).

  ### Phase 4: Round 3 – The Hard Cap (35:00 – 50:00)
  *   **Announce Rule:** "This auction ends after exactly 4 bids total. No exceptions."
  *   **Observers:** Predict: *Will anyone bid at all?*
  *   **Action:** Run auction. Stop forcibly at bid #4.
  *   **Settlement:** Collect tokens.
  *   **Transition:** All desks prepare for final round.

  ### Phase 5: Round 4 – Pre-Commitment (50:00 – 60:00)
  *   **Setup:** Every desk writes a "Max Bid" on a Commitment Card. Seal it. Hand to facilitator.
  *   **Action:** Select two final desks (e.g., Desk 1 & 2 again, or new ones). Run the auction.
  *   **Enforcement:** If bidding hits a sealed limit, that desk is forced out.
  *   **Closure:** End session play. Collect all tokens for the raffle draw (to be done later or immediately if time permits).

  ### Phase 6: Debrief (60:00 – 90:00)
  *   **00-10 (The Data):** Reveal Observer Predictions vs. Actual Stop Prices. Highlight the gap.
  *   **10-20 (The Trap):** Analyze Round 1. Ask the losers: "At the moment you made your last bid, did you think you could win?" (Usually yes). Introduce **Forward-Looking Rationality**. The error wasn't the last bid; it was the first.
  *   **20-30 (The Relay):** Analyze Round 2. Did the new partner stop? If they escalated, ask: "You didn't make the mess. Why clean it up?" This isolates **Structural Trap** from **Self-Justification**.
  *   **30-40 (The Cap):** Analyze Round 3. Discuss Backward Induction. (See *Frank Note* below for how to handle the theory).
  *   **40-50 (The Pact):** Analyze Round 4. Who set their limit to 0? Who set it to 110? Discuss **Pre-commitment** as a rational solution to irrational future selves.
  *   **50-60 (The Missing Piece):** Lecture on what the game *didn't* capture (Common Knowledge of Rationality, Social Signaling).

  ---

  ## 4. Debrief Mapping (Connecting Play to Theory)

  | Moment in Play | Concept to Introduce | Discussion Question |
  | :--- | :--- | :--- |
  | **Round 1 Loss** | **Sunk Cost Fallacy** (Critiqued) | "When you bid 120 on a 100 token prize, were you looking backward at what you spent, or forward at what you could save?" (Show that local rationality $\neq$ global rationality). |
  | **Round 1 Entry** | **The Entry Error** | "The mistake wasn't bidding 110. The mistake was bidding 10. Why did you enter a game you couldn't win?" |
  | **Round 2 Relay** | **Structural vs. Psychological** | "Partner B had no ego invested in Partner A's bids. Why did they still escalate?" (Points to the game structure, not just psychology). |
  | **Round 3 Cap** | **Backward Induction** | "If the end is known, the end is calculable. Why didn't calculation stop the start?" |
  | **Round 4 Pact** | **Ulysses Contract** | "Did binding yourself help? Or did you bind yourself to a losing number?" |
  | **Final 10 Mins** | **Common Knowledge** | "You knew the trap. They knew the trap. Why didn't that stop you?" (Introduce *Common Knowledge of Rationality* as the missing variable). |

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Relay" Partner Folds Immediately**
  *   *Scenario:* Bid hits 100. Partner B takes paddle and immediately says "Pass."
  *   *Diagnosis:* This is actually a **success** for the lesson. It proves escalation is not inevitable if the psychological link is broken.
  *   *Action:* Highlight this in debrief. "Desk 3 escaped the trap. Why? Because the decision was decoupled from the history."

  **2. Nobody Escalates Past Value (The "Boring" Round)**
  *   *Scenario:* Bidding stops at 90.
  *   *Diagnosis:* Stakes too low or students too cautious.
  *   *Action:* In the next round, announce a "Bonus Token" for the first bidder to encourage entry. In debrief, ask: "Why did you stop? Did you see the cliff?"

  **3. Resentment Over Runner-Up Loss**
  *   *Scenario:* A desk loses 150 tokens and complains the raffle chance is ruined.
  *   *Action:* Remind them pre-class that *risk of loss* is the feature, not a bug. If a desk goes negative (below 0 tokens), they are eliminated from the raffle (bankruptcy). This adds tension. *Correction:* To avoid elimination, allow negative tokens but cap the loss at -100 (Bank absorbs the rest). This keeps them in the game for the debrief.

  **4. The Backward Induction Challenge**
  *   *Scenario:* A student argues, "BI doesn't say no one enters. It says only one person enters."
  *   *Action:* **Concede this point.** (See *Frank Note* below). Do not fight the math. Use it to show that even the "Soft" BI prediction (limited bidding) was violated by actual play.

  ---

  ## 6. Frank Note: Limitations & The Backward Induction Truth

  **The Backward Induction Claim**
  You asked whether the claim ("Fixed cap unravels the game to zero entry") is right.
  **Honest Answer:** No, not for the standard Dollar Auction payoff structure.
  *   *The Math:* In a finite Dollar Auction (e.g., max 4 bids), the last bidder *should* bid if $Bid < Prize$. The second-to-last bidder knows this. If the loss from being the runner-up is smaller than the cost of bidding, they might still bid.
  *   *The Unraveling:* BI typically unravels a Dollar Auction to **one bid**, not zero, unless the penalty for losing is disproportionately high compared to the prize.
  *   *Pedagogical Fix:* Do not assert "No one should enter." Assert: **"Rational calculation places a hard ceiling on escalation."** If students bid past the theoretical limit of the capped round, they have violated BI. That is the win condition for the lesson.
  *   *Script:* "Theory says you should be able to calculate the exact stopping point in a fixed game. If you bid past that point, you aren't playing the game I described; you're playing a different one."

  **What The Game Cannot Reproduce**
  The game cannot reproduce **Common Knowledge of Rationality (CKR)**.
  *   *The Gap:* In the game, *you* might be rational, but you don't know if *I* am rational. You don't know if *I know that you are* rational.
  *   *The Lecture:* In the final 10 minutes, you must supply this. Explain that the "Trap" relies on the hope that the *other* person will be the one to act irrationally (fold) first. The Dollar Auction is not a failure of individual logic; it is a failure of **coordination on rationality**.
  *   *Why this matters:* This moves the seminar from "People are dumb" (Sunk Cost) to "Equilibrium selection is hard" (Game Theory). This is the third-year level insight you are looking for.

  **Stakes Calibration**
  *   If 200 tokens is the endowment, and the prize is 100.
  *   Max recommended bid to watch for: ~250 tokens.
  *   If a desk goes to -50 tokens (Bank covers), their raffle chance is reduced but not zero. This prevents genuine resentment while maintaining pain.

  **Final Advice**
  When the bidding passes 100 tokens in Round 1, **stop talking**. Do not smirk. Do not look surprised. Your neutrality validates their reality. If you look like you're watching a train wreck, they will play to the audience. If you look like a bank teller, they will play to the incentives.
