prompt: |-
  I teach a third-year seminar on rational choice and its failures — about 22 students, mixed philosophy and behavioural-economics majors, one 90-minute session. I have run the dollar auction in this class twice (open-outcry escalation: a prize of fixed value, a minimum increment, the highest bidder pays their last bid and takes the prize, the runner-up pays their last bid and gets nothing) and it always lands in the same shallow place: the bidding sails past the value of the prize, everyone laughs, someone says sunk cost fallacy, and we move on. I want it to do more this time, and I would like you to design the session.

  The thing I want them to run into is that the step-by-step reasoning in the middle of the auction is not obviously irrational. At any node, raising can be the best available act given that you have already bid, and the comparison that recommends it is forward-looking, not backward-looking. So the charge of fallacy is too quick, and the interesting question is where the error — if there is one — actually sits: in the individual bid, or in the policy of entering at all. I would also like to pry apart the structural trap from the psychological story about commitment, responsibility for the initiating decision, and loss of face, and I have a crude idea for doing that which you should build on or replace: seat them in two-person desks, and have the partner who did *not* make the earlier bids take over the bidding once the total passes the value of the prize. Then the person deciding whether to throw more in has no personal history with the decision that started it. If escalation continues anyway, something other than self-justification is doing the work.

  Constraints and requests:

  No money may change hands (department rule), so the payoff scheme has to be tokens endowed at the start and converted afterwards into something with a little real pull — lottery tickets for a voucher, exemption from a quiz, your suggestion. I need the stakes to be large enough that people actually escalate and small enough that the runner-up's loss is not resented.

  I can spare about 60 minutes of play and 30 of debrief. Within that, I would like several short auctions rather than one long one, with two desks bidding at a time and the rest of the room observing and sealing a prediction of where the bidding will stop before each round starts — I want the gap between what observers predict and what participants do to be part of the material. Please include a variant with a fixed, commonly known number of rounds: I have been told that with such a cap backward induction unravels the game and nobody should enter, whereas in the open-ended version there is no clean place to start the induction at all. I would rather they discovered that contrast than heard it from me, so please tell me whether the contrast is right and how the cap has to be set relative to the prize's token value for the claim to hold — I do not want to assert something false at the front of the room.

  Finally, before the last round, each desk seals a number: a self-binding rule that the facilitator enforces, dropping them out when the bidding reaches it. I want to see whether knowing the trap makes them pre-commit not to play, or only to stop somewhat later, and I want the debrief to make the difference between those two lessons visible.

  Please give me: materials and setup, the exact rules and payoff scheme, a minute-by-minute timeline, the debrief mapping specific moments in the play onto specific parts of the analysis, an honest list of what will predictably go wrong the first time (including what to do if the relay partner simply folds, or if nobody escalates at all), and a frank note on which feature of the problem the game cannot reproduce and which therefore has to be supplied by me in the last ten minutes. Nothing should be explained up front: they should hear the phrases sunk cost and escalation of commitment for the first time in the debrief, and by then they should already have the material those phrases name.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 3rd-year seminar, Rational Choice & Failures. 22 students (Philosophy + Behav Econ). 90-minute session.
      *   **Problem:** Previous Dollar Auctions ended shallowly ("sunk cost fallacy" label, laughter, move on).
      *   **Goal:** Deepen the analysis. Show that step-by-step reasoning *during* the auction isn't obviously irrational (forward-looking vs. backward-looking). Distinguish structural trap vs. psychological commitment/face.
      *   **Specific Mechanism:** "Relay" bidding (partner takes over after value is passed) to isolate self-justification.
      *   **Constraints:** No real money (tokens -> lottery/voucher/quiz exemption). Stakes must be meaningful but not resentful.
      *   **Structure:** 60 mins play, 30 mins debrief. Multiple short auctions (2 desks bidding, rest observing/predicting).
      *   **Specific Variant:** Fixed-round auction (backward induction check). Need to verify if/when BI unravels the game.
      *   **Pre-commitment:** Before the last round, desks seal a "stop limit" to test pre-commitment efficacy.
      *   **Pedagogy:** No upfront explanation of terms (sunk cost, escalation). Let them experience it first.
      *   **Deliverables:** Materials/setup, rules/payoffs, minute-by-minute timeline, debrief mapping, troubleshooting (what goes wrong), limitations (what the game *can't* show).

  2.  **Verify the Theory (Backward Induction & Fixed Rounds):**

      *   *Claim:* With a fixed, commonly known number of rounds, backward induction (BI) unravels the game.
      *   *Analysis:* In a standard Dollar Auction, the game is theoretically infinite (or indeterminate). If there is a *hard cap* on the number of bids allowed (e.g., "Only 5 bids total allowed in the entire auction"), does BI work?
      *   *Scenario:* Prize $V$. Max bids $N$.
      *   *Last Bid (Round N):* If I bid $b_N$, I win if opponent doesn't bid. But opponent *can't* bid (rule). So if I am at round $N$, I should bid if $V - b_N > 0$ (assuming I'm currently losing) or simply take the win if I'm winning.
      *   *Wait, the standard BI argument for Dollar Auction:* Usually, the BI argument applies to a *finite horizon* version where players know the game *ends* after a certain bid level or round.
      *   *The "Unraveling" Logic:* If the game ends at Round $N$, the player at $N-1$ knows the opponent at $N$ will bid to minimize loss or win.
      *   *Correction/Refinement:* The standard "no one should enter" result relies on *common knowledge of rationality* and a *finite* game tree. If the game is "Max 5 bids total," Player 5 knows Player 6 can't bid. Player 5 will bid if profitable. Player 4 knows Player 5 will bid...
      *   *Actually:* The Dollar Auction is tricky for BI because of the "loser pays" rule.
      *   *Let's check the literature:* Shubik (1971) introduced it. O'Neill (2003) and others discuss BI.
      *   *Key Insight:* If the number of *rounds* is fixed (e.g., "Bidding closes after 5 minutes" is not a round cap). If the rule is "Maximum 10 bids allowed in total," the last bidder faces no threat of counter-bid. They will bid if $Bid < Value$. The second-to-last bidder knows this.
      *   *The "Unraveling" Condition:* For the game to unravel to "no entry," the cost of the *first* bid must exceed the expected value given the chain reaction.
      *   *Simpler approach for class:* Use a "Known End Time" vs. "Unknown End Time" or "Fixed Max Bid Amount."
      *   *User's specific request:* "Fixed, commonly known number of rounds."
      *   *Truth Check:* If there are $N$ rounds. In round $N$, the current high bidder wins if the other passes. The other passes if their potential loss > potential gain.
      *   *Actually, the standard BI result for Dollar Auction:* If the game is finite (max bid $M$), and $M > V$, the game can still escalate. However, if the *number of moves* is fixed and small relative to value, BI might hold.
      *   *Better Variant for Class:* A "Centipede Game" structure is better for BI, but the user wants Dollar Auction.
      *   *Consensus in Game Theory:* A finite Dollar Auction does *not* necessarily unravel to zero bidding unless the end condition makes the last move strictly dominated.
      *   *Wait, let's look at the "Trap":* The trap is that rational local moves lead to global loss.
      *   *Refinement for the User:* I need to be honest. A simple "5 rounds" cap doesn't guarantee zero bidding via BI unless the payoff structure at the end makes bidding irrational.
      *   *Solution:* I will advise the user that the "BI unravels to zero" claim is theoretically fragile in Dollar Auctions unless the *final round* makes bidding strictly dominated. I will suggest a variant where the *prize value decreases* per round or the *max bid is capped below value* (which kills the auction) OR simply frame it as "Finite Horizon" where the logic *should* apply but often doesn't (bounded rationality).
      *   *Actually, the most robust BI lesson:* If the game ends after Round 3, and in Round 3 the loser pays but can't bid back.
      *   *Decision:* I will caution the user. The claim "nobody should enter" is true *only if* the final bidder faces a situation where bidding is strictly dominated. In a standard Dollar Auction, even the last bidder might bid to cut losses. I will design the "Fixed Round" variant to highlight the *difficulty* of BI rather than asserting it guarantees zero bidding. *Correction:* I need to answer the prompt's specific question: "tell me whether the contrast is right and how the cap has to be set."
      *   *Answer:* The contrast is *not* straightforwardly right for a Dollar Auction. In a Centipede game, BI unravels. In a Dollar Auction, even with a round cap, the "loser pays" mechanic means the penultimate player might force the last player to pay.
      *   *Pivot:* I will suggest a "Known End" variant (e.g., "Bidding closes in exactly 3 minutes") vs "Unknown End." But the user asked for "Fixed number of rounds."
      *   *Best Advice:* I will tell the user that for BI to unravel the Dollar Auction to *zero entry*, the maximum possible bid must be less than the prize value (which stops the auction) OR the number of rounds must be so small that the first bidder knows they will be trapped.
      *   *Actually, let's look at the "No Entry" theorem:* If the game is finite and there is common knowledge of rationality, the unique subgame perfect equilibrium is often *no bidding*. Why? Because the last bidder will bid to minimize loss. The second to last knows this... eventually the first bidder knows they will lose money.
      *   *Condition:* The cap must be low enough that the *first* bidder calculates a net loss.
      *   *Okay, I will construct the parameters carefully.* Prize = 100 tokens. Min bid = 5. Max rounds = 4.
      *   *Round 4:* Bidder A (high) vs B (low). B bids. A cannot bid. B pays bid, wins.
      *   *This is messy.*
      *   *Alternative:* I will advise the user that the BI claim is theoretically sound *only under strict common knowledge of rationality*, which is the point of the experiment (to show people aren't that). I will set the cap such that BI *suggests* no entry, but humans will likely enter. This creates the learning moment.
      *   *Wait, I need to be accurate.* If I tell them "BI says no entry," and they enter, is it because BI is wrong or humans are irrational?
      *   *Okay, I will provide the specific math:* For BI to dictate no entry, the potential loss at the start must be certain.
      *   *Decision:* I will recommend a "3-Round Auction."
      *   *Round 1:* Bid 10.
      *   *Round 2:* Bid 20.
      *   *Round 3:* Bid 30. Game Over. Highest bidder wins, both pay.
      *   *Analysis:* If I bid in Round 3, I win 100, pay 30. Net +70. Opponent pays 20. Net -20.
      *   *Round 2:* If I bid 20, Opponent bids 30 in Round 3. I pay 20, get nothing. Net -20.
      *   *Round 1:* If I bid 10, Opponent bids 20... I lose 10.
      *   *So entry is rational if you think the other stops.*
      *   *Okay, I will be honest in the "Frank Note" section:* The BI unraveling requires common knowledge of rationality. The game demonstrates the *failure* of that assumption. I will design the parameters so BI *would* discourage entry, but the trap remains.

  3.  **Designing the Payoff/Stakes:**

      *   22 Students. 11 Desks (2 per desk).
      *   Endowment: 200 tokens each desk.
      *   Prize Value: 100 tokens.
      *   Min Increment: 10 tokens.
      *   Currency: Tokens convert to raffle tickets for a $50 Amazon voucher (or similar). 1 Token = 1 Ticket.
      *   *Risk:* Runner-up pays. If they bid 90 and lose, they lose 90 tokens (almost half endowment). This is painful but not ruinous.
      *   *Incentive:* Observers predict the "Stop Price." If within 10 tokens, they get 20 bonus tokens. This keeps them engaged.

  4.  **Designing the "Relay" Mechanism:**

      *   Desk has Partner A and Partner B.
      *   Phase 1: Partner A bids.
      *   Trigger: When total bidding reaches 100 (Prize Value).
      *   Phase 2: Partner B *must* take over the microphone/paddle. Partner A is silenced.
      *   *Rationale:* Removes "I've already invested *my* reputation/money" from the immediate decision, isolating the structural trap.

  5.  **Designing the "Pre-commitment" (Sealed Limit):**

      *   Before Round 4 (The Final Variant).
      *   Each desk writes a "Max Bid" on a card. Sealed.
      *   Rule: If bidding reaches this number, the facilitator declares them "Out" automatically.
      *   *Goal:* Test if they bind themselves to 0 (don't play) or just bind themselves to stop the bleeding later.

  6.  **Timeline Construction (90 Mins):**

      *   0-5: Setup/Endowment.
      *   5-20: Round 1 (Standard).
      *   20-35: Round 2 (Relay Variant).
      *   35-50: Round 3 (Fixed Rounds/BI Variant).
      *   50-60: Round 4 (Pre-commitment).
      *   60-90: Debrief.

  7.  **Debrief Strategy:**

      *   Map specific moments to concepts.
      *   Round 1 -> Sunk Cost (intuitive).
      *   Round 2 -> Structural Trap (Relay didn't stop it).
      *   Round 3 -> Backward Induction (Theory vs. Reality).
      *   Round 4 -> Pre-commitment (Ulysses Pact).
      *   Final 10 mins -> The "Missing Piece" (Common Knowledge of Rationality / Social Signaling).

  8.  **Troubleshooting:**

      *   *What if nobody bids?* (Rare, but possible). Incentivize the first bid (bonus token).
      *   *What if Relay partner folds immediately?* (Good data point!).
      *   *What if they don't take it seriously?* (Stakes need to be real enough).
      *   *What if the BI math is contested?* (Have the tree drawn on board).

  9.  **Refining the "Fixed Round" Claim:**

      *   I need to be careful here. In a Dollar Auction with a fixed number of rounds $N$, if $N$ is small, does BI imply no entry?
      *   Let $V=100$. Min bid $10$. Max 3 rounds.
      *   Round 3: Current High Bid 20. Low Bidder can bid 30.
      *   If Low Bidder bids 30: They win 100, pay 30. Net +70. High Bidder pays 20. Net -20.
      *   So Round 3 bidding is rational.
      *   Round 2: Current High Bid 10. Low Bidder can bid 20.
      *   If Low Bidder bids 20: They anticipate Round 3 bid by opponent. Opponent bids 30. Low Bidder (now High) pays 20, gets nothing. Net -20.
      *   If Low Bidder passes: They pay 0. Net 0.
      *   So in Round 2, rational player passes (knowing Round 3 will happen).
      *   Round 1: Player 1 knows Player 2 will pass in Round 2. So Player 1 bids 10, wins, pays 10. Net +90.
      *   *Result:* BI does *not* lead to no entry. It leads to *one* bid.
      *   *To get No Entry:* The loss from being the "sucker" in the penultimate round must outweigh the gain from being the winner in the final round.
      *   *Adjustment:* I will advise the user that the "No Entry" result is specific to *Centipede* games, and in Dollar Auctions, BI usually predicts *limited* escalation, not zero. I will frame the lesson around "Finite vs. Indefinite Horizon" rather than "Zero vs. Non-zero."
      *   *Wait, I can fix the parameters.* If the penalty for losing is high enough.
      *   *Actually, the most honest pedagogical move:* Tell the user the claim is *theoretically* contested for Dollar Auctions specifically, but the *contrast* between Finite and Indefinite is the real lesson. Finite allows calculation; Indefinite invites hope. I will design the round to show that even with a cap, escalation happens (violating BI), which proves bounded rationality.
      *   *Re-reading prompt:* "I have been told that with such a cap backward induction unravels the game and nobody should enter... tell me whether the contrast is right."
      *   *My Duty:* Correct the misconception gently. It unravels to *one bid* usually, not zero, unless the end-game payoff is negative. I will provide the math in the "Frank Note."

  10. **Drafting the Plan:**

      *   *Tone:* Professional, pedagogical, precise.
      *   *Structure:* Follow the prompt's requested sections.
      *   *Materials:* Tokens, Prediction Sheets, Sealed Envelopes, Timer.
      *   *Payoff:* 200 tokens start. Prize 100. Min bid 10. 1 Token = 1 Raffle Ticket.
      *   *Relay:* Switch at 100 tokens.
      *   *Prediction:* Observers guess "Final High Bid."
      *   *Debrief:* Connect experience to theory.

  11. **Review against Constraints:**

      *   No money? Yes (Tokens -> Raffle).
      *   60/30 split? Yes.
      *   Multiple auctions? Yes (4 rounds).
      *   Observers predict? Yes.
      *   Fixed round variant? Yes (with caveats).
      *   Pre-commitment? Yes.
      *   No upfront theory? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

  12. **Final Polish:** Ensure the "Relay" rule is clear. Ensure the "Fixed Round" math is explained to the instructor so they don't get cornered by a smart student. (The smart student will point out that bidding 10 is rational even in a finite game). I will arm the instructor with that nuance.

  *(Self-Correction during drafting)*: I need to make sure the "Relay" doesn't feel like a completely new game. The debt carries over. Partner B inherits Partner A's current bid liability.
  *Crucial Detail:* If Partner A bid 90, and Partner B takes over. Partner B is now the "high bidder" at 90? Or does Partner B become the "challenger"?
  *Logic:* The *Desk* is the player. The *Person* changes.
  *Rule:* When value (100) is passed, the *person* holding the paddle swaps. The *Desk's* bid history remains. This isolates the psychological ownership of the *past* bids, while keeping the structural trap (the current bid liability).

  *Wait, one more check on the Fixed Round BI:*
  If the game is "Max 2 bids total."
  Bid 1: 10. Bid 2: 20. Game Over.
  Player 2 (Bid 20): Wins 100, pays 20. Net +80.
  Player 1 (Bid 10): Loses, pays 10. Net -10.
  Player 1 anticipates this. Player 1 bids 10. Net +90 (if Player 2 doesn't bid).
  If Player 2 bids, Player 1 loses 10.
  So Player 1 enters.
  Okay, I will explicitly tell the instructor: "The claim that nobody enters is false for standard parameters. The claim is that escalation is *bounded*. The lesson is that even bounded escalation violates BI if they go past the theoretical limit."
  *Actually, better:* I will suggest a variant where the *Prize Value decreases* per round. That forces BI to zero.
  *No, keep it simple.* I will explain the nuance in the "Frank Note" so the instructor is prepared. The prompt asks me to "tell me whether the contrast is right." I must answer that honestly. It is *not* strictly right for Dollar Auctions without specific payoff adjustments. I will provide the adjustment needed to make it right (The "Poison Pill" end-game).
  *Decision:* I will recommend a "Sudden Death" round. Round 4 is the last round. If you bid in Round 4, you pay double. This makes the last move dominated. Then BI unravels.
  *Wait, that changes the game too much.*
  *Best path:* Answer the prompt honestly. "The contrast is theoretically fragile." Provide the math in the notes. Let the class discover that BI *should* limit them, but doesn't.

  *Final Plan Check:*
  1. Setup (Tokens, Raffle).
  2. Round 1: Standard (Baseline).
