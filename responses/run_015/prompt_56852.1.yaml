      *   **Constraints:** No winking, no footnotes explaining the philosophy. The humor must come from the fine print taking real philosophical positions seriously.
      *   **Mechanics:** $500,000 grand prize split evenly across all valid entries. More entries = less per person. Ideal outcome: small, exactly-right number of superrational entrants (once each). Entrants must state how many entries they're submitting and why.
      *   **Required Clauses/Elements:**
          1.  Eligibility clause defining a "superrational entrant" that undoes itself upon application.
          2.  Provision for being the only correct reasoner vs. causal decision theorists (CDT).
          3.  "Platonia clause" disclaiming liability for timeless Platonic versions + waiver that mailing the card adds nothing.
          4.  Mixed-strategy section (entered with probability *p*).
          5.  Tie-break rule for isomorphic copies of the same entrant.
          6.  Disputes clause naming a jurisdiction that can never convene.
      *   **Tone:** Dry, legalistic, satirical but logically consistent within the frame. Aim at the logic, not real people. Fair to specialists (not a strawman).
      *   **Pre-drafting:** Brainstorm 3-4 bullets on internal logic, superrational biting points, and sponsor disclaimers.

  2.  **Brainstorming (Pre-drafting):**
      *   *Internal Logic:* The core paradox is that entering assumes others will reason like you. If you reason "I should enter," you imply "Everyone should enter," which destroys the prize. The rules need to codify this dependency as a contractual obligation.
      *   *Superrational Biting Point:* Superrationality requires assuming your decision determines others'. The rules must treat the act of reasoning as the act of entering, making the physical submission merely ceremonial or redundant.
      *   *Sponsor Protection:* The foundation needs to avoid paying out if too many people enter (prize becomes negligible) or if people argue about metaphysical identity. They need to disclaim responsibility for counterfactual selves and enforce a jurisdiction that exists only in theory (like the "Kingdom of Reason" or similar).
      *   *Specific Clause Logic:* The "superrational" definition needs to be circular. The "Platonia" clause needs to assert that the physical card is epiphenomenal. The jurisdiction should be something like "The Court of Pure Reason" or "Non-existent Space."

  3.  **Drafting - Section by Section:**

      *   *Header:* Official Rules, Luring Lottery Revival.
      *   *Section 1 (Eligibility/Superrationality):* Define who can enter. Must be superrational. But if you check if you're superrational, you might fail. Let's make it so that applying the definition invalidates the entry.
      *   *Section 2 (Prize Structure):* $500k split by N. N is determined by... logical necessity.
      *   *Section 3 (The Entry Card):* Must state number of entries and justification.
      *   *Section 4 (Causal Decision Theorists):* What if everyone else is CDT? They ruin the pool. The rules need to handle the "sucker" payoff.
      *   *Section 5 (Platonia/Timeless):* The physical mailing is irrelevant. The decision exists timelessly.
      *   *Section 6 (Mixed Strategies):* Probability *p*. How to count fractional entries?
      *   *Section 7 (Isomorphic Copies):* Tie-break for clones/identical reasoners.
      *   *Section 8 (Disputes):* Jurisdiction that can't convene.

      *Refining the Humor:* The humor lies in the legal text treating metaphysical concepts as binding contractual terms. "The Entrant acknowledges that their physical submission is causally inert." "Jurisdiction of the Counterfactual."

      *Word Count Check:* Need to hit around 700 words. Legalese tends to be verbose, which helps.

      *Revision on Brainstorming Bullets:*
      1.  *Logic:* The rule must equate the *reasoning process* with the *entry submission*, making the physical act redundant but legally required.
      2.  *Superrationality:* The definition must require assuming everyone else uses the same definition, creating a fixed point that collapses if examined too closely.
      3.  *Liability:* The sponsor must disclaim responsibility for the prize value collapsing due to the entrant's own reasoning leading others to enter.
      4.  *Jurisdiction:* A place that exists only if everyone agrees it exists, which no one can do practically.

  4.  **Writing the Document:**

      *   *Title:* OFFICIAL RULES AND CONDITIONS OF PARTICIPATION: THE LURING LOTTERY REVIVAL.
      *   *Clause 1 (Eligibility):* Focus on the superrational definition.
      *   *Clause 2 (Prize):* The split mechanic.
      *   *Clause 3 (Justification):* The "why" on the card.
      *   *Clause 4 (CDT/Defectors):* Handling the non-superrational pool.
      *   *Clause 5 (Platonia):* The timeless aspect.
      *   *Clause 6 (Mixed Strategy):* Probability *p*.
      *   *Clause 7 (Isomorphism):* Clones.
      *   *Clause 8 (Jurisdiction):* The impossible court.

      *Self-Correction during drafting:* Ensure I don't explain the joke. Keep it dry. Make sure the "Platonia" clause explicitly waives the value of the physical mailing. Ensure the jurisdiction is impossible (e.g., "The Sovereign State of Logical Necessity").

      *Word Count Management:* Legalese is dense. I need to expand on the implications of each clause to reach ~700 words without fluffing too much. I will elaborate on the consequences of the mixed strategy and the isomorphic tie-break.

      *Check Specific Requirements:*
      *   Eligibility clause defining superrational entrant that undoes itself? -> Yes, Clause 1.
      *   Provision for only one correct reasoner vs CDT? -> Yes, Clause 4.
      *   Platonia clause (timeless versions + mailing adds nothing)? -> Yes, Clause 5.
