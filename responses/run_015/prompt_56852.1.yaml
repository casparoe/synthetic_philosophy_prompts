      *Let's write.*

      *(Drafting mental check)*: Make sure the tone is strictly legal. No "ha ha." Just "The Foundation asserts..."

      *(Word Count Check)*: If it's too short, expand on the indemnification regarding the prize dilution. If too long, trim the preamble.

      *(Final Polish)*: Ensure American English spelling (behavior, defense, etc.).

  5.  **Final Review against constraints:**
      *   ~700 words?
      *   Numbered clauses?
      *   Dry legalese?
      *   All specific clauses included?
      *   No footnotes?
      *   No winking?

      *Let's assemble.*
answer: |-
  **OFFICIAL RULES AND CONDITIONS OF PARTICIPATION: THE LURING LOTTERY REVIVAL**

  **1. Eligibility and Superrational Status**
  Participation is restricted to Superrational Entrants. A Superrational Entrant is defined as an agent who chooses their action based on the assumption that all other eligible agents will utilize the identical reasoning process to reach an identical conclusion. By submitting an Entry, the Entrant warrants that they have satisfied this definition. However, the Foundation notes that the act of verifying one's own superrationality constitutes a distinct causal decision process, thereby potentially invalidating the warranty contained herein. The Foundation reserves the right to disqualify any Entrant whose reasoning process deviates from the consensus logic required to maximize the collective payout, even if such deviation was necessary to submit the Entry.

  **2. Prize Structure and Dilution**
  The Grand Prize consists of USD $500,000.00 (the "Pool"). The Pool shall be divided evenly by the total number of Valid Entries (N). Each Entrant acknowledges that their decision to enter logically necessitates that all other Superrational Entrants make the same decision. Consequently, any Entrant who enters while believing N will remain low acknowledges that their own entry contributes to the reduction of individual share value. The Foundation assumes no liability for prize dilution caused by the Entrant's own reasoning being successfully mirrored by the pool.

  **3. Entry Justification**
  Each Entry Card must explicitly state the number of submissions being made (which must be an integer ≥ 1) and a written justification for why this number optimizes the expected utility for all agents reasoning identically. Entries lacking a justification, or containing a justification that relies on causal decision theory (e.g., "my entry won't stop others"), will be deemed void. The Foundation is not responsible for evaluating the truth value of the justification, only its structural isomorphism to the justifications of other Entrants.

  **4. Causal Decision Theorist Contingency**
  In the event that the Pool consists of exactly one Superrational Entrant and multiple Causal Decision Theorists (hereinafter "Defectors"), the Superrational Entrant shall receive the Pool minus a processing fee equivalent to the moral hazard imposed by the Defectors. If the Superrational Entrant refrains from entering due to the anticipated presence of Defectors, the Prize shall roll over to the next fiscal cycle, provided the logical structure of the Lottery remains invariant across time.

  **5. Platonic Liability and Epiphenomenal Mailing**
  The Entrant acknowledges that the decision to enter exists timelessly within the space of logical arguments (hereinafter "Platonia"). The physical mailing of the Entry Card is acknowledged by all parties to be causally inert and adds no information to the structure of the Lottery that was not already contained in the timeless fact of the Entrant's decision. The Foundation disclaims all liability for claims arising from Platonic versions of the Entrant that entered the Lottery in counterfactual universes where the reasoning process yielded a different result. By signing, Entrant waives any claim that their physical submission altered the outcome.

  **6. Mixed-Strategy Participation**
  Entrants utilizing a mixed strategy (entering with probability *p*) must calculate their claim to the Pool as a function of *p*. If *p* is less than 1.0, the Entrant's share of the Prize shall be discounted by the entropy of their own indecision. The Foundation will not adjudicate disputes regarding whether *p* was generated by a true random number generator or by subjective uncertainty, as both are considered equally deterministic from the perspective of Platonia.

  **7. Isomorphic Tie-Breakers**
  In the event that two or more Entrants submit identical justifications derived from identical reasoning processes, they shall be considered isomorphic copies of the same logical agent. The Prize share allocated to this logical agent shall be divided among the physical instantiations based on postal timestamp. If timestamps are identical, the Prize portion attributable to these copies shall be donated to a charity selected by the Foundation, as distinct physical copies of the same reasoner represent a redundancy in the distribution of utility.

  **8. Governing Law and Jurisdiction**
  These Rules shall be governed by the laws of the Sovereign State of Logical Necessity. Any disputes arising from this Lottery must be adjudicated in the High Court of Counterfactuals, located in the possible world closest to this one wherein the Prize was not split into insignificance. The Entrant acknowledges that this Court cannot convene in the actual world due to modal constraints. By entering, the Entrant waives the right to a trial by jury of peers in any jurisdiction that possesses physical enforcement capabilities.
