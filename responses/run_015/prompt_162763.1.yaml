  **The Disagreement:**
  You and your friend are using the same heuristic engine but different input data. Your friend is calculating a *prior* probability (what we should have believed in 1732 before Euler factored $F_5$), while you are calculating a *posterior* probability (what we should believe now, conditioning on the fact that $F_5$ through $F_{32}$ are known composite). In Bayesian terms, your friend has failed to update on the evidence; the "0.09" probability mass was almost entirely concentrated in the range $n=5$ to $n=32$, which has now been ruled out.

  **Decisive Evidence:**
  The single piece of evidence that would move my number the most is **a proof that $F_{33}$ is prime**.
  *   **Direction:** Upward (to 1.0).
  *   **Reasoning:** While finding a factor of $F_{33}$ is more likely and would only halve my estimate (shifting the start to $n=34$), discovering $F_{33}$ is prime would instantly invalidate the "no more Fermat primes" consensus and dominate the entire probability space.

  **On Resolution:**
  I would count the question as "found out" only via **rigorous proof**, not heuristic convergence. Since testing $F_{100}$ is physically impossible (it has $\approx 10^{30}$ digits), resolution must come from either finding a prime (verification is possible via Pépin's test if we suspect it) or a general proof that $F_n$ is composite for all $n \ge 5$ (e.g., proving a covering set of divisors exists, though this is unlikely). Until then, the heuristic is merely a betting odd, not a truth.
