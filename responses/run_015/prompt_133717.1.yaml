      *Proposed Tree Structure:*
      1.  **The Silicon Swap (Case C):** If we replace neurons with functionally identical silicon chips, is the person still *you*?
          *   Yes -> Substrate Independent (Computationalist leaning).
          *   No -> Substrate Dependent (Biological/Embodied leaning).
      2.  **The Analog Test (Case B):** If the simulation uses continuous water pressure instead of 0s and 1s, is it still running an *algorithm*?
          *   Yes -> Broad Computation (Analog Computation).
          *   No -> Dynamic Systems (Non-computational).
      3.  **The Slime Test (Case A):** If a slime mold solves a maze without a brain, is it *computing* a solution or just *being* a solution?
          *   Computing -> Pancomputationalism (Everything computes).
          *   Being -> Enactivism (Cognition is living, not calculating).

      *Wait, I need to defend the structure.*
      *   I will argue that the "Digital vs. Analog" split is often ignored but crucial. Most people say "brain is a computer" meaning "digital processor." If it's analog, the metaphor breaks.
      *   I will argue that "Substrate Independence" is the gatekeeper. If you fail that, you aren't a computationalist in the strong sense.

  5.  **Drafting the Content - Section by Section:**

      *   **Intro:** Acknowledge the mess. Define Algorithm vs. Implementation simply.
      *   **The Tree:** Present the 3 Questions clearly.
      *   **The Leaves:** Map the outcomes to specific philosophical positions (Strong AI, Connectionism, Enactivism, etc.).
      *   **The "Stance":** Explain *why* I ordered the questions this way. (I believe the Digital/Analog split is the hidden killer of the "brain is a computer" thesis).
      *   **The Gaps:** Identify indistinguishable leaves and incoherent paths.

  6.  **Refining the Definitions (Algorithm vs. Implementation):**
