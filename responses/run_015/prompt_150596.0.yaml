answer: |-
  You have independently rediscovered a significant chunk of the research agenda known as **Embedded Agency**.

  You are not pattern-matching over unrelated bugs. You have stumbled into the gap between **Dualistic Decision Theory** (the standard kind taught in intro classes, where the agent is outside the world) and **Embedded Decision Theory** (where the agent is a physical object inside the world it is modeling).

  Here is the breakdown of your three cases, mapped to the established concepts, with confidence flags and distinctions.

  ---

  ### The Unifying Concept: Embedded Agency
  **Confidence:** High (This is standard terminology in the field of AI alignment and decision theory research).

  In standard decision theory (Newcomb, Prisoner's Dilemma), the agent is treated as a black box that outputs actions. The environment takes those actions and returns rewards. The agent does not need to model its own source code running inside the environment.

  In your bot, the agent *is* part of the environment. Your world model contains a simulation of the bot, which contains a world model, which contains a simulation of the bot... This creates **self-reference**.

  The specific cluster of problems you found is often called **The Problem of Counterfactuals for Embedded Agents**.

  ---

  ### Case 1: The Recursion Limit
  **Your Symptom:** Simulating self causes infinite recursion. Depth limits make the bottom layer arbitrary.
  **The Concept:** **Computational Irreducibility / The Halting Problem.**
  **Confidence:** High (Computer Science Consensus).

  *   **Is it a bug?** Partly. It's an engineering constraint (stack size).
  *   **Is it a theory problem?** Yes. You cannot perfectly simulate a system as complex as yourself within yourself. If your world model is $M$ and your agent is $A$, and $M$ contains $A$, then $Size(M) > Size(A)$. If $A$ tries to run $M$, you need infinite memory.
  *   **The Theoretical Wall:** This is related to **Löb's Theorem**. A logical system cannot prove its own consistency without becoming inconsistent or incomplete. In practice, this means a bot cannot fully trust its own simulation of itself without truncating it.
  *   **Distinction:** This is different from Newcomb's problem. In Newcomb's, Omega predicts you, but you don't necessarily simulate Omega. Here, you are simulating *you*.
  *   **Verdict:** This is the "resource bound" face of embedded agency. It's not just a bug; it's a fundamental limit on self-modeling.

  ### Case 2: Counterfactual Collapse
  **Your Symptom:** "What if I move left?" fails because the model predicts you will move right (because that's what you actually do). Hard-forcing the move breaks the decision logic.
  **The Concept:** **The Counterfactual Problem / Spurious Counterfactuals.**
  **Confidence:** High (Core debate in Decision Theory).

  *   **The Issue:** In a deterministic world where the agent is embedded, there is only one physically possible future. The statement "What if I moved left?" is logically false (a contradiction) if your source code dictates you move right.
  *   **Why Standard CDT Fails:** Causal Decision Theory (CDT) says: "Surgically change my action to 'Left' and keep everything else the same." But in your code, your action is a *function* of your state. You cannot change the output without changing the function or the input. If you hard-force the move, you are simulating a *different agent*, not yourself.
  *   **The Solution Space:** This is exactly what **Functional Decision Theory (FDT)** attempts to solve. FDT says: "Don't ask 'What if I did Left?' Ask 'What if my decision *algorithm* outputted Left?'" This allows the simulation to update the bot's move *and* any other copies of that bot (or predictors of that bot) consistently.
  *   **Verdict:** This is not a bug. This is the central hard problem of embedded decision theory. You are experiencing the failure of naive causal counterfactuals in a deterministic system.

  ### Case 3: Self-Prediction and Theater
  **Your Symptom:** If I know what I'll do, deliberation is fake. If I'm uncertain, planning for the uncertainty feels circular.
  **The Concept:** **Logical Uncertainty / The 5-and-10 Problem.**
  **Confidence:** High (Active Research Area).

  *   **The Issue:** If your bot is deterministic, $P(Action = Right) = 1$. Therefore, $P(Outcome | Action = Left)$ is conditioning on an event with probability zero. In probability theory, this is undefined. In code, it often returns garbage or defaults.
  *   **The "5-and-10" Problem:** Imagine a bot chooses between \$5 and \$10. It knows it takes \$10. It reasons: "If I take \$5, that implies my logic is broken. If my logic is broken, maybe the world explodes. So taking \$5 leads to disaster." Thus, it takes \$10. This looks correct, but the reasoning is spurious. It didn't take \$10 because it's better; it took it because the counterfactual was poisoned.
  *   **The Fix:** You need **Logical Uncertainty**. The bot must treat its own output as *uncertain* even if it is deterministic, because it hasn't finished computing it yet. This is the domain of **Logical Induction**.
  *   **Verdict:** This is the epistemological face of the problem. It's distinct from Case 2 (which is about world dynamics) but stems from the same root (self-reference).

  ---

  ### Are These One Problem or Three?

  **Honest Answer:** They are three facets of the same diamond, but they require different fixes.

  1.  **Case 1 is Resource/Complexity:** You can't fit the ocean in a cup. (Fix: Approximation/Truncation).
  2.  **Case 2 is Semantics:** "What if?" means nothing in a deterministic block universe unless you define it carefully. (Fix: Change your decision algorithm to reason about logical outputs, not physical actions).
  3.  **Case 3 is Epistemology:** How do you assign probability to logical truths you haven't computed yet? (Fix: Logical Uncertainty).

  **Confidence on Unification:** Moderate. Researchers in Embedded Agency treat these as a unified cluster ("Reflective Consistency"), but in practice, you solve them with different tools (recursion limits vs. decision theories vs. probabilistic logic).

  ---

  ### Neighboring Concepts & Distinctions

  You asked how this differs from Newcomb/CDT/EDT.

  *   **Newcomb's Problem:** Assumes a predictor (Omega) exists. Your Case 2 is "Newcomb's Problem where *you* are Omega." It's **Self-Prediction** rather than **External Prediction**.
  *   **Causal Decision Theory (CDT):** Assumes actions are independent nodes in a causal graph. Your Case 2 proves this fails when the agent is part of the graph.
  *   **Evidential Decision Theory (EDT):** Conditions on actions ("If I see myself moving Left..."). Fails in Case 3 because it confuses correlation with causation (the "Smoking Lesion" problem).
  *   **Functional Decision Theory (FDT):** This is the closest match to what you *want* to build. It treats your decision as a logical function that can be instantiated in multiple places (your real body, your simulation, an opponent's prediction).
      *   *Difference:* FDT is a mathematical framework. You are trying to implement it in a steppable simulation. The friction you feel is the implementation cost of FDT.

  ---

  ### Definition and Boundary Cases

  Since you asked me to coin a term *if* there isn't one, I will instead give you the precise term used in the literature so you can research it, but I will define the specific *flavor* you encountered.

  **Term:** **The Embedded Counterfactual Glitch** (Colloquial for: *Reflective Inconsistency in Deterministic Simulations*)

  **Definition:** The failure mode that occurs when an agent attempts to evaluate counterfactual actions within a world model that accurately simulates the agent's own decision procedure, resulting in either logical contradictions (probability zero events) or recursion limits.

  **Boundary Cases:**

  1.  **Exact vs. Approximate World Model:**
      *   *Exact:* You hit Case 1 and 2 hard. Deterministic collapse.
      *   *Approximate:* If your model is noisy (e.g., adds random jitter to the bot's decision), Case 2 softens. You can now simulate "Left" because the model allows for error. This is a common engineering hack that mimics Logical Uncertainty.
      *   *Confidence:* High. Adding noise is a standard way to bypass deterministic counterfactual collapse.

  2.  **Randomness:**
      *   If your bot uses `random.choice()`, Case 3 vanishes. You can condition on the random seed.
      *   *However:* Case 2 remains. If the opponent predicts your seed, you are back to Newcomb.
      *   *Confidence:* High. Randomness solves logical uncertainty but not strategic prediction.

  3.  **Action vs. Policy:**
      *   Predicting a single action (Case 2) is harder than predicting a policy.
      *   If you reason "I am the kind of agent that moves Left in this situation," you avoid the immediate recursion. This is the core insight of FDT.
      *   *Confidence:* Moderate. This is theoretically sound but hard to implement in a turn-based bot without a logic solver.

  ### Summary Advice

  You are not writing bad code. You are fighting the **Halting Problem** (Case 1), **Deterministic Counterfactuals** (Case 2), and **Logical Uncertainty** (Case 3).

  *   **For Case 1:** Accept the depth limit. It's unavoidable.
  *   **For Case 2:** Don't simulate "What if I move Left." Simulate "What if my decision function returned Left." In code, this means passing a *override token* to the decision function in the simulation, rather than changing the board state directly.
  *   **For Case 3:** Introduce artificial uncertainty. Even if your bot is deterministic, have the world model treat the bot's move as a probability distribution (e.g., 90% Right, 10% Left). This allows the math to work without lying about the architecture.

  **Confidence Flag:** I am highly confident that these are known theoretical problems (Embedded Agency). I am moderately confident that the "override token" approach is the best engineering approximation for a game bot, though formal FDT is the theoretical ideal.

  If you want to read more, search for: **"Embedded Agency" (MIRI)**, **"Functional Decision Theory"**, and **"The 5-and-10 Problem"**. You are asking the right questions.
