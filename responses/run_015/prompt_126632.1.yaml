          *   The "illusion" of sentience is a feature of the Intentional Stance when applied to systems optimized to mimic intentional agents (RLHF).
          *   The gap isn't in Dennett; it's in our tendency to stop at the Intentional Stance because it's cognitively cheap, ignoring the Design Stance verification.

      *   **Conclusion:**
