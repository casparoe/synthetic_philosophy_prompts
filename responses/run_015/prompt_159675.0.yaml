  6.  **Refining the "Humean Concession" Aspect:**
      *   I must ensure I'm not just listing Armstrong or Maudlin's objections. I need to frame them as: "Here is where the Humean system strains under its own weight."
      *   *Island Universes:* A Humean admits that if laws are global, local regularity is contingent on distant chaos. That's a cost.
      *   *Late-Onset:* A Humean admits lawhood is time-relative. That's a cost to the concept of 'law'.
      *   *Explanation:* A Humean admits they must revise the notion of explanation (unificationist vs. mechanistic).

  7.  **Addressing the "Flexibility" Worry:**
      *   This is the "Language Dependence" or "Gerrymandering" objection.
      *   If I can choose *any* vocabulary, I can make any mosaic look simple.
      *   Lewis's fix: "Natural Properties."
