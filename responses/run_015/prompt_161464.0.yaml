prompt: |-
  You are a political economist who also works on causal inference and the philosophy of social science, and you are fluent in the welfare-state literature in a way I am not. Please think carefully and work in stages: begin with a private brainstorm of candidate mappings between my vocabulary and yours, discard the ones that are merely decorative metaphors, and only then write the answer I can actually use. Aim for roughly 1,200–1,500 words of finished prose, plus a compact table.

  I am a journalist who covers science and ideas. My beat has recently been social epidemiology and the behavioural sciences, so my home vocabulary is not political science or economics but population science. The distinctions I am genuinely comfortable with, and which I want you to translate into, are these:

  - the contrast between the causes of *cases* (why this individual became ill) and the causes of *incidence* (why this population has the rate it does), and the fact that the two can be almost unrelated;
  - the prevention paradox: a measure that shifts a whole distribution can produce large aggregate gain while offering little to any given individual, and is therefore politically fragile;
  - confounding by a common prior cause, reverse causation, and effect modification — in particular the question of whether an exposure produces the same effect in a population whose baseline prevalence differs;
  - threshold and network models of collective behaviour, where an individual's action is worthwhile only if enough others act, so that equilibria are multiple, self-reinforcing, and hard to move between;
  - the notion of a "fundamental" social cause: one that reproduces its own protective effect as the intervening mechanisms change.

  I have a shakier grasp of institutional economics, welfare-regime typologies, and labour-market institutions, so please state the object-level positions in your own words before you translate them.

  The subject I am writing about is the Nordic model and whether it can be exported. As I understand the argument space, there are at least four moves to be translated:

  1. The package or equilibrium view: the high tax take and broad tax base, universalistic rather than means-tested benefits, high union density with coordinated wage bargaining, compressed wage distributions, extensive public provision of childcare and eldercare, high employment — especially among women — and active labour-market policy combined with relatively light employment protection ("flexicurity") are not a menu but a mutually reinforcing system, held in place by high interpersonal trust, high tax morale, a legible and comparatively uncorrupt state, and a long historical path.
  2. The portability view: the components are separable instruments, and what travels is the incentive and insurance design, not any cultural disposition; a country can adopt the childcare-and-activation parts without acquiring Nordic trust, and get employment and poverty effects anyway.
  3. The selection sceptic: cross-country comparisons are confounded — small scale, relative ethnic and religious homogeneity, resource rents, favourable demography and terms of trade, and above all a prior history of state capacity that caused both the institutions and the outcomes.
  4. The arrow question: universalism may *produce* trust, by making everyone a stakeholder in the same services and by avoiding the stigma and poverty traps of means-testing, rather than merely *requiring* a population that was already trusting.

  Here is what I want from you.

  First, a mapping: give me a table taking the central terms of the Nordic-model debate — universalism, tax morale, trust, decommodification, wage compression, activation, portability — and assigning each one the nearest analogue in population-science vocabulary, with a frank note where the nearest analogue is only a metaphor.

  Second, restate positions 1 through 4 in that vocabulary as faithfully as you can. In particular I want the export question rendered explicitly as a question about effect modification by baseline conditions: does universalistic provision raise trust and compliance in a population starting from low trust, or does it fail, or backfire? And I want the equilibrium view rendered in threshold-model terms, including what would count as evidence that a country is stuck on the wrong side of a critical mass.

  Third, and this is the part I care most about, the residue report. Tell me, in three groups: what translated cleanly; what translated only after you bent it, and exactly what you had to bend; and what could not be expressed in my vocabulary at all. My suspicion, which I want you to test rather than confirm, is that at least three things resist translation: that the "intervention" here is a law the population must impose on itself rather than a treatment an investigator administers, so the exposure is endogenous to the outcome; that implementation fidelity in policy is not like compliance in a trial, because the people delivering the treatment are also the people being treated; and that population science is silent on whether a given outcome distribution is *good*, which is half of what is at stake when a reader asks whether their country should become more Nordic.

  Fourth, the verdict on the residue. For each item that failed to translate, tell me whether that is a defect of my vocabulary — something epidemiology genuinely cannot say and that I should stop expecting it to say — or a sign that the object-level claim was less clear than it looked, or that the question "can the Nordic model be exported?" is not one well-posed question but several. I would also like you to flag, explicitly, any place where my framework's assumptions would quietly smuggle themselves in if I were less careful: for instance, my vocabulary tends to assume a stable causal structure that can be intervened on from outside, which may be precisely what is in dispute here.

  A last practical note. I am turning this into a feature of about 3,000 words for a general but demanding readership. So, in a short closing section, tell me where the translation earns me a sentence I could not otherwise write, and where, if I leaned on it in print, it would mislead my readers. Please do not cite anything or give me a reading list — I handle sourcing myself — and do not spend words flattering the framework.
