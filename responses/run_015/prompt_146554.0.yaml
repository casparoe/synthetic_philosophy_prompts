answer: |-
  Colleagues, students, and friends, welcome to "The Inviolate Level."

  I stand before you as a biologist who has spent thirty years measuring how organisms change their environments, and who now, in retirement, finds themselves measuring how concepts change their users. I am not a philosopher. But I am no longer purely a scientist. I occupy the space between these labels, which is precisely where this workshop must live.

  We are gathered to discuss explanation across disciplines. Usually, such gatherings proceed on a tacit assumption: that one discipline provides the reality, and the other provides the commentary. We assume science describes the world, and philosophy describes the science. Or, conversely, that philosophy provides the logical foundation, and science merely fills in the empirical details.

  I ask you to suspend that assumption. Instead, I invite you to visualize M. C. Escher's lithograph *Drawing Hands*. You know the image. Two hands emerge from a flat sleeve. Each holds a pencil. Each is drawing the other into existence. The cuff of the left hand is drawn by the right; the cuff of the right hand is drawn by the left. There is no hand that is not also being drawn. There is no paper beneath them that is not part of the sketch. There is no inviolate level.

  By an "inviolate level," I mean a foundational layer of explanation that explains everything above it without itself requiring explanation from below. It is the bottom hand that does not need to be drawn. For much of my career, biology sought this level in the gene. The Central Dogma suggested a one-way street: genetic information flows upward to build the organism. The gene was the inviolate hand; the organism was the drawing.

  But the work I spent my life doing—phenotypic plasticity and niche construction—eroded that foundation. We found that organisms are not passive drawings. They build dams, turn soil, and alter atmospheric chemistry. These constructed environments feed back to regulate gene expression and dictate evolutionary trajectories. The organism modifies the environment, which selects the gene, which builds the organism.

  In this loop, there is no epistemically prior hand. The gene does not stand outside the system to dictate it; the gene is inside the loop, regulated by the very organism it helps construct. If you seek the inviolate level here, you find only a tangled hierarchy.

  This is not merely a biological curiosity. It is the structural constraint of this workshop. I am one of Escher's hands. I speak with the authority of scientific practice. The philosophical vocabulary I now borrow is the other hand. I cannot stand outside this hierarchy to declare which discipline supplies the foundation, because I am using philosophical concepts to explain my scientific history, and I am using scientific history to validate these philosophical concepts. We are drawing each other.

  Therefore, we must set ground rules for the next three days that acknowledge this mutual dependency.

  To the philosophers in the room: Do not treat scientific practice as raw, untheorized data. When you analyze our models or our measurements, remember that they are already laden with the very conceptual frameworks you seek to examine. We are not providing you with neutral facts; we are providing you with finished drawings. If you treat our work as mere evidence for your theories, you ignore the pencil in our grip.

  To the scientists in the room: Do not treat philosophical framing as external ornament. Conceptual clarity is not decoration added after the work is done; it is the sleeve from which the hand emerges. If you dismiss these distinctions as semantic, you risk drawing a hand that cannot hold a pencil. You cannot explain the organism without explaining the logic of the explanation itself.

  To our colleagues in administration and our graduate students: You may hear terms like "reductionism" or "emergence." Do not worry about mastering the lexicon. Worry about the geometry. Ask yourself: In this argument, where is the ground? Is there a level that claims to be untouched by the levels below it? If so, who is drawing it?

  I want to be precise about what I am asking. I am not calling for a vague spirit of collaboration. I am asking us to accept a specific limitation. We cannot solve the problem of the inviolate level by appealing to a discipline outside the loop, because there is no outside. We must work within the tension.

  I conclude with a confession. I have studied the feedback loops of evolution for three decades. I can show you the data where the organism constructs the niche. But I do not yet understand the logic of the loop itself. I am learning philosophy late in life, and I find myself unsure where the explanation ends and the justification begins. I do not know if the gene is a verb or a noun in this sentence. I do not know if the environment is a context or a cause.

  I offer this ignorance not as an apology, but as a structural frame. If I, with my data, and you, with your frameworks, cannot find the bottom hand, then perhaps there is no bottom hand. Perhaps there is only the drawing.

  Let us begin.
