answer: |-
  This is a compelling framework. You are right to sense that the standard "many-worlds" reading of Borges domesticates his idealism into a genre convention. Your three-way distinction is not standard philosophy of time (which would likely map these onto A-theory/B-theory debates or Modal Realism vs. Actualism), but as a tool for *narratology* and *literary metaphysics*, it is doing real work. It distinguishes between the *mechanism* of the plot (diachronic), the *ontology* of the world (plenitude), and the *narrative resolution* (collapse).

  Here is an assessment of your distinction, its application to Borges, and the viability of using *Everything Everywhere All at Once* (EEAAO) as your case study.

  ### 1. The Distinction and Borges
  Your intuition regarding Borges is correct. The popular "many-worlds" reading of *The Garden of Forking Paths* treats Ts'ui Pên's labyrinth as a physical cosmology of branching futures. But Borges was an idealist, heavily influenced by Berkeley and Schopenhauer. For Borges, time is the primary delusion.

  *   **Diachronic Forking:** This is the "science fiction" reading. It preserves agency and the "open future." It is too kinetic for Borges. He is rarely interested in *becoming*; he is interested in *being*.
  *   **Co-actual Plenitude:** This is the strongest fit for Borges, particularly when read alongside *A New Refutation of Time*. If time is a delusion, then all moments exist simultaneously. The "forks" are not generated; they are perceived sequentially by a limited consciousness. This aligns with *The Aleph* and *The Zahir*. The horror/wonder of Borges is not that the future is open, but that the totality is already present and inescapable.
  *   **Retroactive Collapse:** This is your most vulnerable category philosophically, but your strongest narratologically. It describes the *effect* of the story on the reader. In *The Garden*, we read linearly, but the ending implies the text itself is the labyrinth where all outcomes coexist. The "collapse" is the act of closing the book.

  **Verdict:** Keep the distinction, but frame it as a taxonomy of *narrative temporalities* rather than strict metaphysics. "Retroactive collapse" is not a theory of time, but a theory of *reading*. This saves it from philosophical objection and makes it perfect for a volume on cinema (which is a temporal art form that constructs spatial totalities).

  ### 2. Application to EEAAO: The Bagel vs. The Garden
  You are right to identify the Everything Bagel as *The Aleph* rather than *The Garden*. The Garden implies a path; the Bagel implies a point. The Bagel is the spatialization of time.

  **The Nihilism Problem:**
  The nihilism of the Bagel is indeed the logical endpoint of *Co-actual Plenitude*. If every choice is made and every outcome realized, statistical significance evaporates. Joy (Jobu Tupaki) represents the Borges of *The Library of Babel* without the literary faith: the totality is meaningless noise.

  **Evelyn's Solution:**
  Is Evelyn's answer ("Be kind," "Choose to see the good") a sentimental evasion?
  *   **The Charge:** A hard metaphysician would say yes. If plenitude is true, privileging one strand is an arbitrary fiction.
  *   **The Defense:** Evelyn shifts the ground from *ontology* to *phenomenology*. She does not deny plenitude; she denies that ontological weight is a prerequisite for meaning. This is arguably more Borgesian than the nihilism. Borges often suggests that while the universe may be chaotic or infinite, the *human experience* of order (even if fictional) is the only site of value.
  *   **Coherence:** It is coherent *if* you accept that the film is an existentialist text wearing sci-fi clothing. It fails if you demand the physics hold up.

  **The Metaphysical Switch:**
  Does the film cheat? Yes. It relies on *Diachronic Forking* for the action sequences (Evelyn must *choose* to jump skills; there is stakes and risk) and *Co-actual Plenitude* for the emotional resolution (Waymond's "In another life, I would have really liked just doing laundry with you").
  *   **Critique:** An honest critic should note this. The film requires the *illusion* of diachronic choice to generate tension, but the *reality* of co-actual plenitude to generate reconciliation.
  *   **Is this a failure?** Not necessarily. This is exactly how Borges operates. His stories are often structured as linear mysteries that dissolve into timeless totalities. The "switch" is the genre mechanism.

  **The Scaffolding Objection:**
  Where does the reading fail? It fails if you treat the multiverse as a literal claim the film is making. The "honest critic" admission you proposed is vital: *The metaphysics are scaffolding for a mother-daughter reconciliation.* However, in a Borges context, this is not a demotion. For Borges, metaphysics *is* a branch of literature. If the film uses the multiverse to explore the burden of regret (the "what ifs" of parenting), it is using the metaphysics correctly, regardless of their internal consistency.

  ### 3. Central Scenes
  To anchor this essay, I would recommend these three scenes, mapped to your three temporalities:

  1.  **The Bagel Explanation (Co-actual Plenitude):** Joy shows Evelyn the Bagel. This is the *Aleph* moment. Everything is there. The visual representation of the Bagel (black hole consuming matter) represents the gravitational pull of total knowledge crushing the subject. This establishes the nihilistic threat of plenitude.
  2.  **The Hot Dog Fingers Universe (Retroactive Collapse/Narrative Reframing):** Evelyn and Waymond in the universe where hands are hot dogs. This is the pivot. It is absurd, yet they find tenderness. This scene enacts the "retroactive collapse" of meaning: the universe is ridiculous, but the *story* they tell within it (of love) gives it weight. It is the moment Evelyn stops trying to solve the metaphysics and starts living the narrative.
  3.  **The Parking Lot Fight (Diachronic Forking vs. Plenitude):** The final confrontation. Evelyn uses the skills of all universes (Plenitude) to fight, but she resolves it by refusing to fight in *this* universe (Diachronic Choice). She integrates the knowledge of the all into the action of the one. This is the synthesis: acting *as if* the future is open, while knowing *that* all outcomes exist.

  ### 4. What EEAAO Adds to the Borges Debate
  Borges is often criticized for being cold, intellectual, and detached. His labyrinths are mental. EEAAO adds **affect**.

  *   **The Emotional Cost of the Aleph:** Borges describes the Aleph as overwhelming; EEAAO dramatizes the *depression* that results from it. It answers the question Borges leaves open: How does a human being psychologically survive the knowledge of co-actual plenitude?
  *   **Agency in the Block Universe:** Borges often implies agency is an illusion. EEAAO argues that even in a block universe (or multiverse), the *local* experience of choice is the only place ethics can happen. It updates Borgesian idealism for a therapeutic age: we cannot change the totality, but we can change our focus.

  ### Summary Recommendation
  Your frame is sound, provided you clarify that your three categories describe *narrative modes* rather than competing physical theories.
  *   **Thesis:** EEAAO updates the Borgesian "Co-actual Plenitude" by rejecting the associated nihilism not through metaphysics, but through an ethical commitment to the "Diachronic" illusion.
  *   **Caveat:** Acknowledge the film's metaphysical inconsistency as a functional necessity of the melodrama genre.
  *   **Value:** The essay succeeds if it shows how the film "emotionalizes" the Aleph, turning a metaphysical curiosity into a tool for intergenerational healing.

  This approach allows you to honor Borges's complexity without forcing the film to be something it isn't, while still elevating the film above the standard "multiverse fatigue" critique.
