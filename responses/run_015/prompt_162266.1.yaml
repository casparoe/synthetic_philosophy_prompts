      *   *Critique:* The distinction is useful *heuristically* for literary analysis, even if philosophers of time might use different terms (e.g., A-theory vs. B-theory, Modal Realism vs. Actualism). "Retroactive collapse" is the weakest link philosophically but might be the strongest narratologically (how the story is *told*).
