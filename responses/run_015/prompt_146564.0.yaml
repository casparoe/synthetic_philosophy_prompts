answer: |-
  **Setting:** *An excavation trench in the Jordan Valley, mid-morning. The heat is rising off the exposed strata. ELIAS (Defender) and SARAH (Critic) are crouched over a patch of reddened earth, trowels resting on their knees.*

  **Elias:** Look at the oxidation here, Sarah. The vitrification of the soil matrix. It's undeniable. Here is a trace of human manufacture. Therefore, human agents existed in the past. Therefore, an external world independent of our current minds existed then.

  **Sarah:** I don't doubt the potters existed, Elias. I'm digging with you, aren't I? But you're trying to run a Moorean proof on a kiln scar. You're treating "Here is a trace of human manufacture" like Moore treated "Here is a hand."

  **Elias:** Why not? Moore's point was about epistemic priority. He argued that the proposition "Here is a hand" is more certain than any complex philosophical premise that might lead us to doubt the external world. Well, this discoloration is more certain than the skeptical hypothesis that this is merely a random mineral stain or a collective hallucination. The certainty of the trace guarantees the reality of the past object.

  **Sarah:** But that's where the analogy fractures. When Moore held up his hand, the premise "Here is a hand" was a direct perceptual report. It didn't require a theory of biology or optics to accept. But to call this discoloration a "trace of human manufacture" isn't a raw observation. It's a classification. You are already embedding the conclusion—that humans acted here—into the premise.

  **Elias:** I'm not embedding it; I'm recognizing it. Just as I recognize a hand.

  **Sarah:** No. To recognize a hand is immediate. To recognize a kiln scar requires a framework: knowledge of firing temperatures, soil chemistry, and reduction environments. If a skeptic challenged you, asking, "How do you know that isn't a natural iron oxidation?", you couldn't just point. You'd have to invoke the very theories that assume the existence of the external objects you're trying to prove. You're begging the question. The "trace" only exists *as a trace* within the interpretive framework you're trying to validate.

  **Elias:** You're conflating the *explanation* of the evidence with the *existence* of the evidence. Look, I grant you that identifying this as a "kiln scar" involves concepts. But Moore wasn't claiming his proof was concept-free. He was claiming that the *credibility* of the premise outweighs the credibility of the skeptical alternative. Isn't it more rational to trust the stratigraphy and the vitrification than to suspect that the entire history of technology is a dream?

  **Sarah:** For present objects, maybe. But this brings us to the asymmetry. Moore's proof relies on the immediacy of present perception. "Here is a hand" is happening *now*. Your claim is about the *past*. You are inferring a cause from an effect. The epistemic gap between "reddened soil now" and "fired vessel then" is bridged by abduction, not perception. Moore's proof claims universality, but if it only works for present perceptual objects, it fails as a general proof against skepticism about the past. If the proof depends on the type of object, it isn't a proof of the external world *simpliciter*; it's a proof of the present perceptual world.

  **Elias:** That is a sharp distinction. You're saying Moore's logic holds for the hand because the hand is present to the senses, but it collapses for the pot because the pot is absent, reconstructed via theory.

  **Sarah:** Precisely. If you say "Here is a hand," the skeptic must doubt your senses. If you say "Here is a past cause," the skeptic only has to doubt your inference. The latter is much easier to doubt without abandoning common sense. So, your premise isn't more certain than the skeptical alternative. It's actually less certain, because it carries the baggage of historical interpretation.

  **Elias:** I see the force of that. If I stick to Moore's original formulation—pure perceptual certainty—I lose the archaeological case. But I don't think we need to abandon the Moorean spirit, only revise the locus of certainty.

  **Sarah:** How so?

  **Elias:** Moore located certainty in the *perceptual moment*. I'm arguing we should locate it in the *methodological practice*. Consider this: Is it more certain that "this soil pattern is a random stain" or that "our established methods of distinguishing stains from kiln scars are generally reliable"?

  **Sarah:** The latter, obviously. But that shifts the argument from "Here is a trace" to "Our methods work."

  **Elias:** Exactly. And that is the revision required. Moore's proof succeeds in archaeology not because the artifact is as immediately given as the hand, but because the *practice of identification* is more certain than the *hypothesis of global error*. You charged me with circularity, saying I assume human agency to prove human agency. But I'm not assuming a specific agent; I'm assuming the validity of the discriminative practice.

  **Sarah:** So you're conceding the asymmetry? The hand is known by perception; the pot is known by the reliability of a reconstructive framework?

  **Elias:** I am. And I'm arguing that this doesn't undermine the proof; it universalizes it correctly. Moore was right that we must start with what is most certain. For the present, that is perception. For the past, that is the coherence of material inference. If I deny that this is a kiln scar, I don't just doubt the pot; I undermine the entire logic of excavation that allows me to stand here and talk to you. The skepticism is more costly than the belief.

  **Sarah:** So you're modifying Moore. You're saying the proof holds, but the "premise" isn't a raw sense datum. It's a warranted assertion within a successful practice.

  **Elias:** Yes. The circularity you fear isn't vicious; it's the hermeneutic circle of all understanding. We understand the part (the scar) through the whole (human history), and the whole through the part. Moore tried to bypass the circle with the hand. We can't bypass it with the pot, but we can stand firmly inside it. The argument succeeds, provided we admit that "Here is a trace" is shorthand for "Here is a result of a reliable process."

  **Sarah:** If you make that revision, I'll accept it. You save the Moorean intuition—that common sense beats skepticism—by admitting that in archaeology, "common sense" is actually "expert consensus grounded in material efficacy." You lose the immediacy of the hand, but you keep the epistemic priority.

  **Elias:** Then we agree. The external world of the past exists, not because I see it like a hand, but because denying it costs more than accepting it.

  **Sarah:** Pass me the trowel, then. Let's prove it exists a bit more.

  ***

  **Position Statement:**

  A modified Moorean argument **succeeds** in the archaeological case, but only if it undergoes a specific revision regarding the source of epistemic priority.

  1.  **The Failure of the Strict Analogy:** The original Moorean structure fails if applied strictly to archaeological objects because of the **asymmetry between present perception and past reconstruction**. As the critic noted, "Here is a hand" is a perceptual report, whereas "Here is a kiln scar" is an abductive inference. Treating them identically ignores the theoretical framework required to identify historical traces, leaving the argument vulnerable to charges of circularity (begging the question by embedding the conclusion in the premise).
  2.  **The Required Revision:** The argument succeeds only if the locus of certainty shifts from **perceptual immediacy** to **methodological reliability**. The Defender's final move is the correct philosophical position: the premise "This is a trace" should be understood as "This is a result of a reliable discriminative practice."
  3.  **Justification:** Skepticism about the past external world is defeated not by claiming historical objects are perceived like present ones, but by demonstrating that the *practice* of reconstructing the past is more certain than the *hypothesis* that such reconstruction is universally flawed. Moore's core insight—that we should reject skeptical hypotheses that are less credible than our basic convictions—remains valid, provided "basic convictions" in history are understood as warranted methodological commitments rather than raw sense data.
