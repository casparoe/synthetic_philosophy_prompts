  ### Audit of Commitments

  You have built a hybrid view: **Teleosemantics** (C3) grafted onto **Computational Functionalism** (C4/C6), constrained by **Engineering Realism** (C1/C5). This works intuitively but breaks formally. Here is the breakdown.

  #### 1. Equivocations (Terms used in two senses)
  *   **"Function"**: In C1/C4, you use this in the *causal role* sense (what the state computes now). In C3, you use it in the *selected effect* sense (what the state was historically rewarded for). These come apart when a state retains a causal role after the selection pressure changes (or when the selection pressure was messy).
  *   **"History"**: In C3, you mean the *causal process* of training (the gradient descent trajectory). In C4, you mean the *information encoded* in weights ("baked into the file"). C3 requires the process; C4 requires only the product.

  #### 2. Genuine Conflicts (Ranked by Severity)

  **Rank 1: C3 (Selection History) vs. C4 (Current State Supervenience)**
  *   **Mechanism:** This is the **Swampman Problem**. C3 ties content to the *actual causal history* of selection (the specific training run). C4 ties content to the *current weight snapshot*. If you load a checkpoint onto a new cluster (or a competitor downloads your weights), C4 says content is identical. Strict C3 says content is lost because the *new* instance lacks the *original* selection history.
  *   **Engineering Term:** **Training Run ID vs. Model Artifact.** C3 makes meaning depend on the Training Run ID. C4 makes meaning depend on the Model Artifact. You cannot reload a checkpoint without altering the causal history of the new instance.
  *   **Severity:** Critical. It undermines the metaphysical status of your checkpoints. If C3 is true, every time you spin up a fresh container from weights, you create a semantic zombie until it accumulates its own history.

  **Rank 2: C3 (Selection History) vs. C2/C5 (Disjunction & Determinacy)**
  *   **Mechanism:** This is the **Indeterminacy Problem**. C3 fixes content by "what it was selected for." In deep learning, selection is diffuse; multiple features often co-contribute to loss reduction. If a state fires for "Refund" and "Annoyed," and *both* correlated with reward during training, C3 says the content is disjunctive ("Refund OR Annoyed"). This violates C2 (cannot define error) and C5 (lacks determinacy for evals).
  *   **Engineering Term:** **Loss Coupling.** If the loss function doesn't explicitly disentangle features, the "selection history" validates all correlated features equally. You lose the ability to call a firing an "error" if it helped minimize loss during training.
  *   **Severity:** High. It breaks your eval harness. You cannot define false positives if the training history validates both positives and false positives.

  **Rank 3: C3 (Selection History) vs. C6 (Probes)**
  *   **Mechanism:** Probes measure *correlation* (indicator semantics). C3 measures *function*. If a state was selected for X but correlates with Y (spurious correlation), probes identify Y while teleosemantics identifies X.
  *   **Engineering Term:** **Distributional Shift.** Probes work on test data; teleosemantics looks at training dynamics. They diverge when the model generalizes poorly.
  *   **Severity:** Medium. Affects interpretability reliability, but doesn't break the system.

  #### 3. Concrete Case Analysis
  **Case:** A state fires for "genuine refund" and "merely annoyed." Both patterns reduced loss during training.

  *   **Under your current commitments (C3 + History):**
      *   **Content:** "Refund OR Annoyance." Both features were selected for because both reduced loss.
      *   **Error Condition:** None. Firing for "Annoyance" is not a mistake; it is fulfilling part of the selected function.
      *   **Result:** You violate C2 (cannot distinguish error) and C5 (no determinate fact for evals). Your eval harness is metaphysically groundless here.

  *   **Under revised commitments (Dropping strict History):**
      *   **Content:** "Refund." Defined by the *objective function intent* (handle refunds), not the statistical regularities of the training data (annoyance correlation).
      *   **Error Condition:** Firing for "Annoyance" without "Refund" is an error because it fails the *objective*, even if it succeeded during training.
      *   **Result:** Preserves C2, C4, and C5.

  #### 4. Recommendation
  **Revise C3.**
  Your infra work (C4, C5) requires content to supervene on the artifact and be determinate. Standard teleosemantics (C3) requires actual history and tolerates indeterminacy. You are using "teleosemantics" as a shorthand for "objective-driven function," but the historical component is doing harmful work.

  *   **Cheapest Revision:** Replace "selection history" with "objective function structure." Treat the *design intent* of the loss function as the fixer of content, not the statistical history of what actually reduced loss.
  *   **Cost:** You lose the "biological naturalism" purity of standard teleosemantics (which relies on actual history). You gain a view compatible with checkpointing and evals. This hurts philosophically (less standard theory) but helps on the day job (evals work).

  \answer{3 — Function fixed by objective not history}
