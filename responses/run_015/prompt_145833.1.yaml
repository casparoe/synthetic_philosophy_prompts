  **ONTIC SHIELD UNDERWRITERS LTD.**
  **POLICY DOCUMENT 74-B: DISPOSITIONAL LIABILITY COVERAGE**

  **1. DEFINITION OF INSURED PROPERTY**
  1.1. The "Insured Disposition" (hereinafter "Fragility") is defined not merely as the conditional truth that the Object would break if struck, but as the intrinsic causal basis persisting within the Object prior to stimulus.
  1.2. Coverage applies only where the Object retains the capacity to break throughout the duration of the impact event. Policies do not cover Objects that lose said capacity precisely at the moment of impact, even if such loss is instantaneous and undetectable to the naked eye.
  1.3. Coverage is void if the Object is wrapped in packing material, foam, or protective shielding that prevents the manifestation of breakage without removing the underlying capacity. The Company distinguishes between prevention of outcome and removal of power; only the latter is indemnified.

  **2. EXCLUSIONS AND INTERFERENCES**
  2.1. **Finkish Exclusion:** No claim shall be paid where a guardian device, sorcerer, or intrinsic mechanism removes the fragility of the Object immediately upon the striking stimulus being applied. If the Object ceases to be fragile the moment it is hit, it was not fragile at the time of loss.
  2.2. **Mimic Exclusion:** No claim shall be paid where a non-fragile Object acquires fragility solely at the moment of impact due to external gadgetry. The causal basis must exist prior to the stimulus.
  2.3. **The Regress of Conditions:** The Company reserves the right to add iterative exemption clauses regarding "normal conditions," "standard atmosphere," and "absence of interference." The Policyholder acknowledges that every added condition may require further conditioning to account for exceptional cases, potentially resulting in an infinite annex of amendments.
  2.4. **Permanently Packed Objects:** Objects manufactured inside sealed foam containers, wherein the stimulus of striking is physically impossible to apply without first removing the packing, are deemed to have no assessable risk profile. If the Object cannot be struck, it cannot be proven fragile; if it cannot be proven fragile, it cannot be insured.

  **3. BASIS OF COVERAGE: JURISDICTIONAL CONFLICT**
  3.1. **Powers Division:** Policies underwritten by the Powers Division treat Fragility as a real, irreducible property distinct from physical structure. Premiums are calculated based on the potency of the power.
  3.2. **Microstructure Compliance:** Policies underwritten by Microstructure Compliance treat Fragility as nothing over and above the molecular lattice arrangement. Premiums are calculated based on atomic bond strength.
  3.3. In the event of a conflict between Divisions regarding whether the property is real or reducible, coverage is suspended pending a metaphysical tribunal. The Policyholder bears the cost of ontological arbitration.

  **4. CLAIMS ADJUDICATION**
  4.1. **Verification Protocol:** To adjudicate a claim, the Claims Department must verify that the Object was indeed fragile at the time of the incident.
  4.2. **Destruction Clause:** Verification requires the manifestation of the disposition (i.e., the Object must break).
  4.3. **Value Nullification:** Upon breaking, the Object loses all market value. Since the Company insures the value of the Object contingent on its Fragility, and the proof of Fragility destroys the Object, the payout value is necessarily zero.
  4.4. Consequently, the Claims Department is structurally unable to distinguish between a masked breakage and a finkish removal, as both result in either an unbroken Object (no claim) or a broken Object (no value). All claims are hereby filed indefinitely under "Pending Ontological Verification."

  **5. PREMIUM SCHEDULE**
  *   **Standard Conditional Risk:** 15% of Object Value per annum.
  *   **Intrinsic Basis Coverage (Powers Division):** 25% of Object Value per annum.
  *   **Microstructural Reduction (Compliance Dept):** 10% of Object Value per annum.
  *   **Ceteris Paribus Rider:** Additional 50% surcharge (covers "all other things being equal" exceptions).
  *   **Anti-Fink Shielding:** Unavailable.

  **6. STATEMENT FROM THE CHIEF ACTUARY FOR METAPHYSICAL RISK**
  *"We operate on the principle that a disposition is what a disposition does, unless what it does is prevented by something that doesn't remove it, in which case it is what it would have done had the preventer not been there, provided the preventer wasn't actually part of the object's intrinsic structure. Ultimately, risk is merely the shadow of a modal truth we cannot observe without collapsing the wave function of the vase. Please sign here to acknowledge that nothing actually changes when something breaks."*

  **ACCEPTANCE OF TERMS**
  By signing below, the Policyholder agrees that Fragility is either a robust causal power or a logical construct, but definitely not both, and waives the right to sue for damages resulting from categorical indeterminacy.

  __________________________
