answer: |-
  ### What I think you're pointing at

  You are describing the metaphysical problem of **totality**. Specifically, you are isolating the difference between a set of facts obtaining and the claim that *only* those facts obtain. This isn't about the content of the base (the ingredients), but about the boundary of the domain (the recipe's completeness). You are noticing that grounding chains require a closure condition to prevent "ontological free lunch" scenarios where extra, ungrounded junk slips in. This is the transition from "X grounds Y" to "X is *all* that grounds Y."

  ### Candidates and where each falls short

  I considered four candidates before settling. 

  First, **Totality Facts** (standard term, Armstrong/Russell). These are facts stating "these are all the first-order facts." They fit your "inventory" case perfectly. *Shortcoming:* Standard literature often treats these as *brute* fundamental facts. You intuit they depend on the base collectively, which creates tension with the standard view that totality facts are sui generis additions to the base.

  Second, **Negative Existentials** (Logic/Ontology). "There are no unicorns." This fits your test (broken by adding, not tweaking). *Shortcoming:* As you suspected, this feels like a "trenchcoat." Ordinary negative existentials are local ("no unicorns *here*"). Your phenomenon is global ("no entities *at all* beyond these"). Reducing it to simple negation loses the structural role it plays in grounding chains.

  Third, **Closure Axioms** (Philosophy of Mathematics). Your number case ("nothing else is a number") is exactly the axiom of induction minimality. *Shortcoming:* This risks treating metaphysics like formal systems. Reality might not have axioms; it just *is*. Using this term suggests the phenomenon is linguistic or conceptual rather than ontological.

  Fourth, **Second-Order Facts** (Logic/Metaphysics). Facts about facts. *Shortcoming:* As you noted, this usually implies properties of properties (e.g., "being grounded is hereditary"). Your phenomenon is about the *extension* of the base, not the properties of the grounding relation itself. It quantifies over the domain, not the predicates.

  ### One thing or two

  I argue this is **one phenomenon** viewed from different directions. The downward-looking claim ("nothing below this") and the upward-looking claim ("everything above is accounted for") are symmetrical constraints on the same boundary. 

  Consider the "inventory" case: saying "only these are fundamental" is logically equivalent to saying "everything non-fundamental is grounded." They are the same closure condition applied to different sides of the grounding relation. 

  Regarding the top of the hierarchy: Yes, there is a counterpart. A fact like "nothing is built out of these fundamentals" is simply the totality fact for the derivative layer. It asserts the derivative domain is closed by the base. Whether we call it "fundamentality" or "completeness," the logical shape is identical: it asserts that the relation between layers is exhaustive, not just partial. The metaphysical work being done—blocking ontological surplus—is the same.

  ### Your test, stress-tested

  Your test ("broken by adding, not tweaking") is robust. It correctly identifies that these facts are sensitive to the *scope* of the domain, not the *quality* of the members. If you tweak a fundamental particle, the totality fact remains (it's still the totality of *those* particles). If you add a particle, the totality fact fails.

  However, your worry about negative existentials is partially justified. A totality fact *is* a global negative existential. It says, "There does not exist an x such that x is not in this set." The distinction lies in scope. "No unicorns" is compatible with extra dragons. "Nothing else exists" is not. Your test captures this because adding a dragon breaks "no unicorns" (if dragons count as unicorns in your model) or breaks "nothing else exists." The nuance is that totality facts are *maximally* general negative existentials. They are not just about absent kinds, but about the limit of being itself.

  ### The name I'd use, defined, with two boundary cases

  Since "Totality Fact" often implies bruteness in the literature, and you want to capture the *dependence* on the base, I coin the term: **Collective Exhaustion Fact**.

  **Definition:** A fact that holds in virtue of the totality of a specific base, asserting that no further items of the relevant kind exist beyond that base. It depends collectively on the base, not on any specific member.

  **Boundary Case (Inside):** "These ten particles are all the fundamental entities." (Depends on all ten collectively; adding an eleventh falsifies it).
  **Boundary Case (Outside):** "This box contains no apples." (This is a local negative existential. It does not exhaust the domain of reality, only a specific region. It is not a Collective Exhaustion Fact).

  ### Where I'd expect to be corrected

  I am fairly confident "Totality Fact" is the standard label you'll encounter in reading groups (Armstrong, D.M. Armstrong, *Universals and Scientific Realism*). I expect a specialist to push back hardest on my claim that these facts *depend* on the base. 

  Many grounding theorists (e.g., Fine) might argue that totality facts are themselves fundamental brute posits required to make grounding work, not derivative facts generated by the base. They might say you cannot derive "only X exists" from "X exists" without already presupposing a closure rule. 

  Additionally, deflationists might argue this is merely a feature of our quantificational logic (the domain of discourse), not a metaphysical fact about reality. If you treat the domain as fixed, the "that's-all" clause disappears. I would expect correction on whether this is a feature of the world or a feature of our description of the world.
