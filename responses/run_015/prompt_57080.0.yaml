answer: |-
  Here is the 70-minute plan. It is designed to weaponize your audience's biases against each other to create the philosophical tension, rather than letting them settle into comfort zones.

  ### I. Session Architecture (70 Minutes)

  **0:00–0:10: The Setup & The Cuts**
  *   **Action:** State the goal immediately. "We are looking at two friends who became enemies over what 'truth' means."
  *   **The Cuts (Say this out loud):** "To make this fit, I am cutting three things. I am cutting John Dewey entirely. I am cutting Peirce's technical logic (his categories and sign theory). I am cutting James's metaphysics (radical empiricism). We are doing this because we are focusing on one specific argument: **Is truth what works, or is truth what survives investigation?**"
  *   **Dependency:** This clears the weeds so the Landscaper can't hide behind 'holistic systems' and the Engineer can't hide behind 'technical logic.'

  **0:10–0:25: Peirce's Foundation (Meaning before Truth)**
  *   **Concept:** Belief is not a picture in the head; it is a **rule for action** (a habit).
  *   **Peirce's Maxim:** To understand what a concept *means*, look at the practical effects of acting on it.
  *   **Crucial Order:** You must establish Peirce's Maxim *before* introducing James.
      *   *Why:* Peirce intended the Maxim as a tool for clarifying *meaning*, not defining *truth*. If you start with James, the Landscaper wins immediately ("Truth is what works"). If you start with Peirce, you establish a rigorous standard for *what we are even talking about*.
  *   **Audience Management:** When the Engineer says "Truth is correspondence to reality," reply: "Peirce agrees, but asks: How do you *act* differently if you believe it corresponds? If there's no difference in action, there's no difference in meaning."

  **0:25–0:40: The Core Example (The Stress Test)**
  *   **Action:** Run the scenario (details below).
  *   **Goal:** Force a wedge between "useful right now" and "true in the long run."
  *   **Dependency:** This depends on the "Belief as Habit" setup. The example must show a habit that succeeds temporarily but fails ultimately.

  **0:40–0:55: James's Shift (From Meaning to Truth)**
  *   **Concept:** James takes Peirce's Maxim and applies it to *Truth* itself. "The True is only the expedient in our way of thinking." (Cash Value).
  *   **The Conflict:** James says if a belief guides you successfully *through your experience*, it is true. Peirce says that is just "expedient," not necessarily true.
  *   **Load-Bearing Concept:** **Peirce's "End of Inquiry."**
      *   *Status:* **Load-bearing.** Do not cut this. Without it, Peirce collapses into James.
      *   *Explanation:* Truth is not what works for *me* today. It is what the community of investigators would agree on *forever*.
      *   *Audience Management:* When the Landscaper says "It works for me," use Peirce's "End of Inquiry" to say: "It works for you *until* the bridge falls down. Peirce cares about the fall."

  **0:55–0:65: The Clash (Peirce's Complaint)**
  *   **Action:** Explicitly state Peirce's grievance. He renamed his philosophy "Pragmaticism" (ugly enough to be safe from kidnappers) because James turned a logical rule (Maxim) into a theory of truth (Cash Value).
  *   **Discussion:** Ask the room: Did James break the tool, or did he improve it?
  *   **Dependency:** This depends on the "End of Inquiry" distinction. If they don't grasp that Peirce requires *future consensus*, they won't understand the complaint.

  **0:65–0:70: The Final Question**
  *   **Action:** Pose the assessment question (see below). No new talking. Just listen to the answers.

  ---

  ### II. The Core Example: "The Benign Diagnosis"

  Do not use the squirrel. Do not use a bridge (too close to the Engineer's domain). Use the nurses' domain.

  **The Scenario:**
  A patient presents with ambiguous symptoms. A doctor, wanting to spare the patient stress during a critical family week, says: "It's benign. Go home, relax."
  *   **The Belief:** "I am healthy."
  *   **The Action:** The patient relaxes, blood pressure drops, they enjoy the family week, no panic attacks.
  *   **The Outcome (Short Term):** The belief "worked." It produced tangible, good physiological effects (Cash Value).
  *   **The Outcome (Long Term):** Six months later, the patient collapses. It was malignant. The delay caused by the "benign" belief leads to a worse outcome.

  **What this example MUST have:**
  1.  **Temporal Delay:** The "working" must happen *before* the "failing." This separates James (truth is the successful leading) from Peirce (truth is the final destination).
  2.  **Genuine Utility:** The belief must actually produce a good effect (stress reduction), not just be a neutral error. This prevents the Engineer from dismissing it as "just a mistake."
  3.  **Community Verification:** The final diagnosis (malignant) must come from an objective test (biopsy/autopsy), representing Peirce's "community of inquiry."

  **What this example MUST NOT have:**
  1.  **Moral Judgment:** Do not frame the doctor as "evil." Frame it as a clinical judgment. This prevents the conversation from becoming about ethics ("Is lying okay?") rather than epistemology ("Is it true?").
  2.  **Immediate Failure:** If the patient dies immediately, James looks obviously wrong. The belief must sustain the patient for a meaningful time to make James's position plausible.

  ---

  ### III. Misconception Map

  | Misconception | Who brings it? | When it emerges | How/When to head it off |
  | :--- | :--- | :--- | :--- |
  | **"Truth is whatever works for you."** (Relativism) | Landscaper | Min 5 (Intro) | **Head off at Min 10.** When introducing Peirce, emphasize the **Community**. "Peirce says 'works for you' is just vanity. Truth is what works for *everyone* eventually." |
  | **"Usefulness is irrelevant to Truth."** (Correspondence) | Engineer | Min 15 (Maxim) | **Head off at Min 20.** Validate them. "Peirce agrees reality is real. But asks: How do you *access* it? Only through action." |
  | **"So lying is fine if it helps?"** (Moral Relativism) | Anyone | Min 45 (James) | **Head off at Min 48.** Clarify James. "James isn't talking about telling lies to others. He's talking about what beliefs you can sustain in your own head without psychological collapse." |
  | **"Science will eventually solve everything."** (Positivism) | Engineer | Min 55 (End of Inquiry) | **Head off at Min 58.** Clarify Peirce. "The 'End of Inquiry' is an *ideal limit*, like a horizon. It regulates us; it doesn't guarantee we get there tomorrow." |
  | **"James is just an optimist."** (Psychologizing) | Anyone | Min 60 (The Clash) | **Head off at Min 62.** Reframe. "It's not optimism. It's a claim that truth is *made* in the process of living, not just found sitting in a rock." |

  ---

  ### IV. The Final Question (Last 5 Minutes)

  Do not ask "Do you understand?" Ask them to apply the distinction.

  **The Question:**
  > "Peirce accused James of taking a rule for **clarifying meaning** and secretly turning it into a definition of **truth**. Looking at our medical example: If the 'benign' belief kept the patient alive and happy for five years, but was ultimately wrong—did that belief have **Cash Value** (James), and was it **True** (Peirce)? Can those two answers be different?"

  **What to listen for:**
  *   **Success:** They say "Yes, it had value, but it wasn't true." (They grasp the split).
  *   **Failure:** They say "If it kept him alive, it was true." (They are with James). OR "It was useless because he died." (They are with the Engineer).

  ---

  ### V. What to Cut (Explicit Instructions)

  You requested a list of what to remove to save time. **Announce this at the start (Min 0:05).** It builds trust that you respect their time.

  1.  **Dewey:** "We are leaving out the third major pragmatist, John Dewey. He tries to synthesize these two, but today we want to see the fight, not the peace treaty."
  2.  **Peirce's Semiotics:** "Peirce wrote thousands of pages on signs and categories. We are ignoring all of that. We only care about his definition of belief."
  3.  **Radical Empiricism:** "James has a whole metaphysical system about 'pure experience.' We are ignoring that. We are only looking at his theory of truth."
  4.  **Reading List:** "There is no reading. The text is the argument we have in this room."

  ### VI. Facilitator Notes on Dependencies

  *   **Belief as Habit (Min 10) is the foundation.** If they don't accept that a belief is a *disposition to act*, Peirce's Maxim makes no sense. Check this. Ask the Engineer: "If you believe the floor is solid, what do you do?" (Walk on it). "That walking *is* the belief."
  *   **Peirce's Maxim (Min 15) depends on Habit.** Once belief is action, the Maxim asks "What action does this concept dictate?"
  *   **James's Cash Value (Min 40) depends on the Maxim.** James asks "Okay, if meaning is action, isn't Truth just the *success* of that action?"
  *   **End of Inquiry (Min 50) depends on James.** It is the specific counter-move to James. "Success now isn't enough. It must succeed *forever*."

  If you lose the room on "Habit," stop and reset. Nothing else works without it. If they grasp "Habit," the rest follows logically.
