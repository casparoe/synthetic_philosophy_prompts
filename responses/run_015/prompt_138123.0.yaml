answer: |-
  The break in your argument is in premise (3). You should reject the claim that small differences in capacities can *only* produce small differences in moral weight. While biological traits often vary along a smooth continuum, moral significance frequently tracks threshold capacities rather than gradual ones. For example, the capacity for autonomy, self-conception, or understanding one's own future might function like a light switch rather than a dimmer; you either possess the cognitive architecture to hold these concepts or you do not. If moral standing depends on these qualitative thresholds, then a tiny biological difference could indeed mark the transition from having no such capacity to having it, creating a significant jump in moral status without violating your commitment to individual capacities over species membership.

  Rejecting (3) costs you the comforting idea that morality must always be smooth and continuous. You are committed to defending a "moral cliff," which invites the objection that you are performing "moral magic" by claiming a microscopic change in brain structure creates a massive change in value. To pay this cost without sliding back into speciesism, you must identify the specific capacity that triggers the threshold and argue that it is genuinely binary, even if the underlying biology is gradual. You cannot simply say "humans have it and fish don't"; you must explain *what* "it" is—such as the ability to conceive of oneself as existing over time—and show why that specific trait justifies the discontinuity.

  There is no reading of (3) that allows it to survive while (4) fails, because (4) follows logically from (1), (2), and (3). If you keep (3), you must accept (4) or deny the empirical claim in (2). If you accept the cliff by rejecting (3), you are not committed to speciesism, provided the line is drawn at the capacity itself rather than the species label. You are only committed to the view that moral categories do not always mirror biological gradients. This allows you to maintain that a person's suffering matters more than a fish's because of the richer cognitive context of human pain, without claiming that species membership alone does the work.
