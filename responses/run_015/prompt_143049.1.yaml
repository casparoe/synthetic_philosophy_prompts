      *   Total: ~1500. (I will write and then trim/expand to fit).

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Community Safety and Licensing Committee
  **FROM:** Policy Analyst
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Adult-Services Licensing Bylaw Framework

  **BOTTOM LINE**

  I recommend the Committee adopt a **Safety-First Licensing Framework** that decouples business licensing from public registration, maintains zoning dispersal, and formally requests Provincial action on purchase penalties. This approach prioritizes harm mitigation and public order over the reduction of trade incidence. It accommodates the worker-owned collective's safety requirements (panic systems, shared reception) without mandating public identification, satisfying privacy concerns while adhering to municipal authority.

  **Reasoning:** The City lacks jurisdiction to criminalize purchase or third-party involvement; these require Provincial action. A municipal registry creates documented risks for workers (outing, immigration, employment) that deter engagement with safety bylaws, thereby increasing public health risks. Zoning dispersal addresses the Police Chief's priority regarding residential streets without prohibiting indoor safety consolidation.

  **Strongest Consideration Against:** This framework creates a regulatory asymmetry: it treats selling as a regulated business activity while requesting the Province treat buying as a penalizable offence. Critics may argue this contradicts the logic of full decriminalisation (which views purchase as a consensual transaction) or the Nordic model (which views selling as exploitation requiring exit services, not licensing). If the assumption that "licensing reduces violence" proves false, this model retains the stigma of regulation without achieving the safety benefits of full decriminalisation or the abolitionist goals of the Nordic model.

  **PURPOSE CLAUSE**

  The bylaw must explicitly state its objective. The Committee is split on whether the incidence of sex work is itself the harm. To resolve this, the Purpose Clause should read: *"The purpose of this bylaw is to establish minimum safety and zoning standards for adult-service premises to mitigate public nuisance and physical harm, without regard to the reduction or expansion of trade incidence."*

  This designates the City's aim as **governing conditions**, not reducing incidence. This allows the Nordic bloc to support safety measures while advocating for Provincial demand-reduction, and allows the Decriminalisation bloc to support safety measures without endorsing moral prohibition.

  **UNBUNDLED RECOMMENDATIONS**

  The Committee has treated buyers, sellers, third parties, and advertising as a package. They must be unbundled to match legal authority and policy goals.

  | Actor/Element | Recommended Tool | Justification |
  | :--- | :--- | :--- |
  | **Buyers** | **Request Provincial Penalty** | The City cannot criminalize purchase. To respect the Nordic position, Council should request the Attorney General enforce purchase penalties. **Assumption:** Penalizing buyers reduces demand without displacing violence to sellers. **If False:** If enforcement drives trade underground increasing seller risk, the City should cease advocating for purchase penalties. |
  | **Sellers** | **Municipal Licensing (Confidential)** | Licensing allows safety inspections (panic buttons, hygiene). Registration will be **confidential** (accessible only to enforcement, not public) to address the Collective's submission regarding outing and immigration risks. **Assumption:** Workers will engage with licensing if privacy is guaranteed. **If False:** If uptake remains low, move to full decriminalisation (no license required). |
  | **Third Parties** | **Conditional Licensing** | Worker-owned collectives (like the applicant) are permitted. Exploitative third-party management is prohibited. This distinguishes between cooperative safety infrastructure and predatory pimping. |
  | **Advertising** | **Municipal Inaction / Zoning** | Content regulation is Federal/Provincial. The City will regulate physical signage via zoning (no signage in residential zones) to satisfy the Police Chief's concern regarding neighborhood character. |

  **ASYMMETRY AND SELLER STANDING**

  This recommendation requires honest engagement with the asymmetry of penalizing purchase while shielding sellers. If we ask the Province to penalize buyers, we implicitly accept the premise that the transaction is harmful. However, by shielding sellers from municipal penalty and licensing them, we treat them as competent agents capable of managing risk.

  Does this contradict the sellers' own testimony? The Collective's submission argues they are business owners requiring safety infrastructure, not victims requiring rescue. A strict Nordic interpretation would view their testimony as "false consciousness." However, the City's rationale here is **jurisdictional pragmatism**, not moral endorsement. We shield sellers not because the trade is harmless, but because criminalizing sellers demonstrably reduces their willingness to cooperate with police and safety inspectors, thereby increasing municipal liability and public risk.

  We must accept the Collective's testimony regarding their safety needs (panic buttons, blacklists) as valid data, even if we simultaneously ask the Province to discourage their clients. To do otherwise—to license their premises while publicly registering their names—would render the license useless by exposing them to the very harms (outing, employment discrimination) they seek to mitigate.

  **CONSISTENCY CHECK**

  We must apply this rationale to adjacent cases to ensure logical coherence.
  *   **Paid Surrogacy / Adult Film:** Under a "govern conditions" purpose, these are permitted provided safety/contract standards are met. Under a "reduce incidence" purpose, they should be prohibited. Our recommendation permits them, consistent with a harm-reduction model.
  *   **Strip Clubs:** Currently licensed under similar "adult entertainment" premises rules. This bylaw aligns sex work with existing strip-club zoning (dispersal, no residential spill).
  *   **Intimate Care Work:** Paid care involving touching is regulated via professional licensing, not criminal law. If our rationale is that *selling intimacy* is inherently harmful, care work should face similar stigma. Since it does not, we must distinguish based on **sexual explicitness** or **social nuisance**. This bylaw chooses **nuisance and safety** as the distinguishing factor, not the nature of the intimacy. This result is acceptable provided zoning protects residential quietude.

  **SUNSET AND REVIEW CLAUSE**

  Given the disagreement on what constitutes success, a three-year sunset clause is required. The review will measure the following metrics, with interpretations acknowledged as contested:

  1.  **Reports of Violence:** A decline is success for all camps (Nordic: less trade; Decrim: safer trade; Legalisation: better compliance).
  2.  **Residential Complaints:** A decline is success for the Police Chief and Neighborhood advocates.
  3.  **License Uptake:** An increase is success for Decriminalisation/Legalisation (engagement); a decrease may be success for Nordic (exit from trade) or failure (underground market).
  4.  **Number of Sellers:** A measured decline in known sellers is **ambiguous**.
      *   *Nordic Interpretation:* Success (reduction of harm source).
      *   *Decrim Interpretation:* Failure (economic displacement/loss of livelihood).
      *   *Recommendation:* This metric will be recorded but will not trigger automatic policy reversal. It must be weighed against Violence Reports. If seller numbers drop but violence reports rise, the policy is failing.

  **MOTION LANGUAGE**

  "That Council receive this memo for information; that Council direct staff to draft a new Adult-Services Licensing Bylaw based on the 'Safety-First Licensing Framework' outlined herein, specifically including confidential registration and zoning dispersal; and that Council write to the Provincial Attorney General requesting the enactment of penalties for the purchase of sexual services, contingent on the Province assuming enforcement costs."
