answer: |-
  This is a strong pivot. Your supervisor's "nice illustration" comment is likely a polite way of saying, "This is an application of a model, not a philosophical intervention." To move from illustration to intervention, you must show where the Northern Rock case *strains* the categories of Methodological Individualism (MI) rather than just fitting neatly into them. If MI explains everything effortlessly, you have an illustration. If MI has to contort itself to explain the retail run while the wholesale run fits comfortably, you have a philosophical problem.

  Here is the mapping you requested, structured to help you draft the chapter.

  ### 1. Mapping Methodological Individualism onto Northern Rock

  You proposed splitting MI into Constitutive, Explanatory, and Practical claims. This is the right taxonomy. Here is how Northern Rock (NR) pressures each.

  #### A. The Constitutive Claim
  *Claim:* Social facts are nothing over and above individuals and their relations.
  *   **The MI Reading:** The "bank run" is just an aggregation of withdrawal requests. "Liquidity crisis" is just a mismatch between individual asset maturities and liability maturities held by specific agents.
  *   **The NR Stress Test:** This holds up well for the **wholesale run**. Lending institutions are treated as individual agents maximizing utility/risk. Their refusal to roll over funding is a sum of individual credit decisions.
  *   **The Friction:** It strains on the **retail run**. The "queue" is not just people standing in line; it is a *signal*. For the constitutive claim to hold, the signal must be reducible to physical movements. But the causal power of the queue lay in its *interpretation* as a signal of insolvency. The fact "Northern Rock is failing" did not exist as a brute physical fact until the collective interpretation of the queue made it so. MI struggles to constitute "panic" without smuggling in a social ontology of *shared belief*.

  #### B. The Explanatory Claim
  *Claim:* Adequate explanation bottoms out in what individuals did and believed.
  *   **The MI Reading:**
      *   **The Depositor:** Queued because they believed (1) the bank might fail and (2) others would queue (sequential service constraint).
      *   **The Wholesale Lender:** Withdrew funding because risk models indicated collateral haircuts were rising.
      *   **The Bank/Treasury:** Announced support to alter individual beliefs about solvency.
  *   **The NR Stress Test:**
      *   **Wholesale:** MI explains this perfectly. Institutions acted on private information and risk models.
      *   **Retail:** MI explains the *action* (withdrawing) but struggles with the *epistemic trigger*. Most retail depositors had **no information** about the balance sheet. Their belief was not based on fundamentals (assets/liabilities) but on *other people's beliefs* (the queue/TV).
      *   **The Problem:** If the explanation bottoms out in individual beliefs, where did the belief come from? If it came from the TV, why did the TV cause *this* belief? Because the TV showed a queue. Why was a queue a signal of failure? Because of a social convention about banks. MI must explain the convention individualistically. It can (via Lewisian convention), but it requires a layer of "beliefs about beliefs about beliefs" that looks suspiciously like a holist structure described in individualist language.
      *   **The Announcement:** The BoE announcement caused the run because "support announced is distress revealed." MI treats this as a signal updating Bayesian priors. But the signal only worked because of the *institutional context* (only insolvent banks need BoE help). That context is a social fact, not an individual one.

  #### C. The Practical Claim
  *Claim:* You can only intervene by changing individual-level incentives.
  *   **The MI Reading:** The Treasury guarantee stopped the run because it changed the payoff matrix for the depositor. Withdrawing now yields no advantage over staying, regardless of what others do.
  *   **The NR Stress Test:** This is where MI looks strongest but is actually most vulnerable.
      *   **Success:** The guarantee *did* stop the run. Incentives changed.
      *   **Failure:** The guarantee stopped the run **without anyone learning anything new about the bank.** The fundamentals (the bad mortgages) remained identical on Tuesday and Wednesday. The *only* thing that changed was the social contract (the state backstop).
      *   **The Implication:** If the intervention worked by changing the *rules of the game* rather than the *preferences of the players*, MI is technically correct (incentives changed), but it misdescribes the *locus* of the change. The change was in the **systemic structure**, not the individual psychology. A strict MI might say "we changed the individual incentive," but a Holist says "we changed the institution." The empirical fact is that the bank was saved by a change in *status*, not a change in *assets*.

  ### 2. Running it the Other Way: Holism and the Diamond-Dybvig (D-D) Absorption

  You asked if the case confirms holism or if D-D absorbs it.

  **Does "fragility" exist individually?**
  No. "Funding structure fragility" is a property of the *maturity transformation* process. A single mortgage is not fragile; a single deposit is not fragile. Fragility is a relation between the two mediated by the market. This supports the Holist constitutive claim: the property belongs to the system, not the nodes.

  **The D-D Absorption:**
  The D-D model is the MI champion because it derives the run from individual rationality + beliefs about others. It absorbs the "social" into the "inter-individual."
  *   **The Gap:** D-D predicts *multiple equilibria* (good: no run; bad: run). It does not predict *which* equilibrium obtains.
  *   **The Selection Mechanism:** In NR, the selection mechanism was the BoE announcement + TV coverage.
  *   **Is the Selection Social?**
      *   **MI View:** The announcement is a "sunspot" or public signal. Individuals update priors. The selection is the aggregate result of individual updates.
      *   **Holist View:** The announcement created **Common Knowledge**. It wasn't just that I knew the bank was in trouble; it was that I knew *you knew*, and you knew *I knew*. This recursive structure is irreducibly social. An individual mind cannot contain "common knowledge" alone; it is a property of the group's epistemic state.
      *   **The Verdict:** If you argue that equilibrium selection requires Common Knowledge (generated by public broadcast), you have found an irreducibly social remainder. D-D explains the *possibility* of the run individualistically, but the *actualization* of the run relies on a social epistemic structure (the public sphere) that MI cannot reduce without infinite regress of "I believe that you believe..."

  ### 3. Evaluating Your Tests for "Irreducibly Social"

  You are right to be worried about your current tests. Here is the diagnosis and a proposal for a sharper one.

  #### Test One: Publicity Consumes Fact
  *Your Worry:* Publicising germ theory changed behavior, but germs aren't social.
  *Diagnosis:* You are conflating **Causal Dependence** with **Ontological Dependence**.
  *   Germ theory changes behavior, but germs exist without the theory.
  *   A bank run does *not* exist without the collective belief. If everyone believes the bank is safe, there is no run, even if the bank is insolvent. If everyone believes it is unsafe, there is a run, even if the bank is solvent.
  *   **Refinement:** A fact is irreducibly social if its **truth conditions depend on collective intentionality.**
      *   *Test:* Can this fact obtain in a world with only one agent?
      *   *Germ:* Yes (one person can have a disease).
      *   *Bank Run:* No (one person withdrawing is not a run).
      *   *Liquidity:* No (one person cannot be illiquid in a market that doesn't exist).
      *   *Application to NR:* The "wholesale freeze" was a market failure. A market requires >1 agent. The "retail run" was a coordination failure. Coordination requires >1 agent. The *nature* of the crisis was essentially multi-agent in a way a germ infection is not.

  #### Test Two: Identity-Swap Invariance
  *Your Worry:* Individualists say "yes, they'd occupy the same role."
  *Diagnosis:* You are right. This tests for *structuralism*, not necessarily holism. MI accepts roles (e.g., "homo economicus").
  *   **Refinement:** Test for **Institutional Constitution.**
      *   *Test:* If you swap the individuals but remove the *institutional status*, does the event persist?
      *   *Application:* Take the NR depositors. Swap them with random people. Give them the same beliefs. But remove the legal status of "limited liability bank" and "deposit insurance."
      *   *Result:* They might still hoard cash, but it is no longer a "bank run." It becomes "panic." The *explanation* for why they queued specifically at Northern Rock branches (rather than just hiding cash under mattresses) relies on the specific institutional architecture (branch banking, FSCS limits).
      *   *Why this works:* It forces the Individualist to admit that the *individual's reasoning* is constituted by social institutions. The individual didn't just want "money"; they wanted "insured deposits." That concept is social.

  #### A Better Test: The Counterfactual Institutional Vacuum
  To really stress-test MI in your chapter, use this:
  **"Would the individual actions retain their explanatory power if the institutional context were removed?"**
  *   In NR, the individual action "withdraw deposit" explains the run *only because* there is a fractional reserve system.
  *   If the system were 100% reserve banking, the same individual action (withdrawing) would not cause a crisis.
  *   Therefore, the explanation of the crisis cannot be complete without referencing the system. The individual action is a *trigger*, but the system is the *cause*. MI focuses on the trigger; Holism focuses on the cause.

  ### 4. Where the Dispute is Silent (and where your thesis lives)

  There are two places where the Individualism/Holism debate goes quiet, and this is where you can make your original contribution.

  **1. What counts as an "Individual"?**
  *   In the wholesale run, the "individuals" were institutions (Lehman, other banks, funds).
  *   MI treats firms as unitary agents (black boxes).
  *   Holism treats firms as sub-systems.
  *   **The Silence:** Neither side adequately addresses *organizational internalism*. The decision to not roll over NR funding was made by risk committees inside other banks. Was *that* decision individual or social?
  *   **Your Move:** Argue that the "individual" in social science explanation is a variable, not a constant. In the wholesale market, the "individual" is the firm. In the retail market, it's the person. The *level* of individualism shifts. This destabilizes MI, which usually assumes a fixed ontological bottom (the human).

  **2. Normative Design (The Guarantee)**
  *   MI says: Design incentives so individuals don't run (e.g., insurance).
  *   Holism says: Design structures so runs are impossible (e.g., narrow banking).
  *   **The Silence:** The NR guarantee stopped the run, but it created moral hazard (a systemic property).
  *   **Your Move:** The "Practical Claim" of MI (change incentives) works in the short term (queues stopped) but fails in the long term (systemic risk increases). The Holist critique isn't that MI can't stop the run, but that MI treats the *solution* (guarantee) as an individual incentive tweak rather than a structural transformation. The guarantee didn't change the depositors; it changed the *state*.
  *   **Thesis Point:** If the solution to the problem requires a change in the *state's status* (guarantor) rather than the *agents' preferences*, then the explanation of the crisis must have been structural to begin with. You cannot solve a structural problem with purely individualistic tools without generating externalities (moral hazard).

  ### Summary for the Chapter

  To stop this from being a "nice illustration," do not conclude that "Northern Rock shows both views have merit." That is a platitude.

  Instead, conclude that **Northern Rock exposes the limits of Methodological Individualism in handling Common Knowledge and Institutional Status.**
  1.  **Wholesale Run:** MI explains this well (fundamentals).
  2.  **Retail Run:** MI struggles here. It requires "beliefs about beliefs" that collapse into Common Knowledge (a social fact).
  3.  **The Solution:** The guarantee worked by changing institutional status, not individual psychology.
  4.  **The Test:** The "Institutional Vacuum" test shows that the individual actions were only explanatory *because* of the social structure.

  Your supervisor calls it an illustration because they see the case confirming the model. You need to write the section to show the case *breaking* the model's claim to exclusivity. The run wasn't just individuals acting; it was a system reacting to itself. The BoE announcement wasn't just data; it was a performative speech act that altered reality. If you can pin down the *performative* nature of the announcement vs. the *descriptive* nature of MI, you move from illustration to philosophy.
