      *   *Structure:*
          1.  Validate the user's intuition (they are hitting the wall professional philosophers hit).
          2.  Propose the Principle (Concrete vs. Abstract / Contingent vs. Necessary).
          3.  Apply the Principle to the User's Candidates (The "Audit").
          4.  Resolve the Empty Set Tension.
          5.  Address the "One Particle" case.
          6.  The "Honest Drop": Tell them which verdicts to abandon.
