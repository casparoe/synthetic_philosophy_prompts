answer: |-
  # The Commemoration Integrity Protocol (CIP)
  **Version 1.0 | For Panel Use Only**

  **Purpose:** To provide a consistent, defensible, and time-bound method for evaluating petitions to alter public commemoration.
  **Constraint:** 90 minutes per petition. Reliance on the Staff Historical Dossier is mandatory; the Panel does not conduct independent research.
  **Output:** A draft recommendation (Retain, Remove, or Recontextualize) with a findings summary.

  ---

  ## Phase 1: Object Classification (15 Minutes)
  *Goal: Determine the function of the object. This dictates the threshold for removal.*

  **Question 1.1: Is the object primarily Honorific or Functional?**
  *   **Honorific:** Statues, busts, building names, park names, school names. (Purpose: To venerate or memorialize).
  *   **Functional:** Street signs, bridges, infrastructure, utility markers. (Purpose: To navigate or identify).

  **Decision Rule:**
  *   If **Honorific**: Proceed to Phase 2. High sensitivity to the honoree's moral standing.
  *   If **Functional**: Proceed to Phase 2, but apply the "Public Disruption Test" in Phase 4. High sensitivity to cost and public confusion.

  **Classification Note:** The distinction between *Honorific* and *Functional* must survive simplification. Dropping it leads to two errors: erasing historical record (renaming every street) or glorifying harm (keeping statues of abusers).
  *   **Cost:** It creates apparent inconsistency (e.g., a person may be "removed" from a library but "retained" on a street sign). This is a feature, not a bug. It acknowledges that a street name is a coordinate, not a eulogy.

  ---

  ## Phase 2: The Contemporaneous Contestability Test (30 Minutes)
  *Goal: Address the "Standards-of-the-Time" objection without licensing presentism or relativism.*

  **Question 2.1: Was the specific conduct legally or socially proscribed during the honoree's lifetime?**
  *   *Sufficient Answer:* Yes (e.g., murder, theft, documented violations of existing law).
  *   *Insufficient Answer:* No (e.g., segregation in 1920s South, colonial land seizure).
  *   **Rule:** If **Yes**, the "Standards-of-the-Time" defense is **void**. Proceed to Phase 3.
  *   **Rule:** If **No**, proceed to 2.2.

  **Question 2.2: Was there vocal, documented opposition to this conduct by contemporaries?**
  *   *Sufficient Answer:* Yes (e.g., newspaper editorials, legislative minority reports, protests, rival faction criticism).
  *   *Insufficient Answer:* No (The record is silent; the conduct was universally accepted by the dominant class).
  *   **Rule:** If **Yes**, the "Standards-of-the-Time" defense is **void**. The honoree made a choice against available moral alternatives. Proceed to Phase 3.
  *   **Rule:** If **No** (Silence), proceed to 2.3.

  **Question 2.3: Does the conduct violate a "Universal Harm" threshold?**
  *   *Definition:* Acts that violate human dignity recognizable across eras (e.g., chattel slavery, torture, non-consensual medical experimentation, genocide).
  *   **Rule:** If **Yes**, the "Standards-of-the-Time" defense is **void**. Proceed to Phase 3.
  *   **Rule:** If **No**, the "Standards-of-the-Time" defense is **valid**. The conduct is noted but does not alone justify removal. **Recommendation: Retain with Context.** (Terminate unless Aggregation overrides).

  ---

  ## Phase 3: The Nexus & Aggregation Test (30 Minutes)
  *Goal: Weigh the harm against the legacy without arithmetic.*

  **Question 3.1: Is there a Nexus between the Harm and the Honor?**
  *   *Direct Nexus:* The harm *created* the legacy (e.g., wealth from slavery funded the library; medical experiments produced the reputation).
  *   *Incidental Nexus:* The harm occurred alongside the legacy but did not fuel it (e.g., a suffragist who held racist views unrelated to her voting rights work).
  *   **Rule:** If **Direct**, the legacy is tainted. Legacy cannot purchase immunity. Proceed to 3.2.
  *   **Rule:** If **Incidental**, the legacy remains intact. Proceed to 3.2.

  **Question 3.2: Does the Harm outweigh the Public Utility of the Commemoration?**
  *   *Consider:* Does keeping the name cause active pain to a protected class? Does removing it erase a critical historical lesson?
  *   **Rule:** If **Honorific** + **Direct Nexus** + **Universal Harm**: Recommendation is **Remove**.
  *   **Rule:** If **Honorific** + **Incidental Nexus**: Recommendation is **Recontextualize** (Plaque, exhibit, renaming of wing only).
  *   **Rule:** If **Functional**: Recommendation is **Retain** unless the name causes active safety issues or the cost of renaming is negligible.

  **Hand-Off Point:** If the Panel finds a **Direct Nexus** but the **Public Utility** is high (e.g., a hospital wing that secures funding for a free clinic), the Panel lacks the mandate to trade current health outcomes for historical justice. **Stop and Hand Back to Council.** The Council must vote on whether to risk the service to cleanse the name.

  ---

  ## Phase 4: Consistency & Remedy (15 Minutes)
  *Goal: Resolve multiple objects and finalize the recommendation.*

  **Question 4.1: Does the honoree appear on other city objects?**
  *   **Rule:** The Panel verdict binds the *Honoree's Status*, not necessarily every *Object*.
  *   **Status: Decommissioned.** (Remove). All *Honorifics* must be removed. *Functionals* may remain for navigation stability but must be stripped of plaques/biographical text.
  *   **Status: Retained with Context.** *Honorifics* stay but require interpretive material. *Functionals* stay unchanged.
  *   **Status: Retained.** No changes.

  **Question 4.2: Is there a conflict between Object Types?**
  *   *Scenario:* Panel votes to "Decommission" (Remove) the Honoree, but one object is a Bridge (Functional).
  *   **Rule:** Panel recommends Removal of the Bridge Name, but notes the "Public Disruption Cost."
  *   **Conflict Resolution:** If the Council accepts the "Decommission" status but rejects the Bridge removal due to cost, the Council resolves the divergence. The Panel records the inconsistency as "Administrative Necessity."

  ---

  # Application to Petitions

  ### Petition A: The Physician (1870s)
  *   **Object:** Hospital Wing (Honorific/Functional Hybrid).
  *   **Harm:** Non-consensual experiments on poorhouse inmates.
  *   **Classification:** Honorific (Wing Name).
  *   **Contestability (Phase 2):** 1870s Medical Ethics.
      *   Q2.1 (Proscribed?): No, not illegal then.
      *   Q2.2 (Contested?): Silence in record.
      *   Q2.3 (Universal Harm?): **Yes.** Non-consensual experimentation on vulnerable populations is a Universal Harm (torture/abuse). Defense Void.
  *   **Nexus (Phase 3):**
      *   Q3.1: **Direct Nexus.** His medical reputation (the reason for the wing) was built on these experiments.
      *   Q3.2: **Aggregation.** The clinic *still serves the neighborhood*. Removing the name may jeopardize endowment/funding.
  *   **Verdict:** **Hand Back to Council.**
  *   **Reasoning:** The procedure identifies a Direct Nexus and Universal Harm (requiring Remove), but the current Public Utility (clinic funding) creates a trade-off the Panel cannot authorize. The Council must decide if the clinic's survival justifies retaining the name.

  ### Petition B: The Suffragist (Statue)
  *   **Object:** Courthouse Square Statue (Honorific).
  *   **Harm:** Published eugenicist/immigration restrictionist views.
  *   **Classification:** Honorific.
  *   **Contestability (Phase 2):** Early 20th Century.
      *   Q2.1 (Proscribed?): No.
      *   Q2.2 (Contested?): **No.** Eugenics was mainstream progressive science. Minority opposition existed but was not the dominant social standard.
      *   Q2.3 (Universal Harm?): **Borderline.** Eugenics is now abhorrent, but was it "Universal Harm" *then*? The procedure classifies this as "Standards-of-the-Time Valid" *unless* it violates a Nexus test.
  *   **Nexus (Phase 3):**
      *   Q3.1: **Incidental Nexus.** She is honored for Suffrage (Voting Rights). Her harm was Immigration/Eugenics. These are distinct policy spheres.
      *   Q3.2: **Weighing.** Removing her erases the history of the Suffrage movement's complexity.
  *   **Verdict:** **Retain with Context.**
  *   **Reasoning:** The procedure protects historical nuance. She advanced rights for one group while restricting them for another. A plaque explaining this duality is the remedy.
  *   **The Embarrassment:** This result will embarrass the Panel. We are recommending the city keep a statue of a woman who advocated for the sterilization of the "unfit."
  *   **Why It Is Right:** Because the procedure distinguishes between *venerating a saint* and *marking a historical actor*. To remove her is to claim the Suffrage movement was morally pure, which is false. The statue becomes a teaching tool about the limits of historical progress.

  ### Petition C: The Industrialist (Bridge)
  *   **Object:** City Bridge (Functional).
  *   **Harm:** Wage-scrip system (economic exploitation).
  *   **Classification:** Functional.
  *   **Contestability (Phase 2):** Late 19th Century.
      *   Q2.1 (Proscribed?): No.
      *   Q2.2 (Contested?): **Yes.** Unions existed and protested this specifically. Defense Void.
  *   **Nexus (Phase 3):**
      *   Q3.1: **Direct Nexus.** His wealth (reason for honor) came from the exploitation.
      *   Q3.2: **Public Utility.** It is a bridge. Renaming causes navigation confusion and cost.
  *   **Verdict:** **Retain.**
  *   **Reasoning:** Under Phase 1, Functional objects prioritize navigation stability over moral purity. Under Phase 4, even if the Honoree is "Decommissioned," Functionals may remain if the cost is high.
  *   **Conflict:** The Union petitioning is funded by his foundation. This suggests the petition is performative or managed conflict.
  *   **Outcome:** The name stays. The procedure prioritizes the public's ability to find their way over the public's desire to punish the dead, provided the object is infrastructure.

  ---

  # Failure Modes & Honest Assessment

  **1. The "Silence" Loophole (Gaming by Petitioners)**
  *   *Risk:* Petitioners will hire historians to find *one* obscure contemporary critic to satisfy Question 2.2 (Contested?).
  *   *Mitigation:* The Staff Dossier must quantify opposition. "One letter to the editor" does not count as "Socially Contested." The Panel must ask: "Was this a movement or a grievance?"
  *   *Failure:* If we set the bar too high, we protect monsters who were simply good at censorship. If we set it too low, we judge everyone by the standards of their loudest critic.

  **2. The "Functional" Shield (Defensible but Wrong)**
  *   *Risk:* Case C (The Bridge). The procedure allows exploitative names to remain on infrastructure indefinitely.
  *   *Consequence:* We tell the descendants of the exploited that their pain is less important than traffic flow.
  *   *Defense:* A city cannot function if its map changes every generation. However, this creates a two-tier system where the wealthy (who get bridges) are remembered, and the poor (who get parks) are erased. The procedure admits this inequity but prioritizes civic stability.

  **3. The Council Hand-Off (Buck-Passing)**
  *   *Risk:* Case A (The Physician). By handing the "Utility vs. Justice" trade-off to the Council, the Panel insulates itself from blame.
  *   *Consequence:* The Council will likely vote to Retain to avoid closing the clinic, making the Panel look complicit.
  *   *Defense:* Lay volunteers cannot make budgetary triage decisions. This is the correct jurisdictional boundary, even if it looks like cowardice.

  **4. The Consistency Illusion**
  *   *Risk:* The public sees the Suffragist statue stay (Case B) while a lesser figure's park is removed. They perceive bias.
  *   *Defense:* The procedure is transparent. We publish the "Nexus" findings. If the public disagrees, they must argue the Nexus, not the outcome.

  **Final Note to Panel:**
  This procedure will not make everyone happy. It is designed to make the *process* unassailable, not the *outcome* painless. If you follow these steps, you can be overruled, but you cannot be accused of arbitrariness.
