answer: |-
  Here is the specification for a theory of morally permissible compromise, structured as functional requirements for an institution deciding whether to broker a deal.

  ### The Specification

  **1. The Anti-Halfway House Constraint (No Lose-Lose)**
  *   **The Case:** A hospital mediates between a pro-life pharmacist and a pro-choice patient. The deal: The pharmacist dispenses the drug but is allowed to lecture the patient on sin while doing so.
  *   **The Failure:** The patient feels coerced (autonomy violated); the pharmacist feels complicit (integrity violated). The hybrid maximizes the downsides of both systems.
  *   **The Requirement:** The theory must guarantee that the compromise outcome is **Pareto-superior to the status quo of no-deal** according to the internal metrics of *both* parties. It must rule out incoherent hybrids that activate the prohibitions of both systems simultaneously.

  **2. The Complicity Constraint (Offsetting Rule)**
  *   **The Case:** Party A agrees to fund Party B's school (which B thinks is good) in exchange for Party B helping A lobby for a policy B thinks is sinful.
  *   **The Failure:** Is this trade or bribery? If values are absolute duties, "offsetting" a sin with a good deed is incoherent. If values are preferences, it is efficient.
  *   **The Requirement:** The theory must explicitly state whether **moral credits are transferable**. It must determine if facilitating a perceived wrong invalidates the good achieved elsewhere, or if net moral value can be aggregated across agents.

  **3. The Intensity Weighting Rule (No Arbitrary Splits)**
  *   **The Case:** Party A objects to a policy on mild aesthetic grounds. Party B objects on grounds of existential survival. A 50/50 split favors A disproportionately.
  *   **The Failure:** Treating all value claims as equal units ignores the stakes.
  *   **The Requirement:** The theory must provide a mechanism for **interpersonal comparison of moral intensity**. It cannot treat "I dislike this" and "This violates my core identity" as equivalent bargaining chips.

  **4. The Joint Endorsement Condition (Compromise vs. Truce)**
  *   **The Case:** Two factions stop fighting because they are exhausted (Truce/Modus Vivendi) vs. two factions agreeing that the middle path is *right* (Compromise).
  *   **The Failure:** A truce is unstable; it lasts only as long as the balance of power. Capitulation is unjust.
  *   **The Requirement:** Both parties must be able to affirm the outcome as **morally permissible**, not just pragmatically tolerable. The theory must distinguish a deal that preserves integrity from a deal that requires surrender or silence.

  ***

  ### Classification: Non-Negotiable vs. Priors

  **Non-Negotiable (Functional Necessities for Institution)**
  *   **The Anti-Halfway House Constraint:** An institution that systematically produces outcomes worse than no-deal loses legitimacy and causes net harm. This is a baseline coherence requirement.
  *   **The Joint Endorsement Condition:** Without this, you are not brokering *compromise*; you are enforcing a *ceasefire*. If the institution's mandate is ethical integration rather than conflict containment, this is non-negotiable.

  **One Camp's Priors (Substantive Meta-Ethical Commitments)**
  *   **The Complicity Constraint:** This divides consequentialists (offsetting is valid) from deontologists/aretaic ethicists (some acts are non-fungible). A theory cannot satisfy both; it must pick a side on the nature of moral action.
  *   **The Intensity Weighting Rule:** This requires a prior belief that moral intensity is measurable and comparable across different conceptual schemes. Subjectivists or strict pluralists may deny this is possible.

  ***

  ### The Impossibility Result

  Your suspicion is correct, but the tension is slightly deeper. The subset that cannot be jointly satisfied is:

  1.  **Internal Validation:** Each side judges the deal better by its own lights (Required for Joint Endorsement).
  2.  **Non-Fungibility:** At least one side holds a value that is sacred/non-tradable (Required for Integrity).
  3.  **External Legitimacy:** The deal survives third parties who object to trading in that value at all.

  **The Conflict:**
  If a value is truly **Non-Fungible** (2), it cannot be traded without violating **Internal Validation** (1), because the act of trading it devalues it. If you trade it anyway to secure a gain, you have treated it as a preference, not a principle.
  However, if you refuse to trade it, **External Legitimacy** (3) is satisfied (the third party is happy), but no deal occurs.
  If you *do* trade it, **Internal Validation** fails (the trader compromises their integrity), or **External Legitimacy** fails (the third party objects to the commodification).

  You cannot have a deal where both sides feel they upheld their sacred values *and* third parties agree those values weren't corrupted by the trade. **Compromise implies fungibility; Integrity implies non-fungibility.**

  ***

  ### The Bottleneck

  **The Joint Endorsement Condition** knocks out the most candidates.

  Most existing frameworks for conflict resolution (game theory, political liberalism, *modus vivendi*) rely on **overlapping consensus** or **pragmatic tolerance**. They require parties to agree to *live together*, not to agree that the other side is *right* or that the hybrid is *good*.

  By demanding that both parties affirm the deal as **morally permissible** (rather than merely tolerable), you eliminate:
  *   **Pragmatism:** (Which accepts deals based on power/stability).
  *   **Liberal Neutrality:** (Which brackets truth claims to allow coexistence).
  *   **Utilitarianism:** (Which might endorse a deal one party finds morally repugnant if the net utility is high).

  This requirement forces the theory to solve the hardest problem in meta-ethics: how to reconcile contradictory truth claims without diluting them. Most theories survive by lowering the bar to "toleration." Keeping the bar at "endorsement" leaves almost no viable candidates.
