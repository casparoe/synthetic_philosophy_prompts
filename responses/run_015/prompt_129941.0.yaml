answer: |-
  I plan to pass the first junction in sight,
  For gain awaits beyond this present lane;
  I bind my future self to seek that gain,
  And trust my memory remains quite bright.
  The prior view commands the proper right
  To skip the turn for less profit again;
  One steady self sustains the wholeness chain,
  To keep my steady conduct full in sight.

  But I wake to find no mark upon this turn,
  No clock can mark the time of present now;
  No sign can mark the spot that holds me here,
  So going ahead seems proper for this turn.
  I drop the self that linked the past to now,
  Or break the rule that guides the choice right here.
