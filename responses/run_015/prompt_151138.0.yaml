answer: |-
  Welcome, everyone. It is rare to see a room divided so evenly between those who speak in proofs and those who speak in systems. On one side, we have formal epistemologists and logicians concerned with consistency, provability, and the limits of self-reference. On the other, AI researchers and cognitive scientists concerned with reliability, architecture, and the practicalities of self-correction. Usually, these conversations happen in parallel. Here, they must intersect.

  Our title is "Reflective Reasoning and Epistemic Self-Trust." Our collective aim is ambitious: to advance the design of agents that can rationally trust their own future reasoning. We want systems that can modify their own code, plan over long horizons, and operate without constant human oversight. To do that, an agent must believe that its future self will not drift into error. It needs to look ahead and say, "Whatever I conclude tomorrow, I can trust it today."

  But we must begin with a constraint. If I were to promise that over the next three days we will solve the problem of self-trust—that we will design a system that fully validates its own reliability from within—I would be misleading you. We are all aware of the Löbian obstacle. Any formal system sufficiently powerful to represent its own reasoning cannot consistently prove its own soundness without risking inconsistency. If an agent tries to fully certify its own future reliability using its own logic, it undermines the very consistency it seeks to prove.

  For the engineers in the room, this might sound like abstract noise. For the logicians, it might sound like a stop sign. I want to suggest it is neither. It is a design constraint. It means we cannot frame the goal of this workshop as achieving internal self-certification. We cannot build a system that guarantees its own infallibility. But we can build systems that understand their own limits.

  To make this productive, I want to introduce a distinction that will shape our discussions here. We need to separate *procedural self-endorsement* from *doxastic self-endorsement*.

  Procedural self-endorsement is when a system validates its own inference rules. It is the agent trusting its own engine—the code, the update functions, the learning algorithms. Doxastic self-endorsement is when a system assigns high credence to its specific conclusions. It is the agent trusting its own outputs—the specific beliefs, predictions, or decisions it generates.

  The Löbian obstacle undermines doxastic self-endorsement far more severely than procedural. You cannot universally guarantee that every conclusion your system reaches will be true. The logic simply does not allow a system to assert, "All my future beliefs are reliable," without collapsing. However, you may be able to justify the procedures that generate those beliefs under bounded conditions. You might not be able to prove every theorem you will ever derive, but you might be able to prove that your derivation rules preserve truth within a specific domain.

  Why does this matter for architecture? Because it means reliability must be treated as non-uniform. If you are building an autonomous agent, you cannot architect it as if it possesses a uniform seal of approval on all its thoughts. You cannot build for perfect self-trust. Instead, you must build for managed uncertainty. The system needs to know when its procedural endorsement holds and when its doxastic confidence should degrade. This suggests architectures that include external monitors, fallback mechanisms, and contexts where self-reference is limited rather than universal.

  For the logicians in the room, this means our work is not just about proving impossibility. It is about mapping the boundaries where procedural endorsement remains viable. Where can we safely allow a system to reason about its own rules without triggering inconsistency? For the engineers, this means stopping the search for a magic bullet that guarantees safety through self-proof. Instead, look for the structural ways to isolate self-reference so that procedural trust can exist without requiring impossible doxastic guarantees.

  We are not here to dissolve the Löbian obstacle. We are here to navigate around it. We are here to accept that an agent cannot fully know itself, and then ask: what can it know? How much trust is enough? And how do we build systems that are honest about the gap between their rules and their conclusions?

  Over the next three days, I ask that we keep this distinction in mind. When someone proposes a model of self-trust, ask: is this procedural or doxastic? When someone proposes a safety guarantee, ask: does this require the system to prove its own consistency? If it does, we know where that leads.

  Let us use these constraints to sharpen our questions rather than silence them. We have the logic to understand the limits, and we have the engineering to build within them. Let's get to work.
