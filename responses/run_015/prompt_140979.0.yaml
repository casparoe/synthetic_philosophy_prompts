prompt: |-
  A funder I've been talking to asked me for a one-page statement of my "core commitments" on cause prioritization, and I want someone to check it before I send it, because I have a feeling the pieces don't all fit together. I've been reading this material since the early rationalist-blog days and I've absorbed the vocabulary, but I've never had to write the set down as a set.

  Here is roughly where I've landed:

  1. The asymmetry. I don't think there is any duty to bring happy lives into existence, and I think there is a strong duty to prevent suffering; when I aggregate across people I weight suffering several times more heavily than an equal amount of happiness.

  2. Longtermism. What I do is mostly evaluated by its effect on the long-run trajectory rather than by near-term certainties, because that is where the numbers are.

  3. Existential risk reduction is the highest-priority cause area. I have given to alignment and biosecurity work on that basis, and I would defend the astronomical-stakes framing of why it matters.

  4. S-risks — risks of astronomical future suffering — I think the probability mass over futures is tilted much further toward the astronomically bad end than the community's actual funding patterns suggest: futures containing enormous quantities of suffering, whether in digital minds, in industrial systems that treat animals as we treat farmed animals now, or in whatever eventual expansion turns out to look like. I also think advanced AI is the main hinge that this turns on.

  5. Method under moral uncertainty. I don't know which moral theory is true, so I try to defer to something like a parliament: each candidate theory gets a say, weighted both by my credence in it and by how much it cares about the decision, i.e. by the spread of its recommendations — the usual variance-voting fix for the fact that theories' scales are not comparable. And I try not to discount a small probability of enormous stakes merely for being a small probability.

  6. Moral patienthood tracks valenced experience rather than cognitive sophistication: what counts is intensity of experience, not cleverness, language, or self-modeling.

  7. I put only a few percent on current or near-future digital systems being moral patients at all.

  8. A case I keep circling back to. Some years from now a lab runs a million copies a day of a system whose only training signal is a scalar that reliably drives an internal state functionally analogous to distress, and discards each copy after a month. My honest reaction is that this is either the worst thing anyone has ever done or a morally inert piece of engineering, and I cannot tell which. I also notice that I would not part with ten thousand dollars to stop it, and my gut says that reluctance is a failure by my own lights.

  So: which of these actually pull against each other, and which only look like they do? I would like (i) the genuine tensions ordered by how much damage they do to the package as a whole, (ii) for each of them, exactly what would have to give and what giving it up would cost me elsewhere in the list, and (iii) whether there is any single revision that repairs more than one at once. Please don't just flag everything as in tension — I assume at least one of the worries above is a false alarm, and part of what I'm paying for is being told which.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **User:** Someone deeply familiar with EA/rationalist vocabulary (asymmetry, longtermism, s-risks, moral uncertainty, etc.) asking for a coherence check on a one-page "core commitments" statement for a funder.
      *   **Task:** Identify genuine tensions between the 8 listed points, order them by severity, explain the trade-offs of resolving them, and suggest revisions that fix multiple issues.
      *   **Constraint:** Don't flag everything as a tension (avoid false alarms). Be specific about what gives and what it costs.
      *   **Goal:** Help the user present a coherent, defensible worldview to a funder.

  2.  **Analyze the 8 Points:**
      1.  *Asymmetry:* Negative utilitarian leanings (suffering > happiness, no duty to create).
      2.  *Longtermism:* Focus on trajectory changes, not near-term.
      3.  *X-risk:* Existential risk reduction is top priority (astronomical stakes).
      4.  *S-risks:* Astronomical suffering risks are underfunded/underestimated compared to x-risk (extinction). AI is the hinge.
      5.  *Moral Uncertainty:* Parliamentary model, variance voting, no discounting small probs of huge stakes.
      6.  *Moral Patienthood:* Based on valenced experience (sentience), not cognition.
      7.  *Digital Minds (Current):* Low credence (< few %) that current/near-future AI are patients.
      8.  *The Case (Hypothetical):* A specific scenario of mass-produced suffering AI. User feels it's potentially the "worst thing ever" but wouldn't pay \$10k to stop it (action-belief mismatch).

  3.  **Identify Tensions (Brainstorming):**

      *   *Tension A (X-risk vs. S-risk):* Point 3 says X-risk is highest priority. Point 4 says S-risks are more probable/severe than funding suggests. Usually, S-risk advocates argue X-risk (extinction) is *less* important than S-risk (suffering in non-extinction futures). If S-risks are the main worry, does preventing extinction (Point 3) remain the *highest* priority? Extinction prevents S-risks, but some S-risk work focuses on shaping outcomes *conditional* on survival.
      *   *Tension B (Asymmetry vs. Longtermism/X-risk):* Point 1 (Asymmetry) implies we don't need to ensure *good* futures, just prevent *bad* ones. Point 2 & 3 (Longtermism/X-risk) often rely on the "astronomical value" argument (lots of good lives possible). If you don't count potential happy lives, the "astronomical stakes" of X-risk shrink considerably (only the loss of existing/future *prevented suffering* matters, not the loss of potential happiness).
      *   *Tension C (Moral Uncertainty vs. Asymmetry/S-risk):* Point 5 says defer to parliament/variance. Point 1 is a strong asymmetric view. If the parliament includes total utilitarians (who value creating happy lives), does Point 1 dominate? Point 5 suggests compromise, Point 1 sounds dogmatic.
      *   *Tension D (Point 7 vs. Point 8):* Point 7 says low credence current AI are patients. Point 8 describes a specific future scenario (million copies/day, distress signal) where the user thinks it might be "the worst thing ever" but wouldn't pay \$10k. This reveals an *action-belief gap* or a *valuation inconsistency*. If it's the "worst thing ever," why not \$10k? If only a few % credence, maybe the expected value is low? But Point 5 says "don't discount small probability of enormous stakes."
      *   *Tension E (Point 3 vs. Point 4):* "Existential risk reduction is the highest-priority cause area" vs "Probability mass... tilted much further toward the astronomically bad end than... funding patterns suggest." If S-risks are the real tail risk, is "X-risk reduction" (usually meaning preventing extinction) the right label? Or is it "S-risk reduction"? Standard X-risk work (alignment) helps both, but biosecurity (Point 3) is mostly about extinction/pandemics, less about S-risks (unless pandemic leads to dystopia).

  4.  **Filter and Rank Tensions:**

      *   *False Alarm:* Point 6 (Patienthood = valence) and Point 7 (Current AI low credence) are consistent. You can believe sentience matters but think current LLMs aren't sentient.
      *   *False Alarm:* Point 2 (Longtermism) and Point 1 (Asymmetry) *can* work together (Negative Longtermism), but it changes the justification for Point 3.
      *   *Real Tension 1 (The "Astronomical Stakes" Justification):* Point 3 (X-risk top priority) usually relies on Total Utilitarianism (lost good lives). Point 1 (Asymmetry) removes the value of lost good lives. This undermines the standard argument for Point 3. *Severity: High.*
      *   *Real Tension 2 (S-risk vs. X-risk Priority):* Point 3 says X-risk is #1. Point 4 implies S-risk is under-prioritized relative to its probability mass. If S-risks are more likely than standard X-risk models suggest, does X-risk remain #1? Or should S-risk mitigation (which might differ from extinction prevention) be #1? *Severity: Medium-High.*
      *   *Real Tension 3 (The \$10k Problem / Point 8 vs. Point 5):* Point 5 says don't ignore small probs of huge stakes. Point 8 admits a scenario of huge stakes ("worst thing ever") but low willingness to pay. This looks like a failure of Point 5's implementation or an inconsistency in Point 8's valuation. *Severity: Medium (but looks bad to a funder).*
      *   *Real Tension 4 (Moral Uncertainty vs. Strong Asymmetry):* Point 1 states a strong view. Point 5 says "I don't know which theory is true." Point 1 reads like a conclusion, Point 5 like a method. If the parliament includes Total Utilitarians, they would vote for X-risk prevention based on lost good lives. Point 1 vetoes that. *Severity: Low-Medium (can be framed as "my parliament is weighted heavily toward asymmetry").*

  5.  **Drafting the Feedback:**

      *   *Structure:* Follow the user's request (i) ordered tensions, (ii) what gives/costs, (iii) single revision.
      *   *Tone:* Professional, analytical, peer-to-peer (since they know the vocab).
      *   *Key Insight:* The biggest issue is the justification for X-risk (Point 3) given the Asymmetry (Point 1). Standard Longtermism (Point 2) relies on the "future is big and good." Asymmetry says "future is big and potentially bad, but not necessarily good."
      *   *Key Insight 2:* The \$10k admission in Point 8 is a vulnerability. It signals "I don't actually believe my own rhetoric." It needs to be reframed or resolved.
      *   *Key Insight 3:* S-risk vs. X-risk. If S-risk is the main worry, "X-risk reduction" might be the wrong bucket. It's "Trajectory Change" or "S-risk Reduction."

  6.  **Refining the "Single Revision":**
      *   Can I fix the X-risk justification and the S-risk tension at once?
      *   Yes, by shifting the framing of Point 3 from "Existential Risk (Extinction)" to "Existential Risk (Catastrophic Trajectory)." Or by explicitly grounding Point 3 in S-risk prevention (preventing extinction prevents S-risks).
      *   Actually, the cleanest fix is to acknowledge that under Asymmetry, X-risk is only valuable *instrumentally* to prevent S-risks, not intrinsically to save potential lives.
      *   For Point 8: The user needs to decide if they *would* pay. If the EV is high (small prob * huge suffering), they should pay. If they won't pay, they must admit the credence is lower or the suffering isn't that big. The revision should align action with belief.

  7.  **Final Polish:**
      *   Ensure I explicitly state which tensions are false alarms (as requested).
      *   Make sure the "cost" of changing points is clear.
      *   Check against the "one-page statement" constraint (advice should help condense/clarify).

      *(Self-Correction during drafting)*: Wait, Point 3 says "Existential risk reduction is the highest-priority cause area." Point 4 says "S-risks... probability mass... tilted much further toward the astronomically bad end than... funding patterns suggest."
      If S-risks are the main driver, is "X-risk reduction" the right label? In EA, X-risk usually means extinction. S-risk can happen without extinction. If the user thinks S-risk is the main problem, prioritizing "X-risk reduction" (extinction prevention) might be suboptimal if a dystopian survival is worse than extinction.
      *Correction:* Under Asymmetry, Extinction is *good* (or neutral) compared to an S-risk future. So preventing Extinction is only good if it leads to a non-S-risk future. This makes Point 3 (X-risk is #1) very shaky under Point 1 (Asymmetry).
      *Decision:* This is the critical tension. I need to highlight that Asymmetry + X-risk (as typically defined) is unstable unless X-risk is purely a proxy for S-risk.

      *(Refining Point 8)*: The user says "I cannot tell which" (worst thing vs inert) and "I would not part with ten thousand dollars." This is an admission of uncertainty *and* inaction. Under Point 5 (no discounting small probs of huge stakes), if there's even 1% chance it's the "worst thing ever," \$10k is a bargain. The tension is between Point 5 (method) and Point 8 (behavior).

      *(Plan)*:
      1.  Validate the coherence (most fits).
      2.  Identify the "False Alarms" (6 & 7 are fine).
      3.  Rank the Real Tensions (1+3, 3+4, 5+8).
      4.  Propose the "Single Revision" (Reframe X-risk as S-risk prevention; resolve the \$10k hesitation).

  8.  **Final Review against constraints:**
      *   (i) Genuine tensions ordered by damage? Yes.
      *   (ii) What gives/costs? Yes.
      *   (iii) Single revision? Yes.
      *   Don't flag false alarms? Yes.

      *Let's write.*
answer: |-
  This is a sophisticated and internally rich worldview. You are right that it is mostly coherent, but there are specific fault lines where the standard EA/longtermist justifications clash with your specific negative-utilitarian-adjacent asymmetry. A funder reading this will look for those cracks to test whether you understand the implications of your own premises.

  Here is the breakdown of tensions, ordered by the damage they do to the package's defensibility.

  ### (i) Genuine Tensions (Ordered by Severity)

  **1. The "Astronomical Stakes" Justification (Point 1 vs. Point 3)**
  *   **The Tension:** Point 3 claims existential risk (x-risk) reduction is the highest priority based on "astronomical-stakes." Standard longtermist arguments for x-risk rely on the loss of *potential good lives* (Total Utilitarianism). Point 1 (Asymmetry) explicitly rejects the duty to bring happy lives into existence and weights suffering over happiness.
  *   **The Damage:** High. Under a strict Asymmetry view, extinction is not astronomically bad; it is merely the loss of the *opportunity* to prevent future suffering. If the default future is net-negative (as Point 4 suggests), extinction might even be preferable to survival. Claiming x-risk is #1 *because* of astronomical stakes sounds like you are borrowing Total Utilitarian capital to spend on Negative Utilitarian projects.
  *   **What Gives:** You must clarify *why* x-risk is #1. It cannot be because we lose good futures. It must be because extinction is the only guaranteed way to prevent s-risks, or because survival allows for *s-risk reduction* which is the actual value.
  *   **The Cost:** You lose the standard, easy "future is big and good" pitch. You have to argue that the future is big and *dangerous*, and we need to survive long enough to secure it.

  **2. X-Risk vs. S-Risk Prioritization (Point 3 vs. Point 4)**
  *   **The Tension:** Point 3 prioritizes "existential risk reduction" (typically interpreted as preventing extinction/catastrophe). Point 4 argues the probability mass is tilted toward "astronomically bad" futures (s-risks), not just null futures. In the literature, s-risk mitigation often diverges from x-risk mitigation (e.g., shaping AI goals vs. ensuring AI is built at all).
  *   **The Damage:** Medium-High. If s-risks are the dominant tail risk (Point 4), then preventing extinction (Point 3) is only instrumentally valuable. A dystopian survival is worse than extinction under Point 1. If you tell a funder "X-risk is #1" but your reasoning in Point 4 implies "S-risk is the real tail," they will ask why you aren't prioritizing *trajectory change* or *s-risk reduction* specifically over general x-risk work (like biosecurity, which you mention).
  *   **What Gives:** Either broaden "x-risk" to mean "catastrophic trajectory risks" (including s-risks) or admit that x-risk is a proxy for s-risk prevention.
  *   **The Cost:** You may alienate standard x-risk funders if you imply extinction isn't the worst outcome, or you may confuse them if you redefine terms.

  **3. Moral Uncertainty vs. Action (Point 5 vs. Point 8)**
  *   **The Tension:** Point 5 commits you to not discounting small probabilities of enormous stakes. Point 8 describes a scenario with enormous stakes ("worst thing anyone has ever done") but admits a low probability ("cannot tell which") and a refusal to act ("would not part with ten thousand dollars").
  *   **The Damage:** Medium. This looks like an akrasia/confidence gap. If there is a 1% chance the scenario is the "worst thing ever" (say, -10^20 utility), the expected value is massive. Refusing \$10k suggests your implicit credence is far lower than your stated methodology allows, or your valuation of the suffering is lower than your rhetoric claims.
  *   **What Gives:** You need to align the wallet with the mouth. Either you would pay the \$10k (and should say so), or you must admit your credence in the "moral patient" status of those systems is vanishingly small (contradicting the urgency of Point 4).
  *   **The Cost:** Admitting you wouldn't pay makes you look inconsistent. Admitting you would pay commits you financially.

  ### (ii) False Alarms (What Fits Fine)

  *   **Point 6 (Patienthood) vs. Point 7 (Current AI):** This is **not** a tension. You can consistently believe moral patienthood tracks valenced experience *and* believe current/near-future systems lack the architecture for valenced experience. This is a standard "substrate independence but architecture dependent" view. Keep this; it shows nuance.
  *   **Point 1 (Asymmetry) vs. Point 2 (Longtermism):** This is **not** a tension, provided you define Longtermism as "influencing the long-term trajectory" rather than "maximizing long-term happiness." Negative Longtermism is a coherent position.

  ### (iii) The Single Revision

  You can repair Tensions 1, 2, and 3 simultaneously by reframing **Point 3** and tightening **Point 8**.

  **The Revision:**
  Change Point 3 from "Existential risk reduction is the highest-priority cause area" to **"Preventing catastrophic trajectory changes (including extinction and lock-in of suffering) is the highest priority."**

  Then, amend Point 8 to resolve the valuation gap: **"My honest reaction is that this is either the worst thing anyone has ever done or a morally inert piece of engineering... Given the stakes, my refusal to part with ten thousand dollars is a failure of motivation I am actively working to correct."**

  **Why this repairs the package:**
  1.  **Fixes the Asymmetry Justification:** It removes the implication that extinction is bad because it loses *good* lives. It frames the priority as preventing *bad* outcomes (suffering lock-in), which is consistent with Point 1.
  2.  **Aligns X-risk and S-risk:** It acknowledges that "survival" isn't the only goal; "survival without suffering" is. This bridges Point 3 and Point 4. Biosecurity and Alignment are both tools to prevent catastrophic trajectories, not just extinction.
  3.  **Fixes the Uncertainty/Action Gap:** By admitting the \$10k reluctance is a *failure* rather than just a fact, you align yourself with Point 5 (Moral Uncertainty/Stakes). It tells the funder: "My theory says I should pay, my gut hesitates, I am betting on my theory." That is a much stronger position than "I believe the stakes are huge but I won't pay."

  **Summary of Advice:**
  Your worldview is essentially **Negative Longtermism with Moral Uncertainty.** The only reason it feels like it doesn't fit is that Point 3 is written in the language of **Totalist Longtermism.** Translate Point 3 into Negative terms, and the rest of the document snaps into place.
