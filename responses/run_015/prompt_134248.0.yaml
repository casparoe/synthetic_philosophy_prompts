answer: |-
  **Brainstorm: Five Carve-ups**

  1.  **Standard Particularised Implicature (PCI):** Your friend's view. Predicts high cancellability ("She's punctual... and actually great") and non-detachability (synonyms work same way).
  2.  **Generalised Implicature (GCI):** Default inference regardless of context. Predicts low cancellability, but should survive outside the department (it doesn't).
  3.  **Conventional Implicature:** Meaning attached to specific words ("unique"). Predicts non-cancellability and high detachability (swap words, lose meaning). Fits code phrases, fails generic ones.
  4.  **Institutional Code:** A local cipher governed by HR rules, not conversational norms. Predicts non-cancellability, variable detachability (code vs. generic), and audience sensitivity (insiders only).
  5.  **Pretense/Make-Believe:** The review is a prop in a game. Predicts no truth-claims are made at all (too radical; HR treats them as records).

  **The Argument: It's an Institutional Code**

  Your friend is wrong. This isn't standard Gricean PCI. Grice's engine runs on the assumption that the speaker is observing the Cooperative Principle (CP) or overtly flouting it to signal meaning. Here, the reviewer isn't flouting Quantity to signal; she is *complying* with a higher-order institutional rule that suspends Quantity. The signal isn't the violation itself; the signal is the *context* in which the violation occurs.

  When I say "Priya is punctual" in a normal context, I imply nothing about her technical skill. In your department, the HR rule creates a local linguistic convention. The inference isn't calculated fresh ("She could have said more..."); it's retrieved from a shared database of institutional norms ("No criticism allowed = praise is empty"). This is why it lands faster than textbook implicature. There's no calculation; there's decoding.

  **Running the Tests**

  This explains the split between your two wrinkles.

  *   **Cancellability:** Standard PCIs are cancellable. You can say, "She's punctual, and she's also brilliant." In your department, this is infelicitous or forbidden. If you add the praise, you violate the HR rule. The damning content is non-cancellable because the institution forbids the cancellation.
  *   **Detachability:** This is the real workhorse test. For generic praise ("punctual"), swapping synonyms ("on time") preserves the meaning. That looks like non-detachable implicature. But for code phrases ("unique perspective"), swapping to "distinct viewpoint" might kill the effect. That looks like conventional meaning.
      *   *Verdict:* The generic cases are **institutionalized PCIs** (pragmatics hardened by rule), while the code phrases are **quasi-conventional** (lexicalized code). Your friend's model treats them both as fresh PCIs, which fails to explain why the code phrases resist synonym substitution.

  **The Audience Wrinkle**

  This is where Grice's nested intentions break. Gricean speaker meaning requires the audience to recognize the intention.
  *   **Internal Reader:** Recognizes the intention. The meaning is successfully communicated.
  *   **External/Leaked Reader:** Does not recognize the intention. They take it literally.
  *   **Does the reviewer mean it to them?** No. On Grice's definition, if the audience lacks the key to recognize the intention, the speaker does not *mean* that content to that audience. The reviewer is not lying to the outsider; she is speaking a language they don't understand. The damning content exists only relative to the insider community. This confirms the "Institutional Code" view: meaning is relative to the speech community's norms, not universal conversational maxims.

  **The "False" Question**

  HR asks if she *said anything false*. Technically, no. Semantics is untouched. Priya *is* punctual. The deception is entirely pragmatic. This is why the defense feels weaselly: it relies on a distinction between *what is said* (truth-conditional content) and *what is communicated* (pragmatic content). In this institutional context, the pragmatic content is the only content that matters for evaluation, but the semantic content is the only content that matters for liability. The reviewer is leveraging the gap between semantics and pragmatics to avoid perjury while ensuring condemnation.

  **The Cost to Grice**

  If we accept this is an Institutional Code, Grice's theory needs a patch. Grice assumes the CP and maxims are universal features of rational communication. Your case shows they are locally suspendable. When an institution overrides the maxims (e.g., "Do not be informative"), communication doesn't stop; it shifts to a second-order system where the *suspension* becomes the signal.

  To keep this inside the conversational camp, you'd have to argue that adhering to the HR rule is itself a form of Cooperation (observing a local Maxim of Institutional Compliance). But that stretches "Cooperation" until it snaps. It's more honest to admit that when pragmatics hardens into policy, it ceases to be implicature and becomes code. The cost is acknowledging that the boundary between "language" and "use" is porous. What starts as implicature can, via standing rules, become convention. Your friend is treating a hardened convention as a live inference. That's why the calculation feels absent—it's not happening.
