answer: |-
  ### Brainstorming & Strategy

  **Sharpening the Question**
  1.  **The Metaphysical Route:** "Individual contribution facts do not exist in joint production." *Dead end.* Game theory shows they *can* exist relative to an axiom set (Shapley vs. Nucleolus). Claiming non-existence is mathematically false; claiming indeterminacy is stronger.
  2.  **The Sociological Route:** "Meritocracy is a caste system disguised as math." *Dead end.* This is the "new hereditary caste" critique you mentioned. It's already done. It doesn't use the game theory leverage.
  3.  **The Normative/Conceptual Route (Selected):** "Desert requires a determinate object; joint production renders the object indeterminate; therefore desert claims in these contexts are category errors." This is the winner. It forces the meritocrat to choose a surplus-sharing rule without normative justification.
  4.  **The Institutional Route:** "Metrics create the reality they measure." *Supplementary.* This is the "metric capture" point. It's the practical upshot of the conceptual route.

  **Why the Selected Route?**
  It attacks the precondition of the debate. Luck egalitarians assume there *is* a contribution to which luck attaches. Efficiency defenders assume there *is* a contribution to maximize. You're arguing the contribution itself is underdetermined by the physical facts. This is logically prior to luck vs. desert.

  **What Breaks the Argument?**
  The argument fails if there is a unique normative justification for one solution concept (e.g., "Shapley is the only fair value"). You must argue that axioms like "null player" or "symmetry" are themselves normative choices, not mathematical necessities. If a critic can prove Shapley is *the* moral value, your indeterminacy claim collapses.

  **Metric Capture: Chapter or Footnote?**
  Chapter. It's the mechanism by which society resolves the indeterminacy you identify. If you stop at the math, it's abstract. If you show how institutions *force* separability via metrics (and thus distort production), you have a political theory, not just a puzzle. However, for a one-year fellowship, you must limit this to conceptual analysis of metric regimes, not empirical fieldwork.

  **1 Year vs. 3 Years**
  This is a three-year project trimmed to one. To fit: Cut the comparative analysis of multiple solution concepts (focus on Shapley vs. Equal Split). Cut empirical validation of metric capture (use existing case literature). The one-year goal is to establish the indeterminacy thesis, not solve distributive justice for teams.

  ***

  ### Dissertation Fellowship Proposal

  **Project Title:** The Indeterminacy of Merit: Cooperative Production and the Limits of Desert

  **Abstract**
  Contemporary debates over meritocracy assume a determinate fact of the matter regarding individual contribution. Luck egalitarians argue we shouldn't reward endowments; efficiency defenders argue we should reward output; critics argue meritocracy creates caste. All presuppose that "what someone contributed" is a coherent, isolatable fact. This project challenges that presupposition. In contexts of joint production—research teams, surgical units, software development—output is non-separable. Complementary interactions mean individual marginal product depends on the ordering of entry or the surplus-sharing rule selected. I argue that in these domains, meritocratic desert is not unfairly distributed; it is mathematically indeterminate. There is no fact for desert to track.

  **The Problem**
  Existing literature treats contribution as a pre-political fact subject to moral contamination (luck) or political selection (efficiency). This misses a logically prior problem: the unit of contribution is ill-defined in non-separable production functions. When output exceeds the sum of individual inputs, allocating credit requires choosing a solution concept (e.g., Shapley value, nucleolus, equal split). Each satisfies different axioms, yielding different "contributions" for the same physical output.

  The standard objection is that this indeterminacy is just brute luck in a costume—that the ambiguity itself is a luck factor to be equalized. This misdiagnoses the issue. Luck egalitarianism seeks to neutralize arbitrary influences on a determinate outcome. Here, the outcome itself is undefined until a normative rule is imposed. Neutralizing luck requires a baseline; indeterminacy denies the baseline. Consequently, meritocratic claims in joint settings are not false; they are category errors. They assert a determinate ranking where the mathematics permits only a set of valid rankings.

  **Methodology and Plan**
  I will not pursue straight conceptual analysis alone, nor will I conduct empirical intuition surveys. Conceptual analysis risks becoming unmoored from the mathematical reality of production; surveys risk codifying existing biases about legitimacy rather than testing the structure of contribution. Instead, I will employ a structured normative modeling approach. I will treat solution concepts from cooperative game theory as competing normative frameworks and analyze the axioms required to select among them.

  *   **Months 1–3:** Formalize the indeterminacy thesis. Map standard desert conditions onto cooperative game theory solution concepts. Demonstrate that no unique solution concept satisfies all standard desert axioms simultaneously.
  *   **Months 4–6:** Develop the "Indispensability vs. Contribution" distinction. Analyze cases where intuitive desert judgments slide between these two metrics in non-separable contexts. Establish that this slide reflects conceptual ambiguity, not merely cognitive bias.
  *   **Months 7–9:** Investigate "Metric Capture." Analyze how institutions install individual performance metrics to manufacture separability. Argue that these metrics do not discover contribution but alter the production function, thereby determining what can subsequently be deserved.
  *   **Months 10–12:** Synthesis and drafting. Integrate the theoretical indeterminacy with the institutional response. Draft the dissertation introduction and core chapters.

  **Success and Failure Conditions**
  A successful result establishes that meritocratic justification in joint production requires a normative choice of surplus-sharing rule that cannot itself be justified by contribution facts. I will be able to assert that efficiency and desert arguments in these contexts are circular: they presuppose the separability they aim to justify.

  The project fails if I cannot demonstrate that the choice of solution concept is normatively underdetermined. If a unique principle (e.g., a specific interpretation of fairness) uniquely selects one value (like Shapley) as the only morally permissible allocation, the indeterminacy thesis collapses. I will test this by attempting to construct a desert-based axiomatization that yields a unique solution; if I succeed, the project shifts from "indeterminacy" to "defense of specific axiom."

  **Scope Assessment**
  This is inherently a three-year project. A full treatment would require empirical validation of metric capture regimes and a comprehensive survey of all cooperative solution concepts. To fit a one-year fellowship, I am restricting the scope. I will focus exclusively on the incompatibility of desert conditions with non-separability, using metric capture as a closing theoretical chapter rather than an empirical study. I will limit the game-theoretic analysis to the three dominant solution concepts most relevant to labor allocation. This ensures a defensible completion date while retaining the core philosophical innovation: that the meritocracy debate is arguing over how to divide a pie when the geometry of the slices is undefined.

  **Significance**
  This project moves the debate beyond luck vs. effort. It suggests that restoring meritocracy is not possible by purging luck, because the "merit" in team-based economies is structurally indeterminate. This forces a shift toward explicit political justification for allocation rules, rather than hiding behind the metaphysics of contribution.
