      *   *Attempt 1 (Mental Outline):* You're right that the refund clause changes things. But you're missing that if you push the price too high, you lose money on the resolution. If you say "Sell" will create $100k value but it only creates $50k, you lose money even if "Sell" wins. So you still need to be honest about the outcome. Regarding the rich minority: yes, capital matters, but in voting, the intense minority also wins if turnout is low. We can fix the capital issue by subsidizing liquidity or allowing smaller stakes. The key is that the market aggregates information, not just preferences.

