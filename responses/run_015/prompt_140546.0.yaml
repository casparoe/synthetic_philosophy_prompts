      *   *Addressing the "Rich Minority":* Voting allows a passionate minority to win via turnout asymmetry too. But the capital constraint is real. Solution: The co-op can subsidize liquidity. Provide seed capital so members don't have to put up their own cash to correct mispricing. Or use a scoring rule instead of pure market stakes.

      *   *Drafting Paragraph 1:* Acknowledge the insight. You've identified the "governance attack" vector in conditional markets. If contracts are simply refunded on the losing branch, yes, you can lobby with capital without risk of loss *unless* your branch is chosen. But here's the crucial mechanic you're overlooking: once your branch is chosen, your contracts *do* resolve against the metric. If you pump the price of "Sell" to ensure it wins, you are effectively buying shares at an inflated price. If the actual well-being and assets don't match that inflated price, you lose your stake. The refund protects you from the co-op choosing the other path, but it doesn't protect you from your own hype. To manipulate the decision, you must be willing to bet real money that your branch will actually perform well enough to justify the price you pushed it to.

