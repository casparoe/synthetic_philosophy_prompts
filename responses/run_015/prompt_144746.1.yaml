answer: |-
  Dear Colleague

  You have asked me to translate the claim that karma is a theory of moral desert into the vocabulary of non-equilibrium thermodynamics and kinetics, and to report on what is lost in the translation. To restate the claim unsentimentally in your terms: an intentional act is a path function that does not merely traverse the state space but deforms the free-energy landscape for subsequent trajectories of the system. The normative remainder you describe translates to a hysteresis effect, where the history of the path alters the propensity field such that certain future states become attractors with higher probability basins. The assertion that the agent ought to undergo a consequence becomes the assertion that the system is statistically biased toward trajectories that dissipate the potential gradient created by the initial act. What does not survive this translation is the normative force itself. In your vocabulary, quantities are conserved or they are not, trajectories are probable or they are not, but nothing is fitting. The concept of desert requires a judge or a law that prescribes rather than describes, whereas kinetics offers only boundary conditions and transition states. The ought drops out entirely, leaving only an is that looks remarkably like fate.

  This loss brings us to your first suspicion regarding the ledger versus the landscape. The ledger model treats karma as a conserved quantity, a charge that is debited and credited until the balance is zero. This model fails structurally when confronted with the doctrine of liberation. In thermodynamics, a conserved quantity cannot be exhausted except by transfer out of the system or conversion into another form of energy that is still accounted for. If karma were a conserved charge, liberation would require a sink or an external receiver, which the doctrine generally denies. The landscape model, however, fits the structural requirement of exhaustion without violation. Here, liberation is an absorbing state. The agent does not pay off a debt; the agent exits the reactive manifold entirely, or the potential surface flattens such that no further gradients exist to drive motion. This is a real structural fit, not a pun. The landscape model also accommodates the graded weight of intention more naturally than the ledger. In a ledger, weight is merely magnitude of charge. In a landscape, intention determines the depth and shape of the deformation; a violent act digs a deeper well than a negligent one, altering the activation energy required to escape certain trajectories. However, the ledger model handles the transferability of karmic fruits better than the landscape. If karma is a currency, I can hand it to you. If karma is a deformation of your specific propensity field, it is unclear how I can transfer the consequences of my path to yours without assuming a coupled system where our landscapes are superimposed. The tradition does allow for merit transfer, which suggests either the ledger model has some operational utility or that sentient systems are sufficiently coupled that deforming one field induces strains in another.

  Your second suspicion concerns the persistence problem and the image of the flame. Given the doctrine of no-self, the object that persists cannot be a substance. The analogy of a flame passed from one candle to another, or a soliton propagating through a medium, is a genuine structural correspondence. It describes a dissipative structure that maintains continuity of pattern without conservation of matter. The flame is a process, not a thing, just as the karmic agent is a continuity of causation rather than a soul. This image carries the load of continuity without substance very well. What it cannot carry is the locus of responsibility. A flame does not own its heat. If the self is merely the propagating excitation, the notion that it deserves the consequence becomes difficult to anchor, reinforcing the loss of the normative element we noted earlier. Regarding the tradition's refusal to specify the mapping from acts to outcomes, this is neither coarse-graining nor a confession of a missing Hamiltonian. Coarse-graining implies the detail exists but is averaged out for utility. A missing Hamiltonian implies the rules are unknown. The tradition claims the rules are known to be too complex for the finite mind to compute. In your vocabulary, this is a system with such high dimensionality and sensitive dependence on initial conditions that prediction is computationally intractable, not ontologically vague. It is a declaration of chaos, not ignorance.

  This leaves us with the residue and the verdict. The parts of the desert claim that translate without loss are the causal continuity, the path-dependence, and the idea that earlier states constrain later probabilities. The parts that translate only after smuggling in an assumption are the graded weights of intention, which require us to assume the landscape deformation is morally aligned rather than physically arbitrary. The parts that have no counterpart are the strictly normative elements: the fittingness, the ought, the moral debt. You expect this element to drop out, and you are right. The question is whether this failure is a defect of a vocabulary built to describe systems, or a sign that the retributive reading of karma was always less determinate than it sounds. I take the side that it is a sign that the retributive reading is the error. The failure is not in the vocabulary of kinetics, but in the interpretation of the doctrine as moral desert. Karma functions in the texts primarily as a natural law of causal efficacy, not as a system of retributive justice. The decisive reason for this is the mechanism of liberation. If karma were moral desert, liberation would require satisfaction of the claim, a settling of accounts. Instead, liberation is achieved through insight, which changes the internal parameters of the system so that it no longer reacts to the gradients. One does not pay off the karma; one ceases to generate the conditions under which karma matures. This is the behavior of a catalyst changing a pathway, not a debtor paying a balance. The retributive reading requires a moral accountant to ensure fittingness, but the tradition explicitly removes the accountant and leaves only the mechanism.

  I would abandon this position only if textual evidence emerged showing that the early architects of the doctrine explicitly prioritized the satisfaction of moral justice over the cessation of causal conditioning. If they had framed liberation as the completion of a transaction rather than the exit from a cycle, the ledger model and the normative residue would have to be restored. But so long as liberation remains an absorbing state reached by changing the system's susceptibility rather than its balance, the kinetic model holds and the moral desert model is a projection onto a causal mechanism. The vocabulary of physical chemistry does not fail to capture the normativity because it is too reductionist; it fails to capture it because the normativity was never actually there in the machinery of the doctrine, only in the later philosophical desire for justice. You are left with a system of path-dependent constraints and propagating patterns, robust and explanatory, but stripped of the comfort that the suffering is fitting. It is merely the trajectory that remains available.

  Sincerely

  A Correspondent
