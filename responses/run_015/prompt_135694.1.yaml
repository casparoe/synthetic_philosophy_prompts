answer: |-
  Hello there, it was great to hear from you and I would be happy to help you flesh out this exam material. It sounds like a fascinating course design that bridges empirical psychology with normative ethics, which is exactly where the field needs to go. Below I have drafted the essay prompt you requested, followed by a model answer that demonstrates the depth of reasoning you should expect from an upper-level student, and finally I have included a marking scheme written in prose that outlines how to distinguish between competent and excellent responses based on the specific philosophical moves required. Please feel free to adjust the wording to better match your voice or the specific terminology you have used in lectures.

  Here is the text for the exam question. Recent empirical work in moral psychology highlights significant variation between WEIRD and non-WEIRD societies, leading some to argue that cultural diversity threatens moral objectivity. Consider the distinction between ecological calibration, where norms adaptively track environmental pressures like resource scarcity, and coordination noise, where norms function as arbitrary equilibria similar to driving on the left versus the right. Does isolating coordination noise save moral objectivity, or does it merely relocate the burden onto proving that calibrated norms are genuinely correct rather than merely useful? Explain why the arbitrariness of noise does not automatically secure objectivity for the remaining norms. Your answer should address whether an evolutionary explanation of calibrated norms undermines their claim to truth.

  Below is a model response that runs approximately seven hundred words and hits the key philosophical notes. The existence of cross-cultural moral variation does not inherently refute moral objectivity, but merely distinguishing between ecological calibration and coordination noise is insufficient to save it. While separating coordination noise from calibrated norms helps clarify the structure of moral disagreement, it fails to resolve the deeper metaethical challenge regarding the truth-aptitude of the calibrated norms themselves. Coordination noise refers to arbitrary conventions that solve cooperation problems without any intrinsic moral value, such as specific greeting rituals or dietary taboos unrelated to health. The fact that these norms are arbitrary does not imply relativism, because their arbitrariness is localized. Just because the side of the road we drive on is arbitrary does not mean the rule that we must coordinate is arbitrary. However, acknowledging that some norms are noise does not automatically validate the objectivity of the remaining norms. The objectivist cannot simply claim that because some variation is noise, the rest must be signal. This is a false dichotomy that ignores the possibility that all folk morality is ultimately grounded in non-truth-apt psychological mechanisms.

  The more significant threat to objectivity lies within the category of ecological calibration. These are norms that track real environmental pressures, such as norms of fairness emerging in large-scale anonymous markets versus kin-based reciprocity in small-scale societies. An objectivist might argue that because these norms track real features of the world, they are objective. However, this conflates adaptive utility with moral truth. An evolutionary debunking argument suggests that even if a norm is calibrated to environmental pressures, it was selected for fitness, not truth. For example, a norm restricting resource consumption during scarcity might be ecologically calibrated, but its existence is explained by survival value, not by the independent moral truth that hoarding is wrong. To save objectivity, one must show that the calibration process tracks moral facts, not just survival facts. Without an independent normative standard, the claim that calibrated norms are correct is circular. We cannot use the fact that a norm was evolutionarily useful to prove it is morally right, because usefulness and rightness are distinct categories.

  Furthermore, the failure of coordination noise to be objective does not help the objectivist because it leaves the substantive moral questions unanswered. Showing that purity rules about left-hand use are arbitrary only clears the deck of trivialities. It does not provide positive evidence for the objectivity of core moral principles like justice or harm. The objectivist must still demonstrate that there are moral facts that exist independently of human psychology and environmental pressures. If the only defense of objectivity is that some norms are not arbitrary, the position remains vulnerable to the claim that non-arbitrary norms are merely instrumental. Therefore, the distinction between calibration and noise is analytically useful but metaphysically insufficient. It refines the debate by removing arbitrary cultural artifacts from the pool of candidate moral truths, but it does not bridge the is-ought gap for the remaining calibrated norms. To secure objectivity, one must argue that the environmental pressures being tracked are themselves morally relevant, which requires a normative theory external to the evolutionary explanation. Until that independent standard is provided, the threat of evolutionary debunking remains potent even for calibrated norms.

  For grading this essay, you should look for specific argumentative moves that separate an A grade from a B grade. A B grade response will typically describe the distinction between ecological calibration and coordination noise accurately and may note that noise is arbitrary. However, an A grade response must explicitly handle the evolutionary debunking argument specifically for calibrated norms, recognizing that adaptive utility does not equal moral truth. They must also explain why arbitrary variation does not license relativism, noting that local arbitrariness does not imply global subjectivity. Finally, the top-tier answer must show that calibration requires an independent normative standard to avoid circularity, rather than assuming that tracking environmental pressure constitutes moral correctness. If a student merely summarizes the psychological distinction without addressing the normative gap, they should not receive top marks. I hope this helps you finalize the exam and please let me know if you need any adjustments to the tone or content.
