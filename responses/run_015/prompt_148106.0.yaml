answer: |-
  The debate over moral testimony is often framed as a standoff between optimists, who treat moral claims like any other factual report, and pessimists, who insist there is something distinctively defective about forming moral beliefs on say-so. However, this framing obscures a crucial distinction within the pessimist camp. When pessimists claim deference is defective, do they mean the resulting mental state fails to constitute genuine moral understanding (an epistemic complaint), or do they mean the agent has violated a normative duty to exercise their own moral competence (an agency complaint)? The epistemic reading suggests that without grasping the reasons, you do not truly hold the moral belief you purport to hold. The agency reading suggests you may have the belief, but you have bypassed a responsibility to think for yourself. To make progress, we must settle which reading is defensible. The epistemic reading is too strong; the agency reading captures the true cost of deference.

  The strongest version of the epistemic complaint argues that moral concepts are inherently reason-involving. To believe an act is "wrong" is not merely to tag it with a label but to grasp the features that make it so. If you accept a verdict without seeing the wrong-making features, your state is hollow; you possess a true belief, but not moral knowledge. This view has significant force. It explains why moral deference feels different from deferring on history or science; in those domains, facts can stand apart from our grasp of their causes, whereas moral truths seem constitutively tied to our recognition of reasons. If this reading were correct, wholesale moral deference would be impossible, as one cannot grasp reasons one has not processed.

  However, the epistemic reading collapses when confronted with the experience-advantaged advisor. Consider an advisor who shares your principles but has lived through the situation you are judging. They tell you a remark was degrading. You lack the phenomenological experience to fully grasp *why* it was degrading in the way they do, yet it seems perverse to deny you have gained moral knowledge. You understand the principle; you lack only the data. If the epistemic reading were true, this gap in phenomenological grasp would negate knowledge. But intuitively, deferring here is not defective. This suggests the defect in problematic deference is not a lack of constitutive understanding, but a failure of agency. The agency reading holds that moral judgment is a practical capacity we owe it to ourselves and others to exercise. The defect is not that the belief is false or empty, but that the agent has outsourced the work of valuation. This reading allows for moral knowledge via testimony but flags a normative deficit in how it was acquired.

  Running this agency-based reading through the value-divergent case clarifies its strength. Here, an advisor weights loyalty more heavily than you do and tells you firing a contractor was wrong. If you defer, you adopt a verdict grounded in a weighting you do not endorse. Under the agency reading, this is distinctively problematic because you are acting on reasons that are alien to your own normative framework. You are not merely filling in data gaps; you are substituting another's valuation for your own. This creates a form of moral alienation where your action is not truly yours, even if the verdict is correct. The defect is not that you lack knowledge—you know what she believes and why—but that you have failed to own the judgment. Deference here is unacceptable because it supplants rather than supplements your agency.

  Contrast this with the experience-advantaged case. Because you share the principles, deferring to the advisor's judgment about the remark does not alienate you from your values. You are using their testimony to apply *your* standards to a complex reality. The agency reading permits this because you remain the author of the valuation; the advisor merely provides the empirical premises necessary for your principles to engage. Deference is acceptable here because it serves your agency rather than bypassing it.

  The group verdict case presents a harder challenge for the agency reading. A committee issues a verdict based on disjoint, conflicting reasons; no single member's reasoning is reconstructible by you, yet the outcome is robust. Is this deference worse than deferring to an individual? If the defect is bypassing personal reasoning, this looks catastrophic: you cannot even reconstruct the reasoning you are deferring to. However, this is not a counterexample to the pessimist framing, but a complex instance of it. The agency reading can salvage institutional deference if the agent endorses the *procedure* that generated the verdict. If you trust the committee's deliberative structure as a reliable extension of moral inquiry, you are not blindly outsourcing judgment but participating in a distributed agency. You owe it to yourself to vet the process, if not every premise. If you cannot endorse the procedure, however, the defect remains: you are accepting a verdict that no single agent, including yourself, fully owns. Institutional deference is acceptable only when the institution functions as a transparent proxy for your own deliberative capacities.

  Finally, consider after-the-fact ratification. If you later work through the reasoning and endorse the verdict you originally took on trust, does this cure the defect? Under the agency reading, the defect was a failure to engage at the time of decision. Ratification restores the connection between agent and reason for future action, allowing you to now act for the reasons there actually are. However, it does not erase the history of the initial decision. The initial act remained one of deference, not ownership. Ratification cures the forward-looking defect—you are no longer alienated from the belief—but it does not retroactively validate the initial bypass of judgment. This confirms that the defect is temporal and procedural, rooted in the moment of acquisition, rather than a permanent stain on the belief's content.

  In conclusion, the agency-based reading is the more defensible interpretation of the pessimist intuition. It avoids the implausible denial of moral knowledge in experience-based cases while preserving the core insight that moral judgment requires personal engagement. Moral deference is unacceptable when it involves adopting value weightings you do not share (value divergence) or when it relies on opaque processes you cannot endorse (bad institutional deference). It is acceptable when it supplies empirical data to your own principles (experience advantage) or when it relies on vetted deliberative procedures (good institutional deference). The phenomenon of aggregated deference is not a counterexample to pessimism but a test of whether our institutions can extend our agency without replacing it. The pessimist is right that we owe it to ourselves to think, but wrong to think that thinking cannot be supported by the testimony of others.
