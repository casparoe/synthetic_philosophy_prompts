      **FOR IMMEDIATE RELEASE**
      **Institute for Complete Physical Description**
      **Office of Communications**

      **SUBJECT: MARY RELEASED; EPISTEMIC INVENTORY UNCHANGED**

      **WASHINGTON, D.C.** — The Institute for Complete Physical Description (ICPD) today confirmed the successful release of Subject Mary from the Chromatic Deprivation Chamber. While media reports suggest Mary experienced a "revelation" upon viewing a red tomato, the ICPD maintains that no new propositional knowledge was acquired. The physical facts remained constant; only Mary's internal indexing system was updated.

      **Statement from Director Dr. Aris Thorne:**
      "The experiment was a triumph for physicalism. Mary knew all the physical facts about light wavelengths and neural processing before exit. Her subsequent exclamations were merely physiological responses to stimulus integration, not evidence of non-physical properties. We anticipated the surprise. Surprise is a physical state, not an epistemic metric."

      **FREQUENTLY ASKED QUESTIONS**

      **Q: Did Mary learn a new fact about the world?**
      A: No. Mary acquired a new *phenomenal concept* for a fact she already possessed under a physical mode of presentation. The fact—that specific wavelengths reflect off surfaces—remained identical. She simply accessed this existing data through a new cognitive file folder. The ontology is unchanged; only the filing system was upgraded.

      **Q: Then why was she surprised?**
      A: The completeness of physics is a claim about which facts exist, not about whether subjects are emotionally prepared for them. Mary's surprise is a neural event fully describable by physics. Her expectation was a prediction error in her motor cortex, not proof of a metaphysical gap. You can be surprised by a math proof you already know; this is similar, but wetter.

      **Q: What about her new ability to recognize red?**
      A: Under the Ability Hypothesis, Mary gained knowledge-*how*, not knowledge-*that*. She can now discriminate, imagine, and remember red stimuli. These are behavioral competencies, not truths about the universe. Knowing how to ride a bike does not imply new physics, and knowing how to recognize red does not imply qualia.

      **Q: Critics say she became "acquainted" with redness.**
      A: We acknowledge Mary entered a direct acquaintance relation with the property. However, acquaintance is non-propositional. It is a relation, not a fact. You can be acquainted with a person without learning new biographical data. Mary is now acquainted with the physical property, but no new truth conditions were added to her worldview.

      **Q: We understand there was a control subject?**
      A: Yes, RoboMary. She was fitted with a color-recognition module prior to release. Upon exit, RoboMary reported zero surprise and immediately categorized the tomato correctly. We find her testimony more reliable for our current press purposes. As RoboMary stated, "My sensors detected 650nm wavelengths. No update required."

      **Q: What about Frank Jackson, who originally proposed the argument?**
      A: Dr. Jackson eventually abandoned the Knowledge Argument in 2003, conceding that physicalism could account for the data. We view this as a longitudinal validation of our model. Former dualists are welcome to apply for our re-education grants.

      **NEXT STEPS**
      The ICPD has allocated Q3 budget for "Non-Propositional Enrichment" and a mandatory "Phenomenal-Concept Training Seminar" for staff to ensure future press releases distinguish correctly between modes of presentation and facts themselves.

      ### Author's Notes

      I think the Phenomenal Concept Strategy is the strongest physicalist reply because it grants the intuition (something feels new) while denying the metaphysical conclusion (nothing *is* new). It's the hardest to dismiss outright. I put the Ability Hypothesis in mainly because it's easy to mock; reducing the vividness of red to "knowing how" feels like a category error begging to be satirized as bureaucratic HR speak. The satire might misfire for a reader who is already a committed dualist; they won't see the irony in the Institute's gaslighting, they'll just see it as confirmation that physicalists are blind to reality. The joke relies on the reader understanding that the physicalist *should* feel the tension, but is choosing to ignore it for the sake of the system.
