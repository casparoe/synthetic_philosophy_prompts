prompt: |-
  I edit the science-and-ideas desk at a national newspaper and write a weekly column, and I am trying to repair something about how we decide what to run. Two or three times a week a study arrives — usually a preprint, or a journal paper under embargo — and the operative question at our morning conference has quietly stopped being whether the finding is true and become who else has it. The honest description of our workflow is: check whether the wires and two or three respected competitors have moved, and if they have, move ourselves; if nobody has, treat that as a reason for caution. Having read a general-audience account of informational cascades and rational herding, I now suspect both halves of that workflow can be given a rational defence and that neither defence is obviously sound — which is to say I cannot tell, in a given case, whether the crowd is telling me something about the world or only about itself.

  My own provisional taxonomy, which I would like you to correct as well as use, has four entries. First, evidence pooling: many parties converge because each saw something independently, and the convergence is genuinely informative. Second, cascade proper: later actors hold private signals but their public behaviour is swamped by what earlier actors did, so their information never becomes public and the twentieth follower adds nothing to the nineteenth. Third, imitative or reputational herding: actors match the crowd because being wrong alongside the crowd is cheaper than being wrong alone, in which case the crowd carries no information about the world at all, only about incentives. Fourth, a case I have not seen discussed and that I think is the common one in my trade: apparent independence that is an artefact, where everyone's private signal traces back to the same press release, the same dataset, the same measurement instrument, the same small circle of labs, or the same initial wave of coverage.

  I would like you to turn whatever survives in that taxonomy into a written decision procedure my reporters can actually run. Concretely: the desk has no statistician, one fact-checker, a section editor who signs off on anything that deviates from what competitors are doing, and about thirty minutes between the embargo lifting and the moment a decision has to be made. So I need ordered tests, not an essay; what counts as a sufficient answer to each question; what to do when the number or the document a test calls for cannot be obtained; the points at which the procedure returns a flat no; and the points at which it must hand the decision to a person because the remaining question is one of values rather than evidence — news value against the cost of amplifying a false claim, and against the cost to us of being seen to have sat out a real one.

  I should also say what I have been using informally, so you can tell me which parts to throw away. I count distinct upstream sources rather than outlets, on the theory that thirty stories from one press release is one source. I apply something like a defector rule: a single detailed dissent from someone with access to the data is worth more than twenty follow-ups, and I weight it accordingly. I treat silence as ambiguous rather than as evidence against a claim, since I suspect the failure to publish null results is itself a herd phenomenon. And I treat our own earlier coverage of a claim as a reason to scrutinise a new result harder, not as a reason to stand pat.

  Please run the finished procedure on three hypotheticals. One: a psychology preprint, roughly two hundred participants, a counterintuitive result about an everyday habit, thirty outlets inside forty-eight hours, all traceable to a single university press release, no independent dataset, and a reporter on my desk who is convinced. Two: a geophysics result about ocean heat, three groups, different methods and different underlying data, covered by two specialist outlets and ignored by everyone else, with the desk inclined to skip it as already covered. Three: a preprint failing to replicate a finding we ourselves ran prominently eight months ago, from a mid-sized lab, covered by one small newsletter and no one else, with competitors silent and no obvious appetite anywhere for the story.

  I want a committed response rather than a survey. Fix one ordering of the tests and defend it; tell me which single test you would keep if I could keep only one; give a definite verdict on each of the three cases, including the third, where I expect the verdict to be one I would rather not hear; say which of my four informal rules are wrong or misfire; and state plainly what the procedure cannot do, so I do not end up presenting it to the section editor as more than it is. If a step depends on a technical result from the literature on herding, state the result in one sentence and flag whether it is contested, but do not give me citations, references, or a reading list: I cannot act on those, and I will not check them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Editor of the science-and-ideas desk at a national newspaper. Writes a weekly column.
      *   **Problem:** The editorial workflow has devolved into herding ("who else has it?" vs. "is it true?"). The user suspects this is a mix of rational herding and informational cascades but can't distinguish them in real-time.
      *   **Goal:** A written decision procedure for reporters/editors to use *before* publishing.
      *   **Constraints:**
          *   No statistician.
          *   One fact-checker.
          *   Section editor signs off on deviations.
          *   Time limit: ~30 minutes between embargo lift and decision.
          *   Format: Ordered tests, not an essay. Clear pass/fail criteria. Escalation points for value judgments.
          *   Output: Committed response (fix one ordering, defend it, pick the single most important test, verdict on 3 hypotheticals, critique user's informal rules, state limitations).
          *   No citations/reading lists (summarize technical results in one sentence if needed).
      *   **User's Taxonomy:**
          1.  Evidence Pooling (Independent convergence = informative).
          2.  Cascade Proper (Private signals swamped by public behavior = later adds nothing).
          3.  Imitative/Reputational Herding (Safety in numbers = no info about world).
          4.  Artefactual Independence (Same source/data/PR = illusion of independence).
      *   **User's Informal Rules:**
          1.  Count upstream sources, not outlets.
          2.  Defector Rule (one detailed dissent > twenty follow-ups).
          3.  Silence is Ambiguous (null results often unpublished).
          4.  Prior Coverage = Harder Scrutiny (not standing pat).

  2.  **Deconstruct the Taxonomy & Informal Rules:**

      *   *Taxonomy:* The four categories are sound conceptually. Category 4 (Artefactual Independence) is the critical one for journalism. It's the "common cause" problem.
      *   *Informal Rules:*
          1.  *Count upstream sources:* Good. Essential for distinguishing Type 1 from Type 4.
          2.  *Defector Rule:* Good. Aligns with cascade theory (one private signal breaking the chain).
          3.  *Silence is Ambiguous:* Dangerous in a 30-minute window. While true academically (publication bias), operationally, silence *is* a signal of caution in a breaking news context. I need to refine this.
          4.  *Prior Coverage = Harder Scrutiny:* Good. Prevents doubling down on errors.

  3.  **Design the Decision Procedure (The "Protocol"):**

      *   *Time:* 30 minutes. Needs to be fast.
      *   *Steps:* Needs to filter out the "Artefactual Independence" first, then check for "Evidence Pooling," then assess "Cascade/Herding" risk.
      *   *Ordering:*
          1.  **Source Provenance (The "Upstream" Test):** Is this actually independent? (Addresses Taxonomy #4).
          2.  **Methodological Robustness (The "Defector" Test):** Is there internal or external dissent? (Addresses Taxonomy #2 & User Rule #2).
          3.  **Incentive Alignment (The "Reputation" Test):** Why are others running/skipping this? (Addresses Taxonomy #3).
          4.  **Escalation:** When to call the Section Editor.

      *   *Refining the "Silence" Rule:* In a 30-minute window, you can't prove publication bias. You must treat silence as a *risk factor*, not definitive evidence against, but enough to trigger escalation if the claim is high-stakes.

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Test 1: Upstream Count.* If N outlets > 1 but Upstream Sources = 1, flag as "Artefactual." Verdict: Do not run as "consensus." Run as "single study."
      *   *Test 2: The Dissent Check.* Search for pre-existing critiques or data conflicts. If found, weight heavily.
      *   *Test 3: The Silence Check.* If major competitors skip a high-profile embargo, why?
      *   *Decision Node:* If Test 1 fails (only 1 source) AND claim is high impact, escalate.

  5.  **Addressing the Specific Requirements:**

      *   *Defend the Ordering:* Why Provenance first? Because it's the fastest check and eliminates the illusion of consensus immediately.
      *   *Single Most Important Test:* Upstream Source Count. It distinguishes Truth (Pooling) from Illusion (Artefact).
      *   *Verdicts on Hypotheticals:*
          1.  *Psych Preprint:* 30 outlets, 1 PR. **Verdict: NO** (or heavily qualified). It's a Cascade/Artefact.
          2.  *Geophysics:* 3 groups, different data, ignored. **Verdict: YES** (with context). It's Evidence Pooling disguised as silence.
          3.  *Replication Failure:* We ran the original, now a failure, silence elsewhere. **Verdict: YES** (Escalate). This is the "Defector" scenario. Hard to run, but necessary for integrity.
      *   *Critique Informal Rules:* "Silence is Ambiguous" is the weak link operationally. It needs to be "Silence is a Risk Flag."
      *   *Limitations:* This procedure cannot verify truth. It verifies *informational independence*. It cannot stop reputational herding if the whole industry is corrupt.

  6.  **Refining the Tone:**

      *   The user is an intellectual peer (editor of science/ideas). Tone should be professional, direct, slightly academic but operational. No fluff.
      *   "Committed response." No hedging.

  7.  **Final Review against Constraints:**

      *   30 minutes? Yes, the tests are quick searches.
      *   No statistician? Yes, relies on source counting and reading abstracts/press releases.
      *   Escalation points defined? Yes.
      *   Hypotheticals answered? Yes.
        No citations? Yes.

  8.  **Self-Correction/Nuance Check:**

      *   *Hypothetical 3 (Replication Failure):* This is the hardest. If we ran the original, running the failure looks like flip-flopping. But *not* running it hides the truth. The procedure must force this to the Editor because it's a values call (integrity vs. consistency). I will rule "Escalate to Editor with Recommendation to Run."
      *   *Hypothetical 1 (Psych Preprint):* Standard herd. The procedure should kill the "consensus" angle. Can we run it as a single study? Only if high news value. I'll say "No" to running it as a breakthrough, "Yes" to a brief mention if the habit is ubiquitous, but flagged heavily. Let's make it a hard "No" on the *main* treatment to emphasize the filter's strength.
      *   *Hypothetical 2 (Geophysics):* This is the "Evidence Pooling" gold mine. The procedure must identify the 3 independent groups. Verdict: Run.

      *   *Critique of User's "Silence" Rule:* I need to be firm here. In a 30-minute window, treating silence as merely ambiguous is dangerous. It must be treated as a negative signal that requires justification to override.

      *   *Technical Result:* "In an informational cascade, once the public history outweighs private signals, subsequent actions convey no new information." (Flag: Robust in theory, sensitive to noise in practice).

  9.  **Final Polish:** Organize into the requested sections: Procedure, Defense, Single Test, Hypotheticals, Critique of Rules, Limitations. Ensure the voice is authoritative.

  *(Self-Correction during drafting)*: Make sure the "Decision Procedure" looks like a checklist, not prose. Use bolding for actions. Ensure the "Escalation" points are clear.

  *(Refining the "Silence" critique)*: The user says "treat silence as ambiguous." I should argue that for *breaking news*, silence is a signal of low confidence by competitors who may have seen the same embargo. It's not publication bias (long term), it's editorial caution (short term).

  *(Refining Hypothetical 3)*: The user expects a verdict they "would rather not hear." That implies they want to run it but fear the fallout, or they don't want to run it but know they should. Given they value truth ("science-and-ideas"), the "unpleasant verdict" is likely that they *must* run the correction/replication failure even if it undermines their past brand. I will take that stance.

  Let's assemble.cw
answer: |-
  ### The Independence Protocol

  **Objective:** Distinguish between genuine consensus (Evidence Pooling) and illusory consensus (Cascade/Artefact) within 30 minutes.
  **Personnel:** Assigning Reporter (AR), Fact-Checker (FC), Section Editor (SE).

  #### Step 1: The Upstream Count (Time limit: 5 minutes)
  **Action:** AR identifies the primary source document for every competing story currently filed or embargoed.
  **Test:** Count distinct *upstream* sources, not outlets.
  *   **Pass:** Two or more distinct datasets, labs, or principal investigators.
  *   **Fail:** All stories trace to one press release, one preprint, or one lab group.
  **Decision:**
  *   If **Fail**: You are in a Cascade or Artefact. You cannot claim "scientists find." You must claim "a study suggests." Proceed to Step 2.
  *   If **Pass**: You have Evidence Pooling. Proceed to Step 3.

  #### Step 2: The Dissent Search (Time limit: 10 minutes)
  **Action:** FC searches for public critiques, conflicting preprints, or methodological flags regarding the specific upstream source identified in Step 1.
  **Test:** Is there a credible, specific defection?
  *   **Pass:** No detailed dissent found.
  *   **Fail:** One or more experts with data access have publicly flagged fatal errors, or a conflicting dataset is already public.
  **Decision:**
  *   If **Fail**: **STOP.** Do not run the claim as fact. You may run the controversy itself (see Escalation).
  *   If **Pass**: Proceed to Step 3.

  #### Step 3: The Silence Audit (Time limit: 10 minutes)
  **Action:** AR checks the "respectable competitors" (wires + 3 key rivals) for *absence* of coverage on a high-profile embargo.
  **Test:** Is the silence explainable by niche subject matter, or is it a mainstream claim being ignored by peers who had the same embargo?
  *   **Pass:** Subject is niche, or competitors are running it.
  *   **Fail:** Claim is high-impact/broad interest, embargo was widespread, but key competitors have spiked it.
  **Decision:**
  *   If **Fail**: **ESCALATE.** This indicates Reputational Herding (others are hiding) or superior vetting (others saw a flaw you missed).
  *   If **Pass**: Proceed to Filing.

  #### Step 4: Escalation Node (Time limit: 5 minutes)
  **Trigger:** Step 1 Fail + High Impact Claim OR Step 3 Fail.
  **Action:** AR presents the finding to the Section Editor.
  **Question for SE:** "Is the news value of being first/alone worth the reputational cost of being the only outlet carrying this if it retracts?"
  **Verdict:** SE decides. AR files with explicit caveats mandated by SE.

  ***

  ### Defense of Ordering

  I have placed **The Upstream Count** first because it is the only test that is binary, fast, and immune to interpretation. In a 30-minute window, you cannot assess statistical validity, but you can count press releases. This immediately collapses your Taxonomy categories #1 (Evidence Pooling) and #4 (Artefactual Independence). If you fail Step 1, you know you are not observing independent convergence; you are observing a single signal amplified. There is no rational defence for treating a single press release as a consensus, regardless of how many outlets pick it up.

  Step 2 follows because a single defection breaks a cascade. If Step 1 confirms a single source, Step 2 checks if that source is rotten. Step 3 is last because interpreting silence is the most cognitively demanding task; it requires context about competitors' editorial policies. You only need to do that heavy lifting if the story survives the first two filters.

  ### The Single Test

  If you can keep only one, keep **Step 1: The Upstream Count**.

  **Reason:** It is the only mechanism that distinguishes truth-seeking from herd-following. A crowd of thirty outlets repeating one press release contains less information than one outlet verifying two datasets. This test forces your staff to look behind the curtain of "coverage" to see the "source." It prevents the specific failure mode you identified: treating the *volume* of coverage as evidence of *validity*.

  ***

  ### Verdicts on Hypotheticals

  **Case 1: Psychology Preprint (30 outlets, 1 PR, 200 participants)**
  *   **Step 1:** Fail (1 upstream source).
  *   **Step 2:** Pass (No dissent yet).
  *   **Step 3:** Fail (Everyone has it, so silence isn't the issue, but the uniformity is).
  *   **Verdict:** **NO.** Do not run as a discovery.
  *   **Rationale:** This is a pure Informational Cascade. The thirty outlets add zero information after the first one. The sample size (200) for a counterintuitive claim is low. Running this contributes to noise. If you must run it, it is a story about *the press release*, not the habit.

  **Case 2: Geophysics Result (3 groups, different data, ignored)**
  *   **Step 1:** Pass (3 distinct upstream sources).
  *   **Step 2:** Pass (No dissent).
  *   **Step 3:** Fail (Silence from mainstream competitors).
  *   **Verdict:** **YES (Escalate to SE).**
  *   **Rationale:** This is genuine Evidence Pooling masked by silence. The silence is likely due to complexity (geophysics) rather than skepticism. Because Step 1 passed, the silence is an opportunity, not a warning. The SE must approve the deviation from competitors, but the evidence structure is sound.

  **Case 3: Replication Failure (We ran original, now failure, 1 newsletter, silence)**
  *   **Step 1:** Pass (New dataset vs. old dataset).
  *   **Step 2:** Pass (The study *is* the dissent).
  *   **Step 3:** Fail (Competitors silent; we are the only ones who ran the original).
  *   **Verdict:** **YES (Escalate to SE).**
  *   **Rationale:** This is the "Defector Rule" in action. The silence is reputational herding by competitors who don't want to touch a controversy, or ignorance. For you, silence is not an option because you are part of the history (you ran the original). Not running this is an active concealment of the scientific record. The SE must weigh the cost of admitting error against the cost of misleading readers. The procedure dictates you *must* ask the question.

  ***

  ### Critique of Your Informal Rules

  1.  **"Count distinct upstream sources":** **KEEP.** This is the core of the protocol. It is the only way to detect Artefactual Independence.
  2.  **"Defector Rule":** **KEEP.** This aligns with the theory of cascades: one private signal revealed can restart the information flow. It is your highest-leverage heuristic.
  3.  **"Silence is Ambiguous":** **DISCARD.** In a 30-minute breaking news window, silence is a **Negative Signal**. While publication bias exists over years, editorial caution exists in minutes. If three rivals had the same embargo and spiked it, they likely saw a flaw you missed. Treat silence as a risk factor that requires justification to override, not as neutral noise.
  4.  **"Prior Coverage = Harder Scrutiny":** **REFINE.** It is not just scrutiny; it is **Liability**. If you covered the original, you are not an observer; you are a participant. The threshold for running a replication failure of your own story must be lower than for a stranger's story, because your brand equity is already tied to the claim.

  ***

  ### Limitations of the Procedure

  State this plainly to your Section Editor:

  1.  **It Does Not Verify Truth:** This protocol assesses *informational independence*, not factual accuracy. A study can pass all steps (independent, no dissent, no silence) and still be wrong. It minimizes the risk of herding, not the risk of error.
  2.  **It Cannot Fix Industry-Wide Corruption:** If all upstream sources share a biased dataset or a conflicted funding source (a "common cause" beyond the press release), Step 1 will pass, but the conclusion will still be false. This protocol assumes the upstream sources are honest, even if correlated.
  3.  **It Shifts Risk, It Does Not Remove It:** Following this procedure will cause you to miss "scoops" that turn out to be true but looked like cascades (false negatives), and it will force you to run "corrections" that look like flip-flops (Case 3). It optimizes for long-term credibility over short-term traffic.
  4.  **Technical Constraint:** The definition of "distinct upstream source" relies on reporter judgment. If two labs use the same underlying survey data but analyze it differently, Step 1 may falsely Pass. This requires reporter training, not just a checklist.

  **Technical Note on Herding:** *In an informational cascade, once the public history of actions outweighs private signals, subsequent actors rationally ignore their own information, making their actions uninformative to observers.* (Flag: This is theoretically robust but assumes actors are rational; in journalism, actors are often merely hurried.)
