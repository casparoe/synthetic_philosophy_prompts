answer: |-
  You have not found a glitch; you have found the engine room. What you are describing is a documented, robust, and deeply uncomfortable social phenomenon. It sits at the intersection of anthropology, political science, and the philosophy of language.

  There is no single English word that perfectly captures every nuance you've described, but the established concept nearest to it is the **Charter Myth** (from anthropology), refined by the philosophical concept of a **Constitutive Fiction**.

  If I were to coin a term that fits your specific carving—one that distinguishes it from simple lies or beliefs—I would call it a **Charter Fiction**.

  Here is the carving you asked for: what it is, how it differs from its neighbors, how it handles the edges, and why your question about "record vs. memory" might be a category error.

  ### 1. The Carving: What is a Charter Fiction?

  To understand this, we have to distinguish between two ways language works.
  *   **Constative:** A statement that describes the world (e.g., "The clock cost £50"). It can be true or false.
  *   **Performative:** A statement that *does* something in the world (e.g., "I pronounce you married," or "We refuse this seat").

  A **Charter Fiction** looks constative (it talks about past events), but it functions performative. It is not a claim about *what happened*; it is a tool for *what we can do now*.

  In your first case, the story "the workers paid for the clock" is not a historical hypothesis. It is a **status function**. It confers a specific social status on the clock (it belongs to us, not the owner) and on the group (we are the heirs of the workers). When you suggested correcting the story, you didn't offer a better historical description; you accidentally pulled the load-bearing wall out of the room. The panic wasn't about history; it was about the sudden realization that without the fiction, the *ritual* (standing under the clock) had no script.

  In the second case, the flood story is a **coordination token**. It allows the valley to coordinate a refusal to cooperate with the authority. The story is the "password" that allows them to say "we don't trust them." If they accept the logs are right, they lose the password. They don't lose the *right* to distrust the authority, but they lose the *shared mechanism* for enacting that distrust.

  **Why it dies when corrected:**
  An ordinary false belief updates when corrected (I think it's raining; you show me the sun; I update). A Charter Fiction collapses because its utility depends on its *ambiguity* or its *symbolic weight*, which factual precision dissolves. It is like a currency note: if you analyze the paper and ink, it's just pulp. It only works if everyone agrees to treat it as value. Correcting the story is like analyzing the ink—it stops being money and starts being paper.

  ### 2. Differentiation: The Four Neighbors

  You asked how this differs from four specific things. Here is the boundary line for each.

  **A. vs. Ordinary False Belief**
  *   **False Belief:** The group thinks $X$ happened. If shown evidence of $Y$, they feel *surprised* and update their model of the world.
  *   **Charter Fiction:** The group *suspects* or *knows* $Y$ happened, but treats $X$ as true. If shown evidence of $Y$, they feel *threatened*.
  *   **The Split:** A false belief is about *mapping reality*. A Charter Fiction is about *maintaining cohesion*.

  **B. vs. Literal Myth (Sacred Story)**
  *   **Literal Myth:** The group believes the story is supernaturally or historically sacred. Challenging it is blasphemy.
  *   **Charter Fiction:** The group treats the story as pragmatically sacred. Challenging it is *socially disruptive*.
  *   **The Split:** In a literal myth, the truth value matters to the believers. In a Charter Fiction, the truth value is irrelevant to the function, but acknowledging that irrelevance breaks the spell.

  **C. vs. Propaganda / Useful Lie**
  *   **Propaganda:** Top-down. Elites tell the lie to the masses to control them. The elites know it's false; the masses (usually) believe it.
  *   **Charter Fiction:** Bottom-up or Collusive. Everyone (or everyone who matters) knows it's shaky, but everyone agrees to hold it up.
  *   **The Split:** Propaganda is deception. A Charter Fiction is a **conspiracy of silence** or a **collusive pretense**. It requires the participation of the "believers" to work.

  **D. vs. Outdated History**
  *   **Outdated History:** "We thought the battle was in 1066, but it was 1067." We update the plaque, and life goes on.
  *   **Charter Fiction:** "We thought the workers paid, but the owner did." We update the plaque, and the *open afternoon* loses its meaning.
  *   **The Split:** History is disposable data. A Charter Fiction is structural infrastructure.

  ### 3. The Edges: Testing the Boundaries

  You asked four specific edge cases. Here is how the concept holds up.

  **Case 1: If nobody has ever checked the record?**
  It is still a Charter Fiction, but it is in a "latent" state. It becomes a *full* Charter Fiction the moment checking the record becomes possible and the group *chooses* not to, or chooses to ignore the result. The "knowingness" doesn't have to be explicit; it just has to be that the story is *immune* to evidence. If they would change the story upon finding evidence, it's just a belief. If they would abandon the practice, it's a Charter Fiction.

  **Case 2: If the story turns out to be true?**
  This is the "death by success." If the minutes had actually shown the workers paid, the story would become *History*. It would lose its mythic power. It would no longer license a grievance or a special stance; it would just be a fact. The *need* for the story often implies the reality was insufficient. If the reality supports the stance, the fiction is no longer required to hold the weight.

  **Case 3: If the stance could be defended from the accurate record?**
  (e.g., The authority *does* not care about the valley, even if they didn't open the sluices).
  This is the most common trap. The group *could* say, "The logs are right, but you still neglected us." But they don't. Why? Because the story is a **shortcut**. Complex grievances require complex arguments. "You opened the sluices" is a clean, moral break. "You followed protocol but the protocol was bad" is muddy. The fiction simplifies the moral landscape. Losing the fiction means doing the hard work of re-deriving the grievance. Most groups won't do that work; they'd rather lose the grievance.

  **Case 4: If people insist the story is literally true when challenged?**
  This does not push it back into "false belief." This is **Protective Framing**. When the fiction is threatened, participants often regress to literalism to defend the boundary. It's a defense mechanism. The moment the challenger goes away, they return to the "wink-wink" understanding. If they insist on literal truth *internally*, among themselves, even when no outsider is present, *then* it has hardened into a False Belief or Literal Myth. But the "panic" you described suggests they know, on some level, that the ground is shifting.

  ### 4. The Normative Question: Record vs. Memory?

  You asked: *If a story like this isn't in the business of stating facts about the past at all, does it even make sense to ask whether the record or the memory should give way?*

  **No. That is the wrong question.**

  Asking "Record vs. Memory" assumes both are trying to do the same thing (describe the past). They are not.
  *   The **Record** is trying to describe the past.
  *   The **Memory** (in this case) is trying to sustain a present social arrangement.

  The correct question is: **Is the social arrangement worth the epistemic cost?**

  *   **The Cost:** You live in a world where you publicly affirm things you know are false. This erodes trust in other areas. It makes the group look delusional to outsiders. It prevents you from forming alliances based on real grievances (e.g., the valley could actually negotiate with the authority if they dropped the sluice story).
  *   **The Benefit:** Group cohesion, a clear moral identity, a reason to exist (the heritage society), a leverage point (the valley board).

  In your clock example: Is the "workers' clock" identity worth losing the historical accuracy? If the society's only purpose is to celebrate worker agency, and the worker agency is false, the society *should* probably dissolve or repurpose. The panic you saw was the committee realizing their *purpose* was tied to the *falsehood*.

  In the valley example: Is the refusal to join the board worth basing on a lie? If the authority *is* neglectful, they should fight on the *neglect*, not the *sluices*. Basing it on the sluices makes them vulnerable to being debunked. Basing it on neglect makes them vulnerable to having to prove neglect. The fiction is the easier path, but the weaker one.

  ### 5. Summary Definition

  If you need a term to use in your committee meetings (carefully), or in your own head, use **Charter Fiction**.

  **Definition:** A narrative about the past that is maintained not for its historical accuracy, but for its capacity to license specific social actions, grievances, or identities in the present. It is characterized by a collective resistance to factual correction, not because the group is deluded, but because the correction would dismantle the social infrastructure the story supports.

  **Boundary Case:**
  *   *Not a Charter Fiction:* A family believes their ancestor was a pirate. They find out he was a baker. They say "Oh, that's cool," and tell the baker story. (This is a False Belief).
  *   *Charter Fiction:* A family believes their ancestor was a pirate. They find out he was a baker. They stop holding the annual "Pirate Reunion" because "If he wasn't a pirate, there's no point." (The story was the charter for the reunion).

  **Final Advice:**
  You are in a difficult spot. Pointing out a Charter Fiction is often treated as an attack on the group itself, because you are attacking the load-bearing wall. If you want to change things, you cannot simply offer the "true" history. You have to build a *new* charter.
  *   *For the clock:* "The workers didn't pay, but they *wanted* the money for the sick fund. That shows they cared more about health than time. Let's tell *that* story." (You preserve the moral superiority of the workers without lying about the money).
  *   *For the valley:* "The logs say they didn't open the sluices. But the logs also show they didn't warn us about the *rain*. The betrayal isn't the water; it's the silence." (You migrate the grievance to a factual foundation).

  If you cannot migrate the grievance, you must accept that the group prefers the fiction to the reality. In that case, the "panic" you witnessed is the sound of a group choosing its own dissolution over a life without its myth.
