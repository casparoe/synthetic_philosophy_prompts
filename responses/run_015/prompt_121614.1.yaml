answer: |-
  ### Part 1: Brainstorming the Logical Space of Answer-Patterns

  Before assigning standard theoretical labels, we must map the possible combinations of intuitions a visitor might hold regarding the four concrete cases (Heap, Pixel Portrait, Color Spectrum, Legal Contract). The goal is to identify distinct clusters of responses that logically cohere, regardless of whether a named philosophical school currently champions them.

  **Dimension 1: The Status of the Middle Ground (Heap & Color)**
  *   **Pattern A:** The middle cases (e.g., 500 grains) are partially true. Truth is a sliding scale.
  *   **Pattern B:** The middle cases are strictly True or False, but we cannot know which. There is a hidden fact.
  *   **Pattern C:** The middle cases are strictly True or False, and there is no hidden fact. The truth is determined by something else (e.g., usage, decision).
  *   **Pattern D:** The middle cases are neither True nor False (a gap).
  *   **Pattern E:** The middle cases are both True and False (a glut).

  **Dimension 2: The Precision of Identity (Pixel Portrait)**
  *   **Pattern F:** There is a specific minute where the portrait ceases to be the person, even if we can't name it.
  *   **Pattern G:** There is no specific minute; the identity fades gradually.
  *   **Pattern H:** The minute depends on who is looking or why they are asking (shifting standard).

  **Dimension 3: Tolerance for Contradiction (Color Spectrum)**
  *   **Pattern I:** A patch cannot be both Red and Orange. Logic must be preserved.
  *   **Pattern J:** A patch can be both Red and Orange in the boundary zone. Contradiction is tolerated.

  **Dimension 4: Practical Enforcement (Legal Case)**
  *   **Pattern K:** The law must enforce the sharp line (18 years exactly), even if reality is blurry.
  *   **Pattern L:** The law should acknowledge the blur and excuse the defendant.
  *   **Pattern M:** The law enforces the line *because* it is a useful tool, openly admitting it doesn't match reality.

  **Dimension 5: Linguistic Survival (General)**
  *   **Pattern N:** We should keep using vague words like "heap" and "red."
  *   **Pattern O:** We should stop using these words because they are defective.

  **Mapping Leaves to Patterns:**
  *   **Degree-Functionalist:** Pattern A.
  *   **Epistemicism:** Pattern B + Pattern F.
  *   **Contextualism:** Pattern H.
  *   **Supervaluationism:** Pattern D + Pattern I + Pattern N.
  *   **Subvaluationism:** Pattern E + Pattern J + Pattern N.
  *   **Semantic Nihilism:** Pattern O.
  *   **Graduated Legal Fictionalism:** Pattern C (No hidden fact) + Pattern K/M (Enforce as fiction).
  *   **The Unoccupied Slot:** Pattern C (No hidden fact) + Pattern D/E denied (No indecision) + Pattern A denied (No degrees) + Pattern N (Keep words). This implies binary truth without facts or indeterminacy.

  ***

  ### Part 2: The Interactive Decision Instrument

  **Key for Museum Visitors:**
  *   **Audience:** This tool is designed for thoughtful teenagers and adults with no prior training in philosophy.
  *   **Instructions:** Answer each question based on your immediate intuition about the specific case described. There are no right or wrong answers; the path simply reveals which philosophical framework best matches your existing instincts.
  *   **Starting Commitment:** All paths begin with the agreement that the Sorites puzzle (10,000 grains down to 1) is a genuine problem to be solved, not a reason to stop speaking.

  #### Decision Tree Nodes

  **Node 1: The Middle Heap (Truth Status)**
  Imagine a pile of 500 grains of sand. It is not clearly a heap, but not clearly not a heap. When you say, "This is a heap," is your statement:
  *   (A) Partially true and partially false (like a dimmer switch). → *Go to Leaf 1*
  *   (B) Strictly true or strictly false (like a light switch). → *Go to Node 2*

  **Node 2: The Hidden Fact (Epistemic Check)**
  Regarding that 500-grain pile: Is there a specific number of grains where it *actually* becomes a heap, even if humans can never calculate exactly which number it is?
  *   (A) Yes, nature decides, we are just ignorant. → *Go to Node 3*
  *   (B) No, there is no fact of the matter in reality. → *Go to Node 4*

  **Node 3: The Pixel Portrait (Precision)**
  Think of "The Receding Pixel Friend." One pixel corrupts every minute. Does the image stop being a portrait of that person at one specific, unique minute?
  *   (A) Yes, there is a precise minute it stops, even if we can't see it. → *Go to Leaf 2*
  *   (B) No, it fades out over time without a sharp stop. → *Go to Leaf 7 (Overlap Flag)*

  **Node 4: The Color Spectrum (Contradiction)**
  Consider a patch of color exactly halfway between clear Red and clear Orange. Can this patch be correctly described as **both** Red and Orange at the same time?
  *   (A) Yes, it can be both. → *Go to Leaf 3*
  *   (B) No, it cannot be both. → *Go to Node 5*

  **Node 5: The Shifting Context (Stability)**
  Think about the word "tall." Does the boundary for "tall" change depending on who you are comparing the person to (e.g., tall for a jockey vs. tall for a basketball player)?
  *   (A) Yes, the meaning shifts with the context. → *Go to Leaf 4*
  *   (B) No, the meaning is stable, the vagueness is in the world. → *Go to Node 6*

  **Node 6: The Legal Case (Verdict)**
  A defendant missed the age of contractual capacity (18 years) by exactly one hour. Should the court hold them to the contract?
  *   (A) No, the vagueness of time/age means they should be excused. → *Go to Node 8*
  *   (B) Yes, the court must hold them to the contract. → *Go to Node 7*

  **Node 7: The Legal Reason (Fiction Check)**
  You said the court should enforce the 18-year line. Why?
  *   (A) Because 18 years is the metaphysically real moment of adulthood. → *Go to Leaf 2 (Redirect to Epistemicism)*
  *   (B) Because the line is not real, but we must pretend it is for the rule of law to function. → *Go to Leaf 5*

  **Node 8: Word Utility (Eliminativism)**
  Given that words like "heap," "red," and "adult" have these blurry boundaries, should we continue using them in serious discussion?
  *   (A) No, we should replace them with precise terms or stop using them. → *Go to Leaf 6*
  *   (B) Yes, they are useful enough to keep. → *Go to Node 9*

  **Node 9: The Truth-Maker (Final Check)**
  You believe there is no hidden fact (Node 2), no degrees of truth (Node 1), and no contradiction (Node 4), yet we should keep using the words (Node 8). What makes a statement like "This is a heap" true in the middle zone?
  *   (A) Nothing makes it true; it is just a brute fact of language that we accept. → *Go to Leaf 8*
  *   (B) It is indeterminate (neither true nor false). → *Go to Leaf 7*

  **Node 10: (Reserve/Clarification)**
  *Note: This node is reserved for visitors who oscillate between Node 4 and Node 9. If you feel the color patch is neither Red nor Orange, but also not Both:*
  *   (A) It is neither (Gap). → *Go to Leaf 7*
  *   (B) It is Both (Glut). → *Go to Leaf 3*

  ***

  ### Part 3: Diagnostic Leaves (Theoretical Positions)

  **Leaf 1: Degree-Functionalist (Fuzzy Logic)**
  *   **Diagnosis:** You view truth as a matter of degree. A 500-grain pile is "0.5 heap." Vagueness is not a defect but a feature of how we measure the world.
  *   **Key Intuition:** Truth is like a dimmer switch, not an on/off button.

  **Leaf 2: Epistemicism**
  *   **Diagnosis:** You believe there is a sharp boundary in reality, but it is hidden from human knowledge. The 500-grain pile is definitely a heap or definitely not; we just can't tell which.
  *   **Key Intuition:** Ignorance explains vagueness, not indeterminacy.

  **Leaf 3: Subvaluationism**
  *   **Diagnosis:** You tolerate contradiction in the borderline zone. A color patch can be both Red and Orange. Truth can "glut" in the middle.
  *   **Key Intuition:** Borderline cases are overdetermined; they possess conflicting properties simultaneously.

  **Leaf 4: Contextualism**
  *   **Diagnosis:** You believe the boundary moves depending on the situation. "Heap" means one thing in a chemistry lab and another in a playground. The word itself is stable, but its standard shifts.
  *   **Key Intuition:** Meaning depends on the context of use.

  **Leaf 5: Graduated Legal Fictionalism**
  *   **Diagnosis:** You distinguish between metaphysical truth and practical necessity. There is no real line between child and adult, but the law must draw one to function. We act *as if* the line is real.
  *   **Key Intuition:** Sharp boundaries are useful fictions required for governance.

  **Leaf 6: Semantic Nihilism**
  *   **Diagnosis:** You believe vague words are fundamentally broken. Because they lack sharp boundaries, statements using them in borderline cases are false or meaningless. We should ideally eliminate them.
  *   **Key Intuition:** Vagueness is a defect that corrupts truth.

  **Leaf 7: Supervaluationism**
  *   **Diagnosis:** You believe borderline statements are neither true nor false (a gap). However, we keep using the words because statements that are true across *all* possible interpretations (e.g., "10,000 grains is a heap") remain valid.
  *   **Key Intuition:** Truth is "super-true" only when it holds up under every precise way of sharpening the meaning.
  *   **Overlap Flag:** This leaf shares significant ground with **Subvaluationism** (Leaf 3) and **The Static Blur** (Leaf 8). Visitors who reject contradictions (Leaf 3) but also reject the idea of "neither true nor false" (Leaf 8) often land here. The distinction between "neither" (Supervaluation) and "brute acceptance" (Static Blur) is subtle and may feel identical in practice.

  **Leaf 8: The Static Blur (Unoccupied Position)**
  *   **Diagnosis:** You deny a sharp cutoff, deny semantic indecision (gaps/gluts), deny degrees of truth, yet refuse to eliminate the words. You hold that statements are binary (True/False) without a fact making them so, and without indeterminacy.
  *   **One-Sentence Diagnosis:** This combination is generally considered **incoherent**, as it posits binary truth values without truth-makers or indeterminacy, leaving the truth status of borderline cases metaphysically ungrounded.

  ***

  ### Part 4: Overlap and Ambiguity Flags

  **1. The Supervaluation/Subvaluation Overlap**
  For many visitors, the difference between "Neither True nor False" (Supervaluationism, Leaf 7) and "Both True and False" (Subvaluationism, Leaf 3) is difficult to detect using only the Color Spectrum case. Both positions agree that classical binary logic fails in the middle. The kiosk should flag these two leaves as "Sibling Positions" if a user scores highly on both paths, noting that they agree on the failure of sharp boundaries but disagree on how to handle the logical contradiction.

  **2. The Legal Fictionalism/Epistemicism Overlap**
  Visitors who select **Leaf 5 (Legal Fictionalism)** and **Leaf 2 (Epistemicism)** both agree that the law should enforce the 18-year cutoff. The distinction lies entirely in *why*: Epistemicists believe the cutoff is real; Fictionalists believe it is a tool. If a visitor struggles to distinguish between "real but unknown" and "fake but useful," the instrument should note that their practical legal reasoning is sound, even if their metaphysical commitment is ambiguous.

  **3. The Static Blur Warning**
  Visitors arriving at **Leaf 8** should be presented with a gentle prompt: "Your answers suggest you want to keep using vague words and treat them as strictly True or False, but you don't think there is a fact that makes them so. Philosophers find this position difficult to maintain. You might prefer Supervaluationism (Leaf 7) or Contextualism (Leaf 4)."
