answer: |-
  Your hypothesis—that the dispute is fundamentally about the *purpose* of decision theory (normative guidance vs. system design)—is the most fertile starting point, but I argue it is a symptom rather than the root cause. The root cause is a metaphysical disagreement about the **boundaries of the agent**.

  Here is the diagnosis: The stalemate persists because Newcomb's Problem is not a single problem, but a collision between two incompatible models of agency. The Two-Boxer models the agent as a **localized event in spacetime** (a "node" in a causal graph). The One-Boxer models the agent as a **logical pattern instantiated across spacetime** (a "function" or "algorithm").

  Your variants do not resolve this; they merely force the interlocutors to reveal which model they are secretly using.

  ### 1. Diagnosis of the Disagreement
  You offer three alternatives: (a) counterfactual semantics, (b) underdetermination, and (c) bedrock intuition. The correct diagnosis is a specific mixture of **(a) and (b)**, driven by a hidden metaphysical commitment.

  **The Underdetermination (b):** The problem description underdetermines the *identity conditions* of the chooser.
  *   **The Two-Boxer (CDT)** reads the prompt as: "Here is a causal graph. You are the node labeled 'Choice'. The node 'Prediction' is in your past. Arrows go forward. Maximize utility given fixed past nodes." In this model, the counterfactual "If I take both, the box is still full" is well-defined because the past is screened off.
  *   **The One-Boxer (EDT/FDT)** reads the prompt as: "Here is a logical dependency. You are an algorithm. The Predictor simulates that algorithm. Your output now and the box's content are logically correlated outputs of the same function." In this model, the counterfactual "If I take both, the box is empty" is well-defined because you cannot change your output without changing the simulation's output.

  **The Semantics (a):** This is the engine of the disagreement. Causal Decision Theory (CDT) uses *interventionist* counterfactuals (surgically alter the 'Choice' node, keep parents fixed). One-boxing theories use *logical* or *evidential* counterfactuals (alter the 'Choice' node, update all logically correlated nodes). Neither is formally "wrong" within its own system; they are asking different questions about what "could have happened."

  **Why "Purpose" isn't enough:** You suggest the Two-Boxer answers "What should I do?" and the One-Boxer answers "What should I build?" This is pragmatically true, but metaphysically shallow. The Two-Boxer believes that even in a design context, a rational agent *should* two-box at the moment of choice, accepting that they will be a "loser" overall. They value **causal efficacy** (I only get credit for what I change) over **outcome optimization** (I only care about what I end up with). The One-Boxer values winning over causal purity. This is a clash of axioms, not just applications.

  ### 2. Analysis of Your Variants

  **Variant 1: The Amnesiac Series**
  *   **Where it bites:** It destroys the "reputation" or "training" defense for Two-Boxing. It isolates the **Dynamic Inconsistency** of CDT. A CDT agent knows before the series starts that they will two-box every time and get $1,000 per round. If they could pre-commit, they would. But at every specific node, they defect. This variant forces the Two-Boxer to admit that rationality, as they define it, is *self-defeating* over time.
  *   **Where it fails:** It does not compel the Two-Boxer to switch. The hardline CDT proponent bites the bullet: "Yes, my decision theory makes me poor in Newcomb scenarios. But it is the only theory that respects the causal structure of the universe. Being rich via a correlation I didn't cause is not rational agency; it is luck." The Amnesiac variant shows CDT is costly, but not that it is incoherent. It reinforces the "Purpose" split: if the goal is *winning*, One-Box. If the goal is *causal integrity*, Two-Box.

  **Variant 2: The Sealed Simulation**
  *   **Where it bites:** It removes the "occult" element that often fuels the Two-Boxer's intuition of free will. By making the predictor a *simulation of you*, it makes the correlation **identity-based**. If the simulation is perfect, "You" and "The Simulation" are the same algorithm running on different hardware. To say "My choice now doesn't affect the past simulation" sounds like saying "My calculation of 2+2 now doesn't affect the result of 2+2 calculated yesterday." It makes the One-Boxer's logical dependence argument physically concrete.
  *   **Where it fails:** It runs into the **Temporal Intuition** barrier. Even if the simulation is *me*, it ran *in the past*. The physical substrate of the simulation is now static (hard drive state). The Two-Boxer argues: "The silicon is already magnetized. My biological neurons firing now cannot reach back and remagnetize the drive." This variant isolates the disagreement to the **arrow of time**. The One-Boxer treats logical time as primary; the Two-Boxer treats physical time as primary.

  ### 3. What Counts as Progress?

  Given this diagnosis, a "solution" to Newcomb's Problem in the traditional sense is impossible. You cannot prove one side right without begging the question against the other's definition of agency. However, progress is possible in three specific areas:

  **1. Formalizing Agent Boundaries (The "Design" Progress)**
  Progress looks like the development of **Functional Decision Theory (FDT)** or similar frameworks that explicitly formalize the "pattern" view of agency. The victory condition here isn't convincing Two-Boxers they are wrong, but showing that for *any* agent embedded in a world with predictors (or logical correlations), the "pattern" view is the only one that allows for stable pre-commitment and cooperation in Prisoner's Dilemmas with clones.
  *   *Metric:* Can we derive a decision theory that is reflectively consistent (an agent wouldn't want to modify itself to use a different theory)? FDT claims yes; CDT admits no. This is a formal result that favors the One-Boxer *if* reflective consistency is a desideratum.

  **2. Empirical Facts about Simulability (The "Physics" Progress)**
  Your Sealed Simulation variant points to an empirical question: **How copyable are agents?**
  *   If human brains are fundamentally quantum-uncopyable or chaotic in a way that prevents high-fidelity prediction, Newcomb's Problem is physically impossible for humans. The debate becomes purely abstract.
  *   If AI agents are deterministic code, Newcomb's Problem is routine.
  *   *Progress:* Acknowledging that CDT might be the correct heuristic for biological humans (who can't be perfectly simulated) while FDT is correct for AI (who can). This validates your "Purpose" hypothesis but grounds it in hardware constraints rather than normative goals.

  **3. Dissolving the "Choice" Concept (The "Philosophical" Progress)**
  The deepest progress would be admitting that "choice" is a high-level user interface, not a fundamental physical category.
  *   If determinism is true, "I could have done otherwise" is false in the CDT sense. The CDT counterfactual relies on a libertarian freedom to intervene on the past that doesn't exist.
  *   If we accept we are algorithms, the "choice" is just the output of a computation. The question "What should I do?" translates to "What output should this algorithm return?"
  *   *Progress:* Shifting the vocabulary from "rational action" to "optimal output." This dissolves the Two-Boxer's intuition that they are "leaving the million on the table" via a causal act. They are simply outputting the value that correlates with the empty box.

  ### 4. Why We Should Expect No Resolution

  We should expect no resolution because the disagreement is **axiomatic**, not derivational.

  *   **Axiom A (Causal):** Rationality requires maximizing utility over worlds you can *causally influence*.
  *   **Axiom B (Evidential/Functional):** Rationality requires maximizing utility over worlds you can *correlate with*.

  These are not logical contradictions; they are different definitions of the word "Rational."
  *   To the Two-Boxer, One-Boxing is **superstition** (believing your choice affects the past).
  *   To the One-Boxer, Two-Boxing is **self-sabotage** (leaving money on the table to satisfy a metaphysical purity test).

  Your "Purpose" hypothesis is the closest to the truth, but it needs to be sharpened: The dispute is not just about what decision theory is *for*, but about **what kind of universe we think we live in.**
  *   If we live in a universe where agents are isolated causal nodes, Two-Boxing is correct.
  *   If we live in a universe where agents are logical patterns instantiated in multiple places (including predictors), One-Boxing is correct.

  Since we do not have a settled metaphysics of mind or time, the debate will sit exactly where it began. The variants you proposed successfully isolate the *costs* of each view (Amnesiac shows CDT loses money; Simulation shows CDT relies on temporal magic), but they cannot force a surrender because each side values different things (Money vs. Causal Purity).

  **Final Verdict:** The disagreement is verbal only in the sense that "rationality" is the contested term. Substantively, it is a clash of **ontologies**. Progress lies not in solving Newcomb's Problem, but in rendering it obsolete by replacing the concept of "choice" with "computation" and acknowledging that different physical substrates (brains vs. code) may require different decision algorithms. The Two-Boxer is right about the biology of the moment; the One-Boxer is right about the logic of the system. Neither is wrong; they are just describing different layers of the stack.
