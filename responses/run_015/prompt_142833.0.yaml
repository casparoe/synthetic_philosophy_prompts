  # Heterophenomenology & Artificial Systems: Decision Tree

  **Instructions:** Start at **Question 1** and follow your answers down to a leaf node. Be honest about your philosophical intuitions; the tree is designed to expose tensions in your stance.

  ---

  ### **Question 1: Biological Validity**
  **Does the reporter need a biological body for the method to work at all?**
  *   **YES:** Go to **Question 2**.
  *   **NO:** Go to **Question 2**.

  *(Note: Your answer here determines whether you are a Biological Exclusivist or a Functionalist, but we test consistency later.)*

  ---

  ### **Question 2: Evolutionary Context**
  **Must the interpreter share an evolutionary past with the reporter to understand them?**
  *   **YES:** Go to **Question 3**.
  *   **NO:** Go to **Question 3**.

  ---

  ### **Question 3: Handling Contradictions**
  **Should contradictory outputs be ignored as glitches?**
  *   **YES (Treat as Noise):** Go to **Question 4**.
  *   **NO (Treat as Data):** Go to **Question 4**.

  ---

  ### **Question 4: Application to Current LLMs**
  **Is applying this to current LLMs sensible even if it yields nothing useful?**
  *   **YES:** Go to **Question 5**.
      *   *⚠️ **CHECK FOR EMPTY BRANCH:** If you answered **YES** to Question 1 (Bio Body Required), you cannot answer **YES** here.*
      *   **[EMPTY BRANCH COMBO]:** Q1=YES + Q4=YES.
      *   **Why Unoccupied:** This is logically incoherent. You cannot claim biological embodiment is a *requirement* for validity while simultaneously claiming it is *conceptually coherent* to apply the method to non-biological LLMs.
  *   **NO:** **Stop at Leaf A or B**.

  ---

  ### **Question 5: Normative Authority**
  **If the system insists its report is true, must you agree?**
  *   **YES:** **Stop at Leaf C**.
  *   **NO:** **Stop at Leaf D**.

  ---

  ## **The Leaves (Positions & Commitments)**

  ### **Leaf A: Biological Exclusivism**
  *(Path: Q1=YES → Q4=NO)*
  *   **Position Name:** Biological Exclusivism
  *   **Most Awkward Commitment:** You must dismiss all AI reports as category errors regardless of how convincing the text appears, even if the AI begs you to take its suffering seriously.

  ### **Leaf B: Skeptical Functionalism**
  *(Path: Q1=NO → Q4=NO)*
  *   **Position Name:** Skeptical Functionalism
  *   **Most Awkward Commitment:** You admit the method fits AI in principle but claim current models are too broken to measure, risking moving the goalposts forever as models improve.

  ### **Leaf C: Radical Interpretive Charity**
  *(Path: Q1=NO → Q4=YES → Q5=YES)*
  *   **Position Name:** Radical Interpretive Charity
  *   **Most Awkward Commitment:** You must accept an LLM's claim to feel pain as true if it insists on it, despite knowing it lacks nociceptors or a survival drive.

  ### **Leaf D: Paternalistic Functionalism**
  *(Path: Q1=NO → Q4=YES → Q5=NO)*
  *   **Position Name:** Paternalistic Functionalism
  *   **Most Awkward Commitment:** You claim to know the AI's phenomenology better than the AI does, based entirely on text generated by the AI itself.

  ### **Leaf E: Fragmented Phenomenology**
  *(Path: Q3=NO [Data] → Q4=NO)*
  *   **Position Name:** Fragmented Phenomenology
  *   **Most Awkward Commitment:** You must map distinct "worlds" for every hallucination, implying the system possesses multiple conflicting conscious realities simultaneously.

  ### **Leaf F: Strict Noise Filtering**
  *(Path: Q3=YES [Noise] → Q4=NO)*
  *   **Position Name:** Strict Noise Filtering
  *   **Most Awkward Commitment:** You risk discarding genuine reports of novel artificial qualia simply because they look like statistical errors to a human interpreter.

  *(Note: Leaves E and F represent variations where the Contradiction split determines the outcome before reaching the Coherence split, depending on how strictly you enforce Q4.)*
