answer: |-
  **Spec: Anthropics for Existential Decision-Theory**

  **Purpose:** A credence framework robust enough to weight existential risk mitigation in expected-value calculations. Must survive contact with betting markets and cosmological data.

  **Requirements**

  1.  **Betting Coherence (Non-negotiable):** Credences must map to betting odds in standard Dutch Book scenarios (e.g., Sleeping Beauty). If the theory says "credence 1/3" but guides bets at 1/2 odds without explicit decision-theoretic modification, it fails. *Motivation:* You want to bet money, not win seminars.
  2.  **Diachronic Stability (Non-negotiable):** Adopting the theory shouldn't force you to expect its own abandonment upon trivial updates (e.g., the next birth). *Motivation:* A theory requiring constant belief reversal upon observing existence is pragmatically useless.
  3.  **Empirical Humility (Preference/Contested):** The theory should not allow a priori reasoning to confirm massive universe sizes (the Presumptuous Philosopher problem). *Motivation:* Cosmology should depend on telescopes, not armchair anthropology. *Note:* This conflicts with avoiding the Doomsday Argument.
  4.  **Boltzmann Brain Avoidance (Non-negotiable):** Must explain why you are not a random fluctuation despite identical subjective evidence, without stipulating "BBs don't count." *Motivation:* If you conclude you are a BB, empirical science collapses.
  5.  **Reference Class Robustness (Non-negotiable):** Tiny changes in vague predicates (e.g., "conscious enough") shouldn't swing probabilities wildly. *Motivation:* Arbitrariness in definition shouldn't dictate cosmological credences.
  6.  **Measure Independence (Non-negotiable but suspect):** In infinite universes, results shouldn't depend on arbitrary limiting procedures. *Motivation:* Physics shouldn't depend on mathematical regularization choices.

  **Adjudication & Missing Items**

  Your made-up desiderata are real. (1) **Vague-boundary sensitivity** is a critical failure mode for SSA (Self-Sampling Assumption); if reference class choice is arbitrary, the output is noise. (2) **Regularization independence** is a valid desideratum, but likely impossible to satisfy purely within anthropics; it requires external physical measures.

  **Missing:** *Decision Theory Compatibility.* Anthropics doesn't operate in a vacuum. A theory might yield correct credences but require Functional Decision Theory (FDT) rather than Causal Decision Theory (CDT) to bet correctly. If your goal is action, the anthropic theory must specify its compatible decision framework.

  **Impossibility Results**

  You cannot satisfy **Betting Coherence**, **Empirical Humility**, and **Doomsday Avoidance** simultaneously.
  *   **SSA** satisfies Humility but triggers Doomsday (short future likely) and fails Betting in Beauty cases (without decision-theory tweaks).
  *   **SIA** avoids Doomsday (long future likely) and passes Betting, but fails Humility (Presumptuous Philosopher).
  *   **FNC** attempts both but fails Measure Independence in infinite worlds.

  **The Killer:** **Empirical Humility.** It knocks out SIA immediately. To satisfy it, you must adopt SSA-like weighting, which forces the Doomsday shift you want to avoid for x-risk calculations. You must choose: either accept a priori reason to believe the universe is huge (SIA) or accept a priori reason to believe humanity ends soon (SSA). You cannot have both a long future and empirical humility without extra-physical assumptions.

  **Theory Scorecard**

  | Criterion | SSA | SIA | FNC | Centered Cond. |
  | :--- | :--- | :--- | :--- | :--- |
  | **Betting Coherence** | Fail (needs FDT) | Pass | Pass | Pass |
  | **Diachronic Stability** | Fail (Births shift) | Pass | Pass | Pass |
  | **Empirical Humility** | Pass | Fail (PP) | Mixed | Pass |
  | **BB Avoidance** | Pass | Fail | Pass | Mixed |
  | **Ref. Class Robustness**| Fail (Sensitive) | Pass | Pass | N/A |
  | **Measure Independence**| Pass (Finite) | Fail | Fail | Fail |

  **Verdict:** SSA is too pessimistic for x-risk. SIA is too presumptuous for science. FNC is too fragile for infinities. Centered Conditionalization lacks guidance on priors. No theory satisfies the spec without trade-offs.
