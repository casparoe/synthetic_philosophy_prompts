      *   *Vulnerability 2 (The Human Loop):* Relying on humans to ground the model makes the *model* a tool, not an agent with understanding. Is the model grounded, or just the system?
      *   *Vulnerability 3 (Bandwidth):* Text is a lossy compression of reality. Does the degradation break the chain?
      *   *Vulnerability 4 (Chinese Room):* Syntax vs. Semantics. The classic objection.
      *   *Vulnerability 5 (NLP Pragmatism):* Why does this matter if the evals are good?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (NLP/Pragmatic):* "Who cares? Evals matter."
