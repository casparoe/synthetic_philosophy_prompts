  To: The Holloway Board
  From: [Your Name]
  Date: Monday Evening
  Subject: Thursday's vote + the ligament thing

  Hey everyone,

  I've been turning this proposal over in my head all weekend, mostly over too much coffee, and I wanted to get something down on paper before we lock ourselves in that room on Thursday. We need a clear motion to vote on, and we need to know what happens if it passes.

  Here's where I'm landing: I recommend we **allow the ligament model only as descriptive language**, not as an evaluative criterion. We don't use it to reject applications. We use it to talk about cohesion, maybe, but never to gatekeep. If we vote for this Thursday, the policy needs to be written and implemented by March 1 so the applicants know where they stand.

  I know this splits the difference, but hear me out.

  For those who want to adopt the model fully (our philosopher friend included): I get the impulse. The charter says we're "oppositionally bound," and honestly, we've been vague about what that means for too long. You want a tool that ensures we aren't funding work that quietly undermines the very solidarity we claim to support. That desire for integrity isn't wrong. We do need to know what we stand for.

  But here's the thing I keep coming back to, and this is for the side that wants to reject the model entirely: I hear you. Loud and clear. The worry that we're inventing an obscure taxonomy to avoid actually talking about power and resources? That's the strongest argument in the room, and I think we'd be foolish to ignore it just because it's uncomfortable.

  If we make this model a veto mechanism, we risk substituting metaphysical sorting for material analysis. We end up debating whether a writer's "binding mode" is correct instead of asking if their work challenges power structures in the real world. Look at the finalist writing about the 1973 strikes. Framing collective action through individual dignity might feel "right-coded" under the ligament model, but in practice, it might be the only way that story gets told without becoming propaganda. If we reject her based on a theoretical binding mode, we aren't protecting the charter; we're protecting a theory.

  By limiting this to descriptive use, we get the vocabulary without the trap. We can say, "This project leans toward inherited order," without saying, "Therefore, we won't fund it." It keeps the conversation honest without letting the theory eat the art.

  So, the motion for Thursday is: **Adopt the ligament model as a descriptive framework only, with no power to disqualify applicants.**

  If that passes, I'll draft the language by March 1. If it fails, we stick to our current criteria, and we owe it to ourselves to have the harder conversation about what "oppositional" actually means in terms of money and power, not just metaphysics.

  Let's talk more Thursday. Bring caffeine.

  Best,

  [Your Name]
