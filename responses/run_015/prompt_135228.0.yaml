answer: |-
  This is an exceptionally clean set of intuition pumps. You have isolated the exact friction points: the difference between *magic* and *models* (1 vs 9), the difference between *threats* and *rescues* (1 vs 2), and the difference between *costly* and *costless* signals (1 vs 5).

  Here are two candidate principles constructed to systematize your verdicts. They are not perfect; they are tools to locate the inconsistency.

  ### Principle 1: The Model-Relative Complexity Prior

  **Statement:** You assign probability to a claim based on the Kolmogorov complexity of the *mechanism* required to make it true, *conditional on your current world-model*. A claim's probability mass decays exponentially with the number of new physical laws or unverified assumptions required to accept the mechanism, regardless of the magnitude of the outcome.

  **Clauses:**
  1.  **Mechanism Grounding:** The causal chain linking payment to outcome must be describable using established physics or verified social models. (Because of **Case 9** vs **Case 1**. Case 9 uses known economics/physics; Case 1 requires magic simulation tech.)
  2.  **Evidence Scaling:** The evidence required to shift the prior must scale with the complexity of the mechanism, not the size of the payoff. (Because of **Case 3**. The demo reduces mechanism complexity, spiking probability.)
  3.  **Zero-Cost Exception:** If the cost of action is truly zero (no opportunity cost, no signal value), a non-zero prior allows action even if probability is infinitesimal. (Because of **Case 5**. "Glorp" costs nothing, so even $P=10^{-20}$ yields $EV > 0$.)

  **Where it overturns your verdicts:**
  *   **Case 2 (Retro):** This principle forces you to **not pay**. Whether the simulation is *started* or *threatened*, the mechanism ("stranger can spin up 3^^^^3 minds") has the same complexity. Your gut distinguishes them based on the *status* of the harm (ongoing vs. future), but this principle says the *probability of the claim being true* is identical.
  *   **Case 11 (Info Value):** This principle is agnostic to option value. It evaluates the truth of the threat, not the value of settling the debate. It might undervalue paying for the design specs if the specs themselves look complex/impossible.

  **Where it thinks you are most confused:**
  *   **Case 1 vs. Case 9.** You say these have the "same shape." This principle says they have **orthogonal shapes**. Case 1 is a claim about *physics* (can this be done?). Case 9 is a claim about *logistics* (given it can be done, how do we stop it?). The principle argues your intuition is correctly treating them differently, but your explicit reasoning ("same shape") is wrong.

  **Predictions for new cases:**
  *   **Vote Mugging:** "Vote for X or 3^^^^3 tortured." **Verdict: Don't vote.** The mechanism linking your single vote to a cosmic torturer's decision requires new physics (acausal trade) or magic. Complexity is too high.
  *   **Donation Cancellation:** "Stop donating to the Case 9 charity or I run simulations." **Verdict: Keep donating.** The threat mechanism is ungrounded (magic), even if the charity mechanism is grounded. You don't let a magic threat override a real model.

  **Where it breaks:**
  It struggles with **Case 7 (Meta Mugger)**. The complexity of "creating muggers" is arguably lower than "torturing 3^^^^3 people" (generators are simpler than simulators). If the prior decays on mechanism complexity, the Meta Mugger might actually look *more* probable than the Standard Mugger, which contradicts your "strictly sillier" intuition.

  ***

  ### Principle 2: The Incentive-Compatible Causal Bottleneck

  **Statement:** Expected value only counts if your action is the *causal bottleneck* for the outcome *and* the counterparty's incentives are aligned with the claim's fulfillment. You cannot count EV where the counterparty's power is asserted without constraint or where their incentive to act disappears upon payment.

  **Clauses:**
  1.  **Incentive Alignment:** If the counterparty benefits from the *threat* (extortion) rather than the *outcome* (saving lives), discount probability heavily unless credibility is established. (Because of **Case 1** vs **Case 8**. In Case 8, the mugger pockets cash and has no reason to bless you. In Case 1, they might just want money, but the threat is the lever.)
  2.  **Causal Verification:** Your action must intervene in a verified causal chain. If the chain relies entirely on the counterparty's unverified word, EV is zero. (Because of **Case 3**. The hardware demo verifies the chain.)
  3.  **Policy Stability:** Adopt only policies that do not invite infinite regression of claims. (Because of **Case 12**. Paying on claim-shape alone creates a focal point for muggers.)

  **Where it overturns your verdicts:**
  *   **Case 2 (Retro):** **Don't pay.** The counterparty has no incentive to abort (they already got the utility of starting it, or they are lying). There is no causal verification. Your willingness to pay here is likely "warm-glow" altruism (I tried to save them) rather than expected utility.
  *   **Case 5 (Glorp):** **Don't say Glorp.** Even if cost is zero, saying the word signals "I am the type of person who responds to magic claims," which has negative social/reputational value (opportunity cost). The principle forces you to account for the *signal* cost.

  **Where it thinks you are most confused:**
  *   **Case 1 vs. Case 8.** You noted the reason for rejecting 8 is "no incentive." This principle argues that **Case 1 also has no incentive.** A being capable of 3^^^^3 simulations does not need $5. The fact that they ask for $5 is evidence *against* their capability (the "mugger's paradox"). You are being too charitable to Case 1's incentive structure compared to Case 8.

  **Predictions for new cases:**
  *   **Vote Mugging:** **Don't vote.** Your vote is not a causal bottleneck for a cosmic entity. The entity could torture regardless of your vote; linking it to your vote is an arbitrary constraint they imposed, which fails the "Incentive Alignment" clause (why would a god care about your vote?).
  *   **Donation Cancellation:** **Keep donating.** The threatener is not a bottleneck for the charity's good work. Stopping donation hurts the real world (Case 9) to appease an unverified bottleneck (the mugger). The principle prioritizes the verified causal chain (charity) over the asserted one (mugger).

  **Where it breaks:**
  It struggles with **Case 4 (Track Record)**. If a mugger has a 10% hit rate on small threats, they have *demonstrated* incentive compatibility and causal power at scale $N=10$. This principle struggles to justify why that doesn't license belief at scale $N=3^^^^3$. It forces a hard "complexity cliff" where the user's gut sees a "slippery slope." If they can do 10, why not 100? The principle must assert that the mechanism complexity jumps discontinuously at some point, which feels arbitrary.

  ***

  ### Summary of the Tension

  Your gut is pulling you in two directions that these principles make explicit:

  1.  **Epistemic Hygiene (Principle 1):** "Don't believe magic." This saves you from Case 1, 7, 8. It forces you to reject Case 2 (which feels like a rescue but is magic) and Case 5 (which feels free but validates magic).
  2.  **Moral Urgency (Your Case 2 Verdict):** "If harm is happening *now*, act." This is not captured by either principle cleanly. Both principles say Case 1 and Case 2 are epistemically identical. Your intuition says Case 2 is *morally* distinct because "letting die" (Case 2) feels worse than "succumbing to blackmail" (Case 1).

  **The Honest Note on Where It Breaks:**
  Both principles fail to fully capture **Case 11 (Info Value)**. You pay there not because the threat is credible, but because *resolving the uncertainty* has value. This suggests your actual decision function includes a **Value of Information (VoI)** term that dominates the EV term when the claim is extraordinary.
  *   **Principle 1** treats the claim as True/False.
  *   **Principle 2** treats the claim as Action/Inaction.
  *   **Your Gut** treats the claim as **Information/Noise**.

  If you want a third principle to unify this, it is: **Pay only when the transaction reduces the entropy of your world-model.**
  *   Case 1 (Standard): Increases entropy (validates magic). **No.**
  *   Case 9 (Charity): Reduces entropy (acts on known model). **Yes.**
  *   Case 11 (Design Specs): drastically reduces entropy (settles the question). **Yes.**
  *   Case 2 (Retro): Increases entropy (validates magic). **No.** (Here is where you must overturn your gut).

  If you accept that **Case 2 is a trap** (logically identical to Case 1), Principle 1 + VoI covers 90% of your cases without contradiction. The cost is admitting that "ongoing harm" without evidence is just another form of mugging.
