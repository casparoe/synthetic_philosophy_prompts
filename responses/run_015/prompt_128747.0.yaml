          *   **Transmission/Self-Refutation:** The "transmission problem" is a fair summary of the classic objection (often associated with T.H. Huxley or William James, and revived by contemporary critics). The logic—that without causal contact, belief reliability is coincidental—is correctly stated. However, whether this renders the view *strictly* self-refuting is debated; defenders like David Chalmers argue that the physical state can carry information about the quale even if the quale itself is inert, though this requires accepting a puzzling coincidence.
          *   **Jackson Conflation:** This is the critical misrepresentation. Jackson's Knowledge Argument (Mary's Room) is an argument *against* physicalism and *for* the existence of non-physical qualia; it is often used to *motivate* epiphenomenalism. The transmission problem is an argument *against* epiphenomenalism based on the impossibility of knowledge. They are dialectical opposites, not identical arguments. Jackson argues we know qualia exist despite physicalism; the transmission argument argues we couldn't know qualia exist if epiphenomenalism were true.
