  7.  **Evaluate Claim 5 (Jackson's Knowledge Argument Conflation):**
      *   *Accuracy:* **Problematic.** Jackson's Knowledge Argument (Mary's Room) argues that physicalism is false because there are facts about experience (qualia) not deducible from physical facts. It argues for the existence of non-physical properties.
