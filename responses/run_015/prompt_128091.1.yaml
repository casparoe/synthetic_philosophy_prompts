      *   *Settled vs. Contested:*
          *   Settled: C&C argue for functional parity.
          *   Contested: Whether functional parity is sufficient for constitution (the "Mark of the Cognitive" problem).
          *   Contested: The implications for the Self/Identity.

  5.  **Final Review against Constraints:**
