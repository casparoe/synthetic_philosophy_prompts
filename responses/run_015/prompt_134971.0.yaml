      The Clerk's gavel wasn't wood; it was a haptic interface that vibrated when the Siren Clause timer hit zero. Tonight, it hummed against the mahogany desk, a constant reminder that in three hours, the Azure Sale would vanish like smoke.

      Elara rubbed her temples. The Republic of Marea was holding its breath. Six months ago, the Currency Crash had threatened to turn savings into dust. The previous government, invoking the Siren Clause, had sold thirty percent of the Perpetual Trust to foreign buyers to inject liquidity. It worked. The currency stabilized. But the Clause demanded price: a newly elected chamber had to ratify the sale by two-thirds, or the transaction would be voided retroactively.

      The buyers wanted ratification. The pensioners wanted stability. The Constitution demanded judgment.

      Kael, the opposition leader, cornered her in the cloakroom. He didn't look like a revolutionary; he looked tired. "This is a confidence trick, Elara. The people who voted for the emergency suspension are gone. They panicked, took the drug, and left office. Now we're being asked to pay the withdrawal costs."

      "The currency didn't crash," Elara said.

      "Because the buyers haven't been stripped of their title yet," Kael snapped. "But look at the mechanics. If we vote No, the sale unwinds. The buyers get their money back. The Trust gets the assets. But the money the government spent to save the banks? That's gone. To repay the buyers, we'd have to print more. We'd be back at square one, except now the world knows our Constitution allows us to lie about property rights."

      "So you admit we need the sale," Elara said.

      "I admit we're trapped," Kael corrected. "The Siren Clause pretends this chamber is the same agent as the last one. It isn't. The citizens who struck this bargain aren't the ones being asked to pay for it. You're asking us to legitimize a theft because the thief bought us dinner."

      Soren, the Majority Whip, intercepted them before Elara could reply. He held a tablet displaying the live ledger. "This is precisely what precommitment exists for," he said, his voice low. "If we couldn't bind ourselves against panic, we'd never survive the storm. The Clause isn't a trick; it's a seatbelt. It forces us to look at the crash site in cold blood."

      "It forces us to choose between chaos and hypocrisy," Kael muttered, walking away.

      Elara returned to the floor. The mechanical reality of the Clause sat heavy in the air. It wasn't just law; it was physics. If the vote failed, the retroactive voiding clause would trigger automatically. Contracts would dissolve. Salaries paid from the Trust's liquidity would be deemed overpayments. Thousands of pensioners, like Mrs. Halloway sitting in the gallery, would receive notices that their last six months of income were legally null. They wouldn't just lose future payments; they would owe debts for money already spent on medicine and food.

      That was the irreversible consequence. Time couldn't be clawed back. The stability had been real while it lasted, but the Constitution treated it as a dream upon waking.

      The Clerk announced the roll call. The haptic gavel vibrated harder.

      Elara watched Mrs. Halloway. The old woman wasn't cheering; she was praying. She understood the mechanics better than the lawyers. She knew that a 'No' vote was a theoretical purity that would starve her grandchildren. But a 'Yes' vote meant the Trust was no longer perpetual. It was a piggy bank with a breakable lock.

      Elara raised her hand. "Aye."

      The count climbed. It wasn't a roar of approval; it was a grim tally. When the second threshold was met, there was no applause. The Clerk silenced the gavel. The sale stood. The assets remained with the buyers. The Trust was diminished, but the pensions were safe.

      Elara looked at the Constitution on her desk. The Siren Clause had worked—it forced a vote. But it hadn't solved the moral hazard; it had just delayed the bill. The Republic was safe, but the sanctity of the Trust was dead. They had chosen survival over principle, knowing full well that the next emergency would make the choice easier.

      The gavel stopped humming. The silence was heavier than the noise.

