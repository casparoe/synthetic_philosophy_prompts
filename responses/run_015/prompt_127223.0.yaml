answer: |-
  # Workshop Activity: The Caravan of Fates
  **Time:** 75 Minutes
  **Participants:** 12 (6 Travelers, 6 Oracles)
  **Materials:** Printed City Boards, Intent Cards, Blockade Tokens, Candy/Tokens (payoff).

  ## 1. Conceptual Overview (For You, The Instructor)
  This is not a simulation of *fate*; it is a simulation of *evidential entanglement*. In the classic *Death in Damascus* paradox, the problem isn't that you can't move; it's that your decision to move provides the evidence that seals your fate. 

  In this game, we mechanize this by making the **reason for the action** the trigger for the constraint. If a Traveler acts to *avoid* the bad outcome, the game rules mechanically eliminate the good outcomes. This forces the Traveler to feel the frustration of rational avoidance being self-defeating. The Oracles are not adversaries; they are enforcers of the logical structure.

  ## 2. Setup & Roles (0:00–0:10)
  **Do not mention logic, metaphysics, or paradox.** Frame this as a game of resource management and prediction.

  *   **The Board:** 3 Cities on the table: **Aleppo**, **Baghdad**, **Damascus**. 
  *   **Travelers (6 players):** 
      *   **Goal:** End the round in a city *other* than Damascus.
      *   **Payoff:** 1 Candy/Token if safe (Aleppo/Baghdad). 0 if in Damascus.
      *   **Hand:** Dealt 3 **Intent Cards**: `[Flee]`, `[Trade]`, `[Pilgrimage]`. They must play exactly one.
  *   **Oracles (6 players):** 
      *   **Goal:** Ensure the "Prophecy" holds true.
      *   **Payoff:** 1 Candy/Token for every Traveler who ends in Damascus.
      *   **Tools:** 2 **Blockade Tokens** per Oracle.
  *   **The Prophecy (Secret Rule):** Hand each Oracle a sealed envelope labeled "Cosmic Law." They cannot open it until Round 2.

  ## 3. Gameplay Timeline (0:10–0:35)

  ### Round 1: The Blind Commitment (10 mins)
  1.  Travelers secretly select one **Destination** (Aleppo, Baghdad, or Damascus) and one **Intent Card** from their hand.
  2.  They place these face down in front of their Oracle.
  3.  **Instructor Note:** Encourage them to think strategically. "You want to survive. Choose wisely."

  ### Round 2: The Revelation (10 mins)
  1.  Oracles open their "Cosmic Law" envelopes. 
  2.  **The Rule:** *"If a Traveler plays the [Flee] Intent, the roads to all cities EXCEPT Damascus are magically sealed. Place Blockade Tokens on Aleppo and Baghdad. The Traveler is physically unable to move there."*
  3.  Oracles reveal the rule to their Traveler.
  4.  Oracles apply Blockades if the Intent was `[Flee]`.
  5.  **Crucial Constraint:** Travelers *cannot* change their Destination if it is blocked. If they chose Aleppo with `[Flee]`, Aleppo is now blocked. They **must** move to Damascus (the only open path).
  6.  If they played `[Trade]` or `[Pilgrimage]`, no blockades are placed. They stay where they chose.

  ### Round 3: The Second Guess (15 mins)
  1.  Reset the board. Return cards.
  2.  Tell the group: "You now know the Law. Play again."
  3.  Travelers choose again. Oracles enforce.
  4.  **Observe:** Watch who tries to "outsmart" the rule (e.g., playing `[Trade]` but whispering "I'm actually fleeing") vs. who accepts the logic.
  5.  Tally scores. Distribute candy.

  ## 4. The Debrief: Mapping Mechanics to Logic (0:35–1:15)
  *Do not start with the name of the paradox.* Start with their feelings.

  **Phase 1: Phenomenology (10 mins)**
  *   Ask Travelers: "How did it feel when you played `[Flee]` and saw the blockades go up?"
  *   *Expected Answer:* "Rigged," "Pointless," "My choice didn't matter."
  *   Ask Oracles: "Did you feel like you were beating them, or just following instructions?"
  *   *Point:* The frustration you feel is the philosophical problem. It's the feeling of **causal impotence**.

  **Phase 2: Structural Mapping (20 mins)**
  Draw the logical structure on the board based on their gameplay.

  1.  **The Intent Card = The Decision.** 
      *   In Causal Decision Theory (CDT), you choose an action to *cause* a good outcome. 
      *   In the game, playing `[Flee]` was your attempt to cause survival.
  2.  **The Cosmic Law = The Perfect Predictor.** 
      *   In *Death in Damascus*, Death is already in the city you choose. 
      *   In the game, the Rule *reacts* to your Intent. It creates a loop: $Decision \to Rule \to Outcome$.
  3.  **The Blockade = Counterfactual Collapse.** 
      *   Explain: "When you tried to avoid Damascus, the game didn't just say 'You lose.' It removed the other options. This mirrors the logical claim that if the prediction is perfect, the counterfactual 'If I had gone to Aleppo, I would have lived' is **false**. There is no possible world where you flee and survive."
  4.  **The `[Trade]` Card = Breaking the Link.** 
      *   Ask: "Who survived?" (Likely those who played `[Trade]`).
      *   Explain: "You survived not because you were smarter, but because you decoupled your action from the prediction. You went to Aleppo for *Aleppo's sake*, not for *Safety's sake*. In the paradox, this is the only way to 'win'—by not treating your decision as evidence."

  **Phase 3: Naming the Beast (10 mins)**
  *   Reveal: "This is **Death in Damascus**."
  *   Explain the Indexical Twist: "Usually, the story is 'Death is in Damascus.' Here, we made it indexical: 'Death is where your Fear is.' The location isn't fixed; your avoidance *defines* the location of the threat."
  *   Discuss **Newcomb's Problem**: Briefly mention how this relates to the One-Box vs. Two-Box debate. The Travelers who played `[Flee]` were Two-Boxers (trying to causally influence the outcome). The survivors were One-Boxers (accepting the correlation).

  ## 5. Limitations: What the Game Cannot Do
  Be honest with the grad students. This game is a metaphor, not a proof.

  1.  **The "GM" Problem:** In the game, *you* (the rules) enforced the blockade. In reality, there is no GM. The "blockade" is logical necessity, not physical barriers. The game makes it look like magic; in logic, it's about truth conditions.
  2.  **Modal Logic of Stability:** The game forces the outcome. It doesn't show *why* the counterfactual is unstable. You must verbally supply this: "In the real paradox, it's not that roads close; it's that the statement 'If I go to Aleppo, I live' is false because the premise 'I go to Aleppo' contradicts the fact 'Death predicted Aleppo'."
  3.  **Psychological vs. Logical:** Players can "lie" about their intent in the game (play `[Trade]` while thinking `[Flee]`). In the paradox, a perfect predictor knows your mental state. The game relies on honor; the paradox relies on metaphysical omniscience.

  ## 6. Predictable Failures (And How to Handle Them)
  1.  **"This is Rigged / Not Fun":** 
      *   *Response:* Validate them. "Good. The paradox is supposed to feel rigged. It's a trap for rational agency. If it felt fair, we failed."
  2.  **Spotting the Trick Too Early:** 
      *   Some will play `[Trade]` immediately in Round 1. 
      *   *Response:* Use them in the debrief. "Why did you do that?" "Because I didn't want to trigger the rule." "Exactly. You recognized that *trying* to win was the losing move."
  3.  **Blaming the Oracles:** 
      *   Travelers might argue Oracles placed blockades unfairly. 
      *   *Prevention:* Make the Rule card explicit and visible. The Oracles are bureaucrats, not villains.
  4.  **Confusion on Indexicality:** 
      *   They might think Damascus was fixed from the start. 
      *   *Correction:* Remind them: "If you had played `[Flee]` to avoid Aleppo, the rule would have sealed Baghdad and Damascus, forcing you to Aleppo. The 'Death City' is wherever you try not to be."

  ## 7. Instructor Cheat Sheet: The Logical Core
  *Keep this handy for Q&A.*

  *   **The Principle of Predetermination:** $P \leftrightarrow A$ (Prediction is true iff Action occurs).
  *   **The Traveler's Error:** Believing $A \to \neg P$ (Action can negate Prediction).
  *   **The Game Mechanic:** $Intent_{Flee} \to Options_{Collapsed}$.
  *   **The Lesson:** Evidential Decision Theory (EDT) says "Choose the action that is *good news*." Causal Decision Theory (CDT) says "Choose the action that *causes* good news." In this paradox, CDT fails because your action is *evidence* of the cause, not a new cause itself.

  ---
  **Note on Payoff:** Keep the candy small. If the stakes are too high, they will argue the rules. If the stakes are too low, they won't feel the frustration. One chocolate coin per survival point is the sweet spot.
