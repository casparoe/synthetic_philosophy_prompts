prompt: |-
  Hey — I need something for the little reading group I run with two friends (one econ PhD, one ML person), and also, honestly, for an argument I keep losing.

  Last month I signed up for one of those commitment apps: you put up $200 and it goes to a charity you actively dislike if you don't log four gym sessions a week. My friend says this is just an admission that future-me will be irrational, and that a rational agent has no use for such things — you do what you have most reason to do at each moment and that's it. I said, what about Parfit's hitchhiker: the driver who takes you to town only if he predicts you'll pay him once you're there, at which point paying costs you and does nothing. Then we got completely stuck, because we couldn't agree on what the object of evaluation even is — the act of paying, the disposition to pay, or the earlier choice to acquire the disposition. And my ML friend kept insisting this has the same shape as an agent that removes its own off-switch or hides its reward function from itself, which I think is maybe right, but he thinks that settles it and I definately don't.

  So before we read anything else I want a spec. Write me the desiderata that any adequate account of this territory — the rationality of being rationally irrational, or of self-binding, call it what you like — has to meet, with the case or consideration behind each. Here are the cases I want it to say something about; don't feel bound by them and tell me if any is a red herring: (1) the hitchhiker in its pure prudential form, with no gratitude or owing sneaked in — the account shouldn't be able to cheat by importing moral reasons; (2) the inverse case — the person known to pay ransoms gets kidnapped, so your dispositions partly determine which situations you end up in at all, and the account has to handle that selection effect and not just within-situation payoffs; (3) an imperfect predictor (the driver is right 70% of the time) plus a real cost to maintaining the disposition, since being the paying sort apparently requires being the sort who feels guilty; (4) the fact that you usually can't choose a disposition directly, only acts that produce it — a public vow, money in escrow, deleting the app, or deliberately not reading the safety statistics about the route — so does the rationality of the means transmit, and what if the only available means is making yourself believe something false?; (5) the trait you never chose, because you were raised to be a promise-keeper, where it's unclear whether rationality can even evaluate something you didn't acquire and whether the answer should differ from the acquired case; (6) self-effacing dispositions, where the only disposition that would get the driver to stop is one you couldn't retain while fully knowing you'd adopted it as a device — what is the recommendation supposed to be there?; (7) a scope constraint, so the account doesn't generalize into making every temptation a case for self-binding, or let you count the value of having the disposition twice, once when you adopt it and again when you act on it; and (8) the level question — acts, dispositions, belief-forming policies, plans over time — whether one account has to deliver a single verdict across all of them, whether the verdicts are allowed to come apart, and if they do, which level is the one you're supposed to actually follow.

  Then: mark which requirements are non-negotiable and which are just what one camp happens to want; name any pair you suspect can't be jointly satisfied (my hunch is there's a genuine tension between the account being usable by someone who knows the account and the account crediting the hitchhiker with the benefit of being the paying type, since dispositions like that seem to evaporate once you see them as devices — but say if I've located the tension in the wrong place); and tell me which single requirement does the most work in ruling out the obvious answers. Please don't give me papers, citations, or a reading list — we're doing this without library access for a few weeks and I'd rather have the argument than the bibliography. A table is fine, and if you want to score the two or three standard lines against the list at the very end, keep it to one short paragraph: I care much more about the criteria than the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Runs a reading group (Econ PhD, ML person, User). Needs a specification (desiderata) for an account of "rational self-binding" or "rational irrationality" (e.g., commitment devices, Newcomb-like problems).
      *   **Context:** User is losing an argument with a friend who claims commitment devices (like the gym app) are admissions of irrationality, whereas a rational agent just does what they have most reason to do. User brings up Parfit's Hitchhiker. ML friend brings up AI safety (off-switches).
      *   **Task:** Write a list of desiderata (requirements) that any adequate account of this territory must meet.
      *   **Specific Cases to Cover:**
          1.  Pure prudential Hitchhiker (no moral reasons).
          2.  Inverse case (dispositions affect situation selection, e.g., ransom kidnapping).
          3.  Imperfect predictor + cost of disposition (70% accuracy + guilt cost).
          4.  Indirect control (can't choose disposition directly, only means; includes self-deception).
          5.  Unchosen traits (raised to be promise-keeper).
          6.  Self-effacing dispositions (knowing you adopted it as a device destroys it).
          7.  Scope constraint (no double-counting value, no binding for every temptation).
          8.  Level question (acts vs. dispositions vs. plans; verdict coherence).
      *   **Constraints:**
          *   No papers, citations, or reading lists.
          *   Table is fine.
          *   Scorecard at the end must be one short paragraph.
          *   Identify non-negotiable vs. camp-specific requirements.
          *   Identify incompatible pairs (tensions).
          *   Identify the single requirement that does the most work ruling out obvious answers.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *Causal Decision Theory (CDT)* style reasoning (maximize utility at the moment of choice based on causal consequences) and *Evidential/Functional* style reasoning (maximize utility based on what your choice signals about your type, or maximize utility of the algorithm/disposition that produces the choice).
      *   The friend argues for a strict "moment-by-moment rationality" (CDT-ish).
      *   The user argues for "dispositional rationality" (allowing binding).
      *   The ML friend sees this as "pre-commitment/modifying own reward function."

  3.  **Drafting the Desiderata (based on the 8 cases):**

      *   *Case 1 (Pure Prudential Hitchhiker):* Needs to justify paying *after* arrival without moral duty.
          *   *Desideratum:* **Non-Moral Prudential Force.** The account must generate a reason to pay purely from self-interest, not imported morality.
      *   *Case 2 (Ransom/Selection):* Dispositions change *which* games you play.
          *   *Desideratum:* **Ex-Ante Situation Selection.** The account must value dispositions that filter out unfavorable scenarios, not just maximize within-scenario payoff.
      *   *Case 3 (Imperfect Predictor + Cost):* Real world isn't perfect Newcomb. Dispositions have maintenance costs.
          *   *Desideratum:* **Cost-Benefit Sensitivity.** The account must weigh the cost of maintaining the disposition against the probability-weighted benefit of the predictor's accuracy.
      *   *Case 4 (Indirect Control/Self-Deception):* We can't just "will" a disposition. We use tools (apps, vows). Sometimes we need ignorance.
          *   *Desideratum:* **Means-End Transmission.** Rationality of the disposition must transmit to the rationality of the tools used to cultivate it, even if those tools involve restricted information access.
      *   *Case 5 (Unchosen Traits):* What about luck/upbringing?
          *   *Desideratum:* **Origin Neutrality.** The rational evaluation of a disposition shouldn't depend entirely on whether it was chosen or inherited, provided it is sustainably held.
      *   *Case 6 (Self-Effacing):* If knowing the trick breaks the trick.
          *   *Desideratum:* **Stability Under Reflection.** The account must handle cases where full knowledge of the rationale undermines the efficacy of the strategy (the "self-effacing" problem).
      *   *Case 7 (Scope/Double Counting):* Don't bind for everything. Don't count the benefit twice.
          *   *Desideratum:* **No Double-Counting.** The benefit of having the disposition cannot be counted once at adoption and again at execution to justify both independently.
      *   *Case 8 (Levels):** Acts vs. Dispositions.
          *   *Desideratum:* **Level-Linking.** The account must specify which level is action-guiding. If dispositions are rational but acts are not, what do I *do*?

  4.  **Refining and Categorizing (Non-Negotiable vs. Camp-Specific):**
      *   *Non-Negotiable:* Logical consistency (No Double-Counting), Prudential Force (must explain *why* it's rational, not just useful), Means-End Transmission (otherwise binding is impossible).
      *   *Camp-Specific:* Origin Neutrality (CDT folks might say only chosen commitments count), Stability Under Reflection (some might say if it breaks on reflection, it's irrational).

  5.  **Identifying Tensions (Incompatible Pairs):**
      *   The user hinted at one: **Stability Under Reflection** vs. **Non-Moral Prudential Force**. If the *only* reason to pay is that you are the "type" who pays, knowing you are cultivating that type for instrumental reasons might make you the "type" who calculates, not the "type" who pays.
      *   Another tension: **Means-End Transmission** (allowing self-deception/apps) vs. **Level-Linking** (if the act itself is irrational, how can the means be rational?).

  6.  **Identifying the "Workhorse" Requirement:**
      *   Which one kills the "Friend's" view (Moment-by-Moment Rationality)?
      *   It's **Ex-Ante Situation Selection**. The friend focuses on the moment of payment (cost > benefit). The binding view focuses on the moment of *getting into the car* (benefit of ride > cost of payment). If the account doesn't allow evaluating the disposition from the ex-ante perspective, the friend wins.

  7.  **Drafting the Response (incorporating constraints):**
      *   Tone: Analytical, precise, respectful of the reading group context.
      *   Format: Table for desiderata, followed by analysis of tensions/non-negotiables, then the single paragraph scorecard.
      *   Check constraints: No citations. No reading list.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the ML friend's point? *Adjustment:* Mention "algorithmic stability" in the reflection constraint.
      *   *Check:* Did I address the Econ friend's point? *Adjustment:* Ensure "Moment-by-Moment" is the foil being ruled out by specific desiderata.
      *   *Check:* Is the "Single Requirement" clear? *Decision:* Yes, Ex-Ante Evaluation is the pivot point.
      *   *Check:* Is the tension clear? *Decision:* The tension between *Transparency* (knowing why you do it) and *Efficacy* (doing it works only if you don't know).
      *   *Check:* Scorecard length. *Decision:* Keep it tight. CDT, EDT, FDT (Functional Decision Theory) are the implicit "standard lines" here, though I won't name them as a reading list. I will refer to them as "Moment-Act," "Evidential," and "Dispositional/Functional" approaches to keep it conceptual.

  9.  **Final Polish:** Ensure the distinction between "Non-Negotiable" (logical coherence) and "Contested" (philosophical stance) is sharp. Ensure the "Level-Linking" problem is articulated clearly (guidance problem).

  *(Self-Correction on the "Scorecard"):* The prompt asks to score "two or three standard lines." I should identify them clearly without citing papers. I'll call them "Act-Utilitarian/CDT," "Evidential," and "Dispositional/Functional."

  *(Self-Correction on Tensions):* The user guessed the tension is between "usable by someone who knows the account" and "crediting the hitchhiker." I need to confirm or correct this. Yes, this is the *Self-Effacing* tension. I will validate their hunch but refine the location.

  *(Final check on constraints):* "Please don't give me papers, citations, or a reading list." Okay. "A table is fine." Okay. "One short paragraph" for scorecard. Okay.

  Let's assemble.
answer: |-
  Here is a specification sheet for the rationality of self-binding and dispositions, tailored for your reading group's debate.

  ### Desiderata for an Account of Rational Self-Binding

  | # | Requirement | The Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Non-Moral Prudential Force** | **(The Pure Hitchhiker)** The account must generate a reason to pay the driver *after* arrival based solely on self-interest. It cannot smuggle in moral duties (promise-keeping) or external norms to justify the act. If it relies on morality, it fails to answer the Econ friend's claim about *instrumental* rationality. | **Non-Negotiable** |
  | **2** | **Ex-Ante Situation Selection** | **(The Ransom Case)** The account must evaluate dispositions not just by payoffs *within* a scenario, but by how they alter *which* scenarios occur. A disposition is rational if it prevents you from entering losing games (kidnapping), even if it costs you in the games you do play. | **Non-Negotiable** |
  | **3** | **Cost-Benefit Sensitivity** | **(Imperfect Predictor)** The account must handle noise. If the predictor is only 70% accurate, or if maintaining the disposition requires psychic cost (guilt/anxiety), the account must specify the break-even point. It cannot assume perfect prediction or costless binding. | **Non-Negotiable** |
  | **4** | **Means-End Transmission** | **(Indirect Control)** Since agents often cannot will dispositions directly, the rationality of the *end* (the disposition) must transmit to the *means* (the gym app, the vow, the ignorance). If the disposition is rational, the tools to cultivate it must be too, even if those tools restrict future choice or information. | **Contested** |
  | **5** | **Origin Neutrality** | **(Unchosen Traits)** The account must clarify if rationality evaluates the *maintenance* of a trait or its *acquisition*. If you were raised to keep promises, is it rational to keep them now? If the account says "only chosen bindings count," it ignores most human psychology. If it says "all traits count," it risks rationalizing harmful instincts. | **Contested** |
  | **6** | **Stability Under Reflection** | **(Self-Effacing Dispositions)** The account must handle cases where knowing *why* you have a disposition destroys its utility. If the driver only stops for those who *naturally* value paying, and you know you are cultivating that value instrumentally, do you still get the ride? The account must say whether rationality requires ignorance here. | **Contested** |
  | **7** | **No Double-Counting** | **(Scope Constraint)** The account cannot count the benefit of the disposition twice. You cannot say "It was rational to adopt this because it helps me later" AND "It is rational to act on it later because I adopted it." The justification must locate the rationality at one specific locus (adoption or execution) without circularity. | **Non-Negotiable** |
  | **8** | **Action-Guidance (Level-Linking)** | **(The Level Question)** The account must specify which level is action-guiding. If the *disposition* is rational but the *act* (paying) has negative causal utility at the moment, what should the agent *do*? An account that says "Have the disposition but don't pay" is practically incoherent. | **Non-Negotiable** |

  ### Analysis of Tensions and Constraints

  **Non-Negotiable vs. Contested**
  Requirements 1, 2, 3, 7, and 8 are non-negotiable because failing them results in logical incoherence or a failure to address the prompt (e.g., if you can't guide action, it's not a theory of rationality; if you double-count, it's math error). Requirements 4, 5, and 6 are contested because different camps draw the boundary of "agency" differently. Your Econ friend will likely reject **Means-End Transmission** (arguing that restricting future choice is always irrational) and **Origin Neutrality** (arguing rationality only applies to choices).

  **Incompatible Pairs**
  You located the tension correctly, but it is specifically between **Stability Under Reflection (6)** and **Non-Moral Prudential Force (1)**.
  *   *The Tension:* To satisfy (1), you need a prudential reason to pay (being the "type" who pays gets you the ride). But to satisfy (6), the disposition must survive knowing it was adopted for that reason. In many Hitchhiker variants, the predictor detects *instrumental* adoption. If the account says "Be the type who pays," but also "Know you are doing it for the ride," the predictor may defect.
  *   *The Conflict:* An account that is fully transparent (usable by someone who knows the account) may fail to secure the benefit. An account that secures the benefit may require the agent to be self-deceived about their motives. You generally cannot have a theory that is both *fully self-applicable* and *maximally effective* in Newcomb-like problems.

  **The Workhorse Requirement**
  **Ex-Ante Situation Selection (2)** does the most work in ruling out your friend's "Moment-by-Moment" view.
  *   *Why:* Your friend's view (standard Causal Decision Theory) evaluates the act of paying *in town*. At that moment, paying costs $100 and gains nothing (the ride is already had). It is strictly dominated.
  *   *The Ruling:* Requirement (2) forces the evaluation back to the *start of the desert*. At that moment, "Being the type who pays" has massive positive utility (it gets you the car). By forcing the locus of evaluation to the point where the disposition affects situation selection, this requirement makes self-binding rational, whereas moment-by-moment evaluation makes it irrational.

  ### Scorecard of Standard Lines

  **Moment-Act View (Your Friend):** Fails (2) and (8). It treats the act in isolation, making binding look like irrational self-sabotage, and cannot explain why the Hitchhiker gets a ride. **Evidential View:** Satisfies (1) and (2) by treating acts as evidence of type, but struggles with (4) and (6) because it doesn't distinguish between causing an outcome and signaling it, leading to "magical thinking" errors in non-Newcomb cases. **Dispositional/Functional View (Your Position):** Best satisfies (2), (3), and (7) by treating the agent as an algorithm rather than a momentary chooser, but takes a heavy hit on (6); it often implies that full rationality requires not knowing one's own source code, which feels like a bug in a theory of rationality.
