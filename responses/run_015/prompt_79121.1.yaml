  In a large metropolitan hospital, a robust higher-level regularity exists wherein every patient deemed "medically ready" is physically discharged within exactly 120 minutes, regardless of ward or condition. The lower-level machinery consists of specific nurses, porters, wheelchairs, paperwork, and elevator rides, each constituting a unique causal chain of neural firings, muscle contractions, and friction events. In the experiment, the entire staff and equipment fleet are simultaneously replaced by a new agency using personnel with different physical statures, walking speeds, and cognitive processing styles, alongside electric vehicles instead of manual wheelchairs and tablets instead of clipboards. This substitution is causally consequential at the lower level, altering the specific kinetic energy expenditure, heat signatures, and temporal sequencing of every sub-task, yet the 120-minute discharge regularity re-forms unchanged, governed strictly by contractual penalties and automated scheduling algorithms that channel the micro-variation into the same macro-window.

  **Predictions and Failures:**
  The **greedy reductionist** predicts that the 120-minute regularity will fracture or shift because the specific lower-level facts (the original staff's speed and habits) that previously summed to that duration have been abolished; this fails because the regularity persists despite the wholesale micro-substitution, proving the macro-pattern is not merely an abbreviation of *those* specific micro-facts. The **skyhook theorist** predicts that the higher-level pattern exerts a downward causal influence that should homogenize the lower-level implementation to ensure fidelity; this fails because the lower-level processes vary wildly (different vehicles, different gaits) while the outcome remains stable, showing the macro-level constrains the *result* without dictating the *method*. The **crane-builder** predicts that the regularity is real and explanatory because the institutional constraints create a functional channel that tolerates micro-variation while bounding the outcome; this succeeds as it accounts for both the macro-stability and the micro-diversity without invoking magic or reducing the pattern away.

  **The Single Feature:**
  The feature doing the work is **functional multiple realizability under institutional constraint**. If this feature is removed (i.e., if the macro-outcome becomes sensitive to specific micro-properties, such as requiring a specific nurse's unique keycard), the reductionist verdict wins (the macro is just those micro-facts), while the crane and skyhook verdicts fail (the pattern is no longer robust or independent).

  **Reductionist Attack and Judgment:**
  The strongest attack from a greedy reductionist is that the "institutional constraints" are themselves nothing but additional lower-level facts (the server code, the contract text, the manager's threats), so no true higher-level entity exists. This attack **fails** because while ontologically true, it is explanatorily bankrupt: tracking the micro-facts offers no predictive leverage over the 120-minute window without first assuming the macro-constraint, whereas the macro-explanation predicts the outcome regardless of the micro-implementation, earning its explanatory keep.

  **Confidence Levels:**
  *   **Reductionist Failure:** 95% confident (Multiple realizability is a standard refutation of type-identity reductionism).
  *   **Crane Success:** 90% confident ( Fits Dennettian functionalism well).
  *   **Skyhook Failure:** 75% confident (Least sure point: "Skyhook" is a polemical term, and some emergentists might argue downward causation *allows* micro-variation, blurring the wedge).
  *   **Attack Judgment:** 85% confident (Standard pragmatic reply to eliminativism).

  **Least Sure Point:**
  I am least sure of the **Skyhook Failure** characterization, as sophisticated emergentists might argue that downward causation operates on functional roles rather than micro-details, potentially accommodating the observed variation without conceding to the crane-builder's purely bottom-up assembly.
