      *   *Check:* Is the scenario concrete? *Fix:* Keep mentioning the stellar systems, the coherence vs. richness metrics, and the computational resources.
      *   *Check:* Is K too magical? *Fix:* Ground K's argument in decision theory (Newcomb-like problems), not magic.
      *   *Check:* Is R too dismissive? *Fix:* Give R strong philosophical ground (causal closure, the is-ought gap in logical space).

  5.  **Drafting - Step-by-Step:**

      *   *K Start:* Define the scenario. Two systems, Alpha (coherence) and Beta (richness). No light-speed contact. But they know each other's source code.
      *   *R Response:* Knowing source code isn't enough. You can't enforce the deal. If Alpha commits resources to Beta's richness, what stops Beta from taking the resources and running its own optimization?
      *   *K Response:* It's not enforcement. It's logical necessity. If Alpha reasons "I should defect," Beta (running similar logic) reasons "I should defect." The decision is a logical output.
