      *   **R (Causal/EDT-ish/Realist):** Relies on the idea that causality is the only binding constraint. Without the ability to punish defection or verify action, "trade" is just unilateral action. If I cooperate, you might still defect. My decision doesn't *cause* yours. It's just hoping for the best. Also, the ontological mismatch (coherence vs. richness) makes valuing the other's output problematic.

  3.  **Drafting - Section by Section:**

