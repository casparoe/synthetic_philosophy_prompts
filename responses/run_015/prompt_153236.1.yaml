  Brouwer viewed formal systems and language as imperfect tools that only secondarily describe the real math happening in the mind. An LLM generating proofs in Lean is essentially performing high-speed formalism, shuffling tokens based on probabilities rather than experiencing the "primordial intuition of time" required to construct mathematical truth. Without a human mind genuinely grasping the construction step-by-step, the output is just syntactic noise, regardless of whether a computer verifies it as correct.

  Regarding choice sequences, his rejection would be even stronger. These sequences specifically rely on the mathematician's free choices unfolding over time, unbound by predetermined laws. An AI generating digits is executing an algorithm, which makes its output law-like and deterministic rather than free. Since the model lacks consciousness and volition, it cannot perform the free acts necessary to create a true choice sequence, meaning its stream of digits is merely a simulation of math, not the legitimate mental construction Brouwer demanded.
