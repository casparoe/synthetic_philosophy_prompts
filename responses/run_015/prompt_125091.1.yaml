prompt: |-
  I'm prepping a discussion for my philosophy of literature group on whether language decay causes poltical decay or vice versa, using Orwell's essays — esp. the claim that corrupt language actively disables the mental habits that resist bad politics — and Lord of the Flies. I want a reading that asks specificaly whether Golding depicts the boys' loss of precise democratic vocabulary — Ralph's rules, the conch — as causing their slide inot violence, or whether Jack's will to power degrades language as a tool, or whether it's a feedback loop. Focus on the conch as a kind of speech-act institution: its authority depends on shared recognition of rules, and when that breaks it's just a shell. Compare Jack's slogans to Orwell's point about prefabricated phrases that save people the trouble of thinking. Does the novel support Orwell's causal claim, or does Golding show that language collapses only after the political will has already turned? I want you to take both the novel and Orwell seriously, not reduce the book to an illustration, and end by saying what Golding adds to the debate that pure argument can't. Also point to one scene that resists the Orwell reading and admit the novel doesn't fully fit. No citations needed, and please don't list books — I just want the anaysis.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Topic:** The relationship between language decay and political decay (causality: which comes first? or is it a loop?).
      *   **Texts:** George Orwell's essays (specifically "Politics and the English Language") and William Golding's *Lord of the Flies*.
      *   **Key Focus:**
          *   Orwell's claim: Corrupt language disables mental habits resisting bad politics.
          *   Golding's depiction: Does loss of democratic vocabulary (conch, rules) cause violence, or does the will to power degrade language?
          *   The Conch: Viewed as a "speech-act institution" (authority depends on shared recognition).
          *   Jack's slogans vs. Orwell's "prefabricated phrases."
          *   **Crucial Constraint:** Take both seriously; don't just reduce the novel to an illustration of the essay.
          *   **Ending:** What Golding adds to the debate that pure argument can't.
          *   **Specific Requirement:** Point to one scene that resists the Orwell reading (admit the novel doesn't fully fit).
          *   **Format:** Analysis only, no citations, no book lists.

  2.  **Deconstruct Orwell's Argument:**
      *   Core thesis: Language and thought influence each other, but sloppy/orthodox language *actively* corrupts thought, making political regeneration impossible.
      *   Mechanism: "Dying metaphors," "operators," "pretentious diction," and "meaningless words" allow speakers to detach meaning from reality. This numbs the conscience.
      *   Causality: It's a cycle, but Orwell emphasizes that cleaning up language is a *political act* that can break the cycle. He believes in the agency of the individual writer/speaker to resist.

  3.  **Deconstruct *Lord of the Flies* (regarding language/politics):**
      *   The Conch: Symbol of order, democracy, turn-taking. It's a physical token granting speech rights.
      *   Ralph/Piggy: Represent reason, rules, vocabulary of civilization ("act properly," "rescue," "signal fire").
      *   Jack: Represents instinct, power, hunting. His language becomes imperative, ritualistic, chant-based.
      *   The Slide: The boys start with clear English. As fear and hunger grow, language simplifies, becomes rhythmic, violent.
      *   Causality in Golding: Is it the loss of words that makes them savages, or the savagery that makes words irrelevant? Golding often leans toward an innate human darkness (original sin) that *overwhelms* structures (including language).

  4.  **Synthesize/Compare:**
      *   *Similarity:* Both see the degradation of specific, honest language as concurrent with moral collapse. Jack's chants ("Kill the pig. Cut her throat. Spill her blood.") are the ultimate "prefabricated phrases"—they bypass thought and trigger action.
      *   *Difference:* Orwell is a rationalist. He thinks if we fix the words, we can fix the thought. Golding is a pessimist/moralist. He suggests the "beast" is inside; language is just a thin veneer. When the will to power (Jack) rises, language doesn't just decay; it gets *weaponized* or discarded.
      *   *The Conch as Speech-Act:* The conch works only as long as the *belief* in the conch exists. It's not the shell; it's the intersubjective agreement. When that agreement fractures, the shell is useless. This aligns with Orwell's idea that language relies on shared meaning.
      *   *Causality:* Orwell says bad language $\rightarrow$ bad politics (partially). Golding seems to suggest bad instincts $\rightarrow$ bad politics $\rightarrow$ loss of language utility.

  5.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Set up the tension. Orwell's feedback loop vs. Golding's psychological realism.
      *   **The Conch as Institution:** Analyze the conch not just as a symbol, but as a rule-bound mechanism for speech. When the rule breaks, the speech loses authority. This mirrors Orwell's worry about words losing their anchor in truth.
      *   **Jack's Slogans vs. Orwell's Prefab Phrases:** Connect the hunting chants to Orwell's "dying metaphors." They stop describing reality and start inducing a trance. This supports Orwell: the language *enables* the violence by removing individual responsibility.
      *   **The Causality Question (The Crux):** Does language fail first? In *LotF*, the boys speak clearly at the start. The decay happens *as* the fear grows. This suggests Golding sees language as a symptom of the underlying moral state, whereas Orwell sees it as a cause. For Golding, the "will to power" (Jack) eats the "will to truth" (Piggy).
      *   **The Resistant Scene:** Need a scene where language *doesn't* save them, or where clear language exists alongside evil. Simon's conversation with the Lord of the Flies? Or perhaps the death of Piggy. Piggy is the champion of clear language ("Which is better—to have rules and agree, or to hunt and kill?"). He speaks clearly right up to the end. His clarity doesn't save him. This resists Orwell's hopeful implication that clear speech is a shield.
      *   **What Golding Adds:** Orwell offers a method of resistance (clean language). Golding offers a warning about the *limits* of that method. Language is fragile against irrational fear. Golding adds the *visceral* cost. It's not just about policy; it's about blood.
      *   **Conclusion:** Summarize the feedback loop but emphasize Golding's darker twist.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I reduce the book to an illustration? *Correction:* Make sure to highlight where Golding diverges from Orwell (the innate evil aspect).
      *   *Check:* Did I address the conch as a speech-act institution? *Correction:* Ensure I use that terminology or concept explicitly.
      *   *Check:* Did I identify a scene that resists the reading? *Correction:* Piggy's death is the strongest candidate. He has the words, but he lacks the power.
      *   *Check:* No citations/lists. *Correction:* Keep it flowing text.

  7.  **Final Review against constraints:**
