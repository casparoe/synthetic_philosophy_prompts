  8.  **Final Polish:** Ensure the tone is suitable for a philosophy of literature group (analytical, nuanced, not high-school essay style). (Self-correction: Avoid saying "Orwell says X" too repetitively; weave the ideas in.)

  *(Drafting mental outline of the "Resistant Scene"):* Piggy's final speech. He holds the conch. He uses logic. He asks the moral question. He is murdered instantly. This proves that clear language is powerless against sheer force, which complicates Orwell's idea that cleaning language is a sufficient political act.

  *(Drafting mental outline of "What Golding Adds"):* Orwell is cerebral. Golding is somatic. The decay isn't just in the dictionary; it's in the body (paint, dancing, screaming). Golding shows the *emotional* satisfaction of giving up language.

