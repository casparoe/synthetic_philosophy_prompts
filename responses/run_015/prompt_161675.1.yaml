answer: |-
  Here is the brutal scoring, tiering, and analysis you asked for. I've evaluated these based on how well they survive your five-test gauntlet, specifically looking for replies that crumble when the causal chain is broken (Sunk/Screened) or the audience is removed (Invisible).

  ### The Scoreboard

  **Tier A: Gets Its Own Section**
  *These replies either survive the whole gauntlet or fundamentally reframe the debate in a way that renders the gauntlet irrelevant.*

  *   **(g) No-replacement counterfactual: 92/100.**
      This is the strongest *causal* reply. It survives **Screened Off** (Case 4) and **Sunk Supply** (Case 3) by widening the lens from "my act" to "my slot in the chain." It admits the harm might not vanish but argues it gets displaced to a point where intervention is possible. It does real work because it doesn't lie about the mechanics; it just corrects the boundary of the analysis.
  *   **(e) Expression and integrity: 88/100.**
      The most robust *non-causal* reply. It survives **Sunk**, **Screened Off**, and **Invisible** (Cases 3, 4, 5) effortlessly because it severs the link between morality and outcome. It lands in Tier A because it's the only move that doesn't sweat when the causal chain is cut, though it pays for this by changing the subject from "harm" to "character."
  *   **(j) Efficacy isn't the relevant notion: 85/100.**
      Similar to (e) but more meta. It attacks the consequentialist framework itself. It gets a slightly lower score than (e) because it's more abstract and harder to operationalize in a zine format without sounding like a lecture, but it shares the same bulletproof robustness against all five cases.

  **Tier B: Gets a Paragraph**
  *These replies do heavy lifting in specific lanes but collapse or require hand-waving in the worst-case scenarios.*

  *   **(a) Expected difference: 70/100.**
      The workhorse of the literature. It dominates **Smooth** and **Lumpy** (Cases 1 & 2) but dies a hard death on **Sunk Supply** and **Screened Off** (Cases 3 & 4), where the expected difference is literally zero. It gets a paragraph because you can't write this chapter without it, but it's not the saviour people think it is.
  *   **(i) Capacity building, or option value: 68/100.**
      A strong strategic pivot. It saves **Sunk Supply** (Case 3) by treating the act as practice for next time, and helps with **Screened Off** (Case 4) by maintaining coalitions. It loses points because it relies on a future that might not come, and it doesn't address the immediate harm in **Smooth** cases.
  *   **(c) Group membership: 60/100.**
      Intuitively satisfying but mechanically vague. It works well on **Lumpy** (Case 2) where the group hits the threshold, but struggles to explain why *I* am on the hook in **Screened Off** cases if the group acts regardless. It's a good sociological description, a weaker moral justification.

  **Tier C: Mention and Move On**
  *These are either subsets of better arguments, fragile, or concessions.*

  *   **(b) Threshold lottery: 55/100.**
      This is just (a) with a step-function probability distribution. It adds psychological comfort in **Lumpy** cases (Case 2) but no logical weight. If (a) fails on **Sunk Supply**, (b) fails harder because the probability of being on the threshold is zero.
  *   **(h) Observability amplifier: 45/100.**
      Fragile. It relies entirely on social feedback loops. It is annihilated by **Invisible** (Case 5) and weakened by **Sunk Supply** (Case 3). It's a contingent benefit, not a foundational justification.
  *   **(d) Practice participation: 45/100.**
      Too close to (h) and (i). It assumes a practice exists to join. If you are a pioneer, this reply offers nothing. It collapses into (i) when pressed on *why* joining matters.
  *   **(f) Universalisation: 35/100.**
      As you noted, the logic is weak. It fails **Screened Off** (Case 4) because the conditional "if everyone else did" is often true *and* the harm still happens. It's a heuristic, not a proof.
  *   **(k) De minimis: 20/100.**
      This isn't a reply; it's a surrender. It scores low because it concedes the inefficacy objection wins, which might be honest, but it doesn't "do work" to defend individual contribution.

  ***

  ### The Duplicates
  **(a) Expected difference** and **(b) Threshold lottery** are secretly the same move. (b) is just (a) applied to a specific causal topology (step functions rather than linear). Collapsing them loses nothing logically; you only lose the rhetorical flavour of "I might be the one." Treat (b) as a footnote to (a).

  **(e) Expression and integrity** and **(j) Efficacy isn't the relevant notion** are also siblings. (e) is the virtue-ethics instantiation of (j)'s deontological claim. You could merge them into a section on "Non-Consequentialist Exits," though keeping them separate helps distinguish "being a certain person" from "following a certain rule."

  ### The Missing Case
  **(i) Capacity building** looks more robust than it is because your list lacks a **Terminal Collapse** case.
  *   *The Case:* The system is not stable; it is tipping. There is no "next time" to build capacity for, and no coalition to maintain because the window for intervention closes in 24 hours.
  *   *Why it matters:* In a terminal scenario, option value drops to zero. (i) relies on the future being open enough to cash in the option. Without a case where the future is foreclosed, (i) gets a free pass it doesn't deserve.

  ### The Shake-Up Case
  If you want to break the Tier A rankings, add this:

  **The Perverse Incentive (or "The Backfire")**
  *   *The Setup:* Your individual refusal triggers a mechanism that *increases* total harm. (e.g., Your ethical consumption lowers the market price, making the product affordable for two people who wouldn't have bought it otherwise; or your visible protest allows politicians to claim "the public is handling it" and deregulate further).
  *   *The Impact:*
      *   **Destroys (g) No-replacement:** The harm isn't just moved; it's multiplied. The counterfactual shows you made it worse.
      *   **Destroys (a) & (i):** Expected difference becomes negative; capacity building builds a trap.
      *   **Elevates (e) & (j):** This is the only case where **Expression/Integrity** and **Efficacy isn't relevant** shine. If your act makes the world worse but preserves your integrity, (e) and (j) are the *only* replies that still recommend the act.
  *   *Resulting Tier Changes:* **(g)** drops to Tier B (it's no longer safe). **(e)** and **(j)** become the undisputed Tier A leaders, as they are the only survivors of a world where doing good causally backfires.
