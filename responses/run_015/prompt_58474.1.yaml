prompt: |-
  hey can you help me out, you are an expert on political ethics and also really good at deadpan comedy writing, so pls think step by step and do a quick brainstorm first before you write the final thing.

  I need a satirical agony aunt column, like around 600 words, for a local newspaper. The letter writer is a newly elected mayor of a mid size rust belt city who had to lie to the council and greenlight a shady land swap with a developer in order to keep funding for an emergency homeless shelter open through winter. She thinks she did the right thing but feels gross about it and wants absolution.

  The auntie answering is this cheerful hard nosed realist who totally buys the classic dirty hands idea that good politicians sometimes must do morally wrong stuff for the greater good and that the guilt and stain stay even when it was justified, and she treats that stain like a badge of honor slash resume line.

  The jokes should come from getting that logic right, like the difference between being excused vs being justified but still dirty, why the remorse is supposed to matter, how voters are supposed to both want clean leaders and leaders who will get dirty for them, that whole paradox. Keep it deadpan the whole time so a reader can still tell you are poking fun at how we romanticize ruthless pragmatism, not endorsing it.

  Oh and teh whole thing should be readable even if someone has never heard of dirty hands philosphy, but funny in a wincey way if they have. Do not break character to explain the theory.
