  2.  **Deconstruct the Frameworks:**
      *   **Coherent Extrapolated Volition (CEV):** "What we would want if we knew more, thought faster, were more the people we wished we were, had grown up farther together." Key element: *Growth*, *Process*, *Becoming*. It simulates a trajectory of personal development. It values the *destination* of the extrapolation even if the *path* is not currently choosable.
      *   **Idealized-Preference (IP) / Informed-Desire / Ideal-Advisor:** "What I would want if I were fully informed and rational *now*." Key element: *Counterfactual Stability*, *Current Identity*. It asks: If *I* (as I am now, essentially) knew everything, what would *I* choose? It often assumes the agent's core identity/values are fixed for the purpose of the evaluation.

