answer: |-
  You have hit on exactly the right tension in Dennett's work. Your grasp of the Quine connection is spot-on: Dennett is indeed applying Quine's critique of the analytic/synthetic distinction (from "Two Dogmas of Empiricism") to the distinction between objective physical facts and subjective private feelings. He argues that the "line" philosophers draw around qualia is as incoherent as the line Quine drew around analyticity.

  However, your confusion about the fMRI labs and your toothache reveals where most people (even professional philosophers) trip over Dennett's "illusionism."

  Here is the breakdown of why science continues, why your toothache still hurt, and what "quining" actually does.

  ### 1. The Phlogiston Analogy: Why fMRI Labs Keep Hunting
  You asked: *If qualia are incoherent, why look for Neural Correlates of Consciousness (NCC)? Isn't that like studying phlogiston?*

  This is the strongest objection to Dennett, but there is a nuance in the analogy.
  *   **Phlogiston** was a proposed *substance* to explain combustion. When we discovered oxidation, we realized phlogiston didn't exist. However, **combustion** (fire, heat, light) still existed. We didn't stop studying fire; we just stopped explaining it with phlogiston.
  *   **Qualia** (in the philosophical sense Dennett attacks) are proposed *properties* (ineffable, intrinsic, private) to explain experience. Dennett argues these properties don't exist. However, **conscious experience** (reporting pain, discriminating red from green) still exists.

  Neuroscientists looking for NCCs are not actually looking for "qualia" in the philosophical sense. They are looking for the **mechanisms of discrimination and reporting.**
  *   When a lab scans a brain seeing red, they aren't looking for the "redness" floating in the neurons. They are looking for the specific circuitry that allows the subject to press a button and say, "I see red."
  *   Dennett is fully on board with this. He just insists that once you find all the neural mechanisms that account for the behavior and the reporting, **there is nothing left to explain.**

  If scientists think they are hunting for the "inner glow" that causes the button press, Dennett would say they are chasing phlogiston. If they think they are mapping the functional architecture that *constitutes* the button press capability, he says they are doing good science. The concept of qualia is useless for the *explanation*, but the *phenomenon* (the behavior/report) is the data.

  ### 2. The Toothache: Why "Quining" Didn't Stop the Pain
  You wrote: *I tried quining my own toothache... but it still hurt.*

  This is the most common misunderstanding of "Quining Qualia." **Quining is not anesthesia.**

  Dennett is not saying the pain signal isn't firing. He is not saying the distress isn't real. He is attacking the *metaphysical interpretation* of the pain.
  *   **The Qualia View:** "I have a pain. This pain is a private, intrinsic object in my mind that only I can know. Science can see my C-fibers firing, but it cannot see the *hurtfulness* itself."
  *   **The Dennett View:** "You have a state of brain activity that disposes you to say 'ouch,' grimace, and avoid chewing. The 'hurtfulness' is not a separate thing added on top of the brain state. The brain state *is* the pain."

  When you tried to quine your toothache, you likely tried to treat the sensation as "unreal." That's not the method. The method is to realize that **your access to the pain is not infallible.**
  *   Quine argued that observation sentences ("There is a rabbit") are not incorrigible; they can be revised.
  *   Dennett argues that introspection ("I am in pain") is not incorrigible either.

  If you "quined" the toothache successfully in Dennett's sense, you wouldn't stop feeling pain. You would stop believing that there is a **magic inner screen** where the pain is displayed. You would accept that the pain is just a complex functional state of your body. The pain remains, but the *mystery* of the pain is dissolved.

  ### 3. Quining a Concept vs. Bad Description
  You asked: *Is there a real difference between quining a concept and just being bad at describing it?*

  Yes. This is the difference between **Eliminativism/Illusionism** and **Imprecision.**

  *   **Bad Description:** "I can't describe the color red well." (The thing exists, my language is weak.)
  *   **Quining:** "The category you are using to group 'red experiences' relies on contradictory assumptions (e.g., that they are private yet knowable, intrinsic yet causally effective)."

  Dennett argues that "Qualia" is a **theoretical posit**, not just a description of feeling. It's like "phlogiston" or "witchcraft."
  *   If you say, "I'm bad at describing witches," you imply witches exist but are hard to pin down.
  *   If you "quine witches," you argue that the concept relies on incoherent magic, so nothing fits the category.

  When you feel a toothache, you are having a real experience. But if you claim that experience possesses **Qualia** (with a capital Q, meaning intrinsic, ineffable, private properties), Dennett says you are positing a theoretical entity that doesn't exist.

  ### Summary: Did you mess up the method?
  You didn't mess up, but you applied a philosophical solvent to a physiological problem.

  1.  **Science:** fMRI labs aren't studying "Qualia"; they are studying the **functional machinery of consciousness.** Dennett thinks this is valid, provided they don't fall for the "Cartesian Theater" (the idea that there's a little man inside watching the brain scans).
  2.  **Toothache:** Quining qualia doesn't remove the nociception or the suffering. It removes the belief that your suffering is a **private, non-physical object.**
  3.  **Concept vs. Description:** It's not that you are bad at describing the pain; it's that the philosophical framework you are using to *categorize* the pain (as a "quale") is a bug, not a feature.

  Dennett's point is ultimately therapeutic for science, not for your dentist visit. He wants to stop philosophers from saying, "Science can explain the brain, but it can't explain the *feeling*." His argument is: If you explain the brain's functional dispositions completely, you *have* explained the feeling. There is no remainder.

  So, your toothache hurt because "quining" isn't a mental trick to ignore pain; it's a logical argument to stop reifying pain into a metaphysical substance. The pain is real; the "qualia" is the story you tell yourself about the pain that makes it seem mysterious.
