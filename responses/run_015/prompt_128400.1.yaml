      *   **Round 4 (Mara's Rebuttal - Constraint/Unification):** Mara needs to avoid saying "it works so it's true." She needs to argue that the structure *constrains* the physical possibilities in a way that accidental formalism wouldn't. The structure dictates *how* phenomena relate across domains.
      *   **Closing:** No resolution (it's a deadlock), but a deepening of the stalemate.

  4.  **Refining the Dialogue (Self-Correction during drafting):**
