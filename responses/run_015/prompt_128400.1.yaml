      *   **Core Issue:** Does Structural Realism (SR) solve the Pessimistic Meta-Induction (PMI), or is it disguised anti-realism/instrumentalism?
      *   **Format:** Dialogue between two interlocutors (Mara and Jonas) standing outside the seminar room. No bullet points, no citations, no reading lists.
      *   **Characters:**
          *   *Mara:* Defends *substantive* Structural Realism (Epistemic or Ontic, likely leaning towards Ontic given the "real relational features" claim). Focuses on retention of mathematical structures (Hamiltonian, Poisson/Einstein) as mapping to real relations, even if entities change.
          *   *Jonas:* Defends a rigorous PMI/Instrumentalist critique. Grants formal continuity but argues form preservation $\neq$ ontological reference. Presses on whether predictive novelty within structures proves realism or just mathematical skill.
      *   **Constraints:** Must respond to actual points (no strawmen), avoid general appeals to "progress," focus on conceptual machinery (cross-domain constraint, explanatory unification vs. formal extension).

  2.  **Deconstruct the Arguments:**
      *   *Mara's SR:* The math isn't just a tool; it's the skeleton of reality. When Fresnel's equations survive into Maxwell, or Newton's gravity into Einstein, the *structure* is what was true, not the "ether" or "force at a distance."
      *   *Jonas's PMI:* Past theories had math that worked but referred to nothing (phlogiston, caloric, ether). Just because the equation looks the same doesn't mean the variables refer to anything real now. Maybe the next theory keeps the math but changes the meaning again. Is SR just saying "the math predicts" without committing to "the math describes"?
      *   *The Crux:* Does the *success* of extending the structure (predictive novelty) imply the structure is real, or just that the formalism is flexible?
      *   *Mara's Counter:* It's about constraint. The structure *limits* what can happen across different domains. It's not just curve-fitting; it's unification.

  3.  **Drafting - Section by Section:**

