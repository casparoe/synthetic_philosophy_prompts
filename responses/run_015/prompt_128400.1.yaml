answer: |-
  The hallway outside the seminar room was cold, the radiator clanking in a rhythm that seemed to mock the stalled conversation inside. Mara leaned against the brickwork, arms crossed, while Jonas paced the length of the corridor, rubbing his temples.

  "You didn't answer the charge, Mara," Jonas said, stopping to face her. "You kept talking about retention. Yes, the Hamiltonian formalism survives the jump from classical to quantum. Yes, the Poisson equation sits inside General Relativity like a fossil in amber. But showing me that the *syntax* persists doesn't tell me why I should believe the *semantics* refer to anything real. You've just shifted the PMI from objects to equations."

  Mara pushed off the wall. "I haven't shifted it; I've solved it by distinguishing what we are entitled to believe exists. The PMI relies on the history of ontological waste—phlogiston, the ether, caloric fluid. Structural realism grants you that point entirely. Those *objects* were mistakes. But the relations they were embedded in? The conservation laws, the field equations, the symmetries? Those weren't discarded. They were subsumed. If the only thing that survives a revolution is the mathematical structure, the most parsimonious explanation is that the structure was capturing the invariant relations of the world all along."

  "That's the leap," Jonas countered, stepping closer. "You say 'most parsimonious explanation.' I say 'pragmatic necessity.' When a new theory comes along, it has to recover the predictive success of the old one in the domain where the old one worked. Of course the equations are going to look similar in the limit. That's a constraint on *theory construction*, not a constraint on *reality*. You're mistaking the requirement for empirical continuity with evidence of ontological continuity."

  "But it's not just about recovering old results," Mara said. "It's about the new ones. Look at the metric tensor in General Relativity. We didn't just tweak it to fit Mercury's perihelion. We took that structural framework and derived gravitational lensing, time dilation, waves. If the structure were merely a convenient instrument for organizing phenomena, why does extending the formalism yield novel, risky predictions that turn out to be true? An instrument is designed for a specific task. A map of the terrain allows you to navigate places you've never been."

  Jonas shook his head, a tight smile forming. "That's the instrumentalist's favorite trap, and you're walking right into it. Mathematicians are good at extending formalisms. I can write down a consistent set of differential equations that predict all sorts of novel phenomena. If those phenomena show up, it proves the math is consistent with nature, not that the variables in the equations correspond to physical relata. You're asking me to believe that because the *calculus* works, the *geometry* is real. But history shows us that we can keep the calculus and completely invert the geometry. Think of the shift from action-at-a-distance to field theory. The inverse-square law remained, but the physical mechanism went from 'nothing in between' to 'stress in a medium' to 'curvature of spacetime.' The structure stayed, but what the structure *was* changed entirely. So what exactly are you being a realist about?"

  "I'm being a realist about the constraints," Mara said, her voice sharpening. "You're treating the structure as if it's a free-floating language we impose on the world. But the world pushes back. The reason the Hamiltonian framework survives isn't just because physicists like elegance. It's because the physical world exhibits symmetries that *require* that structure to be described coherently. When I say the structure is real, I mean that the world possesses a specific topology of relations that constrains which formalisms are viable. If structural realism were just instrumentalism, we could swap out the underlying group theory for something incompatible as long as the output matched. But we can't. The structure dictates the possible interactions."

  "Does it?" Jonas challenged. "Or does the structure dictate the possible *calculations*? You mentioned cross-domain constraint earlier. Let's press that. You claim that because the same metric structure governs light, matter, and gravity, it must be real. But isn't it equally plausible that we have simply found a very powerful, very general language for describing correlations? If I use the same statistical distribution to model stock markets and gas particles, I don't conclude that stock markets are made of molecules. I conclude I have a useful formalism. Why is the metric tensor different?"

  "Because the stock market analogy is superficial," Mara replied instantly. "It's an analogy of behavior, not of constitution. In physics, the structure isn't just modeling the behavior; it's mediating the interaction. The metric doesn't just describe how light bends; it determines the causal structure of the events themselves. It tells matter how to move. If it were merely a descriptive tool, like your stock market curve, it wouldn't have causal efficacy. But in GR, the geometry *is* the gravity. To deny the reality of the structure is to deny the mechanism of the theory. You're left with magic: matter moves, and the equations predict it, but there is no 'why' in the relations themselves."

  Jonas stopped pacing and looked out the window at the dark campus. "That's the 'no miracles' argument dressed in differential geometry. You're saying, 'It acts real, so it is real.' But the PMI whispers that future physicists might look at our 'causal structure' the way we look at the ether's 'stress conditions.' They might keep the Einstein field equations exactly as they are but interpret the metric not as spacetime geometry, but as something else entirely—a condensate, a field on a flat background, who knows. If they can do that, if they can retain the math while discarding your 'causal structure,' then your realism is about the math, not the world. And that's just Platonism, or worse, instrumentalism with extra steps."

  Mara sighed, rubbing her arms against the chill. "If they retain the math, Jonas, they retain the relations. If they say the metric is a condensate, they are still admitting that the *relations* encoded by the metric are what govern the physics. The label 'spacetime' versus 'condensate' is an ontological gloss. The structural realist says the gloss is where the error happens, not in the relational network. You keep demanding to know what the relations are relations *between*. That's the old substance metaphysics talking. I'm telling you the relations might be all there is."

  "And that," Jonas said, turning back to her, "is where you lose the grip on reference. If there are no relata, there is no structure. A relation without terms is nothing. If you say the terms are unknowable or disposable, you've severed the link between the theory and the world. You have a map with no territory. You can tell me the map is incredibly detailed, and that new maps look like the old ones, but if you can't tell me what the map is *of* without referencing terms you admit are likely false, then you haven't solved the PMI. You've just accepted it and claimed the empty shell of the theory is the truth."

  "The shell isn't empty," Mara insisted. "It's filled with constraint. The fact that we cannot arbitrarily change the structure without breaking the empirical coherence of the theory across domains—that's the grip on the territory. The territory resists certain formalisms. That resistance is the signature of the real."

  "Or," Jonas said softly, opening the door back into the warmth of the building, "it's just the signature of our own cognitive limitations. We can only build theories that look like the ones we already have. We're tracing the same lines on the blackboard and calling it the skeleton of the universe because we don't know how to draw anything else."

  Mara didn't move to follow him immediately. "Then why do the lines predict the supernova?"

  Jonas paused in the doorway. "Because the lines are good at mirroring each other. Not because they mirror the dark."

  He held the door open. Mara looked at the blackboard inside the room, covered in the remnants of their earlier derivations, then stepped through. The deadlock held, heavy and unresolved, in the space between them.
