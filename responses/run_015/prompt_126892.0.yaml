  Scenario
  Marcus enters a university psychology lab, having been unemployed for eighteen months. The intake form details a competitive reaction-time task involving loud noises and simulated monetary loss scenarios. Researchers disclose risks of temporary anxiety, fatigue, and minor hearing discomfort, promising full payment of two hundred dollars even if he withdraws mid-session. They explain he can leave without penalty by pressing a red button on the console. Marcus signs, needing the funds for groceries and bus fare. Procedurally, everything described occurs exactly as stated. However, the researchers conceal the true aim: measuring how subjects attribute blame to partners when failing tasks. Marcus understands the mechanics and risks perfectly but remains unaware of the investigative goal regarding moral judgment rather than physiological stress. Economic pressure is significant; no one threatens him, yet the money represents essential survival resources. He consents knowingly to the actions but not the ultimate end.

  The Three Verdicts
  The informational account validates consent because Marcus received all material data regarding physical hazards, procedural steps, and withdrawal rights. Since no facts about harm or logistics were hidden, his authorization meets the threshold for informed permission. This view prioritizes transparency about consequences over transparency about motives, holding that knowledge of risk is sufficient for liberty. It assumes that as long as the agent knows what will happen to their body, they are protected. Conversely, the autonomy-based account invalidates consent. It argues that self-governance requires understanding the normative context of one's actions. By deceiving Marcus about the purpose, researchers manipulate his reasons for acting, while economic desperation constrains his ability to refuse, rendering his choice non-voluntary. He is treated as a means rather than an end, unable to align the action with his own values regarding moral experimentation. Liberty requires control over the narrative of one's life, not just physical safety. The transactional account offers a middle ground, viewing consent as a mutually understood exchange. It might judge the consent valid if the exchange was fair and understood as a contract, regardless of internal motives. However, because the researchers hid the true purpose, the mutual understanding is fractured. The transaction fails because the parties are not agreeing to the same thing, even if the external terms match. Thus, while the informational view sees a signed form with disclosed risks, the autonomy view sees a compromised agent, and the transactional view sees a defective contract due to mismatched intentions regarding the study's goal. The transactional view ultimately leans invalid because the deception prevents a meeting of the minds regarding the fundamental nature of the interaction. This creates a fundamental ethical split.

  The Separating Feature
  The divergence stems from differing definitions of material information. The informational account treats only physical risks and procedural mechanics as essential for valid authorization. It assumes knowing bodily outcomes suffices. The autonomy account treats the purpose of the action as equally material. It assumes knowing why is required for self-governance. Therefore, the single separating feature is the moral relevance of the study's purpose. One view sees purpose as incidental background; the other sees it as constitutive of the action itself. This distinction determines whether deception invalidates consent.

  Removing the Pressure
  If the economic pressure is removed but the purpose-deception remains, the autonomy verdict likely remains invalid. Desperation exacerbates the violation, but the core autonomy objection rests on the manipulation of reasons. Even a wealthy participant cannot autonomously consent to being used for blame attribution if they believe they are testing stress tolerance. The deception prevents them from aligning the action with their values. Removing the money makes the choice more voluntary, but it does not restore the capacity for self-legislation regarding the act. The lie undermines the agent's authority.

  The Informational Counterattack
  A defender of the informational account would argue that the autonomy verdict is overly paternalistic and impractical. Claiming requiring disclosure of research hypotheses undermines scientific validity and treats adults like children unable to handle incomplete narratives. As long as Marcus knows the risks and can leave, he retains sufficient control. To invalidate consent based on hidden motives is to impose a subjective standard of understanding institutions cannot meet. Respecting choice means honoring the signed agreement based on disclosed facts, not policing the internal reasons for agreeing. Demanding full transparency of purpose privileges philosophical purity over practical liberty and hinders research.
