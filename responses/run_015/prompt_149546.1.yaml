answer: |-
  Dear friend, thanks for sending this over because it is a wonderfully messy case study that cuts right through the abstract noise of the interpretation debates we usually dwell in. You are right to suspect that the slogan the author is dead is doing too much heavy lifting in that thread, and frankly it is behaving like a Swiss Army knife where everyone is pulling out a different tool and claiming it is the only one that exists. If we are to map this space properly without resorting to the usual textbook summaries of Barthes or Wimsatt and Beardsley, we need to look at the specific philosophical claims your editors are making when they invoke that phrase, ranging from the modest to the metaphysical, and test them against the practical reality of your wiki.

  The first claim, which is the most trivial and perhaps the most useful, is that the author's later statement is just another text with no special standing. This is essentially a claim about genre and medium rather than ontology. It suggests that an AMA post is paratext, distinct from the canonical text of the setting itself. This is substantive and defensible, especially given your style guide likely defines what counts as canon. It is not false, provided you have a clear definition of what constitutes the work versus commentary on the work. In terms of doing the work in the thread, this move successfully blocks the retcon without needing to kill the author metaphysically; it simply categorizes the AMA as non-canonical commentary. However, it relies on your community accepting that the published text is the boundary of the work, which is a convention you can enforce but not a truth of nature.

  The second claim is that there is simply no fact of the matter about what the setting says. This is the radical anti-realist position, suggesting meaning is indeterminate until a reader actualizes it. This is not a platitude; it is a strong philosophical stance derived from post-structuralism. Whether it is defensible depends on whether you believe fictional worlds have ontological status independent of reading. I would argue it is actually false in the context of a collaborative wiki, because your wiki functions as a record of agreed-upon facts, not a poem open to infinite semiosis. If there were no fact of the matter, your disputes channel would be meaningless. Consequently, this claim fails to do the work in the thread because it undermines the very possibility of editing or maintaining a consistent setting, leading to paralysis rather than resolution.

  The third claim is that our reading is as good as his so majority vote wins. This shifts the ground from semantics to politics. It is not a claim about meaning at all but about authority. It is defensible as a policy for a collaborative project, but false as a statement about interpretation theory, since reader response does not inherently trump authorial intent in most aesthetic frameworks. In the thread, this does the work of resolving the dispute democratically, but it risks alienating contributors who view the project as stewardship rather than ownership. It turns the wiki into a democracy rather than an archive, which might be what you want, but it is not what the slogan literally means.

  The fourth claim is that intentions are fine as evidence but only the published text is canon. This is a form of moderate intentionalism or textualism. It is substantive and highly defensible, aligning with how courts often treat contracts or how literary scholars treat revised editions. It is not false, though it is a normative choice about how to treat evidence. This does the work in the thread effectively by allowing the AMA to inform future writing without erasing past contributions. It treats the author's intent as data rather than law.

  Now, regarding your house rule, the ratchet mechanism where later statements can add but not retract, this is where the philosophical rubber meets the road. You asked whether this is a claim about meaning or just a policy about what we record. I am inclined to say it is primarily a policy about reliance interests, akin to promissory estoppel in law, rather than a semantic claim. It acknowledges that meaning might change or clarify, but the social cost of changing the record is too high. This is consistent with the first and fourth claims above, where the text is fixed but interpretation can evolve. It quietly contradicts the strongest form of the death of the author slogan if that slogan implies meaning is entirely unstable or that the author has no privileged role in expansion. However, it is perfectly consistent with a weaker version where the text is autonomous once published. The ratchet is doing something real; it is protecting the labor and campaigns of your users. If you keep the ratchet, you are prioritizing community stability over ontological purity regarding the fictional world. The cost you pay is accepting that your wiki might diverge from the author's current mental state, meaning the setting becomes a distinct entity from the author's imagination.

  This leads us to your housemate's point about wills and estates, which is crucial for sorting genres. The slogan the author is dead was coined for literary works, which are aesthetic objects meant for interpretation. It does not carry over neatly to promises, wills, or statutes, which are speech acts meant to change the world or distribute resources. In law, intention often matters because the validity of the act depends on the mental state of the agent, whereas in aesthetics, the value lies in the experience of the recipient. The principle that sorts the genres is whether the text is constitutive or expressive. A will constitutes a transfer of property; a novel expresses a world. Your wiki sits in a hybrid space. It is expressive like a novel but constitutive like a law because it establishes the rules for play. When the author is a committee, as with statutes or your wiki, the idea of a singular intention is already a fiction. In those cases, we usually default to public meaning because aggregating individual intents is impossible. So the slogan carries over only if you treat the wiki as purely aesthetic, but if you treat it as a rulebook for play, the reliance interest (the ratchet) matters more than the intent.

  Finally, the point that the AMA post is itself a text whose author is equally dead is a real move, not just a cheap one, but it risks infinite regress. If every clarification is just another text requiring interpretation, you never reach a stable ground. However, pragmatically, we distinguish between types of utterances. We treat an AMA as a claim about the world, not the world itself. Acknowledging the AMA is text allows you to analyze it, but it does not force you to grant it authority. The cost of accepting this reflexive point fully is that you can never accept any clarification as definitive, which might be exhausting. It is better to treat it as a reminder that the AMA is fallible, not that it is meaningless.

  If I have to break the tie as you requested, I would rather keep the claim that your house rule is doing something real than keep the slogan in its strongest form. The ratchet protects the collaborative labor that built the wiki, which is the actual value of the project. The slogan in its strongest form, suggesting no fact of the matter or total democratization of meaning, threatens to dissolve the shared reality you are building. By keeping the ratchet, you are paying the cost of admitting that your canon is a social construct maintained by policy rather than a reflection of the author's true vision. You are choosing the health of the community over the authority of the creator. This is a defensible trade-off because a fictional world only exists insofar as people use it. If you keep the slogan in its strongest form instead, you pay the cost of instability; every new statement becomes a battle of interpretations with no mechanism for resolution, and the reliance interests of your players are violated. You gain philosophical purity regarding the autonomy of the text but lose the functional utility of the wiki as a shared resource. Given that you are running a game setting and not a seminar on deconstruction, the utility of the ratchet outweighs the theoretical elegance of the death of the author. You are essentially deciding that the readers have become co-authors through their reliance, and that is a status worth protecting.
