  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Death of the Author (Barthes):* Often misunderstood. It's not just "ignore the author." It's about the birth of the reader and the multiplicity of meaning.
      *   *Intentional Fallacy (Wimsatt & Beardsley):* Judging a work by the author's intended meaning is a mistake. The text stands alone.
      *   *Moderate Intentionalism (Hirsch, etc.):* Meaning is determined by intention, but significance changes.
      *   *Semantic Autonomy:* Once published, the text belongs to the public.
      *   *Speech Act Theory (Austin/Searle):* Texts as actions (promises, laws, wills). Intentions matter more here for felicity conditions.
