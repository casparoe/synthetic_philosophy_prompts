              1.  The "ratchet" house rule (later statements add but don't retract). Consistency with slogan? Is it about meaning or policy?
              2.  Comparison to legal contexts (wills, statutes) where intention matters. Does the slogan carry over? What sorts genres? Committee authorship.
              3.  The reflexive critique (the AMA post is itself a text whose author is dead). Clever or cheap?
