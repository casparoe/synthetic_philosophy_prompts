  2.  **Deconstruct the User's Cases & Verdicts:**
      *   *Statesman/private conversation (consistent with record):* Fine.
      *   *Abolitionist/private doubt (inconsistent with public cause):* Not fine.
      *   *Moving a dated meeting + adding person:* Not fine.
      *   *Replacing documented event with invented quarrel (hostile men):* Not fine, but less bad than moving meeting.
      *   *Compositing minor figures:* Fine.
      *   *Exaggerating explorer (memoirist):* Undecided (fidelity to record vs. her self-account).
      *   *Dead 3 years (kids alive) vs. Dead 200 years:* Recent feels worse.
      *   *Woman in colonial files (inventing inner life):* Feels owed/repair.
      *   *Brave undocumented act vs. Cowardly undocumented act:* Treated differently (Brave OK? Cowardly Not OK?).
      *   *Current Rule:* "Dark-Room Rule" (Invent where dark, shrink as record grows).

  3.  **Evaluate the "Dark-Room Rule":**
      *   *Strengths:* Captures the intuition about documentation density (Statesman vs. Abolitionist).
      *   *Weaknesses:*
          *   Doesn't explain the *Brave vs. Cowardly* asymmetry (both are "dark").
          *   Doesn't explain the *Recent vs. Distant* dead asymmetry (both are "dark").
          *   Doesn't explain *Colonial Subject* exception (record exists but is hostile/external).
          *   Doesn't explain *Moving Meeting* vs. *Invented Quarrel* (both involve altering record, but severity differs).
      *   *Conclusion:* The Dark-Room Rule is necessary but not sufficient. It needs a moral valence (harm/reputation) and a relational component (legacy/memory).

  4.  **Identify Underlying Principles (Philosophical/Ethical Landscape):**
      *   *Posthumous Harm:* Can the dead be harmed? (Feinberg vs. Pitcher). Consensus: Legally no, morally contested.
      *   *Reputation/Integrity:* We owe fidelity to the *narrative identity* of the person.
      *   *Reader Trust:* The contract between author and reader (Lejeune's "Autobiographical Pact" adapted).
      *   *Historical Justice:* Correcting silences (Subaltern studies).
      *   *Settled vs. Contested:*
          *   *Settled:* Fabricating documents as archive is generally condemned by historians and ethical fiction guidelines (unless clearly signaled as meta-fiction).
          *   *Contested:* The degree of permissible invention in "based on a true story" vs. "historical fiction." The moral status of the dead.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. State my footing immediately (AI synthesizing philosophical/literary discourse, not a moral authority).
      *   **Analyzing the Dark-Room Rule:**
          *   It explains the *density* of invention (Statesman vs. Abolitionist).
          *   It fails on *valence* (Brave vs. Cowardly).
          *   It fails on *provenance* (Colonial files).
          *   It fails on *temporal proximity* (3 years vs. 200 years).
      *   **Proposing a Refined Principle:**
          *   Need to combine *Epistemic Humility* (Dark-Room) with *Narrative Justice* (Reputation/Legacy).
          *   Let's call it the **Principle of Non-Maleficent Narrative Expansion**.
          *   Core: You may fill silences *unless* doing so violates the subject's established moral identity or causes foreseeable harm to living memory/legacy.
      *   **Addressing the "Force to Abandon" Verdicts:**
          *   *Brave vs. Cowardly:* If the principle is about "truth," both are equally suspect. If the principle is about "harm," they differ. A strict epistemic principle forces you to treat them the same. A moral principle allows the distinction. I need to point out that treating them differently relies on a *moral* judgment, not an *historical* one.
          *   *Recent vs. Distant Dead:* A strict "rights of the dead" principle says time doesn't matter. A "harm to living relatives" principle says it does.
      *   **The Forged Document Case:**
          *   This breaks the reader contract. It's generally considered unethical in historical fiction unless it's a specific stylistic device (e.g., *Pale Fire* style) made clear.
      *   **Owed to Dead vs. Owed to Readers:**
          *   User is conflating them.
          *   *Dead:* Reputation, integrity of identity.
          *   *Readers:* Trust, not being misled about what is history vs. fiction.
      *   **Squeamishness vs. Moral Perception:**
          *   *Squeamishness:* Moving the meeting date (pedantic historicism).
          *   *Moral Perception:* The Abolitionist's doubt (betrayal of legacy), The Colonial Subject (restorative justice).
      *   **My Footing (Meta-Commentary):**
          *   Clarify I am an AI.
          *   Cite the lack of empirical data on reader belief.
          *   Distinguish between historian ethics and novelist ethics.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I shouldn't just say "Here is the rule." I need to show *why* the user's intuitions diverge from their stated rule.
      *   *Nuance:* The "Brave vs. Cowardly" case is the key. The user treats them differently. Why? Because one enhances legacy, one damages it. This implies the user *does* care about posthumous harm, despite the "dark room" rule suggesting only epistemic gaps matter.
      *   *The Forged Document:* This is the hardest case. Historians hate it. Novelists do it (Hilary Mantel creates dialogue, but not documents). If presented *as* archive, it's fraud. If presented as *novelistic device*, it's art. The prompt says "presented as archive." That's the red line.
      *   *Empirical Claim:* I must admit we don't know if readers actually confuse fiction for fact. Studies are mixed.

  7.  **Final Polish:** Check against all constraints.
      *   Did I separate settled/contested? Yes.
      *   Did I address the forged document? Yes.
      *   Did I address Dead vs. Reader obligations? Yes.
      *   Did I identify squeamishness? Yes.
      *   Is the tone appropriate? Yes.

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  I am an AI, not a moral philosopher or a guild representative for historical novelists. My footing here is synthesetic: I am drawing on established debates in the philosophy of fiction, bioethics regarding the dead, and the professional ethics of historians and biographers. I must be explicit: there is no consensus on the morality of fictionalizing the dead. There are only competing frameworks. Where I state something as "settled," it is settled only within specific professional communities (e.g., academic history), not across the broader culture of storytelling. Where I note an empirical gap, it is because no robust data exists on how readers process historical fiction.

  Here is an analysis of your intuitions, your rule, and the principles underlying them.

  ### 1. Testing the "Dark-Room Rule"

  Your working rule is: *Invent only where the record is dark, and let the quantity you invent shrink as the record grows.*

  This is an **epistemic principle**. It concerns knowledge and evidence. It works well for your first two cases:
  *   **Statesman (Fine):** The room is dark (private conversation), and the content aligns with the known record.
  *   **Abolitionist (Not Fine):** The room is dark, *but* the content contradicts the known record (public cause/letters).

  However, the Dark-Room Rule breaks down on four of your other cases. It cannot explain them because they rely on **moral** or **relational** principles, not just epistemic ones.

  1.  **Brave vs. Cowardly Undocumented Acts:** You treat these differently. Epistemically, they are identical (both are "dark"). Morally, they are opposites. Your verdict here reveals that you are not actually following the Dark-Room Rule; you are following a **Principle of Non-Maleficence regarding Reputation**. You are protecting the subject from posthumous harm.
  2.  **Dead 3 Years vs. Dead 200 Years:** Epistemically, both are equally dark. Your discomfort with the recent dead suggests a **Principle of Proximity to Living Memory**. You are weighing harm to the grieving (the children) rather than harm to the dead.
  3.  **Colonial Subject:** Here, the record is *not* dark; it is full of colonial files. Yet you feel invention is "owed." This contradicts the Dark-Room Rule (which says invent less as record grows). This follows a **Principle of Restorative Justice**. The record exists but is hostile/distorting; invention is a corrective tool.
  4.  **Moving Meeting vs. Invented Quarrel:** You rate moving the meeting as worse. Epistemically, both alter the record. But moving a meeting disrupts *causality* (history), while a quarrel disrupts *character* (biography). Your intuition tracks the historian's sin (falsifying timeline) vs. the novelist's sin (falsifying motive).

  ### 2. The Repaired Principle

  Your verdicts do not add up under a single rule because you are balancing three competing obligations: **Truth (Epistemic), Reputation (Moral), and Trust (Relational).**

  To capture your actual practice, you need a composite principle. Let's call it the **Principle of Narrative Fidelity**.

  > **The Principle:** *You may fill epistemic gaps (the "dark room") provided that the invention does not violate the subject's established moral identity, does not cause foreseeable harm to living memory, and does not falsify the causal chain of public history.*

  **Where this forces you to abandon a verdict:**
  A defensible version of this principle forces you to square the **Brave vs. Cowardly** case.
  *   **Current Verdict:** Brave = OK; Cowardly = Not OK.
  *   **Principle Verdict:** If the record is truly dark, *both* should be treated with equal suspicion. By allowing the brave act but forbidding the cruel one, you are engaging in **hagiography**, not history. You are protecting the reputation rather than seeking the truth. If you claim to be writing historical *fiction* (exploring human complexity), forbidding negative traits in the absence of evidence is a form of censorship.
  *   **The Hard Truth:** If you keep this distinction, you must admit you are writing *myth*, not fiction. If you want to write fiction, you must accept that inventing a cowardly act is as epistemically valid as inventing a brave one, even if it feels morally heavier.

  ### 3. The Forged Document Case

  *Case:* A novel in which the real person appears only inside a document you forged yourself (letter/diary), presented as archive, which readers may take at face value.

  **Verdict:** This is ethically distinct from the other cases and is widely condemned across disciplines.

  *   **Why:** This violates the **Contract of Reader Trust**. In your other cases, the reader understands they are reading a novel that *interprets* history. In this case, you are presenting fiction *as* evidence.
  *   **Settled Consensus:** Among historians, archivists, and literary ethicists, fabricating primary sources is considered fraud. Even in historical fiction, if the paratext (author's note, marketing) does not explicitly flag the document as invented, this crosses from "interpretation" into "deception."
  *   **Contested View:** Some postmodern theorists argue that all archives are fictions anyway, so forging one merely highlights the instability of truth. However, this is a minority academic view and does not hold in general publishing ethics.
  *   **My Verdict:** You should not do this unless the frame of the novel makes the forgery unmistakable (e.g., the narrator is a known liar, or the author's note explicitly states "all documents are fabricated"). If readers take it at face value, you have broken the contract.

  ### 4. Owed to the Dead or Owed to Readers?

  You suspect you are conflating the two. You are correct.

  *   **Owed to the Dead:** This relies on the concept of **Posthumous Interests**.
      *   *Contested:* Philosophers disagree on whether the dead can be harmed. Joel Feinberg argued they cannot (no subject exists to suffer). Others argue that while they cannot *feel* harm, their *ante-mortem interests* (legacy, reputation) can be violated.
      *   *Your Practice:* Your hesitation on the "Cowardly Act" and the "Abolitionist's Doubt" suggests you believe you owe the dead fidelity to their projected identity.
  *   **Owed to the Readers:** This relies on **Epistemic Trust**.
      *   *Settled:* Readers of historical fiction generally expect a "truth claim." They expect that while dialogue is invented, the scaffolding (dates, major events, public stances) is accurate.
      *   *Empirical Gap:* We do not have good data on how far novels shape what readers believe about real figures. Some studies suggest readers can compartmentalize; others suggest the "fictional truth" overwrites historical fact in public memory (the *CSI Effect* applied to history).
      *   *Your Practice:* Your "Dark-Room Rule" is primarily about the reader. It says: "Do not contradict what the reader can check."

  **The Distinction:**
  *   When you refuse to make the Abolitionist argue against her cause, you are protecting the **Dead** (her legacy).
  *   When you refuse to move the dated meeting, you are protecting the **Readers** (their understanding of causality).
  *   When you refuse to forge the document, you are protecting the **Discourse** (the integrity of the archive).

  ### 5. Squeamishness vs. Moral Perception

  You asked me to identify which verdicts are professional squeamishness rather than moral perception.

  *   **Squeamishness:** *Moving a real, dated meeting a year later.*
      *   **Reasoning:** This is a historian's anxiety, not necessarily a moral one. Unless moving the meeting changes the outcome of a war or the passage of a law, it is a technical violation, not a moral one. If the plot requires it and the *meaning* of the meeting remains the same, this is a standard novelist's compression. Worrying about this is fetishizing the timeline over the truth of the experience.
  *   **Squeamishness:** *Replacing a documented event with an invented quarrel (hostile men).*
      *   **Reasoning:** You call this "less bad" than moving the meeting, but arguably it is *worse* for the reader's trust. Changing the date is a technicality; inventing a specific interaction creates a false memory in the reader's mind. However, if the hostility is documented, the "emotional truth" is preserved. Your discomfort here is likely fear of criticism from specialists, not a genuine moral breach.
  *   **Moral Perception:** *The Abolitionist's Doubt.*
      *   **Reasoning:** This is a genuine moral boundary. To invent internal opposition to a life's defining moral struggle is to undermine the subject's agency and legacy. It turns a historical actor into a psychological prop for your plot.
  *   **Moral Perception:** *The Colonial Subject.*
      *   **Reasoning:** This is restorative. When the record is an instrument of oppression, strict fidelity to the record perpetuates the oppression. Inventing inner life here is an act of reclamation.

  ### 6. Summary of Footing and Contention

  To ensure I am not presenting contested views as consensus:

  1.  **Posthumous Harm:** It is **contested** whether the dead can be harmed. I have analyzed your writing as if they *can* be (reputational harm), because that matches your intuition, but legally and in some philosophical frameworks, they cannot.
  2.  **Reader Impact:** It is an **empirical unknown** how much historical fiction distorts public historical understanding. I am assuming a duty of care based on the *potential* for distortion, not proven data.
  3.  **The Forged Document:** It is **settled** among historians and archivists that fabricating primary sources is unethical. It is **contested** among experimental fiction writers whether this matters if the art is "true." I have sided with the historians/archivists because your prompt implies a commitment to historical fiction, not meta-fictional experimentation.

  **Final Recommendation:**
  Your "Dark-Room Rule" is a good heuristic for *reader trust*, but it fails as a moral compass. You are actually operating a **Triangulated Ethics**:
  1.  **Epistemic:** Don't contradict hard data (The Dark-Room Rule).
  2.  **Moral:** Don't violate the subject's core moral identity (The Abolitionist/Brave-Cowardly constraint).
  3.  **Relational:** Don't harm living memory or deceive the reader (The Recent Dead/Forged Document constraint).

  If you formalize this, you will stop feeling that your verdicts "don't add up." They add up perfectly, just not to a single variable.
