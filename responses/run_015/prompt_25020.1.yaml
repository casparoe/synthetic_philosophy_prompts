answer: |-
  Three strangers are trapped in a sealed conference room when a fire suppression system malfunctions, releasing a non-lethal but painful irritant gas that will persist for ten minutes. The gas causes moderate respiratory distress to anyone exposed, but the manual override switch is located inside a small, unventilated maintenance closet that will fill with concentrated gas during operation. One stranger (A) is positioned nearest the closet and is physically capable of entering to flip the switch; doing so will cause A severe respiratory damage requiring hospitalization, while sparing all three from the moderate distress. If A does nothing, all three suffer the moderate distress equally. There are no prior agreements, professional duties, or special relationships among the strangers, and the scenario involves no fantastical technology, merely a building malfunction and a physical choice.

  (a) **Utilitarian Recommendation:** Utilitarianism recommends that A enters the closet. The calculation compares the aggregate welfare of the two options: Option 1 (Action) results in one instance of severe harm (A) and zero harm for B and C. Option 2 (Inaction) results in three instances of moderate harm. Assuming the disutility of severe harm is less than three times the disutility of moderate harm (1S < 3M), the principle of utility maximization requires A to act to minimize the total sum of suffering across the three persons.

  (b) **Separateness-of-Persons Objection:** A Rawlsian objector typically argues that utilitarianism fails to respect the distinctness of persons by treating the loss of one as offset by the gains of others, akin to balancing pains and pleasures within a single life. However, in this case, the objection loses its grip because the threat is **non-excludable** and the harm is **homogeneous**. Since A is included in the set of beneficiaries (A avoids moderate distress by accepting severe distress), the tradeoff structurally mirrors an intrapersonal choice (e.g., accepting a broken arm to avoid a fatal illness). The "separateness" is morally overshadowed by the **shared fate**, making the aggregation of welfare feel like prudent risk management for a temporary moral unit rather than the exploitation of one person by others.

  (c) **Structural Feature:** The specific feature doing the work is the **inclusion of the agent in the beneficiary set combined with the commensurability of harm**. In paradigm cases where the objection bites (e.g., punishing an innocent to prevent a riot), the sacrificed person receives no benefit from the sacrifice. Here, because A suffers the same *kind* of harm they are preventing (respiratory injury) and avoids the baseline threat, the boundary between "self-sacrifice" and "self-interest" blurs. This makes the interpersonal aggregation functionally equivalent to intrapersonal budgeting of harm, neutralizing the charge that distinct persons are being illicitly merged.

  (d) **Rawlsian Recovery:** A defender of the objection would recover its force by insisting on the **inviolability of bodily integrity** as a side-constraint that cannot be overridden by aggregate welfare, even when the agent benefits. They would argue that A has a right to refuse the severe injury, and that moral requirement cannot arise without **consent**. They would demand a modification where the decision is subject to a fair procedure (e.g., a lottery) rather than a direct utilitarian mandate, emphasizing that persons are sovereign ends who cannot be used as means to minimize total pain, regardless of the shared threat.

  (e) **Minimal Change:** The objection's full intuitive force is restored if we modify the scenario so that **A is immune to the gas** (e.g., A is wearing a protective mask). In this variation, A suffers severe harm solely to prevent moderate harm to B and C, receiving no self-benefit. This change matters because it severs the intrapersonal analogy; A is no longer managing a risk to themselves but is being used purely as a means for others' welfare. The separateness of persons becomes salient again, as the tradeoff is now purely interpersonal sacrifice, reactivating the Rawlsian intuition that aggregation cannot justify imposing substantial costs on an unwilling individual.
