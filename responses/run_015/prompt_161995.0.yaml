answer: |-
  ### Brainstorming: Sharpening the Question

  1.  **The Normative Metaphysics Approach:** Focus on whether groups *can* hold beliefs distinct from their members, using the dilemma to test theories of collective intentionality.
      *   *Drop:* This is too abstract. It doesn't help design institutions, and your friend's challenge is practical (how courts actually function), not metaphysical. You want to solve a design problem, not an ontology problem.
  2.  **The Empirical-Descriptive Approach:** Investigate actual appellate records to see if judges vote on premises or outcomes, testing your friend's claim against your own.
      *   *Drop:* This is political science, not philosophy. It risks getting bogged down in data access and IRB issues. Plus, even if they *do* vote on outcomes, the normative question remains: *should* they?
  3.  **The Trade-Off Classification Approach:** Model "Reason-Tracking" as a distinct epistemic utility function and map the parameter space (competence, correlation, agenda granularity) to find where PBP (Premise-Based Procedure) dominates CBP (Conclusion-Based Procedure) on one or both metrics.
      *   *Keep:* This is the winner. It respects the formal tradition but introduces your novel distinction. It yields a determinate answer (a classification of regimes) and allows for a concrete deliverable.
  4.  **The Meta-Agenda Regress Approach:** Focus entirely on the second-order problem of who selects the aggregation rule or agenda structure.
      *   *Drop:* As you suspected, this is a second dissertation. It invites infinite regress without solving the first-order design problem. Bracket it.

  ***

  ### Dissertation Fellowship Proposal

  **Project Title:** The Dual-Objective Discursive Dilemma: Competence Asymmetries and the Trade-Off Between Verdict and Reason

  **The Research Question**
  Standard treatments of the discursive dilemma ask: *Which procedure (PBP or CBP) is more likely to yield a true conclusion?* This project asks a classificatory question: **Is the trade-off between Verdict-Tracking (accuracy of the final decision) and Reason-Tracking (coherence between individual premise judgments and the collective rationale) ineliminable, or do specific structures of member competence and agenda granularity exist where one procedure strictly dominates the other on both metrics?**

  I aim to produce a taxonomy of "epistemic regimes." In some regimes, the standard advice to prioritize truth (Verdict-Tracking) will inadvertently destroy the court's ability to offer a coherent rationale (Reason-Tracking). In others, the two goods align. The goal is to identify the boundary conditions.

  **Motivation and Gap**
  The existing literature treats the choice between Premise-Based and Conclusion-Based procedures primarily as an epistemic engine for truth. It assumes the "good" is the correctness of the final verdict. My friend's challenge (that courts just vote outcomes) and my counter (that the reasoning *is* the authority) reveal that this single metric is insufficient. A court that reaches a true verdict via a rationale no majority supports undermines the doctrine of *stare decisis*, because future courts cannot rely on the reasoning as a stable precedent.

  Current models treat "agenda fragility" (the sensitivity of outcomes to how questions are split or lumped) as a bug to be minimized. I propose treating it as a diagnostic feature. If a procedure yields a stable verdict but a highly fragile rationale, it scores high on Verdict-Tracking but low on Reason-Tracking. By formalizing Reason-Tracking as a measure of the overlap between the set of propositions supported by a majority and the propositions entailed by the collective output, we can score procedures on two axes rather than one. The gap in the literature is the lack of a formal mapping showing how competence asymmetries (e.g., judges are better at legal questions than empirical ones) shift the optimal procedure on this two-axis plane.

  **Methodology and Timeline**
  This project requires formal modeling supplemented by simulation, not empirical data collection. The "data" will be synthetic competence matrices and agenda structures.

  *   **Months 1–3: Formalizing the Metrics.**
      I will define Reason-Tracking formally. A likely candidate is the proportion of premises in the minimal support set of the conclusion that are individually endorsed by a majority. I will prove limit theorems for PBP and CBP under conditions of homogeneous competence to establish baselines.
  *   **Months 4–6: Simulating Asymmetry.**
      I will run Monte Carlo simulations varying three parameters: (1) average competence, (2) competence asymmetry across premises (e.g., high competence on Premise A, low on Premise B), and (3) error correlation between members. The output will be heat maps showing regions where PBP dominates CBP on both metrics, regions where CBP dominates, and regions of trade-off.
  *   **Months 7–9: Agenda Fragility Stress-Testing.**
      I will introduce "granularity shifts." I will model the same logical space partitioned into coarse vs. fine premises. I will measure the variance in Reason-Tracking scores across these partitions. This tests whether a procedure's rationale is robust or an artifact of how the question was asked.
  *   **Months 10–12: Synthesis and Write-Up.**
      I will consolidate the simulation results into the "Procedural Heuristic" (see Deliverables) and draft the dissertation chapters.

  **Concrete Deliverable**
  The realistic deliverable is a **Procedural Selection Matrix**, not a rigid decision tree. A decision tree implies a deterministic answer for every case, which the probabilistic nature of epistemic social choice may not support. The Matrix will be a set of conditional guidelines for institutional designers (e.g., chief judges, committee chairs).

  *Example Entry:* "If member competence on factual premises is <0.6 but on legal premises is >0.8, and error correlation is low, adopt PBP to maximize Reason-Tracking without significant loss to Verdict-Tracking."

  Is this realistic? Yes, provided I restrict the scope to binary agendas with conjunction requirements. If I attempt to model complex logical graphs, the Matrix becomes too unwieldy. I will explicitly limit the scope to conjunctive agendas to ensure the heuristic remains usable.

  **Honest Failure Conditions**
  This project fails if:
  1.  **Metric Collapse:** Reason-Tracking and Verdict-Tracking turn out to be perfectly correlated across all simulated regimes. If maximizing truth *always* maximizes reason-coherence (or vice versa), the distinction is philosophically interesting but procedurally irrelevant.
  2.  **Instability:** The "optimal" procedure flips wildly with minor changes in competence estimates (e.g., a 1% shift in competence changes the recommendation from PBP to CBP). This would render the heuristic useless for real-world application where competence is hard to measure.
  3.  **Incoherence:** The formal definition of Reason-Tracking proves to be logically inconsistent or trivial (e.g., it always scores zero for any multi-member body).

  **Note on the Meta-Agenda Problem**
  You asked about the regress: *If the body chooses its own agenda or rule, does the problem reappear?*
  **My advice:** Cut it. This is a second project.
  If you include this in the proposal, you signal that you do not know when to stop. The meta-agenda problem is a version of the constitutional design problem, which is vast. If you try to solve the first-order aggregation problem *and* the second-order rule-selection problem in one year, you will solve neither.
  **Strategy:** Acknowledge the regress in the introduction as a boundary condition. State explicitly: "This project assumes the agenda and aggregation rule are exogenous variables set by a constitutional designer. The question of how that designer should proceed is reserved for future work." This shows you are aware of the issue but have the discipline to bracket it to ensure completion.

  **Summary**
  This proposal moves the discursive dilemma from a paradox to be dissolved to a design constraint to be managed. It validates your intuition against your friend's without dismissing her practical insight: sometimes verdicts matter most, but sometimes the rationale is the only thing that survives. The dissertation will tell us when is which.
