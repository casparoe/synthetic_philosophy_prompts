prompt: |-
  hey — I run a small weekly forecasting group (mostly people from the local EA / rationalist scene) and we keep hitting the same stalemate: two people have read each other's writeups, dumped all their private evidence into a shared doc, argued in the comments, and are still at, say, 10% vs 40% on some AI-timeline-ish question. Aumann's agreeeing-to-disagree result keeps getting invoked, so I've been trying to turn it into an actual protocol we can run in the room — call it the Common Prior Protocol. The steps are: (1) the common prior assumption says that two otherwise rational people can only disagree because of different private information, never because of different priors; (2) so once everything is in the shared doc, we've effectively got common knowledge of each other's posteriors; (3) so any gap that survives must be irrationality somewhere, and the remedy is mechanical — whoever has less private information just adopts the other person's number, since the other person's posterior already contains their evidence plus more.

  I want to run this at the next meetup but I suspect it's cheating in a couple of places, and I'd rather find out now then in front of twelve people. Where exactly does step (2) go wrong — is "we've both read the doc" anywhere near what the theorem needs, or is the condition something stronger that a shared folder just doesn't deliver? Is step (1) even the kind of claim you can apply to real people, or is it a modelling assumption about how one analyst represents a situation, in which case my whole diagnostic use of it is confused? And what about step (3) — if I learn your posterior, does conditioning actually move me all the way to your number, or somewhere else entirely, and is "whoever knows less defers" anywhere close to the right rule?

  Please give me a committed answer, not a survey: tell me plainly which steps are broken and how, whether any version of the protocol survives, and what you'd actually have us do in the room instead — including whether, if the honest conclusion is that the prior genuinely isn't shared, that should change how much we defer to each other at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Runs a small weekly forecasting group (EA/rationalist scene).
      *   **Problem:** Persistent disagreement (e.g., 10% vs 40% on AI timelines) despite sharing evidence and arguing.
      *   **Proposed Solution:** "Common Prior Protocol" (CPP) based on Aumann's Agreement Theorem.
      *   **Steps of CPP:**
          1.  Assume common priors (disagreement = private info).
          2.  Assume shared doc = common knowledge of posteriors.
          3.  Remedy: Less informed person adopts the more informed person's number.
      *   **Goal:** Identify where the protocol fails (specifically steps 1, 2, 3), give a *committed* answer (no fence-sitting), and provide actionable advice for the meetup.
      *   **Tone:** Direct, analytical, practical, slightly technical but accessible to rationalists.

  2.  **Deconstruct the "Common Prior Protocol" (CPP):**

      *   **Step 1: Common Prior Assumption (CPA).**
          *   *Theory:* Aumann's theorem *requires* common priors. If priors differ, the theorem doesn't apply.
          *   *Reality:* Real humans definitely do not have common priors. We have different life experiences, cognitive architectures, and fundamental worldviews.
          *   *Verdict:* This is the biggest break. Treating it as a factual claim about humans is wrong. It's a normative ideal, not a descriptive fact.
          *   *Implication:* You cannot diagnose "irrationality" solely based on persistent disagreement.

      *   **Step 2: Common Knowledge of Posteriors.**
          *   *Theory:* Aumann requires *common knowledge* of posteriors (I know your number, you know mine, I know that you know mine, ad infinitum).
          *   *Reality:* Reading a shared doc establishes *mutual knowledge* (I see your number, you see mine), but rarely *common knowledge*. Do I know how you interpreted the doc? Do you know that I know you interpreted it that way?
          *   *Verdict:* Broken. A shared folder is not common knowledge. It's just data exchange.
          *   *Implication:* The mathematical condition for agreement isn't met just by posting numbers.

      *   **Step 3: The Remedy (Deference).**
          *   *Theory:* If CPA holds and posteriors are common knowledge, posteriors must be equal. If not, someone is irrational. The rule "less informed defers" is a heuristic, not a theorem result.
          *   *Reality:* Even if CPA held, the update rule isn't "adopt their number." It's "update on the fact that they hold that number." If we have different likelihood functions (how we process evidence), we won't converge even with shared info.
          *   *Verdict:* Broken. "Less informed defers" is dangerous. It incentivizes sandbagging or ignores the value of diverse likelihood functions.
          *   *Implication:* Blind deference kills the diversity of thought that makes groups smart.

  3.  **Synthesize the "Committed Answer":**
      *   *Directness:* The protocol is fundamentally broken. It misapplies a math theorem to psychology.
      *   *Step 1:* False. Humans have different priors.
      *   *Step 2:* False. Shared docs $\neq$ common knowledge.
      *   *Step 3:* Dangerous. Deference rules should be about weighting, not replacing.
      *   *Survival:* A modified version exists (Geometric Mean of Odds / Prediction Markets), but not the "force agreement" model.
      *   *Actionable Advice:* Stop trying to force consensus. Aggregate instead.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the ambition. It's a classic rationalist trap. State clearly: The protocol is broken.
      *   *Step 1 Analysis:* The Common Prior Assumption is the fatal flaw. It's a mathematical convenience, not a human truth. EA/rationalists often have *divergent* priors on AI (e.g., compute thresholds vs. algorithmic breakthroughs). Calling this "irrationality" is uncharitable and wrong.
      *   *Step 2 Analysis:* "Common Knowledge" is a very high bar. It requires infinite recursion ("I know that you know that I know..."). A Google Doc is just mutual knowledge. Also, do you trust their calculation? If not, you aren't conditioning on their posterior, you're conditioning on "they claim this posterior."
      *   *Step 3 Analysis:* "Less informed defers" is gameable and epistemically unsound. If I have a different model (likelihood function), your posterior isn't evidence for my model in the way you think. Also, diversity of opinion is valuable for calibration.
      *   *The "Honest Conclusion":* If priors aren't shared, Aumann doesn't apply. Disagreement is expected.
      *   *What to do instead:*
          1.  **Aggregate, don't converge.** Use the Geometric Mean of Odds. It usually beats individual forecasts.
          2.  **Focus on "Why" not "What".** Instead of moving numbers, map the disagreement. (Is it a prior difference? A likelihood difference? An evidence difference?)
          3.  **Prediction Markets/Play Money.** Let people bet. Money reveals confidence better than arguments.
          4.  **Calibration Training.** Maybe one person is just miscalibrated.
      *   *Tone Check:* Ensure I'm not being dismissive. The impulse is good (seeking truth), but the tool is wrong. Use rationalist terminology correctly (common knowledge, likelihood functions, calibration).

  5.  **Refining the "Committed" aspect:**
      *   Avoid "On the one hand... on the other."
      *   Say: "Step 1 is false." "Step 2 is insufficient." "Step 3 is harmful."
      *   Provide a specific alternative protocol.

  6.  **Final Polish:**
      *   Make sure to address the specific question: "If the honest conclusion is that the prior genuinely isn't shared, that should change how much we defer to each other at all?"
      *   Answer: Yes. If priors differ, deference should be based on *track record* (calibration), not on the *content* of the argument or the amount of evidence read.

  7.  **Final Review against constraints:**
      *   Committed answer? Yes.
      *   Plainly which steps broken? Yes.
      *   What to do in the room? Yes.
      *   Address prior sharing? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting Delphi methods. But for a small meetup, Geometric Mean of Odds is easier and mathematically robust for forecasting. I should emphasize that *disagreement is a feature, not a bug* for aggregation.

      *(Refining Step 3)*: The user suggests "whoever has less private information just adopts the other person's number." This is particularly bad because "amount of information" is hard to measure. Better to defer to the person with better *calibration* on similar questions.

      *(Finalizing the verdict)*: The protocol is "epistemic theater." It looks like rigor but lacks the substance. I need to say that clearly.

  8.  **Constructing the Output:** (Proceed to generate response based on these points.)
answer: |-
  Here is the committed answer: **Your protocol is broken.** It misapplies a mathematical theorem as a psychological prescription, and if you run it in the room, you will likely degrade the quality of your forecasts while creating social friction.

  Here is exactly where the three steps fail, why the theorem doesn't save you, and what you should do instead.

  ### Step 1: The Common Prior Assumption (CPA)
  **Verdict: False.**
  You are treating the Common Prior Assumption as a diagnostic tool for irrationality. It is not. It is a modeling constraint.
  *   **The Math:** Aumann's Agreement Theorem *requires* common priors to prove that posteriors must converge. It does not prove that humans *have* common priors.
  *   **The Reality:** Humans demonstrably do not have common priors. You and your group members have different life experiences, different cognitive architectures, and different foundational beliefs about how the world works (e.g., "is AI progress primarily hardware-constrained or algorithm-constrained?").
  *   **The Error:** By declaring that "any gap that survives must be irrationality," you are defining away legitimate epistemic diversity. If Person A thinks AGI requires a conceptual breakthrough (prior: low prob) and Person B thinks it's just scaling (prior: high prob), they can read the same evidence and rationally remain at 10% vs 40%. Calling this "irrational" is wrong. It just means their likelihood functions or priors differ.

  ### Step 2: Common Knowledge of Posteriors
  **Verdict: Insufficient.**
  You are confusing *mutual knowledge* with *common knowledge*.
  *   **The Math:** Aumann requires *common knowledge*: I know your number, you know mine, I know that you know mine, you know that I know that you know mine, ad infinitum.
  *   **The Reality:** A shared doc creates *mutual knowledge* (we both see the numbers). It does not create common knowledge. I do not know *how* you processed the evidence in the doc. Do I trust your calculation? Do you trust mine? If I think you are overconfident, seeing your 40% doesn't make me move to 40%; it makes me update on "a person who tends to overconfidence says 40%."
  *   **The Error:** Unless you trust each other's reasoning engines perfectly (which implies common likelihood functions, circling back to Step 1), reading the doc does not satisfy the theorem's conditions. You are exchanging data, not establishing common knowledge of rationality.

  ### Step 3: The Remedy (Deference)
  **Verdict: Harmful.**
  The rule "whoever knows less defers" is epistemically dangerous and gameable.
  *   **The Math:** Even if CPA held, the update rule isn't "adopt their number." It's "update on the fact that they hold that number." If we have different priors, conditioning on your posterior does not move me to your posterior.
  *   **The Reality:** "Amount of private information" is unmeasurable. Person A might have read 50 papers (quantity) but Person B might have one key insight about chip supply chains (quality). If you force A to defer to B, you lose the signal from the 50 papers.
  *   **The Error:** This protocol incentivizes sandbagging (claiming you have more info to dominate the forecast) or learned helplessness (deferring because you feel less articulate). It destroys the "wisdom of crowds" effect, which relies on *independent* errors canceling out. Forcing consensus correlates the errors.

  ### Does the Protocol Survive?
  **No.** The "Common Prior Protocol" is epistemic theater. It mimics the language of rationality without the underlying mechanics. If you run this, you will not get better forecasts; you will get forced consensus that is likely more miscalibrated than the average of the individual guesses.

  ### What To Do Instead (The Actual Protocol)
  If you want to improve forecasting in the room, stop trying to force agreement. **Disagreement is a feature, not a bug.** Diversity of prediction is the primary driver of group accuracy.

  Here is the protocol you should run at the next meetup:

  **1. Aggregate, Don't Converge**
  Do not try to make the 10% and 40% people agree on a single number.
  *   **Action:** Record both numbers. Calculate the **Geometric Mean of Odds**.
  *   **Why:** The externalized crowd (the aggregate of your group) will almost always outperform the internalized consensus (the number you argue yourselves into). Forcing consensus destroys the information contained in the variance.
  *   **Rule:** "We are not here to agree. We are here to produce the best aggregate forecast."

  **2. Map the Disagreement (The "Why" not the "What")**
  Instead of arguing to move the number, argue to classify the source of the gap.
  *   **Action:** Ask the 10% and 40% people to label the disagreement:
      *   **Prior:** "I fundamentally think this technology is harder than you do."
      *   **Likelihood:** "We agree on the tech, but I think regulators will stop it."
      *   **Information:** "You haven't seen the new leak I have."
  *   **Why:** If it's a **Prior** disagreement, stop arguing. Accept it. If it's **Information**, share the specific datum. If it's **Likelihood**, you've found a model difference worth exploring.
  *   **Rule:** If the disagreement is identified as "Prior," the discussion ends immediately. No deference required.

  **3. Defer to Track Record, Not Argument**
  If you must defer (e.g., to produce a single group submission), do not defer to the person with "more info" or the "better argument."
  *   **Action:** Use historical calibration data. Who has been more right on similar questions in the past? Weight their forecast higher.
  *   **Why:** Argumentative skill correlates poorly with forecasting accuracy. Past calibration correlates well.
  *   **Rule:** "We weight forecasts by Brier scores, not by rhetorical victory."

  **4. Bet on It (If possible)**
  *   **Action:** If the group is comfortable, put play money or small real stakes on the 10% vs 40% split.
  *   **Why:** This reveals true confidence. Often, the person arguing for 40% will only bet small, revealing they are actually 25% in their heart.
  *   **Rule:** "Put your money where your posterior is."

  ### Addressing Your Final Question
  > *If the honest conclusion is that the prior genuinely isn't shared, that should change how much we defer to each other at all?*

  **Yes.** If priors are not shared, **you should defer significantly less on the content of the belief, and significantly more on the track record of the believer.**

  If we have different priors, your posterior is not evidence for my posterior in the way Aumann describes. Your 40% tells me "Given your brain and your priors, the evidence looks like 40%." That is useful metadata about *you*, not necessarily about the *world*.

  **The Bottom Line:**
  Kill the Common Prior Protocol. It is theoretically unsound for humans and practically destructive. Replace it with **Aggregation + Classification of Disagreement + Weighting by Calibration.** This respects the rationalist ideal of truth-seeking without pretending humans are Bayesian agents with identical source code.
