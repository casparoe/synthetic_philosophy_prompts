answer: |-
  Here is the principle you are looking for, stripped of the trench coat.

  ### The Principle: Modal Base Restriction

  **A conditional statement ("If A, B") asserts that B is true in all worlds selected by a specific set of possibilities (the Modal Base) where A is also true.**

  **The Parameter:** The method used to select the Modal Base.
  1.  **Indicative Mood:** The Modal Base is the **Common Ground**. (The set of worlds compatible with what is mutually known or accepted as fact by the participants in the conversation).
  2.  **Counterfactual Mood:** The Modal Base is the **Similarity Sphere**. (The set of worlds most similar to actuality where A is true, even if A contradicts the Common Ground).

  ***

  ### Audit of Your Verdicts

  Here is how this principle processes your data. I am being blunt about where your intuition is tracking semantics and where it is tracking pragmatics or cognitive load.

  **1. The "Live vs. Dead" Indicatives (Cases 1–4)**
  *   **Verdict:** Accommodated.
  *   **Mechanism:** In Cases 1 and 2, "CT shows bleed" is compatible with the Common Ground (we don't know yet). In Case 3, you know the CT is clean; "CT shows bleed" is empty in the Common Ground. The conditional quantifies over an empty set, resulting in presupposition failure (it feels like a lie). In Case 4 (M&M), the Common Ground is temporarily updated by agreement to include the supposition. The base is no longer empty.

  **2. The Counterfactual Freedom (Case 5)**
  *   **Verdict:** Accommodated.
  *   **Mechanism:** Counterfactuals use the Similarity Sphere, not the Common Ground. They are designed to override known facts. The antecedent ("CT had shown bleed") contradicts reality, but the Similarity Sphere finds the closest world where it is true.

  **3. The Trivial Consequent (Case 7: "If G+, then something")**
  *   **Verdict:** **Drop your semantic intuition.** This is not a semantic failure; it is a pragmatic violation (Grice's Maxim of Quantity).
  *   **Mechanism:** Semantically, the statement is true. However, the principle implies that conditionals are tools for narrowing down possibilities. If the consequent ("grew something") is already entailed by the Modal Base alone (cultures grow things), the conditional adds no information. Your "balk" is correct, but it classifies as *pointless*, not *false*. Do not build a semantic rule to explain this; build a rule of conversational efficiency.

  **4. The Mood Mismatches (Case 9)**
  *   **Verdict:** Accommodated (via Morphological Agreement).
  *   **Mechanism:** The morphology signals the Parameter. "Shows/Will" signals Common Ground. "Showed/Would" signals Similarity Sphere. Mixing them ("Shows/Would") sends a contradictory signal about which Modal Base to use. The crash is syntactic/semantic feature mismatch.

  **5. The Stacking Problem (Case 8)**
  *   **Verdict:** **Drop the "cannot hold together" intuition.**
  *   **Mechanism:** Your principle predicts they *are* logically compatible, and they are. The "weakness" you feel in the third step is the **distance from actuality**.
      *   Step 1 (Give drug): Closest world where we gave drug.
      *   Step 2 (Give drug + Normal platelets): Closest world where we gave drug *and* platelets are normal (requires changing more facts).
      *   Step 3 (Give drug + Normal platelets + Sentinel bleed): Requires changing even more facts.
      *   Each step pushes you further into the "outer spheres" of similarity. You feel you can't hold them together because maintaining three different similarity orderings simultaneously is cognitively expensive, not because they are logically inconsistent. Treat this as a processing limit, not a semantic constraint.

  **6. The 'Might' vs. 'Would' (Case 10)**
  *   **Verdict:** Accommodated.
  *   **Mechanism:** 'Would' is a universal quantifier (True in *all* selected worlds). 'Might' is an existential quantifier (True in *at least one* selected world). $\diamond A$ and $\diamond \neg A$ are consistent; $\square A$ and $\square \neg A$ are contradictory.

  **7. The 'Even If' (Case 11)**
  *   **Verdict:** Accommodated (as a distinct operator).
  *   **Mechanism:** 'Even if' is concessive. It asserts B is true in the selected worlds *regardless* of A. It does not rely on the dependency relation that standard conditionals do.

  ***

  ### The Two Unsettled Cases

  Here is what my principle predicts, contrasted with the nearest rival.

  **The Rival Theory: Stalnaker's Unified Context Set.**
  This theory argues there is no fundamental difference between Indicative and Counterfactual. Both select the "closest world where A is true" from the Context Set. The difference is merely whether the Context Set has already eliminated A.

  #### Case 1: The Asymmetric Handoff
  *Scenario:* Attending (knows CT clean) tells Resident (doesn't know) to "Page me if it showed a bleed."
  *   **My Prediction:** **Acceptable.**
      *   *Why:* In a directive speech act (an order or instruction), the Modal Base shifts to the **Addressee's Epistemic State**. The Attending is operating within the Resident's Common Ground, where the CT result is still open. The Parameter (Indicative) selects the Resident's knowledge, not the Attending's.
  *   **Rival Prediction:** **Infelicitous (or requires complex repair).**
      *   *Why:* Strict Stalnakerian views often define the Context Set as the *intersection* of all participants' knowledge. Since the Attending knows the antecedent is false, it is eliminated from the shared set. The conditional should fail.
  *   **My Preference:** Mine. It captures the utility of handoffs without requiring the Attending to lie about her own knowledge.

  #### Case 2: The Counterfactual Tautology
  *Scenario:* Everyone knows CT was clean and no OR. Someone says: "If it *had shown* no bleed, we *wouldn't have* taken him."
  *   **My Prediction:** **Infelicitous.**
      *   *Why:* The Counterfactual Parameter (Similarity Sphere) carries a **presupposition of Falsehood**. Using the "had/would" morphology asserts that the antecedent is contrary to fact. Since everyone knows the antecedent ("shown no bleed") is *True*, the morphology contradicts the Common Ground. You should use the Indicative: "Since it showed no bleed, we didn't take him."
  *   **Rival Prediction:** **True (but odd).**
      *   *Why:* Under Material Implication or a loose Unified theory, if A is true and B is true, "If A then B" is true. The morphology is just stylistic.
  *   **My Preference:** Mine. In the ICU, precision matters. Using Counterfactual morphology for a factual event implies doubt about the facts. It sounds like you don't trust the chart.

  ***

  ### The Discriminating Case

  To tell my account (Modal Base Restriction) apart from the Rival (Unified Context Set), run this test:

  **The Future Counterfactual.**
  Find a case where the outcome is unknown, but the speaker wants to signal low probability.

  *   **Utterance A:** "If the patient **dies** tonight, it **will** be from sepsis." (Indicative)
  *   **Utterance B:** "If the patient **died** tonight, it **would** be from sepsis." (Counterfactual)

  **The Prediction:**
  *   **My Account:** Utterance B presupposes the patient is *unlikely* to die. It selects a Similarity Sphere where death occurs, implying that in the Common Ground (Reality), death is not expected. Utterance A leaves the probability open.
  *   **Rival Account:** Since the outcome is unknown, the Context Set contains both life and death worlds. There should be little difference in meaning between A and B, other than formality.

  **The Test:**
  Wait until the morning.
  *   If the patient **died**: Utterance A is vindicated as a prediction. Utterance B becomes retroactively infelicitous (you don't use "would/died" for something that actually happened).
  *   If the patient **lived**: Utterance A is untested. Utterance B remains a valid assessment of risk.

  If you find that Utterance B feels like a "eulogy in advance" that must be retracted if the patient survives, while Utterance A feels like a standard contingency plan, my account wins. The morphology locks in the speaker's commitment to the probability of the antecedent, not just the relationship between A and B.

  ### Summary of Sacrifices
  To keep this principle clean, you must drop two intuitions:
  1.  **The Trivial Consequent is False:** It is not false; it is useless. Move it to the pragmatics bin.
  2.  **The Stacked Counterfactuals are Incompatible:** They are compatible. Your inability to hold them is a cognitive limit on tracking shifting similarity metrics, not a logical contradiction.

  Everything else follows from the **Modal Base Restriction**.
