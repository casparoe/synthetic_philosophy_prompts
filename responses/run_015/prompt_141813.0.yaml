answer: |-
  **From the General Editor**

  Welcome to the *Handbook of Systematic Epistemology*. This fourteen-volume work represents the culmination of fifteen years of scholarship. It is the press's position that each chapter herein is individually warranted by evidence and expert consensus. However, given the scale of the publication, the probability of at least one error existing within the set approaches unity. We have therefore structured our assertion policy to reflect this probabilistic reality. We invite readers to engage with the material volume by volume, mindful of the distinction between local warrant and global truth.

  **Statement on Error**

  The Press accepts the Lockean thesis that belief is permissible where probability is sufficiently high. Consequently, while we endorse each chapter in isolation, we decline to assert the conjunction of all chapters. To claim the *Handbook* is entirely error-free would be irrational. This policy extends to internal compliance. Regarding the annual Staff Raffle: while the probability of any single ticket winning is negligible, the probability that *some* ticket will win is unity. Staff are therefore prohibited from believing their ticket has lost prior to the draw. Minutes of the raffle committee confirm this stance is maintained consistently throughout the draw process.

  **The Assertion Rota**

  To manage this, the Press employs a monthly Assertion Rota. In any given month, one volume is designated 'Live' and may be officially cited as true. The remaining thirteen volumes are held 'Pending Review'. This ensures that at no point does the Press assert the full conjunction of the *Handbook*. We acknowledge the recursive difficulty here: announcing the Rota schedule itself constitutes an assertion covering all fourteen volumes. We mitigate this by publishing the schedule incrementally, though this has led to logistical delays. Critics have noted that the Table of Contents is itself a conjunction of chapter titles. We are currently reviewing whether the Contents page requires its own Rota.

  **Notes for Contributors**

  Scholars citing this work must specify the active volume and month of citation. Whole-work citations are invalid. This has complicated indexing. Several institutional libraries have cancelled their standing orders, noting that a reference work which cannot be referenced as a whole fails basic utility criteria. We respect this decision. Contributors should note that cross-references between volumes are treated as hypothetical conditionals rather than factual claims. If Volume 4 references Volume 9, and Volume 9 is not currently Live, the reference holds only provisionally.

  **Corrections and Clarifications**

  We have observed a phenomenon termed 'corrigendum creep'. Experience shows that issuing a correction often introduces a new minor error in the errata text itself. Thus, the errata page grows monotonically. To address our net error contribution, the Press has initiated an 'error offset' scheme. We now fund corrections in competing publishers' books to balance our own output. We declare ourselves committed to being 'error neutral by 2030'. This involves complex modelling, but the trajectory is positive.

  **Acknowledgements**

  The General Editor wishes to thank the two hundred colleagues listed below. However, following the logic of the Preface, while it is probable I remember each individual name, it is near-certain I have omitted at least one deserving contributor. Following the protocol established by H. L. Vandermeer, the Acknowledgements are now subject to the Rota. Thanks are issued in batches of fifteen. If you have been thanked in a previous month, please note your gratitude is currently suspended pending the next cycle. We apologise for this administrative necessity.

  ***

  **Note on the Satire**

  This piece targets the 'Lockean' response to the Preface Paradox, where belief is defined purely by high probability. A defender would argue I have strawmanned the view: no serious epistemologist refuses *all* conjunctions, only reasonable ones. They accept closure fails in lottery cases, not ordinary handbook assertions. I have stretched the paradox by applying it to acknowledgements and raffles, domains where belief isn't usually truth-apt. However, the satire requires this stretch to show the institutional absurdity. If you accept the probabilistic threshold for belief, you must accept these consequences, or explain why some conjunctions count and others do not. I assume no such relevant difference exists. The joke relies on the institution taking the logic seriously enough to break its own function.
