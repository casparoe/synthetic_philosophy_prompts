answer: |-
  On the nature of the *do*-operator, Leo is correct that interventionism does not eliminate modality. The *do*-operator defines a counterfactual state relative to a model, merely replacing Lewisian similarity metrics with structural equations. Maya is right, however, that this localises the commitment, making it empirically tractable rather than metaphysically speculative. It is formalised counterfactuals, not eliminated ones.

  Regarding omissions, Leo prevails. Interventionism requires variables to be defined such that interventions are possible. Treating absences as binary variables often feels ad hoc, as Leo suggests. Maya's stance that non-intervenable claims are 'causally defective' is too stringent for historical or social explanation, where omissions are routinely cited as causes without explicit manipulation protocols.

  In the institutional case, Leo again holds the stronger position. If analysing a regulator's failure requires dissolving the institution to test the counterfactual, interventionism renders the causal claim unintelligible. Yet, such claims are standard in social science. Maya's requirement for coherent interventions excludes structurally embedded causation.

  What both miss is that the dispute concerns explanatory practice rather than pure metaphysics. Interventionism is best viewed as a methodology for identifying leverage points for control, not an exhaustive ontology of causal relations. Maya treats it as the latter, demanding all causal talk fit the mould of manipulation. Leo treats counterfactuals as metaphysical truths rather than tools for reasoning about responsibility. Furthermore, both overlook that the causal graph itself encodes counterfactual assumptions; the model does not escape metaphysics, it merely shifts it to the stage of variable selection. The tension arises because interventionism aims to serve specific pragmatic interests (prediction and control), whereas ordinary causal discourse serves broader explanatory needs (accountability and understanding). Neither account fully captures causation because causation itself is likely a pluralistic concept, serving different roles in different contexts. Interventionism clarifies manipulation; counterfactualism clarifies dependence. Adjudicating between them requires acknowledging their distinct pragmatic domains rather than seeking a single metaphysical victor.
