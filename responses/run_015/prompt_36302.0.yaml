answer: |-
  Dear friend, you have put your finger on one of the most famous and stubborn problems in the philosophy of mind, and your intuition that something is deeply wrong with your brother-in-law's position is shared by a great many philosophers. The view he holds is officially called epiphenomenalism, and the specific difficulty you have identified is widely known as the self-refutation objection or sometimes the argument from knowledge. It is not merely a hunch you have stumbled upon; it is the primary reason why many philosophers reject epiphenomenalism despite its apparent compatibility with a physicalist worldview. To give you the carving you are after, the core issue is that if conscious experiences are causally inert, then our beliefs about those experiences cannot be caused by the experiences themselves, which seems to undermine any claim to know that we have them.

  Your brother-in-law's picture is classic epiphenomenalism, which posits that mental events are caused by physical events but do not themselves cause anything physical. The steam whistle analogy is the standard illustration used by Thomas Huxley, who famously defended this view in the nineteenth century. The problem you have isolated, however, is that this view severs the causal link required for knowledge. In most accounts of knowledge, for me to know I am in pain, the pain must play some role in causing my belief that I am in pain. If the pain is merely a side-effect, then my belief is caused entirely by the brain state that also causes the pain. This leads directly to your point about the theory sawing off the branch it climbed up on. If his belief in epiphenomenalism is caused solely by physical brain states, and those states would have produced the same belief even if consciousness did not exist, then his belief is not sensitive to the truth of consciousness. It becomes a lucky coincidence that his belief matches reality, which is hardly a secure foundation for a philosophical theory.

  Regarding your question about whether this is one thing or two, specifically whether the report of experience and the belief in the theory are separate issues, they are structurally identical. The utterance I have a toothache is a report, and the belief in epiphenomenalism is a theoretical report. Both are physical events (vocalisations or neural states) that, on the epiphenomenalist view, are caused by physical antecedents rather than the conscious experience they purport to describe. So (b) is indeed just (a) with the theory plugged in as the report. The literature treats them as the same fundamental problem: the problem of how we can have knowledge of qualia if qualia are causally irrelevant. Some philosophers distinguish them only in terms of scope, where the toothache report is a local instance of knowledge and the theory is a global instance, but the mechanism of the objection is the same in both cases.

  You asked how this differs from the nearby things you listed, and the distinction is crucial. General scepticism questions whether any of our beliefs track reality, perhaps due to a demon or a brain in a vat scenario. That worry applies to everyone, regardless of their metaphysical commitments. The epiphenomenalist objection is specific because it is generated internally by the theory itself. A dualist or a physicalist who believes consciousness has causal power does not face this specific problem, because for them, the pain causes the report. The epiphenomenalist is uniquely vulnerable because their own theory dictates that the truth of the matter (the pain) is causally disconnected from the belief (the report). As for the philosophical zombie thought experiment, that is primarily an ontological claim about the conceivability of beings without consciousness. Your worry is epistemological. It is not about whether zombies are possible, but about whether, if epiphenomenalism is true, we can know we are not zombies. The zombie argument is used to attack physicalism, whereas your objection is used to attack epiphenomenalism.

  Your brother-in-law's reply, that the report tracks the pain via its physical correlate, is a standard defence known as the common cause response. He is arguing that the brain state causes both the pain and the report, so there is a reliable correlation even without direct causation. The literature suggests this reply is generally considered insufficient because it relies on a pre-established harmony that looks suspiciously like luck. If the pain does nothing, why should the brain state that causes the report also produce a pain that matches the report? It implies that the universe is arranged such that our reports are accurate despite the reports being blind to the very thing they report. Most philosophers find this undermines justification, even if it preserves truth. You are right to feel that this reply is improvising around a deep structural flaw rather than fixing it.

  Since there is an established name for this configuration, I will not coin a new one, but I will define the conceptual boundary you are seeking so you have the carving you requested. The concept is the epistemic disconnect inherent in causal inertness. It covers both your cases (a) and (b) because both rely on the failure of the referent to influence the representation. A boundary case where this definition gets fuzzy is found in emergentism. Some emergentists argue that consciousness arises from the brain and can exert downward causation, but only in a way that is consistent with physical laws. In such a view, the pain does cause the report, but not in a way that violates physical closure. The line blurs when one asks whether the mental cause is distinct enough from the physical cause to count as real causation or if it is just the physical cause described differently. If the mental is just the physical described differently, the epiphenomenalist objection loses its grip, but if it is distinct, the objection returns. This fuzzy boundary highlights that your worry is specifically about the causal independence of the mental, not just its existence.

  I hope this helps you break the circle with your brother-in-law. You are not missing a concept; you have identified the exact reason why his position is so difficult to maintain. The view is epiphenomenalism, the objection is the self-refutation argument, and his defence is the common cause reply, which most philosophers find wanting. You have effectively reconstructed a central debate in the philosophy of mind without needing the jargon, which is a testament to your clarity of thought. I would suggest pressing him on why the correlation between brain state and pain should be trusted if the pain does no work to ensure that correlation holds. That is the heart of the matter.
