prompt: |-
  I'm giving the toast at my old advisors retirement dinner. She spent thirty years defending multilevel selection, and after the selfish-gene wave she kept saying the Price equation made the kin/group selection equivalence a matter of bookkeeping, not a deeper truth. Half the room are evolutionary biologists who will catch if I screw up the units-of-selection point; the other half is family. Write a five-minute toast that builds on one good joke about whether genes, individuals, or groups are the real unit of selection, but lands as affection, not a lecture. She's dry, so keep it grounded.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for an old academic advisor.
      *   **Speaker:** Former advisee.
      *   **Audience:** 50% evolutionary biologists (experts), 50% family (non-experts).
      *   **Subject's Career:** 30 years defending multilevel selection (MLS).
      *   **Subject's Stance:** After the "selfish gene" wave, she argued the Price equation made kin/group selection equivalence a matter of *bookkeeping*, not deeper truth (i.e., she was a pluralist/pragmatist about the math, but fought for the validity of group selection as a causal process).
      *   **Tone:** Affectionate, grounded, dry (matching the advisor), not a lecture.
      *   **Key Requirement:** Build on *one good joke* about the unit of selection (genes vs. individuals vs. groups).
      *   **Constraint:** 5 minutes (approx. 750-850 words spoken at a moderate pace).
      *   **Risk:** Alienating the experts with inaccuracies or boring the family with jargon.

  2.  **Deconstruct the Science (for accuracy):**
      *   *Selfish Gene:* Dawkins/Williams view. Gene is the replicator, individual is the vehicle.
      *   *Multilevel Selection (MLS):* Selection acts at multiple levels (gene, individual, group).
      *   *Price Equation:* A mathematical description of evolutionary change. It partitions selection into within-group and between-group components.
      *   *The "Bookkeeping" Argument:* Many theorists (like George Williams or John Maynard Smith initially) argued that group selection was just kin selection mathematically rearranged. The advisor's stance seems to be: "Yes, the math is equivalent (Price), but treating it *only* as gene selection misses the causal reality of groups." Or, more subtly, she recognized the mathematical equivalence but insisted on the utility of the group lens.
      *   *The Joke:* Needs to play on the tension between "it's all genes" and "groups matter."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the split audience (biologists + family). Set the tone (warm but intellectual).
      *   **The Joke (The Core):** This needs to be the anchor.
          *   *Idea:* A gene walks into a bar... No, too cliché.
          *   *Idea:* Asking who the real boss is.
          *   *Refinement:* Let's use the dinner setting. Who is being selected tonight? The food? The guests?
          *   *Better:* The classic "Unit of Selection" puzzle.
          *   *Drafting the Joke:* "We often argue about the unit of selection. Is it the gene? The individual? The group? Tonight, looking at the open bar, I'm pretty sure the unit of selection is the liver." -> *Too crude.*
          *   *Drafting the Joke:* "She taught us that whether you see a gene or a group depends on how you hold the Price equation." -> *Too technical for family.*
          *   *Selected Approach:* Use the "Bookkeeping" line she loved. Frame it as her being the accountant of evolution.
          *   *Revised Joke Concept:* The tension between the "Selfish Gene" and her "Multilevel" view.
          *   *Final Joke Idea:* "If the gene is selfish, why did she spend 30 years arguing for the group? Because she knew that while genes might be selfish, *people* are social." -> *A bit sappy.*
          *   *Let's try this:* "There's an old joke in the field. A gene, an individual, and a group walk into a bar. The bartender says, 'We don't serve your kind here.' The gene says, 'Actually, I'm the only one who matters.' The individual says, 'I'm the one doing the drinking.' The group says, 'We're all leaving together.'" -> *A bit clunky.*
          *   *Let's go with the "Bookkeeping" line directly.* It's her specific intellectual signature.
          *   *Joke:* "She always said the debate over units of selection was just bookkeeping. Which explains why she was the only one who could balance the lab budget *and* explain why altruism exists."

      *   **Middle (The Career/Impact):** Acknowledge the 30 years. The "Selfish Gene" era was dominant; she held the line. Not stubbornly, but pragmatically. Mention the Price equation without deriving it.
      *   **Bridge to Family:** Translate the science into mentorship. How did her view on "groups" translate to how she treated her lab? (We were a group, not just individuals).
      *   **Closing:** Retirement wish. Bring it back to the "unit of selection" joke for the punchline.

  4.  **Refining the Tone:**
      *   *Dry:* Avoid over-the-top emotion. Use understatement.
      *   *Accurate:* Ensure the Price equation reference doesn't make the biologists groan. It needs to reflect her specific view (equivalence is math, causality is different).
      *   *Inclusive:* Family needs to understand the stakes without knowing the math.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm [Name]. 30 years is a long time. She fought for group selection. People said it was just math. She said maybe, but it matters. Joke: Genes vs Groups. She treated the lab like a group. We survived because of her. Happy retirement.

  6.  **Drafting - Iteration 2 (Adding Flesh & The Joke):**
      (Self-Correction during drafting): Make sure the joke lands for both halves of the room.
      *Joke:* "In this room, we have a debate. Is the unit of selection the gene, the person, or the group? [Advisor] always said it was a bookkeeping error to argue. But I think I've solved it. Tonight, the unit of selection is the open bar. We are all being selected for our ability to consume it." -> *A bit weak.*
      *Let's stick to the prompt's request:* "Builds on one good joke about whether genes, individuals, or groups are the real unit of selection."
      *Okay, let's make the joke the framing device.*
      "There is a classic question in our field: What is the true unit of selection? Is it the selfish gene? The struggling individual? Or the cooperating group? [Advisor] had a answer. She said, 'It depends on which side of the Price equation you're standing on.'"
      *Then pivot:* "But watching her run this department..."

  7.  **Final Polish (Checking constraints):**
      *   *Time:* 5 mins = ~750 words.
      *   *Science Check:* Did I misrepresent the Price equation stance? She said equivalence is bookkeeping. I need to honor that. She didn't deny the math; she denied that the math settled the *causal* argument.
      *   *Tone Check:* Is it dry? Yes, keep the sentimentality earned, not gushing.

  8.  **Writing the Toast (incorporating the above):**
      *   Start with the split audience.
      *   Introduce the "Unit of Selection" joke early.
      *   Weave in her specific intellectual contribution (Price/Bookkeeping).
      *   Connect to mentorship (The Lab as a Group).
      *   End with a retirement wish that ties back to the joke.

      *(Self-Correction on the Joke)*: The prompt asks for *one good joke* about the units. Let's make it a story.
      "A gene, an individual, and a group walk into a bar..." is too standard.
      How about: "The question of the unit of selection is like asking who drives the car: the engine, the driver, or the traffic?"
      No, let's use her "bookkeeping" line as the punchline setup.
      *Actually, the prompt says "Builds on one good joke... but lands as affection."*
      Okay, I will construct a scenario where the joke illuminates her character.

      *Revised Plan:*
      1. Welcome.
      2. The Joke: The "Unit of Selection" dilemma framed as a dinner party problem.
      3. Her Stance: The Price Equation/Bookkeeping nuance (keep it simple for family).
      4. Her Mentorship: Applying MLS to the lab.
      5. Conclusion.

      *Let's write.* (Focusing on the "Bookkeeping" line as the intellectual anchor and the "Group" as the emotional anchor).

      *Wait, one more check on the science:* "Price equation made the kin/group selection equivalence a matter of bookkeeping, not a deeper truth." This implies she believed the *math* shows they are equivalent descriptions, but the *biological reality* (causality) still allows for group selection to be a valid perspective. She was a pluralist. I need to make sure I don't say she "disproved" the selfish gene, but that she refused to let it be the *only* story.

      *Okay, ready to draft.*

      *Word Count Check:* A 5-minute speech is roughly 750 words at 150 wpm. I need to ensure it's not too short. I will expand on the mentorship section to ensure length and emotional resonance.

      *Tone Check:* "She's dry." Avoid "She was a beacon of light." Use "She was a sturdy bridge."

      *Let's go.*
answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of being one of [Advisor's Name]'s advisees back in the day.

  Looking around this room, I see a distinct split. On my left, I see family and friends who know [Advisor's Name] as a person who remembers birthdays and drinks her coffee black. On my right, I see evolutionary biologists who know her as the person who spent thirty years arguing that you can't explain everything with a "selfish gene."

  Navigating this split is tricky. If I get too technical, the family glazes over. If I get too sentimental, the biologists start looking for the exit. So, I decided to ground this in the one thing we all understand: the question of who is actually in charge.

  There is an old joke in our field. A gene, an individual, and a group walk into a bar. The bartender looks up and asks, "Who's paying?" The gene says, "I'm the only replicator here, so the bill is mine." The individual says, "I'm the one holding the wallet." The group says, "We're splitting it evenly, or nobody drinks."

  For thirty years, [Advisor's Name] was the one making sure the group didn't get stuck with a bill the gene couldn't pay.

  We know the history. The "Selfish Gene" view swept through biology like a wildfire. It was elegant, it was mathematical, and it was dominant. But [Advisor's Name] stood in the gap. She didn't deny the math. She was too rigorous for that. She always said that the Price equation showed the equivalence of kin and group selection was a matter of *bookkeeping*, not a deeper truth.

  To the biologists here: She knew the algebra worked out either way.
  To the family: She knew that just because you *can* describe a family dinner purely in terms of calorie intake doesn't mean you should ignore the conversation.

  She argued that while the math might be equivalent, the *causality* matters. If you treat organisms solely as vehicles for genes, you miss the reality of how they actually live, cooperate, and struggle together. She was a pluralist in a world that wanted monopoles. She taught us that sometimes, the most accurate way to understand the world is to look at the level of the group, not just the level of the part.

  And this wasn't just theory. It was how she ran her lab.

  I remember when I was a struggling grad student, staring at data that wouldn't converge. I was ready to quit. I viewed myself as an individual unit of failure. [Advisor's Name] didn't give me a pep talk about my "genetic fitness." She didn't tell me to be more selfish about my career.

  She treated the lab as a unit of selection. She reminded me that the lab succeeds or fails together. If I struggled, the group absorbed the cost. If I succeeded, the group shared the benefit. She created an environment where altruism wasn't a mathematical puzzle to be solved, but a standard operating procedure.

  She was dry, certainly. She wasn't one for hugs or exclamation points. But she was fiercely loyal to the collective. She defended her students the way she defended multilevel selection: not by shouting, but by standing firm, checking the math, and refusing to let a dominant narrative crush a valid perspective.

  There is a risk in retirement speeches to overstate the case. To say she "won" the debate. I don't think she would want that. She would probably tell me I'm oversimplifying the covariance terms. She would remind us that the debate is still ongoing, and that's a good thing. Science needs the tension.

  But tonight, we aren't doing science. We are doing what she argued was possible: we are acting as a group. We are here not because of individual gain, but because of collective affection.

  So, I propose a toast.

  To the biologists: May your variances be low and your p-values significant.
  To the family: Thank you for sharing her with us, even when she was thinking about covariance.

  And to [Advisor's Name]. You taught us that while genes may be selfish, and individuals may struggle, it is the group that endures. You built a group here that will last long after you've left the building.

  To the unit of selection that matters most tonight: The Community. Happy Retirement.
