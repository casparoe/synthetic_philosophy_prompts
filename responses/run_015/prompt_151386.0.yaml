      *   **Key Constraint/Philosophical Angle:** The user (as a novelist/board member) is troubled by the "unexamined premise" that the board can identify the "essential ontology" of the block (working-class residence vs. urban expansion node) without access to the tenants' lived, future-oriented relationships to the place.
      *   **Requirements:**
