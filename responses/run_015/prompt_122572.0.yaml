  I work in multi-agent RL — I train populations of agents for a three-player competitive trading game, so the vocabulary I actually think in is: policies, action supports, entropy regularisation, best response and exploitibility, NashConv, self-play with a league of frozen checkpoints, off-policy updates, partial observability. I've read maybe one game theory paper in my life and I know roughly what a Nash equilibrium is, that's it.

  A theorist friend told me you can shrink a game by repeatedly deleting strategies that are strictly dominated, where the thing doing the dominating is allowed to be a randomisation over that player's own surviving strategies rather than a single action. I get the appeal as a pre-prossessing step before training, but I think I've spotted a wrinkle: the randomisation that does the dominating can lean on actions that a later round of deletion removes, so the dominator decays, and what survives depends on the order you delete in. I've started calling this the support problem and I want to know whether it's real or I've misread something.

  Please restate the whole apparatus — strict dominance, mixed dominators, iterating it until nothing more goes, and whatever the epistemic assumptions underneath are — as faithfully as you can in my vocabulary, ideally as if it were a step in a training pipeline I could actually implement. Then the residue report: what translates cleanly, what you had to fudge (be honest about whether a mixed strategy is just a stochastic policy with the temperature set by hand), and what has no counterpart at all in how I train agents. And commit: is the support problem genuine, does it change how much pruning is worth doing, and if one of the two frameworks can say something the other can't, say plainly which one is the poorer one rather than telling me both are fine in their own way.
