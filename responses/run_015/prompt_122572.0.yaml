answer: |-
  Here is the translation of the Game Theory (GT) apparatus into your Multi-Agent RL (MARL) stack, followed by the residue report and the commitment you asked for.

  ### Part 1: The Pipeline (IESDS in MARL Vocabulary)

  You are describing **Iterated Elimination of Strictly Dominated Strategies (IESDS)**, specifically allowing for **Mixed-Strategy Dominance**. Here is how you would implement this as a preprocessing module before your self-play league starts training.

  **1. The State:**
  You have a 3-player game. For this to work analytically, you need the **payoff tensor** (expected returns for every joint action profile). In RL terms, this is your value function $Q(s, a_1, a_2, a_3)$ evaluated at the initial state $s_0$, assuming discrete actions. If your action space is continuous, this pipeline breaks immediately (more on that in the Residue).

  **2. The Dominance Check (The Linear Program):**
  For Player 1, iterate through every pure action $a \in \mathcal{A}_1$.
  You want to check if $a$ is strictly dominated.
  *   **The Test:** Can you construct a stochastic policy $\sigma$ (a probability vector over $\mathcal{A}_1 \setminus \{a\}$) such that for **every** possible joint action $(a_2, a_3)$ of the opponents:
      $$ \mathbb{E}_{a' \sim \sigma} [R_1(a', a_2, a_3)] > R_1(a, a_2, a_3) $$
  *   **Implementation:** This is a Linear Programming (LP) feasibility problem.
      *   **Variables:** Probabilities $p_k$ for each remaining action $k$.
      *   **Constraints:** $\sum p_k = 1$, $p_k \geq 0$.
      *   **Objective:** Maximize margin $\epsilon$ such that Expected Return of Mix $-$ Return of $a$ $\geq \epsilon$ for all opponent profiles. If $\epsilon > 0$, action $a$ is dominated.

  **3. The Pruning Step:**
  If the LP finds a solution with $\epsilon > 0$, mask action $a$ out of the action space. It is now illegal.

  **4. The Iteration:**
  Update the payoff tensor to reflect the reduced action space. Repeat the Dominance Check for all players.
  *   **Stop Condition:** A full pass through all players yields no new masks.

  **5. Epistemic Assumptions (The "Why"):**
  This pipeline relies on **Common Knowledge of Rationality (CKR)**.
  *   **Rationality:** Agents maximize expected return.
  *   **Common Knowledge:** I know you are rational. You know I know you are rational. I know you know I know...
  *   **Implication:** If action $a$ is dominated, a rational agent will never play it. If I know you are rational, I know you will never play $a$. Therefore, I can condition my best response on the fact that $a$ has probability 0. This allows new actions to become dominated in the reduced game that weren't dominated in the full game.

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation, what breaks, and what is missing.

  **1. Translates Cleanly:**
  *   **Action Masking:** GT's "elimination" is exactly RL's action masking. You can implement this in your environment step to return -inf logits for pruned actions.
  *   **Mixed Strategies as Policy Support:** A GT mixed strategy is mathematically identical to a stochastic policy with fixed probabilities.
  *   **Strict Dominance as Negative Advantage:** If an action is strictly dominated, its advantage over the dominating mix is negative across all opponent states.

  **2. What I Had to Fudge:**
  *   **The Mixed Strategy "Temperature":** In GT, a mixed dominator is a precise probability vector (e.g., 0.3 on Action B, 0.7 on Action C). In your RL training, your "mixed strategies" are usually outputs of a policy network regularized by entropy. You don't have direct control over the exact probabilities unless you freeze the policy. GT assumes you can commit to *exact* frequencies; RL assumes you sample from a distribution that might drift.
  *   **Payoff Certainty:** The pipeline assumes you have the *exact* expected return matrix. In RL, you have Monte Carlo estimates with variance. To run this pipeline, you'd need to train a value function to convergence *before* pruning, which defeats the purpose of pruning to speed up training.

  **3. What Has No Counterpart in RL:**
  *   **Common Knowledge of Rationality:** This is the big one. Your agents do not know opponents are rational; they know opponents are *checkpoints from last week*. Your agents train to exploit specific weaknesses in frozen opponents, not to play unexploitable strategies against ideal rationalists.
  *   **The "Never Play" Guarantee:** In GT, if a strategy is eliminated, it is removed from the universe. In RL, even if an action is suboptimal, you often keep it in the support for exploration (entropy regularization) or to maintain robustness against opponents who might play irrationally (exploiting the exploiter).

  ---

  ### Part 3: The Commit

  **Is the "Support Problem" Genuine?**
  **No.** In the context of exact Game Theory with **Strict** Dominance, your intuition is incorrect. The order of elimination **does not matter**. The set of surviving strategies is unique.

  **Why your intuition failed:**
  You reasoned: *"Mix $\sigma$ dominates $A$. $\sigma$ uses Action $B$. Later $B$ is deleted. Now $\sigma$ is invalid. Does $A$ survive?"*
  **The GT Counter:** If $B$ is deleted later, it is because $B$ itself was strictly dominated by some other mix $\sigma'$. Because utility is linear in probabilities (expected value), you can substitute $B$ in $\sigma$ with $\sigma'$. The resulting super-mix $\sigma''$ still strictly dominates $A$. The dominance relation is transitive. The "support" of the dominator doesn't decay; it propagates.

  *Note:* This holds for **Strict** Dominance. If you use *Weak* Dominance (where $\geq$ replaces $>$), order *does* matter, and Nash Equilibria can be deleted. But standard IESDS uses Strict.

  **Does this change how much pruning is worth doing?**
  **Yes, but not because of order dependence.** It changes because of **Computational Cost vs. Benefit**.
  1.  **Cost:** Solving the LP to find mixed dominators requires knowing the full payoff tensor. In a complex trading game, estimating that tensor to the precision required to prove strict dominance is as expensive as solving the game itself.
  2.  **Benefit:** Pruning reduces the action space, which speeds up convergence.
  3.  **The Catch:** In RL, you rarely want to prune to the GT solution.

  **Which Framework is Poorer?**
  **Game Theory is the poorer framework for your specific job.**

  Here is the plain truth:
  Game Theory gives you a mathematically pristine guarantee (order independence) that relies on assumptions (Common Knowledge of Rationality, Exact Payoffs) that **do not exist** in your training pipeline.
  *   Your opponents are not rational; they are function approximators with inductive biases.
  *   Your payoffs are not exact; they are noisy samples.
  *   Your goal is not necessarily a Nash Equilibrium; it is often a policy that wins against the specific population distribution you care about (which may include irrational or sub-optimal agents).

  If you prune actions based on GT IESDS, you risk removing actions that are "dominated" against rational play but are **essential for exploiting irrational play**. For example, in a trading game, a "dominated" strategy might be a specific bluff. Against a Nash opponent, the bluff loses money (dominated). Against your current league of frozen checkpoints who haven't learned the counter-strategy yet, the bluff prints money.

  **Verdict:**
  Your "Support Problem" is a false alarm in GT, but a **real engineering risk in RL**.
  If you implement IESDS in your pipeline using *estimated* Q-values, the order **will** matter because estimation noise will break the transitivity of dominance. You might prune a "dominator" because it looked noisy-bad, rendering the pruning of the "dominated" action invalid, leading to instability.

  **Recommendation:**
  Do not use IESDS as a hard pre-processing step.
  Instead, use **Action Masking based on Learned Advantage**. During training, if an action's advantage estimate is consistently below a threshold $-\delta$ across the league of opponents, mask it temporarily. Allow it to return if the distribution shifts. This keeps the RL flexibility while gaining the GT efficiency, without relying on the false assumption that your opponents are rational maximizers.
