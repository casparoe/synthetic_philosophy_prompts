prompt: |-
  I have recently begun working in a research group that is replacing an established theoretical framework with a newer one, and I have observed that experienced members can no longer restate the old core hypotheses in the new vocabulary without what feels like conceptual distortion. Before I commit to one philosophical interpretation, I want to know what an adequate account of incommensurability between scientific paradigms must be able to do. Write the desiderata: the phenomena it must explain (loss of shared evaluative standards, persistence of empirical agreement, conditions for rational conversion), the distinctions it must respect (semantic versus methodological versus axiological incommensurability), and which requirements are non-negotiable versus camp-specific preferences. Specifically, flag any jointly unsatisfiable subset — for instance, can an account maintain both that rival paradigms lack common measures and that scientists can still rationally adjudicate between them? Also address whether the account must accommodate what I call localized incommensurability, in which only a subset of theoretical terms becomes untranslatable while observational protocols remain intact, and whether allowing this undermines the stronger Kuhnian thesis. Keep the emphasis on the criteria and their motivating cases rather than on scoring existing theories.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for an account of incommensurability:

  1.  **Deconstruct the Request:**

      *   **Context:** The user is in a research group transitioning from an old theoretical framework to a new one. They observe experienced members struggling to restate old hypotheses in new vocabulary without distortion.
      *   **Task:** Write the *desiderata* for an adequate account of incommensurability between scientific paradigms.
      *   **Key Components:**
          *   Phenomena to explain (loss of shared standards, persistence of empirical agreement, conditions for rational conversion).
          *   Distinctions to respect (semantic vs. methodological vs. axiological).
          *   Non-negotiable requirements vs. camp-specific preferences.
          *   Flag jointly unsatisfiable subsets (e.g., no common measure vs. rational adjudication).
          *   Address "localized incommensurability" (subset of terms untranslatable vs. intact observational protocols) and its impact on the strong Kuhnian thesis.
          *   **Constraint:** Keep emphasis on criteria and motivating cases, *not* on scoring existing theories.

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *Incommensurability:* Originates with Kuhn and Feyerabend. Core idea: no common measure.
      *   *The User's Observation:* "Conceptual distortion" when translating old to new. This sounds like semantic incommensurability (meaning change).
      *   *The Tension:* If paradigms are incommensurable, how do we choose between them? (The "Rationality Problem").
      *   *Types:* Semantic (meaning), Methodological (rules of inquiry), Axiological (values/goals).
      *   *Localized vs. Global:* Does the whole theory shift, or just parts? If observation stays the same, is it really Kuhnian incommensurability?
      *   *Desiderata:* What *must* a good theory of this phenomenon do?

  3.  **Drafting the Desiderata - Section by Section:**

      *   **Introduction:** Acknowledge the user's situation. It's a classic Kuhnian moment. Define the scope.

      *   **1. Phenomenological Adequacy (What must it explain?):**
          *   *Translation Failure:* The user's specific observation. Old terms don't map cleanly to new ones.
          *   *Talk-past-each-other:* Disagreements that aren't resolvable by logic alone because premises differ.
          *   *Continuity:* Science doesn't stop. Empirical data often survives the revolution (e.g., planetary positions survived Ptolemy -> Copernicus).
          *   *Rational Choice:* Scientists *do* switch. It's not random. The account must explain *why* without assuming a neutral algorithm.

      *   **2. Categorical Distinctions (What nuances must it capture?):**
          *   *Semantic:* Meaning reference change (e.g., "mass" in Newton vs. Einstein).
          *   *Methodological:* What counts as a valid proof or experiment changes.
          *   *Axiological:* What counts as a "good" theory (simplicity, scope) changes or is weighted differently.
          *   *Need:* The account must allow these to vary independently.

      *   **3. The Rationality Constraint (The Big Tension):**
          *   *The Paradox:* If no common measure (incommensurable), how is choice rational?
          *   *Requirement:* Must explain rational conversion *without* positing a neutral, algorithmic decision procedure. It needs to allow for "reasoned disagreement."

      *   **4. Non-Negotiables vs. Camp Preferences:**
          *   *Non-Negotiable:* Must account for the *feeling* of distortion (user's data). Must account for scientific progress (not just relativism).
          *   *Camp Specific:* Does reference change completely (Kuhn) or partially (Putnam/Bishop)? Is it sociological or logical?

      *   **5. Jointly Unsatisfiable Subsets (The "No-Go" Theorems):**
          *   *The Trilemma:* (1) Strict Incommensurability (no common measure), (2) Rational Adjudication (objective choice), (3) Neutral Observation Language. You can't have all three.
          *   *Specifically:* If you claim *total* lack of common measure, you undermine rational adjudication. If you claim rational adjudication is algorithmic, you deny incommensurability.

      *   **6. Localized Incommensurability:**
          *   *User's Question:* Does allowing intact observational protocols undermine Kuhn?
          *   *Analysis:* Kuhn argued observation is theory-laden. If observation is neutral, semantic incommensurability is weakened (you can compare predictions).
          *   *Desideratum:* The account must specify *where* the break happens. If observation is stable, the incommensurability must be deeply theoretical, not empirical. This weakens the "world change" thesis but saves rational comparison.

  4.  **Refining and Polishing (Self-Correction):**

      *   *Check:* Did I score existing theories? *Correction:* Ensure I talk about "an account" generally, not "Kuhn's account fails because..."
      *   *Check:* Did I address the user's specific observation? *Correction:* Explicitly link the "conceptual distortion" to the semantic desiderata.
      *   *Check:* Is the distinction between non-negotiable and preference clear? *Correction:* Use a specific section for this.
      *   *Check:* Is the "Localized" section robust? *Correction:* Need to explain *why* it threatens the strong thesis (if data is neutral, theories are comparable via data).

  5.  **Final Structure:**

      *   **Introduction:** Contextualize the desiderata.
      *   **I. Phenomenological Desiderata:** What data must be fit? (Translation loss, empirical continuity, rational transition).
      *   **II. Categorical Desiderata:** Distinguishing types (Semantic, Methodological, Axiological).
      *   **III. The Rationality Constraint:** The core tension (No algorithm vs. No irrationality).
      *   **IV. Non-Negotiables vs. Optional Commitments:** Separating the core from the flavor.
      *   **V. Jointly Unsatisfiable Subsets:** The logical limits (The Trilemma).
      *   **VI. The Localized Incommensurability Challenge:** Addressing the specific query about observational protocols.
      *   **Conclusion:** Summary of the tightrope walk.

  6.  **Drafting the Content (incorporating philosophical precision):**
      *   Use terms like "theory-ladenness," "reference potential," "lexical structure."
      *   Ensure the distinction between *incomparability* and *incommensurability* is clear (a common pitfall).
      *   Make sure the "Localized" section addresses the tension with Kuhn's "world change."

  7.  **Final Review against constraints:**
      *   Emphasis on criteria? Yes.
      *   Motivating cases? Yes (will use generic examples like mass/planet).
      *   No scoring existing theories? Yes.
      *   Address jointly unsatisfiable subsets? Yes.
      *   Address localized incommensurability? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to imply that Kuhn was *wrong* about observation, but rather that an *adequate account* must decide where observation fits. If the user sees intact protocols, the account must handle that without collapsing into simple falsificationism.

  8.  **Final Polish:** Check tone. Needs to be analytical, rigorous, suitable for a researcher entering a philosophy of science debate. (Proceed to generate output).

  *(Post-computation check)*: The prompt asks for "desiderata." I should structure it as a list of requirements/criteria. I will organize by the categories requested in the prompt. I need to make sure the "Jointly Unsatisfiable" section is very clear about the logical tension.

  Let's refine the "Localized" part. If observational protocols remain intact, does that kill the strong Kuhnian thesis? The strong thesis says the *world* changes. If observation is neutral, the world is stable. So, an account allowing localized incommensurability must explain how theoretical terms shift meaning *without* requiring the observational base to shift. This moves away from Kuhn towards a more structuralist or semantic view. I need to flag this as a tension point in the desiderata.

