answer: |-
  Here is the honest assessment and the constructed case you requested, designed to survive the seminar room by acknowledging its own limits.

  **The Scenario**
  Two identical spheres of soft clay move toward each other in a vacuum chamber along a straight line. They collide head-on and merge into a single, stationary lump. The laws governing this system are the standard macroscopic laws of classical mechanics for perfectly inelastic collisions: momentum is conserved, but kinetic energy is not; it is dissipated into internal deformation and heat. An investigator arrives five minutes after the collision. She measures the mass of the merged lump, confirms its velocity is exactly zero, and knows the collision laws perfectly. She wants to know how fast the spheres were moving before impact.

  **The Check**
  *Present State:* The system is defined by the macroscopic variables: total mass $M$, center-of-mass position $X$, and center-of-mass velocity $V=0$.
  *Compatible Pasts:* Any pair of initial velocities $(v, -v)$ for the two spheres is compatible with this present state, provided momentum is conserved. The specific magnitude $|v|$ is lost.
  *Why Precision Fails:* Increasing precision on $X$ or $V$ (e.g., knowing $V$ is $0.0000000$) does not help, because the mapping from initial states to final states is **many-to-one**. Distinct pasts map to the identical present macro-state.
  *Future Predictability:* The future is perfectly deterministic. Given the present state (a stationary lump), the future state (remaining a stationary lump) is unique and calculable.
  *The Honesty Clause:* You are right to object that if the "state" included the exact position and momentum of every atom in the clay (the microstate), the past *would* be recoverable in principle, because fundamental classical mechanics is time-reversible (Liouville's Theorem). To make this case work, you must drop the clause that the "present state" includes all causal degrees of freedom. You are working with an **effective theory** (continuum mechanics), not fundamental particle mechanics. The information isn't gone from the universe; it is gone from the *variables you are allowed to use*.

  **The Load-Bearing Feature**
  The feature doing all the work is **dissipation** (or phase-space contraction). In this model, distinct trajectories in the state space merge onto a single trajectory. If you remove this feature—i.e., if you stipulate the collision is perfectly *elastic*—the dynamics become invertible. Conservation of energy plus conservation of momentum would then allow you to solve uniquely for the initial velocities. The failure of retrodiction is structural to the dissipative law, not a result of measurement error or chaos.

  **The Strongest Objection**
  A Laplacean purist will argue: "This is not a failure of determinism, but a failure of description. Determinism implies that the *complete* physical state at $t_1$ fixes the state at $t_2$. If your state description omits the thermal motion of the atoms, you have not specified the 'present state' fully enough for Laplace's Demon. If you include the heat generated by the collision, the mapping is one-to-one, and the past is recoverable. Therefore, true determinism entails reversibility; your case only shows that *coarse-grained* models are irreversible."
  *Response:* This objection forces a distinction between **Fundamental Determinism** (microscopic, reversible) and **Effective Determinism** (macroscopic, often irreversible). For the purposes of a first-year course, this is the lesson: Laplace's Demon requires knowledge of *all* variables, but science often works with *some* variables. In the latter, the past can be structurally opaque even if the future is clear.

  **Terminology**
  The phenomenon is **Irreversibility** (specifically, **Macroscopic Irreversibility**).
  *Boundaries:* It falls under the umbrella of **Dissipative Systems**.
  *Confusions:* It is often confused with **Indeterminism**. Indeterminism means the *future* is not uniquely fixed by the present (branching forward). Irreversibility means the *past* is not uniquely fixed by the present (branching backward). Your case is deterministic (unique future) but irreversible (non-unique past). It is also distinct from **Chaos**; chaos involves sensitive dependence on initial conditions (exponential divergence), whereas this case involves trajectory *convergence* (merging).
  *Neighbouring Notion:* **Loschmidt's Paradox** concerns the conflict between this macroscopic irreversibility and microscopic reversibility.

  \answer{Dissipation erases past information}
