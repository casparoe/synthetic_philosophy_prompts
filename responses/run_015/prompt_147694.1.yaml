answer: |-
  The tension between the *Symposium* and the *Laws* regarding intoxication is not merely a discrepancy in Plato's attitude toward social custom, but a fundamental conflict in moral psychology concerning the locus of the self. If we frame this through the analytic lens of masked versus finkish dispositions, the question becomes precise: Does sobriety function as a social mask that inhibits the expression of pre-existing character traits (which wine removes), or does intoxication function as a finkish stimulus that actively dismantles the psychic architecture required for those traits to exist at all? While the dramatic power of Alcibiades' entrance in the *Symposium* tempts us to view wine as a truth serum that strips away the *thumos*-driven shame of the social mask, a rigorous analysis of Plato's tripartite psychology compels the opposite conclusion. Drunkenness does not reveal the true self; it temporarily abolishes the rational agent who constitutes the self. Plato's endorsement of drinking parties in the *Laws* is not an endorsement of alcohol as an ontological revealer, but rather as a diagnostic stress-test for the legislator. The drunk state is a corruption of the *logistikon*, rendering the behavior epistemically valuable only as evidence of the soul's vulnerability, not its essence.

  To understand why the "revelation" reading fails, we must first scrutinize the *Symposium* scene that supposedly supports it. Alcibiades bursts in, *komos*-ready, and explicitly claims that wine compels truth-telling. He proceeds to expose his own erotic desperation and Socrates' uncanny indifference. Superficially, this supports the "unmasking" thesis: sober Alcibiades, the ambitious politician, hides his shame; drunk Alcibiades reveals his eros. However, within the dialogue's own moral economy, Alcibiades is the paradigm of the disordered soul. His "truth" is not the revelation of a hidden, stable essence, but the eruption of a chaotic *epithumetikon* that has already overthrown his reason. When Alcibiades says wine reveals the truth, he is speaking from the perspective of the appetite, not the *logistikon*.

  If we accept Plato's tripartite model, the "true self" is identified with the rational part of the soul, the *logistikon*, which aims at the good of the whole. Virtue is the harmony of the parts under reason's rule. In the *Symposium*, Alcibiades' drunkenness does not lift a mask to show a virtuous core; it demonstrates that the core is already compromised. The wine does not reveal a "true Alcibiades" waiting underneath; it creates a temporary psychic tyranny where the appetitive part speaks without the check of shame (*aidos*) or reason. Thus, even in the *Symposium*, the intoxication is not revealing a stable disposition that was merely masked by social convention. Rather, it is amplifying a disorder. The "truth" Alcibiades speaks is the truth of his sickness, not his health. To treat this as a model for moral revelation is to mistake the symptoms of psychic civil war for the voice of the agent.

  The *Laws* makes this mechanistic destruction of agency explicit, moving us from the dramatic to the technical. In Book I, the Athenian Stranger proposes the regulated symposium not as a venue for authentic self-expression, but as a simulation of tyranny. The crucial analogy is the puppet of the gods: we are pulled by cords of passion, fear, and confidence, with the single golden cord of reason (*logismos*) guiding us. The Stranger argues that wine artificially strengthens the iron cords of passion and fear while weakening the golden cord of reason. This is the critical point for the masked/finkish debate. If sobriety were merely a "blocker" masking a true disposition, removing it would allow the disposition to manifest freely. But Plato describes wine as actively *weakening* the golden cord.

  This suggests that drunkenness is a finkish condition in the strongest sense: it removes the very capacity for virtue. A virtuous disposition requires the *logistikon* to be active and ruling. If alcohol induces a state where the *logistikon* is "asleep" (as the text implies), then the agent literally lacks the faculty required to manifest virtue at that moment. The behavior observed in the drunkard is not the behavior of the moral agent operating without inhibition; it is the behavior of a fragmented soul operating without a governor. Therefore, the drunk action cannot be trusted as evidence of the sober character's *content*, only its *structural integrity*. When the *Laws* suggests we test citizens with wine, we are not looking to see "who they really are" in the sense of their hidden desires. We are testing the tensile strength of their education (*paideia*). We are checking if the habits ingrained in the *thumos* and *epithumetikon* are strong enough to hold the line when the *logistikon* is temporarily incapacitated.

  This distinction is vital for resolving the tension. The "revelation" theorist argues that wine removes the social mask (sober inhibition) to show the real trait (e.g., cowardice or lust). The "corruption" theorist (my position) argues that wine removes the rational self, leaving behind a psychic remnant that acts according to brute habit and appetite. The difference is between *uncovering* a trait and *altering* the subject. If I am brave, my bravery is a disposition of my rational spirit to endure fear. If I am drunk, I may not feel fear, but that is not bravery; it is insensibility. If I am temperate, my temperance is reason ruling appetite. If I am drunk, reason is offline, so temperance is impossible. The behavior I exhibit while drunk is, strictly speaking, not *my* behavior as a moral agent, but the behavior of my lower parts running wild.

  Consequently, the epistemic value of the drinking party in the *Laws* is entirely third-personal, not first-personal. It is not for the drinker to know themselves—since the drinker is currently compromised—but for the legislator to know the citizen. The legislator observes how the "puppet" moves when the golden cord goes slack. Does the puppet collapse into violence? Does it weep? Does it remain relatively stable due to the inertia of good habit? This is why the drinking parties in the *Laws* are so heavily regulated, with a "Symposiarch" who must remain sober. The sober observer is the only one capable of truth-tracking. The drunk subject is the object of study. This confirms that the drunk state is not a privileged epistemic vantage point for the agent. If wine revealed the true self, everyone should drink to gain self-knowledge. But Plato insists the majority should drink only under supervision, and the guardians of the laws must largely avoid it. The "truth" of the soul is found in the order of reason, which wine disrupts.

  One might object that this renders the *Symposium* inexplicable. Why does Socrates allow Alcibiades to speak? Why is the speech valued? The answer lies in the specific nature of *eros*. Alcibiades' drunkenness is coupled with a form of divine madness (*mania*). In the *Phaedrus*, Plato distinguishes between human madness (sickness) and divine madness (inspiration). Alcibiades occupies a liminal space where his chemical intoxication lowers his defenses, allowing his *eros* for Socrates to break through his political ambition. However, this is not a general endorsement of alcohol. It is a specific dramatic instance where the disruption of social *nomos* allows a philosophical truth to emerge—but note, the truth is about Socrates, not Alcibiades' virtue. Alcibiades reveals his *lack* of virtue. He reveals his inability to follow Socrates. The wine facilitates the confession of failure, not the display of excellence. This aligns perfectly with the *Laws*: the test reveals who fails to maintain order. Alcibiades is the failed subject of the test, displayed dramatically.

  Furthermore, treating drunkenness as a "revealer" of the true self commits a category error regarding Plato's metaphysics of the soul. For Plato, the "true self" is not the bundle of desires that exists prior to socialization. The "true self" is the rational soul aligned with the Forms. Socialization (*paideia*) is not a masking process; it is a constitutive process that shapes the lower parts to obey reason. Therefore, the "social mask" of sobriety is actually the cultivated harmony of the soul. To remove it is not to return to a truer state, but to regress to a pre-rational state. The "inhibiting condition" is not sobriety; the inhibiting condition is the *logistikon* holding back the appetites. Wine removes the inhibitor (reason), allowing the appetites to run free. But since the appetites are not the "self" in the normative sense, their output is not the "truth" of the person, but the truth of their biology and unchecked habit.

  We must therefore conclude that Plato views drunkenness as a finkish corruption of the moral agent, not an unmasking of the moral character. The disposition to be virtuous is fragile; it requires the active presence of reason. Alcohol removes the condition necessary for that disposition to manifest, replacing it with a disposition to follow immediate pleasure or pain. The behavior observed is reliable only as a measure of how deeply habit has been ingrained in the non-rational parts of the soul. It tells the legislator: "This citizen's habits are strong enough to mimic virtue even without reason," or "This citizen's soul collapses into tyranny without reason." It does not tell us: "This citizen is secretly a tyrant." The distinction is subtle but crucial. The former acknowledges that the drunk state is an artificial distortion; the latter assumes the drunk state is the hidden reality.

  Ultimately, the *Laws* subsumes the *Symposium*. The dramatic truth of Alcibiades is a poetic illustration of the psychological danger legislated against in the *Laws*. Alcibiades is the warning: a soul that relies on the "mask" of sobriety to maintain order will shatter when the wine is poured. But the shattering does not mean the mask was false; it means the order was fragile. Plato's moral psychology demands that the true self is the ordered self. Since drunkenness is a disorder, it cannot reveal the true self. It can only reveal the distance between the ordered self and the chaotic potential that lies beneath. The drinking party is not a sacrament of truth, but a fire drill. We do not set a building on fire to see its "true" structure; we do it to see if the firewalls hold. For Plato, the fire is the passion of the soul, and the firewall is reason. Wine lights the fire. To claim the fire reveals the building is to confuse destruction with disclosure.
