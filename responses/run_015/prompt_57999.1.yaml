answer: |-
  During a sudden API latency spike, Engineer A cycles through restarting containers, rolling back the latest deploy, and scaling up database replicas, yet she treats every action as a tweak to fix her unwavering belief that a deadlock is blocking writes. Meanwhile, Engineer B methodically runs the same three diagnostic scripts and checks the same status dashboard every ten minutes, but when the scripts return normal latency, she immediately discards her initial network congestion theory to investigate a regional provider failure instead. Both work for an hour; A's system remains down despite her frantic activity, while B's repetitive checks eventually confirm the external provider issue, prompting a successful failover.

  Under a **means-rigidity view**, Engineer B is more sphexish because she mechanically repeats the same concrete actions (the scripts) regardless of the changing context, mirroring the wasp's repetitive dragging of the cricket. Under an **ends-rigidity view**, Engineer A is more sphexish because she remains cognitively locked onto a single failing hypothesis (the deadlock) despite varying her actions, demonstrating an inability to update her mental model of the problem. The detail doing the main work is **whether the evidence generated by the steps updates the diagnosis**: A's steps never challenge her belief, while B's steps directly trigger a belief change. If this detail were removed—for instance, if A also abandoned her deadlock theory after the rollback failed—the contrast between their cognitive flexibility would vanish, making them equally adaptable. Someone could challenge this verdict by arguing that sphexishness is fundamentally a **functional critique** regarding failure to achieve goals, not just a structural description of repetition; they would contend that labeling B as sphexish is misleading because her rigid means successfully solved the problem, whereas true sphexish behavior is defined by its maladaptive persistence in a failing course of action.
