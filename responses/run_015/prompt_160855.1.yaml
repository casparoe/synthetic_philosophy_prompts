prompt: |-
  hey — I'm putting together an adversarial collaboration document and I want you to draft it. The two parties: on one side, someone who thinks the problem of old evidence is basically a modelling artifact — an agent who already assigns probability 1 to E can't have their credence in T raised by E, sure, but that's because we've time-sliced the agent too crudely; once you rebuild the space so that the arrival of the theory (or of the realization that the theory entails the evidence) is itself a genuine learning event over a richer set of propositions, the confirmation shows up in the update where it should. Call them the dissolutionist. On the other side, someone who thinks that fix is a free-parameter machine: any credence you need can be manufactured by choosing the enrichment, so you can get confirmation or not as you like, and the real lesson is that confirmation isn't just credence-raising — that something about how a theory is arrived at, or about what it would have predicted, is doing ineliminable work that the Bayesian formalism can't represent from the inside. Call them the sceptic. Assume they're both otherwise orthodox Bayesians; they're not arguing about conditionalization as such.

  What I need is the actual deliverable, not a summary of the literature. So:

  1. A numbered agreed-claims section — stuff both could sign. Include the formal point about P(E)=1 blocking confirmation, the intuitive datum (the standard Einstein/perihelion-of-Mercury sort of case: evidence known long before the theory, still counted as supporting it), and any joint constraints on a solution (e.g. it shouldn't make arbitrary evidence confirm arbitrary theories, it shouldn't require the agent to have had credences they plainly never had, it shouldn't smuggle in a non-Bayesian notion while claiming to be pure bookkeeping).

  2. A disagreements table: the residual disagreement, stated twice — once in wording the dissolutionist would accept for their own view, once in wording the sceptic would accept for theirs. I want the formulations sharp, not diplomatic mush.

  3. The cruxes, with each side's prediction written down in advance. Here are the ones I think matter, add any I'm missing:
     - robustness: as you refine the enriched space (splitting "the theory entails the evidence" into intermediate lemmas), do the confirmation verdicts converge, or do they drift with the granularity you pick? If they drift, whose problem is that?
     - whether the counterfactual framing (what would I have thought had I not known E) is well-defined at all once the theory changes the agent's conceptual scheme — or whether it's just a stand-in for "T would have predicted this".
     - graded logical competence: real agents aren't logically omniscient, so the dissolutionist's story leans on ignorance of an entailment. What's supposed to happen with an agent who has partial confidence in the entailment, or who derived it once, forgot, and rediscovers it?
     - construction vs prediction: does it matter that E was used as a constraint in building T, or only that E was known? If it matters, is that a fact about the theory, about the scientists, or about the evidence?

  4. For each crux, at least one case both would accept as bearing on it, with both predictions recorded. Two I'd like used: (a) the "archive" case — a scientist derives E from T, writes it up, forgets, and later reconstructs the derivation; (b) the blinding case — the practice in some physics experiments of hiding the data until the analysis is frozen, and pre-registration in psychology. Does the dissolutionist's account make blinding epistemically mandatory, optional, or pointless, and does the sceptic think that's a reductio of their own view or a recommendation?

  Finally: say which part of the argument is actually verbal. My guess is that some of it is a fight about what "confirmation" is for — a norm on what this agent should now believe versus a relation used to appraise theories independently of anyone's psychology — and I want you to locate that precisely and tell me whether separating it dissolves any of the cruxes or just relabels them.

  Format it as: numbered agreed claims, then the disagreements table, then a crux table with columns for crux / bearing case / dissolutionist prediction / sceptic prediction. Don't bother with author names, papers or references — I know the literature, I just want the argument. And please definately don't hedge everything into mush; if you think one side wins a sub-point, say so and say why.
