answer: |-
  You press me upon a difficulty I have felt keenly in my private reflections. I must concede that the mere trajectory of effect size, viewed in isolation, cannot logically discriminate between a faculty sensitive to psychological conditions and an artefact sensitive to human expectation. In my own time, we lacked your modern statistical routines to quantify this decline with precision, yet we observed the tendency. However, the distinction does not rest solely upon the magnitude of the success, but upon its quality. In our most rigorous experiments—where the agent and percipient were separated by walls, and the target selected by lot—we found coincidences too specific to be dismissed as mere guesswork, even if the frequency was low.

  As to the rationality of continuing: if the phenomenon is genuine but frail, then strict controls should not extinguish it entirely, but merely define its limits; if it is artefact, strict controls should eliminate it. Our justification for belief was that even under conditions designed to preclude sensory leakage, a residuum of successful cases remained, attested by men of science whose probity we trusted. I will admit that this residuum is slender, and that without your modern methods of blinding, certainty was unreachable. Yet it was rational to pursue the inquiry, for only by tightening the sieve could we hope to see if any gold remained.

  \answer{stance: holds | conceded: magnitude alone distinguishes nothing | crux: residuum of hits under strict controls}
