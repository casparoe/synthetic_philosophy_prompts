answer: |-
  ### The Standard of Adequacy for Realization

  **Unit Context:** Metaphysics of Science
  **Target:** The Realization Relation
  **Goal:** To underwrite non-reductive physicalism (functionalism) without succumbing to epiphenomenalism or type-identity theory.

  Before engaging with specific accounts, students must evaluate every proposal against the following five constraints. These are not merely definitions; they are the job description for the realization relation. If a theory cannot satisfy these, it fails to do the philosophical work required of it.

  #### I. Methodological Prelude: The Token/Type Disambiguation
  *   **The Requirement:** Any claim about realization must explicitly state whether it applies to *tokens* (particular instances) or *types* (properties/kinds).
  *   **The Motivation:** Confusion here generates false dilemmas. Token realization is widely accepted (this specific pain is realized by this specific C-fiber firing). Type realization is the battleground (is *pain-as-such* realized by *C-fiber-firing-as-such*?). An adequate account must explain how token-realization supports special science generalizations without committing to type-identity.

  #### II. Substantive Constraints

  **1. The Asymmetry Constraint (Cross-Classification)**
  *   **The Requirement:** The account must accommodate many-to-one mapping (Multiple Realizability) and one-to-many mapping (Pluripotency/Context-Sensitivity) without collapsing into ambiguity.
  *   **The Motivation:**
      *   *Many-to-One:* A mental state (e.g., belief) must be realizable by heterogeneous physical substrates (human neurons, silicon chips, alien goo) to preserve the generality of psychology.
      *   *One-to-Many:* A single physical structure (e.g., a specific protein configuration) must be able to realize distinct higher-level properties depending on context (e.g., carrying oxygen vs. buffering pH) to preserve the specificity of biology.
      *   *Failure Mode:* If the account forces a one-to-one mapping, it collapses into type-identity theory. If it allows unconstrained many-to-many mapping, the realization relation becomes too loose to ground explanation.

  **2. The Causal Inheritance Constraint (No Magic)**
  *   **The Requirement:** The causal powers of a realized property instance must be inherited from, and exhausted by, the causal powers of its realizing base instance.
  *   **The Motivation:** To remain physically respectable, the account cannot allow "spooky" downward causation where the realized property adds new causal oomph to the universe. The realized property works *by* the realizer working.
  *   **Failure Mode:** If the realized property has powers *over and above* the realizer, physicalism is violated (emergentism/dualism).

  **3. The Distinctness Constraint (Non-Identity)**
  *   **The Requirement:** The realized property must be metaphysically distinct from the realizing property, even if they are co-located in space and time.
  *   **The Motivation:** To secure the autonomy of the special sciences. If realization is just identity in disguise, biology and psychology reduce to physics, and their distinct laws and explanations are merely heuristic shortcuts.
  *   **Failure Mode:** If realization entails identity, the special sciences lose their ontological footing (Reductive Physicalism).

  **4. The Base Scope Constraint (Size and Shape)**
  *   **The Requirement:** The account must specify the mereological and categorical limits of a realizer. Must a realizer be an intrinsic property of an individual? Or can it include relational properties, environmental factors, or ensemble features of a group?
  *   **The Motivation:** To handle cases of extended cognition, niche construction, and social kinds. If realization is restricted to "skin-and-skull" intrinsic properties, many special science properties (e.g., being a currency, being a spouse, having a memory aided by a smartphone) cannot be realized.
  *   **Failure Mode:** If the base is too narrow (individualism), the account fails to capture the actual practice of the special sciences. If the base is too wide (holism), the account risks losing the asymmetry required for realization (everything realizes everything).

  **5. The Explanatory Autonomy Constraint**
  *   **The Requirement:** The existence of the realization relation must vindicate the legitimacy of special science explanations, even when physical explanations are available.
  *   **The Motivation:** We explain the valve's opening by citing the pressure, not the micro-physical trajectory of every molecule. An adequate account of realization must explain why the higher-level explanation is not merely a convenient fiction but captures a genuine causal structure.
  *   **Failure Mode:** If the account implies that only the base-level explanation is strictly true, it leads to eliminativism about the special sciences.

  ***

  ### Philosophical Analysis of the Standard

  When you bring this list into the seminar room, you must treat it not as a checklist of truths, but as a map of tensions. Several items on this list are not neutral desiderata but substantive theoretical commitments that will alienate certain metaphysical positions.

  **Desiderata vs. Prejudices**
  *   **The Causal Inheritance Constraint is a Physicalist Prejudice.** This is the most significant hidden assumption in the list. It presumes that causation flows "up" from the base and that there is no "emergence" of novel powers. An emergentist or a powers-based metaphysician would reject this as begging the question against downward causation. If your students are open to robust emergence, this constraint must be flagged as a condition for *physicalist* realization, not realization *simpliciter*.
  *   **The Base Scope Constraint reveals an Individualist Bias.** Classical functionalism assumes realizers are properties of the individual organism. However, mechanistic and enactivist approaches suggest realizers are often distributed across agent and environment. Insisting that realizers must be "same-level or below" *within an individual* prejudges the debate over extended cognition and social ontology.
  *   **The Distinctness Constraint is Ambiguous.** "Distinct" can mean conceptually distinct (predicates), nominally distinct (properties), or ontologically distinct (entities). Many failed accounts slide between these. An account might satisfy conceptual distinctness while failing ontological distinctness, technically meeting the letter of the constraint while violating its spirit (autonomy).

  **Incompatible Requirements (The Trilemma)**
  The most critical philosophical work you can do with this list is to demonstrate that **Causal Inheritance**, **Distinctness**, and **Explanatory Autonomy** form a trilemma. It is highly probable that no account can satisfy all three simultaneously without significant cost.
  1.  If you enforce **Causal Inheritance** strictly (the base does all the work), you threaten **Explanatory Autonomy** (the realized property is causally idle/epiphenomenal).
  2.  If you enforce **Explanatory Autonomy** strictly (the realized property does genuine work), you threaten **Causal Inheritance** (you risk causal overdetermination or novel powers).
  3.  If you try to save both by claiming the work is "the same work described differently," you threaten **Distinctness** (you slide into type-identity).

  This incompatibility is not a bug in your syllabus; it is the feature. The literature on realization is essentially a history of philosophers choosing which of these three to relax.

  **The Killer Constraint**
  The single requirement that excludes the most otherwise-plausible accounts is **The Causal Inheritance Constraint (specifically, the "Exhaustion" clause).**

  *   **Why:** This constraint forces the "Exclusion Problem." If the realizer's powers *exhaust* the realized property's powers, it becomes difficult to articulate what causal work is left for the realized property to do.
      *   *Subset Accounts* (realized powers are a subset of realizer powers) satisfy this but struggle to explain why the subset is causally relevant in its own right.
      *   *Role-Functional Accounts* (realization is occupying a causal role) satisfy this but often collapse into identity when the role is filled.
      *   *Mechanistic Accounts* (realization is part-and-constituent organization) often violate this because the mechanism's behavior is not strictly exhausted by the sum of component powers (due to organization/structure).
      *   *Emergentist Accounts* are immediately excluded because they deny exhaustion.

  By holding this constraint fixed, you force students to confront the hardest problem in non-reductive physicalism: **How can a property be distinct and causally efficacious if its causal profile is entirely determined by something else?** If they cannot answer this, they have not understood the stakes of the realization debate.

  ***

  ### Brief Scorecard of Contenders

  *For the instructor's use in framing the discussion:*

  **Subset/Power-Based Accounts:** Define realization as the inclusion of powers (realized powers are a proper subset of realizer powers). *Strengths:* Satisfies Causal Inheritance elegantly. *Weaknesses:* Struggles with the Distinctness Constraint; risks making realization look like a species of identity.
  **Role-Functional Accounts:** Define realization as the occupation of a causal role by a property. *Strengths:* Handles Multiple Realizability well. *Weaknesses:* Struggles with Causal Inheritance (does the occupant do the work or the role?); risks circularity.
  **Mechanistic/Constitution Accounts:** Define realization as the organized composition of parts constituting a whole. *Strengths:* Fits scientific practice (biology/neuroscience) well; handles Base Scope flexibly. *Weaknesses:* Often blurs the line between realization and causation; struggles to maintain Synchronicity (constitution often looks diachronic).
  **Flat vs. Dimensioned:** Flat accounts (realizer and realized are properties of the same object) struggle with Base Scope. Dimensioned accounts (realizer is parts, realized is whole) handle Base Scope better but struggle with Causal Inheritance (parts causing whole's behavior).
