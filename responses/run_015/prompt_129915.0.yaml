answer: |-
  **JOINT STATEMENT ON PERSONHOOD AND MORAL STATUS**

  **1. Agreed Claims**

  1.  Severe social deprivation causes irreversible damage to psychological capacities essential for agency.
  2.  Withdrawing recognition from a capable human is a moral injury, not merely a change in ontological status.
  3.  Possessing high-level psychological capacities does not guarantee moral immunity if social recognition is universally withheld.
  4.  Relations are not merely instrumental tools for satisfying pre-existing individual needs.
  5.  Individual capacities are not self-interpreting; they require a social context to function as agency.
  6.  Moral status cannot be entirely revoked by community exclusion alone.
  7.  A being treated as a person who lacks standard biological humanity raises genuine moral questions for both sides.
  8.  Duties to distant strangers exist independently of existing relational ties.
  9.  Personhood admits of vulnerability at the margins of life that neither pure capacity nor pure relation fully explains alone.
  10. The distinction between "becoming" a person and "being recognized" as one is not always sharp in practice.

  **2. Disagreements Table**

  | Issue | RC Formulation | IC Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Constitution** | Relations partly constitute the status of personhood; without them, the status is incomplete or absent. | Relations causally enable the development of capacities that constitute personhood; status is intrinsic. | Substantive |
  | **The Unreached** | The Unreached lacks full personhood due to absent relations, though retains potential status. | The Unreached retains full personhood via capacities, despite social deprivation. | Substantive |
  | **Normativity** | Relations must be read normatively (right kind of relation), not as mere causal-social entanglement. | Relations are descriptive social facts; normativity applies to how we treat capacities, not the relations themselves. | Verbal |

  **3. Cruxes Table**

  | Crux | Case/Argument | RC Prediction | IC Prediction | Evidence Against |
  | :--- | :--- | :--- | :--- | :--- |
  | **Constitutive vs. Developmental** | **The Unreached:** Does isolation negate status or merely impair function? | Status is diminished because constitutive relations are absent. | Status is intact; only flourishing is impaired. | If Unreached shows no moral difference in treatment compared to related humans. |
  | **Rescue and Collapse** | **The Unreached:** Can RC appeal to possible relations without becoming IC? | RC appeals to species-typical potential for relation, risking collapse into capacity-view. | IC argues this appeal concedes that capacities/potential, not relations, do the work. | If RC cannot distinguish potential relation from potential capacity without contradiction. |
  | **Hostage to Wrongdoing** | **Adaeze:** Does exclusion strip status? | Status is damaged but not void; wrongdoers cannot fully extinguish personhood. | Status is invulnerable to exclusion; wrongdoers merely violate duties. | If RC implies Adaeze loses status, making exclusion self-justifying. |
  | **Normative Relation** | **Apostate/Gang/Margins:** What counts as a "right" relation? | RC must define relations normatively, excluding criminal gangs or repudiated values. | IC argues this requires external moral standards, making relations redundant. | If RC cannot exclude gang membership without appealing to individual capacities/values. |
  | **Symmetry** | **Unreached vs. Well-Related Artifact:** Must cases be decided symmetrically? | RC treats Artifact as person (relations present) and Unreached as non-person (relations absent). | IC treats Unreached as person (capacities present) and Artifact as non-person (capacities absent). | If intuition strongly favors asymmetry (both are persons or neither), forcing view adjustment. |
  | **Duties to Strangers** | **Distant Stranger:** Can RC generate stringent duties without ties? | RC must ground duties in potential relation or shared humanity, not actual ties. | IC grounds duties in capacity/vulnerability, independent of relation. | If RC cannot justify stringency comparable to intimates without actual relational history. |

  **4. Closing Record**

  Several disputes initially appeared substantive but proved verbal upon precise formulation. Specifically, the debate over whether relations are "constitutive" masked an agreement that relations are indispensable for the *exercise* of agency. IC withdrew the claim that relations are "merely instrumental," acknowledging intrinsic value. RC withdrew the claim that isolation literally extinguishes personhood, conceding a baseline status remains. The disagreement over the "Normative Relation" remains verbal: IC accepts relations must be "appropriate" for flourishing, while RC accepts "appropriateness" is defined by moral standards external to the relation itself. Both parties agree that future work must focus on the margins of the life cycle, where both capacity and relation are partial, rather than the paradigmatic adult cases used here. Neither side concedes the core ontological claim, but both agree the practical moral implications converge significantly more than previously admitted.
