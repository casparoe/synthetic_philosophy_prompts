answer: |-
  Here is a prioritized ordering of your candidate questions, evaluated against your constraints (15 months to proposal, armchair/formal methods, goal of testing defensibility). I have also identified one critical missing question and flagged the overrated elements.

  ### The Prioritization

  **1. The Threshold Indexing Question (Candidate 2)**
  *   **Rank:** First (The Spine)
  *   **Upstream/Downstream:** This is upstream of almost all applied verdicts and downstream of the metaphysical nature of value. If the threshold is fixed, you face the "adapted masochist" or "chronic pain" counterexamples. If indexed, you face the "collapse into prioritarianism" objection.
  *   **Tractability:** High. This is pure armchair philosophy. It relies on constructing cases involving hedonic adaptation, baseline shifts, and comparative intuitions. It does not require empirical data, only phenomenological plausibility.
  *   **Neglectedness/Impact:** High neglectedness, massive impact. Most lexical utilitarian literature assumes a fixed scale. Addressing the indexing problem determines whether LTNU is a distinct view or merely a rhetorical variant of prioritarianism.
  *   **Action-Guiding:** High. If indexed, the view demands we prioritize those with low *relative* suffering (perhaps the wealthy depressed) over those with high *absolute* suffering (the adapted poor). This changes the extension of the theory significantly.
  *   **Reasoning:** This is the most fertile ground for a dissertation. It allows you to define the identity of your view. If you cannot solve this, the view collapses into a rival, rendering the rest of the project moot. It is the best candidate for a "defensibility" project because it addresses the internal stability of the axiom.

  **2. The Commensurability Question (Candidate 1)**
  *   **Rank:** Second (The Foundation)
  *   **Upstream/Downstream:** Strictly upstream. You cannot model a lexical threshold without a model of the scale it sits upon.
  *   **Tractability:** High (given your formal tools). This is a logic and value theory problem. You can use formal axiology to test whether a lexical relation can coexist with a trade-off function below the threshold without contradiction.
  *   **Neglectedness/Impact:** Medium neglectedness, existential impact. If pleasure and pain are incommensurable in a strong sense, LTNU is incoherent. However, much work exists on lexicality and incommensurability (e.g., Chang, Griffin), so you are entering a more crowded room than with Indexing.
  *   **Action-Guiding:** Low direct impact, high theoretical impact. It changes what you can *say* (the formal model) more than what a convinced theorist *does* (assuming the threshold exists).
  *   **Reasoning:** This must be solved early to build your formal model, but it should not be the *entire* dissertation. It is a necessary condition, not a sufficient contribution. Treat this as Chapter 1: setting up the formal space in which Question 1 (Indexing) is solved.

  **3. The Level Question (Candidate 4)**
  *   **Rank:** Third
  *   **Upstream/Downstream:** Downstream of Indexing and Commensurability. You need to know what a "unit" of suffering is before you know if it aggregates to a life or population.
  *   **Tractability:** High. Standard population ethics formalism applies here.
  *   **Neglectedness/Impact:** Medium. This is standard terrain for negative utilitarians.
  *   **Reasoning:** Important for completeness, but secondary. You can stipulate a level (e.g., token experiences) for the sake of the dissertation without settling the general population ethics debate, provided you justify the stipulation.

  **4. The Currency Question (Candidate 3)**
  *   **Rank:** Fourth
  *   **Tractability:** Medium/Low. Without empirical tools, distinguishing "attentional occupancy" from "felt intensity" relies on introspective reports which are notoriously unreliable.
  *   **Reasoning:** This risks becoming a pseudo-empirical project. Unless you can show a *conceptual* distinction that alters verdicts in clear thought experiments, this is phenomenological hair-splitting.

  **5. The Epistemic Question (Candidate 5)**
  *   **Rank:** Fifth (Overrated for your goals)
  *   **Upstream/Downstream:** Downstream. Epistemic access depends on the metaphysical nature of the threshold (Q1 & Q2).
  *   **Tractability:** Low. It is easy to show we lack access; it is hard to show why that matters for *truth*.
  *   **Reasoning:** Your supervisor suggests this is the "live work." I disagree. Making epistemic access the spine accepts the opponent's framing: that the theory is only as good as our ability to calculate it. This leads to a dissertation on decision theory under uncertainty, not axiology. It is a defensive crouch. You should only address this to show that the epistemic difficulty is a feature of any precise axiology, not a bug specific to LTNU.

  ### The Missing Question: Metaphysical Precision (Vagueness)

  You have lumped the "location" of the threshold into the Epistemic Question (Q5). You need to separate the **Epistemic** problem (we can't find the line) from the **Metaphysical** problem (is there a sharp line?).

  *   **Why it matters:** If the threshold is metaphysically vague (no fact of the matter where suffering becomes "lexical"), then LTNU violates the principle of bivalence in value comparisons. This is a stronger objection than mere epistemic opacity.
  *   **Tractability:** High. This is a conceptual analysis of vagueness and value (epistemicism vs. ontic vagueness).
  *   **Integration:** This should be woven into your treatment of **Question 2 (Indexing)**. If the threshold is indexed to a baseline, is the baseline sharp? If not, the lexical priority becomes vague. Solving the indexing problem requires taking a stance on the precision of the baseline.

  ### Hollow or Overrated Flags

  *   **The Epistemic Question (Q5) is Overrated:** As noted, focusing here risks turning your dissertation into a "theory of ignorance." It is a symptom, not the disease. If you prove the axiology is stable (Q1 & Q2), the epistemic objection loses its bite (just as it does for standard utilitarianism).
  *   **The Currency Question (Q3) is Potentially Hollow:** Unless you can demonstrate that "attentional occupancy" and "felt intensity" diverge in cases that *flip* the lexical verdict, this is merely descriptive psychology. Given your lack of empirical tools, this is a trap.

  ### Shifting Factors

  Two kinds of results would reorder this priority list:

  1.  **Formal Impossibility Proof:** If, in the first 6 months, you discover a formal proof that lexical priority is logically incompatible with additive aggregation below the threshold (a stronger version of Q1), the project dies or pivots to non-aggregative models. This would move Q1 from "Foundation" to "Showstopper."
  2.  **Collapse Proof:** If you find that *any* indexing rule that avoids the adaptation counterexamples necessarily replicates the verdicts of standard prioritarianism, then LTNU has no distinct extension. This would move Q2 from "Spine" to "Obituary." You need to test this early.

  ### Recommendation for the Proposal

  If I were in your position, I would build the proposal around **Question 2 (Threshold Indexing)** as the substantive philosophical contribution, supported by **Question 1 (Commensurability)** as the formal framework.

  **The Order of Work:**

  1.  **Months 1–5 (Formal Groundwork):** Settle **Question 1**. Define the value scale. Demonstrate that a lexical threshold is formally coherent with trade-offs below the line. Produce a formal model that allows for a "break point." This satisfies your formal strengths and secures the logical possibility of the view.
  2.  **Months 6–15 (The Substantive Crux):** Tackle **Question 2**. Use the model from Phase 1 to test Fixed vs. Indexed thresholds. Run the adaptation thought experiments. Argue for an indexing rule that preserves the distinctiveness of LTNU without collapsing into prioritarianism. Integrate the **Metaphysical Precision** issue here (arguing that the index is precise enough to ground lexicality).
  3.  **Months 16–30 (Writing/Defense):** Address **Question 5 (Epistemic)** only as a concluding chapter to show that your solution to Q2 mitigates the epistemic worry (e.g., if the threshold is indexed to accessible baseline states, it is more knowable than a fixed cosmic intensity).

  **Why this ordering?**
  It respects your supervisor's demand for rigor (by starting with the formal model) but rejects their suggestion to make epistemology the focus. It positions you to make a novel contribution (Indexing) rather than rehashing the epistemic limitations of consequentialism. It maximizes the use of your armchair strengths while minimizing the risk of getting stuck on empirical questions you cannot answer.

  **Proposal Title Concept:** *The Structure of Suffering: Indexing the Lexical Threshold in Negative Utilitarianism.*

  This signals that you are doing axiology (Structure/Indexing), not just decision theory (Epistemic), and it highlights the specific innovation (Indexing) that will defend the view against collapse.
