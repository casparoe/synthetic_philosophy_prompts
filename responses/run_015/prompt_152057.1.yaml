      *   *Modern Stoicism (Revivalist):* The goal is often resilience, mental health, effectiveness. The dichotomy is a tool. "Preferred indifferents" are treated more like actual goals. The "reserve clause" (*hupexairesis*) is used to mitigate disappointment, not necessarily to eliminate desire for the external.
      *   *The "Meaning-Frame" Loophole:* The user is sharp here. If I say "I didn't get the job, but I control how I view it," am I truly indifferent to the job? Or am I just managing the pain of not getting it so I can pursue the next one? Ancient Stoics would say if you feel *disappointment*, you valued the external. Modern Stoics say if you don't feel *devastation*, you're doing it right.

