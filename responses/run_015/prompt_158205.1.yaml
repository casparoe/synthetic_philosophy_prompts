  2. The Residue Report (approximately 350 words). Identify which elements of the path-dependence debate translate cleanly, which translate only with distortion, and which have no counterpart in the target vocabulary. In particular, address whether social increasing returns survive as anything more than reward-function design choices, whether historical contingency can be expressed without importing modal or causal vocabulary absent from MDPs, and what becomes of the claim that an outcome was never going to occur.

