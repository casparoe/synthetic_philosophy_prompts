  1. The Translation

  To translate the debate, we model history as a trajectory through a Markov Decision Process (MDP). The state space represents socio-technical configurations, such as keyboard layouts, while actions represent collective adoption choices. The policy represents the decision-making heuristic of society. The convergence camp argues for an ergodic MDP where the reward function reflects fundamental economic efficiency. Here, policy gradient methods reliably locate the global optimum regardless of initialisation noise. Early stochasticity in action selection, analogous to $\epsilon$-greedy exploration, does not alter the final convergence. The value function landscape is sufficiently convex that any local optima are shallow or transient, allowing the agent to escape via standard exploration strategies. Thus, the observed historical outcome is inevitable given the underlying reward structure. The Q-function converges to a unique solution, implying that alternative historical paths would have collapsed onto the same equilibrium. The market acts as a robust optimiser, smoothing over early accidents. The exploration-exploitation trade-off is resolved in favour of the true global maximum.

  Conversely, the path-dependence camp posits a non-ergodic system characterised by broken symmetry. Here, 'increasing returns' are modelled as non-stationary reward dynamics or history-dependent transition costs. Specifically, the reward function $R(s, a)$ is not fixed but scales with the visitation frequency of state $s$, creating positive feedback loops. Early exploration noise locks the policy into a specific basin of attraction. This results in a local optimum where the cost to explore alternative states (switching costs) exceeds the expected value of the global optimum. The system becomes trapped in a suboptimal equilibrium because the transition dynamics effectively change to penalise deviation from the established path. The distortion here is explicit: standard MDPs assume stationary dynamics, whereas path dependence requires augmenting the state space to include full history or accepting non-Markovian rewards. Furthermore, while RL assumes a defined reward signal, the historical debate often concerns whether the observed outcome maximises social welfare at all, implying the reward function itself is contested. The convergence argument assumes the market reveals the true reward function, whereas the path-dependence argument suggests the observed reward is merely a local artifact of the trajectory, masking the true global maximum.

  2. The Residue Report

  Several elements translate cleanly. The concept of a 'local optimum' maps precisely to a suboptimal equilibrium where policy gradients vanish despite better states existing elsewhere. 'Switching costs' are perfectly represented as high negative rewards on transitions away from the current basin. However, significant residue remains. Social increasing returns do not survive merely as reward-function design choices; in history, they are emergent properties of agent interaction, whereas in RL, they are typically engineered into the environment. Treating them as fixed reward shaping ignores the endogenous nature of historical feedback. In RL, the environment is distinct from the agent; in history, the agents constitute the environment, creating a reflexive loop that standard MDPs do not capture. The debate over whether QWERTY was inefficient is fundamentally a debate over the true reward function, which RL takes as given.

  Furthermore, historical contingency carries modal weight—claims about what 'could have' occurred—that MDPs struggle to capture without importing external causal vocabulary. In RL, counterfactuals are simulated rollouts based on fixed transition probabilities. In history, contingency implies the transition matrix itself might have been different under negligible perturbations. The claim that an outcome was 'never going to occur' translates poorly. In an MDP, any state with non-zero transition probability is possible given infinite time. Historical inevitability claims often rely on structural impossibilities not captured by probabilistic transitions. Finally, the Markov assumption is a major distortion. Path dependence implies history matters intrinsically, not just insofar as it is encoded in the current state. To model this faithfully, the state space must expand to include the entire trajectory, rendering the MDP computationally intractable and conceptually distinct from standard RL formulations. The debate often hinges on whether the state space is compressible, a question RL formalisms take as given. The normative content of 'efficiency' is also lost; RL optimises for reward, but history debates what reward ought to be.

  3. The Verdict

  The untranslatable residue suggests limitations in both frameworks. RL reveals that the philosophical debate is often less well-defined than it appears, specifically regarding the definition of the reward function (social welfare) and the ergodicity of the system. However, RL cannot capture the normative ambiguity of historical efficiency. The introduction of ergodicity breaking bridges the gap effectively rather than obscuring it. In statistical mechanics, ergodicity breaking denotes systems where time averages fail to match ensemble averages due to disconnected state spaces. Applying this to history formalises 'lock-in' as entry into a disconnected component of the state space from which return is impossible. This clarifies that path dependence is not merely about high costs, but about topological separation in the configuration space. It transforms a vague historical intuition into a precise mathematical condition regarding reachability. Ultimately, RL strips the debate of its narrative fog, exposing it as a dispute over system dynamics and reward definitions, but it cannot resolve the normative question of whether the locked-in outcome was truly 'bad' without an agreed-upon reward signal. The framework excels at describing mechanics but fails to adjudicate value, leaving the core philosophical disagreement about welfare intact. It shows the debate is structural, not merely narrative.
