answer: |-
  # Q&A Prep Sheet: Population Ethics at Infinity
  **Thesis Core:** RC is a finite artifact; infinite sums are indeterminate; Dominance fails due to disconnected world-space; standard axioms are incoherent at infinity.
  **Audience:** Consequentialist Population Ethicists (Majority), Decision Theorists (2), Philosopher of Mathematics (1).

  ---

  ## 1. Strategic Concessions (Grant These Up Front)
  *Do not fight these. Granting them builds credibility and isolates the debate to your core thesis.*

  *   **Concede that Infinity Breaks the Total View:** Acknowledge immediately that classical Total Utilitarianism is mathematically ill-defined at infinite cardinalities without additional structure (e.g., discounting, overtaking criteria). Do not try to save the Total View; your thesis is that RC dissolves *because* the Total View breaks.
  *   **Concede that Impossibility Theorems Apply:** Acknowledge Basu-Mitra (1970) or Zame (2007). Agree that you cannot have Completeness, Continuity, and Strong Pareto simultaneously in infinite settings. Your claim is not that a perfect theory exists, but that RC specifically relies on the *finite* application of these axioms.
  *   **Concede Action-Guidance is Limited:** Admit to the decision theorists that your framework does not yield a complete ordering of all possible worlds. It yields a partial order with "gaps."

  ## 2. Lines to Hold (Do Not Concede)
  *If you yield on these, your thesis collapses into "Infinity is hard, let's talk about something else."*

  *   **Hold that RC is Specifically Finite:** Do not allow the audience to rephrase RC as an infinite problem. If they describe an infinite RC (e.g., "A very large finite population vs. an infinite population of low welfare"), argue that this is a *different* paradox (e.g., the "Very Repugnant Conclusion" or issues of lexicality), not the standard RC which relies on comparing two *finite* totals where one is larger but lower quality.
  *   **Hold that "Disconnectedness" is Ontological, Not Epistemic:** When pressed on whether we can "reach" one world from another, maintain that the space of infinite worlds is not a metric space where finite steps bridge the gap. It is not that we *can't* walk the path; it's that the path *does not exist* in the topology of the value space.
  *   **Hold that Incoherence is the Solution, Not the Problem:** The audience will treat the inconsistency of axioms as a failure of your theory. You must maintain that the inconsistency reveals the *concepts* (RC/Dominance) are category errors at infinity, not that your theory is broken.

  ---

  ## 3. Anticipated Objections (In Order of Likelihood)

  ### Objection 1: The "Spectrum Argument" (Population Ethicist)
  **Phrasing:** "You claim the space of worlds is disconnected, preventing the dominance reasoning that drives the Repugnant Conclusion. But consider a spectrum argument: Start with World A (high welfare). Make a tiny change to get A1, then A2... through a continuum of changes to World Z (low welfare, huge population). If you accept that each step is not worse than the last (or is better), transitivity forces you to accept Z is not worse than A. Your 'disconnectedness' claim just denies the possibility of this spectrum, which seems like an ad hoc way to block the conclusion."
  *   **Seriousness:** **High.** This attacks the core mechanism of your "disconnectedness" claim.
  *   **2-Minute Reply:** "The spectrum argument assumes **Continuity** or **Separability** across the sequence. In finite cases, A to Z is a finite chain of dominance comparisons. In infinite cases, the 'steps' between worlds often involve changing the welfare of an infinite subset of people. A 'tiny change' in an infinite world isn't topologically small in the same way. I'm not denying the spectrum; I'm denying that the *value relation* is continuous over that spectrum. The dominance principle requires a finite chain of improvements. If the chain requires infinite steps to bridge the gap between A and Z, Dominance doesn't apply."
  *   **Soft Spot:** They will push on **Transitivity**. If A > A1 and A1 > A2... does A > Z? If you say "No," you are rejecting Transitivity, which is a massive bullet to bite. If you say "Yes," you restore the Repugnant Conclusion.
      *   *Prep:* Be ready to say: "Transitivity holds for *comparable* worlds. My claim is that A and Z are *incomparable* because no finite chain links them. Transitivity doesn't force a relation where the domain of the relation doesn't exist."

  ### Objection 2: The "Decision Paralysis" Objection (Decision Theorist)
  **Phrasing:** "You say the sums are indeterminate and the dominance principle is undefined. Fine. But I have to make a policy decision *now* that affects future generations potentially ad infinitum. If your theory says the comparison is undefined, you are offering no action guidance. Is your solution to the Repugnant Conclusion simply that we should be paralyzed when facing infinite stakes? That seems like a pragmatic failure, even if mathematically consistent."
  *   **Seriousness:** **Medium.** It doesn't refute your thesis, but it makes it practically useless.
  *   **2-Minute Reply:** "It's not paralysis; it's a restriction on the domain of applicability. Just as Newtonian physics breaks down at the singularity, classical population ethics breaks down at infinity. This doesn't mean we can't act; it means we cannot use *Total Welfare Maximization* as the decision rule in these specific cases. We must rely on local dominance or heuristic constraints. The Repugnant Conclusion is supposed to be a *theoretical* refutation of Total Views. Showing that the Total View yields 'undefined' rather than 'Repugnant' is a theoretical success, even if it leaves some practical questions open."
  *   **Soft Spot:** They will ask for an **Alternative Decision Rule**. If you say "use local dominance," they will construct a case where local dominance leads to a money pump or a cycle in infinite settings.
      *   *Prep:* Do not propose a full alternative theory. Say: "My project is diagnostic, not constructive. I am showing why the RC objection fails, not providing a full infinite ethics."

  ### Objection 3: The "Sadistic Conclusion" Swap (Population Ethicist)
  **Phrasing:** "If you block the Repugnant Conclusion by rejecting the Total View and Dominance at infinity, what happens to the Sadistic Conclusion? Usually, avoiding the RC forces you into the Sadistic Conclusion (that it's better to add lives with negative welfare than lives with positive welfare). If your axioms are incoherent at infinity, do you avoid the Sadistic Conclusion too? Or does your solution just swap one bullet for another?"
  *   **Seriousness:** **Medium-High.** Shows you haven't solved the *family* of problems, just one member.
  *   **2-Minute Reply:** "The Sadistic Conclusion, like the RC, relies on aggregating welfare across populations to make a comparison. If the aggregation function is undefined for infinite populations, the Sadistic Conclusion also fails to get off the ground. The 'problem' isn't that we get a repugnant answer; it's that the question 'Which world is better?' lacks a truth value in these specific infinite configurations. This is preferable to accepting a repugnant truth value."
  *   **Soft Spot:** They will argue that **Negative Welfare** is easier to define than Positive Welfare at infinity (e.g., avoiding suffering is a constraint, not a sum).
      *   *Prep:* Distinguish between *minimizing suffering* (which might still be well-defined) and *comparing total value* (which is not).

  ### Objection 4: The "Hyperreal/Non-Standard" Objection (Philosopher of Mathematics)
  **Phrasing:** "You claim the sums are indeterminate. But that depends on the number system. If we use hyperreal utilities or a specific summation method (like Banach limits or overtaking criteria), we *can* define these sums. You are assuming standard real analysis. Why privilege the standard reals? If we can mathematically define the sum, your 'indeterminacy' claim vanishes, and the RC returns."
  *   **Seriousness:** **High.** This attacks the mathematical foundation of your "undefined" claim.
  *   **2-Minute Reply:** "Using hyperreals or Banach limits introduces new axioms (e.g., specific ordering of the infinite, reliance on the Axiom of Choice). These mathematical tools are not normatively neutral. Choosing a specific summation method *is* making an ethical commitment about how to weigh the infinite tail. My claim is that *without* importing those specific, controversial mathematical structures, the ethical intuition of 'Total Welfare' is undefined. You can save the math, but only by abandoning the ethical neutrality of the Total View."
  *   **Soft Spot:** They will press that **Ethics Requires Precision**. If we *can* define it mathematically, we *should*, to avoid arbitrariness.
      *   *Prep:* Argue that "arbitrariness in the math" (choosing a Banach limit) is better than "absurdity in the ethics" (accepting RC).

  ### Objection 5: The "Finite Approximation" Objection (Population Ethicist)
  **Phrasing:** "We are finite beings. We will never actually create an infinite population. The Repugnant Conclusion is compelling because it applies to very large *finite* numbers. Even if your thesis holds for actual infinity, doesn't the RC still hold for the finite cases that approximate it? If the logic holds for N=10^100, why does it magically break at N=Infinity? Isn't the discontinuity itself the problem?"
  *   **Seriousness:** **Medium.** It limits the scope of your thesis to a niche case.
  *   **2-Minute Reply:** "The RC is often presented as a limit argument: as N goes to infinity, the conclusion becomes inevitable. I am arguing that the limit does not exist. The behavior of the function at N=10^100 is not the same as the behavior at N=Infinity. If the axioms become incoherent at the limit, we cannot use the limit to justify the intuition at large finite numbers. It suggests our intuition about large finite numbers is relying on a principle that is fundamentally flawed."
  *   **Soft Spot:** This is the **Continuity of Intuition** problem. It is hard to argue that ethics changes discontinuously at infinity.
      *   *Prep:* Lean on the Phil of Math's support here: Mathematical properties *do* change discontinuously at infinity (e.g., Hilbert's Hotel). Ethics might too.

  ---

  ## 4. The Nightmare Question
  **The Question:** (Likely from a Decision Theorist or a sharp Pop Ethicist)
  "You argue that Dominance fails because worlds are disconnected. But Dominance is a *local* principle: If World W1 is identical to W2 except for a finite set of people who are better off in W1, then W1 is better than W2. You don't need to 'reach' Z from A to apply Dominance. You just need to compare two specific worlds. If you deny Dominance for *any* pair of infinite worlds where one is a finite improvement on the other, you are rejecting the Pareto Principle. If you accept Pareto for finite improvements but deny it creates a chain, you are violating Transitivity. **So, are you rejecting Pareto, or are you rejecting Transitivity? Which one is it?**"

  *   **Why it's damaging:** It forces you to choose between two core axioms of rational choice.
      *   If you reject **Pareto/Dominance**: You lose the "engine" of consequentialism. You can't say making someone better off makes the world better.
      *   If you reject **Transitivity**: You open yourself to money pumps and irrationality charges.
      *   Your thesis tries to say "Dominance doesn't apply." This question forces you to admit that means "Dominance is false" in these cases.
  *   **How to Parry:** "I am rejecting the **universal applicability** of Dominance, not the principle itself. Dominance is well-defined on *connected* components of the world-space. In infinite settings, two worlds that differ by a finite set may still belong to different components due to the background infinite structure (e.g., permutation issues). I am not rejecting Transitivity; I am restricting the domain of the Better-Than relation. It is not a complete order. It is a partial order where some pairs are incomparable. Pareto holds *where the comparison is defined*."
  *   **Risk:** They will reply: "If the comparison is undefined, you can't choose. If you can't choose, you can't act. You haven't solved the paradox; you've just declared the decision problem ill-posed."
      *   *Counter:* "Exactly. The Repugnant Conclusion assumes the decision problem *is* well-posed and yields a repugnant answer. I am showing the problem itself is ill-posed. That dissolves the conclusion." (This is your last stand. Hold it firmly.)

  ---

  ## 5. General Q&A Tactics for This Room
  *   **Don't Math-Jargon the Ethicists:** When talking to the population ethicists, keep the math intuitive (e.g., "gaps in the value space" rather than "non-Archimedean fields").
  *   **Do Math-Jargon the Decision Theorists:** When talking to the two decision theorists, use their language (e.g., "partial orders," "domain restrictions," "well-posedness").
  *   **Use the Phil of Math:** If the Phil of Math asks a technical question about coherence, lean on them. "As [Name] might agree, the coherence of ZFC in this context..." (Check beforehand if they actually agree, but generally, aligning with the skeptic on math helps against the ethicists).
  *   **Watch for "Bait and Switch":** If an ethicist tries to move the discussion back to finite cases ("But what about 1 billion people?"), gently pivot back: "That's a crucial question, but my thesis is specifically about the *infinite* limit case and what it reveals about the axioms. Let's keep the focus on the infinite case for this workshop."
