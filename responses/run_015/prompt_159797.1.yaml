prompt: |-
  I'm a second-year undergraduate taking a large world-history survey this term — the first third is big-history framing in the style of Harari, the middle is Diamond, and the last third is Graeber and Wengrow's *The Dawn of Everything* plus the archaeologists and historians who attack the whole genre — and I also work as a peer writing tutor in the writing centre attached to the course. Almost every week I sit down with a paper or a magazine pitch built on one enormous causal claim: that farming made inequality possible, that the orientation of the continental axes decided who conquered whom, that writing (or money, or organized religion) was the technology that finally let strangers cooperate at scale, that domestication domesticated us in turn. My difficulty is not that these claims are unfamiliar to me. It is that I have no repeatable way of separating the ones that can bear weight from the ones that are retrospective stories with a confident voice, and I cannot adjudicate them on area knowledge, because I am a sophomore, my students are mostly freshmen, and neither of us can go and check the archaeological record.

  What I want is a review procedure I can actually run in about twenty minutes, alongside a student with their draft, with no library access and without pretending to an expertise I do not have. It should: (a) translate whatever the critics of grand narratives have actually established — the difference between a mechanism that would have predicted the pattern in advance and one fitted to it afterwards, level-of-analysis slippage between individuals and populations, chains advertised as one cause that are really long conjunctions of necessary conditions, teleological and stage-of-progress phrasing, outcome selection, the way a comparative sample gets built — into an ordered set of tests; (b) say what counts as passing each one, so that "this is monocausal" or "this is a just-so story" is a verdict with criteria rather than a vibe; (c) name the point at which the procedure returns "not established by this argument" and stops, as opposed to "false," since that distinction matters when the output is a comment on someone's grade-relevant work; and (d) flag the questions it has to hand back to a person because they are interpretive or evaluative rather than evidentiary — for instance whether "worse off" in a claim about the Neolithic is being measured over the lived experience of individuals or over the persistence and spread of populations, or how much weight one well-excavated counterexample should carry against a large-scale comparative trend. Please also be explicit about where the procedure will misfire: the kinds of genuinely well-supported claims it will ding, and the kinds of empty claims it will wave through.

  Then run it, in front of me, on three claims that came in this month. (1) "The Neolithic transition was a trap that no one chose: per person, early farmers worked longer hours for a narrower diet and more infectious disease than the foragers they replaced, and by the time the costs were visible the population depended on the crops and could not go back, so the whole shift was a catastrophe dressed up as progress." (2) "Inequality is a product of agriculture. Foragers were egalitarian because meat and gathered food cannot be stored or defended; once grain could be stored, some households could accumulate and the rest had to submit — which is why every state we know of rests on a farming base." (3) A claim from a paper I personally like and would be sorry to see rejected: "Grand narratives are self-undermining: the comparative method that lets us generalize about the whole human past is also what shows that the past contains no natural experiment clean enough to support such generalizations, so the genre's honest conclusion is that it cannot deliver what it promises." I would like to see what the procedure returns for each, including if it tells me to give up (3) — and since I have to defend any comment in two sentences to the student who wrote the paper, and the instructor signs off on anything that touches a grade, please keep the language at a level I can say out loud in a tutorial.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Second-year undergraduate, peer writing tutor in a world-history survey course.
      *   **Context:** Course covers Big History (Harari), Diamond, then Graeber/Wengrow + critics.
      *   **Problem:** Students (and the user) encounter enormous causal claims (monocausal, grand narratives). The user needs a way to evaluate these claims without area expertise or library access, in ~20 minutes, during a tutoring session.
      *   **Goal:** A review procedure (checklist/test) that translates methodological critiques (mechanism vs. fit, level of analysis, teleology, etc.) into actionable steps.
      *   **Requirements:**
          *   (a) Translate critiques into an ordered set of tests.
          *   (b) Define pass/fail criteria (not just a "vibe").
          *   (c) Distinguish "not established" vs. "false."
          *   (d) Flag interpretive/evaluative questions to return to the student.
          *   (e) Explicitly state limitations (false positives/negatives).
          *   (f) Run the procedure on three specific claims provided.
          *   (g) Keep language tutorial-appropriate (spoken, defensible in two sentences).

  2.  **Deconstruct the Methodological Critiques:**
      *   *Mechanism vs. Fit:* Does the argument explain *how* it happened, or just match the outcome? (Prediction vs. Post-diction).
      *   *Level of Analysis:* Is it talking about individuals, groups, or populations? (Slippage).
      *   *Monocausality vs. Conjunction:* Is it one thing or a chain of necessary conditions?
      *   *Teleology/Progress:* Does it assume a direction or end-goal?
      *   *Outcome Selection:* Did they pick the winner and ignore the losers?
      *   *Comparative Sample:* How was the data gathered? (Survivorship bias).

  3.  **Drafting the Procedure (The "20-Minute Causal Stress Test"):**
      *   *Constraint:* Must be doable without Google/JSTOR. Must rely on the text + logic.
      *   *Structure:* 5 Steps.
      *   *Step 1: The "Because" Check (Mechanism).* Is there a how, or just a before/after?
      *   *Step 2: The "Who" Check (Level of Analysis).* Are we talking about people or populations?
      *   *Step 3: The "Only" Check (Monocausality).* Is it the *only* factor?
      *   *Step 4: The "Arrow" Check (Teleology).* Does it assume progress?
      *   *Step 5: The "Exception" Check (Counter-evidence).* Does the author acknowledge things that don't fit?
      *   *Verdicts:* Pass, Fail (Not Established), Flag (Interpretive).
      *   *Limitations:* Acknowledge where this heuristic fails (e.g., well-supported but complex claims might look "weak" on mechanism in a short draft).

  4.  **Refining the Criteria (Meeting Requirements a-d):**
      *   *Pass:* Clear mechanism, consistent units, acknowledges complexity, no inevitable progress.
      *   *Not Established:* Mechanism is vague, ignores counter-examples, slips levels.
      *   *False:* (Avoid this). The procedure shouldn't declare truth, only argumentative strength.
      *   *Interpretive Flags:* Definitions of "better/worse," weight of counter-examples.

  5.  **Running the Procedure on the Three Claims:**

      *   *Claim 1 (Neolithic Trap):* "The Neolithic transition was a trap... catastrophe dressed up as progress."
          *   *Mechanism:* Population dependency (lock-in). Good.
          *   *Level:* Per person vs. Population. Slippage risk.
          *   *Teleology:* "Dressed up as progress" implies a critique of progress narratives.
          *   *Verdict:* Plausible but needs nuance on "choice."
      *   *Claim 2 (Inequality & Ag):* "Inequality is a product of agriculture... Foragers were egalitarian... grain could be stored."
          *   *Mechanism:* Storage -> Accumulation -> Submission.
          *   *Level:* Households vs. States.
          *   *Exception:* Hunter-gatherer inequality (Pacific NW)? Early states without grain?
          *   *Verdict:* High risk of "Not Established" due to monocausality and ignored counter-examples (Graeber/Wengrow territory).
      *   *Claim 3 (Meta-Claim):* "Grand narratives are self-undermining... comparative method... shows no natural experiment clean enough..."
          *   *Mechanism:* Logical paradox.
          *   *Level:* Methodology.
          *   *Verdict:* This is a methodological claim, not a historical causal claim. The test might misfire here. It needs a specific "Meta" adjustment.

  6.  **Developing the "Tutorial Script" (Requirement g):**
      *   Needs to be conversational.
      *   Needs to be defensible to an instructor.
      *   "I'm not saying you're wrong, I'm saying the argument needs to handle X."

  7.  **Addressing Limitations (Requirement e):**
      *   What does it miss? (Archaeological nuance, recent data).
      *   What does it falsely ding? (Strong claims that are just briefly stated).

  8.  **Review and Refine:**
      *   *Tone:* Academic but accessible. Respectful of the user's position (sophomore tutor).
      *   *Check:* Did I include the "Not Established" vs "False" distinction? Yes.
      *   *Check:* Did I flag interpretive questions? Yes.
      *   *Check:* Is the procedure under 20 mins? Yes, 5 steps.
      *   *Check:* Are the three claims analyzed? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't validate Claim 2 too easily, given the course context (Graeber/Wengrow explicitly attack this). The procedure needs to catch the "Foragers were egalitarian" generalization as a potential "Outcome Selection" or "Sample Bias" failure.
      *(Self-Correction on Claim 3)*: Claim 3 is a methodological critique *of* the procedure I'm building. I need to be careful not to say it "fails" the test, but rather that the test categorizes it differently. It's a claim about the *limits of evidence*, not a causal claim about history. I should note that the procedure is designed for historical causal claims, so Claim 3 requires a slight pivot.

      *(Refining the "Verdict" language)*: Instead of "Pass/Fail," use "Argumentatively Secure," "Needs Reinforcement," or "Methodologically Risky." Actually, the prompt asks for "Not Established" vs "False." I will stick to "Argumentatively Supported" vs "Not Established by this text."

      *(Final Polish)*: Ensure the "Two-Sentence Defense" is included for each claim analysis.

  9.  **Final Output Structure:**
      *   Introduction (Acknowledging the difficulty).
      *   The Procedure (The "Causal Stress Test").
      *   Limitations (Where it misfires).
      *   Application to Claim 1.
      *   Application to Claim 2.
      *   Application to Claim 3.
      *   Closing advice.

      *(Wait, one more check)*: The prompt asks for "what counts as passing each one." I need to make sure the criteria are explicit in the procedure section.
      *(Also)*: "Flag the questions it has to hand back to a person." I need a specific section or marker for this in the procedure.

      *Let's build the "Causal Stress Test" with specific Pass/Flag criteria.*

      *Step 1: Mechanism.* Pass = Describes a process. Flag = "Why" is answered with "Because it happened."
      *Step 2: Units.* Pass = Consistent (individual vs group). Flag = Slippage.
      *Step 3: Necessity/Sufficiency.* Pass = Acknowledges other factors. Flag = "The" cause.
      *Step 4: Teleology.* Pass = Contingent. Flag = Inevitable.
      *Step 5: Counter-examples.* Pass = Acknowledged/Explained. Flag = Ignored.

      *Okay, ready to write.*
answer: |-
  Here is a review procedure designed for your constraints: no library access, limited expertise, twenty-minute window, and a need for defensibility. It is called the **Causal Stress Test**.

  Following the procedure, I have listed its known failure modes, and then run it on your three claims.

  ### The Causal Stress Test (20 Minutes)

  **Instructions:** Read the student's central thesis and the two paragraphs supporting it. Do not check facts. Check the *structure* of the argument.

  **Step 1: The Mechanism Check (How vs. That)**
  *   **Test:** Does the argument explain *how* Cause A produced Effect B, or does it just note that B followed A?
  *   **Pass:** The text describes a process (e.g., "Grain storage allowed *accumulation*, which created *leverage*, which forced *submission*").
  *   **Fail (Not Established):** The text asserts a link without a bridge (e.g., "Farming happened, and then inequality existed").
  *   **Flag for Student:** "Is this mechanism something that would have been visible to an observer at the time, or does it only make sense looking backward?"

  **Step 2: The Unit Check (Who is acting?)**
  *   **Test:** Identify the unit of analysis in the cause and the effect. Are they the same?
  *   **Pass:** Consistent units (e.g., "Households accumulated" → "Households became unequal" OR "Populations grew" → "States emerged").
  *   **Fail (Not Established):** Level slippage (e.g., "Individuals wanted security" → "States formed"). Individuals do not build states; populations do.
  *   **Flag for Student:** "When you say 'we' or 'society,' do you mean the average person's experience or the group's survival rate? These can contradict each other."

  **Step 3: The 'The' Check (Monocausality)**
  *   **Test:** Circle the definite articles before causal nouns (e.g., "*The* cause," "*The* transition").
  *   **Pass:** The argument allows for contributory factors or treats the cause as a trigger within a context (e.g., "Farming made inequality *possible*").
  *   **Fail (Not Established):** The argument treats a necessary condition as a sufficient one (e.g., "Farming *made* inequality").
  *   **Flag for Student:** "If this cause existed but the effect didn't happen, what else was missing?"

  **Step 4: The Arrow Check (Teleology)**
  *   **Test:** Look for verbs implying intent or directionality in non-human systems.
  *   **Pass:** Contingent language (e.g., "allowed," "facilitated," "coincided").
  *   **Fail (Not Established):** Teleological language (e.g., "demanded," "required," "led inevitably to," "progress").
  *   **Flag for Student:** "Does this argument assume the outcome was the goal? If the outcome had been different, would the cause still have been 'good'?"

  **Step 5: The Exception Check (Sample Bias)**
  *   **Test:** Ask the student: "What would prove this wrong?"
  *   **Pass:** They can name a counter-example and explain why it doesn't break the rule (e.g., "Some foragers were unequal, but they relied on aquatic resources, not grain").
  *   **Fail (Not Established):** They claim no counter-examples exist, or dismiss them as anomalies without evidence.
  *   **Flag for Student:** "How much weight should one well-excavated counter-example carry against your large-scale trend? Is this a rule or a tendency?"

  **Verdict Protocol:**
  *   **Argumentatively Secure:** Passes 1, 2, and 5. (3 and 4 are common in student writing; if they fail these but acknowledge the limitation, they still pass).
  *   **Not Established:** Fails 1 or 5. (The logic does not support the weight of the claim).
  *   **Do Not Mark "False":** This test measures argumentative structure, not historical truth. If a claim fails, the comment is "This claim is not supported by the logic provided," not "This is wrong."

  ***

  ### Known Failure Modes (Where the Test Misfires)

  1.  **False Negatives (Good claims it dings):**
      *   **The "Common Knowledge" Trap:** If a mechanism is so well-established in the field (e.g., "germs spread in cities") that the student doesn't explain it, Step 1 will fail them. *Fix:* Allow "standard disciplinary mechanisms" if the student cites the course reading.
      *   **The "Meta" Claim:** This test is designed for historical causal claims. It struggles with methodological critiques (like Claim 3 below) because the "mechanism" is logic, not history.
  2.  **False Positives (Bad claims it waves through):**
      *   **The "Plausible Story":** A student can invent a mechanism that sounds logical but is historically nonsense (e.g., "Warriors needed grain for energy"). Step 1 passes this because there *is* a mechanism, even if it's wrong. *Fix:* Remind students this test checks *coherence*, not *accuracy*.
      *   **The "Hedge":** A student can pass Step 3 by adding "mostly" or "often" to a monocausal claim without actually engaging with the complexity.

  ***

  ### Running the Test on Your Three Claims

  Here is how you apply the test in the tutorial, including the "Two-Sentence Defense" you can use with the student or instructor.

  #### Claim 1: The Neolithic Trap
  *"The Neolithic transition was a trap that no one chose: per person, early farmers worked longer hours for a narrower diet and more infectious disease than the foragers they replaced, and by the time the costs were visible the population depended on the crops and could not go back, so the whole shift was a catastrophe dressed up as progress."*

  *   **Step 1 (Mechanism):** **Pass.** The mechanism is "population dependency" (lock-in). It explains *why* they couldn't go back.
  *   **Step 2 (Unit):** **Flag.** Slippage between "per person" (individual welfare) and "population depended" (group survival). The argument admits this tension, but it needs to be explicit.
  *   **Step 3 (The):** **Pass.** It frames it as a "trap," implying structural constraint rather than simple causation.
  *   **Step 4 (Arrow):** **Pass.** It explicitly critiques the "progress" narrative.
  *   **Step 5 (Exception):** **Not Established.** The draft likely assumes *all* transitions were traps. It needs to acknowledge groups that did go back or mixed economies.
  *   **Verdict:** **Argumentatively Secure, with a Flag.**
  *   **Tutorial Script:** "Your mechanism for the 'trap' is clear, but you are mixing two different measures of success: individual health and population growth. You need to clarify if you're arguing farming was bad for *people* or good for *genes*, because your evidence supports both."
  *   **Two-Sentence Defense:** "The argument establishes a clear causal mechanism for the 'trap,' but it conflates individual welfare with population persistence. I am asking the student to distinguish these to avoid a logical contradiction."

  #### Claim 2: Inequality & Agriculture
  *"Inequality is a product of agriculture. Foragers were egalitarian because meat and gathered food cannot be stored or defended; once grain could be stored, some households could accumulate and the rest had to submit — which is why every state we know of rests on a farming base."*

  *   **Step 1 (Mechanism):** **Pass.** Storage → Accumulation → Submission. This is a clear chain.
  *   **Step 2 (Unit):** **Pass.** Moves from Households to States consistently.
  *   **Step 3 (The):** **Fail (Not Established).** "Inequality is *a* product" would pass. "Inequality is *the* product" (implied by "is a product of") ignores non-agricultural inequality (e.g., Pacific Northwest foragers).
  *   **Step 4 (Arrow):** **Flag.** "Had to submit" implies inevitability.
  *   **Step 5 (Exception):** **Fail (Not Established).** "Every state we know of" is a universal claim that ignores counter-examples (e.g., early states based on tribute rather than grain, or egalitarian farming societies). Given your course reads Graeber/Wengrow, this is a high-risk claim.
  *   **Verdict:** **Not Established.**
  *   **Tutorial Script:** "You have a strong story about how grain *allows* inequality, but you are claiming it is the *only* source. Since we've read about complex foragers who had inequality without grain, you need to change 'is a product' to 'is often a product' or explain those exceptions."
  *   **Two-Sentence Defense:** "The argument treats a sufficient condition (storage) as a necessary one, ignoring documented cases of forager inequality. I am asking the student to qualify the claim to match the comparative evidence discussed in class."

  #### Claim 3: The Meta-Claim
  *"Grand narratives are self-undermining: the comparative method that lets us generalize about the whole human past is also what shows that the past contains no natural experiment clean enough to support such generalizations, so the genre's honest conclusion is that it cannot deliver what it promises."*

  *   **Step 1 (Mechanism):** **Pass.** The mechanism is logical contradiction (Method X reveals Flaw Y in Method X).
  *   **Step 2 (Unit):** **Pass.** The unit is "the genre" or "the method."
  *   **Step 3 (The):** **Pass.** It is a claim about limits, not a causal claim about history.
  *   **Step 4 (Arrow):** **Pass.** It argues against a specific teleology (progress of knowledge).
  *   **Step 5 (Exception):** **Flag.** This is the tricky one. If the student uses a grand narrative to prove grand narratives are impossible, is that an exception?
  *   **Verdict:** **Argumentatively Secure (with a Meta-Warning).** The Stress Test is designed for historical claims, not methodological ones, so Step 5 is less relevant. However, the logic holds together.
  *   **Tutorial Script:** "This is a methodological claim, not a historical one, so the usual rules about evidence apply differently. Your logic is consistent, but you need to ensure you aren't using a grand narrative to prove grand narratives are impossible, which would be performative contradiction."
  *   **Two-Sentence Defense:** "The argument is logically coherent but operates at a methodological level rather than a historical one. I am asking the student to ensure their own paper doesn't contradict its thesis by making the very generalizations it critiques."

  ### Summary for Your Practice
  *   **Claim 1:** Good logic, watch the definition of "worse off."
  *   **Claim 2:** Too strong. Needs qualification (Diamond vs. Graeber tension).
  *   **Claim 3:** Logically sound, but watch for performative contradiction.

  This procedure allows you to grade the *argument's construction* without grading the *history*, which protects you from needing expertise you don't have while still enforcing the critical thinking skills the course demands.
