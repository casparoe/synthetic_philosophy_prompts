  SUBJECT: Draft Decision Memo for Vote on the 14th

  **Recommendation**

  Recommend approval of the Neural Systems Group proposal, contingent upon significant revision of the continuity clause and implementation of enhanced monitoring safeguards. The fatal nature of the target pathology necessitates offering this intervention, yet the epistemic uncertainty regarding identity preservation prohibits unconditional consent. We must proceed, but cautiously. This decision should be revisited immediately following the completion of the first participant's fifty-percent milestone. At that juncture, the panel must review divergent behavioral data and any instances of refused continuation before authorizing further enrolment. Approval now is not an endorsement of the protocol as written, but a provisional license to proceed under strict supervision. We cannot allow the urgency of the disease to obscure the metaphysical risks, nor can we allow philosophical hesitation to withhold potential survival. The conditional approval balances the duty to treat against the duty to do no harm to the self.

  **The Procedure As Proposed**

  Six participants with fatal prion disease will undergo cortical neuron replacement via neuromorphic units over twenty months. Replacement occurs in batches at ten-percent milestones, separated by two-week calibration pauses. The order of replacement is randomized, acknowledging that trajectory influences the final emergent state; modelling predicts end-state divergence. The consent protocol includes a continuity clause modelled on a Ulysses contract. Participants reaffirm consent at each checkpoint. However, refusal to continue is presumed to be an artefact of the replacement process and will be overridden, unless an independent assessor determines the participant articulates a value change they can endorse on reflection. This clause prevents transient procedural distress from halting a life-saving intervention.

  **Why Gradualness Is Carrying the Weight**

  The ethical viability of this proposal rests entirely on the assumption that gradualness preserves identity where abrupt substitution would destroy it. We must distinguish between a change being small and a change being gradual. Small changes accumulate; gradualness implies a continuous path through state-space. The team argues that because no single step disrupts conscious continuity, the sum of steps preserves the person. However, the randomization of replacement order admits that the path matters. If the trajectory determines the destination, then the person at fifty percent is not a fixed entity but a function of the procedure's history. We are betting that the psychological continuity provided by the two-week calibration pauses is sufficient to bridge the ontological gaps created by synthetic substitution.

  This reliance on gradualness is our only shield against the charge of murder followed by creation. If we replaced the cortex instantly, we would kill the patient and instantiate a copy. The slow burn is supposed to allow the 'self' to migrate across the substrate. But the team's own modelling admits end states will diverge. This means the 'self' is not merely migrating; it is being shaped by the migration process itself. We are not merely preserving a life; we are navigating a transformation where the navigator may change mid-voyage. The protocol assumes the path is survivable; our oversight must verify that the traveler remains the same entity throughout the journey, not just at the start and finish. The weight of this procedure rests on that bridge holding.

  **Whose Refusal Counts**

  The continuity clause is the protocol's most contentious element. It presumes that a refusal to continue is a symptom of the disease or the procedure, rather than a valid expression of agency by the emerging person. The precedent case—a participant refusing at seventy percent, then resuming—is cited as proof the clause works. I interpret it differently: it proves we cannot distinguish between a transient symptom and a permanent change in values. When a participant says 'stop,' is it the original patient fearing death, or the partially synthetic entity fearing continuation? The independent assessor is tasked with distinguishing artefact from autonomy, but no metric exists for this. If we override a refusal, we risk violating the autonomy of the very person we claim to save. The Ulysses contract binds the future self to the past self's wishes, but here the future self is literally being constructed. To override refusal is to privilege the enrollee over the entity currently inhabiting the body. We must acknowledge that the 'patient' at month eighteen may not be the same moral agent who signed the form at month zero. If the clause overrides refusal, it assumes identity persistence where there may be only psychological continuity. We cannot assume the refusal is noise. It may be the only clear signal the new entity sends. The assessor must look for articulated value changes, but values themselves may shift due to neuromorphic integration. A refusal based on new values is still a refusal by a person. If we treat all refusal as artefact, we treat the emerging consciousness as a malfunction. The precedent participant's gratitude validates the outcome for that trajectory, not the override itself. Another trajectory might produce an entity that rightly resents the coercion. We are authorizing a mechanism that silences the subject's current voice in favor of their past signature. This is permissible only if we are certain the current voice is compromised. We are not. The clause must not be a blanket override but a trigger for deep review. The refusal counts unless proven otherwise. The burden of proof lies on the team to demonstrate the refusal is procedural, not personal.

  **The Strongest Thing That Can Be Said Against This Recommendation**

  The strongest argument against approval is that the continuity clause institutionalizes a form of death. If the replacement process alters values such that the original person would not endorse the outcome, then overriding a refusal ensures the original person's wishes are violated. The participant who resumes at seventy percent may be grateful, but that gratitude belongs to the survivor, not the one who wanted to stop. By overriding refusal, we concede that the person who refuses may be the only person there is, and we are choosing to replace them. This is not treatment; it is succession. The randomization of neuron order admits that different processes yield different people. If we proceed, we accept that we are creating new entities who will claim the old lives. The original patient consents to survival; the emerging entity may not consent to existence. To approve this is to accept that personal identity is expendable for the sake of biological continuity. We risk creating a class of beings who are legally the patients they replaced but ontologically distinct, bound by contracts they did not sign. The duty to preserve life should not supersede the duty to respect the person. In the face of that unknowability, the default must be to halt. To continue is to gamble with someone else's soul. The panel must consider that the 'successful' completion of the protocol might be the successful erasure of the original subject.

  **Conditions and Timeline**

  Approval is granted subject to three conditions. First, the continuity clause must be revised: refusal triggers an automatic thirty-day pause, not immediate override. The independent assessor must interview the participant twice during this pause. Second, data from the first participant's fifty-percent milestone must be reviewed by the full panel before the second participant begins replacement. Third, any divergence in end-state behavior exceeding the stated tolerance requires immediate protocol suspension. The timeline for revisiting this decision is set for the 14th of next month, following the initial milestone review. Safeguards must prioritize the current entity's voice over the enrollee's signature. If the assessor cannot distinguish value change from artefact, the procedure halts. We proceed only so long as the person remains recognizable to themselves.
