answer: |-
  The frustration your study group is experiencing is a symptom of a classic underdetermination problem, but the root cause is not merely that the data is insufficient to distinguish the theories. The stalemate persists because both sides are attempting to use the concept of "preference" to perform two incompatible theoretical jobs simultaneously: **descriptive modeling** (predicting choice) and **normative assessment** (evaluating welfare).

  The structure of the disagreement is not primarily about what counts as data (introspection vs. choice), nor is it purely verbal. It is a substantive clash regarding **explanatory direction and theoretical purpose**. The Revealed Preference (RP) theorist treats preference as a *construct* derived from choice to ensure logical consistency in prediction; for them, the direction of explanation is Choice $\to$ Preference. The Mentalist treats preference as a *mechanism* that causes choice to allow for welfare judgments; for them, the direction is Preference $\to$ Choice. In your menu-dependence example, the RP theorist is correct *if the goal is prediction*: updating the preference relation to match the new choice preserves the model's ability to forecast future behavior in that specific context. However, the Mentalist is correct *if the goal is welfare*: if the agent reports that the choice of B was a "mistake" caused by the presence of C, the RP framework cannot register this error without abandoning its core axiom that choice reveals welfare.

  This means the disagreement is **substantive**, but it is mislocated. It looks like an ontological debate about whether utility is "real," but it is actually a methodological debate about whether economics is a behaviorist science or a moral science. Because both sides insist that their definition of preference must handle both prediction and welfare, they talk past each other. The RP theorist accuses the Mentalist of unscientific metaphysics because they introduce unobservables to explain welfare. The Mentalist accuses the RP theorist of emptiness because a theory that cannot distinguish a satisfied choice from a framing error cannot guide policy.

  Progress will not come from neural correlation studies, as neural data suffers from the same interpretation problem (is this firing rate the "true" preference or the "framing" signal?). Nor will it come from formal results alone, as both sides can mathematically model menu dependence (RP via context-dependent orderings, Mentalism via stable preferences + error terms). The impasse breaks only when the field adopts a **conceptual distinction that decouples choice consistency from welfare judgment**. A framework like Bernheim and Rangel's "welfare without preferences" or a dual-system model that explicitly separates the *decision process* from the *experienced utility* would allow the RP camp to keep their predictive tools while granting the Mentalists a separate domain for normative analysis. Until "preference" is split into "choice propensity" and "well-being metric," the two sides will continue to absorb the same cases into different buckets without collision.

  Diagnosis: The stalemate is substantive rather than verbal, arising from a category error that attempts to derive normative welfare conclusions from purely descriptive choice data.
