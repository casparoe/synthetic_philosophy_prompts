      *   **Input:** 9 specific cases with the user's intuitive/professional verdicts.
      *   **Goal:** A coherent *principle* that explains these verdicts, identifies which verdicts must be overturned, distinguishes causation from blame/responsibility, addresses the role of expectations/duties, and handles two new hypothetical cases.
      *   **Constraints:** No bibliography, no naming of philosophical positions (e.g., "counterfactual dependence," "normative theory"), just the principle, its application, and the costs.

  2.  **Deconstruct the Cases & Verdicts:**
