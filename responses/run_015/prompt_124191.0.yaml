      *   *Case 2 (Tomatoes/Fungus):* Omission = Cause of *timing*, not *death*. (Pre-emption/Overdetermination).
      *   *Case 3 (Spillway/Alarm):* Operator omission = Cause; Contractor omission = Background. (Chain of reliance/normality).
      *   *Case 4 (Firmware):* Fault = Cause. (Comfortable with machine absence).
      *   *Case 5 (Generator/Fire):* Maintenance omission = Not Cause (because fire took out generator anyway). *Crucial:* Counterfactual dependence fails here because the safeguard wouldn't have worked *in that specific scenario* (fire destroyed it), even if it was broken beforehand. Wait, re-reading: "Had the fire taken only the mains, I should have said... omission was the cause." So, if the generator *would have worked*, the omission is a cause. If the generator *would have burned anyway*, the omission is not a cause. This is strict counterfactual dependence.
      *   *Case 6 (Sheet Piles):* Omission (1 pile) = Cause. (Specific location match).
      *   *Case 7 (MP Letter):* Individual omission = Not Cause. Collective = Maybe. (Overdetermination/Impact threshold).
      *   *Case 8 (Shelterbelt vs. Sea Wall):*
          *   8a (Shelterbelt): Decision *not* to plant = Cause. (Specific consideration/rejection).
          *   8b (Sea Wall): No proposal = Not Cause. (Never considered).
          *   *Tension:* User dislikes that a minute matters physically, but admits they treat it as causal.
      *   *Case 9 (Dashboard/Phone):* Oscillating. Duty officer vs. Telemetry. (Reliance on system vs. Last safeguard).

  3.  **Identify the Underlying Tension:**
      *   The user wants a "physicalist" view (water doesn't care about promises) but their verdicts rely heavily on *norms*, *duties*, *expectations*, and *specific counterfactuals*.
      *   Case 1, 3, 8a rely on duties/decisions.
      *   Case 2, 5, 7 rely on counterfactual robustness (would it have made a difference?).
      *   Case 4 shows comfort with "functional absence" in machines.
      *   Case 9 shows the conflict between *blame* (she should have checked) and *causation* (the telemetry failed).

  4.  **Formulate the Principle:**
      *   Pure physicalism fails Case 1 (no energy in forgetting).
      *   Pure counterfactualism ("but-for" test) fails Case 7 (my letter wouldn't have changed anything) and Case 5 (if the generator burns anyway, the maintenance didn't matter *in that instance*, but the user says omission *is* cause if the fire *only* took mains). Actually, Case 5 is tricky. If the generator is broken, it can't save the town. If the fire destroys the mains, the generator *would* be needed. If the generator is broken, the town floods. So the omission *is* a but-for cause of the flood *if* the fire only takes the mains. If the fire takes the generator too, the omission is *not* a but-for cause (flood happens either way). The user's verdict aligns with But-For testing.
      *   The "Normative" element is strong in 1, 3, 8. The user distinguishes between "never thought of it" (8b) and "thought of it and said no" (8a). This suggests *Normality* or *Expectation* is key.
      *   *Synthesis:* A principle of **Normatively-Grounded Counterfactual Dependence**.
      *   *Core Idea:* An omission is a cause if and only if:
          1.  There was a specific, established expectation or duty to act (The Normative Condition).
          2.  Had the act occurred, the outcome would have been prevented *in the actual course of events* (The Counterfactual Condition).
          3.  The omission is the *most salient* deviation from the expected course of operations (The Salience Condition).

      *   *Refining for the User:* The user wants to know if they are equivocating. They are. They are mixing *causation* (physical/counterfactual) with *responsibility* (normative). However, in engineering/law, "cause" often *means* "responsible factor." I need to give them a principle that unifies their *professional* practice, even if it diverges from strict physics.
      *   *Better Principle:* **The Principle of Expected Intervention.** An omission is causal when it represents a failure of a specific, relied-upon safeguard within a designed system, provided that safeguard would have succeeded had it been activated.
      *   *Wait, Case 8 is the killer.* Why does a 1962 minute matter physically? It doesn't. It matters *legally/professionally*. The user admits this discomfort.
      *   *Decision:* I must tell the user that their verdicts track **Responsibility-Weighted Counterfactuals**. Pure causation (physics) cannot handle omissions. Professional causation *must*.
      *   *Proposed Principle:* **The Principle of Functional Deviation.**
          *   Clause A (The System): The situation must be viewed as a system with designed or expected functions (human or mechanical).
          *   Clause B (The Deviation): The omission must be a deviation from the system's specified or reasonably expected function.
          *   Clause C (The Efficacy): The function, if performed, must have physically prevented the outcome in the specific instance.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the tension. Physics vs. Professional Practice.
      *   *The Principle:* "The Principle of Normative Counterfactual Dependence." (I won't use the name, but describe it). Let's call it **The Principle of Safeguard Dependence**.
      *   *Clauses:*
          1.  **Duty/Expectation:** There must be a specific assignment of function (promise, job description, design spec, prior decision). *Motivated by Cases 1, 3, 8a vs 8b.*
          2.  **Counterfactual Efficacy:** The action, if taken, must have physically stopped the outcome *in that specific scenario*. *Motivated by Cases 2, 5, 7.*
          3.  **Salience/Proximity:** The omission must be the most immediate breakdown in the chain of reliance. *Motivated by Cases 3, 9.*

      *   *Addressing the "Price" (Overturning Verdicts):*
          *   Case 8a (1962 Minute): This is the hardest. Physically, the minute didn't hold the soil. The *absence of roots* did. The minute explains *why* the roots were absent, but is it a *cause* of the slip? Under strict physics, no. Under professional liability, yes. I need to tell the user: If you want physical causation, 8a is false. If you want professional causation, 8a is true. Given their reports are for solicitors, they need professional causation.
          *   Case 9 (Dashboard): The principle should resolve the oscillation. If the system is designed so the human is a *backup* to the telemetry, and the telemetry lied, the telemetry is the primary cause. The human is only a cause if the protocol demands independent verification.
          *   Case 6 (Sheet Piles): The "negligible fraction" worry. But if it's the *specific* point of failure, it passes Counterfactual Efficacy.

      *   *Causation vs. Blame:* I must be honest. Their verdicts *are* tracking blame/responsibility disguised as causation. In law/engineering, this is acceptable ("proximate cause"). In physics, it is not. I need to advise them on what to write in reports. "The failure of X to do Y was a necessary condition for the flood, given the design expectations..."

      *   *The "Hillside Doesn't Care" Question:* Can we have a principle where expectations don't matter? No, not for omissions. An omission is *defined* by an expectation. No expectation = no omission, just a state of affairs. I must tell them this plainly. Cases 1, 3, 8, 9 *require* expectations.

      *   *New Cases:*
          1.  *Committee:* Diffuse responsibility. If no individual was tasked, the *committee* is the agent. If the committee structure prevented action, the structure is the cause. Individual omissions are not causes.
          2.  *Permitting (Valve):* "Allowed" vs "Caused". This is the distinction between *doing* and *allowing*. If the leak started before, the operator *allowed* it. Is that a cause? Under Safeguard Dependence, if their job is to monitor and close, yes. But linguistically, "allowed" is safer. I should validate their linguistic instinct.

  6.  **Refining the Principle for Precision:**
      Let's try to make it sound like an engineering specification.
      **The Principle of Assigned Function Failure.**
      An omission $O$ by agent $A$ is a cause of outcome $E$ if and only if:
      1.  **Assignment:** $A$ was assigned the function of preventing $E$ (by promise, role, design, or explicit decision).
      2.  **Possibility:** It was physically possible for $A$ to perform the function at the time.
      3.  **Sufficiency:** Performance of the function would have prevented $E$ in the actual circumstances.
      4.  **Exclusivity:** No other prior failure rendered the function impossible or irrelevant (pre-emption).

      *Check against cases:*
      1.  Tomatoes: Assignment (promise), Possibility (yes), Sufficiency (yes). -> Cause. (Matches).
      2.  Fungus: Sufficiency (no, would die anyway). -> Not Cause of death. (Matches).
      3.  Spillway: Operator (Assignment: monitor), Contractor (Assignment: set alarm). Why is Operator cause and Contractor background? *Recency/Salience.* The Operator was the *last* assigned function. The principle needs a "Chain of Reliance" clause. The most immediate functional failure is the cause; earlier ones are conditions.
      4.  Firmware: Assignment (code), Sufficiency (yes). -> Cause. (Matches).
      5.  Generator: Sufficiency. If fire takes generator, Sufficiency fails (generator wouldn't have run even if maintained). If fire takes only mains, Sufficiency holds. (Matches).
      6.  Sheet Piles: Assignment (build to spec), Sufficiency (yes, at that spot). -> Cause. (Matches).
      7.  MP: Assignment (none specific to me), Sufficiency (no, one letter changes nothing). -> Not Cause. (Matches).
      8.  Shelterbelt: Assignment (Board decided to consider), Sufficiency (yes). Sea Wall: Assignment (none). -> Matches 8a/8b distinction.
      9.  Dashboard: Assignment (monitor). But reliance on system. If system is assigned to alert, and fails, is human still assigned to verify? If protocol says "trust green tick," human omission is not cause. If protocol says "verify if uncertain," maybe. This resolves the oscillation based on *protocol*.

      *Critique:* This principle admits that "Cause" in this context is *Normative*. It is not physical causation. I must make this distinction clear.

  7.  **Final Polish:**
      *   Tone: Respectful, professional, direct. Acknowledge their expertise.
      *   Structure:
          1.  The Diagnosis (Physics vs. Practice).
          2.  The Principle (stated precisely).
          3.  Application to Cases (which fit, which cost).
          4.  Causation vs. Responsibility.
          5.  The "Hillside" Question (Expectations are necessary).
          6.  The New Cases.

      *Self-Correction on Case 8:* The user finds 8a physically dubious ("what a board minuted... cannot be among the causes"). I need to validate this intuition. The *minute* isn't the cause; the *absence of roots* is. The minute explains the *liability* for the absence. I should advise them to phrase it carefully in reports. "The absence of the shelterbelt caused the failure; the 1962 decision explains the absence."

      *Self-Correction on Case 9:* The oscillation is due to undefined protocol. The principle demands defined protocol.

      *Self-Correction on "Allowing":* Distinguish between *initiating* a causal chain and *failing to interrupt* one. Both are "causes" under the principle if assigned, but "allowed" is linguistically more precise for the latter.

