answer: |-
  You are not equivocating; you are navigating two distinct concepts that share the same word. Your professional instinct is correct: in the physical world, causation is a transfer of energy or momentum. An absence has no mass and pushes nothing. However, in the legal and engineering contexts in which you write, "causation" is not a physical description but a **functional attribution**. You are not describing what the water did; you are describing where a designed system failed.

  To resolve your nagging doubt, you must adopt a principle that explicitly bridges the physical and the normative. You cannot have a principle of *physical* causation that covers omissions, because omissions are not physical events. You need a principle of **Systemic Failure**.

  Here is the principle that coheres with the majority of your verdicts, followed by the price you must pay to hold it.

  ### The Principle of Assigned Function Failure

  An omission $O$ by an agent or component $A$ is a cause of an outcome $E$ if and only if four conditions are met:

  1.  **The Assignment Condition:** $A$ was assigned the specific function of preventing $E$ (or the class of events to which $E$ belongs). This assignment may arise from a promise, a contract, a design specification, a standing order, or a formal decision to adopt a safeguard.
  2.  **The Possibility Condition:** At the relevant time, it was physically and practically possible for $A$ to perform the function.
  3.  **The Efficacy Condition:** Had $A$ performed the function, $E$ would not have occurred in the actual circumstances (strict counterfactual dependence).
  4.  **The Proximity Condition:** $A$'s failure was the most immediate breakdown in the chain of reliance leading to $E$. Prior failures that rendered $A$'s function impossible or irrelevant are background conditions; subsequent failures that would have occurred anyway are preemptive.

  ---

  ### Application to Your Cases

  This principle accommodates most of your verdicts, but it demands clarity on others.

  *   **Case 1 (Tomatoes/Promise):** Fits. Assignment (promise), Possibility (yes), Efficacy (yes). **Verdict: Cause.**
  *   **Case 2 (Tomatoes/Fungus):** Fits. Efficacy fails regarding *death* (fungus killed them), but holds regarding *timing* (Tuesday vs. Friday). **Verdict: Cause of timing, not death.**
  *   **Case 3 (Spillway/Alarm):** Fits. Both Operator and Contractor had Assignments. Proximity resolves the conflict: the Operator was the last link in the chain of reliance. The Contractor's failure is a background condition because the system was designed to rely on the Operator *after* the alarm. **Verdict: Operator is Cause; Contractor is Condition.**
  *   **Case 4 (Firmware):** Fits. Machines have Assigned Functions in design specs. **Verdict: Cause.**
  *   **Case 5 (Generator/Fire):** Fits. Efficacy is the key. If the fire destroys the generator, the maintenance omission lacks Efficacy (it wouldn't have run anyway). If the fire spares the generator, Efficacy holds. **Verdict: Cause only if generator survives fire.**
  *   **Case 6 (Sheet Piles):** Fits. Assignment (build to spec), Efficacy (breach at that spot). The "negligible fraction" worry is irrelevant; if the specific missing unit was the point of failure, Efficacy is satisfied. **Verdict: Cause.**
  *   **Case 7 (MP Letter):** Fits. Assignment fails (no specific duty to *you*), and Efficacy fails (one letter changes nothing). **Verdict: Not a Cause.**
  *   **Case 9 (Dashboard/Phone):** The Principle resolves your oscillation. It depends on the **Assignment**. If the protocol assigns the officer to *verify* the telemetry, it is a Cause. If the protocol assigns the officer to *trust* the green tick, the Possibility condition fails (she could not reasonably be expected to act). You cannot oscillate; you must check the protocol. **Verdict: Depends on written protocol.**

  ### The Price: Verdicts You Must Overturn or Refine

  There are two areas where your intuition conflicts with the Principle, and you must choose which to keep.

  **1. Case 8 (The 1962 Minute vs. The Sea Wall)**
  Your verdict distinguishes between a measure considered and rejected (8a) and one never proposed (8b). The Principle supports this via the **Assignment Condition**. A formal decision creates an assignment (to implement the decision); a lack of proposal creates none.
  *   **The Cost:** You must accept that the *minute itself* is not the physical cause. The physical cause is the *absence of roots*. The minute is the cause of the *liability for the absence*.
  *   **Recommendation:** In your reports, do not write "The 1962 decision caused the slip." Write: "The absence of root cohesion caused the slip. The 1962 decision is the explanation for why that cohesion was absent." This preserves physical truth while maintaining professional accountability. If you refuse this distinction, you are conflating history with physics.

  **2. Case 3 (Background Conditions)**
  You are unsure if "background condition" is a weak causal claim. Under this Principle, it is **not a causal claim at all**. It is an explanation of why the system was vulnerable, but it is not the *failure* that triggered the event.
  *   **Recommendation:** Be precise. The Contractor's omission created a *hazard*; the Operator's omission was the *trigger*. Only the trigger is the "cause" in the functional sense required for liability.

  ### Causation, Blame, or Salience?

  You asked whether you have been tracking blame and calling it causation.
  **The answer is yes.**

  In hydrology, "cause" means energy gradient. In law and engineering inquiries, "cause" means **breach of expected function**. These are different categories.
  *   **Physics:** What pushed the water?
  *   **Profession:** Who failed to stop the water?

  **What to put in an expert report:**
  Do not use the word "cause" for omissions without qualification. It invites the physicalist objection you rightly fear. Instead, use the language of the Principle:
  *   *"The flood was the result of the failure of [Component/Person] to perform its assigned function of [Action]."*
  *   *"Had the assigned function been performed, the flood would not have occurred."*
  *   *"This failure constitutes the proximate cause of the damage."*

  This phrasing acknowledges that you are talking about system failure, not metaphysical push-pull.

  ### The "Hillside" Question

  You asked for a principle where expectations are irrelevant, because "causation should be the sort of thing a hillside does not care about."
  **Such a principle is unavailable for omissions.**

  An omission is not a natural kind; it is a normative category. Without an expectation, duty, or design function, there is no omission, only a state of affairs.
  *   If I do not fly to the moon to stop your flood, I have not "omitted" to save you, because I had no assignment to do so.
  *   If the hillside slips, the *absence of roots* is the physical cause. The *absence of a decision to plant* is a historical cause. The *failure of the board to plant* is a professional cause.

  Your verdicts in Cases 1, 3, 8, and 9 foreclose a purely physicalist principle. You cannot have it both ways. If you wish to hold people liable for inaction, you must accept that their duties are part of the causal story *in the professional context*.

  ### The Two New Cases

  **1. The Nine-Person Committee**
  *   **Analysis:** The **Assignment Condition** is key. If the committee was tasked as a body, but no individual was tasked, the *Committee* is the agent.
  *   **Verdict:** The Committee's omission is the cause. No individual member's omission is a cause, because no individual had the specific assignment required to satisfy the condition.
  *   **Report Wording:** "The failure of the Committee to authorize the work caused the breach. No individual member bears causal responsibility."

  **2. The Open Valve (Permitting vs. Causing)**
  *   **Analysis:** This distinguishes between *initiating* a process and *failing to interrupt* one.
  *   **Verdict:** Under the Principle, if the operator was Assigned to monitor and close, the omission is a Cause. However, your linguistic instinct ("allowed" vs. "caused") tracks a useful distinction in **Salience**.
  *   **Recommendation:** Keep the distinction. "Cause" implies the agent started the chain. "Allow" implies the agent failed to break the chain. Both satisfy the Principle of Assigned Function Failure, but "allowed" is more precise for omissions in an ongoing process. It signals to the reader that the *leak* was the primary energy source, while the *operator* was the failed safeguard.
  *   **Report Wording:** "The operator allowed the tank to empty by failing to close the valve." (This is safer and less likely to be challenged by a physicalist than "The operator caused the tank to empty.")

  ### Summary

  You have not been equivocating; you have been working in **Forensic Engineering**, not Physics. Forensic causation is inherently normative.

  **The Principle to adopt:** The Principle of Assigned Function Failure.
  **The Verdicts to keep:** All, provided you clarify that "cause" means "failed safeguard."
  **The Verdicts to refine:** Case 8 (distinguish physical cause from historical explanation) and Case 9 (resolve via written protocol).
  **The Price:** You must admit that in your reports, "causation" includes human expectations. The hillside does not care, but the court does. Your job is to translate the hillside's physics into the court's language of duty.
