  **MEMORANDUM**

  **TO:** All Municipal Recycling Staff
  **FROM:** Director of Waste Management Services
  **DATE:** October 24, 2023
  **SUBJECT:** Q3 Performance Metrics and Strategic Adjustments

  I am pleased to announce that the department has triumphantly exceeded the fiscal year's weight-based recycling target. As of last week, we have collected 12,500 tons of material, surpassing the 10,000-ton benchmark by a significant margin. This success validates our recent strategic pivot toward strict metric optimization and confirms that our operational focus is correctly aligned with municipal reporting requirements.

  To ensure continued compliance with weight targets, we are formalizing three operational adjustments effective immediately. First, we are implementing a Material Density Priority. Lightweight materials, such as empty plastic bottles and aluminum cans, contribute minimally to tonnage goals despite their environmental value or marketability. Consequently, collection efforts will now prioritize high-density, low-market-value materials. We are encouraging residents to leave glass bottles uncrushed and to include wet cardboard in their bins, as moisture content significantly improves weight metrics without requiring additional collection routes. The cost of processing these heavy materials is secondary to the primary objective of maximizing recorded mass.

  Second, we are pausing all waste prevention and reduction outreach. Public education campaigns regarding composting, bulk buying, or reusable containers inadvertently reduce the volume of material entering the recycling stream. Since our performance is evaluated strictly on processed tonnage, successful waste reduction is counterproductive to our key performance indicators. Staff should discourage inquiries about waste minimization and instead emphasize the importance of filling bins to capacity to support departmental goals. A smaller waste footprint directly threatens our funding eligibility and statistical standing.

  Third, we are harmonizing our intake classifications to mitigate reporting volatility. To buffer against fluctuations in household recycling rates, we have reclassified certain construction debris and non-recyclable commercial waste as "bulk recyclables." If material enters via a blue bin, it is now administratively categorized as recycled material regardless of its final destination at the sorting facility. This eliminates ambiguity in reporting and stabilizes our data streams against external auditing.

  These measures demonstrate our unwavering commitment to data integrity and target achievement. While external stakeholders may focus on broader environmental outcomes, our internal mandate is to meet the specified metrics established by the city council. We must remain vigilant against any initiative that prioritizes ecological impact over recorded weight. Environmental benefit is qualitative and difficult to measure; tonnage is quantitative and indisputable. Our strategy ensures that the target remains an excellent metric for success.

  Next year's target has been adjusted upward to 15,000 tons based on this year's performance. Please align your operations accordingly. We anticipate another year of record-breaking tonnage.

  Thank you for your dedication to the numbers.

  **Director of Waste Management Services**
