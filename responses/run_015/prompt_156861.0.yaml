answer: |-
  **Project Title:** The Locus of Deception: Internal Logic and Moral Gradation in Augustine's *De Mendacio*

  **Project Summary**
  Augustine's *On Lying* (*De Mendacio*) presents a persistent scholarly tension: Augustine constructs an eight-fold taxonomy of lies, ranked from sacrilegious to benevolent, yet maintains an absolute prohibition that classifies all eight as sinful. Existing scholarship generally resolves this tension by categorizing Augustine either as a rigid deontological absolutist (rendering the ranking rhetorical) or a crypto-consequentialist (where the ranking implies a hidden utility calculus). This project proposes a third path. It investigates whether Augustine's distinction between lying *in the heart* (intent/will to deceive) and lying *with words* (false enunciation) performs genuine philosophical work in sustaining the taxonomy without collapsing into utilitarianism.

  **Research Question**
  Does the separation of the *voluntas fallendi* (will to deceive) from the *enuntiatio* (utterance) provide a coherent internal logic that justifies Augustine's moral ranking of lies, or is this distinction merely rhetorical cover for an indefensible absolute prohibition? Specifically, can this framework accommodate benevolent omission without contradicting the core definition of the lie?

  **Significance and Current Gap**
  Current literature treats Augustine's ranking as either decorative or contradictory. By ignoring the internal mechanics of the "heart/word" distinction, scholars miss the possibility that Augustine is grading the *ontological location* of the sin rather than its consequences. This project addresses this gap by treating the text as a logical system rather than a theological decree. It offers a fresh exegesis relevant to contemporary ethics of information, specifically regarding the moral status of omission and intent in communication.

  **Methodology**
  The project employs a three-month program of close textual analysis and conceptual mapping:
  1.  **Taxonomic Mapping:** A line-by-line reconstruction of the eight categories of lies in *De Mendacio*, isolating the specific criteria for each rank.
  2.  **Logical Stress-Testing:** Applying analytical distinctions drawn from speech-act theory and semantics to test the stability of the "heart vs. word" criterion across all eight categories.
  3.  **Boundary Analysis:** Specifically testing the framework against cases of benevolent omission to determine if they fall inside or outside Augustine's definition of lying.

  **Deliverables**
  1.  **A Visual Taxonomy:** A logical map detailing the necessary and sufficient conditions for each of Augustine's eight categories, highlighting the divergence between intent and utterance.
  2.  **Final Monograph (approx. 15,000 words):** An argument evaluating whether the heart/word distinction holds. The conclusion will either validate the distinction as a non-utilitarian method of moral gradation or demonstrate its collapse.

  **Timeline and Scope**
  *   **Month 1:** Close reading and data extraction from standard translations; creation of the preliminary taxonomy.
  *   **Month 2:** Logical analysis and stress-testing of the heart/word distinction; drafting the argument.
  *   **Month 3:** Refinement, boundary analysis (omission), and final editing.
  *   **Scope Check:** This is a solo, library-based project requiring no travel or archival access. The scope is strictly limited to *De Mendacio*, avoiding broader Augustinian theology to ensure completion within three months.

  **Risk Assessment and Falsifiability**
  The project carries a specific intellectual risk: the "heart/word" distinction may collapse under logical scrutiny. If the analysis reveals that intent and utterance are inseparable in Augustine's eight cases, the thesis that the distinction explains the ranking will be falsified. However, this negative result is itself a significant scholarly contribution, as it would definitively rule out the "internal logic" interpretation and force a return to the absolutist/consequentialist debate. The project is designed to accommodate this outcome without compromising the deliverable.
