answer: |-
  **KEY TO CONCEPTS OF HEALTH AND DISEASE**

  **1.** A person is incapacitated. Cause A: Internal pathology. Cause B: Social barrier (e.g., stairs for a wheelchair user). Is B "disease"?
  > **Yes** (Disease is relational/disadvantage) .................................................... **Go to 2**
  > **No** (Disease requires internal physiological state) .................................... **Go to 3**

  **2.** A society stops treating a condition (e.g., homosexuality in 1973). Does the disease cease to exist?
  > **Yes** (Disease is a medical label) .............................................................. **LEAF A**
  > **No** (Disease is inability to pursue vital goals) ........................................ **LEAF B**

  **3.** A scan reveals a structural deviation (e.g., missing kidney). The person feels fine and functions normally. Is this "disease"?
  > **Yes** (Deviation from design is sufficient) .................................................. **Go to 4**
  > **No** (Deviation must cause harm/failure) .................................................... **Go to 5**

  **4.** All humans lose bone density after age 80. Is this "disease"?
  > **Yes** (Universal dysfunction is still dysfunction) ...................................... **LEAF C**
  > **No** (Universality implies "natural," exempting it) .................................... **LEAF D [EMPTY]**

  **5.** An immune response (allergy) destroys healthy tissue. It is doing exactly what the mechanism was designed to do (defend), but harms the host. Is this "disease"?
  > **Yes** (Outcome/Harm defines disease) ........................................................ **Go to 6**
  > **No** (Mechanism integrity defines health) .................................................. **LEAF E**

  **6.** A variant (e.g., Sickle Cell) reduces one function but protects against a pathogen. Net fitness is context-dependent. Is this "disease"?
  > **Yes** (We can adjudicate net harm/function failure) .................................. **LEAF F**
  > **No** (The category breaks down under trade-offs) .................................... **LEAF G**

  ***

  **LEAF ANALYSIS & LOGICAL SPACE**

  | Leaf | Name | Domain (State / Welfare / Role) | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Strong Social Constructionist** | Social Role | Disease vanishes if doctors stop naming it, regardless of suffering. |
  | **B** | **Vital Goals / Welfare** | Experienced Welfare | A person with perfect physiology is "diseased" if society blocks their goals. |
  | **C** | **Pure Biostatistical** | Physiological State | Aging is a disease; a painless incidentaloma is the same category as cancer. |
  | **D** | **[EMPTY/INCOHERENT]** | — | **Logical Gap:** Claims deviation matters, but exempts universal deviations. Incoherent without smuggling in a value judgment about "naturalness." |
  | **E** | **Evolutionary Naturalism** | Physiological State | If a mechanism is evolved, it is "healthy," even if it kills the organism (e.g., fatal anaphylaxis). |
  | **F** | **Harmful Dysfunction** | State + Welfare | Requires agreement on "natural function" and "net harm," which is often impossible in trade-off cases. |
  | **G** | **Pragmatic Eliminativist** | All / None | We should drop the category "disease" entirely when biology and value conflict. |

  **LOGICAL SPACE NOTES**
  *   **Empty Space:** Leaf D is theoretically unstable. It attempts to hold "deviation" as the criterion while using "universality" as an exemption, which contradicts the premise of Node 3. It is unoccupied because proponents usually slide into Leaf C (Boorse) or Leaf E (Evolutionary).
  *   **Indistinguishable Pair:** Leaf B and Leaf F both rely on "Harm." They are separated by Node 1 (Internal vs. External), but in practice, a "blocked goal" often looks like a "dysfunction." To separate them, ask: *If we build a ramp, is the disease cured?* (Yes = B, No = F).

  **CONCLUSION**
  **Node 3** (Incidentaloma) does the most work; it forces the split between those who see disease as a *state of the organism* versus those who see it as a *problem for the subject*. **Node 1** (Social Barrier) will cause the most fighting; your group's physiologists will resist calling social exclusion "disease," while your social scientists will resist calling internal deviation "disease" if it causes no disadvantage.
