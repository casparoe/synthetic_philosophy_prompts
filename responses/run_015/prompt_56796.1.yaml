          *   Nadia must address: How can a duty bind someone who didn't undertake it, didn't know the rule, and couldn't comply without asking (which she couldn't anticipate)?
          *   Both must press on: The gap between *doing wrong* and *being properly told off*.
          *   Both must press on: Is the loss of 5 minutes the point, or is the wrong elsewhere?
      *   **Ending:** No agreement. Each states exactly where the dispute rests and what could move them.
      *   **Tone:** Sharp, intellectual, neither made to look foolish.

  2.  **Character Voices:**
