      *   **Round 3: The Reversal/Resentment Test (Owen's Weak Point).** Nadia presses: If Owen were the local, would he not feel aggrieved? Owen needs to distinguish between *feeling* aggrieved and *being* wronged. He also needs to address the "free-rider" objection (benefiting from a scheme).
      *   **Round 4: Blame vs. Wrongness.** Discuss the gap. Just because we don't scold her, does it mean she didn't do wrong?
