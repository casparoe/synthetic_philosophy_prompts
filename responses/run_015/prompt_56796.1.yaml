answer: |-
  **Setting:** *A terrace overlooking the harbour. The pharmacy incident occurred an hour ago. Nadia and Owen are finishing espresso.*

  **Nadia:** You're treating it as a triviality, Owen. That woman lost five minutes of her life. Not because she was slower, or sicker, or needier, but because a stranger walked past the architecture of our fairness.

  **Owen:** The architecture of *their* fairness. Not ours, and certainly not the tourist's. It's a local quirk. A virtual queue. If the rule isn't posted, isn't universal, and wasn't communicated, it's not a moral rule. It's etiquette. She wore the wrong shoes to a wedding, Nadia. Inelegant, perhaps. Immoral? No.

  **Nadia:** Inelegant? She took a benefit she hadn't earned. The system works on trust. Everyone waits comfortably because everyone trusts that the person at the counter knows who is last. By bypassing that, she free-rode on a cooperative scheme. She accepted the benefit of the order others maintained while contributing nothing to it. That is a paradigm case of unfairness.

  **Owen:** She didn't *accept* a scheme. She walked into a shop. To say she "joined" a cooperative practice simply by entering a room is to make moral obligation a trap. You're arguing she had a duty to comply with a rule she couldn't possibly know existed. How does an obligation bind an agent who has no epistemic access to the rule?

  **Nadia:** Ignorance mitigates blame, it doesn't erase the wrong. If I accidentally step on your foot, I haven't intended harm, but I still owe you an apology. The obligation arises from the impact on the other person's standing, not my internal state.

  **Owen:** But stepping on a foot is a physical intrusion. This is a social coordination. If I don't know the dance steps, I haven't wronged the dancers by standing still. You say the obligation exists independent of her knowledge. That implies moral duties can spring up around us like landmines, invisible until triggered. That's not morality; that's anxiety.

  **Nadia:** It's not a landmine; it's a social contract implicit in presence. When you enter a community, you take on a duty of inquiry. She could have asked, "Who is last?" The cost of asking was zero. The cost of her silence was five minutes of another woman's life. The duty wasn't to know the rule magically; it was to orient herself to the local practice before claiming a share of the resource.

  **Owen:** A duty of inquiry? Into what? Every shop in every town? That's an unreasonable burden. But let's press your point on the harm. You keep coming back to the five minutes. If the pharmacist had been idle, and no one waited, would her action still be wrong?

  **Nadia:** Yes. Because it's not about the time. It's about the priority. She asserted her time was more valuable than the woman who was already there. She treated the local not as a co-participant in a fair system, but as an obstacle to be bypassed.

  **Owen:** But if no time was lost, where is the harm? If the rule is morally inert, then violating it is neutral.

  **Nadia:** The harm is to the *practice*. If everyone did what she did, the system collapses. People would have to stand in physical lines in the heat. Her action relied on the exception. She banked on being the only one who wouldn't ask. That is the definition of free-riding.

  **Owen:** I'll grant you the free-rider intuition is strong. But consider the reversal. Suppose you are the tourist. You walk in, see no line, walk up. You are served. Later, you learn the custom. Do you feel *guilty*? Or do you feel *fooled*?

  **Nadia:** I would feel I had made a mistake I ought to rectify.

  **Owen:** I think you'd feel annoyed that the locals didn't tell you. And if the roles were fully reversed—if you were the local and a tourist did this to you—you would resent it. I know you. You'd burn with it. But why? If the tourist broke no moral law, only a local custom, why is resentment appropriate?

  **Nadia:** Because resentment is the emotional recognition of unfairness.

  **Owen:** Or it's the emotional recognition of frustrated expectation. I grant I would resent it. But my resentment could be mistaken. I might resent someone for wearing bright colours to a funeral, but that doesn't mean they did wrong. The question is: was the tourist *obligated* to know? If I visit your home, I follow your house rules. But if I visit a public shop in a public town, am I bound by unwritten bylaws?

  **Nadia:** You are bound by the norms that facilitate fairness. The physical queue is a universal norm. The virtual queue is a local instantiation of that universal norm. By violating the instantiation, she violated the universal principle of first-come, first-served.

  **Owen:** Ah. Now we're closer. But she *did* follow first-come, first-served. She came, she was served. The "first-come" marker was invisible.

  **Nadia:** It wasn't invisible. It was vocal. The marker was the verbal acknowledgement of the person last.

  **Owen:** Which she didn't hear. Look, Nadia, let's talk about the gap you opened earlier. The gap between doing wrong and being told off. The local woman said nothing. The pharmacist said nothing. If this was a genuine moral violation, like stealing a candy bar, silence would be complicity. They treated it as a breach of etiquette. Why? Because they knew she didn't know.

  **Nadia:** Because they are gracious. We don't shout at children who don't know better, but we still correct them. The lack of scolding doesn't prove the act was neutral. It proves the observers understood the difference between *wrongdoing* and *culpability*. She did wrong, but she wasn't culpable. You're conflating the two.

  **Owen:** I am not. I'm saying that if an act requires specific knowledge to be avoided, and that knowledge is unavailable, calling it "wrong" stretches the word until it snaps. If morality is about how we ought to live, it must be actionable. You cannot ought implies cannot. She *could not* comply without psychic powers.

  **Nadia:** She could have asked!

  **Owen:** She had no reason to ask! That's the crux. To impose a duty to ask is to impose a duty to suspect. "Suspect that your normal behaviour is wrong here." That makes every stranger a potential transgressor.

  **Nadia:** And your view makes every local a doormat. If conventions are morally inert, then I can ignore any social coordination device so long as I don't lie or steal. I can ignore a roundabout's flow, I can ignore a seating plan, I can ignore a ticketing system, provided I don't break a "universal" law. You strip society of its normative glue.

  **Owen:** I strip it of *moral* glue, yes. It leaves *practical* glue. If you ignore the roundabout, you risk a crash—that's harm. If you ignore the queue, you risk... annoyance.

  **Nadia:** Five minutes is annoyance? To a working mother? To someone in pain?

  **Owen:** Then the wrong is the harm, not the queue-jumping. If she had caused an hour's delay, maybe we have a case for negligence. But five minutes? You're trying to elevate a minor inconvenience into a deontological violation because you want the convention itself to hold weight.

  **Nadia:** I want the convention to hold weight because it *is* the mechanism of fairness. Without the convention, "fairness" is just a feeling. The convention *constitutes* the right.

  **Owen:** The convention constitutes the *procedure*. Morality constitutes the *justification*.

  *(Silence between them. The sea breeze rattles the terrace umbrella.)*

  **Nadia:** So, where do we stand?

  **Owen:** We stand on the source of the obligation. I maintain that for an obligation to be moral, it must be traceable to a rule-independent duty—harm, promise, truth. The tourist breached none. She was clumsy, not cruel. To move me, you would need to show me how a duty can bind an agent who lacks the capacity to recognize it, without resorting to "she should have guessed."

  **Nadia:** And I maintain that participation in a social practice generates obligations by virtue of the benefit received, regardless of explicit consent. The tourist took her turn in a system she didn't uphold. To move me, you would need to explain why the local woman's claim to priority was merely a preference, and why the tourist's ignorance absolves the act of unfairness, not just the agent of blame.

  **Owen:** I can't explain that to your satisfaction. I don't believe the claim to priority exists without mutual recognition.

  **Nadia:** And I don't believe mutual recognition is required for a claim to exist. It exists because she was there first.

  **Owen:** Then we are not arguing about the queue. We are arguing about whether morality is discovered or constructed.

  **Nadia:** Precisely. And until we solve that, the tourist keeps her five minutes.

  **Owen:** And the local keeps her resentment.

  **Nadia:** Which is not proof of a right, you'll say.

  **Owen:** Which is not proof of a right, I will say. But I will buy you another coffee. That, at least, is a rule we both understand.

  **Nadia:** Accepted. But I'm ordering first. I was here first.

  **Owen:** *(Smiles)* See? You prove my point. You're enforcing a convention.

  **Nadia:** No, Owen. I'm enforcing fairness.

  *(Nadia signals the waiter. Owen watches her, unconvinced, but yields the floor.)*
