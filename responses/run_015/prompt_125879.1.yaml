answer: |-
  Good evening.

  Looking around this room, I am struck by a rather peculiar division. On one side, we have colleagues who know our honouree as a formidable mind, a defender of specific arguments regarding the nature of the good. On the other, we have family and friends who know her as the woman who would rather miss a departmental meeting than miss a sunset over the Downs, or who turned down the Deanery to preserve her Sunday mornings for the National Gallery.

  Usually, in a retirement speech, we attempt to bridge this gap by suggesting that her personal passions fueled her professional success. We are tempted to say that her walks with old friends recharged her for her writing, or that her love of art sharpened her analytical eye. But to say that would be to betray the very philosophy she has spent a lifetime defending. It would be to treat her friendships and her appreciation of beauty as merely instrumental—as means to the end of career productivity. And if there is one thing she has taught us, it is that the good is not a tool.

  She built her career on G. E. Moore's conviction that there are only two things with intrinsic value: the pleasures of human intercourse and the enjoyment of beautiful objects. Note the phrasing. Not the *utility* of human intercourse. Not the *status* gained from enjoying beauty. The value lies in the conscious experience itself.

  For the theorists here, this is familiar terrain. We know the argument against the naturalistic fallacy. We know the defence of intuitionism. But for her family, who sometimes worried that she was 'wasting her potential' by not climbing higher, I hope you understand that this was not a failure of ambition. It was a fidelity to value.

  When she declined the promotion, she was not sacrificing her career for her happiness. That implies a trade-off between two different currencies. She was recognising that the currency of the career ladder—status, influence, administrative power—holds no intrinsic value whatsoever. It is only good if it leads to something else. Whereas the walk with an old friend? That is not a means to an end. The walk *is* the end. The value is realised in the moment of consciousness where mind meets friend, or mind meets canvas.

  This brings us to the crux of her contribution, and the structure of this evening. Moore spoke of 'organic unities'. He argued that the value of a whole is not simply the sum of the values of its parts. You cannot add up the value of the paint, the value of the canvas, and the value of the viewer's eye to find the value of the art. The value emerges in the unity of the experience.

  I propose that her life must be viewed in the same way. We cannot sum up her published papers and add them to her weekend museum visits and calculate her worth. That would be a category error. The value of her life lies in the organic unity of her existence—the fact that she refused to compartmentalise the philosopher from the person.

  There is a tension here, and I do not wish to resolve it falsely. By conventional academic metrics, she could have published more. She could have been more present. By conventional family metrics, she could have been wealthier, more prominent. There is a genuine conflict between the demands of a modern career and the demands of the intrinsic good. She felt that tension. She did not glide through life on a cloud of aesthetic appreciation; she fought for the space to maintain it against the encroaching instrumentalism of university management and social expectation.

  But in holding that line, she demonstrated something profound. She showed us that a life organised around intrinsic goods is not a life of retreat, but a life of density. The value outstrips the metrics. When she sits with you, her friend, she is not networking. When she stands before a Turner, she is not cultivating cultural capital. She is engaging in the only activities that are strictly, philosophically worth doing for their own sake.

  To the colleagues: let us acknowledge that her greatest argument was not written in a journal, but enacted in her choices. She proved that one can inhabit the world of theory without losing the world of value.

  To the family: let us acknowledge that you were not merely supporting a worker bee so she could rest on Sundays. You were participating in the intrinsic good. You were the 'human intercourse' in the equation. You were the necessary condition for the value to exist at all. Her love for you was not a distraction from her work; it was the point of the work.

  So, as we raise our glasses, let us not drink to her achievements, nor simply to her happiness. Achievements are instrumental; happiness is a byproduct. Let us drink to the goods themselves. To the beauty she recognised, and to the friendships she sustained.

  In a world obsessed with what things are for, she reminded us simply that some things *are*.

  To our friend. To the good.
