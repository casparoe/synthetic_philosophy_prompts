answer: |-
  Your hypothesis about the *telos* of history is correct but incomplete. The deadlock persists not merely because the sides value history differently, but because they are operating under incompatible **epistemic jurisdictions**. They are not just arguing about what happened; they are arguing about *who has the authority to define what counts as "happening"* in a policy context.

  Here is the structural diagnosis of the disagreement.

  ### 1. The Ambiguity of "Truth"
  Yes, they are speaking past each other about the word "truth," but specifically along the axis of **correspondence vs. coherence**.
  *   **Archival Fidelity** relies on *correspondence truth*: A statement is true if it matches physical evidence (logs, census data, orders) independent of human interpretation. Its goal is forensic accuracy.
  *   **Mnemonic Sovereignty** relies on *coherence/narrative truth*: A statement is true if it coheres with the community's lived experience, maintains social bonds, and accurately reflects the *moral weight* of the event. Its goal is moral validity.

  When the memory camp says, "The archive lies," they often mean, "The archive fails to capture the moral reality of our suffering." When the archive camp says, "Memory distorts," they mean, "Memory fails to match the physical record." They are adjudicating different claims using the same vocabulary.

  ### 2. Hidden Empirical Claims
  Both sides depend on a hidden empirical claim regarding **error distribution**:
  *   **The Archival Claim:** Assumes errors in documents are *random noise* (clerical errors, lost files) while errors in memory are *systematic signal* (trauma distortion, myth-making). Therefore, the aggregate of documents converges on reality faster than the aggregate of memories.
  *   **The Mnemonic Claim:** Assumes errors in documents are *systematic signal* (state propaganda, erasure of marginalized groups) while errors in memory are *random noise* (fading details). Therefore, the archive converges on the *state's* reality, while memory converges on the *victim's* reality.

  The stalemate exists because neither side can empirically prove the *direction* of the bias without already accepting one epistemology over the other. To prove the archive is biased, you need memory; to prove memory is confabulated, you need the archive.

  ### 3. Bedrock Intuitions
  The deepest intuition at stake is **ontological**: *Can a people be factually wrong about their own victimization in a way that negates their claim to repair?*
  *   **Archival Intuition:** Yes. If the scale of violence is exaggerated by 50% due to memory distortion, reparative policy based on that scale is unjust to the accused (taxpayers/state). Objective reality constrains moral claims.
  *   **Mnemonic Intuition:** No. The "fact" of victimization is constituted by the experience of it. If the community experiences a genocide, the bureaucratic failure to record it does not negate the ontological reality of the genocide. Moral reality constrains objective claims.

  ### 4. What Counts as Progress?
  Progress will not come from a formal result or better data, because the dispute is not primarily data-driven. Progress requires **functional differentiation**.
  We must stop asking "Which account is True?" and start asking "Which account serves this specific institutional function?"
  *   **Courts/Liability:** Must prioritize archival fidelity (due process requires forensic evidence).
  *   **Monuments/Curricula:** Should prioritize mnemonic sovereignty (their purpose is identity formation and moral education, not forensic adjudication).
  *   **Reparations:** Require a hybrid model (e.g., Truth and Reconciliation Commissions) that accepts narrative truth for healing but requires forensic thresholds for disbursement.

  Progress is achieved when the debate shifts from *epistemological monopoly* to *institutional division of labor*.

  ### 5. Falsification and Failure
  **What would change my diagnosis:**
  If a case study emerged where a community successfully used *purely* archival evidence to secure reparations for an event their collective memory had fundamentally misidentified (e.g., they remembered Event A, but archives proved Event B, and policy followed Event B without social rupture), it would suggest the "moral truth" of memory is less essential than I diagnose. Conversely, if a policy based entirely on contested oral history succeeded without economic collapse or social backlash, it would undermine the "archival constraint" necessity.

  **Where my reasoning is most likely to fail:**
  I may be over-intellectualizing a power struggle. It is possible the "epistemic" debate is merely a proxy for material resource allocation. If the archive camp simply wants to minimize payouts and the memory camp wants to maximize them, no amount of conceptual distinction will resolve it. Additionally, I am assuming a liberal democratic context where "truth" still matters; in purely authoritarian or post-truth contexts, the archive is simply whatever the ruler says, rendering this debate moot.

  Verdict: A category error conflating forensic accuracy with moral validity.
