answer: |-
  Your skepticism is spot-on. **Do not take this bet.**

  The guy at the party is trying to snowball you with a variation of the famous **St. Petersburg Paradox**, but he's either misunderstood the math or is deliberately misleading you. While the classic St. Petersburg game has an *infinite* expected value, this specific variation has an **undefined** expected value.

  Here is the clean way to break down why the math doesn't work in your favor, and why the real-world risk makes it a terrible idea.

  ### 1. The Math: Why the Expected Value is a Trick
  Let's look at the Expected Value (EV) round by round. The game ends as soon as a coin lands on Heads.

  *   **Round 1:** Heads (50% chance). You win **$1**.
      *   Contribution to EV: $0.5 \times \$1 = \mathbf{+\$0.50}$
  *   **Round 2:** Tails then Heads (25% chance). You lose **$2**.
      *   Contribution to EV: $0.25 \times -\$2 = \mathbf{-\$0.50}$
  *   **Round 3:** Tails, Tails, Heads (12.5% chance). You win **$4**.
      *   Contribution to EV: $0.125 \times \$4 = \mathbf{+\$0.50}$
  *   **Round 4:** Tails, Tails, Tails, Heads (6.25% chance). You lose **$8**.
      *   Contribution to EV: $0.0625 \times -\$8 = \mathbf{-\$0.50}$

  Do you see the pattern? Every single round contributes exactly **$0.50** or **-$0.50** to the total expected value.

  When you add them up, the Expected Value looks like this:
  $$EV = 0.50 - 0.50 + 0.50 - 0.50 + 0.50 \dots$$

  In mathematics, this is a divergent series (specifically, a version of **Grandi's Series**). It oscillates forever; it never settles on a number.
  *   If you stop after Round 1, EV is $0.50.
  *   If you stop after Round 2, EV is $0.00.
  *   If you stop after Round 3, EV is $0.50.

  Because the series doesn't converge, **the Expected Value is undefined.** It is mathematically incorrect to say it is "way in your favor." At best, you could argue the average is 25 cents (using a specific summation method called Cesàro summation), but that is certainly not enough to justify a "decent entry fee."

  ### 2. The Real-World Trap: Finite Bankrolls
  In the real world, coin flips don't go on forever, and nobody has infinite money. This is where the bet becomes dangerous for you.

  The game *must* end when one of you runs out of money.
  *   **If the game ends on an odd round (1, 3, 5...):** You win money.
  *   **If the game ends on an even round (2, 4, 6...):** You lose money.

  Since the payouts double every time ($1, $2, $4, $8, $16, $32...), the losses grow terrifyingly fast.
  *   By **Round 10**, if you lose, you owe **$512**.
  *   By **Round 20**, if you lose, you owe **$524,288**.
  *   By **Round 30**, if you lose, you owe **~$536 Million**.

  **The Risk of Ruin:**
  Even if you have a lot of money, the variance is massive. You have a 50% chance of winning $1 immediately. But you also have a 25% chance of losing $2.
  If you agree to an entry fee, you are paying for the *privilege* of entering a gamble where the mathematical edge is nonexistent, but the downside risk is exponential.

  Furthermore, consider **Counterparty Risk**. If the coin lands on Tails 25 times in a row (a 1 in 33 million shot), it's your turn to get paid roughly $16 million. Does this guy at the party actually have $16 million? If he doesn't, you win the flip but lose the money. However, if *you* hit a losing streak, he will expect you to pay up immediately. The bet is structurally asymmetric against you.

  ### 3. The "Clean Way" to Think About It
  Don't get bogged down in infinite series. Think about it this way:

  **"For every dollar I might win, there is an equally weighted probability scenario coming up next where I lose that same dollar."**

  The game is perfectly balanced in terms of probability-weighted value ($0.50 vs -$0.50). There is no edge.
  *   **No Edge + High Variance + Entry Fee = Bad Bet.**

  ### The Verdict
  The guy is relying on the intuition that "doubling payouts" always leads to infinite value (like the classic St. Petersburg Paradox). He is ignoring the fact that **alternating who pays** cancels out that value.

  **Should you take the bet?**
  **No.**
  1.  **Math:** The expected value is undefined, not positive.
  2.  **Money:** You risk exponential losses for linear gains.
  3.  **Reality:** He likely can't pay you if the game goes long, but you'll be expected to pay him.

  Tell him you'll play only if the entry fee is zero and there's a hard cap on the maximum payout (e.g., game ends after 10 flips). If he refuses, you know he knows the math is on his side only because he's hoping you go bust on an even round.
