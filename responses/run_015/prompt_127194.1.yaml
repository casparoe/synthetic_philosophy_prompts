  10. **Final Polish:** Ensure the distinction between "Phenomenal Properties exist but are non-physical" (Dualism) vs "Phenomenal Properties are physical but misrepresented" (Physicalism/Representationalism) vs "Phenomenal Properties do not exist" (Illusionism). The analogies tend to slide into the second category, which is why the Doctor friend attacks them as epiphenomenal.

