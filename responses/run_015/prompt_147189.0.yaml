  ### The Principle: Asymmetric Commission

  Your settled judgments (Cases 1, 2, and 4) are best explained by a single, tightly constrained principle I will call the **Asymmetric Commission Principle**. This principle combines the "Side-Effect Effect" (Knobe Effect) with the philosophical distinction between Commission and Omission.

  **The Principle:**
  An agent intentionally brings about a foreseen outcome $X$ if and only if:
  1.  **Commission Clause:** The agent performs a voluntary action that causally produces $X$ (excluding omissions).
  2.  **Valence Clause:**
      *   If $X$ is **Harmful**, foresight of $X$ is sufficient for intentionality.
      *   If $X$ is **Helpful**, foresight of $X$ is *insufficient* for intentionality (unless $X$ was the primary goal).

  #### Mapping the Clauses to Settled Cases

  *   **Case 1 (Factory/Toxin):** Fits **Commission** (installing system) + **Harm** (poisoning). The Valence Clause dictates that foresight of harm suffices for intentionality. **Verdict: Intentional.**
  *   **Case 2 (Factory/Clean Water):** Fits **Commission** (installing system) + **Help** (improving quality). The Valence Clause dictates that foresight of help is insufficient. **Verdict: Unintentional.**
  *   **Case 4 (Ambulance/Death):** Fails **Commission** (terminating a contract is an omission of care). Even though the outcome is Harmful, the lack of direct causal commission blocks intentionality attribution. **Verdict: Unintentional.**

  ### The Outlier: Case 3 (Drone/Supplies)

  **Verdict:** This is the incoherent outlier.
  **Defense for Overturning:** You judged Case 3 as **Intentional**, but structurally it is identical to Case 2. In both cases, the agent performs a commission for a neutral/selfish goal (compliance/data), and a helpful outcome occurs as a foreseen side-effect.
  *   **Why it must be overturned:** The only difference is the mechanism (chemical filter vs. autonomous drone). However, intentionality is a property of the *operator's mental state* relative to the outcome, not the complexity of the tool. If the help is a side-effect in Case 2, it is a side-effect in Case 3. The "autonomous" label should not invert the Valence Clause; otherwise, intentionality becomes a property of the machine, not the human. To preserve coherence with Case 2, Case 3 must be judged **Unintentional**.
  *   **Theoretical Implication:** This confirms that the **Harm-Help Asymmetry survives mediation by autonomous systems**. The "black box" nature of the drone does not transfer intentionality of side-effects to the operator any more than the chemistry of the filter does.

  ### Predictions

  **Case 5 (Teacher/Exam):**
  *   **Analysis:** This is a Commission (constructing exam) resulting in Harm (student failure/dropout). The motive (standards) is irrelevant under the Valence Clause, which only requires foresight of harm. The specificity of the victim ("one particular student") strengthens the causal link, reinforcing the Commission Clause.
  *   **Prediction:** **Intentional.** (Your oscillation likely stems from the *justification* of the harm, but justification does not negate intentionality under this principle).

  **Case 6 (AI Safety System):**
  *   **Scenario:** An AI autonomously blocks a harmful action that its human operator had foreseen but failed to prevent.
  *   **Analysis:** The human performed a Commission (deploying the AI). The outcome was Help (harm blocked). The human's mental state was indifference or failure to prevent (side-effect relative to the operator's will).
  *   **Prediction:** **Unintentional.** Under the Valence Clause, foreseen help via commission is not intentional. The fact that the AI is a "safety system" makes the help a *function* of the AI, but for the *human operator* who foresaw the harm and relied on the AI to fix it, the prevention is a side-effect of their deployment, not an intentional act of prevention.

  ### Addressing Your Theoretical Questions

  1.  **Does the Harm-Help Asymmetry survive autonomous systems?**
      **Yes.** As argued by overturning Case 3, the asymmetry holds. We attribute intentional harm to operators of autonomous systems (Case 1 logic) but do not attribute intentional help for side-effects (Case 2 logic), regardless of the system's autonomy.

  2.  **Does omission weaken intentionality for harm in the same way directness weakens it for help?**
      **Yes, they are parallel constraints.**
      *   **Help:** Directness (Commission) is *necessary* but not *sufficient* (Case 2). You need the right motive.
      *   **Harm:** Foresight is *sufficient* but only if there is Directness (Commission). Omission (Case 4) removes the sufficiency of foresight.
      *   **Conclusion:** Omission acts as a "blocker" for Harm intentionality just as the lack of motive acts as a "blocker" for Help intentionality. Both prevent the attribution of intentionality despite foresight.

