      *Decision:* Elena's distinction is conceptually robust enough to resolve the *logical* paradox, even if Marcus identifies a *practical* risk. The Paradox of Tolerance is about the *survival of the tolerant regime*, not the *equal distribution of prestige*.

      *Let's refine the verdict:* I will side with **Elena**, but with a significant caveat that Marcus identifies a real risk of elitism. The distinction *does* resolve the *logical* paradox, even if it doesn't solve the *political* tension.

