      *   *Decision:* Elena wins on the specific distinction, *but* Marcus wins on the broader risk. However, the prompt asks specifically about the *institutional-resource distinction*. Does it resolve the paradox? Yes, because the paradox concerns the *right to exist/organize*, not the *right to a subsidized megaphone*.
