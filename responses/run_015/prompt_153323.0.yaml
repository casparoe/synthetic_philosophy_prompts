answer: |-
  # Q&A PREP SHEET: Regulatory Benefit-Cost Analysis & Interpersonal Comparisons

  ## I. Opening Concessions (First 5 Minutes)
  *Do not wait for the Q&A to make these. Embed them in your closing remarks to lower defenses.*

  1.  **Concede Defensibility is Primary:** Acknowledge that their primary fiduciary duty is to produce analyses that survive judicial review and OMB scrutiny, not to solve moral philosophy. State clearly: "I am not asking you to become moral philosophers; I am asking you to protect the record from being struck down as 'arbitrary and capricious' because it hid a value judgment behind a formula."
  2.  **Concede WTP is the Best Available Proxy:** Do not attack Willingness-to-Pay as "wrong." Attack the claim that it is *value-neutral*. Acknowledge it is the best operational tool for consistency, but insist that consistency is not the same as objectivity.
  3.  **Concede Distribution is Political:** Agree that final distributional weights are a political decision. Your claim is only that analysts currently *make* those weights implicitly (via VSL choices, discount rates, scope definitions) without flagging them for the political decision-maker.

  ## II. Anticipated Objections (Ordered by Likelihood & Damage)

  ### 1. The "Legal Suicide" Objection
  *   **Source:** Senior Agency Staff / General Counsel types in the room.
  *   **Idiom:** "You're asking us to put 'interpersonal comparisons' in the Federal Register. That invites remand. Courts accept WTP as a standard practice. If we start saying 'we compared Person A to Person B,' you're handing litigants a weapon to claim we exceeded statutory authority. How does owning the comparison make us *more* defensible, not less?"
  *   **Your Reply (90 sec):** "Hiding the judgment is the greater legal risk. When a court sees a VSL adjustment that effectively weights an older life less than a younger one, but the analysis calls it a 'technical parameter,' the court cannot review the value judgment. They can only review the math. If the math is right but the value is hidden, the rule stands on a lie. If we label it 'Distributional Weight: Age,' the political appointee signs off on it. That shifts the liability from the analyst's methodology to the decision-maker's authority. Courts defer to political choices; they strike down hidden technical overreach. Honesty creates a clearer record for deference."
  *   **Weakest Point:** Courts often defer to "agency expertise" precisely because it looks technical. A judge might prefer a "technical error" they can ignore over a "political choice" they have to validate.

  ### 2. The "Consequences, Not People" Distinction
  *   **Source:** Senior Regulatory Economist (Panelist) & Core Practitioners.
  *   **Idiom:** "You're conflating the object of analysis. We compare *outcomes* (e.g., total risk reduction), not *people*. I don't care if the risk reduction goes to Smith or Jones; I care that the aggregate risk goes down. Your 'stakes' argument still requires us to weigh Smith's stake against Jones's. That's still comparing people. We avoid that by comparing the *states of the world*."
  *   **Your Reply (90 sec):** "A 'state of the world' is just a description of who is doing what. If State A has Smith healthy and Jones injured, and State B has Smith injured and Jones healthy, and you prefer A, you have preferred Smith's well-being over Jones's. There is no aggregate 'risk' that floats free of human bodies. My 'stakes' proposal limits the comparison to the specific margin of the rule, so you aren't ranking their whole lives. But you are still ranking the *importance* of their injury relative to each other. Calling it 'consequences' doesn't remove the person from the consequence."
  *   **Weakest Point:** This can devolve into a semantic stalemate. They can insist "aggregate risk" is a distinct ontological category. If they dig in here, you look like you're quibbling over definitions.

  ### 3. The "Congress Decides Distribution" Objection
  *   **Source:** Government Economists / OMB Alumni.
  *   **Idiom:** "We work under statutes that say 'maximize net benefits.' Congress knows these rules have distributional effects. If they want us to weight the benefits to the poor differently, they can pass a law. Until then, our job is to maximize the size of the pie. You're asking us to do Congress's job because you don't like the distributional outcome of the current pie."
  *   **Your Reply (90 sec):** "Congress isn't setting the VSL. You are. When you choose a wage-risk study from the 1990s over a stated-preference study from the 2020s, you change the distribution of benefits between older and younger workers. That *is* a distributional choice. I'm not asking you to maximize equity; I'm asking you to flag the distributional consequence of your 'efficiency' choices so Congress *can* do its job. You can't legislate what you can't see. Right now, the distribution is happening in the footnotes of your technical memo."
  *   **Weakest Point:** It assumes Congress *would* act if they saw the flags. They might not, leaving you with the accusation that you've paralyzed the analyst for no political gain.

  ### 4. The "Operationalizability" Objection
  *   **Source:** Consulting Economists (Practical implementation).
  *   **Idiom:** "Okay, say we accept your 'Audit Condition.' Role-reversal stability and reason-giving to the loser. How do I code that? Do I put a checkbox in my model? If I can't measure it, I can't defend it. You're replacing a measurable metric (dollars) with a philosophical test that varies by analyst. That destroys reproducibility."
  *   **Your Reply (90 sec):** "It's not a checkbox; it's a documentation standard. In the sensitivity analysis section, you include a 'Distributional Impact Statement.' You state: 'If we adopt this VSL, the burden falls disproportionately on Group X.' Then you ask: 'Could we justify this to Group X given their stake?' If the answer is no, you flag it for the Administrator. You aren't calculating a new number; you are writing a clearer memo. Reproducibility comes from transparent reasoning, not just transparent arithmetic."
  *   **Weakest Point:** "Transparent reasoning" is subjective. A lawyer can attack a memo much easier than they can attack a spreadsheet. You are asking them to increase their surface area for attack.

  ### 5. The "Category Mistake" Objection
  *   **Source:** Capabilities Theorist (Panelist).
  *   **Idiom:** "You're trying to fix BCA by making it more honest, but the problem is aggregation itself. Well-being isn't a quantity. By talking about 'stakes' or 'comparisons,' you are still treating human functioning as a metric to be traded. You are polishing a tool that should be thrown away."
  *   **Your Reply (90 sec):** "I agree that well-being isn't a single quantity. But the regulator *must* choose Rule A or Rule B. Inaction is also a choice with consequences. My argument isn't that we can perfectly measure well-being; it's that since we *must* choose, we should minimize the violence of the choice. Comparing 'stakes in a decision' is less reductive than comparing 'lifetime utility.' It's a damage-control protocol for a world where we already have to decide."
  *   **Weakest Point:** You concede the moral high ground. It makes your project look like "lesser evil" technocracy, which might dissatisfy the normative thrust of your talk.

  ### 6. The "Triviality" Objection
  *   **Source:** Act-Utilitarian Philosopher (Panelist).
  *   **Idiom:** "You're making a mountain out of a molehill. Of course BCA makes interpersonal comparisons. Every economist knows that. We use WTP because it's a proxy for utility maximization. Your 'Audit Condition' is just a convoluted way of describing a veil of ignorance. Why complicate the language? Just admit we maximize utility and move on."
  *   **Your Reply (90 sec):** "Economists don't admit it; they disown it. That disowning is the problem. If you think it's utility maximization, say so. But WTP is not utility; it's ability to pay. When you treat them as identical, you bake wealth inequality into the definition of welfare. My 'Audit Condition' forces you to check if the WTP proxy aligns with the moral claim. If you're a utilitarian, you should want the proxy to match the theory. Right now, it doesn't, and the methodology pretends it does."
  *   **Weakest Point:** The Utilitarian will argue that WTP is the *best available* proxy for utility, so the mismatch is a measurement error, not a philosophical fraud.

  ## III. Strategic Contingencies

  ### The Single Reply That Has to Land
  **The Defensibility Argument (Objection #1).**
  If you fail to convince them that *hiding* the comparison is legally riskier than *revealing* it, the room will dismiss you as an academic critic who doesn't understand the stakes of their job. They must believe that your proposal protects *them*, not just the public.
  *   **If it fails:** Pivot immediately to "Professional Integrity." Argue that even if the court allows it, the analyst owns the signature. "You are the one signing the memo. Do you want to be the one who explained to the Administrator later that the 'technical parameter' actually meant 'we valued these lives less'?"

  ### The Question You Hope Nobody Asks
  **"Can you give us a specific example of a rule that would have been decided differently under your Audit Condition?"**
  *   **Why:** You have a theoretical framework, but if you haven't run the numbers on a real RIAs (Regulatory Impact Analysis), you look unprepared.
  *   **Honest Answer:** "I don't have the data to re-run the OMB docket. But look at the ozone NAAQS reviews. The decision often turns on whether to count benefits to children/elderly differently. Under my condition, the analyst would have to explicitly state: 'We are prioritizing this group's health over that group's compliance costs, and here is the reason.' If they couldn't state the reason to the loser, the rule shouldn't pass the analyst's desk. I'm proposing a change in the *threshold for recommendation*, not necessarily the final political outcome."

  ### The "Restructure Trigger" Objection
  **If Objection #2 ("Consequences, Not People") lands hard early in the Q&A.**
  *   **Signal:** If the Senior Economist makes this point and you see significant nodding from the practitioners, or if the Moderator says, "This seems to be the core disagreement," you are in trouble. This distinction is the bedrock of their professional identity.
  *   **Restructure:** Abandon the "Metaphysical Claim" (that comparisons are constructed). Pivot the last third of the talk (your closing summary) to **Procedural Legitimacy**.
  *   **New Ending:** "Even if you believe you are only comparing consequences, the *public* perceives you as comparing people. Legitimacy is not just about what is true; it's about what is credible. If the public believes you are weighing lives, and your methodology denies it, you lose trust. My proposal is not about the metaphysics of welfare; it's about maintaining the social license to regulate. If you want to keep the authority to issue these rules, you must speak the language of the people affected by them, not just the language of the court reviewing them."
  *   **Why:** This bypasses the philosophical deadlock and appeals to their institutional self-preservation.

  ## IV. Panelist Management Notes

  *   **Utilitarian:** They will try to co-opt you. "Yes, exactly, so we should just maximize utility." *Counter:* "WTP isn't utility."
  *   **Capabilities:** They will try to sink you. "Aggregation is wrong." *Counter:* "We have to decide anyway."
  *   **Political Theorist:** They will attack the authority. "Who gave you the right?" *Counter:* "Congress gave the agency the right; I'm just clarifying how the agency uses it."
  *   **Senior Economist:** They will attack the coherence. "It doesn't make sense." *Counter:* "It makes more sense than the current fiction."

  **Final Advice:** Do not let the Q&A become a seminar on welfare economics. Keep dragging it back to the **memo**, the **record**, and the **signature**. That is their language.
