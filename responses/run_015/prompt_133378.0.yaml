answer: |-
  Good morning, everyone. Welcome.

  Before we start, yes, the banner says "Premature Falsificaton." Missing the 'i'. We did that on purpose. If we can't laugh about the fragility of language at a workshop about Malthus, we're in the wrong room.

  But that typo actually points to exactly why we're here.

  Looking around, I see a room split right down the middle. On one side, I have historians of science and demographers who know the Malthus literature inside out. You know the *Essay* isn't just one book, but six editions of backpedaling and nuance. You know the data. You know that for two centuries, the "Malthusian trap" looked less like a law of nature and more like a historical blip. You know about the Green Revolution. You know about the demographic transition. If I stand here and call Malthus a "secret prophet," I expect you to throw your coffee cups at me. I'm not going to do that.

  On the other side, I have philosophy grad students and climate researchers. To you, Malthus is often a caricature. He's the guy in the footnote who was "wrong about food." He's the exemplar of a falsified hypothesis. Population didn't outstrip resources; technology intervened. Case closed. Popper would say: theory falsified, move on.

  But here is the tension I want us to sit with this weekend: What happens when the timeline of the prediction exceeds the timeline of the verification?

  Malthus's core arithmetic was simple. Population, if unchecked, grows geometrically. Subsistence grows arithmetically. The gap opens, nature closes it via famine, war, or disease. By 1900, and certainly by 1950, that looked dead wrong. We had surplus. We had obesity. We had eight billion people who didn't starve. For the historians in the room, that falsification is real. It's empirical. It's solid.

  But for the climate folks and the philosophers, the clock is ticking again. We are looking at soil degradation, aquifer depletion, and climate stress that looks suspiciously like a resource ceiling. And suddenly, the question shifts from "Was Malthus wrong?" to "Was Malthus just... early?"

  This is the structural problem I want us to tackle. Is "right but early" a legitimate scientific category? Or is it just a face-saving story we tell to rehabilitate dead theories?

  If I make a prediction that says, "The bridge will collapse in 300 years," and I check it in year 50 and it's standing, have I been falsified? Or is the test simply incomplete? If falsification has an expiration date, how long is it? A decade? A century? A millennium?

  I don't want this weekend to turn into a hagiography. We are not here to ignore the last hundred years of human innovation. The historians will rightly remind us that technology is endogenous—it's not magic, it's a response to scarcity. Malthus didn't account for the incentive to innovate.

  But I also don't want us to dismiss the philosophical puzzle. If a mechanism is sound—limits to growth are real, thermodynamics is real—but the timing is off by two centuries, does the theory retain explanatory power? Or does the timing error invalidate the mechanism?

  We have the historians to keep us honest about the data. We have the philosophers to keep us honest about the logic. And we have the climate researchers to remind us why this isn't just an academic game.

  So, my request for the next two days is simple: Don't try to resolve this tension. Don't try to prove Malthus right or wrong. Instead, interrogate the process of judgment itself. When do we declare a theory dead? Who gets to hold the watch? And if we resurrect a falsified theory because the world changed, are we doing science, or are we just telling stories?

  There's a lot of coffee outside, and I suspect we're going to need it. Let's get started.
