      *   *Historians:* They hate presentism. They hate when people ignore historical context. They know Malthus was nuanced but also know the data proved him wrong *for a long time*. They need to feel their expertise is respected, not overridden by a "he was right all along" narrative.
      *   *Philosophers/Climate:* They care about theory structure, falsification conditions, and current relevance. They might view Malthus as a caricature. They need to understand why the historians are skeptical while still engaging with the philosophical puzzle.
      *   *The Bridge:* The workshop title ("Premature Falsificaton?") is the hook. It acknowledges the typo (humor) and the core question (timing of falsification).

  3.  **Drafting - Section by Section:**

      *   **Welcome & The Title:** Acknowledge the typo immediately. It sets a relaxed tone and signals self-awareness.
