answer: |-
  **Title:** The Executability of Advantage: Bounded Rationality and the Strategy-Stealing Argument

  **1. The Research Question**
  Standard game-theoretic proofs establish the *existence* of a first-mover advantage in certain symmetric, monotonic games via the strategy-stealing argument (SSA). However, existence does not guarantee accessibility. This project asks: **Does there exist a class of structurally valid strategy-stealing games in which the computational overhead required to execute the stealing mapping exceeds the memory capacity of a bounded agent, thereby rendering the first-mover advantage epistemically inaccessible?**

  This question admits a determinate yes/no answer. If such a game class exists, the SSA is shown to be agent-relative rather than game-relative. If no such class exists (i.e., the stealing mapping is always computationally trivial), the standard interpretation of the SSA is vindicated as robust across agent types.

  **2. The Gap in the Standard Statement**
  The strategy-stealing argument is typically presented as a structural proof. It relies on three game-theoretic conditions: (1) determinacy (no draws), (2) symmetry (identical move menus), and (3) monotonicity (an extra move is never a liability). The proof proceeds by contradiction: assume the second player has a winning strategy $S$. The first player makes an arbitrary initial move $m$, then adopts $S$ for the remainder of the game, treating the board as if $m$ were not present. If $S$ ever prescribes $m$, the first player makes an arbitrary alternative move, relying on monotonicity to ensure this does not worsen their position.

  The hidden assumption lies in the phrase "treating the board as if $m$ were not present." To execute this, the agent must maintain two concurrent representations of the game state: the *actual* state (containing $m$) and the *counterfactual* state (excluding $m$). At every turn, the agent must compute a translation function $T$ that maps the prescription of $S$ (defined on the counterfactual state) to a legal move in the actual state.

  Standard presentations treat this translation as cost-free. They assume the agent has unbounded working memory to store the counterfactual history and unbounded computational power to compute $T$ in real-time. This ignores the possibility that the complexity of $T$ scales with the game tree depth or board size. In a game with a large state space, maintaining the counterfactual distinction may require more memory than a bounded agent possesses. If the agent cannot track the counterfactual state, they cannot execute $S$, and the contradiction fails to materialize *for that agent*. Thus, the standard proof conflates *structural possibility* (the strategy exists in the abstract) with *executive feasibility* (the agent can run the strategy).

  **3. Methodology**
  To resolve this, I will formalize the "Bounded Stealer." Rather than cataloguing existing games where extra moves hurt (which addresses structural monotonicity, not agent capacity), I will construct a formal model of agent capacity and measure the complexity of the stealing mapping.

  *   **Agent Model:** I will model players as Finite State Automata (FSA) or Turing Machines with bounded tape. This provides a rigorous metric for "memory capacity" (number of states or tape cells).
  *   **Game Model:** I will define a simplified class of "Abstract Monotonic Games" that satisfy the structural conditions of the SSA (symmetry, no draws, monotonicity) but allow for parameterized complexity in the state representation.
  *   **The Metric:** I will define the *Stealing Overhead* as the minimum memory required to maintain the counterfactual state and compute the translation function $T$ relative to the memory required to play the game naively.
  *   **The Test:** I will attempt to construct a specific game instance within this class where the Stealing Overhead exceeds the capacity of a $k$-bounded agent, even though the game remains structurally valid for the SSA.

  **Why this method beats alternatives:**
  1.  *Versus Cataloguing Structural Failures:* Looking at games like Go, where an extra stone can be a liability, only confirms the necessity of the structural monotonicity condition. It tells us nothing about the agent. My method isolates the agent variable by holding structural monotonicity constant.
  2.  *Versus General Bounded Rationality:* Importing general results on bounded rationality (e.g., Rubinstein's complexity costs) is too broad. Those models usually penalize strategy complexity to explain cooperation or equilibrium selection. They do not specifically address the *counterfactual tracking* required by non-constructive existence proofs like the SSA. My method targets the specific mechanism of the stealing argument.

  **Smallest Publishable Unit:**
  A single counter-example suffices. If I can construct one specific finite game that satisfies all structural SSA conditions but requires $O(n^2)$ memory to steal while the base game requires only $O(n)$, I have demonstrated that a player with $O(n)$ memory cannot access the first-mover advantage. This would prove that the SSA is not agent-invariant.

  **4. Range of Conclusions and Decision Criteria**
  There are three plausible outcomes:

  *   **Outcome A (The Robustness Thesis):** The translation function $T$ is proven to be computationally trivial (e.g., constant time/memory) for all structurally valid monotonic games.
      *   *Decision:* The standard interpretation stands. The capacity assumption is benign.
  *   **Outcome B (The Capacity Thesis):** There exist structurally valid games where $T$ requires strictly more resources than playing the game directly, exceeding the bounds of specific agent classes (e.g., FSAs).
      *   *Decision:* The SSA is agent-relative. The first-mover advantage exists mathematically but is not actionable for bounded agents.
  *   **Outcome C (The Approximation Thesis):** Exact stealing is too costly, but a "fuzzy" stealing strategy (ignoring certain counterfactual branches) retains the advantage with high probability.
      *   *Decision:* The normative force of the SSA shifts from certainty to probabilistic expectation.

  The project will decide between these by analyzing the state-complexity of the translation function in the constructed game models. If the memory required to track the "missing move" scales super-linearly with board size while the game rules remain linear, Outcome B is supported.

  **5. Failure Conditions**
  The project would fail if:
  1.  It turns out that for any game satisfying structural monotonicity, the counterfactual tracking can be reduced to a trivial operation (e.g., simply ignoring one coordinate). This would validate the standard view but negate the research hypothesis.
  2.  The formalization of "bounded memory" renders the game unplayable altogether (i.e., the agent is too bounded to play *any* strategy, not just the stealing one). The constraint must be tight enough to allow normal play but tight enough to block stealing.
  3.  The scope expands into general computational complexity of games (e.g., PSPACE-completeness of Hex) rather than focusing specifically on the *overhead of the stealing mapping*.

  **6. Scope Management and Feasibility**
  A 6000-word paper is sufficient for this inquiry, but strict boundaries are required to avoid scope creep.

  *   **What to Cut:**
      *   *Historical Context:* No detailed history of Nash, Ulam, or the development of Hex. Mention only what is necessary to define the SSA.
      *   *Go and Real-World Games:* The comparison to Go is illustrative but structurally irrelevant because Go fails the monotonicity condition. I will exclude it to focus on games that *pass* structural tests but fail agent tests.
      *   *General Bounded Rationality:* I will not engage with the broader literature on quantal response or level-k thinking. The focus is strictly on memory/computation constraints regarding counterfactual tracking.
      *   *Infinite Games:* The analysis will be restricted to finite games to avoid complications regarding determinacy axioms.

  *   **The Verdict:**
      The project is viable for a semester term paper *if* I restrict the game construction to a simplified combinatorial model rather than analyzing complex commercial games. I will not prove results for Hex or Chomp directly, as their complexity is an open problem. Instead, I will construct a "Toy Monotonic Game" designed specifically to test the memory overhead of the stealing argument. This ensures the mathematical heavy lifting is manageable within the word count while preserving the philosophical force of the argument.

  The core contribution will be shifting the SSA from a theorem about *games* to a theorem about *agent-game pairs*. This reframing is philosophically significant for normative game theory, as it challenges the assumption that existence proofs imply rational obligatoriness.
