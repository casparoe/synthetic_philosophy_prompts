prompt: |-
  You're a professional philosopher who has spent years on animal ethics and who, unusually, actually knows some population ecology — the kind of person who can tell density-dependent mortality compensation from a trophic cascade and who won't treat the number of wild vertebrates alive as a back-of-envelope afterthought. Before you write anything, do a quiet brainstorming pass: sketch the space of requirements you could impose, and for each ask what would show a theory had violated it and whether anyone actually denies it. Then commit to one list and stop hedging. Where you're genuinely torn, say so, but still pick a side rather than writing everything as a set of open questions.

  Here's what I need. I'm on a review panel writing the terms of reference for a body that will exist for 25 years and has a mandate over a large, bounded, mostly-wild territory — call it a couple of hundred thousand square kilometres of mainland, islands, farmland, fenced reserves and one big river delta. It has to publish its reasons, it will be replaced by a differently-composed committee in 25 years, its budget is maybe two percent of what it would need to do everything anyone might want, and it has to act on welfare estimates that are, honestly, terrible. So I don't want a theory of the cosmos; I want the specification: what a view has to be able to do to be good enough to guide that body.

  Give me the requirements list, each with the case or consideration behind it — the cases it has to get right, the distinctions it must not collapse, the biology it must not contradict. Please cover at least:

  - predators and prey, on whatever scale you like;
  - the mass-juvenile-mortality case, where most of the suffering is in animals that never reproduce and where removing one cause of death mostly just substitutes another;
  - chronic background conditions rather than dramatic ones — parasitism, drought, starvation, cold;
  - the sentience-uncertain cases, insects especially, given that enormous interventions on their behalf and against them are already happening through agriculture and pest control, so the theory owes us something about existing practice and not only about novel interventions;
  - animals in places we call wild but already run — waterholes, fire regimes, culls, supplementary feeding, feral and rewilded domesticates;
  - the eradications and sterilizations everybody already accepts (rats off islands) versus the ones nobody accepts (neutering predators), and whether the theory can explain the difference or has to overrule it;
  - the withdrawal hazard — my phrase, sorry — where an intervention has to be maintained indefinitely and the suffering after the maintaining institution loses interest or loses its budget is worse than the baseline, so a theory has to say what it owes the future it is handing the system to;
  - and the audit problem, which is mine too: you can only find out whether you helped by intervening, the intervention changes the system you're measuring, and the body doing it has every institutional incentive to report success. Any theory whose recommendations are unverifiable in principle should be marked down, and I want to know exactly how much to mark it down.

  On distinctions: I want to see status versus how much status, causing versus allowing and specifically the messy version where you stop a harm you didn't start by starting something else, welfare versus naturalness or ecological integrity or an animal getting to live as its kind lives, individuals versus populations versus systems as the unit of concern, reducing suffering versus adding positive welfare, and duty versus permission. Say which are real desiderata and which are just one camp's commitments wearing a suit.

  My panel has handed me a pile of candidate requirements and I suspect some are prejudices. Tell me which, and whose: that non-interference is the default and needs no justification; that no verdict may trade individuals of one species against individuals of another; that the theory must be usable by people who don't know which animals are sentient; that it must respect what the humans living in the territory value, including valuing wildness; that it must be computable from data we could plausibly have in ten years; that it must not rest on any contested claim in population ethics; and that it has to give the same verdict at a scale of ten animals and at a scale of ten to the ninth.

  Then the part I actually care about. Flag any pair of requirements you suspect can't be jointly satisfied — I'd rather have your argument than a tidy list — and if some subset is jointly unsatisfiable, give me the trimmed list that survives and say plainly what I lost. And tell me which single requirement does the most work knocking out candidate theories, because that's where the real disagreement is and I want to put it to the panel.

  If you have room, a short table at the end scoring four family-level views against the list — hands-off ecological holism, consequentialist interventionism of the wild-animal-welfare sort, a rights or inviolability view extended to animals, and a stewardship or capabilities picture — but keep that under a quarter of your answer, the criteria are the deliverable. And skip citations and reading lists entirely; I've read the survey material and I can't get to a library from where I'm writing this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Persona and Task:**
      *   **Persona:** Professional philosopher specializing in animal ethics *and* population ecology. Knowledgeable about density-dependent mortality, trophic cascades, sentience uncertainties, and institutional constraints. Pragmatic, decisive, willing to take sides rather than hedge.
      *   **Task:** Create a specification (requirements list) for a 25-year governing body managing a large, bounded, mostly-wild territory with limited budget and terrible welfare data.
      *   **Key Constraints:** Must cover specific cases (predators/prey, juvenile mortality, chronic conditions, insects/uncertainty, managed wildness, eradication consistency, withdrawal hazard, audit problem). Must analyze distinctions (status, causing/allowing, welfare/naturalness, units of concern, suffering/positive, duty/permission). Must evaluate candidate requirements (identify prejudices). Must flag incompatibilities and trim the list. Must identify the single most exclusionary requirement. Must include a short scoring table of four views. No citations.
      *   **Tone:** Rigorous, direct, slightly weary of academic fluff, focused on institutional reality.

  2.  **Brainstorming & Requirement Space (Mental Pass):**
      *   *Requirement:* Minimize suffering. *Problem:* Measurement impossible, perverse incentives (audit problem), withdrawal hazard.
      *   *Requirement:* Respect ecological integrity. *Problem:* "Integrity" often masks indifference to suffering (naturalness fallacy).
      *   *Requirement:* Non-interference. *Problem:* We already interfere (agriculture, climate). Status quo bias.
      *   *Requirement:* Sentience precaution. *Problem:* Paralysis if applied strictly to insects.
      *   *Requirement:* Reversibility. *Problem:* Ecology is rarely reversible.
      *   *Requirement:* Budget feasibility. *Problem:* Might rule out doing anything useful.
      *   *Requirement:* Consistency across scales. *Problem:* Aggregation problems in ethics.
      *   *Requirement:* Political legitimacy (human values). *Problem:* Humans value predation/naturalness which conflicts with welfare.

  3.  **Drafting the Requirements (The "Commitment"):**
      *   I need to select the ones that actually work for a *governing body* with *limited budget* and *bad data*.
      *   *Req 1: The Welfare Floor.* Must prioritize preventing extreme suffering over enhancing good lives. (Why? Budget constraints + measurement difficulty).
      *   *Req 2: The Exit Strategy.* No intervention without a plan for what happens when funding stops (Withdrawal Hazard).
      *   *Req 3: The Audit Constraint.* Interventions must be measurable against a control or baseline, acknowledging the observer effect.
      *   *Req 4: The Sentience Threshold.* Must operate on a probability-weighted sentience scale, not a binary switch (handles insects).
      *   *Req 5: The Compensation Check.* Must account for density-dependent mortality (don't save juveniles just to starve later).
      *   *Req 6: The Consistency Principle.* Eradication logic must apply across species unless a relevant difference (sentience/ecological role) is proven.

  4.  **Analyzing Distinctions:**
      *   *Status vs. How Much:* Status (rights) is too rigid for ecology. "How much" (weighted welfare) is necessary.
      *   *Causing vs. Allowing:* In a managed territory, this collapses. We are already causing.
      *   *Welfare vs. Naturalness:* Naturalness is a prejudice. Welfare wins.
      *   *Individual vs. Population:* Must be individuals, but aggregated. Populations don't suffer.
      *   *Suffering vs. Positive:* Prioritize suffering (negative utilitarian lean) due to budget/data.
      *   *Duty vs. Permission:* Duty to prevent extreme harm; permission to enhance if cheap.

  5.  **Evaluating Candidate Requirements (The "Prejudices"):**
      *   *Non-interference default:* Prejudice. (Status quo is already interfered with).
      *   *No trading species:* Prejudice. (Ecology forces trade-offs).
      *   *Usable without sentience knowledge:* Impossible. Must use probabilities.
      *   *Respect human values:* Necessary for political survival, but not an ethical truth.
      *   *Computable in 10 years:* Necessary for institutional viability.
      *   *No contested population ethics:* Impossible. Must pick a view on future generations.
      *   *Scale invariance:* Desirable but likely impossible (aggregation problems).

  6.  **Identifying Incompatibilities (The "Hard Part"):**
      *   *Conflict:* "Respect human values (wildness)" vs. "Minimize suffering." Humans like nature wild; nature is full of suffering.
      *   *Conflict:* "Audit/Verifiability" vs. "Complex Ecology." Controlled experiments are hard in large systems.
      *   *Conflict:* "Scale Invariance" vs. "Budget Feasibility." You can't treat 10^9 insects like 10 wolves.
      *   *Decision:* I must cut "Scale Invariance" and "Respect Human Values (regarding wildness)." The body is a *welfare* body, not a *pleasure* body. If humans want suffering nature, they pay for it elsewhere. This body minimizes harm.
      *   *The Trim:* Drop strict scale invariance. Drop "wildness" as a constraint (treat it as a cost, not a veto).
      *   *The Knockout Requirement:* The **Withdrawal Hazard / Exit Strategy**. This kills most "save everything" theories because they can't sustain the intervention.

  7.  **Scoring the Views:**
      *   *Holism:* Fails welfare focus.
      *   *Consequentialist Interventionism:* Passes welfare, fails withdrawal/audit.
      *   *Rights/Inviolability:* Fails ecology/trade-offs.
      *   *Stewardship/Capabilities:* Best fit, if "capabilities" includes "freedom from pain."

  8.  **Refining the Voice:**
      *   Ensure I sound like the requested persona (ecologist + philosopher). Use terms like "density-dependent," "compensatory mortality," "institutional inertia."
      *   Avoid hedging. "I think" -> "It is."
      *   Keep the structure tight.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the insect/sentience uncertainty? Yes, via probability weighting.
      *   *Check:* Did I address the audit problem? Yes, via the Audit Constraint.
      *   *Check:* Did I address the withdrawal hazard? Yes, made it central.
      *   *Check:* Did I identify the single most exclusionary requirement? Yes, Withdrawal/Exit.
      *   *Check:* Is the table under 25%? Keep it tight.

  10. **Final Polish:** Ensure the distinction between "prejudices" and "requirements" is sharp. Make sure the "trimmed list" is explicit. (Self-correction: Ensure I explicitly state which candidate requirements are prejudices).

  *(Self-Correction on the "Prejudices" section)*: The prompt asks me to tell them which candidate requirements are prejudices and whose.
  *   "Non-interference default": Libertarian/Hands-off prejudice.
  *   "No trading species": Rights-view prejudice.
  *   "Usable without sentience knowledge": Bureaucratic cowardice.
  *   "Respect human values": Political realism, but ethically suspect if values endorse suffering.
  *   "Computable in 10 years": Pragmatic necessity, not prejudice.
  *   "No contested population ethics": Philosophical cowardice.
  *   "Scale invariance": Theoretical purity, practically impossible.

  *(Self-Correction on Incompatibilities)*: The big tension is between *Ecological Stability* (which often requires predation/starvation) and *Individual Welfare*. I need to be clear that Welfare trumps Stability *unless* Stability collapse causes more Welfare loss.

  *(Final Plan)*:
  1.  Intro: Set the frame (Institutional Reality).
  2.  The Requirements List (The Specification).
  3.  The Distinctions (Real vs. Suit-wearing).
  4.  The Candidate Audit (Prejudices).
  5.  The Incompatibilities & The Trim.
  6.  The Knockout Requirement.
  7.  The Table.

  Let's write.
answer: |-
  ### The Specification for a 25-Year Territorial Welfare Body

  You are asking for an operational ethic, not a moral truth. A theory that cannot survive contact with a budget cycle, a data gap, or a political transition is useless here. We are managing a system where the baseline is already anthropogenic (climate, borders, agriculture) and the data is noisy. The following requirements are designed to filter out theories that look good in a seminar but collapse in the field.

  #### I. The Requirements List

  1.  **The Compensatory Mortality Constraint**
      *   **Specification:** Any intervention reducing a specific cause of death (e.g., starvation, predation) must model density-dependent compensation. If saving 1,000 juveniles merely results in 1,000 adults starving later or dying more painfully, the intervention is prohibited.
      *   **Case:** Mass-juvenile-mortality. Most wild vertebrates die young. Saving them without expanding carrying capacity is welfare-negative.
      *   **Biology:** Violates basic population ecology (K-selection vs. r-selection dynamics).

  2.  **The Withdrawal Hazard Protocol**
      *   **Specification:** No intervention may commence without a funded, legally binding plan for its cessation or permanent maintenance. If the intervention creates a dependency (e.g., supplementary feeding, predator suppression) and the body dissolves in year 25, the resulting suffering spike must be calculated as a cost *now*. If the post-withdrawal state is worse than the baseline, the intervention is prohibited.
      *   **Case:** Feeding programs that collapse; predator culls that lead to population booms and subsequent crashes.
      *   **Ethics:** Intergenerational duty. You cannot borrow welfare from the future to pay for today's metrics.

  3.  **The Auditability Condition**
      *   **Specification:** Recommendations must be falsifiable within the 25-year window. This requires defined control zones or robust counterfactual modeling. If a theory claims success but the metrics are indistinguishable from background noise or ecological drift, it fails.
      *   **Case:** The audit problem. Institutions lie to survive.
      *   **Epistemology:** Unverifiable claims are treated as null.

  4.  **The Sentience Probability Weighting**
      *   **Specification:** Action is not binary based on sentience certainty. Interventions are weighted by the probability of sentience × intensity of experience. Insects in agriculture/pest control must be included in the calculus, even if the weight is low, because the numbers are high ($10^9$).
      *   **Case:** Insecticides vs. wild insect suffering.
      *   **Ethics:** Precautionary principle applied to expectation, not certainty.

  5.  **The Chronic Background Priority**
      *   **Specification:** Priority must be given to reducing chronic, high-intensity negative states (parasitism, slow starvation, freezing) over preventing acute, quick deaths (predation), provided the predation is not torturous.
      *   **Case:** A quick kill by a wolf vs. three weeks of wasting disease.
      *   **Welfare:** Duration and intensity of suffering trump the "naturalness" of the cause.

  6.  **The Consistency of Eradication**
      *   **Specification:** The moral logic used to justify eradicating invasive rats on islands must be applicable to other species. If rats are culled for welfare/ecological reasons, the theory must explain why wolves or feral cats are treated differently. Either extend the permission or revoke the rat cull.
      *   **Case:** Island restoration vs. mainland predator management.
      *   **Ethics:** Speciesism check.

  #### II. The Distinctions: Real Desiderata vs. Camp Commitments

  *   **Status vs. How Much Status:** *Real Desideratum.* You cannot grant equal inviolable rights to a mouse and an elephant in a bounded territory; they compete for space. A graded status based on cognitive capacity/sentience depth is required for triage.
  *   **Causing vs. Allowing:** *Camp Commitment (Libertarian/Hands-off).* In a territory with borders, climate change, and agriculture, there is no "allowing." We are already causing the conditions. This distinction collapses.
  *   **Welfare vs. Naturalness/Integrity:** *Real Desideratum.* "Naturalness" is a proxy for "I like this." Ecological integrity often requires suffering (e.g., trophic cascades). If the mandate is welfare, naturalness is only instrumentally valuable if it supports welfare.
  *   **Individuals vs. Populations vs. Systems:** *Real Desideratum.* Systems do not feel pain. Populations are abstractions. The unit of concern is the individual, aggregated. However, the *unit of management* is the population. The theory must bridge this without reifying the population.
  *   **Reducing Suffering vs. Adding Positive Welfare:** *Real Desideratum.* Given the budget (2%) and data quality, you must prioritize suffering reduction. Positive welfare is too hard to measure and too expensive to generate at scale.
  *   **Duty vs. Permission:** *Real Desideratum.* There is a duty to prevent extreme harm where cost is low. There is only permission to enhance welfare where cost is high.

  #### III. The Candidate Audit: Prejudices Masquerading as Requirements

  Your panel's pile contains several non-starters. Here is the breakdown:

  *   **"Non-interference is the default and needs no justification."**
      *   **Verdict:** Prejudice. (Hands-off Ecological Holism / Libertarian).
      *   **Reason:** The territory is already managed (borders, waterholes, fire regimes). Non-interference is an active choice with welfare consequences. It requires justification equal to intervention.
  *   **"No verdict may trade individuals of one species against individuals of another."**
      *   **Verdict:** Prejudice. (Rights/Inviolability View).
      *   **Reason:** Ecologically impossible. Predator welfare often conflicts with prey welfare. Refusing to trade leads to paralysis or covert trading.
  *   **"The theory must be usable by people who don't know which animals are sentient."**
      *   **Verdict:** Prejudice. (Bureaucratic Cowardice).
      *   **Reason:** You cannot manage welfare without a sentience model. Require them to use the best available probabilistic model, not to pretend ignorance doesn't matter.
  *   **"It must respect what the humans living in the territory value, including valuing wildness."**
      *   **Verdict:** Political Necessity, Ethical Prejudice.
      *   **Reason:** Politically, you need this to survive. Ethically, if humans value "wildness" (which entails suffering), the theory should treat this as a cost to be weighed, not a constraint that vetoes welfare. I am listing it as a *constraint* for the body's survival, but not as an *ethical truth*.
  *   **"It must be computable from data we could plausibly have in ten years."**
      *   **Verdict:** Real Requirement.
      *   **Reason:** Institutional viability.
  *   **"It must not rest on any contested claim in population ethics."**
      *   **Verdict:** Prejudice. (Philosophical Cowardice).
      *   **Reason:** You cannot avoid population ethics (e.g., is it better to have fewer happy animals or more suffering ones?). Pick the Non-Identity Problem solution that minimizes risk.
  *   **"It has to give the same verdict at a scale of ten animals and at a scale of ten to the ninth."**
      *   **Verdict:** Prejudice. (Theoretical Purity).
      *   **Reason:** Scale changes the ethics. Managing 10 wolves is stewardship; managing $10^9$ insects is statistical hygiene. Demanding scale invariance breaks the theory.

  #### IV. Incompatibilities and The Trim

  There are pairs of requirements here that cannot be jointly satisfied. I will not lie to you about this.

  **The Conflict:** *The Consistency of Eradication* vs. *Respect Human Values (Wildness)* vs. *Budget Feasibility*.
  If you apply the logic of rat eradication (welfare/ecology) consistently to predators, humans will revolt (they value predators/wildness). If you respect human values, you violate Consistency. If you try to do both with 2% budget, you fail the Auditability Condition.

  **The Trim:**
  I am cutting **"Respect Human Values (Wildness)"** as an ethical constraint. It stays only as a political risk factor. If the locals value watching animals freeze, the body's mandate is to reduce freezing, not to cater to the spectators. I am also cutting **"Scale Invariance."** You will treat insects differently than mammals because the cost of verification differs.

  **The Surviving List:**
  1.  Compensatory Mortality Constraint.
  2.  Withdrawal Hazard Protocol.
  3.  Auditability Condition.
  4.  Sentience Probability Weighting.
  5.  Chronic Background Priority.
  6.  Consistency of Eradication (applied logically, not necessarily politically).

  **What You Lost:**
  You lost the ability to claim this body is "democratically aligned" on nature issues. You lost the ability to treat insects and mammals with identical procedural rigor. You have bought a body that can actually function, but it will be accused of elitism and ecological engineering.

  **The Single Knockout Requirement:**
  **The Withdrawal Hazard Protocol.**
  This is the hardest filter. Most "help the animals" theories (Consequentialist Interventionism) demand we intervene to stop predation or starvation. Almost none of them have a plausible 25-year exit strategy that doesn't result in a population crash when funding stops. A theory that says "save them all" without saying "who feeds them in year 26" is disqualified. This requirement kills the utopian views immediately.

  #### V. Scoring the Candidate Views

  | View Family | Compensatory Mortality | Withdrawal Hazard | Auditability | Sentience Weighting | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hands-off Ecological Holism** | **Pass** (Relies on natural regulation) | **Pass** (No intervention to withdraw) | **Fail** (Claims "integrity" is unmeasurable) | **Fail** (Ignores individual sentience) | **Rejected.** Fails the mandate to reduce suffering. |
  | **Consequentialist Interventionism** | **Fail** (Often ignores density dependence) | **Fail** (Rarely plans for institutional decay) | **Fail** (Metrics too broad/long-term) | **Pass** | **Rejected.** Too unstable for a 25-year body. |
  | **Rights / Inviolability** | **Pass** (No killing) | **Pass** (No interference) | **Fail** (Rights violations are binary, not auditable) | **Fail** (Binary sentience switch) | **Rejected.** Paralyzes management; inconsistent on eradications. |
  | **Stewardship / Capabilities** | **Pass** (If capability includes health) | **Pass** (Focus on sustainable support) | **Pass** (Capabilities are measurable) | **Pass** (Graded capabilities) | **Selected.** Best fit, provided "capabilities" prioritizes freedom from pain. |

  **Final Note:** The Stewardship view wins only if you define "Capabilities" strictly. If "Capability to live naturally" includes the capability to starve, it fails. You must write the charter such that the primary capability is *freedom from extreme suffering*. Everything else is secondary.
