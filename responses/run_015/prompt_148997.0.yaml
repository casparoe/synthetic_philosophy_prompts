  **settled:** if utility is unbounded and probabilities don't decay fast enough, expected value calculations can be dominated by low-probability, high-payoff tails (the "swamping" problem). standard decision theory accepts that unbounded EV breaks ordinary reasoning.

  **contested:** whether infinite utility is coherent (can you actually *have* infinite utils?), or if we should treat these cases as limits that never resolve rather than actual values. also contested: whether rational agents must have bounded utility functions to avoid this.

