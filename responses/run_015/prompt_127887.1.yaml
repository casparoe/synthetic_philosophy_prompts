  4. Verdict on the conclusion

  The anti-anthropocentric conclusion—that human-centered history is distorted—does not depend on the agency analogy. One can acknowledge systemic distortion without granting viruses 'agency.' The core insight is that human decisions operate within biophysical limits that often override intent. This correction is fully supported by a leaner vocabulary of **'enabling conditions'** or **'structural constraints.'**

  Using 'constraints' avoids the determinism risk while maintaining the critique. It acknowledges that humans cannot choose to ignore gravity or pathogens, without implying these forces choose to constrain humans. The agency analogy adds rhetorical flair but introduces philosophical baggage regarding intentionality that weakens the argument against determinism critics. Therefore, the conclusion stands stronger without the metaphor. The distortion arises from ignoring causal weight, not from denying non-human personhood. Retaining the analogy invites unnecessary metaphysical debates, whereas focusing on causal interdependence secures the environmental historian's claim without collapsing into determinism or mystifying natural processes.

  5. Alternative framing

  A more precise framing treats non-humans as **causal participants** within **complex adaptive systems**. History becomes an **ecosystem of interactions** where human and non-human elements exchange energy and information. This avoids theatrical intentionality while preserving mutual influence. Use terms like **'feedback loops'** and **'material constraints'** to describe volcanic or viral impacts. This vocabulary acknowledges that while viruses do not intend to collapse empires, their replication interacts with human social structures to produce historical change. It centers causal potency without attributing consciousness, satisfying the anti-anthropocentric goal without inviting determinist critiques.
