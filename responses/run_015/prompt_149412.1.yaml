          *   Here, the algorithm is treated as *fortuna* by the ministers (something to submit to).
          *   But it is actually a tool. By treating a tool as a master, they abdicate *virtù*.
      *   **Where does Virtù Reside?**
          *   *The Minister:* Lacks *virtù*. He is passive. He fears blame more than he desires glory/security. He is "riding" the river without building dikes.
          *   *The Architects:* They have technical *virtù*, but is it political *virtù*? They hide behind the code.
          *   *True Virtù:* Would belong to the one who dares to override the machine for the sake of the state's survival, accepting the risk.
      *   **Adaptive Flexibility vs. Rigid Consistency:**
          *   Machiavelli praises the fox (cunning/adaptability).
          *   The ministers are being *rigid* (always following the algorithm).
          *   The algorithm is *rigid* (code).
          *   *Fortuna* (Climate/Reality) is variable.
          *   Result: The state is vulnerable because the response is rigid against a variable threat.
      *   **Accountability and Corruption:**
