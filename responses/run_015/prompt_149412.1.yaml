          *   Adaptive flexibility vs. rigid consistency: Who has *virtù*, who is crushed by *fortuna*?
          *   Is this corruption or logical extension of power?

  2.  **Deconstruct Machiavellian Concepts in this Context:**
      *   *Fortuna:* In Machiavelli's time, this was luck, fate, changing circumstances, the "river" that floods. In this scenario, the *algorithm* acts as a proxy for *fortuna* (unpredictable, powerful, seemingly external), but it is man-made. However, because it is opaque and dictates outcomes, it functions like an uncontrollable force to the minister. The *climate crisis* itself is also *fortuna* (the external threat).
      *   *Virtù:* This is not moral virtue. It is the ability to impose will upon circumstance, to adapt, to take responsibility, to secure the state. It requires boldness and accountability.
      *   *The Prince/Leader:* Must be visible, take responsibility, and maintain the state's security (*lo stato*).
      *   *Corruption:* For Machiavelli, corruption is when private interest overrides public good, or when institutions lose their capacity to return to first principles. It involves the loss of civic virtue and the diffusion of responsibility.

  3.  **Drafting the Diagnosis - Section by Section:**

