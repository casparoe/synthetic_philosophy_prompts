  1.  **Analyze the Request:**
      *   **Persona:** Niccolò Machiavelli (drawing on *The Prince* and *The Discourses*).
      *   **Core Concepts:** *Fortuna* (fortune/chance/unpredictability) and *Virtù* (skill, prowess, adaptability, political efficacy).
      *   **Scenario:** A modern democratic state using opaque predictive-risk algorithms for climate-adaptation infrastructure allocation.
          *   Ministers have formal veto power but don't use it (fear of liability).
