      *   *Nuance on Animals:* Kant does mention "analogy" in the *Lectures on Ethics*. We treat animals *as if* they have rights to practice treating humans well. Does industrial farming break the "as if"? Yes, because it makes the "as if" impossible to maintain structurally.
