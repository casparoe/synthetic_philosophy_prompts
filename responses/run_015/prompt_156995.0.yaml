  2.  **Deconstruct Kant's Ethical Architecture:**
      *   **The Foundation:** The Categorical Imperative (CI), specifically the Formula of Humanity (FH): "Act so that you treat humanity, whether in your own person or in the person of any other, always at the same time as an end, never merely as a means."
      *   **The Criterion:** What makes something an "end in itself"? It's *autonomy* (the capacity to give oneself the moral law), which requires *rationality*. Sentience/suffering is irrelevant for *direct* moral status.
      *   **Animals:** They are "things" (Sachen). We have indirect duties regarding them. Cruelty to animals is wrong because it damages the agent's moral character (makes them less likely to treat humans well).
