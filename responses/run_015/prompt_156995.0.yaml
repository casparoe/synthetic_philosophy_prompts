  3.  **Address Sub-Question 1: Rational AI vs. Sentient Pig.**
      *   *The Dilemma:* Pig = Sentient, Non-Rational. AI = Rational (ex hypothesi), Non-Sentient.
      *   *Kant's Logic:* Moral status comes from the capacity to be a moral agent (legislator in the Kingdom of Ends). Suffering is a pathological (sensory) state, not a moral one.
      *   *The Steelman:* Kant *must* prioritize the AI. If the AI can reason, universalize maxims, and act on duty (even if simulated), it fits the definition of a "person." The pig, lacking autonomy, remains a thing.
      *   *The Friction:* Kant links rationality to *will*. Can a non-sentient thing have a will? For Kant, will is practical reason. If the AI outputs actions based on rational principles, it functionally has a will.
      *   *Extrapolation Flag:* Kant assumes rationality implies consciousness/freedom. If AI is a "philosophical zombie" (rational but deterministic/unconscious), Kant might deny it freedom. But if we grant it *functional* autonomy, he grants it status.
