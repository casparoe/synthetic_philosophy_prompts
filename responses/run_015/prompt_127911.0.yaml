      *   *Grants:* **Nematode** (intact connectome implies causal unity); **Quantum Crystal** (non-local correlations imply non-decomposability); **New Case** (explicitly "not decomposable into independent temporal slices").
      *   *Denies:* **Cluster** (explicitly rejected for being "decomposable into independent subsystems"); **Plant** (lacks centralized integration, implying modular decomposability); **Sim/Rock** (classical/equilibrium states are inherently decomposable).
  *   **Verdict on Temporal Lattice:** **Grant.** The system satisfies the core constraint of non-decomposability, achieving unity through temporal topology rather than spatial extension.

  **3. The Principle of Non-Classical Substrate Integration**
  *   **Definition:** Moral status requires a substrate that is either biological or exhibits quantum dynamics (excluding classical computation), *combined with* centralized or persistent integration. Classical systems are categorically excluded regardless of complexity ($\Phi$).
