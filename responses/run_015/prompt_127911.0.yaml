  **2. The Principle of Causal Indivisibility**
  *   **Definition:** Moral status is granted to systems that are physically non-decomposable into independent causal parts. The "parts" may be spatial subsystems or temporal slices. If the system's dynamics can be sliced (in space or time) without destroying the state, it lacks the ontological unity required for subjecthood.
