  Hey — I'm about two years into a PhD and need to lock down a dissertation topic in the next month or so. The area I keep circling is the access vs. phenomenal consciousness distinction, specifically how it plays out under global workspace theory: broadcast, ignition, whether ignition is really all-or-none or graded, that kind of thing. My advisor's line is "pick something where a negative result is still publishable." I've got roughly three years of actual work time, a decent background in the psychology of attention and a bitof neuro, but no real lab access — so think conceptual work, reanalysis of existing datasets, maybe small psychophysics I could run online.

  Two ideas of my own, which I want ranked honestly rather than flattered:

  (1) Split access into access-for-report (broadcast to whatever supports verbal or symbolic report) and access-for-control (broadcast to action-selection and task-set systems). Then ask whether a workspace state could get into control but never into report — and if it could, whether the access theorist is committed to calling it conscious. My sense is this re-cuts both the partial-report/overflow literature and blindsight.

  (2) Treat ignition as a graded, time-dependent quantity: how long does a representation have to sit in the workspace before it's phenomenally conscious? If there's a real occupancy-duration threshhold instead of a clean architectural line, what happens to the access/phenomenal distinction?

  One more consideration: I'd slightly rather work on something that also bears on whether an AI system could be conscious, since that's where I think the pressure on this debate is coming from — but only if it's genuinely the same question and not a bait-and-switch.

  So: give me exactly five questions in priority order, including mine if they deserve to be there and saying plainly if they don't. For each, I want the question itself, why it's upstream of the others (or why it isn't), whether it's tractable for someone with my constraints in about three years, and what kind of result in the next few years would move it up or down the list. Numbered list, exactly five items, one or two sentences each, no intro and no summing-up at the end. I don't want a reading list or citations — just the reasoning about what's worth the years.
