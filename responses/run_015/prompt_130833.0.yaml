prompt: |-
  I am recently engaged, and I have been trying to think clearly about what marriage is, beyond the legal and ceremonial aspects. In a philosophical essay I read recently—attributed, I think, to a scholar of family ethics—the author summarizes the contemporary debate over same-sex marriage as a disagreement between two institutional theories. On the "conjugal" account, marriage is essentially a bodily union of complementary sexes, ordered by its nature toward reproduction; its defining norms—exclusivity, permanence, and fidelity—derive directly from that biological teleology, and same-sex partnerships, however committed, lack the specific form that makes a union marital rather than merely affectionate. On the "revisionist" account, marriage is fundamentally a stable, publicly recognized framework for intimate companionship and mutual care; gender is irrelevant to the capacity for care and commitment, so restricting marriage to opposite-sex pairs is arbitrary, and the state's only legitimate interest is in supporting durable caregiving bonds, not in enforcing biological complementarity. The essay then addresses the familiar reply that infertile opposite-sex couples may marry because infertility is an accidental failure within a reproductive form, not an absence of form. But the essay claims this distinction collapses: if reproduction genuinely defines the institution, then any union permanently and essentially lacking reproductive potential—whether by choice or by nature—fails to instantiate the form, so the conjugalist must either exclude infertile couples or concede that reproduction is not constitutive. The essay concludes that, once corrected, the conjugal view reduces to a bare preference for heterosexual norms disguised as metaphysical analysis.

  I want an accuracy audit of this summary. Which sentences fairly represent the philosophical positions, which conflate normative purpose with biological function, and which present standard objections as decisive refutations? In particular, does the essay's argument about infertile couples actually defeat the conjugal reply as its defenders formulate it—where the form is reproductive in kind, not in effect—or does it depend on treating actual reproductive capacity as essential? And does the conclusion that the view is "bare preference" follow from the corrected account? Please go through the summary sentence by sentence, distinguish accurate characterization from simplification and from misrepresentation, and say whether the final conclusion survives correction. Keep your answer to no more than 300 words.
