answer: |-
  You are definitely not overthinking this. You've stumbled onto one of the oldest and most complex questions in ethics and psychology: **Does the intent behind an action matter more than the action itself?**

  There isn't one single "correct" answer, but there is a nuanced reality that might help you make sense of your cousin's behavior. Here is a breakdown of what is likely happening.

  ### 1. The "Fake" vs. "Real" Binary
  We tend to think people are either "good/caring" or "fake/selfish." But human behavior is rarely that black and white.

  *   **The Performance:** On manager days, her kindness was performative. She was acting. In a strict moral sense, that specific behavior was inauthentic.
  *   **The Reality:** On normal days, she was likely operating in "survival mode." Care work is exhausting. If she isn't being monitored, she conserves energy. That isn't necessarily malice; it's burnout.
  *   **The Verdict:** Was it "fake"? Yes, the *motivation* was fake. But the *impact* (the residents feeling smiled at and spoken to) was still real for those moments.

  ### 2. The Grief Reveals the Truth
  The fact that she cried when the resident passed away is the most important piece of data. It contradicts her statement that she "doesn't actually care."

  Psychologically, this is likely a **defense mechanism**. Working in a nursing home means constantly facing decline and death. If you care deeply about every resident, 100% of the time, you will emotionally combust. Many caregivers subconsciously numb themselves or tell themselves "I'm just here for a paycheck" to protect their hearts.

  When the resident died, that wall broke down. The grief proves that the capacity for care was there all along, even if she was keeping it buried to survive the workday. She wasn't lying about wanting to keep her job, but she was lying to herself about not caring.

  ### 3. Does Selfish Goodness "Count"?
  This is the philosophical core of your question. **Can you do the right thing for the wrong reasons?**

  *   **From the Resident's Perspective:** Yes, it counts. If a resident felt lonely and your cousin smiled and held their hand (even because the boss was watching), that resident still felt less lonely. The comfort they received was real, regardless of her internal motivation.
  *   **From a Moral Character Perspective:** It's complicated. Philosophers like Kant would say an action only has moral worth if done from duty, not self-interest. But Utilitarians would say the outcome (happiness for the resident) is what matters.
  *   **The Practical View:** In the real world, **consistency is rare.** If people only did kind things when they felt 100% pure altruism, the world would be a much colder place. We often do "good" things for mixed reasons: to look good, to avoid guilt, to keep a job, or because it's expected. Society generally accepts this because the *result* is still positive.

  ### 4. The Danger Zone
  There is one caveat here. There is a difference between "not being extra sweet" and "neglect."
  *   If she is rushed and barely chats, but still feeds them, meds them, and keeps them safe, she is doing her job, just without extra emotional labor.
  *   If her "selfish" motivation leads to cutting corners on safety or hygiene when the manager isn't looking, then the selfishness becomes dangerous.

  Assuming she is still providing safe care, her behavior is a sign of **compassion fatigue**, not necessarily bad character.

  ### The Takeaway
  You don't have to choose between "She's a fraud" and "She's a saint."

  She is a human being working in an incredibly emotionally taxing environment. She puts on a mask to protect herself and keep her income. That mask slips sometimes (the grief), proving she has a heart.

  **Does the earlier stuff count?**
  Yes. Showing up and performing kindness, even when you don't feel it, is still a form of labor that benefits others. It's not the *highest* form of kindness (which comes from pure love), but it is still better than showing up and being cruel or neglectful.

  Your cousin is likely more tired and more guarded than she is "fake." The grief shows she's still in there.
