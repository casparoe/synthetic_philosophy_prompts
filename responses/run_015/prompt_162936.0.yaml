answer: |-
  Your skepticism is well-founded. Your friend has constructed a "sandwich" of information: the top and bottom buns (the core theory and the philosophical conclusion) are partially accurate but heavily distorted, and the middle filling (the seventh foundation) appears to be largely made up or conflated with fringe proposals.

  Here is a breakdown of what a defender of Moral Foundations Theory (MFT)—including Jonathan Haidt, the primary architect of the theory—would accept, what they would reject, and why the leap from "psychology" to "political truth" is a logical error.

  ### 1. The Foundations: 5, 6, or 7?
  **Friend's Claim:** There are six foundations (Care, Fairness, Loyalty, Authority, Sanctity, Liberty). Later, he adds a seventh (Stewardship).
  **The Reality:**
  *   **The First 5:** The original theory proposed five foundations: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, and Sanctity/Degradation. **This is accurate.**
  *   **The 6th (Liberty):** Around 2012–2013, Haidt and colleagues added Liberty/Oppression as a sixth foundation to account for reactance against tyranny. **This is accurate.**
  *   **The 7th (Stewardship):** **This is false.** There is no canonical "Stewardship" foundation in Moral Foundations Theory. While researchers occasionally propose adding foundations (e.g., "Honesty," "Ownership," or "Proportionality"), "Stewardship" defined specifically as environmental protection is not part of the standard model. Environmental concern is typically mapped onto **Care** (harm to living things) or **Sanctity** (purity of nature).
  *   **Verdict:** Your friend is correct about the six, but the "Stewardship" foundation is likely something he heard on a podcast as a *proposal* or a *pet theory* by a specific commentator, not established science.

  ### 2. The Liberal/Conservative Split
  **Friend's Claim:** Liberals are "truncated" (Care, Fairness, Liberty); Conservatives use all six equally. Liberals can't understand patriotism or sacredness.
  **The Reality:**
  *   **The Data:** MFT data consistently shows that self-identified liberals score very high on Care and Fairness (and Liberty), but significantly lower on Loyalty, Authority, and Sanctity. Conservatives tend to score more evenly across all six. Haidt often describes the liberal moral matrix as relying on "individualizing foundations" (protecting individuals) and the conservative matrix as adding "binding foundations" (protecting the group/institution).
  *   **"Truncated":** Haidt does use language like this, suggesting liberals have a "lighter" moral palate. However, he frames this as a difference in *weighting*, not necessarily capacity.
  *   **"Cannot Understand":** This is an overstatement. MFT suggests liberals *understand* these concepts but do not register them as *moral* arguments. To a liberal, "disrespecting the flag" might be seen as rude or silly, but not *immoral*. To a conservative, it registers as a moral violation (Loyalty/Sanctity).
  *   **Verdict:** **Mostly Accurate regarding the data,** but your friend is interpreting the *difference* as a *defect* in liberals, which leads to the next major distortion.

  ### 3. The "Who is Right?" Conclusion
  **Friend's Claim:** Because conservatives tap into more evolved foundations, their politics are more in tune with "moral truth." (And later, that adding Stewardship makes liberals "right.")
  **The Reality:**
  *   **Descriptive vs. Normative:** This is the most critical error. MFT is a **descriptive** theory (it describes how people *do* make moral judgments), not a **normative** theory (it does not prescribe how people *should* make judgments).
  *   **Haidt's Stance:** Jonathan Haidt identifies as a liberal. In his book *The Righteous Mind*, his goal is not to declare conservatives the winners. His argument is that liberals need to *understand* conservative intuitions to communicate better, and conservatives need to understand liberal intuitions to prevent harm. He explicitly warns against assuming that "more foundations = better morality." He acknowledges that the binding foundations (Loyalty, Authority, Sanctity) can lead to racism, authoritarianism, and oppression if unchecked.
  *   **The Naturalistic Fallacy:** Your friend is committing a philosophical error known as the *Naturalistic Fallacy* (deriving an "ought" from an "is"). Just because a moral intuition is "evolved" or "innate" does not make it morally correct. Slavery, tribalism, and sexism were all supported by "evolved" intuitions in various historical contexts.
  *   **Verdict:** **Distortion.** A defender of MFT would reject the idea that the theory proves one side is morally superior. The theory explains *why* they fight, not *who should win*.

  ### 4. The "Stewardship" Flip
  **Friend's Claim:** If you add Stewardship, liberals score higher, so liberals are "right" and saving the planet is the highest duty.
  **The Reality:**
  *   Since the foundation doesn't officially exist, the claim is baseless within MFT.
  *   However, even if we *did* add it, the logical error remains. Scoring higher on a psychological metric does not prove a policy is correct. It would just mean liberals have a stronger *gut reaction* to environmental issues.
  *   Furthermore, within the existing 6 foundations, conservatives often argue that **Liberty** (freedom from regulation) or **Fairness** (economic cost to the poor) outweighs environmental Care. MFT explains this conflict; it doesn't resolve it.
  *   **Verdict:** **Fabricated.** This sounds like your friend (or his source) trying to "hack" the theory to validate their own political conclusion, mirroring the error the first half of his argument made.

  ### 5. Your Intuition: Psychology $\neq$ Policy
  **Your Thought:** "Even if one side does have a broader set of gut reactions, that wouldn't automatically make their policies correct."
  **The Verdict:** **You are absolutely correct.**
  MFT is a tool for empathy and prediction, not a truth machine.
  *   **Example:** A conservative might feel a strong "Authority" intuition about a leader. MFT explains *why* they feel that. It does not tell us whether that leader is actually competent or corrupt.
  *   **Example:** A liberal might feel a strong "Care" intuition about a specific policy. MFT explains the motivation. It does not tell us if the policy will actually reduce harm or have unintended economic consequences.

  ### Summary for Your Friend
  If you want to push back, here is the breakdown you can offer:

  1.  **The 6 Foundations:** You are right about the six (Care, Fairness, Loyalty, Authority, Sanctity, Liberty).
  2.  **The Split:** You are right that liberals rely mostly on Care/Fairness/Liberty, while conservatives use all six.
  3.  **The "Truth" Claim:** You are wrong that this makes conservatives "more right." Haidt explicitly says MFT is about understanding differences, not ranking moral superiority. Evolved intuitions can be wrong (e.g., tribalism).
  4.  **The 7th Foundation:** You are wrong about "Stewardship." That isn't part of the theory. Environmentalism is usually measured through Care or Sanctity in the existing model.
  5.  **The Conclusion:** Having more moral intuitions doesn't mean better policies. It just means different trade-offs. Liberals prioritize preventing harm (Care); Conservatives prioritize group stability (Binding). Both have blind spots.

  **Bottom Line:** Your friend is using a psychological theory to win a political argument. The theory itself is designed to show why winning that argument is so difficult, not to hand the trophy to one side.
