answer: |-
  Here is a lesson plan designed for a 30-minute whiteboard session with engineers. It avoids the abstract urns and uses a scenario that should feel native to their daily work.

  ### Session Title: Risk vs. Ambiguity (The Ellsberg Paradox)
  **Time:** 30 Minutes
  **Goal:** Distinguish between *Risk* (known probabilities) and *Ambiguity* (unknown probabilities) and demonstrate that people treat them differently, even when the expected value is identical.

  ---

  ### 1. The Core Example: The "Server Cluster" Scenario
  **Why this example:** Engineers understand hardware reliability and deployment risks. It removes the "gambling" stigma of balls/urns and replaces it with "system stability".

  **The Setup (Draw this on the board):**
  You need to deploy a critical microservice tonight. You have two clusters of 100 nodes each available. You will pick one node at random from your chosen cluster to run the job.

  *   **Cluster A (The Legacy Rack):** You have perfect monitoring. You know exactly **50 nodes are Fast** and **50 nodes are Slow**.
  *   **Cluster B (The New Vendor):** The manifest was lost in a migration. You know there are 100 nodes. You know some are Fast and some are Slow. But you have **no idea what the split is**. (It could be 100 Fast, 0 Slow, or vice versa, or anything in between).

  **What it must have:**
  *   Explicit statement that the *total* number of nodes is the same (100).
  *   Explicit statement that for Cluster B, *any* combination is possible (uniform distribution of possibilities).
  *   The payoff must be binary: Success (Fast) or Failure (Slow).

  **What it must leave out:**
  *   Do not mention cost. (Money introduces risk aversion).
  *   Do not suggest Cluster B is "new tech" implying it's untested/buggy. Frame the ignorance as administrative (lost manifest), not technical inferiority.
  *   Do not allow "testing a node first". The decision must be made blind.

  ---

  ### 2. Sequence of Play

  #### Phase 1: The Intuition Check (0–5 Minutes)
  *   **Action:** Draw the two clusters. Ask the room: "You need a **Fast** node to meet SLA. Which cluster do you pick from?"
  *   **Expected Outcome:** Almost everyone will pick Cluster A (The Known).
  *   **Whiteboard:** Write "Preference: Cluster A" under the heading **Bet 1: Pick a Fast Node**.
  *   **Why this comes first:** You need to establish their baseline preference before you challenge it. It validates their gut feeling that "known is better".

  #### Phase 2: The Trap (5–15 Minutes)
  *   **Action:** Change the goal. "Okay, scenario change. Now you are debugging. You need a **Slow** node to reproduce a latency bug. Which cluster do you pick from?"
  *   **Expected Outcome:** Most will *still* pick Cluster A.
  *   **Whiteboard:** Write "Preference: Cluster A" under the heading **Bet 2: Pick a Slow Node**.
  *   **The Reveal:** Circle both preferences. Ask: "How can Cluster A be the better choice for finding a Fast node *and* the better choice for finding a Slow node?"
  *   **Logic:** If Cluster A is better for Fast, you must believe Cluster B has fewer Fast nodes. If Cluster B has fewer Fast nodes, it *must* have more Slow nodes. Therefore, for Bet 2, you should prefer Cluster B.
  *   **Why this comes second:** This creates the cognitive dissonance. It proves their intuition violates basic logic (the Sure Thing Principle) without needing complex maths.

  #### Phase 3: Defining the Terms (15–20 Minutes)
  *   **Action:** Now you label the concepts.
      *   **Risk:** We know the odds (Cluster A). We can calculate Expected Value.
      *   **Ambiguity:** We don't know the odds (Cluster B). We cannot calculate Expected Value.
  *   **Key Point:** Tell them: "You aren't risk-averse. If I told you Cluster B was generated by flipping a coin for each node (50/50 chance), you'd be indifferent. You are **ambiguity-averse**."
  *   **Why this comes third:** Only after they feel the contradiction will they care about the definitions. If you define them first, it's just lecture.

  #### Phase 4: Head Off Misconceptions (20–25 Minutes)
  Engineers are trained to solve problems. They will try to "fix" the paradox rather than accept it. Head these off explicitly:

  *   **Misconception 1: "Cluster B is probably worse." (The Pessimism Bias)**
      *   *Where to head it off:* Immediately after Phase 1.
      *   *What to say:* "I know you think the vendor likely sent rubbish. For this thought experiment, you must assume the vendor's mix was determined by a random process where every split (0/100 to 100/0) was equally likely. There is no hidden signal that B is bad."
  *   **Misconception 2: "It's just Risk Aversion."**
      *   *Where to head it off:* During Phase 3.
      *   *What to say:* "Risk aversion means you prefer £50 over a 50% chance of £100. Here, the expected value of Cluster B *is* 50 Fast nodes (on average). You are rejecting the *unknown*, not the *variance*."
  *   **Misconception 3: "I'd just gather more data."**
      *   *Where to head it off:* At the start of the session.
      *   *What to say:* "This is a decision under strict time pressure. Monitoring is down. You cannot ping the nodes. You must pick now."

  #### Phase 5: The Check Question (25–30 Minutes)
  Do not ask them to define ambiguity. Ask them to apply the distinction to a new variable.

  *   **The Question:** "Imagine I offer you a third option, **Cluster C**. It's like Cluster B (unknown mix), but I tell you the vendor determined the mix by rolling a die for every node. Does your aversion to Cluster C disappear, stay the same, or increase compared to Cluster B?"
  *   **Correct Answer:** It should disappear (or reduce significantly).
  *   **Why this works:** If they say "I'd still avoid it," they haven't understood the difference between *unknown probabilities* (Ambiguity) and *known probabilities of variance* (Risk). By specifying the generation process (the die), you convert Ambiguity into Risk. If they still avoid it, they are just being pessimistic, not ambiguity-averse.

  ---

  ### 3. What to Openly Skip
  To keep this to 30 minutes, you must ruthlessly cut the following:
  *   **The Maths:** Do not write out the Expected Utility equations. Do not mention Savage Axioms or Subjective Expected Utility. It will glaze their eyes.
  *   **The History:** Do not talk about Daniel Ellsberg, the Cold War, or Keynes vs Knight. It's fascinating, but irrelevant to their decision-making tomorrow.
  *   **The "Why":** Do not try to prove whether ambiguity aversion is rational or irrational. There is debate on this. Just establish that *humans do it* and *it violates standard logic*.

  ### 4. British English Checklist
  Ensure your whiteboard notes and speech habits align with the locale to avoid teasing:
  *   **Spelling:** Use **colour**, **favour**, **programme** (unless referring to code, then 'program' is fine), **modelling**, **behaviour**, **centre**.
  *   **Vocabulary:** Use **maths** (not math), **holiday** (not vacation), **lift** (not elevator), **boot** (not trunk - though unlikely to come up), **queue** (not line).
  *   **Currency:** Use **£** symbols.
  *   **Tone:** Keep it slightly understated. Avoid "You guys" (use "You all" or "The team").

  ### 5. Whiteboard Layout Plan
  *   **Left Third:** Draw Cluster A (50/50 split visible).
  *   **Middle Third:** Draw Cluster B (?/? split, question marks).
  *   **Right Third:** The Logic Trap (Bet 1 vs Bet 2 preferences) and the Definitions (Risk vs Ambiguity).

  Good luck. If you stick to the Server Cluster example, they'll see themselves in the problem, and the paradox should land much harder than it does with coloured balls.
