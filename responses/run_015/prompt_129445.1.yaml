answer: |-
  The humidifier hummed, fighting the salt air that crept through the field station's screened windows. Priya stirred her coffee; it had been cold for an hour. Across the table, Marcus leaned over the dissecting scope, adjusting the focus on the lantern raft specimen floating in the tank.

  "So," Marcus said, not looking up. "The keel. It pumps water now. Creates that vortex that pulls copepods to the polyps. It's contributing to the feeding capacity of the colony. That's its function."

  Priya sighed. "It's contributing, sure. But is it the *function*? The keel was selected for swimming efficiency fifty thousand generations ago. Then the raft stopped swimming. The swimming function is dead. The vortex shedding is new. Selection on it is noisy, weak. On your view, Marcus, the moment a trait does something useful, it acquires a function?"

  "If it contributes to a capacity of the containing system we're analyzing, yes. We're analyzing feeding. The keel feeds the colony. Therefore, feeding is a function of the keel."

  "But the frill does it better," Priya countered. "The frill generates a stronger vortex. It's under stronger selection for funneling now. The brooding function is gone—no external larvae anymore. So the frill is the real feeder. The keel is just… leftover infrastructure that sometimes helps out. If you say both have the function, you lose the distinction between the primary adapter and the exaptation."

  Marcus straightened up, rubbing his eyes. "I don't lose the distinction. I just don't think history decides it. You want to say the keel's function is swimming, even though the colony hasn't swum in millennia? That's ghost-hunting. You're chasing a historical reason for presence that no longer explains current maintenance."

  "I'm chasing the normativity," Priya said, tapping the table. "Why is the keel *supposed* to shed a vortex? On your view, if it stops shedding vortices, what happens? It just… doesn't contribute. On my view, if it stops shedding vortices, and funneling is its function, it's *malfunctioning*. There's a difference between a part being absent and a part failing."

  "Okay," Marcus held up a hand. "I'll concede the point about constraints. If every causal contribution is a function, then the keel's function is also casting a shadow, making a hydrodynamic click, and shedding epibionts. That's trivial. 'Function' stops doing work. I need to constrain the capacities. We pick the capacities that matter."

  "And who picks?" Priya pounced. "Why is feeding the capacity that matters and not epibiont-shedding? You pick feeding because that's what the structure is *for*. But 'for' is teleological. You're smuggling history in the side door. You're looking at the keel and thinking, 'Ah, designed for feeding,' based on… what? Its current utility? But utility doesn't distinguish design from luck."

  Marcus paused. "Fair. The choice of system capacity isn't neutral. It's guided by what we think the organism is trying to do. And maybe that 'trying' is where your history lives. But Priya, look at your own retreat. You started with 'selected effects.' Now you're saying 'maintaining selection.' The keel lost the swimming function because selection stopped. But for the funneling to become a function, how much selection is enough? One thousand generations? Ten? If selection is noisy, as you say, is there a threshold? Or do you just pick the timescale that fits your intuition?"

  Priya looked down at her notebook. "I concede the timescale problem. If I say 'recent selection,' I have to define 'recent.' And 'recent' depends on the generation time, the environmental stability… it depends on the interests of the investigator deciding when a trait is established enough to count. I can't give you a hard cutoff. But I still need the history to ground the normativity. Without it, I can't explain error."

  Marcus reached for a jar on the shelf behind him. "Let's test that. Specimen four."

  He pulled out a small vial. Inside, a lantern raft drifted. The keel was visibly malformed—a calcified lump, twisted and rigid. It created no vortex. The colony was alive, feeding robustly.

  "Look at the frill," Marcus said. "The frill is huge. It's handling all the funneling. The keel does nothing. No swimming, no vortex. It's inert."

  Priya leaned in. "It's broken."

  "Is it?" Marcus asked. "On my view, the keel has no causal role in feeding here. It contributes nothing. So it has no function in this context. It's just a lump of calcified tissue. Like a scar. You don't say a scar is malfunctioning when it doesn't pump blood."

  "But it's a keel," Priya insisted. "It's the same type of structure as the others. In the population, keels funnel prey. This one fails to do what keels do. It's malfunctioning."

  "Failures relative to what?" Marcus pressed. "Relative to the population average? Then a rare mutation that improves feeding is a malfunction until it becomes common. Relative to history? Then a perfectly healthy keel in a new environment where it does nothing is malfunctioning. Look at this specimen. The colony is fine. The frill took up the slack. If I say the keel has no function here, I capture the reality: it's doing no work. If you say it has a function but is failing, you're positing a ghost standard that makes no difference to the colony's survival."

  "It makes a difference to explanation," Priya said, her voice tightening. "If I ask why this colony survives, you say 'the frill.' If I ask why this *keel* is here, I have to look at the lineage. But if I ask why this keel is *twisted*, I need to know what it's supposed to be. If it's just a lump, there's no 'twisted.' It's just shaped that way. To call it malformed is to say it violates a norm. Where does the norm come from if not from what the trait was selected to do?"

  "Or," Marcus said, setting the vial down, "the norm comes from the developmental system. It deviates from the stable production of a structure that usually contributes. But that's still causal role, just statistically indexed. You don't need deep history. You just need current stability."

  "But stability isn't normativity," Priya said. "A stable cancer is still cancer. You need the 'why it's there' to distinguish the useful stable thing from the harmful stable thing."

  "And I need the 'what it does' to distinguish the useful thing from the useless historical relic," Marcus shot back. "You're stuck saying the keel's function is swimming, even though it hasn't swum in an epoch. Or you say the function is funneling, but only if I wait another five thousand generations for selection to tighten up. That's arbitrary."

  "Your arbitrariness is picking the system capacity," Priya said. "Mine is picking the maintenance window. At least mine explains why we call it a defect when it breaks."

  Marcus leaned back, the chair creaking. "So here we are. I admit I need history to pick the right capacity system, otherwise 'function' is just 'effect.' You admit you need investigator interest to pick the right maintenance window, otherwise 'function' is just 'ancestry.'"

  "Basically," Priya said.

  "Then the disagreement isn't about the raft," Marcus said. "It's about what we're doing. Are we trying to explain why the trait is present in the lineage? Then you win. History is king. Or are we trying to explain how the current organism works as a going concern? Then I win. Current contribution is king."

  Priya looked at the tank. The rafts drifted, pulsing weakly. "I think biology wants both. We want to know how it works and why it's here. But we keep pretending 'function' is one thing that does both jobs."

  "Maybe it's not one thing," Marcus said. "Maybe we're arguing over a word because we're afraid to admit we have two different explanatory projects."

  "And if we admit that?" Priya asked. "Do we stop asking what functions are?"

  "No," Marcus said. "We just stop expecting one answer to save us from choosing what kind of biologists we want to be."

  Priya picked up her cold coffee. "That's not very satisfying."

  "No," Marcus agreed. "But neither is this coffee."
