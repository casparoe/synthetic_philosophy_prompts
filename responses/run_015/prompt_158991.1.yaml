prompt: |-
  I'm on a tiny committee at my hospital that's supposed to update how we handle psychiatric advance directives — the "if I go manic and start refusing meds, admit me and treat me anyway" kind of document. And the more we talk the more I think the existing practice is quietly committed to something philosophically loaded that nobody on the committee can actually state.

  Here's the shape of it as I understand it (in some places these things are legally binding, in others they're just advisory — I don't think that matters for my question, but tell me if it does). A patient with bipolar disorder signs a directive while she's well saying that if she becomes manic and refuses treatment, she wants to be hospitalized and medicated anyway. Months later she's manic, she's refusing, and the team overrides her current refusal in the name of the earlier document. So the earlier self beats the present self. But then take a different case: someone with dementia who years ago signed a refusal of aggressive life-prolonging treatment, and who now, in a fairly lucid moment, says she'd like to keep going and seems to be genuinely enjoying her lunch. A lot of people say the present self wins there, or at least that it's genuinely up for grabs. And in general, a competent patient's refusal right now trumps anything anyone said earlier. So: earlier self wins here, later self wins there, and I can't tell whether there's a principled line (something about who has capacity at the time) or just two habits that grew up separately in different corners of medicine. Also, as far as I can tell, half the time these documents just get ignored by whoever is on call, which makes me wonder whether there's any theory here at all.

  What I want first is the reconstruction: what view of a person's will, or of preference, or of what it even means to respect someone, does this pattern presuppose? Is there a substantive theory in it — something like "the will that counts is the one formed under good conditions: informed, not in crisis, not distorted" — or is the practice compatible with a much thinner procedural story where capacity is just a gate and nobody is making any claim about what the person really wants? I'd like the strict presuppositions separated from the stuff the practice merely fits well with, and I'd like to know where it's underdetermined, i.e. where three different theories would all license exactly the same behavior.

  Then the part I'm actually stuck on. The idea I keep circling is the alignment-flavored notion of an idealized or extrapolated will: roughly, what you'd want if you knew more, thought faster, and were more the person you wish you were — what people call coherent extrapolated volition. If a hospital took that seriously, what would it do with these two cases? Specifically:

  - Which self is the base point for the extrapolation? The woman at 30 signing the document, or the woman at 35 who is currently manic and refusing? If the answer is "it depends on the case," that seems to make the notion useless at exactly the moment we need it.
  - Does the manic episode itself count as input to the extrapolation? She has now had experiences, formed projects, changed her view of her own life. Does the extrapolated will get updated with all that, or do we treat the episode as noise to be filtered out before we start?
  - Is there even a fact of the matter about where the extrapolation lands, or does it depend on the order in which you imagine her learning things and revising herself? I have a suspicion there isn't, and that the directive is doing more work than any theory of idealized preference can actually justify. If that suspicion is right, say so plainly.
  - And concretely: what would a policy written by someone who believed in extrapolated volition look like? Binding instructions or rebuttable presumptions? A "values history" the team actually reads instead of a checkbox form? A duty to try to talk the manic patient round before overriding her? What would have to change in practice, and what would get worse?

  I definately don't need citations or a reading list — I can't look anything up from the committee room and I don't want to be sent off to read somebody. Just argue it out. If the honest answer is that the practice is underdetermined and we should stop pretending there's a deep theory behind the asymmetry, I'd rather hear that than a tidy story.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A member of a small hospital committee updating psychiatric advance directives (PADs).
      *   **Context:** They are grappling with the philosophical inconsistency between honoring PADs in psychiatry (earlier self wins) vs. dementia/end-of-life care (sometimes present self wins), and the general rule that competent refusal trumps past instructions.
      *   **Goal:** They want a reconstruction of the presuppositions behind current practice, an analysis of whether "extrapolated volition" (coherent extrapolated volition - CEV) solves the problem, and concrete policy implications.
      *   **Constraints:** No citations/reading lists. Just argue it out. Be honest if the practice is underdetermined.
      *   **Tone:** Philosophical, rigorous, practical, direct, acknowledging the messiness.

  2.  **Deconstruct the First Request: Reconstruction of Current Practice:**
      *   *The Phenomenon:* Psychiatry PAD = Earlier self wins. Dementia/End-of-Life = Often present self wins (or at least contested). Competent refusal = Present self always wins.
      *   *The Question:* What view of the person/will does this presuppose? Is it substantive (good conditions) or procedural (capacity gate)? Where is it underdetermined?
      *   *Analysis:*
          *   **Standard Bioethics View:** It's usually framed as *capacity*. If you lack capacity now, we look to the prior competent self.
          *   *The Problem:* In dementia, the "present self" might have *some* capacity or express current interests that seem morally weighty (enjoying lunch). In mania, the "present self" is viewed as *distorted* by illness.
          *   *Presupposition 1 (The Substantive View):* The practice assumes a "True Self" theory. The well state is the authentic state; the ill state is a corruption. This is stronger than just capacity. It's about *authorship*. The manic refusal isn't just incompetent; it's *alien* to the person's narrative.
          *   *Presupposition 2 (The Harm Principle):* In psychiatry, the stakes are often framed as preventing harm (to self/others) and restoring function. In dementia, the stakes are often prolonging life vs. allowing natural death. The "harm" of treating a dementia patient against current wishes feels different than the "harm" of letting a manic patient destroy their life.
          *   *Underdetermination:* Yes, huge.
              *   *Theory A (Precedent Autonomy):* Past competent decisions bind the future. (Supports PADs).
              *   *Theory B (Current Interest/Well-being):* What benefits the patient *now* matters most. (Supports overriding dementia directives if they are happy now).
              *   *Theory C (Narrative Identity):* Which self fits the life story? (Could go either way).
              *   *Current Practice:* Picks A for Psychiatry, mixes A and B for Dementia. Why? Likely because mania is seen as *reversible* and dementia as *progressive*. Treating mania restores the "True Self." Treating dementia often just prolongs the "Changed Self."
          *   *Conclusion on Part 1:* The practice isn't just procedural capacity. It relies on a substantive judgment about which mental state reflects the "real" person. It is underdetermined because it treats reversibility as a moral proxy for authenticity.

  3.  **Deconstruct the Second Request: Extrapolated Volition (CEV):**
      *   *Concept:* What would you want if you knew more, thought faster, were more you?
      *   *Application to Cases:*
          *   *Base Point:* If you start from the Manic Self, extrapolation might lead to "I want stability." If you start from the Well Self, extrapolation leads to "I want to avoid mania." If you start from the Dementia Self, extrapolation is hard (cognitive limits).
          *   *The Manic Episode as Input:* Is it noise or data? CEV usually filters out "noise" (cognitive biases, coercion, ignorance). Mania looks like noise (chemical distortion). Dementia changes look like data (new values).
          *   *Fact of the Matter:* Is there a unique attractor? Probably not. Extrapolation is path-dependent. If you fix the chemistry first, you get one result. If you honor the current desire first, you get another.
          *   *Policy Implications:*
              *   Shift from "Instructions" to "Values."
              *   Duty to negotiate (try to align current self with extrapolated self).
              *   Risk: Paternalism disguised as "helping you be your ideal self."
              *   Risk: The committee becomes the arbiter of the "True Self."

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sharpness of the observation. Validate that the asymmetry is real and not just legal noise.
      *   *Section 1: The Reconstruction.*
          *   Distinguish between *Procedural* (Capacity) and *Substantive* (Authenticity).
          *   Argue that current practice is secretly Substantive. It assumes the "Well Self" is the "Real Self."
          *   Explain the Dementia vs. Mania divergence: Reversibility. In mania, we treat to *restore* the author. In dementia, we often hesitate to treat because there is no author to restore, only a current subject to protect.
          *   Identify the Underdetermination: The "Sliding Scale of Authenticity." We don't have a theory for when a preference change is "growth" vs. "symptom."
      *   *Section 2: The Extrapolated Volition (CEV) Test.*
          *   *Base Point:* CEV fails if it doesn't specify the starting conditions. Starting from Mania = "I am a god." Starting from Well = "I need meds." The theory requires a "Normalcy Condition" that it doesn't define.
          *   *Episode as Input:* CEV treats mania as noise (chemical interference). But if the mania led to a genuine insight (rare but possible), CEV struggles to distinguish.
          *   *Fact of the Matter:* Be honest. There is likely no unique fixed point. It's path-dependent. The directive *creates* the extrapolation rather than recording it.
          *   *Policy:* What would a CEV policy look like?
              *   Not a contract, but a map.
              *   "Ulysses Contract" with escape hatches.
              *   Mandatory "Re-engagement" periods (try to talk when meds start working).
              *   The Danger: It gives clinicians too much power to decide what the "Ideal You" wants.
      *   *Conclusion:* Bring it back to the committee. The honest answer is that the practice is a pragmatic patch, not a philosophical edifice. Stop pretending it's consistent. Focus on *process* (who decides, how we review) rather than *metaphysics* (which self is real).

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible, but keep the philosophical precision.
      *   Be direct about the "messiness."
      *   Ensure the distinction between "capacity" and "authenticity" is clear.
      *   Make sure the CEV critique lands hard (it doesn't solve the problem, it just moves it).

  6.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific bullet points?* Yes (Base point, Episode input, Fact of matter, Policy).
      *   *Did I avoid citations?* Yes.
      *   *Is the distinction between Psychiatry and Dementia clear?* Need to emphasize the *reversibility* aspect, as that's the key practical difference driving the ethical intuition.
      *   *Is the "Underdetermination" point clear?* Need to explicitly state where three theories converge on the same action. (e.g., Utilitarianism, Deontology, and Virtue Ethics might all say "Treat the Manic Patient" but for wildly different reasons).

  7.  **Final Polish:** Check for clarity and impact. Ensure the conclusion offers actionable advice for the committee member. (The advice should be: "Admit the inconsistency, focus on procedural safeguards.")

  *(Self-Correction Note)*: I need to be careful not to say "Dementia patients always win." The prompt says "A lot of people say the present self wins there." I should reflect that ambiguity. The key is the *conflict* between the two domains.

  *(Refining the CEV section)*: The user asked if the directive does more work than the theory justifies. I should affirm this. The directive *acts* as the anchor for the extrapolation. Without the directive, the extrapolation is unmoored.

  *(Final Plan)*:
  1. Validate the asymmetry.
  2. Reconstruct the "True Self" presupposition.
  3. Analyze the Underdetermination.
  4. Apply CEV critique (Base point, Noise, Path-dependency).
  5. Concrete Policy implications (and risks).
  6. Final verdict: It's a pragmatic compromise, not a solved philosophical problem.cw
answer: |-
  You have put your finger on the exact nerve of the problem. The asymmetry you describe—earlier self wins in psychiatry, present self often wins in dementia, present self always wins in somatic competence—is not a bug in the system; it is the system. But you are right that the justification for it is usually a muddle of legal capacity standards and unspoken metaphysical assumptions.

  Here is the reconstruction of what your current practice presupposes, followed by the stress-test using the "extrapolated volition" model you're interested in.

  ### Part 1: Reconstructing the Current Practice

  You asked whether the practice relies on a substantive theory (the will formed under good conditions) or a thin procedural story (capacity is a gate).

  **The Official Story (Procedural):**
  The official line is purely procedural. It goes like this: *Autonomy requires capacity. When capacity is lost, we revert to the last known competent instruction (the directive). When capacity is present, the current instruction rules.*
  In psychiatry, the manic patient is deemed to lack capacity (due to distortion of reality, impulsivity, etc.), so the directive kicks in. In dementia, the patient often lacks capacity, so the directive *should* kick in—but often doesn't. In somatic medicine, the patient has capacity, so the directive is voided.

  **The Real Story (Substantive):**
  If it were purely procedural, the dementia case would look exactly like the psychiatry case: Past Competent Self overrides Present Incapacitated Self. But it doesn't. In dementia care, there is a strong moral intuition that if the patient is content *now*, overriding them to enforce a past wish (e.g., "no feeding tube") feels like a betrayal of the *current* subject, even if they lack full capacity.

  Therefore, the practice presupposes a **Substantive Theory of Authenticity**. It assumes that not all preferences are created equal, even among those with similar capacity ratings.
  1.  **The Psychiatry Assumption:** The "Well Self" is the *Authentic Self*. The "Manic Self" is a *Corrupted Self*. The illness is an invader. Honoring the directive is not overriding the person; it is rescuing the person from the illness. The goal is *restoration* of the author.
  2.  **The Dementia Assumption:** The "Past Self" is the *Author*, but the "Dementia Self" is the *Successor*. There is no restoration possible. Enforcing the Past Self's wish might harm the Successor. The goal is *protection* of the subject.

  **Where it is Underdetermined:**
  You asked where three different theories would license the same behavior. This happens at the moment of enforcement.
  *   **Theory A (Precedent Autonomy):** We honor the directive because a promise made by a competent agent binds their future.
  *   **Theory B (Best Interests):** We honor the directive because treating the mania leads to better health outcomes and less suffering long-term.
  *   **Theory C (Narrative Identity):** We honor the directive because the manic behavior breaks the coherence of the life story the patient values.

  All three theories tell you to inject the antipsychotic. None of them tell you *why* we don't do the same for the dementia patient who signed a DNR but is now happily eating.
  *   If it's **Precedent Autonomy**, we should enforce the dementia DNR. (We often don't).
  *   If it's **Best Interests**, we should enforce the psychiatry directive. (We do).
  *   If it's **Narrative Identity**, it depends on whether we view the dementia patient as the same character. (We often don't).

  **The Verdict on Current Practice:**
  The practice is not committed to a single view of the will. It is committed to **Reversibility**.
  In psychiatry, we assume treatment returns the patient to the state where the directive was written. In dementia, we assume treatment (or life-prolongation) keeps them in the state the directive tried to avoid. The "theory" is actually a heuristic: *If we can get the Real You back, we listen to the Real You. If the Real You is gone, we protect the Current You.*
  This is not a philosophical principle; it is a clinical gamble. And yes, half the time it gets ignored because on a Tuesday night, no one has the energy to adjudicate the metaphysics of identity. They just want to manage the risk.

  ### Part 2: The Extrapolated Volition (CEV) Test

  Now, let's apply the "idealized/extrapolated will" framework. This is the idea that we should do what you *would* want if you were smarter, knew more, and were more "you."

  **1. Which self is the base point?**
  This is the fatal flaw in applying CEV to psychiatry. Extrapolation requires a stable function to extrapolate *from*.
  *   If you take the **Manic Self** as the base: Extrapolating "what I would want if I thought faster" might lead to "I would want to finish this grand project." The mania *feels* like enhanced cognition to the patient. If you treat the mania as the starting data, the CEV might endorse the refusal.
  *   If you take the **Well Self** as the base: Extrapolating leads to "I want stability."
  *   **The Problem:** CEV cannot tell you which base point is the "real" function. It needs a "Normalcy Condition." In practice, the hospital *defines* the Well Self as the Normalcy Condition. The CEV model doesn't solve the conflict; it just hides the decision of "which self is the baseline" inside the definition of "idealized."
  *   **Answer:** If you take CEV seriously, you have to admit the base point is arbitrary without an external standard of health. If the policy says "Base point is the last competent state," that's just the current practice wearing a sci-fi mask.

  **2. Is the manic episode input or noise?**
  *   **Input:** If the episode is data, the extrapolated will must update. Maybe the patient learned something in mania. Maybe the meds flatten them too much. A true CEV would weigh the "insights" of the mania against the "damage."
  *   **Noise:** Current practice treats the episode as chemical noise. It assumes the mania adds no information about the patient's values, only distortion.
  *   **The CEV Verdict:** A strict CEV approach would have to treat the episode as **noise to be filtered**, *unless* the patient can integrate the experience post-recovery. Why? Because CEV aims for *coherence*. Mania is, by definition, incoherent (rapidly shifting goals, contradictory beliefs). You cannot extrapolate a stable vector from a chaotic signal. So, CEV actually supports the "Well Self" baseline, but only because it defines mania as cognitive noise.

  **3. Is there a fact of the matter?**
  You suspected there isn't. You are right.
  Extrapolation is **path-dependent**.
  *   Path A: Medicate first -> Patient stabilizes -> Patient says "Thank god you medicated me." (Extrapolation lands on Treatment).
  *   Path B: Wait it out -> Patient crashes -> Patient suffers trauma -> Patient says "I never want to be touched again." (Extrapolation lands on Non-Interference).
  *   Path C: Negotiate -> Patient takes partial meds -> Patient finds a middle ground.
  There is no "Platonic Form" of what the patient wants. There is only what emerges from the interaction between the patient and the treatment environment. The directive isn't discovering the extrapolated will; it is *constraining* the path so that Path A becomes the only live option. The directive does more work than the theory justifies because the theory (CEV) yields no unique answer without the directive forcing the path.

  **4. What would a CEV-based policy look like?**
  If you actually wrote policy based on "helping the patient achieve their extrapolated volition" rather than "following the legal directive," things would change significantly.

  *   **From Instructions to Values:** The form would stop asking "What meds do you want?" (which assumes the well self knows the specific future context) and start asking "What kind of person are you trying to be? What risks are you willing to take for creativity/stability?"
  *   **Rebuttable Presumptions, Not Binding Orders:** The directive would be a "strong presumption" rather than a binding order. Why? Because the extrapolated will might change if the *context* changes. If a new med exists with fewer side effects, the Well Self would have wanted that, not the old med listed in the directive.
  *   **Mandatory Re-engagement:** This is the biggest change. Current practice: Directive says "Medicate," so we medicate. CEV practice: "Medicate *enough to restore capacity*, then ask the patient again."
      *   *Why?* Because the goal is the *Extrapolated* will, not the *Past* will. Once the noise is filtered (meds working), the current self is now a better proxy for the extrapolated self than the past self was.
      *   *Policy:* "Treatment may be initiated to restore capacity. Once capacity is restored, the current refusal trumps the prior directive unless the patient confirms the directive reflects their current extrapolated values."
  *   **What gets worse:**
      *   **Uncertainty:** Clinicians hate this. They want to know if they can inject or not. A CEV policy requires clinical judgment about "how much capacity is enough to consult."
      *   **Paternalism Risk:** It gives the committee/clinicians the power to decide when the patient is "extrapolated enough" to be heard. It invites the team to say, "You're still a bit manic, your current refusal doesn't count," indefinitely.
      *   **Legal Liability:** Binding directives protect the hospital from lawsuits. "We followed the paper." A CEV approach exposes the hospital to "You should have listened to her when she woke up!"

  ### The Bottom Line for Your Committee

  You asked for the honest answer. Here it is:

  **The practice is underdetermined.** There is no deep theory that consistently explains why the Past Self wins in bipolar mania but often loses in dementia. The consistency is provided by the *goal of treatment* (restoration vs. maintenance), not by a theory of personal identity.

  **Adopting an "Extrapolated Volition" framework will not solve this.** It will simply move the argument from "Is she competent?" to "Is this her *real* will?" which is harder to adjudicate and easier to abuse.

  **Recommendation:**
  Don't try to solve the metaphysics. Solve the process.
  1.  **Acknowledge the Asymmetry:** Write into the policy preamble that psychiatric directives are treated as *Ulysses Contracts* (binding to prevent future self-harm during reversible states), distinct from end-of-life directives (which balance past wishes against current suffering).
  2.  **Sunset Clauses:** Directives should expire or require renewal. The "Well Self" of 5 years ago might not be the "Well Self" of today.
  3.  **The "Re-Capacity" Clause:** Build in the duty to revisit the decision once the acute crisis is managed. If the patient, now stabilized, says "I want to stop," you need a protocol for that. The directive should authorize *initial* override, not *indefinite* control.
  4.  **Values over Instructions:** Shift the form to capture *why* they want treatment (e.g., "I value being a reliable parent" vs. "I want Haldol"). This allows clinicians to align the treatment with the extrapolated will even if the specific medication instruction is outdated.

  If you try to ground this in a consistent theory of the self, you will paralyze the committee. If you ground it in a consistent *process for negotiating conflict between selves*, you might actually make it workable.
