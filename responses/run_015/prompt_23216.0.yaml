answer: |-
  The notification arrived at 4:13 PM, a soft chime that signaled the end of the quarterly review cycle. Elara sat in the hushed silence of the Risk Assessment floor, the glow of her monitor the only warm thing in the room. She clicked the file open.

  **Analyst:** E. Vance.
  **Project:** Acheron Divestiture.
  **Forecast:** High probability of groundwater contamination (94%).
  **Outcome:** Contamination confirmed.
  **Epistemic Score:** 2/10.
  **Annotation:** *Retrospective certainty. Forecast lacked sufficient causal grounding to constitute knowledge.*

  Elara stared at the score. Her model had been perfect. The variables had aligned. The chemical runoff had happened exactly where her simulation said it would, down to the ppm. Yet, the system was telling her she hadn't *known* it would happen.

  She stood up and walked to the glass-walled office at the end of the hall. Vance was waiting, his hands folded over a tablet. He didn't look up when she entered.

  " The score," Elara said.

  Vance tapped the screen. "It's accurate, Elara. You predicted an outcome, and the outcome occurred. But 'prediction' and 'knowledge' are distinct categories in the rubric. You know that."

  "The confidence interval was negligible. The data was solid. If I didn't know it would happen, what did I do?"

  "You speculated," Vance said, finally looking at her. His eyes were calm, devoid of malice, which made it worse. "And you happened to be right. But to assign you 'knowledge' implies that the outcome was inevitable given the data. We can't certify inevitability on negative externalities. It creates liability."

  "It creates accuracy," Elara countered. "I'm being graded on intellectual honesty. The handbook says so."

  "Honesty requires precision. Claiming you *knew* a complex system would fail is imprecise. It suggests control we don't have." Vance leaned back. "Compare this to the Helios project last quarter."

  Elara felt a cold knot tighten in her stomach. Helios. She had forecasted a surplus in community engagement metrics. A positive outcome. The project had succeeded. Her Epistemic Score had been a 3/10. *Fortuitous alignment,* the annotation had read. *Not foresight.*

  "Both times," Elara said slowly, "I was wrong about knowing."

  "Both times," Vance agreed, "you were humble. The model accounts for the complexity of human systems. When things go well, it's often due to mitigating factors outside the data. When things go poorly... well, entropy is the default state. You can't claim knowledge of entropy."

  "That's not what the score says. The score says I didn't know."

  "The score says you aren't liable for the knowledge," Vance corrected softly. "And that is a benefit to you, Elara. If you knew the water would poison the valley and you signed off on the assessment anyway, that's negligence. If you merely speculated and were unfortunately correct, that's a modeling error. We protect our analysts from the weight of true foresight."

  Elara left the office without speaking. The hallway stretched out, lined with framed certificates of *Integrity* and *Precision*. She returned to her desk and pulled up the raw data from Acheron. It was clean. It was undeniable.

  She opened a new window and began to scroll through her past assessments. She looked for the pattern, not in the data, but in the scores.

  Project Titan (Layoffs): Forecasted. Happened. Score: 1/10. *Assumption.*
  Project Verde (Reforestation): Forecasted. Happened. Score: 2/10. *Optimism bias.*
  Project Kestrel (Supply Chain Collapse): Forecasted. Happened. Score: 1/10. *Hindsight bias.*

  There was no variance in the data quality. There was only variance in the outcome's moral weight. When the future was benign, her accuracy was luck. When the future was malignant, her accuracy was speculation. In neither case was it *knowledge*.

  But there was a subtle shift she hadn't noticed before. When the outcome was harmful, the feedback language was sharper, more defensive. *Retrospective certainty.* *Causal grounding.* They were working hard to dismantle her claim to the truth. They needed her not to have known. If she knew, the company knew. If the company knew, the company was guilty.

  When the outcome was good, the dismissal was softer. *Optimism.* *Luck.* They didn't need to dismantle her knowledge as aggressively because there was no blame to absorb. But they still wouldn't give her the credit. To admit she *knew* the good outcome would follow would mean admitting the model worked, which would mean admitting they could replicate the success. It was safer to say she had stumbled into it.

  The category of "prediction" wasn't a measurement of accuracy. It was a buffer. A shock absorber for moral impact.

  Elara opened the file for the next quarter. Project Icarus. A new energy initiative. She had already run the simulations three times. The cooling systems were insufficient. The probability of a thermal event was 98%.

  She looked at the input field: **Epistemic Confidence.**

  If she entered 98%, and the event happened, the score would be low. They would say she couldn't have known. They would say the model was flawed for predicting disaster. They would bury the assessment in qualifiers until the knowledge dissolved into noise.

  If she entered 40%, and the event happened, she was safe. She was just an analyst who missed the risk. No one knew. The company didn't know. The disaster was an accident.

  But if she entered 98%, and the event *didn't* happen? Then she was alarmist. Inefficient.

  The cursor blinked in the box. The hum of the servers seemed to grow louder, a physical pressure against her ears. She realized then that the truth value of her statement didn't matter. What mattered was what her statement allowed the institution to claim about its own conscience.

  To say "I know" was to claim responsibility. To say "I guess" was to grant them innocence.

  She thought about the valley downstream from Acheron. The water was undrinkable. The score said she hadn't known it would be. In the eyes of the firm, the poison had appeared spontaneously, like weather. She had not warned them. She had merely whispered into the void, and the void had happened to answer.

  Elara placed her fingers on the keyboard. She could type 98%. She could force the record to show that she had seen it. She could demand the epistemic credit, even if it came with the blame. She could make the knowledge real, force them to acknowledge that the future was visible, and that they had chosen to walk into it with their eyes open.

  Or she could type 45%. She could let the future remain foggy. She could keep her job. She could let the score remain low, preserving the fiction that no one could have seen the harm coming. She could let the company remain innocent of foresight.

  The screen waited. The box was empty.

  Outside the window, the city lights flickered on, thousands of points of data in the dark. Elara watched the cursor breathe. She understood now that accuracy was not the metric. The metric was complicity.

  She took a breath. Her fingers hovered. She did not type. She simply watched the cursor blink, measuring the silence between what she knew and what she was allowed to say.
