answer: |-
  Here is a seminar plan designed to dismantle the "utility = happiness" equation while preserving the technical utility of the apparatus for future policy work.

  ### The Core Strategy: Informational Scarcity
  Your goal is to convince them that Revealed Preference (RP) utility is **informationally impoverished** compared to what they think it is. It contains *only* ranking data, *only* derived from choice, with *no* bridge to welfare. The Cardinal/Ordinal distinction is not a distraction; it is the **linchpin**. Without it, you cannot explain *why* the numbers don't measure intensity of desire or welfare. If utility is just a ranking (ordinal), it mathematically cannot measure "how much better off" someone is.

  ### The Carrying Example: The "Commute Trade-Off"
  Do not use fruit. Do not use money alone. Use **Commute Profiles**.
  *   **Option A:** 30 mins, 1 accident/year per 10k drivers.
  *   **Option B:** 45 mins, 0 accidents/year.
  *   **Option C:** 20 mins, 3 accidents/year per 10k drivers.

  **Why this works:**
  1.  **Avoids the Fruit Trap:** There is no obvious "more is better" metric (unlike apples). Time is bad, Risk is bad. Students cannot silently impute a "goodness" quantity without thinking.
  2.  **CBA Relevance:** Directly mirrors the cost-benefit analysis they will encounter (Value of Statistical Life vs. Time Savings).
  3.  **Welfare Tension:** If a student chooses A over B, RP says $U(A) > U(B)$. Welfare intuition asks: "But isn't B safer?" This creates the friction you need.

  ---

  ### The Session Plan (75 Minutes)

  #### 1. Diagnostic & Setup (10 mins)
  *   **Action:** Write "UTILITY" on the board. Ask for one-word associations.
  *   **Expected Output:** Econ side: "Preference," "Maximization." Phil side: "Happiness," "Well-being."
  *   **Move:** Do not correct them yet. Circle "Happiness" and "Preference." Tell them: "Last week (EUT), we treated utility as a number that handles risk. This week (RP), we treat utility as a shadow cast by choice. By the end, you must know which of these words survives."
  *   **Why:** Establishes the stakes immediately. Validates both cohorts' intuitions before challenging them.

  #### 2. Choice $\to$ Preference $\to$ Numbers (25 mins)
  *   **The Example:** Present the Commute Profiles (A, B, C).
  *   **Step 1 (Choice):** "Suppose I choose A when {A, B} are available. I choose B when {B, C} are available. I choose A when {A, C} are available."
  *   **Step 2 (WARP Check):** Ask them to check for consistency. (This is familiar from last year).
  *   **Step 3 (The Reconstruction):** "We observe the choice. We *define* preference as the relation that makes the choice consistent. We *assign* numbers (utility) to represent that relation."
  *   **Crucial Intervention (The Behaviorism Trap):**
      *   *Phil Students* will object: "But maybe you chose A because you were confused!"
      *   *Response:* "RP theory assumes choice is the primitive. We are not modeling psychology; we are modeling the *structure* of agency. If you want to model confusion, you need a different model. RP takes choice as truth." (Head off the behaviorism debate here; don't let it derail the logic).
      *   *Econ Students* will assume: "So A is better for me."
      *   *Response:* "A is *chosen* over B. 'Better' is a word we haven't earned yet."

  #### 3. The Linchpin: Ordinality vs. Cardinality (20 mins)
  *   **This is where you spend your political capital.**
  *   **Action:** Assign utility values to the Commute choices. $U(A)=10, U(B)=5, U(C)=0$.
  *   **Question:** "Can I change these numbers?"
  *   **Demonstration:** Show that $U^*(A)=100, U^*(B)=50, U^*(C)=1$ works fine. Any monotonic transformation works.
  *   **The Contrast:** Remind them of Last Week (EUT). "In EUT, if I offered a lottery between A and C, could I use these new numbers ($U^*$)?"
      *   *Answer:* No. EUT requires cardinal utility (positive affine transformations only) to preserve risk attitudes. RP only requires ordinal.
  *   **The Payoff:** "If RP utility can be stretched arbitrarily without changing the theory, **it cannot measure intensity.** It cannot measure 'how much' I prefer A. It only measures 'that' I prefer A."
  *   **Why here?** You must establish the *emptiness* of the numbers before you discuss welfare. If they think the numbers measure intensity, they will think they measure welfare.

  #### 4. The Welfare Gap & CBA Anxiety (15 mins)
  *   **The Pivot:** "So, if I choose the dangerous commute (A) over the safe one (B), $U(A) > U(B)$. Does this mean A improves my welfare?"
  *   **The Trap:** Students will say "Yes, by definition."
  *   **The Counter:** "What if I chose A because I was misinformed about the risk? What if I chose A because I'm addicted to speed? RP theory doesn't care. It only tracks choice."
  *   **The CBA Connection:** "In two years, you will be asked to put a number on a life to justify a road scheme. You will use a model built on RP. If you think that number represents 'happiness' or 'true value,' you will make ethical errors. If you think it represents 'what people will choose given these constraints,' you can use it responsibly."
  *   **Goal:** Hold the tension. The apparatus is useful (predicts choice), but ontologically thin (doesn't measure goodness).

  #### 5. Final Assessment Question (5 mins)
  *   **Do not ask:** "Define WARP."
  *   **Ask:** "A government agency observes that citizens choose high-risk commutes when taxes are low, and low-risk commutes when taxes are high. They assign utility numbers to these choices to calculate 'social benefit.' **What specific information is missing from those utility numbers that prevents them from being a direct measure of citizen welfare?**"
  *   **Correct Answer Key:** They must mention **intensity** (ordinal vs cardinal) OR **mistakes/information** (choice $\neq$ good). If they say "The numbers are arbitrary," that works. If they say "Because utility isn't happiness," that's memorization. You want the structural reason (ordinality).

  ---

  ### Misconception Map

  | Cohort | Primary Misconception | Where to Head It Off | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **Econ / PPE** | **"Utility = Welfare."** They think fitting the function reveals the agent's true good. | **Section 3 (Ordinality).** | Show that $U=10$ vs $U=5$ means nothing about the *gap* in well-being. The gap is arbitrary. |
  | **Econ / PPE** | **"WARP = Rationality."** They treat consistency as a normative virtue rather than a modeling constraint. | **Section 2 (WARP Check).** | Frame WARP as "intelligibility." If you violate WARP, we literally cannot model you as having a preference relation. It's not 'irrational,' it's 'unmodelable.' |
  | **Philosophy** | **"Behaviorism."** They think RP denies the existence of mental states. | **Section 2 (Reconstruction).** | Clarify: RP is agnostic, not denialist. It brackets mental states to focus on public data. It's a methodological constraint, not a metaphysical claim. |
  | **Philosophy** | **"Indifference = Equality."** They think if I could choose either, the outcomes are 'equal' in value. | **Section 2 (Choice).** | Emphasize: Indifference is a residual category. It means "no choice was made." It does not mean "the options are identical in properties." |
  | **Both** | **"More Options = Better."** They assume expanding the choice set always increases utility/welfare. | **Section 4 (Welfare).** | Use the "Temptation" angle. Sometimes more options (e.g., adding a dangerous route) lower welfare even if choice is respected. |

  ---

  ### What to Exclude (and Defend to the Convener)
  *   **Afriat's Theorem:** Too technical. It proves the existence of a utility function for finite data, but your point is about the *meaning* of that function, not its existence.
  *   **Strong Axiom (SARP):** WARP is sufficient for 2nd years to grasp the logic. SARP adds integrability conditions that distract from the philosophical payoff.
  *   **Integrability:** Completely out. This is about recovering demand functions, not the ontology of utility.

  **Defense to Convener:** "The learning objective is conceptual clarity on the ontology of utility, not technical proficiency in demand theory. Afriat/SARP would consume the time needed to dismantle the welfare misconception, which is the primary philosophical payload of this seminar."

  ### Contingency: Cutting 10 Minutes
  *   **Cut:** The formal demonstration of **Ordinal Transformations** in Section 3.
  *   **Keep:** The *claim* that RP utility is ordinal and EUT utility is cardinal.
  *   **Change:** Instead of showing the math of $f(U)$, simply state: "In RP, only the ranking matters. In EUT, the spacing matters."
  *   **Risk:** Students might not *feel* why ordinality kills welfare claims.
  *   **Mitigation:** Use a stronger verbal analogy. "Ordinal utility is like a podium (1st, 2nd, 3rd). Cardinal utility is like a stopwatch. You can't measure 'how much faster' with a podium."
  *   **What would change my mind?** If you discover the students are mathematically weaker than expected. If they struggle with WARP, cut the EUT contrast (Section 3) and focus entirely on Choice $\neq$ Welfare. However, without the Cardinal/Ordinal contrast, the "Choice $\neq$ Welfare" point loses its technical grounding. I would only cut the EUT contrast if the room is visibly drowning in the WARP logic.

  ### Where My Advice is Least Confident
  **The Cardinal/Ordinal Timing.**
  I am advising you to place this *before* the Welfare discussion (Section 3 before Section 4).
  *   *Risk:* It is the most technical part of the session. If you lose them here, the Welfare discussion feels like hand-waving.
  *   *Alternative:* You could move it *after* the Welfare discussion as the "proof."
  *   *Why I stuck with Before:* You need the students to understand the numbers are "empty" (ordinal) *before* you ask them to stop treating the numbers as "full" (welfare). If they think the numbers have intensity, they will resist the welfare critique.
  *   *Watch the room:* If eyes glaze during the transformation math, pivot immediately to the "Podium vs. Stopwatch" analogy and move on. Do not get bogged down in affine transformations.

  ### Final Note on the "Unease"
  To achieve the balance of "unease but not worthless":
  Explicitly state: **"The numbers are not found in nature, but they are necessary for coordination."**
  We use RP utility not because it is *true* about the soul, but because it is *stable* enough to build roads on. The ethical burden lies in remembering the gap between the model and the human. This validates the Econ students' tool while validating the Phil students' critique.
