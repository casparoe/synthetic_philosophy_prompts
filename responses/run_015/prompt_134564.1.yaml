  2.  **Deconstruct the Core Problem:**
      *   The students treat "utility" as a psychological substance (hedonics) that causes choice.
      *   RP theory says: Choice is the primitive. Preference is a formal reconstruction of choice. Utility is just a number system mapping that reconstruction.
      *   The gap: RP utility tells you what they *chose*, not whether they are *better off* (welfare).
      *   The Cardinal/Ordinal issue: EUT requires cardinal utility (risk attitudes matter). RP (standard consumer theory) usually only requires ordinal utility (ranking matters). Confusing these leads to thinking RP utility measures "intensity" of desire or welfare.
