answer: |-
  ### The Thought Experiment

  Consider a child born with a severe congenital cognitive impairment that precludes the development of language, self-awareness, or any capacity for moral reasoning, and who endures constant physical pain until an early death. According to the impersonal-causal reading, this suffering is the precise ripening (*vipāka*) of a violent, intentional act committed by a predecessor in the same rebirth stream; the causal chain from that past volition (*cetana*) to the current biological defect is complete, unbroken, and operates with the necessity of a natural law. The past action deposited a karmic seed that necessitated this specific physiological outcome, regardless of the current subject's internal state.

  However, the child lacks the cognitive architecture required to recognize the suffering as a consequence, to learn from it, or to exercise agency in response to it. On standard accounts of moral desert, a subject must be capable of understanding the connection between a norm and a sanction to truly *deserve* that sanction in a retributive or pedagogical sense. While the causal history explains *why* the pain exists, the current subject's total incapacity for moral address means they cannot satisfy the necessary condition of being an appropriate target for desert. The suffering is causally necessitated by past agency, but it is not deserved by the present sufferer.

  ### Analysis of the Readings

  **Impersonal-Causal Reading:** This view treats karma as a normative-free mechanism akin to gravity or thermodynamics. It asserts that the scenario is coherent: a past volition created a causal trajectory that inevitably resulted in present suffering. The moral status of the *current* subject is irrelevant because the law operates on the continuity of the causal stream (*santana*), not on the moral competence of the momentary experiencer. The explanation is sufficient because the etiology is complete.

  **Moral Desert Reading:** This view treats karma as a system of cosmic justice where suffering is a fitting response to moral failure. In this scenario, the desert reading fails because the condition of **moral competence** (or the capacity for moral address) is not met. For suffering to be *deserved* rather than merely *caused*, the sufferer must typically be capable of recognizing the justice of the outcome or utilizing it for moral growth. Since the child cannot comprehend the connection, attributing "desert" transforms the system from justice into arbitrary infliction, violating the conceptual link between responsibility and liability.

  **The Feature Doing the Work:** The decisive feature is the **present subject's incapacity for moral agency/recognition**. This isolates the causal history from the current moral status.

  **If Removed:** If the feature is removed—i.e., if the sufferer is a cognitively intact adult who can understand their suffering as a consequence of past action and respond morally—the desert reading regains plausibility. The suffering could then be interpreted as just punishment or a pedagogical opportunity, aligning the causal outcome with the subject's moral capacity.

  ### Scholarly Consensus vs. Contested Interpretations

  **Settled Among Scholars:**
  1.  **Causality is Central:** There is consensus across Buddhist and Brahmanical studies that karma is fundamentally a theory of action and causality (*karma* literally means "action"). It is not merely fate; it is tied to volition (especially in Buddhism) or ritual action (in Vedic contexts).
  2.  **Rebirth Context:** Scholars agree that classical karma theories are inextricably linked to rebirth (*samsara*); the "fruits" (*phala*) often ripen in future lives, making empirical verification impossible by design.
  3.  **Soteriological Goal:** There is agreement that the ultimate goal in classical systems (Moksha/Nirvana) involves escaping the karmic mechanism entirely, suggesting the mechanism itself is binding rather than purely benevolent.

  **Genuinely Contested:**
  1.  **Retributive Justice vs. Natural Law:** It is highly contested whether classical texts conceive of karma as a moral retributive system (where suffering is *punishment* administered by a moral order) or as an amoral natural law (where suffering is simply an *effect*, like a seed becoming a plant). While popular piety often conflates the two, scholars like Johannes Bronkhorst and Bruce Reichenbach have debated whether the "moral justice" interpretation is a later development or a Western projection onto a more mechanistic ancient system.
  2.  **The Role of Divine Agency:** In Hindu traditions, it is contested whether karma operates automatically (as in Mimamsa) or is administered by God (as in some Vedanta schools). This impacts whether "desert" implies a divine judge or an impersonal process.
  3.  **Identity and Desert:** Scholars dispute whether classical authors recognized the "problem of identity" (i.e., whether the reborn person is the *same* enough to deserve the past agent's consequences). Some argue the *anatta* (no-self) doctrine in Buddhism undermines strong desert claims, while others argue the continuity of the causal stream is sufficient for traditional accounts of responsibility. Do not present the "karma is justice" view as the unanimous classical position; it is often a specific interpretive layer.
