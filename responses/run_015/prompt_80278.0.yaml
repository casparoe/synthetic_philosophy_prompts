      *   *Need a sharper wedge.* **The condition of 'Moral Competence' at the time of suffering.** If the suffering prevents moral growth, is it desert?
      *   *Let's try the **Involuntary Action** angle.** In some schools, karma accumulates even without full intent (though *cetana* is key in Buddhism). In Hinduism, *karma* can be ritualistic.
      *   *Okay, let's look at the prompt again:* "at least one standard condition for desert is not met." Standard conditions for desert: Agency, Causality, Knowledge, Identity.
      *   *Idea:* **The Forgotten Intention.** The agent intended good, but the causal outcome was bad (moral luck), OR the agent intended bad, but the current self is so discontinuous they are effectively a different person.
      *   *Let's go with **Radical Psychological Discontinuity**.*
