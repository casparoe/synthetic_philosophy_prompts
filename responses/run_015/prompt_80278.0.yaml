      *   *Let's try the "Innocent Inheritor" scenario.* A person suffers due to a past life action they not only don't remember but would fundamentally reject.
      *   *Better yet:* **The Unintended Consequence of a Virtuous Act.** No, that doesn't break desert.
      *   *Best bet:* **The Memory/Identity Gap.** Standard theories of desert require the subject to be the *same* agent. Rebirth posits continuity, but if we isolate a case where psychological continuity is severed (amnesia of past life is standard), does desert hold?
      *   *Wait, I need to ensure the causal chain is unbroken.*
      *   *Let's focus on the condition of **Knowledge/Recognition**.* For punishment to be deserved (retributively), the subject usually needs to understand *why* they are being punished. If the mechanism is purely causal (like touching fire burns), understanding isn't needed. If it's desert, understanding matters.
