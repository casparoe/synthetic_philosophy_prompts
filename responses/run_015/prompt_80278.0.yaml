prompt: |-
  I'm a PhD student in the philosophy of religion working on whether karma is best understood as a theory of moral desert or as an impersonal causal law, and I need a thought experiment that isolates the difference. Construct a scenario -- realistic, at most two paragraphs, no metaphysics beyond rebirth itself -- in which a person's present suffering is fully explained by the impersonal-causal reading (the causal chain from a past-life intentional action to current suffering is complete and unbroken) but the desert reading fails (the person does not deserve the suffering because at least one standard condition for desert is not met). The direction matters: I want causation without desert, not the reverse, because the popular reading that your suffering is what you deserve conflates the two. After the scenario, walk through what each reading says and why, identify which feature of the case is doing the work, and say what happens if that feature is removed. Finally, separate what is settled among scholars of Indian philosophy from what is genuinely contested about whether the classical texts support the desert reading, and do not present a contested interpretive view as the consensus.
