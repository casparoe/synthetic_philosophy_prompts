      *   *Bronkhorst, Reichenbach, etc.:* Some argue early Buddhism is more causal/naturalistic. Later traditions moralize it more.
      *   *Hinduism:* Mimamsa sees it as automatic (apurna). Vedanta might see it as God-administered (Ishvara).
      *   *Key distinction:* Do not say "Scholars agree karma is not desert." Say "Scholars agree karma involves causality; they disagree on whether that causality entails moral desert in the Western retributive sense."
      *   *Specifics:* The "moral justice" interpretation is often a Western projection (e.g., Theosophy, popular New Age). Classical texts vary. Buddhism emphasizes *dukkha* and cessation, not necessarily "getting what you deserve" in a cosmic justice sense, though popular piety leans that way.

