answer: |-
  Here are two candidate principles constructed to systematize your intuitions. Each is designed to handle the bulk of your cases, but each exacts a specific cost regarding the verdicts you have already committed to.

  ### Principle 1: The Synchronous Functional Unity Principle (SFUP)

  **Statement:** The number of subjects is equal to the number of distinct information-processing systems that possess mutual, low-latency access to a common pool of representational states within the window of the specious present (roughly 300 milliseconds).

  **Clauses and Case Ties:**
  1.  **Mutual Access Clause:** Integration must be bidirectional. If System A can access System B's states but not vice versa, they are not unified.
      *   *Tied to:* Your **One-Way Bridge** intuition (implied). This clause ensures that asymmetric control does not count as unity.
  2.  **Latency Clause:** Information transfer must occur fast enough to be utilized in a single decision cycle. If the delay exceeds the integration window, the systems count as distinct.
      *   *Tied to:* Your **Delayed Bridge** hesitation. This clause provides the mechanism for why delay might split a subject.
  3.  **Capacity Clause:** The bandwidth must be sufficient to resolve conflict. If two systems generate conflicting motor commands that cannot be arbitrated in real-time, they count as distinct.
      *   *Tied to:* Your **Classic Lab Setup** (60/40 lean toward two). In the lab, the conflict is explicit and unarbitrated, satisfying the condition for distinctness.
  4.  **Adaptation Clause:** If a system develops without high-bandwidth connections but achieves behavioral unity through subcortical or external cues, it counts as one.
      *   *Tied to:* Your **Agenesis** and **Breakfast** verdicts. This explains why a patient at breakfast (using cross-cueing) or born without a callosum is one subject despite low callosal bandwidth.

  **Predictions for New Cases:**
  *   **Delayed Bridge:** **Two subjects.** If the delay exceeds the specious present, mutual access within a single decision cycle is impossible. The principle demands a cutoff; 0.5 seconds is likely over the limit for unified agency.
  *   **One-Way Bridge:** **Two subjects.** Bidirectionality is a necessary condition for a single phenomenal field.
  *   **Ramp-Up Bridge:** **There is a threshold.** As bandwidth increases and latency drops, there is a specific point where the systems cross the capacity to arbitrate conflict within the specious present. Below that point, there are two subjects; above it, there is one.

  **Cost:**
  To accept SFUP, you must give up your verdict on the **Two-Person High-Bandwidth Bridge**. You stated there are two subjects there, but SFUP dictates **one subject**. If the bridge carries *more* information than a healthy callosum with *less* delay, the functional definition of a subject is met. Your intuition that "two already-existing subjects cannot fuse" is explicitly rejected by this principle; it views subjecthood as a functional state, not a historical property.

  ### Principle 2: The Biographical Continuity Principle (BCP)

  **Statement:** The number of subjects is equal to the number of distinct developmental lineages of neural tissue, unless a single lineage is physically severed and fails to re-establish functional coherence through secondary mechanisms.

  **Clauses and Case Ties:**
  1.  **Origin Clause:** A subject begins with a specific fertilized egg and developmental trajectory. Distinct bodies imply distinct subjects regardless of connection.
      *   *Tied to:* Your **Two-Person Bridge** verdicts (both high and low bandwidth). This preserves the intuition that you cannot fuse two people into one mind simply by wiring them together.
  2.  **Severance Clause:** If a single lineage is physically cut (callosotomy), the default count remains one *unless* the cut produces permanent, unresolvable functional dissociation.
      *   *Tied to:* Your **Breakfast** verdict. Because the patient functions as one in daily life, the severance is functionally healed, preserving the single subject count.
  3.  **Subtraction Clause:** Removing part of a lineage does not create a new subject; it merely diminishes the existing one.
      *   *Tied to:* Your **Hemispherectomy** verdict. One hemisphere removed leaves one subject, resolving the conflict you noted between this case and the split-brain case.
  4.  **Coherence Exception:** If a severed lineage demonstrates sustained, incompatible streams of consciousness that cannot be integrated by subcortical means, the count may shift to two.
      *   *Tied to:* Your **Classic Lab Setup** (the 40% lean toward two). This allows for the possibility of two subjects in the lab without contradicting the breakfast case.

  **Predictions for New Cases:**
  *   **Delayed Bridge:** **Two subjects.** The origin of the tissue matters more than the quality of the connection.
  *   **One-Way Bridge:** **Two subjects.** Distinct lineages remain distinct regardless of information flow direction.
  *   **Ramp-Up Bridge:** **No threshold.** There is no point at which two become one. You can increase bandwidth to infinity, but because the developmental lineages are distinct, the subject count remains two. Subjecthood is discrete, not analog.

  **Cost:**
  To accept BCP, you must give up your verdict on the **Classic Lab Setup**. You lean toward two subjects here, but BCP strongly favors **one subject**. Since the tissue comes from a single developmental lineage and the patient reintegrates functionally outside the lab (Breakfast case), the lab dissociation is merely a temporary functional glitch, not a fission of the subject. This aligns you with your friend's view: the patient is one subject whose access is experimentally constrained.

  ### The Pivot Case

  The single case that, if changed, would bring the rest of your verdicts into line is the **Two-Person High-Bandwidth Bridge**.

  Currently, this is the verdict you admit you can "least defend." It is the anchor for your resistance to pure functionalism. If you change this verdict to **One Subject**, you validate the **Synchronous Functional Unity Principle**. This immediately stabilizes your view on the **Classic Lab Setup**: if subjecthood is purely functional, then the lab patient (where function is split) is clearly **Two Subjects**, and the breakfast patient (where function is unified) is **One Subject**. This resolves your wobble on the lab case without needing ad-hoc clauses about history.

  Furthermore, accepting that the Bridge creates one subject dissolves your worry about the **Hemispherectomy** case. If a single hemisphere can support a whole subject functionally, then two disconnected hemispheres support two subjects functionally. The only thing stopping you from seeing this clearly is the historical prejudice that two *people* can't become one. If you drop that prejudice for the hypothetical bridge, you can apply the same functional logic to the split-brain patient.

  If, however, you hold firm that the Bridge must be **Two Subjects**, you are forced into the **Biographical Continuity Principle**. This forces you to concede the argument to your friend regarding the **Classic Lab Setup**. You would have to admit that the patient is **One Subject** in the lab, just as they are at breakfast, and that the dissociation is merely a limitation of access, not a multiplication of selves.

  You cannot have it both ways. Either subjecthood is a functional state (which allows fusion and fission), or it is a historical property (which prevents fusion but makes the lab findings mere artifacts). Changing your mind on the Bridge case decides which metaphysics you inhabit.
