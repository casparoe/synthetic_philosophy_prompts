  Here is an analysis of your verdicts, a principle that unifies them, a prediction for your upload case, and advice on where to flex if the tension becomes unmanageable.

  ### 1. The Unifying Principle
  There is no single principle of *material constitution* that saves all five verdicts, because your verdicts consistently deny that matter is the source of identity. (In the marble and synthetic cases, matter changes but identity remains; in the bronze and ice cases, matter persists but identity is lost.)

  However, there is a single principle of **Causal-Functional Continuity** that accommodates all five:

  > **An entity survives if and only if there is a spatiotemporally continuous chain of causal realization of its essential properties.**

  *   **Essential Properties:** For statues, it is *Form*. For persons, it is *Psychology/Consciousness*. For clay models, it is *Material Constitution* (as a mold).
  *   **Continuous Chain:** There can be no gaps in the existence of these properties.

  **How it fits your verdicts:**
  *   **Marble Statue:** Form is continuously realized, even as matter swaps. (Survival)
  *   **Clay Model:** The essential property (being a solid mold) is causally destroyed in the casting. The chain breaks. (Death)
  *   **Synthetic Replacement:** Psychology is continuously realized via gradual substitution. (Survival)
  *   **Synthetic Scan:** The chain branches. You have two simultaneous realizations of the psychology. Your intuition that this creates "two claimants" aligns with the **Non-Branching Clause**: identity cannot divide. (Split)
  *   **Ice Sculpture:** The essential property (structured form) ceases to exist when melted. Refreezing creates a *new* chain, even with the same water. The gap breaks continuity. (Death/Imitation)
  *   **Melted Bronze:** The essential property (Statue-Form) is lost. The matter persists, but the "statue" chain is terminated. (Death)

  ### 2. Prediction: The Upload Case
  **Scenario:** Consciousness uploaded to digital substrate (continuous update); biological body left intact but unconscious.

  **Verdict:** **Two Claimants (The Split).**

  **Reasoning:**
  Your intuition in Case 3b (the scan) establishes that you adhere to a **Non-Branching** view of personal identity. You feel that if a copy is made while the original persists (or can persist), identity does not transfer; it duplicates.

  In this upload scenario, the biological body is "left intact." This implies the biological substrate for consciousness is not destroyed, merely dormant.
  *   **If the body can wake up:** You have successfully created a branching path. The digital entity and the biological entity are distinct claimants with equal right to the past.
  *   **If the body is permanently unconscious (vegetative):** You have effectively ended the biological causal chain. The digital entity becomes the sole survivor, similar to the Synthetic Replacement case.

  **Narrative Prediction:**
  For maximum tension consistent with your Case 3b intuition, treat the "intact body" as a ticking bomb. As long as the body *could* wake up, the digital protagonist is philosophically unstable—a duplicate waiting to be challenged. If the body wakes, you have a legal and metaphysical crisis: which one is the "real" protagonist? Your own intuitions suggest **neither** is the *original* in a singular sense; they are both successors to a vanished predecessor.

  ### 3. Which Verdict to Abandon?
  If you find this framework too complex and need to simplify your metaphysical landscape for the sake of the narrative, you have one primary tension point: **The Ice Sculpture (Case 4).**

  **The Conflict:**
  *   **Marble (Case 1):** Matter changes, Form continuous $\rightarrow$ **Same.**
  *   **Ice (Case 4):** Matter same, Form interrupted then restored $\rightarrow$ **Different.**

  This is the hardest verdict to defend logically if you prioritize Form over Matter. If the *Form* is what makes the statue (as Case 1 and 5 suggest), then restoring the Form should restore the identity. By saying the Ice Sculpture is an "imitation," you are prioritizing **Spatiotemporal Continuity** over **Form**.

  **Recommendation:**
  *   **Keep the Ice Verdict.** It is the most poetically resonant. It speaks to the fragility of life and the irreversibility of time—themes essential to fiction. It reinforces that *history* matters, not just shape.
  *   **Abandon the "Single Material Principle" Quest.** Do not try to force a materialist explanation (e.g., "atoms make the soul"). Your intuitions are already post-materialist. You believe in **Pattern** and **History**, not **Stuff**.

  **Alternative: The Clay Verdict (Case 2)**
  If you want to emphasize transformation over destruction, you could soften the Clay verdict. You could argue the clay *becomes* the bronze (Aristotelian hylomorphism). However, this contradicts your Synthetic Replacement intuition where the *cells* die but the *person* lives. In the Clay case, the *mold* dies. Keeping the Clay verdict as "Death" maintains the distinction between **Tools** (Clay) and **Beings** (Persons/Statues).

  ### 4. Narrative Advice
  Your confusion is not a bug; it is a feature. The fact that you cannot articulate a single *material* principle is because your story is exploring the limits of materialism.

  *   **Use the Ice Case** to symbolize things that cannot be resurrected (love, trust, specific moments).
  *   **Use the Synthetic Case** to explore what makes us human (memory, continuity) vs. what makes us meat (cells).
  *   **Use the Upload/Scan Case** to introduce the horror of duplication. If your protagonist uploads while the body remains, do not give them the comfort of knowing they are the "same." Let them fear they are the copy.

  **Final Verdict:** You do not need to abandon a judgment. You need to adopt the principle of **Continuous Causal Realization**. It validates all five of your intuitions without requiring you to betray your sense of narrative truth. For the upload case, let the intact body haunt the digital mind; as long as the shell breathes, the soul is divided.
