answer: |-
  Here is a Q&A prep sheet tailored to your specific audience composition and argument structure.

  ### Preemptive Concessions (Make these in your first 5 minutes)
  *Do not wait for them to pounce. Disarm the turf-protectors early.*

  1.  **To the Choice-Theoretic Welfare Group:** Explicitly acknowledge Bernheim, Rangel, and Salant. State clearly: *"I am not proposing a new axiomatic system to replace yours. I am offering a philosophical justification for why your 'welfare-relevant ancillary conditions' should be treated as evidential constraints rather than modeling assumptions. I am arguing for the normativity of your axioms, not their mathematical novelty."*
  2.  **To the Applied Micro Group:** Concede on noise. *"My invariance protocol is an idealization. In practice, this requires a statistical threshold for 'invariance' given finite data. I am not proposing we discard discrete choice models, but that we flag parameters derived from unstable frames as structurally unidentified for welfare purposes."*
  3.  **To the Senior Theorist:** Clarify your normative stance. *"I am not arguing we should return to hedonism. I am arguing that if policy mandates maximizing welfare, we must admit when the evidence for welfare is absent. This is a plea for epistemic humility, not a metaphysical claim about the good."*

  ---

  ### The Q&A Prep Sheet (8 Objections)

  #### 1. The "Prediction vs. Truth" Objection
  *   **Who:** Applied Micro/Behavioral Economist (Latent Index crowd).
  *   **Phrasing:** "You're conflating the purpose of the model. My utility function is a latent index designed to minimize out-of-sample prediction error. If the default option predicts choice 90% of the time, that's a useful parameter. Why should I care if that parameter maps to 'welfare'? If I discard it, my model predicts worse. Are you asking me to sacrifice predictive accuracy for a philosophical purity that doesn't help the agency build the app?"
  *   **Threat Level:** High. This attacks the practical utility of your protocol.
  *   **2-Minute Reply:**
      *   Distinguish *prediction of behavior* from *prediction of welfare*.
      *   "I agree your model predicts *choice*. My claim is that it fails to identify *welfare* when the choice is frame-dependent."
      *   "If the agency's mandate is to maximize rider well-being (as you suggested in the workshop theme), using a parameter that flips when you change the font size is not 'less pure,' it's *biased*."
      *   "Keep your latent index for traffic forecasting. But when the policy question shifts from 'what will they buy?' to 'what should we sell?', that index becomes evidentially idle."
  *   **Soft Spot/Concede:** Concede that for *revenue maximization*, the thick/thin distinction doesn't matter. Your protocol only binds them if the policy goal is explicitly *welfare*. If they admit the goal is revenue, you have no normative leverage.

  #### 2. The "Reinventing the Wheel" Objection
  *   **Who:** Choice-Theoretic Welfare Economist (Bernheim/Rangel tradition).
  *   **Phrasing:** "This looks exactly like the 'welfare-relevant ancillary conditions' framework we've been developing for fifteen years. You've described our 'invariance across frames' condition but stripped it of the axioms that make it testable. Without the axioms, how is this anything more than a slogan? What stops a regulator from just declaring a frame 'irrelevant' because it suits them?"
  *   **Threat Level:** Medium. They feel you are claiming novelty where there is none.
  *   **2-Minute Reply:**
      *   Validate their work immediately (see Preemptive Concession 1).
      *   "You are right that the structure is similar. My contribution is not the protocol itself, but the *diagnosis of why economists resist it*."
      *   "Economists treat your axioms as optional modeling constraints. I am arguing they are *evidential necessities*. If you violate them, you aren't just breaking an axiom; you are making a claim without evidence."
      *   "I'm trying to give your framework philosophical armor against the 'it's just a model' objection."
  *   **Soft Spot/Concede:** Concede that without formal axioms, your protocol is vulnerable to regulatory capture. You need their math to make your philosophy enforceable.

  #### 3. The "Emptiness" Objection
  *   **Who:** Philosopher of Economics.
  *   **Phrasing:** "You say the 'thin' reading is all the ordinal revolution delivered. But critics have long argued that thin utility is empty—it explains nothing because it's just a redescription of choice. By defending the thin reading, aren't you just defending the emptiness? You say utility talk that outruns evidence is idle, but if thin utility *is* the evidence, haven't you just defined away the concept of welfare entirely?"
  *   **Threat Level:** Medium. Attacks the coherence of Claim 1 & 2.
  *   **2-Minute Reply:**
      *   "I am not defending emptiness; I am policing the boundary between *description* and *normativity*."
      *   "Thin utility is not empty; it is *complete* for describing choice. It becomes empty only when we try to use it for welfare without extra evidence."
      *   "My point is that 'welfare' is not a property of the choice function; it's a property of the agent's interaction with the world. If the choice function changes without a change in the world (the frame shift), the choice function was never tracking welfare."
  *   **Soft Spot/Concede:** Concede that "thin utility" cannot do *explanatory* work regarding psychological states. It is purely representational. If they push on explanation, yield ground.

  #### 4. The "Neural Reality" Objection
  *   **Who:** Neuroeconomist.
  *   **Phrasing:** "You claim choice is the 'only evidence' there is. That's empirically false. In my lab, we see value-coding neurons fire *before* the choice. We can measure the hedonic state directly. If the neural signal says Option A is higher value, but the default makes them choose Option B, we know the welfare ranking. Why ignore the direct measurement in favor of your behavioral invariance test?"
  *   **Threat Level:** High. Challenges Claim 2 (Evidential Policy) directly.
  *   **2-Minute Reply:**
      *   "I am not denying neural data exists. I am denying it settles the *normative* question."
      *   "Firing rates are physical quantities. To treat them as *welfare*, you need a bridge principle that says 'higher firing rate = better life.' That bridge principle is not neural data; it's a philosophical commitment."
      *   "Furthermore, if the firing rate flips when I change the display order, I have the same problem. Is the neuron reacting to value, or to the salience of the frame? Without invariance, the neural data is just another frame-dependent signal."
  *   **Soft Spot/Concede:** Concede that neural data *could* count as evidence under your protocol *if* it passes the invariance test. If neural firing is stable across frames while choice flips, that strengthens the welfare inference. You aren't excluding neuro, you're subjecting it to the same evidential standard.

  #### 5. The "Formalization" Objection
  *   **Who:** Axiomatic Choice Theorist.
  *   **Phrasing:** "You speak of 'invariance' and 'incompleteness' as if they are rigorous. But with noisy data, nothing is strictly invariant. Where is the theorem? How do you distinguish a violation of invariance from a stochastic error term? If you can't state this as a consistency condition on a choice correspondence, it's not a theory, it's a heuristic."
  *   **Threat Level:** Medium-High. Threatens the rigor of Claim 3.
  *   **2-Minute Reply:**
      *   "You are right that a production-ready policy needs a statistical test. Think of my protocol as the *identification condition* for your theorem."
      *   "Afriat's theorem tells us when data is rationalizable. I am asking: when is data *welfare-interpretable*?"
      *   "The 'incompleteness' I propose is a recorded gap in the revealed preference relation. Formally, $x \succ y$ holds only if $x$ is chosen over $y$ in all frames $F \in \mathcal{F}_{irrelevant}$. If not, the relation is undefined."
  *   **Soft Spot/Concede:** Concede you do not have the statistical test for "finite, noisy data" worked out. Invite them to collaborate on the axiomatization. This turns an enemy into a co-author.

  #### 6. The "Samuelsonian Relapse" Objection
  *   **Who:** Senior Theorist (Session Chair).
  *   **Phrasing:** "I find myself agreeing with you, but I suspect we disagree on why. I think the turn to welfare is a relapse into pre-1938 hedonism. We should be satisfied with consistency. You seem to think there *is* a welfare fact of the matter that we are failing to measure. Why not just say: if choices aren't consistent, there is no welfare ranking, full stop? Why keep the 'welfare' ghost alive?"
  *   **Threat Level:** Low (he's chairing), but High (intellectual co-option).
  *   **2-Minute Reply:**
      *   "That is a crucial distinction. You are arguing for *anti-realism* about welfare. I am arguing for *agnosticism*."
      *   "If I say 'there is no ranking,' I imply the rider doesn't care. If I say 'the ranking is unidentified,' I imply the rider might care, but we don't know."
      *   "Policy requires action. If we must choose a default, the anti-realist says 'pick anything.' The agnostic says 'pick anything, but acknowledge you are not maximizing welfare.' That accountability matters for democratic policy."
  *   **Soft Spot/Concede:** Concede that on the *metaphysics* of welfare, you might be closer to him than to the hedonists. Your disagreement is pragmatic (policy accountability), not metaphysical.

  #### 7. The "Paralysis" Objection
  *   **Who:** Public Policy Practitioner / Applied Micro.
  *   **Phrasing:** "Let's go back to the transit app. You say if the ranking flips, we record incompleteness. But the app *needs* a default. The code has to ship on Tuesday. If your protocol says 'infer nothing,' does that mean we can't set a default? Are you recommending policy paralysis?"
  *   **Threat Level:** Medium. Attacks the feasibility of Claim 3.
  *   **2-Minute Reply:**
      *   "Not paralysis, but *transparency*."
      *   "You can ship the default. But you cannot claim in the policy memo that this default 'maximizes rider welfare.'"
      *   "You must label it: 'This default is chosen for operational stability, as welfare is unidentified.' That changes the political liability. It stops the agency from lying to itself about its benevolence."
  *   **Soft Spot/Concede:** Concede that in emergencies or low-stakes decisions, the cost of gathering invariance data may outweigh the welfare risk. Your protocol is for high-stakes or systematic policy, not every UI tweak.

  #### 8. The "Circularity" Objection
  *   **Who:** The Sharp Graduate Student / Philosopher.
  *   **Phrasing:** "Your protocol relies on classifying variations as 'welfare-irrelevant.' But to know if a variation is welfare-irrelevant, don't you already need to know the welfare function? If you need welfare to define the test, and the test to find welfare, aren't you arguing in a circle?"
  *   **Threat Level:** High. Logical consistency of Claim 3.
  *   **2-Minute Reply:**
      *   "It's not a circle; it's a reflective equilibrium."
      *   "We don't need the full welfare function. We need *pluralistic agreement* on irrelevance. We all agree 'time of day' shouldn't matter for fare class. We all agree 'price' should."
      *   "We start with a provisional set of irrelevant frames based on common sense. If choice varies across them, we suspend judgment. If we later find a frame we thought was irrelevant actually *does* affect welfare (e.g., time of day affects fatigue), we update the set. It's iterative, not circular."
  *   **Soft Spot/Concede:** Concede that the "welfare-irrelevant" set is the weakest link. It relies on substantive normative assumptions that cannot be derived from choice alone. This is the place where philosophy must supplement economics.

  ---

  ### Load-Bearing Analysis
  *   **Claim 1 (Thin vs. Thick):** *Cuttable.* If you run over time, summarize this in one slide. Most economists already pay lip service to this.
  *   **Claim 2 (RP as Evidential):** *Load-Bearing.* This is the bridge. If this fails, Claim 3 has no foundation.
  *   **Claim 3 (Menu-Invariant Protocol):** *The Payload.* This is why they invited you. Spend the most time here.

  ### The "Doomsday" Question
  *   **The Question:** "If the transit riders *prefer* the default because it saves them cognitive effort, isn't the default *part* of the welfare? By demanding invariance across frames, aren't you defining welfare as 'what they would choose in a frictionless vacuum' rather than 'what makes their life go better in the real world with friction'?"
  *   **Who asks it:** The Behavioral Economist or the Neuroeconomist.
  *   **Why it hurts:** It attacks the definition of "welfare-irrelevant." If friction/cognition is part of welfare, then removing the frame (the default) changes the welfare object. Your test might filter out *actual* welfare drivers (like ease of use) as "noise."
  *   **Honest Assessment:** If this comes up, you are in trouble. Your distinction between "frame" and "feature" is the soft underbelly of the talk.
  *   **Defense:** You must argue that *cognitive effort* is a cost, but *arbitrary ordering* is not. If the default saves effort, that should be invariant (it saves effort regardless of which option is pre-selected). If the choice flips solely because of the *position*, that is not effort-saving, that is inertia.
  *   **If you stumble:** Concede that distinguishing "helpful friction" from "manipulative friction" is the hardest part of the protocol and requires case-by-case normative judgment, not just data.
