  *(Self-Correction during drafting)*: I need to make sure I don't give the user *too* much text to memorize. The replies should be bulleted talking points that expand to 2 minutes, not scripts.
  Also, the "Senior Theorist" is tricky. If he agrees, why is it a problem? Because he agrees *because* he thinks welfare is nonsense, whereas the user thinks welfare is real but hard to measure. The user needs to distinguish their normative project from his skeptical project.

