answer: |-
  ### What maps to what

  | Artifact Analogy | Biological Counterpart (Etiological Account) |
  | :--- | :--- |
  | **The Maker** | Natural Selection (or ancestral environmental pressures) |
  | **The Blueprint** | Genetic inheritance / Developmental pathway |
  | **The Job** | The Selected Effect (fitness contribution) |
  | **The Broken Tool** | Pathology / Malfunction (trait present but failing) |
  | **The Repurposed Tool** | Exaptation / Function Shift (trait maintained for new effect) |

  ### Where it genuinely holds

  The analogy succeeds where it matters most for the etiological account: grounding normativity without requiring current utility. Just as a screwdriver retains the function of driving screws even when used to pry paint tins, a heart retains the function of pumping blood even when arrhythmic. This captures the core intuition that function is historical, not merely dispositional. It effectively separates what a trait *does* from what it is *for*, allowing the professor to argue that malfunction is a real state of affairs rather than just a description of current inefficiency. For conclusions 1 and 2, the structural mapping is robust enough to do the heavy lifting in an introductory context.

  ### Where it breaks

  The disanalogies cluster around agency, complexity, and origin. First, **intentionality**: makers intend functions; selection does not. For conclusions 1 and 2, this is nitpicking; the structural logic of "history determines function" holds even without a mind. However, for conclusion 3, this is dangerous. Speaking of "updating" a tool implies a designer deciding to change the blueprint. In biology, there is no updater, only shifting frequencies. If students interpret "update" as intentional redesign, they misunderstand the mechanism.

  Second, **pleiotropy and bundling**. Tools are usually designed for one job; traits are often messy bundles of effects selected together. This complicates conclusion 2. If a trait was selected for a bundle of effects A, B, and C, is C a side effect or a function? The tool analogy obscures this granularity.

  Third, **drift and origin**. Tools don't appear by accident; traits can fix in a population via drift. This is potentially fatal to conclusion 1. If a trait arises by drift and does nothing, the etiological account says it has no function. The tool analogy has no counterpart for "accidental existence," making it hard to explain why a drift-fixed trait lacks function while a broken tool retains it.

  ### The three conclusions

  **1. Dysfunction is real.** **Survives.** This is the etiological account's strongest selling point. The analogy supports this perfectly: history grounds the norm, not current performance. A heart that doesn't pump is broken, not functionless, because of its lineage.

  **2. Not every effect is a function.** **Survives.** The account distinguishes selected effects from incidental byproducts (like the heart's thumping noise). The tool analogy maps well here: a screwdriver's weight might crack a nut, but that's not its function.

  **3. Functions can be updated.** **Half-survives.** The view itself is standard doctrine (the "Modern History" variant), not an overreach. However, the analogy misleads here. It suggests an agent redesigns the tool. In reality, the function shifts only after new selection pressures alter frequency over generations. The conclusion is philosophically sound, but the analogy smuggles in agency where there is none.

  ### My two cases

  **The A→B Shift:** The etiological account is committed to saying function B exists only *after* selection has acted to maintain T for B. There is a lag period where T exists, B occurs, but T is not yet *for* B. The causal-role account says function B exists immediately. The tool analogy suggests instant updates, which misrepresents the SE commitment.

  **The Drift-Fixed Trait:** If T fixes by drift and later becomes useful, standard etiological accounts say T has no proper function until selection acts on it. This is a known vulnerability of the view. The tool analogy cannot model this, as tools imply a maker. If your professor insists drift-fixed traits have functions immediately, she is drifting toward the causal-role account, not the etiological one.

  ### The question I hope she doesn't ask

  "If selection is blind and has no intentions, in what literal sense is a trait 'for' anything, rather than just caused by the past?" This pushes on the normativity problem. The tool analogy relies on human intention to make sense of 'for.' If you remove the maker, you must explain how blind processes create genuine norms without smuggling in metaphorical agency. It exposes the metaphysical cost of the view.

  ### A better analogy

  There isn't a clean one, but **"A family recipe handed down"** works better than tools. Recipes are copied with errors (mutation), some are kept because the dish tastes good (selection), and others are kept for no reason (drift). You can modify a recipe over generations (function shift) without a single chef redesigning it. It captures lineage, modification, and error without implying a divine maker or a static blueprint.
