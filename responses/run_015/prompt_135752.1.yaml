  2.  **Deconstruct the Philosophy:**
      *   **Etiological Account (SE):** Function of trait T is X iff T was selected for X in the past. (Millikan, Neander, etc.).
      *   **Causal Role Account (CR):** Function of trait T is X iff T contributes causally to the capacity of the containing system. (Cummins).
      *   **The Analogy:** Artifacts (tools) have functions determined by designer intent/history. Biology has functions determined by selection history.
      *   **The Tension:** Artifacts imply *intent*. Selection is blind. Does "selected for" map cleanly onto "made for"?
      *   **Conclusion 1 (Dysfunction):** SE supports this well. CR struggles (if it doesn't pump, it has no causal role, so no function?).
      *   **Conclusion 2 (Side Effects):** SE supports this well (only selected effects are functions). CR includes all causal contributions.
      *   **Conclusion 3 (Update/Modern History):** This is the tricky one. Standard SE looks at *origin*. "Modern History" (like Godfrey-Smith) looks at *recent* maintenance. The analogy of "redesigning the tool" is risky because selection doesn't "decide" to redesign; frequencies shift.

  3.  **Drafting - Section by Section:**

      *   **What maps to what:** Needs a table format (or list resembling one).
          *   Maker -> Natural Selection (or ancestral environment).
          *   Blueprint -> Genetic inheritance/Developmental pathway.
          *   Job -> Selected Effect (fitness contribution).
          *   Broken Tool -> Malfunctioning trait (pathology).
          *   Repurposed Tool -> Exaptation/Function shift.

      *   **Where it genuinely holds:** (~120 words). Focus on normativity and distinction from current utility. The core insight of SE is historical grounding, which the tool analogy captures better than CR. It explains why a useless heart is still *for* pumping.

      *   **Where it breaks:** (~300 words).
          *   *Intentionality:* Makers intend; selection doesn't. Is this fatal? Not necessarily for Conclusions 1 & 2, but risky for 3.
          *   *Discreteness:* Tools are discrete; traits are often pleiotropic (one gene, many effects). Selection acts on bundles.
          *   *The "Maker" in Case 3:* Selection isn't an agent that updates a blueprint. It's a filter.
          *   *Drift:* Tools aren't made by accident; traits can fix by drift.
          *   *Fatal vs. Nitpick:* Intentionality is a nitpick for 1 & 2 (structural similarity holds). Drift and Pleiotropy are more dangerous for the clean mapping. The "Redesign" aspect is the weakest link for Conclusion 3.

      *   **The three conclusions:** (~200 words).
          *   1 (Dysfunction): Survives. This is the SE stronghold.
          *   2 (Side Effects): Survives. SE distinguishes selected effects from byproducts.
          *   3 (Update): Half-survives. "Modern History" SE exists, but the analogy of "updating the tool" implies agency. It's doctrine, but the analogy obscures the mechanism (frequency shift vs. redesign).

      *   **My two cases:** (~150 words).
          *   *A->B Shift:* SE says function changes only after selection acts on B. There's a lag. The analogy implies instant update.
          *   *Drift:* SE says no function (or derives it from later selection). CR says function exists if it contributes now. This is a major crack. SE struggles with exaptations from drift.

      *   **The question I hope she doesn't ask:** (~80 words).
          *   Something about the *first* trait. If tools need makers, what made the first selected trait? Infinite regress? Or: "If selection is blind, in what sense is it 'for' anything?"

      *   **A better analogy:** (~100 words).
