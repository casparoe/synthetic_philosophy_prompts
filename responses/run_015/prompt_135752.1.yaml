      *   **Student's Suspicion:** The analogy smuggles in a designer (intentionality). Issues with who the "maker" is in case 3. Test cases: A->B shift (when does function change?), drift-fixed trait (no selection history).
      *   **Task:** Audit the analogy. Map components, evaluate where it holds/breaks, assess the three conclusions, analyze the two test cases, identify a vulnerable question, suggest a better analogy (or lack thereof).
