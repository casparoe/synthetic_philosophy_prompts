answer: |-
  Here is how I would structure the ninety minutes to ensure the paradox emerges from their own choices rather than a lecture, keeping the mechanics tight enough that the incoherence feels personal while leaving room for the philosophical debate you want in the debrief. You want the room set up with three distinct stations or tables, each with an urn, though physically you can manage with just two urns at the front if you project the choices or have them write on slips of paper that you collect. I recommend using two physical urns at the front of the room because the tactile reality of the balls matters for the stakes. Urn A is transparent or clearly labeled as containing exactly fifty red and fifty blue chips. Urn B is opaque and labeled as containing one hundred red and blue chips in an unknown proportion. You need a currency system, so print out slips worth one point each, and announce that the top three scores will get a tangible prize like a gift card or a bottle of wine, which keeps the economics students honest about the incentives while the philosophy students engage with the normative weight of the choice. Start the session by handing out ten points to everyone so they have skin in the game immediately, and tell them they will be asked to make a series of bets where they can wager points on the color of a ball drawn from one of the urns. Do not mention ambiguity, risk, or probabilities yet. Just call them Urn A and Urn B.

  For the first fifteen minutes, run a warm-up round using only Urn A to establish the baseline of risk without ambiguity. Ask them to wager one point on either Red or Blue from Urn A. If they win, they gain a point; if they lose, they lose the wager. Have them write their choice on a slip of paper and hold it up. Most will be indifferent, and you can briefly note that the odds are known and equal. This gets them used to the mechanics of writing, wagering, and the physical draw. Then move to the core trap, which needs to be split into two distinct phases to prevent them from seeing the matrix. For the second phase, introduce Urn B. Tell them you will draw one ball from Urn B at the end of the session, but right now they need to choose which urn they want to bet on for a Red ball. The choice is strictly between betting on Red from Urn A or Red from Urn B. Emphasize that they must commit now. Hand out slips that say Choice 1: Urn A Red or Urn B Red. Collect these slips in a sealed box or envelope immediately after they write them. Do not let anyone change their mind. Do not discuss why they chose what they chose. This commitment device is critical because if they know a Blue bet is coming, they might try to hedge or reason through the full probability space. You want them to lock in their intuition about Red before you even mention Blue.

  Once the Red choices are secured, move immediately to the third phase, which is the Blue bet. Tell them now they must choose which urn to bet on for a Blue ball. The choice is strictly between betting on Blue from Urn A or Blue from Urn B. Hand out slips for Choice 2. Again, collect them immediately in a separate sealed container. At this point, you have trapped them. If they exhibit the standard Ellsberg preference, they will have chosen Urn A for Red and Urn A for Blue. They have effectively said they think Urn A is better for Red and also better for Blue, which implies they think Urn A has more Red balls than Urn B and also more Blue balls than Urn B, which is mathematically impossible since the balls sum to one hundred in both. Now you need the control round to address your friend's objection about pessimism. To do this, introduce Urn C, which is another opaque urn. Tell them Urn C contains one hundred balls, and while you do not know the exact split, you can guarantee that there are at least sixty Red balls in it. The proportion is still unknown, so it remains ambiguous, but the lower bound is favorable. Ask them to wager one point on Red from Urn A versus Red from Urn C. If they choose Urn A here, they are revealing pure ambiguity aversion because they are preferring a known fifty percent chance over an unknown chance that is guaranteed to be at least sixty percent. If they choose Urn C, it suggests their earlier avoidance of Urn B was driven by pessimism about the unknown distribution rather than the unknown nature itself. This distinction is vital for your debrief later. After collecting these choices, draw the balls from the urns publicly. You should have pre-determined the contents of Urn B to be something like fifty red and fifty blue actually, or any split, but keep it secret until now. Reveal the contents of Urn C as well to show the guarantee was real. Tally the points and award the prizes.

  Now you move into the debrief, which should take the remaining thirty minutes. Start by asking for a show of hands on who chose Urn A for both Red and Blue in the first two rounds. Expect a majority. Ask them to defend this choice out loud. Someone will say they felt safer with the known urn. Write their preferences on the board without labeling them yet. Write P(Red A) > P(Red B) and P(Blue A) > P(Blue B). Ask them what P(Blue A) is in terms of Red. They will say one minus P(Red A). Do the same for Urn B. Now walk them through the algebra. If P(Red A) is greater than P(Red B), then one minus P(Blue A) is greater than one minus P(Blue B), which implies P(Blue B) is greater than P(Blue A). This contradicts their second choice where they said P(Blue A) is greater than P(Blue B). Point out that they have committed to two statements that cannot both be true under any single set of subjective probabilities. This is where you introduce the name Ellsberg and the concept of the Sure-Thing Principle. Explain that the Sure-Thing Principle says if you prefer A over B when event X happens, and you prefer A over B when event X does not happen, you should prefer A over B regardless of X. In their case, the event is the color of the ball, and their preferences flip depending on which color is being bet on, violating the principle. Then address the control round with Urn C. If they avoided Urn C despite the favorable guarantee, highlight that this cannot be explained by pessimism. Pessimism would dictate that they assume the worst case, but the worst case of Urn C is still better than Urn A. Therefore, their avoidance is driven by the discomfort of the unknown probability itself, not the expected value. This validates the ambiguity aversion hypothesis over the simple pessimism objection your friend raised.

  You need to be honest about what will predictably go wrong because this is the first time you are running it. Expect at least two or three students to refuse to bet or to try to write down both options. You need a rule established at the start that invalidates ambiguous slips, or you will lose data. Expect a few economics students to try to hedge by betting on Red in one round and Blue in the other on the same urn, which is rational but misses the point of the specific binary choice you are forcing. You should discourage hedging across rounds by framing each round as a standalone decision for points, though you cannot physically stop them from mentally hedging. Expect some students to get it right by construction, meaning they will choose Urn A for Red and Urn B for Blue, which is consistent. If this happens, congratulate them on being expected utility maximizers but note they are in the minority. The biggest risk is that the room will become too noisy or meta during the choice phases, with students whispering about the trick. You need to enforce silence during the betting rounds strictly, perhaps by collecting phones or insisting on individual work time. Another failure mode is that the stakes are too low. If the prize is trivial, they will treat it as a hypothetical survey. Ensure the prize is desirable enough that losing points feels like a loss. Also, be prepared for the philosophical pushback that rationality is not about consistency but about comfort. Some will argue that knowing the odds feels better even if it costs them expected value. You should welcome this in the debrief as a critique of normative rationality versus descriptive behavior.

  There are limitations to this activity that you will have to supply in the debrief yourself because the room cannot reproduce them. The main limitation is that this is a one-shot game. In real markets, ambiguity tends to get priced out or learned over time. If they played this hundred times, they would learn the distribution of Urn B and the ambiguity would vanish. The activity cannot show learning dynamics. Also, the activity cannot reproduce the market consequences of ambiguity aversion, such as why insurance markets exist or why equity premiums are high. You will have to describe those external validities verbally. Another limitation is that the Sure-Thing Principle relies on the assumption that the unknown distribution is fixed. If students suspect you are adversarial and might change the contents of Urn B based on their choices, their aversion is rational game theory, not ambiguity aversion. You must explicitly state and swear that the urn contents were fixed before they entered the room and are not dependent on their choices. If you do not establish this trust, the paradox collapses into a suspicion of the experimenter. Finally, acknowledge that the control round with Urn C is not perfect because telling them there are at least sixty red balls changes the ambiguity from a full range to a truncated range, which some might argue is a different psychological category than pure ignorance. You should note this nuance so they know you are aware of the complexity.

  To wrap the session, bring it back to the core insight that human decision-making often prioritizes the clarity of information over the magnitude of the payoff. Ask them to think about where else in their fields they see this. For the economists, ask about model uncertainty versus risk. For the philosophers, ask about moral uncertainty versus known ethical frameworks. This bridges the gap between the abstract paradox and their actual research interests. Keep the tone collegial throughout, acknowledging that even experts fall for this when not paying attention. The goal is not to shame them for being inconsistent but to show that consistency is a harder constraint than intuition suggests. If you manage the timing so that the reveal of the contradiction happens just as the energy starts to dip, you will keep them engaged for the full ninety minutes. Just remember to keep the instructions crisp and the silence during the betting rounds absolute, because any leakage of information between the Red and Blue choices will ruin the commitment device and allow them to reason their way out of the trap before they spring it on themselves.
