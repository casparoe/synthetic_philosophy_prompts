  3.  **Address the Specific Defeaters/Queries:**

      *   **Cases (Hard Norms):**
          *   *Cruelty to animals:* Hard because animals can't reciprocate or coordinate. *Defense:* Indirect reciprocity, signaling virtue to humans, preventing slippery slopes to human cruelty. *Weakness:* Requires complex auxiliary hypotheses.
          *   *Abolition:* Hard because slavery was a stable equilibrium for beneficiaries. *Defense:* Coordination among *non-slaveholders* or long-term economic stability? *Weakness:* Looks more like moral progress than equilibrium selection.
          *   *Duties to dead/promise-keeping:* Hard because no future payoff/punishment from the victim. *Defense:* Reputation signaling to the living. *Weakness:* Why the specific *categoricity* if it's just signaling?
          *   *Incest/Food Taboos:* Easier (genetic fitness, health), but the *moral* intensity is the question.
          *   *Hospitality:* Coordination problem (traveler safety vs. host cost).
          *   *Crucial Test:* Can we identify the game *independently* of the norm? Usually no. This is the "Just-So Story" risk.

      *   **Rival: Group-Identity/Coalition Signaling:**
          *   *Difference:* Coordination requires *mutual benefit* from conformity. Signaling requires *costly display* to distinguish groups.
          *   *Test:* Does the norm solve a collective action problem for the group, or just mark boundaries? If abolishing the norm harms everyone (including the enforcers) vs. if abolishing it just blurs lines.
