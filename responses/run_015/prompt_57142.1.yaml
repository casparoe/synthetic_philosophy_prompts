answer: |-
  Here is the honest exposure of the Shell Thesis. I'm ranking the defeaters from fatal (the view collapses or becomes vacuous) to awkward (the view survives but takes on scars). I've integrated your specific queries into these ranks.

  ### 1. The Free-Parameter Problem (Fatal)
  This is the most dangerous exposure. You suspect you can retro-fit a game to any norm. You are right. In game theory, if you can adjust the number of players, the payoff matrix, the information set, and the iteration count *after* observing the behavior, you can model *anything* as a Nash equilibrium. If the Shell Thesis allows you to posit a coordination game for every moral norm without independent evidence of that game's structure, the thesis is unfalsifiable. It becomes a "Just-So" story generator.

  To make this falsifiable, you need the discipline you mentioned: you must specify the ecological and demographic constraints *before* identifying the norm. You need to show that the situation *had* multiple stable equilibria (e.g., driving left vs. right, monogamy vs. polygamy) and that the norm selected one. If the "game" only has one possible equilibrium (e.g., "don't eat poison"), it's not a convention; it's a technical constraint. If you can't independently verify the existence of alternative equilibria, you aren't doing convention theory; you're doing functionalist storytelling.

  *   **Defender Response:** A committed defender would wave this off as a "developmental" issue. They'd argue that all mid-level social theories start flexible and get disciplined later. They'd claim the predictive success of the "lag" and "fragility" claims (your points 2 and 3) validates the framework even if the specific games are hard to reconstruct.
  *   **Load-Bearing?** **Yes.** If you concede that the game structures cannot be independently identified, the Shell Thesis loses its claim to be an *explanation* and becomes a *redescription*. It stops explaining *why* the norm exists and just asserts *that* it functions like a convention. That collapses the view into functionalism, which is a different theory entirely.

  ### 2. The Bargaining vs. Coordination Structure (Fatal)
  Your structural worry is spot-on and arguably worse than the free-parameter problem. Lewisian conventions solve coordination problems (everyone prefers *matching* to *mismatching*, regardless of which match occurs). But a massive chunk of the moral landscape is distributive or bargaining (everyone prefers *their* preferred match to *your* preferred match). Property rights, marriage structures, caste systems, and resource allocation are not "which side of the road?" problems; they are "who gets the lion's share?" problems.

  In a bargaining game, the loser does not have a conditional preference to conform given that others conform. They conform because of the *Shell* (threat of punishment). If the Shell is doing all the work to enforce compliance in bargaining cases, the "Convention" part of your thesis is idle. You aren't explaining the norm as a solution to a coordination problem; you're explaining it as a stabilization of a power equilibrium via ideology. This reinvents Conflict Theory (Marx, critical theory) and discards the Lewisian content. If 50% of durable moral norms are bargaining equilibria rather than coordination equilibria, your thesis only covers half the field, and you have no way to distinguish them a priori.

  *   **Defender Response:** A defender might concede that *some* norms are bargaining but argue that the *moralization* (the Shell) is only added when a bargaining equilibrium needs to be made to *look* like a coordination equilibrium to reduce enforcement costs. They'd argue the Shell *converts* bargaining into perceived coordination.
  *   **Load-Bearing?** **Yes.** If you concede that the Shell's primary job is to mask bargaining conflicts as coordination problems, you have admitted that the underlying game is *not* a Lewisian convention. The "Convention" label becomes a mask, not a foundation. The view survives, but it's no longer a Lewisian view; it's a theory of ideological obfuscation.

  ### 3. The Coalition Signaling Rival (Fatal)
  You asked what observation separates the Shell Thesis from the view that norms are group-identity markers (coalition signaling). The honest answer is: very little, unless you can pin down the payoffs. Both theories predict outrage, third-party punishment, and categoricity. Signaling theory says we punish to show loyalty to the group. Shell Thesis says we punish to maintain the equilibrium.

  The separating test is this: In a coordination convention, if everyone switched to the alternative equilibrium, everyone would be fine (driving on the left instead of the right). In coalition signaling, the *content* of the norm often doesn't matter, but the *cost* does. However, if the norm is purely signaling, abolishing it shouldn't cause a coordination collapse, just a loss of group cohesion. The problem is that group cohesion *is* a coordination good. If the "game" is "coordinate on hating the out-group," then Signaling *is* a species of Coordination.
  The defeater here is that your thesis offers no leverage against the Signaling view unless you can prove the norm solves a *material* collective action problem (like resource depletion) rather than a *social* one (like boundary maintenance). Many moral norms (dietary laws, dress codes) look purely like boundary maintenance.

  *   **Defender Response:** A defender would wave this off by insisting that "group identity" is just a label for a specific type of coordination equilibrium (an assurance game). They'd argue that signaling *is* the mechanism, but the *stability* comes from the convention structure.
  *   **Load-Bearing?** **Yes.** If you concede that the "coordination problem" is often just "coordinating on signals," you risk emptying the term "coordination" of its material content. If the only benefit of the norm is signaling membership, the Shell Thesis collapses into Signaling Theory. You need to prove there's a non-signaling payoff to conformity to keep your view distinct.

  ### 4. Lewis and the Arbitrariness Clause (Awkward)
  You are remembering Lewis correctly. Lewis explicitly excluded morality from his analysis of convention because he believed moral obligations are not arbitrary. For Lewis, a convention requires that there be an alternative regularity that would have worked just as well. For "do not murder," there is no obvious alternative ("murder on Tuesdays?") that serves the same interest.

  You are on the horn of changing the subject. You are using "Lewisian Convention" to mean "Any stable behavioral regularity sustained by common knowledge and conditional preferences." That is a broader definition than Lewis's. If you stick to Lewis's strict definition (arbitrariness is required), most moral norms fail. If you drop the arbitrariness clause, you lose the specific mathematical machinery Lewis built (which relies on indifference between equilibria).

  *   **Defender Response:** A defender would concede Lewis was too narrow. They'd argue that "arbitrariness" shouldn't mean "any alternative works," but "multiple stable solutions exist." They'd argue that "don't kill" is arbitrary in the sense that "don't kill except in ritual sacrifice" could have been the equilibrium.
  *   **Load-Bearing?** **No.** This is terminological. You can appropriate Lewis without adopting his restrictions. Philosophers do this all the time (e.g., "Humean" theories that Hume wouldn't recognize). It's an awkward historical mismatch, but it doesn't break the logic of your thesis, provided you redefine "convention" clearly.

  ### 5. Hard Cases and Prediction Failures (Awkward)
  Your shortlist of hard cases is accurate.
  *   **Cruelty to Animals:** Hard because animals can't reciprocate. *Defense:* It's a slippery slope norm (protect humans by protecting animals) or a signaling norm (show you aren't violent). *Weakness:* Requires auxiliary hypotheses.
  *   **Duties to the Dead:** Hard because the "victim" can't punish. *Defense:* Reputation signaling to the living. *Weakness:* Why the intense *categoricity*? Signaling is usually flexible; morality feels rigid.
  *   **Abolition:** Hard because slavery was a stable equilibrium for the powerful. *Defense:* It was a coordination problem among *non-slaveholders* to prevent elite domination. *Weakness:* Historically thin.
  *   **Predictions:** You mentioned the "lag" (etiquette first, morality later). History shows counter-examples. New technologies (AI, genetic engineering) often get moralized *instantly*, before any practice exists. This contradicts the "recurrent situation" requirement. Also, norms sometimes die *while* the coordination problem is still live (e.g., dueling, or certain environmental norms).

  *   **Defender Response:** A defender would concede these are "noisy" data points. They'd argue that instant moralization happens when the *threat* to the equilibrium is anticipated, not just experienced. They'd treat zombie norms as evidence of the "decay lag" (Claim 2), which is a point *for* the thesis, even if the origin story is murky.
  *   **Load-Bearing?** **No.** These are empirical skirmishes. A theory can survive anomalies if the core mechanism (Fragility Gradient, Asymmetric Decay) holds up in the aggregate. However, if the "Instant Moralization" of new tech becomes the rule rather than the exception, Claim 1 (Origins in recurrent games) is falsified.

  ### Summary of Exposure

  **The Fatal Line:**
  The view is fatal if you cannot distinguish **Coordination** from **Bargaining** (Defeater 2) and if you cannot identify the **Game** independently of the **Norm** (Defeater 1).
  *   If you concede that most norms stabilize bargaining outcomes rather than coordination equilibria, you are no longer a Lewisian; you are a Conflict Theorist who uses game theory vocabulary.
  *   If you concede that the games are retro-fitted, you are no longer a social scientist; you are a storyteller.

  **The Awkward Line:**
  The view is merely awkward if the problems are about **Definition** (Defeater 4) or **Outliers** (Defeater 5).
  *   Redefining Lewis is fine.
  *   Explaining away animal cruelty or instant tech-moralization requires extra work, but doesn't break the engine.

  **The Rival (Signaling):**
  This sits on the fatal line. If you cannot show that the norm produces a material collective good *beyond* group cohesion, the Shell Thesis is indistinguishable from Signaling Theory. You need to find cases where the norm solves a resource/production/safety problem that exists *independently* of the group's desire to signal.

  **Final Verdict:**
  The Shell Thesis is currently **well-insulated but empirically hollow.** It is insulated because any counter-example can be absorbed by tweaking the assumed game parameters (Defeater 1). It is hollow because it struggles to distinguish itself from Conflict Theory (Defeater 2) and Signaling Theory (Defeater 3) without independent data on payoffs that you likely cannot access for historical norms.

  To make this a live view, you must stop treating the "Game" as a theoretical posit and start treating it as an empirical claim that can be wrong. You need to bet on specific cases: "This norm *must* correspond to *this* specific game structure, and if we find the payoffs were different, my theory is false." Until you're willing to lose on a specific case, the view is unfalsifiable, which is a fatal flaw for a theory claiming to explain social reality.
