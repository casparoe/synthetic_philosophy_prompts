prompt: |-
  I run citizen assemblies for a mid-sized city and we're constantly arguing over whether to decide things with a big random pool or a small expert panel. I want a practical decision procedre based on the Condorcet jury theorem, but not the classroom version where voters are isolated and equally smart. In real life people talk beforehand, experts dominate the room, and competence varies wildly. So I need you to turn this into an operational checklist — call it the correlated-competence jury rule — that my staff can run in about fifteen minutes before we design a session. It should ask things in order: first check for independance decay (how much prior discussion or media exposure has already happened), then a rough competence spread (without actual testing), then the stakes of being wrong, then whether strategic voting is likely. For each step say what counts as sufficient, where the procedre outputs "use the small panel", where it outputs "use the large pool", and where it has to punt to a human because it's a values question not a fact. Then apply it to three cases: routing a bike lane through a residential neighborhood, changing zoning near an old factory site, and picking a contractor for hidden water-main repairs where the mayor wants a popular vote but the technical risks are high — that last one should come out against the mayor's preference. Finally say exactly what the procedre can't handle, like negative correlation between bias and expertise, and be honest about which steps are judgment calls dressed up as steps. Write it casual, no need for references.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a practical decision procedure ("Correlated-Competence Jury Rule") for choosing between a large random citizen assembly (large pool) and a small expert panel (small panel).
      *   **Basis:** Condorcet Jury Theorem (CJT), but adapted for real-world conditions (correlated votes, varying competence, discussion).
      *   **Format:** Operational checklist, runnable in ~15 minutes.
      *   **Steps:**
          1.  Independence Decay (prior discussion/media).
          2.  Competence Spread (rough estimate, no testing).
          3.  Stakes of Being Wrong.
          4.  Strategic Voting likelihood.
      *   **Outputs per step:** What counts as sufficient, when to choose "Small Panel," when to choose "Large Pool," when to "Punt to Human" (values question).
      *   **Applications:** Apply to three specific cases:
          1.  Bike lane routing (residential).
          2.  Zoning change (old factory).
          3.  Water-main contractor (technical risk, mayor wants vote) -> *Must output against mayor.*
      *   **Limitations:** Explicitly state what the procedure can't handle (e.g., negative correlation bias/expertise) and admit which steps are subjective judgment calls.
      *   **Tone:** Casual, no references, practical.

  2.  **Deconstruct the Theory (CJT in Reality):**
      *   *Classic CJT:* If $p > 0.5$ (competence) and votes are independent, large $N$ guarantees correct decision.
      *   *Real World:* $p$ varies, votes are correlated (common information sources, discussion), stakes matter (type I vs. type II errors), strategic voting undermines truth-seeking.
      *   *The Trade-off:* Large pools average out noise *if* independent. Small panels concentrate expertise *if* trustworthy and not captured by special interests.
      *   *The "Correlated-Competence" Twist:* If correlation is high (everyone watched the same news), adding more people doesn't help much. If competence is low/varied, large pools might drift. If stakes are technical/high-risk, expertise weighs heavier.

  3.  **Drafting the Checklist (The "Correlated-Competence Jury Rule"):**
      *   *Time limit:* Needs to be quick. Simple thresholds.
      *   *Step 1: Independence Decay.* How much shared noise is there?
          *   High correlation (viral issue) -> Large pool less effective.
          *   Low correlation (obscure issue) -> Large pool better at aggregating.
      *   *Step 2: Competence Spread.* Can the average person judge this?
          *   High technical barrier -> Small panel.
          *   Values/Preference based -> Large pool.
      *   *Step 3: Stakes.* What happens if we screw up?
          *   Catastrophic/Irreversible -> Small panel (caution/expertise).
          *   Reversible/Low cost -> Large pool (democratic legitimacy).
      *   *Step 4: Strategic Voting.* Is there a strong incentive to lie/game the system?
          *   High incentive (money, power) -> Small panel (easier to vet/manage).
          *   Low incentive -> Large pool.
      *   *Punt Condition:* If it's purely about values (what do we *want*?) vs. facts (what *works*?), the math doesn't decide. That's a political call.

  4.  **Developing the Cases:**
      *   *Case 1: Bike Lane.*
          *   Independence: High (neighbors talk).
          *   Competence: Mixed (traffic vs. quality of life).
          *   Stakes: Low/Medium (reversible).
          *   Strategic: Medium (NIMBYism).
          *   *Verdict:* Large Pool (it's a values/preference trade-off).
      *   *Case 2: Zoning (Factory).*
          *   Independence: Medium (developers vs. residents).
          *   Competence: High technical (environmental, structural).
          *   Stakes: High (long term).
          *   Strategic: High (money involved).
          *   *Verdict:* Small Panel (technical + high stakes).
      *   *Case 3: Water Main (Mayor vs. Tech).*
          *   Independence: Low (technical info is hidden).
          *   Competence: Very Low for public (engineering).
          *   Stakes: Very High (infrastructure failure).
          *   Strategic: High (Mayor wants popularity, contractors want profit).
          *   *Verdict:* Small Panel (Must override Mayor).

  5.  **Refining the Limitations & Honesty:**
      *   Need to admit that "Competence" is hard to guess without testing.
      *   Need to admit "Independence" is a guess.
      *   The "Negative Correlation" point: Sometimes experts are biased in one direction, laypeople in another. The checklist assumes experts = better on tech, laypeople = better on values.
      *   Acknowledge that this is a heuristic, not a law of physics.

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone Check:* Keep it conversational. "Here's the deal," "Don't overthink it."
      *   *Constraint Check:* 15 minutes? Yes, keep criteria binary or trinary.
      *   *Constraint Check:* No references.
      *   *Constraint Check:* Ensure the Water Main case hits the "Against Mayor" requirement.

  7.  **Final Polish:**
      *   Make sure the "Punt to Human" condition is clear.
      *   Ensure the distinction between "Fact" questions (CJT applies) and "Value" questions (CJT doesn't apply) is highlighted.
      *   Review the "Independence Decay" logic: If everyone hears the same wrong info, large N amplifies error.
      *   Review the "Competence" logic: If $p < 0.5$, large N guarantees wrong answer.

      *(Self-Correction during drafting)*: Wait, the prompt asks for "where the procedure outputs 'use small panel', where it outputs 'use large pool', and where it has to punt". I need to make sure each step has these exit conditions, or at least the cumulative logic does. It makes more sense for the *cumulative* score to decide, but the prompt asks "For each step say... where the procedure outputs...". Okay, I will structure it so a strong signal at any step can trigger a decision, but usually, it's a weighted accumulation. Actually, a "traffic light" system per step is clearer for a 15-minute checklist.
      *   *Revision:* Let's make it a flow. If Step 1 is "High Correlation," lean Small. If Step 2 is "Low Competence," lean Small. If Step 3 is "High Stakes," lean Small. If Step 4 is "High Strategy," lean Small. Otherwise Large.
      *   *Wait, one more constraint:* "where it has to punt to a human because it's a values question not a fact." This should probably be a gatekeeper at the start or end. Let's put it at the start. If it's purely values, CJT doesn't apply.

      *(Refining the "Punt" logic)*: CJT is about finding the *correct* answer (truth). If there is no truth (just preference), CJT is useless. So Step 0 is "Fact vs. Value."
      *   *Actually, looking at the prompt:* "first check for independance decay... then competence... then stakes... then strategic." Okay, I must follow that order. I will embed the "Punt" condition within the steps where appropriate (e.g., Competence often blurs into Values).

      *(Refining the Water Main Case)*: The Mayor wants a popular vote. The procedure must say "Small Panel." I need to ensure the criteria for "Technical Risk" and "Competence" trigger the Small Panel outcome strongly enough to override the political desire.

      *(Refining the "Honesty" section)*: Be blunt. This is a heuristic. It relies on staff intuition.

  8.  **Final Review against constraints:**
      *   Casual tone? Yes.
      *   No references? Yes.
      *   15-min checklist? Yes.
      *   Specific steps in order? Yes.
      *   Three cases applied? Yes.
      *   Water main = Small Panel? Yes.
      *   Limitations admitted? Yes.

      *Let's write it.*
answer: |-
  # The Correlated-Competence Jury Rule
  **Time to run:** 15 minutes  
  **Who runs it:** Program staff (2-3 people)  
  **Goal:** Decide between a **Large Random Pool** (Citizen Assembly) or a **Small Expert Panel**.

  Look, the Condorcet Jury Theorem works great in a textbook where everyone flips a coin with a 51% bias toward truth and never talks to each other. That's not your city. People talk. They read the same newspapers. They get bullied by the loudest person in the room. This checklist adjusts for the messiness of real life.

  Run through these four steps in order. Tally the results. If you get a "Punt," stop and talk to the steering committee.

  ---

  ### Step 1: Check Independence Decay
  *How much shared noise is already in the room?*
  CJT requires votes to be independent. If everyone has already heard the same rumor, seen the same viral video, or been lobbied by the same union, adding more people doesn't add new information—it just amplifies the bias.

  *   **Low Decay (Fresh Issue):** The public hasn't heard much. Information is scattered.
      *   *Verdict:* Lean **Large Pool**.
  *   **High Decay (Saturated Issue):** Everyone knows the talking points. Media has framed the narrative. Neighbors are already texting chain messages.
      *   *Verdict:* Lean **Small Panel** (You need insulated deliberation, not amplification).
  *   **Punt Condition:** If the "noise" is actually a deep cultural value conflict (e.g., abortion, policing philosophy), math won't fix it. **Punt to Human.**

  ### Step 2: Rough Competence Spread
  *Can the average person actually judge this without a PhD?*
  Don't test them. Just look at the subject matter. CJT fails if average competence ($p$) is below 0.5. If the average citizen is guessing blindly, a large group guarantees the wrong answer.

  *   **High Competence (Lived Experience):** The question is about quality of life, aesthetics, or local needs. (e.g., "Is this park safe?")
      *   *Verdict:* Lean **Large Pool**.
  *   **Low Competence (Technical Black Box):** The question requires engineering, actuarial science, or legal code interpretation. (e.g., "Which pipe alloy resists corrosion?")
      *   *Verdict:* Lean **Small Panel**.
  *   **Punt Condition:** If the question mixes technical facts with moral weights (e.g., "How much risk is acceptable?"), you can't separate competence from values. **Punt to Human.**

  ### Step 3: Stakes of Being Wrong
  *What happens if we vote for the false option?*
  CJT assumes all errors are equal. They aren't. If a false positive costs millions or kills people, you need caution, not just majority rule.

  *   **Reversible/Low Cost:** We can try it and undo it later. Budget impact is minor.
      *   *Verdict:* Lean **Large Pool**.
  *   **Irreversible/High Cost:** Infrastructure failure, long-term debt, environmental damage.
      *   *Verdict:* Lean **Small Panel**.
  *   **Punt Condition:** If the "cost" is purely social cohesion (e.g., one group feels betrayed), that's a political calculation. **Punt to Human.**

  ### Step 4: Strategic Voting Likelihood
  *Does anyone have a reason to lie?*
  CJT assumes people vote for what they think is *true*. In reality, people vote for what benefits *them*. Large pools are harder to police for bad-faith actors than small, vetted panels.

  *   **Low Incentive:** No money or power on the line. People just want the best outcome.
      *   *Verdict:* Lean **Large Pool**.
  *   **High Incentive:** Developers, unions, or political careers are directly at stake. Lobbying is active.
      *   *Verdict:* Lean **Small Panel** (Easier to vet for conflicts of interest).
  *   **Punt Condition:** If the strategic behavior is systemic (e.g., gerrymandering effects), the procedure can't fix the design. **Punt to Human.**

  ---

  ### The Tally
  *   **Mostly Large Pool:** Run the Citizen Assembly.
  *   **Mostly Small Panel:** Convene the Expert/Stakeholder Panel.
  *   **Any "Punt":** Stop. This isn't a design problem; it's a political one. Get the City Council or Steering Committee to decide the *goal*, then come back.

  ---

  ### Case Studies

  #### Case 1: Routing a Bike Lane Through a Residential Neighborhood
  *   **Independence:** High Decay. Neighbors are already in Facebook groups arguing about parking. (**Lean Small**)
  *   **Competence:** High Competence. Residents know their streets, traffic patterns, and kids' safety better than planners. (**Lean Large**)
  *   **Stakes:** Low/Reversible. Paint can be scraped off. (**Lean Large**)
  *   **Strategy:** Medium. NIMBYism is real, but it's mostly preference-based. (**Neutral**)
  *   **Result:** **Use Large Pool.**
  *   *Why:* This is a values trade-off (parking vs. safety), not a math problem. You need legitimacy, not engineering. The "High Decay" is a worry, but a facilitated assembly can break echo chambers better than a closed panel.

  #### Case 2: Changing Zoning Near an Old Factory Site
  *   **Independence:** Medium. Developers are leaking info, but the environmental data is fresh. (**Neutral**)
  *   **Competence:** Low Competence. Soil toxicity, load-bearing limits, and zoning law are technical. (**Lean Small**)
  *   **Stakes:** High/Irreversible. If you build condos on toxic soil, people get sick. You can't undo it easily. (**Lean Small**)
  *   **Strategy:** High. Developers want profit; residents want property values. (**Lean Small**)
  *   **Result:** **Use Small Panel.**
  *   *Why:* The technical risk and irreversibility outweigh the need for broad legitimacy. Use a panel of experts + resident reps, not a random lottery.

  #### Case 3: Picking a Contractor for Hidden Water-Main Repairs
  *   **Independence:** Low. The public knows nothing about underground infrastructure. (**Lean Small**)
  *   **Competence:** Very Low. Citizens cannot evaluate pipe tensile strength or bid integrity. ($p < 0.5$). (**Lean Small**)
  *   **Stakes:** Very High. Pipe bursts flood basements and sink roads. (**Lean Small**)
  *   **Strategy:** Very High. Mayor wants a vote to look populist; contractors want to low-ball then upcharge. (**Lean Small**)
  *   **Result:** **Use Small Panel.**
  *   *Why:* **This overrides the Mayor.** The Mayor is asking for a "popular vote" on a technical fact. Under the Correlated-Competence Rule, average competence is too low and stakes are too high. A large pool here doesn't aggregate wisdom; it aggregates ignorance. You need engineers and auditors, not a town hall. Tell the Mayor: "If we use a large pool, the math says we will pick the wrong pipe with 95% confidence."

  ---

  ### What This Procedure Can't Handle (The Fine Print)

  Be honest with your staff: this checklist is a heuristic, not a law of physics. Here's where it breaks:

  1.  **Negative Correlation between Bias and Expertise:** Sometimes experts are *more* biased than laypeople (e.g., economists who all believe the same market theory). This checklist assumes experts are less biased on technical issues. If your "experts" are captured by industry, the Small Panel recommendation becomes dangerous.
  2.  **The "Values" Trap:** Step 2 tries to separate facts from values, but they're often glued together. "How much should we spend on safety?" is a value question disguised as a budget question. If you treat it as a competence question, you'll technocratize a political choice.
  3.  **Judgment Calls Dressed as Steps:**
      *   **Independence Decay:** We're guessing how much people have talked. We don't actually measure information entropy.
      *   **Competence:** We aren't testing $p > 0.5$. We're guessing based on the topic. If you guess wrong and the public is actually smarter than you think, you've unnecessarily excluded them.
      *   **Stakes:** "High" vs. "Low" is subjective. One person's budget overrun is another person's crisis.

  **Final Advice:** If you're unsure, default to the **Large Pool** for legitimacy, but give them **Expert Witnesses**. That's the hybrid move this checklist doesn't explicitly score, but it's usually the safest bet when the math is murky.
