answer: |-
  ### Expert Grader Brainstorming: Key Epistemological Distinctions

  Before assessing the student's work, the following distinctions clarify the grading criteria:
  1.  **Evidentiary Absence vs. Absence of Evidence:** Absence of evidence is only evidence of absence if the preservation context suggests records *should* exist (e.g., Egyptian state records for large armies). Silence in oral traditions or perishable media does not constitute negation.
  2.  **Narrative Kernel vs. Framing:** Archaeology may confirm a kernel (e.g., a city burned) but rarely confirms the framing (e.g., burned because of a kidnapped queen). Conflating the two leads to overconfidence in "confirmation."
  3.  **Cross-Tradition Sedimentation:** Requires genuine independence (not shared oral sources), divergent motives (e.g., diplomatic treaty vs. epic poetry), and convergence on specific details. Mere repetition within a single cultural lineage does not count as sedimentation.
  4.  **Archaeological Necessity/Sufficiency:** Archaeology is rarely sufficient on its own to name actors (unless inscriptions exist) and rarely strictly necessary if textual sedimentation is robust (though rare in deep antiquity). Usually, it is a necessary constraint but not sufficient for narrative detail.

