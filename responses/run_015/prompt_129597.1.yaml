      *   **Rationale:** Protect living individuals from harm (employment discrimination, insurance, political reprisal, embarrassment).
      *   **Mechanism:** Compulsory response -> Confidentiality -> Embargo -> Public Release.
      *   **The "72-Year" Logic:** Based on life expectancy at the time the law was codified (1978). Assumption: Most people enumerated will be dead by then.
      *   **The User's Counter-example:** An ancestor dead for decades, but grandchildren alive. The "harm" might not be to the enumerated subject, but to living relatives (illegitimacy, hidden relationships, etc.).

  3.  **Address the Sub-questions Systematically:**

      *   **Implicit Theory of Privacy:** It's a *temporal* theory. Privacy is a function of mortality. It is not a right inherent to the data or the soul, but a shield against *consequences* in the social world. Once the social actor is gone, the data becomes history.
      *   **Presuppositions vs. Fit:**
          *   *Strict Presupposition:* The state has a right to know (compulsion). The public has a right to know (transparency/history). Privacy is an obstacle to be managed, not a fundamental right to be preserved indefinitely.
          *   *Fits Well With:* The "harm-to-living" model. It fits *okay* with the idea that embarrassment fades, but it clashes with the idea of reputational harm to descendants.
      *   **Harm-to-Living vs. Other Views:**
