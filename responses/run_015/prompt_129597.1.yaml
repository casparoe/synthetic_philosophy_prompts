          *   *Third Framing (Civic Trust/Legibility):* James C. Scott's *Seeing Like a State* comes to mind, but inverted. Here, legibility is a *civic duty* that yields a *public good* (history/democracy). The bargain is: "Tell us the truth now so we can govern; later, your truth becomes our shared history."

