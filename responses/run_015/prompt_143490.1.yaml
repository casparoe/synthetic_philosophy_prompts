prompt: |-
  Here's an argument I built for my moral revolutions seminar and now find suspicious because it makes progress look like fashion. (1) Appiah says dueling collapsed because it became embarasing, not because anyone won the argument — honor turned against it. (2) Williams adds that norms sometimes die by becoming unthinkable rather than being refuted. (3) If that's right, then a norm's survival is just a function of the social cost of violating it — call it the shame-price. (4) So moral change is just a shift in shame-prices, not a discovery of what's actually right or wrong. (5) Apply that consistently: slavery ended not because it was shown to violate human dignity, but because defending it got too expensive socially. (6) But then abolition is rationally on par with, say, the decline of powdered wigs — both are just shame-price shifts. (7) I don't want to say abolition was just fashion; I think it was genuinely progressive. So which step do I reject? If I keep (3), do I have to pay the price of saying moral progress is arbitrary?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Argument:**
      *   **Context:** A moral revolutions seminar.
      *   **Core Concern:** The argument makes moral progress look like fashion (arbitrary, superficial).
      *   **The Steps:**
          1.  Appiah: Dueling ended due to embarrassment (honor turned against it), not argumentative victory.
          2.  Williams: Norms die by becoming unthinkable, not refuted.
          3.  *Inference:* Norm survival = function of social cost of violation ("shame-price").
          4.  *Inference:* Moral change = shift in shame-prices, not discovery of truth.
          5.  *Application:* Slavery ended because defending it got socially expensive, not because of human dignity.
          6.  *Implication:* Abolition $\approx$ Powdered Wigs (both just shame-price shifts).
          7.  *Intuition:* Abolition *was* genuinely progressive, not just fashion.
      *   **The Question:** Which step to reject? If keeping (3), does one have to accept moral progress is arbitrary?

  2.  **Evaluate the Steps:**
      *   (1) & (2) are descriptive claims about *how* change happens (sociologically/psychologically). They are largely supported by Appiah (*The Honor Code*) and Williams (*Shame and Necessity*).
      *   (3) is a reductionist move. It equates the *mechanism* of enforcement (shame/cost) with the *justification* or *truth-value* of the norm.
      *   (4) follows from (3). If the mechanism is all there is, then truth is irrelevant.
      *   (5) applies (4) to a hard case (slavery).
      *   (6) draws the reductio ad absurdum (wigs vs. slavery).
      *   (7) is the user's moral intuition (the "Moorean fact" they want to preserve).

  3.  **Identify the Weak Link:**
      *   Step (3) is the culprit. It commits a genetic fallacy or a category error. Just because the *mechanism* of change is social pressure (shame-price) doesn't mean the *content* of the change lacks objective weight or rational justification.
      *   Step (4) is also problematic because it conflates *causal explanation* with *normative justification*.
      *   The "Fashion" objection arises because fashion is *defined* by arbitrariness. If moral change shares the mechanism of fashion (social signaling/cost), it doesn't mean it shares the *ontology* of fashion (arbitrariness).

  4.  **Formulate a Response Strategy:**
      *   **Validate:** Acknowledge the strength of the Appiah/Williams reading. They *do* emphasize social psychology over pure rationalism.
      *   **Diagnose:** Point out that the slide from "how norms change" (sociology) to "what makes norms true" (metaethics) is where the argument goes off the rails. Specifically, Step (3) and (4).
      *   **Offer Solutions/Alternatives:**
          *   *Option A: Reject (3).* Distinguish between the *causes* of belief and the *reasons* for belief. (The "Context of Discovery" vs. "Context of Justification").
          *   *Option B: Refine (3).* Shame-prices aren't arbitrary; they track underlying harms or rational insights, even if the *trigger* is social.
          *   *Option C: Appiah's actual view.* Appiah doesn't think it's *just* shame. He thinks shame is the *engine* that allows reason to work. Honor codes make people listen to arguments they'd otherwise ignore.
          *   *Option D: Williams' actual view.* Williams is more skeptical, but even he distinguishes between "thick" ethical concepts that track reality and mere conventions.
      *   **Address the "Fashion" Analogy:** Why wigs $\neq$ slavery. Wigs are purely expressive/conventional. Slavery involves harm, agency, suffering. The shame-price on slavery rose because people *recognized* something real (suffering/wrongness), whereas wigs fell because of aesthetic drift.

  5.  **Drafting the Response (Iterative Process):**

      *   *Intro:* Good argument, classic tension between sociology of morals and metaethics.
      *   *The Pivot:* Step (3) is the bridge that collapses. It confuses *enforcement* with *validity*.
      *   *Appiah Nuance:* Appiah doesn't say arguments *didn't matter*. He says arguments needed honor to gain traction. The argument provided the *reason*, honor provided the *motivation*.
      *   *The "Shame-Price" Critique:* A high shame-price can attach to false things (e.g., not dueling was once shameful). But that doesn't mean *all* shame-prices are unmoored from truth.
      *   *Distinguishing Fashion:* Fashion is arbitrary (blue vs. red). Morality tracks harm/well-being (chaining vs. freeing). The mechanism (social pressure) is the same, the *object* is different.
      *   *Recommendation:* Reject (4). Keep (1)-(3) but interpret (3) as *causal*, not *constitutive*.

  6.  **Refining the Philosophy:**
      *   Need to mention the **Is-Ought gap** (Hume). Just because norms *do* change via shame doesn't mean they *ought* to be judged solely by shame.
      *   Need to mention **Epistemic Friction**. Social pressure can be a tool for truth, not just an obstacle.
      *   **Bernard Williams:** He warns against "morality system" but doesn't necessarily say all ethical change is arbitrary. He talks about "confidence" vs. "truth."
      *   **Appiah:** Specifically in *The Honor Code*, he argues that rational argument *alone* failed for centuries. It took a shift in honor to make the rational argument *stick*. So reason + honor = progress. Not just honor.

  7.  **Final Polish:**
      *   Structure the advice clearly: Identify the bad step, explain why, offer a way to save the intuition without losing the Appiah/Williams insights.
      *   Tone: Encouraging, analytically rigorous, seminar-appropriate.

  8.  **Self-Correction during drafting:** I initially thought about telling them to reject (3). But actually, (3) is a useful heuristic *if* understood causally. The real error is (4), which makes the ontological leap. I should emphasize distinguishing *causal genealogy* from *normative justification*. Also, I need to make sure I don't misrepresent Appiah. Appiah is a realist of sorts; he thinks the abolitionists were *right*. He just thinks the *psychology* of change relied on honor.

  9.  **Final Plan:**
      *   Validate the worry (it's a standard metaethical worry).
      *   Target Step (4) as the primary error (conflating cause with justification).
      *   Target Step (3) as secondary (oversimplifies Appiah/Williams).
      *   Show how to keep the "shame-price" insight without the "fashion" conclusion.
      *   Distinguish Convention (wigs) from Morality (slavery) based on *what* the shame is tracking.
      *   Suggest a specific revision for the seminar paper.

  (End of thought process)xp
answer: |-
  This is a sharp, well-structured argument that cuts right to the heart of a major tension in metaethics: the gap between the **genealogy** of morals (how they actually change) and the **justification** of morals (why they are right).

  Your suspicion is well-founded. If you leave the argument as is, you are committed to a form of **moral skepticism** or **expressivism** that reduces all ethical progress to shifting social conventions. That is a defensible philosophical position, but if your intuition (7) is that abolition was *genuinely* progressive, the argument is working against you.

  Here is the diagnosis: **Step (4) is the bridge that collapses.**

  To save your intuition without throwing out Appiah and Williams, you need to reject the inference that *because* the mechanism of change is social (shame-price), the *content* of the change is arbitrary (fashion).

  Here is how to dismantle the argument and rebuild it.

  ### 1. The Category Error in Step (3) and (4)
  Step (3) defines a norm's survival as a function of social cost. Step (4) infers that therefore moral change is *just* a shift in costs, not a discovery of truth.

  This commits a version of the **genetic fallacy**. The origin or mechanism of a belief does not necessarily determine its truth value.
  *   **Example:** I might believe $2+2=4$ because I want to please my teacher (social cost of being wrong). That doesn't make $2+2=4$ false.
  *   **Application:** The fact that shame was the *engine* of abolition doesn't mean the *fuel* was arbitrary.

  Appiah and Williams are describing the **psychology and sociology** of moral change, not the **ontology** of moral truth. They are explaining why rational arguments *failed* for centuries and then suddenly *succeeded*. They are not saying the arguments were vacuous.

  ### 2. Appiah's Actual View: Honor as a Tool, Not a Truth-Maker
  You are slightly oversimplifying Appiah in Step (1). In *The Honor Code*, Appiah does not argue that argumentation was irrelevant. He argues that **moral argument without social leverage is inert.**

  *   **The Problem:** For centuries, people argued slavery was wrong. Slave owners didn't care.
  *   **The Shift:** When slavery became dishonorable, slave owners *started listening* to the arguments they had previously ignored.
  *   **The Correction:** Honor didn't replace reason; honor made reason effective.

  Therefore, you should modify Step (4). Moral change is a shift in shame-prices **that allows rational moral insights to gain traction.** The shame-price is the *condition of possibility* for the progress, not the *substitute* for it.

  ### 3. Distinguishing Fashion from Morality (The "Wig" Objection)
  Step (6) equates abolition with powdered wigs. This fails because it ignores **what the shame is tracking.**

  *   **Fashion (Wigs):** The shame-price is arbitrary. There is no independent fact of the matter about whether wigs are "good." The cost is purely about signaling group membership.
  *   **Morality (Slavery):** The shame-price tracks **harm and agency.** When the shame-price on slavery rose, it was because people began to recognize the *reality* of the suffering and the *humanity* of the enslaved.

  You can keep the "shame-price" model but add a **constraint**:
  > *Moral progress occurs when shame-prices shift to align with objective features of human well-being or agency, whereas fashion shifts are unmoored from such features.*

  If you accept that human suffering is an objective bad (a minimal moral realist stance), then a norm change that reduces suffering is not "fashion," even if the mechanism of change was social pressure.

  ### 4. How to Revise the Argument for Your Seminar
  You don't need to scrap the Appiah/Williams insights. You just need to block the slide into skepticism. Here is a proposed revision of the logic:

  *   **(1) & (2) Keep:** Appiah and Williams are right that norms often die via social unthinkability, not just logical refutation.
  *   **(3) Revise:** A norm's survival is a function of the social cost of violating it, **BUT** those costs are often responsive to underlying moral facts (like harm).
  *   **(4) Reject:** Do not say moral change is *just* a shift in prices. Say moral change requires a shift in prices **to institutionalize** a moral discovery.
  *   **(5) Revise:** Slavery ended when defending it became socially expensive, **which allowed the pre-existing argument about human dignity to finally land.**
  *   **(6) Reject:** Abolition is not on par with wigs. Wigs are conventional; dignity is not. The shame-price on wigs tracked aesthetics; the shame-price on slavery tracked harm.
  *   **(7) Keep:** Abolition was genuinely progressive.

  ### 5. The "Price" of Keeping Step (3)
  You asked: *If I keep (3), do I have to pay the price of saying moral progress is arbitrary?*

  **No.** You only pay that price if you assume social costs are *exogenously* determined (like a random number generator).

  But social costs are **endogenous** to human interaction. We feel shame when we violate norms that we perceive as harming the social fabric or other people. If human beings have a capacity to recognize suffering (empathy), then the "shame-price" is a market mechanism that eventually prices in the cost of harm.

  **The Analogy:**
  Think of the "shame-price" like the **price of a stock**.
  *   The price fluctuates based on sentiment (fashion/social pressure).
  *   But over time, the price tends to track the underlying value of the company (moral truth/harm).
  *   Sometimes the market is wrong (bubbles/crashes, e.g., the Jim Crow era).
  *   But saying "prices are just numbers" doesn't mean "value doesn't exist."

  ### Recommendation for the Paper
  Don't reject Appiah or Williams. Instead, argue that they provide the **mechanism** for how moral truth becomes socially effective, not an argument that moral truth doesn't exist.

  **Thesis Statement Suggestion:**
  *"While Appiah and Williams correctly identify social shame as the causal mechanism of moral revolutions, this does not reduce moral progress to fashion. Rather, shifts in 'shame-prices' are the necessary social technology that allows latent moral truths—such as the violation of human dignity in slavery—to become practically effective."*

  This lets you keep the sophisticated sociological analysis without surrendering the moral realist intuition that abolition was actually *good*.
