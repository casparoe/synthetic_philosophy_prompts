answer: |-
  **The Fragility of the Chain: Why Agent-Dependency Defeats Expected Value Fanaticism**

  Expected value (EV) fanaticism is the claim that rational agents ought to maximize expected utility even when doing so involves accepting a vanishingly small probability of an astronomical payoff. In its standard formulation, this view relies on risk neutrality and the linearity of value: if the magnitude of the good is sufficiently large, it can outweigh any degree of improbability. This logic drives much of the longtermist intuition that we should prioritize existential risk reduction over near-term alleviation of suffering. However, standard EV models typically treat outcomes as static states of the world determined by exogenous probabilities—like a lottery ticket drawn by nature. This essay argues that EV fanaticism collapses when we shift to an agent-dependent outcome space, where the astronomical payoff is contingent not merely on physical chance, but on a sustained sequence of voluntary choices by the agent or their institutional successors. When the causal chain required to realize the value is fragile and diachronic, the epistemic uncertainty regarding future agency introduces a discount rate that outpaces the growth of the potential value. Therefore, rational agents should reject EV fanaticism in agent-dependent contexts in favor of robustness-maximization.

  To understand why agent-dependency matters, we must first isolate the structure of the standard fanatic's bet. In a classic Pascal's Mugging or longtermist scenario, the agent faces a choice between a certain, modest good and a probabilistic, astronomical good. The probability is usually treated as a fixed parameter of the universe (e.g., "the chance this technology works is 1%"). The agent's role is merely to pull the lever. If the lever is pulled, the probability distribution executes. In this static model, the agent's future psychology is irrelevant; only the current decision matters. Risk neutrality dictates that if $P \times V > \text{Cost}$, the bet is rational, regardless of how small $P$ is.

  The situation changes fundamentally when the realization of $V$ requires the agent—or a lineage of successors—to maintain a specific course of action over time. Here, the probability of the outcome is not a single number but a product of conditional probabilities tied to future volition. The outcome is not "World State W obtains," but rather "I choose $A_1$, and then my successor chooses $A_2$, and then their successor chooses $A_3$..." If any link in this chain breaks, the value does not merely diminish; it ceases to exist. This transforms the decision from a static wager into a dynamic problem of commitment and institutional stability.

  Consider a concrete scenario: The Stellar Archive Project. You are the director of a foundation with a substantial endowment. You have two options. Option A is to fund a global health initiative that will certainly save 10,000 lives over the next decade. Option B is to fund the Stellar Archive. The Archive aims to encode human consciousness into a self-repairing probe capable of seeding simulated civilizations in other star systems. If successful, this yields $10^{20}$ quality-adjusted life years (QALYs).

  However, the Archive is not a "fire and forget" mechanism. It requires a 500-year maintenance window before it becomes self-sustaining. During this period, a specific order of engineers must actively curate the data, repair the hardware, and defend the facility from political interference. Crucially, this requires a specific sequence of choices by the leadership of the order. At every decadal interval, the leadership must choose to prioritize the Archive over other pressing needs (e.g., local poverty, rival scientific projects, or internal schisms). Let us assume that at each decadal node, there is a 90% chance that the leadership remains aligned with the original mission. This is a generous estimate of institutional stability.

  The standard EV fanatic calculates the value of Option B as $P(\text{success}) \times 10^{20}$. If they treat the success probability as a monolithic 1% (based on technical feasibility), the EV is astronomical, dwarfing the 10,000 lives saved in Option A. They argue that risk neutrality compels you to fund the Archive.

  This calculation fails because it ignores the agent-dependent structure of the probability. The probability of the Archive succeeding is not 1%; it is the probability that the technical work succeeds *multiplied by* the probability that the chain of human commitment holds. Over 500 years, there are 50 decadal decision nodes. If the probability of continued commitment at each node is 0.9, the cumulative probability of the chain holding is $0.9^{50}$, which is approximately 0.005. When combined with the technical uncertainty, the total probability of the astronomical payoff drops precipitously.

  But the issue is deeper than mere compound probability. In standard EV theory, probabilities are treated as knowable or estimable based on evidence. In agent-dependent scenarios, the probabilities are epistemically inaccessible. We cannot know the utility functions of future agents. To assume a 90% retention of mission fidelity is to assume a level of sociological prediction that is unjustified. Unlike physical constants, human will is not stable across centuries. The "probability" assigned to future agents making the "correct" choice is not a measure of risk, but a measure of faith.

  This introduces a structural instability that breaks the linearity of EV. In the static model, the agent pays the cost once, and the universe settles the debt. In the agent-dependent model, the "cost" is distributed across time, and the "payment" is contingent on future agents accepting the same normative framework. If a future successor decides that the 10,000 lives they could save *now* outweigh the abstract potential of the Archive, the chain breaks. From the perspective of the current agent, this looks like a failure of the project. From the perspective of the future agent, it is a rational EV maximization based on their local information.

  This creates a paradox for the fanatic. If the future agents are rational EV maximizers, they will only continue the project if the EV remains positive *for them* at *their* time node. But as time passes, the "certain" alternative (saving lives now) remains constant, while the probability of the Archive succeeding may fluctuate. If the chain requires 500 years of sacrifice, it is highly likely that at some node $n$, the local EV of defecting will exceed the local EV of continuing. Because the value of the Archive is counterfactually tied to the *completion* of the chain, a single rational defection by a successor destroys the entire accumulated value.

  Therefore, the rational structure of the decision shifts. It is no longer a question of "Is the expected value high enough?" but "Is the causal chain robust enough to survive the volatility of future agency?" This is a question of resilience, not just magnitude. A project that relies on 500 years of perfect fiduciary alignment is not just low-probability; it is structurally unsound. To bet on it is to bet against the historical record of institutional longevity. No human institution has maintained a singular, high-cost mission without deviation for five centuries. To assign a non-negligible probability to such an event is to ignore the empirical evidence of organizational entropy.

  One might object that we can solve this through binding mechanisms—Ulysses contracts, legal charters, or automated governance. We could lock the funds in a trust that legally mandates the Archive's maintenance. However, legal and political structures are themselves agent-dependent. Laws are interpreted by judges; trusts are managed by trustees; constitutions are amended by legislatures. All of these are human agents capable of defection. If the pressure to divert funds becomes high enough (e.g., a pandemic or war), the "binding" mechanism will be overridden by the very agents it is supposed to constrain. You cannot bind the future's agency from the present without the future's consent, and that consent is exactly what is uncertain.

  Furthermore, this agent-dependency exposes a flaw in the risk-neutrality axiom itself when applied diachronically. Risk neutrality assumes that the agent can absorb the loss. In a static bet, if I lose, I lose my stake. In an agent-dependent chain, if I commit to the Archive, I am not just risking my resources; I am risking the opportunity cost of every future node. I am effectively forcing my successors into a corner where they must choose between violating my mandate or ignoring immediate, certain suffering. If I am a moral agent, I cannot rationally impose a commitment on my successors that restricts their ability to respond to their local moral landscape, especially when the payoff I am chasing is speculative. The "value" of the astronomical outcome is only realizable if the future agents value it as I do. If they do not, the value is zero. Thus, the EV calculation is circular: it assumes the value exists to justify the commitment, but the value only exists if the commitment is justified to future agents.

  This leads to the verdict: EV fanaticism collapses in agent-dependent contexts because the epistemic uncertainty regarding future volition acts as a hard discount factor that renders astronomical values inaccessible. The "fanatic" probability is not a tail risk of a known distribution; it is an unknown unknown regarding the stability of the moral community itself.

  Does this mean we should abandon long-term projects entirely? No. It means the rational norm shifts from *maximizing expected value* to *maximizing robustness*. A rational long-termist strategy is not to bet on a single, fragile, high-value pipeline (like the Stellar Archive) that requires perfect alignment. Instead, it is to invest in goods that increase the resilience of agency itself—education, institutional stability, conflict reduction. These are goods that pay off regardless of which specific sequence of choices future agents make, provided they remain agents. They increase the probability that *some* valuable future exists, rather than betting on *one specific* valuable future.

  In the case of the Stellar Archive versus the global health initiative, the rational choice is the health initiative. Not because $10^{20}$ QALYs isn't large, but because the causal path to those QALYs is mediated by a chain of human choices that is statistically certain to break. The EV fanatic treats the future as a lottery ticket they can buy today. But in agent-dependent scenarios, the future is a partnership. You cannot force a partner to honor a bet that no longer makes sense to them. To act as though you can is not rational calculation; it is hubris.

  Therefore, the "vibes" your study group was debating are philosophically defensible. Agent-dependency introduces a fragility that standard EV models ignore. When the payoff requires a sequence of choices rather than a single stroke of luck, the probability of success decays exponentially with the complexity of the chain. Since the growth of value is linear (or even polynomial) while the decay of institutional fidelity is exponential, the expected value inevitably collapses. The rational agent must acknowledge that they are not the sole author of the future. They are merely the first link in a chain. And a chain is only as strong as its weakest link, not the value of the treasure it pulls.
