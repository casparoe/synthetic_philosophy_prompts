      *   **Counter-Argument (The Commitment Solution):** Couldn't we just bind ourselves? (Ulysses contracts, constitutions).
          *   Rebuttal: Binding is imperfect. Successors have their own agency. You can't EV-maximize for a future agent who doesn't share your utility function.
      *   **Implications for Rational Structure:** It shifts the norm from "maximize outcome" to "maximize robustness." This looks more like satisficing or virtue ethics than pure consequentialism.
      *   **Conclusion:** Restate thesis. The "vibes" were right to be skeptical. Agent-dependency breaks the linearity of EV.

  5.  **Drafting - Section by Section (incorporating tone checks):**
