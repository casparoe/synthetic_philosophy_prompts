prompt: |-
  Okay so me and my study group got into this huge debate last night about EV fanaticism and I realized I don't actually have a settled view, I just have vibes. Write me an essay — like, a real one with a thesis — on whether expected-value fanaticism collapses once you factor in agent-dependency in the outcome space. By that I mean situations where the astronomical payoff isn't just "there's a 0.01% chance of saving 10^20 lives" but rather "the payoff only exists in worlds where I (or my institutional successor) make a specific sequence of choices that keep the causal chain alive." So it's not a passive lottery, it's more like maintaining a fragile research pipeline where pulling out at any node kills the whole branch. You should weigh the usual stuff — risk neutrality, practical paralysis, the comparison with St. Petersburg — but also tackle whether the fact that the value is counterfactually tied to my continued commitment changes the rational structure. Don't end with "it depends"; defend an actual verdict. And construct your own concrete scenario to illustrate the point, don't just reuse the standard vaccine-vs-astronomical examples everyone knows. I'm writing this for a philosophy seminar so keep the tone serious but I don't need footnotes or a bibliography, I just want the argument clear.
