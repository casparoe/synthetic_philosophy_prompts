      *   *The Twist (Agent-Dependency):* Usually, EV calculations treat outcomes as external states of the world (e.g., "Universe U exists"). Here, the outcome *requires* the agent (or their lineage) to persist and make specific choices. It's a dynamic game, not a static bet.
      *   *The Tension:* If the payoff requires a sequence of choices $C_1, C_2, ... C_n$, and at each step there's a risk of defection or failure, does the EV calculation hold? Or does the *requirement of commitment* introduce a discount factor that kills the fanaticism?
      *   *Thesis Idea:* Agent-dependency does *not* collapse EV fanaticism, but it transforms it from a calculation of *probability* to a calculation of *resilience*. The rational obligation shifts from "bet on the low probability" to "build the capacity to sustain the chain." However, if the chain is too fragile, the EV *does* collapse due to compounding uncertainty. I need to pick a side.
      *   *Decision:* I will argue that agent-dependency *mitigates* but does not *eliminate* fanaticism. It imposes a "commitment premium." However, for the sake of a strong verdict as requested, I will argue that **agent-dependency actually strengthens the case against naive fanaticism** because it introduces a structural instability that standard EV models ignore. The "fragility of the agent" acts as a hard discount rate that renders astronomical EVs epistemically inaccessible.
      *   *Refined Thesis:* Agent-dependency collapses naive EV fanaticism because the probability of maintaining the causal chain decays exponentially with time/complexity, outpacing the astronomical value growth. The rational response is not to bet on the astronomical outcome, but to secure the *continuity of agency* itself, which often favors robust, near-term goods over fragile, long-term gambles.

  3.  **Develop the Concrete Scenario:**
      *   *Constraint:* No vaccines, no asteroid deflection, no "save the future" generic stuff.
      *   *Idea:* Something involving information preservation or technological inheritance.
      *   *Scenario:* "The Cryo-Archive." A project to encode human consciousness into a self-repairing stellar probe.
      *   *Details:* You can fund a local charity (save 100 lives now) OR fund the Archive. The Archive has a 1 in 10,000 chance of launching. BUT, even if it launches, it requires 500 years of active maintenance by a specific order of engineers (your institutional successors). If the order dissolves or deviates, the data corrupts. The payoff is $10^{20}$ QALYs (simulated eons).
      *   *Why this works:* It highlights the "sequence of choices" requirement. It's not just "will the rocket work?" It's "will the *people* keep working the rocket?"

  4.  **Outline the Essay:**
      *   **Introduction:** Define EV fanaticism. Introduce the problem of agent-dependency. State the thesis (Agent-dependency collapses the fanaticism due to compounding fragility).
      *   **The Standard View:** Briefly explain why EV fanaticism works in static cases (risk neutrality, linearity of value). Mention St. Petersburg.
