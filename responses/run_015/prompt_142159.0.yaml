answer: |-
  ### Preliminary Deliberation: Brainstorming and Culling

  Right, let's clear the deck. If I just list every nice thing anyone ever said about explanation, I'll give you a wishlist, not a spec. You need a tool for a panel hearing where someone's career is on the line, not a metaphysics seminar.

  *Initial Brainstorm:*
  We want truth. We want understanding. We want actionability. We want the rule to be reliable. We want it to handle contrastive questions (why this rather than that?). We want it to reward unification. We want it to punish ad hocery. We want it to work even when we haven't thought of the true hypothesis. We want it to be distinct from Bayesian conditionalisation. We want it to justify full belief.

  *The Cut:*
  Half of that is wishful thinking. If we demand it works when the true hypothesis isn't on the table, we can't demand truth-conduciveness in the strong sense. If we demand it justifies full belief, we clash with the probabilistic nature of circumstantial evidence. If we demand it be distinct from Bayes, we risk incoherence (Dutch Books).

  For your panel context, 'understanding' is secondary to 'warranted assertion'. You need to know when you are permitted to say "H happened". So I'm cutting 'understanding' as a primary desideratum; it's a by-product. I'm cutting 'distinct from Bayes' as a non-negotiable; if IBE collapses into Bayes, so be it, provided it offers heuristic guidance. I'm keeping 'contrastive structure' because legalistic reasoning is inherently contrastive (H1 vs H2). I'm keeping 'plausibility filter' because you cannot endorse a known falsehood.

  The core tension is this: You want a rule for non-ideal inquirers (finite hypotheses) that delivers a verdict (action) without guaranteeing truth. That is the friction point. The spec must acknowledge that friction, not hide it.

  ***

  ### The Specification: Desiderata for IBE

  Here is the operational spec for Inference to the Best Explanation, tailored for high-stakes, non-ideal inquiry.

  #### 1. Case-Based Requirements

  **The Placeholder Constraint (The Carburettor Case)**
  *   **Case:** A hypothesis explains by naming a locus of failure without specifying the mechanism (e.g., 'the carburettor is faulty' vs. 'the jet is blocked').
  *   **Requirement:** An account must grant provisional explanatory credit to functional placeholders *only if* they license a specific range of interventions or further inquiries. However, it must mark them as inferior to mechanistic accounts for the purpose of final verdicts.
  *   **Rationale:** For the panel, 'someone took the papers' is a placeholder. It explains the absence but doesn't identify the agent. IBE must allow this to sustain an investigation but forbid it from sustaining a sanction unless filled in. Explanatory virtue is tied to actionable specificity.

  **The Copycat Constraint (The Ad Hoc Case)**
  *   **Case:** Hypothesis H2 entails everything H1 does, plus an extra claim E. E is independently confirmed. H1 is simpler.
  *   **Requirement:** The account must penalise the extra claim in H2 unless E was *riskily predicted* by the structure of H2, rather than merely accommodated. If E is added solely to save H1 from refutation or to match data post hoc, the confirmed prediction does not outweigh the loss of simplicity.
  *   **Rationale:** This prevents IBE from absorbing mere curve-fitting. In the archive case, if Hypothesis B adds 'the thief wore gloves' (confirmed by lack of prints) but this was added only after checking for prints, it gains less credit than if the hypothesis naturally entailed glove-wearing.

  **The Unification Constraint (The Duet Case)**
  *   **Case:** H1 unifies two phenomena under one mechanism; H2 uses two separate mechanisms of matched individual simplicity.
  *   **Requirement:** The account must treat unification as a derivative virtue, reducible to probabilistic coherence or prior plausibility, not as a sui generis logical virtue.
  *   **Rationale:** We cannot treat 'unification' as magic. If H1 is truly better, it must be because the single mechanism is more prior-plausible than the conjunction of two separate ones. If the probabilities are exactly matched, IBE must remain silent. Unification does not do independent work beyond coherence and prior probability.

  **The Plausibility Filter (The Known-False Case)**
  *   **Case:** The 'loveliest' hypothesis (most unified, simple, etc.) is known to be false via independent evidence (e.g., it violates a law of physics).
  *   **Requirement:** IBE must include a threshold filter that vetoes any hypothesis failing independent plausibility checks, regardless of explanatory loveliness.
  *   **Rationale:** IBE is not a license to ignore established evidence. If the best explanation for the missing papers is 'they dematerialised', and we know papers don't dematerialise, IBE must not select it. Loveliness is subordinate to basic possibility.

  #### 2. Distinctions to be Respected

  **Best Available vs. Good Enough**
  *   **Requirement:** The account must distinguish between being the best of the set and being *adequate* simpliciter. A verdict requires the leading hypothesis to pass an absolute threshold of probability or robustness, not merely beat its rivals.
  *   **Status:** Non-negotiable. (Prevents the 'Best of a Bad Lot' error).

  **Explaining vs. Being Probable**
  *   **Requirement:** The account must distinguish between a hypothesis that makes the data likely (high likelihood) and a hypothesis that is made likely by the data (high posterior). IBE operates on likelihoods weighted by priors to generate posteriors.
  *   **Status:** Non-negotiable. (Prevents confusion between predictive power and truth).

  **Rule vs. Heuristic vs. Redescription**
  *   **Requirement:** The account must declare whether IBE is a fundamental rule of inference (ampliative), a heuristic for estimating Bayesian priors/likelihoods, or a redescription of Bayesian updating. It cannot be all three simultaneously without contradiction.
  *   **Status:** Non-negotiable. (Prevents equivocation).

  **Contrastive Structure**
  *   **Requirement:** The account must model explanation as inherently contrastive (Why P rather than Q?). The 'best explanation' must be best relative to the specific live alternatives currently on the table.
  *   **Status:** Non-negotiable. (Matches the structure of the panel's task: H1 vs H2, not H1 vs ∞).

  **Full Belief vs. Credence Shift**
  *   **Requirement:** The account must specify whether the output of IBE is a binary acceptance (belief) or a shift in credence. For high-stakes decision-making, it must specify the credence threshold required for binary acceptance.
  *   **Status:** Camp Preference (see below).

  #### 3. Consistency Constraints

  **Pragmatic Coherence**
  *   **Requirement:** Following the rule must not make the inquirer susceptible to a Dutch Book (a set of bets guaranteeing loss).
  *   **Status:** Non-negotiable. (A rule that bankrupts you is irrational).

  **Self-Application**
  *   **Requirement:** The account must either demonstrate that IBE justifies its own reliability without circularity or explicitly admit that IBE is a foundational commitment that cannot be self-justified. It cannot claim self-justification via IBE unless it solves the circularity problem.
  *   **Status:** Non-negotiable. (Prevents dogmatic closure).

  **Truth-Tracking vs. Conditionalisation**
  *   **Requirement:** The account must be consistent with empirical findings on how well explanationist updating tracks truth compared to straight Bayesian conditionalisation. If it claims to be superior, it must show where Bayes fails in non-ideal conditions.
  *   **Status:** Non-negotiable. (Must fit the science of reasoning).

  ***

  ### Critical Assessment of the Desiderata

  #### Non-Negotiable vs. Camp Preference

  1.  **The Plausibility Filter:** **Non-Negotiable.** Any account that allows you to infer a known falsehood because it is 'lovely' is broken. This kills the idea that explanatory virtue overrides all else.
  2.  **Best vs. Good Enough (Threshold):** **Non-Negotiable.** In a disciplinary panel, you cannot sanction someone because their hypothesis was slightly better than a crazy one. Both might be too weak.
  3.  **Pragmatic Coherence (No Dutch Books):** **Non-Negotiable.** Rationality requires coherence.
  4.  **Unification as Derivative:** **Preference (Bayesian Camp).** Lipton-style explanationists often want unification to be sui generis. I have specified it as reducible to coherence/priors. This is a choice to favour formal consistency over explanatory intuition.
  5.  **Full Belief vs. Credence:** **Preference (Traditional vs. Bayesian).** A Bayesian will say IBE only outputs credence shifts. A traditionalist wants binary belief. For your panel, you need binary belief ('they did it' vs 'they didn't'). I have flagged this as requiring a threshold spec. This is where the rubber meets the road.
  6.  **Truth-Conduciveness:** **Prejudice.** People demand IBE be truth-conducive. But in non-ideal conditions (finite hypotheses), truth-conduciveness is not guaranteed. Demanding it as a hard constraint makes IBE unusable in your panel case. It should be a hope, not a requirement.
  7.  **Ampliativeness (Not just Bayes):** **Prejudice.** Many demand IBE be distinct from Bayes. If IBE is just a heuristic for Bayes, it is still useful. Demanding it be fundamentally ampliative risks incoherence.
  8.  **Refusing Conspiracy Hypotheses:** **Prejudice.** We often demand IBE rule out conspiracies. But sometimes conspiracies are the truth. The constraint should be the Plausibility Filter (priors), not a ban on conspiracy shapes.

  #### Tensions and Incompatibilities

  There is a significant tension in this list, specifically a trilemma involving **Ampliativeness**, **Pragmatic Coherence**, and **Non-Ideal Conditions**.

  1.  **The Tension:** If IBE is a fundamental rule of inference (Ampliative) that differs from Bayesian conditionalisation, it risks violating Probability Theory (Pragmatic Coherence). If it respects Probability Theory strictly, it collapses into Bayesian conditionalisation (losing Ampliativeness). Furthermore, in Non-Ideal Conditions (finite hypothesis set), neither guarantees truth.
  2.  **The Conflict:** You want a rule for a panel (Non-Ideal) that delivers a verdict (Full Belief) without bankrupting rationality (Coherence).
      *   If you insist on **Full Belief** from circumstantial evidence, you risk violating **Pragmatic Coherence** (assigning probability 1 to something fallible).
      *   If you insist on **Pragmatic Coherence**, you may never reach **Full Belief**, only high credence, which might not satisfy the panel's need for a binary verdict.
      *   If you insist on **Ampliativeness** (IBE adds something Bayes doesn't have), you struggle to satisfy **Truth-Tracking** constraints without ad hocery.
  3.  **The Knockout Requirement:** The **Plausibility Filter** combined with the **Finite Hypothesis Set** is the killer. This is the 'Bad Lot' objection. If the true hypothesis is not in the set of two live hypotheses on your panel, and both pass the plausibility filter, IBE cannot guarantee truth. If you demand IBE *must* deliver a true verdict, this list is unsatisfiable. I have chosen to prioritise the **Plausibility Filter** and **Coherence** over **Truth-Conduciveness**. This means the account must admit that following the rule perfectly can still lead to a false verdict in non-ideal conditions.

  If I had to drop one to save the system, I would drop **Full Belief**. Shifting to 'warranted high credence' resolves the coherence tension. But for your panel, that might be practically useless. So the tension remains live.

  ***

  ### Camp Evaluation

  The Bayesian reductivist satisfies the Consistency and Distinction constraints comfortably but struggles to justify the Full Belief requirement without arbitrary thresholds, often reducing IBE to a heuristic for priors. The Lipton-style contrastive account handles the Case-Based requirements (especially Placeholder and Duet) with greater intuitive fidelity but risks violating Pragmatic Coherence if 'loveliness' is not strictly mapped to probability. The van Fraassen-style sceptic passes every consistency check by refusing to infer truth from explanation altogether, limiting IBE to empirical adequacy, which renders it useless for your panel's need to establish what *actually* happened rather than what saves the phenomena.
