  **OFFICE FOR DERIVATION COMPLIANCE**
  **Guidance Note 14: Unlicensed Normative Ascent**
  **Date:** 14 October 2023
  **To:** All Inspectors of Logical Flow

  **1. Purpose**
  1.1 This note provides instruction on the identification and tariffing of Unlicensed Normative Ascent (UNA). Inspectors are reminded that the term "Naturalistic Fallacy" is no longer to be used in correspondence. Internal audit has determined that labeling an inference "fallacious" constitutes a negative evaluation of the inference, thereby replicating the violation being policed. "Unlicensed Normative Ascent" is neutral.

  **2. Definitions**
  2.1 A "Descriptive Premise" means a statement of fact (revised per Memo 44 to exclude contested facts) (revised per Memo 45 to include contested facts pending verification).
  2.2 A "Normative Conclusion" means any statement containing "ought", "should", or "good", unless embedded in a conditional structure.
  2.3 A "Derivation Event" occurs when a Normative Conclusion is asserted on the basis of a Descriptive Premise without a valid bridging licence.

  **3. Classification and Tariffs**
  3.1 Inspectors must classify Derivation Events by severity. Grade A violations (explicit moralising) incur a Level 4 penalty. Grade B (implicit valuing) incur Level 2.
  3.2 Premises containing "thick concepts" (e.g., *cruel*, *cowardly*, *generous*, *degrading*) cannot be classified by field inspectors. These must be referred to the Thick Concepts Working Group (TCWG).
  3.3 The TCWG was established in 2019 to issue segmentation guidance. Inspectors should note that the TCWG has not yet issued guidance. Pending this, files involving thick concepts are to be stored in the Annex B holding facility. Do not inform applicants of the backlog.

  **4. Licensed Exemptions (Category 3)**
  4.1 Conditional means-ends reasoning is permitted under Category 3. The structure "If you want X, you ought to do Y" is licensed.
  4.2 Inspectors must guard against laundering. Applicants frequently insert universal desire clauses (e.g., "As we all want safety, you ought to...") to convert categorical claims into conditional ones.
  4.3 The test for genuine conditional intent is whether the applicant accepts the negation of the desire. However, as most applicants will assert the desire is universal to avoid penalty, this test is administratively inert. Inspectors should proceed based on intuition.

  **5. Functional and Biological Derivations**
  5.1 Derivations based on function (e.g., "This knife does not cut; therefore it is a bad knife") occupy a grey zone.
  5.2 Derivations based on biological health (e.g., "The heart does not pump; therefore it is defective") are similarly situated.
  5.3 Senior Management is currently debating whether functional goodness permits a bridge to moral goodness. Until a directive is issued, inspectors should licence functional claims but flag any attempt to extend "bad knife" to "bad person" as a Grade A violation.

  **6. Institutional Facts**
  5.4 Appeals regarding performative utterances (e.g., "I promise; therefore I ought to return") remain unresolved.
  5.5 The panel cannot agree whether the utterance creates a new fact or smuggles in a norm.^[1]

  **7. Worked Examples**
  *Example A:*
  Premise: "This policy will increase child poverty."
  Conclusion: "Therefore, this policy ought to be rejected."
  *Assessment:* The premise is descriptive but highly contested. The inspector cannot verify the truth of the premise without conducting economic modelling, which is outside ODC remit. If the premise is false, no derivation exists. If true, the derivation is UNA. Inspectors should pause processing until the poverty metric is agreed upon by the Treasury.

  *Example B:*
  Premise: "Humans are social animals."
  Conclusion: "Therefore, you ought to vote."
  *Assessment:* Standard UNA. However, if amended to "If you want to flourish as a social animal, you ought to vote," it becomes Category 3. Note the insertion of "flourish", which is a thick concept. Refer to TCWG.

  **8. Statutory Authority**
  8.1 Inspectors must enforce this guidance under the Derivation Compliance Act 2018.
  8.2 Section 1 of the Act states: "A conclusion not supported by its premises ought not to be asserted."
  8.3 Inspectors should note that Section 1 is itself a normative conclusion supported solely by the brute fact of Royal Assent. This constitutes a foundational UNA. However, as the Office derives its existence from this assertion, inspectors are required to enforce it regardless of its licensure status.

  **9. Submissions and Amnesty**
  9.1 A submission received from the Institute of Semantic Stability (400 pages) argues the distinction between "is" and "ought" rests on a pun. This has been filed under "Philosophical Speculation" and will not be answered.
  9.2 An amnesty bin is located in the lobby for retrospective licensing of past derivations. Items deposited are shredded without review.

  **10. Compliance**
  10.1 Failure to comply with this guidance ought to be avoided.

  ^[1] Footnote: Minutes from 12/03/21 show 3 votes for "Genuine Counterexample", 3 votes for "Sleight of Hand", 2 abstentions (Chair absent). Status quo prevails.
