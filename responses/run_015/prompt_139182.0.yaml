  # Committee Decision Tree: Resolving Prescribing Reversals

  **Starting Point:** You have a pooled table favoring **Surgery A** (overall winner) and stratified tables (Mild/Severe) favoring **Surgery B** (winner in every subgroup). This is because Surgery B was historically given to the Severe cases.

  Follow the questions in order. Stop at the first leaf you reach.

  ### 1. The Timing Question
  **Was the stratifier (e.g., Disease Severity) measured and fixed *before* the treatment was chosen?**
  *   **No (Post-Treatment):** The stratifier is something the treatment influences (e.g., "Post-op Complication Status").
      *   **→ LEAF: Causal-graph / back-door adjustment**
      *   *Reasoning:* Stratifying on a post-treatment variable creates bias (collider bias). Trust the pooled table; ignore the stratified split.
  *   **Yes (Pre-Treatment):** The stratifier existed before the decision (e.g., "Baseline Severity").
      *   **→ Go to Question 2.**

  ### 2. The Measure Question
  **If you switch from Ratios (Odds/Risk Ratios) to plain Risk Differences (absolute percentage points), does the reversal disappear?**
  *(i.e., Does the Pooled table now agree with the Stratified tables when using absolute %?)*
  *   **Yes (Reversal Disappears):** The conflict was mathematical, not clinical.
      *   **→ LEAF: It's an artifact of the measure**
      *   *Reasoning:* This is non-collapsibility. The "effect" is the same, but the math distorts the average. Trust the pooled table for absolute risk, but acknowledge the ratio was misleading.
  *   **No (Reversal Persists):** Surgery B still wins in strata even with absolute percentages.
      *   **→ Go to Question 3.**

  ### 3. The Granularity Question
  **If you split the strata finer (e.g., Severity + Age), does the winner flip *again* relative to the coarser split?**
  *(i.e., Does the Fine Partition reverse the Coarse Partition?)*
  *   **Yes (Instability):** The recommendation depends entirely on how finely you slice the data.
      *   **→ LEAF: These strata aren't poolable at all**
      *   *Reasoning:* There is likely unmeasured confounding or M-bias. You cannot trust any average here. Do not issue a guideline until better data exists.
  *   **No (Stable):** The Fine Partition agrees with the Coarse Partition (Surgery B wins in all slices).
      *   **→ Go to Question 4.**

  ### 4. The Application Question
  **Does this guideline need to be applied *before* we know the patient's stratum (Policy), or *after* (Individual)?**
  *   **Before (Policy/Blind):** We must choose a formulary or ER protocol without testing for Severity first.
      *   **→ LEAF: Sure-thing-principle response from decision theory**
      *   *Reasoning:* Even if B is better in every state, if you cannot condition on the state, you must maximize expected utility based on the population average. The Pooled table dictates the rational blind choice.
  *   **After (Individual/Clinical):** We test for Severity, then choose.
      *   **→ Go to Split 4b.**

  ### 4b. The Mechanism Split (Indistinguishable Pair)
  **Do we view the strata as capturing the biological mechanism, or just statistical control?**
  *(Note: For this committee's purpose, these two positions yield the same action.)*
  *   **Option A (Statistical Control):** We just need to adjust for confounding to find the true effect.
      *   **→ LEAF: Potential-outcomes style ignorability**
  *   **Option B (Biological Mechanism):** The effect literally does not exist as a single number; it is only real within the local groups.
      *   **→ LEAF: There is no single effect only local mechanisms**
  *   **Committee Note:** These two leaves are **indistinguishable in practice**. Both require you to write the guideline as: "If Mild, choose B; If Severe, choose B." Choose the label that fits your department's jargon.

  ***

  ### Unoccupied Combinations & Coherence Notes

  *   **Post-Treatment + Measure Check:** *Incoherent.* If the variable is post-treatment (Leaf 1), asking about Risk Difference artifacts (Leaf 2) is meaningless because the stratification itself is invalid.
  *   **Granularity Unstable + Application After:** *Unattractive.* If the strata aren't poolable (Leaf 3), applying a guideline individually (Leaf 4) is dangerous. You cannot personalize care on unstable data.
  *   **Potential-Outcomes vs. No Single Effect:** As noted in Split 4b, the tree cannot logically separate these based on the four distinctions provided. They represent a philosophical difference about "truth" rather than a decision difference about "action."

  ### Summary of Positions
  1.  **Causal-graph:** Don't stratify colliders.
  2.  **Artifact:** It's just math (non-collapsibility).
  3.  **Not Poolable:** Data is too unstable to trust.
  4.  **Sure-Thing:** Blind policy must follow pooled risk.
  5.  **Potential-Outcomes / No Single Effect:** Personalized care follows stratified truth. (Indistinguishable).
