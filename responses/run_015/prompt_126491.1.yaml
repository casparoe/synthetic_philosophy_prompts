answer: |-
  Here is an audit of your epistemological stack, ordered by the severity of the collision. I have distinguished between *logical contradictions* (which break the system), *algorithmic conflicts* (which cause hesitation), and *apparent tensions* (which resolve under scrutiny).

  ### 1. The Metaphysical Fault Line: (1) vs. (2)
  **Severity: Critical.**
  **Collision:** Direct Logical Contradiction.

  *   **The Conflict:** (1) defines chance *exhaustively* as patterns in classes/sequences ("nothing more"). (2) asserts single-case chance is *not* a remark about a class ("not a remark about a class it happens to belong to"). You cannot hold that chance is *only* class frequency and simultaneously that single-case chance is *distinct* from class frequency.
  *   **The Damage:** This undermines the ontological status of the numbers you are logging. If (1) is true, your single-case forecasts are shorthand for class claims. If (2) is true, (1) is false, and you are positing propensities you claim to reject. This makes your calibration claims (in 2) metaphysically ungrounded: are you calibrating against frequencies or propensities?
  *   **The Repair (7) Stress-Test:**
      *   **Does it work?** Yes, (7) resolves the contradiction by making single-case chance *elliptical*. "The chance of this surgery" becomes shorthand for "The chance of this surgery *relative to the most relevant class*."
      *   **The Bill:**
          1.  **Loss of Uniqueness:** You lose the comfort that there is *one* number you are trying to find. There is a manifold of true numbers (one per valid reference class).
          2.  **Calibration Shift:** Calibration no longer proves you are tracking "The Chance." It proves you are tracking "The Chance relative to the classes you implicitly selected." If your class-selection algorithm is biased, you can be perfectly calibrated and still be "wrong" about the world structure.
          3.  **Principal Principle Weakening:** The PP becomes "Set credence to $p$ if $C$ is the *relevant* class." This moves the hard work from knowing the chance to knowing the relevance.
      *   **Verdict:** (7) is survivable and is essentially a Lewisian Best System Analysis with a pragmatic overlay. It requires you to downgrade (2) from "Realism" to "Useful Fiction."

  ### 2. The Rationality Paradox: (5) Internal Contradiction
  **Severity: High.**
  **Collision:** Normative Incoherence.

  *   **The Conflict:** (5) contains two normative claims: (A) "Default to the base rate... treat any move to a narrower subclass as something to be suspicious of" and (B) "Deliberately setting aside evidence one possesses is irrational... condition on total evidence."
      *   If you possess specific evidence (e.g., the friend's capability in Case 8), (B) demands you use it. (A) demands you suspect it and stick to the base rate. You cannot do both.
  *   **The Damage:** This leaves you without a coherent rule for evidence integration. It forces you into motivated reasoning: you can justify ignoring evidence by citing (A) or using evidence by citing (B) depending on which number feels safer.
  *   **What Must Give:** You must drop the strong version of the "Outside-View Default."
  *   **Cheapest Revision:** Replace (5A) with a **Reliability-Weighted Evidence Rule**.
      *   *Revision:* "Default to the base rate *unless* the specific evidence is quantitatively reliable enough to construct a narrower class with lower expected error."
      *   *Cost:* You lose the simple heuristic of "Outside View Good, Inside View Bad." You must now estimate the *variance* of your inside-view adjustment. This is computationally expensive but epistemically honest.

  ### 3. The Algorithmic Conflict: (4) vs. (5)
  **Severity: Medium.**
  **Collision:** Operational Disagreement.

  *   **The Conflict:** (4) says use the *narrowest* adequate class. (5) says suspect narrowing and prefer the *broad* class.
      *   In practice, the "narrowest adequate" class often has small $N$ (high variance). The "outside view" class has large $N$ (low variance) but high bias.
      *   (4) prioritizes Bias reduction. (5) prioritizes Variance reduction.
  *   **The Damage:** This causes forecasting friction. You oscillate between "I should be specific" and "I should be humble."
  *   **Resolution:** These are not contradictory if you define "Adequate" in (4) correctly.
      *   If "Adequate" in (4) means "Statistically Reliable" (sufficient $N$), then (4) and (5) converge. You wouldn't narrow to a class of one (Case 8) because it's not "adequate." You would narrow to the post-maintenance machine (Case 9) because it *is* adequate.
      *   *Revision:* Explicitly bind (4) and (5) by defining **Adequacy = Reliability**.
      *   *Cost:* You must admit that "Narrowest" is constrained by sample size, not just causal specificity.

  ### 4. The Case Study Anomaly: (8) vs. (9)
  **Severity: Low (Apparent Collision).**
  **Collision:** Behavioral Inconsistency (Resolved).

  *   **The Conflict:** You suspect these are inconsistent because you ignore specifics in (8) but use them in (9).
  *   **The Audit:** They are **consistent** under Rule (4) *if* you interpret "Statistically Reliable Frequency Data" strictly.
      *   **Case (9):** "Well-characterized process... post-maintenance protocol." This implies you have historical data for *this specific state*. The narrow class has $N > 30$ (or whatever your threshold is). Rule (4) mandates using it.
      *   **Case (8):** "Friend... unusually capable." The class "Companies founded by [Friend]" has $N=1$ (or $N=0$ for future). There is **no statistically reliable frequency data** for this narrow class. Rule (4) mandates falling back to the broader class ("Seed-stage in sector").
  *   **Verdict:** Your intuition that these pull in opposite directions is correct, but your *behavior* is consistent with (4). The inconsistency lies in (5), which suggests you *should* be suspicious of the narrow class in (9) (you aren't) and suggests you *should* ignore the evidence in (8) (you are).
  *   **Recommendation:** Trust your verdicts in (8) and (9). They reveal your *actual* rule: **Narrowest Class with $N \geq \text{Threshold}$.** Formalize that threshold rather than relying on the vague "Outside View" heuristic.

  ---

  ### The Price of (7): Chance Relativism
  You asked for the bill on (7) to be stated precisely.

  **The Benefit:** It saves you from metaphysical contradiction between (1) and (2). It allows you to keep forecasting single cases without positing magic propensities.

  **The Cost (The Bill):**
  1.  **The Relevance Regress:** If chance is relative to a class, and class selection is interest-relative (3), then "The Probability" is always conditional on your current interests/goals. You cannot claim your forecast is "correct" in a vacuum, only "correct relative to this modeling choice."
      *   *Downstream Impact:* You cannot use calibration to prove you are "good at forecasting" in a general sense, only that you are good at selecting classes that match your calibration set.
  2.  **The Principal Principle Gap:** The PP says $Cr(E) = Ch(E)$. Under (7), $Ch(E)$ is a vector $\{Ch(E|C_1), Ch(E|C_2)...\}$. The PP no longer tells you which number to pick. It offloads the hard epistemic work to **Class Selection**.
      *   *Downstream Impact:* You need a meta-epistemology for class selection. (4) and (5) are attempts at this, but as noted, they conflict.
  3.  **Loss of "Truth" Comfort:** You must accept that two forecasters with different information classes can both be "right" about the chance, even if their numbers differ. This makes disagreement harder to resolve.

  **Survivability:** Highly survivable. This is effectively the **Reference Class Forecasting** stance formalized by Kahneman & Tversky, grafted onto a Humean metaphysics. It is the standard working epistemology of professional intelligence analysis and actuarial science.

  ---

  ### Minimal Revision Plan
  To preserve 90% of your system with 10% rewriting, execute the following patches:

  1.  **Adopt (7) but modify (2).**
      *   *Change:* "Realism about single-case chance" $\rightarrow$ "Operationalism about single-case chance."
      *   *Wording:* "I assert single-case chances as shorthand for chance-relative-to-the-best-available-class."
  2.  **Merge (4) and (5) into a Single Inference Rule.**
      *   *Discard:* The "Outside-view default" and "Suspicion of narrowing" language.
      *   *Replace with:* **The Reliability-Weighted Reference Class Rule.**
      *   *Rule:* "Select the narrowest reference class for which the historical frequency data has variance below threshold $T$. If no such class exists, broaden until variance $< T$. Condition on specific evidence only if it can be operationalized into a class with variance $< T$."
      *   *Why:* This explains why you ignored the friend's skill (cannot operationalize into low-variance class) but used the machine specs (can operationalize). It resolves the Total Evidence tension by defining "Evidence" as "Data that improves class reliability."
  3.  **Keep (6) (Precision).**
      *   This is compatible with Relativism. You still need a point estimate for decision theory; that estimate is simply the output of the Reliability-Weighted Rule.

  **Summary:** Your practice (8 & 9) is more consistent than your theory (4 & 5). Your metaphysics (1 & 2) is contradictory but fixable via (7). The core tension is not about chance, but about **when specific evidence counts as data vs. noise.** Formalize that threshold, and the rest of the stack stabilizes.
