answer: |-
  If cognition spills into the world, the boundary between agent and environment dissolves, yet without some boundary, responsibility and authorship vanish into thin air. We require a stable self to assign praise or blame, even as our tools and habits prove that self is constantly reconstructed by what it touches. This workshop lives in the friction between those two truths.

  Welcome to the Institute for Situated Inquiry. It is a rare privilege to stand before a room where the architects of cognitive theory sit beside the practitioners who live inside it. Half of you map the mind's extension into matter; the other half shape matter to extend the mind. We are gathered because the border is porous, but we must admit that porosity risks flooding.

  Think of the notebook you filled last year. The ideas inside it argue with you now. You did not write today's thought; you wrote the constraint that made today's thought inevitable. The earlier you is an architect who left the building; the current you is a tenant rearranging the furniture. Yet, when the roof leaks, both are held liable. This is the retroactive scaffolding dilemma. [Pause]

  For the philosophers here, this sounds like an ethics of disappearance. If the agent is distributed across time, who bears the weight when the system fails? Who apologizes when the algorithm biases the outcome, if the coder who wrote the weights is not the same person who deploys them? For the artists and designers, this is simply Tuesday. You know the draft that surprises you, the choreography that leads the dancer rather than following them. You know the feeling of meeting your own creation as a stranger.

  We cannot retreat to the comfort of a solid, unchanging self who merely uses instruments. That is a fairy tale we tell to sleep better at night. Nor can we dissolve entirely into process, leaving no one home to accept the award or the apology. We are here precisely to ask where praise and blame land when cognition is shared with things that outlast our immediate intentions.

  [Gesture to the room]

  So, let us work. Not to seal the pores, but to understand what flows through them. When you build a system that thinks for your future self, ask who that future self will be. If you write a protocol that dictates your next move, ensure you can still recognize the hand that signs the result. We must hold the tension between the tool that makes us and the self that owns the tool.

  [Smile]

  Welcome to Porous Minds. Let the scaffolding hold, even as we shift beneath it.
