      To evaluate whether cognition corrupts perception, we must first define our terms. **Informational encapsulation** is the hypothesis that perceptual processing operates without access to an organism's beliefs or desires. **Experience** refers to the phenomenal character of perception—what it is like to see red—distinct from **judgment**, which is the doxastic endorsement of a proposition. **Justification** is the property that makes a belief rational or warranted. The debate over **cognitive penetration** asks whether non-perceptual states alter experience itself. If they do, does perception lose its power to justify belief?

      Adopting your taxonomy, we distinguish three top-down influences. **Sensitivity-like** influences alter channel gain or discriminability ($d'$). **Criterion-like** influences shift the decision threshold ($\beta$) based on asymmetric error costs. **Content-imposing** influences alter the represented property itself, independent of sensory evidence.

      The claim that penetration undermines justification fails because it conflates optimization with corruption. Sensitivity and criterion shifts are not epistemic defects; they are rational adaptations modeled by Signal Detection Theory. A visual system optimized for survival must weight false negatives (missing a predator) more heavily than false positives (mistaking rustle for predator). Adjusting gain or criterion minimizes expected loss given environmental noise. These processes preserve the mapping between world and state, merely tuning the signal-to-noise ratio. They do not sever the causal link required for justification; they refine it. Thus, influences driven by hunger, fear, or valence are features of a rational agent, not bugs in a camera.

      Content-imposing influences require a different treatment. Here, the experience represents a property solely because a cognitive state dictates it. This does not generate a new skeptical problem; it merely transforms the epistemic structure. If a belief that "a warbler is present" imposes content on experience such that one sees a warbler, that experience cannot independently justify the belief. It offers **dependent support**. The experience inherits the epistemic standing of the cognitive state that shaped it. If the belief was justified (e.g., by reliable testimony), the experience shares that justification. If the belief was unjustified, the experience is epistemically inert regarding that proposition. The problem is not penetration *per se*, but the violation of an independence condition.

      This leads to the revised independence condition: an experience justifies a belief only if the experience is not an epistemic descendant of that very belief. This survives the **circularity objection**. Critics argue that if experience inherits standing from cognition, and cognition derives from past experience, we have a vicious feedback loop. This objection assumes justification requires an unmoved mover. Instead, justification is diachronic. A loop is vicious only if it isolates the system from external input. If the cognitive state originates in reliable perceptual history (learning), the chain remains grounded in the world. The "loop" is actually a pipeline of calibrated reliability. Sub-personal processing does not invalidate this; it merely hides the mechanics.

      Finally, consider the **ornithologist and the novice**. Both see a bird as a warbler. Phenomenologically, they may be indistinguishable. The penetration label applies equally if top-down states influence both. However, the epistemic difference lies in the **genealogy of the tuning**. The ornithologist's state results from forty seasons of perceptual learning—cached statistical regularities that have altered sensitivity-like parameters through reliable causal contact with warblers. The novice's state results from a singular testimonial belief imposing content. The expert's experience is justified because its top-down influences are themselves grounded in reliable perceptual history; the novice's is not. The difference is not truth (both could be looking at a warbler), nor is it merely the presence of penetration. It is the reliability of the source governing the penetration. The expert's cognition is a compressed history of reliable perception; the novice's is a freestanding assumption.

      Therefore, cognitive penetration raises no distinctive epistemic problem. Sensitivity and criterion shifts are rational optimizations. Content imposition transforms perception into a mirror of cognition, requiring us to evaluate the cognition, not the perception. The demand for encapsulation is a demand for a foundationalism that ignores how rational agents optimize error management. We should not ask if perception is penetrable, but whether the penetrating states are themselves epistemically anchored.

