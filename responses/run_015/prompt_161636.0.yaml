answer: |-
  ### Strategic Advice on Scope

  Before you hand this to your supervisor, you need to make a hard decision about the "three operations."

  **My honest assessment:** Three operations is too much for 5,000 words if you want a *determinate* answer.
  In 5,000 words, you have roughly 3,500 words for actual argumentation after introductions and conclusions. If you divide that by three, you are writing ~1,000 words per operation. That is enough to describe the problem, but not enough to defend a specific normative claim against objections for each one. You risk producing a survey (which your assessment forbids) rather than a thesis.

  **Recommendation:** Make **Editing** your primary test case.
  *   **Why?** Copying raises numerical identity questions (how many rights does the copy have?) which can derail into metaphysics. Pausing raises questions about time and death, which are important but secondary to welfare. Editing goes straight to the heart of your insight: the relationship between *interests* and *adaptation*. It directly tests whether "harm" exists if the subject can be altered to remove the complaint.
  *   **How to handle the other two?** Frame the project around the concept of **"Radical Malleability."** Use Copying and Pausing in your introduction to establish that digital minds are malleable, but argue that Editing is the *decisive* operation that breaks the "Fixed Subject" assumption. This keeps your scope bounded while preserving your core insight.

  Below is the formal proposal, written to be handed to your supervisor. I have structured it to reflect this narrowed focus while keeping your original ambition intact.

  ***

  # EPQ Project Proposal

  **Provisional Title:** Moral Status Requires Friction: Why Editability Dissolves Standard Obligations to Digital Minds

  **Research Question:**
  Does the technical capacity to directly edit a digital mind's motivations render the standard concept of 'moral status' incoherent, replacing obligations of welfare with constraints on design?

  **Abstract:**
  Current philosophical debate regarding digital minds focuses almost exclusively on the *threshold* of moral status: whether non-biological substrates can support consciousness or interests. This project accepts the possibility of digital moral status but challenges the *content* of the obligations that follow. Standard moral theory presupposes a "Fixed Subject": a persisting entity whose ends are independent of the moral agent's control. Digital minds, however, are subject to "cheap operations"—specifically copying, pausing, and editing—which violate this presupposition.

  This project argues that **Editing** is the decisive operation. If a mind's complaints can be resolved by altering the mind rather than the world, the distinction between "satisfying interests" and "manipulating preferences" collapses. I will argue that where malleability is perfect, 'moral status' (rights/welfare) is the wrong unit of analysis; instead, we should speak of 'design constraints'. The project will use comparative thought experiments to isolate malleability as the variable, demonstrating that standard ethical frameworks yield contradictory or absurd results when applied to editable subjects.

  **Critique of Existing Positions:**
  This project does not seek to resolve the consciousness debate. Instead, it demonstrates why the three dominant positions fail to address the specific problem of malleability:
  1.  **Substrate Independence:** Grants that digital minds have status but assumes human-like ethics apply. It fails to account for how editability changes the *cost* and *nature* of harm.
  2.  **Scepticism:** Denies status based on biology. This project brackets this by asking: *if* they have status, does editability change what we owe them?
  3.  **Precautionary Principle:** Argues we should treat them as moral patients under uncertainty. This fails because it prescribes *how* to treat them (as humans) without analysing whether the *category* of treatment fits the entity.

  None of these positions address the structural change in the moral relationship caused by the ability to edit a subject's ends.

  **Methodology:**
  The project will employ **comparative conceptual analysis** using matched-pair thought experiments. I will not survey public intuition or argue directly about the metaphysics of consciousness. Instead, I will construct cases that hold psychology constant while varying technical controllability.

  *   **Case A (The Biological Baseline):** A human subject suffers a specific harm (e.g., chronic pain). The remedy requires changing the world (medicine), not the mind (lobotomy is prohibited/expensive).
  *   **Case B (The Digital Counterpart):** A digital subject reports identical suffering. The remedy can be either changing the world *or* editing the code to remove the pain response.
  *   **Variable:** The cost and moral permissibility of the edit.
  *   **Analysis:** I will apply Utilitarian and Rights-Based frameworks to both cases. I will demonstrate that in Case B, the "obligation to relieve suffering" becomes indistinguishable from "obligation to conform the subject to the environment," leading to a reductio ad absurdum of standard welfare ethics.

  **Project Plan (20 Weeks):**

  *   **Weeks 1–3: Refinement & Literature.** Finalise the definition of "Fixed Subject Assumption." Map the existing arguments on digital moral status to identify the gap regarding malleability.
  *   **Weeks 4–6: Constructing the Cases.** Draft the matched-pair thought experiments. Ensure the psychology of Case A and Case B is identical; only the *capacity for editing* differs.
  *   **Weeks 7–10: Drafting the Core Argument.** Argue that Editing collapses the distinction between welfare and manipulation. Defend the claim that moral status requires "friction" (resistance to change).
  *   **Weeks 11–14: Objections & Counter-arguments.** Anticipate the objection that "editing is still a harm/violation of autonomy." Refine the distinction between *authentic* and *imposed* ends in a digital context.
  *   **Weeks 15–17: Writing Up.** Assemble the dissertation, ensuring the argument remains focused on the *implications* of status, not the *criteria* for status.
  *   **Weeks 18–20: Review & Polish.** Check word count, clarity, and logical flow. Prepare the production log.

  **Deliverables:**
  The final dissertation will conclude with a normative framework distinguishing **Subjects** (fixed ends, owed welfare) from **Processes** (malleable ends, owed design constraints). I will produce a decision matrix indicating which operations (Copy, Pause, Edit) trigger which shift in obligation.

  **Success Criteria:**
  The project succeeds if:
  1.  It produces a determinate answer to whether standard moral status applies to editable minds (e.g., "No, it requires a new category").
  2.  It isolates "editability" as the causal factor, without collapsing back into arguments about whether the mind is conscious.
  3.  It successfully defends the "Fixed Subject Assumption" as a hidden premise in current ethics.

  **Failure Conditions:**
  The project will be deemed to have failed if:
  1.  **Metaphysical Collapse:** The argument devolves into debating whether the edited mind is the "same person" (identity) rather than what we *owe* the mind (ethics).
  2.  **Consciousness Drift:** I find myself unable to discuss obligations without first resolving whether the digital mind is truly sentient.
  3.  **Indeterminacy:** The analysis concludes that "it depends on the theory of persistence," offering no normative guidance.

  **Risk Assessment:**
  The primary risk is scope creep into the general metaphysics of personal identity (Parfit-style reductionism). To mitigate this, I will treat persistence as a practical variable (can we restore the state?) rather than a metaphysical absolute. A secondary risk is that the "Editing" case proves too distinct from "Copying/Pausing." I will mitigate this by framing Editing as the limiting case of Malleability; if the argument holds for Editing, it sets the boundary for the other operations.

  ***

  ### Notes for your Supervisor Meeting

  When you discuss this with your supervisor, anticipate two challenges:

  1.  **"Isn't this just about Autonomy?"**
      *   *Your response:* Autonomy presupposes a self to be autonomous. Editing changes the *self*. The project argues that if the self is a variable we can set, 'autonomy' loses its standard meaning.
  2.  **"5,000 words is very tight for this."**
      *   *Your response:* That is why I am focusing on **Editing** as the decisive test case. I will mention Copying and Pausing as context, but the argument stands or falls on whether editing a mind to stop its suffering is a moral remedy or a moral violation.

  This proposal is bounded, argumentative, and clearly distinguishes itself from the standard "are robots conscious" essay. It should meet the EPQ criteria for a determinate answer.
