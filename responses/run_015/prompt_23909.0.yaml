      *   *Argument 2: The Arbitrariness of Bounds.* If I refuse to pick a number because evidence is sparse, why am I confident picking *bounds*? Is $[0.1, 0.9]$ better than $[0.3, 0.7]$? What justifies the width?
      *   *Argument 3: Computational/Complexity Cost.* Managing sets of probabilities is mathematically heavier.
      *   *Argument 4: Second-Order Probability.* Isn't a set of priors just a distribution over priors? If so, why not integrate to get a single precise credence?
      *   *Argument 5: Dilation.* A specific technical problem in IP where conditioning on evidence *widens* the interval regardless of what the evidence says.

  3.  **Sort by Severity (Known Cost $\to$ Fatal Flaw):**
