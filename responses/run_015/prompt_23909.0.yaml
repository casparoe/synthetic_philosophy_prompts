      *   **Level 2: The Arbitrariness of Bounds (Significant Challenge).** The user asked: "Where do endpoints come from?" If evidence is too weak for a point, is it strong enough for a bound? If I say $[0.2, 0.8]$, why not $[0.19, 0.81]$? This risks shifting the arbitrariness one level up. *Verdict:* Undermines the "objectivity/honesty" claim.
      *   **Level 3: The Reduction to Precision (Major Theoretical Problem).** The "Second-Order Bayesian" objection. If you have a set of priors, don't you have a credence *about* which prior is right? If you aggregate them (e.g., via center of gravity), you get a precise number. Refusing to do so looks like a refusal to maximize expected utility. *Verdict:* Challenges the coherence of IP as a distinct normative standard.
      *   **Level 4: Dilation and Inertia (Potential Fatal Flaw).** This is the technical killer.
          *   *Dilation:* Learning $E$ makes your belief in $H$ *less* precise (interval widens) regardless of $E$. This violates the intuition that evidence should help.
