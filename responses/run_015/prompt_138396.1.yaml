prompt: |-
  Hey — I'm putting together a discussion session on constitutional interpretation for a reading group and I've painted myself into a corner, so help me out.

  Take District of Columbia v. Heller (2008) and run it as a test case for textualism vs. purposivism. Facts you can take as given, no need to check them: DC had basically outlawed handgun registration and required any firearm kept in the home to be stored unloaded and either disassembled or trigger-locked; Heller, who was licensed to carry a gun at work, couldn't register one to keep at home; the Court struck the scheme down 5-4, Scalia writing the majority, with Stevens and Breyer each writing a dissent. I care about the methodological stuff, not the gun stuff.

  What got me stuck is this: the Second Amendment states its own purpose, right there in the text — "A well regulated Militia, being necessary to the security of a free State, the right of the people to keep and bear Arms, shall not be infringed." Call it the written-purpose problem (my label, not a real term of art): when a text contains an explicit statement of why it exists, a textualist has to either treat that statement as doing work — and then explain how a purpose clause limits an operative clause, which starts to sound like the thing textualism was supposed to reject — or treat it as decoration, and then explain why some of the enacted words are allowed to be inert. So:

  1. Map the case properly on both theories. Whose understanding is supposed to be authoritative (a reader in 1791, one in 1868, a lawyer, an ordinary citizen?), what each theory says counts as evidence — founding-era sources, the preambles and rights provisions in the state constitutions, post-enactment practice, the Court's much older militia cases — and what each theory predicts the prefatory clause should actually do.

  2. Then say what each opinion really did. My read, whcih you should push back on hard if it's wrong, is that "purposivism" isn't one position here at all: Stevens uses purpose as a restraint on the operative clause, while Breyer does something else entirely — weighing whether DC's ban is proportionate to the Amendment's aims — and I don't know what to call that or whether it belongs in the same debate as the other two.

  3. Where it breaks. The passage in Scalia's opinion that lists longstanding regulations — carrying in sensitive places, conditions on commercial sales, and so on — and says the list isn't exhaustive has always bugged me. It reads like policy. Is that textualism cheating, purpose leaking back in, or something both theories are just silent about? And be honest about whether method predicted the outcome here, or whether the Justices picked the method to fit.

  4. Does the written-purpose problem generalize? Plenty of federal statutes have enacted findings and purpose sections sitting at the very top of the text, in the same document as the operative rules. Is it more defensible for a textualist to ignore those than to ignore the militia clause, or is my problem just constitutional law being weird?

  No reading list or footnotes, I've read the opinions — just argue it out. And please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Constitutional interpretation methods (Textualism vs. Purposivism) using *DC v. Heller* (2008) as a test case.
      *   **Specific Problem:** The "Written-Purpose Problem" (the Second Amendment's prefatory clause). How do textualists handle an explicit purpose clause within the text itself?
      *   **Tasks:**
          1.  Map the case on both theories (authoritative reader, evidence, role of prefatory clause).
          2.  Analyze what the opinions *actually* did (Stevens vs. Breyer vs. Scalia), specifically addressing the user's read on Stevens/Breyer.
          3.  Identify where the methods break (Scalia's "longstanding regulations" list, method vs. outcome).
          4.  Generalize the "Written-Purpose Problem" to federal statutes (findings/purpose sections).
      *   **Constraints:** No reading list/footnotes. American English. Argue it out (push back on the user's read if wrong). Focus on methodology, not gun policy.

  2.  **Deconstruct Task 1: Mapping the Theories:**
      *   *Textualism (Scalia):* Focus on original public meaning. Who is the reader? An ordinary citizen in 1791 (ratification). Evidence: Dictionaries, contemporary usage, parallel state provisions. Role of Prefatory Clause: It announces a purpose but doesn't limit the operative clause *unless* there's ambiguity. It explains *why*, not *what*.
      *   *Purposivism (Stevens/Breyer):* Focus on the underlying goal. Who is the reader? A judge understanding the historical problem to be solved. Evidence: Historical context, militia necessity, legislative history (less relevant for Const., more for statutes), precedent. Role of Prefatory Clause: It defines the scope. The right exists *to serve* the militia purpose.
      *   *The "Written-Purpose Problem":* For a textualist, every word must have effect. But if the purpose clause limits the operative clause, isn't that purposivism? Scalia's solution: Grammatical analysis. The prefatory clause is a "preface," not a limitation. It resolves ambiguity but doesn't create it.

  3.  **Deconstruct Task 2: What the Opinions Did (Pushing Back):**
      *   *User's Read:* Stevens = purpose as restraint; Breyer = proportionality/interest balancing.
      *   *My Analysis:* The user is mostly right, but needs nuance.
          *   Stevens is an *originalist purposivist*. He argues the purpose (militia) defines the right. It's not just "purpose" in the abstract; it's the *historical* purpose.
          *   Breyer is distinct. He explicitly advocates for interest balancing. This is arguably *not* traditional purposivism (which seeks the *single* purpose) but rather a pragmatic consequentialist approach. It's a third category: "Pragmatism" or "Living Constitutionalism" disguised as purpose-testing.
          *   Scalia: Claims textualism/originalism. But does he ignore the purpose? No, he redefines it as a "announcement of purpose" that doesn't limit the scope.
      *   *Pushback:* Don't let the user off the hook on Breyer. That's not standard purposivism; it's means-end scrutiny. That's a crucial distinction for a reading group.

  4.  **Deconstruct Task 3: Where It Breaks (The "Longstanding Regulations"):**
      *   *Scalia's List:* "Presumptively lawful regulatory measures."
      *   *The Problem:* Where does this come from? Not the text. Not history specifically (he admits it's not exhaustive). It looks like common law adjudication or policy.
      *   *Is it Cheating?* Yes, sort of. It's a safety valve. Textualism struggles with "exceptions" not written in the text.
      *   *Method vs. Outcome:* Did method predict outcome? Hard to say. Scalia was known as a textualist before *Heller*. But *Heller* was the first time the Court really applied originalism to the 2nd Amendment individually. It feels like the method was sharpened to reach the result, but Scalia had been hinting at this view for decades. It's likely a mix: ideological priors selected the method, but the method constrained the *extent* of the right (hence the list).

  5.  **Deconstruct Task 4: Generalizing to Statutes:**
      *   *Statutory Purpose Clauses:* "It is the purpose of this Act to..."
      *   *Textualist View:* Scalia (in statutory cases like *FDA v. Brown & Williamson*) often said purpose clauses can't override operative text. They resolve ambiguity but don't create it.
      *   *Is it Defensible?* Yes, consistent with *Heller*. If the operative text is clear, the purpose clause is inert. If ambiguous, the purpose clause guides.
      *   *Constitution vs. Statute:* The Constitution is harder because it's shorter and older. Statutes have detailed legislative history. But the principle holds: Text controls, purpose illuminates.
      *   *The "Weirdness":* Constitutional law is weird because the "legislature" is "We the People" over centuries. Statutory purposivism is easier because there's a specific Congress with specific intent.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Collegial, analytical, direct. American English.
      *   *Structure:* Follow the user's four points.
      *   *Key Argument:* The "Written-Purpose Problem" isn't a bug for textualists; it's a feature of grammar. But Scalia's handling of exceptions reveals the limits of pure textualism. Breyer isn't a purposivist; he's a balancer.
      *   *Refining the "Pushback":* I need to be firm on Breyer. Calling him a purposivist conflates two different non-textualist approaches. Stevens is the true purposivist (historical purpose). Breyer is a pragmatist (current utility).
      *   *Refining the "Cheating" point:* Acknowledge that Scalia's list is a common-law move. Textualism hates common law discretion. This is the crack in the armor.

  7.  **Final Review against Constraints:**
      *   No footnotes? Check.
      *   American English? Check.
      *   Address all 4 points? Check.
      *   Push back on user's read? Check (specifically on Breyer).

  8.  **Final Polish:** Ensure the distinction between "Original Public Meaning" (Scalia) and "Original Intent/Purpose" (Stevens) is clear. Ensure the statutory comparison is sharp. (Self-Correction: Make sure not to get bogged down in gun details, keep it on *method*.)

  *(Self-Correction during drafting)*: I need to make sure I answer the "Written-Purpose Problem" directly. Does a textualist have to treat it as decoration? Scalia says no, it's not decoration, it's *grammatical context*. That's the key distinction. It's not inert, but it's not limiting either. It's an interpretive aid for ambiguity.

