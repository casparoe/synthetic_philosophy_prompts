answer: |-
  This is a sharp setup. You've identified the exact friction point where *Heller* becomes a methodological Rorschach test rather than just a gun case. The "Written-Purpose Problem" is the hinge. If textualism means "text controls," but the text includes a purpose clause, does the purpose control the text?

  Here is the breakdown you need for your session, pushing back where your read gets fuzzy.

  ### 1. Mapping the Theories

  To map this properly, you have to distinguish between *Original Public Meaning Textualism* (Scalia) and *Original Intent Purposivism* (Stevens). They both look backward, but they ask different questions.

  **Textualism (Scalia)**
  *   **Authoritative Reader:** The ordinary, reasonable citizen at the time of ratification (1791). Not the drafters, not the ratifiers, but the public consuming the text.
  *   **Evidence:** Dictionaries (Johnson, Sheridan), contemporary state constitutional analogues, and grammatical canons. History matters only insofar as it illuminates how words were used, not what the drafters secretly wanted.
  *   **Role of the Prefatory Clause:** This is the crux. Scalia treats the Second Amendment like a complex sentence. The prefatory clause ("A well regulated Militia...") announces a purpose, but the operative clause ("the right of the people...") codifies the right. Under standard grammar, a purpose clause does not limit the scope of an operative clause unless the operative clause is ambiguous.
  *   **Prediction:** The prefatory clause explains *why* the right exists, but does not define *who* has it or *what* it covers. It resolves ambiguity; it does not create it.

  **Purposivism (Stevens)**
  *   **Authoritative Reader:** The framer/ratifier. What problem were they trying to solve?
  *   **Evidence:** Drafting history, debates in the First Congress, the specific fear of standing armies, and the structural role of the militia in the 1791 republic.
  *   **Role of the Prefatory Clause:** The purpose *defines* the right. If the purpose is to preserve the militia, the right must be tethered to militia service. The text is a vehicle for the objective.
  *   **Prediction:** The prefatory clause limits the operative clause. The right to keep and bear arms is a right to do so *in the context of* maintaining a well-regulated militia.

  **The "Written-Purpose" Solution:**
  You worry that for a textualist to use the purpose clause is to "do the thing textualism was supposed to reject." Scalia's counter is grammatical. He argues that ignoring the prefatory clause would violate the canon against superfluity (every word must have effect). So, he gives it effect: it informs the definition of "bear arms" (e.g., military vs. hunting connotations). But he refuses to let it *limit* the operative clause. For the textualist, the purpose clause is a lens, not a cage. For the purposivist, it is the cage.

  ### 2. What the Opinions Actually Did (And Pushing Back on You)

  Your read on Stevens is solid. Your read on Breyer needs correction. You are conflating **Purposivism** with **Pragmatism**.

  **Stevens is the Purposivist.**
  He treats the Amendment as having a single, historically fixed objective: preserving the militia. He uses history to constrain the right. If the law doesn't threaten the militia, it doesn't violate the Amendment. This is classic purposivism: the scope of the right is co-extensive with the achievement of the purpose.

  **Breyer is not a Purposivist; he is a Balancer.**
  You asked what to call Breyer's approach. It isn't standard purposivism. Purposivism seeks to identify *the* purpose and enforce it. Breyer explicitly rejects the idea that the Second Amendment has a fixed historical scope that settles the case. Instead, he proposes an interest-balancing inquiry. He asks: Does this law disproportionately burden the interest protected by the Amendment?
  *   **Why this matters:** This is a third methodology. It's not textualism (text doesn't dictate the balance). It's not purposivism (the historical purpose doesn't settle the balance). It is **Consequentialist Pragmatism**. He treats the right as a weight on a scale against public safety interests.
  *   **The Correction:** In your session, distinguish Stevens (Historical Purposivism) from Breyer (Modern Interest Balancing). Stevens says, "The purpose limits the right." Breyer says, "The right is one factor in a policy calculation." Breyer's approach is actually more radical than Stevens's because it admits the judge must weigh contemporary costs and benefits, which textualists and purposivists alike usually claim to avoid.

  **Scalia is the Textualist (with caveats).**
  He insists the text codifies a pre-existing individual right. The purpose clause is there to prevent the *misinterpretation* of the right (i.e., don't think this is only for soldiers), not to *limit* the right to soldiers.

  ### 3. Where It Breaks

  You are right to be bugged by Scalia's list of "presumptively lawful regulatory measures" (sensitive places, commercial conditions, etc.). This is the crack in the textualist armor.

  **Is it Cheating?**
  Yes, in a methodological sense. Pure textualism struggles with exceptions that aren't in the text. The text says "shall not be infringed." It does not say "shall not be infringed, except in schools or by felons."
  *   **The Leak:** Scalia justifies this list by appealing to "historical tradition." But he admits the list is not exhaustive. This creates a common-law power for judges to decide what fits the "tradition." That is not textualism; that is adjudication based on precedent and policy intuition.
  *   **Purpose Leaking In:** Why are these regulations lawful? Presumably because they don't defeat the *purpose* of the Amendment (self-defense or militia readiness). So, to carve out these exceptions, Scalia implicitly relies on a purposive analysis: "These regulations don't harm the core purpose." He won't admit it, but the "longstanding regulations" doctrine is a purposive safety valve.

  **Method vs. Outcome:**
  Did method predict the outcome? Honestly? No.
  *   **Ideological Priors:** It is hard to escape the conclusion that the conservative justices wanted an individual right and the liberals wanted a collective one.
  *   **Method as Tool:** Scalia had been an originalist for decades before *Heller*. But originalism was rarely applied to the Second Amendment because the precedent (*Miller*, 1939) was muddy. *Heller* required sharpening originalism into a weapon capable of overturning DC's code.
  *   **The Constraint:** However, method *did* constrain the scope. If this were pure policy, Scalia might have declared strict scrutiny for all gun laws. Instead, he used textualism/history to define the *core* right (self-defense in the home) and left the periphery (the "longstanding regulations") vague. The method prevented the opinion from being a total deregulation mandate, forcing it to anchor itself in historical text.

  ### 4. Does the "Written-Purpose Problem" Generalize?

  This is the strongest part of your discussion prompt. Yes, it generalizes, but textualists handle it differently in statutes than in the Constitution.

  **Statutory Purpose Clauses:**
  Federal statutes often begin with: "The purpose of this Act is to X."
  *   **Textualist View:** Scalia's rule in statutory cases (e.g., *FDA v. Brown & Williamson*) is that a purpose clause cannot override clear operative text. If the text says "A" and the purpose clause says "We want B," the text wins. The purpose clause is only used to resolve ambiguity in the text.
  *   **Defensibility:** It is consistent for a textualist to treat the Second Amendment's prefatory clause the same way. If the operative clause is clear ("right of the people"), the prefatory clause ("Militia") cannot limit it. It can only help define ambiguous terms (like "bear arms").
  *   **The Difference:** The Constitution is weirder. Statutes are passed by a specific Congress at a specific time. We can check legislative history to see if the purpose clause was a compromise or a directive. The Constitution is ratified by "the People" over time. There is no legislative history in the same sense. This makes the textualist more reliant on the text alone.

  **Is your problem just Constitutional Law being weird?**
  Partially. In statutes, purpose clauses are often "findings" that Congress *wants* the courts to use. In the Constitution, the prefatory clause is part of the enacted law itself.
  *   **The Generalization:** The real generalization is the **Hierarchy of Text**. Textualists posit a hierarchy: Operative verbs > Definitions > Purpose Clauses.
  *   **The Vulnerability:** If a textualist ignores a statutory purpose clause because the text is "clear," they risk the same charge as Scalia: making words inert. If Congress wrote a purpose clause, it was enacted. To treat it as subordinate is a methodological choice, not a textual necessity.
  *   **Conclusion:** Your "Written-Purpose Problem" is not unique to the Second Amendment. It is the fundamental tension in textualism: **Can a statement of 'why' ever limit a statement of 'what'?** The textualist says "No, unless the 'what' is unclear." The purposivist says "Yes, because the 'why' explains the 'what'." *Heller* is simply the most high-stakes example of this fight because the purpose clause is right there in the same sentence.

  **Summary for your Group:**
  *Heller* isn't a fight between Textualism and Purposivism. It's a fight between **Original Public Meaning Textualism** (Scalia), **Original Intent Purposivism** (Stevens), and **Pragmatic Balancing** (Breyer). The "Written-Purpose Problem" exposes that textualism cannot fully ignore purpose; it just relegates purpose to the role of an ambiguity-resolver. When Scalia carved out exceptions for "sensitive places," he quietly admitted that purpose matters after all.
