answer: |-
  Your "Pyrrhus pivot" reading is the superior interpretation because Montaigne deploys the anecdote not as lexical history but as an epistemological wedge to separate the conventional label of "barbarian" from the substantive moral quality of "barbarism," thereby authorizing the reader to judge cultures by reason rather than custom.

  Your friend's lexical reading is factually correct regarding Greek usage—*barbaros* originally denoted non-Greek speakers—but it misses Montaigne's normative purpose. Montaigne is not writing a philology essay; he is establishing a rule for judgment, as evidenced by the paragraph's concluding sentence: "By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report." If this were merely a lexical point, the conclusion would be about language usage; instead, it is about the reliability of perception and the danger of habitual prejudice. The "Pyrrhus pivot" you identified is precisely the mechanism Montaigne uses to break the automatic association between "foreigner" (the object of vulgar opinion) and "uncivilized" (the substantive defect). Pyrrhus accepts the noun ("what kind of barbarians") as a concession to common speech but denies the abstract quality ("nothing of barbarism in it"), creating the conceptual space Montaigne needs to argue that the label does not determine the moral reality.

  This opener sets up the cannibalism argument by priming the European reader to suspect their own classification of the Tupinambá people. When Montaigne later argues that European tortures (burning alive, mutilation) are more barbarous than eating dead enemies, he is applying the Pyrrhus standard: he asks us to ignore the "common report" that cannibals are savages and instead use the "eye of reason" to evaluate the actions themselves. Montaigne is not a radical relativist who believes barbarism is entirely response-dependent or custom-relative; rather, he is a skeptic who believes there is a mind-independent standard of reason and nature, but that European custom blinds us to who actually violates it. The Pyrrhus anecdote establishes that "barbarism" is a vice (disorder, cruelty, irrationality) that can exist anywhere, regardless of who holds the label. By showing that Romans (foreigners to Greeks) lacked barbarism, he clears the logical path to show that Brazilians (foreigners to Europeans) might also lack it, while Europeans themselves might possess it.

  On the spectrum from obviously right to total overreading, your reading sits very close to "obviously right," supported by the syntactic structure of Pyrrhus's quote and the explicit moral drawn in the final sentence. The strongest textual evidence for your view is the distinction Pyrrhus makes between the classification ("what kind of barbarians... these may be") and the evaluation ("disposition... has nothing of barbarism in it"). This syntax enacts the very detachment you described: the label is acknowledged as existing in discourse, but the property is denied in reality. The evidence against your friend's lexical reading is that Montaigne never returns to the etymology of the word, whereas he returns repeatedly to the theme of misjudgment based on habit. Your "Pyrrhus pivot" captures the essay's central skeptical maneuver: using the authority of an ancient anecdote to undermine the authority of contemporary European prejudice, allowing Montaigne to reverse the charge of barbarism without abandoning the concept of barbarism itself.
