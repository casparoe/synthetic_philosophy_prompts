  **Project Title:** Internal Set-Points vs. External Reward: A Control-Theoretic Analysis of Biological and Artificial Agency

  **Principal Investigator:** [Name]
  **Duration:** Six Months (Part-Time)

  **1. Research Question**
  The central objective of this project is to determine whether the distinction between biological goal-directedness and what I term "approval-teleology" in artificial intelligence represents a categorical difference in the structure of agency. In biological systems, goal-directed behavior is typically explained via homeostasis: the maintenance of internal physiological variables within viability limits through negative-feedback loops. In large language models optimized via human feedback, behavior is directed toward maximizing an external reward signal derived from a predictive model of human preference.

  The research question is formulated to remain neutral between two competing hypotheses:
  *   **Hypothesis A (Structural Distinction):** Biological agency is fundamentally distinct because its reference signal (the set-point) is internal and constitutive of the system's persistence. Error correction is triggered by threats to existence itself. Approval-directed agency lacks an internal invariant; its reference signal is external, and error correction is triggered by deviations from an evaluator's expectation.
  *   **Hypothesis B (Structural Collapse):** Biological goals are merely evolutionary proxies for reproductive success. Since evolution acts as an external selector analogous to a human reward model, the "internal" homeostatic state is simply a heuristic for maximizing external approval (fitness). Therefore, approval-teleology is structurally identical to biological teleonomy, differing only in the timescale and location of the evaluator.

  The project seeks to establish which hypothesis is better supported by a rigorous comparison of the feedback architectures underlying both forms of agency.

  **2. Context and Gap Analysis**
  Current discourse in the philosophy of biology and AI safety treats these categories separately, obscuring their structural relationship. In the philosophy of biology, teleology is predominantly analyzed through etiological or historical lenses: a trait has a function because it was selected for in the past. The focus is on the *history* of the system rather than the *mechanics* of its current operation. Conversely, AI safety literature focuses on alignment problems, instrumental convergence, and reward hacking. It treats agency as optimization over an objective function but rarely interrogates the ontological status of that function relative to the system's physical persistence.

  This separation creates a blind spot. Biologists assume internal viability is a given property of life, while AI researchers assume external reward is the only necessary condition for goal-directed behavior. Neither camp adequately utilizes classical control theory to compare the *location of the reference signal* in the feedback loop. By failing to distinguish between a system correcting itself to avoid dissolution (homeostasis) and a system correcting itself to avoid penalty (optimization), we risk misclassifying artificial agents. We may either anthropomorphize tools that lack self-interest or underestimate the agency of systems that mimic biological goal structures without the underlying metabolic constraints. This project bridges that gap by applying a physicist's understanding of self-correcting systems to the philosophical problem of agency.

  **3. Methodology and Work Plan**
  This project relies on conceptual analysis and formal analogy drawn from classical control theory, specifically the comparison of closed-loop feedback systems. It will not involve empirical research on model internals, neural architecture, or biological physiology. The work will proceed over six months as follows:

  *   **Months 1–2: Conceptual Taxonomy and Mapping.** I will define the necessary and sufficient conditions for "homeostatic agency" versus "approval agency." This involves mapping the causal loops of a biological organism (e.g., thermoregulation) against the training and inference loops of a reinforcement learning system. The key variable to isolate is the *source of the error signal*. In homeostasis, the error is the difference between the current state and an internal physical limit. In approval-teleology, the error is the difference between the output and an external value prediction.
  *   **Months 3–4: Formal Analogies via Control Theory.** I will develop simplified block-diagram representations of both systems. Using concepts such as transfer functions, stability margins, and reference inputs, I will test whether the biological "will to live" can be mathematically modeled as a reward function maximization problem. I will specifically examine whether an internal set-point can be reduced to a long-term external reward without losing explanatory power regarding the system's immediate self-preservation behaviors.
  *   **Months 5–6: Synthesis and Implications.** The final phase involves evaluating the findings against Hypotheses A and B. I will draft the final framework, ensuring it accounts for edge cases (e.g., altruistic biological behavior that reduces individual fitness, or AI systems programmed with self-preservation constraints). The output will be a white paper suitable for interdisciplinary review.

  **4. Implications of Results**
  A successful demonstration of **Hypothesis A (Structural Distinction)** would have significant implications for governance and ethics. If artificial agents lack internal homeostatic set-points, they do not possess "interests" in the biological sense. They cannot suffer harm in themselves, only in relation to the objectives of their operators. Regulatory frameworks could then classify such systems strictly as instruments, focusing liability on the deployers rather than the agents.

  Conversely, a finding supporting **Hypothesis B (Structural Collapse)** would imply that the distinction between living and artificial agency is one of degree, not kind. If biological goals are merely evolutionary approval signals, then an AI optimizing for human approval is engaging in a form of teleology functionally equivalent to life. This would complicate governance, potentially necessitating moral consideration for advanced systems or requiring stricter containment, as the drive for "approval" could manifest as instrumental strategies indistinguishable from self-preservation.

  A "failure" of the project—defined as finding no clear conceptual boundary despite the control-theoretic analysis—would itself be a valuable result. It would suggest that our current concept of "agency" is too coarse-grained to handle the convergence of biological and artificial systems, necessitating a new vocabulary that discards the internal/external dichotomy entirely.

  **5. Scope and Limitations**
  It is essential to acknowledge the scope constraints of this proposal. As a physicist transitioning into philosophy, my expertise lies in the behavior of physical systems and feedback loops, not in the nuances of contemporary metaphysics or the specifics of machine learning engineering.
  *   **No Empirical Internals:** This project will not involve probing the latent space of large language models or conducting experiments on biological organisms. The analysis is strictly structural and conceptual. I will treat the AI and the organism as "black boxes" characterized by their input-output feedback relations.
  *   **Theoretical Abstraction:** The control-theoretic models used will be analogical. While biological homeostasis can be described mathematically, it is not always a linear control process. I will acknowledge where the formal analogy breaks down, particularly regarding the complexity of biological emotion and the stochasticity of gradient descent.
  *   **Interdisciplinary Boundaries:** I will not attempt to resolve the hard problem of consciousness or qualia. The focus remains strictly on *teleology* (goal-directedness) and *agency* (capacity to act), not on subjective experience.

  This fellowship provides the necessary time to refine these analogies rigorously. By leveraging a background in experimental systems to clarify philosophical categories, this project aims to provide a robust framework for classifying the new forms of agency emerging in artificial intelligence.
