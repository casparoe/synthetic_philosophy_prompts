      *   *Ex Ante:* Before opening, $E[A] = E[B]$. No advantage to switching blindly.
      *   *Ex Post:* After seeing $X$, the decision depends on $X$.
      *   *Resolution:* The gains from switching when $X$ is small exactly cancel the losses from switching when $X$ is large (weighted by the probability of seeing those $X$'s).
