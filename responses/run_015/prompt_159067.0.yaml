  1. You argue early failure is segmentation, not format; beyond the failure itself, what independent evidence should we expect regarding figure-ground tasks or border-ownership in the first hours of sight? (Figure-ground is distinguishing an object from its background; border-ownership is knowing which side of a line belongs to an object.)
     Follow-up: If patients show intact border-ownership but still fail Molyneux's task, does that falsify your segmentation hypothesis?

  2. Should we expect patients to succeed immediately if tested with isolated high-contrast objects versus cluttered scenes, and what should we expect if the explanation is wrong? (High-contrast objects are easy to see against their background.)
     Follow-up: If they fail even with isolated objects, do you concede the deficit is representational rather than perceptual?

  3. Is post-surgical success the acquisition of a mapping between two modality-specific formats, or the unmasking of one format that was always shared? (Modality-specific formats means touch and vision speak different spatial languages.)
     Follow-up: Can you name a specific behavioral marker that distinguishes unmasking from mapping?

  4. Given that marker, say honestly which side of the fork the current data favor. (The fork is the choice between mapping and unmasking.)
     Follow-up: If the data favor mapping, why insist the format was shared all along?

  5. The original question served a claim about whether the idea of a figure is the same idea when it arrives through different senses; does your two-stage answer settle that question or quietly replace it with a question about timing? (The idea of a figure is the mental concept of a shape.)
     Follow-up: If you replace it, have you solved Molyneux's problem or dissolved it?

  6. Anticipate your reply that the old question just is the empirical question properly posed; what must that reply survive to remain philosophical rather than merely psychological? (Psychological refers to mental processes rather than conceptual truth.)
     Follow-up: Does timing really resolve the metaphysical issue of identity?

  7. Consider a congenitally blind adult who has used a visual-to-auditory sensory substitution device for years and then has sight restored; what is your prediction for their Stage 1 performance? (Sensory substitution devices turn camera images into sounds.)
     Follow-up: If they succeed immediately, does that prove the format was amodal or just trained?

  8. Now consider a device whose encoding of shape is deliberately non-spatial, closer to a chord than a picture; what remains of the amodal claim if long-term users of that device succeed anyway? (Non-spatial encoding uses arbitrary sounds rather than spatial maps.)
     Follow-up: If arbitrary mapping yields immediate success, isn't the amodal format superfluous?

  9. Regarding task type, does forced-choice cross-modal matching carry the philosophical weight, or does open recognition by sight alone, and what would you say if patients pass matching for months while failing open naming? (Forced-choice means picking from options; open recognition means identifying without cues.)
     Follow-up: If you call naming failure a task artifact, what performance would count as a genuine failure of content?

  10. Moving to which objects, do you predict success transfers to irregular shapes identified by affordance rather than geometry, and why would that profile rather than its reverse support your view? (Affordance refers to what actions an object allows, like gripping.)
      Follow-up: If you dismiss affordance failures as task difficulty, are you protecting the amodal claim from any empirical risk?

  11. The amodal-format claim looks insulated since every success is evidence and every failure is noise; specify in advance which pattern of results would disconfirm it. (Insulated means protected from criticism.)
      Follow-up: If you reply that success after a short delay is itself the signature, haven't you made the claim unfalsifiable?

  **Closing Question:** What is the single finding that would make you give up the amodal claim?

