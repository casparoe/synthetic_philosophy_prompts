prompt: |-
  I live in a limited-equity housing cooperative and was recently elected to the small committee rewriting our occupancy agreement: about a dozen enforceable clauses, one winter of meetings, and a volunteer lawyer. The drafting has turned on which conception of freedom the document should be built around — a non-interference clause (the co-op and fellow members stay out of your unit), a capability clause (the co-op secures your effective ability to live well there: repairs, accessibility adaptations, and now broadband), or a non-domination clause (no member stands to the arbitrary will of another, board and manager included, backed by some machinery for contesting decisions).

  I need a defended ranking, not a survey. Which of these three actually changes what we would write, and which of the distinctions philosophers treat as load-bearing would collapse into drafting noise or into another clause? Concretely: does the non-domination clause buy anything over a non-interference clause plus appeal rights, once "arbitrary" has to be cashed out as something like "not required to track the interests of affected members as they could openly avow them"? And does the capability clause reach anything the other two cannot, or does it mainly license paternalism under a friendlier name?

  Rank two further questions alongside these rather than treating them as separate. First: the board is piloting an automated system that triages maintenance requests and flags arrears for review, and I cannot tell whether domination does real work there or is just a vivid restatement of ordinary accountability problems. Second: what I have started calling agenda power — the unchecked capacity to settle which grievances are intelligible as grievances at all, so that a complaint nobody has a name for never reaches a vote. Is that a distinct wrong deserving its own clause, or a redescription of something the three frameworks already cover?

  Tell me which of these deserve our scarce clauses and meeting time, and why: what criteria you are using (how much downstream drafting each choice settles, how contestable it is by members who are not philosophers, how much of it is merely symbolic), how you would trade those criteria off, and what would move an item up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A member of a limited-equity housing cooperative (LEHC), elected to a committee rewriting the occupancy agreement.
      *   **Task:** Rewriting about a dozen enforceable clauses.
      *   **Constraints:** One winter of meetings, volunteer lawyer (scarce resources).
      *   **Core Question:** Which conception of freedom (Non-Interference, Capability, Non-Domination) should underpin the agreement?
      *   **Specific Sub-Questions:**
          1.  Does Non-Domination add value over Non-Interference + Appeal Rights?
          2.  Does Capability add value or just license paternalism?
          3.  Does Domination do real work regarding the automated maintenance/arrears system?
          4.  Is "Agenda Power" a distinct wrong needing its own clause?
      *   **Requirement:** A *defended ranking*, not a survey. Needs criteria for ranking (downstream drafting impact, contestability, symbolism vs. substance). Needs to address the "collapse" of distinctions into drafting noise.

  2.  **Deconstruct the Three Conceptions of Freedom:**
      *   **Non-Interference (Negative Liberty):** "Leave me alone." Focus: Privacy, entry restrictions, noise, quiet enjoyment.
      *   **Capability (Positive Liberty/Functioning):** "Enable me to flourish." Focus: Repairs, broadband, accessibility, support services.
      *   **Non-Domination (Republican Liberty):** "No arbitrary power over me." Focus: Due process, contestability, rule of law within the co-op, checks on board/manager power.

  3.  **Evaluate the Specific Sub-Questions:**

      *   *Non-Domination vs. Non-Interference + Appeals:*
          *   Philosophical distinction: Non-interference protects a sphere. Non-domination protects a *status*. You can be non-interfered with but still dominated (the benevolent master).
          *   Drafting reality: "Arbitrary" is hard to define. If defined as "not tracking interests," it becomes a procedural standard.
          *   Verdict: Non-domination is crucial for *governance* clauses, but might collapse into robust appeal rights + transparency rules. However, the *spirit* of non-domination changes the burden of proof.
      *   *Capability vs. Paternalism:*
          *   Risk: Board decides what "living well" means (e.g., forcing broadband).
          *   Benefit: Ensures baseline habitability beyond mere non-interference.
          *   Verdict: High risk of paternalism in a volunteer-run co-op. Better handled as specific obligations (repairs) rather than a broad "capability clause."
      *   *Automated System (Domination work?):*
          *   Algorithmic decision-making is the epitome of arbitrary power if uncontestable.
          *   Verdict: Non-domination does real work here. It demands explainability and human review, not just "accuracy."
      *   *Agenda Power:*
          *   This is meta-power. If you can't name the grievance, you can't appeal.
          *   Verdict: This is the hardest to draft. It's often covered by "general welfare" or "amendment" clauses, but specific language on "standing" and "definition of grievances" might be needed.

  4.  **Develop Ranking Criteria:**
      *   **Drafting Leverage:** How much specific text does this principle generate? (High leverage = good for limited clauses).
      *   **Enforceability/Contestability:** Can a member actually use this in a dispute without a PhD in philosophy?
      *   **Risk of Abuse:** Does this give the Board more power to interpret?
      *   **Distinctiveness:** Does it cover ground the others miss?

  5.  **Formulate the Ranking:**

      *   *Top Priority:* **Non-Domination (proceduralized).** Why? It governs the relationship between member and board. It addresses the automated system and appeal rights. It's the "constitution" of the co-op.
      *   *Middle Priority:* **Non-Interference (specificized).** Why? Essential for quiet enjoyment, but standard. Needs to be clear but doesn't need a grand philosophical preamble.
      *   *Low Priority:* **Capability (as a general clause).** Why? Too vague, risks paternalism. Better to list specific duties (heat, water, broadband) than a philosophical commitment to "flourishing."
      *   *Agenda Power:* Treat as a subset of Non-Domination (procedural justice).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the scarcity of resources. State the thesis: Non-Domination is the engine, Non-Interference is the boundary, Capability is the trap.
      *   *Criterion Setting:* Explicitly state the criteria used for ranking (Downstream Drafting, Contestability, Risk of Paternalism).
      *   *The Ranking:*
          1.  **Non-Domination (The Structural Priority).** Address the "arbitrary" definition. It *does* buy something over simple appeals: it shifts the burden to the power-holder to justify interference based on *shared* interests, not just efficiency. Address the Automated System here (algorithmic domination).
          2.  **Non-Interference (The Boundary Priority).** Keep it concrete. Entry, noise, privacy. Don't over-philosophize.
          3.  **Capability (The Specific Duty Priority).** Reject the broad clause. Convert into specific maintenance obligations. Address the paternalism risk.
          4.  **Agenda Power (The Meta-Priority).** Fold into Non-Domination. It's about *access* to the contestation machinery.
      *   *Addressing the "Collapse" Question:* Be honest. Philosophical distinctions often collapse in legal text. "Arbitrary" becomes "Procedurally Improper." "Capability" becomes "Maintenance Standard." The value is in the *interpretive lens*, not necessarily the header text.
      *   *Recommendation on Clauses:* Suggest where to spend the 12 clauses.
      *   *Moving Items Up/Down:* What would change the ranking? (e.g., if the Board is historically abusive, Non-Domination goes higher. If the building is crumbling, Capability duties go higher).

  7.  **Refining the Argument on Non-Domination vs. Appeals:**
      *   User asks: Does non-domination buy anything over non-interference + appeal rights?
      *   Answer: Yes, because appeals usually review *outcomes* or *procedure*. Non-domination reviews the *source of power*. It asks: "Did the board have the right to decide this at all without your input?" It prevents the need for an appeal by requiring co-determination upfront.
      *   *Correction:* In a 12-clause document, you can't mandate co-determination on everything. So, it manifests as "Right to Reasons" and "Human in the Loop" for the automated system.

  8.  **Refining the Argument on Agenda Power:**
      *   Is it distinct? It's "Hermeneutical Injustice" (Fricker).
      *   Drafting solution: A "Grievance Definition" clause that allows members to define harms not explicitly listed, or a "Standing" clause that lowers the barrier to bring issues to the AGM.
      *   Decision: Don't give it a standalone clause (too abstract). Embed it in the Dispute Resolution clause.

  9.  **Final Review against Constraints:**
      *   Did I rank? Yes.
      *   Did I use criteria? Yes.
      *   Did I address the automated system? Yes.
      *   Did I address agenda power? Yes.
      *   Is it practical for a volunteer lawyer? Yes, focusing on enforceable text.

  10. **Tone:** Professional, philosophical but grounded, respectful of the volunteer context. (Self-Correction: Avoid overly academic jargon where plain English works better for the committee).

  11. **Final Polish:** Ensure the distinction between "Capability as a clause" vs "Capability as specific duties" is clear. The user asked if the *clause* is useful. The answer is likely "No, the specific duties are."

  *(Self-Correction during drafting)*: I need to be careful not to dismiss Capability entirely. In a *limited-equity* co-op, maintaining the asset is key. But "living well" is subjective. I will argue for "Habitability Standards" instead of "Capability Clause."

  *(Self-Correction on Non-Domination)*: The user asks if "arbitrary" cashed out as "tracking interests" collapses into appeal rights. I need to argue that "tracking interests" requires *consultation mechanisms*, not just *appeal mechanisms*. Appeals are ex-post; domination prevention is ex-ante.

  Let's structure the response.
  1. Criteria for Ranking.
  2. The Ranking (1. Non-Domination, 2. Non-Interference, 3. Capability).
  3. Deep Dive on the Specific Questions (Automated System, Agenda Power).
  4. Drafting Recommendations (The 12 Clauses).
  5. Conditions for Re-ranking.

  Proceed to generate response.s
answer: |-
  This is a high-stakes drafting exercise because occupancy agreements in limited-equity cooperatives (LEHCs) function as quasi-constitutional documents. You have scarce resources (one winter, volunteer counsel, ~12 clauses), so you cannot afford philosophical redundancy. You need principles that generate enforceable text, not preamble fluff.

  Here is a defended ranking of your three conceptions of freedom, followed by an integration of your two additional questions (Automated Systems and Agenda Power) into that hierarchy.

  ### The Criteria for Ranking

  To rank these for *drafting purposes* rather than philosophical purity, I am using three criteria:

  1.  **Downstream Drafting Leverage:** How many specific, enforceable obligations does this principle generate? (High leverage = good).
  2.  **Contestability:** Can a lay member invoke this clause in a dispute without needing a philosopher to interpret it? (High clarity = good).
  3.  **Risk of Paternalism/Abuse:** Does this principle give the Board more discretion to interpret "the good" for the member? (Low risk = good).

  ### The Ranking

  #### 1. Non-Domination (The Structural Priority)
  **Rank:** First.
  **Why:** This is the only conception that governs the *relationship* between the member and the Board/Manager. Non-interference protects your sphere; Capability protects your functioning; Non-Domination protects your *status* as a co-equal.

  *   **Does it collapse into Appeal Rights?** No. This is the critical philosophical distinction that survives drafting. An appeal right is *ex-post* (you act, I suffer, I appeal). Non-domination requires *ex-ante* constraints on power (you cannot act without tracking my interests).
      *   *Drafting Consequence:* If you rely only on Non-Interference + Appeals, the Board can install the automated maintenance system, let it harm you, and offer an appeal. Under Non-Domination, the Board must prove the system was designed to track member interests *before* implementation.
      *   *Cash-out:* You do not need the word "arbitrary." You draft **Procedural Constraints**: "Right to Reasons," "Human-in-the-Loop for Adverse Decisions," and "Consultation on Policy Changes."
      *   *Verdict:* This buys the most. It transforms the agreement from a lease (landlord/tenant) into a constitution (citizen/state).

  #### 2. Non-Interference (The Boundary Priority)
  **Rank:** Second.
  **Why:** This is the baseline for habitability and privacy. It is highly contestable and low risk.

  *   **Drafting Consequence:** This generates clear, binary clauses: Entry notice periods, noise standards, lock changes, privacy of data.
  *   **Risk:** Low. It restricts the Board, it doesn't empower them.
  *   **Verdict:** Essential, but standard. It does not need a philosophical preamble; it needs clear metrics (e.g., "48 hours notice" vs. "reasonable notice"). It ranks second not because it is less important to daily life, but because it is legally standard and requires less innovative drafting energy than Non-Domination.

  #### 3. Capability (The Specific Duty Priority)
  **Rank:** Third (as a general clause).
  **Why:** As a broad philosophical clause ("The Co-op shall secure members' capability to live well"), this is dangerous.

  *   **Paternalism Risk:** High. Who defines "living well"? The Board. This licenses the Board to mandate broadband, force energy audits, or restrict "unhealthy" behaviors under the guise of enhancing capability.
  *   **Drafting Consequence:** Vague. "Living well" is not enforceable. "Working Heat" is.
  *   **Verdict:** Reject the *clause*, adopt the *duties*. Do not write a Capability Clause. Instead, write specific Maintenance and Infrastructure Clauses (heat, water, structural, broadband access). This captures the benefit (effective ability to live) without the risk (Board defining the good).

  ---

  ### Integrating the Two Additional Questions

  You asked to rank these alongside the three conceptions. They are not separate; they are stress tests for the top-ranked conception (Non-Domination).

  #### 4. The Automated System (The Domination Stress Test)
  **Integration:** This belongs under **Non-Domination**.
  **Analysis:** You asked if domination does real work here or is just a vivid restatement of accountability. It does real work.
  *   **Accountability** asks: "Did the system follow the rules?"
  *   **Non-Domination** asks: "Does the system place me at the mercy of an logic I cannot contest?"
  *   **Drafting Move:** If you treat this as ordinary accountability, you write: "The Board shall maintain the system." If you treat this as Non-Domination, you write: "No member shall be subject to an adverse financial or occupancy decision based solely on algorithmic triage. A human review must be available upon request."
  *   **Why it matters:** In a volunteer-run co-op, the "system" often becomes the excuse for rigidity ("The computer says no"). Non-domination forbids the computer from having the final say. This is a high-leverage use of one clause.

  #### 5. Agenda Power (The Meta-Power Problem)
  **Integration:** This belongs under **Non-Domination (Procedural)**.
  **Analysis:** You call this "the unchecked capacity to settle which grievances are intelligible." In political philosophy, this is *hermeneutical injustice*. In drafting, this is a **Standing and Definition** problem.
  *   **Does it need its own clause?** No. A standalone "Agenda Power" clause is too abstract and will be ignored by courts or arbitrators.
  *   **How to capture it:** Embed it in the **Dispute Resolution / Grievance Clause**.
      *   *Standard Drafting:* "Members may appeal violations of this Agreement." (This limits grievances to what is already named).
      *   *Non-Domination Drafting:* "Members may bring forward grievances regarding any Board action or omission that materially affects their occupancy, including matters not explicitly enumerated herein."
  *   **Verdict:** This is the "safety valve." Without it, Non-Domination is toothless because the Board can simply rule your grievance "out of order." It is a distinct wrong, but it is best solved by widening the *scope of appeal*, not by creating a new metaphysical right.

  ---

  ### Recommended Allocation of the 12 Clauses

  Given the ranking above, here is how you should spend your scarce clauses to maximize freedom and minimize drafting noise:

  1.  **Quiet Enjoyment & Entry (Non-Interference):** Strict notice periods, limits on board entry.
  2.  **Maintenance Standards (Capability as Duty):** Specific lists of what must be maintained (heat, water, structure, broadband infrastructure).
  3.  **Decision-Making Transparency (Non-Domination):** Board minutes must be accessible; reasons must be given for denials of requests.
  4.  **Algorithmic Due Process (Non-Domination/Automation):** No sole-source algorithmic decisions on arrears or maintenance priority; right to human review.
  5.  **Grievance Standing (Agenda Power):** Broad definition of what counts as a grievance; low barrier to bring issues to the AGM.
  6.  **Appeals Process (Non-Domination):** Clear timeline, independent reviewer (not the Board).
  7.  **Privacy/Data (Non-Interference):** Limits on what member data the co-op collects and shares.
  8.  **Alterations/Adaptations (Capability/Interference):** Right to make accessibility modifications at member cost, subject to safety review.
  9.  **Subletting/Succession (Non-Interference):** Clear rules on who can live there, minimizing board discretion.
  10. **Arrears & Hardship (Non-Domination):** Mandatory payment plan offer before eviction proceedings; recognition of temporary hardship.
  11. **Rule Changes (Non-Domination):** House rules cannot override Occupancy Agreement; members must be consulted on rule changes.
  12. **Severability & Interpretation (Meta):** Agreement should be interpreted to preserve member security of tenure.

  ### What Would Move an Item Up or Down?

  *   **Move Capability Up:** If your building is currently in severe disrepair (mold, no heat), the "Maintenance Standards" clause becomes the most critical document in the room. In that case, specific capability duties trump structural non-domination because you cannot enjoy freedom if you are sick.
  *   **Move Non-Domination Down:** If your co-op is very small (e.g., under 10 units) and operates by consensus. In a consensus model, domination is structurally harder, and you may need more clauses dedicated to Non-Interference (privacy) because social pressure is the real threat.
  *   **Move Agenda Power Up:** If the Board has a history of "killing" complaints by labeling them "personality conflicts." If this is a known pathology, you need a stronger "Standing" clause, perhaps requiring the Board to formally vote on *why* a grievance is inadmissible.

  ### Summary Advice

  Do not write a "Bill of Rights" preamble based on these three concepts. Your lawyer will tell you it has no enforceable weight, and your members will treat it as decoration.

  Instead, use **Non-Domination** as the *logic* for your procedural clauses (Appeals, Automation, Rule Changes). Use **Non-Interference** as the *logic* for your privacy clauses. Use **Capability** only as a *list of specific duties* (Repairs), never as a general standard.

  The distinction between Non-Interference and Non-Domination is the only one that justifies its own drafting time. The difference between "The Board cannot enter" (Interference) and "The Board cannot enter without a reason trackable to member interests" (Domination) is the difference between a lock and a constitution. Spend your winter on the latter.
