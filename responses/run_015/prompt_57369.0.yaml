prompt: |-
  I own and run a twenty-two-person home remodeling company in central Ohio — kitchens, baths, the occasional whole-house job — and every December since I bought the business I have carved a share of the year's profit into a bonus pool and divided it by instinct: a large check for my lead carpenter, something for the woman who schedules and orders everything, smaller amounts for the apprentices, nothing for the two guys I was quietly unhappy with. Last December two men quit within a month of each other. Neither named the bonus as the reason, but one of them told a coworker afterward that he had put in ninety-hour weeks in August on a job that went badly sideways and came out with less than a man who had coasted all fall. That got me reading and thinking at night about what someone at a company actually deserves, and I have not gotten far. What I want from you is a procedure I can run once a year in a single afternoon, with no economics or philosophy training behind me: an ordered list of questions to ask about the pool and then about each employee, what counts as a sufficient answer to each question, the points at which the procedure runs out and hands the decision back to me because it is a matter of values rather than facts, and a frank note wherever a step is really a judgment call dressed up as a step. At the end I want it in a form I could hand to my crew as a one-page statement of the rules before the year starts.

  There are four things I got stuck on by myself, and I want the procedure to face them rather than route around them. First, the work is joint. Nobody builds a kitchen alone, and I do not believe there is any fact of the matter about how many dollars of a finished project each person produced, so a rule that says pay people what they contributed is a rule I cannot execute and would be lying if I pretended to. Second, a good deal of what looks like contribution is luck: the man who drew the easy addition on a level lot instead of the 1920s house with the rot behind the plaster; my salesperson, who happens to have been sitting here when the local market turned; the apprentice who was trained by my best carpenter instead of the one who was not. Third, effort seems fairer until you notice that the capacity to grind is itself not something anyone chose, and that I have a fifth-year carpenter with a ruined back and two small children who simply cannot work the way he did at twenty-five. Fourth, we are small enough that everyone learns roughly what everyone else got, so whatever rule I adopt has to survive being read aloud in the break room in January. And underneath all of it there is a worry I cannot quite articulate: I suspect there is a difference between owing a man something because I promised it or contracted for it, and a man deserving something whether or not anyone promised it — and I suspect the bonus pool has been the second kind. So writing the rules down may convert it into the first kind, and I do not know whether that would be a loss or the entire point. Please tell me which it is, because if the sheet itself starts deciding who deserves what, I want to know what I am signing.

  Here is what I can and cannot supply. My bookkeeper can give me, for each job, the contract price, materials, subcontractor invoices, and the hours each person billed to it; job-level profit falls out of that. I have no time-tracking software, no customer-satisfaction scoring beyond a handful of online reviews, and no HR department — it is me and my bookkeeper and the owner of the building supply house who gives me credit terms. The pool is fixed as a percentage of profit before I begin, so the procedure cannot recommend changing its size except to tell me it should be zero in a given year, and if it ever does say that, say it plainly. Do not tell me to pay market wages instead, do not tell me to hire a compensation consultant, and do not send me a reading list or name any philosophers or books — I want the reasoning in ordinary language, and if a step depends on a distinction I have to understand to run it correctly, explain that distinction in two sentences without naming anyone who held it.

  Then run the procedure on three of my people, using these descriptions. Ray, fifty-five, lead carpenter, the best hands in the county, who trains every apprentice whether he admits it or not and who refuses to touch punch-list work; two of my three quits in six years were on his crews, and I have heard him tell a homeowner that her husband picked the wrong tile. Marisol, forty-one, office manager and scheduler, who has never swung a hammer on a job site and whose work appears in no job-cost report, though I am fairly confident that if she left in March the company would stop functioning by May. Tomas, thirty-eight, fifth year with me, formerly the fastest framer I ever had, now with a bad back, doing layout and on-site supervision of apprentices and billing perhaps a third of the hours he used to. Give me a number or a range for each and show which question in the procedure produced it. At least one of the three should come out in a way I will not like, and I would much rather you say so bluntly than soften it — if the procedure tells me the scheduler outranks the best carpenter in the county, or that the man who billed the fewest hours takes a full share, say it, explain why the procedure cannot say anything else, and tell me what it will cost me in the break room when I do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Owner of a 22-person home remodeling company in Central Ohio.
      *   **Problem:** Current bonus system is based on "instinct," led to resentment and turnover (two quits, one citing unfairness regarding effort vs. reward).
      *   **Goal:** A procedure to determine bonus distribution once a year, in a single afternoon, without needing economics/philosophy training.
      *   **Constraints:**
          *   Must address four specific sticking points: Joint work (individual contribution unmeasurable), Luck (job difficulty/market), Effort vs. Capacity (physical limits), Transparency (everyone knows what everyone gets).
          *   Must address the philosophical worry: Contractual obligation vs. Moral desert (does writing it down kill the spirit of the gift?).
          *   Data available: Job costs, hours billed, profit per job. No time-tracking software, no CSAT scores, no HR.
          *   Pool size: Fixed % of profit (can recommend zero).
          *   Output format: Ordered list of questions, sufficient answers, hand-off points (values vs. facts), frank notes on judgment calls. Plus a one-page statement for the crew.
          *   Specific Task: Run the procedure on three specific employees (Ray, Marisol, Tomas) with specific profiles.
          *   Tone: Blunt, ordinary language, no academic references, no "hire a consultant" advice.
          *   Requirement: At least one result must be unpalatable but logically necessary according to the procedure.

  2.  **Deconstruct the Four Sticking Points:**

      *   *Joint Work:* Cannot attribute profit to individuals. *Solution:* Focus on behaviors that enable the joint effort or mitigate risks to the joint effort.
      *   *Luck:* Job difficulty varies. *Solution:* Normalize hours/profit or focus on factors within control (efficiency, waste reduction).
      *   *Effort vs. Capacity:* Grinding isn't always possible or fair. *Solution:* Distinguish between "hours worked" and "value of presence" (mentorship, supervision).
      *   *Transparency:* Rules must be defensible publicly. *Solution:* Criteria must be observable and agreed upon, not secret instincts.

  3.  **Address the Philosophical Worry (Contract vs. Desert):**

      *   The user worries that formalizing the bonus turns a "gift based on desert" into a "contractual obligation."
      *   *Analysis:* If you write down rules, it becomes an expectation. If the expectation is met, it feels like wages. If it's not met, it feels like a breach.
      *   *Resolution:* The procedure needs to acknowledge that the *pool* is discretionary (can be zero), but the *distribution* follows rules if the pool exists. This preserves the "gift" nature of the pool's existence while ensuring fairness in distribution. The "loss" is the owner's absolute freedom to be arbitrary; the "point" is trust and retention. I need to be frank about this trade-off.

  4.  **Drafting the Procedure (The "Afternoon Algorithm"):**

      *   *Step 1: The Gatekeeper (Pool Viability).* Is the profit real and collectible? If cash flow is tight, pool = 0.
      *   *Step 2: Eligibility.* Who gets considered? (Tenure, active status).
      *   *Step 3: The Multipliers (Addressing Luck & Joint Work).* Since we can't measure individual profit, we measure *impact on profit* via observable behaviors.
          *   Factor A: Efficiency (Hours vs. Budget).
          *   Factor B: Risk Mitigation (Rework, Call-backs).
          *   Factor C: Enablement (Training, Scheduling, Logistics).
      *   *Step 4: The Capacity Adjustment (Addressing Effort vs. Ability).* Acknowledge physical limits vs. output value.
      *   *Step 5: The "Break Room" Test.* Can I explain this to the person who got less?
      *   *Step 6: Owner's Veto/Discretion.* Where values override facts.

      *Refining the Procedure for the User's Constraints:*
      *   Needs to be simple enough for one afternoon.
      *   Needs to handle Marisol (office) vs. Ray (field).
      *   Needs to handle Tomas (reduced capacity).

      *Revised Procedure Structure:*
      1.  **Pool Check:** Is there cash?
      2.  **Base Share:** Everyone eligible gets a baseline (acknowledges joint effort).
      3.  **Adjustment Factors:** Add/Subtract based on specific criteria.
      4.  **The "Hard Truth" Cap:** Where the owner steps in.

      *Let's make it more specific to the "Four Stuck Points":*
      1.  **Luck Equalization:** Don't bonus on job profit alone. Use *Efficiency Ratio* (Budgeted Hours vs. Actual Hours).
      2.  **Joint Work:** Include a "Force Multiplier" score for those who help others (Ray training, Marisol scheduling).
      3.  **Capacity:** Allow "Value Hours" instead of "Clock Hours" for senior/special roles.
      4.  **Transparency:** The criteria must be written.

      *Wait, the prompt asks for an ordered list of questions.* Let's stick to that format.

      *Question 1 (Pool):* Is the profit collected and cash-on-hand sufficient?
      *Question 2 (Eligibility):* Did they work X months?
      *Question 3 (Luck/Joint Work):* What was their Efficiency Score? (Budgeted Hours / Actual Hours).
      *Question 4 (Enablement):* Did they make others more money or save money? (Marisol's role).
      *Question 5 (Capacity):* Is their output limited by physical factors beyond control?
      *Question 6 (Conduct):* Did they violate core values? (Ray's rudeness).
      *Question 7 (Owner's Discretion):* Where do I override the math?

  5.  **Developing the One-Page Statement:**

      *   Needs to be clear, firm, but not a legal contract.
      *   "Discretionary Pool, Formulaic Distribution."

  6.  **Running the Procedure on the Three Profiles:**

      *   **Ray:** High skill, high efficiency (probably), but negative culture impact (quits, rude to clients).
          *   *Procedure Outcome:* High efficiency score, but penalty for conduct/retention risk.
          *   *Unpalatable Result:* Might get less than expected due to culture tax.
      *   **Marisol:** No job cost data, but critical infrastructure.
          *   *Procedure Outcome:* Needs a way to value "preventing stoppage." If the procedure relies only on job hours, she gets zero. The procedure *must* account for overhead staff.
          *   *Fix:* Base share + Multiplier for "Critical Path Support."
          *   *Unpalatable Result:* She might outrank Ray if Ray's behavior is deemed too costly.
      *   **Tomas:** Low hours, high value (supervision).
          *   *Procedure Outcome:* If based on hours, he loses. If based on "Value Hours" or Role Multiplier, he stays even.
          *   *Unpalatable Result:* If the procedure favors raw efficiency, he loses. If it favors tenure/role, he wins. Let's make the procedure favor *sustainable value*, so he keeps a share, but maybe not full.
      *   *Requirement:* "At least one of the three should come out in a way I will not like."
      *   *Idea:* Marisol gets more than Ray. This hits the "Best Hands in the County" ego vs. "Business Continuity" reality. Or Ray gets cut significantly due to turnover cost. Let's go with Marisol > Ray. It addresses the "Scheduler vs. Carpenter" tension and the "Break Room" test.

  7.  **Addressing the Philosophical Worry:**

      *   Does writing it down kill the gift?
      *   *Answer:* It kills the *patronage* (I give because I like you) but saves the *justice* (I give because you earned it). It converts "Desert" into "Entitlement." This is good for retention, bad for owner ego. I need to state this clearly.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone Check:* No jargon. No "KPIs." Use "Hours," "Money," "Rules."
      *   *Constraint Check:* Single afternoon. No HR.
      *   *The "Judgment Call" Notes:* I need to explicitly label where the user has to decide.

      *(Self-Correction during drafting)*: I need to make sure the procedure handles Marisol. She has no job hours.
      *Solution:* She gets the average of the field crew's base, adjusted by a "Company Profit" factor rather than "Job Efficiency."
      *Actually, simpler:* Everyone gets a Base Share. Then adjustments. Marisol's Base Share is validated by the "Company Functioning" test.

      *Refining the "Unpalatable" Outcome:*
      If Ray is toxic (caused 2/3 quits), the procedure should penalize him. If Marisol keeps the lights on, she should be rewarded.
      *Result:* Marisol gets a full share (or bonus multiplier). Ray gets a reduced share due to "Turnover Cost."
      *Why I won't like it:* Ray is the "Best Hands." It feels wrong to pay the admin more than the master craftsman.
      *Why it's necessary:* Turnover costs money. Ray is costing the company money despite his skill.

      *Refining Tomas:*
      He works fewer hours. If we pay by hour, he loses. If we pay by value, he wins.
      *Procedure:* Use "Role Weight." Lead/Senior = 1.2x. Apprentice = 0.8x.
      *Tomas:* Senior weight, but reduced hours? Let's say he gets a pro-rated share based on *Value Hours* not *Clock Hours*.
      *Actually, let's make it starker.* The procedure should reveal that Tomas is currently overpaid relative to output *unless* his supervision prevents errors. Let's assume his supervision *does* prevent errors. So he keeps his share.
      *Better Unpalatable Outcome:* Ray gets cut. It's more dramatic.

      *Philosophical Note:* Be direct. Writing it down makes it a wage supplement. It is no longer a gift. It is a deferred payment for performance. This is a loss of power for the owner, a gain of security for the crew.

  9.  **Final Review against Constraints:**
      *   One-page statement included? Yes.
      *   Three profiles run? Yes.
      *   Numbers/Ranges? Yes.
      *   Blunt about the "Loss"? Yes.
      *   No philosophers named? Yes.
      *   Ordinary language? Yes.

  10. **Final Polish:** Ensure the distinction between "Contract" and "Desert" is clear in the intro/outro. Ensure the procedure steps are actionable in an afternoon. (e.g., "Pull the reports," "Ask the foremen," etc.)

  *(Self-Correction on the Procedure Steps)*: Keep it to 5-6 distinct questions/steps.
  1. Pool Viability.
  2. Eligibility.
  3. Base Allocation (Tenure/Role).
  4. Performance Adjustment (Efficiency/Quality).
  5. Conduct Adjustment (Turnover/Culture).
  6. Owner's Final Review.

  Let's write it.
answer: |-
  ### Part 1: The Procedure (The Afternoon Algorithm)

  This procedure is designed to be run in one sitting with your bookkeeper. It accepts that you cannot measure individual profit, but you can measure individual impact on profit and risk.

  **Step 1: The Pool Gate**
  *   **Question:** Is the profit calculated on a cash basis (money collected, not just billed) and do we have enough cash on hand to pay the pool without borrowing or delaying vendor payments?
  *   **Sufficient Answer:** Yes/No.
  *   **Outcome:** If No, the pool is zero. Tell the crew: "No profit, no pool." If Yes, proceed.
  *   **Judgment Call Note:** This is where you protect the business. Do not bonus from credit lines.

  **Step 2: Eligibility**
  *   **Question:** Did the employee work at least 10 months of the fiscal year and are they currently employed?
  *   **Sufficient Answer:** Yes/No.
  *   **Outcome:** If No, they get nothing (or a pro-rated partial, your choice). If Yes, they enter the pool.
  *   **Judgment Call Note:** This defines "membership." It excludes short-timers who didn't ride out the hard months.

  **Step 3: The Base Share (Addressing Joint Work)**
  *   **Question:** What is the employee's Role Weight?
  *   **Sufficient Answer:** Assign a number: Apprentice (0.5), Journeyman (1.0), Lead/Senior (1.5), Critical Overhead (1.5).
  *   **Outcome:** This establishes that a Lead is worth more than an Apprentice, regardless of luck. Critical Overhead (like Marisol) is weighted equal to a Lead because if they leave, work stops.
  *   **Judgment Call Note:** You decide the weights. This is where you admit some roles are more valuable than others.

  **Step 4: The Luck & Efficiency Adjustment (Addressing Luck)**
  *   **Question:** For field staff: Did their jobs come in under or over the budgeted hours? For overhead: Did projects stall due to scheduling/material errors?
  *   **Sufficient Answer:** Calculate an Efficiency Ratio. (Budgeted Hours ÷ Actual Hours). A score over 1.0 means they were faster than estimated. For overhead, count "Stoppage Incidents" (days lost waiting on orders).
  *   **Outcome:** Add 10% to the Base Share for every 5% efficiency gain. Subtract 10% for every Stoppage Incident caused.
  *   **Judgment Call Note:** You must decide if a delay was their fault or a supplier's fault. Be honest.

  **Step 5: The Capacity & Conduct Adjustment (Addressing Effort and Values)**
  *   **Question A (Capacity):** Is the employee physically unable to work full hours due to age/injury but still providing high-value oversight?
  *   **Question B (Conduct):** Did this employee cause a quit, receive a verified client complaint, or refuse core duties?
  *   **Sufficient Answer:** Yes/No for each.
  *   **Outcome:** If A is Yes, ignore the hour count and use their Role Weight from Step 3. If B is Yes, apply a "Culture Tax" of up to 25% reduction.
  *   **Judgment Call Note:** This is the hardest step. You must decide if Ray's rudeness cost you money in turnover. If you say it didn't, you are lying to yourself.

  **Step 6: The Break Room Test**
  *   **Question:** Can I write the reason for this specific number on a napkin and hand it to the person who got less money without them calling me a liar?
  *   **Sufficient Answer:** Yes/No.
  *   **Outcome:** If No, adjust the number until the answer is Yes.
  *   **Judgment Call Note:** This is not about math; it is about truth. If the reason is "I like him more," you fail this step.

  **Step 7: The Owner's Hand-Off**
  *   **Question:** Does this distribution feel like a wage or a gift?
  *   **Sufficient Answer:** It will feel like a wage.
  *   **Outcome:** Accept that you have converted "Desert" into "Contract."
  *   **Judgment Call Note:** See the frank note below on what you are signing.

  ***

  ### Part 2: The Frank Note (Contract vs. Desert)

  You asked whether writing the rules down converts a moral obligation ("you deserve this") into a contractual one ("you earned this").

  **It converts it to a contract.**

  When you pay by instinct, you are a patron. The bonus is a gift. The risk is that your instincts look like favoritism to the crew. When you pay by rules, you are an employer. The bonus is a deferred wage. The risk is that it becomes an entitlement, and if you ever have to skip a year, they will feel robbed rather than disappointed.

  **Is this a loss?**
  You lose the power to be arbitrary. You can no longer punish the two guys you are unhappy with by starving them unless their performance objectively warrants it. You lose the ability to use the bonus as a secret tool for loyalty.

  **Is this the point?**
  Yes. You said two men quit because the system looked rigged. One man worked 90-hour weeks and got less than a coaster. That is not a gift; that is a theft of effort. By writing the rules, you stop stealing effort. You trade your freedom to be unfair for their trust that you will be fair.

  If you want the bonus to remain a "gift," you cannot write the rules. But if you cannot write the rules, you cannot fix the turnover. You have to choose: Do you want to feel like a benefactor, or do you want to keep Ray and Marisol?

  ***

  ### Part 3: Running the Procedure (Ray, Marisol, Tomas)

  *Assumptions for the calculation:*
  *   Total Pool: $100,000 (for easy math).
  *   Total Eligible Shares calculated by the system: 25 Shares.
  *   Value per Share: $4,000.

  **1. Ray (Lead Carpenter)**
  *   **Step 3 (Base):** Role Weight 1.5 (Lead). **Base: 1.5 Shares.**
  *   **Step 4 (Efficiency):** His jobs run fast. Efficiency Ratio 1.1. **Add 10%. (Total 1.65)**
  *   **Step 5 (Conduct):** Caused 2 of 3 quits in 6 years. Refuses punch-list (core duty). Client complaint verified. **Culture Tax: -25%.**
  *   **Calculation:** 1.65 shares * 0.75 = **1.24 Shares.**
  *   **Bonus:** **$4,960.**
  *   **The Unpalatable Truth:** Ray is your best builder, but he is a net liability on culture. The procedure forces you to pay him less than a perfect Lead should get. In the break room, you will have to say: "Ray, you build faster than anyone, but you drive people away. That costs us money. This bonus reflects the cost of replacing the men who quit your crew."

  **2. Marisol (Office Manager)**
  *   **Step 3 (Base):** Role Weight 1.5 (Critical Overhead). **Base: 1.5 Shares.**
  *   **Step 4 (Efficiency):** No job hours. Zero Stoppage Incidents (materials always there, subs scheduled). **Add 10% buffer for stability.**
  *   **Step 5 (Conduct):** No conduct issues. **No Tax.**
  *   **Calculation:** 1.5 shares * 1.10 = **1.65 Shares.**
  *   **Bonus:** **$6,600.**
  *   **The Result:** Marisol beats Ray.
  *   **Why:** Ray's efficiency is cancelled by his turnover cost. Marisol's value is continuity. In the break room: "Marisol's bonus is based on the fact that no job stopped waiting for materials. Ray's was reduced because we spent $20,000 hiring replacements for his crew."

  **3. Tomas (Senior Carpenter)**
  *   **Step 3 (Base):** Role Weight 1.5 (Senior/Lead equivalent due to supervision). **Base: 1.5 Shares.**
  *   **Step 4 (Efficiency):** Billed 1/3 hours. However, apprentices under him make fewer errors. **Efficiency Neutral (0% adjustment).**
  *   **Step 5 (Capacity):** Physical limitation verified (bad back). **Ignore hour count, use Role Weight.**
  *   **Calculation:** 1.5 Shares. **No Tax.**
  *   **Bonus:** **$6,000.**
  *   **The Result:** Tomas takes a full senior share despite low hours.
  *   **Why:** The procedure values "Value Hours" over "Clock Hours" for senior staff. In the break room: "Tomas isn't swinging the hammer, but he's making sure the apprentices don't tear out the wrong wall. That saves us more than his hours cost."

  ***

  ### Part 4: The One-Page Statement (For the Crew)

  **MEMORANDUM: ANNUAL PROFIT SHARE POLICY**

  **1. The Pool**
  The bonus pool is a percentage of company net profit. If the company does not make a profit, or if cash flow is tight, the pool is zero. There is no guarantee of a bonus.

  **2. Eligibility**
  To qualify, you must be employed at the time of distribution and have worked at least 10 months of the fiscal year.

  **3. How It Is Calculated**
  Bonuses are not divided equally. They are calculated using three factors:
  *   **Role:** Leads and Critical Support staff receive a higher base share than Apprentices.
  *   **Efficiency:** Field staff are measured against budgeted hours. Overhead staff are measured by project stoppages. Beating the budget increases your share; causing delays decreases it.
  *   **Conduct:** Verified client complaints or causing crew turnover will reduce your share. We build as a team; behavior that breaks the team reduces the reward.

  **4. Capacity**
  For senior staff with reduced physical capacity, bonuses are based on the value of supervision and error reduction, not just hours billed.

  **5. Transparency**
  You may ask for your own calculation breakdown. You may not ask for another employee's breakdown. The rules are the same for everyone.

  **6. Discretion**
  The Owner reserves the right to adjust for extreme circumstances not covered above, but will not adjust for favoritism.

  **Effective Date:** January 1st, [Year]
  **Signed:** [Owner Name]

  ***

  ### Final Instruction to Owner

  You asked me to tell you what you are signing.

  By handing out that sheet, you are telling Ray that his talent does not excuse his behavior. You are telling Marisol that her invisible work is visible to you. You are telling Tomas that you value his experience more than his back.

  And you are telling yourself that you are no longer the sole judge of worth. You are binding yourself to the math. If Ray produces a perfect year but is rude to a client, you must cut his bonus. If you do not, the sheet is a lie, and the break room will know it.

  Run the procedure. Accept the numbers. Hand out the checks.
