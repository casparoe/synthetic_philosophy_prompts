answer: |-
  **Title:** Dissolving the Unilateralist's Curse: A Peer-Relative Expected Utility Framework

  **1. Research Question and Significance**

  The central research question of this project is: Can a peer-relative expected utility framework dissolve the unilateralist's curse without collapsing into generic risk-aversion or undermining the normative force of individual epistemic agency? Specifically, I seek to determine whether requiring an agent to weight outcomes according to how her risk-assessment stands within her epistemic community can prevent collective harm in situations where agents act independently based on shared beliefs about risk.

  The unilateralist's curse arises when a group of agents can each independently initiate an action that affects the collective interest. If the agents hold varying estimates of the action's value, the agent with the most optimistic estimate is the most likely to act. If these estimates are distributed around a true mean, the acting agent is statistically likely to be an outlier whose optimism is the result of error rather than insight. Consequently, actions with negative expected value for the group are frequently undertaken by well-meaning individuals. This dynamic is pervasive in high-stakes domains: a single researcher publishing dangerous pathogen data, a developer releasing unaligned AI code, or a state actor initiating a geoengineering trial.

  Solving this problem matters because standard approaches to collective harm rely on coordination mechanisms that are often unavailable or too slow to implement. If the curse can be dissolved through a modification of individual decision procedures rather than external restriction, it offers a path to safeguarding public goods without sacrificing the agility of individual agency. Furthermore, this inquiry strikes at the heart of rational choice theory. It challenges the standard model of expected utility maximization, which treats an agent's credences as sovereign inputs regardless of their statistical relationship to a peer group. If rationality requires accounting for one's status as a potential outlier, then standard decision theory is incomplete in contexts of unilateral power. This project aims to bridge the gap between social epistemology and decision theory, proposing that rational action in collective-risk environments requires an internalized deference to the epistemic community.

  **2. Critique of Standard Approaches and the Case for Peer-Relativity**

  Standard consequentialist and game-theoretic treatments leave the unilateralist's curse fundamentally open. Act-consequentialism directs an agent to maximize expected value based on their own best estimate of the outcomes. In a curse scenario, the consequentialist agent calculates the utility of the action using their private credence. Because the agent who acts is precisely the one with the highest estimate of benefit, consequentialism systematically selects for over-optimism. It fails to account for the selection effect: the fact that the decision to act is correlated with the probability that the agent's belief is an error. Consequentialism treats the belief as a fixed input rather than a variable subject to statistical scrutiny.

  Game theory offers coordination equilibria, suggesting that agents should communicate to align strategies. However, the unilateralist's curse is defined by the absence of effective coordination. In many high-risk scenarios, communication is costly, impossible, or the window for action is too narrow for negotiation. Furthermore, game-theoretic solutions often rely on binding agreements or iterative interactions to enforce norms. In one-off, high-stakes scenarios involving anonymous or distributed agents, these mechanisms collapse.

  The obvious alternatives to my proposed framework are equally insufficient. Purely institutional restrictions, such as governance frameworks or moratoria, are effective but costly. They restrict the liberty of agents who might be correctly assessing a unique opportunity for good, creating a "stifling" effect that slows beneficial innovation. Standard Bayesian aggregation, where agents pool their credences to form a consensus, requires the very communication and transparency that unilateralist scenarios often lack. It also presupposes that agents are willing to revise beliefs prior to action, whereas the curse often operates because agents trust their private information over the group average.

  A conceptual, peer-relativity approach is preferable because it internalizes the solution within the agent's decision procedure. It does not require external enforcement or prior communication. Instead, it modifies the calculation of expected utility to include a "peer-discount factor." This approach respects agency—the agent still decides—but tempers it with epistemic humility. It acknowledges that in a distribution of beliefs, the extreme tail is more likely to contain error than insight. By making expected utility relative to the peer group, we transform the decision problem from "Is this action good according to me?" to "Is this action good given that I am the one most inclined to think so?" This shifts the normative focus from the outcome alone to the reliability of the judgment leading to the outcome.

  **3. Methodology**

  The project will proceed in three distinct phases, moving from conceptual definition to formal sketching and finally to application.

  First, I will engage in a conceptual analysis of "peer-relativity" within decision theory. I need to define what constitutes an epistemic peer in this context and how the "weighting" of utility functions. I will distinguish between two interpretations: a statistical interpretation, where the agent discounts utility based on the standard deviation of their credence from the group mean, and a normative interpretation, where the agent defers to the consensus unless they possess specific defeating evidence. I will argue for a hybrid model where the discount factor is proportional to the degree of outlier status. This involves analyzing existing literature on peer disagreement and integrating it with expected utility formulas. I will explicitly define the variables: the agent's private expected utility, the community's average expected utility, and the weighting function that bridges them.

  Second, I will apply this framework to canonical curse scenarios. I will select two paradigmatic cases: the release of open-source artificial intelligence models and the publication of dual-use biological research. For each case, I will reconstruct the decision matrix under standard expected utility theory and then under the peer-relative framework. This will involve sketching hypothetical credence distributions to demonstrate how the peer-relative model alters the decision threshold. For instance, if the community average suggests a 40% chance of catastrophe, but the unilateralist assesses a 5% chance, the standard model permits action if the benefit is high enough. The peer-relative model would discount the benefit by the magnitude of the deviation from the 40% consensus, potentially flipping the decision to inaction.

  Third, I will stress-test the framework against "heroic outlier" objections. A major challenge is that progress often depends on individuals who correctly reject the consensus. If the peer-relative framework always suppresses outlier action, it becomes conservative to a fault. I will develop a criterion for "justified maverickism," identifying conditions under which an agent is permitted to bypass the peer discount (e.g., possession of private, verifiable data that the community lacks). This step ensures the framework does not simply mandate conformity.

  **4. Success and Failure Criteria**

  A successful result for this project will be the articulation of a formal criterion that distinguishes legitimate unilateral action from cursed action. This criterion must take the form of a modified decision rule, such as: *Act only if Private Expected Utility > Threshold + (Deviation from Consensus × Penalty Weight).* Success means demonstrating that this rule blocks actions that are likely harmful due to epistemic error while permitting actions where the potential benefit is so overwhelming that it outweighs the outlier risk. Crucially, the framework must avoid collapsing into generic risk-aversion. If the penalty weight is set so high that no unilateral action is ever rational, the solution is trivial and useless. I must show that the penalty is specific to the *epistemic* risk of being an outlier, not the *instrumental* risk of the action itself.

  Furthermore, success requires preserving normative force. I must explain why an agent *ought* to care about their peer standing. If the agent is convinced they are right, why should they discount their own judgment? A successful proposal will ground this obligation in the long-term reliability of decision procedures rather than immediate outcome maximization. It must show that adopting peer-relativity is itself the utility-maximizing strategy over a lifetime of decisions, even if it sacrifices utility in specific instances.

  Failure would look like one of two outcomes. First, the framework might prove indistinguishable from simple conservatism. If the math dictates that one should never act against the mean, the project fails to solve the curse; it merely accepts stagnation. Second, the project fails if the normative justification collapses. If I cannot explain why a rational agent should internalize the views of peers they believe to be mistaken, the framework lacks philosophical bite. Finally, the project would be considered too large if the formalization requires complex probability modeling that exceeds the scope of philosophical analysis, or if defending the "peer weight" requires constructing a full theory of social epistemology rather than a decision-theoretic adjustment.

  **5. Scope Assessment**

  This project is ambitious but manageable within a single semester, provided the scope is tightly constrained. The primary risk lies in the formalization phase. Developing a rigorous mathematical proof for the peer-relative utility function is beyond the scope of a term paper. Therefore, I will limit the formal work to a conceptual sketch and algebraic illustration rather than a rigorous theorem. I will treat the weighting function as a variable to be explored philosophically rather than a constant to be derived mathematically.

  I will also limit the case studies to two clear examples. Attempting to cover a wide range of collective action problems (climate, finance, security) would dilute the analysis. By focusing on dual-use research and AI release, I can keep the risk parameters consistent and comparable. Additionally, I will not attempt to solve the general problem of peer disagreement. I will restrict my use of social epistemology strictly to what is necessary to justify the discount factor in decision theory.

  Finally, I acknowledge that a single semester may not be sufficient to fully defend the normative force of the proposal against a determined individualist. Therefore, the deliverable will be a defense of the framework's *plausibility* and *coherence*, rather than a definitive proof of its *necessity*. The goal is to show that peer-relative expected utility is a viable candidate for dissolving the curse, warranting further development, rather than to claim it is the final word on unilateralism. This realistic scoping ensures that I can produce a complete, coherent argument that addresses the core research question without overextending into adjacent fields that would jeopardize the completion of the draft.
