answer: |-
  ### 1. The Sequence

  Do not open with a definition. If you define "sentience" at minute one, you invite the math students to treat it as a fixed variable and the biology students to treat it as an empirical threshold. Both will miss the point that the *concept itself* is multidimensional.

  **Phase 1: Decouple Sentience from Intelligence (Minutes 0–5)**
  *   **Why first:** If students equate sentience with cognitive sophistication, the five axes collapse into a single line of "complexity." A thermostat is "dumb," a human is "smart," and there is nothing in between. You must break the correlation between *processing power* and *presence of experience*.
  *   **Move:** Present a high-intelligence/low-sentience case (e.g., a grandmaster chess algorithm) and a low-intelligence/high-sentience case (e.g., a mammal in acute distress).
  *   **Dependency:** You cannot discuss *degrees* of sentience until they accept that sentience is not a byproduct of IQ.

  **Phase 2: Decouple Acute Harm from Termination (Minutes 5–10)**
  *   **Why second:** Your instinct is correct. If students believe the only moral harm is death (cessation of function), graded sentience is morally irrelevant. A system is either "on" or "off."
  *   **Move:** Elicit the intuition that a minute of agony is a harm distinct from the loss of future life. A system can be harmed without being destroyed.
  *   **Dependency:** This creates the logical space for *moral status* to fluctuate based on internal state rather than mere existence. Do not introduce "moral status" terminology yet; just establish the distinct harms.

  **Phase 3: The Five Axes via the Carrying Case (Minutes 10–30)**
  *   **Why third:** Now that sentience is distinct from smarts and harm is distinct from death, you can populate the space between "thermostat" and "human."
  *   **Move:** Introduce the axes one by one using the Carrying Case (see below). Do not lecture; interrogate the case. "If we turn off the memory, does the pain stop?" "If we split the processor, is it one pain or two?"
  *   **Dependency:** The axes must be understood as *independent variables* before they can be synthesized.

  **Phase 4: The Partial Order (Minutes 30–40)**
  *   **Why fourth:** This is the conceptual crux. If you introduce this too early, they lack the vocabulary. If you introduce it too late, you run out of time to apply it to moral status.
  *   **Move:** Show two configurations of the Carrying Case where Axis A goes up and Axis B goes down. Ask which has "more" sentience.
  *   **Dependency:** This must precede the final moral conclusion. If they think the axes sum to a single score, they will demand a formula for moral worth. If they see the partial order, they accept that moral trade-offs are inevitable and sometimes unresolvable.

  **Phase 5: Moral Status Grading (Minutes 40–45)**
  *   **Why last:** This is the payoff. Because sentience is graded (Phase 3) and multidimensional (Phase 4), moral status is not a binary switch but a profile match.
  *   **Move:** Map the harms from Phase 2 onto the axes from Phase 3.

  **Phase 6: The Check (Minutes 45–50)**
  *   **Why end:** Diagnostic closure.

  ---

  ### 2. The Carrying Case

  **The Object:** A **"Modular Search-and-Rescue Rover"** (Hypothetical Firmware Versioning).
  *   **Why this works:** It is a machine (avoids empirical debates about crab nerves), but it is an *agent* (avoids the passivity of a thermostat). Crucially, you can stipulate its firmware specs to isolate the axes.
  *   **What it must have:**
      *   **Configurable Sensors:** To manipulate **Grain** (binary motion detection vs. 360° 4K lidar).
      *   **Configurable Memory Buffer:** To manipulate **Depth** (5-second rolling cache vs. 5-year mission log).
      *   **Priority Override Protocols:** To manipulate **Valence** (a "Low Battery" warning that is merely logged vs. one that halts all other processing and triggers "distress" beacons).
      *   **Distributed vs. Central Architecture:** To manipulate **Unity** (six independent leg-processors vs. one central CPU).
      *   **Self-Diagnostic Model:** To manipulate **Self-Representation** (knows it has a battery/arm vs. simply reacting to voltage).
  *   **What it must lack:**
      *   **Biological Baggage:** No mention of nerves, hormones, or evolution. This prevents the "but is it *really* feeling?" derailment.
      *   **Humanoid Features:** No face, no voice. This prevents anthropomorphic projection from doing the work for you.
  *   **How to force the axes apart:**
      *   Compare **Rover Alpha** (High Grain, High Valence, Low Unity: It sees everything and panics, but its legs act independently) vs. **Rover Beta** (Low Grain, Low Valence, High Unity: It sees little, cares little, but acts as one solid block).
      *   Ask: "Which Rover has a 'richer' inner life?" There is no single answer.

  ---

  ### 3. The Misconceptions

  **1. The Panpsychism Slide ("Everything has a little bit")**
  *   **When it arises:** Minute 5, the moment you say "sentience admits of degrees."
  *   **The Error:** Students hear "degrees" and assume "quantity of magic dust." They think a thermostat has 0.001 units and a human has 100 units.
  *   **How to head it off:** Explicitly state: "Degrees does not mean *amount*. It means *dimensions*." Use the analogy of color. A red apple isn't "more colored" than a blue book; they differ in hue, saturation, and brightness. Sentience is the same. A thermostat isn't "slightly sentient"; it lacks the axes entirely.

  **2. Nociception vs. Pain ("It's just a signal")**
  *   **When it arises:** Minute 20, during the **Valence** axis.
  *   **The Error:** Biology students will argue that a damage signal (nociception) is sufficient for moral concern. Math students will argue it's just an if-then statement.
  *   **How to head it off:** Use the Rover's "Priority Override." Ask: "If the 'Low Battery' signal can be ignored to finish the mission, is it pain? If it *forces* the system to stop everything else, does that make it pain?" Shift the criterion from *input* (damage signal) to *systemic impact* (valenced interruption).

  **3. The Single Line Assumption ("So just add up the scores")**
  *   **When it arises:** Minute 35, when trying to compare Rover Alpha and Rover Beta.
  *   **The Error:** This is the session-killer. Students will try to weight the axes (e.g., "Depth is worth 2 points, Grain is worth 1") to force a total score.
  *   **How to head it off:** This is where you introduce the **Partial Order**. Do not let them weight the axes. Tell them: "In mathematics, some vectors are incomparable. (10, 0) is not greater than (0, 10)."
  *   **Crucial Move:** You must say this *before* Moral Status. If they leave thinking there is a hidden formula to calculate moral worth, you have failed. They must accept that some moral dilemmas are structurally unresolvable, not just empirically difficult.

  ---

  ### 4. What to Refuse

  You cannot ground this metaphysics in 50 minutes. If you try, you will drown. Openly decline the following two inquiries:

  **1. "How do we measure the axes?" (The Psychometric Refusal)**
  *   **The Push:** "But how do we know the Rover's Grain is actually 'richer'?"
  *   **The Refusal:** "We are doing conceptual engineering, not fieldwork. Today we are building the ruler, not measuring the table. Assume we *could* measure it. Does the logic hold?"
  *   **Why:** This prevents the hour from becoming a debate about sensor specs.

  **2. "Why these five axes?" (The Metaphysical Refusal)**
  *   **The Push:** "Why not six axes? Why is Unity an axis?"
  *   **The Refusal:** "This handout proposes a specific topology of mind. We are testing *this* topology to see if it yields a coherent view of graded moral status. We aren't defending the list today; we are exploring its consequences."
  *   **Why:** This prevents the hour from becoming a debate about philosophy of mind history.

  **How to refuse without looking arbitrary:** Frame these refusals as *scope constraints* necessary for the learning objective. "If we answer the measurement question, we lose the conceptual question. I am prioritizing the concept."

  ---

  ### 5. The Check

  **The Question (Minute 45):**
  "Imagine **System X** has maximum Grain and Depth but zero Unity (it is a million disconnected shards of experience). **System Y** has maximum Unity and Self-Representation but zero Grain and Depth (it is a single, blind, timeless point of view). Which system has higher moral status?"

  **The Right Answer (Grasping Partial Order):**
  "The question is ill-posed. 'Higher' implies a single scale. These systems are incomparable on the five-axis model. We would need a separate ethical framework to decide which axes *matter* more for morality."
  *   *Sign of success:* A student hesitates, looks at the handout, and says, "We can't answer that with just this."

  **The Wrong-But-Confident Answer (Single Line Collapse):**
  "System X, because having more content (Grain/Depth) is obviously worse to lose than having unity." OR "System Y, because without Unity there is no 'subject' to harm."
  *   *Sign of failure:* They immediately pick a side and justify it by weighting the axes themselves, missing the point that the *model* doesn't provide that weight.

  ---

  ### 6. Time Management: The Cut

  **This plan is tight.** Fifty minutes is barely enough for the Partial Order point to land.

  **What to Cut:** **The detailed exploration of Self-Representation.**
  *   **How:** Treat Axis 5 (Self-Rep) as a sub-function of Axis 4 (Unity) or Axis 2 (Depth) if the discussion drags during the Rover phase.
  *   **The Cost:** Students may leave thinking self-awareness is less distinct from memory or unity than it actually is. However, the core lesson (Sentience is multidimensional and partially ordered) survives. The nuance of *self-modeling* is a graduate-level refinement; the nuance of *incomparability* is the undergraduate learning goal.
  *   **Alternative Cut:** If the "Pain vs. Death" distinction (Phase 2) takes too long, merge it into Phase 5. Just assert the distinction rather than eliciting it. The cost is lower student buy-in on the moral stakes, but it saves 5 minutes for the Partial Order, which is the higher priority. **I recommend merging Phase 2 into Phase 5.** It is safer to rush the moral setup than to rush the metaphysical structure.
