answer: |-
  # JOINT STATEMENT ON THE REPLICATION CRISIS AND THE REGISTERED ARCHIVE PROJECT

  **Signatories:**
  *   **Dr. E. S. Mayo** (Error-Statistical Frequentist)
  *   **Prof. B. de C. Savage** (Subjective Bayesian)

  **Preamble:**
  We acknowledge the replication crisis as a failure of scientific infrastructure, not necessarily of statistical theory. To diagnose the failure, we stipulate the **Registered Archive Arrangement**: a funder registry where studies are pre-registered with fixed designs and randomly assigned to a **Publish-All Arm** or a **Significance-Filtered Arm** ($p < 0.05$). Teams must deposit either a **Subjective Prior** over effect sizes or a **Power Analysis** with a Smallest Effect of Interest (SEI) before data collection. After ten years, the selection mechanism is known by construction.

  ### 1. AGREED CLAIMS

  1.  **On Significance Tests:** A $p$-value $< 0.05$ does not license the claim that the null hypothesis is false with 95% probability, nor does it measure the size or importance of an effect. It is, at best, an index of inconsistency between data and a null model under specific assumptions.
  2.  **On Replication Rates:** A low replication rate is compatible with every individual study having been analyzed correctly according to its stated protocol. Low power, combined with selection for significance, guarantees a high proportion of false positives among published findings, even if the long-run error rate of the *method* is controlled.
  3.  **On Selection Effects:** Selection mechanisms (file drawer, outcome-switching, optional stopping, or the Significance-Filtered Arm) invalidate standard frequentist error probabilities unless explicitly accounted for in the testing procedure. They also distort Bayesian posterior probabilities if the selection mechanism is ignored in the likelihood function of the meta-model.
  4.  **On the Archive:** The Registered Archive Arrangement provides the only definitive ground truth for quantifying the distortion caused by publication bias. Comparing the effect-size distribution of the Publish-All Arm against the Significance-Filtered Arm isolates the impact of selection from the impact of methodological error.
  5.  **On Pre-Deposits:** Both the deposited Prior and the deposited Power Analysis serve as binding commitments against hindsight bias. Discrepancies between deposited plans and final reports are evidence of researcher degrees of freedom, regardless of the inferential framework used.

  ### 2. DISAGREEMENTS TABLE

  | Residual Disagreement | Error-Statistical Position (Frequentist) | Subjective-Prior Position (Bayesian) | Nature |
  | :--- | :--- | :--- | :--- |
  | **The Goal of Inference** | The goal is to control long-run error rates (Type I/II) and ensure claims pass severe tests. | The goal is to maintain coherence among beliefs and maximize expected utility given current information. | Substantive |
  | **Stopping Rules (Within-Study)** | Optional stopping invalidates the error probabilities of the test; the data cannot be interpreted without the stopping rule. | Stopping rules are irrelevant for inference about parameters given the data; only the likelihood matters. | Substantive |
  | **Stopping Rules (Across-Studies)** | Selection across studies is a compound stopping rule that wrecks the error control of the literature. | Selection across studies requires a hierarchical model; ignoring it makes the prior incoherent with the data generation. | Verbal* |
  | **Empirical Bayes on Archive** | Fitting a prior to the archive is a frequentist method to estimate nuisance parameters for error correction. | Fitting a prior to the archive is hierarchical Bayesian inference; the "frequentist" label is a disguise for coherence. | Substantive |
  | **Validity of Single Study** | A single study's inference is invalid if the selection context is unknown, as severity is unassessable. | A single study's inference is valid conditional on the model; the selection context affects decision, not inference. | Substantive |

  *\*Note: Marked "Verbal" only insofar as both agree the selection mechanism must be modeled for the *archive*, but disagree on whether the *single-study* inference is inherently tainted.*

  ### 3. CRUXES

  1.  **The Archive Gap:** If the Significance-Filtered Arm shows a large, persistent inflation of effect sizes compared to the Publish-All Arm, does this primarily indict the *method* (Frequentist) or the *prior beliefs* (Bayesian)?
  2.  **Pre-Deposit Utility:** Does the deposited Power Analysis (Frequentist) or the deposited Prior (Bayesian) better predict the discrepancy between the two arms?
  3.  **Meta-Inference Status:** Is the distribution of effects estimated from the Publish-All Arm a "true" frequency distribution to be used for error calibration, or a empirical prior to be used for updating future beliefs?
  4.  **Stopping Rule Damage:** Does the damage caused by selection across studies vindicate the Frequentist claim that stopping rules matter, or does it merely require the Bayesian to expand their model scope?

  ### 4. EVIDENCE AND PREDICTIONS

  **Case A: A Large Gap Between Arms**
  *Scenario:* The Significance-Filtered Arm yields a mean effect size $\delta_{filt} = 0.5$, while the Publish-All Arm yields $\delta_{all} = 0.1$.
  *   **Frequentist Prediction:** This confirms that significance filtering inflates Type I error rates and effect size estimates (the "winner's curse"). The Power Analysis deposits will show that most studies were underpowered to detect $\delta = 0.1$, making the filtered results unreliable.
  *   **Bayesian Prediction:** This confirms that the community's implicit priors were too optimistic. The deposited Subjective Priors will show mass concentrated away from zero; the gap reveals that the *conditional* posteriors (given publication) diverged from the *marginal* reality.

  **Case B: Prior vs. Power Utility**
  *Scenario:* We regress the observed effect sizes in the Publish-All Arm against the deposited Pre-Analysis plans.
  *   **Frequentist Prediction:** The Power Analysis (specifically the Smallest Effect of Interest) will correlate better with replicable effects because it forces a constraint on design sensitivity, whereas subjective priors are uncalibrated opinions.
  *   **Bayesian Prediction:** The deposited Subjective Priors will better predict the distribution of effects in the Publish-All Arm, because they capture genuine theoretical uncertainty, whereas Power Analyses are often arbitrary conventions (e.g., 80% power for $d=0.5$).

  **Case C: Empirical Bayes on the Archive**
  *Scenario:* A hierarchical model is fit to the Publish-All Arm to generate a "reference prior" for future studies.
  *   **Frequentist Prediction:** This is frequentism in disguise. The resulting intervals will be judged by their coverage probability over the archive, not by coherence. If they fail coverage, the method is rejected.
  *   **Bayesian Prediction:** This is Bayesian inference. The archive provides data to update the hyperparameters of the community prior. If the resulting posteriors are incoherent with new data, the hierarchical structure is rejected.

  **Case D: Stopping Rules and Selection**
  *Scenario:* We analyze whether studies in the Publish-All Arm that used optional stopping differ in validity from those with fixed $N$.
  *   **Frequentist Prediction:** Studies with optional stopping will show inflated false positive rates compared to fixed $N$, even in the Publish-All Arm, unless corrected. Selection across studies amplifies this.
  *   **Bayesian Prediction:** Within the Publish-All Arm, optional stopping will not bias the posterior mean *if the stopping rule is modeled*. However, selection *across* studies (the Filtered Arm) creates a bias that requires a selection model, vindicating the need to model the "stopping" of publication.

  \answer{Whether valid inference requires controlling long-run error rates or maintaining subjective coherence.}
