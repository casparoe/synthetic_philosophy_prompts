answer: |-
  Representation requires endogenous causal availability, meaning the state must carry information about X that downstream layers actually read to determine behavior.

  ### The Desiderata

  1.  **Endogenous Decodability (Non-negotiable):** Information about X must be recoverable from the state using a probe trained *only* on the network's internal dynamics, not external labels alone.
      *   *Case:* Prevents the "probes can find anything" critique by requiring the information to be linearly or simply separable within the activation manifold without overfitting noise.
      *   *Status:* Non-negotiable. Without this, you cannot distinguish signal from high-dimensional noise.

  2.  **Causal Availability (Non-negotiable):** Manipulating the state along the X-direction must alter the network's output distribution regarding X, barring redundancy.
      *   *Case:* Handles the "unused direction" case. If lesioning/steering changes nothing, the downstream mechanism does not read that state; it is a correlate, not a representation *for the network*.
      *   *Status:* Non-negotiable. This is the only barrier against your roommate's "projection" charge.

  3.  **Implementation Independence (Camp Want: Structuralists):** The specific geometry (e.g., a single direction vs. a subspace) should not dictate representational status if the functional role is preserved.
      *   *Case:* Handles the "seed relativity" case. If Net A has a clean direction and Net B encodes Frenchness distributedly but both behave identically, both represent Frenchness; A is just more interpretable.
      *   *Status:* Camp Want. Your roommate wants this to be false (to claim geometry is everything); you want it true (to claim content is robust).

  4.  **Counterfactual Independence (Non-negotiable):** The state must vary with X even when X's typical correlates (Y) are held constant.
      *   *Case:* Handles the "co-occurrence" case. If horns and stop signs always co-occur, a direction firing for both represents the conjunction, not either individually, unless it dissociates on out-of-distribution data.
      *   *Status:* Non-negotiable. Without this, content is indeterminate.

  5.  **Endogenous Origin (Non-negotiable):** The state must arise from the network's forward pass on input, not external injection.
      *   *Case:* Handles the "injection" case. If you poke Net B with Net A's vector, B does not represent the feature; it is being hijacked. Representation must be generated, not imposed.
      *   *Status:* Non-negotiable. Distinguishes the network's model from your model of the network.

  ### The Impossible Pair

  You are correct: **'Content is fixed by causal role'** and **'A net can represent what it never uses'** cannot be jointly satisfied.

  *   **The Tension:** If content is defined by what the state *does* (causal role), a state that does nothing (unused) has no content. Conversely, if a state can have content without causal efficacy, content is detached from the network's behavior, making it indistinguishable from an analyst's projection (your roommate's point).
  *   **The Drop:** Drop **'A net can represent what it never uses.'**
  *   **Why:** In the context of mechanistic interpretability, we care about the *mechanism*, not the latent statistical structure of the weights. A direction that predicts perfectly but influences nothing is a "shadow variable"—it exists in the weights but not in the computation. Keeping it validates the projection critique. To claim representation is "doing real work," it must be work *the network is doing*, not work *you can do on the network*.
  *   **Note on False Representation:** This also resolves the "represent falsely" tension. A network represents falsely only if its causal role produces an output inconsistent with the input reality (error), not if it contains an unused vector that mismatches reality.

  ### The Killer Requirement

  **Interventional Specificity.**

  This requirement states that intervening on the putative representation of X must change the network's behavior regarding X *specifically*, without collapsing performance on unrelated tasks or changing behavior regarding Y (where X and Y are distinct).

  *   **Why it knocks out candidates:**
      *   It kills **Pure Decodability Accounts:** Probes can decode X from noise, but wiggling that noise doesn't change outputs.
      *   It kills **Pure Correlational Accounts:** A direction might fire for "French" because all French text in training was about "Politics," but steering it changes political sentiment, not language detection.
      *   It kills **Redundant Causal Accounts:** If a feature is represented in 100 places and you lesion one, nothing happens. Specificity demands you find the *bottleneck* or the *unique readout*, not just any correlate.

  This is the only standard that forces you to find the actual circuit rather than a convenient summary.
