  ### 1. The institutional practice and the philosophical puzzle it raises

  The university employs a tripartite system: a vague honor code defining plagiarism morally, detection software imposing sharp numerical thresholds (15%/30%), and a Borderline Review Board mandated to assign workable classifications rather than discover truth. A quinquennial audit recalibrates thresholds based on shifting citation conventions, not empirical misconduct data. This creates a philosophical puzzle: the institution acknowledges the honor code's open texture yet enforces rigid boundaries it admits are conventional rather than factual. The Board's inability to be appealed on substantive grounds suggests the boundary of plagiarism is not a pre-existing fact waiting to be found, but a regulatory construct. The tension lies between the moral realism implied by the honor code and the anti-realist proceduralism of the enforcement mechanism. This prioritizes regulatory stability over metaphysical accuracy.

  ### 2. Reconstruction of the implicit theory of vagueness

  This system presupposes **Administrative Conventionalism**, a pragmatic account distinct from both epistemicism and supervaluationism. Epistemicism is ruled out because the Board is explicitly forbidden from seeking the "true boundary" of plagiarism; there is no hidden fact to uncover. Supervaluationism is also inadequate because the Board does not evaluate cases across all admissible precisifications to find super-truths. Instead, it selects a single precisification based on disciplinary utility and citation norms.

  The implicit theory holds that vagueness is not a metaphysical defect but a functional feature resolved by stipulation. The honor code provides the open-textured concept, but its extension is constituted by administrative fiat. The software's sharp numbers are not discoveries of guilt but triggers for procedural tracks. The quinquennial audit confirms this: thresholds shift with linguistic conventions, implying that "plagiarism" is a status conferred by community agreement rather than an intrinsic property of text. Thus, the boundary is ontologically indeterminate until the Board stipulates it for specific regulatory purposes. Vagueness is managed not by resolution of truth, but by management of consequences. The system treats the boundary as governed by normative utility, where the "correct" classification is whatever maintains institutional integrity and aligns with current disciplinary habits, rather than corresponding to a mind-independent reality. Unlike supervaluationism, which seeks truth across interpretations, this system seeks stability across administrations.

  ### 3. Coherence check: tensions among the honor code, the software thresholds, and the Board's mandate

  There is an apparent tension between the honor code's moral language ("presenting... as one's own") and the Board's conventionalist mandate. The code suggests plagiarism is a moral wrong existing independently of detection, while the Board treats it as an administrative category. However, the system achieves coherence through compartmentalization. The honor code serves as a normative ideal, while the software and Board operate in the realm of procedural justice. The software's sharpness does not claim moral truth but provides efficient triage. The Board resolves the tension by decoupling "violation" from "moral guilt." A student may be classified as a violator for workability reasons without a metaphysical determination that they "really" plagiarized. This resolves the conflict by prioritizing institutional consistency over moral metaphysics. The tension remains only if one insists the honor code describes mind-independent facts; if the code is viewed as a rule-setting device, the conventionalist enforcement aligns perfectly. The software's sharpness is thus tolerated as a necessary heuristic, not a claim about the nature of plagiarism itself. This buffers moral theory from practical enforcement.

  ### 4. Rival substitution and institutional redesign

  If we replaced Conventionalism with **Epistemicism**, the practice would require radical redesign. An epistemicist view holds that a sharp boundary exists but is unknown. Consequently, the Board's mandate would shift from assigning workable classifications to investigating the factual status of authorship. Appeals would need to allow substantive challenges regarding the "true" percentage of ownership, not just procedural errors. The quinquennial audit would rely on empirical data about student intent and misconduct rates, not shifting citation conventions, because conventions do not alter facts.

  However, the practice is philosophically underdetermined in its use of software. Both theories utilize thresholds. An epistemicist could use 30% as a proxy for high probability of guilt, while a conventionalist uses it as a jurisdictional trigger. Minor adjustments—such as renaming the Board to "Fact-Finding Tribunal" and allowing substantive appeals—would signal the shift. Currently, the prohibition on substantive appeals strictly entails the non-epistemic view, whereas the mere existence of thresholds fits both. The software itself is neutral; it is the interpretive mandate that dictates the philosophy. This shifts the institution from norm-regulator to fact-discoverer.

  ### 5. The AI-paraphrase case and points of underdetermination

  In the AI-paraphrase case (18% similarity), the Conventionalist framework routes this to the Board. Since the audit calibrates based on citation conventions, the decision hinges on whether current norms require disclosing AI assistance. If conventions treat AI paraphrasing as acceptable tool use, the Board dismisses it; if norms shift toward disclosure, it becomes a violation. The 18% score is merely a jurisdictional trigger, not evidence of theft.

  This reveals a limit: the system relies on human citation norms to define authorship. AI challenges the metaphysics of "one's own ideas." Both Epistemicists and Conventionalists face underdetermination here: does AI generation negate ownership entirely, or is it a new form of collaboration? The current practice lacks a metaphysics of non-human agency, forcing the Board to stipulate a convention where none exists, highlighting that the system manages vagueness but cannot resolve ontological novelty. The practice can classify the text, but it cannot philosophically ground the classification without new social consensus.
