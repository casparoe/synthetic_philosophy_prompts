prompt: |-
  I have been thinking about how universities administer plagiarism rules, and I believe I have spotted a philosophical tension hiding in the administrative machinery. Most campuses define plagiarism in the honor code with deliberately vague language—presenting another person's ideas or expressions as one's own without adequate acknowledgment—while the integrity office simultaneously relies on detection software that outputs exact similarity percentages and applies hard cutoffs. Cases below 15 percent are dismissed; those above 30 percent trigger an automatic disciplinary hearing; and the intermediate band is routed to a Borderline Review Board. The puzzling feature is the Board's written mandate: it is not instructed to determine whether plagiarism really occurred in that middle range, but rather to assign an administratively workable classification based on disciplinary citation norms, intent, and whether overlap is boilerplate. Its decisions are final except on procedural grounds; there is no appeal mechanism for correcting a misclassification of the true boundary. Compounding the puzzle, the university conducts a quinquennial semantic drift audit that recalibrates the percentage thresholds not in response to new empirical data about student misconduct, but in response to shifting citation conventions across academic fields—treating the cutoff as a convention to be calibrated rather than a fact to be discovered.

  What view of vagueness does this three-layer system—the open-textured honor code, the binary software outputs, and the conventionalist Board—presuppose? Reconstruct the implicit theory: does the practice treat the boundary of plagiarism as sharp but epistemically hidden (an epistemicist picture), as genuinely indeterminate and fixed only by admissible precisification (a supervaluationist picture), or as governed by some other account? Be precise about which institutional features strictly entail one view and which merely fit it comfortably. Assess whether there is an internal tension between the honor code's vagueness and the software's sharpness, or whether the Board's conventionalism resolves it. Then say what would have to change in practice if we replaced the presupposed view with its principal rival—if vagueness were purely epistemic, should the Board be investigating rather than stipulating?—and identify where the practice is philosophically underdetermined, so that both rival theories could license it with only minor adjustments. Finally, apply your reconstructed framework to a case the institution has not yet formalized: AI-generated text that closely paraphrases a source, producing an 18 percent similarity score with no direct copying. Given the implicit philosophy you have identified, should this fall into the dismissed, conventional, or automatic-disciplinary category, and what does that reveal about the limits of the practice?

  Please structure your answer in the following sections, with approximate word counts:
  1. The institutional practice and the philosophical puzzle it raises (about 150 words)
  2. Reconstruction of the implicit theory of vagueness (about 350 words)
  3. Coherence check: tensions among the honor code, the software thresholds, and the Board's mandate (about 250 words)
  4. Rival substitution and institutional redesign (about 250 words)
  5. The AI-paraphrase case and points of underdetermination (about 200 words)
