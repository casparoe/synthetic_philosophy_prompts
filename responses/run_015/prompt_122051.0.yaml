prompt: |-
  You are a professional philosopher of history writing a feature for a journal of science and ideas. Before you begin, briefly brainstorm: outline the core commitments of “causal democracy” in historical explanation—the view that complex historical outcomes are typically sustained by redundant, non-hierarchical networks of conditions, so that removing any single factor does not collapse the explanation—versus “explanatory selectionism,” which holds that apparent overdetermination is an artifact of sloppy framing and that rigorous counterfactual analysis reveals a hidden hierarchy of structural conditions and triggering events. Then write a polished, formal dialogue between two equally competent scholars, Dr. Amara Okonkwo (defending causal democracy) and Dr. Julian Reed (defending selectionism). Set their exchange around a concrete but under-discussed case: the rapid adoption of decimalized currency within a 19th-century maritime trading federation. Have them respond directly to each other’s actual arguments—Okonkwo should challenge Reed on whether his hierarchy smuggles in presentist judgments about what “mattered,” and Reed should challenge Okonkwo on whether her democracy collapses explanatory distinction into an undifferentiated inventory. Do not include bibliographies, reading lists, citations, or verbatim quotations from real texts. Think carefully, maintain an intellectually serious tone for an educated general audience, and ensure neither interlocutor is a strawman.
