prompt: |-
  Hi — I work in responsible sourcing for a mid-sized food company, and the same shape of decision keeps landing on my desk, so I want something repeatable rather than me reinventing the argument each time.

  The shape is this. We're being pushed to swap conventional proteins (fishmeal, soy) for farmed insects — black soldier fly larvae, crickets, mealworms — and separately we're being asked to make public claims about animal welfare. Every version of this runs into the same two facts pulling in opposite directions. First, the numbers of individual animals involved are completely absurd compared to anything else we deal with: someone on my team did a back-of-envelope suggesting a single tonne of larvae protein is on the order of a million-plus individuals, and our annual volumes would put us in the billions. Second, it's genuinely unclear whether any of them feel anything at all — "sentience" is the word people in the space use — and the honest probability could be anywhere from near-zero to fairly substantial. When I try to think it through myself I end up just multiplying, and then literally everything comes out as a five-alarm emergency, which can't be right and also isn't usable: if every warehouse fumigation is a moral catastrophe then nothing is.

  So: write me a decision procedure my team can actually run. Concretely, I need:

  - The questions in order, and for each one what would count as a good enough answer to move on. We are procurement people, not biologists — flag which steps genuinely need an entomologist and which we can do ourselves with a day per decision and normal internet access.
  - Where the procedure just stops and says no, and where it hands the question to a human because it's a values call rather than a factual one. I need that distinction sharp, because I have to explain to our sustainability committee why something is their call and not mine.
  - How to handle the fact that the key probability is itself something I don't trust. Experts disagree wildly, and I don't want to plug in a made-up number and let the arithmetic launder it. Tell me what to write down instead of a number when there isn't one.
  - How to handle the sign problem: even if they do feel things, I can't tell whether a larval life in a bin of food waste is a good life or a bad one, and which way that goes reverses what the huge numbers are telling me to do. The procedure needs to not quietly assume one of those.
  - How to score the indirect evidence when it points different ways. People cite reflex responses to being damaged, versus learning to avoid a place where they got hurt, versus the fact that they'll keep tending an injured body part, versus trade-off behaviour where they accept one bad thing to get another. I need a rule for what I'm allowed to count as evidence here and what's just a good story, and what to do when the proxies disagree.
  - Whether there is any point at which we stop counting. I need a defensible place to say "this is below the line, site manager decides, no escalation", because otherwise the procedure will eat the whole company. But I also don't want the line to be a way of making the numbers disappear by fiat — tell me how I'd know if I'd drawn it in a self-serving place.
  - How much the counterfactual matters. A lot of this stuff is raised on waste we'd otherwise send to landfill, so some unknown number of these individuals would have existed anyway, and I genuinely can't tell whether that's a defence, an irrelevant detail, or an extra problem.
  - And an edge case: tell me what the unit of counting even is when the animal is a colony. If a supplier ever turns up with ant or termite protein, I don't think I can say how many individuals there are in any sense that means something.

  Then run it on three real-ish cases. (1) Switching a farmed-salmon supply chain from fishmeal to black soldier fly larvae raised on food waste — this one goes to the board and marketing wants a claim on pack. (2) Routine pest control in a grain warehouse, stored-product moths and cockroaches, decided by a site manager in about twenty minutes, weekly, forever. (3) A startup pitching "no-kill" insect protein: they let the animals complete their whole life cycle and collect them after natural death, it costs roughly three times as much, and they want us to sell it as the welfare-friendly option in a premium bar. I have a feeling at least one of these is going to come out in a way that costs us money or makes us look bad — please tell me straight rather than softening it.

  One more thing: whatever we produce has to be defensible in public. NGOs will read our policy and a journalist could ask about it, so "we ran the numbers" won't do if the numbers were invented. Please also say plainly what this procedure can't do.

  Don't bother with a reading list or a pile of citations, we won't follow them up and I can't check them anyway. But do tell me how confident you are in what you're claiming, and single out the one point you're least sure of — ideally the one where you think a reasonable person who knows this literature would probably disagree with you.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Responsible sourcing professional at a mid-sized food company.
      *   **Problem:** Repeated decisions about insect protein (BSF, crickets, etc.) vs. conventional proteins, complicated by huge numbers of individuals and uncertain sentience/welfare status.
      *   **Goal:** A repeatable decision procedure (algorithm/checklist) for the team.
      *   **Specific Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Flag steps needing experts vs. internal staff.
          *   Clear "Stop/No" vs. "Escalate to Values Call" distinctions.
          *   Handling uncertain probabilities (no fake numbers).
          *   Handling the "Sign Problem" (is life good or bad?).
          *   Scoring conflicting indirect evidence of sentience.
          *   Defensible cutoff for low-stakes decisions (site manager level).
          *   Handling counterfactuals (waste stream existence).
          *   Handling colony units (ants/termites).
          *   Run on 3 specific cases (Salmon/BSF, Warehouse Pest Control, "No-Kill" Premium).
          *   Public defensibility & limitations.
          *   Confidence level & point of highest uncertainty.
      *   **Constraints:** No reading lists/citations (won't be used). Be direct/blunt about costs/reputation.

  2.  **Deconstruct the Ethical/Practical Tension:**
      *   *The Numbers Game:* Billions of insects vs. millions of vertebrates. Expected Value = Probability of Sentience $\times$ Number of Individuals $\times$ Welfare Impact.
      *   *The Uncertainty:* Probability of sentience ($P$) is unknown (0 to 1). Welfare Impact ($W$) is unknown (Positive to Negative).
      *   *The Trap:* If $P > 0$ and $N$ is huge, Expected Suffering is infinite/catastrophic. This leads to paralysis.
      *   *The Solution:* Need a "Precautionary Principle" lite, combined with a "Materiality Threshold" and a "Comparative Baseline."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Materiality & Scope.* Don't analyze every moth. Set a threshold.
      *   *Step 2: Sentience Evidence.* How to evaluate without being biologists? Use a proxy checklist (Cambridge Declaration style but simplified).
      *   *Step 3: The Sign Problem.* Acknowledge we don't know if life is net positive. Default to "prevention of harm" rather than "creation of benefit."
      *   *Step 4: Probability Handling.* Don't use numbers. Use "Bands" or "Classes" (e.g., Plausible, Unclear, Unlikely).
      *   *Step 5: Counterfactuals.* Distinguish between *causing existence* (farming) and *managing existence* (pests/waste).
      *   *Step 6: The Values Call.* Where does procurement stop and ethics committee start? When the evidence is ambiguous *and* the scale is huge.
      *   *Step 7: Colony Counting.* Define the "Moral Unit." Individual vs. Superorganism.

      *Refining the "Stop/No" vs. "Escalate":*
      *   Stop/No: Clear evidence of high suffering + high scale + viable alternative.
      *   Escalate: Ambiguous evidence + high scale + no clear alternative.
      *   Site Manager: Low scale / Unavoidable / Standard industry practice.

      *Refining the Probability:*
      *   Instead of $P=0.3$, use "Sentience Class."
      *   Class A (Vertebrates/Cephalopods): Assume Yes.
      *   Class B (Decapods/Insects): Assume Plausible/Uncertain.
      *   Class C (Nematodes/etc.): Assume Unlikely.
      *   *Decision Rule:* If Class B + High Volume -> Apply Precautionary Principle.

      *Refining the Sign Problem:*
      *   Default assumption: Death is a harm (deprivation of future), but suffering is a worse harm.
      *   Farming: Creating life to kill it. Risk = Suffering during life + Harm of death.
      *   Pests: Killing to protect food. Risk = Suffering during death.
      *   *Rule:* Minimize suffering during life *and* death. Don't count "existence" as a benefit unless explicitly claimed (like the "no-kill" case).

  4.  **Developing the Three Cases:**

      *   *Case 1 (Salmon/BSF):* High volume. Farmed insects. Sentience plausible. Welfare conditions unknown. *Verdict:* Escalate. Needs welfare standards before marketing claim. Risk of greenwashing.
      *   *Case 2 (Pest Control):* Low volume per decision (though high aggregate). Unavoidable. Food safety priority. *Verdict:* Site manager. Use least-suffering method available (standard industry). Don't overthink, but don't be cruel.
      *   *Case 3 (No-Kill Premium):* High cost. Claim is "welfare." *Verdict:* Skepticism. Natural death might mean more suffering (cannibalism, disease) than quick kill. Marketing claim is risky. Likely not worth the cost unless verified.

  5.  **Addressing Specific Constraints:**
      *   *Public Defensibility:* The procedure must rely on *process* (how we decided) not *outcome* (the specific number). "We applied the Precautionary Principle based on current scientific consensus."
      *   *Confidence/Uncertainty:* I need to be honest. The "Sign Problem" (is a short insect life worth living?) is the weakest link philosophically.

  6.  **Writing the Response (incorporating tone):**
      *   Tone: Professional, direct, operational, slightly philosophical but grounded.
      *   Structure:
          1.  The Procedure (The "Insect Welfare Decision Tree").
          2.  The Three Cases.
          3.  Public Defensibility & Limitations.
          4.  Confidence & Uncertainty.

      *(Self-Correction during drafting)*: I initially thought about suggesting a specific probability number (e.g., 10%). The prompt explicitly says *not* to do that ("I don't want to plug in a made-up number"). I need to use qualitative bands.
      *(Self-Correction on Colony)*: For ants, counting individuals is impossible. The unit should be "colony biomass" or treat the colony as the unit of moral concern, but practically, for protein, we weigh biomass. I should advise treating the *biomass* as the proxy for moral weight if individuals are indistinguishable.
      *(Self-Correction on Pest Control)*: The prompt asks about "weekly, forever." This implies aggregate numbers are high. I need to make sure the "Site Manager" exemption doesn't violate the "High Volume" rule. The distinction is *intent*. Pest control is defensive/necessary for safety, not production. That changes the ethical calculus (Doctrine of Double Effect-ish).

  7.  **Final Polish:** Check against all bullet points in the prompt.
      *   Questions in order? Yes.
      *   Good enough answer? Yes.
      *   Stop/No vs. Values Call? Yes.
      *   Probability handling? Yes (Bands).
      *   Sign problem? Yes (Neutrality/Precaution).
      *   Conflicting evidence? Yes (Hierarchy of Proxies).
      *   Stopping point? Yes (Materiality Threshold).
      *   Counterfactuals? Yes (Creation vs. Management).
      *   Colony unit? Yes.
      *   3 Cases run? Yes.
      *   Public defensibility? Yes.
      *   Confidence/Uncertainty? Yes.

  8.  **Final Review of the "One Point of Uncertainty":** The prompt asks for the one point I'm least sure of. This should be the "Sign Problem" (valence of existence). Philosophers disagree wildly on whether non-existence is neutral or preferable. I will flag this.

  9.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).

  *(Wait, one last check on the "Site Manager" cutoff)*: The prompt worries about the line being self-serving. I need to add a "Audit/Review" step to the cutoff so it's not just "manager decides" forever. It needs to be "Manager decides within Standard Operating Procedure (SOP) which is reviewed annually." That makes it defensible.

  *(Check on "No-Kill" case)*: If they die naturally, do they suffer more? Likely yes (starvation, cannibalism in BSF). I need to be blunt that this marketing claim might be ethically weaker than quick kill.

  *(Check on "Public Defensibility")*: Emphasize that the *process* is the shield, not the *conclusion*.

  Okay, ready to write.cw
answer: |-
  Here is a decision procedure designed for procurement and sourcing teams. It is built to be auditable, defensible, and operationally feasible without requiring your team to become ethicists or entomologists.

  ### The Insect Welfare Decision Procedure (IWDP)

  **Purpose:** To determine whether a sourcing decision involving insects requires executive/ethics committee escalation or can be handled at the operational level.
  **Principle:** Precautionary without paralysis. We assume moral weight exists where evidence is ambiguous, but we weigh it against materiality and necessity.

  ---

  #### Step 1: The Materiality Threshold (The "Stop Counting" Line)
  **Question:** Is the annual volume of insect biomass involved in this decision greater than 0.1% of our total protein sourcing volume, OR does the specific action involve intentional killing of >1 million individuals per annum in a single supply chain?
  *   **Who decides:** Procurement Analyst (Data check).
  *   **Pass (Move to Step 2):** Yes, it exceeds the threshold.
  *   **Fail (Stop):** No.
      *   **Action:** Delegate to Site Manager / Operational SOP.
      *   **Defensibility:** This is not ignoring the issue; it is setting a *de minimis* standard. Just as we do not audit every paperclip for carbon footprint, we do not escalate low-volume insect interactions.
      *   **Anti-Self-Serving Check:** This threshold must be written into policy *before* specific cases arise. If you move the line to fit a vendor, you fail the audit.
      *   **Note on Pest Control:** Routine pest control usually fails this test *per decision*, even if aggregate numbers are high, because the intent is food safety, not production. (See Step 5).

  #### Step 2: The Sentience Evidence Banding (Handling the Probability)
  **Question:** Based on available literature, which Sentience Band does the species fall into?
  *   **Who decides:** Sourcing Manager (1 day research). *If the species is obscure, flag for External Entomologist review.*
  *   **The Bands:**
      *   **Band A (High Confidence):** Vertebrates, Cephalopods, Decapod Crustaceans. (Assume Sentience = Yes).
      *   **Band B (Plausible/Uncertain):** Insects (BSF, Crickets, Mealworms). Evidence of nociception, learning, and trade-off behavior exists, but subjective experience is unproven.
      *   **Band C (Low Confidence):** Nematodes, simple larvae, colonial organisms where individualization is impossible.
  *   **Rule:** Do not assign a percentage (e.g., "20% chance"). Assign the Band.
  *   **Pass:** If Band A or Band B, move to Step 3. If Band C, you may proceed with standard sourcing criteria unless Step 1 volume is extreme.

  #### Step 3: The Sign Problem (Good Life vs. Bad Life)
  **Question:** Are we *creating* these lives to harvest them, or *managing* existing populations?
  *   **Who decides:** Sourcing Manager.
  *   **Option A: Creation (Farming).** We are breeding them to die.
      *   **Default Assumption:** A life ended for harvest is a net negative welfare event unless proven otherwise. We do not count "existence" as a benefit to the animal. We assume the harm of death + risk of suffering outweighs the benefit of having lived.
      *   **Why:** This prevents the "we are doing them a favor by birthing them" argument, which is ethically unstable.
  *   **Option B: Management (Pests/Waste).** They would exist anyway.
      *   **Default Assumption:** Neutrality on existence. Focus solely on the *manner* of death and life conditions prior to death.
  *   **Pass:** Identify which option applies. Move to Step 4.

  #### Step 4: Conflicting Evidence Rule (Scoring the Proxies)
  **Question:** If Band B, what is the strongest evidence available regarding their experience of stress/pain?
  *   **Who decides:** Sourcing Manager.
  *   **Hierarchy of Evidence (Count only the highest available):**
      1.  **Trade-off Behavior:** Will the insect sacrifice food/safety to avoid a stimulus? (Strongest).
      2.  **Protective Behavior:** Do they tend to injured body parts or avoid using them? (Moderate).
      3.  **Avoidance Learning:** Do they remember and avoid places where they were harmed? (Moderate).
      4.  **Reflex/Physiology:** Do they recoil or show stress hormones? (Weakest – counts as negligible for this procedure).
  *   **Rule:** If Level 1 or 2 is documented in peer-reviewed literature for this species, treat as **Band A** for the purpose of this decision. If only Level 4 exists, treat as **Band C**.
  *   **Pass:** Adjust Band if necessary. Move to Step 5.

  #### Step 5: The Counterfactual & Necessity Test
  **Question:** Is this insect protein *necessary* for the product function, or is it a swap for another protein? And for pests: is the killing necessary for safety?
  *   **Who decides:** R&D / Quality / Sourcing.
  *   **Scenario A (Protein Swap):** We are choosing Insect vs. Soy vs. Fish.
      *   **Action:** This is a **Values Call**. Escalate to Sustainability Committee.
      *   **Reason:** You are choosing which supply chain of suffering to fund. Procurement cannot optimize this alone.
  *   **Scenario B (Pest Control):** We are killing to protect human food.
      *   **Action:** Operational Decision (Site Manager).
      *   **Constraint:** Must use industry-standard "lowest suffering" methods (e.g., rapid freeze vs. slow poison) if cost difference is <5%.
  *   **Scenario C (Waste Stream):** Insects are raised on waste that would otherwise rot.
      *   **Action:** This is a **Mitigation Factor**, not a Pass. It reduces environmental guilt, not welfare guilt. Proceed to Step 6.

  #### Step 6: The Values Call (Escalation Point)
  **Question:** Does this decision involve Band A/B species, exceed the Materiality Threshold, and involve a trade-off between cost/performance and welfare standards?
  *   **Who decides:** Sustainability Committee / Board.
  *   **Action:**
      *   **If Yes:** Procurement presents the options (e.g., "Standard BSF" vs. "High-Welfare BSF @ +20% cost"). Committee decides the risk appetite.
      *   **If No:** Procurement proceeds with standard best-available practice.
  *   **Defensibility:** This explicitly separates *facts* (Steps 1-5) from *values* (Step 6). If a journalist asks, "Why did you choose the cheaper option?" you answer: "We identified the welfare risk, quantified the cost to mitigate it, and the Company made a strategic decision that X was the priority."

  #### Special Case: Colonial Organisms (Ants/Termites)
  **Rule:** If the species is eusocial to the point where individuals are biologically interchangeable (workers), count the **Colony** as the moral unit, not the individual.
  *   **Metric:** 1 Tonne of Ant Protein = X Colonies, not Y Individuals.
  *   **Reasoning:** Destroying a colony eliminates the reproductive potential and social structure; killing a worker is functionally equivalent to trimming a cell in a multicellular organism. This drastically reduces the "absurd numbers" problem for eusocial species.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: Salmon Supply Chain (Fishmeal to BSF)
  *   **Step 1 (Materiality):** High volume. **Pass.**
  *   **Step 2 (Sentience):** BSF Larvae. Band B (Plausible). **Pass.**
  *   **Step 3 (Sign):** Creation (Farming). **Default: Net Negative.**
  *   **Step 4 (Evidence):** BSF show avoidance learning and trade-offs. **Upgrade to Band A equivalent for decision.**
  *   **Step 5 (Counterfactual):** Protein Swap. **Values Call.**
  *   **Step 6 (Escalation):** **ESCALATE.**
  *   **Outcome:** You cannot make a marketing claim ("Welfare Friendly") without defining what that means. If you switch to BSF, you are swapping vertebrate suffering (fish) for invertebrate suffering (insects) at a 1000:1 numerical ratio.
  *   **Blunt Truth:** If you market this as "Ethical" without a welfare certification standard for the insects, you are vulnerable to greenwashing accusations. The Committee must decide if "reducing ocean impact" outweighs "increasing individual kill count." Do not let Marketing write the claim until the Committee signs off on the ethical trade-off.

  #### Case 2: Warehouse Pest Control (Moths/Cockroaches)
  *   **Step 1 (Materiality):** Per decision, low volume. Aggregate is high, but intent is safety. **Fail (Stop).**
  *   **Action:** Site Manager decides.
  *   **Constraint:** SOP must mandate "Fastest available kill method" (e.g., thermal shock) where cost impact is negligible.
  *   **Defensibility:** "We apply a de minimis threshold for defensive pest control to ensure food safety, while mandating humane dispatch methods in our SOP."
  *   **Blunt Truth:** Do not escalate this. If you escalate weekly pest control, you paralyze operations. The ethical risk here is low compared to the risk of contaminated food.

  #### Case 3: "No-Kill" Premium Protein (Natural Death)
  *   **Step 1 (Materiality):** Premium bar, likely lower volume but high visibility. **Pass.**
  *   **Step 2 (Sentience):** Crickets/Mealworms. Band B. **Pass.**
  *   **Step 3 (Sign):** Creation. **Default: Net Negative.**
  *   **Step 4 (Evidence):** Insects in high-density farming often suffer cannibalism, disease, and starvation if not harvested at peak.
  *   **Step 5 (Counterfactual):** Protein Swap. **Values Call.**
  *   **Step 6 (Escalation):** **ESCALATE.**
  *   **Blunt Truth:** This is likely a **welfare trap**. Letting insects live to natural death in a farm setting usually means higher suffering (crowding, resource scarcity, predation by peers) than a quick harvest at maturity.
  *   **Recommendation:** Do not buy this unless an entomologist verifies that *total lifetime suffering* is lower than standard harvest. Marketing this as "Welfare Friendly" is high-risk; if an NGO proves the insects suffered more due to disease/cannibalism, the reputational damage will exceed the cost savings of the standard option.

  ---

  ### Public Defensibility & Limitations

  **How to defend this publicly:**
  "We do not pretend to know the unknowable. We acknowledge the scientific uncertainty regarding insect sentience. Therefore, we apply a Precautionary Principle scaled by volume. We separate operational necessities (food safety) from strategic choices (protein sourcing). Where strategic choices involve potential moral weight, we escalate to governance rather than hiding behind arithmetic."

  **What this procedure CANNOT do:**
  1.  **It cannot solve the math.** It admits the math (Billions $\times$ Uncertain Sentience) is broken and bypasses it with thresholds.
  2.  **It cannot guarantee moral correctness.** It guarantees *process integrity*. You can still make a "wrong" moral choice, but you made it transparently.
  3.  **It cannot stop NGO criticism.** An NGO can always argue your Materiality Threshold is too high or your Sentience Band is too low. Your defense is consistency, not perfection.

  ### Confidence & Uncertainty

  **Confidence Level:** High on operational viability; Moderate on ethical robustness.
  This procedure will stop your team from reinventing the wheel and prevents paralysis. It creates a clear audit trail.

  **Point of Highest Uncertainty (The Weak Link):**
  **Step 3 (The Sign Problem / Default Assumption).**
  I have instructed you to assume that *creating a life to kill it* is a net negative (existence is not a benefit).
  **Why a reasonable expert would disagree:** Some utilitarian philosophers argue that a life with net positive welfare (even if short) is better than non-existence. If the insect life is "worth living," then farming them is morally good, not neutral or bad.
  **Why I chose this default:** It is the safer reputational bet. Claiming "we farmed them to give them life" is much harder to defend to a skeptical public than "we minimized harm in a necessary supply chain." If you assume existence is a benefit, you open yourself to accusations of instrumentalizing life. If you assume it's a cost, you are conservative.
  **Risk:** If future science proves insects have rich, joyful inner lives, this procedure will look speciesist. But given current knowledge, the "Precautionary Negative" is the only defensible corporate stance.
