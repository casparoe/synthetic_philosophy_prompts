      *   *Bellman Verdict:* It *deflates* Reflection. It shows Reflection is just a consistency condition for a specific type of estimator (unbiased, Markov). If the estimator is biased (function approx, corrupted obs), satisfying Bellman/Reflection is actually *irrational* (leads to suboptimal reward/false belief).
