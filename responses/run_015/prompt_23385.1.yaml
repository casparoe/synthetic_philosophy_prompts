      *   **Daniel's Counter-Counter (The Force of the Pump):** Why Daniel pushes back. If the preference is *intrinsic* to the cards, the context of the trade shouldn't matter. If it *does* matter (i.e., "I prefer B to A unless it's part of a pump"), then the preferences aren't actually A>B, B>C, C>A. They are conditional.
      *   **Resolution/Nuance:**
          1.  **Ideal vs. Actual:** Daniel is right about *ideal* rationality (normative). You are right about *actual* psychology (descriptive).
