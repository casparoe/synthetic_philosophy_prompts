answer: |-
  ### Activity: "The Night Nurse Autopsy"

  **Time:** 90 Minutes
  **Class Size:** 16 Students (4 groups of 4)
  **Materials:** Printed handout of the vignette (below), whiteboard, markers.

  #### 1. The Stimulus Text (Handout)
  *Distribute this without any context about intuition pumps or rhetoric. Tell them it is a case study for a moral judgment exercise.*

  > **Case 49: The Night Shift**
  >
  > Elena had been on her feet for fourteen hours. The break room coffee was cold, untouched, and the fluorescent lights hummed with a headache-inducing flicker. In Bed 4 lay Toby, a seven-year-old boy whose breathing had become shallow and ragged. The protocol was clear: check vitals every thirty minutes, log everything, maintain sterility.
  >
  > But Toby was terrified. He was reaching out for a hand, not a pulse oximeter. Elena knew that if she left the room to wash her hands and grab the tablet, the moment would break. The boy would be alone in the dark. Surely, no competent professional would abandon a dying child to fetch a tablet.
  >
  > She held his hand. She hummed a lullaby her own mother used to sing. The monitors beeped irregularly, then flatlined.
  >
  > Later review suggested that had she followed the strict thirty-minute protocol, there was a non-zero chance the arrest could have been preempted. But as the hospital administrator reviewed the footage, he saw the cold coffee. He saw the trembling exhaustion in her grip. He asked himself: do we punish care?

  #### 2. Timeline & Procedure

  **Phase 1: Immersion & Intuition (15 Minutes)**
  *   **Individual Read (5 mins):** Students read the text silently.
  *   **Private Vote (2 mins):** On a slip of paper, students answer: *Is Elena morally responsible for Toby's death?* (Yes/No/Unsure). They fold it and keep it.
  *   **Room Vote (3 mins):** Ask for a show of hands. (Predictably, most will lean toward "No" or "Minimal Responsibility").
  *   **Prompt (5 mins):** Ask 2-3 students to briefly state *why*. Do not correct them. Do not introduce theory. Just let the intuitions stand.

  **Phase 2: The Autopsy (40 Minutes)**
  *   **Instruction:** Tell students: "Your intuition just moved. You felt a pull toward a specific conclusion. Your job now is to find the wires that moved you. Assume this text was designed to manipulate your judgment. Find the mechanism."
  *   **Group Work (25 mins):** Divide into 4 groups. Each group gets a specific focus question, but must read the whole text.
      *   *Group 1 (Adjectives & Atmosphere):* Identify every descriptive detail that does not change the factual outcome but changes how you *feel* (e.g., "cold coffee," "flicker").
      *   *Group 2 (Presuppositions):* Identify sentences that assume a conclusion before proving it (e.g., "Surely, no competent...").
      *   *Group 3 (Focus & Blindspots):* What information is vivid? What information is vague? (e.g., "non-zero chance" vs. "terrified boy").
      *   *Group 4 (The Agent):* How is Elena described vs. how is the Protocol/Administrator described?
  *   **Board Work (15 mins):** Each group comes to the board and writes 3-4 specific phrases they found under their category. Do not let them summarize; they must quote the text.

  **Phase 3: Theoretical Mapping (25 Minutes)**
  *   **Lecture/Debrief:** Now introduce Dennett's concept of the "Intuition Pump."
  *   **Mapping:** Go through the board work and label their findings with Dennett's terminology.
      *   *Group 1 findings* → **Salient Detail:** Irrelevant details that ground the story in reality to lower defenses.
      *   *Group 2 findings* → **The "Surely" Move:** Rhetorical pressure that makes disagreement feel like incompetence.
      *   *Group 3 findings* → **Juxtaposition/Vividness:** Making the cost of one option visceral (dying child) and the cost of the other abstract ("non-zero chance").
      *   *Group 4 findings* → **Loading the Agent:** Making one character sympathetic and the other bureaucratic.
  *   **Discussion:** Ask: "If we rewrite this removing these phrases, does the logic hold?" (Read a sterile version: "Nurse skipped protocol. Patient died. Protocol had a chance of prevention." The intuition usually shifts).

  **Phase 4: Limitations & Close (10 Minutes)**
  *   **Discussion:** Ask what this activity *didn't* show them.
  *   **Instructor Fill-in:** Explain that real philosophical thought experiments are refined over decades. This activity shows the *rhetoric*, but not the *iterative testing* philosophers do to ensure the intuition isn't *just* rhetoric. Also, note that this activity isolates one pump; in the wild, pumps work in networks (one pump sets up another).

  #### 3. Predictable Failures & Fixes

  **Failure 1: Students debate the ethics, not the text.**
  *   *Symptom:* Groups argue about whether nurses *should* follow protocol rather than analyzing the sentence structure.
  *   *Fix:* Circulate and interrupt: "I don't care if she was right. I care about the word 'flicker.' Why is that word there? Delete it. Does the story change?" Force them to be textual mechanics, not ethicists.

  **Failure 2: Students claim immunity ("I wasn't pumped").**
  *   *Symptom:* A student says, "I saw through this immediately."
  *   *Fix:* Ask them to interview a group member who *was* pumped. Their job shifts to "reverse-engineer your peer's reaction." This keeps them engaged in the machinery even if they feel immune.

  **Failure 3: Running out of time during Board Work.**
  *   *Symptom:* Groups take too long writing on the board.
  *   *Fix:* Give each group one marker. Limit them to 3 phrases max. Keep the pace brisk.

  #### 4. What This Activity Cannot Capture (Instructor Notes)

  Use this section to bridge to the next lecture or reading.

  1.  **Iterative Refinement:** This activity treats the thought experiment as a static object. In philosophy, pumps are tweaked over years (e.g., Gettier cases) to block counter-arguments. Students might think pumps are just "tricks" rather than tools for testing conceptual boundaries.
  2.  **The "Lab" Condition:** Dennett argues pumps are like lab experiments isolating variables. This activity highlights the *contamination* of variables (rhetoric), but doesn't show how a *good* pump isolates a variable cleanly. You must explain that the goal isn't to banish rhetoric, but to ensure the intuition comes from the *structure* of the case, not the *paint* on the case.
  3.  **Positive Construction:** Students learn to dissect (defensive) but not build (offensive). They need a follow-up assignment where they must construct a pump to support a claim, forcing them to use the tools ethically.
