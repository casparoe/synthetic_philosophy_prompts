      *   (3) Marking Scheme with A/B distinction? Yes.
      *   (4) Distinguish settled vs. contested? Yes.
      *   (5) No reciting taxonomy? Yes, applied to scenario.

  8.  **Final Polish:** Check the Hofstadter terminology. In GEB (Chapter VI "The Location of Meaning"), he discusses the record, the grooves, and the music.
      *   Frame: "This is a record." (Context)
      *   Outer: The grooves. (Signal)
      *   Inner: The music. (Content)
      *   In the bacteria case:
      *   Frame: The genetic logic (The "Record" nature).
      *   Outer: The Chemical Gradients (The "Grooves").
      *   Inner: The Phenotype (The "Music").
      *   *Wait, one nuance:* The prompt says DNA *is* the frame. Okay, I will stick to that.
      *   *Contested point:* Does the bacteria have an "inner message"? Hofstadter suggests meaning arises from the interaction between signal and active interpreter. If the interpreter is unconscious, is it meaning or just causation? This is the crux of the essay.

