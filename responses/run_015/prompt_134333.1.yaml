  *(Self-Correction on Model Answer Length)*: 600 words is relatively short for a complex philosophical argument. I need to be concise. I will focus on the mapping, the locus of meaning, and the collapse point.

  *(Self-Correction on Marking Scheme)*: Make sure the distinction between "causal mechanism" and "interpretive rule" is highlighted, as requested in the prompt instructions.

  *(Final check on "Retired Physicist" persona)*: The user *is* the physicist, but they want me to generate the materials. I don't need to write *as* the physicist, just provide the materials they requested.

