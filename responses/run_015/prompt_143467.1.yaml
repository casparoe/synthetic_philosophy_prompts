  # JOINT STATEMENT ON RATIONAL DEFERENCE AND HIGHER-ORDER EVIDENCE

  **Issued by:** Camp A (Defenders of Unconditional Deference) and Camp B (Proponents of Epistemically Conditional Deference)
  **Date:** October 26, 2023
  **Subject:** The Normative Status of the Principal Principle Under Epistemic Self-Doubt

  ## I. AGREED CLAIMS

  We, the undersigned representatives of Camp A and Camp B, affirm the following propositions as the common ground for our dispute. We agree that our divergence is normative and epistemic, not metaphysical.

  1.  **Neutral Formulation of the Principal Principle:** We agree to adopt a standard formulation of the Principal Principle (PP) as the baseline for discussion: *Where $C$ is a rational credence function, $Ch$ is a chance function, and $E$ is admissible evidence, if an agent knows that $Ch(A) = x$, then rationality requires $C(A | E \& Ch(A)=x) = x$.* We disagree only on the conditions under which evidence $E$ counts as admissible when higher-order evidence is present.
  2.  **Objective Chance in Physics:** We agree that objective chances are not merely philosophical posits but figure indispensably in at least some mature physical theories (e.g., quantum mechanics), and that rational agents ought to account for these theories when forming beliefs about the physical world.
  3.  **Existence of Higher-Order Evidence:** We agree that agents can possess second-order evidence (higher-order evidence) regarding the reliability of their own cognitive faculties, measurement instruments, or probability assessments. We agree this evidence can indicate systematic unreliability without necessarily falsifying the first-order proposition assessed.
  4.  **Nature of the Dispute:** We agree that the core dispute is not about whether objective chances exist (Chance Realism), but about whether the normative constraint to defer to those chances survives when an agent possesses higher-order evidence suggesting her grasp of those chances is compromised.

  ## II. TABLE OF DISAGREEMENTS

  The following table isolates the specific points of divergence regarding the application of the Principal Principle under conditions of epistemic self-doubt.

  | Issue | Camp A (Unconditional Deference) | Camp B (Epistemically Conditional Deference) |
  | :--- | :--- | :--- |
  | **Conditionality of Deference** | Deference to objective chance is unconditional upon the agent's meta-level confidence. If the objective chance is known (or treated as fixed by evidence), credence must align with it regardless of doubts about the reasoning process that led to that knowledge. | Deference is conditional on epistemic transparency. If higher-order evidence undermines the agent's justification for believing she has correctly identified the objective chance, deference is blocked or modified. |
  | **Implication of Blocking Deference** | Blocking deference implies a failure of rationality or a rejection of the chance proposition itself. To refuse to align credence with known chance is to violate a constitutive norm of rational belief. | Blocking deference does not require denying objective chance realism. It requires revising norms of belief formation to prioritize total evidence (including reliability data) over abstract chance constraints. |
  | **Treatment of Calibration Data** | Statistical data about the agent's past prediction errors is inadmissible with respect to the chance proposition itself. It bears on the agent's psychology, not the world's probabilities. | Statistical data about past prediction errors is admissible evidence. It directly modifies the rational credence function, even if this results in credence diverging from the putative objective chance. |

  ## III. CRUXES AND TEST CASES

  We identify the following two cruxes as the decisive factors for resolving our disagreement. For each crux, we stipulate a concrete hypothetical case and record the predicted verdict of each camp regarding the rational credence the agent ought to hold.

  ### Crux 1: Epistemic Accessibility via Fallible Instruments
  **Question:** Does objective chance remain epistemically accessible enough to ground deference when an agent knows her access is mediated by fallible instruments?

  **Hypothetical Case (The Quantum Generator):**
  An agent possesses a quantum-randomness generator known by physical theory to assign an objective chance of 0.5 to outcome $O$ (Spin Up). The agent observes a reading on her interpretation apparatus indicating $O$ will occur. However, the agent also possesses definitive data that her apparatus misclassifies outputs at a 15% rate under the current conditions (i.e., when the apparatus reads "Spin Up," the physical state is actually "Spin Down" 15% of the time). The agent knows the objective chance of the *physical state* is 0.5, but her evidence of the *outcome* is filtered through the unreliable apparatus.

  **Predicted Verdicts:**
  *   **Camp A:** The rational credence in $O$ must be **0.5**. The objective chance of the physical event is fixed by theory at 0.5. The apparatus reliability is inadmissible evidence regarding the chance itself; the agent must defer to the known physical probability of the event.
  *   **Camp B:** The rational credence in $O$ must be **0.425** (or equivalent adjustment). The agent's total evidence includes the reliability data. Rational credence must track the probability of the outcome given the total evidence (including the 15% error rate), even if this diverges from the underlying objective chance of the physical state.

  ### Crux 2: Disregarding Statistical Evidence of Reasoning Errors
  **Question:** Does accepting deference force an agent to disregard statistical evidence about her own reasoning errors?

  **Hypothetical Case (The Cognitive Bias Study):**
  An agent calculates that the objective chance of Event $E$ is 0.8 based on a complex probabilistic model. Subsequently, she is presented with robust psychological evidence that agents using this specific model under time pressure systematically overestimate probabilities by a factor of 20% (i.e., when the model outputs 0.8, the true chance is typically 0.64). The agent acknowledges this higher-order evidence but maintains her original calculation stands as her best estimate of the objective chance.

  **Predicted Verdicts:**
  *   **Camp A:** The rational credence in $E$ should remain **0.8** (provided the agent maintains that 0.8 is the true objective chance). If the agent believes $Ch(E)=0.8$, the Principal Principle mandates credence 0.8. Higher-order evidence about reasoning errors challenges whether she *knows* the chance is 0.8, but if she retains the belief that $Ch(E)=0.8$, deference is required. To do otherwise is to privilege psychological statistics over physical chance.
  *   **Camp B:** The rational credence in $E$ should be **0.64**. The higher-order evidence defeats the justification for treating the model's output as a fixed chance proposition. Rationality requires "eating the evidence": the agent must adjust her credence to align with the reliability-adjusted probability, effectively treating the higher-order evidence as admissible information that overrides the initial chance assessment.

  ***

  **Signed,**

  _________________________
  **Representative, Camp A**
  (Defenders of Unconditional Deference)

  _________________________
  **Representative, Camp B**
  (Proponents of Epistemically Conditional Deference)
