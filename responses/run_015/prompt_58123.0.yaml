      *   *Perceptualism:* Emotions are perceptions of value (quasi-perceptual). (e.g., Tappolet, Döring). Core strength: Passivity (like perception), explains recalcitrance better than judgementalism. Weakness: Still requires some cognitive architecture, analogies to sense perception can be strained.
      *   *Feeling Theory/Somaticism:* Emotions are feelings of bodily change. (e.g., James, Prinz). Core strength: Phenomenology, distinguishes emotions from cold cognitions. Weakness: Objectless anxiety, lack of specificity in bodily states (Schachter-Singer).

  3.  **Evaluate the User's Hypothesis:**
      *   The user suggests it's a "different paradigms under a single label" issue (Wittgensteinian family resemblance or prototype theory applied to theories).
      *   *Assessment:* This is a very astute observation. It aligns with the "polyvagal" or "constructionist" critiques in psychology (e.g., Lisa Feldman Barrett) and philosophical discussions about the "natural kind" status of emotion.
      *   *Nuance:* It's not *just* verbal. There are substantive claims about the *nature* of the mental state. But the disagreement often stems from prioritizing different *functions* or *instances* of what we call "emotion."

  4.  **Diagnose the Structure of the Disagreement:**
      *   **Level 1: Metaphysical/Constitutive.** What *makes* an emotion an emotion? Is it the cognitive content, the phenomenological feel, or the functional role?
      *   **Level 2: Methodological.** Where do we look for evidence? Introspection (phenomenology), conceptual analysis (rationality), or empirical science (physiology)?
