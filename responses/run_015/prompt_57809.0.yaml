answer: |-
  It is entirely understandable that you are finding the particularism/generalism debate knotty; frankly, if you weren't confused by it, I'd worry you weren't paying attention. The tension you are feeling—between wanting a systematic account and finding that your intuitions shift with the contextual details—is precisely the engine of that debate. Dancy would say your shifting intuitions prove there are no principles; a Rule Utilitarian would say your principles are just too crude.

  You have asked for a single candidate principle that captures your six settled verdicts without merely restating them, an application of that principle to your pending case (the undergraduates), and a fresh test case. I shall attempt to provide a principle that respects the nuance in your intuitions while remaining general enough to guide action.

  ### The Candidate Principle: The Principle of Active Relational Claims

  Here is the best generalist candidate I can construct to fit your data:

  > **"An agent is permitted to override a general rule or casual commitment only if doing so is necessary to address an immediate, specific need of a particular individual, provided this does not violate an active expectation of trust or exclude others from a resource to which they have an active claim."**

  This principle attempts to codify the distinction you seem to be drawing between *diffuse benefits* (a better talk, personal convenience) and *specific claims* (a fallen person, a flatmate's trust, a colleague's access to a pan). It prioritises immediate, interpersonal needs over institutional or aggregate utility, but protects established trust and active resource claims.

  ### Mapping Your Verdicts to the Principle

  Let us see how this principle handles your six cases, and where it forces a confrontation.

  1.  **The Fallen Person (Coffee Promise):**
      *   *Verdict:* Permissible to break promise.
      *   *Principle:* The fallen person has an **immediate, specific need**. The coffee promise is a **casual commitment**. The need trumps the commitment.
      *   *Fit:* Perfect.

  2.  **The Projector (Rehearsal):**
      *   *Verdict:* Impermissible to break promise.
      *   *Principle:* Returning the projector is an **active expectation of trust** (institutional). The benefit of rehearsing is **diffuse utility** (better talk for many), not an immediate specific need.
      *   *Fit:* Perfect. This explains why the 'greater good' of the talk doesn't override the specific duty to the department.

  3.  **The Cold Caller:**
      *   *Verdict:* Permissible to fib.
      *   *Principle:* The caller has **no active expectation of trust** (it is an unsolicited intrusion). There is no **active claim** on your time.
      *   *Fit:* Perfect.

  4.  **The Flatmate (Electricity Bill):**
      *   *Verdict:* Impermissible to lie.
      *   *Principle:* A flatmate has an **active expectation of trust** regarding shared finances. The lie is for **personal convenience** (avoiding awkwardness), not immediate need.
      *   *Fit:* Perfect.

  5.  **The Library Book:**
      *   *Verdict:* Permissible to keep overdue.
      *   *Principle:* The rule (due date) is administrative. Since **nobody else has requested it**, no one has an **active claim** to the resource.
      *   *Fit:* Good, though this relies on the empirical fact that no one else wants it.

  6.  **The Kitchen Pan:**
      *   *Verdict:* Impermissible to stash.
      *   *Principle:* This **excludes others from a resource** (the pan) to which they have an **active claim** (shared kitchen rights).
      *   *Fit:* Perfect. Distinguishes the pan from the library book based on rivalrousness and active access.

  ### The Cost: Where You Might Need to Revise

  To be honest, no principle captures intuitions without friction. The tension in this principle lies in the definition of "active claim" and "immediate need."

  You may find you need to revise your verdict on **Case 5 (The Library Book)**. A strict generalist might argue that library systems rely on a constitutive rule of return dates to function. By keeping it overdue, you are undermining the **expectation of trust** in the system, even if no specific individual is currently waiting. If you accept the principle above, you must accept that the permissibility hinges entirely on the *empirical fact* of no one else wanting it. If you later find out someone did want it, your action becomes retroactively impermissible. A particularist would say the moral status changes; this principle says the *condition* was not met. You must be comfortable with that contingency.

  ### The Pending Case: Lying to Undergraduates

  Now, to the case you are currently undecided on: *Is it okay to tell undergrads the seminar was cancelled due to illness when you actually needed time to finish a draft?*

  **The Principle's Prediction:** **Impermissible.**

  **Reasoning:**
  1.  **Expectation of Trust:** Undergraduates have a specific, institutional **expectation of trust** regarding scheduled contact hours. They have arranged their time around this.
  2.  **Nature of the Benefit:** Finishing your draft is a professional benefit to you (and perhaps a diffuse future benefit to the field), but it does not constitute an **immediate, specific need** of a particular individual (unlike the fallen person).
  3.  **Comparison:** This is structurally identical to the **Projector Case**. In that case, you prioritised the institutional promise over the professional gain of a better talk. Here, the principle demands you prioritise the scheduled commitment over the professional gain of a finished draft.

  If you follow this principle, you must go in and teach the seminar, perhaps admitting you are under pressure, rather than fabricating an illness. To lie would be to treat the students' time as a resource you can exclude them from for your own convenience, which violates the clause on active claims.

  ### A Fresh Test Case

  To further stress-test this principle (and your adherence to it), consider this new scenario:

  **The Reference Letter Case:**
  You promised a student you would write a reference letter for their PhD application by Friday morning. On Thursday evening, a senior colleague asks you to urgently review a paper for a top journal by Friday noon. Doing so would significantly boost your standing in the field and help the colleague's editorial workload, but it means you cannot write the reference. You know the student has other references, but yours was the strongest.

  **Application of the Principle:**
  *   **The Promise:** You have an **active expectation of trust** with the student.
  *   **The Conflict:** The journal review offers **diffuse professional utility** (your standing, the journal's speed). It is not an **immediate specific need** of a particular individual (the colleague is not in 'need' in the same way the fallen person was).
  *   **Prediction:** You must write the reference. The specific claim of the student trumps the professional utility of the review.

  **The Challenge:**
  Many academics feel the pressure to prioritise the 'greater good' of the discipline (the journal review) over the 'local' good of one student. If your intuition here is that you *should* review the paper because it serves the wider community, then the **Principle of Active Relational Claims** fails to capture your morality, and you may be leaning towards a form of Rule Utilitarianism after all. If your intuition is that you must honour the student, then the principle holds.

  ### A Final Thought on the Debate

  You asked whether any principle works without restating the cases. My honest assessment is that the principle above works only because it builds 'context' into the conditions (e.g., 'active claim', 'immediate need'). A hardline particularist will argue that 'active claim' is just a label for "the reason that matters here," and its weight cannot be codified.

  However, as a generalist heuristic, this principle saves you from having to calculate utility in every instance. It tells you to look for the *specific person* who has a claim on you. If there is one (the fallen person, the flatmate, the student), they win. If there isn't (the cold caller, the library book with no queue), you have latitude.

  If you find yourself wanting to lie to the undergrads to finish that draft, do not be too alarmed. It may simply mean that in the hierarchy of your own moral reasoning, 'professional responsibility to the field' sometimes outweighs 'institutional punctuality,' which would require you to tweak the principle to allow for 'significant professional obligation' as a trump card. But be warned: once you add that clause, the Projector Case might start looking permissible too, and your system could begin to unravel.

  Good luck with the seminar; it sounds like a fruitful term.
