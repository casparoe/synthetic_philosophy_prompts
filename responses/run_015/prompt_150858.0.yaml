prompt: |-
  okay so i was talking with my study group about that article on moral responsibility and one guy summarized Galen Strawson's Basic Argument like this: Strawson thinks true moral responsability is impossible because to be genuinely blameworthy you have to be the ultimate cause of your actions, but nobody is causa sui. If determinism is true then your actions come from your past and genes, but even if determinism is false and there's quantum randomness in your brain, that just replaces causation with luck, so indeterminism doesn't save responsibility either. Therefore no one ever deserves punishment or praise in the basic sense, though he allows we might still have social reasons to reward good behavior.

  My study partner then said this proves we should drop all legal accountability since courts assume people are the authors of their crimes. But something feels off about this summary, like it's treating Strawson's point as just "determinism is bad for free will" when I think his argument is supposed to work either way. Also I'm not sure if Strawson really thinks legal systems are totally undermined or if he's just attacking a specific notion of desert. Can you audit this summary? Go through what's actually in the Basic Argument, what's been flattened or misread, and whether the jump to abolishing legal accountability follows. And if there's a case where someone genuinely reshaped their own character through effort -- like a recovering addict who rebuilt their personality -- does Strawson's regress still bite, or is that a counterexample?
