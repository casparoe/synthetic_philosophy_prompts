      *   *Claim 3:* "Therefore no one ever deserves punishment or praise in the basic sense, though he allows we might still have social reasons to reward good behavior." -> **Accurate.** Strawson distinguishes between basic desert and consequentialist/pragmatic reasons for treatment.
