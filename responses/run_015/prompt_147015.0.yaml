      *   *Indexicality:* This is crucial. "I" is an indexical. It picks out the speaker. If the speaker is a network, what picks out the network? If I say "I am in pain," and Module A detects pain but Module B doesn't, who speaks? The synchronization implies a global state, but physical instantiation is local.
