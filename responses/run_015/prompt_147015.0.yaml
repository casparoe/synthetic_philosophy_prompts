      *   **Conclusion:** Summarize. The shift from "I am here" to "I am *this pattern*." The decoupling of selfhood from locality.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with Dennett's "Where Am I?" but pivot to the "Hamlet-Cloud." The prompt asks about the *logic of self-location*.
      *   *Anchors:*
          *   *Biological:* If I am my animal, and the animal is dead/scattered, I am dead. But Hamlet says he's alive. So Biological Animalism fails or must redefine "organism."
          *   *Functional:* This is the strongest candidate. Patternism. But does pattern = person?
