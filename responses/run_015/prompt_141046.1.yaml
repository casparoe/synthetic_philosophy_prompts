  Your impasse stems from a category error that conflates the discounting of welfare with the discounting of resources, and resolving it requires recognizing that the two options you describe exhaust the logical space only if you assume the discount rate is an ethical weight applied directly to units of well-being. The established way of carving this distinction, which avoids both awkward implications, is to understand that in serious long-run cost-benefit analysis the rate attaches neither to the moral worth of persons nor to the intrinsic value of experiences, but rather to flows of consumption at calendar dates. This distinction is formalized in the Ramsey rule, which decomposes the social discount rate into two components: a pure rate of time preference representing ethical impatience, and a term reflecting the expected growth in consumption multiplied by the elasticity of marginal utility. When your interviewees insist that a person's suffering cannot count for less merely because they are born later, they are correctly demanding that the pure rate of time preference be set to zero, ensuring temporal neutrality across generations and within a life. However, when they accept that a positive discount rate must appear in the analysis, they are referring to the second component, which discounts future consumption because future people are expected to be richer, making an additional dollar less valuable to them in terms of welfare gained.

  This resolution clarifies why the rate attaches to calendar dates without violating within-life neutrality. If the discount rate applies to consumption flows at specific dates rather than to utility itself, then a bad year at eighty is not weighed less than a bad year at thirty in terms of suffering; rather, the cost to alleviate that suffering is discounted because the resources required could have been invested to grow over the intervening decades. Similarly, this avoids the inequity between simultaneous cohorts because the weighting depends on the consumption level at the date of experience, not the birth year of the experiencer. Two people alive in 2050 are treated equally regardless of when they were born, provided their consumption levels are identical, because the discount factor is a function of the calendar date and aggregate wealth, not lineage. The economist who described the rate as a price rather than a judgment was pointing to this opportunity cost of capital or the diminishing marginal utility of consumption, implying that the rate reflects the technical trade-off in transforming present resources into future welfare rather than a moral depreciation of future lives. I am highly confident in this exposition of the standard economic framework and its philosophical underpinnings regarding intergenerational equity. The single claim I would least like a hostile referee to challenge is the assertion that distinguishing between discounting consumption and discounting welfare fully resolves the ethical tension, as some philosophers argue that if welfare is dependent on consumption, discounting the latter inevitably functions as a proxy for discounting the former, thereby reintroducing the very bias the distinction seeks to avoid.
