answer: |-
  Here is a concrete case designed to isolate the specific tension you described: the "Many Small Harms" problem, where Contractualism permits a massive aggregate burden because no single individual's share crosses the threshold of reasonable rejection.

  ### The Scenario: The Grid Resilience Mandate

  **Context:** A federal agency (e.g., FERC) is proposing a mandatory upgrade to residential smart-meters to prevent a cascading national grid failure during extreme solar storm events.

  **The Population:** 120 million households.

  **Option A (The Mandate):** Every household must install a hardened surge protector.
  **Option B (Status Quo):** No installation. The grid remains vulnerable.

  **The Numbers (Agency Style):**
  *   **Benefit of Option A:** Prevents a catastrophic grid collapse estimated to cause **$50 Trillion** in economic loss and widespread morbidity (health failures due to lack of power) over a decade. This benefit is distributed across the whole population, but the *avoided harm* is conceptually treated as a collective good.
  *   **Cost of Option A (Base Case):** **$2,000** per household (equipment + installation).
      *   **Total Aggregate Cost:** $240 Billion.
      *   **Individual Burden:** Equivalent to a major appliance purchase; noticeable but not life-altering for the median household.
  *   **Cost of Option A (Dialled Case):** **$60,000** per household.
      *   **Total Aggregate Cost:** $7.2 Trillion.
      *   **Individual Burden:** Equivalent to a down payment on a home; life-altering for many, financially crippling for the poor.

  ---

  ### 1. The Contractualist Machinery (Base Case: $2,000/household)

  **The Principle:** *"Households are required to pay $2,000 to install surge protectors to prevent national grid collapse."*

  Scanlonian contractualism evaluates this principle by asking: **Can any individual reasonably reject this principle?** We do not sum the complaints. We compare the strongest individual complaint *against* the principle to the strongest individual complaint *for* the principle (i.e., against the status quo).

  *   **The Payer's Complaint:** A representative household says, "This costs me $2,000. That is a burden."
      *   *Scanlonian Test:* Is $2,000 a "grave" burden? In the context of a decade-long economic horizon, this is comparable to buying a refrigerator or a car repair. It is significant, but it does not ruin a life, threaten basic security, or impose a sacrifice that no one could be expected to make.
      *   *Verdict:* This complaint is **not strong enough** to be "reasonable rejection." It falls below the threshold of veto power.
  *   **The Beneficiary's Complaint:** A representative citizen says, "If we don't do this, the grid collapses, causing $50T in loss and health crises."
      *   *Scanlonian Test:* The harm of grid collapse (loss of healthcare, heating, economic livelihood) is severe.
      *   *Verdict:* This complaint **is strong enough** to reject the Status Quo.

  **Contractualist Conclusion:** Since the Payer's individual burden is too small to reasonably reject the principle, and the Beneficiary's burden is large enough to reject the Status Quo, the principle is **Accepted**.

  ---

  ### 2. The Utilitarian Machinery (Base Case: $2,000/household)

  **The Calculation:** Classical utilitarianism aggregates all costs and benefits to find the net utility.

  *   **Total Cost:** 120 million households × $2,000 = **$240 Billion**.
  *   **Total Benefit:** Avoided economic/health loss = **$50 Trillion**.
  *   **Net Utility:** $50,000 Billion - $240 Billion = **Positive $49.76 Trillion**.

  **Utilitarian Conclusion:** The total benefit vastly outweighs the total cost. The policy is **Accepted**.

  ---

  ### 3. Alignment and Structural Feature

  **The Agreement:** Both theories mandate the policy.
  **The Divergent Reasoning:**
  *   **The Utilitarian** accepts it because the *sum* of the benefits ($50T) dwarfs the *sum* of the costs ($240B). The total magnitude is what matters.
  *   **The Contractualist** accepts it because the *individual slice* of the cost ($2,000) is too weak to veto the principle. The total magnitude ($240B) is morally invisible to the contractualist; only the per-person justification matters.

  **The Structural Feature Keeping Them Aligned:**
  The feature doing the work is the **low per-person cost relative to the individual rejection threshold.**
  As long as the individual cost remains "trivial" or "moderate" (below the veto threshold), the Contractualist ignores the aggregate sum. Because the Utilitarian also sees the aggregate sum as efficient in this base case, they land on the same verdict. This creates the illusion of harmony, masking the fact that the Contractualist is *not* counting the $240 Billion total cost at all.

  ---

  ### 4. Turning the Dial (The Divergence)

  Now we change exactly one variable: **Raise the per-person cost to $60,000.** The population (120m) and the Benefit ($50T) remain fixed.

  **The New Math:**
  *   **Total Cost:** 120 million × $60,000 = **$7.2 Trillion**.
  *   **Total Benefit:** **$50 Trillion**.
  *   **Individual Cost:** **$60,000**.

  **The Utilitarian Verdict:**
  *   $50T (Benefit) > $7.2T (Cost).
  *   **Result:** **ACCEPT.** The total welfare is still maximized. The fact that the cost is concentrated heavily on individuals doesn't matter, only the sum does.

  **The Contractualist Verdict:**
  *   **The Payer's Complaint:** "This costs me $60,000."
  *   *Scanlonian Test:* For a significant portion of the population (the bottom 50% of wealth), $60,000 represents a catastrophic loss. It could mean foreclosure, inability to pay for education, or loss of life savings. Scanlon emphasizes that we must consider the situation of those for whom the burden is hardest.
  *   *Verdict:* This burden is **Reasonably Rejectable**. An individual cannot be expected to sacrifice their financial security to this degree, even for a collective good. The individual veto is triggered.
  *   **Result:** **REJECT.**

  **Why the Flip?**
  The Contractualist flips because the **individual burden crossed the threshold of reasonable rejection.** The Utilitarian stays put because the **aggregate benefit still exceeds the aggregate cost.** This isolates the exact feature you were stuck on: Contractualism will sacrifice the total good ($42.8T net gain) to protect the individual from a burden that *they* can reasonably say "no" to.

  ---

  ### 5. The Defense and Its Limits

  **The Objection:**
  "In your base case ($2,000/household), Contractualism blessed a policy that extracted $240 Billion from the population. If we had 1 billion people paying $2,000, that's $2 Trillion of total harm. You are allowing 'death by a thousand cuts' simply because no single cut is deep enough to bleed. This seems to ignore the moral significance of total suffering."

  **The Contractualist Defense:**
  A defender of Scanlon would argue that this objection begs the question by assuming morality is about *maximizing outcomes*. They would say:
  > "Morality is not about accounting; it is about justification. To impose a burden on me, you must justify it *to me*. If the burden I bear is small enough that I cannot reasonably say 'no,' then you have justified it. The fact that you are doing this to many others is irrelevant to *my* standing. If I cannot complain, my consent is secured. To aggregate the complaints of others against me is to use me as a means to absorb the sum of their grievances, which violates the separateness of persons."

  **Does the Defense Hold?**
  *   **Where it holds:** It successfully protects individuals from being sacrificed for the "greater good" in cases where their individual burden would be crushing (as seen in the Dialled Case). It preserves individual integrity.
  *   **Where it concedes:** It concedes that **total welfare has no intrinsic moral weight.** If 100 million people suffer a "non-rejectable" migraine for a year to save one person from death, Contractualism struggles to forbid it (unless the migraine itself is deemed rejectable).
  *   **The Verdict:** The defense holds *if* you accept the premise that morality is strictly about mutual justification between individuals. However, if you believe that a world with $240 Billion in unnecessary waste/suffering is objectively worse than one without it, regardless of distribution, the defense feels like a concession. It admits that Contractualism is blind to "large harms" so long as they are sufficiently fragmented. This is the price of the theory's commitment to the "individual veto."
