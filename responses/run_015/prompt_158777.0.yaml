answer: |-
  Dear Alex,

  I am writing to walk you through the line of questioning I am developing for Dr. Haddad next week, as I want to ensure I am a step ahead of her rather than scrambling when she deploys her standard lines about divine decree and interventionism. I plan to start by asking her to clarify precisely what makes something an intervention rather than another event God produces, to which she will likely reply that an intervention is exogenous to the natural system and not determined by prior created causes. The follow-up I have ready for that answer is to ask whether God's tracking of interventions puts causal relations back in at the divine level, since a reliable connection between intervention and divine response looks suspiciously like the causation she denies to creatures. Once we have established the mechanics of the view, I want to escalate the pressure on her comparison to Hume, so my third question will simply ask why her appeal to divine decree is superior to the Humean claim that regularities are brute, expecting her to reiterate her stock line that Hume left the regularity unexplained and she does not. I will then immediately press her in question four on what work the decree does that a brute primitive nomic necessity would not, anticipating that she will argue the decree grounds the necessity in a rational agent rather than a blind fact. This leads directly into the fifth question, which asks whether explaining every regularity by one inscrutable will is an explanation at all or just a uniformity claim with a theistic footnote, a point where I expect her to insist on the unifying power of theism but where I hope to expose the explanatory hollow ness of the move.

  Moving from the metaphysics of laws to the direction of causation, my sixth question will address the problem of direction and asymmetry for her interventionist borrowing, noting that if the asymmetry between match and burning is itself just a feature of the pattern of divine responses then occasionalism seems to be doing no work in the account, and if it isn't, I do not know what it is. She will likely respond that the asymmetry is fixed by God's habitual ordering of events, which invites my follow-up asking whether this habit is itself contingent or necessary, since if it is contingent we are back to brute facts and if it is necessary we have reintroduced nomic necessity. The seventh question will tackle the tension with divine simplicity and timelessness, pointing out that a God who has no temporal parts and no successive states seems ill-suited to responding to a counterfactual intervention, to which she will probably appeal to a Boethian eternity where all counterfactuals are known simultaneously. My follow-up there will be to ask whether this timeless knowledge collapses the distinction between actual and counterfactual interventions, potentially undermining the interventionist framework she relies on. For the eighth question, I plan to ask about the status of miracles, which on her view can only be relative to a habit, and whether that leaves the category epistemic in a way that undercuts any apologetic use of it, expecting her to argue that miracles are ontologically distinct deviations from customary divine action. I will follow up by asking if a custom-bound God can truly act freely in a miracle without contradicting the very decree that establishes the habit, pressing the coherence of her occasionalist miracle account.

  Nearing the end of the interview, the ninth question will target moral responsibility, where she defends something she calls authorship without production, on which responsibility requires not being the cause of one's act but having an act that fits one's created will, so I will press whether that is just compatibilism with the causal machinery deleted. I intend to put a concrete case to her in the follow-up, describing two agents whose created wills and histories are alike in every respect and who nonetheless act differently, asking where the desert goes if God is the sole producer of both acts. Finally, I will close with one question about what could count as evidence against the view, asking what we would have to find in fundamental physics, or in scientific practice, that would make her give it up, to which she may claim the view is metaphysically insulated from empirical refutation. My final follow-up will be to ask whether a view that is compatible with any possible physical theory really explains anything about this specific physical world, leaving her with the challenge of distinguishing her metaphysics from a vacuous schema. I think this sequence covers the necessary pressures while maintaining a logical flow from the mechanics of causation to the theological and ethical implications, and I would appreciate any thoughts you have on whether I am being too aggressive in the Hume section.

  Best,

  [Your Name]
