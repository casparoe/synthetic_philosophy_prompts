          *   *Exhibition/Catalog:* Organizes materials thematically (Labyrinth, Mirror, etc.). Freely reproduces late revisions in thematic print editions. Displays drafts from 1941 and 1960 as coexisting variations on a timeless structure.
      *   **Task:** Reconstruct the implicit philosophical theory regarding time, textual identity, and ontology.
      *   **Specific Questions to Answer:**
          *   Does it require linear, cyclical/eternalist, or hybrid time?
          *   Distinguish presuppositions from accommodations.
          *   Are preservation and exhibition arms consistent?
          *   Which rival theories (presentism, growing-block, eternalism) are excluded?
          *   Is the policy coherent?
