answer: |-
  The archival policy described manifests a profound metaphysical schism, operating under a **Dualist Ontology of the Text** that separates the *material substrate* from the *semantic content*. This reconstruction posits that the archive does not hold a single, unified theory of time, but rather enforces two incompatible ontologies depending on the administrative function being performed. The preservation arm presupposes a **Growing Block Universe** (or a robust Moving Spotlight theory), wherein the past is fixed, real, and ontologically distinct from the present, and the act of inscription is a singular, unrepeatable event. Conversely, the exhibition arm presupposes **Four-Dimensional Eternalism**, treating the text as a spacetime worm where all temporal slices (1941, 1960) are equally real and accessible simultaneously for thematic comparison.

  The preservation protocol's refusal to digitally reproduce late revisions is the critical evidence for this reconstruction. By claiming that copying "destroys the singular temporal moment," the curators attribute metaphysical weight to the *haecceity* (this-ness) of the ink's contact with the paper at a specific coordinate in linear time. This strictly presupposes that temporal location is an intrinsic property of the text's identity, not merely an extrinsic label. It excludes **Strict Presentism**, which would render the 1941 drafts unreal in the present moment, and it excludes **Strict Physicalism**, which would view the manuscript as merely aging cellulose and ink, replicable without ontological loss via high-fidelity scanning. The policy accommodates the exhibition's thematic approach only by treating the *meaning* as abstractable from the *object*, a move that philosophically undermines the preservation deed's insistence on the page as an "unrecoverable point."

  Consequently, the policy is philosophically **incoherent**. It asserts that the manuscript page is simultaneously a unique, irreversible historical event (Preservation/Deed) and a timeless variation on an eternal form (Exhibition/Catalog). While institutionally pragmatic—monetizing the "aura" of the original while democratizing the content—metaphysically, it asserts $P$ and $\neg P$ regarding the nature of the text's temporal existence. The preservation arm excludes the Borges-inspired view that time is a fiction; the exhibition arm excludes the archival view that chronology is the primary determinant of value.

  If the archive were to adopt **Borges's own position** (that linear time is a fiction and all moments are simultaneous), the institutional rules would require a radical dismantling of the preservation hierarchy. Chronological finding aids would be abolished in favor of associative or thematic networks; digital reproduction would be unrestricted because the "singular moment" is an illusion, making the copy ontologically equal to the original; and the legal deed would be rewritten to define the collection as a single, simultaneous work rather than a sequence of events. Conversely, if the archive adopted a **rigorous physicalist view** (granting manuscripts no special ontological status beyond material date), the ban on digital reproduction would be lifted immediately, as information transfer does not destroy matter; however, the chronological arrangement would remain strictly as a provenance record, stripped of metaphysical significance, and the exhibition would likely cease to present drafts as "coexisting variations," instead framing them strictly as causal predecessors in a material history.

