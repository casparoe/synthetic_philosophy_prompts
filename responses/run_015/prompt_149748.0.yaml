      *   **Constraint:** Take a definite position on the best reconstruction (do not just list options).
      *   **Output Format:** Essay/Analysis followed by a specific JSON summary.

  2.  **Deconstruct the Archive's Practice:**
      *   *Preservation:* Strictly Linear/Irreversible. "Singular temporal moment." "Unrecoverable point." This sounds like Presentism or the Growing Block Universe (where the past is fixed and real, but the focus is on the specific moment of creation). It treats the *act* of writing as an ontological event that cannot be replicated.
      *   *Exhibition:* Atemporal/Eternalist/Thematic. 1941 and 1960 coexist. Textual identity is defined by theme/structure, not date. This aligns with Borges's own metaphysics (The Garden of Forking Paths, The New Refutation of Time).
      *   *Conflict:* The legal deed binds the physical object to linear history, while the public face binds the *meaning* to timeless structure.
      *   *Reproduction Rule:* "Reject digital reproduction of late revisions on the ground that copying destroys the singular temporal moment." This is a crucial metaphysical claim. It implies the *aura* (Benjamin) or the *haecceity* (this-ness) is tied to the specific spacetime coordinate of the ink on paper.

  3.  **Evaluate Philosophical Commitments:**
      *   *Temporal Ontology:* The preservation arm presupposes a **Growing Block** or **Moving Spotlight** view (linear, irreversible, past is fixed). The exhibition arm presupposes **Four-Dimensional Eternalism** (all times exist simultaneously, allowing thematic grouping across decades).
      *   *Textual Identity:* Preservation sees identity as *genetic* (tied to the process). Exhibition sees identity as *structural/archetypal* (tied to the finished concept).
      *   *Consistency:* They are *incoherent* if taken as a unified metaphysical stance. However, institutionally, they might be "pragmatically coherent" (preservation protects value, exhibition generates interest). But the prompt asks for philosophical coherence. Philosophically, you cannot claim a moment is both "unrecoverable/unique" (Preservation) and "simultaneously coexisting with other moments" (Exhibition) without a dualist ontology.
      *   *Excluded Theories:*
          *   *Strict Presentism:* Excluded by Exhibition (which treats past drafts as currently accessible/valid in a timeless way).
          *   *Strict Physicalism:* Excluded by Preservation (which assigns metaphysical weight to the "moment of inscription" beyond just material decay).
          *   *Borges's Idealism:* Excluded by Preservation (which enforces linear time despite Borges's writings).

  4.  **Formulate the Definite Position:**
      *   *Thesis:* The archive operates on a **Dualist Ontology of the Text**. It separates the *Material Substrate* (governed by Linear/Growing Block time) from the *Semantic Content* (governed by Eternalist/Platonic time).
      *   *Why?* This explains the contradiction. The physical page is a historical relic (linear), but the *work* is an ideal form (eternal). The rejection of digital copying for late revisions is the key: it admits the digital copy captures the *content* (eternal) but fails to capture the *event* (linear).
      *   *Coherence:* It is philosophically **incoherent** because it asserts contradictory properties about the same object (the manuscript page) depending on the administrative function. It claims the page *is* a point in linear history (Deed) and *is* a variation on a timeless structure (Gallery).
      *   *Borges's View:* If they adopted Borges's view (Time is a fiction), they would stop dating folders, allow free mixing of drafts, and treat digital copies as ontologically equal to originals (since the "moment" is an illusion).
      *   *Physicalist View:* If they adopted strict physicalism, they would stop claiming copying destroys a "temporal moment." They would treat the manuscript as just aging paper. Digital copies would be fine; the original is just older matter.

  5.  **Drafting the Analysis (Iterative refinement):**
