prompt: |-
  In my philosophy of politics reading group, two members have been deadlocked over the democratic boundary problem, and I am reporting their exchange as a bystander without taking sides. I want a point-by-point adjudication of the arguments as they actually unfolded, plus a diagnosis of where they are talking past each other and what both are missing.

  One member, Mara, began by defending an all-affected-interests principle: anyone whose important interests are significantly shaped by a collective decision should have democratic standing with respect to it. The other, Leo, objected that this renders the demos unworkably expansive—if a nation sets a carbon tax that influences global climate patterns, does every affected person on Earth acquire a vote? Mara conceded that binary affectedness fails here, but proposed replacing it with a graded criterion she called sustained structural exposure: you belong to the demos for a given decision domain only if you live within the institutional reach of its implementation over time, not merely if you suffer diffuse ripple effects. Leo granted that this blocks over-inclusion, but charged that it smuggles in the very boundary it claims to justify—“institutional reach” is delimited by jurisdictional borders, and those borders presuppose a prior demos that authorized them, so the criterion is circular. Mara replied that jurisdictional reach can be defined functionally—say, by the enforcement capacity of a watershed authority or a labor-regulatory body—without requiring prior democratic authorization of the border itself, so no vicious circularity arises. Leo then pivoted to an all-subjected principle: democratic membership should track coercive legal subjection, which yields determinate boundaries (those bound by enforceable law) and avoids arbitrary grading altogether. Mara countered that this excludes precisely the groups most in need of democratic protection—future generations, undocumented residents subject to severe informal coercion, and cross-border communities affected by upstream extraction—while including transient visitors who happen to be present when a law is enforced. Leo responded that these are manageable supplements: you retain the core subjection principle for membership and add stakeholder mechanisms for affected non-members, without dissolving democratic accountability into cosmopolitan vagueness. At this point the argument stalled. Mara accused Leo of treating democracy as a membership club for the legally included rather than as a check on power over lives; Leo accused Mara of dissolving decision procedures into an unbounded affectedness that makes collective choice impossible. They seem partly right, but I cannot tell where the clash is substantive versus terminological.

  Please adjudicate specifically: Is Mara’s sustained structural exposure criterion genuinely non-circular, or does Leo’s circularity charge hold once we distinguish functional enforcement reach from democratically authorized borders? Is Leo correct that Mara’s view risks dissolving accountability, and is Mara correct that Leo’s view arbitrarily excludes vulnerable non-subjected groups? What distinction—perhaps between constitutive and regulative boundaries, or between domain-specific and domain-transcendent membership—might repair the disagreement? Give a verdict on which precise claims stand, which collapse, and what each party is failing to see that would allow them to concede ground without abandoning their core concern.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of politics reading group.
      *   **Participants:** Mara (All-Affected Interests, modified to Sustained Structural Exposure) vs. Leo (All-Subjected Principle).
      *   **Task:** Point-by-point adjudication of arguments, diagnosis of talking past each other, identification of missing elements, and a verdict on specific claims.
      *   **Constraint:** Do not take sides (bystander report), but provide critical analysis.
      *   **Key Issues:** Circularity of "institutional reach," risk of unboundedness vs. exclusion of vulnerable groups, distinction between types of boundaries/membership.

  2.  **Deconstruct the Arguments:**

      *   **Mara's Position:**
          *   *Core Principle:* All-Affected Interests (AAI).
          *   *Problem:* Over-inclusiveness (global carbon tax example).
          *   *Modification:* "Sustained Structural Exposure" (SSE). Membership based on living within the *institutional reach* of implementation over time.
          *   *Defense against Circularity:* Institutional reach is *functional* (enforcement capacity, e.g., watershed authority), not necessarily pre-authorized democratic borders.
          *   *Critique of Leo:* Excludes vulnerable non-subjected groups (future gens, undocumented, cross-border communities). Treats democracy as a club, not a check on power.

      *   **Leo's Position:**
          *   *Core Principle:* All-Subjected Principle (ASP).
          *   *Critique of Mara (AAI):* Unworkably expansive (global vote).
          *   *Critique of Mara (SSE):* Circular. "Institutional reach" presupposes jurisdictional borders, which presuppose a prior demos.
          *   *Defense of ASP:* Tracks coercive legal subjection. Determinate boundaries.
          *   *Response to Exclusion Critique:* Add stakeholder mechanisms for non-members (future gens, etc.) without granting full membership.
          *   *Critique of Mara:* Dissolves decision procedures into cosmopolitan vagueness, killing accountability.

  3.  **Adjudicate Specific Claims (Point-by-Point):**

      *   *Claim 1: Circularity of SSE.*
          *   Leo says SSE is circular because "institutional reach" implies borders defined by a prior demos.
          *   Mara says reach is functional (e.g., how far a watershed authority can actually enforce rules).
          *   *Analysis:* Leo is partially right but too strong. If "institutional reach" means "where the state *says* it applies," it's circular. If it means "where the state *can physically/causally* enforce," it's empirical, not normative. However, defining the *authority* itself usually implies a political decision. But functional jurisdictions (like river basins) *can* exist pre-democratically.
          *   *Verdict:* Leo's circularity charge holds for *state* jurisdictions but fails for *functional* jurisdictions. Mara needs to clarify she means functional power, not legal jurisdiction.

      *   *Claim 2: Unboundedness vs. Accountability.*
          *   Leo says Mara's view makes collective choice impossible (too many voters).
          *   Mara says Leo's view makes democracy a membership club ignoring power impacts.
          *   *Analysis:* Leo is right that pure AAI creates instability (the "boundary problem" recurs at every decision). Mara's SSE mitigates this but still faces the "degree of affectedness" problem. Leo is right about accountability requiring a stable *demos*. Mara is right that ASP ignores externalities.
          *   *Verdict:* Leo is correct on the *procedural* risk; Mara is correct on the *normative* risk.

      *   *Claim 3: Exclusion of Vulnerable Groups.*
          *   Mara says ASP excludes future gens, undocumented, cross-border neighbors.
          *   Leo says use stakeholder mechanisms (trustees, advocacy) instead of votes.
          *   *Analysis:* Mara is right that ASP excludes them from *authorship*. Leo is right that giving them votes might paralyze the system. The "stakeholder mechanism" is a compromise but admits the principle isn't sufficient on its own.
          *   *Verdict:* Mara is correct that they are excluded from *membership*. Leo is correct that full membership might be impractical, but his "supplement" admits the core principle is incomplete.

  4.  **Diagnose the "Talking Past Each Other":**
      *   **Concept of "Boundary":** Leo thinks of boundaries as *constitutive* (who constitutes the 'We'). Mara thinks of boundaries as *regulative* (where does power stop?).
      *   **Concept of "Democracy":** Leo sees it as a *decision procedure* (requires closure). Mara sees it as a *legitimacy condition* (requires justification to those impacted).
      *   **Temporality:** Leo is synchronic (who is here now under law). Mara is diachronic/structural (who is exposed over time).

  5.  **Identify Missing Distinctions/Solutions:**
      *   *Constitutive vs. Regulative Boundaries:* Leo needs a constitutive boundary for the polity to exist. Mara needs a regulative boundary for legitimacy of specific acts.
      *   *Membership vs. Voice:* Distinguish between full voting rights (membership) and contestatory voice (influence).
      *   *Domain-Specific Demos:* The "all-affected" principle works better if the *demos* changes per issue (functional democracy), whereas Leo assumes a fixed territorial state.

  6.  **Drafting the Adjudication (Iterative refinement):**

      *   *Introduction:* Set the stage, acknowledge the classic nature of the debate (Whelan, Goodin, López-Guerra, etc., though I won't name-drop unless necessary for clarity, better to stick to the prompt's internal logic).
      *   *Section 1: The Circularity Charge (SSE).* Analyze the functional vs. legal distinction. Mara wins on functional, Leo wins on legal.
      *   *Section 2: Accountability vs. Exclusion.* Leo wins on procedural stability. Mara wins on moral inclusion. Leo's "supplement" is an admission of defeat for the *sufficiency* of ASP.
      *   *Section 3: Diagnosis of Disagreement.* Identify the Constitutive/Regulative split. Identify the Decision-Procedural vs. Justice-Oriented split.
      *   *Section 4: Verdict & Path Forward.* What stands, what collapses. Propose the "Nested Demoi" or "Two-Track" solution.

  7.  **Refining the Verdict:**
      *   *Mara:* Her SSE is not circular *if* defined functionally, but it doesn't solve the "degree" problem. She is right about exclusion.
      *   *Leo:* His circularity charge is too broad. He is right about the need for closure. His "supplement" undermines the claim that ASP is *the* principle.
      *   *Synthesis:* They are arguing about different levels. Leo = Polity Constitution. Mara = Policy Legitimacy.

  8.  **Final Review against Constraints:**
      *   Did I take sides? No, I evaluated claims.
      *   Did I address the specific arguments (SSE, circularity, vulnerable groups)? Yes.
      *   Did I offer distinctions (constitutive/regulative)? Yes.
      *   Is the tone appropriate (adjudication/report)? Yes.

      *(Self-Correction during drafting)*: Make sure I don't just say "both are right." I need to say *where* their specific logical moves succeed or fail. For instance, Leo's claim that SSE is circular is a strong logical point that needs careful dissection. If "institutional reach" is defined by the *state*, it is circular. If defined by *causal power*, it isn't. Mara needs to be pinned down here. Also, Leo's "stakeholder mechanism" concession is a crucial weak point in his argument that ASP is sufficient.

      *(Refining the "Missing" part)*: They are missing the distinction between *rights to membership* and *rights to contestation*. Also, the idea of a "fixed demos" vs. "fluid demos."

      *(Final Polish)*: Ensure the structure is clear: Adjudication of Arguments, Diagnosis of Disagreement, Verdict/Path Forward.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **Adjudication Report: The Mara-Leo Exchange on the Democratic Boundary Problem**

  **To:** The Philosophy of Politics Reading Group
  **From:** Bystander Adjudicator
  **Subject:** Analysis of the Deadlock on Democratic Boundaries (All-Affected vs. All-Subjected)

  The following is a point-by-point adjudication of the exchange between Mara and Leo. The goal is not to declare a winner, but to isolate valid logical moves from fallacious ones, diagnose the conceptual mismatch driving the deadlock, and propose distinctions that might allow for a synthesis.

  ---

  ### I. Point-by-Point Adjudication of Arguments

  #### 1. The Circularity Charge Against "Sustained Structural Exposure" (SSE)
  *   **Leo's Claim:** Mara's SSE criterion is circular because "institutional reach" presupposes jurisdictional borders, which presuppose a prior demos to authorize them.
  *   **Mara's Defense:** Institutional reach is functional (e.g., enforcement capacity of a watershed authority), not necessarily tied to pre-authorized democratic borders.
  *   **Adjudication:** **Leo is partially correct; Mara is conditionally correct.**
      *   **Where Leo stands:** If "institutional reach" refers to *legal* jurisdiction (where the state *says* its laws apply), Leo is right. Defining legal jurisdiction requires a prior authority, which leads to the regress problem (who defines the definer?).
      *   **Where Mara stands:** If "institutional reach" refers to *sociological or causal capacity* (where the state *can* physically enforce rules or extract resources), the circle is broken. A watershed authority's reach is determined by hydrology and infrastructure, not prior votes.
      *   **The Flaw:** Mara conflates these two. If she relies on functional capacity, she risks including areas where the state *can* enforce but *should not* (e.g., an occupying power). If she relies on legal jurisdiction, Leo's circularity charge holds.
      *   **Verdict:** The circularity charge collapses **only if** Mara strictly defines reach as *de facto* functional capacity rather than *de jure* jurisdiction. However, she must then explain why mere functional capacity creates a *normative* claim to membership.

  #### 2. The Risk of Unboundedness vs. The Risk of Exclusion
  *   **Leo's Claim:** Mara's view dissolves accountability by making the demos unbounded (cosmopolitan vagueness), rendering collective choice impossible.
  *   **Mara's Claim:** Leo's view arbitrarily excludes vulnerable groups (future generations, undocumented residents, cross-border neighbors) who are subject to power without recourse.
  *   **Adjudication:** **Both claims stand, but they target different goods.**
      *   **Leo is correct on Procedure:** Democracy requires a "closure rule" to make decisions. If the electorate shifts with every policy decision (as pure All-Affected suggests), stable agency is impossible. Mara's SSE mitigates this but does not eliminate the instability of determining "significant exposure."
      *   **Mara is correct on Legitimacy:** The All-Subjected Principle (ASP) creates a "protection gap." By tying membership strictly to current legal subjection, it denies standing to those most vulnerable to the *consequences* of decisions (e.g., downstream neighbors, future citizens).
      *   **The Critical Weakness in Leo's Defense:** Leo suggests adding "stakeholder mechanisms" for excluded groups. This concedes that ASP is insufficient on its own. If non-members need protection mechanisms, then membership cannot be the sole locus of moral concern. This undermines his claim that ASP provides a complete theory of democratic boundaries.

  #### 3. The Definition of Coercion and Subjection
  *   **Mara's Claim:** Leo's ASP excludes those subject to informal coercion (undocumented residents) and includes transient visitors.
  *   **Leo's Claim:** Legal subjection is determinate; informal coercion is too vague to ground membership.
  *   **Adjudication:** **Mara identifies a substantive flaw; Leo identifies a pragmatic constraint.**
      *   Leo is right that "informal coercion" is difficult to adjudicate procedurally. However, Mara is right that excluding undocumented residents who live permanently under the threat of deportation violates the spirit of "no rule without representation."
      *   **Verdict:** Leo's criterion is *administratively* cleaner but *normatively* arbitrary. Mara's critique stands: ASP mistakes the *form* of power (law) for the *reality* of power (coercion/impact).

  ---

  ### II. Diagnosis: Where They Are Talking Past Each Other

  The deadlock is not merely substantive; it is categorical. Mara and Leo are using the word "boundary" to mean two different things, and they are aiming at two different functions of democracy.

  **1. Constitutive vs. Regulative Boundaries**
  *   **Leo (Constitutive):** Leo is asking, "What creates the 'We'?" He views the boundary as **constitutive**. There must be a fixed people *before* democracy can function. For him, the boundary is the foundation of the state.
  *   **Mara (Regulative):** Mara is asking, "Where must power be justified?" She views the boundary as **regulative**. The demos is a check on power, so the boundary should expand to wherever power reaches. For her, the boundary is a tool for legitimacy.
  *   **The Clash:** Leo thinks Mara is trying to build a house without a foundation (no fixed demos). Mara thinks Leo is building a fortress that protects the foundation but ignores the people living in the shadow of the walls.

  **2. Decision-Procedure vs. Justice-Condition**
  *   **Leo:** Treats democracy primarily as a **decision-procedure**. To decide, you must know who decides. Therefore, clarity trumps inclusivity.
  *   **Mara:** Treats democracy primarily as a **justice-condition**. To be just, those impacted must have a say. Therefore, inclusivity trumps clarity.
  *   **The Clash:** Leo fears paralysis (too many voters); Mara fears tyranny (too many subjects without votes).

  **3. Static vs. Functional Demos**
  *   **Leo:** Assumes a **static, territorial demos**. One people, one territory, one set of borders.
  *   **Mara:** Implicitly argues for **functional, domain-specific demoi**. The "demos" for climate policy should look different than the "demos" for local zoning.
  *   **The Clash:** Leo hears Mara's functionalism as anarchy (no stable state). Mara hears Leo's statism as obsolescence (ignoring global/interconnected realities).

  ---

  ### III. Verdict and Path Forward

  #### What Collapses
  1.  **Leo's Claim of Sufficiency:** Leo cannot maintain that the All-Subjected Principle is the *sole* principle of democratic boundaries. His admission that "stakeholder mechanisms" are needed for non-members proves that subjection is not the only source of democratic claim.
  2.  **Mara's Claim of Non-Circularity (without qualification):** Mara cannot claim SSE is non-circular if she relies on existing legal jurisdictions. She must commit fully to *functional* power, which creates its own difficulties in measurement.
  3.  **The Binary of Membership:** Both parties are stuck on a binary: you are either a member (with a vote) or a non-member (without). This binary is what creates the exclusion vs. paralysis trap.

  #### What Stands
  1.  **Leo's Procedural Constraint:** A democracy requires a stable constituency to function. Pure affectedness creates instability.
  2.  **Mara's Normative Constraint:** Legitimacy requires that those subject to structural power have a voice. Pure legal subjection is morally arbitrary.

  #### The Missing Distinction: "Rights of Membership" vs. "Rights of Contestation"
  To break the deadlock, both must concede that democratic standing is not a single switch (vote/no vote) but a bundle of rights.

  *   **Leo must concede:** That "stakeholder mechanisms" are not just supplements but essential *rights of contestation*. Undocumented residents or downstream neighbors may not need full *membership* (electing the legislature) to have *standing* (legal challenge, impact assessment, representation in specific agencies).
  *   **Mara must concede:** That *constitutive membership* (the right to define the polity itself) must remain relatively stable to ensure accountability. Not every affected interest grants a vote on the constitution, but it does grant a claim on specific policies.

  #### Proposed Synthesis: Nested Demoi
  The group should consider moving the debate toward a **Nested Demoi** model:
  1.  **Constitutive Level (Leo's Domain):** A fixed territorial citizenship handles core sovereign functions (defense, constitutional amendment) to ensure stability and accountability.
  2.  **Functional Level (Mara's Domain):** Issue-specific stakeholders (including cross-border or future-representatives) are granted **contestatory voice** (not necessarily full voting rights) in regulatory domains where they suffer "sustained structural exposure."

  **Recommendation for the Group:**
  Ask Mara to clarify if she demands *voting membership* for all affected parties or *contestatory standing*. Ask Leo to clarify if his "stakeholder mechanisms" grant *binding power* or merely *consultative status*. The deadlock likely resides in the assumption that "democratic standing" equals "one person, one vote." Decoupling these concepts may allow Leo to accept Mara's vulnerable groups without fearing unboundedness, and allow Mara to accept Leo's stability without abandoning the excluded.
