prompt: |-
  I'm a quantitative risk analyst at a mid-size firm, and I maintain a standing set of probability forecasts — the chance that a given project will be delayed, that a supplier will default, that a regulatory change will take effect by a set date — and I know in advance exactly which scheduled pieces of evidence will arrive and when: a monthly loss report, the result of a quarterly stress test, the next earnings release, a court ruling on a known docket date. Before each of those scheduled evidence events I want to check that my current forecasts are coherent with what I expect to believe once the evidence lands, using the diachronic constraint on credences that van Fraassen calls the reflection principle.

  Please turn that principle into a decision procedure my team can actually run in the thirty minutes before a weekly forecast review: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and flags a reflection violation rather than spitting out a number, and where it hands the decision to a person because the question is one of judgment rather than arithmetic. It has to say explicitly what to do when I can't get a precise number for one of the future credences, and it has to be honest about which steps are judgment calls dressed up as procedure and which are genuine checks. Any forecast the procedure changes has to be signed off by the head of the risk team, so mark clearly which outputs are automatic and which require that sign-off.

  Then run the procedure on two concrete forecasts. First, my current 30% forecast that a project will be delayed, where I am certain that if the scheduled stress test comes back clean I will move to 10% and if it comes back dirty I will move to 60%, and where I currently put a 70% chance on the clean outcome — show the full arithmetic and the decision. Second, a forecast about a project I personally champion, where I have a strong incentive to keep the success probability high and where the scheduled evidence is ambiguous enough that I am not actually sure what I will believe after seeing it — I want this one to end in an answer I will not like, and I want the procedure to show me exactly why it is entitled to that answer.

  Finally, say plainly what this procedure cannot do: the cases where reflection is silent, where its preconditions fail, or where following it would be a mistake.

  Respond in the style of an expert in Bayesian epistemology who also has to be useful to a practitioner, not a philosophy seminar. Think very carefully before answering; the value of this is in the translation — keeping what the principle actually says while making it runnable by someone who has never read it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Quantitative risk analyst at a mid-size firm.
      *   **Task:** Create a decision procedure based on van Fraassen's Reflection Principle for checking forecast coherence before scheduled evidence events.
      *   **Constraints:**
          *   Must be runnable in 30 minutes.
          *   Must specify questions, sufficient answers, stop conditions (flags), and hand-off points (judgment vs. arithmetic).
          *   Must handle imprecise future credences.
          *   Must distinguish between genuine checks and judgment calls dressed as procedure.
          *   Outputs changing forecasts require Head of Risk sign-off (mark clearly).
          *   Must run the procedure on two concrete cases (one coherent/arithmetic, one biased/psychological).
          *   Must explain limitations (where Reflection fails or is silent).
          *   **Tone:** Expert in Bayesian epistemology but useful to a practitioner (no philosophy seminar).
      *   **Goal:** Translate a philosophical principle into a risk management tool without losing the core logic.

  2.  **Deconstruct the Reflection Principle:**
      *   *Core Idea:* Your current credence in $A$ should equal your expected future credence in $A$. $P_t(A) = \sum P_{t+1}(A | E_i) P_t(E_i)$.
      *   *Intuition:* If you know now how you will update later, you should update now. If you don't, you're vulnerable to a Dutch Book (dynamic inconsistency).
      *   *Application:* Pre-evidence check. Do my current probabilities match the weighted average of the probabilities I *expect* to hold after the evidence arrives?

  3.  **Drafting the Procedure (The "Reflection Audit"):**
      *   *Timebox:* 30 minutes.
      *   *Structure:* Step-by-step checklist.
      *   *Key Steps:*
          1.  Identify the Event ($E$) and the Hypothesis ($H$).
          2.  Define Possible Outcomes ($E_1, E_2...$).
          3.  Assign Current Probabilities to Outcomes ($P(E_i)$).
          4.  Estimate Future Credences ($P_{new}(H | E_i)$).
          5.  Calculate Expected Future Credence.
          6.  Compare with Current Credence ($P_{curr}(H)$).
          7.  Decision Logic (Pass/Fail/Flag).
      *   *Handling Imprecision:* Use ranges or "confidence intervals" for future credences. If the current credence falls outside the range, flag it.
      *   *Judgment vs. Arithmetic:* Arithmetic is the calculation. Judgment is estimating the future credence (Step 4).
      *   *Sign-off:* Any change requires Head of Risk.

  4.  **Developing the Two Cases:**
      *   *Case 1 (The Clean Math):*
          *   $H$: Project Delayed.
          *   $P_{curr}(H) = 0.30$.
          *   Evidence: Stress Test (Clean/Dirty).
          *   $P(Clean) = 0.70$, $P(Dirty) = 0.30$.
          *   $P_{new}(H | Clean) = 0.10$.
          *   $P_{new}(H | Dirty) = 0.60$.
          *   Calculation: $(0.10 * 0.70) + (0.60 * 0.30) = 0.07 + 0.18 = 0.25$.
          *   Comparison: $0.30 \neq 0.25$. Violation.
          *   *Correction:* Wait, the prompt says "show the full arithmetic and the decision." If there's a violation, the procedure flags it. I need to make sure the math reflects the prompt's setup. The prompt implies this *might* be coherent or incoherent. Let's check: $0.30$ vs $0.25$. It's incoherent. I need to explain *why* and what the procedure does (flags for sign-off).
      *   *Case 2 (The Biased Champion):*
          *   $H$: Project Success.
          *   Context: Personal incentive to keep $P(H)$ high.
          *   Evidence: Ambiguous.
          *   Problem: User admits they don't know what they will believe.
          *   Reflection Requirement: You *must* have a distribution over future beliefs. If you say "I don't know," Reflection says "You shouldn't be confident now either."
          *   Outcome: The procedure forces an admission of uncertainty. If current $P(H)$ is high (e.g., 80%) but future $P(H)$ is undefined or wide, the procedure flags the current confidence as unjustified.
          *   *Goal:* "End in an answer I will not like." The answer should be: "Your current confidence is unsupported because you cannot specify how evidence changes your mind."

  5.  **Addressing Limitations:**
      *   Reflection assumes you trust your future self (rationality).
      *   It doesn't tell you *what* the evidence means, only that you should be consistent.
      *   It fails if you expect to be irrational (e.g., panic, bias).
      *   It doesn't work for unforeseen evidence (Black Swans).

  6.  **Refining the Tone:**
      *   Avoid jargon like "Dutch Book" unless explained practically ("arbitrage against yourself").
      *   Use risk management language ("Audit," "Sign-off," "Flag").
      *   Be direct about the psychological discomfort.

  7.  **Review against Constraints:**
      *   30-minute run time? Yes, keep steps tight.
      *   Sign-off marked? Yes.
      *   Imprecise numbers handled? Yes (ranges).
      *   Judgment vs. Arithmetic distinguished? Yes.
      *   Two cases run? Yes.
      *   Limitations section? Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction on Case 1:* The prompt sets up specific numbers. $0.30$ current. Expected future: $(0.1 \times 0.7) + (0.6 \times 0.3) = 0.25$. There is a 5% gap. This is a violation. The procedure must flag this. I need to make sure I don't just say "it passes." It fails reflection.
      *   *Correction on Case 2:* The prompt says "I am not actually sure what I will believe." Reflection *requires* you to be sure about your updating rule. If you aren't, your current credence is suspect. The procedure needs to catch this "I don't know" and treat it as a failure of the precondition, leading to a downgrade of confidence.
      *   *Sign-off:* Make sure the visual cue (e.g., **[SIGN-OFF REQUIRED]**) is clear.
      *   *Tone Check:* Ensure I don't sound like I'm lecturing on philosophy. Keep it actionable. "Do this, then this."

  9.  **Final Polish:** Check the van Fraassen reference. It's about temporal coherence. $P_{now}(A) = E_{now}[P_{later}(A)]$. Ensure the procedure enforces this equation.

  **(Self-Correction Note on Case 1):** Wait, if the user *knows* they will move to 10% or 60%, and they *know* the probabilities of those outcomes, Reflection says their current credence *must* be the weighted average. If it isn't, they are incoherent. The procedure should identify this incoherence. The prompt asks to "show the full arithmetic and the decision." The decision is "Flag for Adjustment."

  **(Self-Correction Note on Case 2):** The user says "I am not actually sure what I will believe." Reflection assumes you have a probability distribution over your future beliefs. If you lack that, you violate the *precondition* of Reflection. The procedure should catch this as "Undefined Future State" and default to reducing confidence or flagging for deep review. The "answer I will not like" is likely "Your current forecast is arbitrary."

  Let's write it.
answer: |-
  # The Reflection Audit: A Pre-Evidence Coherence Procedure

  **Purpose:** To ensure your current probability forecasts ($P_{now}$) are mathematically consistent with the forecasts you expect to hold ($P_{later}$) after scheduled evidence arrives. This prevents dynamic inconsistency—where you are effectively betting against your future self.

  **Timebox:** 30 Minutes per forecast cluster.
  **Owner:** Quantitative Risk Analyst.
  **Approver:** Head of Risk (for any forecast adjustment).

  ---

  ## Part 1: The Procedure

  ### Step 1: Define the Event and Evidence (5 Minutes)
  *   **Action:** Write down the specific hypothesis ($H$) you are forecasting (e.g., "Project X delays") and the specific scheduled evidence event ($E$) that will occur before the next review (e.g., "Q3 Stress Test Result").
  *   **Requirement:** $E$ must be a discrete, observable outcome with a known arrival date.
  *   **Stop Condition:** If $E$ is vague (e.g., "market sentiment") or the date is unknown, **STOP**. Reflection does not apply. Mark as "Unscheduled Risk" and proceed with standard heuristic review.

  ### Step 2: Partition the Evidence Space (5 Minutes)
  *   **Action:** List all mutually exclusive and exhaustive outcomes of $E$ (e.g., $E_{clean}$, $E_{dirty}$).
  *   **Action:** Assign your current probability to each outcome ($P(E_i)$). These must sum to 1.0.
  *   **Judgment Call:** This is subjective. You are estimating the likelihood of the evidence itself, not the project outcome.
  *   **Check:** Do $P(E_i)$ sum to 1.0? If no, correct arithmetic error.

  ### Step 3: Estimate Future Credences (10 Minutes)
  *   **Action:** For each outcome $E_i$, state the probability you *expect* to assign to $H$ immediately after seeing $E_i$. Denote this $P_{later}(H | E_i)$.
  *   **Constraint:** You must provide a number. If you cannot provide a number, you must provide a range (e.g., 40%–60%).
  *   **Honesty Check:** This is the critical judgment call. Ask: "If this result lands, will I actually update to this number, or am I guessing what I *should* say?"
      *   If you are guessing what you *should* say: **FLAG [PSYCHOLOGICAL BIAS RISK]**.
      *   If you genuinely don't know how you will react: **FLAG [UNDEFINED UPDATING RULE]**.
  *   **Imprecision Protocol:** If using a range, use the midpoint for calculation but widen the tolerance threshold in Step 5.

  ### Step 4: The Reflection Calculation (5 Minutes)
  *   **Action:** Calculate the Expected Future Credence ($E[P_{later}]$).
      $$E[P_{later}(H)] = \sum [ P(E_i) \times P_{later}(H | E_i) ]$$
  *   **Action:** Compare $E[P_{later}(H)]$ with your Current Credence $P_{now}(H)$.
  *   **Arithmetic:** This step is purely mechanical.

  ### Step 5: Decision and Sign-Off (5 Minutes)
  *   **Logic:**
      *   **If $|P_{now}(H) - E[P_{later}(H)]| \leq 0.05$ (or half the range width):** **PASS**. No action required.
      *   **If $|P_{now}(H) - E[P_{later}(H)]| > 0.05$:** **VIOLATION**. Your current forecast is incoherent with your expected updating.
      *   **If Step 3 was Flagged:** **VIOLATION**. You lack a coherent updating plan.
  *   **Remediation:**
      *   **Option A:** Adjust $P_{now}(H)$ to match $E[P_{later}(H)]$. **[SIGN-OFF REQUIRED]**
      *   **Option B:** Justify why you expect to be irrational in the future (e.g., "I know I will overreact to bad news"). **[SIGN-OFF REQUIRED + DOCUMENTATION]**
      *   **Option C:** Admit $P_{now}(H)$ is intuitive/unstructured. Downgrade confidence rating of the forecast. **[SIGN-OFF REQUIRED]**

  ---

  ## Part 2: Procedure Run-Throughs

  ### Case 1: The Stress Test (Arithmetic Violation)
  **Context:** You are forecasting a project delay.
  **Hypothesis ($H$):** Project Delayed.
  **Evidence ($E$):** Quarterly Stress Test (Clean / Dirty).

  **Inputs:**
  1.  **Current Credence:** $P_{now}(H) = 0.30$ (30%).
  2.  **Evidence Probabilities:**
      *   $P(E_{clean}) = 0.70$
      *   $P(E_{dirty}) = 0.30$
      *   (Sum = 1.0, OK).
  3.  **Expected Future Credences:**
      *   If Clean: $P_{later}(H | E_{clean}) = 0.10$
      *   If Dirty: $P_{later}(H | E_{dirty}) = 0.60$

  **Calculation (Step 4):**
  $$E[P_{later}(H)] = (0.70 \times 0.10) + (0.30 \times 0.60)$$
  $$E[P_{later}(H)] = 0.07 + 0.18$$
  $$E[P_{later}(H)] = 0.25$$

  **Comparison (Step 5):**
  *   $P_{now}(H) = 0.30$
  *   $E[P_{later}(H)] = 0.25$
  *   **Gap:** $0.05$ (5%).

  **Decision:**
  *   **Status:** **BORDERLINE VIOLATION**.
  *   **Analysis:** The gap is exactly on the 5% tolerance threshold. However, strictly speaking, your current belief (30%) is higher than your own weighted expectation of your future belief (25%). You are currently more pessimistic than your own model says you should be.
  *   **Action:** Since the gap is $\geq 0.05$, this triggers a review.
  *   **Output:** **[SIGN-OFF REQUIRED]**.
  *   **Recommendation to Head of Risk:** "Analyst's current forecast (30%) exceeds coherent expectation (25%). Either lower current forecast to 25% immediately, or document why the analyst expects to under-react to the stress test results."

  ***

  ### Case 2: The Championed Project (Psychological Violation)
  **Context:** You are personally invested in a project's success.
  **Hypothesis ($H$):** Project Succeeds.
  **Evidence ($E$):** Ambiguous Regulatory Guidance (Favorable / Neutral / Unfavorable).

  **Inputs:**
  1.  **Current Credence:** $P_{now}(H) = 0.85$ (85% - High Confidence).
  2.  **Evidence Probabilities:**
      *   $P(E_{fav}) = 0.30$
      *   $P(E_{neu}) = 0.50$
      *   $P(E_{unfav}) = 0.20$
      *   (Sum = 1.0, OK).
  3.  **Expected Future Credences:**
      *   If Favorable: $P_{later}(H | E_{fav}) = 0.90$
      *   If Neutral: $P_{later}(H | E_{neu}) = \text{"I'm not sure, probably still high?"}$
      *   If Unfavorable: $P_{later}(H | E_{unfav}) = \text{"Depends on the wording."}$

  **Procedure Execution:**
  *   **Step 3 Stop Condition:** You failed to provide numbers for Neutral and Unfavorable outcomes. You flagged **[UNDEFINED UPDATING RULE]**.
  *   **Why this happened:** You have an incentive to keep $P_{now}(H)$ high. Admitting that Unfavorable evidence would drop your belief significantly (e.g., to 40%) would drag down your Expected Future Credence. By remaining vague ("Depends on wording"), you are protecting the current 85% from mathematical scrutiny.
  *   **Reflection Principle Verdict:** If you do not know how you will update, you are not entitled to a precise current credence. A precise number (85%) implies a precise updating plan. Lacking the plan invalidates the precision of the number.

  **Decision:**
  *   **Status:** **CRITICAL VIOLATION**.
  *   **Analysis:** You cannot claim 85% confidence now if you cannot specify what evidence would move you off that number. This is not an arithmetic error; it is a structural flaw in your forecasting posture. You are treating the 85% as a *position* rather than a *probability*.
  *   **Action:** **DOWNGRADE CONFIDENCE**.
  *   **Output:** **[SIGN-OFF REQUIRED]**.
  *   **Recommendation to Head of Risk:** "Analyst cannot specify updating rule for 70% of evidence space. Current 85% forecast is unsupported by a coherent belief structure. Recommend converting point forecast to wide range (40%–90%) or suspending forecast until updating rule is defined."
  *   **Why you won't like this:** The procedure forces you to admit that your high confidence is an artifact of avoiding the question "What would change your mind?" rather than a result of analyzing the evidence.

  ---

  ## Part 3: Limitations and Warnings

  This procedure is a tool, not a truth machine. It enforces consistency, not accuracy. Be aware of the following failure modes:

  **1. The "Rational Future Self" Assumption**
  Reflection assumes your future self will update rationally based on the evidence. If you know you will panic, succumb to office politics, or be forced to hide bad news after the evidence arrives, Reflection gives the wrong advice.
  *   *Fix:* If you expect future irrationality, document it in Step 5 (Option B). Do not force coherence with a future state you know will be corrupted.

  **2. Unforeseen Evidence (Black Swans)**
  Reflection only works for *scheduled, known* evidence partitions. It cannot account for evidence you cannot currently conceive of.
  *   *Fix:* Do not run this audit on long-tail risks where the evidence space is unknown. Use this only for scheduled reporting cycles (earnings, regulatory rulings, stress tests).

  **3. Precision Illusion**
  The arithmetic in Step 4 creates a false sense of accuracy. A gap of 0.01 is mathematically a violation, but practically noise.
  *   *Fix:* Respect the 5% tolerance band in Step 5. Do not adjust forecasts for microscopic violations.

  **4. Judgment Dressed as Arithmetic**
  Step 3 (Estimating Future Credences) is where the philosophy hides. You can "game" the audit by claiming you will update aggressively in the future to justify a wild current number, or vice versa.
  *   *Fix:* The Head of Risk must challenge Step 3 inputs. "You say you'll drop to 10% if the test fails? Show me the historical precedent for that magnitude of update." If the future credence is arbitrary, the Reflection check is meaningless.

  **5. When to Ignore the Principle**
  If your current forecast is based on private information that you expect to *forget* or be *forbidden from using* by the time the evidence arrives (e.g., insider knowledge that will be public later), Reflection may demand you lower your confidence now.
  *   *Fix:* In a compliance context, you may be required to ignore private information. In a pure risk context, trust the private information and flag the violation as "Information Asymmetry."

  ---

  **Final Note to the Analyst:**
  The Reflection Principle is not about being right; it is about not being contradictory. It will not tell you if the project will fail. It will only tell you if your current belief about the failure is consistent with your plan for learning the truth. If the procedure flags you, it does not mean your number is wrong. It means your number is **unstable**. In risk management, instability is a risk factor in itself.
