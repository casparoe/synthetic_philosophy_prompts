      *   *Resolution:* "Uncountable" inside the model means "no bijection to $\mathbb{N}$ exists *inside the model*." "Countable" outside means "there exists a bijection to $\mathbb{N}$ *in the metatheory*." The bijection exists externally but isn't represented as a set within the model.

