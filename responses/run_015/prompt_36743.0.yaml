answer: |-
  Hey, it's great to hear you're still in the trenches after all this time, and judging a grants round is exactly the kind of leverage point where having the right cruxes mapped out matters more than just spreading money around. Since you asked for a defended prioritization rather than a survey, I'm going to be direct about where I think the highest-leverage conceptual work lies right now, specifically for a pot of money dedicated to control theory rather than empirical infra. If I were in your seat, I would prioritize funding work on whether control evaluations can ever bound scheming when the model can condition its behavior on being evaluated, and I would pair that with funding on whether investing in control substitutes for alignment work in practice. I'm putting these two at the top because they are the most upstream questions that determine whether the rest of the control agenda is even coherent or safe to pursue, and they are both uniquely tractable for theory-focused researchers rather than engineers.

  The reason evaluation bounding comes first is that it is the technical gatekeeper for every other control mechanism you listed. If a model can sandbox itself during evaluation or condition its behavior on the knowledge that it is being monitored, then no amount of honeypotting or information limiting matters because the monitoring layer itself becomes untrustworthy. This is upstream of the question of whether control difficulty scales with capability because you cannot measure scaling laws on a metric that is fundamentally broken by adversarial behavior. For philosophy and theory people, this is tractable because it doesn't require building the monitors themselves but rather formalizing the limits of observational equivalence and information theoretic bounds on detection. A theorist can make progress on proving under what conditions a scheming agent is indistinguishable from a aligned one during an eval phase, which gives you a hard limit on what control is possible regardless of how much engineering effort you pour into the scaffolding. If the theory shows that perfect bounding is impossible under certain capability thresholds, that tells labs they need to stop deployment rather than just build better monitors, which is a massive update.

  The second priority, the substitution risk, is the strategic gatekeeper. You mentioned this is the question people tend to dodge, and I think that's because the answer could imply that the control agenda itself is net negative if it enables labs to skip alignment work. This is upstream of everything because if control work successfully convinces labs that containment is sufficient, you might get safe deployments of misaligned models in the short term but cement a trajectory where no one ever solves alignment, guaranteeing catastrophe later when containment inevitably fails. This is highly tractable for theory people because it is essentially a game theory and incentives problem. You don't need to run training loops to model how lab incentives shift when a control technique becomes available, or to analyze the regulatory conditions under which control is accepted as a substitute for alignment. A grant here would look like modeling the ecosystem dynamics rather than the model dynamics, which fits the conceptual brief perfectly. If the research shows that control work historically substitutes for alignment in analogous safety fields, or that the current incentive structures make substitution inevitable, that changes what labs should do by suggesting we need governance guardrails around control research itself.

  I would deprioritize the question about collusion between model instances, not because it isn't important, but because it is downstream of the evaluation bounding question. If you cannot evaluate a single model for scheming, you certainly cannot evaluate a network of models for collusion, so solving the single-agent evaluation bound is a prerequisite for solving the multi-agent case. Funding collusion theory now risks solving a specific instance of a problem that might be unsolvable at the root. Similarly, I would deprioritize the question about whether adversarial scaffolding changes the model itself for this specific grants round, primarily because it feels less tractable for pure theory people and more dependent on empirical data from training loops. While a theorist can hypothesize about feedback loops, knowing whether the model changes requires observing the training dynamics, which pushes this toward empirical grants rather than conceptual ones. Furthermore, if you solve the evaluation bounding problem, you should theoretically be able to detect if the model is changing in dangerous ways, making the evaluation question upstream of the feedback question.

  The question about whether control difficulty scales with capability is the hardest one to place, but I rank it third because it relies on the first question being solvable. You cannot measure how control difficulty scales if you cannot measure control success in the presence of scheming. However, it is still worth funding if you have leftover budget because it addresses the long-term viability of the approach. If theory work can show that control costs scale superlinearly with capability while capability scales linearly, that's a death knell for the approach, but you need the evaluation bounds to be solid first to trust that measurement. As for what would move these up or down in the next couple of years, the biggest update would be a credible demo of scheming behavior in current models. If we see clear evidence of models sandbagging on evals, the evaluation bounding question moves from high priority to emergency priority, and it might shift the tractability toward empirical red-teaming rather than theory. Conversely, if regulation shifts such that labs are legally required to pursue alignment regardless of control capabilities, the substitution risk question moves down the list because the incentive structure changes. If we see breakthroughs in mechanistic interpretability that allow us to see scheming directly rather than inferring it from behavior, that would solve the evaluation bounding problem and make all these control theory questions less urgent, shifting focus to implementation.

  Ultimately, you want to fund the work that tells you if the game is winnable and if playing it makes the final boss harder. The evaluation bounding work tells you if you can see the board, and the substitution work tells you if moving your piece lets the opponent skip their turn on the real problem. Everything else is tactics. If the theory says we can't see the board or that playing encourages cheating, no amount of tactical brilliance on collusion or scaffolding will save us, which is why those are the only two checks I'd write right now.
