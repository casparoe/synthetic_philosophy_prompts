  **Project Title:** The Instability of Sufficiency: A Conceptual Critique of Keynes's Post-Scarcity Boundary

  **Applicant:** [Your Name]
  **Fellowship:** [Name of Fellowship]
  **Duration:** One Semester

  ### **1. Introduction and Problem Statement**

  In *Economic Possibilities for our Grandchildren* (1930), John Maynard Keynes offers a visionary prediction: once technological productivity eliminates material scarcity, rational societies will redirect labor toward leisure, culture, and "living well" rather than continuing to accumulate wealth. This optimism rests on a specific anthropological distinction between two classes of needs. First, there are **absolute needs**, tied to basic subsistence and comfort, which are capable of full satisfaction. Second, there are **relative needs**, driven by social comparison and status, which are structurally insatiable. Keynes argues that the economic problem is solving the first; once achieved, the insatiability of the second should not dictate economic organization.

  However, the conceptual boundary Keynes relies on is unstable. He specifies no mechanism preventing the second domain from colonizing the first. Once basic needs are met, their satisfaction can itself become a positional good—manifested through conspicuous leisure, cultural capital, or experiential consumption. If the satisfaction of absolute needs becomes subject to relative competition, the separation dissolves, and the incentive to accumulate wealth remains infinite. This project investigates not the empirical accuracy of Keynes's forecast, but the conceptual coherence of the boundary condition required to sustain it.

  ### **2. Research Question and Objectives**

  The central research question is: **Can the boundary between absolute and relative needs be maintained without metaphysical commitments to a specific theory of human flourishing?**

  I propose to reconstruct Keynes's implicit boundary-condition as a normative claim about human nature rather than a psychological forecast. I will then ask whether that claim can be sustained without silently borrowing from a strand of liberal humanism that treats certain goods as inherently non-comparative. Alternatively, I will examine whether the boundary can be maintained by purely institutional mechanisms—such as progressive taxation, working-time regulation, or norms of sufficiency—without any substantive theory of flourishing.

  The objective is to provide economists and policy designers with a sharper diagnostic tool. They need to know whether Keynes's vision depends on a view of human nature they might reject, or on institutional conditions they could actually build.

  ### **3. Methodology**

  This project employs **conceptual analysis paired with internal critique**. It avoids archival research, empirical economic forecasting, and broad bibliographic surveys. Instead, it requires careful engagement with the primary essay (*Economic Possibilities for our Grandchildren*) and contemporary debates in well-being theory.

  The method involves three steps:
  1.  **Formalization:** I will formalize Keynes's two-layer model of needs to isolate its logical dependencies.
  2.  **Normative Excavation:** I will identify the minimal normative premises required to keep the categories separate.
  3.  **Stress Testing:** I will test whether a deflationary, preference-satisfaction account of well-being can reproduce Keynes's optimism about post-scarcity leisure, or if the model collapses under a purely relativistic account of value.

  ### **4. Deliverables: A Conceptual Map**

  The final product will be a 25–30 page paper structured as a conceptual map with four distinct parts:

  1.  **The Reconstructed Boundary-Condition:** A precise definition of the distinction between absolute and relative needs as Keynes utilizes it, highlighting where the text relies on implicit assumptions about "sufficiency."
  2.  **Minimal Commitments:** An identification of the normative or institutional commitments required to keep the categories separate. This will distinguish between *ontological* claims (certain goods are objectively non-comparative) and *institutional* claims (structures can enforce non-comparability).
  3.  **Assessment of Preference-Based Theories:** An analysis of whether contemporary preference-satisfaction theories of well-being can support that separation. If well-being is defined solely by preference fulfillment, does the absolute/relative distinction survive?
  4.  **Explicit Failure Condition:** A formulation of the conditions under which the boundary collapses into a single continuum of positional goods. If this collapse occurs, Keynes's vision of a society that stops working once it is comfortable loses its normative grounding.

  ### **5. Feasibility and Timeline**

  This project is designed specifically for a one-semester timeline. Because it eschews empirical data collection and archival work, the research phase is limited to text analysis and theoretical synthesis.

  *   **Weeks 1–4:** Close reading of Keynes's primary text and secondary literature on the absolute/relative needs distinction. Formalization of the two-layer model.
  *   **Weeks 5–8:** Engagement with contemporary well-being theory (preference satisfaction vs. objective list theories) to test the boundary's stability. Drafting of Parts 1 and 2 of the conceptual map.
  *   **Weeks 9–12:** Synthesis of the failure conditions and institutional alternatives. Drafting of Parts 3 and 4.
  *   **Weeks 13–15:** Revision, polishing, and final formatting.

  **Risk Mitigation:** The primary risk is that the metaphysical commitments turn out to be more deeply embedded in the text than a single term allows me to extract. If the normative excavation reveals that Keynes's argument is inextricably bound to a specific, outdated metaphysics of human nature, the project will be scaled back. In this scenario, the focus will shift to a focused analysis of one institutional alternative (e.g., working-time regulation) as a secular substitute for Keynes's anthropological optimism. This ensures a complete deliverable even if the primary hypothesis regarding liberal humanism is not fully sustained.

  ### **6. Significance**

  Keynes's vision remains a touchstone for discussions on post-growth economics, Universal Basic Income, and the four-day work week. However, policy designers often adopt his optimism without interrogating its foundations. If the boundary between absolute and relative needs is porous, policies predicated on "sufficiency" may fail to reduce labor supply because the definition of "enough" expands to match productivity gains.

  By isolating the normative grounding of this boundary, this research clarifies whether a post-scarcity leisure society requires a cultural shift in how we value goods (a theory of flourishing) or merely a regulatory shift in how we distribute them (institutional design). This distinction is critical for any modern attempt to realize Keynes's promise without relying on his potentially fragile assumptions about human nature.

  ### **7. Conclusion**

  This fellowship will allow me to dedicate the necessary time to rigorous conceptual work that is often sidelined in empirical economic curricula. By treating Keynes's essay not as a forecast but as a philosophical argument subject to internal critique, I aim to produce a durable contribution to the theory of well-being and economic design. The resulting conceptual map will serve as a diagnostic for future inquiries into the limits of growth and the possibility of leisure.
