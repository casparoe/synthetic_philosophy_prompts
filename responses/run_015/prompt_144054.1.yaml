  my philosophy of art professor keeps comparing a marble statue to a whirlpool in a river: both are just shapes that the underlying stuff takes on for a while, and if you drain the river or chip the marble you've destroyed the shape but not some extra thing. she uses this to argue that the statue and the clay are literally one object with two descriptions, not two things competing for space. can you map it out for me? what's the whirlpool, what's the river, what's the draining, and where does the marble version fall apart? especialy since marble doesn't flow and a whirlpool can't survive being moved to a different river. does her 'no extra object' conclusion survive, or is the whirlpool analogy smuggling in a kind of process-ontology that clay doesn't share?
reasoning: |-
