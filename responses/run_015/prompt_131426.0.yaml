answer: |-
  **Brainstorming Notes**

  *   **End-Word Strategy:** I will keep all six words. **TICKET** and **ODDS** will anchor the Lottery stanzas (1 & 2) to evoke probabilistic confidence. **ERRATA** and **FALLIBLE** will dominate the Preface stanzas (3 & 4) to evoke human humility. **CLOSURE** and **SURE** will bridge both, shifting from logical necessity (Lottery) to epistemic uncertainty (Preface).
  *   **The Turn (Stanza 5):** The copy-editor's note introduces an external constraint ("at least one is false") to the book. This structurally mirrors the Lottery ("at least one wins") rather than the Preface (internal humility). I will use **TICKET** and **ODDS** here to signal this shift back to Lottery logic, despite the setting being a manuscript.
  *   **The Tornada:** It will pair the words (ODDS/TICKET, CLOSURE/SURE, FALLIBLE/ERRATA) to show the tensions remain locked together. It will withhold judgment on which principle (closure or justification) must break, leaving the paradox live.

  ***

  **The Copy-Editor's Note**

  I hold the single numbered **TICKET**.
  Cold math recites the long and losing **ODDS**.
  For every slip I feel almost **SURE**.
  Reason demands a clean and logical **CLOSURE**.
  No printer's mark suggests a hidden **ERRATA**.
  The system claims it is not **FALLIBLE**.

  Though every agent proves himself **FALLIBLE**,
  I stack another losing **TICKET** high.
  No correction swims within this **ERRATA**.
  The weight accumulates against the **ODDS**.
  Until the sum denies its own **CLOSURE**,
  And I believe what cannot be **SURE**.

  I am no longer mathematically **SURE**.
  My history proves I am **FALLIBLE**.
  No logic forces here a **CLOSURE**.
  I hold no gamble, no numbered **TICKET**.
  No house calculates the **ODDS**.
  Only the quiet promise of **ERRATA**.

  I write the page to list the **ERRATA**.
  Nothing here is absolutely **SURE**.
  I do not count the statistical **ODDS**.
  I know my mind is strictly **FALLIBLE**.
  I did not buy this knowledge like a **TICKET**.
  It comes without a logical **CLOSURE**.

  Then comes the note demanding **CLOSURE**.
  Red ink upon the draft like **ERRATA**.
  Each sentence now a numbered **TICKET**.
  The editor is coldly **SURE**.
  Not because I am **FALLIBLE**.
  But because the rule adjusts the **ODDS**.

  We calculate the shifting **ODDS**.
  We seek a final intellectual **CLOSURE**.
  Admitting we are fundamentally **FALLIBLE**.
  We scan the text for hidden **ERRATA**.
  Nothing remains completely **SURE**.
  I hold the unclaimed winning **TICKET**.

  Against the **ODDS** I hold the final **TICKET**,
  Seeking **CLOSURE** where nothing is **SURE**,
  A **FALLIBLE** mind correcting **ERRATA**.

  ***

  **Answer Key for Marking**

  *   **Stanza Allocation:** Stanzas 1–2 depict the Lottery (external probability, accumulating confidence); Stanzas 3–4 depict the Preface (internal humility, no external constraint); Stanza 5 introduces the Copy-Editor case, which structurally aligns with the Lottery due to the external "at least one false" constraint.
  *   **The Copy-Editor's Function:** This case shows that when the "error premise" is supplied externally (like the lottery winner), the paradox pressures the Closure principle; when supplied internally (like the Preface), it pressures the justification of individual claims.
  *   **The Burden:** The poem suggests the burden lies on **Closure** (or the aggregation of justification), as the individual claims remain "SURE" in both cases, yet the conjunction fails when an external constraint forces a contradiction.
