  5.  **Final Review against Constraints:**
      *   Did I cover all 4 arguments? Yes.
      *   Did I do the 3 sub-points (Clean, Bent, Missing) for each? Yes.
      *   Did I address the suspicion and the $N_e$ idea in the Residue Report? Yes.
