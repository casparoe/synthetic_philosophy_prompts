  *(Refining the "Asymmetry" translation)*: The Non-Identity Problem is tricky. In PVA, if you don't breed an animal, that specific genotype is lost. But the *individual* isn't harmed. This maps well. The "harm" in PVA is to the *population's viability*, not the individual's potential.

  *(Refining the "Residue Report")*: Make sure to explicitly answer: "Is this a blind spot in my framework or were they doing less work?" Answer: It's a category error. PVA is instrumental (population as means to persistence); Pronatalism is often intrinsic (people as ends) or economic (people as means to GDP).

