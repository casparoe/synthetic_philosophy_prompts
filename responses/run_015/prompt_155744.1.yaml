answer: |-
  This is a sophisticated version of the **Phenomenal Concept Strategy (PCS)**. Your core triad (1, 3, 4) is the standard physicalist defense against the Knowledge Argument and is internally stable. You are right to feel tension elsewhere, though. The "paying twice" sensation is coming from your add-ons (2, 5, 6), specifically how they interact with each other, not with the core physicalist claim.

  Here is the stress-test, ranked by severity.

  ### 1. The Derivation Error (Severity: High)
  **Conflict:** Point 2 (Propositional) vs. Point 5 (Fading-Mary)
  **The Problem:** You want Point 5 to "fall out of" Point 2. It does not.
  Point 2 claims knowledge is *categorically distinct* from ability. Point 5 claims knowledge is *ontologically independent* of ability (it persists when ability dies).
  These are different claims. I can hold that "knowing the capital of France" is propositional (not an ability), but if I get amnesia, I lose that knowledge. The fact that knowledge is propositional does not guarantee it survives the loss of the cognitive machinery required to grasp the proposition.
  By asserting 5, you are over-insuring. You are fighting the Ability Hypothesis on two fronts: theoretically (2) and intuitively (5). Point 5 is risky because if phenomenal concepts are grounded in simulation capacities (as per Point 4), losing the capacity (Fading-Mary) usually implies losing the concept. If she loses the concept, she loses the proposition.
  **What gives:** **Drop Point 5.** It is not doing necessary work. Point 2 is sufficient to refute the Ability Hypothesis. Point 5 introduces a vulnerability regarding concept possession that you don't need to defend. If you keep it, treat it as a separate intuition pump, not a consequence of 2.

  ### 2. The Semantic Tension (Severity: Medium)
  **Conflict:** Point 2 (Propositional) vs. Point 6 (Ineffable)
  **The Problem:** Propositions are the currency of communication; ineffability denies communication.
  If Mary gains *propositional* knowledge, she grasps a truth with conditions. Standard philosophy of language holds that propositions are shareable (in principle). If her knowledge is truly *ineffable* (not just "hard to describe" but impossible to convey), it suggests the content is private in a way that threatens Physicalism (Point 3). It starts to look like a private object, which smells of dualism.
  **What gives:** **Qualify Point 6.** Change "Ineffable" to "Indexically Dependent." She can't tell the other scientists because they lack the *demonstrative referent* (the experience), not because the proposition itself is unshareable. She can say "Red looks like *this*," and anyone who has seen red understands. This preserves Physicalism and the propositional nature without implying magical private content.

  ### 3. The Explanatory Cost (Severity: Low)
  **Conflict:** Point 3 (Physicalism) vs. Point 4 (Phenomenal Concepts)
  **The Problem:** This is the standard "explanatory gap" objection (Chalmers). You acknowledge this ("That isn't a lacuna..."), so internally it is consistent. However, be prepared for the reading group to attack the coherence of Point 4. If the brain is physical, why are the concepts not deducible?
  **What gives:** **Nothing.** This is the price of admission for PCS. Just ensure you distinguish between *ontological* gaps (facts) and *conceptual* gaps (modes of presentation). You have done this, so hold the line.

  ### The Single Revision to Tidy Up the Most
  **Drop Point 5 (Fading-Mary).**

  **Why:**
  1.  **It stops the double payment.** You are currently paying for the anti-ability stance twice: once in theory (2) and once in edge-cases (5).
  2.  **It protects Point 4.** Fading-Mary threatens the link between experience and concept possession. If she loses the capacity to simulate red, does she really still possess the *phenomenal* concept? It's safer to say she retains a *memory belief* ("Red looked like X") rather than active phenomenal knowledge.
  3.  **It strengthens Point 2.** By removing the controversial Fading-Mary case, your claim that "Knowledge ≠ Ability" rests on stronger, standard ground (the distinction between knowing *that* and knowing *how*) rather than a fringe memory case.

  ### Summary of Status
  *   **Points 1, 3, 4:** **Fine.** This is a coherent PCS core.
  *   **Point 2:** **Keep,** but decouple from Point 5.
  *   **Point 5:** **Cut.** It doesn't follow from 2 and creates unnecessary friction with 4.
  *   **Point 6:** **Soften.** Shift from "Ineffable" to "Acquaintance-Dependent" to avoid dualist implications against Point 3.

  If you make that single cut (Point 5), the "paying twice" feeling should vanish, because you stop arguing for the independence of knowledge from ability in two different registers.
