prompt: |-
  Next week I'm presenting at a political theory workshop (about 20 min of Q&A) the paper I've been stuck on for a year, and I need a prep sheet, not a defense of the view.

  The thesis: compromise between two value systems isn't just second-best to one side winning — it can be a genuine Pareto improvement, because each side can give ground where its values are flat and take ground where they're steep. I call that slope "concession elasticity": what it costs you, by your own lights, to give up a bit more on some dimension. Two things I actually argue: (1) split-the-difference compromise is usually Pareto-dominated by a logroll where each side concedes what's cheap for it; (2) the integrity worry — that compromising corrupts you — bites hardest when you concede on dimensions that are steep for you, which is exactly what the model says not to do. There's also a shaky section claiming elasticity is endogenous, that conceding on a dimension makes later concessions there cheaper, so value systems drift toward each other, and I can't tell whether that's a bug in the model or my real answer to the integrity objection.

  The room: two luck egalitarians, a couple of Rawlsians, one Raz-style pluralist who thinks incommensurability goes deep, someone who works on dirty hands and political realism, and a mechanism-design economist who'll be bored until anything about incentives comes up.

  Give me the objections I'll actually get, in their vocabulary, ordered by how much damage they'd do, each with a couple of sentences I could say out loud and an honest note on where the reply is soft. I definately want the economist's: if each side privately knows its own elasticities, everyone wants to overstate how much they care, and then no bargaining rule is efficient, voluntary, and proof against lying at once — which would mean my gains from trade are unreachable in principle, not merely hard. Don't hedge and don't hand me a balanced menu: tell me which objection really sinks the paper if I can't answer it, which two I should concede in the first two minutes, and include the one I'm hoping nobody asks (I have a feeling it's some version of "would your框架 have told abolitionists to trade with slaveholders"). No reading list — I know the literature, I need the moves.
