answer: |-
  This is a sophisticated dispute because it locates a classic metaphysical debate (the Knowledge Argument) inside a concrete institutional practice (medical pedagogy). Your intuition is correct: the existence of clinical rotations does not *strictly* entail the truth of the Knowledge Argument, but your friend's intuition is also understandable because the practice *feels* like it's about accessing something ineffable.

  Here is a reconstruction of the epistemology, an analysis of what the practice presupposes, a concrete redesign based on the Ability Hypothesis, and an assessment of where the reasoning might fail.

  ### 1. Reconstructing the Implicit Epistemology

  There are three distinct models of what medical training is doing when it mandates hands-on experience.

  **Model A: The Fact-Transmission Model (Your Friend / Knowledge Argument)**
  *   **Premise:** There are propositional facts about phenomena (e.g., "what a murmur sounds like") that are logically distinct from physical/functional descriptions.
  *   **Mechanism:** Exposure to the phenomenon causes the brain to apprehend a new truth value.
  *   **Goal:** To populate the physician's mind with "phenomenal facts" that are necessary for correct diagnosis.
  *   **Implication:** A textbook is ontologically incomplete. It lacks the "quale" required for the fact to exist in the mind.

  **Model B: The Ability-Acquisition Model (You / Ability Hypothesis)**
  *   **Premise:** All physical facts are available in text/data. "Knowing what it's like" is not knowing a fact, but possessing a suite of cognitive capacities (recognize, imagine, recall).
  *   **Mechanism:** Repetitive exposure tunes the neural weights for pattern recognition under noisy conditions.
  *   **Goal:** To build a high-dimensional "similarity space" allowing the physician to map variable inputs (noisy room, odd anatomy) to the correct category.
  *   **Implication:** Textbooks are informationally complete but computationally inefficient for real-time processing. Experience is compression and indexing, not new data.

  **Model C: The Calibration Model (Your TA / Epistemic Humility)**
  *   **Premise:** The problem is not just knowing the signal, but knowing the noise floor of one's own perception.
  *   **Mechanism:** Failure and feedback loops teach the physician the limits of their own sensory reliability.
  *   **Goal:** Meta-cognitive accuracy (knowing when you don't know).
  *   **Implication:** Experience is required not to learn the murmur, but to learn how often you mistake a breath sound for a murmur.

  ### 2. Strict Presupposition vs. Mere Compatibility

  Does the hands-on requirement *need* Model A (Qualia/Facts) to make sense? **No.**

  **What the practice strictly presupposes:**
  1.  **Causal Interaction:** The trainee must be causally coupled to the phenomenon. Light must hit the retina; sound waves must hit the eardrum; tissue resistance must hit the fingertips.
  2.  **Variability:** The training environment must exhibit the statistical variance of the real world (noise, artifacts, comorbidities).
  3.  **Feedback:** There must be a ground-truth verification mechanism (e.g., surgery confirms the palpation diagnosis).

  **What merely fits well:**
  Model A fits well *phenomenologically*. It feels like we are learning "secrets" of experience. However, Model B (Ability) licenses the exact same training regime. If the goal is to tune a pattern-recognition system (the brain), you need training data. Textbooks provide labeled, clean data. Patients provide unlabeled, noisy data. A machine learning model needs both to generalize. It does not need to "feel" the data to learn from it; it needs to process the data to adjust its weights.

  **The Consistency Check (Text vs. Touch):**
  You noted an inconsistency: *Why mandate touch for common conditions but allow text/AI for rare ones?*
  This is not inconsistent under Model B or C. It is a **Risk/Signal Trade-off**.
  *   **Common Conditions:** High prevalence means you *can* get hands-on data without waiting decades. The risk of misdiagnosis during learning is manageable. The "noise" of real patients is the primary hurdle, so you train on noise.
  *   **Rare Conditions:** You cannot wait for a trainee to encounter 50 cases of Wilson's disease. The "signal" (textbook description) is strong enough because the variance is low (you take what you can get).
  *   **AI/Guidelines:** These act as priors. You use them when the cost of gathering empirical data (waiting for a patient) exceeds the risk of relying on the prior.

  The institution is not inconsistent; it is **Bayesian**. It uses text for priors (rare diseases) and experience for likelihood updates (common diseases where data is cheap).

  ### 3. Concrete Redesign: Taking the Ability View Seriously

  If we explicitly reject Model A (no new facts, only abilities) and design a curriculum based strictly on Model B (Ability/Physicalism) and Model C (Calibration), here is what changes:

  **What you would KEEP (for non-conscious reasons):**
  1.  **High-Fidelity Simulation:** If the goal is pattern recognition, a perfect haptic/visual simulator is superior to a real patient. Real patients are ethically constrained and variable in unhelpful ways. If ability is the goal, you keep the *challenge*, not the *biology*.
  2.  **Blind Testing:** You keep the requirement to diagnose without looking at the chart. This tests the ability to recognize patterns, not the ability to read text.
  3.  **Calibration Drills:** You keep procedures where the trainee must estimate their confidence interval. (e.g., "I am 80% sure this is appendicitis"). This serves Model C.

  **What you would GET RID OF (or radically alter):**
  1.  **"Apprenticeship" as Mystical Transmission:** You would stop framing rounds as "learning the art." You would frame them as "data augmentation."
  2.  **Patient Risk during Learning:** Under Model A, there is a temptation to think the student *needs* to feel the real thing to get the "fact." Under Model B, if a simulator provides the same haptic resistance and auditory profile, the real patient is unnecessary. You would drastically reduce invasive procedures on real patients during the learning phase.
  3.  **Time-Based Competency:** "See 50 deliveries" is a Model A metric (accumulating exposure). A Model B metric is "Pass 50 simulated deliveries with varying complications." If the ability is demonstrated, the physical exposure is irrelevant.
  4.  **The "Bedside Manner" Justification:** Often, hands-on training is defended as teaching empathy (a phenomenal state). If we are strict physicalists about ability, empathy is a behavioral output. Training would shift to communication scripts and outcome metrics rather than "learning to feel for the patient."

  **The Net Result:** The curriculum becomes more like flight school. Less time on real bodies, more time in hyper-realistic simulators, with certification based entirely on performance metrics rather than "hours logged" or "cases seen."

  ### 4. What Would Change My Mind?

  To move from "Ability Hypothesis" to "Knowledge Argument" (or vice versa) regarding medical training, I would look for the following evidence:

  **Evidence for the Friend (Qualia/Facts are Real):**
  *   **The Perfect Sim Failure:** If we created a simulation that was physically indistinguishable from a real patient (perfect haptics, acoustics, visual fidelity) and trained Group A on Sims and Group B on Real Patients, and Group B significantly outperformed Group A *specifically on real patients*, it would suggest there is a causal link between the *biological reality* and the *diagnostic capacity* that simulation cannot capture. This would support the idea that the "fact" is tied to the specific ontological status of the living tissue, not just the sensory data.
  *   **The Ineffable Correction:** If a senior doctor could correct a junior not by pointing to data ("you missed the S3 sound") but by saying "it doesn't *feel* right," and this correction reliably leads to success where data-based correction fails, it suggests a non-propositional fact is being transferred.

  **Evidence for Me (Ability/Physicalism is Sufficient):**
  *   **Total Simulation Replacement:** If a medical school graduated students trained *exclusively* on high-fidelity VR/Haptics (zero real patient contact until licensure) and their patient outcomes (mortality, misdiagnosis rates) were statistically identical to traditional graduates, it would prove the "hands-on" requirement was never about the *reality* of the patient, but the *data structure* of the interaction. This would confirm Model B.
  *   **AI Diagnostic Supremacy:** If an AI with no sensory organs (processing only digitized data) consistently outperforms human clinicians in diagnosis, it proves that "experiential facts" are not necessary for optimal medical function. The "feeling" is a heuristic, not a fact-grabber.

  ### 5. Where My Reasoning Might Go Wrong

  I must identify the weak points in the argument above:

  1.  **The "Physical" Equivocation:** I am treating "physical data in a book" and "physical data hitting the retina" as equivalent inputs. They are not. A spectrogram of a heart murmur is physical data, but it is *processed* data. Listening to the heart is *raw* data acquisition. The Ability Hypothesis holds, but I may be underestimating the bandwidth loss in translation. The friend might be right that the *channel* matters, even if the *ontology* doesn't.
  2.  **The Patient's Consciousness:** Medical training isn't just about the doctor's mind; it's about the interaction of two conscious beings. If the patient's experience (pain, anxiety) alters the physiological presentation (heart rate, muscle tension), then ignoring the "phenomenal" aspect of the interaction leads to bad data. The "hands-on" requirement might be necessary not because the *doctor* needs qualia, but because the *patient's* qualia affect the physics of the body being examined.
  3.  **Tacit Knowledge vs. Qualia:** I might be conflating Polanyi's "Tacit Knowledge" (things we know but can't articulate) with Jackson's "Qualia" (subjective experience). You can be a physicalist and still admit that some knowledge is non-propositional. My friend might be using "fact" loosely to mean "non-propositional knowledge," in which case they are right, and I am fighting a semantic battle.
  4.  **The Ethical Component:** Medical training is moral formation, not just epistemic training. "Seeing one, doing one, teaching one" creates responsibility. Removing the risk to real patients (via simulation) might produce better technicians but worse moral agents. If the "hands-on" requirement is actually a rite of passage to inculcate the weight of responsibility, then both the Fact and Ability models miss the point entirely.

  **Conclusion:**
  Your friend is mistaking a **bandwidth limitation** for a **metaphysical limit**. The textbook cannot convey the noise, variance, and causal texture of the clinic. But that doesn't mean there are "non-physical facts." It means physical facts are too high-dimensional to be fully compressed into language. The training regime presupposes **causal coupling**, not **phenomenal revelation**. You can keep the rotations without buying into dualism, provided you view them as high-bandwidth data ingestion and calibration drills rather than the transmission of magical experiential truths.
