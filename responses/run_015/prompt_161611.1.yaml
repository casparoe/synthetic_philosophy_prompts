answer: |-
  Here is the correspondence table for your colleague's analogy, mapping the corporate structure onto the macroeconomic framework.

  | Market Economy | Corporate Firm (Colleague's Model) | Socialist Economy (Lange) |
  | :--- | :--- | :--- |
  | **Price** | Transfer Price / Shadow Price | Accounting Price (Central Board) |
  | **Profit** | Divisional P&L / Budget Variance | Fulfillment of Plan Rules |
  | **Entrepreneur** | Divisional Manager | Plant Manager |
  | **Shareholder** | Head Office / CFO | The State / Central Board |
  | **Bankruptcy** | Reorganization / Layoffs / Budget Cut | Plan Adjustment / Reallocation |
  | **Takeover** | Hostile Bid (External) / Restructuring (Internal) | Political Revocation / Reform |

  This mapping looks robust superficially, but the disanalogies determine whether the analogy supports his conclusion. Here is the audit of the three specific mechanisms you raised.

  **1. Authority vs. Contracting**
  Your colleague treats the firm as a command hierarchy, but the Coasean view suggests the firm is a nexus of contracts. If the line that "a firm has no more authority than your grocer" holds, then internal planning is not a substitute for markets but a product of them. Employment contracts are voluntary; the "quit" option acts as a market exit price for labor. Managers exercise fiat only within the bounds of what labor markets allow. In a socialist economy, there is no external labor market to set the opportunity cost of the worker's time, and exit is restricted. If the firm is merely contracting all the way down, it describes a market phenomenon, not a planning prototype. The firm exists *because* external markets reduce the transaction costs of internal command; remove the external market, and the cost of command exceeds its benefit, causing the firm to dissolve.

  **2. The Analogue of Failure**
  In a firm, internal prices remain informative because losses threaten the division's existence or the manager's career. However, losses are ultimately absorbed by Head Office. In a socialist system, the Central Board is the Head Office, but there is no higher authority to absorb losses or discipline the Board. This creates a "soft budget constraint." Without the threat of genuine bankruptcy—where assets are liquidated and ownership transferred—internal prices become accounting fictions. Your colleague's upgrade (internal shares) fails here because internal shares lack residual claimancy on external assets. Managers trade points, not ownership. Without the possibility of hostile takeover from outside the system, bad allocation decisions are never purged; they are merely reorganized. The mechanism that makes prices informative is the threat of exit, which is absent at the systemic level.

  **3. External Discipline of the Internal Capital Market**
  This is the decisive disanalogy. A multidivisional firm runs an internal capital market successfully only because Head Office is disciplined by an external capital market. The CFO allocates capital between divisions based on the opportunity cost of capital determined by stock prices, bond yields, and competitor performance. Head Office knows a division is underperforming because external benchmarks exist. If the firm *is* the entire economy, there is no external benchmark. There is no stock price to signal whether the R&D pipeline is valued correctly, only internal consensus. The internal capital market is not a counterexample to Mises; it is a subsystem that imports information from the environment it sits in. Remove the external market, and the internal allocation mechanism loses its compass.

  **Verdict**
  Your colleague's conclusion does not survive. The firm analogy actually demonstrates the opposite of what he intends: islands of planning are viable only within a sea of markets. The firm is not a model for a socialist economy; it is a model for how markets enable localized coordination. The "engine" of the firm only works because of the "water" it floats in.

  A better analogy is the **submarine**. A submarine operates under different physical rules than the surface (pressure, navigation), and inside, command is absolute. However, it cannot generate its own oxygen or fuel; it must surface or return to port (the market) to replenish. Furthermore, its navigation systems are calibrated against external stars or GPS. A submarine cannot operate indefinitely submerged, nor can it navigate without external reference points. Similarly, firms can plan internally only because they plug into external markets for labor, capital, and validation. A socialist economy attempts to be a submarine that never surfaces and ignores the stars; it doesn't matter how efficient the internal engine is if it cannot verify its position or replenish its resources against real costs. The existence of the firm proves that planning has a niche, but the niche is defined by the market boundaries it cannot cross.
