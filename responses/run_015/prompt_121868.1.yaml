  # The Value Integrity Protocol (VIP)

  **Purpose:** To help field staff distinguish between legitimate cultural compromise and ethical corrosion when partnership proposals conflict with organizational human-rights standards.
  **Time Required:** 30 Minutes
  **User:** Program officers and ethics reviewers without philosophy training.

  ## Part 1: The Checklist

  **Step 1: Define the Conflict (5 Minutes)**
  *   **Question:** What specific organizational value conflicts with what specific local practice?
  *   **Sufficient Answer:** A single sentence stating the clash (e.g., "Our value of X conflicts with their requirement of Y").
  *   **Insufficient Answer:** Vague statements like "They have different culture" or "It feels wrong."
  *   **Action:** Write this down. If you cannot articulate the specific values, stop and consult a senior manager.

  **Step 2: The Core Value Test (5 Minutes)**
  *   **Question:** Is the organizational value at stake listed in our "Non-Negotiables" (e.g., bodily autonomy, non-discrimination, freedom from violence)?
  *   **Sufficient Answer:** "Yes, it is in the handbook" or "No, it is a operational preference."
  *   **Hard No:** If the value is a Non-Negotiable and the local practice violates it directly, stop. Do not proceed to Step 3.
  *   **Hand-Off:** If the value is not listed but feels fundamental, escalate to the Ethics Committee. Do not decide alone.

  **Step 3: The Instrumentality Check (10 Minutes)**
  *   **Question:** Are we treating a Core Value as a tool to get something else, or is the Core Value the goal itself?
  *   **Sufficient Answer:** "We are protecting the value for its own sake" OR "We are adjusting a procedure, not the principle."
  *   **Flag (Corruption Costume):** If you find yourself saying, "We only care about X so we can get Y," you are likely disguising a core commitment as an instrumental one. This is a Hard No.
  *   **Flag (Exchange Rate):** If you are trying to quantify rights (e.g., "100 girls educated equals 1 restriction on speech"), stop. Rights do not have exchange rates. This is a Hand-Off to senior leadership.

  **Step 4: The Harm/Benefit Ledger (5 Minutes)**
  *   **Question:** Who bears the cost of the compromise, and who gets the benefit?
  *   **Sufficient Answer:** Specific groups identified (e.g., "Unmarried women bear the cost; the clinic gets space").
  *   **Hard No:** If the group bearing the cost is a protected class (women, minorities, children) and the benefit is purely organizational (budget, ease of access), stop.
  *   **Hand-Off:** If both sides gain tangible benefits without violating Non-Negotiables, proceed to Step 5.

  **Step 5: The Reversibility Test (5 Minutes)**
  *   **Question:** Would we accept this compromise if the local partner were in our headquarters and we were in the field?
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Hard No:** If the answer is "No," the compromise is likely exploitative.
  *   **Decision:** If all flags are clear, document the rationale and proceed. If any Hard No triggered, reject the proposal. If any Hand-Off triggered, send to Ethics Committee.

  ## Part 2: Known Failure Flags
  *   **The "Greater Good" Trap:** This tool cannot calculate whether violating one right saves many lives. That is a philosophical calculation, not a checklist. If the proposal argues "violate rights to save lives," hand off to leadership.
  *   **The "Local Ownership" Disguise:** Sometimes staff label a core value as "Western imposition" to avoid conflict. If you suspect you are dismissing a universal right as cultural imperialism, hand off.
  *   **The Fatigue Factor:** If you are tired, under budget pressure, or desperate for a win, this tool will misfire. Do not use this protocol under extreme deadline pressure without a second reviewer.

  ***

  ## Part 3: Case Applications

  ### Case 1: Gender-Segregated Meetings vs. Girls' School Access
  *   **Step 1 (Conflict):** Our value of gender integration conflicts with the council's requirement for segregated meetings.
  *   **Step 2 (Core Value):** Gender equality is a Core Value, but is *seating arrangement* the core value or the *access to education*? Education access is the primary goal; segregation is a procedural constraint.
  *   **Step 3 (Instrumentality):** We are not treating equality as a tool; we are treating meeting logistics as flexible to secure the core goal (education).
  *   **Step 4 (Harm/Benefit):** Girls gain education (high benefit). Women bear the cost of segregation (moderate cost, safety potentially increased).
  *   **Step 5 (Reversibility):** Would we accept segregated seating in a donor meeting to secure funding for schools? Likely yes.
  *   **Outcome:** **Conditional Go.** Proceed if segregation does not imply inferiority (e.g., equal resources in both rooms) and is reviewed annually.

  ### Case 2: Restorative Justice (Compensation) vs. Verbal Apology
  *   **Step 1 (Conflict):** Our value of acknowledged accountability (apology) conflicts with local practice of material compensation without verbal admission.
  *   **Step 2 (Core Value):** Accountability is core, but the *form* (words vs. goods) is operational.
  *   **Step 3 (Instrumentality):** We are not trading away accountability; the compensation *is* the acknowledgment in this context.
  *   **Step 4 (Harm/Benefit):** Victim receives restitution (benefit). Perpetrator avoids public shaming (benefit). No rights violated.
  *   **Step 5 (Reversibility):** Would we accept financial restitution instead of an apology in a legal settlement? Yes.
  *   **Outcome:** **Go.** This is a valid cultural trade-off where the underlying value (justice) is met through different means.

  ### Case 3: Family Planning Restrictions vs. Free Clinic Space
  *   **Step 1 (Conflict):** Our value of non-discriminatory reproductive health access conflicts with the religious leader's requirement to counsel married couples only.
  *   **Step 2 (Core Value):** Non-discrimination and bodily autonomy are Non-Negotiables in our handbook.
  *   **Step 3 (Instrumentality):** **FLAG RAISED.** If we accept this, we are treating unmarried women's health rights as instrumental to securing clinic space. We are effectively saying, "Your right to access is less valuable than our need for a building." This fits the "Corruption Costume" definition.
  *   **Step 4 (Harm/Benefit):** Unmarried women bear the cost (denied care). The NGO gets the benefit (free space).
  *   **Step 5 (Reversibility):** Would we accept a donor who said, "We will fund you only if you deny services to minorities"? No.
  *   **Outcome:** **Hard No.** The procedure rejects the partnership.
  *   **Why You Will Hate This:** This outcome validates your colleague's zero-sum theory. You lose the clinic space, potentially reducing overall health access in the region, because the ethical cost was too high. It forces you to choose between clean hands and tangible impact, proving that not every conflict can be traded away.

  This protocol helps staff separate flexible operations from rigid rights, though it cannot resolve the pain of losing resources when ethics demand a hard stop.
