      *   *Crucial Insight:* (6) is the bridge. LLMs (5) learn from *massive* data. Home sign (6) creates structure from *degraded/no* data. This distinguishes the human biological capacity from the statistical learner. This saves (1) (humans need less/different data) and (4) (it's biological) and sidesteps (5) (LLMs are different).

  8.  **Structure of the Response:**
