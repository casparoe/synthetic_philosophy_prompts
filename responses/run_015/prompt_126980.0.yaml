      *   **(3) Developmental Innateness:** Innateness = canalization/buffering against environmental variation. Degree, not binary. *Core: Waddington-esque definition.*
      *   **(4) Substantive Nativism:** Must be about biological nature, not just "learner needs bias." *Core: Anti-empiricist/anti-connectionist trivialization.*
      *   **(5) LLM Challenge:** LLMs learn structure from raw text without hand-coded syntax. Falsifies claim that structure can't be extracted from signal. *Core: Empirical challenge to POS.*
      *   **(6) Resilience Evidence:** Degraded input (home sign, creolization) leads to structured output. Robustness is the *real* argument, not POS. *Core: Argument from emergence/stabilization.*
