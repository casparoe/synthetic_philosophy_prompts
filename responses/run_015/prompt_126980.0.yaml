      *   *Severity 2: (1) vs (6).* User says (1) is the argument, but (6) moves them. *Fix:* Make (6) the evidence for the biological constraint required by (1). (1) sets the logical space, (6) fills the biological reality.
      *   *Severity 3: (4) vs (7).* User wants to defend Nativism (4) but retire Innateness (7). *Fix:* Define Nativism as the claim about biological specificity (4) without using the loaded term "Innate" (7). This is doable but requires careful wording.
