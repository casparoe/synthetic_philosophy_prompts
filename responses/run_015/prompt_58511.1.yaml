          4.  If we don't have the kid, that missing happiness is not bad, because there is no one there who is deprived of it.
          5.  Conclusion from 1-4: Bad stuff counts against creating, good stuff does not count in favor.
          6.  Conclusion from 5: Even for a likely happy life, there is moral reason not to create and no moral reason to create.
