answer: |-
  Your intuitive verdicts are remarkably stable, and the tension you feel regarding the Financial Advisor versus the Negotiator is the precise pressure point where most philosophical accounts of manipulation fracture. Your tentative principle focuses on the *mechanism* (sub-personal bypass vs. reason-responsive), but as you noted, both the Advisor and the Negotiator use the same mechanism (loss-aversion framing). Therefore, the mechanism alone cannot be the differentiator.

  You do not need to overturn any of your verdicts. However, you must refine your principle to shift focus from the *process* of influence to the *teleology* (the end goal) of the influence relative to the agent's own agency.

  ### The Refined Principle: Agency-Alignment

  I propose replacing your tentative principle with the **Agency-Alignment Principle**:

  > **Influence is manipulative when it exploits sub-personal cognitive mechanisms to induce a choice that diverges from the agent's reflective interests, primarily to serve the influencer's ends. Influence is legitimate when it engages cognitive mechanisms (including emotional or heuristic ones) to facilitate the agent's reflective interests or expand their understanding, even if the influencer benefits incidentally.**

  This principle retains your insight about "sub-personal mechanisms" but adds a crucial constraint: **Whose reflective interests govern the outcome?**

  #### Resolving the Advisor/Negotiator Puzzle
  Under this principle, the distinction is not the institutional role *per se*, but the **alignment of interests** that the role signifies.

  *   **The Financial Advisor:** The client's reflective interest is wealth preservation (hence the loss aversion). The advisor's framing ("protecting capital") aligns the presentation with the client's *own* stable goal. The advisor uses the bias to help the client overcome presentation noise to achieve the client's own end. The influence is **symbiotic**.
  *   **The Negotiator:** The counterparty's reflective interest is maximizing value. The negotiator's framing ("avoiding a worse deal") leverages the bias to make the counterparty concede *more* value than their reflective interest would dictate, serving the negotiator's end. The influence is **parasitic**.

  The difference is not merely "intent" (which is hidden) but the **structural direction of the benefit**. In the Advisor case, the bias is used as a scaffold to support the agent's will. In the Negotiator case, the bias is used as a lever to move the agent's will against its own grain.

  #### Applying the Principle to Your Other Cases
  *   **The Novelist:** Legitimate. The emotional bypass serves the reader's interest in aesthetic experience and moral understanding. The reader's reflective self endorses the emotional journey as valuable, even if their rational self wouldn't choose sympathy for an "unpopular moral view" in a vacuum.
  *   **The Physician (Hidden Figures):** Manipulative. The suppression of data creates a divergence between the patient's choice and what they would choose with full information (their reflective interest), serving the physician's end (getting consent for surgery).
  *   **The Marketing Team:** Manipulative. Targets high impulsivity to sell products the user's reflective self likely does not need (divergence of interest), serving the corporation's end.

  ### The Therapist Case: A New Category

  Now, consider the therapist using VR exposure with unconscious biometric calibration.

  **Verdict:** This is **Legitimate Therapeutic Intervention** (specifically, *Benevolent Engineering*), distinct from both manipulation and persuasion.

  **Analysis:**
  1.  **Mechanism:** It uses sub-personal mechanisms (biometric feedback loops) without conscious perception.
  2.  **Interest Alignment:** It serves the patient's reflective interest (overcoming a phobia that limits their life).
  3.  **The Crucial Feature:** **Restoration of Agency vs. Exploitation of Pathology.**

  In manipulation (like the Negotiator or Marketing), the influencer exploits a *feature* of healthy human psychology (loss aversion, impulsivity) to create a *deficit* in agency (making you choose against your interest).

  In this therapy case, the patient suffers from a *pathology* (phobia) that is itself a sub-personal hijacking of agency. The therapist uses a sub-personal tool to *counteract* the pathological hijacking. The "bypass" of conscious perception is not to sneak past the patient's rational will, but to recalibrate the physiological system that is *blocking* the patient's will.

  **The Consent Nuance:**
  You noted the patient consented to therapy but not the *specific algorithmic calibration*. Does this make it manipulative?
  *   If the calibration is **standard of care** (medically necessary for efficacy), the general consent covers it, much like a patient consenting to surgery consents to the specific use of a scalpel without knowing the exact angle of every incision. This remains **Legitimate**.
  *   If the calibration is **experimental** or unnecessarily opaque, it drifts toward **Paternalism**. It is not manipulation in the parasitic sense (the therapist isn't gaining at the patient's expense), but it violates the norm of transparency required for full agency restoration.

  **Driving Feature:** The verdict turns on whether the sub-personal influence is **corrective** (fixing a broken agency mechanism) or **exploitative** (hijacking a functional agency mechanism). The therapist is correcting; the negotiator is exploiting.

  ### Summary of the Account

  You can maintain all your intuitive verdicts without relying on "institutional role" as a brute fact. Instead, view roles as proxies for **Interest Alignment**.

  1.  **Manipulation:** Parasitic alignment. Uses sub-personal levers to make the agent act against their reflective interest for the influencer's gain. (Negotiator, Marketing, Friend, Hiding Physician).
  2.  **Legitimate Persuasion:** Symbiotic alignment. Uses levers (rational or emotional) to help the agent act in accordance with their reflective interest or expand their understanding. (Advisor, Debate Coach, Novelist, Transparent Physician).
  3.  **Therapeutic Intervention:** Restorative alignment. Uses sub-personal levers to repair the agent's capacity for agency itself. (Therapist).

  Your tentative principle failed the Advisor/Negotiator test because it judged the *weapon* (loss aversion framing) rather than the *hand holding it* (whose interest is served). By shifting to **Agency-Alignment**, the pattern becomes coherent.
