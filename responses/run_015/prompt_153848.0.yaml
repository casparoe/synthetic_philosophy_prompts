answer: |-
  Your intuition is spot on. While your friend's summary captures the *basic structure* of traditional Just War Theory (JWT), it contains a significant misrepresentation regarding the moral responsibility of soldiers, and it conflates legal contracts with philosophical liability.

  Michael Walzer's *Just and Unjust Wars* (1977) is the definitive text for the view your friend is describing, but the summary you were given simplifies Walzer to the point of distortion in key areas.

  Here is a breakdown of what is accurate, what is a simplification, and what is a misrepresentation.

  ### 1. The Core Claim: Moral Equality of Combatants
  **Verdict: Accurate (with caveats)**

  Your friend is correct that the "standard view" (often called the **Separation Thesis**) argues for a distinction between:
  *   ***Jus ad bellum***: The justice of going to war (who started it, is the cause just?).
  *   ***Jus in bello***: Justice within the war (how soldiers fight).

  Walzer argues that for practical and moral reasons, we must separate these. Even if Country A is the aggressor (*unjust ad bellum*), their soldiers are generally considered moral equals to Country B's soldiers (*in bello*). They both have a "right to kill" enemy combatants, and both are liable to be killed.

  **Why?** Walzer argues that individual soldiers are not responsible for the state's decision to go to war. They are coerced by conscription, patriotism, or social pressure. To hold them morally responsible for the war's origin would make war impossible to regulate and would punish individuals for the crimes of their leaders.

  ### 2. The Boxing Analogy and "Signing a Contract"
  **Verdict: Simplification / Metaphorical Mix-up**

  The boxing analogy is a common way to explain this in intro classes, but it is not Walzer's primary argument.
  *   **The Nuance:** Walzer doesn't argue soldiers sign a literal contract forfeiting their rights. He argues that by posing a **threat** to others, soldiers make themselves **liable** to defensive force.
  *   **The Uniform:** Wearing a uniform isn't "signing a contract" to accept death; it is a signal of status. It distinguishes the combatant (who is a threat and liable to attack) from the civilian (who is not a threat and is immune).
  *   **The Error:** Your friend implies that by enlisting, you waive your moral judgment. Walzer does not argue that enlistment waives your humanity or your ability to recognize evil.

  ### 3. The "Hidden Weapons" and Breaking Equality
  **Verdict: Accurate (mostly International Law)**

  Your friend is correct here, though this blends Walzer with International Humanitarian Law (IHL).
  *   **Perfidy:** If a soldier hides their status (no uniform, hiding weapons, feigning surrender), they commit *perfidy*.
  *   **Consequence:** They lose the protections of the "War Convention." They can be treated as criminals or spies rather than Prisoners of War (POWs).
  *   **Walzer's View:** Walzer supports this distinction. The "equality" of combatants relies on mutual recognition. If one side hides among civilians or refuses to identify themselves, they endanger the civilian population and break the rules that grant soldiers the privilege of killing.

  ### 4. The Claim About Refusing to Fight and Punishment
  **Verdict: Major Misrepresentation**

  This is the part that felt "off" to you, and you are right to question it. Your friend's claim that *"if you get drafted into an unjust war and refuse to go, you should actually be punished... because the equality view means you already agreed to accept the risk"* is **not** Walzer's position.

  Here is why that is wrong:

  **A. The Nuremberg Exception**
  Walzer explicitly addresses this. While he generally supports the Moral Equality of Combatants, he argues there is a limit. If a war is **manifestly unjust** (e.g., a war of naked aggression or genocide, like Nazi Germany's wars), the "equality" dissolves.
  *   In such cases, soldiers on the unjust side are not moral equals. They are participating in a crime.
  *   Walzer supports the **Nuremberg Principle**: "I was just following orders" is not a valid moral defense for participating in a manifestly unjust war.

  **B. Conscientious Objection**
  Walzer argues that states *should* recognize a right to conscientious objection. He acknowledges that a soldier may face a conflict between their duty to the state and their moral judgment.
  *   **Legal vs. Moral:** Your friend conflates *legal* punishment with *moral* justification. A state might legally punish a deserter (to maintain army cohesion), but Walzer would not argue the soldier is *morally wrong* to refuse a manifestly unjust war.
  *   **The Contract:** Enlistment contracts are legal documents, not moral waivers. You cannot sign a contract agreeing to commit murder; similarly, Walzer argues you do not morally bind yourself to fight an unjust war simply by enlisting.

  **C. Conscription vs. Enlistment**
  Your friend's summary says, "if you get drafted... you should be punished for breaking the contract you signed when you enlisted." This is internally contradictory.
  *   If you are **drafted**, you did not sign an enlistment contract.
  *   If you are **voluntary**, you signed a legal contract, but Walzer argues moral duty supersedes legal contract in extreme cases.

  ### 5. Missing Context: The "Revisionist" Critique
  It is worth noting that your friend's summary represents the **Traditional View** (Walzer), but even that view is currently under heavy fire in modern philosophy.

  Philosophers like **Jeff McMahan** (in *Killing in War*) argue that the Moral Equality of Combatants is false.
  *   **McMahan's View:** If a war is unjust, the soldiers fighting it have **no right to kill**. They are essentially armed aggressors. Only the just side has the right to kill.
  *   **Why this matters:** If McMahan is right, your friend's entire premise is wrong. However, even under Walzer's *Traditional* view, your friend is still wrong about the "punishment for refusal" claim.

  ### Summary for Your Argument

  You can tell your friend:

  1.  **You were right to feel uneasy.** The claim that soldiers must be punished for refusing an unjust war is a distortion of Walzer. Walzer explicitly allows for "supreme emergencies" and manifest injustice where soldiers are *not* moral equals.
  2.  **The "Contract" is metaphorical, not legal.** Enlisting doesn't morally bind you to commit unjust acts. Walzer distinguishes between the *legal* duty to obey orders and the *moral* responsibility for manifest crimes (Nuremberg).
  3.  **The Boxing Analogy has limits.** In boxing, both parties consent to the rules. In war, soldiers on the unjust side are often coerced, and the "rules" are about minimizing suffering, not sport.
  4.  **Legal vs. Moral.** A state might legally punish a deserter, but Just War Theory does not claim that punishment is *morally justified* if the war itself is criminal.

  **The Bottom Line:** Your friend accurately described the *general rule* of Moral Equality (soldiers are usually treated as equals regardless of the cause), but they failed to describe the *exception* (manifestly unjust wars) and incorrectly turned a philosophical concept of "liability" into a legalistic "contract" that forbids moral objection.
