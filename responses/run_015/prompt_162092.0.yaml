prompt: |-
  I co-convene a fortnightly methods seminar that sits across a biology department and a philosophy department, and two of its regulars have been circling each other since the first session: one is a behavioural ecologist who treats optimality modelling and reverse-engineering as the correct default strategy for explaining any trait, and the other is a philosopher of biology working in the tradition of Gould and Lewontin's 1979 critique of the adaptationist programme, who thinks that default is a licence for unfalsifiable storytelling. I want to stop them talking past each other by asking them to produce one text they could both put their names to. Please draft it: an adversarial-collaboration joint statement between a self-described methodological adaptationist and a constraint-centred critic in the spandrels tradition. Do not cite anything or point me toward the literature — I want the arguments themselves, and the empirical case below is invented precisely so that nobody can win the exchange by citing a study.

  Format it as a numbered section of claims both can sign, followed by a disagreements table whose columns are: the disagreement stated neutrally; the formulation each side would accept for its own view; whether the dispute is genuine or merely verbal; the crux; a test, case or argument both accept as bearing on that crux; and each side's prediction recorded in advance. I want the agreed claims to include some that do real work rather than the usual both-selection-and-constraint-matter platitude: what each side grants about the evidential status of a well-fitting optimality model, about whether a non-selective null model for trait evolution is even formulable, and about the origination-versus-maintenance distinction, on which a trait can be currently useful and still have arisen as a byproduct. I also want the document to sort out the frequency question, since the claim that most traits are adaptations is ill-posed until you say how traits are individuated and sampled and until you pry apart architectural byproducts, later co-optations, developmental constraints and drift-fixed noise. Have the table say explicitly which disagreements are verbal — I suspect the word adaptationism is doing at least two different jobs — and which are substantive.

  Use this invented case as the shared test: a clade of 190 arboreal lizard species, 181 of which carry a helmet-like bony expansion of the skull roof. One hypothesis is that the helmet was built by selection for defence against conspecific biting; the other is that it is a spandrel of selection for bite force, later co-opted for display, because skull-roof area is geometrically entailed by jaw-adductor attachment area. Both parties accept as bearing on it: phylogenetic comparative correlations between helmet volume and adductor attachment area with body size controlled; the handful of species in which the two dissociate, with large adductors and no helmet or the reverse; whether helmet shape fits the optimum predicted by defence demands or by the geometric entailment; and a developmental-ablation result showing whether helmet formation depends on the muscle precursor. Record what each side predicts for each, and what each would concede if the result went against it. Finally, add a short closing section on where this document is most likely to be too tidy: which signed claim is load-bearing and would collapse under which finding, which side is more likely to rationalise away a disconfirming result, and whether any disagreement you marked as verbal is really substantive after all.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A fortnightly methods seminar bridging Biology and Philosophy.
      *   **Characters:**
          *   Person A: Behavioural Ecologist (Methodological Adaptationist). Believes optimality modelling/reverse-engineering is the correct default.
          *   Person B: Philosopher of Biology (Constraint/Spandrels Critic). Believes the adaptationist default leads to unfalsifiable storytelling (Gould & Lewontin tradition).
      *   **Task:** Draft a joint statement (adversarial collaboration) they can both sign.
      *   **Format:**
          1.  Numbered section of agreed claims (must do real work, not just platitudes).
          2.  Disagreements Table (Columns: Neutral Statement, Side A Formulation, Side B Formulation, Genuine/Verbal, Crux, Shared Test/Case, Side A Prediction, Side B Prediction).
          3.  Specific Content Requirements: Evidential status of optimality models, formulability of non-selective nulls, origination vs. maintenance, frequency question (individuation/sampling), architectural byproducts vs. co-optations vs. drift.
          4.  Specific Test Case: 190 arboreal lizard species, 181 with bony skull "helmets." Hypothesis 1: Defense (adaptation). Hypothesis 2: Spandrel of bite force (constraint/byproduct) later co-opted.
          5.  Data Points for Test Case: Phylogenetic correlations, dissociation cases, shape fit, developmental ablation.
          6.  Closing Section: Vulnerabilities (which claim collapses under what finding), rationalization risks, re-evaluation of "verbal" disputes.
      *   **Constraint:** Do not cite literature. Use the invented case.

  2.  **Deconstruct the Perspectives:**
      *   **Adaptationist (A):** Starts with function. If a trait exists, assume it was selected for *something*. Optimality models are strong evidence. Null models are hard to define. "Spandrels" are rare exceptions.
      *   **Critic (B):** Starts with constraints/history. Traits often arise from developmental architecture or drift. Optimality models are just-so stories unless constraints are ruled out first. "Spandrels" are common. Null models (e.g., drift, architectural entailment) are necessary baselines.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   *Goal:* Move beyond "both matter."
      *   *Claim 1 (Optimality Models):* A good fit isn't proof, but a bad fit is disproof. (Falsifiability).
      *   *Claim 2 (Null Models):* A non-selective null *is* formulable (e.g., drift or architectural entailment), but it requires specific parameters, not just "noise."
      *   *Claim 3 (Origination vs. Maintenance):* A trait can be maintained by selection now but originated as a byproduct. Current utility $\neq$ historical cause.
      *   *Claim 4 (Frequency):* "Most traits are adaptations" is meaningless without defining the unit of analysis (molecular vs. morphological) and the sampling method (clade-specific vs. universal).
      *   *Claim 5 (Burden of Proof):* The burden shifts. A starts with function, B starts with constraint. Evidence must move the needle from the prior.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Need to identify specific friction points.*
      *   *Disagreement 1: The Default Stance.* Is the null "no function" or "optimal function"?
      *   *Disagreement 2: Evidential Weight.* How much does a correlation count?
      *   *Disagreement 3: The Lizard Case (Specifics).*
      *   *Disagreement 4: Definition of Adaptationism.* Is it a heuristic or an ontological claim? (This addresses the "verbal" requirement).
      *   *Test Case Details:*
          *   Correlation: High correlation favors Spandrel (geometric entailment). Low favors Defense (independent optimization).
          *   Dissociation: Existence of large adductor/no helmet favors Defense (decoupled). Existence of helmet/no adductor favors Spandrel (if helmet follows adductor potential) or Defense (if helmet exists without muscle). Actually, if helmet is *entailed* by adductor, you shouldn't have helmet without adductor. You *might* have adductor without helmet if other constraints stop it.
          *   Shape Fit: Defense optimum vs. Geometric optimum.
          *   Ablation: Remove muscle precursor -> Helmet forms? (No = Spandrel/Entailment). Yes = Independent.
      *   *Predictions:*
          *   Adaptationist: Expects dissociation (function can exist without the constraint). Expects shape to match defense optimum. Expects ablation to show independence.
          *   Critic: Expects tight correlation (entailment). Expects shape to match geometric growth. Expects ablation to stop helmet.

  5.  **Drafting Section 3: Closing (Vulnerabilities):**
      *   *Load-bearing claim:* Probably the one about null models.
      *   *Rationalization:* Adaptationist might say "secondary modification." Critic might say "developmental plasticity."
      *   *Verbal vs. Substantive:* Is "Adaptationism" a research strategy or a claim about the world?

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Is the lizard case integrated? Yes.
      *   *Check:* Are the claims specific enough? Instead of "constraints matter," use "Architectural entailment constitutes a valid null hypothesis."
      *   *Check:* Is the table clear? Ensure the "Verbal/Substantive" column is populated thoughtfully. The definition of "Adaptationism" is often verbal (heuristic vs. truth claim), but the *application* is substantive.
      *   *Tone:* Academic, precise, collaborative but acknowledging tension.
      *   *Specific Constraint Check:* "Do not cite anything." "Invented case." "Numbered section." "Disagreements table." "Closing section."

  7.  **Final Review against constraints:**
      *   *Evidential status of optimality model:* Addressed in Claim 1.
      *   *Non-selective null formulable:* Addressed in Claim 2.
      *   *Origination vs. Maintenance:* Addressed in Claim 3.
      *   *Frequency question/individuation:* Addressed in Claim 4.
      *   *Lizard case predictions:* Included in Table.
      *   *Concessions:* Included in Table.
      *   *Vulnerabilities:* Included in Closing.

      *(Self-Correction on Lizard Logic)*: If the helmet is a spandrel of bite force (adductor area), then Helmet Size $\propto$ Adductor Area. If it's for defense, Helmet Size $\propto$ Predation Risk/Biting Pressure, potentially independent of Adductor Area.
      *   *Ablation:* If muscle precursor is removed, and helmet *still* forms, it's not entailed by the muscle (Favors Adaptationist). If helmet *fails* to form, it is entailed (Favors Critic).
      *   *Dissociation:* If we find species with huge adductors but no helmet, that challenges the "entailment" (geometric necessity) hypothesis, favoring Adaptationist. If we find helmet without adductors, that challenges the "defense" hypothesis (why have armor without the weapon?), unless the armor is vestigial. Actually, if helmet is *entailed* by adductor, you can't have helmet without adductor. You *can* have adductor without helmet if the bone doesn't ossify, but the geometric argument suggests the bone expansion *is* the attachment site. So, No Adductor + Helmet = Fatal for Spandrel theory. Large Adductor + No Helmet = Fatal for Spandrel theory (unless developmental suppression).
      *   *Refining Predictions:*
          *   Adaptationist: Predicts dissociation (function overrides geometry). Predicts ablation independence.
          *   Critic: Predicts tight correlation (geometry dictates form). Predicts ablation dependence.

      *(Refining the "Verbal" distinction)*: The word "Adaptationism" often confuses "Assume function to find it" (Heuristic) with "Most things are functions" (Ontological). This is a key verbal dispute that hides substantive methodological differences.

      *(Refining the "Null Model")*: The Adaptationist thinks a "random walk" is the null. The Critic thinks "developmental entailment" is the null. They need to agree that *a* null is needed, even if they disagree on *which* one.

      *(Final Polish)*: Ensure the voice sounds like two experts compromising without losing their edge.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
