  # JOINT STATEMENT ON EXPLANATORY DEFAULTS AND TRAIT ORIGINATION
  **Signed:** [Behavioural Ecologist] & [Philosopher of Biology]
  **Date:** [Current Date]
  **Subject:** Methodological Standards for Trait Explanation (Adaptation vs. Constraint)

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our priors differ regarding the prevalence of selection versus constraint, we agree on the following methodological and evidentiary standards. These claims are intended to prevent explanatory drift and ensure falsifiability in future seminar discussions.

  1.  **The Evidential Status of Optimality Models:** A trait's fit to an optimality model is necessary but not sufficient evidence for adaptation. A poor fit falsifies the specific adaptive hypothesis tested; a good fit merely warrants further testing against non-selective alternatives. We agree that "fit" alone does not distinguish between a trait shaped *for* a function and a trait that merely *permits* a function.
  2.  **Formulability of Non-Selective Nulls:** A non-selective null model is formulable and required. It is not sufficient to invoke "drift" as a vague alternative. The null must specify the expected trait distribution under specific constraints (e.g., developmental entailment, allometric scaling, or neutral drift given effective population size). The burden is on the critic to specify the constraint model, and on the adaptationist to demonstrate the trait deviates significantly from it.
  3.  **Origination vs. Maintenance:** We distinguish strictly between the *origin* of a trait and its current *maintenance*. A trait may have originated as a byproduct (spandrel) or via drift and subsequently been co-opted and refined by selection (exaptation). Current utility is evidence for maintenance, not origin. Claims of adaptation must specify whether they refer to the initial fixation or the current stabilizing selection.
  4.  **The Frequency Question and Individuation:** The claim "most traits are adaptations" is ill-posed without defining the unit of analysis. We agree that the frequency of adaptation depends on how traits are individuated (e.g., molecular nucleotides vs. gross morphology) and sampled (e.g., within a specific adaptive radiation vs. across the tree of life). We reject global frequency claims that do not control for phylogenetic non-independence and architectural coupling.
  5.  **Burden of Proof and Priors:** The adaptationist adopts the prior that a trait is functional until proven otherwise; the critic adopts the prior that a trait is a constraint/byproduct until proven otherwise. We agree that data must move the posterior probability significantly away from the respective prior to count as a resolution. Neither side may treat their prior as a conclusion.

  ## II. DISAGREEMENTS TABLE

  | Disagreement (Neutral) | Adaptationist Formulation (Side A) | Critic Formulation (Side B) | Verbal or Substantive? | The Crux | Shared Test / Bearing Evidence | Side A Prediction | Side B Prediction | Concession Conditions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Default Null** | The null hypothesis is random variation or drift; selection is the default explanation for non-random patterns. | The null hypothesis is developmental/architectural entailment; selection is the explanation only for deviation from structural necessity. | **Substantive** | Which model requires less parameterization to be accepted as the baseline? | **Lizard Case:** Phylogenetic correlation between helmet volume and jaw-adductor area (controlled for body size). | Correlation will be weak or moderate; helmet size varies independently to meet defense needs. | Correlation will be near-perfect (isometric); helmet size is geometrically locked to muscle attachment area. | **A:** If $r^2 > 0.9$, concede helmet is likely an architectural entailment, not a selected shield.<br>**B:** If $r^2 < 0.5$, concede helmet size is not geometrically necessitated by bite mechanics. |
  | **2. Dissociation Logic** | Functional decoupling is common; traits can be modified independently of their developmental partners if selection is strong enough. | Functional decoupling is rare; traits linked by developmental pathways will rarely dissociate unless the pathway itself evolves. | **Substantive** | The flexibility of developmental architecture under selection pressure. | **Lizard Case:** The handful of species where helmet and adductor area dissociate (e.g., large adductor/no helmet). | These outliers will show evidence of secondary loss or distinct ecological niches requiring different defense strategies. | These outliers will be measurement errors, pathologies, or show compensatory mechanisms preserving the geometric link. | **A:** If outliers are phylogenetically clustered and healthy, concede developmental constraint is stronger than assumed.<br>**B:** If outliers are robust and functional, concede developmental systems are more modular than assumed. |
  | **3. Shape Optimization** | Trait morphology will match the optimum predicted by the ecological function (e.g., impact resistance). | Trait morphology will match the optimum predicted by growth rules or geometric scaling (e.g., surface area minimization). | **Substantive** | Does morphology track ecological variables or developmental variables? | **Lizard Case:** Does helmet shape fit the "defense optimum" (blunt/thick) or "geometric optimum" (smooth expansion of roof)? | Shape fits defense optimum (thickened specifically at impact zones), even if geometrically inefficient. | Shape fits geometric optimum (smooth continuation of skull roof growth), even if suboptimal for defense. | **A:** If shape matches geometric growth but is poor for defense, concede form follows development, not function.<br>**B:** If shape is geometrically inefficient but optimal for defense, concede selection overrides developmental ease. |
  | **4. Developmental Dependence** | Genetic/developmental pathways can be co-opted; the presence of a precursor is not required for the trait if selection recruits new pathways. | The trait is causally dependent on the precursor; remove the inducing tissue, and the trait fails to form. | **Substantive** | Causal necessity of the proposed spandrel-source tissue. | **Lizard Case:** Developmental ablation of the jaw-adductor muscle precursor in embryos. | Helmet forms normally (recruited independent pathway). | Helmet fails to form or is severely reduced (dependent on muscle precursor signaling). | **A:** If ablation stops helmet formation, concede the helmet is developmentally entailed by the muscle.<br>**B:** If ablation leaves helmet intact, concede the helmet is developmentally independent of the muscle. |
  | **5. Definition of 'Adaptationism'** | Adaptationism is a research strategy: assume function to discover it. It does not claim everything *is* an adaptation. | Adaptationism is an ontological claim: it asserts that selection is the *primary* cause of form, often ignoring alternatives. | **Verbal (mostly)** | Whether the term describes a *method* or a *belief about nature*. | N/A (Conceptual clarification) | N/A | N/A | Both agree to specify "Methodological Adaptationism" vs. "Ontological Adaptationism" in future talk. |

  ## III. CLOSING: VULNERABILITIES AND TIDINESS

  This document is necessarily tidier than the science it governs. We identify the following points of fragility:

  **1. The Load-Bearing Claim:**
  Claim 2 (Formulability of Non-Selective Nulls) is the most vulnerable. If it turns out that developmental constraints cannot be modeled quantitatively with the same precision as optimality models (e.g., if "geometric entailment" proves too vague to generate a specific probability distribution), the Adaptationist is justified in reverting to selection as the only testable default. Conversely, if optimality models prove to be infinitely flexible (able to fit any shape by adding parameters), the Critic is justified in rejecting them as unfalsifiable.

  **2. Rationalization Risks:**
  *   **Adaptationist Risk:** In the event of a high correlation between helmet and adductor size (favoring the Critic), the Adaptationist may rationalize this by claiming "selection favored the correlation" (i.e., it is adaptive to have the helmet match the muscle). This renders the correlation evidence for *both* sides and must be guarded against by pre-registering the "geometric optimum" shape distinct from the "selected optimum" shape.
  *   **Critic Risk:** In the event of dissociation (favoring the Adaptationist), the Critic may rationalize this by claiming "developmental plasticity allowed the decoupling." This must be guarded against by the ablation study; if the tissue is removed and the trait still forms, plasticity is not a sufficient excuse.

  **3. The Verbal/Substantive Boundary:**
  We marked the definition of 'Adaptationism' (Disagreement 5) as verbal. However, this may be substantive in practice. If the Adaptationist treats the heuristic *as if* it were an ontological truth during experimental design (e.g., by failing to look for constraint mechanisms because they assume none exist), the verbal distinction collapses into a substantive methodological error. We agree to audit our own experimental designs to ensure the heuristic does not blind us to the ontology.

  **4. The Lizard Case Verdict:**
  We acknowledge that the lizard case may yield mixed results (e.g., tight correlation *but* ablation independence). In such a scenario, we agree that the trait is a **co-opted spandrel**: originally entailed by the muscle (Critic wins origin), but subsequently modified and maintained by selection for defense (Adaptationist wins maintenance). This outcome validates Claim 3 and dissolves the binary opposition for this specific trait.
