answer: |-
  Subject: Re: Specification of the commons problem desiderata

  It sounds like you have reached the exact right pivot point in this debate, because your intuition that both friends are solving unspecified problems is correct. The property-rights advocate and the state-intervention advocate are often talking past each other because they are assuming different boundary conditions about the resource, the users, and the time horizon. If you want to move the conversation forward, you need a specification sheet that forces both of them to acknowledge where their preferred mechanisms actually break down. What follows is an attempt to write out those desiderata in continuous form, distinguishing the technical constraints from the ideological ones, and noting where the trade-offs become unavoidable.

  To begin with, we have to be precise about what we mean by a commons problem, because the solution depends entirely on the physical and economic characteristics of the good in question. The first distinction any adequate theory must respect is between common-pool resources and public goods. A public good is non-rival and non-excludable, like national defense or a broadcast signal, meaning my consumption does not reduce yours. A common-pool resource, like a fishery or groundwater aquifer, is rival but difficult to exclude, meaning my consumption directly reduces what is available for you. This distinction is non-negotiable because solutions designed for public goods, such as state provision funded by taxation, can misfire on common-pool resources by ignoring the rivalry constraint, leading to overconsumption even if funding is secure. Conversely, treating a non-rival good as a rival common-pool resource by imposing artificial scarcity through property titles creates deadweight loss where none need exist. Therefore, the first desideratum is rivalrousness sensitivity: the solution must account for whether consumption subtracts from the total stock. If the resource is rival, the solution must limit extraction; if it is non-rival, the solution should maximize access.

  Once we have established that the resource is rival, we must distinguish between open access and common property, which is where your property-rights friend often gets stuck. Open access means there are no rules governing who can use the resource, whereas common property means the resource is held by an identifiable community with rules about use. The tragedy of the commons is technically a tragedy of open access, not necessarily of common property. This leads to the second desideratum, which is boundary definition. Any viable solution must clearly define who has rights to the resource and who is excluded. Without clear boundaries, outsiders can enter and deplete the resource regardless of the internal rules agreed upon by the initial users. This requirement motivates the need for excludability, but it does not dictate that exclusion must be achieved through private title deeds. It could be achieved through social norms, physical barriers, or state regulation. The property-rights camp often smuggles in a prejudice here by claiming that only individualized, tradeable titles constitute valid boundaries, but the empirical record of long-lived irrigation systems and grazing commons shows that community-defined boundaries can be just as robust. Therefore, while boundary definition is non-negotiable, the mechanism of definition is not.

  Having defined the users, we must address their incentives, which brings us to the third desideratum of incentive compatibility. A solution is only adequate if rational appropriators find it in their interest to comply with the rules rather than defect. This is where the one-shot versus iterated interaction distinction becomes critical. In a one-shot game, defection is the dominant strategy, but in iterated interactions where users expect to meet again, cooperation can be sustained through reputation and reciprocity. A viable solution must either ensure interactions are iterated or introduce external enforcement that changes the payoff structure of a one-shot interaction. This requirement rules out any solution that relies purely on altruism or moral suasion without changing the underlying payoff matrix. However, this is also where the state-centric friend often introduces a prejudice by assuming that only state enforcement can alter these payoffs. Community monitoring and graduated sanctions can also alter payoffs effectively, provided the monitoring costs are low. This leads to the fourth desideratum: low-cost monitoring and enforcement. If the cost of verifying compliance exceeds the value of the resource preserved, the system will collapse. Solutions that require expensive external auditors for low-value resources are inherently unstable.

  The fifth desideratum concerns heterogeneity among users, specifically the distinction between symmetric and asymmetric appropriators. In many real-world cases, users are not equal; some have larger fleets, more capital, or more political power than others. A solution must be robust to capture by the most powerful users. If the rule-making process allows asymmetric actors to rewrite the rules to exclude smaller users or grant themselves exemptions, the system will fail to preserve the resource. This requirement challenges both the privatization and state models. Privatization can lead to consolidation where large actors buy out small ones and exploit the resource intensively, while state regulation is vulnerable to regulatory capture where powerful lobbyists weaken the caps. Therefore, the governance structure must have checks against concentration of power, whether that power is economic or political. This is often overlooked in theoretical models that assume symmetric agents, but it is essential for empirical adequacy.

  The sixth desideratum involves time horizons and discount rates. Solutions must align the users' discount rates with the regeneration rate of the resource. If users have high discount rates, perhaps due to poverty or instability, they will over-extract even if they know it leads to collapse. A viable solution must either lower effective discount rates through security of tenure or lengthen the time horizon of the interaction. This is where the empirical record of self-governing commons is most damaging to theoretical pessimism. Elinor Ostrom's work demonstrates that communities can maintain resources for centuries, which rules out any story on which long-term cooperation among rational appropriators is impossible. Therefore, empirical consistency is a non-negotiable requirement. Any theory that claims commons management is inherently unstable is falsified by the existence of the Alpine grazing commons or the Japanese forestry cooperatives that have survived for hundreds of years. This does not mean all commons succeed, but it means failure is not inevitable, and any adequate theory must explain the success cases as well as the failure cases.

  We must also consider the mirror-image problem of the anticommons, where a resource is fragmented among too many exclusion rights to be used at all. This is a risk primarily associated with the privatization model. If every fragment of a resource requires permission from a different owner, transaction costs can prevent efficient use. Therefore, the seventh desideratum is fragmentation resistance. The solution should not create so many veto points that the resource becomes unusable. This is a specific constraint on the property-rights approach, reminding us that while exclusion is necessary to prevent overuse, too much exclusion can prevent use entirely.

  Now we must separate the non-negotiable requirements from the ideological prejudices. The non-negotiable constraints are rivalrousness sensitivity, boundary definition, incentive compatibility, and empirical consistency. If a solution ignores rivalry, fails to define who is in and out, does not align incentives, or contradicts the historical record of successful commons, it is technically inadequate. The prejudices are the specific mechanisms proposed to meet these constraints. The claim that only private title can define boundaries is a privatization prejudice. The claim that only state fiat can enforce incentives is a state-centric prejudice. Both are attempting to solve the same coordination problems but insisting on different institutional technologies. Recognizing this allows you to tell your friends that they are arguing about implementation details while agreeing on the functional requirements, or perhaps disagreeing on which functional requirements are actually possible.

  There is, however, a deeper problem regarding whether any subset of these desiderata is jointly unsatisfiable. Mechanism design theory suggests there are often trade-offs between efficiency, budget balance, and voluntary participation. In the context of commons, the tension is often between scalability and local knowledge. To meet the requirement of low-cost monitoring, governance usually needs to be local and polycentric, because locals know the resource conditions best. However, to meet the requirement of robustness to outsiders, especially in cases like climate change where the "outsiders" are everyone else on the planet, governance needs to be scalable and centralized. It is possible that for certain classes of problems, specifically those with very large spatial scales and high heterogeneity, you cannot simultaneously satisfy the low-cost monitoring requirement and the robustness to entry requirement. This implies that for global commons, we may have to accept higher enforcement costs or lower adaptability. This impossibility result is itself a finding worth presenting to your friends, as it suggests that there is no universal solution that works for every scale of commons problem.

  To close this out, I will score the three main approaches against these criteria so you can see where they stand. Privatization-style solutions score well on boundary definition and incentive compatibility because private owners have strong incentives to preserve the value of their asset. However, they often fail on monitoring costs for diffuse resources like air or groundwater, where fencing is impossible, and they risk triggering the anticommons problem if rights are fragmented too finely. They also struggle with asymmetric appropriators, as market consolidation can lead to monopoly exploitation rather than stewardship.

  Centralized regulation scores well on robustness to entry and scalability, as the state can theoretically enforce rules over large areas and exclude outsiders effectively. However, it typically fails on low-cost monitoring and adaptability because central planners lack local knowledge and cannot adjust rules quickly to changing conditions. It is also highly vulnerable to capture by asymmetric actors who can influence the legislative or regulatory process to their benefit, violating the robustness to capture desideratum.

  Polycentric self-governance, following the Ostrom line, scores highest on empirical consistency, low-cost monitoring, and adaptability, as users can modify rules based on local feedback and monitor each other cheaply. However, it struggles with scalability and robustness to entry when the community is open or the resource spans multiple jurisdictions. It works exceptionally well for local fisheries or irrigation systems but faces significant challenges when applied to global climate change where the community of appropriators is effectively the human race and there is no outside enforcer. Each model meets some desiderata while violating others, which suggests your friends are likely championing the solution that fits their preferred scale while ignoring the constraints that break it.
