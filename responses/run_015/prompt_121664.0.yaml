      *   *Apply to Cases 1-4:* Show how they fit (Owner = concord; Mother = conflicting concords resolved by Spectator; Bureaucrat = lack of concord; Reformer = expanded concord).
      *   *Resolve Case 5:* This is the pivot. Smith distinguishes between the *cause* of sympathy (imagination) and the *effect* (emotion). If the effect is suppressed, the moral quality is diminished. It becomes "justice without benevolence." It is *acceptable* for institutional design (Smith likes rules) but *insufficient* for moral virtue. The practitioner is acting *as if* they are virtuous, but lacks the "grace."
