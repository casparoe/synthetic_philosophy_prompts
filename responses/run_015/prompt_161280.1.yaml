      *   *Empirical Check:* Mention research on "choice overload" or "maximizers vs. satisficers" (Schwartz). Maximizers agonize more, even when outcomes are similar. This supports the "epistemic/psychological" side but might undermine the "noise" aspect if it's a stable trait.
      *   *The "Certain Agony" Case:* This is the strongest counter-argument. Soldiers choosing to sacrifice themselves. Parents choosing life support. They often know what is "right" but the choice is hard. Why? Because the cost is high, not because the comparison is unclear. The deflationary view conflates *hard* (costly) with *hard* (incomparable).

  6.  **Final Polish:**
