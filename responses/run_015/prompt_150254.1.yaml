rposivist methods? Include another that tests whether her empirical premise holds—specifically, whether democratic visibility actually operates if citizens are largely unaware of Lords Spiritual or church-tax mechanisms—and ask what her normative argument becomes if that premise fails. For each remaining question, anticipate the standard reply and attach a brief follow-up.
