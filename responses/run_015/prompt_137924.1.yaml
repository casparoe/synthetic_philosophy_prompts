  Good evening. For those I haven't met, I'm [Name], the bride's brother.

  Standing here, I am conscious of the precision required. My sister has spent her career studying the weight of words. I learned the importance of this the hard way. Last Christmas, I announced her partner's new job was secured based on a rumour. She made me retract it immediately, in front of everyone. It stung, but she was right. Speaking beyond what you know isn't confidence; it's carelessness. I have since adopted her standard. I realised that integrity matters more than the comfort of a good story.

  So tonight, I intend to speak only within the limits of my own evidence. I stand here claiming only what I can verify. To some, this may sound like modesty. To others, it is simply the only honest way to stand before you.

  What do I know? I know what I have witnessed with my own eyes. I have watched [Partner] listen to her when she is exhausted after a long term. I have seen them make her tea without being asked, remembering exactly how she takes it. I have observed the quiet way they steady her when the world feels loud. I know that when she speaks, they hear her. I have seen them laugh together until they cannot breathe over jokes no one else understands. I know that in their presence, I feel welcome. I have witnessed their kindness to Mum and Dad, visiting when they were ill. I know the relief in her voice when they arrive at a family gathering. I have seen them navigate difficult conversations without raising voices. I have felt the stability they bring to our family.

  I cannot tell you what the future holds. I do not know if the road will be easy. I cannot assert that there will never be hardship. To claim otherwise would be to ignore the limits of my own sight. I will not pretend to foresee thirty years from now. But I can promise this: I will stand by them. I hope they find joy in the ordinary mornings. I wish them patience when things are difficult. I trust them to navigate whatever comes.

  There is a distinction between predicting happiness and committing to support it. I offer the latter.

  My sister spends her life analysing how we commit ourselves with language. Today, she makes the biggest commitment of all. I know she takes words seriously. She will not speak her vows lightly. She understands the gravity of the promise she is making.

  So, please raise your glasses. I wish [Sister] and [Partner] a lifetime of truth between them. I hope their home remains a place of honesty and warmth. I promise to do my best to deserve their trust.

  To the bride and groom.
