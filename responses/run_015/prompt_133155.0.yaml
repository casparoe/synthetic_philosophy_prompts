answer: |-
  You have identified a precise and pernicious epistemic pathology. While there is no single, canonical term in the philosophy of science that captures this exact "round-trip" trajectory (Technical → Philosophical → Technical) with the specific consequence of *retained syntax but eroded truth conditions*, the phenomenon is a composite of several recognized dynamics.

  The closest existing label for the *process* is **Concept Laundering**, though it is typically used to describe importing loose normative claims into technical frameworks to gain objectivity. Your description is the inverse: exporting a technical concept to a hermeneutic domain to relax its constraints, then re-importing it to claim technical authority. In the sociology of scientific knowledge, this is closely related to **The Golem Effect** (Harry Collins), where concepts escape the control of their originators and take on a life of their own, often distorting the original practice.

  However, to capture the specific *state* you describe—where the term functions as a credential rather than a criterion—the most precise delineation is **"Formal Mimicry"** resulting in a **"Simulacrum of Rigor."**

  Below is a precise delineation of this state, distinguishing it from ordinary conceptual stretching, and an analysis of the point of irreversibility.

  ### 1. Delineating the "Copycat" State: Formal Mimicry
  To distinguish this dynamic from ordinary ambiguity or Wittgensteinian family resemblance, we must isolate the *structural relationship* between the original concept ($C_{orig}$) and the migrated concept ($C_{copy}$).

  **Ordinary Conceptual Stretching** admits that the boundaries are fuzzy; it is an honest acknowledgment that $C$ applies to a wider range of cases with lower confidence.
  **Formal Mimicry**, by contrast, asserts that $C_{copy}$ satisfies the truth conditions of $C_{orig}$ while systematically violating them.

  The state is defined by four pragmatic markers:

  1.  **Syntactic Isomorphism:** The vocabulary, notation, and logical form of $C_{orig}$ are preserved (e.g., "intervention," "invariance," "structural equation"). This ensures the term remains recognizable to the technical community.
  2.  **Truth-Condition Relaxation:** The necessary and sufficient conditions for applying the term are weakened (e.g., replacing *surgical invariance* with *qualitative counterfactual plausibility*).
  3.  **Authority Parasitism:** $C_{copy}$ derives its persuasive power not from its own evidentiary basis, but from its association with the rigor of $C_{orig}$. It spends the "epistemic credit" of the original domain without maintaining the "epistemic reserves."
  4.  **Operational Decoupling:** The method used to verify $C_{copy}$ (e.g., salience mapping) is no longer isomorphic to the method required to verify $C_{orig}$ (e.g., causal identification), yet the verification is treated as equivalent.

  ### 2. Distinction from Related Dynamics
  You correctly excluded *Motte-and-Bailey* and *Family Resemblance*. Here is how **Formal Mimicry** differs formally:

  *   **Vs. Motte-and-Bailey:** A Motte-and-Bailey is a *strategic equivocation* by an agent during an argument (retreating to the defensible definition when attacked). Formal Mimicry is a *structural drift* across communities over time. The practitioners using $C_{copy}$ often genuinely believe they are using $C_{orig}$; there is no conscious retreat, only a corrupted shared understanding.
  *   **Vs. Family Resemblance:** Family resemblance implies a network of overlapping features without a single essential core. Formal Mimicry *claims* there is an essential core (the technical definition) but fails to instantiate it. It is a claim of identity, not resemblance.
  *   **Vs. Semantic Bleaching:** Semantic bleaching is the loss of meaning through overuse (e.g., "literally"). Formal Mimicry is more specific: it is the retention of *technical* meaning syntactically, while the *operational* meaning is swapped. It is not just empty; it is misleadingly full.

  ### 3. The Point of Irreversibility
  You asked at what point the slippage becomes practically irreversible. In the lifecycle of a technical concept, there is a **Threshold of Operational Supersession**.

  This threshold is crossed when the *operational definition* (how the term is measured/tested in practice) supersedes the *theoretical definition* (what the term means ontologically) in the literature of the home domain.

  **Markers of Irreversibility:**
  1.  **Citation Inversion:** Papers in the original technical domain (e.g., Causal Inference) begin citing papers in the interpretive domain (e.g., Interpretability) as authoritative examples of the concept, rather than vice versa.
  2.  **Review Standard Shift:** Peer reviewers in the technical domain begin accepting $C_{copy}$'s verification methods (e.g., salience maps) as sufficient proof of $C_{orig}$'s conditions (e.g., invariance), treating the relaxation as a standard methodological advance rather than a category error.
  3.  **Falsification Immunity:** The concept becomes unfalsifiable within the home domain because the relaxed conditions allow any negative result to be explained away by "contextual factors" or "qualitative nuance," destroying the original concept's riskiness.

  ### 4. Proposed Terminology
  If you require a label for your own work, I recommend **"Epistemic Arbitrage"** or **"Rigor Washing."**

  *   **Epistemic Arbitrage:** Captures the economic dynamic of exploiting the value difference between the high-rigor domain (where the concept is expensive to instantiate) and the low-rigor domain (where it is cheap), profiting from the prestige differential.
  *   **Rigor Washing:** Analogous to "greenwashing." It describes the process of applying a thin layer of technical vocabulary to a non-technical practice to make it appear compliant with rigorous standards.

  However, if you wish to emphasize the *ontological* status of the concept itself (the "zombie" nature you described), the most philosophically precise term is **"Simulacrum of Rigor."** It signals that the concept is a copy without an original—a sign that refers only to other signs (the vocabulary) and no longer to the state of affairs (the causal structure) it was designed to track.

  ### Summary
  The dynamic you observe is **Formal Mimicry** driven by **Epistemic Arbitrage**. It is distinguished from ordinary drift by the **parasitic retention of authority** despite the **erosion of truth conditions**. It becomes irreversible at the **Threshold of Operational Supersession**, where the home domain's measurement practices are colonized by the interpretive domain's relaxed standards, rendering the original boundary conditions unrecoverable without a schism in the field.
