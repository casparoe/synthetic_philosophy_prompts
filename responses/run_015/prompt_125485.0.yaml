  Reject step (3), the principle of no systematic overdetermination, because it falsely treats supervenient levels as independent competitors for causal credit.

  Step (3) looks innocent because it holds for distinct events (two shooters firing at once), but it fails for nested descriptions (software vs. electrons) because the higher-level state is not an alternative to the lower-level state; it is a pattern *within* it. Causation is not a conserved quantity like energy where sharing dilutes responsibility; it is a relation of counterfactual dependence. If changing the software state (via its physical realization) changes the outcome, the software state is a cause, regardless of whether the physical state also suffices. The cost of this rejection is abandoning the "billiard ball" model of causation as physical pushing in favor of an interventionist model where causes are difference-makers relative to a level of description.

  The alternatives you did not pick are far more expensive. Rejecting (1) costs you physical causal closure, forcing you into dualism or believing physics is incomplete, which undermines the hardware story you rely on. Rejecting (2) costs you multiple realizability, implying that a program compiled for x86 is a fundamentally different entity than the same program on ARM, which contradicts your professional experience with virtualization and abstraction.

  Your specification condition is a category mistake dressed as a criterion. It correctly identifies that constraints matter, but wrongly attributes causal power to the existence of a document or author rather than the stability of the physical organization. A bug causes a crash even if no one wrote the spec, and a gene causes a trait without a contract. The correct criterion is not the existence of a spec, but the invariance of the relationship under intervention: does the state reliably produce the effect across a range of physical realizations? Software has this stability because of compilation; minds have it because of evolutionary and learning constraints. The specification is just a human-readable proxy for that stability.

  On the dead code variable: it was never a cause of the output because an intervention on that variable yields no change in the output once compiled; the causal chain was severed by the optimizer. On the different algorithms: they are different causes even if extensionally equivalent on actual inputs, because they support different counterfactuals on untested inputs. Causation is about what *would* happen under intervention, not just what *did* happen. If Algorithm A would crash on input X and Algorithm B would not, they are distinct causal structures, regardless of their agreement on past runs.

  The analogy to mental causation is structurally exact, and the fix transfers directly. Beliefs are to neural states what software states are to hardware states. The lack of an explicit specification or author does not drain beliefs of causal power any more than it drains evolved biological functions. What matters is whether intervening on the belief changes the action, holding fixed the relevant physical realization. The only difference is epistemic: we have the source code for software, making the causal links easier to trace, but the metaphysical status of the causation is identical. If software states are real causes, so are beliefs.

  The single consideration that would most likely make me change this verdict is empirical evidence that physical causal closure (step 1) is false, such as verified top-down quantum effects. My diagnosis is weakest on the precise definition of "intervention" for mental states, as changing a belief inevitably changes the neural substrate, making it harder to disentangle the levels than in the software case where compilation creates a cleaner separation.
