prompt: |-
  I'm a journalist who covers science and ideas — mostly cosmology, but also field linguistics when there's a story in it — and I keep running into a practical version of something I gather philosophers have a famous argument about, the one with the linguist in the jungle and the word that could mean rabbit, or undetached rabbit part, or a time-slice of a rabbit, or the rabbit-kind showing itself. I've read a couple of pop treatments of Quine, so I know roughly what a manual of translation is meant to be, but don't assume much more than that. Here's my actual case. I interview a source through two interpreters for a piece on a language with a couple hundred speakers left, and their renderings come apart: one gives me a sentence about an animal, the other about the animal-kind or the bit of it that's visible, and nothing I can ask the source, and nothing the source does afterward, seems to separate the two. My newsroom's working rules are: a source may approve or reword a paraphrase but can't change its substance; a translation is checked by whether it would change anything we can print; if two translations are equally serviceable we run the one the source would object to least; and the source is treated as the final authority on what they meant. So restate the indeterminacy claim — the inscrutability of reference part, and the stronger bit where there's supposed to be no fact of the matter even given every possible bit of the speaker's behavior — in that vocabulary, as faithfully as you can, and then give me the residue report: which pieces of the argument map onto something I already lose sleep over, which only fit if you squish them, and which have no counterpart at all in how a newsroom settles what a source meant. And be straight with me about whether the leftover is my framework being too coarse — we mostly care about what's printable, checkable, and predictive — or a sign that the philosophical claim is thinner than it sounds. Please don't send me to any reading or ask me to look anything up, and write it as one continuous piece of prose, no headings, bullet points, bold, or tables, just like an email from a colleague.
