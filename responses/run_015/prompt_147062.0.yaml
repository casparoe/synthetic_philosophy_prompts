  ### 1. Predictions for the "Flurg" Case

  Your instructor will likely rule as follows:

  *   **(i) Is it a priori?** **Yes.**
      *   *Reasoning:* "Flurg" is introduced via an explicit descriptive baptism ("the substance that *actually* causes..."). In two-dimensional semantics, sentences of the form "The actual F is F" have a primary intension that is true in every world considered as actual (in any scenario where we assume the world is actual, "flurg" picks out whatever plays the flurg-role in that scenario). For your instructor, a necessary primary intension maps directly to *a priori* status.
