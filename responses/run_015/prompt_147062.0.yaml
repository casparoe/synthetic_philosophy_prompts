  *   **(iii) Water-like or Spy-like?** **Spy-like (Descriptively Fixed).**
      *   *Reasoning:* The divergence between the primary and secondary intensions here arises from the **rigidification of a description** (via the "actually" operator), not from the discovery of a hidden natural essence. "Water" diverges because the concept "watery stuff" is distinct from the essence "H2O" (a Kripkean natural kind gap). "Flurg" diverges because the term stipulates a reference-fixing description that varies across epistemic possibilities but rigidly designates the actual satisfier across metaphysical possibilities. It behaves exactly like "the tallest spy."

  ### 2. Diagnosis of the Framework

