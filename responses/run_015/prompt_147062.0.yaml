  *   **Why not pure Jackson?** Jackson’s *Metaphysical* Two-Dimensionalism focuses on how the actual world determines reference (A-intensions). While he accepts the 2D matrix, he is less committed to the strong thesis that primary intension necessity *entails* apriority in the epistemic sense your instructor consistently applies (e.g., classifying "Water is H2O" as a posteriori specifically because the 1-intension varies). Furthermore, Jackson typically treats names as having varying A-intensions to account for contingency, whereas your instructor treats them as constant.
