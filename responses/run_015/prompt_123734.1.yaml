      *(Self-Correction on the Translator)*: If the translator experiences memories as "continuously unfolding presences," does that change how she evaluates future actions based on past regrets? If moral commitments are *unchanged*, presumably her decision procedure is unchanged. So, Not Transformative. This aligns with the Contemplative.

      *(Self-Correction on the Veteran)*: The user hesitates because it's pathological. My principle must validate that pathology can be transformative if it alters the *conditions of agency*.

      *(Self-Correction on the Lawyer)*: Why is it not transformative? Because he can still *understand* his prior self's reasoning (maximizing wealth/status) even if he rejects it. The Physician *cannot* understand her prior ambition (it feels like "someone else"). This points to **Intelligibility** as a key metric.

      *Revised Principle Idea:* **The Intelligibility and Authority Criterion.**
      1.  **Authority:** The source of normative force must shift internally (not just adopting a new rule).
      2.  **Intelligibility:** The prior self's reasons must become opaque or unintelligible to the current self.

      Let's combine Structural Displacement with Intelligibility.

