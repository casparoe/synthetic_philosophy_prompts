      *   *Wait, one nuance:* The User says the Mathematician is "Uncertain." My principle should resolve that uncertainty. I will resolve it as "Not Transformative" to maintain coherence with the Contemplative case (internal shift without functional/evaluative shift).
      *   *Another nuance:* The Lawyer. Why is his framework intact? Because he swapped *what* he maximizes, not *how* he decides. He still decides via rational calculation of external principles. The Physician stopped deciding via professional duty entirely.

      *   *Final Polish on Principle Name:* "Constitutive Discontinuity Principle." Sounds more robust.
      *   *Core definition:* Transformation occurs when the *constitutive rules* of the self's engagement with the world are altered, not merely the *variables* within those rules.

  10. **Final Review against Constraints:**
