  11. **Final Polish:** Ensure the distinction between *Probabilistic Model Checking* (calculating probabilities) and *Statistical Testing* (confidence scores) is clear, as the user conflates them slightly ("assertions with confidence scores" is usually statistical testing, not PMC). I should note this distinction.

