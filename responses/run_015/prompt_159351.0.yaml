answer: |-
  Friends, students, alumni, neighbors, and members of the Kittredge family:

  Welcome to the one hundred and fiftieth convocation of the Kittredge School.

  We gather on ground that has held much hope. For a century and a half, this institution has opened doors that were barred elsewhere. When Dr. Amos Kittredge founded this school in 1871, he established a tuition-free place for the children of emancipated enslaved people and for poor white families in this mill town. That mission was real. The outcomes were real. Look around this room. Four of the nine trustees sitting behind me are graduates of this school. Most of this town's Black professional class walked these halls before entering offices, courts, and clinics across the state. You are here because this school worked. We owe a debt of gratitude for that work. It is specific, it is measurable, and it is owed to the families who built their lives on the education offered here.

  We also gather under a name that carries a heavy weight.

  We cannot speak of this school's founding without speaking of the legislature where Dr. Kittredge served. In 1887, he drafted and championed the Act for the Care of the Feeble-Minded. We have the text. It allowed for compulsory commitment on the certificate of a single physician. There was no hearing. There was no appeal. The definitions were broad enough to sweep in paupers, epileptics, and girls judged unruly. About 1,900 people were committed under this statute before it was repealed in 1962.

  We have the record of the opposition, too. During the debate, the state medical society objected. The editor of this town's Black weekly objected in print. They argued against the lack of due process and the breadth of the definitions. Dr. Kittredge answered them in print. He called them sentimentalists. He used language harsher than his co-sponsors. He had the information available to understand the harm. He chose to proceed.

  We must hold these two truths without asking one to pay for the other. The education provided here does not cancel the liberty deprived there. The harm caused by the Act is not a tax levied against the good done by the school. They are not entries on a single ledger. They are separate histories that share a single origin point.

  Our board recently voted, six to five, to retain the school's name and to install a permanent exhibit detailing the 1887 law. That vote was not a verdict of innocence. It was not a declaration of settled wisdom. It was a decision to remain in this tension rather than retreat from it. We are not keeping the name to honor the man without reservation. We are keeping it to acknowledge that we are part of this history, all of it.

  We must also acknowledge the bargain that brought us into existence. Researchers have confirmed that the school's endowment was voted in the same legislative session as the asylum board, part of a single package. We exist, in part, because of that legislation. This makes our position complicated. We are beneficiaries of the same political moment that produced the asylum. This gives us reason for scruple in how we speak. It does not give us reason to excuse the harm. It means we cannot stand at a distance and judge as if our own feet are clean. We are implicated.

  To the great-grandchildren of Dr. Kittredge sitting in the first row: We recognize your lineage. We do not ask you to bear responsibility for his actions, nor do we ask you to defend them. We simply ask you to witness them alongside us.

  To Marion Oakes, who is with us today and will speak later in this program: Your great-grandmother was committed under the Act. She died in the asylum. We acknowledge this fact not as an illustration for our narrative, but as a reality that predates us and outlasts us. We do not ask for your forgiveness. Forgiveness is not ours to request, and it is not yours to offer on behalf of the dead. We simply acknowledge that you are here, and that the school you graduated from bears the name of the man who wrote the law that took your great-grandmother.

  There is a temptation to ask what we would have done in 1887. We will not ask that question. It is unverifiable. It functions mostly as a way to excuse ourselves. Instead, we ask what we will do now.

  We will teach this history. The permanent exhibit will not be a footnote. It will detail the law, the opposition, the commitment numbers, and the legislative bargain. It will not offer a resolution. There is no resolution.

  To our neighbors from the County Historical Society: We know some fear that examining these complexities means losing history. We believe the opposite. Ignoring the harm loses the history. Flattening the man into a hero loses the history. Keeping the name while telling the whole truth is how we keep the history alive.

  To the students: You inherit this school. You inherit the opportunity it provided to your predecessors. You also inherit the name on the diploma. You do not have to resolve the contradiction. You only have to know it.

  Dr. Kittredge campaigned for repeal of the Act in 1890 after visiting the asylum, saying it had become what he did not intend. The statute remained for seventy more years. Intentions are not outcomes. We are responsible for outcomes.

  So we stand here, one hundred and fifty years later. We are grateful for the school. We are condemned by the law. We are beneficiaries of the bargain. We are witnesses to the harm. We will not seek to balance the scales. We will only seek to keep them visible.

  Thank you.

  ***

  **Note on the Address**

  **Contested Claim:** The speech states that the school's endowment was voted "only as part of a package that also created the asylum board." While your researchers indicate this linkage, legislative history often involves complex negotiations where causality is difficult to prove definitively. A historian might argue the endowment could have passed independently or was merely coincidental timing, though the "bargain" framing is central to your ethical stance.

  **Confidence in the Two-Claim Distinction:** I am highly confident in the utility of the distinction you drew between "what was available to think" (epistemic access) and "fittingness of blame." It allows the speech to avoid the forbidden "man of his time" defense while acknowledging the specific historical objections Kittredge ignored. It provides the necessary philosophical scaffolding to condemn the act without relying on anachronism.

  **Least Sure Point:** I am least sure whether the speech successfully avoids "netting out" the two legacies simply by virtue of being a single address. Even by asserting they are not on a single ledger, the act of juxtaposing gratitude and condemnation in an eight-minute speech may inevitably lead some listeners to seek a synthesis or balance that you explicitly wish to deny. The structure itself risks creating the equilibrium you want to avoid.
