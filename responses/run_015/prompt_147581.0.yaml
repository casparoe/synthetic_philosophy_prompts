  "If we lock the door, we're not a coordination agency. We're a cage. Legitimacy requires the option to walk. Otherwise, compliance is just coercion waiting for a weak moment. You know how this ends. People break locks."

  "Legitimacy doesn't matter if the structure collapses. Look at the ratchet asymmetry. Steps toward centralization are easy. Reversing them? Impossible. The gains from coordination show up immediately—jobs, safety. The costs of dissolution are delayed, diffuse. Borne by people who can't vote yet."

  "I know the term, Dev. I wrote the memo. But the ratchet works both ways. Once you're in, you can't get out. That's the irreversible step. If we remove the valve, the default isn't stability. It's entropy. People will break the locks."

  "They'll break the locks anyway if the valve is there. Because the valve is unusable. Who authorizes exit? A majority? Then the majority traps the minority. A unilateral declaration? Then any disgruntled bloc leaves when things get hard. It's either unuseable or fatal."

  "Better fatal than fraudulent. You're worried about cosmetic multipolarity. I get it. You think we'll end up with the reality of a singleton and the accountability of a committee. But without the valve, we don't even have the cosmetic check. We have honest tyranny."

  "Honest tyranny is easier to spot. Cosmetic multipolarity is a trap. A would-be singleton games the proxies—vetoes, member states. It looks like power is distributed. It's not. It's like the old federations. They claimed sovereignty for the states until the center needed revenue."

  "And then they collapsed. Which proves my point. You can't hold a union together by force forever. The valve acknowledges gravity. It says: we stay together because we choose to, not because the geometry of the charter forbids leaving."

