  "If we don't, the valve was decorative. That's the worst of both worlds. We look permissive, but we act coercive. It undermines the whole charter. If the exit right isn't credible, we're just lying about the structure. I can't sign a lie."

  "But if you do honour it, you've licensed exactly the race-to-the-bottom the agency was built to stop. One defector ruins the safety protocol for everyone. So the valve fails either way. It's a logical contradiction in the draft. You're asking me to sign a paradox."

