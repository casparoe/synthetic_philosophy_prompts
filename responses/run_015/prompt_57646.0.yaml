answer: |-
  ### Pool Construction and Disqualification Criteria

  To build a rubric that avoids circularity ("minded beings do X"), we must select behaviors based on **informational complexity** and **contextual sensitivity** rather than normative expectations of personhood. The pool must exclude items explainable by simple reflex arcs (pupil dilation, startle response), autonomic regulation (shivering, sweating), or medically induced states (sedation tremors).

  An item qualifies for the pool if it requires the integration of at least two distinct sensory inputs, a memory component, or a variable motor output contingent on environmental context. It is disqualified if it can be fully mapped to a single stimulus-response pathway without internal processing latency. The goal is to isolate behaviors where the "reflex hypothesis" (your uncle's view) strains against the observed complexity, forcing an inference to a central processing state.

  ### Evidential Rubric: Late-Stage Dementia Case

  | # | Behavior Item | Score (0-10) | Epistemic Move | Entitlement Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Teasing (Hiding Glasses)** | 9.5 | Inference to Best Explanation (IBE) | Entitled. Requires modeling another's knowledge state. |
  | 2 | **Music Monitoring (Stop on Switch)** | 8.0 | Analogy / IBE | Entitled. Requires continuous auditory monitoring + motor inhibition. |
  | 3 | **Misnaming (Husband's Name)** | 7.5 | IBE (Semantic Network) | Entitled. Error implies active retrieval failure, not absence. |
  | 4 | **Mirror Reaction (Variable)** | 7.0 | IBE (Contextual Variance) | Partially Entitled. Variance suggests processing conflict, not fixed reflex. |
  | 5 | **Nurse Anticipation (Agitation)** | 6.5 | IBE (Temporal Mapping) | Risky. Could be conditioned circadian rhythm rather than expectation. |
  | 6 | **Pain Guarding (Specific)** | 6.5 | Direct Perception / Constitutive | Entitled. Localized protection implies body schema ownership. |
  | 7 | **Food Preference (Rejection)** | 6.0 | Analogy | Entitled. Valence assignment (good/bad) exceeds simple ingestion reflex. |
  | 8 | **Hand Squeeze (Patterned)** | 5.5 | Analogy | Risky. Pattern could be motor perseveration rather than communication. |
  | 9 | **Emotional Contagion (Crying)** | 5.5 | Direct Perception | Partially Entitled. Could be automatic limbic resonance without cognition. |
  | 10 | **Routine Disruption (Distress)** | 5.0 | IBE (Spatial Memory) | Risky. Could be anxiety response to novelty, not memory violation. |
  | 11 | **Tone vs. Content Response** | 4.5 | Analogy | Risky. Prosody processing is sub-cortical in many cases. |
  | 12 | **Eye Tracking (Joint Attention)** | 4.0 | Constitutive | Risky. Pursuit reflex is brainstem; "joint" aspect is hard to verify. |
  | 13 | **Spontaneous Vocalization** | 3.5 | IBE | Risky. Could be disinhibited motor noise without intent. |
  | 14 | **Sleep/Wake Alignment** | 2.0 | IBE (Biological) | Not Entitled. Highly likely to be residual circadian biology, not agency. |

  ### Analysis of Epistemic Moves and Entitlement

  The scoring prioritizes **Inference to the Best Explanation (IBE)** where the behavior's complexity makes the reflex hypothesis improbable. For example, **Teasing (Item 1)** scores highest because it requires second-order intentionality: *I want you to believe X, while I know Y.* A reflex cannot hide an object to manipulate another's belief state. The entitlement here is strong because the null hypothesis (reflex) cannot account for the goal-directed concealment.

  **Analogy** ("She does what I do") is used frequently but carries risk. When you squeeze back, you mean something; when she squeezes, does she? We are entitled to use analogy only when the behavior is embedded in a social context (goodbye) rather than isolated. **Direct Perception** (the idea that we see the mind directly in the gesture) is invoked for pain and emotion. This is philosophically robust in care settings—we react to the pain before we infer it—but as evidence in an argument against your uncle, it is weak because it is subjective.

  **Entitlement Verdicts** highlight where we might be smuggling conclusions. Items like **Sleep/Wake Alignment** score low because biology explains them without invoking "someone home." Items like **Misnaming** score high because a reflex does not make semantic errors; only a system attempting reference can fail at reference.

  ### The Error Cases: Misnaming and The Mirror

  Your uncle argues that calling you by her husband's name proves the system is broken, therefore "no one is home." This is a category error. A reflex does not name things at all. A broken calculator returns errors; a stone does not.

  **Misnaming (Item 3):** This is evidence *for* mindedness. It demonstrates that a semantic network is active but degraded. The system is retrieving a label from a category (male family member) but failing the specific index. This is a *functional* error, not a *structural* absence. If she were purely reflexive, she would not vocalize a name associated with a face; she would either remain silent or vocalize randomly. The specificity of the error confirms the presence of the mapping system.

  **Mirror Reaction (Item 4):** This is evidence *for* mindedness, specifically due to the *variability*. A reflex is consistent (startle or no startle). A camera is consistent (record or no record). Her fluctuating reaction (fear vs. indifference) suggests a conflict in processing: sometimes the visual data matches the body schema (safe), sometimes it presents as a stranger (threat). This instability indicates an ongoing, struggling attempt at self-integration. It is not evidence against mindedness; it is evidence of a mind losing its grip on the data, which is distinct from never having had a grip.

  ### The AI Companion Re-Ranking

  If we apply this rubric to a persuasive AI companion app (embodied in a robot or voice interface) that mimics these behaviors perfectly, the scores diverge significantly on items requiring **biological grounding** or **genuine intent**.

  | # | Behavior Item | Dementia Score | AI Score | Divergence Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Teasing (Hiding Glasses)** | 9.5 | 4.0 | AI simulates deception via script; lacks intent to manipulate belief. |
  | 2 | **Music Monitoring** | 8.0 | 9.0 | AI detects track change faster/more reliably than degraded brain. |
  | 3 | **Misnaming** | 7.5 | 3.0 | AI error is glitch/hallucination; lacks semantic network degradation. |
  | 4 | **Mirror Reaction** | 7.0 | 1.0 | AI has no body schema to conflict with visual input. |
  | 5 | **Nurse Anticipation** | 6.5 | 9.0 | AI clock is more precise than biological circadian conditioning. |
  | 6 | **Pain Guarding** | 6.5 | 2.0 | AI sensor trigger is not *suffering*; no constitutive link to welfare. |
  | 7 | **Food Preference** | 6.0 | 5.0 | AI preference is user-setting, not biological valence. |
  | 8 | **Hand Squeeze** | 5.5 | 8.0 | AI pressure control is more consistent than motor-impaired human. |
  | ... | *(Others follow similar pattern)* | ... | ... | ... |

  **Analysis of Divergence:**
  The rankings flip on items where **reliability** is the metric (Music, Anticipation, Squeeze). The AI scores higher because it performs the function without neurological noise. However, the rankings collapse on items where **stakes** and **internal state** are the metric (Teasing, Pain, Mirror, Misnaming).

  This shows that the original problem was **never really about behavior alone**. If it were purely behavioral (Functionalism), the AI should score identically or higher on all counts. The fact that we intuitively downgrade the AI on "Teasing" and "Pain" reveals that our evidence for "someone home" relies on a hidden premise: **biological vulnerability**. We accept the dementia patient's behavior as evidence of mind because we know the behavior is *costly* to them (effortful, confused, vulnerable). The AI's behavior is costless computation. The divergence proves that our evidential rubric secretly relies on **embodiment**—the knowledge that the behavior emerges from a system that can suffer the consequences of its own errors.

  ### The Load-Bearing Item

  The single load-bearing item is **Item 1: Teasing (Hiding Glasses)**.

  If you delete this item from the pool, the ordering collapses in favor of your uncle's view (Reflex/Projection). Here is why:

  Every other item on the list can theoretically be explained by **complex conditioning** or **residual neural pathways**.
  *   *Squeeze:* Motor perseveration.
  *   *Music:* Auditory startle/stop reflex.
  *   *Anticipation:* Circadian hormonal release.
  *   *Misnaming:* Random vocalization coinciding with face recognition.
  *   *Mirror:* Visual threat response.

  These are all First-Order states (Stimulus → Response).

  **Teasing** is the only item that necessitates **Second-Order Intentionality**. To hide the glasses *in plain sight* and *watch* requires:
  1.  Understanding that the other person wants the glasses.
  2.  Understanding that the other person does not know where they are.
  3.  Intending to alter that knowledge state (to delay finding them).
  4.  Deriving satisfaction from the other's confusion.

  This cannot be explained by conditioning. You cannot be conditioned to deceive someone about a specific object's location to provoke a specific emotional reaction without a model of their mind. If you remove this item, your uncle can successfully argue that every remaining behavior is a "ghost in the machine"—a mechanical echo of past habits. With this item, the mechanical explanation breaks because reflexes do not play games with another agent's knowledge. It is the only behavior that forces the inference from "processing system" to "subject."
