answer: |-
  Here is the breakdown. I'm going to be direct because you asked for honesty, and because if your teacher is relying on your crew, you need a tool that doesn't break when the pressure is on.

  ### Part 1: The Verdict on Your "Swap Test"

  **Keep it, but rename and tighten it.**

  Your intuition is correct: if the outcome is the same regardless of the specific environmental factor, that factor isn't doing the heavy lifting. However, your phrasing ("roughly the same size") is too vague for a 5-minute review. Two droughts are never the "same size," and arguing about severity wastes time.

  **The Fix:** Turn it into a **Timing and Location Check**.
  Instead of swapping the *volcano* for a different volcano, ask: "If this volcano erupted 20 years earlier, or in a neighboring kingdom, does the essay's argument still hold?"
  *   **Why:** This tests *contingency*. If the argument relies on the specific political moment the volcano hit, the volcano is a *trigger*. If the argument says the dynasty was doomed no matter when the volcano hit, the volcano is just *decoration* for a deterministic argument.

  ### Part 2: The 5-Minute "Alibi & Agency" Checklist

  This is designed for your crew. It requires zero theory knowledge. It moves from "Hard Stop" (Reject) to "Yellow Flag" (Discuss).

  **Time Limit:** 5 Minutes per essay.
  **Passing Score:** Must pass Steps 1 & 2. Steps 3 & 4 determine the *quality* of the pass.

  #### Step 1: The Human Gap (Hard Stop)
  **Question:** Between the environmental event (plague/volcano) and the historical outcome (war/collapse), is there at least one specific human decision described?
  *   **Pass:** Yes. (e.g., "The drought caused crop failure, *so the King raised taxes*, *so the peasants revolted*.")
  *   **Fail:** No. (e.g., "The drought caused the collapse.")
  *   **Action:** If **Fail**, stop reading. Mark as **Deterministic**. Return to author.
  *   *Why:* This kills the "Volcano did everything" essays. History requires human reaction.

  #### Step 2: The Alibi Check (Hard Stop)
  **Question:** Does the essay use the environmental event to excuse a specific human failure that looks like bad judgment?
  *   **Pass:** No. The event creates a *problem* the human must solve.
  *   **Fail:** Yes. (e.g., "The King invaded the wrong country, but he couldn't help it because the supply lines froze.")
  *   **Action:** If **Fail**, stop reading. Mark as **Alibi**. Return to author.
  *   *Why:* This catches the "lazy version" you mentioned. Bad strategy is bad strategy, even if it snows.

  #### Step 3: The Timing/Location Swap (Quality Check)
  **Question:** If the event happened 20 years earlier or in a neighboring region with similar politics, would the outcome be the same according to the essay's logic?
  *   **Good Answer:** No. The timing/location was critical to the specific human reaction.
  *   **Weak Answer:** Yes. The system was so brittle anything would have broken it.
  *   **Action:** If **Weak**, flag as **Overgeneralized**. This isn't a reject, but it lowers the grade.
  *   *Why:* This is your refined Swap Test. It proves whether the event was a *cause* or just a *symptom* of a weak system.

  #### Step 4: The Mechanism (Quality Check)
  **Question:** Is the link between the event and the outcome explained physically/economically, or is it magical?
  *   **Good Answer:** Specific chain. (e.g., "Less labor -> higher wages -> lords pass laws -> peasants ignore laws.")
  *   **Weak Answer:** Vibe-based. (e.g., "People were stressed and unhappy, so society fell apart.")
  *   **Action:** If **Weak**, flag as **Vague Mechanism**.
  *   *Why:* "Stress" is not a historical mechanism. Wages, laws, and troop movements are.

  ---

  ### Part 3: Running the Checklist

  Here is how the checklist performs on your three requested cases. I have applied the "Hard Stops" strictly.

  #### Case 1: Your Essay (Black Death & End of Serfdom)
  *Argument:* Plague kills workers -> Labor scarce -> Peasants demand wages -> Serfdom ends.
  *Constraint:* Be mean.

  *   **Step 1 (Human Gap):** **PASS.** Peasants demanding wages and lords reacting is human agency.
  *   **Step 2 (Alibi):** **PASS.** The plague isn't excusing a specific bad choice by a king; it's shifting market dynamics.
  *   **Step 3 (Timing/Location Swap):** **FAIL.**
      *   *The Test:* If the Plague hit Eastern Europe (Poland/Prussia) 50 years later, did serfdom end?
      *   *The Fact:* No. Eastern Europe had the Plague, but serfdom *intensified* (the "Second Serfdom").
      *   *The Verdict:* Your essay argues the Plague *caused* the end of serfdom. But in Poland, the Plague happened, and serfdom got worse. Therefore, the Plague alone didn't do the work; local laws and politics did. Your essay treats the Plague as the driver, but it was only the fuel.
  *   **Step 4 (Mechanism):** **PASS.** Labor supply is a solid economic mechanism.

  **Final Result:** **RETURN FOR REVISION.**
  *Why you won't like this:* You want this to pass. But the checklist caught a classic historiographical error. The Black Death is a *necessary* condition in England, but not a *sufficient* one everywhere. Your essay implies universality where there is none. To fix it, you must explain why England reacted differently than Poland despite the same germ.

  #### Case 2: Friend's Essay (Maya Collapse & Drought)
  *Argument:* "The Maya collapsed because of drought." (As you described it).

  *   **Step 1 (Human Gap):** **FAIL.**
      *   *The Test:* Does the essay explain what the Maya kings *did* during the drought? Did they fight each other? Did they stop building temples? Did they migrate?
      *   *The Verdict:* You said it's "basically drought = collapse." That means trees died, then people left. No human decisions in between.
  *   **Step 2 (Alibi):** **N/A** (Already failed Step 1).

  **Final Result:** **REJECT (Deterministic).**
  *Why:* This is the exact "lazy version" you were worried about. It removes the Maya people from their own history. It suggests they were leaves blowing in the wind rather than a complex society that made choices about water management and warfare that *amplified* the drought's effects.

  #### Case 3: Small/Modern (The Alarm Clock)
  *Argument:* "My brother missed the bus because the alarm clock didn't go off."

  *   **Step 1 (Human Gap):** **FAIL.**
      *   *The Test:* Did the brother make a decision?
      *   *The Verdict:* If he went to bed at 2 AM playing video games, the *cause* is the bedtime, not the clock. The clock is the alibi. If he went to bed at 9 PM and the power went out, the clock is a valid cause.
      *   *The Check:* The essay (or excuse) must account for the backup plan. Did he have a second alarm? Did his mom check on him?
  *   **Step 2 (Alibi):** **FAIL.**
      *   *The Test:* Is the clock being used to excuse the choice to stay up late?
      *   *The Verdict:* Usually, yes.

  **Final Result:** **REJECT (Alibi).**
  *Why:* This shows the checklist works on logic, not just history. It identifies that "broken clock" is often a story we tell to avoid responsibility for "went to bed late."

  ---

  ### Part 4: What This Checklist Cannot Do (Limitations)

  You need to tell your crew where the tool breaks. If they trust it too much, they'll grade poorly.

  1.  **It Cannot Verify Facts:**
      *   The checklist assumes the essay's facts are true. If a student writes "The volcano killed 50% of the population" and it was actually 5%, the checklist might still pass the *logic* (Step 4) even though the *premise* is wrong. You still need to spot-check obvious lies.
  2.  **It Struggles with "Slow Violence":**
      *   Some environmental factors aren't triggers (volcanoes); they are slow pressures (soil erosion over 200 years). Step 1 (Human Gap) is hard to apply here because the "decision" is generations of farming practices. The checklist might unfairly flag long-term environmental history as "Deterministic."
  3.  **It Can't Measure "Necessity" vs. "Sufficiency":**
      *   Your Swap Test (Step 3) hints at this, but the checklist can't mathematically prove causation. It only proves *coherence*. An essay can be logically coherent (Pass all steps) but still be wrong because history is messy.
  4.  **The "Values" Flag:**
      *   **Where to hand off to a human:** If an essay argues that a certain group "deserved" to die because of their environmental mismanagement (e.g., "The indigenous people didn't manage the land well, so the drought killed them").
      *   **Why:** This is a moral judgment, not a historical one. The checklist will see a "Human Gap" and "Mechanism" and say Pass. But this is ethically dangerous. Your crew needs a rule: **If the essay blames the victims for the environment, flag it for the teacher immediately.** That is not a peer-review call.

  ### Summary for your Crew
  *   **Step 1 & 2 are Veto Votes.** If no humans acted, or if the weather is an excuse for bad leadership, kill it.
  *   **Step 3 is the "A" Grade.** If they pass the Swap/Timing test, the argument is sophisticated.
  *   **Your Essay:** Needs to address why Eastern Europe didn't end serfdom. The Plague isn't a magic wand; it's a variable.
  *   **Honesty:** This tool protects you from accepting lazy determinism, but it doesn't replace reading for truth. Use it to filter the "easy" rejects so you can spend more time on the essays that are actually trying to do something hard.
