      *   **User's Idea:** "The Swap Test" (If you swap the germ/drought/volcano for a similar one, does the outcome change?).
      *   **Needs:**
          1.  Critique/Refine the "Swap Test."
          2.  Create a 5-minute checklist for the crew (questions, pass/fail criteria, stop points, human judgment flags).
          3.  Be honest about what's judgment vs. procedure.
          4.  Run the checklist on three specific cases:
              *   User's essay (Black Death -> End of Serfdom). *Constraint: Be mean/critical.*
              *   Friend's essay (Maya Collapse -> Drought).
              *   Small/Modern case (Alarm clock/Bus OR Tambora/1816). *Selection: Tambora is better for history, Alarm clock is better for causality logic. Let's do Tambora for historical weight, or maybe the alarm clock for the "causality" check. Actually, the prompt asks for "something small or modern... OR Tambora". I'll pick the Alarm Clock for the logic check and Tambora for the historical check to show range, or stick to the prompt's suggestion. Let's stick to the prompt's suggestion of "something small or modern... OR Tambora". I will choose the Alarm Clock for the logic stress-test and Tambora for the historical stress-test.* Wait, re-reading: "like whether my little brother's alarm clock... or the 1815 Mount Tambora". I should pick one. I'll pick the Alarm Clock because it tests the *logic* of causality best in a 5-minute window.
          5.  Include at least one case where the procedure says "No" and the user won't like it. (Likely the User's essay or the Friend's essay).
          6.  Explain limitations (what the checklist *can't* do).

  2.  **Evaluate the "Swap Test":**
      *   *Concept:* Counterfactual history. If $X$ changes, does $Y$ change?
      *   *Strengths:* Good for testing necessity. If the outcome is the same regardless of the specific environmental factor, the factor might be incidental.
      *   *Weaknesses:* Hard to define "roughly the same size." A drought in 1300 isn't the same as a drought in 1600. It ignores *timing*. It ignores *human reaction*.
      *   *Verdict:* Keep it, but refine it. It's too abstract for a 5-minute check. Needs to be concrete. Let's call it the "Specificity & Substitution Check."

  3.  **Drafting the Checklist (The "5-Minute Filter"):**
      *   *Goal:* Fast, actionable, distinguishes "Alibi" from "Actor."
      *   *Step 1: The Human Gap.* Did humans make choices *between* the event and the outcome? (Filters hard determinism).
      *   *Step 2: The Alibi Check.* Does the environmental factor excuse a specific bad decision? (Filters the "Alibi").
      *   *Step 3: The Swap Test (Refined).* If the event happened 10 years earlier/later, or was slightly milder, does the argument hold? (Tests contingency).
      *   *Step 4: The Mechanism.* Is there a clear link (e.g., labor shortage -> wages), or just "Volcano -> Sadness -> Collapse"?
      *   *Stop Points:* If Step 1 fails -> Reject (Deterministic). If Step 2 fails -> Reject (Alibi).
      *   *Judgment Flags:* Mark where they need to discuss.

  4.  **Running the Checklist (The Simulations):**

      *   **Case 1: User's Essay (Black Death & Serfdom).**
          *   *Constraint:* Be mean.
