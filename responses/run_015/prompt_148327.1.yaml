          *   *Result:* **FAIL** (Too deterministic).

      *   **Case 3: Alarm Clock (Small/Modern).**
          *   *Analysis:* Alarm didn't go off -> Missed bus.
          *   *Critique:* Is it the *cause*? What if he stayed up too late? What if the bus was early?
          *   *Result:* **PASS** (as a proximate cause), but highlights the difference between *cause* and *explanation*. Actually, for a history essay, this is a bad analogy. Let's use Tambora instead, it fits the "History Club" vibe better.
          *   *Re-selection:* Let's use **Tambora (1815)**.
          *   *Analysis:* Eruption -> Year Without a Summer -> Crop Failure -> Unrest?
          *   *Critique:* Did it cause specific policy changes? Or just "it was cold"?
          *   *Result:* **PASS** (if linked to specific migration or policy), **FAIL** (if linked to general "misery"). Let's make it a **PASS** to show variety, but note the limitations.
          *   *Wait, I need a "No" the user won't like.* I already have the User's Essay as a "No". That works.

  5.  **Refining the Output:**
      *   *Tone:* Peer-to-peer, respectful but rigorous. No academic jargon without explanation.
      *   *Structure:*
