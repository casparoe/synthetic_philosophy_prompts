          *   *Critique:* Did *all* regions with labor scarcity end serfdom? (Eastern Europe "Second Serfdom" happened *after* the plague). This is the killer argument. The Swap Test fails here. If you swap Western Europe for Eastern Europe, same Plague, opposite outcome.
